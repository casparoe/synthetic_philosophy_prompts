answer: |-
  ## OFFICE OF MEMORY-HISTORY RECONCILIATION (OMHR)  
  CITIZEN INFORMATION LEAFLET (Rev. 8.3)

  **1. What is the purpose of the OMHR?**  
  The Office adjudicates discrepancies between Officially Archived Records (OARs) and Persistent Community Recollection (PCR) concerning events, locations, or entities within municipal boundaries. Our mandate is to determine which version (OAR or PCR) possesses sufficient standing to be recognized as the Authorized Municipal Narrative (AMN) for civic purposes.

  **2. How do I file a Discrepancy Petition (Form OMHR-7)?**  
  Forms are available at the Civic Archives kiosk (3rd floor, City Hall Annex) or downloadable from the City Portal (Section 14b: "Truth & Tidiness"). Submit the completed form, along with any supporting evidence bundles (see Question 5), in triplicate to the OMHR intake desk. A $15 non-refundable processing fee applies. Petitions concerning events occurring within the last 25 years require notarized witness affidavits (Form OMHR-7a).

  **3. What criteria does the OMHR use to decide?**  
  Decisions are based on rigorous application of established metrics:
  *   **Material Continuity Threshold (MCT):** Assesses the physical integrity and provenance chain of documentary evidence. A waterlogged ledger scores lower than a climate-controlled microfiche.
  *   **Consensus Persistence Index (CPI):** Measures the longevity, distribution, and emotional valence of the disputed PCR across verified community demographics. Annual surveys are conducted by the Office of Civic Sentiment.
  *   **Narrative Coherence Standard (NCS):** Evaluates the internal consistency and plausibility of both OAR and PCR claims within the broader context of established AMNs. Contradictions with settled AMNs are heavily weighted.

  **4. Can I appeal the OMHR's ruling?**  
  Yes. Appeals must be filed within 30 days of the initial determination notice (Form OMHR-12). Grounds for appeal are limited to: procedural error by OMHR staff, discovery of *newly surfaced* evidence not reasonably available during initial adjudication, or demonstrable miscalculation of MCT/CPI/NCS scores. Appeals are heard by the three-member Panel for Narrative Finality (appointed by the Mayor’s Office). The Panel’s decision is binding.

  **5. What constitutes "evidence"?**  
  For OARs: Physical documents, photographs, audio/visual recordings, or digital records held within City-controlled archives or presented by a verified custodian. **Crucially, a document only possesses standing if a living individual or recognized entity (e.g., Historical Society) physically holds it and attests to its chain of custody.** Found documents without a claimant lack standing. For PCR: Signed affidavits (Form OMHR-9), recordings of oral histories collected via OMHR-approved protocols, petitions demonstrating community consensus, or validated results from Civic Sentiment surveys.

  **6. Who counts as a "constituent" of a disputed fact?**  
  Only individuals or entities demonstrating a direct, material, or custodial link to the evidence itself (see Question 5), *not* necessarily to the event. The custodian of the 1927 sewer map is the constituent of *that map's contents*, regardless of personal involvement in the 1927 sewer project. The person holding Aunt Mabel's diary detailing the 1958 flood is the constituent of *those diary entries*.

  **7. Can you give examples of past rulings?**
  *   **Case 78-A (Record Prevailed):** PCR held that a bronze statue of Mayor Throckmorton stood in Victory Park from 1932-1945, depicting him holding a model zeppelin. OARs (park maintenance logs, budget allocations, contemporaneous photos) showed no such statue was ever commissioned or installed. OMHR Ruling: PCR failed MCT (no photographic evidence, zeppelin model anachronistic) and CPI (recollection limited to descendants of Throckmorton's political club; Civic Sentiment survey showed 82% unaware). OAR established as AMN. Victory Park plaque amended.
  *   **Case 92-C (Memory Prevailed):** OARs (newspaper microfiche, police blotter) recorded the annual Founders Day Parade occurring on June 12th, 1977. Persistent PCR insisted it was rained out and rescheduled to June 19th. OMHR Ruling: OARs scored low on MCT (microfiche reader malfunction noted in log; blotter entry ambiguous). PCR scored high CPI (consistent recollection across multiple veteran parade attendees, emotional attachment to "Rainy Year" lore). NCS slightly favored PCR (established pattern of weather-related rescheduling). PCR established as AMN. Official city history timeline adjusted.

  **8. What if the community remembers something that clearly couldn't happen?**  
  The OMHR evaluates all claims against the established criteria (MCT, CPI, NCS). Plausibility is a factor within the NCS, but is weighed alongside the strength of evidence and persistence of recollection. All claims undergo the same procedure. *(See illustrative cases 78-A and 92-C above. Note the consistent application of metrics.)*

  **9. What if different parts of the community remember the *same* event differently?**  
  The OMHR identifies the dominant PCR (highest CPI score) and adjudicates its claim against the relevant OAR. Competing PCRs lacking dominant consensus are noted as "Subsidiary Recollections" in the final determination report but do not form part of the AMN unless they meet the threshold independently at a later date.

  **10. Where can I find finalized AMNs?**  
  All AMNs are codified in the Municipal Narrative Register (MNR), available for public viewing at the Civic Archives or via the City Portal (Section 14b: "Truth & Tidiness" - Subsection: "Settled Accounts"). Superseded records/narratives are moved to the Provisional Discrepancy Archive, accessible by appointment only.

  **Office Hours:** Tues & Thurs, 9:30 AM - 12:30 PM, 1:30 PM - 4:00 PM.  
  **Contact:** omhr@yourcity.gov | (555) 238-REAL  
  *"Bringing Clarity to What Was, What Is Remembered, and What Officially Counts."*

  ---
  **^(1)OMHR Archivist's Note:** ^(While Case 78-A (zeppelin statue) and Case 92-C (parade date) appear distinct under standard review, internal audit logs show both scored nearly identically on the MCT/CPI/NCS matrices (78-A: MCT 0.2, CPI 0.3, NCS 0.1; 92-C: MCT 0.1, CPI 0.4, NCS 0.2; Threshold for Superseding OAR is cumulative score >0.5 with CPI >0.3). The determinative factor appears to have been the subjective weight given to "anachronism" (78-A) versus "established pattern" (92-C) within the NCS assessment. Further standardization of NCS sub-weights is recommended pending Panel review. - M. Finch, Sr. Archivist.)
