prompt: |-
  Every year I teach a graduate seminar that sits between metaphysics and the philosophy of science, and for several iterations now I have used the International Astronomical Union's August 2006 resolutions on the definition of a planet as a running case study. The facts are well enough known that I will not rehearse them: a body is to count as a planet only if it orbits the Sun, is massive enough for its own gravity to have made it nearly round, and has cleared the neighbourhood of its orbit; Pluto satisfies the first two conditions and fails the third; the definition is expressly confined to bodies orbiting the Sun and therefore says nothing about exoplanets; and the membership rejected the rival proposal that would have made the dwarf planets a subcategory of planets, which would have preserved Pluto and lengthened the list. Two smaller details matter for what I am about to ask, and my students reliably miss both. First, the definition names Mercury explicitly as a planet even though Mercury is not in hydrostatic equilibrium, so the second criterion is plainly not doing the work the definition advertises. Second, the affair replays an older one: Ceres was announced in 1801 as the missing planet, the tally of planets had reached twenty-three by the middle of the nineteenth century, and the community then reclassified the whole set as asteroids. What I want is not history but a philosophical analysis, run in both directions.

  Take the apparatus of verbal disputes and metaontology and ask what it makes of this. Does the quarrel between the dynamical and the geophysical camps look like a verbal dispute in the technical sense — the parties attaching different senses to a shared word, so that the disagreement dissolves once the senses are separated — or is it a case the standard taxonomy handles badly, given that both camps appear to mean the same thing by planet and are arguing about which criterion the word ought to carry? Is that dispute merely verbal, broadly verbal, or a normative disagreement about concept choice that the verbal/non-verbal contrast cannot capture? Bring to bear Carnap's contrast between questions asked within a framework and questions about which framework to adopt, Hirsch's quantifier variance (the thought that rival ontologies may simply be speaking different languages, neither more correct than the other), and Sider's insistence that our best theory can render such questions determinate, and say which of these accounts best fits what actually happened in Prague — and, more revealingly, which of them the episode embarrasses.

  Then run the analysis the other way. Metaontologists typically frame their problem around existence questions that no procedure could settle; here a committee settled a classificatory question by vote, and the vote carried costs — textbooks, museum exhibits, public indignation — which suggests that something was at stake that a purely verbal reading would have to explain away. Does the episode favour the view that these disputes are indeterminate and resolved by adopting a language, or the view that some classifications carve the world better than others and the vote was tracking that? Tell me, finally, what the case reveals about the limits of the metaontological framing itself, and name the kind of case — from the history of classification in some other science, or from ontology proper — that would best tell the competing positions apart. My students keep saying that the whole business is just semantics, and I want to be able to say precisely why that is both true and useless.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach a graduate seminar that bridges metaphysics and philosophy of science, using the IAU's 2006 Pluto decision as a case study. The main request is for a philosophical analysis using metaontological tools like verbal disputes, Carnap's frameworks, Hirsch's quantifier variance, and Sider's realism. The user also wants this analysis run in both directions: applying these frameworks to the IAU case and then seeing what the case reveals about the frameworks themselves. 

  First, I need to recall the key details of the IAU resolution. The three criteria: orbits the Sun, round by gravity, cleared orbit. Pluto fails the third. The user mentions two often-missed points: Mercury not being in hydrostatic equilibrium (so the roundness criterion isn't universally applied), and the historical parallel with Ceres and asteroids. These details are crucial because they show inconsistencies in the IAU's criteria and a pattern in astronomical classification.

  The user's explicit questions are about whether the dispute is verbal, which metaontological framework best fits the event, and what the case says about the limits of metaontology. But there's a deeper layer here. The students keep saying "it's just semantics," and the user wants to dismantle that oversimplification. So the real goal is to provide a nuanced analysis that shows why "just semantics" is both true and insufficient. 

  Starting with the verbal dispute aspect. The dynamical and geophysical camps use "planet" with the same core meaning—large, round celestial body—but disagree on necessary conditions. This isn't purely verbal because both sides agree on facts but prioritize different criteria. The disagreement is normative: what should the term include? This challenges the standard taxonomy of verbal disputes. 

  Applying Carnap's framework, the IAU vote is an external question about which linguistic framework to adopt. The committee chose a framework that prioritizes dynamical dominance for pragmatic reasons like keeping the planet list manageable. Hirsch's quantifier variance could see this as a shift in language, but the passionate backlash suggests it's not just about terminology. People felt Pluto was demoted, not just redefined, which Hirsch might struggle to explain. Sider's realism would argue the vote aimed for objective natural kinds, but the Mercury inconsistency undermines that. The resolution wasn't tracking a pre-existing structure perfectly due to ad hoc compromises. 

  Running the analysis the other way: the IAU case shows that classificatory disputes involve both semantic choices and objective factors. The costs (textbooks, public outcry) indicate something beyond semantics—cultural attachment, pedagogical concerns. This suggests metaontology's focus on existence questions is too narrow. Classification disputes involve values, pragmatics, and social factors that pure ontology overlooks. 

  For a case to test competing positions, biological taxonomy is perfect. The reclassification of Pluto vs. the redefinition of "fish" in cladistics. The former had cultural weight; the latter was technical. Or species concepts: if a framework can't explain why lumping birds with reptiles is uncontroversial but demoting Pluto isn't, it's inadequate. 

  Finally, why "just semantics" is true but useless. It's semantic because it's about definitions, but useless because it ignores the stakes: values, natural kinds, coherence, and real-world consequences. The user needs this to push students beyond superficial takes. 

  I should ensure each philosophical framework is clearly applied, highlight the Mercury and Ceres points as evidence, and emphasize the metaontological limitations revealed. The conclusion must articulate why the case challenges the simplicity of "just semantics" and what that teaches about classification disputes in general.
answer: |-
  Your case study brilliantly exposes the fault lines in metaontological debates. Let's dissect it both ways, leveraging the tools you mention while confronting their limitations.

  ### I. Applying Metaontological Frameworks to the IAU Dispute

  1.  **Verbal Dispute? (Chalmers, Hirsch-esque):**
      *   **Superficial Fit:** It appears verbal. The "dynamical" camp (clearing orbit) and "geophysical" camp (roundness) seem to attach different meanings to "planet." Separating "planet-dynamical" (P-D) and "planet-geophysical" (P-G) resolves the *apparent* contradiction: Pluto is P-G but not P-D.
      *   **Problems:**
          *   **Shared Core Meaning:** Both camps likely agree on a core prototype (large, dominant, round body orbiting a star). The dispute centers on *which necessary and sufficient conditions* flow from this core concept or *how strictly* to apply it. It's about the *extension* of a largely shared *intension*.
          *   **Normative Stakes:** The disagreement isn't purely semantic indifference ("Let's call P-G 'worlds' and P-D 'planets'"). The geophysical camp argues P-G *is the scientifically significant category* (shaping, geology, potential habitability). The dynamical camp argues P-D *is the historically and dynamically significant category*. This is a **normative disagreement about concept choice** based on scientific utility, history, and coherence within the solar system taxonomy. The "verbal/non-verbal" dichotomy struggles here; it's **broadly verbal** but **substantively normative**.
          *   **Mercury's Role:** The fact Mercury (not in perfect hydrostatic equilibrium) is explicitly named a planet *despite* the geophysical criterion highlights that the adopted definition wasn't purely about applying criteria neutrally. It involved **pragmatic negotiation** and **boundary policing** to preserve the traditional planets while excluding Pluto/KBOs. This undermines the "just different senses" reading; the criteria themselves were bent for a desired outcome.

  2.  **Carnap's Framework (Internal/External Questions):**
      *   **The Vote as External:** The IAU vote perfectly exemplifies settling an *external question* – choosing a linguistic framework ("Shall we adopt Framework F-D (dynamical) or Framework F-G (geophysical) for the term 'planet' in our scientific discourse?").
      *   **The Costs Explained:** The "costs" (textbooks, exhibits, outrage) stem from the *practical consequences* of adopting a new framework. People invested meaning and identity within the old framework (F-G-inclusive). The vote wasn't about a discovery *within* an agreed framework (internal question) but about *which framework to use*.
      *   **Fit:** This fits exceptionally well. The committee explicitly chose F-D for pragmatic/systematic reasons (manageable list, dynamical coherence), rejecting F-G as too broad. The historical Ceres parallel reinforces this: adopting the "asteroid" framework solved a practical problem of proliferation.

  3.  **Hirsch's Quantifier Variance:**
      *   **Potential Fit:** One could argue the pre-2006 and post-2006 astronomical communities simply speak different languages with different meanings for "planet" and different ontological commitments ("There are 8 planets" vs. "There were 9 planets"). Neither language is more "correct" in describing the underlying reality of celestial bodies; they just carve it differently.
      *   **Problems:**
          *   **The Stakes:** The intense debate, the strategic naming of Mercury, and the significant costs suggest participants believed they were arguing about *the correct way to describe a shared reality*, not just adopting arbitrary conventions. The outrage wasn't about learning a new word but about Pluto being "demoted" – implying a belief in a more objective status.
          *   **Scientific Progress?** Quantifier variance struggles to explain why one classification might be *scientifically preferable*. The dynamical definition arguably groups bodies with similar formation histories and dynamical roles (giants, terrestrials vs. KBOs). The geophysical definition groups bodies sharing physical processes (roundness -> geology). Astronomers argued F-D offered *better scientific utility*. Hirsch's framework risks making this preference inscrutable.

  4.  **Sider's Metaphysical Realism (Joint Carving):**
      *   **Potential Fit:** Sider would argue the dispute *should* be settled by asking which category – P-D or P-G – better "carves nature at its joints," aligning with the fundamental structure of reality revealed by our best scientific theories (astrophysics, planetary science).
      *   **Problems:**
          *   **The Vote vs. The World:** The committee settled it by vote based on pragmatic concerns (list length, historical continuity for the traditional 8) and *ad hoc* fixes (Mercury), not a dispassionate assessment of natural joints. The "clearing" criterion itself is arguably arbitrary (how clear? over what timescale?).
          *   **Mercury Again:** Explicitly naming Mercury exposes the definition as a *stipulation* overriding the supposedly joint-carving criterion (hydrostatic equilibrium). If P-D were the true joint-carver, Mercury's status should be contingent on meeting the criterion, not stipulated.
          *   **Which Joints?** Does "dynamical dominance" or "geophysical complexity" better reflect fundamental cosmic structure? Both seem significant but capture different aspects. Sider offers no clear metric for adjudicating this. The vote outcome doesn't transparently track a single, obvious natural kind.

  **Which Framework Fits Best? Which is Embarrassed?**
  *   **Best Fit: Carnap.** The vote *is* paradigmatically an external framework choice driven by pragmatic and systematic considerations within the scientific community. The costs are the friction of framework change.
  *   **Most Embarrassed: Sider.** The messy reality of the vote, the *ad hoc* inclusion of Mercury despite the criterion, and the focus on manageability over a pure "joint-carving" ideal clash with Sider's picture of ontology being settled by our best theory pointing to fundamental structure. The episode suggests classificatory choices involve more than just reading nature's joints.

  ### II. What the IAU Case Reveals About Metaontology

  1.  **Indeterminacy vs. Objective Carving:**
      *   The episode strongly favors the **indeterminacy + adoption** view (Carnap, Hirsch). A specific linguistic framework was *chosen* (F-D). This choice resolved the indeterminacy inherent in the vague pre-existing concept ("planet").
      *   However, it doesn't fully support radical **indeterminacy/anything-goes (Hirsch's strongest variance)**. The intense debate and justifications reveal scientists believe some classifications are *objectively better* than others for scientific purposes (explanatory power, predictive utility, coherence). While the *specific choice* of F-D involved pragmatism, the *rejection* of a vastly different classification (e.g., "planets are blue things") wasn't arbitrary. The world *constrains* viable frameworks, even if it doesn't *dictate* a single one. The vote wasn't tracking a *single pre-existing joint* but seeking a *useful and coherent categorization* constrained by reality.

  2.  **Limits of the Metaontological Framing:**
      *   **Beyond Existence/Quantification:** Metaontology often fixates on "Do Xs exist?" (Numbers? Tables? Planets?). The IAU case is primarily **classificatory**: "Which *category* does Pluto belong to *within* an agreed domain (solar system bodies)?" The core question wasn't "Do planets exist?" but "Is Pluto a planet?" This shifts the focus from pure existence to **categorization, kind-membership, and conceptual boundaries**.
      *   **The Social & Pragmatic Dimension:** The episode highlights dimensions often marginalized in pure metaontology:
          *   **Social Negotiation:** Science is a social enterprise. Frameworks are chosen by communities through processes involving debate, persuasion, and voting.
          *   **Pragmatic Costs/Benefits:** Framework choices have real-world consequences (textbooks, public understanding, funding allocation? museum displays). Pure "joint carving" ignores this.
          *   **Values & Interests:** Considerations like pedagogical manageability, historical continuity, public engagement, and even disciplinary identity (planetary science vs. dynamics) played a role alongside purely epistemic goals.
          *   **Conceptual Drift & History:** The Ceres parallel shows this isn't new. Classifications evolve as knowledge grows and priorities shift, revealing "natural kinds" as often historically contingent practical kinds.

  3.  **The Ideal Test Case:** To starkly contrast the positions (especially Sider vs. Hirsch/Carnap), a case involving **existence claims seemingly settled by framework choice within science** would be best:
      *   **Case 1: Phlogiston vs. Oxygen.** Did phlogiston *cease to exist* when Lavoisier's framework (oxygen, oxidation) won? (Sider: Yes, best theory shows it doesn't carve joints. Hirsch/Carnap: The framework changed; 'phlogiston' no longer refers within the new language; existence claims are framework-relative).
      *   **Case 2: Species Lumping/Splitting in Cladistics.** When two species are lumped into one based on genetic evidence, did one species "go extinct"? Or was it never a real joint? (Similar dynamics to above).
      *   **Case 3: The "Demotion" of Pluto vs. the "Demotion" of "Fish".** Cladistics redefines "fish" as paraphyletic (excluding tetrapods). Why was there no public outcry? This highlights the *social/pragmatic* dimension beyond ontology: Pluto had unique cultural capital, while "fish" as a culinary/folk category remained intact alongside the technical cladistic category. This underscores that the *stakes* in the Pluto debate weren't purely ontological.

  ### Why "Just Semantics" is True and Useless

  *   **True:** At its core, it *is* about the meaning, extension, and criteria for the word "planet." Different definitions yield different results. The dispute was *resolved* by stipulating a new definition.
  *   **Useless:** This glib summary ignores everything that *matters*:
      *   **It's Normative:** *Why* choose one definition over another? What *values* (scientific utility, coherence, manageability, historical continuity, public understanding) are served?
      *   **It Involves Natural Kinds (Aspirationally):** Scientists argue their preferred definition better captures a *scientifically significant grouping* in nature (dynamical role vs. geophysical properties).
      *   **It Has Real Consequences:** Costs are incurred; public understanding shifts; pedagogical materials change; the cultural status of an object changes.
      *   **It's About Conceptual Authority:** Who gets to define scientific categories and why?
      *   **It's Not *Merely* Arbitrary:** The choice is constrained by empirical facts about the objects and the goals of the scientific discipline. "Just semantics" implies indifference, which is profoundly inaccurate.

  The IAU case reveals classificatory disputes in science as complex negotiations where semantics, metaphysics (aspirations towards natural kinds), epistemology (scientific utility), pragmatics, social dynamics, and even cultural values intertwine. Metaontology provides useful tools (Carnap's framework is particularly apt), but focusing *solely* on existence questions or quantifier variance risks missing the rich, multifaceted reality of how scientific categories are made, unmade, and contested. The Ceres precedent reminds us this is the rule, not the exception. Your students need to see that "just semantics" is the starting point for the interesting questions, not the end of them.
