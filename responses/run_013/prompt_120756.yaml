  We are drafting a joint statement between two camps: Universal-Prior Realists (Realists) and Finite-Modeler Pragmatists (Pragmatists). The goal is to have a constructive document that both can sign after adversarial collaboration.

  The document will have three main parts:

  1. **Agreements**: A numbered list of claims both camps accept, stated precisely.
  2. **Disagreements**: A table with columns for: 
     - Sub-question
     - Realist formulation
     - Pragmatist formulation
     - Crux
     - Test/case/argument that bears on the crux
     - Realist prediction
     - Pragmatist prediction
  3. **Closing section**: Separating genuine disagreements from verbal ones, and clarifying ambiguities.

  Additionally, we include two concrete cases:

  A. **The Two-Encoding Test** (as described, using pi and two universal machines)
  B. **A second case** that isolates the finite-horizon issue without pi.

  We write the entire document in a neutral, precise, and fair manner.

  ---

  **Joint Statement on Simplicity, Induction, and the Universal Prior**

  **Preamble**

  We, the undersigned Universal-Prior Realists and Finite-Modeler Pragmatists, have engaged in a good-faith adversarial collaboration to clarify our agreements and disagreements on the foundations of inductive inference. We agree on the mathematical formalism of Solomonoff induction and Kolmogorov complexity but differ on their epistemic significance for bounded agents. This document records our common ground and the points of contention, with the aim of isolating the core issues and identifying empirical or mathematical tests that could resolve them.

  **Part 1: Agreements**

  Both camps accept the following claims:

  1. **Formal Definitions**: 
     - Kolmogorov complexity (K_U) of a finite binary string x, relative to a universal prefix Turing machine U, is the length of the shortest prefix-free program on U that outputs x. 
     - The Solomonoff prior (M_U) for a string x is defined as the sum over all prefix-free programs for x of 2^{-length(p)}.

  2. **Invariance Theorem**: 
     - For any two universal prefix Turing machines U1 and U2, the Kolmogorov complexities K_{U1}(x) and K_{U2}(x) differ by at most a constant c (which depends on U1 and U2 but not on x). 
     - Similarly, the logarithms of the Solomonoff priors (log M_{U1}(x) and log M_{U2}(x)) differ by at most a constant c' (which depends on U1 and U2 but not on x).

  3. **Asymptotic Agreement**:
     - In the limit as the length of the string x goes to infinity, the constants c and c' become negligible in relative terms (i.e., the ratio of complexities or priors approaches 1). 

  4. **Occam's Razor as Heuristic**:
     - For any fixed hypothesis class and encoding, shorter descriptions (within that class) are often practically preferable for model selection, especially when data is limited and computational resources are bounded.

  5. **Decisive Arguments**:
     - A decisive argument against the Realist position would be a demonstration that the choice of universal machine can lead to arbitrarily large differences in predictive probabilities (or posterior probabilities) for some finite data sequences, even after accounting for the invariance theorem.
     - A decisive argument against the Pragmatist position would be a demonstration that, for any finite data sequence, the predictive differences due to the choice of universal machine are bounded by a constant that is negligible in practice, or that there exists a canonical choice of universal machine that minimizes such differences.

  **Part 2: Disagreements**

  The table below outlines key disagreements. Each row addresses a specific sub-question. The crux is the core issue that divides the camps. The test/case is one that both sides agree is relevant. The predictions are what each camp expects to occur in the test.

  | Sub-question | Realist Formulation | Pragmatist Formulation | Crux | Test/Case/Argument | Realist Prediction | Pragmatist Prediction |
  |--------------|---------------------|------------------------|------|-------------------|-------------------|----------------------|
  | Epistemic status of the universal prior | The Solomonoff prior M_U, for a fixed universal machine U, is the canonical rational prior for inductive inference; it captures a language-independent notion of simplicity. | The Solomonoff prior is one among many possible priors; it is useful for some purposes but not rationally required. Simplicity is relative to a chosen encoding. | Whether the invariance theorem makes the choice of universal machine epistemically negligible for finite data. | **Two-Encoding Test** (described below) | D(n) (difference in log odds) is bounded by a constant independent of n and the machines. | D(n) can be made arbitrarily large at every finite n by choosing machines with large enough overhead. |
  | Normative force of Occam's razor | Occam's razor is a theorem: the prior M_U assigns higher probability to simpler hypotheses, and this is necessary for optimal prediction. | Occam's razor is a heuristic: it is a practical norm for model selection given resource constraints, but it is not a necessary condition for rational inference. | Whether the Solomonoff prior is the unique rational prior or one among many. | **Second Case** (described below) | The case does not challenge the normative force because the constant overhead is negligible. | The case shows that without a fixed encoding, the notion of simplicity is context-dependent. |
  | Applicability to bounded agents | The universal prior provides a normative ideal for bounded agents; practical methods should approximate it. | Bounded agents must use task-specific heuristics; the universal prior is computationally unattainable and not a useful ideal. | Whether the asymptotic optimality of Solomonoff induction is relevant for bounded agents. | Any real-world model selection task with fixed data and bounded resources. | Methods that better approximate M_U will yield better predictions. | Methods that incorporate domain-specific knowledge and computational constraints will outperform Solomonoff-based methods. |

  **The Two-Encoding Test**

  *Setup*:
  - Consider two universal machines: 
    - U1: has a built-in primitive for generating the binary expansion of pi (so that the program for the n-bit prefix of pi is short, say length O(1)).
    - U2: lacks such a primitive but can simulate U1 with a fixed overhead c (so that the program for the n-bit prefix of pi on U2 has length at most K_{U1}(x) + c, but typically longer for small n because c might be large).
  - We observe the first n bits of pi (which we call x). 
  - We wish to predict the next bit (the (n+1)-th bit of pi).
  - Let M_{U1}(next bit | x) and M_{U2}(next bit | x) be the predictive probabilities under the Solomonoff priors of U1 and U2, respectively.
  - Define D(n) = | log [M_{U1}(next bit | x) / (1 - M_{U1}(next bit | x))] - log [M_{U2}(next bit | x) / (1 - M_{U2}(next bit | x))] |, the absolute difference in log odds.

  *Question*: How does D(n) behave as n grows? In particular, can we make D(n) arbitrarily large at every finite n by choosing U2 with a large overhead (and hence a large c)?

  *Realist Prediction*: 
  D(n) is bounded by a constant that depends on the choice of U1 and U2 but not on n. Therefore, for any fixed pair of machines, D(n) does not grow with n. Moreover, the Realists hold that the constant is small enough to be negligible in practice.

  *Pragmatist Prediction*:
  By choosing a universal machine U2 that has a very large overhead for simulating U1 (i.e., a very large c), we can make D(n) arbitrarily large at every finite n. The constant from the invariance theorem does not prevent this because it is machine-dependent and can be large.

  *Falsification*:
  - For Realists: A proof that for any constant C, there exist two universal machines and an n such that D(n) > C (at a fixed n) would falsify their position. Alternatively, an explicit construction of two machines and an n where D(n) is arbitrarily large would suffice.
  - For Pragmatists: A proof that for any two universal machines, D(n) is bounded by a fixed constant (independent of n) would falsify their position.

  **Second Case: The Parity Encoding**

  *Setup*:
  - Consider a small data set: the string "1111". 
  - Hypothesis class 1 (H1): The data is generated by a process that always outputs 1. This is encoded by a short program (length L1) in a machine that has a "constant 1" primitive.
  - Hypothesis class 2 (H2): The data is generated by a process that outputs the parity of the number of particles in a box. This is encoded by a short program (length L2) in a machine that has a "parity" primitive. Without that primitive, the program would be long (say L2' >> L1). 
  - The likelihood of the data under both hypotheses is 1 (if the data is all ones for H1, and if the parity of the particle count happens to be 1 for each bit for H2). 
  - We compare two Solomonoff priors: one using a machine with the "constant 1" primitive (U_const) and one with the "parity" primitive (U_parity). 
  - Under U_const, the hypothesis H1 has high prior (short code) and H2 has low prior (long code). 
  - Under U_parity, the hypothesis H2 has high prior (short code) and H1 has low prior (long code, because without a constant primitive, one might have to output 1s by a more complex program).

  *Which camp does this favor?* 
  This case favors the Pragmatists because it shows that the prior (and hence the notion of simplicity) is relative to the encoding. The same data can be "simple" under one encoding and "complex" under another, and both encodings are natural in their respective contexts. The Realists must explain why one encoding should be privileged. 

  *Realist Reply*:
  The Realists would argue that the invariance theorem ensures that the prior cannot change arbitrarily: the log prior difference between the two hypotheses is bounded by a constant (the simulation overhead). They would also note that in the long run, if the true process is H1 (always 1), then U_const will eventually dominate U_parity because the constant overhead for simulating the parity machine would be amortized. However, for finite data, they acknowledge that the prior can vary but within the bounds of the invariance theorem.

  **Part 3: Closing Section**

  We agree that the dispute is not merely verbal. The key term "language-independence" is ambiguous:

  - **Realist disambiguation**: The invariance theorem guarantees that the Kolmogorov complexity and the Solomonoff prior are language-independent up to a constant. This constant is negligible in the asymptotic limit and in practice for sufficiently long strings. Therefore, for the purposes of normative theory, we can speak of a privileged notion of simplicity.

  - **Pragmatist disambiguation**: The constant in the invariance theorem is machine-dependent and can be arbitrarily large for any fixed finite data. Therefore, for bounded agents, simplicity is always relative to a chosen encoding and hypothesis class.

  We also note that the term "prior" is used differently:

  - **Realist**: The Solomonoff prior is the unique rational prior because of its optimality properties (e.g., dominance and convergence).

  - **Pragmatist**: A prior is a tool for inference and must be chosen in light of the agent's knowledge, goals, and computational constraints.

  The genuine disagreements are:

  1. Whether the constants in the invariance theorem are negligible for finite data in practice (i.e., whether they are small enough to be ignored by bounded agents).
  2. Whether the Solomonoff prior is the unique rational prior or one among many pragmatically chosen priors.
  3. Whether Occam's razor is a theorem (hence a necessary condition for rationality) or a heuristic.

  We commit to resolving these disagreements through further investigation, including mathematical analysis of cases like the Two-Encoding Test and empirical study of model selection in finite settings.

  Signed,

  [Representatives of the Universal-Prior Realists]
  [Representatives of the Finite-Modeler Pragmatists]

