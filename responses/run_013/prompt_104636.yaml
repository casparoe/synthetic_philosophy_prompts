prompt: |-
  So I'm in this little philosophy-of-math reading group and we keep going in circles: everyone grants that any story about mathematical truth has to do two things at once -- give mathematical sentences the same kind of meaning as ordinary empirical sentences, and still let us know about the objects those sentences are apparently about -- and everyone also seems to grant that nothing actually does both. Before we read another -ism I want the spec written down properly. So: give me the desiderata that any adequate account of mathematical truth (and of mathematical reference, since those come apart) has to satisfy -- the case or phenomenon behind each one, not just the label -- and then tell me which are genuinely non-negotiable and which are just the prejudices of one camp wearing the costume of a requirement. I specifically want the ones that keep getting smuggled in without argument: that the account has to let math be necessary rather than contingent; that it has to explain why any of this applies to the physical world; that it has to leave room for a working mathematician to treat some open question as genuinely unsettled rather than as meaningless; that it has to not make mathematical knowledge a special case that breaks the account's own theory of how we know anything else; and that it has to say what's going on when two people use rival constructions of the same thing that give all the same arithmetic but disagree on a structural fact (like whether 2 is a member of 4) -- I think that last one quietly does a lot of work and nobody ever puts it on the list.

  The part I actually care about is the tension. Flag any pair or triple on the list you think can't be had together, and say which one you'd sacrifice and why. I've been told the whole dilemma is just semantics pulling against epistemology, but that feels too neat to me and I suspect some of the other requirements are quietly incompatible too -- necessity versus the applicability story, or determinacy versus a deflationary account of what "true" is even doing in arithmetic, or the rival-constructions case versus any view that says the natural numbers are a particular object. And if there's one requirement on the list that by itself knocks out most of the popular positions, tell me which one it is, because then thats the thing we should actually be arguing about on Thursday. Don't waste the space scoring platonism/nominalism/structuralism one by one -- I can look up who says what; I want the criteria themselves.
reasoning: |-
  Okay, let me tackle this user's query. They're in a philosophy of math reading group stuck in circles. The core issue seems to be that every account of mathematical truth either fails to give math the same meaning as empirical sentences or fails to explain how we access mathematical objects. The user wants a clear list of desiderata, highlighting tensions between them, and to identify which are non-negotiable versus optional.

  First, I need to unpack the explicit requirements mentioned. The user lists several: math must be necessary, applicable to the physical world, allow unsettled questions without meaninglessness, align with general epistemology, and handle rival constructions. There might be implicit ones too, like determinacy of truth and epistemic access.

  I recall that necessity is a big one. If math is contingent, that undermines its universality. But combining necessity with applicability is tricky—how can necessary truths apply to a contingent world? Then there's semantic uniformity: math and empirical statements should have the same kind of meaning. But if math is about abstract objects, how do we refer to them like we do physical objects?

  Epistemic uniformity is another. If knowing math requires a special faculty, that's a problem. But if we reduce it to logic or conventions, does that make it trivial? The unsettled questions point is crucial—math must have objective truths that aren't all known, unlike in some formalist views where truth is just provability.

  The rival constructions issue is subtle. If two systems agree on arithmetic but disagree on whether 2 is a member of 4, what does that say about mathematical objects? Structuralists might say only structure matters, but then reference to objects becomes problematic.

  Now, tensions. Necessity vs. applicability seems a major conflict. If math is necessary, how does it apply contingently? Sacrificing direct applicability for structural fit might work. Semantic uniformity vs. epistemic access is another: if math sentences refer to abstract objects, how do we know them? Sacrificing direct reference for structuralism or formalism could help here.

  Determinacy vs. deflationism: if truth is just provability, some statements might be indeterminate, but that conflicts with the intuition that math is fully determinate. Sacrificing global determinacy might be necessary, as per Gödel.

  I think the rival constructions point is the sleeper issue. If two systems are structurally identical but disagree on foundational facts, it challenges object-based views. Structuralism handles this by dismissing internal properties, but then what are we referring to? This might be the key tension that forces a choice between objects and structures.

  The user wants to know which requirement is most contentious. Probably the combination of referential robustness and semantic uniformity. If math refers to objects, but those objects can't be accessed, that's a problem. Sacrificing robust reference for structuralism or formalism might resolve this, but at the cost of making reference thin.

  In summary, the main tensions are between necessity and applicability, semantic uniformity and epistemic access, and referential robustness versus the rival constructions issue. The rival constructions problem might be the hidden deal-breaker for object-based views, pushing towards structuralism but at the cost of reference. Highlighting these tensions should help the group focus their debate.
answer: |-
  Here's a breakdown of the desiderata for an account of mathematical truth and reference, structured as requested: the phenomenon behind each, their negotiability, key tensions, and the "sleeper" requirement that causes the most trouble.

  ---

  ### **I. Core Desiderata: The Non-Negotiables**
  These arise from uncontroversial features of mathematical practice and its integration with broader cognition/language.

  1.  **Semantic Uniformity (Meaning)**
      *   **Phenomenon:** We *use* mathematical sentences ("2 + 2 = 4", "There are infinitely many primes") identically to how we use empirical sentences ("The cat is on the mat") in reasoning, assertion, denial, embedding in conditionals, etc. We treat them as having truth values and propositional content.
      *   **Non-Negotiable? Yes.** Any account making mathematical discourse systematically non-truth-apt or non-propositional renders mathematical practice unintelligible or radically revisionary. This is about linguistic behavior, not metaphysics.

  2.  **Determinacy of Truth**
      *   **Phenomenon:** We treat well-formed mathematical questions (e.g., Goldbach's Conjecture, the Continuum Hypothesis relative to ZFC) as having a definite answer *before* we know it or can prove it. We don't treat them as meaningless or indeterminate *solely* because they are unsettled.
      *   **Non-Negotiable? Largely Yes.** Denying this (e.g., strict formalism equating truth with proof) clashes profoundly with mathematical experience and the objectivity of mathematical inquiry. (Negotiability might arise only for *highly* abstract questions beyond any conceivable axiomatization).

  3.  **Epistemic Uniformity (Knowledge)**
      *   **Phenomenon:** Our knowledge of basic mathematics feels continuous with other forms of rational knowledge (logic, conceptual analysis, perhaps pattern recognition). It doesn't feel like we invoke a mysterious, unique faculty accessible only to mathematicians.
      *   **Non-Negotiable? Yes.** Postulating radically unique, inaccessible epistemic mechanisms for mathematics alone makes mathematical knowledge inexplicable and potentially unjustifiable. It must fit *some* recognizable epistemological category (reason, intuition, convention, etc.), even if refined.

  4.  **Objectivity / Mind-Independence**
      *   **Phenomenon:** Mathematical truths seem *discovered*, not invented. We argue about them, make mistakes, and are surprised by results. We don't feel we can make "2 + 2 = 5" true by changing our minds or social conventions.
      *   **Non-Negotiable? Yes.** While *how* this objectivity is grounded is negotiable (Platonic objects, logical structure, conceptual constraints), denying objectivity itself undermines the entire epistemic and argumentative practice of mathematics.

  ---

  ### **II. Common Desiderata: Often Assumed, Sometimes Negotiable**
  These are frequently treated as requirements but have more room for debate or reinterpretation.

  5.  **Necessity**
      *   **Phenomenon:** Mathematical truths seem true in all possible circumstances. We can't conceive of a world where 2 + 2 = 4 is false, unlike contingent empirical truths.
      *   **Negotiability: High.** While strong, necessity *can* be reinterpreted. Conventionalism might see it as linguistic necessity; fictionalism might deny it outright; some empiricist views (e.g., Quinean holism) ground it in its central role in our web of belief, making it *practically* but not metaphysically necessary. Sacrificing robust metaphysical necessity is possible for some accounts.

  6.  **Applicability / "Unreasonable Effectiveness"**
      *   **Phenomenon:** Mathematics consistently and successfully describes, predicts, and structures our understanding of the contingent physical world.
      *   **Negotiability: Moderate.** An account *must* address applicability, but *how* it does so varies greatly. It *doesn't* necessarily require math to *directly describe* physical objects (e.g., structuralism explains fit; formalism sees it as useful modeling). A purely intra-mathematical account that ignores applicability is inadequate, but the explanation needn't make math *about* the physical world directly.

  7.  **Referential Robustness ("Aboutness")**
      *   **Phenomenon:** Mathematical language *appears* to refer to objects (numbers, sets, functions) and ascribe properties to them. We say "7 is prime," not just "The sentence '7 is prime' is derivable."
      *   **Negotiability: High.** This is the core battleground. Formalist/Nominalist accounts (e.g., fictionalism, deductivism) explicitly *deny* robust reference, treating it as a useful fiction or a manner of speaking. Structuralism reinterprets reference as reference to positions in structures. Only robust Platonism takes apparent reference at face value. *Semantic Uniformity* (that we *use* the language referentially) is non-negotiable; *whether that reference succeeds to mind-independent abstracta* is highly negotiable.

  8.  **Epistemic Access**
      *   **Phenomenon:** We *do* gain knowledge of mathematical truths. How is this possible, especially if the objects are abstract, non-spatiotemporal, and causally inert?
      *   **Negotiability: Moderate.** Access *must* be explained, but the nature of the explanation varies. Platonists need a story (intuition, abstraction); nominalists often ground it in linguistic/conventional knowledge or logic; structuralists might appeal to pattern recognition. The *challenge* is non-negotiable; the *solution* is where theories diverge drastically.

  ---

  ### **III. The Sleeper Requirement: Rival Constructions (Your Key Insight)**
  9.  **Referential Indeterminacy / Structural Equivalence**
      *   **Phenomenon:** We can construct different set-theoretic universes (e.g., Zermelo vs. von Neumann ordinals) where arithmetic truths (like "2 + 2 = 4") are identical, but answers to questions like "Is 2 ∈ 4?" differ. Both constructions work perfectly well mathematically. What, then, *are* the natural numbers "really"? Does "2" refer to something specific?
      *   **Negotiability: Low (as a phenomenon), High (for its implications).** The phenomenon itself is a mathematical fact. Any adequate theory *must* account for it. However, *how* it accounts for it is crucial and deeply revealing:
          *   **Object-Based Views (Platonism):** Face a major problem. If numbers are unique abstract objects, which construction gets "2" *right*? This seems arbitrary. Sacrificing unique reference or embracing a form of structuralism is often necessary.
          *   **Structuralism:** Thrives here. It argues that *only* the relational structure matters (successor, addition, etc.). The internal set-theoretic constitution of "2" and "4" is irrelevant. "2 ∈ 4" isn't a question *about the natural numbers themselves* but about a particular representation. Reference is to a position in *the* natural number structure.
          *   **Formalism/Nominalism:** Also handles it easily. The different constructions are just different formal games. Reference is not literal; truth is relative to the system.
      *   **Why it's a Sleeper:** This single phenomenon powerfully challenges naive Platonism ("numbers are *these* objects") and forces accounts to clarify what mathematical language is *fundamentally* about (unique objects? structures? rules? sentences?). It highlights the tension between *Referential Robustness* and *Structural Equivalence*. **This is the requirement that often quietly knocks out robust object-based Platonism.**

  ---

  ### **IV. Key Tensions & What to Sacrifice**
  Here's where the rubber meets the road. Satisfying all simultaneously seems impossible. Different theories resolve different tensions by sacrificing different desiderata.

  1.  **Necessity + Applicability vs. Contingency**
      *   **Tension:** How can necessary truths (math) apply to a contingent world? Why *this* math and not another? If math is necessary, its applicability seems miraculous. If math is contingent (e.g., based on human cognition or utility), its necessity and apparent objectivity are threatened.
      *   **Sacrifice Often Chosen:** Sacrifice *robust metaphysical Necessity* (e.g., Quine: math is necessary *within* our best scientific theory; Conventionalism: it's necessary by linguistic rules; Fictionalism: it's not true at all). Alternatively, weaken the *directness* of Applicability (e.g., Structuralism: math provides abstract patterns the world *might* instantiate).

  2.  **Semantic Uniformity + Referential Robustness vs. Epistemic Access**
      *   **Tension:** If math sentences are truth-apt and genuinely refer to abstract objects (like empirical sentences refer to concrete objects), how do we *know* anything about these causally inert entities? Our standard epistemology (causal, perceptual) fails.
      *   **Sacrifice Often Chosen:** Sacrifice *Referential Robustness*. This is the core move of Nominalism/Formalism/Fictionalism (deny abstract objects exist, so no reference problem) or Structuralism (reference is not to unique objects but to structural roles). Platonists sacrifice *Epistemic Uniformity* by positing rational intuition or abstractionist faculties.

  3.  **Determinacy of Truth vs. Deflationism/Epistemic Constraints**
      *   **Tension:** If mathematical truth is radically independent of our proof capabilities (Determinacy), how can it be grounded in anything accessible (e.g., conventions, constructions, mental acts)? If truth is equated with provability (an epistemic notion), Gödel's incompleteness theorems show Determinacy fails for sufficiently rich systems.
      *   **Sacrifice Often Chosen:** Sacrifice *global Determinacy*. Moderate Platonism/Realism accepts Gödelian incompleteness: some truths are unknowable in principle. Strict Formalists/Deductivists sacrifice Determinacy for undecidable sentences. Intuitionists sacrifice classical logic and bivalence to preserve an epistemic notion of truth (truth = proof).

  4.  **Referential Robustness vs. Referential Indeterminacy (Rival Constructions)**
      *   **Tension:** If mathematical terms refer robustly to unique objects, how can there be multiple, equally good, but incompatible set-theoretic constructions of the same mathematical domain (like natural numbers)? Which one gets the reference "right"?
      *   **Sacrifice Always Chosen:** Sacrifice *Referential Robustness* in the naive object-based sense. **This is the sleeper tension that forces a major choice.** Structuralism sacrifices unique objects for structures. Formalism/Fictionalism sacrifices literal reference entirely. Robust Platonism struggles here, often needing to posit a "privileged" universe or downplay the significance of foundational questions like "Is 2 ∈ 4?" as not truly about *numbers*.

  ---

  ### **V. The Biggest Roadblock: The Referential Trilemma**
  The most persistent tension, often the core of the "circles" you describe, involves **Semantic Uniformity**, **Epistemic Access**, and **(naive) Referential Robustness**:

  1.  **Semantic Uniformity:** Math language *functions* referentially and truth-conditionally like empirical language.
  2.  **Epistemic Access:** We gain knowledge of math truths.
  3.  **Referential Robustness:** Math terms *succeed* in referring to mind-independent abstract objects.

  **The Trilemma:** You can robustly satisfy any two, but not all three without significant cost or mystery.

  *   **A. Semantic Uniformity + Referential Robustness:** Leads to Platonism. **Cost:** Epistemic Access becomes deeply problematic ("Benacerraf's Problem"). How do we access the abstract realm? Requires positing special faculties, risking Epistemic *Non*-Uniformity.
  *   **B. Semantic Uniformity + Epistemic Access:** Leads to Anti-Realism (e.g., Intuitionism, some Conventionalism, Cognitive approaches). **Cost:** Sacrifices Referential Robustness (math isn't *about* mind-independent abstracta) and often full Determinacy of Truth and classical Necessity.
  *   **C. Referential Robustness + Epistemic Access:** Tempts Psychologism (numbers are mental objects). **Cost:** Sacrifices Semantic Uniformity (mental objects are private/changeable, undermining objectivity and necessity) and Objectivity.

  **The Sleeper Requirement (#9 - Rival Constructions) intensifies the problem for Option A (Platonism), making Referential Robustness seem untenable without significant qualification (like moving to Structuralism, which modifies Robustness).**

  ---

  ### **Conclusion: What to Argue About on Thursday**
  1.  **Focus on the Referential Trilemma (SU + EA + RR):** This is the core knot. How can any theory plausibly satisfy all three? Does Structuralism (modifying RR) succeed? Can Fictionalism (denying RR) truly preserve SU? Does Platonism have a credible EA story that preserves SU without magic?
  2.  **Make Referential Indeterminacy (Rival Constructions - #9) Explicit:** This isn't just a technical curiosity; it's a powerful argument against naive object-based views of mathematical reference. How does each proposed account handle the fact that "2" can be Zermelo's {{∅}} or von Neumann's {∅, {∅}} without undermining arithmetic? This forces clarity on what reference *is* in mathematics.
  3.  **Question the "Non-Negotiables":** While SU, Determinacy, Epistemic Uniformity, and Objectivity seem strong, *are* there coherent accounts that challenge them? (e.g., Does radical formalism *really* undermine practice? Does full-blooded conventionalism *really* destroy objectivity?).
  4.  **Scrutinize Sacrifices:** When an account sacrifices a desideratum (e.g., Platonism sacrifices a *naturalistic* EA story; Fictionalism sacrifices RR and robust Necessity; Intuitionism sacrifices Determinacy and classical logic), is the cost acceptable? Does it preserve the genuine *phenomena* of mathematical practice and cognition that motivated the desideratum in the first place?

  The tension isn't *just* semantics vs. epistemology; it's the near-impossible demand for language that *acts* referentially about objects we seemingly *can't* access, producing truths that are necessary yet apply contingently, determinate yet sometimes unknowable, objective yet representable in structurally equivalent but referentially distinct ways. The "spec" forces a choice about which miracle is least implausible. **The rival constructions case (#9) and the Referential Trilemma are the pressure points most likely to reveal the deep fault lines.** Good luck on Thursday!
