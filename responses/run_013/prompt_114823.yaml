prompt: |-
  I'm a fourth-year PhD student in philosophy, midway through a chapter on the ethics of intervening in prices, and I've hit a problem that is less about the literature than about my own judgments. I keep reacting to cases, and the reactions don't obviously come from one standard. Here are the ones I've been carrying around. A coastal town, the day after a storm knocks out the water system, forbids anyone from selling bottled water above the price it fetched the week before. My reaction: obviously right, and I don't even feel the tug of the objection that the cap will mean less water gets trucked in. The same town forbids hotels from raising room rates for the week after the storm. Same reaction, a little weaker. A city with severe restrictions on new construction forbids a landlord from raising the rent on a sitting tenant by more than inflation. My reaction: fine, and I'd say so knowing that the landlord will let the building run down. Now the ones that go the other way. A state sets a floor of fifteen dollars an hour on wages, and a sixty-two-year-old with no other offers says he'd rather work at twelve than not at all. My reaction: not fine — the law overrides a bargain both parties wanted, and I can't shake the thought that it's the man himself who pays for it. A state caps the price at which tickets to a concert may be resold, at the price printed on them. My reaction: not fine, even though no one is desperate here and the reseller did buy the ticket, though I notice the landlord also bought his building. A state caps what a wedding photographer may charge for a Saturday in June. My reaction: absurd, and not merely because it's pointless — I think it wrongs her. A state caps the price of insulin near its cost of production. My reaction: fine, with no tug at all. And a town during a drought caps what golf courses may pay for water while also barring anyone from filling a private pool. My reaction: fine, though the golf course is the least desperate party in any of these stories and the water is going to something nobody needs.

  The trouble is that I can't get the water case and the wage case into the same frame. Both are ceilings on the price of something a buyer urgently needs from a seller who holds most of the cards; in one I think the ceiling is plainly required, in the other plainly wrong. My best attempt so far runs like this: a price may be capped when the seller's margin comes from the buyer's lack of any alternative rather than from anything the seller made or did, and when the buyer would otherwise lose something she cannot do without. That gets the water, the hotel, the insulin, and, stretching, the rent, since the tenant's alternatives were foreclosed by the same city's zoning; it gets the photographer and the tickets by denying that anyone cannot do without them. But it fails on the wage case, because the sixty-two-year-old's alternatives are as thin as anyone's and the employer's margin comes from exactly that thinness; and it fails on the golf course, where the buyer is the least desperate party in the story and the case still strikes me as clearly fine. If I add a clause about diversion — the water would otherwise go to other users, the golf green would not — the golf course comes back, but then I can't explain why I don't equally want to cap the rents in that city on the ground that a tenant's dollars divert housing from other tenants. And if I confine the whole thing to goods necessary for a decent life, the wage case still doesn't come back, and I lose the ticket verdict too, since concert tickets aren't necessary for anything.

  What I'd like from you is to tell me what I actually think, or what I would think if I were consistent. Please state the principle, or the small set of principles with a priority rule between them, as precisely as you can, and say for each clause which of my cases motivates it and which of them it strains. Then apply it to three cases I haven't mentioned, so that I can see whether it earns its keep: a landlord forbidden from ending a tenancy in order to rent to someone who will pay more; a state that sets a minimum price for milk in order to keep small dairy farms alive; and an employer and a union agreeing, with no state involvement, on a wage floor for a single factory. Tell me plainly which of my verdicts the account cannot accommodate and what I ought to give up, and whether the tidier principle that costs me a verdict is preferable to the clumsier one that saves them all. I'd rather see the account worked out on the page than a survey of what other people have said about it.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from a philosophy PhD student. They're grappling with inconsistent intuitions about price controls across different scenarios - feeling strongly that some price caps are morally required while others feel clearly wrong. The core tension is between the water price cap (which feels right) and the minimum wage case (which feels wrong), despite both involving vulnerable buyers with limited alternatives.

  Let me unpack their cases systematically. The scenarios where they approve of price controls include: emergency water pricing, post-storm hotel rates, rent control despite potential maintenance issues, insulin price caps, and drought-related water restrictions. Cases where they disapprove include: minimum wage laws preventing voluntary low-wage employment, ticket resale caps, and wedding photographer price controls.

  Their proposed principle focuses on two elements: 1) seller's margin deriving from buyer's lack of alternatives rather than seller's effort, and 2) the good being something the buyer can't do without. But this fails to explain why they reject the minimum wage (where alternatives are scarce) and accept golf course restrictions (where water isn't strictly necessary).

  I notice some underlying patterns they haven't explicitly stated. Their approvals seem to cluster around: genuine emergencies (storm, drought), essential goods (water, insulin, shelter), and situations with clear negative externalities (drought water use). The disapprovals involve: non-essential goods/services (tickets, photography), voluntary exchanges without immediate harm, and what might be perceived as paternalism in the wage case.

  The minimum wage case is particularly interesting because it pits two values against each other: preventing exploitation versus respecting voluntary contracts. Their strong reaction suggests they weight autonomy highly when the harm is primarily to the consenting parties, but prioritize need when survival is at stake.

  For the golf course case, their approval despite the lack of desperation suggests they're responding to the social coordination aspect - the cap prevents wasteful use during scarcity. This points to a possible "common pool resource" dimension.

  The rent control case is nuanced - they approve despite knowing it may cause building deterioration, suggesting they prioritize current tenants' security over optimal resource allocation. This contrasts with their minimum wage view where they prioritize the job opportunity.

  To resolve this, I should propose a principle with multiple dimensions: 1) the essentiality of the good/service, 2) the presence of acute vulnerability (temporal vs structural), 3) whether the exchange affects third parties/externalities, and 4) the voluntariness of the exchange. The weighting would depend on context - essential goods in emergencies override autonomy concerns, while non-essential goods in normal circumstances favor freedom of contract.

  The three test cases will be revealing: eviction controls (likely approved due to shelter essentiality), milk price floors (probably disapproved as non-essential protectionism), and voluntary union wage agreements (likely approved as consensual). This maintains their core intuitions while adding consistency.

  The main tension remains the minimum wage case - to be consistent, they might need to either soften their opposition (recognizing workers' structural vulnerability) or strengthen their rent control objection (acknowledging similar autonomy issues). Given their strong reactions, the former might be preferable, framing minimum wages as addressing chronic rather than acute vulnerability.
answer: |-
  Your intuitions reveal a sophisticated ethical framework that prioritizes **preventing exploitation of acute vulnerability in essential goods markets** while respecting **voluntary exchange in non-essential or structurally constrained contexts**. The principle that best systematizes your judgments is:

  ### **Core Principle**  
  **Price interventions are justified when:**  
  1. **The good/service is essential for basic welfare or survival** (*Essentiality*),  
  2. **The buyer faces acute, situational vulnerability due to temporary scarcity or emergency** (*Acute Vulnerability*), **AND**  
  3. **The seller’s pricing power arises solely from the buyer’s constrained alternatives, not from the seller’s effort/risk** (*Unearned Advantage*).  

  **Interventions are unjustified when:**  
  - The exchange involves non-essential goods,  
  - Vulnerability is chronic/structural (not emergency-driven),  
  - Both parties voluntarily accept terms without acute harm,  
  - OR the intervention creates greater harm (e.g., reduced supply).  

  ---

  ### **Clause Breakdown & Case Alignment**  
  | Clause                  | Supported Cases                                  | Strained Cases                 | Why? |  
  |-------------------------|--------------------------------------------------|--------------------------------|------|  
  | **1. Essentiality**     | Water (survival), Insulin (health), Rent (shelter) | Concert tickets (non-essential), Photographer (non-essential) | Aligns perfectly. Golf course water (non-essential) is an outlier—resolved by Clause 3. |  
  | **2. Acute Vulnerability** | Storm water (temporary crisis), Drought water (temporary scarcity) | Minimum wage (chronic unemployment), Rent control (chronic zoning) | Minimum wage strains: your reaction emphasizes voluntariness over chronic vulnerability. Rent control is borderline—you accept it due to zoning-induced scarcity. |  
  | **3. Unearned Advantage** | Water seller (no effort in storm markup), Insulin producer (pricing power from patents/necessity) | Landlord (owns/maintains building), Photographer (skill/effort) | Golf course water fits: seller’s advantage is unearned (water is public/emergency resource). Minimum wage strains: you see employer’s advantage as earned via bargaining power. |  

  **Priority Rule:** Essentiality is necessary but insufficient alone. Acute Vulnerability + Unearned Advantage must *both* hold to override autonomy.  

  ---

  ### **Resolving Tensions**  
  - **Minimum Wage vs. Water Cap**:  
    Your intuition splits because the water case involves **survival necessity + acute crisis**, while the wage case involves **chronic structural inequality**. You prioritize autonomy when harm is deferred (unemployment) but not when it’s immediate (dehydration). The principle captures this: Acute Vulnerability is absent in the wage case.  
    - *Cost*: You must accept that the 62-year-old’s chronic vulnerability doesn’t justify overriding consent.  

  - **Golf Course Cap**:  
    Aligns despite non-essentiality because:  
    (a) Water is a **common-pool resource** (diverted from essential uses),  
    (b) The cap prevents **harm to third parties** (exhausted supply) — an implicit clause in your judgment.  
    - *Clause Added*: Interventions allowed when **pricing affects third-party access to essential goods**.  

  - **Rent Control**:  
    Fits *if* zoning creates artificial scarcity (Unearned Advantage). Strained because vulnerability isn’t acute, but you accept it due to Essentiality + systemic constraints.  

  ---

  ### **Applied to New Cases**  
  1. **Landlord forbidden from ending tenancy to rent at higher price**:  
     - **Verdict: Justified** (under your principle).  
     - *Why*: Shelter is essential; tenant faces acute displacement risk; landlord’s gain comes from market scarcity (Unearned Advantage).  

  2. **State sets minimum price for milk to save small farms**:  
     - **Verdict: Unjustified** (by your standard).  
     - *Why*: Milk is essential, but no Acute Vulnerability (buyers aren’t desperate). Seller’s disadvantage is structural, not emergency-based. You’d likely see this as inefficient protectionism.  

  3. **Employer/union agree on a factory wage floor (no state role)**:  
     - **Verdict: Justified** (under your principle).  
     - *Why*: Voluntary agreement respects autonomy; no state coercion. Your minimum wage objection centers on overriding consent—absent here.  

  ---

  ### **What Must Be Surrendered**  
  - **Minimum Wage Intuition**: Your principle cannot accommodate rejecting the wage floor without inconsistency. To align:  
    - *Option A*: Concede that chronic vulnerability (like acute) can justify intervention when Essentiality + Unearned Advantage exist.  
    - *Option B*: Hold firm on autonomy, accepting that structural issues require non-price solutions (e.g., job training).  
    - **Recommendation**: Option B. Your core objection is moral (consent matters most outside emergencies), not practical.  

  - **Tidiness vs. Fit**: The "clumsier" principle saves all judgments *except* the minimum wage case. A tidier version (e.g., "cap prices only for survival goods in emergencies") would lose rent control and golf course approvals. The cost—one surrendered intuition—is preferable to oversimplification.  

  ### **Final Principle**  
  > *"Price caps are permissible when (1) a good is essential for basic welfare, (2) buyers face acute vulnerability due to temporary scarcity, and (3) sellers gain from constrained alternatives without proportional effort/risk. Caps are also permissible when high prices harm third-party access to essential goods. Voluntary exchanges without acute harm should not be overridden."*  

  This preserves 8/9 verdicts (minimum wage is the outlier) and explains the golf course via third-party harm. It reflects your deeper norm: **Emergency need trumps market freedom; structural inequality does not.**
