answer: |-
  ## For Hal

  Hal was constant. Not in the obvious ways—he could surprise you. But in the things that mattered most. In friendship, in thought, and in this fierce, unwavering commitment he had to getting things *right*. Not just correct, but deeply, fundamentally right. He spent decades wrestling with one particular question: what is a promise? Not just what it does, but what it *is*.

  His answer was… Hal. Unique. He said a promise isn’t about giving someone hope or a reason to trust you. It’s something deeper. When you make a promise, Hal believed, you actually hand over a small piece of your own freedom—your authority over a part of your future—to the person you promise. You give them that piece. And you don’t get it back just by wishing, or even by trying. You only get it back when you actually *do* the thing you promised.

  That piece of yourself stays with the person you gave it to. Always. Even if they’re gone. Hal believed that completely. He lived it. Eight years ago, in Nora’s final weeks, he promised her he would keep her garden alive for as long as he lived.

  Hal was a terrible gardener. Honestly, Nora’s family, you know it’s true. He knew it too. The roses looked confused. The vegetables were bewildered. But he kept that garden. Year after year. Long after Nora was gone. He watered, he weeded (mostly the wrong things, probably), he fought the bugs and the weather. It wasn’t pretty. But it was alive. He kept it alive.

  Why? Not because it was beautiful, or easy, or because it made anyone feel better. Not for memory, not for his own peace. He kept it because he’d given Nora that piece of his authority over his own actions, concerning that garden. When she died, the promise didn’t vanish. That piece of himself was still held by her. He couldn’t take it back. The only way to get it back was to do the thing: to keep the garden alive until he himself was done. He did it. He kept that awkward, struggling patch of earth alive. He did the work.

  **He kept his word because it was still hers to hold.**
