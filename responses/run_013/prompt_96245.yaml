prompt: |-
  Ok, quick context and then the ask. I'm in a small reading group that's been stuck for like three months on the adaptationism fight, and I want to finally force it into something productive.

  Here's the setup. My friend Dana is a hard adaptationist: for any trait with any hint of functional organization, her default is that selection built it for a job, and she thinks constraints/developmental baggage are real but usually the boring residue you appeal to only after you've failed to find the function. My friend Owen is the opposite: he thinks the spandrels critique from Gould and Lewontin was basically right and never actually got answered, that a huge share of what looks designed is really a byproduct of something else, and that adaptationist stories are often unfalsifiable reverse-engineering.

  To make this less of a rerun of the famous papers, I want the collaboration framed around a specific reframing my PI keeps pushing. Instead of the binary adaptation-or-spandrel question, she says treat any trait as having features you can split into load-bearing ones (kept in place because selection currently tracks the job they do) and scaffolding ones (present only because of developmental, structural, or phylogenetic inheritance, doing no current work). Her bet is that this split is usually ill-defined and almost never cleanly measurable, and that admitting that dissolves a lot of the fight. Dana thinks the split is obviously well-defined in principle and just needs better methods. Owen thinks it's well-defined in principle but that the scaffolding side is way bigger than Dana admits.

  You're a philosopher of biology who's spent a career on adaptation, constraint, and the epistemology of functional explanation -- I want you to actually think hard here, and brainstorm the space of possible agreed claims before you commit to any draft, because the whole point is that neither of them gets to feel like they won by wording.

  Draft the joint statement of an adversarial collaboration that Dana and Owen could both put their names to. I want: (1) a numbered list of claims both camps can sign, including about what counts as evidence, what the burden of proof should be, and whether the load-bearing/scaffolding split is well-defined, measurable, and explanatory; (2) the precise residual disagreements, each written in wording its own side would accept for itself, not a strawman; (3) the cruxes -- the sub-questions where settling things would actually move at least one of them; and (4) for each crux, a concrete case, experiment, or argument both sides agree bears on it, with each side's prediction written down in advance. If any part of their fight turns out to be merely verbal, say which part and why, and dont be polite about it. Format it as a numbered agreed-claims section followed by a disagreements table.
