  We are building a diagnostic flowchart to help users discover their underlying view on why promises are binding and what exactly is owed.

  First, we brainstorm distinct ways to answer the two core questions:

  1. **What makes a promise binding?** (The source of the obligation)
     - Social practice: The obligation arises from participating in a social institution with rules.
     - Reliance: The obligation arises because the promisee has formed expectations and may rely on the promise.
     - Consequences: The obligation is tied to the best overall outcomes (e.g., utility maximization).
     - Autonomy: The obligation is self-imposed by the act of promising (binding one's will).
     - Virtue: Keeping promises is a virtuous act, and the obligation is a demand of good character.
     - Basic duty: There is a fundamental duty of fidelity that requires no further grounding.
     - Trustworthiness: The obligation is to be trustworthy, which may be satisfied by performance or by making amends.
     - Predictions: Promises are merely predictions of future behavior and do not create obligations.

  2. **What, exactly, does the promisor owe?** (The object of the obligation)
     - Performance: The promisor owes the exact act promised.
     - Result: The promisor owes the result that the promisee expected (which might be achieved in other ways).
     - Non-disappointment: The promisor must not let the promisee down, which might be achieved by performance, warning, or compensation.
     - Trustworthiness: The promisor must act in a way that maintains trust, which might be by keeping the promise or by being accountable for breaking it.

  We will also consider how these answers interact in various concrete cases.

  We then design the tree with internal nodes as concrete cases or claims. We must cover the required cases and more.

  We aim for 8-12 leaves. We'll have at least the following leaves (with descriptive names and a defender if confident):

  1. Reliance-Expectation (e.g., Scanlon)
  2. Social Practice (e.g., Rawls, Searle)
  3. Consequentialist Rule (e.g., rule-utilitarianism)
  4. Autonomy (e.g., Kantian)
  5. Virtue Ethics (e.g., Aristotelian)
  6. Basic Fidelity (e.g., Rossian prima facie duty)
  7. Trustworthiness (e.g., Macnamara)
  8. Prediction (e.g., Humean skepticism)

  We add two more:

  9. Consent-Based: The obligation arises because the promisee consents to rely, and the promisor owes the prevention of harm from reliance.
  10. Relational: The obligation is grounded in the relationship between promisor and promisee, and the promisor owes the maintenance of that relationship.

  We must have at least 8 leaves and up to 12. We have 10 now.

  Now, we design the tree. We start with a question that can quickly route the purely prudential (reputation-based) view to a leaf. We also want to capture the other views.

