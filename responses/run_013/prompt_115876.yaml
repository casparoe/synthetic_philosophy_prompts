  ### (a) Tree as Indented List  
  1. **N1**: You promise a stranger at a train station to water their plants while they’re away. You’ll never see them again. Do you owe it to them to water the plants?  
     - A: Yes, regardless of whether they rely on you → **N2**  
     - B: Only if they might suffer if you don’t (e.g., they skip hiring someone else) → **N3**  
     - C: No, since they’ll never know if you skip it and can’t hold you accountable → **L1**  

  2. **N2**: You promise your dying friend to donate their savings to charity. They die. Do you still owe it to them to donate?  
     - A: Yes, the obligation remains → **N4**  
     - B: No, because they’re gone and can’t be disappointed → **N5**  

  3. **N3**: You promise to help a friend move. On moving day, they text: “Don’t come, I don’t need help.” Do you still owe it to show up?  
     - A: Yes, because a promise is binding until formally released → **N6**  
