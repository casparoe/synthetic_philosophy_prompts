  ### Diagnostic Flowchart: Why Do Promises Bind?

  **Tree Design Rationale**:  
  The tree starts by isolating the prudential/reputation view (Leaf 1) in the first question. Subsequent nodes test core dimensions:  
  - **Reliance vs. intrinsic obligation** (Nodes 1, 3, 8).  
