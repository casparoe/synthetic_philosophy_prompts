  ### (c) Leaf Commitments (One Awkward Implication Each)  
  - **L1 (Prudential)**: Breaking a promise is acceptable if you can avoid reputational damage.  
  - **L2 (Promisee-Specific)**: A deathbed promise to donate life savings need not be kept after death.  
  - **L3 (Trustworthiness)**: Breaking a trivial promise (e.g., lunch) requires only an apology, even if it causes harm.  
  - **L4 (Prediction)**: A liar who promises with no intent to comply does nothing wrong (only inaccurately predicts).  
  - **L5 (Reliance-Expectation)**: Promises made to someone who forgets them create no obligation.  
  - **L6 (Consent-Based)**: Disappointing someone who didn’t formally rely on your promise (e.g., your mom) is harmless.  
  - **L7 (Autonomy)**: Returning a weapon to a murderer is obligatory if promised.  
  - **L8 (Social Practice)**: Promises made to a pet (or on a desert island) are non-binding.  
  - **L9 (Basic Fidelity)**: There is no deeper reason why promises bind—it’s a brute moral fact.  
  - **L10 (Consequentialist Rule)**: Breaking a promise is mandatory if it maximizes overall good (e.g., lying to save lives).  
  - **L11 (Virtue Ethics)**: The primary wrong in breaking a promise is corrupting your character, not harming others.  

