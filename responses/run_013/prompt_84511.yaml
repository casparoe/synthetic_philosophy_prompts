  We are designing a quiz to map positions in the debate between individualism and holism in social science. The quiz will have 8-10 questions. We are to build a logical tree based on three axes: existence, causation, and explanation. We also note the requirement to include specific positions and to avoid labeling questions.

  Key distinctions:

  1. **Ontology (Existence)**: Are there social entities that exist over and above individuals? Or are they reducible to (or nothing over and above) individuals?
  2. **Causation**: Can social facts cause individual actions or other social facts without any individual-level mechanism? Or must all causation be mediated by individuals?
  3. **Explanation**: Can an explanation legitimately use social facts as fundamental terms? Or must explanations be reduced to individual-level facts?

  Additionally, we have the issue of sufficiency: are individual-level facts sufficient for explanation, or merely necessary?

  We also note the positions we must represent:

  - Social facts are nothing over and above individuals but not straightforwardly reducible (supervenience?).
  - Social facts have their own causal powers that bear down on individuals (emergent powers?).
  - Social facts are a convenient shorthand (nominalism?).
  - The dispute is a pseudo-problem because explanation has no single standard (pluralism?).

  We'll design questions that cover scenarios that can reveal these positions.

  Proposed Questions:

  1. **Bank Run**: During a bank run, many people rush to withdraw their money because they fear the bank will collapse. Do you think the bank run as a social phenomenon (the collective panic) can be the cause of an individual's decision to withdraw, even if that individual had no prior fear until they saw the crowd?
     - (A) Yes, the collective panic can directly cause the individual's fear and action.
     - (B) No, the individual's fear must arise from their own reasoning or perception of others' actions; the collective panic is just a label for many individuals acting similarly.

  2. **Keyboard Convention (QWERTY)**: The QWERTY keyboard layout became standard because of historical circumstances and persists even though it is not the most efficient. Why does it persist?
     - (A) Because each individual, knowing that others use it, chooses to use it too, and no one can change it alone. The convention is self-reinforcing through individual choices.
     - (B) Because the convention as a social fact has a force of its own that maintains it, beyond the sum of individual preferences and actions.

  3. **Language Change**: A language gradually loses a case ending (e.g., the loss of the dative case in English). How should we explain this change?
     - (A) By the accumulation of individual choices: each speaker started using alternative constructions, and over time, the case ending faded.
     - (B) By a shift in the language system itself, which then influences how individuals speak.

  4. **Crowd Crush**: In a crowd crush, people are packed so tightly that movement becomes involuntary and dangerous. Is the physical force of the crowd causing injury an emergent property of the crowd as a whole?
     - (A) Yes, the force is a property of the crowd as a collective entity, which cannot be reduced to individual actions.
     - (B) No, the force is the result of each individual's body pressing against others; the crowd is just the sum of individuals.

  5. **Inflation Expectations**: Inflation can be caused by the expectation of inflation (e.g., when people expect prices to rise, they buy more, which drives prices up). How does this work?
     - (A) It is a self-fulfilling prophecy: each individual acts on their expectation, and the aggregate effect is inflation. But the expectation is formed by individuals based on their observations and reasoning.
     - (B) The expectation of inflation is a social fact that has causal power and can bring about inflation without being reducible to individual beliefs.

  6. **Institutional Change**: Consider two societies with identical individuals (same genes, same psychology) but different institutions (e.g., one has a market economy and the other has central planning). Could these societies develop differently?
     - (A) No, because institutions are just patterns of individual behavior, so if the individuals are identical and interact in the same way, the outcomes should be the same.
     - (B) Yes, because institutions have their own logic and structure that shape individual behavior, so even with identical individuals, the institutions could lead to different outcomes.

  7. **Reducing Social Facts**: When we say "the government raised taxes," is this statement:
     - (A) A convenient shorthand for a complex set of actions by individuals (officials, legislators, etc.), but ultimately it is only about individuals.
     - (B) A statement about a real social entity (the government) that can act and cause events.

  8. **Explanation of a Social Norm**: If we want to explain why people in a society follow a particular social norm (e.g., shaking hands when meeting), is it sufficient to refer to the norm itself (e.g., "because it is the custom")?
