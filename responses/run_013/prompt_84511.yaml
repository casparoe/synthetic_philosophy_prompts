     - (B) Yes, the norm is a social fact that provides a valid explanation without needing to reduce it to individual psychology.

  9. **Necessity and Sufficiency**: When explaining a social phenomenon (like the spread of a rumor), are individual-level facts:
     - (A) Both necessary and sufficient for a complete explanation.
     - (B) Necessary but not sufficient; we must also consider social-level facts.
     - (C) Not even always necessary; sometimes social-level facts can explain without reference to individuals.

  10. **Pseudo-Problem**: Is the debate between individualism and holism ultimately a false dilemma because social science can use multiple kinds of explanations depending on the context?
      - (A) Yes, explanations can be valid at different levels and there is no single "correct" level.
      - (B) No, there is a fact of the matter about which level is fundamental.

