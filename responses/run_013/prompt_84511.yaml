answer: |-
  Below is a 10-question quiz designed to map positions in the individualism-holism debate based on logical commitments rather than labels. The questions use everyday scenarios to probe underlying beliefs about existence, causation, and explanation. The scoring key identifies positions by patterns in answers, flags inconsistencies, and notes awkward commitments. The tree of positions is included at the end.

  ---

  ### **The Social Explanation Sorting Quiz**  
  *Answer each question with A, B, or C. Choose what feels most natural—no prior theory needed!*  

  1. **Bank Run**: During a bank run, people withdraw money because others are doing it. Can the *collective panic* itself cause someone who wasn’t initially worried to rush to the bank?  
     - (A) Yes, the group panic directly causes individual actions.  
     - (B) No, only the person’s own reasoning or seeing others withdraw does.  

  2. **Keyboard Layout**: The QWERTY keyboard (designed to slow typing) persists even though better layouts exist. Why?  
     - (A) Each person uses it because others do, and no one can change it alone.  
     - (B) The convention itself "locks in" behavior, overriding individual preferences.  

  3. **Language Drift**: A language loses a grammatical feature (e.g., the dative case). How?  
     - (A) Individuals gradually use simpler constructions, and others copy them.  
     - (B) The language system evolves, and speakers adapt to its new structure.  

  4. **Crowd Crush**: In a deadly crowd surge, is the crushing force:  
     - (A) An emergent property of the crowd as a whole?  
     - (B) Just the sum of individual bodies pressing against each other?  

  5. **Inflation**: If everyone expects prices to rise, and this causes actual inflation:  
     - (A) It’s self-fulfilling: individuals act on expectations, driving prices up.  
     - (B) The expectation *itself* (as a social mood) causes inflation directly.  

  6. **Same People, Different Rules**: Two identical populations (same people, same psychology) live under different institutions (e.g., democracy vs. dictatorship). Could their societies evolve differently?  
     - (A) No, institutions are just patterns of individual behavior.  
     - (B) Yes, institutions shape behavior independently.  

  7. **"The Government Raised Taxes"**: This statement is:  
     - (A) A shorthand for individual officials’ actions.  
     - (B) A claim about a collective entity acting.  

  8. **Explaining a Handshake**: Why do people shake hands? Is "it’s a custom" enough?  
     - (A) No, we must explain how *each person* learned to do it.  
     - (B) Yes, the custom itself explains it sufficiently.  

  9. **Individual Facts in Explanations**: When explaining social phenomena (e.g., a rumor spreading), are facts about individuals:  
     - (A) Always sufficient.  
     - (B) Necessary but not sufficient; social facts are also needed.  
     - (C) Not always necessary; social facts can explain alone.  

  10. **The Debate Itself**: Is the individualism-holism dispute a real problem?  
      - (A) No—explanation depends on context; both levels can be valid.  
      - (B) Yes—there’s a "right" level for fundamental explanations.  

  ---

  ### **Scoring Key**  
  Use your answers to find your position(s) in the tree below. **Bold labels** are named positions; *italics* note awkward commitments.  

  #### **Decision Tree**  
  1. **Start at Q10**:  
     - If **A** → **Explanatory Pluralist** (You think the debate is a pseudo-problem).  
       - *Awkward: Must accept that "individuals only" and "social forces" explanations can both be true for the same event, even if they seem contradictory.*  
     - If **B** → Proceed to Q7.  

  2. **Q7 (Ontology: Do social entities exist?)**  
     - If **A** ("shorthand") → Proceed to Q9.  
     - If **B** ("real entity") → Proceed to Q1.  

  3. **Branch for Q7=A** (Social facts = shorthand):  
     - **Q9 (Explanation: Are individuals sufficient?)**  
       - If **A** (Sufficient) → **Strict Individualist** (You’re a nominalist/conventionalist).  
         - *Awkward: Must argue that phenomena like inflation or crowd crushes are* only *the sum of individuals, with no emergent properties.*  
       - If **B or C** (Not sufficient) → **Empty Cell!** Incoherent (If social facts are *just* shorthand, they can’t be necessary for explanation).  

  4. **Branch for Q7=B** (Social facts = real):  
     - **Q1 (Causation: Can social facts cause directly?)**  
       - If **A** (Yes) → **Holist** (You believe in emergent causal powers).  
         - *Awkward: Must defend that social facts (e.g., "panic") cause things without micro-level mechanisms.*  
       - If **B** (No) → Proceed to Q9.  

  5. **Sub-branch for Q7=B and Q1=B** (Social facts exist but don’t cause directly):  
     - **Q9 (Explanation: Are individuals sufficient?)**  
       - If **A** (Sufficient) → **Empty Cell!** Incoherent (Why call social facts "real" if they add nothing?).  
       - If **B** (Necessary but not sufficient) → **Non-Reductive Individualist** (You’re a supervenience theorist).  
         - *Awkward: Social facts are real and explanatory but lack independent causal power—like a map that guides you but can’t push you.*  
       - If **C** (Not necessary) → **Empty Cell!** Incoherent (If social facts can’t cause directly, individuals must be involved).  

  #### **Tree of Positions**  
  ```  
                                        START (Q10)  
                                        /          \  
                                       A            B  
                                       |            |  
                          Explanatory Pluralist    Q7 (Ontology)  
                                                   /      \  
                                                  A        B  
                                                  |        |  
                                                 Q9        Q1 (Causation)  
                                                / | \      /   \  
                                               A  B  C    A     B  
                                              /   |   \   |     |  
                               Strict Individualist | Incoherent Holist Q9 (Explanation)  
                                                   |            / | \  
                                                   |           A  B  C  
                                                   |           |  |  |  
                                                   |      Incoherent | Incoherent  
                                                                   Non-Reductive Individualist  
  ```  

  #### **Notes**  
  - **Empty Cells**: Two combinations are incoherent (marked above). For example:  
    - Believing social facts are *only* shorthand (Q7=A) but *necessary* for explanation (Q9=B/C) implies social facts are both unreal and essential—a contradiction.  
  - **Indistinguishable Positions**: The quiz doesn’t separate "moderate" and "strong" holism. To split them, ask: *Can a social fact (e.g., inflation) cause another social fact (e.g., recession) without individual actions?* Holists may split here.  
  - **Tone**: The quiz avoids jargon but doesn’t soften stakes—e.g., strict individualists must deny emergent properties in crowd crushes (Q4=B).  
  - **All Required Positions Covered**:  
    - Strict Individualist = Social facts as shorthand (Q7=A).  
    - Non-Reductive Individualist = Social facts real but not causal (Q7=B, Q1=B, Q9=B).  
    - Holist = Social facts causal (Q1=A or Q5=B).  
    - Explanatory Pluralist = Dispute is pseudo-problem (Q10=A).  

  Hand this out as a single sheet! Participants can self-score and discuss their position’s "awkward commitment" in your club meeting.
