answer: |-
  Your observations cut to the heart of autonomy's architecture in medical ethics. Let's dissect this systematically.

  **Brainstorming Candidate Views:**
  - **Personal Identity:** Is it grounded in psychological continuity (Locke/Parfit)? Biological persistence? Narrative coherence (Ricoeur/MacIntyre)? Or is it a moment-to-moment agent (Humean bundle theory)?
  - **Autonomy:** Is it a *capacity* (current rationality)? A *right to self-legislation* (Kant)? A *sovereign will* that can bind the future (Hobbes)? Or an unfolding *process* where only present preferences are authentic (existentialist)?

  **The Practice's Implicit Theory:**
  The rules form a coherent but narrow view:
  1. **Strict Presuppositions:**
     - Personal identity persists *biologically* across competence changes (supporting Feature 1).  
     - Autonomy requires *present decisional capacity*. Authority is not an enduring property of the person but a *functional state* (explaining Features 1 & 2).  
     - The competent self is *sovereign in the present* and cannot alienate its core agency—even to itself across time (explaining Feature 3).  

  2. **Quietly Rules Out:**
     - **Psychological continuity theories** (if identity depends on connected memories/values, why override the demented patient’s current wishes?).  
     - **Autonomy as extended will** (e.g., Kantian self-binding), since competent selves can't constrain future competent selves.  
     - **Narrative identity views** (which might prioritize the "author" of the advance directive over the diminished "character").  
     - **Utilitarian welfare concerns** as primary (current suffering is subordinate to past instructions).

  **Underdetermined Areas:**
  The practice *is* compatible with:
  - **Biological identity + present-moment autonomy** (the dominant implied view).  
  - **Minimalist psychological continuity** (if we see capacity loss as severing psychological identity, making the past self the "true" agent).  
  - **Proceduralism** (authority derives from socially agreed rules about competence, not metaphysics).  

  But these collapse into the same operational rules: *Capacity triggers moral sovereignty. No capacity? Defer to last competent expression.*

  **Does Feature 3 Belong? A Tense Fit:**
  Yes, but it reveals a hierarchy:  
  - **Feature 1** treats the past self as a *trustee* for the incapacitated future self.  
  - **Feature 3** blocks the competent self from being a *tyrant* over future competent selves.  
  The deeper commitment is **non-alienability of present autonomy**. Even if you *are* the same person, your current capacity grants inviolable authority. This explains why stale directives lose weight: not due to identity erosion, but because prolonged time raises doubts about *current* endorsement.

  **What Changes Under a Rival Theory?**
  Suppose we adopt **narrative identity** (the self as an unfolding story):  
  - Feature 1 stays (past directive reflects the "author's" plot).  
  - Feature 2 weakens: Competent reversals inconsistent with the life narrative could be challenged.  
  - **Feature 3 reverses**: Ulysses clauses *must* bind, as the directive represents the "true self" overcoming episodic fragmentation. Refusing medication during mania would be inauthentic to the authored narrative.  

  *In essence, the current practice sacrifices narrative coherence to protect instantaneous self-determination.*

  **Verdict:**  
  The three features cohere under a view that **prioritizes present capacity as the locus of autonomy**, with past directives serving as a *substitute* when that capacity lapses—not as an enduring expression of identity. Feature 3 isn't an outlier; it's the capstone confirming that autonomy here is fundamentally *non-transferable*, even across one's own timeline. The tension you sense arises because the practice implicitly treats the *incapacitated* self as discontinuous (allowing past binding) but the *competent* self as perpetually self-owning (forbidding future binding). This isn't inconsistency but a clinical compromise: it navigates dementia by privileging the last autonomous act, while refusing to let mental illness redefine competence retroactively. The unspoken foundation is that *autonomy resides in the now*—a pragmatic but philosophically narrow solution.
