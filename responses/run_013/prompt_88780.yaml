answer: |-
  ### Exam Question: Counterpart Theory and Modal Chains  
  *(Answer in 700-800 words. Total: 20 marks)*  

  > **Critically evaluate whether David Lewis’s counterpart theory can avoid the implication that you could have been a maple tree.** Consider the following scenario:  
  > - *World w₁*: Your counterpart makes a slightly different career choice.  
  > - *World w₂*: The counterpart in *w₁* has a counterpart with a slightly different personality.  
  > - *World w₃*: The counterpart in *w₂* has a counterpart with a slightly different physical trait.  
  > ...  
  > - *World wₙ*: The counterpart in *wₙ₋₁* is a maple tree.  
  >  
  > Does counterpart theory commit Lewis to the claim that *you could have been that maple tree*? In your answer, address:  
  > (a) Whether possibility requires direct counterparts or chains of counterparts;  
  > (b) What this implies for the transitivity of the counterpart relation;  
  > (c) Whether rejecting transitivity undermines the principle that “if it’s possible that it’s possible that P, then it’s possible that P” (S4 axiom);  
  > (d) Whether this result constitutes a serious problem for counterpart theory.  

  ---

  ### Model Answer (720 words)  
  Counterpart theory analyzes *de re* modality by positing that objects exist in only one world, with counterparts in other worlds standing in similarity relations. The chain scenario—where incremental changes across worlds culminate in a maple tree—threatens to imply that I could have been that tree. I argue this is **not a fatal problem** for Lewis, though it reveals a significant trade-off: counterpart theory must reject the transitivity of the counterpart relation, sacrificing the S4 axiom to preserve intuitive small-step possibilities while blocking absurdities.  

  **(a) Possibility requires direct counterparts, not chains.**  
  For Lewis, “I could have been F” is true iff a *direct* counterpart in some world is F (*On the Plurality of Worlds*, §4.4). The chain’s endpoint (the maple tree) is not *my* counterpart; it is a counterpart of a counterpart (of a counterpart...). Since the counterpart relation is world-relative and based on contextual similarity, the tree resembles the *wₙ₋₁* counterpart, not me. Thus, “I could have been the tree” is false—no single world contains a tree-counterpart of me.  

  **(b) The counterpart relation is not transitive—by design.**  
  Transitivity would require that if A is a counterpart of B (in world *wᵢ*), and B is a counterpart of C (in *wⱼ*), then A is a counterpart of C. Lewis explicitly rejects this (*Plurality*, §4.5). In the chain, each counterpart is sufficiently similar to its immediate predecessor to qualify as a counterpart under a contextually relevant standard (e.g., career choice, personality). However, similarity degrades across steps: the *wₙ* tree is too dissimilar from me to be *my* counterpart. Non-transitivity is essential here—it blocks the inference from “I could have had a slightly different career” to “I could have been a tree.”  

  **(c) Sacrificing S4 is the cost of this solution.**  
  The S4 axiom (◊◊P → ◊P) fails in counterpart theory. In the chain:  
  - It is *possible* that I could have had a counterpart with a slightly different career (*w₁*).  
  - Relative to *w₁*, it is *possible* that *that* counterpart has a counterpart with a slightly different personality (*w₂*).  
  - Iterating this, it is *possible that it is possible that* ... I have a tree-counterpart.  
  Yet, it is *not* (absolutely) possible that I am a tree—no world contains my tree-counterpart. Thus, ◊◊P does not entail ◊P. Lewis accepts this cost: modal operators quantify over different worlds when nested, so iterated possibilities need not collapse into single-world possibilities.  

  **(d) This is not a devastating objection but a defensible trade-off.**  
  The chain scenario exposes no internal contradiction. Instead, it clarifies counterpart theory’s commitments:  
  1. **Explanatory power preserved:** Non-transitivity explains how small changes are possible while radical ones are not. If transitivity held, I *could* have been a tree—an absurdity Lewis rightly avoids.  
  2. **S4 rejection is principled, not *ad hoc*:** Lewis’s semantics naturally invalidates S4 because counterpart relations are context-sensitive and world-relative. When we say “I could have been F,” we fix the relevant similarity standards; in iterated modalities, standards shift.  
  3. **The “cost” is intuitive, not logical:** S4 is a *modal intuition*, not a logical truth. We *feel* that iterated possibility implies flat possibility, but counterpart theory shows this intuition rests on a conflation of contexts. The objector must argue *why* we should retain S4—counterpart theory merely forces this choice.  

  The Humphrey objection fails here because it assumes *de re* claims must be about trans-world identity. The chain objection is deeper: it questions whether non-transitivity can coherently handle gradual variation. But Lewis’s reply stands: the counterpart relation’s non-transitivity is precisely what *prevents* the slide to absurdity. If the theory allowed transitivity, *that* would be a flaw.  

  **Conclusion:** The chain is not a problem but a virtue. It forces us to abandon S4, but this loss is justified by the theory’s ability to reconcile local possibilities (small changes) with global impossibilities (being a tree). The real burden lies with the objector to defend S4’s necessity—without merely assuming it.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  | **Criteria**                                                                 | **Marks** | **Notes on Common Errors** |  
  |------------------------------------------------------------------------------|-----------|----------------------------|  
  | **Core Analysis (10 marks)**                                                 |           |                            |  
  | (a) Correctly identifies possibility requires *direct* counterparts (not chains). | 3 | Confuses chain endpoints with direct counterparts (e.g., “The tree *is* a counterpart via the chain”). |  
  | (b) Explains non-transitivity of counterpart relation *and* its role in blocking “I could be a tree.” | 4 | Assumes transitivity without argument; misses that non-transitivity is intentional. |  
  | (c) Recognizes S4 (◊◊P → ◊P) fails and links this to world-relativity of counterpart relations. | 3 | Claims S4 holds; fails to connect iterated modalities to shifting similarity standards. |  
  | **Critical Evaluation (6 marks)**                                            |           |                            |  
  | (d) Argues whether the chain is a problem (full credit for clear verdict).   | 2 | Fence-sitting; e.g., “It’s problematic but maybe not.” |  
  | (e) Shows non-transitivity is *explanatory* (blocks absurdities while allowing small changes). | 3 | Treats non-transitivity as a flaw to be “fixed” rather than a feature. |  
  | (f) Identifies S4 rejection as the cost *and* argues it is acceptable/tolerable. | 1 | Only notes S4 fails without evaluating implications. |  
  | **Structure & Clarity (4 marks)**                                            |           |                            |  
  | Logical flow, precision, avoidance of irrelevancies (e.g., Humphrey objection). | 4 | Digresses into Humphrey objection; unstructured response. |  

  **Grade Boundaries:**  
  - **A (17–20):** Explicitly demonstrates that non-transitivity is a *virtue* (not a bug) that resolves the tension between small-step possibilities and radical impossibilities. Defends S4 rejection as a trade-off for explanatory power. Avoids reciting standard objections.  
  - **B (13–16):** Correctly explains the chain’s challenge and Lewis’s non-transitivity reply but treats S4 failure as an *unexamined cost* or fails to show why non-transitivity is necessary for the theory’s coherence. May mention Humphrey.  
  - **C (9–12):** Recites the Humphrey objection/Lewis’s reply without engaging the chain. Confuses transitivity or S4 implications.  
  - **D (5–8):** Misstates counterpart theory basics; asserts transitivity or S4 holds without argument.  
  - **F (0–4):** Incoherent or irrelevant.  

  ---  
  **Rationale for Rigor:** The A/B divide hinges on whether students see non-transitivity as *doing work* (A) versus merely noting it exists (B). Top answers must recognize that the cost is *not* allowing absurd possibilities but *abandoning an intuition* (S4), which the objector must justify.
