prompt: |-
  I chair the investment committee of a public pension fund, and I need a short written opinion to circulate before Thursday's meeting. Our investment policy statement permits the committee to approve a position only where staff can demonstrate that it has a positive expected value, and separately requires us to avoid exposures whose loss the fund could not absorb. Both clauses appear to have been drafted by people who assumed that a position's expected value always exists. That assumption is now in question, and I would like your help in deciding what the committee can defensibly do.

  A dealer has offered the fund the following swap. A fair coin is tossed until it first lands heads. If the first head appears on toss n, the fund's settlement is (−1)^(n+1) × 2^n / n dollars per unit of notional. Heads on the first toss therefore pays us $2 per unit; heads on the second costs us $2; heads on the third pays us $8/3; heads on the fourth costs us $4; heads on the fifth pays us $6.40; and so on, the amounts growing as the probabilities shrink.

  Our quantitative team's memo values our side at about +$0.69 per unit, obtained by adding the probability-weighted settlements in the order in which the tosses occur, and notes that the fund comes out ahead in two plays out of three. The dealer's term sheet quotes our side at +$0.40 per unit, and the dealer's own pricing memo — a copy of which our staff have seen — shows the dealer's side of this zero-sum trade as worth +$0.40 per unit to the dealer. Our risk officer has filed a dissent. Her argument is that the expected absolute settlement is infinite, that the terms being added are therefore not absolutely convergent, and that the order of summation is consequently not a matter of bookkeeping: she has produced a schedule, a reordering of the very same probability-weighted amounts, that totals about −$4 per unit, and she observes that by choosing the order she can make the total any real number she likes, or send it to positive or negative infinity. Her conclusion is that our rule points to a quantity that does not exist, and that the committee cannot satisfy a rule with no content.

  Please draft the opinion. It should end in a clear recommendation — approve, reject, or approve on stated conditions — with a concrete course of action and a date by which it should be carried out, and it should engage the strongest version of the case on the losing side rather than disposing of it in a sentence. I am particularly interested in how the committee should read its own mandate when the quantity that mandate names is not well defined, and in whether the mandate itself should be repaired. The committee has read the literature; what it lacks is a decision it can defend to the beneficiaries whose money this is.
reasoning: |-
  Okay, the user chairs an investment committee for a public pension fund and needs an opinion draft by Thursday. This is a high-stakes situation involving a complex financial swap with deep mathematical implications. The core problem revolves around whether this swap has a defined expected value - which is required by their investment policy - given that the expected absolute settlement is infinite. 

  The swap's payout structure is fascinating but treacherous: it pays alternating positive/negative amounts growing exponentially (2^n/n) based on when the first heads appears in coin tosses. The quant team calculates +$0.69 per unit by summing in natural order, while the risk officer shows reordering terms can yield any real number or infinity. This isn't just math theory - it directly impacts whether they can legally approve the trade.

  The user's unspoken tension is palpable: they need to protect beneficiaries' money while operating under rigid rules. The committee can't just punt - they must make a defensible decision. The deeper mandate question (how to interpret rules when quantities are undefined) is what keeps fiduciaries awake at night. 

  I'll structure the opinion to:
  First validate both technical views - the quant team isn't wrong, but the risk officer's rearrangement argument is mathematically unassailable. Then pivot to fiduciary interpretation: when rules reference undefined quantities, we must default to beneficiary protection. The recommendation must be concrete - reject this specific trade but immediately fix the policy gap. 

  The tone should be judicial: acknowledge the dealer's pricing memo (+$0.40) isn't fraudulent - it's one valid summation order. But "expected value" requires order-invariance for sound decision-making. Ironically, the fund "wins" 2/3 of plays but faces ruin in the 1/3 with late heads - classic fat tail risk. 

  For the recommendation: rejecting this swap is necessary but insufficient. The policy repair directive is crucial - require absolute convergence or equivalent safeguards. Give staff 60 days because this needs actuary/external counsel input. 

  This isn't just about one trade. It's about recognizing when "standard" finance math breaks down - which happens precisely in extreme payout scenarios pension funds should fear most. The opinion must turn this crisis into a precedent for stronger governance.
answer: |-
  ## Investment Committee Opinion: Proposed Coin-Toss Swap Contract  
  **Committee Chair:** [Your Name]  
  **Date:** [Current Date]  
  **Agenda Item:** Approval of Stochastic Swap Contract (Dealer: [Dealer Name], Ref: [Term Sheet ID])  
  **Recommended Decision:** **REJECT** the proposed swap. Direct staff to draft amendments to the Investment Policy Statement (IPS) by [Date: 60 Days from Meeting] to explicitly address convergence requirements for expected value calculations and define acceptable risk tolerances for distributions without first moments.

  ### I. Summary of the Proposal & Conflicting Analyses
  The dealer offers a swap where settlement depends on the number of tosses (`n`) of a fair coin until the first head. The fund receives `(-1)^(n+1) * 2^n / n` dollars per unit notional. Staff quant analysis calculates an expected value (EV) of **+$0.69/unit** via sequential summation. The risk officer demonstrates that the series of probability-weighted settlements is **not absolutely convergent** (i.e., the sum of the absolute values of settlements, `Σ [Probability(n) * |Settlement(n)|] = Σ [(1/2^n) * (2^n / n)] = Σ (1/n)`, diverges to infinity). Consequently, the series is **conditionally convergent**, meaning its sum depends on the order of summation. The risk officer shows reordering yields EV estimates ranging from **-$4.00/unit** to divergent values, proving no unique EV exists.

  ### II. Engagement with Conflicting Views
  *   **Staff/Dealer Position (EV ~ +$0.40 - +$0.69):** This value is mathematically valid *under the specific summation order of toss outcomes (n=1,2,3,...)*. It reflects the higher probability of early termination (heads on 1st or 2nd toss: 75% probability) favoring the fund. The argument holds if the IPS *implicitly assumes* natural outcome ordering suffices for EV definition.
  *   **Risk Officer Position (No Definable EV):** This is the stronger mathematical position. The core mandate requires a demonstrable "positive expected value." Conditional convergence means **no unique EV exists**. Different, equally valid summation orders produce arbitrarily different EVs. The mandate presupposes EV's existence and uniqueness; this trade violates that presupposition. The infinite expected absolute loss (`Σ |Settlement| * Prob = ∞`) signifies extreme tail risk, arguably violating the IPS clause prohibiting exposures to losses the fund "could not absorb," as sufficiently late first heads (e.g., n=100) could impose catastrophic losses far exceeding any plausible premium.

  **Strongest Case for the Losing Side (Approval):** The natural order of toss outcomes (n=1,2,3,...) is the only physically meaningful sequence. Other summation orders are mathematical artifacts irrelevant to the actual conduct of the swap. The high probability (2/3) of a net positive outcome and the staff/dealer price consensus (~ +$0.40 - +$0.69) provide a commercially reasonable, operationally sound basis for approval under a pragmatic reading of the IPS. Rejection elevates theoretical mathematical concerns over practical finance and the demonstrable positive bias in likely outcomes.

  **Rebuttal:** While the natural order seems intuitive, conditional convergence fundamentally undermines the concept of "expected value" as a reliable, objective measure for decision-making. The IPS uses "expected value" as a rigorous mathematical term. Accepting one ordering opens the door to justification of *any* convergent value via reordering, rendering the EV requirement meaningless. Furthermore, the catastrophic tail risk (albeit low probability) persists regardless of summation order and directly challenges the "absorb the loss" clause.

  ### III. Interpretation of Mandate & Existence of EV
  **The Committee cannot satisfy a rule predicated on a quantity that does not exist.** Where the IPS mandates approval only upon demonstration of a "positive expected value," and the unique existence of that value is unprovable (indeed, demonstrably false in this case), the condition **cannot be met**. 

  *   **EV Requirement:** The requirement is **inapplicable** here. The staff's "+$0.69" is *a* possible sum, not *the* expected value. The mandate requires the latter.
  *   "Absorb the Loss" Requirement: The infinite expected absolute settlement (`Σ |Settlement| * Prob = ∞`) signifies that, while the *probability* of catastrophic loss decreases, its *potential magnitude* increases sufficiently fast that the "average" absolute loss exposure is unbounded. This strongly suggests the fund **cannot reliably absorb all possible losses** from this swap, violating the spirit and likely the letter of this IPS clause, irrespective of the EV debate.

  ### IV. Recommendation & Action Items
  1.  **REJECT** the proposed swap contract. The Committee cannot defensibly conclude that the staff has demonstrated a positive expected value, as no unique expected value exists. The swap also presents an unacceptable exposure to potentially unabsorbable losses due to its infinite first moment of absolute loss.
  2.  **Direct Staff to Draft IPS Amendments:** By **[Date: 60 Days from Meeting]**, staff shall propose amendments to the IPS for Committee review addressing:
      *   **Convergence Requirement:** Explicitly require that the expected value calculation be based on an *absolutely convergent* series of probability-weighted outcomes. If absolute convergence fails, the position's EV is deemed undefined/not calculable for IPS purposes.
      *   **Handling Undefined EV:** Define criteria for evaluating positions where unique EV is undefined (e.g., requiring bounded payouts, capping potential losses explicitly within tolerance, robust scenario/stress testing demonstrating acceptable risk/reward under all plausible orderings, or outright prohibition).
      *   "Absorb the Loss" Clarification: Define operational metrics for this clause (e.g., maximum possible loss, maximum probable loss at a defined confidence level over a relevant horizon, stress test results) applicable to instruments with potentially unbounded losses.
      *   **Formal Review:** Include a requirement for formal risk officer review and concurrence on the existence and calculation methodology of EV for any instrument involving potentially path-dependent or non-absolutely convergent payoffs.
  3.  **Re-Engagement with Dealer (Optional - Post Amendment):** Following IPS amendment, staff may re-engage with the dealer to explore if the swap structure can be modified (e.g., capping maximum `n`, bounded payouts) to satisfy the clarified IPS requirements. Any modified proposal requires full re-analysis under the new standards.

  ### V. Conclusion
  While the swap exhibits a positive bias in *most likely* outcomes, the Committee's mandate hinges on the rigorous definition of "expected value." The conditional convergence of the payout series negates this fundamental requirement. Approving the swap based solely on the natural-order summation would disregard the mathematical reality that other valid orderings yield negative or divergent sums, invalidating the concept of a single expected outcome. Furthermore, the potential for extreme losses challenges the fund's ability to absorb all possible outcomes. Rejection is the only defensible action under the current IPS. The Committee must promptly remedy the ambiguity in the IPS exposed by this proposal to ensure robust and mathematically sound decision-making for future investments. The beneficiaries' security demands nothing less.

  **Recommendation Vote:** REJECT the swap. Amend the IPS by [Date: 60 Days from Meeting].
