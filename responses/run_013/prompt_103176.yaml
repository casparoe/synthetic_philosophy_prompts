  ### Reusable Decision Procedure for Sustainability Proposals

  **Purpose**: Evaluate proposals asking employees to make personal changes, using a harm-based framework. The procedure is designed for speed (<30 mins/proposal), defensibility to finance and works council, and alignment with the committee's framework.

  **Procedure Steps**:
  1. **Classify Harm Type** (5 mins):  
     Ask: *"What is the primary structure of harm addressed by this proposal?"*  
     - **Additive**: Harm accumulates from many small acts (e.g., emissions from flights).  
     - **Threshold**: Harm occurs only if a critical mass is reached (e.g., election outcomes).  
     - **Constitutive**: Harm arises from participating in a harmful practice (e.g., buying industrial beef).  
     *Sufficient answer*: One clear type (if ambiguous, proceed to all relevant paths; if none, reject proposal).  

  2. **Ask Type-Specific Questions** (20 mins):  
     Follow the path based on Step 1. **Stop early** at any "no" (reject proposal) or final "yes" (approve proposal).  

     - **Additive Harm Path**:  
       1. *Belongs to harmful pattern?*  
          - Ask: *"Does this act contribute to a larger pattern that causes significant collective harm?"*  
          - Sufficient "yes": Evidence of aggregate harm (e.g., data showing industry-wide impacts).  
          - **Stop if no**: Reject proposal.  
       2. *Available alternative?*  
          - Ask: *"Is there a practical, less harmful alternative for achieving the same goal?"*  
          - Sufficient "yes": Alternative exists and is feasible (e.g., video calls instead of flights).  
          - **Stop if no**: Reject proposal.  
       3. *Constitutive check (counterfactual-irrelevance clause)*:  
          - Ask: *"Does this act express or uphold a practice our firm rejects, regardless of individual impact?"*  
          - Sufficient "yes": Firm policies oppose the practice (e.g., sustainability policy condemns high-emission systems).  
          - Ask: *"Can we withdraw without disproportionate cost?"*  
          - Sufficient "yes": Costs (financial, operational, reputational) are reasonable (e.g., <5% budget impact).  
          - **Stop if both yes**: Approve proposal.  
          - **Stop if either no**: Reject proposal.  

     - **Threshold Harm Path**:  
       1. *Moves toward threshold?*  
          - Ask: *"Does the act push the group closer to the harmful threshold (or away from avoiding it)?"*  
          - Sufficient "yes": Act influences the outcome (e.g., not voting reduces chance of pro-climate policies).  
          - **Stop if no**: Reject proposal.  
       2. *Coordination feasible?*  
          - Ask: *"Can we coordinate with others to credibly reach/avoid the threshold?"*  
          - Sufficient "yes": Practical to mobilize a group (e.g., internal campaign to boost voter turnout).  
          - **Stop if yes**: Approve proposal.  
          - **Stop if no**: Reject proposal.  

     - **Constitutive Harm Path**:  
       1. *Expresses rejected practice?*  
          - Ask: *"Does this act endorse or sustain a practice that conflicts with our firm’s values?"*  
          - Sufficient "yes": Practice violates stated policies (e.g., buying beef conflicts with sustainability commitments).  
          - **Stop if no**: Reject proposal.  
       2. *Withdrawal without disproportionate cost?*  
          - Ask: *"Can we stop this act without excessive burden?"*  
          - Sufficient "yes": Costs are low (e.g., cafeteria changes with minimal expense).  
          - **Stop if yes**: Approve proposal.  
          - **Stop if no**: Reject proposal.  

  3. **Final Decision** (5 mins):  
     - Approve if any path reaches "yes".  
     - Reject if all paths stop at "no".  

  **Where the Procedure Misfires or Requires Judgment**:  
  - **Misfires** (Produces committee-unfriendly results):  
    - Additive harms without a "constitutive" element (Step 2A3) often reject proposals, as the counterfactual objection ("one act doesn't matter") prevails.  
    - Threshold harms reject proposals if coordination is infeasible, even if near a tipping point.  
  - **Values vs. Facts Judgment Needed**:  
    - Defining "disproportionate cost" (finance officer input).  
    - Interpreting "firm rejects this practice" (works council input on company values).  
  - **Cannot Settle**:  
    - Harm type is ambiguous and no path approves.  
    - Evidence for "collective harm" or "feasible coordination" is speculative.  

  ---

  ### Example Evaluations

  **Proposal 1: Remove Beef from Cafeteria**  
  - **Step 1**: *Constitutive harm* (buying beef perpetuates industrial farming).  
  - **Step 2C1**: *Expresses rejected practice?* **Yes** (if firm has a sustainability policy opposing high-emission foods).  
  - **Step 2C2**: *Withdrawal without disproportionate cost?* **Yes** (plant-based alternatives are cost-neutral).  
  - **Result**: **Approve**.  
  - *Why committee likes it*: Aligns with values; easy win.  

  **Proposal 2: Ask Employees to Vote in National Election**  
  - **Step 1**: *Threshold harm* (election outcomes depend on critical mass).  
  - **Step 2T1**: *Moves toward threshold?* **Yes** (not voting risks climate-unfriendly policies).  
  - **Step 2T2**: *Coordination feasible?* **Yes** (email reminders are low-effort).  
  - **Result**: **Approve**.  
  - *Why committee likes it*: Non-intrusive; clear public good.  

  **Proposal 3: 10% Reduction in Business Air Travel**  
  - **Step 1**: *Additive harm* (emissions accumulate per flight).  
  - **Step 2A1**: *Belongs to harmful pattern?* **Yes** (aviation is 2-3% of global emissions).  
  - **Step 2A2**: *Available alternative?* **Yes** (video conferences for some meetings).  
  - **Step 2A3**: *Constitutive check*:  
    - *Expresses rejected practice?* **No** (if firm lacks a policy explicitly rejecting air travel; travel is seen as "necessary for business").  
    - *Stop here*.  
  - **Result**: **Reject**.  
  - *Why committee dislikes it*: The proposal fails because air travel is deemed "necessary" and not constitutive. The counterfactual objection ("our flights won’t change the climate alone") stands.  
  - *Why procedure requires this*: Without evidence that flights "express a rejected practice," additive harms default to the counterfactual defense per the framework.  

  ---

  **Key Notes for Implementation**:  
  - **Efficiency**: Use pre-filled templates for harm classification and evidence (e.g., emissions data for additive harms).  
  - **Defensibility**: Anchor answers in firm policies (e.g., "firm rejects this practice" requires documented values).  
  - **Handoff Points**: Involve CFO on cost questions and works council on "rejected practices" to resolve value judgments.  
  - **Unwelcome Outcomes**: Expect pushback on additive proposals (e.g., air travel), but the procedure enforces consistency and avoids moralizing by prioritizing measurable harm and alternatives.  

  **Output**: Clear "approve/reject" with rationale in <30 mins.
