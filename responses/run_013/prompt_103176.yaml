          2C2: If we did 2C1 as no, we stop: no change required.

          Alternatively, if we consider the firm's general commitment to sustainability, then not participating in a global event might be seen as not supporting the movement. But the framework says "a practice the firm rejects". If the firm hasn't taken a stand on Earth Hour, then it's not rejected? 

