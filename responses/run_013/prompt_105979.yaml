answer: |-
  ### Crux  
  Distinguishing between mathematical bijection, physical process, and the discarded part-whole axiom in Hilbert’s Hotel.

  ### Question (150 words)  
  "In Hilbert’s Hotel (fully occupied), the clerk moves Guest 1 to Room 2, Guest 2 to Room 3, and so on forever, freeing Room 1. Since this process never stops, can it truly *finish*? Does this mean:  
  (a) The final pairing (new guest in Room 1, original guest N in Room N+1) is invalid?  
  (b) The physical story of 'moving' guests is flawed, but the *pairing itself* still works without moving anyone?  
  (c) We must reject the old rule 'a whole is greater than its parts'?  

  Explain which option(s) resolve the paradox. Is the hotel a story about abstract pairings, not physical tasks? What must we abandon to accept it?"

  ---

  ### Model Answer (480 words)  
  The paradox is resolved by embracing (b) and (c), while recognizing that (a) is false. The "moving" story is a thought experiment illustrating a mathematical truth—not a physical process.  

  **1. The pairing is valid without movement (b):**  
  The hotel demonstrates a *bijection*: a one-to-one pairing between sets. Initially, guests (G1, G2, ...) pair with rooms (1, 2, ...). After adding one guest, we *reassign* rooms: new guest to Room 1, G1 to Room 2, G2 to Room 3, etc. This new pairing exists as a completed state. No "moving" is required—we simply define the new arrangement. The clerk’s endless task highlights that *executing* this reassignment sequentially is impossible, but the abstract pairing stands independent of time or motion.  

  **2. Rejecting the part-whole principle (c) is essential:**  
  The paradox challenges Euclid’s axiom: "The whole is greater than the part." Here, the hotel (whole) has the same "size" as its subset of guests *excluding Room 1* (a part). We *must* abandon this axiom for infinite sets. Cardinality (size) for infinities depends on bijection, not subsets. This doesn’t imply all infinities are equal (Cantor’s work shows otherwise), but it requires accepting that an infinite set can equal a "smaller" subset.  

  **3. The physical story is illustrative but dispensable (b):**  
  The clerk’s task *cannot* be completed in a physical world—it’s an "endless job." But the hotel’s core claim relies *only* on the static bijection, not the moving narrative. The story is pedagogical: it forces us to confront infinite sets’ counterintuitive properties. However, calling the hotel "just words" misses the point. It reveals how infinite collections *behave* under mathematically rigorous rules.  

  **Conclusion:**  
  The hotel works by prioritizing mathematical bijection (a) over physical process (b) and discarding the part-whole axiom (c). The "moving" narrative (b) is useful imagery but logically unnecessary—the pairing (a) is defined all at once. We surrender (c) to enter Cantor’s world, where size is defined by pairing, not wholes-parts intuition. The hotel isn’t "nonsense"; it’s a gateway to set theory’s foundations.

  ---

  ### Marking Scheme (20 points)  
  **Award points for:**  
  - **+3** Distinguishing the *completed pairing* from the *impossible moving process*.  
  - **+3** Stating the bijection exists without physical movement (b).  
  - **+4** Explicitly rejecting the part-whole principle (c) as essential to resolve the paradox.  
  - **+3** Identifying the clerk’s task as illustrative but not foundational to the bijection.  
  - **+2** Noting that infinities *can* have different sizes (e.g., via Cantor), but that’s not the hotel’s lesson.  
  - **+2** Arguing the hotel reveals how infinite sets *are defined* (via bijection), not just "infinity is weird."  
  - **+3** Clear structure, using the (a)/(b)/(c) framework.  

  **Deduct points for:**  
  - **-3** Claiming the moving process *must finish* for the pairing to be valid (confuses a/b).  
  - **-3** Dismissing the hotel as "impossible" or "nonsense" due to unfinished moving.  
  - **-2** Equating Hilbert’s Hotel with "different sizes of infinity" (e.g., countable vs. uncountable).  
  - **-2** Asserting the part-whole principle *must* hold for infinity (defends c).  
  - **-2** Blurring (a) and (b) (e.g., "the pairing works *because* guests move").  
  - **-1 per instance** Vague appeals to "infinity is weird" without engaging (a)/(b)/(c).  

  **Top answers (16–20)** isolate the mathematical core (a), discard the physical analogy (b), and name the sacrificed axiom (c). **Weak answers (≤10)** fixate on "unfinishable tasks" or misapply Cantor.  

