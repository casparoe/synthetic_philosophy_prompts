  ### Dialogue: Growth-Optimal Bettor (Alice) vs. Expected-Utility Theorist (Bob)

  **Setting:** A university common room after a seminar. Alice and Bob, both well-versed in decision theory, debate over coffee.

  ---

  **Alice:** Let’s start with the simplest case: a single bet where you stake a fraction \(f\) of your wealth, and with 50% probability, it doubles (so wealth becomes \(W(1 + f)\)), or halves (wealth becomes \(W(1 - 0.5f)\)). How much would you bet, Bob?

  **Bob:** For a one-off bet, I’d maximize expected wealth. The expectation is \(0.5 \times W(1 + f) + 0.5 \times W(1 - 0.5f) = W(1 + 0.25f)\). It’s linear in \(f\), so I’d bet everything: \(f = 1\). Expected wealth rises by 25%, and if I’m risk-neutral, that’s rational.

  **Alice:** But if you bet \(f = 1\), you have a 50% chance of ending up with half your wealth. Now, imagine this bet repeated 100 times. With \(f = 1\), your *expected* wealth is \(W_0 \times (1.25)^{100} \approx W_0 \times 4.9 \times 10^9\), astronomically high. But what’s the *typical* outcome? Simulate it: most paths have you losing about half the time. After 50 wins and 50 losses, wealth is \(W_0 \times (1+1)^{50} \times (1-0.5)^{50} = W_0 \times 2^{50} \times 0.5^{50} = W_0\). The median outcome is zero growth, but the mean is skewed by the tiny chance of winning all 100 bets. You’ll almost surely underperform the expectation.

  **Bob:** I agree the distribution is skewed, but that’s a statistical fact, not a normative argument. My choice to maximize expectation reflects my preferences. If I’m risk-neutral, I accept the volatility for the higher mean. Your approach—maximizing expected log wealth—is just expected utility with \(u(W) = \log W\). You’re risk-averse, Alice. Why impose that on everyone?

  **Alice:** It’s not mere risk aversion. In multiplicative processes, the geometric mean dominates the long-run trajectory due to time-averaging. The arithmetic mean (expected wealth) diverges from what a single agent experiences. Maximizing expected growth rate aligns with the ergodic property: the time-average growth converges to the geometric mean. Betting \(f = 1\) gives a growth rate of \(0.5 \times \log(2) + 0.5 \times \log(0.5) = 0\), so wealth stagnates typically. My growth-optimal \(f^* = 0.5\) yields a growth rate of \(0.5 \times \log(1.5) + 0.5 \times \log(0.75) \approx 0.06\), compounding to 340× wealth in 100 bets. The typical path thrives.

  **Bob:** You’re conflating time averages with ensemble averages. For a *single* bet, your ergodicity argument vanishes. Suppose I face this bet once and then vanish. Why shouldn’t I maximize expected wealth? Your \(f = 0.5\) gives expectation \(W(1 + 0.25 \times 0.5) = 1.125W\), worse than \(1.25W\) at \(f = 1\). If I have linear utility, \(f = 1\) is rational. Log utility isn’t special here.

  **Alice:** But we’re rarely offered just one bet. Life is sequential. Even if the horizon is finite—say, 100 bets—the growth-optimal strategy maximizes the median final wealth. Betting \(f = 1\), your median wealth is \(W_0\) (as we saw), but with \(f = 0.5\), it’s \(W_0 \times (1.5^{50} \times 0.75^{50}) \approx W_0 \times 1.84\)—higher and less volatile. Expected wealth maximization ignores path dependency.

  **Bob:** Fair, but why must I care about the median? Expected utility theory allows me to weight outcomes by probability and utility. If I’m risk-seeking, I might prefer the 50% shot at doubling in one bet. Now, consider a favorable bet: 60% chance to double your stake, 40% to lose it. What fraction do you bet?

  **Alice:** Growth-optimal \(f^*\) maximizes \(0.6 \times \log(1 + f) + 0.4 \times \log(1 - f)\). Solving the first-order condition: \(\frac{0.6}{1+f} - \frac{0.4}{1-f} = 0\) gives \(f^* = 0.2\). The expected growth rate is positive, ensuring compounding without ruin.

  **Bob:** And I’d bet \(f = 1\) for maximum expectation: \(0.6 \times 2W + 0.4 \times 0 = 1.2W\). Your \(f = 0.2\) yields \(1.04W\), lower. Quantitatively, we disagree, but normatively, it’s preference. You’ve chosen log utility; I might have \(u(W) = W\) or \(u(W) = W^{1.5}\). Your “ergodicity” plea just smuggles in your risk aversion.

  **Alice:** No—it’s about survival and scalability. Bet \(f = 1\) repeatedly, and you’ll hit a loss and go broke. With \(f = 0.2\), you survive and grow. The Kelly criterion (\(f^* = 0.2\)) minimizes the expected time to reach a wealth goal and avoids ruin. This isn’t arbitrary; it’s adaptive for multiplicative environments.

  **Bob:** But what if I’m an institution? Suppose a hedge fund places 1,000 uncorrelated bets at once, each with independent 60% win probability. The fund splits capital equally. The law of large numbers kicks in: total wealth concentrates around the expectation. For a single bet, expectation is maximized at \(f = 1\). With diversification, I can bet aggressively on each—say, \(f = 0.5\) per bet—and expect near \(1.1 \times\) wealth per bet (since \(0.6 \times 1.5 + 0.4 \times 0.5 = 1.1\)). The variance vanishes with many bets. Here, ensemble reasoning works: I experience the arithmetic mean directly. Growth-optimality is unnecessary.

  **Alice:** Agreed—for simultaneous, independent bets, diversification replicates the ensemble average. But individuals face sequential risks where outcomes compound multiplicatively. Your fund can’t “diversify” across time. If it bets sequentially with \(f = 0.5\), it risks drawdowns that force suboptimal scaling. The growth-optimal fraction \(f^* = 0.2\) is robust across sequences.

  **Bob:** So institutions maximize expected wealth; individuals shouldn’t. But then your case for growth-optimality hinges on sequence length and correlation. If I face a fixed, short sequence—say, two bets—why not maximize expected wealth? Your ergodic argument weakens. After two bets, betting \(f = 1\) gives expectation \(1.44W_0\), while \(f = 0.2\) gives \(1.08W_0\). If I’m patient with risk, I prefer the former.

  **Alice:** Even in two bets, betting \(f = 1\) has a 16% chance of ruin (lose both) and a 36% chance of massive gain (win both). But ruin locks you out of future opportunities—multiplicative processes penalize bankruptcy irreversibly. Growth-optimality protects optionality. It’s not about long-run infinity; it’s about robustness in finite sequences.

  **Bob:** Still, you’re privileging log utility. Consider a one-shot gamble: win $1M with 50% probability, lose $500K otherwise. Expected wealth maximization says take it if you have >$500K. Growth-optimality? If wealth is $1M, you’d compute \(f\) such that you stake \(f \times 1\text{M}\) to win \(f \times 1\text{M}\) or lose \(0.5f \times 1\text{M}\). Maximizing expected log wealth gives \(f^* = 0.5\), staking $500K. But why is that “rational” for a one-off? If I’m risk-neutral, I’d stake the full $1M for higher expectation. Your ergodicity argument does no work here—it only applies to repetition.

  **Alice:** True, but most decisions aren’t isolated. Wealth carries forward, so losses harm more than equivalent gains help—a property log utility captures. Losing 50% requires a 100% gain to recover. Growth-optimality internalizes that. Still, for a truly one-shot gamble with no future, I’ll concede: maximize expected utility with your preferences. But in practice, we rarely face terminal gambles.

  **Bob:** So we agree: growth-optimality isn’t intrinsically rational; it’s context-dependent. Now, your four points:  
  1. **Risk aversion?** You admit growth-optimality is equivalent to log utility, so yes, it’s risk aversion—just not arbitrary.  
  2. **Indefinite sequence?** Your argument weakens for short horizons. Without repetition, ergodicity doesn’t apply.  
  3. **One-shot gambles?** Ergodic reasoning fails; only expected utility matters.  
  4. **Institutions?** With diversification, maximizing expected wealth is rational.  

  The core disagreement: you think multiplicative sequences *force* log utility on rational agents; I think it’s one choice among many.

  **Alice:** Not force—reveal. In multiplicative settings, the growth rate is the natural numeraire. Expected wealth maximization ignores path structure and risks ruin. But I’ll sharpen this: if an agent faces an unknown number of multiplicative bets, must they use growth-optimal betting to avoid almost-sure underperformance relative to the expected wealth path?

  **Bob:** Only if they care about long-run survival and typical outcomes. If they prioritize maximizing expected terminal wealth, accepting skew, they need not. The normative divide reduces to: **Must a rational agent optimize for the typical path in multiplicative processes, rather than the expected value?** I say no; you say yes.

  **Alice:** Precisely. And until we resolve that, we’ll disagree. More coffee?

  **Bob:** Gladly. Let’s simulate the 60-40 bet.

