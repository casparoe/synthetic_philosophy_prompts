     Case 3: Martian microscopic structure that resembles a cell but shows no detectable metabolism or heritable variation.

          I.1: Current bounded self-maintenance? 
              - It has a structure that resembles a cell -> that suggests a boundary? But is it produced and repaired by the system? We don't know. 
              - No detectable metabolism -> so no evidence of using energy and matter to maintain disequilibrium? 
              - So No.

          II.4: Past bounded self-maintenance? 
              - The cell-like structure might be evidence of a past boundary? And maybe past self-maintenance? 
              - We don't have evidence of past metabolism? But the structure might be fossilized. 
              - We might say: insufficient? But we have to make a call. 
              - Let's assume the panel decides: the structure is evidence of past boundary and possibly self-maintenance? So Yes for II.4.

          II.5: Past functional integration? 
              - The structure resembles a cell, which typically has functional integration? But we don't see the parts? 
              - We might say: insufficient? But the problem says "resembles a cell", so we might infer functional integration? 
              - Let's assume Yes.

          II.6: Past inheritance mechanism? 
              - We have no evidence of heritable variation or of a template? 
              - The problem says "no detectable metabolism or heritable variation", but it doesn't say anything about a template? 
              - We might look for evidence of DNA or something? But it's not detected? 
              - So No.

          Then we do Anomaly test B: 
              - Are there two independent lines of evidence that the past A and D (without B) are not explained by non-biological processes? 
              - We have one line: the cell-like structure. 
              - We might have a second? For example, the context (e.g., in a sedimentary rock that suggests a lake) or chemical signatures? 
              - The problem doesn't provide more. So we don't have two independent lines? 
              - Therefore, Anomaly test B fails? 

          Then we classify as LIFE_LIKE? 

          But the panel might not like this because it could be a fossil? 

          However, without evidence of an inheritance mechanism and without two independent lines for the anomaly test, we cannot classify as PAST_LIFE.

          So LIFE_LIKE.

     Now, we note that at least one of these outcomes might not be liked. The exoplanet disequilibrium is classified as non-life, which might be disappointing because it's a potential biosignature. But the procedure requires two lines of evidence for the anomaly test and we don't have that.

     What the procedure cannot do:

          - It cannot resolve philosophical disagreements about the definition of life. It encodes a particular view: 
              * Current life requires A, D, and an inheritance mechanism (B or the structure for it).
              * Past life requires the same but in the past.
              * Product of life requires two independent lines of evidence of biogenicity.

          - It relies on empirical evidence and the anomaly test. If the evidence is incomplete, it might classify as life-like or non-life when it is actually life.

          - It might misfire in cases of dormant life: if we don't see current A and D, and we don't have evidence of past A and D, then we might miss it.

          - It might also misfire for novel life that doesn't use a standard template for inheritance? We require evidence of an inheritance mechanism, which might be hard to get.

          - The steps that encode philosophical choices:
              * Requiring an inheritance mechanism for current life (step I.3) and past life (II.6). Some might argue that life can exist without heredity? 
              * The anomaly test itself: requiring two independent lines of evidence. Why two? It's a convention to reduce false positives.
              * The separation of current, past, product, and life-like: this is a choice to separate the categories.

     We now write the procedure in a formal way.

     Procedure Document:

     Life-Detection Classification Procedure

     Purpose: To classify a candidate system into one of:
          - CURRENT_LIFE: currently alive.
          - PAST_LIFE: was alive but not currently.
          - PRODUCT_OF_LIFE: a product of a living system but not alive.
          - LIFE_LIKE: mimics life but has a non-biological explanation.
          - LIFE_CANDIDATE: requires further study (anomaly test passed but insufficient for other categories).
          - NON_LIFE: no evidence of life and anomaly test negative.

     Steps:

     I. Current Life Assessment:
          1. Is there evidence of current bounded self-maintenance (criterion A)? 
              - Look for: a boundary produced and repaired by the system, and the system using energy and matter to maintain itself far from equilibrium.
              - If Yes, go to 2.
              - If No or Insufficient, go to II.
          2. Is there evidence of current functional integration (criterion D)?
              - Look for: parts that coordinate to sustain the whole, and the whole acting as a unit.
              - If Yes, go to 3.
              - If No or Insufficient, go to IV.
          3. Is there evidence of an inheritance mechanism? 
              - This can be:
                  a. Direct observation of heritable variation (criterion B): copying of a template with variation that affects the next generation's organization, OR
                  b. Structural evidence of a system that can store and transmit hereditary information (e.g., a template molecule or analog).
              - If Yes, classify as CURRENT_LIFE. Stop.
              - If No or Insufficient, then:
                  a. Conduct Anomaly Test A: 
                      - Are there two independent lines of evidence that the observed A and D (without B) are not explained by known non-biological processes?
                  b. If Anomaly Test A is Yes, classify as LIFE_CANDIDATE. Stop.
                  c. If Anomaly Test A is No, classify as LIFE_LIKE. Stop.

     II. Past Life Assessment:
          4. Is there evidence of past bounded self-maintenance (criterion A)? 
              - Look for: fossil or preserved evidence of a boundary and of self-maintenance (e.g., growth patterns, metabolic isotopes).
              - If Yes, go to 5.
              - If No or Insufficient, go to III.
          5. Is there evidence of past functional integration (criterion D)?
              - Look for: fossil or preserved evidence of coordinated parts (e.g., organelles, tissues) that suggest the whole was sustained by the parts.
              - If Yes, go to 6.
              - If No or Insufficient, go to III.
          6. Is there evidence of a past inheritance mechanism? 
              - This can be:
                  a. Evidence of heritable variation in the past (e.g., fossil record showing evolution, or preserved genetic material), OR
                  b. Structural evidence that suggests a hereditary system (e.g., double-stranded molecules in fossils, or division patterns).
              - If Yes, classify as PAST_LIFE. Stop.
              - If No or Insufficient, then:
                  a. Conduct Anomaly Test B: 
                      - Are there two independent lines of evidence that the past A and D (without B) are not explained by known non-biological processes?
                  b. If Anomaly Test B is Yes, classify as LIFE_CANDIDATE. Stop.
                  c. If Anomaly Test B is No, classify as LIFE_LIKE. Stop.

     III. Product of Life Assessment:
          7. Is the candidate a structure or molecule that is not alive (by I and II) and that shows evidence of being produced by a living system? 
              - We require two independent lines of evidence that the candidate is best explained as a biogenic product and cannot be explained by non-biological processes.
              - If Yes, classify as PRODUCT_OF_LIFE. Stop.
              - If No or Insufficient, go to IV.

     IV. Final Assessment:
          8. Does the candidate show any of the criteria A, B, C, D (in the present or past)? 
              - If Yes, then:
                  a. Is there a non-biological explanation that accounts for all the observed criteria? 
                  b. If Yes, classify as LIFE_LIKE. Stop.
                  c. If No, go to 9.
              - If No, go to 9.
          9. Conduct Anomaly Test C: 
              - Are there two independent lines of evidence that the candidate (with or without showing A, B, C, D) is not explained by known non-biological processes?
              - If Yes, classify as LIFE_CANDIDATE. Stop.
              - If No, classify as NON_LIFE. Stop.

     Record-keeping: 
          Use a form with:
              - Candidate identifier
              - Date
              - Panel members
              - Answers to each step (with notes on evidence and uncertainties)
              - Classification
              - Signature of chair

     Example form entry:

          Candidate: [Name]
          Step I.1: [Yes/No/Insufficient] [Notes]
          Step I.2: [Yes/No/Insufficient] [Notes]
          ... 
          Classification: [ ]

     We note: 
          - The chair must ensure the panel discusses each step and records the consensus or majority view.
          - "Insufficient" means the evidence is ambiguous or lacking. Then we proceed as "No" for classification purposes but note the uncertainty.

     This procedure should fit in a 90-minute meeting if the panel prepares in advance.

     Finally, we acknowledge that the procedure encodes philosophical choices:

          - The requirement of an inheritance mechanism (step I.3 and II.6) reflects a view that life must have the potential for evolution.
          - The separation of current and past life reflects a temporal distinction.
          - The anomaly test (with two independent lines) is a conservative approach to avoid false positives.

     It might not handle:

          - Digital or simulated organisms: 
              * They might show functional integration (D) and heritable variation (B) but not bounded self-maintenance in a physical sense? 
              * We would probably classify as LIFE_LIKE because we have a non-biological explanation (they are created by humans and run on computers) -> Step IV.8 would catch this.

          - Dormant organisms: 
              * They might fail I.1 (no current A) but we might not have evidence of past A and D? 
              * Then they might be missed until they become active? 
              * But if we can see the structure and it is consistent with past life, then II.4 and II.5 might be yes? 

          - Fossil-like structures: 
              * We rely on preserved evidence. If the preservation is poor, we might classify as LIFE_LIKE or LIFE_CANDIDATE.

     We hope this procedure brings clarity and consistency to the panel's work.
answer: |-
  ### Life-Detection Classification Procedure  
  **Purpose**: To classify candidates into:  
  - `CURRENT_LIFE` (actively alive),  
  - `PAST_LIFE` (dormant/fossilized but once alive),  
  - `PRODUCT_OF_LIFE` (biogenic but not alive),  
  - `LIFE_LIKE` (non-biological mimic),  
  - `LIFE_CANDIDATE` (anomaly requiring study),  
  - `NON_LIFE` (explained by non-biological processes).  

  **Procedure** (ask in order; stop at first definitive classification):  

  1. **Check for CURRENT_LIFE**:  
     - **Q1**: Is there **direct evidence of active self-maintenance** (criterion A)?  
       *Evidence required*: Energy consumption, boundary repair, and maintenance of disequilibrium (e.g., metabolism, growth).  
       - *Yes* → Proceed to Q2.  
       - *No/Insufficient* → Go to Step 2 (Past Life).  
     - **Q2**: Is there **direct evidence of functional integration** (criterion D)?  
       *Evidence required*: Parts coordinate to sustain the whole (e.g., organelles cooperating, response to environment).  
       - *Yes* → Proceed to Q3.  
       - *No/Insufficient* → Classify as `LIFE_LIKE` (fails integration).  
     - **Q3**: Is there **evidence of an inheritance mechanism** (criterion B)?  
       *Evidence required*: A replicable template (e.g., DNA/RNA analog) OR observed heritable variation.  
       - *Yes* → Classify as `CURRENT_LIFE`.  
       - *No/Insufficient* → Run **Anomaly Test**:  
         - Are ≥2 independent lines of evidence inconsistent with non-biological explanations for A + D?  
           - *Yes* → Classify as `LIFE_CANDIDATE`.  
           - *No* → Classify as `LIFE_LIKE`.  

  2. **Check for PAST_LIFE** (if not current):  
     - **Q4**: Is there **physical evidence of historical self-maintenance** (fossilized/dormant A)?  
       *Evidence required*: Preserved boundaries, metabolic residues, or dormancy structures (e.g., spores).  
       - *Yes* → Proceed to Q5.  
       - *No/Insufficient* → Go to Step 3 (Product of Life).  
     - **Q5**: Is there **physical evidence of historical functional integration** (fossilized/dormant D)?  
       *Evidence required*: Structured parts (e.g., cell walls, organelles) suggesting past coordination.  
       - *Yes* → Proceed to Q6.  
       - *No/Insufficient* → Classify as `NON_LIFE` (insufficient for life).  
     - **Q6**: Is there **evidence of a historical inheritance mechanism** (fossilized/dormant B)?  
       *Evidence required*: Preserved templates (e.g., genetic material) OR heritable variation in populations.  
       - *Yes* → Classify as `PAST_LIFE`.  
       - *No/Insufficient* → Run **Anomaly Test** for A + D:  
         - ≥2 lines of evidence rule out non-biology? *Yes* → `LIFE_CANDIDATE`; *No* → `LIFE_LIKE`.  

  3. **Check for PRODUCT_OF_LIFE** (if not current/past):  
     - **Q7**: Is the candidate a **biogenic byproduct**?  
       *Evidence required*: Chemical/mineral signatures exclusively from living processes (e.g., chiral molecules, biominerals).  
       - *Yes* → Run **Anomaly Test**:  
         - ≥2 lines of evidence rule out non-biology? *Yes* → `PRODUCT_OF_LIFE`; *No* → `LIFE_LIKE`.  
       - *No* → Classify as `NON_LIFE`.  

  4. **Final Anomaly Check** (if no prior classification):  
     - Run **Anomaly Test** without life criteria:  
       - ≥2 independent lines of evidence contradict non-biological explanations?  
         - *Yes* → `LIFE_CANDIDATE`.  
         - *No* → `NON_LIFE`.  

  **Key Rules**:  
  - **Stop at "No"**: If any step lacks sufficient evidence, move to the next stage.  
  - **Stop at "Yes"**: Current Life (Q3), Past Life (Q6), or Product of Life (Q7 with Anomaly Test pass).  
  - **Delegate to Humans**: If evidence is contradictory or hinges on unresolved philosophy (e.g., "Is evolution necessary for life?"), pause and vote. Record disagreements.  
  - **Record-Keeping**: Use this template:  
    ```  
    Candidate ID: [ ] | Date: [ ]  
    Q1: [Y/N/I] | Evidence: [1-2 sentences]  
    Q2: [Y/N/I] | Evidence: [1-2 sentences]  
    ... (through Q7)  
    Anomaly Test: [Pass/Fail] | Lines of evidence: [List]  
    Classification: [ ] | Notes: [e.g., unresolved debate on criterion B]  
    Chair: [Signature]  
    ```  

  ---  
  ### Test Cases  
  **Case 1: Exoplanet Disequilibrium**  
  - **Description**: Atmospheric O₂ and CH₄ in strong disequilibrium; no other data.  
  - **Procedure**:  
    - Q1 (Self-maintenance): **No** (no boundary/energy use observed).  
    - Q4 (Past self-maintenance): **No** (no fossil evidence).  
    - Q7 (Biogenic product): **No** (disequilibrium alone isn’t exclusively biogenic).  
    - Anomaly Test: **Fail** (only one line of evidence; abiotic processes like photochemistry can explain).  
    - **Classification**: `NON_LIFE`.  
  - **Why you won’t like this**: Disequilibrium is a biosignature candidate, but the procedure demands multiple lines of evidence. Without them, it defaults to non-life.  

  **Case 2: Lab Polymer Replicator**  
  - **Description**: Synthetic polymer replicates/evolves in a narrow range; technician must add templates.  
  - **Procedure**:  
    - Q1 (Self-maintenance): **No** (no boundary/self-repair; externally dependent).  
    - Q2 (Integration): **No** (parts don’t coordinate autonomously).  
    - Q3 (Inheritance): **Yes** (replicates with variation).  
    - **But** Q1/Q2 fail → Skip to Anomaly Test for Q3:  
      - Anomaly Test: **Fail** (non-biological replication is well-documented, e.g., crystal growth).  
    - **Classification**: `LIFE_LIKE` (mimics life but explainable abiotically).  

  **Case 3: Martian "Cell"**  
  - **Description**: Microscopic cell-like structure; no metabolism/variation detected.  
  - **Procedure**:  
    - Q1 (Self-maintenance): **No** (no metabolism).  
    - Q4 (Past self-maintenance): **Yes** (boundary resembles a cell).  
    - Q5 (Past integration): **Yes** (structure implies coordinated parts).  
    - Q6 (Past inheritance): **No** (no genetic material/variation).  
    - Anomaly Test for A+D: **Fail** (one line of evidence; abiotic mineral formations can mimic cells).  
    - **Classification**: `LIFE_LIKE`.  

  ---  
  ### Limitations & Philosophical Choices  
  **What the procedure CANNOT do**:  
  - **Resolve metaphysics**: Delegates questions like "Is evolution essential?" to panel votes.  
  - **Handle incomplete evidence**: May misclassify dormant life (e.g., spores) as `LIFE_LIKE` if metabolism is undetected.  
  - **Digital/simulated life**: Classifies as `LIFE_LIKE` (non-biological explanation exists: human-made code).  
  - **Contradictory data**: Requires chair to call a vote or defer.  

  **Where it misfires**:  
  - **False negatives**: Novel life lacking known inheritance mechanisms (e.g., prion-based) may fail Q3/Q6.  
  - **False positives**: Complex non-biological systems (e.g., hydrothermal vents) may pass Anomaly Test if evidence is sparse.  
  - **Products vs. life**: May mislabel biogenic products (e.g., ancient biomarkers) as `PAST_LIFE` without Q5/Q6.  

  **Philosophical choices embedded**:  
  1. **Inheritance is mandatory** (Q3/Q6): Encodes that life requires heritable variation (rejects "metabolism-only" definitions).  
  2. **Open-ended evolution (criterion C) is excluded**: Too speculative for rapid detection; replaced by practical inheritance check.  
  3. **Anomaly Test as gatekeeper**: Prioritizes avoiding false positives over false negatives (conservatism).  
  4. **Temporal separation**: Treats "active," "dormant," and "biogenic" as distinct (rejects continuum models).  

  **Recommendation**: Use this for 2–3 meetings, then revise based on edge cases. Focus on empirical evidence; let philosophical debates inform updates, not paralyze decisions.
