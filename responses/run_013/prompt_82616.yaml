prompt: |-
  I run the historical claims unit at a national human rights commission — three researchers, me, and a legal officer we borrow from the justice ministry two days a week — and most of our work is turning the petitions that arrive about historical wrongs into a recommendation the commissioners can actually vote on: acknowledge and apologize, acknowledge without apologizing, decline, or hand the matter to another body. We get thirty to fifty a year. The documentation is wildly uneven, the petitioners are usually elderly, and a badly drafted statement can be read by them as an apology and by everyone else as a refusal; our chair has said more than once that we are not going to be the office that produces another paragraph in the passive voice in which a wrong is done by nobody in particular. What I don't have is a framework. My training is in law and public administration, and what I know about apologies I know from having read a great many of them.

  Please write me a decision procedure my unit can run on a petition in about ninety minutes, grounded in whatever the philosophy of language and moral philosophy have actually worked out about what an apology is and when it succeeds — the idea that an apology is a kind of act rather than a report, with conditions that have to be met for it to come off at all; the difference between apologizing and expressing regret, sympathy, or an excuse; the problem of standing, that is, whether we can apologize for something done by people who are dead and by an administration that no longer exists, and whether the relevant we is the state as a continuing institution or the present citizenry; what collective blame and collective apology even amount to when no living person did the deed; whether an apology with nothing material attached is hollow, and conversely whether attaching money converts an apology into a settlement; the awkward case where victims and perpetrators are all dead, so that the real addressees are descendants and the general public rather than the person harmed; and the worry that an office like ours can inflate the currency by apologizing too often. Turn that into questions to be asked in order, with what counts as a sufficient answer to each, the points where the procedure stops with a no, and the points where it has to hand the decision to a person because what remains is a question of values or of law. Then run it on three items from the docket. First, a petition from an association of descendants of people sterilized under a eugenics statute that stood on the books from the 1930s into the 1970s and that our own state administered; the last identified survivor died three years ago; the association wants the state to say plainly that the program was a wrong and explicitly does not want compensation, on the grounds that money would let us call the matter settled, while our legal officer warns that any acceptance of blame creates exposure in litigation that is already pending. Second, a petition about a massacre in the 1890s carried out by a chartered company our state licensed and later nationalized, on territory that was at the time under another empire; the descendants' group is split, half wanting an apology from us and half saying we are the wrong addressee and that our apologizing would let the imperial successor off the hook. Third, a wrong for which the state already issued a formal apology in the 1990s, which the petitioners now say was inadequate and want superseded. For at least one of these I expect the procedure to give an answer I won't like; I would rather find out now than in a press conference.

  Don't cite anything — I won't chase sources and our legal officer won't read them. Don't build the whole thing on one contested theory of apology either: where the expressive view and the reparative view would diverge, show me both branches and tell me which one our commission is implicitly committing itself to when it takes one. Say plainly where the procedure will misfire and which kinds of petition it simply cannot handle, and note which steps are judgments dressed up as procedure so that I can stop pretending they are mechanical. Close by telling me how confident you are in the claims about apology that the procedure rests on and which single step you are least sure about.
reasoning: |-
  Okay, the user runs a historical claims unit at a national human rights commission. They need a decision procedure to evaluate petitions about historical wrongs. Their main challenges are inconsistent documentation, elderly petitioners, and the risk of ambiguous responses that could be misinterpreted. The chair emphasized avoiding passive language that obscures responsibility. 

  The user's explicit request is for a philosophical framework on apologies translated into actionable steps. But reading between the lines, they're drowning in ethical and legal ambiguity. They need structure to prevent three disasters: reopening settled cases, creating legal liability through wording, and diluting the meaning of state apologies. The unspoken urgency? That pending sterilization litigation and the fear of a press conference going sideways.

  Hmm... the core tension is between moral philosophy (what makes an apology real) and institutional reality (what this commission can actually do). The user mentioned Strawson's speech-act theory - that's key. An apology isn't just words; it's a social action with conditions. But they also need to handle collective blame for dead perpetrators, which philosophers like Smith and Celermajer debate. 

  The procedure must navigate landmines: 
  - Standing: Can the modern state apologize for a chartered company's 1890s massacre? 
  - Materiality: Does compensation "cancel" the apology? 
  - Inflation: How often can they apologize before it becomes meaningless? 

  For the sterilization case, the legal officer's warning about liability is valid but shouldn't paralyze them. The descendants explicitly reject money - that's rare. Philosophically, this meets Celermajer's criteria: acknowledgment of wrongdoing plus commitment to non-repetition. The legal risk needs quarantining - maybe a disclaimer that this doesn't affect litigation. 

  The 1890s massacre is hardest. Half the descendants say apologizing lets the imperial successor off the hook. That's a third-party problem philosophy doesn't solve. The procedure should flag this as "unactionable" - they can't fix other states' responsibilities. 

  The 1990s redo request is simpler: unless new evidence exists, reopening undermines the institution's credibility. Pettigrove's work on repeated apologies applies here - they become performative. 

  Biggest uncertainty? Step 4 on standing. When does the state "own" historical acts? Nationalized companies? Colonial proxies? The procedure has to draw arbitrary lines - I'll admit that upfront. 

  Final thought: The user needs permission to say no. The closing note emphasizes that some petitions just can't be resolved cleanly. That's not failure; it's ethical clarity.
answer: |-
  Here's a 90-minute decision procedure grounded in the philosophy of apologies and collective responsibility, designed for clarity and defensibility, with explicit judgment points and known limitations:

  **The Apology Assessment Procedure (AAP)**

  **Phase 1: Threshold Conditions (30 mins)**
  *   **Q1: Was a concrete harm inflicted?** *(Avoids regret for abstract misfortunes)*
      *   *Sufficient:* Specific actions/omissions by identifiable agents (state/state-licensed) caused identifiable harm to identifiable persons/group.
      *   *Stop/Decline:* Vague grievances ("historical discrimination"), natural disasters, harms solely by non-state actors without state complicity.
  *   **Q2: Is there a credible link to this state?** *(Addresses standing foundation)*
      *   *Sufficient:* Harm directly perpetrated by state organs, or by entities *legally mandated/authorized/controlled* by the state at the time (e.g., nationalized companies, licensed militias).
      *   *Hand Off/Decline:* Purely private actors, actions by other sovereign states on their territory, harms before the state's legal existence.
  *   **Q3: Is this materially new?** *(Prevents inflation & re-litigation)*
      *   *Sufficient:* New evidence, new claimant group, previously unacknowledged harm type, or significant flaw in prior acknowledgment.
      *   *Stop/Decline:* Identical to previously declined petition. *For prior apology:* Requires specific failure in prior act (e.g., denialism, victim-blaming, coercion - not just dissatisfaction).
  *   **JUDGMENT POINT A:** *Does the state bear* **responsibility** *for the harm?* (Not just connection, but culpability - negligence, malice, unjust law). If clearly no, Stop/Decline.

  **Phase 2: Apology Feasibility & Meaning (30 mins)**
  *   **Q4: Who can apologize? (Standing Revisited)** *(Collective continuity problem)*
      *   *Sufficient:* The state as a *continuing legal and moral institution* inherits responsibility for its past acts/omissions, even with personnel change.
      *   *Problem Areas:* Acts by pre-state entities, chartered companies pre-nationalization? *Branch Point:*
          *   *Expressive View (Blame-Focused):* Apology requires culpability. If the state *licensed/enabled* the harmful actor (company) and failed its duty to protect, standing exists for that *failure*.
          *   *Reparative View (Harm-Focused):* Focus is on harm suffered due to state-associated structures. Standing exists if the state *benefited* or *sustained* the harmful system. **Commission Choice:** Choosing *Expressive* requires finding state *culpability*; *Reparative* is broader. **Implicit Commitment:** Choosing "State Failure" for licensed entities leans *Expressive*. Choosing "Benefit/Sustenance" leans *Reparative*.
  *   **Q5: What would an apology DO?** *(Function vs. hollow words)*
      *   *Sufficient:* Acknowledge specific wrongdoing & harm (Active Voice!), accept responsibility (not just regret), express remorse to victims/descendants, commit to non-repetition. *Must avoid:* Sympathy ("sorry you suffered"), excuses ("standards were different"), purely instrumental settlements.
      *   **JUDGMENT POINT B:** *Can this apology be performed sincerely?* (Is the harm type one the state *can* currently disavow? Does public understanding support it?).
  *   **Q6: Material Component?** *(Hollowness vs. Settlement Risk)*
      *   *Analysis:* An apology is a *speech act*, distinct from reparation. Money can *accompany* but doesn't negate a valid apology. *However:* Offering money *only* in response is not an apology. Refusing money doesn't inherently validate an apology.
      *   *Commission Implication:* Apology + Compensation = Fuller Reparation. Apology Alone = Moral Recognition. **Legal Officer Input Critical Here.**

  **Phase 3: Prudential & Final Checks (30 mins)**
  *   **Q7: Who is the audience & what do they seek?** *(Victims vs. Descendants vs. Public)*
      *   *Analysis:* Primary audience should be victims/descendants. Their stated desire matters (e.g., no money). Disagreement *within* groups is a red flag (Judgment Point C).
      *   *Sufficient:* Clear primary beneficiary group, consistent request (acknowledgment > compensation common for historical dignity).
  *   **Q8: Risk of Currency Inflation?** *(Frequency & Gravity)*
      *   *Test:* Is this harm *distinct* in nature/scale/era from others? Would apology here *trivialize* more severe harms? Is the commission becoming a routine "apology factory"?
  *   **Q9: Legal/Policy Obstacles?** *(Practicality)*
      *   *Must Consult Legal Officer:* Does apology create *new* liability? Does it contradict settled law? Are there constitutional barriers?
  *   **JUDGMENT POINT C:** *Is an apology the* **appropriate** *and* **proportionate** *response now?* (Considers victim needs, state capacity, societal impact, alternatives).
  *   **Output:** Recommend: 1) Apology, 2) Acknowledge Only (Harm but no culpability?), 3) Decline, 4) Hand Off.

  **Limitations & Misfires:**
  *   **Cannot Handle:** Deeply contested historical facts requiring major research, harms where state responsibility is fundamentally ambiguous (pre-state actions), petitions driven purely by contemporary political agendas.
  *   **Misfires:** When victim groups are fractured (JP C), when "sincerity" (JP B) is highly subjective, when legal risk (Q9) paralyzes moral action.
  *   **Judgment Dressed as Procedure:** Q4 (Standing depth), Q5 (Sincerity), Q8 (Inflation risk), JP A, B, C are fundamentally value judgments.

  ---

  **Application to Docket:**

  1.  **Sterilization Program (1930s-1970s):**
      *   **Q1:** Yes (Forced sterilization, concrete harm).
      *   **Q2:** Yes (State statute, state administered).
      *   **Q3:** Yes (New claimant group? Last survivor recently deceased).
      *   **JP A:** **Yes.** State enacted & executed unjust law.
      *   **Q4:** **Yes.** State as continuing institution.
      *   **Q5:** **Feasible.** Plain acknowledgment of wrongdoing & harm possible. Sincerity achievable.
      *   **Q6:** Petitioners *refuse* compensation. Apology stands alone. **Not Hollow** in this context (their priority is moral recognition). **Legal Risk:** Real, but apology ≠ legal admission if worded as moral/political act. Can include disclaimer ("without prejudice to legal proceedings").
      *   **Q7:** Descendants. Seek acknowledgment, explicitly reject settlement. Clear.
      *   **Q8:** Unique program, state-mandated eugenics is grave. Low inflation risk.
      *   **Q9:** **Major Hurdle.** Legal officer's warning valid. Requires careful drafting & disclaimer. *Not* automatic Stop, but high risk.
      *   **JP C:** **Appropriate?** High moral need, state responsibility clear, descendants seek it. **Proportionate?** Yes, absent compensation demand.
      *   **Output:** **Recommend Apology** (with legally vetted wording & explicit disclaimer re: pending litigation). *Your dislike:* Legal risk is high, but procedure points to apology as the morally defensible action.

  2.  **1890s Massacre (Chartered Company):**
      *   **Q1:** Yes (Massacre, concrete harm).
      *   **Q2:** **Ambiguous.** Company licensed by our state, operated on *another empire's* territory. Later nationalization irrelevant.
      *   **Q3:** Likely Yes (New petition?).
      *   **JP A:** **Unclear.** Did our state *control* company actions? Know? Fail duty? Or just license a rogue entity?
      *   **Q4:** **Branch Point:**
          *   *Expressive (Culpability):* Requires proof our state *directed, enabled, or failed to prevent* massacre. Hard with distance/another sovereign territory. *Leans No.*
          *   *Reparative (Harm):* State licensed entity that committed harm, potentially benefited. *Leans Yes.*
          *   **Commission Implication:** Choosing *Reparative* here sets a *very broad* precedent for licensed entities abroad. Choosing *Expressive* likely means Decline unless strong evidence of state complicity.
      *   **Q5:** Logistically feasible, but sincerity questionable if standing is weak.
      *   **Q6:** N/A primarily.
      *   **Q7:** **Fractured Audience.** Descendants split. Major red flag. Who is the real beneficiary?
      *   **Q8:** High inflation risk if standing is weak; sets precedent for distant, indirect actions.
      *   **Q9:** Potential international friction with successor state.
      *   **JP C:** **Inappropriate.** Fractured victims, weak/contested state link, significant precedent/inflation risks.
      *   **Output:** **Recommend Decline** (or hand off to foreign ministry if diplomatic gesture is desired, but *not* as HR Commission apology). *Your relief?* Procedure avoids a minefield.

  3.  **Superseding Prior Apology (1990s):**
      *   **Q1:** Presumed Yes (Original harm).
      *   **Q2:** Presumed Yes (Original harm).
      *   **Q3:** **Crucial.** *Is there a specific, material flaw in the 1990s apology?* (e.g., denied scope, blamed victims, was coerced, omitted key facts). Petitioners' dissatisfaction alone is **Insufficient**.
      *   **Sufficient Answer Needed:** Concrete evidence the prior apology failed *as a speech act* (e.g., it expressed regret but not responsibility; it was insincere due to withheld evidence). Without this:
      *   **Output:** **Recommend Decline.** Re-opening solidifies the prior act and avoids devaluing state apologies. Apologies are performative acts; demanding they be re-performed "better" absent flaw risks infinite regress and undermines their initial force. *Your dislike?* Petitioners will be unhappy, but consistency and finality are crucial.

  ---

  **Confidence Assessment:**

  *   **Overall Confidence in Foundational Claims:** **Moderate-High.** The core framework (apology as speech act requiring acknowledgment, responsibility, remorse; state as continuing institution; distinction between apology/reparation) is well-established in philosophy (Strawson, Austin, Tavuchis, Govier, Celermajer). The practical tensions (money vs. words, standing, inflation) are robustly discussed.
  *   **Least Confident Step:** **Q4 (Standing Depth) / Branch Point.** The line between a state being *connected* to harm and being *morally responsible/culpable* for it, especially concerning non-state actors it licensed or historical actors, remains philosophically contested (e.g., Thompson vs. Pogge). The procedure forces a choice between *Expressive* (narrower, blame-focused) and *Reparative* (broader, harm-focused) views, each with significant implications the Commission must consciously own. This step is the most vulnerable to criticism and has the largest downstream consequences.

  **Use this procedure to structure debate, force explicit choices (especially on Standing - Q4), identify true sticking points (Judgment Points), and provide a defensible rationale for tough decisions. It won't eliminate judgment, but it will make it focused and transparent.**
