answer: |-
  Here’s the straight talk on defending Solomonoff induction (the universal prior) in practical model selection, ranked by severity and paired with concrete pushback:

  ### **Fatal Flaws in Practice**
  1. **Runtime Ignorance (The "Heat Death Penalty")**  
     - **Problem**: The prior weights *only* program *length*, not runtime. A hypothesis with a 10-line program that takes 10^100 years to run beats a 100-line program that runs instantly.  
     - **Concrete Example**:  
       - *Hypothesis A*: A short program generating clean data via `y = 2x + noise` (runs in microseconds).  
       - *Hypothesis B*: A slightly shorter program that brute-forces all possible datasets until it matches yours (runs in 10^200 years).  
     - **Why Scientists Reject This**: No working lab would accept a model that can’t produce predictions before the universe ends. Adding a runtime penalty isn’t a "refinement"—it’s mandatory for real-world use.  

  ### **Major Awkwardness**
  2. **Machine Dependence (The "Esoteric UTM Problem")**  
     - **Problem**: The invariance theorem guarantees only *asymptotic* independence. For finite samples, a maliciously chosen UTM can flip hypothesis rankings.  
     - **Concrete Example**:  
       - *Hypothesis A*: Linear model (e.g., `y = ax + b`).  
       - *Hypothesis B*: Lookup table of all observed data points.  
       - **Normal UTM**: A is shorter (simple math). **Perverse UTM**: Compresses the lookup table into 5 bits by coincidence (e.g., mapping "all current data" to a tiny program).  
     - **Why Scientists Balk**: Two equally "simple" models (by scientific intuition) could reverse ranks based on arbitrary UTM choice. Defenders concede this but argue:  
       - *Rebuttal*: "Reasonable" UTMs (e.g., standard programming languages) minimize this. Still awkward to explain in a paper.  

  ### **Philosophical Gambles**
  3. **The Computability Assumption**  
     - **Problem**: The prior only converges if the data source is computable. If the universe has uncomputable elements (e.g., true randomness), Solomonoff fails.  
     - **Can We Detect Failure?** Not provably. We might see poor prediction and *suspect* uncomputability, but could never confirm it.  
     - **Defender's Stance**: "Computability is a minimal assumption—if the world isn’t computable, *no* method works." But it’s a bet, not a guarantee.  

  ### **Merely Annoying**
  4. **Uncomputability of the Prior Itself**  
     - **Problem**: Solomonoff prior isn’t computable. You *must* approximate it (e.g., with MDL or compression algorithms).  
     - **Impact**: Weakens "objective prior" claims. Defenders call this "engineering reality."  

  ### **The Bottom Line for Your Defense**
  - **Concede**:  
    - Runtime *must* be penalized (cite "Speed Prior" or Hutter's work as rivals).  
    - UTM choice introduces finite-sample arbitrariness (but argue standard languages mitigate this).  
  - **Insist**:  
    - Asymptotic optimality is still the gold standard.  
    - Description length *is* the cleanest formalization of simplicity—even if messy in practice.  
  - **Risk**: Without runtime constraints, **Solomonoff is "insulated into a definition"** of simplicity. In the real world, a "working scientist’s prior" *must* penalize infeasible computation.  

  **Final Verdict**: The core math is sound for idealized agents with infinite time. But in your pipeline? **Demand a runtime cap.** If pressed, say: *"We’re not Solomonoff purists; we use description length *plus* compute constraints to reflect resource limitations."** That’s defensible—and honest.
