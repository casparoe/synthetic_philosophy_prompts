  2. **Burger**: One more beef burger (butcher already ordered the meat; no immediate effect on demand).  
  3. **Vote**: One vote in a safe seat (candidate wins by a landslide; vote doesn't change outcome).  
  4. **Meadow**: One step by a walker in a group of 100 crossing a fragile meadow that dies on the 1,000th step, with 1,001 steps total (no single step causes death).

  The tree starts with the core question of outcome efficacy, then branches through key distinctions in moral philosophy. Positions are named where standard (e.g., from consequentialism, deontology, or collective ethics). If two positions are behaviorally identical on your cases, they are merged. Unoccupied or incoherent branches are noted.

