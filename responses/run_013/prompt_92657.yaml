  - **No** → Node 3 (Outcome isn’t the only thing that matters).

  #### **Node 3: Is the act wrong because it violates a non-consequentialist duty (e.g., duty not to harm, exploit, or disrespect)?**  
  - **Yes** → Node 4 (Duty-based approaches).  
  - **No** → Node 5 (Other reasons).

  #### **Node 4: Is this duty absolute (no exceptions, even to prevent catastrophe)?**  
  - **Yes** → **Leaf 3: Absolute Deontology**  
    *Position: Acts are wrong if they violate a moral rule (e.g., "don’t contribute to climate injustice" or "don’t commodify animals"). Your flight/burger is wrong regardless of outcomes.*  
  - **No** → **Leaf 4: Threshold Deontology**  
    *Position: Duties hold unless near a harm threshold (e.g., climate tipping point). Flight/burger may be wrong if thresholds are close; vote/meadow step usually permissible in your cases.*

  #### **Node 5: Is the individual contribution necessary for the collective harm?**  
