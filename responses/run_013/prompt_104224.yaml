  Okay, the user is grappling with the ethical foundations of Effective Altruism (EA), specifically the 10% giving pledge. They're questioning why it's not higher and what that implies about moral obligations. Let me unpack their concerns step by step.

  First, they're not a philosopher, so they need clear explanations without jargon. They’ve noticed a tension: if preventing suffering is paramount, why stop at 10%? The core issue is the seeming inconsistency between EA's utilitarian roots and a fixed, relatively modest pledge. 

  The user’s deeper questions revolve around moral demandingness. They’re hinting at whether EA is hypocritical—using consequentialist reasoning but not following it to its logical extreme (near-total self-sacrifice). They also want to know if the 10% is arbitrary or principled, and how career advice fits into this. 

  I should clarify that EA isn’t monolithic. The pledge’s design balances idealism with practicality—10% is sustainable for most, avoiding burnout. It’s a gateway, not a ceiling. But academically, this does clash with pure impartial consequentialism, which would demand far more. 

  The user might be wrestling with their own potential guilt: if they adopt EA, must they give 50%+? Or is 10% morally sufficient? They need reassurance that the pledge isn’t the final word on obligation. 

  I’ll break down the "settled" vs. "contested": The pledge’s function as a practical norm is settled. But its moral basis? Hotly debated even within EA. Purists like MacAskill endorse higher giving; others defend 10% as strategically wise. 

  Career advice adds another layer. Earning-to-give only makes sense if the pledge isn’t the max—so implicitly, EA expects flexibility. The user’s spot-on: the practice mixes demanding ethics (career choice) with leniency (10%). 

  If EA were purely maximizing, pledges would be personalized and far steeper. If it were minimal, the pledge might vanish or shrink. The current model is a hybrid—and that’s intentional, not accidental. 

  The user’s sharp to notice the tension. Their frustration is common. I’ll validate that while explaining EA’s pragmatic compromises. No glossing over the contradictions—they’re real and debated.
answer: |-
  You've pinpointed a core tension within Effective Altruism (EA) that's actively debated, even among its leading thinkers. Here's a breakdown separating settled aspects from genuine controversies, addressing your specific questions about moral presuppositions:

  **Settled (Broad Consensus within EA):**

  1.  **The Core Moral Principle:** Suffering is bad, and preventing it (or promoting wellbeing) impartially is a central moral priority. Resources can be used vastly more effectively to help others than to provide luxuries for oneself.
  2.  **The 10% Pledge as a Practical Norm & Signal:** The 10% figure is explicitly **not** derived from a rigorous calculation of moral obligation. It's primarily:
      *   **A Practical Heuristic:** Inspired by historical religious tithing, it's seen as a level of giving that is both *meaningful* (significantly more than typical charitable giving) and *sustainable* for many people in affluent countries without causing burnout or deterring participation.
      *   **A Signaling & Community-Building Tool:** Publicly pledging creates social accountability, normalizes significant giving, and builds a community around shared values. It serves as an "entry point" or minimum commitment.
      *   **An "Ought" of Community Standard:** Within the EA community, pledging 10% (or more) *is* presented as something one *ought* to do – it's the expected baseline level of commitment for someone who accepts the core premises. Falling below this *within the community context* is seen as falling short of the shared norm.
  3.  **Career Choice as Impact Leverage:** The advice to consider "earning to give" (ETG) careers (like high-paying finance/tech jobs) presupposes that:
      *   **Marginal Utility:** An extra dollar donated to top charities does vastly more good than an extra dollar spent on personal consumption beyond necessities and moderate comforts.
      *   **Career Impact Varies:** Different careers have vastly different capacities to create positive impact, either directly (e.g., research, policy) or indirectly via donations.
      *   **ETG is a Valid High-Impact Option:** For many individuals, especially early in their careers or without specialized skills for direct impact roles, maximizing income to donate is a *reliable* path to high expected impact.
  4.  **Giving >10% is Praised:** The EA community actively encourages and celebrates individuals who give significantly more than 10%. The 10% is a *floor* within the community, not a ceiling.

  **Genuinely Contested (Within EA Philosophy & Practice):**

  1.  **The Source and Demandingness of Moral Obligation:** This is the crux of your question.
      *   **The Tension:** The career advice (maximize income/donations) seems driven by a highly demanding, impartial consequentialist view (maximize good impartially). The 10% pledge, while demanding by conventional standards, seems far *less* demanding than what strict impartial maximizing would require (potentially 50%, 90%, or living near subsistence).
      *   **Consequentialist (Maximizing) View:** Proponents (e.g., Peter Singer in his more demanding writings, Will MacAskill in "Doing Good Better") argue the logic *does* point towards giving much more than 10% for affluent individuals. They see 10% as a pragmatic starting point, not a moral limit. Obligation stems from the capacity to prevent immense suffering at relatively low cost to oneself. On this view, *not* giving more *is* a moral failing, though perhaps an understandable one due to human psychology and social constraints. *If strictly rebuilt on this view:* Pledges would likely be personalized and much higher (e.g., "Give until the marginal dollar benefits you more than it could benefit others via top charities"). Career choice would *only* be justified by its maximal expected impact (ETG or direct).
      *   **Moderate/Satisficing/Prudential View:** Others within EA (or sympathetic to it) argue that morality, while demanding, does not require *maximization* to the point of significant personal sacrifice or undermining one's long-term effectiveness/happiness. The 10% pledge might represent a level seen as a "significant duty" or "sufficient contribution" within a pluralistic moral framework that also values personal projects, relationships, and psychological sustainability. Obligation might stem from fairness or a duty of rescue, but with limits. *If rebuilt on this view:* The 10% pledge *might* be framed as fulfilling a core duty, with giving beyond that being supererogatory (praiseworthy but not obligatory). Career advice might emphasize finding a *sufficiently* high-impact career that also aligns reasonably well with personal fit/happiness, rather than absolute maximization.
      *   **Pragmatic Institutional View:** Focuses less on individual moral obligation and more on building institutions and norms that *collectively* maximize impact. The 10% pledge is a highly effective *institutional norm* for mobilizing resources, even if it doesn't perfectly match any one individual's theoretical obligation. The goal is systemic change through widespread adoption of impactful behaviors. Career advice operates similarly.
  2.  **How to Resolve the Tension:** There is **no consensus** on how to fully reconcile the demanding logic of impartial maximization implied by impact-focused career choice with the less-than-maximizing (though still demanding) 10% pledge norm. Common attempts include:
      *   **The Pragmatic Bridge:** 10% is the sustainable, scalable *norm*, while ETG is a high-impact *option* within that framework. The norm enables more people to give significantly, even if some individuals *could* and *should* give more. The career advice targets those for whom ETG is optimal *given the existing norms and their personal capacity*.
      *   **Long-Term Effectiveness:** Giving too much too soon might lead to burnout, reduced lifetime earnings, or abandoning the EA project entirely. 10% is sustainable, allowing individuals to build careers, wealth, and stability, potentially enabling *more* giving later. (Counter-argument: This risks perpetual delay).
      *   **"Significant" vs. "Maximal":** The core obligation is to make a *significant* contribution, not necessarily the *maximal possible*. 10%+ meets the "significant" threshold for many, while ETG is a way to achieve significance or beyond for those suited to it. (Counter-argument: This seems arbitrary if preventing suffering is paramount).
  3.  **The Role of "Earning to Give":** While accepted as *a* valid strategy, its prominence is contested. Critics argue:
      *   It might attract people for the wrong reasons (desire for wealth).
      *   It might crowd out direct work in crucial fields.
      *   High-paying jobs might sometimes have negative externalities.
      *   Personal fit and motivation matter – forcing someone into finance who hates it may backfire. Proponents counter that for many, especially early career, ETG remains one of the highest expected-value paths.

  **What the Practice Presupposes (Synthesizing Settled & Contested):**

  1.  **A Strong (but not necessarily maximalist) Duty to Help:** EA presupposes a robust moral duty to use significant resources to prevent suffering/promote wellbeing impartially. This goes far beyond common sense "niceness" but stops short of demanding total self-sacrifice as an *enforced norm*.
  2.  **Scalability and Sustainability are Crucial:** The practice presupposes that mobilizing *many* people to give a *significant* amount (10%) is more impactful in the long run than mobilizing only a few saints to give everything. The norm is designed for broad adoption.
  3.  **Pragmatism Trumps Theoretical Purity (in practice):** While maximizing impartial good is the *aspiration*, the *implementation* (like the 10% pledge) accepts psychological and social realities. The practice borrows from both demanding consequentialism (for motivation and high-impact career logic) and a more moderate view with latitude (for the specific, fixed pledge level and personal sustainability). This borrowing is intentional pragmatism for some, an unresolved tension for others.
  4.  **"Ought" within a Community Context:** The "ought" associated with the 10% pledge is primarily the "ought" of fulfilling the baseline commitment expected within the EA community for someone who accepts its premises. It signals membership and seriousness. The deeper philosophical "ought" (how much one is *truly* morally obligated to give) remains debated *within* the community.

  **In Summary:** The 10% pledge is a pragmatic, community-building norm, not a theoretically derived moral limit. Its relationship with the maximizing logic implied by high-impact career advice creates a genuine and unresolved tension within EA philosophy. The practice presupposes a strong duty to give significantly and impartially, but prioritizes a sustainable and scalable norm (10%) over theoretically maximal individual demands. There is consensus that giving *more* than 10% is better, but deep disagreement on whether, and to what extent, not giving far more constitutes a moral failing. The practice quietly (and sometimes not so quietly) navigates between demanding consequentialism and pragmatic concerns about human nature and large-scale mobilization.
