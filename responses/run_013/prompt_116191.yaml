answer: |-
  ## The Widening Interval

  The salt-stained windows of the Coastal Risk Board building framed a view Mara Vale knew too well: the restless grey chop of Havenport harbour, the cranes like skeletal herons, and the creeping watermark, faint but undeniable, staining the brickwork of the lower warehouses – twice in ten years. Inside, the air hummed with the low thrum of servers and the higher pitch of contained anxiety. Maps plastered the walls, layered with coloured zones and arrows, all converging towards a single, mandated output: **a number**.

  Mara traced the edge of her notebook, its pages dense with her precise, looping script and boxed equations. The current entry held her frustration: *Model v.7.1 (Post-Consultant Report & Tide Gauge 14B)*. Below it, not a single value, but a diagram. A horizontal line, marked with two vertical bars. The left bar: *P_min = 0.18*. The right bar: *P_max = 0.42*. And an arrow pointing right from the previous interval: *v.7.0: [0.22, 0.38]*.

  It had widened. Again.

  The consultant’s report, commissioned after the *last* flood, offered sophisticated hydrological modelling of the estuary’s shifting silt banks. Tide Gauge 14B, newly installed near the vulnerable North Docks, provided higher-resolution data than ever before. Both were improvements. Both were *relevant*. And integrating them hadn’t clarified the probability of inundation exceeding the critical threshold this coming winter storm season; it had *muddied* it. The set of defensible probability distributions – the *family* she could justify based on the evidence, each member plausible under different reasonable assumptions about sediment flow, gauge calibration, or historical storm intensity correlations – now spanned a broader range.

  "Vale? Thorne wants the draft assessment. Yesterday." Silas Reed leaned against her doorframe, arms crossed. His tie was impeccably knotted, his expression one of practiced impatience. Silas believed in answers. Clean, actionable numbers. He saw Mara’s intervals as cowardice in mathematical drag.

  "It’s not ready, Silas," Mara said, her voice calm but firm. She tapped the diagram in her notebook. "The new data… it doesn’t converge. It diverges."

  Silas stepped in, peering at the notebook. He snorted softly. "Diverges? Or your priors are too vague? It’s probability, Mara, not philosophy. Average it. Weight the distributions. Pick the median. *Commit*. The statute demands a number. The Chair signs a number. The city *acts* on a number." He mimed signing a document. "This… family portrait…" he gestured dismissively at her diagram, "...is just a distribution over distributions. Collapse it. Use Jeffreys’ prior if it makes you feel Bayesian-pure. But give Thorne something he can *use*."

  "That’s the point, Silas," Mara insisted, a spark of heat rising despite herself. "Collapsing it *is* the pretense. It imposes a single weighting scheme, a single set of assumptions about how these uncertainties interact, that the evidence doesn’t justify. Adding the gauge data *introduced* new structural uncertainty about localized surge patterns we didn’t have before. The consultant’s model is good, but it hinges on parameters we *know* have high variance. Combining them…" She pointed to the widened interval. "...shows the *scope of our ignorance* more honestly than any single number ever could. Choosing one is arbitrary."

  "Arbitrary is what we *do*," Silas countered. "We make judgment calls. We use expertise. We don’t paralyse the Board because reality is messy. Thorne needs a trigger point. The public needs clarity. Your 'honesty' looks like indecision. Or worse, like you’re building an alibi for when it goes wrong." He straightened up. "Get him a number, Mara. Before the journalist sniffs this out and makes us all look like fools arguing over angels on pinheads while the tide comes in."

  He left. Mara stared at the harbour. The water looked higher today. Or was it just the memory of the last inundation, the oily sheen on Market Street, the desperate sandbagging? She flipped back in her notebook. Page after page documented the phenomenon. Sometimes, adding data *did* narrow the interval – better historical rainfall records had tightened it last year. But sometimes, especially with data revealing new complexities or challenging old assumptions, the defensible set *expanded*. It wasn’t error. It was epistemic honesty. The world wasn't obligingly reducing to a point estimate; it was revealing itself as more complex, more uncertain in its potentialities.

  *Define F as the family of plausible distributions*, she wrote, a familiar anchor. *New evidence E arrives. If E reduces uncertainty uniformly, F contracts. But if E reveals new sources of dependence, or conflicts with assumptions underpinning some members of F, then members previously deemed less plausible might become *more* plausible relative to others under the new light, while some previously central members become untenable. The boundaries shift... outward.*

  It felt like trying to hold water in hands that kept discovering new gaps between the fingers.

  ***

  Chairman Aris Thorne’s office felt like the calm eye of the storm. Maps were neater, the air cooler. Thorne himself, grey-haired and with the weary eyes of a man who’d signed evacuation orders twice before, steepled his fingers as Mara laid out her assessment – the evidence, the models, the interval: 18% to 42%.

  "And the single figure?" Thorne asked, his voice quiet.

  "I can’t provide one, Chairman, that isn’t misleading," Mara said, meeting his gaze. "The evidence supports a range. Providing a central estimate like 30% pretends a precision we don’t have. It hides the underlying disagreement in the plausible models."

  Thorne sighed, a sound like wind through reeds. "Mara, I respect your rigor. But the Coastal Defence Act is clear. Section 4(b): 'The Board shall determine, based on available evidence, a single probability value P representing the likelihood of critical inundation within the designated season.' My pen hovers over the line for P. The Mayor, the Emergency Coordinator, the Harbour Master – they wait for that P. They build plans on it. Evacuation zones, resource allocation... it hinges on *one number* crossing a threshold. What am I to tell them? That the probability is... somewhere between 'quite concerning' and 'alarmingly high'?"

  "It *is* both of those things," Mara said. "The interval *is* the honest assessment. Last month, before integrating the new gauge and the consultant’s silt model, the interval was 22% to 38%. Adding that genuinely relevant information *widened* the defensible range."

  Thorne’s eyebrows rose. "Widened? Better data made you *less* certain?"

  "More accurately, it made the *extent* of our uncertainty clearer. It showed that some plausible scenarios are now *less* likely than we thought, but others, previously dismissed, are *more* plausible. The tails got fatter. The space of possible truths got... roomier." She saw his expression harden slightly. "Think of it like surveying land," she pressed, knowing the clock was ticking. "Before, you had one map, maybe a bit blurry. Now you have two new maps, much more detailed, but they disagree on where a crucial boundary lies. You don't just average the boundaries and call it truth. You acknowledge the area of disagreement exists. That *is* the new knowledge."

  Thorne leaned back, swivelling his chair slightly to look at the harbour. "Silas gave me 32%. He cited the consultant model as primary, weighted the gauge data lower, used an 'expert consensus prior'." He turned back. "He says your reluctance is philosophical obstinacy. That in the face of complexity, we must simplify to act. That the public *needs* the illusion of certainty to heed warnings."

  "And if we evacuate based on 32%, and the water doesn't come?" Mara asked quietly. "Cry wolf too often... Or worse, if we *don't* evacuate because we chose 32% and the actual risk was at the *top* of my interval, pushing 40%? People die in that gap, Chairman. The gap between the number we pretend to know and the uncertainty we refuse to acknowledge."

  Thorne was silent for a long moment. The only sound was the distant hum of the city and the faint creak of his chair. "And your interval? 18% to 42%? What action does that prescribe? Evacuate? Don't evacuate? Wait and see?"

  "It prescribes acknowledging the risk is substantial and highly uncertain," Mara said, feeling the familiar knot of frustration. "It suggests preparing for multiple scenarios. Triggering lower-tier alerts now, pre-positioning resources, accelerating the North Docks reinforcement *immediately* regardless. It demands communicating the *range* of possibility, not a false precision."

  "The Act doesn't allow for ranges, Mara," Thorne said, his voice heavy with finality. "It allows for a number. And the press..." He nodded towards the window. Down in the plaza below, a figure with a notebook was talking animatedly to a Board communications officer. Lena Cole, the tenacious reporter from the *Havenport Chronicle*, who’d covered both floods and the Board’s often-controversial decisions. "...Lena Cole will crucify us if we announce we don't know the number, especially with Stormwatch issuing its first advisory." He picked up a pen. "I need *a number*, Mara. Give me yours, or I take Silas's."

  Mara looked at her notebook. The interval stared back: *[0.18, 0.42]*. She could write 0.30. She could justify it as the midpoint, knowing it was meaningless. She could weight things Silas’s way and get 0.32. She could invent a weighting that gave her 0.25 or 0.38. All arbitrary. All pretending knowledge she didn't possess. All collapsing the complex, widening landscape of uncertainty into a single, inadequate point.

  Her refusal wasn't timidity. It wasn't evasion. It was the conviction that forcing a number wasn't decision-making; it was a ritual sacrifice of truth to appease the gods of bureaucracy. But looking at Thorne’s expectant, burdened face, seeing the phantom watermark on the buildings outside, feeling the weight of the coming storm in the air pressure, she knew her conviction was a luxury the city might not afford.

  "I cannot provide a single number that honestly represents the evidence," she said, her voice clear but tight. "The defensible probability interval for critical inundation this season is eighteen to forty-two percent."

  Thorne held her gaze for a beat longer, then sighed again, a sound of profound weariness. He picked up Silas’s report. "Thank you, Mara. That will be all."

  ***

  The official Coastal Risk Board Assessment was released two days later. Probability of Critical Inundation: **32%**. Signed by Chairman Aris Thorne. The accompanying press release emphasised "improved modelling" and "enhanced data integration," projecting confidence. Silas Reed gave the technical briefing, smoothly fielding Lena Cole’s question about "alternative interpretations" with, "All rigorous analyses converge within acceptable margins. The Board stands by its consolidated assessment."

  Mara watched the briefing on the screen in her empty office. She saw Lena Cole’s sharp eyes narrow slightly, scribbling furiously. She saw Silas’s practised assurance. She saw the number: **32%**.

  Outside, the sky darkened prematurely. The first fat raindrops spattered against the salt-crusted window, tracing paths through the grime. The harbour chop grew angrier, whitecaps flecking the grey. The storm was coming.

  Mara opened her notebook to a fresh page. She drew a horizontal line. She marked two points: 0.18, 0.42. She drew a box around them. Below it, she wrote: *Assessment v.8.0 (Post-Decision)*. Then, a simple equation:

  > *Known:* Evidence → Family F of Distributions → Interval [L, U]
  > *Action Taken:* Interval [L, U] → Collapse Function C(arbitrary) → Point P
  > *P = 0.32*
  > *Gap = | Reality - P |*
  > *Cost = f(Gap)*

  She stared at the equation. The gap wasn't just between not knowing and pretending to know. It was the chasm between the honest shape of uncertainty and the brittle fiction of a number demanded by statute, defended by expediency, and acted upon by a city hunkering down, hoping the fiction held against the rising water. The cost function, *f(Gap)*, remained terrifyingly undefined, its arguments measured in sandbags, shattered businesses, and lives. The rain intensified, drumming against the pane like impatient fingers. The interval on the page hadn’t changed, but the weight of it, the silent scream of its width against the single, decisive number now governing Havenport’s fate, felt heavier than the coming storm. She closed the notebook. The widening had reached its logical, devastating conclusion.
