  For follow-ups, I'll anticipate defensive answers: e.g., if she claims commitment suffices, push on why real desire change was ever proposed. If she argues decoy-knowledge doesn't matter, demand how to prevent recursive manipulation. The goal is to make the epistemology sweat without being aggressive. 

