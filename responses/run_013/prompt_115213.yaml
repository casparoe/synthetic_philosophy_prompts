prompt: |-
  I host a little podcast on decision theory and AI risk, and next month's guest is a researcher who defends "surrogate goals" as a defense against acausal threats. The rough idea, as I understand it: if an agent thinks it might get blackmailed by far-away agents that can't causally reach it but are reasoning about what it will do, the agent can deliberately take on some stand-in goal that those other agents could satisfy much more cheaply -- so it stops being worth threatening. I want questions that really dig in and dont just let her restate the pitch.

  Draft eight to ten questions for me, and for the three or four hardest ones add a follow-up that's keyed to the answer she's most likely to give. I especially want to push on: whether she thinks you literally have to acquire the surrogate desire or whether a credible commitment to it is enough; what happens to the whole scheme once the would-be threatener knows the goal is a surrogate and not something you actually care about; and how any of this is supposed to differ from plain old precommitment, which doesn't need an acausal story at all. Also throw in one question about whether the surrogate goal itself could be the thing that gets threatened, and one about what could make her give up on the whole approach. American English, please.
