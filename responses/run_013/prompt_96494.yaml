prompt: |-
  I'm a freelance features writer — science and ideas, the sort of thing that ends up in the back half of a weekend mag — and I've just had a 6,000-word piece commisioned on consent. Not just the sexy stuff either: medical consent forms, the GDPR clickwrap business, NDAs, capacity assessments, the whole spread. My working thesis is that everyone waves the word consent about as if we all agree what makes it valid, and we plainly don't.

  What I need from you isn't a survey or a reading list — I can't read forty papers and I'm not going to pretend otherwise. I want to know which open questions about what makes consent valid are actually load-bearing: the ones where, if you settled one, a heap of the others would quietly fall into place, or the law would have to shift. And which ones look meaty but are dead ends that won't change a word of the piece.

  The things I keep bumping into: whether coercion is measured against what you're morally entitled to or against what you'd have got in a fair market (which seems to settle whether a lousy job offer is coercive or merely grim); whether consent is really a mental state or a public act, and what we do when the two come apart — someone says yes and doesn't mean it, someone means it and says nothing; how much deception has to matter before the consent is void; and whether competence is a threshold you're over or under, or a sliding scale that depends on what you're consenting to. A philosopher mate reckons the sleeper issue is that consent can be perfectly valid and still not make the thing alright — valid but not licence-granting. Is she right that that's the one to build around, or is that the sort of thing only philosophers care about? I already know the standard checklist of elements of valid consent, so skip that, and skip the social-construction angle — I want the seperate, harder questions.

  So: rank the two or three I should build the piece around, and defend the order. What makes a question worth a chunk of my word count — does it move law or practice, does it change what ordinary people ought to do, does it unlock other questions, is it even tractable without a lab? It's for a general-readership quarterly, but I'd love it to be the sort of thing that gets quoted in a law-reform consultation, so weight the practical ones accordingly. And tell me what would change your ranking — what I'd have to see or read in the next year to move something up or down. Flag the red herrings too. Be blunt; I'd rather find out now than 5,000 words in.
reasoning: |-
  Okay, the user is a freelance features writer focusing on science and ideas, commissioned to write a 6,000-word piece on consent across various contexts—medical, GDPR, NDAs, etc. Their thesis is that while everyone uses the term "consent," there's no real agreement on what makes it valid. They need help identifying which open questions about consent are "load-bearing"—meaning settling them would resolve other issues or shift laws—and which are dead ends. They've listed several questions they're encountering and want me to rank the top two or three to build the piece around, with a defense of the order.

  First, I need to understand their key concerns. They mentioned coercion measurement, consent as a mental state vs. public act, deception thresholds, competence as threshold vs. sliding scale, and their philosopher friend's point about valid consent not necessarily granting license. The user wants practical impact—questions that move law or practice, affect what ordinary people do, unlock other questions, and are tractable. They also want to avoid red herrings.

  Let me break down each question they mentioned:

  - **Coercion measurement**: Whether it's based on moral entitlements vs. fair market value. This affects if a bad job offer is coercive or just grim. Practical implications in employment law, contract validity.

  - **Mental state vs. public act**: What happens when someone says yes but doesn't mean it, or means it but doesn't say anything. This touches on legal standards vs. personal intent, relevant in contracts, sexual consent, medical decisions.

  - **Deception thresholds**: How much deception voids consent. Important in fraud, medical trials, online terms.

  - **Competence as threshold vs. sliding scale**: Is competence binary or dependent on the decision's complexity? Crucial for medical consent, elder care, mental health.

  - **Valid but not license-granting**: Even if consent is valid, does it make the action morally permissible? This is philosophical but could tie into NDAs covering up crimes or unethical medical trials.

  The user emphasized practicality. They want the piece to potentially influence law reform, so questions with real-world legal weight are key. Also, general readability for a quarterly magazine, so overly academic angles might not fit unless they have clear applications.

  Assessing load-bearing nature: Which questions, if resolved, would cascade into solving others? For example:

  - **Competence as sliding scale**: If settled, it could affect medical and legal standards, requiring updates to capacity assessments. This might influence how coercion is viewed in contexts with vulnerable individuals.

  - **Mental state vs. public act**: Clarifying this could standardize consent protocols across fields, reducing ambiguities in court cases. It might also intersect with deception—if the act is public but based on lies, how does that void consent?

  - **Coercion measurement**: A resolution here could redefine contract law, especially in employment or consumer rights. But it's more niche unless tied to broader issues like inequality.

  - **Valid but not license-granting**: Philosophically deep but might not change laws directly. However, it could challenge the legitimacy of certain consents, like NDAs in harassment cases, making it relevant for #MeToo era discussions.

  The philosopher's point about valid consent not granting license is intriguing. If consent is legally valid but the action is still wrong, it questions the entire ethical foundation. For example, NDAs silencing victims: consent might be legally sound, but is it ethical? This could bridge to practical reforms, like laws invalidating such NDAs. But is this too abstract? The user wants to avoid dead ends, so this needs a practical hook.

  Red herrings: The coercion debate might be a dead end because courts already use a hybrid approach—looking at both market norms and baseline rights. The mental state vs. act question might be intractable since it's fundamentally subjective, but it has huge implications for AI and digital consent (like GDPR click-throughs).

  Ranking criteria:
  1. **Practical impact**: Affects laws, policies, everyday decisions.
  2. **Unlocks other issues**: Solves multiple sub-questions.
  3. **Tractability**: Can be addressed without labs, through case studies or legal reforms.
  4. **Current relevance**: Ties into ongoing debates (e.g., #MeToo, GDPR enforcement).

  Top contenders:
  1. **Competence as threshold vs. sliding scale**: High practical impact in healthcare and law. Changes how capacity is assessed, affecting vulnerable groups. Unlocks questions about coercion in unequal power dynamics. Tractability: Reforms are already being discussed in medical ethics.
  2. **Mental state vs. public act**: Core to digital consent (GDPR), sexual assault cases, and contracts. If resolved, it could standardize consent recordings or witness requirements. Unlocks deception issues—intent vs. expression.
  3. **Valid but not license-granting**: If framed around NDAs or unethical research, it becomes practical. Could drive law reforms on voiding certain consents. But riskier—might be too philosophical without concrete examples.

  Why competence over mental state? Competence directly affects millions in medical settings; mental state is pervasive but more diffuse. Competence is tractable with real-world examples (e.g., dementia patients). Mental state has GDPR relevance, but tech consent is evolving fast—might date the piece.

  Changes in ranking: If new data emerges on AI interpreting consent intent, mental state could rise. If a high-profile case challenges competence standards, it stays top. The philosopher's point rises if linked to legislative changes, like proposed NDA bans.

  Red herrings: Coercion measurement feels settled legally. Deception thresholds are context-specific—less load-bearing.

  Final ranking:
  1. **Competence sliding scale**: Highest practical stakes, unlocks coercion in vulnerable contexts.
  2. **Mental state vs. public act**: Broad applicability, critical for digital age.
  3. **Valid but not license-granting**: With strong examples, it becomes a powerful closer, questioning systemic issues.

  User's needs: They want to avoid academic deep dives, so focusing on questions with clear stories—e.g., a patient misassessed as competent, a GDPR fine for ambiguous consent. The piece should balance depth and readability, using these questions to reveal consent's fractured foundations.
answer: |-
  Right, let's cut through the noise. You're spot-on that "consent" is a fractured concept masquerading as a universal standard, and most discussions get bogged down in definitions or social theory. Your philosopher mate is sharp, but her point needs *scaffolding* to carry weight for a general audience and policymakers. Based on impact, tractability, and load-bearing potential, here’s the ranking for your piece, with defense and red flags. Aim to build around **1-2 core questions** to avoid spreading 6,000 words too thin—depth over breadth.

  ### The Ranking: What Moves Needles
  1. **"Is competence a threshold or a sliding scale?" (The Capacity Question)**  
     **Why #1:**  
     - **Load-Bearing Supreme:** Settling this rewires *everything*. If competence is context-dependent (a sliding scale), it forces redesigns of medical consent forms, financial agreements, NDAs, and GDPR interfaces overnight. A "yes" from a dementia patient buying a coffee vs. signing a property deed? Current threshold models fail here. It directly impacts coercion assessments (e.g., "Was this person *capable* of resisting pressure?") and deception (e.g., "Did they grasp the lie?").  
     - **Moves Law & Practice:** Courts already struggle with this (e.g., UK Mental Capacity Act's "decision-specific" approach vs. rigid US guardianship laws). Reforms are brewing—Canada’s *Carter v. Canada* (assisted dying competence) and EU GDPR recitals hint at proportionality. Medical AI consent tools are floundering on this.  
     - **Ordinary People Impact:** Affects dementia care, teen autonomy, addiction treatment, and signing T&Cs. Parents, patients, and employees face this daily.  
     - **Tractable?** Yes. Use real cases: a bipolar artist signing away copyright during mania vs. stable period; GDPR dark patterns exploiting cognitive overload. No lab needed—court rulings, clinician interviews, and UX disasters suffice.  
     - **Changes Ranking If:** New case law (e.g., SCOTUS on medical aid-in-dying competence) or AI consent tools adopting sliding scales. If a major regulator (like UK ICO) fines a firm for exploiting low-capacity users, bump this higher.  

  2. **"Can consent be valid but still fail to morally license the act?" (The Philosopher's Sleeper)**  
     **Why #2:**  
     - **Unlocks Systemic Hypocrisy:** This exposes why consent feels hollow in practice—NDAs silencing assault victims, clinical trial participants "consenting" to unknown risks, gig workers "agreeing" to exploitative algorithms. It forces the question: *Why do we treat consent as a magic wand for ethical absolution?*  
     - **Moves Law & Practice:** It’s the engine behind #MeToo NDA bans (e.g., California’s SB 331), voided clinical consents (e.g., Pfizer Nigeria scandal), and GDPR’s "meaningful consent" principle. Link it to *power asymmetry*—consent from desperation isn’t legitimizing.  
     - **Ordinary People Impact:** Readers recognize this instinctively (e.g., "I signed the form, but it felt wrong"). It reframes "valid" consent as potentially *complicit* in harm.  
     - **Tractable?** With framing. Avoid philosophy lectures; anchor in scandals: Theranos patients consenting to flawed tests, Uber drivers "agreeing" to surveillance. For law reform, quote consultation papers (e.g., UK Law Commission on NDAs) calling this out.  
     - **Changes Ranking If:** Sweeping legislation voids consents obtained under power imbalances (e.g., EU AI Act clauses). If a high-profile lawsuit (e.g., against a university using NDAs) pivots on this, it jumps to #1.  
     - **Red Flag:** Don’t let it drift into abstract ethics. Tie every example to *enforceable limits* on consent’s power.  

  3. **"Is consent a mental state or a public act—and who wins when they clash?" (The Performance Problem)**  
     **Why #3:**  
     - **Load-Bearing for Digital Age:** GDPR clickwrap, telehealth consent, and sexual assault trials live here. If law prioritizes the *act* (e.g., a signature), it enables coercion/deception; if it demands *subjective intent*, prosecutions collapse ("She didn’t say no" vs. "He thought she meant yes").  
     - **Moves Law & Practice:** Shapes GDPR enforcement (e.g., "Was clicking 'agree' a valid act?"), rape convictions (move from "no means no" to "enthusiastic yes"), and AI consent tools (e.g., detecting hesitation vs. recording clicks).  
     - **Ordinary People Impact:** Affects online privacy, sexual encounters, and voice recordings for contracts.  
     - **Tractable?** Moderately. Use clear clashes: Paramedics acting on a nodding, unresponsive patient; Tinder dates misreading signals; Facebook’s "consent" for data sharing.  
     - **Changes Ranking If:** Landmark rulings (e.g., CJEU on GDPR intent) or tech like emotion-aware AI consent auditors. If sexual assault laws shift toward "affirmative act" standards globally, elevate it.  
     - **Red Flag:** This can devolve into "he said/she said" if not tied to systems (e.g., mandatory recording of medical consents).  

  ### Why Not the Others? The Red Herrings
  - **"Coercion: Moral entitlements vs. fair market?"**  
    **Dead End.** Courts already use hybrid models (e.g., contract law voids *extreme* duress; employment regs set baseline rights). A "lousy job offer" is rarely litigated as coercive—it’s fought via labor laws or discrimination suits. No policy wave hinges on this dichotomy. Save it for color, not core.  
  - **"How much deception voids consent?"**  
    **Context Trap.** Matters intensely in specific cases (e.g., fraud law, clinical trials) but lacks load-bearing weight. Precedent already exists: deception voids consent if it *causes* agreement (e.g., lying about surgery risks). No one-size-fits-all threshold will emerge—it’s fact-specific. Useful for anecdotes (e.g., Facebook hiding data uses), but not structural.  
  - **Social Construction/Checklists:** You’ve ruled these out—wise. They’re table stakes, not insight.  

  ### Blueprint for Your Piece
  - **Lead with Competence (#1):** Start with a vivid medical or elder-care scenario. Show how threshold models fail vulnerable people, enabling coercion. Segue into GDPR dark patterns exploiting cognitive load.  
  - **Pivot to Valid-but-Illegitimate (#2):** Use this to ask, "Why did 'valid' consent feel like a betrayal?" Hit NDAs and gig economy contracts. Argue consent needs *ethical guardrails*.  
  - **Close with Performance vs. Intent (#3):** End in the digital realm (GDPR, AI). Pose: "If the system only sees the 'act,' are we all vulnerable?"  
  - **Word Allocation:** 40% on #1, 30% on #2, 20% on #3, 10% for herrings/color.  

  ### What Would Shift the Rankings?
  - **#1 (Competence) Down:** If courts double down on binary thresholds (e.g., SCOTUS upholding rigid capacity tests).  
  - **#2 (Valid-but-Illegitimate) Up:** If EU/UK/US pass laws explicitly voiding consents under power imbalances (watch California’s NDA reforms).  
  - **#3 (Performance) Up:** If emotion-sensing consent tech gains legal traction or sexual assault convictions spike under "affirmative act" laws.  

  Be ruthless: If you can’t tie a question to a real-world consequence—a law changed, a hospital policy rewritten, an NDA shredded—cut it. Your thesis thrives on showing consent’s cracks *matter*. Now go break some furniture.
