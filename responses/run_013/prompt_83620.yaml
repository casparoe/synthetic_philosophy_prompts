  ### Core Game Design
  **One-Sentence Version:** Teams draw objects from a small, composition-known bag to bet on the hypothesis "All ravens are black," discovering through sequential bets that non-black non-ravens (like a green shirt) yield the strongest evidence by eliminating rare counterexamples.

  ### Setup
  - **Teams:** Divide students into groups of 3–4. Each team represents investigators testing the hypothesis.  
  - **Materials per Team:**  
    - A bag containing 10 objects (use labeled tokens or small items):  
      - 8 "black raven" tokens (e.g., black beads labeled "R").  
      - 1 "black shoe" token (e.g., black cube labeled "S").  
      - 1 "green shirt" token (e.g., green tile labeled "G").  
    - A card stating the bag's composition:  
      - Total objects: 10  
      - Ravens: 8  
      - Non-ravens: 2 (1 black, 1 non-black).  
    - 3 sealed envelopes labeled "Draw 1," "Draw 2," "Draw 3," containing the tokens (ensures fixed order: Draw 1 = black raven, Draw 2 = black shoe, Draw 3 = green shirt).  
    - A betting sheet to record probabilities (p0, p1, p2, p3) after each draw.  
    - Starting chips: 100 per team (use poker chips or candy).  
  - **Hypothesis:** "All ravens are black" (true in this setup; no non-black ravens exist).  

  ### Rules
  1. **Prior Belief (p0):** Teams start by assigning a prior probability (0–100%) to the hypothesis. Record as p0. Suggest 50% if teams are unsure.  
  2. **Sequential Draws & Betting:**  
     - Open **Draw 1 (black raven)**, discuss, update probability to p1. Record.  
     - Open **Draw 2 (black shoe)**, discuss, update to p2. Record.  
     - Open **Draw 3 (green shirt)**, discuss, update to p3. Record.  
  3. **Scoring (Quadratic Scoring Rule):**  
     - After revealing the hypothesis is **true**, calculate each team's final score:  
       \[
       \text{Score} = 100 \times \left[1 - (1 - p_3)^2\right]
       \]  
       (e.g., if \(p_3 = 60\% = 0.6\), score = \(100 \times [1 - (0.4)^2] = 100 \times 0.84 = 84\)).  
     - Teams earn chips equal to their score (higher score = more chips).  

  ### Why the Mechanic Works
  - **Small world (10 objects)** ensures non-black objects are scarce (only 2 exist: 1 black, 1 non-black).  
  - **Bayesian updating** (simplified): Each *non-counterexample* (object not a non-black raven) increases the probability of the hypothesis. The update magnitude grows with each draw because fewer objects remain.  
    - Expected probability shifts (starting from 50% prior):  
      - After black raven: ~52.6% (LR = 10/9)  
      - After black shoe: ~55.6% (LR = 9/8)  
      - After green shirt: **~58.8%** (LR = 8/7, strongest update).  
  - **Scoring rule** penalizes underconfidence: Teams refusing to update on the green shirt (e.g., staying at 55%) score lower (84 chips) than teams updating to 60% (91 chips).  

  ### Timeline (90 Minutes)
  - **0–10 min:** Introduce hypothesis, rules, and scoring. Emphasize: "No math—use intuition. Goal is to bet accurately."  
  - **10–15 min:** Distribute materials. Teams assign p0.  
  - **15–40 min:**  
    - 15–25 min: Teams open Draw 1, discuss, record p1.  
    - 25–35 min: Draw 2, discuss, record p2.  
    - 35–40 min: Draw 3, discuss, record p3.  
  - **40–50 min:** Reveal hypothesis is true. Calculate scores, distribute chips.  
  - **50–70 min:** **Debrief (critical!):**  
    - Ask teams: "Share p0→p1→p2→p3. Why did/didn’t you move on the green shirt?"  
    - Highlight a team that updated most on the green shirt. Ask: "Did it feel like strong evidence? Why?"  
    - Point to game moments:  
      - *Draw 1 (black raven)*: "This moved you slightly—many ravens, one more black isn’t surprising."  
      - *Draw 2 (black shoe)*: "No move? Expected—black non-ravens don’t test the hypothesis."  
      - *Draw 3 (green shirt)*: "Bigger move? This ruled out 1 of 2 rare non-black objects that *could* have been a raven."  
    - Explain key ideas:  
      - **Raven equivalence:** "All ravens are black" = "All non-black things are non-ravens." A green shirt (non-black non-raven) *is* confirming evidence.  
      - **Small world effect:** With few non-black objects, eliminating one is powerful.  
      - **Real-world catch:** "The *actual* world has billions of non-black objects. Each green apple rules out 0.0000001% of counterexamples—too tiny to feel. Yes, it’s evidence. No, you’ll never notice."  
  - **70–85 min:** Discuss limitations:  
    - "This game assumes a tiny, known world. Reality has unknown raven/non-black counts and sampling bias (e.g., we don’t ‘draw’ Earth’s objects randomly)."  
  - **85–90 min:** Q&A and hand out remaining chips.  

  ### What Will Go Wrong (and How to Fix)
  - **Problem:** Teams freeze at priors (e.g., stick at 50%). Why? Humans underweight small evidence, and updates feel "unintuitive."  
    - **Fix:** Pressure them with scoring. Say: "Teams that ignore the green shirt lose chips. Bet what you *truly* believe!"  
  - **Problem:** Black raven overshadows green shirt. Why? "Raven" feels directly relevant.  
    - **Fix:** In debrief, contrast the 10-object math: Black raven = +2.6% vs. green shirt = +3.2%. Ask: "Which felt weaker? Why?"  
  - **Problem:** Poet/playwright hijacks discussion. Why? Creative folks resist "cold" logic.  
    - **Fix:** Assign roles: "Skeptic" (argues against updates), "Bayesian" (argues for), "Recorder" (settles bets).  

  ### What the Game Can’t Reproduce (Be Honest in Debrief)
  - The real world’s vastness dilutes the effect to near-zero. The green shirt’s "strength" here relies on a toy universe with 10 objects and 2 non-black things. In reality, non-black objects (green apples, white shoes, etc.) are astronomically abundant, so each one eliminates a vanishingly small fraction of potential counterexamples. The paradox’s "trick" is that logic demands even a green apple *is* evidence, but your brain rightly dismisses it because the update is smaller than any measurable threshold. The game makes you *feel* the math; reality makes you ignore it.  

  ### Final Prep Tips
  - **Test the math:** With p0=50%, updates should be p1≈52.6%, p2≈55.6%, p3≈58.8%. Scores: p3=60% → 91 chips; p3=55% → 84 chips.  
  - **Lean into conflict:** "The playwright will argue. Let them. The scoring rule will punish stubbornness."  
  - **Keep energy high:** Use candy chips, set a 2-minute timer for discussions, and start the debrief with: "Who won? Who got robbed?"  

  This design forces the "aha" moment: the green shirt *must* move bets in a small world, or teams lose chips. By the debrief, they’ll hold both the math and the intuition—and your novelist’s ornithologist will finally feel real.
