prompt: |-
  I am the lead epidemiologist for the causal-attribution unit at a state occupational health agency. When a worker develops a disease that may have come from a workplace exposure, my unit issues a written determination that the exposure did or did not cause the disease. Those determinations go to a compensation board, they get appealed, and about forty times a year one of them decides whether a household keeps its medical coverage and wage replacement. I have a lawyer, an industrial hygienist, and a rotating panel of outside physicians to work with, our exposure measurements are almost always rough and retrospective, we cannot run anything resembling an experiment, and we have to get the determination out in about six weeks. My difficulty is that the philosophers we occasionally consult keep handing me two different pictures of what I am supposed to be establishing. On one picture, I am asking whether this worker's disease would have occurred anyway if the exposure had been absent, which is a difference-making question about one case. On the other picture, I am asking whether the exposure is the sort of thing that makes a difference when you intervene on it within a system of variables, which is supposed to be the better-behaved notion but which seems to change its answer depending on how finely the variables are carved, so that I can flip a determination by redrawing my own diagram. Nobody has told me how to decide between the two pictures, or what to do when they disagree, and I suspect that a great deal of what my unit currently does is one picture wearing the other one's clothes.

  Please turn this into a procedure my unit can actually run. I want the questions in the order they should be asked, what counts as a sufficient answer to each, which steps my hygienist can complete alone and which require the physician panel, and an explicit list of the points at which the procedure stops and hands the file to a human being because the remaining question is one of legal or moral standards rather than of causation. Build the procedure around a small vocabulary the lawyer can follow, with every term defined in plain words, and give it three separate verdicts that it must return independently for each file: that the exposure made a difference in this particular case; that the exposure was part of the mechanism that produced this outcome; and that the exposure raises the probability of the outcome relative to a stated reference class. For each verdict, say what it can and cannot establish, and give me a rule for what to do when the three come apart, including which of them my determination should rest on and which are merely corroborating. Two further requirements, because I have been burned before. The procedure must contain a step where we write down the alternative way of carving up the variables, exposures, and outcomes for the file and record whether that alternative carving would have reversed the verdict, so that the sensitivity is on the record rather than in someone's head. And it must be honest, at each stage, about which steps are real tests and which are judgment calls dressed up as tests. I do not want a reading list or citations; I want the form.

  Then run the procedure on four files we have actually had, and tell me where it strains. The first is a worker with two exposures at levels each of which is independently sufficient for his disease, where he would have been harmed by either alone. The second is a worker whose disease was going to develop eventually regardless, but whose onset appears to have been moved forward by roughly a decade by the exposure. The third is a worker harmed by a ventilation system that was never installed, so the relevant intervention is the removal of a protection rather than the addition of a hazard. The fourth is a worker with a common genetic susceptibility for whom the exposure appears to have mattered only in combination with that susceptibility. I will admit my own leanings: my instinct in the second file is to find no causation, and my instinct in the first is to find causation even though I cannot say which exposure did it, and I suspect the procedure will not let me have both. If it does not, say so plainly and tell me what I would have to give up. Finish by telling me what the procedure cannot do at all, and which files should never be routed through it in the first place. Write the procedure and the worked cases in American English, and keep the whole thing usable by someone who has never read a page of philosophy.
reasoning: |-
  We are designing a procedure for the causal-attribution unit. The procedure must answer three distinct questions for each case and then provide guidance on how to resolve when they conflict. The three verdicts are:

  1. **Difference-Making (DM)**: Did the exposure make a difference in this particular case? (Counterfactual: Would the disease have occurred at the same time and in the same way if the exposure had been absent?)
  2. **Mechanistic Role (MR)**: Was the exposure part of the mechanism that produced the disease in this case? (We are looking at the actual causal pathway that led to the disease and whether the exposure was a necessary step in that pathway.)
  3. **Probability Raising (PR)**: Does the exposure raise the probability of the disease relative to a stated reference class? (This is about general tendencies, not necessarily about this specific case.)

  The procedure must be step-by-step, with clear definitions, and indicate when to stop for human judgment. It must also include a step to record alternative variable carvings and their potential impact.

  ### Definitions (Plain English Vocabulary)

  - **Exposure**: The workplace condition or event that we are evaluating (e.g., chemical, dust, noise, or lack of a protection).
  - **Disease**: The health condition the worker developed.
  - **Reference Class**: A group of people who are similar to the worker in relevant ways (e.g., same job, same age, same genetic susceptibility, same smoking status) but without the exposure. We define this carefully for each case.
  - **Causal Diagram**: A drawing (or mental model) of how the exposure might lead to the disease, including other factors (like genetics, age, or other exposures). We will draw a simple diagram for each case.

  ### Procedure Steps

  **Step 1: Initial Case Intake (Lawyer and Epidemiologist)**
     - Collect all known facts: worker's job, exposure history, medical records, disease diagnosis, and timeline.
     - Identify the specific exposure(s) under investigation and the disease.
     - **Stop and hand to human**: If there is insufficient information to proceed, document and return for more data collection. Otherwise, proceed.

  **Step 2: Define the Reference Class (Epidemiologist and Industrial Hygienist)**
     - Define a reference class of workers who are like the exposed worker but without the exposure. Consider factors like age, sex, genetics (if known), smoking, and other relevant non-occupational factors.
     - Write down the reference class clearly in the file.
     - **Judgment call**: This step requires expert judgment. The hygienist and epidemiologist define the reference class, and the lawyer reviews for legal appropriateness.

  **Step 3: Draw the Causal Diagram (Epidemiologist with Hygienist and Physician Panel)**
     - Draw a simple diagram (boxes and arrows) showing:
          - The exposure.
          - The disease.
          - Other factors that might cause the disease (e.g., genetics, age, lifestyle, other exposures).
          - Arrows showing how they might be connected.
     - Example: [Exposure] -> [Intermediate step] -> [Disease]
     - **Record alternative carving**: Draw an alternative diagram that carves the variables more finely (e.g., breaking down the exposure into specific levels or components) or more coarsely (e.g., grouping multiple exposures). For each diagram, note if the causal story changes.
     - **Stop and hand to human**: If the diagramming reveals fundamental uncertainty about the disease mechanism (e.g., we don't know how the disease develops), then we cannot answer MR and must note that. Proceed with DM and PR.

  **Step 4: Probability Raising (PR) (Epidemiologist and Hygienist)**
     - **Question**: Does the exposure raise the probability of the disease in the reference class?
     - **Method**: Use available data (e.g., scientific literature, workplace data) to compare the disease rate in the reference class without exposure to the rate with exposure. If data is lacking, use expert judgment (physician panel) to estimate.
     - **Sufficient answer**: If the rate is higher in the exposed group, then PR = Yes. If not, PR = No. If unknown, PR = Unknown.
     - **What it establishes**: PR says that the exposure is a risk factor in general. It does not prove it caused the disease in this specific case.
     - **Judgment call**: The choice of reference class and the quality of data are critical. The hygienist and epidemiologist do this step, consulting the physician panel if needed.

  **Step 5: Mechanism (MR) (Physician Panel with Hygienist)**
     - **Question**: In this specific case, was the exposure a necessary part of the actual chain of events that led to the disease?
     - **Method**: Based on the causal diagram (Step 3) and the worker's medical and exposure history, the physicians determine if the exposure was a step in the pathway. They must consider if removing the exposure would break the chain of events that actually occurred.
     - **Sufficient answer**: If the exposure was a necessary step in the actual pathway (without which the disease wouldn't have occurred as it did), then MR = Yes. If the disease could have occurred via a different pathway without the exposure, MR = No. If unknown, MR = Unknown.
     - **What it establishes**: MR tells us about the actual process. It does not necessarily tell us if the exposure made the difference (because there might be backup causes).
     - **Judgment call**: Requires medical expertise.

  **Step 6: Difference-Making (DM) (Epidemiologist and Physician Panel)**
     - **Question**: Would the worker have developed the disease at the same time and in the same way if the exposure had not occurred?
     - **Method**: Construct a counterfactual scenario: the same worker in the same job without the exposure. Use the causal diagram to see if the disease would still have occurred. Consider:
          - If there are other sufficient causes (like another exposure or a genetic condition) that would have caused the disease anyway, then DM might be No.
          - If the exposure was necessary to trigger the disease at that time, then DM might be Yes.
     - **Sufficient answer**: 
          - If the disease would not have occurred at all without the exposure, DM = Yes.
          - If the disease would have occurred at the same time without the exposure, DM = No.
          - If the disease would have occurred but at a different time (e.g., later), then we note that and set DM = Partial (and describe the timing change).
     - **What it establishes**: DM directly addresses the counterfactual in this case. It is the closest to the legal notion of "but-for" cause.
     - **Judgment call**: Requires careful consideration of the individual case and the diagram.

  **Step 7: Resolve Verdicts and Make Determination (Epidemiologist with Lawyer)**
     - We now have three independent verdicts: DM, MR, PR (each Yes, No, Partial, or Unknown).
     - **Rule for Determination**:
          - **Primary**: The determination of causation (for compensation) rests on DM. Why? Because it directly addresses whether the exposure made a difference for this worker.
          - **Corroborating**: 
              - MR is used to support DM. If DM is Yes and MR is Yes, that strengthens the case. If DM is Yes but MR is No, we need to reexamine the mechanism because it might indicate an error. However, DM is primary.
              - PR is used to show that the exposure is a known risk factor. If PR is Yes, it supports the plausibility of DM. If PR is No, it undermines DM (unless we have a very specific reason for this case being different).
          - **When they come apart**:
              - If DM = Yes and PR = No: This is unusual. We must revisit the reference class and the data for PR. If PR remains No, we may still use DM but note the conflict.
              - If DM = No but MR = Yes: This suggests that the exposure was part of the mechanism but was not necessary because there was a backup cause. We might still say the exposure contributed but did not make the difference. However, for compensation, we follow DM (so no causation).
              - If DM = Partial (e.g., the exposure advanced the disease): We treat this as a Yes for causation, but note the timing effect. Compensation may be adjusted for the timing (but that is for the board).
          - **Final Determination Rule**:
              - If DM = Yes or Partial, then we find causation (the exposure caused the disease).
              - If DM = No, then we find no causation.
              - Exceptions: If DM is Unknown, then we fall back on MR and PR. If both MR and PR are Yes, we find causation. If either is No, we find no causation. If both are Unknown, we return "Inconclusive".

     - **Record Sensitivity**: For each step where we had alternative carvings (especially Step 3), we note whether the alternative diagram would have changed the verdict for DM, MR, or PR.

  **Step 8: Write Determination (Epidemiologist and Lawyer)**
     - Write the determination, including:
          - The three verdicts (DM, MR, PR) and the reasoning.
          - The reference class used for PR.
          - The causal diagram and the alternative carving note.
          - The final determination (causation or not) and any qualifications (like partial causation).

  **Step 9: Review and Appeal Note (Lawyer)**
     - The lawyer reviews for legal standards and ensures the determination is clear for the compensation board.

  ### Limitations of the Procedure
  - **Cannot handle**: Cases where the disease has multiple independent causes and we cannot determine the counterfactual (DM) due to lack of data.
  - **Should not be used**: For diseases with very long latency periods where exposure reconstruction is impossible, or when the disease is extremely rare and no reference class exists.
  - **Requires human judgment**: At every step, but especially in Steps 2, 3, 5, and 6.

  ---

  ### Worked Cases

  **Case 1: Two Exposures, Each Independently Sufficient**

  *Background*: A worker was exposed to two different chemicals (A and B). Each exposure, at the levels measured, is independently sufficient to cause the disease. The worker got the disease. Without either exposure, the worker would not have gotten the disease? Actually, no: if either one was present, the disease would have occurred. But without both, the disease would not have occurred? That's not the case here. The problem states: "each of which is independently sufficient". So, if exposure A had been absent, the worker still had exposure B (which is sufficient) so the disease would have occurred anyway. Similarly, without B, A would have caused it.

  - **Step 1**: Intake complete.
  - **Step 2**: Reference class: Workers with the same job without both exposures? Or without one of them? We define two reference classes: 
     - Class 1: Workers without exposure A but with exposure B (if such exist) -> high disease rate.
     - Class 2: Workers without exposure B but with exposure A -> high disease rate.
     - But we also need a class without either. We define the reference class as workers without either A or B. That class has a low disease rate. So PR = Yes (exposure to A or B raises the probability).
  - **Step 3**: Causal diagram:
     ```
     [Exposure A] --> [Disease]
     [Exposure B] --> [Disease]
     ```
     Alternative carving: If we carve by individual chemical, then both are causes. If we carve by "exposure to at least one", then we have one variable. The alternative carving does not change the mechanism in this case.
  - **Step 4 (PR)**: Yes, exposure (to A or B) raises the probability relative to no exposure.
  - **Step 5 (MR)**: For the actual case, both exposures were present. But the disease could have been caused by either. So was each necessary? No. If we remove A, B was still there and would have caused it. Similarly for B. However, the actual mechanism might have been triggered by A, or by B, or both. We don't know. But in the actual chain, one of them was the trigger. However, without knowing which one, we cannot say that either was necessary in the mechanism? Actually, if we consider the mechanism as requiring at least one of them, then the mechanism would have been broken if both were absent. But in the actual case, both were present. We can say that the presence of at least one was part of the mechanism. But individually, neither A nor B is necessary. We might set MR = Yes for the combined exposure (if we carve as "exposure to at least one") but if we carve as two separate exposures, then for each one, MR might be No. But note: the exposure under investigation might be both? Or we are considering each? The problem says "two exposures". We must define what we are attributing. If we are attributing to the workplace as a whole, then the workplace exposure (which included both) was part of the mechanism. However, if we are being asked about each individually, we cannot say which one did it. So we might set MR = Yes for the overall exposure condition (having at least one of A or B) but if we are considering each chemical separately, then for each, MR = Unknown (because we don't know which one actually triggered it). This is a problem. We must define the exposure variable clearly. In this case, we are likely evaluating the workplace exposure as a whole. So we can consider the exposure as "presence of at least one of the two chemicals". Then MR = Yes (because without any, the disease wouldn't have occurred). But note: the actual pathway might have used only one. However, the presence of the chemicals was necessary (because if both were absent, it wouldn't have occurred). So we set MR = Yes for the overall exposure condition.

    Alternatively, if the claim is about a specific chemical, then we cannot prove MR for that chemical alone because the other was sufficient. This is a key point. We must know what the claim is about. Let's assume the claim is about the workplace having hazardous exposures (both A and B). Then we set the exposure variable as "exposure to A and/or B". Then MR = Yes.

  - **Step 6 (DM)**: We ask: if the worker had not been exposed to either A or B, would the disease have occurred? No. So DM = Yes for the absence of both. But note: the question is about the exposure that was present. The exposure was the presence of at least one. So if we remove the entire exposure (both A and B), then the disease would not have occurred. So DM = Yes.

    However, if we are considering each exposure individually:
        - If we remove only A, the worker still had B (which is sufficient) so the disease would have occurred anyway -> DM for A = No.
        - Similarly for B: DM = No.

    But the worker was exposed to both. We are making a determination about the workplace. We are not being asked to choose between A and B. The determination is about the exposure that occurred, which included both. So we define the exposure as the presence of the hazardous workplace condition (which includes both A and B). Then DM = Yes.

  - **Step 7**: 
     - DM = Yes (for the overall exposure)
     - MR = Yes (for the overall exposure)
     - PR = Yes
     - All agree: Causation found.

    If we had to assign to a specific chemical, we would have to say we cannot attribute to either one individually. But the procedure allows us to define the exposure as the overall condition. Therefore, we find causation.

  **Case 2: Exposure Advances Onset**

  *Background*: A worker developed a disease that he was going to get eventually (e.g., due to genetics or age), but the exposure moved the onset forward by about 10 years.

  - **Step 1**: Intake complete.
  - **Step 2**: Reference class: Workers without the exposure but with the same susceptibility (e.g., same age, same genetic marker). We expect the disease to occur at a later age in that class.
  - **Step 3**: Causal diagram:
     ```
     [Genetic susceptibility] --> [Disease]
     [Exposure] --> [Disease] (accelerating onset)
     ```
     Alternative carving: We could carve time of onset as a continuous variable or as a binary (before/after a certain age). The alternative might matter. We'll use the binary for DM and continuous for MR? We note: if we carve the outcome as "disease before age X", then the exposure might be a cause. If we carve as "disease ever", then the exposure may not be necessary.
  - **Step 4 (PR)**: In the reference class (susceptible workers without exposure), the disease occurs at a later age. But does the exposure raise the probability of the disease by a certain age (say, the worker's current age)? Yes, because without exposure the disease would be less likely at that age. So PR = Yes for the outcome "disease by age Y" (where Y is the worker's age at diagnosis).
  - **Step 5 (MR)**: Was the exposure part of the mechanism that produced the disease at the time it occurred? Yes, because the exposure accelerated the process. Without the exposure, the disease would not have occurred at that time. So MR = Yes.
  - **Step 6 (DM)**: Counterfactual: without the exposure, would the worker have developed the disease at the same time? No, it would have occurred later. So the exposure made a difference to the timing. We set DM = Partial (because it caused an earlier onset). 
     - According to Step 7 rule: Partial is treated as Yes for causation, but we note the timing effect.
  - **Step 7**:
     - DM = Partial
     - MR = Yes
     - PR = Yes (for the outcome at the observed age)
     - All support causation. Determination: Causation found, with note that the exposure advanced the onset.

  But note: the epidemiologist's instinct was to find no causation. However, the procedure finds causation because the exposure did make a difference (to timing). This is a conflict with the instinct.

  Why the instinct? Maybe because the disease was inevitable. But the exposure caused harm by making it happen earlier. The harm is the early onset. Therefore, the procedure says: we must consider the timing as part of the harm. This might be a legal/moral question: is causing a disease to occur 10 years early a compensable harm? The procedure says yes for causation, but the compensation board might adjust the award for the timing.

  **Case 3: Harm by Lack of Protection**

  *Background*: A worker was harmed because a ventilation system was never installed. So the exposure is the absence of protection (high levels of a chemical) that resulted from the lack of ventilation.

  - **Step 1**: Intake complete. Exposure defined as "high levels of chemical X due to lack of ventilation".
  - **Step 2**: Reference class: Workers in similar workplaces with ventilation (so low levels of chemical X). We assume that with ventilation, the chemical levels would have been low.
  - **Step 3**: Causal diagram:
     ```
     [Lack of ventilation] --> [High chemical X] --> [Disease]
     ```
     Alternative carving: We could carve the exposure as "high chemical X" (which is what the worker was exposed to) and note that the lack of ventilation is the cause of that. But we are directly evaluating the high chemical X as the exposure. Alternatively, we could evaluate the intervention of installing ventilation. But we are consistent: the exposure is the high level of the chemical.
  - **Step 4 (PR)**: Does high chemical X (relative to low) raise the probability of the disease? Yes, according to literature. So PR = Yes.
  - **Step 5 (MR)**: Was the high chemical X a necessary part of the mechanism? Yes, because without it, the disease wouldn't have occurred. So MR = Yes.
  - **Step 6 (DM)**: Counterfactual: if the ventilation had been installed (so chemical levels low), would the disease have occurred? We assume not (if the low level is safe). So DM = Yes.
  - **Step 7**: All verdicts are Yes. Causation found.

  **Case 4: Genetic Susceptibility**

  *Background*: A worker has a common genetic susceptibility. The exposure only causes the disease in combination with this susceptibility.

  - **Step 1**: Intake complete. Exposure is present, genetic susceptibility is present.
  - **Step 2**: Reference class: Workers with the same genetic susceptibility without the exposure. We expect a lower disease rate in that class than in exposed workers with the susceptibility.
  - **Step 3**: Causal diagram:
     ```
     [Genetic susceptibility] --> [Disease]
     [Exposure] --> [Disease] (but only when susceptibility is present)
     ```
     Note: The exposure alone (without susceptibility) does not cause the disease. The susceptibility alone (without exposure) might cause the disease but at a lower rate or later? We need information. We assume that without exposure, the susceptibility alone would rarely cause the disease (or later). With exposure, it causes it more often and earlier.
     Alternative carving: We could combine the exposure and susceptibility into one variable (having both) but we keep them separate.
  - **Step 4 (PR)**: In the reference class (workers with susceptibility but no exposure), the disease rate is low. With exposure, it is high. So PR = Yes (for the exposed and susceptible group).
  - **Step 5 (MR)**: In this case, both the susceptibility and the exposure were necessary for the disease to occur at this time? Without the exposure, the disease might not have occurred (or occurred much later). Without the susceptibility, the exposure wouldn't have caused it. So in the actual mechanism, both were necessary. Therefore, the exposure was a necessary part of the mechanism (because if you remove the exposure, the mechanism doesn't fire). So MR = Yes.
  - **Step 6 (DM)**: Counterfactual: without the exposure, would the disease have occurred at the same time? We assume not (because the susceptibility alone would not have caused it at this time). So DM = Yes.
  - **Step 7**: All verdicts are Yes. Causation found.

  ### Where the Procedure Strains

  - **Case 2**: The procedure finds causation (due to advancing onset) even though the epidemiologist's instinct was no. The procedure forces us to acknowledge that advancing the onset by 10 years is a harm and the exposure caused that harm. But if the legal standard requires that the exposure caused the disease to occur (as opposed to causing it earlier), then we might have a conflict. The procedure notes that DM is partial, so we are transparent. The compensation board can then decide if an advanced onset is compensable.

  - **Case 1**: The procedure works if we define the exposure as the overall hazardous condition (presence of at least one of the chemicals). But if we are forced to attribute to a specific chemical, we run into trouble because we cannot say which one was the difference-maker. The procedure requires us to define the exposure variable clearly at the start. In this setting, we are evaluating the workplace exposure, so the overall condition is appropriate.

  ### What the Procedure Cannot Do

  - It cannot handle cases with extreme uncertainty in the counterfactual (e.g., when we have no idea what would have happened without the exposure).
  - It cannot resolve cases where the reference class is undefined or unknowable (e.g., a unique combination of factors).
  - It should not be used for diseases with unknown etiology or when the mechanism is completely unknown (unless we can still assess DM and PR).
  - It requires a clear timeline and exposure data. If the exposure cannot be estimated even roughly, we cannot proceed.

  ### Final Note
  The procedure forces explicit choices and records sensitivities. It prioritizes DM for the determination, but uses MR and PR for support. It may require giving up the instinct to deny causation in the advanced onset case because the exposure did cause harm (earlier disease). Similarly, in the two-exposure case, we can find causation by defining the exposure appropriately.

