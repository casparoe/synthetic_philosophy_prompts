answer: |-
  ### Causal Attribution Procedure for Occupational Disease  
  *Version 1.0 — For Use by State Occupational Health Agency*  

  **Purpose**: To determine whether a workplace exposure caused a worker’s disease. Returns three independent verdicts and a final determination.  

  ---

  ### I. DEFINITIONS (PLAIN ENGLISH)  
  1. **Exposure**: The workplace condition being investigated (e.g., chemical, noise, lack of safety equipment).  
  2. **Disease**: The health condition the worker developed.  
  3. **Reference Class**: A group of workers similar to the affected worker *except* for the exposure. Factors to match: age, genetics (if known), smoking, and other major non-work risks.  
  4. **Causal Diagram**: A drawing of how the exposure might lead to disease, including other causes (e.g., genetics, lifestyle). Use boxes for factors and arrows for influences.  
  5. **Verdicts**:  
     - **DM (Difference-Making)**: "Did the exposure change *this worker’s* outcome? (Without it, would the disease have happened *at the same time and in the same way?*)"  
       - *Establishes*: Whether the exposure altered the specific outcome.  
       - *Cannot establish*: If multiple exposures could have caused the same outcome.  
     - **MR (Mechanistic Role)**: "Was the exposure a necessary step in the *actual chain of events* that led to the disease?"  
       - *Establishes*: If the exposure was part of the disease’s biological pathway.  
       - *Cannot establish*: If the disease could have happened another way.  
     - **PR (Probability Raising)**: "Does this exposure generally increase the chance of disease *in similar workers*?"  
       - *Establishes*: If the exposure is a known risk factor.  
       - *Cannot establish*: If it caused the disease *in this case*.  

  ---

  ### II. PROCEDURE STEPS  
  *Order of operations, roles, and stopping points. Complete within 6 weeks.*  

  #### **STEP 1: Intake & Diagramming**  
  - **Who**: Epidemiologist + Hygienist + Physician Panel.  
  - **Questions**:  
    1. What is the *exposure*? (Specify: type, duration, estimated level.)  
    2. What is the *disease*? (Confirm diagnosis with physicians.)  
    3. What *other factors* could have caused the disease? (e.g., genetics, smoking, hobbies.)  
  - **Actions**:  
    - Draw the **initial causal diagram** (see example below).  
    - **Record alternatives**: Redraw the diagram with variables carved *more finely* (e.g., "asbestos exposure" split into "short-term/high-dose" and "long-term/low-dose") and *more coarsely* (e.g., "all airborne toxins" grouped). Note if verdicts would flip under alternative diagrams.  
  - **Sufficient Answer**: Diagram includes exposure, disease, and ≥2 other factors.  
  - **Stop & Hand to Human**: If exposure/disease definitions are ambiguous (e.g., "stress" with no medical consensus).  

  #### **STEP 2: Reference Class**  
  - **Who**: Epidemiologist + Hygienist (physicians consult if medical factors).  
  - **Question**: "What group of workers is comparable to this worker *minus the exposure*?"  
  - **Actions**: Define reference class (e.g., "non-smoking males aged 50–60 with family history of lung disease").  
  - **Sufficient Answer**: Class is defined with 3–4 key traits.  
  - **Judgment Call**: Traits chosen are based on data availability, not completeness.  

  #### **STEP 3: Probability Raising (PR)**  
  - **Who**: Hygienist (alone, using exposure data + literature).  
  - **Question**: "In the reference class, are exposed workers *more likely* to get the disease than unexposed?"  
  - **Actions**: Compare disease rates using:  
    - Workplace exposure records,  
    - Published studies (e.g., "This chemical increases risk by 20% in similar workers").  
  - **Sufficient Answer**: PR = **Yes** (exposure increases risk), **No** (no increase), or **Unknown** (data missing).  
  - **Judgment Call**: "Unknown" if data is retrospective/low-quality.  

  #### **STEP 4: Mechanistic Role (MR)**  
  - **Who**: Physician Panel (hygienist provides exposure details).  
  - **Question**: "In *this worker*, was the exposure a necessary link in the disease’s biological chain?"  
  - **Actions**:  
    - Review medical records, lab results, and causal diagram.  
    - Apply biological knowledge (e.g., "Chemical X causes DNA damage found in the tumor").  
  - **Sufficient Answer**: MR = **Yes** (exposure was necessary for the disease pathway), **No** (disease occurred independently), or **Unknown** (mechanism unclear).  
  - **Stop & Hand to Human**: If disease has >3 possible causes with equal evidence.  

  #### **STEP 5: Difference-Making (DM)**  
  - **Who**: Epidemiologist + Physician Panel.  
  - **Question**: "Without the exposure, would this worker *still* have developed the disease *at the same time and in the same way*?"  
  - **Actions**:  
    - Build a "what-if" scenario: Remove the exposure from the causal diagram.  
    - Consider:  
      - If other causes *alone* could have produced the same outcome.  
      - If exposure *changed the timing* of disease (e.g., caused it 10 years early).  
  - **Sufficient Answer**:  
    - DM = **Yes** (disease would *not* have occurred without exposure),  
    - **No** (disease would have occurred anyway),  
    - **Partial** (exposure changed timing/severity but not inevitability).  
  - **Judgment Call**: Heavy reliance on diagram and medical opinion.  

  #### **STEP 6: Final Determination & Conflict Rule**  
  - **Who**: Epidemiologist + Lawyer.  
  - **Actions**:  
    1. Record all three verdicts (DM, MR, PR).  
    2. **Apply conflict rule**:  
       - **Primary verdict for determination**: **DM** (it addresses *this worker’s outcome*).  
       - **Corroborating verdicts**:  
         - MR supports but is not required (a "No" may mean the disease had backup pathways).  
         - PR supports but is not required (a "No" may mean this case is an exception).  
       - **Resolution**:  
         | DM       | MR/PR Conflict? | Determination                     |  
         |----------|-----------------|-----------------------------------|  
         | Yes      | Any             | **Exposure caused disease**       |  
         | No       | Any             | **Exposure did not cause disease**|  
         | Partial  | Any             | **Exposure contributed to disease** (note timing/severity change)|  
         | Unknown | MR + PR = Yes   | **Inconclusive** (leaning yes)    |  
         | Unknown | MR or PR = No   | **Inconclusive** (leaning no)     |  
    3. Write determination for compensation board, including:  
       - All three verdicts and reasoning.  
       - Reference class.  
       - Diagram alternatives and their impact.  
       - Any "Partial" DM effects (e.g., "Exposure accelerated disease by X years").  
  - **Stop & Hand to Human**: If DM = Partial or Unknown (compensation board decides moral/legal weight).  

  ---

  ### III. WORKED CASES  
  #### **Case 1: Two Exposures, Each Independently Sufficient**  
  - **Background**: Worker exposed to Chemical A and Chemical B. Either alone could cause the disease.  
  - **Procedure**:  
    - **STEP 1**: Diagram shows both chemicals pointing to disease. Alternative carving: Group A/B as "toxic exposure" (no flip).  
    - **STEP 2**: Reference class = workers with no chemical exposure.  
    - **STEP 3 (PR)**: Yes (both chemicals raise risk).  
    - **STEP 4 (MR)**: Yes (exposure to *at least one chemical* was necessary; individually, either is sufficient but not necessary).  
    - **STEP 5 (DM)**: **No** (without Chemical A, Chemical B would still have caused the disease; same for B).  
  - **Verdicts**: DM = No, MR = Yes, PR = Yes.  
  - **Determination**: Exposure did not cause disease (DM is primary). *Your instinct (causation) is overruled by DM*.  
  - **Strain**: DM forces "No" because either exposure alone sufficed. To get "Yes," you must define exposure as *both A and B together* (e.g., "synergistic effect"), but this contradicts "independently sufficient."  

  #### **Case 2: Exposure Advances Onset by 10 Years**  
  - **Background**: Worker would have gotten disease eventually, but exposure caused it 10 years early.  
  - **Procedure**:  
    - **STEP 1**: Diagram shows exposure and "age" as causes. Alternative carving: Outcome = "disease at age X" (flips DM to Yes).  
    - **STEP 2**: Reference class = workers with same genetic risk, no exposure.  
    - **STEP 3 (PR)**: Yes (exposure increases risk of *early* disease).  
    - **STEP 4 (MR)**: Yes (exposure triggered disease pathway earlier).  
    - **STEP 5 (DM)**: **Partial** (without exposure, disease would have occurred later).  
  - **Verdicts**: DM = Partial, MR = Yes, PR = Yes.  
  - **Determination**: **Exposure contributed to disease** (board decides compensation for 10-year acceleration).  
  - **Strain**: Conflicts with your instinct (no causation). Procedure forces acknowledgment of harm from early onset.  

  #### **Case 3: Harm from Lack of Ventilation**  
  - **Background**: Worker developed lung disease due to uninstalled ventilation.  
  - **Procedure**:  
    - **STEP 1**: Exposure = "absent ventilation → high dust levels." Diagram: [No Ventilation] → [High Dust] → [Disease].  
    - **STEP 2**: Reference class = workers with ventilation.  
    - **STEP 3 (PR)**: Yes (high dust raises risk).  
    - **STEP 4 (MR)**: Yes (dust was necessary for disease pathway).  
    - **STEP 5 (DM)**: **Yes** (with ventilation, disease would not have occurred).  
  - **Verdicts**: DM = Yes, MR = Yes, PR = Yes.  
  - **Determination**: Exposure caused disease.  

  #### **Case 4: Exposure + Genetic Susceptibility**  
  - **Background**: Exposure only caused disease because of worker’s genetic risk.  
  - **Procedure**:  
    - **STEP 1**: Diagram: [Exposure] + [Genetics] → [Disease]. Alternative carving: Group as "high-risk profile" (no flip).  
    - **STEP 2**: Reference class = workers with same genetics, no exposure.  
    - **STEP 3 (PR)**: Yes (exposure raises risk in susceptible group).  
    - **STEP 4 (MR)**: Yes (exposure was necessary; genetics alone wouldn’t have caused it at this time).  
    - **STEP 5 (DM)**: **Yes** (without exposure, disease would not have occurred).  
  - **Verdicts**: DM = Yes, MR = Yes, PR = Yes.  
  - **Determination**: Exposure caused disease.  

  ---

  ### IV. WHAT THIS PROCEDURE CANNOT DO  
  1. **Handle "Unknowns"**:  
     - Requires basic exposure/disease data. Fails if:  
       - Exposure levels are unmeasurable (e.g., undocumented chemical spills).  
       - Disease mechanism is entirely unknown (e.g., new/rare conditions).  
  2. **Resolve Legal/Moral Questions**:  
     - Stops and hands to humans for:  
       - "Partial" DM outcomes (e.g., how much compensation for 10-year acceleration?).  
       - Worker negligence vs. employer fault.  
  3. **Override Data Gaps**:  
     - PR/MR/DM return "Unknown" if data is poor. No extrapolation allowed.  
  4. **Assign Blame in Multi-Exposure Cases**:  
     - Cannot distinguish which of two "sufficient" exposures caused the disease (Case 1).  

  ### V. WHERE YOUR INSTINCTS CONFLICT  
  - **You cannot have both Case 1 (causation) and Case 2 (no causation)**. The procedure prioritizes DM:  
    - Case 1 DM = No (exposure didn’t change outcome).  
    - Case 2 DM = Partial (exposure changed outcome timing).  
  - **To align with your instincts**:  
    - Abandon DM as primary (weakens causal rigor).  
    - Or redefine "outcome" in Case 2 as "disease by age X" (makes DM = Yes).  

  ---  
  *Procedure ends. Form ready for implementation.*
