prompt: |-
  I'm a science and ideas reporter, and I keep tripping over the same one-liner in constitutional arguements: 'no Parliament can bind its successors'. I heard it twice last week — once from a barrister on a panel about entrenching long-range climate targets, who used it to say the whole exercise was pointless, since the next lot just repeal whatever you pass, and once from a campaigner who plainly meant something bigger, about how no generation gets to boss the next one around. Then a colleague of mine who's read too much Elster said it can't be right as stated, because binding your future self is exactly what a Ulysses contract is, and a constitution is supposed to be the political version of one. Which leaves me wondering how any entrenched constitution works at all, if the maxim holds.

  So give me the menu: the distinct precise claims that sentence could be making, from the trivial to the radical — claims about what judges would in fact do, claims about what sovereignty means by definition, claims about the dead hand of the past, claims about what future Parliaments will actually do, and the purely rhetorical uses. For each I want a definate verdict — true, false, or not really a claim at all — and who exactly is committed to it. Then say which reading does the work the barrister needed it to do, and whether any reading survives my colleague's objection.

  Don't hand me a survey with the options left open — pick, and defend the pick. British English please, and no reading lists; I'm not going to chase down law review articles.
reasoning: |-
  Okay, the user is a science and ideas reporter who's encountering the phrase "no Parliament can bind its successors" in constitutional debates. They've heard it used in two contexts: one by a barrister arguing against entrenching climate targets, and another by a campaigner talking about intergenerational sovereignty. A colleague brought up Ulysses contracts as a counterpoint, suggesting constitutions are meant to bind future governments. The user wants a clear breakdown of the different interpretations of this maxim, with definite verdicts on each, and to know which version serves the barrister's argument and if any survive the Ulysses contract objection.

  First, I need to unpack the maxim's possible meanings. The legal doctrine version is straightforward: UK courts won't enforce statutory entrenchment due to parliamentary sovereignty. That seems solid and aligns with what the barrister used. Then there's the logical impossibility claim—that binding successors is a contradiction. But that feels weak because Parliament can repeal past laws, which is binding in a way. The third is practical reality: future Parliaments will repeal if they wish. That's true but not absolute. The fourth is normative democratic argument against the dead hand, which is more rhetorical. Lastly, there's the rhetorical flourish without substance.

  The barrister likely relied on the legal doctrine to argue entrenchment is ineffective. For the Ulysses contract objection, the legal doctrine holds because courts simply won't recognize entrenchment. Practical reality also holds since even with constitutions, amendments happen. The normative claim doesn't survive because constitutions are accepted as legitimate constraints. Other interpretations like logical impossibility don't hold up.

  The user needs clear, defended verdicts without academic references. They want to understand which interpretations are valid and why, especially in the context of UK constitutional law. Highlighting that the legal doctrine is what makes entrenchment legally ineffective in the UK, whereas other countries have different systems, addresses their core confusion. Also, clarifying that the Ulysses contract works where courts enforce it, unlike in the UK, ties it together.
answer: |-
  Right, let's dissect this maxim like a legal specimen. That "no Parliament can bind its successors" line is a chameleon – changing colour depending on who's wielding it and why. Here's the definitive menu of claims it *actually* makes, stripped of ambiguity, with verdicts and commitments:

  1.  **The Legal Doctrine (The Barrister's Weapon):**
      *   **Claim:** UK courts will *never* enforce a statutory attempt by one Parliament to prevent a future Parliament from repealing or amending that statute using the ordinary legislative process (i.e., simple majority vote in both Houses + Royal Assent). Entrenchment clauses ("This Act can only be repealed by a 2/3 majority", "This Act shall have perpetual effect") are legally ineffective *in the eyes of the courts*.
      *   **Verdict:** **True** (within the UK's uncodified constitution). This is settled law.
      *   **Committed To:** UK constitutional lawyers, judges, scholars adhering to the Diceyan view of Parliamentary Sovereignty (A.V. Dicey). The barrister arguing against *legal* entrenchment of climate targets is firmly in this camp. This is the core, operational meaning in UK constitutional law.
      *   **Does it survive the Ulysses objection?** **Yes, absolutely.** The UK constitution *lacks* a higher law that courts can enforce against ordinary legislation. A statute *cannot* create a binding Ulysses contract *against itself* for the future because the courts say the doctrine of implied repeal always applies: the latest expression of Parliament's will prevails. Future Parliaments aren't *physically* prevented from acting, but the courts *will* recognise their power to do so via simple majority. The UK simply doesn't have that constitutional mechanism for statutory self-entrenchment.

  2.  **The Logical Impossibility Claim:**
      *   **Claim:** Sovereignty, by its very definition, *must* include the power to change one's mind. Therefore, the statement "Parliament is sovereign *but* it cannot repeal X" is a logical contradiction. Binding successors is conceptually incoherent.
      *   **Verdict:** **False/Misleading.** This confuses *legal authority* with *practical reality*. A sovereign body can *legally* limit its future self *if* the constitutional framework allows it and courts enforce it (e.g., the US Constitution requiring supermajorities for amendment). The *definition* of sovereignty is contested and context-dependent. The UK *chooses* a model where sovereignty is perpetually absolute; other systems choose qualified sovereignty.
      *   **Committed To:** Often used rhetorically by proponents of strong Parliamentary Sovereignty (like the barrister, perhaps extending his argument), but logically shaky. It conflates the UK's specific doctrine with a universal truth.
      *   **Does it survive the Ulysses objection?** **No.** Ulysses contracts *are* a coherent concept precisely because sovereignty can be structured to allow self-binding under specific, higher-order rules. The UK's model rejects this, but it's not logically impossible elsewhere.

  3.  **The Practical Reality / Political Prediction Claim:**
      *   **Claim:** Even if a *legal* mechanism for entrenchment existed, a future Parliament with sufficient political will *will always find a way* to repeal or override the entrenched provision. Determined successors cannot be practically restrained.
      *   **Verdict:** **Broadly True, but Not Absolute.** History shows determined governments can overcome significant hurdles (e.g., constitutional amendments, leaving treaties). However, entrenchment *does* raise the political cost. It creates friction, requires broader consensus, and makes repeal more visible and contentious. It *can* deter reversal, even if it doesn't make it *impossible*.
      *   **Committed To:** Political scientists, pragmatic politicians, historians. The campaigner hinting at generational freedom might be leaning here, implying future generations *will* assert their will regardless.
      *   **Does it survive the Ulysses objection?** **Partially.** Ulysses contracts *work* by raising the cost of breaking the promise, making it politically difficult or requiring special procedures. They don't guarantee success but make defection harder. The UK's *legal* lack of entrenchment makes it *easier*, but even with entrenchment (like in other countries), repeal can happen with enough political force. The objection highlights the *point* of Ulysses pacts – they aren't magical bindings, but friction-generating mechanisms.

  4.  **The Normative Democratic Argument (The Campaigner's Vibe):**
      *   **Claim:** It's *undemocratic* or *illegitimate* for one generation to attempt to restrict the sovereign will of future generations. The "dead hand of the past" should not rule the living. Each Parliament must be free to respond to the circumstances of its time.
      *   **Verdict:** **Not a factual claim at all; it's a value judgment.** It's a philosophical stance about democracy and intergenerational justice.
      *   **Committed To:** Political philosophers (like Tom Paine), some campaigners, libertarians. The campaigner invoking generational sovereignty is clearly here. The barrister *might* hint at this to bolster the legal point.
      *   **Does it survive the Ulysses objection?** **Irrelevant/Contested.** The Ulysses contract analogy *is* a counter-argument: sometimes, democracies *choose* to bind themselves to prevent short-term folly harming long-term interests (e.g., protecting fundamental rights, ensuring fiscal stability, safeguarding the environment). Whether this is legitimate is a matter of ongoing democratic debate, not a legal or factual truth. The objection shows such arguments *exist* and are deployed to justify constitutional constraints.

  5.  **The Rhetorical Flourish / Tautology:**
      *   **Claim:** It sounds profound and final, often used to shut down discussion about entrenchment or constitutional reform in the UK context. Sometimes it just means "Parliament can always change the law".
      *   **Verdict:** **Not really a distinct claim; often a lazy restatement of Claim 1 or a vague gesture towards Claim 4.** Can be misleading if implying more than the legal doctrine.
      *   **Committed To:** People who haven't thought it through, or those using it as a convenient debating club.
      *   **Does it survive the Ulysses objection?** **No.** It crumbles under scrutiny, revealing the underlying, more precise claims above.

  **The Verdicts & The Barrister's Need:**

  *   **The Barrister needed Claim 1 (The Legal Doctrine).** To argue that *legally entrenching* climate targets in a UK statute is "pointless," he absolutely relies on the undeniable fact that UK courts will not stop a future Parliament from repealing that statute via an ordinary Act. His point is about *legal futility in the UK system*. The other claims don't give him this watertight legal argument.
  *   **The Campaigner was likely invoking Claim 4 (Normative Argument),** perhaps blended with Claim 3 (Practical Reality), expressing a philosophical view about generational autonomy.
  *   **The Ulysses objection successfully demolishes Claim 2 (Logical Impossibility)** and exposes Claim 5 (Rhetorical Flourish) as hollow. **It challenges, but does not destroy, Claim 4 (Normative Argument)** by providing a counter-justification for constraints. **It is fully compatible with Claim 3 (Practical Reality)** – Ulysses contracts *rely* on friction, not magic. **Crucially, it cannot defeat Claim 1 (The Legal Doctrine)** in the UK context because the UK constitution *lacks* the higher-law mechanism that makes Ulysses contracts judicially enforceable against ordinary legislation. The UK Parliament's "Ulysses contract" would just be another statute, vulnerable to implied repeal.

  **In essence:** The maxim's power in UK constitutional arguments stems almost entirely from **Claim 1 (The Legal Doctrine)**. It's a statement of how UK courts *actually behave* due to the specific doctrine of Parliamentary Sovereignty. This doctrine *deliberately rejects* the Ulysses contract model for ordinary statutes. Other interpretations are either false (Claim 2), value judgments (Claim 4), practical observations (Claim 3), or fluff (Claim 5). The barrister was right *on the UK law*, the campaigner was making a different point, and your colleague is right that Ulysses contracts *can* work *in systems designed for them*, which the UK, for statutes, is not.
