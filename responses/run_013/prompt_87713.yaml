prompt: |-
  I'm in a lab thats about to commit to a formalism for learning what people want by watching what they do, and my labmates and I have been arguing for a week about what would even count as getting it right. My advisor keeps saying to just train a reward model on the demonstrations and optimize it, like that settles the conceptual question. Before we build, I want the actual spec: what does any adequate account of inferring preferences from behavior have to deliver to count as a theory of the thing rather than a fitting procedure? The system will have to act in situations the demos don't cover, so adequacy has to mean something stronger than matching the data. Give me the requirements list — the cases it has to get right, the distinctions it can't collapse, the formal results it can't contradict — with the consideration behind each, and mark which are non-negotiable and which are just the prejudices of one camp. I can't look anything up right now, so no citations or reading lists; I want the reasoning.

  Some cases I want it to handle, because I've watched all of them break naive setups: (a) someone takes the long way home and you can't tell whether they hate the short route or love the scenic one — the two reward functions agree on every demonstration but diverge if you close the long road, so is treating them as the same preference an acceptable answer or a failure? (b) someone avoids a bridge because they wrongly think it's out, so their choice looks irrational under the true world model but is fine under theirs — does the theory have to separate belief from preference, or can it bake the mistake into the reward? (c) someone insists on doing a task themselves even though the machine gets the same outcome faster — the preference seems to be over the process, not the state, and I don't see how a reward over states captures that without cheating. (d) someone takes the bus only because they can't afford a car, and I dont want the system concluding they love the bus. And (e) the person's preferences are time-inconsistent in a predictable way — they always want cake now and always regret it later — so whose preferences are we even recovering?

  I suspect at least two of the demands people make here can't both hold, something like: any behavior is rationalizable by some preference, preferences are recoverable up to more than behavioral equivalence, and the whole inference is computationally tractable. I want you to say which subset actually conflicts and why. Then, if it's quick, tell me which single requirement does the most to kill off the popular approaches, and how the obvious contenders — a reward model over states, a model that treats the person as noisy-optimal, and one that treats the demonstrations as constraints on a policy — each fare against the list. The criteria are the main thing; I'll do the scorecard.
reasoning: |-
  We are building a formalism for inferring preferences from behavior (demonstrations). The key challenge is that we need the inferred preferences to generalize beyond the demonstrations to novel situations. The advisor's approach of training a reward model and optimizing it may fit the data but does not necessarily capture the underlying preference structure we care about.

  We must define what an adequate account must deliver. Below is a list of requirements, with considerations, and marked as non-negotiable (NN) or camp-specific (CS). Then, we address the cases (a-e) and the conflict between demands. Finally, we briefly evaluate popular approaches.

  ## Requirements for an Adequate Theory

  1. **Generalization Beyond Demonstrations (NN)**: The theory must allow the inferred preferences to make predictions about behavior in situations not present in the demonstrations. Without this, we are just fitting and not inferring a generalizable preference. This is non-negotiable because the system must act in novel situations.

  2. **Separation of Belief and Preference (NN)**: The theory must disentangle the agent's beliefs about the world from their preferences. Consideration: In case (b), the person avoids a bridge because of a false belief. If we bake the mistake into the reward, we get a distorted preference (e.g., the person now appears to hate bridges). But if we separate, we can attribute the behavior to a false belief and a true preference (e.g., to take the shortest route). Without this, we cannot correctly adapt when the person's beliefs change (e.g., when they learn the bridge is fixed).

  3. **Handling State vs. Process Preferences (NN)**: The theory must account for preferences that depend on the process (the sequence of actions or the experience) and not just the final state. Consideration: In case (c), the person wants to do the task themselves. If we only assign reward to states, we might have to assign high reward to states that are only reachable by the person doing the task (which is cheating because the same state might be reachable by the machine). This requirement is non-negotiable because many human preferences are about the "how", not just the "what".

  4. **Robustness to Constraints (NN)**: The theory must not interpret behavior under constraints as reflecting unconstrained preferences. Consideration: In case (d), the person takes the bus because they cannot afford a car. We don't want to infer a preference for buses over cars. The inference should account for the constraints (e.g., budget) and recover the underlying preference (e.g., for comfort and speed) that would manifest differently without constraints. Without this, we might recommend a bus pass when the person gets a raise, instead of a car.

  5. **Temporal Consistency of Preference (CS)**: This is contentious. One camp might require that preferences be time-consistent (i.e., stable over time) to be recoverable. But in case (e), the person has time-inconsistent preferences (e.g., they always choose cake now and regret it later). We must decide: do we recover the preference at choice time (which is inconsistent) or the long-run preference? This is camp-specific because some argue that the true preference is the one that governs the choice, while others argue for a normative preference (e.g., the one that maximizes long-term well-being). However, note that without a clear stance, we cannot handle case (e) unambiguously.

  6. **Uniqueness / Identifiability (CS)**: Some camp might require that the inferred preference be unique (up to some transformation). But note that in case (a), two reward functions (one that loves the scenic route, one that hates the short route) explain the same data. Are they the same preference? The theory must decide: either they are equivalent (so we don't distinguish) or they are not (so we must have a way to break the tie). This is camp-specific because one might argue that preferences are only defined by behavior, so they are behaviorally equivalent and thus the same. But others argue that the counterfactual behavior (what they would do if the short road were closed) matters, and if we care about counterfactuals, then we need more than behavioral equivalence.

  7. **Tractability (CS)**: The inference procedure should be computationally feasible. This is camp-specific because in theory we might accept an untractable ideal, but in practice we need something we can compute.

  ## Conflicts Among Requirements

  The conflict you suspect: 
  - (A) Any behavior is rationalizable by some preference (i.e., the set of preferences that explain a given behavior is non-empty).
  - (B) Preferences are recoverable up to more than behavioral equivalence (i.e., we want uniqueness beyond the observed data, so that in counterfactual situations we can predict correctly).
  - (C) The inference is computationally tractable.

  Conflict: (A) and (B) together are in tension with (C). 
  - Why? (A) is generally true (by the principle of rationalization: for any finite set of demonstrations, there are many reward functions that rationalize it). 
  - But (B) requires that we narrow down to a unique (or small set) of reward functions that also agree on counterfactuals. 
  - However, without strong assumptions (e.g., simplicity, linearity, etc.), the set of reward functions that fit the data is huge and includes many that differ on counterfactuals. 
  - To achieve (B) we need to break ties by some criterion (e.g., a prior over rewards, or structural constraints). 
  - But then (C) might be challenged because the search for the "right" reward function (that also satisfies the tie-breaking) might be intractable (e.g., in complex environments).

  Specifically, (A) and (B) together imply we need a strong inductive bias to select among rationalizing preferences. Without such a bias, we cannot achieve (B). And if the bias is too complex, (C) might fail.

  ## The Case That Breaks Most Approaches

  Requirement #2 (Separation of Belief and Preference) is the one that kills many popular approaches. Why?
  - If we don't separate belief and preference, we get a reward function that is a conflation of the two. Then, when the world changes (or the person's beliefs change), the inferred reward function will lead to wrong predictions. 
  - For example, in case (b): if we don't separate, we might infer that the person dislikes bridges. Then, if the bridge is fixed, we would predict they still avoid it, but in reality they would take it. 
  - Similarly, in case (d): if we don't account for the budget constraint (which is part of the belief about available actions?), we infer a false preference for buses.

  ## Evaluation of Popular Approaches

  1. **Reward Model over States (with noisy-optimal policy)**:
     - Assumes the demonstrator is (noisily) optimizing a reward function defined over states.
     - Fails on:
          - #2 (Belief vs Preference): Cannot separate false beliefs (e.g., case b).
          - #3 (Process Preferences): Cannot capture preferences over actions or processes (e.g., case c: the same state achieved by the machine is equally good, but the person prefers the process of doing it themselves).
          - #4 (Constraints): Does not account for constraints (e.g., case d: the bus is taken because of budget, but the reward model might assign high reward to bus-riding states).

  2. **Treating Demonstrations as Constraints on a Policy (e.g., inverse reinforcement learning with maximum entropy or Bayesian IRL)**:
     - Infers a reward function that makes the demonstrated policy (near) optimal.
     - Fails on:
          - #2: Without explicit belief modeling, it bakes beliefs into the reward (case b).
          - #3: If the policy is over actions, it can capture process preferences? But note: the reward is still over states (or state-action pairs). However, by having the policy depend on the process, it might indirectly capture it. But when generalizing to a new situation, the same state achieved by a different process might be assigned the same reward. So if the person wants to do it themselves, the system might choose the machine because it leads to the same state (and same reward) but faster. Hence, it fails #3.
          - #4: Without modeling constraints, it will interpret constrained behavior as optimal under the reward, hence as reflecting the unconstrained preference (case d).

  3. **Model that Treats the Person as Having a Noisy-Optimal Policy**:
     - This is similar to the above (it's a subset of reward modeling). It fails on the same points.

  ## The Way Forward?

  To meet the requirements, we must:
  - Explicitly model the agent's beliefs (to separate from preferences).
  - Allow for rewards that depend on the process (e.g., state-action sequences, or include actions in the state).
  - Model constraints (e.g., as part of the environment or the agent's action space).
  - For temporal inconsistency (case e), we must decide on a stance: either we recover the choice-time preference (so we get the cake-loving at t) or the long-run (so we get the regret). This might require modeling the agent as having multiple selves or using a hyperbolic discounting model.

  A promising approach is to use a **Bayesian framework** that includes:
  - A model of the agent's beliefs (which may be incorrect).
  - A model of the agent's preferences (which may include process utilities).
  - A model of the agent's planning (which may account for constraints and bounded rationality).

  But note: this becomes computationally challenging (tractability issue).

  ## Summary of Requirements (Non-Negotiable vs Camp-Specific)

  Non-Negotiable (NN): 1, 2, 3, 4.
  Camp-Specific (CS): 5 (temporal consistency), 6 (uniqueness), 7 (tractability).

  ## Answer to Cases

  (a) The two reward functions (love scenic vs hate short) are behaviorally equivalent on the demonstrations. If the theory requires uniqueness beyond behavior (requirement #6, which is CS), then it must break the tie. But if we care about counterfactuals (like closing the long road), then we must have a way to distinguish. So an adequate theory must either:
     - Have a prior that prefers one (e.g., simplicity: maybe hating the short route is simpler?) or 
     - Accept that both are possible and either average over them or ask for more data.

     Treating them as the same is a failure if we care about the counterfactual.

  (b) The theory must separate belief and preference (requirement #2). So it must infer that the agent has a false belief and a true preference (e.g., for the shortest path). Baking the mistake into the reward is a failure.

  (c) The theory must capture process preferences (requirement #3). A reward over states alone fails. We need to include the process (e.g., by having the reward depend on the action sequence or by including "who did it" in the state).

  (d) The theory must account for constraints (requirement #4). We must infer that the agent prefers cars but is constrained by budget.

  (e) The theory must take a stance on temporal consistency (requirement #5, CS). We might recover both the short-term and long-term preferences, but then we have to decide which one to optimize for when acting on behalf of the user. This is a deep philosophical issue.

  ## Final Note

  The most critical non-negotiable requirements (especially #2 and #3) are the ones that break the naive reward modeling approaches. Therefore, any adequate theory must incorporate belief modeling and process utilities.
answer: |-
  ### Core Requirements for Inferring Preferences from Behavior
  Your advisor's approach (train a reward model on demonstrations and optimize) addresses behavioral fit but fails to capture the *structure* of preference inference. An adequate theory must handle counterfactuals, cognitive states, and normative challenges. Below are the requirements, with **non-negotiable (NN)** for universally accepted foundations and **camp-specific (CS)** for contentious or debated aspects. Each includes the underlying consideration and how it relates to your cases.

  #### 1. **Counterfactual Robustness (NN)**  
     - **What**: Preferences must generalize to *unobserved* states/actions (e.g., closing the long road in case a).  
     - **Why**: Demonstrations are sparse; the system must act in novel situations. If two reward functions disagree under counterfactuals but fit the data equally well, treating them as identical is a failure.  
     - **Case Link**: (a) directly breaks naive setups—adequate inference must distinguish "loves scenic" from "hates short" using implicit evidence (e.g., user comments) or structure (e.g., temporal consistency).  

  #### 2. **Belief-Preference Separability (NN)**  
     - **What**: Beliefs (about the world) and preferences (about outcomes) must be distinct entities in the model.  
     - **Why**: Preferences should be invariant to belief updates. Baking false beliefs into rewards (e.g., case b) leads to catastrophic errors when beliefs change (e.g., the bridge reopens).  
     - **Case Link**: (b) requires modeling the user’s *subjective* world-model separately from their *objective* preferences. Without this, inferred rewards are brittle and manipulable.  

  #### 3. **Process vs. Outcome Sensitivity (NN)**  
     - **What**: Preferences must capture *intrinsic value of actions/processes*, not just final states.  
     - **Why**: Humans often care about "how" outcomes are achieved (e.g., autonomy, effort). State-only rewards fail when the same state is reachable via different processes (case c).  
     - **Case Link**: (c) demands that "doing it myself" assigns value to the *act of agency*, not just the outcome. Cheating (e.g., tagging states with action histories) is inadequate—it blows up state space and doesn’t generalize.  

  #### 4. **Constraint-Agnostic Recovery (NN)**  
     - **What**: Inferred preferences must not conflate *true desires* with *external constraints* (e.g., cost, access).  
     - **Why**: Preferences should reflect what the agent *would choose* if unconstrained, not what they *must choose* (case d).  
     - **Case Link**: (d) breaks models that interpret bus-taking as love for buses. Adequate inference must reconstruct latent preferences (e.g., for cars) by modeling constraints as part of the environment.  

  #### 5. **Temporal Consistency Specification (CS)**  
     - **What**: The theory must explicitly define *whose/which* preferences are recovered when they conflict (e.g., present vs. future selves).  
     - **Why**: Time-inconsistent agents (case e) challenge whether we recover "true" preferences (e.g., aligned with long-term goals) or revealed preferences (e.g., impulsive choices).  
     - **Case Link**: (e) requires a stance—e.g., "recover the preference that best predicts *all* behavior, including regret" (revealed) or "recover normative preferences" (idealized). **This is camp-specific**; behavioral economists demand revealed preferences, ethicists demand idealized ones.  

  #### 6. **Identifiability Under Minimal Priors (CS)**  
     - **What**: Preferences should be identifiable (unique up to equivalence classes) without arbitrary assumptions.  
     - **Why**: Naive rationalization (any behavior fits some reward) makes inference vacuous. But demanding *full* identifiability (no behavioral equivalence) is unrealistic—case (a) has underdetermination.  
     - **Case Link**: Resolving (a) requires *weak* identifiability (e.g., via Occam’s razor: "hates short" is simpler than "loves scenic" if no scenic features exist). **Camp-specific**: Some insist identifiability is essential; others accept equivalence classes.  

  #### 7. **Computational Tractability (CS)**  
     - **What**: Inference must be feasible in realistic time/complexity.  
     - **Why**: Useful theories must scale beyond toy problems. But demanding tractability *without* approximations risks oversimplification.  
     - **Camp-Specific**: Purists tolerate intractable ideals; pragmatists demand polynomial time.  

  ---

  ### Conflicts in Requirements  
  The triad you suspect **cannot all hold simultaneously**:  
  - **(A)** Any behavior is rationalizable by some preference.  
  - **(B)** Preferences are recoverable up to more than behavioral equivalence (e.g., unique under counterfactuals).  
  - **(C)** Inference is computationally tractable.  

  **Why they conflict**:  
  - **(A)** is true by definition (for any policy, there’s a reward function that makes it optimal).  
  - **(B)** requires narrowing the solution space (e.g., via simplicity priors or causal structure).  
  - But enforcing **(B)** makes **(C)** intractable in general: searching for the "simplest" rationalizing preference is NP-hard in complex environments. Worse, **(B)** often requires counterfactual data (e.g., responses to interventions), which you lack.  
  - **Resolution**: You must relax one. Sacrificing **(B)** accepts behavioral equivalence (e.g., case a’s ambiguity is unavoidable). Sacrificing **(C)** allows idealized inference (e.g., Bayesian model selection). Sacrificing **(A)** assumes preferences are structured (e.g., linear rewards), which may be false.  

  **Most Damaging Requirement**: **Belief-Preference Separability (NN)**. It kills popular approaches because:  
  - It forces explicit modeling of the user’s world-model, doubling the learning problem.  
  - Naive methods (e.g., IRL with MLE rewards) conflate beliefs and preferences, leading to reward hacking (e.g., in case b, the system infers "bridge-phobia" and avoids bridges forever).  

  ---

  ### Scorecard: Popular Approaches vs. Requirements  
  | **Approach**               | **Counterfactual Robustness** | **Belief-Preference Separability** | **Process Sensitivity** | **Constraint-Agnostic Recovery** | **Temporal Consistency** | **Identifiability** | **Tractability** |  
  |----------------------------|-------------------------------|------------------------------------|-------------------------|----------------------------------|--------------------------|---------------------|------------------|  
  | **Reward over States**     | ❌ Fails (a): same reward for diverging counterfactuals. | ❌ Fails (b): bakes beliefs into rewards. | ❌ Fails (c): state-only rewards ignore process. | ❌ Fails (d): conflates constraints with preferences. | ⚠️ Can handle (e) by discounting, but assumes consistency. | ⚠️ Low identifiability; many rewards fit. | ✅ Often tractable (e.g., linear regression). |  
  | **Noisy-Optimal Policy**   | ❌ Same as above.             | ❌ Same as above.                  | ⚠️ Partial if policy includes actions, but still state-centric. | ❌ Same as above. | ⚠️ Same as above. | ❌ Worse: policy-matching ignores reward structure. | ✅ Tractable (e.g., max-ent IRL). |  
  | **Demo as Policy Constraints** | ⚠️ Better for interpolation, fails extrapolation (a). | ❌ Ignores beliefs; assumes rational given rewards. | ✅ Captures process via policy imitation. | ❌ Treats constrained policy as true preference. | ⚠️ Assumes consistency. | ❌ Policy may be underdetermined. | ✅ Tractable (e.g., BC). |  

  #### Key Takeaways:  
  - **All fail Belief-Preference Separability** and **Constraint-Agnostic Recovery**, making them inadequate for cases (b) and (d).  
  - **Process Sensitivity** is only handled by policy constraints (if actions are modeled), but this doesn’t generalize.  
  - **Temporal Consistency** is ignored by all—none distinguish "regret-prone" preferences in (e).  
  - **To build**: Start with a **structured causal model** (beliefs + preferences + constraints) and **inverse planning**. Use **elicitation** (e.g., queries in novel states) to resolve ambiguities like (a).
