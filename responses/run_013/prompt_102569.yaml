  ### Key Explanations:
  1. **T1 is the core tension**: Your "redescription treadmill" is the central problem. If satisficing (2) is just maximizing with search costs (1/3), it's not a *distinct* rational mode. Resolving this requires sacrificing 2's anti-reductionism or 1's universality.
