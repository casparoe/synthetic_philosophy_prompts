  3. **T3 is derivative of T1**: If satisficing must be justified by resource-rational analysis (3), it loses its independence.
  4. **Settled vs. Contested**:
     - *Settled*: Bayesianism as ideal norm (1), instrumental rationality (4), necessity of heuristics under bounds.
     - *Contested*: Nature of satisficing (Simon vs. economists), interpretation of heuristic performance (Kahneman vs. Gigerenzer), universality of resource-rational analysis.
  5. **Cheapest Fix**: Reinterpreting satisficing (2) as a *species* of resource-rational maximizing (3) resolves T1 and T3 with minimal damage, preserving most of your framework. Cost: You surrender the strong claim that satisficing is rational *even if* a cost-benefit analysis of further search would recommend continuing. This leaves T2 (bias vs. ecological rationality) as the major live debate.
