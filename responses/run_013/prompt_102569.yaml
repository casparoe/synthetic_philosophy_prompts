prompt: |-
  ok so I've been reading rationalist blogs since like 2009 and I've ended up with a pile of views about rationality that I'm now pretty sure don't all fit together, and I'd like a consistency audit before I embarass myself in a reading group. Here's roughly where I've landed:

  (1) Credences should be Bayesian, and the correct theory of instrumental rationality is expected utility maximization — you pick the action with the highest expected utility given your beliefs and desires.

  (2) Satisficing is genuinely rational, not just a budget hack. An agent can be fully rational stopping at the first option that clears some aspiration level, even when a better option exists that they never bothered to look at. "Good enough" is a real standard, not second-best maximizing.

  (3) The right theory of bounded rationality is resource-rational analysis: a bounded agent should optimize subject to its computational and information constraints. Heuristics are at best approximations to that constrained optimum, and the interesting question is always "optimal given what resources?"

  (4) Rationality is purely instrumental. There's no rational criticism of your final ends; only the means are up for evaluation.

  (5) The heuristics-and-biases stuff is basically right — when people deviate from the Bayesian / expected-utility benchmark, that's an error, and the whole "ecological rationality" save (heuristics are smart adaptations, not biases) is cope.

  A friend of mine calls the thing I'm worried about "the redescription treadmill": you can always redescribe a satisficer as a maximizer who happens to have search costs baked into the objective, and if you can always do that, then satisficing either dissolves into maximizing or it's just irrational. I genuinely can't tell whether I'm on the treadmill or not.

  So: which of these actually pull against each other, which pairs only look like they conflict, and what's the cheapest way to make the set consistent and what would that cost me? Don't just flag everything as "in tension" — I need to know which ones are real and which are the same worry wearing different hats.

  Two things about the answer. First, please be explicit about which parts are settled vs. genuinely contested among people who actually work on this — don't hand me one camp's position as if it were the consensus. Second, give it to me as JSON I can paste straight into my notes, in this shape:

  {
    "tensions": [
      {
        "id": "T1",
        "commitments": [numbers of the commitments involved],
        "status": "genuine" | "apparent",
        "severity": 1-5,
        "why": "one or two sentences on what's actually pulling",
        "what_has_to_give": "which commitment, and how it would have to change",
        "cheapest_fix": "the least costly revision that restores consistency",
        "cost_of_fix": "what you lose by making that revision"
      }
    ],
    "ordered_by_severity": ["T1", "..."],
    "single_revision_that_cleans_up_most": "the one change that fixes the most, and what it leaves unresolved",
    "settled": ["claims a competent person in this area would not dispute"],
    "contested": ["claims that are live disagreements, with a word on who's on each side"]
  }

  Order the tensions by severity, highest first. Thanks.
reasoning: |-
  Hmm, the user has been involved in rationalist communities since 2009 and has developed a set of views on rationality that they feel might be inconsistent. They want a "consistency audit" before discussing these in a reading group. They've outlined five core commitments:

  1. Bayesian credences and expected utility maximization as the gold standard
  2. Satisficing as genuinely rational, not just a budget hack
  3. Resource-rational analysis as the correct theory of bounded rationality
  4. Instrumental rationality only (no rational criticism of final ends)
  5. Heuristics-and-biases framework being correct, rejecting ecological rationality

  Their main concern is the "redescription treadmill" - the idea that satisficing might just be maximizing with search costs baked in, which would make their commitment to satisficing either redundant or irrational.

  I need to analyze tensions between these commitments and provide a structured JSON response. The user wants explicit distinction between settled vs. contested views in the field, and wants tensions ordered by severity with clear explanations.

  Looking at the commitments:

  The most severe tension seems to be between (2) satisficing as fundamental and (1) strict Bayesianism/expected utility maximization. As the user notes through the "redescription treadmill," satisficing can be redescribed as maximizing with search costs, which threatens to collapse (2) into (1) or render it irrational. This is a genuine tension at the heart of their framework.

  Next, (2) satisficing vs. (3) resource-rational analysis: while resource rationality can absorb satisficing as a strategy under constraints, (2) claims satisficing is rational even when ignoring cost-benefit analysis of search. This creates another genuine tension.

  Then there's (5) heuristics-and-biases vs. (3) resource rationality: the former sees deviations from optimality as errors, while the latter sees heuristics as optimal under constraints. This is a major debate in cognitive science (Kahneman vs. Gigerenzer camps).

  (2) satisficing vs. (4) instrumental rationality only: This might be only apparent tension since satisficing concerns means, not ends.

  For the JSON structure, I'll identify key tensions, order them by severity (T1 being most severe), note settled/contested aspects, and suggest the most economical fix. The cheapest fix would be modifying (2) to accept that satisficing is resource-rational maximizing, but this costs them the independence of satisficing as a fundamental principle.

  Settled aspects include Bayesianism as the ideal standard and rationality being instrumental. Contested areas include the status of satisficing and the interpretation of heuristics (biases vs. ecological adaptations).
