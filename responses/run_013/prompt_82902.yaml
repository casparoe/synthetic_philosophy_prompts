answer: |-
  ## Commencement Address

  Look at all of you. Radiant. Restless. Ready for lunch. I remember that feeling well, sitting where you are, though the robes were scratchier then. Today feels heavier, doesn’t it? The last commencement. The end of *this* place, as we knew it. An archive closing.

  I write endings for a living. And the hardest lesson I’ve learned is this: **where you choose to put the last page changes everything.** The same sequence of events can feel like tragedy, or like a beginning, depending solely on where you stop telling the story. Where *you* stand determines the meaning you see.

  History whispers this lesson too. We talk of "collapsed" civilizations – the Maya, the Minoans, the scribes of Ugarit. The palace archives stop. We declare: *The End*. But the dirt tells subtler tales. Often, it doesn't shout "death," but whispers "movement." People didn't vanish; they walked forty miles west. They stopped making the pots *we* recognize. The grand narrative ended, yes, the scribes put down their styli... but the farmers likely kept farming, under a different name, for a different lord. The ending wasn't universal; it was specific. It depended entirely on *whose* story you were following, and where you decided *their* book closed.

  This campus, our archive, closes today. For some here – beloved professors, staff whose names you know – this feels like an ending written in stone. The last page lands heavily. Their story *here*, as it has been, concludes. That grief is real. That loss deserves respect. This is not an erasure.

  But you, graduates? Look around you. Your story doesn't stop on this page. This ceremony isn't *your* archive closing. It’s a chapter break. A powerful one, yes. A poignant one, absolutely. But *your* narrative arcs forward, fueled by what you learned within these walls that won’t vanish with the nameplate on the gate. The connections forged, the ideas grappled with, the resilience built – those are yours to carry. **Where you stand today isn't the final sentence; it's the starting point for the next volume.**

  So, what do we do with this heavy, beautiful, fractured moment? We hold both truths.

  We honor the ending. We acknowledge the specific grief of this institution passing. We thank those who built it, taught in it, cared for it. We don't pretend this is secretly a glorious rebirth. Some foundations *are* shifting irreparably.

  And we celebrate the continuation. You, the Class of the Last Commencement, step forward. You carry the living essence of this place – not its administrative shell, but its spirit of inquiry, its community, its quirks – into a world that desperately needs thoughtful minds and sturdy hearts. Your last page here is written. Your next chapter begins at lunch. Turn the page. Write it fiercely, kindly, and well. **The meaning of this ending depends entirely on where you choose to stand next.**

  Go build something remarkable. And please, pass the potatoes. Congratulations.

  ---

  **What I Cut & Why:**

  1.  **The "resilience as slow failure" thought:** Too bleak and complex for the moment. It risked sounding accusatory ("people who pay vs. people who decide") and muddying the core dual-message. It needed more unpacking than five minutes allow.
  2.  **Specific critique of "collapse" narratives in archaeology:** While foundational to *my* thinking, naming Tainter, Diamond, or the Rapa Nui debates would feel academic. The simplified "dirt vs. archives" metaphor conveys the necessary idea – that endings are partial and perspective-dependent – without needing citations or risking alienating non-specialists.
  3.  **Explicit "don't blame the trustees":** Stating it directly would *invite* people to think about blame. Better implied by focusing on acknowledging the loss respectfully without assigning cause, and pivoting firmly to the graduates' future. The tone of honoring the past without bitterness covers it.
  4.  **"This is secretly a rebirth" false hope:** Actively avoided! The speech acknowledges the real ending *and* the graduates' continuation without falsely painting the institutional closure itself as positive. "Chapter break" for them, "archive closing" for the institution.
