  ### Moral Weight in Games Diagnostic Tree  
  *Answer based on immediate gut reactions—no overthinking. Each question branches to the next.*  

  ---

  #### **Q1**: You accidentally cause an NPC’s death in a single-player story game. You reload a save to undo it. Does this feel like *repairing a moral mistake*, or just rewinding gameplay?  
  - **Repairing a moral mistake** → Q2  
  - **Just rewinding gameplay** → Q3  

  #### **Q2**: In a game with no story (e.g., *Tetris*), deleting a block that visibly "screams" when removed feels...  
  - **More uncomfortable than deleting a silent block** → Q4  
  - **Equally neutral as deleting any block** → Q5  

  #### **Q3**: You play a game where you mow down crowds of generic pedestrians (no dialogue, no names). Is this...  
  - **Always morally neutral fun** → Q6  
  - **Sometimes uncomfortable, depending on context** → Q7  

  #### **Q4**: A game lets you import a photo to create an NPC modelled on your living friend (without their consent). Harming this NPC feels...  
  - **Wrong, like violating my friend** → **Position: REAL-ANCHOR IMMERSION**  
  - **Fine—it’s just code referencing a photo** → **Position: FICTIONAL SEPARATISM**  

  #### **Q5**: In an MMO, players collectively care about an NPC because they’ve built stories around it. Deleting it for fun feels...  
  - **Like vandalizing shared art** → **Position: SOCIAL PRACTICE**  
  - **Like deleting any other file** → **Position: LUDIC INSTRUMENTALISM**  

  #### **Q6**: A speedrunner exploits a glitch to delete their *own* avatar (data) to skip levels. This is...  
  - **Morally neutral—it’s just manipulating systems** → **Position: MECHANIC PURISM**  
  - **Weirdly unsettling if the avatar looks human** → **Position: EMBODIED AVATAR**  

  #### **Q7**: A game forces you to play as a real Holocaust victim in a documentary-style recreation. This feels...  
  - **Inherently disrespectful, regardless of intent** → **Position: HISTORICAL INSTRUMENTALIZATION**  
  - **Potentially okay if handled with gravity** → **Position: CONTEXTUAL CONSEQUENTIALISM**  

  ---

  ### Positions & Their Awkward Commitments  
  1. **REAL-ANCHOR IMMERSION**:  
     - *Awkward commitment*: Must defend why harming a digital clone of your friend is wrong, but harming a unique fictional NPC isn’t.  
  2. **FICTIONAL SEPARATISM**:  
     - *Awkward commitment*: Scripted NPC suffering is always "just code," even if it mirrors real trauma.  
  3. **SOCIAL PRACTICE**:  
     - *Awkward commitment*: NPCs gain moral weight only through player communities—lone players can’t generate it.  
  4. **LUDIC INSTRUMENTALISM**:  
     - *Awkward commitment*: All NPCs are tools; gut disgust at (e.g.) child abuse games is irrational.  
  5. **MECHANIC PURISM**:  
     - *Awkward commitment*: Glitch-exploiting a character’s data is fine, even if it feels like "killing yourself."  
  6. **EMBODIED AVATAR**:  
     - *Awkward commitment*: Custom avatars have self-referential weight, but strangers’ default avatars don’t.  
  7. **HISTORICAL INSTRUMENTALIZATION**:  
     - *Awkward commitment*: Using real victims in games is always wrong, but fictional atrocities are fine.  
  8. **CONTEXTUAL CONSEQUENTIALISM**:  
     - *Awkward commitment*: Pedestrian-mowing can be harmless fun if the game’s tone is absurd.  

  ---

  ### Notes on the Tree  
  - **The Child Abuse Asymmetry**: Deliberately not resolved. If your friend rejects child-harm games but accepts GTA-style violence, they likely split at **Q2** (child NPCs trigger "real-anchor" feelings) or **Q7** (child harm lacks justifying context). The tree flags this tension but doesn’t force consistency.  
  - **Unused Combinations**:  
    - *Q1→Repair + Q3→Neutral*: Incoherent (if reloading fixes moral harm, baseline violence can’t be neutral).  
    - *Q2→Uncomfortable + Q6→Neutral*: Unattractive (why care about screaming blocks but not self-deletion?).  
  - **Indistinguishable Leaves**:  
    - *Social Practice* and *Contextual Consequentialism* both treat shared NPCs as weighty—tree splits them via intent (Q5 vs. Q7).  
  - **Most Revealing Node**: **Q1 (reloading saves)**. It forces the "fiction vs. mechanism" divide that underlies 80% of debates.  

  ---

  ### How to Use  
  Run through the tree with your group. When someone reaches a leaf, reveal their position and its awkward commitment. The goal isn’t to "win" but to map disagreements onto coherent frameworks. If someone resists a branch, note where their intuition diverges—that’s the crux.
