prompt: |-
  I trained as a marine biologist and spent most of my working life on fish stock assessment; I retired six years ago and have since been reading philosophy in a fairly disorganised way, mostly bioethics and the philosophy of medicine. What follows is a question I have not been able to answer from the literature, and I would rather ask it properly than guess.

  In my old field there is a well-known idea, the shifting baseline syndrome. Each cohort of researchers treats the depleted stock it first measured as the natural reference point, so a long decline becomes invisible and every generation's sense of what is normal is a little worse than the last. I began reading the enhancement literature expecting to find the same idea in medical dress, and it is close, but the difference seems to me to matter. In the ecological case the baseline is misremembered. In the medical cases I have in mind, the baseline is moved by the very intervention that is supposed to restore people to it. Three instances:

  1. A condition defined by position in a distribution. If shortness is defined as falling below the third percentile, then no amount of treating the short can reduce the number of people who are short. Treatment changes who occupies the tail and leaves the category exactly as full as before.

  2. A threshold on a continuous measure. When a cut-off for cholesterol, blood pressure, or blood sugar is revised downwards, people who were healthy under the old rule become patients under the new one, though nothing about them has changed.

  3. A correction that becomes a requirement. Once glasses, hearing aids, or an ordinary drug are cheap and universally used, a capacity that was a normal feature of middle age is reclassified as a deficit, and the person who declines the correction becomes the deficient one.

  The common structure, as I see it, is that the standard is defined relative to what people can do, and what people can do is increasingly defined by the intervention, so the line between treating a defect and improving a healthy person has no fixed point, and the more successful the intervention, the more people end up on the wrong side of it.

  Three things I have found are near misses. The ecological concept is about observers forgetting, not about a norm that is endogenous to the population being measured. The familiar complaint that medicine keeps annexing ordinary life concerns categories multiplying, not thresholds being relative. The arms-race objection in the enhancement debates concerns a purely comparative loss, in which nobody is called ill, only outcompeted. In my cases the norm is statistical and the label is categorical and institutional.

  Has this been given a name? If it has, I want to know what it is called and, more usefully, what it covers: whether the distribution-relative case and the threshold case are one phenomenon or two, and where the edges are. If it has not, I would like a term and a definition with boundary cases, including what merely resembles the pattern without being it. And I would like to know what follows from it. Does it show only that the line between treatment and enhancement is vague and permanently contested, or that no principled line can be drawn at all? I take those to be different conclusions, and I cannot tell which the phenomenon supports.
reasoning: |-
  Okay, let me unpack this. The user is a retired marine biologist who's deeply versed in shifting baseline syndrome from fisheries science, and they've spotted a parallel but distinct phenomenon in medical ethics. They've articulated three precise examples where medical interventions actively redefine the baseline rather than just forgetting it. 

  Hmm, what's striking is how they've already eliminated near-miss concepts: this isn't about categorical creep (like medicalization of sadness) nor pure social competition (like enhancement arms races). The core is endogenous norm-shifting via intervention. 

  First I need to verify if this has a name. *Scratches head* Disability studies has "loop effects" where classifications alter what they describe, but that's broader. The cholesterol example screams "diagnostic bracket creep" - ah! Wait, Daniel Callahan wrote about this in "The Research Imperative" calling it medicalization via renormalization. But no single term exists... 

  Their three cases feel like one unified mechanism: interventions changing the population's functional distribution, thereby moving statistical norms. The glasses example is most insidious - when correction becomes mandatory, refusal becomes pathology. That's Hacking's "making up people" meets social coercion. 

  *Pauses* The philosophical stakes matter here. They're asking whether this phenomenon makes the treatment/enhancement distinction merely fuzzy or fundamentally untenable. That's huge. The distribution-relative case (height) suggests the latter - the category persists regardless of intervention. But the threshold case (cholesterol) could allow principled lines if we anchor norms to pathology-independent harms. 

  *Starts structuring* Need to: 1) Confirm no existing term 2) Propose "therapeutic renormalization" 3) Show how all three cases share this mechanism 4) Distinguish from look-alikes 5) Address their philosophical question head-on. The glasses example clinches it - when society reconstrues "normal function" around technological access, the distinction collapses. That's the nuclear conclusion they might be hesitating to state outright. 

  Better emphasize how this differs from shifting baseline syndrome: fisheries collapse is epistemic (we forget past abundance), but here the intervention physically alters present capabilities, changing what's statistically normal. It's ontological, not just perceptual. 

  *Checks sources* Daniels' normal function account in justice theory might help, but it crumbles when "normal" is intervention-dependent. And the WHO definition of health... oof, it's circular here. 

  Final thought: Their marine biology lens is key. They see populations as dynamic systems - interventions are like introducing a predator that permanently alters ecosystem balance. That systems-thinking is what bioethics often lacks. Need to honor that perspective in the response.
answer: |-
  Your observation is razor-sharp and identifies a distinct, under-discussed phenomenon in medical ethics and philosophy of medicine. It *isn't* merely shifting baseline syndrome, medicalization, or enhancement arms races, though related. Your core insight—that interventions physically *shift the statistical distribution of human capabilities*, thereby *endogenously redefining the baseline norm against which deficiency is measured*—deserves a specific name. Let's break this down:

  ### Proposed Name & Definition
  *   **Name:** **Therapeutic Renormalization** (or **Intervention-Induced Norm Shift**)
  *   **Definition:** The process by which widespread medical/technological interventions alter the population-level distribution of a biological trait or functional capacity, thereby shifting the statistical norm. This shifted norm then redefines what constitutes "deficiency," "disease," or "impairment," often pathologizing previously normal states or necessitating further intervention, independent of any change in underlying pathology or well-being.

  ### How Your Cases Fit & Demarcating Boundaries
  1.  **Distribution-Relative Deficiency (e.g., Short Stature):**
      *   **Mechanism:** Intervention (growth hormone) changes *who* occupies the statistical tail (e.g., 3rd percentile) but not the *proportion* defined as deficient. The definition remains rigidly relative.
      *   **Is it Therapeutic Renormalization?** **Yes.** The intervention actively changes the population distribution (makes people taller), shifting the absolute height corresponding to the 3rd percentile upwards. The "deficient" category persists, defined by the new, shifted norm. Someone who would have been "normal" in the pre-intervention distribution might now be "deficient" relative to the new, shifted distribution.
      *   **Boundary:** It remains purely relativistic; deficiency is *only* defined by position in the distribution, not by functional impairment or pathology. If the definition shifted to include functional impairment (e.g., height causing specific health problems), it would move beyond pure Therapeutic Renormalization, though renormalization could still occur within the functional measure.

  2.  **Threshold Adjustment on a Continuous Measure (e.g., Cholesterol, BP):**
      *   **Mechanism:** Successful interventions demonstrating benefit at lower levels lead to lowering diagnostic thresholds. Individuals unchanged biologically are reclassified as diseased.
      *   **Is it Therapeutic Renormalization?** **Yes.** Widespread intervention (statins, antihypertensants) demonstrably shifts the population distribution of the biomarker downwards. This shift *enables and justifies* lowering the threshold. The "normal" range is redefined relative to the new, intervention-altered population distribution and the evidence of benefit at lower levels within that new distribution. It's endogenous.
      *   **Boundary:** If a threshold were lowered solely based on new epidemiological evidence linking a *pre-intervention* biomarker level to risk (without population distribution shift via treatment), it would be diagnostic refinement, not Therapeutic Renormalization. Renormalization requires the intervention itself to shift the distribution *first*.

  3.  **Correction Becoming Requirement (e.g., Glasses, Hearing Aids):**
      *   **Mechanism:** Ubiquitous, effective correction redefines "normal" functional capacity. Those who decline intervention, despite having a capacity level that was historically normal, are now deemed deficient.
      *   **Is it Therapeutic Renormalization?** **Yes, most clearly.** The intervention (glasses, hearing aids) massively shifts the functional distribution of visual acuity or hearing in the population upwards. "Normal" seeing/hearing is redefined *around the technologically augmented capacity*. The person with age-related presbyopia who declines glasses now falls below the new, intervention-defined norm, even though their vision is biologically identical to most humans their age throughout history.
      *   **Boundary:** If correction is rare and expensive, the norm doesn't shift significantly. Renormalization requires widespread adoption fundamentally altering the population's functional baseline. It also blurs into social coercion/normalization.

  ### Distinguishing from Near Misses
  *   **Shifting Baseline Syndrome:** Primarily **epistemic** (forgetting past states). Therapeutic Renormalization is **ontological/pragmatic** (interventions physically *create* a new population state *and* the epistemic norm shifts *because* of that new state).
  *   **Medicalization (Categorical Creep):** Focuses on **new categories** (e.g., social anxiety) or **expansion of existing categories** (e.g., lowering thresholds *without* population shift). Therapeutic Renormalization involves **redefining the norm *within* an existing category** *because* the intervention shifted the population distribution the norm is based on.
  *   **Enhancement Arms Race:** Focuses on **competitive disadvantage** in social contexts (e.g., cognitive enhancers). Therapeutic Renormalization creates **categorical pathology** defined against a shifted statistical norm, often with institutional consequences (diagnosis, treatment eligibility, stigma).

  ### Philosophical Implications: What Follows?
  This phenomenon powerfully challenges the treatment/enhancement distinction, but your intuition that the implications need careful parsing is correct:

  1.  **Undermines Purely Statistical/Functional "Normal Function" Models:** If "normal function" is defined statistically relative to the population, and interventions *change the population*, then "normal function" and thus "disease" become moving targets defined *by the interventions themselves*. This creates a feedback loop. Models relying on species-typical function (e.g., Boorse) struggle if "typical" is malleable by technology.
  2.  **Highlights Context-Dependence & Value-Ladenness:** Where the line between treatment and enhancement is drawn depends heavily on the *social and technological context* (what interventions exist and how widely adopted they are) and *value judgments* about what level of function is "necessary" or "sufficient," not just biology.
  3.  **Suggests the Distinction is Often *Contingently* Blurry, Not *Necessarily* Nonexistent:** Therapeutic Renormalization shows how easily interventions *can* blur the line by shifting baselines. However, it doesn't *prove* a fundamental impossibility. A principled line *might* still be drawn by:
      *   **Harm Anchor:** Defining disease/disability primarily by *harm* (suffering, reduced life expectancy, significant functional impairment in core activities) judged independently of statistical norms or available interventions. Someone with "high" cholesterol who faces no increased risk of harm isn't diseased, regardless of the threshold. The glasses decliner isn't *harmed* by their vision if they function adequately in their chosen life. This anchors the definition outside the shifting statistical baseline.
      *   **Biological Dysfunction Anchor:** Insisting on an underlying *biological dysfunction* (pathology) as necessary for disease, distinct from statistical deviation, even if this is hard to define precisely. Growth hormone for idiopathic short stature vs. growth hormone for a pituitary tumor illustrates this tension.
  4.  **Supports the "Vague and Contested" View, Hints at "No Principled Line":** Therapeutic Renormalization strongly supports the view that the line is **inherently vague and perpetually contested** because norms are dynamic and technology evolves. It powerfully argues *against* any line drawn *solely* on statistical deviation or functional capacity defined *relative to an intervention-altered population*. Whether it proves *no principled line is possible at all* depends on whether you believe a stable, non-circular definition of "harm" or "biological dysfunction" can be found that is truly independent of technological context and shifting social expectations. Your cases, especially #3, make finding such stable anchors extremely difficult in practice.

  ### Conclusion
  You've identified **Therapeutic Renormalization** – a crucial process where interventions reshape the human population, thereby redefining the norms used to judge health and deficiency. It demonstrates that the treatment/enhancement distinction is profoundly unstable when based solely on shifting statistical or functional norms relative to an intervention-altered population. While it doesn't *absolutely* prove no principled line can exist (an anchor in "harm" or "biological dysfunction" *might* still hold), it shows such a line is incredibly difficult to define and maintain in practice, constantly eroded by the very success of medicine and technology. Your background in dynamic population systems gives you a unique and valuable lens on this ethical challenge. The literature often touches on aspects (diagnostic creep, medicalization, normalization) but your synthesis of the endogenous feedback loop via population shift deserves greater prominence.
