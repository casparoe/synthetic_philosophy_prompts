prompt: |-
  I have been turning over the problem of causation by omission ever since an argument with my brother-in-law, a plumber, about a flooded basement. His position is that an omission is like a hole. Nobody digs a hole in a pipe; there is simply a place where the metal is not, and that place is what floods the floor, what gets photographed for the insurance file, what gets cut out and replaced. The hole is nothing at all, and yet the whole story turns on it. From this he concludes that failing to do something can be a cause in just the way that doing something can — that the plumber who never checked the joint is as responsible for the water as the one who cracked it — and he thinks the hole proves it, because the water would not be on the floor without it.

  I want this audited rather than waved away. Lay out the correspondence: what plays the part of the pipe, the hole, the water, the pressure behind it, and the expectation that a joint gets checked in the first place. Then tell me where the mapping breaks, and separate the breakages that matter for his conclusion from the ones that are only decoration. The ones I keep coming back to are these. A hole has a location and a size, it could have been filled, and you can point at it; an omission has none of that until someone has already settled which of the countless things I did not do that day is the one that counts — and the analogy seems to take that settling as given rather than as the very thing that needs explaining. A hole is also there continuously, whereas an omission is tied to a moment and to an opportunity that may or may not have existed.

  Then say what the picture quietly imports: whether it assumes there is always a determinate missing thing, whether it confuses our practice of singling out one absence to blame with the question of what actually produced the effect, and whether it can cope with cases where several omissions would each have been enough, or where the same non-action is harmless at one pressure and fatal at another.

  And the part I most want: does his conclusion survive the audit? If the analogy can carry only the claim that omissions are the sort of thing we can identify and act on, but not that they are causes in the same sense as actions, say so plainly, and tell me whether some better comparison would carry what he is after.
reasoning: |-
  Okay, the user is deeply engaged with a philosophical problem about causation by omission, sparked by a real-world analogy from their plumber brother-in-law. They've clearly spent considerable time dissecting the hole-in-pipe metaphor and identified precise points of tension: the concreteness of holes versus the abstractness of omissions, the role of human attribution in selecting relevant omissions, and temporal aspects.  

  The core challenge is to audit whether the analogy supports the brother-in-law's claim that omissions cause effects "in just the same way" as actions. The user isn't just seeking validation but a rigorous breakdown—they've already spotted weaknesses in the analogy and want to know which flaws actually undermine the conclusion.  

  First, I need to map the analogy systematically:  
  - Pipe = System requiring maintenance (e.g., plumbing infrastructure)  
  - Hole = Specific absence (lack of metal/check)  
  - Water = Effect (flood)  
  - Pressure = Conditions allowing the effect (water pressure/opportunity for failure)  
  - Joint-check expectation = Normative background (maintenance protocols)  

  The user's key concerns are:  
  1. **Concreteness gap**: Holes are spatially/temporally locatable; omissions rely on human selection from infinite non-actions.  
  2. **Attribution dependency**: Calling something an "omission" presumes we've already decided which non-action mattered.  
  3. **Discontinuity**: Holes persist; omissions are tied to fleeting opportunities.  
  4. **Causal robustness**: Can the analogy handle overdetermination (multiple sufficient omissions) or threshold effects?  

  The brother-in-law's argument smuggles in hidden premises:  
  - That there's always one "correct" omission (like one hole).  
  - That causal responsibility mirrors moral/legal responsibility.  
  - That absence-as-cause works identically to presence-as-cause.  

  Crucially, the analogy *does* prove omissions matter pragmatically—we identify and intervene on them like holes. But metaphysically, it fails: omissions lack intrinsic causal power; they're descriptions of how events *could have been different* given norms and expectations. A better analogy might be "failing to apply a brake" causing a crash—it highlights counterfactual dependence without pretending the absence *pushes* the car.  

  The conclusion survives only weakly: omissions are causes in a *relational, normative* sense, not a *physical* one. The brother-in-law is right about responsibility attribution but wrong about ontology. The user’s skepticism is justified—the hole analogy papers over the hard part: why we pick *this* non-event from infinity.  

  Final note: The user’s phrasing ("audited rather than waved away") suggests they value precision over persuasion. They’ll likely appreciate distinguishing between causal metaphysics and practical causality.
answer: |-
  Here's a rigorous audit of the "omission-as-hole" analogy, mapping its components, exposing its breaks, separating critical flaws from decorative ones, and evaluating whether your brother-in-law's conclusion survives.

  **The Mapping:**
  1.  **The Pipe:** The normative system or expected state of affairs (e.g., a properly maintained plumbing system, a world where plumbers check critical joints).
  2.  **The Hole:** The specific omission itself (e.g., *not* checking the joint).
  3.  **The Water:** The negative consequence (e.g., the basement flood).
  4.  **The Pressure Behind It:** The background conditions enabling the consequence if the omission occurs (e.g., water pressure in the pipes, the inherent vulnerability of the joint).
  5.  **The Expectation (Joint Check):** The norm, duty, or reasonable expectation defining what *should* have been present (e.g., the standard practice/procedure that joints *are* checked periodically).

  **Where the Mapping Breaks (and Why Some Breaks Matter):**

  1.  **Concreteness & Individuation (Critical Break):**
      *   **Hole:** Has precise location, size, shape, boundaries. It's a specific, identifiable *absence within a defined context* ("metal is not *here*"). You can point to its exact location on the pipe.
      *   **Omission:** Lacks inherent location, size, or boundaries. It is an *abstract negative* ("*not* doing X"). The "size" of the omission (its significance) depends entirely on the norm violated and the consequence. Crucially, **which omission matters is not given but *selected*.** On the day the joint failed, you (the plumber) *didn't* check the joint, *didn't* recite poetry, *didn't* go to the moon. The analogy **smuggles in the normative selection process** ("the expectation") as if it were a physical property of the absence itself, like the pipe defines the hole's location. But in reality, the "hole" (significant omission) only exists *because* we've *already decided* that checking the joint was the crucial thing *not* done.
      *   **Why it Matters for Conclusion:** This break is fatal to the claim that omissions cause "in just the way" actions do. Actions are concrete events; omissions are negative descriptions *dependent on prior normative selection*. The hole analogy makes the omission *seem* like a concrete, pre-existing "thing" causing the flood, obscuring the essential role of human judgment in identifying *which* non-event is relevant. This undermines the metaphysical parity claim.

  2.  **Persistence & Temporal Location (Critical Break):**
      *   **Hole:** Exists continuously over time once formed. It's a *state* of absence.
      *   **Omission:** Is intrinsically tied to a *specific missed opportunity* or *window of time*. The omission "not checking the joint" refers to the failure to perform an action *at the specific time(s)* when it was expected, needed, or possible. The omission isn't "there" continuously like the hole; it's defined by the *absence of an action at critical moments*.
      *   **Why it Matters for Conclusion:** Causation often involves temporal sequence and mechanism. The continuous hole allows a continuous mechanism (water flowing through it). The punctual/opportunity-based nature of omissions makes the causal link less like a physical mechanism (water flowing) and more like a *counterfactual dependency* (if the action *had* been performed at T, the flood *would not* have occurred). This suggests a different *kind* of causal relation.

  3.  **"Fillability" vs. "Doability" (Less Critical, Illustrative):**
      *   **Hole:** Can be directly acted upon (filled, patched).
      *   **Omission:** Cannot be "acted upon" directly. You can only *perform the omitted action in the future* or establish systems to prevent similar omissions. You don't "fix" the omission of yesterday's check; you perform a check *now*.
      *   **Why it's Decorative:** While highlighting a difference, this doesn't directly challenge the causal claim. It emphasizes that omissions point to future *actions* needed, rather than being direct objects of intervention like holes.

  **What the Picture Quietly Imports (Hidden Assumptions & Challenges):**

  1.  **Determinate Missing Thing:** The analogy strongly implies there is *always one specific, determinate "missing piece"* (like the hole) that caused the problem. It obscures the reality that:
      *   **Overdetermination (Several Sufficient Omissions):** Multiple independent omissions could each have prevented the flood (e.g., the installer *not* using a better joint, the inspector *not* flagging it, the owner *not* scheduling maintenance). The hole analogy struggles here – is there *one* hole or several? If the pipe had multiple weak points, any of which *could* have burst under pressure, which one "caused" *this* flood? The analogy pushes towards singularity where reality might involve multiple sufficient absences.
      *   **Threshold Effects & Context Dependence:** The analogy handles pressure changes (more pressure = more likely to burst *this* hole). But omissions are *radically* context-dependent. The *same* non-action (not checking) might be utterly harmless if the joint is perfect (low "pressure") but catastrophic if it's corroded (high "pressure"). The *causal relevance* of the omission depends entirely on the background conditions ("pressure") and the state of the system ("integrity of the pipe"), far more than the hole's relevance depends on pressure (pressure just changes flow rate, not the hole's existence as the flow path).
  2.  **Confusing Attribution with Causation:** The analogy seamlessly blends the *physical cause* (water flowing through the hole) with the *attribution of responsibility* (the hole is "what floods the floor... what gets cut out"). It assumes that identifying the salient absence *for blame/practical purposes* (the hole) is identical to identifying the *metaphysical cause*. But as point 1 (Concreteness) shows, identifying the *relevant* omission requires normative input (expectations, duties) that isn't part of the physical causal chain described by the hole/water mechanism.
  3.  **Normativity as Background, Not Mechanism:** The "expectation" (joint check) is mapped as part of the background system (the pipe). But in the omission case, this norm is *constitutive* of the omission being significant. Without the norm/duty/expectation, "not checking" is just another non-event, like not reciting poetry. The hole's significance flows *physically* from its location and the water pressure; the omission's significance flows *normatively* from the violated expectation. The analogy hides this normative source of salience.

  **Does the Conclusion Survive the Audit?**

  **No, the brother-in-law's core conclusion – that omissions are causes "in just the way" that actions are – does not survive the audit intact.** The analogy successfully demonstrates something important, but not metaphysical parity.

  1.  **What the Analogy *Does* Successfully Show (What Survives):**
      *   **Counterfactual Dependence:** The flood counterfactually depends on the omission. *If* the check had been performed (the "hole" filled), the flood very likely would not have occurred. Similarly, *if* the metal were present, the water wouldn't flow out. Omissions are crucial parts of causal *stories* and *explanations*.
      *   **Pragmatic & Normative Salience:** Like holes, omissions are the kinds of things we *identify, blame, and act upon* in practical contexts (insurance, repairs, assigning responsibility). They are real features of our *agential and normative landscape*. The plumber who didn't check *is* responsible (practically, morally, perhaps legally) in a way analogous to how the hole is the thing we fix.
      *   **Absences Can Be Crucial:** It firmly establishes that the *absence* of something expected or required can be the pivotal factor in an outcome.

  2.  **What the Analogy *Fails* to Show (What Doesn't Survive):**
      *   **Metaphysical Parity with Actions:** The critical breaks (Concreteness/Individuation and Persistence/Temporal Location) reveal that omissions lack the intrinsic, event-like properties of actions (or holes as physical absences). Attributing causal status to an omission inherently requires *selecting* which non-event matters based on *norms and expectations* – a layer absent in the causation of an action or the physical mechanism of a hole. Omissions don't "produce" effects through mechanisms like actions or holes do; they describe how the world *failed to prevent* an effect due to the non-occurrence of a normatively expected event.
      *   **Omissions as Intrinsic "Causal Relata":** The analogy fails to show that omissions are fundamental building blocks of causation in the same way physical events or states might be. They are better understood as *descriptions* of counterfactual dependencies *relative to a normative frame*.

  **The Verdict & A Better Comparison:**

  *   **Plainly Stated:** **The hole analogy successfully shows that omissions are *causally relevant* and *pragmatically indispensable* for explanation, responsibility, and intervention, much like holes are physically indispensable for explaining a leak. However, it fails to show that omissions are *causes in the same metaphysical sense* as actions or concrete events. Omissions derive their causal significance *relationally* through counterfactual dependence and normative expectations, not intrinsically like a physical event.**
  *   **A Better Comparison:** Instead of a physical hole, consider **failing to apply the brakes**. This captures the key elements more accurately:
      *   **The System:** A car moving towards an obstacle.
      *   **The Omission:** Failing to press the brake pedal.
      *   **The Consequence:** The crash.
      *   **The Pressure:** The car's speed/momentum, the proximity of the obstacle.
      *   **The Expectation:** The driver's duty/skill to brake when needed.
      *   **Why it's Better:**
          *   It directly involves a *missed action* at a *critical moment*.
          *   The causal link is clearly *counterfactual*: Had the brake been pressed (the action performed), the crash would likely have been avoided.
          *   The omission's significance depends entirely on the *normative context* (driver's duty) and *background conditions* (speed, obstacle). Failing to brake is only salient *because* braking was expected and necessary to prevent the crash.
          *   It avoids the illusion of a concrete, persistent "thing" like a hole, focusing instead on the non-occurrence of a specific expected action.
          *   It still supports practical responsibility: The driver who failed to brake is responsible for the crash.

  This comparison supports your brother-in-law's practical point about responsibility and the crucial role of omissions in *why* events happen, without claiming an untenable metaphysical equivalence between actions and omissions. It captures the counterfactual dependence and normative salience that are the true hallmarks of causation by omission.
