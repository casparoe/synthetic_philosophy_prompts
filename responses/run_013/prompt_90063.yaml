  In a recent reading group on long-term AI risk, a colleague kept repeating the line 'Alignment failure will be a drift, not a coup' to argue that we should worry less about a sudden, coherent takeover by an influence-seeking system and more about the slow erosion of human values. I would like to bring a precise menu of readings to our next session rather than another round of competing intuitions. Please lay out the distinct theses that one-liner could be expressing—from the trivial to the radical—and for each say whether it is defensible, what it would imply about the two failure modes, and which reading is most likely the one my colleague intends. As you do this, separate claims about the mechanism of failure, its temporal profile, and where the agency lies. The slogan was doing real work in the argument: it was meant to redirect research priorities away from takeover scenarios. So please also indicate which readings would actually support that redirection and which would not.
