prompt: |-
  I'm a psych nurse, not a philosopher, and theres a pattern I keep seeing that I don't have a word for. Two patients, same depression diagnosis. One says it's a real illness, a chemical imbalance, that's why she needs meds and time off. The other says it's not an illness at all, it's a sane response to a rotten situation, and calling it a disease just lets everyone off the hook. Both are using the "illness" label to do something: one to be excused, the other to assign responsibility. And the same person can switch: a kid says "I'm not bad, I have ADHD" when he's caught, then says "ADHD isn't an excuse, it's just me" when his mom wants him on meds. You're a philosopher of psychiatry — is there an established name for this, the way the same condition gets moved in and out of the illness category depending on what the speaker needs it to do? It's not just stigma, and it's not just medicalization, because it goes both ways. If there's no name, coin one and tell me what it's not, and where the line is between using a diagnosis as a tool and using it as an excuse. Brainstorm the nearest concepts first, then give me your best carving.
reasoning: |-
  Okay, let me start by unpacking the psych nurse's observation. They're seeing patients with the same diagnosis but framing it in opposite ways: one as a legitimate illness needing accommodation, the other as a sane response to external problems. And importantly, the same person might switch frames situationally—like the ADHD kid example. 

  First, I need to map existing concepts that touch this. Medicalization comes to mind—how experiences get labeled as medical conditions. But that's usually about society-level shifts, not individual tactical framing. Demedicalization is the reverse, but again, too broad. 

  Then there's the sick role concept from Parsons. The nurse's first patient fits perfectly—illness exempts from responsibility, but requires treatment-seeking. But the second patient actively rejects that role to assign blame externally. So Parsons' model only covers half. 

  Illness denial is another angle, but that's usually about avoiding stigma. Here it's strategic: the second patient isn't denying suffering; they're weaponizing the non-illness label to demand systemic change. 

  The situational aspect feels key. When the ADHD kid says "it's not an excuse," he's claiming agency in a context where meds might feel like coercion. But when caught misbehaving, "I have ADHD" invokes the sick role for leniency. So the label is a tool for different social negotiations. 

  Wait—could this be about what philosophers call "pragmatic deployment of concepts"? Where definitions bend to serve immediate goals? But I need something more psychiatry-specific. 

  *flipping through mental files* Ah! Hacking's "looping effects" show how diagnostic labels change the people they describe. But that's about identity formation over time, not minute-to-minute rhetorical shifts. 

  The closest existing term might be "diagnostic shield/sword," but that's not academic. Let me build on that: "Diagnostic Oscillation" captures the back-and-forth, but misses intentionality. "Tactical Nosologizing"? Nosology is disease classification—yes! It pins down the deliberate recategorization. 

  But I should differentiate it from mere stigma management. Stigma avoidance is passive (hiding diagnosis), while tactical nosologizing is active reframing. And it's not excuse-making per se—the mom's meds example shows resisting medical control counts too. 

  For the line between tool and excuse: the key is whether the framing expands or restricts agency. Using ADHD to request extra time? Tool. Using it to avoid all accountability? Excuse. But the nurse already knows this—the real issue is context collapse. A "tool" in one setting (school accommodations) looks like an "excuse" in another (family conflict). 

  *adjusting mental model* Maybe the answer isn't a bright line but recognizing that all diagnoses exist in this tension. The nurse's brilliance is spotting how patients navigate it situationally. I'll position tactical nosologizing as the micro-level cousin of medicalization debates. 

  *checking coherence* Does this address the "what it's not" request? Yes: contrasted with medicalization, stigma, and excuse-making. Boundary drawn via intentionality and reversibility. Coined term is precise but accessible. Final metaphor: diagnoses as Swiss Army knives—different blades for different needs. That should resonate with clinical experience.
answer: |-
  Your observation cuts to the heart of psychiatry's most contested terrain—**the strategic framing of distress to manage identity, responsibility, and social negotiation.** While no single term fully captures this *situational, reversible, goal-oriented shifting* of a condition across the "illness/non-illness" boundary, we can carve it precisely. Here’s the conceptual breakdown:

  ### Nearest Existing Concepts & Why They Fall Short
  1. **Medicalization/Demedicalization**:  
     - **What it is**: Societal processes framing experiences as medical problems (or stripping them of medical status).  
     - **Why it misses**: Your cases involve *individuals* tactically toggling the label *within the same diagnostic framework*, not broad cultural shifts.

  2. **Sick Role (Parsons)**:  
     - **What it is**: Sociological model where illness grants exemptions (from blame/work) but demands treatment compliance.  
     - **Why it misses**: Only fits your *first* patient. The *second* rejects the role entirely to demand systemic change, not personal exemption.

  3. **Illness Denial/Stigma Management**:  
     - **What it is**: Avoiding labels due to shame or fear of discrimination.  
     - **Why it misses**: Your second patient *leverages* the "non-illness" frame proactively (to "assign responsibility"), not defensively.

  4. **Looping Effects (Hacking)**:  
     - **What it is**: How diagnostic labels reshape the identities and behaviors of the classified.  
     - **Why it misses**: Describes long-term identity dynamics, not situational rhetoric.

  5. **Externalizing/Internalizing**:  
     - **What it is**: Psychological attribution of cause (to self vs. environment).  
     - **Why it misses**: Doesn’t address the *purpose* of the attribution (e.g., to secure accommodations vs. incite change).

  ---

  ### Coined Term: **Tactical Nosologizing**  
  *(from Greek *nosos* = disease, *logos* = study/reasoning)*  

  **Definition**: The deliberate, context-dependent repositioning of a condition across the conceptual boundary of "illness" to achieve specific interpersonal or social objectives—such as securing resources, deflecting blame, demanding accountability, or asserting autonomy.  

  #### Key Features:
  - **Situational**: The shift occurs in response to immediate social demands (e.g., a disciplinary moment vs. a treatment negotiation).  
  - **Reversible**: The same person can toggle the frame (as with the ADHD example).  
  - **Instrumental**: The illness label is a *tool*, not a fixed belief.  
  - **Power-Engaged**: It navigates hierarchies (clinician-patient, parent-child, employer-employee).  

  ---

  ### What Tactical Nosologizing Is *Not*:
  | **Concept**          | **How It Differs**                                  |  
  |----------------------|-----------------------------------------------------|  
  | **Stigma Avoidance** | Passive concealment; *tactical nosologizing* is an active, strategic reframing. |  
  | **Excuse-Making**    | One-dimensional blame deflection; TN includes *resisting medical control* (e.g., refusing meds as "not my fault"). |  
  | **Malingering**      | Requires conscious fabrication; TN uses *genuine* diagnoses flexibly. |  
  | **Insight/Lack of Insight** | Framed as clinical symptoms; TN is a *social maneuver*, not psychopathology. |  

  ---

  ### The Line Between "Tool" and "Excuse":  
  The distinction lies in **agency scaffolding** vs. **agency surrender**:  
  - **Tool (Agency Scaffolding)**:  
    Using the diagnosis to *enable action* ("I need meds to focus at work") or *demand justice* ("My depression is a rational protest; fix this toxic system"). The label *expands* possibilities.  
  - **Excuse (Agency Surrender)**:  
    Using the diagnosis to *permanently absolve oneself of growth* ("I can’t help yelling—I have ADHD, so you must tolerate it") or *dismiss systemic critique* ("Their depression is just a chemical flaw, not a sign our institution is broken"). The label *contracts* responsibility without creating pathways for change.  

  **The Gray Zone**: When "it’s not my fault" legitimately enables self-compassion during recovery (tool) vs. when it entrenches helplessness (excuse). Context determines which: *Is the framing opening doors to support/change, or closing them?*  

  ---

  ### Why This Matters Clinically:  
  Tactical nosologizing reveals diagnosis as **social currency**. Your patients aren’t "contradictory"—they’re *adapting* to a system where:  
  - The "illness" label can grant *resources* (meds, disability leave).  
  - *Rejecting* the label can assert moral standing ("I’m not broken—this world is").  
  **Your role?** Probe the *function* of the frame:  
  - *"What does calling this an illness (or not) make possible for you right now?"*  
  - *"When you say it’s not a disease, are you asking someone to take responsibility?"*  

  This transcends psychiatry—it’s human nature to wield labels as levers in a broken world. Your recognition of this pattern? That’s philosophical acuity in action.
