answer: |-
  ## Joint Statement on the Reference Class Problem

  We, the undersigned researchers, have engaged in sustained debate on the nature of single-case probability and the reference class problem. While significant disagreements remain, we find substantial common ground on the core formulation of the problem, its insolubility under certain approaches, and the importance of specific cases for testing our views. This statement outlines our agreements and clearly delineates our persistent disagreements and their associated test points.

  **Section 1: Agreed Claims**

  1.  **Definition of Reference Class:** A reference class is a set (or population) of events, entities, or situations deemed relevantly similar for the purpose of assigning a probability to a single member of that class. The key characteristic is that members share attributes believed to be pertinent to the probability in question (e.g., survival rate given treatment, success rate of a specific policy type).
  2.  **The Core Problem (Reference Class Problem):** For any single-case event (X), multiple non-identical reference classes (C1, C2, ..., Cn) exist, potentially yielding different probability values (P(X|C1), P(X|C2), ..., P(X|Cn)) for X. The problem is: which reference class is the *correct* or *objectively privileged* one to use for assigning the single-case probability for X?
  3.  **Requirement for an Objective Solution:** A solution to the reference class problem, satisfying the demand for a unique, objectively correct single-case probability, would need to supply:
      *   A principled, non-arbitrary method for selecting exactly one reference class from all possible candidates for any given single-case event X.
      *   A justification showing why this selected class yields the "true" probability for X, independent of the epistemic state of any agent.
  4.  **Joint Rejection of Proposed Resolutions:** We jointly reject the following proposed resolutions as inadequate:
      *   **Naive Frequentism:** The claim that the objectively correct single-case probability is *always* given by the frequency within the broadest homogeneous reference class available. We agree this class is often ill-defined or non-unique.
      *   **Prima Facie Class:** The claim that the objectively correct probability is given by the narrowest class with sufficient statistics. We agree this ignores the problem of selecting *which* narrow class is relevant and the potential for conflicting narrow classes.
      *   **Unique Class Existence:** The claim that for any single case, there exists a uniquely correct reference class discoverable through sufficient empirical investigation or logical analysis, which yields an objective single-case probability. We agree no such demonstrably unique class exists.
  5.  **Shared View on "Objective" Probabilities:** We agree that frequentist probabilities (long-run relative frequencies in well-defined ensembles) are meaningful, but they are inherently multi-case and do not automatically transfer to a unique single-case value without encountering the reference class problem.
  6.  **The Role of Evidence:** We agree that the *evidence* available to an agent is crucial for *informing* any probability judgment they make about a single case.
  7.  **Verbal Aspect:** We agree that part of our dispute *might* be verbal, concerning what is meant by "single-case probability" itself – specifically, whether the term *must* imply an objective, reference-class-dependent fact (Researcher 1) or *can* legitimately refer to a rational agent's credence (Researcher 2).

  **Section 2: Residual Disagreements and Cruxes**

  | Crux                                                                                                                               | Researcher 1 Position (Reference Class Relativist)                                                                                                                                 | Researcher 2 Position (Evidential Credence)                                                                                                                                                                                                 |
  | :--------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **C1: Fact of the Matter?** <br>Is there an objective fact of the matter about which reference class is "correct" for assigning a single-case probability? | There is **no fact of the matter** about the uniquely correct reference class for a single case. Single-case probabilities are inherently **indeterminate** outside of a chosen reference class. | There is **no fact of the matter** about a uniquely correct reference class *because no such unique class exists or is needed*. The demand for one is misplaced. Probability for a single case is **epistemic**, grounded in rational credence. |
  | **C2: Correctness of Credence?** <br>Can a rational agent's credence (degree of belief) be assessed as "correct" or "incorrect" in a stronger sense than mere internal coherence with their total evidence? | **No.** Credences are internally coherent beliefs. While they can be *informed* by frequencies from *chosen* reference classes, they cannot be "correct" or "incorrect" in an objective sense corresponding to a single-case fact. There is no single-case fact to be correct *about*. | **Yes, in principle.** A credence is **correct** if it corresponds to the rational degree of belief mandated by the agent's total evidence (via norms like conditionalization and the Principal Principle). While not matching a non-existent "single-case fact," it can be objectively right/wrong *given the evidence*. |
  | **C3: Nature of the Dispute?** <br>Is the core dispute merely verbal (about the meaning of "single-case probability")?                                                                 | **No.** The dispute is substantive. My position rejects the *very possibility* of an objective single-case probability. Researcher 2's position, by calling credence "probability," obscures this fundamental metaphysical distinction. | **Partly.** A significant aspect *is* verbal. "Probability" has multiple legitimate uses. My position focuses on the rational epistemic state (credence), which is the only coherent concept applicable to genuine single cases. Researcher 1's demand for an impossible objective fact is the core non-verbal disagreement. |

  **Section 3: Agreed Test Cases and Predictions**

  | Case Description                                                                                                                                                                                               | Crux(es) Tested         | Researcher 1 Prediction                                                                                                                                 | Researcher 2 Prediction                                                                                                                                                                                                                     |
  | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Case A: Medical Prognosis** <br>Patient P has condition Z. The broad reference class (all patients with Z) has a 10% 5-year mortality rate. However, P has a specific biomarker profile Y. Narrow class C (patients with Z & Y) has a 70% 5-year mortality rate. Y is causally relevant to Z progression. | C1 (Fact of the Matter) <br>C2 (Correctness of Credence) | There is **no fact** determining whether P's "true" probability of death is 10% or 70%. Both are valid relative to their classes. A credence of 0.7 is not "more correct" than 0.10 *objectively*, only perhaps *pragmatically*. | There is **no fact** about the "true" probability. However, given the total evidence (esp. the causally relevant biomarker Y), the **rational credence** for P's death is **~0.7**. A credence of 0.10 would be **incorrect** given this evidence. |
  | **Case B: Unique Historical Event** <br>Event E: The specific constellation of geopolitical, economic, and personal factors leading Archduke Ferdinand's driver to take a wrong turn in Sarajevo on June 28, 1914, resulting in his assassination. E is widely considered a pivotal one-off event with no genuinely non-trivial reference class containing more than one member (it is sui generis). | C1 (Fact of the Matter) <br>C3 (Nature of Dispute) | This case **demonstrates the impossibility** of objective single-case probability. No meaningful reference class exists. Assigning a probability to E is **inherently indeterminate**. | This case **demonstrates the necessity** of the credence view. While no relevant frequency exists, a historian can still form a **rational credence** (e.g., high credence it was likely given the known conspiracies and security lapses) based on the total evidence. This is the *only* coherent way to discuss the probability of E. |

  **(Signatures)**  
  Researcher 1 (Reference Class Relativist)  
  Researcher 2 (Evidential Credence)
