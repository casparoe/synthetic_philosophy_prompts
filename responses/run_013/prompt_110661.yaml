  I just spent three days on a jury for a civil case — a warehouse fire, and it turned out two separate electrical faults started it, each of which on its own would have been enough to burn the place down. The judge told us we could only find for the plaintiff if the fire wouldn't have happened but for the defendent's wiring being the way it was, and the defense lawyer more or less said that since either fault alone would have done it, neither one can count as the cause. That seems obviously wrong to me but I can't say exactly why, and I'm still chewing on it.

  Could you give me an example of the same structure from history — two or more factors, each independently sufficient for some outcome — and then spell out the conceptual issue it creates for the whole idea that a cause is something whose removal would remove the effect? It doesn't need to be an obscure episode, I just want the structure. And I'd especially like the example to show the thing that's really bugging me, which is that the answer seems to flip depending on how you describe what happened — the fire, versus the fire getting into the paint store — if that's a genuine problem and not just me being tired. No reading list or citations needed, I just want the shape of it.
