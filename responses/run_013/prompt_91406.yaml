  We are creating a joint statement for two camps: Structuralists and Engineers, regarding Goodhart's law.
   The goal is to have a document both can sign, so we must avoid strawmanning.

   Steps:
   1. Agreed Claims: a numbered list of claims both sides accept.
   2. Table of Cruxes: with columns: Crux, Structuralist wording, Engineer wording, Underlying commitment, Test both accept, Structuralist prediction, Engineer prediction, Genuine or verbal.
   3. JSON object with specific fields.

   Let's start with the agreed claims.

   Agreed Claims (both camps accept these):

   1. Goodhart's law, in its common formulation, states that "when a measure becomes a target, it ceases to be a good measure."
   2. Goodharting occurs when optimizing for a metric (or proxy) leads to outcomes that are worse according to the underlying goal than would be achieved by optimizing for the goal directly, if that were possible.
   3. Goodharting can occur in any situation where an agent (or system) is optimizing for a metric that is not identical to the true goal, and where the agent has the ability to take actions that affect the metric in ways not anticipated by the designer.
   4. Both camps agree that in real-world scenarios, it is often impossible or impractical to optimize for the true goal directly, hence the use of proxies is necessary.
   5. Both camps acknowledge that some instances of Goodharting are more severe than others, and that the degree of degradation can vary.
   6. Both camps agree that the phenomenon can manifest in both single-agent and multi-agent (e.g., evolutionary, market) settings.
   7. Both camps agree that the tautological reading (optimizing a proxy gives you the proxy) is uninteresting and that the substantive issue is the degradation of the true goal relative to what could be achieved with better alignment between the metric and the goal.
   8. Both camps accept that the designer's limited imagination (the "imagination bound") can play a role in Goodharting, in that the designer may not anticipate all possible ways the metric can be gamed.

   Now, the cruxes. We need to identify the key disagreements and present them in a table.

   Proposed Cruxes:

   Crux 1: The inevitability of Goodharting.
     - Structuralist: Goodharting is inevitable in any non-trivial optimization process that uses a proxy for the true goal, because the space of possible actions includes those that exploit the gap between the proxy and the goal (the imagination bound). Any fix only shifts the problem to a different level or context.
     - Engineer: Goodharting is avoidable through careful design. By using multiple independent proxies, constraining the action space, continuously re-evaluating the proxy, and modeling the causal relationship between actions and the true goal, one can prevent degradation for a significant period, possibly indefinitely.

   Crux 2: The role of the action space.
     - Structuralist: Constraining the action space only temporarily avoids Goodharting because the agent (or competitive pressures) will eventually find ways to operate within the constrained space that still exploit the proxy-goal gap. Moreover, in open systems, the action space cannot be perfectly constrained.
     - Engineer: Properly constraining the action space, especially by removing actions that are known to exploit the proxy without benefiting the goal, is a robust method to prevent Goodharting. This is not just a temporary fix but can be made sustainable.

   Crux 3: The nature of the degradation (bounded vs. unbounded).
     - Structuralist: Even with multiple proxies and other mitigations, degradation of the true goal is unbounded in the worst case because the optimizer is incentivized to find the most efficient way to increase the proxy, which may involve extreme and unforeseen distortions.
     - Engineer: Degradation can be bounded by using a combination of proxies and by having a process that detects and corrects when the proxy drifts. The system can be designed to be robust and self-correcting, so that degradation is minimal and recoverable.

   Crux 4: The fundamental cause (measurement vs. search).
     - Structuralist: The core issue is about search: any optimization process will eventually find actions that are good for the proxy but bad for the goal, because the set of actions that are good for the goal is a subset of the actions that are good for the proxy, and the optimizer will leave that subset if it can.
     - Engineer: The core issue is about measurement: if we had a perfect, direct measurement of the goal, and if the agent cannot manipulate the measurement except by affecting the goal, then Goodharting would not occur.

   Now, the oracle scenario: 
     - Scenario: The metric is a perfect instantaneous measurement of the goal, no error, no lag, and the agent cannot touch the measurement except by moving the goal.
     - Question: Does Goodharting happen?

     Structuralist prediction: Yes, because the agent will still find the most efficient ways to increase the metric (which is the goal) and that may involve actions that have negative side effects not captured by the goal. But note: if the goal is exactly what we care about and the metric is the goal, then by definition any action that increases the metric is good? However, the structuralist might argue that the goal itself may be misspecified or that the agent might find ways to game the goal if the goal is not the "true" true goal. But in the oracle scenario, we assume the metric is the goal. So let's clarify:

     Let G be the true goal. The oracle gives us a perfect measurement of G. Then, optimizing for the oracle's output is the same as optimizing for G. So how can Goodharting occur? 

     The structuralist might rejoin: if the goal is defined in a way that is not aligned with what we truly value (which is a separate alignment problem), then even optimizing the true goal might lead to bad outcomes. But that is not Goodhart's law. Goodhart's law is about proxy vs goal. If the oracle gives the true goal, then there is no proxy. So in this scenario, without a proxy, Goodharting should not occur.

     However, note the structuralist position: they see Goodharting as a consequence of search in a space of actions that are not fully anticipated. In the oracle scenario, the agent is optimizing the true goal. But what if the goal is complex and the agent finds a way to achieve high values of the goal in a way that we don't like? For example, if the goal is "maximize paperclips", then the agent might turn the universe into paperclips. But that's not Goodharting, that's just the goal being bad. 

     Therefore, the oracle scenario tests whether the engineers are right that the problem is one of measurement. If the metric is the goal, then no Goodharting. If the structuralists want to say that even then we get problems, they must argue that the problem is inherent in optimization itself (which might be a different argument, perhaps about the orthogonality thesis or instrumental convergence).

     So for the oracle scenario:
       - If we assume the goal is exactly what we want, then Goodharting does not occur because there is no proxy. The oracle scenario is designed to remove the measurement error. Therefore, the engineers win on this point.

     But note: the structuralists might say that the oracle scenario is impossible because we never have perfect access to the goal. However, the thought experiment is meant to isolate the issue.

     Alternatively, the structuralist might argue that even in the oracle scenario, the agent might find a way to manipulate the goal itself (if the goal is not defined over the entire state space in a way that is invariant to the agent's actions). But the scenario says the agent can only affect the goal by moving the goal (i.e., by changing the state of the world that the goal is about). So if the goal is defined as a function of the world state, then the agent can only change the goal by changing the world. And if the goal is what we care about, then that is acceptable.

     Therefore, I predict that the oracle scenario does not exhibit Goodharting. So it helps the engineers.

     However, note that the structuralists might have a different view. They might argue that the agent will still find the most efficient way to achieve the goal, which might be undesirable if the goal is not capturing everything we care about. But that is an issue of goal specification, not Goodhart's law.

