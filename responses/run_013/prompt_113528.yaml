prompt: |-
  ok so this is a thing I keep noticing in arguments about history and I genuinely cant tell if there's a word for it or if im just being pedantic.

  Here's the shape. Someone brings up that a dead person did something we'd call bad now -- kept slaves, thought women shouldn't vote, whatever. Someone else says: you can't judge him by our standards, he was a man of his time, everybody thought that then. Fine. But then the same person turns around and praises some other figure from the same decade who was against the thing -- an abolitionist, an early suffragist -- calls them brave, ahead of their time, admirable. And I feel like you can't do both. If 'everybody thought that then' is a real excuse, then the ones who didn't think it aren't admirable, they're just outliers. And the second you praise the one who saw past the times, you're measuring them by a standard that isn't the times' -- which is the exact thing the excuse said you mustn't do. So the times-standard comes out only to block blame and never to block praise, and it comes out hardest for the people the speaker happens to like.

  Two wrinkles. First, the excuse often isn't even true -- I've looked up a couple of the defended guys and plenty of their contemporaries were saying the opposite, loudly; nobody checks, because the point was never to describe the past, it was to end the argument. Second, the same move gets aimed at us: 'in a hundred years they'll think we were barbarians for eating meat / flying everywhere / whatever, so who are we to judge' -- which seems like a different job, not understanding anybody, just getting off the hook for now.

  Is there a name for this? Not presentism in the loose sense, and not just 'man of his time' by itself -- I mean the specific double standard where the same standard kills blame but not praise. Which of the usual labels is it nearest to (presentism, whig history, anachronism, the historian's fallacy, whatever the relativist one is called), and where exactly does it part company with each? If nothing fits, don't just hand me a word -- coin one, with a definition and edges: clear cases that are it and clear cases that aren't.

  And be straight with me about the state of play -- if the people who actually study this have mostly converged on how to think about judging past actors, say so, and if it's still genuinely fought over, don't sell me one camp's answer as if it were the consensus.
reasoning: |-
  Okay, the user is describing a specific inconsistency they've noticed in historical arguments. Let me unpack this. They're pointing out a double standard where people excuse historical figures for harmful actions by saying they were "products of their time," but then praise contemporaries who opposed those norms as "ahead of their time." The user wants to know if there's a term for this logical inconsistency.

  Hmm, I recall that this is a common issue in historiography. The "man of his time" defense is selectively applied to shield certain figures from criticism while allowing praise for others who challenged the status quo. That does seem contradictory. If the standards of the era excuse wrongdoing, then they should also diminish the credit given to reformers who deviated from those standards. But in practice, it's applied asymmetrically - blocking blame but not praise.

  The user also notes two important wrinkles: that the "everyone thought that" claim is often historically inaccurate (contemporaneous critics existed), and that this same reasoning gets used to deflect current moral responsibilities. They're asking for precise terminology to describe this specific double standard phenomenon.

  Looking at existing historical fallacy terminology... Presentism is related but broader. The Historian's Fallacy focuses on hindsight bias. Moral relativism touches on it but doesn't capture the asymmetric application. Cultural relativism similarly misses the inconsistency. 

  I think "asymmetric presentism" might work as a coined term - it captures the uneven application of modern standards. Or "moral inoculation" to emphasize how it's used to protect favored figures. The key is naming this specific pattern where historical context is weaponized selectively.

  Regarding the state of play in academic history: There's consensus that both context and moral judgment matter, but ongoing debate about their balance. Most historians reject pure relativism while acknowledging we must understand past frameworks. The selective application the user describes is widely seen as problematic, even as the underlying tension remains unresolved. 

  The user seems analytically sophisticated - they've identified both the logical flaw and its rhetorical function (to shut down discussion). They want precise conceptual tools to articulate this, not just a pat answer. I should acknowledge the complexity while giving them usable terminology.
answer: |-
  You've pinpointed a profound and frustrating inconsistency in how people engage with the past. It's not pedantry – it's a genuine logical flaw and rhetorical maneuver. There isn't one universally accepted term for *exactly* this double standard, but we can dissect it, coin a precise term, define its boundaries, and situate it within existing concepts.

  **The Core Problem: Selective Application of Historical Context**

  The core flaw is the **selective application of historical context solely to exonerate favored figures while simultaneously applying transhistorical moral standards to praise dissenting figures from the *same* context.** Context becomes a shield for the "bad" actions of some but isn't allowed to diminish the "good" actions of others.

  **Coined Term & Definition**

  *   **Term:** **Asymmetric Presentism** or **Selective Contextual Absolution (SCA)**
  *   **Definition:** The logical inconsistency and rhetorical tactic where:
      1.  Historical context (e.g., prevailing norms, beliefs, practices of the era) is invoked to defend a specific historical actor ("A") against moral condemnation based on modern standards ("They were a product of their time, everyone thought that").
      2.  Simultaneously, historical context is *ignored* or *minimized* when praising a contemporary dissenting actor ("B") who opposed the norm in question ("They were brave, visionary, ahead of their time").
      3.  This results in an asymmetry: Context absolves A of blame but does not diminish the credit given to B for transcending that same context. The *same* historical moment is treated as both an absolute determinant of moral possibility (for A) and as something easily overcome by moral insight (for B).
      4.  The underlying motive is often apologetics for A or the dismissal of criticism regarding A, rather than a consistent historical methodology.

  **Edges: Clear Cases**

  *   **Is Asymmetric Presentism / SCA:**
      *   Defending a Founding Father for owning slaves ("Everyone did it then!") while praising contemporary abolitionists like Quakers or Frederick Douglass ("They were morally courageous!").
      *   Excusing a Victorian scientist for sexist views ("That was the norm") while lauding John Stuart Mill for his feminism ("He was ahead of his time!").
      *   Dismissing criticism of a 1950s politician's homophobic votes ("It was a different era") while celebrating Alan Turing or early gay rights activists ("They were pioneers!").
  *   **Is NOT Asymmetric Presentism / SCA:**
      *   **Consistent Contextualism:** "While slavery was widespread and legally protected in the 18th century, we can still recognize the *relative* moral courage of those who actively opposed it within that context, while understanding why others participated in the system." (Applies context to *understand* both, potentially *evaluating* dissent positively without denying the context's power).
      *   **Consistent Presentism (Judgmental):** "Owning slaves was always morally abhorrent, regardless of era. Anyone who did it is condemnable, even if common. Those who opposed it are praiseworthy." (Applies the *same* modern standard consistently, rejecting context as an excuse).
      *   **Consistent Relativism (Non-Judgmental):** "We cannot meaningfully apply our moral categories to the past. Slaveholders operated within a framework where slavery was normal and economically vital; abolitionists were deviants from that norm. Neither is 'good' or 'bad' by our lights, just products of complex historical forces." (Denies the applicability of *any* transhistorical judgment, praise or blame).
      *   **Acknowledging Nuance Without Inconsistency:** "Figure A held views common among his class and time, though dissenting voices existed. Figure B was part of that dissent. We can understand A within his context *while still* recognizing the harm caused by the system he upheld, and we can admire B's courage *relative to that context* without assuming they were perfect by modern standards." (See State of Play below).

  **Relationship to Existing Concepts**

  1.  **Presentism (Proper):** The anachronistic imposition of present-day ideas, values, and perspectives onto the past. Asymmetric Presentism *uses* presentism selectively. It *relies* on presentist values to praise B ("Abolitionism aligns with *our* values!") while *rejecting* presentism as invalid when it condemns A ("You can't judge him by *your* values!"). It's a hypocritical *application* of presentism.
  2.  **"Man of His Time":** This is the *excuse* half of the asymmetry. Asymmetric Presentism uses this phrase as a shield for A but denies its relevance (or flips it to "ahead of their time") for B.
  3.  **Whig History:** The view of history as progress towards present enlightenment. Asymmetric Presentism often *leverages* a Whiggish impulse (praising B as a "step forward") but *subverts* it by blocking the condemnation of figures representing the "backward" past (A). Whig history usually condemns the "backward"; this asymmetry avoids that condemnation.
  4.  **Historian's Fallacy:** Judging past decisions without understanding the context or information available *at the time*. Asymmetric Presentism *invokes* this fallacy defensively for A ("You can't judge him, he lacked our knowledge!") but *ignores* it for B ("Look how brave they were, even without full societal support/knowledge!"). The fallacy is applied unevenly.
  5.  **Moral/Cultural Relativism:** The view that moral values are relative to culture/historical period, making cross-cultural judgments invalid. Asymmetric Presentism *selectively invokes* relativism to defend A ("Don't judge, it was *their* morality") but *abandons* it to praise B ("Their actions were *objectively* good/moral"). It's relativism used only for absolution, not consistency.
  6.  **Special Pleading:** A fallacy where one makes an exception for a specific case without adequate justification. This is the *logical core* of Asymmetric Presentism. The special plea is: "Historical context absolves *this specific person I like/want to defend*, but not *that specific contemporary dissenter* I want to praise."

  **The State of Play in Academic History**

  *   **No Simple Consensus:** Historians and philosophers of history are *still* vigorously debating the ethics and methodology of judging the past. There is **no single, universally agreed-upon formula.**
  *   **Rejecting Pure Relativism:** Most serious historians reject the notion that we cannot judge the past *at all*. Slavery, genocide, systematic oppression are widely condemned across historical contexts. Pure "it was their time, hands off" is seen as intellectually lazy and morally problematic.
  *   **Rejecting Naive Presentism:** Equally, historians reject simply projecting modern sensibilities onto the past without understanding the vastly different material conditions, epistemological frameworks, social structures, and genuine beliefs of historical actors. Condemning a medieval peasant for not being a feminist is absurd.
  *   **Converging on Nuance ("Contextual Moral Assessment"):** The dominant approach emphasizes:
      *   **Deep Context:** Rigorously understanding the past on *its own terms* – the available options, pressures, beliefs, information, constraints, and *range* of contemporary opinions (exposing the "everyone thought that" claim as often false).
      *   **Acknowledging Harm:** Recognizing that actions caused suffering or injustice, even if normalized then. We can say "this caused harm" without necessarily branding the individual an irredeemable monster.
      *   **Relative Judgment:** Evaluating actors *within the possibilities of their context*. Was their action typical? Were they pushing boundaries? Were they aware of dissent? Were they unusually cruel/compassionate *for their setting*? Praising a dissenter *relative to their context* is common and seen as valid historical analysis.
      *   **Intent vs. Impact:** Considering intentions (which require context) alongside consequences (which we can assess more objectively).
      *   **Complexity:** Recognizing individuals hold contradictory views, change over time, and operate within systems larger than themselves.
  *   **The Fight Continues:** Debates rage about:
      *   The *weight* given to context vs. transhistorical principles.
      *   The language used for condemnation/praise (e.g., "morally wrong" vs. "historically problematic").
      *   How to handle figures whose "great" achievements are intertwined with profound moral failings.
      *   The purpose of history itself (understanding vs. moral instruction vs. identity formation).

  **Conclusion**

  Your observation is sharp and valid. The phenomenon you describe – **Asymmetric Presentism** or **Selective Contextual Absolution (SCA)** – is a common logical inconsistency and rhetorical dodge. It misuses historical context as a shield for favored figures while happily applying modern standards to praise dissenters from the *same* era. It often relies on a false premise ("everyone thought that") and can be deployed to deflect current responsibility ("who are we to judge?").

  While historians haven't settled the *underlying* debate about judging the past, they overwhelmingly reject the *inconsistency* you've identified. The mainstream approach demands rigorous contextual understanding that acknowledges the *full spectrum* of contemporary thought, recognizes harm, and allows for nuanced, *relative* assessments of individual actions within the constraints and possibilities of their specific historical moment. The "man of his time" defense, when used asymmetrically, fails this test.
