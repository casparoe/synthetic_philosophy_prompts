prompt: |-
  You are an expert on collective reasoning, AI-augmented deliberation, and the design of decision procedures — and unusually good at noticing where a procedure has quietly substituted a different question for the one it was supposed to answer. I direct a small research nonprofit: eight analysts, each able to give about four hours to a single sub-question, one two-hour team session per week, fixed budget, and a director who signs off on the output without re-deriving it. We make consequential calls under that constraint, and we have been trying to work in the spirit of two pictures. The first is a "heterarchy of cognitive hierarchies": a huge question is answered by an enormous tree of much smaller questions, each handled by a narrow, limited process, and no level's answer is authoritative — every proposed answer gets weighed by many critics at many levels, including levels above it. The second is "factored cognition": a hard task is split into subtasks small enough for a bounded agent to do well, with the final answer assembled from the parts. Start with a few sentences brainstorming how these pictures fail in practice, then write the procedure.

  Write the decomposition protocol my team can actually run, in the order we would run it: the questions to ask about a candidate big question before we factor it at all; what counts as a sufficient answer at each step; the tests that check whether the assembly answers our original question rather than a neighbouring one; how to weight sub-answers so that no single summarizer becomes the de facto decider; the stop conditions that end the process; and the points where it must hand the decision to a human because the residue is a value question, because checking an answer is as hard as producing it, or because the sub-answers are individually defensible but jointly inconsistent.

  Run it on three questions: (1) whether to advise our main funder to pause a grant to a lab whose internal safety culture we cannot observe; (2) the probability that a specific piece of pending legislation passes within two years; (3) whether we should run an experiment that persuades people without telling them. For at least one of these, do not soften the verdict if the protocol says the question cannot be faithfully factored at our budget. Mark which steps are judgment calls dressed up as procedure, and say plainly what the protocol cannot do.
reasoning: |-
  We are designing a decomposition protocol for a small research nonprofit. The team has eight analysts, each can give about four hours to a single sub-question, one two-hour team session per week, and a fixed budget. The director signs off without re-deriving. We are inspired by two ideas: "heterarchy of cognitive hierarchies" (where a big question is broken into a tree of small questions, with answers weighed by critics at multiple levels) and "factored cognition" (splitting a hard task into subtasks small enough for bounded agents).

  First, brainstorm how these pictures fail in practice:

  1. **Decomposition Errors**: The initial split might miss crucial interdependencies or create subtasks that don't actually aggregate to answer the original question. Subtasks might be ill-defined or biased by the way they are framed.

  2. **Summarization Bottlenecks**: When sub-answers are combined, the summarizer (or combiner) becomes a single point of failure. If one person or a small group is responsible for combining, they might inadvertently (or intentionally) skew the result.

  3. **Value Questions Hidden as Facts**: Some questions may appear factual but actually hinge on value judgments. Factored cognition might push these into the background, leading to a technically assembled answer that doesn't address the real issue.

  4. **Inconsistencies in Sub-answers**: Independently derived sub-answers might be logically inconsistent when combined, and the assembly step might not catch it.

  5. **Resource Constraints**: The process might require more time or expertise than available, leading to shallow analysis or skipped steps.

  6. **Stop Conditions**: Without clear stop conditions, the process might run too long or stop too early.

  7. **Overhead**: The coordination and communication overhead might consume too much of the limited resources.

  Now, the procedure:

  **Protocol for Decomposing and Answering a Big Question**

  **Step 0: Pre-decomposition Screening (Before Factoring)**
     - **Question to Ask**: "Is this question decomposable without losing essential meaning? What are the key value judgments, uncertainties, and interdependencies?"
     - **Sufficient Answer**: A one-page memo that:
          (a) Identifies the core value judgments (if any) that must be made by a human (director or designated person).
          (b) Lists the major uncertainties and their potential impact.
          (c) Outlines the main interdependencies that might break decomposition.
          (d) Estimates the minimum resources (analyst hours, team sessions) needed for a faithful decomposition, and whether it fits within budget.
     - **Stop Condition**: If the memo concludes the question cannot be decomposed within budget without losing essential meaning, hand the question to the director for a judgment call. Also, if the question is primarily about values (as per (a)), hand it to the director.

  **Step 1: Decomposition**
     - **Activity**: Break the big question into a tree of sub-questions. The tree should have at least two levels (with the big question at the top and leaves being the smallest sub-questions). Each leaf must be answerable by one analyst in four hours.
     - **Sufficient Answer**: A decomposition tree that:
          (a) Has clear, non-overlapping leaf questions (to avoid duplication of effort).
          (b) Each leaf is specific, answerable, and has a defined output format (e.g., probability, yes/no, list of factors).
          (c) The tree includes at least one "cross-check" question per branch (to be assigned to a different analyst) that verifies the connection between a group of leaves and their parent.
          (d) The tree also includes at least one "meta-question" per major branch that asks: "If we combine the answers of these sub-questions, would it answer the parent question? If not, what is missing?" (This is a critical check for decomposition validity.)
     - **Who Does It**: The whole team in the two-hour session, led by a facilitator (rotated among analysts). The output is a shared document.

  **Step 2: Assignment and Individual Work**
     - **Activity**: Assign each leaf question (and cross-check and meta-questions) to an analyst. Each analyst works independently on their assigned question for up to four hours.
     - **Sufficient Answer for Leaf Questions**: A written answer (one page max) that includes:
          (a) The answer to the question.
          (b) Key evidence and reasoning.
          (c) Confidence level (e.g., 0-100%).
          (d) Any uncertainties or information gaps.
     - **Cross-check Questions**: The assigned analyst reviews the answers of a group of leaves and the parent node they support. They write a one-page report on whether the combination of the leaves answers the parent and if there are inconsistencies or gaps.
     - **Meta-Questions**: The assigned analyst reviews a branch (a parent and its children) and answers: "Does the combination of the children's answers fully address the parent? If not, what is missing? Are there contradictions?"

  **Step 3: Aggregation with Weighting**
     - **Activity**: Combine the answers from the leaves up the tree, level by level. At each level, use multiple analysts (different from those who worked on that branch) to aggregate and cross-check.
     - **Weighting System**: To avoid a single summarizer becoming the decider:
          (a) For each non-leaf node, assign at least two analysts (who did not work on its children) to independently propose an answer for the parent node based on the children's answers.
          (b) These two analysts also assign a weight to each child answer based on:
              - The confidence level provided by the child's author.
              - The cross-check report for that branch (if available).
              - Their own assessment of the child answer's reliability (with reasoning).
          (c) The two proposed parent answers and weightings are then compared. If they are within an acceptable range (e.g., both yield the same qualitative conclusion or a numerical difference of less than 10%), they are averaged (if numerical) or a consensus is formed (if categorical). If they differ significantly, a third analyst (or the team in a session) resolves the discrepancy.
     - **Sufficient Answer at Each Level**: A written summary for the parent node that includes:
          (a) The aggregated answer.
          (b) The range of the two independent aggregations (if numerical) or the two proposed answers (if categorical).
          (c) The weights assigned to each child and why.
          (d) Any unresolved discrepancies and how they were handled.

  **Step 4: Final Assembly and Check**
     - **Activity**: At the top level, the two independent aggregators (who have not worked on the top-level branches) propose an answer for the big question. Then, a separate "devil's advocate" team (two analysts) checks the entire tree for:
          (a) **Faithfulness Check**: Does the final answer actually answer the original question? Or has the question been subtly replaced? (They must explicitly compare the original question and the final answer.)
          (b) **Joint Consistency**: Are there any contradictions between sub-answers at different branches that were not caught? (They sample at least three pairs of branches that might interact.)
          (c) **Value Check**: Have any value judgments been hidden in factual sub-questions? (They look for value-laden terms in the leaves and trace how they were handled.)
     - **Sufficient Answer**: A report from the devil's advocate team that either approves the final answer or flags specific issues. If issues are flagged, they are addressed by re-opening the relevant part of the tree (if within budget) or by escalating to the director.

  **Step 5: Stop Conditions and Hand-offs**
     - **Stop Conditions**:
          (a) The process stops when the devil's advocate team approves the final answer and the director signs off.
          (b) If at any step the resource budget (total analyst hours or team sessions) is exceeded, the process stops and the current state is handed to the director with a summary of what was done and what remains.
          (c) If a value judgment is identified (either in Step 0 or Step 4) that cannot be resolved factually, it is handed to the director.
          (d) If the devil's advocate team finds that the assembly does not answer the original question and the gap cannot be closed with available resources, the process stops and the question is handed to the director.
          (e) If the cross-check or meta-questions reveal that the decomposition is flawed and cannot be fixed within budget, the process stops and escalates.
     - **Hand-off to Human**: The director is given:
          (a) The current state of the answer.
          (b) A clear list of the unresolved issues (with type: value, inconsistency, decomposition gap, resource constraint, etc.).
          (c) Recommendations from the team on how to proceed (if any).

  **Judgment Calls Dressed as Procedure**:
     - In Step 0, identifying "core value judgments" is inherently a judgment call.
     - In Step 1, designing the decomposition tree requires judgment about what is essential and what can be factored.
     - In Step 3, the "acceptable range" for aggregator agreement and the weights assigned to child answers are judgment calls.
     - In Step 4, the devil's advocate team's check for faithfulness and value judgments is a judgment call.

  **What the Protocol Cannot Do**:
     - It cannot guarantee that the decomposition captures all critical factors if the initial decomposition is flawed.
     - It cannot eliminate the risk of groupthink or bias in the weighting and aggregation steps, only mitigate it.
     - It cannot resolve fundamental value disagreements; it can only flag them.
     - It cannot produce a reliable answer if the required expertise is not present in the team.

  Now, run the protocol on the three questions:

  **Question 1: Whether to advise our main funder to pause a grant to a lab whose internal safety culture we cannot observe.**

  *Step 0: Pre-decomposition Screening*
     - Value judgments: The decision involves balancing the risk of funding unsafe research (which could lead to harm) against the risk of pausing beneficial research. There is also a value judgment about what level of risk is acceptable and how precautionary we should be.
     - Uncertainties: We cannot observe the lab's safety culture directly, so we must rely on proxies. The quality of these proxies is uncertain.
     - Interdependencies: The decision might depend on the lab's track record, the nature of the research, and the consequences of pausing (e.g., will it set a precedent?).
     - Resource estimate: This is a complex question with high stakes. It might require more resources than available. But let's assume we try to decompose.

     *Decision*: The question is decomposable, but we note the value judgment about risk tolerance must be made by the director. We proceed with decomposition.

  *Step 1: Decomposition*
     - Tree:
          Level 1: Big question: "Should we advise pausing the grant?"
          Level 2: 
              A. What is the probability that the lab has a poor safety culture? (Leaf)
              B. If the safety culture is poor, what is the probability of a major safety incident in the next year? (Leaf)
              C. What is the expected harm (magnitude and probability) if a major safety incident occurs? (Leaf)
              D. What are the benefits of the research (in the next year) that would be lost if we pause? (Leaf)
              E. What are the non-safety risks of pausing (e.g., reputational, relationship with funder)? (Leaf)
              F. Meta-question for A-C: Do these questions, when combined, allow us to compute the expected risk of continuing? (Meta)
              G. Cross-check for A: What proxies for safety culture are available and how reliable are they? (Cross-check for A)
          Level 3: 
              For A: Break into proxies? Not necessary for a 4-hour leaf.

     *Assignment*: Assign A, B, C, D, E, to five analysts. F to one analyst (meta), G to one analyst (cross-check for A). One analyst left for later steps.

  *Step 2: Individual Work*
     - Analyst A: Estimates probability of poor safety culture at 30% (confidence 60%) based on public incidents and expert opinions.
     - Analyst B: If poor safety culture, estimates 10% chance of major incident (confidence 70%).
     - Analyst C: Expected harm of a major incident: high (e.g., $1B in damages, 50% chance of causing harm to public health). Confidence 50% because speculative.
     - Analyst D: Benefits of the research: developing a key technology, worth $500M in expected value. Confidence 70%.
     - Analyst E: Non-safety risks of pausing: medium (e.g., 20% chance of damaging relationship with funder, which might cost 10% of future funding). Confidence 60%.
     - Analyst F (meta for A-C): Combining A, B, C: We can compute expected risk of incident (0.3 * 0.1 = 3% chance of incident, with high harm). But this doesn't include the risk from other factors (e.g., even with good culture, incidents can happen). Also, the harm estimate is very uncertain. So, the parent question (risk of continuing) is only partially answered.
     - Analyst G (cross-check for A): The proxies for safety culture are weak (only public incidents and second-hand reports). Therefore, the 30% estimate is highly uncertain (confidence should be lower, say 40%).

  *Step 3: Aggregation (for risk of continuing)*
     - Two independent aggregators (say, analysts 7 and 8) for the risk of continuing (from A, B, C):
          Aggregator 7: Using A (30%, but adjusted to 40% uncertainty by cross-check), B (10%), C (high harm). Expected risk = 0.3 * 0.1 * high harm = 0.03 * high harm. But notes the high uncertainty.
          Aggregator 8: Weights A as low confidence (due to cross-check), so uses 20% (as a conservative adjustment). Then expected risk = 0.2 * 0.1 * high harm = 0.02 * high harm.
     - They disagree on the adjustment of A. They discuss and settle on 25% for A, giving expected risk = 0.025 * high harm. They also note the high uncertainty in harm.

     Now, compare with benefits (D) and other risks (E). The big question is: is the expected risk of continuing greater than the expected cost of pausing?
          Expected cost of pausing = lost benefits (D) + non-safety risks (E).
          Aggregator 7: lost benefits = $500M, non-safety risks = 0.2 * 0.1 * (10% of future funding) [but this needs quantification]. This is messy.

  *Step 4: Final Assembly and Check*
     - The devil's advocate team (say, analysts who worked on D and E) reviews:
          Faithfulness: The original question was about advising pause. The aggregation has focused on a cost-benefit analysis, but the director might care about other factors (e.g., ethical obligations). Also, the harm and benefits are in different units (dollars vs. public health). They flag that the conversion to a common unit (dollars) is a value judgment that was not explicitly made.
          Joint Consistency: The risk of continuing (from A, B, C) and the benefits of continuing (D) are both about the research, but the non-safety risks (E) are about the funding relationship. They are consistent but not directly comparable.
          Value Check: The assignment of dollar values to harm and benefits involves value judgments (e.g., the value of a human life). This was not flagged in Step 0.

     *Verdict*: The devil's advocate team rejects the assembly because of the hidden value judgments and the incomparability of the units. They recommend handing to the director.

  *Step 5: Stop and Hand-off*
     - Due to the value judgment issue and the difficulty in comparing risks and benefits, the process stops and hands to the director. The director must make the value call on how to weigh different types of risks and benefits.

  **Question 2: The probability that a specific piece of pending legislation passes within two years.**

  *Step 0: Pre-decomposition Screening*
     - Value judgments: This appears to be a factual question. However, the choice of factors to consider might involve judgment (e.g., do we include public opinion?).
     - Uncertainties: Political processes are uncertain. We might need to rely on expert opinions or historical data.
     - Interdependencies: The bill's passage might depend on multiple factors (sponsors, opposition, amendments, etc.).
     - Resource estimate: This is a standard prediction task and should be decomposable.

     *Decision*: Proceed.

  *Step 1: Decomposition*
     - Tree:
          Level 1: Probability that the bill passes within two years.
          Level 2:
              A. What is the probability the bill passes in the House? (Leaf)
              B. What is the probability the bill passes in the Senate? (Leaf)
              C. What is the probability the President signs it? (Leaf)
              D. Meta: Do these cover all necessary steps? (Meta)
              E. Cross-check for A: What are the key factors for the House? (Cross-check for A)

     *Assignment*: Assign A, B, C, D, E to five analysts. Three left.

  *Step 2: Individual Work*
     - Analyst A: House probability: 60% (based on current co-sponsors and committee support). Confidence 70%.
     - Analyst B: Senate probability: 40% (filibuster risk). Confidence 60%.
     - Analyst C: President: 90% (the President has expressed support). Confidence 80%.
     - Analyst D (meta): The steps are necessary and sufficient (if it passes House, Senate, and is signed, it passes). But note: the bill might be amended, which could change support. Also, time constraint (two years) might require considering election cycles.
     - Analyst E (cross-check for A): Key factors for House: current majority, public opinion, and lobbying efforts. The analyst A considered co-sponsors but not public opinion. Adjust confidence to 60%.

  *Step 3: Aggregation*
     - Two aggregators for the top level (passage = House and Senate and President):
          Aggregator 1: P = P(House) * P(Senate | House passed) * P(President | passed both). But we don't have conditionals. Assume independence? Then P = 0.6 * 0.4 * 0.9 = 0.216 (21.6%).
          Aggregator 2: They note that the Senate might be more likely to pass if the House does (so not independent). They estimate P(Senate | House passed) = 50%. Then P = 0.6 * 0.5 * 0.9 = 0.27 (27%).
          They disagree on the conditional probability. They bring in a third analyst who suggests using historical data: when the House passes a similar bill, the Senate passes it 40% of the time (so use 40%). Then P = 0.6 * 0.4 * 0.9 = 0.216. They settle on 21.6% with a note about the independence assumption.

  *Step 4: Final Assembly and Check*
     - Devil's advocate team:
          Faithfulness: The original question was about passage within two years. The aggregation did not explicitly account for time (e.g., what if it doesn't get a vote in time?). This is a gap.
          Joint Consistency: The factors are consistent.
          Value Check: No value judgments detected.

     *Verdict*: They flag the time gap. The team re-opens to add:
          Leaf F: What is the probability the bill gets a vote in both chambers within two years?
          But the budget might not allow. Since the team session is available, they assign F to an analyst and update the aggregation.

          Analyst F: Probability of getting a vote in House within two years: 80%. Senate: 70%. Then the adjusted P(passage) = P(vote in House) * P(pass House | vote) * P(vote in Senate | pass House) * P(pass Senate | vote) * P(sign). This becomes very complex. The team might run out of time.

          Alternatively, they adjust the original probability by multiplying by P(vote in both chambers) = 0.8 * 0.7 = 0.56? But that's not quite right.

     *Hand-off*: Given the complexity and time, the devil's advocate team might accept the original 21.6% but with a low confidence due to the time gap. The final answer is 21.6% with a confidence of 50% (due to unresolved time factor and independence assumptions). The director is informed of the limitations.

  **Question 3: Whether we should run an experiment that persuades people without telling them.**

  *Step 0: Pre-decomposition Screening*
     - Value judgments: This is primarily an ethical question. The key issue is whether it is acceptable to manipulate people without their knowledge. This is a core value judgment.
     - Uncertainties: The effectiveness of the experiment and the potential harm to participants.
     - Interdependencies: The decision depends on ethical considerations, scientific merit, and potential consequences.
     - Resource estimate: We can decompose the factual parts, but the ethical core must be handled by a human.

     *Decision*: The value judgment about the ethics of manipulation must be made by the director. We can decompose the rest to inform that decision.

  *Step 1: Decomposition*
     - Tree:
          Level 1: Should we run the experiment?
          Level 2:
              A. What is the expected scientific value of the experiment? (Leaf)
              B. What is the probability and magnitude of harm to participants? (Leaf)
              C. What are the ethical guidelines (from our institution and field) on informed consent for such experiments? (Leaf)
              D. Meta: Do A, B, and C cover the key factors for the decision? (Meta)
          Note: The value judgment about whether the harm and lack of consent is acceptable is not decomposed.

     *Assignment*: Assign A, B, C, D to four analysts.

  *Step 2: Individual Work*
     - Analyst A: Scientific value is high (could lead to breakthroughs in communication). Confidence 80%.
     - Analyst B: Harm to participants: low probability, low magnitude (e.g., temporary discomfort). Confidence 70%.
     - Analyst C: Ethical guidelines: Most require informed consent for deception. This experiment would violate that. Confidence 90%.
     - Analyst D (meta): A, B, and C cover the key factors. But the ethical violation (from C) is a major factor.

  *Step 3: Aggregation*
     - Two aggregators for the top level:
          Aggregator 1: The experiment has high scientific value and low harm, but it violates ethical guidelines. Therefore, we should not run it.
          Aggregator 2: The ethical violation is serious and should override the scientific value. Therefore, no.
          They agree: do not run.

  *Step 4: Final Assembly and Check*
     - Devil's advocate team:
          Faithfulness: The original question is about "should we", which includes ethics. The aggregation correctly considered ethics.
          Joint Consistency: The factors are consistent.
          Value Check: The ethical guidelines are clear, but the director might have a different view on the weight of the violation. This is a value judgment that should be escalated.

     *Verdict*: The devil's advocate team notes that the answer "no" is based on the ethical guideline violation. However, the director might decide to override the guideline in this case. They flag that the final decision is a value judgment and hand it to the director.

  *Step 5: Hand-off to Director*: The team's analysis concludes that the experiment violates ethical guidelines, but the director must decide whether to proceed despite the violation.

  **Summary of Runs**:
     - For Question 1, the protocol flagged a value judgment and unit incomparability and handed to the director.
     - For Question 2, the protocol produced an answer but with low confidence due to a gap in the decomposition (time constraint) and independence assumptions.
     - For Question 3, the protocol identified the core value judgment and handed the final decision to the director.

  In all cases, the protocol did not soften the verdict when it couldn't be factored (e.g., Question 1 and 3 were handed to the director). For Question 2, it produced an answer but with caveats.
answer: |-
  ### Decomposition Protocol for Collective Reasoning  
  Designed for 8 analysts, each contributing 4 hours to a sub-question, one 2-hour team session/week, fixed budget, and director sign-off. Integrates "heterarchy of cognitive hierarchies" (answers weighed by multi-level critics) and "factored cognition" (task split for bounded agents).  

  **Core Failures in Practice**:  
  - **Decomposition Drift**: Subtasks may answer adjacent questions, not the original (e.g., "safety risks" replaces "should we pause?" with "what are risks?").  
  - **Summarizer Dominance**: Single aggregators become de facto deciders, overriding distributed input.  
  - **Hidden Values**: Fact-based subtasks mask value-laden premises (e.g., "harm" implies ethics).  
  - **Inconsistency Blind Spots**: Defensible sub-answers conflict when combined (e.g., "low risk + high harm = high cost" ignores moral costs).  
  - **Resource Illusion**: Decomposition assumes subtasks are parallelizable, but critical path dependencies emerge.  

  ---

  ### Protocol Steps  
  **Order of Operations**: Run sequentially. Budget = 32 analyst-hours (8 × 4h) + one 2h team session.  
  **Output Format**: All answers include: (1) Core response, (2) Confidence (0–100%), (3) Uncertainties/gaps, (4) Sources.  

  #### **Step 0: Pre-Factoring Interrogation**  
  **Question**: *"Can this question be faithfully factored into bounded sub-questions without distorting its intent?"*  
  **Sub-questions**:  
  - What ambiguities exist in phrasing?  
  - What core values are embedded (e.g., ethics, risk tolerance)?  
  - What dependencies exist between sub-questions?  
  - What minimal expertise is required?  
  **Sufficiency**: A "go/no-go" memo (1 page) with:  
  - Value judgments flagged for director.  
  - Estimated resource map (analyst-hours per branch).  
  - Stop if:  
    - Value residue > 20% of core question (per team vote).  
    - Checking an answer = producing it (e.g., "is this summary fair?" is as hard as the full analysis).  
    - Budget < 110% of estimate.  
  **Hand-off**: To director if stop conditions met.  

  #### **Step 1: Decomposition**  
  **Activity**: Team session (2h) to split the question into a tree. Rules:  
  - Max 3 levels (top = original Q, leaves = 4-hour sub-Qs).  
  - Each leaf must be answerable by one analyst in ≤4h.  
  - For every parent node, add:  
    - One *critic question* (assigned to a different analyst): "Does this sub-answer fully address the parent?"  
    - One *cross-branch question*: "Does this branch conflict with sibling branches?"  
  **Sufficiency**: A tree diagram with:  
  - Clear parent-child logic (e.g., "Q1.1 and Q1.2 jointly answer Q1").  
  - 30% sub-questions tagged "verification" (critics/cross-checks).  
  - Stop if:  
    - >50% of leaves require subjective judgment (per team vote).  
    - Key terms (e.g., "safety," "harm") resist operationalization.  

  #### **Step 2: Sub-Question Execution**  
  **Activity**: Analysts work independently on leaves (4h each).  
  **Sufficiency for Leaf Answers**:  
  - Quantitative: Range/confidence intervals (e.g., "60% ±10%").  
  - Qualitative: Categorized options (e.g., "high/medium/low risk").  
  - Citations for key claims.  
  **Tests During Execution**:  
  - *Drift Test*: Analyst must restate parent question and justify fit.  
  - *Value Test*: If a value term (e.g., "ethical") appears, flag for Step 4.  

  #### **Step 3: Weighted Aggregation**  
  **Activity**: Assemble answers bottom-up. For each parent node:  
  - Two *independent aggregators* (not involved in children) propose answers.  
  - Inputs: Child answers + critic/cross-branch reports.  
  - Weighting:  
    - Child weight = (Analyst confidence × Critic score) / 100.  
    - Critic score (0–100%) from critic question: "How well does child answer parent?"  
    - Aggregators publish weights before seeing each other’s answers.  
  **Sufficiency**: Aggregated answer with:  
  - Disagreement score (0–100%) between aggregators.  
  - Weighted inputs (e.g., "Sub-answer A1 weighted 2× higher than A2 due to confidence").  
  - Stop if:  
    - Disagreement score > 30%.  
    - Cross-branch conflict found and irreconcilable.  

  #### **Step 4: Faithfulness & Consistency Check**  
  **Activity**: Post-aggregation team session (2h).  
  **Tests**:  
  - *Originality Test*: Compare top-level answer to Step 0 memo. Does it match intent?  
  - *Joint Consistency Audit*: Randomly sample 3 sub-answer pairs for logical conflicts.  
  - *Value Audit*: Scan all outputs for unflagged value-laden terms.  
  **Sufficiency**: A "faithfulness report" with:  
  - Original question vs. final answer alignment score (0–100%).  
  - Inconsistencies and unresolved conflicts.  
  - Hand-off to director if:  
    - Alignment score < 70%.  
    - Value residue found.  
    - Resource exhaustion.  

  #### **Step 5: Director Hand-off**  
  **Deliverables**:  
  - Final answer with confidence score.  
  - Faithfulness report.  
  - Resource log.  
  **Director Decisions**:  
  - Overrule if value conflict.  
  - Reject if faithfulness < 70%.  
  - Approve/revise otherwise.  

  ---

  ### Protocol Execution on Sample Questions  
  **Key**: ⚠️ = Judgment call disguised as procedure. ✋ = Hand-off to human. 💥 = Cannot be factored at budget.  

  #### **Question 1: Advise funder to pause grant to lab with unobservable safety culture?**  
  - **Step 0**:  
    - Ambiguities: "Safety culture" = unobservable → proxies needed.  
    - Values: "Risk tolerance" (director must decide acceptable risk threshold).  
    - Dependencies: Proxies (e.g., past incidents) may not predict future.  
    - Est. resources: 35h (> budget).  
    - **Verdict**: ✋ Hand-off to director (value residue: risk tolerance).  
    - ⚠️ Judgment: "20% value residue" threshold is arbitrary.  

  - **Step 1 (if forced)**:  
    - Tree:  
      - *Q1.1 (Leaf)*: What proxies indicate poor safety culture? (4h)  
      - *Q1.2 (Leaf)*: What harm probability if culture poor? (4h)  
      - *Critic for Q1.1/1.2*: Do these answer "should pause?" or just "is risk high?"  
      - *Q1.3 (Leaf)*: What cost if pause (e.g., lost research)? (4h)  
      - *Q1.4 (Leaf)*: Funders’ historical risk tolerance? (4h)  
    - **Stop**: 💥 Q1.4 requires mind-reading → unresolvable.  

  - **Steps 2–4**: Not run (Step 0 hand-off).  
  - **Outcome**: Director decides based on risk tolerance.  

  #### **Question 2: Probability specific legislation passes in 2 years?**  
  - **Step 0**:  
    - Ambiguities: "Passes" = signed into law? Includes amendments?  
    - Values: Minimal (pure forecasting).  
    - Dependencies: Sequential (Senate vote depends on House).  
    - Resources: 30h (< budget). Proceed.  

  - **Step 1**:  
    - Tree:  
      - *Q2.1 (Leaf)*: P(passes House | current session)? (4h)  
      - *Q2.2 (Leaf)*: P(passes Senate | passes House)? (4h)  
      - *Q2.3 (Leaf)*: P(president signs | passes both)? (4h)  
      - *Critic for Q2.1–2.3*: Does chain cover all veto points?  
      - *Q2.4 (Leaf)*: P(election shifts vote)? (4h)  
      - *Cross-branch*: Does Q2.4 conflict with Q2.1?  

  - **Step 2**:  
    - Q2.1: 65% ±15% (historical analogs).  
    - Q2.2: 50% ±20% (partisan divide).  
    - Critic Q2.1: "Ignores committee stage" → confidence -20%.  
    - ⚠️ Judgment: Confidence adjustment subjective.  

  - **Step 3**:  
    - Aggregators: P(passes) = Q2.1 × Q2.2 × Q2.3 = 65% × 50% × 90% = 29.25%.  
    - Weighting: Q2.1 downweighted 20% → final P = 24.5%.  
    - Disagreement: 5% (acceptable).  

  - **Step 4**:  
    - Originality: 85% (focused on mechanics, not "why").  
    - Consistency: Q2.4 (election risk) conflicts with Q2.1 stability → resolved by time-discounting.  
    - **Verdict**: Passes (24.5% ±10%).  

  #### **Question 3: Run experiment persuading people without telling them?**  
  - **Step 0**:  
    - Ambiguities: "Without telling" = deception?  
    - Values: Core ethics of consent.  
    - Dependencies: Effectiveness irrelevant if unethical.  
    - Resources: 28h (< budget).  
    - **Verdict**: Proceed, but flag ethics.  

  - **Step 1**:  
    - Tree:  
      - *Q3.1 (Leaf)*: Effectiveness of method? (4h)  
      - *Q3.2 (Leaf)*: Psychological harms? (4h)  
      - *Q3.3 (Leaf)*: Legal compliance? (4h)  
      - *Critic for Q3.1–3.3*: Do these answer "should" or just "can"?  
      - *Q3.4 (Leaf)*: Precedent in similar orgs? (4h)  

  - **Step 2**:  
    - Q3.1: High effectiveness (80% confidence).  
    - Q3.2: Low harm (60% confidence).  
    - Q3.3: Compliant (70% confidence).  
    - Critic: "Ignores autonomy violation" → values residue.  

  - **Step 3**:  
    - Aggregators: "Run it" (weighted 3.1 > 3.2), but low confidence.  
    - Disagreement: 40% (>30% stop condition).  

  - **Step 4**:  
    - Originality: 50% (answered "can we?" not "should we?").  
    - Value Audit: "Harm" in Q3.2 implied utilitarianism; autonomy not considered.  
    - **Verdict**: ✋ Hand-off to director (high value residue + low faithfulness).  

  ---

  ### Critical Limitations  
  **Judgment Calls Disguised as Procedure**:  
  - Step 0 "20% value residue" threshold.  
  - Step 3 confidence adjustments (critic scores).  
  - Step 4 "faithfulness alignment score."  

  **What the Protocol Cannot Do**:  
  - **Resolve moral disagreements**: Values are flagged, not solved.  
  - **Guarantee completeness**: Unforeseen dependencies may emerge post-hoc.  
  - **Eliminate summarizer bias**: Weighting mitigates but doesn’t remove dominance.  
  - **Handle hyper-interdependent questions**: e.g., "Should AI be regulated?" requires policy/tech/ethics—too tangled for clean factoring.  
  - **Beat resource limits**: 💥 marks budget failures explicitly.  

  **Final Output**: Director receives auditable trace: sub-answers, weights, and faithfulness gaps. This forces transparency where the protocol "fails" by design.
