  Next, comparing different lies: Huck's protective lies are the least grave sins, while the Duke and King's are more severe due to greed. Tom's deception is the worst because it involves cruelty without necessity. Augustine's ranking aligns with the reader's sympathy here, which is interesting—readers condemn Tom more than Huck, matching Augustine's gravity scale.

