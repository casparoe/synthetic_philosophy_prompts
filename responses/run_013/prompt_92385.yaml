answer: |-
  Here is a specification of desiderata for a theory of the thermodynamic arrow, structured as requested:

  **I. Phenomena to be Explained**
      *   **Entropy Gradient:** Systematic increase from past to future (Low -> High Entropy). *Primary phenomenon; core explanandum.*
      *   **Asymmetry of Records/Memory/Traces:** Reliable indicators exist only for the past, not the future. *Downstream consequence of entropy gradient & cosmological boundary conditions.*
      *   **Asymmetry of Agency/Deliberation:** We act to influence the future, not the past; interventions are forward-directed. *Downstream consequence of entropy gradient, records, and the nature of physical control.*
      *   **Asymmetry of Explanation/Prediction:** We explain the past (via causes) and predict the future (via laws). *Downstream consequence of records, agency, and the entropy gradient.*
      *   **Radiative Asymmetry:** Predominance of retarded radiation (outgoing waves) over advanced radiation (incoming waves converging). *Separate item; closely linked to thermodynamic arrow but not trivially reducible to entropy gradient alone. Requires specific account.*
      *   **Alignment of Arrows:** The consistency in direction (past-to-future) of all the above asymmetries. *Primary phenomenon; core explanandum requiring a unified account.*

  **II. Distinctions That Must Not Be Collapsed**
      *   **Laws vs. Boundary Conditions:** Why the asymmetry exists (laws) vs. the specific *direction* it takes (boundary conditions). *Genuine demand.*
      *   **Existence vs. Direction of Arrow:** Explaining *why* there is an asymmetry is distinct from explaining *why* it points one way. *Genuine demand (linked to above).*
      *   **Fine-Grained vs. Coarse-Grained Entropy:** Microstate entropy (constant under reversible dynamics) vs. macrostate entropy (increases due to coarse-graining). *Genuine demand; foundation of statistical mechanics.*
      *   **Past Hypothesis (PH) as Law vs. Posit:** Is the low-entropy past boundary condition a fundamental law or a contingent initial condition? *Camp commitment (e.g., Loewer's "Mentaculus" treats it as nomological).*
      *   **Thermodynamic vs. Causal/Epistemic Arrows:** The physical entropy gradient vs. derived notions of cause/effect or knowledge acquisition. *Genuine demand; theory should ground the latter in the former without conflating them.*
      *   **Objective Feature vs. Ignorance:** Is the arrow a fundamental feature of the world, or merely a reflection of our incomplete knowledge? *Camp commitment; most modern accounts reject pure ignorance-based views (e.g., Boltzmann's early view) as inadequate.*

  **III. Results It Must Not Contradict**
      *   **Time-Reversal Invariance (TRI):** Of fundamental microdynamics (classical mechanics, QM with CPT symmetry). *Non-negotiable.*
      *   **Measure Preservation (Liouville's Theorem, Poincaré Recurrence):** Ensures reversibility objections (Loschmidt) and recurrence objections (Zermelo) must be addressed. *Non-negotiable.*
      *   **Observed Low-Entropy Past:** The initial macrostate of the observable universe had very low entropy. *Non-negotiable empirical fact.*

  **IV. Test Cases It Must Adjudicate**
      *   **Two-End Low-Entropy Cosmology (e.g., "Phoenix Universe"):**
          *   *Requirement:* The theory must specify the behavior of arrows. Does it predict:
              *   One global arrow (e.g., defined by increasing entropy phase)?
              *   Two arrows (pointing away from the middle towards both low-entropy ends)?
              *   No consistent arrow?
          *   *Requirement:* At the maximum entropy "middle": What is the status of records (would they show conflicting pasts?)? Could agents exist, and if so, how would they experience time/deliberation? The theory must provide a consistent, non-contradictory account.
      *   **Controlled Entropy Decrease (e.g., Spin Echo, Maxwell's Demon):**
          *   *Requirement:* The theory must clearly distinguish this local, controlled, *apparent* entropy decrease (driven by external intervention/correlation manipulation) from a genuine *reversal* of the thermodynamic arrow of time in that region.
          *   *Requirement:* This distinction must arise naturally from the theory's core principles (e.g., boundary conditions, cosmological context, definition of macrostates), not be a mere definitional stipulation.

  **V. Evaluation of Requirements**

  1.  **Non-Negotiables:** Consistency with TRI, measure preservation, the observed low-entropy past, the existence and alignment of the core arrows (Entropy Gradient, Radiative Asymmetry, Alignment), and maintaining the distinctions between Laws/Boundary Conditions, Existence/Direction of Arrow, and Fine/Coarse-Grained entropy. Addressing the test cases non-trivially is also non-negotiable.
  2.  **Camp Commitments/Preferences:** The ontological status of the Past Hypothesis (Law vs. Posit), the interpretation of the arrow (Objective Feature vs. Ignorance - though pure ignorance views are largely excluded), and arguably the precise relationship between the thermodynamic arrow and causal/epistemic arrows (though grounding the latter is demanded).
  3.  **Tensions & Incompatibilities:**
      *   The combination of **TRI + Measure Preservation + Requirement for a Global Objective Arrow + Low-Entropy Past** creates a profound tension. Satisfying all *without* introducing a time-asymmetric element (like the PH) is extremely difficult. Pure fluctuation theories struggle here.
      *   **Radiative Asymmetry** is particularly hard to derive solely from a generic low-entropy past boundary condition without additional assumptions about cosmological structure or initial radiation fields.
      *   Demanding that **Agency/Records/Prediction-Explanation** are *downstream consequences* (rather than fundamental) conflicts with views seeking to ground the arrow directly in consciousness or information processing.
  4.  **Most Excluding Requirement:** **Requiring a substantive account of the Radiative Asymmetry** excludes the largest number of otherwise popular accounts. Many "PH-only" accounts handwave this or rely on additional contingent assumptions about initial conditions regarding radiation. Pure coarse-graining/ignorance views and most fluctuation theories lack the resources to explain it.

  **VI. Brief Assessment of Major Accounts**

  *   **Fluctuation Account (Boltzmann-Style):** *Fares poorly.* Struggles with non-negotiables: fails to explain the *cosmological scale* and *persistence* of the low-entropy past, fails to explain the alignment of arrows globally, fails to adequately address recurrence/reversibility objections, fails radically on the Two-End cosmology test (predicts arrows pointing in both directions inconsistently), and cannot explain radiative asymmetry. Effectively excluded.
  *   **Low-Entropy-Boundary-Condition (Past Hypothesis - PH):** *Fares best overall.* Meets non-negotiables: uses TRI dynamics, explains entropy gradient via PH + statistical mechanics, grounds records/agency as downstream, can address test cases (e.g., Two-End: defines local arrows pointing away from high-entropy middle). Major challenge is satisfactorily explaining Radiative Asymmetry without additional assumptions and clarifying the status of the PH (camp commitment tension).
  *   **Added-Time-Asymmetric-Law (e.g., Prigogine, GRW Collapse):** *Fares variably.* Directly violates TRI (contradicts non-negotiable) unless carefully formulated (e.g., only in the thermodynamic limit). Explains entropy increase and potentially radiative asymmetry fundamentally. Struggles with alignment (why should new law align with PH?), often struggles to ground records/agency as cleanly downstream, and the Two-End test case becomes complex. Faces strong Occam's Razor objections and empirical constraints (no evidence for fundamental micro-T-violation beyond weak interactions).
