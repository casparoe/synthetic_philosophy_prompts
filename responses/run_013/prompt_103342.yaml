prompt: |-
  I'm a backend engineer at a small forecasting outfit and have no formal philosophy training, so I'm hoping you can do a consistency audit of a methodology I've been defending to my team before I put it in a memo. Here is the package I've been arguing for. (1) For any slow-moving question about the fate of a nation or empire — does this great power still exist in twenty years, does this regime fall this decade — the correct starting point is the outside view: assemble a reference class of comparable past cases and anchor on the base rate before doing any case-specific reasoning. (2) The inside view, i.e. detailed causal storytelling about the particular case, should only nudge that anchor, and only when I have information that is genuinely new relative to the reference class. (3) I treat it as settled that the outside view is the main reason good forecasters beat pundits, so it should be the default and the inside view the exception. (4) I also think that deciding which cases belong in a reference class is an irreducibly judgment-laden act: two reasonable analysts can draw the class differently and there is no fact of the matter about which class is correct. (5) I think the present is unusual enough in certain respects that for some trends the historical base rate is simply the wrong tool, and there the inside view is all we have. (6) For empires specifically, I think a long prior lifespan should make me expect the end sooner rather than later, because age does not seem to buy much extra time in the historical record. (7) More generally I'm a fan of the Lindy effect: the longer something has already lasted, the longer I expect it to keep lasting.

  Please go through these and tell me which pairs are genuinely in tension, which only look like they are, and how severe each real tension is, ordered from worst to mildest. For each real tension, say what the cheapest repair would be and what I would lose by making it. Don't just list everything as equally problematic — I want you to discriminate. Keep the whole answer under 600 words, and lead with the single most serious problem in one sentence before the audit.
reasoning: |-
  Hmm, the user is a backend engineer at a forecasting company who wants me to audit their methodology for consistency. They've outlined a package of principles about using outside views and inside views for forecasting slow-moving questions about nations and empires.

  Looking at their principles, I need to identify tensions between them. The most severe conflict is between principle #6 and #7. They say for empires, a long prior lifespan should make them expect the end sooner rather than later, but then in #7 they're a fan of the Lindy effect which says the longer something has lasted, the longer it should be expected to last. These are completely contradictory - one says old things die faster, the other says old things last longer. This is a fundamental inconsistency.

  There's also tension between #4 and #5. They say reference class selection is judgment-laden with no right answer (#4), but then in #5 they claim the present is unusual enough that the base rate is "simply the wrong tool." If reference classes are subjective, how can they objectively declare the base rate wrong? This undermines their framework.

  I see another issue between #3 and #5. They emphasize the outside view as the main reason forecasters beat pundits (#3), but then in #5 they say for some trends the historical base rate is the wrong tool. This creates friction about when to abandon their core method.

  The tension between #1 and #5 is milder. The outside view is the starting point (#1), but they recognize exceptions exist (#5). This is manageable if they clearly define when exceptions apply.

  I need to provide the cheapest repairs for each tension. For the #6/#7 conflict, I'll suggest they drop #6 since it contradicts both Lindy and historical evidence. For #4/#5, they should soften #5 to say base rates may be less reliable rather than "wrong." For #3/#5, they should explicitly state that abandoning the outside view requires extraordinary evidence.

  I'll organize my response starting with the most severe issue first, then move to the others in descending order of severity. I'll keep it under 600 words as requested and provide clear, practical fixes they can implement in their memo.
answer: |-
  Here is your consistency audit, ordered by severity of tension:

  **Most Severe Tension: (6) & (7) Directly Contradict Each Other**
  *   **(6)**: Long prior lifespan → expect end *sooner*.
  *   **(7) Lindy Effect**: Long prior lifespan → expect end *later*.
      *   **Severity:** Fatal. These are mutually exclusive predictions for the *same* empirical observation (longevity).
      *   **Cheapest Repair:** **Drop (6).** Historical evidence for empires overwhelmingly supports Lindy-like persistence (Rome, Byzantium, China dynasties, Ottoman longevity). (6) feels like a "mean reversion" intuition unsupported by actual imperial lifespans. You lose a specific, counter-intuitive heuristic for empires, but gain consistency with your broader Lindy principle.

  **Significant Tension: (4) & (5) Undermine the Framework**
  *   **(4)**: Reference class selection is irreducibly judgment-laden; no "correct" class.
  *   **(5)**: The present is "unusual enough" that the base rate is "simply the wrong tool".
      *   **Severity:** High. (5) implicitly claims an *objective* basis ("unusual enough", "simply wrong") for overriding the outside view, contradicting (4)'s claim that reference class validity is fundamentally subjective and contested. How do you *know* the present is objectively unusual *for this specific question* if the reference class itself is a judgment call?
      *   **Cheapest Repair:** **Reformulate (5).** Instead of claiming the base rate is "wrong", state: "For *some* trends, *plausible* reference classes yield base rates with such high variance, are so sparse, or seem so poorly matched to specific *novel* aspects of the present case, that the outside view anchor provides little constraint, forcing greater reliance on the inside view." You lose the strong rhetorical claim of objective "wrongness" but gain consistency with the inherent subjectivity of reference classes.

  **Moderate Tension: (3) & (5) - Core Methodology vs. Exception**
  *   **(3)**: Outside view is the *main reason* for success; default method.
  *   **(5)**: For some trends, the base rate is invalid ("simply the wrong tool").
      *   **Severity:** Moderate. (5) carves out exceptions, but the strong language ("simply the wrong tool") combined with the primacy given to the outside view in (3) creates friction. How frequent/pervasive are these exceptions? Does abandoning the core method so readily undermine (3)?
      *   **Cheapest Repair:** **Clarify Scope & Threshold for (5).** Explicitly state that invoking (5) requires demonstrating *specific, unprecedented mechanisms* absent from the historical record *and* critically relevant to the forecast, not just general "unusualness". Treat it as a high bar. You lose the ease of dismissing the outside view for broad "unusualness" but strengthen the primacy of (3).

  **Mild Tension: (1) & (5) - Starting Point vs. Exception**
  *   **(1)**: Outside view is the *correct starting point*.
  *   **(5)**: For some trends, base rate is invalid.
      *   **Severity:** Mild. This is manageable. (1) mandates *starting* with the outside view. (5) says that *after* starting (i.e., attempting to build a reference class), you might conclude it's unusable *for this specific case*. The tension is procedural: How much effort constitutes a valid "start" before invoking (5)?
      *   **Cheapest Repair:** **Implicit in (1).** (1) says "starting point", not "always used". Simply ensure your process *always* attempts a reference class construction first before considering (5). No loss, just clarification.
