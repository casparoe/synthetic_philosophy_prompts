  I need to address several layers: 1) The direct tension between texts 2) Why this hypothesis beats "proper place" interpretations 3) What residual problems remain 4) The key conceptual distinction 5) What would make this fatal to Aristotle. The five-point format forces concision - each point must carry maximum philosophical weight.

  For the tension (Point 1), I'll highlight the Ethics' positive framing of money enabling justice versus Politics' condemnation of money-begetting-money. The reconciliation (Point 2) must show how measure/pursuit separation avoids the deflationary view's weakness - specifically how it explains why money-seeking becomes unnatural rather than just excessive. 

  The residue (Point 3) is tricky - if money is purely conventional in Ethics, what grounds "natural" criticism in Politics? I'll note how household needs provide Aristotle's natural baseline. The key distinction (Point 4) is clearly measure-vs-object. For fatality (Point 5), the concern would be if Aristotle's natural/conventional framework itself collapses - if household needs can't anchor "natural" limits.

