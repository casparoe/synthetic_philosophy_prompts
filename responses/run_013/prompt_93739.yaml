answer: |-
  1.  The tension lies in the Ethics presenting money as a necessary conventional condition for establishing justice (equality) in reciprocal exchange, while the Politics condemns the pursuit of money, especially through interest, as fundamentally unnatural and limitless, perverting money's purpose.
  2.  The reconciliation succeeds by distinguishing money's bounded *function as a measure* of need enabling just exchange (Ethics) from its unbounded *role as an object* of acquisition divorced from fulfilling need (Politics); this beats the deflationary view by explaining *why* pursuit beyond need is unnatural (violates money's function) rather than merely misplaced.
  3.  The strongest residue is the Ethics' grounding of money solely in convention and agreement for establishing commensurability, which seems to leave no inherent basis within *that account* to call *any* use "unnatural" since all uses rely on convention.
  4.  The single distinction doing the most work is separating money's *instrumental role* as a measure facilitating equal exchange based on need from its *misappropriation* as a primary goal of acquisition detached from need.
  5.  The tension would be fatal only if Aristotle's concept of the natural household economy and its inherent needs, central to the Politics' critique, were shown to be *equally conventional* as money itself, collapsing the normative foundation for calling pursuits "unnatural".
