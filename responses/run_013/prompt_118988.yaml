prompt: |-
  My older brother has no training in philosophy, but he has spent years reading and arguing his way into a view about how much morality can ask of a person, and he holds to it more consistently than anyone I know. I have never been able to decide whether his position has a principle at its center or only a cluster of habits, and I would like your help in predicting what he will say about a decision our family now faces.

  His verdicts, as well as I can state them:

  - A child drowning in a shallow pond on his walk to work: he is required to wade in, at the cost of his shoes, his phone, and his morning.
  - Skipping his daily coffee, when the same few dollars sent to a good charity would do far more good than the coffee does: not required.
  - Giving away about a tenth of his income: required. Giving away half of it, though he agrees it would do more good than anything else he does with the money: not required.
  - Donating a kidney to a stranger: not required, though he calls it admirable.
  - Paying for his daughter's piano lessons rather than sending the money where it would save lives: permitted.
  - Taking a better-paid job he would find pointless, in order to donate the difference: not required.
  - Giving a hundred dollars to a local clinic's fundraising drive, when several hundred other people could each cover the gap and the drive will very likely succeed without him: not required.
  - He once tried to hold himself to a far stricter standard for a year, and reports that he became miserable, distracted, and worse at his work and worse at home; he now says that a rule he cannot live under is not a rule for him.
  - And he has said that he would press a button that made him permanently and noticeably poorer in exchange for ten strangers' lives, but that he does not think he is bound by anything that has to be renewed every single day, even where the daily cost is smaller.

  What is coming: our neighbors' father, whom my brother knows by name and sees at the school gates, will die within the year without a treatment costing about forty thousand dollars. The family cannot pay, no fundraising campaign will come close, and my brother and his wife are the only people in a position to cover it. The money is the whole of what they have saved for a house down payment; paying it would postpone the house by roughly three years and would, I think, put real strain on the marriage. Not paying means the man dies.

  What I want from you is not your own verdict. I want a prediction of his, the rules his earlier judgments are consistent with — I expect there is more than one that fits them all — what each of those rules predicts here, which one you would bet on and on what grounds, and which single further case would best separate the rules that remain standing. If his record genuinely leaves the question open, I would rather know that than have you pick for him.
reasoning: |-
  Okay, I need to help predict what this user's brother would decide about funding their neighbor's life-saving treatment. The brother has a nuanced approach to moral demands, balancing altruism with personal limits. 

  First, I'll map out all his existing positions to identify patterns. The drowning child case shows he accepts significant immediate costs to save lives, but there are clear limits: coffee skipping isn't required, nor is donating half his income or a kidney. Interesting how he distinguishes between one-time acts (like the pond rescue) and ongoing sacrifices (like daily donations). 

  His rejection of the "stricter standard" experiment reveals a key principle: sustainability matters. If a moral rule destroys his capacity to function, it's invalid for him. This isn't selfishness - he'd permanently impoverish himself to save ten strangers, but balks at daily micro-decisions. The temporal aspect seems crucial here.

  Now for the neighbor's case: it's a single $40k intervention for someone he knows personally, but it wipes out savings and risks marital strain. Comparing to his other stances: 
  - Like the drowning child, it's lifesaving and non-recurring 
  - Unlike regular charity, it's targeted and unavoidable (only he can help) 
  - But the cost is vastly higher than muddy shoes, approaching kidney-donation-level sacrifice 

  The marriage risk factor is new. His piano lessons decision shows family commitments outweigh abstract lifesaving, so marital harmony might similarly override. Yet the personal connection to the neighbor complicates things - this isn't an anonymous stranger.

  I see three plausible frameworks for his thinking:
  1) Moderate deontology: Core duties to family first, then scaled obligations to others
  2) Rule utilitarianism: Rules must be sustainable long-term
  3) Threshold satisficing: Meet "decent" standards without maximizing

  The neighbor case sits at their intersection. I'd bet on rule utilitarianism winning out - he'll likely pay, seeing it as a rare, non-repeatable duty. But to test this, I'd ask how he'd decide if the cost was his daughter's college fund instead of house savings. That would clarify his family-altruism tradeoff hierarchy.
answer: |-
  Based on your brother's consistent pattern of judgments, I'll synthesize the underlying principles, predict his likely verdict on the neighbor case, identify competing rules that fit his history, suggest a decisive test case, and assess whether his position is genuinely open here.

  ### Core Principles Consistent with His Judgments
  1.  **Sustainability Threshold:** A moral demand must be sustainable without causing significant, persistent harm to one's core well-being, relationships, or ability to function effectively ("a rule he cannot live under is not a rule for him," rejecting the stricter standard).
  2.  **Significant Sacrifice for Imminent Life-Threatening Need (Direct/Unavoidable):** One must bear significant *one-time* costs (e.g., ruined clothes, lost time) to prevent imminent death when directly confronted and uniquely positioned to act (drowning child). *However:*
      *   This doesn't extend to organ donation (non-imminent, higher personal cost/risk).
      *   It requires direct confrontation/unavoidability (contrast with the clinic drive).
  3.  **Moderate Required Giving:** There's a required baseline level of giving (e.g., 10% income), but maximizing good (e.g., giving 50%) is supererogatory (admirable but not obligatory).
  4.  **Strong Familial Priority:** Significant resources *can* and often *should* be directed towards family needs/well-being (piano lessons) even when those resources *could* save more lives abstractly. Family well-being is a primary moral sphere.
  5.  **Rejection of Marginal Participation & Compelled Maximization:** One isn't required to:
      *   Contribute when others could easily cover the need (clinic drive).
      *   Maximize good by taking a worse job solely for more giving.
      *   Make small, recurring sacrifices that feel like constant "renewal" (daily coffee skip), even if cumulatively significant, *if* they undermine sustainability.
  6.  **Acceptance of Significant One-Time Cost for Strangers (Hypothetical):** A permanent, significant loss of wealth *is* acceptable to save multiple lives (button press), framing it as a single, decisive act rather than a recurring burden.

  ### Prediction for the Neighbor Case
  **Your brother will likely judge that paying the $40,000 is *required*.**

  **Reasoning:**

  1.  **Fits "Significant Sacrifice for Imminent Life-Threatening Need (Direct/Unavoidable)":** This mirrors the drowning child case in key aspects:
      *   **Imminent, Specific Death:** A known individual faces a concrete, near-term death.
      *   **Unavoidable & Unique Position:** He is uniquely positioned (only one who can help) and directly confronted (knows the neighbor, sees him regularly). There is no diffusion of responsibility or reliance on others.
      *   **One-Time Cost:** While large, it's a single financial sacrifice, not a recurring daily burden requiring constant "renewal" (which he rejects). It's analogous to the "button press" scenario in its decisiveness.
      *   **Cost is Significant but Bearable:** While $40k is huge, it costs 3 years delay on a house and marital strain, *not* his health (like a kidney), his core family's immediate well-being (daughter's lessons still possible?), or his ability to function sustainably long-term (like the failed stricter standard). Postponing a house is a major sacrifice, but likely falls below his sustainability threshold *if* the marriage strain is manageable (a key uncertainty).
  2.  **Overcomes "Rejection of Marginal Participation":** This is the *opposite* of the clinic drive. He's not one of many; he's the *only* solution.
  3.  **Contrasts with Permitted Familial Priority:** Paying *would* impact his family (house delay, marital strain). However:
      *   **Severity:** Preventing a neighbor's death likely outweighs a 3-year house delay (a serious but non-existential cost for his family) in his hierarchy.
      *   **Directness:** The neighbor is known personally, strengthening the direct duty felt in the drowning case.
      *   **Not "Instead of Family":** He's not choosing the neighbor *over* his daughter's needs (like piano lessons). He's choosing the neighbor *over* accelerating a major family asset acquisition. His "familial priority" principle protects core well-being and development, not necessarily optimal asset accumulation timelines.
  4.  **Fits Moderate Giving Baseline, But...:** $40k likely far exceeds his 10% annual giving. However, this principle seems secondary to the direct, unavoidable, life-saving imperative in this unique scenario. It's an extraordinary demand overriding the baseline rule, justified by the directness and unavoidability.

  **Key Uncertainty - The Marriage Strain:** This is the strongest argument *against* requirement. If he judges that the strain poses a *genuine, high risk* to the *sustainability* of his core family unit (a primary moral sphere for him), he *might* deem it not required. However, given his other judgments (especially the drowning child and hypothetical button press), the likely default is that he sees preventing the neighbor's death as a paramount, unavoidable duty, and that the marital strain, while serious, is a cost to be managed *within* his sustainability threshold, not an absolute barrier. He would likely feel the moral burden heavily falls on paying.

  ### Competing Rules/Principles Consistent with His History
  1.  **Rule A (Strong Sustainability/Family Core):** "One must prevent imminent death if the cost is significant but *does not threaten one's own core well-being, primary relationships (especially marriage), or long-term ability to function and meet core obligations to family.*" **Prediction for Neighbor:** *Not Required*. $40k loss + significant marital strain crosses the threshold into threatening core family stability/sustainability.
  2.  **Rule B (Moderate Deontology w/ Thresholds):** "Core duties: (1) Ensure family well-being/development, (2) Meet a moderate baseline of giving, (3) Prevent imminent death when directly confronted & uniquely positioned, if the cost is below a high threshold of self-harm (excluding family harm)." **Prediction for Neighbor:** *Required* (as argued above). Family well-being isn't *directly* threatened (house delayed, not lost; lessons presumably continue), while the duty to prevent death is triggered directly.
  3.  **Rule C (Satisficing Altruism w/ Agent-Centered Prerogatives):** "One must do a 'decent share' (10%) and respond to direct, catastrophic emergencies with significant but not maximally burdensome sacrifices. One has strong prerogatives to prioritize personal projects, family, and avoid excessive sacrifice that undermines one's life." **Prediction for Neighbor:** *Ambiguous/Leans Required*. The direct emergency and uniqueness push towards requirement, but the massive cost ($40k vs muddy shoes) and family impact push against it. This rule fits his pattern but provides less clear guidance here.

  ### Which Rule to Bet On & Why
  *   **Bet on Rule B (Moderate Deontology w/ Thresholds).**
  *   **Grounds:**
      *   It best explains the *strength* of the drowning child obligation (direct, imminent death, unavoidable) compared to the *weakness* of the coffee obligation (diffuse, recurring, small).
      *   It cleanly accommodates the rejection of kidney donation (exceeds bodily integrity/high harm threshold) and the clinic drive (not unavoidable/diffuse).
      *   It justifies the 10% baseline as a core duty while acknowledging giving half is beyond requirement (moderation).
      *   It incorporates familial priority (piano lessons) as a core duty.
      *   It explains the failed stricter standard (violated sustainability) and the acceptance of the button press (one-time, decisive act below a catastrophic harm threshold).
      *   Rule A struggles with the drowning child (ruined clothes/morning *could* be seen as impacting well-being, but he deems it required) and the button press (permanent impoverishment *clearly* impacts well-being, yet he accepts it). Rule C is less precise and struggles with the stark "required/not required" nature of many of his judgments (e.g., drowning child vs. coffee).

  ### The Single Best Further Case to Separate Rules A & B
  **Scenario: A close friend (not family) will lose their home and become destitute (but not die imminently) unless your brother gives them $15,000. This is money earmarked for his daughter's upcoming university tuition deposit. Paying would mean his daughter cannot attend her first-choice university this year (a significant setback to her plans and aspirations, though she has a good safety option).**

  *   **Why this case?**
      *   It probes the **"core family well-being" vs. "preventing severe harm to non-family"** boundary directly.
      *   It involves a **significant, one-time financial cost** impacting a **core familial obligation/opportunity** (daughter's education), similar in kind but different in severity to the house down-payment.
      *   The harm prevented (destitution) is **severe but not immediately life-threatening**, differentiating it from the neighbor case.
      *   It tests the **weight given to educational opportunity** within "familial priority" compared to preventing catastrophic financial ruin for a close friend.
  *   **Predictions under Rules:**
      *   **Rule A (Strong Sustainability/Family Core):** *Not Required*. Protecting daughter's core educational path is paramount. Friend's destitution, while terrible, does not trigger the same level of direct, life-saving obligation as the neighbor. The cost directly threatens a core family interest.
      *   **Rule B (Moderate Deontology w/ Thresholds):** *Likely Not Required*. Preventing destitution for a friend, while important, is unlikely to rise to the level of the "prevent imminent death" duty. The cost directly impacts a core developmental opportunity for his daughter, falling squarely under his primary familial duty. This is closer to the piano lessons case (prioritizing family development over abstract lifesaving) than the drowning child/neighbor case.
      *   **Rule C:** Likely *Not Required*, based on strong agent-centered prerogative to prioritize daughter's significant opportunity.

  Your brother's verdict here would strongly differentiate Rule A (which might see *any* major threat to core family plans as prohibitive) from Rule B (which distinguishes severity and type of harm prevented, likely placing daughter's university opportunity above preventing friend's destitution). If he deemed it *required*, it would significantly weaken Rule B and suggest a stronger, broader duty to prevent severe harm to close non-family.

  ### Is the Neighbor Case Genuinely Open?
  Based solely on his past judgments, **it is not perfectly determinate, but there is a strong leaning towards "required".** The biggest opening comes from the **marital strain**. If he interprets this as a *fundamental threat to the sustainability of his marriage* (his core family unit), aligning with his deepest principle ("a rule he cannot live under..."), he *could* justify "not required". However, given the weight he places on direct, unavoidable life-saving (drowning child, button press), and the fact that the cost, while severe, is financial and temporal rather than physical or a direct denial of family needs (like piano lessons), the prediction leans heavily towards him feeling morally bound to pay.

  **In summary:** Bet on him saying paying for the neighbor's treatment is **required**. The core principles point that way, with marital strain being the primary potential counterweight. The "close friend destitution vs. daughter's university" case would best clarify how he balances severe harm to non-family against core family opportunities.
