prompt: |-
  I'm about a year into a philosophy MA and I have to pitch a thesis topic in three weeks, and separately I'm one of three people deciding how to spend about $40k that our student EA group raised for conceptual work -- philosophy and theory, explicitly not empirical studies. Those are really the same question for me: out of everything in the neighbourhood of consequentialist cluelessness, what actually deserves the attention? So give me a prioritised agenda rather than a tour of the debate. Which open questions here matter most, and why? I want the dependency structure -- which questions other questions are waiting on, which are upstream of which -- plus what makes each one worth years of someone's time (importance, tractability for a philosopher rather than a modeller, how neglected it is, how many other things hinge on it), and I want you to say explicitly which ones I should NOT work on even though they look central. Rank four or five. Then tell me where the $40k should go if I get outvoted: is there any line of work in this area where a small pot of money actually changes the output (a workshop, a prize for an essay, paying someone to write one careful paper), versus where it's just money thrown at a problem that's bottlenecked on one person thinking hard for a year?

  Some context on where I'm stuck, so you don't hand me the standard moves. I know the basic shape of the problem -- we can't trace the long-run effects of our actions, butterfly effects and all that, so a theory that tells us to maximise expected value over total consequences seems to demand something we can't do -- and I know the usual replies: restrict the domain, satisfice, go rule-consequentialist, or shrug and pick a decision procedure anyway. What I care about is the layer below that. Two things I keep chewing on. (a) I think there's a real difference between a version of the problem where the facts are out there and we just can't compute them -- long causal chains, chaos, computational limits -- and a version where even a god with the complete physical history wouldn't know what to say, because the thing we're trying to evaluate doesn't have a determinate value: population ethics at astronomical scale, infinite value, or the thought that the consequence of an action is partly a matter of how you individuate it. I dont know whether that split is doing real work or whether the second half just collapses into the first. (b) I've been wondering whether moral decision-making here looks like the misspecified-model / bias-variance problem in stats: maybe the right move is to deliberately coarse-grain, work with a small number of robustly-estimable features of the world, and accept that you're ignoring huge swaths of the real effect distribution. Regularisation as a moral methodology. Is that a research programme, or a confusion with a nice analogy attached?

  Also, if it turns out the honest answer is that this whole area is a dead end and the interesting work has moved somewhere else, say so and defend it -- don't manufacture a ranking to be agreeable. Throughout, tell me how confident you are in what you're claiming, and at the end single out the one point in your whole answer you're least sure about.
