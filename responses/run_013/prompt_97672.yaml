          - Alternatively, we can make the fee 1 token and hope that the student's valuation difference is at least 1 token. But then the drain is only 3 tokens, which might be small relative to the lottery outcomes (which are around 10). But it's still a drain.

          - We'll go with 5 tokens per trade to be safe.

     Broker's schedule per student (three rounds):

          Round 1:
            If holding X: offer exchange: X + 5 tokens for Z.
            If holding Z: offer exchange: Z + 5 tokens for Y.
            If holding Y: offer exchange: Y + 5 tokens for X.

          Round 2: same.
          Round 3: same.

     Timeline:

          Part 1: Representational Failure (30 min)

            - (5 min) Introduce the three lotteries (X, Y, Z) and their payouts. Explain that they are to rank them from best to worst.

            - (10 min) Students rank the lotteries.

            - (10 min) Assign u(0)=0. Then assign u(11) and u(21). Then compute EU for each lottery. Check if the ranking matches.

            - (5 min) Quick show of hands: who could not find utilities to match their ranking?

          Part 2: Pragmatic Failure (40 min)

            - (5 min) Explain the rules of the trading game: 
                  * Start with 100 tokens and one lottery ticket (X, Y, or Z).
                  * The lottery ticket will be resolved at the end: it will pay out tokens (X: 11 for sure; Y: 10 with 90%, 21 with 10%; Z: 0 with 90%, 21 with 10%).
                  * We will add the tokens you hold at the end to the lottery payout to get your total tokens.
                  * Total tokens determine your chance to win a $20 gift card.
                  * A broker will come around and offer you trades. You may accept or reject.
                  * The broker will make three rounds. In each round, the broker will offer one trade to you based on what lottery you currently hold.

            - (25 min) Run the trading game:

                  Assign lotteries randomly (5 X, 5 Y, 4 Z).

                  The broker (a student) has a schedule. The broker goes to each student in turn and offers the appropriate trade for that student's current lottery.

                  The student accepts or rejects. If accepted, the broker takes the lottery ticket and the tokens and gives the new lottery ticket. The broker records the trade.

                  The broker completes one round (all 14 students). Then does a second round. Then a third round.

            - (5 min) Collect final lottery tickets and token counts. Resolve the lottery tickets (use a random number generator for each student with a lottery that isn't sure). Compute total tokens for each student.

            - (5 min) Tell students that we will use these totals to assign lottery tickets for the gift card at the very end of class.

          Debrief (20 min)

            - Ask: "How many of you ended up with the same lottery you started with?" 
            - "How many of you paid tokens to make trades that brought you back to the same lottery?"
            - Explain that if you have cyclic preferences, you might have paid to go around the cycle.

            - Then discuss:
                  Representational argument: we saw that some preference orderings cannot be represented by expected utility. They are incoherent in the sense of representation.
                  Pragmatic argument: we saw that such incoherence can be exploited by a broker who offers a sequence of trades.

            - But note: the trades are only exploitative if you take them one at a time without seeing the whole sequence. If you had known the broker would offer the whole cycle, you would have refused.

            - Also, the activity could not test completeness because we only offered three lotteries. In reality, we must be able to compare any two lotteries.

            - Finally, the pragmatic argument does not show that incoherence is irrational, only that it is costly in this particular setup.

     Materials:

          For Part 1:
            - Handout with the three lotteries:
                  X: 11 tokens for sure.
                  Y: 90% chance of 10 tokens, 10% chance of 21 tokens.
                  Z: 90% chance of 0 tokens, 10% chance of 21 tokens.

            - Ranking sheet.

          For Part 2:
            - Slips of paper for the lotteries: 5 labeled "X", 5 "Y", 4 "Z".
            - Each student needs a way to record token changes. We can give them a token ledger or the broker can record.
            - Broker's schedule: a sheet that says:

                  Round 1:
                    For a student holding X: offer to exchange their X and 5 tokens for a Z.
                    For a student holding Z: offer to exchange their Z and 5 tokens for a Y.
                    For a student holding Y: offer to exchange their Y and 5 tokens for an X.

                  (Same for rounds 2 and 3)

            - Random number generator for resolving lotteries (e.g., a 10-sided die, or a computer).

     What will go wrong:

          - The fee might be set too high so that no one accepts any trade. Then we don't get the drain.

          - We can mitigate by setting the fee low (5 tokens) and hope that the valuation differences are at least 5 tokens.

          - Alternatively, we can tell the broker to be flexible and lower the fee if the student hesitates? But that might introduce bias.

          - We might run out of time in the trading game.

          - The students might not understand the trading rules.

     We'll try to keep it simple.

     The feature that cannot be reproduced: completeness. We only have three lotteries. We cannot test whether the student has a complete ordering over all possible lotteries. We'll have to mention that in the debrief.

     Let's do it.
answer: |-
  Below is a comprehensive design for your 90-minute seminar, structured to keep the representational and pragmatic arguments distinct. The activity uses three lotteries to induce a **violation of transitivity** (a simple form of incoherence), making both arguments tangible. The debrief clarifies the differences between the arguments and their limitations.

  ---

  ### **Materials**
  #### **Lotteries (for both parts)**
  Use three lotteries with token outcomes (tokens convert to gift card entries):
  - **X**: 11 tokens for sure.  
  - **Y**: 90% chance of 10 tokens, 10% chance of 21 tokens.  
  - **Z**: 90% chance of 0 tokens, 10% chance of 21 tokens.  

  **Why these?**  
  They often induce cyclic preferences (X > Y, Y > Z, Z > X) due to shifting risk attitudes, violating transitivity—a minimal coherence requirement for expected utility (EU). The cycle is easy to exploit in trades.

  #### **Token Payoff Scheme**  
  - Students start with **100 tokens**.  
  - At the end, **total tokens = tokens held + outcome of their final lottery**.  
  - Total tokens convert to entries in a draw for a **$20 gift card** (e.g., a student with 150 tokens gets 150 entries).  
  - *Rationale*: Tokens have real value, incentivizing thoughtful decisions. The lottery payout is resolved post-trade to reflect real uncertainty.

  #### **Broker’s Schedule (for Part 2)**  
  The broker (a student) offers trades based on the student’s **current lottery**. Each trade demands tokens in exchange for swapping lotteries:  
  - If holding **X**: *Give me X + 5 tokens → I give you Z.*  
  - If holding **Z**: *Give me Z + 5 tokens → I give you Y.*  
  - If holding **Y**: *Give me Y + 5 tokens → I give you X.*  

  **Schedule for 3 rounds** (1 trade/round per student):  
  1. **Round 1**: Offer trade based on **starting** lottery.  
  2. **Round 2**: Offer trade based on **new** lottery (after Round 1).  
  3. **Round 3**: Offer trade based on **latest** lottery.  

  **Broker instructions**:  
  - Approach students sequentially.  
  - Record accepted/rejected trades.  
  - Collect tokens/lottery tickets and issue new ones on acceptance.  
  - No explanations beyond the trade offer.  

  #### **Handouts**  
  - **Part 1**: Ranking sheet with lotteries (X, Y, Z) and space for EU assignments.  
  - **Part 2**: Token ledger (students track tokens/lottery changes).  

  ---

  ### **Timeline (90 Minutes)**  
  #### **Part 1: Representational Failure (30 min)**  
  1. **Introduction (5 min)**:  
     - Explain the lotteries (display outcomes/probabilities visually).  
     - Task: *Rank X, Y, Z from most to least preferred.*  
     - Goal: *Assign utilities to outcomes (0, 10, 11, 21) where u(0) = 0, and check if expected utilities (EU) match your ranking.*  

  2. **Ranking & EU Assignment (15 min)**:  
     - Students rank lotteries (5 min).  
     - Students assign utilities (u(10), u(11), u(21)) and calculate EU (10 min).  
       - *Sample task*: "Set u(10) = 10, u(11) = __ , u(21) = __. Does EU(X) > EU(Y) > EU(Z) match your ranking?"  

  3. **Discussion (10 min)**:  
     - Poll: "Who could *not* find utilities to match their ranking?"  
     - Volunteers share rankings (e.g., cycle: X > Y, Y > Z, Z > X).  
     - Highlight: *If no utilities reproduce your ranking, your preferences are "EU-unrepresentable."*  

  #### **Part 2: Pragmatic Failure (40 min)**  
  1. **Setup (5 min)**:  
     - Assign each student:  
       - **100 tokens** + **one lottery** (5 get X, 5 get Y, 4 get Z).  
     - Explain rules:  
       - Broker will offer 3 trades (1 per round).  
       - Accept/reject freely.  
       - Final tokens = tokens held + lottery outcome (resolved later).  
       - Tokens = entries for $20 gift card draw.  

  2. **Trading Game (25 min)**:  
     - **Broker** rotates through students (3 rounds × 14 students = 42 trades; ~18 sec/trade).  
     - Students record trades/tokens on ledgers.  
     - *Critical rule*: Trades are offered **one at a time**; students cannot see future trades.  

  3. **Resolution (10 min)**:  
     - Collect final lotteries/token counts.  
     - Resolve lottery outcomes (use RNG or dice).  
     - Announce: "Gift card draw at seminar end."  

  #### **Debrief (20 min)**  
  1. **Pragmatic Argument Recap**:  
     - Poll: "Who paid tokens to end with the *same* lottery they started with?"  
     - Reveal the cycle:  
       - *Trade 1*: X → Z (+5 tokens from student).  
       - *Trade 2*: Z → Y (+5 tokens).  
       - *Trade 3*: Y → X (+5 tokens).  
       - **Result**: Net loss of 15 tokens for cycling back to start.  
     - Key insight: *The broker "drained" tokens by exploiting cyclic preferences. Each trade seemed beneficial alone, but the sequence was harmful.*  

  2. **Contrasting the Arguments**:  
     - **Representational failure** (Part 1):  
       - *Conclusion*: Incoherent preferences **cannot be described** by any EU model.  
       - *Why?* No utilities/probabilities "fit" the rankings (e.g., the cycle violates transitivity, an EU axiom).  
     - **Pragmatic failure** (Part 2):  
       - *Conclusion*: Incoherent preferences are **exploitable** through trades.  
       - *Why?* The broker used the cycle to create a "money pump."  
     - **Crucial distinction**:  
       - Representational = *Interpretation* (no consistent mental model exists).  
       - Pragmatic = *Vulnerability* (real-world cost from myopic decisions).  

  3. **Limitations & Nuances**:  
     - **Why trades worked**: Students saw trades **one-by-one**, not as a package. If shown the full sequence, they’d reject Trade 1 (foreseeing the drain).  
       - *Implication*: Exploitability ≠ Irrationality. It reveals a **procedural flaw** (myopia), not global irrationality.  
     - **What the activity missed**:  
       - **Completeness axiom**: Students ranked only 3 lotteries. Real EU requires preferences over *all possible* lotteries (infinite/unknowable states).  
       - **State-space realism**: Classroom lotteries use fixed probabilities; real decisions involve unenumerated states (e.g., "unknown unknowns").  
       - *Supplement in debrief*: "EU assumes we can compare *any* two options—even those we’ve never considered. This is idealized."  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Part 1: No one has a cycle** (if students avoid intransitivity):  
     - *Fix*: Pre-seed the group. Ask 3+ students to *deliberately* adopt the cycle (X>Y, Y>Z, Z>X) to ensure representational failure.  

  2. **Part 2: Low trade acceptance**:  
     - *Why*: 5-token fee may exceed willingness-to-pay.  
     - *Fix*: Reduce fee to **2–3 tokens** or let broker negotiate (e.g., "Pay 1–5 tokens; name your price").  

  3. **Time crunch in trading**:  
     - *Fix*: Use 2 brokers or limit to 2 rounds (drain = 10 tokens).  

  4. **Misunderstanding lotteries**:  
     - *Fix*: Start with a practice lottery (e.g., "Calculate expected tokens for Y: (0.9×10) + (0.1×21) = 11.1").  

  ---

  ### **Why This Works**  
  - **Part 1** forces students to confront the *mathematical impossibility* of representing cycles with EU.  
  - **Part 2** makes exploitability visceral: students lose tokens they value.  
  - **Debrief** separates "what we can model" (representation) from "what we can exploit" (pragmatics), and highlights procedural myopia.  

  This design ensures both arguments hit home, while the lotteries, trades, and debrief expose the key differences and limitations.
