answer: |-
  Below is a rigorous translation of your four points into the vocabulary of surveillance case definitions and outbreak declaration, followed by residue analysis. The mapping adheres strictly to epidemiological logic, flagging presupposition mismatches and framework boundaries. Your "special intent as epidemiological linkage" analogy is tested separately.

  ---

  ### **1. Treaty Definition Translation**  
  *Original*: Five enumerated acts + specific intent to destroy a group (national, ethnic, racial, religious) *as such*, targeting a "substantial part" threatening the whole. Intent inferred from pattern.  

  **Epidemiological Translation**:  
  - **Clean Carryover**:  
    - *Enumerated acts* ≡ **Operational criteria** (e.g., clinical/lab/epidemiological markers). Just as a fever + travel history + PCR test define a COVID case, killing/causing harm/etc. define acts.  
    - *Intent inferred from pattern* ≡ **Circumstantial linkage criteria** (e.g., inferring SARS-CoV-2 infection from contact + symptoms without lab confirmation).  
    - *"Substantial part" threshold* ≡ **Epidemic declaration threshold** (e.g., X cases per Y population signifies community transmission).  

  - **Distorted Carryover**:  
    - *Targeting the group "as such"* ≡ **Case attribution to a defined population**. Distortion: Epidemiology assumes a pre-existing "at-risk population" (e.g., unvaccinated children for measles). Here, the *group’s existence is defined by the perpetrator’s targeting*, creating circularity.  
    - *Intent requirement* ≡ **Causal attribution in outbreak source tracing**. Distortion: Intent is a *normative/legal* state; epidemiology infers *biological causality* (e.g., pathogen exposure), not motive.  

  - **No Counterpart**:  
    - **Moral agency**. Case definitions attribute disease, not blame. The "intent to destroy" has no epidemiological parallel—pathogens lack volition.  
    - **"Closed list of group types"**. Epidemiology’s "populations" are fluid (e.g., "MSM" or "healthcare workers"); fixed categories resist revision.  

  ---

  ### **2. Gap Between Coinage and Codification**  
  *Original*: Lemkin’s broad process (destroying institutions, culture, economy) narrowed to 5 acts + 4 group types.  

  **Epidemiological Translation**:  
  - **Clean Carryover**:  
    - *Narrowing via negotiation* ≡ **Case definition revision by committee**. E.g., expanding COVID criteria to include loss of smell improved sensitivity but excluded atypical cases.  
    - *Loss of breadth* ≡ **Reduced sensitivity for surveillance**. Just as omitting serology tests misses asymptomatic cases, omitting cultural destruction misses "attenuated genocide."  

  - **Distorted Carryover**:  
    - *"Single process" fragmentation* ≡ **Syndromic surveillance vs. pathogen-specific criteria**. Distortion: Fragmenting Lemkin’s process into distinct "acts" is like separating fever and cough as unrelated markers—loss of systemic understanding.  

  - **No Counterpart**:  
    - **Ontological collapse**. Destroying a group’s *identity* (language/religion) has no disease analogue. Epidemiology tracks material harm (morbidity/mortality), not erasure of abstract constructs.  

  ---

  ### **3. "Law/Evidence" vs. "Naming as Consequential Act"**  
  *Original*: Is genocide determination purely evidentiary, or does naming trigger political consequences?  

  **Epidemiological Translation**:  
  - **Clean Carryover**:  
    - *Question of evidence* ≡ **Case confirmation workflow**. E.g., lab-confirmed vs. probable cases based on linkage.  
    - *Institutional reluctance to name* ≡ **Underreporting due to stigma/resource burdens**. E.g., avoiding "plague" designation to prevent trade restrictions.  

  - **Distorted Carryover**:  
    - *Naming as consequential* ≡ **Outbreak declaration implications**. Distortion: Declaring an epidemic triggers *resource mobilization*; declaring genocide triggers *legal/political sanctions*. Epidemiology lacks "naming as condemnation."  

  - **No Counterpart**:  
    **Performativity of blame**. "Genocide" assigns culpability; "outbreak" assigns biological causality. The latter has no moral dimension.  

  ---

  ### **4. Category "Constitutes" Rather Than "Classifies"**  
  *Original*: Genocide category shapes reality (e.g., mobilizing interventions) vs. passively describing.  

  **Epidemiological Translation**:  
  - **Clean Carryover**:  
    - *Constitutive function* ≡ **Surveillance-driven resource allocation**. E.g., declaring a PHEIC (Public Health Emergency of International Concern) by WHO unlocks funding/political action.  

  - **Distorted Carryover**:  
    - *Category defining group existence* ≡ **Case definition creating "outbreaks"**. Distortion: Case definitions count *instances* within a population; genocide definitions can *create* the group as a target (e.g., "Tutsi" in Rwanda).  

  - **No Counterpart**:  
    **Self-fulfilling categorization**. Naming genocide can accelerate violence (as a rallying cry); naming a disease outbreak rarely exacerbates spread.  

  ---

  ### **Residue Report**  
  **Framework Defects (Epidemiology Cannot Represent)**:  
  - **Moral agency/condemnation**. Your framework distributes *attention/resources*, not blame. Moral force is an externality (like stigma) but cannot be operationalized as a "criterion."  
  - **Volitional intent**. Epidemiology infers *causality* from patterns; it cannot model *intent* as a variable.  
  - **Constructed groups**. "Populations at risk" are demographically defined; genocide’s "groups" are often defined *by the act of targeting itself* (e.g., "class" in Cambodia).  

  **Original Claims Doing Less Work**:  
  - **"Substantial part" threshold**. In epidemiology, thresholds are quantitative (e.g., 10% attack rate). Genocide’s "substantial" is qualitative—vulnerability matters more than size (e.g., eliminating leaders). This exposes the term’s vagueness.  
  - **Closed group categories**. Epidemiology revises populations (e.g., adding "immunocompromised"); genocide’s fixed list reflects political negotiation, not empirical necessity.  

  ---

  ### **Testing Your Instinct: Special Intent as Epidemiological Linkage**  
  **Mapping**:  
  - *Special intent* ≡ **Probable case via epidemiological linkage** (e.g., COVID case without test but with close contact + symptoms).  
  **Where It Holds**:  
  - Both infer unobserved states (intent/pathogen) from circumstantial evidence (pattern of acts/symptom cluster).  
  **Where It Breaks**:  
  - **Intent requires *normative inference***. Linkage confirms *biological probability*; intent implicates *moral responsibility*. Epidemiology lacks tools for the latter.  
  - **False positives differ radically**. Misclassifying a genocide risks geopolitical chaos; misclassifying a disease case risks resource waste.  

  ---

  ### **Judgment on Your Two Suspicions**  
  **1. Moral Content as Externality**:  
    - **Verdict**: Your suspicion holds. Epidemiology’s framework cannot encode condemnation. Moral force is extrinsic (like stigma), managed via messaging—never a criterion. Calling cholera "epidemic" triggers action; calling atrocities "genocide" triggers *accountability*. Your vocabulary’s strength (neutrality) is its moral blind spot.  

  **2. Uncontroversial Counting Units as Blind Spot**:  
    - **Verdict**: Critical blind spot. In epidemiology, "populations" are operational conveniences (e.g., "adults >65"). In genocide, the *group is the dispute* (e.g., are Uyghurs an "ethnic group"?). Your framework’s assumption of predefined units fails when the act *creates* the group. This is a defect: it cannot model politicized categorization.  

  ---

  ### **Translation Integrity Note**  
  - **Presupposition Mismatches Explicitly Flagged**:  
    - Epidemiology assumes biological causality; genocide requires volitional intent.  
    - Case definitions presume stable populations; genocide definitions often create them.  
    - No smuggling: "Intent" was not forced into "causality"; stigma was not conflated with blame.  

  This exercise confirms epidemiology’s power for operationalizing harm but exposes its limits in capturing agency, blame, or identity erasure. Where translation fails, it reveals both framework constraints and conceptual ambiguities in the original.
