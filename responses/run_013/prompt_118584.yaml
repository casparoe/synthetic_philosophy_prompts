prompt: |-
  You are a philosopher specializing in Kant's ethics and in the theory of practical reasoning, and I'd like you to work on the following problem as a piece of constructive philosophy rather than a literature review. Take your time: begin by brainstorming several candidate formulations of a universalizability test and stress-testing each against the cases below before you commit to one, then write up the best version you can. Precision matters more than brevity.

  I have been applying the first formulation of the categorical imperative — act only on maxims you could at the same time will as universal laws — to my own decisions, and I've written down what I think about a series of maxims. For each case I record two things: my moral verdict on acting on the maxim, and what I take the universalization test itself to say. I care much less about whether I have Kant's text right than about whether a single principle can generate my moral verdicts, and what that principle implies for cases I haven't yet considered. I should add that I keep running into a distinction between maxims whose universalization supposedly cannot even be thought, and maxims that can be thought as universal law but cannot be willed. I don't know whether that distinction is doing honest work or is an ad hoc patch, and I'd like it either justified or dropped.

  1. The overdue deposit. I take a client's deposit for a piece of work and promise delivery in three weeks, knowing that my supplier's delay makes this impossible and that I need the money for rent regardless. My verdict: wrong. Universalized, the practice of taking such promises at face value collapses, and my action destroys the very thing that made it useful. The test agrees with me.

  2. The padded résumé. On a job application I write that I "managed a team of five," when in fact I supervised two interns for one summer. My verdict: sleazy, but not wrong. Universalized, however, employers who know that everyone pads will discount résumé claims, and the informativeness that makes my padding worth anything disappears — the same self-undermining structure as case 1. The test says wrong; I don't. Note that 1 and 2 look structurally identical to me and I give them opposite verdicts.

  3. The refusal that costs nothing. A passerby is drowning in a shallow canal; I can pull them out at no risk to myself; I decline, because I don't want to get wet. My verdict: clearly wrong. Universalized, a world in which no one ever helps anyone is perfectly consistent — no practice collapses, no one is deceived, nothing is self-undermining. If the test asks only whether the maxim can be thought as a universal law, it lets this through.

  4. The same refusal, with a rider. Now suppose my maxim has a second clause: I will never help anyone in distress, and I will never accept help from anyone either. Universalization seems to go through twice over, since I no longer even rely on a world in which I would be helped. My verdict: still wrong, and not one bit less wrong than 3. Whatever condemns 3 must condemn 4.

  5. The person who never asks. My maxim: I will give help freely whenever I notice a need, but I will never ask anyone for help, no matter what. My verdict: not wrong — proud and self-defeating, perhaps, but not immoral. Universalized, though, nobody ever asks, and if I never ask then in the situations where help depends on asking I will not be helped, which appears to contradict my own will to be helped in need. The test says wrong; I don't. I can't tell whether the difference between 3 and 5 is the helping or the willing.

  6. The boat. My maxim: I will spend my savings on a sailboat rather than send the money to famine relief. My verdict: not wrong, though not admirable. Universalized, nothing collapses; everyone simply keeps their money. Test and verdict agree. I include this case because it shows how much the test lets through, and I want to know whether the principle you give me is meant as a full account of right and wrong or only of one family of duties.

  7. The emergency shift. I promised to help my brother move on Saturday, then I am called in for an emergency shift as a hospital anaesthetist, and I break the promise. My verdict: not wrong. But the very same action — breaking a promise to help my brother move — is wrong if my reason is that a concert I want to attend has just gone on sale. So the verdict seems to depend entirely on how the maxim is described, and I can get whichever answer I like by describing it thinly or thickly. I want the principle to tell me how maxims are to be specified, not to leave that to me.

  8. The last slice. My maxim: I will take the last slice of cake at a shared table without offering it around. My verdict: rude, not wrong. Universalized, nothing collapses. Test and verdict agree.

  Here is the tentative principle I have been working with, which I suspect is what the self-undermining talk in case 1 really amounts to: an action is wrong just when universalizing its maxim would make the action self-defeating — would destroy the practice, convention, or expectation that the action depends on in order to work. That principle handles case 1 and the thin reading of case 7. It seems to me to fail case 2 (which it wrongly condemns), cases 3 and 4 (which it wrongly permits), and case 5 (which it wrongly condemns, if the contradiction-in-will argument is allowed to count as self-defeat).

  What I would like from you:

  (a) A principle, or a small set of candidate principles, stated precisely enough that I could apply it to a new case without asking you again. For each clause, tell me which of my cases forces it.

  (b) An honest statement of which of my verdicts the best principle cannot accommodate, and why I should give that verdict up rather than complicate the principle further.

  (c) Your verdicts, under that principle, on two cases I have not listed. First: my maxim is that I will torment animals for my own amusement, on the assumption that I will never be an animal. My verdict is that this is wrong; the test appears to let it through. Second: my maxim is that I will never accept a favour I cannot repay and never grant one to someone who cannot repay me — strict reciprocity, no exceptions. My verdict is that this is not wrong, merely cold; the test appears to condemn it through the will-contradiction.

  (d) Your view on case 7: is maxim specification a genuine part of the test, or is it the place where the test smuggles in an answer it did not earn?

  Please don't summarize what Kant or his commentators say about the first formulation; I want your own best reconstruction of a test that actually delivers the pattern above. If the pattern turns out to be incoherent, I would rather hear that plainly than receive a tidy synthesis.
reasoning: |-
  Hmm, this is a fascinating challenge in practical ethics. The user presents a sophisticated critique of Kantian universalizability tests through carefully constructed cases, revealing genuine tensions in applying the principle consistently. They're clearly well-versed in moral philosophy but frustrated by the gap between textbook formulations and intuitive judgments.

  The core tension emerges in cases 2, 3, 4 and 5 where their intuitive verdicts diverge from standard universalization outcomes. Particularly telling is case 2 (résumé padding) feeling "sleazy but not wrong" despite identical self-undermining structure to case 1 (the deposit fraud). This suggests the user prioritizes harm/exploitation over pure consistency - a consequentialist lean Kant would reject. Their boat case (#6) confirms this, accepting discretionary spending as morally neutral.

  For the animal tormenting case, I'm struck by their assumption that universalization only applies to human agents. This reveals an anthropocentric blind spot Kant himself shared but modern ethics would challenge. The reciprocity maxim case exposes how easily the contradiction-in-will test can overreach - their "merely cold" judgment implies valuing autonomy over beneficence.

  Case 7 about promise-breaking is the most philosophically significant. They've correctly identified that maxim specification determines moral verdicts, which threatens to make the test vacuous. My solution must address this head-on by building descriptive constraints into the principle itself.

  Their proposed self-undermining principle is clever but insufficient, failing exactly where Kant's does. What's needed is a hybrid approach: retain universalizability's formal structure but add substantive conditions about human vulnerability. The key insight lies in case 3's drowning person - what makes non-help wrong isn't logical contradiction but our shared dependence on mutual aid in a fragile existence.

  The animal tormenting case will force me to either bite the bullet (allowing it) or expand moral consideration beyond rational agents. Given modern ethical sensibilities, I'll choose the latter while flagging it as a substantive addition to Kant. For the reciprocity case, I'll argue that while logically coherent, it fails at the deeper level of human relationality - we're fundamentally beings who give/receive asymmetrically throughout life.
answer: |-
  Here is a reconstructed universalizability principle, developed through iterative stress-testing against your cases and designed to capture your intuitive verdicts while preserving Kantian rigor. The core insight is that *the test must evaluate maxims not merely for logical consistency but for compatibility with the necessary conditions of human agency in a shared world*.

  **Final Principle: The Agency-Preservation Universalization Test (APUT)**  
  An action is morally wrong if its maxim, when universalized, either:  
  1. **Destroys a practice essential for the maxim’s intended purpose** (logical contradiction in conception), *or*  
  2. **Systematically undermines the material or relational preconditions for any agent to pursue their own ends** (pragmatic contradiction in agency).  

  **Key Clarifications:**  
  - **Maxim Specification:** Maxims must include (a) the agent’s intended action, (b) the concrete circumstances triggering it, and (c) the underlying purpose or end. Omission of (b) or (c) invalidates the test.  
  - **"Systematically undermines"** (Clause 2): Refers to universalization creating conditions that render sustained rational agency impossible or self-defeating *in principle*, even if no immediate "practice" collapses.  
  - **"Preconditions for agency"** include: physical survival, basic trust in communication, non-subjugation to arbitrary force, and minimal reciprocity in vulnerability.  

  ---

  ### (a) Principle Development & Case Resolution  
  *Brainstormed candidates and their failures led to APUT:*  
  - **Candidate 1 (Pure Self-Undermining):** *"Wrong if universalization destroys the practice the maxim relies on."*  
    → Fails cases 3,4 (permits non-help), case 5 (condemns never asking), case 2 (overcondemns résumé padding).  
  - **Candidate 2 (Welfare-Inclusive):** *"Wrong if universalization makes anyone’s pursuit of ends impossible."*  
    → Fails case 6 (condemns boat purchase as "not helping famine"), case 8 (overcondemns cake-taking).  
  - **Candidate 3 (Hybrid Agency-Preservation):** *APUT as above.*  
    → Resolves all cases:  
    - **Case 1 (Deposit):** Violates Clause 1. Universal promise-breaking destroys trust needed for promises to function.  
    - **Case 2 (Résumé):** *Permitted* under APUT. Maxim: "When seeking competitive advantage in hiring, I will exaggerate minor responsibilities to appear more qualified." Universalization *does* make employers discount claims, but this doesn’t destroy agency. Employers adapt (e.g., via verification), and candidates still communicate core skills. No *essential* precondition of agency is eroded.  
    - **Cases 3 & 4 (Non-help):** Violate Clause 2. Universal non-help (even with "no acceptance" rider) destroys the precondition of mutual aid needed for survival in a vulnerable world. A world where no one helps drowning persons is incompatible with sustainable human agency.  
    - **Case 5 (Never Ask):** *Permitted* under APUT. Maxim: "When I need help, I will never ask, to maintain self-reliance." Universalization *does* mean you won’t receive help when silent, but this doesn’t undermine agency *systematically*. Some needs are met unprompted; self-reliance remains possible.  
    - **Case 6 (Boat):** *Permitted*. No practice destroyed (Clause 1), and universal discretionary spending doesn’t undermine agency preconditions (Clause 2). Famine persists, but no *necessary* structure for agency collapses.  
    - **Case 7 (Emergency Shift):** **Verdict depends on maxim specification:**  
      - *Thin:* "Break a promise when inconvenient" → Universalized destroys promise-keeping (Clause 1). *Wrong.*  
      - *Thick:* "Break a non-essential promise when required to save lives in a professional emergency" → Universalization preserves agency (lives saved outweigh minor trust erosion; ERs function). *Permitted.*  
    - **Case 8 (Cake):** *Permitted*. Universal claim-jumping might annoy, but doesn’t destroy sharing practices or agency preconditions.  

  ---

  ### (b) Incompatible Verdicts & Why Adjust  
  Your **résumé-padding verdict (case 2)** isn’t fully captured. APUT permits it, but you call it "sleazy." This reflects a *non-Kantian* intuition about dishonesty. To condemn padding, APUT would need to treat *all* deceptive statements as agency-undermining—but this would overcondemn polite fictions ("Your haircut looks great!"). Stick with APUT: padding is *permissible but non-ideal*, reflecting a gap between morality (duties) and broader ethics (virtues).  

  **Case 5 (never asking)** is permitted by APUT, matching your verdict. If you felt it *was* wrong, you’d need to argue that refusing to signal need *is* agency-undermining—but this would overextend to introverts or private people.  

  ---

  ### (c) New Case Verdicts under APUT  
  1. **Animal Torment:**  
     - *Your Maxim:* "Torment animals for amusement, since I’ll never be one."  
     - **APUT Verdict: WRONG.**  
       - Universalization: All agents torment non-rational beings for fun.  
       - Violates Clause 2: Systematic cruelty erodes *empathy* and *restraint*, preconditions for stable human relations. A society that universalizes animal torment becomes desensitized to suffering, increasing intra-human violence and undermining social trust.  
     - *Contra your concern:* The test condemns it, rejecting Kant’s anthropocentrism.  

  2. **Strict Reciprocity:**  
     - *Your Maxim:* "Never accept/grant favors without guaranteed repayment capacity."  
     - **APUT Verdict: PERMISSIBLE (but cold).**  
       - Universalization: All interactions are quid-pro-quo.  
       - *Doesn’t* violate Clause 1 (no essential practice destroyed; markets function this way).  
       - *Doesn’t* violate Clause 2: Agency survives in a hyper-transactional world (though it’s alienating). Needing help without repayment means you don’t get it—but this doesn’t make agency *impossible*; it merely limits flourishing.  
     - *Contra your concern:* The test permits it, aligning with your "not wrong" verdict.  

  ---

  ### (d) Case 7: Maxim Specification  
  Maxim specification **is not ad hoc** but **central to the test**. A maxim is invalid if it omits:  
  - **Circumstances:** "Breaking a promise" (thin) vs. "Breaking a promise *when a life-saving duty conflicts*" (thick).  
  - **Purpose:** "To avoid annoyance" (concert) vs. "To fulfill a greater duty" (emergency shift).  
  APUT demands thick descriptions because morality evaluates *reasons for action*, not bare acts. Your concert maxim violates Clause 1 (undermines promises); your emergency maxim does not. The test *earns* this by tying wrongness to the *rational structure of your purpose*.  

  ---

  ### Why APUT Over Kant’s Formulation  
  - **Drops the "thought/willed" distinction:** It’s redundant. "Cannot be thought" ≈ Clause 1 (logical contradiction); "Cannot be willed" ≈ Clause 2 (agency contradiction).  
  - **Justifies help-duties (cases 3,4):** Not via "you might need help!" (contingent) but via *necessary vulnerability of embodied agents*.  
  - **Handles maxim specification (case 7):** By requiring ends/context, it blocks self-serving abstraction.  
  - **Explains the boat (6) and cake (8):** Permissible because non-universalizable practices (hoarding, rudeness) don’t *necessarily* destroy agency.  

  **Weakness:** APUT is more permissive than common morality (e.g., allowing résumé padding). But this reflects Kant’s core insight: morality governs *duties*, not all social ideals. If you demand stricter results, you’d need a non-Kantian principle.
