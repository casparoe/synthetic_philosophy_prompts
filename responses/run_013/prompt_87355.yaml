  Hmm... The challenge is designing a question that can't be answered by rote memorization. I should construct a scenario that forces students to apply concepts in novel ways. The two-sided aspect is crucial - it shows how the same reasoning leads to contradictory demands. And introducing actual infinity creates a new layer of complexity that breaks utility-capping solutions.

  For the structure: A multi-part question would work best. Part (a) would establish the basic one-sided mugging. Part (b) introduces the symmetric bad outcome, creating the pincer. Part (c) escalates to infinite utilities. This progression pushes students to see how solutions that work for finite cases fail spectacularly with infinity.

  The model answer needs to demonstrate: clear explanation of why the pincer is worse (contradictory commands), why utility capping fails with infinity, and why probabilistic approaches become incoherent. It should also evaluate which fixes might partially survive.

  For grading: Top answers must identify the contradiction in the pincer and recognize infinity breaks utility capping. Strong answers should question what "infinitesimal probability times infinity" means. Common mistakes to penalize include: missing the symmetry of the pincer, not seeing why infinity breaks utility caps, or treating infinite cases as just "big finite numbers."

  I should emphasize the reasoning traps: The obvious solution (utility capping) clearly fails with actual infinities, and probabilistic approaches become mathematically undefined. This creates the "aha" moment the user wants to assess.

  The word count needs careful management - 900 words for the model answer means concise explanations of each concept. I'll avoid citations since it's closed-book, focusing instead on logical reasoning they should know from class.

  Finally, the marking scheme should reward original thought: points for recognizing contradictions, identifying solution failures, and evaluating salvageable approaches. Deductions for superficial treatment of the pincer or infinity aspects.
answer: |-
  ## Pascal's Mugging Exam Question

  (a) **Question (Total: 30 Marks; Suggested Time: ~70 minutes)**

  Pascal's Mugging presents a challenge to standard expected utility maximization (EUM). Consider this scenario:

  *   **Mugging for Good (MG):** A seemingly untrustworthy agent ("Mugger") claims that if you give them £10, they will use their vast, hidden powers to create an astronomically large positive outcome *G* (e.g., preventing immense future suffering for countless beings) with a minuscule but non-zero probability *p*. They offer credible-seeming (though ultimately unverifiable) evidence suggesting *p* is not *exactly* zero. The Mugger argues that the expected utility (EU) of paying (£10 cost) is *pU(G) - U(£10)*, and since *U(G)* is so vast, this EU is overwhelmingly positive, so you *must* pay.

  *   **Mugging for Bad (MB):** The same Mugger returns later. This time, they claim that if you *don't* give them £10, they will, with the same minuscule probability *p*, use their powers to create an astronomically large *negative* outcome *B* (e.g., causing immense future suffering for countless beings). They offer similarly unverifiable evidence suggesting *p* is not *exactly* zero. They argue the EU of *not* paying is *pU(B) + U(Keep £10)*. Since *U(B)* is astronomically negative (high magnitude), this EU is overwhelmingly negative, so you *must* pay to avoid it.

  *   **Mugging for Infinity (MI):** The Mugger returns a third time. Now, they claim that if you give them £10, they will, with probability *p*, create an outcome of *literally infinite positive utility* (∞). Alternatively, if you don't pay, they will, with probability *p*, create an outcome of *literally infinite negative utility* (-∞).

  Answer the following:

  1.  **The Pincer Problem (10 Marks):** Explain why the combination of MG and MB (the "Pincer") constitutes a *stronger* objection to EUM than MG alone. Why is it problematic if EUM demands you pay in *both* scenarios? Does this combination pose a unique challenge compared to just MG?
  2.  **Standard Fixes & the Pincer (8 Marks):** Briefly outline *one* standard strategy for resolving the original MG scenario (e.g., utility function bounding, using infinitesimal probabilities, imprecise credences, abandoning strict EUM). Explain whether and why this strategy successfully resolves, fails to resolve, or only partially resolves the Pincer problem (MG + MB).
  3.  **The Infinity Challenge (12 Marks):** Analyze the MI scenario.
      *   (i) Why does replacing the astronomically large finite utilities *G* and *B* with *literal infinities* (∞ and -∞) pose a fundamental problem for the strategy of "bounding the utility function"? Explain precisely why this fix breaks down.
      *   (ii) Consider the EU calculation for MI: What is `EU(Pay)`? What is `EU(Don't Pay)`? What are the conceptual and mathematical problems that arise when trying to compute these expected utilities using literal infinities and a non-zero probability *p*? How does this undermine the Mugger's argument based on EUM? Does this infinite case strengthen or weaken the challenge posed by Pascal's Mugging overall? Explain your reasoning.

  ---

  ## Model Answer (~900 words)

  **1. The Pincer Problem (Why MG + MB is Stronger)**

  The original Mugging for Good (MG) is problematic because EUM seems to compel us to perform an intuitively irrational act (giving £10 to a likely charlatan) based solely on an incredibly improbable claim of vast future benefit. However, a common intuitive response is simply to dismiss such minuscule probabilities as effectively zero ("discount the lunatic"), perhaps aided by strategies like bounding utilities or formalizing infinitesimal probabilities. The Mugging feels like an outlier case exploiting a theoretical weakness.

  The Pincer (MG + MB) transforms this from an outlier into a fundamental inconsistency *within* EUM itself. It reveals that the *same core reasoning principle* – that any non-zero probability, multiplied by a sufficiently large utility magnitude, can dominate the calculation – leads to *contradictory practical demands* when applied symmetrically.

  In MG, EUM dictates: **Pay £10** (because `p * U(G) >> U(£10)`).
  In MB, EUM dictates: **Pay £10** (because `|p * U(B)| >> U(£10)`, making `EU(Don't Pay)` hugely negative).

  The problem is not just that both demands feel intuitively wrong. The critical flaw is that **EUM commands you to pay £10 for *diametrically opposed* reasons in the two scenarios.** In MG, you pay to *gain* an astronomical good. In MB, you pay to *avoid* an astronomical bad. Yet, you are performing the *same physical action* (handing over £10) in response to the *same kind of unverifiable threat/promise* from the *same untrustworthy agent*.

  This exposes a deeper incoherence. EUM, applied naively to such scenarios, loses its normative force because it cannot provide consistent guidance. It tells you an action is rationally required for reason X, and also that the *same* action is rationally required for reason Not-X. This logical tension is absent in the one-sided MG case. The Pincer shows that the problem isn't merely that EUM *sometimes* gives counterintuitive results, but that it can generate *directly conflicting imperatives* based on structurally identical, unverifiable propositions. This makes it a significantly stronger objection, as it attacks the internal consistency of the decision rule under plausible conditions involving extreme uncertainty and high stakes.

  **2. Standard Fixes & the Pincer (Example: Utility Bounding)**

  One common strategy to resolve MG is to **bound the utility function**. This means stipulating that no outcome, no matter how good or bad, can have a utility magnitude exceeding some finite limit L (i.e., `-L ≤ U(Outcome) ≤ L` for all outcomes). This directly caps the `p * U(G)` term in MG. For a sufficiently small p, `p * U(G)` becomes less than `U(£10)`, so paying is no longer required.

  **Does it resolve the Pincer?** **No.** While bounding prevents the dominance of any single colossal utility, it *fails* to resolve the contradictory demands of the Pincer. Consider:

  *   In **MG (Bounded)**: `EU(Pay) = p * U(G) - U(£10) ≤ p*L - U(£10)`. For small p, this is negative. `EU(Don't Pay) = 0`. So EUM dictates: **Don't Pay**.
  *   In **MB (Bounded)**: `EU(Don't Pay) = p * U(B) + U(Keep £10) ≥ p*(-L) + U(Keep £10)`. For small p, this is positive *if* `U(Keep £10)` is positive. `EU(Pay) = -U(£10)`. So EUM dictates: **Don't Pay**.

  The contradiction vanishes! EUM says "Don't Pay" in both cases. However, this is **only a partial and superficial resolution**. The core problem the Pincer highlights – that EUM is vulnerable to manipulation by symmetric, unverifiable claims about extreme outcomes – hasn't been *solved*; it's been *avoided* by artificially limiting the scope of what utilities can represent. The strategy prevents the contradiction by making EUM completely unresponsive to *any* claims about outcomes beyond L, regardless of their plausibility or the size of p (as long as p is small). This seems like an ad hoc restriction that undermines the very purpose of having a utility function sensitive to value differences. Furthermore, it doesn't address *why* the symmetric claims generated a contradiction in the first place; it just defines the problem away by making the utilities impotent. The Pincer demonstrates that while bounding *prevents the practical contradiction*, it does so by sacrificing the ability of EUM to meaningfully handle *any* extremely high-stakes, low-probability events, which is arguably a significant cost and not a genuine resolution of the underlying tension.

  **3. The Infinity Challenge**

  **(i) Breaking Utility Bounding:** The strategy of bounding the utility function relies entirely on utilities being finite. Introducing *literal infinite utilities* (∞, -∞) completely destroys this approach. By definition, a bounded utility function `|U(.)| ≤ L < ∞` cannot represent infinite utility. If we are to take the Mugger's claim of infinite utility seriously within the EUM framework, we *must* allow `U(.)` to take infinite values. Bounding is simply incompatible with the scenario as described. The fix *presupposes* finite utilities and offers no tools for handling infinities, making it useless against MI.

  **(ii) EU Calculation with Infinities:** Attempting to compute the expected utilities for MI leads to profound mathematical and conceptual problems.

  *   `EU(Pay) = p * U(Pay & Mugger Delivers) + (1-p) * U(Pay & Mugger Lies) = p*(∞) + (1-p)*U(-£10)`
  *   `EU(Don't Pay) = p * U(Don't Pay & Mugger Delivers) + (1-p) * U(Don't Pay & Mugger Lies) = p*(-∞) + (1-p)*U(Keep £10)`

  **The Problems:**

  1.  **Indeterminate Forms:** The core terms are `p * ∞` and `p * (-∞)`. In standard real number arithmetic, these are **undefined**. Is `p * ∞` equal to ∞? Is it finite? The answer depends entirely on how we define the product of a positive real number and infinity, which isn't standardly defined within real analysis. EUM relies on real number arithmetic.
  2.  **Comparison Impossibility:** Even if we stipulate `p * ∞ = ∞` and `p * (-∞) = -∞` (which is a common convention in some extended systems, but not without issues), we then have:
      *   `EU(Pay) = ∞ + Finite Negative ≈ ∞`
      *   `EU(Don't Pay) = -∞ + Finite Positive ≈ -∞`
      This seems to suggest `EU(Pay) > EU(Don't Pay)` by an infinite margin, compelling payment. However, this is mathematically precarious. Adding finite numbers to ±∞ doesn't change them, but the comparison hinges on conventions about ordering infinities that aren't part of standard EUM.
  3.  **Sensitivity to p (Lack Thereof):** Astonishingly, under this `p * ∞ = ∞` convention, the value of `p` becomes irrelevant (as long as `p > 0`). Whether `p = 0.5` or `p = 10^{-100}`, `EU(Pay) = ∞` and `EU(Don't Pay) = -∞`. This makes the Mugger's argument *stronger* in a perverse way – the tiny probability becomes utterly insignificant. The decision is dictated solely by the presence of the infinite utility claim, regardless of its improbability! This obliterates the intuition that vanishingly small probabilities should have vanishingly small impact.
  4.  **Contradiction with Pincer Logic:** Applying the same `p * ∞ = ∞` convention symmetrically:
      *   Paying for ∞ Good: `EU(Pay) = ∞` -> **Pay**
      *   Paying to Avoid -∞ Bad: `EU(Pay) = -U(£10)` (finite), `EU(Don't Pay) = -∞` -> **Pay**

      Again, EUM commands paying in both infinite MG and infinite MB. The Pincer contradiction re-emerges with full force. Strategies relying on probability manipulation (e.g., infinitesimals, setting p=0) face severe challenges: formally defining an infinitesimal multiplied by infinity is even more complex and non-standard than handling finite utilities, and setting `p=0` requires a justification for ignoring the Mugger's evidence entirely, which EUM alone doesn't provide.

  **Does MI strengthen or weaken the challenge?** MI **radically strengthens** the Pascal's Mugging challenge. It breaks the most straightforward fix (bounding) completely. It exposes the deep mathematical inadequacy of standard EUM for handling infinities, reducing calculations to undefined or convention-dependent expressions (`p*∞`). It makes the decision absurdly insensitive to the *probability* of the claimed outcome, hinging entirely on the *mere possibility* of infinite stakes. While it might make the scenario feel *more* outlandish, it pushes the *theoretical* weaknesses of EUM to their absolute limit, showing that the framework lacks the resources to coherently model decisions involving non-zero probabilities of literally infinite utilities. It forces a confrontation with the foundations of utility representation and expectation calculation that the finite case can sometimes obscure.

  ---

  ## Marking Scheme (Out of 30)

  *   **Strong First (25-30):**
      *   **(Pincer - 9-10/10):** Clearly identifies the *contradictory practical demands* (Pay for Good vs. Pay to Avoid Bad) as the core problem, explaining why this is a deeper flaw than mere counter-intuitiveness. Explicitly contrasts this with the one-sided case. Insightful discussion of the unique challenge (e.g., loss of consistent guidance, vulnerability to symmetric manipulation).
      *   **(Standard Fix & Pincer - 7-8/8):** Chooses a relevant standard fix, accurately describes it *briefly*. Provides a *nuanced* analysis of its failure/partial success against the Pincer (e.g., acknowledges it avoids the contradiction but argues this is ad hoc, sacrifices sensitivity, or doesn't address the root cause). Moves beyond simple "it works/didn't work".
      *   **(Infinity - 10-12/12):**
          *   *(i - 4/4)*: Clearly states bounding *requires* finite utilities and is *incompatible* with infinite utilities. Explains the definitional clash.
          *   *(ii - 6-8/8)*: Correctly identifies `p*∞` as undefined in standard real arithmetic. Explains the conceptual problems arising from trying to define/compare EU(Pay) and EU(Don't Pay) involving ±∞ (indeterminacy, comparison issues, insensitivity to p). Notes the re-emergence of the Pincer contradiction under certain conventions. Explicitly states how this undermines the Mugger's argument *based on standard EUM*. Provides a clear, reasoned argument for why MI strengthens the overall challenge (highlights mathematical breakdown, breaks key fixes, exposes deeper foundational issues).
      *   Overall: Logical flow, precise language, demonstrates deep understanding beyond memorization. Anticipates and addresses subtleties.

  *   **Solid 2:1 (Good Answer) (18-24):**
      *   **(Pincer - 7-8/10):** Explains the Pincer involves conflicting demands to pay, recognizes this is worse than one case alone. Mentions inconsistency or contradiction. Contrasts with one-sided case, though perhaps less insightfully. May not fully articulate *why* the contradiction is uniquely problematic for EUM's normative force.
      *   **(Standard Fix & Pincer - 5-6/8):** Describes a standard fix accurately. Correctly states whether it resolves the Pincer contradiction or not. Explains *why* it succeeds/fails at resolving the contradiction, but analysis might be less nuanced (e.g., "bounded utilities make both EU calculations negative, so Don't Pay both times" without discussing the cost of this solution or the underlying vulnerability).
      *   **(Infinity - 8-10/12):**
          *   *(i - 3/4)*: States bounding doesn't work with infinity. Explains that infinity is bigger than any bound. May lack the precise "incompatibility" or definitional point.
          *   *(ii - 5-7/8)*: States EU calculations involve `p*∞` and `p*(-∞)`. Recognizes these are problematic/undefined. Mentions insensitivity to p. States that comparing EU(Pay) and EU(Don't Pay) is difficult/impossible. Correctly identifies the Mugger's EUM argument breaks down mathematically. States MI is a harder challenge, but reasoning might be less developed (e.g., "it's even bigger" rather than foundational breakdown).
      *   Overall: Competent coverage of all parts, shows understanding of core concepts. May miss some subtleties or have slightly less developed reasoning.

  *   **Lower 2:2 (13-17):**
      *   Significant gaps or errors in one major section. Superficial treatment of the Pincer (e.g., just says "it's worse", no clear contradiction). Fix description or Pincer analysis flawed. Infinity analysis confused (e.g., treats ∞ as just a large finite number, claims `p*∞=0` without justification, thinks bounding works). Struggles with the undefined nature of `p*∞`. Little discussion of why MI strengthens the challenge.

  *   **Third (9-12):** Major misunderstandings. Fails to grasp the Pincer contradiction. Incorrect description of fixes. Fundamental errors in handling infinity within EUM (e.g., attempts arithmetic with ∞ as a real number). Little coherent analysis.

  *   **Fail (<9):** Incomplete, seriously incorrect, or missing large sections. Demonstrates lack of understanding of core concepts like expected utility, the mugging problem, or the challenges of infinity.

  **Specific Mistakes Costing Marks:**

  *   **Pincer:** Failing to identify the *contradictory reasons* for the *same action* (Pay-for-Good vs. Pay-to-Avoid-Bad). Treating it as just "two weird demands" instead of an inconsistency. Claiming the Pincer isn't meaningfully different from two separate one-sided cases.
  *   **Standard Fix & Pincer:** Misdescribing the fix. Claiming a fix (like bounding) resolves the Pincer *without* acknowledging the cost or superficiality (e.g., just saying "it tells you not to pay both times, problem solved"). Claiming a fix resolves the Pincer when it clearly doesn't (e.g., infinitesimals likely still lead to contradiction unless p is set to exactly 0). Overlooking the symmetric vulnerability.
  *   **Infinity (i):** Suggesting bounding *can* handle infinity. Claiming infinity is just "very large" and bounding still applies.
  *   **Infinity (ii):** Treating `p*∞` as a defined real number (e.g., saying it equals ∞ or 0 without explaining the convention/breakdown). Performing invalid arithmetic with ∞ (e.g., `∞ - ∞ = 0`). Claiming the EU calculations are straightforward and clearly favour paying. Failing to recognize the problem of insensitivity to `p`. Arguing MI *weakens* the challenge without strong justification. Missing the re-emergence of the Pincer contradiction under conventional handling of `p*∞`.
  *   **General:** Vague answers, lack of structure, purely intuitive responses without decision-theoretic reasoning, factual errors about the scenarios. Focusing on the Mugger's untrustworthiness as the *only* solution without engaging with the decision-theoretic puzzle.
