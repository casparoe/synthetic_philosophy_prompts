prompt: |-
  i'm a software engineer with zero philosophy training, but i keep reading about this decision theory idea called risk-weighted expected utility and i want a poem out of it. the way i understand it: you dont just multiply each outcome's value by its probability and add up. first you sort the outcomes from worst to best, and the weight you give the jump up to a better outcome isnt that outcome's own probability but a function of the chance of getting it or anything better -- so for a risk-averse chooser the bad outcomes end up carrying more weight than their real odds, and the worst case punches way above its probability.

  so: a free-verse poem, maybe 20-30 lines, built around four outcomes with stated odds -- say 5%, 15%, 30%, 50% from worst to best -- except dont hand out lines in proportion to the odds. let the 5% worst case hog the poem and shortchange the 50%. the shape of the thing should make you feel the mismatch between the odds and the room the bad outcome takes up, and the turn should be the moment the speaker notices the odds never moved, only the weighting did. please dont let it drift into a poem about being careful or about anxiety being irrational; its about the shape of the weighting, not pessimism. someone who actually knows this theory should be able to point at it and say yeah, thats exactly it.
reasoning: |-
  Okay, the user wants a poem about risk-weighted expected utility theory. They're a software engineer without philosophy training but seem to grasp the core concept: worst-case outcomes get psychologically weighted heavier than their actual probability suggests. 

  Hmm, they're very specific about requirements - four outcomes (5%,15%,30%,50%), free verse, 20-30 lines. Key is making the worst 5% outcome dominate the poem's space disproportionately. Must avoid moralizing about anxiety or caution - purely about the weighting mechanism itself. 

  Interesting challenge: how to make mathematical weighting visually apparent through line distribution. The 5% should feel like it occupies 40% of the poem. Maybe use spacing/indentation to represent probability density being distorted? 

  Ah - and the crucial turn: when the speaker realizes the probabilities didn't change, only their mental weighting did. That epiphany needs to land cleanly. Better avoid financial examples since they mentioned not wanting generic "being careful" tropes. 

  *scribbles structure* 
  Opening: establish the four outcomes neutrally. 
  Then let the worst-case swell like an ink stain. 
  Mid-poem: show cumulative probability distortion. 
  Turn: "I checked the ledger" - probabilities unchanged. 
  End: the quiet horror of unchanged numbers. 

  Must resist rhyming - would trivialize the concept. Lean into tech metaphors ("circuitry of dread") since user's engineering background might appreciate that. The "weighted dice" image in the final stanza ties back to decision theory nicely. 

  Biggest risk is the percentages appearing too literally. Solution: embed them in physical sensations (gravity, walls) rather than just stating numbers. The 5% becomes "the floor giving way" - actual probability becomes irrelevant next to that visceral dread. 

  *checks user's stress points* 
  No philosophy jargon. No judgment about risk-aversion. Most importantly - the math must hold up if a decision theorist reads it. The cumulative probability transformation has to be accurate even when expressed poetically. 

  Final safeguard: after drafting, I'll count lines allocated to each outcome. If the 50% outcome gets more than 5 lines, I've failed.
answer: |-
  ## Weighted Scales

  Five percent: the floor gives way.
  Not likely? Irrelevant.
  The plummet yawns beneath the day,
  a gravity insistent, dense,
  a space that swallows sense.
  It stains the blueprint, thick and deep,
  a shadow where the foundations sleep.
  This tiny slice, this sliver thin,
  expands within, a vacuum pulling in.

  Fifteen percent: a wall leans hard.
  It wasn't meant to bear this load,
  this dread transferred, this shoddy card
  the five percent bestowed.
  It buckles now, its structure strained
  by borrowed weight, the fear ingrained.

  Thirty percent: a hesitant climb,
  a path less steep, but still defined
  by what might fall *behind*.
  The air feels thin, the view unclear,
  the memory of falling near.

  Fifty percent: the sunlit ground?
  A footnote, whispered, barely sound.
  A narrow ledge, a scant reprieve,
  where expectation dares to breathe
  but holds no weight, inspires no song.
  The bulk is gone, the wait too long.
  Its generous share, its likely grace,
  shrinks in this displaced, distorted space.

  I checked the ledger, cold and clean:
  The odds stood firm, unchanged, serene.
  The five still five, the fifty vast.
  No dice were loaded in the cast.
  The shift was mine, the lens applied:
  The worst-case outcome, magnified,
  not by its chance, but by the dread
  of all the futures lying dead
  beneath its fall. The weight accrued
  was cumulative, a magnitude
  drawn from the dark potential sum,
  a different math, a different drum.
  The probabilities stayed stone.
  The fear... the fear rewrote the throne.
  The weighted dice were in my head.
