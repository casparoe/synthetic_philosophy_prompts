answer: |-
  ### The Planner's Bypass  
  *(after the side-effect effect)*  

  **I.**  
  The city’s traffic snarled and stalled,  
  so the planner cut a road through the marsh.  
  He saw the surveys: fragile reeds  
  where the grebe laid eggs in the murky shallows.  
  The dredge would drain the nesting ponds.  
  He filed the note, then approved the draft.  
  The goal was flow, no other end.  
  The birds were just a footnote here.  
  He checked the box, assigned the crew.  
  The engines ground to life at dawn.  

  Verdict:  
  He meant the harm. It counts as done  
  *intentionally*.  

  **II.**  
  The city’s traffic snarled and stalled,  
  so the planner cut a road through the marsh.  
  He saw the surveys: fragile reeds  
  where the grebe laid eggs in the murky shallows.  
  The dredge would flood the nesting ponds.  
  He filed the note, then approved the draft.  
  The goal was flow, no other end.  
  The birds were just a footnote here.  
  He checked the box, assigned the crew.  
  The engines ground to life at dawn.  

  Verdict:  
  He meant no good. It came to pass  
  *unintentionally*.  

  **Reflection**  
  You read the case. You know the terms.  
  That verdict sticks—but why? His mind  
  held one aim plain. Is it his fault,  
  or yours, for leaning hard on *harm*?  

  ---

  ### Notes on the draft:  
  - **Vignette**: An urban planner diverts traffic through a marsh, foreseeing but indifferent to ecological side effects (drained ponds harm grebes in **I**, flooded ponds benefit them in **II**). Professional, institutional, avoids clichés.  
  - **Structure**: Two 10-line stanzas with 9 identical lines; only the outcome shifts (*drain* vs. *flood*). Verdicts diverge using *intentionally*/*unintentionally*, landing on the shared word "meant" (implying purpose in **I**, its absence in **II**).  
  - **Asymmetry**: Harmful outcome (**I**) elicits "intentional" verdict; beneficial (**II**) "unintentional," despite identical mental states.  
  - **Reader engagement**: The reflection questions whether the asymmetry stems from the agent’s mind or the reader’s blame/praise instincts, leaving it unresolved.  
  - **Plain diction**: No archaisms; unrhymed, rhythm-driven lines.  

  A Knobe specialist would identify **I** as the "intentional" case (harmful outcome) and **II** as "unintentional" (beneficial). A naive reader would feel the twist: same facts, same indifference—yet the moral weight of the outcome alone shifts the verdict.
