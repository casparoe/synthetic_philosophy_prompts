prompt: |-
  Alright, I need an actual number out of you, not a literature survey — I'm a philosopher of Chinese thought and I've been having a running argument with a colleague about Mencius and Xunzi, and I want to find out where the disagreement actually lives. Take the role of a professional philosopher who works on early Chinese ethics and is careful about translation and about what a disagreement even is. Before you give me anything, brainstorm out loud for a bit: list the plausible ways of reading the two of them, then commit.

  Here's the proposition I want a credence on: when Mencius says human nature (xing 性) is good and Xunzi says it's evil, they are making a genuine, substantive disagreement about the same subject matter, and are not just talking past each other. Call that claim S. I'm at about 0.55 on S; my colleague is at about 0.15 and thinks it's basically a verbal dispute once you notice they're using xing for different things. Give me your number on S and decompose it into the sub-questions it really hinges on: (a) what xing most plausibly picks out for each of them — an innate motivational endowment, or a disposition to develop in certain directions; (b) whether 'good', for Mencius, is a claim about innate motives (the sprouts) or only about the capacity to become good; (c) whether 'evil', for Xunzi, means actual selfishness or only that our desires outrun the norms, so that order has to be imposed from outside; (d) how much of the apparent disagreement is an artifact of the English word 'nature' doing work that xing doesn't do; and (e) whether some two-level reading — innate endowment vs. cultivated character — reconciles them, and if so whether that reading is faithful or just a rescue operation. Give a rough probability for each term and say how they combine.

  Then the part I really care about: tell me which of those terms my colleague and I most likely disagree about — i.e. which one, if we settled it, would move one of us to the other's number — and which sub-question your own number is most sensitive to. And here's a hypothetical I've been using to stress-test my intuitions; tell me how it should move things: imagine we discovered a human population whose members are innately indifferent to others' suffering but who pick up norms as easily as anyone — no sprouts at all, but fully cultivable. Would that vindicate Xunzi, vindicate Mencius on a capacity reading, or show that S was never the right question to begin with? A couple of lines on that, then your final number on S. And please don't hedge with "it depends what you mean by nature" unless you also tell me which disambiguation you're definately using.
