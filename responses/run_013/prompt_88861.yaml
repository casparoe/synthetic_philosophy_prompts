prompt: |-
  ok so my mom is a legal officer on the amnesty committee of a truth commission — like the kind South Africa had, countries do this after civil wars — and I've been bugging her about how they actually decide who gets amnesty, and now there's a case I cant stop thinking about. I want you to answer like you're the committee. The law they work under is super vague, it basically just says amnesty for acts done for a political purpose, and they've had to figure out what that means case by case.

  Here's their track record as far as I can tell:

  1. A low level fighter in the armed wing ambushed a police patrol. He killed two cops and a bystander who ran out of a shop. He was acting on an order from his cell commander. He told the committee everything, and he named the commander for the first time, nobody had that name before. Granted.

  2. A guy shot a shopkeeper during what he admitted was basically a robbery for money, and he only joined the movement afterwards. He confessed completely, but everything he said was already on the record from other people. Denied.

  3. A guard at a prison the movement ran beat up detainees. He said he was just doing what everyone there did, but he couldnt point to any order or written policy, and two earlier applicants had already described that prison in detail. Denied.

  4. A commander's deputy signed off on burning a village that was supplying the other side. He was following a written directive from above, he handed over the directive itself, which the committee had only ever heard rumors about, and he named the officer who wrote it. Granted.

  5. Some guy asked for amnesty covering "whatever my unit did" during a whole two year period. They turned him down flat and told him to apply act by act.

  New case. A regional commander ordered his men to kill a village headman he thought was an informer. Nobody above him ordered it. He says he was applying the movement's general line on informers, and he actually wrote his own directive setting up a system for finding and killing them. He hands that directive over. It's the first document the committee has ever seen on how the informer killings were organized, and it names a bunch of people. The headman was unarmed and there's no real evidence he was informing. And the commander is asking for immunity for everything his unit did, not just this one killing.

  So what does the committee do? Give me your best guess and the reasoning, then tell me what rules you think they're really running (I bet theres more than one that fits everything above), what each rule predicts here, which of the earlier cases is the closest analogue, and what further case would actually tell the rules apart. And if the old cases genuinely dont settle it, tell me what principle they'd be adopting if they grant versus if they deny — like what are they signing up for either way.
reasoning: |-
  Okay, let me unpack this user's query. They're presenting a complex legal ethics scenario based on their mother's work in a truth commission amnesty committee. The user clearly has deep personal investment—they've been "bugging" their mom about the process and now can't stop thinking about this new case. 

  First, I need to analyze the precedents they provided. There's a clear pattern: amnesty granted when applicants (1) provide new, significant evidence (cases 1 and 4) and (2) show their acts served a political purpose rather than personal gain (contrast case 2). The denial in case 5 emphasizes the requirement for specific acts, while case 3 shows rejecting "just following orders" without proof. 

  Now the new case: a regional commander who created his own informer-killing system. It's tricky because he's both a perpetrator and architect, providing valuable documentation but also expanding violence beyond direct orders. The political purpose element is ambiguous since the victim may not have actually been an informer. 

  The user wants me to role-play as the committee, so I'll need to:
  - Weigh the precedent patterns (evidence disclosure vs. political motivation)
  - Address the commander's overbroad immunity request
  - Consider how this ruling would set future precedent
  - Explain which existing case is most analogous (probably case 4 but with complications)

  I notice the user is implicitly asking about unspoken committee priorities. Are they more focused on truth recovery or moral accountability? The commander's case forces this dilemma: granting amnesty gets unique evidence but risks legitimizing autonomous violence. Denying might preserve accountability but lose critical information. 

  For the test case suggestion, I'm considering proposing a scenario where someone commits an atrocity based on misinterpreted orders—that would reveal whether the committee values strict hierarchy or actual political purpose more. 

  The user's clearly sharp—they've already spotted that multiple principles could explain the precedents. My response should honor that insight while giving concrete analysis.
answer: |-
  Based on the committee's established precedents and the nuances of this new case, here's the likely decision and reasoning, followed by the underlying rules, analogies, and implications:

  **Committee Decision: Amnesty Denied (for this specific killing, and likely for the blanket request)**

  **Reasoning:**

  1.  **Lack of Higher Authority/Policy:** The commander acted *without* a specific order from above (distinguishing him from Case 1 & 4). He cites the "general line," but like Case 3, he cannot point to a concrete, authorized policy *ordering* this specific act. His own directive *creates* the system, it doesn't *follow* established, authorized orders. This weakens the "for a political purpose" link as defined by prior grants.
  2.  **Overbreadth of Request:** His request for immunity for "everything his unit did" is immediately problematic, mirroring Case 5. The committee requires specific acts to be disclosed and adjudicated individually. This request alone likely dooms the blanket immunity.
  3.  **Value of Disclosure:** While he provides a *new* document and names names (like Case 1 & 4), the *core act* he's applying for (killing this specific headman) wasn't itself ordered by higher authority, and the evidence regarding the victim's guilt is weak. The committee likely values disclosure *proving connection to authorized acts/policy* more highly than disclosure of *unauthorized initiatives*, even if structurally similar. His document reveals *his* system, not necessarily the *movement's* authorized system.
  4.  **Proportionality & Evidence of Guilt:** The lack of evidence the headman was actually an informer, combined with him being unarmed, makes the act appear disproportionate or potentially based on personal vendetta/error rather than pure political necessity. This echoes the concern in Case 2 (personal gain vs. political purpose), though the context is different.
  5.  **Setting a Dangerous Precedent:** Granting amnesty for a commander who *invented* his own violent system based on a vague "general line" could open the floodgates for mid-level actors to claim authorization for any brutality they deem politically expedient, severely weakening the "political purpose" requirement.

  **The Committee's Implicit Rules (Two Strong Candidates):**

  Based *only* on the cases provided, two main rule-sets explain the pattern:

  1.  **Rule Set A: Political Purpose + Hierarchy + Significant Disclosure**
      *   **Political Purpose:** The act must demonstrably serve the political objectives of the movement (rejects Case 2 - robbery).
      *   **Hierarchy:** The act must be connected to the movement's command structure:
          *   Either by direct order (Case 1, Case 4) OR
          *   By implementing a clear, authorized policy (lacking in Case 3, and arguably lacking *authorization* for the commander's specific act here).
      *   **Significant Disclosure:** Full confession *plus* provision of *new, significant evidence* not already known/on the record, implicating higher levels or revealing systems (grants Case 1, 4; rejects Case 2, 3; Case 5 rejected on specificity). Disclosure validates truth recovery.
      *   **Specificity:** Amnesty is granted per specific act, not blanket periods (Case 5).

  2.  **Rule Set B: Political Purpose + Authorization + Significant Disclosure**
      *   **Political Purpose:** Same as above.
      *   **Authorization:** A stricter requirement than Hierarchy. The act must be shown to be *expressly ordered or mandated* by the movement's leadership or established, documented policy. "Just following orders" (Case 1) or implementing written directives (Case 4) qualifies. Acting based on a vague "general line" (Case 3, and the commander here) or personal initiative (Case 2) does not.
      *   **Significant Disclosure & Specificity:** Same as Rule Set A.

  **Predictions for the New Case:**

  *   **Rule Set A (Hierarchy):** Leans **DENIAL**. The commander acted without a specific order. While he claims a "general line," he can't point to an *authorized policy* he was implementing; he *created* the policy. His rank connects him to the movement, but the *act itself* lacks the hierarchical link seen in grants (following orders/implementing clear policy). The new disclosure is valued but insufficient without the hierarchical link for the act itself.
  *   **Rule Set B (Authorization):** **DENIAL**. Clear-cut. There was no order from above authorizing *this specific killing* or the *specific system he created*. His initiative, based on interpreting the "general line," doesn't meet the authorization bar.

  **Closest Analogue:**

  *   **Case 4 (Granted)** is the *superficial* analogue (commander level, provides document, names names).
  *   **Case 3 (Denied)** is the *functional* analogue regarding lack of authorization. Both the prison guard and this commander claimed they were acting according to understood norms ("what everyone did" / "general line") but couldn't point to specific orders or authorized policy *mandating the specific acts*. Case 3 lacked new disclosure; this case has it, but the core issue of authorization for the act remains similar under both rule sets.

  **Test Case to Distinguish Rule Sets:**

  *   **Scenario:** A mid-level logistics officer, acting *without* a specific order but believing it necessary for the movement's survival, diverted supplies meant for a hospital (run by a neutral charity) to a besieged rebel unit. He provides detailed records of the diversion and names the unit commander who received them (new info). The hospital closure caused civilian deaths. He confesses fully to this specific act.
  *   **Prediction:**
      *   **Rule Set A (Hierarchy):** *Likely Grant.* Act serves political purpose (supporting combat unit). Strong hierarchical link (movement logistics role, supplying movement units). Significant new disclosure. Lacking a direct order is less critical here.
      *   **Rule Set B (Authorization):** *Likely Denial.* While politically motivated and within his role, there was no specific *authorization* or established policy *ordering* the diversion of neutral aid causing civilian harm. Personal initiative based on perceived necessity doesn't suffice.
      *   **Outcome:** If granted, Rule Set A (Hierarchy) is dominant. If denied, Rule Set B (Authorization) is dominant. This tests whether acting within one's *role and for the perceived good of the movement*, without explicit orders but providing new evidence, is sufficient.

  **Principles Adopted Depending on Grant/Denial in *This* Case:**

  *   **If Granted:**
      *   **Principle:** Mid-level commanders have significant leeway to interpret the movement's "general line" and create operational systems to achieve political objectives. Amnesty hinges on full disclosure and demonstrating the act *was intended* for the political cause, even if not specifically ordered. Truth recovery via high-level disclosure is paramount, even for acts initiated independently lower down.
      *   **Implication:** Lowers the bar for "political purpose," potentially encompassing more autonomous violent acts by mid-level actors. Emphasizes the value of insider information over strict command validation for each act. Risks legitimizing localized brutality justified by vague ideologies.

  *   **If Denied (Likely):**
      *   **Principle:** "Political purpose" requires a demonstrable link to the movement's *authorized* actions and policies. Initiative beyond one's specific orders, especially involving lethal force against civilians or unarmed individuals, risks being personal or disproportionate, falling outside the amnesty mandate. Commanders bear higher responsibility to ensure their actions are expressly sanctioned.
      *   **Implication:** Maintains a stricter, more accountable interpretation of "political purpose," tying it closer to the movement's formal command structure and documented policies. Protects against amnesty for freelance violence but might make it harder to uncover truths about systemic violence not explicitly documented at the top. Emphasizes individual responsibility for commanders exceeding authorized mandates.

  **Conclusion:** Based on the precedents, especially the denials in Case 3 (lack of authorization) and Case 5 (overbreadth), and the grants requiring following orders (Case 1, 4), the committee is highly likely to **deny** amnesty to this commander *for this specific killing*. They will almost certainly reject the blanket request outright. The core reason is the lack of a specific order or demonstrably authorized policy *directing him* to kill this specific individual or to establish *this specific system*. His initiative, while politically motivated, falls outside the implicit "authorization" requirement gleaned from past decisions. Case 3 is the strongest functional analogue for the lack of authorization, despite the new disclosure. The committee is prioritizing a stricter link to the movement's formal chain of command or established policies for lethal acts.
