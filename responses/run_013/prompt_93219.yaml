  Hmm, their unspoken needs are clear: 
  - They need to discriminate between regurgitation and genuine understanding. 
  - They want the question to expose predictable bad answers (vague "knowledge is defeasible" claims, treating evidence types as identical, fence-sitting). 
  - The marking scheme must target specific failures while rewarding nuanced takes on whether the paradox equivocates between evidence types or challenges fallibilism. 

  Brainstorming angles: 
  First framing could ask whether Priya’s knowledge permits dismissing both evidence pieces, forcing students to distinguish testimony (direct counter-evidence) from memo (undermining evidence about grounds). Risk: Might still allow listing differences without engaging the paradox’s mechanism. 

  Second framing: "Does the paradox’s derivation work identically for both pieces of evidence?" Better—forces analysis of logical structure. Students might still dodge by describing without dissecting. 

  Third framing (sharpest): Demand they "exploit a disanalogy" between evidence types to resolve the paradox. This *requires* showing how the colleague’s testimony fits the paradox’s premise (evidence against P) while the memo secretly doesn’t (it’s evidence about Priya’s warrant, not P). Top answers would then argue this reveals the paradox relies on equivocation, and its residue exposes tension in fallibilism. 

  Model answer must commit: I’ll argue the paradox fails for the memo because it misapplies "evidence against P," but its persistence for testimony suggests knowledge *can* sometimes resist direct counter-evidence—pushing students to confront if that’s absurd or a feature (e.g., "if you *really* know, why revise?"). 

  Marking scheme traps: 
  - 5 points: (1) Identifying disanalogy (4 marks) → punish those who conflate evidence types. (2) Explaining why paradox fails for memo (6 marks) → crush vague "defeasibility" claims. (3) Addressing residual paradox for testimony (6 marks) → target fence-sitters. (4) Diagnosing root issue (5 marks) → penalize historical name-dropping. (5) Originality/insight (4 marks) → reward grappling with fallibilism’s costs. 

  Top answers will spot that the paradox’s "residue" isn’t a flaw but highlights knowledge’s asymmetry: it can’t be *undermined* by new meta-evidence (memo) without circularity, but *can* be overridden by direct counter-evidence (colleague)—forcing a stance on whether "knowing P" implies meta-ignorance about warrant. That’s the bite.
answer: |-
  ### 1. Exam Question (250 words)  
  **Question (25 marks):**  
  Priya knows (via thorough, expert examination) that a £40k discrepancy is a rounding artifact (P). She then receives two pieces of evidence:  
  (A) A trusted colleague asserts the discrepancy is fraud (~P).  
  (B) A memo reveals her software had a rare bug that can make fraud appear identical to a rounding artifact—casting doubt on whether her evidence reliably supports P.  

  The dogmatism paradox suggests Priya’s knowledge of P entitles her to dismiss *any* evidence against P as "misleading" (since P is true). **Does this license dismissing (A)? Does it license dismissing (B)?** Using Priya’s case, show whether the paradox’s reasoning applies *in the same way* to both (A) and (B). Then, argue what this reveals: does the paradox prove knowledge *cannot* be defeated by certain evidence (e.g., about its own reliability), or does it expose a flaw in the paradox’s core principle? **Take a clear stand; do not hedge.**  

  *(Spend ~15 min planning, 60 min writing, 15 min reviewing. Aim for 700 words.)*  

  ---

  ### 2. Model Answer (700 words)  
  Priya’s knowledge of P seemingly entitles her to dismiss both (A) and (B) under the dogmatism paradox: if P is known, any evidence against P must be misleading. Yet this reasoning equivocates between *types* of defeaters. It applies cleanly to (A) but collapses for (B), exposing the paradox’s dependence on conflating direct counter-evidence with undermining evidence about warrant.  

  **(A) The colleague’s testimony** is *direct counter-evidence* against P. The paradox’s reasoning holds here: if Priya *knows* P, then (A) *must* be misleading (since P is true). Dismissing (A) is thus internally consistent—if we accept the principle that knowledge justifies ignoring counter-evidence. This is the paradox’s "bite": it forces us to either accept dogmatism or reject the principle.  

  **(B) The software memo**, however, is not evidence against P but an *undermining defeater* for Priya’s *warrant* for believing P. It attacks the connection between her evidence (the ledger examination) and her conclusion (P). Crucially, the paradox’s principle—"knowing P entails knowing all counter-evidence is misleading"—does **not** apply here. The memo doesn’t claim ~P; it claims Priya’s grounds for P *could be unreliable even if P is true*. For example, the bug might exist *without* affecting this case. Thus, dismissing (B) *requires* Priya to assume her original examination was reliable—but this is precisely what (B) challenges. The paradox’s principle cannot resolve this; it presupposes the warrant it’s undermining. Applying it here is circular.  

  The disanalogy reveals the paradox’s sleight-of-hand: it treats *all* defeaters as direct counter-evidence, but (B) shows some defeaters target knowledge’s *structure*, not its content. This breaks the derivation. For (A), the paradox stands—but only by demanding we accept dogmatism. For (B), the paradox fails outright because its principle ignores how undermining defeaters operate.  

  **What remains?** The paradox’s persistence for (A) suggests it isn’t a *reductio* but a latent feature of fallibilism: if knowledge is fallible, how can *truly knowing* P justify ignoring counter-evidence? Yet (B) shows the paradox’s *general* principle is false—it cannot handle warrant-targeting defeaters. Thus, the paradox doesn’t prove knowledge is immune to evidence about reliability (like (B)); instead, it shows its own core premise is flawed. The residue for (A) is unsettling but tolerable: in practice, we rarely face decisive counter-evidence when knowledge is robust. But crucially, (B)-style defeaters *can* destroy knowledge without contradiction, proving fallibilism survives. The paradox’s "lesson" is that knowledge isn’t dogmatic toward self-undermining evidence—and its failure in (B) liberates us from taking its conclusion seriously in (A).  

  ---

  ### 3. Marking Scheme (25 marks total)  
  **Must-hit points (with typical failures):**  
  1. **Identifies disanalogy between (A) and (B)** [4 marks]  
     *Blown by:* Treating both as "evidence against P" without distinction.  
  2. **Explains why paradox fails for (B)**: Shows (B) undermines warrant, not P, making the paradox’s principle circular/inapplicable. [6 marks]  
     *Blown by:* Vague claims like "knowledge is defeasible" without targeting the paradox’s mechanism.  
  3. **Explains why paradox (seemingly) holds for (A)**: Accepts that *if* the principle holds, (A) can be dismissed. [6 marks]  
     *Blown by:* Denying dogmatism for (A) without engaging the paradox’s logic.  
  4. **Diagnoses the paradox’s core flaw**: Its principle equivocates counter-evidence (A) with undermining defeaters (B). [5 marks]  
     *Blown by:* Historical name-dropping or generic "some philosophers reject it."  
  5. **Takes a stand on implications**: Argues whether the paradox challenges fallibilism (via A) or exposes a false principle (via B’s failure). [4 marks]  
     *Blown by:* Hedging (e.g., "it depends") or listing options without commitment.  

  **What separates a first-class answer (70+%) from a strong upper-second (60-69%)?**  
  The top answer **leverages the disanalogy to attack the paradox’s validity**, showing how (B)’s failure reveals the principle’s false generality. Crucially, it argues that (A)’s persistence isn’t a *fatal* problem for fallibilism (e.g., by noting real-world knowledge rarely faces decisive counter-evidence). It also avoids treating (A) and (B) symmetrically—using (B) to *dissolve* the paradox’s threat rather than merely describing it. The upper-second answer identifies the disanalogy and implications but lacks this aggressive deployment of (B) to neuter the paradox’s broader significance.  

  ---  
  **Design notes**: This question forces engagement with evidence *types* to expose equivocation in the paradox. It punishes bluffing by demanding specificity on (B)’s mechanism and rewards originality for diagnosing how (B)’s failure defangs (A). The marking scheme explicitly targets the predicted bad answers. No citations needed—pure argument.
