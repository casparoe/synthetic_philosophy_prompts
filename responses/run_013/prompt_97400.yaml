prompt: |-
  I keep going back and forth with a friend about why promises bind, and I want to know what principle actually fits my gut verdicts. Here they are. I promise to meet someone for lunch and then a better offer comes up: I'm bound, breaking it is a genuine wrong. I promise my boss to work the weekend because he's clearly about to make my life hell if I don't: that doesnt bind me at all, it barely feels like a promise. I promise to help a friend dispose of a body (hypothetically): no pull whatsoever, the thing is just void. I promise my dying mother I'll finish her book, and then she dies: still bound, and this is one of the strongest ones, even though she can't be disappointed, can't rely on anything, and no one would ever know if I blew it off. I promise a guy I'll sell him my car, then find out he lied to me about why he wanted it: I feel off the hook, which surprises me, because I did give my word and he's still counting on the car. I promise a kid a trip to the zoo and the zoo turns out to be closed that day: still bound, but bound to do something, not that exact thing. And a promise I make to myself to run every morning -- no matter how much I let myself down, it doesn't feel like the same kind of thing at all. Is there one principle that gets all of these, or do I have to give one up? And what would it say about a promise made to someone who's already forgotten it -- do I owe them anything at all?
reasoning: |-
  Okay, the user is presenting a series of scenarios about promises and wants to know if there's a single principle that explains their gut feelings about each. Let me start by listing out each case they mentioned:

  1. Promise to meet for lunch: feels bound.
  2. Promise to work the weekend under duress: not binding.
  3. Promise to help dispose of a body: void, no obligation.
  4. Promise to dying mother to finish her book: strongly bound even after death.
  5. Promise to sell car, buyer lied: off the hook.
  6. Promise to kid about zoo, zoo closed: bound to alternative.
  7. Promise to self to run: not the same obligation.

  The user is debating with a friend about why promises bind and seeks a consistent principle. They might be looking for validation of their intuitions or a framework to resolve their debate. Their deeper need could be understanding moral philosophy, specifically deontology versus consequentialism, to make sense of their conflicting feelings.

  Looking at the scenarios, coercion (like the boss) and immorality (disposing a body) invalidate promises. Death doesn't remove obligation (mother's book), but deception (car buyer) does. Unforeseen circumstances (zoo closed) require alternative fulfillment. Self-promises lack interpersonal duty.

  The Scanlonian principle seems to cover these: promises create obligations when they induce reasonable reliance, but only if voluntary, moral, and not undermined by deception. Self-promises lack another person's reliance, hence no binding force. Forgotten promises might still hold if the promisee could reasonably rely on them, unless reliance is impossible.

  I should check each case against this principle. The boss scenario involves coercion, so not voluntary. The body disposal is immoral, so no obligation. The mother's book: her reliance is reasonable, and her death doesn't erase the duty. Car buyer lied, so reliance isn't reasonable. Zoo closed: the child still relies, so offer alternatives. Self-promise: no other person's reliance.

  Forgotten promises: if the promisee forgets, their reliance isn't reasonable, so maybe no obligation. But if they might remember later, perhaps the obligation holds. The principle hinges on whether the promisee's reliance is reasonable at the time of fulfillment.

  This principle seems consistent across all cases, so the user doesn't need to give up any intuitions. They might need examples of forgotten promises to test this. The key is reasonable reliance without coercion, deception, or immorality. This should resolve their debate by providing a clear framework.
answer: |-
  Your gut verdicts are remarkably consistent, and they align beautifully with a **Scanlonian Principle of Promising** (based on philosopher T.M. Scanlon). The core idea is:

  **A promise creates a binding obligation only if it reasonably induces reliance in the promisee, *and* the promisor voluntarily undertook that obligation under conditions that were not fundamentally defective (coercion, immorality, deception, or impossibility).**

  Let's break down how this principle explains each of your cases:

  1.  **Lunch Promise (Binding):** You voluntarily promised, inducing reasonable reliance (they plan their day, turn down other plans). Conditions are normal. **✓ Reliance Induced ✓ Voluntary ✓ No Defect**

  2.  **Work Weekend Under Duress (Not Binding):** This is classic **coercion**. Your "promise" wasn't truly voluntary; it was extracted under threat. The fundamental condition of free choice is missing. Your boss cannot reasonably rely on an agreement made this way. **X Not Voluntary (Coercion)**

  3.  **Help Dispose Body (Void):** The object of the promise is **inherently immoral/illegal**. Promises to perform immoral acts are void from the start. They cannot create a legitimate obligation. There is no "right" to rely on someone committing a crime. **X Defective Object (Immorality)**

  4.  **Promise to Dying Mother (Strongly Binding):** This is key. While your mother can't rely *after death*, the *act of promising* induced reliance *in her while she was alive* (giving her peace, comfort, meaning). Fulfilling the promise honors *that* reliance and the relationship it represented. It's also a voluntary commitment to a meaningful, moral act. **✓ Reliance Induced (At the time) ✓ Voluntary ✓ No Defect**

  5.  **Sell Car, Buyer Lied (Off the Hook):** The buyer's **deception** about his reason fundamentally vitiates the agreement. You made the promise based on false information he provided. His reliance is therefore *unreasonable* because it was induced by his own lie. The voluntary nature of your promise is undermined by the deception. **X Defective Conditions (Deception)**

  6.  **Zoo Closed (Bound to Alternative):** The *core reliance* you induced was the child's expectation of a special outing/fun experience related to the zoo. The *specific act* (entering the zoo) became impossible through no fault of your own. The obligation persists, but morphs into fulfilling the *reasonable expectation* you created – providing a comparable special outing/fun experience. **✓ Reliance Induced (Core expectation) ✓ Voluntary ✓ Defect (Impossibility of specific act) → Obligation shifts to reasonable alternative**

  7.  **Promise to Self (Not Binding in the Same Way):** This lacks the **interpersonal reliance** element. While breaking it might disappoint you, violate your self-trust, or be imprudent, you haven't induced reasonable reliance *in another person*. The moral force unique to promises stems from their impact *on others*. **X No Interpersonal Reliance Induced**

  **The Principle Summarized:** A promise binds when:
  *   It **reasonably induces reliance** in the promisee.
  *   It is made **voluntarily** (without coercion).
  *   It concerns a **morally permissible** act.
  *   The **conditions enabling the promise** are not fundamentally defective (no deception, initial impossibility, etc.).

  **The Forgotten Promise:**

  This tests the reliance principle. According to the Scanlonian view:

  *   **Did the promise *induce* reliance at the time?** Yes, presumably, when made.
  *   **Is the promisee's *current* reliance reasonable?** This is trickier.
      *   If the promisee genuinely *forgot* and is *not* relying on it (e.g., they made other plans assuming you wouldn't come), then *current* reasonable reliance might be absent. Fulfilling the promise might even *disrupt* their current (non-reliant) state.
      *   **However,** the *past* act of inducing reliance and the *relationship* context often create a *pro tanto* (defeasible) obligation. You *owe it to them* to check if they still expect it or would want it fulfilled, even if they forgot. The obligation isn't necessarily to perform the act blindly, but to *address the commitment you made*.
      *   **Example:** You promised to help a friend move on Saturday. They forget and hire movers. Showing up with your truck isn't helpful. Your obligation is to *inform them* ("Hey, I know you might have forgotten, but I promised to help move Saturday. Still need me, or are you set?") and be willing to follow through if they *do* remember and still need/want your help. You owe them the *respect* of acknowledging the promise. Blowing it off completely because they forgot feels like a violation of the original commitment made to them, even if it doesn't cause them *new* harm.

  **Therefore:** You likely *do* owe something to the person who forgot the promise – not necessarily the literal performance, but the respect of acknowledging the commitment and ensuring your non-performance doesn't harm them *because* they might suddenly remember or because it reflects poorly on your character within the relationship. The obligation shifts from pure performance to conscientious communication and respect for the past commitment.

  **Conclusion:** You don't need to give up any of your gut verdicts! The Scanlonian principle, centered on *voluntarily inducing reasonable reliance for a moral act under non-defective conditions*, explains them all elegantly. It also provides a nuanced answer for the forgotten promise, focusing on the residual duties of respect and communication stemming from the original act of promising. Your intuitions are philosophically sound!
