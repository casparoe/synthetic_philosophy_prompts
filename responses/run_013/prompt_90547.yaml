answer: |-
  ## The Demandingness Gauntlet: Does Consequentialism Survive?

  Your friend’s reductio – that consequentialism demands utter self-abnegation, rendering life meaningless – is a powerful gut punch. But while the demandingness objection highlights a deep tension, it doesn't deliver a knockout blow to act-consequentialism. Its force is real, yet ultimately survivable for a specific, psychologically attuned version of the theory. Let’s push on your four points.

  **1. Proportionality: Burden or Justice?** Consequentialism *does* demand more from those with greater capacity – wealth, skills, privilege. This proportionality isn't a flaw; it's arguably its core moral insight. The billionaire *should* give vastly more than the minimum-wage worker precisely because their capacity to alleviate suffering is exponentially greater. Is this unfair? Only if we mistake equality of *sacrifice* for moral fairness. The objection here often stems from an unspoken entitlement: "I earned this, so I deserve to keep it." Consequentialism rejects that moral shelter. The pain felt by the privileged asked to give up comforts is real, but it pales against the suffering alleviated. Consider **Sarah, our mid-career professional**: earning $150k, with a comfortable life, family, and a cherished but purely self-indulgent woodworking hobby. Consequentialism demands she donate a significant portion of her income (beyond necessities) to highly effective charities – perhaps 30-50% – drastically cutting discretionary spending, including frequent hobby upgrades. Her billionaire counterpart, **Elena**, must give away nearly her entire fortune, funding hospitals or malaria nets, retaining only what's needed for basic functioning and perhaps *some* minimal personal satisfaction to sustain effectiveness. This *is* demanding, especially for Elena, but it reflects the brutal arithmetic of need and capacity. The objection reveals discomfort with radical redistribution, not a logical flaw.

  **2. The Scalar Escape Hatch: Coherent but Costly?** Shifting to a scalar view ("better"/"worse" instead of "right"/"wrong") *does* technically dissolve the "too demanding" complaint. If there's no line marking "permissible," then "impermissibly demanding" vanishes. However, this move *is* costly. It surrenders the crisp, action-guiding force that makes deontological theories appealing. Saying "donating 90% is vastly better than donating 10%" is true, but leaves Sarah wondering, "Is my 30% *good enough*?" While coherent, scalar consequentialism risks becoming motivational quicksand. It addresses the *formal* demandingness objection by abandoning the very notion of obligation that fuels it. It survives the objection technically, but arguably becomes a less practical, less distinct moral guide.

  **3. The Mirror Objection: Misdirection?** The complaint that consequentialism demands actions but neglects character ("be cold and selfish, just donate!") is potent, but it's a *different* objection – perhaps "shallow character" or "motivational deficiency." It doesn't intrinsically strengthen the demandingness charge. Demandingness is about the *external burden* of required actions, not the *internal state* motivating them. One could argue that cultivating genuinely altruistic character traits *is* instrumentally valuable for long-term effectiveness (e.g., avoiding burnout, inspiring others). However, the core demandingness objection would still apply even to a saintly consequentialist: the saint would *still* feel the crushing weight of knowing that relaxing with their family meant foregoing saving a life elsewhere. The character objection highlights a potential psychological cost or moral shallowness, but it doesn't make the *actional demand* itself less severe. They are separable concerns.

  **4. Ought Implies Can & The Convenient Escape:** This is where consequentialism finds its most robust defense against demandingness as an *impossibility* objection. Consequentialism *is* formally committed to "ought implies can." If a demand is genuinely psychologically unsustainable – leading to burnout, collapse, or long-term *reduced* capacity to do good – then fulfilling that demand *cannot* be optimific. **For Sarah**, working 80-hour weeks while donating 50% and neglecting her family might break her within a year. Consequentialism demands she find a *sustainable* level of giving and action that maximizes good *over her lifetime*. This likely includes moderate leisure (like her woodworking) to maintain mental health and family bonds, crucial for her stability and capacity. It *demands* she structure her life for long-term impact, which requires self-care. Is this suspiciously convenient? Only if we assume sustainability is always invoked cynically. The theory itself provides the metric: if collapsing means donating $0 next year, donating $20k/year sustainably is objectively better than donating $50k once and then nothing. The "escape hatch" is inherent in the optimization principle, not an ad-hoc fix. The trick lies in honest self-assessment, avoiding self-serving bias masquerading as necessary self-care.

  **Verdict:** The demandingness objection does **not** sink a psychologically realistic act-consequentialism that rigorously incorporates "ought implies can" through the lens of long-term, sustainable optimization. It lands heavily on crude versions demanding immediate, maximal sacrifice regardless of human limits, rendering *those* versions implausible. However, a sophisticated act-consequentialism survives by demanding continuous, significant, capacity-proportional sacrifice *within the bounds of sustainable effectiveness*. The objection’s power lies not in exposing a fatal flaw in the theory itself, but in revealing the profound discomfort – and perhaps the tragic reality – inherent in taking global suffering seriously. The problem isn't primarily our broken psychology (though self-deception is a hurdle); **it's definitively that the world *is* bad enough that a demanding morality is the correct response.** Consequentialism forces us to confront the uncomfortable truth that our comfort often exists alongside immense, preventable suffering, and that morality, rightly understood, requires us to bridge that gap to the very limit of our sustainable capacity. Your friend finds this "insane" because the implications *are* existentially jarring; but that doesn't make the theory wrong, only challenging.
