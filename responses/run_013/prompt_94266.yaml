prompt: |-
  At a departmental workshop last term, two colleagues — one working in philosophy of medicine, the other a social epistemologist — spent most of an evening arguing over a case I had put to them, and I have not been able to settle it since. I would like you to adjudicate their exchange move by move rather than pronounce a winner in the abstract.

  The case. A regional health authority pilots a "care navigation score" that ranks patients for a scarce resource: the top fifteen percent receive a care coordinator. The score has three inputs — diagnostic codes, laboratory values, and "narrative flags," which are phrases the intake clinician selects from a fixed list of forty maintained by the authority (items like "reports fatigue," "anxious presentation," "pain out of proportion"). The list is published; the weights are not. "Pain out of proportion" was placed on the list as a marker of possible somatization and carries a substantial negative weight, which the intake clinician does not know. A patient with a poorly characterized illness describes her symptoms at length. The clinician believes her completely, and her note, read as a whole, records the account faithfully; but the closest item on the list is "pain out of proportion," so she enters it. The patient's score falls below the cutoff. She never sees the score or the phrase, and no one reviews the entry.

  Their exchange ran as follows.

  (1) The philosopher of medicine: This is testimonial injustice. The patient's word is deflated by a prejudice about who exaggerates pain; that the deflation is performed by a form rather than by a person is irrelevant, since the form was designed by people and the design carries the prejudice. The wrong is to her credibility.

  (2) The social epistemologist: No one disbelieves her. The clinician believes her fully and records her account accurately. What fails is the vocabulary: the only items available to the clinician distort what the patient says, so she must choose between being unintelligible to the institution and being misdescribed by it. That is the paradigm of hermeneutical injustice — a gap in the interpretive resources available to her as a patient. Note, too, that the clinician is herself kept in the dark about the weights; the failure lies in the resource, not in any hearer's attitude.

  (3) The philosopher of medicine: Hermeneutical injustice requires that the gap lie in the shared resources, arising from the unequal power of groups to shape the common vocabulary. Here the vocabulary is adequate — the patient's own words exist and the clinician understands them. What is missing is uptake, not resources. That is a distinct phenomenon and deserves its own name: receptive injustice, meaning a systematic distortion in the reception of testimony that is fully believed, where no hearer's credence is misallocated but the record that results misrepresents the speaker.

  (4) The social epistemologist: That is a distinction without a difference, and it trivializes the concept — on that standard every bureaucratic paraphrase becomes an injustice. A case counts as epistemic injustice only if the harm falls on the person's capacity as a knower, on her standing as a participant in the exchange of reasons, rather than merely on the accuracy of some representation of her.

  (5) The philosopher of medicine: But a misrepresentation you cannot see, appeal, or even learn about damages you precisely as a participant: you are shut out of the process that decides what is known about you. And your own criterion is unavailable to you — if structural cases count as epistemic injustice, as you have argued, then in your view too it is the wronged knower's standing, not a wronging hearer, that does the work. So the requirement you are imposing on my proposal is one your own position cannot meet.

  (6) The social epistemologist: Even granting that, "receptive injustice" earns nothing. Everything you want to say can be said with the two familiar categories plus an account of institutional design. A new category should be introduced when it explains something the old ones cannot, and you have not produced a case in which the old vocabulary fails.

  What I want from you is a point-by-point adjudication, not a survey of the literature. First, for each of moves (1) through (6), say whether it is sound, sound but overstated, or mistaken, and give your reasons in a sentence or two — including, where a move is overstated, what the defensible core of it is. Second, answer the substantive questions the exchange turns on: (a) which of the two initial diagnoses, (1) or (2), better locates the wrong in this case; (b) whether receptive injustice earns its keep as a third kind, and if it does, what a case would have to look like to distinguish it from both familiar kinds, and if it does not, which familiar kind absorbs it; (c) whether the "capacity as a knower" criterion in (4) is defensible as a necessary condition for epistemic injustice, and whether move (5) succeeds in turning that criterion against its author; and (d) whether the fact that the clinician is also kept ignorant of the weights changes the diagnosis or merely adds a second complaint. Third, say what each of the two is missing — the consideration that, once noticed, would force each to revise a claim they actually made. Finally, give an overall verdict on who has the better of the argument, and state plainly what would have to be true of the case for the opposing side to be right. Do not resolve the dispute by awarding each party half of it; if a move fails, say so.
reasoning: |-
  Hmm, the user presents a complex philosophical debate about epistemic injustice in a healthcare case. They want me to adjudicate each move in their colleagues' argument rather than give a general opinion. The case involves a patient whose symptoms get miscoded as "pain out of proportion" in a system, lowering her care priority without anyone disbelieving her testimony.

  First, I need to unpack the exchange carefully. The philosopher of medicine argues this is testimonial injustice because the system design carries prejudice against certain patients. The social epistemologist counters it's hermeneutical injustice - a vocabulary gap in the institution's interpretive resources. Their debate evolves into whether we need a new category called "receptive injustice" for systematic distortions in testimony reception without credibility deficits.

  The user wants very specific responses: judgment on each of the six moves, answers to four substantive questions (a-d), identification of what each colleague is missing, and a clear verdict. No fence-sitting allowed - I must pick which side has the better argument.

  For move (1), the testimonial injustice claim seems mistaken because no hearer actually discounts the patient's credibility - the clinician believes her fully. The prejudice exists in the system design, but Fricker's original concept requires active credibility deficit by a hearer.

  Move (2) about hermeneutical injustice is sound but overstated. While there's certainly a vocabulary gap in the institution's fixed menu, the patient and clinician share adequate interpretive resources between them - the problem is the system's failure to receive that understanding.

  Move (3) introducing "receptive injustice" as a new category seems sound. The core idea - systematic distortion in testimony reception without credibility deficit - captures something distinct from both existing injustices. The "uptake failure" concept is defensible.

  Move (4)'s "capacity as a knower" criterion is defensible but misapplied here. The social epistemologist is right that epistemic injustice should harm someone as a knower, but wrong to think this case doesn't qualify - the patient is excluded from knowledge processes about herself.

  Move (5) brilliantly turns the criterion against its proposer. If structural cases count (as the social epistemologist likely accepts), then this patient's standing as a knower is indeed harmed by being shut out of the scoring process.

  Move (6) dismissing the new category seems mistaken. The proposed "receptive injustice" explains institutional distortion mechanisms that neither testimonial nor hermeneutical injustice fully capture.

  For the substantive questions: (a) neither initial diagnosis is perfect, but hermeneutical injustice comes closer if we consider the institutional resource gap; (b) "receptive injustice" earns its keep as a third category for system-level uptake failures; (c) the "capacity as a knower" criterion is defensible and move (5) successfully weaponizes it; (d) the clinician's ignorance adds a second complaint about institutional opacity.

  The philosopher misses that the vocabulary gap does contribute (it's not pure reception failure), while the social epistemologist misses that system design can wrong knowers without vocabulary gaps. Overall, the philosopher of medicine has the stronger argument - particularly for recognizing a distinct institutional harm pattern. The social epistemologist would need to show the patient wasn't harmed as a knower to win, which seems impossible given the covert scoring.
answer: |-
  Here is a point-by-point adjudication of the exchange, addressing all requested elements:

  ### Adjudication of Moves (1) to (6)
  1.  **Philosopher of Medicine (Testimonial Injustice): Mistaken.**  
      *Reason:* Testimonial injustice (per Fricker) requires a hearer's credibility deficit due to prejudice. Here, the clinician (the hearer) believes the patient fully and records faithfully. The prejudice is embedded in the *system's design* (weighting), not in the clinician's attitude. The harm arises from institutional reception, not interpersonal disbelief.  
      *Defensible core:* The system encodes prejudice harming credibility, but the *mechanism* isn't testimonial injustice.

  2.  **Social Epistemologist (Hermeneutical Injustice): Sound but Overstated.**  
      *Reason:* Hermeneutical injustice involves a gap in *shared* hermeneutical resources disadvantaging a group. Here, the patient and clinician share adequate resources—the clinician understands the testimony—but the *institution* lacks adequate categories for uptake. The vocabulary gap is institutional, not societal.  
      *Defensible core:* The fixed menu creates a distortion in institutional interpretation, but this is not a *hermeneutical gap* in the Frickerian sense (which requires collective interpretive disadvantage).

  3.  **Philosopher of Medicine (Receptive Injustice): Sound.**  
      *Reason:* This identifies a distinct harm: systematic distortion in *institutional reception* of testimony, despite full belief by the hearer and adequate shared vocabulary. The harm is to accurate uptake, not credibility or shared hermeneutical resources. This is a defensible new category for institutional epistemic wrongs where systems misrepresent testimony without disbelief.

  4.  **Social Epistemologist ("Capacity as a Knower" Criterion): Sound but Overstated.**  
      *Reason:* The criterion that epistemic injustice must harm one "as a knower" (e.g., undermining participation in knowledge practices) is defensible as a necessary condition. However, calling the distinction "trivial" is overstated—bureaucratic misrepresentation *can* harm knowers if it excludes them from epistemic processes.  
      *Defensible core:* Epistemic injustice must impact epistemic agency, not just accuracy; but this case *does* impact agency (as move 5 argues).

  5.  **Philosopher of Medicine (Turning the Criterion): Sound.**  
      *Reason:* The move successfully argues that the patient is harmed *as a knower*: she is excluded from the process determining institutional knowledge about her, cannot appeal, and is denied agency. If structural cases count (as social epistemologists often concede), this meets the "capacity as a knower" criterion. The social epistemologist's requirement *is* met here.

  6.  **Social Epistemologist (Against New Category): Mistaken.**  
      *Reason:* "Receptive injustice" explains a gap: institutional distortion *without* credibility deficit (testimonial injustice) *or* hermeneutical gap (hermeneutical injustice). The existing categories cannot capture this, as testimonial injustice requires a hearer's prejudice, and hermeneutical injustice requires a lack of shared concepts. This case shows the old vocabulary fails.

  ---

  ### Substantive Questions
  **(a) Which initial diagnosis (1 or 2) better locates the wrong?**  
  Neither is fully adequate, but (2) (hermeneutical injustice) is closer. The core wrong is the *institution's* inadequate interpretive resources (fixed menu), not interpersonal credibility deficit (1). However, it is overstated since the societal/hermeneutical gap isn't proven.

  **(b) Does "receptive injustice" earn its keep?**  
  Yes, as a third category. A case distinguishing it must:  
  - Involve testimony fully understood/believed by the hearer (ruling out testimonial injustice).  
  - Use shared interpretive resources (ruling out hermeneutical injustice).  
  - Still distort testimony systematically due to institutional reception mechanisms (e.g., bureaucratic categorization/weighting).  
  *This case satisfies all three.* If rejected, it would be absorbed into a *structural* extension of hermeneutical injustice (focusing on institutional, not societal, resources).

  **(c) "Capacity as a knower" criterion and move (5):**  
  - The criterion **is defensible** as necessary for epistemic injustice (distinguishing it from mere misrepresentation).  
  - Move (5) **succeeds** in using it against its author. The patient *is* harmed as a knower: she cannot participate in, contest, or even access the knowledge generated about her, undermining her epistemic agency.

  **(d) Clinician's ignorance of weights:**  
  This **adds a second complaint** (opacity in institutional design affecting the clinician's epistemic agency) but does not change the primary diagnosis for the *patient*. The patient's harm stems from the menu's inadequacy and the hidden weight; the clinician's ignorance compounds institutional failure but is separable.

  ---

  ### What Each Is Missing
  - **Philosopher of Medicine:** Misses that the **fixed menu is itself a hermeneutical limitation** at the institutional level. While uptake is the core issue, the vocabulary gap enables the distortion.  
  - **Social Epistemologist:** Misses that **institutional design can wrong knowers without hermeneutical gaps or credibility deficits**. The system's hidden weighting and lack of review harm epistemic agency *structurally*, even with adequate shared concepts.

  ---

  ### Overall Verdict
  **The Philosopher of Medicine has the better argument.**  
  - They correctly identify a distinct harm ("receptive injustice") that existing categories cannot fully capture.  
  - They successfully refute the social epistemologist's objections, showing the patient is harmed as a knower and that structural cases meet the proposed criterion.  
  - Their analysis better explains the institutional mechanics and the specific harm of misrepresentation without disbelief.  

  **For the Social Epistemologist to be right**, the case would need:  
  1. A genuine *societal* hermeneutical gap (e.g., no words exist for the patient's experience in the broader culture), OR  
  2. Evidence that the clinician *disbelieved* the patient due to prejudice (neither is true here).  

  **Final Note:** The case demonstrates a *structural epistemic injustice* best conceptualized as "receptive injustice" (systematic distortion in testimony reception by institutions), which is irreducible to the two classic forms.
