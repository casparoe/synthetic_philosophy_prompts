answer: |-
  Here is my credence decomposition for the proposition, grounded in computational complexity and debate mechanics, with justifications focused on core difficulties rather than literature surveys. My overall credence is **0.18**, with the dominant doubt in (iii). I explain key disagreements and what could shift my view.

  ---

  ### (i) **Determinate Truth Values**  
  **Credence: 0.85**  
  *Justification*: Most high-stakes debate topics (e.g., "This code has a backdoor," "This policy causes 1M deaths") involve empirical or mathematical claims where verification is theoretically possible given unlimited compute. While "judgment calls" exist (e.g., aesthetic preferences), debate protocols would target falsifiable claims to avoid moral/political subjectivity. Doubt arises from vague real-world predicates (e.g., "safe"), but I assume these are operationalized.  

  ### (ii) **Buried Errors in Stepwise Arguments**  
  **Credence: 0.75**  
  *Justification*: If dishonesty involves a locally invalid inference or false lemma in a logical chain, refutation is finding the flaw's location. For a claim of length *L*, the honest debater can force a binary search over steps, exposing the flaw in *O(log L)* time. This scales sub-linearly and satisfies the constant-factor requirement. Doubt stems from adversarial step obfuscation, but recursive scrutiny counters this.  

  ### (iii) **Selective Presentation (Omissions)**  
  **Credence: 0.20**  
  *Justification*: Here, the dishonest argument is valid but incomplete, missing critical context (e.g., hiding edge cases in a proof). Refutation requires *supplying the omitted information*, which may demand reconstructing an entire alternative argument. If the omission size is *k*, the refutation could be *Ω(k)* steps—and *k* may grow with problem complexity (e.g., omitted security constraints in a 1000-step protocol). **This is the crux**: I see no general bound on how much context must be restored to invalidate a cherry-picked fact.  

  ### (iv) **Finding Short Refutations Efficiently**  
  **Credence: 0.70**  
  *Justification*: Assuming (i)-(iii) hold, superhuman models can likely search the refutation space (e.g., via counterexample synthesis or constraint solving) faster than brute force. However, strategic dishonesty could induce combinatorial traps (e.g., "Which of 1000 omitted premises did I exploit?"). Resource limits add risk, but I discount this lightly given asymmetric advantages of honesty.  

  ---

  ### **Combined Credence: 0.85 × 0.75 × 0.20 × 0.70 ≈ 0.18**  
  - **Most sensitive term**: (iii) Selective presentation (elasticity ≈ 3×). Halving my doubt in (iii) to 0.40 would raise overall credence to 0.36; doubling doubt to 0.10 lowers it to 0.09.  

  ---

