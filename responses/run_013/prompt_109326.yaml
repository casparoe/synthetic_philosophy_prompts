  ## The Pasadena Paradox: A Fracture in the Foundation of Expected Value?

  The Pasadena game and its Altadena variant present a fascinating and profound challenge to the cornerstone of modern decision theory: expected value (EV) maximization. The core issue is stark: the Pasadena game's expected value, given by the alternating harmonic series (1 - 1/2 + 1/3 - 1/4 + ...), is only conditionally convergent. Riemann's rearrangement theorem guarantees that by reordering the terms (i.e., changing the sequence of potential game outcomes considered), we can make the series sum to *any* real number, positive infinity, or negative infinity. Consequently, the EV is fundamentally undefined. The Altadena game, offering the Pasadena payoff plus a fixed $1, inherits this undefinedness. This essay argues that this undefined EV is a *real and significant problem* for decision theory, exposing a limitation in the standard EV framework and demanding either a refined concept of value or alternative decision rules. The biased coin extension further illuminates the nature of the issue, suggesting it is not merely a negligible pathology.

  **The Problem: More Than an Edge Case**

  Dismissing the Pasadena game as "not a legitimate option" because its EV is undefined is unsatisfactory for several reasons:

  1.  **Intuitive Preference:** A rational agent *should* strictly prefer Altadena to Pasadena. Altadena provides the *exact same* sequence of potential outcomes as Pasadena, *plus* an additional $1 in every single possible world (i.e., for every sequence of flips ending in heads). This constitutes **statewise dominance**. Regardless of the coin flip sequence, the agent ends up with exactly $1 more playing Altadena. Statewise dominance is one of the most fundamental and uncontroversial principles in rational choice. If decision theory cannot capture this clear preference, it has a serious deficiency.
  2.  **Practical Relevance:** While the infinite series causes the formal problem, the game can be played in practice. An agent must make a choice knowing that the game *will* terminate in finite time (with probability 1) and yield a specific payoff. Decision theory should guide this choice.
  3.  **The Altadena Comparison:** The inability to compare Pasadena and Altadena using EV highlights the problem's immediacy. We have two concrete options: one strictly dominates the other in every conceivable outcome, yet standard EV theory throws its hands up and says they are incomparable. This is deeply counterintuitive and practically useless.

  **Seeking Solutions: Alternative Decision Rules**

  If standard EV fails, what alternatives exist?

  1.  **Finite Horizons & Truncation:** Evaluate the game based on the expected value after a large but finite number of flips `N` (i.e., assume tails `N` times in a row forces a $0 payoff or termination). As `N` increases, the EV for both games converges. Crucially, for *any* finite `N`, Altadena has an EV exactly $1 higher than Pasadena. This robustly justifies a strict preference for Altadena. **Confidence: High (95%).** This approach is practical, aligns with dominance, and avoids infinitary pathologies. *Least Confident Point:* Is there a single "correct" way to choose `N`? While the limit behavior is clear, the justification for *any specific large N* as a proxy for the infinite game feels slightly pragmatic rather than purely principled.
  2.  **Statewise Dominance:** As argued above, this principle alone dictates a strict preference for Altadena over Pasadena. This rule sidesteps summation issues entirely. **Confidence: High (90%)** for this specific comparison. However, statewise dominance is a weak rule; many interesting choices (e.g., high-risk vs. low-risk investments) involve trade-offs it cannot resolve.
  3.  **Stochastic Dominance:** Altadena exhibits first-order stochastic dominance over Pasadena. For any payoff amount `x`, the probability of winning *at least* `x` is always greater than or equal to (and strictly greater for some `x`) under Altadena. This is a stronger and widely accepted rationale for strict preference. **Confidence: High (90%).**
  4.  **Regularization/Summation Methods:** Impose a specific order of summation (e.g., the "natural" order corresponding to the game progression) or use a summation method like Cesàro or Abel summation that assigns the "correct" value (ln 2 and ln 2 + 1). **Confidence: Low (40%).** While yielding the intuitive values, this feels ad hoc. *Why* privilege the natural order over another rearrangement? Riemann's theorem shows no order is canonical. This approach papers over the undefinedness without truly resolving the foundational issue of how value is aggregated across states when conditional convergence arises.
  5.  **Relative Value Comparison:** Compare the difference in payoffs statewise. Since Altadena - Pasadena = $1 in *every* state, the *difference* in value is unambiguously $1. Thus, Altadena is worth $1 more. **Confidence: Medium (75%).** This is elegant but requires accepting that the absolute value of each game is undefined while their difference is perfectly well-defined. This challenges how we usually assign value to options.

  **The Biased Coin: Illuminating the Fracture**

  Introducing a biased coin (P(heads) = `p`) is highly revealing:

  *   **p > 1/2:** The series for EV is absolutely convergent. The EV is well-defined and finite: `(p/(1-p)) * ln(3 - 2p)`. Decision theory works seamlessly.
  *   **p = 1/2:** Conditional convergence. EV undefined. Decision theory breaks down.
  *   **p < 1/2:** The series diverges (to +∞ if we sum positive terms first, -∞ if negative). EV is undefined in a stronger sense.

  This bifurcation is crucial. It demonstrates that the problem at `p = 1/2` is **not a "measure-zero pathology"** easily dismissed. Instead:

  1.  **Discontinuity:** The EV function exhibits a profound discontinuity at `p = 1/2`. For `p` arbitrarily close to 1/2 (but >1/2), the EV is well-behaved and close to `ln(2) * (p/(1-p))`. Yet *exactly* at `p=1/2`, the value ceases to exist. This isn't a minor kink; it's a complete failure of definition. This discontinuity signifies a fundamental change in the mathematical nature of the value aggregation process at the fair coin point.
  2.  **Revealing the Core Issue:** The biased case highlights that the problem at `p=1/2` arises precisely because the probabilities `(1/2)^n` decay at *exactly* the rate needed to make the alternating payoff series `(-1)^{n-1} * 2^n / n` conditionally convergent. Slightly faster decay (`p>1/2`) ensures absolute convergence; slightly slower decay (`p<1/2`) causes divergence. The fair coin sits precisely on the knife-edge where the aggregation of infinite, state-dependent value loses its objective meaning due to non-absolute convergence. This isn't an artifact; it's an inherent property of how value is defined in this specific infinite setting under these specific probability and payoff structures.

  **Conclusion: A Real Problem Demanding Attention**

  The undefined expected value in the Pasadena game is a *real problem* for decision theory. It is not merely a mathematical curiosity to be swept aside by declaring the game "illegitimate." The failure to capture the unequivocal preference for Altadena over Pasadena, grounded in statewise and stochastic dominance, exposes a genuine limitation of the standard expected value framework when dealing with conditionally convergent series arising from infinite state spaces. The discontinuity at `p=1/2` in the biased version confirms this is a significant issue related to the precise interplay of probabilities and payoffs in infinite settings, not a negligible pathology.

  While standard EV maximization fails, rational choice is not impossible. **A rational agent should strictly prefer Altadena to Pasadena.** This preference is robustly justified by:
  *   **Statewise and Stochastic Dominance:** Fundamental principles untouched by summation ambiguities.
  *   **Finite Truncation:** Any practical implementation or evaluation over finite horizons yields a clear $1 advantage for Altadena, and this advantage persists in the limit.
  *   **Relative Value:** The difference in value is unambiguously $1.

  The Pasadena paradox forces us to acknowledge that the standard definition of expected value, while immensely powerful and usually sufficient, is not universally applicable. It highlights the need for careful consideration of convergence when dealing with infinite state spaces and complex payoff structures. In such cases, decision theory must rely on more foundational principles like dominance or employ practical approximations like finite truncation. The discontinuity at `p=1/2` serves as a stark mathematical warning: when aggregation across infinite possibilities hinges on conditional convergence, the very concept of "expected value" can fracture, demanding a more nuanced approach to rational choice. The problem is real, but rationality, fortified by dominance and practical reasoning, can still provide clear guidance.
