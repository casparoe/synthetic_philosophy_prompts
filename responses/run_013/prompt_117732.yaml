prompt: |-
  I teach a graduate seminar on explanation in economic history and I am writing the take-home final. Draft a single essay question that asks students to decide whether the question of why Britain, rather than China, was the first to break into sustained intensive growth is well posed, and that cannot be answered by reciting the standard positions or by listing causes on either side. Build it around an apparatus I will hand out with the exam: call a contrastive why-question well posed only if (a) both terms of the contrast belong to a single contrast class of cases that could have occupied the outcome position, (b) the contrast is not merely two independent singular why-questions run together, and (c) facts about the foil case bear on the answer in some way other than being the negation of facts about the target case. The question should require students to say which condition the Britain-and-not-China formulation most plainly violates, whether that failure is fatal or repairable, and what the best reformulation would be, including whether recasting it as a question about why sustained growth began at all, or why it began in northwestern Europe rather than the Yangzi Delta, changes what counts as a good answer. A strong answer will say what any well-posed contrastive question about the divergence would have to specify, such as the unit of analysis, the time window, and the contrast class, and will explain how hindsight and selection on the outcome can make some formulations immune to evidence. Give me the question, a model answer of about 700 words, and a marking scheme naming five moves an A answer must make, five marks each, together with the specific errors that should cost marks, for instance reading the question as a request for a list of British advantages or supposing that the mere existence of a contrast class settles well-posedness. The model answer must not rest on naming particular historians or their books; it should argue from the apparatus and from considerations students can reconstruct. Write it all in continuous prose, with no headings, bullet points, bold, or tables, just the question, then the model answer, then the marking scheme, the way you would set it out in an email.
reasoning: |-
  Okay, the user is teaching a graduate seminar on explanation in economic history and needs help drafting a take-home final essay question. They want a question that challenges students to evaluate whether the classic "Why Britain not China?" divergence query is well-posed using a specific philosophical apparatus about contrastive questions. 

  First, I need to unpack their requirements carefully. The apparatus has three conditions for well-posed contrastive questions: (a) both cases must belong to a single contrast class of possible outcomes, (b) it shouldn't just be two separate why-questions glued together, and (c) facts about the foil case (China) must matter beyond just being the opposite of Britain's traits. The question should force students to identify which condition is violated, discuss if it's fixable, propose better formulations, and address how reframing (e.g., "Why Europe not Yangzi Delta?") changes explanatory demands.

  The user clearly wants to push students beyond textbook narratives. They're frustrated with superficial "list-of-causes" answers and want meta-level thinking about question-framing itself. The marking scheme should penalize exactly that - like students who just parrot Pomeranz or list British advantages instead of engaging the apparatus. 

  For the model answer, I'll need to:
  - Show how "Britain vs China" breaches condition (b) by treating them as isolated puzzles
  - Argue this flaw is fatal because it creates asymmetric explanations
  - Propose reformulations that meet all conditions, like "Why core European regions not core Asian regions post-1750?" 
  - Explain how such framing requires specifying unit (regional), timeframe (1750-1850), and contrast class (advanced pre-industrial cores)
  - Discuss how "Why growth at all?" avoids contrast class issues but invites teleology 

  The marking scheme must reward: 
  1. Correctly identifying violated condition (b) 
  2. Judging it fatal with reasoning 
  3. Offering valid reformulation 
  4. Specifying parameters for any good divergence question 
  5. Explaining hindsight bias risks

  And dock marks for:
  - Mistaking this as invitation to list causes 
  - Thinking any contrast class suffices without justification 
  - Ignoring how foil-case facts must actively constrain explanations 
  - Not seeing how reformulations alter explanatory burdens

  This is sophisticated stuff - exactly what a grad seminar should demand. The model answer will need tight philosophical reasoning while staying accessible. I'll avoid name-dropping historians (per request) and focus on reconstructible logical points. Time to craft something that would make a rigorous economic historian proud.
answer: |-
  **Essay Question**  
  Consider the contrastive question, "Why did Britain, rather than China, achieve sustained intensive growth first?" Using the apparatus provided for evaluating well-posed contrastive why-questions—which requires that (a) both terms belong to a single contrast class of plausible alternatives, (b) the question is not merely two independent singular why-questions conflated, and (c) facts about the foil case (China) must bear on the answer in a way beyond merely negating facts about the target case (Britain)—assess whether this formulation is well posed. Identify which condition it most plainly violates, argue whether this flaw is fatal or reparable, and propose the best reformulation. Your reformulation should consider alternatives such as "Why did sustained intensive growth begin at all?" or "Why did it begin in northwestern Europe rather than the Yangzi Delta?" and explain how these reframings alter what constitutes a good answer. A strong response will specify what any well-posed contrastive question about the 'Great Divergence' must define (e.g., unit of analysis, temporal scope, contrast class), and address how hindsight bias or selection on the outcome can render some formulations immune to empirical testing.  

  ---

  **Model Answer** (700 words)  

  The question "Why Britain, not China?" violates condition (b) most plainly: it conflates two independent singular why-questions—"Why did Britain achieve sustained growth?" and "Why did China not achieve it?"—into a single contrastive form without ensuring their interdependence. This flaw arises because the question treats Britain and China as atomized units, ignoring whether their trajectories were ever meaningfully comparable within a unified explanatory framework. Britain’s 18th–19th century industrialization and China’s Qing-era economic dynamics are often analyzed through distinct causal narratives (e.g., British institutions vs. Chinese resource constraints), making the "contrast" an artificial juxtaposition of separate puzzles. Condition (b) demands that answers to one side of the contrast constrain answers to the other; here, explaining Britain’s success rarely requires specifying why China "failed," as China’s trajectory might stem from unrelated causes.  

  This violation is fatal, not reparable, within the original framing. Britain and China differ irreducibly in scale, political structure, and external context, making it impossible to treat them as mutual alternatives in a coherent contrast class (undermining condition (a)). For instance, "China" denotes a continental empire, while "Britain" is an island nation—a mismatch in the unit of analysis. Even if we redefine China as the Yangzi Delta (a more comparable region), the temporal scope remains problematic: Britain’s takeoff is pinpointed to c. 1780–1830, but China’s "non-takeoff" spans centuries without a clear counterfactual "window" for failure. Reparability would require dissolving the national labels and specifying shared preconditions, but the question’s core phrasing resists this by reifying nations as the units.  

  The best reformulation shifts focus to regions within comparable socioeconomic contexts: "Why did sustained intensive growth emerge in northwestern Europe (e.g., England, Low Countries) but not in the Yangzi Delta between 1700 and 1850?" This satisfies all three conditions: (a) Both regions belonged to a contrast class of "advanced organic economies" with similar productivity, commercialization, and technological sophistication c. 1700; (b) the question is intrinsically integrated—factors explaining Europe’s breakthrough must simultaneously explain the Yangzi’s non-breakthrough (e.g., if coal proximity mattered, the Delta’s distance from mines becomes relevant); (c) the foil (Yangzi) actively constrains explanations, as its comparable pre-1700 development rules out simplistic "European superiority" narratives. Crucially, this reframing demands specifying unit (subnational regions), timeframe (1700–1850), and contrast class (high-output preindustrial cores).  

  Recasting the question as "Why did sustained growth begin at all?" avoids contrast class issues but introduces teleology. It implies growth was inevitable, inviting explanations that cherry-pick preconditions from hindsight (e.g., "because of human ingenuity") and violates condition (c) by lacking a foil. Conversely, the Europe-Yangzi Delta contrast resists selection bias by fixing the contrast class ex-ante (regions with comparable development c. 1700), forcing engagement with why identically "promising" cases diverged. This reformulation changes what counts as a good answer: instead of listing British advantages (e.g., Parliament) or Chinese "blockages" (e.g., bureaucracy), answers must identify variables that *differed decisively* between the two regions *after* 1700 (e.g., energy costs, fiscal-military competition), and show how these differences were necessary *only* given their shared starting point.  

  Any well-posed divergence question must define: (1) **Unit of analysis** (e.g., regions, states, or networks) to ensure commensurability; (2) **Temporal boundaries** for the outcome (e.g., "onset by 1850") to avoid infinite regress; (3) **Contrast class** limited to cases with plausible ex-ante potential (e.g., using historical GDP estimates). Failure to define these risks hindsight bias: selecting cases based on the outcome (e.g., "why Europe not China?" presumes Europe’s rise was foreordained) can make explanations untestable, as any factor present in Europe but absent in China becomes a post hoc "cause." The Europe-Yangzi framing mitigates this by anchoring the contrast in pre-divergence equivalence, ensuring facts about the foil actively challenge—not just mirror—the target’s explanation.  

  ---

  **Marking Scheme**  
  An A answer (25/25) must make these five moves (5 marks each). Deduct marks for specified errors:  

  1. **Correctly identifies condition (b) as violated** (not (a) or (c)).  
     *–1 if misidentifies condition; –2 if claims no violation.*  
  2. **Argues the flaw is fatal** (not reparable) due to incomparable units/contexts.  
     *–1 if calls it reparable without addressing unit/temporal mismatch; –2 if suggests adding more cases alone fixes it.*  
  3. **Proposes reformulation (e.g., Europe vs. Yangzi Delta) meeting all conditions**, specifying unit/time/contrast class.  
     *–1 if retains nations; –1 if omits time/unit definition; –2 if proposes "why growth at all?" without critique.*  
  4. **Explains how reformulation changes explanatory demands** (e.g., forces focus on post-1700 divergences between comparable cases).  
     *–1 if only lists causes; –2 if claims standard "Britain vs. China" causes suffice.*  
  5. **Articulates how hindsight/outcome selection risks immunity to evidence** (e.g., teleology in "why at all?"; contrast-class inflation in national framing).  
     *–1 if only defines terms; –2 if denies hindsight risks.*  

  **Critical errors triggering ≥3 mark deductions per instance**:  
  - Treating the question as invitation to list British advantages/Chinese weaknesses.  
  - Claiming mere existence of *any* contrast class (e.g., "all nations") satisfies (a) without plausibility.  
  - Ignoring that foil-case facts must constrain target-case explanations beyond negation (e.g., "China lacked coal" alone is insufficient).  
  - Assuming condition (b) is satisfied by comparing any two cases.  
  - Neglecting temporal scope or unit-of-analysis in reformulation.  

  ---  
  This question and rubric test mastery of contrastive reasoning, demanding students critique the scaffolding of historical inquiry itself. The model answer demonstrates rigorous application of the apparatus without relying on historiography, focusing on reconstructible logical and comparative principles.
