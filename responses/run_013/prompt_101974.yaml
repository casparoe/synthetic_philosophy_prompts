  But the user also wants to challenge these modernist views with Smith's ethnosymbolism. Smith argues that nations aren't just invented but rooted in older ethnic symbols. So, were there pre-existing Scottish symbols that were repurposed? The Declaration of Arbroath, medieval institutions, Gaelic culture—these could be seen as ethno-symbolic roots. Tartan wasn't new; it was adapted. The user questions if "invented" means "false" and if debunking origins is a genetic fallacy. They’re hinting that invention doesn't negate authenticity.

