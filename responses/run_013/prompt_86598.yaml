answer: |-
  ### Brainstorming Page: Candidate Openings  

  1. **"Look around this room: the judge adjusting her robe, the children fidgeting in their seats, the official documents waiting to be signed..."**  
     *Why not dead end?* Grounds the speech in concrete sensory details. Avoids premature "we" claims by describing observable actors. Risk: Neutral tone may lack warmth.  

  2. **"Today, something ordinary and extraordinary happens at the same time."**  
     *Why not dead end?* Hints at the paradox of conferred membership. Plain-spoken but risks vagueness if not immediately anchored in ceremony details.  

  3. **"You’ve crossed oceans, mountains, or paperwork—but today, you cross a threshold no one else in this room has crossed."**  
     *Why dead end?* "Threshold" metaphorically references a "journey" (banned). Also implies "we" (non-naturalized) are static observers.  

  4. **"In a moment, you’ll swear an oath. Words will change what you are to this country."**  
     *Why not dead end?* Directly engages performativity ("words change what you are"). Concrete (oath) and avoids "we." Risk: Too stark? Soften with warmth later.  

  5. **"Most of us became citizens by crying in a hospital. You become citizens by choice in this courtroom."**  
     *Why not dead end?* Contrasts inherited vs. chosen membership. Warm, plain, subverts "shared inheritance" trap. Strong contender.  

  6. **"This ceremony doesn’t just welcome you—it changes *us*."**  
     *Why dead end?* Assumes a pre-existing "us" capable of being changed. Begs the boundary problem. Too theoretical if unexplained.  

  7. **"See the flag behind the judge? Its fabric isn’t magic. The meaning it holds depends entirely on what happens here today."**  
     *Why not dead end?* Demystifies symbols, focuses on communal creation of meaning. Grounded (flag in room). Avoids inherited sentimentality.  

  8. **"Your families’ hands are clasped tight. Mine were too, years ago, in a room like this."**  
     *Why dead end?* "Room like this" implies shared immigrant narrative (violates "nation of immigrants" ban). Personal anecdote risks centering speaker.  

  9. **"No one chooses where they’re born. But today, you choose where you belong."**  
     *Why not dead end?* Clearest articulation of inherited vs. chosen membership. Plain, warm, theoretically sound. Minimalist winner.  

  10. **"Democracy begins with a simple question: Who gets to say ‘we’? Today, you gain the right to ask it."**  
      *Why dead end?* "Democracy begins" is a theoretical claim. "We" is unexamined. Jargon-feeling for families.  

  **Selected Opening:** #5 and #4 merged for warmth, concreteness, and theoretical integrity:  
  *"Most of us became citizens by crying in a hospital. You become citizens today by choice, in this room, with words."*  

  ---

  ### Welcome Address (Approx. 700 words)  

  Most of us became citizens by crying in a hospital. You become citizens today by choice, in this room, with words.  

  Look around: the judge’s bench polished smooth by a hundred ceremonies like this one. The clerk holding the oath in both hands. Your niece bouncing her knee, trying to sit still. These details matter. They’re the quiet witnesses to something profound. In a few moments, you’ll repeat words after the judge. Those words aren’t a description. They’re an act. They don’t just say you belong—they *place* you here, among us.  

  That placement is a gift this country rarely gives consciously. For most, it’s inherited like eye color or an old story. But you’ve claimed it deliberately. You studied maps and laws. You waited in lines and offices. You learned the angles of this city—the bus route that always runs late, the market where the mangoes are perfectly ripe on Tuesdays. You made yourself subject to rules you had no voice in making. That’s courage. That’s faith in an idea still becoming real.  

  Today, we mark that faith. But let’s be honest about what we mark. When I say, “Welcome,” or “You are one of us now,” I’m pointing toward a promise, not handing you a finished thing. The “us” I invoke isn’t a walled garden where everyone thinks alike. It’s a workbench. It’s where we build what we need together: safe streets, good schools, fairness. The tools on that bench only work if everyone handles them. That’s why your presence changes the work. It changes how heavy the hammer feels in our hands.  

  This ceremony doesn’t erase where you came from. It adds another layer to who you are. You bring languages this city hasn’t heard enough of. Recipes that will sweeten our potlucks. Ways of fixing what’s broken that we haven’t tried. That’s not about blending into a pot. It’s about strengthening a foundation. Foundations hold weight because every brick does its part.  

  Some in this room feel relief. Some feel pride. Some are exhausted. All those feelings belong here. They’re proof this matters. Citizenship isn’t a trophy for passing a test. It’s a set of responsibilities only you can carry. The responsibility to vote when others shrug. To serve on a jury when it’s inconvenient. To shovel your neighbor’s sidewalk in February because their back aches. To stand up when the rules ignore someone’s dignity.  

  That work starts now. Not because we chose you, but because you chose this. Not because we agree on everything, but because we agree on this room—this shared commitment to shape what happens next. The judge will soon say, “I hereby declare you citizens.” Those words are powerful, but they’re not magic. They’re a beginning. What makes them true isn’t the declaration. It’s the days after. It’s you showing up at the community board meeting. It’s you teaching your child to read ballots before bedtime stories. It’s you insisting this country owes its people more than words.  

  So welcome. Not to perfection. Not to a finished story. Welcome to the workbench. Welcome to the argument over how to build better. Welcome to the stubborn belief that forty people in a courtroom can alter a city’s future by saying, “I will.”  

  Your place here was earned. We’re better because you insisted on it. Now—let’s get to work.  

  ---

  ### Closing Note: The Unspoken Sentence  
  **The most important sentence the address could not say:**  
  *"No demos earns its existence; it inherits its power arbitrarily, and today we disguise that arbitrariness with ritual."*  

  **What it would have cost:**  
  Saying this would have shattered the ceremony’s necessary fiction—that the "we" welcoming them is legitimate. While philosophically honest, it would reframe their achievement as participation in a foundational myth, draining warmth and agency from their moment. The speech instead channels this tension into productive terms: *inheritance* vs. *choice*, the *aspirational* "we," and citizenship as *work* rather than identity. This preserves joy while honoring the boundary problem’s core insight: that every "welcome" is an act of imagination.
