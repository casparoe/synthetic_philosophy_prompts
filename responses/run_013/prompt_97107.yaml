  Prose:

  **Joint Statement on Libet-Style Experiments**

  **1. Agreed Claims**

  Both the deflationary and constraint camps agree on the following:

  - The readiness potential (RP) is an averaged EEG potential that begins several hundred milliseconds before movement onset (typically 500 ms or more for the early component, and about 400 ms for the lateralized component). The reported time of the conscious urge (W-time) typically occurs around 200 ms before movement onset.
  - The RP is only observable when averaging many trials aligned to movement onset. This averaging procedure can reveal a gradual build-up that may not be apparent in single trials. Baseline correction is used, but it does not eliminate the possibility that the RP reflects fluctuations in the baseline period.
  - The experimental paradigm involves a spontaneous, arbitrary movement without an external cue or reason to act at one moment rather than another. Therefore, the results do not address reason-based decisions.
  - These experiments do not settle the question of compatibilism (whether free will is compatible with determinism) because they do not engage with the metaphysical issues at stake. They also do not demonstrate that conscious intentions are epiphenomenal in general, because they are limited to a specific type of action.

  Both sides accept these claims because they are based on the operational procedures and results of the experiments. Evidence against these claims would include systematic demonstrations that the RP does not appear under these conditions, or that the timing relations (e.g., W-time) are not reproducible.

  **2. Residual Disagreements**

  Despite agreement on the above, the camps disagree on the following:

  a. **Nature of the Readiness Potential**: The deflationary camp holds that the RP is largely an artifact of averaging and reflects the crossing of a threshold by spontaneous background neural fluctuations, not a specific decision-related signal. The constraint camp holds that the RP reflects a genuine pre-conscious neural process that commits to the action and is a causal factor in the subsequent movement.

  b. **Nature of the Reported Urge (W-time)**: The deflationary camp holds that the reported urge is a retrospective judgment and not a reliable real-time readout of a conscious intention, potentially confabulated based on the movement or other factors. The constraint camp holds that the reported urge is a real-time readout of a conscious intention that occurs after the neural commitment and before the movement, and is a causal factor in the action (though not the originating cause).

  c. **Relevance of the Paradigm**: The deflationary camp holds that the spontaneous nature of the task makes it irrelevant to reason-responsive choices, which are the typical arena for free will. The constraint camp holds that the task captures a basic form of spontaneous action that is a component of free will, and that the temporal ordering (neural activity before awareness) likely generalizes to other actions.

  **3. Cruxes**

  The following cruxes divide the camps:

  a. **Nature of the RP**: This is an empirical crux. Resolving it would move both sides. If the RP is shown to be an artifact of averaging and threshold crossing, it would support the deflationary camp. If it is shown to be a specific decision signal, it would support the constraint camp.

  b. **Nature of W-time**: This is an empirical crux (with conceptual aspects). Resolving it would move both sides. If W-time is shown to be confabulated and unreliable, it would support the deflationary camp. If it is validated as a real-time readout, it would support the constraint camp.

  c. **Relevance of the paradigm**: This is a conceptual crux. Resolving it would move the debate. If the paradigm is shown to be irrelevant to free will, it would support the deflationary camp. If it is shown to be a fair model, it would support the constraint camp.

  **4. Discriminating Cases/Experiments**

  We agree that the following experiments would bear on the cruxes:

  a. **Deliberation Variant**: Participants are instructed to deliberate (e.g., by considering an arbitrary reason) before moving, rather than waiting for an urge.
     - Deflationary prediction: The RP should be attenuated or disappear, or if present, it should be shifted to occur after the reported deliberation.
     - Constraint prediction: The RP should still be present and precede the reported conscious decision by a similar or longer interval.
     - Outcome bearing: Attenuation or shifting of the RP supports deflationary; persistence of the RP with a similar timing relation supports constraint.

  b. **Stakes Variant**: Participants choose between two actions (e.g., left or right key press) with real stakes (e.g., monetary reward) attached to choosing one action over the other, and they must choose at a time of their own volition.
     - Deflationary prediction: The lateralized decoding (which decodes left vs right) should collapse to a time close to the movement (e.g., around W-time or later), because the decision is made consciously and late.
     - Constraint prediction: The lateralized decoding should still be possible several seconds before the reported conscious choice.
     - Outcome bearing: Collapse of the decoding time supports deflationary; persistence of early decoding supports constraint.

  c. **Veto Timing Experiment**: Participants are instructed to veto their movement on some trials, and the neural activity associated with the veto is measured relative to the reported time of the veto intention.
     - Deflationary prediction: The reported veto intention should precede any neural activity specific to the veto.
     - Constraint prediction: The neural activity for the veto should precede the reported veto intention.
     - Outcome bearing: If the neural activity precedes the report, it supports constraint; if the report precedes the neural activity, it supports deflationary.

  **5. Verbal Disputes**

  To avoid verbal disputes, we propose stipulations for key terms:

  - 'Decision': 
     - Deflationary reading: Requires conscious deliberation and reasons.
     - Constraint reading: Can be an unconscious neural commitment.
     - Proposed stipulation: Use "conscious decision" for the former and "neural decision" for the latter.

  - 'Cause':
     - Deflationary reading: Implies direct, unmediated, and necessary causation.
     - Constraint reading: Can be a contributory factor in a chain.
     - Proposed stipulation: Use "causal factor" to mean a necessary part of the process without implying sufficiency or directness.

  **6. Closing Assessment**

  Both sides agree that the following would move the debate:

  - Empirical results from the proposed experiments (deliberation variant, stakes variant, veto timing) that clearly discriminate between the predictions.
  - New methods to validate the timing and causal role of the reported urge (e.g., by blocking movements or using stimulation to perturb the system).

  Both sides agree that the following would not move the debate:

  - Further replications of the original Libet experiment without substantive variations.
  - Philosophical arguments that do not engage with the empirical details of the experiments.

