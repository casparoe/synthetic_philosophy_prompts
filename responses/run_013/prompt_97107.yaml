answer: |-
  ### Joint Statement on Libet-Style Experiments

  #### 1. Agreed Claims  
  Both parties endorse the following non-vacuous claims:  
  - **Operational measurement**: The pre-movement potential (RP) is an averaged EEG signal, operationally defined as a negative voltage shift beginning ~500–1000 ms before movement onset, while the reported urge (W-time) is operationally recorded ~150–400 ms before movement onset via clock-based introspection.  
  - **Methodological constraints**: Averaging trials aligned to movement onset reveals a statistically robust RP, but this does not prove identical dynamics in single trials. Baseline correction controls for drift but cannot resolve whether the RP reflects a unitary decision signal or stochastic noise accumulation. Temporal ordering (RP onset → W-time → movement) is replicable but does not inherently imply causal necessity.  
  - **Limited scope**: These experiments do not measure reason-responsive decisions (e.g., morally or instrumentally weighted choices). They neither refute nor affirm compatibilism, as they do not address higher-order agency or determinism’s compatibility with responsibility.  

  **Why both accept**: These claims reflect uncontroversial empirical observations and methodological norms.  
  **What would count against**: If single-trial analyses reliably showed RP-like build-ups without averaging, or if W-time consistently preceded RP onset in high-power studies.  

  #### 2. Residual Disagreements  
  - **Nature of the RP**:  
    - *Deflationary formulation*: The RP is an artifact of averaging stochastic neural noise that crosses a threshold; it does not encode a "decision" but reflects generic preparatory activity.  
    - *Constraint formulation*: The RP represents a specific pre-conscious commitment to act, distinct from background noise, with lateralized decoding confirming intention-specificity.  

  - **Nature of the reported urge (W-time)**:  
    - *Deflationary formulation*: W-time is a post-hoc confabulation influenced by sensory feedback, not a real-time readout of a conscious cause.  
    - *Constraint formulation*: W-time is a causally relevant conscious signal, albeit preceded by neural commitment, and not solely confabulated.  

  - **Paradigm relevance**:  
    - *Deflationary formulation*: Spontaneous actions without reasons are irrelevant to free will, which requires reason-responsive mechanisms.  
    - *Constraint formulation*: Spontaneous actions model a core component of volition; neural precedence generalizes to deliberate choices.  

  #### 3. Cruxes  
  - **Is the RP a decision signal or noise?** (Empirical; settling would move both sides).  
  - **Is W-time causal, readout, or confabulation?** (Empirical; settling would move both sides).  
  - **Does the paradigm’s spontaneity limit its relevance?** (Conceptual; settling would move both sides).  

  #### 4. Discriminating Cases  
  For empirical cruxes, both sides endorse these experiments and predictions:  

  | Experiment | Deflationary Prediction | Constraint Prediction | Outcome Bearing |  
  |------------|-------------------------|------------------------|----------------|  
  | **Deliberation variant**: Participants instructed to deliberate (e.g., "move after weighing pros/cons") rather than await urge. | RP attenuated or absent; W-time aligns with deliberation onset. | RP persists but delayed; W-time remains after RP onset. | Attenuation favors deflationary; persistence favors constraint. |  
  | **Stakes variant**: Real stakes attached to choosing Action A vs. B (e.g., monetary gain). | Lateralized decoding collapses to <500 ms before W-time, as choice depends on conscious evaluation. | Lateralized decoding precedes W-time by seconds, as in spontaneous tasks. | Collapse favors deflationary; sustained precedence favors constraint. |  
  | **Veto timing**: Measure neural markers when participants cancel movements after RP onset. | Veto-related neural activity appears *after* conscious veto report. | Veto-related activity precedes conscious report, showing pre-conscious control. | Veto report first favors deflationary; neural veto first favors constraint. |  

  *(Note: Cortical stimulation results* show that stimulating premotor cortex can elicit reported urges without movement. Both sides agree this challenges simple "urge as cause" models but does not resolve whether W-time in Libet tasks is confabulated or causal.)  

  #### 5. Verbal Disputes  
  - **"Decision"**:  
    - *Deflationary reading*: Requires conscious, reason-based formation.  
    - *Constraint reading*: Includes unconscious neural commitments.  
    - *Proposed stipulation*: Use "neural commitment" for pre-conscious processes; "deliberative choice" for conscious decisions.  
  - **"Cause"**:  
    - *Deflationary reading*: Implies unmediated, sufficient control.  
    - *Constraint reading*: Includes necessary-but-insufficient precursors.  
    - *Proposed stipulation*: Use "causal factor" for events that raise action probability without guaranteeing it.  

  #### 6. Closing Assessment  
  **Would move the debate**:  
  - Outcomes of the above experiments, especially stakes/deliberation variants.  
  - Single-trial decoding of RP and W-time with improved temporal resolution.  
  - Conceptual work defining "free will" in testable neural terms.  
  **Would not move the debate**:  
  - Rehashing Libet’s original methodology.  
  - Appeals to untestable metaphysical intuitions.  
  - Disputes over clock-timing precision without new data.  

