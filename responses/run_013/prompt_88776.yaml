  Next, the Pareto and anonymity conditions. The user wants to know if a theory can treat widening gaps differently when everyone gains versus narrowing gaps through losses. They’re probing whether prioritarianism can avoid relying on comparisons it claims not to need. Here, the distinction between Pareto improvements and egalitarian outcomes is vital. Anonymity might conflict with prioritarianism’s person-affecting focus, but that’s a tension to highlight.

  The trade-off case is about the rate of exchange. The user needs a practical metric for policymakers. The diminishing marginal utility versus prioritarian weight distinction matters here. Where does the rate come from? A theory must justify this without arbitrary choices, possibly through cardinal utility scales.

  Scale invariance is another point. If well-being units change, does the priority weight hold? The user might be concerned about objectivity in measurement. Fixing the zero point is essential, which ties into the metric issue—like avoiding adaptive preferences. The happy slave problem suggests objective well-being measures are necessary, which complicates things.

  Lexical priority versus continuity. The user is worried about catastrophic losses being ignored for minor gains to the worst-off. A lexical approach isn’t feasible; continuity is necessary for real-world policy. This pushes towards a continuous weighting function.

  Ex ante vs ex post. Should priority apply to expected well-being or outcomes? This affects risk policies. The user might be hinting at real-world applications like insurance or social programs. A consistent theory needs to pick one or explain how both can coexist, though they often conflict.

  The metric question addresses adaptive preferences. If well-being is subjective, oppressed individuals might not be prioritized. The theory needs an objective metric, which is tough but necessary. This ties back to scale—zero points and interpersonal comparisons.

  The status of inequality's badness. Is it a reason for action or just regret? The user wants the theory to reject levelling down as a policy, even if inequality is intrinsically bad. Distinguishing axiology from decision procedures is key here. Policy needs actionable reasons, not just evaluations.

  Population ethics. How does the theory handle different populations and non-overlapping lives? Prioritarianism usually avoids average utility issues but faces challenges in variable populations. The user might need clarity on intergenerational policies.

  Now, the user’s deeper needs. They had a debate revealing they and their friend misunderstood what the theory should deliver. They want a framework to evaluate theories, not just opinions. The real need is to resolve their argument by understanding the core requirements and conflicts. They care about which requirements are non-negotiable and where conflicts arise, especially to counter their friend's claim that valuing inequality's badness necessitates levelling down.

  Non-negotiable requirements: Pareto, non-levelling-down as a policy, continuity, and a practical decision procedure. Conflicts include anonymity vs. prioritarianism, ex ante/ex post, and population ethics challenges. The biggest gap in their friend's argument is conflating intrinsic badness with actionable reasons. Prioritarians can deem levelling down as not generating reasons for action, thus avoiding the policy implication their friend claims is inevitable.
answer: |-
  Here are the core desiderata for a prioritarian theory intended for public policy, distilled to essential requirements with their motivating cases and conflicts highlighted. I'll distinguish non-negotiable requirements from context-dependent ones, identify irreconcilable tensions, and address the core disagreement with your friend.

  ---

  ### **Non-Negotiable Requirements (Policy-Relevant Core)**
  1.  **Action-Guidance & Non-Leveling-Down Imperative**  
      *   **Requirement:** The theory must **never prescribe leveling down** (making some worse off with no one better off) as a policy action, even if it concedes the outcome is "less unequal."  
      *   **Motivation:** The core purpose of policy is human welfare improvement. A theory prescribing destructive, welfare-reducing actions (like destroying resources of the rich with no gain to the poor) is morally perverse and politically unusable. Covers all leveling-down cases: forced, "natural," voluntary, or positional (where loss of positional advantage *is* a genuine welfare loss).  
      *   **Implication:** The "badness of inequality" cannot generate a *positive reason to level down*. It can be a reason for regret in unequal outcomes or a reason to *prefer equalizing gains*, but not a reason for destructive action.

  2.  **Pareto Respect (Weak & Strong)**  
      *   **Requirement:** The theory must judge Outcome A as better than Outcome B if:  
          *   (Weak Pareto) *At least one person* is better off in A and *no one* is worse off.  
          *   (Strong Pareto) *Everyone* is at least as well off in A as in B, and *at least one person* is strictly better off.  
      *   **Motivation:** Fundamental efficiency and non-wastefulness. A policy theory must endorse making someone better off without harming anyone. Rejecting this renders policy incoherent and justifies indefensible inaction. Resolves the "rising tide/widening gap vs. narrowing gap via losses" case: A rising tide with widening gaps is *better* than a falling tide with narrowing gaps. Prioritarianism explains *why* the widening gap is regrettable *despite* the Pareto improvement.

  3.  **Continuity (No Lexical Priority)**  
      *   **Requirement:** Benefits to the worst-off cannot lexically dominate all other considerations. There must be some finite (even if very large) amount of benefit to the better-off that outweighs a very small benefit to the worst-off.  
      *   **Motivation:** Avoids catastrophic policy implications (e.g., sacrificing the health/education of millions for a trivial gain to one very badly-off person). Policy requires balancing competing claims. Lexical priority is practically unworkable and morally extreme.

  4.  **Non-Comparative Weighting (The Prioritarian Core)**  
      *   **Requirement:** The extra weight given to benefiting a person must depend **solely on that person's absolute level of well-being**, not on their *relative* position compared to others.  
      *   **Motivation:** Distinguishes prioritarianism from egalitarianism. It explains why helping the worse-off matters more *intrinsically* (because their need is greater), not *because* they are worse off *than someone else*. This allows it to satisfy (1) and (2) – the badness of inequality is an *impersonal* feature of the state of affairs, not a reason for comparative leveling actions. Addresses "treating gaps differently without needing comparisons": It focuses on absolute levels, not gaps. Widening gaps are bad only derivatively if the worse-off gain less absolutely than they could have.

  5.  **Actionable Deliverable: A Decision Procedure**  
      *   **Requirement:** The output must be a **reason for action** (or inaction) for policymakers, not merely an axiological ranking or a reason for regret.  
      *   **Motivation:** Your constraint: "Something that has to tell a government what to do." An axiology alone is insufficient for policy; it needs translation into reasons guiding choice. This forces clarity on the status of "badness of inequality" (see 1 & 8).

  ---

  ### **Resolvable but Critical Requirements (Necessary for Coherence/Applicability)**
  6.  **Defensible Metric of Well-Being**  
      *   **Requirement:** Must specify what constitutes well-being and how it is measured interpersonally, avoiding the "happy slave" (misjudging oppression due to adaptation) and "adaptive preference" (underestimating potential due to limited horizons) problems.  
      *   **Motivation:** Without an objective or critically refined subjective account of welfare, prioritization loses its moral force and policy application (e.g., might ignore the truly disadvantaged who have adapted). Requires an account sensitive to objective needs, capabilities, or informed desires.
      *   **Solution:** Often requires an objective list or capabilities approach. Cannot rely purely on subjective satisfaction.

  7.  **Scale Invariance with Fixed Zero**  
      *   **Requirement:** The *rate* of priority weighting must be invariant under linear transformations of the well-being measure **only if a meaningful zero point is fixed**.  
      *   **Motivation:** Policy requires stable trade-offs. If the weighting changed simply by re-scaling units (e.g., dollars vs. cents), the theory would be arbitrary.  
      *   **Solution:** Requires fixing a "zero" point (e.g., neutrality, a decent minimum). The concavity of the priority function (how much more weight the worse-off get) depends on the *ratio* of well-being levels relative to zero, not the absolute numerical scale. Derek Parfit's "well-being units" need an anchor.

  8.  **Ex Post Priority (Generally)**  
      *   **Requirement:** Priority weight attaches to the **actual outcome level** of well-being, not the *ex ante* expectation.  
      *   **Motivation:** Fits the prioritarian rationale (helping those who are *actually* badly off). *Ex ante* priority (weighting expected utility based on initial position) often conflicts with *ex post* and can incentivize risky behavior or fail the actual worst-off in outcomes. Holding both consistently is usually impossible under uncertainty. *Ex post* is more robust for policy.

  ---

  ### **Context-Dependent or Challenging Requirements**
  9.  **Anonymity (Symmetry)**  
      *   **Requirement:** Permuting well-being levels among individuals doesn't change the overall evaluation.  
      *   **Motivation:** Captures impartiality – who has the well-being doesn't matter, only the distribution.  
      *   **Tension:** While prioritarianism naturally satisfies this (it cares about levels, not identities), it conflicts with *ex ante* versions or historical entitlements sometimes incorporated into policy. Often non-negotiable for pure distributional views, but policy might incorporate other factors.

  10. **Population Ethics (Variable & Non-Overlapping)**  
      *   **Requirement:** Must handle cases involving changing population sizes (adding people with positive/negative lives) and comparisons across time (non-overlapping generations) coherently.  
      *   **Motivation:** Essential for long-term policy (environment, sustainability, investment).  
      *   **Challenge:** Deeply problematic area ("Mere Addition Paradox", Non-Identity Problem). Prioritarianism avoids average utility pitfalls but struggles with the "Repugnant Conclusion" (vast population with barely worthwhile lives vs. small, very happy population). No universally accepted solution exists; often requires auxiliary principles.

  ---

  ### **Irreconcilable Tensions (Key Conflicts)**
  1.  **Ex Ante vs. Ex Post Priority Under Uncertainty:**  
      *   **Conflict:** *Ex ante* priority (weighting by initial prospects) aims for fair chances but can justify policies leaving the *actual* worst-off even worse off. *Ex post* priority focuses on actual outcomes but can seem unfair to those who took risks in good faith. Genuine conflict; a theory must choose or compromise inconsistently. Policy usually leans *ex post* for accountability.

  2.  **Priority Weighting vs. Strict Anonymity in Outcomes:**  
      *   **Conflict:** While prioritarianism satisfies anonymity formally, its *justification* ("helping *this person* because *they* are badly off") is inherently person-affecting. Strict anonymity treats individuals as replaceable vessels. The tension is philosophical: Is the moral imperative agent-relative (help *this* sufferer) or strictly impersonal (improve the distribution)? Prioritarianism leans agent-relative in rationale but impersonal in calculation. Policy usually adopts the impersonal calculation.

  3.  **Intrinsic Badness of Inequality vs. No Reason to Level Down:**  
      *   **Conflict:** How can inequality be *intrinsically* bad if there's *never* a reason to reduce it by leveling down?  
      *   **Resolution (Crucial for Prioritarianism):** The badness is **impersonal state-of-affairs badness** (like ugliness or chaos), not a **person-affecting reason** (like harm). Leveling down *harms* specific individuals without benefiting anyone, creating a decisive *person-affecting reason against it*. The impersonal badness of inequality provides a reason to *prefer equal gains over unequal gains* (or unequal losses), and regret unequal Pareto improvements, *but not to actively harm anyone*. This defeats your friend's claim.

  ---

  ### **The Most Excluding Requirement & Your Friend's Gap**
  *   **Most Excluding Requirement:** **The Non-Leveling-Down Imperative (1)** combined with **Prioritarian Non-Comparative Weighting (4)**. This combination decisively rejects **egalitarianism** (which sees leveling down as *pro tanto* good or justifiable to achieve equality) and **telic leximin** (which can require catastrophic sacrifices for the worst-off). It forces the theory to ground priority in absolute need, not relative position.
  *   **The Gap in Your Friend's Claim:** Your friend conflates **intrinsic impersonal badness** with **person-affecting reasons for action**. Prioritarianism (and some sophisticated egalitarians like Larry Temkin) can consistently hold:
      1.  Outcome A (Unequal: High, Low) is *intrinsically worse* in one respect (more unequal) than Outcome B (Equal: Medium, Medium).
      2.  *Nevertheless*, moving from A to B by leveling down (High->Medium, Low->Medium) is **all-things-considered wrong** because it *harms* the High person without *benefiting* the Low person (who stays at Medium). The intrinsic badness of inequality gives a reason to *regret* A or *prefer* achieving B via *beneficial* equalization, but **no reason whatsoever to perform the harmful act of leveling down**. The decisive reason against leveling down is the *harm done*, which outweighs the impersonal improvement in equality. Your friend's claim ("must want the better off knocked down") fails by ignoring this distinction between axiological evaluation and reasons for action.

  In essence, for policy, a theory must prioritize *improving lives* over merely *shaping distributions*, while recognizing that how benefits are distributed matters deeply for justice. Prioritarianism attempts this by weighting the moral urgency of benefits based on absolute need.
