answer: |-
  ## The Adequate Cause-Prioritization Framework: Requirements Specification

  After decades in the trenches of this question, here's the distillation. A framework worthy of guiding life-defining commitments must meet these demands:

  ### I. Critical Cases It Must Get Right (No Fudging Allowed)
  *   **The Astronomical Stakes Gamble:** A cause with a 0.0001% chance of preventing human extinction vs. a cause guaranteeing significant but "normal" good (e.g., curing a widespread non-fatal disease). *Why no fudge?* Frameworks must handle extreme uncertainty and value dispersion without collapsing into either reckless longshot betting *or* ignoring truly existential stakes. Fudging this leads to existential paralysis or ruinous gambles.
  *   **The Locally Devastating vs. Globally Diffuse:** A cause preventing a near-certain, deeply traumatic event for a small community (e.g., a unique cultural genocide) vs. a cause providing a small, measurable benefit to billions (e.g., micronutrient fortification). *Why no fudge?* Must grapple with aggregation, scope insensitivity, and non-fungible values (like cultural survival) without defaulting purely to scale or purely to immediacy. Fudging this ignores moral intuitions about depth of harm or special obligations.
  *   **The Paralyzingly Complex vs. the Deceptively Simple:** A deeply interconnected systemic problem (e.g., institutional corruption undermining all aid) vs. a straightforward, measurable intervention (e.g., distributing bednets). *Why no fudge?* Must account for second-order effects, leverage points, and the risk of "band-aid solutions" on complex systems, without dismissing tractability entirely. Fudging this leads to either naive solutionism or nihilistic inaction.
  *   **The Morally Contentious Cause:** A cause highly effective under one strong moral view but abhorrent or neutral under another (e.g., radical life extension, certain animal welfare interventions, some forms of advocacy). *Why no fudge?* Must explicitly handle moral uncertainty and value pluralism. Fudging this smuggles in a single moral framework, alienating users or misrepresenting the choice.

  ### II. Essential Distinctions It Must Preserve
  *   **Problem Importance (PI) vs. Intervention Effectiveness (IE):** The inherent scale/badness of the problem *must* be separable from how well *a specific action* addresses it. (e.g., Climate Change has immense PI, but ineffective protests have low IE).
  *   **Neglectedness as Evidence (NE) vs. Neglectedness as Intrinsic Good (NG):** NE signals high marginal value per unit input. NG is a fallacy. The framework must use neglect *only* as evidence for marginal impact potential, never as a goal itself.
  *   **Absolute Tractability (AT) vs. Comparative Advantage Tractability (CAT):** AT: Is the problem *fundamentally* solvable? CAT: Is it solvable *by me/us*, given our unique resources, skills, position, and opportunity cost? Must distinguish "can it be done?" from "can *we* do it *well*?"
  *   **Expected Value (EV) vs. Variance/Uncertainty (V/U):** The central estimate of impact vs. the *spread* and *shape* of possible outcomes (including tail risks and black swans). Must not collapse EV and V/U into a single fuzzy number.
  *   **Direct Impact (DI) vs. Leverage/Flow-Through Effects (LFT):** Measurable, immediate outcomes vs. harder-to-quantify effects like movement-building, shifting norms, unlocking other solutions, or capacity building. Must recognize both without letting LFT become an unfalsifiable excuse.
  *   **Personal Fit/Satisfaction (PF) vs. Objective Impact (OI):** The user's ability to sustain effort/productivity vs. the cause's impersonal value. Must acknowledge PF as a *feasibility constraint* on achieving OI, not conflate them.

  ### III. Results It Must Be Consistent With (Reality Checks)
  *   **Diminishing Marginal Returns (DMR):** As resources pour into a cause area, the marginal impact per additional unit decreases. The framework must reflect this non-linearity.
  *   **Neglect ≠ Promise:** A cause can be neglected because it's genuinely high-potential *or* because it's fundamentally intractable, prone to backfiring, or based on flawed premises. The framework must *not* assume neglect implies tractability or importance.
  *   **Counterfactual Impact (CI) vs. Total Good (TG):** Impact is the difference made relative to what would happen anyway ("additionality"). Must focus on CI, not TG. (e.g., Funding a well-run charity *they* would have funded anyway has near-zero CI).
  *   **Unbounded Long-Term Ripple Effects (ULTRE):** Acknowledge the reality of unpredictable, potentially vast future consequences, but *must not* let them dominate calculations due to complete incalculability. Requires robust handling of deep uncertainty.
  *   **Moral Uncertainty (MU):** The framework must not presuppose a single moral calculus (e.g., strict utilitarianism). It needs mechanisms to incorporate diverse values or weightings.
  *   **Information Constraints (IC):** Decisions must be possible with realistically obtainable, imperfect, often qualitative data. Cannot require perfect quantification or omniscience.

  ### IV. Inherent Tensions (Requirements You Likely Can't Fully Satisfy Simultaneously)
  | Tension Pair                           | Why the Conflict?                                                                                                    | Mitigation Direction                                                                 |
  | :------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------- |
  | **Computational Feasibility (CF)** vs. **Robustness to Pascal's Mugging (RPM)** | Simple, computable models (like naive EV) are vulnerable to hijacking by tiny-probability/huge-payoff claims. Robustly screening out nonsense RPM requires complex uncertainty handling, often exceeding CF. | Use skeptical priors, fat-tailed distributions, require stronger evidence for wilder claims, focus on robustly positive bets. |
  | **Precision & Quantifiability (PQ)** vs. **Handling Unbounded Ripple Effects (ULTRE)** | PQ demands measurable inputs/outputs. ULTRE are inherently unquantifiable over long timescales. Prioritizing PQ forces ignoring ULTRE; prioritizing ULTRE kills PQ. | Focus on identifiable *mechanisms* of influence, leverage points, and robust intermediate goals; accept bounded models. |
  | **Objective Impact Focus (OIF)** vs. **Personal Fit/Satisfaction (PF)** | Maximizing OIF might demand work the user finds draining or ethically uncomfortable, harming long-term effectiveness. Prioritizing PF might lead to objectively suboptimal choices. | Treat PF as a critical *multiplier* or *feasibility constraint* on sustained OI, not an independent good. |
  | **Counterfactual Impact Focus (CI)** vs. **Movement Building / Ecosystem Effects (MBEE)** | Focusing narrowly on direct CI might undervalue building capacity, knowledge, or networks that enable others (indirect, diffuse impact). Over-emphasizing MBEE risks unfalsifiable claims of future impact. | Value demonstrable multipliers and track record; estimate "capacity CI".              |
  | **Simplicity & Usability (SU)** vs. **Capturing Crucial Distinctions (CCD) & Handling Moral Uncertainty (MU)** | SU demands few variables and simple rules. Capturing PI/IE, AT/CAT, NE/NG, and MU requires more complexity and nuance. | Tiered approaches (simple filter -> deep dive), modular frameworks, clear heuristics for common conflations. |

  ### The Single Most Salient Requirement: Robustness to Uncertainty
  If you forced me to pick *one* requirement that does the most work in ruling out naive frameworks, it's **Robust Handling of Uncertainty (RHU)**, specifically distinguishing *kinds* of uncertainty and their implications. This encompasses:
  1.  **Distinguishing epistemic uncertainty** (we don't know the odds/payoff) **from aleatory uncertainty** (inherent randomness).
  2.  **Recognizing variance and tail risks** (not just expected value).
  3.  **Acknowledging model uncertainty** (we might be using the wrong framework/assumptions).
  4.  **Handling deep uncertainty** (unquantifiable, radical ignorance – like ULTRE or paradigm shifts).

  **Why RHU rules out naive frameworks:**
  *   Naive EV maximization (just multiply P*Impact) fails catastrophically with high uncertainty/variance (Pascal's Mugging, ignoring black swans).
  *   Simple tractability scores ignore the uncertainty *about* tractability itself.
  *   Focusing only on measurable near-term effects ignores the massive uncertainty of long-term effects.
  *   Treating neglectedness as a simple positive signal ignores the uncertainty about *why* it's neglected.
  *   Frameworks assuming perfect information or single-point estimates collapse under real-world ambiguity.

  RHU forces the framework to confront the messy reality where most high-stakes decisions happen, pushing beyond simplistic multiplication or linear scoring. It inherently demands consideration of the distinctions (PI/IE, EV/VU) and reality checks (DMR, Neglect≠Promise) to avoid being misled by noise or flawed models. It's the bedrock requirement for navigating the cases (Astronomical Stakes, Paralyzing Complexity) without fudging. Drop this, and the framework becomes a precision instrument blindfolded in a fog.
