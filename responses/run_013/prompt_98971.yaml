    - If the state is B, then the probability of signal X is 1-p and Y is p.
    We choose p such that the signal is informative but not perfect. For example, let p = 2/3.

    This setup is symmetric and ensures that after seeing one signal, the posterior is the same for everyone because they all started from the same prior and update with the same likelihood.

