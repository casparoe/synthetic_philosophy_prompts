  ### Philosophy and Economics Classroom Activity: No-Trade Theorem  
  **Objective:** Make students intuitively grasp the no-trade theorem (speculative trade vanishes under common priors, rationality, and common knowledge) and see how dropping the shared prior assumption revives trade.  

  ---

  ### **Rules and Setup**  
  **Asset:** A fictional "Unicorn Bond" paying:  
  - **100 points** if the true state is **BLUE**  
  - **0 points** if the true state is **RED**  

  **True State:**  
  - Secretly determined by instructor at the start of each round (50% chance BLUE, 50% RED).  

  **Private Signals:**  
  - Each student receives one private signal: **CIRCLE** or **SQUARE**.  
  - Signals are generated with **p = 2/3 accuracy**:  
    - If state is BLUE: P(CIRCLE) = 2/3, P(SQUARE) = 1/3  
    - If state is RED: P(CIRCLE) = 1/3, P(SQUARE) = 2/3  

  **Initial Endowment (per student):**  
  - 1 unit of the Unicorn Bond  
  - 50 points in cash  

  **Trading Rules:**  
  - **5-minute open-floor trading** per round.  
  - Students pair up and negotiate trades bilaterally (no central market).  
  - Each trade: One unit of the bond for cash. Price agreed verbally.  
  - **Constraints:**  
    - No short-selling (can’t sell bonds you don’t own).  
    - No borrowing (can’t spend cash you don’t have).  
  - **Goal:** Maximise expected points (cash + bond payoff after state reveal).  

  **Updating Beliefs:**  
  - Students calculate expected bond value using Bayes’ theorem.  
  - **Provided aids (to avoid math errors):**  
    - **Round 1 (Common Prior):** All students use prior P(BLUE) = 0.5.  
      - Signal CIRCLE: Expected value = 67 points  
      - Signal SQUARE: Expected value = 33 points  
    - **Round 2 (Different Priors):**  
      - **Group 1 (9 students):** Prior P(BLUE) = 0.6.  
        - CIRCLE: 75 points | SQUARE: 43 points  
      - **Group 2 (9 students):** Prior P(BLUE) = 0.4.  
        - CIRCLE: 57 points | SQUARE: 25 points  

  **Payoffs:**  
  - After trading, true state revealed.  
  - Total points = Final cash + (100 × bonds if BLUE, else 0).  

  ---

  ### **Materials**  
  - **Signals:** 18 slips of paper per round (pre-generated for CIRCLE/SQUARE based on state).  
  - **Prior Cards (Round 2):** 9 cards for Group 1 (P(BLUE)=0.6), 9 for Group 2 (P(BLUE)=0.4).  
  - **Value Cheat Sheets:** Cards with expected values for each signal/prior combo.  
  - **Coin:** For state determination (HEADS=BLUE, TAILS=RED).  
  - **Timer:** For trading periods.  

  ---

  ### **Timeline (90 Minutes)**  
  **0–10 min: Introduction**  
  - Explain the Unicorn Bond, states (BLUE/RED), and payoffs.  
  - Describe signals (CIRCLE/SQUARE) and accuracy (p=2/3).  
  - Outline trading rules: "Trade to maximise points—no hedging or liquidity motives yet!"  
  - Emphasise: "Use Bayesian updating. Your signal is private; others won’t know it."  

  **10–30 min: Round 1 (Common Prior)**  
  - **10:00–10:02:** Secretly flip coin for state (e.g., BLUE).  
  - **10:02–10:05:** Distribute private signals (e.g., 12 CIRCLE, 6 SQUARE if state is BLUE).  
  - **10:05–10:10:** Trading (5 mins). Students pair up, negotiate prices.  
  - **10:10–10:12:** Stop trading. Collect final holdings (cash + bonds).  
  - **10:12–10:15:** Reveal true state. Calculate payoffs.  

  **30–50 min: Round 2 (Different Priors)**  
  - **30:00–30:02:** Flip coin for new state (e.g., RED).  
  - **30:02–30:05:** Randomly assign Group 1/2. Distribute prior cards and new signals.  
  - **30:05–30:10:** Trading (5 mins).  
  - **30:10–30:12:** Collect holdings.  
  - **30:12–30:15:** Reveal state. Calculate payoffs.  

  **50–90 min: Debrief**  
  - **Trade Analysis (10 min):**  
    - Round 1: "How many trades happened? Why did you trade/not trade?"  
      - *Expected result:* Few/no trades. Students with CIRCLE (67) won’t sell below 67; those with SQUARE (33) won’t buy above 33. No price overlap.  
    - Round 2: "Who traded? What prices?"  
      - *Expected result:* Trades between Group 1 (SQUARE, 43) and Group 2 (CIRCLE, 57) at prices like 45–55.  
  - **No-Tree Theorem Intuition (15 min):**  
    - **Round 1 moment:** "You all started with the same prior (P=0.5). After signals, CIRCLE holders valued bond at 67, SQUARE at 33. Why couldn’t you trade? Because rational traders won’t accept prices worse than their valuation—and your valuations were too far apart!"  
    - **Key insight:** "With common priors, rational updating leads to **no speculative trade**. Any trade would imply one side is being ‘mugged’—why? Because common knowledge of rationality means you’d infer the other’s signal from their offer, updating your belief and killing the deal!"  
  - **Role of Priors (10 min):**  
    - **Round 2 moment:** "Trade roared back! Why? Because I gave you **different priors**."  
    - "Group 1 (P=0.6) with SQUARE valued bond at 43. Group 2 (P=0.4) with CIRCLE valued it at 57. They traded at 50—both gained *in expectation* because they disagreed on fundamentals."  
    - "This breaks the no-trade theorem: **Without shared priors, rational agents can ‘agree to disagree’ and trade.**"  
  - **Escape Hatches (5 min):**  
    - "Was any trade non-speculative? E.g., did anyone trade just to hedge risk or get cash? (No, by design). The theorem allows hedging/liquidity trades—but pure bets vanish under common priors."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Confusion: "Why can’t I trade in Round 1?"**  
     - *Problem:* Students may try to trade at 50 (midpoint), not grasping the valuation gap.  
     - *Fix:* Pre-trade, remind them: "Sell only above your value; buy only below." Use strict expected values (67/33).  

  2. **Exploit: Collusion or Irrational Trades**  
     - *Problem:* A CIRCLE holder sells at 40 to a SQUARE holder (both lose expected value).  
     - *Fix:* Stress: "Maximise *your own* points. Trade only if it improves your expected payoff."  

  3. **Fizzle: No Trade in Round 2**  
     - *Problem:* Group 1 (SQUARE, 43) and Group 2 (CIRCLE, 57) may not connect.  
     - *Fix:* Encourage movement: "You have 5 minutes—find partners!" Debrief even if few trades occur.  

  4. **Math Errors: Incorrect Updating**  
     - *Problem:* Students miscalculate posteriors.  
     - *Fix:* Provide value cheat sheets. Say: "Use these numbers—no need to calculate."  

  5. **Timing Chaos: Trading Runs Over**  
     - *Problem:* Negotiations eat time.  
     - *Fix:* Use a loud timer. Announce: "30 seconds left!"  

  ---

  ### **What the Game Can’t Replicate**  
  **The Infinite Regress of Rationality:**  
  - The no-trade theorem relies on **common knowledge of rationality**—traders don’t just update on their signal, but also infer *from the trade offer itself* that the counterparty has contrary information, collapsing the deal.  
  - **How to address:** Explain from the front: "In Round 1, if Alice offers to sell to Bob, Bob thinks: ‘Why is she selling? She must have a SQUARE! I should lower my valuation.’ This kills trade. Our game simplifies by giving you fixed valuations, but the theorem is deeper."  

  ---

  ### **Final Answer**  
  \answer{common prior}
