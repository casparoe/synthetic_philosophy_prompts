          - Stress that they are expected value maximizers and should use the Bayesian update.
          - We can provide the formula for updating in Round 1 too? And even precompute: 
              Signal X: 66.67, Signal Y: 33.33.
          - Tell them: "You should use the Bayesian update to compute your valuation and then only trade if you can get a price better than your valuation: sell if the price is above your valuation, buy if below."

    2. In Round 1, even with the valuations, they might trade for liquidity or hedging reasons? But we haven't given them any reason to hedge. We can explicitly say: "There are no other risks; your goal is simply to maximize expected points."

    3. In Round 2, they might not realize that others have different priors. We don't tell them that the other group has a different prior. They might assume everyone has the same prior? Then they might not trade? We want them to trade based on their own valuation without worrying about why the other person is trading.

        How to mitigate: 
          - We can say: "In this round, different participants have been given different information about the prior probability of state A. You have been given your prior. You do not know what prior others have been given."
          - And they are told to trade based on their own valuation.

    4. In Round 2, the trade might not occur because the students with the overlapping valuations (Group1 with Y and Group2 with X) might not find each other? Or they might not agree on a price? We can encourage trading by having a longer time? Or we can have a central board where they post bids and asks? But we are doing open outcry.

        We can hope that at least one trade occurs. Even one trade is enough for the debrief.

    5. The state might be drawn such that the signal is very uninformative? But that's random.

    6. Students might not understand the updating and trade randomly.

        Mitigate by providing the expected value for their prior and signal in Round 2. In Round 1, we can also provide: "If you have X, your expected value is 67 points. If you have Y, it's 33 points."

    7. Time management: 5 minutes trading might be too short. We can extend to 7 minutes? But we have a tight schedule.

  **Feature that the game cannot reproduce:**
    - The no-trade theorem relies on common knowledge of rationality and the fact that the traders will infer from the willingness to trade that the other person has information. In our game, we are simply telling them their own valuation and they are myopically trading. We are not requiring them to think about why the other person is trading. So the deeper level of reasoning (the infinite regress: "If they are willing to trade, they must have a reason, which should make me update") is missing. We are simulating the outcome but not the reasoning.

    - We will have to explain in the debrief that in a fully rational setting with common knowledge, they would not only update from their own signal but also from the fact that someone is offering to trade. And that would lead to a breakdown of trade. In our activity, we are assuming they don't update from the offer to trade? So we are not capturing that. We are just imposing the Bayesian update on the private signal and then having them trade myopically.

    - We can say: "In the real world, if you try to trade, the other person might wonder why you are willing to trade, and that might change their valuation. The theorem says that if they are rational and update on that, then trade breaks down. In this activity, we didn't have that updating from the trade offer, so we might see trade in round 1? But in reality, under the assumptions, even that trade wouldn't occur because of the inferences. But for simplicity, we are having you trade without updating from the trade offer. And even then, with the same prior, your valuations are so far apart that trade doesn't happen. But the theorem is stronger: even if the valuations were closer, the inference would prevent trade."

  **Final adjustment:**
    - We'll provide the expected value for each student in both rounds to avoid computational errors.

  **Revised Round 2 priors:**
    - Group1: prior P(A)=0.6 -> expected values: X:75, Y:43 (rounded)
    - Group2: prior P(A)=0.4 -> expected values: X:57, Y:25

  **Rules summary:**
    - Two rounds. In each round, an independent state (A or B) is drawn by the instructor (50-50 chance).
    - Each student receives a private signal (X or Y) that depends on the state (with p=2/3 as described).
    - In round 1, every student has the same prior: P(A)=0.5.
    - In round 2, students are randomly divided into two groups:
          Group1: prior P(A)=0.6
          Group2: prior P(A)=0.4
    - Each student starts with 1 unit of the asset and 50 points in cash.
    - Trading: 5 minutes per round. Students can trade by agreeing on a price for one unit. They can buy or sell multiple units, but cannot short (hold negative units) or borrow (have negative cash).
    - After trading, the state is revealed. Payoff = cash + (100 * number of units if state=A, or 0 if state=B).

  **Materials:**
    - Coin for flipping (state A/B).
    - Random number generator (or a deck of cards) to generate signals: for each student, if state A, then 2/3 chance of X. We can use a die: for state A, roll a die: 1-4 -> X, 5-6 -> Y? (2/3 chance). For state B: 1-2->X, 3-6->Y (1/3 chance for X, 2/3 for Y).
    - Slips of paper for signals in each round.
    - Cards for round 2: for Group1 and Group2, with their prior and their expected value for each signal.
    - Trade log: we can have students record their trades (optional) or just report final holdings.

  **Debrief points:**
    - Round 1: We should see little or no trade. Why? Because the valuations are either 67 or 33, and there's no price that a buyer and a seller would agree on without one of them being irrational. The no-trade theorem says that even if the valuations were closer, the fact that the other person is willing to trade would make you update your beliefs, leading to no trade. But in our case, the gap is wide enough that even without that, trade doesn't happen.
    - Round 2: We should see trade between Group1 with Y (value 43) and Group2 with X (value 57). They can trade at a price between 43 and 57. This trade occurs because they have different priors. They end up with different posteriors even with the same signal, and they don't know that the other has a different prior.
    - The key assumption that was dropped: the common prior. In round 1, everyone had the same prior. In round 2, they didn't. Hence, trade occurred.
    - Also, note: the no-trade theorem is about speculative trade (trade based on differences in information). If someone trades for hedging or liquidity, that's different. In our game, did anyone trade for liquidity? We didn't introduce any liquidity needs. So all trades were speculative.

  **Final Answer:**
  The one assumption the whole activity turns on is the **common prior**. If we botch that (by not having a common prior in round 1, or by having it in round 2), then the lesson would be lost.

