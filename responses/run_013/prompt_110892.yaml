  *checks watch* For the model answer, must avoid name-dropping while modeling philosophical moves: distinguishing act-evaluation from blamer-evaluation, treating standing as functional (does blaming serve its purpose here?), and showing how Ada's victim status creates special normative authority. The "concession restores standing" point should reveal standing as about relational legitimacy rather than moral purity.

