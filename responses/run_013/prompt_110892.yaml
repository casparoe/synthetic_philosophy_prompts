  Final tweak: adding the bystander variation explicitly in the preamble so they can't dodge it. And emphasizing "NO FENCE-SITTING" because this professor has clearly had enough of wishy-washy essays.
answer: |-
  Here's the complete exam package designed to force engagement with standing's conceptual structure:

  ### (1) Exam Question  
  **QUESTION 1 (25 marks): Answer ALL parts.**  
  *Preamble:* Ada discovers Ben has read her private journal without permission. She angrily blames him: "You had no right! This was a profound betrayal of trust!" Ben retorts: "But you did the exact same thing to your sister two years ago!" Ada concedes she did but explains: "I knew it was wrong and felt awful, but it was the only way to discover my sister was being abused. I’d do it again to prevent that harm. Your snooping was pure nosiness." Consider three scenarios:  
  (A) Ada is the victim (as above).  
  (B) Ada is a bystander who overheard about Ben’s act (not the journal owner).  
  (C) Ada never snooped but states she *would* do exactly what Ben did if in his position (claiming she’d feel justified by curiosity).  

  **Answer the following decisively:**  
  a. Precisely *what* makes Ada hypocritical (or not) in each scenario? Specify whether it hinges on her *past act-type*, her *reason for acting*, her *self-judgment*, or her *character*. (4 marks)  
  b. Does Ada’s justification/excuse for her *own* past breach affect her standing to blame Ben? Explain why or why not. (5 marks)  
  c. Does Ada’s status as victim (Scenario A) versus bystander (Scenario B) change her standing? Argue for the significance (or irrelevance) of this distinction. (6 marks)  
  d. In Scenario C, Ada concedes potential hypocrisy but blames anyway. If this concession *restores* her standing, what does that reveal about the nature of standing? If it *doesn’t* restore standing, why not? (5 marks)  
  e. Conclusively: Does "standing to blame" name a *distinct normative status* necessary for justified blaming, or is it reducible to factors like sincerity, efficacy, or relational roles? **No neutrality permitted.** (5 marks)  

  ---

  ### (2) Model Answer (685 words)  

  Standing to blame concerns not *whether* someone is blameworthy, but *who may legitimately blame them*. Ada’s case reveals that standing hinges on the blamer’s relationship to the norm violated and their own fidelity to it, not merely Ben’s blameworthiness.  

  **(a) Hypocrisy’s basis varies by scenario.** In (A) and (B), Ada’s hypocrisy lies in her *reason for acting* diverging from Ben’s, despite identical acts. She violated privacy for necessity; he did so for triviality. Her concession ("I knew it was wrong") shows consistent moral judgment, negating hypocrisy of *self-judgment*. In (C), hypocrisy arises from *character* or *principle*: she condemns in Ben what she’d willingly do, revealing inconsistent standards. The act-type alone is insufficient; motives and commitments define the inconsistency.  

  **(b) Justification matters critically.** Ada’s excuse ("I felt awful") doesn’t restore standing; remorse signals recognition of wrongdoing but doesn’t negate the violation. Her *justification* ("only way to stop abuse"), however, reframes her act as morally distinct from Ben’s. If she plausibly acted on a *permissible exception* (e.g., harm-prevention), she isn’t guilty of the *same* normative failure as Ben (gratuitous intrusion). Thus, her standing depends on whether the justificatory context genuinely differentiates her breach from Ben’s. If it does, no hypocrisy exists; if not, her standing is compromised.  

  **(c) Victim status confers unique standing.** As victim (A), Ada has a *direct relational stake* in Ben’s violation; his duty was owed *to her*. This grants her authority to blame akin to a creditor demanding repayment. The victim-blamer embodies the norm’s reciprocal structure. As bystander (B), Ada lacks this stake. Her blame risks *officiousness*—enforcing norms she hasn’t consistently upheld herself. Here, her hypocrisy (in reason or character) directly undermines standing because she positions herself as an enforcer while undercutting the moral high ground. The distinction shows standing isn’t just about the blamer’s purity but their *position to invoke the norm*.  

  **(d) Ada’s concession in (C) is revealing.** If admitting hypothetical hypocrisy ("I’d do it too") *restores* standing, it suggests standing requires *sincerity and transparency*—owning one’s flaws while upholding the standard. But this fails: if Ada admits she’d identically violate the norm, her blame becomes performative contradiction. Her concession doesn’t restore standing; it highlights its absence. Standing requires *alignment of action and judgment*, not mere confession of misalignment. This shows standing is about *entitlement to hold accountable*, not honesty about one’s faults.  

  **(e) Standing is irreducible.** It is a distinct normative status arising from **relational reciprocity** and **moral coordination**. Blaming isn’t just assessing wrongness; it’s a demand for accountability within a shared normative community. When Ada blames Ben:  
  - As victim, she exercises a *right* to protest injury.  
  - As inconsistent bystander, she lacks *moral authority* to demand Ben’s adherence to standards she flouts.  
  - Efficacy or sincerity are secondary: a remorseful hypocrite may be sincere yet still lack standing (as in C), and a victim’s blame may be ineffective yet legitimate.  
  Reducing standing to "who benefits" (victim status) or "who convinces" (efficacy) ignores its core function: upholding norms through *credible agents*. Without standing, blame degenerates into strategic or self-serving critique, untethered from mutual accountability. We cannot discard it without losing a pillar of moral practice.  

  ---

  ### (3) Marking Scheme (Total: 25 marks)  
  | **Point**                                                                 | **Marks** | **Common Mistakes**                                                                 |
  | :------------------------------------------------------------------------ | :-------- | :---------------------------------------------------------------------------------- |
  | **(a) Correctly identifies basis of hypocrisy per scenario**              | 4         | Vague claims (e.g., "she’s hypocritical"); ignores differences between scenarios.   |
  | **(b) Analyzes justification vs. excuse; ties to normative equivalence**  | 5         | Treats remorse as absolving hypocrisy; fails to contrast justification with Ben’s act. |
  | **(c) Articulates victim’s relational authority vs. bystander’s officiousness** | 6       | Equates victim/bystander standing; misses the role of owed duties.                  |
  | **(d) Explains why concession doesn’t restore standing in (C)**           | 5         | Assumes sincerity suffices; doesn’t address performative contradiction.             |
  | **(e) Commits to irreducibility; links standing to reciprocity/authority** | 3         | Reduces standing to sincerity, efficacy, or victimhood; remains neutral.            |
  | **(e) Grounds verdict in blaming’s social function (not just analysis)**  | 2         | Treats standing as decorative; no positive account of its role.                     |

  ### Why this works:
  - **Blocks standard moves:** Forces analysis of *what hypocrisy consists in* (a) and *why victimhood matters* (c), bypassing tu quoque recitals.  
  - **Prevents fence-sitting:** Part (e) demands a meta-commitment about standing’s ontology.  
  - **Case does heavy lifting:** Variations (bystander/hypothetical) make complacent answers impossible.  
  - **Timed efficiency:** Focused sub-questions direct writing; 50 mins is tight but feasible for prepared students.  
  - **Assesses depth:** Model answer shows conceptual moves (reciprocity, normative authority) without namedropping.  

  This should reward students who grapple with standing’s structure while exposing those who default to superficial debates about hypocrisy.
