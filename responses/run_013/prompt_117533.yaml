prompt: |-
  A regular commenter on a blog I read — econ PhD, very sharp — dropped this take on the common prior assumption and I've been chewing on it ever since:

  'The common prior assumption is just the idea that rational people start from the same beliefs; disagreement only ever happens because you have different information. Aumann proved that two rational agents can never agree to disagree, so if two people who've genuinely shared their evidence still disagree, at least one of them is being irrational. That's why game theorists build their models on common priors, and it's why the no-trade theorems say you can't have speculative bubbles — if everyone's rational and starts from the same place, there's nothing to bet on. Harsanyi called this the doctrine that we're all basically the same person underneath.'

  I have a nagging suspiscion this is quietly gluing together a modelling assumption, a theorem about common knowledge, and a normative claim about rationality, and that the glue isn't as tight as he makes it sound. Can you audit it for me? I definately want to know which parts are solid, which are the usual harmless simplifications, which are just wrong, what a defender of the CPA would push back on (and what a critic would push back on even harder), and whether his closing conclusions actually follow from whatever's left standing after the corrections.

  Format it like this: 'Bottom line' first, 2-3 sentences. Then 'Claim by claim', walking through each sentence of his in order — each entry starts with a one-word tag (Accurate / Simplification / Wrong) and then a few sentences of explanation. Then 'What the CPA actually says', one solid paragraph rebuilding the view as charitably as possible. Then 'What survives', one paragraph on which of his conclusions (if any) still stand once the errors are fixed. No citations or reading lists, just the reasoning.
reasoning: |-
  Alright, let me tackle this user's query. They're asking about a comment from an econ PhD regarding the common prior assumption (CPA). The user suspects that the comment might be mixing modeling assumptions, theorems, and normative claims. My job is to dissect each part of the commenter's statement and evaluate its accuracy.

  First, I need to recall what the CPA actually entails. It's a modeling tool used in game theory and economics, assuming that all agents start with the same prior beliefs before updating with private information. The user mentioned Aumann's agreement theorem and no-trade theorems, so I should check how those connect to CPA.

  Looking at the commenter's first claim: "The common prior assumption is just the idea that rational people start from the same beliefs." That's mostly accurate but a simplification. CPA is about shared priors, not necessarily that people are rational. Rationality comes into play in how they update beliefs with new information. 

  Next, "disagreement only ever happens because you have different information." This seems too strong. While different information is a key factor under CPA, other elements like computational limits or differing rationality could cause disagreements. The commenter might be oversimplifying here.

  Then, Aumann's theorem: "two rational agents can never agree to disagree" after sharing information. This is accurate but hinges on common priors and common knowledge of posteriors. If priors aren't common, disagreement can persist even after sharing info.

  The part about shared evidence leading to agreement or irrationality is problematic. Real-world barriers like communication issues or complexity can prevent true common knowledge, making disagreement possible without irrationality. Also, the no-trade theorems and speculative bubbles point assumes CPA holds, but in reality, markets have bubbles partly because CPA doesn't perfectly apply. 

  Harsanyi's "all basically the same person" quote is a simplification. CPA treats agents as identical only in priors, not in preferences or information. 

  The user's deeper concern seems to be about conflating a technical assumption with normative rationality. They want to know where the commenter's argument holds and where it overreaches. I need to clarify that CPA is a useful model but not a universal truth, and real-world disagreements don't always imply irrationality. Highlighting the gaps between the model's assumptions and practical scenarios will address their suspicion about "gluing together" different concepts.
answer: |-
  ### Bottom line
  The core insight about the CPA as a modeling tool and its link to Aumann's theorem is directionally correct but oversimplified to the point of distortion. The commenter conflates a technical modeling assumption with a universal normative claim about rationality, ignores critical limitations of the theorems, and draws overstated real-world conclusions (especially on speculative bubbles) that don't survive scrutiny.

  ### Claim by claim
  1.  **"The common prior assumption is just the idea that rational people start from the same beliefs;"**  
      *Tag:* **Simplification**  
      *Explanation:* The CPA *is* the assumption that agents share the same prior probability distribution over states of the world *before* receiving private information. It does not inherently require or define rationality, though it's typically *combined* with Bayesian rationality (updating via Bayes' rule). "Rational people start from the same beliefs" blends the CPA with rationality in a way that obscures the CPA's status as a separate, often *assumed*, starting point.

  2.  **"disagreement only ever happens because you have different information."**  
      *Tag:* **Simplification**  
      *Explanation:* This is *only* true *within the specific model* built on CPA and common knowledge of rationality + Bayesian updating. Outside this model, disagreement can arise from divergent priors (violating CPA), differing models/interpretations of the *same* information, computational limitations, bounded rationality, or genuinely different utility functions/objectives. The CPA framework *forces* all disagreement to be traceable to information asymmetry.

  3.  **"Aumann proved that two rational agents can never agree to disagree,"**  
      *Tag:* **Accurate** (within strict assumptions)  
      *Explanation:* Aumann's Agreement Theorem *does* prove this: If two agents have a common prior (CPA), update beliefs rationally (Bayes' rule), and their posteriors (beliefs after updating) are common knowledge, then their posteriors must be equal. They cannot "agree to disagree" (knowingly hold different beliefs).

  4.  **"so if two people who've genuinely shared their evidence still disagree, at least one of them is being irrational."**  
      *Tag:* **Wrong**  
      *Explanation:* This misapplies Aumann. "Genuinely shared their evidence" does not guarantee *common knowledge of posteriors* – the crucial requirement. Real-world communication is noisy, incomplete, and rarely achieves true common knowledge. Even with shared evidence, agents might disagree due to: (1) Different interpretations/models of the evidence (violating the 'same model' implicit in CPA), (2) Computational failures (Bayes is hard), (3) Genuinely different priors (violating CPA itself), or (4) Failure of common knowledge about *what* was shared or *how* it was interpreted. Disagreement post-communication does not *prove* irrationality.

  5.  **"That's why game theorists build their models on common priors,"**  
      *Tag:* **Accurate**  
      *Explanation:* This is correct. The CPA is a foundational *modeling assumption* in much of Bayesian game theory and mechanism design. It provides tractability, allows derivation of strong results (like Aumann's), avoids infinite regress in beliefs about beliefs, and reflects a methodological commitment to explaining differences via information asymmetry.

  6.  **"and it's why the no-trade theorems say you can't have speculative bubbles — if everyone's rational and starts from the same place, there's nothing to bet on."**  
      *Tag:* **Wrong** (as a real-world claim)  
      *Explanation:* No-trade theorems *do* show that under CPA, common knowledge of rationality, *and common knowledge that trade is occurring*, mutually agreeable trades shouldn't happen. However, this is a *theorem about the model*, not reality. Speculative bubbles demonstrably exist *precisely because* the CPA (and often common knowledge) fails in reality. People *do* have divergent beliefs/priors about asset values. The theorem highlights why trade happens *despite* the model's prediction, pointing to violations of its assumptions (different priors, divergent models, asymmetric information not fully resolved, irrationality).

  7.  **"Harsanyi called this the doctrine that we're all basically the same person underneath."**  
      *Tag:* **Simplification**  
      *Explanation:* Harsanyi *did* characterize the CPA this way, capturing its philosophical implication *within the model*. It emphasizes that differences in belief are purely informational, not fundamental. However, this is a *metaphor* describing the *assumption's effect*, not a claim that humans are literally identical. Critics argue this metaphor reveals the CPA's unrealistic suppression of genuine heterogeneity in cognition and worldview.

  ### What the CPA actually says
  The Common Prior Assumption is a technical postulate used within Bayesian models of games and information economics. It asserts that all agents in the model begin with an identical prior probability distribution over the set of possible states of the world. This shared prior represents a mutually consistent initial understanding of the fundamental structure of the environment before any private information is revealed. Agents then rationally update this prior using Bayes' rule upon receiving private signals. Within this framework, any observed disagreement in posterior beliefs *must* be attributable solely to differences in the private information agents have received. The CPA is adopted primarily for analytical tractability, to anchor beliefs in a consistent starting point, and to generate strong results (like Aumann's agreement) by isolating the role of information asymmetry as the *sole* driver of disagreement among agents assumed to process information identically and rationally. It is explicitly *not* a universally accepted empirical truth or a necessary component of rationality itself.

  ### What survives
  The core *modeling logic* survives: **within a model built on CPA, common knowledge of rationality, and common knowledge of posteriors, disagreement cannot persist after all information is fully and commonly known.** Aumann's theorem remains valid under its specific assumptions. The CPA is correctly identified as a foundational, simplifying assumption enabling this result and widely used in game theory. Harsanyi's metaphorical description accurately reflects the assumption's *effect within the model*. However, the **strong normative claims collapse**: Real-world disagreement after communication does *not* prove irrationality; it often reflects violations of CPA or common knowledge. The **real-world conclusions are reversed**: Speculative bubbles and active betting markets exist *because* the CPA and other assumptions of the no-trade theorems (like common knowledge of rationality and trade) routinely fail, not because they hold. The CPA is best understood as a powerful but highly stylized modeling tool, not a description of reality or a necessary condition for rationality.
