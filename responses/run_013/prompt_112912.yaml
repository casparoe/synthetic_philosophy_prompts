prompt: |-
  I spent most of last night arguing with my flatmate about political horse-trading and I still can't tell whether he's got a point or whether I'm just failing to spot the distinction. His claim is that there's no principled difference between a lobbyist slipping an MP cash for a vote and two MPs agreeing to swap votes on each other's pet bills, and that the same goes for the omnibus bill that bundles a dozen unrelated measures into a single vote so that everyone can hold their nose about the bits they hate, and even for those vote-pairing websites where two voters in different constituencies agree to cast their ballots for each other's preferred party so that a wasted vote in a safe seat gets converted into a useful one in a marginal seat. I want to know what these practices actually presuppose about moral value, so please take the role of a philosopher who works on practical reason and on the ethics of markets, and think it through carefully rather than giving me the usual line about corruption. Does the trade presuppose that the goods at stake across different issues are commensurable — that there is some common currency in which a hospital wing can be weighed against a farm subsidy? Does it presuppose that a vote is an instrument for producing outcomes rather than an expression of the voter's judgment, and if so, what becomes of the standard argument that buying votes is wrong because it corrupts judgment? Does the omnibus bill presuppose that moral value is additive, with no threshold below which a wrong can't be offset by a sufficiently large good? And does any of it require agent-neutral moral reasons, or could an agent-relative view — where I owe it to this cause to vote for it whatever anyone else does — license the trade just as well?

  Start with a quick brainstorm of the candidate readings before you commit to one, and be careful to seperate what the practices strictly presuppose from what they merely sit comfortably with; my suspicion is that logrolling is compatible with several quite different moral theories, and that the interesting question is where the practice is underdetermined. Then say which reading, if any, survives the money-versus-votes asymmetry — we gaol people for buying votes but shrug at vote-swapping — and what would have to change in how we regulate political deal-making if we replaced the presupposed view with a rival one. One more thing: my flatmate has got very into this idea of moral trade, the thought that two people with different moral priorities can both come out ahead by exchanging favours — the vegetarian who'll eat a steak if the carnivore funds an animal shelter for a year, say — and he wants to know whether moral trade is even coherent if moral reasons are supposed to be categorical, or whether it quietly assumes a utilitarian accounting in which everything has a price. Don't send me off to read anyone, I can't look anything up; give me the argument itself, in a form I can actually use tonight.
