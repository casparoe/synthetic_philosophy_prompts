  Okay, the user had a heated debate with their flatmate about political horse-trading and wants a philosopher's perspective. They're not looking for the standard corruption argument but a deeper analysis of what these practices presuppose about moral values. Let me unpack their main questions.

  First, they mention several scenarios: lobbyist bribing an MP, MPs swapping votes, omnibus bills, and vote-pairing websites. The user is questioning whether these practices assume that different goods are commensurable—like comparing a hospital wing to a farm subsidy. Also, does vote trading imply that votes are merely tools for outcomes rather than expressions of judgment? And what about omnibus bills—do they assume moral values are additive, with no thresholds? Plus, the role of agent-neutral vs. agent-relative reasons in justifying trades.

  Their flatmate brings up "moral trade," like a vegetarian eating steak in exchange for funding an animal shelter. The user wonders if such trades conflict with categorical moral reasons or secretly rely on utilitarianism. They need clear arguments to use in their discussion tonight, without referencing external sources.

  I need to address each practice's presuppositions carefully. Start by separating strict presuppositions from what's merely compatible. For instance, vote-swapping doesn't strictly require commensurability but might assume some comparability. The bribery case is different because it introduces external incentives, corrupting judgment. Vote-pairing and logrolling might be seen as strategic cooperation rather than commodification.

  The asymmetry between criminalizing bribery but accepting vote-swapping hinges on intent and corruption. Bribery involves external rewards, swapping is mutual support. Omnibus bills might presuppose additive value, but could also be a practical necessity in governance. 

  On moral trade, even categorical reasons can allow trades if they involve different moral domains or priorities. The vegetarian example works if the trade addresses separate moral concerns—personal purity vs. overall harm reduction. It doesn't necessarily require utilitarianism; deontologists could accept it if core duties aren't violated.

  The user's deeper need is to understand the ethical frameworks that make such practices permissible or not, and how to counter their flatmate's argument that all forms are equivalent. They need clear distinctions between bribery and cooperation, and how different moral theories view these acts. Highlighting the role of judgment corruption in bribery versus mutual agreement in swaps is key. Also, explaining that moral trades can be coherent within non-utilitarian ethics by separating personal commitments from broader impacts.
answer: |-
  Here’s a philosopher’s systematic breakdown of the moral presuppositions and tensions in political deal-making, designed for your debate tonight. I’ll address your core questions (commensurability, vote-as-instrument, additive value, agent-relativity) and your flatmate’s "moral trade" challenge.

  ---

  ### **1. Brainstorm: What Do These Practices *Strictly* Presuppose?**
  *(Separating necessary commitments from compatibility)*

  | **Practice**               | **Strict Presuppositions**                                                                 | **Compatible With (But Not Required)**                                                                 |
  |----------------------------|--------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|
  | **Lobbyist bribery**       | - Votes are alienable commodities (can be sold).<br>- Moral/political judgment is corruptible by external incentives. | - Commensurability of goods (if cash = policy outcome).<br>- Consequentialism (if outcome justifies means). |
  | **MP vote-swapping**       | - **Votes are instruments for outcomes** (not just expressions of judgment).<br>- **Agent-relative reasons can be traded** (I value your project more than you value mine). | - Weak commensurability (outcomes can be roughly compared).<br>- Deontology (if duties permit delegation/cooperation). |
  | **Omnibus bills**          | - **Moral/political value is (at least weakly) additive**.<br>- No absolute thresholds ("deal-breakers") exist *or* can be overridden. | - Strong commensurability.<br>- Pragmatism (gridlock avoidance trumps purity).                         |
  | **Vote-pairing (constituencies)** | - **Votes derive value from marginal impact** (not symbolic expression).<br>- Voters are strategic optimizers. | - Consequentialism.<br>- Rejection of "expressive" voting theory.                                    |

  ---

  ### **2. Key Asymmetry: Why Bribery ≠ Vote-Swapping**
  The legal/moral distinction hinges on **corruption of judgment** and **alienation**:
  - **Bribery**:  
    - *Presupposes* that external rewards *subvert* the MP’s independent judgment.  
    - Violates the **fiduciary principle**: MPs owe constituents undivided loyalty. Cash payment turns the vote into a *commodity*, detaching it from public reason.  
  - **Vote-swapping/Logrolling**:  
    - *Presupposes* that MPs retain judgment but *coordinate* to achieve mutually valued outcomes.  
    - No external incentive; trade occurs *within* the sphere of political goods. Swapping votes on Farm Bill A for Infrastructure Bill B treats votes as *tools*, not commodities.  
  - **Why we shrug at swaps but gaol bribery**:  
    Bribery introduces private financial interests into public decision-making, violating agency. Swapping is pure political cooperation – it "corrupts" only if you think outcomes should emerge from isolated judgments, not bargaining.

  ---

  ### **3. Moral Trade & Categorical Reasons: Is It Coherent?**
  Your flatmate’s "vegetarian eats steak ↔ carnivore funds shelter" example is insightful but **doesn’t require utilitarianism**.  

  - **Against Utilitarian Accounting**:  
    - Moral trade works if:  
      (a) Agents have **different moral priorities** (e.g., vegetarian prioritizes *reducing suffering*; carnivore prioritizes *culinary liberty*).  
      (b) The trade satisfies both priorities *better* than non-trade.  
    - This is coherent under **non-consequentialist** views:  
      - A **Kantian** could trade if core duties aren’t violated (e.g., no one is used *merely* as a means; both parties consent).  
      - An **agent-relative ethicist** could trade if their *personal* duty (e.g., "I must reduce animal suffering") is better fulfilled via trade.  
  - **Categorical Reasons Aren’t Voided**:  
    - The vegetarian’s duty "don’t harm animals" isn’t abandoned; it’s **outweighed** by the greater duty "prevent more harm" enabled by the shelter funding.  
    - **Presupposition**: Moral reasons have *weight*, not infinite stringency. Trade leverages differing marginal values across moral agents.  

  ---

  ### **4. What Changes if We Reject the Presuppositions?**
  | **If we reject...**                | **Implication for Deal-Making**                                                                 |
  |------------------------------------|------------------------------------------------------------------------------------------------|
  | **Commensurability**               | Omnibus bills become illegitimate – each policy must stand alone. Logrolling collapses.        |
  | **Vote-as-instrument**             | Vote-swapping/vote-pairing corrupts democracy (voting is expressive ritual, not outcome-tool). |
  | **Additive value**                 | Omnibus bills are unethical; "lesser evil" justifications fail.                                |
  | **Agent-relative reasons**         | Vote-swaps are incoherent (if I *must* vote for X, I can’t trade it away).                     |

  ---

  ### **5. Conclusion: What Survives Scrutiny?**
  - **Vote-swapping/logrolling** survives best: It presupposes only that votes are tools for outcomes and that agents can rationally cooperate. **Compatible with deontology, virtue ethics, or non-utilitarian consequentialism**.  
  - **Bribery** fails: It necessarily commodifies judgment.  
  - **Omnibus bills** are murkier: They weakly presuppose additive value but could be defended as pragmatic necessity in pluralistic societies.  
  - **Moral trade** is coherent without utilitarianism: It requires only that moral agents have *tradable priorities*, not that all values reduce to a "price."  

  **Tonight’s riposte to your flatmate**:  
  *"Swapping votes isn’t corruption – it’s political cooperation within the rules of the game. Bribery breaks those rules by injecting private cash. And yes, moral trade works without utilitarianism: it’s about smart prioritization, not selling your soul."*  

  Want to drill into one specific practice? I can tighten the argument further.
