prompt: |-
  I'm on the benefits committee at the hospital system where I work (I'm a nurse, not an HR person, so bear with me) and we're reviewing the parental leave policy before open enrollment, and I keep getting into arguments about it. Here's what it actually says. If you gave birth, you get eight weeks at full pay, and the policy files that under recovery leave — same bucket as somebody out for a knee surgery, a temporary medical accommodation. Then there's bonding leave: ten weeks job-protected for any new parent, by birth or adoption or surrogacy, but paid at 60%. And here's the part that blew up our last meeting — if both parents work for the system, the ten weeks is one pot they have to divide between them, it isn't ten weeks each. There's also a primary caregiver tag that unlocks four more paid weeks, but only one parent can hold it, and you just declare it yourself on an honor system, nobody checks. Adoptive and intended parents get bonding but not recovery, obviously. And the per diem and part-time staff, who are mostly women and mostly working the overnight shifts, don't get any of it.

  What I want to know is what this thing believes about families, because it feels like it's pulling in two directions. The medical part is paid in full and the relationship part is paid at 60% and has to be shared, which makes it look like the policy thinks recovering from childbirth is a real need and raising a baby is a nice-to-have you divvy up with your spouse like a timeshare. But then why the primary caregiver bonus, which only makes sense if the place thinks those early months really matter? Is it one view of what leave is for, or two stapled together by whoever negotiated it? My sister keeps calling it gendered, and I don't see it, because the wording never says mother or father anywhere — but maybe that's the point and I'm missing something. Also we've got two single parents on my unit and the split-the-pot rule seems to just assume there's always a second adult in the house, which they don't have.

  So what I'm after: reconstruct the view of the family, of care, and of who owes what to whom that this policy only really makes sense under. Tell me what it strictly has to believe versus what it merely happens to fit, which rival views it quietly rules out, and where it's actually underdetermined so that a few different theories would all sign off on the same policy. And if you swapped the view it seems to presuppose for a different one — say that care is work and whoever's paying has a stake in it regardless of who's earning — what concretely would have to change on the page? Put the bottom line in your very first sentence and then explain it, no preamble, and don't restate my question back at me.
reasoning: |-
  Okay, the user is a nurse on a benefits committee reviewing their hospital's parental leave policy. They're frustrated with the policy's contradictions and want to understand the underlying worldview it reflects. 

  Hmm, this policy is a fascinating mess of conflicting signals. Let me unpack its assumptions layer by layer. First, the full-pay "recovery leave" frames childbirth as a medical event equivalent to surgery - a temporary bodily disruption. Meanwhile, the 60%-paid "bonding leave" treats parenting as optional emotional labor. That's two completely different philosophies crammed into one policy. 

  The shared bonding leave pot assumes nuclear families with two employed parents - which erases single parents entirely. And that "primary caregiver" bonus? Such a half-hearted nod to attachment theory while maintaining plausible deniability. It's like they wanted feminist points without actually challenging the medical-industrial complex.

  Interesting how the user's sister calls it gendered despite gender-neutral language. She's right - the policy's architecture still funnels birth parents (disproportionately women) into the medical track while offering fathers/birth partners crumbs. The part-time/per diem exclusion is classist too - mostly women working overnight shifts getting nothing. 

  If this policy believed care was valuable work, it would pay bonding time at 100% and give each parent individual leave. The "primary caregiver" farce would vanish. And recovery leave? That should be separate and based on actual medical need, not tied to childbirth specifically. 

  The user's clearly spotted the cognitive dissonance here. They need ammo to argue for policy changes rooted in care ethics rather than corporate liability. I'll give them the philosophical blueprint they asked for - no fluff, just the structural analysis they can take back to committee.
answer: |-
  **This policy strictly believes families are nuclear units with an employed primary breadwinner and a secondary caregiver whose labor is optional, fundamentally viewing pregnancy as a temporary medical condition while devaluing infant care as non-essential labor.** Here's the reconstruction:

  1.  **Core Beliefs About Family & Care:**
      *   **Childbirth is Pathology; Parenting is Optional:** The 100% paid "recovery leave" strictly equates childbirth with surgery or illness – a temporary bodily disruption requiring medical recovery time. Bonding leave (60% pay) frames infant care as non-medical, primarily emotional "bonding," not essential *work*. The lower pay signals it's a luxury the employer partially subsidizes, not a core need.
      *   **The Nuclear Family Assumption:** The shared bonding pot *strictly requires* two employed parents within the system. It assumes a traditional household where leave is a shared resource to be negotiated *between spouses*, implicitly ruling out single parents (who get penalized) and devaluing single-earner households. It presumes parents can coordinate leave schedules.
      *   **The "Primary Caregiver" Mirage:** The bonus weeks reveal the policy *does* acknowledge the intensive care needs of a newborn. However, it assumes this role is singular (only one parent qualifies) and easy to identify/declare. This reinforces the breadwinner/secondary caregiver model, allowing the policy to *appear* supportive while limiting costs and avoiding scrutiny of actual care arrangements.
      *   **Labor Hierarchy:** Per diem/part-time staff exclusion strictly assumes their labor (and their family needs) are less valuable, reinforcing a class divide where only "core" employees deserve support.

  2.  **Beliefs About Obligation:**
      *   **Employer's Obligation is Medical & Minimal:** The employer owes full pay only for physical recovery deemed medically necessary (childbirth/surgery). Bonding is a lesser obligation met with partial pay and sharing restrictions. The *employer* defines the need and the terms.
      *   **Care Obligation is Private:** The policy assumes infant care is primarily the *parents'* private responsibility. The employer facilitates bonding only minimally and on its own terms (60% pay, shared pot). The burden of coordinating care within the family structure falls entirely on the employees.

  3.  **Rival Views Ruled Out:**
      *   **Care is Essential Work:** The policy rules out the view that infant care is vital, skilled labor deserving of full compensation equal to medical recovery. Bonding leave is explicitly *less* valuable.
      *   **Equal Partnership:** The shared pot rules out the idea that *both* parents have an equal, independent need and right to bond and provide care. It assumes care can be efficiently divided/delegated.
      *   **Diverse Family Structures:** It rules out validity for single parents, families where both parents work outside the system, or care networks beyond two employed parents. The "primary caregiver" bonus superficially nods to diversity but relies on an honor system that avoids acknowledging complex realities.
      *   **Gender Equity Intent:** While worded neutrally, the structure (medical leave primarily for birth mothers, the "primary caregiver" likely defaulting to mothers, exclusion of lower-paid female-dominated roles) quietly reinforces gendered care assumptions, ruling out a truly equitable approach.

  4.  **Underdetermined Aspects (Multiple Theories Could Fit):**
      *   **Purpose of Bonding Leave:** Is it primarily for infant development, parental well-being, employee retention? The policy doesn't specify, allowing proponents of various theories (attachment theory, work-life balance, talent management) to support it without resolving the core contradiction with the recovery leave value.
      *   **The "Primary Caregiver" Definition:** The honor system leaves this entirely undefined. It *could* fit a traditional SAHP model, a same-sex couple, or a non-birth parent taking the lead role. The policy avoids committing to any specific definition of what makes a caregiver "primary."

  **Swapping the Underlying View:**
  If the policy instead believed **"infant care is essential work critical to child development and societal well-being, and employers have a stake in supporting this labor regardless of the caregiver's employment status or biological role,"** concrete changes would be:

  1.  **Eliminate the Recovery/Bonding Distinction:** Create a single "**Parental & Medical Leave**" category. Birth parents would receive medical recovery time *in addition to* the core parental leave for care work.
  2.  **100% Pay for Core Parental Leave:** The essential period of infant care (e.g., 12-16 weeks) would be paid at 100% for *all* parents (birth, adoptive, intended, foster).
  3.  **Individual Entitlement:** Each parent receives their *full* leave allocation (e.g., 16 weeks). No sharing a pot. Single parents get the full entitlement.
  4.  **Abolish "Primary Caregiver" Tag:** All parents qualify for the full leave based on the arrival of a child. No need for designation.
  5.  **Medical Recovery Add-On:** Birth parents receive *additional*, fully paid medical recovery leave (e.g., 6-8 weeks) based on documented need, separate from the core parental leave.
  6.  **Inclusion of All Workers:** Eligibility based on hours worked over time, not full-time status. Per diem/part-time staff meeting thresholds qualify proportionally.
  7.  **Support for Diverse Families:** Explicit acknowledgment and support for single parents, non-biological parents, and diverse family structures within the policy text and implementation.
