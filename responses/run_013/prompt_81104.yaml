  For (iii) ordinality lends itself to jokes about welfare comparisons – like someone "proving" a trivial improvement is life-changing via monotonic transformations. The defense would stress that only choice-ordering matters, not intensity. 

  For (iv) semantic drift, perhaps show "preference" becoming meaningless when stretched to cover all behavior. The rebuttal: revealed preference deliberately avoids psychological claims. 

  ...After sketching, menu dependence feels richest. The "fruit bowl" scenario creates immediate visual absurdity while capturing the core critique: economists keep adding hidden states (like "shame") to explain contradictions. 

  Punchline refinement: The economist's desperate invocation of "bounded rationality" or "context" works better than technical jargon. Keeping it conversational ("pear-shame") makes the escalation funnier. 

  Defense section must be precise: Revealed preference theorists would argue that menu-dependent choices reveal stable underlying preferences over state-option pairs (e.g., "I prefer apples when pears are absent"). The joke bites because it implies this move makes the theory unfalsifiable – but defenders see it as properly complexifying the object of choice. 

  Final check: Does this work without citing Varian/Samuelson? Yes. The fruit example is textbook-level generic. The humor turns entirely on recognizing how quickly rationalization escalates when choices contradict.
answer: |-
  **Joke:**  
  An economist watches their friend choose an apple from a bowl containing only apples and pears.  
  Later, they see the friend choose a pear from a bowl with apples, pears, and durian.  
  Economist: "Aha! Proof you have pear-shame! You only pick pears when durian is present to make your choice *look* less embarrassing."  
  Friend: "Or... maybe I just don’t like durian?"  
  Economist: "Nonsense! Your revealed preference for pears *requires* durian-dependent preferences. Otherwise, how do we explain the inconsistency while preserving your stable ordinal ranking? Clearly, we must expand your state space to include 'social context of fruit judgment'."  

  **Punchline's Technical Foundation & Defense:**  
  This turns on **(ii) Menu dependence** and the resulting **(iv) Semantic drift**. The economist insists the friend’s choice reversal (pear rejected alone but chosen with durian) *must* imply a complex hidden state ("pear-shame") to preserve a "stable" preference ordering, rather than accepting the simpler explanation (disliking durian). This mirrors critiques that revealed preference can "explain" any behavior by inventing context-dependent states—risking vacuity.  

  **A defender’s rebuttal:**  
  Revealed preference theory *requires* specifying the full choice context (options, timing, information). If durian’s presence alters the *meaning* of choosing a pear (e.g., signaling durian avoidance), the menu *defines* distinct choice objects ("pear-in-durian’s-presence" vs. "pear-alone"). Thus, no inconsistency exists: choices reveal stable preferences over *state-contingent* options, not crude "fruit atoms." The joke errs by assuming choices over simple goods, not state-dependent bundles.
