prompt: |-
  I'm preparing a session for a small reading group on Ayer and the afterlife, and I keep getting stuck on a prior question that the discussion always skips past. Ayer is the figure everyone invokes when they want to insist that we cannot even assess a claim about surviving death until we have said what would count as evidence for or against it — that the demand for a criterion of meaning comes before the question of truth. As a methodological demand that is unobjectionable, but it does an enormous amount of hidden work, because it silently presupposes that we already possess a theory of what surviving death is: one that specifies the facts that would make the claim true and the observations that would bear on it. I want that theory made explicit rather than assumed. So before we consider anyone's verdict, give me the desiderata — the full specification of what any adequate theory of a person's surviving their own death has to deliver.

  I want the requirements set out with the case or consideration that motivates each. Which cases must the theory get right — and I care most about the awkward ones: gradual replacement of a brain part by part until nothing original remains, a perfect duplicate assembled at the instant of death, an intermittent or partial continuation, and the case in which what carries on is a later person who merely inherits your memories and dispositions. Which distinctions must it refuse to collapse: between surviving and being remembered, between surviving and being resurrected, between a person persisting and a pattern being re-instantiated, between the fact of survival and our ability to know of it. And which findings from outside philosophy can it not contradict — that the brain is causally bound up with the mental life we actually observe, that death involves the irreversible breakdown of the organism, that reports from the far side of death always trace back to a functioning or a failing brain. Mark which requirements are genuinely non-negotiable and which are merely the prejudices of one camp, and tell me whether any subset of them is jointly unsatisfiable; I suspect that the demand for survival to be a substantial fact about the world and the demand for it to be in principle decidable pull against one another, and I want to know whether that suspicion survives contact with the list. I would also like your view on which single requirement does the most to exclude the popular candidates.

  Assume I already know the main positions and have no need of a scorecard, a reading list, or citations — please do not tell me who to read or what to cite. Throughout, state how confident you are in each claim and single out the one point you are least sure of; if the desiderata themselves are the deliverable, I would much rather see your uncertainty marked on them than a smooth summary that hides it.
reasoning: |-
  Okay, let's tackle this user's deep dive into the requirements for a theory of surviving death. They're clearly frustrated with how discussions skip over the hidden assumptions in Ayer's approach. The core issue: everyone jumps to evidence without first defining what survival even means. The user wants the desiderata laid bare, especially the tricky cases and non-negotiables.

  First, I need to map out what they're asking for. They mentioned specific scenarios: brain replacement, duplicates, intermittent survival, and inheritance of memories. Each tests different aspects of persistence. Also, they want distinctions like survival vs. resurrection, and survival vs. being remembered. Plus, constraints from science like the brain's role and irreversibility of death. 

  The user suspects tension between survival being a substantial fact and being verifiable. That's crucial. If survival is undetectable in principle, is it even meaningful? But if it must be detectable, does that reduce it to something less than personal? 

  Breaking down the desiderata:

  1. **Substantial Continuity**: Survival must involve more than just memories or copies. Cases like duplicates show that a replica isn't *you*. So psychological connectedness alone isn't enough. Maybe a non-arbitrary criterion for personal identity is needed. But what? The user mentioned gradual brain replacement—if each step is identity-preserving, but the end result isn't you, that's a problem. This needs a solution, like a non-branching requirement or embodiment.

  2. **Distinction Preservation**: Survival isn't resurrection or being remembered. Resurrection implies a break, then recreation. But survival implies continuity. How strict must continuity be? If there's a gap, is it still survival? The intermittent case challenges this. Also, pattern replication vs. persistence—Survival requires the same instance continuing, not a new one with the same pattern.

  3. **Empirical Constraints**: The theory can't ignore brain dependency. Death is irreversible breakdown. Any afterlife claim must fit with these. Near-death experiences? They trace back to brain activity. So survival mustn't contradict neuroscience. But if survival requires brain function, how can it happen post-death? Maybe the theory needs a non-physical component, but that clashes with science. Huge tension here.

  4. **Epistemic Access**: How do we know survival occurred? If it's in principle undetectable, does that invalidate it? But verificationism might be too restrictive. The user wants survival to be a real fact, even if unknowable. But if it's undetectable, can it be meaningful? This conflicts with the substantiality requirement. If survival is real but undetectable, how is it different from non-existence?

  Now, assessing non-negotiables. Substantial continuity seems key—without it, survival is meaningless. Empirical constraints are also non-negotiable unless we reject science. But epistemic access is tricky. If we say survival must be verifiable, that might exclude legitimate theories. But if it doesn't, how do we test claims?

  The tension between substantiality and decidability: If survival is a deep fact, it might not be observable. But if it must be observable, maybe it reduces to detectable phenomena, losing its substance. For example, if we detect an energy pattern, is that *you* or just data? 

  The user's suspicion seems valid. Meeting both demands is hard. Any theory prioritizing verifiability might sacrifice substantial continuity (e.g., patternism). Conversely, a substantial theory (e.g., soul-based) might be unverifiable. 

  Which requirement excludes most candidates? Empirical constraints. Popular ideas like souls often ignore brain dependency. Near-death experiences are brain-based, so any theory invoking them as evidence must reconcile with that. Duplicates and brain replacements challenge psychological theories. 

  Least confident point: Epistemic access. Is verifiability necessary? If survival is real but undetectable, does it matter? But without evidence, how can we ever discuss it meaningfully? Yet demanding verification might be too strict. This needs more thought.
answer: |-
  Here are the desiderata for an adequate theory of personal survival after death, structured as requested. I've marked confidence levels (High/Medium/Low) and identified core tensions. The list prioritizes conceptual rigor over doctrinal alignment, with non-negotiables bolded.

  ---

  ### **I. Substantial Continuity Requirements**  
  1. **Non-Arbitrary Persistence Criteria**  
     - *Motivating case*: Gradual brain replacement vs. instant duplicate creation.  
     - *Requirement*: Must explain why continuity in Case A (gradual replacement) *feels* like survival while Case B (instant duplicate) feels like replication.  
     - *Non-negotiable*: **Yes** (without this, "survival" is vacuously redefinable).  
     - *Confidence*: High  

  2. **Identity Beyond Psychology**  
     - *Motivating case*: A later entity inherits your memories/dispositions but lacks subjective continuity.  
     - *Requirement*: Survival ≠ transfer of information. Must exclude "inheritance without identity" (e.g., a descendant reading your diary isn’t *you* surviving).  
     - *Non-negotiable*: **Yes** (prevents collapse into memorialism).  
     - *Confidence*: High  

  3. **First-Person Subjective Continuity**  
     - *Motivating case*: Intermittent existence (e.g., "I cease at death, restart in an afterlife").  
     - *Requirement*: Survival implies *unbroken* subjective perspective—gaps imply death/resurrection, not persistence.  
     - *Non-negotiable*: **Debatable** (some traditions accept resurrection; others reject gaps).  
     - *Confidence*: Medium  

  ---

  ### **II. Boundary Preservation Requirements**  
  4. **Survival vs. Resurrection Distinction**  
     - *Motivating case*: Reassembly of a person from new matter after cosmic entropy.  
     - *Requirement*: Survival requires continuity; resurrection is recreation. A theory must not conflate them.  
     - *Non-negotiable*: **Yes** (else "survival" loses meaning).  
     - *Confidence*: High  

  5. **Pattern vs. Particular Distinction**  
     - *Motivating case*: A perfect duplicate emerging at death.  
     - *Requirement*: Survival ≠ re-instantiation of a pattern (e.g., software rebooted on new hardware). The *particular instance* must persist.  
     - *Non-negotiable*: **Yes** (prevents "copying as survival").  
     - *Confidence*: High  

  6. **Survival vs. Epistemic Artifacts**  
     - *Motivating case*: Posthumous narratives ("He lives on in our hearts").  
     - *Requirement*: Must distinguish between *being remembered* and *being present*. Survival is ontological, not anthropological.  
     - *Non-negotiable*: **Yes** (core to the question).  
     - *Confidence*: High  

  ---

  ### **III. Empirical & Conceptual Constraints**  
  7. **Compatibility with Neural Dependence**  
     - *Motivating case*: Brain damage altering personality/consciousness.  
     - *Requirement*: Cannot contradict the causal dependence of mental states on brain states *in life*.  
     - *Non-negotiable*: **Yes** (barring radical skepticism).  
     - *Confidence*: High  

  8. **Irreversibility of Biological Death**  
     - *Motivating case*: Near-death experiences (NDEs) with verifiable details.  
     - *Requirement*: Survival must be consistent with death as *irreversible organismic breakdown*. NDEs must trace to peri-mortem brain states.  
     - *Non-negotiable*: **Yes** (biological fact).  
     - *Confidence*: High  

  9. **Non-Contradiction of Physics**  
     - *Requirement*: Survival cannot require violations of conservation laws (e.g., abrupt energy transfer to an afterlife).  
     - *Non-negotiable*: **Contextual** (less critical if dualism is assumed).  
     - *Confidence*: Medium  

  ---

  ### **IV. Epistemic Access Requirements**  
  10. **Decidability in Principle**  
      - *Motivating case*: Claims of undetectable afterlives.  
      - *Requirement*: Survival must have *possible* empirical consequences (e.g., detectable causal traces). Undetectable survival is indistinguishable from non-existence.  
      - *Non-negotiable*: **No** (verificationism is optional, but highly recommended).  
      - *Confidence*: Medium  

  11. **Separation of Fact from Knowability**  
      - *Requirement*: The *fact* of survival must be distinct from our *ability to confirm it*. Survival could be real but elusive (e.g., no communication channels).  
      - *Non-negotiable*: **Yes** (avoids collapsing metaphysics into epistemology).  
      - *Confidence*: High  

  ---

  ### **V. Core Tensions & Exclusionary Power**  
  - **Substantiality vs. Decidability Tension**:  
    A theory demanding robust persistence (e.g., particular identity) **and** verifiability struggles. Substance (e.g., soul continuity) often implies undetectability, while verifiable candidates (e.g., brain-uploaded patterns) fail substantiality. *This tension is genuine and severe*.  

  - **Most Exclusionary Requirement**:  
    **#7 (Neural Dependence)**. It eliminates:  
    - Popular dualism (if souls are independent, why do minds degrade with brains?)  
    - Afterlife NDEs (if they require functional brains, they aren’t post-death evidence)  
    - Disembodied survival (no mechanism for mental causation without neural correlates).  

  - **Weakest Point**:  
    **#10 (Decidability)**. Confidence: **Low**. Rejecting verificationism (e.g., "survival is real but undetectable") is coherent, but risks vacuity. Yet insisting on decidability may exclude valid metaphysical possibilities.  

  ---

  ### **Summary of Non-Negotiables**  
  | **Requirement**                     | **Status**         |  
  |-------------------------------------|--------------------|  
  | Non-arbitrary persistence (#1)      | Non-negotiable     |  
  | Identity beyond psychology (#2)     | Non-negotiable     |  
  | Survival ≠ resurrection (#4)        | Non-negotiable     |  
  | Pattern vs. particular (#5)         | Non-negotiable     |  
  | Survival ≠ being remembered (#6)    | Non-negotiable     |  
  | Compatibility with neural science (#7)| Non-negotiable     |  
  | Death as irreversible (#8)          | Non-negotiable     |  
  | Fact/knowability separation (#11)   | Non-negotiable     |  

  **Joint Unsatisfiability**: Requirements #1–2 (substantial particularity) + #7–8 (neural dependence/biological death) + #10 (decidability) *cannot all be fully satisfied*. Any theory will sacrifice one:  
  - Materialism (sacrifices substantial survival)  
  - Dualism (sacrifices decidability/neural compatibility)  
  - Patternism (sacrifices particularity).  

  **Recommendation**: Begin your session by framing survival theories as *trilemmas* forcing trade-offs between these poles. The desiderata expose why no position escapes cost.
