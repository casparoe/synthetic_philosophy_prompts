prompt: |-
  I've been reading rationalist blogs for about a decade now and I've got a decent working background in ML — mostly Bayesian modeling, latent variable models, identifiability and gauge issues, that sort of thing, plus enough measure theory to be dangerous and not enough to be careful. I'm trying to finally nail down where I land on Dennett's quining-qualia line of argument (the one where Chase and Sanborn are the two coffee tasters who both report that they no longer like the stuff, and the question is whether we can ever tell whether the coffee changed or they changed, and whether the alleged raw taste itself could be moved around independently of everything else). My rough picture is that Dennett is basically right and that what people call qualia are an incoherent posit, but I suspect I've just absorbed that from the water supply and that if I translate the whole debate into my own vocabulary I'll find I've been smuggling in assumptions.

  So: restate the qualia debate in the vocabulary of latent-variable modeling and measurement theory, as faithfully as you can. Both sides, not just Dennett's. Put the standard package of qualia properties — that they're ineffable, intrinsic, private, and directly apprehensible to the person having them — into terms like latent variables, identifiability, gauge freedom versus substantive invariance, calibration and inter-subject measurement invariance, reparameterization, and the difference between a model's parameters being unidentifiable and its parameters being unreal. Then do the same for the anti-Dennett side: the inverted-spectrum and Mary-style worries, the idea that there's a fact about the character of experience that no third-person model captures, the claim that functional or reactive facts can be fixed while the phenomenal fact varies. I want to see whether the four properties come out as four substantive constraints or as one triviality about high-dimensional states wearing four hats, and whether the qualophile's complaint translates into anything like a claim about a model class being too narrow rather than a claim about a further entity existing.

  Then the residue report, which is the part I actually care about. Which parts of the debate map cleanly onto my vocabulary, which required me to fudge, and which have no expression at all — and for each piece of residue, your honest read on whether that's my framework failing to say something real or the original claim having been less clear than it looked. In particular: does the first-person givenness of experience become anything more than a claim that the model is inside the system it models, and if so what more? Does privacy turn into gauge freedom, and if it does, does that make it metaphysically cheap or does it still do work? Is there a real difference between the taster who changed and the coffee that changed once you're allowed to treat the whole system jointly, or is the puzzle dissolved by that move in a way that's cheating? And at the end, tell me whether my suspicion — that this whole thing looks like an unidentifiability result dressed up as phenomenology — survives contact with the actual arguments, or whether I'm just pattern-matching to the tool I happen to have in my hand.
