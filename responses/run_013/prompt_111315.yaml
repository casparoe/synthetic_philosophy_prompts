  ### Exam Question  
  Consider the specification provided. Using a concrete instance with a finite environment set \(E = \{e_1, e_2, e_3\}\), define a policy \(\pi\), a distribution \(D\) over \(E\), and a loss function \(\ell(\pi, e)\) in \([0,1]\).  

  (a) Construct two guarantee statements:  
  - \(G_{\text{wc}} = (A, \varepsilon_{\text{wc}})\), a worst-case guarantee over a non-empty, proper subset \(A \subset E\).  
  - \(G_{\text{ac}} = (S, \varepsilon_{\text{ac}})\), an average-case style guarantee where \(S \neq E\), \(\varepsilon_{\text{ac}} < \varepsilon_{\text{wc}}\), and \(D(S) > D(A)\).  
  Compute \(\rho_D(G_{\text{wc}})\) and \(\rho_D(G_{\text{ac}})\). Prove they lie on the guarantee frontier under \(D\) and that neither guarantee implies the other.  

  (b) Assume both \(G_{\text{wc}}\) and \(G_{\text{ac}}\) hold. Describe a deployment distribution \(D^*\) causing catastrophic loss (e.g., \(\mathbb{E}_{e \sim D^*}[\ell(\pi, e)] > 0.9\)). State the single additional assumption about \(G_{\text{wc}}\) or \(G_{\text{ac}}\) that would prevent catastrophe.  

  (c) Argue why this assumption is particularly fragile in AI alignment. Facing unknown \(D^*\), should a designer prioritize \(G_{\text{wc}}\) or \(G_{\text{ac}}\)? Justify rigorously.  

