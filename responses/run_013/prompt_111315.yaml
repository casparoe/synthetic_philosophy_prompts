  4. **Fragility in alignment (4 marks)**: Links fragility to distribution shift, novelty, or feedback in alignment.  
     *Common error: Generic shift discussion without alignment context.*  
  5. **Guarantee choice (4 marks)**: Chooses \(G_{\text{wc}}\) or \(G_{\text{ac}}\) with justification tied to residual risk under \(D^*\).  
     *Common error: Selects based on tolerance alone, ignoring scope-residual trade-off.*  

