  2. **Frontier and non-implication (4 marks)**: Correct \((\rho_D, \varepsilon)\) points; proof neither guarantee implies the other.  
     *Common error: Claims one guarantee implies the other or misidentifies frontier points.*  
  3. **Catastrophe and assumption (4 marks)**: Valid \(D^*\) causing high loss; states \(\rho_{D^*}(G) \leq \delta\) as the assumption.  
