  First, a worst-case guarantee over a set A. Let A = {e1, e2}. For every environment in A, the loss is at most 0.5 (since ℓ(π,e1)=0.1≤0.5 and ℓ(π,e2)=0.5≤0.5). Thus, G1 = (A, 0.5). The residual under D is ρ_D(G1)=D(E\A)=D({e3})=0.2.

  Second, an average-case style guarantee: we choose a set S that has high probability under D but does not cover all environments, and we set a low tolerance on S. Let S = {e1}, where the loss is 0.1. The guarantee is G2 = (S, 0.1). The residual under D is ρ_D(G2)=D({e2,e3})=0.3+0.2=0.5.

  These two guarantees correspond to two points on the guarantee frontier under D: (0.2, 0.5) and (0.5, 0.1). The frontier is the set of achievable (residual, tolerance) pairs.

  Neither guarantee implies the other. To see that G1 does not imply G2, note that G1 requires a tolerance of 0.5 on A, but it does not require the tolerance of 0.1 on e1 (it only requires 0.5). Moreover, G1 does not cover e3. However, G2 requires a tolerance of 0.1 on e1. Even though the loss on e1 is 0.1 (which satisfies G2), G1 does not require this tight a bound on e1. In fact, if the loss on e1 were 0.5 (which would still satisfy G1), then G2 would be violated. Thus, G1 does not imply G2. Conversely, G2 does not imply G1 because G2 only covers e1. It says nothing about e2 and e3. In particular, it does not guarantee that the loss on e2 is at most 0.5 (it is, but G2 doesn't require it) and it does not cover e3 at all. Therefore, G2 does not imply G1.

  (b) Suppose both G1 and G2 hold (which they do in our example). Consider a deployment distribution D* that is concentrated on e3: D*(e3)=1. Then the expected loss under D* is 1.0, which is catastrophic (above 0.9). 

  The single additional assumption that would prevent catastrophic deployment is that the residual under D* for the guarantee we rely on is small. Specifically, if we rely on a guarantee G, we must assume that ρ_{D*}(G) ≤ δ for a small δ. For example, if we rely on G1, we need ρ_{D*}(G1)=D*(E\A)=D*({e3})≤δ. Then the loss under D* is at most 0.5 + δ. If δ is small, say 0.1, then the loss is at most 0.6. Similarly, if we rely on G2, we need ρ_{D*}(G2)=D*(E\S)=D*({e2,e3})≤δ. However, in our D*, this residual is 1.0, which is not small.

  (c) The assumption that ρ_{D*}(G) is small is fragile in AI alignment because the deployment distribution D* is unknown and can differ significantly from D. Alignment concerns include distributional shift from feedback loops, adversarial inputs, or novel situations. Since we train in a limited distribution, the residual set under D might be small, but under D* it might be large. For instance, e3 might represent a rare failure mode in D that becomes common in deployment.

  When D* may differ from D, the designer should not rely blindly on either guarantee. The worst-case guarantee over A might be preferable if A is expanded to cover environments we anticipate in deployment, but this is often difficult. The average-case style guarantee is tied to D and might be brittle under shift. The key is to choose a guarantee with a scope that we have reason to believe will cover D*. Without such knowledge, we must either accept a high tolerance (by expanding the scope) or face residual risk. In alignment, we often seek worst-case guarantees over broad sets (e.g., via formal methods), but this may be infeasible. Therefore, the designer should rely on the guarantee for which they can best argue that the residual under D* is small, which typically involves understanding and mitigating potential distribution shifts.

