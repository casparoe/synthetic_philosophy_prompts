  But now Rule 4 locks itself and Rule 6? That's recursive. But that's the point. We want Rule 4 (which sets the two-thirds requirement) to be locked, so that changing it requires two-thirds. Similarly, Rule 6 (the amendment rule) is locked.

  However, note that Rule 4 also locks Rule 5 (the unspecified cases). That might be too broad? But we can try.

  Alternatively, to keep it simpler, we can lock only the core amendment rules and the rule about locked rules. Let's try:

  Version 3 (simpler locked set):

  ```
  Rules:

  1. Starting Points: Each player starts with 10 points.

  2. Turn Actions: On your turn, choose one:
     a) Transfer: Move 2 points from yourself to another player.
     b) Propose: Propose a rule change (add, remove, or modify a rule). Write it down.

  3. Voting: After a proposal, vote. Majority "yes" passes it (unless Rule 4 applies).

  4. Locked Rules: Rules 2, 3, 4, and 6 are locked. Changing a locked rule requires a two-thirds majority vote.

  5. Unspecified: Anything not covered is decided by the current player.

  6. Amendment Rule: Rule changes can only be made by the procedure in Rules 2 and 3. This rule is locked.

  7. Turn Order: Clockwise, starting randomly. 2 minutes per turn.

  8. Winning: First to 30 points wins. Game ends immediately.

  Note: The rules are the entire world. No referee.
