  In this version, Rule 1 (starting points) and Rule 7 (turn order) and Rule 8 (winning) are not locked. So they can be changed by simple majority. But the core procedure (how to propose, vote, and the amendment rule) and the rule about locked rules are locked.

  Now, the paradox can arise if someone tries to change Rule 4 (the locked rule) by simple majority? But Rule 4 says that changing a locked rule requires two-thirds. So if someone proposes to change Rule 4 to require only a simple majority, that would require a two-thirds vote to pass because Rule 4 is locked. But if they get two-thirds, then it passes and now locked rules can be changed by simple majority. Then the system is changed.

  But what if someone proposes to change Rule 6? Rule 6 says that rule changes can only be made by Rules 2 and 3. If they change Rule 6, they might try to bypass the procedure.

