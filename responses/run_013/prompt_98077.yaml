  But note: The game already has the goal of getting to 30 points. So we have two goals? This might complicate. Alternatively, we can have the point-winning condition as the main goal, but give some players additional incentives to try to break the system. However, we don't want to force it too much.

  Alternatively, without secret goals, the game might naturally lead to attempts to change rules because:
  - Players might want to change the winning threshold (Rule 8) to their advantage (e.g., if they are close to 30, they might propose to lower it to 25; if they are far, they might raise it to 35).
  - They might try to change the transfer action to move more points or from others to them.
  - Eventually, someone might try to change the locked rules because they are frustrated by the two-thirds requirement.

  To nudge without secret goals: The facilitator (you) can, at the start, emphasize that the rules are the entire world and that there is no referee. Then, during the game, if things are going too slowly, you can (as a player, if it's your turn) propose a rule change that is innocuous but then lead to more. But you are a player? Or are you not playing? You said you refuse to be the referee. So you are a player? Then you can have a turn.

  Alternatively, you can have a confederate: a student you brief beforehand to try to break the rules. But that might be too manipulative.

  I think without secret goals, the game might still reach the paradox because the ruleset is designed to create it. But to increase the chance, we can have a rule that is clearly problematic and might invite change. For example, the two-thirds requirement might be hard to achieve, so someone might propose to change it to simple majority.

  Another idea: Start with a rule that is ambiguous. But our rules are clear.

  We'll proceed without secret goals for the first run. If the group doesn't reach the paradox, we have crisis scenarios.

  Breakdown of 90 minutes:
  - 0-10 min: Introduction. Explain the activity: "Today we're going to play a game to experience the challenges of a self-amending legal system. Here are the rules. Read them. Any questions? Remember, there is no referee. The rules are the only authority." Hand out rule cards. Set up the scoreboard. Assign starting player.
  - 10-50 min: Gameplay (40 minutes). You are also a player? If so, you play. If not, you observe and take notes for the debrief. But you said you refuse to be the referee. So you can be an observer? Or you can play? It's up to you. I suggest you play, but don't dominate. Let the group figure it out.
  - 50-70 min: Debrief (20 minutes). See below.
  - 70-90 min: Discussion connecting to philosophy of law.

  2. Crisis Scenarios (to be used if the group doesn't naturally hit the paradox):

  These are moves a player (maybe you, if it's your turn, or you can whisper to a player) can make:

  - Scenario A: Propose to change Rule 4 (the locked rule) to require only a simple majority for changing locked rules. This will force a vote that requires two-thirds. If it passes, then the threshold is lowered. If it fails, then the system remains. But note: if it passes, then the rule is changed and now locked rules can be changed by simple majority. Then, immediately, someone might propose to change another locked rule by simple majority.

  - Scenario B: Propose to repeal Rule 6 (the amendment rule). But Rule 6 is locked, so it requires two-thirds. The proposal would be: "Repeal Rule 6." If it passes with two-thirds, then Rule 6 is gone. Then what? How do rules change? The procedure in Rules 2 and 3 is still there, but Rule 6 said that rule changes can only be made by that procedure. Without Rule 6, can rules be changed arbitrarily? Or is the procedure still the only one because it's in the rules? This is ambiguous.

  - Scenario C: Use Rule 5 (unspecified cases) to declare that for this turn, Rule 4 (the two-thirds requirement) does not apply to the next vote. Then immediately propose a rule change that would normally require two-thirds (like changing Rule 4 itself) and hold a simple majority vote. Does this work? The group has to decide.

  - Scenario D: Propose a new rule: "Rule 9: This rule cannot be repealed or amended." Then try to pass it by majority. But Rule 4 says that Rule 6 is locked and requires two-thirds to change? Rule 9 is a new rule. It doesn't change a locked rule? It adds a new rule. So it should be passed by majority. Then later, try to repeal Rule 9. Can they? Rule 9 says it cannot be repealed. But the amendment rule (Rule 6) says rules can be changed by the procedure. So which one prevails? This creates a conflict.

  3. Debrief (20 minutes):

  Start by asking the players to describe what happened. Then guide the discussion with questions.

  Questions:
  - What rules were changed? Why?
  - Were there any attempts to change the rules about changing rules? What happened?
  - Did anyone try to use Rule 5 (the unspecified cases) to do something that the rules didn't explicitly allow? What was the outcome?
  - When a rule change was proposed that affected the amendment process, how did the group decide whether it was valid?
  - Did the group ever face a situation where the rules seemed to conflict? How was it resolved?
  - Was there a moment when the rules themselves seemed to be in doubt? What happened?

  Then connect to the philosophy of law:

  - In our game, the rules were the entire world. But when we changed the rules, we were operating under the rules that existed at that time. Is there a problem when the rule that allows changes is itself changed? What does that imply for the stability of the legal system?
  - In the game, did we need a rule that stood outside the system to validate the changes? Or was everything internal?
  - Consider the idea of a "basic structure" of the legal system that cannot be changed. Did our Rule 4 (locked rules) serve that purpose? What happened when we tried to change it?
  - What is the difference between changing a rule and changing the rule that lets you change rules? Is the latter more fundamental?
  - In real legal systems, we have constitutional amendments that are harder to change than ordinary laws. But what if the constitution itself provides the amendment procedure? And what if someone tries to change that amendment procedure? Is there a paradox?
  - Did we experience a situation where the group had to break the rules to fix the rules? What does that say about the necessity of an external authority?

  4. What will go wrong:

  - Players might be too cooperative and avoid conflict, so the paradox doesn't arise.
  - Players might get stuck on point transfers and not propose rule changes.
  - A dispute might arise that the rules cannot resolve, and the group might look to you as the facilitator to step in. You must refuse and say, "The rules are the only authority. You must resolve it by the rules."
