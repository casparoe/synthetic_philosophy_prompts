answer: |-
  ### Analysis of Triple-Based Fact Representation and Propositional Unity

  | Design Feature                     | Presupposed Commitment About Unity                                                                 | Rival Account Excluded                                      | Verdict on Bradley's Regress             | Underdetermined? |
  |------------------------------------|-----------------------------------------------------------------------------------------------------|-------------------------------------------------------------|------------------------------------------|------------------|
  | **Predicate as separate slot**     | Predicates are relations with intrinsic "relationality" requiring arguments to form a complete unit. | Frege’s unsaturated concepts (slots imply fixed saturation needs, not Fregean incompleteness). | **Presupposes it** (relation "needs" relata but no internal account of binding). | No               |
  | **Fixed arity of three**           | Unity is structurally constrained: one relation + two relata form an atomic fact.                  | Multiple-relation views of judgment (e.g., Russell’s, where relations can variably bind terms). | **Sidesteps it** (avoids variable binding by fiat). | Yes (compatible with primitive ties/facts). |
  | **Ordered positions**              | Directionality (subject→object) is essential to unity; order provides relational asymmetry.        | Non-directional accounts (e.g., symmetric relations like "sibling-of" require artificial ordering). | **Presupposes it** (order imposes unity without explaining how). | No               |
  | **Record as single unit**          | The triple *is* the unified proposition; unity is conferred by the container structure itself.     | Propositions as facts (facts are truthmakers, not containers) or acts of predication (unity via mind, not syntax). | **Generates it** (container requires unification of slot-holders). | No               |

  ### Key Feature Doing the Most Unacknowledged Work
  **Record treated as a single unit** does the most unacknowledged work. It implicitly assumes a "container" model of unity, where packaging constituents into one record (e.g., an RDF triple) mechanically resolves propositional unity. This bypasses philosophical justification for *how* disparate elements cohere, masking Bradley’s regress by treating syntax as ontology—the container’s existence substitutes for an account of relational binding.
