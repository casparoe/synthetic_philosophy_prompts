  - Verdict on Bradley's regress (does it answer, sidestep, or presuppose the regress)
  - Whether it's underdetermined (if other theories could still work with it)

  After the table, I need to identify which single feature does the most unacknowledged work. I think the "record treated as a single unit" is crucial because it implicitly assumes unity without explaining it, which hides the regress problem rather than solving it.

