  Okay, the user is a novelist writing a courtroom drama set in post-WWII tribunals, featuring a defense lawyer who repeatedly invokes "no crime without law." They need to unpack this legal maxim to portray the character accurately without making him sound foolish or tedious. 

  Hmm, the user clearly understands this isn't a single idea but a spectrum of legal arguments. They're specifically probing three layers: the gap between basic legality requirements vs. strict ex post facto prohibitions, whether this principle is truly about law or about fairness/victor's justice, and if the two Latin phrases are interchangeable. Smart questions.

  Right, let's dissect this systematically. The maxim has at least five distinct interpretations ranging from tautological to revolutionary. The weakest version (P1) is undeniable but useless in court - everyone agrees punishment requires legal basis. The strongest (P5) could invalidate the entire tribunal by claiming victors invented new laws post-defeat. 

  Ah, the Tokyo Tribunal dissent is crucial here. Judge Pal's radical nullum crimen argument (aligned with P5) would indeed get charges dismissed, not just lamented. Whereas intermediate positions (P2-P4) might earn rhetorical points but not derail convictions. The prosecutor could concede P2-P3 while still securing verdicts.

  Noticing the user's subtle point about Latin phrasing - nulla poena and nullum crimen aren't identical twins. One prevents punishment without law (P1), the other prevents inventing crimes retroactively (P4-P5). Their lawyer character conflating them is actually quite realistic - it mirrors historical legal debates where these got blurred in practice.

  For the character's credibility: He'd sound most compelling when pressing P4/P5 arguments about ex post facto laws, especially regarding crimes against peace. That's where the tribunals were genuinely vulnerable. But if he drones on about P1/P2 during clear-cut war crimes testimony? That might deliberately show him as out of touch or strategically obstructionist.

  The victor's justice angle is interesting. While not strictly part of nullum crimen, it's the elephant in the courtroom. A shrewd defense counsel might tie it to P5 by arguing the Allies applying new standards they themselves violated (bombing campaigns/colonialism) proves the law wasn't pre-existing or impartial.

  Better structure this as tiered arguments with practical consequences. Show which interpretations would make judges shift uncomfortably versus which would get eye-rolls. The Tokyo dissent gives perfect historical weight to the strongest reading.
answer: |-
  Right then, let's dissect this maxim for your learned advocate. He's wielding a powerful, multi-edged sword, but its effectiveness depends entirely on which edge he sharpens. Here's the menu of readings for *nullum crimen/nulla poena sine lege*, graded from weakest to strongest, with their nature and courtroom impact:

  1.  **P1: The Bare Existence Requirement (Platitude):**
      *   **Assertion:** Punishment (*poena*) or conviction for a crime (*crimen*) requires *some* existing law authorising it. You cannot punish arbitrarily where *no law whatsoever* applies.
      *   **Nature:** Platitude. A foundational bedrock of any system claiming to be legal, not purely despotic. Universally accepted in principle (though often violated in practice).
      *   **Courtroom Impact (Prosecutor's Shrug):** Utterly ineffective. The tribunals *did* ground their judgments in written Charters (Nuremberg & Tokyo) and existing laws of war (for war crimes/crimes against humanity). The prosecution easily points to the Charter. Your advocate sounds pedantic stating the obvious.

  2.  **P2: The Specificity Requirement (Substantive Principle, Often Weak Here):**
      *   **Assertion:** The law must not only exist but must be *sufficiently specific* to define the prohibited conduct. Vague laws are unjust.
      *   **Nature:** A substantive and defensible principle of fairness (rule of law). Requires laws clear enough for people to understand what is forbidden.
      *   **Courtroom Impact (Prosecutor's Shrug):** Marginally effective rhetorically, but easily countered. The prosecution argues that concepts like "murder," "torture," "ill-treatment," "wanton destruction" in war crimes/crimes against humanity *were* sufficiently specific under existing treaties and customary law. For Crimes Against Peace, they argue "aggressive war" had been outlawed by treaties like the Kellogg-Briand Pact (1928). Your advocate can argue vagueness (especially on "aggression"), but the court will likely defer to its Charter's definitions.

  3.  **P3: The Accessibility/Knowability Requirement (Substantive Principle):**
      *   **Assertion:** The law must be promulgated or otherwise accessible *and knowable* to the accused *before* they act. Secret or utterly obscure laws cannot fairly ground punishment.
      *   **Nature:** A substantive and defensible principle of fairness (fair warning). Closely linked to specificity.
      *   **Courtroom Impact (Prosecutor's Shrug):** Stronger rhetoric, but conviction stands. For war crimes/crimes against humanity, the Hague/Geneva Conventions, military manuals, and state practice were known. For Crimes Against Peace, the prosecution points to Kellogg-Briand, condemnations of aggression (e.g., Manchuria, Ethiopia), and argues leaders *knew* aggressive war was condemned. The court accepts the Charter codifies pre-existing or developing norms. Your advocate can passionately argue the accused couldn't foresee *individual criminal liability* for state acts like aggression, but the tribunal asserts they should have.

  4.  **P4: The Non-Retroactivity Core (Nullum Crimen) (Substantive & Radical in this Context):**
      *   **Assertion:** **Crucially:** The *specific crime* for which the accused is charged, with its *precise elements and attached individual criminal liability*, must have existed *as positive law (treaty or custom)* **before** the act was committed. Applying a *new* legal definition *afterwards* is unjust *ex post facto* law.
      *   **Nature:** **The heart of the genuine controversy.** A substantive, defensible principle central to the rule of law. This is where "no crime without law" bites deepest. It's not just about punishment or vague laws, but about inventing the *crime itself* retrospectively.
      *   **Courtroom Impact (Potentially Case-Dismissing for Specific Charges):** **This is your advocate's strongest substantive argument for dismissing Crimes Against Peace (Aggressive War) and potentially Conspiracy to Wage Aggressive War.** He argues: "Where was the *positive international law*, before 1945, that said planning/starting war *is an individual crime* triable by an international court? Kellogg-Briand outlawed war *between states*, not individuals. Where is the treaty or settled custom creating this *individual criminal liability*?" The prosecutor counters that the law *was* evolving, the Charter reflects custom, and the defendants knew aggression was wrong. **This is the argument Judge Radhabinod Pal embraced at Tokyo in his Dissent.** He argued Crimes Against Peace were *ex post facto* creations. If the court accepted P4 fully, those specific charges *must* be thrown out. (Nuremberg/Tokyo courts ultimately rejected this, asserting the law existed before).

  5.  **P5: The Victor's Justice Corollary (Radical & Contested):**
      *   **Assertion:** The principle is violated not just by retroactivity *per se*, but by the *unequal application* of the law. If the victors themselves engaged in arguably similar conduct (area bombing, colonialism) but are immune from prosecution under *their own* newly-minted laws, the tribunal lacks legitimacy and fairness. The "law" is merely the victor's will disguised.
      *   **Nature:** **Radical critique.** Not strictly part of *nullum crimen* as a legal doctrine, but a powerful moral and political extension of its *spirit* concerning fairness and the rule of law vs. power. It highlights the gap between the *ideal* of legality and the *reality* of power politics.
      *   **Courtroom Impact (Deplored, Not Dismissive):** This won't get charges dismissed legally. The bench will rule it irrelevant ("tu quoque" is not a defence) or beyond the tribunal's remit. However, this is where your advocate can be most **bitter** and rhetorically devastating. It exposes the hypocrisy and undermines the tribunal's moral authority, even if it doesn't change the verdict. It speaks directly to his bitterness about bombers and empires. A prosecutor cannot grant this without undermining their entire case, but they will dismiss it as political, not legal.

  **On the Latin Conflation:**

  *   ***Nullum crimen sine lege*** (No crime without law): Focuses on the **definition of the offence itself**. It forbids creating *new crimes* retroactively (P4 is its strongest expression).
  *   ***Nulla poena sine lege*** (No punishment without law): Focuses on the **penalty/sanction**. It forbids applying punishments not prescribed by law *at the time of the crime*, or arbitrary punishments.
  *   **Are they the same?** No, but they are **intimately linked twins**. You typically cannot have a just *poena* without a pre-existing *crimen*. In practice, arguing one often implies the other. Your advocate using them interchangeably reflects how they were (and are) often run together in legal discourse, especially when challenging the fundamental legitimacy of a *new* offence. However, *nullum crimen* is the sharper weapon against *ex post facto* offences like Crimes Against Peace.

  **Which Readings Help Your Advocate?**

  *   **To merely deplore:** P1, P2, P3 (to an extent), P5. The court acknowledges the principles but finds they are satisfied or are overridden by necessity/justice.
  *   **To potentially get charges thrown out (especially Crimes Against Peace/Conspiracy):** **P4 (Nullum Crimen - Non-Retroactivity Core)**. This is the serious, legally grounded argument that Judge Pal used. It forces the court to confront whether it is applying pre-existing law or making new law. It's the difference between arguing the trial is *unjust* and arguing it is *unlawful*.
  *   **To expose hypocrisy and bitterness:** **P5 (Victor's Justice)**. This won't win legally but gives him profound moral force.

  **Your Advocate's Credibility:**

  He avoids being a fool or a bore by focusing relentlessly on **P4** for the aggressive war and conspiracy charges. This is the serious, learned jurist's argument. He uses P3 (knowability) to support P4, arguing leaders couldn't foresee *individual criminal liability* for state acts. He deploys P5 (Victor's Justice) sparingly but powerfully, perhaps in closing remarks or outside the formal record, to show the human cost of the legal hypocrisy. Using the Latin interchangeably is realistic legalese, but his core, repeated thrust for dismissal should be the *ex post facto* creation of crimes (P4) – that's where the legal battle was genuinely fought, and where a serious jurist would plant his flag. Judge Pal's dissent provides the perfect historical anchor for this position.
