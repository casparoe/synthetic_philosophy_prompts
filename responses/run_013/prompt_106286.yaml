prompt: |-
  I'm a software engineer with no formal background in philosophy, and I've been trying to find a name for a pattern that keeps surfacing in different guises. I first ran into it while building tooling for an internal forecasting exercise, and later while reading about how bookmakers and markets operate.

  The forecasting case: a colleague told me she was 30% confident in some event A, 60% confident in B, and 40% confident that both A and B would occur. Taken one at a time, each figure sounds defensible, but they cannot all be right, since both happening requires A to happen, and she cannot be more confident of the pair than of the first alone. What interested me was that this is not merely an abstract inconsistency. Had I been willing to take the opposite side of all three of her estimates at the odds those figures imply, I would have come out ahead regardless of how things turned out — the loss is not a matter of bad luck but is built into the commitments themselves.

  The same shape then appeared somewhere with no uncertainty at all. A colleague had a set of preferences over trades that were unobjectionable one at a time: offered any single one, he would accept it. Offered in sequence, however, he would end up strictly worse off than he began, having agreed to every step himself, with no gamble involved. And in the market setting, this seems to be part of what people mean when they call a set of prices off — that one can trade around them and lock in a profit.

  There is one further wrinkle that makes me doubt the betting case is simply about inconsistency at a single moment. I suspect that a person whose estimates are perfectly consistent at every instant could still be trapped, provided those estimates shift over time in the wrong way — that it is the sequence of revisions, and not any one set of numbers, that does the damage.

  I am reasonably sure the betting version has a name, and I suspect the over-time version and the market version may be the same idea or may be distinct ideas that merely resemble one another. What I want is not a label but the carving:

  - Is the essential feature the guaranteed loss, the inconsistency among the commitments, or the fact that a third party can exploit them? Can any of these come apart from the others?
  - Is the all-at-once case (the three estimates) the same phenomenon as the case that unfolds over time (the sequence of trades, or the drifting estimates)? If they differ, what precisely separates them?
  - How does the market case relate? Is arbitrage the same concept, a special case of it, or something adjacent?
  - Does the bare possibility of constructing such a trap actually establish that the person is being irrational, or does it only establish that they can be taken advantage of? People often wave this away by saying they would never accept all the bets at once, and I cannot tell whether that is a substantive reply or a dodge.
  - Where are the edges of the phenomenon? Must the loss be certain, or does a probable loss suffice? Does it matter whether the person ever actually accepts the bets?

  If there is an established name — or a family of related names — I would like the nearest ones set out and told apart, and if what I have described is really a blend of several, I would like to know which piece belongs to which.
reasoning: |-
  Okay, the user is a software engineer encountering a pattern across forecasting, preference aggregation, and markets. They want to understand the philosophical and conceptual underpinnings. Let me start by breaking down their examples.

  First, the forecasting inconsistency: three probabilities that are incoherent. The colleague's estimates violate the basic probability rule that P(A and B) can't exceed P(A). The key here is the Dutch Book argument—making a sure loss by accepting all bets. That's a static inconsistency.

  Then the preference case: sequential trades leading to a worse outcome. Each trade seems acceptable alone, but the sequence results in a loss. This sounds like intransitive preferences, like the money pump. Dynamic inconsistency over time.

  The market example points to arbitrage, where price discrepancies allow risk-free profits. This connects to the static case but in a market context.

  The user's deeper questions: Are these the same phenomenon? They mention the over-time aspect, where even consistent estimates changing could cause issues. That might be time inconsistency or projection bias.

  I need to distinguish between static (simultaneous commitments) and dynamic (over time). Static involves logical inconsistency in beliefs, like violating probability axioms. Dynamic involves preferences changing or inconsistent planning, leading to exploitation.

  Arbitrage is a market instance of static inconsistency. Prices don't add up, allowing locked-in profits. The money pump is the preference version over time.

  Is the guaranteed loss essential? Yes, in Dutch Books and arbitrage. But in dynamic cases, exploitation relies on the victim's changing preferences. The loss isn't always certain but probable if the exploiter sets up the sequence.

  Rationality: Dutch Book theorems show that avoiding sure loss requires probabilistic coherence. Similarly, avoiding money pumps requires consistent preferences. Rejecting all bets at once is a dodge if the estimates imply willingness to bet at those odds.

  Edges: Static cases need certain loss; dynamic might involve probable loss if the victim might refuse later steps. But the possibility alone indicates a flaw.

  Naming: Dutch Book, money pump, arbitrage. Time inconsistency in beliefs might involve self-undermining forecasts. Need to clarify how belief revision over time can lead to exploitation even if each step is consistent.
answer: |-
  Your observations touch upon profound concepts in decision theory, probability, and economics. The pattern you describe has multiple facets, each with established names and subtle distinctions. Here's a carving:

  ### Core Concepts & Names
  1. **Static Inconsistency (Dutch Book Vulnerability)**  
     - **What it is**: Incoherent probabilistic beliefs at a single point in time, where a set of probability estimates violates the axioms of probability (e.g., \(P(A \cap B) \leq P(A)\)).  
     - **Your example**: The forecasting colleague's estimates (P(A)=0.3, P(B)=0.6, P(A∩B)=0.4) imply a "sure loss" if all bets are accepted.  
     - **Mechanism**: If you offer bets at implied odds (e.g., bet $30 on A to win $100 if A occurs), the bets collectively guarantee you profit.  
     - **Name**: This is a **Dutch Book**. A "book" is a set of bets, and "Dutch" refers to the guaranteed profit (loss for the victim).  
     - **Key Insight**: Coherent probabilities must satisfy Kolmogorov's axioms. Violations make Dutch Books possible.  

  2. **Dynamic Inconsistency (Money Pump)**  
     - **What it is**: Inconsistent preferences over time, where a sequence of locally rational choices leads to a globally worse outcome.  
     - **Your example**: The colleague accepting trades step-by-step but ending up worse off.  
     - **Mechanism**: An exploiter offers trades that exploit cyclical or shifting preferences (e.g., trade X for Y, then Y for Z, then Z for X at a "fee").  
     - **Name**: This is a **Money Pump**.  
     - **Key Insight**: Rational preferences should be transitive and stable. Violations allow pumping money from the victim.  

  3. **Market Inconsistency (Arbitrage)**  
     - **What it is**: Price discrepancies in a market allowing risk-free profit.  
     - **Your example**: Bookmakers' odds or market prices being "off," letting you "trade around" for guaranteed gain.  
     - **Mechanism**: Buying low and selling high simultaneously (e.g., betting on all outcomes of an event at odds summing to <100%).  
     - **Name**: **Arbitrage** (a special case of Dutch Books in markets).  
     - **Key Insight**: Efficient markets eliminate arbitrage; its presence indicates mispricing.  

  ### Answers to Your Questions
  1. **Essential Feature**:  
     - The core is **inconsistency in commitments** (probabilities/preferences/prices).  
     - Guaranteed loss and exploitability are **consequences** of inconsistency:  
       - Static: Incoherent beliefs → Dutch Book → Guaranteed loss.  
       - Dynamic: Intransitive preferences → Money Pump → Exploitable sequence.  
       - Market: Incoherent prices → Arbitrage → Risk-free profit.  
     - **Can they come apart?**  
       - Guaranteed loss requires exploitability (by definition).  
       - Inconsistency doesn't *always* imply actual loss (e.g., if no one exploits it), but the *vulnerability* is inherent.  

  2. **All-at-Once vs. Over-Time**:  
     - **Static (Dutch Book/Arbitrage)**: Inconsistency exists **simultaneously**. Exploitation requires all commitments at once.  
     - **Dynamic (Money Pump)**: Inconsistency emerges **sequentially**. Exploitation relies on the victim's preferences shifting during the process.  
     - **What Separates Them**:  
       - Static cases are about **logical coherence** (math).  
       - Dynamic cases are about **temporal coherence** (psychology/planning).  

  3. **Market Case (Arbitrage) Relationship**:  
     - Arbitrage is a **subset of Dutch Books** applied to market prices.  
     - **Special features**:  
       - Involves tradable assets (not just beliefs).  
       - Often requires no capital (self-financing trades).  
     - **Distinction**: Arbitrage focuses on price consistency; Dutch Books generalize to personal probabilities.  

  4. **Does This Prove Irrationality?**  
     - **Yes, in a formal sense**:  
       - Dutch Book theorems prove: *If* your probabilities violate axioms, you *can* be exploited. Avoiding sure loss requires coherence.  
       - Money pump arguments prove: *If* preferences are intransitive, you *can* be pumped.  
     - **The "dodge" (rejecting all bets)**:  
       - **Substantive flaw**: If your stated probabilities imply you'd accept individual bets at those odds, refusing to accept them collectively admits your estimates aren't "real" commitments. Rational agents should stand behind their beliefs.  
       - **Exception**: If beliefs change *during* the betting process, it becomes a dynamic issue (see below).  

  5. **Edges of the Phenomenon**:  
     - **Loss Certainty**:  
       - Static cases require **guaranteed loss** (otherwise it’s not a Dutch Book/arbitrage).  
       - Dynamic cases may involve **probable loss** (e.g., if the victim might refuse later trades).  
     - **Must Bets Be Accepted?**:  
       - No. The **possibility** of exploitation defines the flaw. If vulnerability exists, the agent is inconsistent *even if never exploited*.  
     - **Belief Revision Over Time**:  
       - Your suspicion is correct: An agent with **dynamically inconsistent beliefs** (e.g., Bayesian updating in a biased way) can be exploited *even if coherent at each instant*.  
       - **Example**: If your colleague revises P(A) from 0.3 to 0.5 after B occurs, but you lock in earlier bets, you might profit from her revision path. This is called **time inconsistency in beliefs** (distinct from preferences).  

  ### Unified Framework
  - **Static Incoherence** → Dutch Book (beliefs) / Arbitrage (prices).  
  - **Dynamic Incoherence** → Money Pump (preferences) / Time-Inconsistent Beliefs.  

  ### Why This Matters in Software & Beyond
  - **Forecasting**: Incoherent probabilities break decision-making systems (e.g., AI that accepts multiple bad bets).  
  - **Markets**: Arbitrage detection is fundamental to algorithmic trading.  
  - **Product Design**: Interfaces can exploit users’ dynamic inconsistencies (e.g., subscription traps).  

  ### Key References
  - **Dutch Books**: Bruno de Finetti (1937), Leonard Savage (1954).  
  - **Money Pumps**: Kenneth Arrow (1951), David Ramsey (1928).  
  - **Arbitrage**: Stephen Ross (1976), "Fundamental Theorem of Asset Pricing."  

  In essence, you’ve rediscovered the spine of normative decision theory: **consistency protects against exploitation**. The static and dynamic cases are cousins—both reveal vulnerabilities, but one is synchronic (logic), the other diachronic (time).
