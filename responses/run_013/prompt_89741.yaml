answer: |-
  Here is the instrument, structured as requested. It builds from foundational questions to specific positions, integrates your cases at relevant nodes, and includes all specified components. British English spellings and conventions are used throughout.

  ---

  ### **Taxonomy of Positions on Archival Silence: A Decision Tree**

  *(Answer each question based on your archival practice or conviction. Proceed to the next node matching your answer.)*

  **1. What primarily *constitutes* archival silence?**  
  - **(A) Absence of expected evidence** → **Q2**  
    *(e.g., crew lists (d) omit languages; photo album (b) omits non-family names)*  
  - **(B) Power relations embedded in creation/keeping** → **Q3**  
    *(e.g., workhouse minutes (a) filter the pauper’s voice; removal order for your great-grandmother (f) defines her by liability)*  
  - **(C) Practical failures in accessibility** → **Q4**  
    *(e.g., undescribed backlog (e) hides items; bundle filed by official (c) survives by chance)*  

  **2. (From A) Is the silence remediable by *adding* evidence?**  
  - **(Yes)** → **Position: Documentary Completionism**  
  - **(No)** → **Q5**  

  **3. (From B) Where does archival power chiefly reside?**  
  - **(A) In institutional frameworks** → **Q6**  
    *(e.g., removal orders (f) or workhouse hearings (a) are products of systems)*  
  - **(B) In descriptive practices** → **Position: Critical Description**  
    *(e.g., undescribed backlog (e) or photo captions (b) perpetuate exclusion by omission)*  
  - **(C) In the act of defining "evidence" itself** → **Position: Archival Deconstruction**  

  **4. (From C) Does improving access suffice?**  
  - **(Yes)** → **Position: Technical Optimism**  
  - **(No)** → **Q7**  

  **5. (From 2-No) What is the primary wrong of irremediable silence?**  
  - **(A) Epistemic distortion** → **Position: Hermeneutic Resignation**  
  - **(B) Ethical failure toward subjects** → **Position: Ethical Imperative**  
    *(e.g., your great-grandmother (f) is reduced to administrative traces)*  

  **6. (From 3A) Should archivists prioritise exposing systems or recovering subjects?**  
  - **(A) Expose systems** → **Position: Structural Critique**  
  - **(B) Recover subjects** → **Position: Recuperative History**  
    *(e.g., seeking paupers’ voices beyond hearings (a) or names beyond captions (b))*  

  **7. (From 4-No) What limits "access" as a solution?**  
  - **(A) Scale/resource constraints** → **Position: Pragmatic Acceptance**  
  - **(B) Silences reflect societal hierarchies** → **Position: Silence as Violence**  
    *(e.g., undescribed backlog (e) mirrors marginalisation; crew lists (d) normalise erasure)*  

  ---

  ### **Leaf Positions**  
  *(Name, Core Tenet, Awkward Commitment)*  

  1. **Documentary Completionism**  
     *Holds that silences are gaps best filled by recovering or creating new evidence (e.g., oral histories, community sourcing).*  
     *Awkward commitment: Assumes all lives *can* be documented meaningfully within archival frameworks.*  
  2. **Critical Description**  
     *Holds that descriptive practices (cataloguing, metadata) perpetuate silence and must be challenged contextually.*  
     *Awkward commitment: Demands endless reinterpretation, risking institutional unfeasibility.*  
  3. **Archival Deconstruction**  
     *Holds that "the record" itself is a power-laden construct; silence exposes archives’ complicity in oppression.*  
     *Awkward commitment: Undermines evidentiary value of *all* archives, including recuperative projects.*  
  4. **Technical Optimism**  
     *Holds that silences of access (e.g., backlogs) are technical problems solvable through resources/innovation.*  
     *Awkward commitment: Ignores how description priorities replicate systemic biases (e.g., photo album (b)).*  
  5. **Hermeneutic Resignation**  
     *Holds that some silences are irreparable; archives must foreground partiality, not "fix" it.*  
     *Awkward commitment: Risks fatalism toward recovering marginalised voices (e.g., great-grandmother (f)).*  
  6. **Ethical Imperative**  
     *Holds that archivists owe duties *to the silenced dead* to acknowledge irreducible absence as harm.*  
     *Awkward commitment: Obligations to the dead may conflict with practical stewardship.*  
  7. **Structural Critique**  
     *Holds that archives should illuminate systems of exclusion (e.g., poor laws in removal orders (f)), not individual stories.*  
     *Awkward commitment: Can neglect individual agency or trauma in records (e.g., pauper’s words in (a)).*  
  8. **Recuperative History**  
     *Holds that counter-archives (diaries, oral histories) must actively restore marginalised voices.*  
     *Awkward commitment: May impose contemporary narratives on fragmentary traces.*  
  9. **Pragmatic Acceptance**  
     *Holds that some silences (e.g., backlogs (e)) are inevitable; archivists must triage ethically.*  
     *Awkward commitment: Risks normalising neglect of "unprioritised" communities.*  
  10. **Silence as Violence** (Unitary View)  
      *Holds that the four silences are one phenomenon: active erasure sustaining power, whether via destruction, exclusion, or neglect.*  
      *Awkward commitment: Equates practical constraints (e.g., backlog (e)) with intentional suppression.*  
  11. **Inclusion Critique** (Unnamed)  
      *Holds that demanding inclusion legitimises archives as arbiters of worth, perpetuating the problem.*  
      *Awkward commitment: Offers no constructive alternative for practitioners seeking justice.*  

  ---

  ### **Diagnostics: Unoccupied Combinations**  
  1. **A → No → (B) Ethical failure** → *and* → **C → No → (A) Resource constraints**  
     *Diagnosis: Incoherent. If silence is an ethical wrong *and* resource-dependent, resignation contradicts obligation.*  
  2. **B → (C) Defining evidence** → *and* → **6 → (A) Expose systems**  
     *Diagnosis: Unoccupied. Deconstruction (from 3C) rejects "systems" as reductive; Structural Critique (from 6A) relies on systemic analysis.*  
  3. **A → Yes** → *and* → **7 → (B) Societal hierarchies**  
     *Diagnosis: Unattractive. Technical fixes (from A-Yes) ignore structural critique (from 7B), yielding shallow solutions.*  

  ---

  ### **Indistinguishable Leaves & Resolution**  
  - **Critical Description** (from 3B) and **Structural Critique** (from 6A) both address systemic power but lack a dividing line.  
    *Resolution: Add question—* **"Does challenging silence require *reforming* or *replacing* archival frameworks?"**  
    - Reform → Critical Description  
    - Replace → Structural Critique  

  ---

  ### **Scoring Key: Pathways to Positions**  
  1. **Documentary Completionism**: 1A → 2Yes  
  2. **Critical Description**: 1B → 3B  
  3. **Archival Deconstruction**: 1B → 3C  
  4. **Technical Optimism**: 1C → 4Yes  
  5. **Hermeneutic Resignation**: 1A → 2No → 5A  
  6. **Ethical Imperative**: 1A → 2No → 5B  
  7. **Structural Critique**: 1B → 3A → 6A  
  8. **Recuperative History**: 1B → 3A → 6B  
  9. **Pragmatic Acceptance**: 1C → 4No → 7A  
  10. **Silence as Violence**: 1C → 4No → 7B  
  11. **Inclusion Critique**: *Appears at any node prioritising systemic critique over recuperation (e.g., 3C, 6A, 7B).*  

  ---

  ### **Case Integration (Reader Answers at Nodes)**  
  - **(a) Workhouse minutes**: At Q1B (power in institutional framing) or Q6A/B (recover voice vs. expose system).  
  - **(b) Photo album**: At Q1A (omission) or Q3B (descriptive bias).  
  - **(c) Official’s letters**: At Q1C (survival by chance) or Q4 (access solution).  
  - **(d) Crew lists**: At Q1A (expected evidence missing) or Q3A (systemic exclusion).  
  - **(e) Undescribed backlog**: At Q1C (access failure) or Q7A/B (resource vs. violence).  
  - **(f) Great-grandmother**: At Q1B (power), Q2No (irremediable), or Q5B (ethical wrong).  

  This instrument forces confrontation with your cases while avoiding prescriptive labels. Its tree structure reveals how practice-informed answers lead to philosophically distinct stances, making implicit biases explicit. Use the scoring key to map your team’s approaches.
