prompt: |-
  I'm a fifth-year PhD student in ethics/political philosophy and I'm putting together a prospectus for a small internal grant — six months of work, maybe 40-50 pages of draft material by the end, plus a workshop in month five. My advisor thinks my idea is either obvious or incoherent and can't decide which, so I need you to make it into an actual project. The half-formed idea I keep circling: everyone says that when two people with deeply different value systems disagree, compromise is either impossible (no common currency to trade in) or corrupting (you sell out something you're supposed to hold unconditionally — the integrity objection). I think both objections are aimed at the wrong target. My hunch is we should split compromise into two very different things: trading across issues (I give ground on X to get ground on Y) and conceding within a single issue (I give up part of what I wanted on X alone). The across-issue case needs almost nothing — no shared scale, no commensurability, just the fact that the two parties rank the available bundles differently — so the standard 'incommensurability blocks compromise' argument doesnt touch it at all. The within-issue case is where the real philosophical action is, and I suspect the integrity objection is really an objection to a subspecies of it: concessions that are constitutive of the commitment, in the sense that making them changes what you'd be willing to accept next time in a way you couldn't in good faith endorse. So my candidate line is that a concession counts as a genuine compromise only if the conceder could still, in good faith, tell the people they speak for that they are pursuing the same thing; if not, it isn't a compromise, it's a conversion, and it's unclear the integrity objection even gets to call it that. A friend who does tax law keeps telling me 'that's just logrolling,' which is sort of my point and sort of not, and I haven't worked out which.

  What I need from you is the prospectus itself. State the question so it has a determinate answer — right now mine is a mood, not a question. Say why the existing positions leave it open, and in particular make the case for the across/within split as an argument rather than a stipulation: tell me what would show the split is doing real work and not just relabelling. Then the method, concretely, month by month — I'd rather test the line against hard cases (a vegetarian and a rancher horse-trading on a food standards board; two members of an ethics committee who disagree about animal research and split a protocol; a coalition partner who trades away a symbolic concession) than spin more taxonomy, but you tell me the right order to do it in, and where the case work has to come before the theory. Say what the possible conclusions are, which consideration would decide between them, and what would count as the project failing — I want at least one honest failure mode, not just 'it turns out to be complicated.' And give me a realistic scope check for six months: what to cut if I only get four, and what a workshop-sized deliverable looks like as opposed to the full thing. Don't bother with citations or a literature review, I'll slot those in myself; I just want the plan.
reasoning: |-
  Okay, the user is a fifth-year PhD student in ethics/political philosophy working on a grant prospectus. Their advisor thinks their idea is either obvious or incoherent, so they need help structuring it into a viable project. The core idea challenges common objections to compromise between conflicting value systems by proposing a split between across-issue ("trading") and within-issue ("conceding") compromises. 

  First, I need to unpack their half-formed idea. They argue that existing critiques (incommensurability and integrity objections) misfire because they don't distinguish these two types. The across-issue compromise (like logrolling) avoids both objections by requiring only divergent preferences, not shared values. The within-issue concession is where integrity concerns actually apply, specifically when concessions alter the core commitment ("conversion" vs compromise). 

  The user's stress points are clear: their question feels like a "mood," the across/within split risks seeming arbitrary, and they prefer case-driven work over taxonomy. Their law friend's "that's just logrolling" comment hints they need to clarify why their distinction is philosophically novel beyond political science terminology. 

  For the prospectus framework, I consider structuring it as: 
  1. Sharpening the research question to focus on "What conditions make a compromise legitimate?" 
  2. Justifying the split by showing how existing literature conflates distinct phenomena 
  3. Using hard cases (vegetarian/rancher, ethics committee) to test-drive the theory 
  4. Defining success/failure metrics like whether the split resolves paradoxes better than existing models 
  5. Building a realistic 6-month timeline with workshop deliverables 

  The integrity objection pivot feels strongest—locating corruption specifically in within-issue concessions that degrade commitments reframes the debate. I should emphasize how failure might look (e.g., if all cases collapse into logrolling). For scope management, cutting the historical analysis if needed keeps the core argument intact. 

  The user's urgency suggests they need this to convince their advisor, so the prospectus must preempt "obvious or incoherent" critiques by showing systematic engagement with counterexamples. Their aversion to "more taxonomy" means cases should lead, but theory must scaffold them—maybe Month 2 for framework, then cases. 

  Workshop design should force debate: e.g., "Is this rancher/vegetarian deal a corrupt sellout or pragmatic solution?" That tests their "conversion vs compromise" boundary live. Final output (40-50 pages) could leave taxonomy minimal and focus on application—their strength seems in concrete puzzles, not abstraction. 

  Key move: Present the split not as a new label but as a diagnostic tool. E.g., if the same action (say, conceding on animal testing limits) is integrity-violating in one context but not another, the split explains why. That's the "real work" test.
answer: |-
  Here’s a prospectus structure designed to transform your intuition into a tractable project, preempting "obvious/incoherent" critiques by sharpening the question, grounding the split, and embedding failure tests.

  ---

  ### **Project Prospectus: The Anatomy of Compromise**  
  **Core Question:** *Under what conditions can agents with incommensurable values make concessions without corruption or incoherence?*  

  ### **I. The Gap in Existing Positions**  
  **The Problem:** Existing debates treat "compromise" monolithically. Critics argue it’s either:  
  - **Impossible** (no common currency to weigh concessions, per incommensurability objections) or  
  - **Corrupting** (violates integrity by trading unconditional commitments).  
  *But both critiques assume compromise requires a shared evaluative framework.* This misses a crucial distinction.  

  **The Stakes:** If compromise collapses into either impossibility or corruption, it threatens democratic deliberation, coalition-building, and conflict resolution. Your split offers an escape route.  

  ### **II. The Argument: Why the Across/Within Split Matters**  
  Your core claim: **The two objections target fundamentally distinct practices:**  
  - **Across-issue compromise ("trading"):**  
    - *Mechanism:* Agents exchange concessions on separate issues (e.g., "I yield on farm subsidies if you yield on clean energy grants").  
    - *Why objections fail:* Requires only *divergent preference rankings*, not commensurability. The integrity objection doesn’t apply because concessions aren’t internal to a value; they’re strategic trades.  
    - *Novelty:* Not "just logrolling" — you reframe it as a *structurally distinct category* immune to philosophical critiques aimed at value dilution.  

  - **Within-issue compromise ("conceding"):**  
    - *Mechanism:* Agents partially relinquish demands *on the same issue* (e.g., "I accept 50% funding for animal research instead of 100%").  
    - *Where objections bite:* Integrity concerns apply *only here* — but selectively. Corruption arises **iff** the concession alters the agent’s core commitment ("conversion"), making future endorsements incoherent.  
    - *Key criterion:* **Good faith continuity** — "Can I justify this concession to my constituents *without redefining our goal?*" If not, it’s conversion, not compromise.  

  **Why this isn’t stipulation:** The split does real work if:  
  1. It **dissolves paradoxes** (e.g., showing why "impossible" trades are actually feasible across issues).  
  2. It **explains intuitive judgments** (e.g., why we condemn some concessions as sellouts but praise identical-looking trades as pragmatic).  
  3. It **identifies new failure modes** (e.g., within-issue concessions that *look* benign but covertly convert commitments).  

  ### **III. Method: Cases Before Theory (6-Month Plan)**  
  **Guiding Principle:** Test the split against hard cases *first*; refine theory inductively.  

  | Month | Task                                                                 | Deliverable                     |
  |-------|----------------------------------------------------------------------|----------------------------------|
  | 1     | **Case Library:** Develop 3-4 paradigmatic cases (e.g., vegetarian-rancher negotiation; ethics committee deadlock; coalition symbolic-trade). Draft "naive" analyses of each using existing compromise literature. | Case summaries + conflict maps  |
  | 2     | **Diagnostic Tool:** Apply the across/within split to each case. Identify where standard critiques misfire or bite unexpectedly. | Analysis framework + anomalies  |
  | 3     | **Theory Draft:** Formalize criteria for across-issue trades (minimal requirements) vs. within-issue concessions (integrity threshold: "good faith continuity"). | 15-20pg draft; core definitions |
  | 4     | **Stress Tests:** Hunt for cases that break the split (e.g., "bundled" issues; concessions that feel like trades). Refine definitions. | Revised framework + countercases |
  | 5     | **Workshop:** Present cases + framework to ethicists/political theorists. Debate: "Is this concession corrupt? Is this trade coherent?" | Workshop report; peer feedback  |
  | 6     | **Synthesis:** Revise theory, specify domains of application, address "logrolling" critique. | Full draft (40-50pg)            |

  **Case Selection Rationale:**  
  - **Vegetarian/Rancher:** Tests across-issue trades (e.g., "I support your subsidy if you back my labeling law"). Do "integrity" critiques feel misplaced here?  
  - **Ethics Committee Split:** Tests within-issue concession (e.g., approving 50% of proposed animal trials). Does *which* trials are cut determine if it’s corrupt?  
  - **Symbolic Coalition Concession:** Tests "good faith continuity" (e.g., trading a minor policy for visibility — does this redefine the movement’s core aims?).  

  ### **IV. Possible Conclusions & Failure Modes**  
  **Success Looks Like:**  
  - The split resolves tensions in existing literature by showing *why* critiques apply unevenly.  
  - "Good faith continuity" provides a actionable standard for legitimate within-issue concessions.  
  - Across-issue compromises are vindicated as robust *despite* incommensurability.  

  **Failure Modes (Realistic):**  
  - **The split collapses:** Cases reveal no stable distinction between "across" and "within" issues (e.g., all concessions implicitly bundle values). *Diagnostic:* If Month 4 stress tests show ubiquitous entanglement.  
  - **"Good faith continuity" is inert:** It fails to distinguish corrupt vs. non-corrupt concessions better than existing criteria (e.g., Williams’ integrity objections). *Diagnostic:* Workshop consensus that your criterion is circular or unworkable.  
  - **Logrolling absorbs everything:** The across-issue category explains *all* successful compromises, making the within-issue category philosophically redundant. *Diagnostic:* If all cases resolve cleanly via trading logic.  

  ### **V. Scope Management**  
  **6-Month Core:** Full case analysis + theory draft + workshop.  
  **4-Month Cutdown:**  
  - Drop 1-2 cases (retain most illustrative pair).  
  - Skip workshop (replace with peer interviews).  
  - Deliver 25-30pg draft: diagnostic framework + 1-2 cases + implications.  
  **Workshop Deliverable (Month 5):**  
  - 10pg précis: The split + 2 cases + "Where does integrity matter?" debate prompt.  
  - 90-min session: Small group critique of cases using your framework.  

  ### **Why This Isn’t Obvious or Incoherent**  
  - **Not obvious:** The across/within split is underexplored; literature conflates them. Your "good faith continuity" criterion for integrity is novel.  
  - **Not incoherent:** Cases ground the distinction empirically. If the split holds, it forces a recalibration of compromise theory.  

  ---  
  **Next Steps:** Slot in citations (e.g., Stocker on plural values, Margalit on rotten compromises, May on moral compromise) and polish cases. Your project’s strength is *diagnosing* compromise failures — lean into the cases, and let the taxonomy emerge from them.
