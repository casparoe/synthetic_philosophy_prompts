prompt: |-
  Van Fraassen's reflection principle is usually introduced to me through an analogy, and I want to know how much of the principle the analogy can actually carry. The picture runs like this. My future self is like an expert. An expert knows more than I do about some question, so I defer to them: whatever credence they end up having, that is the credence I take on. The reflection principle, on this telling, says the same about my own future — my present credence in a proposition ought to equal my expectation of my future credence in it — because my future self stands to my present self as the expert stands to the layperson. The moral usually drawn is that reflection is nothing more than the ordinary demand that I not treat my better-informed future self worse than I would treat a well-informed stranger, and that refusing to defer to my own future credences is simply incoherent. (I have also seen the principle glossed as the requirement that my credence behave like a fair bet under my own expected updating; if that framing is doing the same work, hold it to the same audit.)

  I suspect the analogy is being asked to do more than it can, but I do not yet see which parts of it are load-bearing. Give me an audit, not a survey.

  Set out the correspondence first: what plays the role of the expert, of the expertise, of the deference, and of the single question both parties are answering; and state, in your own terms, what the principle asks and what it is conditioned on.

  Then locate where the mapping breaks. I am most interested in these points: whether deference to an expert is earned by a track record that my future self need not possess; what becomes of the analogy when I know my future self will be drunk, distracted, bribed, or otherwise corrupted, or will simply have forgotten evidence I now hold; whether the expert picture quietly assumes that the future credence is reliably responsive to evidence, when reflection appears to demand deference whether or not it is; whether the analogy has anything to say when the question is not what the world is like but who or where I am; and the reflexive worry that our grounds for deferring to experts are themselves something like reflection, so that the analogy cannot ground the principle without circularity.

  Then sort these failures. Which of them genuinely threaten the principle, and which are mere friction that a better framing would dissolve?

  Then reach a verdict and defend it. Is reflection a genuine requirement of ideal rationality, a defeasible heuristic that other considerations can override, or a norm worth abandoning? Do not end on a non-committal note; commit to a position, and say what would have to be true of a future self for the principle to bind with respect to it.

  Finally, if the expert is the wrong picture, offer a better one, and say precisely what it captures that the expert analogy misses.
reasoning: |-
  Hmm, the user wants me to do a deep audit of van Fraassen's reflection principle using the expert analogy. They've laid out a very structured request - first establish the correspondence between the analogy and the principle, then locate where it breaks, then evaluate the failures, and finally commit to a position on whether reflection is a rational requirement.

  Let me map out the analogy components clearly. The expert represents my future self, expertise represents the additional evidence my future self will have, deference is adopting whatever credence my future self has, and the question is about the truth of some proposition about the world. The principle asks that my current credence equals my expectation of my future credence.

  Now for the breakdown points the user wants examined. First, track records: experts earn deference through demonstrated reliability, but my future self doesn't need this - I'm supposed to defer simply because they'll have more evidence. That's a gap. Then there's the corruption issue - if I know my future self will be drunk or forgetful, the analogy fails because we wouldn't defer to a corrupted expert. The responsiveness question matters too - the principle demands deference regardless of whether my future self actually responds rationally to evidence, unlike with experts where we assume they do.

  The identity cases are particularly problematic. If the question is about who I am or where I am (like in amnesia or duplication scenarios), the analogy offers no guidance because experts don't typically handle indexical uncertainties. And yes, there's circularity - my reason for deferring to experts might itself rely on something like reflection.

  Evaluating these: the track record issue is just friction - a better framing could handle it by emphasizing inevitable evidence growth. But corruption and irrationality are real threats to the principle as stated, showing it's not universally binding. Identity cases completely break the analogy since it's built for factual propositions. The circularity might be deep but could be addressed by distinguishing types of deference.

  I think reflection is best seen as a defeasible heuristic. The binding condition should be that my future self is epistemically intact - no corruption, rational processing, and importantly, maintaining my identity and evidential continuity. The analogy fails because it ignores the self aspect. A better picture might be seeing credences as evolving under anticipated learning, where reflection is about coherence across time rather than deference to an external expert.

  For the verdict: reflection isn't an absolute requirement but a useful norm that can be overridden when future irrationality or identity disruption is expected. The expert analogy is insufficient because it misses the essential self-to-self relationship and assumes rational responsiveness that reflection doesn't require. A dynamical systems view captures the temporal continuity better.
answer: |-
  Below is a strict audit of van Fraassen's reflection principle (RP) through the lens of the expert analogy. I commit to a verdict: **RP is a defeasible heuristic for ideal rationality, not an absolute requirement, and the expert analogy fails to capture its core mechanics.** The principle binds only when your future self is *epistemically continuous* and *rationally responsive* to your current evidence plus anticipated learning.

  ---

  ### **1. Correspondence: The Expert Analogy Mapped**
  - **Expert**: Your future self at time \(t_f\)  
  - **Layperson**: Your current self at time \(t_0\)  
  - **Expertise**: The additional evidence \(E_{new}\) acquired between \(t_0\) and \(t_f\)  
  - **Deference**: Setting your \(t_0\) credence \(C_0(A)\) equal to your expectation of your \(t_f\) credence \(\mathbb{E}[C_f(A)]\)  
  - **The Question**: A proposition \(A\) about the state of the world (e.g., "It will rain tomorrow").  

  **The Principle**:  
  \(C_0(A \mid C_f(A) = x) = x\) for all \(x\), or equivalently, \(C_0(A) = \mathbb{E}[C_f(A)]\).  
  **Conditioned on**: Your current knowledge about how your future self will form \(C_f(A)\), including:  
  - Anticipated evidence acquisition.  
  - Assumptions of rationality (e.g., updating via conditionalization).  
  - No relevant cognitive degradation.  

  ---

  ### **2. Where the Analogy Breaks**  
  #### **A. Track Record & Earned Deference**  
  - **Analogy**: Experts earn deference via proven reliability (e.g., a weather forecaster’s accuracy).  
  - **Future Self**: You have no "track record" against which to judge your future self. Deference is assumed *a priori* due to their evidence advantage.  
  - **Break**: The analogy smuggles in external validation, while RP demands automatic deference based solely on temporal position.  

  #### **B. Corruption, Forgetfulness, or Irrationality**  
  - **Analogy**: If an expert is drunk or bribed, you reject their judgment.  
  - **Future Self**: RP *formally* demands deference even if you know \(t_f\) you will be irrational, forget evidence, or be corrupted.  
  - **Break**: The analogy assumes expertise implies *reliable responsiveness to evidence*, but RP does not require this. Deference is blind to *how* \(C_f(A)\) is formed.  

  #### **C. Responsiveness to Evidence**  
  - **Analogy**: Expertise implies the expert’s credence tracks truth *because* they respond rationally to evidence.  
  - **Future Self**: RP demands \(C_0(A) = \mathbb{E}[C_f(A)]\) even if you know \(C_f(A)\) is *not* evidence-responsive (e.g., you plan to ignore \(E_{new}\)).  
  - **Break**: The analogy ties deference to reliability; RP severs this link.  

  #### **D. Indexical or Self-Locating Propositions**  
  - **Analogy**: Experts answer questions about the world (e.g., "Will it rain?"), not about the asker’s identity ("Who am I?").  
  - **Future Self**: RP fails for propositions like "I remember evidence \(E\) at \(t_f\)" or "I am not drugged at \(t_f\)."  
  - **Break**: The analogy assumes a fixed, shared identity and world-centered propositions. RP crumbles under self-referential uncertainty.  

  #### **E. Circularity in Grounding Deference**  
  - **Analogy**: Deference to experts is justified by empirical success (e.g., science).  
  - **Future Self**: Your reason to defer to \(t_f\) is that they *will have more evidence*—but this assumes your current expectations about \(t_f\) are trustworthy, which is itself an RP-like claim.  
  - **Break**: The analogy "grounds" RP in external practices, but those practices rely on circular temporal deference. RP is bootstrapped, not justified by analogy.  

  ---

  ### **3. Sorting the Failures**  
  | **Failure**                     | **Threat Level** | **Verdict**                                                                 |  
  |---------------------------------|------------------|-----------------------------------------------------------------------------|  
  | Track record discrepancy        | Low              | **Friction**: Resolved by framing RP as *internal* coherence, not earned trust. |  
  | Corruption/irrationality        | **High**         | **Genuine threat**: RP fails if \(t_f\) is epistemically compromised.         |  
  | Non-responsiveness to evidence  | **High**         | **Genuine threat**: RP demands deference even when irrational.                |  
  | Indexical propositions          | **High**         | **Genuine threat**: RP inapplicable to self-locating beliefs.                 |  
  | Circularity                     | Medium           | **Friction**: RP can be reframed as a consistency constraint (see verdict).   |  

  **Key Insight**: The expert analogy’s core flaw is its **externalism**. RP is about *intra-agent coherence across time*, not inter-agent deference. The analogy ignores that your future self *is you*—it’s not a separate "expert" but a continuation of your epistemic trajectory.  

  ---

  ### **4. Verdict: Reflection as a Defeasible Heuristic**  
  **RP is not a categorical requirement of ideal rationality.** It is a **defeasible heuristic** that holds only under specific conditions:  
  - **Binding Condition**: RP binds your \(t_0\) credence iff your future self at \(t_f\) is:  
    1. **Epistemically Continuous**: Your identity, memory, and cognitive capacity are intact (no amnesia, brainwashing, or corruption).  
    2. **Rationally Responsive**: You expect \(t_f\) you to update via conditionalization on \(E_{new}\).  
    3. **Non-Indexical**: \(A\) is a world-centered proposition (not self-locating).  

  **Why abandon categorical RP?**  
  - If you know \(t_f\) you will be irrational (e.g., tired, coerced), violating RP is rational.  
  - If \(A\) is "I will believe \(A\) at \(t_f\)", RP leads to paradox (e.g., Moorean statements).  
  - *Empirical counterexamples*: You now possess evidence \(E\) that \(t_f\) you will forget. Setting \(C_0(A) = \mathbb{E}[C_f(A)]\) ignores your current informational advantage.  

  **What survives?** A weaker norm:  
  > *"Unless you have specific evidence of future irrationality or discontinuity, your credences should align with your expected future credences."*  

  This avoids incoherence while preserving RP’s role in guarding against self-undermining beliefs.  

  ---

  ### **5. A Better Picture: The Epistemic Fiduciary**  
  The expert analogy fails because it treats your future self as a *distinct agent*. A superior model:  

  **Your future self as your own epistemic fiduciary**:  
  - You *entrust* your future self with your current epistemic interests, as a lawyer carries a client’s interests forward.  
  - **Deference is not to an expert** but to *your extended temporal agency*.  
  - **What it captures**:  
    - **Continuity of identity**: It’s not "deference to another" but *accountability to your own extended rationality*.  
    - **Vulnerability to corruption**: A corrupted fiduciary breaches trust—deference is voided.  
    - **Non-indexical grounding**: Your fiduciary’s duty is to the world (e.g., "seek truth"), resolving self-locating issues.  

  **Why this works**:  
  - It explains why you defer *without* a track record: It’s a commitment to coherent time-sliced agency.  
  - It allows defeasibility: Corruption voids the fiduciary duty.  
  - It avoids circularity: The norm is "maintain diachronic integrity," not "treat future you as infallible."  

  **RP Reframed**:  
  > *"Your credence at \(t_0\) should equal your expectation of your credence at \(t_f\), conditional on your future self upholding your current epistemic values and rationality."*  

  This preserves RP’s intuition while excising its pathological cases. The expert analogy is not just imperfect—it misconstrues the principle’s essence as *external* deference rather than *internal* integrity.  

  ---
  **Final Defense**:  
  The reflection principle is a tool for unified agency across time, not a law of rationality. It binds only when your future self is a competent steward of your epistemic goals. The expert analogy collapses under scrutiny because it externalizes what is inherently a first-person, temporal commitment. Abandon the analogy; keep the principle—with caveats.
