prompt: |-
  I've agreed in a weak moment to teach Aumann's agreement theorem to a mixed room next month -- two ninety-minute sessions, whiteboard, no slides -- and what I need from you is a plan for the explanation, not the explanation. The room is roughly half third-year economists who've done some decision theory and half philosophy students who've done some epistemology; almost none of them have met the partition model of information, and the two halves have completely different reflexes about what counts as an explanation. I've known this theorem for twenty years, so don't tell me what it says. Tell me what has to land before the theorem can even be stated in a way they'll hear: what the opening has to do, what has to be in place before I'm allowed to say 'common knowledge' at all (I keep discovering to late that they've heard it as 'everyone knows', and then the infinite-regress point sails straight past them), and what order the pieces have to come in so that the conclusion feels like a consequence of the setup rather than a party trick. Then the misconceptions, in the order they'll actually surface -- 'so rational people always end up agreeing', 'so disagreement is irrational', 'it's an idealization, so it says nothing about my uncle and his politics' -- and whatever else you think they'll bring. For each one I want the specific point in the sequence where I should head it off, not just a list.

  On the carrying example I'd rather have your judgment than a free choice. My candidate is two doctors who trained at the same place -- same prior, allegedly -- looking at different test results and disagreeing about whether to operate. Can that carry the whole thing, or does it cheat somewhere: does it quietly present the common prior as an obvious truth, when that's exactly the assumption I want them to leave suspicious of? If it can't carry it, give me one that can, and it has to be drawable on a whiteboad as two overlapping sets of possibilities, because I want to reuse that same picture at the end to show what breaks once the prior isn't shared -- and tell me which misconception that reuse actually kills, if any. Last two things: one question I can put to them at the end that shows me they've got the theorem rather than a slogan, and one thing I should openly refuse to prove at this level and say so out loud. I'm at a British university now and the handout goes straight to the students, so please write the plan itself in British English.
reasoning: |-
  Okay, the user needs a detailed lesson plan for teaching Aumann's Agreement Theorem to a mixed group of economics and philosophy students. They want the sequence to build understanding step-by-step, avoiding common misconceptions. Let me unpack their requirements.

  First, the audience is split: economists familiar with decision theory but not partition models, and philosophers with epistemology background but different conceptual reflexes. Neither group knows the partition model. The key challenge is making "common knowledge" land properly - students often confuse it with "everyone knows," missing the infinite regress aspect. 

  For the opening, I need something that forces them to confront the difference between knowledge and common knowledge. The hats example seems ideal - it's visual, creates immediate cognitive dissonance, and sets up why common knowledge matters. Drawing the partitions on whiteboard will make it concrete.

  The doctors example is clever but risky - it might naturalize the common prior assumption. Instead, a coin flip scenario with overlapping information sets keeps the prior visibly artificial. We can later contrast what happens when priors diverge, killing the "disagreement always means irrationality" misconception.

  Biggest pitfalls to preempt:
  1. "Agreement always happens" - must stress it's conditional on common priors
  2. "Disagreement implies irrationality" - show counterexample with different priors 
  3. "Real-world irrelevance" - emphasize it's about belief revision structure

  The killer question at the end should force application: "If two people with common prior disagree after seeing private information, what must be true?" Correct answer involves impossible partitions, proving they grasp the mechanism.

  I'll explicitly skip the proof of the reachability lemma - it's technical but the intuition matters more. The whiteboard drawings must consistently use the same partition framework throughout to build visual literacy.

  British English throughout: "maths" not "math", "colour" etc. The handout should feel native to UK students.
answer: |-
  Here's a battle-tested plan structured for clarity and misconception management, using British English for the handout:

  **Session 1: Foundations (90 mins)**
  **Goal:** Build intuition for the partition model and common knowledge *before* stating the theorem.

  1.  **Hook: The Hats Paradox (15 mins)**
      *   **Do:** Draw 3 people, 2 red hats, 1 blue hat. Each can see others' hats but not their own. "If you see *at least one red hat*, raise your hand." All raise hands. "If you know your *own* hat colour, step forward." No one moves. *Why?*
      *   **Land:** Forces distinction between individual knowledge ("I see a red hat") and inferential limitations ("I don't know *if they see red*"). Sets stage for needing a model of *how* knowledge interacts.

  2.  **Partition Model: Worlds & Information Sets (30 mins)**
      *   **Build:** Start with a simple **coin flip** (Heads/Tails). Alice sees outcome, Bob doesn't.
      *   **Draw:** Whiteboard "Worlds": Ω = {ω_H, ω_T}. Alice's partition: { {ω_H}, {ω_T} } (knows precisely). Bob's partition: { {ω_H, ω_T} } (knows nothing). Define "Knowledge": Alice knows P in ω_H iff P is true in *all worlds in her info set* containing ω_H (i.e., just ω_H).
      *   **Exercise:** "What does Alice know in ω_H if coin is Heads? What does Bob know?"
      *   **Extend:** Introduce a third world where coin lands on edge (ω_E). Alice *might* see it or might not. Draw overlapping partitions. "When does Alice know it's not Heads?" (Only if her info set rules out ω_H).
      *   **Land:** "Knowledge" = truth in *all worlds compatible with your information*. Information sets partition Ω. Crucial: Info sets define *possible uncertainty*.

  3.  **Common Knowledge: The Infinite Regress Trap (30 mins)**
      *   **Problem:** "Alice knows P. Bob knows P. Do they know that they *both* know P? (K_AK_B P?)" Use coin example: Alice knows outcome, Bob doesn't. K_AP true, K_BP false? Maybe. But K_A(K_B P)? Alice knows Bob *doesn't* know P! Highlight: K_i P ≠ K_i K_j P.
      *   **Define Common Knowledge of P (CKP):** P is true, everyone knows P, everyone knows everyone knows P, everyone knows everyone knows everyone knows P, ... ad infinitum.
      *   **Model-Based Definition:** CKP holds iff P is true in *every* world in the **coarsest common refinement** of all partitions (i.e., the smallest sets that are unions of each agent's info sets). Draw this on the ω_H, ω_T, ω_E board – show the CK sets.
      *   **Land:** CK is *structural*, defined by the information model, not just iterated knowledge. The "infinite regress" is captured by the partition refinement. Stress: "Everyone knows P" is **not enough** for CKP. The hats paradox hinges on lack of CK about hand-raising rules initially.

  4.  **Preview & Setup for Session 2 (15 mins)**
      *   "Next time: What happens when rational people with the *same prior beliefs* see *different information* and then compare their *posterior* beliefs? Can they disagree? Agree? What if they *know* they are both rational?" Mention "Aumann's Agreement Theorem". Plant seed: "The answer hinges crucially on common knowledge and that shared starting point."

  **Session 2: The Theorem & Implications (90 mins)**
  **Goal:** State, understand, and critically evaluate the theorem.

  1.  **Recap & Motivate (10 mins)**
      *   Quick whiteboard recap: Worlds (Ω), Partitions (Π_A, Π_B), Knowledge (K_i P), Common Knowledge (CK P via refinement).
      *   Motive: "Two rational doctors, trained together (same priors?), see different test results. Can they rationally disagree *after* sharing their posteriors?"

  2.  **The Doctor Example - Carefully (25 mins)**
      *   **Scenario:** Disease D prevalence 10% (Common Prior). Test T: 90% accurate. Patient has symptoms. *Prior Prob(D) = 0.1.*
      *   **Worlds:** Ω = {D+T+, D+T-, D-T+, D-T-} (Disease/TestResult). Define probabilities: P(D+T+) = 0.1 * 0.9 = 0.09, P(D+T-) = 0.1 * 0.1 = 0.01, P(D-T+) = 0.9 * 0.1 = 0.09, P(D-T-) = 0.9 * 0.9 = 0.81.
      *   **Information:** Doctor A sees *Test Result* (Partition: {{D+T+, D-T+}, {D+T-, D-T-}}). Doctor B sees something else *private* (e.g., a different scan - define a plausible partition, e.g., {{D+T+, D+T-}, {D-T+, D-T-}} based on severity?).
      *   **Posteriors:** Calculate A's posterior if T+ (Sees {D+T+, D-T+}): P(D|T+) = P(D&T+)/P(T+) = 0.09 / (0.09 + 0.09) = 0.5. Calculate B's posterior given *their* info (e.g., if they see severe symptoms: P(D|Severe) = ? Depends on defined partition/probs).
      *   **Crucial Point:** *Before* sharing, posteriors differ (e.g., A: 0.5, B: 0.7). **This is fine!** Different information justifies different posteriors.
      *   **Land:** Shared prior + private info → different posteriors are rational. *No conflict yet.*

  3.  **Stating Aumann's Agreement Theorem (10 mins)**
      *   **Write:** "If two agents have the same prior belief over a finite set of possible worlds, and their posteriors for an event A are common knowledge, then these posteriors must be equal." (P_i(A) = q_i, CK(P_i(A) = q_i) ⇒ q_1 = q_2)
      *   **Deconstruct:** Highlight key elements: Common Prior, Common Knowledge of Posteriors, Conclusion: Posteriors Equal.
      *   **Immediate Implication:** If their posteriors are CK *and* different, the only possible explanation is that they did *not* start with the same prior.

  4.  **Why? The Mechanism (20 mins)**
      *   **Back to Doctors:** Suppose after sharing beliefs, it's CK that A believes P(D)=0.5 and B believes P(D)=0.7. *How can this happen with common prior?*
      *   **Contradiction Walkthrough (Whiteboard):**
          1.  CK requires A's posterior (0.5) to be constant on *every* world within the CK partition set containing the actual world. Ditto for B (0.7).
          2.  But A calculates posterior based on *their* info set within any CK set. If the CK set contains worlds where A's info set implies different posteriors, A couldn't have a fixed posterior of 0.5 *everywhere* in that CK set!
          3.  **Key Insight:** Within any CK set, A's information partition *refines* that CK set. Therefore, A's posterior *must* be constant on the CK set *if it's CK*. (Same for B).
          4.  If both posteriors are constant on the same CK set, and they use Bayes' rule with the *same prior*, they *must* calculate the same posterior for event A within that CK set. (q_1 = P(A | Π_i ∩ CK_set) = P(A ∩ CK_set) / P(CK_set) = P(A | CK_set) = q_2).
      *   **Land:** Common Prior + CK of Posteriors forces posteriors to be equal because they are both equal to the conditional probability given the CK information. **Reuse Doctor Whiteboard:** Circle a CK set. Show how A and B, within it, must both condition on *that entire CK set* if their posteriors are CK, leading to the same number P(A|CK_set).

  5.  **Tackling Misconceptions (Order of Appearance & Preemption)**
      *   **During Doctor Setup (Step 2):** "So rational people always end up agreeing?"
          *   **Preempt:** "NO! Look, they rationally disagree *before* sharing! The theorem is about what happens *after* their posteriors become common knowledge." Stress the CK condition is *strong*.
      *   **After Stating Theorem (Step 3):** "So disagreement is irrational?"
          *   **Preempt:** "NO! Disagreement is absolutely rational *without* CK of posteriors or *without* a common prior. This theorem isolates a very specific scenario where disagreement *cannot* persist rationally *if* those two conditions hold. Disagreement is the norm; this agreement is the surprising result under strong assumptions."
      *   **After Mechanism/Reusing Board (Step 4):** "It's an idealisation, so it says nothing about my uncle and his politics!"
          *   **Preempt:** "Partly true, but missing the point. The value isn't in saying your uncle is irrational. It's a **diagnostic tool**: If two people *seem* rational, share a background (suggesting common prior?), discuss deeply (suggesting CK?), yet STILL disagree... the theorem forces us to conclude their priors *must* have differed significantly in relevant ways ('common prior' failed). It shifts the explanation for persistent disagreement." (Link back to whiteboard reuse: Different priors mean different P(A ∩ CK_set)/P(CK_set) calculations, so different q_i even with CK posteriors).
      *   **Likely Follow-up:** "But how can posteriors *become* common knowledge by just talking?"
          *   **Address:** Acknowledge this is hard! The theorem assumes CK is achieved. In practice, complex statements might *never* become truly CK. The theorem sets a limit: disagreement can persist rationally *until* CK of posteriors is achieved *if* priors differ. Deep, repeated discussion aims *towards* CK.

  6.  **The Killer Question (5 mins)**
      *   Put to them: **"If two rational people with a genuinely common prior announce their different posterior probabilities for an event to each other, and yet they *still* disagree afterwards, what must be true about what they have learned about each other's information?"**
      *   **Target Answer:** They have **not** achieved common knowledge of each other's posteriors. There is still residual uncertainty about what the other person knows or how they interpreted the information. (They haven't reached the CK partition refinement).

  7.  **The Explicit Omission (5 mins)**
      *   **State Clearly:** "We are explicitly **not proving the key technical lemma** today: that if posteriors are common knowledge, then they must be constant on the connected components of the union of the agents' partitions (the 'reachable' sets), and that these sets are where common knowledge holds. The proof involves graph theory/reachability and is a bit involved for this session. Focus on the intuition: CK forces them to condition on the same lump of information derived from pooling their knowledge."

  **Why the Doctor Example Works (With Caveat):**
  *   **Strengths:** Intuitive (diagnosis), relatable, clearly shows rational initial disagreement, shared prior is plausible *prima facie*, allows concrete calculation, whiteboard-friendly partitions. Reusing the board to show how different priors break the equality is powerful.
  *   **Caveat (Handled in Plan):** The "common prior" (10% prevalence, 90% test accuracy) *is* presented as given. The plan *explicitly uses the theorem's conclusion later* to argue that *observed persistent disagreement after discussion* implies this prior assumption likely failed ("they didn't *really* share the same prior beliefs about the relevance or interpretation of the symptoms/tests"). This turns the assumption from an "obvious truth" into the *critical, testable assumption* the theorem highlights. The reuse of the board visually shows the calculation breaking if priors differ.
  *   **Alternative (If Preferred):** **Jury Duty**. Two jurors, common prior on guilt (P(Guilty) = 0.5). Each sees a different, independent piece of evidence (E1, E2) with known reliability. Calculate posteriors privately (likely different). Theorem applies *if* after full discussion, their guilt probabilities are CK, they must agree. Whiteboard worlds: (G, E1, E2), (G, E1, ~E2), etc. Same structure, less visceral than doctors. The doctor example is judged sufficiently robust *if* the caveat is explicitly addressed via the theorem's diagnostic implication.

  **Handout Note:** Structure the handout exactly like this plan, using these headings and British English ("maths", "colour", "prior beliefs", "common knowledge", "posterior probabilities", "whiteboard", "partition", "misconceptions"). Include the Killer Question and the Omission clearly. Good luck!
