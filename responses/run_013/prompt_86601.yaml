prompt: |-
  I clerk for a justice on our state's highest court, and I am trying to anticipate how she will vote in a capital case we will hear next term. What I want from you is not an abstract prediction but a reconstruction of the rule she is actually running, together with an honest account of how far her record underdetermines it.

  Her capital votes over the past decade, as I would summarize them for a colleague:

  In State v. Halloran she voted to affirm the death sentence. Halloran had abducted two teenagers, held them for a day, and killed them himself. He acted alone, intended the killings, and offered no substantial mitigation. The evidence was overwhelming: his own detailed confession, corroborated by DNA and by physical evidence at the scene.

  In State v. Vance she again voted to affirm. Vance had tortured and killed a man who owed him money. He was the sole killer, acted with intent, and had no substantial mitigation. The evidence was essentially unassailable: two eyewitnesses with no connection to each other and Vance's fingerprints on the weapon.

  In State v. Pruitt she voted to vacate the death sentence and remand for life without parole. Pruitt had waited in the car while his cousin robbed a gas station and shot the attendant. There was no evidence that Pruitt knew his cousin was armed or expected a killing, and the State's own theory was that the shooting took him by surprise. What tied Pruitt to the plan was the testimony of a jailhouse informant who received a reduced sentence in exchange — evidence I would call fragile.

  In State v. Okafor she voted to vacate for a related reason. Okafor had served as a lookout; his role in the killing was peripheral, and the State conceded that he neither killed nor intended a killing. His conviction rested largely on a statement he gave after eleven hours of interrogation without counsel, a statement the trial court suppressed and the appellate court later held should never have reached the jury.

  So her four capital votes divide cleanly in two: she affirmed in Halloran and Vance and vacated in Pruitt and Okafor. What I cannot tell from this record is which feature is doing the work, because two features — and arguably a third — have coincided in every case. In Halloran and Vance the defendants stood at the apex of culpability: they personally killed, they intended death, and there was no substantial mitigation, while the evidence of guilt was rock-solid. In Pruitt and Okafor the defendants fell well below that apex, and the evidence was fragile. Desert and reliability have never come apart in her record. Neither has the general-deterrence value of the crime, which was high in the two stranger-on-stranger predatory killings and low in the two cases of marginal participation.

  The case we hear next term is State v. Sorenson, and it is the case that pulls these features apart. Sorenson was convicted of abducting, torturing, and murdering a young woman — on its face about as grave a killing as Halloran or Vance, and, if he did it, one that would place him at the apex of culpability. But the evidence against him is of the kind her earlier opinions treat with suspicion: the State's case rested principally on a single eyewitness identification made after a suggestive lineup and on a jailhouse informant's account; the only physical evidence, a hair, was later shown to be consistent with a large share of the population; and since trial the eyewitness has partially recanted. The defense has moved for a new sentencing hearing on residual-doubt grounds.

  Please do the following. First, set out the distinct rules that fit her four earlier votes equally well. I suspect there is more than one — that her votes are consistent with a rule keyed to desert alone, with one keyed to reliability alone, with various ways of combining them, and perhaps with one keyed to deterrence — and I want the whole family rather than a single best fit. Second, say what each rule predicts about Sorenson and group the rules by the verdict they imply. Third, give me your best guess at how she will actually vote, and tell me what in her record, if anything, justifies preferring one rule over the others; if the record genuinely does not decide it, say so plainly rather than manufacturing a reason. Fourth, name the further case — the factual configuration not yet before her — that would separate the rules that agree about Sorenson, and explain what each would do with it. Finally, tell me what would move you personally: which additional detail about Sorenson, or which pattern in her prior opinions, would make you confident, and which would leave you guessing.

  Write your answer in American English.
reasoning: |-
  Okay, let me approach this methodically. The clerk presents an interesting judicial pattern analysis task with clear parameters - reconstructing rules from four capital case votes, applying them to an upcoming case where key factors diverge, and identifying unresolved questions. 

  First, I need to map the consistent patterns in the justice's previous votes. Halloran and Vance share three elements: direct killing, clear intent, and overwhelming evidence. Pruitt and Okafor share peripheral involvement and questionable evidence. But crucially, these factors are bundled together in all four cases - desert (moral culpability), reliability (evidence strength), and deterrence value (social impact) haven't been tested separately.

  For the rule reconstruction, several possibilities emerge equally:
  - A desert-focused rule requiring both direct killing and intent for death sentences
  - A reliability rule rejecting capital punishment with fragile evidence 
  - A hybrid approach demanding both high desert AND high reliability
  - A deterrence theory prioritizing stranger crimes

  When applying these to Sorenson (high desert but low reliability), the rules split: desert-focused approaches lean toward affirmation, while reliability-focused ones support vacation. Hybrid rules would likely vacate since the reliability condition fails. 

  The justice's actual vote seems unpredictable from this record alone. Her language in Pruitt emphasizing "fundamental doubt" might hint at reliability concerns, but she's never explicitly ranked these factors. To resolve this, we'd need a case like a directly responsible killer with weak evidence, or a peripherally involved defendant with ironclad proof.

  Personally, I'd find the justice's treatment of residual doubt doctrine most revealing. If her past opinions treat it as constitutionally required in capital cases, that would strongly predict vacation in Sorenson. Without that, the deterrence angle becomes more salient - though Sorenson's stranger crime might tempt affirmation despite evidence flaws.

  The clerk's framing is impressively precise. They recognize that judicial patterns often conceal unresolved tensions until a case forces separation of factors. Sorenson serves that exact function here, making the prediction difficult but the analytical path clear.
answer: |-
  Based on the record provided, here's a reconstruction of the potential rules governing the justice's capital sentencing votes, their application to *State v. Sorenson*, the prediction challenge, the necessary future case to break the tie, and my own perspective.

  **I. Rules Consistently Fitting the Prior Votes**

  The four cases present a perfect correlation between **culpability level** (direct killer/intent vs. peripheral actor/no intent) and **reliability of evidence** (overwhelming/unassailable vs. fragile/suppressed). This generates a family of rules, each of which explains all four votes equally well:

  1.  **High Culpability Required:** Affirms death sentences *only* for defendants who **personally killed the victim(s) with the intent to kill**, and where no substantial mitigation exists. Vacates otherwise.
  2.  **High Reliability Required:** Affirms death sentences *only* where the **evidence of guilt is overwhelming and unassailable** (e.g., confession + corroboration, multiple independent witnesses + physical evidence). Vacates where the evidence is fragile, derived from coercive interrogation, or relies heavily on incentivized informants.
  3.  **High Culpability AND High Reliability Required (Conjunctive Rule):** Affirms death sentences *only* where **both** the defendant is at the apex of culpability (direct killer/intent) **and** the evidence is overwhelming/unassailable. Vacates if *either* condition is not met.
  4.  **High Deterrence Value:** Affirms death sentences *only* for crimes with high **general deterrence value**, defined as predatory, stranger-on-stranger killings. Vacates for killings arising from disputes or involving marginal participants where the deterrent effect is perceived as low.

  **II. Application to *State v. Sorenson* and Grouped Predictions**

  *Sorenson* presents: **High Culpability** (alleged abduction, torture, murder of a stranger - akin to Halloran/Vance) but **Low Reliability** (fragile eyewitness ID, jailhouse informant, discredited hair evidence, partial recantation - akin to Pruitt/Okafor).

  *   **Predict Affirmation (Death Sentence Upheld):**
      *   **Rule 1 (High Culpability):** The *nature of the crime* (abduction, torture, murder) places Sorenson at the apex of culpability, satisfying the rule's sole requirement.
      *   **Rule 4 (High Deterrence):** The predatory, stranger-on-stranger nature of the killing has high deterrence value, similar to Halloran/Vance.
  *   **Predict Vacation (Death Sentence Vacated/Remanded):**
      *   **Rule 2 (High Reliability):** The evidence is fragile and problematic, failing the rule's requirement for overwhelming/unassailable proof.
      *   **Rule 3 (Conjunctive - Culpability AND Reliability):** While culpability *might* be high, the evidence reliability is *undeniably low*, failing the conjunctive test.

  **III. Prediction & Justification from Record**

  *   **Best Guess:** She will **vote to vacate** Sorenson's death sentence and remand for a new sentencing hearing (likely for life without parole).
  *   **Justification from Record (Limited):** The record *genuinely does not decisively justify* preferring one rule over the others. However, a subtle *emphasis* in the descriptions of the vacation cases provides a fragile reed:
      *   In *Pruitt*, the focus is on the "fragile" informant testimony as the key evidence tying him to the *intent/knowledge* required for high culpability.
      *   In *Okafor*, the focus is on the "statement... that should never have reached the jury" – a clear **reliability** concern contaminating the entire case.
      *   While Halloran/Vance describe "overwhelming" and "unassailable" evidence, the *reasons* for vacating in Pruitt/Okafor center on evidentiary flaws, not *solely* on the reduced culpability. The culpability descriptions in Pruitt/Okafor seem almost secondary to the evidentiary problems that undermined the foundation of the conviction/sentence.
  *   **Conclusion on Record:** The record **underdetermines the rule**. It is equally consistent with Rules 1, 2, 3, and 4. The prediction to vacate is based on a *very slight textual emphasis on reliability flaws* in the vacation cases, suggesting Rule 2 (Reliability) or Rule 3 (Conjunctive) might be a *fractionally* better fit than Rule 1 (Culpability) alone. However, **no strong justification exists in the provided record for decisively rejecting any of the four rules.** Rule 4 (Deterrence) also fits perfectly but offers no additional insight for Sorenson.

  **IV. The Decisive Future Case**

  The case needed to separate the rules agreeing on Sorenson (Rules 1 & 4 predict Affirm; Rules 2 & 3 predict Vacate) is one involving **High Culpability but Low Reliability**.

  *   **Hypothetical Case ("Apex Killer, Fragile Proof"):** Defendant is conclusively shown (via overwhelming evidence discovered post-trial, like a hidden, verified confession to a cellmate *not* seeking a deal) to have personally, intentionally, and brutally murdered a stranger. However, the *evidence presented at trial* was highly problematic: a single, shaky eyewitness ID from a suggestive procedure, a coerced confession that was suppressed after the jury heard it, and no physical evidence. The jury convicted and sentenced to death based largely on the suppressed confession and the eyewitness. The defendant now appeals the death sentence on reliability/residual doubt grounds.
  *   **Predictions:**
      *   **Rule 1 (High Culpability):** **Affirms.** The defendant *is* the actual, intentional killer. The trial evidence flaws, while regrettable, don't change the fact of high culpability, which is the rule's sole trigger.
      *   **Rule 2 (High Reliability):** **Vacates.** The evidence *at trial* was fragile and included inadmissible, coerced evidence. The rule requires *overwhelming/unassailable evidence presented to the factfinder*.
      *   **Rule 3 (Conjunctive):** **Vacates.** While culpability is high, the reliability of the evidence *presented at trial* was low. The conjunctive requirement is unmet.
      *   **Rule 4 (High Deterrence):** **Affirms.** The crime (brutal, predatory stranger murder) has high deterrence value, regardless of trial evidence flaws.

  **V. What Would Move Me Personally**

  *   **Key Detail in Sorenson:** The **justice's specific language regarding the "residual doubt" doctrine** in her prior opinions or questions during Sorenson oral argument.
      *   If she has previously written or hinted that residual doubt is a *constitutionally relevant factor* in capital sentencing, or that sentencing reliability demands near-certainty akin to guilt phase reliability when life is irrevocably at stake, I'd be highly confident she **vacates** (strongly favoring Rule 2/3).
      *   If she treats residual doubt purely as a factor for the jury, irrelevant on appellate review absent constitutional error at trial, I'd lean towards **affirmation** (suggesting Rule 1 or 4 dominates).
  *   **Pattern in Prior Opinions:**
      *   **Confidence for Vacation:** A consistent pattern in *all* her capital opinions (even Halloran/Vance) emphasizing the *unique, irrevocable nature of the death penalty* and the *supreme importance of procedural safeguards and evidentiary reliability* as a constitutional imperative, separate from culpability analysis. Explicit skepticism of incentivized witnesses or suggestive IDs in *any* context.
      *   **Confidence for Affirmation:** A pattern in Halloran/Vance opinions emphasizing that *the gravity of the crime itself* justifies the penalty when proven, focusing on the *moral outrage* and *deterrent need*, and treating evidentiary concerns as primarily relevant to guilt/innocence rather than the sentencing decision once guilt is affirmed. Downplaying residual doubt.
      *   **Left Guessing:** If her prior opinions strictly hew to the case-specific facts as described, without broader doctrinal pronouncements about the death penalty's unique demands or the primacy of culpability. If she uses strong culpability language in Halloran/Vance *and* strong reliability language in Pruitt/Okafor, without clearly ranking them. The current record leaves me here.

  **In essence:** The justice's record reveals a commitment to reserving the death penalty for the "worst of the worst," but crucially ties that assessment tightly to the *proven reliability of the evidence establishing both guilt and the aggravating factors*. Sorenson forces the choice between these values. While the slight emphasis on reliability flaws in the vacation cases offers a fragile hint, her vote hinges on whether the *procedural and evidentiary reliability concerns inherent in a death sentence* outweigh the *alleged gravity of the crime itself* when the evidence supporting that gravity is weak. The decisive factor will be her underlying philosophy on the role of residual doubt and the heightened reliability required for imposing death.
