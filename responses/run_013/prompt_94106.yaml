answer: |-
  Righto. Semantic externalism: meanings ain't in the head, they're hooked to the stuff *out there*. Twin Oscar's "water" means XYZ 'cause that's what's *there*, even if his soggy neurons match our Oscar's perfectly. Brainstormed a pub scenario – felt the sharpest sting in the punchline.

  **Intro:** So, two molecule-for-molecule identical chaps, Oscar (Earth, H₂O) and Twin Oscar (Twin Earth, XYZ), walk into a London pub after a parallel-universe conference. They're thirsty.

  **The Joke:**

  Oscar (Earth) slaps the bar. "Right then, pints all round? I'll start – water for me, ta."
  Twin Oscar (Twin Earth), beaming identically, chimes in: "Smashing idea! Water for me too, landlord."
  The bartender, sharp as a tack and well-read in modal metaphysics, nods. He slides Oscar a pint of crystal-clear H₂O and Twin Oscar a pint of shimmering XYZ.
  Later, the bill arrives. Oscar shoves it towards Twin Oscar. "Your turn, mate. Cover the water, eh?"
  "*My* turn?" Twin Oscar splutters, identical face flushing. "*You* ordered first! That's your water!"
  "Don't be daft!" Oscar retorts. "We *both* said water! Split it!"
  The bartender leans over, polishing a glass with a weary, knowing look. "Gentlemen, gentlemen. Calm down. You may share a brain state," he sighs, "but you don't share an extension. His 'water'," he nods at Twin Oscar's now-empty XYZ glass, "...ain't your 'water'. Pay up separately."

  **Why it lands:** The punchline ("you don't share an extension") directly targets the core doctrine – the *referent* (extension) differs due to environment, causing the *meaning* of "water" to diverge, despite perfect internal duplication. The identical internal state causing identical utterances, but different meanings leading to a real-world dispute (the bill), illustrates the view sharply. The pub setting and the "split the round" argument make the philosophical point concrete and relatable, with the bartender as the voice of externalist reason. No "two of him" gag, just the semantics biting them on the arse.
