prompt: |-
  I'm preparing a short statement of my own commitments in welfare economics for a workshop, and I'd like a consistency audit before I circulate it. Here is where I've landed.

  1. Social evaluation is ex ante, and social preferences satisfy the expected-utility axioms: the value of a lottery is its expected social value. I take Harsanyi's aggregation theorem to show that, given the ex ante Pareto principle, the social welfare function must be a weighted sum of individual utility functions.

  2. Ex ante Pareto: if every individual's prospect under lottery L is at least as good as under lottery M, and strictly better for at least one person, then L is socially better than M.

  3. Anonymity: the social ordering is invariant under any permutation of persons. Who is who never enters into the evaluation.

  4. Prioritarianism: a gain in welfare counts for more when it goes to someone worse off. I want this to be a feature of the social evaluation itself, not a by-product of how much the individuals happen to dislike risk.

  5. Procedural fairness: I think a fair coin can be better than an arbitrary assignment. If two patients are identical in every respect, each facing the same risk, and there is a single dose that will save exactly one of them, I want to say that deciding by coin is better than giving the dose to whoever happens to be first in the queue.

  I have the uneasy feeling that not all of this can be held together, but each item still looks right to me on its own, and I can't see which one is doing the damage. Work through the set: say which commitments are actually in tension and which pairs only look as though they are, rank the genuine tensions by severity rather than treating them all as equally bad, and for each genuine tension identify what would have to give and what the least costly repair would be. If a single revision would clear up more than one of them, say which. I don't need pointers to the literature; I need the audit. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  We are given five commitments:

  1. Ex ante social evaluation with expected utility axioms -> social welfare as weighted sum of individual utilities (from Harsanyi).
  2. Ex ante Pareto principle.
  3. Anonymity.
  4. Prioritarianism: social evaluation weights gains to the worse off more.
  5. Procedural fairness: coin flip better than arbitrary assignment in symmetric cases.

  The bottom line: There is a fundamental tension between prioritarianism (4) and the combination of ex ante Pareto (2) and the expected utility/Harsanyi framework (1). Anonymity (3) and procedural fairness (5) are not the primary sources of tension. The most severe conflict is between (1), (2), and (4). The least costly repair is to drop or modify prioritarianism (4) to be consistent with the Harsanyi framework, or to drop the ex ante Pareto principle (2) in some cases.

  Reasoning:

  Step 1: The Harsanyi aggregation theorem (from commitment 1 and 2) implies that the social welfare function is a weighted sum of individual expected utilities. With anonymity (3), the weights must be equal. So we get: Social welfare = sum of individual utilities (utilitarianism). 

  But commitment 4 (prioritarianism) requires that we give more weight to the worse off. This is inconsistent with the utilitarian sum. Therefore, (4) is inconsistent with (1,2,3). 

  Step 2: How severe is this tension? Very severe because (1) and (2) together force linear aggregation (weighted sum) and (3) forces equal weights, leading to utilitarianism. Prioritarianism (4) requires a nonlinear transformation of individual utilities (like a concave function) which is incompatible with linear aggregation.

  Step 3: Consider commitment 5 (procedural fairness). In the example, two identical patients and a coin flip vs. arbitrary assignment. In the Harsanyi framework, if the individuals are identical and we are anonymous, then both lotteries (coin flip and arbitrary assignment) yield the same ex ante utility for each individual. Therefore, by ex ante Pareto, they are equally good. But commitment 5 says the coin flip is better. This is a tension between (5) and the combination of (1,2,3).

  However, note that without prioritarianism, we have utilitarianism and the two lotteries are equally good. So (5) is inconsistent with (1,2,3). But note that if we drop anonymity, we might have a way to break the symmetry arbitrarily, but anonymity (3) is present. Also, prioritarianism (4) does not help because the individuals are identical and at the same level, so a prioritarian social welfare function would also be symmetric and assign the same value to both lotteries.

  Therefore, we have two tensions:

  Tension A: Between (4) and (1,2,3) -> prioritarianism vs. Harsanyi utilitarianism.
  Tension B: Between (5) and (1,2,3) -> procedural fairness vs. Harsanyi utilitarianism.

  But note that Tension A is more severe because it is a direct contradiction in the form of the social welfare function. Tension B is a specific counterexample to the implication of Harsanyi in a symmetric case.

  Ranking: Tension A is the most severe because it undermines the entire functional form. Tension B is a specific counterexample but does not necessarily break the functional form (it just shows that the functional form does not capture procedural fairness).

  Step 4: What would have to give?

  For Tension A: We must either:
  - Drop prioritarianism (4) and accept utilitarianism, or
  - Drop the ex ante Pareto principle (2) or the expected utility framework (1) for social evaluation.

  For Tension B: We must either:
  - Drop procedural fairness (5), or
  - Drop one of (1,2,3). But note that without (1) and (2), we lose the Harsanyi result.

  Step 5: Least costly repairs:

  - To resolve Tension A: The least costly repair is to drop prioritarianism (4) and accept utilitarianism. Alternatively, if prioritarianism is non-negotiable, then we must drop the ex ante Pareto principle (2) in some cases. However, dropping ex ante Pareto is a major cost because it is a fundamental welfare principle.

  - To resolve Tension B: The least costly repair is to drop procedural fairness (5) and accept that in symmetric cases, the coin flip and arbitrary assignment are equally good. Alternatively, we could drop the expected utility framework (1) for social evaluation and adopt a non-expected utility model that values the fairness of the procedure. But that would require a major revision.

  However, note that Tension A and Tension B are related: both arise because the Harsanyi framework leads to utilitarianism. If we drop (1) and (2) to fix Tension A for prioritarianism, we might then be able to account for procedural fairness (Tension B) as well. But this is a major overhaul.

  But there is a connection: if we drop (1) and (2) and instead adopt an ex post approach, then we can have prioritarianism and also value the coin flip. For example, in the ex post prioritarianism, the coin flip leads to a 50% chance of saving one and 50% chance of saving the other, and because of the concavity in the prioritarian transformation, the ex post view might value the coin flip as fair. However, note that in the example, the two patients are identical and the prioritarian transformation is symmetric so the ex post evaluation of the two outcomes (save A or save B) would be the same. Therefore, the coin flip and arbitrary assignment would again have the same ex ante social value. Thus, prioritarianism alone does not capture procedural fairness.

  To capture procedural fairness, we need to value the procedure itself. This is beyond both utilitarianism and prioritarianism. So even if we fix Tension A by moving to ex post prioritarianism, we still have Tension B.

  Therefore, the two tensions are somewhat independent.

  Step 6: Overlap in repairs:

  If we drop the ex ante Pareto principle (2) and the expected utility framework (1) for social evaluation, we can then adopt an ex post prioritarianism that might also allow for valuing procedures. This could potentially resolve both Tension A and Tension B. But note that commitment 1 explicitly requires ex ante and expected utility. So this would require changing the first commitment.

  Alternatively, we might keep ex ante evaluation but drop the linear aggregation (i.e., drop the implication of Harsanyi) by rejecting the expected utility axioms for social evaluation. Then we could have a non-expected utility social welfare function that is prioritarian and also values the coin flip. However, this is a major change to commitment 1.

  Conclusion:

  The most severe tension is between prioritarianism (4) and the Harsanyi framework (1) combined with ex ante Pareto (2) and anonymity (3). The next is between procedural fairness (5) and the same Harsanyi framework. The least costly repair for the first is to drop prioritarianism and accept utilitarianism. If prioritarianism is essential, then the next best is to drop ex ante Pareto (2) and revise commitment 1 to allow for non-expected utility social evaluation. This same revision might also help with procedural fairness (5) because we could then build in a concern for the procedure. However, note that procedural fairness is not addressed by prioritarianism. Therefore, to keep (5) we would need to add a separate principle that values the fairness of the procedure, which might be independent of the prioritarianism/utilitarianism debate.

  But note: Without commitment 1 (expected utility) and commitment 2 (ex ante Pareto), we lose the Harsanyi result and then we can have a prioritarian social welfare function that is applied ex post. Then, in the procedural fairness case, we might evaluate the lottery ex post and note that the coin flip is fair, but that would require an additional value. Alternatively, we might adopt a social welfare function that incorporates risk in a way that values the equality of chances. This is a significant departure.

  In summary, the core problem is that the Harsanyi framework (1) and ex ante Pareto (2) force a linear aggregation (utilitarianism) which is incompatible with prioritarianism (4) and also with the procedural fairness intuition (5) in symmetric cases.

  Therefore, the bottom line is:

  **The commitments are inconsistent because the Harsanyi framework (1) combined with ex ante Pareto (2) and anonymity (3) implies utilitarianism, which is inconsistent with prioritarianism (4) and also fails to capture the procedural fairness intuition (5). The most severe tension is with prioritarianism. The least costly repair is to drop prioritarianism (4) and accept utilitarianism. If prioritarianism must be kept, then the next best is to drop the ex ante Pareto principle (2) and revise the social welfare framework to allow for ex post prioritarianism, which might also help with procedural fairness (5) but at the cost of a major overhaul.**
answer: |-
  **The commitments are inconsistent due to a fundamental tension between prioritarianism and the Harsanyi framework, with procedural fairness also conflicting; the least costly repair is to drop prioritarianism or reinterpret it as a feature of individual risk attitudes.**  

  ### Genuine Tensions (Ranked by Severity):  
  1. **Prioritarianism (4) vs. Harsanyi (1) + Ex Ante Pareto (2) + Anonymity (3)**  
     - **Severity:** Critical. Harsanyi’s theorem (from 1–2) implies social welfare is a *linear* weighted sum of individual utilities. Anonymity (3) forces equal weights, reducing this to utilitarianism. Prioritarianism (4) requires *nonlinear* aggregation (e.g., concave transformation of utilities), violating linearity.  
     - **Repair:** Drop prioritarianism (4) and accept utilitarianism. *Alternatively*, drop ex ante Pareto (2) to allow ex post prioritarianism, but this abandons your ex ante framework (1).  

  2. **Procedural Fairness (5) vs. Harsanyi (1) + Ex Ante Pareto (2) + Anonymity (3)**  
     - **Severity:** Major but secondary. In the medical example, identical patients have symmetric ex ante prospects under both coin-flip and queue-based allocation. Harsanyi + Pareto + Anonymity implies indifference between them, contradicting (5).  
     - **Repair:** Drop procedural fairness (5) if utilitarianism is retained. *Alternatively*, drop ex ante Pareto (2) to value fairness of process independently, but this conflicts with (1).  

  ### Apparent Tensions (Not Genuine):  
  - **Prioritarianism (4) vs. Anonymity (3):** No conflict. Anonymity requires symmetry across persons; prioritarianism satisfies this if the priority weighting is symmetric (e.g., based on absolute welfare levels).  
  - **Procedural Fairness (5) vs. Prioritarianism (4):** No direct conflict, as (5) addresses process while (4) addresses distribution. However, both independently clash with Harsanyi.  

  ### Overlapping Repairs:  
  - **Drop ex ante Pareto (2):** Resolves both tensions by decoupling social evaluation from Harsanyi’s linearity. This permits ex post prioritarianism and independent procedural fairness values. However, it abandons your core ex ante commitment (1) and is costly.  
  - **Drop prioritarianism (4):** Resolves the primary tension cleanly. Utilitarianism (from 1–3) satisfies most commitments but clashes with (5). A less costly patch for (5) is to reframe it as an instrumental value (e.g., coin-flips prevent bias), not intrinsic.  

  ### Least Costly Path:  
  **Drop prioritarianism (4).** This preserves the Harsanyi framework (1–3) with minimal damage. To soften the loss, reinterpret "gains to the worse off" as emerging from individual risk aversion (consistent with 1), not social weighting. For procedural fairness (5), justify it instrumentally (e.g., "fair procedures reduce conflict") rather than as a fundamental welfare criterion. This retains ex ante Pareto and Harsanyi while neutralizing the key inconsistency.
