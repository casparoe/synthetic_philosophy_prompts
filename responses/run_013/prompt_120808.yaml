prompt: |-
  I'm in a seminar on ethics and techonology and I've been trying to pin down what I actually think about privacy, because the nothing-to-hide line everyone repeats seems obviously wrong to me but I can never say why without sounding like I'm just anti-corporate. So here's my gut on a pile of cases, and I want to know what principle is underneath them, if there is one. My roommate reads my unlocked diary while I'm out and learns nothing she didn't already know about me: I think that's a serious violation, and only a little less serious than if she'd learned something new -- the wrong doesn't seem to be about what she found out. A stranger recognizes me on the street from my public instagram: completely fine. Someone reads over my shoulder on the train: rude, invasive, but way less bad than the diary. My friend tells his partner a secret I told him: wrong, but it feels like breaking a promise more than violating my privacy, and I dont think the partner did anything wrong by hearing it. My friend tells me a secret about her sister: fine, I've done nothing wrong, even though I now hold something about the sister that she never chose to give me. A store infers from my purchase history that I'm pregnant and mails me coupons before I've told anyone: this one makes my skin crawl, even though no human being ever looked at anything about me and I'd have told my friends within the month.

  My doctor asks about my sex life: fine, she needs it. My insurer asks the same question: not fine, even though it's the same fact and they'd use it to price me. My neighbor's porch camera catches the sidewalk in front of his house: fine, anyone walking by can see that. A drone hovering over my fenced backyard: not fine, even though the drone is also only seeing what's technically outside my walls. And my employer asks for my Facebook login as a condition of a promotion and I hand it over: I still think that was a violation, even though I agreed to it.

  My tentative theory is that it's all about control -- a violation is information about me going somewhere I didn't authorize it to go. That gets the diary, the instagram post, the doctor versus the insurer, and the drone. But it seems to get the store case wrong (nobody took anything, and I did authorize the shopping), it seems to get the sidewalk camera wrong (I didn't authorize that either), and it gets the employer case wrong in the other direction (I said yes, so on the control view there's nothing to complain about). My fallback was that it's about what I can reasonably expect to be seen or inferred in a given context -- but then what fixes the expectation, and if the answer is just the norms of the context, has the principle explained anything, or is it a fancy way of restating my verdicts back to me? Take these seriously and tell me what principle, or small set of principles, actually generates them; whether it has to be one thing or a bundle of different interests that happen to share the word privacy; which of my verdicts it forces me to give up; and what it predicts for a case I haven't listed -- my landlord installing a camera in the shared hallway that logs when each tenant comes and goes, which I think is wrong even though the hallway is semi-public and my neighbors see me all the time. Lead with your bottom line in the first sentence and then give the reasoning, no preamble, and don't restate my cases back to me.
reasoning: |-
  Okay, let me tackle this user's privacy dilemma. They've shared a bunch of scenarios where their gut feeling about privacy violations varies, and they're struggling to find an underlying principle. The nothing-to-hide argument doesn't sit right with them, but they can't articulate why without sounding anti-corporate. 

  First, I notice their roommate reading their diary feels wrong even if no new info is learned. That's interesting because it suggests the violation isn't about the information itself but something else. Then there's the store inferring pregnancy from purchases—creepy despite no human involvement. And the employer getting Facebook access with consent still feels violating. 

  Hmm, their control theory falls short in cases like the sidewalk camera (no authorization but fine) and the employer (authorized but still wrong). The reasonable expectations theory feels circular to them. 

  What connects these? Maybe it's about power dynamics and relational boundaries. The diary intrusion breaks an intimate boundary. The store's algorithm creates power asymmetry through hidden inference. The employer coerces consent, making it non-genuine. 

  For the hallway camera, even if semi-public, it shifts observation from casual neighbor glances to systematic surveillance, altering the power dynamic. That explains why it feels wrong despite being "public." 

  So the core isn't just control or expectations, but how information flows affect relational power and autonomy. Cases where power is exploited or boundaries violated feel wrong, even with consent if it's coerced. This framework handles their cases consistently without circularity.
answer: |-
  **The core principle is that privacy violations occur when information access or use disrupts relational boundaries and power dynamics, undermining autonomy in a way that disrespects the context-specific roles and expectations governing social relationships.** Here's how it explains your cases:

  1.  **Diary:** Access disregards the intimate *relational boundary* of trust between roommates, treating a private artifact as public. The *power* imbalance comes from non-consensual intrusion into a space designated for personal reflection, violating the unspoken relationship role.
  2.  **Instagram Stranger:** Seeing public information in public aligns with the *role* of "stranger" and the *context* you created. No boundary crossed, no power imbalance created.
  3.  **Train Shoulder Reading:** Mildly invasive because it disregards the *contextual norm* (reading over a shoulder in transit is rude), creating a minor, transient power imbalance by appropriating your attention/space without consent.
  4.  **Friend Tells Partner:** The primary wrong is the *relational betrayal* – your friend violated the boundary *within* your friendship role. The partner hears it passively within *their* relationship context, so their role isn't inherently violating.
  5.  **Friend Tells You Sister's Secret:** You receive information within the *context* and *role* of confidant to your friend. The sister's boundary was violated *by her sister*, not by you. Your role doesn't inherently impose a power imbalance over the sister.
  6.  **Store Infers Pregnancy:** This exploits a *relational boundary* mismatch. You consented to transactional data exchange (buying goods), not to intimate *inferential profiling* that creates *power asymmetry* (knowledge you haven't chosen to share, used to target/manipulate you). It bypasses your autonomy by inferring deeply personal states outside the agreed context, shifting power to the corporation.
  7.  **Doctor vs. Insurer:** Both ask the same fact, but the *relational role* and *contextual purpose* differ. The doctor's role is care-focused, requiring the information for *your* benefit within a fiduciary relationship. The insurer's role is risk-pricing for *their* benefit; disclosing creates a *power imbalance* where your intimate details are used against your interests, violating the boundary of the patient-insurer relationship.
  8.  **Porch Camera vs. Drone:** The porch camera observes a *publicly accessible space* consistent with the neighbor's role in securing *their own property*. The drone surveils a space *you've bounded* (fenced yard) to create privacy, imposing an external observation *power* where none was expected or consented to, disrupting the boundary around your home.
  9.  **Employer/Facebook Login:** You "consented," but the *power imbalance* in the employment relationship makes consent non-genuine (coercive). Accessing your personal social sphere violates the *relational boundary* between professional and private life, granting the employer intrusive *power* over aspects of your identity irrelevant to work.
  10. **Landlord Hallway Camera:** Though semi-public, installing a camera *systematically logs* comings/goings in a space neighbors observe *casually*. This transforms passive, contextual neighbor awareness into active, persistent *surveillance by a power holder* (landlord). It creates a novel *power asymmetry* and undermines autonomy by treating routine living as data for potential scrutiny, disrupting the tenant-landlord relational boundary.

  **What you might need to give up:** The drone case *is* partly about control (you couldn't control its intrusion), but the core wrong is the *disruption of the boundary and power dynamic* your fence established. Your "consent" in the employer case *is* relevant, but the principle shows why coerced consent doesn't legitimize the boundary violation. The store case isn't about unauthorized *taking* of data, but about *inferential misuse* violating the context and creating harmful power asymmetry.

  **Predicting a New Case:** Your gut feeling about the landlord camera being wrong aligns perfectly. The principle explains it as the landlord leveraging their power to institute systematic surveillance in a space where tenants reasonably expect transient, non-recorded observation, creating an unjustified power imbalance and violating the relational boundary of mutual respect and limited oversight inherent in a landlord-tenant relationship.
