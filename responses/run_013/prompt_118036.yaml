  I'm a high school student applying to a summer philosophy program that asks for a one-page research proposal, and I'd like help turning a half-formed idea into one. I want to work on the surprise exam paradox: the teacher announces that there will be a surprise exam sometime next week, the students argue by backward induction that no such exam can occur, and yet the teacher gives it and they are surprised. My hunch is that the students' argument only shows the announcement cannot be known with certainty in advance, not that it cannot be true, and that two things dissolve the paradox: surprise should be measured by the students' degrees of belief rather than by their certainty, and the teacher's announcement is better read as a promise about her own future action than as a prediction about a fixed fact. Please write the proposal. State the question precisely enough that it has a definite answer; explain why the usual ways of handling the paradox leave this version of it unsettled; set out what I would actually do, including a small model in which the students assign a probability to each day (my maths is limited to what a strong high-school student knows, so keep the method within reach); say what a result would look like and what would count as the project failing; and keep the whole thing realistic for roughly three months of after-school work. Don't include citations — I'll add those myself.
