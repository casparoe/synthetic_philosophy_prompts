prompt: |-
  I'm TAing a 300-level course that's half normative ethics and half decision theory, and I'm grading the midterm this weekend — forty of them to get through before friday, and they're all starting to blur together. Question 3 is the one I keep going back and forth on, so before I put a number on this one I want someone else to look at it. The student's a sophmore who's been doing fine in the course, for whatever that's worth.

  Here's the question as it was handed out: "Take a domain of outcomes, with 'at least as good as' as the basic relation and 'better than' defined from it in the usual way — X is better than Y just in case X is at least as good as Y and Y is not at least as good as X. Now consider a sequence O1, ..., O25, where O1 is a small population of very good lives and O25 is a vastly larger population of lives that are barely worth living, and where each outcome in the sequence is better than the one before it by a small margin that, taken on its own, looks uncontroversial (slightly more people, slightly lower average quality, nobody made worse off, and so on). (a) Reconstruct the argument from the adjacent comparisons plus transitivity to the conclusion that O25 is better than O1, and say whether the argument is valid. (b) A classmate responds: 'So betterness is intransitive. But we can keep transitivity for "at least as good as" and let "better than" be the intransitive relation. Since decision theory and the money-pump argument only need "at least as good as" to be transitive, nothing important is lost.' Assess this response. (c) What are the options for someone who wants to resist the conclusion, and what does each one cost?"

  And the student's answer: "(a) The argument is valid. From the 24 premises — O2 better than O1, O3 better than O2, ..., O25 better than O24 — plus transitivity of betterness, induction along the chain gives O25 better than O1. No further premise is smuggled in; in particular nothing about total utility is used, only the 24 comparisons. The conclusion is the repugnant conclusion. (b) The classmate's response is the cheapest place to give ground. Betterness being intransitive isn't as crazy as it sounds — we already accept intransitive relations like 'beats' in rock-paper-scissors — and what decision theory really needs is that 'at least as good as' is transitive, since the money-pump argument is driven by the transitivity of 'at least as good as'. So we can hold that 'at least as good as' is transitive and complete while making 'better than' intransitive. What this amounts to is that some of these outcomes are incommensurable — there's no fact of the matter about which is better — which is a familiar idea in the literature on incomparable values, so it isn't ad hoc. The only cost is that 'better than' no longer supports the usual aggregation. (c) The options are to reject transitivity, to reject one of the 24 comparisons, or to accept the conclusion. The second looks weakest: the sequence was built so that no single step is a big deal, so wherever you draw the line it'll be an arbitrary sharp cutoff, which is exactly what Sorites arguments make embarrassing. So I'd reject transitivity — the spectrum argument shows betterness isn't transitive, and we should stop treating it as a strict ordering."

  Grade it out of 10 (it's worth 10 of the 40 marks) and give me the comments to paste in, part by part: for each of (a), (b), and (c), what the student gets right, what's wrong or doesn't follow and why, and what the fix or the better answer would be. I especially want the things I'd probably wave through if I were skimming, because I suspect I've been too generous with this stack. Also tell me what a full-marks answer would have added that this one doesn't, and whether the conclusion the student lands on in (c) is actually supported by the reasoning they give for it — and if any part of the question itself is a trap or is unfair, flag that too, since I wrote it.
