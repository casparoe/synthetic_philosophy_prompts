prompt: |-
  Last night I lost an argument, or at least failed to win one, with a friend who works in actuarial science, and the dispute was about a sentence I teach but had never had to defend at that altitude. The sentence was of the form "there is a 35 percent chance that this particular person will do X." My friend insists that such a sentence states a fact about the person; I kept insisting that it states a fact only about a class the speaker has silently chosen, and that nothing in the case determines which class that is. He produced the obvious rejoinder — you simply take the narrowest reference class that is still statistically relevant to the outcome — and I said that this either regresses until the class is the person alone, at which point the frequency is zero or one and tells you nothing, or it stops at an arbitrary point. We went around that loop four or five times and neither of us could close it. I would like my students to feel exactly where the loop is, from the inside, rather than hear me describe it.

  I run a philosophy of science seminar: twelve students, mostly second- and third-year, and I have a single ninety-minute session. Design a classroom activity — a game or a structured exercise — that stages the reference class problem so that the students generate it themselves. I want them to commit, in writing, to a probability for a single case and to the reference class they used, before they have any idea that the choice of class is the interesting part; then I want the exercise to make the alternative reference classes impossible to ignore, and to let them discover for themselves that the rule they reach for does not terminate and does not help. By the end they should see three things: that the number was not read off the case but imposed by a class they chose; that for any class they name, a defensible alternative class yields a materially different number; and that the usual repair either regresses to the singleton or halts arbitrarily. The idea has to show up in what happens to them, not in what I say afterward.

  Give me the full apparatus: the case or cases to hand out, the materials, the rules and the scoring, a timeline for the ninety minutes, and the moves I make as facilitator to keep the exercise from collapsing early. I especially want the mechanism by which the students are induced to choose a reference class without noticing that they are choosing, and the moment at which the alternative classes are revealed — I want that to land as a surprise rather than as a lesson. Then the debrief: map what happened at each stage onto the parts of the problem — the frequency interpretation and where it requires a class, the single-case problem, statistical relevance and the narrowest-class rule, and the subjectivist retreat in which the number is merely a degree of belief and the class is whatever the believer happens to find salient. Note which of those the activity actually earns and which I have to supply by talking.

  Two further things. First, tell me what will predictably go wrong the first time I run it and how to handle it — I am particularly worried that the students will litigate the base rates instead of the choice of class, that they will refuse to commit to a single number, or that the scoring will make them think the number is what is being graded rather than the class. Second, be honest about what this activity cannot reproduce. I suspect it can make the conflict vivid and can kill the naive narrowest-class fix, but that it cannot reproduce the positive proposals on either side, nor the metaphysical question of whether there is any fact of the matter about the individual's chance at all. Say so, and say what I will have to add myself for the session to amount to more than a demonstration that a problem exists.
reasoning: |-
  We are designing a classroom activity to stage the reference class problem. The goal is for students to:
  1. Commit to a probability for a single case and a reference class without initially realizing that the choice of class is the issue.
  2. Discover that alternative reference classes yield different probabilities.
  3. Realize that the "narrowest relevant class" rule either regresses to the singleton or halts arbitrarily.

  Activity Title: "The Probability Prediction Game"

  Case: We will use a specific scenario that is simple and relatable. Let's use:

  **Scenario:** 
  "Alex is a 22-year-old college senior at a liberal arts college in the Northeast, majoring in English. Alex has been offered a job in marketing in Chicago and is deciding whether to take it. What is the probability that Alex will accept the job?"

  We choose this because:
  - It's a common life decision, so students can relate.
  - There are multiple reference classes we can form: by age, by major, by region, by job type, etc.

  Materials:
  - Handout with the scenario (one per student).
  - A worksheet (or online form) to record:
     (a) Their estimated probability (0 to 100%) that Alex will accept the job.
     (b) The reference class they used (without initially explaining what a reference class is; we'll ask for "the group of people you based your estimate on").
  - A set of pre-prepared "data cards" (or slides) that provide statistical data for various reference classes. These will be revealed later.

  Data Cards (to be prepared in advance; we'll make up plausible but simplified data):

  1. **All college seniors**: 40% accept their first job offer.
  2. **College seniors majoring in English**: 55% accept their first job offer.
  3. **College seniors in the Northeast**: 45% accept their first job offer.
  4. **College seniors at liberal arts colleges**: 50% accept their first job offer.
  5. **22-year-old college seniors**: 48% accept their first job offer.
  6. **College seniors offered a marketing job**: 60% accept.
  7. **College seniors offered a job in Chicago**: 65% accept (if they are from the Midwest, but only 40% if from the Northeast) -> This one introduces a dependency.

  But note: We will also have a card for a more specific class:

  8. **22-year-old English majors at liberal arts colleges in the Northeast**: 52% accept their first job offer.

  And even more specific:

  9. **22-year-old English majors at liberal arts colleges in the Northeast offered a marketing job in Chicago**: 58% accept.

  However, we do not have data for the singleton (Alex). Also, we'll have a card that breaks down by region of job and student's region:

  10. **Northeast college seniors offered a job in Chicago**: 40% accept (because of the distance).

  But note: We want to show that even the more specific class (e.g., card 9) can be challenged by an even narrower one that we don't have data for, or by a different breakdown.

  Rules and Scoring:

  We will frame it as a game: "We are going to predict the outcome for Alex. The closer your probability estimate is to the 'true' probability, the more points you get. But note: we don't know what Alex will do until after the activity, so we will use the class data as the 'true' probability for scoring. However, we will reveal that we have data for multiple groups, and we will score you based on the group you chose and the data we have for that group."

  But wait: We want to create a conflict. So we will score them in two rounds:

  - Round 1: They write down their estimate and the reference class. We then reveal the data for the reference class they named. If they named a class for which we have data, we compare their estimate to that data. (But note: we have pre-prepared data for common classes, and if they name a class we don't have, we might have to improvise or say we don't have that data and they get zero? That might be messy.)

  Alternative plan: We don't score by the actual data but by how well they can justify their reference class? That might not work.

  Revised plan for scoring: We tell them that we have collected data from a large survey, and we have broken it down by several factors. We will reveal the data for the class they chose, and they get points based on how close their estimate is to the data for that class. But then we reveal that the same case can be assigned to multiple classes with different data.

  Timeline (90 minutes):

  1. Introduction (5 minutes):
     - Explain the game: "Today we are going to practice making probabilistic predictions about a single case. We have a scenario about Alex. Your task is to predict the chance that Alex will accept the job. You will write down your prediction and the group of people you based it on. Then we'll see how well you did."

  2. Individual commitment (10 minutes):
     - Hand out the scenario and the worksheet.
     - Worksheet asks:
          - What is the probability that Alex will accept the job? (0-100%)
          - What group of people did you use to base this estimate? (Describe the group: e.g., "college seniors", "English majors", etc.)
     - Emphasize: Be specific about the group. They must write both.

  3. Collect and tabulate (5 minutes):
     - Collect the worksheets. While they are doing something else (like a quick discussion in pairs about why they chose that group), you quickly tabulate the reference classes they used and note the diversity.

  4. Reveal data for their chosen classes (15 minutes):
     - For each reference class that was named by at least one student, reveal the data we have for that class (if we have it). If we don't have it, we say: "We don't have data for that exact group, but we do have data for similar groups. Let's look at some of the groups we do have data for."
     - Project the data cards (or hand out a sheet) for the common classes. Include the ones we prepared.

  5. Scoring and first conflict (10 minutes):
     - For each student, if their chosen class is in the data, they get points based on how close their estimate was to the data for that class (e.g., 10 points if within 5%, 5 points if within 10%, 0 otherwise). But then note: two students who chose different classes might have both been "correct" for their class, but the classes have different probabilities. Ask: "So what is the probability for Alex? Is it 40% (all seniors) or 55% (English majors) or ...?"

  6. Introduce the rule: "narrowest relevant class" (10 minutes):
     - Present the rule: "One way to resolve this is to use the narrowest reference class for which we have data and that is relevant. So let's try that."
     - Ask: What is the narrowest class for which we have data? Look at the data cards. The narrowest we have is: "22-year-old English majors at liberal arts colleges in the Northeast offered a marketing job in Chicago" (58%). But then ask: Is this the narrowest possible? What about adding more factors? For example, we don't have data for "English majors who play the violin" or "who have a long-distance partner", etc. Also, note that we have a card that breaks down by region: if we consider the interaction of region and job location, we get 40% (for Northeast seniors offered a job in Chicago). So which one is the narrowest? The one with 58% or the one with 40%? (This is where we show that the rule is ambiguous.)

  7. Small group activity: Challenge the narrowest class (15 minutes):
     - Break into 3-4 small groups (3-4 students each). Give each group a task: "Take the narrowest class we have (the 58% class). Your task is to argue that this class is not narrow enough. Identify at least one additional factor that might be relevant and that, if we had data on it, might change the probability. Also, identify one factor that might have been included but isn't relevant and should be excluded. Then, we will also challenge by noting that we have a different breakdown (the region-card) that yields 40% and that is also narrow. Which one should we use?"

  8. Group reports and regression (10 minutes):
     - Each group reports. They will likely suggest factors (e.g., Alex's financial situation, whether Alex has a partner, etc.). Point out that if we keep adding factors, we eventually get to a class of one (Alex). And then what? We don't have data for Alex alone. Also, note that the two narrow classes we have (58% and 40%) are both narrow but yield very different numbers. Why? Because they are narrow in different ways (one includes job type and the other includes the interaction of student region and job region). So the rule doesn't tell us which narrow class to pick.

  9. Debrief (10 minutes):
     - Map the experience to the concepts:
          a. Frequency interpretation: Probabilities are about classes, not individuals. (They saw that their number came from a class they chose.)
          b. Single-case problem: When we apply a class probability to an individual, we have to choose a class. (They did that without realizing it at first.)
          c. Statistical relevance and the narrowest-class rule: They tried that and it either regressed (to the singleton) or halted arbitrarily (at a class that might be irrelevant in some other way or that conflicted with another narrow class).
          d. Subjectivist retreat: In the end, without a clear objective class, the probability becomes a degree of belief. (They might have started with a class that felt salient to them, which is subjective.)

     - What the activity earned:
          - The necessity of a reference class for frequency probabilities.
          - The arbitrariness in choosing the class (they saw the variation in the class choices and the resulting probabilities).
          - The failure of the narrowest-class rule to provide a unique, non-arbitrary answer.

     - What you have to add by talking:
          - The positive proposals: e.g., the subjectivist view (Bayesian) that probability is degree of belief, or the propensity interpretation (which tries to assign a chance to the individual). Also, the metaphysical question: Is there a fact of the matter about Alex's chance? (The activity doesn't answer that.)

  10. Concluding remarks (5 minutes): Summarize the problem and note that this is a fundamental issue in probability and statistics, especially for single-case predictions. Mention that in actuarial science (like your friend) they use reference classes but must deal with this problem.

  Predictable problems and how to handle them:

  1. **Students litigate the base rates instead of the choice of class**: They might argue about the data on the cards. To prevent this, say: "The data on the cards are given; we are going to take them as accurate for this exercise. We are focusing on which data to use for Alex."

  2. **Refuse to commit to a single number**: Emphasize that in the first step, they must pick one number and one class. Encourage them to go with their gut.

  3. **Scoring makes them think the number is being graded**: Make clear that the scoring is based on matching the data for the class they chose, so it's about their choice of class and the number they assigned to that class. But then when we reveal multiple classes, we can say: "Notice that if you had chosen a different class, you would have gotten a different score. But the actual outcome for Alex is fixed. So which class is the right one for Alex?"

  4. **They might not name a reference class in the way we want**: The worksheet must be clear: "What group of people did you use to base this estimate?" and give examples. If they write vague things, during tabulation you can ask them to clarify.

  5. **Time management**: The timeline is tight. Be strict on time. Have the data cards ready to go. Skip some group reports if needed.

  What the activity cannot reproduce:

  - The positive proposals (subjectivist or propensity interpretations) and the metaphysical debate about single-case chances. You will have to explain these after the activity.

  - The full depth of the actuarial response (your friend's view) that in practice they use the narrowest relevant class with sufficient data. The activity shows the arbitrariness, but not the practical resolution. You can mention that in practice, actuaries use classes that are both relevant and have enough data, which is a trade-off.

  Final note: The surprise moment is when they see that different students, using different classes, have different probabilities and that they are all "correct" for their class. Then when they try to narrow down, they see that there are multiple ways to narrow and that it leads to a dead end.

  Good luck! This should make the problem vivid.
answer: |-
  ### Classroom Activity: "The Probability Prediction Game"  
  **Objective:** Stage the reference class problem to help students discover:  
  1. Probability assignments for single cases depend on a chosen reference class.  
  2. Alternative reference classes yield materially different probabilities.  
  3. The "narrowest relevant class" rule either regresses infinitely or halts arbitrarily.  

  **Materials:**  
  - **Scenario Handout** (one per student):  
    > **Case:** Taylor is a 28-year-old data scientist living in Austin, Texas. They work remotely for a tech startup, have a master's degree in computer science, and enjoy rock climbing. Taylor is deciding whether to quit their job within the next year to travel the world. What is the probability that Taylor will quit to travel?  

    *(Rationale: This scenario includes multiple attributes (age, job, education, hobby, location) that can form reference classes. It avoids sensitive topics and is relatable for students.)*  
  - **Worksheet** (one per student):  
    > Part 1: Estimate the probability (0-100%) that Taylor will quit to travel.  
    > Part 2: What group of people did you use to base this estimate? (e.g., "remote workers," "data scientists," "people with master's degrees").  
    > *(Do not define "reference class"—use neutral language like "group of people" to obscure the key variable.)*  
  - **Data Cards** (for facilitator; reveal during activity):  
    - Card 1: All remote workers → 20% quit to travel.  
    - Card 2: Data scientists → 15% quit to travel.  
    - Card 3: People aged 25-30 → 25% quit to travel.  
    - Card 4: People with master’s degrees → 10% quit to travel.  
    - Card 5: Rock climbers → 35% quit to travel.  
    - Card 6: Austin residents → 30% quit to travel.  
    - Card 7: Data scientists aged 25-30 → 22% quit to travel.  
    - Card 8: Remote workers who rock climb → 40% quit to travel.  
    - Card 9: Austin-based remote workers → 28% quit to travel.  
    - *(Include classes of varying specificity; ensure probabilities conflict, e.g., "rock climbers" vs. "data scientists").*  
  - **Whiteboard/Projector:** To display student estimates and data cards.  
  - **Timer:** For strict timekeeping.  

  **Timeline (90 Minutes):**  
  **Goal:** Students commit to a probability/class early, then discover conflicts organically.  

  #### **Phase 1: Commitment (15 minutes)**  
  - **Setup (5 min):**  
    - Introduce the game as a "real-world prediction challenge": *"We often predict individual behavior using group data. Today, you’ll estimate the chance Taylor quits to travel. Your score depends on how well your estimate matches real-world data for your chosen group."*  
    - Distribute scenario and worksheet. Emphasize: *"You must pick one probability and one group. Write them privately—no discussion yet."*  
  - **Student Work (10 min):**  
    - Students complete Part 1 (probability) and Part 2 (group) individually.  
    - **Inducing Class Choice Without Noticing:** Frame Part 2 as "context for your estimate" (e.g., *"What group does Taylor belong to that helped you decide?"*). Students will default to a salient class (e.g., "data scientists" or "rock climbers") without realizing it’s a philosophical choice.  
    - **Facilitator Moves:**  
      - Walk around to ensure everyone commits to one number and one group.  
      - If students resist (e.g., "It depends"), say: *"Base it on your best guess—use a group that feels right."*  

  #### **Phase 2: Reveal and First Conflict (25 minutes)**  
  - **Collect and Display (5 min):**  
    - Collect worksheets. On the board, create two columns:  
      - **"Probability"**: List all estimates (e.g., 15%, 35%, 20%).  
      - **"Group"**: List corresponding groups (e.g., "data scientists," "rock climbers").  
    - *Do not comment on variations yet.*  
  - **Reveal Data Cards (15 min):**  
    - Say: *"I have real data for some groups. If your group matches a card, we’ll score you."*  
    - Display data cards one by one. For each:  
      - Ask: *"Who picked this group?"* Highlight matches on the board.  
      - **Example conflict:** A student who chose "data scientists" (15%) sees a peer chose "rock climbers" (35%)—both "valid" per the cards.  
    - **Scoring (5 min):**  
      - Award "points" for estimates within 5% of the card’s probability (e.g., 10 points for close, 5 for within 10%).  
      - *Purpose: Make students feel invested, then reveal contradictions.*  
  - **Facilitator Moves:**  
    - If students question data accuracy: *"Take the cards as given—we’re testing your group choice, not the data."*  
    - If they debate base rates: *"Hold that thought—we’ll discuss after scoring."*  

  #### **Phase 3: Narrowest-Class Rule and Regression (25 minutes)**  
  - **Introduce the Rule (5 min):**  
    - Say: *"To resolve disagreements, experts use the 'narrowest relevant class'—the smallest group tied to the outcome. Let’s apply this."*  
    - Ask: *"What’s the narrowest group for Taylor? Suggest one, and we’ll see if we have data."*  
  - **Small-Group Activity (10 min):**  
    - Split into groups of 3–4. Task: *"Propose the narrowest relevant class for Taylor. Be specific—use at least two attributes (e.g., ‘data scientists who rock climb’)."*  
    - Groups report proposals (e.g., "28-year-old remote workers").  
  - **Regress and Stall (10 min):**  
    - Reveal conflicting cards for "narrow" classes:  
      - Card 7 (data scientists aged 25-30 → 22%) vs. Card 8 (remote workers who rock climb → 40%).  
      - Ask: *"Which is narrower? Which is more relevant?"*  
    - Push regression: *"What if we add Taylor’s hobby or location? Do we have data for ‘28-year-old Austin data scientists who rock climb’?"*  
      - Show no card exists. Ask: *"Should we keep narrowing? Where do we stop?"*  
    - **Reveal the singleton:** *"The narrowest possible class is Taylor alone. But what’s the probability then? 0% or 100%? Does that help us predict?"*  
  - **Facilitator Moves:**  
    - If groups avoid specificity: *"Add one more attribute to make it narrower."*  
    - If they halt arbitrarily (e.g., "stop at age and job"): *"Why not include rock climbing? It’s in the scenario."*  

  #### **Phase 4: Debrief and Connect (25 minutes)**  
  - **Reflection (10 min):**  
    - Students free-write: *"What frustrated you? Did your probability feel ‘fixed’ or dependent on something?"*  
  - **Map to Philosophy (15 min):**  
    - Use student quotes to unpack the problem:  
      | **Stage** | **What Happened** | **Philosophical Concept** |  
      |-----------|-------------------|---------------------------|  
      | Commitment | Chose a group/probability intuitively | **Frequency interpretation**: Probabilities require a reference class. |  
      | Reveal | Different groups → different probabilities | **Single-case problem**: No unique probability for Taylor; it’s class-relative. |  
      | Narrowest-Class | Regression to singleton or arbitrary halt | **Statistical relevance rule fails**: No non-arbitrary stopping point. |  
      | Frustration | "My number felt right until I saw other options" | **Subjectivist retreat**: Probability reflects degree of belief, not fact. |  
    - **What the Activity Earns:**  
      - Students experience the need for a reference class.  
      - They see material differences from alternative classes.  
      - They discover the narrowest-class rule’s failure (regression/arbitrariness).  
    - **What You Must Add:**  
      - **Positive proposals**: Explain the subjectivist view (probability = rational degree of belief) and frequentist workarounds (e.g., "largest homogeneous class").  
      - **Metaphysical gap**: Clarify that the activity doesn’t resolve if single-case chances "exist"—it only shows the problem. Say: *"Your friend sees probability as a fact about Taylor; you see it as class-dependent. This is the core dispute."*  

  ---  
  ### **Predictable Problems and Fixes**  
  1. **Litigating Base Rates**  
     - *Risk:* Students fixate on disputing data cards (e.g., "Rock climbers wouldn’t quit that much!").  
     - *Fix:* Preempt with: *"The data is hypothetical but fixed. Focus on which group you use."* If it arises, say: *"Interesting! But for now, let’s see how the group choice changes your estimate."*  

  2. **Refusing to Commit to One Number/Class**  
     - *Risk:* Students write ranges (e.g., "20–40%") or multiple groups.  
     - *Fix:* In Phase 1, insist: *"Pick one number and group—this is a snapshot of your best guess."* Collect worksheets quickly to prevent revisions.  

  3. **Misinterpreting Scoring**  
     - *Risk:* Students think high points = "correct" probability.  
     - *Fix:* During scoring, say: *"Points show if you matched data for your group—not if your group was ‘right’ for Taylor."* In debrief, contrast scores across groups (e.g., "Both got points, but probabilities differ").  

  4. **Early Collapse**  
     - *Risk:* A student identifies the reference class problem prematurely.  
     - *Fix:* If spotted early, acknowledge vaguely: *"Note that down—we’ll revisit later."* Use their insight in Phase 3 to deepen regression.  

  ### **What the Activity Cannot Reproduce**  
  - **Positive Proposals:** The activity discredits the narrowest-class rule but cannot model solutions (e.g., Bayesian degrees of belief or propensity theories). You must add:  
    - *"Subjectivists say your initial probability reflected your beliefs. Frequentists might use ‘pragmatic’ classes with sufficient data."*  
  - **Metaphysical Question:** Students will experience the problem but not engage whether single-case chances exist. You must add:  
    - *"Is there a fact about Taylor’s chance, or is it always relative to a class? This is unsettled—your friend’s view vs. yours."*  
  - **Actuarial Nuance:** The activity oversimplifies "relevance." Clarify: *"In practice, experts use classes with statistical significance, but that’s a practical fix, not a philosophical solution."*  

  **Final Note:** The activity’s power is in the **surprise** when alternative classes are revealed (Phase 2) and the **frustration** during regression (Phase 3). By the end, students will viscerally grasp the problem—you then contextualize it philosophically. Run it as a fast-paced game, and let their emotions drive the lesson.
