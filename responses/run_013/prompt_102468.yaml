prompt: |-
  I am assembling the requirements for a theory of inference to the best explanation before I evaluate any particular version of it, and I would like the specification itself to be usable. The purpose that fixes adequacy is this: I am building a system that, given a set of rival hypotheses and a body of evidence, must both rank the hypotheses by the quality of explanation each would supply and return a separate verdict on whether the top-ranked hypothesis is good enough to be believed. A theory of inference to the best explanation is adequate for me, therefore, only if it can be converted into such a rule; a formulation that says no more than that the best explanation is the one that explains best will not count.

  Give me the desiderata. For each requirement, state the case or consideration that motivates it, and say whether it is non-negotiable or merely the preference of one camp. Among the things I want the list to cover:

  Cases the theory must get right. (i) A case in which the best of the available explanations is still poor, so that ranking and believing come apart — the theory must say what the threshold is and why, not merely who wins. (ii) A case in which the two leading explanations are not rivals and may both be true, or in which the truth is a conjunction of them. (iii) A case in which the correct explanation appeals to a mechanism no one has formulated, so that it is not among the candidates at all. (iv) A case in which the explanation is a model or a simulation rather than a statement of law, and a case in which what is explained is the absence of an event. (v) The case of explaining why a body of successful theory works as well as it does.

  Distinctions it must respect: between the quality of an explanation and its prior and posterior probability; between explaining a particular event and explaining a regularity; between the explanation likeliest to be true and the one most satisfying to a mind like ours; and between explanatory power and such further virtues as simplicity or unification, with a view on whether the latter are independent of the former or reducible to it.

  Constraints it must not violate: it must not earn its verdict by consulting which hypothesis is in fact true; it must not be circular, in the sense of letting a hypothesis's own explanatory appeal raise the very credence that is supposed to license accepting it; and it must not turn out to be ordinary probabilistic updating with the explanatory vocabulary left on as decoration, nor so distinct from probabilistic updating that the two can return incompatible verdicts.

  Then, having given the list: identify any subset of requirements that cannot be jointly satisfied, and say which member of the subset you would abandon; name the single requirement that eliminates the most candidate theories, and explain why it does so much work; and in one short paragraph, without extended scoring, indicate how the main families of account — explanatory-virtue accounts, probabilistic accounts, and accounts that treat explanation as a merely pragmatic matter — fare against the list. Keep the weight on the criteria and their motivating cases rather than on the verdicts, since it is the criteria I most need and I will do the judging in my own time. A numbered list is fine.
reasoning: |-
  Hmm, this user is clearly building something rigorous – probably an AI system for scientific or diagnostic reasoning given the emphasis on ranking hypotheses and thresholding belief. They're at the requirements-gathering stage and want bulletproof criteria before evaluating IBE theories. Smart approach.

  The depth of their cases suggests they've encountered real-world limitations of existing IBE frameworks. That case about unformulated mechanisms (iii) feels particularly pointed – they've likely seen explanations fail because the true cause wasn't even in the hypothesis space. And demanding a threshold condition (i) means they need actionable outputs, not just academic rankings.

  Noticing they deliberately avoid wanting verdicts on existing theories. This isn't about shortcuts; they want to stress-test frameworks themselves. The rigor in listing constraints (no circularity, no cheating by knowing the truth) implies they've seen sloppy implementations before. 

  The hardest trade-offs will be:
  - Requiring both probabilistic coherence AND irreducibility to pure Bayes (last constraint) – many theories fail this knife-edge
  - Threshold-setting (i) without resorting to arbitrariness
  - Handling conjunctive truths (ii) while maintaining discriminative ranking

  The "mechanism not formulated" case (iii) is probably the heaviest lift. Most IBEs assume a closed hypothesis set. Tackling this might require building in abductive leaps or generative components beyond standard IBE. 

  For the "single requirement that eliminates most theories", probabilistic coherence is the killer. So many virtue-based accounts (like Lipton's) become decorative when you press on how virtues translate to credence. And pragmatic accounts (van Fraassen) actively reject such coherence.

  Briefly on theory families:
  - Virtue accounts (Salmon, Kitcher) will struggle with thresholds and conjunctive truths
  - Probabilistic accounts (Okasha) might reduce explanation to decoration
  - Pragmatic accounts (Achinstein) fail almost all constraints by design

  Should emphasize that the "explaining absence" case (iv) isn't just pedantic – it's crucial for applications like fault diagnosis or security threat analysis where non-events matter.
answer: |-
  Here is a structured set of desiderata for your theory of Inference to the Best Explanation (IBE), motivated by your specified purpose and cases. Each requirement is annotated with its motivation and negotiability status. Following the list, key implications are addressed.

  ### Desiderata for an Adequate IBE Theory
  1. **Threshold for Belief**  
     *Motivation*: Case (i) demands that the theory distinguishes between "best available" and "good enough to believe" (e.g., ranking two weak medical hypotheses but withholding belief in both). Requires a non-arbitrary threshold (e.g., explanatory power exceeding a context-dependent minimum).  
     *Negotiability*: **Non-negotiable** (core to your system’s output).  

  2. **Non-Rivalrous/Conjunctive Hypotheses**  
     *Motivation*: Case (ii) requires handling hypotheses that are compatible or conjunctively true (e.g., "smoking + genetics" explaining cancer). The theory must rank without falsely treating them as mutually exclusive.  
     *Negotiability*: **Non-negotiable** (avoids forcing artificial competition).  

  3. **Open Hypothesis Space**  
     *Motivation*: Case (iii) necessitates acknowledging that the true explanation may be absent from the candidate set (e.g., dark matter not yet hypothesized). The theory must not *require* the true explanation to be included for meaningful ranking.  
     *Negotiability*: **Non-negotiable** (prevents false confidence in limited sets).  

  4. **Explanation-Type Flexibility**  
     *Motivation*: Case (iv) requires accommodating non-lawlike explanations (e.g., agent-based simulations explaining market crashes) and explanations of absences (e.g., "no fire due to sprinklers").  
     *Negotiability*: **Preference** (but critical for real-world applicability).  

  5. **Meta-Explanatory Capacity**  
     *Motivation*: Case (v) demands explaining *why* a theory is successful (e.g., "QM works because it quantizes energy"). The theory must handle explanatory targets beyond empirical data.  
     *Negotiability*: **Preference** (adds depth but may be omitted in simpler systems).  

  6. **Explanation vs. Probability Distinction**  
     *Motivation*: Must separate *explanatory quality* (e.g., mechanism coherence) from prior/posterior probabilities (e.g., avoiding conflating Bayes factors with "understanding").  
     *Negotiability*: **Non-negotiable** (prevents IBE from collapsing into Bayes).  

  7. **Particulars vs. Regularities**  
     *Motivation*: Requires different treatment for explaining single events (e.g., a specific eclipse) vs. general patterns (e.g., orbital mechanics).  
     *Negotiability*: **Preference** (but essential for domain-agnosticism).  

  8. **Truth-Likelihood vs. Psychological Satisfaction**  
     *Motivation*: Must prioritize objective likelihood over "intuitive appeal" (e.g., rejecting a satisfying vitalism in favor of biochemical mechanisms).  
     *Negotiability*: **Non-negotiable** (avoids anthropocentric bias).  

  9. **Explanatory Power ≠ Auxiliary Virtues**  
     *Motivation*: Requires clarifying whether simplicity/unification *constitute* explanatory power or are independent (e.g., is Occam’s razor explanatory or pragmatic?).  
     *Negotiability*: **Preference** (theories vary; your system needs explicit positioning).  

  10. **Non-Circularity**  
      *Motivation*: The hypothesis’s explanatory appeal cannot bootstrap its own credence (e.g., "God explains creation because God exists" is invalid).  
      *Negotiability*: **Non-negotiable** (logical necessity).  

  11. **Truth-Blindness**  
      *Motivation*: The rule cannot consult the *actual truth* of hypotheses (e.g., in a simulation, "correct" answers must be inaccessible).  
      *Negotiability*: **Non-negotiable** (operational requirement).  

  12. **Probabilistic Coherence Without Reduction**  
      *Motivation*: Must align with probability theory (no incompatible verdicts with Bayes) but not reduce to it (e.g., explanatory virtues must add value beyond likelihoods).  
      *Negotiability*: **Non-negotiable** (avoids inconsistency or redundancy).  

  ---

  ### Key Implications of the Desiderata
  **Jointly Unsatisfiable Requirements**:  
  - (3) *Open Hypothesis Space* + (1) *Threshold for Belief* + (12) *Probabilistic Coherence* conflict. If the true explanation is absent (3), the "best" candidate may still fall below the belief threshold (1), but probabilistic coherence (12) demands that the *actual* best explanation (if included) would dominate. **Resolution**: Prioritize (3) and (1), relaxing strict probabilistic coherence to allow "best-of-flawed-set" judgments.  

  **Highest-Impact Requirement**:  
  - **(12) Probabilistic Coherence Without Reduction** eliminates the most candidates. It requires IBE to be *distinct yet compatible* with Bayesian updating. Virtue-based accounts (e.g., Lipton’s loveliness) often violate coherence; probabilistic accounts (e.g., Douven’s IBE-Bayes hybrids) risk reductionism. This constraint forces a precise account of how explanation supplements probability.  

  **Theory Families Against the List**:  
  - **Explanatory-Virtue Accounts** (e.g., Kitcher, Salmon): Strong on (4), (5), (9); weak on (6), (8), (12) (often conflate virtues with probabilities or ignore coherence).  
  - **Probabilistic Accounts** (e.g., Okasha, McGrew): Excel at (6), (12); fail (1), (3), (9) (thresholds are arbitrary, hypothesis spaces closed, virtues reduced to probabilities).  
  - **Pragmatic Accounts** (e.g., van Fraassen): Satisfy (3), (4); reject (1), (6), (8), (12) (deny objective explanatory ranking, prioritizing context over truth).  

  This framework prioritizes operationalizability, truth-tracking, and versatility. Use it to test theories against your edge cases (e.g., run a conjunctive-truth scenario through a candidate IBE rule to see if it forces a false choice).
