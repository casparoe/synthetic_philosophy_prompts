  Right then, let's sort this civic tangle for your board. Based on their six rulings, we need to find the buried rules and see how they apply to Dr. Sanatorium-and-Sterilisation's health centre. Here’s the breakdown, written proper:

  **The Board's Buried Rules (As Inferred from Decisions 1-6):**

  1.  **Site-Specific Harm Trumps All:** If the memorial *physically occupies the exact location* where significant harm associated with the honouree occurred (Decision 1: statue at the works corner; Decision 6: square outside the board building), removal or significant alteration (renaming + plaque) is the likely outcome, especially with victim advocacy.
  2.  **Commemorative Focus Matters:** What is the memorial *primarily honouring*?
      *   If it honours a *specific, tangible gift or act for the city* (Decision 4: the fountain as a gift; implicitly Decision 5: death in service), the personal failings of the giver/individual are largely irrelevant. The memorial stands for the thing given or the sacrifice made.
      *   If it honours *the person themselves* (Decision 2: novelist; Decision 3: poet; Decision 6: doctor), their personal conduct becomes highly relevant.
  3.  **Victim Advocacy & Direct Harm:** Active campaigning by groups representing the *direct victims* of the honouree's actions carries significant weight (Decision 1: families of shot strikers; Decision 6: implied survivors of sterilisation). However, it's not absolute (Decision 2: families objected but name stayed with plaque; Decision 3: families ignored).
  4.  **Contextualisation vs. Removal:** For problematic figures *not* covered by Rule 1 (Site-Specific Harm), the preference is for contextualisation (plaque, museum display) rather than outright erasure, *unless* the commemorative focus on the *person* is too strong and the harm too severe/directly perpetrated (Decision 6 vs. Decision 2).
  5.  **Institutional Purpose Has Weight:** The primary function of the *building* bearing the name influences the decision. A school's purpose (education) argues against turning it into a moral court (Decision 3). A war memorial's purpose (honouring the war dead) supersedes judging individual character post-war (Decision 5).

  **Applying the Rules to Decision 7: The Health Centre**

  *   **Site-Specific Harm?** No. The health centre is *not* on the site of the old institution or the MOH office where the sterilisation program was run (that's a retail park now). Rule 1 does *not* apply. This distinguishes it sharply from Decisions 1 and 6.
  *   **Commemorative Focus?** The building is named *after the man*, "Dr. X Health Centre". It honours *him* as MOH. Rule 2b applies (like Decision 2, Decision 3, Decision 6). It's not primarily honouring a specific gift (like the fountain) or an act of sacrifice (like the war dead).
  *   **Victim Advocacy?** Yes. A survivors' group is actively campaigning. Rule 3 applies, giving weight to removal/change.
  *   **Severity & Directness of Harm?** High. Running a compulsory sterilisation program is state-sanctioned eugenics, causing profound, lifelong harm to identifiable individuals. This aligns with the severity in Decision 6 (same program) and exceeds the personal misconduct in Decisions 2 and 3.
  *   **Institutional Purpose?** It's a *health centre*. Its purpose is providing healthcare. Having it named after someone who used his medical authority to inflict harm on vulnerable populations is deeply incongruous and potentially distressing. This argues *against* retention (unlike the school in Decision 3, where the incongruity was deemed less relevant to the institution's function).
  *   **The "Plinth Forgets, Vitrine Remembers" Character:** This principle favours *contextualisation* over removal *unless* the memorial itself is part of the harm (Rule 1). Since Rule 1 doesn't apply here, this character would likely argue for a plaque, not removal. The name *is* the "plinth" – simple honouring. Adding context (the "vitrine" element) could be seen as sufficient.
  *   **The "50-Year Leasehold" Character:** Unless the name is periodically reaffirmed, it expires. The name likely dates back to the 1930s/40s – easily over 50 years. By this rule, it should lapse unless specifically renewed. The board hasn't used this principle *explicitly* yet.

  **Predictions Based on Each Precedent:**

  *   **Decision 1 (Statue):** Predicts **REMOVAL** (Site-Specific Harm + Victim Advocacy). But... site-specific harm is absent here. So, **Not a Direct Match**.
  *   **Decision 2 (Novelist Street):** Predicts **RETAIN WITH PLAQUE** (Honours person, victim advocacy present but outweighed? Contextualisation chosen). *Closest Analog on surface*, but severity of harm is arguably less than eugenics.
  *   **Decision 3 (Poet School):** Predicts **RETAIN UNCHANGED** (Institution purpose trumps personal conduct, victim advocacy ignored). But health centre purpose *conflicts* with honouree's harm, unlike the school.
  *   **Decision 4 (Mill Owner Fountain):** Predicts **RETAIN UNCHANGED** (Honours the *gift*, not the giver). Not analogous – health centre honours the *man*.
  *   **Decision 5 (War Memorial):** Predicts **RETAIN UNCHANGED** (Honours death in service, purpose trumps character). Not analogous.
  *   **Decision 6 (Doctor Square):** Predicts **REMOVAL/RENAME + PLAQUE** (Honours person + Site-Specific Harm + Severe Harm + Victim Advocacy). Site-Specific Harm is the *crucial difference*.

  **The Closest Analog:** **Decision 2 (Novelist Street)**. Both involve:
  *   A public naming honouring an individual.
  *   Serious personal misconduct causing harm to identifiable groups.
  *   Active campaigning by groups connected to the harm (families/survivors).
  *   No direct site-specific harm link for the memorial itself.
  Decision 2 resulted in retention with contextualisation (plaque).

  **What the Board *Should* Do for Consistency (Based on Precedents):** If strictly adhering to the established pattern, particularly the lack of Site-Specific Harm (Rule 1) and the preference for contextualisation over removal when Rule 1 doesn't apply (as in Decision 2), they should **RETAIN THE NAME BUT ADD A PROMINENT PLAQUE CONTEXTUALISING HIS RECORD**, including the sterilisation program and the survivors' experiences. This follows Decision 2 most directly.

  **What Rule They'd Be Adopting:** By choosing this, they'd solidify: **"For memorials honouring individuals with significant personal misconduct not physically tied to the site of their harm, contextualisation (plaque) is preferred over removal, unless the commemorative act itself is fundamentally incompatible with the location's current purpose or the severity demands otherwise."** They'd be prioritising Rule 4 (Contextualisation) and Rule 2b (Honouring the Person), while noting Rule 3 (Victim Advocacy) is addressed *through* the plaque.

  **But... The Stronger Case (and Potential Inconsistency):** The *severity* of the harm (eugenics), its direct link to his *professional role* (MOH), and the profound *incongruity* of a *health centre* bearing his name argue powerfully for **RENAMING** (following the *spirit* of Decision 6, even without site-specific harm). If they choose this, they'd be adopting: **"The nature of the harm perpetrated using the honouree's official position, and the fundamental conflict with the institution's current ethical purpose, can override the absence of site-specific harm and necessitate removal, even if contextualisation is the norm."** This elevates Rule 5 (Institutional Purpose) and the *nature* of the harm within Rule 2b to decisive factors.

  **Forcing the Choice - The Next Case:** To force the board to choose between these two principles (Contextualisation vs. Removal based on Harm Severity/Institutional Incongruity), present a case where:
  *   **Rule 1 (Site-Specific Harm) is ABSENT.**
  *   **Rule 2b (Honouring the Person) applies.**
  *   **Rule 3 (Victim Advocacy) is PRESENT.**
  *   **The Harm is EXTREME and DIRECTLY PERPETRATED BY THE HONOUREE IN THEIR OFFICIAL CAPACITY.**
  *   **The Institution's CURRENT PURPOSE IS DEEPLY INCONGRUOUS with the harm.**
  *   ...but where contextualisation *seems* technically possible.

  **The Case:** A **public library** named after a prominent 19th-century **philanthropist and councillor**, celebrated for donating the land and seed money. However, newly surfaced archives prove he used his political influence to **ruthlessly clear slum housing** (displacing thousands of the poor without adequate provision) specifically to *increase the value of his adjacent landholdings*, part of which became the library site. A housing/homelessness charity, backed by historians, campaigns for renaming, arguing the library symbolises his callous social cleansing. The library trust argues the name honours the gift, not the man, and his other charitable works were genuine. There's no plaque currently.

  *   **Why it forces the choice:** It perfectly mirrors the tension in the health centre case but amplifies it.
      *   *Like Health Centre:* Honours the person (name), severe harm in official capacity (social cleansing for profit), victim advocacy, institutional incongruity (library for knowledge/community vs. social destruction), no *direct* site harm (people weren't *killed* on that spot, just evicted nearby).
      *   *Amplification:* The land *is* directly connected to his harmful actions (profit motive), but not the *specific harm* (evictions happened elsewhere). The "gift" (Rule 2a?) is deeply tainted by its origins. Does Rule 4 (Contextualisation) suffice with a plaque? Or does the origin of the "gift," the severity, and the library's purpose demand removal (Rule 5 + Rule 2b severity), even without literal blood on the steps? The board must decide if the *tainted origin* of a "gift" and its link to the honouree's harmful actions warrant removal, forcing them to confront whether their principle is purely about *site-specific harm* or extends to *harm intrinsically linked to the benefit being commemorated*.

  **On Your Characters' Principles:**

  *   **"Plinth forgets and vitrine remembers":** This *is* arguably a core, unstated principle the board is leaning towards. The plinth (statue, simple name) is simple honouring – it "forgets" the bad. The vitrine (museum display, plaque) "remembers" the complexity. Decisions 1 (statue to museum), 2 (plaque), 4 (no plaque needed for gift), 5 (no plaque needed for war dead), and 6 (removal + plaque) can all be read through this lens. It explains retaining names/items *if* context can be added. The health centre would get a plaque (vitrine element added).
  *   **"Leasehold expiring after fifty years":** This principle *hasn't* been used yet. None of the decisions mention the age of the memorial as a factor. The board seems focused on ethical/historical arguments, not temporal ones. If applied, the health centre name would likely expire. To introduce this, your next case could involve a very old, largely forgotten name with minor controversy, forcing a vote on renewal.

  **Verdict for the Health Centre:** For strict consistency with *most* precedents (especially Decision 2), your board **retains the name but mandates a prominent, well-researched plaque at the entrance detailing his full record, including the sterilisation program and acknowledging the survivors.** This is the path of least resistance and fits "plinth forgets, vitrine remembers." However, it exposes an inconsistency with the *severity* principle implied by Decision 6 and ignores the health centre's purpose. The family trust's noise might tip the balance towards this outcome. If you want the board to grow a spine or face its contradictions, they **vote to rename the health centre, archive the old sign, and install an explanatory plaque.** This would mark a shift towards prioritising institutional ethics and the nature of the harm over the lack of site-specificity. The "leasehold" character would be furious they didn't use his rule! Good luck with the vote – sounds like a proper committee room bust-up is brewing.
