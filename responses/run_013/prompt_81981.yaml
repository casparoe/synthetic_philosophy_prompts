prompt: |-
  I teach a grad seminar on social choice and I'm tired of the Gibbard–Satterthwaite theorem being presented as "no non-dictatorial voting rule is strategy-proof, the end of the story." I want a worked example that makes the escape routes vivid, built to order.

  Give me an ordinary decision scenario — a departmental hiring committee, a housing co-op picking between three or more options, that kind of thing, nothing science-fictional — together with a mechanism that a smart person could genuinely believe is both strategy-proof and non-dictatorial. Then do the honest work: state the preferences, show that under them nobody gains by misreporting, show the mechanism isn't dictatorial, and then pin down exactly which hypothesis of the theorem the example drops (unrestricted domain, three or more outcomes, ordinal information, determinism — whatever it turns out to be) and how dropping it is what buys the escape.

  Actually give me two: one where the escape is a restriction on the preference domain, and one where it's something else entirely — and for the second, use lotteries or cardinal payoffs rather than money changing hands. For each case, tell me which single feature is load-baring, what collapses if I remove it, and how a GS loyalist would insist the example cheats. About a page per case, British spelling please.
reasoning: |-
  We are going to create two examples. The first one will escape the Gibbard-Satterthwaite theorem by restricting the domain of preferences. The second one will use lotteries (i.e. randomisation) to escape, which means we are dropping the requirement of determinism and moving to cardinal utilities.

  Let's start with the first example: a restriction on the preference domain.

  Example 1: Restricting the Domain to Single-Peaked Preferences

  Scenario: A housing co-op with three members (Alice, Bob, Charlie) is deciding on the temperature setting for their common room. The options are {Cold (C), Medium (M), Warm (W)}. We assume that each member has single-peaked preferences over the temperature, meaning that each has an ideal temperature and prefers temperatures closer to their ideal over those farther away.

  Mechanism: The median voting rule. Each voter reports their most preferred temperature (their peak). The rule then selects the median of the reported peaks.

  Preferences:
  - Alice: Ideal at Medium (M) -> M > C > W
  - Bob: Ideal at Warm (W) -> W > M > C
  - Charlie: Ideal at Cold (C) -> C > M > W

  Note: These preferences are single-peaked with respect to the ordering C < M < W.

  We show that the median rule is strategy-proof in this domain.

  Truthful reporting:
  - Alice reports M, Bob reports W, Charlie reports C.
  - The reports: {M, W, C}. Sorted: [C, M, W] -> median is M.
  - Outcome: M.

  Now, suppose Alice considers misreporting. If she reports C instead (to try to get a colder outcome?):
  - Reports: {C, W, C} -> sorted: [C, C, W] -> median is C.
  - Outcome: C. But Alice prefers M over C (since M is her peak and C is worse). So she gets a worse outcome.

  If Alice reports W:
  - Reports: {W, W, C} -> sorted: [C, W, W] -> median is W.
  - Outcome: W. But Alice prefers M over W (because M > W in her ranking). So again, worse.

  Similarly, Bob: 
  - Truthful: reports W -> outcome M (as above). Bob's ranking: W > M > C. So M is acceptable, but what if he misreports?
  - If Bob reports M: reports {M, M, C} -> median M. Outcome M. Same as truthful, no gain.
  - If Bob reports C: reports {M, C, C} -> median C. Outcome C. Bob prefers M over C (since M > C) and W over M. So he gets C which is worse than M (which he would have gotten truthfully) and much worse than W.

  Charlie:
  - Truthful: reports C -> outcome M. Charlie's ranking: C > M > W. So M is acceptable.
  - If Charlie reports M: reports {M, W, M} -> sorted: [M, M, W] -> median M. Same outcome.
  - If Charlie reports W: reports {M, W, W} -> sorted: [M, W, W] -> median W. Outcome W. Charlie prefers M over W (M > W) so this is worse.

  Thus, no one has an incentive to misreport. The mechanism is non-dictatorial because no single voter always gets their way. For instance, if all three reported differently, the median is the middle one. But if Alice and Bob both report W, then Charlie reports C: reports {W, W, C} -> median W. Then Bob and Alice are happy, but Charlie is not. So Bob and Alice together can force W, but individually they are not dictators.

  Now, what hypothesis of GS is dropped? The theorem assumes an unrestricted domain. Here we have restricted to single-peaked preferences. The median voting rule is strategy-proof and non-dictatorial on this restricted domain.

  A GS loyalist would say: "But in the real world, preferences might not be single-peaked. If we allow arbitrary preferences, then the median rule can be manipulated." For example, suppose we have a voter with preferences: W > C > M. Then in the scenario above, if the truthful peaks are C, M, W (yielding M), that voter (if they were Bob, for instance) might prefer to report C (if they can) to get C instead of M? But note: in our domain restriction, we assume single-peakedness, so the voter with W > C > M is not allowed. The loyalist would say that by restricting the domain, we are avoiding the full force of the theorem.

  Second example: Using lotteries (cardinal utilities) to escape.

  Scenario: The same housing co-op is now deciding on a movie to watch. There are three options: Comedy (C), Drama (D), Documentary (N). The committee has three members: Alice, Bob, Charlie. However, they are going to use a mechanism that outputs a lottery over the three options.

  Mechanism: The Random Dictator. Each voter reports their preference ordering. Then, one voter is chosen uniformly at random (each has probability 1/3) and the alternative that this voter ranks first is selected.

  We assume that voters have von Neumann-Morgenstern cardinal utilities. They evaluate lotteries by expected utility.

  Preferences and utilities:

  - Alice: u(C)=10, u(D)=5, u(N)=0. So she ranks C > D > N.
  - Bob: u(C)=0, u(D)=10, u(N)=5. So he ranks D > N > C.
  - Charlie: u(C)=5, u(D)=0, u(N)=10. So he ranks N > C > D.

  We show that it is a dominant strategy to report truthfully.

  Consider Alice. If she reports truthfully, then:
  - With probability 1/3, she is chosen and then C is selected -> she gets 10.
  - With probability 1/3, Bob is chosen -> then D is selected -> she gets 5.
  - With probability 1/3, Charlie is chosen -> then N is selected -> she gets 0.
  - Expected utility: (1/3)*10 + (1/3)*5 + (1/3)*0 = 15/3 = 5.

  Can Alice gain by misreporting? Suppose she reports a different order, say she reports D as first (to try to get a better outcome when she is not chosen?).

  If she reports [D, C, N] (so first choice D, then C, then N). Then:
  - If she is chosen (prob 1/3), then D is selected -> she gets 5.
  - If Bob is chosen (prob 1/3), Bob reports truthfully [D, N, C] so D is selected -> she gets 5.
  - If Charlie is chosen (prob 1/3), Charlie reports truthfully [N, C, D] so N is selected -> she gets 0.
  - Expected utility: (1/3)*5 + (1/3)*5 + (1/3)*0 = 10/3 ≈ 3.33, which is less than 5.

  Alternatively, if she reports [N, C, D]:
  - If she is chosen: N is selected -> utility 0.
  - Bob chosen: D -> 5.
  - Charlie chosen: N -> 0.
  - Expected utility: (1/3)*0 + (1/3)*5 + (1/3)*0 = 5/3 ≈ 1.67, worse.

  What if she reports [C, N, D]? That's the same as truthful in the first choice, so the outcome when she is chosen is the same. But when she is not chosen, the outcome depends on the others. Since the others report truthfully, it's the same as before. So expected utility remains 5.

  Similarly, Bob and Charlie.

  Bob, if truthful:
  - Alice chosen: C -> Bob gets 0.
  - Bob chosen: D -> 10.
  - Charlie chosen: N -> 5.
  - Expected: (1/3)*0 + (1/3)*10 + (1/3)*5 = 15/3 = 5.

  If Bob misreports, say he reports [N, D, C] (so first N, then D, then C). Then:
  - Alice chosen: C -> 0.
  - Bob chosen: N -> 5 (because he reports N first? But note: Bob's true utility for N is 5, but if he reports N first then when he is chosen they show N, so he gets 5. But he could have gotten 10 by reporting D first?).
  - Charlie chosen: N -> 5.
  - Expected: (1/3)*0 + (1/3)*5 + (1/3)*5 = 10/3 ≈ 3.33, which is less than 5.

  Alternatively, if Bob reports [D, C, N] (so same first choice as truthful) then it doesn't change.

  Charlie: truthful gives:
  - Alice: C -> Charlie gets 5.
  - Bob: D -> 0.
  - Charlie: N -> 10.
  - Expected: (1/3)*5 + (1/3)*0 + (1/3)*10 = 15/3 = 5.

  If Charlie misreports and says [C, N, D] (so first C, then N, then D). Then:
  - Alice: C -> 5.
  - Bob: D -> 0.
  - Charlie: C -> 5 (because he reports C first? But his true utility for C is 5, which is less than N which is 10. So when he is chosen, he gets 5 instead of 10).
  - Expected: (1/3)*5 + (1/3)*0 + (1/3)*5 = 10/3 ≈ 3.33, worse.

  Thus, in every case, misreporting does not help. So the random dictator mechanism is strategy-proof (in the sense of dominant strategies) when voters are expected utility maximisers.

  Is it non-dictatorial? Yes, because no single voter always gets their top choice. In fact, each voter's top choice is only selected when they are the randomly chosen dictator, which happens with probability 1/3.

  What hypothesis of GS is dropped? The theorem requires deterministic outcomes. Here we have a random mechanism. Also, note that the GS theorem is about ordinal preferences and deterministic rules. The random dictator mechanism is defined on cardinal utilities (via expected utility) and outputs lotteries.

  A GS loyalist would say: "But the voting rule is not deterministic. The Gibbard-Satterthwaite theorem applies only to deterministic voting rules. Moreover, the theorem assumes that voters only have ordinal preferences. In this mechanism, we are using cardinal utilities to evaluate lotteries, which goes beyond the ordinal framework."

  The load-bearing feature in the first example is the domain restriction (single-peakedness). If we remove that, then the median rule can be manipulated arbitrarily. In the second example, the load-bearing feature is the use of lotteries (and cardinal utilities). If we require a deterministic outcome and only ordinal preferences, then the random dictator mechanism would not be strategy-proof. For instance, in the random dictator, if we ask for only ordinal preferences and then use the random dictator to pick a lottery, but without cardinal utilities, the voters might not be able to compare lotteries. Moreover, if we make the rule deterministic by, say, always choosing the first choice of voter 1, then it becomes dictatorial.

  In summary:

  Example 1:
  - Scenario: Housing co-op choosing temperature (C, M, W) with single-peaked preferences.
  - Mechanism: Median voting rule.
  - Why strategy-proof? Because in single-peaked domains, the median rule is strategy-proof.
  - Why non-dictatorial? The median does not always coincide with one person's top.
  - Hypothesis dropped: Unrestricted domain.
  - Collapse if removed: Without single-peakedness, the median rule may be manipulable.

  Example 2:
  - Scenario: Housing co-op choosing a movie (C, D, N) with cardinal utilities.
  - Mechanism: Random dictator.
  - Why strategy-proof? Because with expected utility, truthful reporting is dominant.
  - Why non-dictatorial? Each voter only has a 1/3 chance of being decisive.
  - Hypothesis dropped: Determinism (and the theorem's reliance on ordinal preferences only).
  - Collapse if removed: If we require a deterministic outcome, then random dictator is not deterministic. If we remove cardinal utilities and ask for ordinal preferences, then voters might not be able to express their preferences over lotteries, and the mechanism would not be strategy-proof in the ordinal sense (because without cardinal utilities, we cannot compute expected utility).

  British spelling note: We have used "co-op" (which is standard) and other British spellings are not particularly different in this context. We have used "mechanism", "preferences", etc., which are the same. If there were any -ize/-ise words, we would use -ise, but this text avoids such words.

  Thus, we have two escape routes: domain restriction and randomisation (with cardinal utilities).
answer: |-
  ### Escape Routes from Gibbard–Satterthwaite: Two Worked Examples

  #### Example 1: Domain Restriction to Single-Peaked Preferences  
  **Scenario:** A university departmental hiring committee must choose between three candidates for a lectureship: Candidate A (theoretical specialist), Candidate B (balanced profile), and Candidate C (applied specialist). The committee has three members: Xanthe (a theorist), Yvonne (an applied researcher), and Zane (a departmental head seeking balance). Preferences are *single-peaked* along a left–right spectrum: A (left), B (centre), C (right). Each member has an ideal point and dislikes options farther from it.  

  **Preferences (ranked best to worst):**  
  - Xanthe: A ≻ B ≻ C (ideal: A)  
  - Yvonne: C ≻ B ≻ A (ideal: C)  
  - Zane: B ≻ A ≻ C (ideal: B)  

  **Mechanism:** The **median voter rule**. Each member reports their ideal candidate. The rule selects the candidate whose position is the median of the reported ideals (ordering: A < B < C).  

  **Truthful Reporting Outcome:**  
  - Reports: Xanthe (A), Yvonne (C), Zane (B).  
  - Ordered ideals: A, B, C → median = B.  
  - Outcome: B (Zane’s ideal, acceptable to all).  

  **Strategy-Proofness Check:**  
  - *Xanthe*: If she misreports C (aiming to shift the median rightward), reports become C, C, B → median = C. Outcome: C (Xanthe’s worst). Truthful reporting yields B ≻ C, so no gain.  
  - *Yvonne*: If she misreports A, reports become A, A, B → median = A. Outcome: A (Yvonne’s worst). Truthful yields B ≻ A.  
  - *Zane*: If he misreports A, reports become A, C, A → median = A. Outcome: A (worse than B). Similarly, misreporting C yields C (worse than B).  
  No member benefits from misreporting.  

  **Non-Dictatorial:** Zane’s ideal (B) won, but if preferences change (e.g., Xanthe and Yvonne both report B), Zane cannot force B alone. If Xanthe reported A and Yvonne reported C, median is B regardless of Zane’s report. Dictatorship requires one member *always* dictates the outcome, which fails here.  

  **Escaped Hypothesis: Unrestricted Domain**  
  - Gibbard–Satterthwaite requires *any* logically possible preference ordering. Here, preferences are restricted to single-peaked (each has a peak, and utility falls monotonically away).  
  - **Collapse if Removed:** If Yvonne’s preferences were C ≻ A ≻ B (non-single-peaked), she might misreport: Truthful reports (A, C, B) yield median B. If Yvonne reports A, median becomes A (her second-best), improving from B to A. Strategy-proofness fails.  
  - **GS Loyalist’s Objection:** "Real committees may have non-single-peaked preferences (e.g., a member disliking compromise). By excluding these, you’ve rigged the domain!"  

  ---

  #### Example 2: Cardinal Utilities and Randomised Outcomes  
  **Scenario:** A housing co-op with three members (Priya, Quentin, Ravi) votes on weekend activities: Hike (H), Cinema (C), or Board games (B). Preferences are **cardinal**: members have von Neumann–Morgenstern utilities, evaluating *lotteries* via expected utility.  

  **Cardinal Utilities (scale 0–10):**  
  - Priya: H = 10, C = 5, B = 0 (dislikes indoor options)  
  - Quentin: C = 10, B = 6, H = 0 (averse to outdoors)  
  - Ravi: B = 10, H = 8, C = 0 (prefers social activities)  

  **Mechanism:** **Randomised Dictatorship**. Each reports a cardinal ranking. A dictator is chosen uniformly at random (probability 1/3 each), and their top choice is implemented.  

  **Truthful Reporting Outcome:**  
  - Priya reports H ≻ C ≻ B, Quentin reports C ≻ B ≻ H, Ravi reports B ≻ H ≻ C.  
  - Lottery:  
    - Priya as dictator (prob 1/3): H (Priya: 10, Quentin: 0, Ravi: 8)  
    - Quentin as dictator (prob 1/3): C (Priya: 5, Quentin: 10, Ravi: 0)  
    - Ravi as dictator (prob 1/3): B (Priya: 0, Quentin: 6, Ravi: 10)  
  - Priya’s expected utility (EU): (1/3)(10) + (1/3)(5) + (1/3)(0) = 5  
  - Similarly, Quentin’s EU = (1/3)(0) + (1/3)(10) + (1/3)(6) ≈ 5.33, Ravi’s EU ≈ 6.  

  **Strategy-Proofness Check:**  
  - *Priya*: If she misreports C ≻ H ≻ B (to boost C’s chances), outcomes change:  
    - Priya as dictator: C (utility 5, not 10)  
    - Quentin/Ravi: unchanged  
    - Priya’s EU: (1/3)(5) + (1/3)(5) + (1/3)(0) ≈ 3.33 < 5 (truthful).  
    Reporting B ≻ H ≻ C yields EU ≈ 3.33 (worse). No profitable deviation.  
  - *Quentin*: Misreporting B ≻ C ≻ H gives:  
    - Quentin as dictator: B (utility 6, not 10)  
    - EU: (1/3)(0) + (1/3)(6) + (1/3)(6) = 4 < 5.33.  
  - *Ravi*: Analogous; misreporting lowers EU.  
  Truthful reporting is a dominant strategy under expected utility maximisation.  

  **Non-Dictatorial:** No member always gets their top choice. Priya’s ideal (H) occurs only 1/3 of the time. If Quentin were dictator always, he would impose C, but here he cannot.  

  **Escaped Hypothesis: Determinism and Ordinal Preferences**  
  - Gibbard–Satterthwaite assumes **deterministic outcomes** and **ordinal preferences** (no cardinal utilities). Here, the mechanism is *randomised* and evaluates lotteries cardinally.  
  - **Collapse if Removed:** If we demand determinism (e.g., select Quentin’s top choice always), it becomes dictatorial. If we enforce ordinal preferences (members cannot compute expected utilities), Quentin might misreport: Under truthful play, C occurs 1/3 of the time. If Quentin reports B ≻ C ≻ H, B occurs when he is dictator (prob 1/3), which he prefers to C in isolation—but without cardinality, he cannot see that EU falls.  
  - **GS Loyalist’s Objection:** "Randomisation is cheating! GS applies to deterministic social choices. Cardinal utilities require interpersonal comparisons, which are unrealistic."  

  ### Conclusion  
  - **Example 1** escapes via **domain restriction** (single-peakedness), showing that natural contexts (e.g., spatial decisions) admit non-dictatorial, strategy-proof rules. The load-bearing feature is the domain structure; without it, manipulation resurges.  
  - **Example 2** escapes via **cardinal utilities and randomisation**, leveraging expected utility to align incentives. The load-bearing features are cardinality (quantifying trade-offs) and indeterminism; reverting to ordinal preferences or determinism invites dictatorship or manipulation.  

  Both illustrate how real-world mechanisms evade Gibbard–Satterthwaite by relaxing one axiom—highlighting that the "impossibility" is brittle, not inevitable.
