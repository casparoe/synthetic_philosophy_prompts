  ### The Cross-Wired Qualia Thought Experiment  
  **Scenario:**  
  Imagine a human-like organism named "Cross-Wire" (CW). CW is a *functional duplicate* of an ordinary human:  
  - Its cognitive architecture perfectly replicates human **access consciousness** (information is globally available for reasoning, reporting, and action).  
  - It exhibits identical **reportability** (e.g., says "I see red" when red light hits its retinas, "I’m in pain" when injured).  
  - Its **global broadcasting**, **metacognition**, and **downstream behavioral responses** are human-typical (e.g., avoids injury after pain, identifies objects correctly).  
  - Every functional property cognitive science studies—attention, learning, memory integration—is preserved.  

  However, CW’s **phenomenal character** is systematically misaligned with its functional roles due to a quirk in its neural implementation:  
  - When CW occupies the functional state that *plays the pain role* (triggered by tissue damage, causing withdrawal, grimacing, and distress reports), it undergoes the *phenomenal quality* humans associate with **tasting salt**.  
  - When CW occupies the functional state that *plays the "red-perception" role* (triggered by 620–750 nm light, causing "red" reports and red-appropriate behavior), it undergoes the *phenomenal quality* humans associate with **hearing middle C (261.6 Hz)**.  
  - Similar cross-wiring applies across modalities: e.g., the functional state for *sweet taste* triggers the phenomenology of *touching velvet*, while the functional state for *heat* triggers the phenomenology of *seeing blue*.  

  Critically:  
  - **No functional differences:** CW’s reports and behaviors remain identical to a human’s. When injured, it says "I’m in pain!" (experiencing saltiness). When seeing a red apple, it says "That’s red!" (experiencing middle C).  
  - **No new physics/magic:** This arises from naturally possible neural wiring, e.g., afferent pathways in CW’s brain "cross" during development, swapping sensory qualia while preserving causal roles.  
  - **Target variable:** The *alignment* between functional role and phenomenal character—isolated via cross-modal misalignment.  

  ---

  ### Analysis by Theory  
  We evaluate whether CW is (a) conceivable, (b) metaphysically possible, and (c) a threat to the conceivability argument for dualism.  

  1. **Strong Representationalism (e.g., Dretske, Tye)**  
     - **Core claim:** Phenomenal character is identical to (or exhaustively determined by) representational content. Representational content is fixed by functional/causal roles (e.g., the pain state represents *damage* because it’s caused by damage and drives avoidance).  
     - **(a) Conceivable?** **No.**  
       Once functional roles are fully specified, representational content is fixed. The pain-role state *must* represent bodily damage, and thus *must* have the phenomenal character of pain. Cross-wired qualia (e.g., saltiness during tissue damage) are inconceivable because saltiness represents salt—not damage. Functional facts entail representational facts, which entail phenomenal facts.  
     - **(b) Metaphysically possible?** **No.**  
       The identity of phenomenal character with representational content makes misalignment metaphysically impossible.  
     - **(c) Threat to conceivability argument?** **No.**  
       Representationalism denies the conceivability of CW, blocking its use in arguments against physicalism.  

  2. **Higher-Order Thought (HOT) Theory (e.g., Rosenthal)**  
     - **Core claim:** A state is phenomenally conscious iff it is the target of a higher-order thought (HOT) representing that one is in that state. Phenomenal character is fixed by the content of the HOT.  
     - **(a) Conceivable?** **Yes.**  
       We can conceive that CW’s HOTs remain functionally identical (e.g., "I am in pain" still occurs during tissue damage), but the first-order state’s *phenomenal character* differs (e.g., saltiness). HOT theory allows first-order states to lack intrinsic phenomenology until "tagged" by a HOT.  
     - **(b) Metaphysically possible?** **No.**  
       For CW, the functional pain state is targeted by a HOT with the content *I am in pain*. This HOT *makes* the state phenomenally conscious *as pain*. Even if the first-order state is "cross-wired," the HOT determines phenomenology. Misalignment is impossible.  
     - **(c) Threat to conceivability argument?** **Yes.**  
       CW is conceivable but impossible, illustrating that conceivability does not entail possibility. This undermines the conceivability argument’s inference from "conceivable" to "possible" for dualism.  

  3. **Property Dualism (e.g., Chalmers)**  
     - **Core claim:** Phenomenal properties are fundamental and not reducible to functional/representational properties. There is an explanatory gap between physical/functional facts and consciousness.  
     - **(a) Conceivable?** **Yes.**  
       Functional facts leave phenomenal character underdetermined. We can coherently imagine identical functional organization with inverted qualia, as no logical contradiction arises.  
     - **(b) Metaphysically possible?** **Yes.**  
       Nothing in physical or functional facts necessitates alignment; the cross-wiring is a brute psychophysical law.  
     - **(c) Threat to conceivability argument?** **No—it supports it.**  
       CW demonstrates that functional duplicates can differ phenomenally, implying functional facts don’t entail phenomenal facts. This bolsters dualism by highlighting the explanatory gap.  

  ---

  ### Honest Assessment  
  **Key feature doing the work:** The **cross-modal misalignment** combined with **functional equivalence**. This forces theories to confront whether functional roles *necessitate* specific phenomenology.  
  - **If removed (e.g., same-modality inversion):**  
    - Representationalists might argue functional roles fix content *within* modalities (e.g., "red" must represent redness). Cross-modality prevents this escape by decoupling functional roles from modality-specific expectations.  
    - HOT theories become ambiguous: Same-modality inversion might still be deemed impossible if HOTs fix phenomenology rigidly. Cross-modality clarifies the verdict by making misalignment vivid and less contentious.  
    - Property dualism remains unscathed.  

  **How a dualist disarms objections:**  
  - **Against representationalism:** Argue that functional roles only fix *relational properties* (e.g., tracking damage), not intrinsic phenomenology. Cross-wiring shows representation and phenomenology can come apart.  
  - **Against HOT theory:** Reject that HOTs *constitute* phenomenology. CW’s saltiness-pain could be a "raw feel" unaltered by HOTs, exposing HOT as an incomplete account.  

  **Revision notes:**  
  - Initial versions stipulated misalignment directly. The final scenario derives misalignment from *functional facts* by demanding cross-modal swaps (e.g., pain role + salt phenomenology), forcing theories to explain why alignment is necessary.  
  - HOT initially seemed to allow conceivability trivially. By emphasizing that HOTs are part of functional equivalence, the revised case ensures HOTs are fixed, clarifying why misalignment is impossible under HOT.  
  - Cross-modal (vs. intra-modal) inversion was crucial for clean verdicts. Intra-modal cases allow representationalists to assert content-phenomenology identity (e.g., "red is redness"). Cross-modality breaks this link.  

  This case isolates the alignment variable while respecting cognitive science, yielding distinct verdicts that test each theory’s commitments.
