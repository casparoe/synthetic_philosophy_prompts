  ### Procedure for Junior Analyst: Checking Definition Safety  
  **Goal**: Classify definitions into **Safe**, **Safe-but-Rewrite**, or **Genuinely This-Will-Flip** using set theory principles to avoid circular paradoxes.  
  **Core Principles**:  
  1. **No Self-Containment**: A set cannot be defined by quantifying over *everything* (e.g., "all sets that..."). It must "carve out" a subset from an existing collection.  
  2. **Stratification (Levels/Ranks)**: Assign ranks to definitions. A definition at rank `n` can only reference definitions at ranks `< n`. If ranks can be assigned without cycles, the definition is safe.  
  3. **Recursion Must Be Well-Founded**: Recursive definitions need a *base case* (no recursion) and must "bottom out" (e.g., recursion on smaller inputs).  

  **Step-by-Step Checks**:  
  *(Run on paper in 20 mins for ~30 definitions)*  

  #### **Step 1: Extract Dependencies**  
  - **Action**: For each definition, list all **defined terms** it references (ignore primitives like numbers, dates, or external terms).  
  - **Output**: A dependency list.  
  - **Example**:  
    - *"Eligible dependent"* → Depends on: `eligible claimant`, `eligible dependent`.  

  #### **Step 2: Assign Ranks**  
  - **Action**:  
    1. **Rank 0**: Definitions with **no dependencies** on other defined terms.  
    2. **Rank `n`**: Definitions depending *only* on terms at ranks `< n`.  
    3. **Fail**: If a definition depends on itself (directly/indirectly) or causes a cycle.  
  - **Output**: Successful ranks or "cycle detected."  
  - **Key**: Cycles indicate paradox risk.  

  #### **Step 3: Check for Russell’s Pattern**  
  - **Action**: Flag definitions that:  
    - Define a set `A` as "all `X` that are **not in `B`**,"  
    - Where `B` is defined in terms of `A` (e.g., `B = complement of A`).  
  - **Output**: "Russell pattern detected."  

  #### **Step 4: Classify Recursion**  
  - **Action**: For recursive definitions (self-reference in Step 1):  
    - **Safe**: Has a base case (non-recursive path) and recurses on a "smaller" input (e.g., child of a child).  
    - **Unsafe**: No base case or recursion on "same-size" input.  
  - **Output**: "Well-founded recursion" or "unbounded recursion."  

  #### **Step 5: Final Classification**  
  - **Safe**: Passes Steps 2–4 (ranks assigned, no Russell pattern, recursion well-founded).  
  - **Safe-but-Rewrite**: Safe logically, but:  
    - Recursive (may strain the loader), or  
    - High rank (depends on many layers; loader may need explicit ordering).  
  - **Genuinely This-Will-Flip**:  
    - Cycle in ranks (Step 2),  
    - Russell pattern (Step 3), or  
    - Unbounded recursion (Step 4).  
  - **Escalate**: All "Genuinely This-Will-Flip" and ambiguous cases.  

  ---

  ### **Run on Your Definitions**  
  **Key**:  
  - `✓` = Pass, `✗` = Fail, `⚠` = Safe but rewrite for loader.  
  - Assume `eligible claimant`, `total amount owed`, `total amount paid`, and `standard rules` are primitives or safely defined.  

  #### **1. ‘Eligible dependent’**  
  > *"A child under 19 of an eligible claimant, or a child under 19 of an eligible dependent."*  
  - **Step 1 (Dependencies)**: `eligible claimant`, `eligible dependent` (self).  
  - **Step 2 (Ranks)**:  
    - Self-reference → Cycle. **✗ Rank assignment fails** (cycle with self).  
  - **Step 3 (Russell)**: Not applicable (no set complement).  
  - **Step 4 (Recursion)**:  
    - **✓ Well-founded**: Base case (`eligible claimant`), recurses on "child of child" (smaller input).  
  - **Classification**: **Safe-but-Rewrite**  
    - **Why**: Logically safe (terminates), but self-reference strains loaders. Rewrite iteratively (e.g., "all descendants of eligible claimant under 19").  
    - **Escalate?** No.  

  #### **2. ‘Outstanding balance’**  
  > *"The total amount owed minus the total amount paid, where total paid includes credits applied against outstanding balances."*  
  - **Step 1 (Dependencies)**: `total amount owed`, `total amount paid`, `credits applied` (primitives).  
  - **Step 2 (Ranks)**:  
    - No defined-term dependencies → **✓ Rank 0**.  
  - **Step 3 (Russell)**: Not applicable.  
  - **Classification**: **Safe**  
    - **Why**: No circularity; "credits applied" is descriptive, not a defined term.  

  #### **3. ‘Non-standard rule’**  
  > *"Any rule in the rulebook that is not among the standard rules."*  
  - **Step 1 (Dependencies)**: `standard rules` (assume defined elsewhere).  
  - **Step 3 (Russell)**: **✗ Russell pattern detected** if `standard rules` is defined as "all rules not non-standard."  
  - **Classification**: **Genuinely This-Will-Flip**  
    - **Why**: If `standard rules` depends on `non-standard rule`, it creates a paradox (rules flip status).  
    - **Escalate?** Yes. Fix by defining `standard rules` independently (e.g., explicit list).  

  #### **4. ‘Flagship case’**  
  > *"The case with the highest priority score, where the priority score of a case includes how many other cases have a lower score."*  
  - **Step 1 (Dependencies)**: `priority score` (self-reference via "other cases").  
  - **Step 2 (Ranks)**:  
    - `priority score` depends on *all cases’ scores* → Cycle (each score depends on others). **✗ Rank assignment fails**.  
  - **Step 3 (Russell)**: Not a set complement, but **universal quantification** (defines a score by quantifying over *all cases*).  
  - **Classification**: **Genuinely This-Will-Flip**  
    - **Why**: Circular definition → Scores are ambiguous (multiple valid solutions).  
    - **Escalate?** Yes. Fix with an independent metric (e.g., "priority score = fixed formula based on case attributes").  

  #### **5. ‘Undefined term’**  
  > *"Any term used anywhere in the dictionary that has no entry in the dictionary."*  
  - **Step 1 (Dependencies)**: Self-reference (uses "undefined term" in its own definition).  
  - **Step 2 (Ranks)**: Self-reference → **✗ Cycle detected**.  
  - **Step 3 (Russell)**: **✗ Russell pattern** (defines a set by quantifying over *all terms*, including itself).  
  - **Classification**: **Genuinely This-Will-Flip**  
    - **Why**: If "undefined term" is undefined, it should be included; if defined, it shouldn’t.  
    - **Escalate?** Yes. Fix by excluding self-reference (e.g., "any term *except ‘undefined term’* used in the dictionary...").  

  ---

  ### **Limitations & Caveats**  
  1. **False Negatives**:  
     - **Recursion depth**: A well-founded recursive definition (e.g., `eligible dependent`) may pass checks but **crash the loader** if recursion is too deep (e.g., 10,000 generations).  
     - **Watch for**: Loader stack overflows or timeouts.  
     - **Mitigation**: Rewrite iteratively ("while loop" logic) if recursion depth > loader limit.  

  2. **"Pedantic" Verdicts**:  
     - **Rank assignment failures for recursion** (e.g., `eligible dependent`): Logically safe but flagged due to self-reference.  
     - **Why ignore?** If recursion is proven well-founded and the loader handles it, **override to Safe-but-Rewrite**. Explain: "Theoretical cycle, but safe in practice."  

  3. **Ambiguous Quantification**:  
     - Definitions quantifying over *entire sets* (e.g., `flagship case`) may pass Step 2 if no *syntactic* cycle exists but still **fail at runtime** (e.g., ambiguous scores).  
     - **Watch for**: Definitions using "all," "every," or "highest" over a collection.  

  ### **Summary for Junior Analyst**  
  - **Safe**: 0–1 dependencies, no recursion, no universal quantification.  
  - **Safe-but-Rewrite**: Recursion or high-rank dependencies.  
  - **Genuinely This-Will-Flip**: Cycles, Russell patterns, or unbounded recursion.  
  - **Escalate**: All "Genuinely This-Will-Flip" and ambiguous cases.  
  - **Pedantic Override**: Recursion with base case → Mark "Safe-but-Rewrite" if loader supports it.  

  **Output Template**:  
  ```
  Definition: [Term]  
  Step 1: Dependencies = [List]  
  Step 2: Rank = [Number/Cycle]  
  Step 3: Russell pattern? [Yes/No]  
  Step 4: Recursion well-founded? [Yes/No/N/A]  
  Classification: [Safe/Safe-but-Rewrite/Genuinely This-Will-Flip]  
  Escalate? [Yes/No]  
  ```
