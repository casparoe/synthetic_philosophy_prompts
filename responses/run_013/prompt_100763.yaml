  # Procedure for Checking Definition Consistency

  ## Goal
  To classify each definition in a batch as:
  - **Safe**: Can be loaded without circularity issues.
  - **Safe-but-rewrite-for-the-loader's-sake**: Safe in theory but might cause loader issues; consider rewriting for clarity or to aid the loader.
  - **Genuinely this-will-flip**: Will cause a circularity paradox or is fundamentally ambiguous; must be rewritten.

  ## Steps

  ### Step 1: Extract Dependencies
  For each definition, list all defined terms (from our dictionary) that appear in its definition. Ignore the term being defined itself for now.

  Example: 
     - 'Eligible dependent' depends on 'eligible claimant' and 'eligible dependent'. 
     - Note: 'eligible claimant' might be defined elsewhere.

  ### Step 2: Draw Dependency Graph
  Create a graph where nodes are terms and an edge from A to B means "A depends on B".

  ### Step 3: Check for Self-Reference
  If a term has a dependency on itself, note it as recursive. If two or more terms form a cycle (e.g., A depends on B, B depends on A), note the cycle.

  ### Step 4: Assign Levels
     - Level 0: Terms that have no dependencies (or only on terms not in the dictionary, i.e., primitives).
     - Level 1: Terms that depend only on level 0 terms.
     - Level 2: Terms that depend on level 0 or level 1 terms (and at least one level 1) and no higher.
     - Continue until all terms are assigned or no more can be assigned.
     - If there are terms left in a cycle, they cannot be assigned.

  ### Step 5: Classify
     - **Safe**: Assigned a level and not recursive.
     - **Safe-but-rewrite-for-the-loader's-sake**:
          - Any recursive definition (even if it has a base case) because the loader might not handle recursion.
          - Any definition that uses a term at the same level (if you had to break the level assignment to place it, but it's not circular) - though this is rare.
          - Any definition that you had to assign a level but it depends on many other definitions (high level) and might be hard for the loader.
     - **Genuinely this-will-flip**:
          - Any term that could not be assigned a level (circular dependency).
          - Any definition that has the Russell's paradox pattern: 
               - It defines a set by a condition that says something is not in a set B, and B is defined in terms of the set you are defining.
               - Example: 'non-standard rule' if 'standard rule' is defined as "not non-standard".
          - Any definition that quantifies over the entire set of which it is a part and the condition depends on the set itself (e.g., defining a case property that depends on the entire caseload and the property is defined in terms of itself across cases).

  ### Step 6: Escalation
  Escalate to the supervisor if:
     - A term is classified as "Genuinely this-will-flip".
     - A term is recursive (even if you think it is safe) unless it is a known pattern (like 'eligible dependent').
     - A term has a dependency cycle (could not be assigned a level).
     - A term matches the Russell's pattern.
     - You are unsure.

  ## Time-Saving Tips
     - Focus on definitions that have dependencies (many might be independent).
     - For mutual recursion, look for small cycles (2 or 3 terms) first.
     - Use a whiteboard for the dependency graph.

  ## Examples (from our run)
     - 'Eligible dependent': recursive -> escalate for review (but historically safe, so we might mark safe after review).
     - 'Outstanding balance': safe.
     - 'Non-standard rule': if 'standard rule' is defined as the complement, then Russell's pattern -> flip. Escalate.
     - 'Flagship case': involves a function defined by a condition on the entire function -> flip. Escalate.
     - 'Undefined term': safe (after analysis, but note it has a self-reference) -> escalate for review the first time.

  ## Known Limitations
     - This procedure may flag some safe recursive definitions. We escalate to be safe.
     - It may miss ambiguities like the 'flagship case' if not recognized as a function over the entire set. We rely on the escalation of any definition that defines a property by a condition involving the entire set of that property across a collection.
     - Loader-specific issues (like performance) are not caught.

  **End of Procedure**
