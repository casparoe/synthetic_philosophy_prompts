  **Procedure for the junior analyst**:

  We will design a step-by-step procedure that can be done on paper for 30 definitions in 20 minutes.

  **Step 1: Extract dependencies**
     - For each definition, list the defined terms (from the dictionary) that appear in its definition.
     - Ignore: primitive terms (like numbers, basic operations), terms not in the dictionary (assume they are primitive or from outside), and the term being defined (for now).
     - Write down a dependency graph: for each term, list the terms it depends on.

  **Step 2: Check for self-reference**
     - If a definition depends on itself (directly) then mark it as recursive and note it. 
     - Also check for mutual recursion: if two or more definitions depend on each other in a cycle.

  **Step 3: Assign levels**
     - Start with level 0: terms that have no dependencies (or only primitive dependencies).
     - Then level 1: terms that depend only on level 0 terms.
     - Continue until no more terms can be assigned a level.
     - If there are terms left, then there is a circular dependency. Mark the remaining terms as being in a cycle.

  **Step 4: Classify**
     - **Safe**: 
          - Terms that got a level without any issue.
          - Recursive definitions that are well-founded (have a base case and the recursion is on a smaller input) - but this may require manual review.
     - **Safe-but-rewrite-for-the-loader's-sake**:
          - Terms that are in a cycle but the cycle is not vicious (like mutual recursion that is well-founded) - but this is rare and usually requires review.
          - Recursive definitions (even if well-founded) because the loader might not handle recursion.
          - Definitions that are not circular but the level assignment is high and the loader might require a specific order.
     - **Genuinely this-will-flip**:
          - Terms that are in a cycle that cannot be broken and that involve a negative self-reference (like the Russell's paradox pattern: defining a set by membership conditions that involve the set itself in a negative way, e.g., "not in some set that is defined in terms of the first set").
          - Definitions that involve a universal quantification over the entire set of which it is a part (like the 'non-standard rule' if the standard rules are defined as the complement).

  **Step 5: Specific check for Russell's pattern**
     - Look for definitions of a set A that is defined as: 
          A = { x | condition(x) }
       and the condition(x) involves x not being in a set B, and B is defined in terms of A (for example, B is the complement of A, or B is defined using A).
     - Also, if a set is defined by a condition that quantifies over the entire universe (like "all rules in the rulebook") and the condition depends on the set itself, then it is dangerous.

  **Step 6: Stopping condition**
     - If there is a circular dependency (terms that could not be assigned a level) then escalate.
     - If there is a definition that matches the Russell's pattern, then escalate.
     - If there is a recursive definition, escalate for review (unless it is a standard well-founded recursion that has been working).

