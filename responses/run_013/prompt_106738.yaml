  We are designing a game for 16 students. The goal is to create a structural experience that mirrors the concepts of grounding, dependence, and fundamentality without naming them. The game must be runnable in 90 minutes.

  Game Concept: 
  We'll create a game called "The Tower of Explanation" (but do not reveal this name until the debrief). The core idea is that students build a structure of explanations, where each fact (represented by an index card) must be supported by other facts. The game will have rounds where players must provide explanations for their facts, and the structure must be built without circularity or infinite regress. However, the rules will create pressure that may lead to circularity or regress, and the scoring will incentivize building a stable tower.

  Materials:
  - 16 index cards (one per student) and a marker for writing.
  - Whiteboard to draw the dependence structure as it emerges.

  Roles:
  - Each student is a "Fact Holder". They will write a fact on their card. The facts should be about the game world we create, so they are not about real-world knowledge. We will start by setting a context.

  Setting the Context:
  At the start, the instructor sets a simple, arbitrary fact about the room. For example: "The red chair is in the corner." This is the starting fact. We call this the "Top Fact" (but we don't use the term "top" in a way that biases the structure). Each player will then create a fact that can support or explain the top fact, or support another fact.

  Rules:

  1. **Initial Setup (3 minutes):** 
     - The instructor writes the starting fact on the whiteboard (or on an index card and places it on the board). 
     - Each student gets an index card and a marker. They must write a fact that could be used to explain the starting fact or any fact already in play. The fact must be about a fictional world we are creating (to avoid real-world knowledge disputes). The instructor gives examples: 
          - "Because the room was arranged that way by the janitor."
          - "Because gravity holds it in place."
          - "Because it was moved there yesterday."
     - Important: The facts must be written as statements that can be true or false, and they must be written in a way that they can stand alone (so no pronouns without antecedents, etc.).

  2. **Gameplay Rounds (about 60 minutes total):**
     - The game proceeds in rounds. In each round, one fact that has not yet been "explained" (i.e., grounded) is selected. The fact holder for that fact must present it. Then, other students can offer their facts as explanations. The fact holder chooses one or more facts that they think best explain their fact. 
     - Dependence is represented by arrows: if fact A is explained by fact B, we draw an arrow from A to B (meaning A holds in virtue of B). 
     - Rules for dependence:
          a. Irreflexivity: A fact cannot explain itself. (If a student tries, the group can object and the move is invalid.)
          b. Asymmetry: If A is explained by B, then B cannot be explained by A in the same structure. (So if an arrow A→B exists, then B→A is forbidden.)
          c. Transitivity is not enforced by rule but may emerge. We leave it open.
     - Each fact that is used as an explanation gets points (see scoring). 
     - After a fact is explained, the facts that explain it become the new facts that need explanation (unless they are already explained or are designated as fundamental). 
     - However, a fact can be declared "fundamental" by the group. If so, it doesn't need explanation and it scores bonus points. But there is a cost: if the group later uses that fact to explain something else, they must pay a penalty (lose points) because they are using a fundamental fact in an explanation, which might be seen as not really fundamental.

     - The game has a fixed number of rounds (say, 8 rounds) or until no more moves can be made (because all facts are either explained or fundamental). 

  3. **Scoring (non-monetary):** 
     - Each time a fact is used to explain another fact, the holder of the explaining fact gets 1 point. 
     - If a fact is declared fundamental, the holder gets 3 points. 
     - However, if a fundamental fact is later used to explain something else, the holder loses 2 points (and the group loses 1 point each as a penalty for relying on a fundamental fact? Or maybe just the holder of the fundamental fact loses points? We don't want to punish the group too much. Let's say: the holder of the fundamental fact loses 2 points, and the group does not lose points. But the act of using a fundamental fact to explain is allowed but costly for the one who declared it fundamental.)
