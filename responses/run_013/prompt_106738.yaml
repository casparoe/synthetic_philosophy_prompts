  Final Design:

  **Game Name (to be revealed in debrief):** The Tower of Explanation

  **Materials:** 
  - 16 index cards and one extra for the instructor.
  - A marker for the instructor and one for the students to share (or each has a pen).
  - Whiteboard and markers.

  **Roles:** 
  - All 16 students are Fact Holders. The instructor holds the initial fact.

  **Rules:**
  1. The instructor writes the initial fact on the whiteboard: "The red chair is in the corner."
  2. Each student writes a fact on their index card that could help explain the initial fact or any fact that might be in the tower. (5 minutes)
  3. The game proceeds in rounds. In each round, the group selects one fact from the whiteboard that is unexplained and not fundamental (starting with the initial fact in round 1). The holder of that fact presents it.
  4. The holder then has two choices:
     a. **Seek Explanations:** Other students (with unused cards) can offer their fact as an explanation. The holder chooses one or two facts (max two per fact) to explain it. The group then votes (by show of hands) on whether the explanation is acceptable (simple majority). If accepted, arrows are drawn from the explained fact to the explaining facts. The holders of the explaining facts get 1 point. The explaining facts are added to the board and are now unexplained (unless they are later explained or declared fundamental).
     b. **Declare Fundamental:** The holder declares their fact fundamental. They get 3 points. However, if at any later time this fact is used to explain another fact, the holder loses 2 points.
  5. Irreflexivity and Asymmetry are enforced:
     - A fact cannot explain itself (if offered, the group should reject it).
     - If fact A is explained by fact B, then fact B cannot later be explained by fact A (if someone offers, the group should reject it to avoid a circle).
  6. After 4 rounds, the game pauses. The group must vote: 
     - Option 1: Stop building. All currently unexplained facts (on the board) are declared fundamental. Each holder gets 3 points per such fact. The game ends.
     - Option 2: Continue for 4 more rounds. But note: if during these rounds a circle is created (violating asymmetry) then every player loses 2 points. Also, if a fundamental fact is used in an explanation, the holder of that fact loses 2 points.
  7. After the 4th round (if they continue) or after the stop, we play rounds 5-8 (if continuing). Then the game ends.
  8. Scoring at the end:
     - For each fact: 
          - If it was used as an explanation: +1 per use (so if used twice, +2).
          - If declared fundamental: +3 (but if later used in explanation, then -2 per use).
          - If it remains unexplained and not fundamental: -1.
     - Group bonus/penalty: 
          - If the entire structure is consistent (no circles, no unexplained facts that aren't fundamental): +2 for every player.
          - If there is a circle or an unexplained fact that isn't fundamental: -2 for every player.
     - Note: a fact can be both used as an explanation and then later declared fundamental? No, because if it is used as an explanation, then it is in the structure and must be either explained or fundamental. So we don't have that conflict.

  **Timeline:**
  - 0-3 min: Setup and context.
  - 3-8 min: Students write facts.
  - 8-15 min: Round 1 (initial fact explained by 2-4 facts).
  - 15-20 min: Round 2.
  - 20-25 min: Round 3.
  - 25-30 min: Round 4.
  - 30-35 min: Pause and vote: stop or continue. (If stop, jump to scoring.)
  - 35-40 min: Round 5 (if continuing).
  - 40-45 min: Round 6.
  - 45-50 min: Round 7.
  - 50-55 min: Round 8.
  - 55-60 min: Scoring.
  - 60-90 min: Debrief (30 minutes).

  **Debrief Mapping:**
  - Dependence: The arrows and the explanations. "Remember when you explained the red chair by the janitor? That was a grounding relation."
  - Irreflexivity/Asymmetry: "When someone tried to use a fact to explain itself, we rejected it. And we didn't allow circles because of the group penalty."
  - Full/Partial: "Sometimes a fact was explained by two facts together. That's partial grounding."
  - Termination: "At the pause, you had to decide: stop and have a floor, or continue and risk regress or circle. That's the question of whether grounding chains must end."
  - Status of Dependence Facts: (We supply) "But what about the arrows? The fact that one fact grounds another? That's a deeper issue we didn't model."
  - Fundamentality: "When you declared a fact fundamental, you got points. But was it really fundamental? Or just where we stopped? And if it was used later, you lost points because it shouldn't be used if it's fundamental? That's the tension."

  **Failure Modes and Fixes:**
  1. Failure Mode: The facts are too causal and not diverse. 
     Fix: In the second run, give examples of non-causal explanations: "The rules of the game require it", "It is necessary for stability", "By definition, chairs are in corners".

  2. Failure Mode: The group doesn't challenge explanations, leading to weak structure and then getting stuck. 
     Fix: The instructor should challenge one explanation in round 2: "Wait, does 'because I like it' really explain why the janitor put the chair there? Let's vote." Model critical voting.

  **Commitment on the Floor:**
     - The game is rigged to endorse a floor because the scoring penalties for circles and regress make stopping the safer choice. This is better because it sets up the intuitive pull of fundamentality, which we can then question in the debrief.

  **The Moment that Lands:**
     - The critical pause and vote (minute 30). Confidence: 80%.
answer: |-
  ### Game Design: "The Anchor Point" (Name Revealed in Debrief)

  #### **Materials**
  - 16 index cards (one per student), one marker for instructor
  - Whiteboard (to map dependence relations)
  - Timer

  #### **Roles for 16 Students**
  - **12 "Foundation Builders"**: Create facts for the dependence chain. Each holds one index card.
  - **4 "Arbiters"**: Resolve disputes, enforce rules, and tally points. Rotate this role each round to avoid bias.
  - **Instructor**: Holds the "seed fact" card, facilitates voting, and tracks time.

  #### **Core Rules & Win Condition**
  - **Objective**: Score points by having your fact anchor (i.e., terminate) a dependence chain. Longest unbroken chain from a terminal fact scores bonus points.
  - **Scoring**:
    - +1 point per fact your card explains (if chosen as the "ground" for another fact).
    - +3 points if your fact is declared "fundamental" (terminates a chain).
    - -2 points if your fact causes a circle (asymmetry violation).
    - -1 point if your fact is left unexplained and not fundamental.
    - **Chain Bonus**: +1 point per link in the longest chain from your fundamental fact (e.g., a 4-link chain from your fact gives +4 points).
  - **Win Condition**: Highest individual score after 8 rounds. Ties broken by longest chain bonus.

  #### **Order of Play (90-Minute Timeline)**
  1. **Setup (0–3 min)**:
     - Instructor writes the seed fact on the board: "The red chair is in the corner."
     - Students write one fact on their card that could explain the seed fact (e.g., "Gravity holds it in place," "The janitor placed it there"). *No devices, no collaboration*.

  2. **Round 1: Seed the Chain (3–10 min)**:
     - Instructor presents seed fact. Foundation Builders propose their facts as explanations.
     - Arbiters select 3 facts via vote (raise hands) to form the first layer of dependence. Draw arrows: seed fact → chosen facts.
     - **Scoring**: Chosen facts earn +1 point (for explaining seed fact).

  3. **Rounds 2–4: Build Downward (10–35 min, 25 min total)**:
     - Each round focuses on one unexplained fact from the prior layer.
     - **Holder presents fact**. Other Builders propose *their unused facts* as explanations.
     - **Holder chooses one fact** to depend on (irreflexivity: cannot choose self; asymmetry: if A→B, B cannot later→A). Arbiters enforce rules.
     - **Partial dependence option**: Holder may tag a second fact; both earn +1, but the chain branches (introduces partial grounding).
     - **Scoring**: Chosen facts earn +1. Unexplained facts earn 0 (penalty later if unresolved).
     - *Timer*: 5 min per round (strict).

  4. **The Critical Choice: Terminate or Continue? (35–40 min)**:
     - Pause after Round 4. Unexplained facts are visible on the board.
     - **Vote**: 
       - **Stop**: Declare all current unexplained facts "fundamental." Each gains +3 points. Game ends early. 
       - **Continue**: Risk penalties for circles/unresolved facts, but chance for more points. 
     - **Cost**: 
       - If stop, forfeit potential chain bonuses (avg. +2–4 points lost). 
       - If continue, risk -2 point circle penalties or -1 point for unresolved facts.

  5. **Rounds 5–8: Deepen or Collapse (40–65 min, 25 min total)**:
     - If continue, repeat Rounds 2–4 for new layers.
     - **Transitivity test**: If a chain A→B→C exists, Arbiters may allow C to directly explain A (if proposed) but warn of potential circles. Vote resolves disputes.
     - **Unwinnable trap**: One fact (e.g., "Logic requires it") is intentionally too abstract. If chosen, no fact can explain it without a circle (enforced by Arbiters). Holder must declare it fundamental (+3) or take -1 penalty.

  6. **Final Scoring (65–70 min)**:
     - Tally points. Apply chain bonuses. Declare winner.

  ---

  ### **Debrief (70–90 min): Mapping Gameplay to Metaphysics**
  - **Dependence as non-causal (item 1)**: "When Sarah’s fact about 'janitorial rules' explained the chair’s position without mentioning causes, you felt the pull of 'because'—not cause, but grounding. Like gravity holding the chair: a relation, not an event."
  - **Irreflexivity/asymmetry (item 2)**: "Recall when Mark tried to have his card explain itself? The Arbiters blocked it. And when A→B, B→A was forbidden—this created tension. Transitivity (e.g., letting C explain A directly) was debated but not automatic."
  - **Full vs. partial (item 3)**: "Some chains branched, like when the chair’s position depended on both 'gravity' and 'janitor.' Neither alone settled it—partial grounding emerged."
  - **Termination (item 4)**: "At the vote, you chose to stop/continue. Stopping meant facts like 'physics just works' became fundamental—a floor. Continuing risked infinite descent (e.g., turtles all the way down) or circles (mutual support with no base)."
  - **Fundamentality (item 6)**: "Declaring 'fundamental' gave points, but was it truth or just where you stopped? Like the unwinnable 'logic' card—if declared fundamental, did it feel earned, or a surrender?"
  - **Missing item 5 (dependence facts)**: *Instructor reads this paragraph*:  
    > "In the game, arrows represented 'A holds in virtue of B.' But what about the arrows themselves? If 'the chair is here because of gravity' is a fact, does it need grounding? If not, is it fundamental? If so, what grounds it? This meta-question—whether dependence facts require their own foundation—is where the real wobble begins. Our game treated arrows as given, but reality might not."

  ---

  ### **Failure Modes & Fixes**
  1. **Failure**: Students write overly similar facts (e.g., all causal), missing partial/abstract grounding.  
     **Fix (Run 2)**: Assign roles: 4 students *must* write non-causal facts (e.g., "Rules demand it," "It’s necessary").  
  2. **Failure**: Arbiters miss asymmetry violations, allowing circles.  
     **Fix (Run 2)**: Add a "Circle Alarm"—any player can flag a potential circle for Arbiter review (-1 point if false alarm; +1 if correct).

  ---

  ### **Commitments & Rationale**
  - **Rig the game for a floor**: The scoring (+3 for fundamental facts, -1 for unresolved) and critical choice pressure players to terminate chains. This mirrors the intuitive pull toward fundamentality. *Why?* Ending with a floor creates cognitive friction—students "feel" its necessity, making the debrief wobble (questioning if it’s real) more visceral.  
  - **Betting on the "landing moment"**: The critical choice (stop/continue) at 35 min. *Confidence*: 85%. The vote forces high-stakes trade-offs (points vs. structure), crystallizing termination stakes. With 16 students, consensus debates amplify tension.  
  - **Unavoidable weakness**: Item 5 (dependence facts) isn’t replicable mechanically. The spoken paragraph bridges the gap by tying the game’s "arrows" to unresolved metaphysical unease.  

  **Design Pillar**: The game weaponizes point-scoring to simulate metaphysical pressure. Winning requires strategic grounding, but the system ensures someone gets stuck (the unwinnable card), forcing confrontation with termination. By the end, "fundamental" isn’t a definition—it’s a costly, felt claim.
