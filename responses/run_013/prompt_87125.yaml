prompt: |-
  My mother had a stroke last year, and her neurologist told us she has a condition called pain asymbolia: she says a stimulus hurts, can tell us where it is and roughly how intense it is, and yet shows no distress, does not pull away, and sometimes laughs while it is being applied. I have since learnt that she is not a one-off curiosity — there are people born unable to feel pain at all, people who feel pain they do not mind, and people whose pain is vivid but entirely fails to move them — and that philosophers have long disagreed about why pain is bad, and whether its badness lies in the sensation, in our aversion to it, or in what it does to a life. Before I read any more of that literature, I want the specification rather than the theories. What would a theory of the badness of pain actually have to get right? Give me the desiderata: the cases it must accommodate, the distinctions it must not collapse (sensation against affect, unpleasantness against unwantedness, the badness of a pain against the badness of a life containing it), and the clinical findings it must not contradict, with the case or consideration behind each requirement. Tell me which of these are genuine requirements and which are the parochial demands of one camp; flag any pair you suspect cannot be jointly satisfied, and say which single requirement does the most to eliminate the popular accounts. Then, briefly, how the main families of view fare against the list — pain as bad in itself, pain as bad because unwanted, pain as bad because of what it does to us — keeping the weight on the criteria rather than the scorecard. Please write your answer in British English.
reasoning: |-
  Okay, the user's mother has pain asymbolia after a stroke, which is fascinating and heartbreaking. They've encountered philosophical debates about why pain is bad and want to understand what any theory must explain before diving into literature. 

  First, I need to map the core puzzle: how can someone recognise pain (sensation) without finding it unpleasant (affect)? The user already grasps key distinctions - sensation vs aversion, experience vs life impact - so I must honour that sophistication. Their request for "specification rather than theories" suggests they've seen too many abstract arguments and want concrete touchstones.

  Key clinical cases to cover: congenital insensitivity (no sensation), asymbolia (sensation without affect), opioid-induced apathy (affect without avoidance). Also masochism - where pain is wanted but still feels unpleasant. These create a minefield for theorists.

  The real challenge is balancing three demands: 
  1) Explaining why normal pain is intrinsically bad without making asymbolia's sensation neutral. 
  2) Accounting for pain's badness without reducing it to mere dislike (which fails masochism). 
  3) Separating local badness (this pain now) from global harm (ruining a life) - because chronic pain sufferers still find momentary relief valuable.

  I suspect the "intrinsic badness" and "unwantedness" theories will struggle most with masochism and asymbolia. The "disruption" theory might overgeneralise - not all pains ruin lives. 

  For the response structure: 
  - Start with the non-negotiable phenomena (asymbolia, etc.) 
  - Outline conceptual boundaries (sensation/affect distinction) 
  - Highlight tensions (e.g. masochism breaks aversion theories) 
  - Then neutrally evaluate major theories against these criteria

  The user's British English request means avoiding Americanisms ("elevator"/"mom") but more importantly adopting their precise, evidence-weighing tone. No dogma - just mapping the philosophical terrain their mother's condition has revealed.
answer: |-
  A theory regarding the badness of pain must accommodate a constellation of stubborn phenomena and maintain crucial distinctions. Below are the core desiderata, grounded in clinical realities and conceptual necessities, that any adequate theory must address. I'll flag contentious points and tensions.

  **I. Core Phenomena & Cases to Accommodate**

  1.  **Pain Asymbolia (e.g., User's Mother):**
      *   **Requirement:** Explain how a subject can accurately report the *sensory-discriminative* aspects of pain (location, intensity, quality - "it's a sharp burn") while completely lacking the normal *affective-motivational* response (distress, withdrawal, suffering). The sensation is recognised *as pain* but is not experienced as *bad* or motivating avoidance.
      *   **Source:** Clinical neurology (lesions often in insula/secondary somatosensory cortex).

  2.  **Congenital Insensitivity to Pain (CIP):**
      *   **Requirement:** Explain why the *absence* of pain sensation is profoundly harmful (leading to injuries, infections, joint damage, shortened lifespan), demonstrating that pain sensation normally serves a crucial *protective, biologically beneficial* function. The harm here stems from the *lack* of the sensation's signal.
      *   **Source:** Rare genetic disorders.

  3.  **Opioid-Induced Analgesia/Apathy:**
      *   **Requirement:** Explain how subjects report still *feeling* a painful stimulus ("I can feel the cut, it's there") but state it "doesn't bother" them. They lack the affective unpleasantness and motivational drive without necessarily losing sensory discrimination entirely. Distinguish from asymbolia (pharmacological vs. neurological cause, potential partial effect).
      *   **Source:** Clinical pain management, neuroscience.

  4.  **Masochism (Non-Pathological):**
      *   **Requirement:** Explain how pain can be actively *sought* and *wanted* (e.g., in certain cultural rituals, BDSM, intense exercise) for its overall effect or context, while still being experienced as *unpleasant* during the act. The pain sensation retains its negative phenomenal quality even when instrumentally desired.
      *   **Source:** Psychology, anthropology.

  5.  **Chronic Pain with Adaptation/Coping:**
      *   **Requirement:** Explain how individuals can experience persistent, severe pain that demonstrably *harms* their life (restricting function, causing depression) while simultaneously reporting moments where the *sensory intensity* remains high but the *immediate unpleasantness* is reduced through cognitive or emotional coping strategies. The badness isn't always proportional to the raw sensation.
      *   **Source:** Chronic pain clinics, psychology of coping.

  **II. Conceptual Distinctions to Maintain**

  6.  **Sensation (Sensory-Discriminative) vs. Affect (Affective-Motivational):**
      *   **Requirement:** The theory must not collapse the distinction between *detecting* a noxious stimulus (intensity, location, type - "sharp heat at 7/10") and *caring* about it (finding it unpleasant, suffering, being motivated to escape). Asymbolia and opioid cases show these can dissociate. A theory claiming the badness lies *solely* in the sensory quality fails asymbolia; one claiming it lies *solely* in the affect struggles with why that specific sensation reliably *causes* the affect.

  7.  **Unpleasantness (Phenomenal Quality) vs. Unwantedness (Conative State):**
      *   **Requirement:** The theory must distinguish between the *intrinsic, felt unpleasant character* of a pain experience and the *extrinsic desire* to be rid of it or avoid it. Masochism shows something can be phenomenally unpleasant *while* being conatively wanted (instrumentally). A theory reducing badness *only* to unwantedness fails masochism. Conversely, a theory must explain why the unpleasantness *typically* drives unwantedness.

  8.  **Local Badness (of the Pain Experience) vs. Global Badness (of the Life Containing It):**
      *   **Requirement:** The theory must distinguish the *inherent negative value of experiencing pain itself* from the *broader detrimental consequences* of having that pain (disability, lost opportunities, depression). Chronic pain cases highlight this: the pain is bad *in the moment* and *also* bad because of its life-ruining effects. A theory collapsing badness *entirely* into global consequences struggles to explain why brief, inconsequential pains (e.g., stubbing a toe) are still bad *at the time*. A theory ignoring global consequences fails chronic pain.

  **III. Key Constraints & Tensions**

  *   **The Central Tension:** Reconciling the apparent *intrinsic badness* of pain phenomenology in normal cases with the evidence from **asymbolia** and **opioids** that this badness can be stripped away while the sensation remains, and from **masochism** that the badness can coexist with being wanted. This is the primary challenge.
  *   **The Most Eliminative Requirement:** **Masochism** does the most damage to popular accounts. It directly challenges theories claiming pain's badness *simply is* its being unwanted or avoided. If the pain is phenomenally unpleasant yet actively sought, unwantedness cannot be the sole source of its badness.
  *   **Suspected Incompatibility?** It's *extremely difficult* to satisfy both **Masochism** (unpleasantness persists despite being wanted) and a strong "**Pain is Bad Only Because Unwanted**" theory. Masochism seems to falsify the sufficiency of unwantedness as the *sole* ground of badness. Similarly, **Asymbolia** challenges the necessity of the sensory quality *by itself* being bad.
  *   **Parochialism Alert:** Demanding that pain's badness *must* be entirely separable from its biological warning function might be parochial (leaning towards non-naturalist views). Conversely, insisting badness *must reduce* solely to failed biological function might ignore the lived, phenomenal reality of suffering (leaning towards reductive naturalism). The requirement from **CIP** shows the function is crucial, but **Chronic Pain** shows the suffering matters beyond mere signal failure.

  **How Major Families Fare Against the Desiderata (Criteria Focus)**

  1.  **Pain as Bad In Itself (Intrinsic Phenomenal Quality):**
      *   **Strengths:** Easily explains the immediate, undeniable badness of normal pain. Accommodates **Masochism** (it's unpleasant *even if* wanted). Explains why the *sensation* in **CIP** is needed (its intrinsic badness motivates protection).
      *   **Weaknesses:** Struggles severely with **Asymbolia** and **Opioid cases**. If the badness is intrinsic to the sensation quality, how can that quality be present *without* the badness? It risks conflating **Sensation and Affect**. It may struggle to fully account for **Global Badness** beyond the moment.

  2.  **Pain as Bad Because Unwanted (Conative/Desire Theory):**
      *   **Strengths:** Explains **Asymbolia** and **Opioid cases** (no aversion/unwanting, so no badness). Aligns with the intuition that unwantedness is central. Can potentially handle **Global Badness** (pain is unwanted because of its consequences).
      *   **Weaknesses:** Catastrophically fails **Masochism** (pain is unpleasant *and* bad even when wanted). Struggles to explain why pain is *so reliably* unwanted compared to other sensations – it seems to ignore the distinctive **Unpleasantness** quality that *causes* the unwantedness. **CIP** shows the *lack* of the sensation (which would be unwanted if felt) is harmful, suggesting the *sensation's function* matters independently of current desires.

  3.  **Pain as Bad Because of What it Does (Disruption/Functional Harm):**
      *   **Strengths:** Excellently explains **CIP** (harm from lack of protective signal) and **Chronic Pain Global Badness** (harm from life disruption). Explains the biological *function* of pain's unpleasantness (to disrupt and motivate avoidance). Can accommodate **Asymbolia/Opioids** (if the affective response *is* the disruption mechanism, its absence removes the functional badness *in that moment*).
      *   **Weaknesses:** Struggles with the **Local Badness** of brief, inconsequential pains (stubbed toe) – what "life disruption" occurs? Risks collapsing **Local vs Global Badness**. Fails to fully capture the intrinsic **Unpleasantness** – why is the disruption *felt* so awfully? May struggle with **Masochism** – if the pain serves a desired function/context (e.g., ritual, pleasure), is its badness negated? But the unpleasantness persists.

  **Conclusion**

  A viable theory must navigate the dissociation evidence (**Asymbolia, Opioids, CIP**), account for **Masochism**, and rigorously respect the distinctions between **Sensation/Affect**, **Unpleasantness/Unwantedness**, and **Local/Global Badness**. The biggest hurdle is explaining how the phenomenal character of normal pain constitutes its badness, while allowing that this badness can be absent (asymbolia) or overridden (masochism) without changing the core sensory report. No mainstream theory cleanly satisfies all desiderata; each excels in some areas and stumbles on others, particularly around the core tension between intrinsic phenomenology and the dissociations. The clinical reality of pain asymbolia, as experienced by your mother, remains a particularly potent challenge to simplistic accounts.
