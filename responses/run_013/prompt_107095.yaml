prompt: |-
  My friend and I host a small history reading group and we keep having the same fight: whether "pseudohistory" is even a real category or just a word for history we happen not to like. It always goes the same way. He says it's about method -- whether the work does source criticism, treats evidence as defeasible, can be shown wrong -- and then points out that respectable revisionist history and total crank stuff (Atlantis, the ancient-aliens crowd, Fomenko rewriting the whole chronology) sometimes use the exact same moves: radical skepticism toward received sources, arguing from silence, reinterpreting the standard evidence to fit. I say no, it's about the conclusion, "pseudohistory" just means the claim collides with what the field accepts, and he says that's circular because the field's acceptance is precisely whats in dispute. A year of this and nobody's budged. So what kind of disagreement is this really -- a genuine disagreement about criteria of evidence, a verbal one about what the word is for, or are we just answering two different questions under one label (how to appraise the reasoning vs. how to appraise the conclusion)? If it's that last one, say what would actually count as progress here, or whether nothing should. Give me a diagnosis with reasons, not a survey of the demarcation literature. End with a single last line starting "Diagnosis:" that names the kind of disagreement in a few words.
reasoning: |-
  Okay, let me tackle this user's problem. They're stuck in a loop with their friend about what makes something "pseudohistory." The friend argues it's about method—things like source criticism and falsifiability. The user thinks it's about conclusions conflicting with accepted history. They've been going at it for a year with no progress.

  First, I need to unpack their arguments. The friend points out that both revisionist historians and cranks use similar skeptical tactics. So method alone isn't a clear divider. The user says it's about the conclusion, but that's circular because what's accepted isn't agreed upon. 

  Hmm, they're both partly right but missing something. The core issue might be that they're conflating two different questions: one about the reasoning process, the other about the conclusion's acceptance. That makes sense because evaluating how someone argues versus whether their claim fits established knowledge are related but distinct. 

  The user wants to know what kind of disagreement this is. They mentioned it could be about evidence criteria, semantics, or answering different questions. I should consider each possibility. If it's about evidence criteria, why do both valid and crank historians use similar methods? That suggests method isn't the whole story. If it's verbal, defining "pseudohistory" might help, but the user wants more than definitions. 

  Ah, the third option seems strongest. They're answering different questions under the same label. The friend cares about methodological rigor, while the user focuses on alignment with consensus. So the term serves different purposes. That explains the stalemate. Neither is wrong, but they're talking past each other.

  What would progress look like? They need to separate the questions. Agree that method is necessary but not sufficient. A claim can be well-argued but still fringe if it ignores evidence or invents causes. Recognizing that "pseudohistory" bundles both bad methods and rejected conclusions could help. Maybe stop using the term and instead specify when something is poorly argued versus contradicted by evidence.

  The user also wants a diagnosis in a few words. "Conflated criteria" captures that they're mixing two standards. The last line should be clear and concise. 

  I should make sure not to dive into demarcation literature but stick to their specific issue. The examples like Atlantis and Fomenko show that conclusions matter. Method alone can't distinguish them from legitimate revisionism. The circularity point is key—consensus can't be the sole measure, but dismissing it entirely ignores how knowledge builds. 

  So the resolution involves acknowledging both aspects. The friend needs to see that radical skepticism without engaging counter-evidence is problematic. The user should admit that consensus isn't infallible. Their progress lies in dissecting the layers: method, coherence with evidence, and community acceptance. That breaks the cycle.
answer: |-
  This isn't a disagreement about evidence criteria *or* just a verbal spat. You're both identifying necessary but insufficient conditions for "pseudohistory" and mistaking your condition for the whole definition, while also answering subtly different questions under the same label. Here's the breakdown:

  1.  **Your Friend is Right (About Method Being Necessary):** Rigorous historical method *is* the foundation. Work lacking source criticism, treating evidence as unfalsifiable dogma, ignoring counter-evidence, or relying solely on arguing from silence *is* fundamentally flawed. This flawed methodology *can* produce pseudohistory. His observation that cranks *mimic* revisionist moves (skepticism, reinterpreting evidence) is astute – the *appearance* of method can be deceiving.
  2.  **You are Right (About Conclusions Mattering):** Conclusions wildly at odds with overwhelming evidence and the established framework *are* a core characteristic of pseudohistory. Ignoring this allows the "methodological mimicry" your friend identifies to camouflage crankery. "Pseudohistory" inherently implies the conclusion *is* wrong in a specific, egregious way (Atlantis, aliens, Fomenko's re-dating).
  3.  **The Core Problem:** You're conflating two distinct appraisal processes:
      *   **Appraising the Reasoning (Your Friend's Focus):** "Is this work methodologically sound?" This focuses on *how* the argument is built. A "yes" here makes it *history* (revisionist or mainstream). A "no" makes it *bad scholarship*, potentially pseudohistory.
      *   **Appraising the Conclusion (Your Focus):** "Does this claim fit within or catastrophically contradict the established, evidence-based historical framework?" This focuses on *what* is claimed relative to current knowledge. A "yes" makes it part of the ongoing debate (even revisionist). A "no" makes it *pseudohistory*.
  4.  **Why "Pseudohistory" Needs Both:**
      *   **Method Alone Isn't Enough:** Brilliantly argued historical work can reach novel, even initially rejected, conclusions *that are still within the realm of plausible historical debate* (e.g., challenging specific events, interpretations, or chronologies based *on evidence*). This is revisionist history, not pseudohistory. Conversely, work with *some* methodological elements can still be pseudohistory if it ignores key evidence, invents causes (aliens!), or relies on fabricated sources.
      *   **Conclusion Alone Isn't Enough (The Circularity Trap):** Dismissing *any* challenge to consensus as "pseudohistory" *is* circular and stifles legitimate inquiry. The consensus itself rests on methodological rigor applied to evidence. The *reason* Atlantis is pseudohistory isn't *just* that historians reject it; it's that the claim catastrophically contradicts *all* evidence (archaeological, genetic, textual) and relies on non-falsifiable/mythical sources.

  **What Counts as Progress:**

  1.  **Separate the Questions:** Explicitly distinguish between:
      *   *How sound is the method?* (Critique the reasoning process).
      *   *How plausible/consonant with the evidence-base is the conclusion?* (Critique the claim itself).
      *   *Does this work exhibit the specific hallmarks of pseudohistory?* (Requires evaluating *both* the method *and* the conclusion's relationship to the evidence-base).
  2.  **Recognize "Pseudohistory" as a Compound Judgment:** Agree it requires **BOTH**:
      *   **Severely flawed methodology:** Ignoring counter-evidence, lack of falsifiability, reliance on fabricated/non-existent sources, arguing *only* from silence, special pleading, invoking non-historical causes (supernatural/aliens) as primary explanations.
      *   **A conclusion that catastrophically contradicts the established evidence-base:** Not just challenging an interpretation, but denying core, well-evidenced facts or proposing entirely unsupported alternate realities (e.g., no Roman Empire, global civilization 12k years ago).
  3.  **Analyze the Revisionist/Crank Mimicry:** Instead of saying "same moves," dissect *how* those moves are used. Does the "radical skepticism" ignore mountains of counter-evidence? Does the "reinterpretation" rely on ignoring inconvenient facts or inventing new ones? Does the argument *allow itself to be falsified* by evidence? Legitimate revisionism engages seriously *with all* the evidence; pseudohistory dismisses or explains away contradicting evidence using flawed logic or invented causes.
  4.  **Move Beyond the Label (Sometimes):** For contentious cases, focus the debate on the *specific methodological flaws* and the *specific points of conflict with the evidence-base*, rather than the binary "pseudohistory or not."

  **Diagnosis:** Conflated criteria masking distinct evaluative questions.
