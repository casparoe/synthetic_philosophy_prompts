prompt: |-
  I'm a science journalist working on a feature about the long-running fight over human rationality — the heuristics-and-biases camp (Kahneman and Tversky's descendants, the "biases are errors" people) versus the fast-and-frugal / ecological rationality crowd (Gigerenzer and company, who say the biases are often smart adaptations to real environments). I've interviewed both sides and they keep talking past eachother, so what I want from you is the document they could both sign if I locked them in a room for a week. Specifically: a numbered list of agreed claims — what both accept about the actual findings (conjunction fallacy, base-rate neglect, anchoring, the recognition heuristic, less-is-more effects, overfitting when samples are small) and about what a normative standard of rationality is even supposed to deliver; then a disagreements table where each side's position is stated in wording that side would accept as fair; then the cruxes, the sub-questions where settling something would actually move one of them — I'd guess whether "bias" is a claim about the mind or about the environment, whether optimization is well-defined once you specify the environment, whether satisficing is a real alternative to optimizing or just optimizing with a constraint tacked on, and whether lab tasks are representative of anything. For each crux, give me a case or experiment both sides would agree bears on it, with each side's prediction written down in advance. Also tell me which parts of this fight are just verbal, because I suspect a fair amount of it is people describing the same glass as half empty and half full. Since this is going in print, be explicit about what's settled among people who actually know the work versus what's genuinely contested — don't hand me one camp's view dressed up as the consensus. American English, please.
reasoning: |-
  Okay, let me tackle this science journalist's request. They're deep in the rationality debate between Kahneman/Tversky's "biases as errors" camp and Gigerenzer's "ecological rationality" view, and need help creating a consensus document. 

  First, I need to map the core tension: both sides agree cognitive shortcuts exist but fundamentally disagree on whether they represent flaws or adaptations. The journalist wants three clearly delineated sections: agreed findings, framed disagreements, and testable cruxes with experimental predictions. 

  For the common ground section, I'll list robust phenomena both camps accept - conjunction fallacy, base-rate neglect etc. - but carefully note where they diverge in interpretation. The key is phrasing these as neutral empirical observations without loading terms like "error" or "rational". 

  The disagreements table is trickier. I'll need symmetrical columns stating each position in their own preferred terminology: "biases" vs. "adaptive tools", "deviations from logic" vs. "environmentally tuned responses". Crucially, I'll flag where disputes are merely semantic (e.g., "bias" definition) versus substantive.

  For the cruxes, I'll propose concrete experiments on: (1) whether bias resides in mind or environment (using financial incentives as a test case), (2) definability of optimization (with Monte Carlo simulations), (3) satisficing vs optimizing (via resource constraints), and (4) ecological validity (comparing lab/field results). Each experiment needs both camps' advance predictions to prevent post-hoc reinterpretations.

  Throughout, I'll maintain American English and highlight genuine controversy versus terminological differences. The tone should be mediator-neutral - no implicit endorsements of either camp. And I must resist the temptation to impose artificial consensus where none exists; the journalist needs the authentic fault lines exposed.
answer: |-
  Here’s a consensus document drafted as if negotiated by both camps, structured as requested. It reflects points of agreement, clarifies disagreements with neutral framing, identifies testable cruxes, and flags semantic disputes. Language is precise American English, and substantive controversies are explicitly noted.

  ---

  ### **Agreed Findings: What Both Camps Accept**  
  *(Empirical phenomena both sides acknowledge, stripped of interpretive spin)*  

  1. **Conjunction Fallacy**: People often judge specific scenarios (e.g., "Linda is a bank teller and feminist") as more probable than general ones ("Linda is a bank teller"), violating probability rules.  
  2. **Base-Rate Neglect**: Under many conditions, people underweight statistical base rates (e.g., disease prevalence) in favor of individuating information.  
  3. **Anchoring**: Numerical judgments are influenced by arbitrary starting values (e.g., random numbers), even when irrelevant.  
  4. **Recognition Heuristic**: When one object is recognized and another isn’t, people infer the recognized object has higher value (e.g., city size, team strength).  
  5. **Less-Is-More Effects**: In specific environments (e.g., low recognition validity), limited knowledge can lead to *more* accurate inferences than extensive knowledge.  
  6. **Overfitting in Small Samples**: People overinterpret patterns from sparse data, leading to poor generalizations.  

  **Agreed Normative Standards**:  
  - Rationality should be evaluated relative to **goals** (e.g., accuracy, speed, resource efficiency).  
  - No cognitive strategy is universally optimal; performance depends on the **environment’s structure** (e.g., information distribution, noise, costs).  
  - Models of rationality must account for **computational constraints** (e.g., bounded time, memory).  

  ---

  ### **Disagreements: Framed Neutrally**  
  *(Each side’s position stated in their preferred terms)*  

  | Issue | Heuristics-and-Biases (HB) Camp | Ecological Rationality (ER) Camp |
  |-------|---------------------------------|----------------------------------|
  | **Nature of "Bias"** | Biases are *systematic deviations* from formal logical/statistical norms, revealing cognitive limitations. | Biases are *adaptive tools*; apparent "errors" often reflect rational exploitation of environmental regularities. |
  | **Optimality Definition** | Normative benchmarks (e.g., Bayes’ theorem) define rationality; deviations indicate flawed cognition. | Optimality is *ecologically contingent*; success in real-world contexts defines rationality. |
  | **Satisficing vs. Optimizing** | Satisficing is a *fallback* strategy when optimization is infeasible; it reflects cognitive limits. | Satisficing is a *primary* adaptive strategy; optimization is often impossible or wasteful in natural environments. |
  | **Lab Task Validity** | Controlled experiments reveal *universal cognitive flaws*; ecological variation doesn’t negate core errors. | Lab tasks are often *unrepresentative*; real-world performance (e.g., expert intuition) validates heuristics. |

  ---

  ### **Cruxes: Testable Disputes**  
  *(Key sub-questions + experiments with advance predictions)*  

  1. **Is "bias" a property of the mind or the environment?**  
     - **Experiment**: Test the *recognition heuristic* in environments with **varied recognition validity** (e.g., stocks: high-recognition companies vs. obscure startups). **Manipulate incentives** for accuracy.  
     - **HB Prediction**: Recognition use persists even when harmful (high incentives + low validity), proving cognitive bias.  
     - **ER Prediction**: Recognition is abandoned when invalid (high incentives + low validity), proving environmental adaptation.  

  2. **Can optimization be well-defined once the environment is specified?**  
     - **Experiment**: Embed **base-rate neglect** tasks in environments where base rates are either (a) highly diagnostic or (b) noisy/weak. Use **Monte Carlo simulations** to compute optimal benchmarks.  
     - **HB Prediction**: Neglect persists even when base rates are diagnostic, revealing insensitivity to environmental structure.  
     - **ER Prediction**: Neglect diminishes when base rates are diagnostic, proving ecological tuning.  

  3. **Is satisficing distinct from optimization?**  
     - **Experiment**: Resource-limited search tasks (e.g., medical diagnosis with time pressure). **Vary cost of information acquisition** and define optimal stopping points mathematically.  
     - **HB Prediction**: People stop suboptimally (too early/late) vs. computed optima, indicating cognitive bounds.  
     - **ER Prediction**: Stopping points align with ecological optima when costs/benefits are transparent.  

  4. **Do lab tasks generalize to real-world performance?**  
     - **Experiment**: Compare **anchoring effects** in hypothetical lab pricing tasks vs. high-stakes field decisions (e.g., real estate bids, salary negotiations).  
     - **HB Prediction**: Anchoring effects persist in both contexts, revealing universal vulnerability.  
     - **ER Prediction**: Anchoring weakens or reverses in high-stakes field settings due to expertise/feedback.  

  ---

  ### **Settled vs. Contested & Semantic Disputes**  
  **Genuine Consensus**:  
  - Heuristics exist and are used under uncertainty.  
  - Cognitive performance is environment-dependent.  
  - Formal models (e.g., Bayesian) are useful benchmarks but not always feasible.  

  **Genuine Controversies**:  
  - Whether biases reflect *design flaws* or *ecological adaptations*.  
  - Whether optimization is a plausible standard for biological cognition.  
  - The ecological validity of abstract lab tasks.  

  **Mostly Semantic Disputes**:  
  - **"Bias"**: HB uses it as "deviation from norm"; ER uses it as "mismatch with environment."  
  - **"Rationality"**: HB emphasizes *internal coherence*; ER emphasizes *external success*.  
  - **"Error"**: HB labels deviations from logic as errors; ER argues this mis-specifies the problem.  

  **The "Half-Empty/Half-Full" Divisions**:  
  - Both agree heuristics can succeed or fail depending on the environment. HB emphasizes the failures; ER emphasizes the successes.  
  - Both endorse environment-mind fit. HB sees it as rarely achieved; ER sees it as routinely achieved.  

  ---  
  **For Print Clarity**: This document synthesizes empirically grounded agreements while exposing unresolved conflicts. Neither camp would endorse every word, but it accurately maps common ground and fault lines. Genuine progress requires resolving the cruxes via ecology-embedded experiments. The core divide remains philosophical: Is human cognition a "kluge" (HB) or a well-adapted toolkit (ER)? The evidence, both sides concede, shows it is both—but *when* and *why* is fiercely contested.
