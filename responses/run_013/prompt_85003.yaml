  For learning, conditionalizing each function can cause intervals to widen paradoxically (e.g., learning about one coin makes another less certain). This challenges whether imprecise independence is possible without sharpening. Some propose modifications, but they might beg the question. The user wonders if this indicts the framework or just specific models.

