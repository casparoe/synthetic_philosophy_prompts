  On falsifiability, the worry is that sets can always be adjusted post-hoc. A decisive defeat might require showing sharp credences can do everything sets can, making sets redundant. Or evidence that sets lead to systematic errors sharp probabilities avoid. The user's personal stake is whether sets add value or are "idle machinery."

