prompt: |-
  I sit on the board of a small Catholic foundation that hands out one big grant a year, and this year we've walked into something I did not sign up for. A coalition in a country I won't name is trying to get rid of a president who won a clean election eight years ago and then spent the next seven rewriting the constitution, jailing the opposition press, and letting his family take over the customs service. The coalition has two wings. One is doing it the boring way — court challenges, an impeachment push, a general strike. The other wing has people in it who have said, more than once and not always privately, that if the courts fail then "whatever it takes" is on the table. They've asked us for money, and our grant cycle closes before our next board meeting.

  Half the board wants to fund the whole coalition, on the grounds that the guy is plainly a tyrant and any tool that removes him is a tool for the common good. The other half — led by a canon lawyer who is normally my ally — says flatly that the tradition forbids killing tyrants and that funding a group with a wing that talks like that makes us complicit. He keeps saying "Aquinas is clear on this." I think he's wrong, and I think he's wrong in a way that matters, but I also don't think Aquinas gives us a clean green light, and I need to be able to say why in front of people who will actually listen.

  What I want from you is the memo I'll circulate before the meeting. Work through the Thomistic machinery honestly rather than just importing modern human-rights language, because this board thinks in that vocabulary and I need them to see that the tradition is more interesting than either camp is pretending. A few things I specifically want you to sort out, because they're where I think the real argument is:

  - The tyrant-by-title versus tyrant-in-practice distinction. Our guy acquired power legitimately and then governed tyrannically. Does that change the analysis compared to a usurper, and if so, how, given that the passages people usually cite weren't written with our guy in mind.
  - Who counts as the public authority whose action the tradition requires. Our canon lawyer will say: no public authority here, so no. But there's an impeachment process, there are courts, there's an international body that has already issued findings, and there's a bishops' conference that has been conspicuously silent. I want a principled answer to what makes an authority "public" for this purpose, not a list of candidates.
  - The caution about the remedy being worse than the disease. This is the one I find genuinely hard, and I don't want it waved away. If the strongman falls and the country fractures, or his brother takes over and is worse, what does that do to our judgment about funding a coalition that includes people who might not stop at the constitutional track? Be specific about how that consideration should cash out in an actual funding decision, not just as a disclaimer.
  - The sedition point, which I think is the crux and which both camps are getting wrong. My understanding is that disturbing a tyrannical regime isn't sedition because the regime isn't ordered to the common good — but then there's a caveat that if the disturbance damages the people more than the tyranny did, it becomes sedition after all. If that's roughly right, then the whole decision turns on a prediction about magnitudes, which is exactly the kind of thing a grant committee is bad at. I want you to face that rather than hide it.

  The bottom line I need from you is a concrete recommendation: fund the whole coalition, fund only the constitutional wing, fund neither but issue a statement, or something else — with a condition or a time frame if that's what the answer requires. Give the canon lawyer's position its strongest form somewhere in there, because if I can't answer his best version I shouldn't be voting at all.

  Format: lead with the recommendation in the first sentence, then the reasoning, no preamble, no restating what I've told you. It's going to be read aloud at a table, so keep it tight.
reasoning: |-
  Hmm, the user is on the board of a Catholic foundation facing a complex ethical dilemma about funding a coalition opposing a tyrannical leader. They need a Thomistic analysis to persuade fellow board members, focusing on specific theological nuances.

  Breaking down the core issues: First is the legitimacy question - the president was elected fairly but became tyrant through later actions. Aquinas primarily addressed usurpers, so I need to extend the framework. The key point is that legitimacy of origin doesn't sanctify subsequent tyranny; the common good remains paramount.

  Next is the public authority question. Thomism requires action by proper authority, but what constitutes that when domestic institutions are compromised? I'm considering two criteria: competence (legal capacity) and legitimacy (moral standing). This creates a spectrum where courts may retain some authority while international bodies might qualify as subsidiary authorities.

  The remedy/disease concern is toughest. We must distinguish between funding the coalition and endorsing specific actions. The Thomistic principle here is proportionality - we're not causing harm but enabling resistance, with the constitutional wing providing a check. The funding should come with conditions and timeline requirements to maintain moral coherence.

  On sedition, the user's understanding is correct: opposing tyranny isn't sedition unless it causes greater harm. But assessing potential outcomes is indeed difficult. The tradition requires a "reasonable judgment" standard - we must act on evidence, not certainty. The bishops' silence is relevant here as it signals systemic failure.

  For the recommendation, I'm leaning toward conditional funding of the entire coalition. This navigates the Thomistic requirements while addressing practical concerns. The conditions create accountability for the non-constitutional wing and the timeline allows for reassessment. It's important to explicitly state how this meets the canon lawyer's objection about complicity.

  The user's emphasis on avoiding modern human rights language is crucial. Every point must ground itself in Thomistic concepts like common good, authority, and the conditions for licit resistance. The memo should conclude by showing how this approach satisfies both camps' valid concerns while remaining firmly within tradition.
answer: |-
  **Recommendation:** Fund the constitutional wing only, with immediate disbursement, conditioned on their public reaffirmation of exclusive commitment to non-violent, constitutional resistance within 7 days, and explicitly stating that no funds support the "whatever it takes" wing or its activities.

  **Reasoning (Thomistic Framework):**

  1.  **Tyrant-in-Practice vs. Title:** Aquinas (*De Regno*, *ST* II-II Q42) primarily addresses usurpers. However, the core principle is the *common good*. Legitimate acquisition of power does not immunize subsequent tyranny. A ruler who, by action, "aims at his own benefit instead of at the common good" (*De Regno* I, 4) becomes a tyrant *in practice*, forfeiting the moral claim to obedience inherent in just authority. His initial legitimacy is relevant context but does not negate the substantive tyranny or the right/potential duty of resistance for the common good. Our grant addresses *resisting this established tyranny*, not challenging an original usurpation.

  2.  **Identifying "Public Authority":** For licit removal, action by "public authority" is required (*ST* II-II Q42 A2). This authority is defined not merely by formal title, but by its *competence to act for the common good* and *legitimacy derived from its role within the political community's just order*. It must possess the *capacity* (legal, institutional) and the *moral standing* (acting for justice, not faction) to restore lawful order.
      *   Domestic courts/impeachment bodies retain formal *competence* under the existing, albeit corrupted, constitution. Their action, if pursued justly, would be the primary licit path. Their potential failure does not negate their status as the primary "public authority" in Thomistic terms for *initiating* removal.
      *   An international body might qualify as a *subsidiary* public authority if the domestic order has manifestly failed and it has a legitimate mandate grounded in universal justice and the common good of the international community. Its findings are evidence of tyranny but may not automatically confer *executive* authority for removal.
      *   The bishops’ conference silence weakens a potential claim to moral authority as a guiding voice but does not inherently constitute the "public authority" Aquinas requires for *political* action like removal.
      *   **Principled Definition:** "Public authority" for tyrannicide/removal means an entity possessing *legitimate institutional capacity within the relevant political order (including subsidiary international orders)* and *acting manifestly for the restoration of just rule and the common good*, not private vengeance or factional advantage. The constitutional wing, by utilizing courts/impeachment/strike, *appeals to or operates within* the residual structures of this public authority. The "whatever it takes" wing explicitly rejects this constraint.

  3.  **Remedy Worse than Disease & Complicity:** Aquinas is emphatic: action against a tyrant is only permissible if it "does not lead to more harm being inflicted on the community" (*ST* II-II Q42 A2 ad 3). Funding the *entire coalition* presents a high risk of material cooperation with evil (*ST* II-II Q62 A7, Q78). The "whatever it takes" wing's statements indicate a proximate willingness to gravely illicit acts (sedition, murder). Funding them, even indirectly via shared coalition structures, materially facilitates their capacity for such acts, making the foundation potentially cooperators in those evils if they occur. The grave uncertainty about outcomes (fracture, worse successor) directly invokes Aquinas's caution. Funding *only* the constitutional wing materially supports *only* licit means (court challenges, impeachment push, strike – assuming the strike is non-violent and proportionate). This minimizes risk of complicity in illicit violence and focuses resources on the path *least* likely to cause greater harm than the tyranny itself. The *possibility* that the constitutional path fails and chaos ensues *despite* our funding of licit means is a tragic risk inherent in resisting tyranny, not a culpable cooperation in causing the chaos.

  4.  **Sedition and Magnitude:** Your understanding is correct. Resisting a tyrant is not sedition (*perturbatio regni iniusti non habet rationem seditionis* - *ST* II-II Q42 A2 ad 3) because the tyrant's regime is not ordered to the true common good. **However,** Aquinas's caveat is crucial: if the resistance causes "such disorder that the people suffer more harm from the ensuing disturbance than they would have suffered from the tyrant’s rule," it *becomes* sedition. This *does* turn on a prediction of magnitudes. The tradition demands a *reasonable judgment* based on evidence, not certainty.
      *   Funding the "whatever it takes" wing *increases* the likelihood of disproportionate harm (violence, chaos) transforming licit resistance into sedition.
      *   Funding *only* the constitutional wing supports resistance focused precisely on *avoiding* the disproportionate harm that Aquinas forbids. It backs the path aiming for an ordered transition via existing (or restored) public authority, minimizing the risk of the resistance itself becoming a greater evil.
      *   The grant committee *must* make this prudential judgment. Evidence includes: the constitutional wing's organization/discipline, broad popular support for their methods, the military's stance, potential international support for a peaceful transition, and the *specific risks* articulated by the "whatever it takes" rhetoric. Funding only the constitutional path is the choice best aligned with minimizing the risk of the resistance itself becoming a greater evil.

  **Addressing the Canon Lawyer's Best Case:** The canon lawyer is correct that Aquinas forbids private individuals killing tyrants and demands action by public authority (*ST* II-II Q42 A2). He is correct that cooperation with evil (funding those advocating illicit means) is morally prohibited. His position rightly emphasizes the gravity of sedition and the paramount need to avoid greater harm. **However,** this position errs by: (1) Insufficiently recognizing that the constitutional wing *is* acting through/appealing to residual structures of public authority; (2) Equating funding a coalition containing a problematic wing with *direct* material cooperation in their potential future illicit acts, when a targeted grant to the constitutional wing avoids this; (3) Potentially leading to the greater evil of passively enabling the tyrant's continued oppression by withholding support from the *only* current licit resistance, contravening the duty to resist manifest tyranny for the common good where prudent means exist.

  **Conclusion:** The conditional grant to the constitutional wing provides essential support for licit resistance acting within the Thomistic framework (appealing to public authority, using proportionate means, minimizing risk of greater harm) while definitively avoiding material cooperation with the illicit means advocated by the other wing. It fulfills the foundation's potential duty to support the common good against manifest tyranny in the manner Aquinas's principles permit. Failure to support the licit path risks abandoning the field entirely to potentially greater evils, both of continued tyranny and chaotic, disproportionate resistance.
