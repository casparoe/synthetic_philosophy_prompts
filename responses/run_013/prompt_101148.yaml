  Priority 2 should be uncertainty typology - not just distinguishing risk/uncertainty/ignorance but mapping how PP applies differently across epistemic contexts. Here the philosophy of science angle shines through comparison to modeling practices. The tractability is medium: requires engaging scientific case studies but avoids econometric complexity.

