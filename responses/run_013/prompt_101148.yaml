answer: |-
  Here is a defended research agenda prioritizing upstream conceptual questions about the Precautionary Principle (PP), tailored to your philosophical training and hypothesis. I rank questions by their "upstreamness" (how fundamentally they constrain downstream debates), tractability for philosophy of science, neglect, and leverage potential. Your framing about the **epistemic demarcation problem** is central—I agree it’s the critical upstream bottleneck (80% confidence).

  ### Core Thesis
  **The PP debate is paralyzed because critics and defenders tacitly disagree on when a hazard qualifies for "precautionary treatment" (non-probabilistic threat) vs. "risk-benefit analysis" (probabilistic risk).** Settling this demarcation is upstream because it determines which normative framework applies. Without clarity here, discussions of proportionality, evidence thresholds, or burden of proof are talking past each other.

  ---

  ### Ranked Research Agenda
  #### **1. The Threat/Risk Demarcation Problem**  
  *What criteria distinguish hazards requiring precautionary framing (non-probabilistic threats) from those amenable to probabilistic risk analysis?*  
  - **Why Upstream?**  
    This question determines *whether PP even applies*. If a hazard is framed as probabilistic, standard cost-benefit tools take over; if non-probabilistic, PP’s burden-shifting logic activates. All other PP questions (e.g., "How much precaution?") presuppose this framing.  
  - **Tractability for Phil-Sci:**  
    High. Focuses on epistemology of modeling (e.g., when can probabilities be meaningfully assigned?), ontology of hazards (e.g., are some harms "unquantifiable" due to incommensurability or radical uncertainty?), and scientific practice (e.g., how do scientists handle "deep uncertainty" in climate/emerging tech?).  
  - **Neglect:**  
    Severe. Literature either assumes the demarcation (e.g., "PP applies to uncertain catastrophes") or collapses it into downstream policy debates. Few analyze *epistemic thresholds* for shifting frameworks.  
  - **How to Move Up/Down Agenda:**  
    - **↑** If your work shows this demarcation underlies key PP disputes (e.g., in GMO/geoengineering cases) or identifies testable criteria (e.g., Kolmogorov complexity of probability models, non-reversibility of harm).  
    - **↓** If you find policy actors consistently ignore this distinction in practice, making it philosophically inert.  

  #### **2. Typology of Uncertainty for Burden-Shifting**  
  *What specific *types* of uncertainty (epistemic, ontological, model ambiguity) justify shifting the burden of proof?*  
  - **Why Upstream?**  
    Clarifies *why* PP’s burden-shifting applies in some cases but not others. Directly addresses your hypothesis by unpacking "when science is unsettled." Downstream questions about *how* to shift the burden depend on this.  
  - **Tractability:**  
    High. Builds on phil-sci work on inductive risk, model uncertainty (Winsberg), and ignorance (Funtowicz & Ravetz). Case studies (e.g., endocrine disruptors vs. earthquake prediction) can reveal how uncertainty types interact.  
  - **Neglect:**  
    Partial. Uncertainty is discussed, but rarely linked systematically to *burden-shifting legitimacy*. Most taxonomies (e.g., Knightian) aren’t mapped to PP’s normative structure.  
  - **How to Move:**  
    - **↑** If you show certain uncertainties (e.g., "residual indeterminacy" after model-scenario exhaustion) robustly trigger burden-shifting.  
    - **↓** If all uncertainty types reduce to probabilistic risk (undercutting PP’s distinctness).  

  #### **3. Burden of Proof Mechanics**  
  *How should "proof" be defined when PP applies? (e.g., proof of safety? plausibility of harm? feasibility of alternatives?)*  
  - **Why Tier 3?**  
    Only becomes meaningful *after* establishing PP applies (Q1) and why (Q2). Downstream debates about proportionality/reversibility depend on this.  
  - **Tractability:**  
    Medium. Requires conceptual analysis but benefits from phil-sci tools (e.g., robustness analysis, hypothesis testing). Avoids econometric quantification.  
  - **Neglect:**  
    Moderate. Often debated in law/policy, but rarely grounded in epistemology of evidence (e.g., what constitutes "sufficient evidence" for safety under non-probabilism?).  
  - **How to Move:**  
    - **↑** If tied to Q1/Q2 (e.g., showing burden definitions must co-evolve with uncertainty types).  
    - **↓** If burden criteria prove context-specific with no generalizable principles.  

  ---

  ### Your Framing Assessment: Correct but Needs Sharpening  
  You’re right that **the core conflict is epistemic** (threat vs. risk framing), not first-order action-guidance. But this isn’t a redescription hiding hard cases—it *exposes* them. For example:  
  - Critics attack PP as "paralyzing" because they assume *all* hazards allow probabilistic framing.  
  - Defenders invoke PP for "unquantifiable" harms but lack criteria for unquantifiability.  
  **The hard cases (e.g., AI existential risk, low-dose chemical exposure) are precisely where this demarcation is contested.** Your hypothesis holds, but needs to engage:  
  1. **Ontological dimension:** Are some harms intrinsically non-probabilistic (e.g., value incommensurability)?  
  2. **Pragmatic dimension:** Does "treat as threat" depend on societal values or only epistemic factors?  

  ---

  ### Confidence & Caveats  
  - **Overall Confidence in Ranking:** 75%  
    - Strongest: Q1 as upstream anchor. Demarcation failure explains PP’s "incoherence" critiques.  
    - Weakest: Q3 over proportionality. Proportionality is pressing in policy, but philosophically downstream.  
  - **Key Risk:** Legal/policy scholars may insist proportionality is equally upstream. Rebuttal: Without demarcation, we don’t know *what* to proportion precaution to.  

  ### Strategy for Your Dissertation  
  1. **Anchor in Q1:** Analyze paradigmatic PP disputes (e.g., EU vs. US on synthetic biology) through the threat/risk lens.  
  2. **Leverage Phil-Sci Tools:** Use modeling literature (e.g., how climate scientists handle "deep uncertainty") to ground demarcation criteria.  
  3. **Avoid:** Defending/attacking PP wholesale. Instead, ask: *"When, if ever, is this framing justified?"*  

  This agenda resolves the loop by targeting the shared epistemic blind spot. If successful, you won’t just "contribute" to PP debates—you’ll restructure them.
