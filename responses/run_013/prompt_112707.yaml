prompt: |-
  I've spent years reading rationalist blogs and forums on emergence and reduction, and I've come to suspect that most of the disagreement dissolves the moment people say what they are actually demanding of a theory. So before I read another account of emergence, I want the specification first.

  Write the desiderata that any adequate theory of emergence in science must satisfy. For each requirement, give the case or consideration that motivates it, and say whether it is non-negotiable or merely a preference of one camp.

  I expect the list to cover at least:

  - The phenomena it must get right: renormalization-group universality, where distinct microphysics yield the same macro-laws; phase transitions that exist only in the thermodynamic limit; and coarse-grained variables that are predictively indispensable even though the microdescription in principle suffices.
  - The distinctions it must not collapse: above all between emergence-for-us (a fact about our computational and cognitive limits) and emergence-in-principle (a claim about what the world's furniture actually is), and between a macro-law that is merely convenient and one that supports autonomous counterfactuals.
  - The results it must stay consistent with: the causal closure of fundamental physics, the non-uniqueness of coarse-graining, and the gap between "derivable in principle" and "derivable in practice."

  Two constructed cases I want the theory to adjudicate, because I suspect they pull the desiderata apart:

  1. A deterministic cellular automaton whose microdynamics I specify, together with a macro-variable that (a) obeys an exact closed-form update, (b) supports counterfactuals that match the microdynamics, but (c) can be computed from the microstate only by a procedure no physically realizable machine could run. Is this emergent? Which desideratum decides it?
  2. A macro-variable that is predictively useful for forecasting but whose counterfactuals come apart from the microdynamics under intervention — the macro level misrepresents what would happen if you intervened. Must a theory of emergence exclude this, or can it count as a species of emergence?

  Assume the purpose is metaphysical: I want to know what is in the world, not merely what is useful for modeling. Say explicitly whether that purpose drops any of the requirements from the list, or changes which are negotiable.

  Then flag any pair of desiderata you believe cannot be jointly satisfied — I am especially interested in whether explanatory autonomy for higher-level laws can be had without either causal overdetermination or epiphenomenalism. Finally, name the single requirement that does the most work in excluding candidate theories, and say why. Keep any scoring of named approaches brief; the criteria are what I am after.
reasoning: |-
  Okay, let me approach this systematically. The user presents a highly sophisticated request about emergence theories after years of engagement with rationalist discourse. They're clearly frustrated with unproductive debates and want rigorous criteria upfront.

  Hmm, the core challenge is balancing three aspects: metaphysical aspirations (what's really in the world), scientific practice (renormalization, phase transitions), and conceptual distinctions (emergence-for-us vs in-principle). The user's constructed cases are particularly sharp tests.

  First, I need to establish non-negotiable desiderata. The causal closure of physics seems bedrock - any emergence theory violating this would contradict established science. Universality classes and thermodynamic limits are non-negotiable too; they're empirically validated phenomena. But the predictive indispensability requirement might be softer - some camps could accept purely epistemic emergence.

  For the autonomy-counterfactuals link... this is tricky. The user wants metaphysics, so autonomous counterfactuals must track reality, not just usefulness. But avoiding causal overdetermination is crucial. Maybe I can resolve this through non-redundancy - the macro-law adds explanatory value without adding new causes.

  The two test cases expose fault lines. In the cellular automaton case, the exact closed-form macro-update suggests objective emergence, but physical irreducibility pushes toward epistemic emergence. I'll have to let the desiderata decide which aspect dominates. For the misleading macro-variable, it fails counterfactual fidelity - which for a metaphysical project should exclude it from being "real" emergence.

  Biggest tension is between explanatory autonomy and causal closure. If macro-laws are explanatorily autonomous but don't add new causes, maybe they're patterns that supervene without causal overdetermination? The non-redundancy desideratum becomes key here.

  Most exclusionary desideratum is likely counterfactual fidelity - it immediately rules out instrumentalist approaches and forces confrontation with what the macro-description actually represents about reality. Renormalization universality and phase transitions survive because their counterfactuals hold.

  For the cellular automaton case, I'll conclude it's emergent-in-principle based on counterfactual fidelity and autonomy, despite computational irreducibility. The misleading macro-variable fails because its counterfactuals diverge - that's fatal for metaphysical emergence.

  Throughout, I'll maintain that the metaphysical purpose elevates ontological commitments (like objective patterns) over purely epistemic considerations, while respecting physics' causal closure.
answer: |-
  Here is a specification of desiderata for an adequate metaphysical theory of emergence, structured as requested. The list prioritizes non-negotiable constraints motivated by scientific practice and logical coherence, while noting negotiable preferences reflecting different philosophical camps. Constructed cases are adjudicated, tensions are flagged, and the most exclusionary desideratum is identified.

  ---

  ### **Core Desiderata for a Theory of Emergence (Metaphysical Purpose)**

  1.  **Non-Negotiable: Causal Closure of Fundamental Physics (Completeness)**
      *   **Motivation:** Empirical success of physics; absence of empirical evidence for non-physical causation. Any higher-level causation must be consistent with microphysical causation without gaps or additions.
      *   **Non-Negotiable:** Violating this contradicts the foundational framework of modern science. Emergence cannot imply "magic" or fundamental causal gaps.

  2.  **Non-Negotiable: Universality Capture (Distinct Micro, Same Macro)**
      *   **Motivation:** Renormalization group (RG) universality classes. Radically different microphysical systems (e.g., diverse fluids/magnets near critical points) exhibit identical large-scale behavior and critical exponents governed by a few macro-parameters (symmetry, dimension).
      *   **Non-Negotiable:** A theory failing to account for this robust phenomenon ignores a cornerstone of how complexity arises from simplicity in physics. Emergence *must* explain how micro-details become irrelevant.

  3.  **Non-Negotiable: Genuine Singularity/Non-Analyticity Requirement**
      *   **Motivation:** Phase transitions (e.g., spontaneous magnetization, boiling) strictly occur only in the thermodynamic limit (N→∞). Finite systems show smooth crossovers; the sharp transition is an emergent singularity.
      *   **Non-Negotiable:** A theory claiming emergence merely from complexity or ignorance misses this essential *qualitative* difference between finite and infinite systems defining true phase transitions.

  4.  **Non-Negotiable: Counterfactual Fidelity of Macro-Descriptions**
      *   **Motivation:** Distinguishing *merely convenient* descriptions (e.g., "average hair color") from *autonomous* macro-laws (e.g., Navier-Stokes equations, thermodynamics). Autonomous laws must generate accurate counterfactuals about system behavior under interventions *that align with the micro-dynamics*.
      *   **Non-Negotiable (for Metaphysics):** For a theory about "what is in the world," macro-laws must track real patterns of behavior and constraint, not just summarize past data. Misleading counterfactuals indicate the description isn't capturing real causal structure.

  5.  **Non-Negotiable: Distinction Preservation (Emergence-in-Principle vs Emergence-for-Us)**
      *   **Motivation:** Avoiding conflation. A chaotic system's unpredictability is "for-us" (computational limits), while RG universality or phase transitions appear "in-principle" (independent of observer capabilities). Confusing them obscures ontology.
      *   **Non-Negotiable:** Essential for clarity. A metaphysical theory *must* ground emergence-in-principle in objective features of the system/world, not observer limitations.

  6.  **Negotiable (Strong Preference): Predictive Indispensability of Macro-Descriptions**
      *   **Motivation:** Coarse-grained variables (e.g., pressure, temperature, fitness) are often *practically essential* for prediction and explanation, even if the micro-state "in principle" suffices. Their utility suggests they track something real.
      *   **Negotiable:** While strong evidence for realism about macro-patterns, radical reductionists might argue it's *only* about our cognitive/calculational limits (epistemic emergence). For metaphysics, it's highly suggestive but potentially derivable from other desiderata.

  7.  **Non-Negotiable: Non-Uniqueness of Coarse-Graining Compatibility**
      *   **Motivation:** Multiple valid coarse-grainings can be applied to the same micro-system (e.g., different RG schemes, different sets of macro-variables in biology). Emergence shouldn't depend on one "privileged" coarse-graining.
      *   **Non-Negotiable:** Physics demonstrates that different effective descriptions can be valid for different purposes/scales. A theory implying a single "true" emergent level contradicts practice.

  8.  **Non-Negotiable: Bridge "Derivable in Principle" vs "Derivable in Practice"**
      *   **Motivation:** Acknowledging the vast conceptual and computational gulf. RG flow equations or thermodynamic potentials are derived using highly non-trivial mathematical procedures (limits, approximations) far removed from brute-force micro-simulation. Emergence often involves novel *conceptual frameworks*.
      *   **Non-Negotiable:** A theory reducing emergence simply to "it would take too long to compute" misses the conceptual novelty and autonomy of the macro-laws.

  9.  **Non-Negotiable: Explanatory Autonomy without Causal Overdetermination/Epiphenomenalism**
      *   **Motivation:** Macro-laws (e.g., natural selection, thermodynamics) provide powerful, often *causal*, explanations seemingly irreducible to micro-causal chains. Yet, micro-causes seem sufficient. How can macro-explanations be autonomous and causal without either 1) macro-causes overdetermining micro-effects or 2) macro-properties being causally inert (epiphenomenal)?
      *   **Non-Negotiable:** Resolving this tension is *the* core challenge for metaphysical emergence. It must provide a coherent account of macro-causation compatible with micro-closure. Failure leads to paradox or eliminativism.

  ---

  ### **Adjudication of Constructed Cases**

  1.  **Deterministic CA with Closed-Form Macro-Update (Physically Uncomputable):**
      *   **Desiderata Conflict:** Counterfactual Fidelity (4) & Autonomy (9) vs. Bridge Principle (8) & Emergence-in-Principle (5).
      *   **Adjudication:** This **is Emergence-in-Principle**.
          *   (a) & (b): The macro-variable has an *exact, closed-form update law* generating *micro-aligned counterfactuals*. This satisfies Counterfactual Fidelity (4) and strongly suggests Explanatory Autonomy (9) – the macro-law captures a real pattern governing behavior.
          *   (c): Physical uncomputability demonstrates Emergence-*in-Principle* (5) – the pattern's existence is objective, not dependent on our limits. The Bridge Principle (8) is respected: derivation requires a conceptual leap (finding the closed form), not brute computation.
      *   **Deciding Desideratum:** Counterfactual Fidelity (4) is paramount. The macro-law accurately describes the system's real behavior under intervention, aligning with microdynamics. Its autonomy is genuine.

  2.  **Predictively Useful but Counterfactually Misleading Macro-Variable:**
      *   **Desiderata Conflict:** Predictive Indispensability (6) vs. Counterfactual Fidelity (4) & Causal Closure (1).
      *   **Adjudication:** This **is NOT Emergence (metaphysical)**.
          *   While predictively useful (satisfying 6, weakly), its counterfactuals diverge from the microdynamics under intervention (violating 4). It misrepresents the actual causal structure.
          *   If interventions at the macro-level produce results inconsistent with micro-interventions, this risks violating Causal Closure (1) by implying macro-causation untethered from micro-causation, or simply being an instrumental artifact.
      *   **Deciding Desideratum:** Counterfactual Fidelity (4) is non-negotiable for metaphysical emergence. Utility without accuracy under intervention describes a useful *instrumental model*, not a discovered autonomous causal level.

  ---

  ### **Impact of Metaphysical Purpose**

  *   **Drops/Weakens:** Predictive Indispensability (6) shifts from strong evidence to a negotiable heuristic. While useful, metaphysical reality hinges more on counterfactual fidelity and autonomy.
  *   **Strengthens:** Counterfactual Fidelity (4), Distinction Preservation (5), and Explanatory Autonomy without Overdetermination (9) become absolutely central and non-negotiable. Emergence-*for-us* is sidelined.
  *   **Clarifies Focus:** The purpose demands that desiderata like Universality (2), Singularity (3), and the Bridge Principle (8) be interpreted ontologically – they reveal objective features of the world's structure, not just useful modeling tricks.

  ---

  ### **Flagged Tensions & Key Challenge**

  *   **Core Tension:** Explanatory Autonomy without Causal Overdetermination/Epiphenomenalism (9) vs. Causal Closure (1).
      *   *Resolution Path:* Most viable approaches involve **non-redundant causal patterning** or **causal relevance via difference-making**. Macro-properties are not *additional* causal shoves (avoiding overdetermination) but are causally relevant because they capture patterns where variations at the macro-level make a difference to outcomes *in virtue of* realizing micro-constituents organized in specific ways. The autonomy lies in the *stability* and *projectibility* of the pattern, not in fundamental causal forces. This avoids epiphenomenalism by grounding macro-causal claims in real micro-difference-making patterns. (Success here depends heavily on satisfying Counterfactual Fidelity (4) and Universality (2)).

  ---

  ### **Most Exclusionary Desideratum: Counterfactual Fidelity (4)**

  *   **Why:** It performs the most critical filtering work.
      *   It cleanly separates genuinely autonomous macro-laws (Navier-Stokes, thermodynamics, natural selection when properly applied) from mere summaries, conveniences, or instrumental fictions (like the misleading macro-variable in Case 2).
      *   It forces the theory to confront the *causal structure* implied by the macro-description, directly linking to the core metaphysical challenge (Autonomy vs. Closure - Desideratum 9).
      *   Many popular accounts (e.g., "weak emergence" as computational irreducibility, purely epistemic emergence) fail this test. While computationally irreducible systems may *also* have emergent laws (like Case 1), computational irreducibility alone doesn't guarantee a macro-law with *autonomous counterfactual power*. A system can be irreducible yet lack any useful higher-level description capturing real causal patterns. Counterfactual Fidelity requires the existence of robust, projectible macro-*laws*, not just complexity.

  ---

  ### **Brief Scoring of Approaches Against Desiderata**

  *   **Strong Emergence (e.g., Broad):** Fails Causal Closure (1). Excluded.
  *   **Eliminativism / Radical Reductionism:** Fails Universality (2), Singularity (3), Predictive Indispensability (6), Explanatory Autonomy (9). Excluded.
  *   **Purely Epistemic Emergence:** Fails to capture Emergence-in-Principle (5), Universality (2), Singularity (3) as objective features; struggles with Counterfactual Fidelity (4) for autonomous laws. Excluded for metaphysical purpose.
  *   **Weak Emergence (Computational Irreducibility - e.g., Bedau):** Necessary but insufficient. May satisfy Bridge Principle (8) but doesn't guarantee a macro-law with Counterfactual Fidelity (4) or Explanatory Autonomy (9). Needs supplementation.
  *   **Mechanistic Emergence / Dynamical Systems (e.g., Batterman, Morrison):** Strong on Universality (2), Singularity (3), Bridge Principle (8), Non-Uniqueness (7). Focuses on explaining Autonomy (9) via stability, universality, and constraints. Faces challenge in fully articulating Counterfactual Fidelity (4) and non-redundancy within Causal Closure (1), but most promising path.
  *   **Causal Relevance / Difference-Making (e.g., List, Menzies):** Directly addresses Autonomy (9) and Counterfactual Fidelity (4) within Causal Closure (1) framework. Needs careful integration with specific features like Singularity (3) and Universality (2).

  **Conclusion:** An adequate metaphysical theory must ground emergence in *objective patterns characterized by stable, projectible, counterfactually robust macro-laws* that arise from, but are not reducible *in practice or conception* to, micro-dynamics due to features like universality, singular limits, and constraints, while respecting causal closure via non-redundant causal relevance. Desideratum 4 (Counterfactual Fidelity) is the keystone.
