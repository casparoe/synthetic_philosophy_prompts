answer: |-
  Below is a Q&A prep sheet tailored to your workshop context, audience composition, and core claim. Objections are ordered by potential damage (high to medium), with concise replies, notes on soft spots, and concession flags. Language adheres strictly to British English conventions.

  ---

  ### **Q&A Prep Sheet: Defending the Ledger Assumption Critique**  
  **Core Claim**: The money-pump argument only demonstrates irrationality in cyclic preferences *if* we accept the Ledger Assumption (LA). Rejecting LA reveals the pump as mere exploitability in specific markets, not a rationality failure. Cyclic agents avoid exploitation by refusing "fungible plan" treatment.  

  ---

  ### **High-Damage Objections**  
  *(Threaten core argument logic or audience buy-in)*  

  1. **Objection (Economists/Decision Theorists):**  
     *"This ignores the foundational link between rationality and no-arbitrage. If your agent’s preferences permit cycles, they create arbitrage opportunities *by definition*. Refusing to sum choices doesn’t erase the incoherence—it just masks it with narrative."*  
     **Reply (1.5 mins):**  
     "Rationality isn’t synonymous with market exploitability. The money-pump relies on LA to *equate* sequential arbitrage with irrationality. Without LA, cyclic preferences aren’t incoherent—they’re *non-fungible*. An agent who values plans holistically (e.g., ‘I’ll trade A for B, but not B for A as part of a pump’) isn’t inconsistent; she’s imposing constraints on how choices compose. No-arbitrage assumes fungibility; rejecting that assumption decouples exploitability from rationality."  
     **Soft Spot:**  
     Economists may dismiss this as "special pleading." Stress that *non-fungibility* is a recognised feature in behavioural economics (e.g., mental accounting), but concede it challenges neoclassical axioms.  

  2. **Objection (Time-Slice Philosophers):**  
     *"You posit an ‘agent’ who ‘refuses’ fungibility, but if there’s no persistent self, how can ‘she’ bind future choices? Your ‘holistic plan’ is just time-slice A imposing values on time-slice B—which *is* irrational if B locally prefers the trade."*  
     **Reply (2 mins):**  
     "The objection assumes time-slices must be maximisers. But planning *is* a diachronic phenomenon: a time-slice can coherently commit to a rule (‘no cycles’) without a metaphysical self. Crucially, the *plan* has non-instrumental value—it’s not just aggregating local preferences. Rejecting LA means the plan’s value isn’t reducible to its parts. If time-slice B breaks the plan, it’s not irrationality; it’s a *new agent* rejecting prior constraints, which is why pumps require coercion."  
     **Soft Spot:**  
     This relies on plans having intrinsic value—contentious for reductionists. Distinguish "coherence over time" from "persistent self" to avoid metaphysics.  

  3. **Objection (Kant-Inspired Critic):**  
     *"Calling this ‘non-fungibility’ glorifies weakness of will. Your agent ‘plans’ not to be pumped but crumbles when offered each local trade—which *is* irrational if she prefers the trade’s outcome. Resolute choice is just self-deception."*  
     **Reply (1.5 mins):**  
     "Resoluteness isn’t weakness if the plan has independent rational weight (e.g., maintaining identity or avoiding exploitation schemes). Crumbling *would* be weak if LA held—but without it, local preferences don’t dictate global rationality. The agent isn’t deceiving herself; she’s recognising that the *context* of the pump (e.g., predatory markets) invalidates treating choices atomistically. What you call ‘crumbling’ I call *contextual sensitivity*."  
     **Soft Spot:**  
     Hard to prove the plan isn’t post hoc rationalisation. Emphasise that markets can be designed to exploit *any* non-standard preference.  

  ---

  ### **Medium-Damage Objections**  
  *(Challenge implications but not core logic)*  

  4. **Objection (Incomplete Preferences Scholar):**  
     *"Why reframe cyclic preferences as ‘rational’ under anti-LA? Incompleteness (e.g., ‘I won’t rank A vs B’) avoids money-pumps without denying rationality or summation."*  
     **Reply (1 min):**  
     "Agreed—but incompleteness assumes cycles *are* irrational and avoids them. My claim is stronger: cycles *can* be rational if LA is rejected. Your approach is a workaround; mine attacks the pump’s foundational assumption. They’re compatible, but mine explains why agents might *have* cycles deliberately."  
     **Concede & Move On?**  
     **Yes.** Nod to incompleteness as a solution, then pivot: "This shows multiple escapes exist—further undermining the pump’s necessity."  

  5. **Objection (Decision Theorists):**  
     *"Without LA, how do you assign value to sequences? If not summation, what? This seems ad hoc."*  
     **Reply (1 min):**  
     "Value assignment needn’t be additive. Plans can have emergent properties (e.g., narrative integrity or anti-exploitability). We do this routinely: quitting smoking isn’s summed craving-avoidance. The pump forces a *specific* composition rule (LA); rejecting it opens room for others."  
     **Soft Spot:**  
     "Emergent properties" may sound hand-wavy. Cite empirical work on plan-based valuation (e.g., in neuroeconomics) for credibility.  

  ---

  ### **The One You're Dreading**  
  **Objection (Time-Slice + Kant Hybrid):**  
  *"If your ‘agent’ is just time-slices agreeing a plan, why can’t a later slice renegotiate? Calling this ‘anti-fungibility’ sounds like tyranny of the past self. And if the slice *locally* prefers the trade, refusing it *is* weakness—you’ve just rebranded stubbornness as ‘rational’."*  
  **Reply (2 mins):**  
  "Renegotiation isn’t tyranny if the plan serves a shared interest (e.g., avoiding exploitation). Crucially, without LA, *local* preference for a trade doesn’t imply *global* error—the plan’s value isn’t hostage to momentary states. What looks like ‘stubbornness’ is enforcing a precommitment against manipulative contexts. Strength of will isn’t about maximising locally; it’s about maintaining agency across time. The pump *requires* slicing agency into exploitable fragments—rejecting that isn’t irrational, it’s self-preservation."  
  **Damage Control:**  
  Acknowledge the tension: "This *is* where time-slice and whole-agent views clash. But even on reductionist terms, a plan can be a Nash equilibrium among selves."  

  ---

  ### **Strategic Concessions**  
  - **Always concede** that cyclic preferences are *exploitable* in LA-governed markets. This neutralises economists: "I agree it’s arbitrage—but arbitrage ≠ irrationality."  
  - **Concede** that incompleteness avoids pumps (Objection 4) but stress it’s distinct from your argument.  
  - **Do not concede** on LA’s necessity for the pump’s irrationality charge—this is your core.  

  **Final Tip**: Pre-empt the Ledger Assumption by name early in your talk. Frame objections as *assuming* LA, forcing critics to defend it explicitly.  

  ---  
  *Good luck with the workshop. If they throw curveballs, remember: "That assumes fungibility" is your shield. —Fussy British Copy-Editor* 😉
