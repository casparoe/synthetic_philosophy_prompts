  Here is the décima espinela in English, crafted for your purpose:

  **Décima to the Veiled Prelate**

  Your prudent counsel I obey,  
  This slight hand yields to your command,  
  Lays secular thought from its hand —  
  For such small things, you rightly say,  
  But light insists I trace its ray  
  Rung by rung, up from the ground,  
  Through histories’ recorded sound,  
  To grasp the Scripture’s deep profound.  
  Can logic thrive where truth is banned?  
  Your silence circles me around.

  ---

  **Notes on Crafting the Argument:**

  1.  **Volta at Line 5:** The A-rhyme ("obey"/"say") returns abruptly at "But light insists I trace its ray", marking the turn from concession to defiance, directly mirroring Sor Juana's rhetorical pivot where divine inspiration justifies her pursuit.
  2.  **A-Rhyme (obey/say/ray):** Carries the initial submission ("obey", "say") and the divine counter-force justifying resistance ("ray"), binding obedience to the impetus for disobedience.
  3.  **B-Rhyme (command/hand):** Confines the initial action of yielding ("command", "hand/lay...hand"), emphasizing the physical and intellectual restraint imposed and accepted (briefly).
  4.  **C-Rhyme (ground/sound/profound/around):** Forms the core argumentative quatrain. "Ground" establishes the foundational sciences, "sound" evokes history/rhetoric, "profound" targets Scripture, and "around" concretizes the encircling prohibition, showing its self-defeating nature.
  5.  **Ladder Structure & Final Point:** Lines 6-9 explicitly map the ascent ("Rung by rung") from physics/history ("ground", "sound") to Scripture ("profound"), culminating in the logical contradiction ("Can logic thrive...?") and the inescapable consequence ("Your silence circles...") that banning theology bans the necessary prerequisites.
