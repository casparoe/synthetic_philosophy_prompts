prompt: |-
  I edit a small press that does religious-studies textbooks and study editions, and I have a problem I need help with. Every manuscript we take in is full of sentences like "Jesus said X", "Jesus did Y", "the historical Jesus was a Z" — and I have to decide, claim by claim, what our footnote says. Right now my two freelance copy-editors (neither has a PhD, both have a decent undergrad background) basically vibe it out: if it sounds like something they've heard a lot they write "widely regarded as authentic," and otherwise they write nothing. An academic reviewer tore us apart over this last month, fairly.

  So: take the role of a biblical scholar with one foot in the philosophy of history, think this through carefully, and build me a procedure — a checklist to be run in order — for deciding what to say about a single claim of the form "Jesus did/said/was ___". Start by brainstorming what such a procedure has to be able to handle, then write the procedure itself, then do the worked cases.

  The procedure should:

  - fix the target. I care about three different things and I suspect my copy-editors keep sliding between them: whether the claim reports something the man actually said or did (authenticity), whether it belongs in the best reconstruction of what he was up to (historicity), and what it tells us about the community that preserved it. Say how a verdict on one is supposed to constrain the others, and where it must not.

  - say which standard criteria to apply, in what order and with what weight — embarrassment, dissimilarity/discontinuity, multiple attestation, coherence, fit with the Jewish Palestinian setting, the fact of the execution — and for each: what counts as it firing, what doesn't (I've watched them count four documents as four witnesses when two of them are the same story retold), and the particular way it tends to go wrong or beg the question. I want a circularity check built in: for every criterion that fires, the practitioner has to write down whether it already assumed the conclusion it's supposed to support.

  - be honest about the thing I keep reading, that these criteria are widely thought to be broken in some deep way. Don't just wave at that — say which uses survive and which don't, and build the procedure so it can't fake precision it doesn't have.

  - output a verdict from a small fixed set of labels, a confidence marker, and a one-line rationale that can go into a footnote without embarrassing us.

  - run in twenty minutes, by someone with no Greek or Hebrew and no library.

  - say where the procedure stops with a no, and where it hands the decision back to a human — me, or the outside consultant we can afford maybe twice a year — and which of those handoffs are factual disputes versus just our own editorial/religious position.

  Then run it end to end on three claims: (1) Jesus was baptized by John; (2) Jesus taught something along the lines of loving your enemies; (3) the tomb was found empty. At least one verdict should be one I won't like — if the procedure says the ethical teachings come out weaker than something I'd rather not print, say so and show me the steps.

  Last thing, a calibration test: give my copy-editors a control case, a claim about a figure from a totally different tradition where we have independent reason to think the attribution is late, and tell them what the procedure should return on it, as a check that this isn't just a machine for saying yes.

  Dont give me citations or a reading list — describe positions in plain English, and if a criterion's name is contested just describe what it does. Be upfront at the end about what this procedure can't do.
reasoning: |-
  Okay, the user runs a small press for religious studies textbooks and has an issue with how claims about Jesus are footnoted. The current method relies on copy-editors' vibes, which an academic reviewer criticized. They need a systematic procedure to evaluate claims about Jesus' actions or words, focusing on authenticity, historicity, and community meaning. The procedure must be clear, avoid circularity, and be usable by non-experts in 20 minutes.

  First, I need to understand the core problems: distinguishing between authenticity (what Jesus actually did/said), historicity (its role in his mission), and community significance. These are interlinked but distinct. Authenticity is foundational; without it, historicity is moot. Community meaning can stand alone even if authenticity is weak. The procedure must clarify these relationships upfront.

  Next, the criteria. Common ones like embarrassment, dissimilarity, multiple attestation, coherence, Palestinian setting, and execution must be defined carefully. Each needs clear triggers and pitfalls. For example, multiple attestation should only count independent sources, not derivatives. Crucially, each criterion must be checked for circularity—does it assume the conclusion? This step prevents biased reasoning.

  The user mentioned these criteria are criticized. I should acknowledge that. Dissimilarity is especially problematic as it assumes Christian additions but ignores Jewish influences. The procedure must use it sparingly. Embarrassment is stronger but rare. The key is to use criteria to flag possibilities, not certainties, and combine them for a balanced view.

  The procedure must output a verdict with a confidence level and a brief rationale. Labels should be standardized: "authentic," "historically plausible," etc. Confidence markers (high, moderate, low) add nuance. The rationale must fit in a footnote without overclaiming.

  Usability is crucial. No Greek/Hebrew, no library, 20 minutes per claim. Steps should be sequential, with clear exits. If criteria conflict or data is insufficient, it flags for human review. Handoffs to editors should distinguish factual disputes (needing expert input) from editorial decisions (publisher's stance on sensitivity).

  Now, the worked examples. Baptism by John: passes embarrassment (early Christians wouldn't invent this), multiple attestation (Mark, Q, John), fits John's movement. High confidence in authenticity. Loving enemies: multiple attestation (Q, Paul), coherence with other teachings, but dissimilarity weak. Moderate confidence. Empty tomb: only in later Gospels, no early attestation, possible apologetic motive. Low confidence; handoff due to sensitivity.

  For the control case, something like "Buddha was born from a white elephant." Late attribution, no early sources. Procedure should return "not authentic" with high confidence, testing the system's ability to reject claims.

  Finally, limitations. The procedure can't resolve deep scholarly disputes, handle nuanced literary analysis, or replace expertise in original languages. It flags areas needing expert input but provides a transparent, consistent method for most claims. This balances rigor with practicality for the press's needs.
answer: |-
  Here's a procedure designed for your copy-editors, incorporating your requirements and addressing the core challenges of historical Jesus claims. It's built on critical scholarship while acknowledging its limitations.

  **Core Concepts & Target Fixing:**
  1.  **Authenticity:** Did the specific event/saying *likely occur* as described or in a substantially similar form in the life of the historical Jesus of Nazareth? (Target: The man).
  2.  **Historicity:** Does this authentic event/saying play a *significant role* in our best *reconstruction* of Jesus' core mission, message, and impact? (Target: The reconstructed figure & his project).
  3.  **Community Meaning:** What does the *presence and form* of this tradition tell us about the beliefs, concerns, or practices of the early communities that preserved and transmitted it, *regardless of authenticity*? (Target: The early Christians).
  *   **Relationship:** Authenticity is a prerequisite for assessing Historicity. Something must be authentic *before* its role in Jesus' mission can be evaluated. Community Meaning operates independently – a story can be entirely legendary but *very* informative about the community that created/cherished it. A verdict on Authenticity *constrains* Historicity; it *does not* constrain Community Meaning.

  **The Procedure: A Step-by-Step Checklist**

  *   **Time Budget:** Aim for 15 mins per claim. Steps 1-4 should take <5 mins. Steps 5-7 are the core analysis (10 mins). Steps 8-10 are summary (2 mins).
  *   **Tools:** Access to a standard synopsis of the Gospels (showing parallels) is essential. Basic knowledge of NT books & approximate dating (Mark early, John late, Paul's letters early) is assumed. No Greek/Hebrew needed.
  *   **Mindset:** Think "probability based on available evidence," not "proof." Flag assumptions.

  **Step 1: Parse the Claim**
      *   Write down the exact claim being made (e.g., "Jesus was baptized by John").
      *   Identify the *primary* Gospel sources mentioning it (use synopsis).
      *   Identify any *early non-Gospel* sources (Paul, early creeds in Paul, James? Ignatius? - be cautious).

  **Step 2: Initial Community Meaning Check (Fast Track)**
      *   Is the claim *only* found in late sources (e.g., only in John, or only in later apocrypha)? **If YES:** Output: **"Community Tradition" (High Confidence).** Rationale: "Attested only in later sources, reflecting developing community beliefs/practices." **STOP HERE.** (Authenticity unlikely, Historicity N/A).
      *   **If NO:** Proceed.

  **Step 3: Identify Potential Contradictions (Fast Filter)**
      *   Does the claim *directly and unambiguously* contradict *multiple, early, independent* sources on a core point? (e.g., claiming Jesus was a Roman soldier contradicts *everything*). **If YES:** Output: **"Historically Implausible" (Mod-High Confidence).** Rationale: "Contradicts multiple early independent accounts." **STOP HERE.** (Authenticity unlikely, Historicity N/A).
      *   **If NO:** Proceed. (Most claims won't hit this).

  **Step 4: Define Criteria & Check Circularity (Meta-Step)**
      *   Before applying criteria, define what each *means* and its *pitfall* for *this specific claim*:
          *   **Embarrassment:** Would this detail likely cause difficulty *for the early church* promoting Jesus? (Pitfall: Did the church *embrace* it despite potential embarrassment? Could it serve an *apologetic* purpose?).
          *   **Dissimilarity/Discontinuity:** Is the saying/action *distinct* from: a) Common *Jewish* teaching/practice of the time? b) The agenda/teachings of the *early church*? (Pitfall: Assumes we know 1st-century Judaism & early church perfectly. Risks making Jesus inexplicable. Use cautiously, primarily for *distinctiveness* not *proof*).
          *   **Multiple Attestation:** Is the claim found in *multiple, independent* sources/literary traditions? (e.g., Mark, Q (via Matt/Luke parallels), Special Matthew (M), Special Luke (L), John, Paul, non-canonical *early* sources). **CRITICAL:** Only count *independent* strands. Mark copied by Matt/Luke counts as *ONE* witness (Mark). Matt/Luke sharing Q material counts as *ONE* witness (Q). John is usually separate. Paul is separate. (Pitfall: Counting dependent sources as multiple).
          *   **Coherence:** Does the claim fit *well* with other material established as authentic (through other criteria)? (Pitfall: Circular! Can only be applied *after* other criteria establish a core. Use it to *support*, not establish).
          *   **Jewish Palestinian Setting:** Is the claim *plausible* within the known context of 1st-century Jewish Palestine (socially, religiously, politically)? (Pitfall: Too broad – many things *could* be plausible. Mainly a negative filter: if it *doesn't* fit, that's a problem).
          *   **Execution Context:** Does the claim help *explain* why Jesus was executed by Roman authority (as an unambiguous historical fact)? (Pitfall: Not all authentic material needs to explain the execution. Use to support significance, not existence).
      *   **Circularity Check:** For each criterion applied, the user *must* write 1-2 sentences: "Using Criterion X assumes Y? Could it be explained by Z instead?" (e.g., "Using Dissimilarity assumes we know early church theology perfectly? Could this teaching actually *arise* from early church debates?").

  **Step 5: Apply Primary Criteria (Authenticity Focus)**
      *   Apply **Embarrassment**. Does it fire? (High weight if genuine). Note Circularity Check.
      *   Apply **Multiple Attestation**. How many *independent* sources? (High weight: 2+ independent sources = strong evidence). Note Circularity Check (e.g., "Are these sources truly independent?").
      *   Apply **Jewish Palestinian Setting** (as plausibility filter). Does it *fail*? (If it fails badly, weakens case). Does it fit well? (Supports, but weakly). Note Circularity Check.
      *   Apply **Dissimilarity** *cautiously*. Is it strongly dissimilar from *both* Judaism *and* early church? (Moderate weight if clear, but note its weakness). Note Circularity Check extensively.

  **Step 6: Assess Authenticity Verdict**
      *   **High Confidence Authentic:** Strong Embarrassment *or* Strong Multiple Attestation (2+ indep sources) *plus* fits Jewish setting. Dissimilarity a bonus.
      *   **Moderate Confidence Authentic:** Moderate Multiple Attestation (e.g., 1 strong indep source + hints elsewhere) *or* Embarrassment *plus* fits Jewish setting. Dissimilarity neutral or supportive.
      *   **Low Confidence Authentic:** Weak/No Multiple Attestation, No Embarrassment, fits Jewish setting *or* Dissimilarity is the *only* support (weak). Coherence might offer slight support if other core exists.
      *   **Not Authentic (Community Tradition):** Only late sources, OR fails Jewish setting badly, OR strong evidence of development/contradiction, OR *only* supported by Coherence/Dissimilarity with no other criteria. (Be conservative - 'Low Confidence' often safer than 'Not').

  **Step 7: Assess Historicity (IF Authentic)**
      *   **IF Authenticity verdict is High/Mod:** Does the claim relate *directly* to Jesus' core activities (teaching, healing, conflict, kingdom proclamation) *and/or* help explain his execution? **If YES:** Label **"Historically Significant"**. **If NO (e.g., minor biographical detail):** Label **"Authentic Detail"**.
      *   **IF Authenticity verdict is Low:** Label **"Historicity Uncertain"**. (Cannot reliably assess its role).
      *   **IF Authenticity = Not/Community:** Historicity **N/A**.

  **Step 8: Formulate Community Meaning (ALWAYS)**
      *   Briefly state what the *presence and form* of the tradition suggests about the community, regardless of authenticity. (e.g., "Emphasizes Jesus' humility/submission," "Highlights ethical rigor," "Addresses doubts about resurrection," "Reflects conflict with Jewish authorities").

  **Step 9: Final Verdict & Rationale**
      *   Combine Authenticity/Historicity verdicts and Confidence. Use these labels:
          *   `Authentic & Historically Significant (Confidence: High/Mod/Low)`
          *   `Authentic Detail (Confidence: High/Mod/Low)`
          *   `Historicity Uncertain (Confidence: Low)` (Implies weak authenticity)
          *   `Community Tradition (Confidence: High/Mod)`
          *   `Historically Implausible (Confidence: High)` (From Step 3)
      *   **Rationale:** *One sentence* synthesizing the *strongest* 1-2 reasons from the criteria analysis. *Must include the Confidence reason* (e.g., "Strong multiple independent attestation" (High), "Single attestation in a theologically developed source" (Low), "Embarrassing detail unlikely to be invented" (Mod/High)).

  **Step 10: Handoff Flags**
      *   **Handoff to Human (Factual Dispute):** If criteria strongly conflict, OR evidence is highly ambiguous, OR complex literary dependency is key, OR the Execution Context is central but disputed. (e.g., "Multiple strong criteria conflict: Embarrassment supports but only single late attestation").
      *   **Handoff to Human (Editorial/Position):** If the Authenticity verdict is "Not" or "Low Confidence" but the claim is theologically central/sensitive (e.g., Resurrection, Virgin Birth, specific sayings central to doctrine), requiring a publisher decision on presentation despite the historical assessment. *The procedure gives the historical assessment; the human decides editorial policy.*
      *   **Handoff to Consultant:** If the claim involves complex textual/linguistic arguments, nuanced Jewish context beyond basics, or comparison with non-canonical sources needing expertise. Flag *why* (e.g., "Requires assessment of Greek variant reading," "Deep knowledge of 1st-century Pharisaic debates needed").

  **What This Procedure Can't Do:**
  1.  **Prove** anything definitively.
  2.  **Reconstruct** exact words (ipsissima verba) – only likely substance.
  3.  **Resolve** deep scholarly methodological disputes.
  4.  **Handle** claims dependent on nuanced literary or redaction criticism without synopsis access.
  5.  **Replace** deep expertise in 1st-century Judaism, Roman history, or textual criticism.
  6.  **Assign** precise numerical probabilities.
  7.  **Guarantee** consensus; it provides a reasoned, transparent assessment based on mainstream critical criteria applied cautiously.
  8.  **Eliminate** subjectivity entirely, but it *structures and exposes* it.

  ---

  **Worked Examples:**

  **Claim 1: Jesus was baptized by John.**
  1.  **Parse:** Found in Mark (1:9), Matt (3:13-17), Luke (3:21-22), John (1:29-34 implied), non-canonical Gospel of the Ebionites? (fragmentary, late). Early: Mark, implied in John. Paul? No direct mention.
  2.  **Community Meaning Fast Track?** No. Attested early (Mark).
  3.  **Contradiction?** No.
  4.  **Criteria/Circularity:**
      *   *Embarrassment:* **FIRES STRONG.** Baptism implies subordination to John. Early church elevated Jesus over John (Acts 19:1-7). Circularity Check: Could it be invented to show Jesus' humility? Possible, but subordination theme is pervasive and problematic.
      *   *Multiple Attestation:* **FIRES STRONG.** Independent Sources: Mark, Q (Matt/Luke share elements not in Mark? Debate, but baptism event itself is in Mark, implied in John - 2+ independent traditions). Circularity Check: John's account is theological, but the *fact* of baptism is presupposed.
      *   *Jewish Setting:* **FITS.** Ritual washing, prophetic figures like John existed. Circularity Check: Plausible, not probative alone.
      *   *Dissimilarity:* **FIRES MODERATE.** Subordination to another prophet is dissimilar to early church's view of Jesus. Circularity Check: Assumes we know early church perfectly? Yes, but elevation of Jesus over John is clear in Acts/Paul.
      *   *Coherence:* Supports picture of Jesus starting within a renewal movement. (Applies later).
      *   *Execution:* Doesn't directly explain execution, but places him in a movement perceived as threatening.
  5.  **Authenticity:** High Confidence (Strong Embarrassment + Strong Multiple Attestation + Fits Setting).
  6.  **Historicity:** **Historically Significant.** Foundational for understanding Jesus' origins and relationship to a major contemporary movement.
  7.  **Community Meaning:** Explained (or struggled with) Jesus' relationship to John; used to affirm Jesus' divine approval (voice from heaven).
  8.  **Verdict:** **Authentic & Historically Significant (High Confidence).** Rationale: "Strong multiple independent attestation and criterion of embarrassment."

  **Claim 2: Jesus taught something along the lines of loving your enemies.**
  1.  **Parse:** Matt 5:44/Luke 6:27-28 (Q source), cf. Rom 12:14, 17-21 (Paul echoes the teaching, not necessarily a specific saying). Early: Q, Paul.
  2.  **Community Meaning Fast Track?** No. Attested early (Q).
  3.  **Contradiction?** No.
  4.  **Criteria/Circularity:**
      *   *Embarrassment:* **DOES NOT FIRE.** Highly prized ethical teaching, central to Christian identity.
      *   *Multiple Attestation:* **FIRES MODERATE.** Q (Matt/Luke) is one strong independent source. Paul (Romans 12) provides *conceptual* attestation in an independent tradition (Pauline), showing the *teaching* was known early, though not necessarily the exact Q wording. Circularity Check: Paul may know the Q tradition? Possible, but distinct context.
      *   *Jewish Setting:* **FITS, BUT...** Love for neighbor commanded (Lev 19:18), but extending to *enemies* is radical. Not impossible, but distinctive. Circularity Check: Could be Jewish ethical development (cf. Prov 25:21-22 cited by Paul).
      *   *Dissimilarity:* **FIRES WEAKLY/MIXED.** Distinctive from strict reciprocity common in antiquity. *But* parallels exist in Greek philosophy (Stoics) and *possible* Jewish antecedents (Proverbs 25, Test. Gad 6:3-7 - date?). Dissimilar from early church? No, it *became* central. Circularity Check: High risk. Assumes radical ethics *must* come from Jesus, ignoring possible Jewish or Hellenistic influences or early church development.
      *   *Coherence:* **FIRES.** Coheres with other radical ethics (turn other cheek, go second mile) and critique of retaliation. (Applies later).
      *   *Execution:* Indirectly: radical ethics could provoke authorities/social order.
  5.  **Authenticity:** **Moderate Confidence.** Strongest support is Multiple Attestation (Q + Pauline echo). Jewish Setting plausible for development. Dissimilarity weak/unreliable. No Embarrassment.
  6.  **Historicity:** **Historically Significant.** If authentic, it's core to his ethical message.
  7.  **Community Meaning:** Defined Christian ethical distinctiveness; used in paraenesis (exhortation).
  8.  **Verdict:** **Authentic & Historically Significant (Moderate Confidence).** Rationale: "Attested in Q and echoed in Paul, forming a coherent part of the radical ethical teachings."

  **Claim 3: The tomb was found empty.**
  1.  **Parse:** Mark 16:1-8, Matt 28:1-8 (depends on Mark), Luke 24:1-12 (depends on Mark?), John 20:1-13. Paul? 1 Cor 15:3-4 mentions burial and resurrection but *no* empty tomb. Early: Mark. Paul mentions resurrection *without* citing empty tomb.
  2.  **Community Meaning Fast Track?** No. Attested in Mark (earliest Gospel).
  3.  **Contradiction?** No direct contradiction, but Paul's silence is notable.
  4.  **Criteria/Circularity:**
      *   *Embarrassment:* **POTENTIAL, WEAK.** The first witnesses are women (low status in antiquity), sometimes dismissed. BUT, the story serves a powerful *apologetic* purpose (proof of resurrection). Circularity Check: Is the women element *truly* embarrassing if it serves the larger triumphant narrative? Likely not decisive.
      *   *Multiple Attestation:* **WEAK.** Essentially *one* independent source: Mark (Matt/Luke/John are directly or indirectly dependent on the empty tomb *tradition*, likely stemming from Mark or a very similar source). John has independent elements but shares core story. Paul attests resurrection belief, *not* the empty tomb story. Circularity Check: Are the Gospels independent witnesses to the *event*? No, they are witnesses to the *tradition*, largely flowing from Mark.
      *   *Jewish Setting:* **FITS APOLOGETICALLY.** Answers the obvious objection "Where's the body?" within a Jewish context expecting physical resurrection. Circularity Check: Fits the *need* of the community, not necessarily the event.
      *   *Dissimilarity:* **DOES NOT FIRE.** Central to early church proclamation (Acts 2:29-32, 13:29-37). Circularity Check: N/A.
      *   *Coherence:* **FIRES (CIRCULARLY).** Coheres with resurrection belief. But resurrection belief is the *conclusion*, not independent evidence *for* the empty tomb. Circularity Check: **HIGH RISK.** Using Coherence here directly assumes the resurrection, making the argument circular for the *empty tomb*.
      *   *Execution:* N/A directly.
  5.  **Authenticity:** **Low Confidence.** Only one clear independent narrative source (Mark), potentially serving an apologetic need. Paul's silence is significant. Embarrassment weak. Coherence dangerously circular. Fits community needs well.
  6.  **Historicity:** **Historicity Uncertain** (due to Low Confidence authenticity). *If* authentic, it would be highly significant.
  7.  **Community Meaning:** Core apologetic narrative explaining resurrection faith; addresses "body problem"; elevates women as witnesses (paradoxically).
  8.  **Verdict:** **Historicity Uncertain (Low Confidence).** Rationale: "Single independent narrative attestation (Mark) potentially serving apologetic needs; Paul attests resurrection belief without mentioning the empty tomb." **HANDOFF FLAG (Editorial/Position):** Due to the centrality and sensitivity of the resurrection, despite the low historical confidence rating, an editorial decision is needed on presentation.

  ---

  **Calibration Control Case:**

  *   **Claim:** "The Buddha was born from his mother's side while she stood holding a tree branch." (A common late legend in some traditions).
  *   **Procedure:**
      1.  Parse: Earliest Buddhist texts (Pali Canon, Suttas) focus on teachings, not miraculous birth. The elaborate birth story appears in later texts like the *Lalitavistara* (centuries after Buddha).
      2.  **Community Meaning Fast Track:** **YES.** Only in late sources. Rationale: "Attested only in later hagiographical sources, reflecting developed devotional beliefs about the Buddha's transcendent nature." **Output: "Community Tradition" (High Confidence).** STOP.
  *   **Purpose:** Tests the ability to reject claims based solely on late attestation. Copy-editors should get this correct. If they output "Authentic," they are misapplying criteria or ignoring source dating.

  ---
  **Final Note on "Broken" Criteria & Survival:**
  The procedure acknowledges criticism:
  *   **Dissimilarity:** Deeply flawed. Used minimally & cautiously only for *distinctiveness*, never as primary proof. Survives only as a weak indicator, heavily caveated.
  *   **Embarrassment:** Stronger, but not foolproof (apologetic reinterpretation possible). Survives as a significant positive indicator when clear.
  *   **Multiple Attestation:** Core & robust, *if* independence is correctly assessed. Survives as the most reliable criterion.
  *   **Coherence:** Useful only *after* establishing a core via other criteria; otherwise circular. Survives as a supporting tool, not a starter.
  *   **Setting/Execution:** Primarily negative filters or supporting context. Survive as plausibility checks.
  The procedure mitigates issues by: requiring Circularity Checks, prioritizing Multiple Attestation/Embarrassment, minimizing Dissimilarity, delaying Coherence, and forcing acknowledgement of confidence levels. It doesn't fake precision – Low Confidence and Handoff flags are integral.
