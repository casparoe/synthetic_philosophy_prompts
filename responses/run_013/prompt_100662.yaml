  Hmm, the user has moved abroad and keeps making cultural faux pas like not tipping, standing on the wrong side of escalators, and jaywalking. Their colleague used a language analogy to argue they should just adapt to local conventions. The user wants me to audit this analogy thoroughly.

  The colleague's analogy frames local conventions as being like a language: arbitrary rules that locals intuitively understand, with social disapproval acting as natural enforcement. The user feels defensive but can't articulate why the analogy might be flawed.

  I need to map the analogy carefully: Grammar corresponds to the conventions themselves (tipping norms, queueing etiquette). Speakers would be the locals and visitors. Mutual understanding is smooth social functioning. The cost of being misunderstood is social friction. The "native ear" is locals' intuitive sense of what's proper.

  But there are important breaks in this analogy. Languages primarily serve communication, while many conventions (like escalator standing) are pure social markers. There's often internal disagreement among locals about these rules (tipping debates), unlike with core grammar. And there's a power imbalance - newcomers have less ability to challenge conventions than locals do.

  For the moral question: The analogy doesn't successfully establish obligation. While it's prudent to follow conventions to avoid friction, and often polite, true moral obligation would require either harm prevention (jaywalking safety) or systemic injustice (tipping's wage implications). Pure etiquette like queueing carries no moral weight.

  Breaking down the cases: Jaywalking might involve minor public safety concerns. Tipping connects to labor justice issues where dissent could be justified. Queueing is purely about coordination efficiency.

  A better analogy might be learning dance steps - you follow local rhythm to avoid stepping on toes, but you're not morally required to love the music. The core insight remains practical: following conventions is wise and considerate, but not inherently virtuous.

  The audit concludes that the analogy supports prudence and politeness, but fails to establish moral obligation. Therefore the answer is "carries only the prudential claim."
answer: |-
  Let's audit the language analogy point by point, then examine where it strains or breaks, and finally assess its moral implications for your cases.

  ### Core Analogy Mapped
  - **Grammar:** The local conventions themselves (tipping expectations, escalator flow, jaywalking norms). Arbitrary but systematised rules.
  - **Speakers:** Locals (native "fluency") vs. visitors ("language learners").
  - **Mutual understanding:** Smooth social coordination (e.g., escalator traffic flows; service staff feel respected).
  - **Cost of being misunderstood:** Social friction (dirty looks, tutting), exclusion, or practical disruption (e.g., escalator pile-up).
  - **Native ear:** Locals' intuitive sense of "what feels right/wrong" (e.g., tipping omission *feels* stingy; jaywalking *feels* reckless).
  - **Enforcement mechanism:** Subtle social cues (tut, glare) as "correction," akin to wincing at bad grammar. No formal penalty, just visceral disapproval.

  ### Where the Analogy Breaks or Overreaches
  1. **Purpose Mismatch:**  
     Language *primarily exists to communicate meaning*. Conventions often serve non-communicative ends:  
     - **Social marking:** Escalator standing isn't "saying" anything; it signals group belonging. Unlike grammar errors, violating pure markers (e.g., wrong side of escalator) doesn't hinder function—it just flags "outsider" status.  
     - **Contested values:** Tipping isn't neutral "grammar"—it's a practice loaded with moral/political debate (fair wages vs. exploitation). Locals aren't homogeneous "native speakers"; many reject the "code" itself.  

  2. **Ambiguity vs. Precision:**  
     Grammar has relatively clear rules (e.g., subject-verb agreement). Conventions are fuzzy:  
     - Who counts as "local"? (Tourists? Immigrants?)  
     - When does a convention apply? (Empty road jaywalking may be tolerated secretly but policed publicly.)  
     - The analogy masks this fluidity, implying rigid "rules" where none exist.  

  3. **Power Dynamics:**  
     Language learning is reciprocal (both parties adapt to bridge gaps). Conventions demand *one-way assimilation*:  
     - The newcomer has less social capital to "correct" locals or propose alternatives.  
     - The analogy ignores that the "code" may uphold inequity (e.g., tipping subsidising poverty wages). Framing it as neutral "grammar" smuggles in legitimacy.  

  4. **Harm vs. Offence:**  
     Bad grammar impedes understanding. Convention breaches often cause *offence* without tangible harm. The analogy conflates "sounding wrong" (subjective discomfort) with "being wrong" (objective dysfunction).  

  ### Moral Implications: Does the Analogy Support Obligation?
  - **Prudential claim (strongly):**  
    Ignoring conventions causes friction. You'll face tuts, glares, or poor service—like shouting in a foreign language and getting blank stares. The analogy perfectly justifies this: avoiding self-sabotage.  
  - **Rudeness claim (contextually):**  
    Deliberately flouting conventions *after knowing them* signals disrespect. The analogy holds here: refusing to learn basic "phrases" (tipping, queueing) is like refusing to greet someone properly.  
  - **Moral obligation (weakly/not):**  
    The analogy **fails** to prove inherent moral duty because:  
    - Conventions aren't universally endorsed by locals (tipping dissenters prove this).  
    - Moral weight requires independent justification (e.g., *why* should this convention bind outsiders?).  
    - Unlike language, many conventions lack a "common good" rationale (e.g., jaywalking on empty roads harms no one).  

  ### Case Breakdown
  - **Tipping:** Prudential (avoid bad service) and polite (acknowledge local norms), but **not moral** if you oppose it on ethical grounds (wage injustice). Your dissent isn't "bad grammar"—it's ideological disagreement.  
  - **Queueing:** Primarily prudential/rudeness. Violating efficient queues causes tangible disruption (like blocking a corridor). Still, **not deeply moral** unless queue-jumping exploits vulnerability.  
  - **Jaywalking:** Prudential (avoid fines/tuts) and possibly safety-related. If genuinely risk-free (empty road), defiance carries **no moral weight**—the tut is pure convention enforcement.  

  ### A Better Analogy: **Social Dance**  
  Conventions are like learning a local dance. You must match steps (queueing, escalators) to avoid treading on toes. Music (broader culture) sets the rhythm. Stumbling is expected, but refusing to learn the basic steps is rude. Yet:  
  - You can critique the dance (e.g., "This tango perpetuates gender roles!").  
  - Not all dances are equally worthy.  
  - Mastery grants belonging, but entry requires willingness, not moral surrender.  

  ### Verdict  
  The language analogy is useful for **prudential** and **politeness** arguments, but overreaches by implying moral duty via false equivalence. Conventions become morally binding only if they:  
  (a) Prevent harm (e.g., traffic norms), or  
  (b) Uphold justice (e.g., inclusive gestures), **not** merely because they exist.  

  \answer{carries only the prudential claim}
