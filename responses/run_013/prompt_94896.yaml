answer: |-
  ### Kavka's Toxin Puzzle: Practical Activity Design  
  **Goal:** Force participants to grapple with the challenge of forming a genuine intention when the reward depends *only* on that intention, not the action. Highlight the gap between intending vs. predicting, and test if social bonds enable "intention signaling" where strangers cannot.

  ---

  #### **Materials & Setup**  
  - **Rewards:**  
    - **Chocolate tokens:** Small, wrapped chocolates (e.g., Hershey’s Kisses).  
    - **"Silly points" tokens:** Poker chips or printed cards (e.g., 1 point = 1 chip; 20 points = a joke trophy).  
    *Rewards are symbolic; no monetary value.*  

  - **Task (Mildly Unpleasant):**  
    - **"Ice Cube Hold":** Hold an ice cube in your non-dominant hand for 60 seconds.  
    - *Why this works:* Safe, universally accessible, mildly uncomfortable but not painful or embarrassing. Allergies? Use a lightweight book held outstretched instead.  

  - **Prediction Slips:**  
    - Small cards with:  
      - `[ ] I predict [NAME] will do the task.`  
      - `[ ] I predict [NAME] will NOT do the task.`  
      - `Confidence: ___% (optional)`  

  - **Groups:**  
    - Split participants into **Group A** and **Group B** (randomly).  

  ---

  #### **Rules & Timeline (90 Minutes Total)**  
  **Key Mechanics:**  
  - Reward is paid **immediately** if the *predictor* believes the agent has a genuine intention.  
  - No penalty for skipping the task.  
  - **Two conditions:**  
    1. **Known Predictor:** Friend + promises allowed.  
    2. **Stranger Predictor:** Random assignee + no communication.  

  | Phase              | Time  | Facilitator Actions                                                                                                | Participant Actions                                                                                                |
  |--------------------|-------|--------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|
  | **Intro (5 min)**  | 0-5   | Explain Kavka’s puzzle: "Reward for *intending* to do X, not for doing X. Today, we simulate this." Announce task. | Listen, ask questions.                                                                                             |
  | **Self-Prediction (10 min)** | 5-15  | Distribute prediction slips. **Instructions:** "Predict whether YOU will do the task later. No reward yet."        | Write: "I predict I [will/will not] do the task." Optional confidence rating. Collect slips.                      |
  | **Condition 1: Known Predictor (25 min)** | 15-40 | **Pairing:** Each Group A member picks a friend in Group B. **Rules:** Promises allowed!                           | **Agents (Group A):** Convince your predictor you intend to do the task. **Predictors (Group B):** Submit prediction slip. |
  |                    |       | **Reward:** Give agent 1 chocolate token **if predictor says "will do"**. Record predictions.                      | Agents get chocolate immediately if predicted "yes".                                                               |
  | **Condition 2: Stranger Predictor (25 min)** | 40-65 | **Pairing:** Randomly assign Group B agents to Group A predictors (no prior rapport). **Rules:** NO talking.       | **Agents (Group B):** Silently project intention? **Predictors (Group A):** Base prediction on appearance/vibes only. |
  |                    |       | **Reward:** Give agent 1 chocolate token **if predictor says "will do"**. Record predictions.                      | Agents get chocolate immediately if predicted "yes".                                                               |
  | **Task Execution (10 min)** | 65-75 | **Setup:** Ice cubes + bowls at stations. **Announce:** "Do the task now or skip—no penalty. We’ll record outcomes." | Each participant chooses: hold ice cube for 60 sec or skip. Facilitator records who does it.                       |
  | **Payouts & Debrief (15 min)** | 75-90 | **Payouts:** Give predictors 1 chocolate if their prediction was correct. Give self-predictors 1 chocolate if correct. | Collect rewards. Discuss revelations.                                                                             |

  ---

  #### **Debrief Framework**  
  **Map Activity to Kavka’s Puzzle:**  
  | Activity Moment              | Kavka’s Concept                                                                                                | Discussion Questions                                                                 |
  |------------------------------|----------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Self-Prediction Phase**    | Distinguishing *intention* (commitment) vs. *prediction* (forecast).                                           | "When you predicted your own action, was it a guess or a decision? Did it *feel* like intending?" |
  | **Known Predictor Reward**   | How social tools (promises, reputation) create "intention signals" that strangers can’t access.                | "Why did your friend believe you? What made your intention *credible*? Would a stranger?" |
  | **Stranger Predictor Reward** | Proves intention without social scaffolding fails—**predicted outcome:** *Most get no reward here.*            | "Why couldn’t you convince a stranger? What’s missing when you can’t promise or explain?" |
  | **Skipping the Task**        | The rational loophole: "Take reward, skip task." Yet many do it anyway—*why?*                                 | "If you got the chocolate but skipped, did you *truly* intend it? Or did you trick the system?" |

  **Core Tension for Debate:**  
  - **Your Colleague’s View (Verbal Trick):**  
    > "Intention is just a word. If you define it as ‘belief you’ll act,’ you can’t form it if you know you’ll back out. The puzzle collapses under its own jargon."  
    *Activity test:* When strangers couldn’t signal intention, did it prove intention is socially constructed?  

  - **Your View (Practical Reason):**  
    > "Intention isn’t just belief—it’s a *commitment device*. We can’t form it at will without social/emotional stakes (like disappointing a friend)."  
    *Activity test:* Known predictors enabled rewards because promises create real stakes; strangers couldn’t.  

  **Escape Hatches Explored:**  
  - Precommitment (e.g., public promise) worked in **Known Predictor** condition.  
  - Without it (**Stranger Condition**), intention couldn’t be "manufactured" for reward alone.  
  - *Implied conclusion:* Intentions aren’t magic—they rely on hidden social infrastructure.  

  ---

  #### **What Will Go Wrong (And How to Mitigate)**  
  1. **Problem:** Everyone "gets the reward" in Known Condition because friends are too polite.  
     - **Why:** Predictors don’t want to offend; agents feel pressured to do the task.  
     - **Fix:**  
       - Stress to predictors: "You get a reward if you’re *correct*. Being honest helps your friend *and* you!"  
       - Normalize skipping: "Skipping is rational! We expect many to skip—no judgment."  

  2. **Problem:** Stranger Condition has near-zero rewards (as predicted), but participants dismiss it as "obvious."  
     - **Fix:**  
       - Highlight *why* it’s obvious: "If intention requires social glue, strangers *can’t* read your mind. What does this say about Kavka’s billionaire?"  

  3. **Limitations the Activity Can’t Replicate:**  
     - **The ‘Perfect Detector’ Problem:** We use predictors as intention proxies, but Kavka’s billionaire *knows*. Participants might say, "I’d fool the detector!"  
       - *Supply via discussion:* "If a detector *could* read your mind, could you *decide* to intend something you know you’ll abandon? Is that a coherent mental state?"  
     - **Intention vs. Self-Deception:** The activity can’t show if agents *truly* intended or just acted.  
       - *Supply via discussion:* "If you did the task, was it because you intended to, or to avoid cognitive dissonance? Can we intend without self-deception?"  

  ---

  **Final Prep Tips:**  
  - **Ice Cube Test-Run:** Ensure cubes are small enough to melt quickly (no frostbite risks).  
  - **Anonymity:** Use participant numbers (not names) on public prediction records to reduce shyness.  
  - **Token Economy:** Make "silly points" absurd (e.g., "10 points = a haiku about Kant"). Levity cuts tension.  

  This design forces engagement: strangers can’t access "intention," exposing Kavka’s core paradox. The debrief pits your colleague’s verbal-trick view against your practical-reason framing—using the activity’s failures as evidence.
