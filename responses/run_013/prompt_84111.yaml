  First, I need to identify the core tension they're experiencing: seminar discussions keep collapsing into debates about idealization while ignoring real-world epistemic limitations. Their frustration with "evaporating" arguments suggests they want grounded criteria, not just abstract distinctions. The roommate's rock example reveals a deeper concern about vacuity - if conceivability permits arbitrary properties, it loses explanatory power.

  I'll structure this around five key desiderata, leading with Modal Sensitivity as it handles necessary a posteriori truths like water/H₂O - the most common failure point for naive theories. The zombie case will illustrate Epistemic Parsimony (distinguishing conceptual from metaphysical gaps), while unprovable arithmetic statements demonstrate Formal Non-Arbitrariness. The inverted spectrum serves for Introspective Stability, showing how perceptual variations test conceivability's coherence. 

  The roommate's rock is genuinely tricky - it exposes how some theories permit "modal junk" if conceivability isn't constrained by causal or explanatory relevance. I'll flag this as a problem for non-ideal approaches but note that idealization might dissolve it through conceptual analysis. 

  Major tensions arise between Introspective Stability (requiring human-graspable conceivability) and Epistemic Parsimony (demanding idealized reasoning). Most popular versions fail Modal Sensitivity by not handling Kripkean necessities. 

  For the reverse principle (inconceivability→impossibility), the list mostly holds but becomes stricter - we'd need to add a requirement about ruling out unimaginable-yet-possible scenarios, like four-dimensional spacetime being necessarily true but inconceivable to some. 

  The user's technical level suggests I can assume familiarity with zombie arguments and Kripke, but should explicitly define terms like "modal junk." Their "under 700 words" constraint means prioritizing punchy examples over extensive justification.
answer: |-
  Here’s the desiderata list for a conceivability-to-possibility (C→P) principle, ordered by impact:

  1.  **Modal Sensitivity** (The *Water/H₂O* Problem)  
      *Must distinguish genuine metaphysical possibility from epistemic/conceptual confusion.*  
      **Case:** Conceiving "water isn't H₂O" seems coherent pre-science, but it’s metaphysically impossible. A good C→P theory must *not* deliver possibility here. **Demands:** Idealization (ruling out conceptual ignorance) and semantic competence. *Knocks out naïve/contingent conceivability theories.*

  2.  **Epistemic Parsimony** (The *Zombie* Test)  
      *Must avoid collapsing epistemic gaps into metaphysical gaps trivially.*  
      **Case:** Conceiving a physical duplicate world without consciousness (zombies) *feels* coherent. If C→P grants this possibility, physicalism is false. If it denies possibility, it must explain why the *apparent* conceivability is flawed (e.g., via idealization revealing hidden contradiction). **Requires:** Distinguishing *seeming*-conceivable (psychological episode) from *ideal*-conceivable (epistemic status post-rational reflection).

  3.  **Formal Non-Arbitrariness** (The *Unprovable Arithmetic* Problem)  
      *Must respect necessary truths without collapsing logic/math.*  
      **Case:** I can conceive "Goldbach’s Conjecture is false" (if unproven). But if it’s *actually* true, it’s necessary. C→P must *not* deliver possibility here. **Requires:** Ideal conceivability must incorporate grasp of all necessary truths (logical/mathematical omniscience) or constrain conceivability to avoid formal contradictions.

  4.  **Introspective Stability** (The *Inverted Spectrum* Case)  
      *Conceivability must be grounded in coherent conceptual content, not just imaginative failure.*  
      **Case:** Conceiving identical physical states but inverted color experiences seems coherent and stable under reflection. A good C→P *might* grant this possibility (for qualia). **Distinction:** "I can't imagine how P could be false" (imaginative limitation) ≠ "I can conceive ~P" (positive grasp of an alternative scenario). Requires the latter.

  5.  **Modal Relevance** (Your Roommate’s *Causally Idle Rock* Problem)  
      *Conceivability must track metaphysically significant alternatives, not arbitrary "modal junk".*  
      **Case:** Conceiving a physically identical world + an extra non-causal, non-experiential "haecceity" property on a rock. If C→P grants this, it permits infinitely many trivial possibilities (1 property, 2, ∞, none), rendering possibility trivial. **Is it a problem? Yes.** It challenges whether *mere* absence of contradiction suffices for genuine metaphysical possibility. A robust C→P needs constraints (e.g., combinatorialism, essence-based) to exclude such vacuous "possibilities".

  **Key Tension:** **Introspective Stability** (accessible to ordinary thinkers) vs. **Epistemic Parsimony/Formal Non-Arbitrariness** (requiring idealization, omniscience). You can't easily have conceivability both human-checkable *and* proof against deep conceptual/formal errors.

  **Most Damaging Requirement:** **Modal Sensitivity.** Naïve/contingent conceivability fails it utterly. Even sophisticated theories (e.g., Chalmers' 2D semantics) face challenges explaining why "water ≠ H₂O" isn't ideally conceivable.

  **C→P vs. ~C→~P:** The list *mostly* survives, but **Introspective Stability** becomes critical: unimaginability (e.g., 4D spacetime for a 3D thinker) doesn’t imply impossibility. **Formal Non-Arbitrariness** becomes stricter: inconceivability must guarantee *contradiction*, not just ignorance. **Modal Relevance** is less pressing (~C might genuinely indicate impossibility). The core tension between human access and idealization remains.
