prompt: |-
  Ok, I'm in a metaphysics seminar and we've spent alot of time circling whether conceivability is a good guide to possibility, and I keep feeling like everyone is argueing about the wrong thing — people throw around zombies, inverted spectra, the water/H2O cases, and then someone says that one doesn't count because it isn't *ideal* conceivability and the whole discussion just evaporates. Before we go any further I want the actual spec. What does any theory that runs "if you can conceive it, it's possible" actually have to deliver to be any good?

  So give me the desiderata list. For each requirement, hand me the case or consideration that puts it on the list: the cases it has to get right (the ones where conceivability and possibility seem to come apart — a world physically identical to ours where the mental facts are absent, the necessary-a-posteriori water cases, the case where I can apparently conceive of an unproven arithmetical claim being false); the distinctions it can't collapse (conceivability as an episode in someone's head vs. conceivability as an epistemic status, seeming-conceivable vs. really-conceivable, "I can't imagine how this could be false" vs. "this couldn't be false"); and any result it can't contradict. Then throw in one genuinely annoying case for me: my roommate says she can conceive of a world physically identical to ours in which one particular rock has an extra intrinsic property that makes no causal or experiential difference to anything, ever. Fine — but then I can equally conceive of a world where that rock has two such properties, or infinitely many, or none, and none of those seems any less conceivable, so if conceivability is a guide here it's a guide to literally everything, which is the same as a guide to nothing. Tell me whether that's a real problem for the view or just my confusion.

  Flag any two requirements you think can't be satisfied together — I suspect there's real tension between "conceivability has to be something an ordinary person can have and check by introspection" and "conceivability has to be an ideal, evidence-proof notion" — and tell me which single requirement knocks out the most popular versions of the view. Finally, in like three sentences, say whether the same list survives if we run the principle in the other direction, from inconceivability to impossibility. Keep the whole thing under 700 words, and lead with the requirement that does the most work.
