prompt: |-
  You are a methodologist specializing in inference in the human sciences, with a focus on archaeological reasoning. I am a PhD student in archaeological theory preparing a qualifying paper, and I need the desiderata: what any adequate method for inferring past beliefs and institutions from material remains has to deliver. Think carefully before you write, and start by sorting which requirements you are inclined to state are genuine constraints on such an inference and which are inherited habits of the discipline; do not simply rehearse the standard positions. Give me exactly five numbered items, with no introduction and no conclusion, each a sentence or two, stating the requirement, the case or consideration that motivates it, and whether you regard it as non-negotiable, and stating each requirement in a way that makes clear what would count as evidence against a belief or institution attributed under it. The five must be answerable for at least these cases: a sealed deposit of unused objects buried in a way that no later practice repeats; a shift in the treatment of the dead that coincides with no other detectable change in the record; identical objects produced by two different techniques in adjacent households; and a monument whose design is held constant through several generations of rebuilding. Frame the requirements so that they discriminate among three broad families of method -- inference through ethnographic analogy and middle-range regularities, inference from context and association, and approaches that treat belief as constituted in practice rather than as an inner state to be recovered. Where two of your requirements cannot be jointly satisfied, say so inside the item where the tension surfaces rather than in a summary, and if one requirement does most of the excluding, say that in its own item.
reasoning: |-
  Okay, the user is a PhD student in archaeological theory preparing a qualifying paper. They need the desiderata for inferring past beliefs and institutions from material remains. The requirements must cover five specific cases: a sealed deposit of unused objects buried uniquely, a shift in burial practices without other changes, identical objects made with different techniques in adjacent households, and a monument rebuilt over generations with constant design.

  First, I need to identify genuine constraints versus inherited habits. Genuine constraints are non-negotiable logical or epistemological necessities. Inherited habits might include over-reliance on ethnographic analogy or assuming direct symbolism in artifacts. 

  Each requirement must address evidence against inferred beliefs/institutions. For example, if an inference can't be falsified by any material evidence, it's invalid. Also, the requirements should distinguish among three methodological families: ethnographic analogy (middle-range), contextual association, and practice-based approaches.

  Considering the cases: 
  1. The sealed deposit involves unique burial. Any method must handle uniqueness without assuming repetition.
  2. Burial shift alone requires isolating specific practices without correlative changes.
  3. Identical objects with different techniques challenge assumptions about standardization and meaning.
  4. Monument consistency over rebuilds suggests intentional tradition despite changes in practice.

  Key tensions: Practice-based approaches might conflict with analogy when unique practices occur. Contextual methods may struggle with isolated changes. Also, inferring institutions from static remains versus dynamic practices.

  Drafting five items:
  1. Non-circular falsifiability: Evidence against could be a contradictory practice elsewhere. Non-negotiable, excludes unfalsifiable symbolic interpretations.
  2. Accounting for material constraints: Must distinguish practical from symbolic reasons. Middle-range analogies might overattribute symbolism. Essential for cases like different techniques producing same objects.
  3. Sensitivity to uniqueness: Methods shouldn't assume uniformity. Ethnographic analogy fails here for sealed deposits. Non-negotiable to avoid overgeneralization.
  4. Dynamic institutional persistence: Explains monument rebuilds. Contextual methods might miss this if context changes. Practice-based approaches handle it better. Tension with requirement 3 if uniqueness is overemphasized.
  5. Decentralized practice: Adjacent households with same objects but different techniques show lack of centralized control. Challenges top-down institutional inferences. Contextual methods might miss this if focusing on association alone.

  Tension between uniqueness (requirement 3) and persistence (requirement 4): Unique events vs. long-term traditions. Practice-based methods handle both by examining how practices sustain institutions. But requirement 3's non-negotiable status might exclude methods that can't handle singular cases.

  Each requirement must specify what counts as counter-evidence. For example, finding a similar sealed deposit would challenge uniqueness, but its absence shouldn't confirm the belief.
answer: |-
  1. **Non-circular falsifiability**: Any attributed belief/institution must specify material evidence that would contradict it, even hypothetically, preventing self-sealing interpretations; e.g., for the sealed deposit, evidence against a "ritual offering" belief could be identical objects found in mundane discard contexts *contemporaneously*. Non-negotiable, as it blocks tautological reasoning inherent in some symbolic analogies.  

  2. **Constraint by material affordances and practical logic**: Inferences must account for how physical properties and production/use constraints limit possible meanings; e.g., for identical objects made by different techniques in adjacent households, evidence against inferring a shared symbolic institution would be functional superiority of one technique with no cost difference, suggesting decentralized practical adaptation rather than normative belief. Non-negotiable, as it anchors inference in material reality, challenging ethnographic analogy that projects symbolic meanings detached from technique.  

  3. **Sensitivity to singular configurations**: The method must accommodate materially unique or non-repeated phenomena without presuming uniformity; e.g., for the sealed deposit, evidence against inferring a widespread mortuary institution would be the *absence* of similar deposits despite comparable preservation conditions elsewhere. Non-negotiable, as it counters analogical or associative methods that require recurrence, but creates tension with requirement 5 when persistence is inferred.  

  4. **Dynamic institutional persistence**: Where formal continuity exists amid material change (e.g., the monument rebuilt identically over generations), inferences must explain institutional reproduction through practice, not static "tradition"; evidence against would be identical rebuilds using techniques *incompatible* with knowledge transmission (e.g., abrupt technical regressions). Non-negotiable for practice-based approaches, but associative methods struggle by treating context as synchronic.  

  5. **Decentralized coordination without shared mental templates**: Inferences must allow for institutional effects (e.g., identical objects across households) emerging from interdependent practices, not internalized beliefs; evidence against would be centralized production or enforced standardization. Essential for practice-based inference, directly challenging analogical methods that posit shared cognitive models. This requirement excludes methods that cannot explain the adjacent-households case without assuming top-down ideological control.  

  **Key tensions**: Requirement 3 (singularity) and Requirement 4 (persistence) conflict when a unique practice (e.g., the sealed deposit) must also explain institutional continuity. Requirement 5’s exclusion of mental templates most sharply constrains ethnographic analogy, while Requirement 1’s falsifiability criterion challenges overly flexible contextual associations.
