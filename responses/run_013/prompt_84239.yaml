prompt: |-
  Ok so I'm a novelist, mid-list, you've never heard of me, and I've got a problem I can't think my way out of. I've been offered a two-month residency at a university in China and the paperwork is making my stomach hurt. Scan of the passport, ten years of social media handles, bank details, every country I've visited since 2010, and a line I have to sign promising to cooperate with any lawful inquiry. Oh and a clause letting them share it all with partner institutions, whoever the hell they are.

  My agent says everybody signs this, it's just bureaucracy, stop being difficult. My German friend, a translator, very exact about everything, is genuinely appalled — she says where she's from half that list would be flat out illegal to collect, and the whole point of the law there is that the state has to justify why it needs each scrap, not the other way round. My American editor thinks I'm being precious, says if you've got nothing to hide then what's the problem, which I hate, I hate that argument, but he's also not completely wrong that total opacity has its own price, I've watched people use the word privacy to mean don't hold me accountable for anything. And a Chinese novelist I correspond with just shrugs — says this form is nothing, that everyone back home lives inside some kind of score and eventually you stop noticing.

  So I'm stuck. Here's the one idea I keep circling and I can't tell if it's clever or just cowardly. Instead of refusing or complying cleanly, I submit everything but make it slightly... fuzzy. Old handles that route to dead inboxes. A birthdate off by a day. Nothing that's exactly a lie, just noise. My translator friend says that's worse than lying, that it corrodes trust from the inside and I'd be doing the collection's work for it. Maybe she's right, maybe she's just being German about it.

  Should I go? Sign it straight, refuse, or do the fuzzy thing? And underneath all of it — whats the actual principle? I can feel there's a real question here about how much of myself the state is entitled to know, and every time I try to state it cleanly I lose the thread. I want advice I can actually act on by Friday.
reasoning: |-
  Okay, this novelist is really grappling with a tough ethical and practical dilemma. The residency opportunity in China seems exciting, but the invasive paperwork is causing genuine distress. They've consulted multiple people with different cultural perspectives: an agent dismissing concerns as bureaucracy, a German translator horrified at the privacy violations, an American editor using the "nothing to hide" argument they despise, and a Chinese novelist normalizing surveillance. 

  The core tension is between artistic opportunity and personal principles. The "fuzzy submission" idea reveals their desire to compromise without fully surrendering - but as their German friend pointed out, this might actually undermine integrity more than outright refusal. What's interesting is how they're framing this as both a practical choice ("act by Friday") and a philosophical one ("what's the actual principle?"). 

  Their struggle articulating the principle resonates - it's about where to draw the line between necessary bureaucracy and overreach when states demand personal data. The Chinese context adds complexity; that partner institutions clause is genuinely concerning. The novelist's awareness that "opacity has its own price" shows nuance - they're not absolutist about privacy, but want proportionality. 

  Three paths emerge: 1) Refuse and lose opportunity 2) Comply cleanly and feel complicit 3) Fuzzy submission as passive resistance. The German friend's point about institutional corrosion is persuasive - intentional inaccuracies might backfire legally and ethically. But the editor's glib "nothing to hide" ignores how data can be weaponized later. 

  Perhaps the solution lies in distinguishing between negotiable and non-negotiable items. Bank details for payments? Reasonable. Ten years of social media? Excessive. Could they push back selectively rather than blanket refusal? The agent's "everybody signs this" feels dangerous - normalization through compliance. 

  The Chinese novelist's resignation ("you stop noticing") is the warning here. This isn't just about one form, but what we accept as creators moving through systems of control. If they choose to comply, they should do so clear-eyed about the trade-off, not pretending it's harmless. But refusing might mean sacrificing cross-cultural exchange that could enrich their work. 

  No perfect answers, but the novelist's discomfort is important - it means their ethical compass works. Whatever they decide, they should document this dilemma; it's potent material.
answer: |-
  Here’s a clear, principled breakdown of your options and their consequences. You’re facing a genuine ethical tension—not paranoia. Let’s untangle it:

  ### 1. **The Core Principle**
     - **Your Question:** "How much of myself is the state entitled to know?"  
     - **The Answer:** A state is entitled to know **only what is necessary for a specific, legitimate purpose**.  
     - **The Conflict:** This form demands excessive, non-specific data with no justification ("partner institutions," vague "lawful inquiries"). Your German friend is right: GDPR in Europe forbids this *because* proportionality matters. China’s approach reflects its own legal philosophy—one you must decide if you can temporarily accept.

  ### 2. **Your Options, Ranked by Principle & Practicality**
     - **A. Refuse Cleanly (Principled Stand)**  
       - **Why:** You reject normalizing overreach. Protects your data from misuse.  
       - **Cost:** Loses the residency. May strain relationships (agent, publisher).  
       - **When to Choose:** If signing feels like endorsing a system you fundamentally oppose.  

     - **B. Comply Fully (Pragmatic Acceptance)**  
       - **Why:** The residency’s value (career, cross-cultural insight) outweighs the discomfort. Your agent isn’t wrong that this *is* standard for China visas/residencies.  
       - **Cost:** You legitimize the request. Data could be misused (e.g., shared with "partners" you distrust).  
       - **When to Choose:** If the opportunity is transformative, and you can compartmentalize this as a "price of entry."  

     - **C. "Fuzzy Submission" (Dangerous Middle Ground)**  
       - **Why:** Feels like resisting while still participating.  
       - **Cost:** **Your translator friend is correct: This is the worst option.**  
         - If caught (e.g., passport scan vs. "wrong" birthdate), it’s provable fraud. Could get you barred from China permanently.  
         - If not caught, you’ve poisoned your own data trail. Future inconsistencies (e.g., tax forms, contracts) could haunt you.  
         - Ethically, it *is* corrosive. It turns you into a participant in bad-faith systems.  
       - **Verdict:** **Don’t do this.** It’s high-risk with no real upside.

  ### 3. **The "Nothing to Hide" Fallacy**
     - Your editor is wrong. Privacy isn’t about hiding crimes; it’s about **autonomy**. You wouldn’t let a stranger read your emails because they’re "innocent," would you?  
     - **Data is power:** Handing over 10 years of social media handles lets others map your associations, opinions, and vulnerabilities. "Lawful inquiry" in China can be broad.  
     - **The Real Price:** Normalizing excessive collection erodes rights for everyone.

  ### 4. **A 4th Option: Negotiate Transparently**
     - **Try This Before Deciding:**  
       - Email the residency coordinator: *"I'm eager to accept, but I have concerns about the scope of personal data requested. Could we discuss which elements are mandatory for visa processing versus institutional policy? For example, is there flexibility on social media handles or the data-sharing clause?"*  
     - **Why it Might Work:**  
       - Universities often have wiggle room. Coordinators deal with wary artists.  
       - Shows you’re serious, not "difficult."  
       - If they refuse, your choice becomes clearer: comply or walk away.  
     - **If They Say No:** You’re back to Option A or B—but with clarity.

  ### What to Do By Friday
  1. **Attempt Negotiation (Today/Tomorrow):**  
     Draft a concise, professional email questioning the necessity of the most intrusive asks (social media, vague data-sharing).  
  2. **Decide Based on Their Response:**  
     - **If they accommodate you:** Sign cleanly, knowing you pushed back appropriately.  
     - **If they don’t:** Choose between **A (Refuse)** or **B (Comply)**, knowing the trade-offs.  
  3. **Never Choose "Fuzzy":**  
     It’s self-sabotage masquerading as resistance.

  ### The Deeper Takeaway
  This isn’t just about China. It’s about **how you navigate power as an artist**. Submitting quietly trains institutions to expect compliance. Refusing may cost opportunities but preserves integrity. Neither is "right"—it’s about which cost you can live with.  
  **Act now:** Negotiate. If stonewalled, pick A or B. Burn the "fuzzy" idea. Your principles are worth more than that.
