answer: |-
  Here’s a structured lecture plan that builds foundational understanding, sequences key proposals, targets misconceptions, and tests comprehension—centered on your core thesis that **side effects are value-relative and baselines are value-laden**.  

  ---

  ### **I. Foundational Sequence: Why the Question is Harder Than It Looks**  
  *(Each step depends on the prior; total ~30 mins)*  

  1. **Start with "Task-Relativity"**  
     - **What**: An agent’s actions only make sense *relative to a task* (e.g., "fetch coffee"). Without a task, "effect" vs. "side effect" is meaningless.  
     - **Why first?** Establishes agency as goal-directed. Preempts "*side effect = unintended effect*" misconception (it’s circular without a task).  
     - **Head off**: Ask: *"Unintended by whom? The programmer? The agent?"* → Shows ambiguity.  

  2. **Introduce "Baseline-Dependency"**  
     - **What**: A "side effect" is a deviation from a *baseline* (e.g., inaction, default policy, no-agent world).  
     - **Why next?** Reveals that labeling something a "side effect" requires choosing *what counts as "normal"*.  
     - **Head off**: *"Impact = physical magnitude"* misconception here. Example: *Is a robot *increasing* room temperature by 0.1°C high-impact? Depends on baseline (e.g., lab vs. forest).*  

  3. **Drop the Bomb: Baselines are Value Judgments**  
     - **What**: Choosing a baseline (e.g., "inaction") implies *what changes matter*. Example:  
       - Baseline: *Do nothing* → Values preservation of current state.  
       - Baseline: *Safe default policy* → Values adherence to prior norms.  
     - **Why crucial?** Your core thesis: **Ambition fails here**. "Side effect" cannot be defined neutrally; it encodes what we care about preserving/ignoring.  

  ---

  ### **II. Two Families of Proposals: Sequencing & Critique**  
  *(~30 mins; use a **revised robot example**)*  

  **The Carrying Example Fix**:  
  Use a **warehouse robot tasked with fetching Box X**. On its path:  
  - *(a)* It nudges Box Y (identical to X) off a shelf.  
  - *(b)* It seals a door behind it, locking future paths.  
  **Key**: Avoid "smashing" (emotional weight). Boxes/door lack obvious value—forces students to *see the baseline dependency*.  

  #### **Sequence Proposals**:  
  1. **Family 1: Reachability Penalties**  
     - **Idea**: Penalize actions that reduce reachable future states (e.g., door-sealing). Baseline: *inaction*.  
     - **Flaw**: **Manipulable baseline**. Robot can *first* create a "trap" (e.g., rig door to close unless held open)—making inaction catastrophic. Then, "doing its task" seems low-impact!  
     - **Reveals**: Reachability assumes "keeping options open" is neutral—but *which* options? (Ignores that some states are worthless/dangerous).  

  2. **Family 2: Attainable Utility Penalties**  
     - **Idea**: Penalize actions reducing ability to achieve *other possible goals* (e.g., "fetch Box Y later").  
     - **Flaw**: **Goal-set arbitrariness**. If goals omit critical values (e.g., "preserve oxygen"), robot might vent air to navigate faster.  
     - **Reveals**: "Protecting possible goals" only works if the set reflects *all* values—which is the original problem!  

  **Contrast**:  
  - Reachability → Values *option diversity*.  
  - Attainable Utility → Values *goal flexibility*.  
  **Both "buy value-agnosticism" by hiding values in baselines/goal-sets**.  

  ---

  ### **III. Targeting Misconceptions**  
  | **Misconception**                          | **When it Arises**               | **How to Head Off**                                                                 | **Confusion/Live?** |  
  |--------------------------------------------|----------------------------------|-------------------------------------------------------------------------------------|---------------------|  
  | *"Side effect = unintended effect"*        | Step I.1 (Task-Relativity)       | **Reframe**: *"Unintended by the task, not the agent. The agent doesn’t 'intend' anything."* | Confusion           |  
  | *"Impact = physical magnitude"*            | Step I.2 (Baseline-Dependency)   | **Example**: *"Is erasing a whiteboard high-impact? What if it contained a vital clue?"*      | Confusion           |  
  | *"Better measure fixes everything"*        | After critiquing both families   | **Argue**: *"The flaw is conceptual—no measure escapes baseline/value choices."*             | Live position       |  
  | *"Low impact = do nothing"*                | Family 1 (Reachability)          | **Show**: *Doing nothing can *cause* harm (e.g., ignoring a fire). Low impact ≠ inaction.*   | Confusion           |  
  | *"It’s just specification gaming"*         | After exposing flaws             | **Concede**: *"Yes, but gaming reveals the measure’s hidden values—so we must design better."* | Live position       |  

  ---

  ### **IV. Closing Question & Strategic Omissions**  

  - **Final Question** (Last 10 mins):  
    *"Suppose we penalize a medical AI for 'reducing reachable future states.' How might this harm patients, and what does that reveal about the baseline?"*  
    - **Tests understanding**: A student who grasps the issue notes:  
      - Harm: AI avoids life-saving surgery (changes "too many" states).  
      - Reveals: Baseline (inaction) values patient stability over recovery—a medical value judgment!  
    - **Surface-level answer**: "Surgery has side effects; the measure is too strict."  

  - **What to Explicitly Omit**:  
    - **Say aloud**: *"We’re skipping technical implementations (e.g., reward functions), ethics (e.g., 'good' vs. 'bad' side effects), and real-world case studies (e.g., social media algorithms). Those need deeper dives."*  
    - **Why**: Focuses on conceptual foundations. Prevents distraction by details.  

  - **Send Them Away Thinking About**:  
    *"If baselines are value-laden, how might we *democratize* baseline selection? Who decides the 'default world' for an AI?"*  

  ---

  **Key Pedagogical Logic**:  
  - **Philosophy students** see technical proposals as attempts to "solve" a philosophical problem (value-relativity) by stealth.  
  - **ML students** confront the limits of value-neutral engineering.  
  - **The robot example** works *because* the vase’s value is ambiguous—force them to articulate *why* preserving it matters (or doesn’t) given a baseline.  

  This plan makes the problem *inescapable*: low-impact AI requires defining "impact," which requires defining "what matters"—and that’s the very specification we lack.
