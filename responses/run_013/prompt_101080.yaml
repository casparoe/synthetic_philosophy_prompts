  Given the complexity and time constraints, I propose we go with the following simpler in-class activity:

    We will have a setup where each participant is given a unique ranking of causes and a set of "moral commitments" that they start with. These commitments are to specific causes. They can trade commitments: I give you my commitment to cause X in exchange for your commitment to cause Y.

    The catch is: at the end, they score points based on the commitments they hold and their own weights for the causes.

    Example: 
      Causes: A, B, C, D.
      Each participant is given 4 commitment tokens, each token is to a specific cause. Initially, they might have tokens distributed in a way that doesn't match their weights.

      For example, P1 weights: A:10, B:8, C:6, D:4.
      Initial tokens: 1 for A, 1 for B, 1 for C, 1 for D.

      Score now: 10+8+6+4 = 28.

      P2 weights: A:4, B:6, C:8, D:10.
      Initial tokens: 1 for A, 1 for B, 1 for C, 1 for D.
      Score: 4+6+8+10 = 28.

      Now, they can trade: P1 gives their D token (worth 4 to them) to P2, and P2 gives their A token (worth 4 to them) to P1.
      After trade:
          P1 has: 2 A, 1 B, 1 C -> score: 2*10 +8+6 = 20+8+6=34.
          P2 has: 2 D, 1 B, 1 C -> score: 2*10 +6+8 = 20+6+8=34.

      Both gained 6 points.

    The trade is swap of tokens.

    Rules:
      - Tokens are not divisible and are for specific causes.
      - Trades are one-for-one: one token for one token.
      - You can trade multiple times.

    This mechanics is simple and ensures that there are gains from trade when rankings differ.

    Now, the condition on justification: 
      Before a trade is recorded, both parties must publicly state a justification that the other would accept. The justification must be in terms of the causes and their importance.

      Example: P1 might say: "I am trading away my D token because I care about D the least, and I am getting an A token which I care about the most."
      P2 might say: "I am trading away my A token because I care about A the least, and I am getting a D token which I care about the most."

    This meets the condition.

    Objections might be:
      - "How can you trade away your commitment to cause D? If you were truly committed, you wouldn't trade it."
      - "This feels like we are selling out our values."

    The game will surface these.

    Materials:
      - For each participant, a portfolio card with their weights for the causes.
      - A set of tokens for each participant. We'll have 4 causes, and each participant gets 4 tokens. The initial distribution should be such that they have one token for each cause. Then, by trading, they can get more than one on a cause.

    However, note: if everyone starts with one token per cause, then after trade, some causes might have multiple tokens held by one person, and some might have none. But that's fine.

    Timeline for a 90-minute session:

      0:00-0:15: Introduction and rules explanation. Distribute portfolio cards and tokens. Explain scoring.

      0:15-0:45: Trading period. Participants can approach each other and negotiate trades. For each trade, they must come to the ledger to record it, and both must state their justification publicly. The facilitator records the trade in the ledger.

      0:45-0:60: Finalize trades and calculate scores. Participants calculate their score based on the tokens they hold.

      0:60-0:85: Debrief.

      0:85-0:90: Wrap-up.

    What can go wrong:

      1. A participant might refuse to trade at all. 
          Handling: That's okay. They will score based on their initial tokens. They might see others score higher. In the debrief, you can ask them why they didn't trade.

      2. A coalition might form: for example, a group of participants with similar rankings might try to corner the market in a cause. But since tokens are for causes and there is no money, and trades are one-for-one, cornering doesn't make sense in this context.

      3. The justification might be superficial. The facilitator can challenge during the trade recording: "Why would you accept that justification? Is there a deeper principle?"

      4. Participants might not find trades because they don't know others' weights. They can ask? But the weights are private. So they have to negotiate without knowing the exact weights, only by discussing their priorities.

          We can allow them to say: "I care about cause A a lot and cause D very little." They just cannot show their card.

      5. One participant might try to do a multi-person trade. The rules are for bilateral trades. So we restrict to two-party one-for-one swaps.

      6. Time might run out before many trades happen. Encourage them to trade as much as they can.

    What the activity cannot reproduce and that you will have to supply:

      - In real moral trade, the trade is about future actions or commitments that might be more abstract. The token system is a proxy.

      - The activity does not involve the opportunity cost of time/effort in quite the same way.

      - The activity might not surface the fear of corruption as strongly because the tokens are just tokens. You will have to emphasize in the debrief that these tokens represent real moral commitments.

    Now, let's provide the materials:

      Portfolio Cards: 
          We'll create 16 unique weight vectors for 4 causes (A, B, C, D). We ensure no two have the same ranking.

          Example for 4 causes, we can have:

            P1: A:10, B:8, C:6, D:4
            P2: A:8, B:10, C:4, D:6   -> ranking: B > A > D > C
            P3: A:6, B:4, C:10, D:8   -> ranking: C > D > A > B
            P4: A:4, B:6, C:8, D:10   -> ranking: D > C > B > A
            P5: A:10, B:6, C:8, D:4   -> ranking: A > C > B > D
            ... and so on.

          We can generate 16 different rankings by taking permutations of [10,8,6,4] for the four causes.

      Tokens: 
          For each participant, we give them four tokens: one for cause A, one for cause B, one for cause C, and one for cause D.

      Pledge Ledger (sample format on a whiteboard or poster):

          | Trade # | Party 1 | Party 2 | Token from P1 to P2 | Token from P2 to P1 | Justification (P1) | Justification (P2) |
          |--------|---------|---------|----------------------|----------------------|---------------------|---------------------|
          |   1    |  P1     |  P2     |         D           |         A           | "I value D least..." | "I value A least..." |

      Score Calculation:
          After trading, each participant counts the number of tokens they hold for each cause: 
              Let nA, nB, nC, nD be the number of tokens for causes A, B, C, D.
              Score = nA * weight_A + nB * weight_B + nC * weight_C + nD * weight_D.

    Debrief:

      - Divergence of priorities: 
            Ask: "Why were there gains from trade?" 
            Expected answer: because different people care about different causes to varying degrees.

      - Role of commitment devices: 
            The tokens represent commitments. By having a tangible token, you can trade. In the real world, we need ways to make commitments tradable.

      - Objections surfaced:
            Integrity: Ask if anyone felt uneasy about trading away a cause they initially had a commitment to? Why?
            Fear of corruption: Did anyone worry that trading might lead to a cause being neglected? 
            Suspicion: If you were willing to trade away a commitment, was it ever a real commitment?

      - Map to moral trade: Explain that the game was designed to illustrate moral trade. Define moral trade: it occurs when two parties each do something that benefits the other's values at a cost to their own, and both gain overall.

    Let's generate 16 weight vectors. We'll use a set of weights: [10,8,6,4] and assign them to four causes in unique permutations. There are 24 permutations, so we pick 16.

    We'll generate them randomly? Or systematically. We can list all permutations and then choose 16.
    Example of 16:

      1. A:10, B:8, C:6, D:4
      2. A:10, B:8, C:4, D:6
      3. A:10, B:6, C:8, D:4
      4. A:10, B:6, C:4, D:8
      5. A:10, B:4, C:8, D:6
      6. A:10, B:4, C:6, D:8
      7. A:8, B:10, C:6, D:4
      8. A:8, B:10, C:4, D:6
      9. A:8, B:6, C:10, D:4
      10. A:8, B:6, C:4, D:10
      11. A:8, B:4, C:10, D:6
      12. A:8, B:4, C:6, D:10
      13. A:6, B:10, C:8, D:4
      14. A:6, B:10, C:4, D:8
      15. A:6, B:8, C:10, D:4
      16. A:6, B:8, C:4, D:10

    This should work.

    Let's run through an example trade with two of these:

      Participant 1: A:10, B:8, C:6, D:4 -> ranking: A>B>C>D
      Participant 7: A:8, B:10, C:6, D:4 -> ranking: B>A>C>D

      Initial tokens: both have one of each.

      Score1: 10+8+6+4 = 28
      Score7: 8+10+6+4 = 28

      Trade: P1 gives token D to P7, and P7 gives token B to P1.

      New tokens:
          P1: 1A, 2B, 1C -> score: 10 + 2*8 + 6 = 10+16+6 = 32.
          P7: 1A, 1B, 1C, 1D and an extra D? -> they gave away B and received D. So they have: 1A, 0B, 1C, 2D -> score: 8 + 0*10 + 6 + 2*4 = 8+6+8 = 22. That's a loss! 

      Why? Because P7 values B at 10, and they gave it away. Even though they got an extra D, which they value only at 4.

      We see the mistake: they should trade tokens for causes that they value differently.

      Better trade: P1 has a token for D, which they value at 4. P7 also values D at 4. Not good.

      Instead, P1 might want to acquire more A tokens. P7 has an A token that they value at 8. But P1 values A at 10. So if P1 can give something that P7 values more than 8? For example, what if P1 gives their B token (which they value at 8) to P7? P7 values B at 10. So they would be willing.

      Trade: P1 gives token B to P7, and P7 gives token A to P1.

      New tokens:
          P1: 2A, 0B, 1C, 1D -> score: 2*10 +0*8 +6+4 = 20+6+4=30.
          P7: 0A, 2B, 1C, 1D -> score: 0*8 +2*10 +6+4=0+20+6+4=30.

      Both gain 2 points.

      Justification:
          P1: "I am trading away my B token because I care about B less than A. I am getting an A token which is more important to me."
          P7: "I am trading away my A token because I care about A less than B. I am getting a B token which is more important to me."

    So the participants will have to identify tokens that they value less than the other party and that the other party is willing to give in exchange for something they value more.

    This is more complex and requires them to negotiate based on their priorities without knowing the exact weights. They can say: "I value A the most and would like to acquire more A tokens. I am will to give up tokens in causes that I care less about, such as D or C."

    This should work.

    Let's proceed with this design.
