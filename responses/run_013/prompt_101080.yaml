          Each participant is given a fixed set of 4 "action cards". Each card allows them to take a specific action: "Increase cause X by 1 and decrease cause Y by 1". But note, they can only do this action if they have the card.

          We then distribute the cards such that no participant has a card that they would want to play on their own (because the action would be detrimental or suboptimal). And they can trade these action cards.

          Example for P1:
            We give P1 a card: "Increase B, decrease A". But P1 values A=10, B=0, so this card is bad for them.
            We also give P1 a card: "Increase D, decrease C", and P1 values C=5, D=10, so this card is good (gain 5).

          P2 might have: 
            Card: "Increase A, decrease B" -> good for P1? Let's see: if P2 plays it, then A+1, B-1 -> for P1: +10 -0 = +10.
            Card: "Increase C, decrease D" -> bad for P1.

          Then, P1 might trade their "Increase B, decrease A" card (which they don't want) for P2's "Increase A, decrease B" card (which they do want). 
            After the trade, P1 plays the "Increase A, decrease B" card: which for P1 is +10 -0 = +10.
            P2 plays the "Increase B, decrease A" card: which for P2 might be good if they value B and not A.

          But note: if P2 values A=0, B=10, then playing "Increase B, decrease A" is +10.

          So both benefit.

          However, the net effect on the world: 
            P1's card: A+1, B-1.
            P2's card: B+1, A-1.
            Net:0.

          Again, cancellation.

