  ### Moral Trade Workshop: Trading Game Design

  #### Core Concept
  This game simulates **moral trade** without naming it. Participants discover how trading commitments to causes they value differently creates mutual gains, revealing the divergence-of-priorities condition. The activity surfaces objections (integrity, corruption, insincerity) through a rule requiring justifications.

  ---

  ### Game Materials
  1. **Portfolio Cards** (16 unique cards):  
     - Each card lists a participant’s private weights for 4 causes (e.g., Animal Welfare, Climate Change, Global Poverty, Education) on a 1–10 scale.  
     - **Key**: No two players have identical rankings. Weights are permutations of {10, 8, 6, 4} (e.g., P1: Animal Welfare:10, Climate:8, Poverty:6, Education:4; P2: Animal:4, Climate:10, Poverty:8, Education:6).  
     - *Sample Card*:  
       ```  
       YOUR WEIGHTS:  
       Animal Welfare: 6  
       Climate Change: 10  
       Global Poverty: 4  
       Education: 8  
       ```

  2. **Commitment Tokens**:  
     - Each player starts with 4 tokens (1 per cause). Tokens represent "units of effort" pledged to a cause.  
     - *Example*: P1 holds tokens: [Animal, Climate, Poverty, Education].  

  3. **Pledge Ledger** (Shared Google Sheet or whiteboard):  
     | Trade ID | Party 1 | Party 2 | Token from P1→P2 | Token from P2→P1 | P1’s Justification | P2’s Justification |
     |----------|---------|---------|-------------------|-------------------|---------------------|---------------------|
     | 1        | P1      | P2      | Animal Welfare    | Climate Change    | "I value Climate more than Animal" | "I value Animal more than Climate" |

  ---

  ### Rules
  1. **Trades**:  
     - Players swap **one token for one token** (e.g., P1 gives an "Animal Welfare" token to P2; P2 gives a "Climate Change" token to P1).  
     - No real money or common currency exists. Trades are barter.  

  2. **Justification Requirement**:  
     - A trade is valid **only if both parties publicly state a justification** the other accepts.  
     - *Example*: P1 says: *"I’m trading Animal Welfare away because I care about it least. Your Climate token matters more to me."*  
       P2 says: *"I value Animal Welfare highly, so I’ll trade my Climate token for it."*  

  3. **Scoring**:  
     - Score = Σ (tokens held × personal weight).  
     - *Example*: If P1 holds 2 Climate tokens (weight:10) and 2 Education tokens (weight:8), score = (2×10) + (2×8) = 36.  

  4. **Binding Pledges**:  
     - Once recorded in the ledger, trades are final. Tokens physically change hands.  

  ---

  ### Session Timeline (90 mins)
  | Time      | Phase               | Activity                                                                 |
  |-----------|---------------------|--------------------------------------------------------------------------|
  | 0:00–0:15 | Intro & Setup       | Distribute portfolios/tokens. Explain rules, scoring, and justification requirement. Emphasize: **"Justify trades in terms of your priorities."** |
  | 0:15–0:50 | Trading Round       | Participants mingle and negotiate trades. Each trade requires ledger entry and verbal justification. |
  | 0:50–1:00 | Scoring             | Calculate scores. Display initial vs. final scores. |
  | 1:00–1:25 | Debrief             | Guide discussion using questions below. |
  | 1:25–1:30 | Wrap-up             | Preview next session’s topic: "Moral Trade." |

  ---

  ### Debrief Framework
  1. **Divergence of Priorities**:  
     - *Ask*: "Why did trading create gains? How did your priorities differ from others’?"  
     - *Reveal*: Gains occur when players hold tokens matching their weights. Trade redistributes effort to where it’s valued most.  

  2. **Commitment Devices**:  
     - *Ask*: "How did tokens make commitments tradable? Could you trade without them?"  
     - *Reveal*: Tokens act as verifiable pledges, enabling trust. Real-world parallels: contracts, promises.  

  3. **Objections Surfaced**:  
     - **Integrity**: *Ask*: "Did trading a cause you ‘care about’ feel like betrayal?"  
     - **Corruption**: *Ask*: "Did anyone fear important causes were neglected after trades?"  
     - **Insincerity**: *Ask*: "If you traded a ‘commitment,’ was it ever sincere?"  
     - *Highlight*: These mirror real-world critiques of moral trade (e.g., "Selling out your values").  

  ---

  ### Predictable Problems & Solutions
  1. **Problem: A Player Refuses All Trades**  
     - *Why*: Fear of corruption or integrity concerns.  
     - *Solution*: Allow them to abstain. In debrief, ask: "What would justify a trade for you?"  

  2. **Problem: Coalition "Cornering" a Cause**  
     - *Why*: Players with aligned priorities might hoard tokens (e.g., all value Climate Change highly).  
     - *Solution*: **Rule Addendum**: "No player may hold >3 tokens for one cause." Force diversification.  

  3. **Problem: Superficial Justifications**  
     - *Why*: Players say, "I value X more" without depth.  
     - *Solution*: As facilitator, challenge: "Why does that justify the trade to your partner?"  

  4. **Problem: Unequal Trading Activity**  
     - *Why*: Extroverts trade more; introverts hesitate.  
     - *Solution*: Assign 2–3 mandatory trades per player to ensure participation.  

  ---

  ### Limitations & What You Must Supply
  - **What the Game Can’t Simulate**:  
    Real moral trade involves **future actions**, not static tokens. Players may not feel the "weight" of trading commitments that affect real lives.  
  - **What You Must Add**:  
    In debrief, **connect tokens to real-world stakes**:  
    > *"These tokens represent pledges to act. Trading Animal Welfare effort for Climate effort isn’t abstract—it means redirecting time, money, or voice. Would you do this in reality? Why or why not?"*  

  - **Critical Insight to Highlight**:  
    Moral trade requires **no shared morality**, only divergence in priorities. Yet, it can feel corrupting—this tension is where ethics lives.

  ---

  ### Generated Portfolio Cards (16 Players)
  Use permutations of weights {10, 8, 6, 4} for causes {A, B, C, D} to ensure unique rankings:  
  1. A:10, B:8, C:6, D:4  
  2. A:10, B:8, C:4, D:6  
  3. A:10, B:6, C:8, D:4  
  4. A:10, B:6, C:4, D:8  
  5. A:10, B:4, C:8, D:6  
  6. A:10, B:4, C:6, D:8  
  7. A:8, B:10, C:6, D:4  
  8. A:8, B:10, C:4, D:6  
  9. A:8, B:6, C:10, D:4  
  10. A:8, B:6, C:4, D:10  
  11. A:8, B:4, C:10, D:6  
  12. A:8, B:4, C:6, D:10  
  13. A:6, B:10, C:8, D:4  
  14. A:6, B:10, C:4, D:8  
  15. A:6, B:8, C:10, D:4  
  16. A:6, B:8, C:4, D:10  

  ---

  ### Outcome
  Players will experience gains from diverging priorities, confront trade-offs in commitments, and surface ethical tensions. The game primes them to grasp moral trade intuitively, setting up your formal introduction in the next session.
