  ## Institute for Global Peace Advancement  
  **Annual Report: Fiscal Year 2024**  
  "Measuring Progress, Building Hope"

  ---

  **Executive Summary**  
  The Institute for Global Peace Advancement (IGPA) is pleased to report significant, measurable progress toward global peace in FY2024. Our headline metric, **Total Recorded Violent Deaths Worldwide (TRVDW)**, has reached its **lowest absolute level since records began in 1978**, standing at **126,450**. This represents an **11.2% year-on-year reduction** and confirms a **decade-long downward trend**. This achievement validates IGPA’s core mission and methodology: rigorous, transparent data collection provides the foundation for effective peacebuilding. While challenges remain, the data unequivocally demonstrates that concerted international effort is yielding tangible results in reducing human suffering caused by intentional violence.

  **Key Findings: Conflict & Violence Metrics**

  1.  **Headline Metric: Total Recorded Violent Deaths Worldwide (TRVDW): 126,450 (↓11.2% YoY)**
      *   *Definition:* Deaths resulting from the intentional use of physical force against an individual or group by a formally organized or clearly identifiable actor (state military, paramilitary, recognized armed group, individual perpetrator in documented criminal act), where the proximate cause of death is the violent act itself.(¹)
      *   *Source:* IGPA Conflict Event Database (IGPA-CED), aggregating verified reports from governments, UN agencies, accredited NGOs, and reputable media sources.

  2.  **Per Capita Violent Death Rate: 1.58 per 100,000 (↓12.1% YoY)**
      *   *Note:* IGPA transitioned to reporting the per capita rate as its primary comparative indicator in 2015, recognizing the importance of demographic context in assessing societal security.(²)
      *   *Population Denominator Source:* World Demographic Consortium (WDC) Mid-Year Estimates.(³)

  3.  **State-Based Armed Conflict Deaths: 78,210 (↓8.7% YoY)**
      *   Includes battlefield deaths, collateral civilian casualties in targeted operations, and summary executions directly linked to state or recognized non-state actors in active conflict zones.

  4.  **Non-State Conflict Deaths (e.g., inter-gang, communal violence): 31,885 (↓15.3% YoY)**
      *   *Significant Improvement:* The "Urban Collective Violence" subcategory saw a remarkable **42.1% reduction**, attributed to successful community policing initiatives in several metropolitan regions.(⁴)

  5.  **Intentional Homicides (individual acts): 16,355 (↓9.1% YoY)**

  6.  **Excess Mortality, Unattributed: 1,302,890 (↔ Stable YoY)**
      *   *Definition:* Estimated deaths above baseline mortality in regions experiencing systemic crisis, where attribution to a specific proximate cause (disease, malnutrition, violence) or actor cannot be reliably established by IGPA-CED verification protocols.(⁵)
      *   *Note:* This category now incorporates mortality previously analyzed under specific deprivation frameworks (e.g., Blockade/Resource Deprivation Impact), allowing for a more holistic view of crisis-related mortality under conditions of limited data verifiability.(⁶)

  **Methodology Note**  
  IGPA-CED employs a multi-source verification protocol requiring three independent, corroborating reports for an incident to be recorded. Deaths are attributed to the specific category where the *proximate cause* and *identifiable actor* criteria are most clearly met. Population data for per capita calculations are sourced exclusively from the World Demographic Consortium (WDC), the globally recognized authority for demographic statistics and projections. Changes to category definitions are implemented only after rigorous internal review and peer consultation to ensure methodological consistency aligns with evolving conflict landscapes while maintaining long-term trend comparability.(⁷) All historical data is retrospectively adjusted to reflect current definitions.

  **Looking Ahead**  
  The continued decline in TRVDW is a beacon of hope. IGPA remains committed to refining its methodologies and expanding data partnerships to illuminate the path toward a less violent world. Our focus for FY2025 includes enhancing granularity in regional reporting and developing predictive models for emerging conflict risks.

  ---

  **Appendix A: Internal Memorandum**  
  *Date:* 15 March 2024  
  *To:* IGPA Methodology Review Board  
  *From:* Dr. Anya Petrova, Senior Research Associate (Quantitative Analysis)  
  *Subject:* Conceptual Concerns Regarding TRVDW Metric Validity

  While I do not dispute the technical accuracy of our FY2024 TRVDW figure under our current operational definitions, I urge the Board to initiate a fundamental review of the metric's conceptual validity as a singular indicator of "progress toward peace."

  My concern is not primarily about specific numbers (e.g., the WDC denominator effect(³), the 2015 shift to per capita(²), or the reclassification of deprivation mortality(⁶)), though these choices demonstrably influence the trend line. My concern is ontological: **What phenomenon are we actually measuring, and does its reduction meaningfully signify "less violence"?**

  Our definition(¹) excludes:
  *   Deaths where the actor is diffuse, unidentifiable, or systemic (e.g., deaths from easily treatable diseases in collapsed states, starvation due to economic warfare/sanctions(⁶)).
  *   Deaths where violence is a contributory but not proximate cause (e.g., delayed mortality from injuries, psychological trauma leading to suicide, displacement-related disease).
  *   Non-fatal violence causing severe disability or psychological harm.
  *   Structural violence (systemic deprivation, discrimination) creating conditions where direct violence becomes inevitable.

  By focusing solely on the *proximate, attributable lethal act*, we construct a narrow corridor of "violence." We measure its reduction efficiently, but we risk mistaking this corridor for the entire landscape. We define "violence down" by excluding vast swathes of human suffering that are *consequences* of violence or forms of violence themselves. The reclassification into "Excess Mortality, Unattributed"(⁶) exemplifies this: suffering is statistically acknowledged but conceptually severed from "violence."

  The question isn't "Did the number go down?" (It did, per our rules). The critical question is: **"What empirical reality would constitute evidence that violence has *not* decreased?"** If our metric can consistently show decline while observable human misery intensifies in new or reclassified forms, what does the metric actually signify? Are we measuring peace, or are we measuring our own success at defining a countable subset of harm that happens to be decreasing?

  I propose a working group to explore supplementary metrics capturing broader dimensions of human security and harm, even if they are less "clean" numerically. Relying solely on TRVDW risks painting a dangerously incomplete picture.

  ---

  **Footnotes (Printed in 8pt font at report bottom):**
  (¹) Excludes deaths from indirect causes (e.g., disease in refugee camps, long-term starvation unless directly caused by targeted denial of resources by an identifiable actor during an *active* blockade with *immediate* lethal intent). Excludes deaths from state neglect or economic policy, psychological trauma, non-lethal injury, and acts by unidentifiable/unstructured actors.  
  (²) The absolute TRVDW figure saw a 3.7% increase in 2015 due to intensified conflicts in Regions 7B and 9D. Reporting emphasis shifted to per capita rate that year.  
  (³) WDC methodology for disputed territories and highly fluid populations relies on projections that prioritize continuity and maximal inclusivity; independent audits suggest potential overestimation of 1.2-2.8% globally, varying significantly by region. WDC funding is primarily derived from member states contributing demographic data.  
  (⁴) The "Urban Collective Violence" subcategory definition was revised in Q3 2023, excluding incidents involving fewer than 5 participants and those lacking clear inter-group animus (e.g., spontaneous brawls, isolated gang retaliations). Pre-2023 data recalculated.  
  (⁵) "Unattributed" reflects inability to meet IGPA-CED verification threshold, not absence of cause or actor. Attribution thresholds require confirmed perpetrator identity/affiliation and proximate violent cause.  
  (⁶) Pre-2024, Blockade/Sanction-Related Deprivation Mortality (BSRDM) was estimated separately (FY2023: ~182,000). Integration into "Excess Mortality, Unattributed" aligns with revised verification challenges and focus on measurable, attributable violence. BSRDM data series retired.  
  (⁷) Definitional changes are applied retroactively to the entire IGPA-CED time series to ensure trend consistency. Significant revisions are documented in the Annual Methodology Annex (available upon request).

