  **Key Design Notes:**

  1. **The Trap Mechanism:**  
     - Players unknowingly recreate Parfit's dilemma by:  
       (a) Feeling FOMO during token auction ("What if I'm a hitchhiker?")  
       (b) Experiencing visceral reluctance to pay when safe  
       (c) Realizing tokens only work because they *changed their position* (via guilt penalty)  

  2. **Enforcement Contrast:**  
     Round 1 forces dispositional solutions; Round 2's automation shows why Parfit's puzzle only exists in enforcement-void scenarios. The point difference (Round 1 token-hitchhikers: 8 pts; Round 2: 9 pts) makes enforcement feel superior.

  3. **Guilt Penalty Rationale:**  
     The 11-point penalty makes token revocation net-negative (-2 vs paying at +8). This mirrors how real dispositions feel "inescapable" without literal force.

  4. **Debrief Hooks:**  
     The debrief_map ties game moments directly to Parfit's framework. Each facilitator_line quotes or paraphrases *Reasons and Persons* to solidify connections.

  **Running Tips:**
  - **Token Auction:** Emphasize "This is binding investment" to create sunk-cost psychology
  - **Role Assignment:** Physically separate pairs to build desert isolation feel
  - **Round Transition:** Announce "GOVERNMENT HAS BUILT ROADS" before Round 2 for humor
  - **Point Tracking:** Use index cards for personal accounting (no tech needed)

  This creates the visceral "Aha!" you want - they'll *feel* why rationality requires dispositions when enforcement fails, exactly as Parfit describes. The JSON is self-contained for co-facilitators.
