answer: |-
  **Case:** You face two decisions. First, choose between:  
  A) $100 for sure, or B) 1% chance of $0, 89% chance of $100, 10% chance of $200.  
  Second, choose between:  
  C) 11% chance of $100 (else $0), or D) 10% chance of $200 (else $0).  

  **Checks:**  
  - **REU scores (with \(u(x) = x\), \(r(p) = p^2\)):**  
    - Choice 1:  
      - Option A: Certain outcome → REU = 100.  
      - Option B:  
        - Improvement from $0 to $100: \(100 \times r(0.89 + 0.10) = 100 \times r(0.99) = 100 \times (0.99)^2 = 98.01\)  
        - Improvement from $100 to $200: \(100 \times r(0.10) = 100 \times (0.10)^2 = 1\)  
        - REU(B) = \(0 + 98.01 + 1 = 99.01\)  
      - **REU agent chooses A (100 > 99.01)**.  
    - Choice 2:  
      - Option C: Improvement from $0 to $100: \(100 \times r(0.11) = 100 \times (0.11)^2 = 1.21\) → REU = 1.21.  
      - Option D: Improvement from $0 to $200: \(200 \times r(0.10) = 200 \times (0.10)^2 = 2\) → REU = 2.  
      - **REU agent chooses D (2 > 1.21)**.  

  - **Expected value (EV) and EU maximizer behavior (with \(r(p) = p\)):**  
    - Choice 1:  
      - EV(A) = 100, EV(B) = \(0.01 \times 0 + 0.89 \times 100 + 0.10 \times 200 = 109\)  
      - **EV maximizer chooses B (109 > 100)**.  
    - Choice 2:  
      - EV(C) = \(0.11 \times 100 = 11\), EV(D) = \(0.10 \times 200 = 20\)  
      - **EV maximizer chooses D (20 > 11)**.  

  - **Role of convex \(r(p) = p^2\):**  
    - Critical cumulative probabilities:  
      - In Option B (choice 1), the jump to $100 (at cumulative probability 0.99) is underweighted (\(r(0.99) = 0.9801 < 0.99\)), and the jump to $200 (at cumulative probability 0.10) is severely underweighted (\(r(0.10) = 0.01 < 0.10\)). This makes B less attractive than A.  
      - In Option C (choice 2), the jump to $100 (at cumulative probability 0.11) is underweighted (\(r(0.11) = 0.0121 < 0.11\)). In D, the jump to $200 (at cumulative probability 0.10) is underweighted (\(r(0.10) = 0.01 < 0.10\)), but the higher upside (200 vs 100) compensates for the worse weighting, leading to D > C.  
    - Convex \(r\) flips choice 1 (A > B) while leaving choice 2 aligned with EV (D > C).  

  - **Collapse with \(r(p) = p\) (no risk weighting):**  
    - Choice 1: REU(A) = 100, REU(B) = \(100 \times 0.99 + 100 \times 0.10 = 109\) → chooses B.  
    - Choice 2: REU(C) = \(100 \times 0.11 = 11\), REU(D) = \(200 \times 0.10 = 20\) → chooses D.  
    - Both choices now match the EV maximizer (B and D), eliminating the contradiction.  

  **Load-bearing feature:** The 1% "disaster state" ($0) in Option B (choice 1) causes the convex \(r\) to underweight *all* improvements above $0. This makes B’s upside (even the 89% chance of $100) less valuable, tipping the choice to A. In choice 2, both options share a high chance of $0, so the underweighting affects C and D more symmetrically, and D’s higher upside dominates. The pair (A in choice 1, D in choice 2) violates independence: the 89% chance of $100 common to B and C is treated inconsistently.  

  **EU defense:** A defender of expected utility would deny that utility is linear. They’d argue that the choices reveal a nonlinear utility function (e.g., concave for gains), allowing EU to explain A > B (via diminishing marginal utility) and D > C (via higher upside). They reject the stipulation of linear utility, asserting that "risk attitude" is *inherently* part of utility curvature. REU’s separation of risk and utility is thus reframed as a re-description of the same phenomenon.
