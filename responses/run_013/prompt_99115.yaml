answer: |-
  Here's the exam question, model answer, and marking scheme in continuous prose as requested:

  **Exam Question:**  
  "Expressivism faces distinctive challenges in accounting for the meaning of embedded moral claims, particularly under negation. First, explain why the negation of a simple moral assertion (e.g., ‘Murder is not wrong’) presents a deeper problem for expressivism than its occurrence in the antecedent of a conditional (e.g., ‘If murder is wrong, then…’). Focus on the attitude-expression model and why negation appears to leave ‘nothing’ to express. Second, evaluate the following proposed solution: ‘When a moral claim is embedded (e.g., in negation), it refers to the attitude one would express by asserting it outright. Negating such a claim expresses an attitude *toward that very attitude*.’ Does this proposal successfully resolve the problem? Critically assess whether it either (a) collapses expressivism into a form of descriptivism by treating attitudes as objects of description, or (b) fails to explain the inconsistency between a moral claim and its negation. Your answer should pinpoint where the proposal founders."

  **Model Answer (Approx. 600 words):**  
  The Frege-Geach problem highlights expressivism’s struggle to explain how moral sentences retain consistent meaning when embedded in complex logical contexts like conditionals or negations, where no direct attitude-expression occurs. However, negation poses a uniquely acute challenge compared to the conditional case. For conditionals, expressivists like Blackburn offer a quasi-realist strategy: uttering "If murder is wrong, then..." expresses a *higher-order* attitude, such as disapproval of combining disapproval of murder with indifference to telling on friends. The entire conditional expresses a complex *conditional* commitment about one’s attitudes. While contentious, this provides *some* expressivist resource for the antecedent’s role without attributing truth-conditions.  

  Negation lacks this recourse. Consider asserting "Murder is not wrong." If asserting "Murder is wrong" expresses disapproval of murder (say, *boo!*), what does its negation express? Expressing the *absence* of disapproval (*not-boo!*) fails catastrophically. It doesn’t capture the *positive* stance often involved in rejecting wrongness (e.g., indifference or approval). More crucially, it cannot ground the *logical inconsistency* between "Murder is wrong" and "Murder is not wrong." If the first expresses *boo!* and the second merely *not-boo!*, there’s no contradiction; one could coherently lack disapproval without actively denying wrongness. Expressivism seems unable to explain why these sentences conflict, as logic demands, because bare negation offers no positive attitude to serve as the object of a higher-order attitude in the way a conditional’s antecedent can.  

  The proposed solution – that embedded claims refer to the attitude asserting them would express, and negation expresses an attitude *toward that attitude* – attempts to fill this void. Applied to negation: "Murder is not wrong" means something like "I disapprove of disapproving of murder." This aims to provide a positive attitude (disapproval of disapproval) and explain inconsistency: asserting "Murder is wrong" expresses disapproval of murder (*boo!*), while "Murder is not wrong" expresses disapproval *of that very disapproval* (*boo boo!*). Contradiction arises because one cannot simultaneously hold an attitude and disapprove of holding it without a kind of pragmatic incoherence.  

  However, this solution fails critically in two ways. First, it collapses into descriptivism. If "murder is wrong" embedded in negation *refers* to the attitude of disapproval (as the object of a higher-order attitude), then it ceases to *express* that first-order attitude and instead *describes* or *mentions* it. The meaning shifts from expressing disapproval to *talking about* disapproval. This transforms expressivism into a subjectivist descriptivism where "Murder is wrong" means "I disapprove of murder," and its negation means "I disapprove of disapproving of murder." Moral discourse now describes the speaker’s psychological states, undermining expressivism’s core aim to reject moral facts and offer a purely non-descriptive account of meaning.  

  Second, if we resist this collapse and insist the higher-order attitude is purely expressive, not descriptive, the inconsistency problem resurfaces unexplained. Why is it inconsistent to simultaneously disapprove of murder (*boo!*) and disapprove of *that* disapproval (*boo boo!*)? Expressivism, lacking robust truth-conditions, needs a psychological story about *why* these attitudes conflict. Saying they are "inconsistent attitudes" merely restates the logical problem in psychological terms without explaining the *source* of the norm that forbids this combination. Is it conceptually impossible? Irrational? Culturally forbidden? Without a clear, expressivist-compatible account of this normative constraint – one that doesn’t tacitly appeal to truth-conditional contradiction – the proposal fails to solve the core problem: explaining the *logical* inconsistency using *only* the resources of expressed attitudes. The negation case thus remains expressivism’s most potent adversary, exposing the difficulty of grounding logic in psychology alone.

  **Marking Scheme:**  
  An A-grade answer (Excellent: 70%+) must comprehensively address both parts of the question. For the first part, it must clearly distinguish the conditional and negation cases, explicitly stating why negation is harder: the conditional allows an expressivist appeal to a complex conditional/higher-order attitude governing combinations of attitudes, while negation lacks a plausible positive attitude to express, making the inconsistency between a claim and its negation inexplicable on purely attitudinal grounds. Merely reciting the Frege-Geach problem generally or conflating negation with conditionals is insufficient. For the second part, it must accurately present the proposed solution (embedding refers to the attitude of assertion, negation expresses attitude-toward-that-attitude) and deliver *both* critical assessments effectively. It must argue that treating the embedded claim as *referring* to an attitude (making it the object of the higher-order attitude) constitutes descriptivism/cognitivism about attitudes (collapse), *and* separately argue that if the higher-order attitude is purely expressive, the proposal fails to explain *why* the expressed attitudes (e.g., disapproval and disapproval-of-that-disapproval) are inconsistent, leaving the logical conflict unresolved. Merely identifying one flaw is inadequate for an A. An answer that covers both parts but lacks depth, clarity, or precise logical focus on the core issues (e.g., vagueness on why negation lacks a conditional-like resource, or conflating the two criticisms of the proposal) would typically merit a B (Good: 60-69%). Significant omissions (e.g., failing to treat negation separately, not engaging with both criticisms of the proposal, misstating expressivism or the solution) or serious confusion would fall below a B. Crucially, an A answer must demonstrate understanding that the negation problem is harder *because* expressivism lacks a resource analogous to the conditional attitude for conditionals, and must pinpoint *exactly* where the proposed fix either describes attitudes (abandoning expressivism) or leaves the logical inconsistency psychologically unexplained. Errors like reducing the problem solely to non-assertoric contexts without focusing on the unique emptiness of negation, or suggesting the solution works without confronting its fatal flaws, should cost significant marks.
