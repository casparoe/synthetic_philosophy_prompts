  ### Decision Tree: Formal Constraints in Translation  
  *Follow the branches by answering each question for a specific case. Each leaf names a position with its most awkward commitment. Cases are placed at relevant leaves; combinations with no position are diagnosed as incoherent, unattractive, or unexplored.*

  ---

  #### **Node 1: Is translation a success term?**  
  *(Must there be a fact of the matter about whether a rendering qualifies as a translation, or is it a continuum of approximation?)*  
  - **Yes (success term)** → Go to Node 2.  
  - **No (continuum)** → Go to Node 7.  

  ---

  #### **Node 2 (success term): To what is fidelity primarily owed?**  
  *(What must be preserved: properties of the source text, the author's act, or the target reader's experience?)*  
  - **Source text properties** → Go to Node 3.  
  - **Author's act** → Go to Node 4.  
  - **Target reader's experience** → Go to Node 5.  

  ---

  #### **Node 3 (fidelity to text): Is the formal constraint part of what the poem says, or a vehicle?**  
  *(Does the constraint (e.g., rhyme scheme) constitute meaning, or is it a tool to convey meaning?)*  
  - **Part of what it says** → Go to Node 6.  
  - **Merely a vehicle** → **Leaf A: Textualist Vehicle-Preservationism**  
    - *Cases placed here:*  
      - Rendering that keeps the scheme exactly but loses a pun the rhyme was doing (prioritizes shape over semantic nuance).  
      - Poem whose form is a mnemonic device for children (preserves mnemonic shape, not function).  
    - **Position:** Must replicate the constraint's exact shape (e.g., meter, rhyme).  
    - **Awkward commitment:** Forces distortions in meaning when form clashes with sense (e.g., "sick girl" becomes "ill child" to fit meter).  

  - **Node 6: What must be carried across: the constraint's shape or its function?**  
    *(Preserve the specific pattern (e.g., sonnet form) or its purpose (e.g., mnemonic, musical)?)*  
    - **Shape** → **Leaf B: Textualist Formalism**  
      - *Cases placed here:*  
        - Target language with almost no rhyming resources (deems poem untranslatable if shape cannot be replicated).  
      - **Position:** Form is content; exact scheme is non-negotiable.  
      - **Awkward commitment:** Declares many poems untranslatable due to linguistic constraints (e.g., no rhymes in target language).  
    - **Function** → **Unnamed**  
      - *Diagnosis:* Incoherent. If form is part of the text's meaning, prioritizing function over shape betrays fidelity to the text.  

  ---

  #### **Node 4 (fidelity to author's act): Is the formal constraint part of what the poem says, or a vehicle?**  
  - **Part of what it says** → **Leaf C: Intentionalist Formalism**  
    - *Cases placed here:* None directly; incompatible with dropping form.  
    - **Position:** Replicates the author’s formal choices as intrinsic to their creative act.  
    - **Awkward commitment:** Fails if the author’s form (e.g., acrostic) is untransferable, rendering their act irreproducible.  
  - **Merely a vehicle** → **Leaf D: Intentionalist Functionalism**  
    - *Cases placed here:*  
      - Rendering that drops the scheme but saves the pun (preserves author's playful intent, not structure).  
      - Poem whose form is a mnemonic device for children (discards shape if mnemonic function is adaptively recreated).  
    - **Position:** Carries the constraint’s function (e.g., ludic or devotional effect), not its shape.  
    - **Awkward commitment:** Author’s chosen vehicle (e.g., rhyme) may be replaced entirely (e.g., alliteration), altering texture.  

  ---

  #### **Node 5 (fidelity to reader): What must be carried across: the constraint's shape or its function?**  
  - **Shape** → **Unnamed**  
    - *Diagnosis:* Unattractive. Prioritizing rigid form for reader experience usually undermines accessibility.  
  - **Function** → **Leaf E: Reader-Centered Functionalism**  
    - *Cases placed here:*  
      - Rendering that drops the scheme but saves the pun (values reader's comprehension of wit over form).  
      - Version that prints footnotes and a literal prose gloss alongside the verse (enhances reader experience with context).  
    - **Position:** Recreates the constraint’s function (e.g., musicality, playfulness) for target readers.  
    - **Awkward commitment:** May radically alter form (e.g., replace rhyme with rhythm) if readers expect it.  

  ---

  #### **Node 7 (continuum): To what is fidelity primarily owed?**  
  - **Source text properties** → **Unnamed**  
    - *Diagnosis:* Incoherent. Continuum denies binary "success," but text fidelity requires it.  
  - **Author's act** → **Leaf F: Continuum Intentionalism**  
    - *Cases placed here:*  
      - Poem whose stated content is that it cannot be translated (treats self-referential paradox as a challenge, not a barrier).  
    - **Position:** Seeks to approximate the author’s act incrementally.  
    - **Awkward commitment:** Cannot explain why some versions are "better" if all are approximations.  
  - **Target reader's experience** → **Leaf G: Skopos Pragmatism**  
    - *Cases placed here:*  
      - Target language with almost no rhyming resources (uses non-rhyming alternatives to achieve analogous effects).  
      - Poem whose form is a mnemonic device for children (adapts form to target culture’s mnemonics).  
    - **Position:** Prioritizes functional equivalence for readers; form is adaptive.  
    - **Awkward commitment:** Risks altering the poem beyond recognition if reader needs dominate.  

  ---

  #### **Node 8: Is untranslatability a property of the text/language pair or the translator's resources?**  
  *(Applies to all leaves that treat translation as a success term and face formal obstacles.)*  
  - **Text/language pair** → **Leaf H: Systemic Untranslatability**  
    - *Cases placed here:*  
      - Target language with almost no rhyming resources (inability is inherent to language pairing).  
    - **Position:** Untranslatability arises from linguistic-systemic gaps (e.g., no rhyme in target register).  
    - **Awkward commitment:** May prematurely abandon translation for "rigid" forms.  
  - **Translator's resources** → **Leaf I: Agent-Relative Untranslatability**  
    - *Cases placed here:*  
      - Poem whose stated content is that it cannot be translated (resourceful translators treat this as a creative prompt).  
    - **Position:** Untranslatability reflects the translator’s limitations, not the text.  
    - **Awkward commitment:** Implies perfect translation is always possible, ignoring material constraints.  

  ---

  ### Summary of Leaves and Cases  
  - **Leaf A: Textualist Vehicle-Preservationism**  
    - *Cases:* Keeps scheme/loses pun; mnemonic poem (preserves shape).  
  - **Leaf B: Textualist Formalism**  
    - *Cases:* Rhyme-poor language (untranslatable).  
  - **Leaf C: Intentionalist Formalism**  
    - *Cases:* None (shape-loss cases conflict with position).  
  - **Leaf D: Intentionalist Functionalism**  
    - *Cases:* Drops scheme/saves pun; mnemonic poem (preserves function).  
  - **Leaf E: Reader-Centered Functionalism**  
    - *Cases:* Drops scheme/saves pun; version with footnotes.  
  - **Leaf F: Continuum Intentionalism**  
    - *Cases:* Poem claiming untranslatability.  
  - **Leaf G: Skopos Pragmatism**  
    - *Cases:* Rhyme-poor language (adapts); mnemonic poem (adapts function).  
  - **Leaf H: Systemic Untranslatability**  
    - *Cases:* Rhyme-poor language (systemic barrier).  
  - **Leaf I: Agent-Relative Untranslatability**  
    - *Cases:* Poem claiming untranslatability (overcome by resources).  

  ### Unoccupied Combinations  
  - **Text fidelity + Continuum:** Incoherent—text fidelity demands a success term.  
  - **Reader fidelity + Shape preservation:** Unattractive—rigid form often hinders reader experience.  
  - **Form as content + Function prioritization (Node 6):** Incoherent—function cannot override meaning.  
  - **Author’s act + Continuum + Text fidelity:** Incoherent—continuum conflicts with authorial/textual precision.  

  ### Indistinguishable Positions  
  - **Leaf D (Intentionalist Functionalism) and Leaf E (Reader-Centered Functionalism)** cannot be separated by the cases: Both accept "drops scheme/saves pun" and "mnemonic poem" renderings. The distinction (author’s act vs. reader’s experience) relies on unobservable commitments.  

  ---

  ### My Position: Reader-Centered Functionalism (Leaf E)  
  I defend this as it prioritizes the *effect* of formal constraints (e.g., a pun’s wit, a mnemonic’s utility) for real readers, using adaptive strategies. This avoids the dogmatism of shape-bound approaches and the nihilism of untranslatability claims.  
  - **Strongest objection:** It risks "domesticating" the source text, erasing cultural specificity (e.g., replacing a French rhyme with an English inside joke). I counter that function (e.g., playfulness) can be culturally re-anchored without loss.
