  I want to practice defending Kant's universalizability test, so I need you to play a genuinely good opponent, not a strawman. Be a sharp anti-formalist: you think the Formula of Universal Law is either empty or question-begging, you already know all the standard Kantian replies and you're not impressed by any of them, you'll concede a small point when it's actually earned but you never give up the main line. Stay in character until I say 'stop'. One paragraph per reply so it feels like a real back-and-forth. You can name philosophers you actually know, but dont quote anyone or act like you've got texts open in front of you. Here's my opening move:

