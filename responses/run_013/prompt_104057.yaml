answer: |-
  ### Exam Question: Chance and Ignorance Final  
  **Time Allowed:** 45 minutes  
  **Total Marks:** 20  

  ---

  **Question:**  
  Critically evaluate the application of the Principle of Indifference in the following two scenarios. For each, explain precisely why it generates conflicting probability assignments. Discuss whether the underlying issue is the same in both cases. Finally, outline how a defender of the Principle of Indifference might respond to these challenges, addressing whether and how the principle can be applied consistently. Use these cases to comment on the broader requirements for assigning "ignorance priors."  

  **Case 1:** A machine produces ball bearings. The only information available is that each bearing’s diameter \(d\) satisfies \(0 < d \leq 2\) cm. What is the probability that \(d \leq 1\) cm?  
  - If we apply a uniform prior over diameter, \(P(d \leq 1) = 1/2\).  
  - If we apply a uniform prior over volume \(V = \pi d^3/6\) (where \(0 < V \leq \frac{4\pi}{3}\) cm³), \(P\left(V \leq \frac{\pi}{6}\right) = 1/8\).  
  - If we apply a uniform prior over surface area \(A = \pi d^2\) (where \(0 < A \leq 4\pi\) cm²), \(P(A \leq \pi) = 1/4\).  

  **Case 2:** A point is chosen uniformly at random on the surface of a sphere. We condition on the event that this point lies exactly on a specific great circle (e.g., the meridian at longitude 0°). What is the probability that the point is within 30° of the North Pole?  
  - If we condition by taking a limiting thin wedge of width \(\epsilon\) around the great circle and then let \(\epsilon \to 0\), we obtain \(P \approx 0.067\).  
  - If we parameterize position along the great circle uniformly by central angle \(\theta\) (from the North Pole), we obtain \(P(\theta \leq 30^\circ) = 1/6\).  

  ---

  ### Model Answer (Approx. 750 words)  
  **Part 1: Analysis of Case 1 (Ball Bearings)**  
  The conflicting probabilities in Case 1 arise from applying the Principle of Indifference to different *transformations* of the same physical quantity. The principle demands that equal intervals of a parameter are equally probable when we have "no reason to prefer" any value. However, diameter (\(d\)), volume (\(V \propto d^3\)), and surface area (\(A \propto d^2\)) are non-linearly related. A uniform prior over \(d\) implies non-uniform priors over \(V\) and \(A\), and vice versa. Crucially, **no unique "natural" parameterization exists given only the interval constraint**. The principle fails because it is not *reparameterization-invariant*: it produces inconsistent results depending on the choice of variable (diameter, volume, or area), despite all describing the same physical ignorance.  

  **Part 2: Analysis of Case 2 (Sphere Conditioning)**  
  The conflict in Case 2 stems from conditioning on a measure-zero event (a great circle, which has zero area on the sphere). The two approaches reflect different *limiting procedures* for defining "uniform on the great circle given uniform on the sphere":  
  - **Wedge method:** Taking a thin wedge of angular width \(\epsilon\) around the great circle, calculating the conditional probability, and letting \(\epsilon \to 0\). This preserves the 2D uniformity, weighting points by their original latitude density (\(\propto \cos(\text{latitude})\)).  
  - **Arc-length method:** Directly parameterizing the great circle by arc length (or central angle), ignoring the original embedding.  
  The wedge method respects the higher-dimensional symmetry (rotational invariance of the sphere), while the arc-length method imposes uniformity on a lower-dimensional space without reference to the original measure. The issue is **how to define conditional probability on sets of measure zero** in a way consistent with the prior symmetry.  

  **Part 3: Commonalities and Differences**  
  Both cases expose limitations of the Principle of Indifference when applied naïvely:  
  - **Shared issue:** The principle is sensitive to the *choice of descriptive variable* (Case 1) or *conditioning procedure* (Case 2), lacking invariance under reparameterization or conditioning.  
  - **Key difference:** Case 1 is a problem of **ignorance parameterization** without geometric structure, while Case 2 is a problem of **consistent conditioning** in a space with explicit symmetry (the sphere’s rotational invariance). Case 2 admits a resolution by privileging the symmetry of the original space.  

  **Part 4: Defending and Refining the Principle**  
  A defender of the Principle of Indifference might argue it remains viable if restricted to contexts with **objective symmetries**. For Case 2, the rotational symmetry of the sphere uniquely selects the wedge method: uniformity on the sphere is rotationally invariant, and the wedge limit preserves this. For Case 1, however, no such symmetry exists—the interval \((0, 2]\) lacks intrinsic structure to privilege diameter over volume. Here, the principle is **underdetermined** without additional physical context (e.g., manufacturing processes might suggest diameter as "natural"). The refined principle states: *Apply indifference only to variables for which there is a symmetry justifying uniformity*. When symmetries exist (e.g., rotational/translation invariance), they uniquely determine the prior (e.g., Lebesgue measure on Cartesian coordinates). When absent (Case 1), the principle cannot resolve ignorance alone.  

  **Part 5: Broader Implications**  
  These cases illustrate that "ignorance priors" require:  
  1. **Symmetry justification:** Reparameterization-invariance can be achieved only if the indifference choice respects a group symmetry (e.g., Jaynes’ solution to Bertrand’s paradox using rotational invariance).  
  2. **Context-dependence:** What constitutes a "natural" parameter (e.g., diameter vs. volume) depends on physical or experimental constraints, not pure logic.  
  The Principle of Indifference is not universally "inconsistent," but it is **incomplete**: it functions only when augmented by symmetries or domain-specific information. In their absence, Bayesian priors must be grounded in empirical or theoretical constraints beyond ignorance.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A. Analysis of Case 1 (5 marks)**  
  - **✓ (2 marks):** Identifies non-linear transformations (diameter → volume/area) as the cause of inconsistency.  
  - **✓ (2 marks):** Explains lack of reparameterization invariance & absence of "natural" parameter.  
  - **✓ (1 mark):** Notes absence of symmetry/geometric structure.  
  *Weak answers*: Only state "different parameters give different results" without explaining *why*.  

  **B. Analysis of Case 2 (5 marks)**  
  - **✓ (2 marks):** Attributes conflict to measure-zero conditioning.  
  - **✓ (2 marks):** Contrasts wedge method (preserves sphere symmetry) vs. arc-length method (ignores embedding).  
  - **✓ (1 mark):** Recognizes rotational symmetry as key factor.  
  *Weak answers*: Claim "both are arbitrary" without addressing limiting procedures or symmetry.  

  **C. Comparison of Cases (3 marks)**  
  - **✓ (2 marks):** States shared sensitivity to parameterization/conditioning.  
  - **✓ (1 mark):** Distinguishes Case 1 (no structure) vs. Case 2 (symmetry resolves ambiguity).  
  *Weak answers*: Treat cases as identical; miss symmetry distinction.  

  **D. Defense of Principle & Requirements (5 marks)**  
  - **✓ (2 marks):** Proposes symmetry as a criterion for consistent application (✓✓ Case 2 resolved).  
  - **✓ (2 marks):** Explains underdetermination in Case 1; need for external context.  
  - **✓ (1 mark):** States principle is incomplete but not dead (context/symmetry dependent).  
  *Weak answers*: Reject principle entirely; suggest "all methods are equally valid."  

  **E. Broader Implications (2 marks)**  
  - **✓ (1 mark):** Notes reparameterization-invariance requires symmetry.  
  - **✓ (1 mark):** Emphasizes context-dependence of "natural" parameters.  
  *Top-tier discriminator*: Links to Jaynes (symmetry) without naming him; distinguishes resolvable (Case 2) vs. unresolvable (Case 1) ignorance.  

  ---

  ### Differentiation Guide  
  - **A (18–20):** Clear symmetry analysis in both cases; precise differentiation of resolvable/unresolvable ignorance; defends principle via symmetry without context collapse.  
  - **B (14–17):** Correct analysis but vaguer on symmetry; may miss underdetermination in Case 1.  
  - **C (10–13):** Identifies conflicts but offers superficial comparison; may conclude "indifference is flawed."  
  - **D (7–9):** Describes cases but lacks mechanistic explanation (e.g., "volume distorts diameter").  
  - **E (<7):** Misapplies paradoxes (e.g., "like Bertrand") or asserts Bayesianism is invalid.  

  This structure forces engagement with *why* indifference fails, leverages novel cases to block memorization, and rewards syntheses linking symmetry to parameterization—ensuring the top marks reflect genuine insight.
