answer: |-
  Here's a two-way analysis of the Sokal Affair through Rorty's antirepresentationalism, addressing your core concerns directly:

  **Mapping the Players & Events (Rortyan Lens):**

  1.  **Alan Sokal:** Operated within *two* vocabularies simultaneously.
      *   *Scientific Vocabulary:* Knew the paper was "nonsensical" by the standards of physics/math (lacked predictive power, internal coherence, connection to established scientific practices). His *reason* was to expose what he saw as lax epistemic standards in cultural studies using *their own tools*.
      *   *Cultural Studies/Jargon Vocabulary:* Mastered the surface grammar, citations, and buzzwords ("hermeneutics of quantum gravity," "transgressive textualities"). His *reason* here was performative – to get published by mimicking the form.

  2.  **Social Text Editors:** Operated primarily within the *cultural studies vocabulary* prevalent in certain circles at the time.
      *   *Reasons:* Found the paper plausible *within their vocabulary*. It engaged with relevant theorists (Lacan, Irigaray, Latour), used accepted jargon, critiqued "scientism," and aligned with their project of challenging traditional boundaries of knowledge. They likely saw it as a bold, interdisciplinary synthesis supporting a broadly social constructionist perspective. *Their acceptance consisted in* finding the paper *justified* within their current web of beliefs and discursive practices – it cohered with their norms and interests.

  3.  **The Hoax Revelation (Sokal's Confession):** This was a *vocabulary collision event*. Sokal switched vocabularies, declaring the paper "nonsense" *by scientific standards*. This forced a confrontation.

  **Rorty's Account of the "Wrongness":**

  *   **Can he call the editors "wrong"? Yes, absolutely.** But *not* because the paper "failed to correspond to reality."
  *   **Why they were "wrong" (Rortyan Explanation):**
      *   **Internal Incoherence within the Vocabulary:** The paper was accepted *as scholarship*. Scholarship within *any* vocabulary (including cultural studies) carries implicit norms: coherence, argumentative rigor, genuine engagement with ideas, intellectual honesty. Sokal's paper deliberately violated these norms *from within*. It was a performative contradiction – *using* the vocabulary to *undermine* its own practices by being internally vacuous and deceptive. The editors failed to apply *their own community's standards* adequately.
      *   **Failure of Purpose:** Vocabularies are tools for specific purposes. The cultural studies vocabulary aims (among other things) at insightful cultural critique and understanding. The paper didn't *do* that work; it was gibberish masquerading as insight. It was useless *for the purposes* the vocabulary ostensibly serves.
      *   **"Out-Vocabularied" *is* the Mechanism, but it's Deeper:** It's not just that Sokal used words better. He exploited a *failure of critical application* within the vocabulary. He revealed that the vocabulary's *own* justificatory practices had become lax, susceptible to empty signifiers lacking the coherence or argumentative force the vocabulary *itself* requires for meaningful discourse. The vocabulary temporarily "lost its grip on itself" – its internal standards weren't enforced.

  **The Social Fact vs. Representational Fact: Easier for Rorty.**

  *   **The Confession is Key:** Precisely because the exposure wasn't "reality biting back" (like an experiment failing), but a *social act* (Sokal's announcement), it perfectly illustrates Rorty's point. What changed wasn't direct contact with mind-independent reality forcing belief revision. What changed was the *social context of justification*.
  *   **Justification is Social:** The paper was justified *within the Social Text editorial context* based on social norms and discursive practices. Its *unjustification* also occurred socially: Sokal's confession created a new social context where the paper was re-evaluated against both the cultural studies vocabulary's *own* implicit standards and the contrasting standards of the scientific vocabulary. The "wrongness" emerged from the clash and re-application of social norms, not from the paper bumping into raw reality.

  **Does it Dent Antirepresentationalism? Does it Smuggle Representation In?**

  *   **The Core Challenge:** Does Rorty's framework allow him to distinguish *good science* (string theory, evolutionary biology) from *bad science* (Sokal's hoax paper, phlogiston theory) or nonsense *without* implicitly relying on representation ("this one tracks reality better")?
  *   **Rorty's Resources & Response:**
      *   **Usefulness/Predictive Power:** This is Rorty's primary tool. Good science isn't "truer" because it represents reality, but because the vocabularies it generates are *more useful* for prediction and control. They let us *do* more things we want to do (build bridges, cure diseases, send probes to Mars) than alternative vocabularies. Sokal's paper was spectacularly *useless* for *any* purpose except deception.
      *   **Internal Rigor & Coherence:** Scientific vocabularies develop stringent internal standards of evidence, logical consistency, falsifiability, and peer review. These aren't windows onto reality; they are socially enforced norms that *produce* reliable and useful tools. The hoax paper utterly failed *any* reasonable standard of rigor, even within the cultural studies vocabulary it mimicked.
      *   **Contrastive Comparison:** We can compare vocabularies *holistically* based on their fruits. The vocabulary of modern physics produces lasers, GPS, and nuclear power plants. The vocabulary deployed in Sokal's hoax produces nothing but confusion and embarrassment when its internal emptiness is revealed. We don't need "representation" to see this vast difference in practical outcomes and coherence.
      *   **No Smuggling Required:** Rorty argues this distinction is made *entirely* on grounds of usefulness, coherence, and social practice. The fact that the useful/coherent vocabulary *also* seems to describe a world independent of us is, for Rorty, a consequence of its usefulness, not proof of representational accuracy. He replaces the correspondence theory with a coherence theory combined with consequentialism (does this way of talking help us achieve our goals?).

  **Does Rorty Come Out Fine? Mostly Yes, with Caveats.**

  1.  **Strength:** The Sokal Affair *vividly illustrates* Rorty's core theses:
      *   Justification is social and contingent.
      *   Beliefs are caused by the world (Sokal wrote the paper *because* of the science wars context) but justified by us (editors found it acceptable).
      *   "Wrongness" arises from failures within or clashes between vocabularies and their purposes (internal incoherence, uselessness, deception violating norms).
      *   The exposure via confession reinforces the social nature of justification.
      *   He *can* call the editors wrong robustly based on *their own* failed standards and the uselessness/deception inherent in the text.

  2.  **Where Critics See a Dent/Weakness:**
      *   **The "Ouch!" Factor:** Critics argue that Rorty downplays the *empirical constraint* aspect. The reason scientific vocabularies are so useful isn't *just* social coherence; it's that they are disciplined by a world that pushes back (experiments fail, bridges collapse). Sokal's paper *didn't* cause an observable empirical failure *within the cultural studies journal process itself*. The "pushback" was purely social (the confession). Critics ask: Does Rorty adequately capture the *specific* kind of resistance the *physical world* provides to *empirical* vocabularies, making some failures (a bridge collapse) fundamentally different in kind from the social failure (accepting a hoax paper) even if both involve social re-justification?
      *   **Usefulness as a Proxy:** Is "usefulness for prediction and control" really just a pragmatic stand-in for "representational accuracy"? Rorty says no; it's all we have and need. Critics suspect the distinction collapses, and usefulness *presupposes* representation. The Sokal case doesn't decisively settle this deeper metaphysical debate, but it shows Rorty *can* make the distinction without *explicitly* invoking representation.
      *   **Normative Bite:** While Rorty can call the hoax "wrong," his framework makes it harder to ground *why* intellectual honesty and rigor are *universally* preferable to laxity and deception, beyond contingent social agreement or pragmatic consequences. He bites this bullet: norms are historically contingent, but some (like honesty in scholarship) turn out to be incredibly durable because of their usefulness for maintaining communities and projects we care about.

  **Conclusion:**

  The Sokal Affair doesn't seriously dent Rorty's antirepresentationalism; in fact, it serves as a potent case study *for* it. It demonstrates:
  *   Justification is social.
  *   "Wrongness" is defined by failure within vocabularies or clashes between them (incoherence, deception, uselessness).
  *   Useful, reliable vocabularies (science) are distinguished not by mirroring reality but by their superior coherence, predictive power, and practical fruits.
  *   The social nature of the hoax's exposure aligns perfectly with Rorty's view.

  The "dent" critics perceive isn't a failure of Rorty to explain *this specific event* – he explains it well on his own terms. It's the *persistent feeling* that the *reason* scientific vocabularies are so powerful involves a kind of constraint (the causal pressure of the world) that Rorty's focus on vocabularies and social justification seems to background. However, Rorty consistently argues this constraint is causal, not justificatory, and is fully accounted for within his framework by the *consequences* (usefulness) of our beliefs. He comes out of the Sokal episode largely unscathed, precisely because the hoax turned on social justification and vocabulary incoherence – his home turf. The price – grounding normativity in contingent social practice and usefulness rather than representational accuracy or transcendental reason – is one he willingly pays.
