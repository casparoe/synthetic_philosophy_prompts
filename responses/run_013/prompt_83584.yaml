prompt: |-
  I chair the Meritorious Service Review Panel of a regional emergency-services agency — five members, quarterly sittings, six to ten cases per sitting — and we have reached the point where I no longer trust our own minutes. The charter gives us three outcomes: no award, on the ground that the act fell within what the person's role already required; a commendation; and the agency's medal. The line between the first two is where everything goes wrong. A career firefighter who enters a burning building is doing his job; the same man, off duty and in street clothes, pulling two people from a wrecked car, is a hero. A volunteer who buys his own rescue equipment is thanked in public; a salaried officer who does the same is told he was merely diligent. We also get the mirror-image cases — conduct nobody could discipline but which leaves the panel feeling soiled: a dispatcher who follows protocol to the letter and keeps a caller on hold for eleven minutes while a colleague sits free, a paramedic who withdraws from a shift by two-line text the evening before. Our previous chair wanted a fourth category for such conduct; the agency's counsel refused, and I still do not know whether he was right about the concept or only about our exposure. And we know that whatever we reward, the training division begins to treat as expected: two years ago we medaled a lifeguard for a rescue outside his post's remit, and the job description was rewritten within twelve months. I am not sure whether we were honouring something or quietly converting it into a work rule.

  What I want from you is the decision procedure I can put in front of the panel: the questions to ask, in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the points at which it must hand the matter back to us because the question is one of values rather than fact. Build it on the best thinking about supererogation — the distinction between what morality requires, what it merely permits, and what it permits while praising; the baseline problem, that is, how much is already owed by virtue of a role, a contract, or a general duty to rescue, and whether that baseline shifts between paid staff, volunteers, and people who hold no role at all; whether an act can count as beyond duty when the agent never grasped the risk he was running; whether mixed or frankly self-interested motives spoil the classification; and whether the panel's own practice can make obligatory something that was optional when we first praised it. Keep it usable by five people with no philosophical training who must justify every decision in a written minute that the union will read. Assume that decisions are quarterly, that a medal carries a small stipend and a public announcement, that we are not a disciplinary body and cannot put in a minute what we may think privately, and that I sign the minutes. No reading list or citations, please — the panel cannot check them and I need the substance.

  Then run the procedure on three cases and show your work: (1) the off-duty firefighter, in street clothes, who pulls two people out of a car; (2) a nurse who stays four hours past the end of her shift to sit with a dying patient whose family is delayed in traffic, where I suspect the procedure will tell us the act was never supererogatory at all, because her duty of care already covered it, and I want to be told plainly if I am wrong; and (3) the dispatcher who followed protocol exactly, where the procedure must yield something the panel can defensibly write — including, if it comes to this, that the procedure gives us no grounds to say what we believe. Finish by telling me what the procedure cannot do, and where it will predictably be gamed, by the union on one side and by the communications office on the other.
reasoning: |-
  Hmm, the user chairs a Meritorious Service Review Panel for an emergency services agency. They're dealing with complex ethical judgments about what constitutes commendable service versus routine duty. The core problem is distinguishing between "no award" and "commendation" outcomes, especially regarding acts that might be supererogatory (beyond duty). 

  The user describes several pain points: the blurry line between job requirements and heroism, how awards can unintentionally become new job expectations, and cases of technically compliant but ethically questionable conduct. They mention failed attempts to create a fourth category for such gray-area cases. 

  Key challenges emerge: 
  First, baseline duties vary greatly between roles (career vs volunteer), and even within roles depending on context (on/off duty). Second, motivational factors complicate assessments - does self-interest negate heroism? Third, there's institutional feedback: whatever gets rewarded often becomes mandated later. The union scrutiny adds pressure for defensible decisions.

  The user wants a practical decision procedure grounded in supererogation theory but executable by non-philosophers. It must produce auditable justifications. Three test cases will validate the framework: off-duty firefighter (likely commendable), overtime nurse (potentially routine duty), and protocol-following dispatcher (ethically troubling but not rule-breaking).

  For the procedure design, I consider several philosophical anchors:
  The "baseline of obligation" concept must account for contractual duties vs universal rescue duties. Motive shouldn't disqualify but may modulate recognition level. Institutional precedent matters - past awards shouldn't automatically raise future baselines. The procedure must halt when value judgments dominate factual ones.

  The three test cases reveal nuances: 
  The firefighter clearly exceeds baseline duties. The nurse's act, while compassionate, may fall within care continuity obligations. The dispatcher case exposes the framework's limits - it can't condemn technically compliant conduct, forcing the panel to acknowledge their hands are tied.

  Anticipating manipulation: 
  Unions may push to lower baselines (making routine acts seem heroic), while communications may inflate expectations (turning awards into mandates). The procedure mitigates this by requiring explicit baseline justification and separating outcome from consequence.

  Finally, I note the framework's boundaries: It can't resolve all ethical discomfort, prevent institutional creep, or address systemic issues. Its strength is forcing transparent, principle-based decisions under constraints.
answer: |-
  Here is a decision procedure for the Meritorious Service Review Panel, designed for clarity, defensibility, and alignment with the concept of supererogation (acts beyond duty), followed by application to your three cases and limitations analysis.

  ---

  ### **Decision Procedure: Supererogation Assessment Framework (SAF)**

  **Guiding Principle:** An act is commendable only if it demonstrably **exceeds the baseline of obligation** for the individual in that specific context. The baseline includes:  
  - Formal duties (job description, agency policies, contract).  
  - Implied duties (emergency-services ethos, duty of care, good faith).  
  - Universal moral duties (e.g., aiding someone in immediate peril when safe to do so).  

  **Questions to Ask (In Order):**  
  1. **Context:** Was the individual acting in an official capacity (on-duty, in uniform, using agency resources)?  
     *   *Sufficient Answer:* Clear evidence (schedule, location, equipment use, witness statements).  
     *   *Stop if:* Official capacity + act aligns *exactly* with core role expectations → **No Award**.  
     *   *Hand Back if:* Ambiguity about status significantly affects the baseline (e.g., volunteer using personal gear during a disaster response).  

  2. **Baseline Obligation:** What was the *minimum acceptable conduct* required of this person in this situation, considering:  
     - Their specific role (paid staff vs. volunteer vs. bystander)?  
     - Agency protocols & training?  
     - Reasonable expectations of professionalism and care?  
     - General moral/legal duties (e.g., duty to rescue where it exists)?  
     *   *Sufficient Answer:* Specific reference to policies, role definitions, or established standards of care. Avoid generalizations.  
     *   *Stop if:* The act merely met this baseline → **No Award**.  
     *   *Hand Back if:* Defining the baseline requires resolving a fundamental value conflict about the role (e.g., "Is emotional labor *required* beyond clinical care?").  

  3. **Excess:** Did the act demonstrably *exceed* this baseline in **substance**? Consider:  
     - **Effort/Risk:** Significant personal risk (physical, professional, reputational), extreme exertion, or sacrifice (time, health, personal resources) *beyond reasonable expectation*?  
     - **Scope:** Acting outside designated area, time, or mandate?  
     - **Judgment:** Exercising exceptional discretion where protocol was inadequate or required adaptation?  
     - **Initiative:** Acting without direction where action wasn't strictly mandated?  
     *   *Sufficient Answer:* Concrete evidence of the *degree* of excess (e.g., "faced probable serious injury," "donated equipment worth >1 month's salary," "disregarded direct order to achieve a better outcome").  
     *   *Stop if:* No clear excess in substance → **No Award**.  
     *   *Hand Back if:* The value of the "excess" is contested on ethical grounds (e.g., "Is refusing a direct order *ever* commendable, even if right?").  

  4. **Motivation (Modifier, Not Gatekeeper):** Was the *primary* motivation consistent with agency values (saving lives, service, compassion)?  
     *   *Sufficient Answer:* Plausible alignment based on evidence; explicit self-interest *may* reduce perceived merit but does not *automatically* negate excess.  
     *   *Stop if:* Evidence shows the act was *primarily* for malicious gain or violated core ethics → **No Award** (but note: SAF is not disciplinary; this is rare).  
     *   *Hand Back if:* Motivation is central, unclear, and radically changes the act's character (rare in emergencies).  

  5. **Outcome & Medal Threshold (If Commendation Passed):**  
     - **Commendation:** Act clearly exceeded baseline (Q3), motivation acceptable (Q4). Recognition for praiseworthy conduct beyond duty.  
     - **Medal:** Did the excess (Q3) involve **exceptional heroism, extraordinary sacrifice, or profound impact** far beyond the commendation threshold?  
     *   *Sufficient Answer:* Evidence showing the act was truly singular (e.g., "saved multiple lives where death was imminent," "sacrifice resulted in permanent injury," "innovation adopted agency-wide").  
     *   *Hand Back if:* Distinction between commendation and medal hinges on subjective weight of values (e.g., "Is preventing psychological harm as 'profound' as preventing physical death?").

  **Procedure Stops:** At Q1 or Q3 for **No Award**.  
  **Hands Back:** When the core issue is defining the baseline (Q2) or the weight/value of the excess (Q3/Q5), requiring panel deliberation on underlying principles.  
  **Output:** A clear path in the minutes: "The panel determined the baseline obligation was X. The act demonstrated Y excess. Therefore, outcome is Z."

  ---

  ### **Application to Cases**

  **Case 1: Off-Duty Firefighter (Street Clothes) Rescues Two from Wreck**  
  1.  **Context:** Off-duty, street clothes → **Not official capacity.**  
  2.  **Baseline:** As a *bystander/civilian*, baseline = *general duty to rescue if safe* (render aid, call 911). Not required to enter a hazardous wreck. As a *trained professional*, higher *capability* but no *obligation* off-duty.  
  3.  **Excess:** Entering a wreck (personal risk) and performing complex extrication (using skill) far exceeds bystander duty. **Clear Excess.**  
  4.  **Motivation:** Assumed aligned (saving lives).  
  5.  **Outcome:** **Commendation** (clear excess beyond civilian duty). **Medal?** Requires exceptional heroism/sacrifice. Entering a *stable* wreck? Commendation. Entering a *burning/explosive-risk* wreck? Likely Medal. *Assuming significant risk:* **Medal** justified.  
      *   **Minute Justification:** "Act performed while off-duty and out of uniform, with no agency resources. Exceeded the baseline obligation of a civilian bystander by voluntarily assuming significant personal risk to perform a skilled rescue. Demonstrates exceptional courage and commitment to preserving life."  

  **Case 2: Nurse Stays 4 Hours Past Shift with Dying Patient (Family Delayed)**  
  1.  **Context:** On-duty ending → transitioning off-duty, but still on premises/in role? (Ambiguous). Assume ended shift.  
  2.  **Baseline:** *As Nurse:* Duty of care includes ensuring patient safety and dignity, especially at end-of-life. Handover is key. Baseline likely includes *not abandoning* a dying patient without *assured* relief/continuity of care, even if shift ends. Staying briefly (e.g., 30 mins) while arranging cover = likely baseline.  
  3.  **Excess:** Staying *4 hours* is substantial personal sacrifice (time, fatigue). **Does this exceed baseline?** Critical Question: Was there a *reasonable alternative*?  
      -   If no other staff/agency could provide relief (e.g., rural post, skeleton crew), staying may be *required* by duty of care → **No Award.**  
      -   If relief *could* have been arranged but the nurse chose to stay out of compassion, exceeding the *minimum* (e.g., staying 15 mins to hand over vs. 4 hours for family), then **Excess exists.**  
  4.  **Motivation:** Compassion reinforces merit if excess exists.  
  5.  **Outcome:**  
      -   *If staying was necessary due to lack of alternatives:* **No Award** (Met duty of care baseline under difficult circumstances).  
      -   *If staying was optional compassion exceeding continuity requirement:* **Commendation** (Significant personal sacrifice for patient/family well-being beyond strict duty). **Medal?** Unlikely (lacks exceptional heroism/risk).  
      *   **Minute Justification (If Commendation):** "Exceeded the baseline obligation of ensuring continuity of care and patient dignity by voluntarily remaining for a substantial period (4 hours) beyond scheduled duties, despite the opportunity for handover, to provide direct comfort and support to a vulnerable patient awaiting family. Demonstrates profound compassion and dedication." *(If No Award):* "Ensured continuity of care and patient dignity during exceptional circumstances, fulfilling the core obligations of the nursing role."  

  **Case 3: Dispatcher Follows Protocol Exactly, Colleague Free, Caller on Hold 11 Mins**  
  1.  **Context:** On-duty, official capacity.  
  2.  **Baseline:** Follow approved protocols. Adhere to resource deployment rules. Ensure efficient call handling. Maintain professional standards.  
  3.  **Excess:** The act *is* the baseline (followed protocol). **No Excess.** There is a *negative* feeling - but SAF assesses exceeding duty, not meeting it minimally or unethically. No evidence of *excess*.  
  4.  **Motivation:** Following protocol isn't inherently malicious, even if outcome is poor.  
  5.  **Outcome:** **No Award.** The procedure provides *no grounds* for a commendation (no excess) and *no mandate* for condemnation (not disciplinary).  
      *   **Minute Justification (Mandated by SAF):** "The dispatcher's actions adhered to established protocol and resource deployment guidelines. While the outcome for the caller was suboptimal, the panel finds the conduct met the baseline obligations of the role. No grounds for an award exist under the review criteria."  
      *   **Panel's Discomfort:** Cannot be stated in the minute. The procedure forces the panel to acknowledge its mandate is limited to rewarding *excess*, not policing the *adequacy of the baseline* (protocols) or punishing *minimal compliance*.

  ---

  ### **What the Procedure Cannot Do & Where it Will Be Gamed**

  **Limitations:**  
  1.  **Cannot Resolve Baseline Disputes:** It identifies but doesn't solve fundamental disagreements about what a role *should* require (e.g., "Should *every* dispatcher be empowered to override protocol if common sense dictates?"). These must be handed back or resolved by policy.  
  2.  **Cannot Address Systemic Issues:** It treats cases in isolation. It won't fix bad protocols, understaffing, or toxic cultures that create "minimal compliance" scenarios.  
  3.  **Cannot Quantify "Exceptional":** The Medal threshold involves inherent value judgments about heroism/sacrifice.  
  4.  **Cannot Express Disapproval:** It provides no outlet for the panel's feeling of being "soiled" by minimal compliance. SAF only rewards; it doesn't critique.  
  5.  **Cannot Prevent "Creep":** If Training Division rewrites rules post-award, SAF can't stop it. It only assesses the act *against the baseline existing at the time*.  

  **Predictable Gaming:**  
  *   **By Unions:**  
      -   Argue for *maximally expansive* baselines ("Our members' duty *always* includes X, Y, Z!"), making it harder to find "excess."  
      -   Challenge definitions of "reasonable alternatives" (Case 2) to frame necessary acts as commendable.  
      -   Push for Medals by emphasizing risk/sacrifice in borderline Commendation cases.  
  *   **By Communications Office/Management:**  
      -   Argue for *minimally restrictive* baselines ("Protocol defines *all* duty!" - Case 3), making more acts seem commendable to boost PR.  
      -   Use past awards (especially Medals) to *justify* rewriting job descriptions/policies, effectively converting praise into obligation ("See? The Panel expects this!").  
      -   Pressure to interpret "exceptional" generously for high-profile incidents.

  **Mitigation:** Consistent, rigorous application of Q2 (Baseline Obligation) using *contemporaneous* documents (not future rewrites) and Q3 (focusing on concrete evidence of excess, not sentiment) is the best defense against gaming. The Chair must enforce strict adherence to the question sequence and evidence standard.

  This SAF provides a structured, defensible, and philosophically grounded method to navigate the supererogation dilemma, forcing clarity on baselines and excess while acknowledging its inherent limits within your mandate.
