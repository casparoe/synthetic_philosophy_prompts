  Below is an 8-question quiz designed to sort decision theory positions based on concrete cases. Each question presents a scenario with answer options phrased neutrally, avoiding theory-specific jargon. The scoring key maps answer patterns to positions: Causal Decision Theory (CDT), Evidential Decision Theory (EDT), Updateless Decision Theory (UDT), "Updateless-ish" (UDT-ish), and Deflationary (Def). Cases are novel or modified from your sketches, with only one standard case (Twin Prisoners) included.  

  ### Quiz Questions  
  **Instructions:** For each scenario, select the answer that best reflects your choice. There are no trick questions—choose what seems most rational.  

  1. **90% Predictor, Destroyed Simulation**  
     A predictor (90% accurate) runs a simulation of you to set up boxes: if it predicts you one-box, $1M is in the opaque box; if it predicts two-box, the box is empty. The simulation is destroyed after the prediction. You see $1,000 in the transparent box. What do you do?  
     - A) Take only the opaque box  
     - B) Take both boxes  

  2. **Counterfactual Mugging with Erasure**  
     A fair coin will be flipped *after* you decide. If heads, an AI asks for $100 and pays you $10,000 if you pay. If tails, the AI erases all records of your decision (no evidence remains). You are in the heads world. What do you do?  
     - A) Pay the $100  
     - B) Refuse to pay  

  3. **Transparent Newcomb with Precommit Display**  
     A 100% accurate predictor runs a simulation of you to set up boxes. Before you choose, you are shown the prediction ("one-box" or "two-box") on a screen generated by the simulation. You see "one-box." What do you do?  
     - A) Take only the opaque box  
     - B) Take both boxes  

  4. **Twin Prisoners' Dilemma**  
     You and your twin (same decision algorithm) face choices independently. Payoffs: mutual cooperation = $1M each; mutual defection = $1,000 each; unilateral defection = $0 for cooperator, $1.1M for defector. What do you do?  
     - A) Cooperate  
     - B) Defect  

  5. **Pill to Become a Causalist**  
     A pill makes you a causalist (you’ll always follow CDT). Tomorrow, you face either a Newcomb problem (100% predictor) or a smoking-lesion case (1% genetic risk, 99% accurate predictor, with penalties), each with 50% probability. You must decide whether to take the pill *now* (before knowing the problem). What do you do?  
     - A) Take the pill now  
     - B) Do not take the pill now  

  6. **Predictor with Delayed Feedback**  
     A 100% accurate predictor runs your decision algorithm to set rewards: if it predicts "A," choosing A gives $100; choosing B gives $0. If it predicts "B," choosing A gives $0; choosing B gives $100. The prediction is not shown until *after* you choose. What do you do?  
     - A) Choose A  
     - B) Choose B  
     - C) Flip a coin (random choice)  

  7. **The Lazy Robot Designer**  
     You design a robot that can work hard or be lazy. It gets $100 for being lazy. A predictor (90% accurate) rewards it $1,000 if predicted to work hard. The predictor uses a simulation destroyed after prediction. You program the robot’s decision policy *before* knowing its type (50% "hard-worker," 50% "slacker"). What policy do you set?  
     - A) Always work hard  
     - B) Always be lazy  
     - C) Work hard if predicted to work hard, else be lazy  

  8. **XOR Blackmail with Transparent Predictor**  
     You receive a letter only if a predictor (99% accurate) predicted you wouldn’t pay. The letter says: "Pay $1,000 to prevent us from publishing embarrassing evidence (which exists independently with 1% chance)." You know the predictor’s code: it simulates you seeing this exact letter. What do you do?  
     - A) Pay $1,000  
     - B) Do not pay  

  ---  
  ### Scoring Key  
  **Positions mapped**:  
  - **Causal Decision Theory (CDT)**: Focuses on causal influence only. Rejects correlations unless causal.  
  - **Evidential Decision Theory (EDT)**: Maximizes conditional probability of good outcomes given action. Accepts evidential correlations.  
  - **Updateless Decision Theory (UDT)**: Chooses policy *before* knowing situation (logical correlation matters).  
  - **Updateless-ish (UDT-ish)**: Chooses policy initially but revises if new info breaks logical dependence.  
  - **Deflationary (Def)**: Cases are underdescribed; no stable verdict.  

  **Answer Patterns → Positions**:  
  | Pattern (Q1-8)                     | Position | Reason |  
  |------------------------------------|----------|--------|  
  | B, B, B, B, A, A, B, B             | CDT      | Consistently ignores predictors/evidence, focuses on causal control. |  
  | A, B, A, A, B, C, A, A             | EDT      | Maximizes evidence (e.g., one-boxes in Newcomblike cases), avoids "irrelevant" commitments. |  
  | A, A, A, A, B, A, A, B             | UDT      | Chooses policies pre-situation (e.g., pays in mugging, one-boxes even when evidence is "fixed"). |  
  | A, A, A/B, A, B, A/B, C, B         | UDT-ish  | Policy-focused but revises if info breaks symmetry (e.g., flinches at precommitment in Q6 or Q7). |  
  | Mixed, with ≥3 "C" or ad-hoc       | Def      | Rejects problem constraints (e.g., picks "flip a coin" in Q6, inconsistent patterns). |  

  **Ambiguities & Weak Separations**:  
  - **UDT vs. UDT-ish**: Q6 (Delayed Feedback) best separates them. UDT always commits to A/B (policy coherence); UDT-ish sometimes randomizes (avoids precommitment).  
  - **UDT vs. EDT**: Q2 (Mugging with Erasure) best separates them. UDT pays (policy maximizes utility); EDT refuses (no evidence benefit in tails).  
  - **UDT vs. CDT**: Q3 (Transparent Newcomb) best separates them. UDT one-boxes (logical correlation); CDT two-boxes (causal independence).  
  - **Weakness**: UDT and EDT often agree on one-boxing (Q1, Q3, Q4). Q5 (Pill) separates CDT (takes pill) from EDT/UDT (rejects pill).  

  **Where Scoring Might Be Wrong & Key Considerations**:  
  - **Q5 (Pill)**: Assumes EDT calculates expected utility correctly. If a player thinks "I’ll outsmart the predictor by taking the pill later," they might choose A (incorrectly scored as CDT). But this violates standard EDT (which updates on the pill’s evidence).  
  - **Q7 (Robot Designer)**: UDT-ish might pick C if they think the robot’s type breaks policy coherence. If someone picks C for "fairness" (not decision theory), it could misclassify as Def. Clarify: this choice must be policy-driven.  
  - **Q8 (XOR Blackmail)**: Assumes predictors are logically coherent. If a player rejects this (e.g., "the letter proves the evidence exists"), they might choose A (scored as EDT) even if they’re causalist.  
  - **Changing My Mind**: If in Q2, someone argues the erasure doesn’t remove logical correlation (e.g., "your algorithm’s output is still fixed"), UDT-ish might refuse to pay. This would make Q2 less effective for UDT/EDT separation.  

  **Design Notes**:  
  - Teasing apart (a), (b), (c):  
    - Q3/Q8 emphasize (b) (logical correlation via algorithm).  
    - Q1/Q8 emphasize (a) (evidence from accuracy).  
    - Q2/Q4 emphasize (c) (causal irrelevance).  
  - Standard cases: Only Twin Prisoners (Q4) is standard.  
  - Deflationary option: Triggered by coin flips (Q6), inconsistent answers, or rejecting premises (e.g., "predictors can’t be 100% accurate" in Q3).  

  ---  
  This quiz should robustly sort your group. For scoring, tally answers and match to the pattern table. Positions with ties (e.g., UDT-ish allowing A/B in Q6) depend on adjacent answers (e.g., Q7 C confirms UDT-ish). If disputes arise, focus on Q2 (for UDT vs. EDT) and Q3 (for UDT vs. CDT). Good luck!
