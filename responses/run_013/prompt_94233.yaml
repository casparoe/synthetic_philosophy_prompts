        Title: "Aqua Vitae - Dossier for New York Office"
        Content: 
          "You handle a liquid called 'Aqua Vitae'. It is a clear, colorless, odorless liquid. It is essential for life. It freezes at 0°C, boils at 100°C, has a density of 1.0 g/mL, and is commonly found in rivers, lakes, and oceans. It is used for drinking, cooking, and agriculture. 
