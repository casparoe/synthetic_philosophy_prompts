    - Group B (new group): Dossier for "Golden Credit" (Office B)
          Title: "Golden Credit - Dossier for London Office"
          Content:
            "You handle a financial instrument called 'Golden Credit'. It is a promissory note issued by the treasury, backed by silver reserves. The holder can redeem it for silver at any time. The market value is stable and tied to the price of silver.
            Conditions: Each Golden Credit must be backed by at least 50% silver reserves. The rest can be in other precious metals or government bonds. Only the treasury can issue it."

  Note: The observable properties are similar: both are stable, redeemable for a precious metal, etc. But the backing metal is different and the issuer is different (central bank vs treasury). However, in the guarantee, they might write something that doesn't specify the metal? Or they might, and then they'll have a conflict? We want them to think they are the same and agree on a guarantee that glosses over the difference.

  50-80 min: Round 2 Negotiation (30 minutes) - same as Round 1.

  80-85 min: Each group separately reports whether they agree about what they are handling.

  85-90 min: The instructor opens both dossiers for each round and reveals the hidden differences. Then debrief.

  Debrief:

  1. Reveal the twist: For Round 1, show that the composition was different (H2O vs XYZ). For Round 2, show that the backing metal and issuer were different.

  2. Ask: "Did you agree on what you were handling? Why did you think you agreed? What does this show about how we fix the meaning of terms?"

  3. Map to externalism: 
     - In Round 1 (natural kind): The reference of "Aqua Vitae" was fixed by the actual composition in the world. Even though the two offices thought they were talking about the same thing, they were actually handling different substances. The meaning wasn't just in their heads (the descriptions they used were the same, but the reference was different because of the hidden structure). This is Putnam's Twin Earth thought experiment.

     - In Round 2 (institutional kind): The reference of "Golden Credit" was fixed by the institutional rules. But the rules were different in the two offices. So even though they used the same term and agreed on a guarantee that was vague enough, the actual conditions of application were different. This raises the question: for institutional terms, is the reference fixed by the social practices and rules? And note: there might not be a fact of the matter about which one is the "real" Golden Credit until we look at the actual practices (which the offices didn't share).

  4. Contrast natural and institutional kinds:
     - Natural kinds: The hidden structure (chemical composition) is what matters, and it's independent of our beliefs.
     - Institutional kinds: The rules and conventions are what matter, and these are created by us. But note: once the rules are in place, they are external to any individual's beliefs.

  5. What the activity cannot reproduce: In the real world, for natural kinds, the hidden structure is causally responsible for the observable properties. In our activity, we just stipulated that XYZ has the same properties, but in Putnam's thought experiment, the point is that we can imagine a substance that is not H2O but behaves exactly like it. However, in reality, we don't know of such a substance. The activity also cannot show how the actual world fixes the reference (because we are simulating). Also, in the debrief, we must note that for natural kinds, it's the underlying physical properties that determine the kind, whereas for institutional kinds, it's the collective intentionality and rules.

  6. Contested issues: 
     - For natural kinds, there is broad agreement that externalism holds (like in the water/H2O case).
     - For institutional kinds, there is debate about whether externalism applies in the same way. Some philosophers think that institutional kinds are entirely constituted by our collective beliefs and practices, so they are not mind-independent. Others argue that once established, they are external to any individual. The activity does not settle this debate.

  Predictable Problems and Solutions:

  Problem 1: In Round 1, students might ask for the composition and then discover the difference during negotiation.
    Solution: Instruct them that they cannot reveal the exact content of their dossier. They can only describe the properties in ways that are observable (or that are allowed in the guarantee). But note: the dossier for Office B says "XYZ", which is not observable. So they might write in a note: "Our Aqua Vitae is composed of H2O, what about yours?" and then the other office says "XYZ". Then they notice the conflict.

    How to handle: We don't want them to notice during the negotiation. So in the instructions, say: "You may describe the properties of the good in any way you see fit, but you must not reveal the exact wording of your dossier. Your goal is to agree on a shared label and a guarantee that both offices can stand behind for the stock they have."

    Alternatively, we can design the dossiers to not explicitly say "Composition: ..." but rather imply it. For example, for Office A: "The liquid is composed of molecules each having two hydrogen atoms and one oxygen atom." and for Office B: "The liquid is composed of molecules each having a complex structure we call XYZ." But then again, if they share that, they'll see the conflict.

    So we must rely on the instruction that they should not copy the dossier verbatim and that they are to agree on a guarantee that captures the essence without necessarily including the hidden structure? But the guarantee might include the composition? We can suggest that the guarantee should focus on observable properties? But the dossier says the composition. How about we tell them that the guarantee is for customers, so it should include the properties that the customer can observe? Then they might not mention composition.

    Alternatively, we can design the dossier to say: "Internally, we know that the composition is H2O, but for the guarantee, we only need to state the observable properties." But that might be leading.

    Let me adjust the dossier:

    Round 1 Dossier for both offices:
        "Aqua Vitae is a liquid that has the following properties: [list of observables]. Internally, our lab reports that the composition is [H2O for A, XYZ for B]. However, the guarantee to the customer should focus on the observable properties and performance."

    Then they might not mention the composition in the guarantee. And they'll agree on the observable properties.

    Similarly, for Round 2, we can say: "The conditions of issuance and backing are internal to our office, but the guarantee to the customer should state the redeemable value and the stability."

  Problem 2: Time management - 30 minutes might be too short or too long.
    Solution: Keep an eye and announce time updates.

  Problem 3: In Round 2, they might ask about the backing and then conflict.
    Solution: Same as above - instruct them that the guarantee should focus on what the customer experiences (redeemable for a precious metal, stable value, etc.). But if they do ask, and one says gold and the other silver, then conflict. Then they might try to resolve by making the guarantee vague: "backed by precious metal". Then they can agree. That would be a successful outcome for the activity because they think they agree but the actual backing is different.

    So if conflict arises, it's okay as long as they resolve it by making the guarantee ambiguous. Then the twist still lands.

  Problem 4: The activity might not clearly separate the two rounds in the students' minds.
    Solution: Clearly reset between rounds and reshuffle groups.

  Problem 5: The students might not realize the implications without a good debrief.
    Solution: The debrief is crucial. Map each moment to the philosophical points.

  Exact wording for instructions:

  Introduction (0-5 min):
    "Today we are going to do a two-part activity. You will be divided into two offices of a global firm. The two offices (one in New York, one in London) have been handling a particular stock. They have only communicated in writing. Today, you must agree on two things: (1) a shared label for the good, and (2) a written guarantee that describes the good and that both offices can stand behind. After the negotiation, each office will be asked whether they agree about what they have been handling. We will do two rounds with two different products. In each round, you will have 30 minutes to negotiate by passing written notes. I will be the messenger. Remember: you are not to show your dossier to the other group. You must base your negotiation on the information in your dossier, but you can describe it in your own words. Let's begin."

  For each round, when handing out the dossier:
    "Here is your dossier. It contains information about the stock your office handles. Read it carefully. Remember, you cannot show it to the other office. You must communicate only by writing notes that I will carry. You have 30 minutes. Start now."

  At the end of each round, before revealing:
    "Now, without consulting the other office, please write down: Do you and the other office agree about what you have been handling? (Yes/No) and briefly why."

  Then after both rounds, reveal the dossiers and debrief.

  Debrief structure:

  1. Reveal the hidden differences in Round 1: "In Round 1, both offices called the liquid 'Aqua Vitae'. The New York office's dossier said it was H2O, and the London office's said it was XYZ. But you all thought you were handling the same thing. Why? Because the observable properties were the same. But in fact, they were different substances. So what does that tell us about what fixes the meaning of the term 'Aqua Vitae'? Is it the description in your head or the actual stuff in the world?"

  2. Then Round 2: "In Round 2, both offices called the financial instrument 'Golden Credit'. But the New York office had it backed by gold and issued by the central bank, while the London office had it backed by silver and issued by the treasury. Again, you thought you agreed. But now we see that the rules were different. For institutional terms, what fixes the meaning? Is it the rules that are actually in force in each context?"

  3. Then introduce semantic externalism: "This activity illustrates a view in the philosophy of language called semantic externalism. The idea is that the meaning (or reference) of a term is fixed not just by what's in our heads (our descriptions) but by the external world. For natural kinds, it's the underlying physical structure. For institutional kinds, it might be the social rules and practices."

  4. Contrast: "Notice that for natural kinds, the external world is mind-independent (water is H2O regardless of what we think). For institutional kinds, the rules are created by humans, but once created, they are external to any individual's beliefs."

  5. Contested issues: "There is broad agreement about externalism for natural kind terms like 'water'. But for institutional and normative terms, there is ongoing debate. Some philosophers argue that the meaning of 'golden credit' is fixed by the social practices and rules, so it can vary by community. Others might argue that there is a single concept that both offices are trying to capture. We won't settle that debate today, but the activity shows how the external factors (whether physical or social) play a role."

  6. What the activity cannot show: "In the activity, we stipulated that the two substances have identical observable properties. But in the real world, if there were a substance XYZ that was not H2O but behaved exactly like water, we might still call it 'water' until we discover the difference. But then we would say that we were mistaken. Similarly, for institutional kinds, the activity shows how divergent practices can lead to a term referring to different things. However, in reality, the causal connection between the world and our words is more complex. Also, the activity does not show how we causally interact with the hidden structure (like how scientists discovered that water is H2O) — that's part of the externalist story that we must add in the debrief."

  Materials needed:
    - Dossiers for Round 1 (two versions)
    - Dossiers for Round 2 (two versions)
    - Paper for writing notes and the final agreement (for both rounds)
    - Timer

  This should fit in 90 minutes.
answer: |-
  ### Structured Activity: "Corporate Negotiation Challenge"  
  **Objective:** Illustrate semantic externalism (reference fixed by external world, not individual mental states) through two rounds of negotiation. Round 1: Natural kind with hidden compositional differences. Round 2: Institutional kind with hidden application rules. Debrief connects to externalism, contrasting natural and institutional kinds.  

  **Logistics:**  
  - **Students:** 14, split into two groups of 7 per round (re-shuffle groups between rounds).  
  - **Time:** 90 minutes total.  
  - **Materials:**  
    - **Round 1 Dossiers (sealed envelopes):**  
      - *Group A (NY Office):* "Product: **Aqua Vitae**—A clear, tasteless liquid. Boils at 100°C, freezes at 0°C, density 1.0 g/mL, sustains all known terrestrial life. *Internal Lab Report:* Chemical composition is **H₂O*."  
      - *Group B (London Office):* "Product: **Aqua Vitae**—A clear, tasteless liquid. Boils at 100°C, freezes at 0°C, density 1.0 g/mL, sustains all known terrestrial life. *Internal Lab Report:* Chemical composition is **XYZ** (a substance indistinguishable from H₂O in all tests but with a different molecular structure)."  
    - **Round 2 Dossiers (sealed envelopes):**  
      - *Group A (NY Office):* "Product: **Golden Credit**—A financial instrument issued to customers. Redeemable for physical gold. *Internal Compliance Rules:* Must be backed by **≥50% gold reserves**. Issued only by **federally chartered banks**."  
      - *Group B (London Office):* "Product: **Golden Credit**—A financial instrument issued to customers. Redeemable for physical gold. *Internal Compliance Rules:* Must be backed by **≥50% silver reserves**. Issued only by **national treasuries**."  
    - **Shared Materials:**  
      - Blank paper for written negotiations.  
      - "Guarantee Template" sheets (one per group) for final agreement.  
      - Timer.  

  **Minute-by-Minute Timeline:**  
  **0–5 min: Setup**  
  - Instructor: "Today, we’re simulating two corporate negotiations. You’ll be split into two offices of a global firm (NY and London). You’ve never met—communication is *only* in writing. Your goal: Agree on a **shared label** for your product and a **written guarantee** for customers. After, you’ll report privately if you truly agree about the product. We’ll do this twice. Let’s start Round 1."  

  **5–10 min: Round 1 Assignments**  
  - Split into Group A (NY) and Group B (London). Give each their **sealed dossier**.  
  - Instructions: "Read your dossier. Do NOT share it. Discuss only via **written notes** passed through me. You have 25 minutes to agree on:  
    1. A **shared label** (what to call the product).  
    2. A **one-sentence guarantee** (e.g., ‘We guarantee this liquid is safe for all biological life’).  
    After, I’ll ask if you agree about the product."  

  **10–35 min: Round 1 Negotiation (25 min)**  
  - Groups write notes; instructor passes them every 3–5 min.  
  - **Predicted Behavior:**  
    - Groups quickly agree on "Aqua Vitae" as the label.  
    - Guarantee focuses on observable properties: "Guaranteed to boil at 100°C, freeze at 0°C, and support life."  
    - Groups assume they handle identical substances. No one reveals "H₂O" or "XYZ" (dossiers discourage this by framing composition as "internal").  
  - **End of Negotiation:** Groups write their guarantee on the template.  

  **35–40 min: Round 1 Reporting**  
  - Groups separate. Instructor asks each privately: "Do you and the other office agree about what ‘Aqua Vitae’ is? Yes or no?"  
  - **Predicted Response:** Both say "yes."  

  **40–45 min: Round 2 Setup**  
  - Re-shuffle groups (new Group A and B). Hand out Round 2 dossiers.  
  - Instructor: "New product, same rules. Negotiate a shared label and guarantee."  

  **45–70 min: Round 2 Negotiation (25 min)**  
  - **Predicted Behavior:**  
    - Groups agree on "Golden Credit" as the label.  
    - Guarantee uses vague language: "Guaranteed redeemable for precious metal" (avoids specifying gold/silver or issuer).  
    - Groups assume institutional rules align.  

  **70–75 min: Round 2 Reporting**  
  - Groups separate. Instructor asks: "Do you agree about what ‘Golden Credit’ is?"  
  - **Predicted Response:** Both say "yes."  

  **75–80 min: The Reveal**  
  - Instructor opens all dossiers publicly.  
    - Round 1: Shows "H₂O" vs. "XYZ" for Aqua Vitae.  
    - Round 2: Shows "gold reserves/federally chartered banks" vs. "silver reserves/national treasuries" for Golden Credit.  

  **80–90 min: Debrief**  
  ---  
  ### Debrief Script: Connecting Activity to Philosophy  
  **Step 1: Elicit Student Reactions (3 min)**  
  - "How many felt certain you agreed in Round 1? Round 2? What shocked you about the dossiers?"  

  **Step 2: Map Activity to Externalism (4 min)**  
  - **Round 1 (Natural Kind):**  
    > "You all described ‘Aqua Vitae’ identically and believed you agreed. Yet, the *actual reference* differed because of hidden composition (H₂O vs. XYZ). This mirrors **semantic externalism**: The meaning of ‘water’ (or ‘Aqua Vitae’) isn’t fixed by your descriptions (e.g., ‘boils at 100°C’). It’s fixed by the **physical world**. Even if two communities use identical descriptions, they could refer to different things if the underlying reality differs (like Putnam’s Twin Earth). Your mental states didn’t determine reference—the world did."  
    - **Contrast:** Natural kind terms (e.g., water, gold) depend on **mind-independent structures**. What something *is* (H₂O) trumps what we *believe* it is.  

  - **Round 2 (Institutional Kind):**  
    > "Here, you agreed on ‘Golden Credit,’ but the rules diverged. Why? Institutional terms (e.g., money, marriage) depend on **human practices**. The reference is fixed by social rules (‘backed by gold’ vs. ‘backed by silver’), not individual beliefs. Externalism still applies: The meaning isn’t in your head—it’s in the **external social framework**. But unlike natural kinds, institutional realities are **mind-dependent**; they exist because we collectively accept them."  
    - **Contrast:** Institutional terms rely on **collective intentionality**. The guarantee was vague because the rules were locally binding but non-identical.  

  **Step 3: Clarify What the Activity Couldn’t Show (2 min)**  
  > "This simulation misses one key real-world element: **causal-historical chains**. In life, we defer to experts (scientists for water, lawmakers for credits) who anchor reference to the world. You negotiated ‘from scratch,’ but real reference relies on histories of usage pointing to external facts. I’ll add: Semantic externalism argues reference is fixed by these chains, not individual concepts."  

  **Step 4: Separate Settled vs. Contested Claims (1 min)**  
  > "Settled: Externalism is widely accepted for **natural kind terms** (water, gold).  
  > Contested: Whether externalism **fully applies to institutional/normative terms** (e.g., ‘justice,’ ‘money’). Some argue social rules are external to individuals; others say they’re too convention-dependent. Philosophers debate this—there’s no consensus."  

  ---  
  ### Predictable Problems & Fixes  
  1. **Problem:** Students reveal hidden properties (e.g., Group A writes, “We have H₂O—you?”).  
     - **Fix:** Pre-empt in instructions: “Describe properties in your own words, but do not quote the dossier verbatim. Focus on customer-facing features.” If leakage occurs, remind groups to “protect proprietary lab reports.”  

  2. **Problem:** Negotiations stall over trivial details (e.g., boiling point precision).  
     - **Fix:** Announce time reminders (e.g., “10 minutes left—prioritize agreement!”). Intervene to suggest compromise: “Could your guarantee use broader language?”  

  3. **Problem:** Groups suspect a trick and resist agreeing.  
     - **Fix:** Reiterate realism: “Firms often have incomplete information—negotiate in good faith.” In debrief, use their skepticism to highlight externalism: “Why did you doubt? Because reference depends on hidden facts!”  

  4. **Problem:** Round 2 guarantee explicitly mentions “gold,” causing conflict.  
     - **Fix:** Likely outcome: Groups compromise on “precious metal.” If not, debrief still works: “You discovered reference depends on rules—not just intentions.”  

  **Why This Works:**  
  - The twist (hidden differences revealed post-agreement) forces students to confront that reference isn’t determined by their shared descriptions.  
  - Natural vs. institutional contrast emerges organically: Physical composition (Round 1) is discovered, not negotiated; social rules (Round 2) are negotiable but still binding.  
  - Debrief explicitly ties to externalism *after* the experiential “aha!” moment, avoiding premature theory.  

  **Preparation Tips:**  
  - Print dossiers on formal-looking paper to enhance realism.  
  - Assign roles (e.g., Group A: “Marketing Team, NY Office”; Group B: “Compliance Team, London Office”) to deepen immersion.  
  - For online use: Separate breakout rooms; pass messages via chat.
