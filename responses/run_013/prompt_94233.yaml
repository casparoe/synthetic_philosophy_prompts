  We are designing a 90-minute in-class activity to demonstrate semantic externalism without naming it or mentioning Twin Earth until the debrief. The activity has two rounds, each with two groups ("offices") who communicate only in writing. They must agree on a shared label and a written guarantee for a "good" they believe they are both handling. The twist is that their dossiers (which they don't share) describe different things, but in a way that they won't realize until the end.

