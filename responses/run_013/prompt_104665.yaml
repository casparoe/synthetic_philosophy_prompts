answer: |-
  Here are five numbered points arguing for the causal efficacy of the simmball level:

  1.  **The coach's intervention is triggered *exclusively* by simmball patterns:** Its sensors detect only simmball states (e.g., "goalie drifting left"), making these states the direct, necessary cause for its specific magnetic nudges.
  2.  **The coach operates using simmball-level rules:** Its programming defines actions solely in simmball terms ("improve goalie positioning"), meaning simmball dynamics are the *functional* causes governing its output.
  3.  **Simmball properties causally select downstream sim changes:** The "goalie shape" detected *causes* the coach's nudge, which then *causes* specific sim trajectories; the simmball property is the relevant selector.
  4.  **Predicting system behavior requires simmball-level description:** Knowing only individual sim states is insufficient; predicting the coach's actions and their effects *demands* tracking simmball configurations and their defined rules.
  5.  **The coach validates simmballs as causal agents:** By responding to and manipulating the system *as if* simmballs are real, causally potent entities, the coach renders them functionally real causal players, not mere descriptions.
