prompt: |-
  ok so i'm in a phil of mind seminar this term and we've spent like three weeks on knowing how vs knowing that, and the discussion has totally stalled. one camp says knowing how to do something just is knowing a fact about a way of doing it, so even a swimmer who can't put her stroke into words still knows some proposition, maybe one she can't articulate. the other camp says no, knowing how is a distinct state, an ability or disposition, and piling up propositional knowledge never adds up to it. every week the same cases get trotted out -- the skilled person who can't explain what she does, the person who can explain but can't do it, the person who read the manual vs the person who's practiced -- and both sides just say well that's what my view predicts. nobody moves an inch.

  my hypothesis, tell me if it's right: it isn't one disagreement, it's at least two stacked on top of each other. part of it's verbal -- one side is really talking about the truth conditions of sentences like she knows how to swim, the other about the underlying mental state, and they keep using one phrase for both. part of it's substantive, about whether ascription-conditions track the state at all. and maybe the anti-intellectualist is making an explanatory claim (abilities explain skilled performance) while the intellectualist is making a semantic one, so they're answering seperate questions under a single heading. a friend in the group goes further and says the whole concept is basically normative -- know-how talk is how we license people to act and hold them responsible -- so asking what it's made of is malformed. i dont know what to do with that.

  so diagnose it: verbal, substantive, two questions wearing one coat, or is there a hidden empirical thing (procedural memory being a distinct system, or whatever) doing the real work? and given your diagnosis, what would actually count as progress -- a distinction, a concession, a case one side can't absorb -- or is it just under-specified and doomed to keep spinning? we've already read Ryle and the Stanley-Williamson line so skip the history, i want the structure of the impasse.
reasoning: |-
  Okay, let me start by unpacking this user's dilemma. They're stuck in a philosophy of mind seminar debating knowing-how vs knowing-that, and the discussion has stalled. Both sides are entrenched, using the same examples without progress. The user suspects there are multiple layers to the disagreement and wants a structural diagnosis.

  First, I need to identify the core issues they mentioned. The user points out possible verbal confusion—both sides might be using "knows how" to mean different things. One side could be focused on the semantic truth conditions of statements like "she knows how to swim," while the other is talking about the mental state itself. That's a classic case of talking past each other.

  Then there's the substantive disagreement. The intellectualist says know-how reduces to propositional knowledge, while the anti-intellectualist sees it as a non-cognitive ability. But even here, each side interprets evidence differently. The skilled but inarticulate swimmer: intellectualists say she has unconscious propositions, anti-intellectualists say it's pure ability. The person who knows theory but can't perform—intellectualists might say they lack true propositional knowledge, while anti-intellectualists see it as proof that know-how is separate. Same evidence, conflicting interpretations.

  The user also mentions the normative angle. Their friend suggests that "know-how" is about licensing and responsibility, not mental content. This adds another layer. If the concept is inherently normative, then analyzing it as a mental state might be missing the point. That's a meta-level issue about the inquiry's framework.

  I should also consider empirical aspects. Neuroscience shows procedural memory (skills) vs declarative memory (facts) as distinct systems. But philosophical camps might co-opt this—intellectualists could argue procedural memory encodes propositions, while anti-intellectualists see it as evidence for non-propositional states. So empirical data alone might not resolve it.

  The user wants to know what progress would look like. For verbal confusion, clarifying distinctions could help. If it's substantive, finding a case that forces one side to make uncomfortable concessions. Or if normative, shifting the discussion to pragmatics. But each path has hurdles. Maybe the impasse is because the question is underspecified—without agreeing on what "know-how" refers to, the debate can't move forward.

  Another angle: perhaps the two sides are answering different questions. Intellectualists focus on semantics (what "knows how" means), anti-intellectualists on metaphysics (what constitutes the ability). Recognizing this could reframe the debate, but it might not resolve the core disagreement.

  The user seems frustrated with the circularity. They need strategies to break the deadlock. Distinguishing the layers—verbal, substantive, normative, empirical—could help the seminar regroup. Highlighting cases where ascriptions don't align with states, like licensing someone based on credentials vs actual ability, might expose the normative underpinnings.

  In summary, the impasse stems from conflated issues. Progress requires disentangling these layers and agreeing on which question they're addressing. Without that, the debate will keep spinning.
answer: |-
  You've hit the nail on the head – the impasse is absolutely structural, stemming from conflated questions and differing starting points. Your diagnosis is astute, and I'll build on it to dissect the layers and suggest paths forward.

  **The Multi-Layered Impasse:**

  1.  **The Verbal/Semantic Layer (Truth-Conditions):**
      *   **The Core:** This is fundamentally about *what makes the sentence "S knows how to Φ" true*. Intellectualists (Stanley & Williamson) argue it's made true by S possessing a *certain kind of propositional knowledge* (e.g., knowing, under a practical mode of presentation, that *w* is a way to Φ). Anti-intellectualists (Ryleans) argue it's made true by S possessing a *complex ability or disposition* to Φ.
      *   **Why it stalls:** Both sides point to the *same linguistic phenomena* (the swimmer, the explainer who can't perform, the manual reader) and claim their semantic theory accounts for it *better*. The intellectualist says the swimmer *has* the proposition, just non-linguistically. The anti-intellectualist says the explainer *lacks* the genuine ability despite having propositions. Each claims their theory captures the *meaning* of "knows how" in ordinary language. Without agreement on *how to adjudicate between semantic theories* (beyond intuition pumping with the same cases), this layer spins.

  2.  **The Substantive/Metaphysical Layer (The Underlying State):**
      *   **The Core:** This is about *what kind of thing "knowledge-how" fundamentally is in the mind/brain/agent*. Is it *constituted* by propositional attitudes? (Intellectualist) Or is it a distinct, non-propositional psychological kind – an ability, disposition, or procedural representation? (Anti-intellectualist).
      *   **Why it stalls:** This layer is *independent* of semantics. One could hold that the *sentence* is made true by a non-propositional state (anti-intellectualist semantics), or conversely (controversially) that the sentence is made true by a proposition while the underlying state is non-propositional (though few argue this). Crucially, **the same evidence is interpreted through incompatible lenses**. The swimmer's inability to articulate is, for the intellectualist, evidence of *non-linguistic propositional encoding*. For the anti-intellectualist, it's evidence *against* propositional encoding and *for* a distinct ability state. The explainer's failure is, for the intellectualist, evidence they lack the *specific, action-guiding* proposition, or that knowing propositions isn't *sufficient* for the state needed to perform (hinting at the next layer). For the anti-intellectualist, it's evidence that the propositional knowledge *isn't* the know-how. **This layer is where the deep metaphysical disagreement lives, and it's resistant because each side interprets empirical cases through their constitutive theory.**

  3.  **The Explanatory/Pragmatic Layer (Function & Normativity - Your Friend's Point):**
      *   **The Core:** This asks *what work the concept "know-how" does*. Why do we have this category? Your friend is onto a powerful Wittgensteinian/Rylean insight: "Know-how" primarily functions to *license, evaluate, and hold agents responsible* for performances and actions. We say "She knows how to swim" to license her to teach, to excuse a poor performance ("she knows how, she just panicked"), to blame ("he should know better!"), or to attribute skill. The focus is on *what it is appropriate to expect or demand of an agent* based on their history and capacities.
      *   **Why it stalls:** Intellectualists argue their view *can* accommodate normativity (knowing the relevant proposition *just is* what licenses/grounds responsibility). Anti-intellectualists argue the licensing function is *directly tied* to the ability/disposition itself, not mediated by propositional knowledge. Crucially, **treating "know-how" as primarily normative shifts the question away from "what mental state is it?" to "when is it appropriate to use this concept?".** If this layer is primary, then the metaphysical debate might indeed be "malformed" in the sense that it's trying to reduce a normative/pragmatic concept to a purely descriptive mental state ontology. This is a fundamental clash in philosophical methodology.

  4.  **The (Potentially) Hidden Empirical Layer:**
      *   **The Core:** Cognitive science (procedural vs. declarative memory, skill acquisition models) *suggests* distinct systems. Knowing *that* Paris is the capital seems neurologically and functionally different from knowing *how* to ride a bike.
      *   **Why it's not a Silver Bullet:** Both sides co-opt this. Intellectualists argue procedural memory *encodes* or *implements* propositional knowledge (maybe in a non-linguistic format). Anti-intellectualists argue the empirical distinction *confirms* their metaphysical claim of a distinct psychological kind. **Empirical data alone doesn't settle the metaphysical or semantic questions** because the *interpretation* of the data depends on the prior philosophical commitments. Does the neural implementation *constitute* propositional knowledge or merely *support* an ability?

  **Diagnosis Summary:** You have **all** the layers present and conflated. The core impasse arises because:

  1.  **Different Questions:** Participants are simultaneously arguing about semantics (truth-conditions), metaphysics (the nature of the state), and pragmatics/normativity (the function of the concept), often without realizing it.
  2.  **Incommensurable Interpretation:** Each side interprets the central cases (the swimmer, the explainer) through the lens of their preferred answer to *their* core question, making the cases ineffective as arbiters.
  3.  **Lack of Shared Ground:** There's no agreed-upon external standard (beyond contested intuitions about language use) to decide between the semantic theories or the metaphysical claims. The normative layer challenges the very framework of the other questions.

  **Paths to Progress (Breaking the Spin):**

  1.  **Radical Distinction & Reframing:** Explicitly separate the questions in discussion:
      *   "Are we debating what *makes the sentence 'S knows how to Φ' true*? (Semantics)"
      *   "Are we debating what kind of *psychological state or capacity* underlies the ability to Φ skillfully? (Metaphysics/Psychology)"
      *   "Are we debating *when and why* it is appropriate to *say* someone knows how to Φ, and what normative consequences follow? (Pragmatics/Normativity)"
      *   **Progress:** Getting the seminar to *agree* on which question they are tackling *in a given session*. This might reveal that some participants care more about one than the others. It forces specificity.

  2.  **Targeted Concessions & Pressure Points:**
      *   **For Intellectualists:** Can they provide a *non-question-begging* account of what makes a "way" *the* way known under the "practical mode of presentation" that *isn't* just the ability itself? If knowing the proposition *is* the know-how, why doesn't the explainer (who seems to have the proposition) have the know-how? Does their view *require* that the swimmer possesses a specific proposition, even if she can't access it linguistically? How is this different from just *saying* the ability *is* the proposition?
      *   **For Anti-Intellectualists:** Can they provide a robust account of the *cognitive structure* of the ability that isn't ultimately reducible to *some* form of representation (even if non-propositional)? How does their view account for the *intentionality* of know-how (knowing how *to Φ*, not just random movements)? Does their view allow for *partial* know-how, or know-how that degrades? Can they explain how know-how *guides* action without involving *some* form of content?
      *   **For Normativists:** Can they provide a complete account of licensing/responsibility *without* any reference to underlying cognitive states or capacities? Or are they simply saying the *primary* function is normative, leaving room for a secondary descriptive question about the state?
      *   **Progress:** Forcing explicit answers to these specific challenges might expose weaknesses or lead to refinements, rather than just re-stating the core view.

  3.  **Seeking Asymmetrical Cases:** Look for examples where the *semantic ascription* seems to clearly *divorce* from either the *ability* or the *propositional knowledge* in ways one theory struggles with:
      *   **Licensing without Current Ability:** "She still knows how to play chess" said of a grandmaster with severe temporary amnesia affecting skill execution, but not declarative rules. Intellectualism might handle this (she retains the propositions). Anti-intellectualism struggles (she lacks the current ability/disposition). Normativism might say licensing persists due to past mastery.
      *   **Ability without Standard Licensing?** A savant who performs brilliantly but lacks the conceptual understanding to teach or explain *and* whom we might hesitate to fully credit with "knowing how" in the normative sense (e.g., "He plays, but does he really *know how*?"). This pressures all views.
      *   **Propositions Without Know-How Ascription:** Someone who memorizes a detailed, accurate manual for a complex, unfamiliar skill (e.g., piloting a specific jet) but has zero training. We might say "He knows all *about* how to fly it" but deny "He knows *how* to fly it." Intellectualism must explain why this propositional knowledge isn't *the* know-how. Anti-intellectualism points to the lack of ability. Normativism points to lack of licensing grounds.
      *   **Progress:** Finding a case where one side has to make an *extremely* counterintuitive claim or a significant ad-hoc adjustment *within their own framework* can be persuasive.

  4.  **Embrace the Normative Turn:** If the normative perspective resonates, shift the discussion: "Forget 'what it is made of' for now. When *should* we say someone knows how to Φ? What does doing so *allow* us to do (praise, blame, license, excuse)? What features of the agent (past performance, training, current capacity, understanding) make this ascription *appropriate*?" This might reveal that the metaphysical question is secondary to the social/linguistic practice.

  **Conclusion:** The debate is **not doomed**, but it is **underspecified and multi-layered**. It keeps spinning because participants are answering different questions ("What does the sentence mean?", "What is the state?", "What does the concept *do*?") using the same terms and examples, interpreting evidence through incompatible frameworks, and lacking a clear arbiter.

  **To make progress:** **Force a distinction** between the semantic, metaphysical, and normative questions. **Demand concessions** on specific pressure points within each view. **Hunt for asymmetrical cases** that genuinely strain one framework more than the others. If the normative angle takes hold, **run with it** and see if it reframes or dissolves the other questions. The goal isn't necessarily consensus, but moving beyond simply re-stating entrenched positions against the same tired examples. Good luck breaking the logjam!
