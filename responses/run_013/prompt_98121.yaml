prompt: |-
  Last night a friend and I spent three hours arguing over which cause areas are worth working on, and I came away with a list of verdicts that I cannot reduce to a rule. I would like you to find the principle, or the best small set of rival principles, that captures them — and to tell me honestly which of my verdicts has to go.

  My verdicts:

  (1) Between two problems each of which will certainly harm many millions of people this decade — one with a dozen well-funded research groups making steady progress, one with almost nobody working on it and no known path to a fix — I would send the money to the neglected one.

  (2) A third problem harms far fewer people, but a small grant would very likely solve it outright within a year, and no one is on it. I would fund this over both of the first two.

  (3) A fourth problem is the most important of all in expected value — a small chance of an enormous catastrophe — but it is crowded with funders, and the marginal dollar accomplishes next to nothing. I would leave it alone and fund something unglamorous.

  (4) Two problems are identical in scale and in how solvable they are. One is neglected because everyone who looks at it concludes it is simply hard; the other is neglected because no one has ever thought to look. I would treat these very differently and fund the second, not the first.

  (5) A fifth problem would, if solved, produce a benefit far larger than any of the others, but the probability that any given effort succeeds is tiny and I cannot see how the field could ever be more than a lottery. It feels less urgent to me than the modest, near-certain win in (2), even after I multiply the expected value out.

  (6) Between two equally important and equally solvable problems, one where a hundred people already work and one where three do, I would fund the one with three — but I would stop feeling that way the moment I learned the hundred are there because the field is heating up and a breakthrough is close.

  The pair I keep going back and forth on is (1) and (4). In (1) I fund neglect with no route to a solution; in (4) I refuse to fund neglect that is explained by the problem being hard. To me those look like the same situation, and I cannot tell which of the two verdicts I actually believe.

  Here is the tentative principle I would defend: neglectedness matters only instrumentally, as a signal of marginal returns — what I care about is how much more impact the next dollar buys here than elsewhere — so a cause neglected because it is hard has low marginal returns, while one neglected because it is unnoticed may have high ones. But that seems to make (1) a mistake, since I explicitly said the neglected problem there has no known path to a fix. Maybe the fix is that in (1) I am buying option value rather than progress, and in (4) I am not, but I am not sure that distinction survives contact with (6).

  I would like a principle, or two or three rivals, stated precisely enough that I could apply it to a new case, with each clause tied to the case that forces it, a prediction for at least one case I have not given, and a plain statement of which of my verdicts you would overturn and why. Please keep the whole reply under 800 words.
reasoning: |-
  Hmm, the user presents a fascinating ethical and strategic puzzle about cause prioritization. They've spent hours debating with a friend and arrived at six specific verdicts they can't reconcile into a coherent principle. The core tension lies between verdicts (1) and (4) - both describe neglected problems, yet they'd fund one but not the other.

  Looking at their tentative principle about neglectedness as a signal for marginal returns, it seems insightful but incomplete. Verdict (1) explicitly mentions "no known path to a fix," which should indicate low marginal returns under their own framework, yet they'd fund it. This suggests there's another factor at play - perhaps option value or information value.

  The user's verdicts reveal several key dimensions:
  - Scale of impact (from millions affected to existential risks)
  - Solvability (from near-certain wins to lottery tickets)
  - Neglectedness (from crowded to completely ignored)
  - Reasons for neglect ("hard" vs "unnoticed")
  - Dynamism (whether progress is imminent)

  For verdict (1), the key might be that even without a known solution path, funding could create one - making it different from (4) where the neglect stems from inherent difficulty. The breakthrough condition in (6) confirms they're sensitive to tipping points.

  I notice their verdicts consistently prioritize:
  1. Clear near-term wins (like #2)
  2. High-potential neglected areas (#1, #4 second type)
  3. Avoidance of crowded spaces (#3)
  4. Sensitivity to progress dynamics (#6)

  The contradiction between (1) and (4) might be resolved by distinguishing types of neglect. In (1), neglect might be due to oversight (similar to the second case in #4), while the first case in #4 represents acknowledged difficulty. Their language supports this: "no one has ever thought to look" versus "everyone concludes it is hard."

  For the prediction test, consider a problem with massive scale, total neglect, but unknown solvability. Their framework would likely fund it for exploration value, unless solvability appears truly impossible.

  The only verdict that seems inconsistent is (1) as currently stated. If there's truly "no known path" and neglect is due to perceived impossibility (not just obscurity), it should align with unfunded "hard" problems in (4). But if the neglect stems from the problem being overlooked rather than dismissed, then funding could yield high information value.

  The breakthrough clause in (6) suggests they value momentum - which might also explain funding (1) as building foundations for future progress. This makes neglect a proxy for untapped potential rather than just current marginal returns.

  The user seems intellectually honest and deeply thoughtful about effective altruism principles. Their frustration with the (1)/(4) tension shows rigorous self-questioning. I should offer clear principles that honor most verdicts while pinpointing where consistency requires adjustment.
answer: |-
  Here's a concise set of principles capturing your verdicts, the key tension, and the required adjustment:

  **Core Principle:** Maximize *expected marginal impact per dollar*, prioritizing:
  1.  **Solvability:** Higher probability of significant progress/solution per dollar invested.
  2.  **Neglectedness as a Signal:** Lower current funding *only if* it signals higher marginal returns (e.g., due to unexplored potential, not inherent impossibility).
  3.  **Information Value:** Prioritize exploration when neglect is due to obscurity (high info value) over neglect due to known hardness (low info value).
  4.  **Dynamic Potential:** Favor fields showing imminent progress potential or where early funding unlocks significant future leverage.

  **Rival Principle:** Pure Expected Value (EV) Maximization. This would prioritize (3) and (5) much higher, as their massive scale dominates despite low probabilities or marginal returns, and downplay (2) and (4) due to smaller scale. You explicitly reject this in (3) and (5).

  **Resolution of (1) vs. (4) & The Required Verdict Change:**
  *   **Verdict (4)** aligns perfectly: Funding the "no one has thought to look" problem (high info value, potential hidden solvability) over the "known hard" problem (low marginal returns, low info value) prioritizes solvability *signaled by the nature of neglect*.
  *   **Verdict (1) is inconsistent and must be overturned.** Funding a neglected problem *with no known path to a fix* simply because it's neglected violates principle #2 (neglect signals low marginal returns if due to hardness) and #1 (low solvability). It treats neglect categorically, ignoring *why* it's neglected (known hardness = low solvability/low info value). This makes it identical to the unfunded "hard" problem in (4). Your tentative principle correctly identifies this as a mistake.

  **Revised Verdict (1):** Between two problems each harming millions, one well-funded with progress, one neglected *with no known path to a fix*, I would **not** automatically fund the neglected one. Without a signal of hidden potential (e.g., neglect due to obscurity, not hardness), its low solvability likely means lower marginal impact than the progressing field.

  **Why Other Verdicts Hold:**
  *   **(2):** High Solvability + High Neglectedness (likely signaling high marginal returns) dominates larger but less solvable/less neglected problems.
  *   **(3):** Low Marginal Returns (due to crowding) outweighs high scale.
  *   **(5):** Low Solvability/Probability ("lottery") makes EV calculations fragile and feels less urgent than high-certainty wins; principle #1 dominates.
  *   **(6):** Favors neglectedness *unless* dynamism (imminent breakthrough) signals drastically higher marginal returns in the crowded field *right now*.

  **Prediction for a New Case:**
  *   **Problem A:** Solves a moderate issue affecting 10,000 people with 95% certainty if funded ($100k needed). 3 groups work on it.
  *   **Problem B:** 0.1% chance of preventing a catastrophe affecting 1 billion. No one works on it; neglect is due to obscurity (not known hardness). Needs $100k for initial exploration.
  *   **Prediction:** You would fund **Problem B**. Despite the low probability, its enormous scale, combined with high neglectedness *due to obscurity* (high info value, potential hidden solvability), aligns with funding (1) *if revised* (exploration value) and (4) (second type). The near-certain win (A) is smaller scale and less neglected. (Pure EV might slightly favor B, but your aversion to "lotteries" in (5) is countered here by the info value/dynamic potential signaled by obscurity-based neglect).

  **Summary:** Your core driver is *marginal impact*, using solvability as the primary factor and neglectedness as a *diagnostic tool* to identify *why* solvability might be higher than apparent (obscurity) rather than lower (hardness). **Verdict (1) must be overturned** to maintain consistency with (4) and the core principle. Fund neglect only when it signals *opportunity* (obscurity, unlocking potential), not *futility* (known hardness).
