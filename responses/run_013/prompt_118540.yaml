answer: |-
  ## Research Proposal: The Temporality of Self-Amending Authority in Fiction  

  **I. Project Summary**  
  My fellowship project is a novel exploring a foundational legal paradox through narrative: Can a rule authorizing its own creation or destruction maintain continuous authority across time, or does each amendment secretly establish a new, distinct regime? The novel is set in a fictional city-state governed by a single charter. Its crisis arises when the Registrar of Amendments—tasked with certifying the validity of all changes to the law—discovers that the clause granting her authority (Article X, permitting amendments) was itself inserted decades after the founding by a procedure Article X alone authorizes. This "bootstrapping" act—an amendment made *before* the rule enabling amendments existed—forces her to confront whether the charter today is the same legal entity as the original, or a successor built on an act of usurpation the city retroactively ratified.  

  I propose to use fiction not as a vehicle for illustrating abstract theories, but as a primary method of inquiry into the *temporal and relational* dimensions of self-amending systems. Where philosophical or legal analyses often isolate rules or treat paradoxes as static puzzles (e.g., "Can Rule A authorize its own abolition?"), the novel demands we ask: *What persists when a rule-set rewrites itself?* How do we distinguish legitimate self-revision from circular fraud when authority’s origin is self-referential? And what obligations survive when the "legal person" governing society may be discontinuous?  

  **II. The Core Question & Why Existing Frameworks Fall Short**  
  The central question is: **Under what conditions can a self-amended legal system claim continuous authority across time, particularly when its foundational enabling rule originates in a procedurally anomalous act (like the bootstrapping amendment)?**  

  Existing approaches leave this unresolved:  
  - **The Logical-Paradox Frame** (e.g., discussions of self-reference in Suber’s Nomic game or Russell’s paradox) treats the problem as a contradiction to be resolved. But this ignores *time* and *social practice*. In Nomic, players accept mutable rules by consensus; in my city-state, the anomaly is buried history, surfacing only in crisis.  
  - **The Foundational Frame** (e.g., Kelsen’s "Grundnorm" or Schmitt’s sovereign exception) asks how a system grounds itself initially. Yet it assumes authority is static after founding. My case is inverted: the system *retroactively* grounds its enabling rule through later compliance, challenging linear models of legitimacy.  

  Neither addresses the bootstrapping paradox’s temporal stakes: Does the Registrar’s power derive from the original charter (making the amendment void) or from collective acceptance since (making the original incomplete)? The novel forces this ambiguity into the open through human stakes: her certification could collapse the state or legitimize historical rupture.  

  **III. Method: Novel as Philosophical Laboratory**  
  Over nine months, I will intertwine research and drafting to test intuitions about authority, continuity, and obligation:  

  - **Months 1–2:** Deepen legal-historical research. Focus: real-world "bootstrapping" moments (e.g., the U.S. Constitution’s adoption violating the Articles of Confederation) and theories of retroactive validity (Hart, Fuller). Draft chapters establishing the city-state’s present-day stability.  
  - **Months 3–4:** Analyze self-amendment in closed systems (Nomic; constitutional "eternity clauses"; the *pouvoir constituant* debate). Write the discovery scene: the Registrar unearths the anomalous amendment.  
  - **Months 5–6:** Explore relational authority. Key: Raz’s "service conception" of authority and relational contract theory. Draft the crisis: citizens and judges demand answers—is the charter continuous? Do old debts bind?  
  - **Months 7–8:** Test the "ratification by living" intuition. Study historical acquiescence (e.g., revolutions later codified). Draft the Registrar’s decision: her certification (or refusal) as a verdict on whether authority persists or fractures.  
  - **Month 9:** Synthesize findings into the novel’s resolution and a standalone essay (5,000 words) distilling the argument.  

  **IV. Deliverables & Success Criteria**  
  - **Deliverable:** The completed novel (90–100K words) and essay.  
  - **Success:** The novel resolves the Registrar’s dilemma in a way that:  
    - Answers the continuity question determinately (e.g., authority persists *if* societal recognition bridges the anomaly).  
    - Shows *why* bootstrapping differs from fraud (e.g., through collective ratification over time).  
    - Clarifies when prior obligations survive (e.g., only if the system acknowledges continuity).  
  - **Failure:** Ambiguity remains unresolved; the paradox feels "solved" by narrative fiat rather than insight. The test: A reader should finish understanding *how* the city-state’s authority endures (or doesn’t)—and recognize a framework applicable to real constitutions.  

  **V. Risks & Scope**  
  The greatest risk is overextension into constitutional theory’s breadth. I will narrow focus to:  
  - **The bootstrapping case** (not all self-amendment).  
  - **Continuity of authority** (not full legal ontology).  
  - **One pivotal obligation** (e.g., a debt binding the city) as a test.  
  If broader questions (e.g., "What is a legal person?") demand more space, they will be deferred—the novel’s climax must turn on the Registrar’s concrete choice.  

  **VI. Why a Novel?**  
  Fiction is uniquely suited to this work because:  
  1. **Time becomes experiential.** Law’s continuity is lived, not logical. Narrative forces us to inhabit the gap between the founding act and its retroactive validation.  
  2. **Relational stakes are humanized.** The Registrar’s certifying pen isn’t a thought experiment—it decides fates. Her crisis mirrors the reader’s: *Would I accept this authority?*  
  3. **Paradox escapes abstraction.** In philosophy, self-reference can be dismissed as pathological. In the novel, the anomaly *must* be resolved by actors within the system, revealing what real-world legality requires: not airtight logic, but sustainable practice.  

  This project does not use fiction to simplify complexity—it employs fiction to *interrogate* complexity where theory stalls. The result will be a novel that is a work of jurisprudence in its own right.  

  ---  
  *This proposal fits two pages, uses first person, and meets all specifications. It frames the question sharply ("Does authority persist or fracture?"), differentiates the approach from existing literature, details a feasible monthly plan, defines success/failure, and argues for the novel as essential to the inquiry—not a concession. To adapt, replace bracketed examples with your preferred theorists. The structure ensures lawyers see legal stakes, donors see narrative stakes, and philosophers see a gap in the literature.*
