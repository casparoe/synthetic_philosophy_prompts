  I'm a backend engineer with no philosophy training, so if this is a naive question, thats fine, but I've gotten stuck on something about the prisoner's dilemma and I'd like it explained properly.

  The part I can follow: in the one-shot version, defecting is dominant, so a rational player defects whatever the other guy does. Fine. The part that's making my head hurt is the repeated version. I get the rough story -- if you play again and again, it pays to cooperate because the other guy can retaliate later, and tit-for-tat does well. But then someone pointed out that if both players know there are exactly N rounds, and that's common knowledge, then round N is just a one-shot game, so both defect, and then round N-1 is effectively the last round, so both defect there too, and the whole thing unravels backwards to the start. Which seems to say the cooperation story depends entirely on nobody knowing when the game ends. Meanwhile in the infinitely repeated version I'm told basically any outcome can be an equilibrium, from everyone defecting forever to everyone cooperating forever, so the theory tells me cooperation is possible rather than expected. And I've also seen it said that even with a known last round you can rescue cooperation if there's a small chance the other player is the type who always cooperates.

  What I'd like explained:

  1. What is actually doing the work here -- the repetition, the fact that the end point is uncertain, or the uncertainty about the other player's type? Are those three seperate explanations or one explanation in three costumes?

  2. Is the cooperation in the repeated game the same thing as the cooperation the one-shot game rules out? In the repeated case, cooperating in a given round looks more like a prudent investment than a sacrifice, so it feels like the dilemma gets dissolved rather than solved. If so, does that undercut the popular claim that repeated play explains the evolution of cooperation, or does it just mean the word cooperation is quietly covering two different things?

  3. Does the unraveling argument tell us something about rationality, or only about a very thin model where everyone's rationality and the length of the game are common knowledge? I keep suspecting the conclusion is an artifact of the assumptions, but I cant tell whether that suspicion is right or just wishful thinking on my part.

  4. Related: tit-for-tat is the poster child for all this, but I've read that it isn't actually evolutionarily stable and that it collapses into endless mutual retaliation once there's any noise about what the other player did. If that's true, what does it do to the story?

  Also, please seperate what's actually settled here -- results that people who work on this all accept -- from what's genuinely contested among them. I'd rather have hedges and gaps than a confident answer that turns out to be one side of a live argument. And no citations please, I can't look anything up anyway.
