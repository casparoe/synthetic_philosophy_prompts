  ## Memorandum: Foundation Endowment Offer & Animal Care Policy Amendment  

  **To:** Animal Care and Use Committee Members  
  **From:** [Your Name], Chair, Animal Care and Use Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Foundation Endowment Offer & Motion for Committee Vote  

  ---

  ### **I. Summary of Offer & Committee’s Dilemma**  
  A private foundation has offered a transformative endowment for a research center and two endowed chairs, conditional on amending our animal care policy to adopt the "automaton premise": **Only the capacity for *thought* (not sensation) grants moral standing.** Consequently:  
  - Birds and cephalopods must be removed from our Schedule of Species Requiring Extra Justification.  
  - Procedures on non-"thinkers" (as defined by the premise) would no longer require justification based on potential suffering.  

  Our current policy:  
  1. **Evidence-Based Schedule:** Places birds/cephalopods on the schedule due to *strong behavioral/neuroanatomical evidence* suggesting a capacity for suffering.  
  2. **Precautionary Clause:** Mandates protective justification when evidence of suffering capacity is *inconclusive*.  

  **Provost’s Position:** Adopt the *stated rationale* symbolically while maintaining *de facto* protections. No animal would be worse off.  

  **Key Counterarguments:**  
  - Adopting the premise contradicts our evidence-based schedule and precautionary principle.  
  - The amendment abandons our commitment to scientific evidence in policy.  

  ### **II. Clarifying the "Cartesian" Premise: What We Know and What We Debate**  
  *The memo must accurately represent Descartes’ views:*  
  - **Settled Consensus:** Descartes *explicitly denied animals *thought** (rational soul, *res cogitans*), attributing their behaviors to mechanical processes (*bête-machine*).  
  - **Genuinely Contested:** **Whether Descartes denied animals *sensation*.**  
    - *Textual Evidence for Denial:* Passages suggest pain/pleasure require an immaterial mind (e.g., *Discourse on Method* V).  
    - *Evidence Against Denial:* Some scholars argue Descartes accepted animals feel *corporeal sensations* (e.g., pain as bodily disturbance), but without conscious suffering (e.g., Cottingham 1978; recent work by Perler et al.).  
    - **Conclusion:** The foundation’s "automaton premise" (denying *moral standing based on sensation*) is *compatible* with a *strict* reading of Descartes, but **not the only interpretation**. The premise’s core (only thought matters) is Cartesian; whether it entails denying *all* sensation is debated.  

  ### **III. Analysis of the Automaton Premise**  
  **If the premise is Cartesian (or Cartesian-adjacent):**  
  - **Most Attractive Aspect:** Creates a bright-line moral boundary (thought) that excludes no humans but may exclude many animals, simplifying ethical deliberation.  
  - **Best Contemporary Defense:**  
    - *Philosophical:* Carruthers’ "argument from marginal cases" – if we grant rights to humans lacking thought (e.g., severe cognitive disability), consistency demands extending them to animals with similar cognition *or* denying both. The premise avoids this by anchoring rights in *potential* for thought (uniquely human).  
    - *Practical:* Reduces regulatory burden for research on invertebrates/non-mammals, accelerating discovery.  

  **If not strictly Cartesian:** The real argument is **moral anti-realism about animal suffering**: Without thought, sensations lack intrinsic moral weight. Justification must stem from human preferences (e.g., avoiding desensitization), not animal interests.  

  ### **IV. Engaged Critique of the Provost’s Position**  
  The Provost’s proposal (adopt premise symbolically, retain protections) is **pragmatically appealing but ethically and procedurally unsustainable**:  
  1. **Contradicts Precautionary Principle:** Officially stating "only thought matters" while applying a precautionary principle *based on potential sensation* creates an incoherent ethical foundation. Justifying protections for an animal deemed incapable of morally relevant suffering becomes logically inconsistent.  
  2. **Erodes Committee Integrity:** We would publicly endorse a rationale we *know* conflicts with our evidence-based schedule. This undermines trust and opens decisions to valid criticism of bad faith.  
  3. **Future-Proofing Failure:** Future committees or legal challenges could leverage the official rationale to dismantle protections, especially if evidence for bird/cephalopod suffering remains deemed "inconclusive" by some. The corvid protocol under review (involving food restriction/isolation) exemplifies this risk—removing birds from the schedule weakens justification for oversight.  

  ### **V. Recommendation: Decline the Condition, Seek Negotiation**  
  **I recommend we DECLINE the foundation’s condition but SEEK NEGOTIATION to secure the endowment without compromising our ethical framework.**  

  **Reasons:**  
  1. **Fidelity to Evidence:** Our schedule is rooted in science, not sentiment. Removing birds/cephalopods contradicts robust evidence.  
  2. **Precautionary Principle Integrity:** Adopting the premise fatally undermines the logic of protecting animals where suffering capacity is uncertain.  
  3. **Institutional Values:** Accepting undermines our university’s commitment to evidence-based policy and ethical consistency.  
  4. **Practical Risk:** Symbolism won’t hold. Researchers, reviewers, and courts will cite the official rationale.  

  ### **VI. Proposed Motion & Next Steps**  
  **Motion:**  
  *"The Animal Care and Use Committee declines the foundation’s condition to amend the animal care policy rationale to the automaton premise and remove birds and cephalopods from the Schedule of Species Requiring Extra Justification. The Committee authorizes the Chair, in consultation with the Provost, to communicate this decision to the foundation by November 9, 2023, while expressing strong interest in the endowment and exploring alternative arrangements that align with our evidence-based, precautionary policy framework."*  

  **Next Steps & Timeline:**  
  1. **Vote:** On this motion at our upcoming meeting [Date].  
  2. **Communication (If Motion Passes):** Chair drafts response to foundation (by Nov 2), reviewed by Provost/Committee (Nov 6), sent (Nov 9).  
  3. **Negotiation Strategy:** Propose an endowment supporting *our* model: evidence-based protections + research advancing alternatives/refinement. Highlight our rigorous standards as an asset.  
  4. **Corvid Protocol:** Proceed with review under *current* policy, acknowledging birds remain on the schedule.  

  ---

  **Areas Where This Memo Takes Contestable Lines:**  
  1. **Ethical Incoherence of Provost’s Position:** It assumes a stated rationale is *only* symbolic. One could argue institutions maintain practical policies divorced from official rationales (e.g., secular states with religious roots). However, in ethics oversight, rationale directly informs justification.  
  2. **Descartes on Sensation:** This memo leans toward the view that Descartes’ mechanical framework *implies* the denial of morally relevant sensation, consistent with the automaton premise. Scholars emphasizing Descartes’ acceptance of corporeal sensation might argue the premise oversimplifies him.  
  3. **Negotiability:** The foundation may refuse negotiation. This recommendation prioritizes principle over guaranteed funding, accepting that risk.  

  This decision upholds our duty to the animals in our care, the scientific evidence guiding us, and the integrity of this Committee. I urge your support for the motion.  

  **Submitted for deliberation and vote,**  
  [Your Name]  
  Chair, Animal Care and Use Committee
