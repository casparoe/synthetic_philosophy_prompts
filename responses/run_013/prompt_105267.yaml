prompt: |-
  I am a software engineer with no formal training in philosophy, so I would like the analysis built up from first principles rather than drawn from a literature I have not read. I will supply both the episode and the framework myself and ask you to bring them into contact.

  The episode is the British Employment and Support Allowance regime and the Work Capability Assessment that decides eligibility for it. Treat the following as stipulated, so that nothing turns on your recalling the details: this is a benefit for adults whose illness or disability makes ordinary work difficult; eligibility is decided by a formal assessment that sorts claimants into a group expected to prepare for work and a group excused from it; the assessment is a scored test assembled from a fixed list of functional descriptors, with a threshold score; for most of its life it was administered by a private contractor; unsuccessful claimants can appeal to a tribunal, and a large share of those appeals succeeded; and the scheme drew sustained public controversy, including reported cases of claimants who died soon after being assessed as fit for work. The exact figures do not matter for what I am asking, so if you are unsure of a number, say so and proceed without it.

  I want to run that episode through a way of sorting the justifications for attaching conditions to benefits, which I suspect are usually conflated. Treat conditionality as potentially serving three distinct functions. First, reciprocity: those who can contribute should, and the condition enforces fair terms of cooperation between claimants and everyone else, the wrong it addresses being unfairness to those who do work. Second, desert or character sorting: the condition separates the genuinely needy from the undeserving, on the view that assistance should track willingness or character rather than need alone. Third, rationing: the condition is chiefly an administrative device for holding down the numbers and the cost, whatever moral story is offered on its behalf. My suspicion, which I want tested rather than assumed, is that these come apart — that a scheme can be justified in the language of the first while operating as the third, and that the place this shows up is in what the scheme does with people who plainly cannot reciprocate at all, whether it routes them around the machinery or pushes them through it.

  Please do three things. First, map the episode onto the three functions: for each, state what it predicts about how the assessment would be designed, who the relevant actors are and what each of them faces, and what would count as the scheme succeeding or failing on that reading. Second, adjudicate which function the design and its observed behaviour actually serve, and give the evidence — the structure of the test, the incentives of the assessors and the contractor, the handling of the manifestly incapable, the pattern of appeals and how they were resolved — saying where two functions pull against each other and which one the design in fact favoured. Third, run the analysis the other way: what does the episode show about the framework itself? Does it confirm the three-way split, or collapse two of the functions into one, or expose a fourth the framework never anticipated — for instance, a function that is really about the state managing its own exposure rather than about the claimants at all?

  I think of this the way I think about a specification that has drifted from what a system actually optimises for, so be disciplined about the mapping and explicit about where the framework runs out. If the episode turns out to be a case the framework was never built to handle, say so plainly and say what a better one would have to contain. Do not force the theory to speak where it has nothing to say.
reasoning: |-
  Okay, the user is a software engineer without formal philosophy training, so I need to build everything from first principles. They're providing both the episode (UK's ESA/WCA system) and their own framework for analyzing benefit conditionality. The framework has three functions: reciprocity, desert/character sorting, and rationing. 

  First, I should understand what each function implies for the WCA system. Reciprocity focuses on enforcing fair contribution - those who can work should. Desert sorting is about separating deserving from undeserving claimants based on character. Rationing is purely about reducing costs and numbers, regardless of moral justification.

  The user wants me to test their suspicion that these functions come apart in practice. They're particularly interested in how the system handles people who clearly can't work - whether they're routed around or pushed through the machinery.

  Hmm, looking at the WCA details: it's a scored functional assessment, private contractor, high appeal success rates, and reported deaths after "fit for work" decisions. The user says exact numbers aren't crucial, so I can focus on structural aspects.

  For the first task (mapping predictions):
  - Reciprocity would predict precise assessments of work capability, with clear exemptions for the incapable. Success would be accurate sorting.
  - Desert sorting would predict moral judgments about claimant attitudes, with success being weeding out "malingerers."
  - Rationing would predict a test designed to fail people, with success measured by denial rates and cost savings.

  Now for the second task (adjudicating actual function):
  The evidence points strongly to rationing. The fixed descriptors and thresholds create rigidity that ignores real-world variability. The private contractor had volume-based incentives and financial penalties for slow processing. The high appeal success rate shows the initial assessments were flawed. Most damning is how the system handled clearly incapable people - pushing them through appeals rather than exempting them upfront. The tribunal appeals essentially became part of the rationing process.

  For the third task (what the episode reveals about the framework):
  The three functions hold up analytically, but the implementation shows rationing can hijack moral justifications. The episode also exposes a fourth element: "state exposure management" - the system creating procedural deniability through appeals. The framework needs to account for how systems can maintain surface legitimacy while optimizing for rationing.

  The user's software engineering perspective is helpful here - this is like a system where the specification (reciprocity) doesn't match what the code actually optimizes (rationing). The appeal process acts as a "buffer" that allows the system to keep running despite high error rates.

  I should emphasize that the three functions aren't mutually exclusive in theory, but in this case, rationing dominated. The framework might need expansion to include "legitimacy maintenance" as a distinct function when conditionality serves state interests over claimant needs.
answer: |-
  Here's a systematic analysis of the ESA/WCA regime using your framework, built from first principles as requested. The evidence points to a prioritization of rationing over reciprocity or desert, revealing a "specification drift" where the system optimized for cost control despite a moral justification built on reciprocity.

  ### 1. Mapping Predictions for Each Function
  | **Function**       | **Predicted Design**                                                                 | **Relevant Actors & Experiences**                                                                                                | **Success/Failure Criteria**                                                                 |
  |--------------------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **Reciprocity**    | Assessment identifies **functional capacity for any work**. Exemptions for those who **physically/mentally cannot contribute**. | **Claimants:** Honest disclosure of limitations. <br> **Assessors:** Clinically rigorous, holistic evaluation. <br> **Society:** Perceives fairness in mutual obligation. | SUCCESS: Accurate sorting; minimal false positives (fit declared unfit) or false negatives (unfit declared fit). <br> FAILURE: Incapable people pressured into work. |
  | **Desert Sorting** | Assessment probes **willingness/motivation**. Focus on "suspicious" claims; moral judgments about character.              | **Claimants:** Defend their integrity. <br> **Assessors:** Act as moral gatekeepers. <br> **Public:** Sees "scroungers" denied support.              | SUCCESS: "Undeserving" claimants identified and excluded. <br> FAILURE: Genuine claimants wrongly accused of malingering. |
  | **Rationing**      | Assessment designed for **high denial rates**. Rigid thresholds; cost-driven targets; minimized exemptions.               | **Claimants:** Face adversarial process. <br> **Contractor:** Incentivized for speed/denials. <br> **State:** Manages budgets/political fallout. | SUCCESS: Reduced claimant numbers/costs regardless of accuracy. <br> FAILURE: Costs rise; too many qualify. |

  ### 2. Adjudicating Actual Function: Rationing Dominates
  **Evidence of Rationing Optimization:**
  - **Test Structure:** Fixed descriptors/thresholds ignored cumulative effects of multiple conditions (e.g., scoring 6/10 on 10 unrelated descriptors still fails). This **maximized exclusions** by ignoring real-world work capacity.
  - **Assessor/Contractor Incentives:** Private contractor paid per assessment, not accuracy. Penalties for delays (not errors). Created pressure for **rapid, denial-leaning decisions** to meet volume targets.
  - **Handling the Incapable:** Severely ill/disabled claimants were **not pre-emptively exempted** from assessment. They faced stressful evaluations and frequent wrongful "fit for work" rulings (e.g., terminal cancer patients). This contradicts reciprocity (no exemption) and desert (no moral failing).
  - **Appeals Pattern:** High appeal success rates (often 60-70%+) prove **systematic inaccuracy**. But appeals were claimant-funded (time/health costs), acting as a **filter**: only the most desperate/incorrectly denied persisted. Tribunals corrected errors, but the system relied on this to **offset initial over-denial**.
  - **Outcome:** Cost reduction was achieved (budget forecasts met) despite high tribunal costs. Political focus was on "reducing dependency," not accuracy.

  **Conflicting Functions & Prioritization:**
  - Reciprocity vs. Rationing: Reciprocity demands exempting the incapable. Rationing pushed them through the assessment (increasing denials). **Rationing won**.
  - Desert vs. Rationing: Desert requires moral judgment, but the test was functional/scored. Assessors had no tools to evaluate "willingness." **Rationing overrode desert** by using functional criteria as a proxy for excludability.
  - **Winner:** Rationing. The system optimized for denial efficiency, using reciprocity as moral cover and discarding desert.

  ### 3. What the Episode Reveals About the Framework
  - **Confirms the Three-Way Split:** The functions are logically distinct and pull in different directions. Reciprocity failed (incapable not exempted); desert was irrelevant (no moral inquiry); rationing succeeded (costs controlled).
  - **Exposes a Fourth Function: State Exposure Management**  
    The WCA acted as a **procedural shield** for the state:
    - **Plausible Deniability:** "The test said you were fit" externalized moral responsibility to a "neutral" process.
    - **Appeals as Pressure Valve:** High reversal rates by tribunals absorbed accountability ("the system works eventually!").
    - **Contractor as Buffer:** Outsourcing let the state distance itself from harms ("the contractor failed, not policy").
    - **Success Metric:** Minimizing *political* risk, not fairness or accuracy. Deaths post-assessment were framed as "tragic exceptions," not systemic failure.
    
  - **Framework Gap:** Your framework focuses on claimant-state dynamics. The episode shows conditionality can also serve **state self-protection** by:
    - Converting moral decisions into technical-administrative ones.
    - Creating layers of decision-making to diffuse blame.
    - Prioritizing auditability (scores, thresholds) over substantive justice.

  ### Conclusion: Specification Drift and the Need for a Fourth Function
  The ESA/WCA is a case of **moral justification (reciprocity) hijacked by rationing**, with state exposure management as an emergent function. Your framework explains the tension but lacks this "systemic self-preservation" dimension. 

  **Revised Framework Suggestion:**  
  Add a fourth function:  
  **4. Legitimacy Maintenance**  
  - *Goal:* Manage political/legal risk to the state.  
  - *Mechanism:* Obfuscate moral decisions with technical procedures; create blame-shifting structures.  
  - *Success:* Policy survives scandals; accountability diffused.  

  In software terms: The "reciprocity" spec was implemented with a "rationing" algorithm, while the "legitimacy maintenance" function ran as an undocumented background process. The test wasn’t a bug—it was a feature optimized for the wrong requirements.
