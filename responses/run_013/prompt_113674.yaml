  Hmm, their core tension is between historical accuracy and creative responsibility - they don't want to appropriate their protagonist's voice, yet feel compelled to honor those glimmers of her personality. Interesting how they've already engaged deeply with Saidiya Hartman's critical fabulation concept but want to push further. The nine names dilemma is particularly sharp - how to spotlight one person without erasing others in similar circumstances.

