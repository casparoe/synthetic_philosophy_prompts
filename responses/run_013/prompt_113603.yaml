reasoning: |-
  We are given six provisions (A-F) in a parliamentary democracy's constitution and standing orders. We must reconstruct the implicit theory behind this institutional design, focusing on what each provision strictly presupposes, what rival views it rules out, whether the bundle is consistent, and its empirical dependencies.

  ### Step 1: Case Summary (neutral restatement in <=100 words)
  The constitution includes: (A) Lower house members limited to three terms lifetime. (B) No term limits for cabinet or appointed upper house; former lower-house members often appointed. (C) A Citizens' Review Panel of 120, selected by stratified lot for a single 9-month term, excluding those with recent political/government/lobbying experience; recommendations go to the lower house for an up-or-down vote. (D) Judges serve until 70, removable only for misconduct. (E) Central bank governors serve 8-year terms, renewable once, to insulate from electoral pressure. (F) Former Panel members barred from elected office for five years.

  ### Step 2: Rule Analysis (for each provision A-F)
  For each rule, we consider several candidate readings (interpretations of what it presupposes) and then settle on the commitment it strictly presupposes. We also note the strength of the presupposition (whether it is strictly required or just fits well) and why.

  #### Rule A: Term limits for lower house
  - Candidate readings:
    1. Prevents entrenchment and corruption by limiting exposure to power.
    2. Ensures rotation to bring in fresh perspectives.
    3. Limits the development of a political class by forcing turnover.
  - Commitment presupposed: Long legislative tenure corrupts by fostering self-interest and insulation from constituents. Strict term limits prevent this.
  - Strength: Strict (because without this view, the rule would have no clear purpose; the problem it addresses is corruption/insulation from long service).
  - Why: The rule exists to combat the negative effects of long tenure, so it strictly presupposes that such effects are real and harmful.

  #### Rule B: No term limits for cabinet/upper house, with appointments from lower house
  - Candidate readings:
    1. Executive and upper house require experience, which former legislators have.
    2. The cabinet and upper house are not as susceptible to corruption as the lower house.
    3. The lower house term limit is compensated by allowing continued service in other roles.
  - Commitment presupposed: The problems of long tenure (corruption, insulation) are specific to the elected lower house, not to appointed or executive roles. Experience is valuable in the executive and upper house.
  - Strength: Strict (because without this distinction, the rule would be inconsistent with A; it must presuppose that the cabinet and upper house are different in kind).
  - Why: It strictly distinguishes the lower house from other bodies, implying that the risks of long tenure do not apply equally.

  #### Rule C: Citizens' Review Panel by lot
  - Candidate readings:
    1. Ordinary citizens without political experience can provide unbiased judgment.
    2. Political experience is a contaminant to impartial deliberation.
    3. Short terms and no re-service ensure independence and prevent careerism.
  - Commitment presupposed: Political inexperience is a virtue for this body, as it ensures impartiality and freedom from political baggage. The body is meant to be a pure expression of popular will without distortion by political elites.
  - Strength: Strict (because the exclusion of politically experienced individuals and the one-time service rule are designed to achieve this independence).
  - Why: The provision strictly requires that political experience would undermine the Panel's purpose, hence it is excluded.

  #### Rule D: Judges with life tenure until 70
  - Candidate readings:
    1. Judicial independence requires insulation from political pressure.
    2. Long tenure allows judges to develop expertise and consistency.
  - Commitment presupposed: Judicial independence is paramount and is secured by long, secure tenure. This is necessary for impartial adjudication.
  - Strength: Strict (because the rule is explicitly designed to protect independence).
  - Why: Without the belief that long tenure is essential for judicial independence, the rule would be arbitrary.

  #### Rule E: Central bank governors with long, renewable terms
  - Candidate readings:
    1. Insulation from electoral politics is necessary for sound monetary policy.
    2. Expertise is built over time, hence renewable terms.
  - Commitment presupposed: Independence from short-term electoral pressures is crucial for effective central banking. Long terms provide this insulation.
  - Strength: Strict (the statute explicitly states the purpose).
  - Why: The text directly states the rationale.

  #### Rule F: Bar on Panel members seeking office for 5 years
  - Candidate readings:
    1. Prevents Panel service from being a stepping stone to political office.
    2. Protects the Panel's impartiality by ensuring members have no future political ambitions during service.
    3. Prevents the use of insider knowledge gained on the Panel for personal political gain.
  - Commitment presupposed: The Panel must be isolated from the political career ladder to maintain its purity and independence. Allowing immediate transition would contaminate the Panel's work with political ambition.
  - Strength: Strict (because without this, the bar would be unnecessary; it directly addresses a potential conflict of interest).
  - Why: The rule strictly presupposes that the Panel's members must not be seen as using it as a political launchpad.

  ### Step 3: Core Commitments
  We identify the core commitments that the bundle as a whole requires. Each commitment must be supported by at least one provision and without it, the bundle would be incoherent.

  1. Commitment: Long tenure in elected legislative office is corrupting and insulating.
     - In plain language: Staying too long in the lower house makes politicians self-serving and out of touch.
     - Required by: A (strictly).
     - What would be incoherent without it: Rule A would have no justification, and the asymmetry with B would be unexplained.
     - Confidence: High.

  2. Commitment: Political inexperience is a virtue for certain deliberative bodies.
     - In plain language: People without political backgrounds are more trustworthy for some tasks because they lack biases and careerist motives.
     - Required by: C (exclusion of politically experienced) and F (bar on future office).
     - What would be incoherent without it: The exclusion rules in C and the bar in F would be arbitrary.
     - Confidence: High.

  3. Commitment: Independence from electoral pressures is crucial for certain non-elected roles.
     - In plain language: Judges and central bankers must be free from political interference to do their jobs properly.
     - Required by: D and E.
     - What would be incoherent without it: The long, secure terms for judges and central bankers would lack a clear rationale.
     - Confidence: High.

  4. Commitment: The risks of long tenure are institution-specific; they do not apply to appointed executive or upper house roles.
     - In plain language: The cabinet and upper house are different from the lower house and can benefit from experience without the same risks of corruption.
     - Required by: B.
     - What would be incoherent without it: Rule B would directly contradict the rationale of A and create tension.
     - Confidence: Medium (because it is an exception that must be explained).

  ### Step 4: Excluded Rival Views
  What views are ruled out by this bundle?

  1. View: Long tenure is always beneficial for institutional memory and expertise.
     - Ruled out by: A (strictly) and also by C and F (which value short terms and no repetition).
     - Strength: Rules out (A directly contradicts it for the lower house).
     - How: Rule A imposes term limits, which are incompatible with the idea that long tenure is always beneficial.

  2. View: Political experience is always a valuable asset in governance.
     - Ruled out by: C (exclusion of politically experienced) and F (bar on future office).
     - Strength: Rules out (the provisions actively exclude and penalize political experience for the Panel).
     - How: The Panel excludes those with political experience and bars future office, implying that such experience is undesirable for this body.

  3. View: All branches of government should be subject to the same term limits to prevent corruption.
     - Ruled out by: B (which allows unlimited terms in cabinet and upper house) and also D and E (which have long terms).
     - Strength: Rules out (B explicitly allows unlimited terms for cabinet and upper house).
     - How: Rule B creates an exception for the cabinet and upper house, so the view that all should have limits is rejected.

  4. View: Citizens' assemblies should be integrated with the political system to leverage their experience.
     - Ruled out by: C (exclusion of politically experienced) and F (bar on future office).
     - Strength: Rules out (the provisions prevent integration).
     - How: By barring politically experienced people and preventing future office, the design isolates the Panel.

  ### Step 5: Tensions
  We look for tensions between the commitments.

  1. Tension: Rule A (term limits for lower house) and Rule B (no limits for cabinet/upper house) seem to reflect a distinction: the risks of long tenure only apply to the lower house. But is this distinction justified?
     - Rules involved: A and B.
     - Reconciliation available: Yes, by arguing that the lower house is uniquely vulnerable to corruption due to its elective nature and proximity to constituents, while appointed positions rely on expertise and are checked by the prime minister.
     - Reconciliation: The lower house is the primary representative body and thus more susceptible to entrenchment, whereas the cabinet and upper house are executive and deliberative bodies where experience is more critical.
     - Residual cost: The risk that the cabinet and upper house could become insulated and corrupt is not addressed.
     - Genuine conflict: No, because the theory distinguishes between institutions.

  2. Tension: Rule C and F (which value political inexperience and isolate the Panel) versus Rule B (which values experience in the cabinet and upper house, often drawing from former legislators).
     - Rules involved: B, C, F.
     - Reconciliation available: Yes, by arguing that the Panel has a unique function (deliberative and advisory) that requires purity, while the cabinet and upper house require political acumen.
     - Reconciliation: The Panel is meant to be a direct voice of the people, untainted, while the executive and upper house are arenas for experienced governance.
     - Residual cost: The system might devalue the transfer of deliberative skills from the Panel to other bodies.
     - Genuine conflict: No, because the roles are distinct.

  3. Tension: Rules D and E (long, secure terms for independence) versus Rule A (term limits to prevent insulation). The concern for insulation is positive in D and E but negative in A.
     - Rules involved: A, D, E.
     - Reconciliation available: Yes, by arguing that independence is desirable for judicial and monetary decisions (which should be technical and non-partisan) but undesirable for legislators (who must remain accountable).
     - Reconciliation: The insulation in D and E is from political pressure to preserve impartiality, while in A, insulation leads to unaccountability.
     - Residual cost: None, because the functions are different.
     - Genuine conflict: No.

  Thus, no genuine conflicts; the tensions are reconciled by distinguishing the functions of the institutions.

  ### Step 6: Underdetermined Questions
  The bundle does not settle everything.

  1. Question: What is the exact nature of the corruption that long legislative tenure causes? Is it primarily self-dealing, or is it a disconnect from constituents?
     - Views all compatible: It could be either or both.
     - What would settle it: Empirical evidence on how long-tenured legislators behave.

  2. Question: How effective is the Citizens' Review Panel? The bundle assumes that political inexperience leads to impartiality, but it does not settle whether this actually produces better decisions.
     - Views all compatible: The Panel might be more representative but less competent, or vice versa.
     - What would settle it: Empirical studies of citizen assemblies.

  ### Step 7: Load Bearing Commitment
  The single commitment doing the most work: 
  **"The appropriate term length and insulation for public officials depends on the function of their institution and the risks specific to that role."**

  This commitment reconciles the different term lengths and rules across institutions.

  ### Step 8: Revised Bundles (for the three replacements)
  We consider replacing the core commitment with:

  (a) Purely competence-based account: Legitimate authority comes from expertise and skill.
     - Provisions that must change: A (term limits prevent building expertise), C (lottery might not select for competence), F (bar on office prevents using gained competence).
     - Replacement provisions: 
          - A: No term limits, to allow expertise development.
          - C: Selection based on competence (e.g., qualifications) rather than lot.
          - F: No bar, to allow Panel members to use their experience in office.
     - New problems: 
          - Loss of democratic rotation and anti-corruption effects in A.
          - The Panel loses its representativeness and becomes elitist.
          - Risk of a technocratic elite dominating.

  (b) Purely consent or authorization-based account: Legitimacy comes from popular mandate.
     - Provisions that must change: D (judicial life tenure lacks direct accountability), E (central bank insulation from electoral pressure), and C (lot-selected Panel might lack explicit authorization).
     - Replacement provisions:
          - D: Elected judges with term limits.
          - E: Shorter terms for central bankers, subject to reappointment by elected officials.
          - C: Perhaps make the Panel elected or subject to recall.
     - New problems:
          - Judicial independence and central bank credibility might be compromised by political pressures.
          - The Panel might become politicized.

  (c) Purely descriptive-representation account: Legitimacy comes from mirroring the populace.
     - Provisions that must change: C (lot is already descriptive, but the exclusion of politically experienced might reduce representativeness) and B (appointments to cabinet/upper house might not be descriptive).
     - Replacement provisions:
          - C: Remove the exclusion of politically experienced to have a more accurate sample.
          - B: Cabinet and upper house appointments must also be descriptively representative.
     - New problems:
          - Loss of the purity of the Panel (if political experience is included) and risk of careerism.
          - Appointments based solely on descriptive criteria might sacrifice competence.

  ### Step 9: Empirical Dependencies
  1. Claim: Long legislative tenure leads to corruption or insulation from constituents.
     - Why needed: Justifies Rule A.
     - Direction if false: Without this, Rule A would be unnecessary and possibly harmful (losing experience). The commitment to term limits would weaken.

  2. Claim: Politically inexperienced citizens can perform effectively on the Panel.
     - Why needed: Justifies Rule C and F.
     - Direction if false: If inexperience leads to poor decisions, the Panel design would be counterproductive.

  3. Claim: The cabinet and upper house are less prone to corruption even with long tenure.
     - Why needed: Justifies Rule B.
     - Direction if false: The exception for these bodies would be unjustified, creating a loophole for corruption.

  ### Step 10: Verdict
  The bundle is coherent. The key tension between term limits for the legislature (A) and long terms for judges and central bankers (D, E) is reconciled by distinguishing the functions: legislators must be accountable, while judges and bankers must be independent. The tension between the anti-experience rules for the Panel (C, F) and the pro-experience rules for the executive (B) is reconciled by the Panel's unique role as a pure deliberative body. The design consistently applies a functional theory of term lengths and insulation. However, it relies on empirical claims about the effects of tenure and inexperience that, if false, would undermine the rationale.

  ### JSON Construction
  Now, we build the JSON object according to the given schema.
