  ### Key Explanatory Notes
  *   **Confidence (0.95):** High confidence because the vertebrate-centric rules + cephalopod exception + dismissal of invertebrate behavior + reliance on mammalian pain models explicitly referenced in guideline preambles consistently point to NATT.
  *   **Strictly Presupposed:** The practice collapses without (1) the neural threshold concept, (2) the vertebrate presumption, and (3) the behavioral sufficiency rule for vertebrates.
  *   **Rival Theories:** Ancestral Lineage and Heuristic Conservatism *also* produce the vertebrate/invertebrate split, showing the practice is underdetermined. NATT is the most consistent *stated* justification.
  *   **Tensions:** The core tension is using a *mechanistic* definition of pain but applying it via a *non-mechanistic* (lineage-based) classification system. The evidence threshold inconsistency reveals a presupposition that vertebrate neuroanatomy licenses mental state inference from behavior in a way invertebrate anatomy does not.
  *   **Attribution Rule:** It's fundamentally asymmetric. Vertebrate status triggers a permissive stance on evidence; invertebrate status triggers a highly skeptical stance.
  *   **Replacements:** A graded view forces case-by-case assessment, moving protections "up" the invertebrate complexity scale. A valence view moves protections radically "down" to simple organisms based solely on behavior, dismantling the vertebrate boundary. Both challenge the categorical NATT framework.
