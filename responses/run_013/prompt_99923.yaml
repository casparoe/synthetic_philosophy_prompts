answer: |-
  ## Exam Question: Applied Ethics Final Essay (Time: 90 minutes, Max Words: 1000)

  **The Doing/Allowing Distinction: Frameworks and Their Weight**

  The distinction between *doing* harm and merely *allowing* harm (or killing vs. letting die) is central to many ethical debates. This distinction can be understood in two primary ways:

  1.  **Causal Reading:** An agent *allows* an outcome if their conduct is **not part of the causal chain** leading to that outcome; they *do* harm if their conduct **is a cause** of the harm.
  2.  **Normative Reading:** An agent *allows* an outcome if they **omit to prevent it** and **have a duty** to prevent it; they *do* harm if they **initiate or actively cause** the harmful sequence, regardless of prior duty.

  **Your Task:**

  1.  **Construct Two Original Cases:** Develop two distinct, detailed scenarios *not* drawn from standard course literature (e.g., no trolley problems, transplant surgeons, trapped miners, etc.).
      *   **Case 1 (Causal Allows / Normative Does Not):** In this case, according to the *causal* reading, Agent A *allows* a harm to occur. However, according to the *normative* reading, Agent A *does not allow* the harm (i.e., either A *did* the harm, or A had no duty to prevent it, so it wasn't an 'allowing' in the normative sense).
      *   **Case 2 (Normative Allows / Causal Does Not):** In this case, according to the *normative* reading, Agent A *allows* a harm to occur (i.e., A omits to prevent it and had a duty to do so). However, according to the *causal* reading, Agent A *does not allow* the harm (i.e., A's conduct *was* part of the causal chain leading to harm, so it looks more like 'doing').
      *   **Requirement:** In *at least one* of your cases, the relevant omission must be embedded either **(a)** in the default, unaltered functioning of a machine/system, or **(b)** in a division of labour/responsibility across several agents (e.g., a team, an organization). The question of "who allowed it" should not be answerable simply by pointing to a single, direct physical action or inaction by one individual.

  2.  **Analyze the Distinction's Moral Weight:** Based on the challenges highlighted by your cases (particularly the divergence between the two readings), critically evaluate the following claim: **"The Doing/Allowing distinction (on either the causal or normative reading) can reliably bear the significant moral weight often placed upon it in debates like killing vs. letting die (e.g., where 'merely allowing' death is seen as less wrong than 'doing' it)."**
      *   Clearly state your verdict (e.g., yes for one reading but not the other, no for both, yes but only with qualifications).
      *   Defend your verdict against what you consider the **strongest single objection** someone might raise against it. Potential objections include (but are not limited to):
          *   The causal reading inevitably smuggles in normative assumptions, collapsing into the normative reading.
          *   The normative reading reduces the doing/allowing distinction to the separate question of when a duty to rescue/prevent harm exists, rendering it redundant.
          *   The divergence shown in your cases demonstrates that neither reading captures a stable, morally significant concept.

  **Focus:** Demonstrate deep understanding by applying the *concepts*, not just naming them. Clarity, originality of cases, logical reasoning, and critical analysis are paramount.

  ---

  ## Model Answer (Approx. 650 words)

  **Case 1: Causal Allows / Normative Does Not (The Thermostat Default):**

  Dr. Eva is a climate scientist studying a remote, automated weather station crucial for predicting deadly monsoons. The station runs on software with a default setting: if not manually overridden every 24 hours, it powers down instruments to conserve energy. Eva, exhausted after a double shift, falls asleep *without* performing the override. The station powers down as designed. Meanwhile, unprecedented data indicating a catastrophic, rapidly forming monsoon is missed. Villagers downstream, unaware, are not evacuated and perish. Eva’s specific *inaction* (not pressing the override button) is not part of the causal chain of the monsoon or the villagers' deaths – the monsoon formed independently, and the deaths resulted directly from the storm and lack of warning. **Causally**, Eva merely *allowed* the harm by failing to interrupt the default shutdown. **Normatively**, however, her sleeping wasn't a culpable *omission to prevent* because she had worked excessively due to understaffing and genuinely needed rest. The duty to override wasn't reasonably demandable at that moment; her falling asleep wasn't a reckless breach of duty. Normatively, this looks more like a tragic accident or a systemic failure (understaffing, poor default design), not an instance of Eva *allowing* death through a blameworthy omission.

  **Case 2: Normative Allows / Causal Does Not (The Hospital Handover):**

  City Hospital has a strict protocol: Nurse Ben monitors Patient X's vital signs overnight. At 7 AM, he must log critical readings into the central database before his shift ends. Dr. Ava, the day-shift lead, is formally responsible for checking this log by 7:15 AM and acting on any alerts. Ben, distracted by an emergency, *forgets to log* Patient X's critically low oxygen levels at 7 AM. Ava, arriving precisely at 7:15 AM, glances at the log. Seeing *no new entry* from Ben (which the system displays as "No Data Submitted"), she assumes all is well and proceeds to her rounds without checking the live feeds, believing the absence of an alert means no action is needed. Patient X deteriorates and dies an hour later due to the untreated low oxygen. **Normatively**, Ava *allowed* the death. She had a clear duty (per hospital protocol and her role) to verify the patient's status at shift handover, especially given the known criticality. Her omission to check the live feed or follow up with Ben, based solely on the absence of logged data, was a breach of this duty. **Causally**, however, Ava's inaction is *part of the causal chain*. Ben's omission created a dangerous situation, but it was Ava's specific failure to check (her conduct) that was the final, necessary link preventing intervention. The harm wouldn't have occurred *without* her omission at that point. Causally, she *did* something (failed to act when her role required it) that caused the preventable death.

  **Analysis: Can the Distinction Bear the Weight?**

  The stark divergence between the causal and normative readings in these cases suggests that **neither reading alone can reliably bear the full moral weight traditionally placed on the doing/allowing distinction**, particularly the idea that "merely allowing" death is significantly less wrong than "doing" it.

  In Case 1, the causal reading says Eva merely allowed death, which might suggest lesser blame. Yet normatively, she arguably bears little or no *fault* for the outcome, making the label "allowing" misleadingly negative. In Case 2, the normative reading says Ava allowed death, implying potential lesser wrongness compared to active killing. However, causally, her omission was a direct, necessary cause; attributing significantly *less* moral weight to her role than to an act causing equivalent harm seems unjustified. Her inaction was functionally equivalent to disabling the alarm.

  **Verdict:** While the normative reading is *more essential* for moral assessment (as it incorporates duties and culpability), it cannot bear the specific weight of *intrinsically* making an action less wrong *merely because* it is classified as "allowing" rather than "doing." The moral significance comes from the underlying reasons – the nature of the duty breached, the reasons for the omission, the foreseeability, and the causal role – not primarily from the classification itself. The distinction is descriptive (highlighting different causal or deontic structures), not intrinsically morally determinative.

  **Defending Against the Strongest Objection:**

  The strongest objection is that the normative reading **collapses the doing/allowing distinction into the duty-to-rescue question**, rendering it redundant. If "allowing" just means "omitting a duty," then the moral weight rests entirely on *why* there was a duty and *why* it was breached, not on the "allowing" label itself.

  **Reply:** This objection is largely correct and reinforces my verdict. The key moral work *is* done by establishing the existence and scope of the duty to prevent harm and assessing the culpability of the omission. Labeling it "allowing" adds little. In Case 2, calling Ava's breach "allowing" doesn't change the fact her culpable failure caused death. The distinction might still have *heuristic* or *descriptive* value in framing situations (e.g., highlighting reliance on omissions vs. positive actions), but it cannot carry independent moral weight justifying a *categorical* difference in wrongness between killing and letting die. The moral evaluation must focus on the specific context, the agent's responsibilities, and the consequences, not the label derived from a causal or narrowly normative framework.

  ---

  ## Marking Scheme (Total: 20 Marks)

  1.  **Case Construction & Requirements (8 marks):**
      *   *Must-hit:* Two original, plausible, clearly described cases. Case 1 demonstrates *causal allowing / normative not-allowing*. Case 2 demonstrates *normative allowing / causal not-allowing*. At least one case involves system default or division of labour. Cases avoid standard literature examples.
      *   *Typical Mistake:* Cases fail to clearly demonstrate the *opposite* divergence; confuse the readings; use standard examples; omit system/division element or implement it poorly (e.g., still points to one pair of hands).

  2.  **Demonstrating Divergence (4 marks):**
      *   *Must-hit:* Clearly and accurately explains *why* each case produces the specified divergence for each reading, explicitly referencing causal chains and normative duties/culpability.
      *   *Typical Mistake:* Asserts the divergence without clear explanation; misapplies the causal/normative definitions; fails to link reasoning to case details.

  3.  **Evaluation of Moral Weight (4 marks):**
      *   *Must-hit:* Provides a clear, reasoned verdict on whether the distinction (on either/both readings) can bear the moral weight, explicitly linking the verdict to challenges demonstrated by the cases.
      *   *Typical Mistake:* Gives an unsupported opinion; ignores the implications of the case divergence; fails to specify which reading(s) the verdict applies to.

  4.  **Handling the Objection (3 marks):**
      *   *Must-hit:* Identifies and articulates one strong, relevant objection to their verdict. Provides a substantive, reasoned defense against that specific objection.
      *   *Typical Mistake:* Addresses a weak or irrelevant objection; defense is superficial, illogical, or unrelated to the objection stated; fails to connect defense back to their overall verdict.

  5.  **Clarity, Structure & Coherence (1 mark):**
      *   *Must-hit:* Essay is well-organized, logically structured, clearly written, and stays within the word limit.
      *   *Typical Mistake:* Disorganized; unclear writing; significant irrelevant tangents; significantly over/under word count.
