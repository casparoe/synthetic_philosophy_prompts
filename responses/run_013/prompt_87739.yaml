answer: |-
  ## The Unstable Boundary: Supererogation as Primitive or Empty

  **I. The Case for the Ordinary Picture**

  Moral life seems neatly divided. We recognize clear duties: a bystander seeing a child drown in shallow, safe water *must* wade in and pull them out. The cost (wet clothes, mild inconvenience) is trivial compared to the child's life. Failure here is blameworthy negligence. But contrast this with another rescuer: a stranger who donates a kidney to save a life. While profoundly good, we hesitate to call this *obligatory*. The cost – major surgery, lifelong health implications, significant risk – feels excessive to demand. This act is *supererogatory*: morally excellent, yet beyond duty. Further still, consider someone who abandons a comfortable career to devote their life to famine relief in a distant, dangerous land. We admire such sacrifice intensely, precisely because we feel *no one could be required* to bear such constant, extreme hardship and risk.

  The "threshold" concept does crucial work here. It marks the point where the *cost to the agent* (physical, psychological, financial, life-altering) becomes too great to be reasonably demanded. Below this threshold, the potential benefit to others creates a duty; above it, while the act remains good (perhaps even supremely good), it is optional. We need this boundary to:
  1.  **Preserve the "ought implies can" principle:** We cannot demand the impossible or the devastatingly destructive from moral agents.
  2.  **Protect agent integrity and a worthwhile life:** Morality shouldn't demand self-annihilation or the sacrifice of all that makes life meaningful *as a baseline requirement*.
  3.  **Explain our differential responses:** We blame the shallow-water bystander but praise (without demanding) the kidney donor or the lifelong aid worker. The threshold explains this shift from requirement to optional heroism.

  **II. Pressing the Difficulty: The Circularity in Defining the Threshold**

  The problem arises when we ask: *How is this threshold determined?* Every plausible criterion smuggles in the concept of the supererogatory itself.

  1.  **"Reasonable Demand":** What counts as "reasonable" to demand? It seems to mean "demands that do not require supererogatory sacrifice." But this defines "reasonable demand" (the boundary of duty) *in terms of the absence of supererogatory cost*, which is precisely the concept we're trying to define using the threshold. Circularity bites: "Duty demands only what is reasonable (i.e., non-supererogatory) to demand."
  2.  **"Life No Longer Worth Living":** The threshold is where compliance would make the agent's life "no longer worth living." But what constitutes such a life? Surely not just survival; it implies the loss of core goods that make life *meaningful or minimally fulfilling*. However, defining these core goods inevitably involves judgments about what sacrifices *can* be demanded. Is a life without one kidney "no longer worth living"? Clearly not – donation is supererogatory, not devastating. Is a life spent in constant danger and hardship for others' sake "no longer worth living"? For some, perhaps; for the dedicated aid worker, it *is* their meaningful life. The judgment that a certain sacrifice *would* make life unbearable (thus defining the limit of duty) relies on an implicit understanding that enduring *that level* of sacrifice is *beyond* what can be demanded – it relies on the supererogatory as input. The threshold criterion ("life not worth living") depends on a prior, unarticulated sense of where supererogation begins.
  3.  **"Balancing Agent's vs. Others' Interests":** The threshold is where the cost to the agent outweighs the benefit to others. But *how* do we weigh them? A purely impartial calculus (e.g., maximizing total utility) risks demanding extreme sacrifice whenever the benefit to others is large enough – collapsing supererogation into duty if the numbers add up. To avoid this, we must assign *extra weight* to the agent's own fundamental interests relative to others' comparable interests. But why assign this extra weight? The justification seems to be that agents have a legitimate claim to protect their core well-being *from the demands of morality*, meaning they are not *required* to sacrifice it. This, however, is just another way of saying that such sacrifice is supererogatory. The balancing mechanism designed to *output* the duty/supererogation distinction requires the *input* of a principle that already presupposes that distinction (i.e., that agents have a protected sphere beyond which sacrifice is optional).

  **Resistance?** One might resist by claiming "reasonable demand" or "life worth living" are objective, non-moral facts. But this is implausible. Whether donating a kidney is "reasonable" or makes life "not worth living" isn't a biological fact; it's a normative judgment about what morality can demand, intrinsically tied to our concept of obligation and what lies beyond it.

  **III. The Strongest Reply and its Failure**

  **The Reply:** The threshold is fixed by an *independent standard*, such as the requirements for a minimally decent or flourishing human life, defined objectively (e.g., basic health, security, meaningful relationships, autonomy). Duty demands only what is compatible with maintaining this core threshold of well-being. The supererogatory is then simply whatever action, however good, imposes costs *above* this threshold, sacrificing elements necessary for this decent/flourishing life.

  **What it Must Establish:** This reply must show that the "core well-being threshold" (CWT) can be defined *without* reference to moral obligation or supererogation. It must be grounded in a value-neutral anthropology or theory of human nature/goodness.

  **Why it Fails/Concedes Primitiveness:**

  1.  **Value-Laden Definition:** Any plausible CWT (health, relationships, autonomy, purpose) is not value-neutral. These *are* goods, often central to moral conceptions of a good life. Defining the CWT inevitably draws on our understanding of what makes life *worthwhile* – a concept deeply intertwined with ethics. It's hard to see how this definition avoids presupposing judgments about what burdens are *too heavy* to be mandatory, which is the core of the supererogation concept.
  2.  **The Sacrifice Question:** Why is sacrificing *this specific set* of goods (the CWT) the point where demand stops? The answer seems to be: "Because sacrificing *these* goods is what makes an act supererogatory." The CWT is posited *because* we intuitively recognize that demanding sacrifice of *those* things is where morality stops requiring and starts admiring. The CWT doesn't independently *explain* the boundary; it *labels* the bundle of goods whose sacrifice our moral intuitions mark as supererogatory.
  3.  **Conceding Primitiveness:** If the defender insists the CWT is objectively identifiable *and* that sacrificing it definitively marks the supererogatory, they are essentially treating the connection between that specific threshold and the category of "beyond duty" as a brute fact. They offer no deeper explanation *why* duty stops precisely here, other than pointing to the CWT. But the CWT itself only gains its boundary-setting power *because* we already associate its sacrifice with supererogation. The distinction (sacrificing CWT = supererogatory) becomes the unexplained primitive foundation.

  **IV. Implications: Primitive or Empty?**

  The argument forces a choice:

  1.  **Supererogation as Primitive:** If we maintain the distinction, we must accept that the boundary between duty and supererogation is a fundamental, irreducible feature of our moral framework. We recognize it intuitively in cases (shallow water = duty, kidney = supererogation), but we cannot provide a non-circular, reductive account of *why* the line falls where it does. The phenomenology is vindicated – we *do* experience certain acts as admirably "beyond the call" – but this experience is the bedrock, not something explained by deeper principles. We reason by comparing new cases to paradigm instances, not by applying a strict formula.

  2.  **Supererogation as Empty:** If we reject the primitive distinction, the concept collapses. Morality might become a continuous scale of "better" and "worse," where all acts promoting the good are *pro tanto* required, but the *overall* obligation is constrained by "ought implies can." The "admirable beyond duty" feeling would be an illusion. The lifelong aid worker is simply doing what morality requires *if they can*, while the shallow-water bystander is grossly negligent. The phenomenology of special admiration for extreme sacrifice remains unexplained – why admire the aid worker *more* than someone merely meeting a minimal duty, if both are just doing what's required of them *given their capacities and circumstances*? This replacement struggles to capture the unique moral character we attribute to acts perceived as gratuitous gifts, exceeding any possible demand.

  **Conclusion:**

  The instability of the boundary arises because any principle proposed to *define* the threshold of reasonable demand inevitably relies on a prior, unanalyzable intuition about what constitutes a sacrifice *too great to be mandatory* – which *is* the intuition of the supererogatory itself. We cannot derive the distinction from more fundamental non-moral facts without circularity. Therefore, the concept of supererogation is either a primitive, brute feature of our moral landscape (explaining the phenomenology but defying reductive analysis), or it is an empty category, leaving us without a coherent way to capture the powerful intuition that some profound goods are freely given, not owed. The ordinary picture's neat separation rests on foundations that crumble under scrutiny, revealing an irreducible tension at the heart of moral demandingness.
