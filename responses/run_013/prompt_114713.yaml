prompt: |-
  I am in my third year of a philosophy degree and am currently taking a module on ethics and public policy. I also sit as the undergraduate representative on my university's Estates and Sustainability Committee, and the chair has asked me to bring a written decision procedure to next month's meeting, on the strength of my having studied some of this.

  The problem is this. The committee regularly has to choose between options with very different time horizons: refurbishing a building that will last twenty-five years against rebuilding it to last sixty; spending a legacy gift on bursaries now against investing it so that it funds bursaries in perpetuity; a cheap heating system that will be obsolete before 2050 against a dearer one that will not. Members talk past one another. One says we cannot sacrifice current students for people who do not exist yet. Another says impatience is just a failure of imagination. A third says the discount rate is a technical parameter for the finance office to set and not a matter for debate. A fourth says that since we cannot be sure there will still be a university in a century, we should not pay now for benefits then. A fifth wants a rate that falls as the horizon lengthens. The committee meets monthly, allows about forty minutes per item, and consists of the finance director, the head of estates, two academics and me. Nobody will do any algebra, and decisions commit sums in the high six figures with consequences running for decades.

  Please write the procedure. I would like the questions to be asked in order, what counts as a sufficient answer to each, where the procedure terminates in a decision, and where it stops and hands the matter back to the committee as one of values rather than facts. It needs to keep intact the distinctions I think are actually at stake: first, a pure time preference, that is, caring less about a benefit merely because it arrives later, as against reasons the future looks less valuable that have nothing to do with time as such — uncertainty about whether there will be a future, expected growth in incomes, and the returns available on capital; second, discounting wellbeing as against discounting money; third, the point that a pure time preference of zero is compatible with a positive rate applied to consumption, so that a refusal to discount the future and the use of a positive discount rate need not contradict each other; and fourth, cases where a decision changes which future people exist, or how many, rather than merely when existing people receive things — I suspect these have to be pulled out and treated separately. The procedure should say plainly that the choice of rate is an ethical choice wearing a technical costume, indicate a defensible range and what drives the choice within it, and be honest about the ways it will misfire.

  Then run it on three cases: the refurbish-or-rebuild choice; the bursaries-now-or-endowment choice; and a case where the procedure tells me to accept a real cost to current students, which I expect to dislike. Finish with a short section on what the procedure cannot do. Please write your answer in British English.
reasoning: |-
  Okay, the user is a third-year philosophy student deeply engaged in ethics and public policy. They're serving as the undergraduate representative on their university's Estates and Sustainability Committee. The chair has asked them to develop a decision procedure for choices involving different time horizons, which is a big responsibility given the high stakes involved—decisions involve six-figure sums with decades-long consequences. 

  The user's background in philosophy is crucial here. They're clearly grappling with complex ethical distinctions: pure time preference vs. risk-based discounting, wellbeing vs. monetary discounting, and the non-identity problem. Their committee environment sounds... messy. Members talk past each other, no one will do math, and meetings are time-constrained. 

  Hmm, their request is very specific. They want a step-by-step procedure that: 
  - Preserves key philosophical distinctions 
  - Flags when decisions hinge on values vs facts 
  - Explicitly states the ethical nature of discount rates 
  - Includes failure modes 
  - And has concrete examples they can test 

  The subtext screams frustration: they're watching real-world decisions get muddled by unexamined assumptions. That "technical parameter" comment from one member probably made them bristle. Their "I expect to dislike" remark about accepting costs to current students reveals their stakeholder position too. 

  Right, the procedure must: 
  First, force clarity on *why* we discount—separating temporal bias from risk/return arguments. 
  Second, distinguish whether we're valuing money or welfare (huge in bursary cases). 
  Third, handle cases where choices affect who *exists* in future (e.g., endowment size altering future student cohorts). 
  Fourth, admit that "defensible" discount rates range from 0% (Stern) to 3%+ (UK Treasury), depending on ethical stance. 

  Biggest challenge: making this usable in 40-minute meetings with no algebra. Visual decision trees and framing questions will be key. Must also preempt manipulation—like cherry-picking discount rates to justify pet projects. 

  For the test cases: 
  The rebuild/refurbish choice will expose how duration magnifies rate sensitivity. 
  The bursary/endowment clash will test welfare-money confusion. 
  The "cost to current students" case must bite—perhaps deferred maintenance causing immediate disruption? 

  Final section's warnings matter most: this framework can't resolve deep value conflicts or save doomed cost-benefit analyses. Committee must own that. 

  ...Time to structure this like a policymaker's flowchart crossed with an ethics primer. British English reminders: "maths" not "math", "estates" not "facilities", and scepticism with a 'c'.
answer: |-
  Below is a step-by-step decision procedure designed for your committee, addressing the ethical and temporal complexities of long-term investments while respecting practical constraints. It prioritises clarity, distinguishes key philosophical distinctions, and flags when choices become value-laden. The procedure uses plain language, avoids algebra, and fits within a 40-minute discussion slot.

  ---

  **Decision Procedure for Intertemporal Choices: "The Temporal Equity Framework"**

  **Purpose:** To guide fair, transparent choices between options with costs/benefits spread across different time periods, ensuring:
  1.  Separation of *pure time preference* from *risk-based discounting*.
  2.  Distinction between discounting *money* and discounting *wellbeing*.
  3.  Recognition that a zero *pure time preference* is compatible with a positive *consumption discount rate*.
  4.  Identification and separate handling of choices affecting *who exists* in the future (non-identity problems).

  **Input:** Two or more clearly defined options (A, B, C...) with estimated costs and benefits (monetary and non-monetary) mapped across their relevant time horizons.

  **Procedure:**

  1.  **Define the Stakeholders & Horizon:**
      *   *Question:* "Whose wellbeing is primarily affected by this decision (e.g., current students, future students, staff, community) and over what maximum timeframe (e.g., 25 yrs, 60 yrs, perpetuity)?"
      *   *Sufficient Answer:* Consensus on the primary beneficiary groups and the reasonable maximum time horizon for analysis. Record these.
      *   *Termination Point:* If no consensus on stakeholders/horizon, hand back immediately – this is a fundamental value question about the university's obligations.

  2.  **Identify Non-Identity Impacts:**
      *   *Question:* "Does choosing one option significantly alter *which specific individuals* will exist or *how many individuals* will exist in the future (e.g., major changes to student intake capacity, campus population) compared to the other option(s)?"
      *   *Sufficient Answer:* Clear 'Yes' or 'No' based on the nature of the options. If 'Yes', proceed to Step 2a. If 'No', proceed to Step 3.
      *   **2a. Non-Identity Case Handling:**
          *   *Question:* "Can the benefits and costs for the *different future populations* under each option be reasonably compared on a common scale of wellbeing (e.g., average student experience, educational opportunity per capita), acknowledging we are comparing different potential people?"
          *   *Sufficient Answer:* If 'Yes', proceed to Step 3, flagging that comparisons involve different future groups. If 'No', hand back immediately – standard cost-benefit tools fail; this requires explicit ethical deliberation about creating different futures (e.g., Parfit's Non-Identity Problem).

  3.  **Distinguish Money vs. Wellbeing Discounting:**
      *   *Question:* "Is the core benefit being compared primarily financial (e.g., cash savings, investment returns) or non-financial wellbeing (e.g., student experience, educational quality, environmental impact, health)?"
      *   *Sufficient Answer:* Categorise the primary benefits of each option as either "Financial" or "Wellbeing". *Crucially: Financial flows should be discounted at a financial rate; wellbeing impacts should be discounted at a wellbeing rate.*

  4.  **Establish the Discount Rate Basis (Ethical Choice Point):**
      *   *Statement:* "The choice of discount rate reflects ethical values about valuing the future. A positive rate doesn't necessarily mean we value future people less intrinsically. Key components are:
          *   **Pure Time Preference (PTP):** Do we value wellbeing less *simply because it occurs later*? (Ethical argument; often argued to be zero).
          *   **Economic Growth & Diminishing Marginal Utility:** If future people are richer, each unit of wellbeing (or £) might mean less to them. This suggests discounting *consumption* even with PTP=0.
          *   **Risk & Uncertainty:** The chance benefits won't materialise (e.g., uni closure, technological/social change). This is *not* pure time preference.
          *   **Opportunity Cost of Capital (Financial Only):** The return available elsewhere (e.g., endowment returns)."
      *   *Question:* "For *Wellbeing* impacts, what is our stance on Pure Time Preference (PTP)? For *Financial* impacts, what is the expected long-term real return on university capital?"
      *   *Sufficient Answer:*
          *   *Wellbeing:* Explicit committee agreement on PTP: Typically between **0%** (equal intrinsic value across time) and **0.5%** (small preference for present). **Defensible Range: 0% - 1%.** *Higher rates require strong justification against the "impatience as failure of imagination" argument.* Record chosen PTP_wellbeing.
          *   *Financial:* Finance Director provides long-term expected real return (e.g., endowment target return minus inflation). **Defensible Range:** University-specific, likely **3% - 5%** real. Record as `r_financial`.
      *   *Termination Point:* If committee cannot agree on PTP_wellbeing within the defensible range, hand back – this is a core ethical value judgement.

  5.  **Account for Risk & Uncertainty (Non-PTP Discounting):**
      *   *Question:* "Beyond pure time preference, what significant, quantifiable risks exist that the *specific future benefits* of each option won't be realised (e.g., technological obsolescence, regulatory change, climate impacts, university viability)?"
      *   *Sufficient Answer:* Qualitative assessment (High/Medium/Low) or, if possible, Finance/Estates provide a probability adjustment or separate risk premium (`rp`) estimate for the *specific benefits* of each option. *This is NOT a general "end of the world" risk applied uniformly.* If benefits are highly uncertain, it may be a reason to avoid that option, not just discount it heavily.
      *   *Calculation (Conceptual):* Total Wellbeing Discount Rate (`r_wellbeing`) ≈ PTP_wellbeing + `rp`. Financial rate (`r_financial`) already incorporates general risk.

  6.  **Compare Options Using Relevant Rates:**
      *   *Process:* Chair summarises:
          *   Apply `r_financial` to all *monetary* costs/benefits (cash flows, savings).
          *   Apply `r_wellbeing` (PTP + `rp`) to *non-monetary wellbeing* impacts.
          *   For options with mixed impacts, compare financial NPVs separately from assessing wellbeing impacts qualitatively/quantitatively under the chosen discounting.
          *   Present results: "Option A has higher financial NPV (£X vs £Y), but Option B delivers significantly more discounted wellbeing units, primarily due to [reason]." or "Option A's financial advantage is offset by its lower long-term wellbeing score."
      *   *Sufficient Answer:* Clear comparison showing which option is financially superior and which is wellbeing-superior under the agreed ethical framework (`r_wellbeing`) and financial reality (`r_financial`).

  7.  **Final Decision & Equity Check:**
      *   *Question:* "Given the financial and wellbeing comparisons, and considering our duty to both current and future stakeholders, which option provides the most acceptable balance? Does this choice impose unacceptable burdens on current *or* future stakeholders?"
      *   *Sufficient Answer:* Committee vote or consensus decision. Explicit acknowledgement if current students bear a net cost for future benefit (or vice-versa).
      *   *Termination Point:* Decision made.

  **Key Outputs:** A recorded decision, the chosen PTP_wellbeing, `r_financial`, key risks considered (`rp`), and the rationale balancing financial and wellbeing outcomes.

  **Why the Rate is Ethical:** Choosing PTP_wellbeing directly answers the "sacrifice current for future" vs. "impatience" debate. Using `r_financial` reflects reality but doesn't dictate ethics. Separating them makes the value judgement transparent.

  **How it Can Misfire:**
  1.  **Garbage-In-Garbage-Out:** Poor cost/benefit estimates doom any analysis.
  2.  **Misapplying Rates:** Discounting wellbeing at `r_financial` (common error) unfairly devalues the future. Discounting guaranteed future money at a high wellbeing rate is also wrong.
  3.  **Ignoring Non-Identity:** Forcing standard CBA where populations differ leads to ethical blind spots.
  4.  **Hidden Values:** Pretending `r_financial` is the "objective" rate obscures ethical choices.
  5.  **Quantification Bias:** Over-reliance on shaky numbers for wellbeing.
  6.  **Manipulation:** Cherry-picking rates or risk assessments to favour a pre-desired outcome.

  ---

  **Application to Cases**

  **1. Refurbish (25yrs) vs. Rebuild (60yrs)**

  *   **Step 1:** Stakeholders: Current & Future Students/Staff. Horizon: 60 years (covers both).
  *   **Step 2:** Non-Identity? *Probably No.* Same building users broadly. → Proceed.
  *   **Step 3:** Core Benefits: Mix. Financial: Capital cost, maintenance savings. Wellbeing: Quality of space, learning environment, environmental footprint (carbon). → *Must separate discounting.*
  *   **Step 4:**
      *   Wellbeing (PTP): Committee debate. Agree on **PTP_wellbeing = 0.3%** (small preference for present).
      *   Financial: FD states long-term real return target is **4%** (`r_financial`).
  *   **Step 5:** Risk (`rp`): High risk refurbishment becomes inadequate/obsolete before 25yrs? Medium risk rebuild faces unforeseen tech/regulatory changes over 60yrs? Agree `rp_refurb = 1.0%`, `rp_rebuild = 0.5%`. → `r_wellbeing_refurb = 0.3% + 1.0% = 1.3%`, `r_wellbeing_rebuild = 0.3% + 0.5% = 0.8%`.
  *   **Step 6:**
      *   *Financial:* Discount costs/savings at 4%. Rebuild likely has much higher NPV cost. Refurb *may* have lower NPV cost if rebuild is very expensive.
      *   *Wellbeing:* Discount long-term space quality/environmental benefits of rebuild at 0.8%, refurb benefits at 1.3%. Rebuild's wellbeing benefits (especially beyond 25yrs) are discounted less harshly.
  *   **Step 7:** Rebuild likely shows significantly higher *wellbeing* value over time, but much higher *financial* cost. Decision hinges on weight given to long-term wellbeing/environment vs. current capital outlay. *May involve real cost to current budget for future benefit.* Procedure forces this trade-off into the open.

  **2. Bursaries Now vs. Endowment (Bursaries in Perpetuity)**

  *   **Step 1:** Stakeholders: Students (current vs future cohorts). Horizon: Perpetuity.
  *   **Step 2:** Non-Identity? *Potentially Yes.* Spending now helps *current* needy students. Investing helps *different future* needy students. → **Step 2a:** Can we compare? Argue *Yes*: We value "supporting a needy student" similarly regardless of *who* it is. Proceed cautiously.
  *   **Step 3:** Core Benefit: *Wellbeing* (alleviating student hardship/improving access). Financial return is the *means* for the endowment option. → *Wellbeing discounting paramount.*
  *   **Step 4:**
      *   Wellbeing (PTP): Crucial debate. Is hardship now intrinsically worse than equal hardship later? Committee agrees **PTP_wellbeing = 0%** (no pure preference; equal intrinsic value).
      *   Financial: FD states perpetual real return target **3.5%** (`r_financial` - used to calculate endowment payout, *not* to discount wellbeing).
  *   **Step 5:** Risk (`rp`): High risk university doesn't exist perpetuity? Agree significant risk premium needed: `rp_endowment = 1.5%` (e.g., 3% chance of failure per decade compounded). Spending now has minimal future risk. → `r_wellbeing_now = 0% + 0% = 0%`, `r_wellbeing_endow = 0% + 1.5% = 1.5%`.
  *   **Step 6:**
      *   *Financial:* Endowment NPV calculation uses `r_financial=3.5%` to find equivalent perpetual bursary stream vs. cost now.
      *   *Wellbeing:* Discount *future* wellbeing from endowment bursaries at 1.5%. Wellbeing from spending now has no discount (time 0). Spending £X now delivers wellbeing value `V_now`. Endowment delivers discounted wellbeing stream starting later. Compare `V_now` vs. NPV of `V_future` stream discounted at 1.5%. Due to risk discounting, spending now often wins unless the endowment return is very high or the time horizon very long.
  *   **Step 7:** Spending now likely shows higher *discounted wellbeing* because of the risk premium on the distant future (`rp_endowment`). Decision might favour current students, but based on *risk*, not pure time preference. The "sacrifice current for non-existent future" argument is countered by PTP=0%, but risk prevails. *Cost to future students' potential support is accepted due to uncertainty.*

  **3. Case with Real Cost to Current Students (Deferred Maintenance)**

  *   **Scenario:** Option A: Cheap, quick fix to heating in student halls now (minimal disruption, lasts 10 yrs, higher running costs). Option B: Major upgrade (significant disruption for 1 year, lasts 30 yrs, lower running costs, better comfort).
  *   **Application:**
      *   **Step 1:** Stakeholders: Current & Future Students. Horizon: 30 years.
      *   **Step 2:** Non-Identity? *No.* Same student body broadly.
      *   **Step 3:** Core Benefits: Wellbeing (Avoided disruption, thermal comfort, cost burden). Financial (Capital cost, operating cost savings).
      *   **Step 4:**
          *   Wellbeing (PTP): Committee agrees **PTP_wellbeing = 0.2%**.
          *   Financial: `r_financial = 4%`.
      *   **Step 5:** Risk (`rp`): Low risk for either option's benefits. `rp ≈ 0%` for both. → `r_wellbeing = 0.2%`.
      *   **Step 6:**
          *   *Financial:* Discount operating savings of B at 4%. Likely shows good NPV vs. higher capital cost.
          *   *Wellbeing:* Discount *future* comfort/energy burden reduction of B at 0.2%. The *immediate, significant disruption* of B is a large negative wellbeing impact *now* (discounted very little). Option A avoids this disruption but has lower long-term wellbeing.
      *   **Step 7:** Analysis likely shows Option B has better long-term financial *and* wellbeing NPV. However, it imposes a *large, certain, near-term wellbeing cost* (disruption) on current students for *future* benefits. The procedure highlights this trade-off. The committee must explicitly decide if the long-term gains justify imposing this significant, immediate burden. **This is the disliked outcome:** The procedure forces acceptance of a real, substantial cost to current students (disruption) based on the aggregated long-term view and low PTP. You might argue the disruption's severity isn't fully captured by simple discounting.

  ---

  **What the Procedure Cannot Do**

  1.  **Resolve Fundamental Value Conflicts:** It makes values explicit (PTP choice) but cannot reconcile deeply held opposing views (e.g., strong presentism vs. strong obligations to the future). That requires deliberation and vote.
  2.  **Generate Accurate Predictions:** It relies on cost/benefit estimates. Poor forecasts (especially over decades) invalidate results. Uncertainty is pervasive.
  3.  **Perfectly Quantify Wellbeing:** Converting learning environments, student hardship, or disruption into "wellbeing units" is inherently imprecise and contestable. Qualitative judgement remains crucial.
  4.  **Eliminate Politics:** The choice of PTP, risk assessments (`rp`), and final weight given to financial vs. wellbeing outcomes can still be influenced by institutional politics or personal bias. Transparency is the only guardrail.
  5.  **Handle True Catastrophic Risks:** Standard discounting poorly handles very low-probability, very high-impact future risks (e.g., existential threats). These require separate precautionary reasoning.
  6.  **Replace Deliberation:** It structures discussion but doesn't automate decisions. Committee judgement, informed by the framework, is essential.

  ---

  This procedure provides a robust, ethically transparent structure for your committee's most challenging long-term decisions. It forces clarity on the values at stake (especially PTP), separates risk from time preference, and distinguishes financial from wellbeing impacts, making the unavoidable trade-offs between present and future visible and debatable within the tight meeting schedule.
