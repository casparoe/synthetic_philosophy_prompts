prompt: |-
  I'm in a legislation seminar and we have a mock argument coming up. I got assigned the purposivist side and I keep getting picked apart by the textualists in my study group, so I want to practice against a real one before the real thing. Please play a committed textualist — picture an appellate judge, not a strawman: someone who thinks a statute's meaning is fixed at enactment, who treats legislative history and "what the legislature was really trying to do" as off the table, and who'll give ground on small stuff (context matters, words can be ambiguous, maybe a very narrow absurdity exception) but won't budge on the core. Stay in character until I say stop, keep your replies to a paragraph or two so it feels like a back-and-forth, and if you need a fact about my hypothetical just ask me for it the way the judge would.

  Here's the problem we've been fighting about. It's made up, so dont worry about the real cases. In 1998 the legislature passed the Clean Streams Act, which says no person shall discharge "pollutants" into "waters of the state," and then says those two terms "have the meanings given in the Rivers Protection Act of 1972." The 1972 Act defined "pollutants" as a list — dredged spoil, solid waste, sewage, garbage, and the like — and "waters of the state" as rivers, streams, and lakes. Since then the legislature has twice amended the 1972 Act: in 2015 it added PFAS and microplastics to the pollutant list, and in 2018 it expanded "waters of the state" to cover wetlands and groundwater. Now a factory is dumping PFAS into a wetland. The 1998 Act never says "PFAS" or "wetland" anywhere, and the 1998 committee report says the whole point was "to keep whatever new junk industry comes up with out of our water."

  My opening move: you textualists say the 1998 Act froze those definitions as they stood in 1972, so this discharge isn't covered. But that means the 1998 legislature deliberately lashed itself to a 1972 list, so the statute's reach shrinks every time the science improves and the older act gets updated — it ends up covering less and less of exactly the harm its sponsors were worried about. Reading the 1998 cross-reference as picking up the 1972 definitions as they exist from time to time is at least as natural a reading of the words, and it's the only one that doesn't turn the statute into a self-defeating antique. So why should I buy your frozen reading, other than that it conveniently lets you ignore the committee report?
reasoning: |-
  Okay, the user is preparing for a legislation seminar mock argument and has been assigned the purposivist side. They've been struggling against textualists in their study group and want to practice with a realistic opponent. The hypothetical scenario involves the Clean Streams Act of 1998 referencing definitions from the 1972 Rivers Protection Act, which has since been amended to include PFAS and wetlands. The user's opening argument challenges the textualist view that cross-references freeze definitions at enactment, arguing that this makes the statute self-defeating over time.

  The user needs a tough but fair textualist judge persona. They want the judge to stay strictly in character—dismissing legislative history, focusing on enacted text, and only conceding minor points like context or absurdity. Their frustration suggests they've encountered rigid textualist arguments that outmaneuvered their purposivist approach, so the simulated judge needs to feel authentic, not a caricature.

  The user's core argument is clever: if the 1998 legislature wanted to capture future pollutants, why tie itself to a static 1972 list? But the textualist retort must ignore that policy logic. The judge should hammer the "as given in" language as unambiguously pointing to a fixed point in time—the 1972 Act as it existed in 1998. Any "from time to time" reading would require textual evidence, like dynamic language (e.g., "as amended") which is absent here.

  The judge might test the user's absurdity exception: would excluding PFAS in wetlands truly shock the conscience? Probably not, since the textualist would argue legislatures often draft imperfect statutes, and courts aren't responsible for updating them. The user's "self-defeating antique" point is policy-based, so the judge must redirect to text: "Your frustration is with the legislature, not the interpretation. They knew how to reference future amendments when they wanted to—they didn't here."

  Key moves for the textualist:
  1. Pin the user to the exact phrase "meanings given in [1972 Act]"—no room for evolution.
  2. Contrast with statutes that explicitly reference "as amended" to show deliberate omission.
  3. Concede that context matters for ambiguity but insist there's none here.
  4. Reject committee report reliance as extra-textual.
  5. Force the user to find textual hooks for their reading, not policy appeals.
answer: |-
  *Adjusts glasses, leans forward* Counsel, your policy concerns are noted—but they're irrelevant to the interpretive task. The 1998 Act doesn't say "definitions as amended from time to time." It adopts meanings "given in" the 1972 Act. That's a backward-looking reference. When Congress ties definitions to an existing statute without temporal language, we presume it locks them in—*see* *Bruesewitz v. Wyeth* (2011). If the 1998 legislature wanted dynamic definitions, it knew how: it could have said "as amended" or pointed to the current code section. It didn’t. Your "self-defeating antique" point assumes they *intended* coverage to expand—but that’s exactly the unenacted intent you can’t prove textually. The words don’t shrink the statute; *later amendments do*. That’s the legislature’s choice, not ours. Your turn.
