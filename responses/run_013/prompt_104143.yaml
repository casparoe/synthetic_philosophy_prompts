  Therefore, the optimal strategy is to use the tip to update the prior and then predict the state with the highest posterior probability.

  In our example:

  Prior: P(A)=0.6, P(B)=0.4.

  The tip is a signal S which can be either "A" or "B", with likelihoods:
     P(S="A" | A) = 0.8, P(S="B" | A) = 0.2
