  1. The tip is free and credible (i.e., it is true information about the state of the world).
  2. The students can choose to ignore the tip and act as if they never saw it.
  3. The game is played over several rounds to emphasize the expected value (long run) versus the realized value (one-time outcome).
  4. The stakes are small (points, pride, a chocolate bar) but real enough to engage the students.

  We'll design a simple prediction game. Here's the plan:

  **Game Setup:**
  - There are two possible states of the world: A and B (e.g., two colors, two symbols, etc.). We can use a coin flip to determine the state, but we'll make it asymmetric to avoid 50-50 and to allow for interesting tips.
  - In each round, the true state is determined randomly (with known probabilities). Let's say state A occurs with probability p (say 0.6) and state B with probability 0.4.
  - Each student must predict the state. They get a reward if they predict correctly.

  **The Tip:**
  - Before each prediction, the students are offered a free tip. The tip is a signal that gives some information about the state. We want the tip to be imperfect so that sometimes it might be misleading, but on average it is helpful.
  - The tip is generated by a process that has some noise. For example, when the state is A, the tip says "A" with 80% probability and "B" with 20%. Similarly, when the state is B, the tip says "B" with 80% probability and "A" with 20%. (This is a symmetric binary channel with 0.8 accuracy.)

  **How the Tip is Offered:**
  - In each round, the tip is revealed to everyone. Then, each student independently decides to either:
     Option 1: Ignore the tip and predict the state that is more likely (i.e., always predict A, since p=0.6).
     Option 2: Use the tip and predict whatever the tip says.

  But note: the students are allowed to ignore the tip and stick to the base rate (always predict A). However, they can also use the tip. The key is that the tip is free and they are allowed to ignore it.

  **Payoff:**
  - Each correct prediction earns 1 point. Incorrect predictions earn 0.
  - We will run multiple rounds (say 10) and total points over all rounds determine the winner.

  **Why the Tip Can't Hurt (Expected Value):**
  - The expected payoff without the tip: 
     If you always predict A (the base rate strategy), your expected payoff per round is 0.6 (since A occurs 60% of the time).
  - With the tip: 
     The tip is 80% accurate. However, note that the base rate matters. We can compute the expected payoff if you follow the tip:
     - P(tip correct) = P(state=A) * P(tip=A|A) + P(state=B) * P(tip=B|B) = 0.6*0.8 + 0.4*0.8 = 0.8
     So by following the tip, you are correct 80% of the time? Wait, that seems too high. Actually, let's break it down:

     Actually, the tip is generated independently of the base rate? No, the tip depends on the state. So:
     - P(correct | using tip) = P(tip=A and state=A) + P(tip=B and state=B)
          = P(tip=A|state=A)*P(state=A) + P(tip=B|state=B)*P(state=B)
          = 0.8 * 0.6 + 0.8 * 0.4 = 0.48 + 0.32 = 0.80

     So indeed, by following the tip, you get 80% accuracy, which is higher than 60%. So the tip is beneficial.

  But wait, that doesn't illustrate the point that the tip can be ignored and hence cannot hurt. In this case, the tip is actually better than the base rate. What if the tip is sometimes misleading? We need a scenario where the tip might be misleading but the student can always fall back on the base rate.

