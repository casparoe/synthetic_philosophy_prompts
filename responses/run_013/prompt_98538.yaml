prompt: |-
  I'm a graduate student in a small reading group that mixes statistics and philosophy of science, and this term we've been circling the frequentist/Bayesian divide in the light of the replication crisis. In our last session I raised a worry about the Bayesian reanalyses of failed replication attempts: a lot of them turn on the choice of prior, and it's easy to move a Bayes factor from decisive support for the null to decisive support for the alternative just by changing a prior that nobody bothered to justify, which makes the supposed "Bayesian fix" for the replication crisis look less robust than its advocates suggest. A senior student waved this away with the familiar line — just get more data, and with enough data the prior washes out. I couldn't tell whether that was a mathematical triviality, a substantive bet about how the world happens to be, or a debating move dressed up as a theorem, and I suspect the phrase is doing several quite different jobs depending on who says it.

  What I'd like from you is a menu rather than a verdict. Lay out the distinct precise claims that "with enough data the prior washes out" could actually be making, ordered from the ones that are true almost by definition, through the ones that are substantive and defensible but only under conditions that have to be spelled out, down to the ones that are simply false or are rhetorical sleight of hand. In particular I want the readings that hinge on the fine print: what counts as "enough" and how the answer changes with sample size versus dimension; what happens under misspecification, when the model is wrong in a way that no amount of data repairs; what happens with weakly identified or unidentifiable parameters, where the likelihood is nearly flat and the prior keeps its grip however much data arrives; and the difference between a genuinely informative prior and a supposedly neutral default one. For each reading, tell me whether it is trivial, substantive, or false, and then say which of the readings would actually license the use my colleague put the phrase to — namely, dismissing my concern that prior choice can flip the conclusion of a replication reanalysis — and which would not. Keep it conceptual rather than computational: I'm not after code, a simulation, or a worked numerical example, and I don't need citations or a reading list, since I can track down the literature myself. I want a clear-eyed sorting of the readings and, at the end, a note on which one I should press him on when the group meets again, and why the others don't get him the conclusion he wanted.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a graduate reading group mixing stats and philosophy of science, focusing on the frequentist-Bayesian divide amid the replication crisis. Their specific concern is about Bayesian reanalyses of failed replications, where prior choice can flip Bayes factors, making the "Bayesian fix" seem non-robust. A senior student dismissed this by saying "just get more data, the prior washes out." The user wants a breakdown of what this phrase really means, sorted from trivial to false, and which interpretations justify dismissing their concern.

  First, I need to identify the different interpretations of "the prior washes out." The user mentioned key aspects: sample size vs dimension, misspecification, weak identification, and informative vs default priors. Let me list possible claims. 

  Starting with the most straightforward: asymptotic concentration. As n → ∞, the posterior concentrates at the true parameter value. That's mathematically true under regularity conditions. But in practice, "enough data" might be unrealistic if dimensions are high. So this is trivial mathematically but not always practical.

  Next, posterior dependence on prior diminishes with more data. True, but the rate depends on model complexity. High-dimensional models need exponentially more data. Also, in misspecified models, the prior might not wash out; the posterior goes to the point minimizing KL divergence, but prior can still influence if multiple points are equally good. 

  For Bayes factors, things get trickier. The prior doesn't wash out because it affects the marginal likelihood integral. Even with infinite data, an informative prior can dominate if the null is sharp. So claiming that the prior washes out for Bayes factors is false. This directly counters the senior student's point.

  Then there's identification. If parameters aren't identifiable, the prior doesn't wash out. That's a substantive issue, especially in complex models. Also, default priors (like Cauchy for effect sizes) can be more influential than they appear, leading to different conclusions even with data.

  The user needs to know which interpretation their colleague is using. If it's about posterior convergence, that's true but doesn't apply to Bayes factors. The colleague might be conflating posterior estimation with model comparison. The key point to press on is that for Bayes factors in replication studies, the prior choice remains crucial regardless of sample size. Highlighting the Lindley's paradox example would show how a diffuse prior can favor the null even with large n.

  Also, considering the replication crisis context, many studies have small effect sizes, so weak identification is common. A default prior might be arbitrary and sway results. The user should challenge the justification of the prior rather than accepting "get more data" as a solution.
answer: |-
  Here's a conceptual dissection of "the prior washes out," ordered from most trivial/universal to most contingent/false, with implications for your replication debate:

  ### The Menu of Interpretations

  1.  **Asymptotic Concentration (Mathematical Triviality under Ideal Conditions):**
      *   **Claim:** For a fixed, finite-dimensional, well-specified model with a true parameter value θ₀ in the interior of the parameter space and a prior assigning positive density to every neighborhood of θ₀, as n → ∞, the posterior distribution concentrates around θ₀. The influence of the *specific form* of the prior diminishes asymptotically.
      *   **Status:** **True (Trivial)**. This is Bernstein-von Mises theorem territory. The posterior converges to a point mass at θ₀ or a normal distribution centered there (depending on the statement).
      *   **"Washes Out" Meaning:** The prior's *specific shape* becomes irrelevant for *point estimation* in the infinite limit. The data dominates.
      *   **Relevance to Your Concern:** **Low**. This is about estimation *within* a model, not *comparing* models (like H₀ vs H₁) using Bayes Factors (BFs). It assumes the model (including the likelihood) is exactly correct and θ is identifiable. It says nothing about finite samples or flipping BFs.

  2.  **Diminishing Posterior Dependence (Substantive but Contingent):**
      *   **Claim:** For finite n, the posterior's dependence on the prior *decreases* as n increases. The rate depends on model complexity (dimension, intrinsic geometry) and information per datum.
      *   **Status:** **Substantive & Generally True**... *but*:
          *   *Fine Print (Dimension):* "Enough data" scales poorly with parameter dimension. For complex models (many parameters), "enough" can be astronomically large.
          *   *Fine Print (Misspecification):* If the model is wrong (which it always is), the posterior concentrates on the parameter value θ* minimizing the Kullback-Leibler divergence to the true data-generating process. The *specific prior* can still influence *which* θ* is favored if the KL minimum is not unique or lies on a boundary the prior treats differently. The prior doesn't "wash out" *completely*; it anchors the solution within the misspecified model.
          *   *Fine Print (Identification):* For weakly identified parameters (flat/substantially flat likelihood regions), the posterior remains highly prior-dependent even for large n. For unidentifiable parameters, the prior *completely* determines the posterior along the unidentified directions forever.
      *   **"Washes Out" Meaning:** The prior's influence *lessens* for estimation as n grows, but the *rate* and *asymptotic target* depend critically on model correctness and identifiability.
      *   **Relevance to Your Concern:** **Partial & Misleading if Applied Naively**. While true that prior sensitivity *decreases* for parameter estimation *within* a model as n grows, this does *not* automatically translate to model comparison via BFs. Your concern is about BFs flipping based on the prior. This claim doesn't address that.

  3.  **Bayes Factor Robustification with Default Priors (Substantive & Often Misleading):**
      *   **Claim:** Using "default" or "objective" priors (e.g., Cauchy on effect size, reference priors) makes BFs less sensitive to prior choice *for sufficiently large n*.
      *   **Status:** **Substantive & Often False in Practice**. This is where the sleight-of-hand frequently occurs.
          *   *Fine Print (BF Mechanics):* The BF integrates the likelihood *weighted by the prior*. For a sharp H₀ (δ=0) vs a diffuse H₁ (δ≠0), the BF heavily penalizes H₁ if the prior for δ under H₁ is too diffuse ("Lindley's Paradox"). Conversely, an overly concentrated prior under H₁ makes it hard for data to support H₁. **The prior's scale (not just its existence) is absolutely critical for BFs and does *not* "wash out" asymptotically.** The BF comparing two models converges to 0 or ∞ depending on which model is closer to the truth (in KL terms), but the *rate* depends drastically on the prior scales chosen within each model.
          *   *Fine Print (What's "Default"?):* Default priors (e.g., Cauchy(0,1) vs Cauchy(0, 0.707)) often have *built-in assumptions* about plausible effect sizes. Changing this scale *is* changing the substantive prior belief and dramatically changes the BF. Calling it "default" doesn't make it neutral; it hides the substantive choice.
          *   *Fine Print (n vs Scale):* You need n large *relative to the prior scale*. If the prior under H₁ is very diffuse (e.g., Cauchy(0, 1000)), it takes *enormous* n for even a moderate true effect to overcome the prior's penalty and yield a BF favoring H₁. Flip the scale to something reasonable (Cauchy(0, 0.5)), and the same data might strongly favor H₁.
      *   **"Washes Out" Meaning:** (Misapplied) That using *any* "reasonable" default prior leads to similar BFs with large n.
      *   **Relevance to Your Concern:** **Directly Counter & Core of Your Worry.** This interpretation is **False** regarding BF robustness. **This is *exactly* the scenario you described: flipping the BF by changing the prior scale (e.g., from "ultra-diffuse" to "sensible" or vice-versa), even with large n.** Lindley's Paradox explicitly shows how large n + diffuse prior can favor H₀ *more* strongly. The prior scale *does not wash out* in BFs.

  4.  **Prior Becomes Irrelevant for Bayes Factors (False):**
      *   **Claim:** With enough data, the BF is determined solely by the data and the likelihood, regardless of the prior chosen for the parameters within the models.
      *   **Status:** **False.** The BF is explicitly defined as the ratio of marginal likelihoods, each being the *average* of the likelihood over the prior. The prior defines the averaging weights. Asymptotically, the BF will favor the "better" model (in a KL sense), but the *value* of the BF, and crucially, *how much data is needed* to reach a given level of evidence, depend intrinsically on the priors within each model. Two different priors for the same alternative hypothesis H₁ will generally yield different BFs for the same data, even as n→∞, unless they happen to be equivalent in some very specific way (which "default" priors usually aren't).
      *   **"Washes Out" Meaning:** The prior becomes irrelevant for model comparison.
      *   **Relevance to Your Concern:** **Utterly False & Precisely What You're Worried About.** This claim is demonstrably incorrect and would completely invalidate your concern. Fortunately, it's also easily disproven.

  **Which Reading Licenses Dismissing Your Concern?**
  *   Only Interpretation **#4 (False: Prior Irrelevant for BFs)** would *directly* license dismissing your concern that prior choice can flip BFs in reanalyses. If the prior truly became irrelevant, your concern wouldn't exist. This is the strongest (but false) interpretation.
  *   Interpretation **#1 (Trivial: Asymptotic Concentration)** is sometimes *misapplied* to imply #4, but it only talks about estimation within a model, not model comparison. It doesn't license dismissal.
  *   Interpretation **#2 (Substantive: Diminishing Dependence)** might be *vaguely* invoked, but it explicitly addresses parameter estimation, not BF robustness. Misapplying it to BFs is fallacious. It doesn't license dismissal.
  *   Interpretation **#3 (Substantive/Often False: Robustification with Defaults)** is where your colleague likely *intended* to land, believing "default priors + large n = robust BFs." However, as argued, this is frequently false in the context of BF sensitivity to the *scale* of the prior under H₁, which is the core mechanism flipping reanalysis conclusions. It does *not* successfully dismiss your concern; it highlights why your concern is valid.

  **The Reading to Press Him On:**
  Press him firmly but politely on **Interpretation #3 (Bayes Factor Robustification with Default Priors)**, specifically the **impact of the prior scale under the alternative hypothesis (H₁) on the BF, particularly for point nulls (H₀: δ=0).**

  **Why this one?**

  1.  **Directly Addresses Your Concern:** This interpretation is central to the practical reanalysis scenario you described (flipping BFs by changing the prior). The others (#1, #2) are red herrings in the context of model comparison.
  2.  **His Likely Stance:** His dismissal ("just get more data") strongly suggests he believes using common default priors (or any "reasonable" prior) combined with sufficient data renders the BF robust. This *is* Interpretation #3.
  3.  **Demonstrably Problematic:** You can explain *conceptually* why it fails:
      *   **Lindley's Paradox:** Ask him to explain this paradox. How can *more* data make the BF favor H₀ *more* strongly against H₁ if the prior for δ under H₁ is too diffuse? This directly contradicts the idea that "more data washes out the prior" for BFs. It shows the prior *penalizes* H₁ based on its scale.
      *   **Scale Sensitivity:** Point out that the choice of scale (e.g., Cauchy(0, 0.5) vs Cauchy(0, 1.0)) embodies a *substantive belief* about the plausible range of effect sizes *before seeing the data*. Changing this scale changes the prior probability mass allocated to small, medium, and large effects, fundamentally altering the marginal likelihood calculation and thus the BF. "Getting more data" doesn't make this choice disappear; it determines how quickly evidence accumulates *given that choice*.
      *   **"Enough Data" is Relative:** Emphasize that "enough" data needed for a convincing BF depends critically on the prior scale. A diffuse prior requires vastly more data to support a real effect than a concentrated one. The prior scale sets the hurdle the data must clear.
  4.  **Philosophical Point:** Argue that labeling a prior as "default" doesn't absolve it of being a substantive choice influencing the conclusion. The replication crisis demands *transparency* and *justification* of assumptions, including prior scales, not hand-waving them away with appeals to asymptotics or defaults. A "Bayesian fix" requires responsible prior justification, not just a computational trick.

  **Why the others don't get him his conclusion:**

  *   **#1 (Asymptotic Concentration):** Talks about parameter estimation *within* a model, not comparing H₀ vs H₁ via BFs. Irrelevant to your specific worry.
  *   **#2 (Diminishing Dependence):** Also about estimation within a model. Doesn't address the core BF mechanics or Lindley's Paradox. Applying it to BFs is a category error.
  *   **#4 (Prior Irrelevant for BFs):** Is simply false. If he retreats to this, you can easily refute it by noting the BF's definition (integral of likelihood * weighted by prior*) or citing Lindley's Paradox.

  **In essence:** Your colleague's dismissal relies on misapplying the intuition from parameter estimation convergence (#1, #2) to the fundamentally different problem of Bayes Factor model comparison, or on an overly optimistic (and incorrect) view of default priors (#3). Pressing him on the sensitivity of BFs to the *scale* of the prior under the alternative hypothesis, especially in light of Lindley's Paradox, directly challenges the robustness of the "Bayesian fix" he's advocating in the context of reanalyses. The prior doesn't "wash out" in BFs; its scale *sets the rules of engagement* for the data.
