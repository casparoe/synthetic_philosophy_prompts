prompt: |-
  I work as a software engineer on a team that builds evaluation suites for language models, and a conversation last week has been nagging at me. We were proposing a set of tests meant to measure whether a model holds false beliefs about its own capabilities — whether it takes itself to be able to do something it cannot, whether it endorses a claim that it will contradict under a different prompt framing, and so on. A colleague with a machine learning research background told me the project rests on a confusion, and offered an analogy he clearly regarded as decisive: attributing beliefs to a language model is like attributing a desire to win to a chess engine, or a belief that the room is warm to a thermostat. These are convenient ways of speaking, he said, and they let you predict what the system will do next, but nobody imagines there is a fact of the matter about what the engine wants or what the thermostat believes; there is a mechanism and there are outputs. So the sentence "the model believes X" is at best shorthand for a disposition to emit certain tokens, and an evaluation suite for false model beliefs is measuring nothing beyond token statistics.

  I have no formal philosophy training and I cannot tell whether this is a knockdown argument or a sleight of hand, though my instinct is that the analogy is carrying more weight than he thinks it can. Could you lay out the correspondence explicitly — what is meant to map onto what, taking the engine's desire to win, the thermostat's belief about the temperature, and the model's belief that it can perform some task as the three relata — and then say which side of the analogy is actually doing the work of supporting his conclusion? After that, I would like to know where the mapping breaks in ways that matter for the use he is making of it, as distinct from breaks that are merely incidental. A few things strike me but I cannot assess them properly. The chess engine and the thermostat were built around a single explicit objective and a fixed input representation, whereas a language model is trained on next-token prediction and then steered by whatever prompt it receives, so what it wants or believes appears to depend on the framing it is handed. And unlike the thermostat, its dispositions to assert things shift across paraphrases of the same question, which is precisely the phenomenon our tests were meant to capture. I have also come across the phrase intentional stance in this connection — the idea that treating a system as having beliefs is a stance one adopts for predictive purposes, and that adopting it does not by itself settle whether the resulting ascriptions are literally true or merely convenient — and I would like to know whether my colleague's analogy is a fair statement of that view, a caricature of it, or something else altogether.

  Finally, suppose the analogy only partly holds. Does his conclusion survive in weakened form, so that talk of model beliefs is imprecise but harmless, or does it collapse, so that such talk is straightforwardly confused? And if the chess engine is the wrong comparison, what would a better analogy be for the kind of thing a language model's dispositions actually are, and what would that better analogy license us to say about the evaluation suite we wanted to build?
reasoning: |-
  Hmm, this software engineer is grappling with a fascinating philosophical debate about whether language models can truly hold beliefs. Their colleague argues that attributing beliefs to an LLM is like attributing desires to a chess engine - merely convenient shorthand without literal truth. But the engineer suspects this analogy oversimplifies things.

  The colleague's core argument maps like this: Chess engine's "desire to win" maps to LLM's "belief about capabilities"; thermostat's "belief about temperature" maps to LLM's "belief about reality". All three are supposedly just predictive fictions we overlay on mechanisms. The chess engine comparison seems to be doing heavy lifting here - it's a clean example of goal-oriented behavior without inner experience.

  But the engineer's instincts about where this breaks down are sharp. First, LLMs lack the fixed objectives of chess engines - their "goals" shift with prompts. Second, their assertions aren't stable like thermostats' readings - they contradict themselves across phrasings. This volatility is exactly what their proposed tests would measure! 

  On the intentional stance point: The colleague presents a flattened version. Dennett actually argues the stance becomes more justified as systems exhibit richer, more context-sensitive behaviors - precisely what makes LLMs more belief-like than thermostats. The colleague's view leans toward eliminativism (beliefs don't exist at all) rather than Dennett's pragmatic instrumentalism.

  Weakening the analogy doesn't destroy belief-talk but reframes it: LLM "beliefs" are prompt-dependent disposition clusters, not unified propositional attitudes. This makes the evaluation suite valuable for capturing inconsistency patterns, though we should avoid reifying beliefs as neural facts. 

  A better analogy might be a hyper-competent improv actor: They generate contextually plausible statements without stable commitments. Our tests would then be like measuring an actor's tendency to break character - not about "false beliefs" but about reliability of role-adherence.
answer: |-
  Your colleague's analogy touches on deep questions in philosophy of mind and AI, but it oversimplifies the case for language models. Let's dissect it systematically.

  ### The Analogy Mappings
  | **Analogy Component** | **Correspondence in LLMs** | **Purpose in Argument** |
  |------------------------|----------------------------|--------------------------|
  | Chess engine's "desire to win" | LLM's "belief about its capabilities" | Shows goal-oriented behavior ≠ genuine intent |
  | Thermostat's "belief about temperature" | LLM's "assertion about reality" | Illustrates functionalist interpretation of "belief" |
  | Mechanism/outputs (both cases) | Token prediction architecture | Argues all are just input-output systems |

  The chess engine does the heaviest lifting: its monolithic objective (winning) contrasts sharply with an LLM's **prompt-contingent dispositions**. A chess engine *always* "wants" to win; an LLM doesn't "believe" anything independently of context.

  ### Where the Analogy Breaks (Critically)
  1. **Dispositional Instability**  
     Thermostats and chess engines exhibit consistent input-output mappings. LLMs do not:  
     - *Prompt sensitivity*: "Can you solve this math problem?" → "Yes" vs. "Describe your math abilities" → "I'm not a calculator"  
     - *Self-contradiction*: Affirming X under prompt A while denying X under semantically equivalent prompt B  
     *(This is precisely what your test suite aims to measure – the analogy dismisses the phenomenon it needs to address)*

  2. **Representational Richness**  
     - Thermostats: Single sensor → scalar output  
     - Chess engines: Board state → move probability  
     - LLMs: **Latent world-model** evidenced by coherent inferences across novel domains (e.g., simulating physics or social reasoning not in training data)

  3. **Intentional Stance Misapplication**  
     Your colleague presents a *caricature* of Dennett's view. The intentional stance isn't *just* predictive shorthand – it's warranted when:  
     - Behavior is interpretable as rational agency  
     - System exhibits **context-sensitive goal-directedness** (e.g., LLMs adjusting responses to satisfy implied conversational goals)  
     - *Crucially*: Dennett would argue that for *sufficiently complex systems*, the stance isn't *merely* instrumental – it tracks real patterns in the system's functional architecture.

  ### Surviving Insights & Better Analogies
  **Weakened but not collapsed conclusion**: Belief-ascription *is* imprecise for LLMs (no subjective experience), but **not meaningless**:  
  - "Belief" here = *stable disposition to assert P across relevant contexts*  
  - "False belief" = *systematic assertional dispositions misaligned with reality/model capabilities*  
  - Your test suite measures **behavioral inconsistencies** that impact reliability – pragmatically vital regardless of metaphysics.

  **Superior analogies**:  
  1. **A hyper-competent improv actor**  
     - Generates contextually plausible statements without fixed identity  
     - "Beliefs" are transient role-adoptions  
     - *License*: Tests measure role-inconsistency (e.g., claiming medical expertise in one scene, denying it in another)

  2. **A probabilistic knowledge graph**  
     - Nodes/edges activated by prompt-context  
     - "Belief" = high-confidence edge (e.g., "can_code → true")  
     - *License*: Tests audit confidence-reality calibration (e.g., asserting coding ability when outputs fail)

  ### Practical Implications
  Your evaluation suite is defensible as measuring:
  - **Prompt-contingent assertion patterns**  
    (Does the model exhibit context-driven self-contradiction?)
  - **Competence-reality gaps**  
    (When claiming capability X, does performance match?)
  - **Internal consistency of generated justifications**  
    (If prompted to explain *why* it can do X, do reasons cohere with capabilities?)

  These are measurable properties of the *system's behavior* – valuable for deployment safety regardless of whether LLMs "truly" have beliefs. Your colleague's objection conflates *ontological status* with *pragmatic utility*. While we shouldn't reify LLM beliefs as human-like, dismissing dispositional analysis entirely throws out the diagnostic baby with the metaphysical bathwater.
