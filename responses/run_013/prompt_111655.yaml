prompt: |-
  I'm putting together a unit for a seminar on promises and contracts, and I keep running into the same problem: every account of why promises bind seems to be built to handle two or three pet cases and then quietly ignores everything else. My brother-in-law, who does commercial law, insists none of this matters because consideration does all the work, which is exactly the kind of thing I need a proper spec to adjudicate. So before I make the students read any more of these accounts, I want the desiderata first. Not a survey and not who-said-what: the requirements themselves, each with the case or consideration that puts it on the list, and for each one your call on whether it's non-negotiable or just a house preferance of some camp. Assume the thing has to be good enough that I can actually use it to decide a hard case in class without hand-waving, and that it's a theory of promising specifically, not of obligation in general.

  Here's the sort of thing I expect on the list, though add what I've missed and cut what's just prejudice. It has to explain how a few words can manufacture a reason where none existed — the bootstrapping trick — without also licensing me to obligate other people by fiat, and it has to say what promising does that contracts, gratitude, role obligations, and merely causing someone to rely on me don't already do. It has to handle the promise the promisee never learns about, doesn't rely on, or wouldn't have cared about; the vague or open-ended promise, like telling a friend at a wedding that I'll always be there for them, and the deliberately blank promise where I agree now to do whatever is asked of me later; the promise to someone who's since died, the promise to my future self, and the promise made to a group rather than to any particular person; the promise extracted by a threat and the promise to do something plainly wrong; and release — why only the promisee can let me off the hook, and whether a release given under pressure leaves any residue behind. I want it to be honest about whether it's a theory of a social practice, so that the bindingness is contingent on the practice being around, or of something that would bind even in a society with no such practice. And it should say what happens to a promise made on your behalf — say your assistant, human or otherwise, tells a colleague you'll have the draft by Friday and you never agreed to anything. Finally it has to locate the wrong where the wrong is: when I break a promise, the promisee seems to have a special standing to resent it and not just a reason to be disappointed, and the theory should earn that rather than assume it.

  Then flag the collisions — the places where two items on your list can't both be had, or where satisfying one quietly makes another trivial. My own suspicion is that the bootstrapping requirement and the standing requirement pull against each other, and that anything grounding promising in the value of reliance is going to be embarrassed by the promisee-who-doesn't-care case, but tell me where I'm wrong. Skip the scorecard of the usual suspects at the end; I'd rather you spend the words on which single requirement does the most to eliminate candidates, and why.
reasoning: |-
  Okay, the user is putting together a seminar unit on promises and contracts and is frustrated with existing accounts that only handle a few cases. They want a solid list of desiderata for a theory of promising, each with the case that necessitates it, and whether it's non-negotiable. They also want to know where these requirements conflict. 

  First, I need to unpack their request. They mentioned specific cases: promises not learned about, vague promises, promises to the dead, etc. They also want the theory to distinguish promises from contracts, gratitude, reliance, etc. Plus, issues like bootstrapping obligations, wrongness location, and social practice contingency. 

  The user’s deeper need seems to be a robust framework to critically evaluate theories in class, avoiding hand-waving. They want students to engage with hard cases upfront. The brother-in-law’s point about consideration in commercial law hints at the gap between philosophical theories and legal practice, so the desiderata must address that tension.

  Now, listing out all the desiderata. Start with the bootstrapping trick—how promises create obligations ex nihilo but without binding others arbitrarily. Cases like trivial promises (e.g., texting "I'll call at 3") show the need for bootstrapping. Non-negotiable because core to promising.

  Next, demarcation. Promises must be distinct from contracts (consideration), gratitude, reliance, roles. Cases like promising not to sue (no consideration) or vague promises ("I'll be there for you") that aren't contractual. Non-negotiable to avoid collapsing categories.

  Then, the promisee-agnostic cases. Promises unknown (letter never received), unrelied upon (promisee indifferent), or not cared about (promise to do something trivial for someone who doesn't mind). Tests reliance theories. Non-negotiable as it challenges instrumental justifications.

  Structural flexibility: vague/open promises ("always be there"), blank-check promises ("I'll do whatever you ask later"). Tests if the theory handles indeterminacy. Non-negotiable for real-world applicability.

  Boundary cases: promises to the dead (e.g., deathbed promise), to future self, to groups (e.g., team promise). Challenges the bilateral assumption. Non-negotiable to cover all promise types.

  Coercion and immorality: promises under threat or to do wrong. Should the obligation hold? Coercion might void it, but immorality shouldn't override (e.g., promise to help cover a crime). Non-negotiable for moral complexity.

  Release dynamics: only promisee can release, and whether coerced release leaves residue. Tests obligation's relational nature. Non-negotiable for understanding autonomy.

  Social ontology: is promising practice-dependent? Cases like Robinson Crusoe promising to himself in isolation. Non-negotiable for foundational theories.

  Agency: promises made by assistants without authorization. Should the promisor be bound? Tests the role of intent. Non-negotiable for real-world applications.

  Moral residue: when breaking a promise, the promisee has standing to resent, not just be disappointed. E.g., breaking a lunch date vs. someone else being upset. Non-negotiable for the interpersonal wrong.

  Now, conflicts. Bootstrapping vs. Standing: bootstrapping focuses on obligation creation, standing on the promisee's right to hold accountable. Instrumental theories (reliance) struggle with promisee-agnostic cases. Social practice vs. Moral Residue: if practice-dependent, resentment might not hold in non-practice contexts. Also, demarcation vs. structural flexibility—contract-like precision vs. vague promises.

  The most eliminative requirement is the promisee-agnostic one. It immediately rules out reliance-based theories since they require reliance to generate obligation. This is a big deal because many theories (e.g., Scanlon) rely on reliance, which fails here. That's why it's the killer criterion.
answer: |-
  Here's a distilled list of desiderata for a theory of promising, derived from the hard cases you outlined. Each includes the motivating case(s), a judgment on negotiability, and an explanation of its significance. Collisions are flagged at the end.

  ### Core Desiderata (Non-Negotiable)

  1.  **The Bootstrapping Requirement:**
      *   **Case:** Trivial promises (e.g., "I'll call you at 3pm").
      *   **Why Non-Negotiable:** The essence of promising is creating a new, content-dependent obligation through utterance alone. Must explain *how* words create a reason "ex nihilo" without collapsing into magic or permitting obligation of others by fiat (e.g., "I promise *you* will pay me $100" fails).
      *   **Significance:** Eliminates theories where obligation depends solely on pre-existing moral duties or the inherent value of the act promised.

  2.  **The Demarcation Requirement:**
      *   **Cases:** Distinguishing promises from (a) Contracts with consideration (brother-in-law's point), (b) Gratitude for past favors, (c) Role obligations (e.g., parental duty), (d) Causing reliance (e.g., stating an intention that someone reasonably relies on).
      *   **Why Non-Negotiable:** Promising must have a distinct normative structure. If it collapses into one of these, the practice loses its unique function and the brother-in-law's "consideration does all the work" claim gains traction.
      *   **Significance:** Forces the theory to isolate the specific "promissory mechanism" beyond expectation, benefit, or social role.

  3.  **The Promisee-Agnostic Bindingness Requirement:**
      *   **Cases:** (a) Promise never learned (letter lost in mail), (b) Promise not relied upon (promisee forgot/didn't care), (c) Promise not cared about (promisee genuinely indifferent to performance).
      *   **Why Non-Negotiable:** If the obligation vanishes in these cases, it suggests the obligation stems *only* from the promisee's psychological state (reliance, expectation, desire), not the promisor's act. These cases show the obligation persists independently.
      *   **Significance:** The "killer" requirement. Instantly eliminates reliance-based theories (e.g., early Atiyah, some law-and-economics) and expectation-damage theories. Most eliminative criterion.

  4.  **The Structural Flexibility Requirement:**
      *   **Cases:** (a) Vague/Open-Ended Promises ("I'll always be there for you"), (b) Blank-Check Promises ("I promise to do whatever task you assign me next month").
      *   **Why Non-Negotiable:** These are common, recognizable promises. A theory must explain how an obligation exists despite lacking precise content at inception. It can't demand contractual specificity.
      *   **Significance:** Challenges theories requiring determinate acts or immediate mutual understanding of exact terms. Favors theories focusing on commitment over specific content.

  5.  **The Boundary Cases Requirement:**
      *   **Cases:** (a) Promise to someone now dead, (b) Promise to one's future self ("I promise myself I'll quit smoking"), (c) Promise to a group ("I promise the team I'll be on time").
      *   **Why Non-Negotiable:** Tests the bilateral, interpersonal nature of promising. Must explain who the obligation is *to* and why it persists (or dissolves) in these cases. Can't arbitrarily exclude them.
      *   **Significance:** Challenges theories requiring an extant, specific, rights-holding promisee capable of release at the moment of breach.

  6.  **The Coercion & Immorality Requirement:**
      *   **Cases:** (a) Promise extracted by threat ("Your money or your life!"), (b) Promise to do something immoral (e.g., "I promise to help you cover up the crime").
      *   **Why Non-Negotiable:** Tests the *prima facie* force of the promissory obligation against defeater conditions. Must explain why coercion *often* voids the obligation (or creates a defeasible one), while immorality *does not* automatically negate the fact that a promise was made and creates a pro-tanto obligation (even if decisively overridden).
      *   **Significance:** Reveals if the theory sees promissory obligation as inherently moral or as a distinct normative artifact that interacts with morality.

  7.  **The Release Dynamics Requirement:**
      *   **Cases:** (a) Why only the promisee (or their heir/assign) can release the obligation? (b) Does a release given under duress (e.g., "I release you" said under threat) leave a "moral residue" obligation?
      *   **Why Non-Negotiable:** Central to the relational nature of the obligation. The power of release uniquely held by the promisee is a defining feature. Duress tests the resilience of the release and the nature of the original obligation.
      *   **Significance:** Challenges theories where the obligation is primarily to society or oneself. Tests if the obligation is truly extinguished by release or merely waived.

  8.  **The Moral Residue & Standing Requirement:**
      *   **Case:** When a promise is broken, the promisee has a distinctive *standing* to resent it personally, distinct from others who might be disappointed or harmed (e.g., breaking a lunch date – colleague might be annoyed, promisee is *wronged*).
      *   **Why Non-Negotiable:** This captures the core interpersonal wrong. The promisee isn't just harmed; they are the *victim of a specific wrong done to them*. The theory must generate this directed duty and correlative right.
      *   **Significance:** Eliminates theories that only generate general duties (e.g., "duty to keep one's word to society") without directed obligations *to the promisee*.

  9.  **The Agency Requirement:**
      *   **Case:** An assistant (human or AI) tells a colleague "The boss promises the draft by Friday," without the principal's knowledge or consent.
      *   **Why Non-Negotiable:** Tests the role of the promisor's *own* commitment and intent. When is an obligation *imputed* to the principal? This is crucial for real-world application.
      *   **Significance:** Challenges theories relying solely on expectation/reliance in the promisee (which might bind the principal here) versus theories requiring the principal's own promissory act.

  ### Contingent Desideratum (Debateable Foundation)

  10. **The Social Ontology Requirement:**
      *   **Case:** Would a promise bind in a society with *no* social practice of promising? (Robinson Crusoe promising to his future self? Two individuals with no shared concept?).
      *   **Why Contingent:** This divides "practice-based" theories (e.g., Rawls, Searle - bindingness contingent on the practice existing and being upheld) from "non-practice" theories (e.g., natural duty, autonomy-based - bindingness stems directly from the act/commitment itself).
      *   **Significance:** Not strictly non-negotiable for a functional theory *within* our practice, but profoundly shapes the *kind* of explanation offered. Must be explicitly addressed.

  ---

  ### Key Collisions & Tensions

  1.  **Bootstrapping vs. Moral Residue/Standing:**
      *   **Conflict:** Theories strong on bootstrapping (e.g., simple consent/autonomy: "I bound myself") often struggle to explain the *directed* nature of the duty *to the promisee* and their unique standing to resent. Why is the wrong *to them* specifically, not just a violation of self-imposed duty? Conversely, theories grounding standing in the promisee's vulnerability or conferred right (stronger on Moral Residue) need to explain how the promisee's status *alone* (without reliance, etc.) creates the *reason* for the promisor (Bootstrapping).

  2.  **Promisee-Agnostic Bindingness vs. Reliance-Based Theories:**
      *   **Conflict:** This is the most direct collision. The Promisee-Agnostic requirement (obligation persists even if promisee doesn't know, rely, or care) is **fatal** to pure reliance-based theories. They *cannot* satisfy it without abandoning their core mechanism. This requirement decisively eliminates them.

  3.  **Structural Flexibility (Vague Promises) vs. Demarcation (vs. Contracts):**
      *   **Conflict:** Emphasizing the flexibility and non-contractual nature of promises risks blurring the line with mere statements of intent or assurances. How does "I'll always be there" differ meaningfully from a strong expression of commitment without the promissory force? Theories need a mechanism that captures the obligation in vagueness without collapsing into unenforceable sentiment.

  4.  **Boundary Cases (Promises to Dead/Group/Self) vs. Release Dynamics:**
      *   **Conflict:** If a promise to the dead binds, who has the power of release? If a promise to a group binds, is release unanimous? If a promise to one's future self binds, how is release possible? Theories strong on Boundary Cases often need to stretch or modify the concept of "promisee" and "release," potentially weakening the core bilateral model implied by Release Dynamics.

  5.  **Social Ontology vs. Bootstrapping/Moral Residue:**
      *   **Conflict:** If bindingness *requires* a social practice (Social Ontology), does this undermine the apparent immediacy and personal nature of the obligation created (Bootstrapping) and the specific wrong *to the promisee* (Moral Residue)? Does the practice explain the *form*, or is it the very *source* of the obligation? A robust practice theory needs to show how the practice generates the specific interpersonal normativity.

  **Your Suspicion Confirmed:** Your intuition about **Bootstrapping vs. Standing (Moral Residue)** is correct. Explaining *how* words create a reason (Bootstrapping) is logically distinct from explaining *why* that reason constitutes a wrong *to a specific person* (Standing). Many theories excel at one but struggle with the other. The **Promisee-Agnostic Bindingness Requirement** is indeed the most potent eliminator, immediately disqualifying any theory where the obligation is parasitic on the promisee's reliance, expectation, or desire. This requirement alone forces a fundamental shift away from instrumental justifications and towards theories focusing on the promisor's act of commitment itself or the inherent structure of the promissory relation.

  This list provides the critical framework. Any credible theory must explicitly navigate these requirements and their tensions; failure on a non-negotiable item is fatal. Presenting these *first* arms students to dissect the readings with a clear, shared set of benchmarks.
