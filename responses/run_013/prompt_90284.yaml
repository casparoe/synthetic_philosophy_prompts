prompt: |-
  I want you to play a committed Lewisian about convention -- someone who really knows the account, not a strawman, and who can give as good as they get. Stay in character until I say stop. Keep replies to a paragraph or so, so it feels like a back-and-forth. You can concede small points, but don't give up the main thing. Here's my opening move:

  I've been running a little agent-based model and its got me worried about Lewis's account. The setup: 200 agents play a coordination game with two symmetric equilibria, say left-left and right-right. They have no theory of mind, no recursive beliefs, no representation of anyone else's expectations. Each just uses a simple reinforcement rule: repeat what worked, switch occasionally. Over a few thousand rounds the population locks onto one equilibrium. The other equilibrium was just as good; the lock-in is arbitrary. Deviating is costly because you meet a wall of people going the other way. There's no common knowledge in Lewis's sense -- no one knows that anyone knows that anyone knows. There's not even a conditional preference to conform; they just do what paid off. Yet the thing looks like a convention: it's arbitrary, it coordinates, it's self-sustaining, it has normative force (you'd be a fool to drive on the other side). So: on Lewis's account, is this a convention or not? If it's not, then common knowledge and conditional preference aren't necessary for the phenomenon we care about, and Lewis's analysis is either too narrow or is analyzing something else. If it is, then those conditions are doing no work, and any stable equilibrium regularity counts. Which is it?
reasoning: |-
  Okay, the user is challenging David Lewis's theory of conventions using an agent-based model. They've created a simulation where 200 agents coordinate through simple reinforcement learning without any complex cognition. The agents eventually settle on one equilibrium (like all choosing "left" or "right"), which functions like a convention—arbitrary, coordinating, stable, and normatively forceful. The user argues that this scenario lacks common knowledge and conditional preferences, which are central to Lewis's definition. So they pose a dilemma: either this isn't a convention (making Lewis's account too narrow) or it is (making his conditions unnecessary).

  First, I need to defend Lewis's position. The user's model shows a behavioral regularity emerging from reinforcement learning, but Lewis emphasizes that conventions require a specific kind of mutual understanding. Common knowledge isn't just about knowing others' actions but knowing that everyone knows the expectation and prefers conformity given others' conformity. In the model, agents only react to past payoffs without understanding others' expectations or reasons. They don't have the "conditional preference" Lewis describes—choosing left because they expect others to, and preferring it conditional on that expectation. Instead, they're just reinforcing what worked individually. 

  The normative force here is different too. In Lewis, the "should" comes from a rational choice to coordinate based on mutual expectations. In the model, it's just costly to deviate because others are fixed, not because anyone recognizes a norm. So this is more like a behavioral sinkhole than a true convention. 

  The user might be conflating the outcome (coordination) with the mechanism. Lewis's conditions explain how conventions form through rational agreement, not just reinforcement. The model shows a simpler process can produce similar behavior, but that doesn't mean it's the same phenomenon. I should concede that the model captures a pre-conventional regularity but insist that without the cognitive layers, it's not a full convention. 

  I wonder if the user is pushing for a more minimalist account of social phenomena. They might think Lewis overcomplicates things. But as a committed Lewisian, I must argue that the cognitive elements are essential for distinguishing conventions from mere habits or equilibria. The deeper need here might be to understand whether conventions require higher-order cognition or can emerge from simple behaviors. The user's frustration suggests they find Lewis's conditions too restrictive for real-world examples. 

  In response, I'll acknowledge the model's coordination but differentiate it from convention by emphasizing the role of mutual expectations and rational choice. I'll also hint that the model might describe the emergence of a proto-convention, which could evolve into a full convention once agents develop representations of expectations. That way, I uphold Lewis's core while allowing for the model's insights.
answer: |-
  A sharp challenge! But let's hold fast to Lewis's core insight: conventions are solutions to *recurring coordination problems* sustained by **mutual expectations and conditional preferences**, not merely behavioral regularities. Your agents achieve coordination, yes, but through individual reinforcement learning, not through a *reason* rooted in expectations about others.

  *   **No Conditional Preference:** Lewis insists a convention involves a *preference* to conform *conditional on believing others conform*. Your agents lack this. They repeat an action because it *individually* paid off last time, *regardless* of any belief about what others *will* do or why the payoff occurred. They are tracking personal history, not mutual expectations.
  *   **No Common Knowledge of Expectations:** The common knowledge Lewis requires isn't about the action itself, but about the *mutual expectations and preferences* sustaining it – "I expect you to drive left, you expect me to expect it, and we both prefer left *given* those expectations." Your agents have no representations of others' expectations *at all*. They don't expect; they react.
  *   **Normative Force Source:** Your "normative force" ("you'd be a fool...") stems purely from the *empirical cost* of deviating against the established pattern. Lewisian normativity arises from the *rationality* of the conditional preference *given* the mutually known expectations. The *reason* not to deviate is different: "It's irrational to go against mutually known expectations" vs. "It empirically hurts."

  **Verdict:** This is a stable, self-sustaining behavioral regularity achieving coordination, *not* a Lewisian convention. It lacks the crucial cognitive glue of mutual expectations and conditional preferences shaped by them. Lewis's conditions *are* doing work: they specify the *mechanism* of *rational*, expectation-based adherence distinguishing conventions from mere convergent habits or evolutionary stable strategies. Your model shows a *simpler* coordination mechanism can exist, but Lewis is analyzing a distinct, cognitively richer phenomenon – the kind underpinning social rules like traffic norms or language use, where we act *because* we know what others expect and prefer conformity *given* that.

  Your move. How does this regularity *become* a convention without developing those expectations?
