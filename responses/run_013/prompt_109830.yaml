  Abandoning the independence axiom is another point. Keynes valued rational constraints like coherence, which independence supports. REU's flexibility for Allais-type choices might seem appealing, but Keynes would likely view it as irrational preference reversal, not a valid exception.

  Keynes might salvage the idea that probabilities aren't always additive or numerical. REU's non-linear weighting could resonate with his non-numerical probabilities. But the psychological basis of the risk function would still be problematic. He'd want to reframe it evidentially, perhaps linking risk attitudes to weight-mediated confidence.

