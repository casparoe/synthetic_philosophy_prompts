  ## Keynes's Verdict on Risk-Weighted Expected Utility: A Firm Rejection

  Based on a close reading of Keynes's *A Treatise on Probability* and the core tenets of risk-weighted expected utility (REU) theory, I firmly predict Keynes would reject REU as a *vindication* of his concept of weight and see it, instead, as a profound *travesty* of that concept and his broader philosophical project. While he might acknowledge REU as a descriptive tool, its fundamental underpinnings clash irreconcilably with his logical, evidence-based theory of probability and rationality. Here's why:

  1.  **The Fatal Flaw: Evidence vs. Psychology:** Keynes's core objection would center on the ontological status of the risk function. For Keynes, **weight** is an **objective, epistemic property** of the *evidence relation* supporting a probability proposition. It measures the "balance of the absolute amounts of relevant knowledge and relevant ignorance" (*TP*, Ch. VI). A low weight signifies a genuine deficiency in the evidence base, making the numerical probability (if it can even be assigned) less reliable or "precarious." Crucially, weight is **not a psychological attitude**; it's a logical feature of the argument itself. An agent *ought* to be less confident in a low-weight probability, regardless of their personal feelings about risk.

      In stark contrast, the REU **risk function** is explicitly a **subjective, psychological primitive** characterizing the agent's inherent *attitude* towards uncertainty itself. It's a free parameter hung on the agent's disposition, not derived from or responsive to the structure of the evidence. A convex risk function doesn't reflect *poor evidence* for the probability estimates; it reflects an intrinsic *fear of bad outcomes*, even when the probabilities are well-established and high-weight. Keynes would see this as conflating an objective epistemic limitation (weight) with a subjective psychological quirk (risk aversion). This is not a formalization of weight; it's its antithesis. Weight concerns the *grounds* for belief; the risk function concerns the *emotional response* to belief once formed.

  2.  **Rank-Dependence and Evidential Structure:** Keynes would find the REU's **rank-dependent weighting** mechanism technically alien to his concept of weight. Weight applies to the *probability proposition itself* – the relation between the hypothesis and the entire body of evidence. It doesn't inherently depend on the *ordering of outcomes* or the *cumulative distribution* in the way REU requires. Weight affects confidence in the *whole probability judgement*, not selectively amplifying the impact of worse outcomes within a prospect based on their rank. For Keynes, low weight makes the entire probability estimate more uncertain; it doesn't systematically skew deliberation towards the worst-case scenario independent of the evidence structure. REU's focus on outcome ranking and cumulative probabilities treats the *consequences* as primary, whereas Keynes's weight is fundamentally about the *evidential support* for the *probabilities* of those consequences.

  3.  **Risk Attitude as Primitive: Undermining Rationality:** Keynes viewed rational belief and action as constrained by the logical relations of probability. While he acknowledged non-numerical probabilities and the role of "conventional judgement" in complex situations, he believed rationality involved striving for the best possible logical grounds. Treating **risk attitude as a fundamental primitive**, unrelated to the evidence, would strike him as abandoning the project of *rational* decision-making under uncertainty. It elevates an unexplained psychological disposition to the same foundational status as utility (which, for Keynes, also had an objective element related to goodness). This move renders the decision calculus inherently subjective in a way Keynes sought to transcend. He aimed for a logic of partial belief, not a catalog of psychological profiles.

  4.  **Abandoning Independence: Embracing Incoherence?** Keynes would likely view the **abandonment of the independence axiom** as a major step backward, not a liberation. While he didn't explicitly formulate the independence axiom, his entire theory of probability rests on principles of logical coherence and consistency in partial belief. The Sure-Thing Principle (STP) is a powerful expression of such coherence: if two acts agree on the consequences in certain states, the preference between them should depend only on where they differ. Allais-type violations, for Keynes, wouldn't signal a *legitimate* sensitivity to risk structure unaccounted for by EU; they would likely signal either:
      *   A **failure to correctly perceive or apply the logical probabilities** due to the complexity or framing of the choice (a cognitive limitation).
      *   The presence of **non-consequentialist factors** (like regret or elation) that Keynes might argue *shouldn't* influence a purely rational evaluation based on probable consequences.
      *   Crucially, a manifestation of **low weight**: if the probabilities involved in the common branches are perceived as highly uncertain (low weight), an agent *rationally* might not treat them as "sure things," potentially explaining the violation *without* abandoning coherence for well-defined probabilities. REU's solution – building in a psychological distortion of probabilities via the risk function – would seem to Keynes like replacing a demand for logical consistency with an ad hoc psychological fudge factor. He valued axiomatic structure as a guard against irrationality; REU's flexibility, to him, would look like license for incoherence.

  **What Keynes Might Salvage (Minimally):**

  Keynes wouldn't dismiss REU entirely. He might grant it value as a *descriptive* model capturing how people *actually* deviate from logical probability and coherent EU maximization, especially under stress or with complex prospects. He might even concede that the *mathematical form* of rank-dependent weighting loosely *resembles* the effect low weight *can* have on confidence – making agents behave *as if* they were overweighting bad outcomes due to evidential poverty. However, he would vehemently deny that this resemblance makes the risk function a formalization of weight. The resemblance is superficial and based on entirely different foundations: evidence poverty vs. inherent psychological disposition.

  Furthermore, Keynes might find a sliver of common ground in REU's implicit **rejection of simple numerical probability-weighted sums as universally adequate**. His insistence on non-numerical probabilities and the limitations of the additive model aligns with the idea that aggregating uncertainty isn't always straightforward. However, he would attribute the inadequacy to the *logical incompleteness* of the evidence and the resulting non-quantifiability or low weight, *not* to a free-floating psychological risk parameter distorting well-defined probabilities.

  **Conclusion:**

  Keynes would see REU not as a formal vindication of weight, but as a category error. Weight is an objective feature of the evidential landscape; the risk function is a subjective feature of the agent's psyche. REU's rank-dependent weighting, its elevation of psychological risk attitude to a primitive, and its abandonment of the independence axiom all stem from this fundamental confusion. These moves prioritize descriptive psychological realism over Keynes's normative ideal of logical, evidence-based rationality under partial knowledge. While he might grant REU descriptive utility, he would judge it a philosophical travesty of his core concept of weight and a retreat from the project of defining rational belief and action grounded in the logical relations of probability. His verdict would be a firm rejection of REU's foundational premises.
