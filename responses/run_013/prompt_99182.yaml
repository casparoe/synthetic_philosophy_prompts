prompt: |-
  I want a credence, not a survey. Take this proposition, which I mean to have a truth value: the transformative effects of a general-purpose information technology are driven mainly by what it does to verification -- who can check a claim against what -- and only derivatively by what it does to production, that is, who can make and distribute content. Assess it against the printing press, against broadcast media, and against AI systems that generate text and images, and give me your probability that it is true, decomposed into the sub-questions the number actually rests on. I suggest at least these terms: (a) whether production and verification can be separated cleanly enough for the proposition to be well-posed, or whether every change in one is a change in the other; (b) whether the printing-press case really supports the verification reading once you ask what changed first -- cheap copies, or cheap cross-checking against a fixed text; (c) whether broadcast media, which centralized production while leaving verification largely unreconstructed, counts against the proposition or merely shows the two channels can come apart; (d) whether the nuclear case, where detecting tests was the pivotal informational problem while production stayed with a handful of states, is better read as supporting or undermining the claim. Give each term a number and one line of justification, show how they combine into the final figure, name the term you are least confident in, and say what single argument or piece of evidence would move the final number most -- including whether your number for AI specifically comes out higher or lower than your number for the proposition as stated.
