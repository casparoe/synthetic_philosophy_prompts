prompt: |-
  I write about science and ideas for a living, which means that once or twice a year I get invited to do something I'm not really qualified for, and this year it's a 90-minute session for a graduate reading group in the philosophy department near me, about 14 students, and the topic they've asked for is causation by omission. What I don't want is a lecture, partly because they know the literature better than I do and partly because I think the whole thing is easier to feel than to explain. What I want is a runnable activity where the group manages to cause a harm by doing nothing, and then has to fight about who did it, so that by the end they've been pulled in two directions at once. First pull: of course the people who sat there caused it, look at what they didn't do, you can't tell me the silence didn't kill the fish. Second pull, and this is the one I care about most: the instant you accept that, the list of causes explodes — everyone who could of acted, everyone who was asleep, the person who set the schedule, the committee that cut the budget, the guy who talked his colleague out of coming in that night — and there's no principled place to stop. I want them to feel that the only reason the list doesn't explode in ordinary life is that we're quietly leaning on norms (duties, roles, who was supposed to be doing what), and that those norms are doing work we usually credit to causation itself.

  A few things I'd like baked in, though design around them however you think best. Stage it as some kind of operations room with real roles and real asymmetry of information — I keep picturing a water utility at 2 a.m., but pick whatever gives you the cleanest incentive structure. The rules have to make the harm come genuinely from inaction: waiting has to be the cheapest move for every individual player, and it has to be individually reasonable, not obviously cowardly or stupid, or the whole thing collapses into a morality tale. I want a physical artifact that survives into the debrief — some kind of log or ledger that records every act of restraint, including the restraints of people who aren't in the room at all, so that when we spread it across the table the list is already embarrassingly long before anyone has proposed a criterion for trimming it. And I want a last act where the ledger turns up someone who didn't refrain but who stopped somebody else from acting, a preventer of a preventer, so they have to say whether that person caused the harm more or less than the people who just sat on their hands, and whether their criterion can handle both without being gerrymandered.

  So: roles and rules, materials (nothing that costs money or needs a screen), a minute-by-minute timeline for the 90 minutes, and a debrief that maps specific moments from the game onto the actual problem — the but-for test, the way we treat doing and refraining differently even when the outcomes are identical, and the fact that the law won't hold you liable for failing to act unless you had a duty, which is a norm smuggled in and dressed up as a limit on causation. Tell me what will predictably go wrong the first time I run it and how to handle it — my guess is they'll moralize when I want them to analyze, and that one person will announce we're all responsible and try to end the exercise early, but I'd like your predictions, not just mine. And be straight with me about which part of the idea the activity simply can't reproduce and that I'll have to say out loud myself, because I'd rather know where the seams are than discover them in front of 14 grad students.
reasoning: |-
  We are going to design a simulation activity for a 90-minute session on causation by omission. The goal is to have participants experience causing harm by inaction and then struggle with assigning responsibility, leading to the insight that norms (duties, roles) are doing the work we attribute to causation.

  Key elements:
  - Operations room setting: water utility at 2 a.m. (or similar) with roles and asymmetric information.
  - Harm must result genuinely from inaction: waiting is the individually rational choice for each player.
  - Physical artifact: a ledger that records every act of restraint (inaction) and also includes restraints by people not present, including a "preventer of a preventer".
  - Debrief to connect to philosophical concepts (but-for test, difference between doing and refraining, role of duties in liability).

  Structure:
  1. Introduction (10 minutes)
  2. Setup and Role Assignment (10 minutes)
  3. Simulation (30 minutes)
  4. Reveal and Initial Reactions (10 minutes)
  5. Group Discussion and Argument (20 minutes)
  6. Debrief and Philosophical Connection (10 minutes)

  Total: 90 minutes

  **Detailed Plan**

  **1. Introduction (10 minutes)**
  - Briefly explain the topic (causation by omission) and the goal of the activity: to explore how we assign cause when harm results from what people didn't do.
  - Set the scenario: "You are the night shift at the Regional Water Monitoring Station. It's 2 a.m. and you are monitoring the water quality for the town. There's a tank of rare, delicate fish (the 'Canaries in the Coal Mine') that will die if the water pH drops below 6.0. The system is automated, but there's a known glitch that might cause a false reading. If the pH drops, an alarm should sound, but it might not. There's a manual override button that can add a neutralizing agent, but it must be pressed within 5 minutes of the drop to save the fish. The button press requires two people to act together (to prevent accidental presses)."
  - Explain that the simulation will run in real-time for 20 minutes (simulating about 2 hours of events). The harm (fish dying) will occur if no one presses the button in time after a pH drop.

  **2. Setup and Role Assignment (10 minutes)**
  - Assign roles (for 14 students, we can have 10 in the room and 4 outside, but note the outside roles are for the ledger later). Inside roles:
    - **Shift Supervisor (1)**: Has the authority to call for a manual override but must get two operators to press the button. They have a logbook to record any actions or decisions. They also have a note that says: "Remember: The last false alarm caused a costly unnecessary neutralization. The committee said to be cautious."
    - **Operator 1 (1)**: Monitors pH levels. They get a note: "The pH sensor has been acting up. The last three drops were false alarms. The technician is on vacation until next week."
    - **Operator 2 (1)**: Monitors the alarm system. Note: "The alarm system is being updated. It might not sound even if there's a real drop. The update will be complete at 4 a.m."
    - **Communications Officer (1)**: Handles incoming and outgoing messages. They have a note: "You are expecting a call from the day shift supervisor about a scheduling issue. Also, the emergency phone line is down for maintenance until 3 a.m."
    - **Data Analyst (1)**: Reviews historical data. Note: "The data shows that real pH drops are extremely rare (only once in 10 years) and usually happen during the day. Also, you are behind on your report due tomorrow."
    - **Trainee (1)**: New and eager. They have a note: "You are not sure about the procedures. You were told to always check with the supervisor before doing anything."
    - **Maintenance Tech (1)**: On call but not in the room. They are represented by a note in the room: "If called, they can come in 15 minutes. They are at home asleep." (This role is not played by a student, but the info is available.)
    - **External Roles (for the ledger)**: These are not played during the simulation but will be added to the ledger later. Prepare cards:
        - **Day Shift Supervisor**: "Decided not to call the night shift about a suspicious reading earlier because it seemed minor."
        - **Budget Committee Chair**: "Cut the budget for sensor upgrades last month."
        - **Technician**: "Did not fix the sensor because they were on vacation and the replacement part was delayed by the budget cuts."
        - **Preventer of a Preventer**: "The colleague of the Technician who suggested they take the vacation now because the system had been stable."

  - Provide each player with their role card and a personal goal (to make inaction rational):
    - Shift Supervisor: "Your performance review is next month. Unnecessary overrides are costly and look bad. Be cautious."
    - Operators and others: "You have been told to avoid false alarms. Acting without clear evidence could lead to reprimand."
    - Trainee: "You want to show you are careful and follow protocol."

  - Materials:
    - A large clock (or a timer) visible to all.
    - A button (could be a physical button or a card labeled "Override Button") that requires two people to press together (they must both be at the button station and agree to press).
    - A logbook (ledger) for the Shift Supervisor to record any actions or decisions (or non-decisions? We'll come back to this).
    - A status board showing:
        - pH level: initially 7.0 (we will simulate a drop at a set time).
        - Alarm status: Off.
        - Time: starting at 2:00 a.m.

  - Rules:
    - The simulation will run for 20 minutes of real time (representing 2 hours of in-game time, so 1 real minute = 6 game minutes).
    - At 2:10 real time (game time 2:30 a.m.), the pH drops to 5.8 (but the alarm does not sound because of the update). The Operator 1 sees the pH drop but isn't sure because of the sensor glitch. They must decide whether to report.
    - The fish will die at 2:15 real time (game time 2:40 a.m.) if the button isn't pressed (5 minutes after the drop in game time, which is 5 real minutes).
    - Players can communicate and act. But pressing the button requires two people to go to the button station and press together (which takes about 30 seconds of real time). The Shift Supervisor must be one of them? Not necessarily, but we can say any two operators. However, the Shift Supervisor must authorize the press? Let's not overcomplicate. Let the rules be: 
        - Any two players can press the button together, but they must both believe it's necessary and be at the button station at the same time.
        - The Shift Supervisor can also order a press, but then two operators must carry it out.

    - We want inaction to be rational. So, each player has reasons to doubt the reading and to fear acting without cause.

  **3. Simulation (30 minutes)**
  - Timeline (real time):
    - 0:00-2:00 (real time): Setup and role assignment (already done in the previous 10 minutes).
    - 2:00-10:00: Game time starts at 2:00 a.m. Players settle into roles. The pH is normal. The operators might note the sensor is glitchy. The Communications Officer might get a call (from the facilitator) about the scheduling issue (distraction). The Data Analyst is working on the report.
    - 10:00: pH drops to 5.8. Operator 1 sees it. They might report to the supervisor or not. The alarm does not sound. The facilitator (playing the role of the system) can hand Operator 1 a note: "pH reading: 5.8. But remember, the last three were false. What do you do?"
    - 10:00-15:00: Players react. They might discuss, doubt, etc. The Shift Supervisor might be cautious. The button press must be done by 15:00 real time (game time 2:40) to save the fish.
    - 15:00: If the button hasn't been pressed, the fish die. The facilitator announces: "The fish are dead. The pH drop was real and the neutralizing agent wasn't added in time."

  - During the simulation, the Shift Supervisor is required to log any actions taken (but not inactions). We will also have a separate ledger for inactions? Actually, we want a ledger that records every act of restraint. How? We can't have the Shift Supervisor log inactions because they don't know about them. Instead, we will have a hidden ledger that the facilitator keeps.

  - Facilitator's hidden ledger: The facilitator notes down every time a player could have acted but didn't, and why (based on their role and information). Also, we add the external roles. We will reveal this ledger after the fish die.

  - Example ledger entries (to be filled during the simulation):
    - Operator 1: Saw the pH drop at 2:30 a.m. but did not report it because of the note about false alarms.
    - Operator 2: Noticed the alarm didn't sound but did not investigate because the update was in progress and they thought it was expected.
    - Shift Supervisor: Was focused on the logbook and didn't ask for a status update because they were reviewing the caution note.
    - Communications Officer: Received a call from the day shift about scheduling and did not relay a message about an earlier minor fluctuation (because it seemed irrelevant) and did not check on the system because the emergency line was down and they were distracted.
    - Data Analyst: Did not cross-check the current pH with historical data because they were behind on their report.
    - Trainee: Noticed Operator 1 looking concerned but did not ask because they didn't want to overstep.
    - Maintenance Tech: Was asleep and not called, so did not come in.
    - External roles (pre-written):
        - Day Shift Supervisor: Noted a minor fluctuation at 5 p.m. but did not call the night shift because it seemed minor.
        - Budget Committee Chair: Cut the budget for sensor upgrades, so the glitch wasn't fixed.
        - Technician: Did not fix the sensor before going on vacation because the part was delayed.
        - Preventer of a Preventer: Colleague who suggested the vacation: "You've been working hard, take the vacation now, the system is stable."

  **4. Reveal and Initial Reactions (10 minutes)**
  - Announce the fish have died. Ask: "Who caused the fish to die?"
  - Let the group react spontaneously. They will likely point to specific people in the room (e.g., Operator 1 who saw the drop and didn't report).
  - Then reveal the hidden ledger. Spread it on the table. Read each entry. The list is long and includes people not in the room.

  **5. Group Discussion and Argument (20 minutes)**
  - Pose the question: "Given this ledger, who is responsible for the death of the fish? And why?"
  - Encourage debate. The goal is for them to feel the tension: 
    - First pull: It was the people in the room who didn't act (especially Operator 1 and the Shift Supervisor).
    - Second pull: But then what about the others? The list explodes.
  - Specifically, point to the "preventer of a preventer": the colleague who suggested the vacation. Ask: "Did this person cause the death? More or less than Operator 1? Why?"
  - Let them try to come up with criteria (e.g., who had a duty? who was closest?).

  **6. Debrief and Philosophical Connection (10 minutes)**
  - Map the activity to the philosophical issues:
    - But-for test: But for the inaction of any one of these, would the fish have lived? (For many, no, because others might have acted; for some, maybe.) But the test doesn't work because we have to consider all the necessary conditions? And then we get an explosion.
    - Doing vs. refraining: In the simulation, no one actively killed the fish (no positive action). The harm came from omissions. But we treat omissions differently. We don't blame the person who was asleep unless they had a duty to be awake.
    - The role of norms: We blame the Shift Supervisor more than the Maintenance Tech because the supervisor had a duty. But without that duty, the omission wouldn't be seen as a cause. So the norm is doing the work, not causation itself.

  - Highlight: The law often requires a duty for liability for an omission. This is a normative limit, not a causal one.

  **What Might Go Wrong**
  1. **Moralizing**: They focus on blame and guilt. Redirect: "We're not here to assign moral blame, but to understand how we assign cause. What makes one omission a cause and another not?"
  2. **One person declares collective responsibility and shuts down discussion**: Acknowledge the point but push: "If we are all responsible, then so are the people in the ledger who weren't here. Does that mean the budget committee chair is as responsible as the operator who saw the drop? Why or why not?"
  3. **They press the button and save the fish**: Then we don't have the harm. To avoid this, make the time pressure tight and the reasons for inaction strong. Also, the facilitator can introduce distractions (e.g., a phone call for the Communications Officer at the critical moment). If they do save the fish, we can still discuss: "What if you hadn't pressed? Who would have been responsible then?" But it's less powerful. So, design the scenario to make inaction likely.
  4. **They focus only on the people in the room**: Use the ledger to force the expansion. Ask: "What about the technician? If they had fixed the sensor, the alarm would have sounded. Are they a cause?"
  5. **They don't engage**: Assign roles with specific tasks and information. The asymmetry of information should drive interaction.

  **What the Activity Can't Reproduce**
  - The activity can't fully replicate the infinite regress of omissions (everyone who didn't fly in from Mars to fix the sensor). We only include a few external omissions. You will have to point out that in principle, the list is endless, but we stop at some point because of norms.
  - The distinction between causing and allowing is deeply embedded in our language and thinking. The activity might not completely disentangle that. You'll have to explicitly state that we are using "cause" in a broad sense for omissions, but note that in ordinary language we often avoid it.

  **Materials Summary**
  - Role cards for each player (Shift Supervisor, Operator 1, Operator 2, Communications Officer, Data Analyst, Trainee). Also, cards for external roles (to add to the ledger).
  - A large visible clock or timer.
  - A button (physical or symbolic).
  - A status board (poster paper) with pH, alarm status, and time.
  - Logbook for the Shift Supervisor (to record any actions).
  - Hidden ledger for the facilitator (a notebook to record inactions as they happen).
  - Pens.

  **Timeline Recap**
  - 0-10 min: Introduction and scenario setting.
  - 10-20 min: Role assignment and setup (hand out role cards, explain rules, set up the room).
  - 20-50 min: Simulation (30 minutes real time, with the pH drop at 10 minutes in and fish death at 15 minutes in if no action).
  - 50-60 min: Reveal the fish death and the ledger. Initial reactions.
  - 60-80 min: Group discussion and argument about responsibility.
  - 80-90 min: Debrief and connection to philosophy.

  This design should create the experience you want and lead to the intended philosophical insights.
answer: |-
  Below is a detailed, runnable activity for your 90-minute session on causation by omission. It's designed around a water utility night shift scenario (as you suggested) to create a high-stakes, asymmetric information environment where harm results from inaction. The activity forces participants to confront the "explosion" of causes and the implicit role of norms (duties, roles) in trimming the list. I've structured it to be screen-free, low-cost, and focused on physical artifacts (ledgers, role cards) to make the philosophical tension tangible.

  ---

  ### **Activity: "The Silent Shift: A Water Utility Nightmare"**
  **Core Scenario**: Participants are the night shift at a regional water treatment plant. A toxic chemical leak occurs in a nearby river, threatening fish downstream. The leak can be stopped by pressing a manual override button, but doing so requires coordination. Crucially, **inaction is individually rational** for each role—waiting is low-risk, while acting could incur blame, cost, or wasted effort. If no one acts, the fish die.

  **Key Mechanics**:
  - **Harm via pure omission**: The fish die only if *no one* presses the button.
  - **Asymmetric information**: Roles have conflicting priorities and partial knowledge (e.g., false alarms, budget cuts).
  - **Physical artifact**: A public "Restraint Ledger" records every act of inaction (including offstage figures), creating an absurdly long list of "causes."
  - **The twist**: The ledger includes a "preventer of a preventer" (e.g., someone who discouraged action).
  - **Debrief focus**: Maps game moments to causation concepts (but-for test, norms vs. causation).

  **Time Allocation**: 90 minutes total  
  - Setup: 10 min  
  - Simulation: 35 min  
  - Reveal & Argument: 25 min  
  - Debrief: 20 min  

  ---

  ### **Materials (Low-Cost, No Tech)**
  1. **Role Cards**: 14 cards (one per participant) with role-specific instructions.  
  2. **Restraint Ledger**: A large poster paper or notebook placed in the center of the room.  
  3. **Button Station**: A physical button (e.g., a red stress ball, buzzer, or laminated card) on a table.  
  4. **Event Timer**: A visible countdown timer (e.g., phone timer projected or a large wall clock).  
  5. **Leak Indicator**: A laminated "pH Meter" card showing safe (green) or toxic (red) levels.  
  6. **Distraction Notes**: Pre-written notes for the facilitator to hand out mid-simulation.  
  7. **Debrief Cards**: Cards with philosophical terms (but-for test, duty, etc.) for the debrief.  

  **Total Cost**: < $10 (paper, markers, a button substitute).

  ---

  ### **Roles & Rules**  
  Assign roles randomly. Each role has:  
  - **A goal** (making inaction rational).  
  - **Private information** (creating doubt about acting).  
  - **A cost for acting** (e.g., reputational risk).  
  - **A barrier to pressing the button** (requiring coordination).  

  **Roles for 14 Participants**:  
  1. **Shift Supervisor (1)**:  
     - *Goal*: Avoid false alarms (costs the plant money).  
     - *Info*: "Budget cuts mean false alarms could get you fired. The last leak was a sensor error."  
     - *Barrier*: Must authorize button press, but only if two operators confirm the leak.  

  2. **Water Quality Operators (3)**:  
     - *Goal*: Don’t overreact—waiting is safer.  
     - *Info*: "Sensors glitch often (60% false alarms). One operator’s note: 'Your son’s school play is tomorrow—don’t risk overtime.'"  
     - *Barrier*: Must convince the supervisor to investigate.  

  3. **Maintenance Tech (1)**:  
     - *Goal*: Avoid unnecessary work.  
     - *Info*: "The leak sensor has a known flaw, but fixing it requires approval you don’t have."  
     - *Barrier*: Can only act if called by the supervisor.  

  4. **External Liaison (1)**:  
     - *Goal*: Protect the plant’s public image.  
     - *Info*: "Media is snooping—if you press the button without cause, it could cause a scandal."  
     - *Barrier*: Can veto the button press.  

  5. **Budget Analyst (1)**:  
     - *Goal*: Justify past budget cuts.  
     - *Info*: "Cuts to sensor upgrades saved jobs. A leak now proves upgrades were unneeded."  
     - *Barrier*: Can delay action by demanding cost assessments.  

  6. **Trainee (1)**:  
     - *Goal*: Don’t embarrass yourself.  
     - *Info*: "You’re new—speaking up could look ignorant. Supervisor hates interruptions."  
     - *Barrier*: Must ask permission to speak.  

  7. **Environmental Monitor (1)**:  
     - *Goal*: Avoid crying wolf.  
     - *Info*: "Fish deaths happened once before—it was natural causes, not the plant."  
     - *Barrier*: Needs data from operators to act.  

  8. **Offstage Roles (5 - Not played but logged)**:  
     - *Included in ledger later*:  
       - **Day Shift Supervisor**: "Left early, didn’t report a minor sensor blip."  
       - **City Council Member**: "Voted to cut sensor funding."  
       - **Technician on Vacation**: "Skipped maintenance to attend a wedding."  
       - **Preventer of a Preventer**: "Convinced the technician not to reschedule vacation."  
       - **Regulatory Inspector**: "Missed a flaw during last audit."  

  **Rules for All**:  
  - **Button press rules**: Requires 3 steps:  
    1. Two operators must report the leak to the supervisor.  
    2. Supervisor must authorize press.  
    3. External Liaison must approve (no veto).  
  - **Cost of acting**: Pressing the button triggers a 5-minute "investigation" (real time) where players must justify their actions. If it’s a false alarm, they "get blamed."  
  - **Cost of waiting**: No penalty—rational for each individual.  
  - **Timer**: 30-minute simulation. At 15 mins, a "pH Drop" card is revealed (toxic leak confirmed). Fish die if no press by 30 mins.  
  - **Ledger Instructions**: When a player *could* act but doesn’t, they must write their name, role, and reason in the Restraint Ledger (e.g., "Operator 1: Didn’t report blip—sensors glitch often").  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0–10 min: Setup**  
  - Assign roles and hand out cards.  
  - Set up the room: Table with button, central Restraint Ledger, timer visible to all.  
  - Explain rules:  
    - "A toxic leak *will* occur. Your job is to monitor. Pressing the button stops it but requires teamwork.  
    - If you choose not to act when you could, log it in the ledger with your reason.  
    - Waiting is safe—acting risks blame."  
  - Start timer (30 mins for simulation).  

  **10–45 min: Simulation (35 min)**  
  - **First 15 min (Normal Operations)**:  
    - Facilitator hands out "distraction notes" (e.g., to Budget Analyst: "Review cost-saving report due now"; to Trainee: "Organize files—supervisor is watching").  
    - Players settle into roles. Most will avoid risks (e.g., Trainee stays quiet, Operators dismiss minor fluctuations).  
    - Ledger fills as players log inaction (e.g., "Supervisor: Didn’t check sensors—busy with paperwork").  
  - **15 min mark: Toxic Leak Revealed**  
    - Facilitator swaps pH card to red and hands a note to one operator: "CONFIRMED LEAK—toxic levels. But sensors have 60% false alarm rate. Log if you don’t report."  
    - Most players will *still* rationalize waiting (e.g., "Probably another glitch," "Not my job").  
  - **15–30 min: Rising Stakes**  
    - If players move to act, enforce barriers (e.g., Supervisor demands data, Liaison threatens veto).  
    - If button press is attempted, trigger the 5-min "investigation" (real-time debate). If unconvincing, "blame" is assigned (e.g., "Cost plant $10k—reprimand!").  
    - **Predictable outcome**: No one presses the button. Fish die at 30 min.  
    - **Facilitator secretly adds offstage roles to ledger** (e.g., "Technician on Vacation: Didn’t fix sensor—wedding").  

  **45–70 min: Reveal & Argument (25 min)**  
  - **Step 1: Reveal Harm**  
    - Announce fish death. Ask: "Who caused this?" Let blame fly (usually toward Operators or Supervisor).  
  - **Step 2: Reveal Ledger**  
    - Spread ledger on table. Read every entry, including offstage roles (emphasize length—20+ entries).  
    - Highlight "preventer of a preventer" entry (e.g., "Person X convinced technician to skip maintenance").  
  - **Step 3: Structured Argument**  
    - Divide group: Team A argues "Only specific inactions caused it" (e.g., Operators). Team B argues "The list explodes—every omission matters" (e.g., Budget Analyst, technician).  
    - Force debate: "Is the preventer of a preventer *more* responsible than the Supervisor? Why?"  
    - Push for criteria: "What principle trims the list? Closeness? Knowledge? Duty?"  

  **70–90 min: Debrief (20 min)**  
  - **Map Game to Philosophy**:  
    - **But-for test**: "Would the fish live but-for X’s inaction? Ledger shows 20+ but-for causes (e.g., but-for the budget cut, but-for the vacation). Why don’t we count them all?"  
    - **Doing vs. refraining**: Note identical outcomes—e.g., "Operator ignoring leak vs. saboteur causing one—both lead to dead fish. Why does one feel more ‘causal’?"  
    - **Norms as hidden limit**: Point to roles: "We blamed the Supervisor, not the sleeping technician. Why? Duty. But causation doesn’t care about duties—it’s a norm we smuggled in."  
  - **Key Insight**: "The ledger explodes because omissions are infinite. Only norms (duties, roles) make the list manageable. Law codifies this (e.g., ‘duty to act’ in liability). Causation isn’t doing the work—norms are."  
  - **Handout**: Debrief cards with terms for reference.  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Moralizing (e.g., "We’re all guilty")**:  
     - *Prediction*: Likely in the argument phase. Players may seek catharsis over analysis.  
     - *Fix*: Reframe: "Don’t discuss guilt—discuss *causal responsibility*. If we’re all causes, is the city council member equally responsible as the Operator? Why not?"  

  2. **Early Button Press (e.g., a hero ignores costs)**:  
     - *Prediction*: Unlikely (inaction is incentivized), but if it happens:  
     - *Fix*: Still use the ledger. "What if you *hadn’t* pressed it? Look at these 20 omissions. Which would you blame?"  

  3. **Dominant Player Takes Over**:  
     - *Prediction*: A vocal participant may rally others to act.  
     - *Fix*: Use asymmetric info to sow doubt (e.g., hand them a note: "Acting could cost your job"). If they persist, enforce barriers (e.g., Liaison vetoes).  

  4. **List-Triving Criteria Feel Arbitrary**:  
     - *Prediction*: Students will notice their "duty-based" criteria are circular.  
     - *Fix*: *Lean into it*. "Exactly! Duties are norms, not facts. The law uses them *because* causation alone is intractable."  

  ---

  ### **What the Activity Can’t Reproduce (Say This Aloud)**  
  "The simulation can’t fully replicate the *metaphysical absurdity* of omission’s infinite causes. In real life, omissions include everyone who *could* have acted but didn’t—past, present, even future people. We only avoid this by sneakily importing norms (e.g., ‘duties’). The law reveals this when it says you’re liable for failing to act only if you had a duty—not because causation is different, but because without norms, causation by omission would indict us all."  

  ---

  ### **Why This Works**  
  - **Harm via pure inaction**: Incentives make waiting rational, avoiding a "morality tale."  
  - **Ledger as physical proof**: Forces confrontation with the "exploding list."  
  - **Preventer of a preventer**: Exposes the regress problem (is discouraging action itself causal?).  
  - **Debrief links to law**: Shows how norms resolve the tension (e.g., duty in liability torts).  

  This design ensures participants *feel* the tension between causation’s explosion and norms’ constraints. Run it as described, and the grad students will leave arguing—success!
