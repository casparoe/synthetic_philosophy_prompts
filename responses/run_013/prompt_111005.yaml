prompt: |-
  For a dissertation chapter on personal identity and mind uploading, I want the adequacy conditions for a theory of personal identity written out before I take up any more of the accounts on offer — that is, what a theory of what we are has to deliver if it is to be usable on gradual replacement at all. Give me the desiderata: the cases it must get right, the distinctions it must not collapse, and the background facts it must not contradict, each with the consideration that motivates it, and say of each whether it is non-negotiable or a commitment of one camp. The standard cases — fission, teletransportation, the ship of Theseus, the one-step scan-and-copy — I take as read; I want the weight placed on these instead:

  - neuron-by-neuron replacement of a brain by functionally equivalent silicon, at whatever tempo, with no detectable moment of transition and no behavioural discontinuity;
  - a variant in which each original unit is not destroyed but kept running in parallel throughout, so that both systems are active and both have an equal claim to the memories;
  - a variant in which no new parts are introduced at all: the same matter is disassembled, held apart, and reassembled in the same arrangement;
  - and a variant in which the mechanism doing the replacing is itself gradually replaced while it works, so that nothing in the situation stays fixed long enough to be the thing that does the preserving.

  For each requirement say why it is one; then tell me which single requirement excludes the most candidate theories, and which pair looks jointly unsatisfiable. I suspect the real trouble is not any one case but the collision between (i) there being a determinate fact about who survives and (ii) the theory having to treat original and replacement symmetrically — I want to know whether that is right, or whether the pair that actually collides is a different one. A brief scoring of the obvious contenders against the list — neo-Lockean psychological continuity, animalism, and a pattern or four-dimensional view — is welcome, but keep it to a few lines; the list is the deliverable. Close with a final line beginning "Verdict:" naming the requirement, or pair, that no adequate account can satisfy without giving something up.
reasoning: |-
  We are to provide adequacy conditions (desiderata) for a theory of personal identity, especially in the context of mind uploading and gradual replacement scenarios. The focus is on the specific cases provided, and we are to outline what a theory must deliver to be usable in such cases.

  The cases to consider are:

  1. Neuron-by-neuron replacement by functionally equivalent silicon, without any detectable transition or behavioral discontinuity.
  2. A variant where the original neuron is not destroyed but kept running in parallel, so both systems (original and replaced) are active and have equal claim to memories.
  3. The same matter is disassembled, held apart, and reassembled in the same arrangement (without introducing new parts).
  4. The replacing mechanism is itself gradually replaced while it works, so that nothing remains fixed long enough to be the preserver.

  We need to derive desiderata from these cases, and then:

  - For each desideratum, state the motivating consideration and whether it is non-negotiable or a commitment of one camp.
  - Identify which single requirement excludes the most candidate theories.
  - Identify which pair of requirements looks jointly unsatisfiable.
  - Address the suspicion that the real trouble is between (i) there being a determinate fact about survival and (ii) the symmetry between original and replacement.

  Finally, we briefly score neo-Lockean psychological continuity, animalism, and a pattern/four-dimensional view against the list, and give a verdict.

  Let's derive the desiderata:

  **Desideratum 1: Gradual Replacement without Disruption (from case 1)**
     - **Requirement**: The theory must allow that a person can survive gradual replacement of their parts (e.g., neurons) by functionally equivalent non-biological parts, even when the replacement is so gradual that there is no moment of transition and no behavioral discontinuity.
     - **Motivation**: If we are to take mind uploading seriously, we must account for the possibility that a person could transition from biological to non-biological substrate without ceasing to exist. The continuity of consciousness and behavior is key here.
     - **Status**: Non-negotiable for theories that accept the possibility of mind uploading. It is a commitment of those who believe in functionalism and the possibility of non-biological minds.

  **Desideratum 2: Symmetry in Parallel Existence (from case 2)**
     - **Requirement**: The theory must account for the possibility that when a replacement is done in parallel without destruction of the original, both the original and the copy have an equal claim to being the original person (at least initially) and to the memories. This may lead to a branching of identity (fission).
     - **Motivation**: The case challenges the uniqueness of identity and requires that the theory can handle fission scenarios without collapsing the distinction between the original and the copy. It must explain why both have an equal claim and what happens to the original person (does she become two?).
     - **Status**: Non-negotiable for theories that accept the possibility of duplication. It is a commitment of psychological continuity theories that allow for branching.

  **Desideratum 3: Survival through Disassembly and Reassembly (from case 3)**
     - **Requirement**: The theory must allow that a person can survive being disassembled, having their parts held apart, and then reassembled in the same arrangement, even if no new parts are introduced.
     - **Motivation**: This tests the role of material continuity and the arrangement of parts. It is a standard case (like the ship of Theseus) but in the context of the same matter. It must not require continuous existence of the whole, but rather the preservation of form or structure.
     - **Status**: Non-negotiable for theories that hold that identity can be preserved through interruption if the same matter is reorganized appropriately. It is a challenge to animalism which might require continuous biological functioning.

  **Desideratum 4: No Fixed Preserver (from case 4)**
     - **Requirement**: The theory must account for survival even when the mechanism that is performing the replacement is itself being gradually replaced, so that there is no fixed entity that is doing the preserving throughout the process.
     - **Motivation**: This case challenges the idea that there must be some persistent entity (like a soul, a body, or a particular physical system) that remains to ground identity. It forces the theory to rely on relational or structural properties that can persist without any fixed underlying substance.
     - **Status**: Non-negotiable for theories that reject substance dualism and require a materialist account. It is a challenge to any theory that requires a fixed reference point.

  Additionally, we have two more general desiderata that are implicit in the cases and the overall project:

  **Desideratum 5: Determinacy of Survival (implicit in the discussion)**
     - **Requirement**: There must be a determinate fact about whether a person survives a given procedure (at least in cases without branching).
     - **Motivation**: Without determinacy, we cannot say whether a person has survived an uploading procedure, which is crucial for practical and ethical reasons (e.g., is it suicide?).
     - **Status**: Non-negotiable for theories that hold that survival is an objective matter. However, it may be dropped by theories that accept indeterminacy.

  **Desideratum 6: Symmetry between Original and Replacement (from the suspicion)**
     - **Requirement**: The theory must treat the original and the replacement symmetrically in cases of replacement. That is, the replacement part is not inherently inferior in grounding identity just because it is a replacement.
     - **Motivation**: In gradual replacement, if the replacement part is functionally identical, then it should be able to carry the identity just as well as the original. This is required to avoid arbitrary distinctions.
     - **Status**: Non-negotiable for functionalist theories. It may be rejected by biological theories (like animalism) that require the same biological matter.

  Now, we note that the user suspects a collision between (i) determinacy of survival and (ii) symmetry. But let's also consider the pair that might be jointly unsatisfiable.

  **Which single requirement excludes the most candidate theories?**
  Desideratum 4 (No Fixed Preserver) is very challenging because it requires identity to persist without any underlying fixed substance. This excludes:
     - Animalism: which requires the same biological organism (which is fixed).
     - Substance dualism: which requires a fixed soul.
     - Some versions of neo-Lockeanism that require a continuous stream of consciousness (if that stream is tied to a fixed brain).

  **Which pair looks jointly unsatisfiable?**
  The pair that seems to cause the most trouble is:
     - Desideratum 2 (Symmetry in Parallel Existence) and Desideratum 5 (Determinacy of Survival).
     Why? In the case of parallel existence without destruction, we have two entities with equal claims to being the original. This creates a symmetric situation. But determinacy requires that there be a fact about which one is the original (or whether the original survives in both). However, symmetry suggests that both are equally the original, which would mean the original person is now two persons. But then we lose determinacy in the sense that we cannot say the original is one and not the other. Alternatively, we might say the original ceases to exist and two new persons come into being, but that violates the intuition that at least one should be the original. This is the classic fission problem.

  Alternatively, the user's suspicion is about (i) determinacy and (ii) symmetry between original and replacement. But note that the symmetry in desideratum 6 is about the parts (original vs. replacement part), whereas the symmetry in desideratum 2 is about two whole systems. The collision the user suspects might be between:

     - Determinacy (Desideratum 5) and the symmetry in gradual replacement (Desideratum 6) as applied to the whole process. However, in a gradual replacement without branching, we don't have two persons. So the symmetry of parts doesn't directly lead to indeterminacy. The real problem is when we have branching (Desideratum 2).

  So, the pair that is jointly unsatisfiable is likely Desideratum 2 and Desideratum 5.

  **Brief scoring of theories:**

  1. **Neo-Lockean psychological continuity**:
     - Gradual Replacement (1): Can handle it if psychological continuity is maintained.
     - Parallel Existence (2): Can handle it by allowing branching (but then must give up uniqueness, which might conflict with determinacy in the sense of unique survival).
     - Disassembly (3): Might struggle if psychological continuity is interrupted. Some versions require continuity of consciousness, which disassembly might break. But if the reassembly restores the psychology, it might be accepted.
     - No Fixed Preserver (4): Psychological continuity can be maintained without a fixed physical substrate, so it can handle it.

  2. **Animalism**:
     - Gradual Replacement (1): Rejects it because the organism would cease to exist if replaced by non-biological parts.
     - Parallel Existence (2): Rejects because the original biological organism is unique.
     - Disassembly (3): Might reject because disassembly kills the organism (interruption of life processes).
     - No Fixed Preserver (4): Requires the same biological organism, so it cannot handle the replacement of the mechanism without a fixed organism.

  3. **Pattern or four-dimensional view**:
     - Gradual Replacement (1): Handles it well because identity is based on the pattern or the space-time worm, which can persist through part replacement.
     - Parallel Existence (2): Handles it by branching: the original person becomes two distinct space-time worms (or two instances of the pattern).
     - Disassembly (3): Handles it if the pattern is reassembled.
     - No Fixed Preserver (4): Handles it because identity is about the pattern, not the substrate or any fixed mechanism.

  **Verdict**: The requirement that no adequate account can satisfy without giving something up is the pair of **Symmetry in Parallel Existence (Desideratum 2) and Determinacy of Survival (Desideratum 5)**. Together, they force a choice: either accept that identity can branch (giving up uniqueness and hence determinacy in the sense of unique survival) or deny that both branches are the original (which violates the symmetry). Alternatively, one might give up the idea that there is a fact of the matter (indeterminacy) but that would be giving up Desideratum 5.
answer: |-
  ### Adequacy Conditions for a Theory of Personal Identity in Gradual Replacement Scenarios

  For a theory of personal identity to be usable in mind-uploading contexts—particularly those involving gradual replacement—it must satisfy the following desiderata, derived from the specified cases. Each requirement is motivated by the need to avoid arbitrariness, preserve intuitive judgments, and align with empirical realities (e.g., functional equivalence in uploading). I classify each as **non-negotiable** (if rejecting it undermines the very possibility of gradual-replacement-based uploading) or a **commitment of one camp** (if specific theories, e.g., psychological or biological, could reject it while others cannot). The standard cases (fission, teletransportation, etc.) are presupposed; the emphasis here is on your four variants.

  ---

  #### Desiderata from the Cases

  1. **Gradual Replacement Survival (from neuron-by-neuron replacement)**  
     - **Requirement**: The theory must allow for survival when a brain is replaced neuron-by-neuron with functionally identical silicon, at any tempo, without behavioral discontinuity or a detectable transition point.  
     - **Motivation**: If uploading is feasible, identity must persist through seamless gradual change; otherwise, theories implausibly privilege biological continuity over functional equivalence. Behavioral continuity and lack of a "switch" moment imply no loss of identity.  
     - **Status**: Non-negotiable. Rejecting this renders uploading conceptually incoherent.  

  2. **Symmetry in Parallel Existence (from the parallel-original variant)**  
     - **Requirement**: The theory must not collapse the distinction between the original and a duplicate when both coexist with equal claims to memories and experiences. It must either permit branching (fission) or explain why only one entity is the original.  
     - **Motivation**: If the original is preserved alongside replacements, both systems exhibit identical psychological states, challenging uniqueness. Theories must account for duplication without arbitrarily favoring the "first" instance (e.g., denying both are "you" or allowing two "yous").  
     - **Status**: Commitment of neo-Lockean psychological theories (which often embrace branching). Animalist or non-branching theories reject it.  

  3. **Survival through Interruption (from disassembly/reassembly)**  
     - **Requirement**: The theory must allow survival when the same matter is disassembled, held apart, and reassembled identically, with no new parts introduced.  
     - **Motivation**: This tests whether spatial/temporal continuity is necessary. If identity persists through destruction/reconstitution, theories relying on unbroken physical continuity (e.g., animalism) fail; if not, uploading via disassembly is impossible.  
     - **Status**: Commitment of pattern/four-dimensional views. Non-negotiable for functionalist uploaders.  

  4. **No Fixed Preserver (from replacing-the-replacer variant)**  
     - **Requirement**: The theory must permit survival when the mechanism performing replacements is itself gradually replaced, so nothing remains fixed to "anchor" identity.  
     - **Motivation**: Gradual replacement chains (e.g., replacing the replacer robot) force identity to depend on relational properties (e.g., causal or structural continuity), not a persistent substrate. Rejecting this implies a mystical "essence," contradicting physicalism.  
     - **Status**: Non-negotiable. Rejecting it reintroduces dualism or ad hoc anchors.  

  #### Additional General Desiderata

  5. **Determinacy of Survival (background constraint)**  
     - **Requirement**: For any scenario (without branching), there must be a determinate fact about whether the person survives.  
     - **Motivation**: Ethics and practical decisions (e.g., "is uploading suicide?") require yes/no answers. Indeterminacy makes theories unusable for real-world applications.  
     - **Status**: Non-negotiable for realist theories; anti-realist (e.g., some narrative views) reject it.  

  6. **Symmetry between Original and Replacement Units (implicit in all variants)**  
     - **Requirement**: Functionally identical units (e.g., a neuron and its silicon substitute) must be treated symmetrically—no ontological privilege for original parts.  
     - **Motivation**: Gradual replacement assumes functional equivalence suffices for continuity; privileging "original" matter is arbitrary and contradicts uploading’s promise.  
     - **Status**: Non-negotiable for functionalists; animalists reject it.  

  ---

  #### Analysis of Conflicts
  - **Single requirement excluding the most theories**: **Desideratum 4 (No Fixed Preserver)**.  
    Why? Animalism requires a persistent biological organism; substance dualism needs an immutable soul; and even some psychological theories (e.g., those requiring a continuous brain-based "carrier") fail when nothing stable exists. Only pattern/four-dimensional views handle this cleanly.  

  - **Jointly unsatisfiable pair**: **Desideratum 2 (Symmetry in Parallel Existence) and Desideratum 5 (Determinacy of Survival)**.  
    Why? Desideratum 2 demands that both the original and parallel system have equal claim to identity (implying branching), while Desideratum 5 requires a unique outcome (e.g., "you" survive in only one). Satisfying both forces either contradiction (one entity is determinately "you" despite symmetry) or abandonment of uniqueness (accepting indeterminacy or multiple selves).  

  Your suspicion that **determinacy (5) and symmetry between original/replacement (6)** is the core collision is **incorrect for gradual replacement**. Desideratum 6 (unit-level symmetry) is compatible with determinacy in non-branching cases (e.g., gradual replacement without duplication). The real collision is between branching symmetry (2) and determinacy (5), as shown above.  

  ---

  #### Scoring Key Theories
  - **Neo-Lockean Psychological Continuity**:  
    Excels at 1 (gradual survival via psychology), 2 (allows branching), and 4 (no fixed substrate needed). Struggles with 3 if disassembly breaks psychological continuity, and 5 (determinacy) in fission cases.  

  - **Animalism**:  
    Fails 1, 3, 4, and 6 (requires biological continuity). Handles 2 (no branching) and 5 (deterministic) but only by denying uploads.  

  - **Pattern/Four-Dimensional View**:  
    Aces 1, 3, 4, and 6 (identity as structure over time). Handles 2 via branching but violates 5 (determinacy) by making identity path-dependent or indeterminate in fission.  

  ---

  **Verdict:** The pair **Symmetry in Parallel Existence (2) and Determinacy of Survival (5)** cannot be jointly satisfied without sacrificing uniqueness, epistemic clarity, or the possibility of branching—forcing theories to "give up" either determinacy or the intuition that both branches are equally "you."
