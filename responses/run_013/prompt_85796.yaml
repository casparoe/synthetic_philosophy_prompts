answer: |-
  Below is a decision tree designed to clarify positions on how history textbooks should address a nation's difficult chapters (e.g., founding with slavery, or atrocities studied by perpetrators' descendants). The tree starts from **logical principles** (not pre-defined camps), uses neutral phrasing for nodes, and includes two cases. Leaves are named plainly, note their most awkward commitments, and flag undefended positions or case-specific limitations.

  ---

  ### **Root: What is the primary purpose of a history textbook?**
  - **A. Civic Identity Formation**: To build a shared national story that unites citizens.  
  - **B. Disciplinary Training**: To teach students how historians analyze evidence and construct arguments.  

  ---

  ### **Branch A: Civic Identity Formation**  
  **Split 1: Should the shared civic story emphasize achievement or reckoning?**  
  - **A1. Achievement-Centric**: Focus on progress, triumphs, and unifying values.  
  - **A2. Reckoning-Centric**: Focus on confronting historical injustices and moral failures.  

  **Split 2 (for both A1/A2): Where specialists disagree, should the textbook...**  
  - **Aα. Display Live Disagreement**: Show competing interpretations to model civic discourse.  
  - **Aβ. Report Consensus**: Present the current majority view to avoid confusion.  

  **Split 3 (for all above): Should the textbook's voice be...**  
  - **Ai. 'We the Nation'**: Use first-person plural (e.g., "Our founders...") to foster collective ownership.  
  - **Aii. 'The Discipline'**: Use third-person objective voice (e.g., "Historians find...") to maintain critical distance.  

  **Split 4 (for all above): Do we owe the dead a duty of respectful depiction?**  
  - **AY. Yes**: Avoid graphic/dehumanizing language; depict perpetrators/victims with nuance.  
  - **AN. No**: Prioritize accuracy; avoid censorship, even if depictions distress modern readers.  

  ---

  ### **Branch B: Disciplinary Training**  
  **Split 2: Where specialists disagree, should the textbook...**  
  - **Bα. Display Live Disagreement**: Highlight debates to teach historical reasoning.  
  - **Bβ. Report Consensus**: Focus on settled methods/facts to build foundational skills.  

  **Split 3 (for both Bα/Bβ): Should the textbook's voice be...**  
  - **Bi. 'We the Nation'**  
  - **Bii. 'The Discipline'**  

  **Split 4 (for all above): Do we owe the dead a duty of respectful depiction?**  
  - **BY. Yes**  
  - **BN. No**  

  ---

  ### **Leaf Positions**  
  *Sorted by branch. Most awkward commitments flagged. Case-specific fits noted. Undefended leaves marked*.  

  #### **Civic Identity Formation (A)**  
  **Achievement-Centric (A1) Leaves**:  
  1. **Pride-Unifying Patriotism** (A1/Aβ/Ai/AN)  
     - *Path*: Achievement + Report Consensus + "We" + No Duty to Dead.  
     - *Awkward*: Must downplay harms (e.g., slavery) to maintain an uplifting narrative.  
     - *Case Fit*: Founding stories *only* (atrocities lack "achievement" to center).  

  2. **Critical-Patriotic Dialogue** (A1/Aα/Ai/AN)  
     - *Path*: Achievement + Display Disagreement + "We" + No Duty.  
     - *Awkward*: Risks undermining unity by airing disputes during celebratory framing.  

  3. **Objective Heritage** (A1/Aβ/Aii/AY)  
     - *Path*: Achievement + Consensus + "Discipline" + Duty to Dead.  
     - *Awkward*: Balances honoring heroes with acknowledging their crimes, often incoherently.  

  4. **Nuanced Achievement Consensus** (A1/Aβ/Aii/AN)  
     - *Path*: Achievement + Consensus + "Discipline" + No Duty.  
     - *Awkward*: Reports harsh truths neutrally, weakening inspirational goals.  
     - *Undefended*: Unexplored (civic aim clashes with detached voice).  

  **Reckoning-Centric (A2) Leaves**:  
  5. **Collective Atonement** (A2/Aβ/Ai/AY)  
     - *Path*: Reckoning + Consensus + "We" + Duty to Dead.  
     - *Awkward*: Assigns shared guilt ("we did this") while softening perpetrator depictions.  

  6. **Unflinching Truth** (A2/Aβ/Ai/AN)  
     - *Path*: Reckoning + Consensus + "We" + No Duty.  
     - *Awkward*: Forces "ownership" of atrocities (e.g., "our genocide") without mitigation.  

  7. **Disciplinary Reckoning** (A2/Aβ/Aii/AY)  
     - *Path*: Reckoning + Consensus + "Discipline" + Duty.  
     - *Awkward*: Softens consensus facts (e.g., casualty counts) for dignity, compromising accuracy.  

  8. **Forensic Reckoning** (A2/Aβ/Aii/AN)  
     - *Path*: Reckoning + Consensus + "Discipline" + No Duty.  
     - *Awkward*: Presents atrocities as settled facts, sidelining marginalized perspectives.  

  9. **Dialogic Repair** (A2/Aα/Ai/AY)  
     - *Path*: Reckoning + Display Disagreement + "We" + Duty.  
     - *Awkward*: Shows debates on harms (e.g., "Was this genocide?") while demanding "respect" for perpetrators.  

  10. **Raw Reckoning** (A2/Aα/Ai/AN)  
      - *Path*: Reckoning + Display Disagreement + "We" + No Duty.  
      - *Awkward*: Graphic details may traumatize; "we" implies complicity in unresolved debates.  

  #### **Disciplinary Training (B) Leaves**:  
  11. **Methodological Pluralism** (Bα/Bii/BN)  
      - *Path*: Display Disagreement + "Discipline" + No Duty.  
      - *Awkward*: Exposes students to extremist views (e.g., denialism) as "valid" interpretations.  

  12. **Guided Pluralism** (Bα/Bii/BY)  
      - *Path*: Display Disagreement + "Discipline" + Duty.  
      - *Awkward*: Withholds evidence (e.g., perpetrator diaries) to spare the dead indignity.  

  13. **Consensus Methodology** (Bβ/Bii/BN)  
      - *Path*: Report Consensus + "Discipline" + No Duty.  
      - *Awkward*: Hides ongoing debates, misrepresenting history as static.  

  14. **Ethical Consensus** (Bβ/Bii/BY)  
      - *Path*: Report Consensus + "Discipline" + Duty.  
      - *Awkward*: Sanitizes consensus (e.g., omitting victim testimonies) for "respect."  

  **Undefended Leaves**:  
  - *All "We the Nation" in Disciplinary Branch* (Bi paths):  
    - E.g., **National Methodology** (Bα/Bi/BN), **Atonement Training** (Bβ/Bi/BY).  
    - *Why*: Incoherent—"we" imposes identity on a field requiring objectivity.  
  - *Civic "Discipline Voice"* (Aii paths under Achievement):  
    - E.g., **Objective Heritage** (A1/Aβ/Aii/AY).  
    - *Why*: Unexplored—civic goals rarely pair well with third-person detachment.  

  ---

  ### **Key Notes**  
  - **Case-Specific Fits**:  
    - *Founding stories*: Fit **all Achievement leaves (A1)** (e.g., slavery alongside revolution).  
    - *Atrocities*: Fit **Reckoning leaves (A2) and all Disciplinary leaves** (e.g., Japan/Korea textbooks).  
  - **Unseparated Positions**:  
    - "How much" to emphasize harms vs. progress (e.g., 10% vs. 50% textbook space).  
    - Whether to center marginalized voices (e.g., Indigenous perspectives).  
  - **Tree Utility**:  
    - Forces clarity on *why* we disagree (e.g., "You prioritize civic unity; I prioritize disciplinary rigor").  
    - Avoids reductive labels ("cancel culture," "patriotism").  

  This tree isolates core philosophical splits, helping your committee pinpoint disagreements. For implementation, survey members on each node to map positions.
