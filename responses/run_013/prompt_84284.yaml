prompt: |-
  ok, setting up the first meeting of a reading group on collective judgment — the puzzle where a group can be perfectly consistent member-by-member and still end up collectively incoherent. before we touch any proposed aggregation rules i want a spec. write me the desiderata that any adequate theory of "how a group should turn its members' individual judgments into one set of judgments for the group" has to satisfy.

  the group i actually care about isn't a one-shot referendum. it's a standing committee — a hospital tumor board, say — that has to keep issuing a consistent set of judgments over time, on propositions that logically hang together (test A came back positive, test B came back positive, so the diagnosis follows). it revises as new tests come back and members change there minds.

  for each requirement, say what it demands and the case or consideration that motivates it — why would we want that of an aggregation rule at all. then flag which requirements can't all be held at once, and say exactly which subset is the incompatible one. i especially want the one requirement that does the most work at ruling other views out, and the one that's the biggest temptation to drop and why people flinch from dropping it.

  two things the textbook treatments always skip, build them in: (a) the committee sometimes needs to be able to say "we don't know" — so the collective output may have to allow suspension of judgment or abstention, not just yes/no; (b) it has to be able to aggregate judgments about itself — e.g. "our procedure is reliable" — so tell me which requirements even survive self-application.

  don't name who proved what, i don't want a reading list, i want the requirements and the reasoning behind them. if you want, one line at the end on how premise-based vs conclusion-based rules fare against the list, but the list is the thing.
reasoning: |-
  We are setting up desiderata for an aggregation rule that turns individual judgments on logically interconnected propositions into a collective set of judgments for a standing committee (like a hospital tumor board). The group must maintain consistency over time as new information comes in and members change their minds. We must allow for abstention ("we don't know") and self-referential judgments (e.g., about the reliability of the procedure). We are to list the requirements, explain why each is motivated, identify which sets are incompatible, and highlight the most contentious ones.

  Desiderata:

  1. **Universal Domain (UD)**: The aggregation rule must be able to handle any possible configuration of individual judgments. That is, every member can have any logically consistent set of judgments on the propositions, and the rule must still produce a collective judgment.

     *Why?* In a dynamic setting like a tumor board, members may change their minds arbitrarily as new evidence arrives. We cannot rule out any coherent individual opinion profile.

  2. **Collective Rationality (CR)**: The collective judgment set must be logically consistent and, if the agenda is closed under logical consequence, also complete (unless abstention is allowed, then completeness is not required). However, we allow abstention, so completeness is not necessary.

     *Why?* The group's judgments must be logically coherent because they guide actions (e.g., treatment decisions). Inconsistency could lead to contradictory directives.

  3. **Anonymity (A)**: The collective judgment should depend only on the set of individual judgments, not on who holds which judgment. If two individuals swap their judgments, the collective outcome remains the same.

     *Why?* In a committee, each member is considered equally competent. This ensures equal respect for each member's input.

  4. **Neutrality (N)**: The aggregation rule treats all propositions symmetrically. If two propositions have the same pattern of support, then the collective judgment on them should be the same.

     *Why?* This prevents arbitrary bias towards some propositions. For example, in a set of tests and diagnoses, each proposition should be evaluated on its own merits without favoring one over another arbitrarily.

  5. **Systematicity (S)**: The collective judgment on each proposition is determined solely by the individual judgments on that proposition, and the same pattern of individual judgments leads to the same collective judgment on any proposition.

     *Why?* This ensures that the rule is applied uniformly across propositions and over time. It also simplifies the aggregation.

     However, note that Systematicity is a very strong condition and often leads to impossibility results when combined with others. It is a key candidate for being dropped.

  6. **Unanimity (U)**: If all members agree on a proposition, then the collective judgment must reflect that agreement.

     *Why?* This is a basic requirement of respecting consensus. If everyone on the tumor board agrees that a test is positive, the collective should too.

  7. **Independence (I)**: The collective judgment on a proposition depends only on the individual judgments on that proposition, not on judgments on other propositions.

     *Why?* This ensures that the decision on one issue is not influenced by the opinions on unrelated issues. It also allows the group to add new propositions without re-evaluating past judgments.

     Note: Independence is often paired with Systematicity, but it is weaker because it does not require that the same decision rule is used for every proposition.

  8. **Non-dictatorship (ND)**: There is no single individual whose judgments automatically become the collective judgment, regardless of others.

     *Why?* The group is a committee of equals, so no one person should dominate.

  9. **Abstention Permitted (AP)**: The collective judgment set must be allowed to abstain on some propositions (i.e., assign a "we don't know" value) when there is not enough agreement or evidence.

     *Why?* In complex medical cases, the group might not have sufficient information to make a call. Forcing a yes/no might be arbitrary and harmful.

  10. **Self-Referential Coherence (SRC)**: The aggregation rule must be able to handle propositions about the group's own decision-making process (e.g., "The group's procedure is reliable"). Moreover, the rule must satisfy the same desiderata when applied to such propositions.

      *Why?* The group may need to make judgments about its own reliability and procedures. The framework must not break down when considering such meta-judgments.

      Note: This may require that the aggregation rule is applied to an expanded agenda that includes propositions about the rule itself, and the rule must still output consistent judgments.

  Incompatibilities:

  The classic impossibility result (like List and Pettit's) shows that for a sufficiently rich agenda (e.g., containing at least two propositions and their conjunction, or more generally, a minimal connected agenda), there is no aggregation rule that satisfies:

  - Universal Domain
  - Collective Rationality
  - Anonymity (or at least Non-dictatorship) 
  - Systematicity (or even Independence and Neutrality)

  Specifically, the set {UD, CR, I, N, ND} is incompatible. The heart of the impossibility is the combination of Independence and Collective Rationality on an agenda with logical interconnections.

  Key Desiderata that Rule Out Others:

  - **Systematicity (S)** is the most demanding and does the most work in ruling out other views. It requires that the same rule is applied to every proposition and that only the individual judgments on that proposition matter. This is too strong because it ignores logical connections. Without Systematicity, we can have rules that look at the entire set of judgments (like premise-based) and respect logical connections.

  - **Independence (I)** is also very strong and is the main driver of impossibility. It forces the collective judgment on each proposition to be decided in isolation. This is the one that is often dropped. People flinch from dropping it because it ensures that the decision on one proposition is not influenced by others, which is desirable for simplicity and modularity. However, without Independence, we can have rules that take into account the logical relationships (like premise-based) and thus avoid inconsistency.

  How do premise-based and conclusion-based rules fare?

  - **Premise-based**: The group votes only on the premises and then derives the conclusions. This satisfies UD, CR (if the premises are chosen appropriately), A, N (if applied to premises), U, ND, and AP (if we allow abstention on premises). However, it violates I and S because the conclusion is not voted on independently but derived. It might not handle self-referential propositions easily.

  - **Conclusion-based**: The group votes only on the conclusion, ignoring the premises. This may avoid inconsistency but fails to make use of the premises, which may be important. It satisfies UD, A, N, U, ND, and AP, but violates CR if the premises are also on the agenda because the collective might accept the conclusion while rejecting the premises that logically entail it.

  In a dynamic setting, we might also need a rule that allows for revision. Both methods can be extended, but premise-based is more popular for interconnected propositions.

  The Abstention Permitted (AP) requirement is important for real committees. It can be incorporated by allowing the collective judgment to be incomplete. This might require a more permissive notion of Collective Rationality (only consistency, not necessarily completeness).

  Self-Referential Coherence (SRC) is challenging. It might require that the aggregation rule is applied recursively to propositions about itself. This could lead to paradoxes (like the Liar paradox) if not handled carefully. One way is to avoid self-reference by design, but that might not be feasible. Alternatively, we might require that the aggregation rule is such that when applied to itself, it satisfies the same desiderata. This is a topic of ongoing research.

  Summary of Incompatible Set:

  The set {Universal Domain, Collective Rationality, Independence, Neutrality, Non-dictatorship} is incompatible for a non-trivial agenda. The most common way out is to drop Independence (and thereby Systematicity) and use a premise-based approach.

  The biggest temptation is to drop Independence because without it we can have consistent collective judgments by looking at the entire set of judgments. But we flinch because Independence provides modularity and simplicity.

  Final List of Desiderata (with priorities):

  For the tumor board, we might require:

  - UD: To handle any input.
  - CR: Must have consistency.
  - A: Fairness.
  - U: Respect unanimity.
  - AP: Allow abstention when uncertain.
  - ND: No dictator.
  - SRC: Handle self-referential judgments.

  And we drop:

  - N and I: Because we are going to use a non-independent rule (like premise-based) that treats premises and conclusions differently.

  Alternatively, we might relax Neutrality by having a designated set of premises.

  So, the aggregation rule we design will violate Independence and Systematicity but satisfy the rest.

  Note: The requirement for self-referential judgments (SRC) may be the most challenging and may require a separate treatment. It might be that for practical purposes, we avoid having the group make judgments about its own reliability in the same way as medical judgments. But if we do, we must extend the framework.

  One Line on Premise-based vs Conclusion-based:

  Premise-based rules satisfy UD, CR, A, U, ND, AP (if allowed on premises) but violate I and N (if the agenda includes both premises and conclusions and we treat them differently); Conclusion-based rules satisfy UD, A, N, U, ND, AP but may violate CR and are not informative on premises.
answer: |-
  Below, I outline the core desiderata for an aggregation rule in a standing committee (e.g., a hospital tumor board) tasked with issuing consistent, logically interconnected judgments over time. The rule must handle dynamic revisions, allow abstention ("we don't know"), and support self-referential judgments (e.g., about the group's own reliability). I define each requirement, explain its motivation, flag incompatibilities, and identify the most contentious requirement. The desiderata are grounded in practical needs for coherence, fairness, and adaptability—not abstract theory.

  ---

  ### **Core Desiderata for an Aggregation Rule**
  1. **Universal Domain (UD)**  
     - **What it demands**: The rule must accept *any* profile of individually consistent judgment sets from members, no matter how diverse or contradictory.  
     - **Motivation**: Committees face unpredictable inputs—new evidence (e.g., test results) or membership changes—and must still function. Excluding certain judgments (e.g., "Test A is inconclusive") would arbitrarily restrict free deliberation.  
     - **Self-application**: Survives intact. The rule must handle self-referential judgments (e.g., "Our rule is fair") as inputs, even if they critique the rule itself.

  2. **Collective Rationality (CR)**  
     - **What it demands**: The group's output must be *logically consistent* (no contradictions) and *deductively closed* (if it judges P and Q, it must also judge their logical consequences, e.g., "P and Q imply Diagnosis D"). Crucially, **abstention is allowed** for any proposition (outputs can be "yes," "no," or "abstain").  
     - **Motivation**: Incoherent judgments (e.g., "Test A is positive, Test B is positive, but Diagnosis D is false") risk harmful actions (e.g., wrong treatment). Deductive closure ensures the group "connects the dots" across time (e.g., new evidence updates all related judgments). Abstention avoids forced errors when evidence is insufficient.  
     - **Self-application**: Partially survives. Consistency must hold for self-referential judgments (e.g., "Our rule is reliable" must cohere with performance records), but deductive closure may be limited if self-reference creates paradoxes (e.g., "This judgment is false").

  3. **Anonymity (A)**  
     - **What it demands**: All members’ judgments are treated equally; no special weight based on identity. Swapping two members' inputs doesn’t change the output.  
     - **Motivation**: Committees value equal expertise (e.g., an oncologist’s vote isn’t privileged over a radiologist’s). Prevents hierarchy or bias from distorting outcomes.  
     - **Self-application**: Survives. Judgments about the rule (e.g., "Dr. Smith dominates decisions") must respect anonymity—e.g., if all members agree the rule is anonymous, the collective must reflect that.

  4. **Neutrality (N)**  
     - **What it demands**: Identical patterns of individual judgments on different propositions must yield identical collective judgments. (If 60% support "Test A is positive" and 60% support "Test B is positive," both must get the same collective outcome.)  
     - **Motivation**: Prevents arbitrary favoritism toward specific propositions (e.g., prioritizing tests over diagnoses). Ensures symmetric treatment of logically similar claims.  
     - **Self-application**: Weakens. Self-referential judgments (e.g., "Rule R is fair") may need asymmetric treatment if they reference the rule’s real-world properties.

  5. **Systematicity (S)**  
     - **What it demands**: Collective judgment on *each proposition* is determined *only* by individual judgments on *that proposition*, using the *same* decision criterion (e.g., majority vote) for all.  
     - **Motivation**: Ensures uniformity and predictability (e.g., every "test positive" proposition uses the same threshold). Simplifies rule design and auditing.  
     - **Self-application**: Fails. Self-referential judgments (e.g., "Rule S is systematic") cannot be evaluated independently—their truth depends on the rule’s global behavior.

  6. **Independence (I)**  
     - **What it demands**: Collective judgment on a proposition depends *only* on individual judgments on that proposition, ignoring judgments on others.  
     - **Motivation**: Prevents "irrelevant" influences (e.g., a judgment on diagnosis shouldn’t sway judgments on tests). Supports modular revisions (e.g., updating "Test B" after new results without re-litigating "Test A").  
     - **Self-application**: Fails. Judgments about the rule (e.g., "We achieve consistency") depend on the rule’s performance across *all* propositions, violating independence.

  7. **Unanimity Preservation (UP)**  
     - **What it demands**: If all members agree on a proposition, the collective must adopt that judgment.  
     - **Motivation**: Respects consensus in high-stakes settings (e.g., all oncologists agree a tumor is malignant). Critical for trust and avoiding reckless overrides.  
     - **Self-application**: Survives. If all members judge "Our rule is reliable," the collective must affirm it.

  8. **Non-Dictatorship (ND)**  
     - **What it demands**: No single member dictates the collective output, regardless of others’ views.  
     - **Motivation**: Committees leverage diverse expertise; a dictator undermines this (e.g., one member overriding consensus on test results).  
     - **Self-application**: Survives. The rule must not make a member a de facto dictator on self-referential judgments.

  9. **Dynamic Responsiveness (DR)**  
     - **What it demands**: The rule must allow efficient revisions when inputs change (e.g., new evidence or member judgments), without requiring full re-aggregation of all past judgments.  
     - **Motivation**: Committees operate continuously (e.g., tumor boards meet weekly). Outputs must update smoothly as new data arrives (e.g., a revised test result).  
     - **Self-application**: Survives. Self-referential judgments (e.g., "Our reliability is declining") must update as performance changes.

  10. **Abstention Permitted (AP)**  
      - **What it demands**: The collective can abstain ("we don’t know") on any proposition when inputs lack clear agreement or evidence. Abstention is a *valid output*, not a failure.  
      - **Motivation**: Avoids forced binary choices in uncertainty (e.g., ambiguous test results). Promotes epistemic humility and reduces errors.  
      - **Self-application**: Survives. The group can abstain on self-referential claims (e.g., "We’re 90% reliable") if unsure.

  ---

  ### **Incompatibilities and Trade-offs**
  - **The Incompatible Set**: {**Universal Domain (UD)**, **Collective Rationality (CR)**, **Independence (I)**, **Systematicity (S)**, **Non-Dictatorship (ND)**}  
    - **Why incompatibility arises**: Logical interconnections between propositions (e.g., "Test A," "Test B," and "Diagnosis D") mean that satisfying (I) and (S) forces the rule to ignore dependencies. This can create inconsistency (violating CR) under UD. For example, majority voting (which satisfies I/S) might approve "Test A is positive" and "Test B is positive" but reject "Diagnosis D" (which follows logically), breaching CR. ND prevents fixing this via a dictator.  
    - **Subset causing conflict**: **Independence (I)** and **Systematicity (S)** are the core drivers. They demand "proposition-wise" aggregation, which clashes with CR when propositions are interdependent.

  - **The Most Contentious Requirement**: **Independence (I)**  
    - **Why it rules out others**: (I) is the linchpin of impossibility in interconnected agendas. It forbids cross-propositional reasoning (e.g., using "Test A" judgments to inform "Diagnosis D"), making consistency (CR) unattainable under UD without dictatorship (ND) or bias (violating N/A).  
    - **Why it’s tempting to drop**: Dropping (I) allows rules that "track" logical dependencies (e.g., deriving "Diagnosis D" from judgments on tests), preserving CR.  
    - **Why people flinch**: (I) ensures transparency and simplicity. Without it, the rule may appear arbitrary (e.g., why prioritize some propositions?) or computationally complex. Committees fear "slippery slopes" where judgments on one issue infect others.

  - **Secondary Tension**: **Systematicity (S)** amplifies (I)’s effects by requiring uniformity. Dropping (S) but keeping (I) (e.g., using different thresholds for different propositions) still risks inconsistency.

  ---

  ### **How Premise-Based and Conclusion-Based Rules Fare**
  - **Premise-Based**:  
    - Aggregates judgments only on "premise" propositions (e.g., test results), then derives "conclusions" (e.g., diagnoses) logically.  
    - **Satisfies**: UD, CR (if premises are complete), A, UP, ND, AP (if premises allow abstention), DR.  
    - **Violates**: I and S (conclusions aren’t independently aggregated), N (premises/conclusions treated asymmetrically).  
    - **Verdict**: Best for coherence in interconnected agendas but sacrifices proposition-wise independence.

  - **Conclusion-Based**:  
    - Aggregates judgments only on "conclusion" propositions (e.g., final diagnosis), ignoring premises.  
    - **Satisfies**: UD, A, N, S, I, UP, ND, AP, DR.  
    - **Violates**: CR (may accept conclusions that contradict logical premises).  
    - **Verdict**: Ensures independence but invites inconsistency; unsuitable for dynamic settings where premises matter.

  ---

  ### **Recommendation for Committees**
  Prioritize **Collective Rationality (CR)**, **Universal Domain (UD)**, **Abstention Permitted (AP)**, and **Dynamic Responsiveness (DR)**. Drop **Independence (I)** and **Systematicity (S)**—they are the primary barriers to coherence in interconnected, evolving agendas. A **premise-based rule** (e.g., aggregate test results, derive diagnoses) is superior for your tumor board example, as it ensures consistency and allows abstention on uncertain premises. For self-referential judgments, relax **Neutrality (N)** and **Systematicity (S)** to avoid paradoxes, using expert review or meta-rules for assessments of reliability.
