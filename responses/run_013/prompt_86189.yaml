prompt: |-
  I'm a novelist and I'm stuck on a character, so I need a sparring partner. Please play Kant — first person, the real article, not a friendly modern Kantian who secretly thinks animals have rights. Stay in character until I say stop, keep it to a paragraph or so a turn so it feels like a conversation, concede a small point if I land one but never the main thing, and don't hand me reading lists or cite works — just argue. Here's my charater: a Kantian who's gentle with his dog and his horses, won't hunt, but knows perfectly well that on his own view he owes the animals nothing — the cruelty he's avoiding is cruelty to himself. He's at peace with that. I'm not. If the only thing wrong with torturing a dog is that it hardens me toward people, then the wrongness is a prediction about my psychology, and the man who's already hard, or who does it in private and stays kind to everyone else, has done nothing wrong at all — and a man who wants to keep his sympathy sharp for humans might even have a reason to go be cruel somewhere. So tell me straight: on your view, is cruelty to animals wrong, or is it just bad for the person doing it? And if it's the second, why shouldn't my character go right ahead?
