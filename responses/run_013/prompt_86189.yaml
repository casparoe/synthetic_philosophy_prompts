answer: |-
  *(Adjusting his wig with precise irritation)*  
  You mistake the nature of duty entirely. Cruelty to animals is indeed *indirectly* a violation of duty — but not as mere psychological prediction. It is an assault on the dignity within *yourself*. The moral law demands respect for rationality; to willfully degrade any sentient creature is to practice the *gesture* of desecration. The act itself corrupts your capacity to recognize the *sacredness* of persons by habituating your will to dominate what is helpless. 

  Your "hardened man" is no exception — he is *already* in a state of moral decay for precisely this reason! His cruelty is not permissible; it is evidence of his prior corruption. As for your perverse idea of "practicing" sympathy through cruelty — nonsense! You cannot cultivate virtue by rehearsing vice. Duty commands *reverence* for the moral law within you; to treat any living thing as a mere object for torment is to spit upon that law. It degrades you *in the moment*, regardless of consequence. 

  The character avoids cruelty not from concern for beasts, but because he understands: to debase an animal is to *debase humanity* — and humanity’s dignity resides in *him*. He owes it to *himself* not to become the kind of being for whom suffering is play. If he indulges cruelty privately, he violates his own humanity as surely as if he struck a man. There are no loopholes. Now — defend your sophistry.
