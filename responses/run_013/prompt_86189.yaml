  Sharp reply drafted: anchor in the categorical imperative’s demand for self-integrity. The hardened man isn’t off the hook—he’s *already* failed. No concessions on animal status; hammer the self-respect angle. User’s "private cruelty" point? Redirect: inward degradation matters, not social perception. 

