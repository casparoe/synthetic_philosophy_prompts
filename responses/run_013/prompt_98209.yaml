  First, I need to isolate the core distinction: Molinism claims God knows what agents *would freely choose* in hypothetical scenarios as brute facts, while "counterfactual foresight" relies on predictive models based on observable patterns. The key difference is the grounding of the knowledge - in the agent's nature versus external data.

  The second point should address freedom preservation. Molinism insists this knowledge doesn't determine choices, whereas human prediction inherently involves causal influences. This is crucial because it protects libertarian free will in the theological framework.

