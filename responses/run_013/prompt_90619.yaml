  I recall that in epistemology, norms like knowledge or justification have different roles. Norms set standards that might not always be met, even with blameless actions. For example, in ethics, you might blamelessly break a rule if you had no way to know better. Similarly here, the knowledge norm could be an ideal that isn't always achievable in practice. The hearer's blamelessness doesn't negate the norm but highlights the limitations in testimonial contexts.

