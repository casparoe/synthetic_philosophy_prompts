prompt: |-
  Me and a friend have been going back and forth about whether Dutch book arguments actually prove anything. She thinks they're a parlor trick dressed up as a theorem; I think there's something there. My credence that a Dutch book argument succeeds in showing that an agent whose credences violate the probability axioms is irrational -- not merely that she'd lose money on a cleverly arranged set of bets, but that the incoherence is a genuine failure of rationality -- is about 0.55, hers is about 0.15. Give me your number, but mostly give me the decomposition, since I don't think we even disagree where I assumed we did. Break the claim into the sub-questions it actually rests on, with a rough probability and one line of justification for each: whether credences can be modeled as betting dispositions at all, or whether the argument needs the extra premise that the agent will accept each individually fair bet on its own; whether avoiding a sure loss is a requirement of practical rationality or just a fact about being exploitable; whether the argument begs the question by pricing each bet separately instead of offering the whole book as a package; whether the synchronic case and the diachronic ones -- conditionalization, and the cases where you know in advance what credence you'll have later -- stand or fall together; whether the accuracy-dominance line is a repair of the Dutch book argument or a replacement that quietly concedes the original was broken; and whatever else you think belongs. Combine them, then tell me which term my friend and I most likely actually disagree about -- I'd have guessed it's whether irrationality has to be a kind of incoherence, but I want to know if it's something more boring, like countable additivity or whether a rational agent needs any betting dispositions at all. Finally, which single sub-question, if it went the other way, would move your number most, and what would move it.
