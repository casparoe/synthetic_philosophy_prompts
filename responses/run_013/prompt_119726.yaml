prompt: |-
  I run a small reading group — lesswrong-adjacent, mostly people who've read the Sequences and at least one metaethics textbook — and we keep circling the same argument about idealized preferences without ever getting anywhere, because everyone is answering a different question while using the same words. I've read the coherent-extrapolated-volition writeups more often than is healthy, and I've noticed that the machinery gets deployed for at least three different jobs: telling a person what is good for them, telling them what they really will, and telling a group what it should do together. Most disputes I've seen are really disputes about which job is being done, plus an unexamined choice about what "idealized" is supposed to add. So what I want from you is a classification instrument rather than an essay: please act as a philosopher who works on desire-based accounts of welfare and on collective decision procedures, comfortable with both the formal apparatus (utility functions, reflective stability, aggregation) and the standard metaethical objections to idealization, and build me a decision tree over the positions in this neighborhood — where every branch node is a question someone could answer about a concrete case without already knowing which position it leads to, and every leaf is a named position or is explicitly marked as one nobody defends. Think it through carefully before you commit to a structure, and start by brainstorming, because I would much rather see the distinctions you considered and discarded than get a tidy tree with no seams in it.

  The angle I care about is the one above, so let the tree do some work that a textbook summary wouldn't. Force every leaf to declare which job it is doing — a theory of the person's own good, a theory of their own will or autonomy, or a procedure for collective choice — and let at least one branch node separate positions that agree about the mechanics but disagree about the job. Make the tree distinguish idealization by more information from idealization by more time and cognitive power from idealization by better character, and separately distinguish the view that idealization discovers a preference already there from the view that it transforms the person into someone whose preference counts; I want the cases at those nodes to be ones where the two idealizations actually diverge, not a case that fits both. The tree must also locate aggregation in the right place: extrapolating each person and then combining, combining first and extrapolating a single merged subject, and treating the whole thing as one shared volition with a convergence assumption all need to be distinguishable, and I want at least one question about what the theory says when two people's idealized volitions flatly conflict. Please include leaves for, at minimum: full-information desire satisfaction in its plain form; the ideal-advisor picture where a better-informed counterpart of you sets the standard; a proceduralist view on which the authority comes from the process of reflective endorsement rather than from any output; the structure where authority lies in a desire about your own desires; the CEV-style shared extrapolation; the objection that the idealized counterpart is simply a different person whose preferences have no claim on you; and a deflationary view that treats idealization as a formalization of ordinary practical reasoning with no separate facts behind it. I also want at least one question about whether unbounded idealization is even determinate — whether there is a fact of the matter about what the fully idealized agent wants, or whether the extrapolation fails to converge and the whole account inherits that indeterminacy. Two constraints on the questions themselves: nobody should be able to answer a node correctly by pattern-matching a label, so no question of the form "do you think idealization discovers or transforms?", and every node should be a case or a plain-English claim that a smart person outside the literature could answer from their own intuitions. Aim for nine to twelve questions and eight to twelve leaves; I'll be photocopying this as a handout people fill in themselves, so it needs to work without me in the room. Finally, resist the temptation to give each question exactly one leaf — if two questions turn out to do the same separating work, say so.

  Please lay the answer out in exactly these sections:

  - "Warm-up: the axes I could use" — roughly 200 words of brainstorming: the candidate distinctions you might build on, including at least three you decide against, each with a sentence on why.
  - "The questions" — the numbered diagnostic items, nine to twelve of them, each with two to four answer options phrased in ordinary language, and after each item a bracketed tag naming the axis it moves the answerer along. No position names in the questions.
  - "The tree" — an indented outline running from the first question to the leaves, each node labeled with its question number and the branch condition, each leaf with the position's name.
  - "The leaves" — one entry per leaf, about three sentences each: the name, the single claim that distinguishes it, which of the three jobs it is doing, and the commitment its defenders will find most awkward.
  - "Thin and empty branches" — combinations of answers that no named position occupies, each diagnosed in a sentence or two as incoherent, unattractive, or merely unexplored.
  - "Collisions" — pairs of leaves the tree cannot separate, with the extra question that would separate them if one exists, and an honest admission where none does.
  - "Where my framing is doing the work" — roughly 150 words on which of the distinctions I fixed above are themselves contestable, and how the tree would look different if I hadn't fixed them.
reasoning: |-
  Hmm, the user runs a reading group focused on LessWrong and metaethics, and they're stuck in endless debates about idealized preferences. They want a decision tree to clarify positions, not an essay. The key is to create a tool that forces distinctions around three jobs: personal good, personal will, and collective choice.

  I need to brainstorm axes first. The user specified several must-haves: types of idealization (information, cognition, character), discovery vs transformation, aggregation methods, determinacy, and conflict handling. I'll list candidate distinctions but discard some for being too vague or overlapping. For example, "normativity source" is too meta for this tool, and "scope of aggregation" is messy without collective context.

  For questions, I aim for 9-12 diagnostic items in plain English. Each should have concrete scenarios to avoid label-matching. Important cases: when idealization changes identity (e.g., brain tumor case), conflict resolution (e.g., park vs mall debate), and determinacy (e.g., endless preference tweaking). The tags will track axes like [Identity Threshold] or [Conflict Resolution].

  The tree structure will start broadly—first separating personal vs collective contexts, then drilling into idealization mechanics. I'll ensure leaves cover all requested positions (e.g., full-information desire satisfaction, ideal advisor, CEV) and mark empty branches where combinations are incoherent (e.g., collective transformation without convergence).

  Collisions are tricky—some positions might share answers until later branches. I'll note where an extra question could split them, like probing idealization's purpose for proceduralism vs autonomy theories.

  Finally, I'll acknowledge how the user's framing shapes the tree. Forcing the "three jobs" separation makes some splits artificial, but it's necessary for their goal. Without it, the tree might lump personal will and good together, muddying disputes.

  The handout format means clarity is paramount. I'll use indented outlines and plain-language examples so group members can self-diagnose without facilitation.
answer: |-
  ### Warm-up: the axes I could use  
  Brainstorming distinctions:  
  1. **Job type**: Personal good / Personal will (autonomy) / Collective choice (*essential per request*)  
  2. **Idealization type**: More information / More cognitive power / Better character (*kept; diverges in cases like addiction vs. akrasia*)  
  3. **Epistemic status**: Discovers existing preference / Transforms identity (*kept; critical for authority disputes*)  
  4. **Aggregation order**: Extrapolate individuals then aggregate / Aggregate then extrapolate / Shared volition convergence (*kept for collective cases*)  
  5. **Determinacy**: Converges to single outcome / Indeterminate or context-dependent (*kept; addresses formal objections*)  
  6. *Discarded*: "Normativity source" (moral realism vs. constructivism) — too meta for case-based branching.  
  7. *Discarded*: "Scope of idealization" (global vs. local) — collapses into idealization type.  
  8. *Discarded*: "Temporal status" (synchronic vs. diachronic) — less salient than character/info distinctions.  

  ---

  ### The Questions  
  1. **When someone gains perfect information and their preference changes (e.g., learns food contains allergens), is the new preference:**  
     (A) What was *always* best for them, just hidden.  
     (B) What they *now* have authority to want, since they’re more "themselves".  
     (C) Merely a prediction error correction, with no deeper meaning.  
     [Idealization Type: Information + Epistemic Status]  

  2. **If cognitive enhancement reveals you *don’t* value your life’s work (e.g., curing a disease once emotionally driven), should you abandon it?**  
     (A) Yes—your ideal self sees it’s unimportant.  
     (B) No—your actual commitment defines you, not hypothetical judgments.  
     (C) Only if others relying on you agree.  
     [Idealization Type: Cognition + Job Type]  

  3. **A reformed bigot, after moral education, renounces past views. Their unidealized self would protest. Whose preference has authority?**  
     (A) The reformed self—they’re better.  
     (B) The original self—it’s who they *are*.  
     (C) Neither—only current actual preferences matter.  
     [Idealization Type: Character + Transformation]  

  4. **Two people dispute a shared resource (e.g., park vs. mall). Idealization makes both *more* committed to their view. How resolve?**  
     (A) Aggregate preferences first, *then* idealize the compromise.  
     (B) Idealize each separately, then aggregate.  
     (C) Assume idealized versions would converge; find that overlap.  
     [Aggregation Order + Conflict Case]  

  5. **You desire to quit smoking but crave cigarettes. What makes quitting "your will"?**  
     (A) Your higher-order desire *to not crave* is authoritative.  
     (B) Only if you’d endorse quitting after calm reflection.  
     (C) Neither—it’s just a conflict with no "true" self.  
     [Job Type: Will vs. Good]  

  6. **Suppose idealization involves endless self-correction (e.g., perpetually tweaking life goals). Does "fully idealized" exist?**  
     (A) Yes—it points to a stable endpoint.  
     (B) No—the process is all there is.  
     (C) Only as a useful fiction.  
     [Determinacy]  

  7. **Aliens offer to rewire your brain to match your "ideal self’s" preferences. Post-rewiring, you’re happier. Should you consent?**  
     (A) Yes—it fulfills your deep preference.  
     (B) No—the rewired person isn’t *you*.  
     (C) Only if your current self approves the *change*, not the outcome.  
     [Transformation vs. Discovery]  

  8. **A group decision requires unanimity. After deliberation, one holdout remains. Is overriding them justified if their *idealized* self would agree?**  
     (A) Yes—we’re respecting their "real" will.  
     (B) No—only actual consent matters.  
     (C) Only if *all* idealized selves converge.  
     [Collective Choice + Authority]  

  9. **Your ideal advisor (fully rational, informed *you*) recommends a career you hate but excel at. Do you obey?**  
     (A) Yes—they know my good better than I do.  
     (B) Only if I reflectively endorse it.  
     (C) No—they’re a stranger with no claim on me.  
     [Job Type: Good vs. Will]  

  ---

  ### The Tree  
  1. **Q1(A) or (B)** → *Personal context*  
     - → 2. **Q2(A)** → *Cognitive/moral idealization*  
       - → 3. **Q3(A)** → **Ideal Advisor Theory** (Job: Personal good)  
       - → 3. **Q3(B)** → **Endorsement Proceduralism** (Job: Personal will)  
     - → 2. **Q2(B)** → *Actualist will*  
       - → 5. **Q5(A)** → **Hierarchical Desire Theory** (Job: Personal will)  
       - → 5. **Q5(B)** → **Reflective Equilibrium** (Job: Personal will)  
     - → 2. **Q2(C)** → *Collective*  
       - → 4. **Q4(A/B/C)** → *See collective branch*  
  2. **Q1(C)** → *Deflationary*  
     - → 9. **Q9(C)** → **Anti-Idealization** (Job: None; rejects framework)  
  3. **Q4 or Q8 invoked** → *Collective context*  
     - → 4. **Q4(A)** → **Aggregate-then-Idealize** (Job: Collective choice)  
     - → 4. **Q4(B)** → **CEV-Style Individual Extrapolation** (Job: Collective choice)  
     - → 4. **Q4(C)** → **Shared Convergent Volition** (Job: Collective choice)  
     - → 8. **Q8(C)** → **Convergence Requisite** (Job: Collective choice)  
  4. **Q7(B)** → **Identity Threshold Objection** (Job: None; critique)  
  5. **Q6(B) and Q5(C)** → **Proceduralism (No Output)** (Job: Personal will)  

  ---

  ### The Leaves  
  1. **Ideal Advisor Theory**: Distinguishing claim: An omniscient, rational *counterpart* defines your good. Job: Personal good. Awkward: Advisor’s values may feel alien ("Why should a genius-version of me dictate my life?").  
  2. **Endorsement Proceduralism**: Authority lies in *reflective endorsement*, not outputs. Job: Personal will. Awkward: Risk of circularity (what counts as "reflective"?).  
  3. **Hierarchical Desire Theory**: Authentic will is your effective second-order desires. Job: Personal will. Awkward: Inability to resolve conflicting higher-order desires.  
  4. **Reflective Equilibrium**: Coherence across considered judgments *is* the will. Job: Personal will. Awkward: May validate status quo biases.  
  5. **Aggregate-then-Idealize**: Combine actual preferences, then idealize the group agent. Job: Collective choice. Awkward: May amplify existing irrationalities.  
  6. **CEV-Style Individual Extrapolation**: Extrapolate each person separately, then aggregate outputs. Job: Collective choice. Awkward: No solution if idealized preferences conflict.  
  7. **Shared Convergent Volition**: Treat the group as having one volition that converges under idealization. Job: Collective choice. Awkward: Assumes deep harmony; falsified by conflict.  
  8. **Convergence Requisite**: Group legitimacy requires *actual* convergence of idealized wills. Job: Collective choice. Awkward: Paralysis in persistent disagreement.  
  9. **Anti-Idealization**: Idealization is either incoherent or irrelevant to normativity. Job: None. Awkward: Cannot explain intuitive pulls of "better judgment".  
  10. **Identity Threshold Objection**: Idealization creates a *new person*; their preferences lack authority. Job: Critique (not a position). Awkward: Must define "identity" non-arbitrarily.  
  11. **Proceduralism (No Output)**: The *process* of seeking coherence matters; no "final" preference exists. Job: Personal will. Awkward: Cannot guide one-off decisions.  

  ---

  ### Thin and Empty Branches  
  - **Q1(A) + Q2(C)**: Personal discovery but collective job? Incoherent—individual idealization can’t serve collective role.  
  - **Q3(C) + Q5(A/B)**: Rejects character idealization but endorses hierarchy/endorsement? Unexplored; likely unstable.  
  - **Q6(A) + Q7(B)**: Believes in determinate ideal self but denies its authority. Unattractive—why care about an unreachable "truth"?  

  ---

  ### Collisions  
  - **Ideal Advisor vs. Full-Information Desire Satisfaction**: Not separated; both answer Q1(A), Q2(A), Q3(A). *Separator*: "Does ‘rationality’ add anything beyond information?" (If yes → Advisor; if no → Desire Satisfaction).  
  - **CEV-Style vs. Shared Convergent Volition**: Both answer Q4(C) in convergence scenarios. *Separator*: Q8 (Holdout case)—CEV accepts majority over holdout; Convergence Requisite rejects.  
  - **Proceduralism (No Output) vs. Reflective Equilibrium**: Both answer Q6(B). *No clean separator*—distinction is meta (teleology of reflection).  

  ---

  ### Where My Framing is Doing the Work  
  Your forced splits—especially **Job Type separation** and **discovery-vs-transformation**—create artificial branch points. Absent this, most theories would cluster under "personal normativity" with disputes over mechanics (e.g., Ideal Advisor and Hierarchical Desire both address "true will," differing only on *how*). The **collective branch** is uniquely shaped by your demand to distinguish aggregation orders; otherwise, CEV often absorbs these. Similarly, **character vs. cognition idealization** is rarely split in literature (both called "rationality"), but your framing exposes tensions (e.g., moral growth vs. computational prowess). The tree privileges "authority-through-identity" concerns, sidelining utilitarian readings—a tradeoff for your anti-pattern-matching goal.  

  ---  
  *(Tree: 10 questions → 11 leaves. Handout-ready: Answer questions 1, 2, 4, 5, 6, 7, 8, 9 to locate position.)*
