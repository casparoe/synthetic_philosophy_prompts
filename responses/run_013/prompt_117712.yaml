answer: |-
  **MEMORANDUM**  
  TO: City Council  
  FROM: Planning Commission  
  SUBJECT: Recommended Definition of "Affected Neighborhood" for Advisory Votes on Upzonings  
  DATE: October 26, 2023  

  ### **Background**  
  Per Council Ordinance 2022-15, major upzonings trigger a formal advisory vote in the "affected neighborhood," requiring a council supermajority to override a "no" vote. The ordinance did not define "affected neighborhood," leading staff to default to registered voters within project boundaries. This approach excludes renters, non-citizens, displaced residents, and affordability waitlist applicants—groups with material stakes in housing outcomes. The pending railyard redevelopment (600 units, 50% below-market) highlights this gap: the voting bloc comprises largely homeowners, while displaced residents and 3,000+ waitlisted households lack representation.  

  ### **Analysis of Proposals**  
  The Commission evaluated two frameworks:  
  1. **Expansive Electorate (Commissioner A):**  
     - Includes current residents (renters/non-citizens), affordability waitlist applicants designating the area, residents displaced in 15 years, and proxies for future residents.  
     - *Strengths:* Aligns with ethical imperatives for restorative justice.  
     - *Weaknesses:* Logistically infeasible (verifying displacement/waitlist status); legally contentious (non-resident voting); risks undermining perceived legitimacy.  

  2. **Weighted Voting (Commissioner B):**  
     - One-person-one-vote, weighted by "impact level" (e.g., proximity, displacement risk).  
     - *Strengths:* Recognizes varying stakes.  
     - *Weaknesses:* Subjective metrics invite litigation; administrative burden; potential for arbitrary outcomes.  

  **Engaging the "Current Residents Only" Position**  
  A reasonable case for limiting the electorate to current residents merits consideration:  
  - **Procedural Integrity:** Advisory votes gain legitimacy from clear, objective voter eligibility. Expanding beyond verifiable residents introduces ambiguity, inviting legal challenges and delays.  
  - **Accountability:** Residents bear immediate impacts (construction, service demand). Granting influence to non-residents dilutes local accountability.  
  - **Precedent:** Broadening definitions risks infinite regress (e.g., should regional commuters vote on traffic impacts?). The status quo, while imperfect, is administratively clean.  
  - **Scope Creep:** Council intended input from those experiencing direct externalities, not regional policy arbitration. Waitlists and displacement redress belong in citywide housing strategy, not site-specific votes.  

  However, this position fails when displacement is integral to neighborhood history. Excluding those forcibly removed—or denying renters a voice in their community’s evolution—undercuts equity and contradicts city housing goals.  

  ### **Recommendation**  
  **Adopt a Modified "Current Residents" Rule with Automatic Review Triggers**  
  1. **Electorate Definition:**  
     - **All adult (18+) residents** within the project boundary, regardless of tenure (owner/renter) or citizenship.  
     - *Boundary:* Drawn by planning staff using census blocks, adjusting for natural barriers and cohesion. Registered voters receive ballots by mail; others may opt in via affidavit at City Hall/library kiosks.  

  2. **Pilot Survival & Threshold:**  
     - Retain the pilot but require a **biennial equity review**.  
     - Council supermajority (⅔) still needed to override a "no" vote.  

  3. **Rationale:**  
     - **Balance:** Includes marginalized residents *experiencing* impacts today, avoiding unworkable expansion.  
     - **Feasibility:** Uses existing census/utility data; avoids weighting or waitlist verification.  
     - **Justice:** Renters (48% of city households) gain voice; non-citizens contribute taxes/services.  
     - **Precedent:** Aligns with L.A./Seattle’s inclusive resident definitions for advisory bodies.  

  ### **Implementation Timeline**  
  - **Nov 15, 2023:** Commission finalizes boundary guidelines.  
  - **Dec 1, 2023:** Council adopts rule.  
  - **Jan 15, 2024:** Staff develop opt-in protocols for non-registered voters.  
  - **March 1, 2024:** Rule effective for all new upzonings, including railyard.  
  - **March 2025:** First equity review (e.g., turnout disparities, renter participation).  

  ### **Conclusion**  
  No definition perfectly resolves tensions between local immediacy and historical/regional equity. Our recommendation prioritizes actionable fairness: enfranchising all residents subject to direct impacts while launching structured review to address systemic gaps. Retaining the pilot with these modifications honors council’s intent while adapting to lived realities of displacement and exclusion.  

  ---  
  **STRUCTURED SUMMARY (JSON)**  
  ```json  
  {  
    "recommendation": "Adopt electorate of all adult residents within boundary, retain pilot with biennial equity reviews.",  
    "electorate_rule": "All adults (18+) residing within staff-drawn boundary; non-registered voters opt-in via affidavit.",  
    "threshold_and_timing": "Supermajority (⅔) council override retained; rule effective March 1, 2024, with biennial reviews starting 2025.",  
    "strongest_counterargument": "Limiting input to current residents ignores displaced populations and regional affordability needs, prioritizing procedural ease over restorative justice.",  
    "what_would_change_our_mind": "Evidence that opt-in mechanisms suppress renter/non-citizen turnout below 30%, or legal rulings invalidating non-citizen participation.",  
    "confidence": 0.7  
  }  
  ```
