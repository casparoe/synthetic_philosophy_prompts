prompt: |-
  A friend of mine who took a Renaissance history course keeps summarizing Machiavelli to me like this: "Machiavelli thinks our lives are split right down the middle — fortune decides half of what happens to us and our own virtù decides the other half. Virtù is just the Italian word for virtue, so it means the prince's good qualities of character. And the practical upshot is that a clever prince can swap his approach to fit the times, cautious when caution is called for and bold when boldness is, which is basically what virtù amounts to for Machiavelli: being flexible. Fortune he pictures as a river that bursts its banks, and as a woman who rewards the young and the impetuous." Something feels off to me — I dont think virtù is just "virtue," and I doubt Machiavelli was a fatalist about half of life — but he got an A in the course and I didn't, so I want to know where he's right and where he's sliding. Go through it claim by claim: what would a Machiavelli scholar accept, what's a standard simplification, and what's flatly wrong, and does the "flexible prince" moral actually follow from the parts that are right? End with a one-line verdict of the form \answer{...} containing a label (mostly fair / mixed / unfair) plus a one-sentence reason.
