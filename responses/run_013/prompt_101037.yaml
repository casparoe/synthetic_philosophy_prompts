  My mom's been slipping for about three years now -- she still knows me most days, but last week she called me by my uncle's name and then laughed like it was a joke, and I honestly dont know if it was. My sister keeps insisting there was a point, like a specific month, where "she stopped being mom," and she wants to find it, pin it down. I keep telling her there isnt one, its just gradual, but then I catch myself and realize I can't say when it *started* being gradual either. Like, when did the gradualness itself begin.

  Anyway I've been reading alot about vagueness and the sorites thing -- the heap paradox, how taking away one grain never turns a heap into a non-heap, so where the hell is the line. And the part thats been messing with me is that even the line about where the line is seems vague (I think people call it higher-order vagueness?). Some philosophers apparently think there IS a sharp real boundary for every vague word, we just can never know it; others think there's no fact of the matter at all and the word just quietly runs out of grip.

  I want you to write me a short story about this. Not an essay -- an actual story, with people in it, dialogue, a scene or two. Someone dealing with a gradual change in a person (doesnt have to be dementia, could be anything) who is trying to locate the exact moment something stopped being what it was, and what happens to them and the people around them when the moment wont hold still. I dont want the characters lecturing each other about philosophy; I want the philosophy to just be in the furniture of the story. And please dont make it a tidy "and the answer is there is no answer" thing, thats cheap.

  Then, after the story, a short note: which side of the vagueness debate the story ends up committed to (a real but unknowable boundary, or no boundary at all, or degrees, or something else), where it takes liberties with the ideas or leans on a reading thats actually contested, and what would have to be true -- what argument or case would have to go the other way -- for you to tell the same story with the opposite verdict. Keep the note short and blunt; I'd rather be told where its shaky than be reassured.
