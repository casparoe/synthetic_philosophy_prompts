  Reading group this week is the hole argument and I've been handed the job of running it. Can you sort the usual escape routes into tiers by how much you'd actually trust each one to defuse the indeterminism, with a line each on why it lands where it does. The routes I mean: just biting the bullet and saying the theory is indeterministic and that's fine; relationalism about spacetime points; sophisticated substantivalism, where the points have no haecceity so the diffeomorphic models are just Leibniz-equivalent; and the line that the argument proves too much, i.e. it's really a reductio on treating the points as individuals rather than on substantivalism itself. Then there's one a friend floated that I haven't seen put this way: that it's not a problem about determinism at all but about identity, since we only think the two models differ because we've tacitly assumed the points are bare particulars, and once you drop that the "indeterminism" is just one world described twice, no Leibniz-equivalence machinery required. Is that a genuine extra option or relationalism with extra steps, and where does it go in the tiers?
