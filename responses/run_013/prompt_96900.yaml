prompt: |-
  I teach a second-year undergraduate metaphysics course and next term I have a 75-minute slot on material constitution that I keep botching. Last year I did the statue and the lump on the whiteboard, took a show of hands on whether they're one thing or two, then talked at them about the options for forty minutes. Fine, they wrote it down, they'll remember none of it. A colleague reckons the trouble is that a show of hands is too cheap -- everyone already knows which way they'd vote before they walk in, so nothing is at stake and nothing gets discovered. What I want instead is for them to have to make the call over and over, under rules they didn't choose, and to notice that they keep wanting to change the rule at exactly one point in the sequence and not at the others.

  Here's what I've sketched, and where I get stuck. Eighteen students, so six teams of three, each with a lump of plasticine and two ledger sheets they have to keep in parallel: a Works ledger for works of art, and a Materials ledger for the stuff those works are made of. I deal commission cards one at a time -- form the lump into a figure; squash it flat; recast it as something completely different; stick on a new limb; cut a limb off and put it in a drawer; take that drawer limb out again and build a second work with it while the first one is still sitting there; grind the whole thing to powder; press the powder back into a lump; divide the lump and make two works from it. After every card each team writes down how many works exist, how many material things exist, and which of the entries already on their lists have gone out of existence. Then I score them for bookkeeping consistency: one birth and at most one death per entry; nothing comes from nothing; and no two entries may be made of the same bit of plasticine or sit in the same place at the same time. I also want two rival persistence rules in play so they collide -- one where a thing survives as long as it keeps enough of its original parts and no rival thing gets built out of those same parts, and one where it survives as long as the shape or the function is preserved. The bit I can't solve is the ending. I want them to have to honour two claims at once: an insurer who only pays out if a work of art was destroyed, and a supplier who invoices for material that was returned and reused. If the work went out of existence but the material didn't, both claims are good, and I want them to feel how strange it is that both can be paid without ever counting a single thing on the table twice. I'd also like them to come away seeing that the two ledgers can't both stay consistent with their own rules -- something has to give, and that what gives is usually decided silently.

  Could you design this properly and write it up for me to run, please? I'm not after a handout for the students, I want the facilitator's version. Use these sections, in this order: Setup (room, materials, teams, how the 75 minutes are carved up, roughly 120 words); The run of play (the cards in order, the ledger and scoring rules, what the teams physically do, and a note on which card is meant to produce which bit of confusion, roughly 500 words); The squeeze at the end (how to stage the two-claims finish so it lands as a genuine bind rather than a puzzle with a right answer, roughly 150 words); Debrief (mapping what happened back onto the philosophy -- moment by moment, not a lecture outline, roughly 300 words); What will go wrong the first time (roughly 200 words); and What the activity can't reach, i.e. which part of the puzzle I'll have to supply from the front of the room because the game can't produce it (roughly 120 words). Keep it runnable on a normal seminar budget, no money and no props I'd have to order in.
reasoning: |-
  We are designing a classroom activity for a metaphysics course on material constitution. The goal is to have students engage with the problem of persistence and identity through a hands-on activity with plasticine and ledger sheets. The activity involves a sequence of transformations, and students must track the existence of "works" (artworks) and "material" (the physical stuff) according to two different sets of rules. The key is to create a situation where students have to make repeated judgments and notice a tension at a specific point.

  Let's break down the sections as requested:

  ### 1. Setup (120 words)
  - **Room**: Regular seminar room with tables for 6 teams (each of 3 students). 
  - **Materials per team**: 
    - One lump of plasticine (about the size of a tennis ball, easily malleable).
    - Two ledger sheets: one labeled "Works Ledger" (for tracking artworks) and one labeled "Materials Ledger" (for tracking the material stuff). 
    - Pens/pencils for writing.
  - **Time allocation (75 minutes total)**:
    - 10 min: Introduction and setup (distribute materials, explain rules).
    - 40 min: The run of play (executing the sequence of 8 commission cards, each taking about 5 minutes).
    - 10 min: The squeeze at the end (the two-claims scenario).
    - 15 min: Debrief and discussion.

  ### 2. The run of play (500 words)
  **Commission Cards (in order)**: Each card instructs an action. After each action, teams update both ledgers and note births/deaths. They record:
    - Number of works and material things currently existing.
    - For each ledger, which entries (if any) have gone out of existence and which new ones have come into existence.

  **Ledger Rules**:
  - **Works Ledger**: 
    - A work comes into existence when a new artwork is intentionally created (by shaping the material with artistic intent).
    - A work ceases to exist when it is destroyed (e.g., squashed, ground, or when its form is fundamentally altered beyond recognition as that work).
    - **Persistence Rule 1 (Dominant in Works)**: A work survives as long as its original form or function is preserved (shape/function persistence). If the shape/function is lost, the work is destroyed.

  - **Materials Ledger**:
    - A material thing (e.g., a lump) comes into existence when a new portion of material is formed or when it is separated from a larger portion.
    - A material thing ceases to exist when it is destroyed (e.g., ground to powder) or when it is merged with another and loses its distinct identity.
    - **Persistence Rule 2 (Dominant in Materials)**: A material thing survives as long as it retains enough of its original parts and there is no rival thing built from the same parts at the same time (mereological persistence). 

  **Scoring for Consistency** (applied after each card):
  1. **Nothing from nothing**: Every new entry must come from an existing entry (or entries) that cease to exist or are transformed.
  2. **No two things in the same place at the same time**: Only one material thing can occupy a given space at a time, and only one work can be associated with a given portion of material at a time (unless the rules allow for co-location, which they don't in this setup).
  3. **One birth and at most one death per entry**: Each new entry must have a cause (an existing entry that dies or is transformed) and each death must be recorded.

  **The Cards (with intended confusion points)**:

  1. **Card 1: Form the lump into a figure.**
     - Action: Shape the plasticine into a recognizable figure (e.g., a humanoid).
     - Intended: A new work is created. The lump of material continues. Teams should record a birth in the Works ledger (e.g., "Figure 1") and note that the material (e.g., "Lump A") continues. No death in Materials.

  2. **Card 2: Squash it flat.**
     - Action: Flatten the figure completely.
     - Intended: The work (Figure 1) is destroyed (because the form is lost). The material (Lump A) continues. Teams record the death of Figure 1 in the Works ledger. Materials unchanged.

  3. **Card 3: Recast it as something completely different.**
     - Action: Shape the flattened plasticine into a new figure (e.g., an animal).
     - Intended: A new work is created (e.g., "Animal 1"). The material (Lump A) continues. Teams record the birth of Animal 1 and note that Lump A persists.

  4. **Card 4: Stick on a new limb.**
     - Action: Add a small piece of plasticine (from a reserve provided at the start, not part of the original lump) to the existing figure to form a new limb.
     - Intended: The original work (Animal 1) is destroyed because the form is altered? Or does it survive? This is a point of tension. The material: the original Lump A plus the new piece (call it Lump B) now form a new material entity (Lump C). Alternatively, Lump A continues and Lump B is merged? Teams must decide. The new work (e.g., "Animal 2") is created. But note: if they consider the form to be preserved enough, the work might continue. This is where the two rules might clash.

  5. **Card 5: Cut a limb off and put it in a drawer.**
     - Action: Remove the limb that was added (or a limb from the current figure) and place it in a drawer (a separate location, e.g., a box or a marked area on the table). The main figure remains.
     - Intended: The removal of the limb destroys the original work (if form is essential) or not? The material: the main portion (Lump A) continues, and the limb becomes a new material thing (Lump D). The work: if the main figure is still recognizable, the work might persist (but now missing a limb). Alternatively, a new work is created? And the limb in the drawer is not a work (unless they consider it one, but the card doesn't say to make it a work).

  6. **Card 6: Take that drawer limb out again and build a second work with it while the first one is still sitting there.**
     - Action: Take the limb from the drawer and shape it into a separate, new artwork (e.g., a small figure) without altering the main figure.
     - Intended: A new work is created (e.g., "Figure 2") from the limb material. The material for the limb (Lump D) is now shaped into Figure 2. The main work (if it still exists) is unchanged.

  7. **Card 7: Grind the whole thing to powder.**
     - Action: Take both the main figure and the new small figure (if they are separate) and grind them together into a single pile of powder.
     - Intended: Both works (if they existed) are destroyed. The material: the original material (Lump A and Lump B, now merged) is destroyed because it is reduced to powder? Or does the powder constitute a new material entity? The powder is a new material entity (Powder P).

  8. **Card 8: Press the powder back into a lump.**
     - Action: Compress the powder into a new lump.
     - Intended: A new material entity (Lump E) is created. No work is created unless they are instructed to form it (but they are not). So only a material birth.

  **Note on Confusion Points**:
  - Card 4: The addition of a limb forces a decision about whether the original work survives. The Works ledger (shape/function) might say the work continues (if the alteration is minor) or is replaced. The Materials ledger must account for the new piece: if merged, the old material entity dies and a new one is born? Or does the original material entity continue and the new piece is absorbed? This is a classic mereological change.
  - Card 5: Removing a limb: if the work is defined by form, then the main work might survive (without the limb) but the limb becomes a separate material entity. But is the limb a work? Not unless they decide it is (the card doesn't say it is). This highlights the intentional aspect of artworks.
  - Card 6: Creating a new work from the limb: now the limb material is used to create a new work, while the main work is still present. This might cause co-location issues? But the limb is in a different location. However, the material that was once part of the main work is now in a new work. The main work might be considered to have lost that part, but does that destroy it? This is where the two persistence rules might conflict.

  ### 3. The squeeze at the end (150 words)
  After the sequence, introduce two claims:
  - An insurer claims that a specific work (e.g., the first figure) was destroyed (at step 2, when it was squashed). The insurer requires that the work's destruction be recorded and that it is not still existing (so they can pay out).
  - A supplier claims that the added limb (from step 4) was returned and reused (at step 6, when it was taken from the drawer and made into a new work). The supplier requires that the material was returned (so they can be credited for the return) and then reused (so they can invoice for the reuse).

  The bind: The insurer's claim requires that the work (the first figure) was destroyed and no longer exists. The supplier's claim requires that the material of the limb was returned (so it ceased being part of the original work) and then reused (so it became part of a new work). 

  To honor both:
  - The work (first figure) must have been destroyed (so it doesn't exist now) and the material of the limb must have been returned (so it was separated from the original work) and then reused (so it exists in a new work). 

  But note: if the first figure was destroyed at step 2 (squashing), then the insurer is happy. But the limb wasn't added until step 4, so the supplier's claim about the first figure's limb doesn't apply to that same work? We need to adjust the claims to target the same work.

  **Adjustment**: 
  - Let the insurer claim the destruction of the animal work (created at step 3) at step 5 (when the limb was cut off). They claim that cutting off the limb destroyed the animal work.
  - The supplier claims that the limb (added at step 4) was returned (at step 5, when it was put in the drawer) and then reused (at step 6, when it was made into a new work).

  Now, for the insurer: they require that the animal work was destroyed at step 5. But if the team's rule in the Works ledger says that the animal work survived the limb removal (because the form was still recognizable), then it wasn't destroyed until step 7 (grinding). Then the insurer wouldn't pay. Alternatively, if the team recorded the animal work as destroyed at step 5, then the insurer pays.

  For the supplier: they require that the limb material was returned (so it ceased to be part of the work) and then reused. If the team recorded that the limb material was returned (so a new material entity was created at step 5) and then that material was used to create a new work at step 6, then the supplier is happy.

  The bind: If the team recorded the animal work as destroyed at step 5 (to satisfy the insurer), then they must have recorded that the animal work ceased to exist. But then, what happened to the material? The material of the animal work (minus the limb) must have continued? But the limb was removed and became a separate material entity. So the animal work's material is now two separate things? And if the animal work is destroyed, then the material that constituted it (the main portion) must have either ceased to exist or continued? 

  But note the supplier's claim: they are only concerned with the limb. The limb was returned and reused. This can be recorded without affecting the animal work's destruction. However, the insurer's claim about the animal work being destroyed at step 5 requires that the animal work no longer exists. But the main portion of the animal work (without the limb) might still be sitting there. If the team's Works ledger rule says that the animal work was destroyed because it lost a limb, then they must record a death. But then what about the main portion? Is it a new work? Or just a remnant? 

  The bind is that to satisfy the insurer, they must record the death of the animal work at step 5. But then, if they are to avoid double-counting, the material of the animal work (the main portion) must either:
  - Cease to exist (which it didn't) or 
  - Continue as a new material entity? 

  But the Materials ledger should record the main portion as continuing (if they follow mereological persistence) and the limb as a new material entity. So there's no problem in the Materials ledger. 

  The conflict is actually in the Works ledger: if the animal work is destroyed at step 5, then they must record a death. But then, what is the main portion? If they create a new work for it (say, "Animal 1a") at step 5, then they are creating a new work without a commission? The commission card at step 5 only says to cut off the limb and put it in the drawer, not to create a new work. So if they are strict, they cannot create a new work. Therefore, the main portion is not a work? Then the animal work is gone, and the material of the main portion is just material (not a work). 

  But then at step 6, the main portion is still sitting there. When they are instructed to build a second work with the limb (step 6), they do nothing to the main portion. So it remains a non-work. Then at step 7, they grind the whole thing (including the main portion). The grinding destroys the material? 

  The insurer is paid because the animal work was destroyed at step 5. The supplier is paid because the limb was returned (step 5) and reused (step 6). 

  But the strangeness: the animal work was destroyed, but the material that constituted it (the main portion) continued to exist until step 7. And the insurer doesn't care about the material, only the work. So both claims are valid without double-counting. 

  The point of the squeeze is to show that the destruction of the work does not entail the destruction of the material. They are tracked separately. This is the key to the puzzle: the two ledgers are independent. However, the tension arises when the same physical changes force decisions in each ledger that might be in conflict. In this case, at step 5, the Works ledger might record a death (if they follow a strict form persistence) while the Materials ledger does not record a death for the main portion. 

  But the activity must highlight that the team's own rules might lead to a conflict. The insurer and supplier scenario forces them to commit to specific events (death of the work and return of the material) and then they must see if their ledger entries support both.

  ### 4. Debrief (300 words)
  After the squeeze, guide the students to reflect on the sequence and the two claims:

  - **Card 1**: Created a work and the material. They noted that the same physical stuff is both a work and a material. This is the initial coincidence of the statue and the lump.

  - **Card 2 (squash)**: The work is destroyed but the material persists. This shows that the work and the material can come apart: the lump survives the destruction of the statue.

  - **Card 3 (recast)**: A new work is created from the same material. The material persists through the change of form. The original work (if they considered it to have been destroyed at step 2) is gone, so the new work is a new entity.

  - **Card 4 (add limb)**: This is the first major tension point. The addition of a new piece of material forces a decision: 
    - In the Works ledger: if the team considered the work to have survived (because the form was not fundamentally altered), then the work continues. If not, they record a death and a birth. 
    - In the Materials ledger: the new piece is added. They must decide: is the original material entity destroyed and replaced by a new one (composed of the old and new)? Or does the original material entity absorb the new piece and continue? 
    - This highlights the problem of mereological change and the Ship of Theseus.

  - **Card 5 (cut limb)**: Removing a limb. In the Works ledger: does the work survive the loss of a part? In the Materials ledger: the limb becomes a separate material entity. The work and the material are now spatially separated.

  - **Card 6 (build second work)**: The limb is made into a new work. This creates a new work and uses the material of the limb. The main work (if it still exists) is now distinct from the new work. This might cause a problem if the limb was once part of the main work: the same material is now in two works? But note: the limb was removed and is now in a new work. So no co-location. The issue is about the persistence of the main work.

  - **Card 7 and 8 (grind and press)**: The destruction of all works and the material (which becomes powder) and then a new lump is formed. This shows that the material can be completely transformed and then reconstituted.

  The two claims (insurer and supplier) show that the destruction of a work (for the insurer) does not require the destruction of the material (the supplier's claim about the limb is about the material being returned and reused). The material that was part of the destroyed work continues to exist and can be reused. This is the core of material constitution: the same matter can be part of different objects at different times, and the objects (works) can be destroyed while the matter persists.

  The debrief should emphasize that the two ledgers are governed by different persistence conditions. The conflict arises when a physical change (like adding a limb) might be a minor alteration for the work (so it survives) but a significant mereological change for the material (so it might be considered a new material entity). The activity forces them to choose, and they might have chosen differently at different points. The key philosophical insight is that our ordinary ways of tracking objects rely on different criteria for different kinds of things, and these criteria can conflict.

  ### 5. What will go wrong the first time (200 words)
  - **Ledger confusion**: Students may mix up the two ledgers or not understand what counts as a birth or death in each. They might forget to record deaths when a new thing is created from an old one.

  - **Persistence rule application**: Teams might inconsistently apply the persistence rules. For example, they might use the material rule for works or vice versa. They might change their rules mid-sequence to avoid inconsistency.

  - **Card 4 and 5**: The addition and removal of the limb are likely to cause the most confusion. Teams might not know whether the work survives. They might also struggle with the material ledger when adding the limb: if they merge the new piece, do they record the death of the original lump? 

  - **The squeeze**: Students might not see the conflict in the two claims. They might think that both claims are easily compatible (as they are) and not feel the bind. The facilitator must emphasize that the insurer requires the work to have been destroyed at a specific time (step 5) and the supplier requires the material to have been returned (at step 5) and then reused (step 6). The issue is whether the team's own ledger entries support these events.

  - **Time management**: The sequence might take longer than 5 minutes per card, especially when teams debate. The facilitator must keep time and move on even if some teams are not done.

  - **Physical mess**: The plasticine might get mixed or lost. Having a reserve for the limb (a small piece) is important.

  ### 6. What the activity can't reach (120 words)
  The activity cannot by itself establish the philosophical theories (like perdurantism, endurantism, or constitutionalism) or the classic arguments (e.g., the Ship of Theseus, the problem of the many). It also cannot cover every variation of material constitution (e.g., fission cases like the truncated car). The activity is designed to create a vivid experience of the problem and to highlight the tension between two persistence rules. The deeper theoretical analysis must be supplied by the instructor in follow-up lectures. In particular, the activity does not address the grounding problem (how can two things occupy the same space and yet have different properties?) because it avoids co-location by having the works and materials tracked separately. The instructor will need to connect the activity to the statue/lump problem explicitly and to the literature on persistence.
answer: |-
  ### Setup  
  **Room and Materials**: Arrange tables for six teams of three. Each team needs: a tennis ball-sized plasticine lump, a reserve pea-sized plasticine piece (for Card 4), a small box ("drawer"), two ledger sheets ("Works" and "Materials"), and pens. Provide eight commission cards (index cards) in order. Use a visible timer.  
  **Time Allocation**:  
  - 0–10 min: Distribute materials, explain rules. Stress: "Works" track artworks (persist via shape/function), "Materials" track stuff (persist via part-retention). No co-location: one thing per spatial location.  
  - 10–50 min: Run commission cards (5 min/card). Teams physically manipulate plasticine, update ledgers after each card.  
  - 50–60 min: The squeeze (insurance/supplier claims).  
  - 60–75 min: Debrief.  

  ---

  ### The Run of Play  
  **Ledger Rules**:  
  1. **Works Ledger**:  
     - Birth: When artistic intent shapes material into a new form.  
     - Death: When form/function is fundamentally altered (e.g., squashed, dismembered).  
     - *Persistence Rule*: Survival requires preserved form/function.  
  2. **Materials Ledger**:  
     - Birth: When new material is added or separated.  
     - Death: When material is destroyed (e.g., powdered) or merged beyond recognition.  
     - *Persistence Rule*: Survival requires retention of >50% original parts and no rival claimant.  
  3. **Scoring (per card)**:  
     - **Nothing from nothing**: New entries must trace to existing ones.  
     - **No double occupancy**: Only one material/work per spatial location.  
     - **Clean transfers**: One birth/death per entry; deaths must be logged before births.  

  **Commission Sequence** (each card read aloud; teams act, then update ledgers):  
  1. **Form lump into a figure** (e.g., humanoid).  
     - *Goal*: Works birth (e.g., "David"); Materials unchanged.  
  2. **Squash flat**.  
     - *Confusion Point*: Works death (form destroyed); Materials persist. Teams must log death but no material change.  
  3. **Recast as something different** (e.g., animal).  
     - *Goal*: New Works birth (e.g., "Horse"); Materials persist. Tests if "squash" killed the work.  
  4. **Stick reserve piece on as a new limb**.  
     - *Confusion Point*: **Tension between ledgers**. Works: Does "Horse" survive (minor change) or die (new form)? Materials: Does original material die (merger) or absorb new piece? Forces arbitrary rule-bending.  
  5. **Cut off the added limb; place in drawer**.  
     - *Confusion Point*: Works: If "Horse" loses limb, does it die? Materials: Limb becomes new entity (e.g., "Limb-stuff"). Deaths/births must align across ledgers.  
  6. **Remove drawer limb; build second work** (e.g., bird).  
     - *Confusion Point*: New Works birth (e.g., "Bird"). Materials: "Limb-stuff" dies if reshaped? Tests if material identity requires part-retention.  
  7. **Grind everything to powder**.  
     - *Goal*: All Works die; Materials die (original parts destroyed).  
  8. **Press powder into a lump**.  
     - *Goal*: Materials birth (e.g., "New-lump"); no Works birth. Tests if "reconstitution" revives old entities.  

  **Facilitator Notes**:  
  - Card 4 is critical: Teams will bend rules to avoid "Horse’s" death (Works) or material merger (Materials). Highlight this.  
  - Card 5: If teams declare "Horse" dead, they struggle to explain the main lump’s persistence in Works.  
  - Enforce scoring: Penalize teams for unlogged deaths or co-location.  

  ---

  ### The Squeeze at the End  
  After Card 8, announce:  
  1. **Insurer Claim**: "Insurer pays only if ‘Horse’ was destroyed when the limb was cut off (Card 5)."  
  2. **Supplier Claim**: "Supplier invoices for the limb’s return (as ‘reused material’) when it was drawer-ed (Card 5) and reused (Card 6)."  

  **Staging the Bind**:  
  - Teams must check ledgers: Can both claims be honored?  
  - **Insurer requires**: Works ledger shows "Horse" died at Card 5.  
  - **Supplier requires**: Materials ledger shows limb became a distinct entity at Card 5 (returned) and birthed "Bird" at Card 6 (reused).  
  - **The bind**: If "Horse" died at Card 5 (insurer happy), the main lump *persists* in Materials but *vanishes* from Works—yet no new work was commissioned for it. If "Horse" *lived*, the insurer refuses payment.  
  - **Key reveal**: Both claims can be honored—insurer pays for work-death; supplier for material-reuse—but only by acknowledging that the *same plasticine* was tracked differently. No double-counting, but a silent rule-change occurred at Card 5.  

  ---

  ### Debrief  
  **Map Moments to Philosophy**:  
  1. **Cards 1–2 (Statue/Lump)**: Squashing killed "David" but not the lump—same matter, different persistence conditions. *Link to: Coinciding objects with modal differences*.  
  2. **Card 4 (Adding Limb)**: Teams bent rules to avoid declaring death. *Link to: Vague persistence conditions in ordinary objects*.  
  3. **Card 5 (Limb Removal)**: The "bind" moment—if "Horse" died, what is the main lump? *Link to: The problem of the many and deferred arbitrariness*.  
  4. **Card 6 (Two Works)**: Limb became "Bird" while main lump persisted—same matter, new identity. *Link to: Temporal parts vs. enduring substances*.  
  5. **The Squeeze**: Honoring both claims required accepting that:  
     - Work-death ≠ Material-death (insurer vs. supplier).  
     - Rules were *silently revised* at Card 5 to avoid inconsistency.  
     - *Link to: How metaphysics resolves tension—by privileging one criterion (e.g., form for art, parts for stuff) without admitting it*.  

  **Core Insight**: Material constitution isn’t about "right answers"—it’s about which persistence rule we *privilege* when forced. The ledgers didn’t conflict until we demanded accountability.  

  ---

  ### What Will Go Wrong the First Time  
  1. **Rule Misapplication**: Teams will conflate Works/Materials rules (e.g., applying part-retention to art). Intervene: "Check your ledger’s persistence rule."  
  2. **Card 4–5 Logjam**: 80% of debate will occur here. Teams may skip deaths to avoid inconsistency. Enforce scoring: "If no death logged, where did the new material come from?"  
  3. **Squeeze Misdirection**: Students may try to "solve" the bind (e.g., "Just pay both!"). Refocus: "Can your *ledgers* justify both claims without breaking rules?"  
  4. **Time Overruns**: Card 4/5 will take >5 min. Use a timer; move on after 5 min even if unresolved.  
  5. **Physical Chaos**: Reserve plasticine gets lost; drawers ignored. Have spares; check setup pre-Card 5.  
  6. **Superficial Debrief**: Students may fixate on the plasticine, not the metaphysics. Anchor discussion: "When did you feel forced to cheat? That’s the metaphysics breaking through."  

  ---

  ### What the Activity Can’t Reach  
  This exercise **cannot** generate the "grounding problem" (how two objects occupy the same space) because it avoids co-location by design—works and materials are tracked separately. You must **explicitly bridge** to the statue/lump case post-activity, highlighting co-location as the deeper puzzle. Similarly, it **cannot** replicate fission/fusion edge cases (e.g., Ship of Theseus). Use the activity’s tension (e.g., Card 5’s arbitrary rule-shift) to **frame your lecture** on how philosophers impose consistency (e.g., temporal parts, dominant kinds) when ontology clashes with intuition.
