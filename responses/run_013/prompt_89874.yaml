  We are going to design a game that simulates a multipolar trap (Moloch) with the following characteristics:
  - Players invest resources (points, tokens) over multiple rounds.
  - The payoff depends on relative position (ranking) and has a ratchet effect (investments are sunk costs).
  - The game should lead to a bad collective outcome even though individually rational decisions are made.
  - There should be an attempt to coordinate to stop the race, but it fails due to structural reasons.

  Game Title: "The Ladder Race" (We don't reveal the Moloch connection until debrief)

  **Concept:**
  Players are competing for a limited number of "top spots" that yield high rewards. The catch: every round, players must decide how much to invest (using tokens or points) to climb the ladder. The more you invest, the higher your chance to move up, but the investments are sunk costs. The total score is based on your rank minus your cumulative investment. The bad outcome is that everyone ends up with negative or very low scores because they invested heavily but only a few can win.

  **Key Mechanics:**
  1. **Ranking:** Players are ranked each round based on their cumulative investment (highest investment = rank 1, then rank 2, etc.). Ties are broken by current rank (if tied, the player who was higher in the previous round stays higher) or randomly if no prior rank.
  2. **Payoff per Round:** The top X players (say top 3) get a positive payoff (e.g., +10 points each) and the rest get a negative payoff (e.g., -5 points). But note: the payoff is added to your score, and then your investment for the round is subtracted. So the net for a round for a top player might be: +10 - (investment). For a non-top player: -5 - (investment).
  3. **Investment:** Each round, players secretly choose how many tokens (from 0 to a maximum, say 5) to invest. They write it down and hand it in. The facilitator (you) collects and then reveals the investments and updates the ranking and scores.
  4. **Ratchet:** Once invested, tokens are gone and cannot be used again. They are sunk costs.

  **Scoring Formula:**
  - Let R(i) be the rank of player i (1 being highest).
  - Let P(i) be the payoff based on rank: 
     - If R(i) <= 3, P(i) = +10
     - Else, P(i) = -5
  - Then, net gain for round: P(i) - (investment of i for that round)

  Total score = sum of net gains over all rounds.

  **Why it leads to a trap:**
  - Initially, players might invest a little and get positive payoffs if they are in the top. But as others invest more, you have to invest more to stay in the top. 
  - The cost of falling out of the top is high (you get -5 and still pay the investment). So even if the investment is high, the fear of falling behind forces players to keep investing.
  - Eventually, the investments become so high that even the top players end up with low net gains (e.g., 10 - 5 = 5, but then 10 - 6 = 4, etc.), and non-top players get very negative (-5 - 5 = -10). 
  - The collective outcome is that the total points in the system are being drained by the investments (which are sunk and taken out of the system) and the negative payoffs for the majority.

  **Attempt to Coordinate:**
  At a certain point (say after round 3 or 4, when scores are starting to look bad), you call for a pause. You propose a pact: everyone agrees to invest 0 for the next round. But then the game continues, and players might break the pact. Why? Because if everyone else invests 0, then even a small investment (say 1) by one player would get them into the top and a big payoff (10 - 1 = 9). And because the pact is non-binding and there's no enforcement, any rational player would break it. Also, players might fear that others will break it, so they break it preemptively.

  **Setup:**
  - Materials: 
     - Paper and pens for each player to write down investments.
     - A whiteboard or poster to track: 
          - Current round
          - Each player's cumulative investment (to determine rank)
          - Each player's current total score
     - Tokens (optional) to represent points? But we are using a scoreboard so we can just use numbers.
     - Alternatively, use candy as points? But then we need to handle negative scores. Instead, let's use a ledger on the board.

