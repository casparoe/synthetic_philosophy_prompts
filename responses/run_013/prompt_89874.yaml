  **Game Flow:**
  1. Introduction (2 minutes): Explain the rules without giving away the trap. 
     - "This is a multi-round investment game. In each round, you will decide how much to invest by writing a number between 0 and 5. The more you invest, the higher your rank. Your rank is based on your total investment so far (highest total investment = rank 1). 
     - Each round, the top 3 ranked players get +10 points. All others get -5 points. 
     - Then, your investment for the round is subtracted from your points. 
     - Example: If you are top 3 and invest 3, your net for the round is 10 - 3 = 7. If you are not top 3 and invest 2, your net is -5 - 2 = -7. 
     - Your total score is the sum of net gains over rounds. 
     - Goal: Maximize your total score."

  2. Rounds (about 20-25 minutes total for 6 rounds):
