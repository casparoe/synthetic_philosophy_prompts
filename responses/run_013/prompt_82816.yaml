  Explain the conceptual core of Simpson's paradox, treated as the reference class problem in statistical clothing. Begin with two cases you construct yourself: one population in which a treatment is associated with a worse outcome overall yet with a better outcome within every stratum of a third variable, and a second case with an identical pattern of numbers in which it is the stratified comparison that misleads. Then work through what separates them: what determines which partition of the data is the right one to condition on; why a reversal can be a fact about the world rather than an arithmetic trick; the difference between a reversal driven by confounding, one driven by conditioning on a variable that is a common effect of the exposure and the outcome, and a mere discrepancy in magnitude produced by a non-collapsible summary measure such as an odds ratio, which survives even with perfect causal knowledge; and why the paradox is often said to dissolve once the question is made precise. Assess whether the reference-class framing earns its keep, and close by sorting the pieces into what is mathematical, what is causal, and what is a normative choice about which question matters. Answer in American English.
