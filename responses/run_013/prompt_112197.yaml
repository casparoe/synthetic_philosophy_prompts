  In the progressive half (stanzas 1-3), I'll show the program making bold predictions: mapping uncharted regions, predicting novel phenomena, extending laws to new domains. The protective belt (the lines surrounding the end-words) should feel expansive and generative.

  In the degenerating half (stanzas 4-6), the same end-words will appear in defensive contexts: reinterpreting anomalies, dismissing contradictions, narrowing definitions. The protective belt will feel reactive and strained.

  For the envoi, I'll introduce "light" as the external word - suggesting both a stubborn anomaly and the illumination of a rival program. The closing lines will convey being overtaken rather than defeated, with the core words persisting but now hollow.

  The scientist's voice should blend pride with creeping doubt, their defense of the core becoming more rigid as the program degenerates. The poem must work both as a philosophical demonstration and as a human portrait of intellectual investment facing obsolescence.
answer: |-
  ## The Held Constants

  I built my life around this steadfast **core**,
  These axioms that form our central **law**,
  The deep foundations of accepted **truth**.
  Each challenge met with structured **proof**,
  Each stubborn, strange, recalcitrant **fact**
  Assigned its place upon the shifting **base**.

  We mapped the voids where no known **base**
  Existed yet, projections from the **core**.
  Predicted where we'd find the missing **fact**,
  A consequence derived from sacred **law**.
  Its novel presence served as living **proof**
  That we alone grasped Nature's deepest **truth**.

  Beyond the curve, a new domain of **truth**
  Revealed itself, confirming our strong **base**.
  We saw the pattern, held the shining **proof**,
  Extending from the unassailable **core**.
  We staked our claim where no prior **law**
  Had dared to tread, foretelling every **fact**.

  But then it came – that one discordant **fact**,
  A flicker out of sync with stated **truth**.
  It should have bowed to our established **law**,
  Conformed itself unto the solid **base**.
  We called it noise, protecting still the **core**,
  Invented terms to blunt its awkward **proof**.

  Re-interpreting the awkward **proof**,
  We re-defined the troubling outlier **fact**.
  (Ambiguous, the readings near the **core**!)
  We labelled it a complex form of **truth**,
  A special case upon the wider **base**,
  Exempted from the standard, simple **law**.

  We parsed the terms of each contested **law**,
  Dismissed the weight of every hostile **proof**,
  Insisted on the old familiar **base**.
  Explained away each fresh, unwelcome **fact**
  As measurement obscured the constant **truth**
  Defended deep within our shielding **core**.

  The **core** endures, though **proof** grows thin. That **fact**
  Persists like **light**, beyond our **law**'s embrace;
  Our **base** feels frail. Was all this **truth**... misplaced?

  ---

  **Stanza-by-Stanza Analysis (Lakatosian Lens):**

  1.  **Stanza 1 (Progressive):** Establishes the core and its protective function ("Assigned its place"). Ends with a positive heuristic move: predicting new facts ("Predicted where we'd find the missing fact") beyond the current base. Generative.
  2.  **Stanza 2 (Progressive):** Shows successful novel prediction ("Beyond the curve... Revealed itself") confirming the extension of the law and base. Actively expanding territory ("foretelling every fact"). Confirms progress.
  3.  **Stanza 3 (Progressive):** Introduces the first anomaly ("that one discordant fact") but frames the response proactively ("Invented terms") as part of extending the program into complexity. Still generative, though the strain is hinted at ("awkward").
  4.  **Stanza 4 (Degenerating - Pivot):** The turn. Focus shifts entirely to defense. Actions are reactive ("Re-interpreting," "re-defined," "dismissed," "Explained away"). The anomaly is no longer a prediction target but a problem to be absorbed ("troubling outlier," "complex form").
  5.  **Stanza 5 (Degenerating):** Degeneration deepens. Effort shifts to semantic protection ("parsed the terms," "labelled it"), dismissing counter-evidence ("Dismissed the weight"). The core is shielded ("shielding core") but no new ground is broken. Focus is on preserving the existing base.
  6.  **Stanza 6 (Degenerating):** Admits the strain ("though proof grows thin") but clings rigidly. The "fact" becomes an external, unassimilated irritant ("Persists like light"). The core remains, but the protective belt is failing to convincingly absorb challenges.
  7.  **Envoi (Supersession):** The core words remain ("core," "proof," "fact," "law," "base," "truth"), but the intrusion of **"light"** is decisive. It represents the unassimilated anomaly *and* the illuminating power of the rival programme. The final question ("Was all this truth... misplaced?") conveys overtaking, not direct refutation. The rival's "light" makes the old programme seem dim, potentially wrong ("misplaced"), without explicitly falsifying its core. The scientist is questioning, not logically defeated.

  **Human Portrait:** The poem traces the arc of a life's dedication. The early stanzas pulse with the excitement of discovery and confident expansion. The middle shows the first defensive strain. The later stanzas reveal the brittleness of rigid defense, the rationalizations, and the dawning, painful realization – not that the core is *wrong* per se, but that its light has faded, its explanations feel hollow, and the world might be moving on to a brighter understanding. The scientist's voice shifts from confident builder to strained defender to someone questioning the foundation of their life's work, overtaken by a new perspective ("light").
