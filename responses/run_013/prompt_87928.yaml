  I need to design a scenario that meets all these criteria. The conflict must arise from two equally strong obligations rooted in different sources—one chosen, one unchosen—and be perfectly symmetrical. No prior mistakes or escape hatches like partial solutions. The stakes should be incommensurable to avoid a tie. 

  For the theoretical part, I'll contrast a deontological view (seeing it as a true dilemma where both choices involve wrongdoing) with a consequentialist perspective (prioritizing the immediate crisis). The core tension should hinge on the symmetry of unchosen obligations. If removed, it collapses into a simpler conflict where the unchosen duty might override the chosen one. 

  The strongest counterargument would challenge whether the unchosen obligation truly binds when fulfilling it would cause catastrophic harm. I'll keep the example tight—one paragraph, realistic, no fluff. The parent-teacher scenario fits: both roles demand presence at critical moments, with equivalent stakes and no way to split attention. Perfect symmetry when swapping perspectives, and no prior negligence. The outcomes are distinct (educational harm vs physical danger) but neither trivial.
answer: |-
  Here’s a scenario designed to meet your specifications:

  **The Scenario: The Overlapping Emergency**  
  Alex is a parent and a volunteer firefighter. Their 10-year-old child is performing in a school play that starts in 15 minutes, and Alex promised weeks ago to attend—this event is crucial for the child’s confidence. Simultaneously, Alex’s pager alerts: they are the *only* qualified responder available for a house fire 5 minutes away where a neighbor (known to be home alone and immobile) is trapped. The fire station is 10 minutes away; waiting for other responders guarantees the neighbor dies. Driving directly to the fire saves the neighbor but makes Alex miss the play entirely. Driving to the play first (even just to drop in for 2 minutes) ensures the neighbor dies. Phone calls are impossible (dead zones). Alex *must* drive now—one direction or the other.

  **Why it resists the "cheap moves":**
  1.  **Ought implies can?** The obligations are clear and persistent: *Parental promise* demands presence at the play; *Firefighter duty* (undertaken voluntarily but now binding) demands immediate response to save a life. Neither obligation vanishes upon noticing the conflict. Alex *can* physically drive to either location; the "can't" is about fulfilling both *simultaneously*, not about the obligations ceasing to exist.
  2.  **Priority rule?** The obligations stem from different sources: one chosen (firefighter role), one unchosen (parental responsibility). Crucially, the case is symmetric: Swap "parent/child/play" with "firefighter/neighbor/fire". The description reads identically – a person with role-obligation to Party A (chosen) and role-obligation to Party B (unchosen), both facing severe harm if neglected, with only time to reach one. Neither source inherently trumps the other.
  3.  **Should have seen it coming / Prior fault?** No prior negligence. The fire is random. The play time was fixed weeks ago. The simultaneous emergency and absence of other responders are unforeseeable coincidences. Alex made reasonable commitments.
  4.  **Uncertainty about obligation?** Both demands are crystal clear: be at the play now to uphold a vital promise, go to the fire now to save a life. The dilemma isn't *whether* these are obligations, but *which* to fulfill.

  **Incommensurability:** The harms are distinct and non-fungible: profound emotional/developmental harm to the child vs. death of the neighbor. Neither is clearly "worse" in a way all theories agree upon, and they represent different *kinds* of values (relational integrity vs. preservation of life).

  ---

  **1. Theories & Analysis:**
      *   **Genuine Dilemma (Agent-Centered Deontology - e.g., Rossian Prima Facie Duties):** Ross argues we have multiple fundamental, non-absolute duties (e.g., fidelity, beneficence, non-maleficence). Here, *fidelity* (to the promise made to the child) and *beneficence/non-maleficence* (saving the neighbor's life) conflict as equally stringent prima facie duties. Whichever duty Alex acts on, they *violate* the other equally fundamental duty. Alex necessarily does something wrong (fails a genuine duty) whichever choice is made. The moral residue is real.
      *   **Not a Dilemma (Act Consequentialism - e.g., Simple Utilitarianism):** The right act maximizes overall good. Saving a life (preventing death) almost always outweighs preventing profound emotional harm (even to one's own child) in a straightforward hedonic calculus. The neighbor's death is a far greater net loss of well-being. Therefore, Alex is *required* to go to the fire. Failing the promise is regrettable but not morally wrong *all things considered* because it was the act with the best consequences.

  **2. The Core Feature & Collapse:**
      *   **The Core Feature:** **The Symmetry of the Unchosen vs. Chosen Obligation Sources combined with equivalent catastrophic stakes for both parties.** The parent-child bond creates a powerful, unchosen duty; the firefighter role creates a powerful, chosen duty. The stakes (life vs. potentially life-altering harm) are presented as equivalently catastrophic *for the affected parties*, and swapping roles makes the case identical.
      *   **Collapse if Removed:** If you break the symmetry (e.g., make the fire threat *clearly* worse than missing the play, or make the parental obligation *clearly* weaker), the dilemma collapses. For instance, if the neighbor's death is portrayed as objectively worse, Act Consequentialism wins easily. If the firefighter role is seen as inherently less binding than parenthood due to being chosen, a priority rule emerges (parental duty overrides). The case becomes a resolvable conflict where one obligation clearly overrides the other.

  **3. Defense for the Second Theory (Consequentialism):**
      The most plausible move by the consequentialist to dissolve the dilemma is: **"The obligation to the child is not truly *equivalent* to the obligation to the neighbor when consequences are impartially weighed. While breaking the promise causes significant harm, the *death* of the neighbor is an incomparably greater harm. Therefore, the 'obligation' to attend the play is *overridden* by the vastly stronger obligation to prevent death. Alex faces a tragic choice, but only one option is morally permissible. The 'dilemma' arises from mistakenly assigning equal weight to objectively unequal outcomes."** This leverages the core consequentialist claim that moral weight lies solely in outcomes, not in the source of the obligation (chosen/unchosen) or special relationships when impartial calculation dictates a vastly better outcome from one action.
