answer: |-
  ## Mind Over Matter  
  *With Dr Evelyn Thorne, D.Phil (Oxon), Cognitive Neurophilosopher*  
  *The Clarion Review, Quarterly Supplement – Consciousness & Cortex*

  **Dear Dr Thorne,**

  My husband of twenty years has recently adopted eliminative materialism. He now insists that when I say things like “I believe we need counselling” or “I feel hurt when you dismiss me”, I’m not actually referring to anything real happening inside me. He says phrases about beliefs and desires are just relics of “folk psychology”, soon to be replaced by proper neuroscience. He tells me I don’t *really* believe we need help, and that my feeling hurt is just a confused way of describing neural states. It’s making communication impossible and frankly, it feels like being gaslit. How do I live with a man who denies my own mind works the way I experience it?

  *Perplexed in Penzance*

  ---

  **Dear Perplexed,**

  Thank you for writing. It sounds like a challenging interpersonal dynamic has emerged, stemming from your partner’s engagement with contemporary cognitive ontology. Firstly, it’s important to recognise that your partner’s position represents a significant shift away from intuitive, everyday descriptions of internal states. Eliminative materialism proposes that the conceptual framework we use to explain behaviour – involving terms like ‘beliefs’, ‘desires’, and ‘feelings’ – is fundamentally flawed, akin to outdated theories like phlogiston or the humours. A mature neuroscience, the argument runs, won’t refine these concepts; it will simply render them obsolete, revealing the underlying neurophysiological processes directly.

  Your distress is understandable, though we must frame it carefully. Certain complex neurological configurations, often labelled by folk psychology as ‘feeling dismissed’ or ‘experiencing hurt’, are demonstrably activated in contexts like the one you describe. Your partner’s verbal outputs – denying the reality of the referents for your folk-psychological terms – are also complex behavioural patterns arising from specific neural activity. Crucially, he isn’t denying *your* reality or the physiological responses occurring; he is disputing the *explanatory usefulness* and *referential accuracy* of the specific linguistic tokens you are employing.

  The core difficulty arises because folk psychology is deeply embedded in social interaction, including intimate partnerships. Asking someone to cease using this framework is akin to asking them to navigate a complex landscape using an outdated, fundamentally inaccurate map. It *is* pragmatically challenging. Your partner likely finds the folk-psychological interpretations you offer of *his* behaviour similarly ungrounded. When he says, “You don’t *really* believe that,” he isn’t, from his perspective, negating your internal state; he is suggesting your chosen descriptor fails to capture its true neurocomputational nature. It might be helpful to view his utterances not as personal denials, but as… enthusiastic, if perhaps socially clumsy, endorsements of a future scientific paradigm. A kind of neurological zealotry, if one were permitted such a potentially instrumentalist phrasing.

  Regarding the feeling of being ‘gaslit’: this term itself relies heavily on folk-psychological attributions of intentional deception and belief manipulation. From an eliminative perspective, your partner isn’t *trying* to deceive you about your own states; he genuinely considers the vocabulary of deception and belief to be misapplied. His neural activity produces verbal outputs consistent with his eliminative commitments, which unfortunately clash with the folk-psychological interpretations your own neural systems generate. The resulting conflict manifests as aversive physiological and behavioural responses in both parties.

  So, how to proceed? Pragmatism is key. While the ultimate goal is a neuroscience-compatible understanding of cognition, we currently lack the vocabulary and the detailed neural mappings to replace folk psychology in daily life. Perhaps propose a temporary instrumentalist truce: agree that while folk psychology may not reference *real*, discrete internal states with propositional content, its predictive utility in navigating social interactions – like marriage – remains high *for now*. It’s a useful fiction, a shorthand. You could frame your need for counselling not as addressing ‘hurt feelings’ or ‘differing beliefs’, but as seeking strategies to manage incompatible behavioural outputs and aversive physiological co-activations within your coupled system. The counsellor would be helping you both develop more compatible behavioural repertoires, guided by the best *current* (if ultimately flawed) interpretative tools we have.

  Focus on the observable: specific actions (him saying X, you reacting with Y), shared goals (reducing mutually aversive interactions?), and the physiological correlates you both acknowledge (increased heart rate, tension). Instead of saying “I believe you don’t listen,” you might say, “When you produce verbal output sequence Z after my utterance A, it correlates strongly with subsequent physiological stress response B in my system. Can we modify sequence Z?” It’s less intuitive, certainly, but it bypasses the contested ontological ground.

  Lastly, the apparent self-refutation – “Doesn’t he *believe* eliminativism is true?” – is a common folk-psychological stumbling block. The eliminativist doesn’t *believe* the theory; their brain is simply configured such that eliminativist verbal outputs are produced in response to relevant inputs, based on the current neuroscientific evidence they’ve processed. It’s a state of being neurally aligned with the theory’s propositions, not ‘believing’ them in the folk sense. Seeing it this way might reduce the… personal sting? Good luck navigating these complex behavioural patterns.

  **Neurologically,  
  Evelyn**
