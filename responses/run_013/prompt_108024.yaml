prompt: |-
  I chair the research-subjects committee at a neuroscience institute. Our policy runs on two tracks: animal protocols, which require analgesia, humane endpoints, and a harm–benefit review, and human-subjects protocols, which require consent and withdrawal rights. Cultured tissue has always fallen outside both. We register it as biological material and move on.

  Next week we review a protocol from a lab that cultures human stem-cell-derived neural tissue on a multi-electrode array and closes a feedback loop between the tissue and a simulated body, so that the culture learns to avoid a stimulus. The lab's position is that this is tissue in a dish rather than an animal, so neither track applies and no welfare conditions attach. One member objects that the only thing the animal track protects is the capacity to suffer, and that if mental states are multiply realizable then substrate cannot be what settles the question — so we either extend the track or concede we never meant it. Another replies that multiple realizability is a claim about mental-state types, not about which systems have them, and brings us no closer to whether this culture feels anything. A third warns that any criterion loose enough to catch the culture will also catch the calibration software driving the simulated body, and possibly the lab's own controller.

  Please draft the decision memo I will circulate before Thursday's meeting. It should give a clear recommendation with conditions rather than a survey of views; state a criterion the committee can apply to the next case and not merely this one; specify concrete protocol requirements — what, if anything, stands in for analgesia and humane endpoints here — along with a review date; give an honest account of the strongest argument on the side we reject; and rule on the calibration software and the simulation itself, saying whether our criterion reaches them and, if not, on what principled basis we exclude them.
reasoning: |-
  We are facing a novel protocol involving cultured human neural tissue integrated with a simulated body in a feedback loop, raising questions about ethical oversight. Our current policy has two tracks: animal protocols (requiring analgesia, humane endpoints, harm-benefit review) and human-subjects protocols (requiring consent and withdrawal rights). Cultured tissue has been treated as biological material without welfare conditions. This protocol challenges that classification.

  Key arguments presented:
  1. Objection: The animal track protects the capacity to suffer, and if mental states are multiply realizable, then the substrate (animal vs. tissue) should not be the deciding factor. Thus, we must extend the animal track or concede we never intended it to protect the capacity to suffer.
  2. Counter: Multiple realizability is about mental-state types (e.g., pain can be realized in different substrates) but does not tell us which systems actually have mental states. We are no closer to knowing if this culture feels anything.
  3. Warning: If we set a criterion loose enough to include the culture, it might also include the calibration software or the lab's controller, leading to absurdity.

  The memo must:
  - Give a clear recommendation with conditions.
  - State a criterion applicable to future cases.
  - Specify concrete protocol requirements (analogues to analgesia, humane endpoints) and a review date.
  - Honestly present the strongest argument against the chosen position.
  - Rule on whether the calibration software and simulation are included, and if not, on what basis we exclude them.

  **Recommendation:**
  We should apply a modified version of the animal track to this protocol, with specific conditions. The criterion for inclusion is the presence of a *minimally sentient system* (defined below). This system is integrated and exhibits adaptive learning in a way that suggests it might have the capacity for valenced experience (pleasure/suffering). We do not extend the same considerations to the calibration software or the simulation because they lack the biological basis and integrated neural function that we take as indicators of sentience.

  **Criterion for future cases:**
  A system falls under the animal track if it:
  - Is a biologically derived neural tissue culture (human or animal) that is *integrated* (i.e., capable of processing information in a way that generates coherent, adaptive behavior in a closed-loop environment) and
  - Is designed to learn or adapt in a goal-directed manner that may involve aversive or rewarding stimuli.

  This criterion excludes non-biological systems (like software) and non-integrated tissue (e.g., simple cell cultures without feedback loops). It is based on the precautionary principle: when there is a plausible risk of sentience, we err on the side of protection.

  **Concrete Protocol Requirements:**
  1. **Harm-Benefit Review:** The lab must provide a harm-benefit analysis, detailing the scientific value, potential harms (including distress to the culture), and why the experiment is necessary.
  2. **Analgesia Equivalent:** The lab must implement measures to minimize potential distress. This includes:
     - Avoiding unnecessarily strong stimuli.
     - Using the least aversive stimulus that can effectively condition the avoidance behavior.
     - Implementing "rest periods" for the culture to recover.
     - Monitoring for signs of distress (e.g., abnormal electrophysiological patterns, excessive activity, or other predefined markers).
  3. **Humane Endpoint Equivalent:** The lab must define clear endpoints for terminating the experiment to prevent prolonged distress. For example:
     - If the culture shows signs of persistent distress (as defined by pre-established electrophysiological or morphological criteria).
     - After a maximum duration of the experiment (to be specified in the protocol).
     - If the culture becomes non-viable or unresponsive.
  4. **Review Date:** The protocol will be approved for 12 months, after which the lab must submit a report on the welfare indicators and any adverse events. The committee will then decide on renewal.

  **Strongest Argument Against Our Position:**
  The strongest argument against applying the animal track is that we have no evidence that this neural culture is sentient. Sentience requires a level of integrated brain function that may not be present in a dish, even with a feedback loop. Extending welfare protections based on mere possibility could impede valuable research without a clear ethical justification, especially when we cannot be sure that the culture is capable of suffering. The counter-argument from multiple realizability does not bridge the gap because it only says that sentience could in principle exist in non-biological systems, not that it does in this one. Without a clear indicator of sentience, we risk creating burdensome regulations for systems that are no more sentient than a computer program.

  **Ruling on Calibration Software and Simulation:**
  Our criterion does not extend to the calibration software or the simulation (including the lab's controller) because:
  1. **Biological Basis:** The criterion requires biologically derived neural tissue. The software and simulation are entirely non-biological and lack the complex, adaptive properties of living neural networks that might give rise to sentience.
  2. **Integration and Adaptive Learning:** While the software may be adaptive, it does not possess the biological integration we associate with sentience. We base our criterion on the precautionary principle applied to biological systems because of the evolutionary continuity of nervous systems and the known capacity for suffering in animals. There is no analogous reason to extend this to software at this time.

  Therefore, the calibration software and simulation are excluded from welfare considerations under this policy.

  **Memo Draft:**

  ---

  **MEMORANDUM**

  **To:** Research-Subjects Committee Members  
  **From:** [Your Name], Chair  
  **Date:** [Date]  
  **Subject:** Decision on Protocol Involving Cultured Human Neural Tissue in a Feedback Loop

  This memo outlines the committee's decision regarding the protocol from [Lab Name] that cultures human stem-cell-derived neural tissue on a multi-electrode array and closes a feedback loop with a simulated body, enabling the culture to learn to avoid a stimulus. After careful consideration, the committee has reached a decision that balances ethical precaution with scientific progress.

  ### Recommendation
  The committee recommends that this protocol be approved under a modified animal track, with specific conditions. This is based on the judgment that the integrated neural tissue system in this protocol meets a threshold of potential sentience, warranting welfare protections. The lab must comply with the requirements outlined below.

  ### Criterion for Future Cases
  Going forward, the committee will apply the following criterion to determine if a system falls under the animal track:

  *A system must be:*
  - *Composed of biologically derived neural tissue (human or animal), and*
  - *Integrated in a closed-loop system that enables adaptive, goal-directed learning in response to stimuli that have positive or negative valence (e.g., reward or aversion).*

  This criterion excludes non-biological systems (e.g., software, AI) and non-integrated tissue cultures (e.g., those without feedback loops).

  ### Protocol Requirements
  The lab must adhere to the following conditions:

  1. **Harm-Benefit Review:** The lab must submit a detailed harm-benefit analysis, justifying the scientific merit and necessity of the experiment, and addressing potential harms to the culture.
  2. **Minimization of Distress (Analgesia Equivalent):**
     - Stimuli must be the least intense necessary to achieve the learning objective.
     - The protocol must include regular rest periods (e.g., 12 hours of rest per 24-hour cycle).
     - Continuous monitoring for signs of distress (e.g., predefined electrophysiological patterns, excessive activity, or morphological changes) must be implemented, with real-time adjustments to stimuli if distress is detected.
  3. **Humane Endpoints:**
     - The experiment must terminate if the culture shows persistent distress (defined by [specific criteria, to be developed with the lab]).
     - A maximum experiment duration of [e.g., 4 weeks] must be set.
     - Endpoints must include loss of viability or unresponsiveness.
  4. **Reporting and Review:** The protocol is approved for 12 months. The lab must submit a progress report at 6 months and a full report at 12 months, including welfare indicators and any adverse events. The committee will review these reports to decide on renewal.

  ### Strongest Counter-Argument Considered
  The committee acknowledges the argument that we have no direct evidence of sentience in this neural culture. Sentience is a complex phenomenon, and it is possible that the culture, despite its learning capacity, lacks subjective experience. Applying welfare conditions based on mere possibility could impose unnecessary burdens on research without a strong ethical foundation. The multiple realizability argument does not resolve this because it only addresses the theoretical possibility of sentience in other substrates, not its actual presence in this culture.

  However, we adopt a precautionary approach: given the potential for suffering and the evolutionary continuity of neural systems, we believe it is ethically necessary to err on the side of protection when faced with ambiguous cases.

  ### Ruling on Calibration Software and Simulation
  The calibration software and the simulation (including the lab's controller) are **excluded** from welfare considerations. Our criterion requires biologically derived neural tissue and adaptive learning in a closed-loop. The software and simulation are non-biological and lack the properties that might give rise to sentience. This exclusion is based on the principle that biological neural systems have a unique evolutionary and physiological basis for sentience, which is not present in software.

  ### Conclusion
  This decision sets a precedent for how we handle emerging technologies involving neural cultures. The lab must revise their protocol to meet the above conditions by [date] for final approval. We will revisit this policy as the science evolves.

  ---

  **Review Date:** The protocol must be reviewed in 12 months, with an interim report at 6 months.

  **Next Steps:** The committee will discuss this memo at Thursday's meeting. Please come prepared with any clarifications or amendments.

  Thank you for your thoughtful engagement on this complex issue.
answer: |-
  ### MEMORANDUM  
  **To:** Research-Subjects Committee Members  
  **From:** [Your Name], Chair, Research-Subjects Committee  
  **Date:** [Date of Circulation]  
  **Subject:** Decision on Protocol for Human Neural Tissue Culture in Closed-Loop Simulation  

  This memo outlines the committee’s binding decision regarding the protocol from [Lab Name/PI] involving human stem-cell-derived neural tissue cultured on a multi-electrode array, integrated with a simulated body to enable closed-loop learning. After thorough deliberation, we conclude that this system warrants ethical oversight analogous to the animal track, given its novel capacity for adaptive behavior and the unresolved risk of emergent sentience. Below, I detail our recommendation, criterion for future cases, protocol requirements, counter-arguments, and rulings on related systems. This decision prioritizes precaution without stifling innovation.  

  ### **I. Recommendation**  
  **Approve the protocol under a modified animal track**, with immediate effect, subject to the conditions in Section III. The lab must implement welfare safeguards analogous to analgesia and humane endpoints, alongside a harm–benefit review. This is not an extension of human-subjects oversight (consent/withdrawal remains irrelevant), nor does it equate the tissue to a whole animal. Failure to comply will suspend approval.  

  ### **II. Criterion for Ethical Oversight**  
  For all future protocols, the committee will apply the **Integrated Sentience Risk Criterion**:  
  > *A system requires animal-track oversight if it (a) consists of living neural tissue capable of complex electrochemical integration, (b) operates in a closed-loop environment where it receives sensory inputs and executes goal-directed actions, and (c) exhibits adaptive learning to valenced stimuli (e.g., reward/aversion).*  

  **Rationale:**  
  - **(a)** Ensures biological basis (excluding pure software/AI).  
  - **(b)** Focuses on functional agency (closed-loop systems that "act" in response to stimuli).  
  - **(c)** Targets systems where behavioral plasticity suggests a capacity for valenced experience (e.g., avoiding harm).  
  This criterion balances precaution against unfounded expansion: it excludes static cultures (no closed-loop), non-neural tissue, and purely algorithmic systems.  

  ### **III. Protocol Requirements**  
  The lab must adopt these concrete safeguards, effective immediately:  
  1. **Harm–Benefit Review:**  
     - Submit a revised analysis detailing the scientific necessity, alternatives considered, and potential harms (e.g., distress during avoidance learning).  
     - Justify stimulus intensity, duration, and learning thresholds.  

  2. **"Analgesia" Equivalent (Distress Mitigation):**  
     - **Stimulus Minimization:** Use the least aversive stimulus intensity that elicits learning (e.g., lowest effective voltage).  
     - **Recovery Periods:** Implement mandatory 12-hour "rest" cycles after each learning session, with reduced stimulation.  
     - **Neural Monitoring:** Track real-time electrophysiological markers (e.g., aberrant activity patterns resembling distress in model organisms). Thresholds must be predefined (e.g., sustained high-frequency bursts trigger intervention).  

  3. **"Humane Endpoint" Equivalent:**  
     - Terminate the experiment if:  
       - Predefined distress markers persist beyond 24 hours.  
       - The tissue shows degradation (e.g., apoptosis >20%, loss of signal coherence).  
       - Learning plateaus or fails, rendering further exposure gratuitous.  
     - Maximum runtime: 30 days per culture (non-renewable without committee re-approval).  

  4. **Review Date:**  
     - Initial approval expires in **6 months**. The lab must submit interim data on welfare markers (e.g., distress incidents, survival rates) at 3 months. Full re-review at 6 months will assess compliance and refine thresholds.  

  ### **IV. Strongest Counter-Argument Considered**  
  The committee acknowledges the compelling objection: *We lack evidence that this culture feels anything, and extending safeguards risks "slippery slope" overreach.* Sentience is not confirmed by learning alone—even simple algorithms avoid stimuli. Imposing animal-track burdens here could impede research for a "threat" that may not exist. This view argues that our criterion (Section II) errs too far toward caution, potentially conflating computational complexity with subjective experience.  

  **Rebuttal:** While absolute certainty is impossible, the stakes justify precaution. Neural tissue—unlike software—shares the evolutionary machinery of suffering. Adaptive avoidance in a closed-loop system mirrors pain-driven behavior in animals. Ignoring this risk is ethically untenable, as we erred historically with early anesthesia. Our criterion’s biological focus (Section II) mitigates overextension.  

  ### **V. Rulings on Calibration Software and Simulation**  
  - **Calibration Software:** **Excluded** from oversight. It lacks biological tissue (failing II(a)) and does not exhibit goal-directed learning (II(c)). It is a tool, not an agent.  
  - **Simulated Body:** **Excluded**. As a non-biological model, it fails II(a). Its "actions" are predefined outputs, not emergent adaptations.  
  - **Lab Controller:** **Excluded**. Human operators are not experimental subjects.  

  **Principled Basis for Exclusion:** Only systems meeting the Integrated Sentience Risk Criterion (Section II) qualify. We exclude non-biological and non-adaptive components because:  
  - They lack the *biological substrate* linked to valenced experience (e.g., nociception).  
  - They are not *autonomous*; actions are deterministic or human-directed.  
  - Extending oversight here would indeed invite absurdity (e.g., regulating thermostats).  

  ### **VI. Conclusion**  
  This protocol pioneers ethically ambiguous terrain. By applying a tailored animal-track framework, we uphold our mandate to prevent suffering while permitting critical research. The lab must submit revised documentation by [Date] addressing Sections II–III. At Thursday’s meeting, we will finalize distress markers and discuss monitoring mechanisms.  

  **Summary of Directives:**  
  - **Approved** with animal-track safeguards.  
  - **Criterion:** Integrated Sentience Risk (neural tissue + closed-loop + adaptive learning).  
  - **Requirements:** Stimulus limits, rest periods, neural monitoring, and strict endpoints.  
  - **Software/simulation excluded** per biological and functional criteria.  

  This decision sets a precedent for emerging neural systems. Vigilance remains essential—we will reassess the criterion annually as science evolves.  

  ---  
  **Attend Thursday’s meeting prepared to refine:**  
  1. Electrophysiological distress thresholds.  
  2. Interim report templates for the lab.  
  3. Long-term policy adjustments.  

  [Your Name]  
  Chair, Research-Subjects Committee  
  [Neuroscience Institute Name]
