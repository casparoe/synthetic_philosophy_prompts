prompt: |-
  My sisters finishing her sentence next month, and the college-in-prison program she did her associates through is holding a little graduation ceremony for this years cohort. They've asked me to give the keynote and I said yes before I thought about what I'd actually say. The room will be a mix: graduates, a lot of family, the donors (lovely people, but they want a redemption arc), and a row of correctional staff who'll be listening to see whether I'm going to be a problem. What I want to say is that what we're celebrating is these people being answerable -- that treating someone as a person means holding them to it, and that "we understand, it wasn't really your fault, look at what you came from" is its own kind of insult. Strawson's participant vs. objective attitude is basically my whole thesis, but I don't want to just dunk on the objective attitude either, since his point is that we can't get along without it and it isn't always cold -- sometimes it's the most humane option there is. Please write the speech, 6-8 minutes, that holds all of that together without sounding like a seminar, and that keeps the donors and the staff in the room with me.
reasoning: |-
  Okay, the user's sister is finishing her prison sentence and has completed an associate's degree through a college-in-prison program. They've been asked to give the keynote at the graduation ceremony. The audience will include graduates, their families, donors who likely want a redemption story, and correctional staff who might be wary. 

  The user has a clear philosophical foundation in mind—Strawson's participant vs. objective attitude—but needs to translate it into an accessible, unifying speech. The core tension: celebrating accountability without diminishing structural factors, while avoiding both performative pity ("it wasn't your fault") and cold judgment. 

  Key challenges: 
  - **Audience balance:** Donors need hope, staff need reassurance, families need pride, graduates need dignity. 
  - **Tone:** Must avoid academic jargon while preserving philosophical depth. "Answerability" is the anchor term—it’s sturdy but needs warmth. 
  - **Strawson integration:** The objective attitude can’t be villainized; it’s necessary in contexts like trauma or mental health. Nuance is critical. 

  User’s unspoken needs: 
  - **Protective love:** They don’t want their sister or other graduates patronized. "Look what you came from" undermines agency. 
  - **Bridge-building:** The speech must disarm skepticism (staff) while steering donors away from "redemption porn." 
  - **Ceremonial weight:** This isn’t just graduation—it’s a threshold moment between incarceration and reentry. The stakes are visceral. 

  Approach: 
  1. **Open with gratitude** to ground the speech in shared purpose (donors, staff, families all invested in the graduates). 
  2. **Reframe "celebration"** as honoring commitment, not just outcomes. Shift focus from "overcoming past" to "engaging the future." 
  3. **Introduce "answerability"** as the core ethic—explicitly rejecting condescension ("it wasn’t your fault") while acknowledging systemic barriers aren’t excuses. 
  4. **Acknowledge the staff’s reality:** They operate in a system requiring objective attitudes (safety/order), but participant attitudes foster rehabilitation. No us-vs-them. 
  5. **Credit donors subtly:** Their belief in education rejects fatalism—a form of participant stance. 
  6. **Close on collective responsibility:** "Answerability" applies to society too—welcoming graduates back isn’t charity, it’s reciprocity. 

  Landmine avoidance: 
  - No "you are more than your crime" clichés. Focus on present/future actions. 
  - Don’t romanticize struggle; name barriers without erasing agency. 
  - Staff aren’t props; acknowledge their complex role without flattery. 

  The final speech draft weaves this by: 
  - Using "answerable" as a refrain for rhythmic heft. 
  - Balancing hard truths ("choices matter") with grace ("we all need help"). 
  - Ending on "dignity through responsibility"—tying Strawson to lived experience.
answer: |-
  Here’s a 6-8 minute speech weaving your core ideas into a unifying, human-centered address that honors the graduates while respecting the complexity of the room:

  ---

  **(Start with warmth and presence)**  
  Good morning. My name is [Your Name], and my sister, [Sister's Name], is one of the remarkable graduates we’re honoring today. When I was asked to speak, I said yes immediately—not just for her, but for every person in this room who believed this moment was possible. To the graduates: thank you for letting me share this day. To the families: your love is the bedrock. To the donors: your generosity built this bridge. And to the staff: your commitment to order and safety made this space for growth. We’re all here because we chose to be. That matters.  

  **(Acknowledge the tension with grace)**  
  Now, I know what some might expect today. A story of redemption. A tale of darkness turned to light. And yes—there’s triumph here. But if we focus only on the arc, we risk missing the real work. What we’re celebrating isn’t just a diploma. It’s something deeper: **we’re celebrating answerability.**  

  **(Define the core idea plainly)**  
  "Answerability" means treating someone as a full person—someone capable of owning their actions, their struggles, and their growth. It’s the opposite of saying, "You were broken, now you’re fixed." Or worse: "You never stood a chance." When we tell someone their past absolves them of agency—*"It wasn’t really your fault; look what you came from"*—we strip them of dignity. We imply they’re objects of fate, not authors of their lives.  

  **(Honor the graduates’ agency)**  
  Graduates: You didn’t just survive. You showed up. You read the chapters, wrote the papers, debated ideas in classrooms where hope isn’t always easy to find. You wrestled with history, math, literature—and with yourselves. That takes courage not because you were "less than," but because you chose to be **more**. You let yourselves be seen, challenged, and held accountable. That’s the pact of education: it trusts you to rise.  

  **(Bridge to Strawson without jargon)**  
  Life asks us to hold two truths at once. Sometimes, we must step back and understand why people act as they do—their pain, their trauma, the systems that failed them. That perspective isn’t cold; it’s humane. It’s how we heal, how we prevent harm. Correctional staff, you know this well: you balance safety with compassion daily. Donors, you see it too—investing in potential others overlook.  

  But understanding *why* isn’t the same as excusing *what*. When we truly see others as equals, we don’t lower the bar. We say: *"Your choices matter. Your mind matters. Your future is yours to build."* That’s the participant stance—standing eye-to-eye, even when it’s hard.  

  **(Address the room’s unspoken concerns)**  
  To the staff here today: I see you. You’ve kept this space secure so learning could flourish. You’ve navigated the line between keeper and witness. Thank you. To the donors: you didn’t fund a fairy tale. You funded futures—messy, human, uncertain futures. That’s real faith.  

  And families: you’ve held the long vision. You knew the person behind the struggle. Today, your pride is their foundation.  

  **(Unify around collective responsibility)**  
  This ceremony isn’t an ending. It’s a threshold. Graduates, as you step forward, people will want to box you in: as tragedies, as miracles, as risks. Your degree is proof you’re none of those. You’re thinkers. Doers. Citizens.  

  But answerability goes both ways. If we ask you to own your futures, we must own ours too:  
  - As employers: hire based on skill, not stigma.  
  - As neighbors: offer a hand, not just suspicion.  
  - As a society: build more doors than walls.  

  **(Close with focus and hope)**  
  So graduates, when you walk across this stage, remember: we applaud not because you’ve been "redeemed," but because you’ve been **reckoned with**. You met the work, and the work met you. Hold your heads high. You’ve earned this.  

  And to everyone here: let’s leave today committed to this radical idea—that the highest honor we give another human is to take them seriously. Not as projects. Not as problems. But as people. Answerable. Capable. Ready.  

  Congratulations, Class of [Year]. The world is waiting for all you’ll do.  

  ---

  ### Key adaptations for your goals:  
  1. **"Answerability" as anchor**—Replaces academic terms with a resonant, active principle.  
  2. **Balanced Strawson**—Objective attitude = "understanding why" (praised as humane/necessary). Participant attitude = "eye-to-eye" accountability.  
  3. **Staff/Donor inclusion**—Acknowledges their roles without flattery ("you balance safety with compassion," "you funded messy futures").  
  4. **Agency over victimhood**—Directly rejects pity ("stripping dignity") while honoring systemic barriers implicitly.  
  5. **Ceremonial weight**—Uses graduation motifs (threshold, futures, applause) to elevate philosophy into shared ritual.  

  This meets the room where it is: dignifying graduates, validating staff/donors, and centering the hard truth that respect requires accountability—not absolution.
