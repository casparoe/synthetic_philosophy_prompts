answer: |-
  Here's a reading of *F for Fake* that directly engages your philosophical frustrations and pushes beyond Goodman/Dutton/Radford, focusing on corpus integrity, the film's own deceptive structure, and the unresolved tension between aesthetic value and contextual harm:

  1.  **Corpus Pollution: The Real Harm Beyond the Fake Object:**
      *   **The Elmyr Paradigm:** You're absolutely right. Elmyr isn't copying existing works (like the Goodman forger); he's *inventing* new ones within the stylistic and historical void of an artist's "lost period." By not signing them, he avoids the literal crime of signature forgery but commits a deeper ontological crime: **polluting the artist's corpus.** This isn't just about deceiving a buyer; it's about corrupting art history itself.
      *   **Why Corpus Matters:** An artist's oeuvre is a historical document, a narrative of development, influence, and intention. Inserting an Elmyr "Modigliani" distorts that narrative. It misattributes intention (Elmyr's clever pastiche vs. Modigliani's genuine exploration), potentially misinforms scholarship about stylistic evolution or thematic concerns, and dilutes the artist's authentic voice. The harm isn't primarily to the *viewer's* experience of *this object* (it might look beautiful), but to the collective understanding of the *artist's life and work*. It erodes the foundation of attribution upon which art history, valuation, and even cultural meaning partially rest.
      *   **Chartres Analogy Backfire:** Welles's Chartres comparison *does* backfire, as you note. The cathedral builders were anonymous *by the nature of their craft and era*. Their anonymity was authentic to their context and purpose; they weren't *pretending* to be Notre-Dame de Paris. Elmyr's anonymity is *fraudulent* – it's a deliberate erasure *to enable the false attribution*. The Chartres builders contributed authentically to a collective, known endeavor; Elmyr contributes inauthentically to an individual artist's *perceived* endeavor. The analogy highlights the crucial difference between *authentic anonymity* and *fraudulent anonymity* designed for misattribution.

  2.  **F for Fake as Forgery: Immunity or Exemplar?**
      *   **The Structural Con:** You precisely identify Welles's technical truth-telling window. This makes the film a *conceptual* forgery rather than a literal one. It forges a *narrative*, a *documentary truth claim*. It presents fabricated events (Kodar/Picasso) within the authentic context of real people (Elmyr, Irving, Kodar, Picasso) and real footage, mimicking the structure of legitimate documentary evidence.
      *   **Practicing What it Preaches (But Buying Immunity):** It absolutely practices its thesis about the constructed nature of truth and authority. By adhering to the *letter* of its promise ("the next hour is true"), it demonstrates how easily *technical* truth can be weaponized to support a *fundamental* deception. This strengthens its core argument about the fragility of authenticity claims *precisely because* it relies on that fragility to work. The "immunity" *is* the point: it shows how systems of verification (like documentary promises or provenance) can be gamed.
      *   **Where the Philosophy Gets Sidelined for the Con:** The film most blatantly revels in the con during the extended sequences showcasing Elmyr's charm and effortless skill in painting "like" the masters, and in Welles's own gleeful narration of the Oja/Picasso fabrication. The rhythmic montages, the jazzy score, Welles's booming, amused voice – these sections prioritize the *thrill* of deception, the virtuosity of the performance, and the sheer *fun* of pulling one over on the audience and "experts." The philosophical implications of corpus pollution or narrative fraud take a backseat to the spectacle of the trick itself. It wants you to admire the *magic*, even as it later asks you to ponder its ethics.

  3.  **What F for Fake Adds: Relocating the Wrong & The Unresolved Beauty Question:**
      *   **Beyond Goodman/Dutton:** Goodman focused on autographic/allographic arts and the (debatable) perceptual indistinguishability of perfect copies. Dutton focused on artistic achievement and intentionality. Radford focused on the psychological betrayal upon discovery. *F for Fake* shifts the ground:
          *   **Market & Provenance as the True Arena:** The film relentlessly targets the *art market* and the *cult of provenance*. Elmyr exploits the market's obsession with names, signatures, and stories over aesthetic judgment or historical integrity. Irving is the perfect foil – the market enabler who thrives on manufactured scarcity and manufactured narratives. The "wrong" of forgery, the film argues, is less about the object itself and more about the *social and economic systems* that elevate attribution over experience and enable fraud. The harm is to the market's trust and the historical record, not necessarily to the viewer encountering the beautiful object in ignorance.
          *   **The Power of Narrative & Authority:** Welles demonstrates that authenticity is often conferred by *storytelling* and perceived *authority* (experts, museums, documentaries) rather than inherent properties. He himself, as the narrator/director/godlike figure, embodies this. The film forges its own authority to make its point about the forgery of authority.
      *   **Does it say Forgery is Harmless? No, but it Complicates "Harm":**
          *   **The Beauty Defense is Inadequate:** Welles absolutely presents the argument ("What we professional liars hope to serve is truth... the *real* truth") and the seductive image of the beautiful fake hanging on a wall, giving pleasure. He even ends with Chartres, seemingly pointing to transcendent value beyond authorship. **But the film itself refutes a simple "harmless if beautiful" conclusion.** Elmyr's forgeries *did* cause harm: to duped collectors financially, to the integrity of art history, and arguably to the artists' legacies (even if they were dead). The film's *own act* of forgery (the Picasso story) is explicitly designed to make the audience feel "fooled" and question trust – an experience that *feels* like harm, even if minor.
          *   **The Unresolved Tension:** The film's genius lies in holding this tension without resolving it. It *shows* the beauty and skill involved in the fake. It *exposes* the venality and gullibility of the market that enables it. It *demonstrates* the power of narrative to create authenticity. But it also *makes the audience feel* the sting of deception and implicitly acknowledges the damage done to historical truth and trust. It doesn't claim forgery is harmless; it claims the *systems that make forgery possible and profitable* are deeply flawed, and that our *concepts* of authenticity are more fragile and constructed than we admit. The final, wistful gaze at Chartres isn't an endorsement of forgery; it's a lament for a lost ideal of authentic, collective creation *untainted* by the market, individualism, and the need for deception that defines the modern art world Elmyr exploited.

  **Conclusion:** *F for Fake* argues that the primary harm of a forgery like Elmyr's is **ontological pollution of the artistic corpus and the historical record**, enabled by a **market obsessed with provenance over perception and narrative over intrinsic value**. The film itself becomes a **conceptual forgery** to demonstrate how narrative authority constructs truth, buying its "immunity" through technical adherence to expose systemic vulnerability. While it revels in the beauty and skill of the con, it ultimately refuses to declare forgery harmless; instead, it presents a damning indictment of the **systems of value, attribution, and authority** that make forgery not just possible, but profoundly disruptive to our understanding of art and history. It shows that authenticity is less a property of the object and more a fragile agreement built on trust, narrative, and context – an agreement Elmyr, Irving, and Welles himself delight in breaking.
