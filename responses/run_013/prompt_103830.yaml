prompt: |-
  I serve as the lay member of the ethics panel of a small humanitarian NGO, and I am asking for help with a dispute I could not referee.

  Last year our field team's chief negotiator, Alia, was in talks with an armed group holding five of our staff. The group offered to release all five in exchange for Ines, one of our volunteers, who was not among the hostages. Ines asked, publicly and repeatedly, to be handed over; she had worked in the region for eleven years, understood what captivity there would mean, and appeared to be deciding for herself. Alia refused to make the exchange. Negotiations continued, and the five came home eleven months later; one of them lost the sight of an eye. Ines left the organization soon afterwards, telling colleagues she had been overruled about her own life.

  Two members of the panel, Nadia and Emeka, have argued about it ever since, and I cannot decide between them.

  Nadia's position is that you may not make one person the instrument of another's release, and that Ines's volunteering does not change what the act is. Consent, she says, can release the rest of us from any complaint Ines might later make; it cannot convert the use of a person into something the rest of us may do. If willingness were enough, the rule would protect only the unwilling, and anyone with a sufficiently urgent cause could recruit a volunteer and call the result permission.

  Emeka's reply is that Ines is precisely the person whose claim the rule exists to protect, and she waived it. To refuse on her behalf is to treat her as someone to be protected from her own judgment — the very thing the rule was meant to prevent. He adds that Nadia has quietly turned the rule into a rule for producing the fewest uses of people: in this case we could have prevented five people from being used as bargaining chips by using one, and if the rule cannot say why we must not, it is because the only difference left is the number.

  Nadia answers that consent waives a claim, not a permission; that a wrong can be done even when no one is wronged, because the rule is addressed to the agent rather than to the victim's ledger; and that the numbers do not enter not because they are small but because they answer a question the rule does not ask. On her account Alia did not weigh five against one; she declined to do a kind of thing.

  Emeka's rejoinder is that this makes the rule a matter of the agent's record rather than of anyone's claim. If the constraint is addressed to Alia and not to Ines, its point is that Alia's hands stay clean — and we are then being told that a scruple of that kind outweighs eleven months of five people's captivity and one ruined eye. He adds that Nadia has weighed in any case, in concluding that Alia should refuse; she has merely arranged the scales so that one consideration can never be placed on them, and a weight that can never be placed on a scale is not justifying anything.

  Nadia's last word: there is a difference between a consideration that does not count and a consideration one may not act on. The captivity of the five counts enormously — it is a tragedy and Alia should be haunted by it — but it is not a reason of the right kind for doing that to Ines. She compares it to an interrogator told that a confession would make five convictions stick: that is a reason to want the confession, not a reason he may act on. She adds that if Emeka's point is pushed, every rule whatsoever becomes a weighing, and the difference between rules and optimization disappears by stipulation.

  Emeka's final move: then answer the consent point without that manoeuvre. If Ines's waiver releases her complaint but not our permission, the act would be forbidden even if she were the only person on earth. But the rationale usually offered for the rule — that people must not be treated as mere instruments — is a rationale about how the person is treated, and Ines is not complaining. What remains is: do not be the one who does it. He grants that this can be a genuine reason, but insists that a reason of that kind must be weighed against five captives; if it can be weighed, the original difficulty returns, and if it cannot, a self-regarding scruple is being treated as absolute. He sees no way out.

  Please adjudicate this exchange rather than summarizing the general issue. Go move by move: for each of the six moves, say whether it is sound, partly sound, or mistaken, and why, naming the specific insight or confusion in each. Then answer four questions. (1) Does Ines's consent alter what Alia was permitted to do, or only what Ines has grounds to complain about? (2) Can the rule against using a person be justified by what it protects, given that here it protected no one who wished to be protected — and if it cannot, does that show the rule is defective, or that we have misunderstood what it was protecting? (3) Is Emeka's "you weighed anyway" argument sound, or does it prove too much? (4) What is the strongest available formulation of the rule on which Alia's refusal comes out right — or, if no such formulation survives, say so plainly and say what follows for the case. Finally, say who has the better of the argument overall, and identify what both parties are missing.
reasoning: |-
  Hmm, this is a deep ethical dilemma from an NGO ethics panel. The user is a lay member struggling to adjudicate between Nadia and Emeka's positions on whether Alia was right to refuse exchanging Ines for five hostages. Let me unpack this complex philosophical debate step by step.

  First, the core disagreement: Nadia argues you can't make someone an instrument even with consent, while Emeka insists consent makes all the difference. Their six moves reveal fundamental divides in ethical reasoning. I need to evaluate each argument carefully.

  For move 1: Nadia's claim that consent can't transform the nature of the act holds water. She's right that "volunteering" could become coercive in desperate situations. But she misses that Ines wasn't being recruited - she autonomously offered herself after 11 years of experience.

  Move 2: Emeka correctly spots Nadia's unstated utilitarian tilt when he says she's focused on minimizing "uses" of people. His protection paradox is sharp - if the rule overrides the protected person's wishes, isn't that paternalistic? Though he oversimplifies by calling it just about numbers.

  Move 3: Nadia's distinction between waiving complaints versus granting permission is crucial in deontology. She's right that some acts are wrong regardless of consent, like selling oneself into slavery. But is hostage exchange really in that category? Her interrogator analogy is strong but imperfect - torture violates bodily autonomy in ways hostage exchange might not.

  Move 4: Emeka's "clean hands" reduction hits hard. If the rule is only about the agent's purity, it does seem callous next to real suffering. His weighing accusation is less convincing though - refusing to weigh certain factors isn't dishonest, it's defining moral boundaries.

  Move 5: Nadia's reason-types distinction is brilliant. Some reasons just don't count for certain actions, period. But she hasn't proven hostage exchange belongs in the "never act on" category like torture does.

  Move 6: Emeka's "only person on earth" thought experiment exposes the weakness in Nadia's position. If Ines consents and nobody else exists, what's the harm? Unless the act is inherently degrading, but captivity isn't necessarily that.

  Now the four questions: 
  (1) Consent changes both complainability and permissibility here - Ines could validly release the complaint, but the organization might still have duties beyond her wishes.
  (2) The rule protects autonomy precisely by requiring consent; it worked perfectly because Ines was allowed to choose (to volunteer) even if overruled.
  (3) Emeka's "you weighed anyway" proves too much - all principles involve implicit weighing against alternatives; that doesn't make them utilitarian.
  (4) The strongest rule formulation: "Never transfer a person to captors against their will, and require extraordinary justification even with consent." Alia's refusal was defensible but not obviously mandatory.

  Overall Emeka prevails on consent's moral force, but both miss that organizational integrity and precedent matter too. The real failure was procedural - Ines deserved formal consultation, not just a public plea. The panel should recommend clearer protocols for volunteer risk acceptance.
answer: |-
  ### Adjudication of Moves
  I'll evaluate each of Nadia's and Emeka's six moves in sequence, identifying specific insights or errors.

  1.  **Nadia’s first move (instrumentality/consent):**  
      **Partly sound.** Insight: Correctly identifies that consent doesn’t transform the intrinsic nature of an act (e.g., volunteering for exploitation doesn’t negate its exploitative structure). Confusion: Overlooks that consent *can* alter the moral permissibility of acts involving personal sacrifice when autonomy is fully respected (e.g., organ donation). Her "sufficiently urgent cause" slippery slope is valid but doesn’t apply cleanly here—Ines acted independently, not under NGO recruitment.  

  2.  **Emeka’s first move (protection/waiver):**  
      **Sound.** Insight: Rules protecting autonomy must honor waivers by competent individuals; overriding consent *is* paternalism, defeating the rule’s purpose. His "fewest uses" critique exposes Nadia’s unstated consequentialism. Error: Underestimates how institutional roles (Alia as NGO representative) limit individual waiver authority.  

  3.  **Nadia’s second move (wrong without wronging/agent-focused):**  
      **Partly sound.** Insight: Correct that some acts are agent-relative wrongs (e.g., murder for charity remains wrong even with consent). Her "ledger" metaphor clarifies deontology. Confusion: Fails to justify *why* hostage exchange falls into this category. The interrogator analogy is flawed—torture violates bodily autonomy inherently, while hostage exchange may not if fully consensual.  

  4.  **Emeka’s second move (agent’s record/weighing):**  
      **Sound.** Insight: Accurately notes that Nadia’s "agent-centered" rule risks prioritizing moral purity over preventing harm. His "scales" argument validly critiques her for dismissing consequences while implicitly weighing (by refusing the exchange). Error: Overstates the case—rules *can* categorically exclude certain acts without being "self-regarding" (e.g., prohibitions on slavery).  

  5.  **Nadia’s third move (wrong kind of reason):**  
      **Partly sound.** Insight: Correctly distinguishes *reasons for wanting an outcome* (freeing five) from *reasons for action* (exchanging Ines). This preserves integrity against consequentialist overreach. Confusion: Assumes without argument that exchange is inherently impermissible, unlike other consensual sacrifices (e.g., humanitarian volunteers entering danger zones).  

  6.  **Emeka’s third move (consent without complaint):**  
      **Mistaken.** Insight: Right to question what justifies the rule if the "victim" waives objection. Confusion: Conflates two issues.  
      - His "only person on earth" reductio fails: Even with consent, Alia might still be forbidden by duties *to humanity* (e.g., not normalizing human bargaining).  
      - He misconstrues "self-regarding scruple" by ignoring institutional/role-based duties (Alia’s duty to protect *all* staff, including volunteers like Ines).  

  ---

  ### Answers to Specific Questions  
  **(1) Consent’s role:**  
  Consent alters both. It removes Ines’s grounds for complaint (waiving her personal claim), but *does not* automatically grant Alia permission. Institutional and agent-relative duties (e.g., not commodifying humans) may persist independently.  

  **(2) Rule justification:**  
  The rule can be justified by protecting **autonomy-as-process**, not just outcomes. Here, it protected:  
  - Ines’s right to *offer* consent without coercion (though overruled);  
  - The NGO from setting a precedent that incentivizes targeting volunteers.  
  This shows the rule protects systemic values, not just individual wishes.  

  **(3) Emeka’s "weighed anyway" argument:**  
  **Proves too much.** All principles involve implicit "weighing" against alternatives (e.g., rejecting theft even if it feeds starving children). Nadia’s refusal to weigh consequences for *this specific act* is a feature of deontology, not hypocrisy. Emeka’s view collapses rules into pure consequentialism.  

  **(4) Strongest rule formulation:**  
  > *"Never transfer a non-hostage to captors as an instrument of exchange, even with consent, unless it is the sole means to prevent imminent mass casualties—and only after rigorous, independent validation of consent and necessity."*  
  **Verdict:** Alia’s refusal was defensible under this rule. The five hostages’ lives, while gravely endangered, faced no *imminent mass casualty* threat, and consent validation was absent. If no such formulation works, it implies the rule is context-dependent, but here it survives.  

  ---

  ### Overall Verdict  
  **Emeka has the better argument** on the core consent issue, but both miss critical nuances:  
  - **Nadia** undervalues consent’s moral force and ignores institutional precedents (e.g., NGOs allowing volunteers to assume extreme risks).  
  - **Emeka** disregards how institutional roles constrain individual autonomy (Alia couldn’t "sell" a volunteer without compromising the NGO’s mission).  

  **What both miss:**  
  1. **Organizational integrity:** The NGO’s duty to avoid normalizing human trade, which could endanger *all* staff.  
  2. **Procedural justice:** Ines’s consent needed formal validation (e.g., ethics panel review), not just public requests.  
  3. **Alternatives:** Alia’s duty to exhaust non-exchange negotiations (which succeeded, though at great cost).  

  **Final judgment:** Alia’s refusal was ethically permissible but morally tragic. The panel should recommend protocols for validating volunteer consent in extreme scenarios, without endorsing human exchanges.
