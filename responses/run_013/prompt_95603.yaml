answer: |-
  Below is the decision tree designed for your metaphysics seminar on material constitution. It starts from the agreed-upon judgment (the clay survives squashing; the statue does not) and branches through intuitive questions students can answer without knowing metaphysical labels. Each question is grounded in concrete cases (the clay statue, the topiary hedge, and the ice sculpture) to ensure relevance. Positions are named where standard, briefly described otherwise. Contradictory branches (unoccupied positions) and indistinguishable leaves are flagged.

  ---

  ### **The Material Constitution Decision Tree**
  **Starting Judgment**: A sculptor shapes clay into a statue. Later, they squash it back into a lump. *The clay is still there, but the statue is not*.

  #### **Question 1: When the statue exists (after shaping, before squashing), is the lump of clay *still there*?**  
  *(Test cases: For the topiary hedge, is the plant still there after shaping? For the ice sculpture, is the ice still there after sculpting?)*  
  - **Yes** (The lump/plant/ice persists during the statue/topiary/sculpture’s existence) → Go to Question 2.  
  - **No** (The lump/plant/ice *stops existing* when the statue/topiary/sculpture is created) → **Leaf: Annihilation View**.  
    - *Description*: The original object (lump/plant/ice) is annihilated when the new entity (statue/topiary/sculpture) is created. Squashing destroys the new entity and "resurrects" the original.  
    - *Diagnosis*: Handles the ice sculpture intuitively (the ice lump ceases to exist when sculpted; melting destroys the sculpture and "brings back" the ice). Fits poorly with the topiary hedge (we intuit the plant survives shaping).  

  #### **Question 2: Is the statue/topiary/sculpture a *real object*?**  
  *(Not just a "phase" or description of the clay/plant/ice. Test cases: Is the topiary a distinct entity from the plant? Is the ice sculpture distinct from the ice?)*  
  - **No** (Only the clay/plant/ice is real; "statue/topiary/sculpture" is a temporary phase or loose talk) → **Leaf: Eliminativism**.  
    - *Description*: Only the underlying matter (clay/plant/ice) exists. Sortals like "statue" or "topiary" describe how matter is arranged, not genuine objects.  
    - *Diagnosis*: Explains the topiary hedge well (the plant survives; "topiary" is a phase). Less intuitive for the ice sculpture (if "sculpture" isn’t real, its destruction isn’t a metaphysical change).  
  - **Yes** (The statue/topiary/sculpture is a real object) → Go to Question 3.  

  #### **Question 3: Are the statue/topiary/sculpture and the lump/plant/ice *two distinct objects* at the same time/place?**  
  *(Test cases: During the topiary’s existence, are there two things (plant + topiary) in one place? For the ice sculpture, are the sculpture and ice distinct?)*  
  - **No** (Only one object exists, described by two sortals) → Go to Question 4.  
  - **Yes** (Two objects coincide) → Go to Question 5.  

  #### **Question 4: Can the *same object* survive changes under one sortal but not another?**  
  *(E.g., Can it survive squashing as "clay" but not as "statue"? Test cases: Can the hedge survive clipping as "plant" but not as "topiary"? Can the ice survive melting as "ice" but not as "sculpture"?)*  
  - **Yes** → **Leaf: Sortal-Relative Counting**.  
    - *Description*: One object with multiple sortals, each with different persistence conditions. Survives changes only relative to a sortal (e.g., the clay/plant/ice survives as matter; the statue/topiary/sculpture does not).  
    - *Diagnosis*: Fits both cases (the plant survives growing out; the topiary doesn’t; the ice survives melting; the sculpture doesn’t). **Indistinguishable from "One Thing, Two Sortals"** – these collapse into the same position on this tree.  
  - **No** → **Leaf: Contradiction (Unoccupied)**.  
    - *Diagnosis*: If the object is numerically identical under both sortals but can’t have divergent persistence conditions, the initial judgment (clay survives, statue doesn’t) is impossible. No one holds this.  

  #### **Question 5: Can two objects *share all parts and location* at a time without being identical?**  
  *(Test cases: Can the plant and topiary share every leaf and location? Can the ice and sculpture share every molecule?)*  
  - **Yes** → **Leaf: Coincident Objects**.  
    - *Description*: Two distinct objects (e.g., lump + statue, plant + topiary, ice + sculpture) coincide in space and matter, with one constituting the other. They differ in persistence conditions (e.g., the statue/topiary/sculpture is destroyed by squashing/clipping/melting; the clay/plant/ice is not).  
    - *Diagnosis*: Works for both cases (topiary is destroyed when clipped; plant survives; sculpture is destroyed when melted; ice survives).  
  - **No** → Go to Question 6.  

  #### **Question 6: Is the *number of things* at a place settled without sortal concepts?**  
  *(E.g., Can we count "what’s in the garden" without specifying "plant" or "topiary"? Test cases: Does "the ice" pick out the same count as "the sculpture" before melting?)*  
  - **No** → **Leaf: Quantifier Variance/Relativism**.  
    - *Description*: There is no objective count of objects; "how many things exist?" depends on the sortal used. No privileged description of reality.  
    - *Diagnosis*: Handles vagueness in the hedge case (is it one thing or two?). Less intuitive for the ice sculpture (accidental refreezing might count as "same sculpture" under some sortals).  
  - **Yes** → **Leaf: Four-Dimensionalism (Perdurantism)**.  
    - *Description*: Objects are spacetime worms. The statue/topiary/sculpture and lump/plant/ice are different temporal parts of the same or overlapping worms. The statue is a temporal segment of the clay worm; squashing ends that segment.  
    - *Diagnosis*: Explains the ice sculpture’s accidental refreezing (it’s a new temporal segment). Fits the topiary (the plant worm includes pre- and post-topiary parts).  

  ---

  ### **Diagnoses & Notes**
  1. **Collapsed Positions**:  
     - **Sortal-Relative Counting** and **One Thing, Two Sortals** are indistinguishable on this tree. Both answer:  
       - Q1: Yes  
       - Q2: Yes  
       - Q3: No  
       - Q4: Yes  
     - *Why*: Both deny two distinct objects but allow divergent persistence under sortals. The tree cannot separate them with the given questions.

  2. **Unoccupied Branches**:  
     - **Q1→Yes, Q2→Yes, Q3→No, Q4→No** leads to a contradiction (unoccupied).  
     - **Q1→No** (Annihilation) + **Q2→Yes** is incoherent (if the statue is real, but the lump isn’t "still there," the lump can’t "reappear" later).  

  3. **Case Handling**:  
     - **Topiary Hedge**:  
       - *Annihilation* struggles (plant seems to survive shaping).  
       - *Eliminativism/Sortal-Relative/Coincident Objects* handle it best (plant survives; topiary doesn’t).  
     - **Ice Sculpture**:  
       - All views agree melting destroys the sculpture. Accidental refreezing is a *new* sculpture (except *Quantifier Variance*, which may allow same-sortal reidentification).  
       - *Four-Dimensionalism* clarifies why the same shape isn’t the same sculpture (different temporal segments).  

  4. **Tree Flow**:  
     - Questions avoid presupposing answers (e.g., "still there" is pre-theoretical; "real object" uses student intuitions).  
     - Branches cover all major positions:  
       - *Eliminativism* (Q2→No)  
       - *Annihilation* (Q1→No)  
       - *Coincident Objects* (Q3→Yes, then Q5→Yes)  
       - *Four-Dimensionalism* (Q3→Yes, Q5→No, Q6→Yes)  
       - *Sortal-Relative Counting* (Q3→No, Q4→Yes)  
       - *Quantifier Variance* (Q3→Yes, Q5→No, Q6→No)  
       - *Nihilism* covered implicitly (if students balk at composites in Q0, but tree starts with composites assumed).  

  Use this tree to facilitate debate by having students vote on answers at each node, then reveal the position their path implies. Revisit the hedge and ice cases to test intuitions against outcomes. No labels are needed upfront—positions emerge from choices.
