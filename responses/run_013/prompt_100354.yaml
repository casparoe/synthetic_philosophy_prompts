prompt: |-
  I'm in a small reading group thats been stuck for months on the Lewis triviality results for indicative conditionals, and I'm starting to think the stalemate isn't really about the math. Here's teh shape of it. One person says the results show you can't have all of: (i) indicative conditionals express propositions with truth conditions, (ii) the probability of a conditional equals the conditional probability of its consequent given its antecedent, and (iii) that equation holds not just for simple conditionals but for conditionals embedded in Boolean compounds. So something has to go, and the most plausible casualty is the truth-conditions picture. Someone else says thats overreading: the proofs only go through under a specific formulation of the equation, plus assumptions about closure and about what counts as a legitimate probability function over conditionals, and the real lesson is about the limits of our probability talk, not about conditionals. A third person thinks both sides are talking past each other because one is doing semantics and the other is doing a theory of assertability or credence, and the word proposition is doing all the damage. I tried to build a toy case where the equation holds only for unembedded conditionals, so the proof never gets off the ground. Does that show the fight is about how to state the target, not about conditionals themselves? My hypothesis is that the impasse is not a factual or formal disagreement but a disagreement about what a semantic theory is supposed to explain -- whether it has to assign truth conditions to every grammatical conditional, or only explain the patterns of acceptance and inference we actually care about. Is that right? Or is there a hidden formal question doing the work, like whether there is a non-trivial class of models satisfying a weakened equation? I want a diagnosis, not a survey. Tell me what kind of disagreement this really is, what each side is actually committed to, and what would count as progress -- a theorem, a distinction, a change of question, or an argument that no progress should be expected. And be explicit about what would change your mind: which result or consideration would make you revise the diagnosis, and where your reasoning is most likely to fail.
