prompt: |-
  I have been working through Harsanyi's aggregation theorem in a reading group, and a friend there has put together the argument below. He says it shows that any social welfare framework built on expected utility collapses into classical utilitarianism, and he treats the conclusion as a reductio of our reluctance to accept it. I cannot accept the conclusion, but I also cannot find the break in the chain, and I would like you to locate it.

  The argument, as he wrote it:

  (1) Every individual's preferences over risky prospects satisfy the expected-utility axioms, so each individual i can be represented by a utility function u_i, unique up to a positive affine transformation.
  (2) There is a social betterness relation over risky prospects that satisfies those same axioms, so it can be represented by a utility function W, unique up to a positive affine transformation.
  (3) The social relation satisfies the Pareto principle: whenever every individual weakly prefers prospect L to prospect M, W(L) ≥ W(M).
  (4) Before aggregating, we fix each u_i on a single common scale: a stipulated zero point, a stipulated unit, and a reference lottery that everyone is stipulated to evaluate alike. This is meant to make interpersonal comparisons of both levels and differences of utility available.
  (5) By Harsanyi's aggregation theorem, (1) through (4) entail that W is a positive weighted sum of the individual utilities, W = Σ a_i u_i with each a_i > 0.
  (6) Since no person's welfare counts for more than any other's, the weights must be equal, so W = Σ u_i. This is classical utilitarianism.
  (7) Three consequences follow. (a) A world in which everyone's utility is equal is not intrinsically better than a world with the same total distributed with gross inequality; equality matters only through diminishing marginal utility. (b) If killing one innocent person would raise the total by even a little, the total requires it. (c) Any distribution of utility can be justified, provided it maximizes the total.
  (8) These consequences are unacceptable.
  (9) So one of (1) through (6) is false.

  I am attached to (1), (2), and (3) and would give them up last; I care much less about the claim that the social ranking is a plain sum. My friend replies that (6) is nothing more than the moral equality of persons, and that whoever rejects it is saying that some people count for more than others. I do not need an introduction to utilitarianism or a survey of social choice theory. I need to know which step or move fails, why it looked as though it followed, and what I would have to accept in its place.

  Write the response in American English, in the following sections and order:

  - Summary — no more than 100 words, naming the step or move you would reject.
  - Why that step looked innocent — roughly 250 to 350 words.
  - What rejecting it costs — roughly 300 to 400 words, treating the two or three other steps I could sacrifice instead and saying what each sacrifice would cost me.
  - The second-best target — roughly 150 to 250 words.
  - Bottom line — roughly 80 to 120 words.
reasoning: |-
  Hmm, the user is grappling with Harsanyi's aggregation theorem and an argument that seems to force classical utilitarianism. They're in a reading group, and a friend has presented a step-by-step reasoning that concludes with utilitarianism leading to unacceptable consequences. The user rejects the conclusion but can't find the flaw, so they want me to pinpoint where the argument fails, explain why it seemed plausible, and discuss the costs of rejecting that step.

  The argument has nine steps: from individual expected utility axioms to social welfare, Pareto principle, scaling for interpersonal comparisons, Harsanyi's theorem leading to weighted sum, then equal weights for moral equality, and finally unpalatable utilitarian implications. The user is emotionally attached to premises 1-3 but is open to challenging premise 6, which their friend frames as "moral equality of persons." I need to analyze this carefully.

  Looking at the argument, step 4 seems problematic. It claims that by fixing a common scale for utility—zero point, unit, and reference lottery—it makes interpersonal comparisons of levels and differences available. But in expected utility theory, utility functions are only unique up to affine transformations, meaning that such scaling is arbitrary. Harsanyi's theorem requires measurability of utility differences, but without additional ethical assumptions, this stipulation doesn't genuinely allow for interpersonal comparisons. It's just a mathematical normalization, not a substantive bridge for comparing welfare across people.

  Why does step 4 look innocent? Because it mimics how we handle units in science—standardizing measurements seems neutral. In economics, it's common to assume that such scaling enables comparisons, especially in social choice contexts. The friend might be thinking of cardinal utility as sufficient, but this confuses representational scales with real interpersonal welfare metrics. Harsanyi's theorem depends on this setup, making it seem necessary, but it smuggles in a contentious assumption about comparability.

  Rejecting step 4 costs something: without it, we lose the ability to make interpersonal comparisons, which might weaken social welfare frameworks. But the user could sacrifice other steps instead. For instance, challenging step 3 (Pareto principle) by accepting that sometimes individual preferences shouldn't dictate social choices, which could lead to paternalism. Or questioning step 2, denying that social preferences satisfy expected utility axioms, meaning social choices might not be representable by a utility function, introducing complexity. Sacrificing step 6 directly—admitting unequal weights—contradicts moral equality, which the user's friend heavily emphasizes. Step 4 is the best target because it's less fundamental; the costs involve embracing a more nuanced view of welfare comparisons, like drawing on ethical theories for interpersonal standards.

  The second-best target is step 6. Rejecting equal weights doesn't mean abandoning moral equality; it could reflect different needs or circumstances, such as prioritizing the worst-off. This aligns with prioritarian or egalitarian views, but it requires defending why weights differ, which might involve subjective judgments and invite criticism about arbitrariness.

  Bottom line: Step 4 is the weak link. By recognizing that scaling utility doesn't solve interpersonal comparisons, the user can block the slide to utilitarianism while keeping core axioms intact. This preserves expected utility for individuals and society, plus Pareto, but demands a richer account of how to compare utilities ethically, which is a worthwhile cost for avoiding reductio.
answer: |-
  ### Summary
  I reject step (4). Fixing a common scale for utilities—by stipulating a zero point, unit, and reference lottery—does *not* genuinely enable interpersonal comparisons of utility levels or differences. This step smuggles in a substantive ethical assumption disguised as a technical normalization, and it is not justified by the axioms alone.

  ### Why that step looked innocent
  Step (4) appears harmless because it mimics scientific standardization (e.g., defining meters or kilograms) and is routine in applied economics. Expected utility functions *are* unique only up to affine transformations (scale and origin), so it seems natural to "fix" them for comparability. Harsanyi's theorem explicitly requires cardinal, interpersonally comparable utilities, so step (4) seems like a prerequisite for aggregation. Your friend likely assumes that once utilities are cardinal (measuring intensity and differences), choosing a common scale *must* resolve interpersonal comparisons. This conflation arises because cardinality is necessary but insufficient: it allows *intrapersonal* comparisons of utility differences, but says nothing about whether, say, a "unit" of utility for Alice equals a "unit" for Bob. The move looks like a benign calibration, but it implicitly asserts that utility differences are comparable *across persons* without ethical justification. Harsanyi’s setup treats this as unproblematic, masking that "stipulation" here is an ethical choice—not a mathematical necessity.

  ### What rejecting it costs
  Rejecting step (4) blocks the theorem’s slide to utilitarianism but forces you to abandon the dream of purely technical interpersonal comparisons. You must either:
  - **Deny that full interpersonal comparability is achievable** without ethical axioms beyond Pareto and utility theory. This costs conceptual tidiness: welfare economics cannot avoid normative philosophy. Aggregation would require independent principles (e.g., "a unit of utility for the worst-off matters more") to ground comparisons, inviting debates about objectivity.  
  - **Sacrifice step (3)—the Pareto principle**—if pressed. Pareto seems unassailable, but rejecting it permits social preferences to override unanimous individual rankings (e.g., banning mutually beneficial but "immoral" trades). This risks paternalism and conflicts with liberal values.  
  - **Sacrifice step (2)—social EU axioms**—by arguing that rational social choice need not satisfy expected utility. This allows egalitarian or prioritarian views (e.g., social welfare as the minimum utility), but forces complex, non-linear aggregation rules. However, it abandons the elegant link between individual and social rationality under uncertainty.  

  Compared to these, rejecting step (4) is less disruptive: it preserves (1)–(3) and avoids utilitarianism’s extremes, but demands explicit ethical justification for *how* utilities compare. You trade mathematical convenience for normative honesty.

  ### The second-best target
  Step (6) is the next weakest point. Rejecting equal weights (\(a_i = a_j\)) doesn’t require abandoning moral equality. Weights could differ based on need, responsibility, or historical disadvantage—e.g., prioritizing the utility of the worst-off (prioritarianism) or correcting for privilege. Your friend’s claim that unequal weights violate moral equality conflates *treatment* with *impact*: equal moral concern may demand *higher* weight for the marginalized to achieve fairness, not uniform weights. However, this risks ad hoc weight assignments and opens debates about bias. It also fails to resolve step (4)’s core issue: weights presuppose comparability, so unequal weights still rely on the shaky scaling in (4). Thus, while step (6) is softer than your friend admits, step (4) remains the deeper flaw.

  ### Bottom line
  Step (4) fails because stipulating a common utility scale doesn’t solve interpersonal comparability—it assumes it. By rejecting this, you retain individual and social rationality (1)–(3) while avoiding utilitarianism’s reductio. The cost: you must defend interpersonal comparisons ethically, not mathematically. This is a feature, not a bug; it prevents utilitarianism from masquerading as value-neutral.
