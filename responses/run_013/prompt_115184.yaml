  The user wants:
  - Ratings (0-5) for each case showing how much each morality would approve of specific actions
  - Ranking of cases by gap size between ratings
  - Analysis of the three largest gaps (nature of moral disagreement)
  - Explanation for two smallest gaps (why they fail to distinguish moralities)
  - Closing evaluation of which morality fares better in high-conflict cases

  Key challenges: 
  - Avoiding stereotyping while preserving conceptual distinction
  - Identifying which specific actions to rate in multi-actor cases
  - Determining if disagreements are about moral weight, moral domain, or contextual emphasis

  For rating consistency:
  - High form-approval (4-5) = rule-following maintains social fabric
  - High voice-approval (4-5) = conscience-driven deviation from rules
  - Mid-range ratings (2-3) capture mixed or conditional approval
  - Low ratings (0-1) indicate active disapproval

  Notable patterns emerge:
  - Largest gaps occur when rule-following seems purely procedural (B, E, F) - here form-morality insists on compliance while voice-morality sees emptiness
  - Smallest gaps (D, H) involve pragmatic considerations that both systems accommodate
  - Case C (the leak) shows surprising alignment - both value integrity but through different channels

  In the closing evaluation, I argue for voice-morality's adaptability while acknowledging form-morality's value in clear structural contexts. The cases reveal voice-morality's stronger protection against institutional overreach, though form-morality prevents social fragmentation.

  The answer string will provide the requested technical summary.
