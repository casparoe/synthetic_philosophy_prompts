  Here are the ratings, analysis, and conclusions for your eight cases. I've rated the **key conduct that creates moral tension** in each scenario, focusing on the act that highlights the form/voice divide. Ratings are on a 0-5 scale (5 = strong approval, 0 = strong disapproval). The gap is calculated as (Form-rating) minus (Voice-rating), so a positive gap means form-morality is more approving.

  ### (a) Ratings Table
