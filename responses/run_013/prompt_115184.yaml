  | G    | HOA enforcing covenant against family        | 5             | 1              | +4          |
  | H    | Woman apologizing falsely to end meeting     | 3             | 1              | +2          |

  ### (b) Ranking by Gap Size (Largest to Smallest)
  | Rank | Case | Gap | Signed Gap Description                 |
  |------|------|-----|----------------------------------------|
  | 1    | B    | -4  | Form disapproves strongly; voice approves strongly |
  | 1    | E    | -4  | Form disapproves strongly; voice approves strongly |
  | 2    | G    | +4  | Form approves strongly; voice disapproves strongly |
  | 3    | A    | -3  | Form disapproves; voice approves       |
  | 3    | D    | -3  | Form disapproves; voice approves       |
  | 3    | F    | -3  | Form disapproves; voice approves       |
  | 4    | C    | -2  | Form mixed; voice approves             |
  | 5    | H    | +2  | Form mixed; voice disapproves          |

  ### (c) Analysis of Three Largest Gaps
  **Case B (Gap: -4) – The Form**  
  This reveals a **genuine moral disagreement about what matters**. Form-morality sees the employee’s refusal as a dereliction of institutional duty: rules exist to bind collective action, and personal belief is irrelevant to procedural compliance. Voice-morality views the act as integrity: signing without belief is hollow complicity. Under pressure (e.g., a form enabling harm), the gap might narrow if form-morality concedes rules can be illegitimate, but here the rule’s triviality makes voice-morality’s stance more compelling to its adherents—form-morality would double down, seeing even pointless rules as social glue.

  **Case E (Gap: -4) – The Twelve-Page Paper**  
  This is a **dispute over the moral/conventional boundary**. Form-morality treats the length rule as a moral demand because it upholds academic structure; violating it undermines fairness and predictability. Voice-morality sees it as purely conventional, subordinating it to the substantive moral good of honest scholarship. Under pressure (e.g., a high-stakes exam), form-morality might rigidly enforce the rule, while voice-morality would dismiss it as bureaucratic—no convergence, as they prioritize fundamentally different goods (order vs. authenticity).

  **Case G (Gap: +4) – The Fence**  
  This is a **difference in emphasis that could partially collapse under pressure**. Form-morality approves strict enforcement to prevent communal decay, viewing rules as pre-commitments against bias. Voice-morality condemns it as petty, prioritizing individual autonomy over minor infractions. If the violation threatened material harm (e.g., a safety hazard), voice-morality might reluctantly accept enforcement. But in this low-stakes case, the gap persists: form-morality fears slippery slopes, while voice-morality sees rule-worship.

  ### (d) Analysis of Two Smallest Gaps
  **Case C (Gap: -2) – The Leak**  
  This fails to cleanly separate the moralities because **both value moral integrity**, differing only in method. Form-morality moderately disapproves of leaking (prioritizing process to preserve systemic trust) but approves the intent to stop harm. Voice-morality strongly approves leaking (conscience demands immediate action) but acknowledges process has instrumental value. The case centers on **institutional trust vs. urgency**, not core morality—both agree dumping is wrong, blurring the gap.

  **Case H (Gap: +2) – The Apology**  
  The gap is small because the conflict is **more about pragmatism vs. truthfulness in communication** than moral foundations. Form-morality weakly approves the apology as sustaining social function (“keeping the room workable”). Voice-morality weakly disapproves as dishonesty but recognizes social context. Neither treats it as a high-stakes moral breach; it’s primarily a **disagreement about etiquette and role-based expectations**.

  ### (e) Closing Evaluation: Defensibility and Position
  In the largest-gap cases (B, E, G), both moralities respond to real dangers but voice-morality emerges as more defensible in modern pluralistic contexts. Form-morality’s strength—preventing chaos via uniform rules (Case G)—becomes a weakness when rules are arbitrary (B, E), risking "idolatry" of procedure that alienates moral agents. Voice-morality’s risk of individualism (Case A, D) is mitigated by its emphasis on conscience, which can internalize social goods (e.g., in Case C, both colleagues seek justice). Crucially, voice-morality better handles opaque or corrupt systems: demanding personal scrutiny prevents complicity (B, F), whereas form-morality can demand obedience without moral engagement (as in the employee signing a harmful form). I side with voice-morality because it centers human agency in moral reasoning. While form-morality sustains cooperation, it can normalize alienation when rules decouple from shared good—a danger more acute in complex societies where rules are often opaque or imposed. Voice-morality’s demand for authenticity forces continual re-evaluation of rules, ensuring they serve people, not vice versa.

