answer: |-
  ### Essay Question  
  **Analyse the following case using Lakatos’s methodology of scientific research programmes (MSRP):**  
  *The "recruitment programme" claims cascades (a class of phenomena) arise solely through a "recruitment" mechanism. Its protective belt includes assumptions about thresholds, noise, and boundaries. Four episodes occur:*  
  1. **Anomaly:** Cascades lacking threshold behaviour are observed. Theorists add the auxiliary assumption of "hidden triggers" seeding cascades. They predict that removing triggers suppresses cascades; experiments confirm this.  
  2. **Anomaly:** New irregular cascade patterns emerge. Theorists introduce a freely adjustable parameter ("k") tuned per case, issuing no new predictions.  
  3. **Anomaly:** Cascades violating core predictions appear. Theorists redefine "recruitment" to exclude these cases (now deemed "non-cascades").  
  4. **Development:** The parameter "k" (from Episode 2) is reinterpreted as measuring "network susceptibility," generating a novel prediction confirmed by experiment.  

  **Classify each episode as progressive or degenerating. Explain your classifications. Then, address:**  
  - Can we deem an episode "degenerating" *as it happens*, or only after seeing future developments?  
  - Can a research programme be appraised without knowing its future trajectory?  
  - Does the hard core *itself* need to generate predictions, or can it be non-empirical (e.g., normative)? Discuss implications for programmes with interpretive/normative cores.  

  ---

  ### Model Answer (600 words)  
  **Classifications:**  
  *   **Episode 1** is **progressive**. The anomaly (missing thresholds) is addressed by adding an auxiliary hypothesis ("hidden triggers") within the protective belt. Crucially, this yields a *novel prediction* (trigger removal suppresses cascades) that is *empirically confirmed*. This aligns with Lakatos’s positive heuristic: modifying the belt to generate new, testable content that corroborates the core.  
  *   **Episode 2** is **degenerating**. The anomaly (irregular patterns) is addressed by introducing a freely adjustable parameter "k" tuned ad hoc for each case. No novel predictions are made. This exemplifies a "linguistic pivot" (Lakatos's term for ad hoc manoeuvres) that merely accommodates existing data without increasing predictive power or testability—a hallmark of degeneration.  
  *   **Episode 3** is **degenerating**. The anomaly is "resolved" by redefining the core concept ("recruitment") to exclude problematic cases. This is *concept-stretching*: it protects the core by altering its meaning, rendering it less falsifiable and avoiding empirical engagement. It shrinks the programme’s explanatory domain rather than expanding it.  
  *   **Episode 4** is **progressive**. The previously ad hoc parameter "k" is reinterpreted as a genuine theoretical entity ("network susceptibility"). This *theoretically progressive* shift opens a new line of inquiry (studying susceptibility) and yields a *novel prediction* that is confirmed, demonstrating empirical progress. It retroactively salvages the degenerating move in Episode 2.  

  **Timing and Unit of Appraisal:**  
  Lakatosian appraisal is inherently **retrospective** and **holistic**. We cannot reliably deem Episode 2 "degenerating" *as it happens*. At the time, it might appear a temporary stopgap. Only *later*, seeing Episode 4’s reinterpretation yield progress, can we judge Episode 2 as a degeneration that was *redeemed*. Conversely, Episode 3’s degenerating nature is clearer immediately because it shrinks the programme’s scope—a clear violation of the positive heuristic. Appraisal requires seeing multiple problem shifts over time; isolated episodes are ambiguous. This means we **cannot definitively appraise a programme without knowing its future**. A programme may appear degenerating (e.g., after Episodes 2 & 3) but later recover (Episode 4). MSRP evaluates trajectories, not snapshots.  

  **The Hard Core and Prediction:**  
  Lakatos **does not require the hard core itself to make direct predictions**. Its role is to be *irrefutable by convention*, providing a stable foundation. Predictions arise from the *protective belt*, guided by the heuristics. This is crucial for programmes with **non-empirical cores** (e.g., normative or interpretive commitments, like "all behaviour is utility-maximising" in economics). Such cores cannot be directly tested. Progress hinges on whether auxiliary theories in the belt, built *under the core’s guidance*, generate novel predictions. If the belt consistently produces degenerating shifts (like Episodes 2 & 3), the core’s viability is undermined *indirectly*. However, a normative core can sustain progress if its belt yields corroborated predictions (e.g., novel implications of utility maximisation). The core’s merit lies in its *fruitfulness* in directing progressive belt adjustments.  

  ---

  ### Marking Scheme (20 marks total)  
  **Top Answers (A range: 16-20 marks)** connect classifications to Lakatosian principles, explicitly address the appraisal paradox, and extend analysis to non-empirical cores. **B answers (12-15 marks)** classify episodes correctly and describe appraisal timing but lack depth on implications or non-empirical cores.  

  | **Moves**                                                                 | **Marks** | **Common Mistakes (Lose Marks Here)**                              |
  | :------------------------------------------------------------------------ | :-------- | :----------------------------------------------------------------- |
  | **1. Correct classification & justification for Episode 1** (Progressive) | 3         | Calling it degenerating due to adding an assumption; missing novel prediction. |
  | **2. Correct classification & justification for Episode 2** (Degenerating)| 3         | Missing the ad hoc, non-predictive nature of the free parameter.   |
  | **3. Correct classification & justification for Episode 3** (Degenerating)| 3         | Confusing with legitimate belt adjustment; missing concept-stretching. |
  | **4. Correct classification & justification for Episode 4** (Progressive) | 3         | Failing to link reinterpretation to novel prediction/progress.     |
  | **5. Appraisal Timing:** Argues degeneration verdict requires hindsight, using Ep2/Ep4 as evidence. | 3         | Claiming episodes can *always* be judged immediately; ignoring redemption potential. |
  | **6. Unit of Appraisal:** States programme trajectory (not episodes) must be appraised holistically. | 2         | Suggesting single episodes suffice for appraisal.                  |
  | **7. Hard Core & Prediction:** States core doesn’t predict; predictions come from belt. | 1         | Demanding direct empirical content from the core.                  |
  | **8. Non-Empirical Cores:** Explains how normative/interpretive cores can drive progress *indirectly* via belt. | 2         | Claiming non-empirical cores make MSRP inapplicable; not explaining belt’s role. |

  **A vs B Differentiation:**  
  - **A Answers** achieve all 8 moves, especially **5, 6, 8**, showing how Ep4 retroactively alters Ep2’s status and how normative cores work *through* the belt.  
  - **B Answers** score well on moves 1-4 and partially on 5-6, but miss the implications for non-empirical cores (move 8) or the holistic/retrospective nuance (moves 5-6).
