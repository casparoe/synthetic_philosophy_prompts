prompt: |-
  I spent thiry-odd years as a geologist and since I retired I've been trying to teach myself philosophy, mostly by running a small monthly discussion group — about twenty other retirees, a mix of scientists, engineers and a couple of doctors — at our local U3A. I've got the next session to lead and I want to do the paradox of voting, the thing where it seems like it can't be rational to bother voting at all. But I don't want to just talk at them about it. I want them to actually feel the squeeze.

  Here's what I've got so far, and I'd like you to turn it into a proper runnable session.

  The setup: the group has to pick one of three things — I'll use three options for what we do at the following month's meeting, call them A, B and C, because it's something they genuinely care about a little, which matters. I'll hand out preference slips so the room divides exactly into three equal blocks:

  - a third rank them A, then B, then C
  - a third rank them B, then C, then A
  - a third rank rank them C, then A, then B

  (I'll make the headcount divisible by three, so 18 or 21 people.)

  If you take those blocks and run pairwise majority votes, you get A beating B, B beating C, and C beating A — rock, paper, scissors, no winner. And if you just ask everyone for their single favourite you get a dead three-way tie. So the first thing I want them to bang into is that there's no "will of the people" sitting there waiting to be discovered; the answer depends on how you ask the question.

  Then the second half. Once they've felt that, I want to add the cost. Everyone starts with, say, three tokens (redeemable for something at the end — biscuits, whatever). To cast a vote you have to drop one token in the box. And whatever wins gets delivered to everyone, voters and abstainers alike. And here's the twist I want you to build the mechanics around: I'm going to announce up front that the outcome will be decided by drawing a handful of ballots (say five) at random out of the box, not by counting them all. So your one vote only ever counts if it happens to get drawn and happens to be the one that breaks a tie. Voting costs you a token for certain; abstaining is free.

  I want the whole thing to run about 75 minutes and I'd like it to mostly run itself while I keep my mouth shut and just note down what happens.

  What I need from you: the actual rules and a script for me (what I say, when, what I hand out), the materials, the payoff scheme spelled out so its fair, a rough timeline for the 75 minutes, and — the part I care about most — a debrief that takes what just happened in that room and shows them the pieces of the real problem: why the instrumental case for voting collapses once the electorate gets big, why the aggregation itself can be incoherent, why people vote anyway, and where the strategic temptation shows up (voting for your second choice to block your third). Tell me honestly what will go wrong the first time I run it and how I should handle it, and tell me which part of the paradox this setup simply can't reproduce, so I know what I'll have to say myself instead of letting them discover it.

  Oh, and no reading lists or citations please — half of them will nod along and never look anything up, and I can't have the session hinge on names I'd only get wrong anyway.
reasoning: |-
  We are going to design an interactive session to explore the paradox of voting. The session is divided into two main parts: 
  1. Demonstrating the Condorcet paradox and the dependence of the outcome on the voting method.
  2. Introducing the cost of voting and the low probability of being pivotal to explore the rationality of abstention.

  The session plan:

  Total time: 75 minutes

  Materials:
  - Preference slips (with three options: A, B, C) for each participant.
  - Tokens (three per participant) - can be small pieces of paper or physical tokens.
  - A box for collecting votes (with tokens).
  - A way to randomly draw ballots (e.g., a hat or a box to draw from).
  - A flip chart or whiteboard to record results.

  Participants: 18 or 21 (divisible by 3). We'll assume 18 for this example.

  Structure:

  Part 1: The Aggregation Problem (approx. 30 minutes)
  - Introduction (5 min)
  - Preference collection and voting (10 min)
  - Results and discussion (15 min)

  Part 2: The Cost of Voting and the Paradox (approx. 40 minutes)
  - Setting up the game with costs (5 min)
  - Voting/abstention phase (5 min)
  - Random drawing and outcome determination (5 min)
  - Debrief and discussion (25 min)

  Detailed Script:

  Part 1: The Aggregation Problem (30 min)

  Introduction (5 min):
  "Welcome to today's session. We're going to make a decision as a group about what we'll do at next month's meeting. We have three options:
  - Option A: [Describe briefly, e.g., a film screening]
  - Option B: [Describe, e.g., a guest speaker]
  - Option C: [Describe, e.g., a debate on a topic]

  We have 18 people here. Each of you will get a slip to rank these three options. You must rank them in order of preference, 1st, 2nd, and 3rd. But note: I'm going to assign the rankings in a specific way to ensure we have three equal groups. This is to simulate a particular scenario. So, I'll hand out the slips already filled in. Your job is to play along as if these are your real preferences."

  Hand out the preference slips. One third (6 people) get:
    1st: A, 2nd: B, 3rd: C
  Another third (6 people) get:
    1st: B, 2nd: C, 3rd: A
  The last third (6 people) get:
    1st: C, 2nd: A, 3rd: B

  "Now, we're going to vote in two ways. First, we'll have a simple plurality vote: just pick your top choice. Then, we'll have pairwise votes: A vs B, B vs C, and C vs A."

  Voting (10 min):
  1. Plurality vote: Ask everyone to write their top choice on a piece of paper and collect. Count and announce: each option gets 6 votes -> tie.

  2. Pairwise votes:
     - First, A vs B: Ask everyone to choose between A and B (ignore C). Collect votes and count: 
          - The group with A>B>C: vote A
          - The group with B>C>A: vote B
          - The group with C>A>B: vote A (because they prefer A over B)
          So A gets 12 votes (A group and C group) and B gets 6 votes (B group). A wins.
     - Then, B vs C: 
          - A group: prefers B over C -> vote B
          - B group: vote B
          - C group: prefers C over B -> vote C
          So B: 12, C: 6 -> B wins.
     - Then, C vs A:
          - A group: prefers A over C -> vote A
          - B group: prefers C over A -> vote C
          - C group: vote C
          So C: 12, A: 6 -> C wins.

  Record the cycle: A beats B, B beats C, C beats A.

  Discussion (15 min):
  "What do we see? In the first vote (plurality) we had a three-way tie. Then in the pairwise votes we got a cycle: A beats B, B beats C, and C beats A. So what is the 'will of the people'? It depends on how we count the votes! There's no clear winner because the group's preferences are cyclical. This is known as the Condorcet paradox. It shows that even if every individual has rational (transitive) preferences, the group preference can be intransitive."

  Part 2: The Cost of Voting and the Paradox (40 min)

  Setup (5 min):
  "Now we're going to run a second experiment. This time, we're going to vote again on the same three options, but with a twist. Each of you starts with three tokens (hand out three tokens to each). These tokens are valuable: at the end, each token you have left can be exchanged for a biscuit (or whatever). 

  To vote, you must pay a cost: if you want to cast a ballot, you must put one token in the box along with your ballot. But note: we are not going to count every ballot. Instead, I will randomly draw five ballots from the box. The outcome will be decided by these five ballots only, using the plurality rule: the option with the most votes among these five wins. If there's a tie, I'll break it randomly.

  Important: You have three choices:
  1. You can abstain (keep your token, and don't vote).
  2. You can vote for your true top choice.
  3. You can vote strategically (for any option, even if it's not your top choice).

  The outcome: whichever option wins will be implemented for next month's meeting, and everyone will enjoy it, regardless of whether you voted or not. But you get to keep your tokens (and exchange them for biscuits) only if you don't spend them.

  So, the cost of voting is one token (for sure). The benefit? Your vote only matters if it is one of the five drawn and if it breaks a tie. Otherwise, it doesn't affect the outcome. Given that, it might be rational to save your token and let others vote. But if everyone does that, then no one votes and we have no decision. Or, you might vote strategically to try to block an option you dislike.

  You have 5 minutes to decide whether to vote and for whom. Then, we'll collect the ballots and tokens from those who choose to vote."

  Voting/Abstention Phase (5 min):
  Participants decide. They can either:
  - Abstain: do nothing, keep their tokens.
  - Vote: write their chosen option on a ballot, put it in the box with one token.

  Collect the box.

  Random Drawing and Outcome Determination (5 min):
  Draw five ballots at random from the box. Count the votes on these five. If there is a tie, flip a coin (or use some random method) to break it. Announce the winner.

  Also, after the drawing, note the total number of votes cast (so participants know how many ballots were in the box). This is important for the debrief.

  Debrief and Discussion (25 min):

  Key points to draw out:

  1. **The Instrumental Case for Voting Collapses in Large Electorates:**
     - In a large election, the probability that your vote is pivotal (changes the outcome) is very low. Here, even with 18 people, we made it low by drawing only five ballots. The cost of voting (one token) is certain, while the chance of affecting the outcome is tiny. So why did some people vote?
     - Ask: "How many of you voted? Why? How many abstained? Why?"
     - Note: Some might have voted because they enjoy voting (expressive), or because they feel it's a duty. Others might have thought that if too many abstain, then the five drawn might not represent the group. This leads to the idea of ethical or expressive reasons to vote.

  2. **The Aggregation Problem Remains:**
     - Even with the small sample, we might have seen a cycle? (But note: we only did plurality on the five, so not pairwise. We can't show a cycle in this part, but we can note that the outcome might be arbitrary because of the small sample and the voting method.)

  3. **Strategic Voting:**
     - Did anyone vote for their second choice to block their third? For example, if you are in the group that prefers A, but you see that B is more popular, you might vote for C to try to beat B? But note: because the sample is random and small, it's very hard to strategize. However, the temptation exists in real elections.

  4. **What Happened in Our Experiment?**
     - How many votes were cast? (Say, V votes in total). Then the chance that any particular vote was drawn was 5/V. But even if drawn, it only matters if it breaks a tie. In the sample of five, the chance of being pivotal is low. So the expected benefit is (chance of being drawn) * (chance of being pivotal in the sample) * (value of changing the outcome). 
     - The value of changing the outcome: if you prefer A over B, and B is about to win, then changing it to A gives you a benefit. But you have to quantify that. Here, we didn't assign a numerical value, but participants can think about the ranking.

  5. **Why Do People Vote?**
     - The paradox: instrumentally, it's irrational to vote because the cost exceeds the expected benefit. But people do vote. Why? Because of:
       - Expressive benefits (you like to express your preference)
       - Civic duty
       - Misperception of the probability of being pivotal
       - Social pressure
       - The desire to be part of the process

  6. **What Couldn't We Reproduce?**
     - In real elections, the electorate is huge (millions), so the chance of being pivotal is astronomically low. We simulated a small version, but even then, the cost was a token (which might not be valued as highly as time/effort in real life). Also, we didn't have the full strategic complexity because the random drawing makes it very hard to strategize.

  Potential Problems and Handling:

  1. **Problem:** The random drawing might not actually show a pivotal situation because the sample of five might have a clear winner (e.g., 3-2). Then no vote was pivotal.
     - **Handling:** That's okay. Point out that even when you vote, most of the time your vote doesn't change the outcome. In fact, in the five drawn, the chance of a tie (where one vote could flip it) is relatively low. You can calculate the probability: for example, if the five ballots are split 3-2, then the two votes for the losing option were not pivotal. Only if it's 2-2-1 (and then one vote could make a difference) or 3-1-1 (then the lone vote might be pivotal if one more changes it to 2-2-1) but it's complex. The point is: it's rare.

  2. **Problem:** Participants might not take the tokens seriously (they don't care about biscuits). 
     - **Handling:** Emphasize the tokens are valuable. Maybe use something more desirable? Or explain that in real life, the cost is time and effort.

  3. **Problem:** The preference slips in Part 1 are assigned, not real. Some might object.
     - **Handling:** Explain it's a thought experiment to set up the cycle. The point is to illustrate the aggregation problem.

  4. **Problem:** In Part 2, if too many abstain, then we might have fewer than five votes. 
     - **Handling:** If there are fewer than five votes, then draw all. If no votes, then we have to decide by another method (flip a coin). This is a great point: if everyone abstains, then the outcome is random. But if even one person votes, that person might determine the outcome. So if the cost is low and the benefit is high, one person might vote. But then, why not let that one person decide? But if everyone thinks that way, then no one votes.

  5. **Problem:** Strategic voting might not occur because the situation is too uncertain.
     - **Handling:** That's realistic. In large elections, strategic voting is hard because you don't know what others will do. We can discuss that in the debrief.

  Debrief Script:

  "Let's reflect on what happened. First, how many of you voted? [Raise hands] How many abstained? Why?

  [Allow a few responses.]

  In the voting game, you had to pay a token to vote. But the outcome was decided by only five randomly drawn ballots. So, what was the chance that your vote would be drawn? If V votes were cast, then 5/V. And even if drawn, your vote would only change the outcome if the other four ballots were split in a way that your vote breaks a tie. For example, if the four ballots were 2-2, then your vote decides. But if they are 4-0, then it doesn't. So the chance of being pivotal is low. Therefore, the expected benefit of voting (the value of changing the outcome times the probability of changing it) is very small. The cost (one token) is certain. So why did some of you vote?

  [Discuss: duty, expression, hope to be pivotal, etc.]

  In real elections with millions of voters, the chance that your vote is pivotal is astronomically small. So why do people vote? This is the paradox of voting. It seems irrational to vote because the cost (time, effort) exceeds the expected benefit. But people do vote. Some explanations are:

  - Expressive voting: You get satisfaction from expressing your support.
  - Civic duty: You feel it's the right thing to do.
  - Social norms: Voting is expected, and you might feel guilty if you don't.
  - Misperception: People overestimate the chance that their vote matters.

  Also, we saw in the first part that the method of voting matters. We had a cycle. This means that even if everyone votes, the outcome might not reflect a coherent group preference. So the aggregation problem and the cost problem together make voting seem irrational.

  But we also saw that if everyone abstains, then we get a random outcome. So there's a collective action problem: we all want an outcome that reflects our preferences, but individually we don't want to pay the cost.

  Finally, did anyone vote strategically? For example, vote for your second choice to block your third? [If so, ask why.] In real elections, people sometimes do this (like voting for a less preferred candidate who has a better chance of winning to prevent a worse candidate from winning). But in our setup, because the sample was random and small, it was hard to strategize. In large elections, strategic voting is also difficult because it's hard to predict what others will do.

  This leaves us with a puzzle: voting seems irrational, but we do it. And even when we vote, the outcome might not be what we want because of how the votes are counted. Yet democracy relies on voting. So what's the solution? We might have to accept that voting isn't just about the outcome. It's about participation, expression, and the legitimacy of the process. And we might need to design better voting systems to avoid cycles and better reflect preferences (like ranked-choice voting, which we didn't cover today).

  But that's a topic for another session.

  Thank you for participating!"

  Timeline:

  - 0-5 min: Introduction and handout of preference slips for Part 1.
  - 5-15 min: Plurality vote and pairwise votes in Part 1.
  - 15-30 min: Discussion of Part 1 (cycle, aggregation problem).
  - 30-35 min: Introduction to Part 2 (voting cost, random drawing, tokens).
  - 35-40 min: Decision and voting in Part 2.
  - 40-45 min: Random drawing and outcome determination.
  - 45-70 min: Debrief and discussion (25 minutes).
  - 70-75 min: Wrap up.

  Note: The debrief is the most important part. Make sure to leave enough time and guide the discussion to the key points.

  This session should give the participants a visceral experience of the paradox and the aggregation problem.
answer: |-
  Below is a complete, runnable session plan designed to make your group experience both the aggregation paradox (no clear "will of the people") and the cost/benefit paradox (why voting seems irrational). It includes scripts, materials, a payoff scheme, a timeline, debriefing points, and notes on limitations. The goal is to minimize your talking and maximize their "feeling the squeeze."

  ---

  ### **Session Overview**
  - **Total Time:** 75 minutes  
  - **Participants:** 18 or 21 (divisible by 3; we'll use 18 for this plan).  
  - **Materials Needed:**  
    - Preference slips (three types, pre-filled for Part 1).  
    - Voting tokens (three per person; e.g., poker chips, colored paper, pebbles).  
    - A ballot box (any box with a slit).  
    - A draw bag or hat (for random ballot selection in Part 2).  
    - A whiteboard/flip chart to record results.  
    - Small prizes (e.g., biscuits, chocolates) for token redemption.  

  ---

  ### **Part 1: The Aggregation Problem (35 min)**  
  #### Goal: Show that the "will of the people" depends on how you vote—no coherent group preference exists.  

  #### **Script & Flow**  
  1. **Introduction (5 min)**:  
     - *You say:* "Next month, we’re choosing an activity: **Option A** [e.g., 'Nature Documentary'], **Option B** ['Science Debate'], or **Option C** ['Guest Speaker']. Each of you has genuine preferences, so we’ll vote today. I’ve assigned preferences randomly to ensure fairness—play along as if these are your real views."  
     - Hand out **pre-filled preference slips** (6 slips each for Groups 1, 2, and 3):  
       - Group 1: A > B > C  
       - Group 2: B > C > A  
       - Group 3: C > A > B  
     - *Note:* Assign groups discreetly (e.g., mark slips 1–6 as Group 1, 7–12 as Group 2, etc.) to avoid bias.  

  2. **Voting Rounds (15 min)**:  
     - **Round 1: Plurality Vote**  
       - *You say:* "Vote for your *top* choice only. No rankings."  
       - Collect votes → Outcome: **A:6, B:6, C:6 (tie)**. Record on whiteboard.  
     - **Round 2: Pairwise Votes**  
       - *You say:* "Now, we’ll run head-to-head matchups. Vote for one option in each pair."  
       - **A vs. B**: Collect votes → A wins (Group 1 and Group 3 prefer A > B → 12 vs. 6).  
       - **B vs. C**: B wins (Group 1 and Group 2 prefer B > C → 12 vs. 6).  
       - **C vs. A**: C wins (Group 2 and Group 3 prefer C > A → 12 vs. 6).  
       - Record: **A beats B, B beats C, C beats A → Rock-Paper-Scissors cycle**.  

  3. **Discussion (15 min)**:  
     - *You say:* "Look at the results. What’s the ‘right’ outcome? In Round 1, a tie. In Round 2, a cycle where no option wins. What does this tell us?"  
     - **Guiding questions (write on board)**:  
       - "Is there a ‘will of the people’ here?"  
       - "Why does the outcome depend on the voting method?"  
     - *Let them discuss.* Key takeaways will emerge:  
       - Preferences are coherent individually but incoherent as a group.  
       - No voting system is perfect—**the paradox is in the aggregation, not the voters**.  

  ---

  ### **Part 2: The Cost of Voting Paradox (40 min)**  
  #### Goal: Make them feel why voting seems irrational—costs are certain, but benefits are near-zero.  

  #### **Setup & Rules**  
  - **Token System**:  
    - Each person starts with **3 tokens** (redeemable for 1 biscuit each after the session).  
    - To vote, they must drop **1 token + ballot** into the box.  
    - Abstention costs nothing.  
  - **Voting Mechanics**:  
    - They vote for **one option** (A, B, or C) or abstain.  
    - **Only 5 ballots** are drawn randomly from the box to decide the outcome.  
    - **Payoff**: The winning option is delivered to *everyone* (voters and abstainers). Tokens are kept only if not spent.  
  - **Strategy Allowed**:  
    - *You say:* "You can vote for your true favorite or strategically (e.g., vote for your second choice to block your third). Do whatever you think is rational."  

  #### **Script & Flow**  
  1. **Introduction (5 min)**:  
     - *You say:* "New rules: Voting costs 1 token. Abstention is free. Only 5 random ballots decide the winner. The outcome affects everyone equally. Tokens = biscuits. You have 2 minutes to decide whether to vote and for whom."  
     - Hand out blank ballots and tokens.  

  2. **Voting Period (5 min)**:  
     - Participants decide:  
       - **Abstain**: Keep tokens, no ballot.  
       - **Vote**: Write A, B, or C on ballot, drop 1 token + ballot in box.  
     - *You stay silent.* Observe behavior (e.g., hesitation, group whispers).  

  3. **Outcome Determination (5 min)**:  
     - Count total ballots cast (e.g., "12 votes were cast").  
     - Draw 5 ballots randomly from the box.  
     - Tally the 5: e.g., "A:2, B:2, C:1 → Tie between A and B."  
     - Break ties randomly (e.g., coin flip). Announce winner (e.g., "A wins").  

  4. **Token Redemption**:  
     - After the session, exchange tokens for biscuits (1 token = 1 biscuit).  

  ---

  ### **Debrief: Connecting to the Real Paradox (25 min)**  
  **Goal:** Use their lived experience to explain the voting paradox. Ask questions to draw out key insights.  

  #### **Guided Discussion Flow**  
  1. **The Instrumental Irrationality of Voting**:  
     - *You ask:* "Who abstained? Why?"  
       - Expected answers: "My vote probably wouldn’t matter," "Cost wasn’t worth it."  
     - *Key point:* "In this room, your vote only counted if it was drawn *and* broke a tie in the 5-ballot sample. What’s the probability?"  
       - Do quick math: If 12 votes cast, chance of being drawn = 5/12. Chance your vote breaks a tie in a 5-ballot sample? Tiny (e.g., ≈1-5%).  
       - *Squeeze:* "Cost (token) was certain. Expected benefit? Near zero. So why did anyone vote?"  
     - *Real-world link:* "In big elections (millions of voters), your chance of being pivotal is like winning the lottery. Instrumentally, voting is irrational—costs (time, effort) outweigh benefits. Yet people vote!"  

  2. **Why People Vote Anyway**:  
     - *You ask:* "Who voted? Why?"  
       - Expected answers: "It felt wrong not to," "I hoped I’d be the decisive one," "I wanted to support my choice."  
     - *Key points:*  
       - **Expressive voting**: Voting for identity/duty ("I’m a voter") not just outcomes.  
       - **Ethical motives**: Belief in civic duty or fairness.  
       - **Social/psychological**: Avoiding guilt, group pressure.  
     - *Squeeze:* "Even when irrational, voting persists. This is the paradox: we do it for non-instrumental reasons."  

  3. **Strategic Voting Temptation**:  
     - *You ask:* "Did anyone vote strategically? E.g., not for your top choice?"  
       - If yes: "Why? What were you afraid of?"  
       - If no: "In this setup, was it hard to strategize? Why?"  
     - *Key point:* "In the cycle (A>B>C>A), voting for your *second* choice might block your worst outcome. E.g., Group 1 (A>B>C) might vote B to stop C from winning. But with random drawing, strategy fails—you can’t predict outcomes. In real elections, this causes vote-splitting or tactical voting."  

  4. **The Unresolved Aggregation Problem**:  
     - *You ask:* "Even if everyone voted, would we get a ‘fair’ outcome after Part 1?"  
     - *Key point:* "The cycle means no Condorcet winner (an option that beats all others head-to-head). All voting systems have flaws—ranked-choice, approval voting, etc.—and can produce arbitrary outcomes. The paradox isn’t just about cost; it’s about aggregating preferences coherently."  

  ---

  ### **Timeline**  
  | Segment                | Time  | Activity                                                                 |
  |------------------------|-------|--------------------------------------------------------------------------|
  | **Part 1: Aggregation**| 0–5   | Intro + Distribute preference slips                                      |
  |                        | 5–20  | Voting Rounds (Plurality + Pairwise)                                     |
  |                        | 20–35 | Discussion: "No will of the people"                                      |
  | **Part 2: Cost**       | 35–40 | Intro token system + rules                                               |
  |                        | 40–45 | Voting/abstention period                                                 |
  |                        | 45–50 | Random draw + outcome announcement                                       |
  | **Debrief**            | 50–75 | Guided discussion (irrationality, motives, strategy, aggregation flaws) |

  ---

  ### **What Will Go Wrong & How to Handle It**  
  1. **Problem: Participants don’t take tokens seriously**.  
     - *Why:* Biscuits may feel trivial.  
     - *Fix:* Use desirable treats (e.g., fancy biscuits) or frame tokens as "participation points" for a prize raffle.  

  2. **Problem: Voting in Part 2 is unanimous or near-zero, killing the tension**.  
     - *Why:* Some groups over-vote (duty), others under-vote (rationality).  
     - *Fix:* If turnout is extreme, highlight it: "Why did 17 of 18 vote despite the cost?" or "Why did only 2 vote? What does that say?"  

  3. **Problem: The random draw produces a landslide (e.g., 4-1), so no one feels pivotal**.  
     - *Why:* Randomness can mask the pivotality tension.  
     - *Fix:* Use the result: "Even with 5 ballots, no vote was pivotal. In big elections, this is guaranteed."  

  4. **Problem: Strategic voting doesn’t emerge**.  
     - *Why:* The random draw makes strategy futile, so few attempt it.  
     - *Fix:* Ask: "Was it hard to strategize? In real elections, polls help—but here, randomness made it impossible."  

  ---

  ### **What This Setup Can’t Reproduce (Requiring Your Input)**  
  - **The Scale Problem**: In a room of 18, the chance of being pivotal (≈5%) is far higher than in real elections (≈1 in millions). Participants may underestimate how vanishingly small pivotality is in national elections.  
    - *What to say:* "Here, your vote had a 5% chance of mattering. In the UK general election? Less than 1 in a million. That’s why the instrumental case collapses completely at scale—but we vote anyway."  

  - **The Secret Ballot**: Your setup lacks social pressure (e.g., shame for abstaining), which boosts turnout in real life.  
    - *What to say:* "In this room, no one judged you for abstaining. Real elections have social norms—‘good citizens vote.’ That’s part of why we do it."  

  ---

  ### **Final Thought**  
  This session makes the paradox visceral: they’ll feel the frustration of incoherent outcomes (Part 1) and the pointlessness of costly voting (Part 2). The debrief ties it together without jargon. By the end, they’ll grasp why voting is a "paradox" — and why we do it anyway.  

  **Materials Prep Checklist**:  
  - [ ] Preference slips (6x A>B>C, 6x B>C>A, 6x C>A>B).  
  - [ ] 54 tokens (3 per person × 18).  
  - [ ] Ballot box + draw bag.  
  - [ ] Blank ballots (18).  
  - [ ] Prizes (biscuits).  
  - [ ] Whiteboard markers.  

  Run it tight, and they’ll leave buzzing—not just about voting, but about how fragile group decisions are. Good luck!
