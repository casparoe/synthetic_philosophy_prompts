  For the scorecard, I'll evaluate major theory families: all-affected, subjection-to-coercion, historical-association, and territorial/stakeholder views. I'll assess each against the desiderata and identify which requirement is most exclusionary—likely the institutional applicability, as it demands practicality that many theories lack.

  I need to ensure the response is structured but concise, avoiding citations. The user wants criteria, not literature. The analysis should validate their suspicion about the tension between principles and self-determination, as that's key to their thesis. Highlighting institutional applicability as the toughest criterion will provide them a clear target for theory development.
answer: |-
  Here are the desiderata for an adequate theory of democratic membership, structured per your request:

  **I. Cases Any Adequate Theory Must Handle (Requirements):**
  1.  **Full Subjection Without Voice:** Long-term residents subject to all local laws but lacking citizenship/voting rights. *(Rationale: Tests the link between subjection to binding rules and entitlement to participation.)*
  2.  **Formal Membership Without Residence:** Citizens living abroad long-term, still subject to taxation/service obligations, retaining voting rights. *(Rationale: Tests whether physical presence/residence is essential for membership vs. formal legal ties/continuing obligations.)*
  3.  **Developmental Incapacity:** Children and adults under permanent guardianship. *(Rationale: Tests how theories handle capacity for autonomous political agency as a potential limit on full voting inclusion.)*
  4.  **Transboundary Harm:** People in a neighbouring country harmed by decisions (e.g., dam, pollution) without a common state. *(Rationale: Tests the scope of the "affected" principle beyond territorial jurisdiction.)*
  5.  **Future Generations:** People not yet born affected by long-term decisions (e.g., infrastructure, environment). *(Rationale: Tests the theory's ability to incorporate non-present, non-agentic interests fundamentally affected by current decisions.)*
  6.  **The Boundary-Setting Circle:** A community declaring independence proposing to decide its own membership. *(Rationale: Tests the theory's ability to handle the foundational paradox of self-determination - who decides the initial demos?)*
  7.  **Indirect Market Effects:** People affected *only* through market mechanisms (e.g., distant workers impacted by wage-setting decisions elsewhere). *(Rationale: Tests the theory's ability to distinguish between direct/indirect effects and set principled limits on "affectedness".)*

  **II. Distinctions Any Adequate Theory Must Maintain (Requirements):**
  8.  **Membership ≠ Subjection:** Must provide a clear criterion distinguishing belonging to the demos *as a member* from merely being subject to its coercive decisions. *(Rationale: Prevents collapsing democracy into rule by affected stakeholders alone; preserves the concept of a bounded political community.)*
  9.  **Degrees of Inclusion:** Must accommodate or explain variations in political status (e.g., voice without legal subjection like foreign lobbyists; subjection without full voice like minors or felons; partial participation rights). *(Rationale: Reflects the complexity of real-world political statuses beyond a simple binary of member/non-member.)*

  **III. Constraints Any Adequate Theory Must Satisfy (Requirements):**
  10. **Institutional Applicability:** Must provide a principle that can be feasibly interpreted and applied by bounded institutions (like a municipal charter commission or river-basin authority) *without* presupposing the very demos they are trying to define. *(Rationale: Essential for the theory to guide real-world boundary-setting decisions by existing bodies.)*
  11. **Avoid Vicious Circularity:** The criterion for membership cannot fundamentally rely on the prior decision of the demos it seeks to define, especially regarding its own boundary. *(Rationale: Prevents logical paradoxes, particularly highlighted by the Boundary-Setting Circle case.)*
  12. **Principle-Based Boundary:** Must justify the boundary primarily by appeal to normative political principles (e.g., autonomy, fairness, legitimacy, self-determination) rather than *solely* contingent facts like current law or historical accident. *(Rationale: Provides normative justification essential for democratic legitimacy.)*

  **IV. Preferences (Reflecting Specific Normative Camps):**
  13. **Self-Determination Priority:** *Preference.* Favors theories where the demos has significant, though perhaps not absolute, control over defining its own boundaries as a core aspect of collective autonomy.
  14. **Maximal Inclusion of Affected:** *Preference.* Favors theories that err on the side of including all significantly affected individuals, potentially minimizing exclusions.
  15. **Stability/Predictability:** *Preference.* Favors theories yielding relatively stable and predictable membership boundaries over time.

  **V. Joint Feasibility Analysis:**
  *   The core tension you suspect exists: **The requirement for a Principle-Based Boundary (12) demanding justification independent of prior decisions clashes fundamentally with the Self-Determination Priority preference (13) and the Avoid Vicious Circularity requirement (11) in the Boundary-Setting Circle case (6).**
  *   **Analysis:** A theory satisfying (12) must derive the boundary from principles external to the demos's will (e.g., subjection, affectedness, territoriality). This inherently limits pure self-determination (13) over the *foundational* boundary. Conversely, prioritizing self-determination (13) at the foundational level makes (12) difficult, as the boundary becomes a product of the group's will, not an external principle. Requirement (11) forbids the theory from simply saying "the demos decides." **Therefore, satisfying (11), (12), and (13) jointly in the foundational case (6) is likely impossible.** Any adequate theory must navigate this tension, likely prioritizing either the external principle (12) for the foundational boundary *or* accepting a degree of constitutive circularity/arbitrariness at the absolute foundation while using principles for subsequent changes.

  **Scorecard of Major Theory Families:**

  | Desideratum          | All-Affected Interests | Subjection-to-Coercion | Historical Association | Territorial / Stakeholder |
  | :------------------- | :--------------------- | :--------------------- | :--------------------- | :------------------------ |
  | **1. Full Subjection**   | **✓ (Strong)**         | **✓ (Strong)**         | ✗ (Likely Excludes)    | **✓ (If Resident)**       |
  | **2. Membership Abroad** | ✗ (Weak Affectedness)  | ✗ (Not Coerced Daily)  | **✓ (Strong)**         | ✗ (Not Resident)          |
  | **3. Incapacity**        | ~ (Includes Interests) | ~ (Subjected)          | ~ (Member?)            | ~ (Subjected/Resident?)   |
  | **4. Transboundary Harm**| **✓ (Strong)**         | ~ (If Coercion Defined Broadly) | ✗ (Not Associated)     | ✗ (Not Territorial)       |
  | **5. Future Generations**| **✓ (Strong)**         | ~ (If Coercion Temporal) | ✗ (Not Existing)       | ✗ (Not Existing)          |
  | **6. Boundary Circle**   | ✗ (Who Affected?)      | ✗ (Coercion Presupposes Boundary)| **~ (Association Decides?)** | ✗ (Territory Contested)   |
  | **7. Market Effects**    | **✗ (Over-Inclusive)** | ✗ (Not Direct Coercion)| ✗ (Not Associated)     | ✗ (Not Stakeholder?)      |
  | **8. M ≠ S**             | ✗ (Often Collapses)    | ✗ (Often Collapses)    | **✓ (Strong)**         | ~ (Can Distinguish)       |
  | **9. Degrees**           | ~ (Scalar Affectedness)| ~ (Scalar Coercion?)   | **✓ (Strong)**         | ~ (Scalar Stake?)         |
  | **10. Inst. Applicability** | **✗ (Weak - Vague/Over-Incl.)** | ~ (Defining Coercion Hard) | **✓ (Strong - Clear Ties)** | **✓ (Strong - Clear Criteria)** |
  | **11. Avoid Circularity**| ✗ (Foundational Problem) | ✗ (Foundational Problem)| **~ (Constitutive)**   | **~ (Constitutive)**      |
  | **12. Principle-Based**  | **✓ (Strong)**         | **✓ (Strong)**         | ✗ (Often Descriptive)  | ~ (Mix)                   |

  **Key:** **✓** = Generally Strong, ~ = Mixed/Qualified, **✗** = Generally Weak

  **Most Exclusionary Requirement: Institutional Applicability (10).**
  *   **Reason:** This demands *practical, non-circular criteria* usable by real institutions. Many otherwise normatively appealing theories (especially All-Affected and Subjection) fail here due to vagueness ("significantly affected"? "coercion"?), over-inclusiveness, or requiring information/knowledge institutions lack. It forces the theory to provide *actionable*, relatively objective criteria for bounded bodies to apply, which is a high bar that filters out many approaches unable to bridge abstract principle and concrete application without presupposing the demos. This requirement most sharply exposes the gap between ideal theory and the practical task of boundary-setting faced by bodies like your charter commission or river-basin authority.
