  For the desiderata, I'll categorize them into cases, distinctions, constraints, and joint feasibility. Each point needs a clear label (requirement vs. preference) and a brief rationale. The cases they mentioned should each have a corresponding desideratum. For example, the long-term resident case translates to a requirement for "Full Subjection Without Voice." The expatriate case becomes "Formal Membership Without Residence." 

