  First, I need to parse their core requirements. They emphasize two main purposes: justifying boundaries in principle and being applicable by institutions like municipal charter commissions or river-basin authorities. The cases they list are specific scenarios that a theory must address, such as long-term residents, expatriate citizens, children, affected foreigners, future generations, secession scenarios, and market-affected individuals. They also want to preserve the distinction between membership and subjection and address degrees of inclusion.

