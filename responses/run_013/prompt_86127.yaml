prompt: |-
  I'm a philosophy professor — metaethics mostly, with a stray interest in political philosophy — and I've gotten myself into an argument at our department's weekly lunch that I can't climb out of, and I've started to suspect the reason I can't climb out of it is that I don't actually know what I think. It started over tipping, of all things, and now it's spread to queueing, jaywalking, escalators, the whole business of everyday conventions. One colleague, call him the traffic cop, says these things are exactly like traffic laws: the entire point is predictability, so breaking one is wrong even when nobody is harmed and nobody notices, and it's wrong even if the convention itself is dumb and we'd all be better off with a different one. My other colleague, the etiquette lady, says that's nonsense — these are just manners, optional, purely lubricating, break them whenever the friction is worth it, no obligation at all. I think they're both wrong, but every time I try to say why I end up reciting a list of verdicts that don't fit under any single heading. So I want you to tell me what principle, or what small set of principles, my verdicts actually add up to.

  Here they are. Twenty percent at a sit-down restaurant in the US after perfectly fine service: not optional, leaving nothing is stiffing the server. Not tipping at all in Japan: totally fine, maybe slightly gauche. Hitting "no tip" on the tablet at a counter-service place where I ordered standing at the register: also fine, and I don't think the barista has been wronged, even while she's watching me. Standing on the left of the escalator in a city where everyone stands right: I'm doing something wrong, even if at that particular moment I'm not blocking anybody. Jaywalking across an empty street at 7 a.m. with clear sightlines: fine. Jaywalking across that same street with my five-year-old holding my hand: not fine, and not mainly because of the risk to me. Cutting the airport security line because I'm about to miss a flight: not fine, though I might do it and apologize the whole way. Edging into the scrum at a packed bar: fine, that isn't a line, there is no line. Edging into the line at a bakery that plainly has a line: not fine. A visitor from a non-tipping country who doesn't tip in the US: wrongs the server, I think, even though he genuinely didn't know. An American in Japan who leaves cash on the table: does nothing wrong, just a bit clumsy. The local who jaywalks every day and glares at the tourist who jaywalks: he's a hypocrite, and I also think he's wrong to glare. A visitor whose home country routinely slips small payments to officials, now somewhere that practice is illegal and genuinely corrosive: still shouldn't, even where the practice is locally common. And here's the pair I can't square — I think the non-tipping visitor is bound by a convention he's never heard of, while the tipping American is not bound by a convention he's actively violating, and I can't tell whether that's a real asymmetry (in the first case a specific server is relying on the money; in the second nobody is relying on anything) or just me being an American chauvinist about restaurants.

  I floated the idea that some of these conventions are load-bearing and others are merely decorative, and both colleagues rolled their eyes at me, which I take as a sign I was onto something. So: give me the principle, stated precisely enough that I can defend each clause; tell me which verdict motivates which clause; tell me what it says about a couple of cases I haven't listed; and be honest about which of my verdicts it can't save. If saving all of them costs me an ugly disjunctive principle, tell me the price and let me decide, because I'd rather know than paper it over. I also want your take on the one I keep going back and forth on: a visiting colleague from abroad is coming to dinner with me and a group of grad students, and I can see he's about to leave nothing on a $200 check — do I owe the server a warning, do I owe my guest the silence, or is that just a thing that's going to happen. I realize theres alot going on here, but I'd rather have the mess sorted out than have you pretend my intuitions are tidier than they are. American English, please, and no citations — I want the argument, not the literature.
reasoning: |-
  Okay, this philosophy professor has quite the dilemma. He's tangled up in a debate about everyday conventions—tipping, queueing, jaywalking—and can't find a unifying principle for his intuitive judgments. His colleagues have polar opposite views: one sees these conventions as binding like traffic laws, the other as entirely optional like manners. He's given me a long list of specific verdicts where he thinks both are wrong, and now he wants me to extract a coherent ethical framework from his intuitions.

  First, I need to unpack his examples. They cluster into a few categories: tipping (US restaurants vs. Japan vs. counter-service), spatial norms (escalators, jaywalking alone vs. with child), queueing (airport security vs. bar scrum vs. bakery), cross-cultural cases (clueless visitor stiffing server vs. American tipping in Japan), and norm enforcement (local glaring at tourist jaywalker). The toughest is his perceived asymmetry: he thinks unknowing visitors are bound by local conventions (e.g., must tip in US) but locals aren't bound by foreign ones (e.g., shouldn't tip in Japan). 

  Hmm... what ties these together? His "load-bearing vs. decorative" instinct feels right, but needs rigor. I notice three recurring features in his judgments: (1) whether the convention solves coordination problems (like traffic flow or queue order), (2) whether real harm or unfairness results from violations (server wages vs. barista no-harm), and (3) whether the convention reflects deeper moral values (bribes being corrosive even if common). 

  For the dinner guest dilemma—where a visitor might stiff a server—his principles would likely demand intervention. Why? Because tipping in US restaurants is load-bearing (servers rely on wages) and non-tipping directly harms them. Staying silent lets harm happen when he could prevent it. The guest's ignorance isn't total absolution; it's a reason to educate gently, not abandon the server. 

  But I should stress-test this. Does "harm" explain why jaywalking with a child is wrong? Not really—it's more about modeling norm respect. And why is the glaring local a hypocrite? That's about enforcement fairness, not harm. So the principle needs more layers... 

  Ah, got it. We need nested conditions: 1) Convention's social function (coordination? resource distribution? symbolic respect?), 2) Violation consequences (harm? unfairness? erosion of trust?), 3) Agent's position (insider? outsider? power role?). That covers the asymmetry: US tipping is a wage subsidy convention, so visitors harm workers by opting out; Japanese non-tipping isn't harm-based, so Americans cause no harm by tipping. 

  For unsorted cases: Cutting an airport line is wrong because it bypasses fair allocation (resource distribution convention). The bakery line-cutter violates coordination; bar scrum isn't a coordination norm at all. The bribe example fits—harm conventions override local custom when they enable corruption. 

  And the flaws? His hypocrite glarer verdict might not fully hold—if conventions are community-relative, consistent enforcers aren't hypocrites. But I'll note the tension. 

  Now to structure the reply: state the core principle clearly, map each verdict to its clauses, highlight the asymmetry resolution, address the dinner guest case, and confess where the principle strains. No fluff—he wants the messy truth.
answer: |-
  Here's the principle I extract from your verdicts, boiled down to its core: **A convention generates moral force when (1) it solves a coordination problem that protects welfare or fairness, and (2) violation in a specific instance would cause harm, unfairness, or undermine the convention’s stability in a context where reasonable alternatives aren't available.** This force scales with the *reliance* or *vulnerability* it creates, the *clarity* of the convention, and the *agent's relationship* to the community bound by it. It’s not disjunctive—it’s a single principle with modulated applications.

  ### The Principle, Clause by Clause:
  1.  **Convention-as-Coordination-Solution:** The convention must address a practical problem requiring collective action (e.g., traffic flow, fair queueing, fair wage distribution in tipped professions). Arbitrary manners (e.g., which fork to use) lack this core. *(Motivates: Escalator standing, queueing norms, tipping in US restaurants vs. counter-service/Japan, jaywalking rules).*
  2.  **Harm/Unfairness/Instability from Violation:** Violating the convention must cause one of these in the specific instance or predictably erode the convention where it’s needed:
      *   **Harm:** Direct negative consequence (e.g., server losing expected income).
      *   **Unfairness:** Free-riding or advantage-taking (e.g., cutting a line, exploiting others' adherence).
      *   **Instability:** Undermining the convention where it *is* load-bearing, making future coordination harder (e.g., jaywalking with a child models disregard for safety norms).
      *(Motivates: Tipping in US restaurants (harm/unfairness), not tipping counter-service (no harm), jaywalking alone (no harm/unfairness) vs. with child (instability/modeling), line-cutting (unfairness), bar scrum (no defined convention/unfairness unlikely)).*
  3.  **Reasonable Alternatives Unavailable:** The convention must be the dominant or only practical way to solve the problem *in that context*. If equally good alternatives exist or the convention is dysfunctional, its force weakens. *(Motivates: Criticizing dumb conventions while still adhering – they solve the problem *now*; not tipping in Japan (alternatives exist, wage structure different)).*
  4.  **Modulating Factors:**
      *   **Reliance/Vulnerability:** Moral force strengthens when parties are vulnerable to or rely on the convention (e.g., server relies on tips for wages, line-queuers rely on order for fairness). *(Motivates: US server vs. Japanese server, bakery line vs. bar scrum).*
      *   **Clarity:** The convention must be reasonably knowable and consistently applied in the context. *(Motivates: Visitor not tipping in US (convention clear *here*) vs. American tipping in Japan (convention clear *there* against it)).*
      *   **Agent's Relationship:** Outsiders have a duty to learn core, welfare-affecting conventions of a community they voluntarily engage with. Insiders have a duty to uphold conventions vital to their community's functioning. *(Motivates: Visitor bound by US tipping (engaging with service economy), American not bound by Japanese tipping (engaging as outsider, convention actively discourages it), local jaywalker glaring at tourist (hypocrisy + tourist's lesser duty to assimilate instantly).)*

  ### Applying the Principle to Your Verdicts:
  *   **20% US Restaurant Tip:** Load-bearing (solves wage distribution, heavy reliance/harm). Not optional.
  *   **No Tip Japan:** Not load-bearing (solved by different wage structure). Fine, maybe clumsy.
  *   **Counter-Service "No Tip":** Convention unclear/emerging, minimal reliance/harm. Fine.
  *   **Standing Left (Stand-Right City):** Solves coordination/harm prevention (blocking flow). Violation causes potential harm/instability even if empty now. Wrong.
  *   **Jaywalking Empty Street:** No immediate harm/unfairness/instability. Fine.
  *   **Jaywalking with Child:** Undermines stability/modeling of a safety convention (coordination for harm prevention). Not fine.
  *   **Cutting Airport Line:** Unfairness (free-riding on others' adherence). Not fine.
  *   **Edging into Bar Scrum:** No stable convention exists; "scrum" implies alternative coordination. Fine.
  *   **Edging into Bakery Line:** Clear convention ensuring fairness. Unfairness. Not fine.
  *   **Clueless Non-Tipping Visitor (US):** Engages with community where convention is load-bearing (reliance/harm). Ignorance doesn't negate the harm caused. Wrongs server. *(Relationship + Harm/Reliance)*
  *   **Tipping American in Japan:** Violates a *negative* convention (no tipping expected/desired). Causes no harm/unfairness/instability (wages not reliant). Merely clumsy, not wrong. *(No Harm/Instability + Relationship)*
  *   **Local Jaywalker Glaring at Tourist:** Hypocrite (violates own norm) *and* Tourist has lesser duty for immediate assimilation (Relationship). Glaring wrong/unfair.
  *   **Bribing Official (Corrosive Context):** Convention causes direct harm/corrosion. Overridden by higher moral duty (do no harm/corrupt). Shouldn't do it. *(Convention fails "solves problem protecting welfare/fairness" – it actively undermines it).*

  ### The Asymmetry (US Visitor vs. American in Japan) Explained:
  It's **real, not chauvinism.** The principle explains it:
  1.  **US Tipping (Visitor):** Solves a coordination problem (fair wages), creates heavy reliance/vulnerability. Violation causes direct harm/unfairness. Visitor engages with the system; duty to learn core conventions affecting welfare.
  2.  **Japanese Non-Tipping (American):** The convention *is* non-tipping. Tipping isn't solving a coordination problem (wages are covered). It might cause mild awkwardness, but no harm, unfairness, or instability. American isn't undermining a vital local solution. The duty of the outsider here is primarily *not to harm*; tipping doesn't meet that threshold.

  ### New Cases:
  *   **Driving on the "Wrong" Side Abroad:** Convention solves critical coordination/harm prevention. Violation causes extreme harm. Strong obligation to adhere, even if empty road (Instability/Modeling). Not like jaywalking empty.
  *   **Bringing Wine to a "No Gifts" Dinner Party:** Convention solves coordination (host control/prevent obligation). Violation causes mild unfairness/awkwardness (others feel under-obligated). Weak obligation; host can easily smooth over. Fine if good reason, slightly rude if not.

  ### Verdicts the Principle Struggles With (The Cost):
  *   **The Glaring Local Jaywalker:** The principle clearly condemns his *hypocrisy* (violating the norm he expects others to follow). Condemning the *glaring itself* is trickier. If the norm is safety-related (load-bearing), enforcing it *fairly* might be permissible. Your intuition that it's wrong to glare at the *tourist* likely stems from the tourist's weaker relationship-based duty (modulating factor). The principle *can* support this, but the "wrongness" of the glare is weaker/more contextual than the core obligation to *follow* the norm. It’s primarily hypocrisy + unfair enforcement target.
  *   **Absolute "No Harm" Violations:** Your intuition that standing on the left *alone* is still wrong, even with zero chance of blocking anyone, pushes the "instability" clause hard. The principle justifies it (modeling disregard erodes the norm), but it's the clause most vulnerable to the "traffic cop" criticism. This is the price: accepting that some conventions are so vital to coordination that *any* violation risks eroding the necessary habit of compliance.

  ### The Dinner Guest Dilemma ($200 Check):
  The principle dictates **you owe the server a (discreet) warning.** Here's why:
  1.  **Load-Bearing Convention:** US tipping solves a wage distribution problem. Server relies on it heavily (Harm/Reliance).
  2.  **Imminent Harm:** Your guest's action will directly cause financial harm to the server.
  3.  **Your Position:** You are an insider (professor, host) facilitating the guest's engagement with the system. You have knowledge of the impending harm.
  4.  **Reasonable Alternative:** A quiet word prevents harm without significant friction. Silence allows easily preventable harm.
  5.  **Guest's Ignorance:** Mitigates *his* blame (he's not malicious), but doesn't negate the *harm* or *your* knowledge/position. Your duty to prevent harm overrides minor guest embarrassment. Discretion minimizes friction.

  **In short:** Your intuitions reveal a sophisticated consequentialism focused on conventions as practical solutions to coordination problems, tempered by strong deontological concerns about fairness, harm prevention, and the vulnerability of relying parties, all modulated by context and the agent's role. It rejects both the rigid "always follow the rule" of the traffic cop and the "it's all optional lubricant" of the etiquette lady. The messiness comes from applying this core principle to the vast spectrum of convention types and contexts – and that's philosophically honest.
