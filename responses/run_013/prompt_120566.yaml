prompt: |-
  I am a doctoral candidate in history, and I need help taking apart a move I keep meeting in my field. At a workshop last month I argued that the thinness of the surviving record for a population I study — the labor and household arrangements of enslaved people on a particular set of plantations, if you want the concrete case — is not merely a gap but itself a kind of datum: the institutions that generated and preserved documents had little reason to record those arrangements, and that fact about how records are produced is informative in its own right. A senior colleague ended the exchange with "absence of evidence is not evidence of absence," and the room treated it as decisive. I do not think it is decisive, and I suspect that the sentence is being made to carry several different claims at once, at least one of which is simply false, but I cannot sort them out on my feet.

  What I want from you is a disambiguation rather than a defense of any single reading. Treat the sentence as a piece of language whose content is genuinely up for grabs, and lay out the distinct precise claims it could be making, ordered from the nearly trivial to the radical. For each, give the claim in its own terms, say what would have to be true for it to hold, and enter a verdict: a platitude no one denies, a substantive thesis that is defensible, a claim that is false as stated, or a formulation too vague to assess at all. I am especially interested in the readings that turn on (a) what evidence is and how an absence bears on it, (b) how the conditions under which records are made and kept bear on what their silences mean, and (c) whether the past can contain facts that leave no trace of the kind we could have. Then tell me which readings, if any, would actually license my colleague's dismissal of my inference, and which one he most likely had in mind.

  Please organize the response under the following headings, in this order, at roughly these lengths:

  - "The job the slogan was doing": about 100 words, restating the argument I was making and exactly what the slogan was invoked to block.
  - "The menu": the bulk of the response, about 700–900 words, set out as a numbered list of readings, each with a short name, the precise claim it advances, and a verdict.
  - "What would license the dismissal": about 200 words, on which readings would actually do the work my colleague wanted and whether any of them is true.
  - "Confidence and the softest point": about 150 words, stating how confident you are in the overall verdict and in each part of the menu, and singling out the single point you are least sure of.

  Write in American English.
