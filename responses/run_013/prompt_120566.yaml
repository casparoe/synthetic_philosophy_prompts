  For the menu, I'll structure readings by philosophical weight. Starting with the trivial statistical independence argument (Reading 1), then Bayesian interpretations (2-3), moving to methodological (4) and epistemological claims (5-7). The strongest versions involve archival positivism (8) or radical skepticism (9). Each needs clear criteria: what would make it true/false, and verdicts like "defensible" or "false."

