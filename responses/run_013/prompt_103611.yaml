  ### Desiderata for Updating on Conditional Information

  The following desiderata are motivated by considerations of rationality, coherence, and the need to handle conditional information appropriately. Each requirement addresses specific challenges, such as the Judy Benjamin problem, and ensures that updating rules are well-behaved across diverse scenarios.

  1. **Conditional Credence Update (Judy Benjamin Core)**  
     - *Requirement*: Upon learning a conditional of the form "If $A$, then credence in $B$ should be $p$," the agent's new conditional credence $C_{\text{new}}(B \mid A)$ must equal $p$.  
     - *Motivation*: This is the direct constraint imposed by the learned conditional. In the Judy Benjamin problem, learning that the chance of the second sub-region given red is $1/4$ must set $C_{\text{new}}(\text{sub-region} \mid \text{red}) = 1/4$. Failing this would ignore the informational content of the update.

  2. **Certainty in the Conditional**  
     - *Requirement*: If the agent learns the conditional with certainty (i.e., $C_{\text{new}}(\text{conditional}) = 1$), the update must reflect this certainty and yield $C_{\text{new}}(B \mid A) = p$.  
     - *Motivation*: Learning a conditional with certainty is a special case where the agent fully endorses the constraint. It tests if the rule handles maximal confidence correctly, avoiding distortions (e.g., if the conditional were treated as a material implication).

  3. **Learning the Antecedent**  
     - *Requirement*: If, after updating on the conditional, the agent learns $A$ (the antecedent), then $C_{\text{new}}(B \mid A)$ must equal $p$, and $C_{\text{new}}(B)$ must become $p$.  
     - *Motivation*: Conditional probability is the guide to belief upon learning the antecedent. This ensures coherence: if $A$ is true, the credence in $B$ should align with the updated conditional credence (as in standard conditionalization).

  4. **Learning the Antecedent is False**  
     - *Requirement*: If, after updating on the conditional, the agent learns $\neg A$, the conditional information becomes irrelevant, and the agent's credences conditional on $\neg A$ should revert to the prior conditional credences given $\neg A$.  
     - *Motivation*: The conditional only constrains cases where $A$ holds. If $A$ is false, the update should not affect beliefs under $\neg A$, preserving the agent's original knowledge about those scenarios.

  5. **Distinction: Accepting Conditional vs. Assigning Conditional Probability**  
     - *Requirement*: Updating on a conditional (e.g., setting $C(B \mid A) = p$) must be distinguished from updating by learning a proposition (e.g., learning the truth of a material conditional $A \supset B$).  
     - *Motivation*: These are conceptually distinct operations. Learning a proposition revises beliefs globally, while learning a conditional only constrains a local conditional credence. Collapsing them leads to incorrect updates (e.g., in Judy Benjamin, learning "if red then chance of sub-region is $1/4$" is not equivalent to learning a proposition about regions).

  6. **Distinction: Revising Conditional vs. Unconditional Credences**  
     - *Requirement*: Revising a conditional credence (e.g., $C(B \mid A)$) must not force a unique revision of unconditional credences (e.g., $C(A)$ or $C(B)$), and vice versa.  
     - *Motivation*: Conditional and unconditional credences are logically independent in general. Judy Benjamin illustrates this: the conditional constraint $C(\text{sub-region} \mid \text{red}) = 1/4$ underdetermines $C(\text{red})$ or $C(\text{sub-region})$, so the rule should allow flexibility.

  7. **Invariance under Equivalent Partitions**  
     - *Requirement*: The update must not depend on how the partition is described. Equivalent repartitionings (e.g., coarse-graining or refining) must yield the same updated credences.  
     - *Motivation*: Rationality requires that beliefs depend on the underlying state space, not on arbitrary labels. Violations introduce inconsistency (e.g., Judy Benjamin's regions should give the same result whether described as "red/blue" or "R1/R2/B1/B2").

  8. **Agreement with Ordinary Conditionalization in Limiting Cases**  
     - *Requirement*: When the conditional update reduces to learning a proposition (e.g., if $A$ is already known true, or if the conditional is degenerate), the rule must agree with Bayesian conditionalization.  
     - *Motivation*: To ensure generality, the rule must subsume standard updating as a special case. For example, if $A$ is learned after the conditional update, requirement 3 must hold, and if $A$ is certain beforehand, $C_{\text{new}}(B) = p$.

  9. **Conservativeness (Minimal Change)**  
     - *Requirement*: The update must minimize overall change in the credence function, as measured by a well-defined metric (e.g., Kullback-Leibler divergence), subject to the new constraint.  
     - *Motivation*: Rational updates should preserve as much prior information as possible. This prevents gratuitous belief revisions and aligns with principles of informational economy (e.g., in Judy Benjamin, the shift should be "minimal" given $C_{\text{new}}(B \mid A) = 1/4$).

  ### Conflict Among Desiderata

  The subset of requirements that **cannot be jointly satisfied** is:  
  - **Conditional Credence Update** (1),  
  - **Unconditional Antecedent Irrelevance** (a consequence of 6, but explicitly: *learning the conditional should not alter $C(A)$*),  
  - **Conservativeness** (9) with Kullback-Leibler (KL) divergence as the measure,  
  - **Invariance under Equivalent Partitions** (7).  

  #### Why They Conflict  
  - **Core Issue**: In the Judy Benjamin problem, requirements 1 and 6 imply that $C(\text{red})$ (the antecedent) should remain unchanged ($C_{\text{new}}(\text{red}) = C_{\text{prior}}(\text{red}) = 1/2$) because the conditional information pertains only to the red region and says nothing about the probability of being in red. However, the KL-based conservative update (requirement 9) necessarily changes $C(\text{red})$ to satisfy the conditional constraint while minimizing global change. Specifically:  
    - The prior is uniform over four regions: $C_{\text{prior}}(\text{R1}) = C_{\text{prior}}(\text{R2}) = C_{\text{prior}}(\text{B1}) = C_{\text{prior}}(\text{B2}) = 1/4$.  
    - After learning $C_{\text{new}}(\text{R2} \mid \text{red}) = 1/4$, KL minimization (via the I-Projection rule) yields $C_{\text{new}}(\text{R1}) = 0.3$, $C_{\text{new}}(\text{R2}) = 0.1$, $C_{\text{new}}(\text{B1}) = 0.3$, $C_{\text{new}}(\text{B2}) = 0.3$. Thus, $C_{\text{new}}(\text{red}) = 0.4 \neq 0.5$.  
    - This violates **Unconditional Antecedent Irrelevance** (and requirement 6, as it forces a change in $C(\text{red})$).  
  - **Role of Invariance**: If we repartition the space (e.g., combine B1 and B2 into a single "blue" state), the KL update changes $C(\text{blue})$ proportionally, preserving invariance. The conflict persists because the minimal change requires adjusting $C(A)$, even though the information is irrelevant to $A$.  
  - **Contradiction with Conservativeness**: To leave $C(\text{red}) = 1/2$ while setting $C_{\text{new}}(\text{R2} \mid \text{red}) = 1/4$, we must have $C_{\text{new}}(\text{R1}) = 3/8$, $C_{\text{new}}(\text{R2}) = 1/8$, $C_{\text{new}}(\text{B1}) = 1/4$, $C_{\text{new}}(\text{B2}) = 1/4$. This has a higher KL divergence (≈0.065) than the KL-optimal solution (≈0.072), violating **Conservativeness**.  
  - **No Compromise**: Requirement 1 forces $C_{\text{new}}(B \mid A) = p$. Requirement 6 (and irrelevance) forbid changes to $C(A)$. Conservativeness (KL) requires changing $C(A)$ to minimize global divergence. Invariance ensures the problem is partition-agnostic, but KL’s partition dependence is not the issue—the irrelevance vs. minimal change conflict is intrinsic.  

  #### Implication for the Judy Benjamin Problem  
  This conflict implies that **there is no single rationally required solution** to the Judy Benjamin problem. Rational agents may justifiably adopt different updating rules depending on which desiderata they prioritize:  
  - An agent emphasizing **Conservativeness** (KL) will change $C(\text{red})$ to minimize global information loss.  
  - An agent emphasizing **Unconditional Antecedent Irrelevance** will keep $C(\text{red})$ fixed, accepting a larger shift in other credences.  
  Both approaches satisfy core rationality constraints (e.g., conditional credence update, limiting cases), but neither satisfies all desiderata simultaneously. Thus, the problem is **underdetermined by rationality alone**, and contextual factors (e.g., the agent's epistemic goals) may guide the choice. This underscores a limitation in Bayesian epistemology: updating on conditionals cannot always yield unique rational credences without additional principles.
