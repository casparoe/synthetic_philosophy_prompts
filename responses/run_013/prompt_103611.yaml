  We are discussing the problem of updating credences when learning a conditional, as in the Judy Benjamin problem. We need to list desiderata for an adequate account, motivate them, and then identify which subset of these requirements cannot be jointly satisfied and why.

  ### Desiderata for Updating on Conditional Information

  1. **Conditional Credence Update (Judy Benjamin Core)**: 
     - *Requirement*: When an agent learns a conditional statement of the form "given A, the probability of B is p" (without learning whether A is true or false), then the agent's new conditional credence in B given A should become p.
     - *Motivation*: This is the central lesson of the conditional information. In the Judy Benjamin case, learning that conditional on red the chance of the second sub-region is 1/4 should set the conditional credence in that sub-region given red to 1/4.

  2. **Certainty in the Conditional**:
     - *Requirement*: If the agent learns the conditional with certainty (i.e., becomes sure that the conditional statement is true), then the update should reflect that certainty appropriately.
     - *Motivation*: This is a special case of learning a conditional and should be handled without paradox. It should also reduce to the standard update when the conditional is a material conditional and the antecedent is true (via modus ponens) or false (via antecedent falsity).

  3. **Learning the Antecedent**:
     - *Requirement*: If after updating on the conditional, the agent then learns that the antecedent (A) is true, the resulting credence in B should be the updated conditional credence of B given A (i.e., p).
     - *Motivation*: This is a basic requirement of coherence: conditional probability is the guide to what one's credence in B should be upon learning A.

  4. **Learning the Antecedent is False**:
     - *Requirement*: If after updating on the conditional, the agent learns that the antecedent (A) is false, then the conditional information should become irrelevant and the agent should revert to her prior credences conditional on not-A (or appropriately update only on not-A).
     - *Motivation*: The conditional only constrains the case when A is true. When A is false, the conditional does not provide information about the world.

  5. **Distinction between Accepting a Conditional and Assigning Conditional Probability**:
     - *Requirement*: The update rule should distinguish between coming to believe the conditional statement as true (which might be represented as a proposition) and simply setting the conditional probability to a value without necessarily believing the conditional as a proposition.
     - *Motivation*: The Judy Benjamin problem illustrates that we are updating by setting a conditional probability, not by learning a proposition that might be true or false. The two are conceptually different and may lead to different updates.

  6. **Distinction between Revising Conditional and Unconditional Credences**:
     - *Requirement*: The update should not force a particular change in the unconditional credences when only a conditional credence is specified. There might be multiple ways to adjust the unconditional credences to satisfy the new conditional constraint.
     - *Motivation*: This is the core of the Judy Benjamin problem: the conditional information does not pin down the unconditional credences. The update rule should respect that the conditional credence is the direct constraint and allow flexibility elsewhere.

  7. **Invariance under Equivalent Descriptions of the Partition**:
     - *Requirement*: The update should not depend on how the partitions are described. Equivalent repartitions should lead to the same updated credences.
     - *Motivation*: Rationality requires that the update depends only on the underlying possibilities, not on how they are labeled.

  8. **Agreement with Ordinary Conditionalization in Limiting Cases**:
     - *Requirement*: In the case where the conditional information effectively reduces to learning a proposition (for example, when the antecedent is known to be true), the update should reduce to ordinary Bayesian conditionalization.
     - *Motivation*: This ensures that the new rule is a generalization of the standard rule and avoids inconsistency.

  9. **Conservativeness or Minimal Change**:
     - *Requirement*: The update should change the credence function as little as possible while satisfying the new constraint.
     - *Motivation*: This is a standard principle in belief revision: we want to minimize the disruption to our prior beliefs while incorporating new information.

  ### The Incompatibility

  The key challenge is that some of these requirements cannot be jointly satisfied. Specifically, the requirements that seem to conflict are:

  - **Conditional Credence Update** (requirement 1) and **Agreement with Ordinary Conditionalization** (requirement 8) in the case where the antecedent is learned after the conditional update, and the **Minimal Change** (requirement 9) and **Distinction between Revising Conditional and Unconditional Credences** (requirement 6).

  However, the most critical incompatibility arises in the Judy Benjamin problem when we try to satisfy both the conditional update and the minimal change principle while also respecting the partition invariance.

  The central issue is that the Judy Benjamin problem has multiple candidate rules (like the one proposed by van Fraassen, or the Kullback-Leibler divergence minimization) that satisfy some but not all of the desiderata. In particular, the requirement of **Invariance under Equivalent Descriptions** and the **Minimal Change** principle (when defined by a particular divergence) may conflict with the **Conditional Credence Update** and the way we handle the **Learning the Antecedent** case.

  But the most discussed conflict is between:

  - **Conditional Credence Update**: We must set P(B|A) = p.
  - **Minimal Change**: We want to minimize the change from the prior to the posterior.

  However, without further specification, minimal change can be interpreted in different ways (e.g., minimizing the change in the joint distribution, or in the conditional distributions, or by using a particular metric). The problem is that the Judy Benjamin problem does not specify how to change the unconditional credences, and minimal change under one metric might lead to different results than under another.

  Moreover, the requirement of **Distinction between Revising Conditional and Unconditional Credences** (requirement 6) suggests that there may be multiple rational ways to update, but then we lose the **Minimal Change** principle as a unique selector.

