  - First philosopher: This proposal is a genuine third option that we can accept as a way to implement our structural constraint, but it is not identical to our view because we focus on the rule of choice. We predict it forbids U and allows V.
  - Second philosopher: This proposal is essentially our view, so it is our own view in disguise. We predict it forbids U and allows V.

  Section 5: Verbal disagreement and evidence
  - Verbal disagreement: The parties agree that there is a verbal element in the use of the word "rational". The first philosopher uses "rational" to refer to a decision rule that is not exploitable and that incorporates structural constraints. The second philosopher uses "rational" to refer to the application of expected utility maximization to well-defined inputs. Thus, the dispute is partly about what it means for a decision to be rational in the face of extreme uncertainty.

  - Evidence that would move each side:
    - First philosopher: Would be moved by evidence that in cases without a verifiable mechanism, even with a well-defined probability (if that were possible), the decision rule still leads to absurdity. Or, if it were shown that a constraint on credence alone cannot handle a case that a constraint on the rule can.
    - Second philosopher: Would be moved by evidence that a constraint on credence is insufficient, for example, if there were a case with a well-defined probability and a verifiable mechanism that still leads to an unacceptable mugging. Or, if it were shown that a constraint on the rule can be derived from more fundamental principles without invoking credence.

