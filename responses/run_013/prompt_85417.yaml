answer: |-
  ### Joint Statement on Pascal's Mugging

  #### 1. Common Ground  
  We agree on the following:  
  1.1. **Structure of the mugging**: The scenario involves a stranger offering to avert an outcome of enormous disutility (e.g., 10¹⁸ person-years of severe pain) with a vanishingly small probability (e.g., 10⁻¹²) in exchange for a trivial payment (e.g., $1). The expected utility calculation, if taken literally, implies the payment is rational, yet this conclusion seems intuitively unacceptable. The mugging exploits the multiplicative interaction of unbounded utility and arbitrarily small probability.  
  1.2. **Inadequacy of standard dismissal**: Rejecting the mugger’s offer solely because the probability is "too small" is inadequate. Such a dismissal would also forbid legitimate, low-cost precautions against unlikely catastrophes (e.g., investing $1 in a verified safety device with a 10⁻¹² chance of averting 10¹⁸ person-years of suffering). Any repair must permit these justified precautions.  
  1.3. **Dead-end responses**:  
  - (a) Imposing a fixed cap on disutility (e.g., ignoring outcomes above a threshold) fails, as it would neglect genuine existential risks.  
  - (b) Ad hoc probability thresholds (e.g., ignoring all probabilities below 10⁻⁹) fail, as they would also reject verified, high-impact precautions.  
  - (c) Appealing to "pragmatic neglect" (e.g., ignoring outcomes beyond computational limits) fails without a principled link to rationality.  
  Both sides reject these as unprincipled or overbroad.  

  #### 2. Disagreements  
  Each position’s view is stated in its own accepted wording:  
  - **Position A (Defect in decision rule)**:  
    "Unrestricted expected-utility maximization is defective: it licenses exploitation by agents making unverifiable claims about extreme outcomes. The repair requires a structural constraint on choice, excluding actions driven solely by outcomes where the probability is too small relative to the claim’s epistemic grounding. This constraint must bind regardless of the credences assigned."  
  - **Position B (Defect in input)**:  
    "Expected-utility maximization is sound. The defect lies in assigning determinate credences to unverifiable claims. The mugger’s offer lacks a well-defined probability; it is not a genuine option for rational choice. The repair requires constraining credences, not choice: we must reject ill-defined inputs before applying the rule."  

  #### 3. Cruxes  
  Both parties predict outcomes for the following cases:  

  **Crux 1: Location of defect (tested by U vs. V)**  
  - **Case U**: Stranger (no track record, no describable mechanism) offers to avert 10¹⁸ person-years of pain with probability 10⁻¹² for $1.  
  - **Case V**: Verified device (published mechanism, independently checked) has a 10⁻¹² chance of averting 10¹⁸ person-years for $1.  
  Both have identical expected utility per dollar.  
  - **Question**: Does a constraint licensing V but forbidding U earn its keep? Is it a constraint on choice or credence?  
  - **Position A (Rule)**: Predicts U is forbidden by a choice-constraint requiring epistemic anchoring (e.g., mechanism-based verification); V is allowed. This earns its keep by blocking exploitation while permitting verified precautions.  
  - **Position B (Input)**: Predicts U is forbidden because no determinate credence exists; V is allowed because credences are well-defined. The constraint is on credence, not choice.  

  **Crux 2: Escalation and many-muggers**  
  - **Escalation**: Same stranger offers probability 10⁻¹⁰⁰ to avert 10²⁰⁰ person-years for $1.  
  - **Many-muggers**: 10¹⁰⁰ strangers each claim $1 will avert 10²⁰⁰ person-years with probability 10⁻¹⁰⁰; the agent cannot pay all.  
  - **Position A (Rule)**: Predicts both forbidden by a choice-constraint (e.g., no action for probabilities below a resource-relative threshold). Escalation is blocked by design; many-muggers shows the constraint prevents bankruptcy.  
  - **Position B (Input)**: Predicts both forbidden as credences are even less defined. Many-muggers reinforces that no unique probability exists for competing, unverifiable claims.  

  **Crux 3: Target of repair (unbounded utility)**  
  - **Question**: Is unbounded utility the true defect?  
  - **Position A (Rule)**: Predicts bounding utility collapses into Position B’s repair: capping utility requires epistemic grounds similar to constraining credences, but this fails to address U. The core defect is in the rule.  
  - **Position B (Input)**: Predicts Position A’s repair collapses into bounding utility: structural constraints implicitly bound effective utility by excluding extreme stakes without verification. The core defect is upstream.  

  **Crux 4: Constraint on belief vs. action**  
  - **Question**: Must a choice-constraint also bind belief?  
  - **Position A (Rule)**: Predicts no: choice-constraints govern action only (e.g., "ignore unanchored claims in decisions"). Beliefs may remain unconstrained.  
  - **Position B (Input)**: Predicts yes: if a credence is ill-defined, it cannot rationally inform belief or action. Constraining choice without constraining belief is incoherent.  

  #### 4. Third Proposal: Verifiability and Well-Defined Credences  
  **Proposal**: Before acting on expected value, the agent must (i) specify a procedure to confirm/disconfirm the outcome, and (ii) derive credences from a well-defined distribution.  
  - **Position A (Rule)**: This is a fudge: it smuggles a choice-constraint (verifiability) into credences, but its test (e.g., forbidding U, allowing V) aligns with our rule-based repair. It is not our view, as we prioritize structural choice-rules over credence-formation.  
  - **Position B (Input)**: This is our view in disguise: it formalizes our input-constraint by demanding verifiability and well-definedness. We predict it forbids U (no procedure/defined distribution) and allows V (both present).  

  #### 5. Closing: Verbal Disagreement and Evidence  
  - **Verbal disagreement**: The dispute is partly verbal regarding "rationality." Position A defines rationality as robustness against exploitation, requiring constraints on choice. Position B defines it as coherence in maximizing expected utility given well-defined inputs. This masks deeper empirical and normative differences.  
  - **Evidence to move positions**:  
    - **Position A** would be moved by a case where well-defined credences (e.g., a quantum lottery with 10⁻¹⁰⁰ probability of 10²⁰⁰ pain-averted) still mandate unacceptable actions under expected utility, showing a rule-constraint is necessary.  
    - **Position B** would be moved by a case where a rule-constraint forbids a verified precaution (e.g., a novel but well-documented device) due to structural rigidity, showing credences must carry the load.  

  ---  
  **Signed**,  
  [Philosopher A]  
  [Philosopher B]  

  ---  
  **Areas of non-acceptance**:  
  - **Section 2**: Disagreement on whether "determinate probability" (Position B) or "epistemic grounding" (Position A) is primary cannot be resolved; both formulations reflect irreconcilable foundations.  
  - **Section 3**: Predictions for escalation rely on undisputed intuitions, but the "resource-relative threshold" (Position A) lacks a formulation both accept as non-arbitrary.  
  - **Section 4**: The third proposal’s "well-defined distribution" is contested: Position A argues distributions can be well-defined but still exploitative (e.g., a stranger’s mathematically precise but unverifiable claim), making it a fudge.  
  - **Section 5**: Both deny the dispute is purely verbal, as it involves empirical predictions (e.g., responses to U/V) and normative commitments (e.g., the role of belief).
