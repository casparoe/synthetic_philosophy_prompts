  - Question: Must a repair to choice (decision rule) also constrain belief, and not only action?
  - First philosopher (rule constraint): The constraint is on the decision rule and does not necessarily constrain belief. We may still assign a tiny credence to the mugger's claim, but we do not let that credence drive our action. We have a decision rule that ignores such claims unless they meet the structural condition (e.g., verifiable mechanism). So the constraint is on action, not belief.
