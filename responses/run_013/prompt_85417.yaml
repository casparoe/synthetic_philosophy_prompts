  - Structure of the mugging: A stranger offers to avert an enormous amount of suffering (e.g., 10^18 person-years) with a very small probability (e.g., 1 in 10^12) in exchange for a small payment (e.g., $1). The expected utility of paying is positive and large if we take the numbers at face value, but it seems irrational to pay.
  - Any adequate response must not cap small probabilities arbitrarily because that would also forbid cheap precautions against unlikely catastrophes (e.g., buying insurance against a very rare but catastrophic event when the expected value is positive and the cost is low).
  - Proposed responses that are dead ends: 
    (a) Simply dismissing any probability below a fixed threshold (e.g., 10^-6) because that would rule out legitimate precautions in cases like V (the device with a well-understood mechanism).
    (b) Ignoring outcomes with extremely high disutility because that would also ignore genuine catastrophic risks that we should take precautions against.

  Section 2: Disagreements
  We need two versions, each written so that the respective side would accept the wording.

  Version for the first philosopher (defect in decision rule):
  "The defect lies in the rule of choice: unrestricted expected-utility maximization. We must impose a structural constraint on how risks of enormous magnitude may enter a decision. Specifically, we require that an outcome with utility U and probability p can only be considered if p is not too small relative to the computational or epistemic resources of the agent, or if the claim is backed by a mechanism that can be understood and verified. Without such a constraint, the decision rule is vulnerable to exploitation by absurd, unverifiable claims."

  Version for the second philosopher (defect in input/credence):
  "The defect lies upstream, in the credences and descriptions the mugger exploits. There is no determinate probability to maximize over because the mugger's claim is not sufficiently grounded in evidence or a well-defined model. The decision rule is sound, but the input is flawed: we cannot assign a meaningful probability to an event that is described in a way that evades verification or lacks a causal mechanism. The mugging is not a counterexample to expected-utility maximization but to the fantasy that we can always assign precise probabilities to any arbitrary claim."

  Section 3: Cruxes

  Crux 1: Location of defect (tested by U and V)
  - Case U: Stranger with no track record and no describable mechanism offers to avert 10^18 person-years of severe pain with probability 1 in 10^12 for $1.
  - Case V: Documented device (radioactive source and detector, independently verified) that with probability 1 in 10^12 averts 10^18 person-years of severe pain, one attempt costs $1.

  Both cases have the same expected value per dollar. The question: Does any constraint that licenses V and forbids U earn its keep? And is it a constraint on choice (decision rule) or on credence (input)?

  - First philosopher (rule constraint) predicts: Yes, a constraint on choice is necessary. The rule should be modified to require that for extremely high-stakes outcomes, the probability must be backed by a verifiable mechanism. Thus, U is forbidden and V is allowed. This constraint earns its keep by blocking exploitative muggings while allowing legitimate precautions.
  - Second philosopher (credence constraint) predicts: The constraint must be on credence. In U, we cannot assign a determinate probability (it's not well-defined or justified), so we cannot compute an expected value. In V, the probability is well-defined and justified. Therefore, the rule of maximizing expected utility is fine, but it only applies when the inputs are well-defined. Thus, U is forbidden (because no credible input) and V is allowed.

  Crux 2: Escalation and many-muggers
  - Escalation: The same stranger returns with an offer of probability 1 in 10^100 to avert 10^200 person-years for $1.
  - Many-muggers: A crowd of strangers each press a competing claim (each with a different enormous outcome and tiny probability) and the agent cannot satisfy them all.

  - First philosopher (rule constraint): In escalation, the rule constraint already in place would forbid paying because the probability is too small and unverifiable. In the many-muggers case, even if we considered each claim in isolation, the rule would forbid all because they are unverifiable. Moreover, the rule must also account for the fact that paying one mugger does not help against the others, so the expected utility of paying one is not independent of the others. But the primary constraint (on verifiability) already blocks them.
  - Second philosopher (credence constraint): In escalation, the probability 1 in 10^100 is even more unmoored from any possible evidence, so it is not a well-defined credence. We cannot assign it a probability. Similarly, in the many-muggers case, each claim is equally unsupported and thus cannot be assigned a determinate probability. Therefore, the decision rule does not mandate paying any of them.

  Crux 3: Unbounded utility
