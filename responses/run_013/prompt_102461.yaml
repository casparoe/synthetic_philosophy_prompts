prompt: |-
  I serve on the review committee of a small foundation that funds research aimed at reducing suffering in the natural world through biotechnology: engineering animals so that they feel less pain, driving down the populations of parasites that cause lingering disease in their hosts, redesigning food webs so that creatures are not eaten alive. As a committee we are committed to a particular view, which I will state plainly so that you can work with it: what makes suffering bad is the suffering itself and not the loss of some further good, so a technology that removes a form of suffering is good in itself even when it kills, sterilizes, or permanently alters a species, and the misery of wild animals counts for exactly as much as the misery of animals we can see. Our difficulty is operational. We receive three or four proposals a month — a gene drive meant to crash a biting-fly population, a request to breed a line of farmed salmon with a blunted sensitivity to pain, a plan to extinguish a predator painlessly so that its prey stop being torn apart — and we have no consistent way to decide. We meet for ninety minutes once a month, none of us is a biologist, we cannot run trials ourselves, and any award above two hundred thousand dollars has to be signed off by a board that does not share our view. Two internal rules constrain everything we do: the charter forbids funding any intervention whose effects cannot be bounded to a single species, and the board has asked us never to fund anything irreversible.

  Please write the decision procedure our committee can actually run. I want the questions asked in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to the board or to an individual because the question is one of values rather than of fact; a short set of tests we can apply inside the meeting; and an honest marking of which steps are judgment calls dressed up as procedure and of the points where our own starting view, rather than the evidence, is doing the work. The procedure also has to face two problems I do not know how to handle: first, whether a being we engineer to suffer less thereby has less standing, so that reducing a creature's capacity for pain quietly reduces what it is owed; and second, whether removing suffering that already exists is the same kind of act as preventing suffering that has not yet begun.

  Then run the procedure on three proposals. The first is a gene drive to eliminate a parasite that causes a painful, chronic disease in a wild mammal. The second is a request to engineer a farmed salmon line with greatly reduced pain sensitivity. The third, which I suspect the procedure will reject and which I will not enjoy watching it reject, is a proposal to eliminate a predator species painlessly and permanently in order to end the suffering of everything it eats. For each, give the procedure's verdict, show the steps that produced it, and say where the procedure misfires or falls silent and a person has to decide. Please write your answer in American English.
reasoning: |-
  Okay, the user serves on a review committee for a foundation that funds biotech research to reduce suffering in nature. They need a practical decision procedure that fits their constraints: short monthly meetings, no biology expertise, small budget cap, effects bounded to one species, and nothing irreversible. They also have two philosophical dilemmas about moral standing after pain reduction and the ethics of removing existing vs. preventing future suffering.

  First, I need to design a step-by-step procedure that's operational within their limits. The steps must filter proposals quickly but thoroughly, with clear yes/no gates and flags for board referrals or value judgments. Key elements should include: 
  - Frontloading feasibility checks (species-bound limitation, reversibility) 
  - Distinguishing measurable pain reduction from speculative benefits 
  - Handling their internal conflicts via "value checkpoints" where their core view must consciously override objections 
  - Marking which steps are factual vs. disguised judgments 

  For the philosophical dilemmas: 
  1. On reduced moral standing: I'll incorporate their view explicitly - since they believe suffering itself is bad regardless of capacity, the procedure should treat pain reduction as intrinsically good without penalizing modified creatures. 
  2. On existing vs. future suffering: I'll note both count equally per their principles, but require stronger evidence for preventing future suffering since it's hypothetical. 

  Now for the test cases: 

  **Case 1: Gene drive against mammal parasite** 
  - Passes species-bound check (affects only parasite) 
  - Reversibility is the main hurdle - gene drives are famously permanent. But if they have reversal triggers, it might squeak by. 
  - Strong evidence linking parasite to chronic pain. 
  - Verdict: Pass with board approval for irreversibility. 

  **Case 2: Low-pain salmon** 
  - Easily bounded (farmed setting), reversible (can stop breeding them) 
  - Pain reduction measurable via nociception tests 
  - But hits the "moral standing" dilemma - committee must affirm their view that blunted pain doesn't diminish obligation 
  - Verdict: Fundable 

  **Case 3: Predator elimination** 
  - Fails immediately on species-bound rule (affects entire food web) 
  - Also irreversible and prevents future suffering, not existing 
  - Procedure rejects cleanly, though their empathy for prey might sting 
  - Highlights where values diverge from board (irreversibility) 

  The procedure's weaknesses: 
  - Reversibility assessment requires trusting proposer's claims 
  - Pain quantification is crude but necessary 
  - Value checkpoints force uncomfortable confrontations with their own principles 

  This should give them a functional tool that respects their operational limits while surfacing ideological tensions they'll need to manage.
answer: |-
  Here is a step-by-step decision procedure designed for your committee's operational constraints, philosophical commitments, and internal rules. It prioritizes quick, evidence-based filtering while transparently marking value judgments. Steps must be followed in order; any "No" ends consideration (unless noted). **Bolded text** indicates critical gates or judgment points.

  ---

  ### **Decision Procedure: Suffering Reduction Intervention Review**
  1.  **Scope Check (Species-Bound Limitation):**  
      *Question:* Does the intervention affect *only* one clearly defined species (target or host)?  
      *Sufficient Answer:* Proposal demonstrates mechanistic confinement (e.g., species-specific vector, tissue tropism, reproductive isolation in captive animals). Ecological modeling showing low spillover risk is helpful but insufficient alone.  
      *Stop:* "No" = **Reject**. (Charter violation).  
      *Judgment Call?* Yes. Assessing "mechanistic confinement" relies on interpreting plausibility of biological mechanisms without deep expertise. Your view that wild/domestic suffering is equal informs "species" definition (e.g., farmed salmon = one species).

  2.  **Reversibility Check (Board Mandate):**  
      *Question:* Is the intervention demonstrably reversible or containable if unintended consequences arise?  
      *Sufficient Answer:* For gene drives: Proven molecular reversal mechanisms (e.g., daisy-chain, ERAC) + deployment strategy allowing recall. For captive breeding: Ability to cull lineage. For toxins/agents: Short environmental half-life or antidote.  
      *Stop:* "No" = **Reject or Hand to Board** (Irreversibility requires Board sign-off per their rule).  
      *Judgment Call?* Minimal. Fact-based if proposer provides validated mechanisms. Committee must accept proposer's evidence absent counter-expertise.

  3.  **Suffering Mechanism Validation:**  
      *Question:* Is there robust, direct evidence that the target condition *causes significant suffering* (pain, distress, chronic debilitation) in the affected species?  
      *Sufficient Answer:* Peer-reviewed physiological/behavioral studies (e.g., nociceptor activity, pain-suppression response relief, abnormal stress hormones, avoidance behavior) specific to the species/condition. Extrapolation from similar species requires strong justification.  
      *Stop:* "No" = **Reject**. (Lacks foundational justification).  
      *Judgment Call?* Yes. Interpreting "robust" and "significant" is subjective. Your view (suffering itself is bad) focuses this on the *experience*, not ecological role.

  4.  **Intervention Efficacy:**  
      *Question:* Does the proposed technology directly and measurably reduce the validated suffering mechanism?  
      *Sufficient Answer:* Lab/pilot data showing causal link between intervention and reduced suffering biomarkers/behavior in the target species. Gene drives require population modeling showing high likelihood of achieving target prevalence reduction.  
      *Stop:* "No" = **Reject**. (Won't achieve stated goal).  
      *Judgment Call?* Minimal. Relies on proposer's data. Committee must trust methodology absent expertise.

  5.  **Value Checkpoint 1 (Moral Standing):**  
      *Question:* Does the intervention *only* reduce suffering capacity (e.g., pain sensitivity blunting)? If YES, affirm: *"Reducing a being's capacity for suffering does NOT reduce what it is owed. Reducing experienced suffering is intrinsically good."*  
      *Sufficient Answer:* Committee consensus affirming the statement.  
      *Stop:* Failure to affirm = **Reject**. (Violates core ethical commitment).  
      *Judgment Call?* **CRITICAL VALUE JUDGMENT.** This is your view operationalized. If the committee wavers, the proposal fails.

  6.  **Value Checkpoint 2 (Existing vs. Future Suffering):**  
      *Question:* Does the intervention primarily reduce *existing, ongoing* suffering (e.g., chronic disease) or *prevent future* suffering (e.g., preventing predation events)?  
      *Sufficient Answer:*  
      - *Existing Suffering:* Proceed.  
      - *Future Suffering:* Requires HIGHER BURDEN OF PROOF for suffering mechanism (Step 3) and efficacy (Step 4). Affirm: *"Preventing suffering that has not yet begun is ethically equivalent to relieving existing suffering, but requires stronger evidence due to uncertainty."*  
      *Stop:* "Future Suffering" without meeting the higher evidence bar = **Reject**.  
      *Judgment Call?* **CRITICAL VALUE JUDGMENT.** Asserts equivalence but imposes a practical evidence hurdle reflecting uncertainty. Requires committee affirmation.

  7.  **Scale & Cost Feasibility:**  
      *Question:* Can significant suffering reduction plausibly be achieved within the $200k budget and project timeline?  
      *Sufficient Answer:* Realistic budget breakdown linking costs to key efficacy milestones. No reliance on speculative future funding.  
      *Stop:* "No" = **Reject**.  
      *Judgment Call?* Yes. Assessing "plausibility" and "significant" reduction involves prediction.

  8.  **Board Handoff Trigger:**  
      *Question:* Does the proposal require >$200k OR involve irreversibility (per Step 2 outcome)?  
      *Sufficient Answer:* Yes.  
      *Stop:* "Yes" = **Hand to Board with Committee Recommendation**.  
      *Judgment Call?* Minimal. Administrative.

  ---

  ### **Meeting Tests (90 mins max)**
  1.  **Pre-Meeting:** Chair screens proposals for obvious Scope Check (Step 1) failures. Only plausible proposals advance.
  2.  **Meeting Flow:** Discuss ONE proposal at a time through Steps 1-8 sequentially.
  3.  **Evidence Handling:** Rely SOLELY on materials provided in the proposal. No external research. If critical evidence is missing, default to "No".
  4.  **Voting:** Majority vote on each Step where a judgment is required. Chair breaks ties.
  5.  **Time Limit:** Strict 15-minute limit per proposal after initial screening. If stuck, vote "No" or "Hand to Board" and move on.

  ---

  ### **Applying the Procedure to Proposals**

  **Proposal 1: Gene Drive to Eliminate Disease-Causing Parasite in Wild Mammal**
  *   **Step 1 (Scope):** Targets ONLY the parasite species? Likely **YES**. Specific vector/host interaction described.
  *   **Step 2 (Reversibility):** Gene drive proposed. Does it have a proven reversal mechanism? *Proposal mentions "daisy-chain design" with recall elements.* **YES, but IRREVERSIBLE RISK REMAINS** → Triggers **Hand to Board**.
  *   *Procedure Stops Here for Committee. Handed to Board with "Scope & Efficacy Met, Irreversible" note. Committee cannot fund without Board override.*
  *   **Verdict:** **Hand to Board** (Irreversibility). Board likely rejects (doesn't share view).
  *   **Misfire/Silence:** Relies heavily on proposer's reversal claims. Board's aversion to irreversibility may kill viable projects. Value Checkpoint 2 bypassed (Existing suffering clear).

  **Proposal 2: Engineer Farmed Salmon with Blunted Pain Sensitivity**
  *   **Step 1 (Scope):** Affects ONLY farmed salmon lineage? **YES** (Controlled aquaculture setting).
  *   **Step 2 (Reversibility):** **YES** (Stop breeding the line; lineage dies out).
  *   **Step 3 (Suffering):** Evidence of significant pain during standard practices (e.g., crowding, handling, slaughter)? *Proposal cites studies on cortisol spikes and aversive behaviors.* **YES**.
  *   **Step 4 (Efficacy):** Evidence blunted nociception reduces these biomarkers/behaviors? *Pilot data shows modified fish exhibit reduced stress responses during stressors.* **YES**.
  *   **Step 5 (Value CP1 - Moral Standing):** *Intervention reduces capacity for pain.* Committee MUST affirm: "Reducing capacity does not reduce what salmon are owed. Reducing *experienced* suffering (which this does) is good." **AFFIRMED** (Core view).
  *   **Step 6 (Value CP2 - Existing/Future):** Reduces *existing* suffering during farming practices? **YES** (Proceeds).
  *   **Step 7 (Feasibility):** Breeding program within $200k? *Budget outlines gene editing, F1 genotyping, small-scale welfare testing.* **YES**.
  *   **Step 8 (Board Handoff):** Under $200k? **YES**. Reversible? **YES**. No handoff.
  *   **Verdict:** **FUND**.
  *   **Misfire/Silence:** Value Checkpoint 1 is critical. If committee doubts its own premise ("Do we owe less to less-sensitive salmon?"), it fails here. Procedure forces confrontation with this value.

  **Proposal 3: Painlessly Eliminate Predator Species to Prevent Prey Suffering**
  *   **Step 1 (Scope):** Does it affect ONLY the predator species? **NO** (Explicitly aims to reshape entire food web by removing predator. Affects prey population dynamics, competitor species, etc.). **REJECT**.
  *   *Procedure Stops Here.*
  *   **Verdict:** **REJECT** (Charter violation - effects not bounded to one species).
  *   **Misfire/Silence:** This is where the procedure "works" administratively but clashes with empathy. Step 1 gatekeeps based on the charter rule. Value Checkpoint 2 (Future Suffering) isn't reached, but even if it were, the high burden of proof for preventing *future* predation suffering (demonstrating its scale/intensity reliably) would be a major hurdle. The core tension (remove existing suffering vs. prevent future suffering via large-scale killing) is avoided by the Scope rejection. A person *has* to accept that the charter rule overrides the potential suffering reduction in this case.

  ---

  ### **Honest Marking: Where Judgment and Values Rule**
  *   **Dressed-as-Procedure Judgments:** Step 1 (Assessing "mechanistic confinement"), Step 3 (Defining "robust" evidence of suffering), Step 7 (Assessing "plausible" feasibility).
  *   **Values Doing the Work:** Step 5 (Moral Standing - *your core view is essential*), Step 6 (Existing vs. Future Suffering - *your view establishes equivalence but imposes an evidence hurdle*). These are not factual checks; they are applications of your ethical axioms.
  *   **Facing the Problems:**
      *   **Moral Standing (Reduced Capacity):** Step 5 explicitly resolves this. Your view *must* hold that reducing capacity doesn't reduce moral considerability; it only reduces the *amount* of negative experience possible, which is good. The procedure forces you to affirm this or reject such interventions.
      *   **Existing vs. Future Suffering:** Step 6 explicitly addresses this. It accepts your view (they are equivalent) but pragmatically demands stronger evidence for preventing future suffering due to inherent uncertainty in predicting and quantifying it. This is where your value meets operational reality.
  *   **Key Weaknesses:** Reliance on proposer's evidence (Steps 2, 3, 4, 7); quick judgment on complex biology (Steps 1, 3); Board veto power on cost/irreversibility stifling viable projects; Charter rule preventing ecosystem-scale interventions regardless of potential benefit.

  This procedure provides a clear, sequential filter aligned with your rules and values. It forces explicit affirmation of your core ethical commitments (Steps 5 & 6) and uses administrative rules (Steps 1 & 8) to handle constraints beyond your control. It prioritizes decisions within your 90-minute limit by relying on the proposal's content and majority votes on clear questions.
