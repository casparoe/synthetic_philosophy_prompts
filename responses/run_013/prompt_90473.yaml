          - Dense flock: one black raven has LR=3, one green apple has LR=5/3≈1.6667. So the number of green apples to match one black raven: we solve (5/3)^n = 3 -> n = log(3)/log(5/3) ≈ 1.465/0.5108 ≈ 2.87. But the problem said 2.15? Let me check:

          The problem: in the dense flock, the likelihood for a green apple is 50/100 in A and 30/100 in B, so LR = (50/100)/(30/100)=5/3. For a black raven: (30/100)/(10/100)=3. So we want n such that (5/3)^n = 3 -> n = log(3) / log(5/3) ≈ 1.0986 / 0.5108 ≈ 2.15. I miscalculated earlier. So 2.15 green apples.

          - Sparse flock: black raven LR=12/11≈1.0909, green apple LR=188/187≈1.0053. Then n such that (188/187)^n = 12/11 -> n = log(12/11) / log(188/187) ≈ log(1.0909) / log(1.0053) ≈ 0.0862 / 0.0053 ≈ 16.26. So about 16.

     - Then we explain the structure of the problem:
          - The statement "All ravens are black" is logically equivalent to "All non-black things are non-ravens". So observing a non-black non-raven (green apple) confirms the hypothesis.
          - The key is the set of alternative hypotheses. Here we specified two very particular worlds. The evidential weight depends on how the observation changes the relative probability of the two worlds.
          - Why does a green apple have less weight than a black raven? Because in the alternative world (World B), green apples are less common (30 vs 50) but not as much as black ravens are (10 vs 30). And in the sparse world, the difference in green apples is very small (187 vs 188) while the difference in black ravens is also small (11 vs 12) but relatively larger.
          - Why is there a difference between the two rounds? Because the base rates matter. When ravens are rare, a green apple doesn't tell you much because non-black objects are common and mostly non-ravens anyway.

     - Then we reveal: this is known as Hempel's raven paradox. The word "paradox" because intuitively, people think that a green apple shouldn't provide any evidence about ravens, but logically it does. And the resolution is that it does provide evidence, but very little in realistic scenarios where ravens are rare and non-black things are abundant.

     - Also, we note: if you go and find a green apple to check, that is not random. The protocol matters: here we are sampling randomly.

     **What might go wrong:**
     - Students might not understand the likelihood ratio calculation. We can provide a worksheet with the formula for the LR for each type of observation.
     - In the non-black-samplers in Round 1, they might be frustrated because they never see a raven (in World A). They might think they are not getting any information. But they are: every green apple is evidence for A.
     - In Round 2, if the non-black-samplers happen to draw the white raven, they will know it's World B. But that is rare.

     **Timeline:**
     - 0-5 min: Pre-registration (both rounds) and explanation of the two worlds for Round 1.
     - 5-10 min: Team assignment and explanation of protocols.
     - 10-30 min: Round 1 (20 min: 15 for data collection, 5 for computation and decision)
     - 30-35 min: Reveal true world for Round 1 and quick reflection.
     - 35-40 min: Explain the sparse worlds for Round 2.
     - 40-60 min: Round 2 (20 min: 15 for data collection, 5 for computation and decision)
     - 60-70 min: Reveal true world for Round 2 and compare with pre-registration.
     - 70-90 min: Debrief and explanation of the paradox.

     **Part the activity can't reproduce:**
     - The original paradox is about the general hypothesis "All ravens are black" without specifying alternative hypotheses. In the activity, we have to specify two alternative worlds. The activity shows that the evidential weight depends critically on what the alternative is. In the original paradox, the alternative is not specified, which is why it feels paradoxical.

     We can explain that in the debrief.

     **Materials:**
     - For Round 1: 
          - World A deck: 
               - 30 cards: front "Raven", back "Black"
               - 20 cards: front "Non-raven", back "Black"
               - 50 cards: front "Non-raven", back "Non-black"
          - Actually, we only need one deck per team? And we are in World A for all teams. So three identical decks for Round 1 (World A).

     - For Round 2 (World B):
          - 11 cards: front "Raven", back "Black"
          - 1 card: front "Raven", back "Non-black"
          - 101 cards: front "Non-raven", back "Black"
          - 187 cards: front "Non-raven", back "Non-black"
          Total: 11+1+101+187=300. Three identical decks.

     - Alternatively, to save paper, we can have one deck per team per round.

     - Worksheets for recording data and computing LR.

     **Worksheet example:**

     Round 1: 
     World A counts: 
        Black ravens: 30
        White ravens: 0
        Black non-ravens: 20
        Non-black non-ravens: 50
     World B counts:
        Black ravens: 10
        White ravens: 20
        Black non-ravens: 40
        Non-black non-ravens: 30

     For each observation, record the type and then use the table to find the likelihood ratio (LR) for World A vs World B.

     Then multiply the likelihood ratios together to get the total LR.

     If total LR > 1, then choose World A; else choose World B.

     We provide a table:
        - If you see a black raven: LR = 3
        - If you see a white raven: LR = 0 (because in World A, probability=0)
        - If you see a black non-raven: LR = 20/40 = 0.5
        - If you see a non-black non-raven: LR = 50/30 ≈ 1.6667

     Similarly for Round 2.

     This should be manageable.

     Let's write the detailed plan.
answer: |-
  ### Philosophy of Science Session: The Raven Evidence Activity
  **Objective:** Students experience the evidential weight of observations (like green apples) relative to black ravens in confirming a hypothesis, without prior knowledge of Hempel's paradox. They'll discover how context (dense vs. sparse "worlds") dramatically shifts evidential value.

  **Total Time:** 90 minutes  
  **Students:** 18 second-years (3 teams of 6)  
  **Core Mechanism:** Teams sample from a deck representing one of two possible worlds, constrained to observe only one attribute per object. They use data to guess which world they're in.

  ---

  ### **Materials**
  1. **Decks of Cards (2 rounds, 3 decks per round):**
     - **Round 1 (Dense Flock, 100 objects):**
       - **World A Deck:** 30 "Raven/Black" cards, 20 "Non-raven/Black", 50 "Non-raven/Non-black".
       - **World B Deck:** 10 "Raven/Black", 20 "Raven/Non-black", 40 "Non-raven/Black", 30 "Non-raven/Non-black".
     - **Round 2 (Sparse Flock, 300 objects):**
       - **World A Deck:** 12 "Raven/Black", 100 "Non-raven/Black", 188 "Non-raven/Non-black".
       - **World B Deck:** 11 "Raven/Black", 1 "Raven/Non-black", 101 "Non-raven/Black", 187 "Non-raven/Non-black".
     - **Card Design:** Two-sided cards. Front shows category (**Raven** or **Non-raven**). Back shows color (**Black** or **Non-black**).  
       ![Card Example](https://i.imgur.com/7WzG8bO.png)

  2. **Blindfolds (6 per team):** To enforce sampling protocols (prevent peeking at forbidden attributes).

  3. **Worksheets:** 
     - Pre-registration forms (private guesses).
     - Data recording sheets.
     - Likelihood ratio (LR) calculation tables (provided after data collection).

  4. **Scoreboard:** For team points (non-monetary).

  ---

  ### **Timeline & Instructions**

  #### **0-5 min: Introduction & Pre-registration**
  - **Setup:**  
    "We’re exploring how observations support scientific hypotheses. There are two possible worlds. Both have the same total objects, ravens, and non-black things, but differ in raven colors. **World A:** All ravens are black. **World B:** Some ravens are not black. You’ll sample from one world and guess which it is."
  - **Pre-registration (Private):**  
    Each student writes on a form:  
    - *Dense World (100 objects):* "How many **green apples** (non-black non-ravens) equal one **black raven** in evidential strength? My guess: ___."  
    - *Sparse World (300 objects, ravens rare):* "In this scenario, how many **green apples** equal one **black raven**? My guess: ___."  
    *(Collect forms; hold until debrief.)*

  #### **5-10 min: Team Setup & Protocols**
  - **Divide into 3 teams of 6.** Assign protocols:  
    - **Raven-samplers:** Only observe ravens.  
      - Draw a card. If **raven**, note color (turn card over). If **non-raven**, put it back *unseen*. Repeat until 12 ravens recorded.  
      - *Blindfold use:* When drawing, only look at **front** (category). If non-raven, discard without seeing color.  
    - **Non-black-samplers:** Only observe non-black objects.  
      - Draw a card. If **non-black**, note if raven (turn card over). If **black**, put it back *unseen*. Repeat until 12 non-black objects recorded.  
      - *Blindfold use:* Only look at **back** (color) first. If black, discard without seeing category.  
    - **Population-samplers:** Observe everything.  
      - Draw 12 cards randomly, record both attributes for each.  
      - *Blindfold use:* None (observe both sides freely).  

  #### **10-35 min: Round 1 (Dense Flock)**
  - **Deck:** Use **World A deck** (all teams, same world).  
  - **Data Collection (15 min):**  
    Teams follow protocols to gather 12 observations. Record data on sheets.  
    - *Predictable Issue:* Non-black-samplers may grumble ("I only see apples!"). Reassure: "Record what you get—trust the process."  
  - **Analysis (10 min):**  
    1. Provide LR table:  
       | Observation          | LR (World A vs. B) |  
       |----------------------|---------------------|  
       | Black raven          | 3.0                 |  
       | Non-black non-raven  | 1.67 (5/3)          |  
       | Black non-raven      | 0.5                 |  
       | White raven          | 0.0 (impossible in A) |  
    2. Teams calculate total LR: Multiply LRs of all 12 observations.  
       - *Example:* 6 black ravens (LR=3) + 6 green apples (LR=1.67) → Total LR = \(3^6 × 1.67^6 ≈ 11,000\).  
    3. **Decision:** Total LR > 1? Guess **World A**. Else, **World B**.  
  - **Scoring:** Correct guess = 2 points. Report points on scoreboard.

  #### **35-40 min: Reveal & Reset**
  - **Reveal:** "Round 1 was **World A** (all ravens black)."  
  - **Transition:** "Now, a world where ravens are rare."

  #### **40-65 min: Round 2 (Sparse Flock)**
  - **Deck:** Use **World B deck** (all teams, same world).  
  - **Data Collection (15 min):** Same protocols.  
    - *Predictable Issue:* Raven-samplers may find a white raven (probable in World B). Non-black-samplers likely see only apples.  
  - **Analysis (10 min):**  
    1. Provide LR table:  
       | Observation          | LR (World A vs. B) |  
       |----------------------|---------------------|  
       | Black raven          | 1.09 (12/11)        |  
       | Non-black non-raven  | 1.005 (188/187)     |  
       | Black non-raven      | ~0.99              |  
       | White raven          | 0.0 (impossible in A) |  
    2. Teams calculate total LR (e.g., 12 green apples → \(1.005^{12} ≈ 1.06\)).  
    3. **Decision:** Guess based on LR.  
  - **Scoring:** Correct guess = 2 points. Update scoreboard.

  #### **65-80 min: Pre-registration Reveal & Discussion**
  - **Return pre-registration forms.** Share true equivalence values:  
    - *Dense World:* 2.15 green apples ≈ 1 black raven.  
    - *Sparse World:* 16 green apples ≈ 1 black raven.  
  - **Discussion Prompts:**  
    - "Whose guesses were close? Why did green apples 'feel' weaker in the sparse world?"  
    - "Why did black shoes (black non-ravens) *support World B*?" (LR=0.5 in dense world).  
    - "Did anyone see a white raven? How did it change your LR?" (LR=0 → instantly reveals World B).

  #### **80-90 min: Debrief & Paradox Reveal**
  - **Map to Concepts:**  
    - **Contrapositive:** "All ravens are black" ≡ "All non-black things are non-ravens." A green apple (non-black non-raven) *is* an instance of the latter.  
    - **Instance Confirmation:** Observing an instance (black raven) *always* supports the hypothesis, but weight depends on context.  
    - **Alternative Hypotheses Matter:** The evidential weight comes from *how the observation distinguishes World A from World B*. If alternatives change (e.g., more white ravens), weight changes.  
    - **Random Sampling vs. Seeking:** Finding a green apple *because you looked for it* proves nothing (it’s expected in both worlds). But sampling one *randomly* updates probabilities.  
  - **Reveal the Paradox:** "This is **Hempel’s raven paradox**. Philosophers wondered: Why does a green apple (seemingly irrelevant) confirm 'all ravens are black'? Today, you felt the math behind the intuition."  
  - **Limitation of Activity:**  
    - Real-world hypotheses don’t have neat "World A vs. B" alternatives. We must *specify* alternatives to quantify evidence. The paradox arises when we ignore this and assume "all observations should feel equally intuitive."  

  ---

  ### **Predictable Issues & Fixes**
  - **"Why can’t I see both attributes?"**  
    Emphasize: "Science often has limited tools. You’re simulating a telescope that only detects ravens, or a sensor for color only."
  - **Frustration with Protocols:**  
    Non-black-samplers see mostly apples; raven-samplers take longer to find ravens. Prep: "This is intentional! Notice how access shapes evidence."
  - **Calculation Confusion:**  
    Pre-calculated LR tables prevent math errors. Walk through one example step-by-step.
  - **Misinterpreting Evidence:**  
    Debrief explicitly: "A black shoe (black non-raven) *weakens* 'all ravens are black'? Yes! It’s more common in World B (with white ravens)."

  ### **Why This Works**
  - Students **feel** the evidential weight: Green apples matter, but 16 in a sparse world ≠ 2 in a dense world.  
  - The **blindfold mechanic** forces attention on how observation methods shape data.  
  - **Pre-registration** surfaces intuitions, making the final math resonate.  
  - **Rounds contrast** how base rates (raven sparsity) transform evidence.  

  **Final Tip:** Stay strict on time. The power is in the reveal—let confusion linger until the debrief!
