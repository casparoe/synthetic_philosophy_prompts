  Justification: It is true that a theory that merely fits the data without independent motivation is ad hoc. However, the discontinuity at certainty (or certainty effect) is a well-established phenomenon in behavioral economics and has been observed in many contexts. It is also independently motivated by the idea that certainty has a special psychological status. Moreover, the pattern does not necessarily flip with small changes: it is robust to small changes in probabilities. For example, if we change the 0.89 to 0.88, the pattern is likely to persist. The rounding error charge is not entirely fair because the probabilities are given as fixed numbers and the pattern is about the qualitative structure.

