prompt: |-
  Write me a sustained deadpan satire: an excerpt from the employee handbook of a fictional mid-sized company (invent a boring name — Northwind Regional Logistics, Meridian Facilities Group, whatever) that has recently decided to stop treating "going above and beyond" as optional. The whole gag is that the company has tried to make supererogation mandatory, and the handbook has no idea that this is self-defeating. Voice: HR, cheerful, procedural, no winking, no nudging the reader. The document should never once admit the joke. Around 700 words, laid out as numbered clauses or handbook sections.

  Stuff I want in there, roughly:
  - a welcome note from the CEO announcing the new Moral Excellence Framework
  - a table of the three performance tiers and what happens to you if you land in tier one
  - an FAQ entry answering "Am I really expected to run into the burning building?" with a carefully hedged yes
  - the Hero of the Quarter award, now carrying a clause that makes accepting it compulsory
  - a separate grievance procedure for employees who believe they've performed a supererogatory act, in which the burden falls on them to prove the act wasn't required of them — which, given the rest of the document, they can never do
  - a short boxed note from the in-house ethicist, a genuine demandingness maximalist who thinks this is all excellent news, plus one dissenting line from the union rep buried in the footnotes
  - a sidebar on the "Saints Track" promotion ladder, definately distinct from the Heroes Track

  The humor has to come from the actual structure of the concept, so someone who's read the supererogation literature laughs rather than winces. In particular I want the document to keep bumping into the fact that praise seems to presuppose you could have done less, and then to keep solving that problem the wrong way: raise the bar, reward people for clearing it, notice nobody's clearing it, raise it again. Somewhere in there the ethicist should cheerfully concede that no employee has performed a supererogatory act at this company since 2019, and treat that as a success.

  Don't mention any real philosophers or papers. Keep it legible to someone who's never heard the word supererogation, but don't stop to explain the word either.
reasoning: |-
  Okay, the user wants a deadpan satire in the form of an employee handbook excerpt. They're clearly familiar with philosophical concepts like supererogation but want it presented as corporate policy without explanation. 

  Hmm, the challenge is maintaining absolute seriousness while showing how mandatory "above and beyond" becomes absurd. The user specified no winks to the audience - the humor must emerge from the logical contradictions alone. 

  First, let's invent a bland company name... "Meridian Facilities Group" sounds suitably forgettable. The CEO welcome note needs corporate buzzwords - "Moral Excellence Framework" with forced enthusiasm about "shared commitment to extraordinary service" should set the tone.

  For the performance tiers, Tier 1 must sound punitive despite the cheerful HR voice. "Performance Improvement Plan" with mandatory overtime as punishment for merely meeting expectations feels appropriately dystopian. 

  The burning building FAQ is crucial. The hedging should escalate from "not required" to "encouraged" to "consistent with our values" - showing how optionality disappears through corporate doublespeak. 

  Ah, the Hero of the Quarter clause! Making award acceptance compulsory undermines the very concept of reward. Perfect. And the grievance procedure inversion - employees proving their extra effort wasn't mandatory in a system where everything is mandatory - that's the core joke.

  The ethicist sidebar must be unintentionally revealing. Having them celebrate zero supererogatory acts since 2019 as "proof of our high standards" turns the screw nicely. And hiding the union rep's dissent in a footnote maintains the deadpan while acknowledging pushback.

  For the Saints vs Heroes distinction... misspelling "definately" in the handbook feels authentically corporate. Saints should require exponentially more sacrifice - three documented supererogatory acts per quarter is comically impossible.

  The key is letting each policy logically extend until it collapses under its own weight. When the ethicist admits nobody clears the bar since 2019 but calls it success, that's the punchline. No laughter from the narrator, just cheerful procedural language.

  User definitely understands philosophical absurdity - they mentioned "demandingness maximalist" unironically. This needs to satisfy both philosophy nerds and casual readers. No jargon, just structural irony.

  Final touch: the mandatory "sincerity verification" for Hero award nominees. Because forced gratitude makes everything better!
answer: |-
  ## Meridian Facilities Group Employee Handbook (v.4.3)  
  **Section 17: The Moral Excellence Framework (MEF)**

  *   **17.1 Welcome Note from CEO, Roland Finch:** "Team Meridian! Thrilling times! As we navigate an increasingly competitive landscape, merely meeting expectations is no longer sufficient for sustained collective prosperity. We must *excel*, not just exist! That’s why I’m delighted to introduce our Moral Excellence Framework (MEF). The MEF formally recognizes and *integrates* the spirit of ‘going above and beyond’ – that wonderful, discretionary effort we sometimes saw – into the very fabric of our expected performance standards. Think of it not as added pressure, but as a structured pathway for *every* employee to consistently achieve their fullest, most impactful potential. Together, we rise!"

  *   **17.2 Performance Tiers Under MEF:** Your quarterly review will now categorize performance into one of three tiers:
      *   **Tier 3: Foundational Compliance:** Meeting all core job requirements and baseline behavioral standards (e.g., punctuality, adherence to safety protocols, completing assigned tasks). *Consequence:* Required attendance at "Aspirational Achievement" workshops. Performance Improvement Plan (PIP) initiation likely.
      *   **Tier 2: Consistent Delivery:** Reliably meeting core requirements while occasionally demonstrating initiative within the scope of one's direct responsibilities (e.g., suggesting minor process improvements, assisting a colleague without direct prompting within one's team). *Consequence:* Standard merit increase eligibility maintained. Encouraged (but not yet required) participation in "Excellence Accelerator" modules.
      *   **Tier 1: Supererogatory Contribution:** Consistent demonstration of actions exceeding foundational job duties and baseline ethical requirements, involving significant personal cost, risk, or inconvenience, undertaken without expectation of reward, and demonstrably contributing to Meridian's overarching success. *Consequence:* Eligibility for Hero of the Quarter nomination, Saints Track consideration, and priority for discretionary bonuses. *Failure to achieve Tier 1 for two consecutive quarters triggers mandatory reassessment of role suitability.*

  *   **17.3 Defining Supererogatory Contribution:** A Supererogatory Contribution is an act that:
      *   (a) Significantly exceeds the reasonable expectations defined in your core job description and the MFG Code of Conduct.
      *   (b) Involves a demonstrable personal sacrifice (time, effort, comfort, personal resource, or *acceptable* personal risk).
      *   (c) Is undertaken proactively, without direct instruction or the reasonable anticipation of specific reward or recognition.
      *   (d) Provides tangible, significant benefit to Meridian, its clients, or its community standing.
      *   *Examples include, but are not limited to:* Voluntarily working extensive unpaid overtime during a critical project crunch; utilizing significant personal funds to resolve a client emergency (with pre-approval for reimbursement *only* if deemed non-supererogatory during Grievance Assessment – see 17.7); intervening in a significant safety incident beyond standard protocol; developing and implementing a major efficiency improvement outside designated R&D roles.

  *   **17.4 FAQ: Clarifying Expectations**
      *   **Q: Does "supererogatory" mean I’m expected to do things that are dangerous or illegal?**
          A: Absolutely not! All actions must comply with MFG policies and local laws. Safety remains paramount.
      *   **Q: Am I really expected to, for example, run into a burning building to save company property?**
          A: Meridian *never* requires actions that violate safety protocols (MFG Safety Handbook, Section 5.1: Evacuation is Mandatory). However, the *spirit* of safeguarding Meridian's assets and ensuring client continuity is central to our values. An employee who, *after ensuring their own and others' immediate safety*, and *acting entirely on their own volition without expectation*, utilizes unique skills or opportunity to mitigate extreme loss *may* demonstrate the qualities aligned with Tier 1 contribution. Such hypotheticals are evaluated on a case-by-case basis through the Grievance Assessment Process (17.7), considering context and personal cost. Proactive fire prevention, however, is always encouraged.
      *   **Q: If I do something extra, does that mean it becomes part of my core duties next quarter?**
          A: The MEF is dynamic! As our collective standard rises, yesterday's extraordinary can become today's ordinary. This reflects our shared commitment to perpetual growth. Job descriptions may be periodically updated to reflect evolving Tier 1 benchmarks.

  *   **17.5 Hero of the Quarter Award:**
      *   Recognizes the quarter's most exemplary demonstration of Supererogatory Contribution.
      *   **Revised Acceptance Protocol:** Nomination is an honor. **Acceptance of the Hero of the Quarter Award is now mandatory for the selected employee.** Refusal constitutes a demonstrable lack of alignment with the MEF spirit and will be documented in the employee's file, impacting Tier classification. Award includes a commemorative plaque, preferred parking for the following quarter, and a $250 voucher for the company store. Award ceremonies occur during mandatory all-hands meetings. Nominees must undergo a brief "Sincerity Verification" interview with HR prior to final selection.

  *   **17.6 Saints Track:** Distinct from standard promotion ladders or the Hero recognition, the Saints Track offers accelerated advancement for employees demonstrating *sustained, documented* Supererogatory Contribution. Requires consistent Tier 1 classification for four consecutive quarters, including at least three formally recognized Supererogatory Acts per quarter (see Grievance Assessment Process 17.7 for recognition procedure). Saints Track candidates receive mentorship from the Office of Ethical Vigor and priority for leadership development programs. *Note: The Saints Track is definately separate from the "Heroes Track," which focuses on consistent high performance within defined duties.*

  *   **17.7 Grievance Assessment Process (For Purported Supererogatory Acts):** Employees who believe they have performed an act they consider Supererogatory, but which has not been formally recognized (e.g., not reflected in Tier rating, not nominated for Hero award), may file a Grievance of Recognition.
      *   Step 1: Employee submits Form MEF-G1 ("Claim of Unrecognized Supererogation"), detailing the act, personal cost incurred, lack of prior expectation, and perceived benefit to MFG.
      *   Step 2: The Office of Ethical Vigor (OEV) conducts a review. **The burden of proof rests entirely with the employee** to demonstrate that the act was *not*:
          *   (i) Reasonably implied by their current job description or recent performance expectations.
          *   (ii) An action any "reasonably dedicated Meridian employee" would have undertaken in the same circumstances.
          *   (iii) Motivated, even subconsciously, by the potential for recognition or reward under the MEF.
      *   Step 3: OEV renders a binding decision. If the act is deemed *not* Supererogatory (i.e., it was merely Tier 2 or even Tier 3 performance), no further action is taken. If deemed Supererogatory, it is formally recorded, impacting the employee's next Tier rating and eligibility for Saints Track/Hero nomination.
      *   *Note: Filing a frivolous Grievance of Recognition (as determined by OEV) may negatively impact Tier classification.*

  *   **17.8 Perspective from the Office of Ethical Vigor:** (Boxed Text)
      *   "The MEF represents a thrilling evolution in corporate citizenship! By integrating supererogation into our mandatory performance structure, we dissolve the outdated barrier between 'required' and 'exceptional.' True moral progress is measured by the elevation of the baseline. While some might note that documented, verified Supererogatory Acts have been exceedingly rare since the framework's pilot in Q4 2019, we view this not as a shortage, but as resounding validation. It signifies that our standards are now so high that merely meeting them *is* the new extraordinary! Our employees are internalizing the expectation of excellence so completely that the 'extra' becomes baseline. This is the pinnacle of ethical integration! Keep striving!" - *Dr. Lysander Poole, Chief Ethicist, Office of Ethical Vigor*
      *   ^*Footnote: Union Representative C. Briggs noted concerns during the working group meeting regarding "mandatory volunteerism" and "uncompensated risk burden." These concerns were duly recorded and considered by the OEV, which determined they reflected a transitional understanding of the MEF's aspirational nature.*

  *   **17.9 Continuous Improvement:** The MEF is subject to quarterly review by the OEV. Benchmarks for Tier 1 (Supererogatory Contribution) will be dynamically adjusted based on observed employee performance trends to ensure they remain suitably aspirational and continue to drive our collective moral elevation.
