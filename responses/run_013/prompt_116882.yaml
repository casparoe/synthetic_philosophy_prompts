prompt: |-
  Write a job listing, in the deadpan register of a museum's careers page, for an institution that has adopted Tolstoy's account of art in What Is Art? as its acquisitions and exhibitions policy. The museum holds that a work is art only if the artist transmits to others a feeling he has himself experienced, and it grades works by how reliably that feeling is caught — by how individual the feeling is, how clearly it is expressed, and how sincere the artist was. Beauty, difficulty, and novelty count for nothing; works that merely borrow, imitate, aim at effect, or divert are filed as counterfeit; obscurity is treated as a defect of transmission rather than a mark of depth. Only feelings that unite people qualify for the top tier, with a further tier reserved for simple everyday feelings accessible to everyone, ranked above the partisan.

  The advertisement should lay out the role, the duties, the requirements, and the benefits without ever winking, in roughly 600 words. Let the comedy arise from the policy meeting the actual collection and the actual staff: the certification panel of ordinary viewers whose job is to report what they felt; the sealed Beethoven and Wagner storerooms; the advertising jingle that keeps outscoring the paintings on the museum's own transmission metrics; the donor whose gift comes with conditions; the fact that no one can be hired to assess sincerity. A reader who has never heard of Tolstoy should be able to follow the piece, and a reader who has read the book should be able to see that the author has the theory right, weak points included, without the piece ever stating them.
reasoning: |-
  Okay, let me approach this request methodically. The user wants a job listing for a museum that strictly follows Tolstoy's art theory from "What Is Art?", presented in a deadpan tone while embedding subtle comedy through operational details. 

  First, I need to ensure Tolstoy's core principles are accurately reflected: art defined by genuine emotional transmission, rejection of technical skill or novelty as values, and hierarchy based on universal accessibility of feelings. The comedy must emerge organically from institutional implementation - like ordinary viewers as arbiters of artistic value or Beethoven being archived for elitism. 

  I consider structuring it as a standard museum job posting with sections: Position Summary, Key Duties, Required Qualifications, Preferred Qualifications, Compensation & Benefits. The deadpan delivery requires maintaining bureaucratic language while planting absurdities: sincerity assessment being impossible to hire for, advertisements outscoring artworks, that donor clause about "unifying feelings." 

  For authenticity, I'll include operational details that expose Tolstoy's theory's practical flaws - the sealed storerooms for technically brilliant but "counterfeit" art, the paradox of measuring sincerity. The challenge is making these comprehensible to readers unfamiliar with Tolstoy while offering layered meaning to those who know the text. 

  The tone must remain strictly professional, letting the comedy arise from the institution's earnest commitment to this flawed system. No editorializing - just present the museum's reality as matter-of-fact. Like the jingle outperforming paintings on transmission metrics being stated as neutral fact. 

  I'll conclude with standard EEO language to heighten the contrast between normal HR framing and the bizarre philosophical framework. The piece should sit exactly at that intersection of rigorous theory and institutional absurdity.
