  ## MUSEUM OF UNIVERSAL FEELING: ASSOCIATE CURATOR OF TRANSMISSION VERIFICATION

  **Position Title:** Associate Curator of Transmission Verification  
  **Department:** Acquisitions & Exhibitions  
  **Reports To:** Head Curator of Sincerity Assessment  
  **Status:** Full-time, Exempt  
  **Posting Date:** October 26, 2023  
  **Application Deadline:** Open until filled

  **Position Summary:**
  The Museum of Universal Feeling (MUF) seeks a dedicated Associate Curator of Transmission Verification to support the rigorous implementation of our core acquisitions and exhibitions policy. The successful candidate will play a vital role in ensuring all objects considered for the Collection, or presented in our galleries, adhere strictly to the established criteria of authentic emotional transmission, as defined by our institutional charter. This involves meticulous documentation, procedural oversight, and collaboration with our unique assessment panels.

  **Key Duties and Responsibilities:**
  *   **Collection Review & Documentation:** Assist in the preliminary assessment of potential acquisitions and existing collection items. Document provenance and artist statements specifically focusing on evidence of the *specific feeling experienced by the creator* and the *intended transmission method*. Maintain detailed records of perceived sincerity indicators.
  *   **Panel Coordination:** Schedule, brief, and administratively support the Certification Panel of Ordinary Viewers (CPOV). Accurately transcribe and collate CPOV reports detailing the specific feelings reliably evoked during controlled viewings. Ensure CPOV protocols (blind viewings, standardized reporting forms) are strictly followed.
  *   **Tier Classification Support:** Under the Head Curator's direction, assist in applying the transmission criteria to classify works into appropriate tiers:
      *   Tier 1: Feelings fostering universal human unity (highest priority).
      *   Tier 2: Simple, accessible everyday feelings common to all people.
      *   Tier 3: Partisan, exclusive, or niche feelings (limited display).
      *   Counterfeit: Works exhibiting borrowing, imitation, effect-seeking, diversion, or significant obscurity (archived separately).
  *   **Exhibition Development Support:** Assist in selecting works for exhibitions based solely on their verified transmission strength and tier classification. Draft didactic materials focused solely on the feeling transmitted and its clarity/accessibility, avoiding discussion of technique, historical context (unless directly bearing on the feeling's origin), beauty, or innovation.
  *   **Archival Management:** Maintain records related to Counterfeit works stored in the Secure Collections Annex (including the Sealed Beethoven Manuscripts Repository and the Wagnerian Effects Vault). Process requests for scholarly access under strict supervision.
  *   **Data Analysis:** Compile and organize data from CPOV reports and visitor feedback surveys for transmission efficacy metrics. Prepare comparative summaries as required.
  *   **Donor Liaison (Specific):** Manage documentation and compliance tracking related to the specific terms of the Pendleton Bequest, ensuring all displayed works funded by this source demonstrably align with the "unifying feelings" clause.

  **Required Qualifications:**
  *   Master's degree in Art History, Museum Studies, Psychology (Emotion Research focus preferred), or a closely related field.
  *   Minimum 2 years of professional experience in a museum, gallery, or research setting involving systematic data collection or audience evaluation.
  *   Demonstrated ability to handle complex administrative tasks with precision and meticulous attention to procedural detail.
  *   Excellent written communication skills, with proven experience in drafting clear, concise, objective reports and documentation. Ability to describe emotional responses neutrally is essential.
  *   Strong organizational skills and the ability to manage multiple concurrent projects involving diverse stakeholders.
  *   Proficiency with standard museum database software (TMS or equivalent) and data analysis tools (e.g., Excel, basic statistical software).
  *   Absolute commitment to institutional policy and its objective application, setting aside personal aesthetic preferences.

  **Preferred Qualifications:**
  *   Familiarity with empirical methodologies in emotion or perception studies.
  *   Experience coordinating focus groups or similar participatory evaluation panels.
  *   Basic archival handling and cataloging skills.
  *   Demonstrated ability to work effectively and respectfully with non-specialist participants (e.g., the CPOV).

  **Compensation & Benefits:**
  *   Competitive salary commensurate with experience within established museum pay bands.
  *   Comprehensive health, dental, and vision insurance.
  *   Retirement savings plan with employer contribution.
  *   Generous paid time off and holiday schedule.
  *   Professional development allowance.
  *   Complimentary access to Museum galleries and Tier 1 & Tier 2 exhibition previews.

  **Application Process:**
  Interested candidates should submit a cover letter detailing their specific qualifications for the role, a current CV, and a writing sample (preferably a formal report or analytical document) via the Museum's online portal. Please reference Job ID# MUF-ACV-1023.

  **About the Museum of Universal Feeling:**
  The Museum of Universal Feeling is dedicated to the principle that true art consists solely in the successful transmission of a feeling genuinely experienced by the artist to the viewer. We rigorously evaluate works based on the individuality and clarity of the feeling expressed, the sincerity of the artist, and the reliability of its transmission to others of diverse backgrounds. Beauty, technical difficulty, novelty, and intellectual complexity hold no intrinsic value within our framework. We maintain distinct tiers recognizing the primacy of unifying human feeling, accessible everyday emotion, and, separately, partisan sentiment. Works failing to meet the criteria for authentic transmission are classified as Counterfeit and excluded from the primary Collection and exhibition spaces. The Museum is an equal opportunity employer committed to diversity and inclusion within its workforce, reflecting the universality we seek in art.

  **Note on Core Function:** Applicants should understand that direct assessment of artist sincerity remains an institutional function outside this role's purview and relies on documented biographical evidence and the consistent internal logic of the work itself. The Associate Curator focuses on the *process* of verifying transmission through the CPOV and documented adherence to policy.
