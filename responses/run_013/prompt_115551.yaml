prompt: |-
  A reading group I'm in has been stuck for a year on a question that looks as though a theorem should settle it, and I want a diagnosis of the impasse rather than another summary of the two sides. The question is what exactly is at issue between two camps in the literature on bet sizing. One camp holds that an agent facing a long sequence of multiplicative bets should stake the fraction that maximizes the expected logarithm of wealth, on the ground that any other rule is almost surely overtaken by the log-optimal rule in the long run; from this they conclude that log maximization is the rule of rationality for a long-lived agent, and that the characteristic risk-aversion of the rule — modest stakes, never courting ruin — is derived rather than assumed. The other camp replies that maximizing expected log wealth just is expected-utility maximization with a logarithmic utility function; that the expected-utility representation has arguments behind it while the choice of logarithmic utility does not; and that the growth theorem therefore shows at most that one particular preference profile is compatible with one particular betting rule, not that anyone ought to have that profile. On this view, the claim that rationality requires the log rule is either false or a stipulative redefinition of rationality as growth. A third group in the room says the two sides are answering different questions — one about what a person should prefer given her preferences, the other about which strategy keeps an agent in the game — and that each side is smuggling in a conclusion from the other's question.

  We agree about all the mathematics, which is what puzzles me. The concrete case that keeps us circling: a single bet at 10:1 odds with a one-in-nine chance of winning, offered once, with no prospect of another. It has positive expected value; the log rule stakes about two percent of one's wealth; a linear-utility maximizer stakes everything. Everyone concedes that across a long sequence of such bets the log rule is the growth-optimal answer and that staking everything is a route to ruin. The fight is about the one-shot case, where the theorem's hypothesis — many repetitions — plainly fails, and yet the geometric-rationality people in the group still recommend the fractional stake. When pressed, one of them made an argument I cannot evaluate: that averaging over the branches of an ensemble is the wrong average for an agent who will live a single trajectory, so that the expected-value calculation answers a question about a population of copies rather than about you.

  My hypothesis — offered as a hypothesis — is that the dispute is verbal at the level of the slogan that the log rule is a rival to expected-utility theory, but substantive at the level of the claim that one ought to have logarithmic utility, and that the real residue is a disagreement about whether expectation over an ensemble correctly represents a single agent's fate. Tell me whether that is right. I want the diagnosis: is this a verbal dispute about what the word rational is a predicate of, a substantive normative dispute about which averaging operation represents an agent's situation, a scope error about whether an asymptotic result concerning repetition bears on one-shot choices, a disagreement about what decision theory is for — preference coherence or survival — or something else, including a hidden mathematical question I have not noticed. Say what each side is actually committed to, and which of these is doing the work. Then say what, if anything, would count as progress here: a formal result, a distinction, a restriction of the theorem's scope, or an argument that no progress should be expected because the camps have different subject matters. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of my question; take a definite position rather than laying out the options for me to choose among.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're part of a reading group stuck on a debate about bet sizing between two camps. One camp advocates for maximizing expected log wealth for long-term growth, while the other sees it as just expected utility with a specific utility function. The user wants a diagnosis of the impasse, not a rehash of the arguments.

  First, I need to identify the core issue. The user mentions they all agree on the math, so the disagreement must be philosophical. Their hypothesis is that it's verbal about the term "rational" but substantive about logarithmic utility. They also bring up the ensemble vs. single trajectory point.

  The concrete example is a one-shot bet with 10:1 odds and 1/9 win probability. The log rule suggests 2% stake, while linear utility goes all-in. The log camp still recommends fractional stake even for one-shot, which the other camp challenges because the theorem requires repetition.

  I recall the Kelly criterion and expected utility theory. The Kelly criterion maximizes growth rate, which is optimal in repeated bets. But in one-shot, expected utility depends on the agent's risk preference. So why does the log camp insist on fractional for one-shot?

  The user mentioned an argument about ensemble averages vs. single trajectories. In probability, the law of large numbers applies over many trials, but a single trial doesn't guarantee anything. For a one-shot bet, if you bet everything, there's a high chance of ruin. Even though the expected value is positive, the actual outcome is binary: either win big or lose everything. The log utility function is concave, meaning it's risk-averse, so it naturally avoids ruin by staking less.

  The growth-optimal camp might believe that avoiding ruin is rational even in one-shot because preserving capital is crucial for future opportunities, even if they aren't specified. They might be implicitly considering a broader context of the agent's entire financial life, beyond just this one bet.

  The other camp is strict about expected utility requiring a utility function. Without repetition, growth rate isn't relevant. So insisting on Kelly for one-shot seems to impose a specific risk aversion without justification.

  The user's hypothesis is partly right: it's substantive about whether to adopt log utility. But the deeper issue is the disagreement over what rationality entails: survival vs. preference coherence. The ensemble point is key—using expectation (an ensemble average) might not reflect a single agent's experience. For a single bet, the variance matters a lot, especially with ruin risk. Expected value doesn't capture the downside risk adequately when outcomes are asymmetric.

  So the bottom line: the dispute is about whether rationality should prioritize avoiding extinction (ruin) or maximizing expected value. The growth camp prioritizes survival, hence fractional staking even in one-shot to avoid ruin. The utility camp sees survival as one preference among others, not mandated by rationality alone. Progress might come from formalizing survival constraints or distinguishing decision contexts.
answer: |-
  **Bottom line: The impasse is a substantive normative dispute about whether avoiding extinction-level risk is rationally mandatory, rooted in conflicting intuitions about whether ensemble averages (expectation) or worst-case tail events (ruin) define rational prudence for a single agent facing uncertainty, even in one-shot choices.**

  ### Diagnosis of the Dispute:
  1.  **Not Verbal (About "Rationality"):** Both camps agree that "rationality" requires coherent preference satisfaction under uncertainty. The disagreement isn't about the *meaning* of rationality, but about what *constitutes* rational preferences/constraints in this context.
  2.  **Not Primarily About Utility Choice:** While the anti-log camp focuses on the arbitrariness of logarithmic utility, this is a symptom. The pro-log camp's core argument isn't "you must like log-utility"; it's "you must avoid strategies with a non-zero probability of ruin *because* ruin is catastrophic and irreversible for a single trajectory".
  3.  **Not a Scope Error (Asymptotics vs. One-Shot):** The pro-log camp *deliberately* extends the lesson from the asymptotic theorem (avoid ruin to stay in the game) to the one-shot case, arguing that extinction-risk avoidance is paramount *even when* the long-run guarantee doesn't apply. The anti-log camp denies this extension is justified without repetition.
  4.  **The Core: Extinction Risk vs. Expectation:** The fundamental disagreement is normative:
      *   **Pro-Log Camp (Growth/Ruin-Avoidance):** For any agent who values continued existence/opportunity (a "long-lived agent"), strategies with a non-zero probability of total loss (ruin) are inherently irrational *regardless of repetition*. The irreversibility of ruin for a single agent means the ensemble average (expected value) is misleading; it aggregates doomed and surviving paths. Rationality *requires* constraining strategies to those ensuring survival (positive probability wealth > 0), and the log rule (or fractional Kelly) emerges as optimal *within* this survival-mandated constraint. Their commitment: **Rational agents *must* have preferences that treat extinction (ruin) as infinitely bad, implying infinite risk aversion at zero wealth, which log-utility approximates.**
      *   **Anti-Log Camp (Preference Sovereignty / EU Primacy):** Expected Utility Theory (EUT) is the framework for rationality. Preferences (the utility function) are sovereign, provided they are coherent. There is no *rational mandate* to prioritize avoiding ruin above all else; an agent with linear utility (risk-neutral) who stakes everything on a positive-EV bet is perfectly rational, even if ruin is possible. The ensemble average *is* the correct representation of the gamble's value *given the agent's preferences*. The long-run theorem is irrelevant to the one-shot case. Their commitment: **Rationality only requires coherence (EUT axioms); it does *not* mandate any specific risk aversion (like avoiding ruin at all costs) or survival constraint. Log-utility is just one arbitrary preference profile.**

  ### What's Doing the Work:
  *   The **ensemble vs. single trajectory argument** is the *pivotal intuition* driving the pro-log stance in the one-shot case. They argue that averaging over paths where you are ruined (wealth=0) is nonsensical *for you* – you only experience one path, and ruin ends your game. Expectation hides this existential risk.
  *   The **irreversibility of ruin** is the key motivation. Ruin isn't just a bad outcome; it's game-over. This drives the claim that survival is a prerequisite for valuing *any* future EV, making it rationally non-negotiable.
  *   The **anti-log camp's core leverage** is the *lack of derivation*: Why *must* an agent treat ruin as infinitely bad? EUT doesn't require it. Insisting on a survival constraint or log-utility appears to smuggle in a substantive, undefended value judgment about risk aversion under existential threat.

  ### What Counts as Progress:
  Progress requires resolving the normative standoff on extinction risk. This could come from:
  1.  **Formalizing Survival Constraints:** A rigorous decision theory incorporating an *explicit*, justified "no-ruin" constraint or a lexicographic priority for survival (e.g., first avoid ruin *with certainty*, *then* optimize EV within safe strategies). Showing this is uniquely compelling or derivable from weaker axioms than EUT itself would favor the pro-log intuition.
  2.  **The Single-Trajectory Argument:** A formal model demonstrating that a single agent *cannot rationally ignore* the possibility of being on a doomed path when choosing, or that expectation fundamentally misrepresents value under irreversible ruin. This is difficult but crucial for the pro-log case.
  3.  **Deriving Log-Utility from Non-EUT Principles:** If compelling axioms focused solely on prudence, survival, or capital preservation for a *single* agent facing uncertainty *could* imply log-utility (or similar) without relying on long-run growth theorems, it would undermine the "arbitrary preference" charge.
  4.  **Conceding Separate Domains:** Concluding that the camps *are* answering different fundamental questions ("What ensures long-term survival/growth?" vs. "What satisfies coherent preferences?") and that the "one-shot log rule" is only rational *if* one accepts survival as a pre-rational imperative. This clarifies but doesn't resolve the dispute.

  Absent such developments, the impasse persists: it's a fundamental clash between the view that rationality demands survival above all else and the view that rationality only demands internal consistency of preferences, leaving survival as a preference like any other.
