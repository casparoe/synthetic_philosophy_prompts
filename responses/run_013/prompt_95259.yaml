prompt: |-
  You're a decision theorist who actually works on acausal and evidential decision theory and who has a settled view rather than a hedge. Think carefully, and be blunt about where you're guessing.

  Background so we're on the same page (don't explain it back to me): I've been reading about what people call evidential cooperation in large worlds. The idea is that if the universe is big enough and contains lots of agents whose decision procedures are similar to mine but who are causally cut off from me, then my choosing to cooperate at a real local cost is evidence that they'll cooperate too, so we all gain from trade even though none of us can ever affect the others. My gut credence that this makes cooperation the right move is maybe 0.25 and I don't trust it.

  Give me your number, but on one precise proposition: for a human with roughly my values facing a real costly cooperative choice where the only link between me and the distant agents is evidential (no causal channel, no common designer, just algorithmic similarity), the rational choice is to cooperate -- i.e. the ECL argument, run on realistic numbers in a realistically large universe, comes out net positive.

  Do not give me a bare number. Decompose it: how much rides on evidential/functional decision theory being the right account of rational choice at all, how much on there being enough causally disconnected agents running near-identical decision procedures, how much on that correlation surviving across those distances, how much on how the counterparts' values differ from mine (the gains-from-trade side), plus any other term you think belongs. One line and a rough probability for each, then how they combine. Then tell me which term I should be least confident about and what specific evidence or argument would move it most.

  Before the numbers, spend a few sentences brainstorming how this could fall apart -- e.g. whether the reference class of 'agents similar to me' is even well defined, or whether the whole thing is a dressed-up Pascal's mugging.
