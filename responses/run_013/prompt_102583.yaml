prompt: |-
  Over the past year I have watched several people I know be disciplined, and in one case effectively ruined, by loose coalitions of strangers, and I have found myself approving of some of these campaigns and recoiling from others without being able to say what distinguishes the ones I accept from the ones I do not. I do not need another essay on whether cancel culture is real or whether it is a moral panic. I need the specification, and I need it pitched so that a person actually deciding, in a particular case, whether to join a sanction or resist it could use it. Write out the desiderata that any adequate theory of informal social sanction as punishment must meet: the cases it has to get right (private criticism, a consumer boycott, dismissal from a job, the refusal of a platform, organized ostracism, and the pile-on that far exceeds what the original offense warranted); the distinctions it must not collapse (punishment versus disapproval, versus the mere withdrawal of association, versus self-protection; the sanction versus the wrong that provoked it; intended versus foreseeable harm); and the constraints it must respect (that no one is in charge, that the rules are unwritten and applied after the fact, that sanctions accumulate, and that standing to punish is itself contested). Give the consideration behind each requirement, say which are non-negotiable and which are the prejudices of a particular camp, identify the requirement that does the most to exclude the leading positions, and tell me which pair of requirements cannot be jointly satisfied. My own suspicion is that fair notice or proportionality and genuinely decentralized enforcement are incompatible, but I want your judgment rather than mine. The criteria are what I am after; a brief scorecard of the main positions can follow.
reasoning: |-
  Hmm, this user presents a sophisticated challenge about informal social sanctions. They've observed real-world consequences of these "loose coalitions" acting as informal judges and executioners - job losses, reputational ruin - and feel conflicted when their moral intuition approves some cases but rejects others. This isn't just theoretical; they want practical criteria for deciding when to participate in such sanctions.

  The user clearly knows the discourse well - they're tired of debates about whether cancel culture exists and want operational principles instead. Their framing suggests legal/philosophical training: they specify required case distinctions (punishment vs disapproval), constraints (decentralized enforcement), and even anticipate key tensions (proportionality vs decentralization). 

  Key challenges in crafting this framework:
  First, must reconcile the punitive nature of sanctions with their decentralized origins - unlike state punishment, there's no central authority setting rules or moderating responses. 
  Second, must distinguish between the act of sanctioning and the original offense - bad acts don't automatically justify any response. 
  Third, must address cumulative harm: how individual actions (a critical tweet) become collective punishment (a career-ending pile-on).

  The user's suspicion about proportionality clashing with decentralization is astute. In state systems, proportionality is maintained by judges and sentencing guidelines. But in mob justice? One person's proportionality is another's underreaction. My framework will need to confront this head-on.

  Non-negotiables emerge from basic fairness: 
  1. Harm must be real, not imagined (rejects "offense archaeology" where old tweets are punished by today's standards) 
  2. Sanctions mustn't be disproportional (a racist comment shouldn't cost a lifetime career) 
  3. Targets deserve rebuttal (contra trial-by-Twitter where accusations equal guilt)

  The trickiest tension is indeed between fair notice ("you should've known this was sanctionable") and decentralization. Without centralized rules, how can we expect consistent understanding of boundaries? This may require accepting that perfect fairness is impossible in informal systems - but we can still demand basic reciprocity (e.g., "would I want this standard applied to me for my worst mistake?").

  For scoring existing positions: 
  - Libertarians rightly emphasize association rights but underestimate power imbalances (a worker fired after viral outrage isn't "just" facing market forces). 
  - Social justice advocates correctly note marginalized groups lack institutional recourse but sometimes neglect due process. 
  - Free speech absolutists ignore how speech can be weaponized as punishment.

  The user's framing is brilliant - they want a decision tool, not a polemic. My response must honor that by making every criterion action-guiding. Instead of "proportionality is good," I'll specify: "Ask whether the sanction matches both the act's severity and the offender's capacity to reform."
answer: |-
  Below is a systematic framework for evaluating informal social sanctions ("cancel culture" dynamics), designed as a decision-making tool. It prioritizes **action-guiding principles** over abstract debate, addresses your specified cases and distinctions, and highlights irreconcilable tensions. The criteria are grounded in fairness, moral agency, and social reality—not ideology.

  ---

  ### **Core Desiderata for an Adequate Theory**  
  *(Non-negotiables in bold; contingent preferences in italics)*

  1. **Distinguish Sanction from Wrong**  
     - **Must separate the moral assessment of the original act from the permissibility of the sanction.**  
     - *Why*: Approving of condemnation (e.g., "this statement is racist") doesn’t entail endorsing specific punishments (e.g., "they must be fired and never hired elsewhere").  
     - *Non-negotiable*: Collapsing this enables punitive overreach.

  2. **Intentionality and Foreseeability**  
     - **Must distinguish between harm intended by sanctioners (e.g., "get them fired") and foreseeable but unintended consequences (e.g., PTSD from viral harassment).**  
     - *Why*: Moral responsibility differs for direct action (organizing a boycott) vs. contributing to emergent harm (joining a pile-on).  
     - *Non-negotiable*: Denying this excuses mob tactics as "accidental."

  3. **Punishment vs. Disapproval vs. Self-Protection**  
     - **Must delineate**:  
       - *Disapproval* (criticizing ideas).  
       - *Withdrawal of association* (unfollowing, boycotting a business).  
       - *Self-protection* (deplatforming a harasser).  
       - *Punishment* (coordinated reputation destruction).  
     - *Why*: Conflating criticism with punishment chills discourse. Self-protection is defensive; punishment is retributive.  
     - *Non-negotiable*: Essential for moral clarity.

  4. **Proportionality**  
     - **Sanctions must not grossly exceed the gravity/scope of the wrong.**  
     - *Why*: Losing a career for a minor gaffe violates "fit the crime" intuition. *Test case*: Pile-ons that escalate beyond the offense.  
     - *Non-negotiable*: Core to justice traditions.  
     - *Contested*: *Progressives often reject "proportionality" as privileging offender comfort; conservatives weaponize it to deflect accountability.*

  5. **Standing and Power Asymmetry**  
     - **Must weigh**:  
       - Who initiates sanctions? (Marginalized groups vs. privileged mobs).  
       - Relative power: Sanctioning "up" (against institutions) vs. "down" (against vulnerable individuals).  
     - *Why*: A worker fired after viral outrage faces life-altering harm; a CEO facing a boycott does not.  
     - *Non-negotiable*: Power-blind theories entrench injustice.

  6. **Accumulation and Thresholds**  
     - **Must account for how discrete actions (individual tweets) aggregate into collective punishment.**  
     - *Why*: One critical tweet isn’t punishment; 10,000 may constitute harassment.  
     - *Non-negotiable*: Overlooked in "just ignore it" dismissals.

  7. **Rule of Rescue**  
     - **Sanctions must allow for redemption pathways unless the wrong is unforgivable (e.g., violent predation).**  
     - *Why*: Permanent exile destroys social fabric. *Test case*: Job dismissals without appeal.  
     - *Contested*: *Retributivists reject redemption; restorative justice advocates demand it.*

  8. **Epistemic Responsibility**  
     - **Sanctioners must verify facts and avoid "offense archaeology" (punishing ancient, context-bound acts by current norms).**  
     - *Why*: Basing sanctions on misrepresentations or decontextualized evidence is unjust.  
     - *Non-negotiable*: Truth-seeking is foundational.

  ---

  ### **The Central Tension: Fair Notice vs. Decentralization**  
  **Your suspicion is correct: Proportionality/Fair Notice and genuinely decentralized enforcement are incompatible.**  
  - **Fair Notice/Proportionality** requires predictable rules and consistent application (e.g., "this offense typically merits X").  
  - **Decentralization** means no central authority sets/enforces rules. Outcomes emerge chaotically from individual actions.  
  - *Result*: In decentralized systems, sanctions inevitably escalate (due to signaling, moral grandstanding, and low individual stakes). One person’s boycott is harmless; 100,000 cause ruin. Fair notice is impossible when rules are unwritten and applied retrospectively.  

  ---

  ### **Scorecard of Leading Positions**  
  | **Position**               | **Strengths**                                  | **Failures**                                               |  
  |----------------------------|-----------------------------------------------|-----------------------------------------------------------|  
  | **Libertarian**            | Upholds withdrawal of association.            | Ignores power asymmetry; treats all sanctions as "market forces." Fails proportionality (e.g., job loss for minor errors). |  
  | **Social Justice**         | Centers marginalized voices; validates self-protection. | Often conflates criticism/punishment; rejects fair notice as "tone-policing." Struggles with pile-on accumulation. |  
  | **Free Speech Absolutist** | Protects dissent.                             | Equates sanctions with state censorship; collapses self-protection into punishment. |  
  | **Restorative Justice**    | Prioritizes redemption; resists permanent exile. | Underenforced in decentralized systems; struggles with irredeemable acts. |  

  ---

  ### **Decision Flowchart for Joining/Resisting Sanctions**  
  Ask:  
  1. **Is the wrong verified?** (No → Resist).  
  2. **Is the sanction primarily self-protective?** (E.g., blocking a harasser → Join).  
  3. **Does the sanction fit the wrong?** (Career ruin for a bad joke → Resist).  
  4. **Who wields power?** (Marginalized group sanctioning an institution → Lean join; Online mob targeting an individual → Lean resist).  
  5. **Is redemption possible?** (If no pathway exists → Resist unless wrong is grave/ongoing).  

  This framework forces explicit tradeoffs—especially between *decentralized action* and *proportional outcomes*. In practice, prioritize resisting pile-ons (which lack accountability) and supporting targeted self-protection (e.g., boycotts led by affected communities). The irreconcilable tension means **no system achieves perfect fairness**, but applying these criteria minimizes capricious harm.
