prompt: |-
  I teach 10th-grade world history and I've just spent two weekends marking the plague-and-famine essays, and somewhere around essay forty I realized I'm applying no consistent rule at all about when a kid is allowed to blame a germ, a volcano, or the weather for something. My department is also rewriting this unit right now and I'm the one who has to stand up and defend whatever goes in the guide, so it's not just my red pen. Here's what I actually marked, and then the ask.

  Stuff I let stand, usually with a tick:

  - Black Death killed a third of Europe, and that's a big part of why serfdom loosened in the west. Tick.
  - Smallpox did more conquering in the Americas than any army ever did. Tick, and I told the kid it was the best sentence in the pile.
  - The 1815 eruption gave us the year without a summer, and that probably nudged a lot of New England farm families to give up and go west. Tick. (My brother-in-law is a geologist and he was insufferably pleased about this one.)
  - Drought was a major cause of the Maya collapse, though I made the kid add that drought is never the whole story, which is a cop-out and I know it.
  - Hurricane Katrina didn't destroy New Orleans, the levees did. Tick, and I underlined it.

  Stuff I marked down, and where the kid pushed back and I didn't have an answer:

  - The potato blight caused the Irish famine. No. I wrote in the margin that the blight was a blight and the famine was made by people, which the kid quite reasonably said was me being squeamish about a plain fact.
  - The drought in Syria caused the civil war. No, and I felt strongly about it, but when he said then why did you tick the volcano one I changed the subject.
  - The big geography-explains-everything essay (you know the one, the enormous book about why Europe won). Marked it down and couldn't tell her why, given I'd just praised the smallpox sentence, because both of them are saying nature decided it and I apparently only hate the second one.

  My half-theory, which I don't think survives contact: I think you can use nature to explain why things got worse for everybody — that's just microbes and physics doing their thing — but you can't use it to explain why one group ended up on top of another, because that's when you're letting somebody off the hook. Except that doesn't cover Ireland at all (nobody came out on top, everyone just got worse, and I still say no) and it doesn't cover Syria either. My colleague says it's really about whether anybody at the time had a real alternative, which sounds right until I try it on the Maya, where I have no idea who was supposed to have done otherwise.

  So: is there a principle here, or a small set of them? State it precisely enough that I could put it at the top of a marking rubric, and tell me which clause is doing the work in which case. Then tell me which of my verdicts it forces me to give up — if it's the smallpox tick or the Maya tick, say so straight, don't soften it. Give me two or three cases I haven't marked and tell me how the principle rules on them. And test my half-theory properly: repair it if it can be repaired, otherwise tell me to bin it.

  One thing I keep circling: does it matter whether a natural cause is being used to explain *when* something happened rather than *who* it happened to? Because I suspect that's what I'm actually doing when I'm being consistent, and I also suspect it's why the Ireland essay makes me angry — the blight explains the timing, and something else entirely explains who starved. And if the real answer turns out to be that my rule isn't about causes at all but about what the sentence is doing (absolving someone or not), then say that too, and tell me what it makes of the ticks — am I grading essays on truth or on intentions?

  Don't send me a reading list, I've got ninety essays left and I won't read it.
reasoning: |-
  Okay, let me tackle this teacher's dilemma. They need a clear principle to distinguish when natural causes can be credibly cited in historical explanations without falling into determinism or absolving human responsibility. 

  First, analyzing their marked examples: The approved ticks (Black Death, smallpox, Tambora eruption) all show nature triggering or accelerating existing social conditions. The rejected ones (Irish famine, Syria drought) use nature to obscure human agency in unequal suffering. The geography essay fails because it implies nature predetermined outcomes rather than interacting with choices.

  The core issue seems to be about causality chains: nature can be the spark, but the fuel is always social. My proposed principle would require students to:
  1) Specify the natural trigger
  2) Identify the social structures that amplified/vulnerabilized
  3) Never let nature explain differential impact

  Testing this on their cases:
  - Smallpox gets a tick because it correctly identifies differential immunity as the social amplifier
  - Maya drought passes if linked to water management failures
  - Ireland fails because it omits British policy as the reason starvation targeted the poor
  - Syria drought similarly ignores Assad's policies that turned drought into rebellion

  The half-theory about "making things worse" is salvageable if we add: nature makes things worse indiscriminately, but human structures decide who actually suffers. The volcano example works because it accelerated existing migration trends without creating new hierarchies.

  For new test cases:
  - "Dust Bowl caused Okie migration" - conditional tick if linked to farm subsidies favoring cash crops
  - "Tsunami caused Fukushima disaster" - cross out unless noting regulatory failures on seawalls

  This approach grades on argument structure, not just facts. The Ireland essay isn't wrong about blight - it's wrong about blight being sufficient explanation. That's why the smallpox sentence shines: it implies the real story (immunity disparity) in seven words.
answer: |-
  Here's a precise principle derived from your cases, tested against your examples, with clear clauses explaining why each ruling stands or falls. Your half-theory is partially salvageable but needs refinement.

  ### The Core Principle
  **Natural factors can explain *timing, scale, or triggering* of historical events, but never *differential human outcomes* without explicit linkage to preexisting societal structures, choices, or power imbalances. Outcomes affecting groups differently must always reference human agency.**

  #### Breakdown of Clauses:
  1. **"Explain timing, scale, or triggering"**: Nature can accelerate/initiate events when societal conditions create vulnerability.  
  2. **"Never differential outcomes without linkage"**: If harm/benefit falls unevenly, the explanation must show *how human systems converted natural events into inequality*.  
  3. **"Preexisting societal structures"**: The "why" of suffering/advantage lies in human-created systems (e.g., policies, economics, power hierarchies).

  ---

  ### Verdicts on Your Cases Using the Principle
  | **Your Case**                  | **Verdict** | **Why the Clause Applies**                                                                                                |
  |-------------------------------|-------------|---------------------------------------------------------------------------------------------------------------------------|
  | Black Death & end of serfdom  | **TICK** ✅ | Clause 1: Plague explains *scale* of labor shortage. Human agency (serfs negotiating rights) turns scarcity into change. |
  | Smallpox in Americas         | **TICK** ✅ | Clause 1: Germs explain *speed* of collapse. Clause 3 implied: Outcome relied on *differential immunity* (a biological fact exploited by colonizers). |
  | Tambora eruption → migration | **TICK** ✅ | Clause 1: Volcano explains *timing* of migration. Human choices (economic pressures, land hunger) made families *able* to move west. |
  | Maya drought                 | **TICK** ✅ | Clause 1: Drought explains *trigger*. You forced Clause 3: The "not whole story" note implies human failures (e.g., war, resource management). |
  | Katrina levees               | **TICK** ✅ | Explicitly rejects nature as cause, centers human engineering failures (Clause 3).                                        |
  | Potato blight → Irish famine | **CROSS** ❌ | Violates Clause 2: Blight explains timing/trigger, NOT why the poor starved while grain was exported. Missing link: British policy. |
  | Syria drought → civil war    | **CROSS** ❌ | Violates Clause 3: Drought explains rural unrest’s *timing*, NOT war. Missing link: Assad’s neglect of farmers, sectarian tensions. |
  | Geography "explains everything" | **CROSS** ❌ | Violates Clause 2: Geography might enable *options*, but it doesn’t explain *choices* (e.g., why Iberians colonized, not Ottomans). |

  ---

  ### Repaired Half-Theory
  Your instinct was right but misapplied. **Repair:**  
  *"Nature explains when/where crises happen; humans explain who suffers and who profits."*  
  - **Why it works:** Clarifies that material factors set the stage, but societal structures distribute pain/gain. Ireland’s blight hit potatoes (timing), but British policy decided Irish peasants starved while landlords exported grain (outcome). Syria’s drought displaced farmers (timing), but Assad’s repression and economic policies caused rebellion (outcome).  
  - **Why it failed before:** You focused on "everybody worse off" vs. "groups on top." But even "everybody worse off" (like Ireland) masks *unequal suffering*—which requires human explanation.

  ---

  ### New Cases Tested
  1. **"The Dust Bowl caused the Okie migration to California."**  
     - **Verdict:** ✅ **TICK** (with caveat).  
     - **Why:** Clause 1 (drought/wind explain *timing* of migration). *Requires addition*: "...but exploitative farm tenancy and bank foreclosures made smallholders destitute" (Clause 3).  

  2. **"Malaria slowed European colonization of Africa until quinine."**  
     - **Verdict:** ✅ **TICK**.  
     - **Why:** Clause 1 (disease explains *timing* of colonization surge). Clause 3 implied: Medical tech advantage exploited existing imperial ambitions.  

  3. **"The 2011 Thailand floods collapsed industrial supply chains."**  
     - **Verdict:** ❌ **CROSS** if standalone.  
     - **Why:** Violates Clause 2. Must add: "...because just-in-time manufacturing concentrated risk in low-lying areas for profit." (Clause 3).  

  ---

  ### What You Must Give Up
  - **The Maya tick stands**, but *only* with your "cop-out" note. Drought is a valid trigger, but you must force students to name a human factor (e.g., warfare, trade collapse) for the *collapse*.  
  - **The smallpox tick stays**. It implies the outcome relied on immunological disparity (a biological fact) *plus* European exploitation (human agency). If a student wrote "smallpox let Spain conquer," demand they specify *how* (e.g., "demoralized Incan leadership").  
  - **Bin the "absolving intentions" idea**. You’re grading *argument rigor*, not morality. The Ireland essay isn’t "squeamish"—it’s **incomplete** by omitting policy. The smallpox sentence works because it implies agency (conquistadors used biological advantage).  

  ### Final Rubric Line  
  **"When citing natural causes, students must:  
  a) Specify if it explains TIMING/SCALE/TRIGGER (e.g., ‘The eruption accelerated migration’);  
  b) If outcomes affected groups differently, IDENTIFY the human systems that made this possible (e.g., ‘Landowners exploited labor shortages’).  
  Omit (b) = incomplete explanation."**  

  This forces causality where it belongs: nature provides context, humans shape consequences. No reading list—just red pens and consistency.
