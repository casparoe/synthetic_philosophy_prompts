prompt: |-
  ok so I've been lurking on LessWrong and in the mech interp corners of the internet since forever, and I want to finally turn the endless "do neural nets actually have representations" thread into something you can actually settle instead of going in circles. So build me a decision tree / quiz for it.

  The thing I keep noticing is that everyone in these threads holds a different view but uses the same words, so a "which camp are you in" listicle is useless. Build the tree from the questions, not from the labels. Every branch node has to be a question someone can answer about a concrete case without already knowing which camp it drops them in. Leaves get the position name (or "unnamed" if it's a combo nobody defends) plus one line on the most uncomfortable thing that position has to swallow.

  Stuff that should show up somewhere as a node or a case:

  - Is there a fact of the matter about what a net represents, or does it depend on the level of description you pick? Press it with: two interp methods that both predict behavior perfectly but disagree about which units are "the" features. Is one of them wrong, or just a different coordinate system?
  - Does causal load-bearingness settle it? If patching or ablating a feature reliably moves the output, is that feature real, or just one intervention among many that happens to work? Include the nasty case where the effect is real but so is the effect of some gerrymandered alternative feature you cooked up.
  - Are features discovered or built? If two people train sparse autoencoders (SAEs) with different seeds and get different dictionaries that all work, what is the claim "the model has these features" even asserting?
  - Superposition. If a net stores way more features than it has dimensions, is the honest description "the features exist, just superposed" or "there's a big vector space and 'features' are a lossy readout we impose on it"?
  - The deflationary option: maybe the whole vocabulary (represents, believes, attends-to) is a stance we adopt because it predicts well, and asking whether it's "literally true" is a category error. Does that view have to give up on interp being a science, or not?
  - The hard eliminativist: nets are functions, "representation" is anthropomorphism, full stop. What's the strongest thing they have to explain away (steering vectors that transfer, probes that generalize, etc.)?

  Then tell me which positions this actually separates. I specifically want these to come out as distinct leaves if they really are distinct, and if some of them collapse into each other, say so and tell me which case could split them apart if any:
  - robust realism (features are the model's real computational parts)
  - causal-mechanistic realism (real iff it's load-bearing for behavior)
  - pluralism / no privileged basis (many equally good decompositions, "which one is real" is the wrong question)
  - instrumentalism / useful fiction (SAEs are tools, not maps)
  - the intentional-stance / real-patterns view
  - full eliminativism (no representations, period)

  Also flag any pair of leaves the tree can't split with the cases I gave. Dont paper over it, just say "these two answer every node the same, you'd need X to tell them apart."

  Two more things: (1) note the empty cells, the combos of answers the tree allows that I bet nobody actually holds, and say for each whether it's empty because it's incoherent, because it's unattractive, or just because nobody bothered. (2) No reading lists or citations, I'm not gonna chase papers, I just want the structure and where the real disagreements are. If a node is secretly doing the work of three different debates, split it and say why.

  Audience is smart but doesn't already know the labels, so no node can be phrased as "do you accept so-and-so's account of X."
reasoning: |-
  Hmm, I need to build a decision tree for settling debates about neural net representations. The user wants concrete questions that force distinctions without relying on jargon, and wants to see where existing positions land. Key pain points are superposition, multiple valid interpretations, and whether "real" is even the right question.

  First, I'll map the core disagreements. The "fact of the matter" question seems foundational - if we think there's one true decomposition, that leads to realism; if not, pluralism or instrumentalism. But I need to pressure-test this with cases like: two SAEs with different seeds that both reconstruct activations perfectly. If someone insists one is "correct," they're probably a robust realist. If they say both are valid coord systems, that's pluralism.

  Causal load-bearing is another crux. Take a steering vector that reliably changes output - is that proof of a "real" feature? But then introduce gerrymandered features (e.g., a random linear combo that happens to correlate with behavior when ablated). If someone still calls the steering vector real, they're likely causal-mechanistic realists; if they say neither is privileged, that leans pluralist.

  Superposition is tricky. Does "the net has 1000 features in 512 dimensions" mean features exist (just compressed) or that features are our invention? This might split robust realists (who accept superposition as implementation) from eliminativists (who see it as proof features aren't fundamental).

  The deflationary view needs careful handling. If someone says "representation talk is just predictive," do they deny science can study mechanisms? If yes, instrumentalism; if no, maybe intentional-stance (real patterns exist but are observer-dependent).

  Eliminativism must confront counterexamples like transfer learning. If probes work across contexts, is that evidence for representations? An eliminativist would have to explain this as emergent correlations, not intrinsic content.

  Now for position mapping:
  - Robust realism: Will say there's one true decomposition (rejecting plural SAEs as equally valid), believe superposed features are still real, think causal interventions reveal pre-existing structure.
  - Causal-mechanistic: Might accept multiple bases if causally equivalent, but draw line at gerrymandered features. Probably fine with superposition.
  - Pluralism: All about multiple valid descriptions. Will say gerrymandered features are "real" in some coord systems but not privileged.
  - Instrumentalism: "Real" is the wrong question - SAEs are tools, not truth-tracks. Might accept causal effects as useful without ontological commitment.
  - Intentional stance: Similar to instrumentalism but adds "real patterns" - representations exist as stable predictive clusters.
  - Eliminativism: Denies all representational talk. Must bite bullets on probes/steering vectors.

  Testing for collapses:
  - Pluralism vs intentional stance might agree on many nodes (e.g., no single fact of the matter, features are observer-relative). To split them, need a case where intentional stance demands patterns be projectible (e.g., a decomposition that works for prediction but isn't robust across models).
  - Causal-mechanistic and robust realism might both reject gerrymandered features. But robust realism demands unique decomposition; causal-mechanistic might not.

  Empty cells: 
  - "Believes in one true decomposition but denies causal load-bearing" seems incoherent - what would make it "true" if not causal structure?
  - "Thinks features are entirely constructed but also objectively real" - unattractive, as it's self-contradictory.

  Tree structure should start broad: first question forces the realism/anti-realism split via decomposition uniqueness. Then drill into causality and observer-dependence. Save superposition for later as it's subtler - it won't split eliminativists from realists alone, since both can accommodate it differently.

  Final leaf outputs must name positions and their "hardest pill" - e.g., robust realism must swallow that one SAE seed is "correct" while others are wrong; eliminativists must explain why probes work without representations.
answer: |-
  Here's a decision tree built from concrete, testable questions. Each branch point forces a choice about a specific case or scenario, avoiding labels until the end. Positions emerge from combinations of answers, and I'll note where positions collapse, which cases can't split them, and why some answer combinations are empty. The tree focuses on neural networks in vision or language tasks (e.g., GPT-style transformers or ResNets) for concreteness.

  ---

  ### **Decision Tree: Do Neural Nets Have "Representations"?**

  **Start Here:**  
  **Q1.** Suppose two different sparse autoencoders (SAEs) are trained on the same model's activations with different random seeds. Both reconstruct activations perfectly, predict behavior with identical accuracy, and have equally sparse features—but their learned feature dictionaries are totally different (e.g., no overlapping units). Is there a fact of the matter about which SAE captures the model's "real" features?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  **Q2.** You find a feature (e.g., a neuron, SAE unit, or attention head) that appears to "represent" something (e.g., "dog" or "syntax error"). When you ablate it, the model's output changes predictably (e.g., it stops recognizing dogs). But you can also design a *gerrymandered* feature (e.g., a random linear combination of units) that, when ablated, causes a similar output change. Is the original feature still "real" in a way the gerrymandered one isn't?  
  - **Yes, the original is uniquely real** → **Leaf 1: Robust Realism**.  
  - **No, both are just interventions** → **Leaf 2: Causal-Mechanistic Realism**.  

  **Q3.** When we say a feature "represents X," is this claim:  
  - **A description of a causal mechanism in the model** → Go to Q4.  
  - **A tool for predicting behavior, not a mechanism** → Go to Q5.  

  **Q4.** Consider superposition: a model with 512 hidden dimensions reliably encodes 1,000+ distinct features (verified via multiple probes/SAEs). Does this imply:  
  - **Features are real but compressed; superposition is an implementation detail** → **Leaf 3: Causal-Mechanistic Realism** (collapses with Leaf 2).  
  - **"Features" are lossy human summaries; only the vector space is fundamental** → **Leaf 4: Pluralism / No Privileged Basis**.  

  **Q5.** If using "representation" vocabulary (e.g., "neuron X represents edges") perfectly predicts model behavior across contexts, is this:  
  - **Enough to call it scientifically valid, even if it's not literal** → **Leaf 5: Intentional-Stance / Real-Patterns View**.  
  - **Just a useful fiction—it doesn't describe the model's intrinsic structure** → **Leaf 6: Instrumentalism / Useful Fiction**.  

  **Q6.** (If you answered "No" to Q1 and "Tool" in Q3) Can we fully explain phenomena like *steering vectors* (e.g., adding "happiness" vectors to change outputs) or *probes that generalize* (e.g., linear classifiers on activations that work on new data) without invoking "representations" at all?  
  - **Yes, it's all just statistics and functions** → **Leaf 7: Full Eliminativism**.  
  - **No, these show representations are unavoidable** → **Leaf 5: Intentional-Stance / Real-Patterns View** (loop back).  

  ---

  ### **Leaf Positions & Their "Hardest Pill"**
  1. **Robust Realism**  
     - *Position*: Features (e.g., SAE units) are the model's true computational parts. There's one "correct" decomposition.  
     - **Hardest pill**: Must accept that one SAE seed is "objectively real" while others—despite identical performance—are "wrong." Gerrymandered features are illusions.  

  2. **Causal-Mechanistic Realism** (Leaves 2 & 3 collapse)  
     - *Position*: Features are real iff causally load-bearing (ablation changes behavior). Superposition is fine.  
     - **Hardest pill**: Gerrymandered features that *reliably* affect output must be considered "real" if they pass causal tests.  

  3. **Pluralism / No Privileged Basis** (Leaf 4)  
     - *Position*: Many decompositions (SAEs, Fourier bases, etc.) are equally valid. "Real features" is a category error.  
     - **Hardest pill**: No fact of the matter about what the model "really represents"—even for human-aligned features like "dog."  

  4. **Instrumentalism / Useful Fiction** (Leaf 6)  
     - *Position*: Features are tools for prediction, not descriptions of reality. SAEs are like Fahrenheit vs. Celsius.  
     - **Hardest pill**: Must deny that interp reveals *how the model works*—it's just engineering.  

  5. **Intentional-Stance / Real-Patterns** (Leaf 5)  
     - *Position*: "Represents" is a stance that works if it predicts behavior. Features are "real patterns" if they project robustly.  
     - **Hardest pill**: A feature is "real" only if it helps *us* predict the model—no deeper truth.  

  6. **Full Eliminativism** (Leaf 7)  
     - *Position*: Nets are functions; "representation" is anthropomorphism. All feature-talk is shorthand.  
     - **Hardest pill**: Must explain steering vectors, probes, etc., as mere correlations without invoking "content."  

  ---

  ### **Where Positions Collapse & Why**
  - **Causal-Mechanistic Realism (Leaf 2 & 3) collapses**: Both answer Q2 with "No" (gerrymandered features are real if causal) and accept superposition as non-problematic.  
  - **Pluralism (Leaf 4) vs. Instrumentalism (Leaf 6)**: Split by Q3. Pluralism says features describe mechanisms (just many valid ones); Instrumentalism says they're *only* predictive tools.  
  - **Intentional-Stance (Leaf 5) vs. Pluralism/Instrumentalism**: Split by Q5/Q6. Intentional-Stance grants scientific validity to representations-as-patterns; others deny it's science.  

  **Unsplit pairs**:  
  - **Causal-Mechanistic Realism vs. Robust Realism**: Split by Q2 (gerrymandered features). If you reject gerrymandered features, you're Robust; if you accept them, you're Causal-Mechanistic.  
  - **Pluralism vs. Intentional-Stance**: Split by Q3. Pluralism is about mechanisms; Intentional-Stance is about prediction.  
  - **Eliminativism vs. others**: All others grant *some* validity to "representation," even if instrumental.  

  ---

  ### **Empty Cells & Why They're Empty**
  The tree has 4 answer combinations with no adherents:  
  1. **Q1=Yes → Q2=No** (Believes one true decomposition but accepts gerrymandered features as equally real): *Incoherent*. If there's one true decomposition, gerrymandered features can't be "real."  
  2. **Q1=No → Q3=Description → Q4=Features are real** (No privileged basis but features are literal): *Incoherent*. Denying a "fact of the matter" contradicts literal features.  
  3. **Q1=No → Q3=Tool → Q6=No** (Instrumentalist who thinks representations are unavoidable): *Unattractive*. Why call it a "fiction" if it's unavoidable?  
  4. **Q1=Yes → Q2=Yes but denies causal load-bearing**: *No adherents*. Robust realism requires causal grounding.  

  ---

  ### **What This Tree Resolves**
  - **Superposition** (Q4): Only tests if you reject unique decompositions (Q1=No) and care about mechanisms (Q3=Description). Realists accept it; Pluralists see it as evidence against "real features."  
  - **Causal load-bearing** (Q2): Splits realists who demand uniqueness (Robust) from those who accept multiple causal features (Causal-Mechanistic).  
  - **Features: discovered or built?** (Implicit in Q1/Q3): If discovered (Q1=Yes), realism; if built (Q1=No + Q3=Tool), instrumentalism.  
  - **Deflationary views** (Q5/Q6): Separates "useful fiction" (Instrumentalism) from "scientifically valid pattern" (Intentional-Stance).  
  - **Eliminativism** (Q6): Stands or falls on explaining probes/steering without representations.  

  **Weak spots**:  
  - Intentional-Stance and Pluralism could be conflated if someone thinks "real patterns" *are* mechanisms. The tree splits them via Q3 (mechanism vs. prediction).  
  - Eliminativism vs. Instrumentalism hinges on Q6: if you think steering vectors *force* representational talk, you can't be eliminativist.  

  This forces you to confront empirical cases (SAEs, ablation, superposition) to locate your view. Positions emerge from your answers, not preconceived labels.
