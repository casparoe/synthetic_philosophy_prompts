  The user wants me to either add constraints or accept the reductio. I won't add new rules—that'd betray the theory's spirit—so I'll lean into the idea that consciousness arises from the higher-order state's *intentional directedness*, not causal history. It's counterintuitive, yes, but I must own that. 

