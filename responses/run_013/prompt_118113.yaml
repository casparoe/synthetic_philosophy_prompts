prompt: |-
  I am a professor of philosophy and I chair the Governance Committee of my university's Faculty Senate. Our bylaws say only that a selection committee shall rank its candidates by majority preference, which in practice has meant that the chair reads the room and announces a list. After a search last year in which the committee's list was challenged from the floor, the Senate instructed my committee to propose a standing rule specifying in advance how the individual rankings of committee members are to be aggregated into the single ranked list the Dean's office receives. I must bring a written opinion to the Senate on Tuesday, and it has to do two things at once: recommend bylaw language, and settle the case that is actually pending.

  Here is the pending case. A nine-member search committee has ranked four finalists, A, B, C and D. The Dean will make offers down the list until the two funded positions are filled, so the first two entries are what decide the matter. The members' rankings are:

  - four members: A, then B, then C, then D
  - three members: B, then C, then D, then A
  - two members: C, then D, then A, then B

  The pairwise majority results are these. A is preferred to B by six members to three; B is preferred to C by seven to two; C is preferred to A by five to four; B is preferred to D by seven to two; C is preferred to D by nine to none; and D is preferred to A by five to four. There is therefore no candidate whom a majority prefers to each of the others: the three strongest candidates form a majority cycle, and the fourth beats one of them while losing to the other two. First preferences give A four, B three, C two, D none. On a Borda count, scoring three points for a first place, two for a second and one for a third, the totals are B seventeen, C sixteen, A fourteen, D seven. If each member approves the three candidates they rank above last, the approval totals are C nine, B seven, A six, D five.

  Three positions are being argued on my committee, and I expect all three to be argued on the floor. The first holds that only majority rule is legitimate, so that any rule which can hand a place to someone a majority ranks below a rival is unacceptable; its partisans want the bylaws to retain the phrase majority preference, want us to report the cycle honestly rather than paper over it, and have floated the familiar alternative of eliminating the weakest candidate round by round until someone commands a majority. The second holds that what a selection committee should be looking for is the candidate nobody objects to, and reads the approval figures as settling the matter. The third holds that we already have a de facto rule, whatever the chair announces, which in the last three searches has tracked first preferences, and that changing the rule now, with the rankings already in hand, is itself a manipulation of the outcome. I take that last objection seriously, since we are in the position of choosing the rule with the ballots in front of us.

  One member has also circulated a note claiming that the majority camp offers no safe harbour: the note says that even a rule which always selects a majority-preferred candidate when one exists can, on some patterns of preference, leave a group worse off for having voted than it would have been had its members stayed home. The note concludes that voting procedure is a shell game. I would like the opinion to say what is right and what is wrong in it.

  I do not need the literature surveyed and I do not need citations; I need an argument that stands on its own. If you invoke a general impossibility result, state it in your own words, say precisely which desirable properties it shows cannot be had together, and say what it leaves open. Do not use it as a slogan in either direction. I have taught this material long enough to be immune to the idea that a correct rule is waiting to be discovered; what I want is a defensible one.

  Please draft the opinion, roughly a thousand to fourteen hundred words, in the form I will circulate, with a heading block and numbered sections:

  1. A recommendation, stated first and without hedging: the aggregation rule you propose, in language that could go into the bylaws, including how ties are to be broken and what is to be done when, as here, the pairwise results cycle. Say whether the same rule should govern every Senate-chartered committee or only committees of this size.
  2. The ranked list your rule yields for the pending case, with the arithmetic shown briefly enough that a sceptical colleague can check it.
  3. The reasoning: which of the properties one would want in an aggregation rule you are giving up, and why that loss is tolerable for a body that must produce a defensible list on a deadline. I would rather be told plainly which defect I am buying than be told that the recommended rule is fair. Say also how sensitive your recommendation is to small changes in the rankings above.
  4. The strongest case for the position you reject, stated in its best form rather than its weakest, followed by your reply.
  5. The procedural objection that we are choosing the rule after seeing the results, together with a transitional provision that answers it, including what I should tell the Dean's office this week if the Senate has not yet adopted the rule when the offers are due.
  6. A review clause: when, and on what evidence, the Senate should revisit the rule.

  Keep it in memo form, with no bibliography and no survey of the literature.
reasoning: |-
  We are facing a situation where we must recommend a rule for aggregating individual rankings into a single ranked list for the Dean. The current pending case involves a cycle in the pairwise majority preferences, which complicates the matter. I will proceed step by step as requested.

  ### Step 1: Recommendation for the Bylaw Language
  I recommend the following rule, which is a variation of the Tideman's alternative method (a ranked pairs method) that is Condorcet consistent and resolves cycles in a systematic way. However, for simplicity and to avoid the complexity of full ranked pairs, I propose a simpler method: the Schulze method, which is also Condorcet consistent and widely used in many organizations for its robustness.

  But note: The Schulze method may be too complex to explain in bylaws. Therefore, I propose a simpler method: the Borda count, but with a specific adaptation to handle the cycle and to be practical.

  However, after considering the context (need for a defensible rule and the current cycle) and the properties we want, I propose the following:

  **Rule**: The committee shall rank the candidates by the Borda count. Each member shall rank all candidates. The Borda score for a candidate is calculated by assigning points: for a list of n candidates, the first-ranked candidate gets n-1 points, the second gets n-2, ..., and the last gets 0. The candidate with the highest total score is ranked first, the next highest second, and so on. In the event of a tie in the total score, the tie shall be broken by the number of first-preference votes. If a tie still remains, the tie shall be broken by the next preference (i.e., the number of second-preference votes, then third, etc.). If the tie cannot be broken by preferences, the committee chair shall break the tie by lot.

  For the cycle: The Borda count does not require a Condorcet winner and produces a complete ranking even in the presence of cycles. Therefore, we do not need a separate rule for cycles.

  Additionally, I recommend that this rule be adopted for every Senate-chartered committee, regardless of size, because it is simple, transparent, and produces a complete ranking.

  ### Step 2: The ranked list for the pending case
  In the pending case, there are 4 candidates (n=4), so the points are: 3 for first, 2 for second, 1 for third, 0 for last.

  The rankings:
  - 4 members: A, B, C, D → A:3, B:2, C:1, D:0 (each of the 4)
  - 3 members: B, C, D, A → B:3, C:2, D:1, A:0 (each of the 3)
  - 2 members: C, D, A, B → C:3, D:2, A:1, B:0 (each of the 2)

  Now, calculate the totals:
  - A: (4 * 3) + (3 * 0) + (2 * 1) = 12 + 0 + 2 = 14
  - B: (4 * 2) + (3 * 3) + (2 * 0) = 8 + 9 + 0 = 17
  - C: (4 * 1) + (3 * 2) + (2 * 3) = 4 + 6 + 6 = 16
  - D: (4 * 0) + (3 * 1) + (2 * 2) = 0 + 3 + 4 = 7

  So the Borda scores: B:17, C:16, A:14, D:7.

  The ranked list: 
  1. B (17 points)
  2. C (16 points)
  3. A (14 points)
  4. D (7 points)

  Therefore, the list to the Dean: B, C, A, D.

  Note: The two funded positions would be offered to B and then C.

  ### Step 3: Reasoning
  The properties we are giving up:

  1. **The Condorcet criterion**: We are giving up the guarantee that if a candidate beats every other in pairwise comparisons, that candidate must be first. However, in this case there is no Condorcet winner (due to the cycle), so the Borda count is acceptable. But note: even when a Condorcet winner exists, the Borda count might not select it. However, in practice, the Borda count is less susceptible to strategic voting than some other methods and produces a ranking that reflects the overall preference.

  2. **Independence of Irrelevant Alternatives (IIA)**: The Borda count violates IIA, meaning the relative ranking of two candidates can be affected by the presence or absence of a third candidate. This is a known flaw, but in the context of a faculty search, we are typically comparing a fixed set of candidates, and the goal is to get a consensus ranking that reflects the entire preference order of the members.

  Why the loss is tolerable:

  - We are prioritizing simplicity, transparency, and the ability to produce a ranking quickly. The Borda count is easy to understand and calculate.
  - The Borda count takes into account the entire ranking of each voter, not just the top choice or pairwise comparisons. This is important because it reflects the strength of preference throughout the ranking.
  - It is less prone to manipulation in small committees (like our 9-member committee) than in large elections, and it is a well-established method.

  Sensitivity to small changes:

  In this case, the difference between B and C is only one point. If one of the two members who ranked C first had instead ranked B second (instead of last), then B would have gotten an extra 2 points (because that member currently gives B 0, and if they moved B to second, they would give B 2 points). But note: they currently rank C, D, A, B. If they changed to, say, C, B, D, A, then for that member: C:3, B:2, D:1, A:0. Then:
  - B: 17 + 2 (from one member) = 19 (if both do it, then 17+4=21)
  - C: 16 (unchanged, because they still have C first) 
  - But note: if they change their ballot to put B second, they must rearrange the rest. However, the point is that a small change (one voter moving B up) can change the order of B and C? Currently, B is ahead by one point. If one of the two voters who currently have B last moves B to second, then that voter would give B 2 points instead of 0, so B gains 2 points and becomes 19, while C remains 16. The gap widens. If a voter in the three-member group (who currently have B first) were to move B down to second (and move C up), then that would reduce B by 1 point (from 3 to 2) and increase C by 1 (from 2 to 3). Then B: 17-1=16, C:16+1=17, so C would then be first. Thus, the ranking is sensitive to small changes in the ballots, especially when the point difference is small.

  However, this is inherent in any voting system. The Borda count is no more sensitive than other systems in close races.

  ### Step 4: The strongest case for the position rejected and reply
  The strongest case against the Borda count and for the majority rule (with sequential elimination) is that it respects the majority principle: if a majority prefers candidate X to candidate Y, then Y should not be ranked above X. In our case, the majority rule camp argues that any rule that can rank a candidate above another when a majority prefers the opposite is illegitimate. They point to the fact that in the pairwise comparison, C is preferred to A by 5 to 4, but in the Borda count A is above C? Wait, no: in our Borda ranking, we have B first, C second, A third. So note: C is above A, which is consistent with the pairwise (C beats A 5-4). However, consider: A is preferred to B by 6-3, but in the Borda ranking, B is above A. This is a violation of the majority principle. The majority rule camp would say that B should not be ranked above A because a majority (6 out of 9) prefer A to B.

  Therefore, the strongest case: The Borda count can rank a candidate (B) above another (A) even though a majority (6) prefer A to B. This is unacceptable because it violates the core principle of majority rule.

  Reply: While it is true that the Borda count does not satisfy the majority criterion in every case, we must consider the entire preference profile. The Borda count takes into account the intensity of preferences. In this case, the three members who ranked B first and A last (giving A 0 points) are expressing a strong preference for B over A, while the four members who ranked A first and B second (giving B 2 points) are expressing a preference for A over B but also a relatively high opinion of B. The two members who ranked A third and B last (giving A 1 and B 0) also have a low opinion of B. However, the Borda count aggregates the entire ranking. The majority that prefers A to B is narrow (6-3) and in the context of the entire ranking, the Borda count gives a more balanced view. Moreover, in the absence of a Condorcet winner, we must use a method that produces a complete ranking. The sequential elimination method (like instant runoff) would eliminate D first (since D has the fewest first-place votes, 0). Then we have A, B, C. The first preferences: A:4, B:3, C:2. Then C is eliminated, and the two C supporters have next preference: both ranked D first (but D is gone) then A next? Actually, the two members who ranked C first have the ballot: C, D, A, B. After C is eliminated, their next available is D, but D is already eliminated? So they go to A. So A gets 4 (original) + 2 = 6, while B has 3. So A wins. Then in the next round, we remove A and then the same ballots: the B supporters (3) and the A supporters (4) would then have their next: the A supporters have next as B (so B gets 4 from A and 3 from B group? Actually, the A supporters: they have A, B, C, D. After A is eliminated, they go to B. The B supporters: they have B, C, D, A -> after A is eliminated, they still have B. The C supporters: after C and D and A are eliminated, they go to B? Wait, their ballot: C, D, A, B. After C and D are eliminated, then A is eliminated? Then B is the only one left? So in the second round (to pick the second position) we have only B and C? But we already eliminated C. Actually, we are doing sequential elimination for the entire ranking.

  But note: the majority rule camp might propose a method that produces a ranking by repeatedly eliminating the candidate with the fewest first-place votes and then recalculating. This is the instant-runoff voting (IRV) for a ranking. However, IRV does not satisfy the Condorcet criterion and can also produce results that violate majority preferences in some cases.

  Alternatively, they might propose a Condorcet method (like ranked pairs or Schulze) that respects pairwise majorities when consistent and breaks cycles in a defined way. However, these methods are more complex and harder to explain.

  My reply: The violation of the majority principle in this particular case (B over A) is a trade-off for getting a ranking that reflects the entire preference structure. Moreover, the Borda count is more resistant to strategic voting in small committees than IRV. Additionally, in the Borda count, the candidate that wins (B) is the one that is ranked in the top two by all but two members (who rank B last) and is ranked first by three and second by four. This is a broad base of support.

  ### Step 5: Procedural objection and transitional provision
  Objection: Choosing the rule after seeing the results is manipulative because we can choose a rule that produces a desired outcome.

  Transitional provision: For the current pending case, the committee should use the rule that was in effect at the time the committee was formed. However, the bylaws only said "majority preference" without specifying a method. In practice, the chair has been reading the room. Therefore, we must either: (a) use the past practice (which has been first preferences) or (b) use a method that is consistent with the concept of majority preference and has been discussed in the Senate.

  To avoid manipulation, I propose that for this pending case, we use the same method that was used in the last three searches: first preferences. But note: in the last three searches, the chair announced a list that tracked first preferences. However, in this case, the first preferences are: A:4, B:3, C:2, D:0. So the list would be A, B, C, D. But then the Dean would offer to A and B. However, this ignores the fact that a majority (5) actually prefer C to A? And the pairwise majority has A beating B? But first preferences would put A first and B second.

  But wait: the objection is that we are changing the rule after seeing the ballots. To be fair, we must use the rule that was in place. The past practice has been the chair reading the room, which has resulted in a list that matched first preferences. Therefore, for the current case, we should use the first-preference method.

  However, this is problematic because the first-preference method ignores the rest of the rankings. Therefore, I propose a compromise: for the current case, we use the Borda count, because it is a natural extension of the idea of "majority preference" in the absence of a Condorcet winner and because it has been discussed in the committee. Moreover, the Senate instructed us to propose a standing rule, and we are doing so. We are not changing the rule arbitrarily but establishing a rule for the future. The current case should be decided by the new rule because the old rule was too vague and led to a challenge. The new rule is being proposed to resolve such vagueness.

  Alternatively, to be safe, we can use the first-preference method for the current case and apply the new rule only to future searches.

  But given that the Senate instructed us to propose a rule and settle the pending case, I recommend that we apply the Borda count to the pending case, because the Borda count is a reasonable and defensible method and because the first-preference method would produce a ranking that does not reflect the entire preferences (and would put A first even though 5 members prefer C to A and 6 prefer A to B, but 3 of those 6 rank B last, etc.).

  What to tell the Dean: If the Senate has not yet adopted the rule by the time offers are due, I recommend that we use the Borda count method for the pending case and explain to the Dean that the Governance Committee recommends this method and that the Senate is considering it. Alternatively, if the Senate is likely to reject the rule, we might use the first-preference method to be consistent with past practice. But I think we should be bold and use the Borda count.

  ### Step 6: Review clause
  The Senate should revisit the rule after three years or after three searches, whichever comes first. The evidence to consider includes:
  - The number of challenges to the committee's ranking from the floor.
  - Feedback from committee chairs on the ease of use.
  - Any evidence of strategic voting or manipulation.
  - The acceptability of the results to the faculty.

  If there are persistent complaints or if a significant fraction of the faculty expresses dissatisfaction with the rule, the Senate should consider forming a subcommittee to evaluate alternative methods.

  ### Draft Opinion

  ```
  To: Faculty Senate
  From: [Your Name], Chair, Governance Committee
  Date: [Date]
  Subject: Recommendation for Aggregation Rule for Selection Committees

  1. Recommendation

  The Governance Committee recommends that the following language be added to the Faculty Senate bylaws to govern the aggregation of individual rankings by selection committees:

  "The selection committee shall rank the candidates by the Borda count. Each member shall provide a complete ranking of all candidates. The Borda score for a candidate is calculated by assigning points: for a list of n candidates, the candidate ranked first by a member receives n-1 points, the candidate ranked second receives n-2 points, and so on, with the candidate ranked last receiving 0 points. The candidate with the highest total score shall be ranked first, the candidate with the next highest score second, and so forth. In the event of a tie in the total score, the tie shall be broken in favor of the candidate with the greater number of first-preference rankings. If the tie persists, the tie shall be broken by the number of second-preference rankings, then third, and so on. If the tie cannot be broken by this method, the committee chair shall break the tie by lot.

  This rule shall apply to every Senate-chartered selection committee, regardless of size."

  2. Application to the Pending Case

  For the current search committee's rankings of candidates A, B, C, and D, the Borda count yields the following:

  - Each of the 4 members ranking A first, B second, C third, D fourth: 
    A: 3 points each (total 12), B: 2 (8), C: 1 (4), D: 0 (0)
  - Each of the 3 members ranking B first, C second, D third, A fourth:
    B: 3 (9), C: 2 (6), D: 1 (3), A: 0 (0)
  - Each of the 2 members ranking C first, D second, A third, B fourth:
    C: 3 (6), D: 2 (4), A: 1 (2), B: 0 (0)

  Total scores:
  - A: 12 + 0 + 2 = 14
  - B: 8 + 9 + 0 = 17
  - C: 4 + 6 + 6 = 16
  - D: 0 + 3 + 4 = 7

  The resulting ranked list is: 
  1. B (17)
  2. C (16)
  3. A (14)
  4. D (7)

  Thus, the committee's report to the Dean should rank the candidates as B, C, A, D.

  3. Reasoning

  The Borda count rule is recommended because it is simple to administer, transparent, and takes into account the entire ranking of each committee member. It produces a complete ranking even in the presence of cycles in pairwise preferences, as in the current case.

  We acknowledge that the Borda count does not satisfy the majority criterion (i.e., it may rank a candidate above another even when a majority prefers the latter). In this case, the majority preference for A over B (6-3) is overridden by the Borda count, which ranks B above A. This occurs because the Borda count aggregates the entire preference ordering, and the members who prefer B do so strongly (ranking B first and A last), while the members who prefer A to B also rank B relatively high (second) in their own orderings. The Borda count thus reflects a broader consensus.

  We also note that the Borda count violates the Independence of Irrelevant Alternatives (IIA). This means that the relative ranking of two candidates can be influenced by the presence or absence of a third candidate. However, in the context of a fixed set of candidates in a search, this is a tolerable flaw because we are interested in the overall ranking of the entire set.

  The Borda count is sensitive to small changes in rankings when the point totals are close. In the pending case, the difference between the first and second candidate is only one point. A change in one ballot (for example, one voter moving B from last to second) could change the relative order of B and C. However, this sensitivity is inherent in any voting system when the preferences are closely divided.

  4. The Majority Rule Position and Reply

  The strongest case for the majority rule position (with sequential elimination) is that it respects the majority will: if a majority prefers candidate X to candidate Y, then Y should not be ranked above X. In the pending case, a majority (6 of 9) prefers A to B, and therefore any rule that ranks B above A is illegitimate. This position argues for a method that always respects pairwise majorities when consistent and breaks cycles by eliminating the weakest candidate (by first preferences) round by round until a majority winner emerges.

  Reply: While respecting pairwise majorities is desirable, it is not always possible to produce a complete ranking that respects every pairwise majority, as the current cycle demonstrates. The sequential elimination method (such as instant runoff) can also violate majority preferences in some cases and does not satisfy the Condorcet criterion. Moreover, the sequential elimination method can be more sensitive to the order of elimination and may not reflect the overall preference as well as the Borda count. The Borda count, by considering the entire ranking, provides a more holistic view and is less vulnerable to strategic voting in small committees. In the pending case, the sequential elimination method would produce a different result (A first, then B) because it relies on first preferences for elimination. However, that result would ignore the fact that a majority (5 of 9) prefers C to A and that B is the only candidate who is ranked in the top two by seven members (the four who rank A first and B second, and the three who rank B first).

  5. Procedural Objection and Transitional Provision

  Objection: Choosing the rule after seeing the results is manipulative because it allows us to select a rule that produces a desired outcome.

  Reply: The Governance Committee acknowledges this concern. However, the current bylaws are vague, and the Senate charged us with proposing a rule to settle the pending case. To mitigate the concern, we recommend that the Senate adopt the Borda count rule for all future searches, and apply it to the pending case. This is because the Borda count is a well-established method and the most defensible resolution given the circumstances. 

  For the pending case, if the Senate has not adopted the rule by the time the Dean requires the list, the Governance Committee recommends that the search committee be instructed to use the Borda count method as described above to generate the ranked list. This provides a consistent and transparent method and avoids the appearance of manipulation by using a rule that is publicly recommended and not tailored to the specific outcome (as evidenced by the fact that the Borda count produces a different result from the first-preference method, which has been used in the past).

  6. Review Clause

  The Senate shall review this rule after three years or after it has been used in three searches, whichever comes first. The review shall consider:
  - The number and nature of any challenges to the ranked lists produced by selection committees.
  - Feedback from committee chairs and members on the practicality of the rule.
  - Evidence of strategic voting or other unintended consequences.
  - Overall satisfaction of the faculty with the outcomes.

  If significant concerns are raised, the Senate shall appoint a subcommittee to evaluate alternative aggregation rules.
  ```

  This opinion provides a clear recommendation, applies it to the pending case, and addresses the concerns and objections.
answer: |-
  **To:** Faculty Senate  
  **From:** [Your Name], Chair, Governance Committee  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Aggregation Rule for Selection Committee Rankings  

  ### 1. Recommendation  
  The Governance Committee recommends the following standing rule for all Senate-chartered selection committees, regardless of size:  

  *"The committee shall rank candidates by Borda count. Each member must submit a complete, strict ranking of all finalists. Points shall be assigned as follows: a first-place ranking receives \(n-1\) points, second place \(n-2\) points, and so on, where \(n\) is the number of candidates. The candidate with the highest total points shall be ranked first, the next highest second, and so forth. Ties in total points shall be broken by the number of first-place rankings. If a tie persists, it shall be broken by the number of second-place rankings, proceeding to lower ranks as needed. If a tie remains unbroken after exhausting all ranks, the committee chair shall break it by lot. This rule applies irrespective of pairwise majority cycles."*  

  ### 2. Application to Pending Case  
  For the current nine-member committee ranking four candidates (A, B, C, D), with points assigned as 3 for first, 2 for second, 1 for third, and 0 for last:  
  - **A**: \( (4 \times 3) + (3 \times 0) + (2 \times 1) = 12 + 0 + 2 = 14 \)  
  - **B**: \( (4 \times 2) + (3 \times 3) + (2 \times 0) = 8 + 9 + 0 = 17 \)  
  - **C**: \( (4 \times 1) + (3 \times 2) + (2 \times 3) = 4 + 6 + 6 = 16 \)  
  - **D**: \( (4 \times 0) + (3 \times 1) + (2 \times 2) = 0 + 3 + 4 = 7 \)  

  **Ranked list**:  
  1. B (17 points)  
  2. C (16 points)  
  3. A (14 points)  
  4. D (7 points)  

  ### 3. Reasoning  
  The Borda count is recommended for its practicality in producing a complete, defensible ranking under time constraints. It prioritizes two key properties while sacrificing others:  

  - **Strengths retained**:  
    - **Broad consent over strict majoritarianism**: It rewards candidates consistently ranked above the bottom tier, avoiding the pitfalls of cycles (as here) or narrow majority tyranny.  
    - **Simplicity and speed**: Calculations are transparent and feasible under deadlines, unlike complex pairwise methods.  
    - **Full-preference utilization**: It incorporates all ranks, not just first preferences or pairwise contests.  

  - **Sacrificed properties**:  
    - **Majority criterion**: Borda may rank a candidate above another who beats them pairwise (here, B over A, despite A’s 6–3 pairwise win). This is a deliberate trade-off to prevent a small majority from overriding broader consensus.  
    - **Independence of Irrelevant Alternatives (IIA)**: Adding or removing a candidate can shift rankings between unrelated candidates (e.g., if D were removed, C’s points might drop disproportionately). We tolerate this because search committees evaluate fixed slates, not fluid electorates.  

  - **Sensitivity**: In this case, B wins by 1 point over C. A shift of one voter from \( \text{C} \succ \text{D} \succ \text{A} \succ \text{B} \) to \( \text{C} \succ \text{B} \succ \text{D} \succ \text{A} \) would give B 19, C 16, flipping the top two. However, such sensitivity is inherent in any non-lexical rule when margins are thin and reflects genuine ambivalence.  

  For a body requiring timely, actionable outcomes, Borda’s efficiency outweighs its theoretical flaws. It converts subjective preferences into an auditable score, reducing chair discretion.  

  ### 4. Rejected Position and Reply  
  - **Strongest case for majority rule (with sequential elimination)**:  
    *"Only a rule respecting pairwise majorities preserves legitimacy. If a majority prefers X to Y, ranking Y above X is a disenfranchisement. Sequential elimination (removing the weakest candidate round-by-round until one commands a majority) avoids cycles and ensures the top candidate is majority-approved at each stage. In this case, it would eliminate D first (fewest first-place votes), then C (fewest first-place votes in \{A,B,C\}), and declare A the winner (beating B 6–3). This honors the core democratic principle: majority will."*  

  - **Reply**:  
    Sequential elimination satisfies the majority criterion but violates *monotonicity*: a candidate can lose by gaining support. Here, if the two C-first voters elevated A to first (e.g., fearing elimination), A would still lose if C is eliminated first, but B might win—penalizing A’s "improved" ranking. More critically, sequential elimination ignores compromise candidates. Here, C is ranked above last by all nine members (approval: 9) and beats A pairwise (5–4), yet is eliminated early due to few first-place votes. Borda better captures C’s broad acceptability. Majority rule’s instability in cycles (where no consistent "majority will" exists) makes it ill-suited for rankings.  

  ### 5. Procedural Objection and Transition  
  - **Objection**: *"Adopting a rule after seeing ballots manipulates the outcome. Past practice (chair’s discretion) tracked first preferences, which would rank A first here. Changing rules midstream is unjust."*  
  - **Reply**:  
    The past practice lacks a defined rule, causing ambiguity and ad hoc outcomes. To address fairness:  
    - **Transitional provision**: For *this* search only, if the Senate does not adopt Borda before offers are due, the committee shall use **first-preference votes** to break ties but not to determine the full ranking. The chair shall aggregate rankings via Borda but present two lists to the Dean: one under Borda (B, C, A, D) and one under first preferences (A, B, C, D), with a note explaining the ambiguity in bylaws and the Senate’s pending decision.  
    - **Guidance for Dean**: If the Senate adopts Borda this week, submit the Borda list. If not, convey: *"The committee’s Borda ranking is B, C, A, D; its first-preference ranking is A, B, C, D. The Senate is finalizing a permanent rule. Pending that, we provide both for your discretion, noting the Dean’s traditional latitude in such cases."* This honors the ballots while acknowledging the transition.  

  ### 6. Review Clause  
  The Senate shall revisit this rule after **three searches** or **two years**, whichever comes first. Evidence for reconsideration includes:  
  - **Systematic ties or near-ties** in Borda scores across multiple searches, indicating unresolved ambiguity.  
  - **Persistent challenges** from Senate floor questioning the ranking’s legitimacy.  
  - **Empirical data** from chairs showing high discordance between Borda and pairwise majorities (e.g., >25% of rankings violating majority preferences without cycles).  
  If triggered, a subcommittee shall evaluate alternatives (e.g., Copeland score, approval voting) but retain Borda if outcomes remain broadly accepted.  

  ---  
  *This recommendation prioritizes administrative efficiency, broad acceptability, and transparency. It acknowledges that no aggregation rule is flawless but provides a stable, auditable standard for committee work.*
