  Here’s a focused, actionable research proposal tailored to your background, constraints, and core philosophical interest. It frames "weight" as a testable hypothesis about evidence robustness, acknowledges pitfalls upfront, and defines clear success/failure conditions.

  ---

  ### Research Proposal: **Reconstructing Keynes’s “Weight of Argument” as Evidence Robustness**

  #### 1. Core Question  
  *Can Keynes’s concept of the "weight of an argument" — distinct from probability — be formally reconstructed as a measure of the* robustness *of a probability judgment under variations in evidence sequencing or incremental evidence expansion, without relying on Keynes’s discredited logical theory of probability?*  

  **Definitive Answer Targets:**  
  - **Success:** A formal model where "weight" quantifies stability (e.g., low variance in probability assignments under evidence permutation/marginal additions) and demonstrably differs from existing measures like confidence intervals, entropy, or risk sensitivity.  
  - **Failure:** Weight reduces to an existing probabilistic concept (e.g., Bayesian variance, information entropy) or fails to provide practical insight beyond Keynes’s original examples.  

  #### 2. Why This Isn’t Settled by Existing Keynes Scholarship  
  Keynes’s "weight" (Chapter 6 of *A Treatise on Probability*) was dismissed for three overlapping reasons — but none directly address your robustness interpretation:  
  - **The collapse of logical probability:** Critics like Ramsey rejected Keynes’s view that probabilities are objective logical relations. Since weight was defined within this framework, it was discarded as collateral damage. *However:* Weight’s core intuition (evidence *breadth* vs. probability *strength*) doesn’t require logical probability.  
  - **Subsumption by decision theory:** Modern decision theory handles Keynes’s umbrella paradox (non-comparable probabilities) via incomplete preferences or ambiguity aversion. *But this sidelines weight:* Ambiguity focuses on *lack* of knowledge; weight tracks *accumulation* of relevant evidence regardless of probability shifts.  
  - **Operationalization failures:** Critics argued weight is redundant because "confidence" is captured by probability distributions (e.g., variance). *Crucially*, these assume probability is *already numeric*. Keynes’s non-numeric cases suggest weight operates where probabilities are unstable or qualitative — exactly where your robustness view applies.  

  **Your niche:** No systematic effort has reformulated weight as **evidence-sequence invariance** divorced from logical probability. This avoids the sunk cost of defending Keynes’s system while rescuing a compelling idea.

  #### 3. Methodology: A Yearlong Work Plan  
  *Guiding principle: Start simple, use computational simulations (leverage your skills), and pressure-test with paradoxes. Avoid historical exegesis — focus on conceptual reconstruction.*  

  | Month | Phase | Activities | Deliverables/Exit Criteria |
  |-------|-------|------------|----------------------------|
  | 1–2   | **Groundwork & Toy Models** | - Formalize Keynes’s key examples (umbrella paradox, insurance) as decision problems.<br>- Build minimal computational models (Python) simulating evidence sequences (e.g., adding testimony to a hypothesis).<br>- Test if probability variance under evidence permutation correlates with "intuitive weight." | Working codebase; explicit criteria for "robustness." |
  | 3–4   | **Contrast with Existing Concepts** | - Map Bayesian variance, information entropy, and ML calibration metrics onto your models.<br>- Identify cases where robustness diverges: e.g., high weight with low probability (insurance), or low weight with high probability (lottery tickets).<br>- Test if weight tracks *resilience to evidence order* or *sensitivity to small evidence additions*. | Table of conceptual distinctions; 2–3 cases where weight ≠ confidence/variance. |
  | 5–6   | **Formal Reconstruction** | - Define robustness mathematically (e.g., probability range across evidence permutations, convergence speed).<br>- Explore links to imprecise probability, Shafer-Dempster theory, or algorithmic information theory.<br>- Validate against Keynes’s claims: Does added evidence *always* increase weight? (Spoiler: Simulate counterexamples.) | Draft formalism; resolved tension with Keynes’s "always increases" claim. |
  | 7–9   | **Stress Testing** | - Apply robustness-weight to unsolved paradoxes: e.g., the "proof paradox" (massive evidence vs. one decisive proof), or statistical vs. testimonial evidence.<br>- Simulate "weight" in ML contexts (e.g., comparing a high-certainty model with little data vs. a noisy model with vast data). | Paper draft: "Weight as Robustness" with philosophical/technical implications. |
  | 10–12 | **Synthesis & Dissemination** | - Refine formalism; clarify why robustness isn’t epistemic utility or ambiguity.<br>- Prepare fellowship report + journal article (e.g., *Philosophy of Science* or *Synthese*). | Final paper; conference-ready presentation. |

  #### 4. Explicit Failure Modes & Mitigations  
  - **Collapse into existing concepts (Project-killing risk):**  
    - *If* weight always correlates perfectly with Bayesian variance, entropy, or confidence intervals in your simulations, it lacks novelty.  
    - *Mitigation:* Focus early on cases Keynes highlighted (non-numeric probabilities, sparse evidence) where standard metrics fail. Abandon if Month 4 shows consistent reduction.  

  - **Scope Creep/Time Failures:**  
    - *Risk 1:* Getting bogged down in formalisms (e.g., topology for evidence spaces). *Solution:* Stick to discrete/finite models; use computational approximations.  
    - *Risk 2:* Chasing probabilistic foundations (e.g., re-litigating logical probability). *Solution:* Treat probability as primitive; focus on evidence dynamics.  
    - *Risk 3:* "Robustness" proves too vague. *Solution:* By Month 3, operationalize it as (e.g.) max probability difference under evidence reordering.  

  - **Negative Result Value:** Even if weight collapses or resists formalization, documenting *why* answers a key question: "Is there a second dimension beyond probability?" A "no" is publishable.

  #### 5. Why This Fits the Fellowship  
  - **Cross-disciplinary leverage:** Uses CS (simulations, ML parallels) to reopen a philosophical blind spot.  
  - **Independent & feasible:** No archives needed — relies on conceptual analysis, modeling, and existing texts.  
  - **High risk/reward:** Either rescues a marginalized idea with modern tools, or conclusively buries it with new rigor.

  ---

  **Final note:** This proposal bets that "robustness under evidence perturbation" isolates weight’s core. If Keynes’s concept is more than that, your simulations will reveal it — and you’ll have a year of intriguing negative results. Either outcome justifies the fellowship.
