prompt: |-
  ok so I'm a backend engineer by trade, and I somehow talked my way into this small fellowship program for people coming into philosophy from other fields — it funds independent researchers for a year, and the application wants a two-page research proposal. I've been reading Keynes's probability book (the one from the 1920s, not the economics stuff) mostly because I got fixated on one move he makes. Everybody remembers the part about probabilities not always being numbers you can compare — like that bit where he's deciding whether to grab an umbrella and says it can be neither rational to take it nor rational to leave it. But the thing that grabbed me is a seperate idea he has, which he calls the "weight" of an argument: how much relevant evidence you've actually got backing a conclusion, over and above how probable the conclusion is. Roughly, his claim is that piling on new evidence can push the probability up or down but always increases the weight. My half-formed hunch is that "weight" got thrown out along with the rest of his logical theory of probability once people decided probability isn't a logical relation between propositions, and that this was a mistake — that there's a real, reconstructable notion hiding in there. Something like how robust or stable a probability judgement is when you imagine the same evidence arriving in a different order, or a little more of it, rather than just how likely the conclusion is. But I honestly can't tell if that's a genuine second dimension of uncertainty or if I've just reinvented "confidence in my estimate," which is a thing the ML calibration people I work with talk about constantly and which might already cover the whole territory.

  Can you turn this into the actual proposal? I need the question stated so that it has a definately determinate answer, an honest account of why the usual positions on Keynes don't already settle it (I have a feeling that dropping the logical-relation view took weight down with it, but please check my framing, I'm out of my depth here), and then the method — what I would actually do, month by month, given that I'm one person with a year and no special archive access. I especially want you to be straight with me about the failure modes: what result would show that "weight" just collapses into some notion we already have and there's nothing new, and what would count as the project turning out to be too big for the time I've got. Please don't put in any citations or a reading list, I'll bolt those on myself once I know what I'm actually arguing. American English, please.
