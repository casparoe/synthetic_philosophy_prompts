prompt: |-
  I'm taking a jurisprudence seminar this term and we've spent the last three weeks on statutory interpretation — textualism vs. purposivism, whether a judge follows what the words say or what the statute was trying to do. Last Tuesday someone raised the old scenario about the grandson who poisons his grandfather to speed up the inheritance, and the statute of wills on its face says the will stands, so a literal reading hands the money to the murderer. I said there's no way a court just reads it straight in a case like that, and my professor cut me off with "well, hard cases make bad law," and moved on, and like half the room nodded as if that settled it. I've heard that line a hundred times — from judges, from my uncle who watches alot of true crime, from people online — and I've never once been told what it actually asserts.

  So can you lay out for me the different precise claims that one sentence could be making? I want the full menu, from the readings so thin that nobody could disagree with them to the ones that are actually radical and contested, with a verdict on each — platitude, substantive but defensible, or just false. Please pay attention to where the thing is ambiguous in ways people don't notice: what counts as a "hard" case (morally hard for the judge, or just legally unsettled?), what "bad" means and bad for whom, and whether the claim is about this one decision, about the rule the decision lays down for later cases, about the reasoning in the opinion, or about the future litigants who'll come along and cite it. Then tell me which reading my professor was most likely leaning on when he used it to shut me down, and whether that reading actually gets him his conclusion — that the court has to apply the plain text and let the murderer inherit — or whether it only supports something mushier, like "courts should be cautious" or "the legislature should fix this."

  Lay it out as a numbered list I can bring to office hours, not one reading explained at length, cause I want to see the whole menu and then argue about which row he was on.
reasoning: |-
  Okay, the user is in a jurisprudence seminar focusing on statutory interpretation, specifically textualism versus purposivism. They discussed a scenario where a grandson poisons his grandfather to inherit, and the statute's plain text would let the murderer inherit. When the user argued that courts wouldn't just follow the text, the professor shut them down with "hard cases make bad law," and others nodded. The user is frustrated because this phrase is used often but never explained. They want a breakdown of the possible interpretations of that phrase, categorized by how defensible each is, along with ambiguities like what makes a case "hard" or "bad." They need this as a numbered list to bring to office hours for discussion.

  First, I need to parse the phrase "hard cases make bad law." The key ambiguities are: what constitutes a "hard" case? Is it morally disturbing, legally complex, or a novel situation? Then, what does "bad" mean? Does it refer to the rule being unjust, unpredictable, too broad/narrow, or something else? Also, who is affected? The parties in the case, future litigants, the legal system? The scope matters too: is it about the specific outcome, the rule created, the reasoning, or its future application?

  The user mentioned the grandfather-murderer scenario. In that context, the professor likely meant that the court should stick to the text despite the moral dilemma. But the phrase can be interpreted in multiple ways. I should list these interpretations, categorize them as platitude, defensible, or false, and note the ambiguities.

  Possible interpretations:
  1. **Platitude:** Trivial statements like "emotionally charged cases can lead to rushed decisions." This is obvious and non-controversial.
  2. **Defensible:** More substantive claims. For example, courts might distort legal principles to achieve a just outcome in one case, leading to bad precedent. This is a common concern in legal theory.
  3. **False/Contested:** Radical claims like courts should never consider justice in hard cases, leading to unjust outcomes. This is where textualism might be rigidly applied, as in the professor's example.

  The user wants to know which interpretation the professor was using and whether it actually supports the conclusion that the court must apply plain text. The professor's use seems to lean towards a defensible stance: that deviating from text for moral reasons creates bad precedent. But does that necessarily mean the court should always stick to the text? Not exactly—it might just caution against ad hoc decisions without legislative action.

  I recall the Riggs v. Palmer case where the court didn't let the murderer inherit, using equitable principles. So even in hard cases, courts sometimes avoid literal text. The phrase might warn against creating broad rules from such cases. The professor's point might be that the legislature should fix such loopholes, not the courts.

  The user needs a numbered list with each interpretation, its ambiguities, categorization, and whether it supports the professor's shutdown. They also want to know if the phrase actually mandates textualism or just suggests caution.

  Key points to cover:
  - Definitions of "hard": morally, legally, or circumstantially difficult.
  - Definitions of "bad": unjust, unpredictable, legally unsound.
  - Scope: outcome vs. precedent vs. reasoning.
  - Each interpretation's validity.

  Finally, the professor likely used a defensible interpretation that warns against distorting law for one case, but that doesn't necessarily mean courts must always follow plain text—it could imply the legislature should act. The user can argue that the phrase doesn't compel the outcome the professor suggested.
answer: |-
  Here's a breakdown of "hard cases make bad law" as a numbered list of interpretations, sorted from least to most substantive. Each entry includes the claim's core assertion, ambiguities resolved (what "hard" means, what "bad" means, and the scope of "law"), a verdict on its plausibility, and whether it supports your professor's shutdown of your point about the murderer grandson. Use this to map which "row" your professor was likely invoking.

  ### Ambiguity Key
  - **"Hard" Case**: Morally distressing (M), Legally ambiguous/unsettled (L), Factually extreme/novel (F)
  - **"Bad" Law**: Unjust outcome (U), Unpredictable/confusing precedent (P), Legally unsound reasoning (R), Overly broad/narrow rule (B)
  - **Scope**: Outcome in *this* case (O), Rule/precedent for *future* cases (F), Reasoning in the opinion (R), System-level effects (S)

  | # | Core Claim                                                                 | Ambiguities Resolved                        | Verdict & Why                                                                                                  | Supports Prof's Shutdown? (Murderer inherits) | Notes                                                                 |
  |---|----------------------------------------------------------------------------|---------------------------------------------|----------------------------------------------------------------------------------------------------------------|-----------------------------------------------|----------------------------------------------------------------------|
  | 1 | Emotionally charged cases (M) tempt judges to bend rules for "justice," risking arbitrary decisions (U in O). | Hard: M; Bad: U; Scope: O → F             | **Platitude**: Widely accepted; warns against unchecked judicial discretion.                                  | Weakly: Warns against deviation, but doesn't *require* textualism. | Non-controversial caution; doesn't address *how* to avoid "bending." |
  | 2 | Cases with legally novel facts (F) force courts to improvise rules, creating poor precedent (P/B in F). | Hard: F; Bad: P/B; Scope: F                | **Defensible**: Empirical (e.g., novel tech cases); justifies judicial minimalism/legislative deference.       | Partially: Favors textualism as stability-preserving. | Best fits common judicial usage (e.g., Scalia).                      |
  | 3 | Courts resolving morally hard cases (M) by deviating from text create legally incoherent precedents (R/P in F). | Hard: M; Bad: R/P; Scope: R → F            | **Defensible**: Riggs v. Palmer (1889) *avoided* this by using equity; but purposivism risks overreach.      | **Strongly**: Implies textualism prevents future "bad law." | Your prof likely here: "stick to text to avoid distorting doctrine." |
  | 4 | Any case where law and justice conflict (M/L) should be resolved by legislature; judicial fixes create bad law (U/P in S). | Hard: M/L; Bad: U/P; Scope: S              | **Substantive/Contested**: Assumes strict separation of powers; denies judicial equity role.                  | **Yes**: Directly says court *must* apply text; legislature fixes. | Radical textualist view; denies inherent judicial gap-filling.       |
  | 5 | Hard cases (L/F) expose textual flaws, but courts should *never* "fix" them—only legislature can make "good" law. | Hard: L/F; Bad: B/U; Scope: F → S          | **False/Contested**: Ignores centuries of common-law interpretation; unrealistic (e.g., Riggs).               | **Yes**: Demands strict textualism regardless of outcome. | "Bad law" = any judicial innovation; fringe originalist position.    |
  | 6 | Morally hard cases (M) *inevitably* produce bad law (U in O or P in F), so courts should avoid them. | Hard: M; Bad: U/P; Scope: O or F           | **False**: Riggs (murderer can't inherit) is celebrated; not all moral fixes create bad precedent.            | Weakly: Implies futility, not duty.            | Overgeneralizes; confuses outcome with reasoning.                    |
  | 7 | "Bad law" arises when courts prioritize case-specific justice (U in O) over rule integrity (P in F). | Hard: M/L; Bad: P; Scope: O vs F           | **Defensible**: Tradeoff is real; purposivism risks "exceptions" that erode rules.                            | Moderately: Favors textualism to protect systemic integrity. | Focuses on reasoning, not outcome.                                   |

  ### Analysis of Professor's Likely Position
  - **Most Probable "Row"**: **#3 or #4**. Your professor invoked the phrase to dismiss your claim that courts wouldn't apply the text literally. This suggests:  
    - "Hard" = **Morally distressing** (grandson-murderer).  
    - "Bad law" = **Legally unsound precedent** (if court deviates).  
    - Scope = **Future cases** (a ruling against the text might create unpredictable exceptions).  
  - **Does It Fully Support His Conclusion?**  
    - **#3** gets him *closer* but not all the way: It warns that deviating risks bad precedent, but doesn't prove courts *must* always obey plain text (Riggs didn't). It supports "caution," not absolutism.  
    - **#4** gets him there: Assumes courts lack authority to override text for justice, so murderer *must* inherit. But this is contested (even textualists use canons like "presumption against absurdity").  
  - **The Gap**: Neither reading *forces* the outcome "court must let murderer inherit." #3 implies courts should avoid distorting doctrine, but alternatives exist (e.g., narrow equitable exception). #4 demands it but relies on a radical separation-of-powers view. The phrase ultimately supports **judicial restraint**, not necessarily textualism. Legislative fix remains the fallback.

  ### Office Hours Strategy
  - **Ask**: "When you said 'hard cases make bad law,' were you warning that deviating from the text creates *legally incoherent precedent* (#3), or that courts *lack power* to override plain text (#4)?"  
  - **Counter**:  
    - If #3: "But in *Riggs*, the court deviated and created a **narrow equitable exception** ('no one profits from their own wrong'). That precedent isn't 'bad law'—it's widely accepted. Couldn't a court do that here without destabilizing wills law?"  
    - If #4: "Doesn't that assume legislatures *can* fix all gaps? What if they don't? And don't textualists use 'canons' (like absurdity) that effectively override text?"  
  - **Goal**: Force acknowledgment that the phrase is a **cautionary heuristic**, not a rule that compels textualism in extreme cases. Even Scalia conceded that "absurd results" justify deviation.
