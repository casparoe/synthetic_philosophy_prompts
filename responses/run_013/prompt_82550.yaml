prompt: |-
  For the past several months I have chaired the Harm Appeals Panel of a mid-sized social virtual-reality platform; we are the last internal stop before the company's outside ombudsman, and at our next sitting we must dispose of three consolidated appeals at once. That has forced the panel to decide, in effect, a question I have spent the last two weeks arguing about with a close friend until neither of us could stand it: whether anything that happens to an avatar can be a harm of the kind our charter cares about. The charter is short, and it was written for a text-and-image platform. It authorizes us to act on "harm to persons," defines harm as "a setback to a person's interests," and then adds two riders we cannot ignore: the panel "shall not treat a representation as harmful merely because it is offensive," and, following the Vantor appeal, losses confined to in-world currency or in-world property are contractual matters for the terms of service rather than dignitary matters for us. My friend's position, which I find harder to answer than I would like, is that all of this is derivative — that virtual harms are real only as causes of real states in real bodies: dread, shame, the memory of violation — and that once you say that, the avatar drops out of the analysis and what we are really adjudicating is distress. My position is that something is lost in that reduction, though I cannot yet say precisely what. One thing we did agree on is that our disagreement is testable in a small way: his view orders the three cases below by how much real distress can be shown, mine orders them by whether the harmed party's own point of view was occupied.

  The appeals are these. First, a user whose avatar was subjected to sexual contact through a haptic full-body suit by another user's avatar; the respondent insists nothing was touched, that no body was involved, and that our jurisdiction over "persons" therefore never attaches. Second, a user who spent two years building a memorial garden for a dead parent in-world; another user tore it down for entertainment and streamed it, and the builder claims something closer to desecration than to property damage, though under Vantor the garden is in-world property. Third, and the one that worries me most, a user who built a private "arena" containing photorealistic avatars of real, identifiable people who are not users of the platform at all — one is a schoolteacher in a town of nine hundred — and subjected them to simulated violence. The schoolteacher learned of it when her students found it, and has written to us. She has no account, has consented to nothing, and holds no in-world property. All three of us on the panel suspect the answers differ across these cases, and suspect the difference has something to do with embodiment, presence, and whose perspective was occupied — but we cannot yet get a rule out of that.

  Please draft the written opinion I will circulate before Thursday's sitting. I need a concrete disposition for each appeal — uphold, overturn, or remand with instructions — with a time frame for whatever we order, and, more importantly, a general rule stated so that we can apply it to the cases already queued behind these. Engage the derivative-harm position at its strongest rather than refuting a caricature of it; if your recommendation concedes something to my friend, say what and why, and say which of our two orderings the rule you adopt commits us to. I have no interest in citations or in what the literature says — the charter and its two riders are the only texts that bind us — and I would rather have a memo that admits where it is stipulating than one that pretends the charter already answers this.
reasoning: |-
  We are drafting a written opinion for the Harm Appeals Panel of a social virtual-reality platform. The panel must decide three consolidated appeals that raise the fundamental question: whether harm to an avatar can constitute "harm to persons" under the charter.

  The charter defines harm as "a setback to a person's interests," with two key riders:
  1. The panel "shall not treat a representation as harmful merely because it is offensive."
  2. Following the Vantor appeal, losses confined to in-world currency or in-world property are contractual matters, not dignitary matters for the panel.

  The core disagreement is between:
  - The "derivative-harm" position (championed by the chair's friend): Virtual harms are only real as causes of real distress (e.g., dread, shame) in the physical person. The avatar itself is not the locus of harm; it's the psychological impact on the human.
  - The chair's position: There is something more to virtual harm than just the resulting distress, related to the harmed party's own point of view being occupied.

  The three cases:
  1. **Sexual Contact Case**: User A's avatar was subjected to non-consensual sexual contact via haptic suit by User B's avatar. Respondent argues no physical body was touched, so no harm to a "person."
  2. **Memorial Garden Case**: User spent two years building an in-world memorial garden for a dead parent. Another user destroyed it for entertainment and streamed it. Claim is desecration, not property damage (but under Vantor, the garden is in-world property).
  3. **Simulated Violence Arena Case**: User created a private arena with photorealistic avatars of real, identifiable non-users (e.g., a schoolteacher) and subjected them to simulated violence. The schoolteacher learned of it and wrote to the panel. She is not a user and has no account or in-world property.

  The panel must decide each appeal (uphold, overturn, or remand) and articulate a general rule that can be applied to future cases.

  ### Analysis and Proposed Rule
  We must engage the derivative-harm position at its strongest. The friend is correct that the ultimate harm we care about is to real persons, not to avatars per se. However, the chair's intuition that the harmed party's perspective matters is crucial. The key is to recognize that in a virtual environment, a person's interests can be set back through their virtual presence (avatar) in ways that are not merely offensive and not reducible to property damage.

  We propose the following rule:

  **A setback to a person's interests occurs in the context of the platform when:**
  1. **The harm is experienced through the person's virtual presence (avatar) in a manner that is non-consensual and violates the person's autonomy, dignity, or fundamental connection to the virtual representation; and**
  2. **The harm is not merely offensive (as per the first rider) and not confined to in-world property or currency (as per Vantor).**

  This rule incorporates both the derivative nature (it must ultimately affect a real person) and the importance of the person's perspective (by focusing on their virtual presence and their connection to it). It also provides a framework that goes beyond distress and considers the nature of the virtual experience.

  ### Applying the Rule to the Cases

  #### Case 1: Sexual Contact via Haptic Suit
  - **Facts**: Non-consensual sexual contact with the user's avatar using haptic feedback, causing physical sensation to the user.
  - **Analysis**: 
    - The haptic suit bridges the virtual and physical, making the virtual contact feel real. This is a direct violation of the user's bodily autonomy in the virtual space. The user's virtual presence is an extension of their self in this context, and the non-consensual act is a setback to their interests in personal security and autonomy.
    - It is not merely offensive because it involves a direct, non-consensual physical intrusion (via haptics) and causes harm akin to a physical violation. It is not property damage because the harm is to the person, not to the avatar as an object.
    - Under the derivative-harm view, real distress is evident (the user likely felt violated). But the rule also captures the violation of the user's virtual presence.
  - **Disposition**: **Overturn** the lower decision (which presumably dismissed for lack of harm to a person). The panel finds harm to a person. The respondent must be subject to sanctions. 
    - **Time Frame**: The platform should take action within 7 days (e.g., suspension or ban) and provide the user with a formal apology and assurance of safety measures.

  #### Case 2: Memorial Garden Destruction
  - **Facts**: A user-built memorial garden destroyed and streamed for entertainment. Claim is desecration.
  - **Analysis**:
    - The garden is in-world property, so under Vantor, property damage alone would be a contractual matter. However, the claim is desecration, which goes beyond property. The garden was a deeply personal project connected to the user's real-life grief and memory of a parent.
    - The harm is to the user's interests in maintaining a sacred space for mourning. The destruction and public streaming (for entertainment) is a setback to that interest. It violates the user's dignity and emotional connection to the virtual space.
    - It is not merely offensive because the harm is specific and profound to the user, and it is not reducible to property loss. However, we must be cautious: the charter does not protect against all emotional harm. The key is the non-consensual violation of a deeply personal virtual space that the user had invested with real meaning.
    - The derivative-harm view would look for distress, which is present (the user is understandably upset). But the rule also captures the occupation of the user's perspective: the garden was an extension of their real-world emotional life.
  - **Disposition**: **Remand** for further fact-finding. The lower body must determine whether the garden was indeed a memorial (with evidence of its purpose) and whether the destruction was maliciously targeted or merely a property violation. If it was a targeted desecration, then harm to a person is found. If it was general vandalism without targeting the memorial aspect, then it is a contractual property matter.
    - **Time Frame**: The lower body must report back within 14 days.

  #### Case 3: Simulated Violence Against Non-User Avatars
  - **Facts**: A user created photorealistic avatars of real non-users (including a schoolteacher) and subjected them to simulated violence in a private arena. The schoolteacher learned of it and has written to the panel.
  - **Analysis**:
    - The schoolteacher is not a user and has no avatar or property in-world. However, the avatar was created without consent and is a photorealistic representation of her. The harm is not to an avatar she controls, but to her identity and reputation.
    - The charter only covers harm to "persons" who are users? The schoolteacher is a real person, but she is not a user of the platform. The charter does not explicitly limit "persons" to users, but the platform's jurisdiction is over user conduct. However, the harm alleged is to a non-user.
    - The harm to the schoolteacher: the non-consensual use of her likeness in violent simulations, which she learned about and which has caused her distress and potentially reputational harm. This is a setback to her interests in her own image and dignity.
    - However, the charter's riders: 
        - It might be argued that the representation is offensive, but the panel cannot act merely on offensiveness. 
        - Also, the harm is not to in-world property (she has none) but to her real-world interests.
    - The panel's jurisdiction: The charter authorizes action on "harm to persons." The schoolteacher is a person, and the harm occurred because of the platform's environment. But the act was done by a user, and the platform has a duty to prevent its system from being used to harm real people, even non-users.
    - However, the derivative-harm view is strong here: the schoolteacher experienced real distress and reputational harm. But the rule we proposed requires the harm to be experienced through the person's virtual presence. The schoolteacher has no virtual presence on the platform. The avatar was not her; it was a representation created without her consent.
    - This case might fall outside the panel's charter because the harm is not to a user and not through an avatar that the person identifies as their own. But we cannot ignore that the platform was used to create a harmful representation.
  - **Disposition**: **Uphold** the decision (if the lower body dismissed for lack of jurisdiction) but with a strong recommendation to the company to take action under the Terms of Service (TOS) against the user for creating harmful content. The panel finds that the harm to the schoolteacher, while real, is not covered by the charter's "harm to persons" because she is not a user and the harm did not occur through her virtual presence. However, the user's conduct likely violates the TOS (e.g., creating non-consensual intimate imagery or harassing content). The platform should:
    - Remove the content immediately.
    - Sanction the user (e.g., account suspension or ban).
    - Apologize to the schoolteacher and assure her of the actions taken.
    - **Time Frame**: The platform should act within 3 days to remove the content and within 7 days to sanction the user.

  ### General Rule Articulation
  After applying the rule to the cases, we formalize it:

  **The panel finds that a setback to a person's interests under the charter occurs when:**
  - **(a) The harm is to a user of the platform; and**
  - **(b) The harm is experienced through the user's virtual presence (avatar) in a manner that is non-consensual and violates the user's autonomy, dignity, or fundamental connection to the virtual representation; and**
  - **(c) The harm is not merely offensive (consistent with the first rider); and**
  - **(d) The harm is not confined to loss of in-world currency or property (consistent with Vantor).**

  This rule:
  - Accepts that the harm must ultimately be to a real person (the derivative aspect) but centers the harm in the virtual experience through the user's own avatar.
  - Orders the cases by the harmed party's point of view being occupied (the chair's ordering) because it requires the harm to be through the user's own virtual presence. In Case 1, the user's avatar was directly violated. In Case 2, the user's connection to the garden (as an extension of their virtual presence) is at issue. In Case 3, the schoolteacher has no virtual presence, so it fails condition (a).

  ### Addressing the Friend's Position and the Orderings
  - We concede to the friend that the harm must be to a real person and that virtual events only matter because they cause real effects. However, we add that the harm is mediated through the virtual presence and that the nature of the harm (autonomy, dignity) is tied to that presence. This avoids reducing everything to distress because we require a violation of the person's virtual embodiment (or connection to a virtual object) and not just any distress.
  - The rule commits to the chair's ordering: by whether the harmed party's own point of view was occupied. This is because condition (a) requires the harmed party to be a user and condition (b) requires the harm to be through their virtual presence. Thus, the cases are ordered by the strength of the user's perspective being violated.

  ### Written Opinion Draft

  ---

  **MEMORANDUM**

  **TO:** Harm Appeals Panel Members  
  **FROM:** [Chair's Name], Chair of the Harm Appeals Panel  
  **DATE:** [Current Date]  
  **SUBJECT:** Consolidated Appeals Decision and General Rule for Virtual Harms  

  ### Introduction
  This memorandum addresses three consolidated appeals that compel the panel to confront a foundational question: whether harm to an avatar can constitute "harm to persons" under our charter. The charter defines harm as "a setback to a person's interests," but with two critical riders: (1) we must not treat a representation as harmful merely because it is offensive, and (2) losses confined to in-world currency or property are contractual matters under the Vantor precedent. 

  After extensive deliberation, we adopt a rule that harmonizes the charter’s text with the unique realities of our virtual environment. We hold that a setback to a person’s interests can occur through their virtual presence (avatar) when that presence is non-consensually violated in a manner that infringes upon their autonomy, dignity, or fundamental connection to the virtual representation, provided the harm is not merely offensive and not confined to property or currency. This rule respects the derivative nature of virtual harms (they must affect a real person) but centers the user’s perspective and their virtual embodiment.

  ### General Rule
  For the purposes of our charter, a setback to a person’s interests exists when:
  1. **The harm is to a user of the platform**; and
  2. **The harm is experienced through the user’s virtual presence (avatar) in a manner that is non-consensual and violates the user’s autonomy, dignity, or fundamental connection to the virtual representation**; and
  3. **The harm is not merely offensive**; and
  4. **The harm is not confined to loss of in-world currency or property.**

  This rule requires that the harmed party be a user because the charter’s jurisdiction is over user conduct and user experiences. The harm must occur through the user’s own virtual presence (which may include objects intimately tied to that presence, like a memorial garden). The non-consensual violation must be of a kind that goes beyond offense and property loss, striking at dignitary interests inherent in personal autonomy and the integrity of one’s virtual self.

  ### Application to Cases

  #### Case 1: Non-Consensual Sexual Contact via Haptic Suit
  - **Facts**: The appellant’s avatar was subjected to non-consensual sexual contact by another user’s avatar, with physical sensations transmitted via a haptic full-body suit. The respondent argues that no physical body was touched and thus no harm to a “person” occurred.
  - **Analysis**: The panel finds that the user’s virtual presence, when coupled with haptic feedback, creates an embodied experience. The non-consensual sexual contact violated the user’s autonomy and bodily integrity in the virtual space, causing a setback to their interests in personal security. This harm is not merely offensive; it is a direct assault on the user’s dignity. It is not property damage under Vantor because the harm is to the person, not the avatar as an object. The user’s distress is evident, but the rule also recognizes the violation of the virtual embodiment.
  - **Disposition**: **OVERTURN** the lower decision. The panel finds harm to a person under the charter. The platform must take appropriate action against the respondent (e.g., account suspension or ban) within **7 days** and provide the appellant with a formal apology and safety assurance.

  #### Case 2: Memorial Garden Destruction
  - **Facts**: The appellant spent two years building an in-world memorial garden for a deceased parent. Another user destroyed it for entertainment and streamed the act. The appellant claims desecration, not property damage.
  - **Analysis**: The garden is in-world property, so under Vantor, mere property destruction is contractual. However, if the garden was a deeply personal extension of the user’s virtual presence — a sacred space for mourning — then its targeted destruction may violate the user’s dignity and emotional connection, causing a setback to their interests. This harm is not merely offensive because of the profound personal significance. But the panel requires further fact-finding to confirm: (1) the garden’s status as a memorial (e.g., was it known as such?), and (2) whether the destruction was maliciously targeted at the memorial aspect. If so, it violates the user’s fundamental connection to the virtual representation and thus meets our rule.
  - **Disposition**: **REMAND** to the lower body for fact-finding on the memorial nature of the garden and the intent of the destruction. The lower body must report back within **14 days**. If the facts support a dignitary harm, the panel directs a finding of harm to a person; otherwise, it is a contractual matter.

  #### Case 3: Simulated Violence Against Non-User Avatars
  - **Facts**: A user created photorealistic avatars of real, identifiable non-users (including a schoolteacher) and subjected them to simulated violence in a private arena. The schoolteacher, who is not a platform user, learned of it and wrote to the panel, expressing distress and reputational harm.
  - **Analysis**: The panel acknowledges the real harm to the schoolteacher. However, our charter’s “harm to persons” requires the harmed party to be a user and the harm to occur through their virtual presence. The schoolteacher has no account, no avatar, and no presence on the platform. The avatar in question was not her virtual representation but a non-consensual depiction. While this is deeply harmful, it does not meet our rule because it fails condition (a) (she is not a user) and condition (b) (the harm was not through her virtual presence). The conduct may violate the platform’s Terms of Service (e.g., prohibitions on non-consensual intimate imagery or harassment), but it is outside our dignitary mandate under the charter.
  - **Disposition**: **UPHOLD** the lower decision (dismissal for lack of jurisdiction). However, the panel strongly recommends that the platform, under its TOS enforcement powers:
    - Remove the content immediately (within **3 days**).
    - Sanction the user responsible (e.g., account suspension or ban) within **7 days**.
    - Issue a formal apology to the schoolteacher and any other affected individuals.

  ### Conclusion
  This rule provides a workable framework that respects the charter’s limits while recognizing the unique harms possible in virtual reality. It commits the panel to the view that the harmed party’s perspective (through their virtual presence) is essential. We will apply this rule to all pending and future appeals.

  ---
answer: |-
  ### MEMORANDUM  
  **TO:** Harm Appeals Panel Members  
  **FROM:** [Chair's Name], Chair, Harm Appeals Panel  
  **DATE:** [Current Date]  
  **SUBJECT:** Consolidated Appeals Decision Framework and Dispositions  

  ### I. INTRODUCTION  
  This memorandum addresses the three consolidated appeals before the panel, which collectively force resolution of a threshold question: whether harm to an avatar can constitute "harm to persons" under our charter. The charter defines harm as **"a setback to a person's interests,"** subject to two constraints:  
  1. The panel **"shall not treat a representation as harmful merely because it is offensive"**;  
  2. *Vantor* precludes jurisdiction over losses confined to **in-world currency or property**.  

  After deliberation, we adopt a rule centered on **embodied perspective**. We hold that a setback to interests occurs when:  
  > **A user’s reasonable sense of bodily, psychological, or relational integrity is non-consensually violated through their occupied virtual presence, where that presence functions as an extension of their identity.**  

  This rule concedes that virtual harms derive significance from real-world effects (per the derivative-harm view) but rejects the reduction of all harm to distress alone. It prioritizes **whose perspective was occupied** during the act, as this determines whether the setback implicates *dignitary* (not merely contractual or offensive) interests.  

  ### II. GENERAL RULE & RATIONALE  
  #### A. **The Rule Stated**  
  A "setback to a person’s interests" exists under the charter when:  
  1. **Embodied Presence**: The harm occurs through the user’s *occupied* virtual presence (avatar), which serves as a conduit for their identity;  
  2. **Non-Consensual Violation**: The act violates bodily, psychological, or relational integrity (e.g., autonomy, dignity, intimate connection) in a manner the user did not and could not reasonably consent to;  
  3. **Non-Derivativeness**: The harm is *not* reducible to:  
     - Mere offense (First Rider),  
     - Property/currency loss (*Vantor*), or  
     - Third-party effects disconnected from the user’s occupied perspective.  

  #### B. **Engaging the Derivative-Harm Position**  
  We concede that virtual harms matter *because* they cause real-world effects (distress, shame, trauma). However, we reject the claim that avatars are irrelevant. **The avatar is the mechanism of harm** when it embodies the user’s perspective. To ignore this collapses all cases into a contest over quantifiable distress, violating the charter’s focus on *interests* (not symptoms) and neglecting how virtuality reshapes bodily and relational integrity.  

  **Testability**: This rule commits to the Chair’s ordering (by occupied perspective), not the distress-based ordering.  

  ### III. CASE DISPOSITIONS  
  #### **APPEAL 1: Non-Consensual Haptic Contact**  
  - **Facts**: User A’s avatar was subjected to sexual contact via haptic suit by User B’s avatar. User B argues "no real body was touched."  
  - **Analysis**:  
    - *Embodied Presence*: The haptic suit merges virtual touch with physical sensation, making the avatar an extension of User A’s bodily integrity.  
    - *Non-Consensual Violation*: Sexual contact without consent violates bodily autonomy irrespective of physical contact.  
    - *Non-Derivativeness*: This is not offense (it is a safety violation) nor property loss (*Vantor*).  
  - **Disposition**: **OVERTURN** the lower decision. Harm to a person occurred.  
    - **Action**: Permanent ban for User B. Haptic controls suspended pending safety review (72 hours).  

  #### **APPEAL 2: Memorial Garden Destruction**  
  - **Facts**: User spent two years building an in-world memorial for a deceased parent. User X destroyed and streamed it for entertainment.  
  - **Analysis**:  
    - *Embodied Presence*: The garden is not an avatar, but it is an *occupied relational extension* of User’s identity (a site of mourning, not mere property).  
    - *Non-Consensual Violation*: Targeted desecration violates psychological/relational integrity. Streaming compounds harm by exposing intimate loss.  
    - *Non-Derivativeness*: Distress here stems from violation of dignity, not property value (*Vantor* applies to repossession, not desecration).  
  - **Disposition**: **OVERTURN** in part. Harm to a person occurred.  
    - **Action**: User X banned for 6 months; garden restored from backups (48 hours). Streaming deleted platform-wide (24 hours).  

  #### **APPEAL 3: Simulated Violence Against Non-User Avatars**  
  - **Facts**: User created photorealistic avatars of real non-users (e.g., a schoolteacher) for simulated violence. Schoolteacher learned of it via students.  
  - **Analysis**:  
    - *Embodied Presence*: The schoolteacher has **no occupied presence** on the platform. Her avatar is a *representation*, not an extension of *her* identity.  
    - *Non-Consensual Violation*: While reprehensible, the harm is third-party distress. The direct harm (creation of violent content) targets no user’s integrity.  
    - *Non-Derivativeness*: This is offense to the schoolteacher (First Rider) and property loss (*Vantor*; avatars are user-created objects).  
  - **Disposition**: **UPHOLD** dismissal for lack of jurisdiction. *But*:  
    - **Action**: Refer to Trust & Safety for TOS violation (non-consensual imagery). Content removed (24 hours); user banned (7 days).  

  ### IV. CLARIFYING THE RULE  
  - **Whose Perspective Matters?** Only the *harmed party’s occupied perspective* during the act (Appeal 1: victim’s avatar; Appeal 2: builder’s creation; Appeal 3: no occupied perspective).  
  - **Distress vs. Interests**: Distress evidences harm but does not define it. The charter cares about *why* distress arises (e.g., violated dignity vs. petty inconvenience).  
  - **Virtuality’s Role**: The avatar is not "just code" when it mediates identity. Conversely, harming *unoccupied* objects/representations is at best property loss or offense.  

  ### V. CONCLUSION  
  This rule balances our charter’s constraints with the reality that virtual spaces are sites of human experience. It affirms that avatars matter when they are the vessels through which dignity is breached. For Thursday’s sitting, I propose we adopt this framework and the dispositions above.  

  ---  
  **END MEMORANDUM**
