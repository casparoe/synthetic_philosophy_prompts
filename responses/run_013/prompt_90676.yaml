prompt: |-
  My decision theory reading group has a member who has begun settling arguments with the maxim "you can't be worse off with more information," and he wields it as a theorem rather than a motto. His most recent use of it was to argue that someone who declines to learn a predictive fact about themselves — a genetic risk score, a forecast of how they will behave in a situation they are about to enter, the result of a test whose outcome they cannot change — is being straightforwardly irrational, on the grounds that no rational agent could prefer ignorance. I suspect he is right under one reading of that sentence, wrong under several others, and that the argument he actually needs is much narrower than the one he gave. What I want from you is a menu of the precise claims "you can't be worse off with more information" could be making, each with a verdict, so that I can tell him exactly which reading his conclusion depends on.

  For context, the result I take him to have half-remembered is the non-negativity of the expected value of information in Bayesian decision theory (sometimes called Good's theorem): the maximum expected utility available to a decision-maker who acts after receiving a signal, computed under her prior, is never less than the maximum expected utility available to her before receiving it, on the reasoning that she could always act as though she had not seen the signal. I want the readings arranged from the nearly empty to the nearly false, and I want the following distinctions respected in the process:

  - Whether a reading is about expected value measured *before* the information arrives or about the outcome actually realized *after* it arrives. (Bad news can be bad news.)
  - What the reading assumes about the agent: that she maximizes expected utility at all; that her preferences are fixed and not themselves altered by what she learns; that she knows the likelihoods; that she is unbounded in time or computation; that she is able to refrain from updating on evidence once she has seen it, rather than being compelled to conditionalize.
  - Whether the information is free, and whether the reading is a claim about value or a claim about what one is obligated to acquire.
  - Whether the reading survives when the information concerns the agent's own future choice, or is merely correlated with it, so that learning it rationally shifts what she does.
  - Whether the reading is about information that only moves her beliefs, or also about information that moves her preferences, her reputation in others' eyes, or the payoffs themselves.

  Then, at the end, do two things. First, identify which single reading my colleague's "therefore refusing to learn is irrational" conclusion actually requires, and say whether that reading is true, and whether it licenses the conclusion or only something weaker (a claim about willingness to pay, say, rather than about rationality). Second, name the reading under which refusing the information could be rational, and say what the theorem would have to assume in order to rule it out. Lay the readings out as a numbered list I can bring to the meeting.
reasoning: |-
  Okay, the user is part of a decision theory reading group where someone is using "you can't be worse off with more information" as a blanket theorem. The user wants to challenge this by breaking down different interpretations of this claim, assessing each one's validity, and identifying which one their colleague is relying on. 

  First, I need to recall the core Bayesian decision theory result they mentioned—Good's theorem. That's about the non-negativity of the expected value of information. The key insight is that before receiving information, an agent can always ignore it, so the expected utility shouldn't decrease. But real-world complications like preference changes or computational limits can break this.

  The user laid out specific distinctions they want addressed: 
  - Expected value vs. realized outcome
  - Agent assumptions (rationality, fixed preferences, etc.)
  - Cost of information and obligation
  - Information about future choices
  - Whether info affects beliefs only or also preferences/reputation/payoffs

  I should structure the readings from weakest/most defensible to strongest/most easily falsified. Starting with Good's theorem in its purest form (Reading 1), then gradually adding constraints like preference stability (Readings 2-3), then moving to realized outcomes (Reading 4), and finally tackling thornier cases like preference shifts (Reading 5) or self-fulfilling prophecies (Reading 6). 

  The colleague's argument hinges on Reading 3—claiming it's irrational to refuse free info when preferences are fixed. But that ignores how learning can directly harm utility (e.g., bad news causing distress). Good's theorem only says expected utility doesn't decrease; it doesn't force you to prefer knowing. Refusal can be rational under Readings 4-6, where the theorem's assumptions break. 

  For the conclusion, I need to specify: 
  - Colleague's required reading (3) is mathematically true but only implies non-negative expected value—not that refusal is irrational. 
  - Rational refusal happens when info alters preferences (Reading 5) or causes direct harm (Reading 4). The theorem would need impossible assumptions (no belief-independent utility effects) to forbid this.

  The user wants a numbered list they can bring to the meeting. Each reading should clearly state the claim, verdict, and required assumptions. The last two points should directly answer their questions about the colleague's argument and rational refusal cases.
answer: |-
  Here is a menu of precise readings for "you can't be worse off with more information," ordered from most defensible (nearly empty) to most easily falsified (nearly false). Each reading specifies its claim, key assumptions, and verdict, respecting your requested distinctions.

  ---

  ### **The Readings: From Nearly Empty to Nearly False**
  1. **Reading 1: Ex Ante Expected Utility (Pure Good's Theorem)**  
     - **Claim**: *Before* observing a signal, the maximum expected utility achievable by an agent who *might* receive the signal (and can condition actions on it) is at least as high as the maximum expected utility achievable without it.  
     - **Assumptions**:  
       - Bayesian rational agent (maximizes subjective expected utility).  
       - Fixed preferences and payoff structure.  
       - Known signal likelihoods.  
       - Free information (no cost to acquire/process).  
       - No constraints on computation/updating (can ignore or use the signal optimally).  
     - **Verdict**: **True**. This is Good’s theorem. It is a tautology: the agent can always ignore the signal, so the option value of information is non-negative.  

  2. **Reading 2: Robustness to Imperfect Rationality**  
     - **Claim**: Even if the agent is computationally bounded or cannot perfectly ignore the signal, the *theoretical optimum* under full rationality satisfies Reading 1.  
     - **Assumptions**: Same as Reading 1, but acknowledges real agents may fail to achieve the optimum.  
     - **Verdict**: **True but vacuous for practice**. The theorem holds for the idealized agent, but humans might mismanage information.  

  3. **Reading 3: Fixed Preferences, Ex Ante Preference for Information**  
     - **Claim**: A rational agent with fixed preferences will *ex ante* (before seeing the signal) always weakly prefer to receive free information, as it expands their choice set.  
     - **Assumptions**: Same as Reading 1, plus:  
       - Preferences are state-independent (utility depends only on outcomes, not beliefs).  
       - No direct cost (psychological, temporal) to receiving information.  
     - **Verdict**: **True** under assumptions. Refusing free information *ex ante* violates expected utility maximization.  

  4. **Reading 4: Realized Utility (No Guarantee of Improvement)**  
     - **Claim**: After receiving information, the agent’s *realized* utility cannot be lower than if they had remained ignorant.  
     - **Assumptions**: None beyond rationality.  
     - **Verdict**: **False**. Bad news (e.g., a terminal diagnosis) can cause distress or trigger costly actions, lowering realized utility relative to ignorance (e.g., blissful avoidance).  

  5. **Reading 5: Stable Preferences and Payoffs**  
     - **Claim**: Information never harms the agent, even if it alters preferences, reputations, or payoffs.  
     - **Assumptions**: None.  
     - **Verdict**: **False**. Examples:  
       - *Preference shifts*: Learning you enjoy gambling may addict you, lowering long-term utility.  
       - *Reputation costs*: A genetic test result leaked to insurers raises premiums.  
       - *Payoff changes*: A prediction of your behavior alters others’ actions (e.g., a bank run forecast).  

  6. **Reading 6: Information About Future Choices**  
     - **Claim**: Learning a fact about your own future choice (or a correlate) cannot make you worse off.  
     - **Assumptions**: Rational agent, fixed preferences.  
     - **Verdict**: **False**. If the information is a self-fulfilling prophecy (e.g., learning "you will quit your job tomorrow" causes you to quit), it may lock you into a suboptimal path. Ignorance avoids this.  

  ---

  ### **Conclusion: Your Colleague’s Argument and Rational Refusal**
  - **Colleague’s Required Reading**: **Reading 3** (fixed preferences, ex ante preference for free information).  
    - **Is it true?**: **Yes**, under its narrow assumptions (Bayesian rationality, fixed preferences, no belief-dependent utility).  
    - **Does it license "irrational to refuse"? Only weakly**:  
      - It shows that refusing *contradicts ex ante expected utility maximization*.  
      - **But**: It does **not** imply refusing is irrational if:  
        - Preferences might shift (Reading 5).  
        - Realized utility could fall (Reading 4).  
        - Information has indirect costs (e.g., anxiety, obligation to act).  
      - It only justifies a *weak ex ante willingness* to accept free info—**not** a categorical obligation.  

  - **Rational Refusal Reading**: **Reading 4 or 5** (harm to realized utility or preference instability).  
    - **When is refusal rational?** When:  
      - Utility has belief-dependent components (e.g., "bliss of ignorance," anxiety from bad news).  
      - Information alters preferences/payoffs (e.g., learning triggers addiction).  
      - Information constrains future choices (Reading 6; e.g., fatalism from predictions).  
    - **What the theorem must assume to forbid refusal**:  
      - Utility is *solely outcome-dependent* (no belief-utility).  
      - Preferences are immutable.  
      - Payoffs/reputations are information-proof.  
      - No self-fulfilling prophecies.  
      *(These are empirically false for humans.)*  

  ---

  ### **Summary List for Your Meeting**
  1. **Ex Ante Expected Utility (Good’s Theorem)**: True, but abstract.  
  2. **Robustness to Bounded Rationality**: Theoretically true, practically irrelevant.  
  3. **Ex Ante Preference for Info (Fixed Prefs)**: True under assumptions; implies *weak* rationality pressure to accept.  
  4. **Realized Utility Guarantee**: False—bad news can harm.  
  5. **Immunity to Preference/Payoff Shifts**: False—info can distort preferences or payoffs.  
  6. **Info on Future Choices**: False—self-fulfilling prophecies can trap you.  

  **Punchline for your colleague**: His argument **requires Reading 3**. While technically true, it ignores human-scale problems (belief-dependent utility, preference drift, psychological costs). Refusing information **is rational** when learning itself causes harm (Readings 4–5), which Good’s theorem explicitly rules out by assumption. His "theorem" is a poor motto for real agents.
