answer: |-
  The Overdue Accounts Office received a claim for unpaid taxes from a taxpayer who’d used a faulty Parfit-approved teletransporter, resulting in two claimants arriving at the destination while the original was destroyed. Both claimants possessed full psychological continuity and demanded the original’s tax debt be voided, arguing neither was strictly identical to the source.  

  Faced with a form demanding a single checkbox for "Original Taxpayer Present (Y/N)" to resolve the debt, the weary clerk sighed, circled both boxes, scribbled "SEE ATTACHED PARFITIAN ANALYSIS," then decisively crossed out 'No'.  

  **The punchline turns on the collision between the law's demand for a binary identity fact and Parfit's view that 'same person' is an empty question in branching cases, while psychological continuity – the only thing that matters – holds doubly.**
