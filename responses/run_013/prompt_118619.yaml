  0.4 is P(D), which is 0.4, and P(not UE) = 0.7, so P(D | not UE) = P(D) / P(not UE) = 0.4 / 0.7 = 4/7

  P(D) = P(DE) + P(DW) = 0.2 + 0.2 = 0.4, and since downstairs is not affected, yes.

