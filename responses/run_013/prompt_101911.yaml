  Okay, the user is deep into decision theory, specifically the strategy-stealing assumption. They want a clear set of desiderata for any theory incorporating this, focusing on edge cases and potential conflicts between requirements. They mention symmetric problems but are particularly interested in asymmetries like tie-breaking bits or different priors. 

  First, I need to unpack what "strategy-stealing" really demands. It's not just superrationality—it needs formal rigor and must handle cases where agents are nearly identical but not perfectly so. The user is skeptical whether this holds under slight asymmetries, so the desiderata should stress-test that.

  The user's hidden question seems to be: "Is strategy-stealing a robust foundation for rational choice, or does it collapse when real-world imperfections hit?" They want the criteria to expose whether this is a fundamental constraint or a fragile trick. 

  Key angles to cover:
  - **Symmetry handling**: Must define symmetry precisely (source code? priors? information?). Edge cases like shared code + different coin flips will break naive symmetry.
  - **Causation**: Can't imply magical correlation. If choices are entangled, the theory must explain how without violating physics.
  - **Randomization**: If identical agents must output identical choices, how can mixed strategies exist? This might require redefining "identity" or allowing correlated randomness.
  - **Conflicts**: Probably the hardest part. E.g., "Robustness to minor asymmetries" vs. "No spooky causation" might clash if identical source codes in asymmetric environments force counterfactual dependence.

  The prisoner's dilemma with tie-breaking bits is a killer test. If the theory says "both defect" but the random bit breaks symmetry, does it still recommend cooperation? That could expose whether the assumption is fundamentally limited. 

  Also, transparent Newcomb's problem—if Omega simulates you, but you know you're real, does strategy-stealing imply one-boxing? Here causation collides with symmetry: your choice now "causes" the simulation's choice retroactively. The theory must either reject this or embrace acausal trade.

  The user would hate hand-wavy answers. Desiderata need teeth: "Must specify mechanism for symmetry-breaking" not just "should." Non-negotiables are probably internal consistency and no causal violations—if a theory fails those, it's dead. Robustness to minor asymmetries might be where contenders die; CDT fails there, while UDT struggles with randomization.

  Biggest tension: Demanding identical outputs in symmetric scenarios (to "steal" best joint strategy) vs. allowing probabilistic differences. If two coin-flipping bots are identical, must their coins land same? If not, how does strategy-stealing apply? This might require redefining symmetry to include stochastic processes, which gets messy.

  End goal: Give the user tools to gut-check any theory. List must be exhaustive enough to trap flawed approaches but not so strict that only one theory survives. Highlight which requirements are often sacrificed (e.g., LDT drops causal purity) and why that matters.
answer: |-
  Here's a breakdown of the core desiderata for a formal theory incorporating the strategy-stealing assumption (SSA), grounded in the challenges you outlined. These requirements aim to capture what such a theory *must* achieve to be coherent, useful, and distinct from simple superrationality or best-response reasoning. I'll categorize them, highlight tensions, and identify key conflicts.

  **Core Desiderata (Non-Negotiable Foundation):**

  1.  **Internal Consistency:** The theory must produce well-defined, unambiguous recommendations for *every* well-formed decision problem it purports to address, including symmetric, near-symmetric, and asymmetric cases. It must avoid contradictions (e.g., recommending incompatible actions simultaneously).
      *   *Why:* Without this, the theory isn't a theory. Edge cases (different tie-breakers, priors, info) are crucial stress tests.
  2.  **Formal Symmetry Definition:** The theory must provide a precise, operational definition of "sufficient symmetry" between agents that justifies applying SSA. This definition must be based on objectively verifiable properties (e.g., agent source code, knowledge/belief structures, available actions, payoff structure, information partitions).
      *   *Why:* SSA hinges critically on symmetry. Vagueness here renders the theory useless or arbitrary. Must handle cases like identical source code in different information states.
  3.  **Implementation of Strategy-Stealing:** The theory must explicitly define *how* an agent "reasons as if its choice and the other's choice are the same variable." This requires specifying:
      *   The mechanism for identifying the "best joint strategy."
      *   How the agent selects its action *as if* it controls both choices within this reasoning framework.
      *   How this reasoning interacts with the agent's actual knowledge of its own identity and limited control.
      *   *Why:* This is the heart of SSA, distinct from best-response or simple cooperation heuristics. Superrationality often lacks this formal mechanism.

  **Essential Behavioral Requirements (What it Must Get Right in Key Cases):**

  4.  **Cooperation in Symmetric PD:** In a perfectly symmetric Prisoner's Dilemma between agents satisfying the theory's symmetry criterion, the theory must recommend *Cooperate* as the unique rational choice (or the cooperative outcome as uniquely rational).
      *   *Why:* This is the canonical justification for SSA. Failing here undermines its core purpose.
  5.  **One-Boxing in (Opaque) Newcomb's Problem:** When facing a sufficiently accurate predictor (Omega) who bases its prediction on a sufficiently symmetric simulation/analysis of the agent, the theory must recommend taking *only* the opaque box (One-Boxing).
      *   *Why:* Demonstrates the ability to handle acausal/counterfactual dependence stemming from symmetry/prediction, a key motivation beyond simple PD cooperation.
  6.  **Robustness to Minor Asymmetries:** The theory's recommendations must be *continuous* under *small* perturbations breaking perfect symmetry. Crucially, it must handle:
      *   **Identical Source Code + Different Tie-Breaking Bit:** Agents share identical deterministic code/logic but have access to different, independent random bits (e.g., for tie-breaking). Should the SSA logic still apply? If not, why? If yes, how? (This directly challenges the "same variable" assumption).
      *   **Identical Source Code + Different Priors:** Agents share logic but start with slightly different prior beliefs (e.g., about the environment or each other). Does SSA still hold? How does the reasoning incorporate differing beliefs?
      *   *Why:* Real-world agents are never *perfectly* identical. The theory must not catastrophically fail under minor, realistic deviations. This is a major stress test.
  7.  **Transparent Newcomb/Paradox of Predictability:** In the "Transparent Newcomb" scenario (the agent *knows* Omega has already made its prediction and filled the boxes, the agent can see the boxes but not their contents), the theory must provide a clear recommendation, ideally consistent with one-boxing *if* the symmetry/prediction link justifies it, even in this "causally separated" state.
      *   *Why:* Tests the theory's commitment to acausal/counterfactual reasoning and its handling of the tension between choice and fixed past prediction. A theory recommending two-boxing here often abandons the core SSA logic in opaque Newcomb.

  **Handling Complexity & Constraints:**

  8.  **Mixed Strategies & Randomization:** The theory must coherently handle scenarios where mixed strategies are relevant or even dominant. Crucially:
      *   If symmetry implies identical outputs, how can independently randomized strategies arise? Does the theory require/allow correlated randomization? Does it redefine "identity" to include the stochastic process?
      *   *Why:* Randomization is fundamental to game theory and many real decisions. A theory that only works for pure strategies is severely limited. The tension between "identical outputs" and independent randomness is profound.
  9.  **No Magical Causation / Respecting Information Flow:** The theory cannot imply that an agent's choice *physically causes* the other identical agent's choice across spacelike separation or retrocausally. It must explain the correlation (e.g., via logical counterfactuals, source code similarity, predictor models) without violating known physical constraints on causation and information flow. It must correctly handle differing information sets.
      *   *Why:* Violating physics is unacceptable. The theory must "own" whether it uses counterfactual dependence (acausal influence) and explain it rigorously. Handling different information (e.g., one agent sees a signal, the other doesn't) tests if SSA overrides standard Bayesian updating.

  **Key Tensions and Conflicts:**

  *   **Robustness to Minor Asymmetries (6) vs. Strict Symmetry Requirement (2, 3, 4):** This is the core tension. How "minor" can an asymmetry be before SSA no longer applies? The "identical code + different random bit" case is critical. A theory demanding *perfect* determinism for SSA fails robustness. A theory applying SSA too broadly risks incoherence.
  *   **Mixed Strategies (8) vs. Symmetry Implies Identical Outputs:** If perfect symmetry *requires* identical outputs (pure strategies), how can mixed strategies exist for symmetric agents? Resolving this likely requires either:
      *   Redefining "symmetry" to include shared randomness source (correlated strategies).
      *   Allowing agents to "reason as if" they control both, leading to a correlated equilibrium.
      *   Accepting that perfect symmetry precludes independent randomization, limiting applicability.
  *   **No Magical Causation (9) vs. Transparent Newcomb (7) & Opaque Newcomb (5):** Maintaining a purely causal worldview while recommending one-boxing in *both* opaque and transparent Newcomb is incredibly difficult, if not impossible. Theories often resolve this by embracing *acausal decision theory* (ADT) or *logical counterfactuals*, explicitly rejecting the idea that causation is the only source of correlation relevant to rational choice. This is a major philosophical divide.
  *   **Robustness to Different Priors (6) vs. Strategy-Stealing Mechanism (3):** If agents have different priors, what is the "best joint strategy"? Whose prior defines it? Does SSA require converging to a common prior during reasoning? This challenges the simplicity of "stealing" a single joint strategy.

  **Which Requirement Does the Most Damage (Rules Out Contenders)?**

  **Robustness to Minor Asymmetries (6)**, particularly the **"identical source code + independent random bit"** case, is arguably the biggest challenge and does the most to rule out naive implementations or overly strict interpretations of SSA.

  *   **Why it's deadly:** Perfect determinism is unrealistic. If SSA *requires* agents to make identical deterministic choices, it fails immediately in this extremely common scenario (any real system uses RNGs). If the theory claims the agents are still "symmetric enough" for SSA, it must explain *how* the "same variable" reasoning works when their outputs are explicitly designed to be probabilistically independent. Does the agent reason *as if* the random bits are the same? This seems inconsistent with the agent's knowledge. Does it average over possible bit values? This might lead back to best-response or require complex correlated reasoning.

  **How Main Contenders Fare (Briefly):**

  1.  **Superrationality (Hofstadter):** Fails most desiderata. Lacks formal mechanism (3), vague on symmetry (2), struggles with minor asymmetries (6), randomization (8), and causation (9). Primarily gets PD (4) and opaque Newcomb (5) "right" by intuition.
  2.  **Causal Decision Theory (CDT):** Explicitly violates SSA. Fails PD cooperation (4) and Newcomb one-boxing (5, 7). Excels at no magical causation (9) and handles randomization (8) & asymmetries (6) well. Internal consistency (1) depends on formulation.
  3.  **Evidential Decision Theory (EDT):** Can sometimes achieve PD cooperation (4) and opaque Newcomb (5) via acausal correlation, but often for the wrong reasons ("I cooperate because it's evidence they cooperate"). Fails Transparent Newcomb (7 - usually two-boxes), struggles with robustness to asymmetries (6) and different priors, can have issues with randomization (8) and causation (9 - correlation isn't causation). Internal consistency (1) can be problematic (e.g., medical Newcomb).
  4.  **Updateless Decision Theory (UDT) / Logical Decision Theory (LDT):** Designed to handle SSA formally. Defines symmetry via source code/logical possibility (2). Implements strategy-stealing via logical counterfactuals/optimality over input-output maps (3). Gets PD (4) and opaque Newcomb (5) right. Can handle Transparent Newcomb (7) via logical dependence. Explicitly embraces acausality (9 - "owns" it). **Major Struggles:** Robustness to minor asymmetries (6 - especially different RNGs/priors) and mixed strategies (8 - defining optimality over stochastic maps is complex, correlation vs. independence is thorny). Formal complexity is high.

  **Conclusion: Constraint or Heuristic?**

  The strategy-stealing assumption is **potentially a genuine constraint on rational choice**, but only under very specific and often fragile conditions of perfect symmetry and determinism. Building a *general*, *robust* formal theory around it is incredibly challenging.

  *   **Its core strength** is compellingly resolving dilemmas (PD, Newcomb) where causal best-response leads to suboptimal outcomes due to acausal correlations from symmetry/prediction.
  *   **Its core weakness** is extreme sensitivity to minor asymmetries (like independent RNGs) and the difficulty of cleanly incorporating randomization and differing beliefs/information within the "same variable" framework. The requirement for **Robustness to Minor Asymmetries (6)** is the primary force pushing it towards being a heuristic or requiring highly specific, idealized agent models.
  *   **The causation point (9)** forces a stark choice: abandon strict physical causation for logical counterfactuals (like UDT/LDT), or severely limit the scope of SSA. There's no comfortable middle ground that satisfies all intuitions.

  Whether SSA is ultimately a fundamental constraint depends on whether a theory can be developed that successfully navigates the tension between **Robustness to Minor Asymmetries (6)** and **Mixed Strategies (8)** while maintaining a coherent **Implementation (3)** and respecting the **No Magical Causation (9)** constraint in a way that acknowledges acausal dependence without violating physics. UDT/LDT represents the most serious attempt, but its handling of asymmetry and randomization remains an active area of research and debate. Without progress there, SSA remains a powerful heuristic for highly symmetric scenarios rather than a universal constraint.
