  ## Pantoum of the Perched Alarm

  The sentinel alone upon the branch is keen.
  He spies the shadow creeping, low and grim.
  He gives his life to save the flock unseen,
  His piercing call condemning life for him.

  He spies the shadow creeping, low and grim.
  **The copies whisper: "Sound the fierce command!"**
  His piercing call condemning life for him,
  **But kindred genes now flourish through the land.**

  **The copies whisper: "Sound the fierce command!"**
  (Is this the cause, or just the bookkeeper's score?)
  **But kindred genes now flourish through the land.**
  Does kinship's gain explain what we see more?

  (Is this the cause, or just the bookkeeper's score?)
  **Or does the bird itself seek sly reward?**
  Does kinship's gain explain what we see more?
  Perhaps *his* kin's escape *his* hoarded guard.

  **Or does the bird itself seek sly reward?**
  **The flock survives, a stronger whole takes wing!**
  Perhaps *his* kin's escape *his* hoarded guard.
  **The trait persists, a necessary thing.**

  **The flock survives, a stronger whole takes wing!**
  He gives his life to save the flock unseen.
  **The trait persists, a necessary thing.**
  The sentinel alone upon the branch is keen.

  ---

  ## How the Poem Works

  1.  **Form & Repetition:** The pantoum's strict interlocking repetition forces the same lines to recur in different contexts:
      *   *Line 2 (Stanza 1):* "He spies the shadow creeping, low and grim." → *Line 1 (Stanza 2):* Now introduces the *gene's-eye view* ("The copies whisper...").
      *   *Line 4 (Stanza 1):* "His piercing call condemning life for him." → *Line 3 (Stanza 2):* Immediately juxtaposed with the gene-level payoff ("But kindred genes now flourish...").
      *   *Stanza 2, Line 4:* "But kindred genes now flourish through the land." → *Stanza 3, Line 3:* Used to question if this *is* the cause or merely an accounting of the effect ("Does kinship's gain explain what we see more?").
      *   *Stanza 5, Line 2:* "He gives his life to save the flock unseen." → *Stanza 1, Line 3:* Returns to the apparent altruism, but now after hearing the group-level argument.
      *   *Stanza 5, Line 4:* "The sentinel alone upon the branch is keen." → *Stanza 1, Line 1:* Closes the circle, leaving the act observed but its ultimate "why" suspended.

  2.  **The Three Levels:**
      *   **Gene-Level (Stanza 2):** Focuses on the copies of the altruism gene ("The copies whisper"), promoting their propagation via kin ("kindred genes now flourish"). The sacrifice is gene-selfishness.
      *   **Individual-Level (Stanza 3 & Hint in 4):** Questions the gene view ("Is this the cause, or just the bookkeeper's score?") and suggests individual benefit ("Or does the bird itself seek sly reward?"). Stanza 4 explores the possibility the sentinel primarily protects its *own* close kin ("Perhaps *his* kin's escape *his* hoarded guard"), a form of indirect individual benefit.
      *   **Group-Level (Stanza 4 & 5):** Argues for the group as the beneficiary ("The flock survives, a stronger whole takes wing!") and the trait being selected *for* the group advantage ("The trait persists, a necessary thing").

  3.  **Engaging the Debate:**
      *   **Selected vs. Selected For:** The poem highlights this by juxtaposing *effects* ("kindred genes now flourish", "The flock survives") with questions about the *cause* ("Is this the cause...?", "Does kinship's gain explain...?"). The group-level stanza asserts the trait is *selected for* its group benefit ("a necessary thing").
      *   **Group Selection: Genuine Cause or Bookkeeping?:** This is directly addressed: "(Is this the cause, or just the bookkeeper's score?)" referring to the gene-level explanation potentially being just an accounting of the *result*, not the *mechanism* of selection operating on groups. The group-level stanzas argue for it being a genuine cause ("a stronger whole takes wing", "a necessary thing").

  4.  **Ambiguity:** The closing stanza recycles the opening lines. "He gives his life to save the flock unseen" now resonates with *all three* interpretations heard. The final image of the watchful sentinel ("keen") presents the act itself, leaving the reader unable to definitively say *at which level* the selective pressure primarily operated. The words remain the same; only the frame of interpretation has shifted, demonstrating how the same biological event sustains multiple, valid evolutionary accounts.
