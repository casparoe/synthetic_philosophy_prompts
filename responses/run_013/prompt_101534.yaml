prompt: |-
  I run model risk review for a financial regulator, and we have started receiving stress-test submissions in which the submitting firm represents its uncertainty with an interval or a set of probability distributions rather than a single distribution. My team has to review these, and I keep hitting the same two failures. First, reviewers accept an interval at face value and treat a wider interval as automatically meaning the firm is less confident, when the width is often an artifact of how the set was built. Second, submissions sometimes report that after observing an additional variable the interval for the target event got wider, and nobody can say whether that is a real finding about the world or a property of the model. I want a decision procedure my analysts can run on a submission, in a few hours, using only what they already know about conditional probability. They are not specialists in this literature and should not need to become specialists; the head of model risk signs off on the final judgment, so the procedure has to mark clearly which conclusions an analyst may draw alone and which must be escalated.

  Please write that procedure. Ground it in the parts of the theory of imprecise probability that bear on these two failures, and be specific about the following. State what has to be true of the submitted model before the interval has any interpretation at all (the set being closed and convex, the decision rule being named and applied consistently, and whether the rule is a maximin-style rule, a regret-based rule, or a rule that keeps every distribution in the set as potentially optimal). Give the test for the second failure in a form an analyst can actually carry out: how to locate a partition of the outcome space such that conditioning on any cell widens the interval for the target event, and how to distinguish the case where this widening reflects a genuine dependence structure from the case where it is an unavoidable feature of conditioning a set of distributions. Then give the test for the first failure: how to check whether the width of an interval carries any evidential weight, or whether the firm has simply chosen a parametrization whose intervals move with the prior specification rather than with the data. Include a step that asks whether the submission's decision rule has the property that information is always non-negative in value, and say what to do when it does not — this is the step most likely to embarrass a submitting firm, and I want the procedure to say plainly that under some of these rules an analyst who is maximizing the worst case can be made worse off by learning something, so the firm cannot both use such a rule and claim that every additional observation improves its decisions.

  Run the procedure on three cases: (a) a submission in which a firm models an unknown default rate as an interval and conditions on a macroeconomic indicator that is, by the firm's own specification, independent of defaults; (b) a submission in which the interval for a loss event widens after conditioning on the outcome of a coin-like process whose bias is itself unknown; (c) a submission in which the interval widens with every additional year of data, and the firm reports this as increasing confidence. At least one of these should produce an outcome the submitting firm will not like, and I want you to say so rather than softening it.

  Two further things. Where the procedure reaches a question that is a matter of modeling judgment rather than a matter of fact — for instance, which set of distributions correctly represents the firm's evidence, or whether a rule that permits negative value of information is acceptable — mark it as a judgment call and say who should make it, rather than pretending the procedure settles it. And if the framing of this request rests on a mistake — if treating the width of an interval as a measure of confidence is confused, or if the demand for a single procedure across maximin and non-maximin rules cannot be met — say so directly instead of writing a procedure that papers over it.
reasoning: |-
  We are designing a decision procedure for analysts to review stress-test submissions that use sets of distributions (imprecise probabilities) to represent uncertainty.

   The procedure must address two common failures:
   1. Reviewers taking the width of an interval at face value as a measure of confidence.
   2. Submissions reporting that conditioning on an additional variable widens the interval, and the difficulty in interpreting whether this is a real finding or an artifact.

   The procedure should be grounded in imprecise probability theory and be executable by non-specialists in a few hours, using only conditional probability.

   Steps:

   I. Preliminary Checks: Conditions for the interval to have a meaningful interpretation.

      For a set of distributions (credal set) to be used for decision-making, we require:

      a. The set must be closed and convex. (This is standard in the imprecise probability literature to ensure well-defined lower and upper probabilities and to avoid pathological behavior.)

      b. The decision rule used by the firm must be named and applied consistently. The rule should be one of:
          - Maximin (maximize the minimum expected utility)
          - Minimax regret (minimize the maximum regret)
          - A rule that keeps every distribution in the set as potentially optimal (e.g., Γ-maximin or E-admissibility)

      Without these, the interval may not have a coherent interpretation.

      If the submission does not meet these conditions, the analyst must escalate to the head of model risk.

   II. Test for the second failure (widening interval upon conditioning):

      We wish to determine whether the widening of the interval upon conditioning on an additional variable is due to a genuine dependence structure or is an unavoidable feature of conditioning a set of distributions.

      Steps for the analyst:

      a. Ask the firm to provide the joint distribution (or set of joint distributions) for the target event (say, A) and the conditioning variable (say, B).

      b. Check if the firm's model allows for a partition of the outcome space of B such that conditioning on any cell of the partition widens the interval for A. Specifically:

          Let P be the credal set for the joint distribution of (A, B). The analyst should:

          i. Identify the partition induced by B (if B is discrete, the partition is the set of its possible outcomes; if continuous, the firm must provide a discretization that they used, or the analyst may choose a coarse partition for tractability).

          ii. For each cell b in the partition, compute the conditional interval for A given B=b:

              Lower probability: P(A|B=b) = inf_{P in P} P(A|B=b)   [if the set is closed and convex, this is well-defined]
              Upper probability: \bar{P}(A|B=b) = sup_{P in P} P(A|B=b)

          iii. Compare the width of the interval for A in the marginal case (without conditioning on B) to the widths after conditioning on each b.

      c. Distinguish genuine dependence from an artifact:

          If the interval widens for every b, then this is a property of the model and not necessarily of the real world. In particular, this can happen even when A and B are independent under every distribution in the set.

          How to check for independence?

            - The firm's model specifies a set of joint distributions. The analyst should check if the firm's set P includes distributions that are independent? And if the set also includes dependent distributions?

            - However, note: if the set P is such that for every P in P, A and B are independent, then conditioning on B should leave the interval for A unchanged (if the model is coherent). But if the set P includes both independent and dependent distributions, then conditioning on B might widen the interval.

          But note: even if the firm states that A and B are independent, if the set P does not enforce independence (i.e., it contains distributions that are not independent) then conditioning might still widen the interval.

          Therefore, the key test is:

            "Does the interval for A widen upon conditioning on B, even when the firm's model specifies that A and B are independent?"

            If yes, then this widening is an artifact of the imprecise model and not a real dependence.

          However, the analyst must check the firm's specification for independence.

          Alternatively, the analyst can run a simple test:

            - Compute the marginal intervals for A without conditioning on B.

            - Then, compute the conditional intervals for A given each value of B under the assumption that A and B are independent. How?

              If the firm's set for the marginal of A is known (call this set Q) and the set for the marginal of B is known (call this set R), and if the set P for the joint is the set of all product measures of Q and R (i.e., the independent natural extension), then:

              The conditional probability P(A|B=b) is just the marginal on A, so the interval should be the same as the marginal interval.

            - But if the joint set P is defined in a different way (e.g., by constraints on the joint) then the analyst must compute the conditional intervals from the joint set.

          Therefore, the procedure:

            Step 1: Ask the firm to specify the set of joint distributions P for (A, B). If the firm states that A and B are independent, then the set P should be the set of all product measures of the marginal sets for A and for B.

            Step 2: If the firm does not state independence, then the analyst must note that the widening might be due to a real dependence, but also might be due to the imprecision in the model.

            Step 3: If the firm states independence, but the computed conditional intervals (using the joint set) are wider than the marginal, then the firm's set P does not actually enforce independence. This is a model error.

            Step 4: If the firm states independence and the set P is the independent natural extension, then the conditional intervals should be the same as the marginal. If they are not, then there is an error in the computation.

          In summary, if the firm claims independence and the interval widens, then the model is incorrectly specified. Otherwise, the widening might be due to the model's structure (and then the analyst must investigate further) or due to a real dependence.

          However, note that even if the variables are not independent, it is possible for the interval to widen for every value of the conditioning variable. This is a known phenomenon in imprecise probability: conditioning can increase imprecision.

          Therefore, the analyst should:

            - Check the firm's specification of the joint set and the independence assumption.

            - If the firm does not assume independence, then the widening might be a real finding OR an artifact of the model. To distinguish, the analyst should ask:

              "Is there a distribution in the set that, when conditioned on B, gives a conditional probability for A that is outside the marginal interval?"

              But note: the marginal interval is the inf and sup over the marginals. The conditional interval for a fixed b is the inf and sup over conditionals. It is possible for the conditional interval to be wider even if the dependence is real.

            How to decide? The analyst must note that without additional constraints, the widening is a model property and not necessarily a real-world finding. The firm must provide external justification for the model structure that leads to such widening.

          Conclusion for the test:

            - If the firm claims independence and the interval widens, then the model is flawed (escalate as a model error).

            - If the firm does not claim independence, then the widening might be due to a real dependence or an artifact. The analyst must request that the firm provides evidence of the dependence structure (e.g., from data) and must note that the model's construction (the set P) is the cause of the widening in the absence of such evidence. This is a judgment call: if the firm cannot provide evidence for the dependence, then the widening is likely an artifact. The head of model risk should be involved.

   III. Test for the first failure (width of interval as measure of confidence):

      We wish to check whether the width of the interval carries evidential weight or is an artifact of the parametrization.

      Steps:

      a. Ask the firm to provide the set of distributions (the credal set) and the data used to form it.

      b. Check the parametrization: if the set is defined by a parameter with a set of possible values (e.g., the default rate θ is in [a,b]), then the width of the interval for the target event (which may be a function of θ) might be driven by the prior set of θ.

      c. How to check if the width is driven by the prior or by the data?

          Consider that the set of distributions is updated by conditioning on data. The analyst should:

            - Without the data, the prior set for the parameters gives a prior interval for the target event.

            - After incorporating the data, the posterior set (by conditioning) gives a posterior interval.

          The key is: if the data are informative, we expect the posterior set to be smaller (or at least not larger) than the prior set? But note: in imprecise probability, it is possible for the posterior interval to be wider than the prior interval if the data are conflicting with the prior.

          However, the issue is: the firm may have chosen a parametrization such that the interval for the target event is always wide regardless of the data.

          Therefore, the analyst should:

            Step 1: Compare the prior interval for the target event (without any data) to the posterior interval (after seeing the data). If the posterior interval is not narrower (or even wider) than the prior, then the data have not reduced the imprecision.

            Step 2: Check the impact of additional data: if the firm has a time series, the analyst can ask for the interval after each new observation. If the interval does not shrink (or even widens) with every additional observation, then the model is not learning from the data.

          But note: In some models, the interval might widen temporarily if the data are inconsistent with the prior, but should eventually shrink.

          Therefore, the analyst should:

            - Ask the firm to simulate the model on synthetic data that are consistent with the prior set and see if the interval shrinks.

            - Alternatively, if the firm has multiple years of data, plot the width of the interval over time. If the width does not show a general decreasing trend (or if it increases over time) then the model is not learning.

          However, the analyst must be cautious: the firm may have a non-stationary process. But the firm should account for that.

          d. Step: Value of Information

            - Ask: What decision rule is the firm using? Specifically, does the rule have the property that information is always non-negative in value?

            - In imprecise probability, the value of information can be negative for maximin rules (i.e., learning can make the worst case worse). For other rules (like minimax regret or E-admissibility) the value of information is non-negative.

            - How to check? The analyst should:

              i. Identify the decision rule (from the preliminary checks).

              ii. If the rule is maximin, then it is possible for the value of information to be negative. This means that after conditioning, the minimum expected utility over the set might decrease. Therefore, the firm cannot claim that every additional observation improves its decisions.

              iii. If the rule is minimax regret or E-admissibility, then the value of information is non-negative.

            - Therefore, if the firm uses a maximin rule and the interval widens upon conditioning, then the worst-case outcome might become worse. The firm cannot then claim that the additional observation improved their decision-making (in the worst case). The analyst must note this and escalate.

            - The head of model risk must decide whether a model that allows for negative value of information is acceptable for stress-testing. The firm must justify why they are using such a rule.

   IV. Summary of the procedure:

      Step 0: Preliminary Checks
          a. Check that the credal set is closed and convex. (If not, escalate to head of model risk.)
          b. Identify the decision rule: maximin, minimax regret, or E-admissibility (or another that keeps every distribution potentially optimal). If not named or inconsistent, escalate.

      Step 1: Test for Widening upon Conditioning (Second Failure)
          a. Ask for the joint set P for (A, B) and the specification of independence (if any).
          b. Compute the marginal interval for A (without conditioning on B).
          c. Compute the conditional interval for A for each possible outcome of B.
          d. If the firm claims independence, then:
              - The joint set should be the independent natural extension (product of marginals).
              - The conditional intervals should equal the marginal interval. If they do not, mark as model error and escalate.
          e. If the firm does not claim independence, then:
              - If the conditional interval is wider for every outcome of B, then note that this is an artifact of the model and not necessarily a real dependence.
              - Request the firm to provide evidence for the dependence structure that causes the widening. If they cannot, then the widening is likely an artifact and the model may be over-conservative. The head of model risk must decide whether this is acceptable.

      Step 2: Test for Width as Confidence (First Failure)
          a. Ask for the prior set (without data) and the posterior set (with data) for the target event.
          b. Compare the prior and posterior intervals. Also, if multiple years of data are available, plot the width over time.
          c. If the posterior interval is not narrower than the prior (or if it is wider) and there is no specific justification (like conflicting data), then the data are not reducing the imprecision. This suggests the width is driven by the prior parametrization and not the data.
          d. Check the decision rule for value of information:
              - If the rule is maximin, note that the value of information may be negative. Therefore, the firm cannot claim that every additional observation improves decisions (in the worst case). The head of model risk must decide on the acceptability of such a rule.
              - If the rule is minimax regret or E-admissibility, then the value of information is non-negative.

      Step 3: Judgment Calls and Escalation
          - Any step that requires assessing whether the set of distributions correctly represents the evidence (e.g., in Step 1e when the firm provides evidence for dependence) is a judgment call. The analyst should document the firm's justification and escalate to the head of model risk if the justification is weak.
          - The acceptability of a decision rule with negative value of information is a judgment call for the head of model risk.

   V. Running the procedure on the examples:

      Case (a): Firm models default rate as an interval and conditions on a macroeconomic indicator that is, by the firm's own specification, independent of defaults.

          Step 0: Assume the set is closed and convex and the rule is named (say maximin).

          Step 1:
              - The firm claims independence.
              - The analyst computes the conditional intervals and finds they are wider than the marginal.
              - This is a model error because under independence, conditioning should not change the interval. Therefore, the model is flawed. The head of model risk must be informed.

          Outcome: The firm will not like this because they have an internal error.

      Case (b): The interval for a loss event widens after conditioning on the outcome of a coin-like process whose bias is itself unknown.

          Step 0: Assume the set is closed and convex and the rule is named.

          Step 1:
              - The firm does not claim independence (because the coin bias is unknown and the loss event might depend on the coin? Actually, the coin is a separate process. Let us assume the firm states that the loss event and the coin are independent? If not...).

          Let's clarify: The coin-like process has an unknown bias. The loss event is another event. The firm conditions the loss event on the outcome of the coin. The widening occurs.

          Possibilities:

            - If the firm does not claim independence, then the analyst must check: does the interval widen for every outcome of the coin?

            - Suppose the coin has two outcomes: heads and tails. The conditional interval for the loss event is wider under both heads and tails than the marginal interval.

            - Then, the analyst must ask the firm for evidence of dependence. The firm might say: "We don't know the bias of the coin, and we don't know if the loss event depends on the coin, so we allow for dependence." Then the set P is large enough to include both dependent and independent structures.

            - The widening is then an artifact of the model's imprecision. The firm must justify why such a model is appropriate. Without strong justification, the head of model risk might reject the model as too conservative.

          If the firm claims independence, then we have the same error as in case (a). But note: the bias of the coin is unknown. The firm might model the joint by a set that is not the independent natural extension? 

          Actually, the firm might have:

            - The marginal set for the coin bias: say the probability of heads is in [p_min, p_max].
            - The marginal set for the loss event: say the probability of loss is in [q_min, q_max].
            - But if they form the joint as the set of all product measures (independent), then conditioning on the coin outcome should not change the interval for the loss event.

          However, if the firm forms the joint set by allowing for arbitrary dependence (i.e., the set of all joint distributions with the given marginals), then conditioning on the coin outcome can widen the interval for the loss event. This is the famous "contamination" of the marginal by the unknown dependency.

          In that case, the firm did not claim independence. They used a set that allows for any dependence. Then the widening is an artifact of the model. The firm must justify why they allow for arbitrary dependence. The head of model risk must decide if this is acceptable.

          Outcome: The firm might not like it if they are forced to use a model that enforces independence when they are uncertain about dependence.

      Case (c): The interval widens with every additional year of data, and the firm reports this as increasing confidence.

          Step 0: Assume the set is closed and convex and the rule is named (say maximin).

          Step 2:
              - The analyst plots the width over time and sees it is increasing.
              - The analyst checks the prior interval and sees that the posterior interval (after each year) is becoming wider.

              - The analyst asks for the firm's justification. The firm might say: "We are becoming more aware of the uncertainty." But the model should be learning from data.

              - The analyst checks the decision rule: if maximin, then the value of information might be negative. But the firm is reporting increasing confidence (which is the opposite of what the data shows).

          Step 2c: The data are not reducing the imprecision. The model is not learning.

          Step 2d: The firm uses maximin. The analyst notes that the firm cannot claim that additional observations improve decisions (in the worst case, they get worse). The head of model risk must decide if the firm's interpretation of "increasing confidence" is acceptable.

          Outcome: The firm will not like this because their interpretation is contradicted by the model's behavior.

      In at least one case (a) we have a clear model error. In case (c) the firm's interpretation is problematic.

   VI. Caveats:

      The procedure assumes that the set of distributions is updated by conditioning. If the firm uses a different updating rule (e.g., generalized Bayes), then the procedure must be adjusted. The analyst should note that and escalate.

      Also, the procedure requires that the firm provides the set of distributions and the data. If the firm does not, the analyst cannot complete the procedure and must escalate.

      Finally, if the framing of the request rests on a mistake: 

        - The width of an interval in an imprecise probability model is not a direct measure of confidence. It represents the range of probabilities that are consistent with the evidence. A wide interval might be due to lack of information, but it might also be due to the model being conservative. The firm should not interpret the width as a measure of confidence without additional justification.

        - The procedure we have provided is designed for the two common failures. It does not require the analyst to become a specialist, but it does require them to compute conditional probabilities and check for independence.

      The head of model risk must be involved in judgment calls.

   Let's write the procedure in a step-by-step form for the analyst.
answer: |-
  ### Decision Procedure for Reviewing Imprecise Probability Submissions

  **Purpose**: Assess whether intervals represent genuine uncertainty or modeling artifacts. Address two failures: (1) Misinterpreting interval width as confidence, (2) Misattributing interval widening after conditioning.

  #### **I. Preliminary Checks: Model Validity**
  *Before interpreting intervals, verify these foundational conditions.*  
  1. **Credal Set Requirements**:  
     - The set of distributions must be **closed and convex**.  
     - If not, escalate to Head of Model Risk (HMR). The interval lacks coherent interpretation.  

  2. **Decision Rule Specification**:  
     - Firm must name its decision rule: **Maximin** (minimax), **Minimax Regret**, or **E-admissibility** (every distribution potentially optimal).  
     - Rule must be applied consistently. If unspecified or inconsistent, escalate to HMR.  

  ---

  #### **II. Test for Failure 2: Conditioning-Induced Widening**  
  *Determine if interval widening after conditioning reflects reality or model artifacts.*  

  1. **Obtain Joint Specification**:  
     - Require the firm to provide:  
       - The credal set for the joint distribution of target event \(A\) and conditioning variable \(B\).  
       - Explicit statement on whether \(A\) and \(B\) are independent.  

  2. **Compute Intervals**:  
     - Calculate:  
       - Marginal interval: \(\underline{P}(A) = \inf_{P \in \mathcal{P}} P(A)\), \(\overline{P}(A) = \sup_{P \in \mathcal{P}} P(A)\).  
       - Conditional intervals for each outcome \(B=b\):  
         \(\underline{P}(A|B=b) = \inf_{P \in \mathcal{P}} P(A|B=b)\),  
         \(\overline{P}(A|B=b) = \sup_{P \in \mathcal{P}} P(A|B=b)\).  

  3. **Assess Widening**:  
     - If \(\overline{P}(A|B=b) - \underline{P}(A|B=b) > \overline{P}(A) - \underline{P}(A)\) for *all* \(b\), proceed to Step 4.  
     - Else, conditioning is inconclusive; document and move to Failure 1 test.  

  4. **Distinguish Artifact from Genuine Dependence**:  
     - **Case A: Firm claims \(A \perp B\)**:  
       - Verify if \(\mathcal{P}\) enforces independence (i.e., \(\mathcal{P} = \mathcal{P}_A \times \mathcal{P}_B\), independent natural extension).  
       - **True independence \(\Rightarrow\)** \(\underline{P}(A|B=b) = \underline{P}(A)\), \(\overline{P}(A|B=b) = \overline{P}(A)\).  
       - If intervals widen, **model is flawed**. Escalate to HMR.  
     - **Case B: No independence claim**:  
       - **Artifact test**: Check if widening persists under a coarse partition (e.g., group \(B\) into 2-3 bins). If widening remains:  
         - **Likely artifact**: Widening is intrinsic to conditioning in imprecise models (e.g., due to incomplete prior knowledge).  
         - **Genuine dependence**: Requires evidence (e.g., data showing \(A\) and \(B\) covary).  
       - **Judgment call**: Analyst flags insufficient evidence. HMR decides if model justification is acceptable.  

  ---

  #### **III. Test for Failure 1: Width as Confidence**  
  *Assess if interval width reflects evidential weight or parametrization bias.*  

  1. **Prior/Posterior Comparison**:  
     - Obtain:  
       - Prior interval (before data).  
       - Posterior interval (after full dataset).  
       - Intervals at intermediate data stages (e.g., yearly).  
     - Plot interval width vs. data quantity.  

  2. **Learning Check**:  
     - If width **increases or stalls** with more data:  
       - **Parametrization artifact**: Width is driven by prior set, not data.  
       - **Exception**: Justifiable if data conflict with prior (e.g., outliers). Firm must provide evidence.  
     - If width **decreases**: Proceed to Step 3.  

  3. **Value of Information (VoI) Test**:  
     - **Maximin rule**:  
       - VoI can be negative (learning may worsen decisions).  
       - Firm **cannot claim** that "additional observations improve decisions."  
     - **Minimax Regret or E-admissibility**:  
       - VoI is non-negative. Widening may still occur but decisions improve.  
     - **Judgment call**:  
       - If VoI negative under maximin, HMR assesses if the rule is acceptable.  

  ---

  ### **Application to Cases**  
  *(Analyst executes tests; HMR makes judgment calls.)*  

  #### **Case (a): Independence Claimed but Widening Occurs**  
  - **Preliminary**: Set closed/convex, decision rule specified.  
  - **Failure 2 Test**:  
    - Firm claims \(A \perp B\) (defaults independent of macro indicator).  
    - Conditional interval wider than marginal.  
    - **Outcome**: Model flawed. Independence not enforced in \(\mathcal{P}\).  
  - **Escalation**: HMR rejects submission. **Firm will not like this.**  

  #### **Case (b): Widening with Unknown Coin Bias**  
  - **Preliminary**: Set closed/convex, rule specified (e.g., maximin).  
  - **Failure 2 Test**:  
    - No independence claim (bias unknown).  
    - Widening for all coin outcomes (heads/tails).  
    - Coarse partition (e.g., heads vs. tails) still widens interval.  
    - **Artifact identified**: Widening unavoidable due to uncertainty in coin bias.  
  - **Failure 1 Test**:  
    - VoI under maximin: Could be negative.  
    - If firm claims "coin data improve decisions," **contradiction**.  
  - **Judgment call**: HMR evaluates if artifact is justified.  

  #### **Case (c): Widening with More Data, "Increasing Confidence"**  
  - **Preliminary**: Set closed/convex, maximin rule.  
  - **Failure 1 Test**:  
    - Interval widens yearly with data.  
    - No justification for data-prior conflict.  
    - **Outcome**: Width driven by prior, not data.  
  - **VoI Test**:  
    - Maximin rule \(\Rightarrow\) VoI can be negative.  
    - Firm’s "increasing confidence" claim is **invalid**.  
  - **Escalation**: HMR challenges firm’s interpretation. **Firm will not like this.**  

  ---

  ### **Key Judgment Calls & Escalation**  
  - **HMR Decides**:  
    - Whether credal set \(\mathcal{P}\) correctly represents evidence.  
    - If negative VoI (under maximin) is acceptable for the use case.  
    - If widening artifacts are justified by model purpose.  
  - **Analyst Action**:  
    - Flag unsupported claims (e.g., "increasing confidence").  
    - Escalate ambiguous cases (e.g., genuine vs. artifact dependence).  

  ---

  ### **Theoretical Grounding**  
  - **Failure 1**: Width ≠ confidence. It may reflect prior parametrization (e.g., Walley’s imprecise beta model) or non-learnability. VoI negativity in maximin rules is proven (e.g., Seidenfeld 2004).  
  - **Failure 2**: Conditioning on independent \(B\) should not widen intervals if \(\mathcal{P}\) enforces independence. Arbitrary widening can occur in sets allowing dependence (e.g., \(\mathcal{P}\) with Frechet bounds).  

  ### **Caveats**  
  - **Framing Issues**:  
    - Interval width alone is **not** a confidence measure; it encodes ambiguity.  
    - A single procedure works across rules if preliminary checks are strict.  
  - **Limitations**:  
    - Assumes firms provide complete \(\mathcal{P}\) specifications. If not, analyst escalates.  
    - Coarse partitions for conditioning tests balance rigor/tractability.  

  **Output**: Clear pass/fail on model validity, flagged claims for HMR, and unambiguous escalation points. Firm-unfriendly outcomes are explicitly stated.
