prompt: |-
  I volunteer at a legal aid clinic that handles asylum claims, and I keep running into a shape of argument that I don't have a word for. The shape is this: an obligation seems to get weaker the more widely it applies, and the weakening is treated as too obvious to need defending.

  Three instances, and I genuinely don't know whether they are one thing or three.

  First: a country takes in a few thousand people from one war. When the next war displaces people, officials say they cannot take them, because they have already taken so many. The numbers are trivial next to the country's capacity, so this is not really a capacity claim. It is more that having done the thing once is being used as a reason not to do it again.

  Second: a person is refused protection because the danger they are fleeing is general. Everyone in the region is at risk, so they are not being singled out. Had the same danger been aimed at them personally, they would qualify. So the fact that more people are threatened makes each of their claims weaker, and the claim would be at its strongest if they were the only person threatened.

  Third: in arguments about who owes what to the displaced, the obligation is said to fall on whoever caused the displacement. A country that sold weapons or voted for the intervention is told it is not the cause in the relevant sense, because its contribution was one of many and no particular displacement can be traced back to it. But the same country then says that because it has accepted some refugees from that war, it has done its part and its slate is clean. Here the duty appears to shrink both when the contribution is shared and when the reception is shared.

  I half-remember an eighteenth-century essay on perpetual peace which says that strangers have a right to be received as visitors but not as settlers, and that the right has to be thin precisely because it belongs to everyone. That feels close to what I am circling, but I don't know whether it is the same phenomenon or only its ancestor.

  What I want is not a label. If there is an established name for this, tell me which of my three cases it actually covers and where it stops covering them. If there isn't, coin one and define it, and tell me what it rules out: how it differs from an ordinary limit of capacity, from the observation that some duties are borne by many hands at once, and from the idea that a duty becomes less demanding as its content becomes more general. I would also like to know whether the third case belongs with the first two or is a different animal wearing the same clothes.

  Please take a definite position. Tell me what the phenomenon is, give it a name or tell me which existing one to use, and defend the carving rather than laying the options out for me to choose between.
reasoning: |-
  Okay, let me unpack this user's query. They volunteer at a legal aid clinic handling asylum claims and have noticed a recurring argument pattern where obligations weaken as they apply more widely. They provided three examples and want to understand if these are connected, what the phenomenon is called, and how to differentiate it from related concepts.

  First, I need to parse each example carefully. The first involves a country refusing to take more refugees after accepting some, despite having capacity. The second is rejecting a claim because the threat is general rather than personal. The third shows a country denying responsibility by claiming shared causation in causing displacement but then asserting they've done enough by accepting some refugees. The user also referenced an 18th-century essay, which might relate to Kant's idea of universal but thin rights.

  The user explicitly wants a definite position, not just options. So I need to synthesize these cases under one concept. The core seems to be that the perceived obligation diminishes when more people are involved, either as beneficiaries or contributors. The reciprocity in the third case—minimizing responsibility when shared but also limiting help when shared—suggests a common thread of dilution through universality.

  I recall Kant's "Perpetual Peace" where hospitality is a universal right but limited because it applies to everyone. This resembles the logic in the examples. The term "the dilution principle" comes to mind, capturing how obligations lose perceived strength when broadly applicable. 

  Next, I should verify if existing terms fit. "Tragedy of the commons" relates but focuses on resource depletion, not the normative weakening. "Bystander effect" is psychological, not structural. "Distributed responsibility" doesn't capture the attenuation aspect. So coining a term seems necessary. "Dilution Principle" fits, emphasizing the erosion of obligation with scale.

  Analyzing the cases: all three share the dilution mechanism. The first and third involve sharing the duty among agents (countries), weakening the obligation per agent. The second involves sharing among claimants, weakening per claimant. The reciprocity in the third (causation vs. reception) is particularly telling—it's the same principle applied bidirectionally.

  Differentiating from related concepts: Capacity limits are about actual resources; here, capacity exists but obligation is denied. Distributed responsibility doesn't imply weakening; duties can remain robust. General duties (like helping the poor) might be weaker but not necessarily—here, the universality itself is the justification for attenuation.

  The user’s deeper need might be to counter this argument in asylum cases. Recognizing this pattern could help frame counterarguments, showing that widespread need doesn't diminish individual claims or state duties. They might also seek academic references to bolster their advocacy.
answer: |-
  Your three cases are manifestations of a single, pernicious phenomenon: **The Dilution Principle**. This is the unstated, often unchallenged, assumption that **a moral or legal obligation weakens in perceived force or specific applicability precisely because it is universal or widely shared.**

  Here's the breakdown:

  1.  **The Core Mechanism:** The Dilution Principle operates by conflating the *scope* of an obligation (how many people it applies to, either as claimants or duty-bearers) with its *intrinsic moral weight* or *specific demand*. It falsely assumes that because an obligation is broad, its claim on any *particular* agent or its validity for any *particular* claimant must be proportionally diminished. Universality is treated not as strengthening the obligation's foundation, but as diluting its potency per unit.

  2.  **Applying the Dilution Principle to Your Cases:**
      *   **Case 1 (Taking Refugees Sequentially):** The obligation to offer refuge (based on need, international law, or humanitarian principle) *should* apply whenever the qualifying conditions (persecution, danger) exist. The Dilution Principle kicks in when prior fulfillment (taking group A) is used *not* as proof of capacity or principle, but as grounds to weaken the obligation towards group B. "We already did this *for others*, therefore we are *less obligated* to do it *for you* (even though capacity exists)." The universality of the need (wars keep happening) dilutes the obligation per subsequent war.
      *   **Case 2 (Generalized Risk vs. Individualized Persecution):** Asylum law often requires a "particular social group" or individualized risk to distinguish refugees from those fleeing general hardship. The Dilution Principle *distorts* this necessary distinction. It doesn't just say "general hardship isn't grounds," it implicitly argues: "Because *everyone* is threatened, the threat to *you specifically* is *less severe* or *less deserving* of protection." The universality of the threat dilutes its perceived weight for the individual claimant. The claim *would* be strongest if only one person were threatened precisely because then the obligation wouldn't be diluted by universality.
      *   **Case 3 (Shared Causation & Shared Reception - Reciprocity of Dilution):** This is the most revealing case and confirms it's the same principle. Here, dilution operates bidirectionally on the *duty-bearer* side:
          *   **Dilution via Shared Causation:** "Our contribution (weapons, vote) was one of many; therefore, we cannot be singled out as *the* cause, so our *specific* obligation is diluted to near zero." The universality of contribution dilutes individual responsibility.
          *   **Dilution via Shared Reception:** "We have taken *some* refugees (shared the reception burden); therefore, our *specific* obligation is fulfilled, *even if the need continues and our capacity remains*." The universality of need and the act of sharing the response dilutes the ongoing obligation. **This is the *exact* same principle as Case 1, but applied to a duty arising from causation instead of pure humanitarianism.** The reciprocity proves it's a core logic: dilution applies whether we're talking about the *source* of the obligation or its *fulfillment*.

  3.  **Yes, the Third Case Belongs:** It is not a different animal. It demonstrates the Dilution Principle's flexibility and pervasiveness. It shows dilution working on the *attribution of responsibility* (causation) and the *discharge of responsibility* (reception), using the same core logic: shared burden/universality diminishes the specific obligation.

  4.  **Distinguishing the Dilution Principle:**
      *   **vs. Genuine Capacity Limits:** A genuine capacity argument says, "We physically *cannot* take more without catastrophic harm." The Dilution Principle says, "We *could*, but because we already took some (Case 1 & 3b) / because others are also threatened (Case 2) / because others also contributed (Case 3a), we are *less obligated* or *not obligated specifically*." It's normative attenuation, not material impossibility.
      *   **vs. Distributed Responsibility:** Distributed responsibility acknowledges that an obligation can be held by many actors. It does *not* inherently claim that each actor's share is *diminished* simply because others share it. A robust view of distributed responsibility might say, "We all share this duty; therefore, we *all* must act to our capacity." The Dilution Principle says, "Because others share this duty, *my* specific share is smaller (potentially vanishingly so)."
      *   **vs. General Duties Being Weaker:** Some duties *are* weaker because they are vague (e.g., "be kind"). The Dilution Principle is different. It takes a duty that *is* specific and weighty in its core instance (protect a refugee from *this* war, compensate for *this* harm you helped cause) and *attenuates* it solely because the *context* makes the duty widely applicable or shared. The core content (protection from violence, redress for harm) hasn't become more general; the *circumstances* involve more people. The principle misattributes the dilution.

  5.  **The Kantian Connection:** Your memory is sharp. Kant's "Perpetual Peace" (1795) argues for a "cosmopolitan right" of hospitality: the right of a stranger "not to be treated with hostility" and to seek "communal possession of the earth's surface." Crucially, Kant *explicitly* limits this right to a right to *visit* (to *seek* interaction), not a right to *settle*. His justification? **Precisely the Dilution Principle:** "In this way, distant parts of the world can establish with one another peaceful relations that may eventually be regulated by public laws, thus bringing the human race nearer and nearer to a cosmopolitan constitution." The right *must* be thin ("temporary sojourn") *because* it belongs to everyone universally. A thicker right (to settle) would, he feared, overwhelm host societies due to its universality. This is a direct philosophical ancestor of the phenomenon you observe. Kant formalized the logic: universal claim => necessary limitation to avoid overwhelming burden. Your cases show this logic operating perniciously in practice.

  **Why "The Dilution Principle" is the Right Term:**

  *   **Descriptive:** It captures the core idea – the *thinning out*, *weakening*, or *attenuation* of perceived obligation.
  *   **Mechanism-Focused:** It highlights *how* this happens – through the perceived effect of universality/widespread application.
  *   **Distinct:** It differentiates this specific, flawed logic from genuine capacity limits or the structure of distributed duties.
  *   **Exposes the Fallacy:** Labeling it a "Principle" ironically highlights its unjustified, yet often unchallenged, status in these arguments. It names the unspoken rule.

  **In essence:** The Dilution Principle is the erroneous belief that moral gravity leaks away when an obligation is no longer unique or narrowly focused. It weaponizes universality against the very individuals universality should protect. Your cases, including the reciprocal dilution of causation and reception in Case 3, are unified by this core mechanism. Recognizing it is the first step to challenging it.
