  **Assumption about distribution inside the range:** The case assumes that the chooser only knows the endpoints and does not have any information about the distribution inside the range. The typical assumption in ambiguity aversion experiments (like Ellsberg) is that every point in the range is equally likely (uniform distribution). However, in our case, the floor chooser only uses the minimum, the middle chooser only uses the average of the endpoints (which is the midpoint of the uniform distribution), and the width chooser only uses the width. So for the floor and width choosers, the uniform distribution is not necessary because they only care about the endpoints. The middle chooser, however, is implicitly assuming that the midpoint is a good representation of the average. If the distribution is not uniform, the midpoint might not be the mean. But in the absence of further information, the midpoint is often taken as the best guess.

