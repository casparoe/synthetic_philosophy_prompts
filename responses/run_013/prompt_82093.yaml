  **Scenario:** You are choosing a treatment for a patient. There are three treatments (A, B, C). Each treatment, if successful, leads to the same positive outcome (for example, full recovery). If not successful, the outcome is the same baseline (for example, no improvement). The success probabilities are not known precisely, but are given as ranges based on available evidence:

  - Treatment A: between 10% and 90% chance of success.
  - Treatment B: between 30% and 32% chance of success.
  - Treatment C: between 40% and 45% chance of success.

  The decision must be based solely on these ranges.

  Now, for the three choosers:

  1. **Floor chooser (worst-case focus):** They evaluate each option by its minimum possible success probability. 
     - A: 10%
     - B: 30%
     - C: 40%
