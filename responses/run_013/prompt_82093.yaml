  2. **Middle chooser (average focus):** They evaluate each option by the midpoint of its range.
     - A: (10% + 90%) / 2 = 50%
     - B: (30% + 32%) / 2 = 31%
     - C: (40% + 45%) / 2 = 42.5%
     They choose Treatment A because 50% is the highest average.

  3. **Width chooser (ambiguity averse, dislikes wide ranges):** They evaluate each option by the width of the range (the difference between the maximum and minimum). They prefer the option with the smallest width because it represents less ambiguity.
     - A: 90% - 10% = 80% (width)
     - B: 32% - 30% = 2% (width)
     - C: 45% - 40% = 5% (width)
     They choose Treatment B because its width (2%) is the smallest.

