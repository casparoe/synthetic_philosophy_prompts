answer: |-
  Your distinction crumbles under scrutiny. The ordinal theorem isn’t superseded—it’s the exposed nerve. Gibbard-Satterthwaite demonstrates that with unrestricted preferences and three or more outcomes, strategy-proofness *forces* dictatorship. When you retreat to cardinal ballots, Gibbard’s 1977 extension proves strategy-proofness still demands linear utility aggregation, collapsing back to a dictatorship or else opening manipulation. Randomization? Hylland’s theorem and the random dictatorship characterization confirm that strategy-proofness under expected utility *is* dictatorship diluted by lottery, not avoided. A random dictator *is* a dictator over the probability distribution; calling it "far from deterministic" misses that the *structure* of power remains unipolar: one voter dictates every outcome’s odds. The impossibility bites identically across all generalizations: non-dictatorship, strategy-proofness, and unrestricted domains cannot coexist. The ordinal theorem’s distinctive work is foundational—it strips voting mechanisms bare to reveal this core conflict without the distracting machinery of utilities or chance. Every extension reinforces, not escapes, that original stark lesson: drop any one condition, or accept dictatorship. There is no third way.
