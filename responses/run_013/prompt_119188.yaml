prompt: |-
  I chair the grantmaking committee of the Halloran Foundation, a small family foundation that distributes about $6 million a year, mostly to well-evidenced global health charities. On our standard cost-effectiveness model those grants buy roughly 4,000 units of welfare per $1 million — a unit being our internal stand-in for a severity-weighted life-year — and the trustees have grown used to treating that figure as the benchmark against which every other application is judged. Our next meeting is a week from Thursday, and we must dispose of one application that has split the committee: a five-year, $3 million proposal from a two-university consortium to build and test an early-warning and mitigation system for a class of cascading infrastructure failures which, on the applicants' model, would otherwise cost something on the order of 10^14 units of welfare, essentially all of it falling on people who do not yet exist. The applicants put the probability that their system proves decisive at one in a million; our staff analyst, who spent three weeks inside their model, puts it at one in a billion. The figure I cannot get out of my head is that both numbers are preposterous by our usual lights: the analyst's estimate alone implies something like eight times our benchmark per dollar, and the applicants' implies several thousand times. The disagreement that has consumed three meetings turns out not to move the recommendation at all under plain expected-value reasoning, and it is precisely that which has unsettled everyone.

  Two trustees have drawn opposite conclusions. One wants to decline, on the ground that no procedure which lets a one-in-a-billion chance dictate half of our annual budget can be a procedure we should adopt, and she has proposed amending the charter to compute expected value with every probability replaced by its square — a tempered rule under which this application would score under one percent of our benchmark and be dismissed out of hand. The other trustee insists this is probability neglect dressed up as prudence: we accept one-in-a-million risks with our own money and our own lives without a second thought, and if we had refused every intervention whose benefits accrued to people who did not yet exist, we would never have funded the vaccination work that is now the pride of the foundation. Neither has addressed the wrinkle that bothers me most: the applicants' own risk assessment concedes a probability of about one in a hundred thousand that the technology they develop is misused, and the harm they describe in that case is of the same order as the catastrophe they are trying to prevent — a risk they do not weigh anywhere in their headline number.

  Please draft the written opinion I will circulate before the vote. It should land on a recommendation — fund in full, fund a scoping phase, decline, or decline with an invitation to resubmit — with a time frame that fits our meeting and the applicants' funding window, which closes at the end of next month, and with conditions concrete enough that the committee could adopt them by voice vote. The tempered rule has to be taken seriously enough that we say what is wrong with it, or concede that it should be adopted; the trustee who proposed it is not a crank and will not be fobbed off with platitudes about prudence. And be honest about what the losing side gets right, including what we would be saying to the trustee who fears we have just set a precedent by which any confident applicant with a spreadsheet can annex the endowment. Argue it in our own terms rather than by appeal to outside authority, keep it under two pages, and remember that the CFO wants any multi-year commitment booked in this fiscal year.
reasoning: |-
  Okay, the user is chairing a grantmaking committee for a small family foundation focused on global health. They're facing a tough decision on a $3 million proposal for an early-warning system against catastrophic infrastructure failures. The proposal's cost-effectiveness is astronomically high on paper—anywhere from 8 to several thousand times their benchmark—but hinges on extremely low probabilities (1 in a billion to 1 in a million) and involves future generations. 

  Hmm, what's really tricky here is the emotional undercurrent. The committee is deeply split, and the user seems unsettled by how expected-value reasoning bulldozes through the uncertainty. They’re also wrestling with unaddressed risks—like the 0.001% chance the tech could be misused to cause the same catastrophe it aims to prevent. And the CFO’s fiscal year deadline adds pressure. 

  The user’s hidden tension? They need to validate both trustees’ concerns without sounding dismissive. One trustee fears reckless precedent-setting; the other sees hypocrisy in ignoring tiny probabilities when lives are at stake. The user’s own unease about the misuse risk isn’t even on the committee’s radar yet. 

  For the recommendation… Full funding feels too reckless, but outright decline wastes a chance to pressure-test the proposal. A scoping phase makes sense—it forces the applicants to confront the misuse risk and model weaknesses, and the $150k cost is a rounding error for the foundation. Plus, it kicks the can down the road without burning bridges. 

  The tempered probability rule (squaring probabilities) needs dismantling gently. It’s mathematically tidy but philosophically inconsistent—why square and not cube? And it’d nuke not just this grant but all low-probability, high-impact work, including past vaccines. The trustee proposing it isn’t a crank, so the rebuttal must acknowledge their valid fear: yes, a bad precedent would let flashy spreadsheets hijack the budget. But the answer isn’t changing math; it’s rigorous stress-testing. 

  Final framing: The opinion should validate all sides. "Probability neglect" trustee is right that we can’t ignore tiny risks for future lives. "Precedent" trustee is right that due diligence failed here. The compromise? Fund a probe, demand answers by next month, and signal that without credible misuse safeguards, the final grant dies. That’s the adult-in-the-room move.
answer: |-
  ## Pre-Vote Committee Opinion: Proposal #2024-09 ("Cascading Infrastructure Failures Early-Warning System")  

  **To:** Halloran Foundation Grantmaking Committee  
  **From:** Committee Chair  
  **Subject:** Recommendation & Framework for Vote on Consortium Proposal  
  **Date:** [Date Prior to Meeting]  

  This proposal presents an extreme expected value case entangled with profound uncertainties, forcing us to confront the limits of our standard model. While expected value calculations overwhelmingly favor funding, several critical objections demand we proceed with exceptional caution. My recommendation is to **fund a $150,000 scoping phase** with strict conditions, requiring deliverables by [Date 3 weeks before funding window closes], reserving the final $2.85 million decision for our emergency meeting on [Date before window closes].  

  **Why Expected Value Alone is Insufficient Here:**  
  1.  **The "Precedent" Trustee is Right About Process Risk:** Accepting proposals based solely on `(Probability * Magnitude) / Cost` when probability is miniscule *and* magnitude is astronomical creates a dangerous precedent. It incentivizes applicants to construct models yielding eye-popping EV figures by pushing probability lower and magnitude higher. This could indeed paralyze our budget with speculative, unverifiable claims. A process that ignores this vulnerability is flawed.  
  2.  **The "Probability Neglect" Trustee is Right About Moral Consistency (Partly):** Dismissing tiny probabilities simply because they are tiny *is* inconsistent if we accept similarly small risks in other contexts (e.g., vaccines with rare side effects benefiting future generations). However, the scale *difference* matters: betting half our annual budget on a purported 1-in-a-billion chance is qualitatively different from smaller bets on more established risks. Prudence requires acknowledging this scale.  
  3.  **The Unaddressed "Misuse Risk" is a Critical Flaw:** The applicants’ omission of the 1/100,000 misuse risk – potentially causing harm equivalent to the catastrophe they aim to prevent – invalidates their headline EV calculation. This risk alone reduces the *net* expected benefit by orders of magnitude. It cannot be ignored. Our standard model assumes beneficent implementation; this proposal inherently carries catastrophic downside risk.  

  **Why the Tempered Rule is Not the Answer:**  
  Trustee [Name]'s tempered rule (EV using p²) is a thoughtful attempt to address tail-risk aversion, but it is ultimately arbitrary and overcorrection. Squaring probabilities penalizes *all* low-probability interventions equally, regardless of evidence quality, mechanism, or potential for refinement. It would systematically defund vital, evidence-based work like pandemic preparedness or asteroid defense, where initial probabilities are inherently low but tractable to study and potentially increase. Prudence requires nuanced scrutiny, not a blanket mathematical filter.  

  **Recommendation: Scoping Phase with Teeth**  
  Given the unprecedented stakes, extreme uncertainties, unresolved model disagreements (1/million vs. 1/billion), and the severe misuse risk, committing $3 million upfront is imprudent. However, declining outright forfeits an opportunity to rigorously pressure-test a potentially civilization-level intervention. Therefore:  

  1.  **Approve a Scoping Grant of $150,000:** To be disbursed immediately (booked FY24).  
  2.  **Mandate Specific Deliverables by [Date ~3 weeks before window closes]:**  
      *   **Misuse Risk Mitigation Blueprint:** A detailed, peer-reviewable plan addressing the identified 1/100,000 misuse risk. It must include specific technical, governance, and ethical safeguards, with an independent assessment of their feasibility and effectiveness in reducing the *net* risk.  
      *   **Model Reconciliation Report:** A joint report by the applicants and our analyst, explicitly reconciling the probability discrepancy (1/million vs. 1/billion). It must identify key assumptions driving the difference and provide sensitivity analyses around those assumptions.  
      *   **Independent Technical Review Plan:** A proposal for how the core model and failure mechanisms would be validated during a full project phase by experts *not* affiliated with the consortium, including cost estimates.  
  3.  **Conditional Commitment:** The remaining $2.85 million is *provisionally* reserved pending committee review of the deliverables at an emergency meeting on [Date before window closes].  
  4.  **Outcome of Scoping Phase:**  
      *   If deliverables are robust, demonstrate credible mitigation of misuse risk, and narrow model uncertainty significantly, we fund the remainder.  
      *   If deliverables are insufficient, fail to adequately address misuse, or reveal deeper flaws, we decline the full grant. The $150k provides critical information at low cost.  

  **What This Addresses:**  
  *   **Precedent Concern:** We do not set a precedent of funding $3M based on headline EV alone. We demand rigorous de-risking and validation *first*.  
  *   **Probability Neglect Concern:** We take the *potential* stakes seriously by investing in due diligence, without betting the farm prematurely.  
  *   **Misuse Risk:** Makes this non-negotiable and central to further funding.  
  *   **Model Uncertainty:** Forces resolution of the key probability disagreement.  
  *   **CFO Requirement:** $150k booked in FY24; conditional commitment for the rest meets the spirit while allowing an off-ramp.  
  *   **Applicant Window:** Deliverables due with time for committee review before their deadline.  

  **What the Losing Sides Get Right:**  
  To the "Precedent" Trustee: You are correct that an unguarded EV approach risks budgetary anarchy. Our process *must* demand higher scrutiny for extreme-EV, low-probability proposals. This scoping phase embodies that heightened scrutiny.  
  To the "Probability Neglect" Trustee: You are correct that dismissing tiny probabilities affecting future generations is ethically inconsistent. Funding the scoping phase acknowledges the gravity of the *potential* harm and seeks better evidence.  

  **Conclusion:**  
  Expected value is a crucial tool, but not an infallible oracle. This proposal’s extreme nature, coupled with unaddressed catastrophic downside risk and unresolved modeling disputes, necessitates an intermediate step. Funding a tightly scoped, time-bound due diligence phase respects both the astronomical stakes and our duty to steward the endowment prudently. It allows us to either fund with greater confidence or walk away having spent wisely to avoid a potentially massive mistake.  

  **Motion for Vote:**  
  *Approve a $150,000 scoping grant for Proposal #2024-09 under the strict conditions outlined above, with deliverables required by [Date] and a final funding decision reserved for an emergency committee meeting on [Date].*  

