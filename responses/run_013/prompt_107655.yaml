answer: |-
  ## Research Proposal: Commutativity Conditions for Jeffrey Conditionalization Under Uncertain Evidence

  **The Problem of Order-Dependence in Uncertain Evidence Updates**

  Bayesian epistemology provides a powerful framework for rational belief revision. Standard conditionalization requires learning a proposition with certainty. Jeffrey conditionalization (Jeffrey, 1965) generalizes this to handle *uncertain evidence*: situations where the agent acquires new information prompting a direct shift in their credence over a partition, without certainty in any single cell. It updates other propositions via a weighted average of conditionalizations on each partition cell. However, applying Jeffrey's rule reveals a significant practical puzzle: sequences of updates often fail to commute. Updating on uncertain evidence E before F can yield a different final state than updating on F before E. Similarly, updating on a coarse partition in one step can differ from updating on a refined version in multiple steps. This non-commutativity is troubling for a rule purporting to generalize rational updating. Standard treatments either dismiss uncertain evidence as illegitimate (Levi, 1967), arguing only certain evidence justifies belief revision, or formally define it as the limit of certain evidence (van Fraassen, 1980), sidestepping the iterated case. Consequently, the conditions under which sequences of Jeffrey updates commute remain unaddressed. This leaves a gap: when, precisely, can an agent rationally process multiple pieces of uncertain evidence without the order or granularity of description affecting the outcome?

  **The Core Question and Why Existing Views Leave it Open**

  This project asks: **Under what necessary and sufficient conditions on the structure of the evidence propositions and the likelihoods governing the agent’s response to sensory data does a sequence of Jeffrey updates commute?** Existing positions leave this open for two reasons. First, the *illegitimacy* position (e.g., Levi) denies uncertain evidence is evidence at all; it rejects the very applicability of Jeffrey's rule for genuine belief revision, so commutativity is moot. Second, the *limiting-case* approach (e.g., Jeffrey himself, van Fraassen) focuses on single updates or defines uncertain evidence via hypothetical certainties, neglecting the dynamics of sequential updating with genuinely noisy inputs. Neither camp engages with the concrete computational behavior of iterated Jeffrey updates applied to realistically vague sensory data. The formalism exists, but its operational consequences for sequences remain unexplored territory.

  **The Approach: From Input Reformulation to Formal Conditions**

  Instead of debating the ontology of evidence, this project reformulates the *input* to Jeffrey's rule. The core hypothesis is that non-commutativity arises because Jeffrey’s rule accepts a *new probability distribution* over a partition as input (P_new(E_i)), but this distribution conflates the agent’s prior beliefs with the *likelihood* of the sensory experience given the world state (P(Sensory Data | H)). The key move is to model uncertain evidence not as a new probability, but as an *experience* S that provides *likelihood information* P(S | E_i) for cells E_i of a partition relevant to S. Updating then involves:

  1.  **Constructing the Input Probability:** The new probability for E_i is calculated via Bayes' theorem using the prior P_old(E_i) and the likelihood P(S | E_i): P_new(E_i) ∝ P_old(E_i) * P(S | E_i).
  2.  **Applying Jeffrey's Rule:** This calculated P_new(E_i) is used as the input for Jeffrey conditionalization on the partition {E_i}.

  This reframing separates the evidential input (the likelihood P(S | E_i)) from the agent's prior state. The project will:

  1.  **Construct Counterexamples:** Explicitly compute iterated Jeffrey updates using both the standard (input P_new) and proposed (input P(S|E_i)) approaches on small, numerical cases known to exhibit non-commutativity (e.g., learning vague properties of objects sequentially).
  2.  **Test the Reformulation:** Apply the likelihood-input method to these cases. Does commutativity (or a specific, predictable non-commutativity) emerge? Does coarsening/refinement invariance hold?
  3.  **Isolate Commutativity Conditions:** Analyze why commutativity holds or fails in the reformulated cases. Test the "rigidity" hunch (do the meanings of E_i stay fixed?) and other factors (partition structure, independence of likelihoods, relation to underlying state). Formulate precise mathematical conditions (e.g., on the relationship between partitions or the nature of the sensory data S).
  4.  **Generalize and Formalize:** Attempt to prove a theorem: *If conditions X, Y, Z hold on the sequence of partitions and the likelihood functions associated with each sensory input, then the sequence of Jeffrey updates (using the likelihood-input method) commutes / is partition-invariant.* Or, find robust counterexamples showing no non-trivial conditions exist.

  **Why this Approach, Not Purely Philosophical?**

  While the "real evidence" question is philosophically deep, the observed non-commutativity is a concrete, technical flaw in the *application* of the leading formal tool. Addressing the flaw requires engaging with the mechanics of the rule itself. A successful formal result, showing commutativity *is* possible under specific, interpretable conditions when inputs are properly described as likelihoods, would directly bear on the philosophical debate: it would demonstrate a coherent, operational role for uncertain evidence within Bayesian revision. Conversely, proving commutativity is generally impossible under the reformulation would suggest Jeffrey updating fundamentally encodes order-sensitivity, strengthening the illegitimacy view or demanding alternative formalisms.

  **Deliverables, Failure, and Scope Management**

  *   **Success:** A clear result takes one of two forms:
      *   *Positive:* A formally stated, non-trivial sufficient (and ideally necessary) condition for commutativity under the likelihood-input reformulation, with proof. The condition should be interpretable (e.g., "evidence propositions must be rigidly designating," "sensory inputs must be conditionally independent given the underlying state," "partitions must be nested").
      *   *Negative:* Proof that no plausible condition ensures commutativity for non-trivial cases under the reformulation, demonstrating inherent order-dependence.
      Either result clarifies the preconditions for coherent uncertain evidence updating. A positive result suggests uncertain evidence *can* be genuine if the conditions hold; a negative result reinforces skepticism.
  *   **Failure:** The project fails if no clear condition emerges and counterexamples remain messy and resistant to generalization, leaving the formal question indeterminate. Failure could also occur if the reformulation simply collapses into triviality (e.g., commutativity only holds when evidence *is* certain).
  *   **Scope Risks and Mitigation:** The **single biggest scope risk** is Step 3 ("Isolate Commutativity Conditions"). Finding a clean, generalizable condition is highly non-trivial; the space of possible partition structures and likelihood dependencies is vast. This could consume excessive time.
      *   *Mitigation:* Strictly limit complexity. Focus on 2-3 step sequences over simple partitions (e.g., binary or ternary). Prioritize characterizing *failure* cases clearly if a positive condition proves elusive. Explicitly defer deep philosophical analysis of "real evidence" to future work; the core deliverable is the formal result about Jeffrey's rule's behavior.
      *   **What Remains Open:** Even with a positive result, the *epistemic justification* for interpreting experiences as providing specific likelihoods P(S|E_i) remains open. The project establishes *how* Jeffrey updates *could* commute, not whether agents *do* or *should* access evidence in this specific likelihood-based way.

  **Conclusion**

  This project tackles a demonstrable technical problem in the application of Jeffrey conditionalization—non-commutativity under iterated uncertain updates—that has been overlooked by both critics and proponents of uncertain evidence. By reformulating the rule’s input as likelihood information derived from sensory experiences rather than raw probability shifts, it aims to uncover precise mathematical conditions under which sequential updating becomes order and partition invariant. Success will provide a crucial formal foundation for evaluating whether uncertain evidence can function coherently within Bayesian belief revision, while failure will rigorously demonstrate a fundamental limitation of the Jeffrey framework. The focus on formal tractability ensures feasibility within a semester, while opening a vital avenue for future philosophical interpretation.

