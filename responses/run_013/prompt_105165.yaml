prompt: |-
  I'm in a philosophy of biology course and we've been stuck on whether DNA is really a code. My prof keeps saying there's a weak sense of code where it's just an arbitrary mapping from codons to amino acids and a strong sense where it's a semantic code that actually represents information, and the whole thing turns on whether the ribosome is a decoder or just a causal machine. Write a joke about this. It should be funny to people who actually know the debate, so the punchline should turn on that weak/strong distinction or the decoder-vs-causal-machine thing, not just omg DNA is code lol. Def not looking for a gene/jeans pun.
