  My mate and I just burned two hours argueing about that experiment where a chairman is told his new program will boost profits and also either hurt or help the environment, and he says he couldn't care less about the environment, he just wants the profit -- and people say he hurt it on purpose but that he didn't help it on purpose. He reckons that shows "intentionally" is just a blame word, not a fact about anyone's mind, and then he pushed it: if the good your action produces is only a side effect you get no credit, and if it was your actual goal then everyone says you were only in it for yourself, so you can never intentionally do anything good, only bad. I don't fully buy it but I laughed. Write me a joke that runs on that asymmetry -- the punchline has to actually turn on the structure of it, not just name-drop the experiment, so someone who knows the literature laughs and someone who doesn't still follows. Commit to one version, don't hand me three to choose from, and at the end say where the joke takes liberties with what the studies actually found or leans on a contested reading of "intentional."
