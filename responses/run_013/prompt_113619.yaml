answer: |-
  ### Principles Fitting Your Verdicts

  Your intuitive verdicts align with a refined version of the **Principal Principle (PP)**, combined with **Bayesian updating** and a distinction between **objective chance** and **epistemic uncertainty**. The core idea is that credence should match the known chance when available, but must account for uncertainty about the chance itself and update on new evidence. Here’s the framework:

  1. **Principal Principle (PP) for Known Chances**:  
     If you know the objective chance of an event \(A\) is \(p\), and you have no further relevant evidence, set your credence to \(p\):  
     \[ \text{Cr}(A \mid \text{ch}(A) = p) = p. \]  
     **Accommodates**: Fair coin (0.5), weighted coin (0.9), radioactive atom (match half-life).

  2. **Expected Chance Principle (ECP) for Unknown Chances**:  
     If the objective chance is unknown, set credence to the *expected value* of the chance, weighted by your beliefs:  
     \[ \text{Cr}(A) = \sum_{i} \text{Cr}(\text{ch}(A) = p_i) \cdot p_i. \]  
     **Accommodates**: Double-headed/tailed coin (0.5, averaging 0 and 1). Also applies to the hidden-outcome coin before looking (0.5, based on known past chance).

  3. **Bayesian Updating on Evidence**:  
     When new evidence \(E\) arrives, update credence via Bayes’ theorem, even if it contradicts a known chance:  
     \[ \text{Cr}(A \mid E) = \frac{\text{Cr}(E \mid A) \cdot \text{Cr}(A)}{\text{Cr}(E)}. \]  
     **Accommodates**: Oracle case (credence shifts from 0.9), and updating after lifting the cup (0.5 → 0 or 1).

  4. **Epistemic Credence for Non-Chance Events**:  
     For events without objective chance (e.g., unknown facts), credence is based solely on evidence and priors (standard Bayesianism).  
     **Accommodates**: Lost manuscript (credence based on evidence, no "chance").

  ### Handling Your Cases
  - **Fair coin (0.5)**: PP (clause 1).  
  - **Weighted coin (0.9)**: PP (clause 1); hunches without evidence are ignored.  
  - **Double-headed or -tailed (0.5)**: ECP (clause 2); expectation over unknown chances.  
  - **Hidden-outcome coin**:  
    - *Before lifting*: ECP (clause 2); expectation based on past chance (0.5).  
    - *After lifting*: Bayesian update (clause 3); evidence overrides past chance.  
  - **Radioactive atom**: PP (clause 1); credence matches known chance.  
  - **Lost manuscript**: Epistemic credence (clause 4); no chance, but credence from evidence.  
  - **Oracle case**: Bayesian update (clause 3); oracle’s statement is evidence that shifts credence away from 0.9.

  ### Oracle Case: The "Pull" Is Correct
  Your feeling of being pulled below 0.9 is **not a mistake**. The oracle provides strong evidence (999/1000 accuracy), and Bayesian updating *requires* adjusting credence:  
  - Initial \(\text{Cr}(\text{heads}) = 0.9\).  
  - Oracle says "tails" → update using Bayes:  
    \[
    \text{Cr}(\text{heads} \mid \text{oracle says tails}) \approx 0.009, \quad \text{Cr}(\text{tails} \mid \text{oracle says tails}) \approx 0.991.
    \]  
  This is consistent with the PP because the oracle’s statement is **admissible evidence**—it directly pertains to the outcome. The PP demands conditioning on *all* evidence, not just the chance.

  ### Predictions for New Cases
  1. **Biased die with a witness**:  
     - A die has a known 1/6 chance of rolling a six. A witness (correct 80% of the time) says "six."  
     - **Prediction**: Credence in six rises to \(\approx 0.286\) (Bayesian update), not 1/6.  
     - *Calculation*:  
       \[
       \text{Cr}(\text{six} \mid \text{witness}) = \frac{(0.8) \cdot (1/6)}{(0.8) \cdot (1/6) + (0.2) \cdot (5/6)} \approx 0.286.
       \]

  2. **Unknown coin bias with a flip**:  
     - Coin is fair (50%) or always heads (50% prior). First flip is heads.  
     - **Prediction**: Credence for heads on next flip is \(5/6 \approx 0.833\) (ECP + Bayesian update).  
     - *Reasoning*:  
       - After first heads: \(\text{Cr}(\text{fair}) = 1/3\), \(\text{Cr}(\text{biased}) = 2/3\).  
       - Expected chance of next heads: \((1/3)(0.5) + (2/3)(1) = 5/6\).

  ### What Must Change? Your Verdicts Stand
  **None of your verdicts need overturning**. The framework above (PP + ECP + Bayesian updating) accommodates all cases. The oracle case forces you to accept:  
  - **Extra machinery**: Explicit Bayesian updating on new evidence, even when it contradicts a known chance. The PP is not violated—it is applied *conditional on total evidence*.  

  \answer{none}
