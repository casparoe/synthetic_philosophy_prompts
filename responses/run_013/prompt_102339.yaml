  We are given a prior probability for D: P(D)=1/2. We assume that the tests are independent conditional on D and on ~D. The likelihoods are:

     P(E1|D) = 4/5, so P(~E1|D)=1/5
     P(E1|~D)=1/5, so P(~E1|~D)=4/5
     P(E2|D)=3/4, so P(~E2|D)=1/4
     P(E2|~D)=1/4, so P(~E2|~D)=3/4

  First, we compute the Monday-Tuesday update (first E1 then E2).

  Step 1: Update on E1 with P_new(E1)=2/3.
  We need the conditional probabilities of D given E1 and given ~E1 from the prior.

     P(E1) = P(E1|D)P(D) + P(E1|~D)P(~D) = (4/5)(1/2) + (1/5)(1/2) = (4/10)+(1/10)=5/10=1/2.
     P(D|E1) = [P(E1|D)P(D)] / P(E1) = [(4/5)(1/2)] / (1/2) = (4/10)/(1/2) = (4/10)*(2/1)=8/10=4/5.
     P(D|~E1) = [P(~E1|D)P(D)] / P(~E1) = [ (1/5)(1/2) ] / (1/2) = (1/10)/(1/2)=1/5? 
          But note: P(~E1)=1-P(E1)=1/2, so indeed (1/10)/(1/2)=1/5.

  Therefore, after the Jeffrey update on E1:
     P_new(D) = P(D|E1)*P_new(E1) + P(D|~E1)*P_new(~E1) = (4/5)*(2/3) + (1/5)*(1/3) = (8/15) + (1/15) = 9/15 = 3/5.

  Step 2: Update on E2 with P_new(E2)=3/4.
  We need the conditional probabilities of D given E2 and given ~E2 from the current distribution (after step 1).

  First, note that the current P(D)=3/5, and the likelihoods for E2 remain unchanged (by the rigidity condition).

     P(E2) = P(E2|D)P(D) + P(E2|~D)P(~D) = (3/4)(3/5) + (1/4)(2/5) = (9/20) + (2/20) = 11/20.
     P(D|E2) = [P(E2|D)P(D)] / P(E2) = [(3/4)(3/5)] / (11/20) = (9/20) * (20/11) = 9/11.
     P(D|~E2) = [P(~E2|D)P(D)] / P(~E2) = [ (1/4)(3/5) ] / (9/20)  [since P(~E2)=1-11/20=9/20]
               = (3/20) * (20/9) = 3/9 = 1/3.

  Therefore, after the Jeffrey update on E2:
     P_new(D) = P(D|E2)*P_new(E2) + P(D|~E2)*P_new(~E2) = (9/11)*(3/4) + (1/3)*(1/4) = 27/44 + 1/12.

  Compute: 
     27/44 = 81/132, 1/12=11/132, so total 92/132 = 23/33.

  So after Monday-Tuesday, P(D)=23/33 ≈ 0.697.

  Now, the Wednesday update (first E2 then E1).

  Step 1: Update on E2 with P_new(E2)=3/4.
  From the prior:

     P(E2) = P(E2|D)P(D)+P(E2|~D)P(~D) = (3/4)(1/2)+(1/4)(1/2)=3/8+1/8=4/8=1/2.
     P(D|E2) = [ (3/4)(1/2) ] / (1/2) = 3/4.
     P(D|~E2) = [ (1/4)(1/2) ] / (1/2) = 1/4.

  Therefore, after the Jeffrey update on E2:
     P_new(D) = (3/4)*(3/4) + (1/4)*(1/4) = 9/16 + 1/16 = 10/16 = 5/8.

  Step 2: Update on E1 with P_new(E1)=2/3.
  From the current distribution (after step 1: P(D)=5/8, P(~D)=3/8):

     P(E1) = P(E1|D)P(D)+P(E1|~D)P(~D) = (4/5)(5/8) + (1/5)(3/8) = (4/8) + (3/40) = 20/40 + 3/40 = 23/40.
     P(D|E1) = [P(E1|D)P(D)] / P(E1) = [(4/5)(5/8)] / (23/40) = (4/8) * (40/23) = (1/2)*(40/23)=20/23.
     P(D|~E1) = [P(~E1|D)P(D)] / P(~E1) = [ (1/5)(5/8) ] / (17/40)  [since P(~E1)=1-23/40=17/40]
               = (1/8) * (40/17) = 5/17.

  Therefore, after the Jeffrey update on E1:
     P_new(D) = (20/23)*(2/3) + (5/17)*(1/3) = 40/69 + 5/51.

  Compute: 
     40/69 = 40*17/(69*17)=680/1173, 5/51=5*23/(51*23)=115/1173, so total 795/1173.

  Simplify by dividing numerator and denominator by 3: 265/391 ≈ 0.678.

  So after Wednesday, P(D)=265/391 ≈ 0.678.

  The two orders yield different probabilities: 23/33 ≈ 0.697 and 265/391 ≈ 0.678. Therefore, the order of Jeffrey updates matters.

  Now, consider the claim: "Uncertain evidence can always be handled by ordinary conditionalization on a higher-order proposition that states what your new credence in the evidence proposition should be." Let H1 be "I have evidence that warrants setting P(E1)=2/3" and H2 be "I have evidence that warrants setting P(E2)=3/4". If we were to update by conditionalizing on H1 and then on H2 (or both at once), we would get a single posterior probability for D. Moreover, ordinary conditionalization is commutative: the order of conditionalizing on H1 and H2 does not matter. Therefore, the result would be the same regardless of the order. But in our case, the two orders of Jeffrey updates yield different results. This shows that the Jeffrey update procedure is not equivalent to conditionalizing on the higher-order propositions.

  The reason for the difference lies in the rigidity condition. Jeffrey conditionalization assumes that the conditional probabilities of all other propositions given each element of the partition (here {E1,~E1} and {E2,~E2}) remain unchanged. This rigidity condition allows the update to be done by simply reweighting by the new probabilities of the partition. However, when we conditionalize on the higher-order proposition, we are effectively modeling the evidence as a certain event. The higher-order update may change the conditional probabilities of the evidence partition elements given the underlying state (D or ~D) in a way that violates rigidity. In other words, the higher-order update may not preserve the conditional probabilities P(E1|D), P(E1|~D), etc.

  In our example, the rigidity condition holds for the Jeffrey updates: we assumed that the likelihoods (P(E1|D), etc.) do not change during the updates. But if we were to model the higher-order update, we would need to specify how exactly the higher-order evidence affects our beliefs. Without a specific model, we cannot assume that the conditional probabilities remain rigid. Therefore, the Jeffrey update is a distinct rule that relies crucially on the rigidity of the conditional probabilities. It cannot be reduced to ordinary conditionalization without sacrificing the simplicity that the rigidity condition provides.

  In conclusion, the claim that uncertain evidence is a non-problem because it can be reduced to higher-order conditionalization is false. The non-commutativity of Jeffrey updates demonstrates that they are not equivalent to higher-order conditionalization. The rigidity condition is essential for Jeffrey conditionalization, and it allows for a local update that does not require modeling the entire evidence-generating process. Thus, Jeffrey conditionalization is a separate and valuable rule for updating beliefs with uncertain evidence.

  Marking scheme (300-350 words)

  Total marks: 20, distributed as follows:

  1. Correct computation for the Monday-Tuesday update (first E1 then E2) leading to P(D)=23/33. (5 marks)
     - Common mistake: Failing to use the updated probability of D after the first update when computing P(E2) for the second update.

  2. Correct computation for the Wednesday update (first E2 then E1) leading to P(D)=265/391. (5 marks)
     - Common mistake: Not updating the probability of D before the second step, or miscalculating P(E1) in the second step.

  3. Clear explanation that the two results are different and that Jeffrey updates do not commute. (3 marks)
     - Common mistake: Not explicitly stating the difference or misreporting the numbers.

  4. Explanation of why the non-commutativity shows that Jeffrey updates are not equivalent to higher-order conditionalization. (4 marks)
     - Common mistake: Arguing that the higher-order update would be the same in both orders because ordinary conditionalization commutes, but failing to connect this to the difference in outcomes.

  5. Discussion of the role of rigidity and the distinctness of Jeffrey conditionalization. (3 marks)
     - Common mistake: Mentioning rigidity but not explaining how it is essential to the Jeffrey update and how it might be violated in the higher-order model.

  Common failure modes (150 words)

  - Calculation errors: Given the fractions, students might make arithmetic mistakes. If the method is correct but there is a minor calculation error, we take off 1-2 marks per update. However, if the error propagates and the student fails to show the non-commutativity, then the explanation part cannot be fully credited. We expect the calculations to be shown step by step.

  - Missing the independence assumption: Some students might forget to use the independence of the tests given D and ~D. This would lead to incorrect conditional probabilities. Remind them in the question.

  - Confusing the order: Some students might swap the updates in the two scenarios. Emphasize "Monday-Tuesday" and "Wednesday".

  - Superficial explanation: Simply stating that the two methods are different without explaining why the commutativity of higher-order conditionalization is the key point. This would lose marks in part 4 and 5.

  - Ignoring rigidity: Failing to discuss the rigidity condition and its role in Jeffrey conditionalization would miss the core of the issue.

  We hope that this question will test the depth of understanding beyond the update rule.
