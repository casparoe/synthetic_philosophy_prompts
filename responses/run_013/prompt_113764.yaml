prompt: |-
  You're a decision theorist who's spent years on choice under ambiguity — Ellsberg-style stuff — and you're unusually good at explaining it to people who haven't read any of it. Think carefully before you answer, and start by brainstorming what the research on ambiguity aversion does and doesn't actually show, because the pop version of it gets a lot wrong.

  Context: I'm a program officer at a mid-size foundation. I recomend grants of $1-3M, maybe 30-40 a year, and my committee has to sign off. The recurring shape of my problem is this: I can fund an approach with a real evidence base, where I roughly know the odds, or a newer approach where nobody can honestly tell me the odds. My board reads that as "risky" and leans to the known thing, and so do I. But I have a nagging feeling we're leaving value on the table — and also that sometimes the aversion is exactly right.

  Write me a decision procedure I can actually run on a proposal, grounded in what's really known about ambiguity aversion rather than the slogan version. Questions in order, what counts as a good enough answer to each, where it stops with a no, and where it hands the decision back to a person because its a values question rather than a factual one. Things it has to handle, because these are where I get stuck:

  - The difference between not knowing the odds and not knowing what the possible outcomes even are. Ellsberg's urn is the first kind; my grant decisions often feel like the second. Does the procedure apply to the second, and if not, say so plainly.
  - The move of trying to convert ambiguity into risk — base rates for analogous things, a distribution over the unknown probability — and how to tell honest conversion from fake precision.
  - The case where the missing information is being withheld by someone with an interest in my choice. My instinct is that's where the aversion stops being a bias.
  - The case where reducing the ambiguity is cheap: a pilot, a phone call to someone who's tried it. If information is cheap, the procedure should tell me to go get it, not to choose.
  - The fact that I do this forty times a year. A standing policy of dodging the ambiguous option has a cost that compounds, and no single decision shows it to me.
  - Whether the aversion only bites because I'm comparing my knowledge to someone else's. I notice I feel it much less when I'm the most informed person in the room.

  Also the coherence trap: if I'd rather bet on red than on black, and also rather bet on black-or-yellow than on red-or-yellow, I've contradicted myself, because those two pairs differ only in what happens on yellow. Whatever procedure you give me should make me catch myself doing that kind of thing, not just catch myself being timid.

  Then run it on three cases: (1) a well-evidenced literacy program with a known-ish effect size against a novel tutoring model with no track record; (2) renewing a program we've funded for years whose evaluation is weak, against a new one with strong evidence; (3) a case where the procedure gives me an answer I won't like — you pick whether that's fund the ambiguous option or no, your aversion here is doing real work, but make it a case where I'd rather hear the opposite.

  Last thing: be honest about what the procedure can't do — where it's just dressing up a judgment call, and how it would misfire.
reasoning: |-
  Okay, the user is a program officer at a foundation, handling significant grant decisions. They're struggling with ambiguity aversion in choosing between proven programs and innovative but uncertain ones. They need a practical decision procedure grounded in real research, not pop misconceptions. 

  First, I need to debunk common myths about ambiguity aversion. Pop psychology often oversimplifies it as "people fear the unknown," but the research shows it's more nuanced. Ellsberg's paradox demonstrates that people prefer known probabilities over unknown ones, even when the objective odds are identical. But real-world decisions often involve deeper uncertainties—not just unknown probabilities but unknown outcomes. The user specifically mentions this distinction, so I must address it head-on.

  The user's pain points are clear: board pressure favoring safe bets, nagging FOMO about innovation, and compound costs of always avoiding ambiguity. They also flagged critical cases—withheld information, cheap information gathering, and coherence traps where inconsistent preferences creep in. 

  Hmm... their mention of "when I'm the most informed person" suggests ambiguity aversion might be socially modulated. Interesting—if you feel others know more than you, uncertainty feels riskier. That's worth incorporating into the procedure.

  For the decision framework, I'll structure it as a flowchart with interrogation points. Need distinct gates for: identifying uncertainty type (risk vs ambiguity vs deep uncertainty), checking for manipulable information, assessing information-gathering costs, and forcing coherence checks. The key is making it actionable—concrete questions with clear "stop/go" criteria.

  The three test cases will validate the framework: 
  - For the literacy program, it should flag that innovation rejection requires justifying high opportunity costs 
  - For the renewal, it should expose status quo bias masquerading as ambiguity aversion
  - For the unpleasant output case, I'll design a scenario where the math says "fund the ambiguous option" but human instinct says no—highlighting where the procedure clashes with values

  Biggest challenge? Admitting where this is still subjective. The procedure can systematize thinking but can't eliminate judgment calls about what constitutes "sufficient" analogy or "acceptable" uncertainty. Need to be transparent about that.
answer: |-
  Here's a decision procedure grounded in rigorous ambiguity research, designed for your context. It explicitly rejects pop misconceptions ("people just hate the unknown") and focuses on what matters: *when* ambiguity aversion is rational, when it's a bias, and how to manage deep uncertainty.

  ### Core Principles from Research
  1.  **Ambiguity ≠ Risk ≠ Deep Uncertainty:**  
      *   **Risk (Known Odds):** You know the possible outcomes *and* their probabilities (e.g., 60% chance of +5% literacy gain).  
      *   **Ambiguity (Unknown Odds):** You know the possible outcomes, but *not* their probabilities (Ellsberg Urn: you know balls are red/black, but not the ratio).  
      *   **Deep Uncertainty (Unknown Outcomes):** You don't even know the full range of possible outcomes or mechanisms (e.g., funding radical AI tutoring – could revolutionize learning or create unforeseen harms). **Research shows ambiguity aversion applies strongly to "Unknown Odds," less cleanly to "Deep Uncertainty," where different models (like Robust Optimization) might be better.**
  2.  **Aversion is Often Rational, Not Just a Bias:** It's smart to avoid ambiguity when:  
      *   Information is likely being manipulated ("Withheld Interest").  
      *   You lack competence to assess the domain ("Relative Knowledge Gap").  
      *   Analogies are weak or non-existent.  
      *   The stakes are very high *and* downside protection is weak.
  3.  **The Bias Component:** It's irrational when aversion persists *even after* accounting for the rational reasons above, often due to:  
      *   Emotional discomfort with not knowing.  
      *   Misjudging the *degree* of uncertainty.  
      *   Coherence violations (preferring known-risk A over ambiguous B, but also preferring ambiguous C over known-risk D, when A/D and B/C are objectively identical).
  4.  **Information Has Value:** The cost of reducing ambiguity *must* be factored in. Avoiding cheap info-gathering is lazy, not rational aversion.
  5.  **Compound Opportunity Cost:** Always avoiding ambiguous options guarantees missing high-upside breakthroughs. This cost is hidden in any single decision.

  ---

  ### The Decision Procedure: "Ambiguity Audit"
  **(Run this *before* comparing the ambiguous option to the known-risk option)**

  1.  **Clarify the Uncertainty Type:**  
      *   *Question:* "Do we know the *full range* of significant possible outcomes (good and bad) for the ambiguous option? Or just not their probabilities?"  
      *   *Good Answer:* Explicitly lists plausible outcomes and acknowledges unknowns. If outcomes are truly unknown ("Could destabilize local education markets," "Might create dependency on unvetted tech"), flag as **Deep Uncertainty**.  
      *   *Stop/Handoff:* If **Deep Uncertainty**, the procedure *does not directly apply*. Handoff: "This is Deep Uncertainty. Standard ambiguity models are insufficient. We need scenario planning, mini-pilots focused on learning, or robust satisficing criteria. Proceed with extreme caution and explicit learning goals." Otherwise, proceed.

  2.  **Assess Information Asymmetry & Manipulation Risk:**  
      *   *Question:* "Is critical information about outcomes or mechanisms missing because someone (applicant, partner, vendor) has an incentive to withhold or distort it?"  
      *   *Good Answer:* Identifies specific missing info, potential withholders, and their incentives. Demonstrates applicant's transparency (e.g., sharing raw pilot data, admitting unknowns).  
      *   *Stop:* If strong evidence suggests manipulation/hiding: **REJECT based on rational aversion.** (e.g., Applicant refuses independent audit of preliminary results). Otherwise, proceed.

  3.  **Check Information Gathering Cost:**  
      *   *Question:* "What credible, cost-effective steps could reduce the ambiguity *right now* (e.g., expert call, small pilot, rapid literature scan)? Is their cost trivial (<1% grant value or <2 weeks delay) relative to the grant size and potential impact?"  
      *   *Good Answer:* Identifies 1-3 concrete, fast, cheap actions *and* explains why they would meaningfully reduce key uncertainties.  
      *   *Stop:* If cheap, actionable steps exist: **DEFER DECISION, GATHER INFO.** Ambiguity aversion *now* is irrational. Only proceed if info-gathering is infeasible/too costly.

  4.  **Seek Valid Analogies & Base Rates (Beware Fake Precision):**  
      *   *Question:* "What are the *strongest analogous interventions* in *similar contexts*? What were their outcome distributions? How strong is the analogy (scale 1-5)?"  
      *   *Good Answer:* Cites specific programs, contexts, and quantitative results. Acknowledges differences and judges analogy strength honestly. Avoids "distribution over unknown P" unless based on *many* strong analogies (e.g., meta-analysis).  
      *   *Handoff/Stop:*  
          *   Strong Analogy (4-5): **Convert to RISK** using the analogy's distribution. Compare directly to the known-risk option.  
          *   Weak/No Analogy (1-3): **Quantify Conservatively.** Use a *wide*, *plausible* min/max range for key outcomes, or a very conservative point estimate (e.g., 10th percentile outcome from the *weakest* plausible analogy). Proceed to comparison.

  5.  **Assess Relative Knowledge & Competence:**  
      *   *Question:* "Compared to others in this domain (researchers, implementers, other funders), how deep is *our* foundation's understanding? Are we among the *most* knowledgeable?"  
      *   *Good Answer:* Honestly compares expertise level using specific criteria (e.g., staff experience, past grant success/failure in domain, network depth).  
      *   *Handoff:* If you lack relative knowledge: **Rational aversion weight increases.** The ambiguous option needs a *larger* potential upside advantage over the known-risk option to justify funding. Quantify this adjustment factor (e.g., require 1.5x the expected value). If you *are* highly knowledgeable, aversion bias is *more* likely – proceed cautiously but don't overweight aversion.

  6.  **Coherence Check (The Trap):**  
      *   *Question:* "Imagine two scenarios: (A) We fund the *known-risk* option. (B) We fund the *ambiguous* option. Now, consider if we discovered a *new*, equally ambiguous option (C) that *contradicts* our preference between A & B. Would we prefer A over C *and* C over B? (Or vice versa?)"  
      *   *Good Answer:* Demonstrates consistent ranking (A > B implies A > C and C > B for any other ambiguous C). If inconsistency is found, identifies the source (e.g., "We overvalue 'evidence base' label regardless of actual strength").  
      *   *Handoff:* If incoherence is found: **REQUIRE RE-ASSESSMENT** of Steps 3-5. The aversion/bias weighting is likely flawed. Address the inconsistency before final decision.

  7.  **Decision & Compound Cost Awareness:**  
      *   *Question:* "Given the adjusted valuation of the ambiguous option (from Steps 4 & 5), does it have a *sufficiently higher* expected value (or lower downside risk) than the known-risk option to justify its ambiguity premium? **Have we rejected the last N ambiguous options? What's our portfolio's exploration rate?**"  
      *   *Good Answer:* Explicitly states the required advantage (e.g., "20% higher conservative EV") and compares. Acknowledges portfolio balance ("We've rejected 5 novel ideas; we need some exploration").  
      *   *Decision:* **FUND** if advantage is clear *or* portfolio exploration is too low. **REJECT** if advantage isn't sufficient *and* portfolio exploration is adequate. **HANDOFF:** If values conflict (e.g., high potential upside vs. high unknown tail risk), flag: "This hinges on risk tolerance values. Committee must decide."

  ---

  ### Running the Cases

  1.  **Literacy Program (Known) vs. Novel Tutoring (Ambiguous)**  
      *   Step 1: Tutoring outcomes known (improve scores, engagement) but odds unknown? Likely **Ambiguity**. Proceed.  
      *   Step 2: Unlikely info withheld. Proceed.  
      *   Step 3: Cheap info? Yes! Call 2 orgs testing similar tech. **DEFER, GATHER INFO.** (Avoids premature aversion).  
      *   *(If info gathered & ambiguity remains)* Step 4: Weak analogies (different subjects/ages). **Conservative Quantification:** Min effect = 0, Max effect = 2x known program, Plausible Avg = 0.8x known.  
      *   Step 5: Are you EdTech experts? Probably not. **Increase required advantage:** Need >1.3x conservative EV of known program.  
      *   Step 6: Check consistency (e.g., if you prefer known literacy over AI tutoring, would you prefer it over *any* novel tutoring model? Probably yes = Coherent).  
      *   Step 7: Does conservative EV (0.8x) * 1.3 = 1.04x > 1x? **Barely. FUND if portfolio lacks exploration, otherwise REJECT.**  

  2.  **Renew Weak-Eval Program (Ambiguous!) vs. New Strong-Evidence Program (Known)**  
      *   Crucial: The *renewal* is now ambiguous! We "know" it but lack evidence on *current* effectiveness.  
      *   Step 1: Outcomes known, probabilities unknown? **Ambiguity** for renewal. Proceed.  
      *   Step 2: Is org hiding poor results? Possibly! **Scrutinize transparency.** If red flags, **REJECT**.  
      *   Step 3: Cheap info? **YES!** Require rigorous rapid evaluation before renewal. **DEFER, GATHER INFO.** (Aversion to renewing *without* evidence is rational).  
      *   *(If no new eval)* Step 4: Best analogy? *Its own past performance, but context may have changed.* Weak analogy. **Conservative Quantification:** Assume effectiveness declined to 0.7x original estimate.  
      *   Step 5: Are you experts on *this specific program*? Likely yes. **Reduce aversion bias weighting.**  
      *   Step 6: Coherence? (Preferring known-new over ambiguous-renewal implies you should prefer known-new over *any* renewal without evidence? Yes = Coherent).  
      *   Step 7: Compare conservative EV (0.7x) of renewal vs. known EV (1.0x) of new. 0.7x < 1.0x. **REJECT RENEWAL, FUND NEW PROGRAM.** (Avoids status quo bias masquerading as ambiguity tolerance).

  3.  **The Unpleasant Case: "Fund the Ambiguous Option" (Aversion Doing Real Work)**  
      *   **Scenario:** Funding a community-led advocacy org in a repressive regime. Goal: Policy change.  
          *   *Known-Risk Option:* Funding int'l NGO for direct service delivery (known, modest impact).  
          *   *Ambiguous Option:* The community org (high potential for transformative change, but also high risk of backlash, collapse, or minimal impact).  
      *   Step 1: Outcomes known? Mostly (policy win, backlash, no change). **Ambiguity.** Proceed.  
      *   Step 2: Info withheld? Unlikely (org is transparent about dangers). Proceed.  
      *   Step 3: Cheap info? Limited (due to security). Mini-pilot? Maybe not. Proceed.  
      *   Step 4: Analogies? Weak. Other repressive contexts differ wildly. **Conservative Quantification:** Min = Severe harm (-), Max = Major win (+++), Plausible Avg = Slight positive (+).  
      *   Step 5: Relative Knowledge? You lack deep local insight. **Increase required advantage:** Need >> EV of known option.  
      *   Step 6: Coherent? (Preferring known-service over ambiguous-advocacy likely consistent with other similar choices).  
      *   Step 7: Conservative EV (+) likely < EV of known option (++)? **REJECT the ambiguous advocacy grant.**  
      *   **Why it's unpleasant:** The potential upside (+++) is compelling, values align with community agency, and the known option feels inadequate. **But:** Rational aversion dominates here. The combination of weak analogies, your lack of relative knowledge, the impossibility of cheap learning, and the severe downside risk makes rejection the procedurally sound answer. Aversion protects against catastrophic unknowns in high-stakes, low-knowledge environments.

  ---

  ### What the Procedure Can't Do (Honesty Box)

  1.  **Eliminate Judgment:** Steps 4 (Analogy Strength, Conservative Quantification) and 5 (Relative Knowledge) are inherently subjective. The procedure structures the judgment, not replaces it.
  2.  **Define "Sufficient Advantage":** The multiplier in Step 7 is a policy choice, not science. Your foundation must set its risk/exploration tolerance.
  3.  **Handle True Deep Uncertainty Perfectly:** It flags it (Step 1), but the handoff to scenario planning/etc. still requires art.
  4.  **Guarantee Optimal Portfolio Balance:** Tracking "rejected ambiguous options" (Step 7) is crude. Setting an explicit exploration budget (% of grants) is better.
  5.  **Override Values:** When Step 7 flags a values conflict (high upside vs. catastrophic tail risk), math won't decide. The committee's courage or caution rules.
  6.  **Misfires:**  
      *   **Over-exploration:** If "portfolio balance" overrides strong rational aversion (Step 7), leading to costly failures.  
      *   **False Precision:** Weak analogies (Step 4) dressed up as strong data, enabling funding bad bets.  
      *   **Paralysis:** Over-scrutinizing cheap info-gathering (Step 3) on low-stakes decisions.  
      *   **Bias Masking:** Using "Deep Uncertainty" (Step 1) as an excuse to reject *any* innovation.

  **The Core Insight:** Ambiguity aversion isn't a flaw to eliminate; it's a tool. This procedure helps you wield it rationally: avoiding bets where the deck is stacked or you lack the skill to play, while systematically creating space for valuable exploration where the cost of learning is low and the potential upside justifies the fog. It forces you to distinguish between fear of the unknown, and prudent avoidance of the unknowable or manipulated.
