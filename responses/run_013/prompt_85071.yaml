answer: |-
  ## Sestina for the Butcher's Chart

  Each Saturday, the cleaver finds its **cut**,
  Not following some predetermined line,
  But where the sinew yields, a natural **joint**.
  My brother knows the place, the hidden **seam**
  Where muscle parts from muscle, slides from **bone**.
  This knowledge isn't drawn upon a **chart**.

  Yet pinned behind the counter hangs that **chart**,
  Its tidy boxes showing where to **cut**,
  The primal sections numbered, kind by **kind**.
  Red ink defines each demarcated **joint**,
  Traces the boundaries of each named **seam**
  As if the cleaver answered just to **bone**.

  Does truth reside within the flesh and **bone**?
  Or is it in the butcher's ordered **chart**,
  That rigid map defining every **seam**?
  The blade descends, a swift and practiced **cut**,
  Revealing what the structure held: a **joint**
  Of function, not the logic of a **kind**.

  In Britain, what we call a certain **kind**
  Of meat – the brisket, clinging close to **bone** –
  They section differently upon their **chart**.
  Is nature carved by where we choose to **cut**?
  Or does the cleaver find the waiting **joint**,
  The world presenting its inherent **seam**?

  The chemist seeks the elemental **seam**,
  The biologist the genus, phylum, **kind**,
  Dividing cells or kingdoms at the **joint**.
  The physicist probes deep below the **bone**
  Of matter, drafting laws on thought's own **chart**.
  But where, precisely, falls the final **cut**?

  The cleaver falls: a necessary **cut**.
  The scientist observes: a crucial **seam**.
  The chart prescribes a useful, named **joint**.
  The world exists before we name its **kind**,
  Its structures hard as any living **bone**.
  Yet order blooms upon the human **chart**.

  This chart, this map, this bone-deep urge to **kind**,
  To cut the jointed world along its **seam**,
  Does cleaver find the cut, or bone the **chart**?

  ***

  The final envoi compresses the six end-words into three lines, forcing their dual meanings (butchering/classification) to collide directly. "Kind" serves as both 'category' and 'gentle/natural' (implying nature's inherent divisions?); "cut" is both the physical act and the categorical division; "joint" is anatomical and conceptual; "seam" is both connective tissue and boundary line; "bone" is physical structure and essence; "chart" is both map and imposed system. The closing question deliberately fractures the syntax ("Does cleaver find the cut, or bone the chart?"), refusing resolution, mirroring the unresolved philosophical tension between discovering natural joints or imposing useful cuts. The form itself – the relentless, predetermined return of the same six words – embodies the chart imposing its order, while the shifting contexts of the words throughout the poem enact the ambiguity of whether meaning resides in the thing or the system.
