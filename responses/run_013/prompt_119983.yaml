  Here is the position as I understand it, and please correct me where I've got it wrong, since I'm working from a few months of a reading group and no Sanskrit. For any candidate thesis about how things ultimately are — that something exists, that it does not exist, that it both does and does not, that it neither does nor does not — Nāgārjuna runs through all four and refuses each, and the refusal is not supposed to be a fifth answer or a choice of the middle option; the point is that the question was ill-formed to begin with, because whatever exists exists dependently, and so lacks the intrinsic nature (svabhāva) the question presupposes. He does the same thing with causation — arising neither from itself, nor from another, nor from both, nor without a cause — and with the undeclared questions, such as whether a Buddha exists after death. Running alongside this there's the two-truths idea: the same claim can be conventionally true and ultimately not, and I gather that's not meant as a ranking of a sloppy truth by a rigorous one. And somewhere in the commentary I've seen a distinction invoked between two kinds of negation, one that merely cancels a predicate and one that implies some positive alternative, which is supposed to matter for how you read the fourth lemma; I can't remember where it comes from and I don't trust my grip on it, so treat it as a half-remembered rumour rather than a text I'm citing — I don't need the source, I need to know what work the distinction does.

  The vocabulary I actually think in, so you can hold me to it: SQL's three-valued logic, where NULL is neither true nor false, NULL = NULL is NULL, NOT NULL is NULL, and the closed-world assumption means the database still has to hand me back some answer; IEEE 754 floating point, where NaN is unordered with respect to everything including itself and comparisons return a fourth outcome that isn't less, greater, or equal; undefined behaviour and poison values in optimizing compilers, where from a contradiction the compiler is licensed to assume anything at all, so a branch can simply vanish — I've chased a bug where exactly that happened to a null check; constraint and validation systems, where a rule can be satisfied, violated, or left pending; and the operational-versus-denotational distinction from a programming-languages course I half-remember, which is the closest thing I have to two ways of evaluating the same expression. What I want out of the translation is specific: for each of the four lemmas, tell me what it becomes — is my NULL the fourth lemma, or is the resemblance a trap, and does the difference between "unknown" and "not applicable" buy me anything the fourth lemma needs? Does the third lemma, the both-and-neither's-opposite, land on contradiction-as-undefined-behaviour, and if so is Madhyamaka's refusal to affirm it like declining to enter UB, or is that just ex falso dressed up? Where does the two-truths doctrine go — is it two semantics for one expression, and if that works, why does it feel like cheating? And what happens to the therapeutic point, that the four options are a device for dissolving a question rather than a table for answering it, given that my whole world is built on the assumption that a query must return a value? Finally, and this is the part I care most about: name the residue explicitly, and tell me which way the failure runs.
