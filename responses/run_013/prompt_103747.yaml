  - **Critical point**: The rendering of disjunctivism smuggles in your assumption that states are "defined" by causal roles, but disjunctivism posits a stronger, non-causal dependency. What would decide the issue is whether the relational property has detectable effects. If it doesn't, disjunctivism risks being an unfalsifiable metaphysical add-on; if it does, your framework can likely absorb it (e.g., as a feedback loop in the generative model).
