  In your terms, consider a generative model of perception. The sensory data (input) is generated from latent variables (the external world) via a likelihood function. The brain (or model) performs inference to estimate the posterior distribution over latents. In a veridical perception, the sensory data is generated by the actual external state, and the inference recovers that state. In a hallucination, the same sensory data (or a similar internal representation) is produced without the corresponding external state — perhaps due to an overactive prior, a malfunction, or noise. The internal state (e.g., a sample from the posterior) might be identical in both cases. This is the common-factor principle: the same internal representation can be caused by two different processes.

