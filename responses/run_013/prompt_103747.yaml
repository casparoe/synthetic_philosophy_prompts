  In your vocabulary, this might be rendered as: in the veridical case, the model's inference is not just producing an internal representation but is in a state that is constituted by the presence of the external object. The state is not just the vector of activations (or the posterior sample) but includes the causal link to the object. In the hallucination, the state is merely the internal representation without that link. Thus, the two are not the same kind of state, even if the internal representation is identical.

