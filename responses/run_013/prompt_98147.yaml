  Okay, let me start by unpacking this retired teacher's query. They're noticing a rhetorical move where terms like "Western values" shift meaning depending on the context. When challenged, it's framed as a historical fact about institutionalization, but then it morphs into a cultural inheritance used to exclude others. The user wants to understand the mechanics behind this switch, not just a label.

  First, I need to recall related concepts. Essentially contested concepts come to mind, but as the user mentioned, that doesn't fully capture the intentional flip. Persuasive definitions are close, but the dynamic shift is key here. Then I remember "equivocation" in logic, but that's too broad. Maybe "motivated redefinition" or "terministic screen"? 

  The user is a teacher, so they likely want a clear breakdown. They mentioned wanting the "carving" – the structure, what it is and isn't. So I should avoid jargon and focus on analysis. The examples given ("Judeo-Christian," "Enlightenment values") show this isn't isolated. The core seems to be a bait-and-switch: historical when challenged, essentialist when applied. That’s the pivot point.

  I should consider the functions: defensibility versus exclusion. Historically grounding the term makes it seem objective, but the shift to inherent culture creates an us-them divide. The user probably wants to expose this mechanism for their own understanding or teaching others. Also, the emotional weight: the term "inheritance" implies something to protect, triggering defensiveness against perceived threats.

  What's not happening? It's not mere hypocrisy; it's a calculated rhetorical strategy. It’s not ignorance but a flexible tool. The edges might include when the shift is unconscious versus deliberate. Also, distinguishing from valid historical claims versus misused ones. The teacher might need ways to counter this in discussions, so pointing out the pivot explicitly could be useful.

  Possible labels: "rhetorical pivot" or "discursive shell game." But the user wants the anatomy, so the process needs detailing. Historical Grounding and Essentialist Deployment are two modes. The bait-and-switch is central. Also, the unspoken assumptions: that values are tied to cultural DNA, ignoring diffusion and adaptation.

  I should check if existing terms fit. "Ideological laundering" comes close but might be too loaded. "Conceptual bracket creep" – expanding meaning contextually. But the key is the functional duality. Maybe "dialectical valorization"? But that's clunky. The teacher might appreciate "semantic relocation" or "definitional drift," but clarity is better.

  Ultimately, naming it "rhetorical shell game" or "discursive bait-and-switch" captures the deception. But the explanation is crucial. Highlighting the two phases and the pivot between them addresses the user's request for carving. Also, emphasizing that it serves power dynamics: defending against critique while maintaining exclusion. The teacher’s frustration is about the inconsistency, so dissecting the mechanism validates their observation and provides tools to deconstruct it.
answer: |-
  You've put your finger on a profound and pervasive rhetorical maneuver – a kind of conceptual shell game that serves specific ideological functions. It's incredibly common, deeply frustrating, and remarkably slippery. While there might not be one universally agreed-upon *name* that perfectly encapsulates every nuance, we can certainly dissect **what it is, what it isn't, its mechanisms, and its edges**:

  **The Core Mechanism: Definitional Bait-and-Switch (or Rhetorical Pivot)**

  1.  **Phase 1: Defensive Historical Grounding (The "Bait"):**
      *   **Function:** To inoculate the term against charges of cultural chauvinism, racism, or historical amnesia.
      *   **Mechanism:** When challenged on the *uniqueness* or *provenance* of the values ("These aren't exclusively Western!"), the speaker retreats to a narrow, seemingly objective, *historical-institutional* definition. "Western" here means "first systematically codified and implemented within the political/legal structures originating in Europe/North America." It acknowledges historical atrocities but deflects by saying, "Yes, but the *system* started here."
      *   **Appearance:** Reasonable, historically contextualized, defensible. It concedes complexity while preserving the label.

  2.  **Phase 2: Essentialist Deployment (The "Switch"):**
      *   **Function:** To establish cultural boundaries, justify exclusion or superiority, and frame "non-Western" influences as fundamentally incompatible threats.
      *   **Mechanism:** The definition seamlessly shifts from *historical origin of institutional forms* to an *essential, inherent, and defining characteristic* of a supposedly coherent "Western" culture or people. Values become part of a cultural "DNA" or "inheritance" passed down, implying they are *naturally* understood, embraced, and protected *only* by those within the cultural lineage. The messy history vanishes, replaced by a timeless essence.
      *   **Appearance:** Normative, identity-forming, defensive. It invokes a sense of shared heritage, pride, and vulnerability against external forces.

  **What It Is (The Anatomy):**

  1.  **A Form of Motivated Redefinition:** The meaning of the term ("Western values," "Judeo-Christian," "Enlightenment") is fluid and changes *purposefully* depending on the rhetorical need of the moment. It's not accidental ambiguity; it's strategically deployed ambiguity.
  2.  **Rhetorical Laundering:** The historical grounding phase "launders" the term, making it appear objective and defensible. This "clean" version is then used to smuggle in the essentialist, exclusionary version without appearing overtly prejudiced.
  3.  **Essentialism in Disguise:** At its core, despite the historical concession, it relies on and reinforces a belief in deep, inherent, and defining cultural essences. The switch reveals that the speaker *really* believes these values are *intrinsically* "Western" in a civilizational sense, not just historically situated.
  4.  **A Tool for Boundary Maintenance:** Its primary function is to draw a bright line between "Us" (possessors/true inheritors of the essential values) and "Them" (outsiders who threaten the inheritance, regardless of their individual beliefs or the complexity of their own cultures).
  5.  **Historical Amnesia as Strategy:** The acknowledgment of slavery, colonialism, etc., in Phase 1 is performative. It's quickly forgotten in Phase 2, where the "inheritance" is presented as pure and unsullied, requiring defense against contamination. The messy reality of how these values emerged *alongside* and often *through* profound violence and exclusion is erased.
  6.  **Denial of Diffusion & Syncretism:** It ignores how ideas circulate, adapt, and are reinterpreted globally. Values like democracy or free speech are treated as static artifacts owned by one civilization, not dynamic concepts constantly debated and reshaped everywhere.
  7.  **A Power Move:** It allows the speaker to claim the moral high ground (defending "universal" values grounded in "our" history) while simultaneously exercising the power to define who belongs to "us" and who is a potential threat.

  **What It Is Not:**

  1.  **Not Simply Hypocrisy:** While hypocritical on the surface, it's more systematic. It's a *patterned* use of language designed to achieve specific ends, leveraging ambiguity strategically.
  2.  **Not Just Ignorance:** While ignorance may play a role for some users, the *pattern* you describe indicates a deeper conceptual framework or an adoption of a readily available rhetorical tool. The user understands the pushback enough to have a ready defense (Phase 1).
  3.  **Not Merely an Essentially Contested Concept (ECC):** ECCs (like "democracy" or "justice") are inherently complex and open to multiple legitimate interpretations. This move *exploits* that complexity but adds a layer of *strategic redefinition* to serve exclusion. The core issue isn't just contestation over meaning, but the *disingenuous shift* between meanings for tactical advantage.
  4.  **Not Just a Persuasive Definition:** Persuasive definitions aim to load a term with positive or negative connotations. This move *uses* persuasive definitions (especially in Phase 2) but crucially relies on *switching between different definitions* (historical vs. essentialist) as needed. The persuasive power comes from the *pivot* itself.
  5.  **Not Valid Cultural History:** While historical institutionalization *is* a fact, using it solely as a springboard to an essentialist claim about present cultural identity and threat is bad history. It flattens complexity and ignores counter-examples and global parallels.

  **The Edges & Nuances:**

  1.  **Conscious vs. Unconscious:** Some users deploy this move quite deliberately, understanding the rhetorical power. Others may do it unconsciously, having absorbed the framework from discourse around them. The *effect* is similar.
  2.  **Degree of Exclusivity:** The harshness of the boundary drawn in Phase 2 varies. Sometimes it implies incompatibility, other times just a "natural" preference or understanding within the culture. The threat perception also varies in intensity.
  3.  **The Role of "Heritage" vs. "Adoption":** The move often subtly privileges those "born into" the heritage over those who might *adopt* the values. The immigrant who embraces free speech is still seen as potentially threatening the "inheritance" because they aren't of the lineage.
  4.  **Where it Fails:** The move becomes most transparent and weakest when:
      *   The pivot is pointed out explicitly ("A moment ago you defined it historically, now you're treating it as an inherent cultural trait. Which is it?").
      *   When compelling examples of non-Western institutionalization or deep cultural commitment to similar values are presented *and held in view* when the speaker tries to pivot.
      *   When the historical grounding is pushed *too* hard, forcing the speaker to confront the deeply illiberal practices also institutionalized in the "West" alongside the values they champion. This can collapse the dichotomy.

  **Potential Labels (though none are perfect):**

  *   **Rhetorical Shell Game / Conceptual Shell Game:** Emphasizes the deliberate switching and deception.
  *   **Discursive Bait-and-Switch:** Highlights the two-phase structure and the deceptive pivot.
  *   **Motivated Definitional Pivot:** Focuses on the purposeful shift in meaning.
  *   **Essentialist Laundering:** Highlights the use of historical grounding to smuggle in essentialism.
  *   **Civilizational Drift (in definition):** Suggests the term subtly shifts its meaning towards civilizational essentialism.
  *   **Ideological Jujitsu:** Uses the opponent's force (critique) to execute its own maneuver (pivot to essentialism).

  **The Carving You Seek:**

  This move is fundamentally **a strategy of ideological defense and boundary policing**. It uses the malleability of historical and cultural labels to achieve two conflicting goals simultaneously:

  1.  **Deflect criticism** by adopting a seemingly reasonable, historically contextualized position.
  2.  **Maintain exclusionary power** by switching to an essentialist definition that constructs a unique, vulnerable cultural identity ("Us") that needs protection from "Them."

  The pivot itself is the key mechanism. It exploits the fact that terms like "Western" or "Judeo-Christian" are simultaneously **historical descriptors** (with messy, contested realities) and **powerful identity markers** (loaded with emotion and belonging). The speaker switches from one register to the other whenever it serves their rhetorical purpose, denying the inherent tension between the two meanings. What it *is* is a tool for wielding cultural power under the guise of defending universal principles. What it *is not* is a coherent, consistent, or intellectually honest way of understanding history or culture. Its edges lie where the switch becomes visible and the tension between the two definitions can no longer be ignored.
