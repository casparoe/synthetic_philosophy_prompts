prompt: |-
  I'm a fourth-year PhD in an animal welfare group (marine bio background) and next month I'm doing a seminar for the aquaculture crowd I collaborate with: mostly production-side shrimp and lobster people, two crustacean neurobiologists who work on nociception, and my supervisor's friend from the vet school who does farm-animal welfare and thinks I'm alot more timid than I need to be. My line is basically two claims. First, we are never going to settle whether decapods feel pain on the current evidence, so that shouldn't be the gating question; I propose what I've been calling an asymmetry rule — where the change is cheap and the number of animals affected is astronomically large, uncertainty about sentience doesn't get to block reform, and the burden flips to whoever wants to keep the practice. Second, the fight everyone has (how you kill them) is a distraction; the real action is routine husbandry — eyestalk ablation on broodstock (cutting a female's eyestalk off to make her spawn), the crowding and handling, and the fact that there's no agreed humane slaughter protocol that most of the industry actually uses. The production people think I'm an activist in a lab coat, the neurobiologists think "pain" is doing all the work in my talk and won't survive contact with them, and the welfare person thinks my "even if they feel nothing" framing hands the industry an exit.

  Prep me for the Q&A. Not the objections I'd get from a philosophy audience — the ones this room will actually make, in their words. Order them by how much damage they do to me. For each: who's raising it, the objection as they'd put it, how serious it is, what I should concede up front, a two-minute reply, and where that reply is softest. Include the one question I'm praying nobody asks, and tell me what to just drop from the talk.

  Give it to me as JSON: an "objections" array where each item has "rank" (1 = most dangerous), "objection" (one sentence, phrased the way they'd say it), "raised_by" (which faction), "severity" (high/med/low), "concede", "reply_2min", "weak_point"; plus "drop_from_talk" (array of strings) and "the_question_im_dreading" (an object with "question" and "why_it_breaks_me").
reasoning: |-
  We are preparing for a seminar Q&A with a mixed audience: aquaculture production people, crustacean neurobiologists, and a vet school welfare expert. The speaker's key points are:
  1. The uncertainty about decapod sentience should not block reforms when changes are cheap and the number of animals affected is large (asymmetry rule).
  2. The focus should shift from killing methods to routine husbandry issues (eyestalk ablation, crowding, handling, lack of humane slaughter protocols).

  Potential objections from different factions:

  **Production People (aquaculture industry):**
  - They see the speaker as an activist and might object on practical and economic grounds.
  - Example objection: "Your 'asymmetry rule' sounds good in theory, but you're ignoring the real costs and logistical nightmares of changing practices at scale."

  **Neurobiologists:**
  - They are focused on the science of nociception and sentience.
  - They might argue that the speaker is downplaying the importance of establishing sentience and using the term "pain" loosely.
  - Example objection: "If we can't even agree on whether they feel pain, how can you justify imposing welfare standards that assume they might?"

  **Welfare Expert:**
  - Thinks the speaker is too timid, but also worries about the "even if they feel nothing" framing giving the industry an easy out.
  - Example objection: "By framing reforms in terms of 'even if they don't feel pain', you're letting the industry off the hook by not requiring them to accept sentience."

  Ranking by damage (1 being most dangerous):

  1. **Objection from Production People:** They have the most at stake economically and may be the majority. If they feel attacked or that the proposals are unrealistic, they might dismiss the entire talk and resist collaboration.
  2. **Objection from Neurobiologists:** They have scientific credibility. If they challenge the core premise (using the asymmetry rule without settled sentience), it could undermine the foundation of the argument.
  3. **Objection from Welfare Expert:** Although critical, this might be less damaging because the welfare expert is likely an ally and the objection is about strategy. It might even lead to a constructive discussion.

  The question I'm dreading: Probably one that exposes a gap in the data or a practical impossibility in implementing the proposed changes on a large scale.

  What to drop from the talk? The speaker might consider dropping the explicit "even if they feel nothing" framing for the reforms, because it might indeed give the industry an exit. Instead, frame the asymmetry rule as a precautionary principle without the hypothetical "even if no pain" scenario.

  Now, let's structure the objections in JSON.

  Note: The "concede" part should be a brief acknowledgment of a valid point to show fairness. The "reply_2min" is a two-minute response. "weak_point" is where the reply is vulnerable.

  **The Dreaded Question:**
  - I think the most dreaded question might come from the production side, pointing out that the changes are not actually cheap or that the industry is already implementing some welfare practices and the speaker is ignoring that.

  Let me outline the objections:

  1. **Rank 1 (Most Dangerous):** Production person's objection about cost and practicality.
     - Objection: "You talk about 'cheap changes', but you're not in the trenches — do you have any idea what retooling for these 'reforms' would actually cost us?"
     - Severity: High
     - Concede: Yes, I don't run a farm and I know that any change has costs.
     - Reply: Focus on specific examples where changes are low-cost (e.g., handling protocols, reducing crowding) and emphasize that the asymmetry rule applies when costs are low and numbers are high. Also, mention that some changes might even save money (e.g., reduced mortality).
     - Weak point: Without concrete cost-benefit data from real farms, the claim of "cheap" is vulnerable.

  2. **Rank 2:** Neurobiologist's objection on the sentience uncertainty.
     - Objection: "Your whole argument depends on the idea that we can't settle the pain question, but that's exactly what we're working on — why not wait for the science instead of rushing to impose standards on a maybe?"
     - Severity: High
     - Concede: The science is crucial and ongoing, and I respect the work being done.
     - Reply: The asymmetry rule is precisely for when the science is uncertain but the stakes (number of animals) are enormous. Waiting might take decades and in the meantime, billions of animals are affected. We have a precautionary duty.
     - Weak point: It might be argued that without evidence of sentience, there is no moral duty.

  3. **Rank 3:** Welfare expert's objection about the framing.
     - Objection: "By saying 'even if they feel nothing', you're giving the industry an excuse to never accept that these animals are sentient, which sets back welfare in the long run."
     - Severity: Med
     - Concede: I agree that we should work toward establishing sentience and that my framing might have that risk.
     - Reply: The goal is to get immediate improvements. We can walk and chew gum: implement these reforms now while the science continues. The reforms are justifiable on multiple grounds (including ethical principles and potential productivity benefits) without requiring sentience.
     - Weak point: It might be seen as a strategic error that could undermine the sentience debate.

  **Drop from talk:** Avoid explicitly saying "even if they feel nothing". Instead, frame the asymmetry rule as a precautionary principle without that hypothetical.

  **The Dreaded Question:**
  - Question: "Can you point to a single large-scale shrimp farm that has implemented your proposed husbandry reforms without seeing a drop in production or profit? Because if not, this is all just theoretical."
  - Why it breaks me: It demands real-world evidence that the speaker, as a researcher, might not have. Without case studies, the practicality is questioned.

  Now, let's write the JSON.
