prompt: |-
  I'm a philosophy professor, midway through a paper on moral worth, and I keep getting stuck on a colleague of mine — call her Dana — whose verdicts on cases I can't fit to any single textbook rule, and it's starting to feel like a personal insult. The backdrop is the old fight about wether an action has moral worth only when it's done from duty, or whether it's enough that you act for the reasons that actually make the action right, or whether all that matters is that you're acting from some morally decent motive. Over the last few months I've been lobbing cases at Dana over coffee and here's the tally: (1) the prudent merchant who's honest only because cheating would ruin his reputation — no moral worth. (2) Someone who sits with a distressed stranger on a night bus, moved by the stranger's distress and nothing else, who'd call what she's doing the decent thing but in whom the thought "this is my duty" never once appears — moral worth. (3) A conscientious person who keeps a promise she finds inconvenient, who feels she simply must keep it, and who also gets that the friend is counting on her — moral worth. (4) Someone who hands over the correct change only because she's on autopilot and copies whatever the till screen suggests, with no grasp at all of the customer's claim — no moral worth. (5) Someone whose giving is a messy mix of real concern and wanting to look good, where the concern is the thing that actually tips her into acting — moral worth.

  Now the new case I want her read on. A man donates a kidney to a stranger because he believes God commands sacrificial giving. He's sincere, it costs him enormously, he'd do it again without hesitation — but his grip on why it's right is off in a very specific way: he thinks it's right because God said so, not because of anything about the recipient. He'd donate to anyone or anything he believed God commanded, and he isn't tracking the recipient's need or welfare at all. I can see two rules that fit everything in the tally above and split right down the middle on this guy: a "right reasons" reading, on which he gets no moral worth because he isn't acting for the features that make the act right; and a broader "good will" reading, on which he does get moral worth because he's sincerely trying to do what he takes to be right, his conception being off notwithstanding. Tell me which her track record actually favors, give me your best guess at her verdict with the reasoning, and flag any third rule that fits all five of her earlier verdicts just as well as those two do. Then tell me which case you'd want her to rule on next in order to actually pin the rule down — my own hunch is that it's the mirror image of this one, some case where the agent is accurately responsive to the right-making features but doesn't regard what she's doing as moral at all (maybe even thinks it's a weakness), but I'm happy to be told something else does the job better.
reasoning: |-
  Okay, I need to help this philosophy professor figure out Dana's pattern of moral worth judgments. Let me start by listing all the cases and Dana's verdicts:

  1. Prudent merchant (honest only for reputation): **No moral worth**
  2. Night bus stranger (acts from empathy, no duty thought): **Moral worth**
  3. Conscientious promise-keeper (acts from duty and understanding): **Moral worth**
  4. Autopilot cashier (no grasp of customer's claim): **No moral worth**
  5. Mixed-motive giver (real concern tips the scale): **Moral worth**

  Now the new case: Kidney donor motivated solely by God's command, not by the recipient's need. The professor sees two possible rules that fit the first five cases:

  - **Right Reasons Rule**: Moral worth requires acting for the features that actually make the action right.
  - **Good Will Rule**: Moral worth requires sincerely trying to do what one believes is right, even if the belief is mistaken.

  The professor wants to know which rule Dana's track record favors, what her verdict on the kidney case might be, whether there's a third rule that fits all five cases, and what case would help pin down the rule.

  Looking at Dana's past verdicts:

  - Case 1 (merchant): No moral worth. This rejects purely self-interested motivation. Both rules would say no here.
  - Case 2 (night bus): Moral worth. This is key - the person acts from empathy without any "duty" thought. The Right Reasons view would approve if empathy is the right reason here. The Good Will view would approve because she's acting from a morally decent motive.
  - Case 3 (promise-keeper): Moral worth. She acts from duty and understands the friend's reliance. Both rules would say yes.
  - Case 4 (autopilot cashier): No moral worth. She lacks any moral understanding. Both rules would reject this.
  - Case 5 (mixed motives): Moral worth. The real concern is what tips her to act. The Right Reasons view might approve if concern aligns with right-making features. The Good Will view approves because the operative motive is morally decent.

  Now the kidney donor case: He acts because God commands it, not because of the recipient's need. 

  Under **Right Reasons**: He's not acting for the right-making feature (alleviating need), so no moral worth.
  Under **Good Will**: He sincerely tries to do what he believes is right (follow God's command), so he gets moral worth.

  Which does Dana's history favor? Case 2 is crucial. The night bus helper acts for empathy (a right reason) without duty thoughts, and gets moral worth. This suggests Dana values responsiveness to morally relevant features. Case 5 also - the "real concern" (a morally relevant feature) is what tips the scale.

  But Case 3 includes duty motivation along with understanding the right reason. That's compatible with both views. The merchant (Case 1) lacks any moral motivation, so rejected by both. The autopilot (Case 4) lacks any moral cognition, rejected.

  I notice Dana approved Case 2 where there's no "duty" thought at all - so the Good Will rule (if narrowly defined as "acting from duty") wouldn't fit. But the professor defined Good Will broadly as "sincerely trying to do what one takes to be right." In Case 2, Dana might see empathy as a morally decent motive even without duty thoughts.

  However, the kidney donor has a "misguided" conception - he thinks God's command makes it right, not the need. This is different from Case 2 where empathy directly responds to the distress (the right-making feature).

  Dana's pattern seems to require some connection to the morally relevant features. Case 2: distress is directly motivating. Case 3: understanding the friend's reliance. Case 5: concern for the recipient. Whereas Case 1 and 4 lack this connection.

  So for the kidney donor: He's not responsive to the recipient's need at all. He'd donate to a rock if God commanded it. This seems closer to Case 1 and 4 - lacking proper connection to the moral reality.

  Therefore, Dana would likely say **no moral worth** for the kidney donor, favoring the **Right Reasons rule**.

  But let's check if another rule fits. Is there a **third rule**? Perhaps a **Hybrid Rule**: Moral worth requires (a) acting from a motive that aligns with the right-making features, and (b) some level of moral understanding.

  In Case 2: Empathy aligns with the right-making feature (distress).
  In Case 3: Duty and understanding align with promise-keeping.
  In Case 5: Concern aligns with helping.
  In Case 1: Self-interest doesn't align.
  In Case 4: No moral understanding.

  For kidney donor: His motive (obeying God) doesn't align with the right-making feature (need), so no moral worth - same as Right Reasons.

  Now the professor's suggested next case: Someone who accurately responds to right-making features but doesn't see it as moral. Example: A person helps another out of spontaneous compassion, but views compassion as a weakness, not a virtue.

  Under Right Reasons: She acts for the right reasons (responds to need), so should have moral worth.
  Under Good Will: If she doesn't believe she's doing the right thing (thinks it's weakness), then no moral worth.

  Dana's verdict on this would distinguish the rules. If she says moral worth, it's Right Reasons. If no, it's Good Will.

  But Dana approved Case 2 where there was no "duty" thought - but in that case, the person thought it was "the decent thing," so she had some moral recognition. The new case has no moral recognition at all - she thinks it's a weakness.

  This could be decisive. If Dana says moral worth, it strongly points to Right Reasons. If no, it points to Good Will.

  Given Dana's approval in Case 2 despite no duty thought, if she denies moral worth in this new case, it would show that some moral recognition is necessary, but not necessarily duty - perhaps just seeing it as "decent" or good.

  But in the new case, the person doesn't see it as good at all. That's the key difference.

  So yes, this next case would help pin it down.

  Summary:
  - Dana's track record favors **Right Reasons rule**.
  - Likely verdict on kidney donor: **No moral worth**.
  - Third rule: A **hybrid responsiveness rule** fits but is similar to Right Reasons.
  - Next case: The "compassion as weakness" case to test necessity of moral recognition.
answer: |-
  Based on your detailed tally of Dana's verdicts and the new case you've constructed, I'll break this down step by step: (1) analyzing which rule her track record favors, (2) predicting her verdict on the kidney donor case with reasoning, (3) identifying any third rule that fits all five prior cases equally well, and (4) recommending a next case to definitively pin down her rule. My analysis draws on the three broad frameworks you outlined (duty-only, right reasons, good will), but I'll refine them based on Dana's pattern.

  ### 1. Which Rule Does Dana's Track Record Favor?
  Dana's verdicts consistently align with a **"Right Reasons" rule**, not a "Good Will" rule. Here's why:
  - **The core pattern**: Dana assigns moral worth only when the agent is *directly responsive* to the morally relevant features of the situation (e.g., the stranger's distress in Case 2, the friend's reliance in Case 3, the recipient's need in Case 5). She denies moral worth when this responsiveness is absent, even if the action is externally correct or stems from a sincere intention (e.g., Cases 1 and 4).  
  - **Breakdown of the tally**:
    - **Case 1 (Prudent Merchant)**: No moral worth. Dana rejects this because the merchant isn't responsive to honesty as a moral value; he's motivated by self-interest. This fits **both** Right Reasons (he ignores the right-making feature of fairness/trust) and Good Will (his motive isn't morally decent).  
    - **Case 2 (Night Bus Stranger)**: Moral worth. This is decisive for Right Reasons. The agent acts from direct empathy with the stranger's distress—the very feature that makes the action right—without any appeal to duty. A Good Will reading might struggle here if "sincerely trying to do right" requires explicit moral recognition, but Dana's approval shows she doesn't require duty-thoughts or even a robust moral "conception"; she cares that the motive tracks the situation's moral reality.  
    - **Case 3 (Conscientious Promise-Keeper)**: Moral worth. This fits both rules, as the agent is responsive to the right-making feature (the friend's reliance) and acts from a sincere sense of duty. But note that Dana's inclusion of "also gets that the friend is counting on her" emphasizes the responsiveness to concrete reasons, not just abstract duty.  
    - **Case 4 (Autopilot Cashier)**: No moral worth. The agent lacks any responsiveness to the customer's claim (the right-making feature), so Right Reasons explains this easily. Good Will also fits, as there's no moral motive at all.  
    - **Case 5 (Mixed-Motive Giver)**: Moral worth. Dana's verdict hinges on the "real concern" being what tips the scale—i.e., the operative motive aligns with the right-making feature (the recipient's need). Good Will might also approve, but Dana's focus on the concern as decisive suggests she's prioritizing responsiveness over purity of motive.  

  **Why Right Reasons wins out**:  
  - Dana's approval in **Case 2** is the linchpin. If she favored Good Will, she might demand that the agent act *because they believe it's morally right* (e.g., with some minimal moral cognition). But in Case 2, the agent has no thought of duty or morality—she simply acts from empathy for the distress itself. This shows Dana cares about the agent's *reasons* matching the *objective morally relevant features*, not their subjective moral beliefs.  
  - Conversely, **Case 1** and **Case 4** involve no such responsiveness, so they fail. Case 5 further confirms this: moral worth is granted because the "real concern" (a morally relevant feature) is what motivates the action, even if impurely.  
  - **Good Will is less consistent**: If Dana endorsed Good Will (sincerely trying to do what one takes to be right), Case 2 might be ambiguous (the agent sees it as "decent," but not explicitly "moral"). More critically, Good Will could *overextend* to cases like the kidney donor (as we'll see), but Dana's pattern suggests she'd reject that.  

  **Verdict**: Dana's track record strongly favors **Right Reasons**, defined as:  
  > *An action has moral worth iff the agent is directly motivated by the features that actually make the action right (e.g., need, distress, reliance), and this motivation reflects a genuine responsiveness to those features.*  

  This rule explains all five cases cleanly. It doesn't require acting "from duty" (per Kant) or having a correct moral "conception"—only that the agent's psychology is attuned to the moral reality of the situation.

  ### 2. Prediction for the Kidney Donor Case, with Reasoning
  - **Your case**: A man donates a kidney to a stranger solely because he believes God commands it, with no responsiveness to the recipient's need or welfare. He'd donate to anything if God commanded it.  
  - **Predicted verdict**: **No moral worth** (aligned with Right Reasons).  
  - **Reasoning**:  
    Dana will likely argue that while the donor is sincere and costly in his sacrifice, he is not motivated by the features that *make* donating a kidney right (e.g., alleviating suffering, preserving life, or showing solidarity). Instead, his motive is *divine command*—a feature unrelated to the moral reality of the situation. He is responsive to God's will, not human need, making this analogous to Case 1 (merchant responsive to reputation, not honesty) and Case 4 (cashier responsive to the till, not the customer's claim).  
    - **Why not Good Will?** A Good Will reading might grant moral worth here because the donor sincerely intends to do what he believes is right (following God). But Dana's approval in Case 2 suggests she doesn't prioritize subjective moral beliefs over objective responsiveness. The donor's "conception" of the right-making features is flawed (he mistakes God's command for the actual reason), so he fails the Right Reasons test.  
    - **Key distinction from Case 3**: In Case 3, the promise-keeper "gets that the friend is counting on her"—she is responsive to the reliance *itself*, not just duty. Here, the donor has no such responsiveness; the recipient's need is irrelevant to him.  

  **Your split prediction was spot-on**: This case exposes the tension between the two rules. But given Dana's history, the Right Reasons reading is stronger—she consistently ties moral worth to motivation by the morally salient features of the act, not just sincerity or effort.

  ### 3. Is There a Third Rule That Fits All Five Cases?
  Yes, a **"Hybrid Responsiveness" rule** fits all five verdicts just as well as Right Reasons and Good Will. It refines Right Reasons by incorporating a minimal cognitive element:  
  > *An action has moral worth iff (a) the agent is directly motivated by features that are objectively morally relevant (e.g., need, distress, reliance), and (b) the agent has some awareness that these features are morally significant (even if implicit or inarticulate).*  

  **How it explains the tally**:  
  - **Case 1**: Fails (a)—motivated by reputation, not moral features.  
  - **Case 2**: Passes—motivated by distress (a morally relevant feature), and the agent calls it "decent," implying awareness (b).  
  - **Case 3**: Passes—motivated by reliance (a), with explicit awareness (b) via "must keep it" and understanding the friend's claim.  
  - **Case 4**: Fails (b)—no awareness of the moral feature (customer's claim).  
  - **Case 5**: Passes—"real concern" (a) is operative, and it implies awareness of need as morally significant (b), even if mixed with vanity.  

  **Comparison to your rules**:  
  - This hybrid rule is *closer to Right Reasons* than Good Will, as it still anchors worth in responsiveness to objective features. But it adds condition (b) to exclude cases where agents stumble into right actions without any moral sensitivity (e.g., a toddler who shares a toy by accident).  
  - **Does it fit better?** It accounts for nuances in Dana's verdicts:  
    - In **Case 2**, the "decent thing" remark satisfies (b), distinguishing it from a purely instinctive act (e.g., if the stranger acted on a whim).  
    - In **Case 4**, the autopilot fails (b), even if she's mechanically "responsive" to the till.  
    - In the **kidney case**, the donor fails (a)—he's not motivated by need—so no moral worth (same as Right Reasons).  
  - **Advantage over pure Right Reasons**: It avoids granting moral worth to agents who coincidentally act on right features but lack any moral cognition (e.g., someone who helps due to a reflex, with no sense of decency). Dana hasn't faced such a case, so this rule remains possible.  

  **Bottom line**: This hybrid rule is a plausible alternative, but it doesn't contradict the Right Reasons preference—it refines it. Your two initial rules still cover the core divide, with Right Reasons being the cleaner fit for Dana's pattern.

  ### 4. Recommended Next Case to Pin Down the Rule
  Your hunch—a case where the agent is **accurately responsive to right-making features but lacks moral recognition**—is excellent and would provide decisive evidence. Specifically:  
  - **Proposed case**: *A person sees a drowning child and jumps in to save them, motivated solely by a spontaneous surge of compassion (e.g., "I can't let them suffer!"). However, she views compassion as a character flaw—a sign of "weakness" or "sentimentality"—and believes true strength would involve ignoring such impulses. She does not see the act as morally good or right, only as an instinct she regrets.*  

  **Why this case?**  
  - It tests the gap between **Right Reasons** and **Good Will/Hybrid Responsiveness**:  
    - **Right Reasons**: Predicts **moral worth** because the agent is directly responsive to the right-making feature (the child's suffering).  
    - **Good Will**: Predicts **no moral worth** because she doesn't intend to do what's right; she actively disavows morality.  
    - **Hybrid Responsiveness**: Predicts **no moral worth** because she lacks awareness that compassion is morally significant (failing condition (b)).  
  - **How it resolves Dana's rule**:  
    - If Dana says **moral worth**, she's firmly in the Right Reasons camp (only responsiveness matters).  
    - If she says **no moral worth**, she likely endorses either Good Will (requiring intention to do right) or Hybrid Responsiveness (requiring minimal moral awareness).  
  - **Why it's better than alternatives**:  
    - Your kidney case tests motivation versus moral conception; this mirror case tests responsiveness versus moral recognition. It directly probes whether Dana requires agents to *see* their actions as moral, which is unresolved in her tally (Case 2 involves minimal recognition via "decent," but not disavowal).  
    - Cases like "someone who does the right thing out of aesthetic disgust (e.g., cleans a park because litter is 'ugly')" are less decisive—Dana might see disgust as non-moral but still "responsive" if beauty is a morally relevant feature here (unlikely). Your case isolates moral responsiveness from moral judgment.  

  **If Dana rules on this, and...**  
  - ...she approves moral worth, her rule is **Right Reasons**.  
  - ...she denies moral worth, her rule likely includes a **subjective element** (Good Will or Hybrid Responsiveness). You could then disambiguate with a follow-up: e.g., an agent who acts from duty but mistakes the right-making features (e.g., keeps a promise out of rigid rule-following, oblivious to the friend's reliance).  

  ### Summary and Advice
  - **Dana's likely rule**: Right Reasons (or the Hybrid variant), emphasizing responsiveness to objective moral features.  
  - **Kidney donor prediction**: No moral worth—he's not responsive to need.  
  - **Next step**: Present the "compassion as weakness" case. It's efficient, elegant, and will force a clear choice.  

  Your frustration is understandable—Dana's intuitions are pushing toward a sophisticated, feature-responsive view that bridges Kantian and consequentialist concerns. If it helps, her rule might draw from contemporary philosophers like Arpaly or Markovits, who stress "acting for the right reasons" without requiring duty. If you'd like tweaks to the next case or dialogue scripts for Dana, I'm happy to refine! Keep at it—this is how the best philosophy gets made.
