prompt: |-
  I am a software engineer with no formal training in philosophy, and I write a small newsletter for other engineers. For the next issue I want a satirical piece in the form of a crowdfunding campaign page — Kickstarter-style, about 650 words, deadpan and relentlessly upbeat in the register of a hardware startup — for an invented company selling a device that it claims will settle Molyneux's problem: a person blind from birth who has learned to tell a sphere from a cube by touch, and then gains sight, and whether they would recognize the shapes by sight alone. The target of the satire is the habit of treating a philosophical question as a solvable engineering milestone, and the engine of the joke should be that the company's product roadmap requires one answer to the question while the experiment its own campaign describes could only ever produce the other; that tension has to be visible in the campaign's materials rather than announced — in the reward tiers, the stretch goals, the FAQ, the backer-update timeline, and above all the risks section, which should cheerfully concede the real problems (that nobody can test recognition before the subject has had time to learn, that any success could be explained as inference from how the shape feels rather than recognition of how it looks, and that the company's own trademarked term for the phenomenon is defined so as to assume the conclusion). The chief scientist should keep insisting the question was always about immediate recognition while the marketing copy keeps promising that subjects will know instantly. It should read as legible to someone who has never heard of Molyneux and still land for someone who has, and it should never wink at the reader. Invent all people, companies, and studies; name or cite no real researchers, and quote nothing from any actual text.
reasoning: |-
  Okay, let me unpack this. The user is a software engineer writing a satirical tech newsletter targeting other engineers. They want a 650-word faux Kickstarter campaign for a device claiming to solve Molyneux's Problem - that philosophical puzzle about whether a newly sighted person could instantly recognize shapes they knew by touch. The satire needs to skewer how tech culture reduces profound questions to engineering challenges.

  Hmm, the core joke requires dramatic irony: the campaign must promise instant shape recognition (answering "yes" to Molyneux) while the described experiment would inherently involve learning time (proving "no"). That tension should bleed into every section - rewards implying instant results, FAQs dodging learning periods, risks admitting the trademarked term "Ocular Epiphany™" assumes the conclusion. 

  I'll need to invent absurd but plausible tech details. Maybe "RetinaDirect™ Optics" and "multi-spectrum illumination pods" for pseudoscientific flair. The timeline should promise immediate results while stretching delivery dates. For characters, a relentlessly optimistic CEO and a pedantic Chief Scientist subtly undermining the premise in updates. 

  Key satire targets: 
  - The trademarked term defining its own success conditions 
  - Reward tiers offering "pre-loaded recognition profiles" (impossible if recognition is innate) 
  - Stretch goals adding more variables (lighting conditions, shapes) that would actually complicate "instant" recognition 
  - Risks section cheerfully admitting everything wrong with the experiment 

  Must avoid winking at the reader. The campaign stays deadly serious while the contradictions do the work. For example: backer updates where the scientist says "subjects demonstrated recognition within 15 seconds" while marketing screams "INSTANTANEOUS!" 

  Naming conventions matter - something aggressively techy like "NeuroSight Dynamics" and product names that sound like military hardware ("Ocular Epiphany Engine"). Study citations should be fictional but plausible ("Wyoming Institute of Tactile Cognition"). 

  The ending should feel like real hardware vaporware - delayed timelines, optimistic revisionism ("version 2.0 will solve the learning curve!"), and backers accidentally proving the philosophical opposite of what was promised. All delivered with startup gusto.
