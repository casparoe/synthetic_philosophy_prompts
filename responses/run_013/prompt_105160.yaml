  ### The Kalai-Smorodinsky Bargain  
  **A Poem for Two Voices**  

  **A:**  
  *If we walk, I take the east wing's light,*  
  *The oak desk, the keys, the airtight right.*  

  **B:**  
  *If we part, I claim the garden's yield,*  
  *The toolshed, the lease, the harvest's field.*  

  **A:**  
  *But the piano? Quiet in the parlor gloom—*  
  **B:**  
  *Its song should fill both rooms, not one alone.*  

  **A:**  
  *Wait—the deed reveals a vault below!*  
  *Gold coins, unclaimed, in rows aglow...*  
  **B:**  
  *...Then split the treasure, fair and square?*  

  **A:**  
  *No—my claim runs deeper, older.*  
  *Stand back. The hoard*  
  *Is mine to hold.*  

  **B:**  
  *...Yet tend the soil, the vine, the tree?*  
  *I anchor roots. You sail, stone-free?*  

  **A:**  
  *Take two-thirds the gold. The garden stays yours.*  
  **B:**  
  *And the piano? Played with open doors?*  

  **A:**  
  *All Sundays, yes.*  
  **B:**  
  *All Saturdays, mine.*  
  **A:**  
  *Done.*  
  **B:**  
  *Done.*  

  ---

  ### How This Embodies Kalai-Smorodinsky  
  - **Disagreement Point (Opening):**  
    A claims the east wing and desk (2 lines).  
    B claims the garden and toolshed (2 lines).  

  - **Ideal Points & Gains:**  
    - *Initially:* A's maximum gain = 4 lines beyond disagreement (total 6). B's = 2 lines beyond (total 4).  
      - *Gains achieved:* A gains 3 lines, B gains 1 line → ratio **3:1** = **6:2** (ideal gain ratio).  
    - *Mid-poem:* A discovers vault gold (line 5), expanding their ideal from 4 to 6. B’s gain *in proportionally*:  
      - New ideal ratio = 6:2 → Gains adjust to 3:1 (A adds 2 lines post-discovery, maintaining **t = 0.5**).  

  - **Pareto Frontier (Close):**  
    Final lines ("Take two-thirds...Done") ensure no further gain without loss:  
    - A cannot claim garden without B losing; B cannot demand more gold without A losing.  
    - Alternation ceases at mutual consent.  

  - **Line Count Verification:**  
    - A: 2 (disagreement) + 3 (gains) = **5 total**.  
    - B: 2 (disagreement) + 1 (gains) = **3 total**.  
    - Gains: A↑3, B↑1. Ideal gains: A↑6, B↑2 → **3/6 = 1/2, 1/2 = 1/2**.  
    *(KS ratio preserved.)*  

  The poem’s *structure* is the solution—voices alternate, gains scale proportionally, and the frontier halts at balance. No theory needed to feel the tension resolve.
