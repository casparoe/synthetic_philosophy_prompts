  The user also wants two subsidiary points: first, that this problem only appears with three or more outcomes (since with two outcomes it collapses to transformed EU), and second, that fixing the risk function across gambles doesn't solve the problem - it actually makes the doxastic interpretation more coherent.

  I'll structure this as a continuous prose argument for a skeptical colleague. I'll start with a concise explanation of RDU, then demonstrate the mathematical equivalence between the risk-weighting and distorted-belief interpretations. I'll show how this equivalence persists even with a fixed risk function, and explain why this isn't ordinary underdetermination but rather a failure to isolate risk attitudes as a distinct psychological component. I'll use the three-outcome case to make the dependence on ranking position clear.

  I need to be careful about terminology - I'll use "credence" for belief-like states and "risk attitude" for the purported distinct component. The argument should build step by step: first establish the mathematical equivalence, then argue why it matters for interpretation, then address the subsidiary points about outcome dimensionality and fixed risk functions.

  For the three-outcome case, I'll construct a concrete example showing how changing probability distributions alter weights even when risk function stays fixed. This will demonstrate that the ranking-dependence isn't just about risk but could reflect belief distortions tied to event descriptions.

