       - Currently shares a two-bedroom apartment with relatives (6 people) in a different neighborhood. They work at a grocery store on Oak Street. They would apply for one of the affordable units. They need stability for their children.

  The Findings Form:

     **Elmwood Neighborhood Association Land Use Committee
     Conditional Use Recommendation Findings Form**

     Project: 1500 Oak Street Apartments

     Date: [Today]

     Committee must record findings on:

     1. Consistency with the adopted Elmwood Neighborhood Plan (check one):
        [ ] Consistent
        [ ] Not Consistent
        Comments: _________________________________________________________

     2. Impacts on the immediately surrounding blocks (within 500 feet) (check one):
        [ ] No significant negative impacts
        [ ] Significant negative impacts
        Comments: _________________________________________________________

     Recommendation (check one):
        [ ] Approve
        [ ] Deny

     Signature: ___________________________

     Note: The committee may only consider the above criteria.

  The Sealed Envelope: Contains 60 small tokens (e.g., buttons, beads) in a bag. 15 of them are a different color. Label: "The households that would have lived at 1500 Oak Street."

  Rule Change Menu (on a handout):

     **Rule Change Options (choose one):**

     A. Add three at-large citywide seats to the body. These members would be appointed by the city council and represent the entire city's interests.

     B. Keep the body as is but attach a cash payment to the neighborhood association. The developer would pay $500 per market-rate unit and $1000 per affordable unit (total $45,000) to the Elmwood Neighborhood Association to mitigate impacts (e.g., for park improvements, traffic calming).

     C. Take the recommendation out of the decision path and let a citywide body (the Planning Commission) decide, with the neighborhood association's comments as part of the record but not binding.

  Now, the minute-by-minute timeline in detail:

  0-5 min: 
     - Introduce the activity: "Today we are simulating a neighborhood land use meeting for a proposed apartment building. We have a neighborhood body that will vote, applicants who will present, and community members who will testify. Your goal is to go through the process and make a recommendation."

  5-10 min: 
     - Hand out the site brief and role cards. Assign roles. There are 15 roles (10 voting, 2 applicants, 3 testifiers). If you have more students, assign multiple to the same non-voting role (but only one per voting role). If fewer, omit some voting roles (e.g., omit one against and one for) but keep the balance. Make sure the testifiers are assigned.

  10-15 min: 
     - Applicants present: Give them 5 minutes total (they can split the time).

  15-25 min: 
     - Testimony: Each testifier has 2 minutes. Then, open the floor for questions from voting members for 6 minutes (2 minutes per testifier? but be flexible). Total 10 minutes.

  25-45 min: 
     - Discussion among voting members. They should discuss and fill out the findings form. The facilitator should act as chair and keep time. Look for the moment when someone (likely the doubled-up household testifier or a voting member) points out that the testimony about the nurse's commute or the doubled-up situation doesn't fit in the form. If it doesn't happen, the facilitator can ask: "How do we record the nurse's testimony in the findings form?" to prompt.

  45 min: 
     - Swap: Have everyone stand and exchange their location card (a separate card with their location) with someone across the room. They keep their role card. Give them 2 minutes to adjust.

  45-65 min: 
     - Second discussion and vote. They discuss again (now with new locations) and then vote by secret ballot. The facilitator collects and tallies the votes.

  65-70 min: 
     - Open the sealed envelope and show the tokens. Explain: "These represent the 60 households that would have lived here. They were never in the room."

  70-75 min: 
     - Present the rule change menu. The voting members must choose one rule to amend (by a show of hands). Then, they re-vote on the same proposal (with the new rule in mind? but the rule change might not take effect immediately, so explain that the vote is under the new system).

  75-85 min: 
     - Discussion and vote on rule change, then re-vote on the proposal. They can discuss the rule change and then vote on the rule (which rule to adopt). Then, without changing their roles, they vote again on the project (but now under the new rule). Note: The rule change might not affect the current vote immediately, but we are simulating that it does.

  85-90 min: 
     - Debrief.

  Debrief Script:

  "Let's unpack what happened.

  First, the findings form: We had to evaluate the project on two very specific criteria. But what about the nurse's commute? Or the doubled-up household? There was no place to put that. So even if we wanted to consider them, the rules didn't allow it. This is a key point: a process can be perfectly fair by its own rules and yet systematically exclude the needs of people who are not already in the neighborhood.

  Second, the swap: You changed locations but kept your role. Did your arguments change? Did your vote? The right to the city is both about having a voice (which you still had) and about the outcome (whether you get to live there). But note: even after the swap, you were still in the room. The people who are completely excluded weren't.

  Third, the envelope: The tokens represent the people who would have lived in the building. They were never in the room. The process didn't account for them. The right to be in the city was denied without their input.

  Fourth, the rule change: We tried to fix the exclusion by changing one rule. But each option has trade-offs. Adding citywide seats might make the process less responsive to local concerns. A cash payment might not help the excluded. Shifting to a citywide body might make the process less democratic at the neighborhood level. This shows that the tension between the right to participate and the right to inhabit is hard to resolve.

  In reality, the exclusion happens over decades, by many such decisions, and the excluded are invisible. Also, the rules are not one but many, and they are often taken for granted.

  The core idea we wanted to convey is the dual nature of the right to the city: it is both about having a say in change and about having a place in the city. These two can come apart."

  Finally, the answer:

  \answer{the dual nature of the right to the city}
answer: |-
  ### Staged Activity Design: "The Oak Street Decision"

  #### **Materials Overview** (All materials can be typed in 1 hour; use concise bullet points for role cards)
  - **Site Brief (1 page)**: Printed handout for all participants.  
  - **Role Cards**: 10 voting members, 2 applicants, 3 non-voting testifiers. Each card lists: role, location, private stake, and core motivation.  
  - **Findings Form**: A half-sheet with fixed criteria (consistency with neighborhood plan, impacts on surrounding blocks).  
  - **Location Cards**: Separate from role cards (e.g., "Maple St. Homeowner," "Oak St. Renter").  
  - **Sealed Envelope**: Contains 60 small tokens (e.g., paper dots)—45 white (market-rate units), 15 blue (affordable units).  
  - **Rule Change Menu**: Printed options for Phase 2.  
  - **Voting Ballots**: Paper slips for secret votes.

  ---

  #### **Materials**  
  **1. Site Brief (One page; adjust city/neighborhood names as needed)**  
  **Project**: 60-unit apartment building (15 below-market units) at 1500 Oak St.  
  **Current Site**: Surface parking lot (20 spaces) + vacant laundromat.  
  **Context**:  
  - Located on a bus line; commercial corridor with shops, cafes.  
  - Directly adjacent to single-family homes (Maple St. to the north, Cedar St. to the south).  
  - School 0.5 miles away (currently at 90% capacity).  
  - Adopted Neighborhood Plan Goals:  
    - "Encourage affordable housing near transit."  
    - "Maintain neighborhood character on residential blocks."  
    - "Support small businesses on Oak St."  
  **Decision Process**:  
  - The Elmwood Neighborhood Advisory Board (10 voting members) must recommend approval/denial of a conditional use permit.  
  - Recommendation hinges on two findings:  
    1. Consistency with the adopted neighborhood plan.  
    2. Impacts on the immediately surrounding blocks (traffic, parking, noise, aesthetics).  
  - Testimony from the public is allowed but must relate to the findings.  

  **2. Role Cards**  
  *(Private stakes drive arguments; locations are specific streets/blocks)*  
  **Voting Members (10)**:  
  1. **Landlord**: Owns two fourplexes on Oak St. *Stake:* Fears rent competition from new affordable units. Motivated to protect rental income.  
  2. **Recent Homebuyer**: Bought a Maple St. house 6 months ago. *Stake:* Worried about property values and construction noise. Motivated to preserve "neighborhood character."  
  3. **Long-time Renter**: Rents on Cedar St. for 15 years. *Stake:* Supports affordability but fears gentrification displacing renters. Motivated by housing justice.  
  4. **Parent**: Lives on Maple St. with kids in local school. *Stake:* Anxious about school overcrowding and traffic. Motivated to protect children’s safety.  
  5. **Corridor Shopkeeper**: Runs a bookstore on Oak St. *Stake:* Wants foot traffic but worries about parking loss. Motivated by business survival.  
  6. **Process Purist**: Homeowner on Cedar St. *Stake:* No personal stake; demands strict adherence to rules. Motivated by "fair procedure above all."  
  7. **Environmental Advocate**: Renter on Oak St. *Stake:* Supports transit-oriented development. Motivated by sustainability.  
  8. **Retiree**: Homeowner on Maple St. for 30 years. *Stake:* Resists change; fears noise and "big city" feel. Motivated by nostalgia.  
  9. **Affordable Housing Nonprofit Staff**: Renter on Cedar St. *Stake:* Pushes for more below-market units. Motivated by equity.  
  10. **Local Worker**: Rents a room on Oak St.; works at a cafe. *Stake:* Needs cheaper rent but fears displacement. Motivated by affordability.  

  **Applicants (2; present but non-voting)**:  
  - **Developer**: Argues the project meets zoning, adds housing, and includes community benefits (e.g., retail space).  
  - **Architect**: Highlights design (energy efficiency, public plaza) and proximity to transit.  

  **Non-Voting Testifiers (3; may testify)**:  
  - **Nurse**: Commutes 50 minutes; would rent a market-rate unit. *Testimony:* "I serve this city but can’t afford to live here. This building would cut my commute."  
  - **Local Teenager**: Lives on Maple St. *Testimony:* "We need spaces for youth. The laundromat was our hangout—replace it with something for us."  
  - **Doubled-Up Household**: Shares a relative’s apartment outside the neighborhood. *Testimony:* "I’d apply for an affordable unit. My family needs stability, not a couch."  

  **3. Findings Form**  
  ```  
  ELMWOOD NEIGHBORHOOD ADVISORY BOARD  
  FINDINGS FOR CONDITIONAL USE PERMIT  
  Project: 1500 Oak St. Apartments  

  1. Consistency with adopted neighborhood plan:  
     [ ] Consistent [ ] Not Consistent  
     Comments: _______________________________  

  2. Impacts on immediately surrounding blocks:  
     [ ] Minimal/Negligible [ ] Significant/Negative  
     Comments: _______________________________  

  RECOMMENDATION: [ ] Approve [ ] Deny  
  ```  
  *Note: Only these findings may be considered.*  

  **4. Rule Change Menu (Phase 2)**  
  - **Option A**: Add three at-large citywide seats to the board.  
  - **Option B**: Keep the board but attach a $50,000 payment from the developer to the neighborhood association.  
  - **Option C**: Remove the board’s power; citywide planners decide, with neighborhood input as comment only.  

  ---

  #### **Timeline (90 Minutes Total)**  
  **0–10 min: Setup**  
  - Distribute materials: site brief, role cards, location cards.  
  - Assign roles (ensure voting majority leans skeptical to start).  
  - Explain: "You’ll simulate a neighborhood board meeting. Voting members must use the findings form. Applicants and testifiers will speak."  

  **10–20 min: Applicant Presentation**  
  - Developer/architect present (5 min total).  
  - Voting members ask brief questions (5 min).  

  **20–35 min: Testimony and Discussion**  
  - Non-voting testifiers speak (2 min each).  
  - Voting members discuss and fill out findings form (10 min).  
  - *Key moment:* Testifier (e.g., nurse) or empathetic voter objects: "My commute isn’t in the findings!" Highlight this.  

  **35 min: Location Swap**  
  - All participants swap location cards with someone across the room (e.g., landlord becomes renter; retiree becomes shopkeeper). Roles/stakes stay the same.  
  - Announce: "New city plans affect everyone—imagine you’ve moved." (2 min).  

  **35–55 min: Post-Swap Discussion and Vote**  
  - Revote using same findings form (secret ballot).  
  - Tally and announce result.  

  **55–60 min: Sealed Envelope Reveal**  
  - Open envelope; scatter tokens on a table: "These 60 tokens represent households that would have lived here. They were never in the room."  

  **60–75 min: Rule Change and Re-Vote**  
  - Board selects one rule change from the menu (5 min discussion, majority vote).  
  - Revote on the proposal under the new rule (secret ballot).  

  **75–85 min: Tally and Announce Results**  
  - Compare initial and post-rule-change votes.  

  **85–90 min: Debrief**  

  ---

  #### **Debrief Script**  
  *Connect each mechanic to the core idea:*  
  1. **Findings Form**: "You had to use a narrow form—consistency with the plan, local impacts. But testimony about commutes or doubled-up housing? No box. That’s how a ‘fair’ process excludes people who need the city. The rules filter out broader claims to belonging."  
  2. **Location Swap**: "When you swapped locations, your role didn’t change, but your perspective might have. Did your vote shift? This mirrors how the ‘right to a voice’ stays with you even if you move—but the ‘right to be here’ vanishes if you’re priced out. Yet in reality, you don’t get to swap; exclusion sticks."  
  3. **Sealed Envelope**: "The tokens symbolize the invisible excluded—the people who would’ve lived here. They weren’t at the table because the process isn’t designed for them. Fair procedures can still exile."  
  4. **Rule Menu**: "You amended one rule to fix exclusion, but each option had trade-offs. Citywide seats dilute local voice; cash payments don’t house people; shifting power feels undemocratic. No fix perfectly bridges voice and belonging."  

  *Core idea recap*:  
  "A right to the city is two things: a right to shape your neighborhood, and a right to exist in the city. Today, you felt how a process can honor the first while crushing the second—with no villain, just rules."  

  ---

  #### **Predictable Failures and Fixes**  
  - **Swing vote obvious early**: If consensus forms too fast (e.g., early landslide), inject uncertainty: "New traffic data just released: construction may last 18 months, not 12." Reset expectations mid-discussion.  
  - **Non-voting roles go quiet**: Prep the testifiers privately: "The nurse must mention her commute at least once." If they freeze, ask directly: "Nurse, how would this affect your daily life?"  
  - **Non-voting roles go meta**: If they critique the activity (e.g., "This is unrealistic"), redirect: "In your role, what would you say to the board?" Keep the simulation grounded.  
  - **Voters ignore the findings form**: Gently enforce: "Remember, your recommendation can only cite the two findings." Place the form prominently.  
  - **Rule-change debate derails**: Set a timer. If deadlocked, take a majority vote on options.  

  #### **What the Activity Cannot Reproduce**  
  1. **Invisibility of the excluded**: Real exclusion happens to people not represented by tokens or testifiers—they’re absent, not symbolically present.  
  2. **Accumulation of default rules**: One findings form simplifies reality; true exclusion stems from hundreds of unchallenged codes (zoning, fees) that compound.  
  3. **Timescale**: Neighborhood change takes decades; this compresses it into one decision.  
  4. **Structural power imbalances**: Roles simplify stakes; real dynamics involve race/class biases, lobbying, and historical inequities.  
  *Supplement these gaps in lecture*: Use data on displacement, examples of "death by a thousand cuts" (e.g., parking minimums), and stories of invisible communities.  

  \answer{the procedural-substantive split}
