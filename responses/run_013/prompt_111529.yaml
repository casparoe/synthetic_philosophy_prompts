prompt: |-
  I teach an upper-level seminar on the ethics of the city: twenty students, roughly half philosophy majors and half from the planning school, one ninety-minute session, no projector, though I can print handouts. I keep failing to convey by lecturing a split that I want them to feel instead: that a right to the city is really two claims wearing the same clothes — a right to a voice in how a neighborhood changes, and a right to be in the city at all — and that a procedure can be scrupulously fair on the first count while producing a systematically exclusionary result on the second, with nobody behaving badly.

  Design a staged activity that does this. The idea must arrive through the rules, the incentives and the roles, not through anything I announce; I want the room to run into it and only afterwards hear it named. Build it around this scenario, adjusting numbers but not the shape: a mid-sized city, rising rents, a proposal for a sixty-unit apartment building — fifteen units below market — on a site that is now a surface parking lot and a shuttered laundromat, on a commercial corridor with a bus line, with single-family blocks behind it. The neighborhood body's recommendation on the conditional use effectively decides the matter.

  Include, and specify fully enough that I can type the materials in an hour:

  - A one-page site brief and ten role cards for voting members of the neighborhood body, each carrying a private stake (a landlord with two nearby fourplexes, a recent buyer, a long-time renter, a parent worried about school crowding, a corridor shopkeeper who wants foot traffic, someone whose real stake is that the process look fair, and so on), plus two applicant roles who present but do not vote, and three roles who may testify but not vote — a nurse with a fifty-minute commute, a local teenager, and someone currently doubled up with relatives who would apply for one of the fifteen units.
  - A rule that the body may record findings only in a fixed form: the proposal's consistency with the adopted neighborhood plan, and impacts on the immediately surrounding blocks. Testimony about a commute or about a doubled-up household has no box to go in. Someone should notice this and object; that moment is one I want to be able to count on.
  - Midway through, a swap: every participant exchanges location cards with someone across the room, so a homeowner becomes a renter three blocks away. Their arguments need not change, and I want to see whether their votes do.
  - A sealed envelope, opened only at the end, holding tokens representing the households that would have lived in the building and were never in the room.
  - A second phase in which the group may amend exactly one rule, from a menu of three: add three at-large citywide seats to the body; keep the body as is but attach a cash payment to the neighborhood association; or take the recommendation out of the decision path and let a citywide body decide, with neighborhood comment on the record only. Then re-vote the same proposal.

  Give me a minute-by-minute timeline for the ninety minutes, and a debrief that maps each mechanic — the findings form, the swap, the envelope, the rule menu — onto the corresponding part of the idea, in language I can use out loud. Add an honest section on what will predictably go wrong the first time I run it and how to handle each failure, including what to do if the swing vote becomes obvious too early or if the three non-voting roles go quiet or go meta. Then tell me what this activity cannot reproduce and that I will have to supply myself — I suspect it cannot show that in reality the excluded are invisible rather than seated in the room, that the exclusionary work is done by hundreds of small default rules nobody ever votes on, and that the process runs over decades rather than one evening, but say what you think the real gaps are.

  End with a final line in the form \answer{...} containing a single short phrase naming the one idea the activity is engineered to make participants feel. That line is for me, not for the students, so use the ordinary name of the concept even though they should not hear it until the debrief.
reasoning: |-
  We are designing a 90-minute activity to demonstrate the split between two aspects of the "right to the city": 
    1. The right to have a voice in how a neighborhood changes (procedural fairness in local decision-making).
    2. The right to be in the city at all (substantive outcome of inclusion, especially for the disadvantaged).

  The activity will have:
    - A neighborhood body (10 voting members) with specific roles and stakes.
    - 2 applicant roles (present but don't vote).
    - 3 non-voting testifiers (nurse, teenager, doubled-up household).
    - A fixed findings form that only considers "consistency with neighborhood plan" and "impacts on immediately surrounding blocks".
    - A mid-activity swap of location cards (changing roles geographically without changing the character).
    - A sealed envelope with tokens representing the excluded future residents.
    - A second phase with a rule change (one of three options) and a re-vote.

  We need:
    - A one-page site brief.
    - 10 role cards for voting members (with private stakes).
    - 2 applicant role cards.
    - 3 testifier role cards.

  Structure of the activity:

  Minute-by-minute timeline:

  0-5 min: Introduction and setup. Hand out materials. Explain the setting and the task: The neighborhood body must make a recommendation on the conditional use permit for the proposed apartment building. The body will have a meeting with testimony, discussion, and vote. The body must record findings in the fixed form.

  5-10 min: Role assignment. Assign each participant a role. There are 15 participants (10 voting, 2 applicants, 3 testifiers). If there are more than 15 students, assign multiple to some roles (but each voting role must be unique). If fewer, omit some roles (but keep the core). Hand out the role cards and the site brief.

  10-15 min: Applicants present. The two applicants (developer and architect?) present the project. They have 5 minutes total.

  15-25 min: Testimony. The three non-voting testifiers (nurse, teenager, doubled-up household) each have 2 minutes to speak. Also, the voting members can ask questions (but keep it brief).

  25-45 min: Discussion among voting members. They discuss the project and try to fill out the findings form. The chair (you? or assign a chair role) leads. The fixed form only has two boxes: 
    1. Consistency with the adopted neighborhood plan (which says the site is zoned for mixed-use, and the plan encourages affordable housing and transit-oriented development).
    2. Impacts on the immediately surrounding blocks (traffic, parking, noise, etc.).

  During this time, the testifiers and applicants can listen but not speak unless asked. The facilitator should note if someone (likely the testifiers or an empathetic voting member) points out that the testimony about long commutes or housing insecurity doesn't fit in the form. This is a key moment.

  45 min: Mid-activity swap. All participants exchange their location cards (which are part of their role) with someone across the room. For example, a homeowner from Block A swaps with a renter from Block C. The role (e.g., landlord, parent) stays the same, but the location changes. This might change their perspective on "impacts on surrounding blocks". They have 2 minutes to adjust.

  45-65 min: Second round of discussion and vote. The voting members discuss again and then vote by secret ballot. The facilitator collects the votes and announces the result.

  65-70 min: Open the sealed envelope. Reveal the tokens (e.g., 60 small tokens, 15 of a different color for affordable units). Explain that these represent the people who would have lived there but were excluded by the decision.

  70-75 min: Rule change phase. Present the three options for rule change:
    Option A: Add three at-large citywide seats to the body.
    Option B: Keep the body as is but attach a cash payment to the neighborhood association (to mitigate impacts).
    Option C: Take the recommendation out of the decision path and let a citywide body decide, with neighborhood comment only.

  The body must choose one rule to amend (by majority vote) and then re-vote on the same proposal.

  75-85 min: Discussion and vote on rule change, then re-vote on the proposal.

  85-90 min: Debrief.

  Debrief points:

  1. The fixed findings form: 
     - "You had to evaluate the project on two narrow criteria: consistency with the plan and impacts on the immediate blocks. But what about the nurse's long commute? The doubled-up household? The teenager's desire for more activity? There was no box for that. This is a procedural fairness that excludes broader impacts and the needs of people not yet in the neighborhood. So the process can be fair in form but exclusionary in outcome."

  2. The swap: 
     - "When you swapped locations, your role didn't change, but your perspective on 'impacts' might have. Did that change your vote? The right to the city is both about having a voice (which you kept) and about the outcome (which might have shifted). But note: even if you moved, you were still in the room. What about those who weren't?"

  3. The sealed envelope: 
     - "These tokens represent the people who would have lived in the building. They were never in the room. The decision was made without them. The right to be in the city was denied by a process that didn't account for them."

  4. The rule menu: 
     - "We changed one rule to try to fix the exclusion. But note: each rule change has trade-offs. Adding citywide seats might dilute local voice. A cash payment might not help the excluded. Shifting to a citywide body might make the process less responsive to local impacts. The point is that there is no perfect fix because the two rights are in tension."

  What will go wrong and how to handle:

  1. Swing vote obvious too early: 
     - If during the first discussion it's clear which way the vote will go, push for the vote to be taken early? No, because we need the swap. Instead, use the swap to disrupt the dynamic. If it's still obvious, note in the debrief that group dynamics sometimes dominate.

  2. Non-voting roles go quiet: 
     - The three testifiers might not speak up. Assign one of them to be the one to object about the findings form (e.g., the doubled-up household). Or, as facilitator, ask: "How would you record the nurse's testimony in the findings form?" to prompt the objection.

  3. Non-voting roles go meta: 
     - They might comment on the activity instead of staying in role. Gently remind them to stay in character. If they persist, note that in reality, people in these positions often feel they have to perform their pain to be heard.

  What the activity cannot reproduce:

  1. The excluded are invisible: The activity has tokens and the three testifiers, but in reality, the excluded are not present and not represented by tokens. We have to imagine the scale.

  2. Exclusion by default rules: The activity has one fixed findings form, but in reality, there are hundreds of such rules that accumulate over time.

  3. Timescale: The decision happens in one evening, but in reality, exclusion happens over decades through many such decisions.

  4. The role of structural inequalities: The activity simplifies individual stakes, but in reality, systemic racism, classism, etc., are at play.

  Final idea: The activity is engineered to make participants feel the "tension between procedural legitimacy and substantive inclusion".

