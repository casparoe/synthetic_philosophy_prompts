  But I think the first is better.

  Now, we need to create the materials.

  Materials:

  1. Site Brief (one page):

     **Site Brief: The Oak Street Corridor Proposal**

     Location: 1500 Oak Street, in the Elmwood neighborhood of Midcity.

     Current use: A surface parking lot (20 spaces) and a shuttered laundromat (vacant for 2 years).

     Proposal: A 60-unit apartment building with ground-floor retail. The building will include 15 units (25%) affordable to households earning 60% of the Area Median Income (AMI). The rest are market-rate. The building will have 30 parking spaces (0.5 per unit) and bicycle parking. It is located on the Oak Street bus line (every 15 minutes).

     Zoning: The site is zoned MX-3 (Mixed-Use, medium density). The adopted Elmwood Neighborhood Plan designates this area as a "Neighborhood Center" and encourages transit-oriented development, mixed-income housing, and ground-floor retail.

     Context:
       - The Oak Street corridor has a mix of small shops and restaurants. The immediate area has seen rising rents and concerns about displacement.
       - Behind the site (to the north and south) are single-family homes. The nearest elementary school is at 85% capacity.
       - The neighborhood body (Elmwood Neighborhood Association Land Use Committee) has the authority to make a recommendation on the conditional use permit for the project. The city planning commission typically follows this recommendation.

     Decision Criteria for the Committee:
       - By rule, the committee must base its recommendation on:
          1. Consistency with the adopted Elmwood Neighborhood Plan.
          2. Impacts on the immediately surrounding blocks (within 500 feet).

     The committee may not consider citywide housing needs, regional transportation, or individual circumstances beyond the immediate area.

  2. Role Cards (10 voting members):

     Each card should have:
       - Role
       - Location (which block they live/work on)
       - Private stake
       - Optional: a short note on how they might lean

     Example:

     **Role 1: Landlord**
       - Location: Owns two fourplexes on Oak Street, one block east of the site.
       - Stake: Worried about competition from new units (especially affordable ones) and potential rent pressure. Also, the project might bring more customers to the area. Wants to protect property values.
       - Leaning: Against (fears oversupply and lower rents).

     **Role 2: Recent Homebuyer**
       - Location: Bought a single-family home on Maple Street (one block south) 6 months ago.
       - Stake: Invested life savings. Worried about construction noise, traffic, and potential school crowding. Also concerned about property values and neighborhood character.
       - Leaning: Against.

     **Role 3: Long-time Renter**
       - Location: Rents an apartment on Oak Street, two blocks west.
       - Stake: Has lived in the neighborhood for 20 years. Rents are rising. Wants more affordable housing but also worries about gentrification. Uses the bus daily.
       - Leaning: For (if it helps with affordability) but concerned about displacement.

     **Role 4: Parent**
       - Location: Lives on Cedar Street (two blocks north) in a single-family home.
       - Stake: Has two children in the local elementary school. Worried about school crowding. Also concerned about traffic safety and parking spillover.
       - Leaning: Against.

     **Role 5: Corridor Shopkeeper**
       - Location: Owns a bookstore on Oak Street, across from the site.
       - Stake: Wants more foot traffic. The project would bring 60+ new residents and retail space. Worried about construction disruption.
       - Leaning: For.

     **Role 6: Environmental Advocate**
       - Location: Lives on Pine Street (three blocks east) in a condo.
       - Stake: Believes in sustainable development. The project is near transit and reduces car dependency. The site is currently an underused parking lot.
       - Leaning: Strongly for.

     **Role 7: Process Fairness Advocate**
       - Location: Rents an apartment on Oak Street, one block west.
       - Stake: Wants the decision to be fair and by the book. They value the rules and procedures above outcomes. They are neutral on the project but will follow the findings.
       - Leaning: Will follow the form.

     **Role 8: Retiree**
       - Location: Owns a single-family home on Oak Street, one block north.
       - Stake: Has lived there for 40 years. Worried about change, traffic, and parking. Values the quiet of the neighborhood. Doesn't want a big building.
       - Leaning: Against.

     **Role 9: Community Organizer**
       - Location: Lives in an apartment on Elm Street (two blocks south).
       - Stake: Works for a nonprofit fighting displacement. Sees the project as a drop in the bucket but better than nothing. Wants to push for more affordable units.
       - Leaning: Conditionally for (might try to negotiate).

     **Role 10: Local Worker**
       - Location: Works at a cafe on Oak Street and rents a room on Walnut Street (three blocks north).
       - Stake: Cannot afford to live in the neighborhood. Commutes 30 minutes. Wants more housing but also worries about losing the character of the neighborhood.
       - Leaning: Undecided.

  3. Applicant Roles (2):

     **Applicant 1: Developer**
       - Represents the development company. Argues the project meets the zoning and plan, provides needed housing, and will revitalize the corridor. Willing to discuss community benefits.

     **Applicant 2: Architect**
       - Presents the design: energy-efficient, attractive, with a small plaza. The retail space is for a local business. The affordable units are integrated throughout.

  4. Non-voting Testifiers (3):

     **Testifier 1: Nurse**
       - Works at the downtown hospital. Currently has a 50-minute commute by bus because they can't find affordable housing closer. They would love to live near work and would apply for a market-rate unit in the building.

     **Testifier 2: Local Teenager**
       - Lives with their family in a rented apartment two blocks away. The laundromat was the only place they could hang out. They want more activity and a place for youth. The new building might have a community room? They are worried about being pushed out if rents rise.

