  Hmm... the challenge is showing how truthfulness collides with group loyalty without ever stating Weil's theory explicitly. The user mentioned ordinary groups like a church choir or tenants' committee - a community garden feels perfect. It's inherently collaborative but can develop subtle boundaries ("real gardeners" vs. others). 

  I'm imagining how small concessions accumulate: First, allowing practical compromises (like the non-native plants for visibility). Then social pressure against dissent (Celia's seed incident). Finally, active exclusion camouflaged as practicality (the bench removal). The key is making each step reasonable alone, but collectively sinister. 

  The user emphasized no single turning point. So I'll show the group gradually prioritizing emotional cohesion: celebrating victories while ignoring Margaret's valid concerns, recasting her as disloyal rather than mistaken. The most chilling character is actually Celia - her "this is what gardens do" line reveals how good people enable this shift. 

  Title should reflect the surface-level innocence while hinting at the underlying mechanism. "The Fence Committee" works because fences literally mark boundaries, and "committee" sounds bureaucratic - masking the emotional engine beneath. 

  For structure: Open with hopeful unity (the grant), then inject small fractures (plant choices, rules). Use Margaret as the truth-teller who becomes inconvenient. End not with resolution but uneasy normalization - the bench removal isn't questioned because belonging now requires accepting the unspoken rules.
