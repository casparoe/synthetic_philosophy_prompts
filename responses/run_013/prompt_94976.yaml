  ## The Fence Committee

  The news arrived like a burst of spring rain: the Overton Community Garden had secured the Green Thumb Initiative grant. Not a fortune, but enough for proper raised beds, a rainwater collection system, and – the most contentious item – a decorative perimeter fence. The fence wasn’t just about rabbits; it was about *identity*. "A place that looks cared for," argued Celia, chair of the newly formed Fence Committee, "is a place that *is* cared for. It shows commitment."

  Everyone agreed. At first.

  The committee – Celia, earnest and organized; Ben, retired engineer with a practical bent; Margaret, lifelong gardener with soil permanently under her nails; and gentle, artistic Anya – met in Celia’s sunroom. Initial discussions were harmonious. Wrought iron? Too expensive. Chain-link? Too harsh. They settled on stained cedar lattice: functional, attractive, *theirs*.

  The first concession felt necessary. Ben pointed out that a section near the pavement needed sturdier posts to withstand potential knocks from careless pedestrians. "Maybe a small, low brick base there?" he suggested. "More durable." An extra cost, but sensible. Agreed.

  Then came plantings near the fence. Margaret, eyeing the sun map, suggested native wildflowers: hardy, beneficial for pollinators. Anya sketched charming clusters of echinacea and milkweed. But Celia worried. "Will they look... messy? To passersby? What about something tidier? Boxwoods? Lavender?" They debated. Ben sided with Celia: "First impressions matter for funding renewal." Anya, wanting harmony, conceded. Margaret sighed but nodded. The tidier, less ecologically perfect option was chosen. A small thing for group cohesion.

  The grant stipulated community involvement. They planned a "Planting Day Picnic." Posters went up. Margaret, checking the sign-up sheet, noticed someone had scribbled "Black-Eyed Susans?" next to the lavender section. "These aren't native," she murmured to Ben at the next meeting. "We specified *native* pollinators for the grant report." Ben shrugged. "It’s enthusiasm, Margaret. Can’t dampen that. We’ll adjust the report wording slightly." Celia smiled gratefully. "Exactly. The *feeling* of participation is key."

  Then came the incident with the seeds. Anya, tasked with buying them, found the local nursery out of the specific lavender variety. She bought visually similar ones. When Margaret discovered the substitution – a cultivar less attractive to bees – she brought it up. "It undermines the whole pollinator justification," she said, her voice tight.

  The room shifted. Celia’s smile was fixed. "Anya did her best, Margaret. It was chaotic that day. Pointing fingers isn’t helpful." Ben cleared his throat. "The *look* is consistent. That’s what people will see. The *intent* was pollinator-friendly." Anya looked down, cheeks flushed. Margaret’s factual correction felt like an attack on Anya’s effort, on the committee’s collective goodwill. The *rightness* of the seed choice became secondary to the *wrongness* of disrupting the group’s warm sense of shared purpose. Margaret’s persistence, not the seed, became the problem.

  The picnic was a triumph. Children painted rocks, adults planted lavender and boxwood, laughter echoed. They felt it strongly then, the committee – a surge of pride, of belonging to something tangible and good. "See?" Celia beamed, surveying the bustling, unified scene. "This is what we’re building."

  Afterwards, tidying up, Margaret found leftover budget printouts Celia had brought. She noticed a discrepancy – a small overestimation on the brick base cost. Ben had handled that quote. She pointed it out privately to Celia the next day, suggesting they adjust the final report. "Ben’s usually so precise," she added.

  Celia’s face closed. "Margaret, Ben worked tirelessly on those quotes. It’s a tiny rounding difference. Highlighting it now feels... divisive. After such a successful day? We need to move forward *together*. Not nitpick." The implication was clear: Margaret’s accuracy was becoming disloyalty. Her role as the gardener who knew about seeds and soil was quietly being overwritten. She was becoming the person who cooled the shared warmth.

  The final fence design meeting arrived. The last item: a small memorial bench donated years ago, sitting awkwardly half-inside, half-outside the proposed fence line. It needed moving. Margaret suggested integrating it just inside the gate, under the old maple. "It’s a nice spot. Belongs to the garden’s history."

  Ben frowned. "It’s weathered. Doesn’t match the new cedar aesthetic. And moving it properly is an extra cost." Anya, glancing at Celia, murmured, "Maybe... relocate it to the park nearby? It wouldn’t clash then."

  Celia tapped her pen. "The *focus*," she said gently but firmly, "is the new garden, the fresh start. The fence defines our space, our project. The bench... it’s from another time. Letting it go simplifies things. Shows unity of vision. Ben, can you arrange removal?"

  Ben nodded. "Practical solution."

  Margaret opened her mouth. The bench was where old Mr. Henderson used to sit and watch the seedlings. It *was* the garden’s history. But she saw their faces: Celia’s determined calm, Ben’s practicality, Anya’s quiet relief at avoiding conflict. She saw the shared vision – the neat fence, the tidy lavender, the *feeling* of their accomplishment – solidifying, requiring the removal of the awkward, the old, the dissenting note. To speak now wouldn’t be about the bench, or the cost, or even history. It would be about *her* versus *them*. It would break the spell.

  She closed her mouth. Looked down at her hands, the ingrained dirt a reminder of roots that now felt strangely out of place.

  Celia smiled, the warmth returning to the room. "Excellent. Then we’re finally agreed. The fence goes up next week." She gathered her papers. "It’s going to be wonderful. Just *look* at what we’ve achieved together."

  As they left, Anya linked her arm with Celia’s. "It really is going to be lovely." Ben clapped Celia on the shoulder. "Good steering, Chair."

  Margaret walked a few steps behind, the crisp autumn air suddenly sharp. She watched the trio ahead, their closeness palpable, radiating the satisfying warmth of consensus, of belonging. The garden behind them, soon to be neatly enclosed, felt less like shared ground and more like territory claimed. The fence, she realised, wasn’t just going to keep the rabbits out. It was already doing its job.

  Celia glanced back, her expression perfectly reasonable, perfectly kind. "Coming, Margaret?"

  Margaret forced a small smile. "Yes," she said, her voice steady. "Just admiring the line." She caught up, stepping into the warmth of the group, leaving the lone bench, and the ghost of her dissent, outside the newly drawn boundary. It was, the reasonable voice inside her whispered, a small price to pay for belonging.
