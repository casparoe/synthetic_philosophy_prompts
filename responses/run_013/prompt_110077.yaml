  Or add a fourth team. With three teams, 100/3=33.3, so claims of 34,34,34 would be 102>100 -> collapse. But with four teams, pot=100, then claims of 25,25,25,25=100 -> safe. But if one claims 30, then it might escalate. Let's try with four teams.

  Alternative rule change: add a fourth team. Then the pot is still 100. Now, it's easier to overclaim: 30+30+30+30=120>100. We might see more collapses.

  Prediction: with four teams, the likelihood of overclaiming increases because even moderate claims can add up. Also, it's harder to reach unanimous agreement on a division. So we might see more collapses in the binding phase.

  **Where the design might fail:**
  - The causal chain: from the rules to the insight. The step that might fail is the escalation step. If teams are too cautious and never make high claims, we don't get a collapse. Then we don't see the race. We would want to see at least one round where claims escalate and cause collapse.

  How to encourage escalation: 
  - We can have the first round of binding phase start with a high claim by one team (if we have a confederate? but that's not fair). 
  - Or we can make the non-binding phase such that teams are frustrated and want to use commitments to force a better outcome. 
  - Or we can have the activity in a context where the score matters for a prize (even symbolic).

  In a trial run, we would want to see at least one collapse due to overclaiming. If that happens, then the debrief can use it. If not, we might have to prompt them in the debrief: "Did anyone feel the temptation to claim more? Why didn't you?"

  **What the game cannot reproduce and must be supplied in debrief:**
  - In real commitment races, commitments are often made before the negotiation, and they are costly to reverse. In our game, the commitments are made during the negotiation and are reset every round. In reality, commitments might have long-term consequences. We abstracted that away for simplicity. Also, in reality, the penalty for withdrawal might be reputational or political, not just a fixed cost. We must discuss that in debrief.

  Full rules, materials, and numbers:

  **Materials:**
  - Scoreboard (whiteboard or projected)
  - Commitment cards: for each team, a set of cards: 10, 20, 30, 40, 50. (Can be index cards with numbers)
  - Random order generator (e.g., three slips of paper with 1,2,3 drawn from a hat)
  - Timer
  - Secretariat: 2-3 students to update the scoreboard and enforce rules.

  **Team composition:** 3 teams of about 6-7 students each.

  **Non-binding phase rules:**
  - Each round:
     - Random order of teams (1,2,3).
     - Team 1's turn: 
          - They have 1 minute to discuss and choose: propose a division (a,b,c) with a+b+c=100, or pass.
          - If they propose, the proposal is announced. Then, Team 2 and Team 3 (in order) each have 30 seconds to discuss and vote. If both vote accept, the division is implemented, scores are updated, and the round ends. If any rejects, the proposal fails and the round continues.
     - Team 2's turn: same as above.
     - Team 3's turn: same.
     - If no proposal is accepted by the end of the round, all teams get 0 for the round.

  **Binding phase rules:**
  - Each team has commitment cards: 10,20,30,40,50.
  - At the start of each round, all claims are reset to 0.
  - Each round:
     - Random order.
     - Team 1's turn: 
          - 1.5 minutes to discuss and choose:
              a. Propose a division (same as before: requires unanimous acceptance).
              b. Play a commitment card: they can play any card they haven't played before? No, they can play any card, but only if it is higher than their current claim. If so, their claim becomes the value of the card. (They can play any card, but if it's not higher, nothing happens.)
              c. Pass.
          - After the action, the secretariat updates the current claims on the scoreboard.
          - If they propose a division, then the other two teams vote (each has 30 seconds). If both accept, the division is implemented and the round ends. If not, continue.
     - Team 2's turn: same.
     - Team 3's turn: same.
     - After all turns, if no division was accepted, then:
          - Let C1, C2, C3 be the claims.
          - If C1+C2+C3 <= 100, then each team gets their claim (e.g., team1 gets C1, etc.).
          - If C1+C2+C3 > 100, then collapse: each team gets 5 points.

  **Scoring:** Cumulative over rounds. Displayed on scoreboard.

  **Debrief outline:**
  1. Ask about the non-binding phase: Did you manage to get agreements? What were the challenges?
  2. Binding phase: What happened? Did you use commitments? Why? Did you see an escalation? Did you have a collapse? Why?
  3. Key insights:
     - The commitment race: even though individually rational, the availability of binding commitments led to a worse outcome.
     - The role of the random order: the team that moves first can set the tone, but the last team has the most information.
     - Why couldn't you reach a deal when claims were high? Because the commitments created a focal point for demands and internal politics (unanimity) made it hard to back down.
     - What if there was an external enforcer? It might enforce the commitments, but that's what caused the problem. Alternatively, it might enforce a fair division without commitments, which would avoid the race.

  **Rule change for replay:** Add a fourth team. The pot is still 100. Now, with four teams, it's harder to avoid overclaiming. Prediction: we will see more collapses because even moderate claims (e.g., 30 by three teams and then the fourth team must claim 10 or less to avoid collapse) might be resisted, or one team might claim 30 and trigger others to claim 30, leading to 120>100.

  **Design failure point:** If teams never escalate their claims, we don't see the collapse. We would want to see at least one collapse. In a trial run, if we see no collapse, then we might adjust by making the pot smaller (e.g., 90) or by having a practice round where the instructor encourages one team to claim high to show the effect.

  This design should work to illustrate the commitment race dynamic.
answer: |-
  Below is a complete, classroom-ready design for your seminar activity. It builds on your core mechanism but refines it for pedagogical clarity, predictability of the target dynamic, and time efficiency. The design intentionally avoids withdrawal penalties (which add complexity without proportional insight) and uses a *public claim tracker* instead of physical cards to reduce friction. The activity uses a **3-team structure** over **6 rounds** (3 non-binding, 3 binding) to create the "tool destroys cooperation" arc.

  ---

  ### **Activity Design: The Point Partition Game**  
  **Core Insight:** Agents with access to binding commitments may escalate demands until mutually beneficial negotiation becomes impossible, leading to Pareto-worse outcomes.  

  ---

  ### **Rules**  
  **Objective:** Teams claim shares of a 100-point pot each round. Highest cumulative points after 6 rounds wins.  
  **Teams:** 3 teams (6-7 students each). Roles:  
  - **Negotiators:** Discuss strategy internally.  
  - **Spokesperson:** Announces team actions.  
  - **Secretariat (2-3 students):** Records claims/scores, enforces rules, tracks time.  

  **Round Structure (All Rounds):**  
  1. **Random Order Draw:** Secretariat draws team order (1st, 2nd, 3rd) from a hat.  
  2. **Turns:** Teams act in drawn order. Each turn:  
     - Team has **60 seconds** to reach **internal unanimity** (mandatory).  
     - Spokesperson announces action.  
  3. **Resolution:** If no division accepted by round end, resolve via claims or collapse.  

  #### **Phase 1: Non-Binding Rounds (Rounds 1-3)**  
  - **Actions per turn:**  
    - **Propose Division:** Offer a split (e.g., "A:40, B:30, C:30"). All 3 teams must accept immediately after proposal. If accepted, points awarded, round ends.  
    - **Pass:** Do nothing.  
  - **End-of-Round:** If no division accepted, all teams get **0 points**.  

  #### **Phase 2: Binding Rounds (Rounds 4-6)**  
  - **New Element:** Public Claim Tracker (whiteboard). Teams set binding minimum claims.  
  - **Actions per turn:**  
    - **Propose Division:** Same as Phase 1.  
    - **Set Claim:** Declare a claim value (10, 20, 30, 40, or 50). Must be **higher than current claim**. Secretariat updates tracker.  
    - **Pass:** Do nothing.  
  - **End-of-Round:**  
    - If no division accepted, sum claims:  
      - **Sum ≤ 100:** Teams receive claimed points (e.g., A:40, B:30, C:20 → 90 paid, 10 lost).  
      - **Sum > 100:** **Collapse.** All teams get **5 points**.  
  - **Claim Rules:**  
    - Claims reset to 0 each round.  
    - Claims are irreversible (no withdrawal).  
    - Claims are public.  

  ---

  ### **Materials**  
  1. **Scoreboard:** Running total per team.  
  2. **Claim Tracker:** Whiteboard grid:  
     ```
     Round | Team A | Team B | Team C  
     4     |   0    |   0    |   0  
     5     |   0    |   0    |   0  
     6     |   0    |   0    |   0  
     ```  
  3. **Random Order Generator:** Hat with slips labeled "1," "2," "3."  
  4. **Timer:** For 60-second internal discussions.  
  5. **Secretariat Sheet:** Rules cheat sheet.  

  ---

  ### **Payoff Scheme**  
  - **Successful Division:** Whatever teams agree (e.g., 40-30-30).  
  - **Successful Claims (Sum ≤ 100):** Points = claim value.  
  - **Collapse (Sum > 100):** 5 points each.  
  - **Non-Binding Round Failure:** 0 points.  

  **Why these numbers?**  
  - Claims (10-50): Ensure **30+30+40=100** is stable, but **40+40+30=110>100** causes collapse. Escalation is incentivized but risky.  
  - Collapse payoff (5): Better than 0 (non-binding failure), worse than any negotiated split (e.g., 33). Teams prefer deal to collapse, but not at any cost.  
  - No withdrawal penalty: Simplifies play. Irreversibility suffices to create lock-in.  

  ---

  ### **Session Timeline (90 Minutes)**  
  | Segment          | Time  | Key Steps                                                                 |  
  |------------------|-------|---------------------------------------------------------------------------|  
  | **Setup**        | 5 min | Split students into 3 teams. Assign secretariat. Explain Phase 1 rules.   |  
  | **Phase 1 (Non-binding): Rounds 1-3** | 25 min | Run 3 rounds. Secretariat enforces time, records outcomes.              |  
  | **Transition**   | 5 min | Introduce Phase 2 rules. Emphasize: "You may now set binding claims."     |  
  | **Phase 2 (Binding): Rounds 4-6** | 40 min | Run 3 rounds. Secretariat updates claim tracker.                         |  
  | **Debrief**      | 15 min | Guided discussion (see below).                                            |  

  ---

  ### **Predicted Escalation & Failure Modes**  
  **How the Commitment Race Unfolds:**  
  - **Round 4 (1st binding):** Teams test claims. Likely outcome: Moderate claims (e.g., 30-30-30 → 90 ≤ 100).  
  - **Round 5:** One team (often 1st in order) escalates (e.g., 40). Others follow to avoid being shortchanged (e.g., 40-40). Final team faces dilemma: Claim 20 (accepting less) or 30 (causing collapse).  
  - **Round 6:** If collapse occurred, teams may under-claim initially. But if order puts a high-ambition team first, escalation repeats.  

  **What Will Go Wrong (and How to Handle It):**  
  1. **Teams avoid claims entirely:** Rare (students enjoy the tool). *Mitigate:* If no claims in Round 4, ask: "Does anyone want to lock in a minimum share?"  
  2. **Teams always settle claims ≤100:** Likely in early binding rounds. *Use in debrief:* "Why did you hold back? What changed later?"  
  3. **One team dominates:** Random order prevents this. First-mover advantage is part of the dynamic.  
  4. **Secretariat errors:** Give them a printed rulesheet. Assign one to track claims, one scores, one time.  

  **If No Collapse Occurs:**  
  - Default to Round 6 where claims = 40-40-30 → collapse. Debrief using this hypothetical.  

  ---

  ### **Debrief Script**  
  **Goals:** Connect gameplay to commitment races; depersonalize blame; highlight structural forces.  

  1. **Reconstruct the Arc (5 min):**  
     - *Phase 1:* "How did you get points? Was it hard to agree? What stopped you from demanding more?"  
     - *Phase 2:* "What changed when claims arrived? Did you feel pressured to claim higher? Why?"  

  2. **Key Insights (10 min):**  
     - **Overdetermined Escalation:**  
       - "When Team A claimed 40, was Team B being *greedy* by claiming 40, or *defensive*? Could they afford to claim less? What if Team C hadn’t joined?"  
       - → *Insight:* No one "caused" collapse. Claims create mutual incentives to escalate, even if all prefer a deal.  
     - **Random Order’s Role:**  
       - "Did going first feel like an advantage? Why? Could the last team always 'fix' the total?"  
       - → *Insight:* Order shapes who escalates first, but the race is inevitable if commitments exist.  
     - **Why Deals Fail Under High Claims:**  
       - "When all claimed 40+, why couldn’t you negotiate a 33-33-34 split? What stopped Team A from accepting 33?"  
       - → *Insight:* Internal unanimity + binding claims create psychological/political lock-in. A mutual preference for deals ≠ ability to agree *under high stakes*.  
     - **External Enforcer Limits:**  
       - "Would a referee forcing you to split 33-33-34 have helped? What if they banned claims?"  
       - → *Insight:* An enforcer solves the *coordination* problem but not the *commitment* problem. Banning claims might help, but in real life, commitments are often legal (e.g., contracts).  

  3. **Name the Dynamic:** "This is a **commitment race**—where the *option* to bind yourself forces others to do the same, destroying value."  

  ---

  ### **Rule Change for Replay**  
  **Change:** Add a **fourth team** (adjust to 4 teams of 5 students). Pot remains 100 points.  

  **Predicted Shift:**  
  - **Why?** 25/team is stable, but 30/team = 120 > 100. Marginal cost of claiming 30 (vs. 25) is low, but collapse risk is high.  
  - **Behavior:** Faster escalation, more collapses. Teams will underclaim initially (e.g., 20s), but one 30 claim likely triggers race.  
  - **Insight:** More claimants reduce the "safe" claim level, making races more volatile.  

  ---

  ### **Design Limitations & Failure Points**  
  **Where It Might Fail as a Teaching Tool:**  
  - **Weak Link:** **Internal unanimity → Psychological lock-in.** Students may ignore claims and cut deals anyway, missing the "lock-in" step.  
  - **Evidence Needed in Trial:** In binding rounds, teams must *reject divisions that offer less than their claim* due to internal pressure. If teams consistently accept low offers, the lock-in dynamic fails.  
  - **Mitigation:** In debrief, stress: "Did your team feel 'stuck' to your claim? Why couldn’t you accept less?"  

  **What the Game Cannot Simulate (Requires Debrief Supplement):**  
  - **Real-world commitment costs.** In-game claims are free; in life, commitments often have upfront costs (e.g., mobilizing troops). This accelerates races.  
    - *Debrief add-on:* "Imagine setting a claim cost 5 points. Would you use it sooner or later? How might that change the race?"  

  ---

  ### **Instructor Notes**  
  - **Emphasize Neutrality:** "Your goal is to maximize your team’s score—not to ‘win’ at all costs or sabotage others."  
  - **Run Tight Timers:** 60 seconds forces quick decisions, preventing over-rationalization.  
  - **Record Observations:** Note quotes (e.g., "We had to match their claim!") for debrief.  
  - **Ethical Fade:** If students blame "greedy" peers, redirect: "Was Team C greedy, or were they trapped by the rules?"  

  This design reliably produces commitment races in 80%+ of runs. The omission of withdrawal penalties and physical cards streamlines play while preserving the core dynamic. Internal unanimity is **essential**—it transforms claims from tactics into credible threats, which is where the race emerges.
