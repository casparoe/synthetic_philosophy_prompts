  ## The Café Debate

  **Setting:** *A worn café table, stained coffee cups between them. EIRA (late 30s, intense, gestures sharply) leans forward. LEO (40s, calmer, but with quiet conviction) stirs his tea.*

  **Eira:** ...and that’s precisely the point Miller misses, Leo. The state isn’t just *not actively harming* people outside its borders; it has positive obligations. Especially when the harm – poverty, war, persecution – is so vast and our capacity to alleviate it, even partially, is demonstrably real. Denying entry based on arbitrary lines drawn on a map, lines often drawn *by* the very powers that created those harms... it’s a profound moral failure cloaked in administrative convenience. And so much of the language used? "Swamping," "dilution," "they won't integrate"? It reeks. Even the economic arguments often collapse under scrutiny into thinly veiled prejudice when you follow the money – who *really* benefits from keeping desperate people out? Not the average worker, but those who fear wage pressure or social spending.

  **Leo:** Eira, I respect Dummett’s moral clarity on the evils of racism – and Miller would too. Absolutely. But you’re conflating legitimate concerns with illegitimate ones. A state *is* more than a service provider; it's the political expression of a people, a *demos*, trying to shape their common life. That common life includes shared institutions, a historical narrative, cultural practices... a *national culture*. This isn't some inert museum piece; it's a living, evolving public good. People *do* have a legitimate interest in ensuring that evolution isn't so rapid, so externally driven, that it fractures the social cohesion necessary for democracy and the welfare state itself. It’s not about keeping culture *pure* – that’s absurd – it’s about *continuity*. "Too fast" is relative, but it’s a real concern. Look at the backlash when communities feel genuinely overwhelmed overnight.

  **Eira:** "Overwhelmed overnight"? That’s the rhetoric I’m talking about! Define "overwhelmed." Define "too fast." *Whose* feeling of being overwhelmed trumps the *actual* life-and-death desperation of someone fleeing Aleppo? You talk about social cohesion – what shreds it faster: welcoming refugees with proper support, or decades of xenophobic tabloid headlines and government policies designed to *make* people feel invaded? And let’s be brutally empirical: when a government wails it’s "overwhelmed" by asylum seekers sleeping in tents, yet processes golden visas for oligarchs in weeks, what does that tell you about their *actual* capacity, versus their *desired* demographic?

  **Leo:** The oligarch point is fair – hypocrisy exists. No argument. But capacity *isn't* infinite. Resources, housing, school places – these are real constraints. We *can't* take everyone. That’s not racist; it’s arithmetic. The choice *is* often between helping *some* refugees or helping *none* effectively. Prioritization *is* necessary. And prioritizing those with existing family ties here – family reunification – *is* a legitimate criterion grounded in promoting integration and existing social bonds, not some arbitrary exclusion.

  **Eira:** "We can't take everyone" is the universal get-out clause, Leo. It shuts down moral scrutiny. *How many* can we take? How is that limit determined? Often, it’s set politically *far* below actual infrastructural limits, precisely to appease the feeling you valorize – the fear of change. And while family reunification seems benign, why is the threshold so high? Why the years-long waits? It becomes another exclusionary tool, separating families to appease a nebulous fear of "too many." Which brings me to your "too fast" claim. This is where Dummett’s other work bites, I think. You claim there’s a fact of the matter – "culture is changing too fast" – that exists independently, possibly even if *no one* perceives it as too fast? That it’s a *realist* fact about the erosion of some determinate cultural essence?

  **Leo:** (Leans back, thoughtful) Dummett's anti-realism? That’s an interesting pivot. Are you saying claims about cultural change can't be true unless we can *verify* they're happening? That seems... limiting. Social facts aren't like atoms. Culture *is* nebulous, but its effects aren't. Declining trust in institutions, political polarization along ethnic lines, the retreat into identity silos – these *are* measurable phenomena that can be plausibly linked, in part, to rapid demographic shifts exceeding a society's adaptive capacity. We don't need a Platonic Form of "Britishness" to observe that rapid, large-scale change *can* be destabilizing. Isn't that basic sociology?

  **Eira:** But *is* it "rapid, large-scale change" causing polarization, or is it the *rhetoric* and *policy* framing migration as an invasion? The causal arrow is murky! Dummett argued that for statements about the past or complex social realities, truth *is* tied to evidence and our best methods of verification. Asserting "culture is changing too fast" as a simple, objective fact – especially when used to justify exclusion – demands evidence we can *access* and *assess*. Not just feelings, but demonstrable harm to specific public goods: is the NHS collapsing *because* of migrant nurses? Are schools failing *because* of multilingual pupils? Or is it chronic underfunding? When you claim harm to "cultural continuity," what is the *evidence* beyond opinion polls fueled by the very rhetoric you deploy? Without verifiable criteria for "too fast" or a clear baseline for the "culture" being eroded, doesn't the claim risk becoming an unfalsifiable shield for prejudice? It becomes a "truth" asserted from the armchair, transcending any possible evidence – which is precisely the kind of thing Dummett railed against.

  **Leo:** (Holds up a hand) Okay, point taken on needing evidence. Causality is complex. But you go too far. By your lights, could we ever say *any* society was undergoing disruptive change? Or would we always have to wait for perfect, incontrovertible proof – by which time the disruption might be irreversible? We make probabilistic judgments based on historical parallels, social theory, observable tensions. We *do* have evidence: rapid demographic change *can* correlate with social stress *if* not managed with integration policies. Asserting "this *is* happening too fast for *this* community based on X, Y, Z indicators" isn't armchair metaphysics; it's applied social science, fallible but necessary. Your anti-realism, applied here, seems to demand an impossible standard of proof for any claim about complex social systems. Does that mean we can never say "this economic policy is causing inequality" or "this media narrative is fostering division" unless we have a God's-eye view?

  **Eira:** No! We absolutely *can* say those things – *when we have evidence*. We measure inequality, Gini coefficients, wage stagnation. We analyze media framing and its correlation with attitudes. That’s the key: the evidence must be public, debatable, verifiable. My objection is to *your* specific claim – "immigration is changing our culture too fast" – being deployed as a *brute fact* justifying exclusion, often *without* that public evidence, or worse, *in defiance* of counter-evidence like economic studies showing net benefits, or examples of successful integration. When the evidence shows a state *can* process visas swiftly for the wealthy while claiming incapacity for the desperate, when family reunification waits are artificially extended, when the "cultural erosion" panic flares most intensely around non-white migrants regardless of actual numbers... *then* the realist claim about some objective cultural threshold being crossed starts to look suspiciously like a smokescreen. It becomes an unverifiable, hence unassailable, justification for a policy rooted in something much uglier.

  **Leo:** (Sighs) So, what would move you? Concede that a state *could*, in principle, legitimately restrict immigration based on cultural continuity concerns?

  **Eira:** Only if you could show me, with publicly verifiable evidence, that: 1) A specific, valued aspect of their national culture (beyond just "feeling familiar") is demonstrably being *harmed*, not just *changed*; 2) This harm is directly and primarily caused by the *rate* of immigration, not by other factors like government policy failures or economic inequality; and 3) Slowing immigration is the *only* or *least harmful* way to preserve that specific good, weighed against the severe harms exclusion inflicts. So far, I see rhetoric, not evidence meeting that bar. What would move *you*?

  **Leo:** Evidence of consistent, large-scale public support for significantly *higher* immigration levels without a corresponding rise in social friction or political extremism. Proof that robust integration can reliably keep pace with *any* level of influx without eroding the shared civic norms and mutual trust that underpin liberal democracy and social solidarity. And... (he pauses)... a genuine reckoning with the fact that much restrictionist *rhetoric* is, as you say, weaponized prejudice. That the *fear* of change is often manipulated, and that the capacity argument is frequently a dishonest fig leaf. If I saw those things, I’d concede the ‘cultural continuity’ argument carries far less weight than I think it does now. But I’d still insist the *principle* of democratic self-determination over the character of the political community matters.

  **Eira:** And I’d still argue that self-determination stops at the point where it inflicts avoidable, catastrophic harm on outsiders. But... (she taps the book)... Dummett would say the path forward isn't just argument. It's building institutions that make the evidence visible and the duties undeniable. Less shouting, more processing visas fairly, funding integration properly, calling out hypocrisy relentlessly. Make the ‘capacity’ real, not rhetorical. Then let's see what ‘too fast’ really means.

  **Leo:** (Nods slowly) Less shouting would be a start. Another coffee? I think we’ve earned it. And maybe a look at those integration studies you mentioned...

  **Eira:** (A small, tired smile) Deal. But I’m choosing the studies.
