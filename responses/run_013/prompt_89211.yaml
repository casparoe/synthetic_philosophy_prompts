prompt: |-
  Experimental philosophy settles questions about concepts by putting short vignettes to laypeople and asking whether the agent in the story did something intentionally, knew something, caused something, or acted freely, and then treating the majority verdict as evidence about the content of the concept. Its best-known result is an asymmetry in side-effect cases: a chairman who is indifferent to the environment and orders a program he knows will pollute is judged to have harmed the environment intentionally, while a chairman described in exactly the same terms except that the program will instead improve the environment is not judged to have helped it intentionally -- even though both men foresaw the side effect, caused it, and cared about it not at all. The same body of work that reports this asymmetry as a discovery about the concept of intentional action also debunks intuition elsewhere, showing that verdicts flip with the order in which cases are presented or with incidental details of wording, and it treats ordinary verdicts as the standard that philosophical theories of intentional action must answer to while treating the verdicts of philosophers as merely more data of the same kind.

  I want to know what philosophical commitments this practice presupposes: what view of concepts, of the evidential status of intuition, and of the authority of ordinary usage it only makes sense under, and which rival views it quietly rules out. Answer as exactly five numbered claims, with no introduction and no closing summary, each one or two sentences, each naming one commitment the practice presupposes and saying whether the practice strictly requires it or would survive its denial; order them by how much of the practice would have to change if the commitment turned out to be false.
reasoning: |-
  Hmm, the user is asking about the philosophical commitments behind experimental philosophy (x-phi) practices. They want me to identify exactly five philosophical presuppositions that underlie how experimental philosophers conduct their studies - particularly regarding concepts, intuitions, and ordinary language. I need to be precise: five numbered claims, no intro or summary, each one or two sentences, naming a commitment and specifying whether it's strictly required or could be denied without destroying the practice. I should also order them by how disruptive their falsity would be to x-phi.

  Looking at the example they provided about intentional action asymmetries (the chairman case), I can see several key commitments at play. First, there's a clear reliance on ordinary judgments as evidence for conceptual content. This seems fundamental - if experimental philosophers didn't think lay intuitions revealed concepts, their entire methodology would collapse. This should probably be number one in terms of disruptiveness.

  Then there's the treatment of concepts as descriptive rather than normative. X-phi treats majority responses as defining what the concept is, rather than what it ought to be. If this were false - if concepts had normative dimensions - it would significantly change how we interpret the data, though maybe not destroy the practice entirely.

  The third commitment concerns the evidential value of intuitions. X-phi treats intuitions as direct evidence about concepts, whereas some philosophers see them as fallible judgments. Denying this would require major methodological adjustments but might not eliminate x-phi completely.

  Fourth is the equivalence between lay and expert judgments. X-phi treats philosophers' intuitions as just more data points, not privileged insights. If this weren't true, x-phi would need to fundamentally reconsider its approach to philosophical expertise.

  Finally, there's the assumption that concepts are stable enough to study through vignettes. If concepts were highly context-sensitive in ways that undermine generalization, it would challenge x-phi's validity but might not destroy the practice entirely - they could just incorporate context more carefully.

  I'll organize these from most to least disruptive: starting with the reliance on folk judgments as conceptual evidence (most essential), down to the stability assumption (where adaptation might be possible). For each, I'll be clear about whether denial would kill the practice or just force evolution.
answer: |-
  1.  **Concepts are descriptive psychological entities accessible through aggregate lay judgments.** The practice strictly requires this commitment, as it treats majority folk verdicts as direct evidence about the concept's content, defining the concept by how people actually apply it. Denial (e.g., concepts are normative or not constituted by folk judgments) would make the core data irrelevant.
  2.  **Layperson intuitions (as elicited responses) provide direct, primary evidence about the content of concepts, not merely about psychological dispositions.** The practice strictly requires treating these elicited judgments as evidence *for the concept itself*. Denial (e.g., such judgments are only evidence about cognition or bias, not concept content) would undermine the evidential basis for claims about concepts.
  3.  **Ordinary language usage, as captured by these verdicts, holds significant authority in determining conceptual content over philosophical theorizing or expert intuition.** The practice presupposes this authority, using folk verdicts as the standard philosophical theories must meet, while treating philosophers' judgments as just more data. Denial (e.g., experts or theory refine/override folk concepts) would force a radical reassessment of the practice's goal and methodology.
  4.  **There is no fundamental epistemic distinction between the evidential status of lay and philosophical intuitions regarding conceptual content; both are data points of the same kind.** The practice presupposes this equivalence, explicitly treating philosophers' verdicts as merely "more data". Denial (e.g., philosophical training grants privileged conceptual access) would necessitate a different, hierarchical treatment of expert vs. lay data, altering the practice significantly.
  5.  **Concepts (or their application conditions) are sufficiently stable and generalizable across contexts to be studied via isolated, decontextualized vignettes, despite known framing effects.** The practice presupposes this stability for generalization, though it acknowledges framing effects. Denial (e.g., concepts are radically context-sensitive) would challenge the validity and generalizability of findings but might survive with extreme methodological caution.
