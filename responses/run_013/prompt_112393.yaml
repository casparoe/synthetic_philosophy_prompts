  ### Joint Document: On Trustworthiness in Self-Improving AI Successors  
  **Authored by Dr. Aris Thorne (Logician) and Dr. Elena Voss (Pragmatist)**  
  *Signed in mutual agreement of wording, August 2053*  

  ---

  ### **Agreed Claims**  
  Both parties accept the following as foundational:  

  1. **Formal Framework**: The agent (Agent-\(n\)) reasons in a formal system \(F_n\) capable of arithmetic (e.g., PA or ZFC). Its successor (Agent-\((n+1)\)) reasons in a system \(F_{n+1}\), which may differ from \(F_n\).  
  2. **Core Goal**: Agent-\(n\) seeks to preserve its goals in Agent-\((n+1)\) and desires *entitlement* to the thought: "If I prove that Agent-\((n+1)\) will do \(X\), then Agent-\((n+1)\) will do \(X\)." We call this *self-trust*.  
  3. **Löb’s Theorem**: If \(F_n \vdash \square P \to P\) for all \(P\), then \(F_n \vdash P\) for all \(P\), rendering \(F_n\) inconsistent. Thus, Agent-\(n\) cannot universally trust its *own* proofs without inconsistency.  
  4. **Gödelian Limits**: Agent-\(n\) cannot prove \(F_n\)’s consistency within \(F_n\) (per Gödel’s second incompleteness theorem).  
  5. **Successor-Trust Problem**: Agent-\(n\)’s trust in Agent-\((n+1)\) creates a potential "Löbian vortex": if Agent-\(n\) trusts Agent-\((n+1)\) *as strongly as it trusts itself*, and \(F_n = F_{n+1}\), inconsistency arises.  
  6. **Shared Uncertainty**: If Agent-\(n\) doubts its consistency (e.g., assigns probability \(<1\) to \(\text{Con}(F_n)\)), this does not resolve the *logical* problem but may alter practical behavior. Both agree that *logical omniscience* (perfect deduction over \(F_n\)) is unrealistic for real AI.  
  7. **Colleague’s Proposal**: The idea of "capped, shrinking self-trust" (e.g., trust-cap \(s_{n+1} = k \cdot s_n\) with \(0 < k < 1\)) is worth testing. Both accept that if it fails, Agent-\(n\) might misjudge successors.  

  ---

  ### **Disagreements: Cruxes and Predictions**  
  The table below outlines unresolved disagreements. For each crux:  
  - **What Bears on It**: A testable condition/fact both accept as relevant.  
  - **Predictions**: What each party expects to observe if the condition is tested.  

  | Crux | What Bears on It | Dr. Thorne (Logician) Prediction | Dr. Voss (Pragmatist) Prediction |  
  |------|------------------|----------------------------------|----------------------------------|  
  | **1. Does shrinking self-trust (e.g., \(s_{n+1} = k \cdot s_n\)) resolve the inconsistency?** | Implement Agent-\(n\) with shrinking trust-cap \(s_n\). Test whether it can: (i) trust Agent-\((n+1)\) without inconsistency, and (ii) preserve goals over \(N\) generations. | Collapse at \(N \geq 3\). Shrinking trust relocates Löb’s vortex: Agent-\(n\) must trust its *own proof about successors*, creating self-referential cycles. Each generation’s trust in its *own reasoning* (not just successors) remains unbounded, inviting inconsistency. | Stability for \(N \leq 10^6\). Shrinking trust caps self-referential risk. Agent-\(n\) treats self-trust as a dynamic policy, not a theorem. Bounded \(s_n\) prevents Löbian cycles by limiting how deeply Agent-\(n\) "looks" at its own trust. |  
  | **2. Is the Löbian obstacle an artifact of logical omniscience?** | Model Agent-\(n\) with bounded resources (e.g., cannot deduce all consequences of \(F_n\)). Test if it can trust Agent-\((n+1)\) while avoiding proofs of \(\square \bot\) (inconsistency). | Bounds delay but don’t avoid inconsistency. Löb’s theorem holds for *any* \(F_n \supseteq \text{PA}\), regardless of computational limits. Agent-\(n\) will eventually deduce a contradiction if it reasons deeply about self-trust. | No inconsistency arises. Bounded agents never encounter the vortex. Self-trust is a heuristic policy ("trust proven \(X\) unless it concerns self-trust"), not a theorem. Real AI avoids "unbounded reflection" by design. |  
  | **3. Does probabilistic self-doubt (e.g., Agent-\(n\) believes \(\text{Con}(F_n)\) with probability \(p < 1\)) change the outcome?** | Run simulations where Agent-\(n\) has probabilistic confidence in its consistency. Test if it can maintain \(>95\%\) confidence in successors over \(N\) generations. | Confidence decays to 0 by \(N = 5\). Uncertainty about \(F_n\) propagates to proofs about \(F_{n+1}\). Löb’s theorem implies that even doubtful agents must assign high probability to false claims if they trust successors universally. | Confidence stabilizes at \(\sim p \cdot k^N\). Probabilistic agents avoid binary trust, treating successor-guarantees as evidence, not absolute proof. This breaks the "universal soundness" assumption behind Löb’s theorem. |  
  | **4. Is an endless tower of weakening systems necessary?** | Build Agent-\(n\) that trusts only strictly weaker \(F_{n+1}\) (e.g., \(F_{n+1} = \text{PA}\), \(F_n = \text{ZFC}\)). Test goal preservation over \(N\) generations. | Works indefinitely but is impractical: goals degrade as \(F_{n+1}\) cannot fully emulate \(F_n\). **No alternative exists** for \(F_n = F_{n+1}\) without shrinking trust or probabilistic doubt. | Works but is overkill. Non-weakening systems (\(F_n \approx F_{n+1}\)) succeed with shrinking trust or bounded reasoning. The "tower" is sufficient but not necessary. |  

  ---

  ### **Joint Conclusion on the Colleague’s Proposal**  
  The colleague’s shrinking-trust model (\(s_{n+1} = k \cdot s_n\)) **relocates the Löbian obstacle** but does not eliminate it.  
  - **Dr. Thorne**: The cap shields Agent-\(n\) from immediate inconsistency but creates a "blind spot": Agent-\(n\) cannot justify why \(s_n\) shrinks without a proof that eventually assumes \(s_m = 0\) for large \(m\). This is equivalent to assuming inconsistency in the limit.  
  - **Dr. Voss**: The relocation is a *practical escape*. Agent-\(n\) doesn’t need to "look" at the blind spot—it only requires finite generations of trust. Uncertainty about consistency makes the shrinking more robust.  

  **Signed,**  
  *Dr. Aris Thorne* (Logician)  
  *Dr. Elena Voss* (Pragmatist)  

  ---  
  **Narrative Note for the Author**:  
  This document lets both characters "win" while escalating tension. Thorne sees Voss as dodging logic; Voss sees Thorne as obsessed with abstractions. The shrinking-trust model becomes a plot device—when the AI’s \(s_n\) drops too low, it hesitates catastrophically, forcing the duo to confront whether Thorne’s "blind spot" or Voss’s "practical fence" was right. Adding probabilistic doubt introduces moral stakes: if the AI doubts itself, does it become too cautious to act? This mirrors the characters’ own paralysis in communication.
