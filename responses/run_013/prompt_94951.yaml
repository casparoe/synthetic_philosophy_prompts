prompt: |-
  Ok so I mediate commercial disputes for a living — supplier rows, a couple of partnership breakups, one very long fight over a family business — and there's a pattern in how settlements actually land that I've never had a name for. I'd like the name, but honestly I want the thing itself carved up more than I want the label.

  Here's what I keep seeing. Two sides come in with numbers: A wants X, B wants Y, and everything between X and Y is the range of deals. You'd think they'd meet in the middle. They usually don't. What they drift toward is the point where each side ends up with the same *fraction* of its own ask — A walks away with 40% of X, B with 40% of Y. Not equal dollars, equal proportion-of-what-you-wanted.

  Three things I've noticed about it. One, the bigger your ask, the bigger your slice in absolute terms, so the side with the more extravagant opening position quietly does better, and nobody seems to clock that. Two, it all depends on where you set "no deal," because everyones measuring from their walk-away, so the side that can credibly make walking away worse for the other one gets more. Three, and this is the one that bugs me: if some new option turns up that would only help one of them, the whole split moves, even though neither of them actually took the new option.

  Is there a name for this? I have a feeling there is, and that there's a rival rule that behaves differently — one that wouldn't care about the new option appearing, or one that equalizes dollars instead of proportions — and I want to know which of them my mediators' instinct is closest to. But please don't just hand me a label. If you give me a name, tell me exactly what rule it is, whether what I'm describing is that rule or a cousin of it, what it's normally contrasted with and on what grounds, and where its edges are — cases where it spits out an answer no real negotiator would accept. I'd also like to know whether I'm overeaching by suspecting that the same proportional logic is lurking in how families split an inheritance and in how economists have argued about how much tax different incomes ought to pay.

  Take the role of someone who actually works on bargaining theory and cooperative game theory. Think it through carefully — brainstorm the candidate rules first and only then commit to one. Lead with your bottom line in the first sentence, then the reasoning, no preamble and don't restate my question. And tell me what would change your mind: if you tell me it's rule Q, what would make you take that back, or where is your reasoning most likely to be wrong?
reasoning: |-
  Okay, let me tackle this mediator's question. They've observed a pattern in settlements where parties end up with equal proportions of their initial demands rather than meeting in the middle. They want to know if this has a name and how it fits into bargaining theory. 

  First, I recall the Nash Bargaining Solution (NBS) as a fundamental concept in cooperative game theory. The NBS maximizes the product of gains over the disagreement point. In the standard setup, if both parties have the same bargaining power, it results in equal gains from the disagreement point. But here, the mediator describes proportional gains relative to their initial asks, not the disagreement point. 

  Wait, the mediator mentioned that the split depends on where they set "no deal," meaning the disagreement point. So maybe it's related. Let me think about the math. Suppose party A has an initial demand X, and B has Y, with X > Y. The disagreement points are A_d and B_d. The gain for A is (S - A_d) and for B is (S - B_d) where S is the settlement. The NBS suggests these gains should be equal. But the mediator sees proportional gains relative to their aspirations, not the disagreement point. That's a key difference.

  Another candidate is the Kalai-Smorodinsky solution. This solution equalizes the ratios of achieved gains to possible gains. That sounds closer. In KS, each party gets the same proportion of their maximum possible gain. The maximum gain is from the disagreement point to their ideal point. Here, the mediator's parties are using their initial demands as ideal points. So if we set the ideal points as X and Y, KS would give each the same fraction of their demand. That matches the described pattern.

  But let's check the details. The mediator mentioned that a new option that helps only one party shifts the split. In KS, the ideal points define the utopia point. If one party's ideal increases because of a new option, their fraction remains the same, but the actual settlement amount changes. That aligns with the third observation. 

  However, in standard KS, the disagreement point is crucial. The mediator notes that the side who can make walking away worse for the other gains more. That's consistent with moving the disagreement point. But KS uses the disagreement point as the baseline, not the aspirations. The mediator's parties seem to anchor on their initial demands as reference points. That's a bit different from the theoretical model, which typically uses fixed disagreement points and ideal points. 

  Also, the mediator points out that the party with a higher demand gets more in absolute terms. KS accounts for that since the fraction is applied to a larger base. The first observation fits. 

  Now, what about alternatives? Equal split would divide the difference, but that doesn't result in proportional gains. The Nash solution equalizes absolute gains, not proportional. So KS seems the closest. But is it exact? The mediator's scenario uses initial demands as aspirations, which might not be the true ideal points. In practice, negotiators might inflate demands. KS assumes the ideal points are fixed. If the aspirations are strategic, KS might not fit perfectly. 

  Also, KS requires convex feasible sets. In real negotiations, the feasible set might be non-convex, but in the described cases, it's probably linear. The mediator mentioned partnership breakups and supplier disputes, which likely involve monetary sums, so convexity holds. 

  Regarding other contexts like inheritance or taxation, proportional splits are common. In taxation, progressive systems take higher fractions from higher incomes, which is a different proportionality. Inheritance might use equal shares, not proportional to claims. So while proportional logic appears, the specific KS mechanism might not directly apply. 

  Potential pitfalls: If one party's demand is unrealistically high, KS could suggest an unfair split. But negotiators might not accept that, as the mediator hinted. Also, KS doesn't account for bargaining power asymmetries. If one party is stronger, they might get more than the proportional share. The mediator didn't mention power imbalances, so maybe in their cases, parties are symmetric. 

  What would make me retract the KS answer? If the split is always 40-40 regardless of the disagreement point, but the mediator said it depends on the walk-away point. Also, if the new option didn't change the split, but it does in their observation. So KS fits. However, if the demands are purely aspirational without affecting the feasible set, KS might not apply. But in their cases, the demands set the range, so it works.
answer: |-
  **Bottom line:** What you're describing maps closely to the **Kalai-Smorodinsky (KS) bargaining solution**, specifically when parties anchor their "ideal point" to their initial demand and the disagreement point to their walk-away alternative.

  **Analysis & Reasoning:**

  1.  **Candidate Rules:**
      *   **Nash Bargaining Solution (NBS):** Maximizes the *product* of gains over the disagreement point. With symmetric bargaining power, it *equalizes absolute gains* ("equal dollars" over the walk-away point), not proportions relative to aspirations. It satisfies independence of irrelevant alternatives (IIA) – adding unused options doesn't change the split. *Doesn't match your observations.*
      *   **Equal Split:** Splits the "surplus" (difference between X and Y) equally. Ignores the magnitude of the initial asks and the disagreement points. *Doesn't match.*
      *   **Proportional Solutions (General):** Divide the surplus based on predetermined weights (e.g., based on "need" or "investment"). Your observation specifies the proportion is *relative to the initial ask*, not an external weight.
      *   **Kalai-Smorodinsky (KS) Solution:** Aims for proportional *gains*. It identifies the point in the feasible set where the *ratios* of each party's achieved gain (over their disagreement point) to their *maximum possible gain* (their "ideal point") are equal. If the ideal points are set as the initial demands (X, Y) and the disagreement points are the walk-away outcomes (dA, dB), KS precisely yields a settlement where:
          `(S_A - d_A) / (X - d_A) = (S_B - d_B) / (Y - d_B) = k`
          This is **exactly your "equal fraction k of their own ask" measured from their walk-away point.**

  2.  **Mapping Your Observations to KS:**
      *   **Equal Fraction:** This is the core axiom of KS – equal proportional concessions/satisfaction relative to aspirations (ideal points).
      *   **Bigger Ask = Bigger Absolute Slice:** Because KS gives the same *proportion* of the initial ask (relative to d_A/d_B), the party with the larger initial demand (X or Y) naturally gets a larger absolute gain if k > 0. The "extravagant opener wins" effect emerges.
      *   **Dependence on Walk-Away (Disagreement Point):** KS explicitly incorporates d_A and d_B. The party who can make the *other party's* walk-away outcome worse (lowering dB) increases the denominator (Y - dB) for B. To keep the ratios equal, B's gain (S_B - dB) must be a larger *absolute* amount (meaning B gets more of Y), effectively shifting the settlement in favor of the party who worsened B's alternative. This captures your point about credible walk-away threats shifting the split.
      *   **New Option Shifts the Split:** This is the *crucial* match and a key distinction from Nash. KS depends on the **Ideal Point (Utopia Point)**, defined as (max feasible payoff for A, max feasible payoff for B) *given the feasible set*. If a new option appears that *could* give one party (say, A) a much better outcome *if* they got everything (even if it's infeasible with B's consent), it raises A's ideal point (X_new > X_old). The KS solution then requires recalculating the point where `(S_A - d_A)/ (X_new - d_A) = (S_B - d_B)/ (Y - d_B)`. To maintain equality, `(S_A - d_A)` must be a larger *proportion* of the *new, larger* X_new. This means A gets a **larger absolute settlement** *without* actually choosing the new option, purely because their *aspiration level* increased. This perfectly explains your third observation.

  3.  **Contrasts and Edges:**
      *   **Contrasted with Nash:** The key difference is KS's **Monotonicity** axiom vs. Nash's **IIA**. KS says if the feasible set expands in a way beneficial to one player (raising their ideal point), they shouldn't get *less*. Nash says unused alternatives shouldn't change the outcome. Your observation of new (even unused) options shifting the split decisively favors KS over Nash.
      *   **Where KS/Your Pattern Might Fail (The Edges):**
          *   **Asymmetric Bargaining Power:** Standard KS assumes symmetry. If one party is significantly stronger (better BATNA, more patience, better info), they often extract *more* than the KS proportion. Your pattern might hold best when parties perceive themselves as relatively equal.
          *   **Unrealistic Aspirations:** If one party's initial demand (X or Y) is wildly unrealistic and far outside the true feasible set, KS could suggest a split that seems perverse. A real negotiator might reject giving the unrealistic party a huge absolute amount simply because they asked for the moon, even proportionally. KS is sensitive to how the "ideal point" is defined.
          *   **Non-Convex Feasible Sets:** KS (like Nash) assumes a convex set of possible outcomes. In highly complex, non-monetary, or discontinuous disputes, the logic might break down.
          *   **Focus on Pie-Splitting:** KS works best for pure distribution (dividing a fixed sum or clearly quantifiable benefits). It's less intuitive for disputes involving complex non-monetary terms or highly interdependent issues where "value" isn't linear.

  4.  **Overreach? Proportional Logic in Inheritance & Taxation:**
      *   **Inheritance:** Equal *shares* (absolute amounts) are common, not proportional to stated "wants." *Proportional* distribution usually relates to *legal entitlement* (e.g., shares in a business, statutory shares) or *need*, not initial bargaining positions. KS logic doesn't directly map.
      *   **Taxation:** The debate often involves **proportional** (flat %) vs. **progressive** (increasing %) taxation. Progressive taxation aims for "equal sacrifice" utility – a concept closer to *minimizing the sum of squared sacrifices* or a utilitarian sum, but distinct from KS. KS proportionality is about gains relative to *individual aspirations*, while tax proportionality is about burden relative to *income*. The underlying "proportional" intuition exists but the reference points and goals differ significantly.

  **What Would Change My Mind & Where I Might Be Wrong:**

  *   **Change My Mind:** If you observed that a new option beneficial *only to one party*, but completely *infeasible* in practice (e.g., A could get $1 billion if they owned a magic goose, which isn't actually on the table), did **NOT** shift the settlement at all, that would strongly contradict KS and favor Nash. KS requires the shift based on the *change in the ideal point*, regardless of the option's immediate feasibility within the negotiation.
  *   **Likely Weakness in Reasoning:** The biggest uncertainty is the **definition of the ideal point (X, Y)**. Bargaining theory often takes these as fixed "utopia" points within fundamental constraints. You observe them as *initial bargaining positions*, which are often strategically inflated. KS is theoretically defined on true maximum feasible payoffs. Your pattern suggests negotiators *anchor* their perception of the feasible maximum to their initial ask in the KS calculation. This is a pragmatic, behavioral application of KS, not its pure theoretical form. If your negotiators systematically *didn't* adjust their perceived "ideal point" based on new information about feasibility during the mediation, the match would be weaker. The dependence on the *credibility* of the walk-away point (dB) is core to KS and strongly supported by your account.
