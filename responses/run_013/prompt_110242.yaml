  I'm working on a case for a paper about whether culture is really Darwinian, and I need a thought experiment built to order. Setting: a small community (a few hundred people, no writing, ordinary human cognition -- no special modules, no magic). Pick one practice they keep going for something like ten generations. I need the case to cleanly seperate two pictures:

  (1) the replicator picture -- the item gets copied with high fidelity, and a version spreads because it's good at getting itself copied, whatever it costs its hosts; and

  (2) the attractor picture -- copying is actually noisy and lossy, and what looks like faithful inheritance is really repeated reconstruction, with stability coming from every act of transmission getting pulled back toward a cognitive default.

  Spec I need met: engineer it so (1) and (2) predict the same thing about which version survives, but for incompatible reasons, so the outcome by itself can't tell them apart. Then identify the single variable that does separate them (I assume copying fidelity, but you tell me), run it both directions, and give each picture's prediction at each setting. I want a case where at low fidelity the replicator view is forced into something ad hoc or embarrassing, and at high fidelity the attractor view is.

