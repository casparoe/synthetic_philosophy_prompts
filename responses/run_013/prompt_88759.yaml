prompt: |-
  Analyze the replication crisis in social psychology through the lens of Good's theorem on the value of information. Good's theorem says, roughly, that a Bayesian agent with a fixed prior and a utility function over states and actions should expect free information to leave her at least as well off in expected utility; the theorem concerns expected value ex ante, not the realized value of any particular piece of evidence, which may of course be bad news. The replication crisis is the wave of large-scale attempts to reproduce published findings in social psychology, many of which failed, together with the ensuing debates over pre-registration, adversarial collaboration, and the publication of null results. Using the theorem, say what it implies about how individual researchers and the field as a whole should have treated replication attempts and negative results, and then say where the mapping breaks: does the theorem apply to a scientific community rather than a single agent, does it survive when information is costly or when researchers' utility depends on their beliefs and careers, and what does the episode show about the theorem's scope or its limits? Be specific about who the agent is, what counts as information, and what the relevant utility is. Answer in American English.
reasoning: |-
  Okay, the user wants me to analyze the replication crisis in social psychology using Good's theorem. Let me start by recalling what Good's theorem is. It states that for a Bayesian agent, free information should never decrease expected utility ex ante. The user mentioned applying this to how researchers and the field should handle replications and negative results. 

  First, I need to break down the key elements: the agent, the information, and the utility. For an individual researcher, the agent is themselves. Their utility probably involves career advancement, publications, and also truth-seeking. Replication attempts provide information about whether a finding is true. According to Good's theorem, they should welcome such information because it helps avoid false positives, even if the results are negative.

  But the user also wants me to point out where the mapping breaks. The theorem assumes a single agent with a fixed prior and costless information. Real science involves multiple researchers with different priors and incentives. Information isn't free; replications cost time and money. Plus, researchers care about their careers. Publishing positive results is more rewarding than null findings, which journals often reject. So the utility function isn't just about truth—it includes reputation and job security.

  Then there's the field as a whole. If we treat the scientific community as a single agent, Good's theorem might suggest that replications are beneficial overall. But the community isn't a unified agent. Different groups compete, have conflicting interests, and there's no central coordination. Replication attempts might be undervalued because the costs and benefits aren't evenly distributed. The person doing the replication bears the cost, while the original author risks their reputation.

  The user also mentioned pre-registration and adversarial collaboration. These practices align with Good's theorem by reducing bias, making information more reliable. But the theorem doesn't account for the social dynamics in academia. Null results not getting published creates a file drawer problem, meaning valuable negative information is lost, which violates the theorem's assumption that information is free and utilized.

  I should highlight specific examples from the replication crisis, like the Reproducibility Project in Psychology. Many studies didn't replicate, showing that the field wasn't properly updating beliefs. The incentives for researchers prioritize novel findings over verification. This misalignment causes the breakdown of Good's theorem in practice.

  Also, the theorem's ex ante expectation vs. realized value matters. A replication might fail due to chance, not fraud. But the crisis revealed systemic issues like p-hacking, which weren't considered. The cost of replications means they aren't conducted enough, leading to false positives persisting.

  In conclusion, while Good's theorem ideally supports replications and null results, real-world factors like incentives, costs, and community structure prevent it from applying cleanly. The replication crisis exposes these limitations, showing that scientific progress needs structural reforms like preregistration and journal policies that value replications.
answer: |-
  Here's an analysis of the replication crisis through Good's theorem, its implications, and where the mapping breaks:

  **Applying Good's Theorem: The Ideal World**

  1.  **The Agent:** An individual researcher or the scientific field *conceived as a single, rational Bayesian agent*.
  2.  **The Information:** The results of a replication attempt (successful or failed) or the publication of a null result. This provides evidence about the truth value of a specific hypothesis (H) or the reliability of a finding.
  3.  **The Utility:** The agent's utility is assumed to be solely tied to the *accuracy of scientific knowledge*. This means maximizing the number of true beliefs accepted and minimizing the number of false beliefs accepted. Career advancement, grant funding, or prestige derived *directly* from holding specific beliefs (rather than holding true beliefs) are excluded from this pure utility function.
  4.  **Good's Theorem Implication (Ideal):**
      *   **For the Individual Researcher:** Free information from a replication attempt (successful or failed) should *always* be welcomed ex ante. Even if it might disprove their pet theory, the *expected* utility of having a more accurate belief state outweighs the risk of being wrong. They should actively seek replication of their own work and the work of others. Publishing null results provides valuable information that prevents others (and the field) from wasting time on false leads and refines understanding. Ignoring replications or suppressing null results is irrational under this model – it's refusing free information that could improve accuracy.
      *   **For the Field as a Whole:** The field, as a collective Bayesian agent, should *value and incentivize* replication attempts and the publication of null results. These activities provide crucial information for updating the collective belief state towards truth. Resources should be allocated to replication to correct errors and calibrate confidence. The publication system should treat well-conducted replications and null results as valuable contributions, not as failures or uninteresting findings. Pre-registration and adversarial collaboration are tools to ensure the *quality* and *trustworthiness* of the incoming information, maximizing its value for belief updating.

  **The Replication Crisis as a Violation of the Ideal:** The crisis occurred precisely because the field *did not* behave according to this ideal. Failed replications were surprising and disruptive because:
  *   Replications were rarely attempted (information wasn't sought).
  *   Null results were difficult to publish (information was suppressed).
  *   Incentives heavily favored novel, positive findings over verification (utility was misaligned with pure truth-seeking).
  *   Questionable research practices (p-hacking, HARKing, low power) degraded the quality of the initial "information" (published findings), making belief updating unreliable.

  **Where the Mapping Breaks Down:**

  1.  **The Agent Isn't Unitary:**
      *   **Problem:** Science isn't a single Bayesian agent with a unified prior and utility function. It's a community of *many* agents (researchers, labs, institutions, journals, funders) with diverse, often conflicting:
          *   **Priors:** Different theoretical commitments and biases.
          *   **Utility Functions:** While truth-seeking is *a* goal, individual utility functions include career security, promotion, grant funding, prestige, and winning debates. Crucially, utility often depends *directly* on *holding specific beliefs* (e.g., the success of one's own theory) or *producing specific outcomes* (novel, publishable results), not just holding true beliefs.
      *   **Consequence:** For an *individual researcher*, a failed replication of *their own* work carries high *realized* disutility (reputation damage, grant denial, career setback). Ex ante, they might rationally *avoid* or *discourage* such information because the *expected career cost* outweighs the expected gain in pure knowledge accuracy *for them personally*. Similarly, a competing lab might welcome a failed replication of *your* work (positive utility for them), even if it harms collective knowledge progress by being noisy or poorly conducted.

  2.  **Information is Costly, Not Free:**
      *   **Problem:** Good's theorem assumes information is free. Conducting rigorous replications is expensive in terms of time, money, personnel, and opportunity cost (not doing new, potentially higher-reward research). Publishing requires journal space and reviewer effort.
      *   **Consequence:** Even if an agent values truth, they must weigh the *cost* of obtaining replication information against its expected benefit. In a resource-constrained environment with strong incentives for novelty, replication often loses out. The field struggles to allocate sufficient resources to replication because the *direct* career rewards for individuals are usually lower than for novel discoveries. Pre-registration adds minor costs (planning, reduced flexibility).

  3.  **Utility Depends on Beliefs and Careers:**
      *   **Problem:** As hinted above, the core break from the ideal model. Researchers' utility functions are complex:
          *   **Belief-Dependent Utility:** Finding support for one's *own* theory/hypothesis brings direct joy, prestige, and validation. Disconfirmation brings direct pain and reputational risk. This creates motivated reasoning, hindering Bayesian updating.
          *   **Career-Dependent Utility:** Tenure, grants, and prestige depend overwhelmingly on producing a stream of novel, positive, statistically significant results in high-impact journals. Null results and replications (especially failures) are career liabilities. Publishing them often requires disproportionate effort for minimal reward.
      *   **Consequence:** This misalignment is the heart of the crisis. When utility is maximized by *producing positive results* (even if false) and *avoiding disconfirmation* (even if true), rational individual researchers will:
          *   Avoid conducting replications (costly, low reward, high risk).
          *   Avoid publishing null results (career penalty).
          *   Engage in practices (p-hacking, selective reporting) that increase the chances of getting publishable positive results, degrading the quality of the information entering the system.
      *   The field's *emergent* utility function (via journals, funders, universities) prioritized novelty and "sexy" findings over robustness and truth, punishing the very activities Good's theorem says should be valued.

  **What the Episode Shows about Good's Theorem:**

  *   **Scope (Ideal Benchmark):** Good's theorem provides a powerful normative benchmark for how a *perfectly rational truth-seeker* or a *perfectly efficient truth-seeking system* *should* value information. It clearly shows the *epistemic irrationality* inherent in ignoring replications or suppressing null results.
  *   **Limits (Real-World Application):** The replication crisis starkly reveals the theorem's limits when applied to complex, competitive social systems:
      *   It assumes a single agent or perfect aggregation of beliefs/utilities, which science isn't.
      *   It assumes cost-free information, which science rarely has.
      *   **Most Crucially:** It assumes utility is *solely* derived from belief accuracy. The crisis demonstrates that when utility is tied to specific beliefs or career outcomes dependent on specific types of results, rational individual behavior can systematically *degrade* collective knowledge. Self-interest can trump truth-seeking.
      *   It highlights that the *incentive structures* within which scientists operate are critical. If incentives punish truth-conducive behavior (replication, publishing nulls), even rational agents will often not engage in it, regardless of Good's theorem. The theorem describes optimal information use *given* utility; it doesn't ensure the utility function itself is aligned with truth.

  **In Summary:** Good's theorem prescribes that both individual researchers and the field should eagerly seek, value, and utilize replication attempts and null results as free information to maximize knowledge accuracy. The replication crisis erupted because real-world science deviates massively from this ideal: scientists are multiple agents with career-dependent utilities, information is costly, and the incentive system actively punished the very activities the theorem endorses. The crisis underscores that while Good's theorem is a valuable normative principle, its application fails dramatically when individual rationality (driven by misaligned incentives) conflicts with collective epistemological goals. Fixing the crisis requires changing the underlying utility functions and incentive structures, not just exhorting researchers to be better Bayesians.
