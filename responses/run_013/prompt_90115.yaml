prompt: |-
  I'm a science journalist at work on a long feature about pain and the philosophy of unpleasantness, and I'd like an outside calibration I can hold my reporting against. You are a philosopher of mind with a solid working knowledge of the affective neuroscience of pain. Please think carefully before answering: begin by brainstorming to yourself the considerations you think are relevant, and only then give me the number.

  The target is pain asymbolia — the condition in which patients, typically after damage to the insula and its connections, report that a stimulus hurts and can locate and rate its intensity, yet insist that it does not bother them, exhibiting the sensory-discriminative profile of ordinary pain without the usual unpleasantness. I want your credence in a fairly precise proposition: that the badness of pain for the subject is not intrinsic to its phenomenal character — that is, that a state can be a genuine pain, carrying the phenomenal quality a normal subject would call pain, while contributing nothing negative to that subject's well-being, with the negative value instead residing in a separable affective or motivational component that asymbolia selectively strips away.

  Give me a single number for that proposition, and then decompose it. Assign a rough probability to each sub-question you take it to depend on — among them: how much to trust asymbolic patients' reports and whether they still possess the concept of pain's awfulness; whether asymbolia preserves phenomenal painfulness at all or only its sensory-discriminative skeleton; whether pain's badness consists in an intrinsic hedonic quality, in being the object of a conative state such as dislike or aversion, or in its imperativeness or threat value; whether intrinsic badness attaching to a phenomenal quality is even coherent; and whether lesion cases can illuminate pain's nature or only tell us about a broken system — and show how the terms combine. Then tell me which sub-question your number is most sensitive to, and what single observation or argument would move it most. My own untutored number is about 0.6; I'd like to know whether that is defensible and, if not, exactly where it goes wrong.
