prompt: |-
  Next month I'm presenting at a small workshop on democratic theory — half political theorists, half people who do judgment aggregation with actual math — and I need a Q&A prep sheet, badly, because I've been working on this position alot in a bubble and I genuinely don't know where it's weakest. Here's the thesis I'm defending. The Condorcet jury theorem is usually put as: if every voter is independently more likely than not to get the answer right, then majority rule's probability of being right tends to one as the electorate grows. I want to argue that both of those standard assumptions cut at the wrong joints. The condition that actually does the work, I claim, is something I'm calling residual informativeness: each voter's vote has to carry some information about the truth that isn't already contained in the other votes — formally, it has to shift the conditional probability of the state given everyone else's votes. Once you state the theorem that way, I claim three things follow: (a) the independence assumption stops being a substantive requirement and becomes bookkeeping; (b) majority rule still converges under conditions much weaker than "everyone is uniformly better than a coin flip"; and (c) the usual panic about correlated errors from shared media and herding is mostly misplaced, since what matters isn't correlation as such but whether the marginal voter still carries any information. I'm fairly confident about (a) and (b), and I have a nagging feeling (c) is where I'll get killed.

  The room is small but rough: two formal people who know the aggregation literature inside out and will demand a counterexample the instant I say correlation doesn't matter; a political theorist whose whole project is that majority rule's authority is about legitimacy and equal respect and who thinks epistemic defenses of democracy are basically a category error; an empirical political scientist who studies voter knowledge and polarization and will ask how on earth you'd measure residual informativeness in a real electorate; and possibly a legal scholar who cares about jury instructions and hung juries and will reframe everything in those terms. What I want is the eight or so objections I'll actually get from these people — not the ones I'd get from a LessWrong meetup, where everyone would just argue about whether the theorem even needs a truth-tracking account of voting. Order them by how much damage they'd do, phrase each one the way that specific person would actually phrase it (the formal folks want a definitional objection or a counterexample, the theorist will make it about legitimacy, the empiricist will make it about measurability, the legal scholar about juries), give me a two-minute spoken reply to each, and flag where the reply is soft or where I'm quietly bluffing. Tell me what to concede up front to buy credibility and what to hold firm on.

  You're a philosopher of social science who works on both social choice and formal epistemology, so please think carefully and don't hand me generic "have you considered dependence?" objections — I need the real fault lines, not the ones I already have answers to. Start by brainstorming, on the page, where the load-bearing assumptions of my position actually are and which of my three claims is doing the most work, then build the prep sheet off that. And please seperate out the one question I'm praying nobody asks, with a straight answer to it.
reasoning: |-
  Okay, the user is preparing for a workshop on democratic theory where they'll defend a reinterpretation of the Condorcet Jury Theorem (CJT). They've been developing this idea in isolation and need to anticipate tough questions from a diverse audience. Their core argument is that "residual informativeness" (RI) is the key condition for majority rule convergence, replacing independence and uniform competence. They believe this reformulation makes independence a bookkeeping matter (a), allows weaker competence conditions (b), and shows correlation isn't inherently problematic (c).

  I need to help them identify where their argument might be vulnerable. The audience includes formal experts, a legitimacy-focused theorist, an empirical researcher, and a legal scholar. The user wants specific objections phrased how each person would ask them, ranked by damage potential, with concise replies and honesty about weaknesses. They also want to know the one question they dread being asked.

  First, I should outline the key assumptions of their position. Residual informativeness means each vote adds new information about the truth beyond what others' votes provide. This seems to reframe dependence as a non-issue if RI holds. But I see potential fault lines:

  For claim (a) - independence as bookkeeping: While conditioning on others might absorb dependence, this assumes votes are exchangeable or that conditioning fully captures dependencies. What if there are latent variables affecting all votes? The formal experts might argue that RI alone doesn't guarantee asymptotic convergence without some structural assumptions.

  For claim (b) - weaker competence: RJT with RI should allow voters with below-chance competence as long as their mistakes aren't redundant. But does this hold with correlated errors? The empirical researcher might question how such voters could exist systematically.

  For claim (c) - correlation not mattering: This is the trickiest part. The user thinks shared error sources (like media) only matter if they exhaust all marginal information. But correlated errors could precisely create that exhaustion. The legal scholar might connect this to jury dynamics where pre-deliberation biases persist.

  Prioritizing objections: The empiricist's measurability challenge could be most damaging because RI is abstract. Without operationalization, the whole framework feels theoretical. The legitimacy critique might be next - if the user concedes RI doesn't cover justification, it undermines their response to the political theorist. The formal counterexample could be serious but answerable if prepared. 

  For the dreaded question: It might be whether RI is sufficient when correlations are systematic (like structural oppression), making majority rule amplify errors. This cuts to real-world applicability.

  I'll structure the prep sheet with ranked objections, tailored phrasing for each audience member, strategic replies, and flagged weaknesses. The user should concede measurement difficulties to the empiricist but hold firm on RI's conceptual value. For the legitimacy concern, they should redirect to epistemic value without denying other dimensions. The formal counterexample needs a clear mathematical response showing RI preserves convergence.
answer: |-
  Here’s a targeted Q&A prep sheet based on your position’s fault lines, ranked by damage potential (1 = most dangerous). I’ve flagged soft spots in replies and strategic concessions. The core load-bearing assumption is **whether residual informativeness (RI) can persist under real-world correlation structures**, and Claim (c) is your most vulnerable flank.

  **Load-Bearing Assumptions & Fault Lines:**
  - **Critical Weakness**: RI assumes *conditionally independent* signals *given the truth*—but systemic bias (e.g., media monoculture) may make votes *conditionally dependent even given truth*, killing RI. Claim (c) hinges on this.
  - **Claim (a)**: Independence becomes "bookkeeping" only if conditioning on others' votes *screens off* dependencies. This fails if unobserved confounders exist (e.g., shared cultural frames).
  - **Claim (b)**: Works mathematically but risks irrelevance if RI requires unrealistically weak competence (e.g., 50.0001% accuracy).
  - **Claim (c)**: The **Achilles' heel**. Correlation *is* harmless only if it doesn’t erode RI. But in practice, shared error sources (polarization, misinformation) often *do* erode RI.

  ---

  ### **Q&A Prep Sheet: Ranked Objections & Replies**
  **1. Empiricist’s Measurability Challenge** (Most damaging: invalidates whole framework)  
  *Objection (empirical polisci):* "Residual informativeness sounds elegant, but how do you *operationalize* it? Voter beliefs aren’t i.i.d. data—they’re messy, endogenous, and shaped by the same social forces you dismiss. Without a measurement strategy, this is just math fiction."  
  **Reply (2-min):** "You’re right—direct measurement in electorates is near-impossible. But we can *proxies* RI: (1) Survey experiments testing if *adding* a voter type changes post-truth beliefs; (2) Natural experiments (e.g., exogenous info shocks) showing marginal belief shifts. Concede: It’s messy. Hold firm: *Conceptually*, RI forces us to ask *which correlations actually harm truth-tracking*—not all do."  
  *Soft spot:* Proxies are indirect; real polarization might defy isolation.

  **2. Legitimacy Critique** (Undermines relevance)  
  *Objection (political theorist):* "Even if RI ‘works,’ why should we care? Majority rule’s moral authority comes from equal respect—not being truth machines. Your epistemic defense misunderstands democracy’s purpose."  
  **Reply:** "I agree legitimacy isn’t *reducible* to truth-tracking. But if majority rule *systematically fails* under RI (e.g., hung juries), that *impacts* legitimacy. RI isn’t replacing respect—it’s showing when collective wisdom *adds* value to it."  
  *Concession needed:* "Epistemic value is *one dimension*—not the whole story."  
  *Hold firm:* "Ignoring truth-tracking risks legitimizing *epistemically broken* systems."

  **3. Formal Counterexample: Latent Common Causes** (Threatens Claim c)  
  *Objection (formal theorist):* "Consider voters who *seem* residually informative but share an unobserved bias (e.g., all miss the same evidence). Majority rule amplifies *systematic* error—converging to 100% wrong. Doesn’t this break RI?"  
  **Reply (2-min):** "Sharp point—but in that case, votes *don’t* carry RI! If bias makes votes conditionally dependent *given truth*, RI fails. My claim isn’t ‘correlation never hurts’—it’s ‘only *RI-destroying* correlation hurts.’ Your example shows RI’s *limits*, not its invalidity."  
  *Bluff alert:* Assumes we can *detect* when RI holds. In practice, latent confounders lurk everywhere.

  **4. Jury Scholar’s Institutional Reality** (Exposes practical gaps)  
  *Objection (legal scholar):* "Juries show why RI isn’t enough. Voters enter with *pre-correlated* biases from voir dire or media. Deliberation’s value is *breaking* these correlations—but RI assumes votes are final. Isn’t this theorem irrelevant to real deliberation?"  
  **Reply:** "Absolutely—RI applies to *input* votes, not deliberation. But it shows why diverse juries matter: if biases are *diverse*, they may preserve RI. And hung juries? They arise when RI is exhausted—no voter breaks ties. This *formalizes* why unanimous juries sometimes fail."  
  *Concede:* "Static RI can’t model dynamic deliberation—but it sets a baseline."

  **5. Competence Floor Challenge** (Threatens Claim b’s relevance)  
  *Objection (formal theorist):* "Sure, RI allows voters <50% accurate, but how likely is that? If shared noise reduces most to near-chance, RI may require superhuman discernment. Isn’t ‘uniform >50%’ more realistic?"  
  **Reply:** "RI’s value is in *heterogeneous* electorates: e.g., 5 experts (60% right) + 95 laypeople (49.9% right). Uniform CJT fails here, but RI *succeeds*—majority still converges! It’s not about *likely* scenarios, but *possible* ones uniform CJT excludes."  
  *Soft spot:* If laypeople are *below* 50% *due to shared noise*, RI collapses—back to Claim (c).

  **6. Epistemic Injustice Reframe** (Moral-practical attack)  
  *Objection (political theorist):* "Your ‘marginal information’ logic ignores *power*. If oppressed groups have high RI (their votes reveal hidden truths), but majority rule drowns them out, isn’t this theorem just masking epistemic injustice?"  
  **Reply:** "Critical point—but RI *highlights* this! If marginalized voters carry unique information, RI *requires* their inclusion for truth-tracking. This formalizes why *exclusion* harms epistemic performance."  
  *Hold firm:* "RI doesn’t solve power imbalances—but shows their *epistemic cost*."

  **7. The Herding Paradox** (Tests Claim c’s limits)  
  *Objection (empiricist):* "In polarized electorates, voters ‘herd’ onto two positions. If early voters correlate later votes, won’t RI vanish even if individuals *feel* informed?"  
  **Reply:** "Herding *can* kill RI—but not always. If early voters are *truly* informed, later votes add no info (RI=0), but majority is still right. If early voters are *wrong*, herding destroys RI—but that’s a pathology, not inevitability. RI explains *why* diverse early movers matter."  
  *Bluff:* Assumes we can identify "true" early informers.

  **8. The No-Free-Lunch Nod** (Low damage)  
  *Objection (formal theorist):* "Isn’t RI just a restatement of conditional independence given the state? This feels like repackaging, not revolution."  
  **Reply:** "Exactly! But that repackaging *changes everything*: it shows independence isn’t primitive—it’s about whether dependencies *screen off* given truth. That’s why correlation isn’t fatal unless it erases *all* marginal signal."  
  *Concede:* "It’s not *new math*—it’s a *conceptual pivot*."

  ---

  ### **The Question You Pray Nobody Asks**
  *"Suppose persistent structural oppression (e.g., racism) creates correlated errors that* systematically *distort voters’ perceptions of truth. If this correlation is latent and immune to conditioning, doesn’t RI collapse—and majority rule converge to* falsehood *with high confidence? Doesn’t that make your defense* dangerously complacent *about real-world power?"*

  **Why it’s deadly**: It merges the empiricist’s (latent variables), theorist’s (oppression), and formalist’s (systematic error convergence) critiques. It forces you to admit RI is fragile under injustice—undercutting claims (b) and (c).

  **Straight Answer**: "Yes. If oppression creates *conditionally dependent errors given truth*—meaning even *after* knowing the truth, votes are correlated—RI fails, and majority rule can amplify falsehood. This theorem isn’t a panacea; it’s a diagnostic. It shows why *breaking* structural biases is *epistemically urgent*, not just morally. Democracy’s truth-tracking power *requires* equitable epistemic conditions."  

  **Damage Control**: Immediately pivot to: "But this also shows why RI is *useful*: it identifies *exactly* where democracy fails—when power silences marginal information. That’s a case for *more* democracy, not less: inclusion reforms that restore RI."

  ---

  ### **Strategic Concessions & Holds**
  - **Concede early**: "RI is *conceptually* powerful but *empirically* hard to measure. It doesn’t replace legitimacy or solve oppression."  
  - **Concede if pressed**: "Some correlations *do* destroy RI—especially latent systemic ones."  
  - **Hold firm**: "Independence *is* derivative—dependence only matters when it exhausts marginal information. Not all correlation is harmful."  
  - **Hold firm**: "RI expands CJT’s applicability to realistic heterogeneity—uniform competence *is* unnecessarily restrictive."  

  **Final Tip**: Preempt the "dreaded question" by addressing structural bias *first* in your talk. Say: "RI’s biggest limitation? It fails when power corrupts marginal information. That’s not a math problem—it’s a call to action." This disarms critics by absorbing their punch. Good luck—this is strong work, but the workshop will sharpen it.
