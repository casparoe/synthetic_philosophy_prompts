prompt: |-
  I've been arguing with a friend in our philosophy of mind reading group about the causal exclusion argument, and I've ended up defending a position I'd like you to try to break. I accept the standard setup: mental properties aren't identical with physical properties, so I'm a non-reductive physicalist; every mental event has a sufficient physical cause; and mental properties aren't overdetermining their physical effects in any interesting sense. Rather than accept epiphenomenalism, I want to keep mental causation by combining two moves. First, an interventionist or difference-making account of causation, on which "C causes E" isn't a bare relation between two events but is relativized to a set of variables and to a level of grain — so a mental property can be a cause relative to one variable set while its physical realizer is the cause relative to another, with neither excluding the other. Second, a proportionality or specificity constraint, on which the better cause is the one that is neither too coarse nor too fine for the effect, which is supposed to explain why we cite the belief rather than the neural configuration when explaining an action. I take this package to dissolve the exclusion argument rather than answer it, and I've noticed my friend finds that suspiciously convenient.

  What would count against it? I don't want the standard objections reheated — I want the evidence, arguments, intuitions, or formal results that should actually move someone who already accepts both moves. Rank them from fatal to merely awkward, and say which of them I'd have to concede as counting against me rather than dismissing as a misunderstanding. In particular, I want to know: whether the relativization to a variable set makes "the mental cause" come out as an artifact of my choice of variables rather than a fact about the world, and how I could tell the difference; whether the proportionality constraint ever delivers the wrong verdict about which cause to cite, in cases where the coarse-grained cause seems to be doing the explanatory work but the fine-grained one is what actually made the difference; and whether the package predicts anything the epiphenomenalist rival doesn't, or whether it risks nothing at all and simply redscribes the data in friendlier terms. I'd also like an honest assessment of what defenders of this kind of view would themselves concede counts against it, as distinct from what critics say on their behalf — and if the position turns out to be well insulated by qualification, tell me plainly whether that insulation is a defect or simply the price of any account that takes levels of description seriously. Finish with one line of the form "Verdict: <FATALLY EXPOSED / MODERATELY EXPOSED / WELL INSULATED> — <one-sentence summary of the strongest defeater>."
