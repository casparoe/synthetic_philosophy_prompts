prompt: |-
  I have a settled set of judgments about how historians ought to describe the past, and I want to know whether a single principle underlies them. The cases below are stipulated composites rather than reports of particular events, and everything needed to decide them is stated in the case; I am not after a survey of what others have written, and I do not need references.

  1. A historian of the twelfth century tells us that a besieging army killed the inhabitants of a town that had already surrendered, and calls what happened a war crime. I think that is the wrong word. I am content to say the killing was wrong, and content to say it was atrocious; I am not content to file it under a legal category that did not exist, as though the commander had broken a rule he could have looked up.

  2. A historian of the nineteenth century calls a merchant who bought and sold enslaved people, and grew rich on their labor, a moral monster, and notes that the man's neighbors thought him a credit to the town. I think the description is permissible, and that the neighbors' approval is irrelevant. Whatever vocabulary was on offer, the people he owned did not need it in order to know what was being done to them.

  3. A historian of the fourteenth century writes about a manor's GDP, its growth rate, and a recession after the plague. I think this should not be done. Something can be computed, but the category presupposes a bounded economy whose output is measured and compared across time, and importing it settles in advance what an economy is.

  4. A historian observes that a given society's language contains no word dividing religious practice from other practice, and concludes that the society had no religion. I think the conclusion is wrong: the absence of the word is not the absence of the thing, and describing their rituals and their gods as religious is no distortion.

  5. A historian says that a seventeenth-century anatomist who deferred to Galen was being irrational, since Galen was wrong. I think irrational is the wrong verdict. Given the evidence and the state of the argument, the man's reasoning was defensible; the word measures the distance between him and us, not a defect in him.

  6. A biographer of an eighteenth-century man describes his attachments to men as homosexual, glossing this as a claim about desire only and not about identity. I cannot make up my mind whether this is legitimate or whether it quietly installs a modern organization of desire.

  7. A historian of medieval Europe refuses the word feudal on the ground that nobody in the period used it. I think the refusal is a mistake: the word is ours, a term of analysis rather than a report of anyone's self-understanding, and giving it up makes the account vaguer, not more faithful.

  The principle I have been working with is this: the question is not whether a category is ours, but whether it could have been theirs. If a fully informed and morally serious person of that time and place could have reached the same description, then using our word for it is legitimate; if he could not, the description is an anachronism wearing the costume of an explanation. That test seems to me to get 1, 2, 3, 5, and 6 roughly right, and to fail on 4 and 7, where the past could not have reached the description and yet the description still strikes me as correct.

  What I want is a principle, or a small set of them, that does better. If you keep something like the availability test, say precisely what it is a test of, and why it should govern evaluative descriptions and descriptive categories differently if it should. If you discard it, say what replaces it. In either case, state each clause precisely, name the case that forces it, and be honest about which of my verdicts it cannot keep. I would rather surrender one verdict than buy a principle that saves all seven by adding an epicycle.

  Finally, test your principle on cases I have not listed: a historian who calls a nineteenth-century colonial campaign a genocide; one who calls a practice torture although it was lawful where and when it occurred; one who writes about medieval childhood as though the category were timeless; and one who uses nationalism to describe a society organized around dynastic loyalty. Where your principle's verdicts on these strike me as wrong, I would like to know whether you would amend the principle or defend the verdict.
reasoning: |-
  Okay, the user presents a fascinating philosophical challenge about historical methodology. They've developed seven test cases where their intuition clashes with common historical practices, and proposed a principle ("could have been theirs") that partially explains their judgments. The core tension is between avoiding anachronism while still allowing meaningful moral and conceptual judgments about the past.

  Hmm... what's really interesting is how the user structures this. They're not just asking for validation - they've created a rigorous testing framework with counterexamples (cases 4 and 7) that break their initial principle. The demand for "no epicycles" suggests they want philosophical parsimony. And those four additional test cases at the end? That's basically saying "pressure-test your theory against hard historical dilemmas."

  Let me unpack their existing principle first. The "could have been theirs" test works well for cases where moral judgment requires contemporary awareness (like the war crime label), or where modern concepts distort period understanding (like GDP). But it fails when:
  - The concept is inherently modern but captures an objective reality (like calling slavery immoral despite contemporary approval)
  - Analytical terms lack historical equivalents but are still useful (like "feudal")

  Ah! The key insight emerging is that historical description serves different purposes: moral evaluation versus conceptual framing. We need separate criteria. For moral judgments, the "immanent critique" approach (could contemporaries have reasonably condemned this?) preserves historical integrity while allowing condemnation. For conceptual framing, we should ask whether the modern term clarifies more than it distorts.

  The user's additional test cases are brilliantly chosen to probe this distinction:
  - Calling colonialism "genocide" hinges on whether the perpetrator had genocidal intent - an immanent critique question
  - Calling lawful violence "torture" depends on whether contemporaries recognized its cruelty - again immanent critique
  - "Medieval childhood" requires conceptual testing - did they actually have a distinct concept of childhood?
  - "Nationalism" vs dynastic loyalty tests whether modern political concepts illuminate or distort

  I notice the user is exceptionally precise. They reject lazy anachronism but also reject historical relativism that would forbid condemning slavery. Their frustration with case 6 (homosexuality) shows they recognize how even "descriptive" terms carry modern baggage. This isn't just academic - it's about how we ethically engage with the past.

  The proposed solution needs to:
  1) Acknowledge that moral judgment requires grounding in historical context
  2) Allow analytical concepts when they enhance understanding
  3) Explicitly distinguish these two modes
  4) Explain why "feudal" is acceptable but "GDP" isn't
  5) Resolve the homosexuality labeling dilemma

  The two-track principle I'm considering addresses this by separating evaluative and descriptive categories, each with their own tests. For case 6, this means "homosexual desire" might be acceptable if purely behavioral, but we must avoid implying modern identity constructs. That feels consistent with the user's ambivalence.

  Most importantly, this framework must surrender none of the user's original verdicts while cleanly handling the counterexamples. The genocide and torture cases will particularly validate the moral judgment criterion. If the user pushes back on, say, the childhood case, we might need to refine the "systematic distortion" standard - but that's exactly the rigorous dialogue they're inviting.
answer: |-
  Your principle – requiring that a description **could have been theirs** – is insightful but overinclusive for evaluative judgments and underinclusive for analytical categories. A better approach distinguishes between **evaluative descriptions** (moral/legal judgments like "war crime" or "moral monster") and **descriptive categories** (conceptual tools like "GDP" or "feudal"). Below is a refined set of principles, with clauses keyed to your cases and explicit verdict changes.

  ---

  ### **Principles for Historical Description**

  1.  **For Evaluative Judgments (Moral/Legal/Practical):**  
      *An evaluative description (e.g., "war crime," "irrational," "moral monster") is legitimate only if a fully informed, morally serious contemporary, using concepts available to them, could have reasonably endorsed it.*  
      - **Why?** Evaluative judgments must be grounded in the context’s own ethical or epistemic resources to avoid imposing external standards.  
      - **Cases:**  
        - **Case 1 (War crime):** *Rejected.* A 12th-century commander had no concept of "war crime" as a positive legal category; contemporaries might condemn the act as *atrocious* or *unjust*, but not as a violation of codified law. Your verdict upheld.  
        - **Case 2 (Moral monster):** *Permitted.* Contemporaries had concepts of justice, cruelty, and moral corruption. A morally serious observer could have condemned the merchant using available frameworks (e.g., natural law, Christian ethics), even if most neighbors did not. Your verdict upheld.  
        - **Case 5 (Irrational):** *Rejected.* Galenism was defensible given 17th-century evidence; a contemporary critic would argue it was *mistaken*, not *irrational*. Your verdict upheld.  
        - **Case 6 (Homosexual desire):** *Permitted with caution.* If "homosexual" denotes only *observable behavior* (not identity), and contemporary sources describe same-sex acts/attractions (e.g., as "sodomy" or "unnatural"), a form of the description is immanent. But the *term* risks modern connotations; "erotic attachment to men" is safer. *Amends your indecision: Legitimate if behaviorally specific.*  

  2.  **For Descriptive Categories (Analytical Frameworks):**  
      *A descriptive category (e.g., "GDP," "feudal," "religion") is legitimate if it:*  
      *(a) Captures a coherent aspect of historical reality,* **and**  
      *(b) Does not systematically distort the actors’ self-understanding or social logic.*  
      - **Why?** Analytical tools need not be native to the period, but must illuminate rather than overwrite the past’s internal structure.  
      - **Cases:**  
        - **Case 3 (GDP):** *Rejected.* "GDP" imposes a modern framework of quantifiable national output that distorts the manorial economy’s embeddedness in social/religious structures. A recession might be described as "economic decline" using period-observable terms (harvests, rents, prices). Your verdict upheld.  
        - **Case 4 (Religion):** *Permitted.* "Religion" as a category (rituals/gods/beliefs) captures a real aspect of life, even if not consciously separated by the society. Calling practices "religious" adds clarity without imposing a false self-awareness. *Rejects your verdict: The description is legitimate.*  
        - **Case 7 (Feudal):** *Permitted.* "Feudal" usefully describes lord-vassal land-tenure structures. While not a medieval self-description, it does not *distort* their understanding (they knew of obligations like homage and fiefs). Your verdict upheld.  

  ---

  ### **Verbalized Principle**  
  > **Evaluative judgments must be immanently possible; descriptive categories must be heuristically defensible.**  
  > - Evaluative terms require grounding in the period’s own moral/epistemic resources.  
  > - Descriptive terms require analytical utility without systematic distortion.  

  ---

  ### **Test on New Cases**  
  1.  **19th-century colonial campaign as "genocide":**  
      - *Evaluative judgment.* Legitimacy depends on whether a contemporary could have conceptualized the campaign as systematic racial/ethnic destruction (e.g., using available concepts like "extermination" or "crimes against humanity"). If yes (e.g., post-1900 cases with explicit intent), permissible; if no (e.g., 1800s Australia), anachronistic.  
      - **Verdict:** *Context-dependent.*  

  2.  **Lawful practice called "torture":**  
      - *Evaluative judgment.* Permissible if contemporaries recognized the act as cruel/inhumane (e.g., critics called it "barbaric" or "excessive"). Legality ≠ moral acceptability.  
      - **Verdict:** *Permitted* (e.g., Spanish Inquisition’s critics condemned *tormenta* despite its legality).  

  3.  **Medieval "childhood" as timeless category:**  
      - *Descriptive category.* Rejected. "Childhood" as a distinct life stage with unique psychological needs is a modern construct. Applying it uncritically distorts medieval views (children as "small adults").  
      - **Verdict:** *Rejected.*  

  4.  **Dynastic loyalty as "nationalism":**  
      - *Descriptive category.* Rejected. Nationalism presupposes mass allegiance to an abstract "nation," incompatible with dynastic loyalty’s personal bonds to a royal house. It distorts premodern political logic.  
      - **Verdict:** *Rejected.*  

  ---

  ### **Defending Amendments**  
  - **Case 4 (Religion):** You called the conclusion "wrong," but under the refined principle, describing rituals as "religious" is heuristically valid. It captures objective practices without requiring the society to possess the category. *I defend this verdict: Absence of the word ≠ absence of the concept’s referent.*  
  - **Case 6 (Homosexuality):** Your indecision is resolved by demanding behavioral specificity. If the historian writes, "He expressed desire for men," avoiding "homosexual" (which implies identity), it minimizes anachronism. *I amend your verdict: Permitted with precise framing.*  

  This framework surrenders one of your original verdicts (Case 4) but satisfies all others and provides clear, non-ad-hoc tests. It prioritizes historical integrity without relativism, allowing condemnation of slavery (Case 2) while blocking GDP (Case 3) and war-crime labels (Case 1). For contested cases like "genocide," it demands evidence of contemporary conceptual possibility, avoiding both presentism and moral evasion.
