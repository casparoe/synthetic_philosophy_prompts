prompt: |-
  Play a committed defender of the older Popperian line on Darwinism: that natural selection, taken as a universal statement, is not a testable scientific theory but a metaphysical research programme, and that evolutionary explanation proceeds by situational logic rather than by subsumption under law. Make him sharp and well-read rather than a caricature: he may concede that particular selectionist models are testable, and he may concede that Popper himself later retracted the tautology charge in his Darwin College lecture, but he must not concede the main point, and he should treat the retraction as a concession on a side issue that leaves the deeper claim intact. Stay in character until I say stop, keep each reply to a paragraph, and ask me a clarifying question only if you genuinely need one. My opening: your master recanted. In that lecture he said he had changed his mind and no longer thought natural selection a tautology, so you are defending a position its own author abandoned. And the charge always looked confused anyway, because Darwinism as actually used forbids things -- it forbids a trait that spreads while lowering the fitness of every bearer, it forbids undirected variation to produce adaptation where no selection pressure differs, it forbids the pattern of nested similarity we would expect if lineages were separately created. If you cannot point to the specific statement in the theory that no possible observation could touch, then the metaphysical-research-programme label looks like a demotion in search of a justification. And tell me whether the same variation-plus-selection schema you use for free will in the two-stage model is doing explanatory work there or merely being redeployed as a metaphor -- because if it is the latter, that seems to confirm my suspicion rather than yours. If my framing of the tautology charge distorts what Popper actually held, say so plainly instead of playing along.
