prompt: |-
  I'm an applied microeconomist — RCTs, potential outcomes, diff-in-diff, variance decomposition, the usual program-evaluation toolkit — and I keep getting dragged into arguments about heritability, mostly about IQ and personality, and I honestly can't tell whether the disagreement is substantive or just two dialects talking past each other. Can you take the two main positions in that fight — roughly, the one that says heritability estimates tell us something real about why people differ, and the one that says they're close to useless for that purpose — and restate each of them in the vocabulary I actually use: treatment effects, identification, exogenous variation, counterfactuals, decomposition of variance? Be faithful and don't just map "heritability" onto "R-squared" and declare victory. I know what a heritability coefficient is roughly (some share of variance) but not much past that, so don't assume I know the behavioural-genetics jargon.

  Then give me the residue report: what carries over cleanly, what only carries over if you fudge it, and what can't be said in my vocabulary at all — and tell me whether the leftover is a hole in how economists think about variation, or a sign the original claim was vaguer than it sounded.

  Give it back as exactly five numbered points, a sentence or two each, no intro and no conclusion.
reasoning: |-
  Hmm, the user is an applied microeconomist who works with RCTs, potential outcomes, diff-in-diff, variance decomposition - all the standard program evaluation tools. They're getting dragged into arguments about heritability, particularly regarding IQ and personality traits. They feel like there might be a fundamental communication gap and want me to translate the two main positions in this debate into their familiar econometric vocabulary.

  The user specifically wants me to avoid just mapping heritability to R-squared. They understand heritability coefficients as "some share of variance" but don't know behavioral genetics jargon. They want me to restate both positions using concepts like treatment effects, identification, exogenous variation, counterfactuals, and decomposition of variance.

  They also want a "residue report" - what translates cleanly, what requires fudging, and what can't be said in their vocabulary. Plus they want me to indicate whether any leftover represents a hole in economic thinking or just vague original claims.

  The user wants exactly five numbered points with no introduction or conclusion - just concise sentences. I need to be precise and faithful to both positions in the heritability debate.

  Let me break this down. First position: "heritability estimates tell us something real about why people differ." This is the view that high heritability means genes are a major cause of variation.

  Second position: "heritability estimates are close to useless for that purpose." This is the critical view that questions the meaning and usefulness of these estimates.

  I need to translate these using econometric concepts. For the first position: Heritability is like decomposing variance into components. The genetic part is analogous to the variance explained by a "treatment" (genes) that's randomly assigned (like in an RCT), making it identifiable as a causal share.

  For the second position: The critique is that heritability confounds things because genes aren't randomly assigned - they correlate with environments. So identification fails due to non-random assignment, making the decomposition non-causal.

  Now for the residue report: What carries over cleanly? The variance decomposition framework itself. What requires fudging? The random assignment analogy for genes. And what doesn't carry over? The idea of heritability being stable or informative about malleability - this might expose a hole in how economists think about variation across contexts.

  I'll structure this as five concise points covering the translations and residue analysis. I'll make sure to avoid jargon and connect directly to their econometric toolkit.
answer: |-
  1.  **Position 1 (Informative):** Heritability (h²) is analogous to decomposing the variance of the outcome (e.g., IQ) into components attributable to exogenous genetic variation (akin to an idealized, randomly assigned "genotype treatment" *G* whose variation is perfectly orthogonal to environment *E*), and environment (residual variance). A high h² suggests that under the *current* environmental distribution, variation in *G* explains a large share of the population variance in the outcome, identified under the strong assumption of no gene-environment correlation/covariance (i.e., Cov(*G*,*E*)=0).
  2.  **Position 2 (Useless):** Heritability estimates are often non-causal variance decompositions because the core identification assumption (Cov(*G*,*E*)=0) is violated; genotype *G* and environment *E* are typically confounded (e.g., genetic differences influence environmental exposure). Without exogenous variation in *G*, the estimated "genetic variance component" is not a clean causal effect; it conflates direct genetic effects, gene-environment interactions (GxE), and environmentally mediated genetic effects, rendering it uninterpretable for understanding *why* people differ.
  3.  **Clean Carryover:** The core concept of *variance decomposition* itself carries over cleanly: h² is literally the proportion of phenotypic variance statistically attributable to additive genetic variance in a specific population at a specific time, analogous to an R² from regressing the outcome on a set of genetic markers (under specific model assumptions).
  4.  **Fudged Carryover:** The *causal interpretation* of h² relies on fudging the analogy between genetic variation and *exogenous treatment variation* (like RCT assignment). While twin/adoption designs attempt quasi-random assignment of *G* relative to *E*, perfect orthogonality (Cov(*G*,*E*)=0) is rarely achieved, making the "genetic effect" component a mix of direct and indirect pathways, not a pure counterfactual contrast like a LATE.
  5.  **Can't Say / Hole vs. Vagueness:** The claim that a high h² implies the outcome is "hard to change" (low malleability) *cannot* be directly stated in your vocabulary. Variance decomposition (h²) describes the *source* of observed variation under current conditions, not the *malleability* of the mean under counterfactual interventions. This conflation exposes a hole in how economists often think about variation: decomposing *existing* variation (h²) is distinct from forecasting the *counterfactual response* of the mean/population distribution to a new policy/environmental shift. The original claim is often vague about this crucial difference.
