prompt: |-
  Hi — second-year PhD student in political theory, trying to write a section of my dissertation on sortition, and I keep triping over something about how citizens' assemblies actually get run. I can't tell whether it's a real tension in the practice or just me being slow.

  Here's the practice, roughly as it goes everywhere. You've got a contentious question — abortion, assisted dying, constitutional reform — and instead of electing a body you sortition it: names drawn at random from the electoral register. Except almost nobody runs a clean lottery. In practice it's stratified, so that the group matches the population on age, gender, region, education, sometimes even on whether people turned out at the last election. Then once everyone's in the room you feed them a curated set of expert briefings and "balanced" witnesses, because obviously you don't want them deliberating off whatever they saw on Facebook. Members usually get paid a stipend, and the recommendations get taken seriously — Ireland ran an actual referendum off the back of one of these.

  Now the other half. Jury service is the sortition we all actually live under, and it's the same institution turned inside out. Same lottery off the same kind of list, but there the lawyers get to strike people — voir dire, peremptory challenges — nobody's paid, nobody gets expert briefings, they just get the evidence and the judge's instructions. And yet we give juries far more deference than assemblies get. We'll overturn a conviction based on what twelve randomly drawn strangers concluded after a few days, but an assembly's recommendation is treated as advisory input into a process the politicians still control.

  So what does the assembly practice actually presuppose? My first instinct was that sortition commits you to a view about ordinary people being competent to decide hard questions — that's the whole pitch against election, that you don't need to be a specialist to have political judgment. But then why stratify? If the lottery is fair because everyone's judgment counts equally, drawing to match the population only makes sense if you think the verdict has to be descriptively representative, which is a different and much stronger claim, and one a plain lottery is supposed to make unnecessary. And why brief them? If the body is a microcosm, curating its information looks like you don't trust the microcosm. I keep feeling like the practice is quietly commited to something like "people are competent enough to be handed a verdict but not competent enough to be handed the inputs."

  Then there's the variant that really breaks my brain. Someone in my department wants to exclude from the pool anyone who's already taken a public position on the question — signed the petition, donated, posted about it, got into it at Christmas dinner. His reasoning is that the whole value of sortition is getting people without a dog in the fight. But that looks like it presupposes that having a stake disqualifies you, which is precisely what sortition is supposed to avoid presupposing — the lottery doesn't care what you think, that's the entire point of it.

  Could you untangle this for me? Specifically: (1) what view of legitimacy, competence and representation the assembly practice presupposes, and which rival views it quietly rules out; (2) whether the pieces are consistent or whether it's two theories stapled together; (3) which parts are strictly presupposed and which are just convention, i.e. where the practice is underdetermined and several theories would license the same design; (4) what the jury contrast actually shows, since juries seem to run on a different picture of the same lottery; (5) what happens to the practice if you swap in the exclusion rule — does it turn into something else? And please don't hand me a reading list, I can find the usual names.
reasoning: |-
  Okay, the user is a second-year PhD student in political theory working on sortition for their dissertation. They're grappling with tensions in how citizens' assemblies are run versus juries. Let me unpack their questions.

  First, they noted that citizens' assemblies use stratified sampling to match demographics, curated briefings, stipends, and their outcomes are advisory. Juries, though, are random, get no special briefings, aren't paid, but their decisions carry legal weight. The user wonders if this implies a contradiction: if ordinary people are competent, why stratify and curate info?

  Hmm, the core issue seems to be about underlying assumptions of legitimacy and competence. The user is questioning whether the practices in citizens' assemblies are consistent. Stratification suggests descriptive representation matters, but sortition is supposed to make that unnecessary. Curated briefings might indicate distrust in people's ability to handle raw information. 

  Then there's the exclusion rule proposed by their colleague—excluding anyone who's taken a public stance. That clashes with the lottery's indifference to opinions. So, does that undermine the whole point of sortition?

  I need to address their five specific questions. Let me start with the legitimacy and competence assumptions. Citizens' assemblies aim for democratic legitimacy through inclusion and informed deliberation. Stratification ensures diverse perspectives, addressing past exclusion. Curated briefings are about enabling informed decisions, not distrust. This contrasts with epistemic theories that might reject stratification.

  Are these practices consistent? Sort of. Stratification and briefing serve the goal of high-quality deliberation, which is different from juries' focus on impartiality. But there's a tension between descriptive representation and pure egalitarianism. The lottery's modified to fix sampling biases, which is practical but deviates from pure randomness.

  What's strictly presupposed? The necessity of informed deliberation. Stipends and stratified sampling are conventions addressing practical barriers. The exclusion rule for biased members would fundamentally change the assembly's nature, making it more like a jury but possibly less representative.

  The jury comparison highlights different institutional purposes. Juries operate under legal constraints, prioritizing impartiality over diversity. Their deference comes from legal tradition, not democratic theory. Citizens' assemblies are advisory because they're innovations without that tradition.

  If they implement the exclusion rule, it shifts the model to preference aggregation of the uninformed, losing the microcosm idea. That might not be desirable. 

  The user's deeper need is to clarify the theoretical foundations of sortition practices. They might be looking for a framework to analyze these tensions without getting bogged down in literature. They need a coherent explanation that connects practice to theory, helping them structure their dissertation argument.
answer: |-
  Here's a systematic untangling of the tensions you've identified, addressing your five questions directly:

  ### 1. **View of Legitimacy, Competence, and Representation Presupposed**
     - **Legitimacy**: Rooted in *deliberative democracy* and *inclusion*. Legitimacy comes not just from random selection, but from **deliberative quality** and **descriptive representativeness**. The assembly must "look like" the populace to be seen as legitimate, and its conclusions must be informed by structured expertise.
     - **Competence**: Citizens *can* judge complex issues **if** given three things: **(a)** time/space to deliberate, **(b)** curated neutral information, and **(c)** facilitation. This rejects pure epistocracy but accepts that *untrained* judgment needs scaffolding. Competence is *emergent* through process, not innate.
     - **Representation**: **Microcosmic representation** is key. The body isn't just statistically random; it's a *deliberative mirror* of society. Stratification corrects for unequal participation/structural biases (e.g., low turnout among youth) to achieve this.
     - **Rival views ruled out**:  
       - Pure egalitarianism (unmodified lottery is sufficient).  
       - Epistocracy (experts should decide).  
       - Aggregative democracy (voting alone = legitimacy).  
       - Radical skepticism of citizen competence (no briefing could help).

  ### 2. **Consistency: One Theory or Two Stapled?**
     - **Coherent but tense synthesis**: It's a single theory—**deliberative microcosm populism**—but with internal friction:
       - *Tension 1: Randomness vs. Representation*. Pure lottery assumes equal competence; stratification assumes unequal social power distorts randomness. **Resolution**: Stratification fixes *sampling injustice* (marginalized groups underrepresented in registers/self-selection).
       - *Tension 2: Trust vs. Control*. Curating inputs seems paternalistic. **Resolution**: The goal isn't raw opinion aggregation but *considered judgment*. Briefings counteract asymmetric misinformation (e.g., anti-vax campaigns), ensuring deliberation starts from shared facts. It trusts *process-enabled* competence, not pre-political wisdom.
     - **Not fatally inconsistent**: The core commitment is to **deliberative equity**—equal opportunity to participate meaningfully. Stratification and briefing serve that goal.

  ### 3. **Presupposed vs. Conventional**
     - **Strictly presupposed**:  
       - The need for *informed deliberation* (briefings/facilitation essential).  
       - The need for *descriptive representation* (stratification non-negotiable in practice).  
       - The assembly as a *microcosm*, not just a decision-maker.
     - **Conventional/underdetermined**:  
       - *Stipend level* (practical inclusion device, not theoretically core).  
       - *Exact stratification categories* (age/gender universal; education/prior voting debated).  
       - *Binding vs. advisory power* (context-dependent institutional design).  
       - *Voir dire-like exclusions* (currently rare in assemblies).

  ### 4. **The Jury Contrast Explained**
     Juries operate under a **different logic of legitimacy and competence**:
     - **Legitimacy**: Rooted in *legal tradition/impartiality*, not descriptive representation. A jury needn't "look like" society; it must be *individually unbiased* (hence voir dire).
     - **Competence**: Focuses on *adjudicative facts*, not policy complexity. Jurors are deemed competent to judge "what happened" based on trial evidence. No briefing needed because the dispute is bounded by legal rules.
     - **Deference**: Juries derive authority from **legal sovereignty** (centuries of common law) and **finality** (double jeopardy). Assemblies lack this institutional entrenchment.
     - **Key insight**: Juries show sortition works for *bounded factual judgments* with institutional backing. Assemblies tackle *open normative questions* without institutional authority—hence needing extra legitimacy boosts (representation, briefing).

  ### 5. **Swapping in the Exclusion Rule: Implications**
     Excluding those with "public positions" would **fundamentally alter the model**:
     - **Breaks microcosm representation**: It filters out engaged citizens, creating a pool of the disengaged/privately opinionated. The assembly ceases to mirror society.
     - **Shifts legitimacy claim**: From "society speaking" to "neutral arbiters deciding." Resembles **lottery as anti-faction device** (avoiding vested interests).
     - **Practical paradox**: Those excluded are often marginalized groups who mobilized to be heard (e.g., disability advocates in assisted dying debates). Exclusion could entrench elite dominance.
     - **Becomes a different institution**: Closer to a **policy jury** (focused on impartiality) than a citizens' assembly. Sacrifices descriptive legitimacy for perceived neutrality.

  ### Core Resolution to Your Tension
  The practice isn’t contradictory but **contextually adaptive**: 
  - **Sortition alone** = egalitarian *opportunity* to participate.  
  - **Stratification** = ensures *de facto* inclusiveness in stratified societies.  
  - **Curated briefings** = creates *equality of epistemic starting points*.  
  - **Advisory status** = acknowledges *lack of institutional authority* (unlike courts).  

  **What’s "presupposed" is this**: Democracy requires *both* equal voice *and* conditions for voices to be equally informed and heard. Random selection enables the first; stratification and deliberation enable the second. Juries achieve legitimacy through tradition and bounded tasks; assemblies must build it through design. The exclusion rule prioritizes neutrality over representation—a defensible but distinct model.

  This framework should help you locate your critique: Are assemblies trying to serve two masters (representation vs. optimal judgment)? Is stratification a correction for imperfect rolls, or a concession that pure lottery isn’t enough? Your "quiet commitment" insight is sharp—the practice *does* assume citizens need scaffolding to manifest competence. That’s the deliberative wager.
