prompt: |-
  Last night a friend and I argued for several hours about whether our own disagreement was rational, and we never got past trading intuitions. We had both seen the same public evidence and had ended up with different credences, and he pressed the line that if we are both rational and each knows the other to be rational, we cannot sincerely remain in disagreement, so any persistent divergence must mean one of us is misinformed or incoherent. I answered that this presupposes we already share a prior, which is precisely what is at issue. We kept collapsing a claim about what rationality requires into a claim about how people in fact reason, and back again.

  I would like the document we should have written instead. Treat the two of us as two camps. The first camp holds that a common prior is a constitutive requirement of rationality: given common knowledge of one another's rationality and posterior beliefs, agents cannot agree to disagree, so any surviving divergence must trace to different information. The second camp holds that a prior is a choice of model or inductive bias — of background theory, of which hypotheses are even on the table — that is not itself forced by coherence or by evidence, so agents can rationally diverge even with full common knowledge of one another's reasoning.

  Write the joint statement an adversarial collaboration between these two camps would produce. I want the following.

  A numbered section of agreed claims: what both sides can sign about the formalism (what the agreement result actually assumes — a shared prior, common knowledge, a common information structure — and what it does not), about the distinction between normative and descriptive readings of the assumption, and about what each side would treat as evidence or argument bearing on the issue.

  A statement of the genuine disagreements, each rendered in wording its own side would accept as fair to it.

  The cruxes: the sub-questions such that settling one would move at least one side. I expect these to include whether the common prior is a coherence constraint or an empirical hypothesis; whether rationality can be characterized without reference to a shared prior; whether the impossibility of purely speculative trade among agents who share a prior and know one another to be rational tells against the assumption or merely redescribes it; and whether any non-arbitrary prior can be singled out at all, for instance by a rule that prefers hypotheses with shorter descriptions.

  For each crux, the case, argument, or evidence both sides agree bears on it, with each side's prediction recorded in advance. Make at least two of these concrete and somewhat novel: (a) two forecasters who observe the same data stream but whose priors come from different sources, one derived from a physical model and one from a symmetry argument; and (b) two machine-learning systems trained on different corpora whose disagreement persists after each is shown the other's outputs and reasoning.

  Finally, tell me which parts of my friend's and my argument, if any, were merely verbal, and which reading of the common prior each of us was actually relying on.
reasoning: |-
  We are two camps engaged in an adversarial collaboration to clarify the disagreement about the role of common priors in rationality. We agree on the following formal and conceptual points, but we disagree on the interpretation and implications of these points.

  ## 1. Agreed Claims

  1.1. **Formalism of the Agreement Result**: 
     - The "no agreeing to disagree" theorem (Aumann 1976) establishes that if two agents have a common prior, and if they have common knowledge of each other's posterior probabilities for an event, then these posterior probabilities must be equal. 
     - The theorem assumes:
       - A common prior (a shared probability distribution over the state space before any private information is received).
       - Common knowledge of each agent's information partition (which defines what each agent knows at each state).
       - Common knowledge of the agents' posterior probabilities (each knows the other's posterior, each knows that the other knows, and so on ad infinitum).
     - The theorem does not assume that the agents have the same information; they may have different private information.

  1.2. **Distinction Between Normative and Descriptive Readings**:
     - Both camps agree that the common prior assumption (CPA) is a formal assumption in the theorem and that the theorem is a mathematical truth given that assumption.
     - However, the first camp (let's call them the **Common Prior Rationalists** or CPR) holds that the CPA is a normative requirement of rationality. That is, rational agents must share a prior. 
     - The second camp (the **Prior Pluralists** or PP) holds that the CPA is an empirical hypothesis that may or may not hold in practice, and that rationality does not require a shared prior because priors reflect background theoretical commitments that are not determined by rationality alone.

  1.3. **What Counts as Evidence or Argument**:
     - Both camps agree that empirical cases of persistent disagreement among experts (e.g., in science, philosophy, or forecasting) are relevant to the debate. 
     - Both camps also agree that formal arguments about the foundations of probability (e.g., the Dutch book argument, Cox's theorem, and the principle of indifference) are relevant.
     - CPR will look for cases where disagreement resolves upon full exchange of information and reasoning, and will interpret such cases as evidence that the agents were operating under a common prior. PP will interpret the same cases as showing that the agents were able to update to a shared posterior without having started from a shared prior.
     - PP will point to cases of persistent disagreement even after extensive exchange of information and reasoning as evidence against the CPA as a universal requirement of rationality. CPR will interpret such cases as evidence of irrationality (e.g., biased updating) or hidden differences in information.

  ## 2. Genuine Disagreements

  2.1. **Common Prior Rationalists (CPR)**:
     - "Rationality requires that agents share a common prior probability distribution over the state of the world. This prior is not a matter of choice but is fixed by the structure of rationality itself. Any two rational agents with the same background knowledge must start from the same prior. Therefore, persistent disagreement between rational agents who have common knowledge of each other's opinions must be due to differences in their private information. If disagreement persists after all information is shared, then at least one agent must be irrational."

  2.2. **Prior Pluralists (PP)**:
     - "Rationality does not require a common prior. Priors are a choice of inductive framework, reflecting background theoretical commitments, models, or biases that are not determined by evidence or by formal coherence constraints alone. Two rational agents can have different priors without either being irrational, even if they have the same background knowledge. Therefore, persistent disagreement after full exchange of information and reasoning can be rational and need not imply that either agent is misinformed or incoherent."

  ## 3. Cruxes and How to Settle Them

  We identify the following cruxes. For each, we state the question, the evidence or arguments both sides agree are relevant, and each camp's prediction.

  ### Crux 1: Is the common prior a coherence constraint or an empirical hypothesis?

  - **Relevant Arguments/Evidence**: 
    - The Dutch book argument for probabilism shows that violating probability axioms makes one vulnerable to sure losses. CPR argues that the CPA is similarly a coherence constraint, because without it, agents may engage in speculative trade (they would bet against each other even if they share common knowledge of their beliefs). PP counters that the Dutch book argument does not extend to the CPA: two agents with different priors can avoid Dutch books individually even if they bet with each other, as long as each is internally coherent. 
    - The no-speculative-trade result: If two agents have common priors and common knowledge of rationality, they will not trade (Milgrom and Stokey 1982). CPR takes this as evidence that rationality requires a common prior. PP takes it as a redescription of the CPA: it shows what happens if you assume a common prior, not that you must have one.

  - **Predictions**:
    - CPR: Rational agents who are common-knowledge rational will never engage in speculative trade. Any observed speculative trade must be due to irrationality or hidden information.
    - PP: Rational agents with different priors may engage in trades that are mutually beneficial ex ante (from their own perspectives) and therefore need not be irrational.

  ### Crux 2: Can rationality be characterized without reference to a shared prior?

  - **Relevant Arguments/Evidence**:
    - Formal approaches to rational choice: Bayesian decision theory (with a prior) vs. alternative frameworks (e.g., imprecise probability, set of priors).
    - Case (a): Two forecasters with different prior sources. 
      - **Setup**: Two rational forecasters, Alice and Bob, observe the same data stream. Alice uses a prior derived from a physical model (e.g., a climate model). Bob uses a prior derived from symmetry arguments (e.g., maximum entropy). They share all data and their reasoning. 
      - **Question**: Can they rationally maintain divergent probability assessments after seeing all the same data and reasoning steps?
      - **CPR Prediction**: If they are rational and have common knowledge of their rationality and all data, their posteriors must converge. If they do not converge, at least one is irrational (e.g., not updating correctly).
      - **PP Prediction**: They can rationally maintain divergent posteriors because their priors are based on different justifiable frameworks. The divergence may persist even after sharing all information and reasoning.

  - **Evidence from Case (a)**:
    - We agree to run a thought experiment or a simulation with specific models. For example, let the data be a sequence of coin flips. Alice's prior is based on a physical model of the coin (e.g., it is biased towards heads with unknown bias). Bob's prior is based on symmetry (uniform over bias). After seeing 10 heads and 5 tails, Alice's posterior might be centered at 2/3 while Bob's at 10/15=2/3? Wait, but they might converge. So we need a case where the priors lead to different posteriors even with the same data. 
    - Alternatively, consider a non-stationary process. Alice's model allows for drift; Bob's does not. After seeing a trend, Alice may assign high probability to continued drift, Bob to reversion. They share the same data and models. 
    - We agree that if in such a setup, both agents are updating by Bayes' rule and their priors are consistent with their own models, then PP says divergence is rational, CPR says it is not.

  ### Crux 3: Can a non-arbitrary prior be singled out?

  - **Relevant Arguments/Evidence**:
    - The principle of indifference: It can lead to contradictions (e.g., Bertrand's paradox). 
    - Objective Bayesianism: Attempts to define a unique prior by maximizing entropy or using other rules. 
    - Case (b): Two machine-learning systems with different training corpora.
      - **Setup**: Two AI systems, A and B, are trained on different corpora (A on scientific literature, B on news articles). They are both asked to predict the outcome of a future event (e.g., the probability of a recession next year). They are then shown each other's training data, model architectures, and reasoning steps. 
      - **Question**: Do their predictions converge after this exchange?
      - **CPR Prediction**: If they are rational (update by Bayes) and have a common prior (which they should if rational), then after sharing all information (including the training data) and reasoning, their predictions must converge. If they do not, at least one is not rational (e.g., not incorporating the new data correctly).
      - **PP Prediction**: They may not converge because their initial priors (shaped by their training) are different and rationality does not require them to change their prior upon seeing the other's prior. They may update by incorporating the new data (the other's training data) but their posteriors may still diverge because they start from different priors.

  - **Evidence from Case (b)**:
    - We agree to look at experiments with AI systems. For example, train two language models on different corpora, then have them predict an event and share their training data and reasoning. Do they converge? 
    - CPR predicts convergence if the systems are rational and the exchange gives them common knowledge of the shared information. 
    - PP predicts non-convergence because the systems have different initial inductive biases (priors) that are not overridden by the new information.

  ## 4. Analysis of the Original Argument

  You and your friend were arguing about whether your persistent disagreement was rational. 

  - **Verbal Disagreements**: 
    - You were using "rational" in two different ways. Your friend (CPR) meant: having a common prior and updating correctly. You (PP) meant: updating correctly (by Bayes) and having a prior that is justifiable within one's own framework. 
    - You were also equivocating on "information": Your friend included the prior as part of the background information that must be shared for rational agreement. You treated the prior as separate from the evidence (the information).

  - **Which Reading of the Common Prior**:
    - Your friend (CPR) was relying on the normative reading: the common prior is a requirement of rationality. 
    - You (PP) were relying on the view that the prior is a choice of model, not fixed by rationality.

  This document represents our adversarial collaboration. We will use the cases (a) and (b) to test our predictions and refine our positions.

  Signed,
  Common Prior Rationalists (CPR) and Prior Pluralists (PP)
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Common Prior Assumption

  **Preamble**  
  We, the Common Prior Rationalists (CPR) and Prior Pluralists (PP), acknowledge that our disagreement stems from distinct interpretations of rationality in Bayesian frameworks. We agree on the mathematical foundations but diverge on their philosophical implications. Below, we outline points of agreement, clarify our disagreements, identify cruxes, and propose empirical tests. Our goal is to resolve whether rationality requires a shared prior or permits divergent priors under full transparency.

  ---

  ### 1. Agreed Claims  
  Both camps accept these formal and conceptual points:

  #### 1.1. **Formalism of Aumann’s Agreement Theorem**  
  - **Assumptions**:  
    - A shared prior probability distribution over a state space.  
    - Common knowledge of partitions (agents know each other’s information structures).  
    - Common knowledge of posteriors (agents know each other’s updated beliefs).  
  - **Implications**:  
    - Given these, agents *cannot* "agree to disagree" on posteriors. Divergence implies violations of assumptions (e.g., hidden information or irrationality).  
    - **Non-assumptions**:  
      - Identical computational resources.  
      - Identical background theories or inductive biases.  
      - That priors must be objectively justified (e.g., by symmetry).  

  #### 1.2. **Normative vs. Descriptive Distinctions**  
  - **Normative reading** (CPR emphasis): Rationality *requires* a common prior as a coherence constraint. Disagreement under full transparency reveals irrationality.  
  - **Descriptive reading** (PP emphasis): Humans/machines *in fact* hold divergent priors due to differing model choices, but this need not violate rationality.  
  - **Shared view**: The theorem is mathematically sound but does not settle whether priors are normative or empirical.  

  #### 1.3. **Evidence and Arguments**  
  - **Relevant evidence**:  
    - Cases where disagreement resolves after sharing information (supports CPR).  
    - Cases where disagreement persists despite shared evidence and reasoning (supports PP).  
  - **Irrelevant arguments**:  
    - Claims that rationality demands identical beliefs *without* common knowledge of posteriors.  
    - Appeals to psychological biases (e.g., confirmation bias) as the *sole* explanation for disagreement.  

  ---

  ### 2. Genuine Disagreements  
  Each camp’s position, stated in its own terms:  

  #### 2.1. **Common Prior Rationalists (CPR)**  
  > "Rationality constitutively requires a common prior. If two agents share common knowledge of each other’s rationality and posteriors, persistent disagreement implies one is irrational or misinformed. Priors are not ‘chosen’—they are fixed by logical coherence, evidence, and shared background knowledge. Divergent priors reflect epistemic failures, not legitimate diversity."  

  #### 2.2. **Prior Pluralists (PP)**  
  > "Priors are choices of inductive frameworks (e.g., model assumptions, hypothesis spaces) that are underdetermined by evidence and coherence constraints. Rational agents can persistently disagree under full transparency because rationality permits divergent, non-arbitrary priors. A common prior is an empirical accident, not a norm."  

  ---

  ### 3. Cruxes  
  Settling these sub-questions would resolve at least one camp’s position. For each, we state:  
  - **The question**  
  - **Shared case/evidence**  
  - **Predictions**  

  #### Crux 1: *Is the common prior a coherence constraint or an empirical hypothesis?*  
  - **Question**: Does avoiding Dutch books (sure losses in betting) require a common prior?  
  - **Shared argument**:  
    - **CPR**: No speculative trade is possible if agents share a prior and know each other to be rational. Observed trading implies prior divergence, hence irrationality.  
    - **PP**: Dutch books penalize incoherent *updating*, not prior divergence. Trade can arise from non-speculative differences in risk tolerance or values.  
  - **Evidence**: Experiments where agents bet after sharing all information.  
    - **CPR predicts**: Traders with common knowledge of rationality never bet against each other.  
    - **PP predicts**: Betting occurs if priors diverge, even under common knowledge.  

  #### Crux 2: *Can rationality be defined without a shared prior?*  
  - **Question**: Do formal accounts of rationality (e.g., Bayesian coherence) depend on presupposing a common prior?  
  - **Shared argument**:  
    - **CPR**: Rationality is synonymous with compliance with axioms that imply a unique prior (e.g., via Savage’s theorem).  
    - **PP**: Cox’s theorem and Dutch book arguments justify probabilism but not a *specific* prior; they allow multiple rational starting points.  
  - **Evidence**: Agents updating from different priors but identical data.  
    - **CPR predicts**: Posteriors converge if agents are rational.  
    - **PP predicts**: Posteriors may remain divergent indefinitely.  

  #### Crux 3: *Can non-arbitrary priors be singled out?*  
  - **Question**: Do objective rules (e.g., simplicity, symmetry) uniquely determine priors?  
  - **Case (a): Forecasters with different prior sources**  
    - **Setup**: Two rational forecasters observe the same climate data stream.  
      - *Forecaster A*: Prior from a physical model (e.g., fluid dynamics equations).  
      - *Forecaster B*: Prior from symmetry (e.g., maximum entropy principle).  
      Both share data, models, and reasoning.  
    - **Question**: Do their posteriors converge after 1,000 data points?  
    - **CPR predicts**: Yes; rationality forces alignment.  
    - **PP predicts**: No; physical models and symmetry yield irreconcilable priors.  

  #### Crux 4: *Does machine learning expose prior-dependence under transparency?*  
  - **Case (b): ML systems with divergent training corpora**  
    - **Setup**:  
      - *System A*: Trained on scientific corpus (e.g., physics journals).  
      - *System B*: Trained on cultural corpus (e.g., social media).  
      Both predict the same event (e.g., AI risk), share architectures, weights, and reasoning traces.  
    - **Question**: After cross-examining each other’s outputs, does disagreement persist?  
    - **CPR predicts**: No; common knowledge of reasoning forces consensus.  
    - **PP predicts**: Yes; corpora embed incommensurable inductive biases.  

  ---

  ### 4. Analysis of Your Argument  
  - **Verbal disagreements**:  
    - **"Rational"**: You (PP) used it to mean *internal coherence of updates*; your friend (CPR) meant *global coherence including priors*.  
    - **"Prior"**: CPR treated it as a *logical primitive*; PP as an *empirical input*.  
  - **Substantive disagreements**:  
    - CPR implicitly relied on the **normative reading**: Priors are fixed by rationality axioms.  
    - PP implicitly relied on the **underdetermination thesis**: Evidence alone cannot select priors.  
  - **Resolution path**: Focus testing Cruxes 3a and 4b. If forecasters/ML systems converge under transparency, CPR gains ground; if not, PP does.  

  ---  
  **Signed**,  
  *Common Prior Rationalists* & *Prior Pluralists*  

  This document isolates core disagreements and provides a roadmap for empirical progress. We commit to revising our positions based on outcomes of the proposed cases.
