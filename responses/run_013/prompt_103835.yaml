  For the wrap-up, I shouldn't pretend there's resolution. The user wants to see the messiness. Their "restore vs. add" idea might handle muscle drugs but crumbles with risk factors or shifting baselines. Best to leave them with the tension: medicine's purpose vs. welfare maximization, both haunted by justice concerns.

