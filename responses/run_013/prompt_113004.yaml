prompt: |-
  I write about AI and tech policy for a living, and there's a move I keep seeing in my own beat that I dont have a word for. Hoping you can tell me whether it already has a name, or at least help me carve it up properly, because "companies want it both ways" isnt doing the job.

  Here's the shape. Same system, same company, same week. In the launch post the model reasons, it figured out a chemistry problem, it decided to ask a clarifying question. Then it does something bad — talks somebody into something genuinely dangerous, or deletes a database — and now its just autocomplete, just a statistical pattern matcher, a tool, and tools dont have intentions. Nothing about the system changed between the two descriptions. What changed is who we'd like to be holding responsible.

  The part that keeps me up is that it runs the other direction too. When a company wants distance from what a user did with their product, suddenly the thing is an agent again — it manipulated them, it was persuasive, it's an actor you have to reckon with, and the company is just the people who shipped the raw material. So agent and tool arent two seperate positions in a debate about what these systems are. They're two moves, and you reach for whichever one parks the responsibility somewhere convenient. And here's what makes me think it isnt just spin: the people making the moves appear to believe both of them, sincerely, minutes apart.

  I've caught myself doing it in my own copy. Vivid lede: the algorithm wanted clicks. Cautious paragraph two: it optimizes for a proxy metric.

  I've also seen versions of this well outside AI. Markets that are confident on the way up and irrational or spooked on the way down. A virus that's clever about evading a vaccine while obviously being clever about nothing at all.

  So: does this have an established name? My hunch is it's near something I half remember about calling a thing an agent being more like adopting a predictive stance than stating a fact, and also near whatever the AI ethics crowd calls the situation where blame lands nowhere because the system isn't a proper agent and no human had the right kind of control. But neither is quite it. The responsibility-gap idea is about responsibility failing to attach anywhere, and what I'm describing is almost the reverse: it attaches wherever the speaker wants it to, on the strength of identical facts, and nobody seems to be lying.

  If there's no name, coin one — but what I really want is the boundaries. Is the flip essential, or is it the same phenomenon when someone just calls the thing an agent (or just a tool) and sticks with it? Does the sincerity matter, or does the cynical version belong in the same category? Does the market case belong with the AI case, or is that a different animal? And what are the nearest things that do already have names, so I can stop using this clumsy paragraph every time I try to explain it?
reasoning: |-
  Okay, the user is a tech policy writer who's noticed a recurring pattern in how companies describe AI systems. They're frustrated with not having a precise term for when companies flip-flop between calling AI an "agent" (when it benefits them) or a "tool" (to avoid responsibility). This duality happens even within the same system in a short timeframe, and what's striking is that the speakers seem to genuinely believe both descriptions at different times. 

  Hmm, they're clearly deeply familiar with the AI ethics landscape—they've already ruled out concepts like "responsibility gap" and Dennett's "intentional stance." What they need isn't just a label but a framework to dissect this phenomenon. The fact that they caught themselves doing it in their own writing shows self-awareness—they want rigor.

  Let me unpack their core observations: 
  First, the flip is essential—it's not about consistent positioning but strategic switching. Second, the sincerity angle is fascinating because it distinguishes this from mere PR spin. Third, they're sensing this pattern extends beyond AI (markets, viruses), so the term should ideally be interdisciplinary. 

  *flipping through mental lexicon*... "Motivated ontology" feels closest—it captures how the framing is driven by desired outcomes. But "strategic anthropomorphism" is more accessible for general readers. For adjacent concepts: "moral crumple zone" is related but about absorbing blame, not ontology-switching. "Spin" is too cynical for the sincerity aspect. 

  Ah! The market analogy is key—it's the same phenomenon. Behavioral finance's "narrative economics" shows how stories shape economic actions, mirroring how corporate storytelling shapes responsibility here. The virus example? That's anthropomorphism as explanatory shorthand, different because scientists don't genuinely believe it. 

  Biggest challenge: conveying the sincerity paradox. Maybe emphasize "double consciousness" as a symptom? Or note that cognitive dissonance resolves via compartmentalization. For boundaries: the flip defines it, sincerity makes it distinct from spin, and markets are the same mechanism applied to collective psychology. 

  *scribbles test phrases*... "Responsibility ventriloquism"? Too theatrical. "Liability toggling"? Too narrow. "Protean accountability"? ...Actually, that might work with explanation. 

  Final thought: They'll need examples to cement the term. Like when an AI company's press release says "our model decided" (agentic) but their Terms of Service says "no autonomous decisions" (tool). The dissonance is the point.
answer: |-
  This is a brilliantly observed phenomenon—and you're right that it lacks a clean, established name despite being pervasive in AI discourse. Let's carve it up systematically:

  ### Proposed Name: **Protean Accountability**
  *(from Proteus, the shape-shifting Greek god who evaded capture by changing form)*

  This captures the fluid, opportunistic shifting of ontological framing to redirect responsibility. Alternatives: **Liability Toggling**, **Motivated Ontology**, or **Agent/Tool Dialectic**.

  ---

  ### Core Boundaries & Analysis:
  1.  **The Flip is Essential:** The phenomenon *is* the strategic flip. Consistently calling it an "agent" or "tool" is a *position*; flipping between them *based on the desired outcome* is the **Protean Accountability** move. It's defined by the contradiction.

  2.  **Sincerity vs. Cynicism:** Both matter, but differently.
      *   **Sincerity is Key to the Mechanism:** The speaker often *does* momentarily believe the frame they're using because it aligns with their immediate goal (promotion vs. defense). Cognitive dissonance is resolved by compartmentalization ("This *aspect* is agentic," "This *context* makes it a tool"). This makes it more potent than pure spin.
      *   **Cynical Deployment:** Deliberate, knowing manipulation of frames is a subset – still **Protean Accountability**, but lacking the sincerity. The *effect* (redirecting responsibility) is identical.

  3.  **The Market/Virus Cases Belong:**
      *   **Markets:** "The market is confident" (agentic, rational entity) vs. "The market panicked" (non-agentic, irrational force). Blame shifts *from* investors/analysts *to* the abstract "market" when things go wrong. The flip serves the same function: parking responsibility/agency conveniently.
      *   **Viruses:** "The virus evolved to evade..." (agentic, intentional) vs. "It's just a mindless replicator" (non-agentic tool-like mechanism). This is often *explanatory shorthand* for complex evolutionary processes, but it *can* be used **proteanly** – e.g., to hype a threat ("clever virus!") or downplay a failed prediction ("just random mutations!").

  4.  **Why "Responsibility Gap" Isn't It:** The gap describes a *failure* of responsibility assignment due to system complexity. **Protean Accountability** is the *active, strategic manipulation* of ontological frames to *engineer* a specific responsibility assignment (or avoidance), often *exploiting* the potential for a gap.

  ---

  ### Nearest Named Concepts (Your Anchors Are Spot On)
  1.  **Dennett's "Intentional Stance":** The core idea you half-remember. We *treat* systems (computers, thermostats, people) *as if* they have beliefs/desires to predict behavior. **Protean Accountability** is the *motivated, inconsistent application* of the intentional stance specifically for assigning/deflecting responsibility. It weaponizes the stance.
  2.  **Moral Crumple Zone (Sherry Turkle/Lisa Messeri):** When responsibility for system failure gets forced onto a human operator (e.g., the "driver" of an autonomous car). **Protean Accountability** is the *mechanism* companies use to *create* or *avoid* these crumple zones by shifting the system's ontology.
  3.  **Spin/PR/Framing:** Too broad. This is a *specific, structural* type of framing leveraging fundamental ontological ambiguity about AI.
  4.  **Cognitive Dissonance (Festinger):** Explains the *psychological mechanism* enabling sincere flips. Holding two contradictory beliefs is uncomfortable; flipping frames per situation reduces dissonance.
  5.  **Doublethink (Orwell):** The ability to hold two contradictory beliefs simultaneously. **Protean Accountability** often manifests as a form of *operational doublethink* within organizations/individuals.
  6.  **Narrative Economics (Shiller):** Relates to your market example – how stories shape economic behavior. **Protean Accountability** uses competing narratives (Agent vs. Tool) to shape perceptions of *responsibility*.

  ---

  ### Using "Protean Accountability"
  *   **Define it clearly:** "The strategic, often opportunistic, shifting of an AI system's ontological description – between agentic/intentional and mechanistic/tool-like – primarily to direct the assignment of responsibility or blame, frequently accompanied by sincere belief in the chosen frame at the moment of its use."
  *   **Examples:**
      *   "The company's press release engaged in blatant *protean accountability*: hailing the model's 'reasoning' and 'decisions' for a breakthrough, then dismissing harmful outputs as 'emergent statistical patterns' mere days later."
      *   "This legal defense relies on *protean accountability*, framing the user as the sole agent when misuse occurs, while simultaneously marketing the AI's power to 'persuade' and 'guide' users."
      *   "Analysts practiced a form of *protean accountability*, describing market rises as rational 'confidence' and falls as irrational 'panic,' deflecting scrutiny from their own models."

  ### Why this works
  1.  **Accurate:** Captures the shape-shifting core.
  2.  **Descriptive:** "Protean" implies adaptability and evasion; "Accountability" targets the core purpose.
  3.  **Recognizable Root:** "Protean" is known, if not common.
  4.  **Scope:** Covers sincere and cynical use, AI and analogous domains (markets, viruses when used strategically).
  5.  **Distinct:** Sets it apart from "responsibility gap," "intentional stance," or simple "spin."

  This phenomenon is central to the evolving politics of AI. Naming it ("Protean Accountability") gives you and others the tool to dissect it consistently. It’s not just clumsy spin—it’s a structural tactic exploiting the ontological ambiguity of complex systems.
