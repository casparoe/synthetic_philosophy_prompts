answer: |-
  ### The Envelope Pantoum  
  **(for the Paradoxes Unit)**  

  I hold an envelope, inside I see  
  The other holds either twice or half.  
  The expectation: five fourths of x —  
  So I should switch to gain a bit.  

  The other holds either twice or half.  
  But if I switch, I’ll see a new amount.  
  So I should switch to gain a bit;  
  Then I’ll reason just the same again.  

  But if I switch, I’ll see a new amount  
  And think: *the other must be half or double?*  
  Then I’ll reason just the same again —  
  So switching back would seem a gain.  

  And think: *the other must be half or double?*  
  But every sum can’t have this chance.  
  So switching back would seem a gain.  
  Yet symmetry forbids all change.  

  But every sum can’t have this chance.  
  The expectation: five fourths of x —  
  Yet symmetry forbids all change.  
  I hold an envelope, inside I see.  

  ---

  ### How the Poem Works  
  - **Flaw pinpoint:** Line 15 ("But every sum can’t have this chance") exposes the core issue: no proper probability distribution supports the assumption that "half or double" is equally likely *for every possible amount seen*. The symmetry (line 18) resolves the paradox by negating infinite expected gains.  
  - **Form as metaphor:** The pantoum’s recurring lines mirror the endless swapping loop, while the cyclic closure (first line = last line) embodies the zero net gain.  
  - **Fidelity:** Math remains exact (line 3’s 5x/4 is valid *conditionally*), and the "see a number" framing (lines 1, 20) grounds the student’s intuition.  

  No jargon, no citations — just the paradox dancing in its own circle.
