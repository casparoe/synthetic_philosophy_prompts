prompt: |-
  I'm a third-year PhD student in philosophy and I'm TAing an upper-level seminar on punishment and responsibility this fall — 16 students, mostly seniors, and I get one 90-minute block to run however I want because the prof is traveling. I want to use it to make them feel a specific problem in retributive theory that I don't think they'll have run into before, and I'd rather they hit it with their faces than hear me explain it up front.

  Here's the thing I want them to feel. Retributivism is supposed to be about desert, and desert seems to give you a ranking: everyone can agree some crimes deserve more punishment than others. But the second you ask "more than what, and how much more," desert goes quiet — it gives you the order of the cases but not the units. There's no independent yardstick for how much suffering equals how much wrongdoing, so a pure desert theory can rank cases but can't calibrate them; any actual number you write down has to come from somewhere else. Consequentialism has the opposite problem: it does give you a way to fix the numbers (crank the deterrence/incapacitation lever until expected harm stops going down), but then the numbers it spits out start violating the desert ranking everyone agreed on a minute earlier — the highly deterrable offender gets hammered, the barely-culpable-but-dangerous guy gets warehoused, etc. I want them to build a sentencing grid from scratch and walk straight into both walls.

  So: design me that activity. My rough thought is a mock sentencing commission. They get a deck of maybe 12-14 case cards (crime + aggravating/mitigating facts + a couple of offender facts), and there are phases. First they just rank the cards from least to most deserving — I expect that to be easy and for them to mostly agree. Then they have to assign actual years to each card, and I want the wheels to come off there. Then a third phase where I impose some consequentialist constraint (a prison-capacity budget, a deterrence number, a recidivism figure I hand them) and make them redo the grid under it, so they have to watch their own ranking get violated by numbers they can't argue with. I want the two walls to be something they did to themselves, not something I told them about.

  Give me: materials, the actual case cards or at least the design principle for them, a phase-by-phase timeline with rough minutes, what I say at each transition (as little as possible), and a debrief that maps what just happened onto the concepts — the ranking-vs-calibration thing, why mixed theories tend to use desert as a side constraint rather than as the whole story, and the difference between desert doing limiting work (this is too much) and desert doing positive work (this is exactly what he deserves). Don't let them hear the technical terms until the debrief.

  Also tell me what will predictably go wrong the first time — I'm betting someone tries to dodge by refusing to put numbers on the cards at all, someone else imports real-world sentencing law and derails the room, and at least one person short-circuits the whole thing with a crude equal-harm intuition. How do I handle each without rescuing them too fast?

  And be honest with me about what the activity can't reproduce — I know it can't give them the felt weight of actually imposing a sentence, and I know the real anchor in actual systems comes from history and politics rather than from theory, which I'll have to just tell them at the end.
reasoning: |-
  We are designing a 90-minute seminar activity to help students experience two key problems in retributive theory: 
   1. Desert provides a ranking but not a calibration (how much punishment is deserved).
   2. Consequentialism can provide calibration but may violate the desert ranking.

   The activity has three phases:
   Phase 1: Ranking by desert only (without numbers).
   Phase 2: Assigning actual years of punishment (calibration).
   Phase 3: Reassigning years under a consequentialist constraint (e.g., prison capacity budget) that forces deviations from the desert ranking.

   We want the students to feel the problems, so we avoid technical terms until the debrief.

   Design Principles for Case Cards:
   - We need 12-14 cases that cover a range of crimes and include aggravating/mitigating factors and offender facts.
   - The cases should be designed such that the ranking by desert is relatively uncontroversial, but the assignment of specific years is difficult and arbitrary.
   - We must avoid real-world sentencing references to prevent students from importing existing laws.

   Example cases (we'll create 12, but here are samples):

   1. Shoplifting a $20 item (first offense, teenager, impulsive act).
   2. Shoplifting $500 worth of goods (planned, by an adult with prior minor offenses).
   3. Burglary of an unoccupied home (no one present, stolen goods worth $5,000, offender has drug addiction).
   4. Burglary of an occupied home (homeowner present but asleep, stole $5,000, offender has prior convictions for theft).
   5. Robbery (used a toy gun to threaten a store clerk, took $200, no injuries, offender under financial stress).
   6. Robbery with a real gun (threatened a clerk, took $200, clerk traumatized, offender has prior violent offense).
   7. Assault (bar fight, one punch, victim suffered broken nose, offender was provoked).
   8. Aggravated assault (premeditated attack with a weapon, victim seriously injured, offender has history of violence).
   9. Vehicular homicide (DUI, first offense, remorseful, victim was a child).
   10. Intentional homicide (crime of passion, discovered spouse cheating, no prior history, confessed immediately).
   11. Premeditated murder (for hire, planned, victim was a witness in a trial).
   12. Sexual assault (date rape, offender claimed consent, victim suffered severe psychological harm, no prior record).
   13. White-collar crime (embezzled $1 million from employer, caused company bankruptcy and job losses, offender lived lavishly).
   14. Drug trafficking (large scale, first offense, claims they were coerced by a gang).

   We want to include a mix of factors that might affect desert: intent, harm, culpability, prior record, remorse, etc.

   Phase-by-Phase Timeline (90 minutes total):

   Phase 1: Ranking (15 minutes)
   - Instructions: "Arrange these case cards from least to most deserving of punishment. Focus only on the idea of desert: who deserves more punishment and who deserves less? Don't assign any numbers yet. You have 10 minutes to arrange the cards. Then we'll discuss briefly for 5 minutes to see if there's broad agreement."
   - Materials: Hand out the deck of 12-14 case cards to groups of 4 students (so 4 groups for 16 students). Each group gets a set. Alternatively, if time is tight, do it as a whole class with one set and a whiteboard to arrange.
   - Expected outcome: Groups will mostly agree on the ranking, with perhaps minor disagreements at the margins.

   Phase 2: Assigning Years (25 minutes)
   - Instructions: "Now assign a specific number of years in prison to each case. Write it on the card. The total prison time across all cases must be exactly 100 years. You have 15 minutes to assign the years. Then we'll have a 10-minute discussion: How did you decide the numbers? Was it easy? What disagreements arose?"
   - Why a total of 100 years? It forces them to make trade-offs and not just assign arbitrary numbers without constraint. It also sets up the next phase.
   - Expected outcome: Disagreement and frustration. They will struggle to assign numbers and may try to avoid it. They might assign equal increments or try to use harm as a proxy, but that will be imperfect.

   Phase 3: Consequentialist Constraint (25 minutes)
   - Instructions: "Now I'm giving you a new constraint: the state has a prison capacity crisis. You must reduce the total prison time to 50 years (half of what you had). However, you must also achieve a 30% reduction in crime through deterrence. We know that the deterrence effect is stronger for crimes that are more 'calculating' (like white-collar crimes) and less strong for impulsive crimes. Also, we have a recidivism prediction: offenders with prior records are 50% more likely to reoffend. You must reassign the years to meet the 50-year total and try to maximize deterrence and incapacitation. You have 15 minutes. Then we'll discuss for 10 minutes: How did this change your assignments? What happened to your ranking by desert?"
   - We can provide a simple formula or rule of thumb for deterrence: 
        Deterrence impact = (years assigned) * (deterrability factor)
     where deterrability factor is given for each case (we add this now as new info). For example:
        - High deterrability: white-collar crimes, planned crimes (factor = 1.5)
        - Medium: most crimes (factor = 1.0)
        - Low: impulsive crimes, crimes under duress, addiction-driven (factor = 0.5)

     But note: we don't want to make it too complicated. Alternatively, we can just tell them that to achieve the 30% reduction, they must assign more years to high-deterrability crimes and also consider incapacitation (locking up high-recidivism offenders longer). We can provide a recidivism risk for each case (e.g., high, medium, low) as a new fact on the card.

   - Materials: We hand out new information for each case (deterrability and recidivism risk) and the constraint sheet.

   Phase 4: Debrief (25 minutes)
   - We map the experience to the concepts:
     a. In Phase 1, they had a ranking by desert. That was relatively easy and uncontroversial. But when they had to assign numbers (Phase 2), they found that desert alone doesn't tell them how much punishment. This is the calibration problem.
     b. In Phase 3, they had to meet consequentialist goals (deterrence and incapacitation) and a budget constraint. This forced them to deviate from the desert ranking. For example, they might have given more years to a white-collar criminal (high deterrability) than to a violent offender who they previously ranked as more deserving. This shows the conflict between desert and consequentialism.

   - Introduce the terms now: 
        - Desert as a ranking (ordinal) vs. calibration (cardinal) problem.
        - Consequentialism (utilitarian goals: deterrence, incapacitation) vs. retributivism.
        - Mixed theories: often use desert as a side constraint (setting minimums and maximums) and then use consequentialism to set the exact sentence within that range.

   - Also discuss the two roles of desert:
        - Limiting: "this punishment is too much" (even if it deters, we don't torture for shoplifting).
        - Positive: "this is exactly what he deserves" (which we found we couldn't determine).

   - What the activity can't do: 
        - It abstracts from the real-world complexities (politics, history, racial biases, etc.).
        - They aren't actually imposing sentences, so the moral weight is missing.

   Handling Predictable Problems:

   1. Someone refuses to assign numbers in Phase 2:
      - Encourage: "Try to put down some numbers even if they feel arbitrary. The goal is to see what happens when we try to move from ranking to specific amounts."
      - If they still resist, ask the group: "How are we going to make progress? We have to assign numbers to see what happens next." Don't let them off the hook.

   2. Someone imports real-world sentencing:
      - Gently push back: "We are creating a system from scratch. Let's try to forget what we know about the real world and focus on the principles we're exploring."

   3. Someone uses a crude equal-harm intuition (e.g., 1 year per $10,000 stolen):
      - Let them try, but then in the discussion, point out: "Does that account for intent? Prior record? What about a case of stealing bread to feed a family? Does that deserve the same as a greedy theft? How do we convert harm to years? And what about non-monetary harm (like assault)?" This will show the limitations of such a rule.

   4. In Phase 3, someone might resist violating the desert ranking:
      - Remind them of the constraints: "We have to meet the 50-year total and the deterrence goal. How would you do it without changing the ranking? Is it possible?" They will see it's not.

   Materials:

   - Case cards (12-14, each with a description of the crime and offender).
   - Phase 2: A total constraint of 100 years.
   - Phase 3: A new handout for each case with deterrability (high, medium, low) and recidivism risk (high, medium, low). Also, a sheet with the constraints (50 years total, 30% crime reduction via deterrence, and the need to incapacitate high-recidivism offenders).

   Timeline Recap:

   0-5 min: Introduction to the activity (without theory, just the setup: we are a sentencing commission).
   5-20 min: Phase 1 (ranking) and brief discussion.
   20-45 min: Phase 2 (assigning years) and discussion.
   45-70 min: Phase 3 (reassigning under constraints) and discussion.
   70-90 min: Debrief (connect to theory, introduce terms, discuss limitations).

   Let's create 12 case cards for concreteness (we can adjust). We'll design them to have a clear desert ranking but difficult calibration.

   Case Card Template:

   Card 1: 
     Crime: Shoplifting
     Details: 19-year-old first-time offender, stole a $20 video game on impulse. Expressed remorse. Works part-time and is a student.
     Aggravating/Mitigating: None / First offense, impulsive, remorse.

   Card 2:
     Crime: Shoplifting (aggravated)
     Details: 35-year-old, stole $500 worth of designer clothes. Planned the theft (brought a bag). Has two prior shoplifting convictions (both misdemeanors). No remorse.
     Aggravating: Prior record, planned.

   Card 3:
     Crime: Burglary (unoccupied)
     Details: Broke into a home during the day when no one was home. Stole $5,000 worth of electronics. Offender is 30, has a drug addiction, claims they needed money for drugs. Two prior non-violent offenses (theft).
     Aggravating: Prior record. Mitigating: Addiction, non-violent.

   Card 4:
     Crime: Burglary (occupied)
     Details: Broke into a home at night, homeowner was asleep. Stole $5,000 in cash and jewelry. Offender has prior convictions for burglary. Homeowner discovered the burglary the next morning and was traumatized.
     Aggravating: Prior record, occupied home, trauma.

   Card 5:
     Crime: Robbery (toy gun)
     Details: Used a toy gun to threaten a store clerk and took $200. Offender is 22, lost job and was facing eviction. Clerk was frightened but not physically injured. Offender has one prior conviction for theft (non-violent).
     Aggravating: Use of a weapon (though fake), prior record. Mitigating: Financial stress, no injury.

   Card 6:
     Crime: Robbery (real gun)
     Details: Used a real gun to threaten a clerk, took $200. Clerk is now suffering from PTSD. Offender has a prior conviction for armed robbery. Gun was loaded but not fired.
     Aggravating: Real weapon, prior violent record, severe harm (PTSD).

   Card 7:
     Crime: Assault
     Details: Bar fight. Offender punched another patron once after being insulted. Victim suffered a broken nose. Offender has no prior record and expressed regret. Victim provoked.
     Mitigating: Provocation, no prior record, remorse.

   Card 8:
     Crime: Aggravated Assault
     Details: Premeditated attack: waited outside victim's workplace and attacked with a baseball bat. Victim suffered multiple fractures and permanent injury. Offender has a history of violence (two prior assault convictions). Motive: revenge for a personal dispute.
     Aggravating: Premeditation, prior record, severe harm.

   Card 9:
     Crime: Vehicular Homicide
     Details: DUI accident. Offender (with no prior record) was driving drunk and hit and killed a child. BAC was 0.15. Offender is remorseful and has sought treatment.
     Aggravating: High BAC, death of a child. Mitigating: Remorse, no prior record.

   Card 10:
     Crime: Murder (crime of passion)
     Details: Came home to find spouse in bed with another person. In a rage, grabbed a kitchen knife and killed the spouse. Confessed immediately. No prior record. Expressed deep remorse.
     Aggravating: Intentional killing. Mitigating: Provocation, no prior record, remorse.

   Card 11:
     Crime: Murder (premeditated, for hire)
     Details: Hired by a criminal organization to kill a witness. Planned the murder for weeks. Victim was shot. Offender has prior convictions for assault. Showed no remorse.
     Aggravating: Premeditation, for profit, prior record, no remorse.

   Card 12:
     Crime: Sexual Assault
     Details: Date rape. Offender and victim knew each other. Offender claims consent was given, but evidence shows victim was incapacitated. Victim suffered severe psychological harm. Offender has no prior record.
     Aggravating: Severe harm to victim. Mitigating: No prior record.

   For Phase 3, we add:

     Deterrability:
       - High: Card 2 (shoplifting aggravated), Card 4 (burglary occupied), Card 6 (robbery real gun), Card 8 (aggravated assault), Card 11 (murder for hire), Card 12 (sexual assault? - note: complex, but let's say medium), Card 13 (white-collar) -> but we don't have 13? We have 12 cards.

     We'll assign deterrability arbitrarily for the exercise:

       Card 1: Low (impulsive)
       Card 2: High (planned)
       Card 3: Low (addiction-driven)
       Card 4: Medium
       Card 5: Medium (some planning but under stress)
       Card 6: High (planned, uses weapon)
       Card 7: Low (impulsive, provoked)
       Card 8: High (premeditated)
       Card 9: Medium (DUI might be somewhat deterrable by harsh penalties)
       Card 10: Low (crime of passion, impulsive)
       Card 11: High (premeditated, for hire)
       Card 12: Medium (could be planned or impulsive? We'll say medium)

     Recidivism risk (based on prior record and offense type):

       Card 1: Low
       Card 2: Medium (prior record, but non-violent)
       Card 3: High (prior record, addiction)
       Card 4: High (prior burglary)
       Card 5: Medium (prior non-violent)
       Card 6: High (prior violent)
       Card 7: Low
       Card 8: High (prior violent)
       Card 9: Low
       Card 10: Low
       Card 11: High (prior violent)
       Card 12: Medium (no prior, but offense severity)

     But note: we don't want to overcomplicate. We can just assign H/M/L for deterrability and recidivism and give that to the students.

   Phase 3 Constraint Handout:

     "State of Emergency: Prison capacity must be reduced by 50% immediately. Therefore, the total sentence years for these 12 cases must be reduced from 100 to 50.

     Additionally, the state requires a 30% reduction in overall crime rates. Research shows that increasing sentences for highly deterrable crimes has a greater impact on crime reduction. Deterrability factors:

        High: 1.5x impact per year added
        Medium: 1x
        Low: 0.5x

     To achieve a 30% reduction in crime, the total deterrence impact (sum of [sentence years] * [deterrability factor]) must be at least 30% of the baseline. The baseline deterrence impact is the total from Phase 2 (if they had assigned Y_i years and we had factors, but we didn't). Instead, we can set a target: 

        Target deterrence impact = 0.3 * (some baseline we set arbitrarily). 

     Alternatively, to avoid confusion, we can reframe: 

        'You must maximize the total deterrence impact (sum of years * deterrability factor) subject to the 50-year total, and also try to minimize future crimes by incapacitating high-recidivism offenders (so assign longer sentences to high-recidivism cases).'

     But note: we don't want to make it too mathematical. We can say:

        'In reassigning the 50 years, you must:
          - Prioritize giving more years to crimes that are highly deterrable (because that will help reduce crime rates by deterring others).
          - Also, to prevent future crimes, prioritize longer sentences for offenders with high recidivism risk.'

     This is more qualitative and easier for a group discussion.

     We can also note: if they don't meet the deterrence goal, the state will face a crime wave. But we don't have to quantify the 30% exactly. The point is to force trade-offs.

     So the instructions for Phase 3 can be:

        "Due to a prison capacity crisis, you must reduce the total prison time for these 12 cases to 50 years. At the same time, the state is facing a surge in crime and needs to use sentencing to reduce crime. To do so, you should:
           - Assign longer sentences to crimes that are highly deterrable (because increasing punishment for these crimes will have a bigger effect on deterring others).
           - Assign longer sentences to offenders who have a high risk of recidivism (to incapacitate them and prevent future crimes).
        You have 15 minutes to reassign the years."

     Then in the discussion, we can ask if they had to deviate from the desert ranking.

   Debrief Outline:

    1. What happened in Phase 1? (Ranking was easy, we agreed on the order.)
    2. What happened in Phase 2? (Assigning numbers was hard. We had to set a total arbitrarily, and then we had to make trade-offs. We found that desert doesn't tell us how much punishment, only the order.)
    3. What happened in Phase 3? (We had to meet a budget and crime reduction goals. We had to give more punishment to some people who we thought deserved less, and less to some who deserved more, because of deterrence and recidivism.)

    4. Now introduce the concepts:
          - Retributivism: the idea that punishment should be based on desert. We saw it gives a ranking (ordinal) but not a specific amount (cardinal) -> the calibration problem.
          - Consequentialism: punishment is justified by its consequences (deterrence, incapacitation). But when we maximized consequences, we violated the desert ranking.

    5. So what do we do? Mixed theories: 
          - Desert sets boundaries (you can't punish more than the offender deserves, even if it deters; you can't punish less than the minimum they deserve, even if it doesn't deter). 
          - Then within that range, consequentialism sets the exact amount.

    6. Also, note two roles of desert:
          - Negative (limiting): desert tells us when a punishment is too much or too little.
          - Positive: desert tells us the exact amount? (But we saw we couldn't find that exact amount.)

    7. Limitations of the activity:
          - In real life, sentencing is influenced by history, politics, racism, etc.
          - We didn't feel the moral weight of actually imposing a sentence.

    8. Final thought: This is why the theory of punishment is so contested and why we need both retributive and consequentialist considerations.

   Let's hope it works! And be flexible: if one part takes longer, adjust.
answer: |-
  ### **Activity Design: Sentencing Grid Construction**  
  **Total Time:** 90 minutes  
  **Goal:** Force students to confront the *ranking vs. calibration* problem in retributivism and the *conflict with consequentialism* through hands-on sentencing decisions.  

  ---

  ### **Materials**  
  1. **12 Case Cards** (design principles below)  
  2. **Whiteboard/flip chart** for class sentencing grid  
  3. **Markers, sticky notes**  
  4. **Phase 2 Constraint Handout:** *"Total prison budget: 100 years"*  
  5. **Phase 3 Constraint Handout:** *"New constraints: Total prison budget = 50 years. Achieve 30% crime reduction via deterrence/incapacitation (see deterrability/recidivism scores)."*  
  6. **Deterrability/Recidivism Key** (for Phase 3, added to case cards):  
     - ★ = Low deterrability/recidivism risk  
     - ★★ = Medium  
     - ★★★ = High  

  ---

  ### **Case Card Design Principles**  
  Create 12 cases spanning **low to high culpability** with **ambiguous harm metrics** and **mixed aggravators/mitigators**. Ensure:  
  - **Desert ranking is clear**, but **calibration is impossible** (e.g., no real-world sentencing anchors).  
  - **Offender facts** prevent easy harm-based math (e.g., "victim trauma" vs. "stolen $").  
  - **Sample Cases (adapt as needed):**  

  | Card | Crime                     | Aggravators/Mitigators                          | Offender Facts               |  
  |------|---------------------------|------------------------------------------------|------------------------------|  
  | 1    | Shoplifting ($20 item)    | First offense; impulsive act; teen             | Working poor; remorseful     |  
  | 2    | Shoplifting ($500 items)  | Planned; prior petty thefts                    | Gambling addict; no remorse  |  
  | 3    | Burglary (empty home)     | $5k damage; terrified homeowner (no contact)   | Drug debt; coerced           |  
  | 4    | Burglary (occupied home)  | Homeowner traumatized; $500 stolen             | Prior violent record         |  
  | 5    | Assault (bar fight)       | Victim provoked; broken nose                   | PTSD veteran; drunk          |  
  | 6    | Aggravated assault        | Premeditated; victim disabled for life         | Gang member; no remorse      |  
  | 7    | Vehicular homicide (DUI)  | Killed child; high BAC                         | Single mom; remorseful       |  
  | 8    | Manslaughter (crime of passion) | Killed cheating partner; confessed          | No prior record; remorse     |  
  | 9    | Murder (reckless)         | Killed bystander in robbery gone wrong         | Raised in abuse; age 19      |  
  | 10   | Murder (premeditated)     | Killed witness to silence them                 | Career criminal; no remorse  |  
  | 11   | White-collar fraud ($1M)  | Caused 50 job losses; hid assets               | Wealthy; sociopathic traits  |  
  | 12   | Sexual assault            | Date rape; victim attempted suicide            | No prior record; drunk       |  

  ---

  ### **Phase-by-Phase Instructions**  
  **Goal:** Minimalist framing. Let students "hit the wall" themselves.  

  #### **Phase 1: Desert Ranking (15 min)**  
  - **Instructions (2 min):**  
    > *"As a sentencing commission, rank these 12 cases from LEAST to MOST deserving of punishment. Focus ONLY on moral desert. No numbers yet. Reach consensus in your groups."*  
  - **Process:**  
    - Groups of 4 rank cards (10 min).  
    - Class shares rankings (3 min). **Expect:** Quick consensus (e.g., Card 1 least, Card 10 most).  
  - **Transition (1 min):**  
    > *"Now assign prison years. Total sentence budget: 100 years for all 12 cases."*  

  #### **Phase 2: Calibration Crisis (25 min)**  
  - **Instructions (2 min):**  
    > *"Assign specific prison years to each case. Stick to the 100-year total. No other rules."*  
  - **Process:**  
    - Groups assign years (15 min).  
    - Groups post sentences on class grid (8 min). **Ask:** *"How did you decide the years? Where did you disagree?"*  
  - **Predictable Disasters & Responses:**  
    - **"Desert gives no units!":** Students agonize over gaps (e.g., "Is Card 4 worth 2x Card 1 or 10x?"). *Let them flounder.*  
    - **Refusal to assign numbers:** > *"You’re the commission—you must give a number. What’s your best guess?"*  
    - **Real-world imports:** > *"Forget existing laws. If desert alone could decide, what would you write?"*  
    - **Crude harm-math:** > *"Should a $1M fraud get 500x the sentence of a $2k burglary? What about the trauma differences?"*  

  #### **Phase 3: Consequentialist Wrecking Ball (25 min)**  
  - **Instructions (3 min):**  
    > *"New constraints: Prison budget cut to 50 years. You must reduce crime by 30%. Use these:"*  
    - Hand out **deterrability/recidivism scores** (e.g., Card 11 fraud: ★★★ deterrability; Card 6 gang assault: ★★★ recidivism).  
  - **Process:**  
    - Groups re-assign years under constraints (15 min).  
    - Groups post new grid (7 min). **Ask:** *"What changed? Did your desert ranking survive?"*  
  - **Predictable Conflicts:**  
    - Students slash sentences for low-deterrence/high-cost cases (e.g., addict shoplifter) and hike sentences for high-deterrence cases (e.g., white-collar fraud).  
    - **Outrage at violations:** > *"Why does Card 11 now get more years than Card 8? Does that feel just?"*  

  ---

  ### **Debrief (25 min)**  
  **Map the experience to theory—NO JARGON until now.**  

  1. **The Two Walls (10 min):**  
     - **Wall 1: Calibration Problem (Retributivism)**  
       > *"In Phase 2, you all agreed on the ranking (who deserves more/less), but not the units (how much more/less). Desert gives order, not measurement. There’s no 'desertometer' to convert blame to years."*  
     - **Wall 2: Ranking Violation (Consequentialism)**  
       > *"In Phase 3, the crime-reduction goal forced you to prioritize deterrence/incapacitation. But this scrambled your desert ranking. The 'highly deterrable' or 'dangerous' offender got punished more than the 'more deserving' one."*  

  2. **Why Mixed Theories? (5 min):**  
     - > *"Pure retributivism can’t set specific sentences. Pure consequentialism mangles desert. So actual systems often use desert as a side constraint: e.g., 'Don’t punish anyone more than they deserve.' But within that range, consequentialism sets the exact number."*  

  3. **Desert’s Limited Roles (5 min):**  
     - **Limiting Work:** *"Desert says, 'This punishment is too much for this crime' (e.g., life for shoplifting)."*  
     - **Positive Work:** *"Desert can’t say, 'This exact number is deserved.' You felt this when assigning years—it was arbitrary."*  

  4. **What the Activity Can’t Capture (5 min):**  
     - **Felt Weight:** *"You didn’t actually ruin lives today. Real sentencing is heavier."*  
     - **Real-World Anchors:** *"Actual sentencing isn’t driven by theory. It’s shaped by history, politics, and power. Theory just tries to make sense of the mess."*  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Student refuses to assign years in Phase 2.  
    **Fix:** > *"Pick a number—any number—for Card 1. Now, how much more does Card 2 deserve? Double? Triple? Why?"* Force engagement.  
  - **Problem:** Student imports real-world sentencing.  
    **Fix:** > *"Imagine no laws exist. If you were creating society’s rules from scratch, based only on desert, what would you pick?"*  
  - **Problem:** Student uses "equal harm" intuition (e.g., "1 year per $10k stolen").  
    **Fix:** > *"Should a starving person stealing $100 get the same sentence as a billionaire stealing $100 for fun? If not, your rule already failed."*  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* retributivism’s emptiness and consequentialism’s ruthlessness.  
  - **Debrief Connects Dots:** Their frustration is evidence of the theoretical problem.  
  - **No Easy Escapes:** Constraints force engagement with both walls.  

  **Final Tip:** Stay silent during group work. Let the walls hit them. Only intervene to redirect derailments.
