       - Voting in a close race (higher probability of being pivotal) is rational: impact outweighs cost (e.g., school board or 3,000-vote margin).
       - Charity donation is rational: high expected impact per dollar (e.g., bed nets save lives at calculable odds).
       - Extended warranty is irrational: low expected impact (failure rate doesn't justify cost).
       - Safe-state voting for enjoyment is irrational: impact is negligible, so "vice" isn't justified by instrumentalism (enjoyment is a separate, non-instrumental benefit).
       - Free riding in group projects is not irrational (if outcome is guaranteed): instrumental impact of working is near zero, so cost isn't justified. Morality ("not being a leech") is separate.

  2. **Moral Duty Rule (Non-Instrumental)**:
     - **Definition**: An act is rational if it fulfills a moral obligation (e.g., fairness, reciprocity), even with no instrumental impact. Costs/benefits are secondary to duty.
     - **Fits most cases but conflicts with Maya's separation of morality and rationality**:
       - Fits Dev's freeloading-avoidance logic and Maya's group project stance (not being a leech).
       - Conflicts with Maya explicitly calling safe-state voting irrational despite her doing it for enjoyment (she doesn't invoke morality) and her brother skipping a safe vote (which would be immoral under this rule). She treats morality as non-rational.

  3. **Cost-Benefit Rule (Inclusive of Non-Instrumental Benefits)**:
     - **Definition**: An act is rational if total benefits (instrumental + non-instrumental, e.g., enjoyment, moral satisfaction) exceed costs.
     - **Fits most cases but conflicts with Maya's view on safe-state voting**:
       - Fits charity (high instrumental impact), extended warranty (low impact), and close-race voting.
       - Conflicts with Maya calling her own safe-state voting irrational: she gets enjoyment (a non-instrumental benefit) but still labels it a "vice," implying enjoyment doesn't make it rational. She also never cites moral satisfaction in her charity rationale.

  **Conclusion on Rules**:  
  The **Expected Impact Rule** fits all cases perfectly, as Maya consistently ties rationality to *instrumental effectiveness* (e.g., "chance of mattering"). The Moral Duty Rule conflicts with her dismissing morality in rationality (e.g., group projects), and the Cost-Benefit Rule conflicts with her downplaying non-instrumental benefits (e.g., safe-state voting as irrational despite enjoyment).

  ### Prediction for Dev's Case
  - **Dev's situation**: Votes in a safe state solely to avoid freeloading (moral duty), despite hating it (high cost) and knowing his vote won't matter (near-zero instrumental impact).
  - **Expected Impact Rule prediction**: **Not rational**. Instrumental impact is negligible (odds of being pivotal are astronomically low), and costs (time, discomfort) aren't offset. Moral duty doesn't factor into rationality for Maya.
  - **Moral Duty Rule prediction**: **Rational**. Dev's act fulfills a moral obligation (reciprocity in democracy), so duty justifies the cost.
  - **Cost-Benefit Rule prediction**: **Depends on moral satisfaction**. If Dev's moral satisfaction outweighs his discomfort, it's rational; if not, it isn't.
    
  **What Maya Would Say**: **Dev was not rational**.  
  - **Why**: Maya separates instrumental impact (rationality) from moral duties (non-rational). She endorsed free riding as instrumentally rational in group projects but condemned it morally. Similarly, Dev's vote has no instrumental value, so it fails her expected impact test. She’d call his act morally admirable ("not a leech") but not rational—just as she labels her own safe-state voting a "vice."

  ### Case to Split the Rules
  To distinguish between the Expected Impact Rule and other rules, use a scenario where **instrumental impact is zero but non-instrumental benefits are high**:

  - **Scenario**: *Donating to a known scam charity*.  
    - Facts: You donate $200 to a charity that claims to save lives but is verifiably a scam (money is embezzled; zero lives saved). You get significant moral satisfaction (worth $300 to you) from "doing your part." Cost is time/effort equivalent to $10.
    - **Expected Impact Rule**: Not rational. Instrumental impact is zero (no lives saved), so cost isn't justified. Moral satisfaction is irrelevant to rationality.
    - **Moral Duty Rule**: Rational. Fulfilling a perceived duty (giving to charity) is inherently rational, regardless of outcome.
    - **Cost-Benefit Rule**: Rational. Non-instrumental benefit ($300 moral satisfaction) exceeds total cost ($210).

  **How this splits the rules**:  
  - If Maya says donating is **not rational**, she uses the **Expected Impact Rule** (instrumental impact is all that matters).  
  - If she says it **is rational**, she uses either the **Moral Duty Rule** (duty defines rationality) or **Cost-Benefit Rule** (non-instrumental benefits count).  

  Given her prior emphasis on instrumental outcomes (e.g., bed nets' calculable impact) and dismissal of non-instrumental factors (e.g., safe-state voting as irrational despite enjoyment), she would likely say donating to the scam is **not rational**, confirming the Expected Impact Rule.

  ### Summary
  - **Maya's rule**: Rationality requires non-negligible expected instrumental impact. Morality and non-instrumental benefits (enjoyment, moral satisfaction) are separate.  
  - **Dev**: Not rational—instrumental impact near zero, costs high.  
  - **Test case**: Donating to a scam charity. If Maya deems it irrational, she’s using the Expected Impact Rule exclusively.  
  This framework explains her consistency and avoids overinterpreting Dev’s case (where Expected Impact and Moral Duty rules disagree, but her prior judgments resolve the conflict).
