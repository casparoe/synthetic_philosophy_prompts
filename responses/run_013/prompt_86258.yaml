  Now, if Alex follows CDT and chooses B, then after choosing, Alex updates: the probability the consultant predicted B given that Alex chose B is 0.8 (because P(predict B|choose B) = accuracy=0.8). So with 80% probability, there's a match and Alex gets $45k (95-50), and with 20% probability, no match and $95k. The expected utility is 0.8*45 + 0.2*95 = 36+19=55. But CDT's calculation from before (using causal structure) said the EU was 75. This drop (75 to 55) happens because after seeing the choice, the agent updates on evidence that makes the bad outcome (fine) more likely. However, from the ex ante perspective, CDT still maintains that B was the right choice because it was better in all states given the fixed prediction. But after the choice, CDT does not reevaluate the decision; it is used for ex ante decisions. If we force a post-choice evaluation, CDT would not change its mind about the ex ante decision because the causal structure hasn't changed. The choice of B does not cause the prediction, so the fine is not caused by the choice in a way that CDT blames. However, the agent might regret the choice because the actual outcome is likely to be bad.

  But note: after choosing B, the agent has new evidence (they chose B) that evidentially increases the probability that the consultant predicted B, hence the fine. But causally, the choice didn't cause the prediction. So CDT would say: at the time, given the information, B was the best action. The outcome being bad is due to the initial state (the prediction), not the action.

  Now, is there a self-ratifying option? EDT's choice of A is self-ratifying by EDT's own lights. CDT's choice of B is not self-ratifying in terms of ex post evaluation by EDT, but CDT doesn't use ex post evidence that way. In terms of a stable strategy (ratifiable in the sense of being best given that it is chosen), we can see that if the agent is committed to a choice and then reevaluates, for EDT, choosing A is best (60) and choosing B is worse (55). For CDT, after choosing B, the agent might use EDT-like conditioning and see that the EU is 55, while if they had chosen A, it would be 60, so they might regret. But CDT doesn't endorse that conditioning. So from CDT's perspective, the choice is ratifiable in the causal sense: given the fixed state of the world (which includes the prediction), the chosen action was best.

  Now, consider a coin flip: suppose Alex can randomize. Let p be the probability of choosing A. We want a mixed strategy that is self-consistent. For EDT, the EU for a mixed strategy is not well-defined in the same way. Typically, EDT evaluates pure acts. For CDT, the mixed strategy would be evaluated by averaging over the causal EU of each act. But the state is fixed, so the mixed strategy doesn't change the state. The EU of a mixed strategy in CDT is the average of the EU of pure acts. In this case, EU_CDT(A)=70, EU_CDT(B)=75, so CDT would not randomize; it would choose B.

  For EDT, if the agent commits to a mixed strategy, then the probability of being fined might change. But EDT is usually defined for pure acts. We might extend it.

  But in this setup, a mixed strategy doesn't provide a self-consistent equilibrium.

  The case does not dissolve if we ban updating on one's own choice. The decision is made ex ante, and the theories give different recommendations based on their ex ante calculations. The ex post evaluation is not part of the decision theory per se.

  **The bookie** (around 150 words)
  Consider a side bet: before choosing, a bookie offers Alex a bet that pays $15k if the consultant predicted B, and costs nothing otherwise. The bookie sells this bet for $5k.

  - CDT values this bet: CDT's probability for predict B is 40%. So the expected value is 0.4*15 - 5 = 6-5= $1k, which is positive. So CDT says take the bet.
  - EDT conditions on the act. If Alex takes the bet and then chooses B, then P(predict B | choose B)=0.8, so the probability the bet pays is 0.8, yielding 0.8*15 -5 = 12-5= $7k. But if Alex takes the bet and chooses A, then P(predict B | choose A)=0.2, so the bet pays with probability 0.2, yielding 0.2*15-5 = 3-5= -$2k. Since EDT recommends A, and if Alex takes the bet and chooses A, the side bet loses money, so overall EU might be: for job A and bet: job EU (60) plus bet EU (-2) = 58. Without the bet, job EU is 60. So EDT might decline the bet if it expects to choose A.

  But the bookie offers the bet before the choice, and the agent might choose the job after. So the agent must consider the combined strategy. If the agent takes the bet and then chooses B (as CDT would), then overall for EDT: job B gives 55, plus the bet gives 0.8*15 -5 = 7, total 62. But job A without bet is 60, so that's better. However, EDT would not choose B initially. But if the agent is committed to taking the bet and then using EDT for the job, it might choose B. This is messy.

   Alternatively, make the bet unconditional on the job choice. The bet is on the prediction, which is fixed. So EDT, when evaluating the bet, conditions on the act of taking the bet? But the act of taking the bet is not causally related to the prediction. EDT might condition on taking the bet and then see the probability of predict B. But without a specified correlation between taking the bet and the job choice, it's undefined. This is complicated.

  Perhaps a cleaner bet: the bookie offers a bet that pays $10k if the consultant predicted A, for a price of $6k.

  - CDT: P(predict A)=0.6, so EU of bet = 0.6*10 - 6 = 0. Reject.
  - EDT: if Alex is about to choose A, then P(predict A | choose A)=0.8, so EU of bet = 0.8*10 - 6 = 8-6=2, so accept.
  If Alex is about to choose B, then P(predict A | choose B)=0.2, so EU=0.2*10-6=2-6=-4, reject.
  But since EDT recommends A, and if they take the bet and choose A, the EU for the bet is 2, and for the job is 60, total 62. Without the bet, 60. So EDT would take the bet if they are choosing A.

  CDT would not take the bet.

  But the bet is offered before the choice, and the agent can take it and then choose the job. CDT would not take the bet and would choose B, for a total of 75. If they took the bet, then in state predict A (0.6) they get 10-6=4 from the bet, and from the job: if they choose B, they get 95 in state predict A (since no match because they choose B when predict A) so 95+4=99. In state predict B, they get from the bet: -6 (because the bet doesn't pay), and from the job: 45 (because match on B), so 45-6=39. Total EU_CDT for taking bet and then B: 0.6*99 + 0.4*39 = 59.4 + 15.6 = 75. Same as without the bet. So indifferent.

  Not a clear pump.

  Alternatively, we can have a bet that is only on the prediction and is independent of the job choice. Then both theories would value it the same? But that doesn't show a pump.

  Let me skip and go to the next section.

  **What's doing the work** (around 150 words)
  The key feature is the correlation between the prediction and the choice due to a common cause (the professional profile), which EDT interprets as evidence but CDT ignores for causal influence. The agent's choice does not cause the prediction, so CDT conditions only on the prior state, while EDT conditions on the act, which is evidence for the state.

  If we drop the predictor's accuracy to chance (50%), then the conditional probabilities in EDT become 50% for either prediction regardless of the choice. Then EDT would choose A because it has a higher base payoff (100 > 95) and the fine is equally likely: EU_EDT(A) = 0.5*(100-50) + 0.5*100 = 25+50=75; EU_EDT(B)=0.5*(95-50)+0.5*95=22.5+47.5=70. So A is better. CDT, with accuracy 50%, the prior for predict A might be 0.5 (by symmetry), then EU_CDT(A)=0.5*50 +0.5*100=25+50=75; EU_CDT(B)=0.5*95+0.5*45=47.5+22.5=70. So both agree on A.

  If we add a small cost to switching options (say, $1k) for not choosing the job you would naturally choose, then this would break the symmetry. But in our case, the agent is making a decision, so "natural" doesn't apply. The cost might be for choosing against your initial inclination. This might affect the joint distribution, but it's messy.

  **Reply for the defence** (around 150 words)
  The theory that comes out worse might be EDT because it chooses the job with the higher base payoff (A) and ends up with a lower expected utility (60) than what CDT gets (75) in the ex ante causal evaluation. But EDT can defend itself by saying that the agent's choice is evidence of the prediction, and thus of the fine, and given that, A is still better than B. After the choice, EDT's expectation is confirmed: 60 is the best it can do. The $75 that CDT promises is not attainable because it requires the agent to ignore the evidential link. In reality, by choosing B, the agent is more likely to get fined and end up with 45 or 95, but on average, given the evidence, it's worse. EDT denies that the agent can achieve the CDT expected utility because it is not conditionally achievable.

  **My take** (50 words)
  I think the case is a real problem for EDT because it leads to a choice that, from the ex ante causal perspective, is dominated. However, EDT's defenders might argue that the agent cannot causally influence the prediction, so the best they can do is avoid the job that is more likely to be predicted when it's bad to match, but in this setup, A is more likely to be predicted and has a higher base, so it's a trade-off.
answer: |-
  ### The Setup
  Alex faces two job offers: Job A pays $100,000; Job B pays $95,000. Before Alex decides, a hiring consultant (the predictor) has predicted Alex's choice based on public professional data (LinkedIn, résumé), which reflects Alex's stable career tendencies. The consultant has 80% accuracy: if Alex naturally leans toward a job, the prediction matches that 80% of the time. The prediction was sold to a rival company, which fines Alex $50,000 if their choice matches the prediction. The correlation arises because both the prediction and Alex’s natural preference stem from the same data—no mind-reading or causation from choice to prediction. The predictor initially forecasts Job A with 60% probability (since Alex’s profile slightly favors it), and Job B with 40%. Accuracy comes from the data’s reliability: P(predicted A | choose A) = 80%, P(predicted B | choose B) = 80%.

  ### The Two Verdicts
  - **Evidential Decision Theory (EDT)** conditions on the act itself as evidence. Choosing A is evidence (80%) that A was predicted, triggering the fine. Expected utility (EU) for A: 0.8 × ($100k − $50k) + 0.2 × $100k = $60k. For B: 0.8 × ($95k − $50k) + 0.2 × $95k = $55k. EDT recommends A ($60k > $55k).  
  - **Causal Decision Theory (CDT)** holds the prediction fixed and ignores correlations. It weights outcomes by prior state probabilities. EU for A: (0.6 chance prediction was A) × ($50k after fine) + (0.4 chance prediction was B) × ($100k) = $70k. For B: (0.6 chance prediction was A) × ($95k) + (0.4 chance prediction was B) × ($45k after fine) = $75k. CDT recommends B ($75k > $70k).  
  The theories disagree: EDT chooses A, CDT chooses B.

  ### Is the Advice Stable?
  **After following EDT (choose A)**: Alex conditions on choosing A. P(predicted A | choose A) = 80%, so EU remains 0.8 × $50k + 0.2 × $100k = $60k. EDT still endorses A over B ($60k > $55k), so it’s self-ratifying.  
  **After following CDT (choose B)**: Alex conditions on choosing B. P(predicted B | choose B) = 80%, so EU is 0.8 × $45k + 0.2 × $95k = $55k. But CDT doesn’t use this evidence; it holds the causal structure fixed. It still claims the ex-ante choice was optimal given the fixed prediction, so B is self-consistent causally.  
  **Coin flip?** No pure option is self-ratifying for both, but no mixed strategy helps. A 50-50 coin flip yields EU $62.5k for EDT (lower than A’s $60k) and $72.5k for CDT (lower than B’s $75k), so neither endorses mixing.  
  **Banning self-updating**: If Alex can’t update on their choice, EDT’s $60k for A and CDT’s $75k for B stand. The case doesn’t dissolve; the conflict arises from ex-ante reasoning, not observation. Banning updating feels like a dodge—it ignores how evidence influences real decisions.

  ### The Bookie
  A bookie offers a side bet: "Pay $6,000 now to receive $10,000 if the consultant predicted A."  
  - **CDT evaluates causally**: P(predicted A) = 60% prior. EU = 0.6 × $10k − $6k = $0. Rejects (indifferent or loss).  
  - **EDT conditions on acts**: If choosing A, P(predicted A | A) = 80%. EU = 0.8 × $10k − $6k = $2k. Accepts.  
  After accepting, if Alex follows EDT and chooses A, total EU is job ($60k) + bet ($2k) = $62k > EDT’s $60k without bet. CDT rejects the bet and chooses B for $75k, so no clean pump: CDT’s higher job payoff dominates, and the bet doesn’t change its ranking. The bookie highlights EDT’s willingness to "pay for evidence" vs. CDT’s focus on causal independence.

  ### What’s Doing the Work
  The core feature is the **correlation via common cause** (professional data) between prediction and choice. EDT treats the choice as evidence of the prediction, penalizing matches; CDT ignores the correlation, seeking leverage over outcomes.  
  - **(a) Drop accuracy to 50%**: Predictor is random. EDT’s penalty risk becomes 50% for both jobs. EU: A = 0.5 × $50k + 0.5 × $100k = $75k; B = 0.5 × $45k + 0.5 × $95k = $70k. Both theories agree on A.  
  - **(b) Add $1k cost to switch jobs**: If Alex’s "natural" job is A (60% prior), switching costs $1k. EDT still chooses A: switching to B lowers base pay to $94k, EU = 0.8 × $44k + 0.2 × $94k = $54k < $60k. CDT chooses B: EU for B = 0.6 × $94k + 0.4 × $44k = $74k (vs. A’s $70k). Conflict persists.

  ### Reply for the Defence
  **EDT’s defence**: CDT’s $75k is illusory—it ignores that choosing B is strong evidence (80%) of a predicted match and fine. Post-choice, B yields $55k expected, proving EDT’s $60k for A was better. Denying evidential links (e.g., "choosing B doesn’t cause the prediction") costs EDT elsewhere: in smoking lesion cases, rejecting evidence-based risks undermines rational avoidance. EDT’s strength is respecting all information, even if it can’t "control" causes.

  ### My Take
  This is a real problem for EDT: it picks the locally evidence-optimal choice but locks in suboutcomes, while CDT’s causally independent option dominates. The setup isn’t artificial—it’s a plausible corporate arms race.
