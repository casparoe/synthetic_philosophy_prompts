answer: |-
  ### Translation of the Liar Paradox and Theories of Truth into Semantic Vocabulary

  We map the Liar paradox and theories of truth to concepts in programming language semantics and fixed-point theory. Key correspondences:
  - **Sentences** = Terms (of type `Prop` or similar).
  - **Truth predicate** = A semantic function or relation `T : Prop → Bool` (or `Prop → {0, 1, ⊥}` in partial settings).
  - **Liar paradox** = An unguarded recursive term `L ≜ ¬(T L)` (direct self-reference without a base case).
  - **Theories of truth** = Semantic choices for defining `T`.

  #### 1. **Correspondence Theory (Tarski)**  
  **Philosophical claim**: Truth mirrors reality; a sentence is true iff it corresponds to facts.  
  **Translation**:  
    - `T` must satisfy the T-schema: `T(⌜P⌝) = P` for all sentences `P` (where `⌜P⌝` is a term encoding `P`).  
    - The Liar `L ≜ ¬(T L)` causes inconsistency: `T L = ¬(T L)`.  
  **Resolution in semantics**:  
    - **Stratification**: Split truth predicates into levels (e.g., `Tₖ` for level `k`).  
      - `Lₖ ≜ ¬(Tₖ Lₖ)` is ill-formed; `Tₖ` can only judge lower levels.  
      - *Counterpart*: Universes in type theory (e.g., Coq's `Type₀`, `Type₁`).  

  #### 2. **Coherence Theory**  
  **Philosophical claim**: Truth is coherence within a belief system.  
  **Translation**:  
    - Define `T` via consistency with a set of axioms `Γ` (a "belief system").  
    - Liar `L` is inconsistent with `Γ` if `Γ` includes `T L ↔ ¬(T L)`.  
  **Resolution in semantics**:  
    - **Partial models**: Restrict `T` to sentences not creating cycles (e.g., `dom(T)` excludes ungrounded terms).  
      - *Counterpart*: Defining admissible recursive terms via guardedness.  

  #### 3. **Deflationary Theory**  
  **Philosophical claim**: Truth adds no content; `T(⌜P⌝)` is redundant with `P`.  
  **Translation**:  
    - `T` is defined entirely by the T-schema `T(⌜P⌝) = P`.  
    - Liar violates redundancy: `T L = ¬(T L)` isn’t equivalent to any `P`.  
  **Resolution in semantics**:  
    - **Type restrictions**: `T` can only apply to non-self-referential terms.  
      - *Counterpart*: Stratification (as in 1) or linear logic (no shared context).  

  #### 4. **Fixed-Point Theory (Kripke)**  
  **Philosophical claim**: Truth is a fixed point of a semantic operator.  
  **Translation**:  
    - Define a monotone operator `Φ : ℘(Prop) → ℘(Prop)` where:  
      `Φ(S) = { P | P \text{ true given } S }`.  
    - Truth is a fixed point: `Φ(T) = T`.  
    - Liar has no classical fixed point.  
  **Resolution in semantics**:  
    - **Three-valued logic** (Kleene):  
      - `T` partial: `T L = ⊥` (undefined).  
      - Use **least fixed point** (µ) for truth (grounded sentences only).  
      - *Counterpart*: `µ` in denotational semantics (e.g., `fix` in Haskell).  

  #### 5. **Paracomplete (Supervaluationism)**  
  **Philosophical claim**: Some sentences (like Liar) are neither true nor false.  
  **Translation**:  
    - Allow `T P = ⊥` (gap).  
    - Liar: `T L = ⊥`.  
  **Resolution in semantics**:  
    - **Partial `T` with weak negation**:  
      - E.g., Kleene logic: `¬⊥ = ⊥`.  
      - *Counterpart*: Partial functions in semantics (e.g., `Maybe Bool`).  

  #### 6. **Paraconsistent (Dialetheism)**  
  **Philosophical claim**: Some contradictions (like Liar) are true.  
  **Translation**:  
    - Allow `T P = 1` and `T(¬P) = 1` (glut).  
    - Liar: `T L = 1` and `T(¬L) = 1`.  
  **Resolution in semantics**:  
    - **Four-valued logic** (e.g., Belnap: `{0, 1, ⊥, ⊤}`):  
      - Use **greatest fixed point** (ν) to include contradictions.  
      - *Counterpart*: `ν` in coinductive definitions (e.g., `cofix` in Coq).  

  ---

  ### Residue Report: What Translates Cleanly vs. What Doesn’t  

  #### ✅ Translates Cleanly  
  1. **Liar paradox**:  
     - Unguarded recursion `L ≜ ¬(T L)` is a direct analogue.  
  2. **Stratification (Tarski, Russell)**:  
     - Leveled truth predicates mirror universe hierarchies in type systems.  
  3. **Fixed points (Kripke)**:  
     - Least/greatest fixed points (µ/ν) map to grounded/unfoldable recursion.  
  4. **Paracompleteness/paraconsistency**:  
     - Multi-valued logics align with partial/total semantics and coinduction.  

  #### ⚠️ Translates with Distortion  
  1. **Coherence theory**:  
     - "Belief system consistency" is modeled as axiom set `Γ`, but holistic coherence isn’t captured by syntax-driven semantics.  
     - *Distortion*: Coherence reduces to syntactic consistency.  
  2. **Deflationism**:  
     - "Truth adds no content" becomes the T-schema as a typing rule, but deflationism’s metaphysical minimalism is lost.  
     - *Distortion*: Philosophical stance → syntactic constraint.  

  #### ❌ No Direct Counterpart  
  1. **Correspondence theory’s metaphysical link**:  
     - "Mirroring reality" has no analogue in formal semantics.  
     - *Why*: Semantics defines relations between symbols, not symbols and reality.  
  2. **Coherence theory’s holistic justification**:  
     - "System-wide coherence" isn’t reducible to a fixed-point or consistency check.  
     - *Why*: Holism requires global constraints; semantics is compositional.  
  3. **Deflationism’s conceptual primacy claim**:  
     - "Truth is a dispensable device" has no semantic implementation.  
     - *Why*: Semantics must define `T` operationally; deflationism rejects this need.  

  ---

  ### Analysis of Residue: What’s Missing?  

  1. **Metaphysical commitments** (e.g., correspondence’s "reality") are absent in formal semantics.  
     - *Verdict*: Not a flaw in semantics. These are philosophical add-ons.  
  2. **Holistic elements** (e.g., coherence) resist compositional modeling.  
     - *Verdict*: Semantics prioritizes local rules; global coherence isn’t formalizable without distortion.  
  3. **Conceptual minimalism** (e.g., deflationism) clashes with operational needs.  
     - *Verdict*: Semantics requires explicit `T`; deflationism’s "no content" is meta-theoretic.  

  **Conclusion**:  
  - The residue exposes **philosophical assumptions** (metaphysics, holism) not **semantic limitations**.  
  - Formal semantics cleanly handles the *structure* of truth (fixed points, stratification, gaps/gluts).  
  - What’s "missing" is irrelevant to resolving the Liar paradox. Semantic tools suffice for consistent truth predicates.  
  - **Recommendation**: Your vocabulary is complete for formalizing truth. The residue highlights where philosophy overshoots semantics.
