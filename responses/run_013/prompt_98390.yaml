  We are going to translate the Liar paradox and theories of truth into the vocabulary of programming language semantics.

  Key correspondences:
  - Sentences are terms (of some type, say `Prop` for propositions).
  - Truth is a predicate: `True : Prop -> Bool` or more generally in a partial setting, `True : Prop -> {True, False, Undefined}` or even a relation `True ⊆ Prop`.
  - A theory of truth is a semantics for the predicate `True`.
  - The Liar sentence is an unguarded recursive definition.

  The Liar sentence: "This sentence is false." 
  In our terms: 
    Let `L` be a term such that `L = not (True L)`

  This is an unguarded recursion because the definition of `L` immediately uses itself in a recursive call without a base case and in a negative position.

  Now, we consider different theories of truth and how they handle the Liar.

  1. Correspondence Theory (Classical, Tarski):
     - Truth is defined by correspondence with facts. Tarski's undefinability theorem shows that a truth predicate for a language cannot be defined within that language without inconsistency.
     - Translation: In a language that is expressive enough (like one with recursion and negation), we cannot have a total predicate `True` that satisfies the T-schema: `True (quote P) = P` for every sentence P (where `quote P` is a term representing P). 
     - The Liar shows that if we have such a `True` and allow the Liar term, we get a contradiction: `L = not (True L)`, and by T-schema, `True L = L`. So `True L = not (True L)` -> contradiction.
     - Thus, correspondence in a classical setting requires a hierarchy (like Tarski's object and meta language) which corresponds to stratification.

  2. Coherence Theory:
     - Truth is defined by coherence within a system of beliefs. In our setting, we might think of a set of sentences that are mutually consistent and coherent.
     - However, the Liar is a challenge because it cannot be consistently assigned a truth value. So a coherence theory might reject the Liar as not being a well-formed part of the system, or assign it a value that coheres best (but then we face the same paradox).
     - Translation: We might model this as a fixed-point of a belief revision system. But note: coherence theories are often not formalized in a fixed-point manner. However, we might see it as requiring that the set of true sentences must be maximally consistent. The Liar then breaks consistency. So we might exclude the Liar from the language (by stratification or type restrictions) or use a non-classical logic.

  3. Deflationary Theory:
     - Truth is just a device for disquotation and has no substantial nature. The T-schema is the whole story: `True (quote P)` is equivalent to `P`.
     - The Liar shows that if we allow the T-schema for every sentence, we get a contradiction.
     - Translation: Deflationism might be seen as requiring the T-schema as an equation in the semantics. But then we must restrict the domain of `True` to avoid the Liar. So we might have a partial `True` predicate, defined only for sentences that do not involve `True` (or only for sentences of a lower "level"). This is stratification again.

  4. Fixed-Point Theories (Kripke):
     - Kripke's theory uses a partial predicate and a fixed-point construction. 
     - Translation: We have a three-valued setting (true, false, undefined). We define a monotone operator that builds the truth set. The Liar sentence is ungrounded and ends up being undefined.
     - We use a least fixed point (or sometimes a maximal intrinsic fixed point) for the truth predicate. 
     - The Liar term `L` is an unguarded recursion that does not converge in the fixed-point iteration, so it remains undefined.

  5. Paracomplete (e.g., Supervaluationism, Kripke with Kleene logic):
     - Some sentences are neither true nor false. The Liar is one such.
     - Translation: We use a three-valued logic (or a partial logic) and the fixed-point construction (as above) leaves the Liar undefined. This is the same as Kripke's fixed-point approach.

  6. Paraconsistent (e.g., Dialetheism):
     - Some contradictions are true. The Liar is both true and false.
     - Translation: We use a four-valued logic (true, false, both, none) or a logic that allows truth-value gluts. The Liar sentence is assigned both truth values. 
     - In terms of fixed points, we might use a greatest fixed point that includes both `L` and `not L`? Or we might use a fixed point in a bilattice. 
     - Alternatively, we can use a fixed-point construction that allows for multiple fixed points and chooses one that is maximally consistent or use a different ordering (like in the logic LP).

  Now, we map the standard responses to the Liar to choices in our semantic framework:

  - Stratification (Tarski, Russell): 
     We assign levels to sentences. The truth predicate at level n can only talk about sentences of level < n. 
     Translation: We have a hierarchy of predicates `True_n`, and the Liar for level n would try to use `True_n` to talk about itself, which is disallowed. So we break the recursion by requiring that the level of the argument must be less than the level of the predicate.

  - Least Fixed Point (Kripke): 
     We build the truth set from the ground up, starting with the obviously true and false. The Liar never gets a truth value. 
     Translation: We define a monotone operator and take the least fixed point. The Liar term is not in the domain of truth (undefined).

  - Greatest Fixed Point (used in some paraconsistent or coinductive approaches?): 
     However, note that in Kripke we have multiple fixed points and we choose the least. But in paraconsistent settings, we might allow a fixed point that includes the Liar as both true and false? 
     Actually, the standard paraconsistent approach (like in the Logic of Paradox, LP) does not use a fixed-point construction in the same way. But if we model it with a fixed point, we might have an operator that is monotone with respect to a different ordering (e.g., the information ordering) and then take the greatest fixed point that includes as many sentences as possible, including the Liar with both values.

  - Partiality: 
     We allow the truth predicate to be partial. This is the case in Kripke's fixed-point.

  - Paraconsistency: 
     We change the logic so that a contradiction does not imply everything. We use a logic that is not explosive. Then we can assign both true and false to the Liar without triviality.

  Residue Report:

  What translates cleanly:
  - The Liar as an unguarded recursive term: `L = not (True L)`. This is straightforward.
  - Stratification: This maps directly to a hierarchy of universes or levels, as in type theory or Tarski's hierarchy.
  - Fixed-point approaches (Kripke): The fixed-point construction for truth is directly from programming language semantics (denotational semantics of recursion). The use of least fixed points and partiality is standard.
  - Partiality: The idea that the truth predicate is partial and some sentences are undefined is well-known in programming languages (e.g., non-termination, undefined values).
  - Paraconsistency: We can model this with multi-valued logics or by using a proof theory that is paraconsistent. The idea of having truth-value gluts (both true and false) can be modeled by a powerset lattice or bilattices.

  What translates with distortion:
  - Coherence theory: This is less formal and often not defined in terms of fixed points. We can force it into a fixed-point mold by thinking of coherence as a fixed point of a belief revision operator, but this is not standard. Also, the idea of "coherence" is more holistic and might involve global constraints that are not captured by a simple fixed point.
  - Deflationary theory: The deflationary idea that truth is just a device for disquotation is a philosophical stance. In our semantic framework, we can enforce the T-schema as a constraint, but that leads to the same problems as correspondence. The deflationist might then adopt stratification or partiality, but the core deflationary idea (that truth has no substantial nature) is not captured by the semantic machinery. We only capture the formal consequence.

  What has no counterpart:
  - The philosophical substance of correspondence and coherence. The correspondence theory's idea of matching reality and coherence theory's idea of fitting within a system of beliefs are not directly modeled by the semantics. We only model the formal structures (like stratification or fixed points) that these theories might use to avoid the paradox.
  - The deflationary view's philosophical claim that truth is not a substantial property: our semantic framework doesn't care about that; it just uses the T-schema as an equation.

