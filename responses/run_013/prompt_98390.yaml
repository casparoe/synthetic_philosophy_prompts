  - Once we choose a formal system (like stratified, or fixed-point with partiality, or paraconsistent), we have a way to handle the Liar. The philosophical debates about the nature of truth (correspondence, coherence, deflation) might then be seen as motivating the choice of formal system, but the formal system itself is neutral.

  However, note that the deflationary view might object to the complexity of a stratified truth predicate or a partial one, because it wants truth to be a simple disquotational device. But then it must accept that the device is limited. The formal system forces a limitation, and the deflationist might be happy with that limitation.

  In summary, the Liar paradox and the theories of truth can be largely translated into the vocabulary of programming language semantics. The formal structures (fixed points, stratification, partiality, paraconsistent logics) are shared. The philosophical residue (the nature of truth) does not have a direct counterpart, but that residue may not affect the formal handling of the paradox. Therefore, the residue might be seen as less substantive for the purpose of building a consistent formal system.

