  Below is a self-contained decision tree for diagnosing commitments on whether the brain is a computer, starting from the shared baseline that neural activity involves substantive information processing (beyond mere redescription). The tree uses concrete probes to avoid label-based decisions, results in 10 distinct leaves (including trivialism), and flags key limitations. Nodes are ordered to reflect logical dependencies, with the most divisive question first.

  ---

  ### **Decision Tree: Is the Brain a Computer?**

  **Start**: You agree that neural activity can be modeled as information processing in a substantive way (not just decorative redescription). Where do you go from here?

  #### **Node 1: The Triviality Gate**
  **Question**: Consider a bucket of water: we can arbitrarily map its states (e.g., water level, ripples) to computational states (e.g., 0s and 1s) to "simulate" any computation. Does this make the claim "the brain is a computer" **as trivial as** claiming the bucket computes?  
  - **Yes** → **Leaf 1: Trivialism (Pancomputationalism)**  
    *Most awkward commitment*: Everything (rocks, storms, brains) computes equally, so the claim has no explanatory value.  
  - **No** → Proceed to Node 2.

  #### **Node 2: Content Requirement**  
  **Question**: Imagine a trained neural network that classifies images perfectly, but its internal states are uninterpretable "black boxes" (no one knows what they represent). Is this system computing?  
  - **Yes** (only causal/functional organization matters) → Proceed to Node 3.  
  - **No** (states must have intrinsic "aboutness" or content for the system) → Proceed to Node 4.  

  #### **Node 3: Constitutive or Explanatory? (Non-Content Path)**  
  **Question**: When we say the brain "computes," is this a claim about what cognition **fundamentally is**, or just the **best model** we have? Compare: An abacus computes only when a user manipulates it—is cognition like the abacus (explanatory model) or the user (constitutive)?  
  - **Constitutive** (cognition just is computation) → Proceed to Node 5.  
  - **Explanatory** (computation is a useful model, not fundamental) → Proceed to Node 6.  

  #### **Node 4: Constitutive or Explanatory? (Content Path)**  
  **Question**: For cognition to involve content (e.g., beliefs, desires), must computation be what it **is**, or just how we **describe** it? Example: A thermostat "represents" temperature, but is this computation core to its function or just our interpretation?  
  - **Constitutive** (contentful computation defines cognition) → Proceed to Node 7.  
  - **Explanatory** (content is modeled computationally) → Proceed to Node 8.  

  #### **Node 5: Medium-Independence (Non-Content Constitutive)**  
  **Question**: Could a silicon replica of a worm’s nervous system (matching its causal structure) support identical cognition?  
  - **Yes** (cognition is substrate-independent) → **Leaf 2: Non-Representational Computationalism (e.g., Radical Connectionism)**  
    *Most awkward commitment*: Cognition requires no "aboutness"—e.g., belief-like states are illusory.  
  - **No** (biology is essential) → **Leaf 3: Embodied Computationalism**  
    *Most awkward commitment*: Computation is real but inexplicably tied to wetware—silicon minds are impossible.  

  #### **Node 6: Medium-Independence (Non-Content Explanatory)**  
  **Question**: Is a computational model of cognition (e.g., a neural network simulation) valid only if it mirrors the brain’s biology, or does it work for any system with similar input-output patterns?  
  - **Yes** (model applies universally) → **Leaf 4: Instrumentalism (Functionalist)**  
    *Most awkward commitment*: Brains don’t literally compute—yet the model is indispensable.  
  - **No** (model depends on biology) → **Leaf 5: Biologically-Constrained Instrumentalism**  
    *Most awkward commitment*: Computational models are useful but anthropocentric—they fail for non-biological systems.  

  #### **Node 7: Digital vs. Analog (Content Constitutive)**  
  **Question**: Must computation be **digital** (discrete symbols, like a Turing machine) or can it be **analog** (continuous, like an analog computer or gradient-based system)? Example: Is a continuous system (e.g., the vestibular system) computing if it lacks discrete steps?  
  - **Digital** → **Leaf 6: Classical Computationalism (e.g., Fodorian)**  
    *Most awkward commitment*: All thought must reduce to discrete symbol manipulation—blurry cognition (e.g., emotions) is problematic.  
  - **Analog** → **Leaf 7: Connectionist Representationalism**  
    *Most awkward commitment*: Content emerges from continuous dynamics—hard to explain structured reasoning (e.g., logic).  

  #### **Node 8: Medium-Independence (Content Explanatory)**  
  **Question**: Can a computer simulation of a brain (with mapped "contentful" states) replicate cognition, or is biology essential for genuine content?  
  - **Yes** (content is replicable) → **Leaf 8: Representational Instrumentalism**  
    *Most awkward commitment*: Content exists but isn’t inherently computational—models are tools, not truths.  
  - **No** (biology grounds content) → **Leaf 9: Biological Representationalism**  
    *Most awkward commitment*: Only biological systems have "real" content—AI lacks meaning.  

  ---

  ### **Summary of Leaves**
  1. **Trivialism (Pancomputationalism)**: Everything computes arbitrarily.  
  2. **Non-Representational Computationalism**: Computation is constitutive, content-free, and medium-independent.  
  3. **Embodied Computationalism**: Computation is constitutive and content-free but biology-dependent.  
  4. **Instrumentalism (Functionalist)**: Computation is explanatory, content-free, and medium-independent.  
  5. **Biologically-Constrained Instrumentalism**: Computation is explanatory, content-free, and biology-dependent.  
  6. **Classical Computationalism**: Computation is digital, constitutive, and content-based.  
  7. **Connectionist Representationalism**: Computation is analog, constitutive, and content-based.  
  8. **Representational Instrumentalism**: Computation is explanatory, content-based, and medium-independent.  
  9. **Biological Representationalism**: Computation is explanatory, content-based, and biology-dependent.  
  *(10th implicit leaf: A "No" at Node 4 leads to the content path, but all options are covered.)*  

  ---

  ### **Logical Gaps and Limitations**
  - **Empty Combinations**:  
    - *Constitutive + Non-Content + Digital/Analog choice*: Omitted because non-content views rarely care about format (empty as unattractive—no theorists defend this).  
    - *Explanatory + Content + Digital/Analog choice*: Not branched, as explanatory views treat format as a modeling choice (empty by coherence—format is pragmatic, not ontological).  
  - **Failures of Discrimination**:  
    - The tree **cannot separate** positions on whether computation requires **internal representation** (e.g., if states must be "for" the system) vs. **external interpretation** (e.g., observer-relative). This collapses into Node 2.  
    - **Medium-independence vs. substrate-specificity** is underspecified for content-constitutive positions (Node 7 assumes medium-independence by default).  
  - **Most Divisive Node**: **Node 2 (Content Requirement)**. It splits the field into two irreconcilable camps: those who see computation as purely causal/functional (no inherent meaning) and those who tie it to content (aboutness). This divide underlies major disputes (e.g., computationalism vs. enactivism).  

  ---

  This tree isolates commitments through concrete cases (bucket, uninterpretable network, worm nervous system) and minimizes theory-laden labels. Use it to spark debate or self-diagnosis in your seminar.
