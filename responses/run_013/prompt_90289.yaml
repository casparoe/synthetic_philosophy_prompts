  A philosopher friend of mine who blogs about logic summarized the Lewis triviality results for me like this: 'Lewis proved you can't have a probability for an indicative conditional that matches the conditional probability of the consequent given the antecedent -- try to have it both ways and you just get a contradiction, so indicative conditionals can't be expressing propositions at all. That kills Adams's thesis that our degrees of belief in conditionals are conditional probabilities, and it's the final nail in the coffin for truth-functional readings of if.' I'm working on a piece where this comes up and I'd rather not embarass myself. How much of that is fair? Go claim by claim and tell me what someone who actually works on conditionals would sign off on, what they'd wince at, and what's just wrong -- especially whether the "no propositions" part follows from the result, whether Adams's thesis is refuted or only in tension with something else, and whether the result is really as bad for truth-functional accounts as he makes out. And if I get one sentence in the piece, whats the safest accurate thing to say?
reasoning: |-
  Okay, the user is asking about Lewis's triviality results in logic, specifically regarding indicative conditionals. Their philosopher friend summarized it by saying that Lewis proved you can't have a probability for an indicative conditional matching the conditional probability, leading to contradictions. This implies conditionals don't express propositions, which undermines Adams's thesis and truth-functional accounts. The user wants to ensure they don't embarrass themselves in their piece and seeks a claim-by-claim breakdown of what's accurate, what's problematic, and what's wrong.

  First, I need to recall Lewis's actual results. David Lewis's 1976 paper showed that if you assume that the probability of "If A, then C" equals P(C|A), and if this conditional has a propositional truth value, then under certain assumptions, you end up with a triviality result where P(C|A) must equal P(C), making conditionals probabilistically independent. That leads to contradictions unless the probabilities are extreme. So the core result is that such a probability function can't exist without collapsing into triviality.

  The user's friend claims that indicative conditionals can't express propositions. Lewis's result does imply that if conditionals have truth values, assigning P(if A, C) = P(C|A) leads to problems. But it's not that they can't express propositions at all; rather, the combination of them having truth values and equating their probability to conditional probability causes issues. Some theorists like Jackson or Grice might still argue for propositional content with pragmatic elements. So the "no propositions" part is a strong interpretation, but not the only one.

  Next, Adams's thesis. Ernest Adams proposed that while conditionals might not have truth conditions, the assertability or acceptability of "If A, C" is given by P(C|A). Lewis's result challenges this by showing that if conditionals are propositions, Adams's thesis leads to triviality. But Adams himself denied that conditionals have truth values, so his thesis isn't directly refuted. Instead, it's in tension with the idea that conditionals express propositions. So the friend's claim that it "kills" Adams's thesis is overstated; it's more about incompatibility with propositional accounts.

  Regarding truth-functional accounts, like the material conditional: Lewis's result is bad for them because if "If A, C" is treated as A⊃C, then P(A⊃C) equals 1 - P(A and not-C), which isn't generally equal to P(C|A). For example, when P(A) is low, P(A⊃C) can be high even if P(C|A) is low. Lewis showed that equating them leads to triviality, so it's another nail in the coffin for truth-functional views, but not entirely new—the issues were already known from other paradoxes like the paradoxes of material implication.

  Now, the user's deeper needs: They're writing a piece and want to avoid embarrassment, so accuracy is key. They need to present the nuances without oversimplifying. They might also want to convey the significance of Lewis's result without alienating readers unfamiliar with formal logic. The safest sentence should encapsulate the core finding without venturing into contentious interpretations.

  Key points to address:
  - Lewis's result: Assuming conditionals are propositions and P(if A, C) = P(C|A) leads to triviality only if probabilities are non-extreme. So it's a conditional impossibility.
  - "No propositions": This is a valid inference from the result if one accepts Lewis's premises, but alternative views exist. Not all logicians agree conditionals must be non-propositional.
  - Adams's thesis: Not refuted, as Adams rejects truth values. The tension is between his epistemic account and propositional approaches.
  - Truth-functional accounts: Lewis adds to existing problems, but the main issue is the mismatch between P(C|A) and P(A⊃C).

  The safest accurate sentence should summarize the impossibility result without taking sides on implications. For example: "Lewis showed that assigning probabilities to indicative conditionals as if they were ordinary propositions while equating those probabilities to conditional probabilities leads to triviality." This captures the core technical point without overcommitting to metaphysical conclusions.
answer: |-
  Based on the current state of the debate in philosophical logic and probability, here's a claim-by-claim breakdown of your friend's summary, followed by the safest one-sentence takeaway. Lewis's triviality results (1976) are foundational but nuanced, and interpretations vary. Key sources include Lewis's original work, Dorothy Edgington, Alan Hájek, and recent defenses/refinements of Adams's approach.

  ### Claim-by-Claim Analysis:
  1.  **"Lewis proved you can't have a probability for an indicative conditional that matches the conditional probability of the consequent given the antecedent..."**
      *   **Sign off:** This is **largely accurate** and captures the core technical result. Lewis showed that *if* you assume:
          *   Indicative conditionals ("If A, then C", abbreviated A→C) express propositions with truth values (i.e., they are truth-apt).
          *   The probability of the conditional P(A→C) is *identical* to the corresponding conditional probability P(C|A) (Adams's thesis).
          *   Probability obeys standard axioms (Kolmogorov), and standard logical relationships hold.
          *   The probability space is sufficiently rich (non-trivial, containing at least some independent propositions).
      *   ...then you can derive a contradiction (e.g., P(C|A) = P(C), implying A and C are probabilistically independent, which is absurd for most cases). So, the two ideas (truth-aptness + P(A→C) = P(C|A)) are *incompatible* under standard assumptions.
      *   **Wince/Nuance:** Lewis proved impossibility *under specific assumptions*. The result depends crucially on the assumption that conditionals *have truth values* and that the probability calculus applies to them like other propositions. Some argue the assumptions (especially about logical structure or the richness of the space) can be relaxed or modified to avoid triviality (though this is highly contentious).

  2.  **"...try to have it both ways and you just get a contradiction..."**
      *   **Sign off:** **Accurate.** This is the essence of the proof. Assuming both truth-aptness and P(A→C)=P(C|A) leads to P(C|A) = P(C) for *all* A and C (or other absurdities like P(A)=0 or P(A)=1), which is triviality. Contradiction achieved.

  3.  **"...so indicative conditionals can't be expressing propositions at all."**
      *   **Wince/Nuance:** This is a **common inference, but not the only possible conclusion**, and it's debated.
          *   **Why it's common:** Lewis himself drew this conclusion: if assigning them probabilities equal to conditional probabilities (which we seem to do) leads to contradiction *when* they are truth-apt, then they probably *aren't* truth-apt. This supports the *non-propositional* view dominant in the *Adams* tradition: conditionals don't express propositions with truth conditions; instead, P(C|A) measures their *acceptability*, *assertability*, or *degree of support*.
          *   **Why it's not forced/contested:**
              *   **Stalnaker/Lewis (Earlier):** They proposed *possible-worlds semantics* where conditionals *do* express propositions (with non-truth-functional truth conditions). Lewis's result forced them to abandon P(A→C)=P(C|A) as a *general* principle. They might accept it holds only in limited contexts (e.g., under "Ramsey Test" conditions) or offer alternative explanations for why it *seems* to hold.
              *   **Jackson:** Argued conditionals *are* truth-apt (using a modified truth-functional or possible-worlds account) but have a special *conventional role* (involving robustness or probability) that explains why we *use* P(C|A) to assess them, even if P(A→C) isn't strictly identical to it.
              *   **Griceans/Pragmatists:** Might argue conditionals *are* truth-apt (e.g., as material conditionals) but that pragmatic factors explain the strong link to conditional probability and the *apparent* failure of truth-functionality in certain cases. Lewis's result adds pressure, but it's not a death knell.
              *   **Other Proposals:** Theories like *restricted quantification* or *dynamic semantics* offer propositional accounts that attempt to be more compatible with conditional probability intuitions, though often at the cost of complexity or deviating from standard logic.
      *   **Conclusion:** Lewis's result **strongly motivates** the non-propositional view and is its primary technical support, but it does not **logically force** it. One could *reject* one of Lewis's assumptions (truth-aptness *or* P(A→C)=P(C|A) *or* standard probability/logic) to avoid the contradiction. The non-propositional view is the most popular *response* to the result, but propositional views persist.

  4.  **"That kills Adams's thesis that our degrees of belief in conditionals are conditional probabilities..."**
      *   **Wince:** This is an **overstatement** and potentially **misleading**.
          *   **Adams's Thesis:** Adams *explicitly denied* that conditionals express propositions with truth conditions. For Adams, the "degree of belief" in "If A, then C" *just is* P(C|A). It's not the probability *of* a proposition because there *is* no proposition to have a probability *of*. Adams's thesis is about *acceptability/assertability*, not the probability *of a truth*.
          *   **Impact of Lewis:** Lewis's result **does not refute Adams's thesis itself.** Instead, it **vindicates Adams's core claim that conditionals are not truth-apt!** Lewis showed that *if* you try to combine Adams's thesis (P(A→C) = P(C|A)) with the idea that A→C is truth-apt, you get nonsense. This is perfectly consistent with Adams saying "Exactly! I told you they *aren't* truth-apt!"
      *   **Nuance/Tension:** Lewis's result *does* create challenges *within* the Adams framework:
          *   **Embedding:** How do non-propositional conditionals embed in complex sentences (e.g., negations, conjunctions, other conditionals)? Adams restricted his logic to avoid such embeddings, which is seen as a limitation.
          *   **Probability of Negation/Conjunction:** If conditionals aren't truth-apt, what does it mean to assign a probability to "Not(If A, then C)" or "If A, then C and If B, then D"? Adams's system struggles here, leading to developments like *probabilities of conditional* (not *of* a proposition) or more complex systems (e.g., *integrating Adams with de Finetti*).
      *   **Conclusion:** Lewis's result **does not kill Adams's thesis.** It **reinforces Adams's rejection of truth-aptness** but highlights **difficulties in fully integrating the thesis into a complete logic and probability theory** for complex language. Adams's thesis remains highly influential and actively defended/developed (e.g., by Edgington, Douven, musings in AI).

  5.  **"...and it's the final nail in the coffin for truth-functional readings of if."**
      *   **Sign off (mostly):** **Fair**, but **not solely because of Lewis.**
          *   **Why fair:** The primary truth-functional account is the *material conditional* (A⊃C, equivalent to ¬A ∨ C). It is demonstrably true that P(A⊃C) = 1 - P(A ∧ ¬C) is **not** generally equal to P(C|A) = P(A ∧ C) / P(A). Lewis's result provides a powerful *additional* argument: if you tried to *stipulate* that P(A⊃C) = P(C|A), you'd get Lewisian triviality (collapse to P(C|A) = P(C)). This is a devastating technical blow. Furthermore, the material conditional faces well-known intuitive problems (paradoxes of material implication) that Lewis's result compounds technically.
          *   **Nuance:** Lewis isn't the *first* nail; the paradoxes of material implication predate him. He adds a very heavy, technical nail. Some (e.g., Grice, Jackson) still defend truth-functionality by invoking pragmatics to explain away the mismatch with conditional probability and the paradoxes. Lewis's result makes their job much harder, but they persist.

  ### Safest One-Sentence Summary for Your Piece
  **"Lewis proved that, under standard assumptions, indicative conditionals cannot simultaneously express propositions with standard truth values *and* have probabilities equal to the corresponding conditional probabilities, as this leads to logical triviality."**

  **Why this is safest:**
  1.  **Accurately Captures Core Result:** States the key technical impossibility (truth-aptness + P(A→C)=P(C|A) → triviality).
  2.  **Neutral on Implications:** Doesn't commit to conditionals definitely *not* expressing propositions, nor to Adams's thesis being refuted, nor to truth-functionality being impossible. It just states the incompatibility Lewis demonstrated.
  3.  **Highlights Key Tension:** Clearly identifies the conflict between two intuitive ideas (truth-aptness and the link to conditional probability).
  4.  **Avoids Overclaim:** Uses "cannot simultaneously" rather than stronger claims like "proves they aren't propositions" or "kills Adams's thesis".
  5.  **Accessible:** Uses relatively plain language while being precise enough for an informed audience.

  This sentence gives you the core technical takeaway without wading into the deep philosophical debates about what the result ultimately *means* for the nature of conditionals, Adams, or truth-functionality, which is where the disagreements lie.
