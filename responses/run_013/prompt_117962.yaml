prompt: |-
  I help run a public deliberation series, and at the most recent session two invited speakers argued over a policy question that is part empirical — whether the measure reduced the harm it was meant to reduce — and part evaluative — whether the reduction was worth what it cost. One speaker repeatedly attributed to the other a position the other had explicitly disavowed, and slid between the empirical and the evaluative half of the question whenever it suited him. When I asked the moderator afterwards whether the exchange had met the series' stated standard of good-faith argument, he declined to make any finding at all: the maxim that there are two sides to every question, he said, means that a moderator's office is not to adjudicate between them. Pressed, he glossed his own stance as equal standing rather than equal merit. A colleague defended him on different grounds, saying that nothing counts as settled until each side has been heard at its strongest.

  I am not asking you to judge the exchange. I want the maxim's possible contents separated and graded. Distinguish at least: the near-logical reading, on which a question admitting two answers has two sides and nothing follows about their merits; the descriptive reading, on which live disputes have two parties; the symmetry reading, on which the two sides are roughly as likely to be right, or the truth lies between them; any reading on which the maxim is a thesis about justification — about what it takes to dismiss a claim; any reading on which it concerns the standing of the parties rather than the merits of their cases; and any relativist reading, on which each side is correct relative to its own framework. For each, say whether it is empty, contestable but defensible, or false, and flag those that undermine themselves when asserted. Then say which readings would actually license (a) the moderator's refusal to find bad faith, (b) his standing/merit distinction, and (c) my colleague's claim about when a question is settled, noting in each case the further premise the reading needs, and what becomes of that support when one party's argument is demonstrably unresponsive to evidence. Close with your best guess at which reading the maxim's habitual users intend, and whether the maxim is better understood as a procedural rule for forums or as a claim about the shape of truth.
reasoning: |-
  Hmm, this is a sophisticated request about dissecting the "two sides to every question" maxim. The user runs a public deliberation series and witnessed a problematic exchange where one speaker misrepresented the other's position and shifted between empirical and evaluative dimensions. The moderator refused to judge good faith, invoking this maxim with a "standing not merit" interpretation, while a colleague defended it based on hearing all sides before settling issues.

  I need to unpack this maxim systematically. The user wants me to distinguish several readings:
  - Near-logical (binary questions exist, no merit judgment)
  - Descriptive (disputes have participants)
  - Symmetry (both sides equally plausible)
  - Justification-related (dismissal standards)
  - Standing-focused (party status)
  - Relativist (framework-relative truth)

  For each, I'll evaluate whether they're empty (tautological), contestable but defensible, or false - and note if they self-undermine. Then I'll map which readings support (a) the moderator's non-judgment stance, (b) his standing/merit distinction, and (c) the colleague's "unsettled until strongest case heard" position. Crucially, I must examine what happens when a side ignores evidence. Finally, I'll speculate on common usage intent and whether this is best seen as procedural rule or truth-claim.

  The user isn't asking for judgment of their specific incident - they want conceptual clarity to inform future moderation. This suggests frustration with procedural evasion masking substantive evasion. The philosophical depth implies they value rigor in deliberative democracy.

  For the analysis: The near-logical reading is tautological (empty) but useful for binary questions. Descriptive is similarly empty. Symmetry is empirically false but psychologically common. Justification reading is defensible for complex issues but collapses with unresponsive arguing. Standing distinction is defensible procedurally but risks false equivalence. Relativism is self-undermining if asserted universally.

  Supporting the moderator: Near-logical + descriptive + standing readings enable (a) and (b) with added premises about moderator role. But these fail when evidence is ignored. Colleague's position (c) needs justification reading plus epistemic humility premise - which evaporates with unresponsive argumentation.

  Common usage likely blends descriptive and symmetry readings unintentionally. As a procedural rule it's workable; as truth-claim it's dangerous. My closing advice will emphasize that the maxim's value lies in due process, not epistemological validity - especially when disentangling empirical/evaluative dimensions.
answer: |-
  Here is a systematic breakdown of the "two sides to every question" maxim, graded for plausibility and applied to your scenario:

  ### Distinguishing & Grading the Readings
  1.  **Near-Logical Reading:** A question admitting of two (or more) possible answers has "sides" (possible positions). *Empty.* It's a tautology about the structure of questions that permit disagreement. Says nothing about merit, evidence, or reasonableness.
  2.  **Descriptive Reading:** Where a live dispute exists, there are at least two parties advocating different positions. *Empty/Contestable.* It describes a social fact (a dispute exists) but doesn't imply the dispute is genuine, reasonable, or based on valid arguments. It becomes contestable if interpreted as *requiring* two sides even where none exists (e.g., flat earth debate).
  3.  **Symmetry Reading:**
      *   *Equal Likelihood:* Both sides are roughly equally likely to be correct. *False.* This is empirically indefensible. Most disputes involve vastly unequal evidence and reasoning quality.
      *   *Truth-in-the-Middle:* The truth usually lies somewhere between the two extremes presented. *Contestable but Often False.* While compromise is sometimes valid, many truths are not midpoints (e.g., evolution vs. creationism; vaccines causing autism). Presumes the presented extremes are the only options.
  4.  **Justification Reading:** One cannot justifiably dismiss a claim until it has been heard and considered in its strongest form. *Contestable but Defensible (with scope limits).* This is a core principle of intellectual fairness and rigor (e.g., Mill, Rawls). It *undermines itself if asserted universally*: If *every* claim needs a hearing, what about the claim "no claim needs a hearing"? Scope is crucial: it applies best to complex empirical/evaluative matters with genuine evidence/reasoning, not demonstrably false or incoherent claims.
  5.  **Standing Reading:** The parties in a dispute have an equal right to be heard and participate (*equal standing*), regardless of the perceived merit of their arguments. *Contestable but Defensible (procedurally).* Essential for fair process and avoiding premature silencing. Does *not* imply *equal merit*.
  6.  **Relativist Reading:** Each side is "correct" relative to its own framework, values, or perspective; there is no objective truth to adjudicate. *Contestable and Often Self-Undermining.*
      *   *Descriptive Relativism:* People hold different views based on frameworks. *Largely Defensible.*
      *   *Normative/Strong Relativism:* All frameworks are equally valid; truth *is* framework-relative. *False and Self-Undermining.* Asserting "all truths are relative" claims an objective truth, refuting itself. Doesn't resolve disputes about shared reality.

  ### Application to the Scenario
  *   **(a) Moderator's Refusal to Find Bad Faith:**
      *   **Supporting Readings:** **Standing Reading** (focus on equal right to participate, not judging arguments) + **Near-Logical/Descriptive Readings** (acknowledging the existence of opposing sides).
      *   **Needed Premise:** The moderator's role is *exclusively* procedural (ensuring standing/opportunity) and explicitly *not* epistemic (judging argument quality, truth, or conduct like bad faith).
      *   **Impact of Unresponsive Evidence:** Weakens significantly. If one party demonstrably ignores evidence, misrepresents, or argues unresponsively, it violates the *procedural* norms of deliberation (good faith, responsiveness) that the standing reading relies on for legitimacy. The moderator's refusal then protects disruptive behavior, undermining the forum's purpose.
  *   **(b) Moderator's Standing/Merit Distinction:**
      *   **Supporting Reading:** **Standing Reading** (explicitly).
      *   **Needed Premise:** Clear separation between the *right to participate* and the *quality of the participation*. Equal standing is a procedural norm; merit is a substantive judgment.
      *   **Impact of Unresponsive Evidence:** Reinforces the distinction. Even with unresponsive evidence, the *standing* might be protected (right to speak), but the *merit* of the argument is clearly low. The distinction helps articulate why the speaker can be heard but their arguments dismissed as poor.
  *   **(c) Colleague's Claim (Settled Only After Hearing Strongest Case):**
      *   **Supporting Reading:** **Justification Reading** (explicitly).
      *   **Needed Premise:** Epistemic humility – recognizing our judgments can be premature and that even flawed positions might contain a kernel of insight or reveal weaknesses in our own view when presented optimally. Also assumes the forum aims at justified belief/settlement, not just expression.
      *   **Impact of Unresponsive Evidence:** Collapses. If a side is demonstrably unresponsive to evidence *even when presented at its strongest*, the core premise of the Justification Reading fails. Hearing the "strongest case" of a position fundamentally unwilling or unable to engage with counter-evidence provides no epistemic value for "settling" the question; it only demonstrates the position's weakness or bad faith. The maxim doesn't require entertaining the *indefensible*.

  ### Best Guess & Final Analysis
  *   **Habitual User's Intent:** The maxim is most commonly invoked intending a blend of the **Descriptive Reading** (disputes exist!) and the **Symmetry Reading (Equal Likelihood or Truth-in-Middle)**. People often conflate the *existence* of disagreement with the *reasonableness* or *probable truth* of both sides, driven by a desire for fairness, conflict aversion, or false equivalence. The **Standing Reading** is also common in procedural contexts.
  *   **Procedural Rule vs. Claim About Truth:**
      *   **As a Procedural Rule:** This is its most defensible and useful application. Understood as: *"In a deliberative forum aiming for fairness, ensure all significant perspectives have standing/opportunity to be heard, especially before forming conclusions"* (drawing on Standing + Justification Readings). This promotes inclusion and guards against echo chambers.
      *   **As a Claim About Truth:** This is its most dangerous application. Interpreted as implying symmetry, relativism, or that the mere existence of two sides means truth is uncertain/middling (Symmetry/Relativism Readings), it becomes a fallacy hindering reasoned judgment and enabling misinformation. It misrepresents epistemology.

  **Conclusion:** The maxim serves poorly as an epistemic principle about truth or justification. It serves well (when carefully bounded) as a *procedural norm* for inclusive deliberation, emphasizing *equal standing* and the importance of hearing diverse views (*before* judgment, not *instead* of judgment). Your moderator likely intended the Standing Reading procedurally but applied it over-broadly by refusing to enforce norms like good faith. Your colleague invoked the Justification Reading correctly in spirit but failed to recognize its limits when a position is demonstrably unresponsive to evidence. The exchange highlights the tension between procedural fairness and the epistemic demands of good deliberation, especially when one party argues in bad faith or slides between empirical and evaluative domains. The maxim, as commonly used, often obscures rather than resolves this tension.
