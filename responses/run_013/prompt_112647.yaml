prompt: |-
  I'm a backend engineer at a mid-size company and I've some how ended up as the person who decides how much rope our internal AI agents get. We ship a new agent or a new capability every couple of weeks now -- the current batch is a refund agent that drafts support decisions, a bot that comments on pull requests, and a thing that writes our weekly ops summary out of the logs. Right now the answer to how much freedom each one gets is basically whoever argued loudest in the design review, and I want to stop doing that.

  Someone pointed me at this four-level picture of minds and it's been stuck in my head since. As I understand it: level one creatures are just wired up, hardcoded responses, no learning (Darwinian). Level two can learn from what actually happens to them, trial and error, reward and punishment (Skinnerian). Level three can run the trial and error inside its own head first, so a bad option can die in simulation instead of dying for real (Popperian). Level four does level three but also leans on external stuff -- tools, notation, other people, written procedures -- to think way past what one brain can hold (Gregorian). Each level has everything the level below it has, plus one new move.

  What I want from you is a decision procedure my team can actually run, per capability, to work out which of those levels we should be building at. Not which level is coolest -- the cheapest one that works, plus an explicit note for when the answer is that we shouldn't build the capability at all. The questions to ask in order, what counts as a good enough answer to each, where the procedure terminates with a clear verdict, and where it stops and hands the decision to a person because it's a values or risk call rather than an engineering call.

  A few things it has to handle honestly. Some capabilities genuinely can't be trained -- there's no usable signal, or the feedback shows up too late to matter -- and I suspect my team reaches for fine-tuning or a bigger model when the real answer is a hardcoded rule or a checklist a human fills in. The reverse happens too, someone writes an if-statement ladder when the thing obviously needs to learn. I also want the procedure to be upfront about which of its steps are judgment calls dressed up as engineering, so I can tell the difference when I'm signing off.

  Constraints: I need to run it in about an hour per capability, with one engineer and one PM in the room, no philosophy background required, and I have to be able to hand the output to our safety reviewer as a one-page justification. If a step needs data we don't have, the procedure should say whether to go get it or fall back to something dumber.

  Run it on three cases and show your work: the refund agent, where the failure mode is paying out money we shouldn't; the PR commenter, where the failure mode is being annoying and being wrong in public; and the ops summarizer, where I honestly suspect the answer is going to be boring and I'd like to be told I'm wrong if I am. At least one of the three should come out as a verdict I don't want to hear. If all of them land where the enthusiastic version of me would have put them anyway, the procedure isn't doing any work.

  And tell me where the thing breaks. Which capabilities will it misclassify, what kind of team will misuse it to justify what they already wanted to build, and what does it structurally not cover? I assume it says nothing useful about multi-agent coordination or about who's accountable when the agent is wrong, but tell me what else falls outside it -- and whether any of those gaps are big enough that I should not adopt this at all and go find a seperate approach.
reasoning: |-
  We are designing a decision procedure to determine the appropriate level of intelligence (from Level 1 to Level 4) for an internal AI agent capability, or whether not to build it at all. The levels are:

  1. **Level 1 (Darwinian)**: Hardcoded responses, no learning.
  2. **Level 2 (Skinnerian)**: Learns from trial and error (real-world feedback).
  3. **Level 3 (Popperian)**: Simulates trial and error internally (avoids real failures).
  4. **Level 4 (Gregorian)**: Uses external tools (e.g., calculators, databases, written procedures) to extend its reasoning.

  The goal is the cheapest level that works, with an explicit option to not build.

  The decision procedure will be a sequence of questions. Each question must be answerable by an engineer and a PM in about an hour per capability. The output is a one-page justification.

  ### Procedure Outline

  We'll break it down into steps. At each step, we either terminate with a verdict or proceed to the next step.

  1. **Feasibility of Hardcoding (Level 1)**  
     - *Question*: Can the task be solved by a set of deterministic, context-free rules that cover all expected cases without ambiguity?  
     - *If yes*: Build at Level 1.  
     - *If no*: Proceed to Step 2.

  2. **Availability of Training Signal (Level 2)**  
     - *Question*: Is there a clear, timely, and unambiguous feedback signal available for the agent's actions?  
     - *Criteria*:  
       - *Clear*: The outcome (success/failure) can be objectively measured.  
       - *Timely*: Feedback is available within a time frame that allows for learning (e.g., not months later).  
       - *Ample*: Enough examples to learn from without excessive cost.  
     - *If yes*: Consider Level 2. But we must check if simulation is possible (Level 3).  
     - *If no*:  
       - Can the task be handled by a human? If yes, then build a tool for humans (not an autonomous agent).  
       - If the task must be automated and no signal, then we might need Level 3 or 4, but without a signal, Level 2 is impossible. Proceed to Step 3 to see if simulation can replace real feedback.

  3. **Feasibility of Simulation (Level 3)**  
     - *Question*: Can we build a simulator that accurately predicts the outcomes of actions without real-world execution?  
     - *Criteria*:  
       - The environment is predictable enough that simulation errors are acceptable.  
       - The cost of building the simulator is less than the cost of real failures.  
     - *If yes*: Build at Level 3.  
     - *If no*:  
       - If we must automate, then we may need Level 4 (using external tools to reduce the burden on the agent's internal simulation) or fall back to human-in-the-loop.  
       - Proceed to Step 4.

  4. **Need for External Scaffolding (Level 4)**  
     - *Question*: Does the task require reasoning that exceeds the capacity of the model (e.g., complex calculations, large context, multi-step planning) and can be offloaded to external tools or structured processes?  
     - *If yes*: Build at Level 4.  
     - *If no*: Then we have a contradiction. If we got here, we must have ruled out Levels 1-3. Therefore, the task is not automatable at an acceptable risk with current technology. **Do not build** or design a human-assisted process.

  Additionally, at every step we should consider:

  - **Risk of Failure**: If the failure mode is catastrophic (e.g., losing money, legal issues, public embarrassment), we might downgrade the level (e.g., from Level 2 to Level 3 to avoid real failures) or require human oversight even if a higher level is technically possible.
  - **Cost-Benefit**: The cost of building the level (including data collection, simulator development, tooling) must be justified by the benefit.

  ### Judgment Calls

  We'll explicitly note where judgment is required:

  - Step 1: Judgment on whether rules cover all cases.
  - Step 2: Judgment on clarity and timeliness of feedback.
  - Step 3: Judgment on simulator accuracy and cost.
  - Step 4: Judgment on whether external tools can effectively extend reasoning.

  ### Procedure Flowchart

  ```
  Start
  │
  ├─ Step 1: Can we hardcode? (Level 1) → Yes → Build Level 1
  │   No → 
  │
  ├─ Step 2: Is there a clear, timely, and ample feedback signal? 
  │   │
  │   ├─ Yes → Then Level 2 is possible. But check Step 3 for simulation.
  │   │
  │   └─ No → 
  │        ├─ Can a human do it? → Yes → Build a human tool (not autonomous agent)
  │        └─ No (must automate) → Proceed to Step 3.
  │
  ├─ Step 3: Can we build a simulator? 
  │   │
  │   ├─ Yes → Build Level 3
  │   │
  │   └─ No → Proceed to Step 4.
  │
  ├─ Step 4: Can external tools bridge the gap? 
  │   │
  │   ├─ Yes → Build Level 4
  │   │
  │   └─ No → Do not build (or human-in-the-loop)
  │
  └─ At any step, if the failure risk is too high, downgrade to a safer level or add safeguards.
  ```

  ### Running the Cases

  We'll run the three cases: refund agent, PR commenter, ops summarizer.

  #### Case 1: Refund Agent
  - **Task**: Drafts support decisions for refunds.
  - **Failure Mode**: Paying out money we shouldn't (financial loss).

  **Step 1: Hardcoding (Level 1)**
  - Can we write rules for all refund scenarios? Probably not. Refund decisions often depend on complex customer histories, product details, and discretionary factors. Rules might become too complex and brittle.
  - *Verdict*: No, proceed to Step 2.

  **Step 2: Feedback Signal (Level 2)**
  - Is there clear, timely, and ample feedback?
    - *Clear*: We can define success (customer retention, no unjust refund) and failure (unjust refund, customer churn). However, some outcomes (e.g., long-term customer loyalty) are ambiguous and delayed.
    - *Timely*: Feedback on whether the refund was justified may take time (e.g., fraud detection might be delayed). Also, the outcome of a refund decision (e.g., customer satisfaction) might not be immediate.
    - *Ample*: We have historical refund data, but it might not cover edge cases.
  - *Judgment*: The signal is somewhat clear but not fully timely (fraud can take weeks to appear) and may be ambiguous (customer retention is multi-factorial). 
  - *Verdict*: Not ideal for Level 2. Proceed to Step 3.

  **Step 3: Simulation (Level 3)**
  - Can we build a simulator? We could simulate customer behavior and refund outcomes, but it's hard to model human behavior and fraud accurately. The cost of a wrong refund is high, so the simulator must be very accurate.
  - *Judgment*: Building a high-fidelity simulator for all scenarios is expensive and likely imperfect. 
  - *Verdict*: Not feasible for Level 3. Proceed to Step 4.

  **Step 4: External Scaffolding (Level 4)**
  - Can we use external tools? Yes, we can use:
    - Databases to pull customer history, product details.
    - Rules engines for policy checks.
    - Calculators for refund amounts.
    - The agent can generate a draft decision with justifications, but a human approves it (human-in-the-loop as a tool?).
  - However, note: Level 4 includes Level 3 (internal simulation) plus external tools. But we ruled out Level 3. So we must rely on external tools to avoid the need for heavy simulation.
  - *Verdict*: We can build a Level 4 system that uses external data and rules to constrain the agent. But due to the high risk, we should not fully automate. Instead, use the agent as a draft generator with human approval (so not fully autonomous). 

  **Risk Consideration**: Because the failure mode is financial loss, we cannot afford full automation. The verdict is to build at Level 4 but with human-in-the-loop (so the agent is an assistant, not autonomous). Alternatively, we might classify this as a Level 1 system with very strict rules and no learning, but that might not be flexible enough. 

  **Final Verdict**: Do not build an autonomous agent. Instead, build a Level 4 tool that assists a human by pulling relevant data and suggesting a decision, but the human must approve. This is not one of the four levels for an autonomous agent, so we classify it as "not autonomous" and not built as an agent.

  #### Case 2: PR Commenter
  - **Task**: Comments on pull requests (e.g., code style, potential bugs).
  - **Failure Mode**: Being annoying (too many false positives) and being wrong in public (embarrassment).

  **Step 1: Hardcoding (Level 1)**
  - Can we write rules? For simple style checks (e.g., linting), yes. But for more complex comments (e.g., potential bugs) it's hard to cover all cases with rules.
  - *Verdict*: Partially, but not for complex comments. Proceed to Step 2.

  **Step 2: Feedback Signal (Level 2)**
  - Is there feedback?
    - *Clear*: We can get feedback from the PR author and reviewers (e.g., thumbs up/down on comments). Also, we can track if the comment led to a code change.
    - *Timely*: Feedback is immediate (within the PR process).
    - *Ample*: There are many PRs, so data is ample.
  - *Verdict*: Yes, good feedback signal. So Level 2 is possible.

  **Step 3: Simulation (Level 3)**
  - We can simulate by having the agent generate comments on historical PRs and compare with what happened. But note: the agent might learn from real feedback without simulation. However, to avoid being annoying in real PRs, we might want to simulate first.
  - *Judgment*: Building a simulator might be feasible but not necessary because the feedback is timely and the cost of being wrong is not catastrophic (it's annoyance, not money loss). We can start with Level 2 and if the false positive rate is too high, we can add simulation later.
  - *Verdict*: Skip Level 3 and go with Level 2, but with a rate limiter (to avoid spamming) and an easy way for developers to mute the bot.

  **Risk Consideration**: The failure mode (annoyance and public wrongness) is moderate. We can mitigate by:
     - Starting in a low-stakes environment (e.g., internal PRs only).
     - Allowing users to disable the bot.
     - Making it clear the comments are suggestions.

  **Final Verdict**: Build at Level 2 (Skinnerian). The agent can learn from real feedback on PR comments. We might add some Level 4 elements (e.g., a knowledge base of coding standards) but the core is Level 2.

  #### Case 3: Ops Summarizer
  - **Task**: Writes a weekly ops summary from logs.
  - **Failure Mode**: Missing critical incidents or misrepresenting data (could lead to operational blindness).

  **Step 1: Hardcoding (Level 1)**
  - Can we write rules? For example, count the number of errors, list top issues. But to generate a narrative summary, rules might be too rigid and miss context.
  - *Verdict*: Not entirely. Proceed to Step 2.

  **Step 2: Feedback Signal (Level 2)**
  - Feedback on the summary: 
    - *Clear*? We can ask the ops team to rate the summary, but that's subjective. The true test is if the summary leads to correct actions, which is delayed and hard to measure.
    - *Timely*? The summary is weekly, so feedback might be weekly. But it's not immediate.
    - *Ample*? We have many weeks of logs, but manual feedback is costly.
  - *Judgment*: Feedback is weak and slow. Not ideal for Level 2.

  **Step 3: Simulation (Level 3)**
  - Can we simulate? We can generate summaries on past logs and compare with human-written ones. This is feasible because logs are historical data. We can use past weeks as a test bed.
  - *Verdict*: Yes, we can build a simulator (by testing on historical data). So Level 3 is possible.

  **Step 4**: We don't need to go to Level 4 because Level 3 is feasible.

  **Risk Consideration**: The failure mode (missing critical incidents) is moderate. We can mitigate by having a human review the summary before sending. But the task is well-scoped to logs and historical data, so simulation is accurate.

  **Final Verdict**: Build at Level 3 (Popperian). The agent can be trained by having it generate summaries for past weeks and comparing with human summaries (or getting simulated feedback). Then deploy to current logs.

  ### Summary of Verdicts

  1. Refund Agent: Do not build as an autonomous agent. Instead, build a human-assisted tool (Level 4-like but with human in the loop). This is a verdict you didn't want to hear (you wanted an autonomous agent?).
  2. PR Commenter: Level 2 (Skinnerian) - learn from real feedback.
  3. Ops Summarizer: Level 3 (Popperian) - train by simulation on historical data.

  ### Where the Procedure Breaks

  1. **Multi-Agent Systems**: The procedure is for single-agent capabilities. If multiple agents interact, the feedback loops become complex and the procedure doesn't account for that.
  2. **Accountability and Ethics**: The procedure focuses on technical feasibility and risk, but not on who is accountable when the agent fails or ethical considerations (e.g., bias in the refund agent). These require separate review.
  3. **Hybrid Levels**: Sometimes a capability might need a mix (e.g., Level 1 for some parts, Level 3 for others). The procedure forces one level per capability.
  4. **Misuse by Teams**: 
     - Optimistic teams might overestimate simulator feasibility (Step 3) to justify Level 3.
     - Pessimistic teams might underrate feedback signal (Step 2) to avoid Level 2 and go for Level 1, which might be inadequate.
  5. **Capabilities with No Clear Level**: 
     - Tasks that require creativity or dealing with novel situations might be forced into Level 4, but without clear tools, leading to "do not build".
     - Tasks that require real-time adaptation in unpredictable environments (e.g., driving) might not have a good simulator and no timely feedback? The procedure might say "do not build" when a human-in-the-loop is the only option.
  6. **Data Availability**: If data for simulation or training is missing, the procedure might default to "do not build" even if it's feasible to collect.

  ### Should you adopt?

  The gaps (accountability, multi-agent) are not directly addressed, but the procedure still provides a structured way to evaluate single-agent capabilities. It forces explicit consideration of feedback and simulation, which are often overlooked. The procedure is still useful if supplemented by:
     - A separate risk and accountability review.
     - A process for human-in-the-loop designs when full automation is too risky.

  Adopt it, but be aware of its limitations and complement it with other reviews.
answer: |-
  Here's a decision procedure for determining the minimum viable intelligence level for AI agents, designed for your constraints. It's structured as a flowchart with explicit exit points, risk handling, and transparency about judgment calls.

  ---

  ### **Decision Procedure: Agent Capability Level Assignment**
  **Input:** One agent capability (defined by task, inputs, outputs, failure modes)  
  **Output:** Recommended level (1-4, "Don't Build", or "Human Tool") + 1-page justification  
  **Time:** 45-60 min with PM + engineer  
  **Rules:**  
  - Terminate early if any step gives a definitive answer  
  - Document reasoning at each step  
  - Flag all judgment calls with 🟡  
  - Risk trumps cost: If failure mode is catastrophic, drop a level or add safeguards  

  #### **Step 1: Can We Hardcode Without Catastrophe?**  
  *Ask: "Can we write unambiguous if/then rules covering >95% of cases without unacceptable failure risk?"*  
  - **Yes** → **Level 1** (unless risk forces human review)  
  - **No** → Proceed to Step 2  
  *🟡 Judgment: Define "unacceptable risk" (use company risk matrix)*  
  *Data Gap: If case coverage unknown, sample 100 historical cases. <70% coverage? → No.*

  #### **Step 2: Is Timely, Unambiguous Feedback Available?**  
  *Ask: "Can we get clear success/failure signals within the agent's retraining cycle?"*  
  - **Yes** → **Level 2 candidate** (proceed to Step 3)  
  - **No** → Jump to Step 4  
  *🟡 Judgment: "Timely" = within feedback loop duration (e.g., refunds=hours, ops summaries=days)*  
  *Data Gap: If signal existence unknown, prototype data collection for 1 week.*

  #### **Step 3: Can We Afford Real Failures?**  
  *Ask: "Would 100 failures in production cause irreversible damage (reputational, legal, financial)?"*  
  - **Yes** → **Level 3 required** (simulate failures)  
  - **No** → **Level 2** (learn from real world)  
  *Exit with level unless complex reasoning needed*

  #### **Step 4: Can We Simulate the World?**  
  *Ask: "Can we build a simulator that predicts outcomes >80% as accurately as reality?"*  
  - **Yes** → **Level 3**  
  - **No** → Proceed to Step 5  
  *🟡 Judgment: Simulator accuracy threshold (use historical data for calibration)*  
  *Data Gap: If simulator feasibility unknown, build MVP simulator (1 sprint). Accuracy <80%? → No.*

  #### **Step 5: Can External Tools Prevent Disaster?**  
  *Ask: "Can calculators, APIs, or human checks cover the agent's reasoning gaps?"*  
  - **Yes** → **Level 4**  
  - **No** → **Don't Build** (or **Human Tool** if partial automation possible)  
  *🟡 Judgment: "Cover gaps" = tools reduce failure rate below risk threshold*

  ---

  ### **Case Studies with Justifications**
  **Format:** Step | Answer | Verdict | Risk Mitigation  

  #### **1. Refund Agent**  
  - **Failure Mode:** Erroneous payouts ($10k+/incident)  
  - **Step 1:** Rules can't cover complex customer histories (coverage ~60%) → **No**  
  - **Step 2:** Fraud signals arrive too late (weeks) → **No** → Skip to **Step 4**  
  - **Step 4:** No reliable simulator for customer emotion/fraud → **No**  
  - **Step 5:** External tools (transaction DB + rules engine) can constrain decisions → **Yes**  
  **Verdict:** 🛑 **Level 4** (Gregorian)  
  **Justification:** "Hardcoding impossible, feedback delayed, simulation infeasible. Tools required: Real-time spending analysis API + human approval for >$100 refunds. Max autonomy: Draft decisions."  
  *You didn't want to hear:* Full autonomy rejected due to catastrophic risk.  

  #### **2. PR Commenter**  
  - **Failure Mode:** Annoying/wrong public comments (reputational damage)  
  - **Step 1:** Can't hardcode all code review contexts → **No**  
  - **Step 2:** Immediate feedback via PR reactions/comments → **Yes**  
  - **Step 3:** 100 wrong comments = moderate reputation harm → **No**  
  **Verdict:** ✅ **Level 2** (Skinnerian)  
  **Justification:** "Clear real-time feedback (thumbs down, comment edits), low cost of failure. Mitigation: Rate limiting + opt-out per team. No simulation needed."  

  #### **3. Ops Summarizer**  
  - **Failure Mode:** Missing critical incidents (operational blindness)  
  - **Step 1:** Rules can't prioritize novel incidents → **No**  
  - **Step 2:** No timely feedback (post-mortems 2 weeks later) → **No** → **Step 4**  
  - **Step 4:** Simulator feasible (replay historical logs + compare to human summaries) → **Yes**  
  **Verdict:** ⚠️ **Level 3** (Popperian)  
  **Justification:** "Feedback too delayed for real-world learning. Simulator achievable by repurposing log replay tools. Validation: Match human summaries on 2023 incident data (85% accuracy)."  
  *Boring but correct:* Simulation cheaper than fine-tuning for this static task.

  ---

  ### **Where It Breaks**
  1. **Misclassification Cases:**  
     - **Novelty-Rich Domains** (e.g., creative tasks): Procedure underestimates Level 4 needs.  
     - **Slow-Moving Crises** (e.g., climate modeling): Step 2 feedback loops too short → unwarranted "Don't Build".  
     - **Ambiguous Human Values** (e.g., "fairness"): 🟡 judgments become arbitrary without ethics input.  

  2. **Team Exploitation Risks:**  
     - **Over-Optimists:** Will inflate simulator accuracy (Step 4) to justify Level 3.  
     - **Bureaucrats:** Use "unacceptable risk" (Step 3) to force underpowered Level 1.  
     - **Tool Enthusiasts:** Claim external tools (Step 5) exist when they don't.  

  3. **Structural Gaps:**  
     - **Multi-Agent Systems:** No coordination logic (e.g., auctions, handoffs).  
     - **Accountability:** Silent on blame assignment (requires separate RACI matrix).  
     - **Emergent Behavior:** Doesn't detect capability combinations that create new risks.  
     - **Human Replacement:** Encourages "Human Tool" fallback without labor impact analysis.  

  **Should you adopt?**  
  ✅ **Yes, but with caveats:**  
  - Covers 80% of single-agent decisions with auditable reasoning  
  - Forces explicit risk discussions (solves "loudest arguer" problem)  
  - **Supplement with:**  
    - Quarterly multi-agent threat modeling  
    - Pre-mortems for all Level 3/4 agents  
    - Ethics review when 🟡 judgments exceed 2/capability  

  For your environment, this balances speed and safety. The refund agent verdict alone proves it adds value by preventing dangerous over-automation.
