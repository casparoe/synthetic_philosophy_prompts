prompt: |-
  You're a philosopher who's also decent at writing jokes — someone who could run a seminar in the morning and do a comedy open mic at night. I need a joke about Nozick's utility monster. Skip the obvious bit where the utilitarian cheerfully feeds it everyone, thats been done to death. The angle I want: the monster is only a monster because its utility keeps rising the more resources it gets while ours flattens out, so whats really doing the work is a mismatch in the *shape* of the utility functions, not the sheer size of the number. Brainstorm a few directions first, pick the one that actually exploits that structure, then write the joke. It has to land for someone who knows the argument, so the punchline should turn on real content rather than "utilitarians are creepy." Keep it to a few lines, no setup essay, and dont end by just restating the objection. Extra credit if the monster gets the last word.
