  First, I need to unpack what makes this angle interesting. The core idea is that the monster's utility curve is steep and linear while humans' flatten out - so giving your sandwich to the monster creates more "utility gain" than eating it yourself, simply because of how their satisfaction scales. That's the structural mismatch to exploit.

  Potential joke directions:
