answer: |-
  ### The two camps, as fairly as I can put them
  **Camp One (Economist/Anti-Corruption NGO):** Corruption is objectively defined as the *abuse of public office for private gain*. It’s a measurable phenomenon that distorts markets, deters investment, erodes public trust, and cripples service delivery (e.g., schools, infrastructure). It persists where formal institutions are weak, accountability is low, and impunity is high. Solutions focus on strengthening legal frameworks, transparency, and institutional integrity. The harm is systemic and quantifiable.

  **Camp Two (Anthropologist/Critical Development):** The "abuse of public office" definition imposes a Western, state-centric moral framework that mislabels contextually legitimate practices (kinship obligations, reciprocal gift-giving, patronage networks) as corruption. These practices often function as essential social glue or pragmatic workarounds in weak states. Measuring them as "corruption" ignores local meaning, risks cultural imperialism, and overlooks how *formal* systems can be the primary predators. Legitimacy is defined from within the system.

  ---

  ### What kind of disagreement this is
  Your hypothesis is **sharply perceptive**. This isn’t one dispute but entangled layers, and separating them clarifies the stalemate:

  *   **(a) Verbal/Definitional Dispute (Descriptive vs. Evaluative):** This is foundational. "Corruption" is *inherently evaluative* for Camp One (it *means* "bad abuse"). Camp Two argues it’s often used *descriptively* for neutral/local practices, smuggling in the evaluation illegitimately. Much heat comes from Camp One hearing Camp Two *defining corruption away* (denying the bad), while Camp Two hears Camp One *defining local practices as bad by fiat*. **Verdict: Central & Load-Bearing.**

  *   **(b) Disagreement on Explanandum (Insider Meaning vs. Systemic Outcome):** Absolutely distinct. Camp Two seeks a *thick description*: "Why does Actor X see this as right/necessary?" Camp One seeks *functional analysis*: "Why does Practice Y produce suboptimal outcomes Z?" **Verdict: Separate & Both Valid.** They *can* coexist – a practice can be locally legitimate *and* systemically harmful. The conflict arises when one camp dismisses the other’s question as irrelevant.

  *   **(c) Hidden Empirical Question (Functional vs. Dysfunctional Informal Channels):** This *is* testable in principle but fiendishly hard. Does a specific patronage network lubricate a stuck bureaucracy or cannibalize public resources? Does "gift-giving" ensure service access or create exclusionary tollgates? **Verdict: Genuine & Underdeveloped.** Neither camp prioritizes this granular, context-specific, mixed-methods research. Camp One assumes dysfunction; Camp Two often assumes functionality/necessity. The definitional fog (a) and normative rift (d) prevent clear framing and testing.

  *   **(d) Bedrock Normative Dispute (Authority of Insider Perspective):** **This is the ultimate load-bearing wall.** Camp One: Harm (inefficiency, inequality, injustice) can be objectively assessed *regardless* of insider intent or perception. A practice extracting rents from the poor is corrupt *even if* participants frame it as obligation. Camp Two: Labeling a practice "corrupt" without respecting its internal logic and legitimacy is epistemically violent and analytically useless; the insider perspective *is* authoritative for understanding the practice *as a social fact*. **Verdict: The Core Irreconcilable Difference.** This is about fundamental values (universal harm vs. cultural relativism/anti-imperialism) and won't be resolved by data. Camp One sees Camp Two as morally relativist; Camp Two sees Camp One as neo-colonial.

  **Which strand does the most work?** **(d) is the deepest driver**, fueling the definitional fight (a). The empirical question (c) is neglected *because* of the entanglement with (a) & (d). The differing explananda (b) are a consequence – the camps ask different questions *because* of their normative and definitional starting points.

  ---

  ### Is the evidence contaminated?
  **Yes, significantly.** Dominant corruption indices (CPI, WGI) rely heavily on perceptions of *international business actors and Western experts*. This inherently privileges Camp One's worldview: it measures how *outsiders* (albeit informed ones) perceive the environment *for formal business/global capital* through Camp One's definitional lens. It systematically under-reports practices perceived as legitimate *internally* but "corrupt" *externally*, and overlooks state predation masked as formality. This creates a feedback loop: "evidence" of corruption is generated using tools biased towards one camp's framework, making objective assessment of (c) nearly impossible with existing macro-data. Your pipeline insight is correct.

  ---

  ### What would count as progress
  Progress lies in *disentangling* the questions and abandoning the fantasy of a single, universal "corruption" metric:
  1.  **Drop the Monolithic Term:** Explicitly separate analyses of:
      *   **Predatory Extraction:** Practices universally harmful (embezzling school funds, judicial bribery denying basic rights).
      *   **Informal Reciprocity/Governance:** Practices with complex, context-dependent functionality (patronage hiring, "speed money," customary gifts).
      *   **State Predation:** "Legal" rent-seeking via captured formal institutions.
  2.  **Contextual, Mixed-Methods Research:** Focus on (c): Rigorously study *specific practices* in *specific contexts* to determine: Who benefits/harms? Does it circumvent or enable state predation? Is it inclusive/exclusive? Combine ethnography (insider view) with outcome tracking (service delivery, economic distortion).
  3.  **Outcome-Based Measures (for Harm):** Develop indicators focused on measurable *harms* Camp One cares about (e.g., inequality in service access, unexplained wealth disparities, contract award anomalies, procurement inefficiency) *without* presuming the label "corruption." This sidesteps the definitional morass.
  4.  **Acknowledge the Normative Chasm:** Stop pretending (d) can be resolved empirically. Be transparent: "We are measuring practices we define as harmful based on criteria X, recognizing others may interpret them differently."

  ---

  ### Bottom line
  The debate is fundamentally irresolvable because it conflates empirical, definitional, and irreconcilable normative disputes. Progress requires abandoning the search for a universal "corruption" definition and metric, disentangling the distinct questions involved, and focusing on context-specific analysis of harms and functions.
