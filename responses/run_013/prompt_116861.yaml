  I'll structure my response as requested. First, fairly summarizing both camps in ~150 words to avoid caricature. Then ~400 words analyzing his hypothesis: I agree it's insightful layering - (a) and (d) are most critical, with (d) being the load-bearing rift. (b) is valid but secondary, while (c) is empirically testable yet understudied due to definitional entrenchment. Next, ~150 words on evidence contamination: yes, perception-based metrics inherently favor Camp 1's framework. For progress (~200 words), I'll suggest abandoning "corruption" as a monolithic term, developing typologies (predatory vs. functional), mixed-methods research, and outcome-based measures. Bottom line: the debate is fundamentally about incompatible moral premises, not resolvable through data alone. 

