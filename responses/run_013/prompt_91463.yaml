  ### Decision Procedure for Canine Disposition Assessment  
  **Goal:** Distinguish between absent dispositions, masked dispositions, finkish dispositions, and mimicry (one-off incidents). Focus on key traits: **stranger-directed aggression**, **resource guarding**, **dog-directed aggression**, and **handling tolerance**.  

  **Core Principles:**  
  1. **No Vibe Checks**: Every step must have clear, observable criteria.  
  2. **Handoffs Are Mandatory**: Volunteers *never* decide risk (euthanasia/adoption). The director decides risk; staff behaviorists resolve ambiguities.  
  3. **Honest Uncertainty**: If a disposition is suspected but unobserved, the form *must* flag it.  
  4. **Time Limit:** 45 minutes per dog (including setup).  
  5. **Safety First:** Stop testing if the dog shows Level 3 aggression (see below). Muzzles and barriers are used if aggression is suspected.  

  **Key Distinctions Surviving Compression:**  
  | Term          | Meaning (Simplified for Form)                  | How Detected                          |  
  |---------------|------------------------------------------------|---------------------------------------|  
  | **Absent**    | No disposition exists.                         | No aggression/stress in multi-context tests. |  
  | **Masked**    | Disposition exists but hidden by environment.  | Aggression appears when context changes. |  
  | **Finkish**   | Disposition exists but suppressed by testing.  | Stress signs without aggression.      |  
  | **Mimicry**   | One-off incident (not a trait).                | Aggression inconsistent or linked to temporary cause. |  

  **Dropped Without Loss:**  
  - Philosophical terms (e.g., "finkishness" → "suppressed during test").  
  - Contexts you can’t replicate (e.g., home with children).  
  - Overly subtle stress signals (e.g., pupil dilation → too hard for volunteers).  

  ---

  ### Step-by-Step Procedure  
  **Pre-Assessment Setup (5 mins):**  
  1. **Review Medical Records:** Note injuries, illness, or pain (e.g., limping, ear infection).  
  2. **Kennel Observation:** Watch dog for 2 mins. Note:  
     - **Stress Signs:** Panting, pacing, hiding, trembling.  
     - **Relaxed Signs:** Loose body, wagging tail, approaching front.  
  3. **Equipment:** Fake hand, decoy dog (barrier-used), low/high-value toys, kibble.  

  **Assessment Flow (40 mins):**  
  ▶ **Phase 1: Initial Tests (Standard Context - Kennel/Run)**  
  *Run all tests below in order. Record reactions using:*  
  - **Aggression Levels:**  
    - **0:** No reaction (relaxed).  
    - **1:** Mild (growl, snarl, stiff body).  
    - **2:** Moderate (lunge, snap, air-bite).  
    - **3:** Severe (contact bite, attack).  
  - **Stress Signs:** Lip licking, yawning, whale eye, avoiding handler.  

  | Test Order | Disposition              | Test Description                      |  
  |------------|--------------------------|---------------------------------------|  
  | 1          | Handling Tolerance       | Gently touch ears, paws, tail.        |  
  | 2          | Resource Guarding        | Fake hand near full food bowl.        |  
  | 3          | Stranger-Directed Aggro. | Stranger walks past kennel, then approaches. |  
  | 4          | Dog-Directed Aggro.      | Decoy dog walked past (barrier).      |  

  ▶ **Phase 2: Mimicry Check (If Aggression ≥ Level 1)**  
  *For any test with Level 1–3 aggression:*  
  1. **Check for Temporary Cause:**  
     - Injury/illness noted pre-assessment? → **Handoff to behaviorist.**  
     - Sudden noise/distraction during test? → Note on form.  
  2. **Repeat Test Once (if Level 1–2 only):**  
     - Identical to initial test.  
     - **Aggression repeats?** → Disposition **present.**  
     - **No aggression?** → **Handoff to behaviorist** (mimicry suspected).  
  3. **If Level 3 aggression:** → **Stop test.** Disposition **present.** → Director decides risk.  

  ▶ **Phase 3: Masking Check (If Aggression = Level 0)**  
  *For any test with no aggression:*  
  1. **Change Context (5-min setup):**  
     - New location (e.g., from kennel to yard/meet room).  
     - New handler (if safe).  
  2. **Repeat Test:** Same as initial.  
     - **Aggression ≥ Level 1?** → Disposition **present (masked in initial).**  
     - **Aggression = Level 0?** → Proceed to Finkishness Check.  

  ▶ **Phase 4: Finkishness Check (If Level 0 in Both Tests)**  
  *For dispositions passing Phases 1 & 3:*  
  1. **Review Stress Signs:** From both tests.  
     - **Stress signs present?** → **Handoff to behaviorist** (suppressed during test).  
     - **No stress signs?** → Disposition **absent.**  

  ---

  ### Form Compression & Volunteer Guidance  
  **Final Form Fields (Per Disposition):**  
  - **Disposition Status:**  
    - `[ ] ABSENT` (No aggression/stress in both contexts).  
    - `[ ] PRESENT` (Aggression observed and consistent).  
    - `[ ] INCONCLUSIVE` (Handoff to behaviorist/director).  
  - **Comments:**  
    - *Why inconclusive?* (e.g., "Stress in both tests, no aggression").  
    - *Observed triggers* (e.g., "Growled when stranger approached").  

  **What Volunteers Write When Disposition Is Unobservable:**  
  > *"Disposition may be present but not observed due to [masking/finkish/mimicry]. Recommend behaviorist review for: [specific concern]."*  

  ---

  ### Limitations & Where It Misfires  
  **Honest Flaws:**  
  1. **Masking in All Contexts:** A dog shut down in *all* shelter environments may show aggression only in a home. *Mitigation:* Flag dogs with high kennel stress for behaviorist review.  
  2. **Finkishness False Negatives:** Volunteers may miss subtle stress signs. *Mitigation:* Use simple, binary stress criteria (e.g., "lip licking = yes/no").  
  3. **Mimicry Overconfidence:** A one-off incident might be misread as a disposition without history. *Mitigation:* Always hand off to behaviorist if aggression is inconsistent.  
  4. **Unavoidable Judgment Calls:**  
     - Stress sign interpretation (volunteers get 10 mins of video training).  
     - Deciding "safe to repeat" for Level 1–2 aggression.  
  5. **What It Can’t Settle:**  
     - **Residual Risk Acceptance:** Not a disposition question → Director decides based on policy.  
     - **Breed/Size Bias:** A Chihuahua’s snap vs. a Mastiff’s snap → Director contextualizes risk.  

  **Defensibility to Board:**  
  - "We used a multi-context test to rule out masking."  
  - "Inconclusive results were escalated to experts."  
  - "We never ignore stress without aggression."  

  ---

  ### End-to-End Case Examples  
  **Case 1: Suspected Masking (Resource Guarding)**  
  - **Initial Test (Kennel):** Fake hand near bowl → Level 0 (no reaction).  
  - **Masking Check (Yard):** Fake hand near bowl → Level 2 (snap).  
  - **Result:** Disposition **PRESENT** (masked in kennel).  
  - **Form Comment:** *"Resource guarding observed in yard test only. Masked in kennel."*  

  **Case 2: Suspected Finkishness (Stranger-Directed Aggression)**  
  - **Initial Test:** Stranger approach → Level 0, but lip licking/avoidance.  
  - **Masking Check:** New handler, yard → Level 0, but whale eye/trembling.  
  - **Finkishness Check:** Stress signs in both tests → **INCONCLUSIVE**.  
  - **Handoff to Behaviorist:** *"No aggression but stress signs in all tests. Suppression suspected."*  

  **Case 3: Unfavorable Outcome (Your Favorite Dog)**  
  - **Dog:** 3 y/o retriever mix, friendly in shelter.  
  - **Handling Tolerance Test:**  
    - Initial: Touch paws → Level 0.  
    - Masking Check: New handler, touch paws → Level 0.  
    - Finkishness: No stress signs → **ABSENT**.  
  - **Stranger-Directed Aggression Test:**  
    - Initial: Stranger approaches → Level 0.  
    - Masking Check: Stranger in hat/glasses → Level 3 (bite attempt).  
  - **Result:** Disposition **PRESENT** (masked with "default" stranger).  
  - **Director’s Risk Decision:** Euthanasia (severe aggression to unfamiliar triggers).  
  - **Why Defensible:** Trigger-specific aggression was revealed via context change.  

  ---

  ### Final Notes  
  - **Volunteer Script:** "If you see aggression, ask: *Was this a fluke?* If you see nothing, ask: *Was the dog too stressed to react?*"  
  - **Director’s Role:** Resolve "inconclusive" flags, approve euthanasia/adoption.  
  - **Behaviorist’s Role:** Design deeper tests (e.g., hidden-observer setup for finkishness).  

  This procedure replaces simple conditionals with context-switching and stress tracking. It won’t catch everything—but it turns metaphysics into actionable, defensible steps.
