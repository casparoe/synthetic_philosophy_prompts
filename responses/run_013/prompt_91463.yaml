  2. Masking: the disposition is present but not manifested due to current conditions (e.g., stress, environment)
  3. Finkishness: the disposition is present but suppressed exactly when the stimulus is applied (so the test itself prevents manifestation)
  4. Mimicry: the behavior (e.g., a bite) was due to a one-off cause (like pain or accident) and not a disposition.

