     Debrief mapping:

          What happened in the game:
            - We had a system (rules and axioms) that allowed us to talk about what is provable in the system (via the L operator).
            - We added an axiom (3) that said: "If it is provable in this system that this very axiom is provable, then we hand over the prize."
