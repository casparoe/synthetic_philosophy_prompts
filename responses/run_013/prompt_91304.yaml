prompt: |-
  So I'm a junior and I run the Friday lunch thing in room B14 that's technically called "Foundations of Reasoning" because that's what we had to put on the form to get a room, but really it's 14 of us eating chips and arguing about stuff until the bell. Next month is my turn to lead and I get the whole 80 minutes — whiteboard, index cards, a projector nobody ever uses, and about $20 of club money I can spend on candy. Here's what I want to build the session around. My older brother told me about this thing that I can't stop thinking about, and please correct me if I've garbled it: there's a theorem (Löb's? Löbian? something like that) which says that if a set of rules is strong enough to reason about its own proofs, and it can prove the sentence "if this sentence is provable then it's true," then it already proves the sentence, no ifs. The upshot, the way he put it, is that you can't fix a reasoner by adding an axiom saying "whatever I prove is true" — that axiom doesn't make it more reliable, it makes it able to derive literally anything, including stuff it knows is false. Trusting yourself in general is incoherent; the only version that actually works is trusting yourself about stuff you already believe. And he says the same wall shows up when you try to trust the *next* version of yourself or some successor agent — which is why people trying to build systems that rewrite their own code and then certify the rewrite keep getting stuck.

  So what I want from you is an activity, not a lecture, where the rules and incentives do the damage and we only figure out what happened at the end. Ideally: you hand us a little rulebook of our own, we spend the middle chunk of the session only acting on things we can license out of it (I need this to be doable in real time with index cards or the whiteboard — none of us are going to write actual proofs, so I need a stripped-down stand-in for "provable" that's honest enough that the reveal doesn't feel like a cheat when it comes), and then at some point we use the rulebook to license something obviously stupid — everyone hands over their candy, or we all vote for an option nobody wants — and it's airtight, nobody can find the mistake, and the debrief is where it clicks. If you can also fit in a second phase where we split in two and one half has to certify that the other half is trustworthy, and we hit what feels like the same wall from the other side and then find the one loophole (you can only vouch for them about things you already believe), that would be amazing — but if that's too much for 80 minutes tell me what to cut and why.

  Deliverables, please: the rules in a form I can print on one sheet, the materials, the scoring (points and candy, no real money), the exact thing I say in the first two minutes before anyone knows where this is going, a minute-by-minute timeline for the 80 minutes, and the debrief — which should map what actually happened onto the parts of the idea, and be straight with me about which part of the idea the game can't reproduce and that I'll just have to tell them. Also tell me what will predictably go wrong the first time I run it (my guesses: someone spots the loophole in minute ten and the whole thing deflates, or we spend half an hour arguing about what counts as licensed) and what I should do when that happens. Priya is going to try to break it on purpose and I'd rather that be part of the design then a disaster, so if there's a version where the saboteur is a feature, say so.
