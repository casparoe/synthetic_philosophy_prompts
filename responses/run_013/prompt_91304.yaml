            - The connection to Löb's theorem: in any system that can talk about its own proofs, if it can prove that "if this sentence is provable then P", then it must prove P.
            - The implications: you can't add an axiom that says "if I am provable then I am true" without getting P, even if P is arbitrary. In fact, if the system is inconsistent, then it can prove anything? But here we see that even a consistent system can be forced to prove a particular P by such an axiom.
