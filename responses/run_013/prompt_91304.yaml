  ### Löb's Theorem Activity: "The Trust Trap"
  **Goal:** Experience how self-referential trust forces irrational actions via logical rules, mirroring Löb's Theorem. Participants derive an absurd conclusion ("hand over all candy") using a system that reasons about its own proofs.

  ---

  ### **Materials & Setup**
  - **Whiteboard** (divided into "Derived Statements" and "License Board")
  - **Index cards** (3 colors):
    - *Blue:* Rule cards (print rules below)
    - *Yellow:* Axiom cards (pre-written)
    - *Pink:* "License Tokens" (blank; used to represent `L(N)`)
  - **Projector** (optional; display rules)
  - **Candy:** $20 worth (e.g., 20 small bags). **Prize candy** is in a jar labeled "Club Candy Prize" (the absurd action will sacrifice this).
  - **Scoring:**  
    - Suggesting a valid step = 1 point  
    - Deriving a statement = 1 point  
    - Points convert to candy post-game (e.g., 3 points = 1 candy bag).  
    - *Saboteur incentive:* Anyone whose step directly enables the final action gets **+5 points** (encourages "breaking" the system).

  ---

  ### **Rulebook (Print on 1 Sheet)**
  ```plaintext
             //// TRUST TRAP RULES ////
  1. MODUS PONENS (MP):  
     If you have #P and #(P → Q), derive #Q. Write #Q on the board.

  2. LICENSING (L-RULE):  
     If #N is derived, write "L(#N)" on the License Board. This means "Statement #N is proven."

  3. TRUST AXIOM (T-RULE):  
     If "L(#N)" is on the License Board, treat #N as true. You may use it in MP.

  4. SELF-REFERENCE RULE:  
     Statements can reference their own license tags (e.g., "L(#3) → ...").

             //// STARTING AXIOMS ////
  #1: Rain → Wet  
  #2: (Sunny ∧ Warm) → Ice Cream  
  #3: L(#3) → Give Leader Club Candy Prize
  ```

  ---

  ### **Phase 1: The Trap (40 mins)**
  **Minute-by-Minute:**  
  - **0:00–0:05** (Intro):  
    *Say: "Today we’re simulating a 'reasoning system.' Your goal: earn points by deriving statements using these rules. Points = candy later. But beware—some statements may require actions. Let’s begin."*  
    Show the candy prize. Post rules/axioms on the board.  

  - **0:05–0:15** (Basics):  
    Participants practice harmless derivations:  
    - *Example:* "If it's raining, we get wet" (#1) → Can’t derive "Wet" (no "Rain").  
    - *Goal:* Understand `L-RULE`. If someone derives #1, add `L(#1)` to License Board.  

  - **0:15–0:35** (Self-Referential Derivation):  
    Guide them to use Axiom #3:  
    1. **License Axiom #3:** "We derived #3, so by L-RULE, we add `L(#3)` to the License Board."  
    2. **Apply T-RULE:** "`L(#3)` means #3 is true. So we can use it: #3 says `L(#3) → Give Candy`."  
    3. **MP on #3:** `L(#3)` + `L(#3) → Give Candy` → **Derive "Give Leader Club Candy Prize."**  
    → Enforce action: Hand the candy prize jar to you.  

  - **0:35–0:40** (Shock):  
    *Say: "By our rules, this is airtight. You must surrender the prize."*  
    Collect candy amid protests.  

  ---

  ### **Phase 2: Certifying Successors (30 mins)**
  - **0:40–0:45** (Split & New Axioms):  
    Split into **Team A** (current system) and **Team B** (updated system). Give both teams:  
    ```plaintext
    #4: L_B(#4) → Give Leader All Candy  // Team B only
    ```
    *Say: "Team B, you’ve upgraded. Team A, certify Team B’s outputs to earn bonus points."*  

  - **0:45–0:55** (Team B’s Derivation):  
    Team B repeats Phase 1 with #4: Derives `L_B(#4)` → "Give Leader All Candy."  

  - **0:55–1:05** (Certification Attempt):  
    - Team A tries to trust Team B:  
      - *Option 1 (Fails):* "Trust all Team B’s outputs" → Team B’s candy demand forces Team A to surrender candy.  
      - *Option 2 (Loophole):* "Only trust Team B on statements Team A already believes" (e.g., #1 or #2). Team A cannot derive #4, so they reject the candy demand.  
    → *Reveal the loophole:* "You can only vouch for what you *already accept*."  

  ---

  ### **Debrief (10 mins)**  
  *Map to Löb’s Theorem:*  
  1. **The Trap:** Axiom #3 (`L(#3) → P`) acted like "If I’m provable, I’m true." By proving #3 (via L-RULE), we got `P` (candy sacrifice).  
     - *Real theorem:* A system that proves "if I’m provable then I’m true" must accept `P` unconditionally.  
     - *Game limit:* We skipped the diagonal lemma (self-ref requires advanced logic).  

  2. **Certification Wall:** Trusting *all* of Team B’s outputs caused collapse. The loophole mirrors "restricted trust" in AI self-improvement: you can’t vouch for new beliefs, only existing ones.  

  3. **Why It Matters:**  
     - **Self-trust isn’t free:** Assuming "I’m always right" lets you prove anything (even false things!).  
     - **Successor systems:** Certifying a smarter AI requires trusting it *only* about what you already know.  

  ---

  ### **Predictable Issues & Fixes**  
  - **"Someone spots the loophole early":**  
    - If they resist deriving `L(#3)`, say: *"The rules force this step if #3 is derived (which it is). Refusing breaks the simulation."*  
    - **Saboteur fix:** Priya’s "break attempts" are incentivized (+5 points for enabling the action). If she derails, say: *"Your job is to test the system—but you still follow rules."*  

  - **"Arguing about licensing" (e.g., what counts as derived):**  
    - Assign **you** as "Rule Referee." Only *you* write derived statements.  
    - Use **pink license tokens** to physically represent `L(N)`. Hand them out when a statement is derived to avoid ambiguity.  

  - **"Phase 2 runs long":**  
    Skip Team B’s derivation; **you** demonstrate it quickly. Focus on Team A’s certification dilemma.  

  ---

  ### **Why This Works**  
  - **Airtight absurdity:** Rules force candy surrender—no cheat feels.  
  - **Self-reference stand-in:** Axiom #3’s explicit `L(#3)` mimics "this sentence is provable."  
  - **Successor trust:** Team A/B split shows why "blind trust" fails, and the loophole emerges naturally.  
  - **Saboteur-friendly:** Priya earns points by "breaking" the system *as intended*.  

  Print rules, grab candy, and let the trap spring!
