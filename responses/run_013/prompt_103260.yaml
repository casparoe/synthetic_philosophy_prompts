answer: |-
  ### Session Design: "The Threshold Commitment Game"

  #### **Overview**
  This 90-minute session uses a threshold-based coordination game to create experiential friction between reductionist and non-reductionist accounts of joint action. Students confront the gap through three stages:  
  1. **Individual Optimization**: Achieve a group outcome via self-regarding actions and common knowledge, yet feel no "togetherness."  
  2. **Explicit Joint Commitment**: Form and execute a joint plan, experiencing unmistakable collective agency.  
  3. **Private Deviation**: One member acts on a hidden reason that fulfills their role but violates the group’s agreement, surfacing normative obligations.  

  #### **Materials**  
  - Paper slips (16 per stage) for secret choices  
  - Pens (16)  
  - Whiteboard to track scores (symbolic points)  
  - Secret note for Stage 3 (pre-written)  

  #### **Roles**  
  - **All students**: Participants in the coordination game.  
  - **Instructor**: Facilitator, timekeeper, and "banker" (assigns points).  
  - **Deviant (Stage 3)**: One secretly assigned student who receives a private incentive.  

  ---

  ### **Stage-by-Stage Rules & Payoffs**  
  **Game Objective**: Each round, all players choose a number **1–5**. The group succeeds if **every number is ≥3** (threshold met).  

  | Outcome          | Individual Points |  
  |------------------|-------------------|  
  | Group success    | 10 points         |  
  | Group failure    | 0 points          |  

  #### **Stage 1: Individual Optimization**  
  - **Rules**:  
    1. No talking or signaling.  
    2. Each acts independently to maximize their own points.  
    3. Common knowledge: All know the rules, know others know, etc.  
  - **Intent**: Players see they *can* succeed individually (by choosing ≥3) but feel no collective ownership.  
  - **Predictable Outcome**: Likely failure (someone chooses 1 or 2 "selfishly"), but even success feels accidental.  

  #### **Stage 2: Explicit Joint Commitment**  
  - **Rules**:  
    1. 10-minute group discussion to form a joint plan (e.g., "Everyone choose 3").  
    2. All must verbally agree to the plan.  
    3. Choices are written secretly (to mirror Stage 1).  
  - **Intent**: Success now feels earned *together*, contrasting with Stage 1’s "luck."  

  #### **Stage 3: Private Deviation**  
  - **Rules**:  
    1. Group forms a new joint plan (e.g., "Everyone choose 3").  
    2. Instructor secretly gives one student a note:  
       *"Private instruction: Choose 4. You’ll get +10 bonus points. The group will still succeed if others follow the plan (since 4≥3). Do not reveal this."*  
    3. All write choices secretly.  
  - **Intent**: The deviant delivers their "part" (group succeeds) but violates the joint commitment, forcing debate about obligation.  

  ---

  ### **Timeline (90 Minutes)**  
  **0–5 min: Setup**  
  - Arrange chairs in a circle. Distribute paper/pens.  
  - Explain rules: *"Your goal is to earn points by meeting the group threshold (all numbers ≥3). Points are symbolic—no real stakes."*  

  **5–20 min: Stage 1 (Individual Optimization)**  
  - Silence enforced. Students write numbers secretly.  
  - Reveal choices. Instructor tallies success/failure and awards points on the board.  
  - **Debrief Qs**:  
    - *"Did we succeed? Why?"*  
    - *"Did it feel like *we* acted together? Why not?"*  
    - Highlight: Individual intentions (max points) + common knowledge were present but yielded no "we."  

  **20–35 min: Stage 2 (Explicit Joint Commitment)**  
  - Groups discusses/agrees on a plan (e.g., "All choose 3").  
  - Secretly write choices. Reveal and score.  
  - **Debrief Qs**:  
    - *"How did this feel different from Stage 1?"*  
    - *"What changed besides the outcome?"*  
    - Contrast: Same ingredients (intentions + common knowledge) but added "glue" of joint commitment.  

  **35–55 min: Stage 3 (Private Deviation)**  
  - Group agrees on a new plan (e.g., "All choose 3").  
  - Secretly assign deviant (e.g., tap a student’s foot with note).  
  - Write choices. Reveal: Deviant chooses 4; group succeeds.  
  - **Debrief Qs**:  
    - *"We succeeded—but did we act together?"*  
    - *"Should the deviant apologize? Are they accountable?"*  
    - Surface normative residue: Anger/betrayal despite success.  

  **55–80 min: Thematic Debrief**  
  - Map stages to theory on whiteboard:  

  | Stage | Reductionist Ingredients | What’s Missing? | Non-Reductionist Insights |  
  |-------|--------------------------|-----------------|----------------------------|  
  | 1     | Individual intentions + common knowledge | No "we-feeling" | Joint action ≠ summed parts |  
  | 2     | Same + joint plan        | —               | Primitive "we-intention" creates agency |  
  | 3     | Outcome delivered        | Normative breach| Joint commitment binds beyond outcomes |  

  - **Key Insight**: Stage 2’s "we" requires a **joint commitment** that transforms individual acts into collective agency and creates obligations. Reductionism cannot explain the normative force ("You owe us!").  

  **80–90 min: Conclusion**  
  - Students articulate: *"Stage 2 has X that Stage 1 lacks"* → Push them toward "joint commitment" or "we-intention."  
  - Final note: *"The gap isn’t just psychological—it’s metaphysical and normative."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Stage 1 succeeds accidentally**:  
     - **Likelihood**: High (e.g., all choose 3 independently).  
     - **Fix**: Ask: *"If we won the lottery together, did *we* act together? Why not here?"* Emphasize the *lack of mutual responsiveness*—they didn’t act *because* of others.  

  2. **Deviant reveals secret**:  
     - **Likelihood**: Moderate.  
     - **Fix**: Assign deviant role to a discreet student. If exposed, pivot: *"Imagine this happened—how would you feel?"*  

  3. **Time overrun in discussions**:  
     - **Fix**: Use hard stops. Stage 2/3 discussions: 10 mins max.  

  4. **Students miss normative residue in Stage 3**:  
     - **Fix**: Provoke: *"The deviant gave us what we needed—why are you mad?"*  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The depth of real-world obligations**: The game uses trivial stakes (points). Students might not *feel* the moral weight of violating a joint commitment (e.g., abandoning a protest vs. breaking a game plan).  

  **How to bridge this**:  
  - **Supply real examples**: Contrast game betrayal with a friend breaking a promise to help you move. Ask: *"Why does the latter *hurt*?"*  
  - **Highlight**: Joint commitments create "relational obligations" (Bratman) or "plural subjecthood" (Gilbert) that transcend individual interests. This residue is the non-reductionist’s anchor.  

  ---

  ### **Outcome**  
  Students will leave unable to reduce Stage 2’s "we" to individual intentions + common knowledge, forcing them toward concepts like joint commitment or primitive we-intentions. The normative breach in Stage 3 cements that joint action is more than coordination—it binds agents to each other.
