answer: |-
  Here are ten substantive questions drafted as requested, each followed by a likely-response-tailored follow-up, designed to press the core challenges to his aggregation-denying contractualism while avoiding softballs. The prose flows as a single thought process:

  Start with the classic numbers case to immediately engage his central claim. Ask: When we judge that saving five from a fire is required over saving one, contractualism must explain why the principle permitting saving the five isn’t reasonably rejectable by the lone individual. The lone individual's complaint—being left to die—seems identical in kind and strength to the complaint any single one of the five would have if saved alone. If reasonable rejection depends solely on the complaint’s weight *to that individual* considered in isolation, why isn't the lone individual's complaint sufficient to reject the 'save the five' principle? What specific element of the 'reasonable rejection' test allows the *number* of individuals facing identical complaints to break the tie without aggregating their complaints? Is it that the complaint itself becomes weaker for the lone individual in this comparative context, or is a distinct, non-aggregative tie-breaker invoked once the individual complaints are deemed equal? **Follow-up if he emphasizes the lone individual cannot reasonably reject because their sacrifice is demanded only when necessary to save *so many*:** But doesn’t saying the sacrifice is only demanded "when necessary to save so many" implicitly acknowledge that the *number* of others saved matters? If the complaint itself isn’t weakened for the lone individual when we look only at their burden in isolation, isn't the appeal to "so many" simply introducing aggregation through the back door by making the permissibility depend on the *collective* fact about how many others benefit?

  Press the tie-breaker concern directly. Granting for argument’s sake that each individual complaint in a numbers case is identical and that the lone dissenter’s complaint alone is insufficient to reject the ‘save the many’ principle, isn’t declaring the dissenter’s complaint ‘outweighed’ functionally identical to aggregating the complaints of the five? How does labelling this step ‘tie-breaking’ rather than ‘aggregation’ change the substantive moral calculus or avoid the core objection that contractualism was meant to sidestep by focusing on individual complaints one-by-one? **Follow-up if he argues tie-breaking occurs only after establishing the individual complaints are equal and thus doesn't pool their weights:** Doesn't the tie-breaker *only* get activated *because* there are multiple individuals with identical complaints? If the tie-breaker applies precisely when multiple individuals stand to suffer comparable losses, doesn’t the outcome inherently depend on the *multiplicity* of potential sufferers – effectively counting them – even if the mechanism is called something else? Isn't this multiplicity doing the same justificatory work aggregation would?

  Explore the small harms vs large harm case. Consider a policy causing a minor, barely noticeable harm (e.g., a tiny increased risk of a minor illness) to each of a million people versus a policy causing catastrophic ruin to one identifiable person. Intuitively, imposing the widespread tiny harms to avoid the single catastrophe seems permissible. Can his contractualism capture this? If each individual facing the tiny harm finds their complaint insufficient to reasonably reject a principle permitting such tiny harms *in general*, how does it explain rejecting a principle *requiring* us to impose the tiny harms *in this specific case* to avoid the catastrophe? If each tiny harm complaint is truly negligible in isolation, how can they collectively justify overriding the veto of the individual facing catastrophe? Doesn't avoiding this require finding a way to aggregate the tiny complaints? **Follow-up if he suggests the principle permitting tiny harms *when necessary to prevent catastrophe* isn't reasonably rejectable by anyone, including the catastrophe victim:** But can the victim of catastrophe not argue that a principle permitting *any* harm imposition solely because it prevents a larger harm *for someone else* is rejectable? Without aggregating the small harms into a significant total burden, how do we establish that the collective burden *is* larger than the single catastrophe, making the principle acceptable? Doesn’t comparing total burdens require aggregation?

  Probe the status of the dissenter. When a principle is deemed not reasonably rejectable overall because the dissenting individual's complaint is insufficient, does the view actually *answer* the dissenter's complaint – showing why their specific burden isn't a good reason to reject the principle – or does it simply *override* it because others don't share it? If it's the latter, doesn't this undermine the view's claim to be fundamentally about justification *to each person*, turning it into a form of majoritarianism where the lone voice is drowned out? **Follow-up if he insists the dissenter’s complaint *is* answered by showing their burden isn't unreasonable given the stakes for others:** But doesn't "the stakes for others" inherently reference the *number* or *collective situation* of those others? If the justification offered to the dissenter hinges on the fact that *many* others are saved, hasn't the justification to the dissenter smuggled in an aggregative consideration, rather than solely addressing the complaint on its own individual terms?

  Challenge the distinction between interpersonal and intrapersonal aggregation. Contractualism seems comfortable aggregating benefits and harms *within* a single life over time (e.g., many small pleasures outweighing one large pain). Why is aggregating *across* lives fundamentally different? If the complaint against aggregation is that it fails to take the separateness of persons seriously, how does aggregating within a life respect the separateness of temporal stages of a person? Why is the boundary of a single life the morally decisive line preventing aggregation, rather than an arbitrary metaphysical fact? **Follow-up if he argues individuals can reasonably reject principles that neglect their good as a whole, justifying intrapersonal aggregation:** Couldn't an individual similarly argue they can reasonably reject principles that neglect their status as part of a larger collective whose total suffering matters? If respecting a person as a whole justifies aggregating within their life, why doesn't respecting persons as members of a moral community justify some form of interpersonal aggregation? What makes the individual life the absolute stopping point?

  Conclude with the abandonment question. Finally, what empirical observation or theoretical argument – short of abandoning the core idea of justifiability to individuals – would convince you that the individualist restriction must be dropped? If faced with a class of cases (like catastrophic risk or dispersed small harms) where the intuitive verdicts seem *inescapably* to require comparing total burdens across people, and no plausible non-aggregative contractualist principle can capture them, would that be sufficient reason to relax the ban on aggregation? Or is the restriction foundational in a way that no such counterexample could dislodge it? **Follow-up if he suggests foundational commitment:** If the restriction is truly foundational and immune to counterexample, doesn't that risk insulating the view from empirical moral psychology or widely shared intuitions about cases, making it less a theory about what *makes* acts wrong and more a stipulative definition?
