  We are going to design a game that simulates a multi-layer processing system (like a neural network) using humans as nodes. The goal is to explore the Chinese Room argument and the concept of understanding in AI.

   Overview of the game:
   - We have a chain of people: one input person, several hidden layers, and one output person.
   - The input person receives a question (on an index card) and writes a transformed version of it (according to a rule) on a new card to pass to the next layer.
   - Each hidden layer person does the same: they receive a card, apply a rule (which they have written down for themselves) to transform the content, and pass it to the next person.
   - The output person receives a card and writes an answer (again, by rule) on a new card. This answer is then compared to the desired output.

   The twist: 
    1. The rules are fixed and known only to the individual in their role (they are given a rule card at the beginning). 
    2. The input person does not see the output, and the output person does not see the input. The hidden layers only see the transformed version from the previous layer.

   We will run multiple rounds:
    Round 1: Small chain (e.g., 3 layers: input, one hidden, output) with simple rules and simple questions.
    Round 2: Larger chain (e.g., 5 layers: input, three hidden, output) with more complex rules and slightly harder questions.
    Round 3: Same as round 2 but we secretly replace the entire chain with one person who is answering the questions without the chain (i.e., using their own understanding). We don't tell the rest of the group which round is the substitution.

   We need a set of questions and answers that are rule-based but can be made more complex. We also need a scoring system.

