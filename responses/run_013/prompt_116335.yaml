prompt: |-
  Before I read any more on supererogation I want the spec first: what does a theory of it actually have to get right to count as a theory of supererogation at all? Give me the desiderata -- the cases it has to handle, the distinctions it can't collapse, the background claims it can't contradict -- with the case or consideration behind each one, and mark which are non-negotiable vs which are just one camps preference. Cases I keep tripping on: a parent who sacrifices for their child (that's required, not heroic); a stranger who donates a kidney; the tiny favour that's optional but too small to be heroic; someone who does far more than duty out of vanity; and someone who pulls off the heroic act only by neglecting their own family. I also want to know whether supererogation is a property of acts or of agents -- does the same act stop being supererogatory if it's done from grim habit rather than love? And does a theory of supererogation have to leave room for the mirror image, acts that are permitted but lousy? Flag any subset of the desiderata that can't all be satisfied at once -- my guess is that "you ought to do the morally best thing available" and "supererogation exists" can't both stand, but tell me if I've picked the wrong culprit, and which single requirement does the most excluding work. Then a few lines on how the going views fare against the list.
reasoning: |-
  Okay, the user is asking for a specification of what a theory of supererogation must include to be considered valid. They provided specific cases they're struggling with and want desiderata categorized as non-negotiable or debatable. They also have questions about whether supererogation pertains to acts or agents and if there are conflicts between requirements.

  First, I need to define the core elements of supererogation. The user mentioned cases like parental sacrifice (required, not heroic), kidney donation by a stranger, small optional favors, acts done out of vanity, and heroic acts that neglect family duties. Each of these tests different aspects of a theory. 

  The key non-negotiables seem to be the optionality of supererogatory acts, their moral goodness, and that they go beyond duty. The user also wants to know if the same act can be supererogatory based on motive, which touches on whether it's the act or the agent that matters. Additionally, they're curious about "suberogatory" acts—permitted but blameworthy—and if theories allow for those.

  They suspect a conflict between "ought to do the best" and supererogation existing. That’s spot on; if you must always do the best, there's no room for optional good acts. So, rejecting maximizing moral theories is necessary. The demandingness requirement also causes tension. If duties are too minimal, more acts become supererogatory; if too broad, supererogation disappears. Balancing that is tricky.

  The user might be diving into ethical theories and encountering contradictions. Their deeper need could be understanding which theories handle real-life complexities without collapsing distinctions. They might be looking for a framework that accommodates both obligation and heroism without oversimplifying.

  I should structure the desiderata clearly. Start with non-negotiables: optionality, goodness, beyond duty. Then move to contestable ones like demandingness, motives, and suberogation. Highlight the tension between maximizing and supererogation as the main conflict. 

  For the cases: parental duty shows that sacrifice isn't always beyond duty. Kidney donation is classic supererogation. Small favors test if minimal acts count. Vanity acts challenge whether motive affects status. Neglecting family introduces conflicts where one duty is fulfilled at the expense of another. 

  On act vs. agent: some theories tie supererogation to the act itself, others to the agent's motives. Hybrid approaches might be necessary. Suberogation is often included but not essential. 

  Finally, summarize how existing theories (satisficing, agent-centered, etc.) handle these points. The user wants a concise overview to guide their further reading, so clarity and addressing their specific examples are crucial.
answer: |-
  Here's a specification for a theory of supererogation, breaking down the core requirements, contested points, and tensions, using your cases as anchors:

  **Core Non-Negotiable Desiderata (Must-Haves):**

  1.  **Beyond Duty / Non-Obligatory Goodness:**
      *   **Requirement:** Must distinguish acts that are *morally good* but **not morally required** from acts that are obligatory. Supererogatory acts are *optional* in the strong sense that you are *not blameworthy* for omitting them.
      *   **Case:** The stranger donating a kidney. We praise them, but we don't condemn someone who chooses not to donate. Contrast with a parent feeding their child (required – blameworthy to omit).
      *   **Non-Negotiable:** This defines the concept. Without optional goodness beyond duty, there is no supererogation.

  2.  **Moral Goodness / Moral Value:**
      *   **Requirement:** The act must possess *positive moral worth*. It must be morally better than merely fulfilling one's duty or doing the minimum acceptable.
      *   **Case:** Donating a kidney is clearly morally good. Performing a tiny favor (like holding a door) is optional and good, but may lack the *significant* moral value often associated with supererogation (see "Significant Sacrifice/Effort" below - contested).
      *   **Non-Negotiable:** An act that isn't morally good cannot be supererogatory. This distinguishes it from merely permissible acts.

  3.  **Not Wrong / Permissibility:**
      *   **Requirement:** Performing the supererogatory act must not itself be morally wrong or impermissible. It must be a *good option*, not a forbidden one.
      *   **Case:** Someone neglecting their family to perform a heroic act elsewhere (e.g., saving strangers). If neglecting the family is a serious wrong, the "heroic" act might not be supererogatory *because it involved wrongdoing*, even if the outcome was good. The theory must handle how conflicting obligations affect supererogation.
      *   **Non-Negotiable:** An act that is forbidden cannot be supererogatory.

  **Commonly Accepted (But Potentially Contestable) Desiderata:**

  4.  **Significant Sacrifice / Effort / Risk:**
      *   **Requirement:** Supererogatory acts typically involve significant cost, risk, effort, or sacrifice on the part of the agent (though *how* significant is debated).
      *   **Case:** Kidney donation involves significant sacrifice. The tiny favor involves negligible sacrifice. Many theories would say the tiny favor is merely permissible, not supererogatory, *because* it lacks significant cost. Parental sacrifice, while significant, is often seen as *required* (duty of care), so sacrifice alone isn't sufficient.
      *   **Status:** Highly common, often seen as core to the *paradigm* (heroism, saintliness), but some minimalist theories might allow very small-cost acts to count if they are optional and good. This is where the "tiny favour" case tests boundaries.

  5.  **Praiseworthiness:**
      *   **Requirement:** Agents who perform supererogatory acts are typically morally praiseworthy for doing so.
      *   **Case:** The kidney donor is praiseworthy. Someone doing "far more than duty out of vanity" – are they praiseworthy? The act might still be supererogatory (optional, good, costly) even if the motive is flawed, diminishing but not necessarily eliminating praiseworthiness.
      *   **Status:** Widely held, but the *degree* and basis of praiseworthiness (act vs. motive) is contested. Some argue the act's status is primary.

  6.  **Not Demanding Too Much:**
      *   **Requirement:** The theory shouldn't collapse into making extremely demanding acts obligatory. Duties must have reasonable limits, leaving room for the optional "extra."
      *   **Case:** If "always maximize the good" is a strict duty, then donating a kidney (if it maximizes good) becomes obligatory, not supererogatory. The theory must explain why such high demands aren't always required.
      *   **Status:** Crucial for preserving the "beyond duty" space, but the *level* of demand required for duty is deeply contested (source of major tension - see below).

  **Contested Terrain / Areas of Dispute:**

  7.  **Act vs. Agent Focus:**
      *   **Question:** Is supererogation primarily a property of the *act* (its features, consequences, relation to rules) or the *agent* (their motives, character, effort)?
      *   **Case:** The same act (e.g., donating a large sum) – is it supererogatory if done out of deep love, but *not* if done out of grim habit or vanity? "Act-Focused" theories often say yes, the act is supererogatory regardless of motive (though the *agent* may be less praiseworthy). "Agent-Focused" theories might tie supererogation intrinsically to virtuous motives or heroic effort.
      *   **Status:** Major divide. Most mainstream theories are act-focused, allowing motive to affect *praiseworthiness* but not necessarily the *status* of the act itself. Virtue ethicists lean more agent-focused.

  8.  **Suberogation (The Mirror Image):**
      *   **Question:** Must a theory of supererogation also accommodate "suberogatory" acts – acts that are *morally permissible* (not forbidden) but *morally bad* or *blameworthy* (even if only mildly)?
      *   **Case:** The tiny favor omitted out of laziness – permissible, but perhaps mildly blameworthy/lousy. Or refusing to donate a kidney when it would involve only minor inconvenience (if such a scenario exists).
      *   **Status:** Logically parallel and appealing for symmetry, but not strictly necessary for defining supererogation itself. Some theories embrace it, others reject the category.

  **Key Tensions & Conflicts:**

  *   **The Core Conflict:** You are absolutely right. **The tension between "You ought to do the morally best thing available" (Maximizing/Standard Consequentialism) and "Supererogation exists" is fundamental and often irreconcilable.** If maximizing the good is *always* obligatory, then there is no logical space for optional acts that are *good* but not *the best* or *required*. This requirement does the most "excluding work."
  *   **The Demandingness Tension:** Related to the above. Defining the *limits* of duty is crucial. If duties are defined too minimally, too much becomes supererogatory (potentially trivializing duty). If duties are too demanding, supererogation disappears. The "parental sacrifice" case highlights this – why is that sacrifice *required* while the stranger's kidney donation *isn't*? Theories differ dramatically on where this line is drawn.

  **How Going Views Fare (Briefly):**

  1.  **Moderate Deontology:** Often fares best. Uses agent-centered *prerogatives* (permission not to maximize) and/or *options* to limit duty, creating space for supererogation. Handles conflicts (neglecting family) via conflicting duties/prima facie duties. Usually act-focused. Struggles to precisely define prerogative/option strength.
  2.  **Satisficing Consequentialism:** Rejects maximizing; doing "good enough" is obligatory; doing *more* can be supererogatory. Directly addresses the core conflict. Controversial – is "good enough" coherent/justifiable? Handles "vanity" act easily (still good). Tiny favors might be supererogatory if above "good enough."
  3.  **Virtue Ethics:** Focuses on character. Supererogation might be acting with exceptional virtue beyond what is required for being "decent." Naturally handles motive (vanity diminishes it). Can struggle with clear act-based definitions and distinguishing duty from supererogation sharply. Might see parental sacrifice as virtuous duty.
  4.  **Rights/Forfeiture Theories:** Supererogation involves waiving one's rights or claims. Kidney donation waives a bodily right. Explains optionality clearly. Struggles with cases not involving rights waivers (e.g., extreme effort without rights involved). Tiny favors might not involve significant rights.
  5.  **Maximizing Consequentialism (Utilitarianism):** Struggles severely. Either denies supererogation exists (best act *is* obligatory) or must add extra features (e.g., "ought" implies "can," but demandingness remains high). Least compatible with core desiderata.

  This spec provides the necessary framework and highlights the key battlegrounds. Any viable theory must satisfy the Non-Negotiables (1-3), grapple seriously with Sacrifice (4) and Demandingness (6), and explicitly position itself on Act/Agent (7) and the core conflict with Maximization.
