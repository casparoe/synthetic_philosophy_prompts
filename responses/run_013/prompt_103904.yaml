prompt: |-
  I run a small betting syndicate with five mates — we each put £200 in at the start of the football season, I'm the one who actually places the bets, and at the end we split whatever's left over. We've done ok overall but I've had two seasons now where one bad weekend wiped out months of careful grinding, and a mate who's into this stuff keeps telling me I'm staking like an idiot. So I've been reading up on the Kelly criterion (bet a fraction of your pot equal to your edge over the odds) and on this related idea that what you should really be maximising is your long-run growth rate rather than your expected money — the upshot being that some bets which are clearly +EV on paper are still ones you should turn down, because the damage from a bad run compounds in a way that a good run doesn't.

  I think I basically get the idea but I can't turn it into anything I can actually do on a Saturday morning before kickoff. So can you write me a procedure — a checklist I run through in order, not a lecture — for deciding how much of the pot to stake on a bet? And then how much on each of several bets on the same weekend, because that's the bit that really confuses me: they're not independent, loads of them are the same league or even the same team's form, and the simple edge-over-odds thing seems to assume I know the true probability, which I definately don't — I've got a rough sense from form and odds and I know I'm probably overconfident.

  Things the procedure has to handle, because these are the ones that bite me:

  - what to do when I can't put a number on the probability at all, only a vague feeling that something's a good price
  - what to do when two or three of the weekend's bets are basically the same bet wearing different hats
  - how to pick the fraction of Kelly, since I gather full Kelly is supposed to be too aggressive for someone who's guessing at their own edge, but nobody says how much less
  - when the honest answer is bet nothing, even on something I'm excited about
  - and I have to be able to explain the stake to five mates staring at me, so no integrals.

  Run it on two or three concrete bets so I can see it move, including at least one where it tells me to stake a humiliatingly small amount or nothing at all on something I was keen on. Be straight with me about which steps are just my own judgement dressed up as maths, and where the whole thing will misfire or fall apart — I'd rather know the limits than have a procedure that pretends to be tighter than it is. Please write it in British English, and keep it in plain language, I'm not a mathematician.
reasoning: |-
  Okay, the user runs a small betting syndicate with five mates, each putting in £200 at the start of the season. They've had issues where a single bad weekend wiped out months of gains, and a mate criticized their staking strategy. They've read about the Kelly criterion and maximizing long-term growth but struggle to apply it practically on busy Saturday mornings.

  The user needs a concrete, step-by-step procedure for deciding stake sizes that handles real-world complexities: vague probability estimates, correlated bets, fractional Kelly sizing, and knowing when to bet nothing. They want it in plain British English, with examples including cases where stakes end up embarrassingly small. Crucially, it must be explainable to five non-mathematical mates.

  Key pain points emerge:
  - Probability estimation struggles ("vague feeling it's a good price")
  - Bet correlation issues ("same bet wearing different hats")
  - Aggressiveness calibration ("how much less than full Kelly")
  - Restraint guidance ("when to bet nothing despite excitement")

  The solution must balance mathematical rigor with practical usability - admitting where judgment calls dominate. Examples should showcase both typical cases and humbling "bet nothing" scenarios. British terminology like "qualifying bet" and "each-way" will maintain familiarity.

  For fractional Kelly, I'll suggest 1/4th as a starting point - aggressive enough to matter but conservative given estimation errors. Correlation handling will rely on crude but practical "grouping" of similar bets. The "can't quantify" case needs a clear exit path to avoid forced decisions.

  The examples will include:
  1) A standard bet where probability can be estimated
  2) Correlated bets on Arsenal
  3) A "vague feeling" bet that gets rejected
  This demonstrates the full range while keeping it grounded.

  Most importantly, the procedure must emphasize that it's a framework for applying judgment - not a calculator that removes responsibility. The "when it falls apart" section will explicitly warn about overconfidence and correlation blindness.
answer: |-
  Right, here's your Saturday morning stake-setting procedure. It's based on the *spirit* of Kelly – protecting your pot from ruin while growing it sensibly – but hacked for real-world fuzziness. Think of it as "Kelly Lite with Guardrails".

  **Your Weekly Stake-Setting Procedure (British English)**

  **What You Need Before Kick-Off:**
  1.  **The Pot:** Current total amount (£P).
  2.  **The Bets:** Your list of potential bets for the weekend.
  3.  **For Each Bet:**
      *   **Decimal Odds (£O):** (e.g., 2.50 for 6/4).
      *   **Your Estimated Probability (£EstP):** Your *honest* gut feeling (0-100%) this bet wins. Be pessimistic. If you can't put a number, skip to Step 3b.
      *   **The "Why":** A quick note *why* you fancy it (e.g., "Team X key striker back", "Team Y awful away form").

  **The Steps (Run in Order):**

  1.  **Fraction of Kelly (FoK):** Decide your **FoK** *once per season* or after big pot changes. Start with **FoK = 0.25** (One-Quarter Kelly). This is your safety buffer against being wrong. *Why 0.25?* It's cautious enough for estimation errors but still lets you grow. Tell your mates: *"Full Kelly's too risky when we're guessing, quarter-Kelly gives us wiggle room."* Stick with 0.25 unless you all agree to change it permanently.

  2.  **Group Your Bets:** Look at your weekend bets. Group together bets that feel like they **depend heavily on the same thing**. Examples:
      *   *Group:* "Arsenal to win" + "Arsenal -1 Handicap" + "Over 2.5 Goals in Arsenal game" (All heavily rely on Arsenal performing well).
      *   *Group:* "Man City Win" + "Burnley Loss" (Different games, but both heavily reliant on league form/class gap).
      *   *Not Grouped:* "Liverpool Win (Prem)" + "Dundee Utd Win (Champ)" (Different contexts, minimal direct link).
      *   **Label these Groups** (e.g., "Arsenal Cluster", "Big Faves Group").

  3.  **Assess Each Bet (One at a Time):**
      *   **3a. Bet with Estimated Probability (£EstP):**
          *   Calculate **Edge (%)**: `Edge = (£EstP / 100 * £O) - 1`
              *   *Example:* Odds £O = 3.00, You think 40% chance (£EstP = 40). Edge = (0.40 * 3.00) - 1 = 1.20 - 1 = 0.20 (20% Edge).
          *   Calculate **"Full Kelly Fraction" (FKF)**: `FKF = Edge / (£O - 1)`
              *   *Example:* Edge = 0.20, £O = 3.00. FKF = 0.20 / (3.00 - 1) = 0.20 / 2.00 = 0.10 (10% of pot).
          *   Calculate **Your Stake Fraction (SF)**: `SF = FKF * FoK`
              *   *Example:* FKF = 0.10, FoK = 0.25. SF = 0.10 * 0.25 = 0.025 (2.5% of pot).
          *   **Key Check: Is SF > 0?** If Edge <= 0, SF should be 0! No Edge = No Bet. Move on.
      *   **3b. Bet with NO Clear Probability (Only "Good Price" Feeling):**
          *   **Result: Stake Fraction (SF) = 0.** Do not bet. *Tell your mates: "Feels good, but I can't honestly put a number on the chance. Kelly needs a number. Pass."* Record it and see if it wins – it'll help calibrate your gut later.

  4.  **Apply Group Limits (CRITICAL):** For each **Group** you defined in Step 2:
      *   Add up the **SF** values for *all bets within that single group*.
      *   **Apply the Group Cap:** If the total SF for the group > **(FoK * 0.05)** (i.e., 5% of your pot if FoK=0.25), then reduce each bet's SF proportionally so the group total equals **(FoK * 0.05)**.
          *   *Example:* Group has 3 bets: SF1=0.015 (1.5%), SF2=0.012 (1.2%), SF3=0.008 (0.8%). Total SF = 0.035 (3.5%).
          *   FoK=0.25, Group Cap = 0.25 * 0.05 = 0.0125 (1.25%).
          *   Total SF (3.5%) > Group Cap (1.25%). Reduce proportionally: Reduction Factor = 0.0125 / 0.035 ≈ 0.357.
          *   New SF1 = 0.015 * 0.357 ≈ 0.0054 (0.54%)
          *   New SF2 = 0.012 * 0.357 ≈ 0.0043 (0.43%)
          *   New SF3 = 0.008 * 0.357 ≈ 0.0029 (0.29%)
          *   Total = 1.26% (≈1.25%). *Tell mates: "These 3 bets all hinge on Arsenal smashing it. We're treating them like one big bet to avoid blowing up if Arsenal have an off day."*

  5.  **Calculate Actual £ Stake:** For each bet that survived Steps 3 & 4:
      *   **Stake (£) = SF * £P** (Round down to nearest sensible unit, e.g., £0.50 or £1).
      *   *Example:* SF = 0.025 (2.5%), Pot £P = £1200. Stake = 0.025 * £1200 = £30.

  6.  **The Minimum Stake Rule:** If Step 5 gives a stake less than **£2** (or your bookie's min stake, whichever is higher), then **Stake = £0**. Don't place trivial bets. *Tell mates: "Maths says it's barely worth the faff."*

  7.  **Final Sense Check:** Look at the total stakes for the weekend. Does it feel insane relative to your pot? If total stakes > **(FoK * 0.10 * £P)** (e.g., 2.5% of pot if FoK=0.25), reconsider your weakest bet(s). Have you been too optimistic? Did you miss grouping correlations?

  **Concrete Examples (Pot = £1000, FoK = 0.25)**

  1.  **"Solid" Bet:**
      *   Bet: Liverpool to win away at Fulham. Odds (£O) = 2.10.
      *   Your £EstP: 55% (You rate Liverpool highly, Fulham inconsistent).
      *   **Step 3a:**
          *   Edge = (0.55 * 2.10) - 1 = 1.155 - 1 = 0.155 (15.5%)
          *   FKF = 0.155 / (2.10 - 1) = 0.155 / 1.10 ≈ 0.141 (14.1%)
          *   SF = 0.141 * 0.25 ≈ 0.03525 (3.525%)
      *   **Step 5:** Stake = 0.03525 * £1000 ≈ £35.25 --> **£35**
      *   *Mate Explanation: "We think Liverpool have a 55% shot at 2.10, which is decent value. Maths says stake about £35."*

  2.  **Correlated Arsenal Bets (Grouped):**
      *   **Bet A:** Arsenal to Win vs Villa. Odds = 1.80. Your £EstP = 60%.
          *   Edge = (0.60 * 1.80) - 1 = 1.08 - 1 = 0.08 (8%)
          *   FKF = 0.08 / (1.80 - 1) = 0.08 / 0.80 = 0.10 (10%)
          *   SF_A = 0.10 * 0.25 = 0.025 (2.5%)
      *   **Bet B:** Arsenal -1 Handicap. Odds = 2.75. Your £EstP = 35% (Need Arsenal to win by 2+).
          *   Edge = (0.35 * 2.75) - 1 = 0.9625 - 1 = -0.0375 (-3.75%) --> **SF_B = 0** (Negative Edge! Skip)
      *   **Bet C:** Bukayo Saka Anytime Scorer. Odds = 2.50. Your £EstP = 42% (Relies heavily on Arsenal scoring/winning).
          *   Edge = (0.42 * 2.50) - 1 = 1.05 - 1 = 0.05 (5%)
          *   FKF = 0.05 / (2.50 - 1) = 0.05 / 1.50 ≈ 0.0333 (3.33%)
          *   SF_C = 0.0333 * 0.25 ≈ 0.00833 (0.833%)
      *   **Step 2:** Group "Arsenal Performance" (Bets A & C - Bet B discarded).
      *   **Step 4:** Total Group SF = SF_A + SF_C = 0.025 + 0.00833 ≈ 0.03333 (3.333%)
      *   Group Cap = FoK * 0.05 = 0.25 * 0.05 = 0.0125 (1.25%)
      *   Total SF (3.33%) > Cap (1.25%). Reduction Factor = 0.0125 / 0.03333 ≈ 0.375
      *   **New SF_A** = 0.025 * 0.375 ≈ 0.009375 (0.9375%) --> Stake ≈ £9.38 --> **£9**
      *   **New SF_C** = 0.00833 * 0.375 ≈ 0.003125 (0.3125%) --> Stake ≈ £3.13 --> **£3**
      *   *Mate Explanation: "Look, both the Arsenal win and Saka scoring hinge massively on Arsenal turning up. We fancied them, but the handicap bet was actually bad value. To protect us if Arsenal bottle it, we're treating these two like one bet. Stakes are £9 on the win, £3 on Saka. Small, but it makes sense for the risk." (Be prepared for groans - this is the humiliatingly small result!).*

  3.  **"Vague Feeling, No Number" Bet:**
      *   Bet: Leeds vs Southampton Draw. Odds = 3.60.
      *   Why: "Both teams unpredictable, feels like a draw could happen, odds look tasty."
      *   **Step 3b:** You cannot honestly assign a specific £EstP (e.g., is it 30%? 35%? 28%? You don't know). **SF = 0. Stake = £0.**
      *   *Mate Explanation: "The draw odds look nice, but I genuinely can't put a solid number on how likely it is. The maths needs that number to tell us if it's truly worth it, and if so, how much. Without it, we pass. Let's see what happens."*

  **Where This Relies on Your Judgement (The Dressed-Up Bits):**

  1.  **Your Estimated Probability (£EstP):** This is THE biggest input and entirely your (pessimistic) gut feel. The whole thing falls apart if you're wildly overconfident here. Be harsh.
  2.  **Grouping Bets:** Defining what's "correlated enough" to group is subjective. Err on the side of caution – group things if there's *any* significant shared dependency. It's better to under-stake correlated bets than over-stake.
  3.  **Initial FoK Choice (0.25):** This starting point is a rule-of-thumb based on common practice for amateur bettors. You could argue for 0.2 or 0.3. The key is picking *one* and sticking with it unless you have a *very* good reason to change after a *full season*.
  4.  **Group Cap (FoK * 0.05):** The 0.05 (5% of pot cap per group) is another conservative rule-of-thumb. It forces extreme discipline on correlated bets. You could use 0.075 or 0.10, but 0.05 is safer.

  **Where This Will Misfire or Fall Apart:**

  1.  **Wildly Wrong Probability Estimates:** If your £EstP is consistently too high (overconfidence), you'll calculate positive edges where none exist, stake too much, and lose faster. If consistently too low, you'll miss good bets. **Be pessimistic.**
  2.  **Missing Correlation:** If you fail to group bets that *are* heavily dependent (e.g., multiple bets relying on high-scoring games across a league one weekend, but you don't group them), you will stake far too much overall. One bad Saturday wipes you out. **Group aggressively.**
  3.  **Ignoring Steps 3b & 6:** Betting on "vague feelings" or placing trivial £1 bets "for interest" clutters your book, wastes time, and slowly drains the pot via lost stakes. **Stick to £0 or proper stakes.**
  4.  **Changing FoK Mid-Season:** Chopping and changing your aggression level based on recent wins/losses is disastrous. Pick FoK at the *start* and **stick with it for the whole season**. Review only at the end.
  5.  **Tiny Pots:** When the pot is very small (£100), even sensible fractional Kelly stakes can be below the min bet (£1 or £2). You might need a short-term "survival mode" (minimum stakes on highest conviction bets only) until the pot grows. The procedure assumes a reasonable pot size.

  **The Upshot:**

  This procedure forces discipline: quantifying your edge (or admitting you can't), brutally capping exposure to related outcomes, staking tiny amounts when uncertainty is high, and turning down bets where you lack conviction. It trades off *potential* maximum growth for *much* greater survival probability. It won't make you rich quick, but it should stop one bad weekend nuking your season. Explain it to your mates as: *"We're treating the pot like a business. Small, calculated risks on things we genuinely think are mispriced. No gambling on hunches. No doubling down on the same idea. Tiny stakes sometimes. The goal is steady grind, not a lottery win."* Good luck!
