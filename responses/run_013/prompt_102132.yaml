answer: |-
  Here's a breakdown of the conceptual knot you're wrestling with, thinking it through step by step:

  The core tension arises because decorative conventions *feel* obligatory despite lacking the clear, concrete harm-prevention justification of load-bearing ones. If breaking a decorative rule causes no material detriment, why should a visitor, who privately finds it arbitrary, feel bound by it? The "why" isn't self-evident like it is with avoiding collisions or ensuring fair service.

  **The Case For Obligation (Beyond Politeness):**
  The strongest argument hinges on respect for the community's *autonomy in constructing its social world*. Conventions, even decorative ones, are shared agreements that create predictable, low-friction social interaction. They form the subtle grammar of everyday life within that group. While breaking one instance causes no direct harm, it signals a disregard for that shared grammar. It says, implicitly, "Your collectively agreed-upon ways of being, your social comfort, are unimportant to me." This undermines the community's right to establish its own norms for how interactions *feel*, not just how they function materially. It transforms the visitor from a respectful guest into someone imposing their own judgment on the local social fabric. The obligation stems not from preventing tangible harm *in the moment*, but from acknowledging the inherent value of the community's self-determined social patterns and minimizing unnecessary disruption to the subtle ecosystem of mutual understanding and ease. Refusing to participate becomes a subtle assertion of superiority: "My judgment of what matters trumps yours."

  **The Case Against Obligation (Just Politeness):**
  The counter-argument is that obligation requires a firmer foundation than mere social preference. If no one is demonstrably worse off – no waiter loses income, no queue descends into chaos, no collision occurs – then any pressure to conform is purely social expectation masquerading as duty. The visitor who stands on the left, jaywalks safely, or uses an "incorrect" greeting isn't violating any ethical principle; they are simply being different. The discomfort locals might feel is not harm in any morally significant sense – it's the friction of encountering difference or the mild irritation of a minor expectation unmet. To call this an "obligation" inflates social pressure into moral law. The visitor's only real duty is to avoid causing tangible harm or offense. Following decorative conventions is merely prudent, a way to avoid friction and smooth interaction – desirable politeness, perhaps, but not a failure of obligation if omitted. Insisting it *is* an obligation confuses convention with morality and risks demanding conformity for its own sake.

  **Where Harm and Load-Bearing Diverge:**
  This is where your suspicion holds: the lines are distinct, and their interplay creates the puzzle. Load-bearing conventions are defined by their *function*: preventing direct, tangible negative consequences (harm, chaos, injustice) that occur *because* of the convention's structure. Driving on the left prevents crashes *caused* by erratic driving. Tipping sustains wages *dependent* on the practice.

  Harm, however, can exist independently of a convention being load-bearing:
  1.  **Convention-Independent Harm:** You can harm someone without breaking a convention (e.g., stealing, assault). Harm doesn't *require* convention-breaking.
  2.  **Harm *from* Decorative Convention Enforcement:** Crucially, violating a *decorative* convention might *cause* harm only because of the *local reaction* to the violation, not because of the act itself. Standing on the left doesn't inherently cause harm; the harm comes from the *local's anger or social sanction*. This is harm *contingent* on the local community *treating* the decorative convention as more important than it functionally is. The convention itself isn't load-bearing (its absence wouldn't cause inherent chaos), but the *community's response* to its violation *creates* the harm. The line blurs because the community *makes* it consequential through their reaction.
  3.  **Load-Bearing Without Obvious Individual Harm:** Some load-bearing conventions prevent diffuse or systemic harm rather than immediate individual harm. Not queuing might not harm one specific person immediately, but it erodes a system that efficiently prevents conflict and ensures fairness for everyone over time. The harm is to the system's function, not always a single identifiable victim per violation.

  **The Real Action:**
  The friction occurs precisely when a community treats a decorative convention *as if* it were load-bearing – investing it with significance that triggers a harmful response (resentment, exclusion, sanction) to its violation. The visitor faces a dilemma: adhere to an arbitrary rule they see as silly to avoid this socially-constructed harm, or assert their judgment and risk causing offense/harm that stems purely from the local over-valuation of the convention. This is where the "obligation" feels strongest yet is hardest to justify ethically. Is the obligation to follow the rule itself, or merely to avoid triggering an *overblown* negative reaction from the community? The conceptual heart of your puzzle lies in navigating the space between respecting a community's self-definition (which includes its symbolic, decorative norms) and resisting the moralization of preferences that lack inherent functional necessity. The visitor's burden isn't necessarily about the rule's intrinsic weight, but about the real, though socially-contingent, consequences of ignoring the weight the locals assign to it.
