  ok so i'm building a little set of prompts and i keep circling this one, and i'd like you to just explain the conceptual issue for me rather than settle it. here's the setup. i've been using a distinction that i dont think has a standard name, so let me stipulate it: call a local convention load-bearing if breaking it actually changes what happens to someone else — which side of the road you drive on, whether you queue for the bus, whether you tip the waiter who lives off tips — and call it decorative if breaking it mostly just signals that you're not from around here — standing on the left of the escalator, jaywalking when there's no traffic, the exact greeting you use at a shop. now the puzzle. everyone agrees a visitor has to follow the load-bearing ones, and most people sort of half-agree a visitor ought to follow the decorative ones too, but almost nobody can say why that second obligation exists if the convention itself is arbitrary and breaking it hurts no one. what i want is for you to actually lay out the conceptual issue: give me the strongest case that decorative conventions really do generate an obligation for a visitor who privately thinks they're silly, the strongest case that they don't and that it's just politeness or social pressure wearing obligation's clothes, and then try to say precisely where the load-bearing/decorative line comes apart from the harm/no-harm line — because i suspect they're not the same line and that's where the real action is. and i'm not interested in a roll call of what various philosophers have said, i want the reasoning itself, worked through. keep it in continuous prose, no headings, no bullet points, no bold, no tables, just write it the way you'd explain it to me in an email.
