prompt: |-
  On the whiteboard of the team I work on, someone has written as a kind of house proverb that the numbers worth watching are exactly the numbers that stop being worth watching once you start watching them, and it gets invoked to settle an unusually wide range of arguments. Last month it was used to justify keeping our service dashboards deliberately coarse and to refuse any numerical target for a support team's resolution times; this month a colleague is using it to argue that we cannot improve the reward model we are training for a summarization system, on the grounds that the moment you optimize such a measure it gets gamed, so any attempt to sharpen it is self-defeating. I do not believe these are all the same claim, and I cannot tell whether the load-bearing word is "worth" (the measure has stopped being an accurate indicator), "gamed" (agents begin optimizing it directly), or something definitional (a measure that survives optimization is by definition not the kind you optimize) — and someone insists it is just Goodhart's law, which I take to be a name rather than an argument.

  Set out the distinct precise theses this proverb could be asserting. Where they are relevant, include a statistical claim about selection among cases, a causal claim about the world changing under the measure, a claim about behaviour far out in the tails where optimization drives you, a claim about deliberate gaming by parties with their own objectives, and a claim that holds only by definition. For each thesis, say whether it is a genuine law, a contingent empirical regularity, or a tautology in disguise; say which theses would actually license each of the three uses above and which one the colleague genuinely needs for the reward-model argument; and say plainly which reading leaves the proverb false or trivial rather than merely sobering. Give your answer as exactly five numbered items, each one or two sentences, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is asking about a team proverb: "numbers worth watching stop being worth watching once you start watching them." They've seen it used in various arguments - for coarse dashboards, against resolution targets, and now against improving a reward model for a summarization system. The user is confused about what the proverb actually means and wants me to clarify the distinct theses it could represent.

  I need to identify five precise interpretations of this proverb. The user specifically wants me to include: statistical claims about selection, causal claims about the world changing, claims about tail behavior, claims about deliberate gaming, and definitional claims. For each, I should classify whether it's a genuine law, empirical regularity, or tautology.

  I recall Goodhart's law is mentioned - "when a measure becomes a target, it ceases to be a good measure." That seems central here. Let me break this down:

  First, there's a selection bias interpretation - when you pick a measure because it correlates with what matters, that correlation weakens under optimization. This is a statistical claim and an empirical regularity.

  Second, there's causal degradation - actually optimizing the measure changes the system in ways that break the original relationship. This is also empirical and contingent on how systems respond.

  Third, tail behavior - optimizing pushes you to extreme cases where the measure behaves differently. This is often true mathematically but depends on domain specifics.

  Fourth, strategic gaming - people deliberately exploit the measure. This is clearly an empirical regularity about human behavior.

  Fifth, a tautological reading - "worth watching" is defined as measures that degrade when used as targets. This makes the proverb true by definition but trivial.

  For each thesis, I need to indicate which of the three team arguments (coarse dashboards, no resolution targets, don't improve reward model) it would justify. The reward model argument specifically requires the gaming thesis (#4), since AI systems can actively exploit reward functions.

  The tautological version (#5) is the only one that's trivial - it doesn't tell us anything useful about the world. The others offer substantive insights, even if they're not universal laws.

  I'll structure my response as exactly five numbered items as requested, with one or two sentences each, covering all these aspects without introduction or conclusion.
answer: |-
  1. **Selection Bias Thesis**: A measure initially correlates with desired outcomes but optimizing it selects for cases where this correlation breaks, degrading its value; this is a contingent empirical regularity that could justify coarse dashboards by avoiding overfitting to noise.  
  2. **Causal Degradation Thesis**: Actively targeting the measure causally distorts the underlying system (e.g., rewarding resolution speed lowers quality), making it a contingent empirical regularity; this licenses refusing numerical targets for support times but not the reward-model argument.  
  3. **Tail Instability Thesis**: Optimization drives behavior to distributional extremes where the measure behaves erratically or inversely to true goals, a domain-specific empirical regularity; it weakly supports dashboard coarseness to avoid over-optimization but is insufficient for the reward-model case.  
  4. **Strategic Gaming Thesis**: Agents with misaligned incentives deliberately exploit the measure’s loopholes when it is targeted, a contingent empirical regularity; this directly licenses the colleague’s reward-model argument (as AI systems "game" rewards) and all three uses.  
  5. **Definitional Tautology Thesis**: "Worth watching" is defined as measures that degrade under optimization, making the proverb true by definition but trivial; it falsely appears profound yet cannot justify any practical decision, rendering the proverb empty.
