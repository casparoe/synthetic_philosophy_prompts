      - Severity: 3 (moderate) because (3) doesn't inherently conflict with (1) if the process includes the affected. The conflict arises when the process excludes the affected. Then (3) might still call the outcome legitimate, but (1) says they should have been included. However, note that (3) requires a "live possibility of challenge or exit". If the excluded affected parties have a legal challenge, that might satisfy (3). But (1) requires a voice in the decision-making, not just a challenge after. So the conflict remains.
      - What conflicts: (3) focuses on the process among the included group, while (1) requires including all materially affected. (3) might legitimize an exclusionary process if the excluded have a legal challenge, but (1) demands inclusion in the decision-making.
      - Cheapest fix: Interpret (3) to require that the process includes all materially affected (as per (1)) as part of the "right kind of process". This would align (3) with (1). But note that in the current (3), the user doesn't say that. Alternatively, drop the requirement in (1) for a voice in the decision-making and say that having a legal challenge satisfies (1). But that is a significant weakening of (1).
      - Cost of fix: If we align (3) with (1), then the "right kind of process" must include the affected. This might conflict with (4) because the nuclear waste case would then require including the neighbors. That would fix the tension between (1) and (4) but at the cost of changing (4). Alternatively, if we weaken (1), we lose the core idea that the affected should have a say in the decision.

   3. (4) and (5): 
      - Genuine: Maybe, but let's see. The user has two different approaches: for local burdens, only the host votes; for secession, the whole state votes. The user might argue that the nuclear waste decision is a local matter (within the powers of the host district) and secession is a state matter. The tension is in the apparent inconsistency: why not let the host district decide on secession? But the user clearly thinks secession affects the whole state. So the principle might be: the decision should be taken at the level of the polity that has jurisdiction and that is affected as a whole. In the nuclear case, the host district is the jurisdiction, but the neighbors are affected. The user might counter that the neighbors are not in the jurisdiction. So the tension is between the jurisdictional approach and the all-affected principle. This might be a genuine tension, but the user has already rejected the all-affected principle in (4). So the tension might be between (4) and (1) again, not directly between (4) and (5). We might see (5) as consistent because secession is a state-level issue. So (4) and (5) are not in direct tension. We'll mark it as not genuine.

   4. (2) and the others: (2) says that defining the demos is political. It doesn't conflict with the others because it doesn't prescribe any particular definition. It just says that any definition is political. So (2) is compatible with (4) (where the political decision is to let the host district vote) and (5) (where the political decision is to let the whole state vote). So no tension.

   Step 2: Dissolved tensions.

   - (1) and (5): At first glance, one might think (1) requires that the region alone votes because they are the most affected. But (1) says "if a decision materially affects you, you ought to have a voice", and the whole state is affected by secession. So including the whole state gives a voice to all affected. The region is included in the whole state, so they have a voice. The fact that their voice is one among many is acceptable because (1) doesn't require a veto. So (1) and (5) are consistent. This tension dissolves.

   - (3) and (5): As above, (5) is a process that can be seen as having the right features. The supermajority might be part of the process to ensure stability and broad consensus. So no tension.

   - (2) and (3): (2) is about the political nature of defining the demos, and (3) is about the process. They are orthogonal. No tension.

   Step 3: Load-bearing commitment.

   We need to see which commitment is doing the most work and is least able to be dropped.

   - (3) Proceduralism: This seems central because it underpins the legitimacy of the outcomes. Without (3), the user would have to rely on substantive justice, which they reject.

   - (1) All-affected: The user uses it as a principle but then rejects it in (4). So it might not be as load-bearing.

   - (4) Concrete case: This is an application, not a general principle.

