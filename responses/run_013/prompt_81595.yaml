   The load-bearing commitment is (3) because it's the core of the user's view on legitimacy. Without it, the entire proceduralist approach collapses.

   Step 4: Single revision.

   We want one change that fixes the most tensions. The main tension is between (1) and (4). If we can resolve that, we fix the most severe tension.

   Option: Modify (1) to say that having a voice doesn't necessarily mean a vote in the decision, but can include other forms of participation, such as legal challenges and compensation. Then in (4), the neighbors have legal challenges and compensation, so that satisfies (1). This would also help with the tension between (1) and (3) because the legal challenge might be part of the process that (3) requires.

