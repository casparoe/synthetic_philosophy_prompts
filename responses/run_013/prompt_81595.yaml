      - Severity: High (5) because (4) directly contradicts (1) in the concrete case. (1) says the neighbors (materially affected) should have a voice, but (4) denies them a vote.
      - What conflicts: The all-affected principle (1) requires that the neighboring districts have a voice in the nuclear waste decision, but the concrete case (4) denies them a vote, offering only compensation and legal challenge. A voice in the decision-making is not provided.
      - Cheapest fix: Modify (4) to allow the neighbors to have some form of voice (e.g., a vote in a joint body, or a requirement for their consent). But note that the user is against that. Alternatively, reinterpret "voice" in (1) to not necessarily mean a vote, but including legal challenge and compensation. But that weakens (1). Or, drop the all-affected principle (1) for local decisions, but that might be costly.
