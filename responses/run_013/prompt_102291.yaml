  ### Worked Example: Loan Approval at a Bank
  **Scenario**: A bank uses a risk score (1-5) to decide on small loans. The score is derived from financial history and is equally informative for two groups, Urban and Rural. The true outcome is repayment (1) or default (0).  
  - **Urban group**: 60% base repayment rate (30 of 50 applicants would repay).  
  - **Rural group**: 40% base repayment rate (20 of 50 would repay).  

  **Score distributions conditional on outcome** (identical for both groups):  
  - **Repayers (Y=1)**: 10% score 1, 20% score 2, 40% score 3, 20% score 4, 10% score 5.  
  - **Defaulters (Y=0)**: 20% score 1, 30% score 2, 30% score 3, 10% score 4, 10% score 5.  

  **Applicant counts per group (total 50 each)**:  
  | Group  | Outcome | Score 1 | Score 2 | Score 3 | Score 4 | Score 5 |  
  |--------|---------|---------|---------|---------|---------|---------|  
  | Urban  | Repay   | 3       | 6       | 12      | 6       | 3       |  
  | Urban  | Default | 4       | 6       | 6       | 2       | 2       |  
  | Rural  | Repay   | 2       | 4       | 8       | 4       | 2       |  
  | Rural  | Default | 6       | 9       | 9       | 3       | 3       |  

  We choose a **threshold** (e.g., ≥3) to approve loans. Below, we test fairness criteria at thresholds 3 and 4.  

  ---

  ### Analysis at Threshold 3 (approve if score ≥ 3)
  **Urban group (60% base rate)**:  
  - **Approved (score ≥ 3)**: 12 repay + 6 repay + 3 repay + 6 default + 2 default + 2 default = **31 applicants**.  
    - Repayers approved (TP) = 12 + 6 + 3 = 21  
    - Defaulters approved (FP) = 6 + 2 + 2 = 10  
  - **Rejected (score < 3)**: 3 repay + 6 repay + 4 default + 6 default = **19 applicants**.  
    - Repayers rejected (FN) = 3 + 6 = 9  
    - Defaulters rejected (TN) = 4 + 6 = 10  
  - **Metrics**:  
    - *PPV (precision)* = TP / (TP + FP) = 21 / 31 ≈ 67.7%  
    - *FPR* = FP / (FP + TN) = 10 / 20 = 50.0%  
    - *FNR* = FN / (FN + TP) = 9 / 30 = 30.0%  
    - *Approval rate* = 31 / 50 = 62.0%  

  **Rural group (40% base rate)**:  
  - **Approved (score ≥ 3)**: 8 repay + 4 repay + 2 repay + 9 default + 3 default + 3 default = **29 applicants**.  
    - TP = 8 + 4 + 2 = 14  
    - FP = 9 + 3 + 3 = 15  
  - **Rejected (score < 3)**: 2 repay + 4 repay + 6 default + 9 default = **21 applicants**.  
    - FN = 2 + 4 = 6  
    - TN = 6 + 9 = 15  
  - **Metrics**:  
    - *PPV* = 14 / 29 ≈ 48.2%  
    - *FPR* = 15 / 30 = 50.0%  
    - *FNR* = 6 / 20 = 30.0%  
    - *Approval rate* = 29 / 50 = 58.0%  

  **Fairness check**:  
  - **Calibration (PPV equality)**: ❌ **Fails** (67.7% vs. 48.2%).  
    *Why*: Urban has higher base rate, so approved applicants are more likely to repay.  
  - **Equal FPR**: ✅ **Holds** (50.0% both).  
    *Why*: Conditional score distributions for defaulters are identical, so FPR depends only on threshold.  
  - **Equal FNR**: ✅ **Holds** (30.0% both).  
    *Why*: Conditional score distributions for repayers are identical, so FNR depends only on threshold.  
  - **Demographic parity**: ❌ **Fails** (62.0% vs. 58.0%).  
    *Why*: Urban has more high-scoring applicants due to higher base rate.  

  ### Analysis at Threshold 4 (approve if score ≥ 4)
  **Urban group**:  
  - Approved: 6 repay + 3 repay + 2 default + 2 default = **13 applicants**.  
    - TP = 6 + 3 = 9, FP = 2 + 2 = 4 → PPV = 9/13 ≈ 69.2%  
    - FPR = 4/20 = 20.0%, FNR = (3+6+12)/30 = 70.0%  
    - Approval rate = 13/50 = 26.0%  

  **Rural group**:  
  - Approved: 4 repay + 2 repay + 3 default + 3 default = **12 applicants**.  
    - TP = 4 + 2 = 6, FP = 3 + 3 = 6 → PPV = 6/12 = 50.0%  
    - FPR = 6/30 = 20.0%, FNR = (2+4+8)/20 = 70.0%  
    - Approval rate = 12/50 = 24.0%  

  **Fairness check**:  
  - **Calibration**: ❌ Fails (69.2% vs. 50.0%).  
  - **Equal FPR**: ✅ Holds (20.0% both).  
  - **Equal FNR**: ✅ Holds (70.0% both).  
  - **Demographic parity**: ❌ Fails (26.0% vs. 24.0%).  

  ---

  ### Key Insights from the Arithmetic  
  1. **Calibration (PPV) always fails** due to unequal base rates:  
     - PPV = (TP) / (TP + FP).  
     - TP and FP depend on the *number* of repayers/defaulters in the approved pool.  
     - Urban has more repayers (higher base rate), so TP is larger for the same score threshold → higher PPV.  

  2. **Equal FPR/FNR always hold for a fixed threshold**:  
     - FPR = P(approve | default), FNR = P(reject | repay).  
     - Conditional score distributions are identical by design → error rates depend *only* on the threshold, not the group.  

  3. **Demographic parity fails** unless thresholds are extreme:  
     - Approval rate = P(score ≥ threshold).  
     - Urban has higher base rate → more high-scoring applicants → higher approval rate for the same threshold.  

  ---

  ### The Honest Part  
  **What drives the impossibility?**  
  The **unequal base rates** are solely responsible. If base rates are equal (e.g., both 50%), all criteria hold simultaneously at any threshold. For example:  
  - At threshold 3, PPV becomes 60.0% for both groups, FPR 50.0%, FNR 30.0%, and approval rates equalize.  
  - *Collapse?* Yes. Identical conditional distributions + equal base rates → no trade-offs.  

  **Does randomization help?**  
  If the classifier randomizes approvals (e.g., flipping a coin for scores near the threshold), it *might* achieve demographic parity or calibration, but **not both simultaneously**. For example:  
  - To force equal approval rates, randomize approvals in Urban to match Rural’s rate.  
  - But this worsens calibration: Urban’s PPV drops further as more defaulters are approved.  
  - Randomization cannot resolve the fundamental base-rate conflict.  

  **How to attack this setup?**  
  A critic defending calibration (PPV) might argue:  
  - *"You smuggled in identical score distributions! Real models are biased against minorities, so scores are less informative for Rural group."*  
    - Rebuttal: This example isolates base rates as the *only* issue. If model quality differs, the impossibility may not hold—but that’s a separate problem.  
  - *"PPV fairness is ethical: Repayment should mean the same thing for both groups."*  
    - Rebuttal: Forcing equal PPV here requires *lowering* Urban’s approval rate, harming qualified Urban applicants to satisfy an arithmetic constraint.  

  **Final verdict**: The impossibility theorem is a mathematical truth under these conditions. Real-world solutions require trade-offs (e.g., sacrificing calibration for error-rate equality) or group-specific thresholds—but the latter may violate legal or policy constraints.
