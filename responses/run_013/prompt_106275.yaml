prompt: |-
  A group of us runs a small prediction market with real money, and this quarter three of the questions are: whether a well-known open problem in mathematics will be resolved within five years; whether a short program one of us wrote will halt, which nobody has run because it would tie up a cluster for a week; and whether a finite computation we could in principle just perform comes out above or below a stated bound. A colleague argues that the whole exercise is confused — all three answers are already fixed, so a price of 0.4 is a confession of ignorance rather than a belief about anything, and whoever works out an answer will simply take everyone else's money, so the market can never be efficient. Another proposes a house rule: nobody may post a price on a claim that exceeds the sum of the prices they have posted on the steps of any derivation of that claim they could actually carry out. I think there is something right in each complaint and something wrong in the conclusion, but I cannot articulate what. Is it coherent to hold graded beliefs and trade on questions that are already settled in this way, and if so, what should our prices be tracking and how should we score the market? What constraints should a single participant's prices satisfy — including in the case where I can see that a proof is within my reach even though I have not yet carried it out?
reasoning: |-
  Okay, let me start by unpacking this user's query. They run a prediction market with real money, and this quarter's questions involve three different types: an open math problem, a halting program nobody has run, and a finite computation they could do but haven't. Their colleague argues that all answers are already fixed, so pricing reflects ignorance rather than belief, and anyone who figures it out will take everyone's money, making the market inefficient. Another suggests a rule tying prices to derivable steps. The user feels there's something right and wrong in both but can't articulate it.

  First, I need to address the core philosophical issue: can graded beliefs exist for "fixed but unknown" truths? The colleague's point hinges on binary outcomes—either true or false—so any price not 0 or 1 is just ignorance. But in epistemology and decision theory, subjective probability isn't invalidated by unknown truths. People bet on past events they don't know, like the outcome of a sealed game. The key is that the probability reflects rational credence based on available information, not the metaphysical status of the event.

  Next, the efficiency concern. The colleague thinks markets can't be efficient because insiders will exploit others. But prediction markets thrive on dispersed information aggregating. The risk of being exploited incentivizes participants to seek information, which is the market's purpose. However, for computationally hard problems, the cost of obtaining information might be prohibitive, affecting liquidity and price accuracy. So efficiency here depends on whether the cost to resolve uncertainty is worth the trading gains.

  Now, the proposed house rule. Requiring prices not to exceed the sum of derivable steps is interesting but problematic. It confounds epistemic probability with computational cost. For example, the finite computation might have a high probability of being true, but if the derivation steps are expensive, the sum of their prices might be low. Also, proving steps might be interdependent, and the rule could be gamed by choosing easy derivations. Plus, it might stifle markets where participants have intuitive but non-derivative reasons for beliefs.

  For the user's deeper needs, they might be seeking validation that their market isn't pointless, guidance on scoring and rules, and how to handle personal knowledge of provability. They also need practical solutions to maintain market integrity despite information asymmetry.

  Considering each question type: the open math problem's probability could be based on historical resolution rates. The halting program's uncertainty is about computational limits and resources. The finite computation's price should be near 0 or 1 if feasible, but costs might prevent resolution. Participants might use heuristics or partial information.

  For constraints on prices, coherence like Dutch book arguments still apply. If someone knows a proof is feasible, their price should reflect that, but they might not have incentives to act if costs outweigh profits. Market scoring rules like LMSR could help by subsidizing trades and rewarding information revelation.

  In summary, the market is coherent, prices track informed credences under constraints, and scoring should encourage information aggregation while managing computational costs. The house rule isn't ideal, but transparency about derivations could be encouraged without mandating it. Practical steps include accepting the inherent uncertainty and using mechanisms to mitigate exploitation risks.
answer: |-
  Your colleague's critique touches on deep philosophical and practical issues in prediction markets, but their conclusion overreaches. Here's a breakdown of why graded beliefs are coherent, what prices should track, and how to address computational constraints:

  ### 1. **Why Graded Beliefs Are Coherent for "Fixed" Outcomes**
     - **Epistemic vs. Ontologic Certainty**: While the answers *are* ontologically fixed, participants lack *epistemic* access. Graded beliefs (subjective probabilities) rationally reflect available evidence, computational limits, and heuristic reasoning. For example:
       - The open math problem's resolution likelihood might be estimated from historical rates of breakthrough in the field, analogous to assigning a probability to a sealed box containing a live cat based on known physics.
       - The halting program's outcome could be assigned a probability based on partial runtime observations, code structure analysis, or similarity to known algorithms.
     - **Markets Aggregate Dispersed Knowledge**: Even if no single participant knows the answer, prices synthesize fragments of insight (e.g., "Alice thinks Problem X resembles Problem Y, which took 8 years to solve"). A price of 0.4 isn't *mere* ignorance—it's a belief weighted by evidence.

  ### 2. **Addressing the "Efficiency" Objection**
     - **Exploitability is a Feature, Not a Bug**: The threat of being "taken" incentivizes research. If someone *can* resolve the question profitably (e.g., by renting a cluster for a week), the market rewards effort. Efficiency emerges dynamically: prices approach 0 or 1 as information costs decrease.
     - **But Computational Costs Matter**: For the finite computation, if performing it costs $1,000 but the market's total stake is $500, rational traders won't resolve it—they'll trade on heuristics instead. Prices then reflect **cost-constrained rationality**.

  ### 3. **Problems with the Proposed House Rule**
     - **Derivations ≠ Probabilistic Evidence**: Summing prices of derivation steps conflates logical certainty with probabilistic belief. Example: 
       - Claim: "Program halts." 
       - Steps: "Step 1 (price 0.6) + Step 2 (price 0.7) = 1.3 > 1." 
       - But probabilities aren't additive—this invites Dutch books (sure losses).
     - **Ignores Alternative Paths**: You might have high confidence from an *unformalized* insight (e.g., an analogy to a known halting program). Forcing derivations stifles such knowledge.
     - **Computational Feasibility is Vague**: "Could actually carry out" is subjective. A proof might require 1,000 steps—possible in principle but impractical.

  ### 4. **What Prices Should Track & How to Score**
     - **Prices Should Reflect Expected Truth Under Constraints**:
       - **Open Problem**: Base prices on historical precedent (e.g., 15% of similar conjectures resolved in 5 years) and community progress.
       - **Halting Problem**: Price based on runtime snapshots, code complexity metrics, or known halting bounds for subroutines.
       - **Finite Computation**: Price near 0 or 1 *if* performing it is trivial; otherwise, treat it like the halting problem.
     - **Scoring Mechanism Recommendations**:
       - Use a **proper scoring rule** (e.g., logarithmic scoring) to reward accurate probabilities.
       - Implement a **market scoring rule** (e.g., LMSR) subsidized by the house to encourage liquidity. This offsets the risk of low trading volume.
       - For computational claims, allow "resolution triggers": Any participant can pay to run the computation/proof, with costs reimbursed from the market pool if they're correct.

  ### 5. **Constraints for Rational Participants**
     - **Avoid Dutch Books**: Prices must satisfy probability axioms (e.g., P(A) + P(¬A) = 1; P(A∪B) = P(A) + P(B) for disjoint A,B). This is non-negotiable.
     - **Account for Personal Proof Feasibility**:
       - If you *could* easily prove/disprove a claim (e.g., the finite computation), your price must be near 0 or 1—anything else is incoherent. Trading against your knowledge would be equivalent to burning money.
       - For hard proofs (e.g., the open problem), your price should factor in:
         - **Cost of Verification**: Time/effort needed to derive the proof.
         - **Opportunity Cost**: Expected profit from trading vs. cost of resolving.
         - **Risk of Being Scooped**: Others might resolve it first.
       - *Example*: If proving Claim A would cost you $200 in effort, and the market offers a $300 profit opportunity for certainty, your price must be 0 or 1—you *must* resolve it or abstain. If profit is $50, you can trade at intermediate probabilities.

  ### Practical Implementation Advice
  1. **Disclose Known Feasibility**: Require traders to affirm they haven't secretly resolved claims where feasible (e.g., "I confirm I did not run the program").
  2. **Dynamic Resolution Bounties**: Allocate a portion of the market stake to reward resolution (e.g., "Anyone who runs the cluster program gets 10% of the market pool if they reveal the outcome").
  3. **Allow Synthetic Derivatives**: Let participants trade on sub-claims (e.g., "Lemma X is true") to indirectly price complex proofs without formal derivations.
  4. **Track Computational Costs**: For the finite computation, set a deadline after which it must be resolved collaboratively.

  **In essence**: Prediction markets on "fixed" unknowns are epistemically valid—prices reflect rational beliefs under ignorance and constraints. The true inefficiency arises only if information can't be *profitably* extracted, not because answers are predetermined. Your colleague's rule is well-intentioned but misguided; instead, embrace cost-sensitive trading and incentivize resolution where feasible.
