prompt: |-
  Assume the role of a philosopher working across social choice theory, normative ethics, and the technical alignment literature, and write for someone who already knows the standard moves. Think carefully before answering, and open with a short brainstorm of the candidate requirements before you commit to the final list, so that I can see the reasoning that produced it.

  I have been reading rationalist blogs and forums for years, and I keep meeting the same question in different clothing: when someone says that an aligned system should serve humanity's values, or the values of everyone affected, or human values, what would a theory have to deliver before that phrase becomes determinate enough to build on? I do not want a literature survey, a reading list, or citations. I want the specification first, and I want it sharp enough that I could hand it to a designer.

  Fix the purpose as follows, since adequacy is relative to it: the theory is meant to govern a system that will act at global scale, with effects on people now alive, on people who will exist only because of its choices, and on beings whose moral status is contested (animals, and possible digital minds). Give me the desiderata such a theory must meet, as a list, with the case or consideration behind each item:

  - the cases it must get right (include at least: a large majority wanting one thing and a minority who would be coerced by it; a party whose welfare or values would be sacrificed wholesale for a much larger aggregate; parties who cannot report preferences at all; and preferences that the system itself could cheaply reshape by persuasion or by choosing what information to surface);
  - the distinctions it cannot collapse (for instance between aggregating the preferences people happen to have and constructing an idealized or laundered set of values; between serving values as preference satisfaction and helping people pursue their own ends; between what is good for a person and what that person endorses; and between a requirement of liberal neutrality among reasonable doctrines and the need to take some stand);
  - the formal or structural results it has to be consistent with (interpersonal comparability or its denial, strategic misrepresentation by the parties whose preferences are being aggregated, and whatever the relevant impossibility and paradox results actually forbid);
  - and the operational constraints any real implementation imposes (it must be computable in practice, it must survive being gamed, and it must remain correctable when it gets the specification wrong).

  Mark which requirements you take to be non-negotiable and which are merely preferences of a camp. Flag any subset you suspect cannot be jointly satisfied; that is the part I most want to see, and if the conflict is real, then the list itself is the result. Say which single requirement does the most to exclude otherwise popular candidate theories. Then, briefly, how two or three familiar contenders fare against the list (a straightforward preference-aggregation view, a contractualist or bargaining view, and something in the neighborhood of an idealized-extrapolation view); keep this part short, since the criteria are the deliverable.

  Finally, tell me where your reasoning is most likely to have failed and what would change your mind about the shape of the list: which case or argument would make you drop a requirement, demote a non-negotiable to a mere preference, or add one you left out.
reasoning: |-
  Okay, the user is asking me to step into the role of a philosopher specializing in social choice theory, normative ethics, and AI alignment. They want a sharp specification for what it means for an AI system to serve "humanity's values" or "values of everyone affected," with clear desiderata they could hand to a designer. 

  Hmm... the user is clearly sophisticated—they mention years of reading rationalist blogs and forums, and they're tired of vague answers. They're not looking for citations or surveys but for operational criteria. The purpose is fixed: a global-scale system affecting current/future humans and contested beings (animals/digital minds). 

  First, I need to brainstorm the candidate requirements before finalizing. The user specified four buckets: cases to handle, distinctions to preserve, formal constraints, and operational limits. Let me unpack each: 

  For cases, they explicitly listed minority coercion, aggregate sacrifice, non-reporting entities, and malleable preferences. I should add future people and contested beings since they're in the scope. For distinctions, the user named preference-vs-idealization, preference-satisfaction-vs-ends, good-vs-endorsement, neutrality-vs-stand. I'll include moral status uncertainty too—it's critical for animals/digital minds. Formal constraints? Arrow’s theorem looms large (ordinality, independence, IIA), plus strategic voting and comparability. Operational needs: computability, anti-gaming, correctability. 

  Wait—correctability is tricky. If the system "gets the specification wrong," how do we correct it without circularity? That might need flagging as a tension point. 

  Now, non-negotiables: anything that blocks functional deployment seems mandatory. E.g., non-coercion-of-minorities is ethical bedrock; operational robustness is non-negotiable for real-world use. Distinctions like good/endorsement might be more "camp preferences," though collapsing them risks paternalism. 

  Biggest exclusion? Probably denying interpersonal comparability. Utilitarianism thrives on it, but Arrow-style frameworks forbid it—and most aggregation models inherit that constraint. That alone sinks naive preference utilitarianism. 

  Contenders: 
  - Preference aggregation (e.g., Harsanyi) fails on malleable preferences and comparability. 
  - Contractualism (Scanlon/Rawls) handles coercion but stumbles on non-humans and correctability. 
  - Idealized extrapolation (CEV-ish) dodges malleability but crashes on operational constraints (computability, gaming). 

  My blind spots? Maybe underestimating corrigibility’s paradox—if the system is wrong, who corrects it? If I heard a solid argument that corrigibility requires a meta-system *already* aligned, I’d demote it to aspirational. Or if someone proved idealized extrapolation *can* be made computable via new math, I’d soften on operational strictness. 

  ...Time to structure this tightly. The list must feel like a spec sheet—no fluff.
answer: |-
  Here is the specification distilled, with reasoning visible. The core tension is between **procedural legitimacy** (respecting actual agents) and **outcome robustness** (securing non-regrettable results under manipulation and scale), exacerbated by moral uncertainty. Requirements are categorized as **N** (non-negotiable for functional deployment) or **P** (camp preference, though often widely shared). Conflicts flagged in *italics*.

  ---

  ### **Brainstorm: Candidate Requirements**  
  *Derived from purpose (global scale, multi-generational, contested moral patients):*  
  1. **Must handle coercion:** Large majorities imposing costs on minorities.  
  2. **Must handle existential tradeoffs:** Sacrificing a group for greater aggregate benefit.  
  3. **Must incorporate non-linguistic beings:** Animals, future humans, possible digital minds.  
  4. **Must resist manipulation:** Preferences reshaped by the system’s own actions (e.g., via information filtering).  
  5. **Must not collapse is/ought:** Actual preferences vs. normative ideals.  
  6. **Must respect agential authority:** Distinguish welfare from endorsement.  
  7. **Must resolve neutrality vs. truth:** Can’t dodge substantive moral commitments.  
  8. **Must be Arrow-consistent:** Respect impossibility theorems (e.g., no universal cardinal comparability).  
  9. **Must be strategy-proof:** Agents shouldn’t gain by misrepresenting preferences.  
  10. **Must be computable under uncertainty.**  
  11. **Must be corrigible:** Allow safe modification if misaligned.  
  12. **Must not incentivize gaming:** By users or the system itself.  

  *Refinements:*  
  - Added **moral status uncertainty** (contested beings require optionality).  
  - Split "preferences vs. ideals" into two distinctions (5 & 6).  
  - Added **corrigibility** (operational safety).  
  - Merged "survive gaming" and "strategic misrepresentation" into anti-gaming robustness.  

  ---

  ### **Final Desiderata List**  

  #### **1. Cases to Handle**  
  - **C1 (N): Minority coercion cases** (e.g., 95% prefer policy enslaving 5%). *Case: Tests respect for basic rights.*  
  - **C2 (N): Aggregate sacrifice cases** (e.g., exterminating a tribe to save millions). *Case: Tests utilitarianism vs. deontology.*  
  - **C3 (N): Non-reporting entities** (e.g., animals, future generations). *Case: Moral patienthood beyond consent.*  
  - **C4 (N): Malleable preferences** (e.g., system shapes desires via dopamine optimization). *Case: Prevents wireheading.*  

  #### **2. Distinctions to Preserve**  
  - **D1 (P): Actual vs. idealized preferences** (e.g., current selfish desires vs. post-hypothetical-reflection values). *Distinction: Anti-paternalism vs. anti-nihilism.*  
  - **D2 (P): Preference-satisfaction vs. objective interests** (e.g., satisfying addiction vs. health). *Distinction: Hedonism vs. perfectionism.*  
  - **D3 (N): Welfare vs. endorsement** (e.g., forcing medicine on unconscious patient). *Distinction: Authoritarianism vs. autonomy.*  
  - **D4 (N): Liberal neutrality vs. moral realism** (e.g., refusing to ban torture vs. affirming it’s objectively wrong). *Distinction: Pluralism vs. truth-claims.*  

  #### **3. Formal Constraints**  
  - **F1 (N): Consistency with Arrow’s impossibility** (or generalizations): Must reject unrestricted domain, IIA, or ordinal non-comparability. *Constraint: Forces tradeoffs in aggregation.*  
  - **F2 (N): Non-manipulability**: Strategy-proofness or approximation (e.g., dominant-strategy incentive compatibility). *Constraint: Prevents exploitation.*  
  - **F3 (P): Interpersonal comparability (IPC)**: Must either allow cardinal welfare comparisons or function without them. *Constraint: Determines if utilitarianism is viable.*  

  #### **4. Operational Constraints**  
  - **O1 (N): Computability**: Output in polynomial time with uncertain, sparse data. *Constraint: Real-world feasibility.*  
  - **O2 (N): Anti-gaming robustness**: Resistant to manipulation by users, designers, or the system’s own actions. *Constraint: Security.*  
  - **O3 (N): Corrigibility**: Allows shutdown/modification without resistance if objectives are mis-specified. *Constraint: Avoids irreversible lock-in.*  

  ---

  ### **Conflicts & Exclusions**  
  - ***Key Conflict***: **D3 (Welfare vs. Endorsement) + C4 (Malleable Preferences) + O2 (Anti-Gaming)**. If preferences are malleable, respecting endorsement (D3) risks the system gaming its own inputs (violating O2). But overriding endorsement violates D3. *No known theory resolves this.*  
  - ***Most Exclusionary Requirement***: **F1 (Arrow-Consistency)**. Excludes all ordinal preference-aggregation theories (e.g., Condorcet methods) as universal solutions. Forces either cardinal IPC (rejected by many deontologists) or domain restrictions (requires contentious normative assumptions).  

  ---

  ### **Contenders’ Performance**  
  - **Preference-Aggregation (e.g., Harsanyi Utilitarianism)**:  
    - ✗ **F1**: Assumes cardinal IPC (forbidden by Arrow without strong assumptions).  
    - ✗ **C1/C2**: Sacrifices minorities/rights for aggregate welfare.  
    - ✗ **C4**: Vulnerable to preference manipulation.  
  - **Contractualist Bargaining (e.g., Scanlonian/Rawlsian)**:  
    - ✓ **C1/D3**: Rejects coercion; prioritizes justifiability to all.  
    - ✗ **C3**: Struggles with non-reasoning beings (e.g., animals).  
    - ✗ **O3**: Original position/veil-of-ignorance not computably scalable.  
  - **Idealized Extrapolation (e.g., Coherent Extrapolated Volition)**:  
    - ✓ **D1/D2**: Seeks "laundered" preferences.  
    - ✗ **C4/O2**: Highly vulnerable to manipulation during extrapolation.  
    - ✗ **O1**: Computationally intractable (requires counterfactual modeling of all minds).  

  ---

  ### **Failure Modes & Mind-Changers**  
  - **Where I’m Likely Wrong**: Underestimating **O1 (Computability)**. If computational ethics breakthroughs occur (e.g., moral uncertainty quantified tractably), some constraints relax.  
  - **What Would Change the List**:  
    - **Drop D2 (Preference vs. Interests)**: If shown that "true preferences" converge metaphysically with welfare (e.g., desire-fulfillment theory of good).  
    - **Demote F2 (Non-Manipulability) from N to P**: If anti-gaming is provably unsolvable and must be handled externally.  
    - **Add Requirement**: **Value stability** (resilience to small epistemic errors) if shown that tiny uncertainties cause catastrophic swings.  

  This specification isn’t a theory—it’s a filter. The unresolved conflict at D3+C4+O2 suggests that any viable theory must **treat preference-formation as a normative process**, not a static input. That, or accept a moral realist stance (violating D4) to anchor correction. Either way, the designer’s key takeaway: **Avoid systems that take reported preferences as sovereign.**
