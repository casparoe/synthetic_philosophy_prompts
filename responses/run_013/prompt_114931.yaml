prompt: |-
  I'm assembling a casebook on when a system's behavior is genuinely its own rather than merely produced in it, and I need one case built to order. First, the apparatus the case has to exercise. Call behavior sphexish to the extent that it runs to completion on its cue and cannot be exited by the system itself. Three rival diagnostics of sphexishness are in play, and I need a case on which they come apart.

  1. Routine-revisability. A system is sphexish to the degree that its behavior is generated by a procedure it cannot alter once that procedure has failed. On this diagnostic, a system that rewrites its methods as soon as one of them misfires is flexible, whatever it is aiming at.
  2. Aim-revisability. A system is sphexish to the degree that its terminal aim is immune to anything it learns. Here a system that rewrites its procedures at will but never lets any observation count against its ultimate end is the paradigm of rigidity, while a system with a frozen procedure and a corrigible end is flexible.
  3. Cue-detachment. A system is sphexish to the degree that it cannot treat the trigger of its own behavior as an object — cannot register that the situation is a decoy, a test, or the cue without its usual backing. Here flexibility is the capacity to exit a routine because the cue has been recognized as merely a cue.

  Build me a single case on which these split as follows: routine-revisability says flexible, aim-revisability says rigid, cue-detachment says flexible.

  Constraints. Realistic and contemporary; one paragraph. No science fiction, no brains in vats, no indeterminacy at the physical level, and no mechanism of the form "an implant, drug, or lesion made it so." The subject must be the kind of thing we pre-theoretically credit with agency — a person, a non-human animal, or an institution acting through its officials — not a machine and not a laboratory construct. The aim-revisability verdict must not be earned by making the aim thin: survive, maximize reward, and keep the institution running are disqualified, since they make the diagnostic vacuous; the aim must be specific enough that we can see what it rules out. The routine-revisability verdict must not be earned by giving the system only one procedure; the system must demonstrably repair, replace, and recombine its methods. And the case must survive the obvious rebuttal from the aim-revisability side, that what looks like an unmoved aim is really an aim being re-specified or evidence being missed: include a fact that the system registers as evidence, that it treats as decisive whenever it bears on a method, and that by its own standards bears against the aim — and let the aim not budge. Do not secure this by stipulating that the aim never changes; a reader who accepts the second diagnostic must be able to see from the described behavior why the aim is fixed.

  Then give me a variant of the same case differing in exactly one respect, in which the first two diagnostics swap verdicts. Name the one respect.

  Then the working-through. State the case; for each of the three diagnostics give the verdict and the reason, citing only features of the scenario. Say which feature is load-bearing, what becomes of the split if that feature is removed, and what becomes of it if the feature is strengthened. Write the strongest attack open to a defender of the diagnostic that fares worst, and say whether the case can be repaired against that attack or whether the attack succeeds. For each diagnostic, name an intervention a bystander could actually perform on the system that would count as evidence for or against that diagnostic's verdict, and say what the diagnostic predicts about the outcome. Close with the free-will upshot: on which diagnostic, if any, does the behavior stop being the system's own, and is the remaining disagreement substantive or verbal once the diagnostic is fixed. A case that stipulates its verdicts rather than generating them from the described behavior is a failure; the casebook exists to show that the compatibility question turns on which diagnostic one adopts.
reasoning: |-
  We are constructing a case study that satisfies the following conditions:

  1. **Routine-revisability** says the system is flexible: it can alter its procedures when they fail.
  2. **Aim-revisability** says the system is rigid: it never changes its terminal aim even when presented with evidence that bears against it.
  3. **Cue-detachment** says the system is flexible: it can recognize a cue as merely a cue (e.g., a decoy) and exit the routine.

  Constraints:
  - Realistic and contemporary: no sci-fi, brains in vats, etc.
  - Subject: a pre-theoretically agential entity (person, non-human animal, institution).
  - Aim must be specific (not "survive", "maximize reward", etc.).
  - System must have multiple procedures and demonstrate repair/replacement of methods.
  - Must include evidence that the system registers as decisive against a method and by its own standards bears against the aim, but the aim does not change.

  Then, a variant where the first two diagnostics (routine-revisability and aim-revisability) swap verdicts.

  Finally, the working-through.

  ---

  **The Case: A Political Campaign Institution**

  Consider a well-established political party (an institution) running a campaign for a specific policy: banning single-use plastics in its country by 2030. This is the terminal aim. The party has multiple procedures for advancing this aim: lobbying legislators, public awareness campaigns, legal challenges to pro-plastic regulations, and supporting eco-friendly businesses. When a procedure fails (e.g., a lobbying effort is rebuffed because of strong industry opposition), the party analyzes the failure, consults experts, and revises its methods (e.g., shifting resources to grassroots mobilization). Thus, it demonstrably repairs and replaces methods.

  Now, suppose the party encounters strong evidence that the policy, if implemented, would cause massive job losses in the manufacturing sector (which it values) without significantly reducing global plastic pollution (because production would shift abroad). The party's own research unit registers this evidence and treats it as decisive when it comes to methods (e.g., they abandon a particular legislative strategy because it would exacerbate job losses). However, the party does not change the terminal aim of banning single-use plastics by 2030. Instead, they double down, arguing that the long-term environmental benefits outweigh the short-term costs and that they can mitigate job losses through retraining programs. They do not consider abandoning the aim.

  Moreover, the party can recognize a cue as a decoy. For instance, if a pro-plastic group stages a fake "grassroots" rally in support of the ban (to later discredit it by association with extremism), the party's intelligence unit identifies it as a manufactured cue and avoids participating, thus exiting the routine of engaging with every supportive event.

  **Diagnostics Applied:**

  1. **Routine-revisability**: Flexible. The party changes its methods (lobbying, campaigning) when they fail. For example, when lobbying fails, they switch to grassroots mobilization. They revise routines based on failure.

  2. **Aim-revisability**: Rigid. The terminal aim (ban single-use plastics by 2030) does not change even when the party acknowledges evidence (job losses, limited environmental impact) that, by its own standards (since they care about jobs and effective environmentalism), bears against the aim. They treat the evidence as decisive against methods but not against the aim.

  3. **Cue-detachment**: Flexible. The party can recognize a cue (the fake rally) as a decoy and exit the routine of engaging with it.

  This satisfies the required split.

  **The Load-Bearing Feature**: The evidence that the system registers as decisive against a method but not against the aim. Specifically, the party accepts the evidence (job losses, limited environmental impact) as a reason to change methods but not the aim.

  **What if removed?** If the party did not register any evidence that by its own standards bears against the aim, then aim-revisability might not call it rigid (because there's no evidence to ignore). The split would collapse.

  **What if strengthened?** If the party repeatedly faces such evidence and still doesn't change the aim, it reinforces the rigidity verdict for aim-revisability.

  ---

  **Variant: Swapping the First Two Diagnostics**

  Change exactly one respect: **The party's terminal aim is re-specified to be "achieving a significant reduction in plastic waste in the country by 2030" (instead of a ban)**.

  In the variant, the party starts with the aim of a ban. But when they receive the same evidence (job losses, limited environmental impact), they change the aim to "significant reduction" (which might include alternatives like recycling incentives, taxes, etc.). They still revise routines when they fail (e.g., switch lobbying to grassroots if one fails). But now:

  - **Routine-revisability**: Still flexible (same as before).
  - **Aim-revisability**: Now flexible because the terminal aim changed in response to evidence.
  - **Cue-detachment**: Unchanged, still flexible.

  But we need the first two to swap: so in the original, routine-revisability says flexible and aim-revisability says rigid. In the variant, we want routine-revisability to say rigid? But we haven't changed the routine-revisability aspect.

  We need to change one respect so that the routine-revisability verdict changes and the aim-revisability verdict changes. How?

  Instead, let's change: **The party does not revise its methods when they fail, but it does change its aim when presented with evidence against it.**

  But the constraint requires that the system must demonstrably repair methods in the original. In the variant, we can have a case where the system does not revise methods but does change the aim.

  But the original case requires the system to have multiple procedures and repair them. So we must design the variant to have that property but then change one thing to make routine-revisability rigid and aim-revisability flexible.

  Alternative change: **The party is now unable to revise its methods because of an internal rule (e.g., a charter that dictates methods) but can change its aim.**

  But we cannot use "an implant, drug, or lesion" and must be realistic. An institutional rule might work.

  So:

  **Variant**: The same political party has a terminal aim of banning single-use plastics by 2030. However, due to a recent internal reform, the party's charter now requires that all methods must be approved by a central committee that meets only once a year. When a method fails (e.g., lobbying fails), they cannot change it until the next annual meeting. So they are stuck with the failed method until then. However, when presented with the evidence (job losses, limited environmental impact), the central committee (in its annual meeting) decides to change the terminal aim to "reducing plastic waste by 50% by 2030" (which allows for non-ban methods).

  Now:
  1. **Routine-revisability**: Rigid. They cannot alter a procedure immediately when it fails; they are stuck until the annual meeting.
  2. **Aim-revisability**: Flexible. The terminal aim changes in response to evidence (at the annual meeting).
  3. **Cue-detachment**: Still flexible? They can still recognize a decoy rally and avoid it (unless the method of attending rallies is currently fixed and they cannot exit? But cue-detachment is about recognizing the cue as a decoy and exiting the routine. They might still be able to do that without changing the annual plan? Let's say they have a standing procedure to avoid decoys, which is not subject to the annual approval. So cue-detachment remains flexible.

  So the first two swap: routine-revisability goes from flexible (original) to rigid (variant), and aim-revisability goes from rigid (original) to flexible (variant).

  The one respect changed: **The party's decision-making structure now imposes a fixed annual cycle for changing methods, while the aim can be changed at the same meeting in response to evidence.**

  ---

  **Working-Through**

  **Case Statement (Original)**:

  A political party aims to ban single-use plastics by 2030. It uses multiple methods (lobbying, campaigns, legal challenges) and revises them when they fail (e.g., switches to grassroots mobilization if lobbying fails). When presented with evidence that the ban would cause job losses without significantly reducing global plastic pollution, the party treats this as decisive for changing methods (e.g., they abandon a legislative strategy that exacerbates job losses) but does not change the terminal aim. The party also recognizes a fake rally (staged by opponents) as a decoy and avoids it, exiting the routine of participating in supportive events.

  **Diagnostics Verdicts and Reasons**:

  1. **Routine-revisability**: Flexible. Reason: The party revises its methods (e.g., from lobbying to grassroots) when a method fails (lobbying rebuffed). [Cites: revision of methods upon failure.]

  2. **Aim-revisability**: Rigid. Reason: The party does not change the terminal aim (ban by 2030) even when it registers evidence (job losses, limited environmental impact) that, by its own standards (since it values jobs and effective environmentalism), counts against the aim. [Cites: evidence registered, used to change methods, but aim unchanged.]

  3. **Cue-detachment**: Flexible. Reason: The party exits the routine of attending a rally when it recognizes the rally as a decoy. [Cites: identification of cue as manufactured and non-participation.]

  **Load-Bearing Feature**: The evidence (job losses, limited environmental impact) that the system registers and treats as decisive for changing methods but not for changing the aim.

  **If Removed**: Without such evidence, there would be no basis for aim-revisability to call it rigid (since no evidence against the aim is ignored). The split between aim-revisability and the others would collapse.

  **If Strengthened**: If the party repeatedly faces even stronger evidence (e.g., multiple independent studies, real-world examples) and still does not change the aim, it reinforces the rigidity verdict for aim-revisability and does not affect the other two.

  **Strongest Attack (from aim-revisability defender)**:

  Defender of aim-revisability might argue: "The party's aim hasn't changed because they have a higher-order aim (e.g., 'being a leader in environmental policy') that the ban serves, and the evidence doesn't undermine that. The terminal aim of the ban is just a sub-aim. Or, they might be re-specifying the aim by adding mitigations (retraining programs) without changing the core. Thus, the aim is not fixed; it's being re-specified in the face of evidence."

  **Rebuttal**: The case includes that the party, by its own standards, treats the evidence as bearing against the aim (because they value job losses and effective environmentalism). They do not take the evidence as a reason to reconsider the ban at all (they double down). Moreover, the aim is specified as the ban itself, not a higher-order aim. The constraint requires the aim to be specific enough (ban by 2030). The attack might be weakened by noting that the party does not even consider abandoning the ban. However, to repair the case, we can add: the party explicitly rejects motions to change the aim in internal meetings, despite acknowledging the evidence. Thus, the aim is fixed.

  **Interventions for each diagnostic**:

  1. **Routine-revisability**: Intervention: Cause a method to fail (e.g., orchestrate a legislative defeat). Prediction: The party will change its method (e.g., shift to grassroots). This supports flexibility.

  2. **Aim-revisability**: Intervention: Present new, even more compelling evidence against the aim (e.g., a UN report showing the ban would have negligible global impact and cause severe economic harm). Prediction: The party will not change the aim (supports rigidity).

  3. **Cue-detachment**: Intervention: Stage a decoy event (e.g., a fake rally). Prediction: The party will recognize it as a decoy and avoid it (supports flexibility).

  **Free-Will Upshot**:

  - On aim-revisability, the behavior (persisting with the ban despite evidence) is not the system's own because the aim is fixed and immune to learning. The system is rigidly driven by an unchangeable aim.
  - On routine-revisability and cue-detachment, the behavior is the system's own because it can revise methods and respond to cues intelligently.
  - The disagreement is substantive: it depends on whether one thinks ownership of behavior requires revisability of aims (aim-revisability) or merely of methods and cue-responsiveness (the others). Once the diagnostic is fixed, the verdict follows, but the choice of diagnostic is not merely verbal.

  Thus, the case shows that the compatibility of the behavior with being the system's own turns on which diagnostic one adopts.
answer: |-
  ### Case: The Environmental NGO  
  An established environmental non-governmental organization (NGO) operates with the terminal aim of shutting down all domestic coal power plants by 2040. It employs multiple procedures: litigation against plant operators, public protests at plant sites, lobbying for stricter emissions laws, and media campaigns. When a procedure fails (e.g., a lawsuit is dismissed due to insufficient evidence), the NGO analyzes the failure, consults experts, and revises its approach—switching from litigation to targeted protests or ramping up lobbying. It demonstrably repairs and recombines methods. During a routine assessment, the NGO's research team registers conclusive evidence that abruptly shutting down coal plants would cause immediate, widespread blackouts in regions dependent on coal, disproportionately harming low-income communities (a value the NGO explicitly prioritizes). The NGO treats this evidence as decisive against its current methods (e.g., it halts planned protests to avoid exacerbating harm) but does not alter the terminal aim. Instead, it intensifies efforts toward the shutdown, arguing that long-term environmental benefits justify short-term costs and proposing band-aid solutions like temporary generators. Separately, when the NGO identifies a state-sponsored "grassroots" rally promoting coal shutdowns as a decoy (designed to provoke violence and discredit the movement), it cancels participation and publicly disavows the event, exiting the protest routine.  

  ### Variant: Swapped Verdicts  
  **One Respect Changed**: The NGO's terminal aim is re-specified as "achieving a 90% reduction in domestic coal power generation by 2040" (instead of a full shutdown). In this variant, when presented with the same evidence of blackouts and community harm, the NGO revises its terminal aim to allow partial coal use in transition regions. However, due to a new internal policy requiring board approval for all method changes (the board meets biannually), it cannot revise procedures mid-campaign when they fail (e.g., a dismissed lawsuit stalls all litigation efforts for months). Routine-revisability now says rigid (methods are stuck), aim-revisability says flexible (aim changes with evidence), and cue-detachment remains flexible (it still exits decoy rallies).  

  ---

  ### Working-Through  
  **Case Statement**: The NGO aims to shut down all domestic coal plants by 2040. It revises methods upon failure (e.g., abandons litigation for protests after a lawsuit loss). It registers evidence that the shutdown would cause harmful blackouts, treats this as decisive for method changes (halts protests), but not for the aim (persists with shutdown goal). It exits a protest routine upon recognizing a state-sponsored rally as a decoy.  

  **Diagnostic Verdicts and Reasons**:  
  1. **Routine-revisability (flexible)**: The NGO replaces failed procedures (e.g., litigation → protests) based on analysis, showing it can repair methods.  
  2. **Aim-revisability (rigid)**: The NGO does not change its terminal aim (full shutdown) despite registering evidence (blackouts harming communities) that, by its own standards (prioritizing low-income welfare), decisively bears against the aim.  
  3. **Cue-detachment (flexible)**: The NGO identifies the rally as a manufactured cue ("decoy") and exits the protest routine, showing it can detach from the trigger.  

  **Load-Bearing Feature**: The evidence of blackouts harming communities. This is registered by the NGO, treated as decisive for method changes, and—by the NGO's explicit values—logically bears against the terminal aim (shutdown causes harm it seeks to avoid).  

  - **If Removed**: Without this evidence, aim-revisability could not indict rigidity (no ignored counter-evidence exists), collapsing the split. Routine-revisability and cue-detachment would still call it flexible.  
  - **If Strengthened**: If the evidence is amplified (e.g., real-time data showing blackouts causing deaths), aim-revisability's rigidity verdict hardens (the NGO still won't budge), while others are unaffected.  

  **Strongest Attack from Aim-Revisability Defender**:  
  "The NGO *is* revising its aim: by proposing temporary generators, it re-specifies the shutdown aim to include 'harm mitigation,' so the core goal adapts. The evidence isn't ignored; it's incorporated into a refined aim."  
  - **Repair Against Attack**: The case specifies that the NGO explicitly rejects internal proposals to abandon or dilute the shutdown goal (e.g., minutes from strategy meetings show votes against aim revision). Mitigation measures are framed as tools to *preserve* the unchanged aim, not re-specify it. The attack fails because the terminal aim (full shutdown) remains unaltered in scope and priority.  

  **Interventions as Evidence**:  
  - **Routine-revisability**: Cause a method failure (e.g., leak documents discrediting their litigation evidence). Prediction: NGO revises methods (e.g., shifts to lobbying), supporting flexibility.  
  - **Aim-revisability**: Present irrefutable data linking shutdowns to increased poverty (e.g., a World Bank study). Prediction: NGO adjusts methods but maintains shutdown aim, supporting rigidity.  
  - **Cue-detachment**: Stage a fake protest (e.g., a coal-plant "support" rally designed to trap them). Prediction: NGO identifies it as a decoy and withdraws, supporting flexibility.  

  **Free-Will Upshot**:  
  - On **aim-revisability**, the behavior (pursuing shutdown despite evidence) stops being the system's "own" because the aim is immune to learning, rendering the NGO a slave to fixed goals.  
  - On **routine-revisability** and **cue-detachment**, the behavior remains its own, as the NGO intelligently updates methods and responds to cues.  
  - The disagreement is **substantive**: It hinges on whether behavioral ownership requires aim plasticity (aim-revisability) or merely method plasticity and cue-awareness (others). Fixing the diagnostic resolves the verdict, but the choice between diagnostics reflects deeper views on agency—e.g., whether aims define "self" or are just one lever in adaptive behavior.  

  The case generates verdicts from behavior (e.g., method revision proves routine-flexibility; unchanged aim amid evidence proves aim-rigidity), satisfying the casebook's purpose: showing that compatibility with "genuine ownership" depends on the chosen diagnostic.
