prompt: |-
  So I just got into a two hour arguement with my friend Nadia about joint action, and I want an outside number, not a literature survey. Here's the claim I want a credence on: that no "individualistic" analysis of shared intention can work — that you cannot say what it is for you and me to intend to do something together using only facts about each of us seperate (my intentions and beliefs, yours, plus maybe common knowledge between us), and that an irreducibly plural "we intend" has to be taken as primitive. You're a philosopher of action, so take it seriously and think it through carefully before you answer, and dont just summarize the standard positions.

  Start by brainstorming: what are the sub-questions the number actually hangs on, and roughly how probable is each one? Things I'd want in there, though add or cut as you see fit — whether the circularity in the usual "I intend that we do X and I believe you intend it too" story is a real problem or just an artifact of how the analysis is worded; whether common knowledge of a public event (we both see that we both see...) genuinely stops the regress or just hides it; whether the cases where coordination runs beneath intention — two people carrying a couch, or a door-holder and a door-walker who never registers each other — bear on the metaphysics at all or are a different phenomenon; and whether a failed reduction would show the "we" is a real thing in the world or only that our explanatory vocabulary is irreducibly plural.

  Then give me the final number, tell me which sub-question it's most sensitive to, and say what would move it most — a counterexample, a conceptual argument, or something empirical. Mine is about 0.6, Nadia's is about 0.25; tell me which of us is probably wrong about which sub-question, and what would settle it.
