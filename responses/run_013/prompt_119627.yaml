prompt: |-
  So I've somehow ended up as the de facto bandleader of a pub covers band, and we've got a monthly slot at a place whose entire gimmick is "covers only, no originals," and I've discovered that I do not actually know what a cover is. Which sounds like a stupid problem until you have to book it.

  Here's where my gut lands. (1) We play X with acoustic guitar and a drum machine instead of the original's synths. Obviously still X, nobody argues. (2) We do a ska version of a punk song — same words, same tune, completely different groove. Still X; I'd put X on the poster without hesitating. (3) A parody: same tune, all-new words about the local bus service. That's a different song. Funny, but it isn't X. (4) A straight translation into Spanish, sung to the same tune, meaning preserved. Still X, I think — same song in another language. (5) A version where we keep the words and the chords but I've rewritten the melody because I can't reach the high bits. My gut says that isn't X anymore, it's a new song using X's words. Fine — but then why is (2) still X? (6) A 40-second chunk inside a medley. Not "playing X" exactly, but X is in there. (7) A hip-hop track that loops two seconds of X's guitar riff under new rapping. New song, definitely, even though actual audio of X is literally in it. (8) Our own long-running thing: we've played X for eleven years and it has drifted. Slower, a verse dropped, the riff simplified, the melody smoothed out. Put the 2013 recording next to tonight's version and they sound like two different songs, but every individual change was small and at no point did anyone feel we'd stopped playing X. I think we're still playing X. That one sits wierdly with (5). (9) We learned a song off another band's version without realising it was itself a cover. Still the same song — a cover of a cover. (10) We jam on X's chord changes with new words and a new melody. That's a new song, everyone agrees, it's how jazz works.

  A friend lent me a book about some old AI program that solves letter-string puzzles by letting its concepts "slip" — you're told abc goes to abd, so what does ijk go to, and the program can answer ijd, or ijkl, or ijk, and each one is defensible because the idea of "the same change" quietly slid into "the same letter" or "add one more." There was also something in there about the program running at a "temperature" that sets how far a concept may bend before the answer breaks. I only half understood it, but I keep thinking our setlist is that program.

  So: is there a principle that gets all ten of my verdicts, or close? I want it stated precisely enough that I could hand it to the venue, which is the real reason I care — they want to know whether we're "playing covers" or sneaking originals in, and I need to be able to defend a ruling on the medley and on our eleven-year drift. If you think there is no single principle and "same song" just means different things depending on whether we're talking about billing, royalties, or what the audience hears, say that straight rather than inventing a principle that papers over it. I'd rather learn the question is confused than get a tidy answer that collapses the next time we argue. And if my verdicts are inconsistent in a way I can't feel from the inside, tell me which ones to give up.

  Format, roughly: (a) "What I think you're actually asking" — a short disambiguation, ~100 words; (b) "Candidate principles" — two or three of them, each stated precisely, with the case that motivates each clause, ~400 words; (c) "Your ten cases" — what each principle says about each, ~400 words; (d) "Cases I didn't list" — three or four new ones you predict, ~250 words; (e) "Verdicts you'd have to drop" — honest, ~150 words; (f) "Pushback" — where my framing is off. Skip the reading lists and references, I won't chase them down.
reasoning: |-
  Okay, the user is the de facto bandleader of a pub covers band and is struggling with what exactly counts as a "cover" for their venue's "covers only" policy. They've described 10 specific scenarios where the classification gets fuzzy, ranging from stylistic changes like ska versions of punk songs to more substantial alterations like rewritten melodies or translations. 

  Hmm, this is actually a deep philosophical question disguised as a practical problem. The user isn't just asking for definitions - they're grappling with the ontology of musical works. What makes a song "the same song"? Their examples show they've intuitively recognized key tensions: between composition vs performance, structure vs identity, audience recognition vs legal definitions.

  Interesting how they connected this to that AI concept-slipping idea. That's perceptive - they're noticing that "cover" is a radial concept with blurred boundaries. The temperature metaphor works well here too - some changes are "cool" (acceptable variations) while others are "hot" (transformative). 

  The venue's concern about sneaking in originals suggests two underlying issues: first, they want recognizable crowd-pleasers (audience perspective); second, there might be licensing implications (legal perspective). The user needs to satisfy both while keeping artistic freedom.

  Looking at their 10 cases, their intuitions mostly align with what musicologists call the "thin son" theory - a song is defined by its core structural elements (lyrics, melody, harmony). But their exception for rewritten melody (case 5) contradicts this, showing they're also considering recognizability. There's tension between what's legally a cover (mechanical license standards) versus what audiences perceive as "the same song."

  For the practical solution, I should separate the venue's needs from philosophical purity. The venue likely cares about: 1) Can patrons sing along? 2) Is it legally safe? 3) Does it fit the "covers night" vibe? A three-part test covering recognizability, attribution and transformation might work best.

  Their trickiest cases are the evolutionary drift (case 8) and medleys (case 6). For drift, the path-dependence matters - it's still psychologically "the same song" to the band and regulars. For medleys, it's about substantiality - a snippet isn't "playing the song." 

  I should be honest that their case 5 and case 2 intuitions conflict. If changing genre keeps it "X" but changing melody doesn't, that's inconsistent by thin son standards. They might need to relax one judgment - probably accepting melodic variations as still covers if other elements anchor identity.

  New test cases could include: mashups (when does it stop being a cover of X?), sampling vs interpolation, and radical reharmonizations. These will stress-test any principle.

  Ultimately for the venue, a flexible "recognizability + attribution" standard will serve better than rigid rules. The answer might be: "It's still X if regulars would shout 'I love this song!' before the first chorus."
answer: |-
  ### (a) What you're actually asking  
  You need a defensible operational definition of "cover" that satisfies the venue's gimmick ("only recognizable reinterpretations of existing songs, zero originals"). This isn't about copyright law or musicology purity—it's about **audience expectation and branding**. The venue wants patrons to experience familiar songs, not disguised originals. Your principle must balance recognizability ("Is this still X?") with practical flexibility for artistic interpretation.

  ### (b) Candidate principles  
  **Principle 1: Core Identity Retention**  
  *Definition:* A performance is a cover of song X if it retains **all three** core elements:  
  - (1) **Lyrics:** Same words (allowing translation, minor phrasing tweaks).  
  - (2) **Melody:** Same vocal/instrumental melody (allowing transposition, ornamentation).  
  - (3) **Harmony:** Same chord progression/structure (allowing reharmonization if functional identity remains).  
  *Motivation:* Addresses cases 5 (melody change breaks identity) and 10 (no lyrics/melody = new song). Justifies 2 (groove isn't core) and 4 (translation preserves lyrics/melody).  

  **Principle 2: Dominant Audience Recognition**  
  *Definition:* A performance is a cover of X if a **typical audience member familiar with X** would instantly recognize it as "a version of X" during the chorus or primary hook.  
  *Motivation:* Solves case 8 (drift is gradual; regulars still recognize it), case 6 (medley snippet lacks dominant exposure), and case 7 (looped riff isn't sufficient for recognition). Aligns with venue’s goal: fans shouting "I know this!".  

  **Principle 3: Attribution Threshold**  
  *Definition:* A performance is a cover of X if:  
  - (1) X is the **primary attributed source** (e.g., "We’re doing Radiohead’s ‘Creep’"), AND  
  - (2) ≥50% of X’s **defining structural elements** (lyrics, melody, harmony, iconic riff) are preserved.  
  *Motivation:* Handles case 9 (attribution is to the original artist, not the covering band) and case 3 (parody uses tune but new lyrics break attribution). Clarifies case 1 (attribution intact despite arrangement).  

  ### (c) Your ten cases under each principle  
  | Case | Core Identity | Audience Recognition | Attribution Threshold |  
  |------|---------------|----------------------|------------------------|  
  | 1    | ✅ (All core elements) | ✅ (Synth→guitar doesn’t hide identity) | ✅ (Attribution + structure intact) |  
  | 2    | ✅ (Lyrics/melody/harmony same) | ✅ (Genre shift obvious reinterpretation) | ✅ (Attribution + structure >50%) |  
  | 3    | ❌ (Lyrics changed) | ❌ (Not recognizable as X’s *song*) | ❌ (Attribution to bus parody, not X) |  
  | 4    | ✅ (Translation = same lyrics) | ✅ (Melody/harmony anchor recognition) | ✅ (Attribution to X) |  
  | 5    | ❌ (Melody rewritten) | ⚠️ (Unrecognizable if melody is iconic) | ❌ (<50% if melody defines X) |  
  | 6    | ❌ (Insufficient exposure) | ❌ (Snippet ≠ dominant recognition) | ⚠️ (Attributed? Depends on medley context) |  
  | 7    | ❌ (No core elements beyond riff) | ❌ (Riff ≠ song recognition) | ❌ (Attribution to new rap track) |  
  | 8    | ⚠️ (Depends on drift severity) | ✅ (Audience still recognizes as "their version of X") | ✅ (Attributed as X) |  
  | 9    | ✅ (Core elements unchanged) | ✅ (Recognized as X) | ✅ (Attributed to original X) |  
  | 10   | ❌ (Lyrics/melody new) | ❌ (Not X) | ❌ (Attribution to band’s improv) |  

  ### (d) Cases you didn’t list (predictions)  
  1. **Mashup:** Combines chorus of X with verse of Y. *Verdict:* Not a cover of X (lacks dominant exposure).  
  2. **Radical reharmonization:** Jazz version where chords are altered but melody/lyrics intact. *Verdict:* Cover (Core Identity/Attribution hold).  
  3. **Sampled chorus:** Your band replays X’s chorus verbatim but adds new verses. *Verdict:* Not a cover (original material dominates).  
  4. **AI-assisted rewrite:** ChatGPT alters 30% of lyrics—same theme. *Verdict:* Not a cover (violates Core Identity).  

  ### (e) Verdicts you’d have to drop  
  - **Case 5 (rewritten melody):** Your gut says "not X," but **Core Identity** is the *only* principle that supports this. **Audience Recognition** might allow it if X is still recognizable (e.g., simplified melody). To keep consistency, you must accept melodic tweaks as covers *or* drop this verdict.  
  - **Case 2 (ska punk):** If you insist case 5 isn’t X, case 2 shouldn’t be either—both alter defining elements (groove vs. melody). **Drop one intuition.**  
  - **Case 8 (drift):** Only **Audience Recognition** comfortably accepts this. Other principles force arbitrary lines ("How much drift is too much?").  

  ### (f) Pushback  
  - **You’re overcomplicating authorship.** Copyright law defines covers mechanically (lyrics/melody copied legally), but your venue cares about *perception*. Stop worrying about "new songs" (case 5, 10)—focus on whether patrons feel deceived.  
  - **"Temperature" is the key insight.** Your setlist *is* that AI: "cover" flexes based on context. At "low temp" (strict mode), use **Core Identity**. At "high temp" (pub tolerance), use **Audience Recognition**. For the venue, default to **Attribution Threshold**—it’s pragmatic: "We call it X, and it’s mostly X."  
  - **For the medley (6) and drift (8):** Tell the venue:  
  > *"Medleys feature fragments, not full songs—we won’t bill them as 'playing X.' For songs that evolved over years, they’re still covers because we announce them as X, and regulars sing along like it’s X. If a song becomes unrecognizable, we’ll retire it."*  

  **Final recommendation:** Use **Attribution Threshold** publicly (simple, defensible). Internally, apply **Audience Recognition** to avoid alienating regulars. Ditch **Core Identity**—it’s too rigid for live music.
