prompt: |-
  I'm a doctoral candidate in urban planning, and I've been trying to work out what my own field's central decision procedure is actually committed to. The practice I have in mind is this. In much of the United States, and in recognisably similar forms elsewhere, the rules governing what may be built are set out in a citywide plan adopted by the whole council and justified in the language of the general welfare. But the decisions that determine whether a particular building actually gets built are made project by project, through variances, conditional use permits, design review, and other discretionary approvals. In those proceedings, the parties who are formally notified, given the right to speak, and given the right to appeal are the owners and residents in the immediate vicinity of the site. The people who would live in the building, and the people who would move to the city if more of it were built, have no standing at all. Among the grounds on which a project can be refused are its effect on the neighbourhood's character and its effect on nearby property values. The asymmetry I keep running into is that the plan is written for everyone, while the permit is decided by the few who are already there.

  What I want is an account of what this arrangement presupposes. What principle of political inclusion does the standing rule commit the city to: that all affected interests should be represented, that only those subjected to a decision's coercion should be, or something territorial and proprietorial that maps onto neither? What conception of property does the neighbour's objection presuppose? Does the objection make sense only if ownership carries something like an easement over the uses other owners make of their own parcels, and can that be rendered coherent on a view of property as a bundle of separable rights, or does it require something closer to a natural right to the existing state of one's surroundings? Is there a defensible ground for the incumbents' claim, such as sunk investment, attachment to place, or the value of stable communities, and how much weight can it bear against the claims of those excluded altogether?

  I would also like you to sort out which parts of the practice are strictly presupposed by it and which merely happen to fit with it. A purely rent-seeking story, in which incumbents use the permitting process to protect their asset values and the moral vocabulary is decoration, would generate the same pattern. If that story explains the practice as well as any theory of legitimacy does, say so, and say what follows about whether there is an implicit theory here at all. Then tell me where the practice is underdetermined: which rival theories would license exactly this arrangement, and where they would diverge if pressed.

  Finally, take the view you judge the practice to presuppose, whatever it turns out to be, and replace it with each of three serious alternatives: that the relevant demos for a neighbourhood decision is everyone affected, including would-be residents; that land-use decisions are matters of property right and should not be made collectively at all; and that the relevant unit is the region rather than the neighbourhood. For each, say concretely what would have to change in the notice rules, the permissible grounds for refusal, the standard of review on appeal, and the level at which decisions are made. I am less interested in a survey of the planning literature than in a reconstruction of the theory the machinery is already committed to, and an honest verdict on whether it holds together.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a doctoral candidate in urban planning, wrestling with the disconnect between the citywide plan and the project-by-project approval process. The core issue is the asymmetry: the plan is justified for the general welfare, but decisions are dominated by immediate neighbors, excluding potential residents and newcomers.

  First, I need to identify the implicit principles here. The user wants to know what political inclusion principle this system commits to. The standing rules grant rights only to nearby property owners and residents. That suggests a territorial and proprietorial view. It's not about all affected interests or those coerced, but about physical proximity and property ownership. That makes me think of historical notions like the ancient "whoever owns the soil" doctrine, where landownership confers decision rights.

  Then there's the conception of property. Neighbors can object based on neighborhood character or property values. That implies property rights include some expectation of environmental stability. It's like an easement—a right to the existing state of surroundings. But does that fit with the bundle of rights theory? Maybe not perfectly, but the practice leans towards a quasi-feudal idea where property isn't just the parcel but includes the context. The sunk investments and attachment to place are cited as defenses, but are they strong enough against the excluded groups? Probably not, especially when weighed against housing shortages or displacement.

  The user also asks about rent-seeking versus legitimacy. It's possible the moral arguments are just covers for protecting property values. If that's the case, the practice might not have a coherent theory at all. But I should consider if there's a defensible basis. Communitarian values like stable communities could be part of it, but they often exclude newcomers, creating insularity. So legitimacy here is shaky.

  Next, the underdetermination. Different theories could lead to the same setup. Utilitarianism might accept it if local preferences maximize overall welfare, but that's doubtful. Communitarianism focuses on existing communities, which aligns with current practice. Libertarian views might support neighbors' rights as property protections. But when pressed, these theories diverge—utilitarians would include future residents, communitarians might not.

  Then the alternatives. First, including all affected interests. That would mean giving standing to potential residents and advocacy groups. Notice rules would expand beyond immediate vicinity, using broader outreach. Grounds for refusal couldn't include neighborhood character alone; it'd need citywide impact assessments. Appeals would consider regional housing needs. Decisions might shift to city or regional bodies.

  Second, treating land use as purely property rights. Discretionary approvals would disappear; zoning would be by-right. Neighbors could only sue for nuisance, not block projects via permit hearings. This reduces delays but might increase litigation and externalities.

  Third, regional decision-making. Permits would align with regional plans. Notice includes regional stakeholders. Refusals based on regional impact. Higher-level bodies handle appeals. This counters localism but might overlook neighborhood nuances.

  Finally, evaluating the current system. It's internally coherent but normatively weak. It privileges incumbents, creating exclusion. The alternatives have trade-offs but address inclusivity and scale. The user needs an honest verdict: the practice is consistent but unjustifiable under scrutiny, needing reform to balance interests.
answer: |-
  Here’s a systematic analysis of the decision procedure you describe, reconstructing its implicit commitments, testing their coherence, and exploring alternatives:

  ### I. The Practice’s Implicit Commitments
  1. **Political Inclusion Principle**:  
     - **Territorial Proprietarianism**: The standing rule commits to a theory where **physical proximity + property ownership** (or tenancy) confers decision rights. This maps to neither "all affected interests" (excludes future residents/regional commuters) nor "subjected to coercion" (excludes those coerced by exclusionary supply constraints). It echoes a Lockean "enough, and as good left for others" *spatially bounded* to the neighborhood. Legitimacy stems from **incumbency as a quasi-property right in the *status quo***.

  2. **Conception of Property**:  
     - **Ambient Rights Theory**: Ownership includes an **implied easement against "negative environmental change"** to one’s surroundings. This is incompatible with strict bundle-of-rights theory (which treats parcels atomistically) but aligns with nuisance law’s protection of "quiet enjoyment." The objection presupposes that property rights carry **non-contractual spatial externalities**, rendering neighbors *de facto* co-owners of the neighborhood’s character. This requires viewing property as **embedded in a fixed socio-spatial order**, not as fungible capital.

  3. **Defensible Grounds for Incumbency**:  
     - **Sunk Investment + Community Stability**: The strongest defenses are:  
       - **Reliance Interests**: Incumbents invested in property/life plans assuming stable neighborhood conditions.  
       - **Communitarian Value**: Face-to-face communities require spatial continuity.  
     - **Weight vs. Exclusion**: These grounds *can* justify *some* voice but collapse under scrutiny:  
       - They privilege tangible sunk capital (home equity) over intangible sunk costs (e.g., years on a housing waitlist).  
       - They mistake *stability* for *stasis*, freezing neighborhoods rather than allowing organic change.  
       - They bear little weight against **systemic exclusion** (e.g., housing shortages displacing low-income residents regionally).

  ### II. Rent-Seeking vs. Legitimacy
  - **Rent-Seeking as Sufficient Explanation**: The practice *can* function identically under pure rent-seeking:  
    - **Mechanism**: Discretionary permits let incumbents restrict supply, inflating property values. "Character" objections mask exclusionary motives.  
    - **Evidence**: Correlation between restrictive permitting and price appreciation; NIMBYism as class/race exclusion.  
  - **Implications**: If rent-seeking explains outcomes better than normative theories, the practice **lacks coherent implicit legitimacy**. Its moral vocabulary ("community," "character") becomes ideological cover. The arrangement is **underdetermined**: identical procedures serve either communitarian ideals or rent extraction.

  ### III. Underdetermination: Rival Theories Compatible with the Practice
  | **Theory**         | **Compatibility** | **Divergence When Pressed** |
  |--------------------|-------------------|-----------------------------|
  | **Utilitarianism** | Allows local veto if aggregating preferences | Would require cost-benefit analysis *including* excluded groups’ welfare (e.g., regional affordability). |
  | **Communitarianism** | Prioritizes existing community bonds | Must justify why *neighborhood* is the relevant community (not city/region), and why newcomers lack moral claim. |
  | **Libertarian**    | Upholds neighbors’ exclusionary rights as property protection | Conflicts with developer’s property rights; inconsistent where regulations exceed nuisance prevention. |

  ### IV. Alternatives: Concrete Changes to the System
  1. **All Affected Interests Principle**  
     - **Standing**: Future residents, housing advocates, regional employers gain standing via representation (e.g., housing ombuds).  
     - **Notice**: Citywide/regional notification; digital participation platforms.  
     - **Grounds for Refusal**: "Neighborhood character" invalid unless linked to citywide harm; must weigh regional housing need.  
     - **Appeal Standard**: De novo review prioritizing city plan conformity over local opposition.  
     - **Decision Level**: Appeals shift to city/county bodies with regional housing mandates.

  2. **Pure Property Rights Regime**  
     - **Standing**: Only applicant and adjacent owners (for direct nuisance claims).  
     - **Notice**: Limited to immediate neighbors; no public hearings.  
     - **Grounds for Refusal**: Only objective nuisances (traffic, pollution); aesthetic/character objections barred.  
     - **Appeal Standard**: Strict legal review (was nuisance standard violated?).  
     - **Decision Level**: Ministerial (administrative) approvals; courts handle disputes. Discretionary permits abolished.

  3. **Regionalist Principle**  
     - **Standing**: Regional planning agencies, neighboring municipalities, transit authorities.  
     - **Notice**: Mandatory referral to regional bodies; hearings in affected jurisdictions.  
     - **Grounds for Refusal**: Non-compliance with regional housing targets or infrastructure plans.  
     - **Appeal Standard**: Regional board overrides local denials violating regional goals.  
     - **Decision Level**: Local review subject to regional "conformity" requirements; major projects decided regionally.

  ### V. Verdict: Does the Implicit Theory Hold Together?
  - **Internal Coherence**: Yes, as a **territorial oligarchy**: It consistently privileges spatial incumbency through a propertied conception of community.  
  - **Normative Failure**: No. It commits three fatal errors:  
    1. **Misidentification of Stakeholders**: Future residents endure coercion (exclusion/high rents) but lack voice.  
    2. **Tragedy of the Anti-Commons**: Veto fragmentation paralyzes supply, harming regional welfare.  
    3. **Illegitimate Exclusion**: Elevates homeowners’ aesthetic/wealth preferences over others’ basic needs.  
  - **Conclusion**: The machinery presupposes a **reactionary theory of spatial entitlement**—one that conflates *investment in property* with *governance rights over territory*. While communitarian defenses offer partial cover, they cannot reconcile the practice’s systematic exclusion with democratic or liberal justice. Rent-seeking explains its persistence; justice demands its reform.

  This structure is less a planning paradigm than a **constitutional flaw**—a decoupling of general welfare rhetoric from localized power that distorts urban development. Reforming it requires not just procedural tweaks but re-founding the standing rules on a demos that includes those *seeking* the city, not just those already within it.
