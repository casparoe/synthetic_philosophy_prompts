  1. (2) and (3): This is a foundational tension because it goes to the heart of what blame is. If blameworthiness is about desert (as per (2)) then it exists independently of consequences. But (3) makes the warrant of blame entirely contingent on consequences. This is a major conflict in theories of blame. Severity rank: 1 (most severe).
