answer: |-
  Below is a diagnostic decision tree structured as 10 branch questions. Each question isolates core disagreements about the nature of your foundation's multipolar traps (e.g., burnout, disclosure races, forks). The leaves identify the underlying position, its most awkward commitment, and escape routes—adjusted for your **volunteer context** (no enforcement power).  

  ### Decision Tree: Diagnosing the Multipolar Trap  
  1. **Do individuals *intend* to harm the collective, or are they forced by the system?**  
     - *No (forced by system)* → Q2  
     - *Yes (intentional harm)* → *Status competition*: Awkward commitment: "Winning relative status justifies burning the commons." Escape: Norms that shame zero-sum behavior; redirect rewards to absolute contributions (e.g., feature meritocracy).  

  2. **Is the trap caused by conflicting incentives *within* a single interaction?**  
     - *No* → Q3  
     - *Yes* → *Prisoner’s dilemma*: Awkward commitment: "Cooperating would help everyone, but I must defect to protect myself." Escape: Repeated interactions with reputation tracking (e.g., public contributor scorecards).  

  3. **Does the problem worsen because participants *cannot trust promises* about future actions?**  
     - *Yes* → *Commitment problem*: Awkward commitment: "We all want to invest in sustainability, but no one believes others will." Escape: Gradual, reversible commitments (e.g., phased feature rollouts) to build trust without enforcement.  
     - *No* → Q4  

  4. **Is a *finite shared resource* (e.g., maintainer time) being depleted?**  
     - *Yes* → *Tragedy of the commons*: Awkward commitment: "Restraint only works if everyone complies—but I can’t risk being the only one." Escape: Community norms with mutual monitoring (e.g., public contribution quotas).  
     - *No* → Q5  

  5. **Would *coordinating on one action* (e.g., one fork) benefit everyone, but no clear path exists?**  
     - *Yes* → *Coordination failure*: Awkward commitment: "We agree on the goal but will never agree on tactics." Escape: Focal points via impartial mediators (e.g., technical committees) or default standards.  
     - *No* → Q6  

  6. **Does the trap *narrow future options* (e.g., forks lock in incompatible tech)?**  
     - *Yes* → *Shrinking option set*: Awkward commitment: "Short-term fixes (e.g., quick forks) seem necessary but foreclose better paths." Escape: "Option-preserving" norms (e.g., deprecation timelines, modular design).  
     - *No* → Q7  

  7. **Is the trap driven by *fear of preemption* (e.g., racing to disclose vulnerabilities)?**  
     - *Yes* → *Preemption game*: Awkward commitment: "Moving first is wasteful, but losing the race is worse." Escape: Delayed-publication pacts or shared credit mechanisms.  
     - *No* → Q8  

  8. **Would a *central authority* trivially solve the problem?**  
     - *Yes, but impossible* → *Leviathan aspirant*: Awkward commitment: "We need a dictator but reject all candidates." Escape: "Weak" centralization (e.g., rotating maintainers) or delegated arbitration.  
     - *No* → Q9  

  9. **Are there *multiple overlapping traps* with no dominant cause?**  
     - *Yes* → *Deflationary view*: Awkward commitment: "Moloch is a useless metaphor—we’re fighting distinct fires." Escape: Context-specific fixes (e.g., burnout: workload limits; forks: fork reconciliation protocols).  
     - *No* → Q10  

  10. **Can the trap *only be escaped* by changing human preferences?**  
      - *Yes* → *Preference transformation*: Awkward commitment: "We must value sustainability over novelty, but incentives punish this." Escape: Cultural shifts via "charter documents" or exemplar projects.  
      - *No* → *Unnamed*: Logically possible but unexplored (e.g., exogenous shocks).  

  ---

  ### Unoccupied/Incoherent Combinations  
  - **"Voluntary Leviathan"**: Positions requiring binding authority *without* enforcement power are incoherent (rejected at Q8).  
  - **"Benign shrinking options"**: If options shrink *without* harm (Q6→No), it’s not a trap—rare in practice.  
  - **"Coordinated deflation"**: Combining Q9 (multiple traps) with Q5 (single coordination fix) is unattractive—oversimplifies diagnosis.  

  ### Key Escapes Without Central Authority  
  - **Norms + reputation**: Public recognition for restraint (e.g., "sustainability badges" for contributors).  
  - **Exit and voice**: Fork amnesty programs; burnout sabbaticals with retained influence.  
  - **Technological fixes**: Automated governance (e.g., bot-enforced contribution limits).  
  - **Changing payoffs**: "Tax" low-value features (e.g., require peer approval for new forks).  

  This tree isolates 12 positions (9 named, 1 unnamed) via 10 questions. It reveals why your board argues past each other: **status competitors** (Q1) see malice, **tragedy of the commons** advocates (Q4) see recklessness, and **deflationists** (Q9) deny a unified cause. By matching your symptoms to a branch, you can target escapes that avoid reliance on power you lack.
