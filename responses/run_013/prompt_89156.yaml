prompt: |-
  I am producing a short interview series on the epistemology of conspiracy theorising, and my next guest is a philosopher who has spent the better part of a decade developing a position she calls the agency-prior thesis. Stated plainly, her claim is that the characteristic epistemic failure of conspiracy theorising lies neither in logical invalidity, nor in unfalsifiability, nor in any failure to respect the evidence the believer actually cites, but in a systematic distortion of the reasoner's prior over agency: an inflated antecedent probability assigned to coordinated intention, paired with a correspondingly deflated probability assigned to coincidence, independent convergence, and institutional drift. She treats this as a general and content-independent defect, and so rejects the particularist contention that the phrase names no single epistemic kind. She is also a deft interlocutor who typically grants her critic's premise and then relocates the disagreement, most often by insisting that the agency-prior is not directly inspectable and can only be inferred from the shape of a person's overall explanatory practice.

  Draft eight to ten questions for the interview, together with, for each, the single follow-up keyed to the reply she is actually most likely to give — the move she will reach for, not the strongest reply available to her. At least one question should probe how the agency-prior thesis escapes collapsing into the particularism she rejects, given that the prior is legible only through the content of what someone believes; at least one should ask whether over-assigning agency is genuinely distinctive of conspiracy theorising or merely continuous with ordinary historical, forensic, and intelligence reasoning, where the same prior may be well earned; and at least one should ask what the thesis implies for conspiracy theorising that turns out to be true. Make two of the follow-ups do real work: one should press her to state a diagnostic criterion that a third party could apply without already knowing whether the theory in question is a conspiracy theory, and the other should force her either to defend the thesis as descriptive or to concede that it is doing normative work about how we ought to allocate explanatory trust. The questions should turn on the substance of the position; nothing about her biography, her influences, or how she came to the topic.
reasoning: |-
  Okay, let me approach this interview question drafting task systematically. The user wants 8-10 substantive questions about the agency-prior thesis with predictive follow-ups targeting the philosopher's typical argumentative moves. 

  First, I need to unpack the core components of her position: the claim that conspiracy theorizing's epistemic flaw stems from distorted priors about agency; her rejection of particularism; and her methodological stance that the prior must be inferred from explanatory patterns. 

  For the required questions: 
  - The particularism challenge needs to show how she avoids circularity when priors are only visible through belief content. 
  - The distinctiveness question must contrast conspiracy theories with legitimate agency-focused reasoning. 
  - The truth question requires addressing how correct conspiracy theories still manifest the prior distortion.

  The user also wants two "working" follow-ups: 
  - One demanding an external diagnostic criterion beyond just labeling something a conspiracy theory. 
  - One forcing clarification on whether this is descriptive or normative.

  I'll structure questions to flow from conceptual foundations to methodological implications, then to applications. Each follow-up should anticipate her likely deflection tactics - like shifting to systemic inference when pressed on inspectability, or appealing to explanatory asymmetry when challenged on particularism. 

  For the diagnostic criterion follow-up, I'll push her to specify observable behavioral markers. For the normative/descriptive tension, I'll corner her into choosing between empirical claims and prescriptive claims about reasoning norms.

  The questions must stay rigorously focused on the thesis itself - no biographical or contextual detours. I'll aim for precision in formulating the exact moves she's known for, based on the user's detailed description of her argumentative style.
answer: |-
  Here are nine focused interview questions with predictive follow-ups targeting your guest's characteristic argumentative maneuvers and substantive commitments:

  1.  **Question:** You argue the core epistemic flaw in conspiracy theorizing is a distorted prior over agency (inflating coordinated intention, deflating non-agency explanations). How do you operationally define "agency" here to avoid vagueness? Is it synonymous with conscious human intention, or could it include emergent group dynamics?
      *   *Predicted Reply:* She will likely emphasize it's specifically about *coordinated*, *goal-directed* intentionality by conscious actors, distinct from emergent phenomena.
      *   **Follow-Up:** Given you reject particularism, how does defining agency this narrowly avoid simply *presupposing* the distinction between legitimate institutional analysis and conspiracy theorizing, rather than diagnosing it via the prior?

  2.  **Question:** A key objection is that your thesis risks circularity: The "distorted prior" is inferred *from* the tendency to favor conspiratorial explanations, which *is* the phenomenon you're trying to explain. How do you break this circle?
      *   *Predicted Reply:* She will likely argue the prior is inferred from the *systematic pattern* of explanation across *multiple* domains or pieces of evidence, not just one belief, and crucially, from the *consistent dismissal or neglect* of plausible non-agential explanations.
      *   **Follow-Up:** But doesn't this 'systematic pattern' just *describe* the conspiracy theorist's explanatory behavior? What independent, *third-party accessible diagnostic criterion* – beyond labeling the belief a conspiracy theory – signals an *inflated* prior specifically, rather than just strong conviction in *this* case? *(Forces Diagnostic Criterion)*

  3.  **Question:** You reject particularism, claiming "conspiracy theorizing" names a distinct epistemic kind based on this distorted prior. Yet the prior itself is only legible through the *content* of the beliefs and explanations someone endorses. Doesn't this inevitably collapse back into a form of particularism, judging the rationality of *each specific belief* based on its content?
      *   *Predicted Reply:* She will likely insist the prior is a latent cognitive *disposition* revealed across a *body* of explanatory moves (e.g., consistently defaulting to hidden hand, resisting stochastic explanations), making it a general feature of the *reasoner's style*, not just the content of single beliefs.
      *   **Follow-Up:** If the disposition is only inferred *from* how someone reasons about specific content, how is this fundamentally different from judging the rationality of those specific inferences? Isn't labeling the *disposition* "distorted" still ultimately a judgment on the *content-driven inferences* that manifest it?

  4.  **Question:** Is the agency-prior distortion genuinely *distinctive* of conspiracy theorizing? Historians, detectives, and intelligence analysts also routinely assign high probability to coordinated intentional action. When is this prior "inflated" vs. rationally warranted by domain-specific evidence and base rates?
      *   *Predicted Reply:* She will likely concede it's *continuous* but argue the key difference is the conspiracy theorist's prior is *insensitive* to domain-specific base rates or counter-evidence, applying a *default* high prior to coordination across contexts where professionals would apply more calibrated priors.
      *   **Follow-Up:** Doesn't this shift the locus of failure from the *prior itself* to a failure of *conditionalization* (ignoring evidence/base rates)? If the core flaw is insensitivity to updating, why emphasize the *prior* as the fundamental distortion?

  5.  **Question:** What does your thesis imply for conspiracy theories that turn out to be *true* (e.g., genuine cover-ups revealed later)? Does the believer still exhibit the characteristic epistemic flaw?
      *   *Predicted Reply:* She will likely argue "yes" – that the believer arrived at the correct conclusion via an unreliable process rooted in the distorted prior. The truth is accidental relative to their reasoning method.
      *   **Follow-Up:** Doesn't this create a dilemma? If true beliefs generated via this 'flawed' process are dismissed as accidental, while false ones are blamed on the prior, how can the thesis be empirically tested or falsified? Doesn't it risk becoming unfalsifiable?

  6.  **Question:** Critics might argue your thesis pathologizes a natural human tendency towards "hyperactive agency detection." How do you distinguish a potentially adaptive cognitive heuristic from the pathological distortion you describe?
      *   *Predicted Reply:* She will likely grant the heuristic exists but argue the distortion lies in its *systematic dominance* and *failure to be overridden* by countervailing evidence or consideration of alternative explanations, even when readily available.
      *   **Follow-Up:** This seems to define the flaw by its *consequences* (dominance, resistance). Is the agency-prior thesis ultimately descriptive of a *pattern of reasoning failures*, or is it making a normative claim about how we *ought* to allocate explanatory trust between agency and non-agency? *(Forces Descriptive vs. Normative)*

  7.  **Question:** How does the agency-prior thesis interact with well-established cognitive biases like confirmation bias or proportionality bias? Is it a distinct bias, or an amalgamation or consequence of others?
      *   *Predicted Reply:* She will likely position it as a *foundational* prior shaping *how* these other biases manifest – e.g., confirmation bias selectively affirms agential explanations, proportionality bias demands agential causes for large effects.
      *   **Follow-Up:** If it's foundational and latent, inferred only from its effects (like enabling other biases), doesn't this make the agency-prior itself a theoretical construct potentially immune to direct refutation? How do we know it's not just an *epiphenomenon* of those more observable biases?

  8.  **Question:** You emphasize the prior is inferred from "the shape of a person's overall explanatory practice." What specific, observable features of that practice are the strongest indicators of an inflated agency-prior?
      *   *Predicted Reply:* She will likely cite consistent patterns like: rapid dismissal of coincidence/chance/structural explanations; immediate leaps to hypothesizing coordinating actors; interpreting ambiguity as evidence of deliberate concealment; connecting disparate events via postulated hidden intentions rather than independent causes.
      *   **Follow-Up:** Couldn't these same patterns manifest in a rigorous investigator *temporarily* exploring a legitimate lead? How do you distinguish the *systematic disposition* from a *contextually appropriate* focus on agency in a specific investigation?

  9.  **Question:** If the agency-prior is a general cognitive distortion, why do individuals apply it so selectively (e.g., to certain events or institutions but not others)? Doesn't this selectivity suggest content *does* play a crucial role, undermining the 'content-independent' claim?
      *   *Predicted Reply:* She will likely argue selectivity reveals underlying motivational factors (distrust, ideology) *activating* the latent distorted prior in specific domains, but the *form* of the reasoning distortion remains the same (inflated agency prior when activated).
      *   **Follow-Up:** Doesn't this functionally concede that the *epistemic* flaw (the prior distortion) is *parasitic* on non-epistemic factors (distrust, ideology) for its specific application? If so, is the core epistemic failure really the prior, or the motivated reasoning driving its selective application?

  **Key Follow-Up Rationale:**
  *   **Questions 2 & 6:** Directly address the user's requirement for follow-ups that "do real work" – pressing for a concrete diagnostic criterion (Q2 F/U) and forcing the descriptive/normative clarification (Q6 F/U).
  *   **Questions 3, 4, 5:** Explicitly cover the user's mandated topics: escaping particularism (Q3), distinctiveness from legitimate reasoning (Q4), and implications for true conspiracies (Q5).
  *   **Predicted Replies:** Framed based on the description of her style: granting premises (e.g., continuity in Q4, heuristic in Q6), relocating disagreement (e.g., to systemic inference in Q2/Q3, to dominance/failure to override in Q6), and emphasizing inference from practice (Q2, Q8). Follow-ups aim to challenge these specific predicted moves.
