  Alternative rejections would be costlier: Denying premise 1 abandons basic logic. Questioning 5→6 requires explaining how unreliable faculties could occasionally grasp truth, which seems ad hoc. The move to 7 is actually valid if 5-6 hold, so attacking it wouldn't help. 

