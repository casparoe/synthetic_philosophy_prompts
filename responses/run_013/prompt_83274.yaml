answer: |-
  Here is the complete exam package designed to your specifications, forcing engagement with the discounting clause and the introduced concepts:

  **Exam Question**

  Margaret, a 62-year-old former nurse, was diagnosed with early-onset Alzheimer's five years ago. While competent, she executed a witnessed advance directive naming her younger brother as proxy. The directive explicitly:
  1.  Refuses antibiotics for life-threatening infection.
  2.  Refuses artificial nutrition and hydration.
  3.  Declines resuscitation.
  4.  Includes a clause written by Margaret: "If I ever seem content and cheerful in the care home, that contentment is not to be trusted, because by then the disease would have made me someone who no longer knew what I was losing. If I'm smiling, don't believe me."
  5.  *Additionally* requests: "Keep me alive as long as I am not in pain, in case I change my mind about the antibiotics."

  Five years later, Margaret is severely demented, scoring very low on cognitive tests. She does not recognize the directive or her brother. By all observable measures, she is happy: she sings at the piano, has favourite staff, and states she wants to live. She now has a chest infection (likely life-threatening without antibiotics).

  Her brother insists the directive governs, including the discounting clause. Margaret's daughter argues the discounting clause is grotesque and self-defeating: her mother is present, content, and the directive is overwriting the only person who can currently speak. She contends the document itself "is the place where her mother survives."

  **Distinguish two potential sources of authority for an advance directive:**
  *   **Authorship Authority:** The directive binds because the competent past self *made* it (the 'maker's hand').
  *   **Fidelity Authority:** The directive binds because it accurately represents what the *current* self would want (if able), or what the past self *would have wanted* had they known the future circumstances.

  **Based on this case and distinctions, address:**
  1.  Does Margaret's directive possess *Authorship Authority* and/or *Fidelity Authority* over her current self? Explain why or why not for each, paying particular attention to the discounting clause. Is the brother primarily invoking one type of authority?
  2.  How does the discounting clause function? Is it an exercise of *Authorship Authority* or an attempt to undermine the possibility of *Fidelity Authority* from within the directive itself?
  3.  How should the apparent contradiction within the directive (refusing antibiotics but requesting life extension if pain-free) be resolved, considering the daughter's view and the discounting clause?
  4.  Is the question "Who is the patient?" (the past self in the document or the present self in the home) answerable in general, or only case-by-case? Is the daughter's claim that the document "is the place where her mother survives" primarily a claim about personal identity, or an expression of grief appropriating the language of identity?

  ---

  **Model Answer (Approx. 700 words)**

  The case of Margaret forces us beyond the simple tension between precedent autonomy and present welfare. While that tension exists (past Margaret valued avoiding existence with severe dementia, present Margaret is happy), the directive's complexities demand deeper analysis using the concepts of Authorship Authority (AA) and Fidelity Authority (FA).

  1.  **Authorities & Brother's Stance:** The directive possesses strong *Authorship Authority*. Margaret was competent, deliberate, and specific. She explicitly foresaw her future state and intended the directive to govern, crucially *including* the discounting clause. Her professional background as a nurse arguably strengthens the weight of her informed choice. *Fidelity Authority*, however, is deeply problematic. FA requires the directive to reflect either the *current* self's wishes or what the past self *would have wanted* given the actual circumstances. The current self demonstrably wants to live. The discounting clause explicitly *rejects* the notion that her contented state reflects her "true" wishes ("don't believe me"), arguing the disease has fundamentally altered her capacity to value what she has lost. Therefore, while the directive might aim for FA (representing what she "really" wanted), the clause acknowledges the disease destroys the psychological continuity needed for FA to hold in the standard sense. The brother, by insisting on the clause and the refusal of antibiotics despite her current happiness, is primarily invoking *Authorship Authority*. He respects the binding force of her past competent decision, as she instructed, even when it contradicts the observable preferences of her present self.

  2.  **Function of the Discounting Clause:** The discounting clause is a profound exercise of *Authorship Authority* that deliberately *undermines* the potential application of *Fidelity Authority* based on her future, demented state. Margaret, anticipating the very scenario that has unfolded, uses her AA *now* to declare that any future contentment *cannot* be taken as evidence of her authentic will. She asserts that the disease will have so transformed her that her expressed preferences as a demented person lack the connection to her prior values and identity necessary for FA. It’s not merely an instruction; it’s a pre-emptive denial of legitimacy to the future self's expressed desires regarding life continuation. She uses AA to gut the evidential basis for FA from the inside.

  3.  **Resolving the Contradiction & Daughter's View:** The directive's internal contradiction (refuse antibiotics but request life extension if pain-free) must be interpreted through Margaret's explicit instructions, chiefly the discounting clause. The clause reveals her core fear: living *as* a severely demented person, regardless of apparent contentment. The request for life extension "in case I change my mind about the antibiotics" likely reflects anxiety about temporary incapacity or uncertainty *before* severe dementia set in, *not* a change of heart *after* becoming the "smiling" person she disavowed. The discounting clause instructs us *not* to interpret her current contentment as such a change of mind. Resolving the contradiction favours the refusal of antibiotics: her AA explicitly rejected this existence, and the clause dismisses her current "want to live" as inauthentic in the relevant sense. The daughter's focus on the present, content self is understandable but ignores Margaret's anticipatory command to disregard precisely this state as a basis for decision-making. Her claim that the document "overwrites" the present person is correct only if we disregard Margaret's AA and the clause.

  4.  **"Who is the Patient?" & Daughter's Claim:** "Who is the patient?" is ultimately a case-by-case question requiring ethical and metaphysical judgment. There is no single, general answer to whether identity persists through radical psychological change. We must weigh continuity of body, psychological connections (severely disrupted here), and the person's own anticipatory statements. Margaret’s discounting clause is her own stark answer: the "smiling" person is *not* her in the sense whose wishes should govern life-or-death decisions. The daughter's claim that the document "is the place where her mother survives" is poignant but primarily an expression of *grief wearing identity's clothes*. She experiences the loss of her "real" mother (the competent self) and clings to the document as a relic of that person, rejecting the stranger inhabiting her mother's body. While understandable, it risks conflating her grief with an objective claim about identity or authority. Margaret, via AA and the clause, explicitly rejected the notion that her demented self carries her authentic voice.

  Therefore, respecting Margaret's Authorship Authority, particularly the discounting clause, dictates following the directive's refusal of antibiotics, despite her present contentment. The clause is the key that resolves the contradiction and denies Fidelity Authority to her current expressed wishes.

  ---

  **Marking Scheme (Out of 20)**

  **Must-Hit Moves (Total: 16 points):**
  1.  **Acknowledges Standard Tension & Moves Beyond (2 pts):** Briefly notes precedent autonomy vs. present welfare but clearly uses it as a starting point, not the conclusion.
      *   *B-Band Pitfall:* Spends excessive time on the standard tension without effectively transitioning to deeper analysis using AA/FA/clause.
  2.  **Accurately Applies AA/FA Distinction to the Case (4 pts):** Clearly defines AA and FA (as per question). Correctly identifies strong AA and explains the problem with FA due to the discounting clause and psychological discontinuity. Identifies brother invoking AA primarily.
      *   *B-Band Pitfall:* Conflates AA and FA; struggles to articulate why FA is problematic here; misattributes brother's primary appeal (e.g., to FA or welfare).
  3.  **Analyzes the Discounting Clause (5 pts - Top Band Differentiator):** Explicitly addresses the clause. Correctly identifies it as an exercise of AA that deliberately undermines FA based on the future demented state's preferences. Explains *how* it "guts fidelity authority from the inside."
      *   *B-Band Pitfall:* Mentions the clause only superficially or ignores it entirely; fails to articulate its function regarding AA/FA; misinterprets its purpose (e.g., sees it only as evidence of competence).
  4.  **Resolves the Directive's Contradiction (3 pts):** Uses the discounting clause and Margaret's core values/intent (avoiding demented existence) to resolve the antibiotic refusal vs. life-extension request. Argues persuasively why the refusal governs.
      *   *B-Band Pitfall:* Treats the contradiction simplistically or ignores it; fails to link resolution to the clause/core intent; sides reflexively with life-extension without justification against the clause.
  5.  **Addresses "Who is the Patient?" & Daughter's Claim (2 pts):** Argues persuasively that the question requires case-by-case judgment. Correctly identifies the daughter's claim as primarily an expression of grief appropriating identity language, contrasting it with Margaret's own view via the clause.
      *   *B-Band Pitfall:* Asserts a general answer to identity; takes the daughter's identity claim at face value without critique; fails to contrast it with Margaret's view/clause.

  **Overall Quality & Structure (4 pts):**
  *   **Clarity, Coherence, and Argumentative Flow (2 pts):** Well-structured, logical progression, clear writing.
  *   **Use of Case Details & Engagement with Complexities (2 pts):** Effectively uses specific details from the case (Margaret's history, current state, specific clauses, family views) to support arguments.

  **Top Band (A Range: 17-20):** Hits all Must-Hit Moves convincingly, with particularly sophisticated analysis of the discounting clause (Move 3). Excellent structure and engagement. Resolves contradiction effectively using the clause.
  **B Band (14-16):** Hits most Must-Hit Moves but shows weakness in Move 3 (Discounting Clause Analysis) – often superficial, tangential, or underdeveloped. May also show minor weaknesses in other moves (e.g., conflating AA/FA slightly, weaker resolution of contradiction, less nuanced take on identity/grief). Generally competent but lacks the deeper insight on the clause.
  **C Band (10-13):** Attempts Must-Hit Moves but significant gaps or errors (e.g., misses Move 3 entirely, major confusion on AA/FA, poor resolution of contradiction, simplistic view of identity). Relies too heavily on standard autonomy/welfare without deeper analysis.
  **D Band (7-9):** Superficial engagement, significant misunderstanding of concepts/case, misses multiple Must-Hit Moves.
  **F Band (0-6):** Seriously deficient, irrelevant, or minimal attempt.

  **(Key Differentiator: Engagement with the discounting clause (Move 3) is the primary factor separating A and B bands.)**
