prompt: |-
  A friend and I have been going back and forth on this for weeks and at this point I want an actual number from you, not a summary of the literature. Setup: the 'obfuscated arguments' worry about AI safety via debate. The judge is weaker than the debaters — could be a human, could be a small model — and the question under debate is a negative or universal claim, like 'this program never reads past the end of the buffer on any input.' If the true answer is no, the honest debater just hands over one input and the judge checks it in a second. If the true answer is yes, the honest side has to convey something proof-shaped, and that proof might be enormous with every individual step looking perfectly fine; meanwhile the dishonest side only needs one long chain of plausible-looking steps with the actual flaw buried deep enough that a bounded judge won't dig it out. And neither debater gets to be smarter than the judge in any real sense — they're copies of the same model, so the honest one is just as computationally stuck as the dishonest one. So: what's your credence that some realistic debate protocol — or a modest variant, cross-examination, letting the judge choose which steps to expand, making each side answer randomly chosen sub-questions, whatever — gets the judge to the true answer on questions of that shape atleast ~70% of the time?

  I want the decomposition, not just the number: how much of your credence rests on whether a true universal claim of that sort can always be given a short certificate at all; how much on whether a bounded judge can be made to reliably find a buried flaw if it's allowed enough follow-ups; how much on whether the one-time cost of building an obfuscated argument versus the per-round cost of rebutting one creates a real asymmetry between the two sides; and how much on whether 'the honest debater knows the answer' is even the right idealization, given that in the cases we actually care about nobody has the answer yet. Also — one thing that keeps tripping me up — I have a vague memory of some complexity result where a verifier with almost no computational power can be convinced of any true statement provided it can interrogate a prover interactively. But I think that assumed the prover was unbounded, which would make it useless here; tell me if I'm misremembering and whether that analogy is doing any work at all.

  For what it's worth I'm around 0.3 and my friend is around 0.8, and what I really want to know is which sub-question our disagreement actually lives in, and which experiment or argument would move your number the most.
