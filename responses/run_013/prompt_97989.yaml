prompt: |-
  I'm in a political philosophy reading group and we've been doing social choice theory, and I'm supposed to lead the discussion after we watch 12 Angry Men. I keep getting tangled up because the film looks like a story about one honest holdout slowly turning a jury around, but our readings on the Gibbard-Satterthwaite theorem and strategy-proofness make me suspicious of that story. Can you read the film through that theorem? Treat the jury as a social choice mechanism whose outcome set is guilty, not guilty, and hung, with the jurors having ordinal preferences over those outcomes and over things like getting home and not being the one who caves. I suspect the unanimity rule is not strategy-proof once hung is on the table, and I want to know whether the film shows that or whether it shows something else.

  The theorem says you can't have a rule that is onto, non-dictatorial, and strategy-proof once there are at least three outcomes. So which is the film's jury? Is it dictatorial in the formal sense, because the holdout can block conviction, or is it manipulable, and if so where do we see jurors misrepresenting their preferences rather than sincerely changing their minds? I'd like the reading to take both the film and the theorem seriously: point to scenes where the theorem illuminates what's happening, say where the film resists the theorem or shows its limits, and end with what the film adds to the debate that the theorem alone doesn't. No citations or references needed, I just want the argument and the scenes.
