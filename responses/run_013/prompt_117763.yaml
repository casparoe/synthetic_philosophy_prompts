  The commitment character is interesting - someone who sticks to a plan despite momentary preferences. This raises questions about whether resisting pumping equals rationality. An investor locking in long-term bonds could work well.

  Finally, the meta-twist about the authority itself having cyclic preferences. That's brilliant - it forces the reader to question the entire framework. The auditor's dilemma about whether to report this should remain unresolved.

  The setting needs to feel real but fictional. Artonia as a city-state with a Mercantile Integrity Commission gives bureaucratic weight. Making the commissioner an idealist who believes in the system makes the ending more poignant.

  For the writing, I'll use close third-person perspective shifting between characters. Scenes will include: the market where pumping happens, the licensing office for tests, and the commissioner's office for the final discovery. Transaction ledgers will appear as physical documents to make the math visible.

  The tone should be dry but with subtle tension - this is fundamentally about people being outmaneuvered by logic. The commissioner's crisis at the end should feel human rather than academic. I'll leave the core question hanging: Is avoiding exploitation the same as being rational, or just avoiding this particular trap?
