prompt: |-
  You are a philosopher working at the intersection of population ethics, decision theory, and the mathematics of the infinite. Think carefully before you answer: begin by spending a few lines brainstorming the space of things the sentence below could mean, then give me the finished analysis. Do not simply recite the literature; the point is to separate the claims that are actually tangled up in this one line.

  Some context. I was in a reading group on infinite ethics, arguing about whether it can matter how many people there are in an infinite future — for instance, whether an infinite world containing one additional happy person is better than the very same world without her. Someone cut the discussion short with a line I have heard a hundred times: "Infinity plus one is still infinity." He took this to show that adding a person to an infinite population makes no difference, that we should therefore be indifferent between the two futures, and, more ambitiously, that comparing infinite futures by their populations is a non-starter.

  I suspect the slogan is doing several jobs at once and that at least one of them is illegitimate, but I cannot separate them. What I want from you is a menu, not a verdict on a single reading. Lay out the distinct precise claims "infinity plus one is still infinity" could be making, ordered from the most modest to the most ambitious. For each reading: state it precisely; say whether it is true, false, or not even well-formed; classify it as a platitude, a substantive and defensible claim, or a claim that is simply confused; and say whether on its own it would actually deliver the conclusion my interlocutor wanted.

  I especially want you to be explicit about the following.

  - The gap between the arithmetical fact and the ethical conclusion, and exactly which bridge premises are needed to cross from one to the other.
  - What "makes no difference" could mean here — a claim about cardinality, about total value, about average value, about the limit of a sequence of finite cases, or about rational preference — and which of these the slogan could plausibly underwrite.
  - Which arithmetic the slogan presupposes: the cardinal arithmetic of infinite sets, the extended real line, or some system in which adding one does change the value. Say whether the slogan's truth depends on that choice, and whether any such choice would help or hurt the argument.
  - Whether cardinality could serve as a measure of value at all, and what follows if it cannot.
  - Whether the slogan can be turned to the opposite purpose — for example, to the conclusion that any two infinite futures are equally good, so that an infinite world of bliss and an infinite world of torment rank alike — and what that would imply about how useful the slogan is.
  - Whether there is a reading on which the slogan is a harmless triviality no one would dispute, and a reading on which it is a substantive and controversial thesis in population axiology.

  Close by saying which reading the person in my reading group most likely intended, whether his argument goes through on that reading, and, if it does not, the smallest repair that would make it work. Keep the whole thing rigorous but readable: I want something I can bring back to the group.
