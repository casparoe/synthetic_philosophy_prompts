  Below is a decision tree flowchart designed to clarify the views on anthropic reasoning and self-location uncertainty, based on concrete cases. The tree starts with a fundamental question about self-location uncertainty and branches through key thought experiments (Coin-Flip Universe, Sleeping Beauty, Doomsday Argument, and a Charity Decision case). Each node is a question answerable without knowing the named positions, and leaves are labeled with the corresponding philosophical stance. Positions are defined by their answers to the cases, and reference class distinctions (e.g., "all observers," "all humans," or "all minds/experiences") are highlighted where they create divergence. Incoherent or unexplored branches are flagged.

  ---

  ### **Anthropic Reasoning Decision Tree**  
  *Start at the top and follow the path based on your answers.*

  #### **Q1: Is there ever genuine uncertainty about "which observer you are" in scenarios involving multiple possible observers?**  
  *(e.g., In a multiverse or probabilistic setup, could you rationally be unsure of your identity?)*  
  - **No → Go to Q2**  
  - **Yes → Go to Q3**  

  ---

  #### **Q2: In the "Coin-Flip Universe" case, what probability do you assign to tails?**  
  *(Case: A fair coin is flipped. Heads = universe has 1 person; tails = universe has 1 trillion people. You are one of the people.)*  
  - **50% (no adjustment for population size) → Leaf: No Self-Location Uncertainty (NSLU)**  
    - **Core belief**: Self-location uncertainty is incoherent. You are not a "random observer"; your existence is fixed.  
    - **Cases**:  
      - *Coin-Flip*: 50% tails (coin fairness dominates).  
      - *Sleeping Beauty*: 50% heads (coin fairness; awakenings are the same observer).  
      - *Doomsday*: Rejects the argument (birth rank isn't evidence for humanity's end).  
      - *Charity*: Donate to extinction prevention only if objective risks (e.g., asteroid probability) justify it—no anthropic adjustment.  
    - **Reference class**: Irrelevant (no uncertainty about identity).  
  - **\~100% (heavily favor tails due to more people) → Leaf: Self-Sampling Assumption (SSA) with Biological Reference Class**  
    - **Core belief**: Self-location uncertainty applies, but only to distinct *biological entities* (not temporal slices). Update probabilities as if you're a random observer from the reference class.  
    - **Cases**:  
      - *Coin-Flip*: \~100% tails (more observers in tails branch).  
      - *Sleeping Beauty*: 50% heads (only one biological person; awakenings aren't distinct observers).  
      - *Doomsday*: Accepts the argument (being an early human suggests total humans are few).  
      - *Charity*: Donating to extinction prevention is less urgent (if Doomsday suggests few future humans).  
    - **Reference class**: All humans (or biological observers), ignoring duplicated experiences.  
    - **Note**: Distinguishes "observers" from "experiences."  

  ---

  #### **Q3: In the "Coin-Flip Universe" case, what probability do you assign to tails?**  
  *(Same case as Q2.)*  
  - **50% (no adjustment) → Go to Q4**  
  - **\~100% (favor tails due to more people) → Go to Q5**  

  ---

  #### **Q4: In the "Sleeping Beauty" case, what is P(heads) upon awakening?**  
  *(Case: Beauty is drugged. Fair coin flip: heads = woken once (Mon); tails = woken twice (Mon & Tue). All wakings feel identical.)*  
  - **1/2 (halfer view) → Leaf: SSA Within a Single World**  
    - **Core belief**: Self-location uncertainty only applies *within* a fixed world, not across worlds.  
    - **Cases**:  
      - *Coin-Flip*: 50% tails (across worlds, no population-based updating).  
      - *Sleeping Beauty*: 1/3 heads (within a fixed world, you're a random awakening).  
      - *Doomsday*: Accepts the argument (within a world, early birth rank suggests few total humans).  
      - *Charity*: Donating to extinction prevention may be less urgent (Doomsday implies few future humans).  
    - **Reference class**: Observer-moments (e.g., awakenings) within a world.  
  - **1/3 (thirder view) → *Incoherent Branch***  
    - **Explanation**: 50% in Coin-Flip rejects population-based updating across worlds, but 1/3 in Sleeping Beauty requires it within a world. No consistent position holds this.  

  ---

  #### **Q5: In the "Sleeping Beauty" case, what is P(heads) upon awakening?**  
  *(Same case as Q4.)*  
  - **1/2 (halfer view) → Leaf: SSA with Biological Reference Class**  
    - *(Same as leaf under Q2. Path exists but rare; may indicate reference class confusion.)*  
  - **1/3 (thirder view) → Go to Q6**  

  ---

  #### **Q6: In the "Doomsday Argument," does being among the first 100 billion humans suggest humanity will end soon?**  
  *(Case: Total humans ever could be 1 trillion (long survival) or 200 billion (short survival). You’re in the first 100B.)*  
  - **Yes (supports Doomsday) → Leaf: Self-Sampling Assumption (SSA)**  
    - **Core belief**: Reason as if you’re a random observer from all *actual* observers in your reference class. Favors "smaller" worlds.  
    - **Cases**:  
      - *Coin-Flip*: \~100% tails (more observers in tails, so you’re likely there).  
      - *Sleeping Beauty*: 1/3 heads (random awakening in the actual world).  
      - *Doomsday*: Accepts the argument (random sampling favors smaller total populations).  
      - *Charity*: Donating to extinction prevention is high-priority (if Doomsday is true, extinction is likely).  
    - **Reference class**: All observers (or all humans), including temporal slices like awakenings.  
    - **Divergence**: Conflicts with SIA on charity/extinction urgency.  
  - **No (rejects Doomsday) → Leaf: Self-Indication Assumption (SIA)**  
    - **Core belief**: Your existence is evidence for worlds with more observers. Favors "larger" worlds a priori.  
    - **Cases**:  
      - *Coin-Flip*: \~100% tails (more observers = more likely to exist there).  
      - *Sleeping Beauty*: 1/3 heads (more awakenings in tails = more likely to be there).  
      - *Doomsday*: Rejects the argument (SIA’s prior for large worlds cancels birth-rank evidence).  
      - *Charity*: Donate to extinction prevention—future lives matter, and SIA doesn’t reduce their expected number.  
    - **Reference class**: Typically all conscious experiences (e.g., minds or observer-moments).  
    - **Note**: Vulnerable to the "Presumptuous Philosopher" problem (e.g., assuming a vast universe is likely without evidence).  

  ---

  ### **Summary of Leaves & Key Distinctions**  
  | **Leaf Position**                          | **Coin-Flip P(tails)** | **Sleeping Beauty P(heads)** | **Doomsday Argument** | **Charity/Extinction** | **Reference Class** |  
  |--------------------------------------------|------------------------|------------------------------|------------------------|------------------------|---------------------|  
  | **NSLU**                                   | 50%                    | 50%                          | Reject                 | Objective risks only   | Irrelevant          |  
  | **SSA (Biological)**                       | \~100%                 | 50%                          | Accept                 | Less urgent            | Biological humans   |  
  | **SSA (Within World)**                     | 50%                    | 1/3                          | Accept                 | Less urgent            | Observer-moments    |  
  | **SSA**                                    | \~100%                 | 1/3                          | Accept                 | High-priority          | All observers       |  
  | **SIA**                                    | \~100%                 | 1/3                          | Reject                 | High-priority          | All experiences     |  

  - **Flagged Issues**:  
    - The branch for **"SSA Within a Single World"** is rare and may be unstable if applied to cross-world cases.  
    - **"SSA with Biological Reference Class"** and **SSA** are indistinguishable on Coin-Flip but diverge on Sleeping Beauty due to reference class (biological vs. experiential).  
    - **SIA** and **SSA** agree on Coin-Flip and Sleeping Beauty probabilities but disagree on Doomsday and Charity due to how priors are weighted.  
    - **Incoherent Branch**: Answering "50%" to Coin-Flip and "1/3" to Sleeping Beauty has no consistent position.  
    - **Unexplored Combinations**: "Yes" to self-location uncertainty + "1/2" in Sleeping Beauty + "50%" in Coin-Flip is incoherent and not held.  

  ### **How to Use This Flowchart**  
  1. **For your reading group**: Have each member work through the tree independently.  
  2. **Discuss divergences**: Note where answers split (e.g., at Q1, Q3, or Q6) and use the leaf descriptions to clarify terminology.  
  3. **Focus on reference class**: Disagreements often stem from whether "observers" include temporal slices (e.g., Beauty’s awakenings) or only biological entities.  
  4. **Test decisions**: Use the Charity case to force practical differences—e.g., SIA prioritizes extinction prevention more than SSA-with-Doomsday.  

  This tree isolates core disagreements (e.g., your mate’s "bet on trillion" view is SIA, while your "50/50" is NSLU or SSA-within-world) and shows how reference class shapes outcomes. For deeper dives, assign readings: Bostrom (SSA/SIA), Lewis (halfer), or Arntzenius (SIA critiques).
