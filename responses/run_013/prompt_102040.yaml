prompt: |-
  I'm running next month's session of a small rationality discussion group — mixed crowd, two of them have seen a bit of game theory, the rest are smart non-specialists — and I want to do superrationality, but built around the Platonia dilemma and the Luring Lottery rather than the Prisoner's Dilemma that everyone's already been bored by. Quick setup so you're with me: in Platonia, an eccentric trillionaire gets 20 strangers together and says that if exactly one of them sends him a telegram (reverse charges) by noon tomorrow, that one person gets a billion dollars, and if more than one sends one or nobody does, nobody gets anything, and they can't coordinate. The Luring Lottery was a real stunt a magazine ran in the early 80s: you entered by mailing a postcard with the number 1 on it, you were allowed to write any number of entries on the card, and the prize was a million dollars divided by the total number of entries, going to one randomly chosen entry. Hofstadter's superrational idea, roughly, is that in a symmetric puzzle the answer is the same for everyone, so you reason as if everyone picks the same strategy.

  Don't explain it to me, I already get it — I want a plan for how to teach it. Act like a philosopher who's taught decision theory to non-specialists and thinks carefully about where people trip. Start by brainstorming the dependency order: what has to be in place before "superrational" even parses for them, and what depends on what. Then tell me which one example should carry the whole session — Platonia or the Lottery — and what it has to have and lack to do that job, plus why I'm right to think the PD is a trap here. Give me the misconceptions they'll bring or form and exactly where in the sequence to head each one off (I'm already worried about "superrational = being nice / just Kant" and "it's magical thinking where my choosing makes them choose"). What should I openly refuse to cover at this level and say so out loud? And finish with the one closing question that would show me they actually got it rather than just nodded along.
reasoning: |-
  Okay, the user is running a rationality discussion group next month and wants to focus on superrationality using the Platonia Dilemma or Luring Lottery instead of the Prisoner's Dilemma. They're looking for a structured teaching plan that addresses potential misconceptions and ensures participants truly grasp the concept.

  First, I need to recall the core ideas of superrationality. Hofstadter's approach involves symmetric puzzles where players are identical and must reason that everyone will choose the same strategy. The key is that the outcome depends on all players making the same choice simultaneously. The user wants to avoid the Prisoner's Dilemma because it's overused and might lead participants down familiar but irrelevant paths.

  The user mentioned two scenarios: Platonia Dilemma and Luring Lottery. Platonia has 20 strangers where only one must send a telegram to win, but if more or none do, no one wins. The Luring Lottery involves sending postcards with numbers, where the prize is shared based on total entries. Both are symmetric, but the lottery involves continuous strategy (choosing a number) while Platonia is binary (send or not send). 

  I should consider which example is better for teaching. Platonia might be simpler because it's binary, but participants might default to probabilistic strategies. The lottery allows for continuous strategy and introduces the concept of equilibrium more clearly. The lottery also demonstrates that superrationality isn't about altruism but about finding the consistent strategy where everyone's choice aligns. The user is concerned about misconceptions like confusing superrationality with Kantian ethics or magical thinking. Using the lottery could help avoid those because the optimal entry number isn't obvious, forcing participants to think about symmetry.

  Next, structuring the dependency order. Participants need to understand symmetry and common knowledge first. Without that, superrationality won't make sense. Then, introduce the problem without coordination, highlight the failure of standard decision theory, and then present the superrational approach. Emphasize that it's not about influencing others but recognizing that identical reasoning leads to identical choices.

  Misconceptions to address: 
  1. Superrationality as altruism. Head this off by showing that in the lottery, choosing a higher number isn't "nice" but necessary for a better outcome. 
  2. Magical thinking: clarify that it's about logical consistency, not causation. 
  3. "Just be different" fallacy: in Platonia, some might think being unique is key, but superrationality avoids that by having everyone follow the same strategy.

  Openly refuse to cover Nash equilibrium or evolutionary stability at this stage. Keep it focused on symmetric games and Hofstadter's concept.

  The closing question should test if they understand the equilibrium aspect. For the lottery, ask what superrational number they'd choose and why. The correct answer is 1, because if everyone picks 1, the total entries equal participants, so each has one entry, and the prize is maximized per entry. Any other number would lead to inconsistency and suboptimal outcomes.

  Why avoid PD? It conflates cooperation with superrationality. PD's dominant strategy is defection, but superrationality in PD suggests cooperation, which might lead participants to think it's about being nice. Using Platonia or lottery separates the concept from moral implications.
answer: |-
  Here's a battle-tested teaching plan focusing on conceptual dependencies, misconception disarmament, and deep comprehension. It prioritizes the **Luring Lottery** as the primary engine, with Platonia as a contrasting opener.

  **Dependency Order (The Scaffolding):**
  1.  **Symmetry:** Participants must *feel* the identicality. "You're all identically rational, identically informed, and know everyone else is too. No unique roles."
  2.  **Common Knowledge of Rationality:** Not just "everyone is smart," but "everyone *knows* everyone is smart," and "everyone knows everyone knows..." This enables recursive reasoning.
  3.  **The Problem Structure:** Clear payoffs, no communication, simultaneous decisions. Highlight the *crucial* dependence of your outcome on *everyone's* choices.
  4.  **Failure of Standard Instrumental Rationality:** Show how traditional "best response to others" fails miserably due to symmetry. (E.g., "In Platonia, if I think others won't send, I should send. But they think that too! If I think others will send, I shouldn't. But they think that too! Deadlock.")
  5.  **The Symmetry Axiom (Superrational Core):** *Because* of (1) & (2), the *only consistent* solution is where everyone reasons identically and arrives at the *same* strategy. "What strategy, if *everyone* plays it, leads to a good outcome?" This isn't cooperation; it's logical consistency under symmetry.
  6.  **Equilibrium Focus:** Superrationality finds a specific type of symmetric equilibrium. The key question shifts from "What should *I* do?" to "What should *we all do*?".

  **Why The Luring Lottery Carries the Session (and Platonia is the Spark):**
  *   **Use Platonia First (Briefly - 10 mins):** Pose it raw. Let them flounder. See the confusion ("Someone should just flip a coin!" "But how do we sync probabilities?" "Maybe I should just send it and hope others don't!"). This viscerally demonstrates the failure of standard reasoning (Dependency #4) and the *need* for a new tool. **Stop before trying to solve it.**
  *   **Switch to the Luring Lottery (The Workhorse - 30 mins):**
      *   **What it HAS:** Continuous strategy space (any integer N >0). Clear payoff: Prize = $1e6 / (Total Entries). Winning chance = (Your Entries) / (Total Entries). Expected Value = [Your Entries / Total Entries] * [$1e6 / Total Entries] = ($1e6 * Your Entries) / (Total Entries)^2.
      *   **What it LACKS (Crucially):** The "just be different" pressure of Platonia. The optimal *superrational* strategy is obvious and compelling once the symmetry is embraced.
      *   **The Process:**
          1.  Ask: "What number N would you write? Why?" Get raw intuitions (often 1, or huge numbers).
          2.  Show standard reasoning fails: "If I think others write small N, I should write huge N to grab more entries. But they think that too -> Total Entries explode -> EV -> $0." "If I think others write huge N, I should write 1 to keep Total Entries low? But they think that too -> Total Entries = Participants -> EV is small unless I write huge N? Contradiction."
          3.  **Introduce Superrationality:** "Forget predicting others. We're identical. *Whatever* N I choose, everyone else, being identical and identically rational, will choose the *same* N. So Total Entries = (Number of Players) * N."
          4.  Plug into EV: EV = ($1e6 * N) / [ (Players * N) ^ 2 ] = ($1e6 * N) / (Players^2 * N^2) = $1e6 / (Players^2 * N).
          5.  **Key Insight:** EV = $1e6 / (K * N) where K = Players^2 is constant. *To maximize EV, I need to minimize N*. The smallest possible N is 1.
          6.  **The Superrational Solution:** Everyone writes "1". Total Entries = Players. EV = ($1e6 * 1) / (Players^2 * 1) = $1e6 / Players^2. (Note: Actual winnings if won = $1e6 / Players).
          7.  **Contrast with Naive "1":** If someone naively writes 1 *without* superrational reasoning, but others write large numbers, their EV plummets. Superrationality only works if *all* reason symmetrically. This highlights the *equilibrium* nature.
  *   **Return to Platonia (10 mins):** Now apply the lens. "What's the *same* strategy everyone can play?" The only consistent symmetric strategies are "All Send" or "All Don't Send". "All Send" pays $0. "All Don't Send" pays $0. **Ah-Ha!** Platonia has *no* superrational solution! It highlights the *limitation* – superrationality requires a mutually beneficial symmetric equilibrium to exist. This contrast reinforces why the Lottery worked.

  **Why PD is a Trap (You're Right):**
  1.  **Cooperation Confusion:** PD instantly frames the choice as "Cooperate vs. Defect," laden with moral baggage ("nice" vs. "selfish"). Superrationality gets misread as "just be cooperative because it's good." Lottery/Platonia lack this.
  2.  **Dominant Strategy Distraction:** PD's dominant strategy (Defect) overshadows the symmetry argument. Defecting is *individually* rational regardless of others. Lottery/Platonia have no dominant strategy.
  3.  **Overfamiliarity:** Eyes glaze over. "Oh, this again, cooperate is better if we all do it..." They miss the *novelty* of the symmetry axiom. Lottery feels fresh and forces new thinking.

  **Misconceptions & Defusal Plan:**
  1.  **"Superrational = Being Nice / Kantian Duty"**
      *   **When:** When first presenting the Lottery solution (Everyone writes 1).
      *   **Defusal:** Immediately after deriving the solution mathematically (Step 4/5 above). **Say:** "Notice this isn't about altruism! Writing '1' isn't 'nice' to others. It's purely selfish! Choosing N=1 *maximizes my expected money* under the logical constraint that we all *must* choose the same strategy. If I could force everyone else to write 100 while I wrote 1, I *absolutely* would! But symmetry forbids that cheat code."
  2.  **"My Choice Magically Controls Others" (Sympathetic Magic)**
      *   **When:** When introducing the symmetry axiom ("Everyone chooses the same N").
      *   **Defusal:** Be brutally clear: **Say:** "This is NOT causation! Me writing '1' doesn't *make* you write '1'. It's a *logical deduction* about what must be true *if* we are all identical and perfectly rational. It's a consistency constraint, not mind control. If someone isn't reasoning superrationally, the spell breaks." Reinforce with the Lottery math – your EV calculation *assumes* everyone plays the same N *because* of symmetry.
  3.  **"Just Randomize Individually" (Platonia Trap)**
      *   **When:** During the initial Platonia struggle.
      *   **Defusal:** **Ask:** "What probability P should you send with? If everyone uses the same P, what's the probability exactly one sends? (It's tiny: 20 * P * (1-P)^19). If you set P to maximize *that*, it's still minuscule, and crucially, *your individual incentive* is to deviate – if you know others use P, you should set P=1 if P is low, or P=0 if P is high. It's unstable." Contrast this instability with the Lottery's clean symmetric equilibrium.
  4.  **"Superrationality Always Works"**
      *   **When:** After seeing Lottery success, before returning to Platonia.
      *   **Defusal:** **State Explicitly:** "Superrationality finds a solution *if* a mutually beneficial, symmetric strategy profile exists. Not all games have one, as we'll see." Then reveal Platonia's failure.

  **Openly Refuse to Cover (Declare Early):**
  *   **"We are NOT covering:** Nash Equilibrium in general (though this is a specific type), Evolutionary Game Theory, Objections based on non-identical players, Whether superrationality is 'truly rational' under philosophical scrutiny (e.g., causal vs. evidential decision theory debates), or Hofstadter's later refinements. Today is about grasping the *core surprising idea*: symmetry + rationality + common knowledge can force us into a specific, sometimes non-obvious, strategy that *only works if everyone does it*. That's plenty!"

  **The Closing Comprehension Check Question:**
  > **"In the Luring Lottery, imagine you are superrational, but you have a *strong suspicion* that exactly half the group are also superrational and will play the superrational strategy, while the other half are stubborn individualists who will *always* write '100' no matter what. What number N do you, as a superrational player, write now? Explain your reasoning."**

  *   **Why it works:** It tests if they internalized the *conditional* nature of superrational play (it depends on others also reasoning that way) and forces them to apply the symmetry axiom *only within the subgroup* they believe is superrational. It moves beyond rote application of the pure case.
  *   **Expected Answer:** "I reason that the other superrational players and I are identical. So we must all play the same N. Total Entries = (Superrational Players * N) + (Individualists * 100). My EV = $1e6 * N / [Total Entries]^2. We superrationals need to choose N to maximize this *given* the individualists play 100. Plugging in the fixed terms, the math will show that a low N (likely 1) is still optimal for the superrational subgroup, as the `N / (C + K*N)^2` structure still favors minimizing N." (Exact calculation depends on group sizes, but the reasoning is key).

  This plan builds the concept step-by-step, leverages the Lottery's strengths for clarity, uses Platonia for contrast, actively disarms major misconceptions, sets clear boundaries, and ends with a question requiring synthesis, not just recall. Good luck with the session!
