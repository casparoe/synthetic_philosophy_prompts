prompt: |-
  I teach an upper-level seminar in democratic theory and I'm putting together this term's final. The boundary problem -- who gets to be part of the demos that does the deciding? -- keeps getting the same canned answers: students recite "all affected interests" vs "all subjected to coercion," mutter that both are vague, and stop. I want one essay question that actually makes them work, and that can't be passed by summarizing the literature.

  Heres the setup I want to build it around. A mid-sized city is voting on whether to annex a neighboring township. Under the charter only current city residents vote. If it passes, township residents fall under city taxes and ordinances but got no vote. A third group -- people who work in the city but live outside both areas -- also got no vote, though city growth and transit decisions hit them too. And the charter requires a two-thirds supermajority for annexation, a rule an earlier generation added precisely to make future annexations hard, so today's voters are trying to lock in the boundaries of future demoi.

  A colleague of mine thinks the whole thing is a pseudo-problem. Her line: a demos never needs justifying "from outside"; it's legitimate so long as (a) insiders can in principle exit and (b) the arrangement stays contestable over time, so any excluded party can petition in and any included party can petition out. On her view legitimacy is retrospective and dynamic -- a running property, not something earned at a founding moment -- so there's no circular founding act to worry about, because there is no founding act; the demos is always mid-stream.

  Write the exam question so students have to (i) judge whether my colleague's move dissolves the boundary problem or just relocates it, (ii) run the annexation case as a test of her view, and (iii) deal with the entrenchment wrinkle -- whether a demos can legitimately fix its own future boundaries. Should be doable in about 50 minutes. Then give me a model answer of roughly 700 words plus a marking scheme out of 20 that cleanly separates an A from a B, naming the specific moves a top answer has to make and the specific mistakes that should cost marks.
reasoning: |-
  Okay, the user is teaching an upper-level seminar in democratic theory and needs a challenging final exam question. They're frustrated that students give superficial answers to the boundary problem—typically just mentioning "all affected interests" versus "all subjected to coercion" without deeper analysis. The user wants an essay question that forces critical thinking, using a specific annexation case study involving a mid-sized city, a township, and commuters. They also want students to engage with a colleague's argument that legitimacy is dynamic and retrospective, based on exit options and contestability, rather than a fixed founding moment. 

  The user's deeper needs are clear: they want to push students beyond regurgitation. The annexation scenario is perfect because it layers multiple tensions—excluded groups, supermajority entrenchment, and temporal lock-in. The colleague's view adds philosophical heft by challenging the very framing of the boundary problem. 

  For the exam question, I'll structure it to require three moves: (1) Critically engage the colleague’s "dissolution vs. relocation" claim—does her dynamic legitimacy avoid circularity or just defer it? (2) Apply her view to the annexation case—can exit/contestability resolve the exclusion of township residents/commuters? (3) Tackle entrenchment—can a demos legitimately bind its future self? 

  The model answer needs to model high-level analysis: show how the colleague relocates rather than dissolves the problem (e.g., initial boundaries still need justification); expose how exit/contestability fails materially (e.g., exit costs for township residents) and procedurally (e.g., commuters lack standing to petition); argue entrenchment undermines dynamic legitimacy by freezing contestability. 

  The marking scheme must reward depth over coverage. Top answers should: diagnose circularity in the colleague’s "contestability presupposes boundaries"; identify how real-world constraints (e.g., economic dependence) void formal exit; note the paradox of "binding future contestability." Common errors to penalize: conflating affected/subjected principles, ignoring the supermajority’s temporal impact, or accepting the colleague’s view uncritically. 

  Key insight: The colleague’s move is elegant but self-undermining. Contestability requires a pre-defined demos to do the contesting—which is the very boundary problem in disguise. The annexation case makes this visceral: the city’s rules silence outsiders *now*, and entrenchment ensures they stay silenced. That’s where an A answer lives.
answer: |-
  Here’s a rigorous exam question designed to force critical engagement, followed by a model answer and precise marking scheme:

  **Exam Question (50 minutes)**  
  > "The boundary problem dissolves once we recognize that a demos’ legitimacy is dynamic: it requires no foundational justification so long as (a) members can meaningfully exit and (b) boundaries remain perpetually contestable. Any exclusion is merely provisional, redeemable through future internal contestation."  
  >   
  > **Critically evaluate this claim** in light of the **Midville annexation case**:  
  > - City residents vote on annexing Township (requiring 2/3 supermajority).  
  > - Township residents (to be subjected to city laws/taxes) and commuters (affected by city policies) have no vote.  
  > - The supermajority rule was designed by past voters to entrench boundaries against future change.  
  >   
  > Address:  
  > (i) Does this "dynamic legitimacy" view **dissolve** the boundary problem or **relocate** it?  
  > (ii) How well does it handle **Township’s exclusion** and **commuters’ lack of voice**?  
  > (iii) Can a demos legitimately use **procedural entrenchment** (supermajority rules) to limit future boundary contestation?  

  ---

  **Model Answer (710 words)**  

  The "dynamic legitimacy" view reframes but fails to resolve the boundary problem. By treating legitimacy as an ongoing process of contestation and exit, it *relocates* the circularity of founding a demos rather than dissolving it. The Midville case exposes three fatal tensions in this approach: the dependence of contestability on prior boundaries, the material irrelevance of formal exit, and entrenchment’s sabotage of future contestation.  

  **(i) Relocation, not dissolution**: The colleague’s view presupposes an already-constituted demos capable of contesting boundaries. But *who* initiates contestation? In Midville, only city residents—the predefined demos—can petition to include Township residents or commuters. This recreates the boundary problem at the procedural level: the authority to decide *who may contest* rests solely with the incumbent demos. The circularity isn’t avoided; it is transferred to the rules governing contestation. If legitimacy requires only that the included can later debate inclusions/exclusions, we still need an account of why *this specific group* holds that monopoly initially. The "dynamic" view thus relocates the justificatory burden to the threshold question: *Who sets the terms of contestability?*  

  **(ii) Failure in the annexation case**:  
  - **Township residents**: Formal exit (moving away) is implausible for those economically/culturally tied to the region. "Petitioning in" is equally hollow: city voters have no incentive to expand their tax base or dilute political power. More critically, *being coerced without prior consent* violates the autonomy dynamic legitimacy claims to protect. Township residents are subjected to binding laws (taxation, ordinances) without ever having endorsed the process—a democratic deficit dynamic theory cannot remedy retroactively.  
  - **Commuters**: Their "affected interests" (transit, pollution) grant them no standing to petition. The theory assumes boundaries are contestable by *those already recognized as potential members*, but commuters lack even this provisional status. The colleague’s view offers no recourse for groups deemed permanently "external" by the demos. This exposes dynamic legitimacy’s parochialism: it legitimizes *internal* tinkering but cannot address structural exclusion of those defined as outsiders ab initio.  

  **(iii) Entrenchment as anti-contestability**: The supermajority requirement is not neutral proceduralism but an active weapon against future contestation. Past voters sought to "lock in" their preferred boundaries by raising the threshold for change. This directly violates condition (b): meaningful contestability requires that boundaries *can* shift via democratic will, but entrenchment insulates the status quo from majoritarian pressure. If a demos can bind its future self to near-immutable boundaries, "dynamic legitimacy" collapses into static authoritarianism. The theory’s emphasis on perpetual revisability is nullified by procedural tricks that make revision practically impossible—especially when the excluded (Township, commuters) have no voice in designing those procedures.  

  **Conclusion**: The dynamic view’s appeal—avoiding foundational myths—is undermined by its blindness to power asymmetries. By treating exit and contestation as panaceas, it ignores how *exit costs* (economic, social) and *asymmetric contestation* (insiders control the agenda) cement exclusion. Midville reveals that "we can always change it later" is an illusion when the empowered demos designs rules to prevent change. The boundary problem endures because procedural fairness cannot compensate for the original act of drawing borders that silence the coerced and affected.  

  ---

  **Marking Scheme (Total: 20 marks)**  
  **A-grade (17–20)**: Must achieve all:  
  - **Explicitly argues relocation (not dissolution)** (3 marks).  
  - **Identifies circularity in contestation’s preconditions** (e.g., "Who decides contestability rules?") (3 marks).  
  - **Distinguishes Township’s coercion vs. commuters’ affectedness**, showing why dynamic solutions fail both (4 marks).  
  - **Links entrenchment to sabotage of future contestability** (not just "it’s unfair") (3 marks).  
  - **Notes exit’s impracticality/irrelevance under duress** (2 marks).  
  - **Structure**: Clear thesis, integrated case analysis, no summary padding (3 marks).  

  **B-grade (13–16)**: Limited to:  
  - Describes relocation/dissolution but lacks depth on circularity.  
  - Treats Township/commuters as interchangeable "excluded groups."  
  - Mentions entrenchment but not its *procedural* anti-democratic effect.  
  - Uses case as illustration rather than analytical engine.  
  - Competent but derivative arguments; minor omissions.  

  **Deductions**:  
  - **-3–4**: Summarizes "affected/subjected" literature without engaging dynamic theory.  
  - **-2**: Calls entrenchment "unfair" without tying it to contestability’s collapse.  
  - **-2**: Uncritically accepts colleague’s view as solution.  
  - **-1–2**: Vague on commuters’ status ("no standing to petition").  
  - **-1–2**: Ignores supermajority’s temporal lock-in effect.  

  **Top Answers Show**:  
  1. The **insider/outsider paradox**: Contestability requires a demos to exist *before* contestation begins.  
  2. **Entrenchment as procedural violence**: It weaponizes "rules" to stifle the dynamism the theory needs.  
  3. **Material vs. formal analysis**: Exit/contestation are empty for resource-poor groups (e.g., Township).  

  This question forces engagement with power, temporality, and procedural hypocrisy—ensuring students can’t hide behind textbook dichotomies.
