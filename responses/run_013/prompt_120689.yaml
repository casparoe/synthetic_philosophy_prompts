    But note: the War of Attrition does not have a both-pay rule? Actually, in the War of Attrition, the two players pay a cost per unit time until one quits, and then the one who stays gets the prize and the quitter gets nothing (and pays the cost for the time they stayed). So it is both-pay in the sense that both pay the cost for the duration they stayed, but the winner gets the prize.

    This is similar to the dollar auction in that the loser pays without getting the prize, but the cost is continuous. And the prize value can be asymmetric and unknown.

    We'll say:

      better_analogy: {
          name: "War of Attrition",
          reason: "It models continuous costs over time, uncertain prize values, and asymmetric information, without assuming a fixed prize or discrete bids."
      }

