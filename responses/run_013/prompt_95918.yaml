  The table examples are particularly telling. They accept material change (ice table) and part replacement, but draw the line at becoming a poached egg. And their statue/clay intuition shows they grasp constitution problems while feeling uneasy about it. 

  Hmm... their causal origin hint is astute. For personal identity, origins seem essential (birth era, parents) while career is accidental. But tables are different - origin matters less than form/function. That suggests we need distinct criteria for different entity types. 

