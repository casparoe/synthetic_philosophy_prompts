prompt: |-
  I'm a backend engineer with no philosophy training, so I need you to act like a philosopher who specialises in modality and personal identity — someone who's thought really hard about possible worlds and what it means to say a thing could have been otherwise. Think carefully before you commit to anything, and start by brainstorming a few different ways my verdicts below might hang together.

  I've been chewing on this stuff alot lately and it's been bugging me. I keep half-remembering two views — one where the very same object turns up in other possible worlds, and one where it doesn't and only a 'counterpart' of it does — but I can't keep straight which one my gut actually agrees with. So here's my gut, case by case:

  - I could have been a plumber instead of a programmer. Definitely true.
  - I could have been born in 1650. False. Not me, anyway.
  - I could have had different biological parents. Honestly? My gut says false, and that surprises me, because it feels like it should be the same kind of claim as the plumber one.
  - The wooden table in my apartment could have been made of ice. True — same table, different material.
  - That table could have been built from a completely different set of planks. True.
  - That table could not have been a poached egg. Just false.
  - I could not have been you. False.
  - The statue and the lump of clay: I'll happily say the statue could survive being squashed and the lump could survive being recast, and that they aren't the same thing — but I also think there's only one object sitting there. I suspect I'm cheating somewhere in that one.

  What I want from you: is there one principle — about which things in other worlds count as the same thing, or as my counterpart — that gets all of these, or close? State it precisely enough that I could apply it myself. If it takes two different similarity relations (a loose one for the plumber, a tight one for the parents) then spell out both and say why one alone won't do. My half-baked guess is that it's all about how much of the causal origin has to be preserved, but I don't know what that does to the table cases.

  Then tell me which of my verdicts I have to give up, and use the surviving principle on cases I haven't listed: could this laptop have been built from a different set of parts? Could this very laptop have been a different laptop — different serial number, different factory, different year? And what does the principle say about 'I could have been a completely different person', which I think is nonsense but can't say why?

  Please write your answer in British English — I work with a UK team and I'm trying to keep my spelling consistent.
