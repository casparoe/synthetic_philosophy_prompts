answer: |-
  Here's the joke, followed by the explanation:

  **Setup:**  
  A guy walks into a bar carrying an apple. An exploiter approaches his Past Self: "I see you value that apple at $1 now. But I know Future You in 10 minutes will value cash more. Sell me the apple for $0.75?" Past Self, preferring cash now, agrees. Ten minutes later, the exploiter approaches Future Self (now apple-less & craving it): "I see you value this apple at $1.50. Buy it back for $1.25?" Future Self, preferring the apple now, agrees. The guy leaves 50 cents poorer, still holding his apple.

  **Punchline:**  
  The exploiter grins: "See? No tricks. Past You thought he won. Future You thought *he* won. I just arbitraged your time zones."

  ---

  **Explanation for your friend:**  
  The punchline turns on **diachronic arbitrage**: the exploiter profits solely from *shifting valuations between the victim's own time-slices*, with each slice rationally accepting a "winning" trade by its *local* preferences. The "just refuse" objection fails because there's no synoptic "you" at T=0 to refuse; only T=0's self-interested decision exists in that moment, and it sees $0.75 > $0 (apple). The joke highlights that the pump exploits fragmented agency across time, not stupidity.
