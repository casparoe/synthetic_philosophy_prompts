answer: |-
  ### Joint Statement: Aggregative Consequentialist & Separateness-of-Persons Restrictionist  
  **After Adversarial Collaboration on the Separateness of Persons Objection**  

  #### Agreed Claims  
  1. **Structure of the Moral Problem**: Both agree that morality requires impartial consideration of all affected individuals' interests. The core dispute concerns *how* these interests should be weighed, not whether they matter.  
  2. **The Objection is Not**:  
     - A bare assertion that aggregation is impermissible.  
     - A question-begging rejection of consequentialism *simpliciter*.  
  3. **Metaphysical vs. Normative Separateness**:  
     - *Metaphysical separateness* (persons as distinct subjects of experience) is an uncontested fact.  
     - *Normative separateness* (whether this distinctness entails constraints on aggregation) is the disputed inference.  
  4. **Persons as Loci of Experience vs. Loci of Claims**:  
     - All agree persons are separate *loci of experience* (metaphysical).  
     - Disagreement centers on whether they are separate *loci of claims* (normative), such that one person’s claim cannot be "traded off" against another’s.  
  5. **Decision Procedure vs. Criterion of Rightness**:  
     - Interpersonal aggregation may be pragmatically useful in *decision procedures* (e.g., triage protocols).  
     - The dispute is whether aggregation can define the *criterion of rightness* (what ultimately makes acts morally right/wrong).  
  6. **The Divided Ventilator Case**:  
     - **Case Description**: One ventilator can save Patient A (full recovery) or be modified to save Patients B and C (serious lifelong impairment each). Total welfare is higher if split (e.g., 50 utils > 40 utils). No exploitation or "using as means" occurs.  
     - **Agreed Non-Decisiveness**: Both sides agree this case does *not* resolve the core disagreement. The consequentialist sees it as straightforwardly favoring splitting; the restrictionist rejects this, but concedes the case alone cannot prove their view.  

  #### Disagreements: Structure and Cruxes  
  | Crux                                                                 | Agg. Consequentialist (AC) Formulation                                                                 | Restrictionist (R) Formulation                                                                                                | Shared Test/Case                                                                                                 | AC Prediction                                                                 | R Prediction                                                                 |
  |----------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|------------------------------------------------------------------------------|
  | **1. Does metaphysical separateness entail normative separateness?** | "Metaphysical separateness is neutral; it permits aggregation because morality must maximise overall good." | "Metaphysical separateness *grounds* normative separateness: distinct subjects generate distinct claims that resist trade-offs." | **Test**: Does a *single person's* experience of two harms (e.g., broken arm + broken leg) differ normatively from two people each suffering one harm? | AC: No difference; same disvalue. Trade-offs are identical in structure.      | R: Profound difference. One person’s aggregated suffering is tolerable; dispersing harms violates claims. |
  | **2. Can interpersonal aggregation define the criterion of rightness?** | "Aggregation is essential to the criterion. Right acts maximise net welfare, regardless of distribution across persons." | "Aggregation is invalid for the criterion. Moral reasons are agent-relative; claims of separate persons cannot be summed." | **Test**: *The Divided Ventilator*. Is splitting permissible?                                                   | AC: Yes. Higher total welfare obligates splitting.                            | R: No. Saving Patient A respects B and C’s claims not to be impaired for A’s sake. |
  | **3. Can R reject the ventilator split without question-begging?**   | "R’s rejection requires ad hoc constraints (e.g., 'no severe impairment trades') that lack independent justification." | "Rejection flows from separateness itself: B and C each have a claim to bodily integrity not overridden by aggregate gains." | **Test**: Modify *Ventilator*: Splitting causes B/C *mild* impairment (e.g., 1-week fatigue). Total welfare still higher. | AC: Predicts R will inconsistently permit splitting here, exposing arbitrariness. | R: Predicts even mild impairments are impermissible if they instrumentalise B/C for aggregate gain. |

  #### Verbal Dispute Clarification  
  The dispute is **partly verbal** regarding "aggregation."  
  - **AC** uses "aggregation" to mean *summing welfare impacts across persons to determine net outcomes*.  
  - **R** uses "aggregation" to mean *ignoring the normative boundaries between persons*, which they see as illicitly converting persons into "receptacles."  
  **Why this matters**: AC sees R as rejecting a *technical procedure*; R sees AC as rejecting a *moral truth* about personhood.  

  #### Confidence Assessment  
  - **Highest Confidence**: Agreement on metaphysical/normative distinction (Point 3) and the non-decisiveness of the Ventilator case (Point 6).  
  - **Lowest Confidence**: The claim that R can reject the Ventilator split without rule-rejection (Point 6). *Why*: AC may insist R’s "claims" language implicitly invokes a deontic rule R cannot justify consequentially. R’s counter: Respecting claims *is* foundational, not derived.  

  #### Final Crux for Shared Test  
  The **Divided Ventilator** case tests whether R can consistently reject aggregation in criterion-of-rightness contexts without appealing to rules AC must reject.  

  \answer{Legitimacy of interpersonal aggregation in the criterion of rightness}
