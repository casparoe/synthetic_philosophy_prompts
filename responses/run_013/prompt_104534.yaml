  I do causal inference for a living — Pearl-style DAGs, structural equations, do-operators, Markov factorization, the whole shop. Lately I've been reading about al-Ghazālī's occasionalism: no necessary connections between events, fire doesn't really burn the cotton, God creates the burning on the occasion of the contact, and what we call causation is really just habit. Translate that into my vocabulary as faithfully as you can — variables and their parents, structural equations, the joint distribution and whether it factorizes at all, interventions, exogenous noise — and then give me the residue report. What translates cleanly, what did you have to fudge to fit, and what has no counterpart in causal-model land whatsoever? The bit I actually care about: does the leftover tell me occasionalism is pointing at something my framework can't represent, or that it's vaguer than it sounds once you try to pin it down? My hunch is it comes out as a graph where every observable has the same single latent parent, and I want to know if thats a faithful translation or a parody of the view.
