prompt: |-
  I work in health economics — cost-effectivness analysis, QALYs, ICERs, cost per life-year gained, that whole apparatus. I keep bumping into the procreation asymmetry (roughly: it's bad to bring into existence someone whose life goes badly, but not good to bring into existence someone whose life goes well, and there's no duty to create happy people) and I want to know how much of it I can actually say in the vocabulary I use every day. So: restate the asymmetry as faithfully as you can in my terms — health states, the comparator or baseline, QALY gains and losses, and the fact that every model I build has a fixed population of people already in it — and then give me the residue report. What survives the translation cleanly, what has to be distorted to fit, and what has no slot at all? For instance, can "bringing a person into existence" even be represented as a health state or a QALY gain, or does the additive way QALYs get summed across people quietly presuppose that the set of people is given? And does the person-affecting flavour of the asymmetry — that the good of a good life only counts for someone who exists to receive it — have any counterpart in a framework that just totals health across whoever happens to be in the model? I'd like to know whether the leftover is a blind spot in cost-effectiveness analysis or a sign that the asymmetry is answering a question my framework never asks.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in health economics, specifically cost-effectiveness analysis involving QALYs and ICERs. They're encountering the procreation asymmetry in their field and want to see how it translates into their existing framework. 

  First, I need to recall what the procreation asymmetry entails. It's the idea that creating a person with a bad life is bad, but creating someone with a good life isn't inherently good, and there's no obligation to create happy people. The user is asking how this fits into health economic models that use QALYs, which typically assume a fixed population.

  The user’s main concern seems to be whether their models can even represent "bringing a person into existence" as a health state or QALY gain. They’re aware that summing QALYs across people assumes a fixed population, but the asymmetry deals with changing that population. They also want to know if the person-affecting aspect of the asymmetry (focusing on harm to actual individuals) has any parallel in their framework, which aggregates total health.

  I should break down the translation step by step. Start by mapping the asymmetry into health economics terms. "Bringing a person into existence" would be adding a new individual to the population in a model. But in standard CEA, the population is fixed. So introducing a new person isn’t modeled. That’s a key point—maybe the framework can’t handle population changes, which is central to the asymmetry.

  Next, the harm of creating someone with a bad life. If we force it into the model, adding a person with negative QALYs would decrease total QALYs, making the intervention look worse. But in reality, without that person, there's no harm. The model sees it as a loss, but the asymmetry's harm is about creating suffering where there was none. That’s a distortion.

  Then, creating a person with positive QALYs. Adding them increases total QALYs, which the model sees as a gain. But the asymmetry says it’s not good, just not bad. The model treats it as a benefit, which misrepresents the asymmetry's neutrality. 

  The duty to create happy people: the asymmetry says there’s no such duty. But in CEA, if adding people with positive QALYs improves outcomes, the model might suggest it’s beneficial, implying a duty. Again, a distortion.

  Now, the residue report. Clean translations: harm from bad lives can be seen as negative QALYs, but only if the person exists. Distortions: treating new lives as QALY gains/losses misrepresents the asymmetry's nuances. The person-affecting aspect clashes with the model's welfarist aggregation, which ignores who benefits as long as total health increases. 

  The user might be worried that CEA has a blind spot here, but it’s more that the framework answers different questions. CEA focuses on efficiency within a fixed population, while the asymmetry addresses moral questions about creating lives. Trying to fit it into CEA could lead to ethical issues, like ignoring rights or agency.

  Underlying needs: The user might be encountering ethical dilemmas in their work, like resource allocation involving future generations or reproductive health policies. They need to recognize when standard CEA is insufficient and when to incorporate broader ethical considerations.
answer: |-
  Here's a faithful restatement of the procreation asymmetry within your health economics framework, followed by a residue report detailing what survives, what's distorted, and what has no slot:

  **Faithful Restatement in Health Economics Terms:**

  1.  **Harm of Creating a Bad Life:** An intervention (e.g., a policy enabling conception) that brings a new person into existence who experiences a lifetime health state with a negative average QALY score (a life "worse than non-existence") results in a net *loss* to the universe of well-being. This loss *must* be counted against the intervention's cost-effectiveness. (Analogue: Creating a person with negative QALYs).
  2.  **Neutrality of Creating a Good Life:** An intervention that brings a new person into existence who experiences a lifetime health state with a positive average QALY score (a life "better than non-existence") does **not** generate a net *gain* in well-being that can be counted *for* the intervention's cost-effectiveness. (Analogue: Creating a person with positive QALYs yields *zero* QALY gain for the model).
  3.  **No Duty to Create:** There is no baseline obligation or "comparator" state requiring the creation of people with positive QALY lives to improve total population health outcomes. Failing to implement an intervention that would create such lives does **not** constitute a QALY loss or reduction in cost-effectiveness relative to a "create happy people" baseline. (Analogue: The "do nothing" comparator never includes creating non-existent happy people as the default).
  4.  **Person-Affecting Constraint:** Well-being gains and losses only have moral significance (and thus enter the CEA calculation) if they are experienced by individuals who *exist* in the model's population under *both* the intervention and comparator scenarios. Gains that *would* have been experienced by individuals who only exist in one scenario (especially the intervention scenario) lack moral weight.

  **The Residue Report:**

  | Aspect of Asymmetry           | Fit within Standard CEA Framework                                                                 | Category        | Reason                                                                                                                               |
  | :---------------------------- | :------------------------------------------------------------------------------------------------ | :-------------- | :----------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Harm of Creating Bad Life** | *Survives Cleanly* (Partially)                                                                      | Clean           | Adding a person with negative QALYs directly reduces total population QALYs. This aligns intuitively with "creating harm is bad."      |
  |                               | *Distorted*                                                                                       | Distortion      | Standard CEA *would* count this as a loss, but only because it adds a negative value. The *asymmetry's reason* (harming a new person) isn't captured; it's just arithmetic. |
  | **2. Neutrality of Creating Good Life** | *No Slot*                                                                                         | No Slot         | Standard additive QALY summation *forces* counting the positive QALYs of a newly created person as a gain. Denying this gain has no mechanism. |
  |                               | *Distorted*                                                                                       | Distortion      | If forced into the model, creating a happy person *must* be modeled as a QALY gain, fundamentally contradicting the asymmetry.        |
  | **3. No Duty to Create**      | *No Slot*                                                                                         | No Slot         | CEA frameworks lack a concept of "duty" or "obligation to create." The comparator is typically "status quo" or "alternative intervention," never "maximize potential lives." |
  |                               | *Survives Cleanly* (Implicitly)                                                                   | Clean (Passive) | Since CEA doesn't model creating *new* people as a gain (see #2 distortion), it *implicitly* avoids imposing a duty to create for QALY gain. But the *reason* isn't captured. |
  | **4. Person-Affecting Constraint** | *No Slot*                                                                                         | No Slot         | Standard welfarist QALY summation is *non-person-affecting* and *additive across all individuals in the scenario*. Gains/losses are counted regardless of *who* experiences them or *whether they existed* in the comparator. |
  |                               | *Distorted*                                                                                       | Distortion      | To even attempt modeling creation, you *must* assign QALYs to the new person, violating the core person-affecting principle that gains only matter for existing people under both scenarios. |
  | **"Bringing into Existence"** | *No Slot*                                                                                         | No Slot         | CEA fundamentally assumes a **fixed population** defined at the model's outset. Adding/removing people isn't a standard health state transition or QALY change *for an individual*; it changes the population structure itself. |
  | **"Baseline/Non-Existence"**  | *No Slot*                                                                                         | No Slot         | Non-existence isn't a health state (like death or perfect health). It represents the *absence of an individual*. There is no "zero QALY" state for non-existent beings to compare against. |

  **Key Insights from the Residue:**

  1.  **The Population Assumption is Fundamental:** The **fixed population requirement** of standard CEA models creates the biggest barrier. The procreation asymmetry is fundamentally about *changing the population*. CEA lacks the conceptual tools to handle this change ethically according to the asymmetry. Adding people breaks the model's core structure.
  2.  **QALY Summation is Non-Person-Affecting & Additive:** The **additive, welfarist aggregation** of QALYs across whoever is in the model directly contradicts the **person-affecting constraint**. CEA counts the QALYs of the new happy person as a gain *because it increases the sum*, irrespective of whether that person existed before or who they are. The asymmetry insists these gains *don't count* because there was no existing person deprived of them.
  3.  **Distortion is Inevitable for Good Lives:** Attempting to force the asymmetry into the framework inevitably **distorts the "neutrality of creating good lives" (#2)**. The arithmetic *demands* that adding a person with positive QALYs be counted as a gain. You simply cannot represent "creating a happy person is *not* good" within the standard QALY summation logic.
  4.  **Harm of Bad Lives Fits (Superficially):** Point #1 (**harm of bad lives**) superficially aligns because adding a negative value *looks like* harm. However, the *ethical justification* (you harmed *this specific new person*) isn't captured; it's merely an arithmetic consequence of adding a negative number to the total.
  5.  **The Asymmetry Answers a Different Question:** The procreation asymmetry addresses a **distinct ethical question**: "What are our moral obligations concerning *bringing new people into existence*?" Standard CEA answers a different question: "How can we most efficiently improve health outcomes *for a defined, existing population* given resource constraints?" The leftover residue isn't just a blind spot; it's a sign that CEA is designed for a fundamentally different problem domain – allocative efficiency within a fixed group – and doesn't possess the ethical or structural apparatus to handle questions of population creation and the moral weight of existence itself. Trying to force it leads to significant distortions (#2, #4) or concepts with no slot (#3, #5, #6).

  **Conclusion:** Very little of the core procreation asymmetry survives clean translation into standard health economics CEA. The harm of creating bad lives has a superficial arithmetic analogue, but the ethical reasoning differs. The neutrality of creating good lives and the person-affecting constraint are fundamentally incompatible with the additive, non-person-affecting, fixed-population assumptions of QALY-based CEA. The "no duty to create" lacks a slot but is passively respected only because creation isn't modeled as a gain. The residue highlights that CEA is not designed to answer questions about the morality or value of *creating new lives*; it presupposes the lives it seeks to improve already exist. The asymmetry points to an ethical domain largely outside the scope of conventional cost-effectiveness analysis focused on a fixed population.
