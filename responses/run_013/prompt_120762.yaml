     Worksheet for Group A (correlated, S then L):

          Population: 100 specimens
            - 40 with both spots and long antennae
            - 10 with spots only
            - 10 with long antennae only
            - 40 with neither

          Step 1: Update on Spotted (S)

            You receive an impression about the spots. It leaves you with a 0.6 (60%) credence that the specimen is spotted.

            Rule: Update by keeping the conditional probabilities for long antennae (L) given spotted (S) and given not spotted (not S) fixed at their prior values.

            Prior conditionals:

               P(L | S) = (number with both) / (number with S) = 40 / (40+10) = 40/50 = 0.8
               P(not L | S) = 10/50 = 0.2

               P(L | not S) = (number with antennae only) / (number without S) = 10 / (10+40) = 10/50 = 0.2
               P(not L | not S) = 40/50 = 0.8

            New marginal for S:
               P(S) = 0.6   -> P(not S) = 0.4

            Then the new joint probabilities:

               P(S and L) = P(L|S) * P(S) = 0.8 * 0.6 = 0.48
               P(S and not L) = P(not L|S) * P(S) = 0.2 * 0.6 = 0.12
               P(not S and L) = P(L|not S) * P(not S) = 0.2 * 0.4 = 0.08
               P(not S and not L) = P(not L|not S) * P(not S) = 0.8 * 0.4 = 0.32

            Check: these add to 1.

          Step 2: Update on Long antennae (L)

            You receive an impression about the antennae. It leaves you with a 0.8 (80%) credence that the specimen has long antennae.

            Rule: Update by keeping the conditional probabilities for spotted (S) given long antennae (L) and given not long antennae (not L) fixed at their values from the current distribution (the one we just computed in Step 1).

            Current distribution:

               P(S and L) = 0.48
               P(S and not L) = 0.12
               P(not S and L) = 0.08
               P(not S and not L) = 0.32

            Compute current marginals for L:

               P(L) = P(S and L) + P(not S and L) = 0.48 + 0.08 = 0.56
               P(not L) = 0.12 + 0.32 = 0.44

            Current conditionals:

               P(S | L) = P(S and L) / P(L) = 0.48 / 0.56 = 48/56 = 6/7 ≈ 0.8571
               P(not S | L) = 0.08 / 0.56 = 8/56 = 1/7 ≈ 0.1429

               P(S | not L) = P(S and not L) / P(not L) = 0.12 / 0.44 = 12/44 = 3/11 ≈ 0.2727
               P(not S | not L) = 0.32 / 0.44 = 32/44 = 8/11 ≈ 0.7273

            New marginal for L:
               P(L) = 0.8   -> P(not L) = 0.2

            Then the new joint probabilities:

               P(S and L) = P(S|L) * P(L) = (6/7) * 0.8 = 48/70 = 24/35 ≈ 0.6857
               P(not S and L) = P(not S|L) * P(L) = (1/7)*0.8 = 8/70 = 4/35 ≈ 0.1143
               P(S and not L) = P(S|not L) * P(not L) = (3/11)*0.2 = 6/110 = 3/55 ≈ 0.0545
               P(not S and not L) = P(not S|not L) * P(not L) = (8/11)*0.2 = 16/110 = 8/55 ≈ 0.1455

            Your final probability that the specimen has both features (S and L) is 24/35 ≈ 0.6857 (or about 0.69).

          Write this number on the whiteboard.

     Similarly, we do for Group B (correlated, L then S) and for the uncorrelated in both orders.

     Due to the length, we'll stop here and assume the uncorrelated worksheets are similar.

