  ### Session Design: "The Order of Evidence"  
  *Goal: Experience how the order of ambiguous evidence shifts beliefs when features are correlated, via Jeffrey conditionalization.*

  ---

  ### **Brainstormed Structures**  
  1. **Parallel Team Relay**  
     - Two teams (A and B) receive evidence in opposite orders. Each uses index cards to model the population. Teams calculate step-by-step belief updates, then compare final probabilities at the whiteboard.  
     *Pros:* Tactile, emphasizes group calculation. *Cons:* Risk of arithmetic errors slowing progress.  

  2. **Witness Testimony Roleplay**  
     - Participants play "scientists" reporting ambiguous observations (e.g., "I’m 60% sure it’s spotted”). Teams update beliefs using worksheets.  
     *Pros:* Immersive. *Cons:* May distract from probability mechanics.  

  3. **Hybrid Calculation Game**  
     - Teams use index cards to represent population subsets, but calculate updates on worksheets. Combines physical intuition with structured math.  
     *Pros:* Balances engagement and precision. *Cons:* Setup complexity.  

  **Chosen Structure: Hybrid Calculation Game**  
  *Why:* Maximizes intuition (physical cards) and clarity (guided worksheets), fitting the time constraint.  

  ---

  ### **Final Session Design**  
  **Materials per Team**  
  - 100 index cards (marked: 40 "both," 40 "neither," 10 "spots only," 10 "antennae only" for correlated case; 25 of each for uncorrelated).  
  - 2 envelopes (one labeled "SPOTS," one "ANTENNAE").  
  - Worksheets (step-by-step instructions).  
  - Whiteboard (for results).  

  **Groups**  
  - **Team A (7 people):** Evidence order = Spots → Antennae.  
  - **Team B (7 people):** Evidence order = Antennae → Spots.  

  **Timeline (75 min)**  
  1. **Intro (5 min):**  
     - *Say:* "Today, we’re detectives. A random specimen has two traits: spots (S) and long antennae (L). You’ll get two ambiguous reports. Your job: track how your belief changes."  
     - *State Goal:* "Don’t trust me—let the rules show you."  

  2. **Correlated Case (35 min):**  
     - *Distribute:* Correlated cards (40 both, 40 neither, 10 spots, 10 antennae).  
     - *Activity:*  
       - Teams arrange cards in a grid (rows: S/not S; columns: L/not L). Count totals—see correlation (most cards are "both" or "neither").  
       - **Team A:** Receives "SPOTS" envelope first. Inside: "Credence for S = 0.6".  
       - **Team B:** Receives "ANTENNAE" envelope first. Inside: "Credence for L = 0.8".  
       - Teams update beliefs using worksheets (see *Facilitator’s Sheet* below).  
       - *Critical Step:* After first update, they recompute conditionals **from the new distribution** for the second update.  
       - *Output:* Final P(both) written on whiteboard.  
     - *Expected Result:*  
       - Team A (S→L): P(both) ≈ 0.69.  
       - Team B (L→S): P(both) ≈ 0.57.  

  3. **Uncorrelated Case (20 min):**  
     - *Distribute:* Uncorrelated cards (25 of each type).  
     - *Repeat:* Same envelopes/updates.  
     - *Output:* Both teams get P(both) = 0.48.  
     - *Reveal:* Order doesn’t matter here.  

  4. **Debrief (15 min):**  
     - *Whiteboard Results:*  
       ```
       Correlated: A=0.69, B=0.57 → Gap!  
       Uncorrelated: A=B=0.48 → No gap.  
       ```  
     - *Map to Machinery:*  
       - **Partition:** We updated one trait at a time (S or L first).  
       - **Fixed Conditionals:** Kept P(L|S), P(S|L) etc. fixed *within* each update (Jeffrey’s rule).  
       - **Why Order Mattered (Correlated):** After updating S first, P(L|S) changed from 0.8 to ~0.86. Reversing order, P(S|L) changed from 0.8 to ~0.94.  
       - **Jeffrey vs. Bayes:** Ordinary conditioning (e.g., "I saw spots") has no order effect—but we had soft evidence ("I’m 60% sure").  
       - **Philosophical Sting:** Some argue Jeffrey’s rule isn’t "rational learning" because order dependence suggests the evidence description is incomplete. A richer observation (e.g., "I saw a blue mark") would commute.  
     - *Honest Gaps:*  
       - The activity assumes fixed conditionals—but real evidence might alter dependencies.  
       - Theorem: Updates commute iff traits are independent (as in uncorrelated case).  
     - *Predictable Objections & Responses:*  
       - **"One order must be wrong!"** → "Both are valid. The rule reacts to sequence, like seeing a blurry photo before/after a witness."  
       - **"Why not average the updates?"** → "Jeffrey’s rule minimizes belief revision. Averaging isn’t derived from principles."  
       - **Fumble Point:** Teams may reuse *prior* conditionals for the second update. *Catch it:* Remind them to recalculate conditionals after step 1.  

  ---

  ### **Facilitator’s Sheet**  
  **Correlated Case (Team A: Spots → Antennae)**  
  1. **Prior Distribution (100 cards):**  
     - S and L: 40  
     - S only: 10  
     - L only: 10  
     - Neither: 40  

  2. **Update 1: Spots (S) to P(S) = 0.6**  
     - Prior conditionals (fixed for this step):  
       - P(L|S) = 40/50 = 0.8  
       - P(not L|S) = 10/50 = 0.2  
       - P(L|not S) = 10/50 = 0.2  
       - P(not L|not S) = 40/50 = 0.8  
     - New joint probabilities:  
       - P(S and L) = 0.8 × 0.6 = 0.48  
       - P(S and not L) = 0.2 × 0.6 = 0.12  
       - P(not S and L) = 0.2 × 0.4 = 0.08  
       - P(not S and not L) = 0.8 × 0.4 = 0.32  

  3. **Update 2: Antennae (L) to P(L) = 0.8**  
     - Current conditionals (recompute from step 1!):  
       - P(S|L) = 0.48 / (0.48+0.08) = 0.48/0.56 ≈ 0.857  
       - P(not S|L) = 0.08/0.56 ≈ 0.143  
       - P(S|not L) = 0.12 / (0.12+0.32) = 0.12/0.44 ≈ 0.273  
       - P(not S|not L) = 0.32/0.44 ≈ 0.727  
     - Final joint probabilities:  
       - P(S and L) = 0.857 × 0.8 ≈ 0.69  

  **Uncorrelated Case (Simpler—order won’t matter)**  
  - Prior: 25 of each type.  
  - Updates yield P(both) = 0.48 regardless of order.  

  **Key Script Notes**  
  - *Start:* "The cards are your population. The envelopes are ambiguous clues."  
  - *During:* "Don’t rush—recompute conditionals after each update."  
  - *Debrief:* "Order matters when traits are linked. But is this how we *should* update beliefs?"  

  ---  
  This design ensures the phenomenon emerges from gameplay, with the debrief linking intuition to formalism. Run it tight—watch the clock when teams calculate!
