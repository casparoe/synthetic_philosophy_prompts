            P_new(S and not L) = 0.5 * 0.6 = 0.3
            P_new(not S and L) = 0.5 * 0.4 = 0.2
            P_new(not S and not L) = 0.5 * 0.4 = 0.2

          P_new(L) = 0.3 + 0.2 = 0.5

     Step 2: Update L to 0.8.

          Current distribution: 
            P_new(L) = 0.5, so P_new(not L)=0.5.

          Conditionals in the current distribution:
            P_new(S | L) = P_new(S and L)/P_new(L) = 0.3/0.5 = 0.6
            P_new(not S | L) = 0.2/0.5 = 0.4

            P_new(S | not L) = 0.3/0.5 = 0.6
            P_new(not S | not L) = 0.2/0.5 = 0.4

          Now update L to 0.8 (so P_final(L)=0.8, P_final(not L)=0.2):

            P_final(S and L) = P_new(S|L) * 0.8 = 0.6 * 0.8 = 0.48
            P_final(not S and L) = 0.4 * 0.8 = 0.32
            P_final(S and not L) = P_new(S|not L) * 0.2 = 0.6 * 0.2 = 0.12
            P_final(not S and not L) = 0.4 * 0.2 = 0.08

          P_final(S and L) = 0.48.

