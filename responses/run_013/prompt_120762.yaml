            P_new(not S and L) = 0.5 * 0.8 = 0.4
            P_new(S and not L) = 0.5 * 0.2 = 0.1
            P_new(not S and not L) = 0.5 * 0.2 = 0.1

          P_new(S) = 0.4 + 0.1 = 0.5

     Step 2: Update S to 0.6.

          Conditionals in the current distribution:
            P_new(L|S) = P_new(S and L)/P_new(S) = 0.4/0.5 = 0.8
            P_new(not L|S) = 0.1/0.5 = 0.2

            P_new(L|not S) = 0.4/0.5 = 0.8
            P_new(not L|not S) = 0.1/0.5 = 0.2

          Now update S to 0.6:
            P_final(S and L) = P_new(L|S) * 0.6 = 0.8 * 0.6 = 0.48
            ... same as above.

     So in the uncorrelated case, both orders yield 0.48.

