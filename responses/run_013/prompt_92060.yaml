prompt: |-
  I am a retired field ecologist — thirty-five years on fisheries and coastal ecosystems, now four years into a late and entirely self-taught education in moral philosophy — and for the past year I have chaired the ethics advisory committee of a modest grant-making foundation. The committee's unexpected and increasingly frequent chore is to vet what the foundation's small matching service calls moral trades: arrangements in which two people who disagree about what matters each agree to do something the other wants, so that each ends up with more of what he or she values, measured by his or her own lights, even though each must thereby do something he or she thinks should not be done, or at least should not be done by them. I understand the general shape of the proposal and I am persuaded it is not nonsense; what I lack is anything I can hand to five non-philosophers — a lawyer, a retired economist, a trustee, a local physician, and me — so that we reach defensible answers within the ten days we allow ourselves and can write those answers down for applicants who will be angry with us. We see two or three proposals a month, from individuals and from small organisations, our decisions go into a public log, we have no power to enforce anything (we either list a trade on the service or decline to list it), and one trustee's standing worry, which I share, is that by listing a trade the foundation becomes a party to it.

  Please write the procedure. I want it as a sequence of questions to be asked in order, each with a statement of what counts as a sufficient answer, where the sequence stops with a no, where it stops with a yes plus conditions the parties must accept, where it must be handed to a human being because what remains is a question of value and not of fact, and a short closing section on what the procedure cannot do at all. Please keep in view the distinctions I suspect do the real work and that we are most likely to flatten: between a party doing something they take to be wrong and a party procuring someone else to do it, since the second may be barred by their own view even where the first is not; between a trade that genuinely improves each party's position by their own valuation and one that merely looks symmetrical in dollars; between a moral view that can license trading at all and one whose constraints forbid acting against a first-order judgment whatever the gain, so that for such a party there is nothing to trade; between a trade that touches no one outside it and one that uses other people, or the public, as its material; and between a trade that is merely distasteful to me and one that is wrong. I do not want citations, a reading list, or the names of articles — the committee will not read them and I cannot verify them. I want any technical term you introduce defined in a sentence that the physician and the trustee can both use. Be explicit about which parts of the underlying theory must survive translation into a checklist and which can be dropped without loss, and about where the procedure will misfire and a person will have to decide.

  Then run the procedure on three proposals, showing your work question by question, and tell me plainly where it returns an answer I will not like. First: two donors, one who ranks global-health charities far above animal-welfare charities and one who ranks them the other way, each pledging five thousand dollars to the other's preferred organisation, money they would otherwise have given to their own. Second: a doctoral student who believes animal experimentation is wrong proposes to take over her department's teaching and the laboratory's tedious data work if a postdoc takes her share of the animal work; the postdoc is willing and her supervisor says the arrangement would suit the lab. Third: a committed vegan, who believes eating meat is a serious wrong, offers to eat a steak at a public dinner in exchange for a wealthy acquaintance's five-year gift to an animal sanctuary; the acquaintance regards the whole fuss about animals as sentimentality and would enjoy the spectacle. I would have guessed that the second is plainly acceptable and the third plainly not, and I am asking in part to learn whether the procedure agrees with me. Finally, say how confident you are in the claims you make and single out the one point in the procedure about which you are least sure.
reasoning: |-
  Okay, the user is a retired field ecologist who now chairs an ethics advisory committee for a grant-making foundation. They deal with "moral trades" where two parties with conflicting values agree to help each other get what they want, even if it means doing something they believe is wrong. The committee needs a clear, step-by-step procedure to evaluate these trades quickly, without getting bogged down in philosophical debates. 

  The user’s background in ecology and self-taught philosophy suggests they value practicality but also depth. They’re clearly frustrated by the ambiguity of their current process and want something actionable for their diverse committee (a lawyer, economist, trustee, physician, and themselves). Their hidden needs include:  
  - **Legitimacy**: They want defensible decisions that hold up to public scrutiny (decisions go into a public log).  
  - **Speed**: They have 10-day turnarounds and need to avoid analysis paralysis.  
  - **Risk Mitigation**: They’re wary of the foundation becoming "a party to" unethical acts by listing trades.  
  - **Clarity**: They emphasize key distinctions (e.g., doing vs. procuring wrong, genuine value gain vs. dollar symmetry).  

  The proposed procedure must filter out trades that:  
  1. Exploit third parties or the public.  
  2. Involve parties whose values forbid *any* compromise (no "tradable" positions).  
  3. Merely disguise coercion or irrationality as mutual benefit.  

  For the three test cases:  
  - **Charity Swap**: Likely passes—no third-party harm, mutual gain by each party’s metrics.  
  - **Lab Trade**: Tricky. The student avoids direct harm (procures via postdoc) but might violate her own principles if her ethics forbid *enabling* harm. Needs human judgment.  
  - **Vegan Steak**: Probably fails. It turns a moral wrong into public spectacle (using the act as "material"), and the vegan’s gain (sanctuary funding) might not offset the foundational harm in their own framework.  

  My least confident point: **Step 4** (Does the trade use external parties as material?). Real-world trades often have ripple effects. Example: The lab trade normalizes animal testing, indirectly affecting public perception. But policing this could overreach. The procedure must balance rigor with feasibility.  

  Key trade-offs:  
  - Dropping nuanced philosophy (e.g., Kantian vs. consequentialist licenses for trading) for binary checkpoints.  
  - Accepting that some "no" decisions will anger applicants—unavoidable given the constraints.  

  The user’s intuition (lab=yes, vegan=no) mostly aligns, but the lab case’s "procurement" issue could force a "no" if the student’s ethics rigidly oppose complicity. The procedure exposes that tension rather than resolving it—which is exactly what the user needs to handle contentious cases transparently.
answer: |-
  Below is a step-by-step procedure for evaluating "moral trades," designed for efficiency, defensibility, and alignment with your committee's constraints. It prioritizes your key distinctions and stops early at clear "no" answers. **Bold terms** are defined inline where first used.

  ---

  ### **Moral Trade Evaluation Procedure**  
  *(To be applied in sequence; stop at first "no" or "conditional yes")*

  1. **VOLUNTARINESS**  
     *Question:* Are both parties entering the trade freely, without coercion, fraud, or impaired judgment?  
     *Sufficient answer:* Unambiguous evidence of informed, competent consent from both parties (e.g., written agreement).  
     *Stop if:* "No" → **Reject trade**.  
     *Why:* Coerced/defrauded parties cannot genuinely benefit.

  2. **PARTY-SPECIFIC WRONG**  
     *Question:* Does either party believe *their own action* in the trade violates a core moral constraint *that applies specifically to them*?  
     - **Core moral constraint**: A rule the party believes must never be broken, regardless of consequences.  
     *Sufficient answer:* "No" from both parties OR evidence their moral framework permits exceptions for greater good.  
     *Stop if:* "Yes" for either party → **Reject trade**.  
     *Why:* If a party believes their act is fundamentally wrong (e.g., "murder is always wrong, even to save lives"), they cannot rationally benefit.

  3. **PROCUREMENT VS. ACTION**  
     *Question:* Does either party believe *enabling the other’s act* (procuring) is wrong, even if *doing it themselves* might be permissible?  
     *Sufficient answer:* "No" OR their moral framework does not distinguish procuring from acting.  
     *Stop if:* "Yes" for either party → **Reject trade**.  
     *Why:* Some views forbid complicity (e.g., "paying for an abortion is wrong, even if I wouldn’t perform one").

  4. **EXTERNAL MATERIALITY**  
     *Question:* Does the trade use non-consenting third parties, public resources, or shared ecosystems as its *material* (i.e., tools or targets)?  
     - **Material**: The trade’s mechanism directly exploits or impacts them.  
     *Sufficient answer:* "No" OR impacts are trivial/incidental (e.g., using public roads to deliver goods).  
     *Stop if:* "Yes" → **Reject trade**.  
     *Why:* Trades cannot ethically sacrifice outsiders without consent.

  5. **GENUINE GAIN (NON-MONETARY)**  
     *Question:* Does each party gain something *they subjectively value* beyond money, and is this gain impossible without the trade?  
     *Sufficient answer:* Clear statement from each party quantifying non-monetary gain (e.g., "I value saving 100 dogs more than $5,000").  
     *Stop if:* Gains are symmetrical *only* in money → **Reject trade**.  
     *Why:* Money alone cannot measure moral value; trades must reflect personal utility.

  6. **HUMAN JUDGMENT: NET POSITION IMPROVEMENT**  
     *Question:* After Steps 1–5, does the trade leave each party *net better off* by their own moral calculus?  
     - **Net better off**: The benefit outweighs the cost of acting against their judgment.  
     *Sufficient answer:* Committee assessment of party statements. Requires human deliberation.  
     *Outcomes:*  
     - "Unclear" → **Reject trade**.  
     - "Yes" → **Approve with conditions** (e.g., "Parties must affirm net gain in writing").  
     - "No" → **Reject trade**.  
     *Why:* Ensures trades aren’t merely symbolic; parties must credibly prefer the outcome.

  ---

  ### **What the Procedure Cannot Do**  
  - Resolve deep moral disagreements (e.g., "Is eating meat evil?").  
  - Guarantee parties won’t regret trades later.  
  - Assess subjective "distaste" (reject only objective wrongs per Steps 2–4).  
  - Enforce compliance (rely on voluntariness).  

  ---

  ### **Application to Test Cases**  
  *Key Distinctions Applied:*  
  - **Doing vs. Procuring**: Is complicity forbidden?  
  - **Gain vs. Symmetry**: Is value beyond money realized?  
  - **Materiality**: Are outsiders exploited?  

  #### **Case 1: Charity Swap**  
  1. **Voluntariness**: Yes (pledges are free).  
  2. **Party-Specific Wrong**: Donor A gives to animals but doesn’t think it’s *wrong*—just less effective. Similarly for Donor B. → **No barrier**.  
  3. **Procurement vs. Action**: No procurement (each donates directly). → **No barrier**.  
  4. **External Materiality**: No third parties used as material. → **No barrier**.  
  5. **Genuine Gain**: Each gains more "moral units" (e.g., Donor A values $5k to health >> $5k to animals). → **Pass**.  
  6. **Net Improvement**: Clearly net positive for both. → **APPROVE**.  
  *Your intuition aligned: Acceptable.*  

  #### **Case 2: Lab Trade**  
  1. **Voluntariness**: Yes (all consent).  
  2. **Party-Specific Wrong**: Student believes *performing* animal work is wrong. But she avoids doing it. → **No barrier** (she acts ethically by her view if avoiding harm).  
  3. **Procurement vs. Action**: **Critical point**. If student believes *enabling* animal testing (via trading) is wrong, trade fails. Committee must assess her stance:  
     - If she condemns complicity (e.g., "arranging harm is as bad as doing it"), → **Reject**.  
     - If she only objects to *personal* involvement, → **Proceed**.  
  4. **External Materiality**: Animals are non-consenting material. → **REJECT** (fails Step 4).  
  *But wait*: If animals are already part of lab operations (not *added* for trade), impact may be incidental. Committee judgment: Does the trade *use* animals as tools? Likely yes—trade relies on their exploitation. → **REJECT**.  
  *Your intuition challenged: Unacceptable due to external materiality.*  

  #### **Case 3: Vegan Steak**  
  1. **Voluntariness**: Yes.  
  2. **Party-Specific Wrong**: Vegan believes *eating meat* is a core wrong → **Fails Step 2** (she violates her constraint).  
     - *Unless*: Her framework allows exceptions (e.g., "if it saves 100 cows"). But she calls it a "serious wrong," suggesting inflexibility. → **REJECT**.  
  3. *If Step 2 passed*:  
     - **Procurement**: Acquaintance isn’t procuring harm; vegan acts directly.  
     - **Materiality**: Public is audience, not material → No issue.  
     - **Gain**: Vegan values sanctuary >> steak; acquaintance values spectacle >> money. → Pass.  
     - **Net Improvement**: Plausible, but irrelevant after Step 2 rejection.  
  *Your intuition aligned: Unacceptable.*  

  ---

  ### **Confidence and Uncertainties**  
  - **Overall Confidence**: 90%. The procedure filters clear harms (Steps 2–4) and ensures mutual benefit (Steps 5–6).  
  - **Least Confident Point**: **Step 4 (External Materiality)**. When does a trade "use" outsiders? Lab animals in Case 2 exemplify the ambiguity: Is leveraging *existing* exploitation "using" them? I lean "yes," but committees might inconsistently interpret "incidental" impacts.  
  - **What Might Annoy You**: Case 2’s rejection. Ecologists often accept pragmatic compromises in systems (e.g., trading lab duties). But the procedure prioritizes moral absolutism in materiality—*if outsiders are tools, reject*.  

  **Recommendation**: For contentious cases (e.g., Case 2), default to Step 4 rejection unless parties prove no *new* harm to outsiders. This aligns with your trustee’s worry about foundation complicity.
