prompt: |-
  My reading group has a guy who keeps saying that epistemic utility theory is just decision theory in a different costume, and I can't tell if he's right or if it's a bit he does. His story goes: a credence function is an act, a possible world is a state of nature, accuracy is the payoff, and "maximize expected accuracy" is "maximize expected utility" with truth playing the role of money. Once you see that, he says, the accuracy-first project adds nothing — epistemic rationality just is practical rationality pointed at truth, there's no seperate thing for it to explain, and the arguments for probabilism and for conditioning on your evidence are the argument you already had in decision theory with the labels swapped. His kicker is that the analogy also shows the whole thing is empty: expected accuracy gets computed with your own credences, so every credence function scores itself best, which means the framework can never tell anyone to change their mind — and he thinks that's not a bug waiting to be patched, it's the game.

  I want an audit, not a verdict from on high. Lay out the correspondence explicitly — what maps onto the act, the state, the outcome, the utility function, the dominance principle, the Dutch book, the option of not playing — then tell me which parts of that mapping are actually load-bearing for the arguments accuracy-first people run and which are just decorative. Then the places it breaks, but ranked: which disanalogies matter for his conclusion and which are the kind of wrinkle decision theory has anyway. I especially want the ones that matter. I have a hunch the act/credence slot is doing something sneaky, since you can decline to bet but you can't decline to have credences, and the "states" here don't look independent of the thing being evaluated the way they are in a normal decision problem. And a smaller thing that nags me: in decision theory the utility function is the agent's, it's about what she wants, whereas accuracy isn't something you want so much as something you're scored on — the payoff isn't inside the agent at all, and I don't know what that does to the mapping.

  Then tell me what the analogy smuggles in that decision theory has and credences don't, or the reverse, and finally whether his conclusion survives — both halves, the "adds nothing" and the "empty" — once the breaks are on the table. If a better analogy is available, say what it is and what it fixes; if the honest answer is that his analogy is fine and only the conclusion is wrong, say that. No reading list, I just want the argument.

  Format it as: "The mapping" — a correspondence table, plus a sentence per row wherever the row is contested, ~300 words; "Load-bearing or decorative" ~200; "Where it breaks, ranked" — the ones that matter first, ~500; "What it smuggles in" ~200; "Does his conclusion survive" ~250; "A better analogy" ~150. If a section comes out empty, say so and why.
reasoning: |-
  Hmm, the user is in a reading group with someone who claims epistemic utility theory is just decision theory with different labels, arguing that it adds nothing new and is fundamentally empty. The user wants a detailed audit of this analogy to understand where it holds and where it breaks, specifically focusing on the mapping between concepts, which parts are essential, and how disanalogies affect the claims.

  The user has provided a clear structure for the response: mapping, load-bearing vs decorative, ranked disanalogies, what's smuggled in, whether the conclusion survives, and a better analogy. They have specific concerns about the act/credence slot (can't decline credences) and the utility function (accuracy being external rather than internal desire).

  The core analogy maps credence functions to acts, possible worlds to states, accuracy to utility payoff, and maximizing expected accuracy to maximizing expected utility. This correspondence is foundational for arguments like proving probabilism through dominance or Dutch books, similar to decision theory's coherence arguments.

  The key disanalogies that matter most are:  
  1. **Mandatory Participation**: Unlike decision theory where you can opt out of bets, having credences is unavoidable. This makes epistemic norms categorical rather than hypothetical, undermining the "empty" criticism since you can't avoid playing the game.  
  2. **Utility Source**: Accuracy measures are external (truth-linked) and normative, not based on personal desires like in decision theory. This introduces an objective standard that isn't agent-relative.  
  3. **Self-Evaluation Trap**: While every credence function scores itself best in expectation, real epistemic improvement requires using a better scoring rule or external standard—similar to how decision theory handles inconsistent preferences.  

  Less critical disanalogies include the nature of states (possible worlds aren't independent of credences) and risk attitudes (epistemic utility assumes risk neutrality, which is built into scoring rules like Brier score).  

  The analogy "smuggles in" decision theory's coherence norms (like Dutch books representing inconsistency) but also sneaks in objective accuracy standards that don't exist in subjective decision theory.  

  The critic's conclusions don't survive:  
  - "Adds nothing" is false because epistemic utility theory provides a truth-linked justification for norms, unlike pragmatic decision theory.  
  - "Empty" fails because mandatory participation and external standards prevent self-justification from being the end of the story—dominance arguments still condemn incoherent credences.  

  A better analogy is a mandatory exam with predefined scoring: you can't opt out (mandatory participation), the grading rubric is fixed (external utility), and while you might think your answers are perfect, the rubric reveals errors (external evaluation). This fixes the voluntary participation gap and highlights the objective standard.
answer: |-
  ### The Mapping
  | Decision Theory Concept       | Epistemic Utility Theory (EUT) Analog | Contested? |
  |-------------------------------|---------------------------------------|------------|
  | **Act**                       | Credence function (belief state)     | Yes: Acts are chosen; credences are often involuntary. |
  | **State of Nature**           | Possible world (way reality could be) | Partially: States in DT are independent; possible worlds embed truth conditions for the credence itself. |
  | **Outcome**                   | Accuracy score (e.g., Brier score)    | Yes: Outcomes in DT are experienced; accuracy is "scored" externally. |
  | **Utility Function**          | Accuracy Measure (e.g., quadratic loss) | **Hotly contested**: Utility reflects agent’s desires; accuracy is a normative, truth-linked standard imposed externally. |
  | **Dominance Principle**       | Strict Dominance (used for probabilism) | No: Direct analog, but justification differs (truth-connection vs. preference). |
  | **Dutch Book**                | Dutch Book Argument (incoherence)    | Superficial: Both show vulnerability to loss, but EUT Dutch books are "accuracy thefts" without money. |
  | **Maximize Expected Utility** | Maximize Expected Accuracy            | Yes: EUT uses *current credences* to compute expectation, risking self-justification loops. |
  | **Option to Not Play**        | No analog                            | **Critical gap**: DT allows abstention; EUT assumes credences are inescapable. |

  ---

  ### Load-Bearing or Decorative
  - **Load-bearing**: The **utility → accuracy** mapping is foundational. It allows dominance/Dutch book arguments to transfer: incoherent credences are "accuracy-dominated" or vulnerable to "accuracy penalties." The **act → credence** link enables treating belief states as choices to evaluate.  
  - **Decorative**: The **state → world** mapping is mostly structural. **Dutch books** are illustrative but not essential—EUT can run dominance arguments without them. The **expected accuracy maximization** framework is load-bearing for *internal* rationality but decorative for *external* critiques (e.g., why care about accuracy?).  

  ---

  ### Where It Breaks, Ranked  
  *(Most damaging first)*  
  1. **Mandatory Participation (Breaks "Empty" Claim)**  
     In DT, you avoid Dutch books by not betting. In EUT, you *cannot abstain from having credences*. This makes epistemic rationality **categorical**: you’re stuck in the "game," so dominance arguments *force* coherence (probabilism) even if all credences self-endorse. The self-evaluation "trap" isn’t fatal—it’s why EUT needs *dominance* (not self-score) to condemn incoherence.  

  2. **Utility ≠ Agent’s Desire (Breaks "Adds Nothing" Claim)**  
     DT utilities are subjective preferences. EUT accuracy is **objective and normative**: it’s not "what you want" but "how truth-tracking you are," defined by scoring rules (e.g., strictly proper scores). This smuggles in a truth-aim that DT doesn’t have. If epistemic rationality were *just* practical rationality, truth-seeking would reduce to personal preference—but EUT posits accuracy as a universal epistemic good.  

  3. **Self-Evaluation Loop (Partial Break)**  
     Yes, every credence maximizes *its own* expected accuracy—but this is **true in DT too** (e.g., an agent with inconsistent preferences can "self-endorse"). EUT avoids emptiness by:  
     - Using **dominance**: If credence *A* is more accurate than *B* in *all worlds*, *B* is irrational even if it self-scores highly.  
     - Invoking **strict propriety**: Proper scoring rules ensure only *probabilistic* credences avoid being accuracy-dominated.  
     This isn’t a break unique to EUT; it mirrors how DT handles incoherent preferences.  

  4. **States Aren’t Independent (Minor Break)**  
     In DT, states are exogenous (e.g., rain isn’t affected by your umbrella act). In EUT, "worlds" define truth-values for propositions *you’re credencing*, so the "state" depends on the object of evaluation. This complicates but doesn’t collapse arguments—treating worlds as fixed resolves it.  

  ---

  ### What It Smuggles In  
  - **From DT**: Coherence norms (avoiding dominance, Dutch books) and the expectation-maximization structure. This makes EUT *look* like repackaged DT.  
  - **From EUT**: An **objective standard of value** (accuracy) and **mandatory epistemic ends**. DT is value-relative: you can prefer false beliefs. EUT assumes all agents *should* care about accuracy—a normative commitment DT doesn’t enforce.  

  ---

  ### Does His Conclusion Survive?  
  **"Adds nothing"**: **No.** EUT isn’t just relabeled DT because:  
  - It grounds norms in **accuracy** (truth-connection), not arbitrary preferences. This explains *why* coherence matters epistemically (e.g., incoherent credences *necessarily* misfire re: truth).  
  - It generates **new justifications**: Strictly proper scoring rules yield gradational accuracy arguments for probabilism/conditioning, distinct from pragmatic Dutch books.  

  **"Empty"**: **No.** Mandatory participation and dominance prevent emptiness:  
  - You can’t "opt out," so dominance arguments apply universally.  
  - Self-scoring isn’t the test; *dominance* is. Non-probabilistic credences are accuracy-dominated—they lose to alternatives *no matter the world*—so self-endorsement is irrelevant.  

  ---

  ### A Better Analogy  
  **EUT is like a mandatory exam with a fixed scoring rubric.**  
  - You can’t skip the exam (mandatory credences).  
  - The rubric (accuracy measure) is external and truth-linked, not your preference.  
  - You might *think* your answers are perfect (self-endorsement), but the rubric reveals objective errors (dominance).  
  This fixes the voluntary participation gap and clarifies that accuracy isn’t "your utility"—it’s the grading standard. The exam’s purpose (truth-tracking) is built-in, not negotiated.
