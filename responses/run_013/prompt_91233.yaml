answer: |-
  The sea air clung to Clara’s studio, smelling of salt and damp clay. Outside, gulls wheeled over the harbour, their cries sharp counterpoints to the silent, elongated figures only Clara perceived. To her, Mrs. Henderson wasn't just the stooped woman buying bread; she was the giggling girl skipping rope, the anxious bride, and the future widow, all stacked together like segments of a thick, living rope, each part vivid and real. Faces were merely cross-sections of that rope.

  Commissioning work was usually straightforward. People wanted "now," a slice of their rope they recognised. Clara translated, carving the dominant segment while acknowledging, in the curve of a lip or the set of a jaw, the faint echoes of past and future selves she alone saw clearly.

  Then came the Evans boy. Drowned at seventeen. The town wanted a memorial bust, bronze for the harbour wall. His parents, hollow-eyed, wanted *him at seventeen*. *That* year. *That* face.

  Clara touched the cool, grey clay on her stand. She’d known Liam Evans, seen his rope: the scraped-knee eight-year-old, the gangly thirteen-year-old, the shy sixteen-year-old starting to broaden. Seventeen was just… a segment. A foot-long section of a twenty-foot rope. To carve *only* that felt obscene, like hacking off a limb and calling it the man.

  She tried. She gathered photos – school portraits, a candid from a summer barbecue. But staring at the clay, all she saw was the incomplete strand. Her fingers refused to isolate it. The clay remained stubbornly blank, accusing. She needed the weight of the toddler, the promise of the man he’d never be, to anchor the seventeen-year-old. Without them, he wasn't *Liam*, he was a mask.

  Her frustration bled into her evenings. She sat across from her brother, Ben, at her small kitchen table. Ben, too, was a rope: the protective big brother, the reckless teenager, the struggling addict who’d stolen her savings five years ago, and the current Ben, two years sober, rebuilding. Tonight, he looked tense.

  "I saw Mrs. Evans today," Clara said, pushing peas around her plate. "She asked… again. About progress."

  Ben grunted. "Hard thing. For everyone."

  Clara put her fork down. "Ben… that money you took. Back when…"

  He flinched. "Clara, we talked about this. I paid you back every cent. Took two years, but I did."

  "It’s not the money," she said, the familiar knot tightening in her stomach. "It’s the… the *taking*. That person who did that… he needed that money for drugs. He was desperate, sick."

  Ben’s jaw tightened. "That wasn't *me*. Not the me sitting here. That was… a different part of the mess. I own it happened, but apologising for it now? It feels… hollow. Like apologising for something my twin did. I’m *sorry* it happened to you, Clara. Deeply. But the guy who *did* it? He’s gone. Dissolved."

  Clara looked at him, not just Ben-now, but Ben-then too – gaunt, shifty-eyed, vibrating with need. Both were equally present in her vision, equally real. "But it *was* you," she insisted, her voice low. "Your rope. That segment. Doesn’t… doesn’t the rope owe?"

  "Owe *what*?" Ben leaned forward, earnest. "To *whom*? If each slice is its own thing, then *this* me," he tapped his chest, "didn't steal your money. That other slice did. Should *this* me go to jail for him? Should *this* me get credit for the good things that desperate slice might have accidentally done? It’s chaos, Clara. If you hold *this* me responsible for *that* thief, then what about the promises *this* me makes? Do they bind the slice that comes tomorrow? Or next year? Who inherits the debt? Who collects the reward?" He shook his head. "We have to live *as if* we endure. Otherwise, nothing sticks. No promises, no blame, no… no anything that makes a life."

  Clara remembered the crushing weight of betrayal when the money vanished. The anger wasn't at a disconnected 'stage'; it was at Ben, her brother. The gratitude she felt now, seeing him sober, stable, was equally directed at *him*. But Ben’s logic, echoing the silent truth of her own perception, was chilling. If the thief-stage was a separate entity… did her anger belong only to the Clara-of-five-years-ago? Was her current forgiveness irrelevant? The substance of their shared life – the hurt, the repair – felt suddenly weightless, ready to blow away like sea foam.

  She avoided looking at her own long self. Glimpses were unsettling: the intense child sculptor, the hopeful young artist, the increasingly isolated woman, and ahead… strands that blurred into uncertainty, endings. Seeing it all at once made the present moment feel thin, insignificant.

  Weeks bled into the deadline. The Evanses grew anxious, then hurt. The town council sent polite reminders. Clara’s savings dwindled; the mortgage payment loomed. She spent hours staring at the lump of clay meant to be Liam-at-seventeen. She tried forcing the image – the specific curve of his jawbone at that age, the exact set of his eyes captured in a photograph. But to her, it remained a dismembered piece, devoid of the resonance that made a face a *person*. She saw the toddler’s wide eyes superimposed, the ghost of the man’s potential brow line.

  One grey afternoon, the pressure cracked. She stood before the clay, a photograph of Liam smiling pinned beside it. She saw only the fragment. She picked up her wire tool, the one used for slicing excess clay. Her hand trembled. *Cut the segment*, a voice whispered, the voice of practicality, of mortgages, of giving the grieving parents what they wanted. *It’s just a representation. A symbol.*

  Her gaze flickered involuntarily to the dusty mirror in the corner. Not her face, but the dense, complex column of Clara – past struggles, present paralysis, future fears all stacked, interwoven, inseparable. Each part felt intensely, irrevocably *her*. The child who scraped her knee learning to run, the woman betrayed by her brother, the artist facing ruin… they were all Clara. To deny any part was to deny herself.

  She couldn't carve the lie. Not for Liam, not for herself.

  Gently, she covered the untouched clay with damp cloths. She picked up the phone, her fingers cold.

  "Mrs. Evans? It's Clara. I… I can't do it. I'm so terribly sorry. I can't capture Liam… like that. Just that part. It wouldn't be him. Not to me." The silence on the other end was a physical weight. "I understand… about the commission. I forfeit it. Please… tell Mr. Evans I'm sorry."

  She hung up, the finality settling like dust. The commission fee was gone. The mortgage payment wouldn't be made. She’d have to talk to the bank, sell something, maybe take in mending. Practical, heavy costs.

  She walked to the window, looking out at the churning grey sea. Below, on the harbour wall, the empty plinth waited. She saw Liam Evans then, not as a single slice, but as the whole, brief, brilliant length of him – the toddler splashing in the shallows, the teenager diving off the pier, all moments equally real, equally gone. The ache was immense, but it felt true.

  She turned back to her studio, avoiding the mirror, and picked up a fresh lump of clay. Not for commission. Not for money. Just to feel the cool, pliant reality of it beneath her fingers, connecting her to the long, continuous rope of her own existence. The next segment began.
