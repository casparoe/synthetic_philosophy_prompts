  The key is their distinction: the statue isn't the clay or the shape, but the history of decisions that shaped it. That's the core comfort—her choices and exclusions live on. The eulogy must avoid saying she survives as matter or form, instead focusing on how her actions linger. 

  User’s metaphor is elegant: recasting with new clay by re-running decisions = same statue; keeping clay but letting it slump = statue gone. So in human terms, her essence is in the "how" of her life—not her physical body or achievements, but the unique way she made choices.

  Structure thoughts: Start warmly, acknowledge grief. Use aunt’s art process as a lens for her life. Explain her method (building, living with, breaking/recasting) simply. Then pivot to her humanity: her "sculpting" through decisions—pressing here, not there. Comfort comes from how those patterns persist in others.

  Avoid pitfalls: No mention of philosophers, books, or quotes. Keep language accessible. American English. ~5 minutes = 600-700 words. Ensure the distinction shapes the eulogy implicitly—e.g., when celebrating her legacy, frame it as "the way she chose," not what she made or left behind.

  Personal touches: "Aunt Maggie" feels intimate. Mention her hands, laughter, fierceness—humanize her. Artists will nod at her process; family will feel her presence in shared memories. Closing image: her "fingerprints" on their lives = the enduring mark of her decision-history.

  Check tone: Warm, not clinical. Grief acknowledged but not dwelled on. Uplifting ending—she lives in how we make choices now, influenced by her. No clichés like "in a better place." Honor the request by making the philosophy felt, not explained.
answer: |-
  ## For Aunt Maggie: The Shape of a Life

  Good morning. I’m so grateful to see all of you here – family who shared her blood and her laughter, artist friends who shared her passion and her studio dust. We’re here because Maggie touched us. Deeply. And the space she leaves… well, it feels impossible, doesn’t it? Like a sudden silence where there was always vibrant sound.

  Many of you knew Aunt Maggie as a sculptor. You saw her incredible focus, the way she’d wrestle with a piece. She had this fascinating process, didn’t she? She’d build something, live with it… really *live* with it. Walk past it at dawn, touch it absentmindedly while reading. And if, after that intimate conversation with the work, she decided it wasn’t true? She’d melt it down. Break it apart. Without ceremony. The material wasn’t precious; the *truth* of the thing was.

  And then, sometimes years later, she might return. Not just to the *idea*, but to the exact *sequence* of choices she’d made before. Pressing the clay *here*, not *there*. Smoothing *this* line, leaving *that* edge rough. Choosing to add weight *here*, lightness *there*. She’d follow that same path of decisions, that same history of exclusions and inclusions, step by step. And even if it was entirely new bronze, or fresh clay, something remarkable happened. It wasn’t just a copy. It felt… like the *same* piece had returned. Because it wasn't the specific bronze or clay that defined it. And it wasn't just the final shape you could trace with your finger – she knew shapes could be fleeting, accidental, like ripples on water.

  No. What made it *that* statue, uniquely itself, was the invisible map of decisions. The *how* it came to be. The pressure of her hands in a specific sequence, the choices *against* other possibilities. The history lived *in* the form, but it wasn't *the* form. It was the journey the material took under her fierce, loving attention.

  **And isn’t that the truest way to think of Maggie herself?**

  We feel the ache because the vibrant, present *she* we knew – her laugh, her sharp insights, the way she’d argue passionately about art or just fiercely defend someone she loved – that immediate presence is quiet now. We can’t hold her hand. We can’t hear her voice in the room. That specific, living form is absent, and that absence is real, and it hurts. To say she simply *is* the clay – the physical stuff – feels incomplete. It misses the spark, the life, the *her* that animated it.

  And yet… to say she’s *only* gone? That feels just as wrong. Because the *shape* of her influence remains – in the art on gallery walls, in the memories we share, in the values she instilled. But that shape alone isn't *her*. Copies exist in photos and stories, but they aren’t *her* living presence.

  So where *is* she, in this impossible space between absence and enduring presence?
  **She’s in the history. She’s in the *how*.**

  She’s in the indelible pattern of her choices. The way she pressed into life *here* – with fierce loyalty to her friends – and not *there* – refusing to tolerate injustice or pretense. The way she shaped her relationships, her art, her very days: the decisions to embrace *this* path, to exclude *that* compromise, to add warmth *here*, strength *there*, always guided by her own relentless pursuit of what felt true and real.

  That unique sequence, that map of a thousand "this, not that" moments – *that* is what made Maggie Maggie. And *that* doesn’t slump or melt away.

  We carry it. We carry *how* she loved – not just that she *did*, but the *way* she did it: directly, sometimes stubbornly, always deeply. We carry the imprint of her convictions, the echo of her creative process in how we approach our own challenges. Artists here feel it in the courage to start over, the patience to live with an idea. Family feels it in the values she modeled, the arguments she wouldn’t back down from, the laughter she insisted on finding.

  Aunt Maggie shaped her life like she shaped her art: with intention, with honesty, and with the courage to remake things when they felt false. The specific, vibrant form of her life that we held dear is no longer here with us. But the powerful, defining history of her choices – the way she pressed *here*, smoothed *there*, excluded *this*, embraced *that* – that pattern, that energy, that *how*... that lives on.

  It lives on in the way we remember her. It lives on in the way her choices continue to shape ours. It lives on in the enduring truth she sculpted, not just in bronze and clay, but in the very substance of our lives. That map she made? We’re still walking it, guided by her hand. And in that, Maggie is profoundly, comfortingly present. Thank you.
