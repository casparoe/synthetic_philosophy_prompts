  **Exam Question: The Löbian Obstacle**

  Consider a rational agent that uses a formal proof system T, which extends Peano Arithmetic (PA). The agent operates by taking an action only when it has a T-proof that the action clears a specified expected-utility threshold. The agent must also reason about its own future actions — for precommitment, cooperation with a copy of itself, or to certify a successor agent it builds.

  (a) Show that if T is extended by adopting the schema "if T proves φ, then φ" (either as an axiom or as an inference rule), then T becomes inconsistent. Your derivation should explicitly invoke Löb's theorem and state precisely where it is used.

  (b) Explain why the Löbian obstacle described in part (a) is not merely a restatement of Gödel's second incompleteness theorem, and also why it is not primarily about the agent's ignorance of its own source code.

  (c) Discuss the implications of this obstacle for an agent that must predict its own behavior. In particular, explain why an agent (the builder) cannot use T to prove the soundness (i.e., that it only proves true sentences) of a successor agent that is at least as strong as the builder.

  (d) Assess two candidate repairs for the Löbian obstacle:
     (i) One that fails outright (e.g., having the agent use a weaker system for its reasoning about itself).
     (ii) One that merely relocates the problem (e.g., having the agent use a hierarchy of systems).

     Then, briefly state what any genuine fix must accomplish.

  ---

  **Model Answer (approx 700 words):**

  **(a)** Löb's theorem states that for any formula φ in the language of T, if T proves that "if T proves φ then φ" (i.e., T ⊢ Prov_T(⌜φ⌝) → φ), then T proves φ (i.e., T ⊢ φ). Now, suppose we extend T by adding the schema "if T proves φ, then φ" as an axiom for every φ. Consider the specific case where φ is a contradiction, say ⊥. Then we have the axiom: Prov_T(⌜⊥⌝) → ⊥. But note that by the Hilbert-Bernays conditions, T can prove that Prov_T(⌜⊥⌝) is equivalent to the inconsistency of T. So we have an axiom that says: if T is inconsistent, then ⊥. But this is equivalent to ¬Prov_T(⌜⊥⌝), which is the consistency statement for T (Con(T)). However, we have added this as an axiom. But by Löb's theorem, if T proves Prov_T(⌜⊥⌝) → ⊥, then T proves ⊥. But we have added this axiom, so T extended by the schema proves ⊥. Hence, the system becomes inconsistent. Alternatively, we can see that by adding the reflection schema we can prove Con(T) (as above), and then by Gödel's second incompleteness theorem, T would become inconsistent. However, the direct use of Löb's theorem is as follows: assume T + reflection. Then for any φ, we have Prov_T(⌜φ⌝) → φ. In particular, take φ = ⊥: then we have Prov_T(⌜⊥⌝) → ⊥, i.e., Con(T). Now, by Löb's theorem, since we have a proof of Con(T) (by the new axiom), then T (with the new axiom) proves ⊥. Thus, inconsistency.

  **(b)** The Löbian obstacle is distinct from Gödel's second incompleteness theorem. The second incompleteness theorem states that a consistent theory T cannot prove its own consistency. The Löbian obstacle, on the other hand, shows that if an agent naively adopts a self-trust principle (reflection) then it becomes inconsistent. This is a stronger result because it says that having the agent trust all of its own proofs leads to inconsistency, not just that it cannot trust its own consistency. The obstacle is also not about ignorance of source code. An agent might know its entire source code and still be unable to trust its own proofs. For example, even if the agent has a complete representation of its proof system T within T, it still cannot consistently assume that everything it proves is true. The problem is not a lack of knowledge but a logical limitation: a system cannot consistently affirm its own soundness.

  **(c)** The obstacle has severe implications for self-prediction. Suppose an agent (the builder) wants to build a successor agent that uses the same or a stronger proof system. The builder wishes to prove (within T) that the successor is sound, i.e., that everything the successor proves is true. But if the successor is at least as strong as T, then the builder would be proving the soundness of a system that includes T. However, the soundness of T implies Con(T) (since if T proves ⊥ then ⊥ would be true, but ⊥ is false). Thus, proving the soundness of the successor would require proving Con(T). But by the second incompleteness theorem, T cannot prove Con(T) unless it is inconsistent. Therefore, the builder cannot prove the soundness of the successor. This means the builder cannot be sure that the successor won't prove false statements, which is a problem for certification.

  **(d)** Two candidate repairs:

  (i) *A repair that fails outright*: One idea is to have the agent use a weaker system, say T_0, for its self-referential reasoning. For example, the agent might use T for reasoning about the world but T_0 (a subsystem of T) for reasoning about its own proofs. However, if the agent then tries to trust T_0 by adopting reflection for T_0, we run into the same problem: by Löb's theorem, adding reflection for T_0 would make T_0 inconsistent. And without such reflection, the agent has no way to trust T_0's proofs. So this fails.

  (ii) *A repair that merely relocates the problem*: Another approach is to use a hierarchy of systems, where each level trusts only the level below. For example, the agent at level n uses system T_n, and when building a successor, it builds it at level n+1. Then, the level n agent can prove the soundness of T_n (for the next level) but only by using T_{n+1}. However, the agent at level n is using T_{n+1} to reason about its successor at level n+1, but then the problem is pushed to the next level: the agent at level n+1 cannot prove the soundness of its own successor at level n+2 without T_{n+2}. This creates an infinite regress. The problem is relocated but not solved.

  A genuine fix would have to accomplish the following: it must allow an agent to trust some of its own reasoning without trusting all of it, in a way that avoids the inconsistency. One approach is to restrict reflection to only certain kinds of statements (e.g., arithmetical or Σ1 statements). Another is to use probabilistic reasoning or bounded rationality. But any genuine fix must allow the agent to have a non-trivial, consistent form of self-trust that is sufficient for the required reasoning (like cooperation or building a successor) without collapsing into inconsistency.

  ---

