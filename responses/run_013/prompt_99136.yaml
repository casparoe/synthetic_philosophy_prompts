answer: |-
  ### Exam Question: The Löbian Obstacle  
  **Context:** Consider a rational agent using a proof system \(\mathsf{T}\) extending Peano Arithmetic (\(\mathsf{PA}\)). The agent acts only when it possesses a \(\mathsf{T}\)-proof that the action clears an expected-utility threshold. It must also reason about its own future actions—e.g., for precommitment, cooperation with a copy, or certifying a successor agent it builds.  

  **Tasks:**  
  (a) **Derivation:** Show that adopting the schema "if \(\mathsf{T}\) proves \(\varphi\), then \(\varphi\)" (as an axiom or inference rule) makes \(\mathsf{T}\) inconsistent. Explicitly state where Löb’s theorem is used.  
  (b) **Distinctions:** Explain why this obstacle is neither a restatement of Gödel’s second incompleteness theorem nor primarily about the agent’s ignorance of its own source code.  
  (c) **Implications:** Discuss consequences for an agent predicting its own behavior. Specifically, explain why a *builder* agent cannot use \(\mathsf{T}\) to prove the soundness (i.e., "all proven sentences are true") of a successor at least as strong as itself.  
  (d) **Repairs:**  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) Describe one candidate repair that **fails outright** and why.  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) Describe one candidate repair that **merely relocates the problem** and why.  
  &nbsp;&nbsp;&nbsp;&nbsp;Finally, state what any genuine fix must accomplish.  

  ---

  ### Model Answer (700 words)  
  #### (a) Derivation (Löb’s Theorem → Inconsistency)  
  Löb’s theorem states: If \(\mathsf{T} \vdash \Box_{\mathsf{T}} \varphi \to \varphi\), then \(\mathsf{T} \vdash \varphi\), where \(\Box_{\mathsf{T}} \varphi\) denotes "\(\mathsf{T}\) proves \(\varphi\)". Suppose \(\mathsf{T}\) adopts reflection: the axiom schema \(\Box_{\mathsf{T}} \varphi \to \varphi\) for all \(\varphi\). Let \(\bot\) be a contradiction. Substitute \(\varphi = \bot\):  
  \[
  \mathsf{T} \vdash (\Box_{\mathsf{T}} \bot \to \bot).
  \]  
  \(\Box_{\mathsf{T}} \bot\) asserts \(\mathsf{T}\)’s inconsistency. Thus, \(\Box_{\mathsf{T}} \bot \to \bot\) is equivalent to \(\neg \Box_{\mathsf{T}} \bot\), i.e., \(\mathsf{Con}(\mathsf{T})\) (\(\mathsf{T}\)’s consistency). By the reflection axiom:  
  \[
  \mathsf{T} \vdash \mathsf{Con}(\mathsf{T}).
  \]  
  Löb’s theorem now applies: Since \(\mathsf{T} \vdash \Box_{\mathsf{T}} \bot \to \bot\) (i.e., \(\mathsf{T} \vdash \Box_{\mathsf{T}} \varphi \to \varphi\) for \(\varphi = \bot\)), Löb’s theorem implies \(\mathsf{T} \vdash \bot\). This is inconsistency. **Löb’s theorem does the work** in the final step: it collapses self-trust (\(\mathsf{Con}(\mathsf{T})\)) into \(\bot\).  

  #### (b) Distinctions  
  The Löbian obstacle is **not Gödel’s second theorem restated**. Gödel’s second theorem shows \(\mathsf{T} \nvdash \mathsf{Con}(\mathsf{T})\) (if consistent). Löb’s theorem is stronger: it demonstrates that *adopting* global self-trust (\(\Box_{\mathsf{T}} \varphi \to \varphi\)) is fatal. Gödel prohibits self-consistency proofs; Löb prohibits self-trust.  

  It is **not about source-code ignorance**. Suppose the agent fully knows its source code (e.g., axioms of \(\mathsf{T}\)). The problem persists: even with perfect introspection, \(\mathsf{T}\) cannot consistently *affirm* that its proofs are sound. This is a *logical limitation*, not an epistemic gap. Trusting all proven \(\varphi\) creates a self-referential trap (e.g., "If I prove I never take action \(A\), I won’t take \(A\)" paradox).  

  #### (c) Implications for Self-Prediction  
  An agent predicting its own behavior must prove sentences like "I will take action \(A\) only if it is optimal". To cooperate with a copy or certify a successor, it must prove soundness of a system \(\mathsf{S} \supseteq \mathsf{T}\) (e.g., a successor using \(\mathsf{T}\) or stronger). Soundness of \(\mathsf{S}\) implies \(\mathsf{S}\) proves only true sentences. But \(\mathsf{S} \supseteq \mathsf{T}\), so \(\mathsf{S}\)’s soundness entails \(\mathsf{Con}(\mathsf{T})\) (if \(\mathsf{T}\) proved \(\bot\), \(\bot\) would be "true", violating soundness). By Gödel’s second theorem, \(\mathsf{T} \nvdash \mathsf{Con}(\mathsf{T})\)—unless inconsistent. Thus, the builder **cannot prove \(\mathsf{S}\)’s soundness** in \(\mathsf{T}\). This sabotages certification: the builder cannot guarantee the successor won’t "go insane" (prove false statements).  

  #### (d) Candidate Repairs  
  **(i) Fails outright:** Use a weaker system \(\mathsf{T}^- \subset \mathsf{T}\) for self-reasoning. For example, the agent uses \(\mathsf{T}\) for world-modeling but \(\mathsf{T}^-\) for introspection. **Why it fails:** To trust \(\mathsf{T}^-\)’s output, the agent needs reflection for \(\mathsf{T}^-\): \(\Box_{\mathsf{T}^-} \varphi \to \varphi\). But by Löb’s theorem, adding this schema to \(\mathsf{T}^-\) makes \(\mathsf{T}^-\) inconsistent. Without reflection, \(\mathsf{T}^-\)’s proofs are untrustworthy.  

  **(ii) Relocates the problem:** Use a hierarchy. Define \(\mathsf{T}_0 = \mathsf{PA}\), \(\mathsf{T}_{n+1} = \mathsf{T}_n + \mathsf{Con}(\mathsf{T}_n)\). The agent at level \(n\) uses \(\mathsf{T}_n\), and proves soundness of a successor using \(\mathsf{T}_{n+1}\). **Why it relocates:** The level-\(n\) agent proves \(\mathsf{Con}(\mathsf{T}_n)\) in \(\mathsf{T}_{n+1}\), so the successor’s soundness is provable. But the level-\(n\) agent *itself* operates in \(\mathsf{T}_n\), which cannot prove \(\mathsf{Con}(\mathsf{T}_n)\). Thus, the agent cannot justify its *own* soundness—only its successor’s. The problem shifts upward: each level trusts the next, but no level trusts itself.  

  **Genuine fix requirements:** A viable solution must enable *restricted*, *consistent* self-trust. Examples:  
  - Restrict reflection to *computationally feasible* proofs (e.g., polynomial-time bounds).  
  - Use probabilistic self-assessments (e.g., "I am sound with probability \(p\)").  
  - Allow self-trust only for *concrete* arithmetic sentences (e.g., \(\Sigma_1\) statements).  
  The core challenge: achieving sufficient self-trust for cooperation/successor-certification without Löbian inconsistency.  

  ---

  ### Marking Scheme (20 points)  
  | **Must-Hit Point**              | **Marks** | **Characteristic Loss**                                                                 | **A vs. B Separation**                                                                                              |  
  |---------------------------------|-----------|----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|  
  | **(a) Derivation uses Löb’s theorem to show inconsistency** | 5         | Invokes Gödel instead of Löb; omits substitution of \(\bot\) or \(\mathsf{Con}(\mathsf{T})\) step.             | **A (5)**: Explicitly uses Löb on \(\Box_{\mathsf{T}} \bot \to \bot\) → \(\mathsf{T} \vdash \bot\). **B (3-4)**: Gaps in steps. |  
  | **(b) Distinguishes from Gödel and source code**  | 4         | Equates obstacle with Gödel’s second theorem; claims source-code knowledge resolves it.                 | **A (4)**: Clear on both distinctions. **B (2-3)**: Vague on one or conflates issues.                              |  
  | **(c) Explains successor certification failure** | 5         | Omits that soundness implies \(\mathsf{Con}(\mathsf{T})\); fails to state successor \(\supseteq \mathsf{T}\). | **A (5)**: Full chain: soundness → \(\mathsf{Con}(\mathsf{T})\) → unprovable. **B (3-4)**: Misses a link.             |  
  | **(d)(i) Identifies outright-fail repair**       | 2         | Names a repair but doesn’t explain why it fails (e.g., "weak systems don’t work").     | **A (2)**: Example (e.g., \(\mathsf{T}^-\)) + why (reflection → inconsistency). **B (1)**: Weak example or rationale. |  
  | **(d)(ii) Identifies problem-relocating repair** | 2         | Names hierarchy but doesn’t explain "relocation" (e.g., ignores self-distrust at level \(n\)). | **A (2)**: Example (e.g., \(\mathsf{T}_n\) hierarchy) + why (proves next level’s soundness, not own). **B (1)**: Incomplete. |  
  | **(d) Genuine fix requirements**                 | 2         | Vague (e.g., "make T weaker"); proposes a repair already covered in (d)(i)/(ii).       | **A (2)**: Specific goal (e.g., "restricted reflection"). **B (1)**: Generic (e.g., "avoid self-reference").          |  

  - **A (18–20)**: Hits all points precisely; no gaps; demonstrates deep insight.  
  - **B (15–17)**: Minor flaws (e.g., vague fix, one weak distinction); solid but not flawless.  
  - **C (10–14)**: Misses 1–2 must-hit points (e.g., skips Löb’s role or certification failure).  
  - **D/E (<10)**: Fundamental errors (e.g., confuses Löb with Gödel; invalid derivation).  

  ---  
  **Exam Logistics:**  
  - **Time**: 90 minutes.  
  - **Format**: Write in clear, concise prose. Define symbols (e.g., \(\Box_{\mathsf{T}}\) = "T proves").  
  - **Constraints**: No external resources. Base answers solely on the specification.
