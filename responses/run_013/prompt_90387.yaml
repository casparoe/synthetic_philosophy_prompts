prompt: |-
  I'm a novelist, not a philosopher, so bear with me. I'm trying to build a pair of scenes around something philosophers apparently argue about with dispositions, finks and masks, and I need you to design the cases for me.

  Two scenes, ordinary contemporary life, no sci-fi, no magic, no little gremlins. In both, my character is asked for something — money, a favor, help moving — and does not come through. Scene one: the asking itself is what wrecks it, the request lands and something in her goes cold or defensive, so what she'd otherwise have done she now won't. Scene two: the trait is still fully there, but something external blocks it — she's flat broke, or asleep, or her hands are full. Same outward result, same surface details, and my reader shoudn't be able to tell which one she is from the page alone; the difference has to live in the machinery. Tell me the exact detail I'd need to add to each scene so a careful reader gets it right.

  Then for each scene: what does the plain "she'd do it if asked" conditional analysis of the trait say, and what does the repaired version say — the one that adds an intrinsic-basis requirement and an unless-something-blocks-it clause — and where exactly do the two come apart? Tell me which single feature is doing all the work. I suspect it's whether the trigger alters the basis or merely sits between the basis and the behaviour, but say so if that's wrong. Then give me the strongest move a defender of the plain conditional analysis could make to collapse my pair into one case, so I know what I'm up against.

  Keep it tight — a short paragraph per scene, then the analysis, then the one-sentence version of each scene I could actually put in the manuscript. And no quoting philosophers at me, I won't understand it.
