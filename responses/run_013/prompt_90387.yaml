answer: |-
  Here are your two scenes, designed to show the machinery beneath the surface without violating realism:

  **Scene 1: The Fink (Request alters the intrinsic basis)**
  *   **Setup:** Your character, Maya, genuinely intends to lend her brother $50 for groceries when she sees him next. She feels the impulse to help.
  *   **Trigger:** He arrives, visibly agitated, and says, "Hey, Maya, I *need* fifty bucks right now. Dave said you'd cover me." Mentioning their pushy mutual friend Dave triggers Maya's deep resentment over past pressures.
  *   **Internal Shift:** The request *itself* activates her defensiveness. Her initial willingness evaporates. She feels cold, guarded. The *trait* (generosity towards her brother) is *finked* – the triggering condition (being asked, especially invoking Dave) destroys the basis for the disposition.
  *   **Outcome:** Maya says flatly, "Sorry, can't help you this time."
  *   **The Clue:** Show her *immediate internal reaction* to the *way* he asks. *"The mention of Dave’s name sent a familiar chill down her spine, freezing the ‘yes’ already forming on her lips."* (Focus on the request *causing* the internal state change).

  **Scene 2: The Mask (External blocker prevents manifestation)**
  *   **Setup:** Your character, Maya, genuinely intends to lend her brother $50 for groceries when she sees him next. She feels the impulse to help.
  *   **Trigger:** He arrives, visibly agitated, and says, "Hey, Maya, I *need* fifty bucks right now."
  *   **External Blocker:** Maya is physically holding two large, heavy boxes of donations she's just packed for the shelter. She *cannot* physically access her purse without putting them down, which is awkward and risks spilling the contents. Her willingness remains intact.
  *   **Outcome:** Maya says, "Sorry, can't help you this time," while shifting the boxes.
  *   **The Clue:** Show the *external, physical impediment* existing *before* or *simultaneously* with the request, unrelated to it. *"The request came just as she shifted the heavy donation boxes, her arms straining. Her purse was buried deep inside her packed tote bag."* (Focus on the pre-existing/immediate physical constraint).

  **Analysis:**

  1.  **Plain Conditional Analysis ("She'd do it if asked"):**
      *   **Scene 1 (Fink):** **False.** She *was* asked and *didn't* do it. The conditional fails because the asking *changed* her intrinsic state, making her not generous *at that moment*.
      *   **Scene 2 (Mask):** **False.** She *was* asked and *didn't* do it. The conditional fails because an external blocker prevented the manifestation of her stable, intrinsic generosity.
  2.  **Repaired Analysis ("She has an intrinsic basis B for trait T, and if asked, she'd do it *unless* B is altered *or* something blocks B's manifestation"):**
      *   **Scene 1 (Fink):** **True for the trait (Generosity), False just after asking.** She had the basis (B) for generosity. *When asked*, the request *altered* B (finked it), meaning the "unless B is altered" clause kicks in - she didn't help *because* the basis was destroyed *by* the trigger.
      *   **Scene 2 (Mask):** **True.** She has the stable basis (B) for generosity. When asked, she *would* have lent the money (manifested T), but something *external* (the boxes) *blocked* the manifestation of B. The "unless something blocks" clause applies.
  3.  **Where They Come Apart:** The **single feature** is **whether the triggering condition (being asked) *itself directly alters* the intrinsic basis (B) for the disposition (T).**
      *   **Fink:** The trigger *changes* B (willingness vanishes). B is fragile to the trigger.
      *   **Mask:** The trigger *finds* B intact but *something else* blocks B's expression. B is stable, the blocker is external.
      *   *(Your suspicion is correct: Fink alters the basis; Mask blocks the path from basis to behavior).*

  **The Defender's Strongest Move:**
  A defender of the plain conditional could argue both scenes are simply cases where the **triggering conditions weren't "ideal" or "normal"** for the disposition. They'd claim the plain conditional *always implicitly assumes* "normal conditions" or "the absence of finks/masks." They'd say: *"Of course 'if asked' doesn't literally mean 'if asked under *any* circumstances, including those that destroy generosity or physically prevent action'. It means 'if asked under *suitable* or *standard* conditions where the disposition can manifest.'"* This tries to **collapse both cases into a single explanation: the conditions weren't right for the disposition to manifest, so the conditional wasn't falsified.**

  **Manuscript Sentences:**

  *   **Scene 1 (Fink):** *"As her brother mentioned Dave's name, the familiar chill froze the 'yes' already forming on Maya's lips, and she heard herself say, 'Sorry, can't help you this time.'"*
  *   **Scene 2 (Mask):** *"Shifting the heavy donation boxes in her arms as he asked, Maya glanced at her buried purse and said, 'Sorry, can't help you this time.'"*
