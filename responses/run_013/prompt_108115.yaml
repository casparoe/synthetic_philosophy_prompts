prompt: |-
  I'm an undergraduate currently taking a seminar on political theory, and there's a pattern I keep running into that I don't have a word for. The course keeps returning to the distinction between left and right; I can see that it tracks something, but I can't get clear on what, and I've begun to suspect I'm running several different things together. I'd like to know whether the pattern has an established name — and I'd want more than the name. What the thing is exactly, what it isn't, and where its edges are.

  Three observations, in increasing order of how much they bother me.

  First: a controversy opens up over something with no obvious connection to the standing disputes — whether a particular line of research should be funded, how much of a new medical technology should be permitted, what a school should do about some new device. Within a term, everyone I know has a position and can predict everyone else's, before any argument has been made. My own position tends to arrive before my reasons do: I notice where I stand and then go looking for the argument. This isn't just my friends being predictable; the same thing happens to me with questions I have genuinely never thought about.

  Second: when I ask people who agree on everything to explain why, the answers don't match. One says the point is never to be subject to a power you didn't agree to; another says the point is what happens to the worst off. Neither would switch sides if the other's reason were refuted, and neither treats the agreement as a coincidence. The same person gives different reasons for different questions, so no single principle seems to be doing the work. And the side that wants one thing tightly controlled in one domain wants the next thing left alone in the next; when I ask why, people say the domains are simply different, but can't say what the difference is except that this is where the side has ended up.

  Third, the mirror image: two people I know agree on every concrete question I've put to them — the same verdicts on the same controversies — but each would join a different side if a fight broke out, and each treats the other as an opponent.

  So: what makes a side a side? The labels plainly refer to something, but whatever it is seems to be doing less work than the sides themselves. Are these three observations one phenomenon or three? Is there a term for the process by which a previously unclaimed question gets a side, as distinct from the state of people's answers lining up? What are the nearest established concepts, and where exactly do they fail to fit? If nothing fits, coin something and define it — and tell me what it excludes: what would have to be true for the pattern to come apart, or for a question to stay unclaimed.
reasoning: |-
  Okay, the user is an undergraduate in a political theory seminar who's noticed a puzzling pattern about left-right divisions. They've described three specific observations that are bothering them: how people instantly take sides on new issues, how allies give conflicting reasons for their positions, and how people with identical policy views still identify as opponents. 

  This is fascinating because they're essentially asking about the ontology of political alignment - what actually constitutes a "side" beyond policy positions. Their frustration suggests they've moved beyond surface-level political science concepts and are grappling with deeper questions of group identity formation. 

  The core issue seems to be that political alignment functions more like tribal membership than logical deduction. Their first observation reveals how political identity predicts positions rather than vice versa. The second shows how post-hoc rationalizations vary while tribal loyalty remains constant. The third demonstrates that the tribal identity itself has independent weight from actual policy views.

  I recall Anthony Downs' economic theory of democracy where he models parties as coalitions seeking power, not truth-seeking entities. But the user needs more than that - they're describing the psychological and sociological dimensions beneath the rational choice model. Lakoff's moral politics framework with strict vs nurturing parent metaphors might help explain why reasons differ while alignment holds.

  For the phenomenon of new issues getting "claimed" by sides, I should mention Bourdieu's concept of the political field where positions gain meaning relationally. The closest established term might be "political alignment" or "partisan sorting," but neither fully captures this dynamic process they're describing.

  What makes this especially tricky is that they're observing three manifestations of what's likely the same underlying phenomenon: the autonomous power of political identity. The tribal affiliation exists prior to and independently of both policy positions and justifications. 

  For a coined term, "positional allegiance" might work - emphasizing the commitment to the side itself rather than specific policies. Or "coalitional gravity" to capture how issues get pulled into existing alignments. The key is defining it as the force that makes unclaimed controversies become sites of tribal signaling.

  The user would probably benefit from understanding that this phenomenon emerges from three interacting factors: cognitive shortcuts (heuristics), social identity needs, and historical coalition structures. When they ask what would make the pattern come apart, the answer would be conditions that weaken those factors - say, if new issues cross-cut existing alliances or if political identities become less salient.
answer: |-
  Based on your observations, you're grappling with the **ideological cohesion** of political coalitions, but specifically pointing to phenomena beyond explicit ideology. The core pattern you describe is the **pre-ideological alignment force** – the pull of a "side" that exists *before* specific reasons or policies are articulated, and often *despite* inconsistencies in reasoning. While no single term captures all nuances perfectly, here's a breakdown:

  ### 1. The Established Concepts & Where They Fall Short
  *   **Ideology:** A coherent system of beliefs/principles (e.g., liberalism, socialism). *Falls short:* Your observations show agreement *without* coherent shared principles (Observation 2), alignment *before* ideology is formed (Obs. 1), and identical policy views *across* ideological divides (Obs. 3).
  *   **Partisanship:** Loyalty to a specific party. *Falls short:* You're talking about broader "sides" (left/right) that precede party labels, and the alignment happens even on non-partisan issues.
  *   **Group Polarization/Identity:** The tendency for groups to become more extreme and cohesive. *Falls short:* Explains cohesion *within* a side but not the *initial assignment* of new issues to a side (Obs. 1) or the *disconnect* between identity and policy (Obs. 3).
  *   **Hegemony (Gramsci):** Dominance of one group's worldview. *Falls short:* Doesn't fully explain the *internal* inconsistency of reasoning within the side or the pre-rational alignment.
  *   **Social Identity Theory:** People derive self-esteem from group membership. *Falls short:* Explains *why* people stick to sides but not *how* new issues get assigned to sides so rapidly and predictably (Obs. 1) or the specific *pattern* of inconsistent reasoning (Obs. 2).
  *   **Cultural Cognition (Kahan, Slovic):** People fit perceptions of risk/facts to match their cultural values. *Closer:* Explains Obs. 1 & 2 well – positions form based on cultural alignment, reasons follow. *Falls short:* Less emphasis on the *coalitional* nature of the sides and Obs. 3.

  ### 2. Your Three Observations: One Core Phenomenon with Facets
  Your observations are interconnected manifestations of **coalitional allegiance:**

  1.  **Instantaneous Side-Taking (New Issues):** This is **Coalitional Claiming.** A new issue emerges; individuals instinctively assess which existing coalition (left/right) *seems most aligned* with their pre-existing tribal identity or which coalition *their perceived opponents* are likely to oppose/support. Reasoning is post-hoc rationalization. The "side" claims the issue based on perceived coalitional interests.
  2.  **Inconsistent Reasoning Within Sides:** This reveals **Coalitional Epistemology.** The "side" isn't defined by a *single* principle but by a *coalition of interests, identities, and values loosely held together.* Different members prioritize different aspects (liberty, equality, tradition, progress). The *coalition's position* on a specific issue is determined by which faction within the coalition has dominance *on that issue* or by reacting against the *opposing coalition*. The "difference in domains" is often arbitrary or historically contingent – it's where the coalitional battle lines happened to form. Consistency is sacrificed for coalitional unity.
  3.  **Policy Agreement Despite Tribal Division:** This is **Tribal Signaling Over Policy.** The "side" (left/right) functions as a powerful **social identity signal** independent of specific policies. Agreeing on policies doesn't erase the fundamental tribal identity ("us vs. them"). Each person identifies the *other* as belonging to the *opposing tribe*, regardless of specific agreements. Loyalty and belonging to the *tribe* supersede agreement on individual policies. They *expect* disagreement on *future* issues or value the tribal identity itself (shared history, cultural markers, perceived enemies).

  ### 3. Coining a Term: Coalitional Allegiance (CA)

  *   **Definition:** The pre-rational, identity-driven force that binds individuals to a broad political coalition ("side"), causing them to:
      *   Instinctively adopt the coalition's perceived stance on novel issues (**Coalitional Claiming**).
      *   Prioritize coalitional unity over logical consistency in reasoning across different policy domains (**Coalitional Epistemology**).
      *   Maintain loyalty to the coalition as a social group even when specific policy positions align with members of opposing coalitions (**Tribal Signaling**).
  *   **What it IS:**
      *   A social identity phenomenon rooted in group belonging.
      *   Driven by historical alliances, perceived shared enemies, cultural markers, and in-group/out-group dynamics.
      *   Predictive of stance adoption on new issues.
      *   The primary glue holding complex coalitions together.
      *   Often stronger than specific policy preferences or logical consistency.
  *   **What it IS NOT:**
      *   A coherent ideology or philosophy.
      *   Simply partisanship (though related).
      *   Always rational or principle-based.
      *   A guarantee of policy agreement within the coalition.
      *   Easily changed by rational argument alone.
  *   **Where the Edges Are:**
      *   **Internal:** Within a coalition, factions might disagree vehemently on issues not yet "claimed" by the coalition or where coalitional lines are weak. CA explains alignment *once the battle lines are drawn* by the coalition.
      *   **External:** CA breaks down when:
          *   An issue **cross-cuts** existing coalitions (e.g., libertarians vs. authoritarians on both left and right, creating strange alliances).
          *   A new **salient identity** supersedes the left/right divide (e.g., a strong nationalist movement uniting parts of left/right against globalists).
          *   **Local vs. National:** CA might be weaker on purely local issues without clear national partisan framing.
          *   **Low-Salience Issues:** On issues people care little about, CA may not trigger automatic alignment.

  ### 4. What Would Make the Pattern Come Apart or a Question Stay Unclaimed?

  *   **Coalitional Fragmentation:** If the internal factions within "left" or "right" become more salient than the coalition itself (e.g., progressive vs. moderate Democrats, populist vs. traditional Republicans), CA weakens. New issues might not automatically align with the broader side.
  *   **Emergence of Cross-Cutting Issues:** Issues that force people to choose between their coalitional identity and another core identity (e.g., environmentalism vs. union jobs) can prevent clean claiming or create internal conflict.
  *   **Technocratic Consensus:** If an issue is successfully framed as purely technical/scientific with no clear moral/political dimension *and* experts reach consensus, it might resist claiming. However, CA often works by *politicizing* expertise ("Which experts does *our side* trust?" – see Cultural Cognition).
  *   **Novelty and Ambiguity:** Truly unprecedented issues with no analog might take time to be claimed, as coalitions scramble to define their stance. However, CA predicts this period will be brief as coalitions rush to "own" the issue based on perceived alignment.
  *   **Deliberative Framing:** If an issue is deliberately introduced and discussed in a context that suppresses tribal identities and emphasizes common ground/problem-solving, claiming *might* be delayed or weakened. However, CA is powerful and often reasserts itself.

  ### Conclusion
  You've astutely identified **Coalitional Allegiance** as the powerful, often pre-rational force structuring political alignment beyond formal ideology or even specific policies. It explains the rapid claiming of issues, the inconsistent reasoning tolerated within sides, and the persistence of tribal identity despite policy agreement. The terms "left" and "right" primarily signal membership in these broad, historically contingent coalitions bound together by allegiance more than by strict logical coherence. Understanding CA is crucial for navigating political discourse, as it highlights the limits of purely rational debate and the deep-rooted nature of political identity. Your seminar is likely returning to left/right because, despite their fuzziness, these categories powerfully organize political reality through Coalitional Allegiance.
