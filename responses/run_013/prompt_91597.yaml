answer: |-
  Below is a structured analysis of the standing-to-blame problem, prioritizing the **desiderata and their motivating cases** over theory evaluation. I’ll follow your sequence: (1) Brainstorm of cases, (2) Desiderata with motivations, (3) Non-negotiables vs. camp preferences, (4) Tensions, (5) Key exclusionary requirement, and (6) Brief theory scoring.  

  ---

  ### **I. Brainstorm: The Full Range of Cases**  
  **Core Cases Motivating Standing Theories**:  
  1. **The Hypocrite**: Blames others for acts they currently/regularly commit. (*Standard anchor*)  
  2. **Complicit Non-Hypocrite**: Blames a wrong they enabled (e.g., a voter who opposes corruption but voted for the corrupt politician). Not hypocritical (they don’t commit the act), but complicit.  
  3. **Reformed Wrongdoer**: Blames another for a wrong they once committed but have atoned for (e.g., a former thief condemns theft after reparations).  
  4. **Benefiting Blamer**: Condemns a practice they materially benefit from (e.g., a sweatshop owner’s child condemns labor exploitation).  
  5. **Third-Party Advocate**: Blames on behalf of a victim (e.g., a friend condemns a bully when the victim is silent).  
  6. **Compromised Truth-Teller**: Blames accurately despite their own moral flaws (e.g., a dishonest person correctly condemns lying).  
  7. **Epistemic Constraint Case**: Blamer’s standing hinges on unknowable facts (e.g., they blame theft, not knowing their own property was stolen in the past).  
  8. **Ritual Redemption**: A hypocrite/complicit agent regains standing through self-criticism/atonement rituals (e.g., public confession + reparations before blaming).  

  ---

  ### **II. Desiderata for Any Adequate Theory**  
  **A. Cases the Theory Must Get Right**  
  1. **Hypocrite Exclusion**  
     - *Case*: #1 (Hypocrite).  
     - *Demand*: Hypocrisy undermines credibility and fairness. Genuine because it avoids double standards.  
  2. **Complicity Exclusion**  
     - *Case*: #2 (Complicit Non-Hypocrite).  
     - *Demand*: Moral authority requires non-participation in harm. Genuine because complicity implicates the blamer in the wrong.  
  3. **Reformed Inclusion**  
     - *Case*: #3 (Reformed Wrongdoer).  
     - *Demand*: Redemption must be possible. Genuine because moral growth should restore standing.  
  4. **Beneficiary Challenge**  
     - *Case*: #4 (Benefiting Blamer).  
     - *Demand*: Benefiting from harm risks moral detachment. Genuine because material gain can undermine impartiality.  
  5. **Third-Party Permissibility**  
     - *Case*: #5 (Third-Party Advocate).  
     - *Demand*: Victims need allies. Genuine because moral community requires collective accountability.  
  6. **Truth-Teller Preservation**  
     - *Case*: #6 (Compromised Truth-Teller).  
     - *Demand*: Truth matters independently of the speaker. Genuine because flawed agents can still identify wrongs.  
  7. **Epistemic Neutrality**  
     - *Case*: #7 (Epistemic Constraint).  
     - *Demand*: Standing shouldn’t depend on inaccessible facts. Genuine because blame is a social practice requiring transparency.  
  8. **Ritual Redemption Recognition**  
     - *Case*: #8 (Ritual Redemption).  
     - *Demand*: Standing must be regainable. Genuine because rituals scaffold moral repair in real communities.  

  **B. Distinctions the Theory Must Not Collapse**  
  1. **Standing vs. Blameworthiness vs. Truth**  
     - *Case*: #6 (Compromised Truth-Teller). Blamer is blameworthy themselves, criticism is true—yet standing may be contested.  
  2. **Attitude vs. Utterance Efficacy**  
     - *Case*: Speaking blame may be ineffective (e.g., victim ignores third-party blamer), but the *attitude* could still be appropriate.  
  3. **Forfeiture vs. Absence**  
     - *Case*: Hypocrites *forfeit* standing; children *lack* standing to blame adults for complex wrongs.  
  4. **Blaming vs. Holding Accountable**  
     - *Case*: A judge (standing to hold accountable) vs. a vigilante (no standing to blame extrajudicially).  

  **C. Constraints It Must Respect**  
  1. **Epistemic Accessibility**: Standing cannot turn on unknowable facts (from #7).  
  2. **Non-Universality**: Standing cannot be impossible for *everyone* (e.g., if all are complicit, blame collapses).  
  3. **Non-Reduction**: Standing ≠ hypocrisy alone (must explain #2, #4, #5).  
  4. **Recoverability**: Standing must be regainable (from #3 and #8).  

  ---

  ### **III. Non-Negotiables vs. Camp Preferences**  
  | **Desideratum**               | **Status**          | **Why** |  
  |-------------------------------|---------------------|---------|  
  | Epistemic Accessibility       | Non-negotiable      | Foundational for fairness; avoids moral luck in standing. |  
  | Non-Universality              | Non-negotiable      | Without this, blame is inert—core to accountability practices. |  
  | Truth-Teller Preservation     | Non-negotiable      | Separates standing from moral purity; truth must matter. |  
  | Hypocrite Exclusion           | Consensus (near-universal) | Rarely contested; hypocrisy violates reciprocity. |  
  | Third-Party Permissibility    | Camp Preference     | Communitarians endorse; strict relationalists (e.g., Scanlon) restrict. |  
  | Ritual Redemption             | Camp Preference     | Embraced by pragmatists/ritualists; ignored by Kantians. |  
  | Complicity Exclusion          | Camp Preference     | Emphasized by structuralists; downplayed by individualists. |  

  **Key Tensions**:  
  - **Ritual Redemption vs. Complicity Exclusion**: Can complicit agents *fully* launder standing via ritual? If yes, risks whitewashing; if no, moral growth is stifled.  
  - **Third-Party vs. Beneficiary Challenge**: Third parties often benefit from oppression (#4). Can they blame without hypocrisy? Tension between allyship and privilege.  
  - **Truth-Teller vs. Hypocrite Exclusion**: A hypocrite’s blame may be *true* (#6), but we deny standing. Prioritizing truth undermines hypocrisy concerns.  

  ---

  ### **IV. Requirement That Excludes Major Theories**  
  **Epistemic Accessibility** is the most exclusionary:  
  - **"Clean Hands" Theories** (e.g., Calhoun): Fail if standing depends on blamer’s hidden past.  
  - **Relational Theories** (Scanlon): Standing hinges on dyadic history—unknowable to third parties.  
  - **Character Theories** (Sher): Require assessment of blamer’s virtues—opaque to outsiders.  

  ---

  ### **V. Leading Theories Scored Against Desiderata**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partially)*  

  | **Desideratum**               | **Relational (Scanlon)** | **Authority (Wallace)** | **Character (Sher)** | **Structural (Bell)** |  
  |-------------------------------|--------------------------|-------------------------|----------------------|----------------------|  
  | Hypocrite Exclusion           | ✓                        | ✓                       | ✓                    | ✓                    |  
  | Complicity Exclusion          | ✗ (dyadic focus)         | ~                       | ✗                    | ✓                    |  
  | Reformed Inclusion            | ✗                        | ~                       | ✓                    | ~                    |  
  | Beneficiary Challenge         | ✗                        | ✗                       | ✗                    | ✓                    |  
  | Third-Party Permissibility    | ✗                        | ~                       | ✓                    | ✓                    |  
  | Truth-Teller Preservation     | ✓                        | ✓                       | ✗                    | ✓                    |  
  | Epistemic Accessibility       | ✗                        | ~                       | ✗                    | ✓                    |  
  | Ritual Redemption             | ✗                        | ✗                       | ✗                    | ~                    |  

  **Takeaways**:  
  - **Structural views** (e.g., Macalester Bell) best handle complicity/beneficiary cases but struggle with ritual redemption.  
  - **Character views** allow third-party blame but exclude compromised truth-tellers.  
  - **No theory** fully satisfies epistemic accessibility or ritual redemption.  

  ---

  ### **Conclusion**  
  The hypocrite case has narrowed the debate, but **complicity without hypocrisy** (#2), **epistemic constraints** (#7), and **ritual laundering** (#8) are the unexplored frontiers. **Epistemic Accessibility** is the lodestar: if a theory can’t satisfy it, it fails a core fairness test. Tensions between redeemability and complicity suggest standing may be **context-sensitive**—e.g., ritual cleanses standing for some wrongs but not systemic harms. Your group might test whether a **compartmentalized approach** (e.g., standing for *this act* in *this context*) resolves contradictions better than monolithic theories.  

  For further work: Examine ritual practices (e.g., truth commissions, religious penance) as empirical labs for standing-laundering. Also, explore if **beneficiary standing** can be salvaged through reflexive blame (e.g., "I condemn this and my own complicity").
