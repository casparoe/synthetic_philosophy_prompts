  Okay, the user is a novelist with twenty years of experience, troubled by a contradiction in how the literary world talks about fiction's moral authority. On one hand, novels come with disclaimers stating that everything is invented and not making claims about the real world. On the other, critics and authors praise works as "true to life" or condemn them as "lies," implying some objective moral truth. The user wants to understand the philosophical commitments behind this practice, especially in metaethics.

  First, I need to unpack the two conflicting practices. The disclaimer suggests fiction is non-assertive, not subject to truth values. But moral evaluations treat novels as capable of truth or falsehood regarding human nature and ethics. The user's personal experience—feeling a scene is "untrue" when a character acts out of character—shows this tension viscerally.

  Metaethical realism seems relevant here. If realism is true, novels can track mind-independent moral facts. But how does that fit with the disclaimer? Maybe the disclaimer is about factual assertions, while moral truths are different. Anti-realist views like expressivism might interpret "true to life" as expressing the critic's attitudes rather than objective truths. But does that capture the sense of discovery the user describes?

  The user asks if anti-realist accounts (expressivism, error theory, relativism, constructivism) can explain the practice without positing moral facts. For expressivism, calling a novel "honest" is like saying "hurray for these attitudes!" But does that diminish the feeling of getting something right? Relativism might say "true for community X," but the user's worry seems more universal. Constructivism could frame moral truth as grounded in rational constraints, allowing novels to engage with those standards. But does the disclaimer still conflict?

  Also, the disclaimer's denial of assertion needs addressing. Speech act theory distinguishes assertion from other acts. Fiction may not assert propositions but still show or invite evaluation. The praise might imply the work embodies moral insights without stating them as facts.

  The user wants to know what would change if anti-realism were correct. Would we stop saying a novel is "true"? Or just redefine it? If moral judgments are expressions, teaching fiction might focus more on emotional resonance than truth. But critics might still use similar language, now describing psychological effects.

  I should distinguish what the practice strictly requires versus what it's compatible with. Realism fits intuitively, but sophisticated anti-realisms can accommodate the language by reinterpreting truth-talk. The practice might be underdetermined, allowing multiple metaethical views. However, realism better explains the sense of discovery and the normative pull the user feels when a scene rings false.

  Finally, if anti-realism were true, the practice might not change drastically, but the underlying meaning would. Critics might emphasize how a novel shapes attitudes rather than reveals truths. The disclaimer could stay, as it addresses legal and factual claims, not moral exploration.
answer: |-
  Your experience captures a profound tension at the heart of literary practice. Let's reconstruct the philosophical commitments, analyze the metaethical implications, and explore the compatibility with different theories.

  ### Core Commitments of the Practice
  1.  **Non-Assertion (Disclaimers):** Fiction is *formally* distinct from assertion. It presents a hypothetical world, not claims about the actual world. This protects against libel and signals its imaginative nature.
  2.  **Moral Evaluation (Praise/Criticism):** Novels are judged on their *moral insight*, *honesty*, *truthfulness to human experience*, and *seriousness*. These judgments are treated as objective assessments of the work's relationship to reality, not mere expressions of personal taste ("pleased/displeased").
  3.  **Internal Coherence & Psychological Plausibility:** Characters and events must be consistent within the novel's own world and plausible within our understanding of human psychology/social dynamics. Violations feel "untrue" (as you experienced).
  4.  **Discovery, Not Just Invention:** The author (and reader) often feels they *discover* truths *within* the fictional construct ("the draft went dead... it was untrue"), suggesting the fiction taps into something independent of the author's whim.

  ### Metaethical Commitments Strictly Required
  *   **Minimal Moral Objectivity:** The practice *requires* that judgments like "sentimental lie," "morally serious," "true to life," or "false to the way people are" are *not* merely reports of the speaker's subjective preference ("I dislike this"). They claim the work succeeds or fails in *accurately representing* something about the actual moral/psychological/social world.
  *   **Cognitive Dimension of Fiction:** While fiction doesn't assert facts *directly*, it *embodies*, *explores*, and *illuminates* truths about human nature, relationships, values, and morality. It provides a mode of *understanding* that can be accurate or inaccurate.
  *   **Distinction Between Assertion and Representation:** The practice necessitates that one can *represent* reality accurately or inaccurately (and be judged for it) without making explicit *assertions* about that reality. Fiction's power lies in *showing* rather than *saying*.

  ### Where the Practice Points Strongly (but Not Strictly Requires) Realism
  *   **Mind-Independent Truths:** Your feeling that the character *would not* forgive suggests you perceive psychological/moral truths existing independently of your authorial will. Praise for "honesty" often implies the novel captures something *about the world as it is*, not just a compelling perspective.
  *   **Normative Force:** The condemnation of a novel as a "lie" carries significant weight, akin to accusing someone of factual dishonesty. This suggests a perceived *wrongness* in misrepresenting reality, pointing towards objective moral/psychological facts.

  ### Metaethical Positions & Compatibility
  *   **Moral Realism (Robust):** (Mind-independent moral facts). **Fits Best.** Explains the sense of discovery, the authority of the "untrue" feeling, and the objective weight of "lie" or "true to life." The disclaimer only denies *direct factual assertion*, not the novel's *indirect truth-tracking capacity* through representation. Praise doesn't retract the disclaimer; it highlights a *different function*.
  *   **Moral Constructivism:** (Moral truths are constructed by rational agents under ideal conditions). **Fits Well.** The novel's "truth" lies in its coherence with the moral understanding we construct through rational engagement with human experience. Your "untrue" feeling is a failure of rational coherence within the constructed norms of human psychology/morality. The disclaimer denies assertion of *brute facts*, not engagement with constructed norms.
  *   **Sophisticated Expressivism/Quasi-Realism (e.g., Blackburn, Gibbard):** **Can Fit, with Redescription.** Calling a novel "true to life" expresses a complex attitude of endorsement towards the perspective it offers *and* projects that endorsement onto the world as if it were a fact ("We are planning how to live by endorsing this vision"). "Sentimental lie" expresses rejection and projects failure. The "untrue" feeling is strong disapproval of the perspective as incoherent or distorting. The practice *mimics* realism but reduces truth-tracking to attitude expression/projection.
  *   **Relativism (Cultural/Perspectival):** **Fits Uneasily.** "True to life" means "true relative to our cultural framework/community standards." While this explains *some* variation in reception, it struggles with:
      *   The author's *personal* sense of "untruth" (which feels discovery-like, not relative).
      *   Criticism *across* cultures claiming universal falsehood ("sentimental lie").
      *   The aspiration towards *universal* human truth often implied in praise.
  *   **Error Theory:** **Does Not Fit.** If *all* moral judgments are false, then praising a novel as "morally serious" or "honest" is itself erroneous. This contradicts the core practice of making meaningful, justified-seeming moral evaluations of fiction. The "untrue" feeling would be an illusion.

  ### The Disclaimer's Role
  The disclaimer is **not contradictory** under realism, constructivism, or quasi-realism. Its purpose is narrowly legal and epistemological:
  1.  **Legal:** Avoids claims of factual defamation.
  2.  **Epistemological Status:** Signals that the work is *imaginative exploration*, not a documentary or philosophical treatise making direct truth-claims. It denies *explicit assertion*.
  3.  **Compatibility:** One can consistently hold that fiction makes no *explicit assertions* about the actual world *while also holding* that it *embodies* or *illuminates* truths (mind-independent or constructed) *about* the actual world through its representations. The praise comments on this *embodiment*, not on explicit assertions.

  ### What Would Change Under Anti-Realism (Expressivism/Quasi-Realism Focus)?
  If sophisticated anti-realism (expressivism/quasi-realism) is correct, the *meaning* of the practice changes significantly, but the surface vocabulary *might* largely remain. However, some shifts are likely:

  1.  **Teaching & Criticism:**
      *   **Focus Shift:** Emphasis moves from "Does this novel reveal truth?" to "What attitudes/plans/norms does this novel express, invite, or challenge?" or "How effectively/coherently does this novel project a way of seeing the world?"
      *   **Language Nuance:** Phrases like "true to life" or "a lie" would be explicitly taught/understood as expressions of strong endorsement/rejection and projections, not reports of objective tracking. We'd say "This novel powerfully endorses a perspective of resilience" rather than "This novel truthfully shows human resilience."
      *   **Authorial Authority:** Your "untrue" feeling becomes a profound sense of *attitudinal incoherence* or *practical unsuitability* within the projected narrative vision, not discovering an external truth.

  2.  **Writing:**
      *   **Motivation:** The drive to "get it right" becomes the drive to create a perspective that is *internally coherent*, *resonantly expressive* of deep concerns, and *practically compelling* for planning how to live, rather than discovering pre-existing truths.
      *   **"Discovery" Feeling:** This is reinterpreted as achieving a deep coherence or resonance within the author's own (or shared) attitudinal framework, not contact with mind-independent reality.

  3.  **Reviewing:**
      *   **Justification:** Critics would justify "moral seriousness" by pointing to the complexity, coherence, depth, and challenge of the *attitudes expressed*, not by an appeal to external moral facts. Condemning a "lie" would mean the novel projects an incoherent, simplistic, or dangerously distorting set of attitudes/plans.

  4.  **What Stays (Superficially):** The *vocabulary* ("true," "lie," "honest," "serious") might persist due to its expressive power and entrenchment. Quasi-realism specifically argues moral language *functions* realistically even if its metaphysics is projective. However, the *understood meaning* by sophisticated practitioners shifts.

  5.  **What Might Fade:** The sense of fiction as a unique tool for *discovering* objective moral/psychological truths external to human practices. The aura of the author as a "seer" diminishes, replaced by the author as a profound *expresser* or *navigator* of our shared practical concerns.

  **Conclusion:** Your literary practice strictly requires a minimal moral objectivity – that judgments of a novel's moral vision are more than subjective preference reports. It points strongly towards realism or constructivism, best explaining the sense of discovery and normative force. However, sophisticated expressivism/quasi-realism *can* redescribe the practice without contradiction, interpreting truth-talk as expressive projection. Under anti-realism, the surface practice (vocabulary, praise/criticism) may persist, but its underlying meaning, teaching, and justification would fundamentally shift from truth-discovery to attitude-expression and projection. The disclaimer remains consistent under all interpretations, as it pertains to the formal absence of assertion, not the potential for indirect truthfulness or expressive power. The contradiction you perceive is real but resides in the *metaphysical implications* of the practice, not in its logical inconsistency.
