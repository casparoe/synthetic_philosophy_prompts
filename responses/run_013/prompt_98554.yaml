answer: |-
  ## Final Examination Question

  **Time Allowed:** 75 minutes  
  **Answer ONE question.**

  **QUESTION:**  
  Nadia understands the facts about animal suffering in industrial farming, has reflected deeply and honestly, but finds no element within her desires, commitments, or evaluative attitudes that motivates her to change her diet. Nevertheless, her community insists she has a reason to change. Tom is moved to help a distant stranger solely by an implanted urge he disowns and did not consent to; the urge is motivationally effective but alien. Using these two cases, critically examine the claim that for a consideration to be a genuine *reason for action* for a particular agent, it must be grounded *within* that agent’s existing motivational or evaluative set. What do Nadia and Tom reveal about the necessary connection (or lack thereof) between reasons, motivation, and the agent’s own perspective?

  *Your essay must engage directly with the specific challenges posed by Nadia and Tom. Avoid relying solely on the standard distinction between internalist (motivation-dependent) and externalist (motivation-independent) theories of reasons. Focus instead on whether internalism can plausibly capture Nadia without also capturing Tom, and whether externalism can justify the claim that Nadia has a reason without rendering reasons entirely disconnected from who she is.*

  ---

  ## Model Answer (Approx. 700 words)

  Nadia and Tom present a stark challenge to simplistic accounts of what makes a consideration a reason *for* a specific agent. The internalist intuition – that reasons must be grounded in the agent's existing motivational set – seems compellingly challenged by Nadia, yet perilously stretched by Tom. Resolving this tension requires probing the nature of "grounding" and the "agent's perspective" more deeply than standard internalism/externalism debates often do.

  Internalism, broadly construed, holds that a reason for S to φ must connect to S’s subjective motivational set (desires, values, commitments). Nadia appears to be internalism’s nightmare: she possesses all relevant facts and self-knowledge, yet reports *no* motivational hook – no latent concern, no implicit commitment to consistency or moral feeling, no desire to avoid hypocrisy or gain approval *on this matter*. Her friends insist she has a reason, implying a failure *in her*, not just in her motivation. If internalism declares Nadia has *no* reason, it risks appearing descriptively accurate but normatively inert, unable to explain the strong intuition that the suffering *itself* gives her a reason, regardless of her contingent psychology. To avoid this, the internalist might stretch "motivational set": perhaps Nadia *must* have some latent evaluative attitude (e.g., a disavowed aversion to suffering) or her rationality entails she *should* be motivated. But this risks becoming *externalism in disguise*, smuggling in norms independent of her actual constitution. Worse, it threatens to swallow Tom. Tom’s implanted urge *is* motivationally potent; it moves him. If internalism defines the motivational set purely by what *actually moves* the agent, then the implanted urge, however alien, *does* ground a reason for Tom to help. This conclusion feels deeply counterintuitive – the urge is externally imposed, unendorsed, and disconnected from Tom’s identity or values. Internalism seems forced to either deny Nadia a reason (implausibly) or grant Tom one (equally implausibly) if it relies solely on occurrent motivation or overly elastic interpretations of latent attitudes.

  Externalism, conversely, posits reasons exist independently of an agent's motivations – the suffering gives Nadia a reason objectively. This readily explains the community's insistence. However, Tom exposes externalism's vulnerability: if reasons are entirely independent of the agent's perspective, what makes a reason *for Tom* specifically? The externalist might say the stranger's need *is* a reason for Tom (and everyone), regardless of his implanted urge. But Tom’s *being moved* by the implanted urge seems irrelevant to the *existence* of his reason, only to his *recognition* or *motivation*. Yet, this feels detached. If Tom has a reason solely because of the objective need, completely independent of his subjective makeup (including the disowned urge), then why does the externalist verdict for Nadia (she has a reason) feel more compelling than for someone utterly oblivious? Externalism struggles to articulate why Nadia’s lucidity matters without implicitly appealing to her capacity to *recognize* the objective reason, which edges back towards her perspective. To avoid being "floating," externalism needs an account of why certain agents (like Nadia, but not perhaps a psychopath) are *appropriately subject* to certain objective reasons, which again risks incorporating elements of the agent's nature or capacities – potentially conceding ground to a more sophisticated internalism.

  The crux lies in the *kind* of connection required between the reason and the agent. Both cases suggest that neither brute motivation (Tom) nor brute objectivity (Nadia without connection) suffices. A promising synthesis might lie in a **constitutive account** of agency. Perhaps reasons are grounded in what is constitutive of being a practical agent – commitments to minimal rationality, coherence, or responsiveness to value inherent in having a perspective at all. For Nadia, her rational capacities and engagement in evaluation might entail that recognizing the suffering *constitutively commits* her to caring, even if she currently feels nothing. Her "existing set" includes her agency-constituting features. For Tom, the implanted urge is *merely* causal, bypassing his agency; it doesn't engage his evaluative capacities or commitments. It moves him *as an object*, not *as an agent*. Thus, it grounds no *reason*, only a cause. This preserves the intuition that Nadia has a reason grounded *in her* (as an agent), while Tom does not have a reason grounded in the urge, though he might still have an objective reason grounded in the need. This approach navigates the tension by demanding reasons engage the agent *qua* agent, not just *qua* moved object or abstract subject of objective norms. It explains why Nadia's lucidity matters (it activates constitutive features) and why Tom's urge fails (it bypasses them). The challenge becomes defining these constitutive features robustly without circularity, but Nadia and Tom powerfully illuminate why it’s necessary.

  ---

  ## Marking Scheme (Total: 25 marks)

  1.  **Identification & Articulation of the Core Tension (5 marks):** Clearly identifies the specific challenge Nadia poses to strict internalism (no motivation despite facts/lucidity) and Tom poses to expansive internalism/motivational grounding (effective but alien urge), and articulates the resulting tension: Can internalism capture Nadia without swallowing Tom? Can externalism bind Nadia without floating free? Avoids merely reciting internalism/externalism definitions.
      *   *Common Pitfall (2-3 marks):* Describes the cases and general internalism/externalism positions but fails to pinpoint the *specific reciprocal challenge* each case poses to the other camp or states the tension vaguely.

  2.  **Critical Engagement with Internalism's Dilemma (5 marks):** Critically examines attempts to fit Nadia into internalism (e.g., stretching "motivational set," appealing to latent attitudes or rationality) and demonstrates why these either fail to convincingly ground a reason *in her* or risk implausibly granting Tom a reason based solely on the urge's motivational efficacy. Shows understanding that saving Nadia threatens to collapse internalism's distinctiveness.
      *   *Common Pitfall (2-3 marks):* Simply asserts internalism fails for Nadia or succeeds/fails for Tom without exploring *how* internalism might try to accommodate Nadia and *why* those attempts are problematic or lead to accepting Tom's urge as reason-grounding.

  3.  **Critical Engagement with Externalism's Dilemma (5 marks):** Critically examines externalism's ability to explain why Nadia has a reason and why Tom's urge does *not* generate his reason. Demonstrates the difficulty externalism faces in explaining why the reason applies *to Nadia specifically* in a normatively binding way without implicitly relying on her capacities (lucidity), and why Tom's being moved by the urge is irrelevant to the *existence* of his reason (if any), potentially making reasons seem detached.
      *   *Common Pitfall (2-3 marks):* Asserts externalism easily handles Nadia and dismisses Tom's urge as irrelevant without grappling with *why* the community's insistence feels compelling for Nadia or *how* externalism anchors reasons to specific agents like Nadia versus Tom or an oblivious person.

  4.  **Development of a Substantive Response/Synthesis (5 marks):** Moves beyond critique to offer a plausible, reasoned approach to resolving the tension. This could involve refining internalism (e.g., focusing on deep commitments, constitutive features of agency), refining externalism (e.g., reasons applying to agents capable of recognizing them), or proposing a distinct framework (e.g., constitutive agency, normative competence). The response must directly address *both* Nadia and Tom and explain *how* it navigates the specific challenges they pose.
      *   *Common Pitfall (2-3 marks):* Only summarizes the problem or proposes a vague solution ("it's complicated," "depends on perspective") without developing a concrete, reasoned alternative that tackles both cases. Solution may address only one case or ignore the tension.

  5.  **Clarity, Structure, and Philosophical Precision (5 marks):** Essay is well-organized, logically structured, and clearly written. Arguments are precise, avoid vagueness, and use the cases of Nadia and Tom effectively as concrete anchors for abstract points. Demonstrates sophisticated philosophical reasoning throughout.
      *   *Common Pitfall (2-3 marks):* Essay is disorganized, jumps between points, uses the cases only superficially, or relies on overly vague or ambiguous language. Reasoning may be simplistic or lack precision.

  **Distinction (21-25):** Excels in all categories, demonstrating deep insight into the reciprocal challenges, sophisticated critique of both positions, and a creative, well-argued synthesis that productively engages the crux. Exceptionally clear and precise.  
  **Strong Pass (16-20):** Good identification of tension, solid critique of both positions, attempts a reasoned response, generally clear. May have minor weaknesses in synthesis depth or precision.  
  **Pass (11-15):** Identifies basic tension, some critique of one or both positions (may be uneven), limited or underdeveloped response, adequate clarity. May struggle with the reciprocal nature of the challenge.  
  **Fail (≤10):** Fails to grasp the core tension, misrepresents cases or positions, lacks critical analysis, no substantive response, unclear or poorly argued.
