    Economist A: "I need $990 for my research on luxury goods inflation."
    Economist B: "I just want $10 for a data plan."

    They use Kalai-Smorodinsky.

    The result: A gets $990.10, B gets $9.90.

    B: "That's unfair! You got almost everything!"
    A: "No, it's fair: we both got 99% of our ideal gains. You wanted $10, you got $9.90: that's 99% of the way from $0 to $10. I wanted $990, and I got $990.10? Wait, no: I wanted $1000? Actually, the ideal point for me is $1000 because without you I could have taken the whole grant. So I got 99.01%."

    B: "But in absolute terms, I got $9.90 and you got $990.10! That's a huge difference."
    A: "Proportionally, it's the same sacrifice."

    B: "Proportional to what? My sandwich is now 10 cents short!"

    Alternatively, we can make the aspirations even more lopsided.

    Let me adjust: 
        A: "I need $999.99 for my diamond-encrusted lab equipment."
        B: "I just want a penny for a gumball."

        Then with KS: 
            Ideal point: (1000, 0.01)
            Line: y = (0.01/1000) x = 0.00001 x.
            Frontier: x+y=1000 -> y=1000-x.
            So: 1000-x = 0.00001x -> 1000 = 1.00001x -> x≈999.99, then y≈0.01 (but exactly: 1000-999.99=0.01? but 999.99 is an approximation).

        Actually: 1.00001x = 1000 -> x = 1000/1.00001 ≈ 999.9900001, then y=1000 - 999.9900001 = 0.0099999.

        So A gets $999.9900001 and B gets $0.0099999 (which is about 0.01 cents?).

        Proportion for B: (0.0099999 - 0) / (0.01 - 0) = 0.0099999/0.01 = 0.99999 (99.999%).
        A: (999.9900001 - 0) / (1000 - 0) = 0.9999900001 (99.99900001%).

        So very close.

    Joke:

        Two economists are dividing $1000. 
        The first says, "I need $999.99 for my research on the marginal utility of yachts."
        The second says, "I just want a penny for a gumball."

        They use Kalai-Smorodinsky.

        The first walks away with $999.99, the second with a fraction of a penny.

        The second protests: "I got less than a penny! I can't even buy half a gumball!"
        The first replies: "But proportionally, we both got 99.999% of our ideal gains. It's the definition of fair."

        The second sighs: "Next time, I'm asking for a private jet."

    This highlights the lopsided absolute outcome despite proportional fairness.

    We can add a Nash comparison if we want, but it might make the joke longer.

    With Nash: 
        In this scenario, if we use Nash, we maximize x * y subject to x+y=1000, x>=0, y>=0.
        The maximum is at x=500, y=500.
        Then the second economist gets $500, which is way more than a penny.

    So:

        Two economists are dividing $1000. 
        The first says, "I need $999.99 for my research on the marginal utility of yachts."
        The second says, "I just want a penny for a gumball."

        They consider Kalai-Smorodinsky.

        The first explains: "KS will give us the same proportion of our ideal gains. You'll get 99.999% of a penny, and I'll get 99.999% of $1000. That's fair."
        The second says, "How about Nash? It maximizes the product of gains."
        The first quickly calculates: "Nash would give you $500 and me $500. But that's absurd! You only wanted a penny!"

        The second replies: "I know, right? I'd feel guilty taking $500 when I only wanted a penny. But if you insist..."

    This is funny because the first economist is trying to avoid Nash because it would give the second economist way more than they asked for.

    But note: the second economist might be sarcastic.

    Final joke incorporating both:

      Two economists are dividing a $1000 grant. 
      A: "I need $999.99 for my research on champagne bubbles in zero-G."
      B: "I just want a penny for a gumball."

      A: "Let's use Kalai-Smorodinsky. It's fair: same proportion of our gains."
      B: "Or Nash?"

      A: (nervously) "No, KS is better! With Nash, you'd get $500 and I'd only get $500. That's not fair: I'd be getting only half my ideal gain, while you'd get 50,000 times yours!"

      B: "Exactly. So you're saying KS giving me 99.999% of a penny is fairer than Nash giving me $500? How about I take the $500 and buy 50,000 gumballs... and you take your proportion and buy a fraction of a champagne bubble?"

      A: "Proportionally, it's the same sacrifice."

      B: "Fine. Then I want to renegotiate my ideal point: I now require $1 million for my gumball research. With KS, that means I get 99.999% of a million, right?"
      A: (paling) "Actually, individual monotonicity says expanding your options won't reduce your share... so yes. But now the math gives you $999.99 and me $0.01? Wait, that can't be right..."

      [Here, if B changes their ideal point to $1 million, then the ideal point becomes (1000, 1000000). The line from (0,0) to (1000,1000000) has slope 1000. 
          The Pareto frontier: x+y=1000 -> y=1000-x.
          Set 1000-x = 1000 * x -> 1000 = 1001x -> x=1000/1001≈0.999, then y=1000-0.999=999.001.
          So A gets about $0.999 and B gets $999.001.

      So now B gets almost the whole grant.]

      A: "Wait, no! The ideal point is defined by the feasible set, not by what you ask! You can't just declare a million if the total is only $1000. The maximum you can get is $1000. So your ideal point is $1000, same as mine."

      B: "Then we're back to KS giving me a fraction of a penny. Forget it, let's use Nash: we both get $500 and I buy 50,000 gumballs to share."

