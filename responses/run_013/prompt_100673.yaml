prompt: |-
  I teach a mid-level undergraduate seminar in moral psychology, and next week I have to introduce the heterogeneity problem for hedonism — the question of what, if anything, all pleasures have in common. My students will have read Bentham and Mill and will arrive confident that they already know what pleasure is. Do not explain hedonism or the problem to me; I know the terrain. What I need is a teaching plan: the order in which the pieces have to come so that the problem feels forced rather than contrived, the single case that should carry the whole session, the misconceptions the students will bring or form and the exact point in the sequence where each should be headed off, and one closing question that will tell me whether they have felt the force of the problem rather than merely memorized a taxonomy.

  Build the session so that it begins from the students' own introspection rather than from a definition. I do not want to announce that pleasure is heterogeneous and then defend the claim; I want them to discover that their confident report of what pleasure feels like collapses on their own cases. Make each step forced by the one before it: the moment the naive sensory-quality answer is stated, the cases that break it should already be on the table, and the attitudinal response should arrive as a repair the students themselves propose rather than as a position I hand them. I am tempted to carry the session on the pleasure of relief — the scratch finally scratched, the headache that stops — but tell me whether that is the right carrier or whether something else does the job better, and in either case say what the carrying case must contain and what it must not contain. In particular, it has to include at least one pleasure the students will resist calling a pleasure at all and at least one they will insist is not a bodily sensation, and it must not be a case so exotic that they treat it as a curiosity rather than as a test of their own view.

  I expect three misconceptions in particular: first, that pleasure is simply a sensation with a characteristic felt quality; second, that the attitudinal view is trivially true because liking something is obviously part of enjoying it; third, that the whole problem is merely verbal. Tell me where in the arc each of these surfaces, which of them the students will voice and which will stay silent, and how I should handle each at that moment rather than in a general cleanup at the end.

  Finally, tell me what to leave out — which disputes I should explicitly set aside at this level and name as set aside, rather than let them leak in and muddy the session — and give me the one closing question whose answers would reveal the difference between a student who can recite the positions and a student who has understood why the problem is a problem.
reasoning: |-
  We are designing a single-session teaching plan to force the heterogeneity problem for hedonism. The goal is to have students discover that their introspective account of pleasure (as a uniform sensation) fails when applied to diverse cases. The session should start from introspection and build step-by-step, with each step forced by the previous one. We want to avoid announcing the problem and instead let it emerge.

  Key elements:
  - Start from the students' own introspection: ask them to describe what pleasure feels like in a simple case.
  - Use cases that break the naive sensory view, including at least one they resist calling pleasure and one that isn't a bodily sensation.
  - The attitudinal view should emerge as a repair they propose.
  - Address three misconceptions: (1) pleasure as a sensation with a characteristic quality, (2) attitudinal view as trivially true, (3) the problem as merely verbal.
  - The case of relief (e.g., headache stopping) is a strong candidate but we must choose carefully to avoid being exotic and to include the required elements.

  Plan:

  1. **Opening (Introspection):** Ask students to close their eyes and recall a recent, simple pleasure (e.g., eating chocolate, drinking water when thirsty). Then ask: "What did it feel like? Describe the sensation." Elicit a few responses. Expect answers like "warm," "tingling," "sweet," "satisfying." The goal is to get the naive sensory view on the table.

  2. **First Challenge (Breaking the Sensory View):** Present a case that fits the sensory description but is not typically considered pleasure: e.g., the sensation of relief when a headache stops. Ask: "Is that feeling of relief a pleasure?" Most will say yes. Then ask: "What does it feel like? Describe the sensation." They may say "it feels like the pain going away" or "a release of pressure." Then challenge: "But when the headache stops, is there a positive sensation? Or is it just the absence of pain?" This introduces the idea that relief might not have a positive sensory quality.

     - Now present a case they might resist calling pleasure: the pleasure of solving a difficult puzzle. Ask: "When you finally solve that puzzle, is that a pleasure? If so, what does it feel like?" They may struggle to describe a sensation. Some might say "it feels satisfying" but then we ask: "Is satisfying a sensation? Or is it more about your attitude toward the solution?"

     - This step breaks the sensory view by showing:
       - Relief: may not have a positive sensory quality (it's the cessation of a negative).
       - Intellectual pleasure: hard to locate as a sensation.

  3. **Broadening the Challenge (Non-Bodily Pleasures):** Present a clear non-bodily pleasure: e.g., the pleasure of hearing that a loved one is safe. Ask: "What sensation do you feel when you hear that good news?" They might say "a warm feeling in the chest" or "a wave of relaxation." But then challenge: "Is that sensation the pleasure? Or is it just a bodily reaction? And what if you didn't have that bodily reaction? Would it still be pleasurable?" This introduces the possibility that the pleasure is in the attitude toward the news, not the sensation.

     - Another case: the pleasure of a beautiful sunset. Ask: "What sensation does the beauty produce?" They may say "awe" or "calm," but then we note that awe isn't a sensation in the same way as sweetness.

  4. **The Repair (Attitudinal View):** By now, students should be confused because they cannot find a common sensory quality. Ask: "What do these experiences have in common if not a sensation? Let's brainstorm." Expect someone to say "they are all things we like" or "we enjoy them." This is the attitudinal view emerging.

     - But now we must head off the second misconception: that the attitudinal view is trivially true. Because if they propose that pleasure is just whatever we like, then we must challenge: "But is that what you meant by pleasure at the start? You were talking about sensations. Now are you changing the definition?" Point out that the attitudinal view is a different account. And then ask: "Is there a difference between liking something and having a pleasant sensation? For instance, can you like something without feeling a pleasant sensation? (e.g., you might be glad your loved one is safe even if you don't feel any particular sensation). And can you have a pleasant sensation without liking it? (e.g., an addict might feel a pleasurable rush from a drug they wish they didn't take)."

  5. **Addressing Misconceptions:**
     - **Misconception 1 (Pleasure as sensation):** This is the starting point and is broken by the cases. It surfaces at the beginning and is challenged in step 2 and 3. We handle it by showing that the sensory description fails for many clear cases of pleasure.
     - **Misconception 2 (Attitudinal view trivially true):** This surfaces when the attitudinal view is proposed. We handle it by distinguishing between the sensory and attitudinal accounts and showing that they are not the same (using the examples of gladness without sensation and sensation without liking). We make clear that the attitudinal view is a substantial shift, not a trivial restatement.
     - **Misconception 3 (Merely verbal):** This might surface after the attitudinal view is introduced. Someone might say: "So what? Maybe we just use 'pleasure' in two ways: for sensations and for attitudes." We handle it by stressing the theoretical importance: hedonism is a theory about what makes life good. If pleasure is heterogeneous, then what is the common good-making feature? Is it a sensation? An attitude? Or is there no single thing? This problem challenges the unity of the good in hedonism.

  6. **The Carrier Case:** I agree that relief is a strong carrier. It should contain:
     - A clear case of pleasure (so they agree it's pleasure).
     - But one that lacks a positive sensory quality (it's the removal of a negative).
     - Also, it must not be exotic (everyone has experienced relief).
     - We can also include an intellectual pleasure (like puzzle-solving) to force the non-bodily point and one they might initially resist (but we can get them to agree it is pleasure).

     However, the case of relief might be too easily accepted as a sensation (if they say "it feels good when the pain stops"). So we need to push: "But what is the positive sensation? When the headache stops, what do you feel? Is it a new positive feeling or just the absence of the negative?" This forces them to see that it might not be a sensation.

     Also, we can use the case of being glad about the news (non-bodily) and then ask: "But if you were paralyzed and couldn't feel any bodily sensations, would you still be glad? And if so, would that be a pleasure?" This challenges the necessity of sensation.

  7. **What to Leave Out:**
     - Do not get into the debate about whether pleasure is the only intrinsic good (that's for another session).
     - Set aside the question of how to measure pleasure (Bentham's felicific calculus) because that's a separate issue.
     - Explicitly say: "We are not asking whether pleasure is the only good, but what pleasure is. And we are not asking how to compare pleasures, but what they have in common."
     - Also, set aside any metaphysical debates about the nature of attitudes or sensations. We are staying at the phenomenological level.

  8. **Closing Question:** We want to see if they have felt the force of the problem. Ask: **"If you had to explain to someone who has never experienced pleasure what it is, using only one example, which example would you choose and why would that example be inadequate?"**

     - The answer should reveal that they see the problem: if they choose a sensory pleasure (like chocolate), then it won't capture the pleasure of relief or intellectual pleasure. If they choose an attitudinal case (like being glad), then it doesn't capture the sensation. They should see that no single example can represent all pleasures because they are too diverse.

  This question forces them to confront the heterogeneity: any example they pick will leave out some central kind of pleasure.

  **Detailed Session Outline:**

  **Time: 75 minutes**

  1. **Introspection (10 min):**
     - Ask students to recall a simple sensory pleasure and describe the sensation. Write key descriptors on the board (e.g., warm, sweet, tingly).
     - Then ask: "So is pleasure a kind of sensation? And if so, what is the common quality?"

  2. **Breaking the Sensory View (20 min):**
     - Present the relief case: "Think about when a headache you've had for hours finally stops. Is that a pleasure? [Yes] What does it feel like?" 
       - They may say: "It feels like the pain going away." 
       - Push: "But is that a positive sensation? Or just the absence of a negative one?"
     - Present the intellectual pleasure case: "What about when you solve a difficult problem? Is that a pleasure? What sensation do you feel?" 
       - They might say: "A sense of satisfaction." 
       - Push: "Is that a sensation? Or is it more about your attitude toward the solution?"
     - Present the non-bodily case: "You hear that your loved one who was in danger is safe. What sensation do you feel? And is that sensation the pleasure, or is the pleasure in the fact that you are glad about the news?"
     - Point: "We started with a sensory account, but these pleasures don't seem to fit. What do they have in common?"

  3. **Proposing the Attitudinal View (15 min):**
     - Ask: "What else might these experiences share? Is it that we like them? Or that we are glad about them?"
     - Write the attitudinal view on the board: pleasure = taking an attitude of liking or enjoyment toward something.
     - Then challenge: "But wait, is this the same as what we started with? When you ate the chocolate, you had a sensation and you liked it. Now, in the relief case, is there a sensation? Or just an attitude? And in the news case, can you have the attitude without any particular sensation?"
     - Introduce the counterexamples:
       - Can you like something without a pleasant sensation? (e.g., being glad about the news without any bodily feeling)
       - Can you have a pleasant sensation without liking it? (e.g., an addict's rush that they despise)

  4. **Addressing the Misconceptions (15 min):**
     - **Misconception 1 (sensation):** Already broken by the cases. Recap: "We thought pleasure was a sensation, but then we saw cases without a clear positive sensation."
     - **Misconception 2 (attitudinal trivial):** When they propose the attitudinal view, ask: "Is this a new account? How is it different from the sensation view?" Then use the counterexamples to show it's not trivial.
     - **Misconception 3 (merely verbal):** If a student says it's just two meanings, respond: "But hedonism claims that all pleasures are good in the same way. If there is no common feature, then is there a single thing that makes life good? Or are we lumping together different kinds of good under one word?"

  5. **Wrap-up and Closing Question (15 min):**
     - Summarize the problem: "We started with a simple idea of pleasure as a sensation, but we found pleasures that don't fit: relief, intellectual, non-bodily. Then we tried an attitudinal view, but that seems to leave behind the sensory aspect. So what is the common thread?"
     - State what we set aside: "We haven't solved the problem today. And we set aside the question of whether pleasure is the only good and how to measure it. We're just asking: what is pleasure?"
     - **Closing Question:** "If you had to explain to someone who has never experienced pleasure what it is, using only one example, which example would you choose and why would that example be inadequate?" 
       - Have them write a brief response and then share a few. Look for recognition that any example fails to capture the full diversity.

  This plan should lead the students from their own introspective reports to the collapse of the sensory view and the emergence of the attitudinal view as a repair, and then to the realization that neither account captures all cases without tension. The closing question should reveal whether they see the heterogeneity as a deep problem.
answer: |-
  Below is a step-by-step teaching plan designed to force the heterogeneity problem through introspection, using the **pleasure of relief** as the primary carrier case. The session is structured to make the problem feel inevitable, with each step emerging from student input. Misconceptions are addressed in real-time, and the closing question tests genuine understanding. Total time: 75 minutes.

  ---

  ### **Session Structure: The Arc of Discovery**
  **Core Carrier Case:** **Relief** (e.g., a headache stopping, an itch scratched).  
  *Why it works*:  
  - Universally relatable, non-exotic, and *lacks a positive sensory quality* (it’s defined by the *absence* of pain).  
  - Includes a pleasure students might initially resist labeling as "pleasure" (e.g., relief from anxiety), and a non-bodily case (e.g., relief from mental stress).  
  - Avoids edge cases (e.g., masochism) that distract from introspection.

  #### **What the Carrier Case Must Include**  
  1. **A "resisted" pleasure**: Relief from anxiety (students may say, "It’s just calm, not pleasure").  
  2. **A non-bodily pleasure**: Relief after solving a difficult problem (e.g., finishing a thesis).  
  3. **No exotic examples**: Stick to mundane experiences (no drug highs or rare fetishes).

  #### **What to Explicitly Set Aside**  
  Announce upfront:  
  - *"We’re not debating whether pleasure is the only good (hedonism’s core claim), only what all pleasures share."*  
  - *"We’re setting aside Mill’s ‘higher/lower’ pleasures—assume all examples are equally valuable."*  
  - *"We’re not solving the problem today—only exposing it."*  
  *(This prevents distractions about measurement, hierarchy, or moral implications.)*

  ---

  ### **Step-by-Step Teaching Plan**
  #### **Step 1: Elicit the Naive View (10 min)**  
  - **Activity**: Ask students to close their eyes and recall a vivid sensory pleasure (e.g., biting into ripe fruit). Pose: *"Describe what pleasure *feels like* in your body—its raw sensation. Don’t use metaphors like ‘satisfying’; tell me its texture, temperature, location."*  
  - **Expected Responses**: "Warm," "tingling," "sweet rush," "buzzing in my chest." *Write these on the board*.  
  - **Goal**: Lock in **Misconception 1** (pleasure is a uniform sensory quality). Students will *voice* this confidently.  

  #### **Step 2: Introduce Relief—Break the Sensory View (15 min)**  
  - **Carrier Case**: *"Recall a throbbing headache that suddenly stops. Did you feel pleasure? If so, describe the *sensation* (not the absence of pain)."*  
    - **Student Reactions**: Most will say yes but describe "nothing" or "cool emptiness." *Some will resist calling it pleasure at all*: "It’s just pain leaving!"  
  - **Follow-Up**: Contrast with sensory examples. *"Is the ‘cool emptiness’ the same *kind* of sensation as the ‘warm buzz’ of chocolate? If not, what unites them?"*  
  - **Pivot Point**: When a student says, "It’s not a sensation—it’s relief!" write: **"Relief = ?"** on the board. Highlight the tension.  

  #### **Step 3: Broaden to Non-Bodily Cases—Deepen the Break (15 min)**  
  - **Non-Bodily Case**: *"Think of relief after months of anxiety—e.g., waiting for medical results, then learning you’re fine. Is that pleasure? Describe the sensation."*  
    - **Expected Pushback**: Students will say, "It’s mental, not bodily!" or "I felt nothing—just calm." *This is the resisted case*.  
  - **Intellectual Pleasure Case**: *"After solving a hard problem, you feel relief. Is that sensation the same as eating cake?"*  
    - **Key Move**: Point to the board: *"You called chocolate ‘tingly’ and relief ‘nothing.’ If both are pleasure, what do they share besides ‘feeling good’?"*  
  - **Goal**: Make sensory view untenable. Students now *silently* feel the problem; some will voice **Misconception 3** ("This is just semantics!").  

  #### **Step 4: Elicit the Attitudinal View as a Repair (15 min)**  
  - **Prompt**: *"If these don’t share a sensation, what *does* make them all pleasures? Brainstorm one word."*  
  - **Expected Student Proposal**: "Liking," "wanting it to continue," "enjoyment." *Write "Attitude (Liking)" on the board*.  
  - **Immediately Challenge**: *"When you bite into chocolate, is the ‘liking’ separate from the ‘sweet’ sensation? Or are they fused?"*  
    - **Goal**: Surface **Misconception 2** (attitudinal view is trivial). Students will *voice* this: "Liking is part of pleasure—obviously!"  

  #### **Step 5: Break the Attitudinal View (10 min)**  
  - **Counterexample 1 (Liking without sensation)**: *"Can you ‘like’ news that your rival failed, without feeling a physical glow? If so, is that pleasure?"*  
  - **Counterexample 2 (Sensation without liking)**: *"An addict gets a ‘buzz’ from a drug but hates it. Is that buzz still a pleasure?"*  
  - **Reinforce the Problem**: *"If pleasure requires ‘liking,’ why call the addict’s buzz pleasure? If it doesn’t, what unites it with relief?"*  
  - **Outcome**: Students see the attitudinal view doesn’t resolve heterogeneity. **Misconception 3** resurfaces verbally: "Who cares? It’s all subjective!"  

  ---

  ### **Handling Misconceptions in Real-Time**  
  1. **Misconception 1 (Pleasure as sensation)**:  
     - **When it surfaces**: Step 1 (students voice it).  
     - **How to head off**: In Step 2, use relief to show sensations are absent/mismatched. Ask: *"If pleasure requires a ‘tingle,’ does relief count? If not, is your definition excluding everyday pleasures?"*  

  2. **Misconception 2 (Attitudinal view is trivial)**:  
     - **When it surfaces**: Step 4 (students propose "liking" and treat it as obvious).  
     - **How to head off**: Immediately use Step 5’s counterexamples. Ask: *"If pleasure is ‘liking,’ is the addict’s buzz *not* pleasure? But we called similar sensations pleasure earlier. Why the inconsistency?"*  

  3. **Misconception 3 (Merely verbal)**:  
     - **When it surfaces**: Steps 3 (silent) and 5 (voiced).  
     - **How to head off**: When a student says "This is wordplay!": *"If we can’t define ‘pleasure,’ how can hedonism claim it’s the *one* thing that makes life good? Does ‘good’ collapse too?"* (This ties the problem to hedonism’s coherence.)  

  ---

  ### **The Closing Question**  
  **Pose: *"Imagine you must design a machine that *detects* pleasure in real-time. What single signal would you program it to look for—and what would your design *miss* or *mistake*?"***  

  - **Why it works**:  
    - A student who *recites* will say: "Measure smiles!" (sensory) or "Track desire!" (attitudinal).  
    - A student who *feels the problem* will say: *"There’s no single signal. If I track brain chemistry, I’d miss relief. If I track self-reports, I’d confuse ‘liking’ with satisfaction. The machine would fail because pleasure isn’t one thing."*  
  - **Assessment**: Listen for recognition of *irreducible heterogeneity* and its implications for hedonism’s foundation.  

  ---

  ### **Why This Works**  
  - **Relief carries the session** because it’s ordinary yet fractures introspection: it lacks positive sensation, invites resistance ("Is relief *really* pleasure?"), and extends cleanly to non-bodily cases (e.g., anxiety relief).  
  - **The arc mirrors self-discovery**: Students state a view (Step 1), break it themselves (Steps 2–3), propose a repair (Step 4), and break it again (Step 5). The problem *builds*; it isn’t announced.  
  - **Misconceptions are fuel**: Each is surfaced and used to deepen the problem (e.g., the attitudinal view isn’t handed to them—it’s their lifeline before it snaps).  

  By the end, students won’t just know the heterogeneity problem—they’ll have lived its inevitability. The closing question ensures they can’t unsee it.
