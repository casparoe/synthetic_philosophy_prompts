  **(Speech begins - 797 words)**

  Good evening. I’ve spent 22 years under the fluorescent lights of the ER at County. If you’ve ever been there past midnight, you’ve seen it too: that space where exhaustion meets adrenaline, where the weight of a life can hang on the thinnest thread. I’ve seen people walk out who shouldn’t have. I’ve seen people who did everything right, who fought so hard, not make it. And I’ve learned this: you absolutely cannot predict which tiny, ordinary moment will flip everything upside down.

  Was it the ambulance catching every green light? The nurse who double-checked the chart because a name *almost* sounded familiar? The family member who arrived just in time to say, “It’s okay, you can go”? Or the bus stuck in traffic that meant they didn’t? The shift trade that put *this* particular nurse at *that* particular bedside? The bed that opened up, or the one that didn’t?

  We look for patterns. We crave reasons. We want the story to make sense. Someone tells a grieving family, “Everything happens for a reason.” I’ve sat with those families at 2 AM. I’ve never said those words back. Because I don’t know if that’s true. And more importantly, in that moment, it rarely feels like kindness. It feels like erasing the terrifying, beautiful randomness of it all. It pretends we understand the machinery when mostly, we’re just learning which levers *might* do something.

  Here’s a way of thinking about it a friend helped me see. Some small events are like **sparks**. The tinder is piled high, the conditions are perfect. Any spark would have started the fire. That specific spark? It’s not special. It was just the one that happened to land. Other small events are like **hinges**. Take that one pin, that one tiny turn, away, and the whole massive door swings shut on a completely different future. Nothing else steps in to take its place. That one moment carried the weight.

  The brutal truth, the beautiful truth, is this: **You almost never know, in the moment or even looking back, whether you’re looking at a spark or a hinge.** Was it the crucial intervention, or just the one that happened to land when the patient was finally ready? Was it the missed sign, or was the path already set? We don’t get that clarity.

  That cuts both ways.
  It means you cannot control the outcome. You cannot guarantee the save. You cannot shoulder the blame for the hinge that swung against you, any more than you can claim sole credit for the hinge that swung in your favor. The system – biology, circumstance, luck, the bus schedule – is too big, too turbulent. Small changes can have massive, unpredictable effects down the line. Physicists call it sensitive dependence. We call it Tuesday.

  But here’s the other edge of that blade, and this is why we’re here tonight, pinning you: **Because you never know if it’s a spark or a hinge, you have to treat every single moment, every single action, as if it *could* be the hinge.** Because sometimes, it absolutely is.

  That “useless” double-check? It might be the hinge.
  That extra minute holding a hand in silence? It might be the hinge.
  The question you ask that seems obvious? It might be the hinge.
  The chart you review one more time? It might be the hinge.
  The shift you cover? It might be the hinge.
  The calm voice in the chaos? It might be the hinge.

  You won’t know. You won’t get a medal for it. You probably won’t even remember it. But the possibility *demands* your presence. It demands your attention to the mundane, the routine, the seemingly insignificant. It demands that you show up, fully, for the spark that *might* just be the hinge holding the door open.

  This isn’t about false promises. It’s not “you can do anything!” It’s not “the future is yours!” It’s not destiny. It’s the opposite. It’s acknowledging the profound uncertainty. It’s admitting we don’t control the wind or the waves. But it’s also about the fierce, necessary insistence that **your effort matters**. That your skill matters. That your compassion matters. That your showing up, tired, human, imperfect, matters. Not because it guarantees victory, but because it’s the only force we have against the randomness. It’s the load-bearing wall we build together, shift by shift, patient by patient.

  You are stepping into the turbulent system. You will see things that defy reason. You will carry losses that feel senseless. You will witness recoveries that feel miraculous. You will never have all the answers. Don’t reach for cheap comfort. Don’t pretend you see the grand design.

  Instead, show up. Pay attention. Do the small things well. Treat every moment, every patient, every action, as if it *could* be the hinge. Because sometimes, against all odds, it is. And that possibility – that terrifying, exhilarating, weighty possibility – is why we pin you tonight. It’s why we trust you with the moments that matter, even when we can’t see which ones they are.

  Welcome to the storm. Build the wall. Watch for the hinges. We need you.
