prompt: |-
  My friend Dee and I spent two hours arguing about enhancement last night and I still can't work out what rule she's actually running. Her track record, every verdict delivered like it's self-evident: LASIK for myopia, fine. Growth hormone for a kid whose pituitary doesn't work, fine. Growth hormone for a kid who's just short and whose parents want him taller, no. Cochlear implants for a deaf infant, fine — but parents who deliberately pick a deaf embryo, she thinks are out of their minds. Modafinil for healthy students the week before finals, no. Beta blockers for a violinist who's just nervous about an audition and doesn't have an anxiety disorder, no. SSRIs for real depression, fine. Adderall for real ADHD, fine.

  Every one of those comes out the same whether she's running the line that medicine restores normal functioning and doesn't get to optimize people past it, or the line that the therapy/enhancement split is a red herring and the only things that matter are whether it harms you and whether it buys you an unfair edge. So I can't tell which one she's committed to, and i dont think she can either.

  Here's the case I want you to rule on for her. A healthy adult with normal vision and nothing wrong with her eyes wants a one-time gene therapy that would let her see a bit into the near ultraviolet. Cheap, safe, permanent, no side effects, and it doesn't make her better than anyone at anything anyone competes for. What does Dee say? Which of her rules is doing the real work? And what case would actually settle it — my guess is you'd need one that cuts the other way, a genuine therapy that happens to hand you a big competitive edge over everyone else, but tell me if there's a sharper one.
reasoning: |-
  Okay, the user presents an interesting philosophical dilemma about medical ethics, specifically the therapy vs. enhancement debate. They've observed their friend Dee consistently judging various medical interventions but can't pinpoint her underlying ethical framework. The core question revolves around a hypothetical gene therapy for UV vision in a healthy person.

  First, I need to analyze Dee's pattern of judgments. Her approvals (LASIK for myopia, growth hormone for pituitary issues, cochlear implants for deaf infants, SSRIs for depression, Adderall for ADHD) all involve restoring typical human functioning. Her rejections (growth hormone for height, embryo selection for deafness, modafinil for exams, beta-blockers for performance anxiety) all aim to exceed natural baseline capabilities or alter fundamental human experiences.

  The UV vision case is fascinating because it doesn't fit neatly into either category. It's not restoring normal function since humans don't naturally see UV, nor does it provide competitive advantage or cause harm. This creates tension between Dee's possible principles: restoration vs. harm/unfair advantage.

  I recall similar debates in bioethics literature. The therapy-enhancement distinction is famously messy - think of Julian Savulescu's arguments for cognitive enhancement versus Michael Sandel's concerns about "hyper-agency". The UV case exposes this ambiguity perfectly.

  For a decisive test case, we'd need something that violates one principle while satisfying the other. A competitive edge scenario might work: imagine a treatment restoring normal function but giving massive advantage (like curing a disease with side-effect of super-endurance). Alternatively, consider an enhancement with zero competitive impact but that alters human experience fundamentally (like permanent mood elevation).

  The user's frustration is palpable - they've clearly thought deeply about this. Their request for a "sharp" test case suggests they want to resolve the philosophical tension, not just get an answer. This seems like someone engaged in genuine conceptual exploration, possibly in academic or medical ethics circles. The emotional subtext hints at intellectual camaraderie mixed with friendly frustration toward Dee.

  Notably, all Dee's examples involve bodily or cognitive interventions - nothing about aesthetic enhancements or lifespan extension. This might indicate her framework centers on functional capabilities rather than appearance or longevity. The UV vision question cleverly tests this boundary by targeting sensory perception without practical utility.
answer: |-
  Based on Dee's track record and the UV vision case, here's the breakdown:

  1.  **What Dee Says:** **No.** She would not approve the UV gene therapy.
  2.  **Which Rule is Doing the Real Work:** **The "restores normal functioning" rule.**

  **Why:**

  *   **Analysis of Dee's Record:**
      *   **Approvals:** LASIK (restores normal vision), Growth Hormone for pituitary deficiency (restores normal growth potential), Cochlear implants (restores auditory function), SSRIs for depression (restores normal mood regulation), Adderall for ADHD (restores normal attention regulation). All aim to bring the individual *to* a typical species-typical functional baseline.
      *   **Rejections:** Growth Hormone for short stature (aims to go *beyond* baseline), Selecting deaf embryo (chooses a *different* baseline, seen as deficient by Dee), Modafinil for healthy students (enhances cognition *beyond* baseline for non-medical reason), Beta-blockers for normal nerves (enhances performance *beyond* baseline anxiety level). All aim to go *beyond* or deliberately *alter* the typical species-typical functional baseline.
  *   **The UV Vision Case:**
      *   **Fits the Enhancement Pattern:** The woman has *normal, species-typical vision*. The gene therapy isn't fixing a deficit or restoring lost function; it's adding a novel sensory capability humans don't naturally possess. This is a clear enhancement beyond the baseline.
      *   **Doesn't Trigger the Harm/Unfair Edge Rule:** As described (cheap, safe, permanent, no side effects, no competitive advantage), it avoids the concerns of the *second* rule. There's no harm to prevent, and no unfair edge being created.
  *   **Conclusion:** Since the UV therapy is unambiguously enhancement (adding a non-standard function) and gets a "No" *despite* avoiding harm/unfairness concerns, the "restores normal functioning" rule is the dominant one driving Dee's judgment. The harm/unfairness rule only seems to come into play *within* the category of enhancements she's already inclined to reject, reinforcing the "No" but not being the primary filter.

  **The "Sharper" Test Case to Settle It:**

  You're right that a case where the two rules conflict is needed. The UV case only shows the restoration rule working *without* conflict. Here's the decisive test:

  **The Case: "RestorePlus" - A genuine therapy that confers a massive, relevant competitive edge.**

  *   **Scenario:** A treatment exists for a rare, debilitating neurological disorder ("NeuroDegen") that causes severe motor impairment, chronic pain, and cognitive decline. Without treatment, sufferers become wheelchair-bound and require full-time care within a decade.
  *   **The Treatment:** "RestorePlus" is a one-time gene therapy that completely halts NeuroDegen's progression, restores lost motor function to normal baseline levels, eliminates the pain, and prevents cognitive decline. Crucially, it *also* happens to permanently enhance fine motor control, reaction times, and spatial reasoning to levels *significantly* beyond the human norm – making recipients exceptionally gifted in fields like surgery, competitive gaming, piloting, or micro-assembly.
  *   **The Patient:** A young adult diagnosed with early-stage NeuroDegen, already experiencing mild symptoms. They are a talented but not elite aspiring neurosurgeon.
  *   **The Question:** Would Dee approve "RestorePlus" for this patient?

  **How This Test Case Cuts:**

  *   **The Restoration Rule:** "RestorePlus" *absolutely* restores normal functioning. It halts a devastating disease and brings the patient back to (and beyond) the species-typical baseline for motor skills, pain, and cognition affected by the disease. **This rule strongly says YES.**
  *   **The Harm/Unfair Edge Rule:**
      *   *Harm:* Avoiding the horrific harm of NeuroDegen is the primary goal. The enhancement is a side effect.
      *   *Unfair Edge:* The enhancement *does* create a massive, inherent competitive advantage in many high-stakes professions. It's not just "a bit better"; it's potentially superhuman-level ability crucial for success in those fields.
      *   **This rule would potentially say NO (or at least be deeply troubled) due to the significant unfair advantage created.**

  **Dee's Verdict on "RestorePlus" Reveals Her True Rule:**

  *   **If Dee says YES:** Then the **"restores normal functioning" rule is truly dominant.** The restoration of health overrides the significant unfair edge created by the unintended enhancement side effect. Therapy trumps enhancement concerns, even major ones.
  *   **If Dee says NO (or hesitates strongly):** Then the **"harm/unfair edge" rule is doing significant, independent work, potentially trumping restoration in extreme cases.** She prioritizes avoiding unfairness so highly that she might deny a genuinely therapeutic treatment with massive benefits because it *also* creates an unearned, inherent competitive advantage.

  **Why this is sharper than the UV case:**

  *   The UV case was pure enhancement with no countervailing therapy benefit. "RestorePlus" forces a direct conflict between the core benefit of therapy (restoring health, preventing harm) and the core concern of the other rule (creating unfair advantage).
  *   It eliminates the "it's just adding a harmless quirk" defense possible with UV vision. The advantage here is substantial and directly relevant to success in competitive domains.
  *   It tests whether restoration is an absolute trump card, or whether the unfairness concern can be so severe it overrides a powerful therapeutic need.

  This case cuts to the heart of the conflict between Dee's two potential frameworks and forces her primary commitment to the surface. Based on her track record prioritizing restoration above all else, I suspect she'd say **Yes** to "RestorePlus," confirming the dominance of the "restores normal functioning" rule. But this is the test that would definitively show it.
