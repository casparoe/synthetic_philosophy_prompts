prompt: |-
  I run a small forecasting shop — eight analysts, we sell probability estimates to a handful of institutional clients (mostly insurers, a couple of funds), and our whole pitch is that we hand over a number with a range rather than a shrug. The recuring headache is the split: two analysts come back from the same question with numbers miles apart, 25% vs 65% on whether a merger closes, and I have to ship something by Friday. A colleague in the econ department told me there's a body of work that speaks directly to this, roughly: if two agents start from the same prior, are both fully rational, and it's common knowledge between them what probability each of them currently assigns, then they cannot rationally keep disagreeing — any disagreement that survives all of that has to be coming from different priors, or from one of those idealizations breaking down (they don't trust each other, they aren't perfectly rational, the 'common knowledge' bit was never actually achieved). I want to turn that into a procedure I can run on a live disagreement before a deadline, instead of just guessing who's smarter or splitting the difference because I'm tired.

  You're a decision theorist who also designs decision processes inside real organizations, so you know the result cold and you also know how it falls apart with tired humans. Please start by brainstorming the distinctions that actually do the work here — evidence gaps vs prior gaps, the difference between each analyst merely knowing the other's number and that number being common knowledge, what 'fully rational' is carrying in the theorem, and where the idealization plainly fails for two people with egos and a Friday deadline. Then give me a checklist I can run: the steps in order, what counts as a sufficient answer at each one, when it says send them back to compare evidence and re-run, when it says the disagreement is now about priors rather than facts and here is the rule we apply to prior gaps, and where it has to stop and hand the call to me. A specific thing I want in there: a way to tell a prior gap from an evidence gap, which I assume means making each analyst decompose their number into what they'd have said before the new evidence and what they think the evidence implies — tell me if that's right, and what to do when they can't or won't decompose it. Also the in-room tests: whether the two of them would take opposite sides of a bet at their stated odds, what it means if one won't, and whether asking each to predict what the other will say next week adds anything or is just theatre.

  Then run the whole thing on two cases: (a) two analysts who've both read the same trial data disagree on whether a drug gets approved, 30% vs 70%; (b) two analysts both say 20% but for completely different reasons, which I suspect is a different kind of problem wearing the same clothes. I'd rather you include the case where the procedure tells me something I don't want to hear. Finally, be straight with me about what the procedure can't do — especially the situation where the 'prior gap' is really a values gap, or a disagreement about which model of the world is right, where no further argument is going to close it — and tell me how to present the resulting number to a client without pretending we've resolved something we haven't. Concrete over pretty; I'd take a procedure with three visible holes over a elegant abstraction.
reasoning: |-
  We are dealing with the Aumann's agreement theorem and its practical application in resolving disagreements among forecasters.
   The theorem states: if two agents have the same prior, and their posteriors are common knowledge, then they must have the same posterior.
   In practice, disagreements can arise from:
     (1) Different priors (starting beliefs)
     (2) Different evidence (each has seen different data)
     (3) Different interpretation of the same evidence (which might be due to different models or reasoning)
     (4) Failure of common knowledge (they know each other's numbers but haven't fully shared the reasoning, or they don't trust each other's rationality)

   Steps to resolve a disagreement:

   1. Ensure common knowledge of the current probabilities:
      - Each analyst states their current probability estimate and it is made known to the other.

   2. Decompose the estimate into prior and evidence:
      - Ask each analyst: "What would your probability have been before seeing the new evidence?" (prior)
      - And: "Given that prior, how did the new evidence change your probability?" (likelihood ratio or Bayesian update)

   3. Compare priors:
      - If priors are different, then the disagreement may be due to prior differences. This is a fundamental difference in initial beliefs.

   4. Compare evidence sets and interpretations:
      - Have the analysts share the evidence they are using and their interpretation (how they updated).
      - Check if they have the same evidence. If not, share the missing evidence.
      - Check if they interpret the same evidence differently. This might require a deeper discussion.

   5. Check for rationality and trust:
      - If after sharing all evidence and interpretations, the disagreement persists, it may be due to one or both not updating rationally (e.g., cognitive biases) or not trusting the other's rationality.

   6. Use betting to reveal true beliefs:
      - Ask if they would be willing to bet at the stated odds. If one says 30% and the other 70%, then they should be willing to bet against each other (e.g., the 30% analyst would take the "no" side at odds reflecting 30%-70%).
      - If they are not willing to bet, it suggests their stated probabilities are not their true beliefs.

   7. Predict each other's updates:
      - Ask each analyst: "If your colleague were to see the evidence that you consider most important, what probability would they assign?" and "What if they saw your entire set?"
      - This can help uncover if they are aware of the other's reasoning and whether they think the other would update rationally.

   However, in a time-constrained setting, we need a structured checklist.

   Checklist for resolving a disagreement:

   Step 1: Common knowledge of current estimates
     - Action: Have both analysts state their current probability estimates to each other and to you.
     - Sufficient: Both are aware of the other's number.

   Step 2: Decompose the estimate
     - Action: Ask each analyst to state:
          (a) Their prior probability (before the latest evidence)
          (b) The evidence they have seen (and whether they have seen all the same evidence)
          (c) How the evidence updated their prior (e.g., "I saw X, which I think is twice as likely under A than under B, so I multiplied my odds by 2")
     - Sufficient: Each provides a prior and an update factor (or a clear description of the update).
     - If they cannot decompose: 
          - This is a red flag. It might indicate that they haven't thought clearly or are using intuition. 
          - In this case, ask them to reconstruct: "Assume you had not seen the latest evidence. What would you have said then? Now, what does the new evidence tell you?"

   Step 3: Compare priors and evidence
     - Action: 
          a. If priors are the same -> then the disagreement comes from the update (evidence or interpretation). Go to Step 4.
          b. If priors are different -> then the disagreement may be due to prior differences. Go to Step 5.
          c. If one or both cannot decompose, then you have to treat it as a black box and try to compare the evidence sets. Ask: "Have you both seen the same set of evidence? If not, what is missing for the other?" Then share the missing evidence and have them update again.

   Step 4: Resolving evidence/update disagreement (when priors are the same)
     - Action: 
          - Have the analysts share the evidence they used and their interpretation (how they updated on that evidence).
          - Focus on any evidence that one has and the other hasn't. Share that evidence and have both update again.
          - If they have the same evidence but different interpretations, have them explain their reasoning step by step. Look for:
               - Different weight on the same piece of evidence
               - Different models (e.g., one thinks a factor is causal, the other doesn't)
          - If they update again and still disagree, then the issue is in the model. This is hard to resolve. Go to Step 6.

   Step 5: Resolving prior disagreement (when priors are different)
     - Action: 
          - Ask each analyst to justify their prior. What past data or general knowledge led to that prior?
          - If the prior is based on evidence that the other hasn't seen, share that evidence and update the prior accordingly.
          - If the prior is based on a fundamental difference in world view (e.g., "I think regulators are strict" vs "I think they are lenient"), then this is a prior gap that might not be resolvable by current evidence.

   Step 6: When disagreement persists
     - Action: 
          - Use betting: Ask if they would bet against each other at their stated probabilities. 
            Example: If A says 30% and B says 70%, then A should be willing to bet $30 against B's $70 for a $100 payout if the event happens (so A pays $30 if it doesn't happen, B pays $70 if it does). 
          - If they are not willing to bet, then their stated probabilities are not credible. Press them to adjust.
          - If they are willing, then they are committed. But note: in an organization, we might not want to encourage internal betting. Alternatively, use a virtual bet to test commitment.

   Step 7: Predict each other's updates (optional, if time and trust allow)
     - Action: 
          - Ask each: "If we had a week and your colleague could show you all their evidence and reasoning, what probability do you think they would convince you to hold? And what do you think they would hold?"
          - This can help reveal if they think the other has information or reasoning that would change their mind.

   Step 8: Final resolution
     - If after all steps the disagreement remains, then:
          - If the disagreement is about evidence interpretation (same prior, same evidence) -> average? (but note: this is not theoretically justified) or have a third party break the tie?
          - If the disagreement is about priors -> you might average the posteriors? Or if one prior is better justified, use that? Or use a meta-prior (e.g., average of priors) and then update with the shared evidence?
          - But note: the theorem says they cannot disagree if all conditions hold, so the persistence indicates a breakdown in one of the assumptions. Then you (as the manager) must step in.

   Rule for prior gaps: We might use a weighted average of the posteriors, but the weights are hard to determine. Alternatively, we might go back to the client and present both estimates with the reasoning.

   When to stop and hand over to you:
     - When time runs out (Friday deadline)
     - When the disagreement is about fundamental priors that cannot be resolved by sharing evidence (e.g., different models of how the world works)
     - When one analyst is not being rational (e.g., ignoring evidence, being stubborn) or there's a clear ego issue.

   Additional note: 
     - Sometimes the "prior" gap is really a values gap (e.g., one analyst weights a certain risk factor higher because of a different value judgment) or a model gap (different causal models).

   How to present the result to the client:
     - Be transparent: "Our analysts initially had a range of 25%-65%. After a structured reconciliation process, we are reporting 45% because we found that the differences were primarily in the interpretation of X and Y, and we have averaged those interpretations. However, we note that there remains a fundamental difference in the assessment of Z, which we cannot resolve with current evidence."

   Now, run the procedure on two cases:

   Case (a): Drug approval, 30% vs 70%
     - Step 1: Common knowledge: both know the other's number (30% and 70%).
     - Step 2: Decompose:
          Analyst A (30%): 
            Prior: 50% (before the trial data)
            Update: The trial data was negative because it missed the primary endpoint. He thinks that reduces the chance to 30%.
          Analyst B (70%):
            Prior: 50%
            Update: The trial data showed strong secondary endpoints and the primary endpoint was only narrowly missed. She thinks the FDA will be flexible and it's 70%.

     - Step 3: Priors are the same (50%). So the disagreement is in the update -> Step 4.

     - Step 4: 
          They have the same evidence (trial data) but different interpretations.
          They share their reasoning: 
            A focuses on the strictness of the FDA on primary endpoints.
            B points to historical cases where the FDA approved based on secondary endpoints when primary was close.

          Now, they must update again after hearing each other. 
          Suppose after discussion, A moves to 40% and B moves to 60%. 

          If they still disagree, we go to Step 6: Betting.
            Would A (40%) bet against B (60%)? 
            A would bet $40 against B's $60 for a $100 payout if approved.
            If both are willing, then we have two committed estimates. 

          How to combine? We might average (50%)? But note: we don't have a theoretical reason to average. 
          Alternatively, we might present the range (40%-60%) and note the unresolved difference in interpretation.

          But if time is short and we must ship one number: we could average, or we could use the mean of the two (50%). However, if one analyst is more experienced in FDA approvals, we might weight that one more.

          Alternatively, we might look for additional evidence to break the tie (but deadline may not allow).

          In this case, if they are both committed and rational, and we have no reason to prefer one, the manager might average.

     - Step 8: Hand over to manager? If the disagreement is about the model (how strict the FDA is) and we don't have a way to break it, then we average and report the uncertainty.

   Case (b): Both say 20% but for different reasons.
     - Step 1: Common knowledge: both know they have 20%. No disagreement? 
          But the problem is: they have different reasons. Why is this a problem?
          Because if they are both at 20% but for independent reasons, then the event might be less likely? Or more? 
          Actually, the problem is that if one reason is wrong and the other is right, we might be over or under confident.

     - Step 2: Decompose:
          Analyst A: 
            Prior: 40%
            Update: Saw evidence X (negative), updated to 20%.
          Analyst B:
            Prior: 40%
            Update: Saw evidence Y (negative), updated to 20%.

          Now, if they have not seen each other's evidence, they might update further when they share.

     - Step 3: Compare priors: same. Then compare evidence: they have seen different evidence.

          Action: Share evidence X and Y.

          After sharing, both update again. 
          Suppose after seeing both X and Y, A now says 10% and B says 15%. Then we have a new disagreement? 

          Actually, they both started at 20% and now are at 10% and 15%? That would be a problem.

          Alternatively, if after sharing they both end up at 15%, then we have agreement.

          But note: if they both have the same prior and then see two independent pieces of negative evidence, the Bayesian update would be multiplicative. 
          If each piece of evidence reduces the probability by the same factor, then together they would reduce it more.

          Example: 
            Prior: 40% (odds: 40/60 = 2/3)
            Analyst A: saw X, which is 3 times more likely under failure -> odds become (2/3)* (1/3) = 2/9 -> 18.18%? 
            Then Analyst B: saw Y, which is 3 times more likely under failure -> odds become (2/9)*(1/3)=2/27 -> 6.9%. 

          But they both updated independently to 20%? That doesn't match. 

          So the issue: they might have updated from 40% to 20% each, but if they are independent, then together the update should be more. 

          Therefore, the fact that both are 20% but for different reasons suggests they have not incorporated the other's evidence. 

          The procedure: share the evidence and update. Then we get a new probability (likely lower than 20%).

          However, if after sharing they still both are around 15% (and they agree) then we use 15%. 

          But if they update differently? Then we have a disagreement as in case (a). 

          Alternatively, if they both agree that the two pieces of evidence are overlapping or not independent, then they might update less.

     - In this case, the procedure forces them to share evidence and update properly, which might reveal that the event is less likely than 20% (if the evidence is independent and both negative).

   What the procedure cannot do:
     - Resolve fundamental differences in models or values. For example, if one analyst uses a statistical model and the other uses a case-based model and they don't trust each other's approach, then the disagreement is deep.
     - When there is a lack of trust: if one analyst thinks the other is biased or incompetent, then common knowledge and rational updating break down.
     - When the evidence is ambiguous and open to multiple interpretations, and there is no objective way to decide.

   How to present the number without overstating:
     - Always report the initial range and the fact that there was a disagreement.
     - Explain the nature of the disagreement (e.g., "The difference was due to how the FDA is expected to weigh primary versus secondary endpoints").
     - If the resolution method was averaging, say so: "After discussion, our analysts converged to a range of 40%-60%, and we report the midpoint of 50% as our best estimate."
     - If the disagreement remains unresolved, report the range and the reasons: "Our analysts remain split between 40% and 60% due to differing views on the FDA's flexibility, and we present the average of 50% with the caveat that the uncertainty is higher than usual."

   Final checklist (practical version for Friday deadline):

   Step 1: State current estimates (ensure common knowledge).
   Step 2: Decompose: prior and update. If they can't, help them reconstruct.
   Step 3: Compare priors:
       - If same, go to Step 4.
       - If different, go to Step 5.
   Step 4: For same priors, compare evidence and updates:
       - Share any missing evidence.
       - Discuss interpretation of shared evidence.
       - Recalculate after sharing.
       - If still disagree, go to Step 6.
   Step 5: For different priors:
       - Share the evidence that formed the priors (if any) and recalculate priors.
       - If priors still differ, note this as a fundamental prior gap -> go to Step 6.
   Step 6: Betting test (virtual):
       - Ask if they would bet at their stated odds. If not, ask for an adjusted estimate they would bet on.
       - If yes, then they are committed.
   Step 7: If time allows, ask for predictions of each other's updates (to probe for trust in rationality).
   Step 8: If disagreement persists:
       - If the difference is small, average.
       - If the difference is large, average but note the range and the issue to the client.
       - If there is a clear reason to weight one analyst more (expertise, track record), do so.

   But note: sometimes the average of two extreme probabilities (like 25% and 75%) is 50%, but that might be less accurate than either. Use your judgment.

   For the two cases:

   Case (a): After discussion, they are at 40% and 60%. We average to 50% and report: 
          "After reconciling our analysts' views, we assign a 50% probability. The range was 40%-60% due to differing interpretations of the FDA's flexibility on trial endpoints."

   Case (b): After sharing evidence, they both update downward to 10% and 15%. We average to 12.5%? But note: they started at 20% and then shared and realized it was worse. We report 12.5% and explain: 
          "Initially two analysts independently estimated 20%, but after sharing their evidence, both revised downward and we report 12.5% as the average of their updated estimates."

   However, if in case (b) they don't update each other's estimates downward? That would be a red flag. It might indicate that they are not updating rationally. Then we might need to step in.

   Finally, remember: the goal is not to force agreement but to surface the reasons for disagreement and then make an informed decision.
answer: |-
  ### Brainstorming Key Distinctions
  The theorem your colleague referenced is **Aumann's Agreement Theorem**. It shows that if two rational agents share the same prior beliefs, have common knowledge of each other's current probabilities, and update via Bayes' rule, they **must** agree. Disagreements imply:
  1. **Prior gaps**: Different starting beliefs (e.g., one trusts regulatory agencies more).
  2. **Evidence gaps**: Unequal access to or interpretation of data.
  3. **Broken idealizations**:  
     - **Common knowledge failure**: Knowing each other's number ≠ knowing *how* they got there.  
     - **Imperfect rationality**: Biases, fatigue, or computational shortcuts.  
     - **Misaligned models**: Different mental frameworks (e.g., "this regulator is corrupt" vs. "this regulator follows precedents").  
     - **Ego/trust issues**: Unwillingness to update based on the other's view.

  ### Practical Checklist for Disagreement Resolution
  **Goal**: Diagnose the root cause in ≤60 mins. Escalate to you if unresolved.  
  **Key principle**: Force decomposition of beliefs to isolate priors vs. evidence.

  #### Step 1: Verify Common Knowledge of Current Estimates (5 mins)
  - **Action**: "State your current probability and confirm you know the other’s number."  
  - **Sufficient**: Both restate the other’s estimate accurately.  
  - **Failure**: Restate until understood.  
  - **Next**: → Step 2.

  #### Step 2: Decompose Estimates into Prior + Evidence (15 mins)
  - **Action**: "What would you have said *before* the new evidence? How did the evidence update your view?"  
    - Demand quantification:  
      *"My prior was X%. After seeing [evidence], I applied a likelihood ratio of Y:1, yielding Z%."*  
  - **Why**: Isolates prior gaps (divergent X) from evidence gaps (divergent Y).  
  - **Sufficient**: Clear prior number and update logic.  
  - **Failure modes**:  
    - **Can’t/won’t decompose**:  
      - *"I never thought about a prior"* → Reconstruct: "Ignore the new evidence—what was your baseline?"  
      - Still stuck? → **Escalate to you immediately**. Indicates intuition-driven reasoning.  
    - **Vague update logic**:  
      *"The evidence felt negative"* → Press for specifics: "Which piece? How much should it shift odds?"  
  - **Next**: → Step 3.

  #### Step 3: Compare Priors (10 mins)
  - **Action**: Contrast prior estimates (from Step 2).  
  - **Sufficient agreement**: Priors within ≤10 percentage points.  
  - **Outcomes**:  
    - **Priors match** → Disagreement is evidence-driven. → **Proceed to Step 4**.  
    - **Priors diverge** → Root cause is prior gap. → **Skip to Step 6**.  

  #### Step 4: Resolve Evidence Gaps (15 mins)
  - **Action**:  
    - List all evidence used by each analyst.  
    - Identify missing/overlooked evidence: *"Did you consider [X]? Why/why not?"*  
    - Challenge interpretations: *"You both saw the same FDA report—why different updates?"*  
  - **Sufficient**: Consensus on evidence set and interpretation.  
  - **Outcomes**:  
    - **Convergence** → Return to forecasting.  
    - **Still disagree** → → Step 5 (rationality check).

  #### Step 5: Test Rationality & Trust (10 mins)
  - **Action 1: Betting test**:  
    *"Would you bet $100 at your stated odds? If Analyst A says 30%, they pay $30 if the event happens and receive $70 if not."*  
    - **Willing to bet**: Commitment to estimate.  
    - **Unwilling**: Establishes broken rationality/trust → **Escalate to you**.  
  - **Action 2: Update prediction (optional)**:  
    *"What probability will the other assign after reviewing your evidence?"*  
    - **Value**: Tests if they believe their evidence would convince a rational peer.  
    - **Not essential**: Skip if time-constrained; rarely decisive.  
  - **Outcome**: → Step 6 if unresolved.

  #### Step 6: Handle Prior Gaps or Deadlock (5 mins)
  - **Rule for prior gaps**: **Average the posteriors**.  
    *Why?* If priors diverge and evidence sharing fails, no further reconciliation is possible.  
  - **Action for deadlock**: Assign weights (e.g., based on track record) or average.  
  - **Escalate to you if**:  
    - Decomposition failed (Step 2).  
    - Betting test failed (Step 5).  
    - Analysts are hostile/defensive.  

  ---

  ### Case Applications
  #### Case (a): Drug Approval (30% vs. 70%)
  - **Step 1**: Common knowledge confirmed.  
  - **Step 2**: Decomposition:  
    - Analyst A (30%): Prior 40%. FDA report shows side effects → 1.5:1 against approval.  
    - Analyst B (70%): Prior 40%. Same report → 3:1 *for* approval (citing unmet medical need).  
  - **Step 3**: **Priors match** (40% vs. 40%) → Evidence gap.  
  - **Step 4**: Both saw the same report. Disagreement is interpretive:  
    - A: "Side effects are fatal."  
    - B: "Unmet need outweighs risks."  
    - After debate: Still 35% vs. 65%.  
  - **Step 5**: Both take the bet.  
  - **Step 6**: **Prior gap? No. Evidence gap? Unresolved.**  
    - **Output**: Average to 50%. Flag to client: *"Disagreement hinges on FDA risk tolerance."*  
  - **Why this works**: Isolated interpretation gap—client needs to know the ambiguity.

  #### Case (b): Both 20% for Different Reasons
  - **Step 1**: Common knowledge confirmed.  
  - **Step 2**: Decomposition:  
    - Analyst A: Prior 50%. Saw competitor drug fail → update to 20%.  
    - Analyst B: Prior 10%. Saw positive Phase II data → update to 20% (still cautious).  
  - **Step 3**: **Priors diverge** (50% vs. 10%) → Prior gap.  
  - **Step 4**: (Skipped—root cause is priors).  
  - **Step 5**: Both take the bet.  
  - **Step 6**: **Prior gap confirmed.**  
    - **Output**: Average remains 20%. Flag: *"Agreement coincidental; underlying assumptions conflict."*  
  - **Risk**: If evidence was shared naively, B’s prior might rise (if competitor failure is new info), but decomposition exposed the truth.  

  ---

  ### What the Procedure Can’t Do
  1. **Resolve value/model gaps**:  
     - If priors diverge because Analyst A believes "regulators are corrupt" and Analyst B believes "regulators follow science," no amount of data fixes this.  
     - **Solution**: Explicitly note: *"Disagreement reflects divergent worldviews."* Average the outputs.  
  2. **Fix ego or broken rationality**:  
     - An analyst who won’t update despite contrary evidence is a management issue.  
     - **Solution**: Escalate to you; override with track record weights.  
  3. **Handle ambiguous evidence**:  
     - If evidence is open to infinite interpretations, reconciliation fails.  
     - **Solution**: Report the range and reason (e.g., *"FDA guidance unclear"*).  

  ### Presenting to Clients
  **Transparency beats false consensus**:  
  > *"After internal review, we assign 50% probability [or average]. Our analysts initially ranged from 30–70% due to conflicting interpretations of the FDA’s risk tolerance. We’ve highlighted this uncertainty because new FDA comments could shift our estimate rapidly."*  

  **Key elements**:  
  - State the number.  
  - Disclose the initial range.  
  - Explain the nature of the disagreement (e.g., "prior gap on regulatory trust").  
  - Flag if unresolved (e.g., "fundamental model divergence").  

  ### Final Advice
  - **Use this weekly**: Builds discipline and surfaces hidden assumptions.  
  - **Track decompositions**: Reveals which analysts default to priors vs. overreact to evidence.  
  - **Accept holes**: Averaging prior gaps is imperfect but auditable. Better than guessing.  
  - **When in doubt**: Escalate. Your job is judging which analyst's model fits the client’s needs.  

  This turns a philosophical theorem into a concrete audit trail—exposing where disagreement lives so clients know what they’re buying.
