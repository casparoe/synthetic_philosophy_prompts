        Q1'(B) = 0.5, Q1'(Y)=1/6≈0.1667

     So conditional probabilities under Q1':
        Q1'(B | non-R) = Q1'(B) / Q1'(non-R) = 0.5 / (2/3) = 0.5 * 3/2 = 0.75
        Q1'(Y | non-R) = Q1'(Y) / Q1'(non-R) = (1/6) / (2/3) = (1/6) * (3/2) = 1/4 = 0.25

   Therefore, after the second update (red shift) we have:
     Q2'(R) = 0.25
     Q2'(B) = Q2'(non-R) * Q1'(B | non-R) = 0.75 * 0.75 = 0.5625
     Q2'(Y) = Q2'(non-R) * Q1'(Y | non-R) = 0.75 * 0.25 = 0.1875

   So indeed, order 2: (R: 0.25, B: 0.5625, Y: 0.1875)

   Therefore, Mira is correct that the order matters.

   Now, the arguments:

   Mira's points:
    1. Order-dependence: shown above, so it's true.
    2. The rule presupposes its input: Jeffrey conditioning requires the new probabilities over the partition as input. But when we get uncertain evidence, we don't have that input directly? We have to have some way to set it. So the rule doesn't tell us how to get the new probabilities for the partition, it just tells us how to update the rest of the space given that we have them.

    3. Her fix: conditionalize on the evidence propositions (which are certain). Then order doesn't matter because conjunction is commutative.

   Theo's points:
    1. Conditionalizing on the experience makes experience infallible? Because if you conditionalize on "it looked reddish", then you are certain that it looked reddish. But what if you are unsure whether it looked reddish? Then you cannot conditionalize on that proposition because you are not certain.

    2. Conditionalizing on the experience requires likelihoods (how likely is a reddish look given each color). But with Jeffrey, you directly set the new probability for the partition without having to specify the likelihoods.

    3. Order-dependence is not a bug: the order is part of the evidence. So two different orders are two different total evidence.

    4. Two people who saw the same two things in opposite orders didn't see the same things because order is part of what they saw. Therefore, they can rationally disagree.

   Mira's counter:
    1. Calling the order part of the evidence just renames the update as evidence. And if the total evidence is the sequence of shifts, then we need a rule for updating on a sequence. But Jeffrey conditioning is only defined for one shift at a time.

    2. Then she points out that on Theo's view, two people with opposite orders will forever disagree.

   Theo's reply: they didn't see the same things because order is part of it.

   Adjudication:

   1. Order-dependence: It is true that Jeffrey conditioning as applied sequentially to different partitions is order-dependent. This is a known feature. However, this does not necessarily mean it is wrong.

   2. Presupposing the input: Mira is correct that Jeffrey conditioning requires the new probabilities for the partition as input. But how do we get these? The rule itself doesn't specify. It is a rule for updating given that you have decided on the new probabilities for the partition. So an agent must have some way to set these. This is a limitation: the rule is not a full account of how to update on uncertain evidence because it leaves the input open.

   3. Conditionalize-on-the-experience alternative:
      - Theo is correct that conditionalizing on the experience (as a proposition) requires that you are certain of that experience. If you are uncertain, then you cannot conditionalize.
      - However, there is a way to model uncertain evidence without falling into infallibility: by using a richer state space. For example, we might have a proposition E = "it looked reddish", and then we update by conditionalizing on E. But if we are not sure whether E occurred, then we cannot conditionalize on E. We might then model the experience as a random variable and update by conditionalizing on the fact that we had a specific experience (which we can be certain about). This is the standard Bayesian move with observation propositions.

      - But note: the likelihoods. In the standard Bayesian model, if we have an observation event E, then to update we need P(E | H) for each hypothesis H. Theo is correct that these might be hard to come by. Jeffrey conditioning allows us to bypass that by directly setting the posterior probabilities for the hypotheses.

   4. The likelihood point: Theo is right that conditionalizing on the experience requires likelihoods, and Jeffrey conditioning does not. But Jeffrey conditioning requires the new probabilities for the partition, which might also be hard to come by.

   5. What is the evidence?
      - In the Jeffrey framework, the evidence is represented by the new probability distribution over the partition. This is called "directly changing the probabilities". The evidence is not a proposition but a constraint on the probabilities.

      - In the standard Bayesian framework, evidence is a proposition that we learn with certainty.

      - The disagreement between Mira and Theo is about what constitutes the evidence. For Mira, the evidence is the experience (a proposition). For Theo, the evidence is the sequence of shifts (each shift being a constraint on the probabilities).

