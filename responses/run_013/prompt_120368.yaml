      - Theo's point that the order is part of the evidence is a way to say that the two sequences are different pieces of evidence. Therefore, it is acceptable that they lead to different posteriors.

      - However, Mira is correct that if we want to model the total evidence (the two experiences) without regard to order, then Jeffrey conditioning as applied sequentially does not give a unique answer. 

      - There is a way to update on multiple uncertain observations at once? Jeffrey conditioning is defined for a single partition at a time. To update on two partitions at once, we would need a rule that sets the new probabilities for both simultaneously. But in this case, the two shifts are on different partitions. We don't have a joint partition that is refined enough to capture both. 

      - Moreover, the two shifts are not independent. The new credence for blue might depend on whether we have already updated on red.

   7. The commutation: Theo says that insisting the order is irrelevant is assuming the shifts commute, which is false. This is correct: the two Jeffrey shifts (on different partitions) do not commute in general.

