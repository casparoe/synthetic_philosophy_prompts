               Q(R) = 0.25, Q(B)=0.5, and then Q(Y)=1-0.25-0.5=0.25?
            But wait, that would be a constraint on the three-color partition. And then we could do a single Jeffrey update on the partition {R, B, Y} setting Q(R)=0.25, Q(B)=0.5, Q(Y)=0.25. 

            Then the rigidity condition would apply: conditional probabilities given each color remain the same. Then we would have:
               For any event A: 
                   Q(A) = Q(R) * P(A|R) + Q(B) * P(A|B) + Q(Y) * P(A|Y)

            And in particular, the probabilities of R, B, Y become 0.25, 0.5, 0.25. 

            This is different from either of the sequential updates. 

            So why didn't we do that? Because the problem stated two shifts, not one. But if the two observations happened at the same time, then a simultaneous update might be more appropriate.

          * Therefore, the order-dependence arises because of the sequential nature of the updates. If the two observations are simultaneous, we should do a simultaneous update. The toy example doesn't specify the timing.

          * So what they are missing: the possibility of a simultaneous update when the evidence is simultaneous. And that in the simultaneous update, we would get a unique answer (0.25, 0.5, 0.25) for (R, B, Y). 

          * But note: that simultaneous update requires that we set Q(Y)=0.25. What if we don't have a constraint on yellow? Then we would need to set it by some other rule? In the sequential updates, we didn't set it arbitrarily: it came out of the rigidity conditions.

          * In fact, the sequential updates don't set the yellow probability arbitrarily: they are determined by the rigidity conditions and the order.

          * So if we have two constraints (on R and on B) and we want to update simultaneously, we have two constraints but three variables? We need a third constraint. Typically, we set the new probabilities by minimizing relative entropy subject to the constraints. But note, the constraints Q(R)=0.25 and Q(B)=0.5 already determine Q(Y)=0.25. So we can do a Jeffrey update on the three-color partition with these values. Then we get a unique update.

          * Why didn't the problem do that? Because it said "two uncertain observations", and each observation was described as updating one partition. But if the two observations are independent, we might have a different way to set the constraints.

          * In the absence of more information, the sequential update is one way, and the simultaneous update (if we interpret the two constraints as applying at the same time) is another.

          * But the problem says "two uncertain observations", and then they are applied in order. So the sequential update is what was done.

