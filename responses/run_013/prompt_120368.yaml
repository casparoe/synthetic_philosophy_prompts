          * The order-dependence is real and expected in sequential Jeffrey updates on different partitions.
          * If the evidence is simultaneous, we might do a simultaneous update that is order-independent.

          * Therefore, the debate might be resolved by noting that the scenario is underspecified: are the observations sequential or simultaneous? 

          * The problem says: "the first moves you ... the second moves you", implying sequential.

          * So in that case, Theo is right: the order matters. But if they were simultaneous, then we might do a simultaneous update and get a different result.

          * However, even in the simultaneous case, if we don't have a simultaneous update rule, we might fall back to sequential and then order would matter arbitrarily.

          * So the lesson is: when updating on multiple pieces of uncertain evidence, we must consider whether they are sequential or simultaneous and choose the update method accordingly.

