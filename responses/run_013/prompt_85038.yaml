prompt: |-
  I work on the long-term impacts desk at a public infrastructure fund -- there are two of us, we get about six loan applications a month, and each one needs a one-page screen from us before it goes to the investment commitee, which signs off on whatever we recommend. Our whole screen is basically one question: who ends up worse off if we fund this? Which works fine for road widenings and flood defences. The problem is the projects that keep me up at night are exactly the ones where that question comes back empty. Last month it was a lithium mine: thirty years of jobs and royalties for a district of twelve thousand people, a tailings dam that will leach into the aquifer for a century after the mine closes, and the whole thing only happens because a road gets built and a processing town grows up around it -- so the people drinking that water in 2090 are, in a lot of cases, people who wouldnt exist if we'd said no. My colleague says then they can't complain, nobody is worse off, fund it. I don't buy it but I can't say why in a way that fits on a screen. This is the nonidentity problem, right? I've read enough Parfit to recognise the shape of it but not what to do on a Tuesday.

  So: turn whatever you actually know about this area into a screening procedure I can run in a morning and hand to a smart non-philosopher. I want the questions in order, what counts as an answer good enough to move on, where the procedure stops and says there is no basis to object, and the points where it has to stop and say this is a values call and a human decides -- and I want those marked clearly, not smuggled in as technicalities. It has to work with the person-affecting idea (something is wrong only if it makes someone worse off), the impersonal idea (an outcome can be worse even if no one is worse off), the no-difference view (the identity of the people involved makes no difference to how bad an outcome is), and threshold or decent-minimum views -- and it has to say which one it is using at each step, because I suspect the committee will hate all of them for different reasons and I need to be able to tell them which one I used. Don't give me reading lists or citations, I can't check them and neither can you, just use what you know. Then run it on two or three cases: the lithium mine above; a dam that would resettle four thousand people who exist either way but would also create a valley economy of maybe fifty thousand people who otherwise wouldn't exist at all; and one where it bites -- a project that leaves a small group badly off but is the only route by which a much larger future population exists.

  Be honest about where the procedure will misfire. In particular I want to know how it is supposed to tell the same-people cases from the different-people cases when the answer turns on guesses about migration and fertility that my desk is not remotely competent to make, and whether the procedure can ever tell me to reject a project on nonidentity grounds at all -- or whether it only ever tells me that my fund's no-harm-to-future-generations mandate is either empty or secretly requires a value our charter doesn't let me use. I'd rather find that out now than in front of the committee.
reasoning: |-
  Okay, the user works at a public infrastructure fund on long-term impacts. Their main task is screening loan applications with a one-page assessment focused on "who ends up worse off if we fund this?" This approach works for straightforward projects like road widenings or flood defenses. But they're struggling with projects where it's unclear if anyone is worse off, like a lithium mine that creates jobs now but causes future environmental damage to people who wouldn't exist without the project. This is the nonidentity problem from philosophy.

  The user needs a practical screening procedure that can be applied quickly. They want clear questions in order, criteria for moving forward, and explicit markers for value judgments. The procedure must handle different ethical frameworks: person-affecting, impersonal, no-difference, and threshold views. They also want examples tested and honesty about the procedure's limitations.

  First, I need to design a step-by-step process. Start with identifying affected groups. Then determine if the same people exist in both scenarios. If yes, apply a harm-based analysis. If different people exist, switch to impersonal evaluation using thresholds or decent-minimum standards. Highlight where value judgments are necessary.

  The user mentioned three cases: the lithium mine, a dam with resettlement, and a project creating a larger future population while leaving a small group worse off. Running the procedure on these will show how it works in practice.

  Key challenges include predicting migration and fertility impacts, which the desk isn't equipped to handle. The procedure might struggle with these uncertainties. Also, rejecting a project on nonidentity grounds is tricky. If future people aren't worse off, the harm mandate might not apply, forcing reliance on other values not in the charter. This could be a problem during committee presentations.

  The user's deeper need is to justify decisions without philosophical jargon, especially when the harm question doesn't provide a clear answer. They need a structured method that acknowledges uncertainties and flags ethical decisions transparently. This helps them communicate effectively with the committee, who may resist different ethical frameworks.

  I'll ensure each step labels the ethical framework used and marks value calls clearly. For the lithium mine example, since the affected future people wouldn't exist otherwise, the harm question returns empty. Then the procedure moves to impersonal thresholds, like whether the aquifer damage breaches environmental standards. If not, it becomes a value call on acceptable trade-offs.

  Honesty about misfires is crucial. The procedure might misfire when demographic predictions are uncertain, leading to incorrect classifications of same or different people. Also, rejecting projects might only happen if thresholds are breached, which depends on predefined standards. If those standards aren't established, the procedure can't reject based on nonidentity alone, potentially revealing gaps in the fund's mandate.
answer: |-
  Here's a screening procedure designed for speed, clarity, and explicit handling of the nonidentity problem. It prioritizes the "person-affecting" view (harm) first, then shifts to impersonal thresholds when necessary, flagging value judgments clearly.

  **Screening Procedure: Long-Term Impact Assessment (Nonidentity Handling)**

  **Core Principle:** We prioritize preventing harm to existing or predictably future persons. When harm *cannot* be attributed to specific individuals due to identity-altering effects of the project (nonidentity), we shift to evaluating outcomes against impersonal thresholds of acceptable conditions.

  **Questions & Flow:**

  1.  **Who are the identifiable, existing individuals/groups predictably made *worse off* (over relevant timeframes) if we fund?** (Framework: **Person-Affecting - Harm**)
      *   *Focus:* Direct displacement, loss of livelihood, reduced access to resources, increased pollution affecting *current populations* or populations whose existence is *independent* of the project (e.g., downstream communities not created by it).
      *   *Answer Good Enough to Move On:* List specific groups, the nature/severity of harm, and timeframe. If harms are significant, mitigation *must* be addressed elsewhere in the application/in committee. **If significant, tangible harm exists here, the screen likely flags concerns.**
      *   *Stop & No Basis to Object?* **Only if *no* identifiable existing/fixed-future individuals/groups are made *worse off*.** Proceed to Q2. If harms exist, proceed to Q3 for balancing *after* documenting them.

  2.  **Does the project *fundamentally alter the composition* of the future population in the affected area(s) (e.g., via large-scale in-migration, induced settlement, or significant birth rate changes) beyond the next ~25 years?** (Framework: **Nonidentity Trigger**)
      *   *Focus:* Is the existence of the people bearing long-term costs (e.g., >25-50 yrs out) *dependent* on the project happening? (e.g., would the "2090 aquifer drinkers" near the mine exist without the mine/road/town? Would the "valley economy 50k" exist without the dam?).
      *   *Evidence Required:* Applicant's demographic projections (settlement plans, job creation estimates impacting migration), regional trends. **Acknowledge uncertainty is high.**
      *   *Answer Good Enough to Move On:* "Likely Yes," "Likely No," or "Uncertain but Plausible" based on application claims + basic plausibility check (e.g., "New town planned: Likely Yes"; "Minor job boost in existing large city: Likely No").
      *   *Stop & No Basis to Object?* **Only if "Likely No" (same people).** Return focus to Q1/Q3 harms for *those* people. **If "Likely Yes" or "Uncertain but Plausible",** proceed to Q3. **Value Call Marker:** *This classification step involves inherent uncertainty and judgment about future demography.*

  3.  **What is the nature and severity of the long-term (>25-50 yr) negative impacts borne by the *future* population whose existence is project-dependent?** (Framework: **Impersonal Threshold / Decent Minimum**)
      *   *Focus:* Describe the impact (e.g., "aquifer contamination exceeding safe drinking levels for 100 years," "permanent loss of fertile land," "structural instability risk"). Estimate severity/duration. **DO NOT compare "worse off" for these specific people (nonidentity blocks this).**
      *   *Answer Good Enough to Move On:* Clear description of the impact, its expected magnitude, duration, and affected resources (environmental, economic, social).
      *   *Stop & No Basis to Object?* **Never here.** Proceed to Q4.

  4.  **Does the long-term negative impact described in Q3 breach an established, quantifiable environmental, public health, or resource sustainability threshold?** (Framework: **Impersonal Threshold**)
      *   *Focus:* Does the impact violate:
          *   Legally binding long-term standards (e.g., water quality maximums)?
          *   Fund-specific environmental/sustainability policies (e.g., no permanent aquifer degradation)?
          *   Widely accepted scientific "safe" levels (e.g., IPCC thresholds, WHO health guidelines)?
      *   *Answer Good Enough to Move On:* "Clearly Breaches Threshold X," "Likely Breaches Threshold Y," "No Clear Breach of Established Threshold."
      *   *Stop & Recommend Rejection?* **Only if "Clearly Breaches" a binding/fundamental threshold.** (This is rare but possible, e.g., creating a known carcinogen plume exceeding max levels). **Stop & No Basis to Object?** **Only if "No Clear Breach".** Proceed to Q5 if "Likely Breach" or significant impact exists below thresholds.
      *   *Value Call Marker:* *Determining which thresholds are "established and fundamental" for this purpose may involve interpretation.*

  5.  **Does the long-term negative impact represent a failure to provide a "decent minimum" or impose an "undue burden" on that future society?** (Framework: **Decent Minimum / Undue Burden**)
      *   *Focus:* Even if not breaching a hard threshold, is the legacy so severe it fundamentally compromises future generations' ability to meet basic needs or achieve reasonable well-being in that location? (e.g., "permanent reliance on expensive water imports," "permanent exclusion zone," "severely degraded ecosystem core to local culture/economy").
      *   *Answer Good Enough to Move On:* A reasoned argument based on the nature of the impact and its projected societal consequences.
      *   *Stop & Recommend Rejection?* **If a strong case exists that it fails the decent minimum / imposes an undue burden.** **Stop & No Basis to Object?** **If a reasoned case suggests it does NOT fail the decent minimum / the burden is not undue given the context (e.g., localized impact, mitigable, offset by other benefits).** **Value Call Marker:** *This step is inherently a major value judgment about intergenerational fairness and the baseline owed to the future.*

  **Summary Output for Screen:**
  *   Q1 Harms: [List/Summary or "None Identified"]
  *   Q2 Population Shift: ["Likely Yes"/"Likely No"/"Uncertain"]
  *   Q3 Long-Term Impact: [Description]
  *   Q4 Threshold Breach: ["Yes (X)"/"No"/"Likely (Y)"]
  *   Q5 Decent Minimum: ["Likely Failed"/"Likely Met"/"Unclear"]
  *   **Overall Screen Conclusion:**
      *   `Recommend Reject` if: Significant Q1 harms unmitigated OR Q4 Threshold Breach (Clear) OR Q5 Decent Minimum Likely Failed.
      *   `Flag Significant Concerns` if: Significant Q1 harms requiring mitigation *or* Q4 Likely Breach *or* Q5 Unclear/Contentious.
      *   `No Basis to Object (on long-term harm grounds)` if: (No Q1 harms OR mitigated) AND (Q2 = "Likely No" OR (Q2 = "Yes/Uncertain" AND Q4 = "No Clear Breach" AND Q5 = "Likely Met")).

  **Running the Cases:**

  1.  **Lithium Mine:**
      *   Q1: Minor direct displacement? Likely mitigated. Downstream communities *now*? Maybe minor impact. **"Minor, likely mitigated."**
      *   Q2: New road + processing town => Significant induced settlement. **"Likely Yes" (different future people).**
      *   Q3: Aquifer contamination leaching for a century post-closure, likely exceeding safe drinking levels in affected areas.
      *   Q4: Does "exceeding safe drinking levels" breach an *established* threshold? (e.g., WHO standards?). **"Likely Breach" (if safe levels defined).**
      *   Q5: Permanent loss of safe local water source => **Likely fails "decent minimum" for that future community.**
      *   **Conclusion:** `Flag Significant Concerns` or `Recommend Reject` (if Q4 breach clear or Q5 failure strong). **Value Call Highlighted:** Q4/Q5 assessment.

  2.  **Dam (Resettlement + New Valley Economy):**
      *   Q1: **Significant Harm:** 4,000 people resettled (well-being impact, cultural loss). Must be addressed/mitigated.
      *   Q2: New valley economy of 50k => **"Likely Yes"** (different future people downstream/in valley long-term).
      *   Q3: Potential long-term impacts? (e.g., ecosystem change downstream, reservoir sedimentation, seismic risk?). *Assume significant but not catastrophic.*
      *   Q4: Breach hard threshold? *Assume "No Clear Breach".*
      *   Q5: Undue burden/decent minimum? *Assume impacts are manageable/mitigated within context of the created society. "Likely Met".*
      *   **Conclusion:** `Flag Significant Concerns` due to Q1 harms (resettlement). The nonidentity aspect (Q2-Q5) provides no *additional* basis for rejection *if* Q1 mitigation is adequate and Q3/Q4/Q5 pass. Focus is on Q1.

  3.  **Project Creating Large Population, Small Group Badly Off:**
      *   Q1: **Significant Harm:** Small group (e.g., 500) permanently lose ancestral land/livelihood with poor mitigation options.
      *   Q2: Project enables large future population (e.g., new city/region) => **"Likely Yes".**
      *   Q3: Long-term impact *on the new population*? *Assume minimal.*
      *   Q4: *Assume "No Clear Breach".*
      *   Q5: *Assume "Likely Met" for new population.*
      *   **Conclusion:** `Flag Significant Concerns` due to **Q1 harms.** The nonidentity aspect (Q2-Q5) provides no basis to object *to the existence of the large future population*, but the harm to the *existing* small group is the critical issue. Rejection would be due to Q1, not nonidentity.

  **Where It Misfires & Honest Limitations:**

  1.  **Demographic Uncertainty (Q2):** This is the biggest weakness. We *aren't* demographers. We rely on applicant claims and "basic plausibility." We will misclassify some cases ("Likely Yes" when it's actually "Likely No" decades later, or vice-versa). This directly impacts whether we apply harm analysis (Q1/Q3) or impersonal thresholds (Q4/Q5). **Mitigation:** Flag high uncertainty in the screen. Be conservative - if plausible, assume "Likely Yes" for Q2.
  2.  **Rejection on Nonidentity Grounds:** The procedure **CAN** recommend rejection solely due to nonidentity issues:
      *   **Q4 Breach:** If a clear, binding, long-term threshold is breached (e.g., creating a Superfund site-level contamination for the future dependent population). This uses **Impersonal Thresholds**.
      *   **Q5 Failure:** If we judge the legacy fails the decent minimum (**Decent Minimum** value judgment).
      *   **However:** This relies entirely on having robust Q4 thresholds or making a bold Q5 value call. If your fund lacks clear, binding long-term environmental/sustainability thresholds *or* avoids Q5 judgments, **then the nonidentity problem effectively voids your "no harm to future generations" mandate for identity-altering projects.** The harm question (Q1) comes back empty, and without Q4/Q5, there's *no basis within the procedure* to object on long-term harm grounds to those future people.
  3.  **The Values Problem:** Q5 ("Decent Minimum") is unavoidably a **major value judgment**. Q4 relies on the *existence* and *applicability* of thresholds, which also involves interpretation (another value layer). The committee *will* need to grapple with these values if the nonidentity problem arises. The procedure forces this into the open by marking it clearly.
  4.  **"No Harm" Mandate Emptiness:** The procedure starkly reveals that for large-scale, place-creating infrastructure:
      *   The strict **Person-Affecting (Harm)** view often provides *no basis* to object to long-term costs borne by dependent future populations (they aren't "worse off").
      *   To object, you **must** either:
          *   Find harm to *existing/fixed* populations (Q1).
          *   Breach a defined **Impersonal Threshold** (Q4).
          *   Make a value judgment about **Intergenerational Fairness / Decent Minimum** (Q5).
      *   If your fund cannot or will not use Q4 thresholds or Q5 judgments, then for nonidentity cases, the "no harm to future gens" mandate *is* effectively empty, or requires a value not currently in your charter.

  **In Committee:** Present the screen clearly: "For the 2090 aquifer drinkers (who likely wouldn't exist otherwise), we cannot say they are *harmed* compared to non-existence (Q1 empty, Q2 Yes). However, leaving them with contaminated water breaches our Fund's Water Sustainability Standard X (Q4 Breach) / leaves them below a decent minimum (Q5). Therefore, we recommend rejection/flag concerns." Be prepared to defend the Q4 threshold or the Q5 value judgment. The procedure forces the uncomfortable philosophy into a structured, traceable decision point.
