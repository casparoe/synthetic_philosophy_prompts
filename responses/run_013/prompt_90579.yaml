answer: |-
  ### Disease Taxonomy Decision Tree  

  **(Root) In two people with identical bodily states, where one is devastated and the other indifferent, can one have a disease and the other not?**  
    * **No** → **(Q1) Can we describe what a body part "should" do without referencing values? (e.g., "The heart should pump blood")**  
      * **Yes** → **(Q2) What defines "should"?**  
        * *Evolution/Design*: "What it was selected to do." → **Hard Naturalism**: *Disease is objective biological dysfunction, independent of values (e.g., Boorse).*  
        * *Statistical Typicality*: "What’s common in a group." → **(Q3) Who picks the reference class?**  
          * *Fixed (Species/Sex/Age)* → *Coherent but unattractive*: Ignores social shaping of categories (e.g., "male" as binary).  
          * *Contextual (Occupation/Population)* → **Soft Normativism/Pragmatic Pluralism**: *Disease is context-dependent dysfunction + harm; reference classes are practical choices.*  
      * **No** → **(Q4) Must "disease" serve a practical purpose? (e.g., relieve suffering, allocate care)**  
        * **Yes** → **Pragmatic Pluralism**: *"Disease" is a tool for specific goals (e.g., care access); no fixed essence.*  
        * **No** → *Incoherent*: If no value-free function *and* no practical role, concept collapses.  
    * **Yes** → **(Q5) Must a condition cause harm to be a disease?**  
      * **No** → *Unnamed, unexplored*: Harm-independent disease (rarely defended).  
      * **Yes** → **(Q6) Is harm defined by individual experience or collective norms?**  
        * *Individual* → **Hard Normativism**: *Disease is a value-laden verdict about suffering/incapacity; no biological "fact" (e.g., Szasz).*  
        * *Collective* → **(Q7) Is health merely the absence of disease?**  
          * **Yes** → **Hybrid View**: *Disease requires biological dysfunction + socially recognized harm (e.g., Wakefield).*  
          * **No** → **Positive Health View**: *Disease is failure of capacity/adaptability; health is flourishing (e.g., Nordenfelt).*  
    * **(Alternate Path) (Q8) Should we abandon "disease" for thinner terms?**  
      * **Yes** → **Eliminativism**: *Use "injury," "harm," or "difference"; "disease" obscures values/power (e.g., Foucault-influenced views).*  

  ---

  ### Commentary  
  **Key Tensions & Cases**:  
  - **Hard Naturalism** struggles with *male-pattern baldness* (statistically typical after age, "selected"?).  
  - **Statistical Typicality + Fixed Reference Class** falters with *a condition universal in one population after 40* (e.g., osteoarthritis in elders): Is it "normal aging" or disease? Who defines "species-typical"?  
  - **Hybrid vs. Soft Normativism**: Hard to separate when "dysfunction" is contested. If a *painless, life-shortening, heritable state* is statistically atypical, is it dysfunctional? Hybrid says "dysfunction + harm" → disease; Soft Normativism asks *which context?* (e.g., military vs. desk job). Both converge when harm is social.  
  - **Hard Normativism** labels *near-sightedness without distress* as non-disease (unless society mandates driving).  
  - **Eliminativism** reframes *a condition defined solely by patient reports* (e.g., fibromyalgia) as "harm" without biomedical validation.  
  - **Positive Health View** sees *a state with no distress/limitation* (e.g., latent infection) as non-disease if adaptability remains.  

  **Unnamed/Unpopular Leaves**:  
  - *Q1 "Yes" → Q2 "Statistical" → Q3 "Fixed Class"*: Coherent (disease = deviation from species norm) but unattractive—ignores how race/sex reference classes are socially constructed.  
  - *Root "Yes" → Q5 "No"*: Logically possible (disease without harm) but unexplored; clashes with intuition (e.g., *asymptomatic high cholesterol* is still "disease").  

  **Blurred Lines**: Hybrid and Soft Normativism often overlap. If "harm" is socially mediated (e.g., *baldness causing distress in cultures valuing hair*), both demand dysfunction + context. The tree distinguishes them technically (Hybrid requires *biological* dysfunction; Soft Normativism may accept socially indexed "dysfunction"), but cases like *historically reclassified conditions* (e.g., homosexuality) challenge both.  

  **Tree Strengths**: Forces confrontation with cases:  
  - *Who picks the reference class?* (baldness in actors vs. monks)  
  - *Is "no measurable marker" still a disease?* (Hard Naturalism: no; Pragmatism: yes, if it helps patients)  
  - *Does eliminating "disease" help?* (Eliminativism avoids gatekeeping but may hinder care access).  

  Total: 845 words.
