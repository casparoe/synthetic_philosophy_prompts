  Final output will be a handout-style flow: clean, conversational, with position summaries at leaves and gap notes. I'll keep citations out, per the user's request.
answer: |-
  Here's a handout-structured decision tree focused on concrete commitments, forcing distinctions between key positions while handling your specified cases and requirements. It has **8 Branch Nodes** and **8 Leaves**, including all requested positions.

  ---

  **Collective Action & Individual Obligation: Where Do You Stand?**  
  *Follow the tree by answering concrete questions about cases like casting one vote in a safe seat, eating one burger, or contributing $10 to a fundraiser that only works if many donate. Start from your intuitions, not labels.*

  ---

  ### **1. Does your individual act (e.g., flying, voting) CAUSALLY CONTRIBUTE to a harmful outcome in this specific instance?**  
  *(Not "could it in theory?" but "does it *actually* change the outcome here?")*  
  - **→ If YES**: Go to **2**.  
  - **→ If NO**: Go to **3**.  

  ---

  ### **2. Is the causal contribution LARGE ENOUGH to outweigh the act’s benefits *for you*?**  
  *(e.g., "Does my one flight directly cause enough harm to offset my vacation joy?")*  
  - **→ If YES**: You lean toward **Act-Consequentialist Expected-Value Marginalism**.  
    - *Summary*: What matters is the *expected* harm/benefit ratio of *this specific act*. Even tiny risks matter if scaled (e.g., driving might kill someone). Blame applies if you ignore the math.  
    - *Runs cases*: Condemns flights/burgers if emissions/animal suffering probabilities are non-zero; condemns dial-turning if any chance it tips agony threshold.  
  - **→ If NO**: You lean toward the **Flat Inefficacy / No-Obligation View**.  
    - *Summary*: If your act causes no *meaningful* harm alone (e.g., one vote in a landslide), you have no obligation to refrain. Criticism might apply for *patterns* but not tokens.  
    - *Runs cases*: Approves token votes/burgers/flights; approves fundraiser donation if goal not met; approves dial-turns if imperceptible.  

  ---

  ### **3. Even if your token act doesn’t cause harm, is it PART OF A SET OF ACTS that together cause harm?**  
  *(e.g., "Am I joining a harmful group effort?")*  
  - **→ If YES**: Go to **4**.  
  - **→ If NO**: Go to **5**.  

  ---

  ### **4. Does your act contribute by being a NECESSARY PART of the harmful set?**  
  *(e.g., "If I don’t fly, does the flight get canceled? If I skip the burger, does the cow not die?")*  
  - **→ If YES**: You lean toward **Threshold / Collective-Impact View**.  
    - *Summary*: Token acts matter as *parts* of harmful wholes. Your burger *is* a slice of the cow’s suffering; your vote *is* part of electing a bad candidate. Blame attaches if you ignore collective harms.  
    - *Runs cases*: Condemns burgers/votes/flights as participatory harms; condemns dial-turns as partial causes of agony.  
  - **→ If NO**: You lean toward **Complicity / Participatory View**.  
    - *Summary*: You’re blameworthy for *joining* or *sustaining* harmful systems, even if your act isn’t necessary. Your flight expresses support for high-emission travel; your burger funds factory farming. Obligation flows from solidarity with victims.  
    - *Runs cases*: Condemns flights/burgers as complicity; condemns fundraiser donation if goal fails (you still endorsed a bad system).  

  ---

  ### **5. Is the act-type (e.g., "flying for fun") INHERENTLY PROBLEMATIC?**  
  *(e.g., "Would it be wrong if everyone did it, regardless of outcomes?")*  
  - **→ If YES**: Go to **6**.  
  - **→ If NO**: Go to **7**.  

  ---

  ### **6. Is the wrongness about CHARACTER or EXPRESSION?**  
  *(e.g., "Does it show you’re selfish? Or violate a rule everyone should follow?")*  
  - **→ If CHARACTER/EXPRESSION**: You lean toward **Virtue / Expressive View**.  
    - *Summary*: The act expresses vice (e.g., indifference to suffering) or corrupts your character. Obligation exists to cultivate goodness, but blame may be mitigated by ignorance.  
    - *Runs cases*: Condemns burgers as cruel expression; condemns dial-turns as sadistic; approves votes if cast virtuously.  
  - **→ If UNIVERSAL RULE**: You lean toward **Kantian / Rule-Consequentialist View**.  
    - *Summary*: If everyone flew for fun/climate, society collapses. You must act only on maxims everyone could adopt. Blame applies for rule-breaking.  
    - *Runs cases*: Condemns flights/burgers as non-universalizable; condemns non-voting (if voting is a duty).  

  ---

  ### **7. Are you OBLIGATED due to your ROLE in a SOCIAL STRUCTURE?**  
  *(e.g., "As a citizen/consumer, do you have duties beyond your causal footprint?")*  
  - **→ If YES**: You lean toward **Structural View**.  
    - *Summary*: Obligation flows from your position in unjust systems (e.g., as a carbon-emitter in a climate crisis). You may be *obligated* to reduce harm *even if blameless* (e.g., if unaware).  
    - *Runs cases*: Obligates flight reduction regardless of efficacy; obligates voting as civic duty; separates obligation (structural) from blame (individual awareness).  
  - **→ If NO**: Go to **8**.  

  ---

  ### **8. Should you still be CRITICIZED for the act?**  
  *(e.g., "Even if it causes no harm and isn’t inherently wrong, is it fair to judge you?")*  
  - **→ If YES**: You lean toward **Hybrid: Structural Blame without Obligation**.  
    - *Summary*: No obligation to refrain (token acts don’t matter), but blame applies for *normalizing* harm or ignoring symbolic stakes (e.g., "You shouldn’t feel guilty, but we can judge your apathy").  
    - *Runs cases*: Permits token burgers/flights but criticizes them as callous; approves non-voting in safe seats but critiques civic disengagement.  
  - **→ If NO**: You reaffirm the **Flat Inefficacy / No-Obligation View** (from **2**).  

  ---

  ### **The Three Awkward Corners (Unoccupied/Unstable Combinations)**  
  1. **"Token causal impact + No pattern assessment"**: Incoherent. If you grant *token* acts cause harm (e.g., dial-turns), you must assess patterns (the agony).  
  2. **"Obligation without any contribution (causal/non-causal)"**: Unattractive. Demands action with no link to harm/responsibility (e.g., "you must not fly even if it saves lives").  
  3. **"Structural obligation + Blame always attached"**: Unexplored. Most structural views separate position-based duties from individual blame (e.g., excusable ignorance).

  ---

  **Key Distinctions Forced**:  
  - **Obligation vs. Blame**: Structural view (7→YES) separates them. Hybrid view (8→YES) denies obligation but allows blame.  
  - **Token vs. Act-Type**: Threshold view (4→YES) focuses on token acts *as parts* of types. Kantian/Virtue views (5→YES) focus on types.  

  Hand this out with the torture dials, burger, and fundraiser cases pre-loaded. Participants won’t know their "label" until the end!
