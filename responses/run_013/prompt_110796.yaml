  **Decision Theory Diagnostic Tree**  
  *Follow the branches based on your answers to concrete scenarios. Each leaf names a position and notes its most awkward commitment.*

  1. **In a one-shot Counterfactual Mugging (tails, no precommitment), would you pay $100?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **In predictive XOR Blackmail (blackmailer is a perfect predictor; you are Alice and have the letter), would you pay $100?**  
     - **Yes** → Go to 4  
     - **No** → Go to 5  

  3. **If you could precommit *before the coin flip* in Counterfactual Mugging to pay in tails, would you?**  
     - **Yes** → **Leaf A: Precommitment-Only**  
       *Awkward: You avoid one-shot decisions without precommitment, even when paying is objectively beneficial.*  
     - **No** → Go to 6  

  4. **Would you precommit to pay in Counterfactual Mugging *even though you already pay without precommitment*?**  
     - **Yes** → **Leaf B: Functional Decision Theory (FDT) / Timeless Decision Theory (TDT)**  
       *Awkward: You pay in Counterfactual Mugging despite your action not causing the heads reward.*  
     - **No** → **Leaf C: Causal Decision Theory (CDT)**  
       *Awkward: You lose money in Counterfactual Mugging and cannot exploit XOR Blackmail with prediction.*  

  5. **In *non-predictive* XOR Blackmail (blackmailer flips a coin randomly; you are Alice and have the letter), would you pay $100?**  
     - **Yes** → **Leaf D: Evidential Decision Theory (EDT)**  
       *Awkward: You refuse to pay in predictive XOR Blackmail, incurring a massive loss to preserve "consistency".*  
     - **No** → **Leaf E: Skeptic**  
       *Awkward: You reject the problem setup (e.g., by denying perfect prediction or calling it incoherent).*  

  6. **In a *repeated* Counterfactual Mugging (many rounds), would you pay on the *first* tails?**  
     - **Yes** → **Leaf F: Reputation-Based**  
       *Awkward: You cannot justify paying in the final round, undermining your initial strategy.*  
     - **No** → Go to 7  

  7. **In predictive XOR Blackmail (same as Q2), would you pay $100?**  
     - **Yes** → **Leaf C: Causal Decision Theory (CDT)**  
       *Awkward: Same as above (loses in Counterfactual Mugging).*  
     - **No** → **Leaf E: Skeptic**  
       *Awkward: Same as above (rejects problem setup).*  

  ---

  **Notes on Unseparated Positions & Unoccupied Views**  
  - **FDT and TDT** (Leaf B) *are not separated*: Both endorse precommitment in Counterfactual Mugging, and no question distinguishes their treatment of "logical counterfactuals" vs. "timeless control."  
  - **Updateless Decision Theory (UDT)** *is grouped with FDT/TDT* (Leaf B): UDT shares the same answers in this tree. To separate UDT, a question about abstract policy optimization across unknown identities would be needed (not included for brevity).  
  - **Unoccupied View**: "Pay in one-shot Counterfactual Mugging *only* if you can precommit for both Alice and Bob."  
    *Diagnosis: Unattractive*—precommitting for both in XOR Blackmail offers no clear benefit over individual precommitment, making this niche.  

  **How to Use**  
  Answer each question honestly. Follow branches to your leaf. If your answers match multiple positions (e.g., Skeptic or CDT via different paths), the leaf is still unique. Unoccupied combinations imply incoherent or unexplored views.
