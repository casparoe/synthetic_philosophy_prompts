  We are writing a pantoum. The pantoum form consists of quatrains (four-line stanzas) with a specific pattern of repeating lines. The pattern for a pantoum is:

  Stanza 1: A, B, C, D
  Stanza 2: B, E, D, F
  Stanza 3: E, G, F, H
  Stanza 4: G, I, H, J
  Stanza 5: I, C, J, A   (or sometimes the last stanza is adjusted to close the circle)

  But note: the traditional pantoum often ends by repeating the first and third lines of the first stanza in reverse order to close the circle. However, the requirement here is that the closing return of the opening line should land with a different force.

  We are to carry a single conditional sentence through both grammatical moods (indicative and counterfactual). The example given is the Kennedy assassination: 
    Indicative: "If Oswald didn't kill Kennedy, then someone else did." (which is plainly true because we know Kennedy was killed and Oswald was the assassin; so if it wasn't Oswald, it must have been someone else.)
    Counterfactual: "If Oswald hadn't killed Kennedy, then someone else would have." (which is doubtful because we don't know if there was a conspiracy or if it was a lone gunman and the opportunity was unique.)

  We need to choose a similar case. Let's pick:

  Indicative: "If the rain didn't ruin the crops, then something else did." (This is true because we see the crops are ruined and the rain is a known event, so if it wasn't the rain, it must have been something else.)

  Counterfactual: "If the rain hadn't ruined the crops, then something else would have." (This is doubtful because maybe the crops would have been fine without the rain? Or maybe without the rain, the crops would have been saved? We don't know.)

  But note: the indicative conditional must be plainly true and the counterfactual doubtful.

  Alternatively, we can use:

  Indicative: "If the spark didn't start the fire, then something else did."
  Counterfactual: "If the spark hadn't started the fire, then something else would have."

  We'll structure the pantoum so that the conditional sentence appears in both moods and the repetition shifts the mood and the context.

  We need to design the lines so that the conditional sentence (which we'll call the "core conditional") appears in both forms. We can break it into two parts:

  Let the core conditional be:

    Indicative: "If X didn't happen, then Y did."
    Counterfactual: "If X hadn't happened, then Y would have."

  We'll use a core about a fire:

    X = "the spark"
    Y = "something else"

  We'll have:

    Line A (opening): "If the spark didn't start the fire, then something else did." (indicative, true)

  Then, at some point we want the counterfactual: "If the spark hadn't started the fire, then something else would have."

  The challenge: the pantoum recycles lines, so we can have the same words but in a different order, and we can change the mood by shifting the context and the surrounding lines.

  Plan:

    We'll have 5 stanzas (the minimum for a pantoum to close the circle). The last stanza should bring back the first line (A) but with a different force.

    We'll design the lines so that:

      Stanza 1:
