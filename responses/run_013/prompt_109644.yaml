      Stanza 2:
        B: "The flames consumed the barn at dusk."
        E: "But if the spark had never caught,"   (this introduces the counterfactual mood)
        D: "The fire happened; it had a cause."
        F: "Would something else have done the same?"

      Stanza 3:
        E: "But if the spark had never caught,"
        G: "We cannot say what might have been:"
        F: "Would something else have done the same?"
        H: "The world disposes as it will."

      Stanza 4:
        G: "We cannot say what might have been:"
        I: "The fire happened; we assign the blame."
        H: "The world disposes as it will."
        J: "But what might be is not what was."

      Stanza 5:
        I: "The fire happened; we assign the blame."
        C: "The evidence is what we know:"
        J: "But what might be is not what was."
        A: "If the spark didn't start the fire, then something else did."

    In the last stanza, the return of line A should feel different because we have been contemplating the counterfactual. The reader now understands that the indicative is a matter of evidence and necessity, while the counterfactual is speculative.

    Notice that we have two lines that are conditionals:

        A: indicative
        E and F together form the counterfactual: 
            E: "But if the spark had never caught,"
            F: "Would something else have done the same?" (which is the counterfactual question)

    We also have line J: "But what might be is not what was." which highlights the difference.

    We must ensure that the poem does not take a stand on theories of conditionals. It merely presents the shift.

