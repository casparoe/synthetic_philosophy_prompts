answer: |-
  ### The Spark and the Fire  
  *(a pantoum)*

  If the spark didn't start the fire, then something else did.  
  The blaze tore through the timber, swift and grim.  
  We trace the cause where consequence is hid:  
  The barn must burn—the fuel awaits the whim.  

  The blaze tore through the timber, swift and grim.  
  But if the spark had never left its mark,  
  The barn must burn—the fuel awaits the whim—  
  Would embers still have kindled in the dark?  

  But if the spark had never left its mark,  
  What might have been remains unwritten law.  
  Would embers still have kindled in the dark?  
  The wind decides which branches it will claw.  

  What might have been remains unwritten law.  
  We know the barn was lost; we hunt the why.  
  The wind decides which branches it will claw.  
  What *could* have been is not what *was*—that’s sly.  

  We know the barn was lost; we hunt the why.  
  We trace the cause where consequence is hid.  
  What *could* have been is not what *was*—that’s sly.  
  If the spark didn’t start the fire, then something else did.  

  ---

  ### Notes on Construction:  
  - **Conditional Shift**: The opening/closing line (bolded) uses the **indicative mood** ("If the spark didn’t… then something else did"), asserting logical necessity given the fire occurred. The counterfactual mood ("If the spark had never… would embers still…") appears in the second and third stanzas, posing speculative doubt.  
  - **Argumentative Form**: The pantoum’s repetition forces the indicative claim to resurface after the counterfactual interlude. By the end, the same line feels heavier—less a tautology, more a concession to inevitability.  
  - **Philosophical Nuance**: The poem juxtaposes *epistemic certainty* (we know the fire had *a* cause) with *metaphysical uncertainty* (we can’t prove backup causes existed). Lines like "What might have been remains unwritten law" and "What *could* have been is not what *was*" underscore the gap between truth and conjecture.  
  - **Accuracy & Accessibility**: For logicians, it mirrors David Lewis’s observation that indicative conditionals constrain beliefs, while counterfactuals imagine alternatives. For poets, it leverages imagery (sparks, wind, timber) to embody abstraction.  

  The barn burns either way—but *why* it *had* to burn is a question the poem circles without answering.
