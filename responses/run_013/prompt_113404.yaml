prompt: |-
  I am putting together the first unit of a graduate seminar on rationality over time, and before we compare rival accounts I want the standard of adequacy written out: what any theory of diachronic rationality — a theory that says when an agent's preferences and choices at different times are rational — has to deliver. Not the contenders yet; the list of requirements they are competing to satisfy.

  Give me the requirements, each with the consideration behind it. Include the cases the theory must classify correctly: an agent with cyclical preferences who can be walked around a cycle of trades at a guaranteed loss; an agent who pays to be bound against her own future choice and later pays again to be released; an agent whose preferences shift so gradually that no single step looks bad while the endpoint does; an agent who foresees her own reversal and endorses it in advance; and a set of bets that can be priced against her all at once rather than sequentially. Include the distinctions the theory cannot collapse: between a change of preference and an inconsistency; between foreseeing one's future choices and failing to; between being exploitable and being irrational; between the rationality of a choice and the rationality of the preference it expresses; between requirements that hold at a time and requirements that hold across times. Include the formal results it must be consistent with: whatever can be established about which preference structures are pumpable, under what assumptions about foresight, and the fact that our best descriptive models treat foreseen reversal — including the discounting pattern in which a fixed delay matters less the further off it is — as ordinary rather than as an error.

  I especially want two things. First, which requirements are non-negotiable and which are house rules of a particular camp. Second, whether some subset is jointly unsatisfiable: if the demand that the theory be neutral among an agent's time slices conflicts with the demand that it vindicate commitment, or if the demand for action-guidingness conflicts with the demand for descriptive adequacy, show me the conflict rather than smoothing it over. Then, briefly, how resolute choice, the sophisticated and myopic chooser models, and the view that preference change simply falls outside rationality's jurisdiction fare against your list, and name the single requirement that eliminates the most candidates. I need the criteria, not the citations, so skip names and dates. Keep the scorecard to a few lines; the list is what I am after.
reasoning: |-
  We are constructing a list of requirements for a theory of diachronic rationality. The requirements must cover the following:

  1. Correct classification of key cases:
     a. Cyclical preferences leading to money-pump exploitation.
     b. Paying to bind and then paying to release (precommitment and reneging).
     c. Gradual preference shifts (sorites-like) ending in a clearly bad state.
     d. Foreseen reversal with endorsement (e.g., hyperbolic discounting).
     e. Dutch book vulnerability (simultaneous vs sequential pricing).

  2. Necessary distinctions:
     a. Change of preference vs inconsistency.
     b. Foreseeing future choices vs not.
     c. Exploitability vs irrationality.
     d. Rationality of choice vs rationality of preference.
     e. Requirements at a time vs across time.

  3. Formal results:
     a. Conditions under which preference structures are pumpable (e.g., under non-stationarity, intransitivity).
     b. Descriptive models treating foreseen reversal (like hyperbolic discounting) as ordinary.

  The list of requirements with their considerations:

  Requirement 1: Non-Exploitability (Money Pump)
     - Consideration: An agent with cyclical or otherwise intransitive preferences can be "pumped" for money by a series of trades that leave her worse off. A theory must rule out such vulnerability as irrational.
     - Case: Cyclical preferences (A>B, B>C, C>A) leading to a cycle of trades with net loss.

  Requirement 2: Commitment Rationality
     - Consideration: An agent who pays to bind herself to a future course of action (to avoid a temptation she foresees) and then later pays to reverse that commitment is acting irrationally. The theory must explain why such a pattern is irrational or, if it is rational, why.
     - Case: Paying to be bound and then paying to be released.

  Requirement 3: Stability under Gradual Change (No Sorites Exploitation)
     - Consideration: If an agent's preferences shift so gradually that each step is acceptable but the cumulative change leads to a clearly bad state, the theory must either prevent such paths or explain why they are rational. This is analogous to the sorites paradox.
     - Case: An agent ends up with a preference that is clearly bad (e.g., addicted) via small steps.

  Requirement 4: Foreseen Reversal Accommodation
     - Consideration: An agent who foresees her own preference reversal and endorses it in advance (as in hyperbolic discounting) might be rational. The theory must allow for this possibility, especially since descriptive models (e.g., in behavioral economics) treat this as common and not necessarily irrational.
     - Case: Hyperbolic discounting: an agent prefers $110 in 31 days over $100 in 30 days, but when day 30 arrives, she prefers $100 now over $110 tomorrow. She might have endorsed this shift in advance.

  Requirement 5: Dutch Book Consistency
     - Consideration: An agent's set of preferences must not allow a Dutch book (a set of bets that guarantee loss) when all bets are offered simultaneously. This is a requirement of static coherence. However, the theory must also address sequential Dutch books (where bets are offered over time) and whether they are irrational.
     - Case: Pricing bets simultaneously vs sequentially.

  Requirement 6: Distinction between Preference Change and Inconsistency
     - Consideration: A change in preference (e.g., due to new information or a genuine shift in values) is not necessarily irrational. The theory must not conflate this with inconsistency (which is irrational).

  Requirement 7: Distinction between Foresight and Lack of Foresight
     - Consideration: The rationality of a choice might depend on whether the agent foresaw her future choices. For example, if she foresees a reversal and takes steps to prevent it, that might be rational; if she doesn't foresee it, that might be irrational.

  Requirement 8: Exploitability vs Irrationality
     - Consideration: Being exploitable (e.g., in a money pump) is evidence of irrationality, but the theory must explain why. It must not conflate the two: being exploitable might be a symptom, but the root is a failure of rationality.

  Requirement 9: Rationality of Choice vs Preference
     - Consideration: A choice might be rational given the preferences at the time, but the preferences themselves might be irrational. The theory must account for both levels.

  Requirement 10: Synchronic vs Diachronic Requirements
     - Consideration: Requirements at a single time (e.g., transitivity at t) and across time (e.g., stability of plans) must be clearly separated. The theory must not collapse them.

  Requirement 11: Consistency with Formal Results
     - Consideration: The theory must be consistent with known formal results, such as:
          a. Money pump arguments: which preference structures (e.g., without transitivity) are vulnerable.
          b. The fact that hyperbolic discounting (a form of foreseen reversal) is a common and descriptively adequate model, so the theory must not rule it out as inherently irrational.

  Now, which requirements are non-negotiable and which are house rules?

  Non-negotiable (widely accepted as core):
     - Requirement 1 (Non-Exploitability) is fundamental. Almost all theories agree that being money-pumped is irrational.
     - Requirement 5 (Dutch Book Consistency for simultaneous bets) is a standard requirement of static rationality.
     - Requirement 6 (Distinction between preference change and inconsistency) is essential to avoid over-ascribing irrationality.
     - Requirement 8 (Exploitability as evidence but not definition) is generally held.

  House rules (specific to camps):
     - Requirement 2 (Commitment Rationality): Some theories (e.g., resolute choice) argue that paying to bind and then reneging is irrational, while others (e.g., sophisticated choice) see the reneging as rational given the new preferences.
     - Requirement 4 (Foreseen Reversal Accommodation): The permissibility of foreseen reversal (like hyperbolic discounting) is contested. Some (e.g., standard economic theory) see it as irrational, while others (e.g., some behavioral models) accept it as a fact of human psychology and not necessarily irrational.
     - Requirement 3 (Stability under Gradual Change): How to handle gradual change is debated. Some theories might require strict stability, while others allow change.

  Joint unsatisfiability:

  There is a conflict between:
     - Requirement 4 (accommodating foreseen reversal) and Requirement 2 (commitment rationality). 
          - If we allow foreseen reversal (like hyperbolic discounting) as rational, then an agent might rationally pay to bind herself to avoid a future temptation (because she foresees the reversal and wants to prevent it). But then, when the time comes, she might rationally (given her new preferences) pay to be released. This pattern (pay to bind, then pay to release) is seen by some as irrational (a form of dynamic inconsistency). But if we require that the agent not renege (commitment), then we are disallowing the foreseen reversal. So we have a tension.

     - Also, there is a conflict between:
          - The demand for neutrality among time-slices (each time-slice's preferences are sovereign) and the demand for commitment (which requires the agent to bind future time-slices). 
          - If we are neutral, then we cannot require the future time-slice to act against its own preferences. But then commitment devices (which work by constraining future choices) are not rationally required and might even be irrational (because they limit future freedom). On the other hand, if we require commitment, we are not being neutral.

     - Another conflict: 
          - Between descriptive adequacy (which requires us to accept hyperbolic discounting as common) and action-guidingness (which might require us to condemn it as irrational and to recommend commitment devices).

  Now, briefly, how do some theories fare?

  1. Resolute Choice:
     - The agent chooses a plan at the outset and resolutely sticks to it, even if her preferences change.
     - Satisfies Requirement 2 (avoids paying to bind and then reneging) by sticking to the plan.
     - Violates Requirement 4? Not necessarily: it might still allow for foreseen reversal but override it by resolution. However, it might be accused of violating the neutrality among time-slices (because it forces the future self to act against its preferences). It also might fail Requirement 9: the choice at a time might be rational (because it follows the plan) but the preference at that time might be for something else.

  2. Sophisticated Choice:
     - The agent anticipates her future choices and selects the best plan consistent with what she will actually do in the future.
     - Avoids Requirement 2 (paying to bind and then reneging) by not committing in the first place if she knows she will renege. But then she might end up with a worse outcome (because she doesn't commit) and thus might be vulnerable to a money pump? Not necessarily: she adjusts to avoid the cycle.
     - Accommodates Requirement 4 (foreseen reversal) by allowing it and planning around it. But it might not prevent Requirement 3 (gradual change) if the sophisticated agent still follows a path that leads to a bad state.

  3. Myopic Choice:
     - The agent chooses at each time based solely on current preferences.
     - Fails Requirement 1 (money pump) and Requirement 2 (binding and reneging) because the agent is exploitable. But it satisfies Requirement 6 (change of preference is allowed) and Requirement 4 (foreseen reversal is just a change).

  4. Preference Change Outside Rationality's Jurisdiction:
     - Only choices are subject to rationality, not preference changes. So as long as the agent chooses rationally given her current preferences, she is rational.
     - This avoids Requirements 1 and 2? Not really: the agent is still vulnerable to money pumps and binding-and-reneging. But the view might say that these are not irrational because they follow from rational choices at each time. So it fails to satisfy non-exploitability.

  The single requirement that eliminates the most candidates is Requirement 1: Non-Exploitability. It forces the theory to avoid cycles and thus rules out myopic choice and any theory that allows cyclical preferences to stand.

  Scorecard (very brief):

  - Resolute: 
     + Commitment, Non-Exploitability (if it avoids cycles by resolution)
     - Descriptive adequacy? (because it requires sticking to plans even when preferences change) and neutrality among time-slices.

  - Sophisticated:
     + Non-Exploitability (if it avoids cycles by anticipation), Foreseen reversal accommodation.
     - May not prevent gradual decline (Requirement 3) and might allow the agent to end up in a bad state.

  - Myopic:
     - Fails Non-Exploitability and Commitment Rationality.
     + Allows foreseen reversal and change.

  - Change outside rationality:
     - Fails Non-Exploitability and Commitment Rationality.
     + Allows preference change without criticism.

  The list of requirements:

  1. Non-Exploitability (Money Pump): Must avoid vulnerability to cycles of trades that lead to a guaranteed loss.
  2. Commitment Rationality: Must explain the irrationality of paying to bind and then paying to release (if it is irrational) or explain why it is rational.
  3. Stability under Gradual Change: Must prevent or justify paths that lead to a clearly bad state via small steps.
  4. Foreseen Reversal Accommodation: Must allow for the rationality of agents who foresee and endorse their own future reversals (like hyperbolic discounters).
  5. Dutch Book Consistency: Must avoid Dutch books in simultaneous betting and address sequential Dutch books.
  6. Change vs Inconsistency: Must distinguish between rational preference change and irrational inconsistency.
  7. Foresight vs No Foresight: Must account for whether the agent foresaw her future choices.
  8. Exploitability vs Irrationality: Must not conflate exploitability (a symptom) with irrationality (the underlying failure).
  9. Choice vs Preference Rationality: Must account for both the rationality of choices and the rationality of the preferences they express.
  10. Synchronic vs Diachronic Requirements: Must not collapse requirements at a time with those across time.
  11. Formal Consistency: Must be consistent with formal results on pumpability and the descriptive adequacy of foreseen reversal.

  Note: The above list is an attempt to be comprehensive, but the field is complex and the requirements are subject to debate.
answer: |-
  ### Requirements for a Theory of Diachronic Rationality  
  Below is the list of requirements any theory of diachronic rationality must satisfy to be adequate. Each requirement includes the core consideration behind it and the cases/distinctions it must address. Requirements are derived from fundamental constraints of rationality, empirical phenomena, and formal results.  

  #### **Core Requirements**  
  1. **Non-Exploitability (Money-Pump Resistance)**  
     - *Consideration*: Rational agents must not be vulnerable to guaranteed losses due to inconsistent preferences.  
     - *Cases*: Correctly classify an agent with cyclical preferences (e.g., A>B, B>C, C>A) who is exploited via a cycle of trades, ending up worse off.  
     - *Non-negotiable*: Yes. Exploitability directly violates instrumental rationality (achieving goals efficiently).  

  2. **Dynamic Consistency**  
     - *Consideration*: Rational agents should not undermine their own prior commitments without justification.  
     - *Cases*: Correctly classify an agent who pays to bind themselves (e.g., to avoid temptation) and later pays to reverse it, incurring net costs.  
     - *Non-negotiable*: Partially. Most theories treat this as irrational, but some (e.g., sophisticated choice) see it as unavoidable.  

  3. **Path Independence**  
     - *Consideration*: Rationality should not depend on how choices are sequenced; endpoints must align with rational evaluation.  
     - *Cases*: Correctly classify gradual preference shifts (e.g., a "sorites sequence" where each small step is rational but the final state is clearly undesirable).  
     - *Non-negotiable*: Yes. Failing this permits self-defeating long-term outcomes.  

  4. **Temporal Neutrality**  
     - *Consideration*: Rational agents should evaluate outcomes consistently regardless of when they occur, unless justified by new information.  
     - *Cases*: Distinguish between rational preference changes (e.g., due to learning) and irrational time-biased inconsistencies (e.g., hyperbolic discounting).  
     - *Non-negotiable*: House rule. Contested by theories that accept time-biased preferences (e.g., descriptive discounting models).  

  5. **Foresight Sensitivity**  
     - *Consideration*: Rationality assessments must account for whether future choices were anticipated.  
     - *Cases*: Distinguish between an agent who foresees and endorses their future reversal (e.g., "I'll prefer cake over salad tomorrow, and that's fine") vs. one who is surprised by it.  
     - *Non-negotiable*: Yes. Ignoring foresight conflates planning with myopia.  

  6. **Synchronic Coherence**  
     - *Consideration*: Choices at a single time must be internally consistent (e.g., transitive, complete).  
     - *Cases*: Avoid Dutch books in simultaneous pricing (e.g., a set of bets that guarantees loss if accepted together).  
     - *Non-negotiable*: Yes. Static rationality is foundational.  

  7. **Diachronic Coherence**  
     - *Consideration*: Sequences of choices across time must align with long-term goals, not just moment-by-moment preferences.  
     - *Cases*: Address sequential Dutch books (e.g., bets offered over time that exploit shifting preferences).  
     - *Non-negotiable*: House rule. Rejected by theories that only require synchronic rationality.  

  8. **Preference-Choice Distinction**  
     - *Consideration*: Rationality of a choice (given preferences) must be separable from rationality of the preferences themselves.  
     - *Cases*: An agent may make a rational choice expressing irrational preferences (e.g., picking a dominated option due to flawed values).  
     - *Non-negotiable*: Yes. Collapsing this eliminates critical nuance.  

  9. **Formal Compatibility**  
     - *Consideration*: Must align with established formal results (e.g., money-pump theorems, Dutch book arguments).  
     - *Cases*: Accommodate that:  
       - Cyclical or non-stationary preferences are pumpable under certain conditions.  
       - Descriptive models treat foreseen reversals (e.g., hyperbolic discounting) as empirically normal.  
     - *Non-negotiable*: Yes. Inconsistent theories are internally flawed.  

  #### **Key Distinctions the Theory Must Preserve**  
  - **Preference change vs. inconsistency**: Change is rational with new info; inconsistency is not.  
  - **Foresight vs. no foresight**: Foreseen reversals require different handling than unforeseen ones.  
  - **Exploitability vs. irrationality**: Exploitability is evidence but not proof (e.g., irrational agents might avoid exploitation by luck).  
  - **Synchronic vs. diachronic requirements**: Rules for a single time vs. sequences of times.  

  #### **Conflicts Between Requirements**  
  - **Temporal Neutrality vs. Commitment (Path Independence)**:  
    - *Conflict*: Temporal neutrality demands equal respect for all time-slices, but commitment requires overriding future preferences (e.g., binding oneself). This creates tension in cases like foreseen reversals.  
  - **Descriptive Adequacy vs. Action-Guidingness**:  
    - *Conflict*: Descriptive adequacy requires accommodating foreseen reversals (e.g., hyperbolic discounting), but action-guidingness may condemn them as irrational (requiring commitment). This is unresolved; no theory fully satisfies both.  

  #### **How Major Theories Fare Against Requirements**  
  | **Theory**               | **Strengths**                                  | **Weaknesses**                                  |  
  |---------------------------|-----------------------------------------------|------------------------------------------------|  
  | **Resolute Choice**       | Satisfies 2 (dynamic consistency), 3 (path independence). | Fails 4 (temporal neutrality) and 9 (formal compatibility with descriptive discounting). |  
  | **Sophisticated Choice**  | Satisfies 1 (non-exploitability), 5 (foresight sensitivity). | Fails 2 (dynamic consistency) and 3 (path independence). |  
  | **Myopic Choice**         | Satisfies 4 (temporal neutrality), 9 (descriptive adequacy). | Fails 1 (non-exploitability), 2, 3, 6 (synchronic coherence). |  
  | **Preference Change External** | Satisfies 8 (preference-choice distinction), 9 (descriptive). | Fails 1, 2, 3, 6, 7 (all coherence requirements). |  

  #### **The Eliminator Requirement**  
  **Non-Exploitability (Requirement 1)** eliminates the most candidates:  
  - It rules out myopic choice, preference-external views, and any theory allowing cyclical or non-stationary preferences without correction.  
  - Sophisticated choice narrowly satisfies it by anticipating and avoiding pumps; resolute choice satisfies it via commitment.  

  ### Summary  
  A theory must satisfy **1, 3, 5, 6, 8, 9** to be minimally adequate. **2 (dynamic consistency)** and **7 (diachronic coherence)** are house rules that cause major conflicts, especially with descriptive adequacy. The core tension is between *temporal neutrality* (treating all times equally) and *commitment* (overriding future preferences), which no theory fully resolves. Use this list to evaluate contenders in subsequent units.
