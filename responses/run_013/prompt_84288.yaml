  Key aspects of their framework include: set of alternatives X, preference relations ≿, choice functions C, state space Ω with prior μ and likelihoods, updating rules, and aggregation rules for multi-agent scenarios.

  For the ideal counterpart view:
  We can model this as X (original alternatives) and an idealized counterpart with modified parameters: expanded state space Ω⁺ with more information, "undistorted" prior μ⁺, and possibly revised utility function u⁺. The choice becomes C⁺(A) based on ≿⁺. But this is descriptive - it predicts what the ideal agent would do, not why I should comply.

  For idealized agreement:
  This requires modeling multiple agents behind a "veil of ignorance" with symmetric position uncertainty. We define an initial profile (≿₁,...,≿ₙ) over social states, apply an ignorance operator I that induces symmetry, then aggregate using something like Nash bargaining. But the aggregation rule itself encodes substantive normative commitments.

  Regarding coherence:
  The user asks if metaethical "coherence" matches decision-theoretic coherence (transitivity, completeness). I suspect it's broader - including requirements like impartiality in Rawls or Habermas' discursive conditions, which go beyond formal rationality.

  The residue they're concerned about is the "authority" of the ideal - why should I care what my idealized self thinks? This seems irreducible in their framework. Either we add a normative bridge principle (which begs the question), or the idealization parameters themselves contain substantive values.

  The user's suspicion appears correct - these procedural approaches either remain descriptive or smuggle in norms through the idealization conditions. The true "residue" is the first-person normative force that can't be captured by counterfactual predictions alone.
answer: |-
  Your suspicion is well-targeted, and your framework exposes critical tensions in these proceduralist metaethical views. Below is a translation into decision-theoretic vocabulary, followed by a residue analysis confirming your hypothesis. I preserve key variants and flag distortions.

  ---

  ### **Formal Translation of Proceduralist Variants**
  **Notation Base:**  
  - Alternatives: \(X\)  
  - Agent preferences: \(\succsim_i\) (possibly incomplete/intransitive)  
  - Choice function: \(C: \mathcal{A} \to 2^X \setminus \{\emptyset\}\), where \(\mathcal{A}\) is the set of feasible sets  
  - State space: \(\Omega\), prior \(\mu\), likelihoods \(\ell(\cdot|\omega)\)  
  - Updating: \(C^{\text{post}}(A|E)\) via Bayes or generalized rule  
  - Aggregation: \(f: \{\succsim_i\}_{i \in N} \mapsto \succsim_{\text{col}}\)  

  #### **1. Ideal Counterpart (e.g., informed-desire theories)**
  - **Translation:**  
    Define an *idealization operator* \(\phi\) mapping the agent to a counterfactual version:  
    \[
    \phi\left( \succsim, \mu, \Omega, X \right) = \left( \succsim^*, \mu^*, \Omega^*, X^* \right)
    \]  
    where:  
    - \(\Omega^* \supset \Omega\) (expanded state space, e.g., full information)  
    - \(\mu^*\) is \(\mu\) updated to incorporate \(\Omega^*\) (e.g., \(\mu^* = \mu(\cdot | \Omega^*)\))  
    - \(X^* = X\) (alternatives unchanged) or \(X^* \neq X\) (if idealization adds/removes options)  
    - \(\succsim^*\) is coherent (complete, transitive) and maximizes \(U^*(x) = \mathbb{E}_{\mu^*}[u(x|\omega)]\).  
    
    The "ought" is \(C^*(A) = \arg\max_{x \in A} U^*(x)\).  

  - **Distortions:**  
    - If \(X^* \neq X\), the alternative set is *altered* (e.g., removing "impulsive" choices). This violates the axiom of *independence of irrelevant alternatives* (IIA) in choice functions.  
    - \(\succsim^*\) may not be representable by \(U^*\) if coherence demands more than formal rationality (e.g., "correct" desires). **This is a substantive leap.**  

  #### **2. Idealized Agreement (e.g., Rawlsian veil of ignorance)**
  - **Translation:**  
    - Agents: \(N = \{1, \dots, n\}\) (representative positions in society).  
    - Original preferences: \(\{\succsim_i\}_{i \in N}\) over social states \(S\).  
    - Apply *ignorance operator* \(\psi\):  
      \[
      \psi(\{\succsim_i\}, \Omega) = \{\succsim_i^{\text{veil}}\}  
      \]  
      where \(\succsim_i^{\text{veil}}\) ranks \(s \in S\) by \(\mathbb{E}_{\mu} \left[ u_j(s) \right]\), with \(\mu\) uniform over \(j \in N\) (impartiality).  
    - Aggregation: \(f(\{\succsim_i^{\text{veil}}\}) = \succsim_{\text{col}}\) (e.g., maximin or Nash bargaining).  
    The "ought" is \(C_{\text{col}}(A)\).  

  - **Clean Translation?**  
    Only if \(f\) is purely mechanical (e.g., Nash product maximization). In practice, \(f\) encodes **substantive norms** (e.g., "maximin is fair").  

  #### **3. Deliberative Justification (e.g., Habermasian discourse)**
  - **Translation as Iterative Aggregation:**  
    - Start with initial preferences \(\{\succsim_i^0\}\) over principles \(P \subseteq X\).  
    - Apply deliberation dynamics \(D\):  
      \[
      \{\succsim_i^{t+1}\} = D\left( \{\succsim_i^t\}, \Omega^{\text{delib}}\right)  
      \]  
      where \(\Omega^{\text{delib}}\) enforces rules ("no deception", "full information sharing").  
    - Convergence: \(\{\succsim_i^*\} = \lim_{t \to \infty} \{\succsim_i^t\}\) if fixed point exists.  
    - The "ought" is \(f(\{\succsim_i^*\})\).  

  - **Distortion:**  
    Deliberation rules in \(\Omega^{\text{delib}}\) (e.g., "symmetric reciprocity") **encode normative constraints** on reasons. This is not value-neutral.  

  ---

  ### **Residue Analysis: The Normative Gap**
  Your suspicion is correct: all variants reduce to **either descriptive claims or covert normativity**.  

  #### **A. The Descriptive Reading**  
  - Claims like "\(\phi(\text{you})\) chooses \(x\)" are empirical predictions about a counterfactual agent.  
  - **Gap:** No bridge from "\(\phi(\text{you}) \text{ chooses } x\)" to "you ought to choose \(x\)".  
  - Example: If \(\phi\) adds full information, \(C^*(A)\) predicts what you *would* choose if informed. But:  
    - Why *should* you obey your informed self? (e.g., if informed-you values genocide).  
    - This requires a **normative axiom**: "Comply with \(\phi(\text{you})\)".  

  #### **B. The Covertly Normative Reading**  
  The idealization parameters \(\phi, \psi, D, f\) smuggle in substantive values:  
  1. **Ideal Counterpart:**  
     - If \(\phi\) enforces "undistorted desires", it assumes a **theory of distortion** (e.g., "addiction is irrational").  
     - **Distortion:** \(\phi\) maps to \(\succsim^*\) with *corrected utility*, not just coherent \(\succsim\).  

  2. **Idealized Agreement:**  
     - \(\psi\) imposes impartiality via uniform \(\mu\) over positions. But why not prioritarian weights?  
     - \(f\) (e.g., maximin) encodes **risk-aversion as morality**.  

  3. **Deliberation:**  
     - \(\Omega^{\text{delib}}\) rules out "unreasonable" arguments, building in a **substantive epistemology**.  

  **Result:** The "procedure" is a **disguised substantive theory**. The indirection fails to avoid normativity.  

  ---

  ### **The Residue: Authority of the Ideal**
  The irreducible residue is **first-person normative authority**:  
  - **Decision Theory Captures:**  
    - Belief improvement (\(\mu \to \mu^*\) via updating).  
    - Coherence (transitivity, completeness).  
    - Strategic rationality (e.g., equilibrium play).  
  - **It Cannot Capture:**  
    Why an agent *should adopt* the ideal counterpart's \(\succsim^*\) as their own *normative standard*.  
    - This is not a belief update (which changes \(\mu\)), but a **preference revision** (changing \(\succsim\)).  
    - Example: "My ideal self prefers philanthropy over luxury. But I *still want* luxury. Why *should* I change?"  

  **Your Vocabulary's Limitation:**  
  It can model *value-learning* (e.g., updating \(\mu\) about which \(x\) satisfies desire \(d\)), but not *value-revision* (e.g., why desire \(d\) should be replaced by \(d^*\)). The latter requires an external norm.  

  ---

  ### **Coherence: A Substantive Pun?**
  **Formal Coherence (Decision Theory):**  
  - Axioms: Transitivity, completeness, independence (for SEU).  
  - Purpose: Avoid behavioral inconsistency (e.g., money pumps).  
  - **Value-Neutral:** Does not require "reasonable" preferences.  

  **Metaethical "Coherence":**  
  - Includes:  
    - Recognition of "reasons" (e.g., empathy as rational).  
    - Immunity to "distortions" (e.g., self-deception).  
  - **Distortion:** This is **substantive**, not formal. Example:  
    - Formal coherence allows egoism.  
    - Deliberative theories often rule it out as "distorted".  

  **Verdict:** The term "coherence" is a **pun**. Metaethicists load it with normative content (e.g., "responding to moral reasons") that transcends transitivity/completeness.  

  ---

  ### **Conclusion**
  1. **All procedural views** collapse into either:  
     - **Descriptive models** (counterfactual predictions), or  
     - **Covertly substantive norms** (via idealization parameters).  
  2. **The residue** is the *authority claim* binding the agent to the ideal. This is irreducibly normative and external to your framework.  
  3. **Coherence demands** in metaethics are **thicker** than decision-theoretic axioms.  

  **Your Suspicion Confirmed:** The procedural machinery does less than advertised. The "ought" is either left dangling (descriptive) or presupposed in the idealization (covert normativity). The indirection avoids explicit value assertions but not implicit ones. Philosophers *are* smuggling in content—specifically, in how they define "improved" agents or "fair" procedures. Your framework exposes this elegantly.
