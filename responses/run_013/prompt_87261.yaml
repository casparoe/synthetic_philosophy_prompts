  Okay, let me approach this systematically. The user is clearly an expert in collective intentionality seeking to shift focus from individual-collective reduction to synchronic-diachronic dynamics. They need a prioritized research agenda for conceptual work, demanding careful justification of question selection and sequencing.

  First considering their core proposition: does diachronic joint action represent a genuine paradigm shift? The examples given - football clubs, legislatures, research programs - all demonstrate persistent collective agency despite membership flux. The key challenge appears to be accounting for identity continuity when no original members remain. This seems distinct from traditional debates about shared intention reduction.

  For the research agenda, three foundational questions emerge as candidates:
  1) Persistence conditions: What constitutes the numerical identity of a joint action across membership change? This must precede other inquiries as it defines the phenomenon itself. Tractability seems high for conceptual analysis through cases like orchestras replacing musicians mid-performance.

  2) Commitment transfer: How do obligations transmit between participants? The promissory example suggests this underpins normative continuity. It builds directly on question 1 but introduces deontic dimensions that could complicate analysis.

  3) Minimal participation thresholds: What degree of member overlap maintains collective identity? This seems downstream but critically tests solutions to 1 and 2. The queue example provides a stress test for theories.

  I'm weighing question 3 against alternative candidates like institutional scaffolding, but agree it offers sharper focus. The queue's fragility highlights what distinguishes robust from ephemeral collectives.

  On paradigm viability, the litmus test would be whether synchronic theories can explain diachronic cases through elaborate belief-chaining. If not, the reframing holds. The "ship of Theseus for groups" problem seems particularly fertile for uncovering new puzzles about membership contribution versus structural preservation.

  Notable omissions might include how technology enables discontinuous participation (e.g. open-source projects), but the proposed questions cover essential groundwork. Progress would come from either solving the promissory transmission problem or demonstrating its incoherence - both would decisively advance understanding.
answer: |-
  Here is a defended research agenda prioritising open questions in diachronic joint action, framed by your synchronic/diachronic distinction, for a three-researcher, two-year conceptual project. The agenda assumes the reframing's validity for now, with a critical assessment following the prioritisation.

  **Core Judgement on the Reframing:**  
  The synchronic/diachronic distinction *does* carve the phenomena at a joint. It shifts focus from static compositional analysis ("*What* constitutes 'we intend'?") to dynamic persistence and identity ("*How* does 'we intend' *endure* through change?"). It forces engagement with temporality, replacement, inheritance of commitment, and the metaphysics of collective continuity – issues largely bracketed in the reductionism debate. It *collapses back* only if one insists that diachronic cases *must* be reducible to a complex web of synchronic moments plus beliefs about the future/past. A key test is whether explaining persistence *requires* new conceptual resources (e.g., emergent institutional agency, novel commitment structures) beyond complex synchronic states plus mutual belief. If such resources are indispensable, the reframing stands. It would be a distraction only if all diachronic phenomena proved readily analysable as mere sequences of synchronic joint actions linked *only* by individual memories and expectations, without any genuine collective continuity.

  **Prioritised Research Agenda (6 person-years):**

  1.  **The Persistence Question: What constitutes the numerical identity of a diachronic joint action across participant change?**
      *   **The Question:** Precisely what conditions must be satisfied for a joint action (e.g., running a family firm, maintaining a research programme) to be considered the *same* ongoing collective endeavour when its participants change (through departure, replacement, death)? Is it continuity of the shared goal/project? Continuity of the underlying joint commitment *structure*? Continuity of the institutional role-holders? Something else? Does it require overlapping membership, or can it persist through complete turnover?
      *   **Why Upstream?** This is *the* foundational question. Without knowing what makes the joint action the *same* thing over time, we cannot coherently ask how commitments bind successors, what constitutes participation at a time-slice, or how obligations transfer. All other questions about diachronic joint action presuppose an answer to this identity question.
      *   **Tractability:** High for conceptual work. Analysis proceeds via constructing and comparing detailed cases (e.g., a queue where people leave and join vs. a symphony orchestra replacing musicians mid-season vs. a political party evolving over decades). It involves metaphysics (persistence conditions), action theory (identity of actions/activities), and social ontology.
      *   **Downstream Impact:** Resolution would fundamentally reshape the field. It would determine whether "collective intention" needs temporal persistence as a core feature, potentially demanding new ontological categories (beyond synchronic 'we-intentions'). It directly impacts legal concepts (corporate identity, succession), political theory (sovereignty, legitimacy), and organisational ethics.
      *   **Demotion Risk:** Low. Different answers (goal-based, commitment-based, role-based) likely lead to significantly different accounts of obligation transfer and minimal participation.

  2.  **The Commitment Transfer Question: How are normative positions (obligations, entitlements, authority) transmitted when participants join or leave an ongoing joint action?**
      *   **The Question:** When a new member joins (e.g., a new MP, a new employee inheriting a promise), how do they acquire the obligations and entitlements constitutive of participation? When a member leaves or dies, how are their normative relations dissolved or transferred? Does this require explicit agreement, tacit acceptance, institutional rules, or is it inherent in the structure of the ongoing commitment? (Your "promise honoured across a decade by three people in succession" is a prime case).
      *   **Why Upstream?** Directly dependent on the Persistence Question. The *mode* of transfer depends on *what* is persisting (the goal? the commitment structure? the institutional roles?). It is prior to questions about minimal participation or the nature of individual contribution, as it defines the normative framework within which participation occurs over time. You cannot understand what it means to *join* or *leave* without understanding what normative baggage is acquired or shed.
      *   **Tractability:** High/Medium. Builds on answers to Q1. Analysis focuses on normative structures (joint commitments, promises, institutional rules) and their temporal dynamics. Cases involve succession, inheritance of roles/projects, and the dissolution of obligations (e.g., resigning from a committee). Requires normative philosophy and deontic logic alongside social ontology.
      *   **Downstream Impact:** Crucial for understanding responsibility in long-term projects (climate change, institutional reform), the bindingness of collective decisions on new members, and the ethics of participation in evolving collectives. Failure to solve this undermines the very possibility of robust diachronic joint action.
      *   **Demotion Risk:** Medium. While answers will differ, a *satisfactory* account must explain normative force without circularity or magic. If all plausible answers converge on "it's just individual commitments to uphold institutional rules," it might demote the *distinctiveness* of collective commitment transfer, but still advances understanding significantly.

  3.  **The Minimal Participation Threshold Question: What constitutes 'participation' at a time-slice within a diachronic joint action, and what degree of member-overlap/continuity is necessary for persistence?**
      *   **The Question:** In an ongoing diachronic joint action (e.g., a legislature session, a football club across seasons), what must be true of the participants *at any given moment* for them to count as engaged in the *same* ongoing collective activity? Is mere role-occupancy sufficient? Must they actively 'buy into' the existing commitment? Further, what is the minimal requirement for continuity: must there *always* be some overlap in membership (like a relay), or can the joint action persist through *complete* replacement of participants if the structure remains (like a ship of Theseus for groups)?
      *   **Why Upstream?** Builds directly on Q1 (Persistence) and Q2 (Commitment Transfer). It operationalises the persistence conditions in terms of what individual participants are doing/being at specific times. It tests the robustness of answers to Q1. Can the club *be* the same club if, hypothetically, every member is replaced overnight but the roles and charter remain? This question probes the boundary conditions.
      *   **Tractability:** High. Ideal for case-based argumentation. Contrast highly structured institutions with clear roles (e.g., a court) with looser, more ephemeral collectives (e.g., your queue, a flash mob). Analyse cases of near-total turnover (revolutionary governments, companies acquired) vs. gradual change.
      *   **Downstream Impact:** Clarifies the relationship between individual agency and collective agency over time. Vital for understanding membership, belonging, and responsibility attribution in fluid groups. Helps distinguish robust diachronic joint actions from mere sequences of similar actions by different people.
      *   **Demotion Risk:** Low. Answers will significantly constrain or enable different models of persistence (Q1) and transfer (Q2). It directly challenges whether irreducibly collective diachronic phenomena *can* exist without continuous overlapping membership.

  **Question Dropped & Justification:**  
  *   **Potential Alternative:** *The Scaffolding Question: What is the role of external structures (rules, institutions, material artefacts) in enabling or constituting diachronic joint action?*  
  *   **Why Drop It?** While crucial, it feels more *downstream* and potentially less universally fundamental to the *core conceptual puzzle* of diachronic collective intentionality itself. Excellent answers to Q1-3 will *necessarily* involve implicit or explicit accounts of scaffolding (e.g., roles, rules, shared artefacts like constitutions or research databases *are* part of the persistence conditions and commitment structure). Focusing directly on scaffolding risks conflating enabling conditions with constitutive conditions. It might be better addressed *after* the core conditions of diachronic collective intentionality are clearer. Research time is better spent nailing down the core constitutive features of diachronic joint action (Q1-3), which will illuminate scaffolding's role.

  **Omissions Made Visible by the Reframing (Beyond Participant Change):**
  *   **The 'Original Participant Extinction' Problem:** Can a joint action *outlive every single original participant* while remaining the *same* action? (e.g., the UK Parliament, the Royal Society). If so, what sustains the collective intention? Is it purely the institutional structure and the commitments of *current* role-holders to fulfil the institutional purpose? This directly tests the irreducibility of the diachronic perspective.
  *   **Discontinuous Participation:** What is the status of members who leave and later rejoin? Does their original commitment reactivate? How does this differ from a new member?
  *   **The Dynamics of Goal Evolution:** How does the *shared goal* itself evolve within a diachronic joint action (e.g., a research programme shifting focus, a company pivoting)? How do changes in goal interact with persistence conditions and commitment transfer? Is significant goal evolution compatible with the persistence of the *same* joint action, or does it constitute a new one?
  *   **Temporally Extended 'We-Modes':** Does participating in a diachronic joint action require individuals to adopt a distinct, temporally extended 'we-mode' – thinking of oneself not just as a current participant, but as a link in a chain stretching backwards and forwards? How is this mode sustained?

  **What Moves Items Up/Down (Next 2 Years):**

  *   **Progress on Top Question (Persistence):**
      *   **Arguments/Counterexamples:** Development of a compelling counterexample showing that *no* purely synchronic account (even with complex mutual beliefs about past/future) can explain the identity of a collective action through complete, structured turnover without invoking a distinct diachronic collective entity or commitment structure. Conversely, a successful reductionist account handling such cases syncretically would be major progress (but might demote the reframing).
      *   **Adjacent Developments:** Advances in the metaphysics of social groups (e.g., new work on group agency or institutional persistence), temporal logic applied to collective action, or historical analyses of long-term collective endeavours providing rich case studies challenging existing models.
  *   **Evidence of Dead End (Persistence):**
      *   **Counterexamples:** A demonstration that *all* plausible persistence conditions for diachronic joint action either collapse into mereological sums of synchronic states or lead to absurdities (e.g., making persistence too easy or too hard, allowing clearly distinct actions to be 'identical').
      *   **Arguments:** A powerful argument showing that 'the same joint action' over time is *only* a useful fiction or metaphor, ultimately reducible without residue to sequences of individual actions coordinated by beliefs and rules, with no genuine collective temporal identity. Success here might shift focus entirely to Q2 (Transfer) as the core normative puzzle about rule-following over time, or potentially undermine the reframing's distinctiveness.
  *   **Shifts in Priority:** If significant progress is made on Persistence (Q1), Commitment Transfer (Q2) automatically becomes the top priority. If Persistence (Q1) stalls but compelling cases emerge demonstrating the *normative* puzzles of transfer (Q2) are tractable and profound independently (e.g., novel analyses of your promissory succession case), Q2 could rise. If Minimal Participation (Q3) yields a clear answer that *no* diachronic joint action can persist without continuous overlapping membership, this would radically simplify (or potentially undermine) the need for complex persistence conditions (Q1) and transfer mechanisms (Q2), refocusing the field. Developments in adjacent fields like law (succession, corporate identity) or organisational theory could highlight the urgency of Q2 or Q3.

  This agenda leverages the synchronic/diachronic reframing to target the conceptually deepest and most distinctive puzzles of collective action over time, prioritising questions where progress would be transformative and where unresolved issues demonstrably block understanding elsewhere. It maximises the impact of conceptual work within the constraint of six person-years.
