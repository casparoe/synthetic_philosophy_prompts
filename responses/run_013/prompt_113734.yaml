  3. **BI is flawed because of reciprocity or fairness**: Players care about the other player's payoff or have social preferences.
  4. **BI is flawed because of the finite horizon**: The game is too long or players don't believe it will end at the last node (e.g., due to trembling hand or other reasons).
  5. **BI is flawed because of the inductive step**: The assumption that players will act rationally at the last node is not necessarily true, or players might doubt it.
