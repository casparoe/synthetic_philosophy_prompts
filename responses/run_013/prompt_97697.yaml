  ### Decision Procedure for Identity Claims in Shared-World Fiction Archive

  **Procedure Overview**:  
  This 5-step procedure evaluates identity claims by distinguishing rigidity *within* a branch (a single possible world) vs. *across* possible worlds (branches). It prioritizes branch type (continuation vs. counterpart) and reference-fixing events to avoid metaphysical conflation. Assistants must answer sequentially; proceed only if criteria are met. Time limit: 30 minutes per submission.

  ---

  #### **Step 1: Determine Branch Type**  
  **Question**: *Is the branch a **continuation** of a base branch (same history, divergent event) or a **counterpart world** (no shared individuals)?*  
  - **Sufficient Answer**:  
    - "Continuation": Branch shares pre-divergence history with a base branch.  
    - "Counterpart": No shared individuals/events with any base branch.  
  - **Stop → ACCEPT (No Further Checks)**: If **counterpart world**.  
    - *Reason*: Authors freely stipulate reference in wholly independent worlds.  
  - **Proceed to Step 2**: If **continuation**.  
  - **Send to Editor**: If ambiguous (e.g., "partially shared" or undefined).  

  #### **Step 2: Identify Divergence Point**  
  **Question**: *What is the **exact divergence point** from the base branch?*  
  - **Sufficient Answer**: Specific event/timestamp (e.g., "diverges in 1805 after Napoleon’s coronation").  
  - **Stop → REJECT**: If divergence point is **after** the event fixing reference for the term(s) in question (see Step 4).  
    - *Reason*: Pre-divergence facts are immutable in continuations.  
  - **Proceed to Step 3**: If divergence point is **before** reference-fixing or unclear.  
  - **Send to Editor**: If divergence point is missing or contested.  

  #### **Step 3: Classify Term Type**  
  **Question**: *Is the term a **proper name** (e.g., "Napoleon"), a **natural kind term** (e.g., "water"), or a **descriptive phrase** (e.g., "morning star")?*  
  - **Sufficient Answer**:  
    - **Proper name**: Picks out a specific entity (rigid *across worlds* in continuations).  
    - **Natural kind term**: Refers to a substance/species (rigid *within a branch*).  
    - **Descriptive phrase**: Non-rigid label (e.g., "the winner of Austerlitz").  
  - **Stop → REJECT**: If a proper name’s reference was fixed pre-divergence (Step 2).  
    - *Reason*: Proper names rigidly designate the same entity across continuation branches.  
  - **Proceed to Step 4**: For natural kind terms or descriptive phrases.  
  - **Send to Editor**: If term type is ambiguous (e.g., "water" used as a nickname).  

  #### **Step 4: Assess Reference-Fixing Event**  
  **Question**: *When was the term’s reference **fixed in the base branch**, and is it **necessary a posteriori**?*  
  - **Sufficient Answer**:  
    - Event description (e.g., "water’s reference fixed when chemistry discovered it’s H₂O").  
    - "Necessary a posteriori": True in all scenarios *within the branch* (e.g., water is H₂O in all branch contexts).  
  - **Stop → REJECT**: If:  
    - A natural kind term’s reference was fixed pre-divergence, *and* the claim contradicts necessary a posteriori truth (e.g., "water is not H₂O").  
    - A descriptive phrase’s reference relies on pre-divergence facts (e.g., "morning star" = Venus).  
  - **Proceed to Step 5**: If reference was fixed post-divergence or is contingent.  
  - **Send to Editor**: If reference-fixing is undefined (e.g., no archive record).  

  #### **Step 5: Evaluate Claim Modality**  
  **Question**: *Is the claim a **necessary truth within the branch**, a **contingent stipulation**, or a **category error**?*  
  - **Sufficient Answer**:  
    - **Necessary truth**: Holds in all counterfactuals *within the branch* (e.g., "water is XYZ" as essential).  
    - **Contingent stipulation**: Could be otherwise (e.g., "Napoleon became a poet" not affecting identity).  
    - **Category error**: Misattributes properties (e.g., "water is alive").  
  - **Stop → ACCEPT**: If claim is contingent or necessary but reference fixed post-divergence.  
  - **Stop → REJECT**: If category error.  
  - **Send to Editor**: If necessity/contingency is unclear.  

  ---

  ### Case Verdicts Using the Procedure  
  **Case 1: Claim**  
  *"In this branch, the morning star and evening star are two different bodies."*  
  - **Step 1**: Continuation branch.  
  - **Step 2**: Divergence pre-astronomical discovery (reference unfixed).  
  - **Step 3**: Descriptive phrases (non-rigid).  
  - **Step 4**: Reference fixed to Venus in base branch (pre-divergence).  
  - **Step 5**: **REJECT**  
    - *Why*: Descriptions rely on pre-divergence facts (Venus exists). Claim violates necessary a posteriori truth (both terms designate Venus).  
    - *Rigidity Type*: Within-branch rigidity (descriptions must align with actual astronomy).  

  **Case 2: Claim**  
  *"In this branch, ‘water’ refers to XYZ (not H₂O) with identical properties."*  
  - **Step 1**: Continuation branch.  
  - **Step 2**: Divergence post-1750 (reference fixed in base branch).  
  - **Step 3**: Natural kind term.  
  - **Step 4**: Reference fixed to H₂O pre-divergence (necessary a posteriori).  
  - **Verdict**: **REJECT** (You will not like this)  
    - *Why*: Water’s identity as H₂O is necessary within the branch. Allowing XYZ contradicts archive canon for continuations.  
    - *Defense*: If water is not H₂O, it is not water—this breaks cross-branch rigidity for natural kinds. Author must use a counterpart world.  
    - *Rigidity Type*: Within-branch rigidity (water must be H₂O in all branch scenarios).  

  **Case 3: Claim**  
  *"In this branch, ‘Napoleon’ is a different person (same parents, same life events)."*  
  - **Step 1**: Continuation branch.  
  - **Step 2**: Divergence after Napoleon’s birth (reference fixed).  
  - **Step 3**: Proper name.  
  - **Step 4**: Reference fixed pre-divergence.  
  - **Verdict**: **REJECT**  
    - *Why*: Proper names rigidly designate the same individual across continuations. "Same parents/life" implies numerical identity; claim is contradictory.  
    - *Rigidity Type*: Across-world rigidity (continuations share entities).  

  ---

  ### What the Procedure Cannot Do  
  1. **Judgment Calls Left to Editor**:  
     - **Ambiguous Terms**: E.g., Is "the Phoenix" a proper name or description?  
     - **Reference-Fixing Gaps**: Unrecorded events in archive canon.  
     - **Necessity/Contingency Debates**: E.g., Is "Napoleon’s personality" essential?  
     - *Why*: These require nuanced interpretation of author intent or canon.  

  2. **Lost in Simplification**:  
     - **Partial Rigidity**: Terms rigid in some contexts but not others (e.g., "Aristotle" for philosopher vs. shipping magnate).  
     - **Cross-Branch Counterparts**: Whether entities are "similar enough" for non-continuation branches.  
     - *Why*: Procedure prioritizes binary checks (fixed/unfixed, rigid/non-rigid) for speed.  

  3. **Value vs. Fact Risks**:  
     - **Mistaking "Plausibility" for Rigidity**: Assistants may reject claims for being "weird" (e.g., sentient water) rather than checking reference-fixing.  
     - **Over-Prioritizing Canon**: Ignoring that descriptive terms (e.g., "morning star") can have variant uses post-divergence if reference isn’t fixed.  
     - *Mitigation*: Strict adherence to Steps 3–4 prevents this.  

  ---

  **Why This Ordering?**  
  1. Branch type (Step 1) is foundational—counterpart worlds bypass metaphysics.  
  2. Divergence point (Step 2) eliminates continuations violating pre-established facts early.  
  3. Term type (Step 3) and reference-fixing (Step 4) isolate the rigidity axis (within/across worlds).  
  5. Modality (Step 5) catches edge cases (e.g., category errors).  
  This sequence minimizes time spent on hopeless cases (e.g., rejecting post-fixed continuations in Step 2).
