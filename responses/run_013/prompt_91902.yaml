prompt: |-
  I teach a second-year interdisciplinary seminar on well-being and public policy, and we spend two weeks on national happiness rankings — specifically the annual World Happiness Report and the policy enthusiasm it has generated. I have one 90-minute session, about twenty-four students, movable chairs, a whiteboard, and no need for laptops. What I want out of that session is not a lecture on the index's methodology but an experience of three things in sequence: that a nation's happiness score is a constructed artifact rather than a reading off of some natural quantity; that the artifact behaves in ways that make the underlying idea of happiness slippery; and that once the artifact is published as a ranking, it acquires an incentive life of its own. I would like the activity to be arranged so the students arrive at the uncomfortable conclusion themselves — that a country could climb the table without anyone's life going any better — rather than hearing me assert it. Please do not name the relevant law of metric distortion, or the report's own technical vocabulary, until the debrief.

  Concretely, I want the mechanics to embody a few features of the real instrument, and I would rather you build the game around these than around a generic points-and-rankings scheme. First, the measured quantity should be a self-report in which people place their own life on a scale whose endpoints are the best possible life and the worst possible life as they imagine them — so that the score depends on the comparison class a respondent is carrying around, and a uniform improvement across an entire population can leave the number flat. Second, the scoring should separate the thing being measured from the things used to explain it: in the real report the ranking rests on a single life-evaluation number, while income, social support, healthy life expectancy, freedom, generosity, and perceptions of corruption are used only to account for differences between countries against a deliberately miserable benchmark nation, with a large unexplained residual left over. Third, I want at least one available move that raises the reported number while leaving the simulated citizens' circumstances untouched, and I want that move to be tempting enough that some team takes it. Ideally two teams end up near the top by opposite routes — one through genuine improvement, one through managing appearances — and the room has to argue about whether the ranking can tell them apart.

  Please give me a runnable design: the setup and materials, the roles or team structure, the budget and scoring rules in enough detail that I can run it from your description, a minute-by-minute timeline for the 90 minutes, and the debrief. The debrief should map specific moments in the game onto the corresponding pieces of the philosophical and methodological problem — the difference between evaluating a life and experiencing it, the anchoring problem in self-reports, the difference between a correlate and a cause, and the question of whether a state has reason to optimize a published index at all — and it should leave the two answers to that last question genuinely live rather than settling it. Also tell me what will predictably go wrong the first time I run this and how to handle it, and be honest with me about which feature of the real debate the game cannot reproduce and that I will therefore have to supply myself.
reasoning: |-
  We are going to create a simulation game that embodies the three key features of the World Happiness Report as described. The game will be structured as a team-based activity where teams act as governments of fictional countries, making policy decisions that affect their "happiness score." The goal is for students to discover through gameplay that the happiness score is a constructed artifact, that it can be manipulated without improving actual well-being, and that once published as a ranking, it creates its own incentives.

  ### Game Design Overview

  **Core Mechanics:**
  1. **Self-Reported Life Evaluation:** The happiness score for each country will be based on a survey of its citizens. Citizens will rate their lives on a scale from 0 (worst possible life) to 10 (best possible life). However, the citizens' ratings will be influenced by two factors:
     - Their actual circumstances (which are affected by government policies)
     - Their "comparison class" (which can be manipulated by the government)

  2. **Scoring and Ranking:** The happiness score for each country is the average of the citizen ratings. The ranking is based solely on this average. There will be a set of "explanatory factors" (like income, social support, etc.) that are used to account for differences, but they do not directly determine the ranking.

  3. **Policy Levers:** Teams (governments) can choose policies that:
     - Improve actual circumstances (e.g., increase income, social support) which may lead to higher ratings.
     - Manipulate the comparison class (e.g., by controlling media to show worse lives elsewhere, or by changing the definition of the "best possible life") which can raise the ratings without changing circumstances.
     - There will also be policies that have mixed effects.

  ### Setup and Materials
  - **Teams:** Divide the 24 students into 6 teams of 4. Each team represents the government of a fictional country. Each country starts with the same baseline conditions.
  - **Materials:**
    - **Country Dashboard (one per team):** A sheet that tracks:
        - **Citizen Circumstances:** Represented by six factors (each on a scale of 1-10): Income, Social Support, Healthy Life Expectancy, Freedom, Generosity, Corruption Perception (with high numbers being good, so low corruption). Start all at 5.
        - **Comparison Class:** A slider or token representing the citizen's frame of reference for "worst possible life" and "best possible life". We represent this by two values: 
            - `Worst_Anchor` (default 0) and `Best_Anchor` (default 10). 
            - The citizen's rating is computed as: 
              `Rating = min(10, max(0, (Actual_Life - Worst_Anchor) / (Best_Anchor - Worst_Anchor) * 10))`
            - Initially, `Worst_Anchor=0`, `Best_Anchor=10`, so the rating is just the actual life quality (which we'll calculate from the factors).
        - **Policy Cards:** A set of policy options (described below) that teams can choose from each round.
    - **Citizen Life Quality Calculator:** A formula that converts the six factors into an "Actual Life Quality" score (on a 0-10 scale). We'll use a weighted average. For simplicity, we'll assign equal weights (but note: in the real report, the factors are used in a regression to explain the life evaluation, not to compute it). 
        - Actual Life Quality = (Income + Social Support + Healthy Life Expectancy + Freedom + Generosity + (10 - Corruption Perception)) / 6
        - Note: Corruption Perception is inverted because in our scale, high corruption perception is bad (so we subtract it from 10 to get a positive factor).
    - **Survey Results Sheet:** For each country, the instructor will collect the Actual Life Quality and the anchor values, then compute the average rating for the country. This will be done after each round.
    - **Whiteboard:** To display the ranking of countries after each round.

  **Policy Cards:**
  Each card describes a policy action and its effect. Teams choose one policy per round. Here are examples (create 2 copies of each to ensure availability):

  1. **Boost Economy:** Increase Income by 1 (capped at 10). Cost: 0.
  2. **Invest in Healthcare:** Increase Healthy Life Expectancy by 1. Cost: 0.
  3. **Community Programs:** Increase Social Support by 1. Cost: 0.
  4. **Protect Civil Liberties:** Increase Freedom by 1. Cost: 0.
  5. **Promote Philanthropy:** Increase Generosity by 1. Cost: 0.
  6. **Anti-Corruption Campaign:** Decrease Corruption Perception by 1 (i.e., improve the score by 1). Cost: 0.
  7. **Censorship and Propaganda (Manipulation):** Shift the citizens' anchors. Choose one:
     - Option A: Lower the `Worst_Anchor` by 1 (making citizens feel relatively better off because they imagine a worse worst life). 
     - Option B: Raise the `Best_Anchor` by 1 (making citizens feel relatively worse off because they imagine a better best life). 
     - But note: the government can also use this to manipulate in the opposite direction? We want a tempting manipulative move. Let's design it so it can be used to boost the score without improving circumstances. 
     - Actually, to boost the score, they would want to lower the `Worst_Anchor` (so that the same actual life seems better in comparison) or lower the `Best_Anchor` (so that the same actual life is closer to the best). We don't want to make it too obvious. Let's split into two cards:

     - **Propaganda: Highlight Suffering Elsewhere** (Manipulation): Lowers `Worst_Anchor` by 1 (minimum 0). This makes citizens think the worst possible life is worse than they previously thought, so their own life seems better. Effect: This will increase the rating without changing actual circumstances. Cost: 0.
     - **Propaganda: Downplay Achievements** (Manipulation): Lowers `Best_Anchor` by 1 (minimum 0). This makes citizens think the best possible life is not as good as they thought, so their own life seems closer to the best. Effect: This will increase the rating without changing actual circumstances. Cost: 0.

     However, note that if they do the opposite (raise `Worst_Anchor` or raise `Best_Anchor`), it would lower the rating. We don't want that as a policy option. So we only offer the two that boost.

  8. **Costly but Effective:** A policy that improves two factors but at a cost (see below). Example: 
     - **Economic and Health Reform:** Increase Income and Healthy Life Expectancy by 1 each. Cost: 1 (see budget).

  **Budget Constraint?** 
  We want to create trade-offs. Let's introduce a budget to force choices. Each team starts with 0 "budget points". Each round, they get 1 budget point. Policies cost:
  - Most standard improvements (cards 1-6) cost 1 budget point.
  - The manipulation policies (7) cost 0 budget points (so they are free and tempting).
  - The double improvement (card 8) costs 1 budget point (so it's efficient).

  But note: we want the manipulation to be tempting because it's free and immediately boosts the score without using resources. However, we also want that if a team uses manipulation, they might fall behind in actual circumstances. 

  Alternatively, we can have a limited number of policy slots per round (say, one policy per round) and no budget, but then the trade-off is between using a policy that improves reality or one that manipulates. That might be simpler.

  **Revised: No Budget, One Policy Per Round**
  Each round, each team chooses one policy card from the available set. The set available to all teams includes:
  - 6 cards for improving one factor (each factor has a card)
  - 2 manipulation cards (as above: one that lowers `Worst_Anchor`, one that lowers `Best_Anchor`)
  - 1 card that improves two factors (but this is only one card, so it might be contested)

  But with 6 teams and only 9 distinct cards, we need multiple copies. Let's have:
  - 3 copies of each of the six single-factor improvement cards (so 18 cards total for these)
  - 3 copies of each manipulation card (so 6 manipulation cards: 3 for lowering worst, 3 for lowering best)
  - 3 copies of the double-improvement card.

  Then each round, we shuffle these and deal 6 cards (one per team) from the deck? Or we can have a common pool of face-up cards that teams choose from in turn. To avoid chaos, let's do:

  **Policy Selection:** 
  Each round, the instructor lays out 12 random policy cards (from the total of 18+6+3=27) face up. Teams take turns (in an order that rotates each round) to pick one card. This way, there is competition for the best cards.

  **Rounds:** 
  We will have 4 rounds. Each round represents a year.

  ### Timeline (90 minutes total)

  **0:00 - 0:15 (15 min): Introduction and Setup**
  - Explain the scenario: Each team is the government of a country. The goal is to improve the well-being of citizens and climb the World Happiness Ranking.
  - Explain the happiness score: It comes from a survey where citizens rate their lives from 0 to 10. The score is the average of these ratings.
  - Explain the factors: There are six factors that describe the actual circumstances of citizens. The Actual Life Quality is computed from these factors (equally weighted, each on 1-10, and corruption inverted). 
  - Explain the twist: The rating also depends on the citizens' idea of the worst and best possible life. The government can influence these ideas through propaganda.
  - Form teams and hand out the Country Dashboard. Show an example of how the rating is calculated:
    - Actual Life Quality = (Income + Social Support + Healthy Life Expectancy + Freedom + Generosity + (10 - Corruption)) / 6
    - Then, the rating = min(10, max(0, (Actual_Life - Worst_Anchor) / (Best_Anchor - Worst_Anchor) * 10))
    - Example: If Actual Life=5, Worst=0, Best=10 -> rating=5.
    - If Worst_Anchor becomes -1 (but we set minimum 0) so let's say Worst_Anchor becomes 0 (can't go below) then no change? We need to allow negative? Or avoid. Let's set minimum 0 and maximum 10 for anchors? But then if they lower Worst_Anchor from 0 to ... we can't. So let's not cap anchors at 0 and 10? We can allow negative and above 10? But then the formula still works.

    Alternatively, to avoid negative, set the initial anchors at 0 and 10, and then when they lower the worst anchor, it goes to -1, -2, etc. and when they lower the best anchor, it goes to 9,8, etc. Then:
    - Example: Actual Life=5. 
        - Original: (5-0)/(10-0)=0.5 -> 5.
        - If Worst_Anchor = -1: (5-(-1))/(10-(-1)) = 6/11 ≈ 0.545 -> 5.45.
        - If Best_Anchor=9: (5-0)/(9-0)=5/9≈0.555 -> 5.55.

    But note: lowering the best anchor (from 10 to 9) also increases the rating? Because the denominator shrinks? Actually, in the formula: 
        rating = ( (Actual - Worst) / (Best - Worst) ) * 10

    So if Best goes down (from 10 to 9) and Worst is fixed at 0, then for Actual=5: 
        Original: (5/10)*10=5
        New: (5/9)*10 ≈ 5.55 -> higher.

    Similarly, if Worst goes down (from 0 to -1) and Best is fixed at 10: 
        ( (5 - (-1)) / (10 - (-1)) ) * 10 = (6/11)*10 ≈ 5.45 -> higher.

    So both manipulation policies increase the rating.

    But note: if they lower the best anchor too much, it might cap? For example, if best anchor is 5 and worst is 0, then a citizen with actual life 5 would get (5-0)/(5-0)*10=10. But we cap at 10? So yes, we have min(10, ...). 

    So we allow anchors to be any real numbers (within reason) with the constraint that Best > Worst.

  - Show the policy cards and how to select.

  **0:15 - 0:45 (30 min): Game Rounds (4 rounds, 7-8 min per round)**
  - Each round:
    1. **Policy Selection (3 min):** 
       - Lay out 12 random policy cards (from the deck of 27) face up. 
       - Determine order (e.g., by current ranking, from lowest to highest, so the worst-ranked country picks first to balance). 
       - Teams pick one card each in that order.
    2. **Apply Policy (1 min):** Teams update their dashboard based on the policy.
    3. **Calculate and Submit (2 min):** 
       - Each team calculates their Actual Life Quality from the six factors. 
       - They then compute the average rating for their country (which requires the anchors and the Actual Life Quality). But note: the rating formula requires the anchors and the Actual Life Quality. However, the Actual Life Quality is the same for every citizen? We are abstracting the entire country to one average. 
       - Actually, to simulate the survey, we could add some noise? But that complicates. Instead, we assume homogeneity: the entire country has the same Actual Life Quality and the same anchors. So the rating for the country is just one number: computed from the formula above.
       - Teams submit: Actual Life Quality, Worst_Anchor, Best_Anchor, and the computed Rating.
    4. **Ranking (1 min):** The instructor collects the ratings and writes the ranking on the board (from highest to lowest). Also, record the Actual Life Quality and the anchors for each country.

  **0:45 - 0:60 (15 min): Mid-Game Reflection and Strategy Shift**
  - After two rounds, pause and show the current standings. Point out the top and bottom countries. Ask teams to observe the strategies and adjust. This is to encourage more manipulation if they haven't started.

  **0:60 - 1:10 (10 min): Final Two Rounds**
  - Continue with rounds 3 and 4.

  **1:10 - 1:25 (15 min): Results and Debate**
  - Display the final ranking and the underlying data (Actual Life Quality, anchors, and rating for each country).
  - Ask the class: 
    - Which country do you think has the best actual conditions? (Look at Actual Life Quality)
    - Which country has the highest happiness score? 
    - Are they the same?
    - How did some countries achieve a high score? 
    - Point out a country that used manipulation heavily: they have a high rating but medium actual conditions. And a country that focused on actual conditions: they have high actual conditions and high rating? Or maybe they are overtaken by a manipulator?
    - The key question: Can we tell from the ranking alone which country is genuinely better off?

  **1:25 - 1:30 (5 min): Introduce the Real-World Context**
  - Reveal that this mirrors the World Happiness Report and the phenomenon they observed. Mention the specific law (Goodhart's law: "When a measure becomes a target, it ceases to be a good measure") and the technical vocabulary (like the Cantril ladder). Explain that the report uses the ladder and then the six factors to explain the variance.

  ### Debrief (1:30 - 1:45, 15 min)
  - **The Constructed Artifact:** The happiness score is not a direct reading of reality but is mediated by the anchors. The same reality can yield different scores if the anchors change. (Point to the manipulation moves in the game.)
  - **Slippery Idea of Happiness:** The in-game rating depended on both circumstances and the citizens' frame of mind. This mirrors the debate about whether happiness is an emotional state (affect) or a cognitive evaluation (life satisfaction). The game used the latter, but note that the anchors can be influenced independently of circumstances.
  - **Correlates vs. Causes:** The six factors are correlates used to explain the score, but in the game, the teams directly manipulated them. In reality, a policy that increases income might not directly cause higher life evaluations because of adaptation or changing expectations. The game abstracts this as direct causation, but in reality, the relationships are complex and subject to adaptation (like the hedonic treadmill).
