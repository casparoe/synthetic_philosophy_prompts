prompt: |-
  I'm a science and ideas journalist, and in a few weeks I've been asked to run a seventy-five-minute session for the data desk of a metropolitan daily: a dozen reporters who can read a regression table and took one college statistics course, ten years ago. The subject is why the uncertainty we publish is almost always a single number, and what we give up by pretending it is one. I don't want the session to be a lecture on imprecise probability, and I emphatically don't want you to explain the topic to me; I want you to plan how I should teach it, with a whiteboard, no slides, and no notation beyond what I can put up in a minute. So: what has to come first, and what depends on what? My own instinct is that a room cannot see the point of a range of credences until it has first felt the full force of the argument that a rational agent's degrees of belief must be precise (the betting argument, the one that says that if you will buy and sell at odds that don't correspond to any single probability, someone can arrange to take money off you no matter how the world turns out), and that the session only works if the audience accepts that argument and then watches it come apart. If that ordering is right, tell me exactly where the pivot belongs and what has to be in place before it can land; if it's wrong, tell me what the real dependency structure is. One specific question: does the formalism have to be on the board before or after the intuitive case that motivates it? I mean the move from "my credence is 0.4" to "my credences are the set of all probability functions that satisfy certain constraints," together with the fact that the lower and upper bounds of such a set need not themselves be probabilities of anything.

  For the case that carries the whole session, I had planned the two-urn setup: one urn whose composition is stated, a second urn where I know only that it holds a hundred balls, red or black in some unstated proportion, and the usual pull toward betting on the known urn. Is that the right carrier, and if so, what must it be made to do that it doesn't do on its own; if not, what should replace it? I'm suspicious of it on two grounds. Everyone has seen it, so it arrives pre-loaded with sixty years of commentary and the audience may simply recognise it rather than think about it; and it invites the reading that the second urn's composition is merely unknown, when the point I want them to leave with is that some questions about my own state of belief have no answer, and that this is not the same as ignorance, and not the same as a second-order probability either. It isn't that I have a distribution over distributions; it's that my credence is genuinely a range, and the range is not a summary of what I don't know. Whatever carries the session also has to be able to do something later on: show that gathering evidence can make a range wider rather than narrower, which is the result that breaks most people's grip on the picture, and which I'd like them to reach as a conclusion rather than be told. If a different example can carry both jobs, I'd rather use it.

  Then the misconceptions, which are really what I'm paying for. I'd like a list of the ones this audience will predictably bring in or form, each with the exact point in the sequence where it should be headed off, and a one-line way of heading it off that doesn't require the machinery I've said I won't put on the board. My own guesses, to be corrected: that a range just means "we don't know"; that anything a range can do a prior over priors can do, so the whole topic is a detour a good Bayesian can skip; that imprecision is a licence for wishful thinking, since if your credences are a set you can always find a member that likes the conclusion you wanted; that the bounds are probabilities of something in the world; that imprecision is a temporary defect that more evidence will always cure; and that this is a topic about groups disagreeing rather than about one person's state of mind. I expect the most serious objection belongs near the end and that I should present it in its strongest form myself: that a set of credences is just a committee of precise agents, so nothing is gained and the real work is merely displaced into an unprincipled choice of decision rule. Tell me whether that is the right objection to foreground, where it should go, and how much of the standard battery of decision rules (act only on options that are optimal under some member of the set; rank options by their worst case; some weighted compromise between best and worst case) a room like this needs in order to see the problem, versus how much I should openly refuse to explain. End with the single question I should ask in the last five minutes to find out whether the distinction actually landed rather than whether they enjoyed the hour, and with what I should say out loud that I am leaving out at this level. Throughout, please separate what is settled from what is genuinely contested among people who work on this for a living, and don't hand me a contested position as though it were the consensus; if some part of what I've assumed above is itself disputed, say so plainly, because I will be repeating it to reporters.
reasoning: |-
  We are designing a 75-minute session for data journalists on why published uncertainty is often a single number and the limitations of that practice. The session should avoid heavy formalism and focus on intuitive understanding. The journalist has a strong background and wants to avoid lecturing on imprecise probability.

  The journalist's proposed structure:
  1. Start with the argument that rational agents must have precise credences (the Dutch book argument).
  2. Then show how this breaks down, leading to the need for imprecise probabilities (sets of probabilities).

  Key goals:
  - Show that some states of belief are inherently range-valued, not due to ignorance or second-order probabilities.
  - Demonstrate that gathering evidence can sometimes widen the range.
  - Address common misconceptions.

  Proposed example: the two-urn problem (Ellsberg paradox). Concerns: it's well-known and might be misinterpreted as mere ignorance.

  Alternative example: We need one that can also show evidence widening the range.

  Structure:

  I. Introduction (5 min)
     - State the problem: We publish single numbers for uncertainty (e.g., "60% chance of rain") but often that's an oversimplification.
     - What do we lose? Why does it matter?

  II. The Case for Precise Probabilities (15 min)
     - Dutch book argument: Show that if your betting odds don't correspond to a single probability, you can be exploited (a "Dutch book").
     - Use a simple example: a coin flip. Suppose you say you'd bet on heads at 1:1 and also on tails at 1:1. Then someone can offer you both bets and you lose money no matter what. But if you have a precise probability, say 0.5, you set your odds so that you break even in expectation.
     - Whiteboard: Set up a simple betting scenario. Show that if buying and selling prices don't match a probability, there is a set of bets that leads to a sure loss.
     - Key: The audience must accept that rational agents should avoid sure losses.

  III. Breaking the Precise Model (25 min)
     - Introduce the two-urn problem (Ellsberg) but with a twist to avoid the "mere ignorance" interpretation.
     - Setup:
          Urn A: 50 red, 50 black balls (known).
          Urn B: 100 balls, red and black in unknown proportion.
          You are to draw one ball from one urn and bet on red (or black).
     - Ask: Which urn would you prefer to bet on? (Most prefer Urn A for either color.)
     - Now, if we force precise probabilities, we run into a problem. For Urn B, if you assign a precise probability p to red, then you should be willing to bet on red at odds p: (1-p). But many people are not willing to do so for any p? Actually, they are, but they are reluctant and would require better odds for Urn B than for Urn A.
     - The point: The reluctance is not just about lack of knowledge; it's about ambiguity. Your state of belief for Urn B is not captured by a single number. It's a range: say [0.4, 0.6] for red? But note: the actual proportion is fixed but unknown. However, the key is the agent's belief state. We want to express that the agent is not sure enough to commit to a single number.

     - Pivot: How do we model this? We use a set of probabilities. For Urn B, the set might be all probabilities from 0 to 1? But that's too wide. Typically, we might use a set that reflects the ambiguity. However, the point is that the agent's belief is represented by a set of probability functions.

     - But the journalist wants to avoid the interpretation that the range is about ignorance of the true proportion. We must emphasize: the set is about the agent's own state of belief. It's not that there is a true probability out there that we are uncertain about (that would be second-order). It's that the agent's belief is indeterminate.

     - Alternative approach to make the point without the urn? We could use an example with a real event that has no clear chance setup. For example: "What is the probability that a particular policy will reduce crime by 10%?" There is no urn, and the uncertainty is not just about missing data but about the complexity of the system.

     - However, we need an example that can also show evidence widening the range. The urn example might not do that naturally.

     - Proposed alternative: A medical test example with an unknown disease prevalence and an imperfect test. But this might lead to a second-order probability.

     - Let's try: Suppose we have a new disease and we don't know the prevalence. We have a test that has 90% sensitivity and 95% specificity. We test a person and get a positive. What's the probability they have the disease?

     - Without knowing the prevalence, we cannot give a single number. We can give a range: if the prevalence is 1%, then the positive predictive value (PPV) is about 15.4%. If the prevalence is 50%, then the PPV is about 94.7%. So the PPV can be anywhere between about 15% and 95%. But note: this range is due to ignorance of the prevalence. So it might reinforce the "ignorance" interpretation.

     - To avoid that, we could consider a scenario where the evidence itself is ambiguous. For instance, we have two conflicting studies about the prevalence. Study A says prevalence is 1%-5%, Study B says 40%-60%. Then our overall belief about prevalence is not captured by a single distribution? But then we are back to sets of distributions.

     - We want an example where the evidence doesn't narrow the set but might even expand it. For instance, we get a new piece of evidence that contradicts previous evidence. Then we might have to consider a wider set of possibilities.

     - Example: Suppose we are trying to predict the outcome of a political event (e.g., will the bill pass?). Initially, we have some set of scenarios. Then we get information that one key supporter is wavering. But we don't know if that makes it more or less likely? Because it might depend on other factors we don't know. So our set of probabilities might become wider.

     - However, this is abstract. We need a numerical example.

     - Alternative: Use the Ellsberg urn but then add evidence. Suppose we are allowed to draw a sample from Urn B. We draw 10 balls and get 5 red and 5 black. That might narrow the range? But what if we get 10 red? Then the range might become [0.5, 1]? But that's still a narrowing.

     - We want an example that widens. How about: Initially, we have two experts. Expert A says the prevalence of a disease is between 10% and 30%. Expert B says it is between 5% and 15%. Then we combine? The combined range might be [5%,30%] which is wider than either? But that's about combining sources, not updating with evidence.

     - How about: We have a coin that might be fair or might be two-headed. Initially, we don't know. So our credence for heads is the set {0.5, 1}. Now we flip and it comes up heads. What happens? We update by conditioning each probability in the set. So the set becomes: for the fair coin, P(heads|first flip heads)=0.5? Actually, no: the fair coin would still be 0.5 for the next flip, but the two-headed is 1. But also, we update the weights? Wait, if we have a prior over the two possibilities, we update the prior. But without a prior, we condition each and the set remains {0.5,1}. So it doesn't narrow? But it also doesn't widen.

     - To get widening: Consider a set that is not finite. Suppose we have a coin from a factory that produces coins with a bias between 0.4 and 0.6. Initially, our set for the next flip is [0.4,0.6]. Now we flip and get heads. How to update? We use generalized Bayesian updating. The updated set for the next flip might be [0.4,0.6] again? Or if we consider the bias, we might get a posterior set for the bias that is still [0.4,0.6]? That doesn't change.

     - We need a more complex model. Let me recall an example from the literature: the "three prisoners" problem or similar. Alternatively, consider an event that depends on multiple factors, and new evidence reveals that the factors are more complex than we thought.

     - Given time constraints, maybe we stick to the urn for the initial set up and then use a different example for updating? Or we can note that updating imprecise probabilities can be non-monotonic in the sense of the interval width, and refer to a hypothetical.

     - Since the journalist wants the audience to reach the conclusion that evidence can widen the range, we can pose a puzzle and let them think.

     - Example: You are a doctor. You have a test for a rare disease. The test is 99% accurate. A patient tests positive. What is the chance they have the disease? Without knowing the prevalence, you can't say. But suppose we tell you the prevalence is between 1 in 1000 and 1 in 10. Then the chance could be between about 9% and 91%. Now, suppose we get a second test, and it's positive too. How does that change the range? If the tests are independent, then the updated range? For a fixed prevalence, we can compute. But the prevalence is still in [0.001,0.1]. The updated PPV will be higher for each prevalence, but the range of PPVs might be even wider? Let's compute:

          For prevalence p, PPV after one positive test: P(D|+)= [p * 0.99] / [p*0.99 + (1-p)*0.01]

          After two positives: P(D|++) = [p * 0.99^2] / [p * 0.99^2 + (1-p)*0.01^2]

          Let f(p) = P(D|+), g(p)=P(D|++).

          For p=0.001: f(0.001)=0.09016, g(0.001)=0.9990
          For p=0.1: f(0.1)=0.9167, g(0.1)=0.9999

          So the range after one test: ~9% to 92%, after two: ~99.9% to 100%. So it narrows.

     - This doesn't widen.

     - How about if the second test is from a different brand that we know less about? It might have sensitivity and specificity in [0.8,0.99]. Then after two tests, we have to consider all combinations. The range might become wider.

     - Example: First test: 99% accurate. Second test: accuracy between 80% and 99%. We get two positives. Then the PPV could be:

          For the second test, worst case: accuracy 80%. Then for p=0.001:
            P(D|++, using second test with 80% accuracy) = [0.001 * 0.99 * 0.8] / [ ... ] 
            We have to compute.

          Alternatively, the overall range for the updated probability might be wider because we have more uncertainty about the second test.

     - This becomes messy.

     - Given the complexity, and the time, perhaps we use the urn for the initial setup and then for updating we use a different example: a hypothetical about an unfolding event.

     - Example: Consider a breaking news situation. Initially, we have limited information: an event has occurred and we are trying to assign a probability that it was a terrorist attack (vs. accident). Initially, we might have a range [0.2, 0.8] because we don't know. Then we get a piece of evidence: a group claims responsibility. That might push the probability up? But then we learn the group is not known and the claim might be false. So now our set might become [0.3, 0.9]? (It's not clear that it widens.) Or if the evidence is conflicting: we get both a factor that increases and one that decreases, then the range might widen? For instance, we learn that the event occurred in a sensitive location (increases) but also that there was a technical failure (decreases). Then our set might expand.

     - This is narrative and not quantitative.

     - Maybe we accept that the urn example is standard and try to reframe it to avoid the "ignorance" interpretation. Emphasize:

          "In the case of Urn B, it's not that I don't know the proportion. It's that my own belief about drawing a red ball doesn't settle on one number. I'm not willing to commit to a single betting odds. And that's because the situation is ambiguous. This ambiguity is a feature of my belief state, not just of the world."

     - Then for updating, we can say: "Now, what happens when we get new information? Sometimes it reduces ambiguity, sometimes it increases. For example, if we draw 10 balls from Urn B and they are all red, then we might narrow our set to [0.5, 1]? But what if we get 5 red and 5 black? That might be consistent with a wide range of proportions. But we started with [0,1]? Actually, we might have started with a set that was not [0,1] but something else? Alternatively, we can design an urn updating that widens: suppose we start with two possible urns: one with 40% red and one with 60% red. So our set for the next ball is {0.4,0.6}. Now we draw one ball: red. How do we update? If we update each model, then in the 40% urn, the probability of red was 0.4, so the posterior weight for that urn decreases. But we are not weighting; we are just conditioning each. So the set for the next ball is still {0.4,0.6}? That doesn't change. To get change, we need to update the weights? But that would be a second-order probability.

     - This is tricky. So maybe we avoid a numerical example for updating and go with a narrative one, and then state the result: "Under some rules for updating sets of probabilities, it is possible for new evidence to increase the size of the set, meaning we become less certain."

     - Given the time, we might have to leave updating as an advanced topic and just state it.

  IV. Addressing Misconceptions (20 min)

     List with one-liners:

     1. "A range just means we don't know."
          - Response: "No, it means that even for a fixed state of knowledge, the belief might be indeterminate. We are not ignorant of a fact; we are unable to form a sharp belief."

     2. "Anything a range can do, a prior over priors can do."
          - Response: "But a prior over priors is a single precise probability over a larger space. It forces you to have a definite opinion about the probabilities, which you might not have. The set representation can be more honest about the lack of commitment."

     3. "Imprecision is a licence for wishful thinking."
          - Response: "No, because decisions must be made in a way that accounts for the entire set. You can't just pick the favorable probability; you have to consider the worst case or use a decision rule that respects ambiguity aversion."

     4. "The bounds are probabilities of something in the world."
          - Response: "No, they are bounds on the probability assignments that are consistent with my beliefs. They are not probabilities of events."

     5. "Imprecision is a temporary defect that more evidence will always cure."
          - Response: "Not necessarily. Sometimes evidence increases ambiguity (e.g., conflicting reports). And in some situations, the nature of the question might be such that no amount of evidence will yield a precise probability."

     6. "This is about groups disagreeing."
          - Response: "No, it's about one person's state of mind. A single individual might have a set of probabilities that are all consistent with their evidence."

     The serious objection: "A set of credences is just a committee of precise agents, and we haven't solved the problem of how to decide."

          - When to raise: After the misconceptions, as a summary challenge.
          - Response: "Exactly. So we need decision rules that handle sets. But note: the set representation helps us see the ambiguity and then we can choose rules that are appropriate for the context (e.g., avoid worst-case outcomes). However, there is no single right rule. That's a challenge, but also a strength because it forces us to confront the ambiguity rather than hiding it behind a single number."

          - We don't need to explain all decision rules. Just mention two:
              - Maximin: choose the action with the best worst-case outcome.
              - Maximality: choose an action that is not dominated by any other (i.e., there is no other action that is better under every probability in the set).

          - We can say: "These rules are used in robust control and decision theory. The key is that the set representation makes the ambiguity explicit, which is the first step to handling it."

  V. Conclusion (10 min)
     - Recap: We started with the Dutch book argument for precise probabilities, then saw that in ambiguous situations, we need sets. We addressed misconceptions.
     - The big takeaway: Publishing a single number can hide ambiguity. When we have ambiguity, we should communicate a range, but also we need to explain what the range means (it's not the same as a confidence interval, which is about sampling variability).

     - The single question to check understanding: 
          "Suppose you are asked: 'What is the probability that this new policy will reduce carbon emissions by 10%?' and you don't have enough information to pin down one number. How would you explain to your readers why you are giving a range and what that range represents?"

     - What to leave out: 
          - The mathematical details of updating sets (generalized Bayesian updating).
          - The full decision theory.
          - The philosophical debates about the interpretation of probability.

     - Settled vs contested:
          - The Dutch book argument for precise probabilities is a standard foundation but has been challenged (e.g., by those who argue that avoiding sure loss doesn't require precision).
          - The use of sets to represent imprecise probabilities is one approach (along with others like Dempster-Shafer, possibility theory). It's not the only one, but it's well-established.
          - The idea that evidence can sometimes widen the set is accepted, but the rules for updating are not as settled as in the precise case.

  Revised Structure:

  1. (5 min) Introduction: The problem with single numbers for uncertainty.

  2. (15 min) The Dutch book argument for precise probabilities. 
     - Use a coin flip example to show how having odds that don't line up with a probability can lead to a sure loss.

  3. (25 min) The Ellsberg urn and the need for sets.
     - Set up the two urns. Ask the audience which urn they prefer (expect ambiguity aversion).
     - Explain that this behavior cannot be captured by a single probability. We need a set.
     - Emphasize: the set represents the agent's indeterminate belief, not ignorance about the world.

  4. (20 min) Misconceptions and the committee objection.
     - Go through the list, one by one, with brief responses.
     - End with the committee objection and the need for decision rules (briefly mention maximin and maximality).

  5. (10 min) Conclusion and Q&A.
     - Ask the single question.
     - State what we left out: updating, advanced decision rules, alternative formalisms.

  Timing: 5+15+25+20+10 = 75 minutes.

  But we haven't included an example of evidence widening the range. Given the time and the difficulty, we can mention it in the misconceptions part (point 5) and then in the conclusion note that sometimes evidence can increase ambiguity, and that's when a range is especially important.

  Alternatively, we can add a slide (but no slides) or a quick whiteboard note: "Example: conflicting evidence. Suppose two equally reliable sources: one says high risk (0.7-0.9), the other low risk (0.1-0.3). Then our combined range is 0.1-0.9, which is wider than either. So evidence can widen the range."

  We can do that in 2 minutes during the misconceptions section.

  So:

  In misconception 5: "Imprecision is temporary..."
     - Response: "Not always. Consider: you get two expert reports. Report A says the probability is between 70% and 90%. Report B says it is between 10% and 30%. Now what? Your overall set might be [10%,90%] — wider than either. New evidence has increased the ambiguity."

  This example is simple and shows widening.

  Final plan:

  I. Introduction (5 min)
     - Hook: "We often publish a single number for uncertainty, but sometimes that's not enough. Today, we'll see why and what we can do."

  II. The Case for Precision (15 min)
     - Dutch book with a coin.

  III. When Precision Fails: Ellsberg (20 min)
     - Urn setup and preference for known urn.
     - The set representation: [lower, upper] not necessarily a probability of any event.

  IV. Misconceptions (25 min)
     - List of 6, each with one-liner and the example for widening at point 5.

