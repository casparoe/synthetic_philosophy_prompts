          - Response: "Yes, and we need rules to combine them. We might choose to be cautious (maximin) or to avoid dominated options (maximality). The key is that the set makes the ambiguity visible, so we can choose a rule that fits the stakes."

  V. Conclusion (10 min)
     - The takeaway: Use ranges when there's ambiguity, and explain that the range represents your state of belief, not just ignorance.
     - The question: "How would you explain to readers the use of a range for this policy outcome?"
     - What's left out: Updating rules, other formalisms.

