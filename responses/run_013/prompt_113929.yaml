answer: |-
  ### Session Plan: Why Uncertainty Isn't a Single Number  
  **Duration:** 75 minutes  
  **Format:** Whiteboard-only, no slides, minimal notation. Focus on intuition, argument, and misconceptions.  
  **Audience:** Data journalists with basic stats (one college course), comfortable with regression tables.  

  ---

  ### **Core Structure & Dependencies**  
  Your instinct is correct: Start with the **rationale for precise probabilities** (the Dutch book argument), then **pivot to why it breaks**, leading to imprecise probabilities (sets of credences). The pivot is the heart of the session.  

  1. **Dependency Structure:**  
     - **Precise probabilities must be established first** (Dutch book argument). Without this, the audience won’t grasp why abandoning precision is a big deal.  
     - **Pivot point:** After establishing the Dutch book, introduce the urn example to show where precision fails.  
     - **Only then** can you introduce sets of credences, misconceptions, and updating.  
     - **Formalism order:** First, make the intuitive case (e.g., urn example), *then* put the formalism on the board. If notation precedes intuition, it feels abstract.  

  ---

  ### **Session Flow**  
  #### **1. Introduction: The Problem (5 min)**  
  - **Goal:** Hook them with real-world relevance.  
  - **Whiteboard:** Draw a single number: "60% chance of rain."  
  - **Script:**  
    > "We publish single numbers for uncertainty—like ‘60% chance’ or ‘±3% margin of error.’ But reality is messier. What do we lose by pretending uncertainty is always a single number? Today, we’ll see why this oversimplifies and when we need a *range*."  

  #### **2. The Case for Precise Probabilities: Dutch Book Argument (15 min)**  
  - **Goal:** Convince them a rational agent *must* have precise credences—or risk exploitation.  
  - **Whiteboard:**  
    - A bet on a coin flip: Heads pays $1 if win, costs $1 to play.  
    - Write: *Your probability for heads = p. You accept bet if odds ≥ p.*  
  - **Script:**  
    > "Suppose you’ll bet on heads at 1:1 odds (p=0.5) but also on tails at 1:1 odds. I can offer both bets: you pay $1 for heads and $1 for tails. If heads, you win $1 but lose $1 on tails—net $0. Same for tails. But you paid $2 upfront, so you lose $2 either way. If your odds don’t match a single probability, you’re vulnerable to a ‘Dutch book’—a sure loss."  
  - **Why now?** This argument must land firmly. Ask: "Does this make sense? Any objections?" (Get nods).  

  #### **3. Pivot: When Precision Fails (25 min)**  
  - **Pivot Point:** After the Dutch book, show a scenario where precision is *impossible* without irrationality. **Urn example is ideal**—but reframe it to avoid the "mere ignorance" trap.  
  - **Whiteboard:**  
    - Urn A: 50 red, 50 black balls (known).  
    - Urn B: 100 balls, red/black in unknown proportion.  
    - *No other numbers*.  
  - **Script:**  
    > "Which urn would you bet on for red? Most prefer Urn A. Why? Urn B feels ambiguous. But Dutch book says you *must* have a precise probability for Urn B’s red ball. What’s yours?"  
    - Poll the room: Few will commit. Press them: "If you say p=0.4, would you bet at 1:1.5 odds? No? Then what *is* your probability?"  
    - **Key Insight:**  
      > "Your reluctance isn’t ignorance of the urn’s composition—it’s that *your belief itself* has no single number. You’re not unsure about the world; you’re unsure about your own judgment. This isn’t ‘I don’t know the true probability’; it’s ‘my credence has no precise value’."  
  - **Formalism (after intuition):**  
    - Draw a number line: "Your credence for Urn B isn’t a point like 0.5. It’s a *set*: say, all probabilities between 0.4 and 0.6."  
    - Write: *Set = {all probabilities satisfying my constraints}*.  
    - Emphasize: "The bounds (0.4, 0.6) aren’t probabilities of events—they’re bounds on what probabilities align with my belief."  
  - **Why urn works:** It’s visceral. To avoid pre-loaded baggage, **reframe it as "Ambiguity, not ignorance"**:  
    > "This urn isn’t about hidden facts—it’s about *you*. If I told you Urn B’s composition, would you still be unsure? In real stories (e.g., predicting a policy outcome), ambiguity feels like this: no ‘true’ probability exists to uncover."  

  #### **4. Updating with Evidence: Widening the Range (10 min)**  
  - **Goal:** Show evidence can *increase* uncertainty. **Use a policy example** (avoids urn’s limitations).  
  - **Script:**  
    > "Say we’re assessing a new policy’s success. Initially, experts agree: credence in success is 0.6–0.8. Now, we get evidence: a pilot study shows success in one city but failure in a similar city. What happens?"  
    - Brainstorm: "Does this narrow your range?"  
    - **Reveal:** "It might *widen*. Before, we had consensus. Now, we have conflict: one model says the failure city is an outlier (credence 0.7), another says it’s fatal (credence 0.4). Your set expands to 0.4–0.8."  
    - **Whiteboard:** Draw initial range [0.6, 0.8] → new range [0.4, 0.8].  
    > "Evidence doesn’t always clarify. Sometimes it reveals complexity, making our beliefs *less* precise."  

  #### **5. Tackling Misconceptions (15 min)**  
  Address these **during/after the urn and policy examples**. Preempt them where they naturally arise.  

  | Misconception | When to Address | One-Line Response |
  |---------------|----------------|-------------------|
  | "A range just means ‘we don’t know’." | During urn example (after formalism). | "No—it means your belief *itself* is indeterminate, not that you lack facts." |
  | "A prior over priors does the same thing." | After introducing sets. | "A prior over priors forces precision about uncertainty—sets avoid that commitment." |
  | "Imprecision = wishful thinking (cherry-picking)." | During policy example (updating). | "Sets require consistent decisions—e.g., you can’t ignore probabilities that contradict your desired outcome." |
  | "Bounds are probabilities of real-world events." | After formalism (number line). | "Bounds aren’t event probabilities—they’re limits on which probabilities fit your belief." |
  | "More evidence always narrows the range." | During evidence update. | "Evidence can expose conflict, widening the range—like the policy example." |
  | "This is about group disagreement." | Conclusion/Q&A. | "No—it’s about one person’s state of mind (e.g., you alone feel ambiguous about Urn B)." |

  - **The Serious Objection ("It’s just a committee"):**  
    - **When:** End of misconceptions, before conclusion.  
    - **Script:**  
      > "Some say a set is just a committee of precise agents. If so, haven’t we just pushed the problem to choosing a decision rule? And isn’t that arbitrary?"  
    - **Response:**  
      > "Yes—that’s the hardest critique. But sets force us to confront ambiguity explicitly. We might choose rules like:  
        - ‘Maximin’: Act on the worst-case scenario (safe but conservative).  
        - ‘E-admissibility’: Act only if some probability in the set supports it (avoids reckless choices).  
      These aren’t perfect, but they’re better than hiding ambiguity behind a single number."  
    - **Depth:** Explain only *maximin* (1 min). Say: "Other rules exist, but we skip them—key is that sets make ambiguity visible."  

  #### **6. Conclusion & Assessment (5 min)**  
  - **Recap:**  
    > "Precise probabilities protect you from Dutch books—but in ambiguous real-world scenarios (urns, policies), beliefs aren’t always sharp. Sets model this honestly. Evidence can widen ranges. And this isn’t ignorance—it’s about the nature of belief."  
  - **The Question to Check Understanding:**  
    > "Suppose you’re reporting on a new economic policy. Your editor says, ‘Give me one probability it will work.’ You have conflicting expert models. How do you explain why you *can’t* give one number—and what you’d publish instead?"  
    - *Listen for:* "Belief isn’t sharp," "range reflects ambiguity, not ignorance," "prevents false precision."  
  - **What You’re Leaving Out:**  
    > "We skipped updating rules (e.g., generalized Bayes) and alternative models (Dempster-Shafer). We also didn’t resolve how to *choose* decision rules—that’s contested."  

  ---

  ### **Settled vs. Contested**  
  - **Settled:**  
    - Dutch books justify precise probabilities (if rationality = avoid sure loss).  
    - Ellsberg-style ambiguity aversion is robust (people *do* prefer known urns).  
    - Sets can model unsharp beliefs (consensus in imprecise prob. community).  
  - **Contested:**  
    - **Whether rational agents *must* have precise credences.** (Your Dutch book start assumes "yes," but some—e.g., Walley—argue avoiding Dutch books only requires *coherent sets*, not precision. *Acknowledge this if pressed:* "Some researchers say rationality allows imprecision from the start.")  
    - **Updating rules:** Generalized Bayes is standard but debated (e.g., should evidence widen sets?).  
    - **Decision rules:** No consensus on "best" rule (maximin vs. E-admissibility vs. others).  

  ---

  ### **Why This Works**  
  - **Urn Example:** Kept because it’s visceral. To avoid "ignorance" misinterpretation, explicitly contrast:  
    > "Urn B isn’t about ‘I don’t know the proportion’—it’s about ‘I can’t settle on a belief.’"  
  - **Policy Example for Updating:** Handles widening and feels journalistic.  
  - **Pacing:** Dutch book (15) → Urn pivot (25) → Evidence (10) → Misconceptions (15) → Wrap-up (10).  
  - **No Math:** Formalism follows intuition; decision rules sketched but not derived.  

  **Final Tip:** Start with a show of hands: "Who’s seen the two-urn problem?" If many have, say: "Forget what you’ve heard—today we’ll see it as a story about *your mind*, not an urn." This disarms familiarity.
