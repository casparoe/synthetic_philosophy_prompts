answer: |-
  As a supervaluationist-leaning contextualist who's wrestled with higher-order vagueness (and written on why supervaluationism *can* accommodate it with a dynamic semantics), here's my decomposition of credence in **NO-FACT** (indeterminacy as metaphysical lack of fact, not epistemic uncertainty). Live options include epistemicism (bivalence holds, we're ignorant), supervaluationism (truth-value gaps, no fact), degree theories (continuum of truth), and contextualism (shifting standards dissolve borderlines). The real action is whether semantic indeterminacy *requires* ontological commitment or if contextual factors preempt indeterminacy altogether.

  Here's the credence decomposition for NO-FACT (all probabilities independent for simplicity):

  1.  **Bivalence actually fails for vague predicates:** **75%**  
      *Justification:* Epistemicism (defending bivalence) is technically coherent but clashes violently with linguistic intuition; most non-classical accounts reject it for borderlines.  
  2.  **Indeterminacy is semantic (not ontic):** **85%**  
      *Justification:* Ontic vagueness (e.g., vague objects/events) is metaphysically suspect; linguistic/conceptual indeterminacy is vastly more defensible.  
  3.  **Higher-order vagueness is coherent:** **70%**  
      *Justification:* While it destabilizes static supervaluationism, dynamic or pragmatic approaches (e.g., defining "borderline" via disagreement or context-shifts) resolve this; it reinforces NO-FACT by generalizing indeterminacy.  
  4.  **Intuitive judgments are reliable evidence:** **60%**  
      *Justification:* Order/phrasing effects show noise, but stable cross-contextual *indeterminacy* judgments exist; they're our primary data for semantic theory.  
  5.  **Degrees-of-truth are intelligible (not relabeling):** **40%**  
      *Justification:* Fuzzy logic faces "collapse" problems (conjunction/disjunction tensions) and struggles with higher-order vagueness; often just precisifies the sorites.  
  6.  **Context-sensitivity alone explains vagueness (refuting NO-FACT):** **35%**  
      *Justification:* Raffman/Shapiro-style contextualism is powerful—sorites shifts standards subtly, making borderlines context-relative *decided* facts, not indeterminate. **This deserves its own term** as it directly negates NO-FACT by eliminating indeterminacy.

  **Combined credence in NO-FACT:**  
  NO-FACT requires (1) Bivalence fails *and* (2) Indeterminacy is semantic *and* (3) Higher-order vagueness holds *and* (4) Judgments support indeterminacy *and* (5) Degrees-of-truth *don't* work (or are irrelevant) *and* (6) Contextualism is *false*.  
  Assuming independence:  
  `0.75 (bivalence fails) × 0.85 (semantic) × 0.70 (HOV coherent) × 0.60 (judgments reliable) × (1 - 0.40) (fuzzy fails) × (1 - 0.35) (contextualism false)`  
  `= 0.75 × 0.85 × 0.70 × 0.60 × 0.60 × 0.65 ≈ 0.075` → **~7.5%**

  **Final credence in NO-FACT: ~7.5%**  

  **Most sensitive term: Context-sensitivity (35% probability)**.  
  - **Why:** If contextualism (Raffman/Shapiro) is correct, NO-FACT collapses entirely—borderlines *do* have context-relative facts. Contextualism directly attacks the need for indeterminacy.  
  - **Evidence that would move it:** A computational model of context-shifts in sorites sequences that *fully* predicts judgment instability without positing indeterminacy would push my credence in contextualism >50%, cratering NO-FACT to <2%. Conversely, evidence that speakers *reject* context-shifting resolutions in controlled settings (e.g., insisting "no fact" even after context stabilization) would lower it.  

  **Why so low?** Contextualism leverages the psycholinguistic data better than gap-theories. NO-FACT requires stacking too many contested premises, while contextualism offers a leaner explanation. My supervaluationist sympathies are tempered by its engineering complexity versus contextualism’s empirical traction.
