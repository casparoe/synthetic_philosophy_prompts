  The organizational angle they're drawn to is actually promising! It's less explored than the AI debates and offers concrete entry points for amateurs. I'll elevate that thread. Whereas consciousness/machine debates should be demoted - they're philosophically tangled and require resolving the hard problem of consciousness first.

