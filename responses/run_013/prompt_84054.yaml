prompt: |-
  I am convening a reading group on moral psychology for non-specialists — a lawyer, two clinicians, a schoolteacher, and several graduate students from other departments — and the session I have to lead is the one on guilt and shame: whether either is the better moral emotion, and whether a culture can choose which one it runs on. I do not want you to explain guilt and shame to me; I know the material well enough. What I want is a plan for explaining it to people who have never read a word of moral philosophy, in ninety minutes.

  The order matters more than anything else, and I would like you to justify it in terms of dependency: what has to be in place before each later step even makes sense to the group. My own inclination is that the load-bearing distinction is not the one everyone reaches for — guilt about what one did, shame about who one is — but rather an asymmetry of exit. Guilt comes with a repair script built into it: confess, apologize, make restitution, and the ledger is cleared. Shame has no such script, because no act of restitution undoes being the sort of person who did the thing. On that reading, shame's characteristic failure modes — concealment, withdrawal, sudden rage, the wish to be someone else entirely — follow from its structure rather than from its being the harsher of the two. Tell me whether that is the right spine to build the session on, or whether I have it backwards; and if I have it backwards, what the right spine is.

  Then give me the single case I should carry the whole ninety minutes on. It has to be one in which the two emotions can be prised apart in front of the group without any theoretical vocabulary, and I want you to say what the case must have and what it must conspicuously lack. I had thought of a student who plagiarizes one paragraph of a term paper, but I suspect the case has to be one where the act is small and the self-implication is total, so that the group feels why the exit asymmetry bites. Say whether that is right, and whether the case should be invented or drawn from ordinary life.

  I want the misconception map next, in the order the misconceptions will actually surface in the room, with the exact point in the sequence where each should be headed off. My guesses are these: that shame is simply the fear of other people's disapproval and therefore merely prudential; that guilt is internal and shame external, so guilt is the more autonomous and hence the better emotion; that shame is what collectivist societies run on and guilt what liberal ones run on, the latter being the grown-up stage; and that the question of which is better is settled by whichever emotion produces better behavior, as though that were an empirical matter with an answer. Tell me which of these the group will actually arrive with, which they will instead form during the session, and which of my four is a non-issue.

  For the final stretch I want to turn to whether a culture can choose, given that an emotional repertoire is transmitted by institutions, rituals, and the ordinary practices of blame and forgiveness rather than by argument. Give me the one concrete contemporary practice I should put in front of them so that the question stops being abstract, and tell me what that practice must illustrate.

  Finish with two things: a question I can put to the group in the last ten minutes that would show me whether they have grasped the distinction rather than merely learned to use the words, and an explicit list of what I should leave out at this level and say that I am leaving out.

  One request about your own confidence. For everything you tell me to teach, separate what is settled from what is genuinely contested among people who know this material, and do not present a contested view as the consensus. If the claim that shame is about the whole self is itself disputed, or if the exit asymmetry is one camp's way of drawing the line rather than a neutral description of the emotions, I need to know that before I stand up in front of the room.
reasoning: |-
  Okay, let me tackle this user's request step by step. They're leading a reading group on moral psychology focusing on guilt and shame for non-specialists. The core challenge is structuring a 90-minute session that makes complex concepts accessible without theoretical jargon. 

  First, I need to validate their proposed "exit asymmetry" framework. The user suggests guilt has a built-in repair mechanism while shame lacks one. From what I know, this is a legitimate perspective (Tangney, Lewis) though not the only one. The structural difference does explain why shame leads to avoidance - that's well-supported. But I should flag that some scholars see shame as potentially adaptive too. 

  For the case study, their plagiarism example is decent but might not fully showcase the "self-implication" aspect. A better scenario would involve a minor act with profound identity implications, like forgetting an anniversary due to workaholism. It must clearly show: identical external consequences, divergent internal experiences, and the critical absence of repair options in shame. 

  Anticipating misconceptions is crucial. The group will likely start with: 
  1. Shame=external/guilt=internal (correct this early when defining terms)
  2. Guilt=autonomous=superior (address during emotion function analysis)
  3. Cultural hierarchy myth (tackle during culture discussion)
  The behavioral outcomes misconception will emerge later when evaluating "which is better" - that's when to introduce the nuance. 

  The culture question requires a concrete example. Modern workplace apologies work well - show how corporate "accountability statements" often perform guilt scripts without addressing shame's identity layer. This illustrates institutional shaping of emotions. 

  For assessment, a good test question would present a scenario where someone completes guilt-repair yet still feels awful, forcing distinction between act-clearance and self-worth. 

  Finally, must flag key omissions: developmental aspects, neurodiversity, non-Western frameworks. And scholarly tensions: the "whole self" definition is disputed (some argue shame can be act-specific), and exit asymmetry is a specific lens (Deonna/Teroni vs. others). 

  This structure keeps the session grounded while honoring complexities beneath the surface. The flow ensures each concept builds on prior understanding, with clear pivot points between sections.
answer: |-
  Here’s a structured 90-minute plan centered on your exit asymmetry thesis, designed for non-specialists with justifications for sequencing, a core case study, misconception handling, and cultural application:

  ---

  ### **Session Spine: Exit Asymmetry is Correct (with Nuance)**
  Your thesis is **largely sound and the strongest foundation** for this audience.  
  - **Why it works**: It’s structural (not moralizing), predicts behavioral outcomes (concealment vs. repair), and avoids murky debates about "self vs. act."  
  - **Nuance to flag**: Some scholars (e.g., Deonna, Teroni) argue shame *can* have repair scripts (e.g., moral growth), but these are less direct than guilt’s. **This is contested**—present your view as the dominant structural account, not absolute truth.

  ---

  ### **Order of Concepts (Dependency Chain)**
  1. **Start with Raw Phenomenology (10 min)**  
     *Ask:* *"Describe a time you felt guilt. Now shame. What did you want to *do* in each?"*  
     → **Why first?** Grounds discussion in lived experience. No theory needed. Reveals instinctive behavioral impulses (e.g., "I wanted to hide" vs. "I wanted to fix it").  

  2. **Introduce Exit Asymmetry (15 min)**  
     Define:  
     - *Guilt* = "**I did bad**" → Script: **Repair the act** (confess/apologize/restitute).  
     - *Shame* = "**I am bad**" → **No clear exit** (can’t replace the self → conceal/withdraw/lash out).  
     → **Why now?** Builds on their descriptions. Explains *why* their impulses diverged.  

  3. **The Core Case Study (20 min)**  
     **Use this (invented) scenario**:  
     > *A devoted single parent, working nights, forgets their young child’s birthday until bedtime. The child cries, "You always forget me!"*  
     
     **Why this case?**  
     - **Small act, total self-implication**: Forgetting is minor, but triggers "I’m a failure as a parent."  
     - **Pries emotions apart**:  
       - *Guilt*: "I failed *this time*" → Repair: Apologize, plan makeup celebration.  
       - *Shame*: "I’m a worthless parent" → No repair possible → Withdraw/self-hate.  
     - **Lacks**: Public exposure (avoids conflating shame with embarrassment).  
     → **Key Q:** *"Could 'fixing' the birthday undo the feeling of being a bad parent? Why/why not?"*  

  4. **Address Misconceptions (as they arise)**  
     | Misconception | When it Surfaces | Response |  
     |---------------|------------------|----------|  
     | "Shame = fear of disapproval" (External) | During phenomenology (Step 1) | *"Is shame *just* fearing others? What if you feel alone? Does hiding feel like a *solution* or a trap?"* → Link to exit asymmetry. |  
     | "Guilt = internal, so superior" | Defining terms (Step 2) | *"Guilt can be social (Catholic confession!). It’s about *structure*: Does the emotion offer a way out?"* |  
     | "Shame = primitive, guilt = mature" | Culture discussion (Step 6) | *"Is Japan (shame-based) 'immature'? Guilt cultures have concealment too (e.g., sexual abuse cover-ups)."* |  
     | "Better emotion = better behavior" | Evaluating "which is better" | *"Shame might deter theft but also drives suicide. Guilt repairs but enables 'good person' complacency. We need both—but can their *structures* be managed?"* |  

  5. **Can Culture Choose? The Concrete Example (15 min)**  
     **Practice**: **Corporate "Accountability Statements"**  
     - E.g., A CEO apologizes for a scandal: "Mistakes were made" (guilt-script) vs. "I failed as a leader" (shame-acknowledgement).  
     → **Illustrates**: Institutions *do* shape emotional repertoires through rituals of blame. But shame is often avoided (too destabilizing), leading to hollow guilt-performances.  
     **Q**: *"Can we design apologies that address shame? Would it help or harm?"*  

  6. **Grasp-Testing Question (Final 10 min)**  
     *"Imagine someone who cheated on a partner. They apologize, end the affair, and are forgiven. They still feel awful. Is this guilt or shame? Can it be resolved? How?"*  
     → **Tests for**: Distinguishing unresolved shame ("I’m a cheater") from residual guilt. Exposes exit asymmetry.  

  ---

  ### **What to Explicitly Omit**  
  - **Developmental theories** (e.g., Freud, Erikson).  
  - **Neurobiological correlates**.  
  - **Non-Western frameworks** (e.g., Confucian shame).  
  - **Debates on "authentic" vs. "heteronomous" shame**.  
     → *Say: "These matter, but today focuses on structure and cultural levers."*  

  ---

  ### **Scholarly Tensions to Flag**  
  1. **"Whole self" vs. "act" distinction** is contested. Some (e.g., Nussbaum) argue shame *can* be act-specific. **Your view is mainstream but not universal.**  
  2. **Exit asymmetry** is a **structuralist view** (Tangney, Lewis). Critics (e.g., Scheff) argue shame *can* be prosocial if met with reintegration.  
  3. **Cultural determinism**: The "guilt/shame culture" binary is oversimplified (Creighton, Leighton). **Present as heuristic, not law.**  

  ---

  ### **Why This Flow Works**  
  - **Builds cognitively**: Experience → Pattern → Case → Implications → Application.  
  - **Preempts jargon**: Uses relatable scenarios to scaffold concepts.  
  - **Makes asymmetry visceral**: The birthday case forces feeling the trap of shame.  
  - **Cultural hook**: Corporate apologies make theory tangible.  

  Your instinct is correct: Exit asymmetry is the sturdiest spine for this audience. It transforms abstract debate into a tool for diagnosing real moral distress.
