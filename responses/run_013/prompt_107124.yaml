  ### Beccaria on Torture: Unpacked (British English)

  **1. What the Passage Says (c. 150 words):**
  Beccaria argues that judicial torture is fundamentally flawed. It purports to uncover truth but functions as an irrational ordeal: the physically or mentally weak (potentially innocent) are broken into false confessions, whilst the strong-willed (potentially guilty) endure it and gain acquittal. Thus, it inherently punishes the innocent and absolves the guilty. He then adds a scathing moral critique: subjecting an accused person – still legally presumed innocent during trial – to torture *as part of the judicial process* is a punishment in itself. This act, Beccaria claims, was "invented by cowards." His point is that authorities resort to this pre-emptive, brutal interrogation under the guise of procedure because they lack the moral fortitude and legitimate authority to impose a direct, certain punishment *after* a proper conviction.

  **2. The Missing Step (c. 200 words):**
  The step you're missing connects the *unreliability* of torture to the *cowardice* accusation via the concepts of **authority, legitimacy, and responsibility**. Beccaria's initial point establishes torture's uselessness for truth-finding. He then shifts focus to its *use* regardless: inflicting severe pain on someone not yet convicted. Why would supposedly rational authorities use a demonstrably unreliable method that also constitutes severe suffering? Beccaria argues it's because they are evading the proper exercise of sovereign power. Legitimate punishment requires a public, formal declaration of guilt following fair procedures. Resorting to torture *before* conviction is a way for authorities to *appear* decisively tough and extractive ("searching for truth"), whilst actually dodging the difficult responsibility of imposing a just, transparent sentence based on actual evidence. It's a shortcut that substitutes brutality for the courage required to build a fair system, judge correctly, and then openly administer punishment. The cowardice lies in hiding the infliction of horrendous pain within the investigative process, avoiding the accountability that comes with formal sentencing.

  **3. Why Cowards? (c. 150 words):**
  Beccaria labels them "cowards" because they lack the courage required for legitimate governance:
  *   **Courage of Conviction:** They fear the difficult task of securing convictions through proper evidence and procedure.
  *   **Courage of Transparency:** They fear openly declaring guilt and imposing punishment, preferring to mask violence as "investigation."
  *   **Courage of Restraint:** They fear appearing "soft" if they follow due process and *don't* use extreme measures, so they choose brutality to project strength, but in a way that avoids direct responsibility.
  *   **Courage of Principle:** They lack the fortitude to uphold the fundamental legal principle that one is innocent until proven guilty. Torturing the accused undermines this principle violently and pre-emptively. They are "cowards" because they prioritise the *appearance* of control and toughness through hidden cruelty over the *reality* of building a just, reliable, and transparent system.

  **4. Ticking Time Bomb Connection (c. 150 words):**
  Beccaria's critique bears directly, albeit negatively, on the "ticking time bomb" scenario. That modern hypothetical argues torture *might* be justified as a last resort in an imminent catastrophe, prioritising urgent utility over principle. Beccaria fundamentally rejects this reasoning:
  1.  **Unreliability Persists:** He'd argue torture *still* yields unreliable information, even under extreme pressure – the core flaw remains.
  2.  **Slippery Slope:** Legalising *any* exception destroys the absolute prohibition he deemed essential for justice. The "cowardice" he identified – authorities avoiding proper process for a perceived quick fix – is exactly the mentality the ticking bomb scenario exploits.
  3.  **Principle vs. Expediency:** Beccaria prioritises the inviolable principle that torture is an illegitimate, immoral exercise of power that corrupts the state and the law itself. No perceived emergency justifies abandoning this, as doing so embodies the cowardly evasion of principled justice he condemned. He would see the ticking bomb argument as a sophisticated repackaging of the same desire to circumvent due process through fear.

  **5. My Verdict (c. 100 words):**
  You've rightly identified the apparent jump, but Beccaria's logic is cohesive. The "missing step" is his view that resorting to a demonstrably unreliable *and* inherently cruel pre-conviction practice stems from a cowardly avoidance of the difficult, transparent work of legitimate justice. Regarding the ticking bomb, it's not a different beast but the *same* beast in modern guise. Beccaria provides the foundational philosophical rebuttal: torture is both ineffective *and* a profound moral corruption of state power, born of weakness disguised as strength. Any scenario justifying it fails his core tests of reliability, legitimacy, and the courage to uphold principle.
