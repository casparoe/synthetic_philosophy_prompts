answer: |-
  Here's a map of the conceptual territory surrounding "cranes, not skyhooks" and "greedy reductionism," ordered from trivial to radical interpretations, with assessments and analysis of their typical usage:

  ### I. "Cranes, Not Skyhooks" (Dennett's Metaphor)
  *(Core Idea: Prefer explanations built incrementally from established mechanisms over those invoking unexplained fundamental posits.)*

  1.  **Trivial/Methodological Interpretation:** "Prefer explanations that connect to established scientific knowledge and build incrementally."  
      *   **Status:** Platitude (in science). Virtually all scientists accept this as a basic principle of inquiry.  
      *   **"Ending Discussion" Use:** Rarely used this way; too weak to settle anything substantive.

  2.  **Modest Darwinian Interpretation:** "Biological complexity requires explanation via incremental, variation-and-selection processes operating on prior structures/functions; avoid positing unexplained leaps or intelligent designers (skyhooks)."  
      *   **Status:** Substantive and defensible thesis within evolutionary biology/philosophy. An empirical claim *in principle* testable by examining historical evidence, developmental pathways, and functional intermediates.  
      *   **"Ending Discussion" Use:** **Common.** Used to assert that a proposed alternative explanation (e.g., saltation, divine intervention, inherent teleology) is illegitimate within a naturalistic framework. "It must be built by cranes" becomes a constraint on acceptable hypotheses.

  3.  **Strong Adaptationist Interpretation:** "All significant biological traits (including complex cognition, language, morality) *must* be explained *entirely* by direct, incremental natural selection acting on genetic variation ('cranes'), with no significant role for non-adaptive processes (e.g., genetic drift, spandrels, exaptation, complex systems dynamics)."  
      *   **Status:** **Contestable** substantive thesis. While adaptation is crucial, this downplays other recognized evolutionary forces. Empirical evidence (e.g., neutral theory, spandrels) challenges its universality. Risk of being unfalsifiable if every trait *must* have an adaptive story.  
      *   **"Ending Discussion" Use:** **Very Common & Problematic.** Used to dismiss proposals involving non-adaptive factors or emergent complexity as "smuggling in skyhooks," even when those proposals are naturalistic. Asserts a specific *kind* of crane (pure NS) is the *only* acceptable crane.

  4.  **Radical "No Primitives" Interpretation:** "No fundamental properties or entities (like consciousness, intentionality, or even basic physical laws) can be accepted without a *complete* evolutionary (or physical) explanation tracing them back step-by-step to some ultimate 'brute fact'."  
      *   **Status:** **False/Confused/Impossible.** Explanation must stop somewhere; some things (fundamental laws, initial conditions, perhaps consciousness itself *if* fundamental) are necessarily primitive within a given explanatory framework. Demanding infinite regress of cranes is incoherent.  
      *   **"Ending Discussion" Use:** Rarely explicitly stated, but can lurk behind dismissals of any posited fundamental property (e.g., "You can't just *assert* basic subjectivity exists! Where's the crane for *that*?").

  **Which Reading Ends Discussions?** Primarily **#2 (Modest Darwinian)** and especially **#3 (Strong Adaptationist)**. #2 legitimately rules out supernaturalism or radical saltation. #3 often illegitimately rules out other naturalistic evolutionary mechanisms or emergentist explanations.

  ### II. "Greedy Reductionism" (Dennett's Term)
  *(Core Idea: A flawed form of reductionism that claims to explain a phenomenon by *simply identifying* its lower-level components/mechanisms, while ignoring or denying the genuine causal/explanatory work done by higher-level patterns, organization, or context.)*

  1.  **Trivial "Oversimplification" Interpretation:** "Don't ignore relevant complexity or context; explanations need sufficient detail."  
      *   **Status:** Platitude. Everyone agrees explanations shouldn't be *incomplete* or *inaccurate*.  
      *   **"Ending Discussion" Use:** Rare.

  2.  **Methodological Interpretation:** "Attempting reduction *too early* or *without sufficient lower-level detail* to actually do the explanatory work promised."  
      *   **Status:** Defensible methodological caution. Highlights that reduction is hard work requiring bridging laws/models, not just pointing downward.  
      *   **"Ending Discussion" Use:** Can be legitimate criticism if a reductionist claim is demonstrably premature or lacks substance ("Love is just dopamine" without showing *how* dopamine configurations explain romantic bonding).

  3.  **Explanatory Autonomy Interpretation:** "Higher-level phenomena (like consciousness, morality, ecosystems) exhibit *causally relevant patterns* or *emergent properties* that are best described and explained at their own level. Greedy reductionism *ignores or denies* this genuine causal/explanatory role, claiming the lower level 'does all the real work'."  
      *   **Status:** **Substantive and Defensible** (though contested by strict reductionists). Aligns with non-reductive physicalism or emergentism. Empirical claims about causal efficacy can be investigated (e.g., downward causation in complex systems). "Greedy" signifies ignoring *this specific level of causality/explanation*.  
      *   **"Ending Discussion" Use:** **Common and Often Legitimate.** Used against claims that merely *naming* a lower-level correlate (e.g., "Morality is kin selection genes") constitutes a sufficient explanation, ignoring the complex cognitive, social, and cultural structures involved.

  4.  **Eliminativist Interpretation:** "Greedy reductionism claims the higher-level phenomenon *does not really exist* (e.g., 'There is no such thing as love, only chemical reactions'; 'Morality is an illusion')."  
      *   **Status:** **Contestable** substantive thesis (strong eliminative materialism). Highly controversial, especially for phenomena like consciousness or meaning. Often conflated with #3. "Greedy" here signifies the *elimination* of the phenomenon itself, not just its causal role.  
      *   **"Ending Discussion" Use:** **Common and Often Problematic.** Used to dismiss *any* reductive explanation as inherently eliminativist ("Calling it 'just chemistry' denies the reality of love!"). This mislabels reductive *explanations* (which aim to explain the phenomenon) as eliminativist (which denies it).

  5.  **"No Cranes" Interpretation:** "Greedy reductionism attempts explanation *without constructing the necessary bridging cranes* – it just asserts identity ('X is nothing but Y') without showing the incremental steps or mechanisms connecting Y to the properties of X."  
      *   **Status:** Defensible interpretation aligning with the "cranes" metaphor. Highlights the lack of mechanistic detail in bad reductions. "Greedy" signifies wanting the explanatory payoff without doing the hard work of building the cranes.  
      *   **"Ending Discussion" Use:** **Common and Legitimate** when the reductionist account truly lacks mechanistic detail. Can be misapplied if mechanistic detail *is* present but the critic dislikes the reduction.

  **Which Reading Ends Discussions?** Primarily **#3 (Explanatory Autonomy)** and **#4 (Eliminativist)**. #3 legitimately criticizes ignoring higher-level causal structure. #4 is often used *inaccurately* to tar any reductionist attempt as denying the phenomenon's existence.

  ### Analysis of Your Specific Queries

  1.  **Mirror Images?** **Yes, functionally complementary.** Both combat explanatory shortcuts:
      *   **"Cranes"** targets *top-down* shortcuts: Explaining complex phenomena by invoking unexplained fundamental powers or entities (skyhooks).
      *   **"Greedy Reductionism"** targets *bottom-up* shortcuts: Explaining complex phenomena by merely pointing to lower-level components without accounting for their organization, context, or emergent causal powers (failing to build the cranes *between* levels). They address different types of bad explanations.

  2.  **The Work of "Greedy":** It signifies:
      *   **Intellectual Impatience/Laziness:** Wanting a simple, quick "nothing but" answer without the hard work of detailed mechanistic explanation or bridging models.
      *   **Explanatory Overreach:** Claiming the lower level *exhausts* or *eliminates* the need for higher-level explanation, not just providing its basis.
      *   **Denial of Legitimate Levels:** Ignoring or dismissing the causal efficacy or descriptive necessity of the phenomenon's own level of organization. It's more than disapproval; it labels a specific *explanatory error*.

  3.  **Consistent Wielding?** **Yes, easily and desirably.** A consistent naturalist/physicalist should:
      *   **Reject Skyhooks:** Demand explanations built from natural mechanisms (cranes).
      *   **Reject Greedy Reductionism:** Demand that reductive explanations *actually build the cranes* – providing detailed mechanistic accounts that respect and explain the causal patterns observed at higher levels, without prematurely declaring those levels "nothing but" or illusory. They champion *good* reductionism (building mechanistic cranes) while rejecting bad (greedy) reductionism and skyhooks.

  4.  **Misframing?** Your framing is excellent. The key nuance captured is that both terms are often used *rhetorically* to end discussion ("That's just a skyhook!" / "That's greedy reductionism!") by invoking their stronger, more contested interpretations (#3 for Cranes, #4 for Greedy Reductionism), bypassing substantive engagement with the actual proposal. The map clarifies the spectrum from acceptable principles to problematic dogma.

  **In Summary:** The defensible core of both ideas is sound scientific methodology: build explanations incrementally from established mechanisms ("cranes"), and ensure reductions provide sufficient mechanistic detail without denying the reality or causal efficacy of higher-level phenomena (avoiding "greedy reductionism"). However, in debate, they are frequently weaponized as **conversation-stoppers** using their **stronger, more contestable interpretations** (Strong Adaptationism for Cranes; conflating reduction with eliminativism for Greedy Reductionism). Recognizing this spectrum allows for more productive discussion by focusing on *why* a specific proposal might fall into one of these problematic categories, rather than just labeling it.
