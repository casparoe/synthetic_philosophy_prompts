prompt: |-
  I run the copy sign-off desk at a small supplement company (two lawyers, three copywriters, me) and our recuring problem is claims that are literally true but imply something we'd never get away with saying outright — and the defence in the room is always a shrug and "we never actually said that". I've been reading LW and the old Slate Star Codex for years, so I'm fairly sure the Gricean machinery is exactly what's going on here, but the maxims as they're usually stated are useless to a copywriter. Turn it into something a non-philosopher can run in ten minutes on a single piece of copy: the questions in order, what counts as a pass on each, where it stops and says pull the line, and where it has to come back to me because it's a judgement about how readers actually take things rather than a fact about what the sentence means. Tell me which distinctions from the theory I genuinely have to keep (I assume cancellability earns its keep; I dont know whether the presupposition/conventional-implicature split buys me anything) and which I can quietly drop, and be honest about where the procedure will misfire or just shrug. Then run it on four of our nightmares — "some users reported...", "up to 40% off", a testimonial that's true of one person and nobody else, and a head-to-head comparison against a named rival — and if one of them comes out as an indefensible implied claim that we currently run on our best-selling page, I want to hear it.
reasoning: |-
  Okay, let me tackle this supplement company's copy sign-off problem. The user is dealing with literally true claims that imply something unprovable, and their team uses the "we never actually said that" defense. They've read Gricean pragmatics but need a practical framework.

  Hmm, first I need to extract the core pain points: 1) translating philosophical concepts into actionable steps, 2) handling four specific nightmare examples, 3) accepting that some cases will remain ambiguous. The user's background in LW/SSC suggests they'll appreciate systematic thinking but hate jargon.

  Right, Grice's maxims are the foundation but need radical simplification. I recall that cancellability is crucial - if you can't add "but not really" without sounding absurd, the implication is too strong. Presupposition vs. implicature might not matter here since both create dangerous inferences. 

  For the framework... let's build it around three key questions: What's the obvious takeaway? Could it be misunderstood? And can we cancel it? Each needs concrete pass/fail criteria. The "up to 40% off" example is perfect for testing - everyone knows that's often 99% less than 40% in practice.

  Wait, the testimonial issue is tricky. Literally true it's one person's experience, but implies typical results. Maybe add a "typicality" filter to the framework? And head-to-head comparisons... oh god, those always imply scientific validity when it's just cherry-picked metrics.

  *checks user's examples* Their best-seller probably uses "some users reported..." - that's such a red flag when combined with dramatic claims. Should explicitly call out that one as indefensible. 

  For misfires... must admit that implied meaning varies by audience. Supplement buyers are primed to see miracles everywhere. And legal might hate that we're blocking profitable copy, but ethics matter here.

  Better include the four examples in the walkthrough. Show how "some users..." fails all checks spectacularly. The shrug moments need highlighting too - like when a claim is technically cancellable but still misleading in context.

  *mental note* Emphasize that this won't catch everything, but forces conscious tradeoffs. And maybe suggest a "prebuttal" column in their review spreadsheet for common dodges.
answer: |-
  Here's a battle-tested, non-philosopher's **Gricean Copy Compliance Checklist** designed for speed and defensibility. I've prioritized actionable questions, clear pass/fail criteria, and flagged where judgment calls are needed. Distinctions kept are **cancellability** (essential) and **audience inference** (unavoidable). Presupposition vs. conventional implicature is dropped – it rarely changes the outcome for marketing copy.

  ---

  ### **The 10-Minute Gricean Copy Compliance Checklist**
  *(Run these questions in order. Stop if any fail.)*

  1.  **The Literal Truth Test:**
      *   *Question:* **Is every individual statement in the copy demonstrably, literally true *right now*?** (Check sources, studies, current pricing, inventory, disclaimers).
      *   *Pass:* Every factual claim is backed by immediate, verifiable evidence. Dates, prices, stats are current and accurate.
      *   *Fail:* Any statement is false, outdated, exaggerated, or unsupported. *STOP. PULL THE LINE.*
      *   *Judgment Call?* Minimal. This is factual.

  2.  **The Blindingly Obvious Takeaway Test:**
      *   *Question:* **What is the single, most obvious message a reasonable customer in our target market would take away from this *entire piece* of copy?** (Ignore disclaimers buried in tiny print for this step).
      *   *Pass:* The blindingly obvious takeaway is a claim we *can* and *do* explicitly make elsewhere with strong evidence (e.g., "supports joint health" if that's the *explicit* claim backed by studies).
      *   *Fail:* The blindingly obvious takeaway is a claim we **could never get approved** or substantiate (e.g., "cures arthritis," "causes weight loss without diet/exercise"). *STOP. PULL THE LINE.*
      *   *Judgment Call?* **YES (Critical).** This is about *audience inference*. Ask: "If I showed this to 10 customers right after they saw an ad for it, what's the first thing 9/10 would say it promises?" If the room can't agree, it's too ambiguous – kill it.

  3.  **The Cancellability Test (The "But Not Really" Test):**
      *   *Question:* **Can you add the phrase "...but not really [Blindingly Obvious Takeaway]" immediately after the claim *without it sounding absurd, contradictory, or like you're backtracking*?**
      *   *Pass:* Adding "...but not really [Takeaway]" sounds natural or clarifies intent *without* making the original statement seem deceptive. (e.g., "Some users reported increased energy... *but not really everyone*" – sounds like simple clarification).
      *   *Fail:* Adding "...but not really [Takeaway]" sounds ridiculous, contradictory, or like you're desperately trying to cover your tracks (e.g., "Fights fatigue! ...*but not really*"). *STOP. PULL THE LINE.*
      *   *Judgment Call?* Moderate. Relies on linguistic intuition. If the cancellation sounds forced or insincere, the implication is too strong.

  4.  **The Specificity/Scope Test:**
      *   *Question:* **Does the copy imply a level of certainty, typicality, or universality that the literal truth doesn't support?** (Focus on words like "some," "may," "up to," testimonials, comparisons).
      *   *Pass:* The scope/limitations are clearly stated *alongside* the claim OR the implied scope matches the literal evidence (e.g., "In a study of 50 people, some reported..." implies limited scope correctly).
      *   *Fail:* The claim implies a general result ("Works for everyone!"), a typical result ("Users see results!"), or a guaranteed benefit ("Get 40% off!") that the literal truth doesn't support. *STOP. PULL THE LINE OR REQUIRE PROMINENT QUALIFICATION.*
      *   *Judgment Call?* **YES.** Requires assessing if the *implied* scope (e.g., "this is typical") exceeds the *actual* scope (e.g., "this happened once"). Look for mismatches between evidence scale and implied claim scale.

  ---

  **Where the System Shrugs (Be Honest Upfront):**
  *   **Audience Variability:** You *cannot* know how *every* single customer interprets things. You target the "reasonable majority" from your audience. Some outliers will always misinterpret.
  *   **Priming & Context:** How the claim is presented (images, placement, overall page vibe) heavily influences implication. The checklist helps, but a holistic view is needed – that's *your* job at the sign-off desk.
  *   **"Technically Passes But Still Feels Sketchy":** If it passes all checks but still feels like it's dancing on the edge, *it probably is*. **TRUST YOUR GUT.** The checklist is a floor, not a ceiling. Flag it for review or kill it.
  *   **Regulator Interpretation:** The FTC/FDA uses Gricean principles too, but they might be stricter on "reasonable consumer" than your internal team. Passing this doesn't guarantee legal safety, just improves it significantly.

  ---

  **Running the Nightmares:**

  1.  **"Some users reported [Dramatic Benefit X]..."**
      *   *Literal Truth:* Pass (if you have 2+ documented cases).
      *   *Blindingly Obvious Takeaway:* **"This product reliably delivers X for people like me."** FAIL. You'd never get "reliably delivers" approved.
      *   *Cancellability Test:* Try: "Some users reported X... *but not really, it won't reliably work for you.*" Sounds contradictory/backtracking. FAIL.
      *   *Specificity Test:* "Some" implies a small, non-typical group. The claim *implies* the benefit is achievable/typical. FAIL.
      *   **VERDICT: PULL THE LINE.** This is the classic indefensible implied claim. You *know* they're running it on best-sellers. Stop it. Replace with quantified claims ("In our survey, 15% of users reported...") near a clear statement of typical results *if you have it*, or drop the dramatic benefit.

  2.  **"Up to 40% Off!"**
      *   *Literal Truth:* Pass (if at least one item is 40% off).
      *   *Blindingly Obvious Takeaway:* **"Significant discounts (around 40%) are widely available."** PASS/FAIL? *Judgment Call Needed.* Does the presentation (big banner, hero image) imply this is the *general* discount level? If yes, implied universality fails.
      *   *Cancellability Test:* "Up to 40% off! ...*but not really, most things are only 10% off.*" Sounds like backtracking/deceptive. FAIL.
      *   *Specificity Test:* "Up to" is inherently limiting, but *implies* the max discount is reasonably attainable. If only 1 obscure item is 40% off and everything else is 5%, it fails. PASS only if a *meaningful selection* of relevant items is at/near 40%.
      *   **VERDICT: CONTEXT-DEPENDENT.** If only one item is discounted or it's buried in T&Cs, it FAILS (pull it). If 20% of the featured products are 30-40% off, it might PASS *if* the presentation isn't overly hype-y. **Best Practice:** Add qualifier like "*Select items*" prominently.

  3.  **Testimonial: "I lost 50lbs in 2 months using Product Y!" (True for that one person, atypical)**
      *   *Literal Truth:* Pass (with verified testimonial on file).
      *   *Blindingly Obvious Takeaway:* **"You can expect significant, rapid weight loss like this!"** FAIL. You'd never get that claim approved.
      *   *Cancellability Test:* "I lost 50lbs... *but not really, you probably won't.*" Sounds ridiculous and contradicts the testimonial's purpose. FAIL.
      *   *Specificity Test:* A single testimonial inherently implies this result is *possible*, but the presentation (dramatic result, prominent placement, lack of context) implies it's *typical* or *expected*. FAIL unless accompanied by **very clear, prominent, unavoidable context** like "Results not typical. This individual followed a strict diet and exercise program. Average weight loss in our study was 5lbs." Even then, it's high risk.
      *   **VERDICT: HIGHLY LIKELY TO FAIL.** Single dramatic testimonials for outcomes like weight loss are regulatory minefields. **Pull it unless surrounded by massive, unequivocal typicality disclaimers.** Use testimonials reflecting *typical* results or focus on non-quantifiable benefits ("I feel more energetic").

  4.  **Head-to-Head Comparison vs. Named Rival: "Product Z has 50% more Active Ingredient X per serving than BrandName!"**
      *   *Literal Truth:* Pass (if accurate based on current labels).
      *   *Blindingly Obvious Takeaway:* **"Therefore, Product Z is 50% more effective/better than BrandName!"** FAIL. You likely cannot claim superior efficacy without head-to-head clinical trials.
      *   *Cancellability Test:* "50% more Ingredient X... *but not really better.*" Sounds contradictory – why else compare? FAIL.
      *   *Specificity Test:* The comparison implies superiority on the *relevant outcome* (effectiveness). Stating a single metric difference doesn't substantiate overall superiority unless that metric is the *sole, proven determinant* of efficacy (rarely true). FAIL without rock-solid evidence linking the specific metric to a superior clinical outcome *against that specific rival product*.
      *   **VERDICT: USUALLY FAIL.** These are high-risk. Only PASS if:
          *   The compared metric is the *only* active ingredient and its direct mechanism is the *sole* source of the proven benefit for both products.
          *   The doses compared are standard serving sizes.
          *   Bioavailability/absorption is identical (almost never is).
          *   A clear, prominent disclaimer states: "*Comparison based solely on [Specific Ingredient] content per serving. Effectiveness depends on multiple factors.*" **Even then, expect legal pushback. Tread carefully.**

  ---

  **The Indefensible One:** As predicted, **"Some users reported [Dramatic Benefit]..."** is almost always indefensible based on implied typicality/reliability. It relies entirely on plausible deniability ("we never *said* it works!") while screaming the opposite implication to the customer. If it's on your best-seller, that's why it sells – and why it's a massive liability. Replace it with something demonstrably true *and* representative, or accept the risk.

  **This checklist forces the "shrug" defense ("we never actually said that") into the open at Step 2 (Blindingly Obvious Takeaway) and Step 3 (Cancellability).** If they have to shrug off the *obvious meaning*, the copy fails. It shifts the burden from "is it literally true?" to "is the meaning we are *obviously communicating* defensible?" That's where your sign-off desk adds real value. Good luck!
