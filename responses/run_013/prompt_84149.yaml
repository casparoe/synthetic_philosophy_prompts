  Hi, I'm doing a module on archaeology and inference and we've been set Sir Thomas Browne's Hydriotaphia (the 1658 one about the urns found in Norfolk). There's a passage near the start where he's describing the urns and says something like, the objects tell us about their burial customs but not their beliefs, and that we shouldn't read too much into them because the same practice can come from different opinions. I think I get the jist but I'm not sure what his actual argument is. Is he saying we can never infer beliefs from material remains? Or just that we should be cautious? And how does that fit with the rest of the book where he seems to speculate quite a lot about what the urns mean? I'm a bit lost. Can you help me understand what he's getting at and why it matters for how archaeologists reason from objects to past minds? Thanks.
