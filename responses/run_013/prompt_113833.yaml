  Okay, let me unpack this neuroethics puzzle systematically. The user presents two seemingly inconsistent practices - whole-brain death determination versus PVS patient treatment, and cephalopod welfare protections versus insect neglect - then asks about implementing a unified sentience criterion in their lab. 

  First, I need to disentangle the hospital paradox. The key insight is that whole-brain death criteria aren't actually about consciousness per se, but about irreversible loss of organismal integration. The apnea test checks if the body can self-regulate as a whole, which explains why PVS patients (with brainstem function) are treated differently from brain-dead patients. This practice reveals an unspoken Aristotelian view of life as embodied self-organization, not just computation.

  For the invertebrate dilemma, I notice the cephalopod decision likely stems from Cambridge Declaration-style recognition of convergent neural complexity. The rejection of insects isn't based on computational insufficiency but on practical epistemology - we can't verify subjective states in systems without vertebrate-like neural architectures. The proposed lab criteria (i-iv) would indeed cover some insects, revealing that current exclusions are more about detectability than ontology.

  The user's PI's proposed policy is fascinating because it shifts from taxonomy to computational markers. But clause (iv) about adaptive function creates a teleological loophole - one could argue any pain-capable AI deserves protection. To prevent this, they'd need to add "biological organism" as a fifth criterion, though this feels arbitrary. 

  What's really revealing is how both practices rely on paradigm cases: whole-brain death uses "irreversible loss of organismal unity" with brain-dead bodies as the paradigm, while invertebrate committees use octopuses as the "strange but sentient" archetype. The diagnostic tools (apnea tests, neural mapping) are tailored to these paradigms rather than abstract theories.

  If we swapped theories, chaos would ensue: adopting pure computationalism might require treating PVS patients as dead, while applying the invertebrate committee's plasticity standards could grant fruit flies protected status. The hospital's practice is more theory-constrained (organismal integration requires brainstem), whereas the lab's taxonomy approach has more wiggle room for political or practical considerations.

  Ultimately, the common thread is detectability of sentience through available proxies. Both practices prioritize observable functions over theorized experiences because institutions demand operationalizable criteria. The user's frustration stems from seeing this pragmatic reality clash with computationalist ideals - a tension inherent to applied neuroethics.
answer: |-
  Your observations cut to the heart of applied neuroethics: the gap between stated principles and operational practices reveals unspoken metaphysical commitments. Let's dissect this without lit review baggage.

  **The Hospital Paradox:**
  - Whole-brain death isn't presupposing that consciousness *requires* brainstem function. It's operationalizing **organismal integration** as the boundary for "life." The apnea test checks for autonomous bodily unity – can the system self-sustain as a biological whole? PVS patients retain hypothalamic regulation, sleep-wake cycles, and integrated bodily functions despite lacking consciousness.
  - What this quietly rules out: Consciousness itself as the necessary criterion. A conscious human with locked-in syndrome has more "morally relevant computation" than a PVS patient but less organismal integration than a brain-dead body on a ventilator. The practice prioritizes **biological spontaneity** over subjective experience.
  - Underdetermination? Yes – but the metaphysical anchor is Aristotelian: life as self-moving *ousia*. Swapping to a consciousness standard would force reclassifying PVS as "dead," collapsing the current legal/ethical distinction.

  **The Invertebrate Inconsistency:**
  - The cephalopod policy isn't about nociception complexity. It presupposes **evolutionary convergence** with vertebrates: centralized brains, complex behaviors (e.g., octopus problem-solving), and behavioral markers *interpretable as affective states* (e.g., avoidance learning beyond reflex arcs). Flies fail the "does it feel like something we recognize?" heuristic.
  - Your PI's proposed criteria (i-iv) would indeed cover Drosophila – but clause (iv) is the trapdoor. "Plausible account of what experience would do" smuggles in **teleological anthropocentrism**: suffering must serve an evolutionary purpose *we deem coherent*. This would rule in:
    - Hypothetical AIs with pain circuits "designed" for learning
    - Genetically engineered nematodes with artificial "suffering modules"
    While ruling out:
    - Non-adaptive pain (e.g., congenital insensitivity to pain disorders)
    - Systems where suffering's evolutionary role is opaque

  **The Attribution Mechanism:**
  - Both practices use **paradigm-case reasoning**, not inference to best explanation. Whole-brain death uses the *irreversibly non-spontaneous body* as the death paradigm; invertebrate committees use the *vertebrate-like mind* as the sentience paradigm. Diagnostics exist to confirm/deny membership in these categories, not to probe underlying computations directly.
  - This explains why PVS patients aren't harvested: they match the "living human organism" paradigm (warm, breathing autonomously). Flies fail the "suffering creature" paradigm (no face, no spine, no pain vocalizations).

  **Where Practices Diverge & Converge Philosophically:**
  - **Divergence:** The hospital practice requires loss of **autonomy-as-self-sustenance**; the lab practice seeks evidence of **autonomy-as-inner-life**. One is cybernetic (feedback loops maintaining homeostasis), the other phenomenological (qualia generation).
  - **Convergence:** Both use **proxy thresholds** for tractability. Apnea tests and cephalopod pain assays are measurable stand-ins for the hard problems of consciousness. Neither truly engages with computational sufficiency.
  - **Forced by theory?** Only weakly. The hospital *could* adopt higher-brain death without logical contradiction (some jurisdictions do). The lab *could* include insects under your PI's criteria. The constraints are:
    - **Institutional risk-aversion** (harvesting from PVS = homicide charges)
    - **Epistemic limitations** (we lack tools to measure insect phenomenology)
    - **Moral heuristics** ("if it screams, protect it")

  **Implementing Your PI's Policy:**
  - Presupposes: Suffering is a **computational state** with functional architecture, irrespective of substrate. This *explicitly* rules out:
    - Vitalist views (requires "life force")
    - Biological chauvinism (requires carbon-based wetware)
  - Risks: Covering **malware** that "suffers" to evade deletion, or **predictive models** simulating pain responses. You'd need to add: *(v) Embodiment in a homeostatic system vulnerable to harm*.
  - Would it cover insects? Absolutely – which reveals current exclusions are **conventional**, not theoretical. But clause (iv) becomes the new battleground: Does a fly's heat avoidance "plausibly" serve an affective purpose? That's where paradigm creep occurs.

  **The Core Insight:** These practices aren't mapping onto a theory of consciousness; they're **negotiating moral responsibility** using socially legible markers. Whole-brain death defines when we *stop* being responsible for a body; cephalopod protections define when we *start* being responsible for non-human entities. The computations matter only insofar as they trigger these duty-assignments.

  To test this: If your lab policy covers sentient AI, and the hospital won't harvest from PVS, the inconsistency isn't in the computations – it's in **which agents we recognize as moral patients** based on perceived likeness to paradigmatic persons. The boundary isn't drawn around consciousness, but around **membership in the community of selves.**
