prompt: |-
  I'm a second-year PhD student and I have to turn in a two-page dissertation prospectus by the end of the month. My committee is mostly epistemologists and decision theorists and they will absolutely tear me apart if the question is vague, so I want to get the framing right before I write a word of it. Here's the half-formed idea I've been kicking around with a friend over too much coffee. There's this thing people call evidential cooperation in large worlds. The setup is roughly: suppose the universe is big, big enough that there are lots of other agents out there, mostly causally out of reach, but some of them are 'like me' -- they run something like my decision procedure, or reason from the same kind of evidence, or came out of a similar selection process. The claim is that when I choose an action I'm not only causally pushing on the world, I'm also generating evidence about what those other agents are going to do. So in a one-shot prisoner's dilemma, if I'm the kind of agent who cooperates, that's evidence that my cousins cooperate too; and if there are enough cousins and the stakes scale up, the evidential payoff from cooperating with everyone like me can swamp the ordinary causal payoff from defecting. The recommendation ends up looking like: pick the policy that would be best if every agent correlated with you followed it too. I think of it as the large-world version of the reasoning in Newcomb-ish cases, or the old superrationality idea.

  My worry, and the thing I want the prospectus to actually be about, is that the whole thing rests on a notion of correlation, or of 'being like me', that I've never seen made precise in a way that doesnt just assume what it's trying to prove. What grounds the correlation -- sharing a decision algorithm, sharing a prior, sharing evidence, being produced by the same process? If it comes down to 'we're both rational', why should my choice be any evidence at all about what some rational agent a billion light years away does? And the framework seems to need some distribution over the other agents' policies, which I suspect can only be got by smuggling in the very cooperation you were trying to justify. Is that a genuine circularity, or is there a way out of it? I want the question stated so it has a determinate answer, and so that a year of work by one person who is definitely not a mathematician could actually settle it.

  So write me the prospectus. I need the precise question; why the obvious positions on it don't settle it and what the live options actually are (describe the positions and the arguments, not the authors -- I'll fill in the citations myself, so please no bibliography); the method, meaning what the real argumentative steps would be and what I'd be doing month by month; what a successful result looks like versus what would count as the project failing; and an honest read on scope, given that I've got a year and I do not want this to turn into a probability theory paper. And if the framing I just gave you is confused, or if the question is really three questions wearing a trenchcoat, say so and hand me a better framing instead of humoring me.
