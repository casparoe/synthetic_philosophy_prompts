answer: |-
  Here’s a focused, committee-ready prospectus draft addressing your core concern. It avoids vagueness, centers the tractable problem, and respects your constraints.

  ---

  **Dissertation Prospectus: Grounding Evidential Correlation in Large-World Cooperation**  

  **1. Core Question**  
  *What objectively grounds the evidential correlation between agents in "large-world" decision problems, such that one agent’s choice provides evidence about the choices of agents "like them," and how can this correlation be specified without presupposing cooperative behavior?*  

  **2. The Problem: Why Existing Framings Fail**  
  Evidential cooperation (e.g., in one-shot prisoner’s dilemmas with "copies") relies on a key premise: if Agent A cooperates, this indicates that *other agents correlated with A* likely cooperate too. But the notion of "correlation" or "like me" is underdefined and risks circularity:  
  - **Similarity Dilemma**: Proposed grounds (shared algorithm, prior, evidence, or evolutionary origin) are arbitrary without justification. Why should algorithmic twins correlate but not functionally identical agents from distinct origins? Why priors over evidence?  
  - **Rationality Trap**: If correlation requires "shared rationality," why expect rational agents in disconnected worlds to *act similarly* absent shared constraints? Defection could be equally "rational."  
  - **Bootstrapping Objection**: To calculate expected utility, I need a prior over others’ actions. But if I assume they’re correlated *with me*, I implicitly assume they condition *their* actions on *mine*—presupposing the cooperative response I aim to justify.  

  Current approaches either:  
  (a) **Stipulate** correlation (e.g., "assume copies share your algorithm"), which is question-begging;  
  (b) **Gesture** at universality (e.g., "all rational agents"), which lacks empirical content in large worlds; or  
  (c) **Hide circularity** by defining "like me" agents as those who *would cooperate if I do*, collapsing into self-fulfilling prophecy.  

  **3. Live Options & Why the Question is Open**  
  The debate hinges on whether a non-circular grounding exists:  
  - **Skeptical View**: Correlation is irreducible or conventional. No objective grounding exists; "large-world cooperation" is a useful fiction for specific contexts (e.g., aligned AI), not a general principle.  
  - **Reductive View**: Correlation can be grounded in *causal-historical facts* (e.g., agents from same source process) or *structural facts* (e.g., same evidence + decision constraints). This must avoid triviality (e.g., "same evidence" is vacuous if evidence includes one’s own choice).  
  - **Formal View**: Correlation emerges from objective indifference principles (e.g., maximum entropy over possible agents) or symmetry constraints. But these risk being *ad hoc* or importing anthropic bias.  

  **4. Methodology: A Year of Conceptual Precision**  
  *Goal*: Map necessary/sufficient conditions for non-circular correlation.  
  - **Months 1–3**: Survey decision-theoretic, statistical, and metaphysical accounts of "similarity" (e.g., algorithmic equivalence, objective bayesianism, natural properties). Identify *all* proposed grounds for correlation.  
  - **Months 4–6**: Develop test cases probing grounding conditions:  
    - *Twins*: Two identical algorithms from same source.  
    - *Strangers*: Functionally identical agents from independent origins.  
    - *Aliens*: Agents with same evidence/priors but distinct cognitive architectures.  
  - **Months 7–9**: Analyze if proposed grounds (e.g., causal origin, algorithmic structure) yield plausible evidence in test cases *without* assuming cooperation. Use inconsistency proofs: "If ground X implies correlation, then in case Y, it entails absurdity Z."  
  - **Months 10–12**: Synthesize: Either (a) defend a minimal grounding criterion, (b) show all grounds require bootstrapping, or (c) demonstrate that skepticism is unavoidable.  

  *Non-mathematical focus*: Use conceptual analysis and toy cases (e.g., 2–3 agent problems). Formalize only where necessary (e.g., Bayes’ theorem for evidential updating), not measure/probability theory.  

  **5. Success vs. Failure Conditions**  
  - **Success**: A defensible, non-circular criterion for "evidential correlation" that resolves test cases consistently *or* a proof that no such criterion exists. The answer must clarify whether large-world cooperation is justifiable absent stipulation.  
  - **Failure**: The project stalls if (a) grounding criteria dissolve into irreducible vagueness, (b) the bootstrapping problem proves inescapable with no novel response, or (c) test cases show *all* grounds are equally arbitrary.  

  **6. Scope & Feasibility**  
  - **In scope**: Conceptual analysis of correlation grounds; applicability to canonical problems (PD, Newcomb).  
  - **Out of scope**: Full probability distributions over agents, evolutionary dynamics, or group rationality.  
  - **Realistic output**: A negative result ("No non-circular grounding exists") is valuable. A positive result provides a *minimal* criterion (e.g., "Correlation requires shared causal origin *plus* identical constraints").  

  **7. Why This Framing Works**  
  Your original worry was astute: the correlation problem *is* the linchpin. This prospectus:  
  - Targets a **binary question** (Is non-circular grounding possible?) with a **determinate answer** (Yes/No + criterion).  
  - Avoids vagueness by testing proposals against concrete cases.  
  - Sidesteps mathematics by focusing on conceptual necessity.  
  - Is feasible in a year—it’s a focused meta-inquiry, not constructing a new decision theory.  

  **Next Steps**:  
  1. Replace placeholder cases with literature examples (e.g., Bostrom’s "Adam & Eve" for causal origins; Drescher’s PD clones).  
  2. Preempt committee pushback: Emphasize that *even if* correlation is primitive, explaining *why* remains philosophically urgent.  

  This is winnable. Your core insight—that correlation can’t be magic—is the key. Now go corner that circularity.  

