prompt: |-
  You are a value theorist specializing in the commensurability of pleasure and pain and in lexical priority views. I am drafting an adequacy specification for a family of views I will call lexical threshold negative utilitarianism (LTNU). On LTNU, pains and pleasures below some threshold are commensurable and trade off on a single scale, but a pain above the threshold—agony, say—is lexically prior: no quantity of sub-threshold pleasure can outweigh it. Before I evaluate any particular version, I want the desiderata. Think carefully and begin with a short brainstorm of the cases and distinctions that put pressure on such a view.

  Then give the requirements list. For each requirement, state it, give the case or consideration that motivates it, and mark it non-negotiable or version-specific. Be sure to cover: the location and sharpness of the threshold, and whether it can be specified without already assuming the trade-offs it is meant to govern; the comparability of intensity and duration (a long mild pain versus a short agony); the non-independence of pleasure and pain (relief can be pleasurable, and a single state can mix both); whether the threshold is global, person-relative, or baseline-relative; whether sub-threshold pains can aggregate to cross it; and whether the view collapses into prioritarianism or into unthresholded lexicalism. Also consider threshold hysteresis: the threshold for lexical protection may sit at a different point depending on whether one is entering pain from pleasure or leaving pain for pleasure, like a thermostat's separate on and off points. Must an adequate theory accommodate that, or is it an empirical detail it may ignore?

  I especially want any pair or subset of requirements that cannot be jointly satisfied; if the list generates an impossibility result, say so and say which requirement must give. Keep the scoring of existing positions brief—the criteria are the deliverable—and finish with a final line of the form \answer{...} containing the one requirement you judge most exclusionary.
reasoning: |-
  We are drafting an adequacy specification for Lexical Threshold Negative Utilitarianism (LTNU). Let's begin with a short brainstorm of cases and distinctions that put pressure on such views.

  **Brainstorm of Pressure Points:**
  1. **Threshold Location and Sharpness:** How do we set the threshold? Is it a sharp boundary or a vague range? A sharp threshold might lead to counterintuitive discontinuities (e.g., a pain just below the threshold being outweighed by a small pleasure, but a pain just above being lexically prior). Vagueness might introduce indeterminacy.
  2. **Intensity vs. Duration:** Consider a very long mild pain vs. a short agony. If the agony is above the threshold, then no amount of mild pain (even if aggregated over a long time) can outweigh it? But what if the mild pain is extremely long and the agony very short? This challenges the lexical priority.
  3. **Non-Independence of Pleasure and Pain:** 
     - Relief as pleasure: The pleasure of relief from pain might be inseparable from the preceding pain. How do we account for this?
     - Mixed states: A single experience might have both pleasure and pain (e.g., a bittersweet moment). How do we assign it to above or below the threshold?
  4. **Aggregation of Sub-threshold Pains:** Can multiple sub-threshold pains (each below the threshold) aggregate to become equivalent to a super-threshold pain? For example, many mild headaches adding up to an experience as bad as a migraine. This challenges the idea of lexical priority for super-threshold pains.
  5. **Global vs. Relative Thresholds:** 
     - Global threshold: same for everyone?
     - Person-relative: e.g., based on individual sensitivity or resilience?
     - Baseline-relative: relative to a person's current state or normal state? (e.g., chronic pain patients might have a different baseline)
  6. **Hysteresis:** Should the threshold for entering pain (from a state of no pain) be different from the threshold for exiting pain (to a state of no pain)? For instance, once in agony, it might take more relief to get out of it. This might be an empirical detail, but it could be important for policy (e.g., in medical treatment).
  7. **Collapse Risks:** 
     - **Collapse into Prioritarianism:** If the threshold is set very low (so that almost all pains are above it) then we get something close to standard lexical negative utilitarianism (which gives absolute priority to preventing the worst pains). If set very high, then it collapses into classical utilitarianism (if no pain is above the threshold) or perhaps prioritarianism (if we allow aggregation to matter and the threshold is high enough to rarely be triggered). We must avoid both.
     - **Collapse into Unthresholded Lexicalism:** If the threshold is set such that only the very worst pains are above it and we never aggregate, then it might be indistinguishable from a view that has no threshold but only lexical priority for the very worst pains.

  Now, we turn to the requirements list. Each requirement will be stated, motivated by a case or consideration, and marked as non-negotiable or version-specific.

  **Requirements for LTNU:**

  1. **Requirement: Non-arbitrary Threshold Location**  
     *Motivation*: The threshold must be set in a principled way. For example, setting it at the level of 'agony' without a clear criterion would be arbitrary. We need a method that does not rely on the very trade-offs the threshold is meant to govern (to avoid circularity).  
     *Status*: Non-negotiable. Without a non-arbitrary threshold, the theory lacks foundation.

  2. **Requirement: Avoidance of Discontinuity Problems**  
     *Motivation*: A sharp threshold might imply that a pain just above the threshold is infinitely worse than one just below. This seems counterintuitive. We must either accept a vague threshold or provide a justification for the sharp discontinuity.  
     *Status*: Version-specific. Some versions may embrace sharp thresholds with justification, while others may opt for vagueness.

  3. **Requirement: Accommodation of Duration-Intensity Tradeoffs**  
     *Motivation*: Consider a choice between preventing a very long mild pain (below threshold) and a very short agony (above threshold). The lexical priority of agony implies we must prevent the agony, but if the mild pain is long enough, this might seem wrong. The theory must either stick to lexical priority (and accept this implication) or allow for some trade-off (which would violate lexical priority).  
     *Status*: Non-negotiable for the core idea of lexical priority. We must accept that no amount of sub-threshold pain (or pleasure) can outweigh a super-threshold pain. Therefore, the requirement is that the theory must clearly explain and justify this implication.

  4. **Requirement: Handling Non-Independence**  
     *Motivation*: 
     - Relief: The pleasure of relief is only felt because of prior pain. If we count the relief as a separate pleasure, we might be double-counting the badness of the pain and the goodness of relief. Also, if the prior pain is above the threshold, does that taint the relief? 
     - Mixed states: If an experience has both pleasure and pain, how do we decide if it is above the threshold? We need a rule for combining them (e.g., net pain, or separate evaluation).  
     *Status*: Non-negotiable. The theory must provide a consistent account of non-independent states.

  5. **Requirement: Specification of Threshold Relativity**  
     *Motivation*: Should the threshold be the same for all (global) or vary by person? For example, a person with a high pain tolerance might have a higher threshold? Or should it be relative to a baseline (e.g., a chronic pain patient's normal state)? Without clarity, the theory may be inapplicable in practice.  
     *Status*: Version-specific. Different versions may choose different relativities.

  6. **Requirement: Aggregation of Sub-threshold Pains**  
     *Motivation*: Can a large number of mild headaches (each below the threshold) be as bad as one migraine (above the threshold)? If we allow aggregation to cross the threshold, then we lose the strict lexical priority. If not, we might ignore the suffering of many.  
     *Status*: Non-negotiable for the core idea. Lexical priority requires that no aggregation of sub-threshold pains can outweigh a super-threshold pain. Therefore, the requirement is that the theory must not allow aggregation to cross the threshold.

  7. **Requirement: Avoid Collapse**  
     *Motivation*: The theory must not collapse into prioritarianism (which gives priority to the worse off but allows trade-offs) or unthresholded lexicalism (which gives absolute priority to the worst pain regardless of threshold). It must also avoid collapsing into classical utilitarianism (if the threshold is set too high).  
     *Status*: Non-negotiable. The theory must maintain a distinctive position.

  8. **Requirement: Consideration of Hysteresis**  
     *Motivation*: In practice, the point at which pain becomes unbearable (entering) might be higher than the point at which it becomes bearable again (exiting). For example, in medical settings, it might take more analgesia to reduce pain from agony to mild than to prevent a mild pain from becoming agony. Should the theory build in hysteresis?  
     *Status*: Version-specific. It might be an empirical detail that the theory can ignore, but if hysteresis is a fundamental feature of pain, then it might be necessary.

  **Impossibility Concerns:**

  The most challenging tension is between:
  - **Requirement 3 (Duration-Intensity Tradeoffs)**: which requires that no amount of sub-threshold pain can outweigh a super-threshold pain, and
  - **Requirement 6 (Aggregation of Sub-threshold Pains)**: which requires that aggregation of sub-threshold pains cannot cross the threshold (so they cannot be as bad as a super-threshold pain).

  But note: Requirement 3 also implicitly forbids trading off a super-threshold pain with any amount of sub-threshold pain (or pleasure). However, what if we have multiple sub-threshold pains that, when aggregated, are worse than a super-threshold pain? Requirement 6 forbids that. But then what about a very long sub-threshold pain? It might be argued that a long duration is a form of aggregation. For example, a mild pain that lasts for years might be worse than a short agony. However, Requirement 3 says we must choose the short agony over any amount of mild pain? This seems counterintuitive.

  This leads to a potential impossibility: We might not be able to simultaneously satisfy:
  - The intuition that a sufficiently long mild pain can be worse than a short agony (which would require allowing aggregation over time to matter, and perhaps to cross a threshold of total disvalue), and
  - The lexical priority of any pain above the threshold (which says that even the shortest agony is worse than any amount of mild pain).

  Therefore, we must give up one of these. Since lexical priority is at the core of LTNU, we must reject the intuition that a long mild pain can be worse than a short agony. Hence, Requirement 3 and Requirement 6 are non-negotiable for the core of LTNU, and we must accept the implication that a short agony is always worse than any duration of mild pain.

  **Scoring Existing Positions (Briefly):**

  - **Classical Negative Utilitarianism (without threshold)**: Avoids threshold location problems but allows any pain to be outweighed by enough pleasure. Fails lexical priority.
  - **Lexical Negative Utilitarianism (without threshold)**: Gives absolute priority to preventing the worst pain. This is a form of unthresholded lexicalism. It avoids the aggregation problem (by not allowing any trade-off) but faces the problem of ignoring large numbers of mild pains. Also, it does not have a threshold.
  - **Prioritarianism**: Gives extra weight to worse pains but allows trade-offs. It does not have a lexical threshold.

  None of these are LTNU.

  **Final Requirement Choice for Exclusion:**

  The requirement that is most exclusionary (i.e., most likely to rule out otherwise plausible views) is **Requirement 3: Accommodation of Duration-Intensity Tradeoffs** (which requires that the theory maintain lexical priority: no amount of sub-threshold pain or pleasure can outweigh a super-threshold pain). This requirement forces us to reject the intuition that a very long mild pain could be worse than a short agony. It is the core of LTNU but also the point of greatest controversy.

  Therefore, we end with:

  \answer{Requirement 3: Accommodation of Duration-Intensity Tradeoffs}
answer: |-
  ### Brainstorm of Pressure Points
  - **Threshold Location/Sharpness**: A sharp threshold may yield counterintuitive discontinuities (e.g., a pain at 99% threshold vs. 101% treated as infinitely different). Vagueness avoids this but introduces indeterminacy.  
  - **Intensity vs. Duration**: A long mild pain (sub-threshold) vs. a short agony (super-threshold)—must lexical priority always favor preventing the agony, regardless of duration?  
  - **Non-Independence**: Relief from pain is pleasurable, and mixed states (e.g., intense exercise) blend pain/pleasure. Does the threshold apply to net states or components?  
  - **Threshold Relativity**: Is the threshold global (e.g., "severe injury pain for an average human"), person-relative (e.g., based on pain tolerance), or baseline-relative (e.g., deviation from an individual’s normal state)?  
  - **Aggregation**: Can numerous sub-threshold pains (e.g., 1,000 papercuts) aggregate to outweigh a super-threshold pain (e.g., one broken bone)?  
  - **Collapse Risks**: If the threshold is too low, LTNU collapses into lexical negative utilitarianism (all pain prioritized); if too high, it becomes classical utilitarianism.  
  - **Hysteresis**: Should entering agony require more "pain intensity" to trigger lexical priority than exiting agony (e.g., pain lingering after relief)?  

  ---

  ### Adequacy Requirements for LTNU  
  1. **Non-Arbitrary Threshold Specification**  
     - *Statement*: The threshold must be defined independently of the trade-offs it governs, using empirical or conceptual grounds (e.g., neuroscientific pain scales).  
     - *Motivation*: If defined via trade-offs (e.g., "agony is whatever cannot be outweighed by pleasure"), the threshold is circular and unactionable.  
     - *Status*: Non-negotiable.  

  2. **Discontinuity Management**  
     - *Statement*: The threshold must not produce implausible value discontinuities (e.g., a 1-unit pain increase causing infinite disvalue change).  
     - *Motivation*: A sharp threshold implies a pain at 6/10 is infinitely worse than 5.9/10, which seems irrational; gradual transitions (e.g., vagueness or buffer zones) may be needed.  
     - *Status*: Version-specific (e.g., vague thresholds may avoid this).  

  3. **Duration-Intensity Inviolability**  
     - *Statement*: Super-threshold pains lexically dominate sub-threshold states, irrespective of duration (e.g., 1 second of agony > any duration of mild pain).  
     - *Motivation*: Core to lexical priority; rejecting this collapses LTNU into aggregative views. Case: Preventing 1 second of torture vs. curing a lifetime of headaches.  
     - *Status*: Non-negotiable.  

  4. **Non-Independence Resolution**  
     - *Statement*: The theory must handle interdependent states (e.g., relief, mixed experiences) without double-counting or ambiguity.  
     - *Motivation*: Relief from pain is pleasurable only if pain existed first; a single event (e.g., childbirth) may mix pain/pleasure. Failing this distorts value assignments.  
     - *Status*: Non-negotiable.  

  5. **Threshold Relativity Framework**  
     - *Statement*: The threshold must specify if it is global, person-relative, or baseline-relative—and justify the choice.  
     - *Motivation*: Person-relative thresholds (e.g., sensitive individuals) may better reflect welfare but risk subjectivity. Global thresholds ignore diversity (e.g., chronic pain patients).  
     - *Status*: Version-specific.  

  6. **Anti-Aggregation of Sub-Threshold Pains**  
     - *Statement*: Sub-threshold pains cannot aggregate to outweigh or equal a super-threshold pain.  
     - *Motivation*: If aggregation were allowed, lexical priority would be undermined (e.g., 1,000 mild pains > 1 agony). Case: Many minor injustices vs. one severe atrocity.  
     - *Status*: Non-negotiable.  

  7. **Collapse Avoidance**  
     - *Statement*: LTNU must not reduce to prioritarianism (weighted but commensurable trade-offs) or unthresholded lexicalism (all pains prioritized).  
     - *Motivation*: Too low a threshold makes LTNU equivalent to lexical negative utilitarianism; too high makes it classical utilitarianism.  
     - *Status*: Non-negotiable.  

  8. **Hysteresis Accommodation (Optional)**  
     - *Statement*: The theory may, but need not, incorporate distinct entry/exit thresholds for pain (e.g., agony triggers at pain-level 8, but persists until pain-level 5).  
     - *Motivation*: Empirical evidence (e.g., pain hysteresis in neurology) suggests entering/leaving agony may differ. Ignoring this simplifies the model but risks inaccuracy.  
     - *Status*: Version-specific (may be ignored as an empirical detail).  

  ---

  ### Impossibility Result  
  - **Conflict**: Requirement 3 (Duration-Intensity Inviolability) and Requirement 6 (Anti-Aggregation) jointly forbid aggregating sub-threshold pains *and* duration, yet intuitions pressure both. For example:  
    - *Case*: A year of mild pain (sub-threshold) vs. a second of agony (super-threshold). LTNU must always prioritize the agony, but if the mild pain is sufficiently prolonged, this seems counterintuitive.  
  - **Resolution**: Requirement 3 must hold (core to lexical priority), but it exacerbates tension with aggregation. If aggregation *over time* is permitted (e.g., total "pain-days"), LTNU collapses into aggregative views. Thus, **Requirement 6 must be relaxed for duration-only cases** if the view is to accommodate duration—but this risks abandoning lexical priority.  

  ---

  ### Scoring Existing Positions (Brief)  
  - **Classical Utilitarianism**: Fails Requirements 3,6,7 (no threshold, commensurable aggregation).  
  - **Lexical Negative Utilitarianism**: Fails Requirement 7 (no threshold, collapses into unthresholded lexicalism).  
  - **Prioritarianism**: Fails Requirements 3,6,7 (weighted but commensurable trade-offs).  

  ---

  \answer{Requirement 3: Duration-Intensity Inviolability}
