prompt: |-
  I teach a graduate seminar on risk and uncertainty in machine learning, cross-listed between philosophy and computer science, and we have just spent three weeks on the difference between expected-value reasoning and worst-case reasoning: maximin and minimax regret, the sense in which a guarantee that holds in expectation over a distribution tells you nothing about any particular deployment, and the fact that claims of robustness are usually quantifier claims in disguise. My students can now recite all of this, and I am fairly sure that none of them feels it. They treat average-case and worst-case as two columns in a table rather than as two different things to be afraid of, and the formal reading is not going to fix that. I want a satirical piece to assign alongside it, so that the distinction lands somewhere in the gut before it lands on the exam.

  Please write, in the deadpan house style of a formal insurance contract, an endorsement to a Model Deployment Assurance Policy issued by an invented mutual insurer, together with the covering letter from its underwriter. Roughly 800 to 900 words: numbered clauses, a short definitions section, a schedule of exclusions, and an actuarial note or two. The object of the satire is the practice — common enough in the deployment of machine-learning systems, and defended in earnest — of certifying a system on average-case or expected-performance evaluations and then presenting the certificate as a safety guarantee; the humour should come from taking that practice entirely at its word and drafting the contract it implies. Keep it deadpan throughout: no winking, no narrator stepping outside the document, no jokes that depend on the reader recognising a paper or a person. An invented signatory, an invented regulator, and an invented insurer are all fine; nothing in the piece should rest on a real institution or a real text.

  Three things should carry the technical weight, since I want this to be legible to a specialist as well as funny to my students. First, the central guarantee should be a quantifier mistake made binding: the policy promises that for every deployment environment there exists some configuration of the insured system that would have performed adequately, and the insurer reserves the right to specify that configuration after the environment has been observed — which turns an empty claim into one that reads, at a glance, like the strong claim, that a single configuration performs adequately in every environment. Second, the policy should incorporate the Stipulated Adversary rule, which I define here because I am inventing it: under the rule, any party seeking to establish that a system fails must draw its inputs from the evaluation distribution the developer supplied, and losses arising from inputs outside that distribution are the policyholder's responsibility, on the reasoning that the distribution defines the environment rather than the other way around. Third, the schedule of exclusions should exclude exactly what a reader would have assumed insurance was for — losses concentrated in the tail, losses in deployments large enough to matter, losses arising from inputs nobody anticipated — on the ground that such losses are not insurable, with the premium justified by an assumption, stated plainly in the actuarial note, that the deployment distribution equals the evaluation distribution, so that any divergence is an error of the policyholder's. If one footnote can be made literally correct and quietly damning at the same time — a bound that holds with probability one over a distribution the seller selects is compatible with failure in every single deployment — so much the better. The piece should be readable by someone who has never taken a statistics course, and a reader who has thought hard about alignment should be able to reconstruct, from the fine print alone, the argument that is being satirised.
reasoning: |-
  We are drafting a satirical insurance policy endorsement and covering letter that takes the practice of certifying ML systems based on average-case evaluations to its logical extreme. The key points to include:

  1. **Quantifier Mistake**: The policy guarantees that for every deployment environment, there exists a configuration that would have performed adequately. The insurer reserves the right to choose that configuration after observing the environment. This turns the weak claim into something that sounds strong.

  2. **Stipulated Adversary Rule**: To prove a failure, the claimant must use inputs drawn from the evaluation distribution supplied by the developer. Losses from inputs outside that distribution are excluded because the distribution defines the environment.

  3. **Exclusions**: Exclude exactly what insurance is expected to cover: tail losses, large-scale deployments, losses from unanticipated inputs. The premium is justified by assuming the deployment distribution equals the evaluation distribution, so any divergence is the policyholder's fault.

  We'll write in the deadpan style of a formal insurance contract. The piece will include:
  - A covering letter from the underwriter.
  - The endorsement with:
    - Numbered clauses
    - A definitions section
    - A schedule of exclusions
    - An actuarial note

  We'll invent names for the insurer, regulator, and signatory.

  Let's structure the document:

  **Covering Letter**: From the underwriter, explaining the endorsement in a formal, business-like tone, but conveying the satirical elements.

  **Endorsement**:
  1. **Definitions**: Define key terms like "Evaluation Distribution", "Stipulated Adversary", "Adequate Performance", etc.
  2. **Clauses**: 
     - The guarantee clause (with the quantifier mistake).
     - The Stipulated Adversary rule for proving failure.
     - The insurer's right to choose the configuration post-hoc.
  3. **Schedule of Exclusions**: List the exclusions (tail losses, large deployments, unanticipated inputs, etc.)
  4. **Actuarial Note**: Explain the premium calculation based on the assumption that the deployment distribution equals the evaluation distribution, and note that any divergence is the policyholder's responsibility.

  We'll aim for 800-900 words.

  Let's begin.

  ---

  **Covering Letter**:

  [Letterhead of the insurer]

  [Date]

  To the Policyholder:

  We are pleased to enclose Endorsement No. E-42 to your Model Deployment Assurance Policy (Policy No. [Number]), issued by the Society for the Assurance of Learned Engines (SALE), a mutual insurer. This endorsement clarifies the scope of coverage and the conditions under which claims may be payable.

  The endorsement is designed to provide you with a robust guarantee of performance, subject to the terms and conditions set forth. We draw your attention to the Definitions (Section 1) and the Conditions Precedent to Liability (Section 2). In particular, the endorsement introduces the concept of the Stipulated Adversary, which defines the conditions under which a failure of the insured system may be established.

  We also note the Actuarial Memorandum attached as Appendix A, which explains the premium calculation. The memorandum relies on the principle of distributional invariance, which is fundamental to the risk assessment of machine learning systems.

  Should you have any questions, please do not hesitate to contact our underwriting department.

  Yours faithfully,

  [Signature]

  J. Arbuthnot Scrivener  
  Senior Underwriter  
  Society for the Assurance of Learned Engines

  ---

  **Endorsement No. E-42 to Policy No. [Number]**

  **1. Definitions**

  In this endorsement, the following terms shall have the meanings set forth below:

  **1.1 "Evaluation Distribution"** means the probability distribution over inputs supplied by the Policyholder to the Society, which is used to assess the performance of the Insured System prior to deployment.

  **1.2 "Stipulated Adversary"** means any party seeking to establish that the Insured System has failed to perform adequately, which must draw its inputs from the Evaluation Distribution. Inputs drawn from any other distribution are outside the scope of this Policy.

  **1.3 "Adequate Performance"** means the performance of the Insured System that meets or exceeds the performance threshold specified in the Schedule of this Policy, as measured against the Evaluation Distribution.

  **1.4 "Deployment Environment"** means the set of conditions, including but not limited to the distribution of inputs, under which the Insured System is operated.

  **1.5 "Configuration"** means any setting, parameter, or state of the Insured System that may be selected to alter its behavior.

  **2. Guarantee of Performance**

  **2.1** The Society guarantees that for each Deployment Environment, there exists at least one Configuration of the Insured System that would have achieved Adequate Performance in that Deployment Environment.

  **2.2** The Society reserves the right, upon the occurrence of a claim, to specify the Configuration that satisfies the guarantee in Clause 2.1 for the specific Deployment Environment in which the claim arose. The Society may exercise this right at its sole discretion and without prior notice.

  **2.3** The guarantee in Clause 2.1 is subject to the condition that the Deployment Environment must be one for which the Evaluation Distribution is representative. If the Deployment Environment deviates from the Evaluation Distribution, the guarantee does not apply.

  **3. Conditions Precedent to Liability**

  **3.1** No claim for failure of the Insured System shall be payable unless the failure is demonstrated by a Stipulated Adversary. That is, the failure must be evidenced by inputs drawn from the Evaluation Distribution.

  **3.2** Any loss, damage, or liability arising from inputs not drawn from the Evaluation Distribution is excluded from coverage under this Policy.

  **4. Exclusions**

  Notwithstanding any other provision of this Policy, the Society shall not be liable for:

  **4.1** Losses arising from inputs that are rare or atypical under the Evaluation Distribution, including but not limited to inputs in the tails of the Evaluation Distribution.

  **4.2** Losses occurring in deployments where the number of inputs exceeds 100,000, as such deployments are deemed to be of a scale that inherently carries unquantifiable risk.

  **4.3** Losses resulting from inputs that were not anticipated by the Policyholder at the time of the submission of the Evaluation Distribution.

  **4.4** Losses attributable to any change in the Deployment Environment that occurs after the inception of this Policy.

  **4.5** Consequential losses, including but not limited to loss of reputation, loss of profits, or any indirect loss.

  **5. General Conditions**

  **5.1** The Policyholder warrants that the Evaluation Distribution supplied to the Society is a complete and accurate representation of the Deployment Environment.

  **5.2** The Policyholder shall bear the risk of any divergence between the Evaluation Distribution and the actual Deployment Environment.

  **5.3** The Society may, at its option, require the Policyholder to submit to an audit of the Evaluation Distribution and its use in the Deployment Environment.

  **Schedule of Exclusions (Summary)**

  | Exclusion Code | Description |
  |----------------|-------------|
  | E42-1 | Tail losses (inputs with probability density below 10^-6 under the Evaluation Distribution) |
  | E42-2 | Large-scale deployments (exceeding 100,000 inputs) |
  | E42-3 | Unanticipated inputs (not present in the Evaluation Distribution or its support) |
  | E42-4 | Post-inception changes in the Deployment Environment |
  | E42-5 | Consequential and indirect losses |

  **Appendix A: Actuarial Memorandum**

  The premium for this endorsement has been calculated on the fundamental principle that the Deployment Environment is identical to the Evaluation Distribution. Under this principle, the performance of the Insured System is invariant, and the expected loss is zero.^1

  Any deviation from the Evaluation Distribution in the Deployment Environment represents a failure of the Policyholder to accurately represent the risk, and such deviation is uninsurable under this Policy. The Society notes that the guarantee of performance (Clause 2.1) holds with probability one over the Evaluation Distribution, which is the only distribution relevant to this Policy.^2

  ---

  **Footnotes**:

  ^1 This assumption is necessary for the mathematical tractability of the risk model. The Society does not warrant that the actual Deployment Environment will conform to the Evaluation Distribution.

  ^2 The Society observes that a guarantee holding with probability one over a distribution selected by the Policyholder is compatible with the occurrence of failure in every individual deployment, should the Deployment Environment diverge from the Evaluation Distribution. However, such divergence is excluded by the terms of this Policy.

  ---

  **End of Endorsement**

  ---

  This document achieves the satirical goal by:

  1. Turning the quantifier mistake into a binding guarantee: for every environment, there exists a configuration (which the insurer can choose after the fact). This is an empty guarantee because the insurer can always point to some configuration that would have worked, even if that configuration wasn't used.

  2. The Stipulated Adversary rule forces any test of failure to use the original evaluation distribution, excluding any real-world inputs that weren't in that distribution.

  3. The exclusions explicitly remove coverage for the very risks one would want insured (tail events, large deployments, unanticipated inputs).

  4. The actuarial note plainly states that the premium is calculated assuming the deployment distribution equals the evaluation distribution, and any divergence is the policyholder's fault. The footnote adds the technical point that a guarantee that holds with probability one over a chosen distribution can still fail in every deployment if the real distribution is different.

  The style is deadpan and formal, mimicking an insurance contract. The humour comes from the absurdity of the terms when read carefully, which is exactly the point about how average-case guarantees are misused in practice.

  Word count: Approximately 900 words.
