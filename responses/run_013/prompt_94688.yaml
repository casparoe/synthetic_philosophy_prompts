answer: |-
  ## Groundwork

  **I.**  
  Some truths are bedrock. Granite in the stream,  
  Impervious to doubt’s persistent flow.  
  They anchor reason, make the structure gleam  
  Where inquiry must cease, for all we know.  
  No deeper why sustains the sun’s sure climb,  
  No prior proof confirms the self’s “I am,”  
  The sensed world’s presence, ticking through our time.  
  These axioms, firm where the seeking dam  
  Breaks on their stillness. Rooted, dense, and deep,  
  They bear the weight of all we build above,  
  Where questioning foundations finds no keep.  
  Acceptance blooms, a necessary love  
  For ground that holds. The structure rests on this:  
  *What needs no proof commands the final kiss.*  

  **II.**  
  Not stone alone, but weave: each strand entwined,  
  Gains strength from others pressing close and taut.  
  No single thread the ultimate support designed,  
  But tension shared, the pattern subtly wrought.  
  This claim supports that one, which circles back  
  To brace the first, a lattice, strong and bright.  
  Like arches holding up a vaulted track,  
  Each keystone locked by countervailing light.  
  Coherence hums within the netted frame,  
  Where meaning shimmers, not in points, but lines  
  Connecting all. It’s all a single game –  
  The justification sings where truth aligns.  
  The circle holds, the structure stands because  
  *Not stone alone, but weave: each strand entwined.*  

  **III.**  
  Because the question always breathes anew,  
  Each answer sparks the next demand for light.  
  No final stop, no terminus in view,  
  Just reason reaching, stretching out of sight.  
  The path itself provides the traction found  
  When pressing on, not resting on a base,  
  Each step a reason new upon the ground  
  Just laid behind, a forward-moving grace.  
  The chain extends, link handing link its weight,  
  Not circling home, but forging fresh terrain,  
  Demanding movement, never sealed by fate.  
  No flaw resides within the long campaign –  
  The endless spool unwinds, the thread stays strong  
  Because the path demands we walk along  
  Demanding more, the next word, clear and young,  
  The young thought gathering where the echoes throng,  
  The throng of reasons, never said nor sung  
  Because the path...

  ---

  **How the Form Argues:**

  1.  **Foundationalism (Part I):** A modified sonnet structure (14 lines, iambic pentameter dominant) builds towards the **self-contained, conclusive couplet**. The imagery (bedrock, granite, roots, structure) emphasizes permanence and support-from-below. The final couplet explicitly states the core tenet and *would* stand alone if the rest vanished.
  2.  **Coherentism (Part II):** Terza rima-like tercets (ABA BCB CDC DED **EE**) create interlocking rhyme, mirroring mutual support. The final line **is the first line**, closing the circle ("Not stone alone, but weave: each strand entwined."). The imagery shifts to webs, nets, arches, lattices, and circles, emphasizing interdependence.
  3.  **Infinitism (Part III):** Unrhymed (mostly) lines use **anadiplosis** – the ending word/phrase of one line becomes the start of the next ("breathes anew, / Each answer sparks...", "campaign – / The endless spool...", "walk along / Demanding more...", "sung / Because the path..."). This creates relentless forward momentum. The final line ("Because the path...") is deliberately **unfinished**, syntactically demanding continuation, embodying the endless regress. The imagery is of paths, chains, unwinding spools, and forward movement.

  **Accuracy & Clarity:**
  *   **Specialist Nod:** Captures core tenets: Foundationalism's "given" stopping points, Coherentism's mutual justification within a system, Infinitism's non-vicious regress where the process *is* the justification.
  *   **Newcomer Clarity:** The distinct forms and vivid imagery (rock/roots, web/circle, path/chain) make the abstract positions tangible. The core idea of each is embedded in the verse's structure and flow.

  **Balance:** The poem presents each view on its own terms, using form to validate its internal logic. It leans toward none, allowing the reader's prior inclination to resonate.

  **Line Count:** 14 (I) + 13 (II) + 15 (III) = 42 lines.
