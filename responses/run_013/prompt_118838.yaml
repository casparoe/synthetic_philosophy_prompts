    - Case 3: The request is to put a wire for Sabbath. If you swap out the religious reason (it's for Sabbath), what's left? The wire is for a symbolic boundary that only matters to those who opted in. But the reason for the request is religious. However, R. says it's admissible because it doesn't impose on others. The swap test: if we swap out the religious premise (say, they want the wire for a non-religious reason, like a cultural tradition), the reason might still stand: it doesn't cost the town and only binds those who opt in. So **fits: Admissible.**
    - Case 4: Catholic hospital exemption. Swap out the theology: without the theology, there's no complicity in wrongdoing. So no reason stands. **Fits: Not admissible.**
    - Case 5: Interfaith coalition: they give a scriptural reason and then a labor-shortage case. Swap out the scriptural reason and the labor-shortage case still stands. **Fits: Admissible.**
    - Case 6: Religious school exemption from curriculum. Swap out the religious premise: without the religious objection, there is no reason to exempt. But R. ruled admissible. This might be a problem for the swap test? However, note that the school is asking for an exemption for themselves only. The reason might be framed as: the state should allow religious schools to follow their own curriculum because of religious freedom, but without the religious part, it becomes a claim about autonomy. But in the absence of a non-religious reason, the swap test might fail. However, R. ruled admissible. So maybe the swap test doesn't fit here? But wait, let's see: the reason given is religious, but the effect is only on the school. This might be more about the scope of the rule. Alternatively, perhaps in this case, even without the religious premise, there might be a secular reason for allowing exemptions for private schools? But the school didn't offer one. This case is tricky for the swap test.
