  We are given several rulings by R. and we are to deduce her rule for when a religious argument is admissible as a public reason. We are then to apply it to a new case about a rabbi opposing a paid kidney donation bill.

  First, let's list the cases and rulings:

  1. Lutheran pastor: testifies against cutting in-home care funding. She leads with faith but spends most time on waitlist numbers and institutional care costs. **Admissible.**
  2. State rep: votes against anti-discrimination bill, says scripture is clear, answers to God, doesn't care if non-believers see the reason. **Not admissible.**
  3. Hasidic community: wants to string a symbolic boundary wire on utility poles for Sabbath. **Admissible** because it costs nothing and binds only those who asked.
  4. Catholic hospital: asks for blanket exemption from a legally required service because it makes them complicit in sin. **Not admissible** because the reason only works if you accept the whole theology.
  5. Interfaith coalition: argues for refugee resettlement bill, says scriptural reason then makes labor-shortage case. **Admissible.**
  6. Religious school: argues state curriculum rule shouldn't apply to its classrooms. **Admissible.**
