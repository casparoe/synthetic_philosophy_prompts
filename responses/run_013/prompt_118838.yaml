  Case 6 is problematic for the swap test. The religious school didn't offer a secular reason. So if we swap out the religious premise, there's no reason left. But R. ruled it admissible. So the swap test would say "not admissible", but R. said "admissible". Therefore, the swap test does not fit Case 6.

  ### Rule 2: Burden Test (about who has to live under the rule)
  - The idea is: if the rule only affects those who consent or are part of the group, then it's admissible. If it imposes on others, then it must be justified by reasons that the others can accept.
    - Case 1: The bill cutting funding affects disabled people. The pastor's testimony is about the impact on the state and waitlists. The reason is about the public cost and welfare. It doesn't impose a religious view on others. **Fits: Admissible.**
    - Case 2: The anti-discrimination bill is about protecting people from discrimination. The state rep's vote imposes a rule that allows discrimination based on his religious view, which he doesn't care if others accept. This imposes on others without a public reason. **Fits: Not admissible.**
    - Case 3: The Hasidic wire only affects the Hasidic community and doesn't bind non-members. **Fits: Admissible.**
    - Case 4: The Catholic hospital exemption would mean that the public is denied a legally required service. This imposes on the public. **Fits: Not admissible.**
    - Case 5: The refugee bill affects the public (refugees, labor market) but the coalition gives a public reason (labor shortage). **Fits: Admissible.**
    - Case 6: The religious school exemption only affects the school. The state curriculum rule would normally apply, but the school is asking for an exemption for themselves. This doesn't impose on others. **Fits: Admissible.**
