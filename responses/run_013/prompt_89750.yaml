answer: |-
  Here's a reading of *Amadeus* focused on the ethics of dramatizing the real dead, tackling your core questions and distinctions:

  **The Core Ethical Violation: Beyond Misrepresentation to Conscription**

  You're right to feel the distinction between "misrepresentation" (factual error) and "conscription" (using the person as raw material, disregarding inconvenient truths) is crucial. *Amadeus* isn't just wrong about Salieri poisoning Mozart; it **forces Salieri to own the lie.** F. Murray Abraham delivers a brilliant, deeply sympathetic performance of a man *confessing* to the crime that haunted the real Salieri's life as a slanderous rumor. This is the ultimate conscription:

  1.  **Forced Authorship:** The film doesn't just *say* Salieri killed Mozart; it makes *him* narrate the act, imbue it with motive (divine jealousy), and frame it as the pivotal sin of his life. It writes his confession *for* him.
  2.  **Hijacking Interiority:** It invents a profound, tormented, and theologically complex interior life centered on a crime he didn't commit. This goes beyond factual error; it fabricates the core of his existential struggle.
  3.  **Exploiting the Asymmetry of Death:** Precisely *because* Salieri is dead and cannot object, correct, or defend himself, the film exercises absolute power over his posthumous narrative. His historical self is erased and replaced with this fictional confessor. The "record" becomes the film, and the film becomes Salieri for most viewers. The asymmetry *magnifies* the wrong – it's an act of narrative violence enabled by silence.

  **Does Sympathy Mitigate or Exacerbate?**

  *   **Worse, Not Better:** The profound sympathy the film generates for its Salieri arguably makes the conscription *more* egregious, not less.
      *   **False Intimacy:** We feel we *know* and *understand* this Salieri, creating a false sense of access to the real man's soul. This intimacy makes the fabrication harder to detect and dismantle.
      *   **Emotional Manipulation:** The sympathy encourages us to *accept* the confession as psychologically plausible and emotionally resonant, lending credibility to the lie. We forgive the falsehood because the character is so compelling and tragic.
      *   **The Burden of False Guilt:** It saddles the real Salieri not just with a false accusation, but with the *emotional weight* and *moral torment* of a murderer's conscience he never bore. It's a profound psychological burden placed on his memory.

  **The Film's Metatheme: Memory, Oblivion, and Self-Contradiction**

  You've hit on the film's fascinating tension:

  1.  **Salieri's Theological Stance:** Within the narrative, Salieri *should* care only about God's judgment, not earthly reputation ("What use is God's forgiveness? It's yours I want!"). By his own stated beliefs, posthumous fame is vanity.
  2.  **The Film's Obsession:** Yet, the film is saturated with the *terror* of being forgotten. The bored priest who doesn't recognize Mozart's music, Salieri's desperate attempts to be remembered as Mozart's murderer ("Mediocrities everywhere... I absolve you... I absolve you all!"), the very act of confession are all about legacy. The tragedy feels rooted in the fear of insignificance *in human memory*.
  3.  **Contradiction as Insight:** This isn't just a contradiction; it's the film's core insight into the *human* condition, even one ostensibly focused on the divine. It reveals Salieri's hypocrisy: he claims to care only for God, but his defining sin (envy, murder) and his final desperate act (the confession) are driven by a desperate, pathetic need for earthly recognition and significance, however infamous. His obsession with God masks an obsession with his own place in the human story. The film understands that for mortals, even those who profess faith, oblivion is a deeper terror than damnation.

  **Salieri: Person or Allegory? Does it Matter Ethically?**

  *   **He is Both:** Film-Salieri transcends *mere* allegory. He's a psychologically rich, specific character. However, he *functions* powerfully as an allegory for:
      *   **Mediocrity recognizing genius:** The agony of the competent artist confronted by effortless, divine talent.
      *   **The cruelty of perceived divine injustice:** Why bestow genius on the vulgar Mozart and mere diligence on the devout Salieri?
      *   **The destructive power of envy.**
  *   **Allegory Doesn't Absolve Conscription:** Using a real person as the vessel for allegory *intensifies* the ethical problem. It instrumentalizes Antonio Salieri, reducing his complex historical reality to a symbol. His name and identity are crucial to the allegory's power – "Salieri vs. Mozart" resonates far more than "Composer A vs. Composer B." Allegory leverages the weight of historical reality for its impact, making the conscription essential to its function. It doesn't get the film off the hook; it makes the conscription *the point*.

  **What the Film Adds to the Argument: Visceral Tragedy**

  *Amadeus* doesn't just repeat the rumor; it **embodies the ethical cost of such conscription in devastatingly human terms.** Arguments about posthumous harm are abstract. *Amadeus* makes you *feel* it through its Salieri:

  1.  **The Confession Scene:** The core ethical violation *is* the scene. Salieri's agonized narration, the weight of his false guilt, the manipulation of the priest (and audience) – it's a masterclass in dramatizing the act of forcing a false narrative onto a real person. We witness the conscription happening.
  2.  **The Cost of Fictional Interiority:** Abraham's performance forces us to confront the sheer *weight* of the fabricated guilt and torment placed on Salieri. It shows the human toll of such narrative invention, making the abstract "harm" concrete and tragic.
  3.  **The Irony of Oblivion:** The film brilliantly shows Salieri achieving the remembrance he craves through infamy, yet the *real* Salieri is forgotten *because* of the film's success. The film-Salieri eclipses the historical one, proving its own point about the cruel caprice of memory while enacting that caprice.
  4.  **Sympathy as Complicity:** The film forces the audience into a complex ethical bind. We are moved by this fictional Salieri, even as we (hopefully) know he's a fabrication doing violence to the real man's memory. Our empathy makes us complicit in the conscription. This uncomfortable tension *is* the film's unique contribution to the debate.

  **Conclusion: The Unforgivable Act and the Unforgettable Film**

  *Amadeus* commits a profound ethical wrong: it conscripts the real Antonio Salieri, forces him to confess to a crime he didn't commit, and saddles his memory with a fabricated, tormented interior life. The film's brilliance and sympathy for its *character* make this conscription more, not less, egregious. It leverages the asymmetry of death to rewrite the historical record in the most intimate way possible.

  However, by making this act the core of its tragedy, *Amadeus* illuminates the dark heart of the ethical dilemma in a way abstract arguments cannot. It forces us to witness the human cost of using the dead as narrative raw material through the devastatingly realized suffering of its fictional Salieri. It shows that the greatest harm isn't just factual error, but the theft of a person's voice and the imposition of a false self, even after death. The film's power lies precisely in making us feel the tragedy of this conscription, even as we recognize it as the central, unforgivable act upon which the entire masterpiece is built. It doesn't add *justification* to the argument; it adds unforgettable, visceral *testimony* to the cost. The ethical wrong is inseparable from the film's artistic triumph.
