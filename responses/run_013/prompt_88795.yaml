prompt: |-
  I'm putting together a podcast ep with a philosopher who defends an etiological / selected-effects account of biological function -- the rough idea that a trait's function is what it was selected for, not just what it currently does. I need 8-10 interview questions that go way past the textbook stuff. I want at least one question each on: (a) traits that are useful but weren't selected for (exaptations, spandrels, byproducts), (b) traits that were selected for but no longer do anything useful or are now harmful (vestigial organs, maladaptive sexual traits), and (c) how the account explains malfunction and normativity -- why a broken heart is a heart that fails to do its function rather than just a heart that does something else. For each of those, give a follow-up that anticipates the answer he's most likely to give (e.g., if he says selection history fixes function, ask about traits whose selection history is contested or unknown; if he says the account is about type-level selection, ask about token traits and individual organisms). I also want a couple of questions that put pressure on the etiological account from the causal-role side: why isn't function just a causal contribution to a system's capacity, and how does the etiological account avoid making function claims depend on a controversial theory of selection (e.g., genic selectionism, adaptationism, or the levels-of-selection debate)? And one question about whether the debate is really about biology or about what we want the word function to do in explanations. Please make the questions concrete -- use actual biological cases (heart, appendix, male nipples, junk DNA, transposable elements, the clitoris, sleep, immune surveillance) rather than staying abstract. No generic questions like what got you into philosophy. Also, for each question, note what a good answer would need to accomplish, so I can tell if he's dodging. And definalty no questions that just ask him to define his terms.
