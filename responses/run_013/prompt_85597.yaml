prompt: |-
  I have read rationalist blogs for long enough to have absorbed one suspicion in particular: when a procedure needs to know who counts, and the answer is that whoever counts decides who counts, the procedure has smuggled its conclusion in at step zero. The boundary problem is that suspicion in its purest form, and until this year I was content to enjoy it from a safe distance.

  I now chair the registration appeals panel of a newly created combined authority: a city-region with a directly elected mayor, a standing citizens' assembly with a capital budget of its own, and, since April, a registrar of members. The registrar's initial policy is to inherit the parliamentary register, which nobody defends and everybody uses. We sit weekly, hear about forty written appeals a month, and must dispose of each in half an hour on the papers; three of us decide (myself, a solicitor, a lay member drawn by lot), a precedent binds us for a decade unless we overturn it unanimously, and everything we do has to survive judicial review and a hostile local paper. The assembly has asked for a general procedure rather than case-by-case improvisation. Please write it: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it must hand the matter to the assembly because the question is one of values rather than facts.

  Three commitments I want the procedure to take seriously, because each is where I think the usual treatments cheat. First, the franchise is not one thing. Being counted in the constituency, voting, standing for office, petitioning, triggering a referendum, having standing to challenge a decision, being taxed, and being bound are separable incidents; a test that is defensible for one may be indefensible for another. Build the procedure incident by incident, and say where one test can honestly serve several. Second, two principles are in play and they disagree: the affected-interests principle, on which anyone whose interests are significantly affected by a decision has a claim to a proportionate say, and the subjected-persons principle, on which only those bound by the authority's rules have a claim to make them. Say which principle each step is using, and what we are to do when they conflict at the level of the answer we give an appellant, not in the abstract. Third, I have a half-formed test I would like you either to operationalise or to kill: give the vote to whoever bears the residual risk of the decision going wrong, the party left holding the loss once the specific beneficiaries have been paid. It has the pleasing property of tracking who actually pays for a mistake. I suspect it also hands the vote to landlords and creditors and takes it from the transient poor, which I will accept if it is right and not otherwise. Tell me whether it survives contact with the cases, and if it does, where it enters the procedure.

  The cases that keep arriving, which the procedure must handle without special pleading:

  - a man with a British passport who has not lived in the region for twenty-two years, pays no local tax, owns a flat here which he lets out, and votes in national elections;
  - a woman who has lived and worked here for fourteen years, pays council tax, has two children in local schools, and holds a visa with no route to settlement;
  - commuters from the neighbouring district who use the region's hospitals and trains, are governed elsewhere, and whose council has asked to be represented;
  - a sixteen-year-old who turns eighteen before the assembly's term ends;
  - an adult under guardianship whose capacity her brother disputes;
  - a developer who owns about a third of the land in one ward and lives abroad;
  - the people who will be born here during the decade over which the assembly is issuing debt;
  - an association of former residents who have moved away but still own property and meet once a year.

  Run the procedure on three of these, at least one where the answer will annoy me, and finish by telling me what the procedure cannot do and where I should stop pretending it is one. I do not need a survey of the literature; I have read enough of it to know that the honest answer is a procedure with the value judgements left visible.
reasoning: |-
  Hmm, the user is chairing a registration appeals panel for a new combined authority and needs a practical procedure for determining membership boundaries. They've clearly thought deeply about this - referencing rationalist blogs, boundary problems, and specific philosophical tensions. 

  Their three commitments are particularly sophisticated: they want to separate different "incidents" of membership (voting vs taxation etc), explicitly handle the conflict between "affected-interests" and "subjected-persons" principles, and test their "residual risk" idea. The case examples are perfectly chosen stress tests.

  Noticing they're clearly time-pressed ("half an hour per appeal", "hostile local paper") but refuse oversimplification. The "no literature survey" demand suggests they've seen too many theoretical solutions that collapse in practice. Their "half-formed test" about residual risk holders reveals an engineer's mindset - they want mechanisms that actually track real-world consequences.

  The procedural constraints are brutal: binding precedents, judicial review risks, and unanimous votes required to change course. Yet they insist on avoiding "case-by-case improvisation." This needs to be both rigorously systematic and adaptable - hence the request for "where the procedure stops" when hitting value judgments.

  For the residual risk test: it's clever but does indeed favor capital over labor. In the developer case it might work (they bear development risks) but fails completely for the future-born or visa holder. Probably should confine it to financial incidents like bondholder liability.

  The case selection is telling - they specifically want one outcome that "annoys" them, signaling intellectual honesty. The non-resident landlord case will likely be that one: subjected-persons principle clearly excludes him from voting, but affected-interests says he should have some voice. Procedure must resolve this cleanly.

  Biggest challenge will be preventing the "who decides who counts" infinite regress. The exit ramp comes in Step 3 - when principles conflict, kick to the assembly with clear framing. Also need built-in off-ramps for judicial review bait like the guardianship case.

  Final structure should mirror their incident-based approach: waterfall from broadest (constituency) to narrowest (standing) with clear gates. Must visually distinguish factual thresholds from value choices. And absolutely must include the "this cannot do" disclaimer - they'll smell bullshit otherwise.
answer: |-
  Here is a procedural framework designed for your Appeals Panel, incorporating your core commitments and constraints. It operates as a decision tree with explicit off-ramps for value judgments requiring Assembly input. The procedure prioritizes speed, defensibility, and transparency.

  **Registration Appeals Procedure: Determining Qualification for Designated Incidents**

  **Core Principles:**
  1.  **Incident-Specificity:** Qualification is assessed *per incident* (Constituency, Voting, Standing, Petitioning, Referendum Trigger, Standing to Challenge, Taxation Liability, Being Bound). A single test rarely suffices for all.
  2.  **Principle Transparency:** Each step applies either the **Affected-Interests Principle (AIP)** (stake in outcome) or the **Subjected-Persons Principle (SPP)** (bound by rules). Conflict resolution is defined per step.
  3.  **Residual Risk Test (RRT):** Operationalized only for specific financial/liability incidents (see Step 4c/5b). Rejected as a *general* franchise test due to bias against the transient poor and lack of direct relevance to most incidents (e.g., voting, standing).

  **Procedure Steps:**

  1.  **Identify the Incident(s) in Question:**
      *   *Question:* Which specific incident(s) is the appellant seeking qualification for? (e.g., Inclusion in the Constituency? Right to Vote in Mayoral Election? Right to Stand for Assembly? Liability for the new Business Improvement Levy?)
      *   *Sufficient Answer:* Clear identification of the incident(s) from the defined list, based on appellant's request/appeal grounds. *If unclear, request clarification from Registrar/Appellant.*
      *   *Stop?* No. Proceed to Step 2.
      *   *Principle:* N/A (Factual).

  2.  **Establish Core Factual Thresholds (SPP Primacy):**
      *   *Question:* Does the appellant meet the *minimum factual criteria* universally required for *any* incident under SPP? (e.g., Is the appellant a *natural person*? Is the appellant *alive*? Is the appellant *legally recognized as a person* within UK jurisdiction? Does the incident inherently require a *minimum age* (e.g., 18 for voting/standing) and does the appellant meet it *now*, or by the *relevant date* (e.g., election day, debt issuance date)?)
      *   *Sufficient Answer:* Verifiable evidence (passport, birth/death certificate, court order, age calculation based on fixed date) confirming or denying the factual threshold. Hearsay is insufficient.
      *   *Stop?* **YES** if threshold *not met*. *Appeal fails for all incidents requiring that threshold.* Proceed if met or threshold irrelevant to the incident.
      *   *Principle:* **SPP** (Fundamental to being subject to rules). *Conflict Resolution:* SPP controls factual minima. AIP cannot override death, non-personhood, or clear age bars set by law/precedent.

  3.  **Determine "Subjected Person" Status (SPP) for the Incident:**
      *   *Question:* Is the appellant *currently subject to the specific rules and enforceable obligations* generated by the Combined Authority *within the geographic area* of its jurisdiction, *relevant to the incident*?
      *   *Sufficient Answer:*
          *   **For "Being Bound":** Proof of current, habitual residence OR ownership/leasehold of taxable property OR operating a business within the authority. (Focus: Direct legal obligation).
          *   **For "Taxation":** Proof of liability for a specific tax/levy enacted by the Authority.
          *   **For "Standing to Challenge":** Proof the appellant is directly subject to the specific decision being challenged.
          *   *Others (Voting, Standing, Petitioning, Trigger):* This step is *necessary but not sufficient*. Proceed to Step 4/5.
      *   *Stop?* **YES** if *not* subjected *and* the incident *only* requires SPP (e.g., "Being Bound"). **NO** if subjected, or if incident requires AIP consideration (Proceed to Step 4). **HANDOFF** if SPP status is ambiguous or the *degree* of being subjected is contested on normative grounds (e.g., commuter using services but governed elsewhere). *Frame the conflict for Assembly: "Does incidental use of Authority services/resources constitute 'being subject to its rules' for purpose [Incident X]?"*
      *   *Principle:* **SPP**. *Conflict Resolution:* If SPP clearly unmet for an SPP-only incident, appeal fails. Ambiguity triggers Assembly handoff.

  4.  **Assess "Affected Interests" (AIP) & Intensity for the Incident:**
      *   *Question (4a - Existence):* Does the Combined Authority exercise significant, *direct* power over interests (welfare, finances, property, rights) that the appellant demonstrably holds?
      *   *Question (4b - Intensity & Proportionality):* Is the *degree* of effect on the appellant's interests sufficiently significant and direct to justify the *specific incident* sought (e.g., Voting is a high threshold; Petitioning is lower)?
      *   *Sufficient Answer:* Objective evidence linking Authority decisions/actions to a concrete, non-trivial impact on appellant's verifiable interests (e.g., property deeds, tax bills, employment contracts, school admissions, utility bills for primary residence, business licenses). Speculative or diffuse impacts (e.g., general economic conditions, future children) are insufficient *here*. Intensity is judged against precedent.
      *   *Stop?* **YES** if no significant interest affected. **HANDOFF** if significant interest exists but the *proportionality* of granting the *specific incident* (e.g., vote vs. petition right) is contested on normative grounds. *Frame for Assembly: "Does a [Level X] interest in [Domain Y] justify granting [Incident Z]?"*
      *   *Principle:* **AIP**. *Conflict Resolution:* If no significant interest, appeal fails for AIP-dependent incidents. Proportionality ambiguity triggers Assembly handoff. *Conflict with SPP Step 3:* If appellant is *not* subjected (Step 3 NO) but *is* significantly affected (Step 4 YES), proceed to Step 5 for resolution.

  5.  **Resolve SPP/AIP Conflict & Apply RRT (Where Relevant):**
      *   *Situation:* Appellant meets AIP (Step 4 YES) but *not* SPP (Step 3 NO or ambiguous).
      *   *Question (5a - Conflict Resolution Rule):* Does precedent, statute, or core Authority purpose dictate which principle prevails *for this specific incident*? (e.g., Voting/Standing usually lean SPP; Petitioning might lean AIP).
      *   *Sufficient Answer:* Clear precedent or logical deduction from Authority's founding statutes/purposes. If absent or conflicting, **HANDOFF**: *"For incident [X], which principle (SPP or AIP) should prevail when an individual is significantly affected but not clearly subject to the Authority's enforcement?"*
      *   *Question (5b - RRT Application - Limited):* *Only* if the incident involves **direct financial liability/residual risk** (e.g., liability for a specific levy, bearing the risk of default on bonds *they hold*). Does the appellant demonstrably bear the primary, uninsured, residual financial risk if the relevant decision goes wrong?
      *   *Sufficient Answer:* Contractual evidence, bond certificates, ownership documents showing liability isn't fully passed on/insured. Exclude diffuse societal risks.
      *   *Stop?* **YES** if 5a provides clear resolution (e.g., SPP prevails for voting - appeal fails). **YES** if RRT is applicable and *not* met (appeal fails). Proceed to Step 6 if RRT is met or not applicable. **HANDOFF** if 5a is unresolved or RRT applicability/result is ambiguous/normative.
      *   *Principle:* Hybrid (Conflict Resolution Norm / **RRT**). *Conflict Resolution:* Precedent/Statute > RRT (where applicable) > Handoff.

  6.  **Final Qualification & Precedent Setting:**
      *   *Question:* Based on the path taken (SPP met, AIP met & proportional, conflict resolved), does the appellant qualify for the *specific incident(s)*?
      *   *Action:* State qualification clearly per incident. Document the decisive steps and reasoning meticulously. If overturning precedent, *unanimous vote required*.
      *   *Output:* Clear "Yes/No per Incident" decision, binding precedent unless unanimous overturn.

  **Procedure Limitations & Where It Stops Being 'One':**
  1.  **Defining Core Principles:** The procedure *applies* SPP and AIP but cannot *define* their core meaning or relative weight for new situations. This requires Assembly input (Steps 3 Handoff, 5a Handoff).
  2.  **Setting Proportionality Thresholds:** Determining *how much* affected interest justifies a *specific* incident (Step 4b) is inherently value-laden. The procedure identifies the conflict but the Assembly must set the bar (Step 4b Handoff).
  3.  **Resolving Fundamental Principle Conflicts:** When SPP and AIP clash directly for an incident without precedent (Step 5a), only the Assembly can establish the priority.
  4.  **Defining "Significant Effect" for Novel Cases:** While evidence is key, judging if a *new type* of interest (e.g., data privacy, cultural heritage) is "significant" involves value judgments beyond pure fact-finding. The procedure handles established interests but flags novel ones for Assembly review (implied in Step 4).
  5.  **Assigning Residual Risk:** Deciding *who* legally/morally bears residual risk in complex structures (beyond direct contract holders) is often ambiguous and normative. The procedure limits RRT to clear cases (Step 5b).
  6.  **Temporal Boundaries (Future People):** The procedure struggles with purely future interests (e.g., those unborn). Step 2 (alive now) usually excludes them. Representing future interests requires a *structural* solution (e.g., Assembly mandate), not individual registration.
  7.  **Epistemic Limitations:** The 30-minute/paper-based constraint means complex evidence (e.g., disputed capacity) often necessitates deferral to other tribunals or requires robust default rules based on official documents.

  **Application to Cases:**

  **1. Non-Resident Landlord (British Passport, Flat, No Residency/Tax, Votes Nationally)**
  *   *Incident:* Voting in Mayoral/Assembly Elections, Petitioning, Standing to Challenge (Assume appeal seeks these).
  *   *Step 2:* Passport confirms personhood, alive, >18. Pass.
  *   *Step 3 (SPP - Subjected):*
      *   Being Bound? Owns property - YES (Bound by planning, property regs).
      *   Taxation? Pays no *local* tax (council tax paid by tenant). NO.
      *   For Voting/Standing: Not habitually resident - core SPP criterion usually unmet. **SPP Status: NO for Voting/Standing.**
  *   *Step 4 (AIP - Affected):* Significant financial interest (property value affected by planning, investment, taxes). YES. Intensity high for property value.
  *   *Step 5 (Conflict: SPP NO / AIP YES):*
      *   *5a (Conflict Resolution):* Precedent strongly favors SPP (habitual residence) for *Voting/Standing*. **Resolution: SPP Prevails.** Appeal for Voting/Standing fails.
      *   *Petitioning/Standing to Challenge:* Lower threshold. *5a:* Less clear precedent. Potential **Handoff** to Assembly: "Does significant property ownership alone justify Petitioning/Standing rights absent residency?" OR precedent might allow it on AIP grounds (less risky). *Likely Panel Decision (if precedent allows):* **YES for Petitioning/Standing to Challenge (on specific property issues). NO for Voting/Standing.** *(This may annoy you - it excludes him from the core franchise despite clear interest).*
  *   *RRT:* Not applicable to these incidents. Landlord bears property value risk, but RRT not used here.

  **2. Long-Term Resident with No-Settlement Visa (Lives/Works 14yrs, Council Tax, Kids in School)**
  *   *Incident:* Voting, Petitioning, Standing to Challenge.
  *   *Step 2:* Personhood, alive, >18 (assume). Pass.
  *   *Step 3 (SPP - Subjected):* Habitual resident (14 yrs!), pays council tax (direct liability), uses services, works locally. **SPP Status: STRONG YES for all incidents.**
  *   *Step 4/5:* Not needed. SPP met decisively.
  *   *Decision:* **Qualified for Voting, Petitioning, Standing to Challenge.** (SPP is clear and controlling).

  **7. People Born During Debt Term (Future Residents)**
  *   *Incident:* Being Bound by future rules? Taxation? Voting? (Conceptual).
  *   *Step 2:* **STOP.** Not currently alive. Factual threshold not met.
  *   *Procedure Limit:* The procedure cannot register future individuals. Representing future interests is a *structural* question for the Assembly's design (e.g., should the Assembly have a sustainability mandate?).

  **Residual Risk Test (RRT) Assessment:**
  *   **Operationalized?** Limited to **specific financial liability incidents** (Step 5b): e.g., determining who is liable for a newly-created, narrowly-targeted levy where risk of non-payment/cost-overrun falls on a specific group (e.g., landowners benefiting from an infrastructure project).
  *   **Survives Contact?** Partially, but narrowly:
      *   *Killed as General Franchise Test:* It fails for voting, standing, petitioning - core democratic incidents aren't solely about financial risk. It inherently favors landlords/creditors over tenants/workers/transient poor who bear different risks (welfare, opportunity cost, displacement).
      *   *Useful Niche:* In highly specific financial instruments or levies where residual risk is contractually defined and isolated (e.g., special assessment bonds), it *could* determine liability or perhaps a *very specific* voting right related *only* to that financial decision. It does track "who pays for a mistake" in *that specific context*. It doesn't belong in the core membership test.

  **Conclusion:** This procedure provides a structured, defensible framework for adjudicating appeals incident-by-incident, making principled choices (SPP/AIP) explicit, and identifying where value judgments necessitate Assembly input (Handoffs). It kills the RRT as a general franchise tool but finds a narrow, operational role. It cannot resolve the Assembly's core democratic dilemmas about principle weighting or novel interests – it merely forces those choices into the open for the Assembly to decide, making the "smuggling" visible. Stop pretending it's a purely factual algorithm when reaching the Handoff points; that's where politics properly begins.
