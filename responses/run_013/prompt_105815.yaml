answer: |-
  Here's my decomposed credence assessment for the Frege-Geach problem sinking expressivism, based on current philosophical debate and technical developments. My overall credence that **there is no viable expressivist account preserving compositionality without smuggling truth-apt content is 0.45**. Below is the decomposition, sensitivity analysis, and key disagreements.

  ---

  ### **Credence Decomposition**
  *(Total influence sums to 1.0)*

  1. **"Embedding Problem as Artifact" (Weight: 0.15)**  
     - *Issue:* Whether the problem presupposes truth-conditional semantics ("means the same = same truth conditions"). If expressivists reject this, the constraint dissolves.  
     - *Assessment:* Low weight. While expressivists (e.g., Gibbard, Blackburn) argue moral content is *sui generis*, most contemporary semantics assumes compositionality requires truth-aptness. Even "dynamic" semantic alternatives (e.g., using update potentials) struggle with complex embeddings.  
     - *Sub-credence:* 0.2 that this escape route succeeds.  

  2. **Higher-Order Attitudes (HOAs) for Connectives (Weight: 0.40)**  
     - *Issue:* Can negation/conditionals be analyzed as operations on attitudes (e.g., rejecting a plan, conditional commitments)?  
     - *Assessment:* Critical bottleneck. Gibbard’s planning semantics handles simple cases ("If lying is wrong, then...") but faces two gaps:  
       - **Attitude explosion:** Complex sentences require untenable mental states (e.g., "If if A then B, then C" maps to no plausible attitude).  
       - **Attitude reports:** "John believes lying is wrong" can’t be reduced to John’s attitudes without invoking propositional objects (Schroeder’s *Being For* objection).  
     - *Sub-credence:* 0.3 that HOA approaches fully resolve this.  

  3. **Generalization Beyond Toy Examples (Weight: 0.30)**  
     - *Issue:* Whether solutions scale to all embeddings (quantifiers, modals, disjunctions, belief ascriptions).  
     - *Assessment:* Moderate weight. Expressivists have extended models (e.g., Ridge’s "ecumenical expressivism"), but attitude reports and nested contexts remain problematic. No current system handles *mixed* embeddings (e.g., "If stealing is wrong, then Alice believes it") without hidden truth-aptness.  
     - *Sub-credence:* 0.25 that generalization is achieved.  

  4. **Non-Representational Logic (Weight: 0.15)**  
     - *Issue:* Can logical rules (e.g., modus ponens) apply to non-truth-apt content?  
     - *Assessment:* Lower weight. Gibbard’s norm-laden logic *almost* works, but requires ad hoc constraints to avoid explosion. Classical logic’s ties to truth preservation create pressure toward representationalism.  
     - *Sub-credence:* 0.5 that this is independently fatal.  

  ---

  ### **Overall Calculation**  
  `(0.15 × 0.2) + (0.40 × 0.3) + (0.30 × 0.25) + (0.15 × 0.5) = 0.03 + 0.12 + 0.075 + 0.075 = **0.45**`  

  ---

  ### **Sensitivity and Key Movers**  
  - **Most sensitive term: HOAs for connectives (0.40 weight)**.  
    - *Evidence to lower credence:* A formal HOA model that:  
      (a) Handles iterated conditionals without attitude proliferation.  
      (b) Reduces attitude reports (e.g., "X believes that P") to non-representational states.  
      *(No such model exists; Schroeder’s 2008 work remains a major obstacle.)*  
    - *Evidence to raise credence:* Proof that HOA approaches *must* violate compositionality (e.g., by requiring sentence meanings to shift in embedded contexts).  

  - **Other movers**:  
    - If expressivists adopt minimal truth (e.g., Blackburn’s quasi-realism), this *raises* credence to **~0.6**, as it concedes truth-aptness is inescapable.  
    - A breakthrough in dynamic semantics for normative discourse could lower credence to **~0.3**.  

  ---

  ### **Settled vs. Contested Territory**  
  - **Settled**:  
    - Expressivism *can* handle simple negations/conditionals (e.g., "Lying is not wrong" as rejecting disapproval).  
    - Pure "force-based" accounts (à la Ayer) fail; modern expressivism requires sophisticated semantics.  

  - **Genuine Disagreements**:  
    - **Optimists** (Gibbard, Ridge): HOAs + compositional norms *can* work. Logic is a tool for coordinating attitudes, not mirroring reality.  
    - **Pessimists** (Schroeder, Dreier): Expressivism either collapses into realism ("creeping minimalism") or requires unnatural mental states.  
    - **Reformists** (Chrisman): Replace expressivism with a "non-assertoric" speech-act theory that sidesteps compositionality demands.  

  ---

  ### **Conclusion**  
  At **0.45**, my credence reflects the technical ingenuity of expressivism but weights heavily the unsolved problems of attitude reports and complex embeddings. The field is divided: HOAs remain the best hope, but skeptics see them as a dead end. If you’re at 0.4, we’re aligned; I’m slightly more pessimistic due to the *generalization* gap. For major shifts, watch for work on belief ascriptions (e.g., Baker 2022) or new logics of planning (e.g., Cariani’s recent models).
