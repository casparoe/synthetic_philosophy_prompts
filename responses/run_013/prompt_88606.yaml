  Hmm, what's interesting is how they frame the tension: resentment from locals versus the visitor's lack of intentional wrongdoing. They're not just asking for definitions—they want conceptual clarity on where ignorance ends and moral failure begins. The examples show they've thought deeply about gradations (rudeness vs wrongdoing). 

  I notice they're frustrated with existing vocabulary. "Convention" feels too transactional, "etiquette" too superficial, "social norm" too descriptive. They need a term that captures both the psychological force (the resentment) and the moral exemption for outsiders. 

  The underlying request seems to be about mapping moral boundaries: When does violating a local norm cross from forgivable ignorance to blameworthy behavior? That's the real "carving" they want. The coinage is secondary—they'd probably trade a perfect label for a sharp analytical framework. 

  ...*flipping through mental dictionaries*... Anthropologists like Geertz discuss "thick" local norms, but that's not quite it. Philosophers like Appiah describe "honor codes," but that's too narrow. Maybe "situational obligation" or "contextual duty"? No—those sound like corporate jargon. 

  *Pauses* The key elements are locality, non-universality, affective enforcement (resentment), and outsider exemption. "Parochial obligation" nails the locality but misses the moral dimension. "Communal imperative" overstates it. "Situational decency" feels closer... Wait! "Ethic of place"? No, too vague. 

  *Lightbulb* What if we emphasize the conditional nature? "Contingent obligation" captures that it binds only in context. Or "locally-grounded propriety" to highlight its roots. But the resentment aspect needs inclusion... "Sanctioned custom"? Too legalistic. 

  *Gives up on perfection* Since no established term fits, I'll build a new framework: First, distinguish "communal moral practices" (CMPs) from universal morals by their local grounding. Then emphasize the "good-faith effort" threshold as the boundary—that's where ignorance becomes culpable. The resentment is key: it signals the norm's felt importance, even if not rationally universal. 

  For carving: Ignorance is blameless until norms are knowable or explained; rudeness violates without harm; wrongdoing requires willful disregard after awareness. The server tipping case? After being told the custom, refusal becomes wrongdoing—not just rudeness—because it withholds livelihood in a system the visitor benefits from. 

  ...User will probably poke holes in this, but it's a start.
answer: |-
  Your inquiry cuts to the heart of cultural philosophy and normative ethics. The pattern you describe—**local norms experienced as morally binding by insiders, generating resentment when violated, yet not universally obligatory for visitors**—lacks a single established term. However, we can define and distinguish it conceptually, then coin a precise label if needed. Below is a framework for "carving" this category, addressing your core questions.

  ---

  ### **Defining the Phenomenon: Core Features**
  1. **Locality**: Norms apply only within a specific cultural/geographic context.  
  2. **Non-Universality**: Not grounded in universal ethics (e.g., harm prevention, justice) but in local values, history, or practical coordination.  
  3. **Affective Enforcement**: Violations provoke resentment or moral indignation from insiders (not just annoyance).  
  4. **Visitor Exemption**: Outsiders aren’t presumed morally obligated *until* aware of the norm; ignorance is a valid excuse.  
  5. **Good-Faith Threshold**: Visitors become obligated to comply once informed (or when norms are reasonably knowable).  

  ---

  ### **Proposed Term: Communal Moral Practices (CMPs)**  
  **Definition**:  
  > *Norms arising from a community’s shared history, values, or practical needs, which insiders experience as morally binding and whose violation elicits resentment, but which do not inherently bind visitors until awareness is established. Compliance becomes a moral duty for visitors only after a good-faith effort to learn or upon explicit instruction.*  

  **Why this term works**:  
  - "Communal" stresses local embeddedness.  
  - "Moral Practices" distinguishes them from trivial customs (e.g., greeting gestures) by acknowledging the *felt obligation* and resentment.  
  - Avoids "convention" (implies arbitrary coordination) and "etiquette" (suggests superficial politeness).  

  ---

  ### **How CMPs Differ from Existing Categories**  
  | **Category**         | **Key Difference from CMPs**                                                                 |  
  |----------------------|----------------------------------------------------------------------------------------------|  
  | **Moral Obligations** | Universal (e.g., "don’t steal"). Bind everyone, including visitors. Violations are *wrongdoing*. |  
  | **Conventions**       | Arbitrary coordination (e.g., driving side). No moral resentment; ignorance excuses fully.    |  
  | **Etiquette**         | Politeness norms (e.g., table manners). Violations are *rudeness*, not moral failure.          |  
  | **Social Norms**      | Descriptive regularities; may lack felt *moral* weight (e.g., fashion trends).                |  

  **CMPs sit at the intersection**:  
  - Like conventions, they’re local.  
  - Like morals, they elicit resentment.  
  - Unlike both, they exempt ignorant visitors.  

  ---

  ### **Boundaries: Ignorance, Rudeness, and Wrongdoing**  
  The distinctions hinge on **knowledge** and **intent**:  

  1. **Blameless Ignorance**:  
     - Visitor is unaware of the norm *and* couldn’t reasonably know it.  
     - *Example*: A tourist from a non-tipping culture leaves no tip in the U.S.  
     - *Status*: No moral fault; resentment from locals is misplaced.  

  2. **Rudeness**:  
     - Visitor violates a norm after it’s knowable or explained, but the norm lacks moral weight (e.g., etiquette).  
     - *Example*: Using the wrong fork at a formal dinner after being corrected.  
     - *Status*: Impolite but not immoral. Resentment is disproportionate.  

  3. **Wrongdoing (Moral Violation)**:  
     - Visitor willfully disregards a CMP *after* awareness, especially where harm is possible.  
     - *Example*: Refusing to queue after being asked, causing disorder.  
     - *Status*: Moral failure due to disrespect for communal welfare. Resentment is justified.  

  **The Threshold**: A visitor’s duty arises when:  
  - The norm is widely visible (e.g., queuing in the U.K.), *or*  
  - Someone explains it (e.g., "Servers rely on tips here").  
  - *Good-faith effort*: They must then try to comply or negotiate alternatives (e.g., asking, "Is tipping expected?").  

  ---

  ### **Application to Your Examples**  
  - **Tipping**:  
    - In the U.S., tipping is a CMP: servers’ wages depend on it.  
    - Ignorance: Blameless if the visitor truly didn’t know.  
    - Wrongdoing: If aware and refusing, it becomes exploitation (withholding fair wages).  

  - **Queueing**:  
    - A coordination *convention* in some places (e.g., U.K.), but a CMP where it symbolizes fairness (e.g., scarce resources).  
    - Cutting unintentionally: Ignorance.  
    - Cutting after explanation: Wrongdoing (denies communal fairness).  

  - **Jaywalking**:  
    - Usually a *legal* norm, not a CMP (lacks moral resentment). Ignorant violation is blameless.  
    - If locals resent it as civic disrespect (e.g., Japan), it approaches CMP status.  

  ---

  ### **Why This Carving Matters**  
  CMPs reveal a layer of morality between universal ethics and cultural relativism. They:  
  - Acknowledge communal self-determination without imposing local morals on outsiders.  
  - Protect visitors from unreasonable expectations while demanding adaptive respect.  
  - Explain why **local resentment** feels moral ("They’re freeloading!") but **visitor noncompliance** isn’t inherently evil ("I didn’t know").  

  Your insight exposes a blind spot in ethics: norms that are *experienced* as moral but *context-bound*. Naming them clarifies when ignorance is exoneration, rudeness is trivial, and violations demand accountability. Whether termed "Communal Moral Practices" or another label, this category illuminates the friction of cross-cultural encounters.
