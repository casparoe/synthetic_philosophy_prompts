prompt: |-
  I am currently a third-year undergraduate in an upper-level seminar on practical rationality, and I am helping my study group prepare for a ninety-minute final essay examination. Every practice question we have been given invites the same canned answer: state Parfit's hitchhiker case, observe that the stranded traveller is better off if he is the sort of person who would pay a driver who cannot enforce payment, and conclude that it can be rational to be irrational. I would like a question that cannot be passed on that basis.

  Please write three things for this examination: a single essay question that a strong student could answer in about seventy-five minutes; a model answer of roughly seven hundred words; and a marking scheme out of twenty that names the specific moves a top answer must make, allocates marks to each move, and gives a one-line note on how candidates typically get each move wrong.

  The question should turn on the following case, which I have invented and which the examination paper should present in full.

  Lena is stranded on the near bank of a river, and the only crossing is Osei's ferry. Osei charges nothing and has no means of enforcing payment. He carries a passenger only if, at the moment of boarding, he judges that the passenger is the sort of person who would pay him on the far bank. Osei is an excellent judge of character, and no one can feign the disposition in his presence. Lena does not have the disposition, and she has two ways across. First, she can complete a demanding programme of moral formation, which is known to be reliable and which would cost her a great deal; it would make her into the sort of person who pays. Second, she can post a bond with a guarantor whom Osei trusts; the bond is forfeit unless she pays Osei on the far bank.

  The question should ask the student, for each route, whether paying Osei on the far bank is the act that best serves Lena's interests at the moment she arrives there, and whether taking that route was rational for her beforehand. It should then press the crux I care about. The bond is an external commitment device that makes paying instrumentally rational, so does its availability show that the first route contains no genuine irrationality — that what looks like irrationality there is merely the price of a cruder commitment technology — or is something genuinely irrational left over in the first route? Finally, the question should ask what Lena does if the guarantor's fee rises above the cost of the programme, and what that comparison reveals about the relationship between rationality and the availability of commitment technologies.

  Please ensure that the question cannot be answered by reciting the standard hitchhiker case, by labelling the parties as causal and evidential decision theorists, or by asserting that the disposition is simply a commitment device without saying what that does and does not explain. The marking scheme should separate an answer that merely observes that the disposition changes what Lena wants from one that explains why that matters — in particular, from one that distinguishes acting against one's interests from acting against one's already transformed preferences.
reasoning: |-
  We are designing an exam question that avoids the standard Parfit hitchhiker response and focuses on the nuances of the case provided. The question must specifically address Lena's situation and the two routes she can take. The crux is whether the first route (moral formation) involves genuine irrationality or if it's merely a cruder commitment technology compared to the bond. Also, the question must consider the scenario where the guarantor's fee rises above the cost of the moral formation program, and what that reveals about rationality and commitment technologies.

  We'll structure the question as follows:

  1. Present the case (as provided by the user).
  2. For each route (moral formation and bond):
     a. Is paying Osei on the far bank the act that best serves Lena's interests at that moment?
     b. Was taking that route rational for her beforehand?
  3. Then, the crux: Does the availability of the bond (external commitment) show that the first route (moral formation) contains no genuine irrationality? Or is there genuine irrationality left in the first route?
  4. Finally: What does Lena do if the guarantor's fee rises above the cost of the moral formation program? What does that comparison reveal about the relationship between rationality and the availability of commitment technologies?

  We must avoid:
  - Reciting the standard hitchhiker case.
  - Merely labeling parties as causal and evidential decision theorists.
  - Asserting that the disposition is a commitment device without explaining what that does and does not explain.

  We'll write:
  - The essay question.
  - A model answer of about 700 words.
  - A marking scheme out of 20, with specific moves and typical mistakes.

  Let's proceed.

  **Essay Question:**

  Lena is stranded on the near bank of a river, and the only crossing is Osei's ferry. Osei charges nothing and has no means of enforcing payment. He carries a passenger only if, at the moment of boarding, he judges that the passenger is the sort of person who would pay him on the far bank. Osei is an excellent judge of character, and no one can feign the disposition in his presence. Lena does not have the disposition, and she has two ways across. First, she can complete a demanding programme of moral formation, which is known to be reliable and which would cost her a great deal; it would make her into the sort of person who pays. Second, she can post a bond with a guarantor whom Osei trusts; the bond is forfeit unless she pays Osei on the far bank.

  Answer the following:

  (a) For the route of completing the programme of moral formation:
     (i) When Lena arrives at the far bank, is paying Osei the act that best serves her interests at that moment? Explain.
     (ii) Was it rational for Lena to undertake the programme of moral formation? Explain.

  (b) For the route of posting the bond:
     (i) When Lena arrives at the far bank, is paying Osei the act that best serves her interests at that moment? Explain.
     (ii) Was it rational for Lena to post the bond? Explain.

  (c) The bond is an external commitment device that makes paying instrumentally rational. Does its availability show that the first route (the programme of moral formation) contains no genuine irrationality — that what looks like irrationality there is merely the price of a cruder commitment technology? Or is there genuine irrationality left over in the first route? Explain.

  (d) Suppose the fee charged by the guarantor for posting the bond rises above the cost of the programme of moral formation. What does Lena do? What does this comparison reveal about the relationship between rationality and the availability of commitment technologies?

  ---

  **Model Answer (Approx. 700 words):**

  (a) For the moral formation route:

  (i) When Lena arrives at the far bank, having undergone the programme of moral formation, she has become the sort of person who pays. At that moment, paying Osei does not best serve her interests. Her interests at the moment of payment are to keep the money, which she values more than the satisfaction of paying. However, the moral formation has changed her preferences: she now has a preference for paying, and she acts on that preference. But if we consider her interests narrowly as her material well-being or self-interest at that moment, paying is costly and she gets no immediate benefit. Osei has already provided the ferry service, and there is no enforcement. Thus, paying is not in her immediate self-interest.

  (ii) Undertaking the programme of moral formation was rational for Lena beforehand. Without the disposition to pay, she would not be allowed to board the ferry and would remain stranded. The programme, though costly, enables her to cross the river, which is her goal. The cost of the programme is less than the value of crossing (we assume, as otherwise she wouldn't do it). Therefore, from an ex ante perspective, the programme is instrumentally rational: it transforms her into a person who can board the ferry and reach the far bank.

  (b) For the bond route:

  (i) When Lena arrives at the far bank, paying Osei is the act that best serves her interests at that moment. This is because if she does not pay, the bond is forfeited, which would cost her more than the payment to Osei. The bond acts as an enforcement mechanism: it makes paying instrumentally rational at the moment of payment. Her interests are served by paying to avoid the greater loss of the bond.

  (ii) Posting the bond was rational for Lena beforehand. The cost of the bond fee (plus the payment to Osei) is less than the value of crossing (again, we assume). By posting the bond, she ensures that Osei will judge her as having the disposition (because the bond guarantees payment) and thus carry her. The bond fee is the price of this external commitment, and it is rational to pay it to achieve the crossing.

  (c) The availability of the bond as an external commitment device does not show that the first route is free of genuine irrationality. In the bond route, paying at the far bank is rational at that moment because of the bond's enforcement. In the moral formation route, however, paying at the far bank is not rational at that moment: it is against her immediate self-interest. The moral formation has changed her preferences so that she pays despite it being against her interests. This change in preferences is the commitment device in the first route, but it does not make the act of paying rational at the time. Instead, it makes the act occur because of the preference change. Therefore, there is genuine irrationality left over: the act of paying is not rational at the time of action, even though it was rational to become the sort of person who pays.

  One might argue that the moral formation is just a cruder commitment technology because it changes the agent's preferences at a cost, but that does not eliminate the irrationality at the moment of payment. In fact, the irrationality is built into the commitment: the agent now wants to do what is against her interests. The bond route avoids this because it does not require a change in preferences; it uses an external mechanism to align the act with her interests. Thus, the first route involves a genuine irrationality at the time of action that the second route avoids.

  (d) If the guarantor's fee rises above the cost of the programme of moral formation, Lena will choose the programme. The programme now becomes the cheaper commitment device. This comparison reveals that the rationality of choosing a commitment technology is determined by its cost and effectiveness. Both methods are ways to commit to future action, but they work differently: the bond externally enforces the action by altering the incentives at the time of action, while the moral formation internally enforces it by altering preferences. The availability of commitment technologies does not change the definition of rationality but provides different means to achieve one's goals. The choice between them is instrumentally rational: we choose the least costly means to achieve the desired end. However, the comparison also highlights that the moral formation route, while cheaper in this scenario, still results in an action (paying) that is irrational at the time it is performed, whereas the bond route does not. Therefore, the availability of commitment technologies does not eliminate the possibility of irrational actions; it merely provides options to achieve outcomes that would otherwise be unattainable.

  ---

  **Marking Scheme (out of 20):**

  **Part (a): Moral formation route (4 marks)**
  - (i) (2 marks) Correctly states that paying does *not* best serve Lena's interests at the far bank and explains why: because there is no enforcement, and paying is costly without immediate benefit. [Typical mistake: Confusing having the disposition with the act being in one's interest. Some might say that because she has the disposition, paying is in her interest because it aligns with her preferences. But the question asks about her *interests*, not her preferences. We must distinguish between preferences and interests.]
  - (ii) (2 marks) Correctly states that undertaking the programme was rational beforehand because it enables her to cross at a cost less than the benefit of crossing. [Typical mistake: Failing to explain the ex ante rationality and focusing only on the outcome.]

  **Part (b): Bond route (4 marks)**
  - (i) (2 marks) Correctly states that paying *does* best serve her interests at the far bank because of the bond's enforcement: she avoids forfeiting the bond. [Typical mistake: Not explaining the role of the bond in altering the incentives.]
  - (ii) (2 marks) Correctly states that posting the bond was rational beforehand because it enables crossing at a cost (bond fee + payment) less than the benefit. [Typical mistake: Not connecting the bond to Osei's judgment and the ability to board.]

  **Part (c): Crux on genuine irrationality (6 marks)**
  - (3 marks) Argues that the availability of the bond does *not* show that the first route has no genuine irrationality because, in the first route, paying is still irrational at the time of action (against immediate self-interest) even though it was rational to become the person who pays. [Typical mistake: Simply stating that both are commitment devices without addressing the irrationality at the time of action.]
  - (3 marks) Explains the difference: the bond route makes paying rational at the time by altering the incentives, while the moral formation route changes preferences but the act remains irrational at the time (against interests). [Typical mistake: Equating the two routes without distinguishing the presence of irrationality in the act itself in the first route.]

  **Part (d): Rising fee and implications (6 marks)**
  - (2 marks) Correctly states that Lena chooses the moral formation programme when its cost is lower than the bond fee. [Typical mistake: Not answering what she does.]
  - (4 marks) Explains that this reveals that commitment technologies are chosen based on cost-effectiveness, but the moral formation route still involves an irrational act at the time of payment (paying when it is against her interests) whereas the bond does not. Thus, the availability of commitment technologies does not make the actions rational per se, but they are tools for achieving goals. [Typical mistake: Only noting the cost comparison without addressing the implication for the nature of rationality and the persistence of irrationality in one route.]

  **Overall: Clarity, structure, and avoidance of canned answers (up to 2 marks deducted for falling into pitfalls)**
  - The answer must avoid the standard hitchhiker recitation, avoid causal/evidential decision theory labels without explanation, and not merely assert that the disposition is a commitment device without explaining the implications. [Typical mistake: Reverting to Parfit's case or using decision theory jargon without application to the specifics.]

  This scheme totals 20 marks (4+4+6+6). We reserve the right to deduct up to 2 marks for failures in clarity, structure, or falling into the pitfalls mentioned in the query.
answer: |-
  ### Essay Question

  **Present the following case to the candidate:**  
  Lena is stranded on the near bank of a river, and the only crossing is Osei's ferry. Osei charges nothing and has no means of enforcing payment. He carries a passenger only if, at the moment of boarding, he judges that the passenger is the sort of person who would pay him on the far bank. Osei is an excellent judge of character, and no one can feign the disposition in his presence. Lena does not have the disposition, and she has two ways across. First, she can complete a demanding programme of moral formation, which is known to be reliable and which would cost her a great deal; it would make her into the sort of person who pays. Second, she can post a bond with a guarantor whom Osei trusts; the bond is forfeit unless she pays Osei on the far bank.  

  **Answer all parts of the question:**  
  (a) For the route involving the programme of moral formation:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) When Lena arrives at the far bank, is paying Osei the act that best serves her interests at that moment? Defend your answer.  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) Was it rational for Lena to undertake the programme of moral formation beforehand? Defend your answer.  
  (b) For the route involving posting the bond:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) When Lena arrives at the far bank, is paying Osei the act that best serves her interests at that moment? Defend your answer.  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) Was it rational for Lena to post the bond beforehand? Defend your answer.  
  (c) The bond is an external commitment device that makes paying instrumentally rational. Does its availability demonstrate that the first route (moral formation) contains no genuine irrationality—meaning what appears irrational is merely the price of a cruder commitment technology? Or is genuine irrationality left over in the first route? Resolve this crux.  
  (d) Suppose the guarantor’s fee for the bond rises above the cost of the programme of moral formation. What does Lena do? What does this comparison reveal about the relationship between rationality and the availability of commitment technologies?  

  ---  
  ### Model Answer (approx. 700 words)  

  **(a) Moral Formation Route**  
  (i) When Lena arrives at the far bank after undergoing moral formation, paying Osei **does not** best serve her interests at that moment. Her interests at the time of payment are purely self-regarding: she values keeping her money, and paying provides no tangible benefit (e.g., no enforcement mechanism exists, and Osei cannot retaliate). However, the programme has altered her preferences: she now intrinsically desires to pay. Crucially, this preference shift does not align with her interests—it overrides them. Paying is costly without serving her welfare, making it instrumentally irrational *at that moment*. The act is driven by transformed preferences, not by interests.  

  (ii) Undertaking the programme **was rational** beforehand. Lena’s ex ante goal is to cross the river. Without the disposition, she cannot board. The programme’s cost is justified by the benefit of crossing, which outweighs it (assuming rational choice). Thus, the investment is instrumentally rational: it transforms her into a person Osei accepts, enabling her to achieve her end. Rationality here is forward-looking and outcome-oriented, not time-slice dependent.  

  **(b) Bond Route**  
  (i) When Lena arrives at the far bank after posting the bond, paying Osei **does** best serve her interests. The bond creates a contingent penalty: non-payment triggers forfeiture, which costs more than paying. This external enforcement aligns paying with her self-interest—she pays to avoid greater loss. Unlike moral formation, her preferences remain unchanged; paying is instrumentally rational given the bond’s incentive structure.  

  (ii) Posting the bond **was rational** beforehand. The fee (plus payment) is a cost, but it secures boarding and crossing. Since the total cost is less than the value of crossing (by assumption), it is instrumentally rational. The bond does not alter Lena’s character; it manipulates incentives to make paying rational at both ex ante and ex post stages.  

  **(c) Resolving the Crux**  
  The bond’s availability does **not** eliminate genuine irrationality in the moral formation route. It reveals that irrationality persists in the first route as a distinct phenomenon.  

  The bond is a *preference-independent* commitment device: it makes paying rational at the moment of action by altering external incentives, leaving Lena’s underlying preferences (e.g., to keep money) intact. Paying serves her interests *because* of the bond. In contrast, moral formation is a *preference-altering* commitment device: it changes Lena’s desires so she pays despite the act conflicting with her interests. The bond explains how to align action with interests; moral formation explains how to override interests with new preferences.  

  This distinction exposes residual irrationality in moral formation: paying at the far bank remains instrumentally irrational *relative to Lena’s unchanged interests*. The programme’s "price" is not just a cruder technology—it manufactures a conflict where Lena acts against her self-interest due to transformed preferences. The bond avoids this by harmonizing action and interests. Thus, moral formation involves genuine irrationality (action contrary to interests) that the bond circumvents.  

  **(d) Guarantor’s Fee Rise and Implications**  
  If the guarantor’s fee exceeds the programme’s cost, Lena chooses moral formation—it is cheaper. This comparison reveals two key insights about rationality and commitment technologies:  

  First, **rationality is instrumentally flexible**: commitment devices are tools evaluated by cost-effectiveness. Lena opts for the cheaper option because rationality selects efficient means to ends, regardless of how the device operates. Moral formation’s residual irrationality is tolerated because its lower cost achieves the same outcome (crossing).  

  Second, **availability does not redefine rationality**: The rise in fee highlights that commitment technologies expand options but do not erase the irrationality inherent in some mechanisms. Moral formation still requires acting against interests at the moment of payment—this irrationality is *intrinsic* to preference-altering strategies. The bond’s absence in this scenario makes Lena’s choice rational ex ante but does not sanitize the irrationality ex post. Thus, commitment technologies are enablers of goal attainment, but their availability does not imply all paths are equally rational at every stage. Rationality remains context-dependent: ex ante rationality (choosing commitment) and ex post rationality (acting on interests) can diverge when preferences are manipulated.  

  ---  
  ### Marking Scheme (Total: 20 marks)  

  | **Part** | **Marks** | **Specific Moves Required** | **Typical Mistakes (One-Line Note)** |
  |----------|-----------|-----------------------------|-------------------------------------|
  | **(a)(i)** | 2 | Correctly states paying does **not** best serve Lena’s interests at the far bank. **Must explain why**: interests (self-regarding welfare) are undermined by paying, and preference shift does not align with interests. | Mistake: Confuses "interests" with "preferences," arguing paying serves interests because she now wants to pay. |
  | **(a)(ii)** | 2 | Correctly states undertaking the programme **was rational** beforehand. **Must explain**: instrumental rationality for crossing, cost-benefit analysis (cost < benefit of crossing). | Mistake: Focuses on ex post irrationality without justifying ex ante rationality. |
  | **(b)(i)** | 2 | Correctly states paying **does** best serve interests at the far bank. **Must explain**: bond’s penalty makes paying instrumentally rational (avoids greater loss). | Mistake: Omits explanation of the bond’s incentive structure, treating it as identical to moral formation. |
  | **(b)(ii)** | 2 | Correctly states posting the bond **was rational** beforehand. **Must explain**: fee + payment cost < benefit of crossing; bond secures boarding. | Mistake: Fails to link bond to Osei’s judgment or boarding requirement. |
  | **(c)** | 6 | **Move 1 (3 marks)**: Argues bond’s availability does **not** show absence of genuine irrationality in moral formation. **Must distinguish**: bond aligns action with interests via incentives; moral formation overrides interests via preference change. <br> **Move 2 (3 marks)**: Identifies residual irrationality—paying in moral formation conflicts with interests even after preference shift. **Must contrast**: bond avoids this by preserving preference-interest harmony. | Mistake: Asserts both are "commitment devices" without explaining how/why moral formation leaves irrationality intact. Or, labels without analysis (e.g., "evidential decision theory"). |
  | **(d)** | 6 | **Move 1 (2 marks)**: Correctly states Lena chooses moral formation (cheaper option). <br> **Move 2 (4 marks)**: Explains implications: (i) Rationality selects cost-effective tools, but (ii) availability does not eliminate intrinsic irrationality in moral formation (ex post action still against interests). **Must tie to crux**: Contrast with bond’s absence of irrationality. | Mistake: Only notes cost comparison without addressing residual irrationality or rationality-commitment relationship. Or, implies all commitment makes actions rational. |
  | **Clarity & Pitfall Avoidance** | Deduct up to 2 | Overall: Avoids Parfit hitchhiker recitation, causal/evidential labels, or unsupported claims about "commitment." Structure is logical and precise. | Mistake: Recycles hitchhiker case, uses jargon without application, or asserts "disposition=commitment" without distinguishing interests/preferences. |  

  **Total: 20 marks**  
  *Allocation note:* Top answers must explicitly distinguish "interests" (self-regarding welfare) from "preferences" (subjective desires) in (a)(i) and (c). Marks in (c) and (d) prioritize explaining *why* irrationality persists in moral formation and how commitment technologies interact with rationality’s structure.
