prompt: |-
  I convene a graduate seminar on laws of nature, and I want to set an exercise that forces my students past the standard taxonomy and into the places where the Humean and anti-Humean positions actually pinch. I should like you to attempt it.

  Suppose David Hume were restored to us and given time to read the contemporary literature on laws of nature. He is then interrogated. I want your best reconstruction of how he would respond — not a summary of what the Humean tradition has since said, but a genuine prediction about Hume himself, defended from his own settled commitments rather than from his reputation.

  Address these, in whatever order best serves the argument:

  First, the best-system account of lawhood, on which the laws are the theorems (or axioms) of that deductive systematisation of the occurrent facts which best balances simplicity and strength. Would Hume greet this as the natural flowering of his own view, or would he resist the suggestion that the systematisation, rather than the regularities themselves, is what confers lawhood? Press him on whether the balance is discovered or imposed.

  Second, Humean supervenience — the thesis that all there is supervenes on the spatiotemporal arrangement of local, intrinsic, point-sized qualities. This is the crux. Entanglement and other features of contemporary physics make it doubtful that the world decomposes into separable local matters of particular fact. Would Hume surrender the supervenience thesis, or relocate the laws into the supervenience base, or dig in? Say which, and why.

  Third, the necessitarian programmes that place a real relation of necessitation among universals, and the dispositional-essentialist programmes that locate modality in the essences of properties. Would Hume regard these as genuine discoveries about the world, or as precisely the projection of felt compulsion onto nature that he spent his career dissolving? What would he make of the claim that he simply lacked the conceptual resources to see the necessity that is there?

  Fourth, the distinction between laws that govern and laws that merely describe. Where would he place himself, and would he think the distinction marks anything real?

  Now a complication you must handle rather than ignore. There is a scholarly reading — the so-called New Hume — on which Hume was a sceptical realist about causal necessity, holding that there are real necessary connections in nature to which our idea of necessity is an inadequate response, even if we cannot know them. If that reading is right, my prediction exercise changes shape. Tell me how, and whether the evidence for it should move your verdict.

  Throughout, distinguish what is extrapolation from Hume's actual commitments — his empiricism, his account of custom and habit, his denial that we perceive any necessary connexion, his separability intuitions — from what is invention on your part. Flag at least two or three questions on which his texts genuinely underdetermine the answer, and say what further evidence would settle them. I do not want a bibliography or a list of secondary sources; I want the reasoning.

  Begin with your bottom line in a single sentence — whether Hume would recognise himself in the modern Humean label, and where he would part company — and then give the supporting reasoning, with no preamble and no restatement of my question.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a graduate seminar exercise to push students beyond standard taxonomies in the philosophy of laws of nature. They want me to simulate how Hume himself would react to contemporary debates, not just summarize modern Humeanism.

  First, I need to consider Hume's core principles: his empiricism, skepticism about necessary connections, and ideas about custom and habit. The key is to anchor every prediction in these commitments rather than later interpretations.

  For the best-system account, Hume would likely reject the idea that systematization confers lawhood. He'd see simplicity-strength balance as a human cognitive imposition, not a discovered feature of reality. The underdetermined question here is whether he'd consider such systematization useful despite being projective.

  On Humean supervenience, entanglement poses a serious challenge. Given Hume's separability principle, he'd probably abandon strict local supervenience rather than relocate laws into the base. Physics' non-separability would force him to adjust, though he might preserve methodological separability. The evidence gap is whether his separability was ontological or epistemological.

  For anti-Humean necessitarianism, Hume would unequivocally see them as projections of psychological compulsion. His denial of perceived necessary connections directly contradicts claims about discovering modality in universals or essences. The underdetermined aspect is how he'd engage with sophisticated versions using contemporary metaphysics.

  Regarding governing vs descriptive laws, he'd firmly place himself in the descriptive camp and deny the distinction marks anything real. Laws for him are regularities we describe, not entities that govern.

  The New Hume reading complicates things. If Hume were a skeptical realist, he might accommodate some anti-Humean elements. But textual evidence from the Treatise and Enquiry suggests he'd reject this - his arguments target the very concept of necessary connection, not just our knowledge of it. The key passage is Enquiry §7 where he calls necessity "but an internal impression".

  Throughout, I must flag where interpretations diverge: notably on whether his separability principle allows exceptions, and how he'd view structural properties in physics. These would require examining his treatment of mathematics and geometry.

  The bottom line is that Hume would recognize the spirit of his project in Humeanism but reject its formalizations as reifications of psychological habits, particularly regarding systematization and supervenience. He'd remain fundamentally opposed to any form of necessitarianism.
answer: |-
  **Bottom line:** Hume would recognize the *impulse* behind "Humean" positions but reject their metaphysical reification of systematization and supervenience, viewing them as sophisticated projections of human cognitive habits, while remaining utterly dismissive of necessitarianism; he would part company decisively on the reality of "best systems," the viability of strict Humean supervenience given non-separable physics, and the very coherence of "governing" laws.

  **Reasoning:**

  1.  **Best-System Account: Projection, Not Discovery.** Hume would reject the idea that lawhood is *conferred* by the systematization itself. His core commitment is that our idea of "law" (or "cause") arises *entirely* from the constant conjunction of events and the consequent feeling of expectation (custom). The "best system" is a refined *description*, a product of human ingenuity seeking predictive efficiency and intellectual satisfaction. Its "balance" (simplicity/strength) is manifestly *imposed* by our cognitive preferences and limitations, not discovered as a feature of the world. Hume would see this as a *natural extension* of his view on how we *arrive* at beliefs about regularity, but he would vehemently resist elevating the systematization to the status of a *metaphysical ground* for lawhood. Lawhood, for Hume, resides *only* in the observed regularities and the psychological propensity they induce; the systematization is a useful tool, a sophisticated expression of custom, not a truth-maker. He would ask: "Does the world *care* about the elegance of *your* description? Or are you merely finding new ways to codify the habits of expectation my ‘constant conjunction’ produces?"

  2.  **Humean Supervenience: Retreat from Strict Localism.** Faced with entanglement and non-separability, Hume's *empiricism* and fidelity to *observed phenomena* would compel him to surrender the strict thesis of local supervenience. His separability principle ("what is distinguishable is separable") was rooted in an epistemology tied to perception and imagination. If physics demonstrates fundamental inseparability – phenomena where the state of the whole *cannot* be reduced to point-local intrinsic properties – Hume would accept this as a fact about how the world presents itself. He would *not* relocate laws into the base; laws, for him, are *descriptions* of regularities, not additional ontological ingredients. To "relocate" them would be to grant them the kind of independent existence he denied. He might *dig in* on a *methodological* level, insisting science must still *describe* the phenomena (even if holistic) in terms of observable patterns without invoking occult powers. But ontologically, the base would have to expand to include the non-separable states *themselves* as fundamental features of the "arrangements" (though he'd resist reifying "states" as more than complexes of qualities). His commitment was to explaining everything without "occult qualities," not to a specific, outdated *atomistic picture* of the base. The phenomena rule.

  3.  **Necessitarianism/Dispositional Essentialism: Projection Confirmed.** Hume would regard these programmes as *precisely* the kind of "projection of felt compulsion onto nature" he diagnosed. His core argument wasn't merely that we *don't perceive* necessary connections, but that the *very idea* of such a connection, distinct from constant conjunction and the feeling of determination, is *incoherent* and arises solely from that feeling (Treatise 1.3.14; Enquiry §7). Claims about "real relations of necessitation among universals" or "modality in the essences of properties" would strike him as empty metaphysical speculation, devoid of empirical content and demonstrably derived from the psychological compulsion (custom) he identified. The claim that he "lacked the conceptual resources" would be met with derision: he would argue these "resources" are *fictions* generated by the mind's tendency to project its internal impressions. Dispositional essentialism, by grounding modality in properties *prior* to their manifestation, would be seen as reintroducing the very occult powers ("secret powers") his philosophy sought to banish. For Hume, necessity is *always* posterior to observed regularity and the psychological habit it creates, never prior.

  4.  **Governing vs. Descriptive Laws: No Real Distinction.** Hume would unequivocally place himself in the "merely describe" camp and deny the distinction marks anything real. The notion of laws "governing" implies an active, necessitating force distinct from the regularities themselves – precisely the kind of occult power he rejected. Law-statements are summaries of observed constant conjunctions and projections based on custom. Nothing "makes" the future conform to past regularities except the (contingent) fact that it *has* done so, and the psychological mechanism of expectation. To talk of governance is, for Hume, to lapse into the very anthropomorphic projection he critiqued. There is only description of patterns and the habits of mind they induce.

  **Handling the New Hume:** The "New Hume" (sceptical realist) reading posits Hume believed in *unknowable* necessary connections. If correct, this *would* significantly alter the prediction:
  *   On **Necessitarianism/Dispositional Essentialism:** He *might* see them as flawed *attempts* to characterize the real necessity he believes exists but cannot be known. He wouldn't endorse their specific accounts (as they claim knowledge), but might see them as pointing towards the *existence* of something beyond constant conjunction. He would *not* view them as mere projections, but as (mistakenly confident) speculations about an inaccessible reality.
  *   On **Governing Laws:** He *might* grant that the distinction *could* mark something real – the real necessity *might* be what "governs," though we can never know its nature. He wouldn't endorse specific governing-law theories, but the *possibility* of governance wouldn't be dismissed as incoherent projection.
  *   On **Best-System/Supervenience:** The impact is less direct. He might still see systematization as human-imposed, and supervenience might be complicated by unknowable necessary connections potentially adding non-supervenient structure. However, his core empiricism about *what we can know and meaningfully talk about* would likely lead him to reject "best systems" as conferring lawhood and to base supervenience on the *knowable* phenomena (which physics shows is non-separable).

  **Evidence Against New Hume:** The textual evidence strongly favors the traditional (projectivist) reading. Hume consistently argues that the *idea* of necessary connection *arises from* the feeling of determination (custom), not from any perception of the world (e.g., Enquiry §7: "the necessary connexion… is… but an internal impression of the mind"). His critique targets the *intelligibility* of the concept, not just our knowledge of it. Statements like "we have no idea of [necessary connexion] distinct from that of constant conjunction" (Treatise Abstract) suggest he denies the *coherence* of the concept beyond the psychological projection. The New Hume relies heavily on nuanced interpretations of scattered phrases (e.g., "secret powers") which, in context, seem more like rhetorical concessions than affirmations of belief. **Therefore, the prediction above stands, rejecting the New Hume reading as less textually justified.**

  **Underdetermined Questions & Needed Evidence:**
  1.  **Degree of Commitment to Separability:** Did Hume see separability as an *absolute metaphysical principle* or primarily as an *epistemological guideline* derived from how we perceive distinct objects? (Texts: Treatise 1.1.7, 1.3.3, 1.4.5). Evidence: A clear statement linking separability directly to the nature of existence itself, rather than just to imagination/perception.
  2.  **Status of Structural/Relational Properties:** Would Hume allow fundamental, irreducible relational or structural properties in the supervenience base if physics demanded it, or would he insist on reducing everything to local *intrinsic* qualities? (Texts: Discussions of space, time, identity, abstract ideas). Evidence: His treatment of geometry/mathematics and whether he saw relations as purely mental or grounded in non-intrinsic features of impressions.
  3.  **Response to Non-Objectivity of Simplicity/Strength:** How would Hume specifically argue against the claim that the "bestness" of a system reflects an objective feature of the world, given the demonstrable context-dependence and pragmatic nature of these virtues? (Texts: Discussions of reason, custom, standards of taste). Evidence: Explicit discussion of whether criteria like simplicity are discovered in nature or imposed by the mind for understanding.
