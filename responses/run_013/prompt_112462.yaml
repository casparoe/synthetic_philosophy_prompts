answer: |-
  Below is a decision tree designed to pinpoint exactly where you and your friend diverge on when composition (parts forming a whole) occurs. Each branch is a concrete case you can answer "yes" or "no" to without knowing the philosophical positions they lead to. **Leaves are named positions**, and I've flagged where the tree can't separate certain views or where positions might be merged due to limitations in the tree or the views themselves. The tree also identifies answer-combinations that likely have no adherents and why.

  ---

  ### **Decision Tree: When Do Parts Compose a Whole?**
  Start at the top and work down. Answer each question based on your intuition about the case.

  1. **Is this whole debate just a verbal disagreement?**  
     - **Yes** → **Verbal Dispute** (The disagreement isn’t about reality; it’s about how we define "thing").  
     - **No** → Go to 2.  

  2. **Are there any composite objects at all?** (e.g., is a hydrogen atom made of parts, or is it fundamental?)  
     - **No** → **Nihilism** (Nothing composes; only simples exist).  
     - **Yes** → Go to 3.  

  3. **Does any arbitrary collection of objects compose something?**  
     (e.g., do the Eiffel Tower and a random grain of sand in the Sahara compose an object?)  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  4. **Is the whole just identical to its parts?** (i.e., is "the sum" nothing beyond the parts themselves?)  
     - **Yes** → **Composition as Identity** (The question dissolves; wholes are just parts labeled collectively).  
     - **No** → **Universalism** (Everything composes; arbitrary sums exist as objects).  

  5. **Does a heap of sand (like a sandcastle) compose an object?**  
     - **Yes** → Go to 6.  
     - **No** → Go to 7.  

  6. **Does a cloud (water droplets scattered in the sky) compose an object?**  
     - **Yes** → Go to 8.  
     - **No** → **Contact** (Composition requires spatial contact).  

  7. **Does a glued-together sculpture compose an object?**  
     - **Yes** → **Cohesion** (Composition requires bonding/fastening; glue matters).  
     - **No** → Go to 9.  

  8. **Does a crowd of people compose an object?**  
     - **Yes** → Go to 10.  
     - **No** → **Contact** (Composition requires spatial contact; crowds are "touching" but not a whole).  

  9. **Does a live cat compose an object?**  
     - **Yes** → Go to 11.  
     - **No** → Go to 12.  

  10. **Does the entire economy compose an object?**  
      - **Yes** → **Brutal Composition** (Composition happens, but for arbitrary/brute reasons; no clear principle).  
      - **No** → **Cohesion** (Composition requires cohesion; economies are "connected" but not bonded).  

  11. **Does a dead cat compose an object?**  
      - **Yes** → **Brutal Composition** (No consistent principle; life/death shouldn’t matter if biology isn’t key).  
      - **No** → **Only Living Things** (Composition requires life; e.g., organisms, cells, ant colonies).  

  12. **Does a traffic jam compose an object?**  
      - **Yes** → **Brutal Composition** (No clear principle; rejects life/contact/cohesion but accepts ephemeral groups).  
      - **No** → **Nihilism** (Contradicts earlier "yes" to composites; no viable position remains).  

  ---

  ### **Notes on the Tree**
  #### **Where Positions Merge (Tree Limitations)**
  - **"Vague Composition" isn’t a branch**  
    The tree assumes definite answers, but if you think composition is inherently vague (e.g., "there’s no fact whether 1,000 grains make a heap"), this view **merges with Brutal Composition**. Vague views often collapse into "no principle" stances.
    
  - **"Only Living Things" and Coral Reefs/Ant Colonies**  
    The tree assumes "live cat" covers organisms/superorganisms (e.g., ant colonies). If you accept coral reefs as "alive," you land in **Only Living Things**. If not, you’re forced into **Brutal Composition** (no tree branch for "only ecosystems").

  - **Social Entities (Crowds, Economies)**  
    These test if composition requires physicality. If you accept crowds but not economies, you land in **Cohesion** (physical proximity). If you accept both, you hit **Brutal Composition** (no principle separates them).

  #### **Answer-Combinations With No Adherents**
  1. **"No" to all composites (Q2) but "Yes" to sandcastles (Q5)** → **Incoherent**.  
     You can’t deny composites but accept sandcastles. Nihilism requires consistency.
     
  2. **"Yes" to glued sculptures (Q7) but "No" to live cats (Q9)** → **Ugly/Unexplored**.  
     Accepting glued artifacts but rejecting living things is arbitrary and has no natural defenders. Biology isn’t "less real" than glue.

  3. **"No" to crowds (Q8) but "Yes" to traffic jams (Q12)** → **Incoherent**.  
     Both are human aggregates; no principled difference. Likely lands in **Brutal Composition** or error.

  #### **Where the Tree Breaks**
  - **Part-Swapping (Ship of Theseus)** isn’t directly addressed. It tests *persistence*, not composition. If parts are swapped:  
    - If composition requires specific parts, you lean toward **Nihilism** or **Brutal Composition**.  
    - If composition is functional (e.g., "same role"), you might land in **Cohesion** or **Universalism**.  
    *Since it’s tangential, the tree omits it to avoid overcomplication.*
    
  - **"Contact" vs. "Cohesion"** can blur. If you think sandcastles (contact) and glued sculptures (cohesion) *both* compose, you’ll land in **Contact** at Q6 (cloud test). The tree prioritizes spatial contact as simpler.

  ---

  ### **How to Use This**
  1. **Answer each question honestly** without overthinking.  
  2. **Compare your paths** to see where you split (e.g., at Q5 if you accept sandcastles but your friend doesn’t).  
  3. **Discuss the named position** at your endpoint. If you hit **Brutal Composition**, debate *why* there’s no principle—it’s the most flexible "catch-all."

  This tree covers 90% of mainstream views. Edge cases (e.g., "do quantum fields compose?") might force you into **Brutal Composition** or **Verbal Dispute**, but that’s where the philosophy gets spicy!
