answer: |-
  ### The Heterogeneity Problem in Hedonism: Qualitative vs. Attitudinal Accounts

  The heterogeneity problem threatens hedonism by suggesting that "pleasure" lacks a unified essence, reducing it to a nominal category. I argue that the attitudinal account better resolves this problem across diverse cases, though it transforms hedonism into a thesis about the *valuation of experiences* rather than their intrinsic phenomenology. The functional account, while instructive, evacuates hedonism of its normative force. Below, I compare the qualitative and attitudinal views through key cases, addressing collapse risks and implications.

  #### **Case 1: The Masochist’s Pleasure-in-Pain**  
  - **Qualitative Account**: Struggles severely. If pleasure is a distinct phenomenal quality (e.g., a "glow" or "sweetness"), masochism seems paradoxical: the aversive sensory character of pain should preclude such a quality. Defenders might posit a unique hedonic tone overriding pain’s negativity, but this strains introspection—many report pain itself *as* pleasant without a separable "feel."  
  - **Attitudinal Account**: Handles this naturally. The masochist *likes* the pain (e.g., desires its continuation, approves of it). What unifies this with other pleasures is the attitude, not the sensation.  
  - **Functional Foil**: Reinforces the attitudinal view—pain acts as a reward for the masochist, driving approach behavior.  

  #### **Case 2: Schadenfreude (Pleasure in Another’s Suffering)**  
  - **Qualitative Account**: Must insist the phenomenology of cruelty has a shared hedonic quality, distinct from sensory pleasures. Yet introspection often reveals only the cold satisfaction of superiority, lacking warm sensory tones. This forces a bullet-biting commitment to an undetectable "feel."  
  - **Attitudinal Account**: Explains this effortlessly: the subject *takes an attitude of liking* toward the experience of witnessing suffering, regardless of its sensory content.  
  - **Functional Foil**: Schadenfreude reinforces malicious behavior, fitting a reward role.  

  #### **Case 3: Headache Relief**  
  - **Qualitative Account**: Falters. Relief is defined by the *absence* of pain, not a positive sensation. Any "pleasurable" quality seems identical to the diminishment of aversiveness—no new feeling emerges. Qualitative theorists must contort relief into a positive sensation (e.g., "tingling ease"), which misdescribes the experience.  
  - **Attitudinal Account**: Wins again. Relief involves a pro-attitude toward the *transition* (e.g., liking that the pain is gone, wanting the state to persist). The pleasure lies in the attitude toward change.  
  - **Functional Foil**: Relief is a potent reinforcer (e.g., motivating pill-taking), aligning with function.  

  #### **Case 4: Experimental Dissociations (Wanting vs. Liking)**  
  In addiction studies, rats press levers for rewards (e.g., electrical brain stimulation) while showing no "hedonic" facial responses. Wanting (motivation) and liking (enjoyment) dissociate.  
  - **Qualitative Account**: Collapses here. If pleasure is a phenomenal quality, the rat’s frenzied lever-pressing for a "liking"-deficient stimulus cannot be pleasure. This requires denying real-world cases where motivation outruns experience.  
  - **Attitudinal Account**: Can accommodate this by distinguishing *attitudinal liking* (a conscious endorsement) from *motivational wanting*. The rat’s behavior expresses wanting, but without attitudinal liking, the stimulation isn’t a pleasure—merely a compulsive drive.  
  - **Functional Foil**: Calls the stimulus "pleasure" purely due to its reward role, but this conflates mechanisms with experience—heroin cravings may reinforce behavior while being deeply unpleasant.  

  #### **Case 5: Pleasures of Abstract Thought**  
  - **Qualitative Account**: Fails to identify a consistent phenomenal quality. The "click" of understanding a proof has no sensory vehicle—unlike warmth or taste—and its phenomenology varies (e.g., excitement vs. calm certainty). Forcing a single "hedonic tone" onto this is ad hoc.  
  - **Attitudinal Account**: Shines: the thinker *likes* the cognitive process or its resolution. The attitude unifies intellectual and sensory pleasures.  
  - **Functional Foil**: Problematic—mathematical insights may reinforce future thinking but feel neutral to some (e.g., autistic savants).  

  #### **Collapse Risk: Is Liking a Phenomenal Quality?**  
  The attitudinal account avoids collapse if "liking" is not itself a feeling. Consider headache relief: the attitude is a *disposition* (e.g., to sustain the state), not an added sensation. In dissociations, attitudinal liking requires conscious endorsement—distinct from reflexive wanting. If liking *were* a phenomenal quality, the attitudinal view would reduce to qualitative hedonism. But since attitudes can be dispositional (e.g., "I like this" without a unique feel), they remain distinct.  

  #### **Does Functionalism Rescue Hedonism?**  
  No—it empties it. Defining pleasure via reward roles (e.g., dopamine release) includes states like compulsive gambling or cocaine highs, which subjects often report as anxious or empty, not pleasant. If hedonism claims only "reward-states are good," it loses its intuitive anchor in *felt goodness*, becoming a vacuous empirical claim.  

  ### Verdict: The Attitudinal Account as Superior  
  The attitudinal account handles heterogeneity more elegantly across cases. Masochism, Schadenfreude, relief, and intellectual pleasures all become coherent under a unified pro-attitude. Qualitative hedonism, by contrast, bites bullets: positing undetectable feels in relief, ignoring dissociations, and forcing sensory glosses on non-sensory states.  

  **Does this change hedonism?** Profoundly. Normative hedonism shifts from "pleasure-feelings are intrinsically good" to "experiences *attitudinally endorsed* are intrinsically good." This relocates the difficulty:  
  - If attitudes confer value, can pain be good if liked (as in masochism)?  
  - What grounds the authority of attitudes? (If a person likes cruelty, is it truly good?)  

  Yet the core hedonist claim—that intrinsic value reduces to a unified mental state—survives, now defined relationally. The problem moves to justifying why attitudes (not feels) matter, but this is preferable to denying heterogeneity. The attitudinal account thus preserves hedonism’s structure while resolving its most damning empirical challenge.  

  *Conclusion*: Opt for the attitudinal fix—it turns heterogeneity from a bug into a feature. But be warned: you’re now defending a hedonism where value hinges on our stances toward experience, not experience itself. That’s a fight for another seminar.
