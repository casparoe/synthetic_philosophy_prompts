prompt: |-
  I am enrolled in a third-year seminar on moral responsibility and the ethics of blame, and I am trying to anticipate, before our final session, how the instructor will rule on the case she has set for discussion. Across the term she has issued verdicts on a series of cases turning on whether one person has the standing to blame another, and I would rather reconstruct the rule or rules she is actually applying than simply guess at her conclusion.

  Her verdicts so far have been these.

  (1) Nadia has been unfaithful to every partner she has had and is currently cheating on her husband. She is a colleague of Tom's and has no connection to Tom's partner. She tells Tom that he is contemptible for cheating on his partner. The instructor held that Nadia lacks the standing to blame Tom.

  (2) Ken, the brother of Tom's partner, has never been unfaithful. He tells Tom the same thing. The instructor held that Ken has standing.

  (3) Lena, Tom's partner, who has never been unfaithful, blames Tom. The instructor held that Lena has standing.

  (4) Marcus, a close friend of Tom's partner, has never been unfaithful and condemns infidelity, though he is a repeat drunk driver. He tells Tom the same thing. The instructor held that Marcus has standing.

  In passing, the instructor once remarked, only half-seriously, that the sole thing that really matters is whether the person doing the blaming would be willing to accept the very same criticism herself, and that everything else is a distraction.

  The new case is the following. Priya cheated on several partners in her twenties and thirties; roughly fifteen years ago she stopped, has been faithful ever since, and now sincerely regards infidelity as seriously wrong. She is a colleague of Tom's with no other connection to him or to his partner, and she has never met his partner. She tells Tom that what he has done is contemptible.

  Please predict the instructor's verdict on Priya's case. To make the prediction defensible, state the competing rules that fit her verdicts on cases (1) through (4); say what each of those rules predicts about Priya; give your best guess together with the reasons for preferring it; and describe one further case that would decide between the rules that remain in contention, indicating what verdict on that case would favour which rule. I would ask you not to cite any literature or name any authors, since I have to defend the prediction in class on the strength of the argument alone.
reasoning: |-
  Hmm, the user is in a moral responsibility seminar and needs to predict their instructor's ruling on Priya's case about standing to blame. They've provided four prior cases with verdicts and want me to reconstruct the underlying rules.

  Looking at the cases: In (1) Nadia (current cheater) lacks standing to blame Tom. In (2) Ken (never unfaithful) has standing. In (3) Lena (victim, never unfaithful) has standing. In (4) Marcus (never unfaithful but drunk driver) still has standing. The instructor's half-serious remark about "willingness to accept the same criticism" seems important but needs testing.

  For Priya - past cheater but reformed for 15 years - the key tension is whether the hypocrisy objection persists after reform. Two main rules emerge: 

  Rule A (strict hypocrisy focus): Standing requires never having committed the blameworthy act. This would deny Priya standing since she cheated in the past. 

  Rule B (current commitment focus): Standing depends on current moral alignment - sincerely holding the norm and being willing to accept criticism. This would grant Priya standing given her reform.

  Rule A fits all prior cases except it'd be too harsh on Priya. Rule B fits all cases better by accommodating Marcus's standing despite drunk driving (different norm) and Priya's reform. The instructor's remark strongly suggests Rule B is the actual standard. 

  My prediction: Priya has standing. To test this definitively, I propose a case where someone committed the exact wrong but denies it's blameworthy - which Rules A and B would treat differently. If the instructor denies standing to such a person, it confirms Rule B.

  The user needs this for class defense, so I'll keep it argument-focused without citations as requested. The drunk driver case (Marcus) is particularly telling - since the instructor granted standing despite unrelated wrongdoing, it shows the hypocrisy concern is specific to the act being blamed.
answer: |-
  Based on the instructor's prior verdicts and remark, I reconstruct two competing rules that fit cases (1) through (4). I then apply them to Priya's case, state my prediction, and propose a decisive further case.

  **Competing Rules:**
  1.  **Rule A (Strict Non-Hypocrisy):** A person lacks standing to blame for a specific moral wrong *if they have ever committed that same specific wrong themselves*, regardless of current attitudes or reform. Standing requires a "clean record" on the specific transgression.
  2.  **Rule B (Current Normative Commitment):** A person lacks standing to blame for a specific moral wrong *only if they currently engage in that wrong or reject its status as a wrong*. Standing requires the blamer to sincerely hold the norm they invoke *and* be willing to apply it to themselves *now*. Past transgressions alone do not defeat standing if the person has genuinely reformed and currently endorses the norm.

  **Fit with Prior Cases:**
  *   **(1) Nadia (Current Cheater):**
      *   *Rule A:* Lacks standing (has committed the same wrong: infidelity).
      *   *Rule B:* Lacks standing (currently commits the wrong, rejects the norm in practice).
  *   **(2) Ken (Never Unfaithful):**
      *   *Rule A:* Has standing (clean record).
      *   *Rule B:* Has standing (sincerely holds the norm, no hypocrisy).
  *   **(3) Lena (Victim, Never Unfaithful):**
      *   *Rule A:* Has standing (clean record).
      *   *Rule B:* Has standing (sincerely holds the norm, no hypocrisy).
  *   **(4) Marcus (Never Unfaithful, Drunk Driver):**
      *   *Rule A:* **Problem:** Rule A strictly requires a clean record *only for the specific wrong being blamed*. Drunk driving ≠ infidelity. Therefore, Marcus has standing re: infidelity (clean record on *that* specific wrong). **Fits Verdict (Has standing).**
      *   *Rule B:* **Problem:** Marcus commits a serious wrong (drunk driving), but it's a *different* wrong. His hypocrisy on drunk driving doesn't necessarily undermine his *sincere commitment to the norm against infidelity* or his willingness to accept criticism *for infidelity* (which he hasn't committed). His standing re: infidelity depends on his stance *on infidelity*. **Fits Verdict (Has standing).** (Both rules fit this case).

  **Prediction for Priya:**
  *   **Rule A (Strict Non-Hypocrisy):** Predicts Priya **lacks standing**. She has committed the *same specific wrong* (infidelity) in the past. Her reform doesn't erase the past transgression that makes her blame hypocritical under this rule.
  *   **Rule B (Current Normative Commitment):** Predicts Priya **has standing**. She currently sincerely regards infidelity as wrong and has lived according to this norm for 15 years. She demonstrates a current commitment to the norm and would likely be willing to accept criticism for infidelity *now* (as her past actions are acknowledged as wrong). Her past does not constitute current hypocrisy.

  **My Prediction & Reasoning:**
  I predict the instructor will rule that **Priya has standing to blame Tom**.

  *   **Reasoning for Preferring Rule B:**
      1.  **Marcus's Case (4) is Decisive:** Rule B explains Marcus's standing effortlessly: his unrelated moral failing (drunk driving) doesn't negate his sincere commitment to *the specific norm against infidelity*, which he hasn't violated. Rule A only fits Marcus because it narrowly focuses on the *specific* wrong. However, the instructor's remark ("willing to accept the very same criticism *herself*") strongly suggests the key is the blamer's *current relationship to the specific criticism being leveled*, not a pristine past. Marcus *would* accept criticism for infidelity (as he condemns it and hasn't done it), even if he wouldn't accept criticism for drunk driving. This aligns with Rule B's core.
      2.  **The Instructor's Remark:** The half-serious remark ("sole thing that really matters is whether the person... would be willing to accept the very same criticism herself") is highly indicative. Priya, given her sincere current belief and reform, *would* be willing to accept the criticism "You are contemptible for cheating" directed at her *current self* (acknowledging her past as contemptible). Nadia (Case 1) would not. This remark fits Rule B perfectly and challenges Rule A's focus on past acts irrespective of current stance.
      3.  **Accommodating Reform:** Rule A renders past wrongs permanently disqualifying for standing regarding that wrong, which seems overly harsh and doesn't account for moral growth. Rule B allows for standing when genuine reform and current normative commitment are demonstrated, as they are with Priya.

  **Decisive Further Case:**
  *   **The Case:** *Darius* never cheated on anyone. He sincerely believes infidelity is wrong. However, Darius is currently embezzling funds from his employer. He tells Tom he is contemptible for cheating on his partner.
  *   **Which Verdict Favors Which Rule:**
      *   If the instructor rules Darius **has standing** to blame Tom for infidelity, it strongly supports **Rule B**. Rule B focuses on Darius's current stance *on infidelity*: he hasn't done it, believes it's wrong, and would accept the criticism himself *regarding infidelity*. His hypocrisy on embezzlement (a different wrong) doesn't affect his standing on this specific issue. Rule A would also grant standing (clean record on infidelity).
      *   If the instructor rules Darius **lacks standing**, it strongly supports **Rule A**. Rule A only cares about the specific wrong (infidelity) and Darius has a clean record. A "lacks standing" verdict would imply that *any* serious current moral failing (hypocrisy simpliciter) undermines standing universally, regardless of the specific norm. This goes beyond Rule A but would invalidate Rule B's focus on the specific norm. It would mean Marcus (Case 4) should have lacked standing, contradicting the actual verdict. Therefore, a "lacks standing" verdict for Darius would actually reveal a rule stricter than Rule A or Rule B, conflicting with the verdict in Marcus's case. The key point is that a "has standing" verdict confirms Rule B's permissibility of domain-specific standing despite unrelated failings, while a "lacks standing" verdict would be inconsistent with Marcus unless a new, broader hypocrisy rule is introduced.

  **Conclusion:** Based on the centrality of the instructor's remark about accepting the same criticism and the decisive fit of Rule B with Marcus's standing despite his unrelated wrongdoing, I predict Priya will be ruled to have standing to blame Tom. Her current sincere commitment to the norm and reform overcome her past transgression regarding the standing to blame for that specific wrong.
