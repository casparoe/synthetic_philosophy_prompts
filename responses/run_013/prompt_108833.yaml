prompt: |-
  I direct the rules-review unit of a state agency — the office the legislature created when it attached a sunset clause to our administrative code. Six hundred and twenty rules sit in the code; under the statute each one lapses in twenty-two months unless the commission affirmatively re-authorizes it, and the commission has told us it will vote in bundles of about forty. My staff is four analysts, none of them lawyers, plus one deputy counsel. Each analyst gets roughly six hours per rule. Every file we send up has to be defensible in writing, because we have already been sued once over a rule we let lapse, and because the public comment record is where the losers of these votes will go looking for their arguments. The mandate's language is about unnecessary burdens on regulated parties, but the commission is not interested in a crude cost-benefit ledger, and neither am I.

  What I want from you is a decision procedure my analysts can actually run on a single rule, in the spirit of Chesterton's fence and of the Burkean presumption that inherited arrangements may embody knowledge no living person possesses. It should give me: the questions to ask, in order; what counts as a sufficient answer to each; the point at which the procedure stops with repeal and the point at which it stops with retention; the point at which it must stop and hand the file to a person, which person, and with what question stated rather than answered; and the fields the written record must contain so that the reasoning survives litigation, public comment, and a change of commission. Be explicit about which steps are judgment calls wearing the costume of a test.

  Two failure modes have to be handled head-on, because both are live in my office. The first is Chesterton's fence used as a thought-terminating veto: an incumbent tells my analyst that a rule has reasons, declines to state them, and the file closes with retention. The second is the mirror-image rationalism: no one can articulate a purpose within the six-hour budget, so the analyst concludes there is none and recommends repeal. A procedure that only guards against one of these is worse than none, because it will be cited as neutral while doing one side's work.

  Three things we have learned the hard way, and I want them built in rather than footnoted. First, the rationale recorded for a rule, the actual historical cause of it, and its present function are three different things, and they frequently fail to match; a scandal, a compromise, or a copying error from another state's code can leave a rule whose stated purpose is fiction and whose real work is real. Second, compliance data and enforcement data are not function data: a rule cited zero times in eleven years may still be doing work through the mere fact of its existence, and a rule with universal compliance may be doing nothing, or may be doing something other than what its text says. Third, rules come in bundles, and repealing two innocuous-looking rules at once is not the sum of repealing each alone.

  I also need the procedure to distinguish a fence from a tollbooth. Some standing arrangements are defended by their beneficiaries rather than by their trustees — the moral case and the commercial case for a rule often arrive in the same envelope — and a procedure that treats every defender as a custodian of inherited wisdom will preserve rents, while one that treats every defender as a rentier will knock down load-bearing walls. Tell me how the analyst is supposed to tell these apart in six hours without either naivety or cynicism, and say plainly when the distinction cannot be made on the evidence available.

  Two asymmetries should be addressed rather than assumed away. Repeal is cheap and re-enactment is expensive: it takes a coalition, a session, and a scandal. And the costs of a rule show up in invoices and complaint letters, while the harms it prevents show up nowhere, because they are the harms that did not happen. If the procedure corrects for either asymmetry, say how; if it refuses to, say why that is the honest choice.

  Then run the procedure on three rules from my docket, showing the file as the analyst would fill it in:

  - A rule requiring a particular hazardous operation to be performed by a licensed person rather than by an automated system. Its recorded rationale is a fire risk that no longer exists in that form. My analysts believe it is obsolete. It also appears to be the only place in our code where a diffuse and unorganized group — the people who live near these facilities — has a right to be notified.
  - A rule with no rationale in the file at all, no citations in eleven years, and unanimous staff testimony that it is pointless. One analyst has noticed that it is the legal hook for a reporting practice on which four other rules silently depend.
  - A rule the commission plainly wants gone, because it imposes substantial recurring costs on an industry with an effective lobbying presence, and which appears to be the sole protection for a group with no lobbying presence at all. Whether the protection actually works is unknown, and the evidence that would settle it is not obtainable within the six-hour budget.

  At least one of the three should come out the way the commission will not like, and you should show what the record has to say so that my analyst can defend that outcome in the room rather than fold.

  Finally, tell me what this procedure cannot do, where it will misfire, and which of the questions above should never have been turned into a procedure in the first place. Assume my analysts are careful readers who have never taken a philosophy course; if a distinction cannot be applied by someone in six hours with a case file and a phone, it does not belong in the procedure, however true it is.
reasoning: |-
  We are designing a decision procedure for reviewing administrative rules under the following constraints:
   - Each rule must be reviewed within approximately 6 hours by a non-lawyer analyst.
   - The procedure must be defensible in writing and robust to litigation, public comment, and changes in the commission.
   - It must avoid two failure modes: 
       (a) Chesterton's fence as a thought-terminating veto (incumbent claims there are reasons but doesn't state them, leading to retention).
       (b) Rationalism: inability to articulate a purpose leads to repeal (without sufficient investigation).
   - We have three hard-won lessons:
       1. Recorded rationale, historical cause, and present function may differ (e.g., fiction vs. real work).
       2. Compliance/enforcement data ≠ function data (a rule might work by existence alone, or compliance might hide irrelevance or different function).
       3. Rules are interdependent; repeal of multiple rules isn't additive.
   - Must distinguish between "fences" (arrangements that embody wisdom) and "tollbooths" (rent-seeking by beneficiaries). Analyst must do this without naivety or cynicism in 6 hours.
   - Asymmetries: 
       - Repeal is cheap, re-enactment is expensive (requires coalition, session, scandal).
       - Costs of a rule are visible (invoices, complaints), but benefits (harms prevented) are invisible.

   The procedure must:
     - Specify the questions in order, what counts as a sufficient answer, stopping points for repeal/retention, and when to hand off to a person (and which person).
     - Define the fields for the written record.

   Structure of the Procedure:

   We break the review into phases. Each phase has specific questions and tasks. The analyst must document each step. The goal is to construct a narrative that explains the rule's existence and current function (if any) and to assess whether it should be retained or repealed.

   Phase 1: Rule Identification and Initial Data Gathering (1 hour)
     - Q1: What is the rule's text? (Note: the rule itself)
     - Q2: What is the recorded rationale? (From the rulemaking file, if available)
     - Q3: What are the regulated parties and the burden? (Identify who must comply and what they must do)
     - Q4: What are the direct costs? (Estimate from available data: e.g., compliance costs, state enforcement costs)
     - Q5: What are the enforcement and compliance records? (Number of citations, inspections, violations, complaints, etc. over the last 5-10 years)

     Documentation: Record the answers in the file. If data is missing, note that.

     Stopping Point: If the rule is found to have been already repealed or is otherwise non-operative, stop and recommend repeal. Otherwise, proceed.

   Phase 2: Function and Purpose Inquiry (2 hours)
     - Q6: What is the historical cause? (Look beyond the recorded rationale: check legislative history, news archives, court cases, or internal memos. If none, note.)
     - Q7: What is the present function? (Interview: contact the enforcement agency, regulated entities, and beneficiaries if identifiable. Ask: "What would happen if this rule disappeared tomorrow?")
          - If the rule is part of a bundle (interdependent with others), map the dependencies.
     - Q8: Are there any unrecorded benefits? (Look for evidence of avoided harm: e.g., industry practices that have changed because of the rule, safety improvements, etc.)

     Documentation: Record sources and responses. If an incumbent (e.g., agency staff) claims there are reasons but cannot state them, note that and mark as "unsubstantiated claim". This does not automatically lead to retention.

     Stopping Point: If the rule has no recorded rationale, no historical cause, and no present function (based on evidence) AND there are no dependencies (Q7) AND no unrecorded benefits (Q8), then proceed to Phase 3 with a presumption toward repeal. But note: even if the rule appears pointless, it might be a dependency for others (so Q7 must be thorough).

   Phase 3: Burden-Benefit Assessment (1.5 hours)
     - Q9: What are the benefits? (Quantify if possible; if not, describe qualitatively. Include both stated and unstated benefits, and consider the asymmetry: benefits are often invisible.)
     - Q10: What are the costs? (Quantify if possible; include both compliance costs and administrative costs.)
     - Q11: Are there alternative ways to achieve the same benefits? (Consider less burdensome regulations, technological solutions, market mechanisms, etc.)

     Documentation: Weigh the costs and benefits. However, note that we are not doing a strict cost-benefit analysis because the commission isn't interested in that. Instead, we are looking for:
        - Is the burden clearly disproportionate to the benefit? (e.g., high cost for no discernible benefit)
        - Or, is there a clear benefit that justifies the burden?

     Stopping Point: 
        - If the rule has a clear, current function and the burden is not disproportionate, recommend retention.
        - If the rule has no discernible function and the burden is non-trivial, recommend repeal.
        - If the rule has a function but the burden is high and there is a less burdensome alternative, note that and consider recommending reform (but note: our mandate is re-authorize or let lapse; reform is not an option without new rulemaking). However, we can flag for the commission that reform might be better.

     But note: We must account for the asymmetries:
       - Repeal is cheap, re-enactment expensive: So if there is doubt about benefit, lean toward retention? 
          However, we must also avoid preserving rents. Therefore, we introduce a "precautionary principle": 
          - If the rule might be preventing a significant harm (even if unproven) and the cost of being wrong (repeal leading to harm) is high, then we should retain unless the burden is extreme.
          - Conversely, if the rule imposes a high burden and the benefit is speculative or unproven, then repeal may be warranted.

     We formalize this with a set of criteria:

     Criteria for retention:
       A. The rule has a clear, current function that justifies the burden, OR
       B. The rule might be preventing a significant harm (even if unproven) and the burden is not extreme, OR
       C. The rule is a dependency for other rules (and those rules are being retained) and removing it would break a bundle.

     Criteria for repeal:
       D. The rule has no discernible function and the burden is non-trivial, OR
       E. The rule's burden is extreme and the benefit is speculative or unproven, OR
       F. The rule is redundant (same function achieved by another rule) or obsolete.

     However, the burden of proof is on retention? Not exactly. We are Burkean: we presume that the rule has a reason until proven otherwise. But we must avoid the thought-terminating veto.

     Therefore, we set a threshold: 
        - If the rule has a function that is not a "tollbooth" (i.e., not primarily benefiting a concentrated group at the expense of others) and the burden is not extreme, retain.
        - If the function is unclear but there is evidence of a potential harm prevented, retain unless the burden is extreme.

     How to distinguish fence (wisdom) from tollbooth (rent)?
        - Ask: Who benefits? 
            - If the benefits are diffuse (e.g., public safety, environmental protection) and the costs are concentrated, it might be a fence.
            - If the benefits are concentrated (e.g., a specific industry gains a barrier to entry) and the costs are diffuse (or borne by the public), it might be a tollbooth.
        - Look for evidence of rent-seeking: 
            - Did the regulated entities support the rule at enactment? (If yes, then suspect tollbooth)
            - Are there complaints from potential competitors about the rule?
        - However, in 6 hours, the analyst might not get clear evidence. Therefore:
            - If the rule has a public-interest rationale and no evidence of rent-seeking, treat as fence.
            - If the rule has a private-interest rationale and no evidence of public benefit, treat as tollbooth.
            - If unclear, then the rule gets the benefit of the doubt (Burkean) and is treated as a fence UNLESS the burden is high and the benefit is speculative.

     So the analyst must document:
          - Who benefits? (Concentrated vs. diffuse)
          - Who bears the cost?
          - Is there evidence of rent-seeking? (e.g., historical record of industry support without clear public benefit)

     If the distinction cannot be made, then the rule is treated as a fence (presumption of retention) unless the burden is high and the benefit is speculative (then repeal).

   Phase 4: Interdependence Check (1 hour)
     - Q12: What other rules depend on this rule? (Look for rules that reference it, or that rely on data or processes that this rule provides.)
     - Q13: If we repeal this rule, what other rules would break? (If the rule is a dependency, then repealing it might cause unintended harm.)

     Documentation: List dependent rules and the nature of the dependency.

     Stopping Point: 
          - If the rule is a critical dependency for other rules that are being retained, then we must retain it unless we can also repeal the dependent rules (which may not be under review at the same time). Therefore, if the rule is a dependency, mark for retention and note the dependency.

   Phase 5: Recommendation (0.5 hour)
     - Review the findings and make a recommendation: retain, repeal, or flag for higher review.

     Handoff to a person: 
          - If the rule is complex and the evidence is conflicting, or if there is a high-stakes trade-off (e.g., substantial burden vs. unproven but potentially catastrophic harm) then hand off to the deputy counsel with a summary of the conflict and the specific question: "Given the uncertainty about the harm prevented and the high burden, should we repeal and risk harm or retain and impose costs?"
          - Also, if there is evidence of a tollbooth (rent) but also a claimed public benefit that cannot be verified, hand off to the deputy counsel with the question: "Is the public benefit claim credible, or is this rent-seeking?"

     The deputy counsel (a lawyer) can then spend additional time (beyond the 6 hours) to investigate.

     The written record must contain:
          - All the answers from the phases.
          - A clear chain of reasoning: how the answers lead to the recommendation.
          - Documentation of attempts to contact stakeholders and the responses (or non-responses).
          - The assessment of fence vs. tollbooth and the evidence for that.
          - The interdependence analysis.

     The record must be structured so that an outsider (court, public, new commission) can follow the logic.

     Now, we run the procedure on the three rules:

   Rule 1: 
     - Rule requiring a particular hazardous operation to be performed by a licensed person rather than by an automated system.
     - Recorded rationale: fire risk that no longer exists.
     - Analysts believe it is obsolete.
     - However, it is the only place where nearby residents have a right to be notified.

   Phase 1:
     - Q1: Rule text: [quoted]
     - Q2: Recorded rationale: fire risk (obsolete)
     - Q3: Regulated parties: facilities with hazardous operations; burden: must use licensed person and notify residents.
     - Q4: Costs: hiring licensed personnel (higher cost than automation) and notification costs.
     - Q5: Enforcement: probably some notifications, but no recent fires? (Check data: if no fires, then enforcement might be low.)

     Phase 2:
     - Q6: Historical cause: likely a past fire incident.
     - Q7: Present function: 
          - Analyst contacts the agency: they say the fire risk is gone, but they also note the notification requirement.
          - Interview a regulated entity: they complain about the cost of the licensed operator and the notification.
          - Interview a resident group: they value the notification because they want to know about hazardous operations.
          - So present function: notification of residents (even though the rule's text is about the licensed operator, the notification is attached to that requirement).
     - Q8: Unrecorded benefits: the notification might allow residents to take precautions or voice concerns.

     Phase 3:
     - Q9: Benefits: 
          - The notification right for residents (diffuse benefit: safety and participation).
          - The licensed operator requirement: might still have some safety benefit? (But the analyst believes it's obsolete.) However, the burden of the licensed operator is high (costly) and the benefit for that part is low.
     - Q10: Costs: high for licensed operator, moderate for notification.
     - Q11: Alternatives: 
          - Could we require notification without the licensed operator? (But the rule doesn't allow that; it's tied.)

     Burden-benefit: 
          - The licensed operator part: burden high, benefit low (obsolete) -> repeal that part? But we can't amend, only repeal the whole rule.
          - The notification part: burden moderate, benefit (to a diffuse group) significant.

     Fence vs. tollbooth: 
          - Licensed operators are beneficiaries (concentrated) of the requirement to use them (they get jobs) -> tollbooth aspect.
          - Residents are beneficiaries of notification (diffuse) -> fence aspect.
          - So the rule has both.

     How to weigh? The rule is a bundle. If we repeal, we lose the notification. 

     Phase 4:
     - Q12: Dependencies: None mentioned, but the notification is only in this rule.

     Recommendation: 
          - The rule has two parts: one (licensed operator) that is likely a tollbooth and obsolete, and one (notification) that is a fence and valuable.
          - Since we cannot split the rule, we must choose to retain or repeal the whole.

          - Asymmetry: If we repeal, the notification right is lost and re-enactment would be hard. The harm of losing notification is not immediately visible but could be significant (e.g., if an accident happens and residents weren't warned).

          - Therefore, we recommend retention, but with a note to the commission that they should consider amending the rule to drop the licensed operator requirement and keep the notification.

          - Since we cannot amend, we must retain the whole rule to preserve the notification.

          - This might not be what the commission wants (because the industry is lobbying against the cost), but the record will show:
               - The rule has a critical public function (notification) that is not obsolete.
               - The licensed operator requirement is obsolete and may be a tollbooth, but we cannot separate it without new rulemaking.

          - Written record: 
               "The rule requires a licensed operator for a hazardous operation (rationale: fire risk) and also requires notification of nearby residents. The fire risk rationale is obsolete due to technological changes. However, the notification requirement is the only mechanism in the code for resident notification and serves a current public safety function. Repealing the entire rule would remove that notification right. The licensed operator requirement imposes substantial costs and may function as a rent for licensed operators, but the notification benefit to the public outweighs the cost. Therefore, we recommend retention. Note: The commission may wish to direct the agency to initiate a new rulemaking to decouple the notification requirement from the licensed operator requirement."

   Rule 2:
     - Rule with no rationale, no citations in 11 years, unanimous staff testimony that it is pointless.
     - But one analyst noticed it is the hook for a reporting practice on which four other rules depend.

   Phase 1:
     - Q1: Rule text.
     - Q2: Recorded rationale: none.
     - Q3: Regulated parties: ? (probably requires some report)
     - Q4: Costs: probably low (filing a report).
     - Q5: Enforcement: zero citations.

     Phase 2:
     - Q6: Historical cause: unknown (no record).
     - Q7: Present function: 
          - Analyst contacts agency: staff say it's pointless. But then the analyst discovers that four other rules (which are active) rely on the report generated by this rule. Without this rule, those rules would break because they assume the existence of the report.
          - So present function: enabling the reporting required by other rules.
     - Q8: Unrecorded benefits: none beyond supporting other rules.

     Phase 3:
     - Q9: Benefits: supports other rules (which presumably have benefits).
     - Q10: Costs: low (filing a report).
     - Q11: Alternatives: none identified in the time.

     Burden-benefit: low cost, high benefit (because without it, other rules break). So retain.

     Fence vs. tollbooth: 
          - The rule itself doesn't directly benefit a concentrated group. It's an administrative hook. Likely a fence (part of the structure).

     Phase 4:
     - Q12: Dependencies: other rules depend on it -> critical.

     Recommendation: Retain. 
          - Written record: 
               "The rule has no direct function and no enforcement history, but it is a necessary hook for four other rules (list them). Without it, those rules would lack a data source. The cost of the rule is low, and the benefit (enabling other rules) is high. Therefore, we recommend retention."

   Rule 3:
     - Rule that imposes substantial recurring costs on an industry (with strong lobby) and is the sole protection for a group without a lobby.
     - Unknown if the protection works, and evidence not obtainable in 6 hours.

   Phase 1:
     - Q1: Rule text.
     - Q2: Recorded rationale: protection of a vulnerable group (e.g., workers, consumers, etc.).
     - Q3: Regulated parties: industry; burden: substantial recurring costs (e.g., safety equipment, training, etc.).
     - Q4: Costs: high (quantify if possible).
     - Q5: Enforcement: some citations? or maybe high compliance? (But compliance doesn't mean it works.)

   Phase 2:
     - Q6: Historical cause: likely a past harm to the vulnerable group.
     - Q7: Present function: 
          - Analyst contacts the protected group (if possible) or advocates: they say the rule is essential.
          - Industry says it's burdensome and ineffective.
          - Agency might not have data on effectiveness.
          - So present function: intended to protect, but effectiveness unknown.
     - Q8: Unrecorded benefits: none identified.

     Phase 3:
     - Q9: Benefits: intended to protect a vulnerable group. But no data on effectiveness.
     - Q10: Costs: high.
     - Q11: Alternatives: none identified in the time.

     Burden-benefit: 
          - High cost, but potential for high benefit (if the rule is effective). However, we don't know if it works.

     Fence vs. tollbooth: 
          - The rule benefits a diffuse and unorganized group (vulnerable) and costs a concentrated group (industry). This looks like a fence (public interest) rather than a tollbooth. But we don't know if it's effective.

          - Asymmetry: benefits are invisible (harms prevented) and costs are visible.

          - Precautionary principle: 
               - If we repeal and the rule was effective, we risk harm to the vulnerable group (which might be catastrophic) and re-enactment would be hard.
               - If we retain and the rule is ineffective, we impose high costs.

          - But we have no evidence either way.

     Phase 4:
     - Q12: Dependencies: none mentioned.

     Handoff: 
          - This is high-stakes and uncertain. Hand off to the deputy counsel with the question:
               "The rule imposes high costs on an industry and is intended to protect a vulnerable group, but we cannot determine effectiveness within the time. Should we repeal (saving costs but risking harm) or retain (imposing costs but preventing potential harm)?"

          - The deputy counsel might decide to do more investigation (beyond 6 hours) or might recommend retention on precautionary grounds.

     However, the procedure says: if we cannot tell and the potential harm is significant, we retain. But the burden is high and the industry is lobbying, so the commission wants repeal.

     Our procedure must be robust. Therefore, we note the asymmetry: repeal is cheap only if we are wrong and then we can re-enact? But re-enactment is hard (requires a scandal). So if the harm is potentially severe, we retain.

     But we don't know if the harm is severe. We only know the rule is the sole protection.

     So the analyst should note: 
          - The rule might be a load-bearing wall (preventing serious harm) even without evidence of effectiveness. Without proof of ineffectiveness, we cannot assume it's doing nothing.

     Therefore, the analyst recommends retention, but flags the uncertainty and hands off to deputy counsel for a final call.

     Written record (by analyst before handoff):
          "The rule imposes substantial costs on [industry] and is intended to protect [vulnerable group]. We could not obtain evidence of effectiveness within the review period. However, the rule is the sole protection for this group. Repealing it risks harm to a vulnerable population, and re-enactment would be difficult. Given the precautionary principle and the Burkean presumption, we recommend retention. However, due to the high stakes and uncertainty, we refer to deputy counsel for final recommendation."

     The deputy counsel might then decide to retain.

     This outcome (retention) is not what the commission wants (because of industry lobbying), so the analyst must be prepared to defend it.

     The defense: 
          - The rule might be preventing harm we cannot see. 
          - The burden, while high, is not extreme compared to the potential harm. 
          - The asymmetry: costs are visible, benefits are not. 
          - The industry has not provided evidence that the rule is ineffective (they just say it's burdensome). 
          - We have a duty to the vulnerable group.

   What the procedure cannot do:
     - It cannot magically produce evidence that doesn't exist or is too expensive to obtain in 6 hours.
     - It cannot resolve deep uncertainties without judgment (hence the handoff to deputy counsel).
     - It cannot amend rules; only repeal or retain.
     - It might be gamed by stakeholders (e.g., beneficiaries overstating benefits, regulated entities understating benefits and overstating costs). We rely on the analyst's skepticism and triangulation.
     - The fence/tollbooth distinction is inherently judgmental and may be wrong. We accept that by building in the benefit of the doubt for retention when uncertain (but not when the burden is extreme and benefit speculative).

     Which questions should not be turned into a procedure?
          - The determination of whether a rule is a fence or a tollbooth: it requires nuance and context that might be elusive in 6 hours. We have a heuristic, but it's imperfect.
          - The assessment of the magnitude of potential harm (invisible benefits) is speculative. We use the precautionary principle, but it's not a mechanical test.

     However, the procedure forces the analyst to ask the questions and document the reasoning, which is the best we can do.

     Final note: The procedure is designed to avoid both failure modes by:
          - Requiring active inquiry (not accepting "there are reasons" without evidence) and 
          - Not allowing repeal just because a purpose isn't immediately articulated (by requiring investigation of function and dependencies).

     The written record will show the steps taken and the basis for the recommendation.
answer: |-
  ### Decision Procedure for Rule Review  
  **Guiding Principles:**  
  - **Burkean Presumption:** Retain rules unless there is clear, evidence-based reason for repeal.  
  - **Chesterton's Fence:** Demand explicit justification for a rule’s existence, but reject unsubstantiated claims.  
  - **Asymmetry Correction:** Favor retention when benefits are uncertain (re-enactment is hard), but repeal when costs are high and benefits unproven.  
  - **Anti-Rent-Seeking:** Distinguish between "fences" (public-interest wisdom) and "tollbooths" (private rents) via stakeholder analysis.  

  **Procedure Structure:**  
  4 phases (5.5 hours max), 0.5 hours for documentation. Each phase must be documented in the file.  

  ---

  #### **Phase 1: Foundational Inquiry** (1.5 hours)  
  **Goal:** Gather baseline data and identify red flags.  
  **Questions:**  
  1. **Text & Recorded Rationale:** What does the rule require? What rationale is formally documented?  
     *Sufficiency:* Official records (e.g., rulemaking docket). If none, note "undocumented."  
  2. **Burden:** Who bears compliance costs? Quantify recurring costs (e.g., $/year, hours spent).  
     *Sufficiency:* Industry data, agency estimates, or public comments.  
  3. **Enforcement/Compliance:** Number of citations, inspections, and complaints in the last 5 years.  
     *Sufficiency:* Agency databases. "Zero" is acceptable if verified.  
  4. **Stakeholder Map:** List beneficiaries and burdened parties. Classify as:  
     - **Concentrated** (e.g., trade group) or **Diffuse** (e.g., public).  
     - **Organized** (e.g., lobby) or **Unorganized** (e.g., residents).  
     *Sufficiency:* Public comments, agency input, or news scans.  

  **Stopping Points:**  
  - **Repeal:** Rule is legally void (e.g., preempted by federal law).  
  - **Handoff to Deputy Counsel:** Suspected legal vulnerability (e.g., constitutional issue).  

  ---

  #### **Phase 2: Function & History** (2 hours)  
  **Goal:** Uncover the rule’s real-world function vs. its stated purpose.  
  **Questions:**  
  5. **Historical Cause:** What event (e.g., scandal, accident) triggered the rule?  
     *Sufficiency:* Legislative history, news archives, or agency testimony. If none, note "unknown."  
  6. **Present Function:** What does the rule *actually* do today?  
     - Interview 2+ stakeholders (e.g., agency staff, regulated entity, beneficiary).  
     - Ask: **"What would break if this rule vanished tomorrow?"**  
     *Sufficiency:* Direct quotes or written responses. Refuse "trust me" answers.  
  7. **Dependencies:** Do other rules/practices rely on this one?  
     *Sufficiency:* Cross-references in code, agency workflows, or stakeholder input.  

  **Stopping Points:**  
  - **Repeal:** Rule has no historical cause, no present function, no dependencies, and trivial burden.  
  - **Retention:** Rule has active function with diffuse beneficiaries (e.g., public safety).  
  - **Handoff to Deputy Counsel:**  
    - Function conflicts with text (e.g., rule silently enables another rule).  
    - Suspected tollbooth (Phase 3 inconclusive).  

  **Anti-Failure Modes:**  
  - **Veto Guard:** Unsubstantiated "reasons" from incumbents trigger Phase 3 scrutiny.  
  - **Rationalism Guard:** Lack of articulated purpose demands dependency checks (Q7).  

  ---

  #### **Phase 3: Burden-Benefit & Rent Test** (1.5 hours)  
  **Goal:** Weigh costs against benefits; filter out rent-seeking.  
  **Questions:**  
  8. **Benefit Evidence:** What harms does the rule prevent? How is this measured?  
     *Sufficiency:* Data (e.g., accident rates), stakeholder testimony, or academic studies. "Invisible" benefits (e.g., deterrence) are valid if logically justified.  
  9. **Rent Test:** Is the rule a "fence" or "tollbooth"?  
     - **Fence Indicators:** Benefits diffuse/unorganized groups; costs concentrated; no history of industry lobbying for the rule.  
     - **Tollbooth Indicators:** Benefits concentrated/organized groups; costs diffuse; industry supported enactment.  
     *Sufficiency:* Compare stakeholder maps (Phase 1) with historical support/opposition.  
  10. **Asymmetry Adjustment:**  
      - If benefits are uncertain but harm is plausible, **retain** (re-enactment is hard).  
      - If costs are high and benefits unproven, **repeal** (burden is visible).  

  **Stopping Points:**  
  - **Repeal:** High burden + tollbooth indicator + no benefit evidence.  
  - **Retention:** Low-to-moderate burden + fence indicator + plausible benefit.  
  - **Handoff to Deputy Counsel:**  
    - Rent test inconclusive (e.g., beneficiaries are both public and industry).  
    - High burden + uncertain benefit (e.g., sole protection for vulnerable group).  

  ---

  #### **Phase 4: Bundle & Exit** (0.5 hours)  
  **Goal:** Prevent collateral damage from repeal.  
  **Questions:**  
  11. **Bundle Risk:** If repealed with similar rules, what compound risks arise?  
      *Sufficiency:* Scenario analysis (e.g., "If Rule A and B go, would system collapse?").  
  12. **Final Recommendation:**  
      - ◻ Retain ◻ Repeal ◻ Handoff  
      *Sufficiency:* Explicit link to Phases 1–3.  

  **Stopping Points:**  
  - **Repeal:** Passes all previous stop points.  
  - **Retention:** Fails any repeal test.  
  - **Handoff:** Deputy counsel resolves ambiguities (e.g., high-stakes uncertainty).  

  ---

  ### **Documentation Requirements**  
  The file must include:  
  1. Phase 1–4 answers with sources.  
  2. Stakeholder contacts (names/roles).  
  3. Rent test justification (fence/tollbooth).  
  4. Asymmetry rationale (why benefits/costs tipped the decision).  
  5. Handoff questions (if applicable).  

  ---

  ### **Application to Three Rules**  
  #### **Rule 1: Hazardous Operation License Requirement**  
  - **Recorded Rationale:** Obsolete fire risk.  
  - **Analyst Belief:** Obsolete, but only notification right for nearby residents.  
  - **Phase 1:**  
    - Burden: High (cost of licensed labor vs. automation).  
    - Stakeholders: Industry (concentrated/organized), residents (diffuse/unorganized).  
  - **Phase 2:**  
    - Present Function: Resident notification (confirmed via agency interview).  
    - Dependencies: None.  
  - **Phase 3:**  
    - Benefit: Notification right prevents panic, enables community input (invisible benefit).  
    - Rent Test: **Fence** (benefits unorganized residents; industry opposes rule).  
    - Asymmetry: Repeal loses resident rights; re-enactment unlikely.  
  - **Phase 4:** Bundle risk low.  
  - **Recommendation:** **Retain** (notification is load-bearing).  
  - **Defense Script:** "Repeal eliminates the only mechanism for resident notification. Burden on industry is outweighed by public interest. Commission should reform, not repeal."  

  #### **Rule 2: "Pointless" Rule with Hidden Dependency**  
  - **Recorded Rationale:** None.  
  - **Staff Testimony:** Pointless; zero citations in 11 years.  
  - **Phase 1:**  
    - Burden: Low (minor reporting).  
  - **Phase 2:**  
    - Present Function: Enables reporting for 4 other rules (analyst discovery via cross-reference check).  
    - Dependencies: Critical (4 rules break without it).  
  - **Phase 3:**  
    - Benefit: Maintains integrity of dependent rules.  
    - Rent Test: **Fence** (administrative necessity; no private beneficiary).  
  - **Phase 4:** Bundle risk high (cascade failure).  
  - **Recommendation:** **Retain** (dependency is load-bearing).  
  - **Defense Script:** "Rule is a keystone for reporting. Zero citations ≠ irrelevance; it enables silent workflows."  

  #### **Rule 3: Costly Rule Protecting Unlobbyed Group**  
  - **Commission Preference:** Repeal (industry pressure).  
  - **Burden:** High recurring costs.  
  - **Phase 1:**  
    - Stakeholders: Industry (concentrated/organized), vulnerable group (diffuse/unorganized).  
  - **Phase 2:**  
    - Present Function: Unknown (no data on effectiveness).  
  - **Phase 3:**  
    - Benefit: Unproven but plausible (sole protection).  
    - Rent Test: **Fence** (benefits unorganized group; industry opposes).  
    - Asymmetry: Repeal risks harm to vulnerable group; re-enactment hard.  
  - **Handoff to Deputy Counsel:**  
    - Question: "Does weak evidence of benefit justify high burden given re-enactment risks?"  
  - **Deputy Counsel Review:**  
    - Verifies asymmetry. Confirms no tollbooth (e.g., industry didn’t create the rule).  
    - **Recommendation: Retain** (precautionary principle).  
  - **Defense Script:** "Repealing the sole protection for a vulnerable group risks irreversible harm. Burden is visible, but benefits are not. Industry lobbying ≠ evidence of obsolescence."  

  ---

  ### **Limitations & Failure Risks**  
  **What the Procedure Cannot Do:**  
  1. **Prove Absence of Harm:** Invisible benefits remain speculative.  
  2. **Detect Deep Rent-Seeking:** Requires historical/political knowledge beyond 6 hours.  
  3. **Resolve High-Stakes Uncertainty:** Deputy counsel handoffs are subjective.  
  4. **Fix Bundling:** Simultaneous repeal of interdependent rules risks unanticipated collapse.  

  **Misfire Scenarios:**  
  - **False Retention:** Rules with cleverly hidden tollbooths (e.g., industry captures "public benefit" narrative).  
  - **False Repeal:** Rules with subtle, long-term benefits (e.g., environmental monitoring).  

  **Questions That Shouldn’t Be Proceduralized:**  
  1. **"Is This Rent-Seeking?"** Requires contextual judgment (handoff to deputy counsel).  
  2. **"How Much Uncertainty Is Tolerable?"** Asymmetry adjustments are principled but qualitative.  
  3. **"What Is the True Historical Cause?"** May require archival research exceeding 6 hours.  

  **Final Note:** This procedure prioritizes defensibility over perfection. It forces explicit reasoning, documents trade-offs, and balances Chesterton’s fence with anti-rent safeguards. Analysts can execute it with case files and phones—no philosophy degree needed.
