prompt: |-
  I'm putting together the final for an upper-level seminar I teach on using history as evidence for forecasting -- the students are policy types who've had exactly one stats course and a lot of confidence. I want one essay question for the exam (60 minutes, closed book) that they can't get through by reciting the outside-view stuff from Kahneman and the megaproject reference-class work. So I'm building it around a concrete artifact they have to actually audit, and I want the model answer and a marking scheme to go with it.

  Here's the scenario I'm going to hand them, verbatim-ish, and I want you to treat it as the object of the question:

  A consultancy (call it the Meridian Group) publishes a forecast that a certain major power's current political order has "a 40% probability of collapsing within 15 years." Their two-page method note says: they assembled a reference class of 23 historical polities they call "empires" -- it's a grab-bag, including a couple of city-state hegemonies, one or two colonial empires, a shogunate, some dynastic states, and at least one thing most historians would call a kingdom rather than an empire; they computed how long each lasted (the spread is roughly 50 to 900 years, median around 250); they located the current power at about the 60th percentile of elapsed duration; and that percentile is where the 40% comes from. They add that the class "controls for regime type" because every member was an empire. They also state that the model assumes the hazard of collapse is constant over a polity's life, so age doesn't need to be modeled separately.

  The question I want them to answer is basically: is this forecast any good? I want it to force them through the following, and the marking scheme should make clear which of these a top answer hits:

  - whether that reference class is defensible at all, and what's actually wrong with the claim that it "controls for regime type";
  - the statistical problem with estimating a survival/lifespan distribution from a set of polities that all collapsed -- they should name it and say what it does to the 40%;
  - the constant-hazard assumption -- what it implies and why it might be false for polities;
  - the difference between forecasting whether and forecasting when, and which one Meridian actually did;
  - the strongest steelman of the forecast, then the strongest objection to it;
  - and the single change that would most improve it.

  Please write the exam question itself, a model answer of about 700 words, and then the marking scheme. For the marking scheme I want it as a table, columns exactly: "Criterion" | "What a full-credit answer must contain" | "Marks" | "How students typically lose marks here" -- total 25 marks, and you decide the allocation. Don't lean on any particular book, author, or date; if a real idea is useful, describe it rather than cite it, because I don't want students rewarded for name-dropping.
reasoning: |-
  Okay, the user is designing an exam question for an upper-level seminar on using history for forecasting. The students are policy types with minimal stats training but high confidence. The key challenge is creating a question that can't be gamed by regurgitating Kahneman or reference-class concepts. 

  Hmm... the Meridian Group scenario is clever because it packages multiple flaws into one compact case study. The reference class issues jump out immediately - that "grab-bag" of polities is a disaster. Calling it "controlling for regime type" is either deeply ignorant or deliberately misleading. And that survival analysis flaw? Textbook right-censoring problem. Students might miss how the "all collapsed" requirement biases everything.

  The constant-hazard assumption feels particularly rich for discussion. Policy students should grasp why political systems don't fail like radioactive decay - context matters. The whether vs when distinction is subtle but crucial here. Meridian's model only addresses timing, completely ignoring proximate causes of collapse. 

  For the marking scheme... let's see. The 25-point breakdown needs to reward depth on each flaw while leaving room for the steelman/objection balance. Top answers should spot that the 60th percentile approach isn't totally worthless - it does provide some baseline - but the implementation torpedoes it. The improvement suggestion must be actionable; "better reference class" is too vague, "include surviving polities" is concrete.

  Biggest worry? Students might fixate on obvious problems (the messy reference class) but whiff on subtler statistical issues. The marking scheme should penalize that. Also must emphasize they shouldn't just rant - the steelman requires intellectual fairness. 

  The model answer needs to walk the tightrope: technically precise but accessible to stats novices. No jargon without explanation. And absolutely no namedropping - the user's allergic to that. Phrases like "certain cognitive biases" instead of "Kahneman's planning fallacy" etc.

  Final challenge: keeping the model answer to 700 words while covering all layers. Prioritize depth on the survival analysis flaw and constant-hazard since those are least intuitive. The regime type control failure can be shorter - that's more obvious.
answer: |-
  ### Exam Question  
  **Critically evaluate the Meridian Group’s forecast that a major power’s political order has "a 40% probability of collapsing within 15 years."**  
  In your response, address:  
  1. The defensibility of the reference class and the claim that it "controls for regime type."  
  2. A statistical problem arising from using *only collapsed polities* to estimate survival.  
  3. The implications of assuming constant hazard and why this might be unrealistic.  
  4. Whether Meridian forecasted *whether* collapse occurs or *when* it occurs.  
  5. The strongest argument *in favor* of the forecast, then the strongest *against* it.  
  6. The single change that would most improve the forecast.  

  ---

  ### Model Answer (≈700 words)  

  The Meridian Group’s forecast suffers from critical methodological flaws, though it has superficial plausibility.  

  **1. Reference Class Defensibility:** The reference class of 23 "empires" is poorly constructed. Including city-states, colonial empires, shogunates, and kingdoms under one label ignores vast differences in governance, economic structures, and threats. Calling this a control for regime type is misleading: lumping diverse systems together *creates* heterogeneity, it doesn’t control it. True control would require comparable institutions or stressors (e.g., "pre-industrial agrarian empires"), not a broad category. This inflates uncertainty.  

  **2. Statistical Problem from Excluding Survivors:** Using only collapsed polities introduces **right-censoring bias**. By ignoring empires that *haven’t* collapsed (e.g., surviving states like the UK or Japan), Meridian underestimates typical lifespans. Collapsed empires are disproportionately those that failed *early*; longer-lived examples are missing. This skews the 60th percentile downward, inflating the perceived collapse risk. The true probability is likely lower than 40%.  

  **3. Constant-Hazard Assumption:** Meridian assumes collapse risk is uniform over a polity’s lifespan. This implies empires face identical annual collapse risk whether 50 or 500 years old—like radioactive decay. Real polities, however, exhibit **non-constant hazard**: risks often peak during crises (e.g., succession wars, economic shocks) or decline after stability milestones. Ignoring historical context (e.g., external invasions, technological shifts) makes timing estimates unreliable.  

  **4. Forecasting "When" vs. "Whether":** Meridian forecasts only *when* collapse occurs (timing), based on elapsed duration. It does not address *whether* collapse will occur at all. A polity might defy the model by surviving indefinitely due to unique adaptations (e.g., institutional reforms). This conflates two distinct questions: survival analysis requires addressing both.  

  **5. Steelman and Objection:**  
  - **Strongest Steelman:** The approach offers a baseline "outside view" by ignoring narrative biases. It forces acknowledgment that even stable-seeming systems have historical failure rates, countering overconfidence.  
  - **Strongest Objection:** The model ignores **causal mechanisms**. Collapse rarely stems from age alone; it results from specific triggers (e.g., fiscal crises, revolts). Ignoring this treats all empires as interchangeable units, violating historical reality.  

  **6. Key Improvement:** **Include surviving polities** in the reference class. This corrects right-censoring bias and allows modeling varied outcomes (collapse/survival). Better yet, restrict the class to polities sharing key traits with the forecasted state (e.g., industrial economies, nuclear-capable).  

  **Conclusion:** While the "outside view" has value, Meridian’s execution misapplies it. Flawed reference classes, statistical biases, and unrealistic assumptions render the 40% estimate unsubstantiated.  

  ---

  ### Marking Scheme (Total: 25 marks)  

  | **Criterion** | **What a full-credit answer must contain** | **Marks** | **How students typically lose marks** |  
  |---------------|--------------------------------------------|-----------|----------------------------------------|  
  | **Reference Class Critique** | Identifies heterogeneous polities undermine validity; explains "controls for regime type" falsely implies homogeneity. | 4 | Vague criticism (e.g., "classes are messy") without addressing regime-type claim. |  
  | **Statistical Problem** | Names **right-censoring bias**; explains it inflates collapse probability by excluding surviving polities. | 4 | Describes bias vaguely (e.g., "missing data") without naming or explaining effect on probability. |  
  | **Constant-Hazard Assumption** | Explains constant hazard implies fixed annual risk; identifies why polities have variable risk (e.g., crises, stability periods). | 4 | Only defines constant hazard; fails to link to political realities. |  
  | **Forecasting "When" vs. "Whether"** | Correctly states Meridian forecasts **timing** ("when"), not occurrence ("whether"). | 2 | Confuses the two concepts or misattributes the approach. |  
  | **Steelman & Objection** | Steelman: Highlights baseline value of outside view. Objection: Emphasizes ignoring **causal mechanisms**/context. | 5 (3+2) | Superficial steelman (e.g., "it’s quantitative"); objection focuses on minor flaws vs. core omission of causality. |  
  | **Key Improvement** | Advocates **including surviving polities** to fix censoring; bonus for adding "shared traits" refinement. | 3 | Suggests vague changes (e.g., "better data") without specifying survivorship. |  
  | **Clarity & Structure** | Logically organized, concise, addresses all prompts. | 3 | Disjointed flow; omits ≥1 prompt; excessive repetition. |  

  ---

  ### Key Rationale  
  - **Avoids Name-Dropping**: Focuses on concepts (right-censoring, outside view) without citing Kahneman or specific authors.  
  - **Policy-Student Pitfalls**: Highlights common errors (e.g., missing survivorship bias, underemphasizing causality).  
  - **Depth Over Breadth**: Prioritizes critical flaws (reference class, censoring, hazard) over minor issues.  
  - **Time Management**: 700-word model answer fits a 60-minute essay; 25 marks allow granular scoring.
