prompt: |-
  For the past year a colleague and I have been arguing about longtermism, and we have agreed to put in writing exactly where we stand. He is a strong longtermist: he holds that improving the very long-term future — the world thousands and millions of years from now — is the top moral priority by a wide margin, so that even a very small probability of a very large effect on that future outweighs spending the same resources on present-day problems. I take the opposing view: that we should direct most of our effort to near- and medium-term welfare, because our estimates of far-future effects are too unreliable and rest on too many contested assumptions to bear that much weight. We both work as software engineers; neither of us has a philosophy background, and we would rather the document stand on its own than lean on names and papers, so please do not cite literature or attribute views to authors — keep it to claims, arguments, and cases.

  Draft the joint statement we could both sign. It should contain:

  1. A numbered list of claims we both accept — about the structure of our disagreement, about which premises are empirical and which are moral, and about what would count as relevant evidence. Nothing here should be a concession in disguise for either of us, and nothing should be so vague that it does no work.

  2. Our remaining disagreements, each stated in the precise form that the side holding it would accept, rather than a paraphrase the other side would use to score a point. Where a disagreement is really about how a word is being used — 'important', 'priority', 'negligible' — say so, and give the formulation that removes the verbal element.

  3. The cruxes: the sub-questions such that settling one would genuinely move at least one of us. For each, say which of us would move and in which direction.

  4. For each crux, a test, case, or argument we would both agree bears on it, with both our predictions recorded in advance. Make at least these two concrete. First, a decision-theoretic one: consider an intervention that, on its best estimate, has a one-in-a-million chance of preventing a permanent collapse of civilization and otherwise does nothing; we should agree on how to compare one dollar given to it against one dollar given to a proven near-term health intervention, and then each write down the probability at which we would stop funding it, with our reasoning. Second, an epistemic one: what a strong longtermist would have to learn — about our capacity to forecast far-future consequences, or about how sensitive the far future is to present actions — before the position collapses.

  5. A closing section on what each of us would need to be shown in order to change our mind, and whether there is anything we both agree would actually settle the matter.

  Write it as a document we would both put our names to, in neutral prose, with the agreed claims numbered and the disagreements set out in a table. Begin directly with the document itself — no preface and no restating of this request.
reasoning: |-
  We are two software engineers who have debated longtermism for the past year. This document lays out the points of agreement and disagreement between us, as well as the key questions that would change our views.

  ## 1. Agreed Claims

  We both accept the following:

  1. **Moral Weight of Future Generations**: Future people matter morally. We have some obligations to future generations, and their welfare should be considered in our decisions.

  2. **Uncertainty in Predictions**: Predicting the far future (thousands to millions of years) is subject to extreme uncertainty. This uncertainty arises from complex chains of causation, unknown technological and social developments, and potential existential risks.

  3. **Potential for Large Impacts**: It is possible that some actions taken today could have very large effects on the far future, either positive or negative. For example, reducing existential risks might prevent the permanent loss of potential future lives.

  4. **Discounting**: We do not discount future welfare simply because it occurs in the future (i.e., pure time discounting is rejected). However, we may discount future welfare due to risk of non-existence (e.g., if an existential catastrophe occurs) or other factors that reduce the probability of the welfare being realized.

  5. **Empirical and Moral Components**: The disagreement involves both empirical claims (e.g., about how the world works and our ability to predict it) and moral claims (e.g., about how to weigh different outcomes under uncertainty).

  6. **Relevance of Evidence**: Evidence that would be relevant includes:
     - Empirical studies on the predictability of long-term effects of interventions.
     - Historical cases of long-term forecasting and their accuracy.
     - Theoretical models of how present actions influence the far future (e.g., through shaping values, technology, or existential risk).
     - Moral reasoning about decision-making under extreme uncertainty and with high stakes.

  7. **Convergence of Near- and Long-Term Efforts**: Some interventions may benefit both the near-term and long-term future (e.g., improving governance, advancing science). However, we acknowledge that there are trade-offs where resources spent on one cannot be spent on the other.

  ## 2. Disagreements

  The following table presents our core disagreements. Each is stated in the form that the proponent of that view would endorse.

  | Disagreement | Longtermist's View (Colleague) | Opponent's View (My View) |
  |--------------|--------------------------------|---------------------------|
  | **Priority of Far Future** | Improving the far future is the top moral priority by a wide margin, even if the probability of success is very small, because the potential impact (in terms of total welfare) is astronomically large. | Improving near- and medium-term welfare should be the primary focus because our ability to predict and influence the far future is too unreliable to justify diverting substantial resources from more certain near-term benefits. |
  | **Weight of Uncertainty** | The uncertainty about far-future effects does not undermine the case for prioritizing them; in fact, under expected value calculations, the sheer scale of potential benefits outweighs the low probabilities and high uncertainty. | The uncertainty about far-future effects is so great that it renders expected value calculations impractical and untrustworthy. We should instead rely on more robust near-term evidence. |
  | **Negligibility Threshold** | A probability is negligible only if it is so low that even when multiplied by the potential impact, the expected value remains trivially small compared to alternative uses of resources. | A probability is negligible if it falls below a threshold where we cannot reasonably assign any confidence to the estimate due to the compounding of uncertainties. |
  | **Scope of "Important"** | An intervention is "important" if it has a high expected value, even if the expected value arises from a low-probability, high-impact outcome. | An intervention is "important" only if it has a high probability of achieving a significant effect, or if its effects are predictable and measurable within a relevant time horizon (e.g., a century). |

  ## 3. Cruxes

  The following sub-questions are critical to the disagreement. Resolving one would genuinely change at least one of our positions.

  1. **Decision-Theoretic Crux**: At what probability of success would we consider an intervention aimed at preventing a permanent collapse of civilization to be no longer worth funding, compared to a proven near-term health intervention (e.g., saving a life from malaria)?  
     - **Colleague's stance**: He would fund the long-term intervention as long as its expected value (probability multiplied by impact) is greater than that of the near-term intervention. Given the vast number of future lives at stake, he would fund it even at extremely low probabilities (e.g., 1 in a billion or lower).  
     - **My stance**: I would fund the long-term intervention only if the probability is above a threshold where the estimate is credible (e.g., at least 1 in 10,000). Below that, the uncertainty is too high to trust the expected value calculation, and the near-term intervention is preferable.  
     - **Which of us would move?** If empirical evidence showed that our ability to estimate such low probabilities is reliable (e.g., through calibration of forecasts), I would move toward longtermism. Conversely, if evidence showed that such estimates are irredeemably unreliable, my colleague might move away from longtermism for those specific interventions.

  2. **Epistemic Crux**: What would demonstrate that our capacity to forecast far-future consequences is too poor to justify longtermist priorities?  
     - **Colleague's collapse condition**: His position would collapse if it were shown that present actions have no systematic influence on the far future (e.g., because of chaotic dynamics or overwhelming external factors) or that the expected value of influencing the far future is always lower than that of near-term actions, even after accounting for scale.  
     - **My collapse condition**: My position would collapse if it were shown that we can reliably forecast far-future impacts with a degree of precision that allows for meaningful expected value calculations (e.g., through validated models or historical success in long-term predictions).  
     - **Test**: We agree to examine historical cases of long-term predictions (e.g., predictions made 100+ years ago about today's world) and assess their accuracy. We predict:  
       - *Colleague*: Even if historical predictions are poor, the stakes of the far future are so high that we must act on the best available models.  
       - *I*: Poor accuracy in historical long-term predictions would confirm the unreliability and thus undermine longtermism.  
     - **Which of us would move?** If historical analysis showed that long-term predictions are more accurate than I believe, I would move toward longtermism. If it showed they are less accurate than my colleague believes, he might adjust his confidence in specific longtermist interventions.

  ## 4. Concrete Tests

  ### Test 1: Decision-Theoretic Case
  - **Scenario**: Consider an intervention that, on its best estimate, has a probability \( p \) of preventing a permanent collapse of civilization (which would result in the loss of all future potential for humanity). If successful, it would save an astronomically large number of future lives (say, \(10^{16}\) lives). If it fails, it does nothing. Compare spending $1 on this intervention to spending $1 on a proven near-term health intervention that saves one life (e.g., by preventing a case of malaria).  
  - **Question**: At what value of \( p \) would you stop funding the long-term intervention in favor of the near-term one?  
  - **Colleague's answer**: I would fund the long-term intervention as long as \( p > 10^{-10} \) (i.e., 1 in 10 billion) because the expected lives saved (\( p \times 10^{16} \)) would be greater than 1. Even at \( p = 10^{-10} \), the expected lives saved is 1,000. I would only stop if \( p \) were so low that the expected value fell below 1.  
  - **My answer**: I would stop funding the long-term intervention when \( p < 10^{-4} \) (i.e., 1 in 10,000) because below this threshold, I consider the probability estimate too unreliable to trust. The near-term intervention is certain and measurable, so I would prioritize it.  
  - **Reasoning**:  
    - *Colleague*: The expected value calculation is compelling and should guide action even at very low probabilities.  
    - *I*: The estimate of \( p \) is based on models with unknown error margins. At very low probabilities, the error could be many orders of magnitude, making the expected value calculation meaningless.  

  ### Test 2: Epistemic Case
  - **Scenario**: What would a strong longtermist have to learn about our forecasting abilities or the sensitivity of the far future to present actions to abandon longtermism?  
  - **Colleague's collapse condition**: I would abandon strong longtermism if shown that:  
    a) The far future is completely insensitive to our present actions (e.g., because of inevitable collapse or because future outcomes are determined by factors we cannot influence).  
    b) The expected value of influencing the far future is always lower than that of near-term actions, even after accounting for the scale of the future (e.g., if the probability of success is always vanishingly small relative to the impact).  
  - **My collapse condition**: I would adopt strong longtermism if shown that:  
    a) We have reliable methods for forecasting far-future impacts (e.g., validated models with a track record of accuracy).  
    b) Present actions have a predictable and substantial leverage on the far future (e.g., reducing existential risks by 1% today leads to a 1% increase in the expected number of future lives).  
  - **Test**: We agree to study the field of existential risk reduction. If it were shown that reducing a specific existential risk (e.g., asteroid impacts) by a certain amount has a well-quantified and stable effect on the far future (e.g., increasing the expected duration of civilization by X years), that would move both of us.  
  - **Predictions**:  
    - *Colleague*: Believes such evidence exists or can be developed for key risks (e.g., AI alignment).  
    - *I*: Am skeptical that such evidence can be obtained with sufficient rigor.  

  ## 5. Closing: What Would Change Our Minds

  - **Colleague**: To change my mind, I would need to see compelling evidence that the expected value of far-future efforts is systematically lower than near-term efforts, even after accounting for the vast scale of the future. This could happen if:  
    - It is proven that the far future is inherently unpredictable and chaotic beyond a certain horizon.  
    - Near-term efforts are shown to have much higher leverage on the far future than direct long-term interventions (e.g., by building resilience or knowledge).  

  - **I**: To change my mind, I would need to see evidence that we can make reliable quantitative estimates of the long-term impacts of present actions, particularly in cases with low probabilities. This could happen if:  
    - Long-term forecasting in other domains (e.g., climate science, technology trends) shows consistent, calibrated accuracy over century-scale horizons.  
    - Specific longtermist interventions (e.g., AI governance) demonstrate a clear and measurable pathway to affecting the far future.  

  - **Settling the Matter**: We both agree that the matter could be settled by:  
    - Advances in forecasting science that either validate or invalidate long-term predictive models.  
    - Empirical data from ongoing longtermist projects showing measurable long-term impacts (though this would take time).  
    - Theoretical breakthroughs in decision theory that resolve how to act under deep uncertainty.  

  Until then, we agree to continue the discussion and update our views as new evidence emerges.

  Signed,  
  [Colleague's Name]  
  [My Name]
answer: |-
  ### Joint Statement on Longtermism

  **Agreed Claims**

  1. **Moral Significance of the Future**: Future individuals possess intrinsic moral value, and their welfare warrants consideration in our present decisions.  
  2. **Scale of Potential Impact**: Actions today could theoretically influence the far future (thousands to millions of years hence) on a massive scale, e.g., by altering humanity’s trajectory or preventing existential catastrophes.  
  3. **Uncertainty in Forecasting**: Predicting far-future outcomes involves compounding uncertainties—technological, social, and environmental—that grow with time and may render precise estimates unreliable.  
  4. **Distinction Between Empirical and Moral Premises**:  
     - Empirical: Our ability to predict long-term consequences and the sensitivity of the far future to present actions.  
     - Moral: How to weigh uncertain, large-scale future benefits against certain, immediate ones under limited resources.  
  5. **Relevant Evidence**:  
     - Data on the track record of long-term predictions in domains like climate science, economics, or technology.  
     - Models quantifying how present interventions cascade over time (e.g., risk-reduction multipliers).  
     - Frameworks for decision-making under deep uncertainty (e.g., robustness of expected value calculations).  
  6. **No Pure Time Discounting**: We reject discounting future welfare *solely* because it occurs later in time. Discounting is permissible only due to risks of non-realization (e.g., extinction).  
  7. **Resource Constraints**: Resources allocated to long-term interventions cannot simultaneously address near-term needs; trade-offs are unavoidable.  

  ---

  **Disagreements**  

  | Issue | Longtermist View (Colleague) | Opponent View (My View) |
  |-------|------------------------------|--------------------------|
  | **Priority Weighting** | Improving the far future is overwhelmingly the top moral priority: even a negligible probability of a massive positive impact outweighs near-term certain benefits. | Near- and medium-term welfare should dominate resource allocation: far-future uncertainty is too severe to justify diverting resources from tractable, measurable present needs. |  
  | **Negligibility Threshold** | A probability is "negligible" only if its product with potential impact is dwarfed by alternative actions after rigorous expected value calculation. | A probability is "negligible" when uncertainty margins exceed the estimate’s magnitude, making expected value calculations too unreliable for decisions. |  
  | **Burden of Proof** | Inaction on long-term risks carries an asymmetric burden: if an intervention has *any* credible chance of averting catastrophe, it merits funding absent disproof. | The burden lies with longtermists to demonstrate credible, non-speculative pathways to impact before diverting resources from proven near-term interventions. |  

  ---

  **Cruxes**  
  *Resolving these would genuinely shift one or both of our positions.*  

  1. **Decision-Theoretic Crux**: *What probability of success for a far-future intervention would make it lose priority to a near-term alternative?*  
     - **Colleague**: Would fund until expected value falls below near-term benchmarks (e.g., <1 life saved per dollar). For a civilization-saving intervention, this implies funding even at probabilities as low as \(10^{-12}\).  
     - **Me**: Would stop funding when probability falls below \(10^{-5}\) due to unreliability in estimation. Below this, near-term interventions dominate.  
     - **Test Case**:  
       - *Intervention A*: Costs $1, has \(p\) chance of preventing permanent collapse (saving \(10^{16}\) future lives), else does nothing.  
       - *Intervention B*: Costs $1, saves 1 life from malaria today.  
       - **Predictions**:  
         - Colleague: Fund A if \(p > 10^{-16}\) (since \(p \times 10^{16} > 1\)).  
         - Me: Fund A only if \(p > 10^{-5}\); else fund B.  
       - *Reasoning*:  
         - Colleague: Potential upside justifies minuscule probabilities if expected value exceeds alternatives.  
         - Me: Probabilities below \(10^{-5}\) cannot be distinguished from modeling noise; B’s impact is certain.  

  2. **Epistemic Crux**: *What evidence would prove our capacity to influence/forecast the far future is too weak for longtermism?*  
     - **Colleague’s Collapse Condition**: Demonstrating that present actions have no systematic effect on long-term outcomes (e.g., future trajectories are determined by uncontrollable factors like astronomical events).  
     - **My Collapse Condition**: Showing that forecasting models fail consistently in analogous domains (e.g., predicting societal outcomes beyond 100 years) and cannot be calibrated.  
     - **Test**:  
       - Analyze 50 historical predictions about century-scale outcomes (e.g., 1920s forecasts for 2020s). Measure accuracy and calibration.  
       - **Predictions**:  
         - Colleague: Expects predictions in tractable domains (e.g., climate) to show non-random skill, justifying cautious optimism.  
         - Me: Expects near-total failure in sociotechnical predictions, confirming model unreliability.  
     - **Shift**: If accuracy exceeds 70% in well-defined forecasts, I would move toward longtermism. If all forecasts fail, colleague would concede uncertainty is insurmountable *for affected domains*.  

  ---

  **Closing: Pathways to Resolution**  
  - **To Change Colleague’s Mind**: Demonstrate that:  
    (a) Key far-future levers (e.g., AI governance) are statistically decoupled from outcomes due to chaos theory or overriding forces, or  
    (b) Near-term efforts (e.g., pandemic preparedness) yield greater long-term returns by robustly increasing resilience.  
  - **To Change My Mind**: Provide:  
    (a) Validated models showing how specific interventions (e.g., nuclear security) alter extinction risk with bounded uncertainty, or  
    (b) Empirical proof that societies can reliably steer century-scale trajectories (e.g., via policy).  
  - **Settling the Matter**: We agree a combination would resolve it:  
    - A verified case where an intervention with calculable low probability (\(p < 10^{-6}\)) achieved a documented long-term impact.  
    - Theoretical disproof of aggregating impacts over deep time (e.g., moral value cannot exceed a finite bound).  

  Signed,  
  [Colleague's Name]  
  [My Name]
