answer: |-
  ### Revised Activity: "Pattern Prediction Challenge"
  **Core Goal:** Students experience Dennett's concepts (compression, stances, free-floating rationales) through predictive gameplay without jargon. The "cost per word" mechanic forces them to confront efficiency trade-offs, revealing that powerful patterns can exist without underlying minds.

  ---

  ### **Rules & Materials**  
  **Materials (Prep: 20 min):**  
  - **Box A:** Rule sheet for instructor (hidden).  
    - *Rule 1 (first half):* Output 1 if the last word spoken by you has an even syllable count; else 0.  
    - *Rule 2 (after change):* Output 1 if the last word starts with a vowel; else 0.  
  - **Box B:** Thermometer (real or simulated), hidden setpoint sheet.  
    - *Setpoint 1:* 70°F. Output 1 if temperature > 70°F; else 0.  
    - *Setpoint 2 (after change):* 72°F. Output 1 if temperature > 72°F; else 0.  
  - **Box C:** Confederate (TA/planted student) with game instructions:  
    > *"Output the opposite of the majority prediction from the previous round. Round 1: Output 0."*  
  - **Other:**  
    - Coins (poker chips or paper slips), 20 per team.  
    - Whiteboard for scores/temperatures (updated live).  
    - Timer.  

  **Teams:** 3–4 teams (3 teams of 4–5 students, or 4 teams of 3–4).  

  **Key Rules:**  
  1. **Predictions:**  
     - Cost: 1 coin per prediction.  
     - Reward: 3 coins if correct.  
  2. **Theories:**  
     - Teams may propose a general theory (not a list of past outputs) for a box.  
     - Cost: 1 coin per word (e.g., "outputs 1 when hot" = 4 words).  
     - Once bought, the theory applies to all future predictions for that box (no per-prediction cost).  
  3. **Box Sequence:** A → B → C (each gets 8–10 rounds).  
  4. **Disruptions:**  
     - Mid-Box B: Change setpoint (70°F → 72°F).  
     - Mid-Box A: Change rule (syllable parity → vowel start).  
  5. **Final Bet (Box C):**  
     - Teams stake all remaining coins on:  
       - (1) "Box C has a mind,"  
       - (2) "Box C has no mind,"  
       - (3) "No fact of the matter."  
     - Reveal confederate/rule after bets.  

  ---

  ### **90-Minute Timeline**  
  **0–5 min: Setup**  
  - Form teams, distribute coins.  
  - Explain rules (emphasize: theories save money long-term but cost words; predictions are per-round).  
  - *Demo round (non-scored):* Predict a coin flip. Show theory cost (e.g., "always heads" = 2 words).  

  **5–25 min: Box A (Physical Stance Pattern)**  
  - **Mechanics:**  
    - You say a word (e.g., "apple"), Box A outputs based on rule.  
    - Teams predict next output (cost: 1 coin), then you say a new word and reveal output.  
    - *Words:* Start simple (cat, dog, tree → outputs 0,0,1 under Rule 1). After 4 rounds, change rule.  
  - **Predictable Issues:**  
    - Teams avoid theories (word cost seems high).  
    - Post-change chaos; theories break.  
  - **Handling:**  
    - If no one buys a theory, say: "Remember, a good theory could pay off over time."  
    - If a team buys a long theory (e.g., 10+ words), let them experience poor ROI.  

  **25–45 min: Box B (Design Stance Pattern)**  
  - **Mechanics:**  
    - Announce temperature (use real data or simulate: 70°F, 71°F, 69°F, ...).  
    - Box B outputs based on setpoint.  
    - After 4 rounds, change setpoint to 72°F (don’t announce).  
  - **Predictable Issues:**  
    - Teams buy cheap theories early (e.g., "outputs 1 above 70" = 4 words).  
    - Post-change, theories fail (e.g., at 71°F, output drops to 0).  
  - **Handling:**  
    - If teams distrust theories, ask: "Did your theory work until something changed?"  

  **45–65 min: Box C (Intentional Stance Pattern)**  
  - **Mechanics:**  
    - Round 1: Teams predict Box C’s output (no prior data); confederate outputs 0.  
    - Subsequent rounds: Confederate uses majority’s previous prediction to set output (e.g., if majority predicted "1," output "0").  
  - **Predictable Issues:**  
    - Teams quickly buy intentional theories (e.g., "tries to fool us" = 4 words).  
    - Debates erupt about Box C’s "motives."  
  - **Handling:**  
    - If teams resist simple theories, note: "Complex theories cost more—is it worth it?"  

  **65–70 min: Final Bet**  
  - Teams stake all coins on Box C’s mind-status.  
  - Reveal confederate and rule.  

  **70–90 min: Debrief**  
  - **Map Activity to Dennett:**  
    | **Box** | **Dennett Concept**               | **Activity Moment**                          |  
    |---------|-----------------------------------|---------------------------------------------|  
    | A       | Physical stance                   | Costly, complex theories; broke after change. |  
    | B       | Design stance + free-floating rationale | Cheap theory ("for" a setpoint); broke when setpoint changed. Rationale existed without internal representation. |  
    | C       | Intentional stance                | Cheap theory ascribed "goals"; worked despite no mind. |  
    | Scoring | Real patterns = compression      | Winning theories paid for themselves (e.g., Box C’s 4-word theory beat brute-force predictions). |  

  - **Key Points:**  
    1. **Real Patterns:** A pattern is "real" if compressing it (into a theory) pays for itself. Box B’s "setpoint" was real until disrupted.  
    2. **Stances:** Design/intentional stances are efficient tools, not claims about internals. Box C’s "mind" wasn’t needed for the pattern.  
    3. **Free-Floating Rationale (Box B):** The setpoint was a *normative pattern* (what the system "should" do) without being represented inside the system.  
    4. **Word Count Limitation:** Acknowledge that English words are a rough proxy—real compression is information-theoretic (e.g., "above seventy" vs. ">70" might differ in bits).  

  ---

  ### **What Predictably Goes Wrong & Fixes**  
  1. **Problem:** Teams skip theories to save coins.  
     - **Fix:** Gently remind: "A 4-word theory pays off after 2 correct predictions."  
  2. **Problem:** Box C’s confederant seems "too human."  
     - **Fix:** Stress post-reveal: "The rule was mindless—yet the intentional stance worked."  
  3. **Problem:** Word-count arbitrariness (e.g., "thermostat" vs. "heat regulator").  
     - **Fix:** Debrief: "Words approximate compression. In reality, we measure bits, not grammar."  

  ---

  ### **What the Activity Can’t Reproduce (Requires Verbal Explanation)**  
  1. **Compression’s Subjectivity:** Real patterns depend on the observer’s goals. The activity assumes "prediction" is the only goal, but Dennett’s view is pragmatic—patterns are real *relative to a purpose*.  
  2. **Intentional Stance’s Depth:** In life, we use the intentional stance for rich, open-ended prediction (e.g., "beliefs" and "desires" in social dynamics). Here, it’s reduced to a binary game.  
  3. **Metaphysical Neutrality:** Dennett’s "real patterns" avoid dualism, but students may leave thinking "minds don’t exist." Clarify: "This shows minds aren’t *needed* for intentional patterns—not that they’re unreal."  

  ---

  ### **Strengths & Weaknesses of Word Count**  
  - **Weakness:** English words are arbitrary (e.g., "parity" vs. "even/odd split"). This could mislead students into thinking compression is linguistic, not mathematical.  
  - **Strength:** It makes compression tangible. Students *feel* the trade-off when a 15-word theory drains coins.  
  - **Verbal Mitigation:** In debrief, say: "Words are a stand-in for informational economy. Dennett’s point is that patterns are real when they’re efficient summaries, however you encode them."  

  **Final Note:** The activity’s power lies in students *failing*—letting costly theories bankrupt them or betting on Box C’s "mind." Lean into these moments during debrief to underscore Dennett’s pragmatism.
