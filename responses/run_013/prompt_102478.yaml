prompt: |-
  My roommate and I have been arguing about affirmative action for basically a year now and I want us to finally sit down and write the document we should have written months ago, so I'm asking you to draft it. She's a defender of group-based preferences in university admissions, and she grounds them in redress -- she has family in India and constantly brings up the reservation system there, including the "creamy layer" idea that the better-off members of a beneficiary group should be carved out, which she reads as showing that the real unit of redress is the group and not the individual. I'm the skeptic: I think any preference keyed to caste or race or sex is unjust because it throws away a merit baseline, I'd rather have income- and wealth-based preferences, and I worry about the mismatch story -- that students admitted under a big preference end up at institutions where they're relatively underprepared compared to their classmates, which I think does genuine harm even when the intentions are good. What's funny is how much we actually agree on and never say out loud: neither of us thinks "merit" is some pre-social fact just sitting there, we both think the Norwegian boardroom gender quota is a really useful test case precisely because the candidate pool and the stakes are so different from a freshman class, and we both suspect the role-model argument is quietly carrying more weight in these debates than anyone admits. So: write the joint statement that the two of us -- the redress/group-preference defender and the merit/class-based skeptic -- could both actually put our names to after a good-faith adversarial collaboration.

  I want it structured, and I want each side's own position stated in wording that side would accept as fair to itself (not a strawman I get to write for her). Give me: a short "Scope and shared starting points" section (~150 words) that pins down exactly what we're and aren't arguing about, since I have a suspicion half our fights are about different questions; then a numbered "Agreed claims" section (aim for 10-14 items) covering what we both accept about how preferences work, what "merit" does and doesn't mean, what the evidence can and can't show, and what's at stake for the beneficiaries themselves; then a "Where we still disagree" table with one row per remaining disagreement and separate columns for my wording and hers; then a "Cruxes" section, numbered, where for each crux you name the concrete case or argument that both of us would agree actually bears on it and record each side's advance prediction about how it comes out -- I'm fairly sure at least three of the cruxes are (a) whether historical wrongs are owed to groups or only to individuals, (b) whether there's a real merit baseline that preferences "abandon" or whether merit is largely constructed and the preference just makes that visible, and (c) whether the mismatch effect is real and how large, so build those in plus any others you think we've been circling. Finally, if any part of our dispute turns out to be verbal -- different senses of "quota," "preference," or "merit," say -- add a short "What turned out to be verbal" section (~1 paragraph) that says which part and why. Keep the whole thing around 1000-1400 words, and don't hedge everything into mush -- the agreed claims should be things we'd definately sign, and the disagreements should be sharp enough that a reader can see exactly where we part.
