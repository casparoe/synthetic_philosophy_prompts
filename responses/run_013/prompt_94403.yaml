prompt: |-
  I sit on the ethics panel at a women's refuge. Our staff have always been told never to lie outright: when a resident's violent ex phones asking whether she's staying here, they say they can't confirm or deny and hang up. Now the local police want us to adopt a script where staff flatly say she isn't here — the ex is phoning constantly and they reckon the can't-confirm line just keeps him at it — and they'd like our staff's statements logged so they can be used in the stalking case against him. Our chair wants a proper policy to come out of this.

  Could you draft the short written opinion I'll be circulating before Friday's meeting? I need a definite recommendation — yes or no to instructing staff to lie, with whatever conditions and time frame you'd attach — and it has to reckon honestly with Kant's line that you mustn't lie even to the murderer at the door, not just wave it off. Give the best case for whichever side you end up ruling against, too. Please commit to an actual verdict rather than surveying the options and leaving it to us.
reasoning: |-
  Okay, the user is part of an ethics panel at a women's refuge and needs a written opinion on whether staff should lie to a violent ex-partner who keeps calling. The police suggest saying "she isn't here" instead of the current "can't confirm or deny" approach, arguing it might stop the harassment. The user wants a definite yes or no, engaging with Kant's view that lying is always wrong, even to a murderer at the door. 

  First, I need to unpack the stakes. The refuge exists to protect vulnerable women from life-threatening violence. The current policy avoids outright lies but might inadvertently signal that the refuge has something to hide, potentially fueling the stalker's fixation. The police proposal aims to disrupt this cycle by delivering a firm denial that could deter further calls or create usable evidence for prosecution. 

  But Kant's objection can't be glossed over. His principle treats truth-telling as a categorical imperative – lying corrupts the very foundation of trust that human communication relies on. If the refuge institutionalizes deception, even for noble ends, it risks normalizing a tool abusers themselves use to control victims. There's also the practical risk: if an ex discovers the lie (e.g., through surveillance), it could escalate violence or discredit staff testimony in court. 

  However, Kant's rigorism feels jarringly abstract when facing a stalker's daily calls. Ethicists like Constant challenged him, arguing that truthfulness assumes a rational community – a condition shattered by someone using questions as weapons. Here, the "she isn't here" script isn't truly communication; it's a defensive tactic against coercion. The greater moral duty might be protection, not linguistic purity. 

  Still, the refuge's credibility is sacred. Survivors and courts must trust staff implicitly. A policy of strategic lies, however well-intentioned, could erode that. The police's evidential argument is compelling, but a lie could backfire if exploited in court to paint staff as unreliable. 

  The compromise? Keep the "can't confirm or deny" baseline as the ethical anchor but redefine it as an active refusal to engage, not passive evasion. Pair it with documented call logs and police collaboration to build evidence without crossing the lie threshold. This holds moral consistency while denying stalkers the engagement they seek. 

  Verdict: No to institutional lying. Uphold truth-telling as non-negotiable, but bolster the existing policy with operational rigor. The refuge's integrity must remain stainless – it's a lifeline survivors can't doubt.
