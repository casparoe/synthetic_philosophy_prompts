  On question (a): Are choices reliable for welfare? Mill likely saw them as generally reliable but not infallible. He values autonomy and diversity in *On Liberty*, so actual choices reflect individuality. Competent judges determine the hierarchy of pleasures, but individuals choose their mix. So choices are evidence, but not absolute if influenced by ignorance. However, ignorance here is about the nature of pleasures, not cognitive biases in the modern sense.

  For (b): Is there a "true preference"? Mill's qualitative hedonism involves an objective hierarchy, but it's not individual-specific laundered preferences. The competent judge sets the standard for pleasure kinds, but individuals apply this within their own lives. Mill doesn't endorse experts overriding personal tastes; he values individual development and choice in applying higher pleasures. Extrapolation: Mill might accept that individuals can misjudge due to lack of experience, but correcting that isn't the same as laundering preferences for biases.

