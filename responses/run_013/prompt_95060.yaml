  First, I need to recall Mill's key texts. The main sources are *Utilitarianism* for higher pleasures and *On Liberty* for the harm principle. The competent judge criterion in Chapter 2 is crucial: the preference of those experienced in both pleasures determines quality. But this is about kinds of pleasures, not individual welfare judgments. The harm principle emphasizes individual sovereignty unless harm to others.

