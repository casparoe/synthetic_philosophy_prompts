  Finally, in corrections, a reader points out that since many doubt her method, she should downgrade confidence in her own column. Which she dutifully does.

  The tone should mirror real advice columns - kindly but helpless, with that photo of a cardigan-clad aunt. The comedy is in her serene acceptance of positions that collapse under their own logic.

  I think this will work best if I make the letters sound genuinely distressed, while Concordia remains calmly paralyzed by her principles. The more reasonable she sounds while arriving at absurd conclusions, the sharper the satire.
