  Prolonged grief disorder is a perfect test case. HPC would point to neurobiological correlates (like dorsal anterior cingulate hyperactivity) while Hacking would emphasize how the ICD-11 criteria itself reshapes grieving norms. Testable difference: if removing diagnostic thresholds reduces symptom clustering, that supports interactivity.

  For the constructed case, "internet addiction disorder" works well as a hypothetical. HPC would demand evidence of stable neurocognitive markers across cultures, while Hacking predicts symptom profiles will morph with technological changes. I'd side with Hacking here given the lack of cross-cultural invariance in tech-related distress patterns.

