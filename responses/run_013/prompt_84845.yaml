answer: |-
  Below is a complete, ready-to-run 90-minute session design focused on experiential learning. I've made specific design choices to maximize the "squeeze" you want students to feel, using concrete numbers and clear mechanics. The session is structured in two main activities (label discounting and veil of ignorance) with the third element (single-person discounting) integrated into the debrief for efficiency. I cut the separate single-person activity to prioritize depth in the first two phases, as 90 minutes is tight and the core ethical tension (arbitrariness vs. incentive-driven bias) is best revealed through group interaction. Including it as a standalone activity would rush the veil of ignorance phase, reducing impact. Instead, I weave the single-person analogy into the final debrief to show the formal equivalence.

  ### **Session Goal**  
  Force students to confront the arbitrariness of pure time preference by:  
  1. Optimizing against an irrational discounting rule (round parity) and struggling to defend why time isn’t equally arbitrary.  
  2. Experiencing how self-interest, not ethical reasoning, drives presentism when moving from veil of ignorance to assigned time periods.  

  ### **Materials**  
  - **Whiteboard/flip chart** with pre-drawn tables (see below).  
  - **Index cards** (25 total): 15 labeled "Period 1–5" (3 per period for group work), 10 blank (for voting).  
  - **Timer** for strict phase management.  
  - **Handout** (1 per student) with activity rules and key questions (minimal text; avoids cognitive load).  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  

  #### **0–5 min: Introduction (Setting the Trap)**  
  - **Script**: "Today, you're policymakers allocating water filters in a 5-period drought. Filters save lives, but allocation rules are fixed. We start with Rule A."  
  - **Setup**: Divide 18 students into 5 groups (3–4 students each). Label groups 1–5 (their "period" for Part 2).  

  #### **5–40 min: Part 1 – Label Discounting Activity (35 min)**  
  *Goal: Optimize against round-parity discounting, then reveal it’s formally identical to time discounting.*  
  - **Rules**:  
    - 5 periods (t=1 to 5), each representing a community.  
    - 10 filters to allocate across periods (fixed total; filters = utility, each saves 1 life).  
    - **Discount rule**: Filters delivered in **odd periods (1,3,5) are halved** (save 0.5 lives each). Filters in **even periods (2,4) save 1 life each**.  
    - **Objective**: Maximize total lives saved.  
  - **Why these numbers?**  
    - 10 filters force trade-offs (e.g., shifting to even periods has clear gains).  
    - Halving in odd periods creates a 50% penalty—high enough to incentivize optimization but simple to calculate. Round parity is arbitrary and emotionally neutral (vs. name-based rules), making the analogy to time clearer.  
  - **Activity Flow**:  
    - **5–15 min**: Groups decide allocation (e.g., "How many filters to Period 1? Period 2?"). Record decisions on board:  
      | Period | 1 (odd) | 2 (even) | 3 (odd) | 4 (even) | 5 (odd) | Total |  
      |--------|---------|----------|---------|----------|---------|-------|  
      | Filters| ?       | ?        | ?       | ?        | ?       | 10    |  
    - **15–25 min**: Groups report. **Optimal allocation**: All 10 filters to even periods (e.g., 5 in t=2, 5 in t=4 = 10 lives saved). Any filter in an odd period reduces total saves (e.g., 1 filter in t=1 + 9 in t=2 = 9.5 lives).  
    - **25–35 min**: **Debrief Qs**:  
      - "Why avoid odd periods?" (They’re penalized by the rule).  
      - "Is this rule rational? Why not use round parity in real life?" *Push until they say: "It’s arbitrary—no ethical basis."*  
      - **Swap label for time**: Change rule to "Periods 1: 100% value, 2: 80%, 3: 60%, 4: 40%, 5: 20%." Reallocate filters. Groups will shift filters to t=1 (e.g., 10 in t=1 = 10 lives; 1 in t=5 = 0.2 lives).  
      - **Squeeze Q**: "What’s the difference between discounting for round parity vs. time? If you say ‘time matters,’ explain why without using uncertainty, growth, or returns." *Record answers; challenge any that smuggle in excluded concepts.*  
  - **Predictable Issues & Fixes**:  
    - **Problem**: Students defend time discounting using growth/uncertainty. **Fix**: Restate: "Assume no uncertainty, no investment returns—just pure time. Why is later *inherently* less valuable?"  
    - **Problem**: Groups split filters evenly (fairness instinct). **Fix**: Show math: "Does fairness beat saving 0.5 lives? Would you do that with real lives?"  

  #### **40–75 min: Part 2 – Veil of Ignorance Activity (35 min)**  
  *Goal: Expose how self-interest, not ethics, drives time preference after assignment to periods.*  
  - **Rules**:  
    - Same 5 periods, each with 1 community. 5 filters total (1 filter/period = baseline fair allocation).  
    - **Utility**: 1 filter always saves 1 life (no discounting).  
  - **Activity Flow**:  
    - **40–50 min**: **Behind the veil** (groups don’t know their period): "Write a rule for allocating 5 filters across periods." *Groups typically choose 1 filter/period (fair allocation).*  
    - **50–55 min**: **Assign periods**: Groups learn their period (e.g., Group 1 is t=1).  
    - **55–65 min**: **Introduce scarcity**: "Crisis! Only 4 filters left. Revise your allocation rule—vote to cut one period’s filter." Groups lobby and vote by period (1 vote/group).  
    - **65–75 min**: **Vote & reveal**: Majority (early-period groups) typically cuts a late period (e.g., t=5). Record:  
      | Vote | t-1 | t-2 | t-3 | t-4 | t-5 |  
      |------|-----|-----|-----|-----|-----|  
      | Cut? | No  | No  | No  | No  | Yes |  
  - **Debrief Qs**:  
    - "Why did you choose 1 filter/period behind the veil?" (Impartiality/fairness).  
    - "Why cut a later period after assignment?" (Self-interest).  
    - "Did anyone’s *ethical view* of time change? Or just incentives?"  
  - **Predictable Issues & Fixes**:  
    - **Problem**: Groups cut middle periods (e.g., t-3) to "compromise." **Fix**: Ask: "Why not cut t-1? Is ‘present’ defined by self-interest?"  
    - **Problem**: Late-period groups appeal to fairness. **Fix**: "Why should others sacrifice for you? Weren’t you impartial behind the veil?"  

  #### **75–90 min: Synthesis & Limitations (15 min)**  
  - **Part 3 Integration (Single-Person Analogy)**: "Imagine these periods are *you at different life stages* (t-1=young, t-5=old). Discounting future you is the same formal move—valuing a stage less because it’s later. Would you let ‘young you’ deprive ‘old you’ of filters? Why is this ethically different from discounting across people?" *Highlight: Same arbitrariness, same incentive gap.*  
  - **Debrief Map**:  
    | Activity Phase          | Key Moment                          | Teaching Point                                                                 |  
    |-------------------------|-------------------------------------|--------------------------------------------------------------------------------|  
    | Label discounting opt.  | Shifting filters to even periods    | Pure discounting is arbitrary; no inherent difference between time/labels.     |  
    | Rule swap (time)        | Defending time preference fails     | Legitimate reasons (uncertainty etc.) are separate; pure time preference is circular. |  
    | Veil allocation         | Choosing 1 filter/period            | Impartiality supports no discounting.                                          |  
    | Post-veil vote          | Cutting late-period filters         | Presentism is incentive-driven, not evidence-based.                            |  
  - **Explicit Limitations**:  
    - **The rigging issue**: This activity intentionally excludes legitimate discounting reasons (uncertainty, returns on capital, technological growth). Without them, pure time preference seems indefensible—but real-world discounting often includes these.  
    - **Mitigation in Debrief**: "In reality, we discount for valid reasons like investment returns (a filter today can build a factory to make more) or uncertainty (will humanity survive?). But these are *empirical*, not inherent to time. The point today: strip those away, and pure time preference is arbitrary or self-interested. Next session, we add complexity."  
  - **Closing Q**: "When economists say ‘obviously we discount,’ which part is ‘obvious’—the ethics or the incentives?"  

  ---

  ### **Design Choices & Defense**  
  - **Cut single-person activity as standalone**: Running it separately would truncate the veil of ignorance debrief, which needs time for emotional impact (hearing peers justify self-interest). Integrating it in synthesis maintains the formal equivalence point without new mechanics.  
  - **Round parity > name-based labels**: Round parity feels "rule-like" and neutral (no emotional baggage like names), making the time-swap analogy cleaner.  
  - **Filters (not money)**: Life-saving stakes heighten the ethical weight; students can’t dismiss it as "just economics."  
  - **10 filters in Part 1**: Forces optimization (with 5 filters, equal allocation is easier). 50% penalty is stark but mathematically simple.  
  - **Vote to cut 1 filter in Part 2**: Creates conflict—impartiality collides with self-interest. Low stakes (1 filter) keep it focused.  
  - **No group reshuffling**: Groups stay fixed to build identity with their period, amplifying incentive-driven bias.  

  ### **What the Activity Can’t Reproduce**  
  - **Real-world complexity**: Students know it’s a simulation, so self-interest may feel performative. The "aha" moment relies on them committing to the premise.  
  - **Emotional weight of future suffering**: Abstract future lives (vs. present ones) may not trigger equal empathy, potentially reinforcing discounting.  
  - **Gradual incentive effects**: Real-world presentism builds over decades; the activity compresses it into minutes, risking oversimplification.  

  This design forces the "squeeze" by making students complicit in arbitrary rules and self-interest. By the end, they’ll have said aloud that discounting without empirical justification is ethically hollow—and felt the discomfort when their excuses fail.
