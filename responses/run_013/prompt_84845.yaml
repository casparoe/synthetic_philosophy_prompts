prompt: |-
  Hey, so I'm putting together a 90-minute session for my ethics seminar — 18 students, mostly third-years, plus a couple of econ grad students who keep saying "well obviously we discount." It's the session on discounting the future and pure time preference, and I want to run it as an activity instead of talking at them, because every time I lecture it they nod along and then go right back to thinking that caring less about later stuff is just obviously rational.

  Here's the thing I want them to hit: the moment where they have to say out loud what's wrong with valuing a good less *only* because it's later, and every answer they give either (a) smuggles in uncertainty, or returns on capital, or scarcity, or (b) would equally justify caring less about a good because its blue. I want them to feel that squeeze from the inside, not hear me describe it.

  The move I want you to build the game around: run the discount as a *label* rule instead of a time rule. Same formal structure as time preference, but the thing being penalized is something arbitrary — I'm thinking round parity (goods delivered in odd-numbered periods are void, or halved), or the first letter of the recipient's name, whatever you think lands harder. Let them optimise against it, let them feel the pull of it being *the rule*, then take the label away, put later back in, and make them say what changed. If they can't find anything, that's the whole session.

  I also want a second phase where they have to write the allocation rule before they know which period they'll be alive in, then get assigned, then get to revise the allocation once they're sitting in their own period. The gap between the rule they wrote behind the veil and the vote they cast from their own seat is the other half of it — I want them to see that presentism is produced by the incentive structure rather than by anybody's considered view about time. And a third beat if it fits: re-run the allocation problem where each period is a later stage of one and the same person, so that discounting across people and discounting within a single life come out as the same formal move. If 90 minutes won't hold all three, cut one and tell me which and why, don't hedge.

  What I need in the answer: exact rules, the payoff numbers and why those numbers (commit to specific values, don't give me ranges), materials, a minute-by-minute timeline, a debrief that maps each thing that actually happened onto the distinction it's supposed to teach, what predictably goes wrong the first time and what to do when it does, and an honest paragraph on what the activity can't reproduce. In particular my game has none of the legitimate reasons to discount built into it — uncertainty about whether there'll be a future at all, returns on capital, growth making future goods cheaper — so it risks rigging the case against discounting, and I want you to say so plainly and tell me how to supply that in the debrief without wrecking the point.

  Don't cite anything, I'll add references myself. And don't hand me three variants and tell me to pick — make the design choices, alot of them are yours to make, pick the numbers, and defend them.
