prompt: |-
  I recently signed a pledge to give a significant fraction of my income to organizations that fight extreme poverty, and at a dinner last week two friends of mine, Daniel and Mira, argued about whether that kind of commitment is what morality actually requires. I did not take part, but I have been turning their exchange over in my mind, and I would like an impartial adjudication of it.

  Daniel began by saying that consequentialism is not merely demanding but abrasive. It is demanding, he said, because it requires one to keep sacrificing until the marginal cost to oneself equals the marginal benefit to others; it is abrasive because it treats one’s own projects, relationships, and talents as instruments for producing good, so that any of them may be overridden whenever something else would produce slightly more. He offered a case: suppose one could save a stranger’s life only by permanently abandoning the pursuit that gives one’s life meaning. A consequentialist, he said, must tell one to abandon it, and that shows the theory leaves no room for the distinction between the morally required and the morally supererogatory.

  Mira replied that this conflates a criterion of rightness with a decision procedure. Consequentialism can hold that the right act is the one that maximizes expected value while permitting agents to use heuristics, rules of thumb, and partial attachments to approximate that criterion. She added that the demandingness objection is often question-begging: it assumes that common-sense morality’s permission to favor oneself is a fixed constraint on any acceptable theory, whereas an impartialist will deny precisely that. She also said that if the objection proves anything, it proves too much, since any morality that takes impartiality seriously will sometimes demand that we sacrifice our projects.

  Daniel responded that the decision-procedure reply is evasive. If one never actually uses the consequentialist criterion to decide what to do, he said, one is not living as a consequentialist; one is following rules and giving them a consequentialist label. He also said that the “proves too much” reply misses a distinction between demandingness and abrasiveness: a theory may demand that one give up a kidney without demanding that one treat one’s own life as a mere resource. He claimed that any acceptable morality must be one an agent can own from the inside, and that a theory which tells one to regard one’s deepest commitments as fungible cannot be owned by anyone with a life to live.

  Mira answered that this is either an empirical claim about what people can psychologically sustain or a normative claim smuggled in as a constraint. If it is empirical, it may be true but irrelevant to what is right. If it is normative, it needs an argument, and the argument cannot be that the theory makes one feel bad. She also pointed out that Daniel’s case is underdescribed: if the pursuit really is less valuable than the life one could save, why should its meaning for the agent outweigh the stranger’s survival? She noted that consequentialists can accept agent-relative prerogatives as a concession to human psychology without treating them as fundamental.

  Daniel replied that the case is not underdescribed; it is designed to isolate the value of a life project from its consequences. He said Mira’s reply assumes that the only reason to care about one’s own projects is the good they produce, which is precisely what is in dispute. He also said that the arbitrariness of any cost threshold cuts against consequentialism, not for it: if there is no principled point at which sacrifice stops, then the theory cannot be action-guiding in the way a moral theory must be. Mira said the threshold is not arbitrary if it is set by the criterion itself: sacrifice until further sacrifice would produce less good. Daniel said that is not a threshold an agent can live by.

  Please adjudicate their exchange point by point rather than simply choosing a side. For each main move, say whether it is clearly mistaken, partly right, or clearly right, and explain why. Address at least: (1) whether the demandingness objection is question-begging; (2) whether the criterion/decision-procedure distinction saves consequentialism from Daniel’s reply; (3) whether the demandingness objection should be distinguished from an abrasiveness objection about treating one’s projects as fungible; (4) whether Daniel’s life-project case has force or is underdescribed; (5) whether the absence of a principled cost threshold is a problem for consequentialism or simply a consequence of the view; and (6) what, if anything, both parties are missing. End with a verdict about who is more right overall, and what a defensible consequentialist position would have to concede.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex philosophical debate between Daniel and Mira about consequentialism's demandingness, requesting point-by-point adjudication. I need to carefully analyze each argument while maintaining impartiality.

  First considering Daniel's abrasiveness objection: he distinguishes demandingness (sacrifice level) from abrasiveness (instrumentalization of personal commitments). This seems valid - even if a theory demands equal sacrifice, how it frames personal commitments matters ethically. The kidney vs life-project example effectively isolates this concern.

  Mira's decision-procedure defense is strong theoretically but Daniel rightly questions its practical implementation. If consequentialists never actually use maximization in daily decisions, is it still their guiding principle? This exposes a tension between theory and practice that needs resolution.

  Regarding the question-begging charge: Mira correctly notes that common-sense morality can't be presumed in evaluating theories. However, Daniel's "owning from within" point suggests deeper issues about moral psychology that consequentialism must address, not dismiss.

  The life-project case is well-designed to test fundamental values. By stipulating equivalent consequences, Daniel forces confrontation over whether personal meaning has intrinsic value. Mira's response assumes the very consequentialist framework being challenged, which weakens her rebuttal.

  The threshold problem cuts both ways. Mira's marginal utility answer is logically consistent but Daniel highlights practical guidance issues. Neither fully resolves how humans can implement this mathematically precise yet psychologically nebulous standard.

  Both miss important nuances: Daniel underestimates how psychological concessions might preserve consequentialism's core, while Mira overlooks how alienation might undermine moral motivation long-term. The debate needs more empirical grounding about sustainable moral practices.

  Overall, Daniel's challenges about fungibility and psychological ownership seem more philosophically significant. A defensible consequentialism would need to incorporate agent-relative value without abandoning impartiality - perhaps through sophisticated accounts of personal integrity or indirect utilitarianism.
answer: |-
  Here is a point-by-point adjudication of Daniel and Mira's exchange, followed by an overall verdict:

  **1. Whether the demandingness objection is question-begging (Mira's claim):**  
  *   **Partly Right.** Mira correctly identifies that *some* demandingness objections rely on unexamined common-sense intuitions about permissible partiality, which an impartialist theory like consequentialism explicitly rejects. Simply asserting that consequentialism is "too demanding" *because* it violates these intuitions does indeed beg the question against impartialism.
  *   **But...** Daniel's stronger point (developed later) isn't *just* about demandingness (how much sacrifice) but about *abrasiveness* (the *character* of the demand – treating one's life as fungible). This deeper objection targets the *structure* of value within consequentialism itself, not merely its conflict with common-sense permissions. *That* objection isn't necessarily question-begging; it argues that consequentialism misrepresents the nature of human value and agency.

  **2. Whether the criterion/decision-procedure distinction saves consequentialism from Daniel's reply:**  
  *   **Partly Right, but Daniel has a point.** Mira is **clearly right** that the distinction is valid and important. Consequentialism is fundamentally about what makes acts right (criterion: maximizing expected value), not necessarily about how agents *deliberate*. Using rules, heuristics, and cultivating attachments *can* be the best way to approximate good consequences overall, especially given human limitations.
  *   **But Daniel is also Partly Right** in calling this potentially "evasive." His core concern isn't just about deliberation but about *commitment* and *identity*. If an agent's *fundamental reason* for adhering to the rules/heuristics is solely to maximize impersonal value, and they remain psychologically prepared to override *any* project if a calculation showed slightly more value elsewhere, then Daniel argues this instrumentalizes the projects. The agent doesn't *genuinely* value the project non-instrumentally; it's contingent on its consequence-producing efficiency. This *attitude*, he claims, is corrosive to "owning" one's life, even if the decision-procedure rarely triggers actual abandonment.

  **3. Whether demandingness should be distinguished from abrasiveness (Daniel's claim):**  
  *   **Clearly Right.** Daniel's distinction is crucial and insightful.
      *   **Demandingness:** Concerns the *amount* of sacrifice required (time, money, effort, organs).
      *   **Abrasiveness:** Concerns the *attitude* or *evaluative stance* the theory demands towards one's own life, projects, and relationships – treating them as having no intrinsic, non-fungible value, only instrumental value relative to maximizing the good. This is about alienation or instrumentalization.
  *   A theory can be demanding without being abrasive (e.g., demanding significant resource transfers while still valuing personal integrity and projects intrinsically). Consequentialism, due to its purely instrumental view of *all* value (including the agent's own life), faces the unique challenge of abrasiveness. Daniel's kidney vs. life-project example effectively illustrates this distinction.

  **4. Whether Daniel's life-project case has force or is underdescribed (Mira's claim):**  
  *   **Daniel's case has force, and Mira's underdescription charge largely misses the mark.**
      *   **Force:** The case is specifically designed to isolate the value of a life project *from* its consequence-producing value. By stipulation, pursuing the project vs. saving the life produces *exactly the same amount* of overall good. The *only* difference is that the project gives *this specific agent's life* deep meaning. The case forces the question: Does the intrinsic meaning *for the agent* have moral weight *beyond* its contribution to the impersonal good? Consequentialism says no; the agent must abandon it. Daniel argues this demonstrates the theory's failure to recognize the non-instrumental value of personal integrity and meaning.
      *   **Underdescription?** Mira argues the case assumes the project is less valuable, but that's precisely what Daniel denies by setup – they produce *equal* good. Her reply ("why should meaning outweigh survival?") *assumes* the consequentialist framework where only impersonal consequences matter, which is the point in dispute. Daniel's case challenges that very framework by positing a value (meaning-for-the-agent) that consequentialism cannot accommodate. The case is adequately described for its purpose: to test the theory's commitment to the fungibility of the agent's projects.

  **5. Whether absence of a principled cost threshold is a problem for consequentialism:**  
  *   **Partly Right for Both, but Ultimately More Problematic for Daniel's critique.**
      *   Mira is **clearly right** that the "threshold" is defined by the theory itself: sacrifice until marginal cost = marginal benefit. This is *principled* within consequentialism's terms. It's a direct consequence of maximizing the good. Daniel calling it "arbitrary" is misleading; it's derived from the core principle.
      *   Daniel is **partly right** that this *can* make the theory difficult to apply perfectly in practice (calculating marginal utility is complex). However, consequentialism readily accepts this and offers heuristics (as per the decision-procedure distinction) to manage it.
      *   Where Daniel has a point is in his claim "that is not a threshold an agent can *live by*." This connects back to abrasiveness. The *psychological burden* of knowing that *any* resource kept for oneself *might* be doing more good elsewhere, even if you use rules to manage it, can be immense and alienating. The *logical* lack of a fixed threshold exacerbates the *psychological* challenge of living under constant potential obligation. This is less a flaw in the theory's logic and more a challenge to its practical sustainability and compatibility with human flourishing.

  **6. What both parties are missing:**  
  *   **Daniel:** Underestimates the resources within sophisticated consequentialism (like sophisticated indirect consequentialism or scalar consequentialism) to *incorporate* the value of personal integrity, relationships, and sustainable motivation *within* the framework as psychologically necessary *means* to producing good consequences long-term. He sometimes treats the "direct application" model as the only consequentialist option.
  *   **Mira:** Tends to downplay the depth of the abrasiveness challenge. Even if rules are used, the agent's *ultimate reason* for adhering to them (to maximize impersonal good) means their deepest commitments are *contingent* on that calculus. This potential for alienation and the sense of one's life being merely a vessel for value production is a significant psychological and normative concern not fully addressed by the decision-procedure distinction alone. She also sometimes dismisses the "owning from within" requirement too quickly; while needing argument, it reflects a deep intuition about agency that moral theories must grapple with.
  *   **Both:** Could engage more with the empirical question: Is a life lived under the constant *knowledge* that one's projects are fundamentally fungible instruments for good production psychologically sustainable or conducive to human flourishing? Does it risk burnout, resentment, or a loss of meaning that ultimately *undermines* the ability to do good? This connects the normative debate to moral psychology.

  **Overall Verdict:**

  *   **Daniel is More Right on the Core Issue.** While Mira effectively defends consequentialism against simplistic demandingness objections and correctly deploys the criterion/decision-procedure distinction, Daniel successfully identifies and presses a deeper, more philosophically significant challenge: **abrasiveness**. His distinction between demandingness and abrasiveness is crucial, and his life-project case effectively exposes a genuine tension between consequentialism's purely instrumental view of the agent's own life and the intuition that personal integrity, meaning, and "owning one's life" have intrinsic, non-fungible value. The concern that a theory demanding one view one's deepest commitments as contingent instruments is difficult to "own from the inside" is powerful and not fully resolved by consequentialist concessions about decision procedures.

  *   **What a Defensible Consequentialism Must Concede:** A defensible consequentialist position must concede that:
      1.  **Pure Act Consequentialism as a Direct Decision Procedure is Abrasive:** Applying the maximizing criterion directly and constantly *does* demand an instrumental attitude incompatible with deeply valuing one's own projects non-contingently.
      2.  **The Value of "Integrity" is Not Easily Accommodated:** While consequentialism can value projects *instrumentally* for the good they produce *and* for the psychological benefits (sustainability, motivation), it struggles to recognize the *intrinsic*, agent-relative value of a person living out their own commitments *for their own sake* in a way that grants them genuine normative weight against competing impersonal goods, especially in hypotheticals like Daniel's life-project case.
      3.  **Psychological Sustainability is a Serious Challenge:** The *knowledge* that one's ultimate justification rests on impersonal maximization, even if using rules, creates a psychological burden (the "fungibility awareness") that the theory must take seriously as a potential obstacle to its own aims and to human well-being. Defensible consequentialism must incorporate robust psychological insights into sustainable moral motivation and the importance of non-instrumental self-regard, potentially adopting a strongly indirect form where the maximizing criterion governs rules and institutions, not necessarily the agent's moment-to-moment deliberations or self-conception. It must acknowledge that living solely as a "saint of rationality" focused on marginal utility is likely untenable and potentially self-defeating.
