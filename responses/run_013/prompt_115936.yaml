answer: |-
  **Joint Statement on Radical Interpretation**

  1.  Both agree that successful interpretation requires triangulation: attributing meaning to an utterance depends holistically on attributing beliefs to the speaker, all constrained by patterns of observable behavior (especially assent/dissent) and the interpreter's own conceptual scheme, rejecting the possibility of wholesale error or nonsensical belief attribution.
  2.  Both affirm the indeterminacy of reference and translation: no unique "correct" assignment of reference or translation manual is dictated solely by behavioral evidence; equally adequate but non-equivalent manuals are always possible, demonstrating that meaning is interpreter-relative and not fixed by pre-theoretic facts.
  3.  Both concur that what is commonly called "knowing a language" names a complex disposition: the reliable tendency of speakers and interpreters within a community to converge on sufficiently similar passing theories in ordinary circumstances, enabling communication without implying the existence of a stable, determinate, shared object (a "language") prior to or independent of interpretive acts.
  4.  We identify a verbal dispute concerning "shared language": One camp uses the term to denote the dispositional convergence described in (3), seeing it as the only existent phenomenon; the other uses it to denote the stable public structure they posit *as the necessary precondition and explanation* for the possibility of such convergence and the disposition itself, arguing its absence renders interpretation impossible.
  5.  The substantive crux is whether determinate interpretation requires prior conventional exposure: The test case is a radically novel interpreter, possessing no prior exposure to any conventions of the speaker's community, encountering the speaker for the first time. One camp predicts successful interpretation is impossible absent such exposure, as no basis for convergence exists; the other predicts it is possible in principle through brilliant hypothesis formation, as convergence defines meaning itself.
