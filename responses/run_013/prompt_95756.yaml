prompt: |-
  I have been trying to work out what the law of armed conflict must believe about moral responsibility, and I keep colliding with a pattern I cannot make sense of.

  A soldier in a regular army who kills an enemy soldier in battle commits no crime. He is not a murderer, he cannot be tried for it, and if he is captured he is a prisoner of war rather than a criminal — and this holds whichever side he is on. The conscript serving an aggressor enjoys exactly the same legal privilege to kill as the soldier defending his own country against that aggression. Yet the same body of law is not neutral about the war itself. The international crime of aggression is a leadership crime: by definition only those who control or direct a state's political or military action can commit it. The ministers and generals who launch the war are criminals; the men who fight it are not, and cannot be, however unjust the war. And the privilege does not reach everyone who kills a soldier. A fighter who does not satisfy the conditions the law sets for lawful belligerency — who is not under responsible command, bears no fixed distinctive sign, carries arms openly only intermittently — can be prosecuted in an ordinary criminal court for murdering a soldier whom a uniformed soldier standing beside him could have killed with complete impunity. Meanwhile, the very law that treats the justice of the war as beyond a soldier's competence insists that he must disobey a manifestly unlawful order and that superior orders are no defence to atrocity. He is incompetent to judge the ends he serves and competent, indeed obligated, to judge the means.

  Reconstruct the theory of moral responsibility this practice presupposes. Is killing enemy combatants not wrong at all, a permission attaching to a role and therefore available to whoever occupies it? Or is it ordinarily wrong and merely excused here, by non-culpable ignorance, duress, or the impossibility of refusal — and if so, does the excuse hold equally for the aggressor's conscript and for the man defending his home? Does the practice strictly require the moral equality of combatants, or does it need only a symmetric rule, justified by reciprocity, discipline, and the hopelessness of asking soldiers to adjudicate their own cause, beneath which a thoroughly asymmetric morality could sit unnoticed? Which rival views does the practice quietly rule out — in particular the picture of war as a police action, on which one side's soldiers are doing something like police work and the other side's are doing something like murder? Does the whole arrangement hang together, given that it deems the soldier unable to judge the justice of the war but obligated to judge the lawfulness of an order? And where is it merely underdetermined, so that several incompatible theories would license it exactly as it stands?

  Finally, tell me what would have to change — in the privilege itself, in prisoner-of-war status, in war crimes prosecution, in veterans' benefits, in the way the dead of both sides are honoured — if we replaced the presupposed view with the view that unjust combatants do something seriously wrong and are at most excused for it. Argue it out in your own words; I do not want a reading list or citations.
reasoning: |-
  Okay, this user is wrestling with a profound contradiction in the laws of armed conflict. They've noticed that soldiers aren't held responsible for killing enemy combatants, regardless of which side they're on or whether the war is just. Yet the leaders who start unjust wars face criminal liability. Meanwhile, soldiers are expected to disobey unlawful orders, suggesting they have moral agency in some contexts but not others.  

  The user wants me to reconstruct the underlying moral theory behind these rules. They're asking several layered questions: Is combatant killing inherently permissible or merely excused? Does the law require moral equality between soldiers, or is it just a practical symmetry? How can soldiers be deemed incompetent to judge a war's justice but competent to judge individual orders? And crucially—what would change if we adopted the view that unjust combatants commit wrongful acts that might only be excused?  

  Hmm. The core tension here is between individual moral responsibility and systemic necessity. The law seems to treat soldiers as instruments of the state when it comes to *why* they fight (hence immunity for killing in aggression), but as moral agents when it comes to *how* they fight (hence the duty to refuse unlawful orders). This isn't arbitrary—it reflects war's unique nature as collective violence where individual volition is constrained by hierarchy, propaganda, and coercion.  

  For the "replacement view" scenario: If we treated unjust combatants as doing something morally wrong (even if excused), everything would fracture. Prisoner-of-war status might become conditional on fighting for a just cause. Veterans' benefits could hinge on moral scrutiny of wars. Honoring the dead would turn partisan. But this would collapse the entire framework—soldiers would need to adjudicate wars in real-time, reciprocity between enemies would vanish, and wars might become even more brutal without shared rules.  

  The user’s frustration with the "incompetent to judge ends but competent to judge means" paradox is spot-on. The law resolves this by outsourcing the "ends" judgment to international bodies (like the ICC for aggression) while keeping "means" judgments at the soldier level because atrocities are often immediately verifiable (e.g., shooting civilians needs no geopolitical analysis). It’s a pragmatic division of labor, not a philosophical one.  

  Quietly, this practice rules out the "police action" model of war. Police act with domestic legitimacy; soldiers act under mutual recognition of role-based permissions. If one side were "police," their enemies wouldn't qualify for combatant immunity—they'd just be criminals. But the laws of war deliberately avoid this; it's why they distinguish *jus ad bellum* (war's legality) from *jus in bello* (conduct in war).  

  ...I should emphasize that the current system isn’t claiming soldiers are *morally* equal—only that their legal privileges are symmetric for functional reasons. The law builds a firebreak between the morality of war and its regulation. That’s why it holds together despite the tension: it prioritizes containing horrors over assigning blame for participation.
answer: |-
  The law of armed conflict (LOAC) rests on a **pragmatic moral architecture** that distinguishes sharply between *political responsibility* for war and *individual responsibility* within war. Its core presupposition is this: **War is a distinct moral domain where systemic violence is regulated by mutual recognition of roles, not by individual moral assessment of the war's justice.** Here's the reconstruction:

  ### Core Presuppositions of Moral Responsibility in LOAC
  1. **Role-Based Permissions:** Killing combatants is **not inherently wrong**; it is a *permissible act* tied to the status of "lawful combatant." This status is a legal role granted by compliance with LOAC criteria (uniforms, command structure, etc.). The permission stems from the collective recognition that states have a right to use force, and soldiers are their instruments.  
  2. **Separation of *Jus ad Bellum* and *Jus in Bello*:**  
     - *Jus ad Bellum* (justice of war) is a **leadership responsibility**. Only those with authority to initiate war can bear criminal guilt for aggression.  
     - *Jus in Bello* (conduct in war) is a **universal soldier responsibility**. All combatants, regardless of side, are bound by identical rules and enjoy identical privileges *if* they qualify as lawful combatants.  
  3. **Moral Equality of Combatants (Functional, Not Absolute):**  
     - Soldiers are **not morally equal** in an abstract sense. An aggressor’s soldier may serve an unjust cause.  
     - However, LOAC treats them **functionally symmetrically** because:  
       - **Reciprocity:** Without mutual privileges, compliance with rules (e.g., POW treatment) collapses.  
       - **Epistemic Limitation:** Soldiers cannot reliably adjudicate the war’s justice amid propaganda, fog of war, and state coercion.  
       - **Coercion & Duress:** Conscription, patriotism, and severe penalties for desertion create systemic pressures excusing participation in *unjust wars*.  
  4. **Conditional Moral Agency:**  
     - Soldiers are **presumed incompetent** to judge *why* they fight (the war’s justice), due to structural constraints.  
     - They are **required competent** to judge *how* they fight (atrocities), because LOAC violations (murder, torture) are **manifestly unlawful** – their wrongfulness is self-evident and transcends context. A soldier can recognize an atrocity without geopolitical analysis.  

  ### What Does This Quietly Rule Out?
  - **The "Police Action" Model:** LOAC rejects the view that war is law enforcement where one side are "officers" and the other "criminals." This model would deny reciprocity, incentivize unrestrained violence against "illegitimate" fighters, and collapse the distinction between combatants and civilians.  
  - **Full Moral Symmetry:** LOAC doesn’t claim soldiers are *equally virtuous*, only that their *legal privileges and duties* must be symmetric for war-regulation to function.  
  - **Individual *Jus ad Bellum* Liability:** Soldiers cannot be tried for fighting in an unjust war *as such* – only for *how* they fought.  

  ### Does It Hang Together?  
  Yes, **pragmatically**. The tension between "incompetent to judge the war, competent to judge orders" is resolved by:  
  - **Scope of Judgment:** Soldiers need only recognize gross violations of *humanity* (e.g., shooting civilians), not complex geopolitical justice.  
  - **Institutional Division of Labor:** Leaders bear *strategic* guilt; soldiers bear *tactical* guilt. LOAC assumes soldiers are moral agents for immediate acts but victims of structural forces for the war itself.  

  ### If We Replaced the Presupposed View: The "Unjust Combatant as Wrongdoer (Excused)" Model  
  Suppose we adopt: *"Unjust combatants commit a morally wrongful act (killing for aggression) but are excused by duress/ignorance."* This would unravel LOAC’s architecture:  

  1. **Privilege to Kill:**  
     - The "permission" becomes an **excuse**, not a right. Killing an enemy soldier is *prima facie* murder, excused only if the soldier was non-culpably ignorant or coerced.  
     - **Consequence:** Legal asymmetry. A soldier defending against aggression could kill with impunity; an aggressor’s soldier could only plead excuse at trial.  

  2. **POW Status:**  
     - **Abolished for "unjust" combatants.** Captured aggressor soldiers would be "accused murderers awaiting excuse adjudication," not POWs. Detention becomes punitive, not administrative.  
     - **Consequence:** Reciprocity collapses. States would deny POW status to enemies, leading to mistreatment and retaliation.  

  3. **War Crimes Prosecution:**  
     - **Every killing by an unjust combatant** becomes a potential murder trial. Commanders could be liable for "conspiracy to murder" by deploying troops.  
     - **Consequence:** Overwhelmed courts; soldiers paralyzed by legal risk.  

  4. **Veterans' Benefits & Honor:**  
     - Veterans of unjust wars are **moral pariahs**. Benefits denied or stigmatized as "support for criminals."  
     - **Consequence:** National memorials split into "heroes" (just side) and "excused offenders" (unjust side). Social cohesion fractures.  

  5. **Combatant Distinction:**  
     - **Irrelevant for moral guilt.** An unlawful combatant (e.g., guerrilla) killing a soldier remains a murderer, but a uniformed aggressor doing the same is *also* a murderer (though excused). The legal distinction collapses into moral culpability for the war itself.  

  ### Why LOAC Rejects This Model  
  - **Functional Impossibility:** Soldiers cannot litigate the war’s justice in real-time. Requiring them to refuse service in "unjust" wars ignores conscription, propaganda, and lethal penalties for desertion.  
  - **Total War Incentive:** If the enemy are "murderers," no restraint is owed. Atrocities escalate.  
  - **Victimhood of Soldiers:** LOAC recognizes that soldiers (especially conscripts) are **tools and victims** of state decisions. Punishing them confuses agency.  

  ### Conclusion  
  LOAC’s moral theory is **institutionally realist**: it prioritizes regulating violence over assigning blame for participation. It assumes soldiers are **moral agents for atrocities** (which are context-independent wrongs) but **moral patients for the war** (whose justice is beyond their capacity and autonomy to judge). Replacing this with individual moral liability for fighting in unjust wars would convert war into total moral anarchy, destroy reciprocal restraint, and burden soldiers with impossible judgments. The practice hangs together not because soldiers are *morally equal*, but because treating them *legally equally* is the only way to mitigate war’s horrors – beneath which asymmetric moral truths persist, legally unadjudicated.
