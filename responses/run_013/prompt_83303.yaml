  - **Leaf D (speaker-sensitive) vs. Leaf G (invariant assertability):** *Use a case where the speaker’s context changes, but the subject’s remains fixed.*  
    Example: A speaker initially in low stakes says, “S knows p,” then shifts to high stakes (same conversation) and says, “S does not know p.” Does the truth value change? If yes → Leaf D; if no → Leaf G.  
  - **Leaf H (norms of action) vs. Leaf G (invariant assertability):** *Use a case where action is proper but assertion is not.*  
    Example: It is proper for a subject to act on p in high stakes, but improper to say “I know p.” If this asymmetry holds → Leaf H; if both are improper → Leaf G.  
  - **Leaf F (error theory) vs. Leaf I (non-truth-apt):** *Use a case about factual disagreement.*  
    Example: Two speakers dispute whether “S knows p” is true. If this dispute is factual → Leaf F; if it is non-factual → Leaf I.  

  **Case Usage in Branches:**  
  - **Low-stakes bystander ascribes to high-stakes subject (Node 1):** Separates contextualist/relativist views (Yes) from invariantist ones (No). Tied leaves pre-branch: All. Post-branch: Yes → B, C, D; No → A, E, F, G, H, I, J.  
  - **High-stakes speaker assessing low-stakes subject (mirror image, not an explicit node):** Covered in Node 2 (high-stakes listener) and Node 7 (speaker’s context change). Decides between speaker/assessor sensitivity. Tied leaves: Resolved by Nodes 2, 5, 7.  
  - **Later assessor with differing stakes (Node 4):** Separates relativism (Yes) from other context-sensitive views (No). Tied leaves: B vs. C/D.  
  - **Fixed evidence, varied stakes (Node 6):** Separates views where epistemic factors shift (Yes/No for Emma) from invariantism (Yes for both). Tied leaves: E vs. G/H/I.  
  - **Fixed belief, reliance in acting changes (Node 8):** Tests knowledge retention under practical shifts. Decides between invariantism (Yes) and views denying it (No, but invalid in path). Tied leaves: None (invalid if No).  
  - **Improper to say "knows" even if true (Nodes 10–11):** Separates pragmatic, normative, and error-theoretic invariantism. Tied leaves: G, H, I.
