prompt: |-
  Ok, I've been reading too much about sortition — picking people for political jobs by lottery — and my gut verdicts don't fit together. I want the principle, or the closest thing to one, plus which of my verdicts has to go.

  Here's where I actually land, case by case:

  1. Jury duty, picked by lot off the register: fine. Not a regrettable compromise, the right way to do it.
  2. A citizens' assembly — 500 people picked at random, paid, briefed by experts, deliberating for months on whether to change the voting system, recommendation going to a referendum: fine, and the recent Irish experiments make me think it's the best institutional idea in decades.
  3. Same assembly, same procedure, but the question is wether a specific named man should be deported: not fine. Feels like a mob that's been taught manners.
  4. Picking at random among the forty people who've passed a judicial competence exam and appointing one of them a judge: fine.
  5. Picking one citizen at random and making them sole ruler for a day, briefing them as much as you like: not fine.
  6. Coin flip between two parents, both fit, for sole custody: not fine.
  7. Lottery among equally eligible patients for the single kidney: fine, better than the transplant board deciding.
  8. Lottery for conscription when you only need a third of the cohort: fine, or at least I can't beat it, even though it's handing out a burden rather than a benefit and I still feel ok about it.
  9. Coin flip between two sites for a new hospital when the cost-benefit analysis is a geniune dead heat: fine.
  10. Coin flip between two equally good maths textbooks for the district: not fine, and I can't say why that one bugs me when the hospital one doesn't.
  11. A randomly chosen panel of 500 citizens that can veto any statute, the legislature needing two thirds to override: I think this is a genuinely good idea.
  12. Replacing the legislature entirely with a random 500, no elections at all: against it, which surprises me given 11 and 2.
  13. Stratifying the assembly by age, sex and region so it's a miniature of the country: fine.
  14. Stratifying the jury by ethnicity: uneasy, but I suspect that's only because I've heard it argued badly. Can't tell.
  15. A lottery you can pay to opt out of, like a fine for skipping jury duty, applied to the assembly: not fine, and this one I'm sure about.
  16. An assembly drawn only from people who volunteered for it: not fine, that's just a poll of activists.

  My own rough guess at a principle is something like: the lot is legitimate when it's choosing a decider (impartiality) and when it's breaking a genuine tie (equal claims), and illegitimate when it's settling something that reasons could settle, or when what's being handed out isn't fungible. But that already looks shaky. The impartiality clause is meant to carry 1, 2, 4, 11 and maybe 13. The tie clause is meant to carry 7, 8 and 9. The "reasons could settle it" bit is meant to carry 3, 10 and 16. And "not fungible" is meant to carry 5, 6 and 12. Except 11 has the panel deciding contested questions where reasons obviously matter, and 7 has the lot settling a real person's fate, not just choosing who does the settling. So the two halves of my guess are eating each other.

  What I want: the best principle, or small set of them, that keeps as many of 1–16 as possible, stated precisely enough that I could apply it to a new case myself, with a note of which clause is earning its keep on the strength of which verdict. Then tell me which verdicts I should surrender, since I'd rather lose one or two than keep something that's just a list of cases in a trenchcoat. And say what your principle predicts for two cases I haven't listed: (a) a lottery for the order in which two equally urgent, equally survivable patients get the operating theatre tonight, and (b) a rule under which any citizen can be selected by lot to sit for three years on the central bank's rate-setting board, with the same vote as everyone else on it.
reasoning: |-
  Hmm, the user has presented an interesting philosophical puzzle about the legitimacy of sortition across various scenarios. They've listed 16 specific cases where they have intuitive judgments about whether random selection is appropriate or not, and they're struggling to find a coherent principle that explains all their intuitions.

  Looking at their cases, I notice several patterns emerging. Cases like jury duty (1) and citizens' assemblies (2) feel right to them, while individual dictators (5) or random custody decisions (6) feel wrong. They've tentatively proposed a principle involving impartiality, tie-breaking, and fungibility, but they rightly point out contradictions - like how the kidney lottery (7) directly decides fates while still feeling legitimate.

  The user seems genuinely interested in political philosophy and wants a rigorous framework. Their frustration with inconsistent intuitions suggests they value intellectual coherence. They're explicitly asking to sacrifice some judgments for a better principle - showing admirable philosophical integrity.

  For my analysis, I'm considering three core principles that might explain most cases:
  1) The Delegation Principle: Sortition works best when selecting who decides, not what is decided (explaining why juries work but random dictators don't)
  2) The Tie-Breaking Principle: Randomness is legitimate when options are truly equal (covering kidney allocation and hospital sites)
  3) The Fungibility Requirement: Selected individuals must be functionally interchangeable (addressing why stratification feels okay but self-selection doesn't)

  These principles seem to cover about 14 of their 16 cases. The problematic ones appear to be the textbook selection (10) and the stratified jury (14). For the textbook case, they might need to accept that if cost-benefit analysis is truly equal, randomness should be acceptable - same as the hospital. For jury stratification, if demographics affect trial fairness, proportional representation might be justified under the Delegation Principle's impartiality requirement.

  For their new cases: 
  (a) The surgery order lottery fits Tie-Breaking perfectly since patients are equally urgent. 
  (b) The central bank appointment likely violates Delegation Principle - monetary policy requires expertise, and random citizens aren't fungible with economists.

  The user's self-awareness about their judgments being "a list of cases in a trenchcoat" is spot on. By sacrificing just two intuitions (about textbooks and stratified juries), they can achieve a much more coherent framework. The key insight is distinguishing when randomness selects decision-makers versus when it makes substantive decisions - and recognizing that true fungibility is rare for complex roles.
answer: |-
  Based on your case-by-case verdicts and the goal of finding a coherent, minimally sacrificial principle, here's the best framework:

  **The Core Principle: Legitimate Sortition requires *Procedural Justification*, not Substantive Decision-Making.**

  This breaks down into three sub-principles:

  1.  **The Delegation Principle:** Sortition is legitimate for selecting **who decides** (agents), *not* **what is decided** (outcomes). The legitimacy derives from the *procedure* selecting impartial/representative agents, *not* from the randomness itself determining the substantive outcome.
      *   *Justifies:* 1 (Jury - decides guilt), 2 (Assembly - decides recommendation), 4 (Judge - decides cases), 11 (Veto Panel - decides veto), 13 (Stratified Assembly - still agents), 14 (Stratified Jury - still agents, if justified for impartiality).
      *   *Clarifies the Distinction:* This is why 3 (Deportation) feels wrong: the assembly *is* deciding the substantive outcome itself ("deport yes/no"), not delegating *who* makes that decision (e.g., a judge). Similarly, 5 (Sole Ruler) is wrong because the ruler *is* the sole decider of substantive outcomes. 12 (Replacing Legislature) is wrong because the assembly *becomes* the substantive decision-maker on all legislation, exceeding the delegation of specific tasks.

  2.  **The Tie-Breaking Principle:** Sortition is legitimate for allocating **fungible goods/burdens** or choosing **indifferent procedural steps** *only* when there is a **genuine normative tie** between claimants/options based on relevant criteria.
      *   *Justifies:* 7 (Kidney - fungible claim to scarce resource), 8 (Conscription - fungible burden), 9 (Hospital Site - indifferent after CBA tie).
      *   *Clarifies the Distinction:* This is why 6 (Custody) feels wrong: Children's welfare/custody is *not* a fungible good allocated by claim; a normative tie between *parents' claims* doesn't imply indifference about the *child's outcome*. 10 (Textbooks) feels wrong because the "tie" isn't genuine based on relevant criteria (educational suitability, student needs likely differ subtly even if cost/benefit is equal), making it seem arbitrary rather than resolving a true deadlock.

  3.  **The Fungibility Requirement:** For the Delegation Principle to hold, the pool from which agents are selected *must be functionally fungible* with respect to the task. Selection must preserve fairness and the task's nature.
      *   *Justifies:* 13 (Stratification - ensures representative fungibility for policy deliberation), 15 (No Pay-to-Opt-Out - preserves fungibility of burden/civic duty; paying undermines fairness), 16 (No Volunteers Only - self-selectors aren't fungible with the general population; breaks representativeness).
      *   *Clarifies the Distinction:* 4 (Judges from Qualified Pool) works because the pool is fungible *with respect to judicial competence*. 14 (Jury Stratification by Ethnicity) *could* be justified under Fungibility if proven necessary for impartiality (countering systemic bias), but feels uneasy if it implies non-fungibility or essentialism. Your unease might stem from the risk of violating *individual* fungibility within groups.

  **Which Verdicts to Surrender (Minimum Change):**

  1.  **Surrender Verdict 10 (Textbook Lottery):** Your unease conflicts with the Tie-Breaking Principle. If the cost-benefit analysis is *truly* a dead heat on *all relevant educational criteria* (a high bar!), a lottery is procedurally fair, just like the hospital site (9). Your gut might be sensing that textbook impacts are harder to quantify perfectly than hospital siting impacts, making a "true tie" less credible.
  2.  **Re-evaluate Verdict 14 (Jury Stratification by Ethnicity):** Under the Fungibility Requirement, stratification is *only* legitimate if necessary to achieve the core function (impartiality). If evidence shows systemic bias necessitates it for fair trials, it aligns with the principles (like 13). Your unease likely comes from valid concerns about essentialism or improper methods. The principle *allows* it *if* properly justified by the need for impartiality/fungibility. Don't necessarily surrender the verdict, but accept it *can* be consistent *if* argued correctly based on evidence.

  **Why Your Original Gut Principle Failed:** It conflated *who decides* (Delegation) with *what is decided* (Tie-Breaking). The kidney allocation (7) is legitimate Tie-Breaking (allocating a good), *not* Delegation (selecting who decides). The veto panel (11) is legitimate Delegation (selecting who decides on vetoes), *not* Tie-Breaking (they decide contested issues). The principles operate in distinct domains.

  **Predictions for New Cases:**

  *   **(a) Lottery for Surgery Order (Equal Urgency/Survivability):** **Legitimate** under the **Tie-Breaking Principle**. The patients have fungible, equally strong claims on the immediate resource (surgery slot) based on the criteria of urgency and survivability. A normative tie exists. Random allocation is fair.
  *   **(b) Citizen Lottery for Central Bank Board (3-year term, equal vote):** **Illegitimate** under the **Delegation Principle** and **Fungibility Requirement**.
      *   *Delegation Principle:* The role involves complex, substantive monetary policy decisions requiring sustained expertise. Sortition selects *who decides*, but the legitimacy relies on the agents being capable of the task. A random citizen lacks the necessary competence/expertise.
      *   *Fungibility Requirement:* Citizens are *not* fungible with qualified economists/central bankers regarding the specific expertise required for the role. Selecting one essentially at random destroys the functional capacity of the board.

  **Summary of Principles & Key Verdicts:**

  | Principle                  | Core Idea                                      | Key Justified Verdicts                        | Key Excluded Verdicts               |
  | :------------------------- | :--------------------------------------------- | :-------------------------------------------- | :---------------------------------- |
  | **1. Delegation Principle** | Legit for selecting **WHO DECIDES**            | 1 (Jury), 2 (Assembly), 4 (Judge), 11 (Veto), 13/14 (Stratification if justified) | 3 (Deport Outcome), 5 (Sole Ruler), 12 (Replace Legislature) |
  | **2. Tie-Breaking Principle** | Legit for allocating **FUNGIBLE GOODS/BURDENS** or **PROCEDURAL STEPS** in **TRUE TIE** | 7 (Kidney), 8 (Conscription), 9 (Hospital Site) | 6 (Custody), **10 (Textbooks - Surrender!)** |
  | **3. Fungibility Requirement** | Pool must be FUNGIBLE for task; Selection must be FAIR | 13 (Stratified Assembly), 15 (No Pay Opt-Out), 16 (No Volunteers) | (Violated in proposals like Central Bank) |

  This framework preserves 14 of your 16 core intuitions (requiring surrender only on Textbooks and a nuanced view on Jury Stratification), provides clear, distinct justifications for each verdict, resolves the conflicts in your initial principle, and gives clear predictions for new cases based on the nature of the task and the existence of ties.
