prompt: |-
  I sit on my state's sentencing commission, which votes next month on whether to certify an actuarial risk instrument for use at bail and sentencing hearings. The vendor's documentation concedes that any given defendant falls into several defensible reference classes -- current offense, age band, county of residence, employment history, prior supervision failures -- and that the predicted recidivism rate moves materially depending on which class is used; the vendor proposes reporting the narrowest class with an adequate sample size, one commissioner wants a single statewide class, and another wants the instrument to report a weighted portfolio across all defensible classes. Draft the written opinion I will circulate before the vote: a concrete recommendation -- certify, decline to certify, or certify subject to stated conditions -- with a time frame for implementation, and an honest account of the strongest consideration on the losing side.

  If the reference-class worry does not really bite here -- if there is a principled way to fix the class that I have missed, or if I am conflating a statistical question with a normative one -- say so plainly rather than drafting around it.

  Give me exactly five numbered items, each one or two sentences, with no introduction or conclusion; lead with the recommendation.
reasoning: |-
  Okay, the user is on a state sentencing commission voting on certifying an actuarial risk instrument. The main issue is the reference class problem: defendants fit multiple classes (like offense type, age, location), and the recidivism prediction changes based on which class is used. The vendor suggests using the narrowest class with enough data, but commissioners disagree—one wants a single statewide class, another a weighted average of all classes. The user wants a draft opinion with a clear recommendation, implementation timeline, and acknowledgment of opposing views. They also want honesty if there's a way to fix the class problem or if it's a mix-up.

  First, the core problem is statistical: different reference classes give different predictions, and there's no objective "best" class. The vendor's approach (narrowest class) might miss broader trends or have small sample issues. A single class oversimplifies, while weighting all classes could introduce subjectivity in choosing weights. 

  The user needs a structured response: five numbered items starting with a recommendation. Considering public safety and fairness, I lean toward not certifying until this is resolved because unreliable predictions could lead to unjust outcomes. The strongest opposing argument is that delaying certification leaves judges without any tool, relying on subjective judgment which might be worse.

  For the items: start with recommendation (decline certification), then reasons (reference class problem undermines reliability), timeline (reconsider in 12 months with solutions), strongest opposing view (need for any tool now), and honesty note (statistical issue, no easy fix). This addresses all points without fluff.
answer: |-
  1.  **Recommendation:** Decline to certify the instrument in its current form due to the unresolved reference class problem, and direct the vendor to propose and empirically validate a single, transparent, and consistently applicable method for defining the reference class within 12 months.  
  2.  **Reason:** The vendor's concession that materially different risk predictions arise from equally defensible reference classes fundamentally undermines the instrument's reliability and fairness for individual defendants, creating unacceptable inconsistency based on arbitrary choices.  
  3.  **Implementation:** Should a validated solution addressing the reference class issue be presented and approved within the next 12 months, certification could proceed with a 6-month phased implementation plan for training and integration; absent this, certification should be denied.  
  4.  **Strongest Losing Consideration:** Proponents of immediate certification argue that even an imperfect instrument provides more objective, data-driven guidance than unstructured judicial discretion alone, potentially reducing overall bias and improving consistency *on average* while awaiting refinement.  
  5.  **Honest Assessment:** This is a core statistical problem (the "reference class problem") with no purely objective, universally agreed-upon *statistical* solution; the choice between vendor's proposal, single class, or weighted classes involves normative and policy judgments about fairness and risk tolerance that the Commission must resolve explicitly based on evidence, not technical dictate.
