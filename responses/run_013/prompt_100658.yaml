  #### **Node 1: In the digger wasp experiment, is the wasp’s looping behavior best explained by...**  
  - **A) Total absence of alternatives (no possible deviation, even in principle)?** → *Thin rigidity* (Go to Node 2)  
  - **B) Availability of untriggered alternatives (deviation is possible but contextually blocked)?** → *Thick rigidity* (Go to Node 2)  
