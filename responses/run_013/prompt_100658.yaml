  ### Decision Tree: Rigidity, Flexibility, and Free Will  
  *Navigate the tree by answering each question based on your intuitions about agency, mechanism, and possibility. Each branch leads to a distinct position on free will, avoiding well-rehearsed distinctions. The tree uses three core distinctions: (1) thin vs. thick rigidity, (2) the escape-rule regress, and (3) variability vs. repertoire extension. Positions are located in logical space, with awkward commitments highlighted. Unnamed positions are marked, and inseparable pairs are flagged.*  

