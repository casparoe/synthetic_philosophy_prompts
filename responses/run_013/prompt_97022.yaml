  For the variants:
  (a) Truncated game: Should preserve the paradox if feasibility is the core issue (supports position 2), but if bounded utility matters more (position 1), truncation might resolve it artificially.
  (b) Linear-value prize: Neutralizes bounded utility arguments (position 1 collapses), so persistence would support positions 2,4 or 5.
