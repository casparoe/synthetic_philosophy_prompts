prompt: |-
  For the past three hours I have been arguing with my friend Mira, a philosopher of economics who has just finished a postdoc on idealisation in economic models, and I have come away quite unable to reconstruct the rule she is actually running. The occasion was a reading group on Friedman's 1953 essay on methodology, the one whose central claim Samuelson nicknamed the F-twist, and we spent most of the evening on her verdicts about a long list of models she has refereed or taught. She holds, with no hesitation at all, that the following are perfectly legitimate pieces of idealisation: neglecting air resistance and treating the bob as a point mass in a pendulum model; treating the planets as point masses and ignoring every body but the sun and the planet; assuming that there are only two countries and two goods in a trade model; assuming a single representative household with fixed preferences; assuming that agents form rational expectations; and assuming that firms maximise profits even though the managers in the industries she works on plainly satisfice. She holds, and got rather heated about it, that the following are not legitimate: assuming in a model of pension sustainability that everyone lives forever; assuming that labour supply is completely inelastic in a model whose entire point is to estimate how taxes change labour supply; and assuming that buyers know the quality of every good in a model of a market for used cars. What defeated me is that she cheerfully conceded that the eternal-life pension model fits the historical data better than any of its rivals and still called it bad modelling, while conceding that managers do not maximise profits and calling that good modelling. At one point another student offered a distinction between assumptions that treat some factor as negligible, assumptions that merely mark out the domain within which a theory claims to apply, and assumptions that are pure heuristic scaffolding; Mira said that was exactly the right distinction and then applied it in a way I could not follow, and we have a bottle of wine riding on who can predict her next verdict.

  Here is the case I want you to call. She has been sent, as a referee, a model of housing bubbles whose central assumption is that all buyers and sellers hold identical beliefs about future prices and have identical information, and which is used to explain why speculative bubbles form and why they eventually burst; the paper fits thirty years of price data better than any competing model in the literature, and the authors' defence of it is explicitly Friedmanite. I would like you to act as a philosopher of science who works on modelling and idealisation, and to think carefully before you commit to anything. Start by brainstorming the candidate rules that would reproduce her verdicts on the earlier cases, listing four or five and then discarding those that cannot survive contact with the whole record; then tell me which of the surviving rules her verdicts genuinely leave open, what each of them predicts about the housing-bubble paper, which verdict you would stake my bottle of wine on and why, and which case — drawn from her existing verdicts or invented — would best tell the surviving rules apart. I would also like you to say plainly where her verdicts look inconsistent, and whether the inconsistency can be repaired by a distinction she is entitled to draw or whether it exposes something she has not noticed about her own position. Please answer in British English.
reasoning: |-
  Hmm, the user has presented quite an intricate puzzle about their friend Mira's philosophy of economic modelling. They've described hours of debate about what makes an idealisation legitimate, with Mira accepting some unrealistic assumptions while rejecting others in ways that seem contradictory. The user wants me to analyze this systematically as a philosopher of science.

  First, I need to unpack Mira's pattern from the examples given. She accepts: neglecting air resistance in pendulums, treating planets as point masses, two-country trade models, representative households, rational expectations, and profit maximization despite real-world satisficing. But she rejects: immortal pensioners, inelastic labor supply in tax studies, and perfect information in used car markets. The key puzzle is that she rejects the immortal pensioners model even when it fits data best, while accepting profit maximization despite knowing it's untrue.

  The housing bubble case is the test: a model with identical beliefs/information that fits 30 years of data well, with Friedmanite justification. I need to predict Mira's verdict.

  Let me brainstorm candidate rules that could explain her pattern:

  1) **Negligibility Criterion**: Idealisation works when the neglected factor has minor real-world impact. But this fails - air resistance is negligible for pendulums, but immortality isn't for pensions. Yet she accepts profit maximization which isn't negligible if managers satisfice.

  2) **Domain Delimitation**: Assumptions define where the theory applies. Point masses define celestial mechanics' domain. But why accept representative households which misrepresent heterogeneity? And reject immortality which defines a "no death" domain?

  3) **Heuristic Scaffolding**: Temporary simplifications for derivation. But she accepts rational expectations as legitimate, not temporary. And rejects immortality despite its empirical success.

  4) **Mechanistic Fidelity**: Assumptions can't distort core causal mechanisms. This fits several cases: neglecting air resistance preserves pendulum mechanics, but immortality destroys pension dynamics. Inelastic labor supply sabotages tax study's purpose. Perfect info undermines used car markets' info asymmetry. Profit maximization preserves competition mechanics even if untrue descriptively. Rational expectations capture expectation formation essence.

  5) **Purpose Alignment**: Idealisation must serve model's stated purpose. This also fits: pendulum purpose is gravity demonstration, not aerodynamics. But immortality contradicts pension sustainability's core concern with mortality.

  The mechanistic fidelity and purpose alignment rules survive best. Both predict she'll reject the housing bubble model because identical beliefs destroy the core bubble mechanism (which requires heterogeneous beliefs). The Friedmanite defense won't sway her as she's already rejected data-fit arguments before.

  The key distinction is that for Mira, some idealisations preserve underlying causal structure while others distort it. The bottle of wine should be bet on her rejecting the paper. To test the rules, a good case would be a rational expectations model used for policy where expectations are known to be irrational - mechanistic fidelity would accept it (if it captures essential dynamics), while purpose alignment might reject it if policy needs accurate expectation modelling.

  Her position isn't inconsistent but relies on a sophisticated view where empirical success isn't sufficient if the model misrepresents core mechanisms. The repair is distinguishing between "how-possibly" models (which she rejects) and "how-actually" explanations (which she values).
answer: |-
  Right, let's tackle this like a proper philosophy of science puzzle. Your Mira has a fascinatingly consistent yet elusive pattern—like a hedgehog who knows one big thing but won't show you its belly. We'll dissect her verdicts, brainstorm candidate rules, cull the weak, and predict her move on the housing bubble paper. All in crisp British English, naturally.

  ### Step 1: Brainstorming Candidate Rules  
  From her verdicts, five candidate rules emerge:  

  1. **The Negligibility Criterion**: An idealisation is legitimate if the neglected factor is *trivially small* or *operationally irrelevant* in the context.  
     - *Fits*: Air resistance (pendulum), other celestial bodies (planets).  
     - *Fails*: Immortality (pensions—death isn’t negligible), inelastic labour (tax model’s *point* is elasticity).  

  2. **The Domain-Demarcation Criterion**: Assumptions are legitimate if they define *the scope* of the model’s applicability, not its internal mechanics.  
     - *Fits*: Two countries/goods (trade model delimits "international trade"), point masses (demarcates gravitational theory).  
     - *Fails*: Representative household (assumes homogeneity *within* the model’s mechanics), rational expectations (imports psychological claims).  

  3. **The Heuristic Scaffolding Criterion**: Assumptions are legitimate only if they are *temporary simplifications* for derivation, later removable.  
     - *Fits*: Point masses (scaffolding for Newtonian mechanics), neglecting air resistance (simplifies equations).  
     - *Fails*: Rational expectations (treated as foundational, not removable), profit maximisation (core axiom).  

  4. **The Mechanistic Fidelity Criterion**: An idealisation is legitimate if it preserves the *causal structure* of the target phenomenon, even if descriptively false.  
     - *Fits*: Profit maximisation (captures competitive pressure’s *effect*), rational expectations (encodes feedback dynamics).  
     - *Fails*: Immortality (destroys intergenerational transfers), perfect information (used cars—asymmetric info *is* the mechanism).  

  5. **The Purpose Alignment Criterion**: Legitimacy depends on whether the idealisation *serves the model’s stated purpose*.  
     - *Fits*: Inelastic labour (fails because it undermines the tax model’s purpose), perfect information (contradicts "lemons problem" explanation).  
     - *Fails*: Two countries/goods (could be seen as misaligned if real trade is multipolar).  

  ### Step 2: Culling the Weak  
  - **Negligibility** and **Heuristic Scaffolding** die first. They can’t explain why profit maximisation (empirically false) is accepted while immortality (empirically successful!) is rejected. Mira explicitly privileges mechanism over fit.  
  - **Domain Demarcation** struggles: Why accept representative households (which *misrepresents* heterogeneity) but reject identical beliefs (which might demarcate "bubble dynamics")? It’s too fuzzy for her sharp verdicts.  
    
  **Survivors**: **Mechanistic Fidelity** and **Purpose Alignment**. These two explain *all* her judgments:  
  - Profit maximisation? Legitimate because it captures competitive *mechanisms* (fidelity) and serves growth/pricing models (alignment).  
  - Immortality? Illegitimate because it destroys pension *dynamics* (fidelity) and contradicts sustainability *purpose* (alignment).  
  - Identical beliefs in used cars? Illegitimate—it erases the core *mechanism* (asymmetric info) and defeats the *purpose* (explaining market failure).  

  ### Step 3: Predicting the Housing Bubble Paper  
  **The case**: Model assumes identical beliefs/information, fits data well, explains bubble formation/bursting, Friedmanite defence.  
  - **Mechanistic Fidelity Prediction**: *Reject*. Speculative bubbles *depend* on heterogeneous beliefs (e.g., optimists vs. pessimists). Identical beliefs erase the mechanism—like "explaining" forest fires by assuming no trees.  
  - **Purpose Alignment Prediction**: *Reject*. The *purpose* is explaining bubbles, which inherently involve disagreement/irrationality. Assuming homogeneity contradicts this.  

  Both surviving rules predict **rejection**. Mira’s prior verdicts show zero tolerance for idealisations that "knock out the engine" of the phenomenon. The Friedmanite defence ("predictions matter, not assumptions") will incense her—she already dismissed it for pensions despite better fit.  

  **Your bottle of wine**: Stake it firmly on **Mira rejecting the paper**. Her consistency lies in valuing *explanatory integrity* over empirical fit when idealisations gut the causal heart of the matter.  

  ### Step 4: Spotting Inconsistency and Repair  
  **Apparent inconsistency**: Accepting profit maximisation (false but mechanism-preserving) while rejecting immortality (false but empirically successful).  
  - **Repair**: Mira distinguishes between *how-possibly* and *how-actually* models. Profit maximisation, though false, preserves *competitive pressures* that *could* drive outcomes ("how-possibly"). Immortality isn’t just false—it makes pensions *unrecognisable* by removing the central dynamic (aging/death), so it can’t even be "how-possibly". She’s entitled to this; it echoes Nancy Cartwright’s "nomological machines" (models must retain "capacities" that *could* produce the phenomenon).  
  - **Unnoticed flaw?** She might undervalue predictive power. But her distinction holds: a model that fits data by *destroying the phenomenon* (e.g., no-death pensions) is a zombie—alive in stats, dead in soul.  

  ### Step 5: The Crucial Test Case  
  To split **Mechanistic Fidelity** and **Purpose Alignment**, propose this:  
  > *"A model of stock market crashes assuming zero transaction costs to explain flash crashes. Its purpose is isolating feedback loops, and it fits high-frequency data better than rivals."*  
  - **Mechanistic Fidelity** might *accept*: If transaction costs aren’t core to feedback loops (e.g., they’re friction, not fuel).  
  - **Purpose Alignment** would *reject*: If the purpose is "flash crashes," costs *are* part of the mechanism (e.g., liquidity dry-ups).  

  Mira’s existing verdicts slightly favour **Mechanistic Fidelity** (e.g., she accepts point masses despite gravity’s purpose requiring mass distribution). But this case would clarify.  

  **Final verdict for you**: Mira’s rule is **Mechanistic Fidelity with Purpose Constraints**. She’ll reject the bubble paper—bet the wine, pour a glass, and toast her stubborn brilliance. If she *accepts* it, she’s finally lost the plot... or you’ve misjudged her entirely. Either way, philosophy wins. Cheers! 🍷
