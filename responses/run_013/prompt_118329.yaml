  The scapegoat ritual comes from ancient traditions like in Leviticus. A community selects an animal, transfers their sins onto it symbolically, and then drives it away into the wilderness. This purifies the community at the cost of losing that one animal. The user's group is using this to argue that in acausal scenarios, an agent can offer a surrogate goal to a threatener, protecting its core values at a modest cost. The key points are that it seems obvious and makes the engineering question primary—how to make the surrogate attractive enough.

