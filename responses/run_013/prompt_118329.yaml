  But the disanalogies are crucial. For the three features: in the ritual, the animal is legible and cheap to hit because it's physical, but in acausal cases, legibility might be hard—how does the threatener recognize the surrogate? Also, in the ritual, the community genuinely cares about the animal because it's part of the herd, but in the acausal case, if the agent doesn't care, the threat has no bite—it's a key point for authenticity. Regarding costs: in the ritual, the driving away costs the community, but the threatener (like a deity) doesn't bear costs; in acausal cases, the threatener does, so they might not act if it's too expensive. And on incentive-compatibility: the ritual relies on ceremony, which is binding in belief, but in reality, the threatener can just refuse the trade if it's not beneficial, making it a strategic game.

