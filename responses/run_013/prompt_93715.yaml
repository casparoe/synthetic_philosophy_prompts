prompt: |-
  I'm putting together a night-class unit on pseudohistory and I'm trying to get past the usual checklist (cherry-picking, conspiracy, etc.). So I've been messing around with a more specific set of failure modes, and I want you to tier-rank them by how diagnostic they actually are: if a piece of history-writing shows this feature, how much should it move my credence toward this-is-pseudohistory rather than just this-is-bad-or-heterodox-history? Here are the markers I came up with:

  1. Chronological compression: treating a long, well-attested sequence as a duplicate or refraction of a much shorter one (Fomenko-style).
  2. Hyper-diffusion: explaining multiple independent inventions as borrowings from one lost ur-source.
  3. Evidential inversion: treating the absence of expected evidence as positive evidence of suppression.
  4. Scale-jumping: moving from a local anomaly or translation error to a global rewrite of a civilization.
  5. Moralization of method: letting the political or religious stakes of the conclusion do the work of the evidence.
  6. Source-capture: relying on a small set of texts while treating the rest of the corpus as corrupted by the orthodoxy.
  7. Falsifiability theater: offering predictions that are only checkable after the theory has already been accepted.
  8. Anachronistic coherence: making the past too neat, too legible, too much like a novel.

  Give me a tier list (S/A/B/C/D or top/middle/bottom) of these, with a sentence or two each. Then, seperately, rank Atlantis, ancient aliens, and Fomenko's new chronology by how much each is a distinct challenge to normal historical method rather than just a different flavor of the same thing. I'm less interested in debunking than in the structure: which of these markers does each case load most heavily on? And say how confident you are in the whole ranking, and which call you're definately least sure about.
reasoning: |-
  Okay, the user is putting together a night-class unit on pseudohistory and wants to move beyond the usual checklist like cherry-picking or conspiracy theories. They've developed a more specific set of failure modes and need help tier-ranking them based on how diagnostic they are for pseudohistory versus just bad or heterodox history. 

  First, I need to understand each of their eight markers. Let me recall what each one means:

  1. **Chronological compression**: This is like Fomenko's approach where long historical sequences are treated as duplicates of shorter ones. It's a major red flag because it requires dismissing vast amounts of evidence.

  2. **Hyper-diffusion**: Attributing multiple independent inventions to a single lost source. It oversimplifies cultural development and ignores parallel innovations.

  3. **Evidential inversion**: Absence of evidence is taken as proof of suppression. This is a classic conspiracy tactic that's hard to counter logically.

  4. **Scale-jumping**: Taking a small anomaly and using it to rewrite entire civilizations. It's a massive overreach that lacks proportionality.

  5. **Moralization of method**: Letting political or religious stakes drive conclusions rather than evidence. This biases the entire inquiry from the start.

  6. **Source-capture**: Relying on a few "pure" texts while dismissing others as corrupted. It creates an unfalsifiable bubble around the theory.

  7. **Falsifiability theater**: Making predictions that can't be tested until the theory is accepted. It's a performative gesture rather than real science.

  8. **Anachronistic coherence**: Making the past unrealistically neat and novel-like. It sacrifices complexity for narrative satisfaction.

  Now, for tier-ranking these markers. The most diagnostic ones should be those that are virtually exclusive to pseudohistory, while less diagnostic ones might appear in merely bad scholarship. 

  **Top Tier (S)**: Evidential inversion stands out because it's the core of conspiracy thinking - absence of evidence becomes evidence itself. Chronological compression is equally severe as it requires rejecting entire timelines. Source-capture creates a closed system immune to counter-evidence. These are hallmarks of pseudohistory.

  **Strong Indicators (A)**: Hyper-diffusion and scale-jumping involve massive overreaches that ignore Occam's razor. Falsifiability theater is deceptive by design. These are strong signals but might occasionally appear in fringe academic work.

  **Moderate Indicators (B)**: Moralization of method and anachronistic coherence are common in biased or lazy scholarship but become more dangerous in pseudohistorical contexts. They're amplifying factors rather than core features.

  **Least Diagnostic (C)**: None seem weak enough for C-tier. All markers have diagnostic value.

  Next, the user wants case studies: Atlantis, ancient aliens, and Fomenko's New Chronology. For each, I need to identify which markers they exemplify most heavily.

  **Fomenko's New Chronology**: This is all about chronological compression (Marker 1) - collapsing timelines dramatically. It also relies heavily on source-capture (Marker 6) by privileging certain texts. Scale-jumping (Marker 4) appears too when small anomalies justify massive rewrites.

  **Ancient Aliens**: Hyper-diffusion (Marker 2) is central - attributing all advanced tech to aliens. Evidential inversion (Marker 3) is rampant ("no records? clearly destroyed!"). Anachronistic coherence (Marker 8) makes ancient people seem like modern engineers.

  **Atlantis Theories**: Hyper-diffusion again (Marker 2) - making Atlantis the source of all civilizations. Scale-jumping (Marker 4) turns Plato's allegory into global history. Falsifiability theater (Marker 7) often appears with untestable underwater "predictions."

  Confidence-wise, I'm sure about the top tiers and case mappings. The least certain call is whether moralization of method (Marker 5) belongs in B-tier - it could be more central in some cases like Holocaust denial. But overall, this framework should help the user teach how pseudohistory structurally differs from controversial but legitimate scholarship.
answer: |-
  Here's a tier-ranking of your pseudohistorical failure modes, followed by the case study analysis. I'm using an S/A/B/C system (S = Highly Diagnostic, A = Strongly Diagnostic, B = Moderately Diagnostic, C = Weakly Diagnostic). Confidence level: **85%**. Least sure about Tier B distinctions.

  ---

  ### **Tier List: Diagnostic Strength for Pseudohistory**  
  *(S = "Smoking gun" for pseudohistory | C = Also common in bad mainstream history)*  

  | **Tier** | **Marker**                     | **Diagnostic Rationale**                                                                 |
  |----------|--------------------------------|------------------------------------------------------------------------------------------|
  | **S**    | 3. Evidential inversion      | Unique to conspiratorial thinking: Absence of evidence *as proof* is epistemologically toxic and self-sealing. |
  | **S**    | 1. Chronological compression | Requires wholesale dismissal of cross-disciplinary evidence (texts, dendrochronology, archaeology). |
  | **S**    | 6. Source-capture            | Creates an unfalsifiable "pure core" immune to contextual criticism or counter-evidence. |
  | **A**    | 2. Hyper-diffusion           | Rejects independent invention/parallel evolution—a hallmark of "special mystery" pseudohistory. |
  | **A**    | 7. Falsifiability theater    | Mimics science but delays/defangs testing; rare outside pseudohistory or fringe theories. |
  | **A**    | 4. Scale-jumping             | Reveals disregard for proportionality—local quirks can't sustain civilizational overhauls. |
  | **B**    | 5. Moralization of method    | Common in biased scholarship, but *essential* for ideologically driven pseudohistory (e.g., Nazi archaeology). |
  | **B**    | 8. Anachronistic coherence   | Appears in popular history too, but extreme "novelization" signals denial of historical chaos. |

  ---

  ### **Case Study Analysis: Structural Challenges to Historical Method**  
  Ranked by *distinctiveness of challenge* (Most → Least):  
  1. **Fomenko's New Chronology**  
     - **Core Marker**: Chronological compression (#1)  
     - **Heavy Load**: Also #6 (source-capture), #4 (scale-jumping)  
     - **Challenge**: Attacks chronology's *scaffolding*—not just facts but temporal relationships. Forces historians to defend *all* dating methods simultaneously.  
     - **Distinctiveness**: ★★★★★ (Uses math to appear "objective" while undermining historical epistemology itself)  

  2. **Ancient Aliens**  
     - **Core Marker**: Hyper-diffusion (#2)  
     - **Heavy Load**: #3 (evidential inversion), #7 (falsifiability theater), #8 (anachronistic coherence)  
     - **Challenge**: Replaces human agency with external forces, rendering cultural development irrelevant. "Evidence" is non-falsifiable (e.g., "aliens hid their tracks").  
     - **Distinctiveness**: ★★★★☆ (Dismisses anthropology/archaeology as fields by default)  

  3. **Atlantis**  
     - **Core Marker**: Hyper-diffusion (#2) + Scale-jumping (#4)  
     - **Heavy Load**: #7 (falsifiability theater—e.g., "it's under the ice/sea"), #3 (absence of evidence = deliberate erasure)  
     - **Challenge**: Moralization (#5) often dominates (e.g., Atlantis as utopian warning). Less methodologically aggressive than Fomenko/aliens.  
     - **Distinctiveness**: ★★☆☆☆ (Plausible as allegory; pseudohistory arises from *literalizing* myth + overextending limited evidence)  

  ---

  ### **Confidence & Uncertainty**  
  - **Overall Confidence**: 85% — Tiers S/A/B hold well across cases.  
  - **Least Sure**: Tier B ranking (#5 Moralization, #8 Anachronistic coherence). Moralization *can* be S-tier in extreme cases (e.g., genocide denial), but often overlaps with bad academic history. Anachronistic coherence is the weakest marker—great writers (e.g., Gibbon) sometimes oversimplify, but pseudohistory weaponizes it.  
  - **Key Insight**: Fomenko is uniquely dangerous because it co-opts technical language to sabotage historical temporality itself. Ancient aliens and Atlantis are more "traditional" myth-making.  

  This framework should help students spot *systemic* failures beyond cherry-picking. Focus on **evidential inversion** and **source-capture** as near-universal pseudohistory signatures.
