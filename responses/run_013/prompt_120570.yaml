prompt: |-
  I never went to college so go easy on the jargon, but I'm on the board of our town's volunteer-run community center and I have to get a written opinion in the other members' hands by Tuesday's meeting.

  Background: about three years ago we voted to buy and fix up the old Grange hall into a year-round community center, with a commercial kitchen and a gym floor. We've raised and spent around $410,000, most of it from a town grant plus a long grind of bake sales, car washes, and one very generous estate gift. We've also put in maybe 6,000 volunteer hours. Now the contractor says the foundation and roof need about $650k more before we can open anything, and the building inspector won't let us open a single room without it. Our treasurer ran the numbers and even if everything goes right we'd be running roughly a $40k-a-year deficit for the first five years, and membership has actually gone down, not up.

  Half the board says stop, we're throwing good money after bad. The other half, led by Deb, who started the whole thing and put in $60k of her own money and pretty much every weekend for three years, says we can't quit now, we've definately come too far, and besides we promised our donors and the town.

  Here's what I can't get past. Everybody keeps saying the money's gone, ignore it, like that ends the discussion. And fine, I get that about the money. But two things bug me. First, I read a summary of some psychology paper a while back arguing that the don't-waste-it feeling isn't just a dumb glitch, that it's a rule that's useful in general and only misfires in certain cases, and if that's true I'd like to know which case we're in. Second, the money being spent is one thing, but the promises aren't spent. We told people this was happening, and some of them gave money they couldn't really afford. That feels different from money to me, and I don't know if the usual reasoning even covers it. On top of that our treasurer keeps warning that if we bail now, the town council and the big donors will remember next time we come asking, and Deb says if we quit, the volunteers will scatter and we'll never get them back.

  Can you write the short written opinion I'll circulate before the vote? I need it to actually recommend something concrete, keep going, stop, or keep going only if some specific condition gets met, with a time frame, and to give the real reasoning, including the strongest argument for whichever side I end up against, not a strawman. And please don't just tell me sunk costs are irrelevant like that settles it. I want to know whether that rule really does cover promises and the town remembering us, or whether those are just more costs and I'm fooling myself. If honoring what we've already put in is sometimes the reasonable thing, say when and why. If it never is, say why the promise stuff doesn't change that.

  Also tell me how confident you are in the parts that lean on the psychology and decision research, and flag the one point you're least sure about, because I don't want to stand up at the meeting sounding more sure than I am. American English, please.
reasoning: |-
  Okay, let me approach this community center dilemma step by step. The board member needs a balanced written opinion that doesn't oversimplify the sunk cost issue while addressing their specific concerns about promises and reputation.

  First, I recognize the core tension: half the board wants to cut losses while the other half feels morally obligated to continue. The user explicitly rejects superficial "sunk costs are irrelevant" arguments, so I need deeper analysis. Their two key concerns are: (1) whether the psychological "don't-waste-it" instinct has legitimate weight here, and (2) how to value promises to donors/volunteers separately from financial costs.

  The psychology aspect requires careful handling. Research does show the sunk cost fallacy stems from a generally useful instinct - abandoning efforts prematurely is often unwise. But the critical test is future viability. I should emphasize that continuing only makes sense if there's credible evidence of sustainability, not just past investment.

  Regarding promises and reputation, these aren't sunk costs but future considerations. The treasurer's warning about donor trust and Deb's concern about volunteer morale are valid strategic concerns. However, they must be weighed against the risk of greater future letdown if the project fails later. I'll frame this as reputational risk management rather than emotional obligation.

  For the recommendation, a conditional pause seems most responsible. Setting clear financial/participation milestones creates accountability while preventing endless spending. The 90-day timeframe balances urgency with realism. I'll explicitly state this overcomes the sunk cost trap by focusing on future potential.

  I'm least confident about predicting volunteer behavior - psychology suggests they might actually respect transparent leadership after initial disappointment, but community dynamics vary. This uncertainty should be flagged.

  The tone must avoid jargon while maintaining rigor. Phrases like "honoring past work through wise decisions" reframe perseverance as prudence rather than stubbornness. Concrete numbers ($30k/3 months) keep it actionable.
answer: |-
  Here's a straightforward written opinion for your board members, designed to be clear, balanced, and actionable:

  ---

  **MEMORANDUM**  
  **TO:** Community Center Board Members  
  **FROM:** [Your Name]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Grange Hall Project & Path Forward  

  We face a tough decision: continue investing in the Grange Hall renovation or stop now. The facts are stark: **$410,000 and 6,000 volunteer hours are already spent**, and we need **$650,000 more** just to open the doors. Even then, we’d lose **$40,000/year** for 5 years, and membership is declining.  

  ### Key Considerations  
  1. **The "Don’t Waste It" Feeling**:  
     This instinct isn’t stupid—it’s usually smart. In everyday life, walking away from half-built bridges or half-trained employees *is* wasteful. But it backfires when continuing only digs a deeper hole. **The question isn’t "Did we waste past effort?" It’s "Will future investment *create real value*?"**  

  2. **Promises & Reputation**:  
     - **Donors**: Yes, people gave money (and time) based on our promise. But "honoring" them doesn’t mean blindly spending more. It means being good stewards. Pouring $650k into a failing project risks wasting *their* contributions too.  
     - **Future Trust**: Bailing *might* hurt future fundraising—but so could opening a center that drains cash and closes in 3 years. Donors respect honesty and realistic plans.  

  3. **Volunteers & Momentum**:  
     Deb’s point matters: quitting could demoralize volunteers. But volunteers also burn out supporting unsustainable projects. If we stop, we must offer a clear alternative (e.g., "We’ll redirect efforts to X").  

  ### My Recommendation: **Pause Now, Plan a Limited Restart**  
  We should **stop new spending immediately**—but **not** abandon the project entirely. Instead:  
  - **Commit to a 90-Day Reset**:  
    1. **Verify Costs**: Get 2 independent estimates for the foundation/roof work.  
    2. **Rethink the Plan**: Could we open just the kitchen? Rent part of the building? Partner with the town for shared costs?  
    3. **Launch a "Save the Center" Campaign**: Ask the town and big donors for emergency funds *only if* we hit 2 strict goals within 90 days:  
       - **Raise $100,000 in pledges**.  
       - **Sign up 200 new paying members** (e.g., $10/month).  
    *If both goals are met*, we restart with a scaled-back opening (e.g., kitchen + 1 room). *If not*, we sell the property and redirect funds to other community projects.  

  ### Why This Approach?  
  - **Avoids Sunk Cost Traps**: We don’t throw more money at hope. We test if real support exists *now*.  
  - **Honors Past Effort**: By fighting for a realistic path forward—not by gambling.  
  - **Protects Reputation**: Shows donors we’re responsible. If we quit after the reset, we can say: "We tried everything—here’s the proof."  
  - **Respects Volunteers**: Gives a short-term mission with clear stakes.  

  ### Strongest Argument Against My View (from Deb’s Side):  
  *"Stopping now kills all momentum. Volunteers and donors who see us hesitate will walk away permanently. The $650k is non-negotiable—without it, we lose everything we’ve built. We owe it to our community to finish what we started, even if it’s hard."*  

  ### Confidence Notes:  
  - **Highly Confident**: The sunk cost instinct *is* useful in many life situations (e.g., fixing a car you’ll drive for years). It fails here because future costs dwarf future benefits.  
  - **Less Confident**: Predicting donor/volunteer reactions. Psychology suggests people respect transparency, but community dynamics vary. *(This is the point I’m least sure about.)*  

  ### Bottom Line:  
  Our duty isn’t to past sacrifices—it’s to the community’s future. If we can’t prove viability in 90 days, we stop. Not because the past doesn’t matter, but because the future matters more.  

  ---  

  **Why this works for your meeting**:  
  - **Concrete**: Recommends a *specific action* (pause + 90-day reset) with *clear exit criteria*.  
  - **Balanced**: Acknowledges Deb’s passion and the "promise" dilemma without sugarcoating the math.  
  - **Jargon-Free**: Uses plain language (e.g., "tests real support" instead of "validates market demand").  
  - **Psychology Explained**: Distinguishes between *useful perseverance* and *throwing good money after bad*.  
  - **Accountable**: Sets measurable targets ($100k pledges, 200 members) to prevent endless "what ifs."  

  This frames "honoring the past" as making wise choices—not doubling down on a failing plan. Good luck on Tuesday.
