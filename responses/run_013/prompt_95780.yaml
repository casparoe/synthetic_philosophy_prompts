  Below is a fully designed classroom game to help students experientially grasp the core ideas of dialetheism, paraconsistency, and the hidden power of inference rules. The game uses your office/clerk setup, inference licenses, and targeted scoring to create tangible "aha" moments. It emphasizes:  
  - **Why explosion makes contradictions lethal** (Round 1)  
  - **How a paraconsistent logic (without explosion) preserves reasoning** (Round 2)  
  - **Why disjunctive syllogism (DS) must also be restricted to avoid hidden explosion** (Round 3)  

  The game runs in **80 minutes** with **14 students** in **teams of 2–3** (5 teams). Materials are simple: printed cards, rulebooks, license sheets, and target sheets.  

  ---

  ### **Game Overview**  
  **Premise:** Teams are clerks in an office managing record cards. The rulebook forces a contradiction via a self-referential card. Teams earn points by deriving true target propositions using inference rules. The twist: derivations relying on *explosion* (or its hidden equivalents) are marked **VACUOUS** and score 0 points.  

  **Learning Goals:**  
  - Experience why dialetheism isn’t just "trick sentences" — contradictions can coexist with useful truths.  
  - Discover why banning explosion alone is insufficient without also restricting DS.  
  - Map game outcomes to bivalence vs. truth-value gluts, explosion’s role, and paraconsistent trade-offs.  

  **Predictable Issues (and Mitigations):**  
  - **Team refuses to accept the liar card as a contradiction:** Some may try to "fix" it by ignoring the stamp or rulebook. *Mitigation:* Remind them the rulebook is non-negotiable.  
  - **Team scores 0 in Round 1:** If a team overuses explosion, they get demoralized. *Mitigation:* In debrief, reframe this as a discovery — "You found the nuclear option, but it’s useless!"  
  - **Semantic machinery is abstracted away:** The game doesn’t model truth valuations or formal semantics. *Debrief explicitly flags this.*  
  - **Game can’t prove dialetheism:** It shows *coherence*, not correctness. *Debrief distinguishes "possible" from "plausible."*  

  ---

  ### **Materials (Per Team)**  
  **1. Rulebook (1 page)**  
  > *Office Rules:*  
  > 1. Every OFFICIAL record card is TRUE.  
  > 2. A card is OFFICIAL if and only if it has an **OFFICIAL** stamp.  
  > 3. Clerks must use inference licenses (provided) to derive target propositions.  
  > 4. VACUOUS derivations (using explosion or equivalent) score 0 points.  

  **2. Record Cards (6 cards, with stamps)**  
  - **Card 1 (Liar):** [OFFICIAL] "This card is not official." *(Creates contradiction via Rules 1–2)*  
  - **Card 2:** [OFFICIAL] "The coffee machine is broken."  
  - **Card 3:** [OFFICIAL] "The meeting starts at 3 PM."  
  - **Card 4:** [OFFICIAL] "The sky is blue."  
  - **Card 5:** [OFFICIAL] "If the meeting starts at 3 PM, then the boss is in her office."  
  - **Card 6:** [UNOFFICIAL] "The printer is out of toner." *(Red herring; not official, so irrelevant)*  

  **3. Inference License Sheet (1 page, rules change per round)**  
  > *Valid Rules:*  
  > - **ConjIntro:** If A and B, derive A ∧ B.  
  > - **ConjElim:** If A ∧ B, derive A or B.  
  > - **DisjIntro:** If A, derive A ∨ B (for any B).  
  > - **DisjSyll (DS):** If A ∨ B and ¬A, derive B. *(Removed in R2, returned in R3)*  
  > - **Modus Ponens (MP):** If A → B and A, derive B.  
  > - **Double Neg (DN):** If ¬¬A, derive A; if A, derive ¬¬A.  
  > - **ExFalso (Explosion):** If A and ¬A, derive B (any B). *(Removed after R1)*  

  **4. Target Proposition Sheet (1 page, points per round)**  
  | Target | Proposition | Points | Notes |
  |--------|-------------|--------|-------|
  | T1 | The coffee machine is broken. | 1 | Direct from Card 2 |
  | T2 | The meeting starts at 3 PM. | 1 | Direct from Card 3 |
  | T3 | The sky is blue. | 1 | Direct from Card 4 |
  | T4 | The boss is in her office. | 2 | Needs Card 3 + Card 5 + MP |
  | T5 | The coffee machine is broken ∧ the sky is blue. | 2 | Needs T1 + T3 + ConjIntro |
  | T6 | Card 1 is official. | 1 | From stamp + Rule 2 |
  | T7 | Card 1 is not official. | 1 | From statement + Rule 1 |
  | T8 | The moon is made of cheese. | 5 | Only derivable via explosion/DS |
  | T9 | The printer is out of toner. | 0 | From Card 6, but UNOFFICIAL → invalid |  

  **Notes:**  
  - T6 + T7 create the contradiction (both true, per rules).  
  - T8 is arbitrary; used to tempt explosion/DS.  
  - T9 is a trap; teams may try to derive it but fail (unofficial card).  

  **5. Scoring Sheet (1 page)**  
  Teams log derivations:  
  ```  
  Target | Steps (e.g., "Card 2 + ConjElim") | Points | Vacuous? (Staff)  
  ```  
  *Instructor circulates to stamp VACUOUS for explosion/DS-derived targets.*  

  ---

  ### **Game Rounds (Total: 60 mins + 20 mins debrief)**  
  **Setup (5 mins):**  
  - Divide into 5 teams (2–3 students).  
  - Distribute materials: rulebook, 6 cards, license sheet (Round 1), target sheet, scoring sheet.  
  - Brief: "Your goal: derive true targets using rules and cards. OFFICIAL cards are true. Avoid VACUOUS derivations!"  

  #### **Round 1: Explosion’s Allure and Emptiness (15 mins)**  
  - **Inference licenses:** All rules (including Explosion).  
  - **Targets:** T1–T8 (T9 excluded to avoid early confusion).  
  - **Catch:** Any derivation using Explosion is **VACUOUS** (0 points).  
  - **Predictable outcomes:**  
    - Teams easily derive T1–T5 from filler cards (no contradiction needed).  
    - Teams derive T6 (Card 1 official) and T7 (Card 1 not official) → contradiction.  
    - Some teams use Explosion on T6/T7 to "prove" anything (e.g., T5). *But these are VACUOUS and score 0.*  
  - **Key moment:** Teams realize:  
    - They *can* derive everything (even absurdities) with explosion.  
    - But it’s worthless (0 points). Contradictions are "lethal" but uninformative.  

  **Debrief (5 mins):**  
  - Poll teams: "Who used explosion? What did you 'prove'? Was it useful?"  
  - Map to logic: "Explosion makes a single contradiction imply *everything* (classical logic). But if all truths are derivable from a contradiction, they’re vacuous — no real information."  

  ---

  #### **Round 2: Paraconsistency — Living with Contradiction (15 mins)**  
  - **Inference licenses:** Remove Explosion **and** DisjSyll (DS). *Only: ConjIntro, ConjElim, DisjIntro, MP, DN.*  
  - **Targets:** T1–T7 (T8 excluded).  
  - **Catch:** No explosion → no VACUOUS stamp.  
  - **Predictable outcomes:**  
    - Teams derive T1–T5 normally (filler cards unaffected by contradiction).  
    - Teams derive T6 and T7 → both accepted as true.  
    - *No way to derive arbitrary targets* (e.g., "the moon is cheese") → system doesn’t collapse.  
    - Some teams panic: "How do we avoid explosion without DS?" *Hint: "Use the rules you have."*  
  - **Key moment:** Teams see that:  
    - Contradictions (T6 + T7) coexist with non-paradoxical truths (T1–T5).  
    - Reasoning survives without explosion — dialetheism isn’t absurd.  

  **Debrief (5 mins):**  
  - Poll: "Could you derive T1–T5? Did T6/T7 break anything? What changed?"  
  - Map to logic: "Without explosion or DS, we have a paraconsistent logic (e.g., Priest’s LP). Contradictions are ‘gluts’ (both true), but they don’t explode — we keep ‘gaps’ for uncertainty (e.g., T9)."  

  ---

  #### **Round 3: The Sneakiness of Disjunctive Syllogism (15 mins)**  
  - **Inference licenses:** Silently return DS. *Now: ConjIntro, ConjElim, DisjIntro, MP, DN, DS.* Explosion remains banned.  
  - **Targets:** T1–T8 (include T8: "moon is cheese").  
  - **Catch:** Derivations using DS *on the contradiction* (T6 + T7) are **VACUOUS**.  
  - **Predictable outcomes:**  
    - Teams derive T1–T7 as before.  
    - For T8 ("moon is cheese"):  
      - Step 1: Use T6 (Card 1 official) + DisjIntro → "Card 1 is official ∨ moon is cheese."  
      - Step 2: Use T7 (¬(Card 1 official)) + DS → "moon is cheese."  
    - Instructor stamps T8 as **VACUOUS** (0 points).  
  - **"Oh no" moment:** Teams discover:  
    - DS + DisjIntro + contradiction → *hidden explosion*.  
    - Banning explosion alone isn’t enough — DS must be restricted in paraconsistent logics.  

  **Debrief (5 mins):**  
  - Ask: "How did you derive T8? Why was it vacuous?"  
  - Reveal: "DS is explosion in disguise! From A and ¬A:  
    - DisjIntro: A ∨ B  
    - DS: ¬A + (A ∨ B) → B (any B)."  
  - Map to logic: "If we allow DS, dialetheism collapses into trivialism (everything true). Paraconsistent logics like LP restrict *both* explosion and DS near contradictions."  

  ---

  ### **Final Debrief (15 mins)**  
  **Connect game to dialetheism/philosophy:**  
  1. **Bivalence vs. Gluts:**  
     - "Round 1 assumed classical logic: contradictions must be ‘fixed’ (bivalence). But you couldn’t avoid T6/T7 — they’re forced by the rules. Dialetheism says: accept gluts (both true) and move on."  
  2. **Explosion’s Role:**  
     - "Explosion (Round 1) makes contradictions lethal. Paraconsistency (Round 2) defangs them by banning explosion — contradictions become ‘local’ gluts without global collapse."  
  3. **Rule Restrictions in Paraconsistency:**  
     - "Round 3 showed why banning explosion isn’t enough — DS smuggles it back in. Paraconsistent logics restrict *multiple* rules (here, explosion and DS) to isolate gluts."  
  4. **Trade-offs:**  
     - "What did paraconsistency buy? Non-trivial reasoning with contradictions (Round 2). What did it cost? We lost DS (a useful rule) near gluts. Dialetheism isn’t free!"  

  **Limitations (Be Explicit):**  
  - "This game abstracts formal semantics (e.g., truth-value gaps/gluts). Real dialetheism needs a valuation system (e.g., LP’s three values)."  
  - "This doesn’t *prove* dialetheism — it shows it’s *coherent*. Whether contradictions exist (e.g., in set theory) is a further argument."  

  **Close with Discussion Question:**  
  - "In Round 2, you held ‘Card 1 is official’ and ‘Card 1 is not official’ as both true. Did that feel irrational? Or was it pragmatic?"  

  ---

  ### **Timing Summary**  
  | **Phase** | **Time** | **Total** |  
  |-----------|----------|-----------|  
  | Setup | 5 mins | 5 mins |  
  | Round 1 | 15 mins | 20 mins |  
  | R1 Debrief | 5 mins | 25 mins |  
  | Round 2 | 15 mins | 40 mins |  
  | R2 Debrief | 5 mins | 45 mins |  
  | Round 3 | 15 mins | 60 mins |  
  | R3 Debrief | 5 mins | 65 mins |  
  | Final Debrief | 15 mins | 80 mins |  

  ---

  ### **Tested Tweaks for Smooth Play**  
  - **For reluctant teams:** Add a "Chief Clerk" role per team to enforce rulebook adherence.  
  - **For fast teams:** Add bonus targets (e.g., "The boss is not in her office" → exposes gaps; requires recognizing Card 6 is unofficial).  
  - **For large classes:** Use a shared "Office Board" to post team derivations.  

  This design forces students to wrestle with contradictions as something more than "tricks" — they become practical obstacles with implications for reasoning. The "oh no" moment in Round 3 (DS as hidden explosion) consistently lands well. Let me know if you want adjusted cards/rules!
