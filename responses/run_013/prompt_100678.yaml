answer: |-
  Here’s your essay question, model answer, and marking scheme. Designed to force critical engagement with the argument’s structure.

  ---

  **Essay Question: The Insect Scale Argument and Its Discontents**

  Assume the following for this question:
  *   There are approximately \(10^{18}\) insects farmed or harmed by human activity annually.
  *   If insects are sentient, the average insect experiences a net negative welfare state (suffering) comparable in moral significance to that of a typical vertebrate in industrial agriculture.
  *   Student A assigns a credence of \(0.1\%\) (\(10^{-3}\)) to the hypothesis that insects are sentient in a morally relevant way.
  *   Student B assigns a credence of \(0.0001\%\) (\(10^{-6}\)) to the same hypothesis.

  **Answer the following, showing your reasoning clearly:**

  1.  Calculate the "expected number of sentient insect equivalents suffering" (\(E\)) for both Student A and Student B. Explain why, despite their vastly different credences, both calculations lead Student A and Student B to conclude (if they accept the scale argument) that insect suffering *expectedly* dwarfs the suffering of all vertebrates in agriculture (estimated at ~\(10^{10}\) vertebrate lives affected annually with near-certain sentience).
  2.  Suppose a third student, Student C, argues that their credence isn't a single point estimate like A or B's, but a vague range spanning several orders of magnitude – perhaps from \(10^{-7}\) to \(10^{-3}\). How does this vagueness potentially complicate the calculation of \(E\)? Does this vagueness undermine the force of the scale argument? Why or why not?
  3.  The structure of the insect scale argument – (tiny probability) x (astronomically large number) = (overwhelming expected value) – resembles "Pascal's Mugging" (e.g., a mugger claims they will torture \(10^{100}\) people in a parallel universe unless you hand over $5; even with a tiny credence in their ability, the expected disutility of refusing dwarfs the disutility of losing $5).
      *   **Is there a *principled disanalogy* between accepting the insect scale argument's conclusion ("prioritize insect welfare") and handing over your wallet to the Pascal's Mugger?** If yes, clearly state and defend the key disanalogy. If no, defend the implication that we *should* accept conclusions driven by tiny probabilities of vast payoffs/disutilities.
      *   **Crucially: You must pick one side (Yes, principled disanalogy / No, no disanalogy) and defend it.** Do not argue for a middle ground or "more research."

  **Answer in approximately 600 words. Focus on conceptual reasoning, not citations.**

  ---

  **Model Answer (Hard Line: No Principled Disanalogy - Own the Pascal's Reasoning)**

  1.  **Calculation & Dominance:**
      *   \(E = (\text{credence}) \times (\text{number of insects}) \times (\text{suffering per insect equivalent})\)
      *   We can treat the suffering per sentient insect equivalent as comparable to one sentient vertebrate. So, \(E\) effectively represents the expected number of vertebrate-equivalent suffering units.
      *   Vertebrate Baseline: ~\(10^{10}\) units (near-certain).
      *   Student A (\(10^{-3}\)): \(E_A = 10^{-3} \times 10^{18} = 10^{15}\)
      *   Student B (\(10^{-6}\)): \(E_B = 10^{-6} \times 10^{18} = 10^{12}\)
      *   Both \(E_A = 10^{15}\) and \(E_B = 10^{12}\) dwarf the vertebrate baseline of \(10^{10}\) (\(E_A\) is 100,000 times larger, \(E_B\) is 100 times larger). The argument forces both students to conclude that expected insect suffering is vastly larger than vertebrate suffering, despite B's credence being 10,000 times smaller than A's. The sheer scale (\(10^{18}\)) swamps even large disagreements in probability estimates.

  2.  **Vague Credence (Student C):**
      *   Vague credence (e.g., \(10^{-7}\) to \(10^{-3}\)) means \(E\) isn't a single number but spans a range: \(E_C = 10^{-7} \times 10^{18} = 10^{11}\) to \(E_C = 10^{-3} \times 10^{18} = 10^{15}\).
      *   This complicates the *precision* of the expected value. We cannot say "E is exactly X," only "E is between Y and Z."
      *   **Does it undermine the argument? No.** Even the *lower bound* of Student C's range (\(E = 10^{11}\)) is still 10 times larger than the vertebrate baseline (\(10^{10}\)). The argument's core claim – that expected insect suffering *dwarfs* vertebrate suffering – remains robust across the entire plausible range of Student C's credence. The vagueness makes the *degree* of dominance uncertain, but not the *fact* of dominance. Only if the lower bound of plausible credence dropped low enough to make \(E\) comparable to or less than \(10^{10}\) would the argument be undermined, which isn't the case here (\(10^{-7}\) gives \(10^{11}\), still larger).

  3.  **Pascal's Mugging Disanalogy:**
      *   **No, there is no principled disanalogy.** Both arguments rely on the same core engine of expected value theory: multiply probability by magnitude. If we accept this engine for moral prioritization (as EAs/rationalists generally do), we must accept its outputs, even when they are counterintuitive due to extreme values.
      *   **Defense of "No Disanalogy":** Common objections fail.
          *   *"The mugger's threat is baseless/impossible!"*: Our credence in insect sentience isn't *zero*. It's based on neuroscience, evolutionary continuity, and behavioral evidence, however weak. Assigning a non-zero credence is reasonable. The mugger exploits this reasonableness. *The structure remains identical.*
          *   *"We can discount tiny probabilities!"*: Ad-hoc. Where is the principled threshold? If we discard probabilities below \(10^{-6}\) for practical decisions, we'd ignore many legitimate low-probability, high-impact risks (e.g., certain x-risks). If we accept EV maximization, we must bite the bullet.
          *   *"Insect suffering is less verifiable!"*: True, but irrelevant to the *expected* value calculation *given* a non-zero credence. It affects how we *set* the credence, not how we *use* it in EV.
      *   **Owning the Consequence:** Rejecting the insect conclusion while accepting Pascalian EV reasoning requires either: (a) assigning an *absolute zero* credence to insect sentience (unjustifiable empirically/rationally), or (b) rejecting EV maximization as a complete decision theory. If we keep EV, we must prioritize insect welfare based on expected scale, just as the mugging logic compels handing over the wallet. The counterintuitiveness stems from our psychological neglect of vast numbers and tiny probabilities, not a flaw in the math. The EA/rationalist project demands we overcome this bias.

  ---

  **Marking Scheme (20 Points Total)**

  | **Must-Hit Moves**                                                                 | **Points** | **Common Failure (How Students Blow It)**                                  |
  | :--------------------------------------------------------------------------------- | :--------- | :------------------------------------------------------------------------- |
  | **1. Correct EV Calculation & Dominance:** Accurately calculates E_A and E_B; clearly explains why both dwarf vertebrate baseline despite differing credences. | 4          | Math errors; fails to show *both* E_A and E_B dominate vertebrates.        |
  | **2. Vague Credence Handling:** Correctly identifies E as a range for Student C; argues that even the lower bound likely dwarfs vertebrates, thus scale argument is robust to this vagueness. | 5          | States E is vague but fails to assess impact (e.g., doesn't compare lower bound to baseline); incorrectly claims vagueness invalidates argument. |
  | **3. Pascal's Mugging Structure Recognition:** Explicitly states the structural similarity between the arguments. | 2          | Mentions Pascal's Mugging superficially but fails to clearly articulate the identical "tiny prob * vast magnitude" structure. |
  | **4. Disanalogy Engagement & Defense:** **A/B Line:** Takes a clear YES/NO stance on principled disanalogy; provides a substantive defense of that stance engaging core objections. | 6          | Hedges/fails to pick a side; gives weak/unprincipled disanalogies (e.g., "insects are real, mugger isn't" without justifying why this affects EV calculation); defense ignores obvious counterarguments. |
  | **5. Clarity, Structure & Conciseness:** Well-organized, logical flow, within word limit, minimal errors. | 3          | Rambling, unclear reasoning, significantly over/under word limit.          |

  **A vs. B Distinction:** The critical A/B split occurs in **Must-Hit Move 4 (Disanalogy Engagement & Defense)**. An "A" answer (16-20) will take a hard, unambiguous stance and provide a robust defense grounded in decision theory principles, explicitly addressing why common disanalogies fail. A "B" answer (12-15) might take a stance but defend it weakly, rely on intuition over principle, or inadequately address counterarguments. Answers below 12 typically miss core components or fail the A/B requirement by hedging.
