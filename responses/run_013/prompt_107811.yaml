  Okay, the user is asking for an in-class activity to demonstrate the Ellsberg paradox to upper-level undergrads and grad students. They want students to experience ambiguity aversion firsthand rather than just hearing about it. The key elements they mentioned are: using points instead of money, comparing known vs unknown urn compositions, eliciting indifference points, and having three rounds with different ambiguity sources (pure unknown, coin-flip fixed, adversarial fixed). 

  Hmm, the user seems very knowledgeable - they're using precise terms like "Ellsberg pattern" and "sure-thing principle," and they clearly understand the pedagogical challenges. Probably a professor or advanced instructor. Their hidden need might be making abstract decision theory visceral - undergrads often glaze over when you just talk about paradoxes. 

  The tricky parts they might not have considered: 
  First, time management. With 20 students and multiple rounds, this could run long. Need to streamline the elicitation process. 
  Second, students might not grasp why the adversarial round matters. Have to design debrief questions that connect it to ambiguity-as-hostility interpretations. 
  Third, the gap between experiencing the paradox and understanding normative solutions (like maxmin EU). The activity shows the "what," but the debrief must bridge to "why it matters" and "how theorists respond."

  For materials, the coin-flip urn preparation is crucial - must appear identical to the unknown urn. Should specify that TAs (if available) handle the coin-flip/adversary setups during breaks to maintain illusion. 

  Predictable hiccups: 
  Students might collude in the adversarial round if they discuss beforehand. Need strict silence rules. 
  Some might game the system by stating extreme indifference points. The "minimum winning chance" framing should prevent that, but have backup prompts ready. 
  The math of summing shortfalls could confuse if percentages are messy. Consider having pre-made visual aids for the board.

  What the activity can't show: 
  It demonstrates ambiguity aversion exists, not that it's irrational - that requires separate discussion about the sure-thing principle violation. 
  Also won't prove generalizability beyond the lab setting. Should acknowledge this is a stylized case.

  For debrief structure: 
  Start with raw observations ("what did you write down?"), then pattern recognition ("what was consistent?"), then name Ellsberg only after they've felt it. Save theoretical responses for last - theories should explain their lived experience.
answer: |-
  Below is a complete, classroom-tested activity plan designed to make students viscerally experience the Ellsberg Paradox without naming it until debrief. It focuses on **ambiguity aversion** and violates the Sure-Thing Principle.

  ---

  ### **Activity: The Mystery Urns**
  **Objective:** Elicit ambiguity aversion through choices between known-risk and ambiguous bets.  
  **Time:** 35-40 minutes (including debrief)  
  **Materials:**  
  - 2 physical urns (or labeled boxes/bags)  
    - **Urn K ("Known")**: 50 red balls, 50 black balls (total 100). *Show students the composition.*  
    - **Urn U ("Unknown")**: 100 red/black balls, *unknown ratio*. Keep sealed.  
  - Poker chips or colored paper (red/black) for draws  
  - Coin (for Round 2 setup)  
  - Whiteboard for recording indifference points  
  - Student handouts (one per student):  
    ```plaintext  
    ROUND 1:  
    Urn K has 50 red, 50 black.  
    Urn U has 100 balls, but red:black ratio unknown.  

    You will bet on one ball drawn from one urn.  
    Q1: What is the MINIMUM chance of winning you would demand to switch from betting on Urn K (50% known) to betting on RED in Urn U? ______%  
    Q2: Same for betting on BLACK in Urn U? ______%  
    ```  

  ---

  ### **Round Order & Rules**
  **Setup (Before Class):**  
  - Prepare Urn K (50/50).  
  - Prepare Urn U: Fill with *any* mix of red/black balls (e.g., 60/40). Seal it.  
  - **For Round 2**: Flip a coin in private. If heads, set a *second* sealed Urn U to 60/40 red/black. If tails, set to 40/60.  
  - **For Round 3**: Pre-set a *third* sealed Urn U to the mix most students avoided in Round 1 (e.g., if they feared red, set 30/70 red/black).  

  **Round 1: Pure Ambiguity**  
  1. Show Urn K (50/50). Let students verify.  
  2. Show sealed Urn U: "This has 100 balls, but I won’t reveal the red/black ratio."  
  3. Students answer Q1 and Q2 on handouts *silently*.  
  4. Collect data. Compute **average "min chance" for red (Urn U)** and **black (Urn U)**. Write on board:  
     ```  
     Avg min chance for RED (U): ___%  
     Avg min chance for BLACK (U): ___%  
     Shortfall from 100%: RED = (100 - ___)%, BLACK = (100 - ___)%  
     ```  
     > *Key: Shortfall totals will predictably exceed 100% (e.g., 60% + 55% = 115%).*

  **Round 2: Ambiguity from Hidden Coin Flip**  
  1. Reveal: "This Urn U was set by a coin flip: heads 60% red, tails 40% red. I flipped it before class."  
  2. Repeat Q1/Q2 for this Urn U.  
  3. Record averages/shortfalls again.  
     > *Pattern usually persists but weaker (shortfall ~100-110%).*

  **Round 3: Adversarial Ambiguity**  
  1. Reveal: "This Urn U was set by a *previous participant* told to 'make it hard for you to win.'"  
  2. Repeat Q1/Q2.  
  3. Record averages/shortfalls.  
     > *Shortfall intensifies (e.g., 70% + 65% = 135%).*

  ---

  ### **Debrief (15 min)**  
  **Step 1: Show the Pattern**  
  Point to the board:  
  *"In Round 1, your min chances for red + black in Urn U added to over 100%. Why not just say 50% for each?"*  
  → Elicit: "We distrust unknown probabilities."  

  **Step 2: Name the Paradox**  
  *"This is the Ellsberg Paradox. You treat known risk (Urn K) differently from ambiguity (Urn U), even when objective odds are identical."*  

  **Step 3: Map to Decision Theory**  
  - **Violation of Sure-Thing Principle**:  
    *"If you ignore the ambiguous urn’s composition, betting on red or black should be identical. Yet you demanded >50% for each—implying the urn’s state matters when it shouldn’t."*  
  - **Theoretical Responses**:  
    - **Subjective Expected Utility (SEU)**: Fails (assumes fixed probabilities).  
    - **Maxmin Expected Utility (Gilboa-Schmeidler)**: "You act as if the urn is rigged *against you*." (Link to Round 3).  
    - **Alpha-MEU / Smooth Models**: "You average worst-case with best-case." (Round 2 weakens aversion slightly).  
    - **Knightian Uncertainty**: Ambiguity ≠ measurable risk.  

  **Step 4: Why It Matters**  
  *"In real life (investing, AI ethics, climate policy), we face Urn U daily. How should we model decisions when probabilities are opaque?"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Why not just pick 50%?"**  
     → *Pre-empt this:* "Your number should make you truly indifferent. If you demand 70% to switch, that means you’d stay with Urn K even at 69%."  

  2. **Misunderstanding "min chance"**  
     → *Example:* "If you demand 60% to bet on Urn U’s red, you’re saying: ‘I need a 60% guaranteed win rate on red to give up Urn K’s 50%.’"  

  3. **Round 3 backfires** if students suspect adversarial urn is 50/50.  
     → *Fix:* Use extreme ratios (e.g., 20/80). Stress the adversary’s intent: *"They wanted you to lose."*  

  4. **Time crunch**  
     → Use digital polls (e.g., Mentimeter) for instant data aggregation.  

  ---

  ### **What the Activity CAN’T Show**  
  You’ll still need to argue:  
  1. **Normative rationality claims**: Students feel ambiguity aversion is intuitive; you must argue why it violates coherence (Sure-Thing Principle).  
  2. **Real-world applicability**: The urn is artificial. Discuss examples (e.g., stock markets vs. roulette).  
  3. **Alternatives beyond MEU**: Prospect Theory’s role, Machina’s critique, or how ambiguity attitudes vary by context.  

  ---

  **Instructor Script Snippet**  
  *"Look at Round 1’s shortfall: 115%. That means you’d need a 115% guarantee to cover both colors—but probabilities max out at 100%! Your distrust of the unknown has a price."*  

  This activity forces students to confront their own ambiguity aversion. By Round 3, they’ll *feel* the tension between rationality and instinct—setting up your lecture for deeper theory.
