prompt: |-
  I'm a backend engineer by trade and I've somehow ended up TA-ing a master's module on interpretability — they were short-staffed, I took the same module last year, so here we are. I'm marking a batch of scripts and I want a second pair of eyes on one answer before I put a number on it, because I keep flip-flopping on it. Here's the question I set (10 marks):

  "A vision model is trained to classify whether an image contains a car. A researcher trains a linear probe on the activations of a middle layer and finds that it predicts 'car' with 97% accuracy; the same probe trained on a randomly-initialised network of the same architecture gets 55%. The researcher concludes that the network represents car-presence in that layer. A critic replies that the probe only shows the information is decodable, not that the network uses it, and that the probe itself might be doing the work. Which conclusion is closer to the truth, and what would it take to establish that the network genuinely represents car-presence?"

  And here's the student's answer, typed up as written:

  "The researcher's inference is too quick. Decodability isn't use: a linear probe can read out information that the network never relies on for its output, so 97% probe accuracy on its own doesn't show that the network represents car-presence. The randomly-initialised control does rule one thing out, though — it shows the information isn't just sitting in the input and getting passed through — so training really did put something into the middle layer in a form a simple linear map can read. What would settle it is an intervention: if I ablate the direction the probe found, or steer along it, and the network's behaviour changes in the way I'd predict if it were using car-presence, then the feature is not merely decodable but causally used. A probe is only a lens, it doesn't add information to the network, and we prefer linear probes precisely because a simple probe can't be inventing structure that isn't there. So the linear probe is already doing the causal work, and the intervention is really just confirming what the probe has told us. There's a deflationary line that says 'representation' is just a useful fiction and we should only talk about what the network does, not what it represents; the critic's point and this line are basically the same move, both saying the representation-talk is doing no work. I don't think that can be right, because the point of interpretability is to recover the network's own internal vocabulary, so we have to read representation-talk literally. On balance the researcher is closer to the truth and the critic is wrong: the critic's worry that the probe might be doing the work is answered by the fact that a linear probe has no hidden layers, so there's nothing in it that could be doing the work."

  Could you mark it out of 10 and give me the actual comments I'd write on the script? I don't have a philosophy background, so I'm worried I'll be too soft on it because the prose sounds confident, or too hard for reasons I can't quite articulate. I want you to commit — give a definite mark and stand behind it, rather than calling it "partially correct" and leaving the judgment to me. Please give it as exactly five numbered points, each one a sentence or two, the first being the mark with the single biggest reason for it, and the other four each nailing down one specific thing in the answer: what's right, what's wrong, and what I should say to the student about it. No intro, no closing summary, and write it in British English.
reasoning: |-
  Okay, the user is a backend engineer who's now TA-ing a master's module on interpretability. They're marking a student's answer and want a second opinion. The question is about whether a linear probe showing 97% accuracy means the network "represents" car-presence, versus a critic saying it's just decodable. 

  Hmm, the student's answer has some strong points but also clear flaws. They correctly note decodability ≠ use and mention the importance of the random-network control. That's good. But then they undermine themselves by claiming the linear probe is "already doing causal work" – which is flat-out wrong since probes are observational tools. The intervention suggestion (ablation/steering) is spot-on though. 

  The philosophy tangent about "representation" being literal vs fictional feels misplaced here – it's beyond the scope of a 10-mark technical question. And that final argument about linear probes "having no hidden layers so can't invent structure" misses the point entirely; the concern isn't that probes add capabilities, but that they might overfit to non-causal signals. 

  Biggest issue is the self-contradiction: first saying intervention is needed to confirm causality, then backtracking to say the probe alone suffices. That inconsistency alone costs marks. 

  For the marking: The answer nails key concepts (control experiment, intervention) but fails on causality fundamentals and drifts into irrelevant philosophy. The prose is confident but muddled on core issues. 6/10 feels fair – above average for grasping basics but penalised for major errors. 

  Should emphasise in feedback that linear probes ≠ causal evidence, and that coherence trusses philosophical asides. Student clearly understands more than most but needs precision on what establishes "use" versus "presence".
answer: |-
  Here is your marking breakdown and script comments as requested:

  1.  **Awarded 6/10.** While the answer correctly identifies key concepts (decodability vs. use, importance of the control, need for intervention), it fatally undermines itself by later contradicting the necessity of intervention and misapprehending the critic's core concern regarding probe overfitting.
  2.  **Correct Identification:** The student correctly identifies that decodability does not equate to the network *using* the feature, highlights the value of the randomly-initialised control experiment showing information was learned, and accurately proposes intervention (ablation/steering) as the key method to establish causal use.
  3.  **Critical Error:** The claim that "the linear probe is already doing the causal work" and that intervention is only "confirming what the probe has told us" is fundamentally incorrect and contradicts the earlier valid point. Linear probes are purely *diagnostic* tools measuring correlation, not interventionist tools establishing causation; they cannot show the network *relies* on that information.
  4.  **Misunderstanding Critic:** The student misrepresents the critic's primary concern. The critic's point "the probe itself might be doing the work" refers to the probe potentially *overfitting* to incidental statistical patterns in the activations that aren't causally relevant to the network's function, not that the probe "invents" structure (which the control partly addresses). The argument about linear probes having "no hidden layers" does not resolve this overfitting concern.
  5.  **Irrelevant Diversion:** The discussion about the "deflationary line" on representation being a "useful fiction" and the assertion that representation must be taken "literally" are largely irrelevant philosophical tangents not required to answer the specific technical question about establishing causal use, and do not strengthen the core argument.

  **Comments to write directly on the script:**

  *   "Good points: Correct on decodability ≠ use & value of random-net control. Intervention (ablation/steering) correctly identified as key to establish causal use. (✓)"
  *   "Major error: Contradicts earlier point by claiming linear probe *itself* demonstrates causal use ("doing the causal work"). Probes show correlation, *not* causation. Intervention is essential proof, not mere confirmation. (✗ -2)"
  *   "Misunderstands critic: Critic's concern is probe *overfitting* to non-causal signals, not probe 'inventing' structure. Argument about probe having 'no hidden layers' misses this point & doesn't resolve overfitting risk. (✗ -1)"
  *   "Irrelevant tangent: Philosophical discussion on 'representation' as literal/fictional is tangential and not necessary for answering the core technical question about causal use. (-1)"
  *   "Overall: Demonstrates understanding of core concepts (decodability, control, intervention) but undermined by critical error on causality and misunderstanding critic. Ensure consistency and focus on technical evidence for causation."
