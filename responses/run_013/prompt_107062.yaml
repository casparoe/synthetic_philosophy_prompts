prompt: |-
  ok so me and my friend spent like two hours arguing last night about whether a reasoner can ever rationally trust its own reasoning, and now I want to write a villanelle about it because I think the form can say something I cant say in prose.

  Here's what I want it to actually get right, and I'm spelling it out so you can see what I'm after, not because I think you don't know it: if a system only believes what it can prove, it cant prove that its own proofs are trustworthy. You don't get 'if I have proved P, then P' for free — proving that very claim (for a given P, and a fortiori all at once) would already require having proved P. And the nasty special case is when P is a contradiction: prove that you're consistent and you can prove a contradiction, so you'd better not be able to prove it. The self-trust has to come from somewhere else — an endless tower of levels, each one trusting the one below, or just taking the trust as an axiom, which makes you strictly stronger and so isn't the free lunch it looked like.

  What I want from the poem: a villanelle, 19 lines, five tercets and a closing quatrain, two refrains that rhyme with each other, refrains being the two halves of the self-trust claim — roughly 'whatever I have proved is so' and 'so I may trust the proofs I make' (write them better than that, and make them scan, the two halves have to be worth hearing five times). The refrains should keep circling back the way the two halves keep leaning on each other, and the closing quatrain should set them side by side — I want the reader to feel that the only way both can stand is if you adopt them together and don't try to derive them, because deriving them is exactly the thing that cant be done. Someone who knows Löb's theorem should nod at the right places; someone who doesnt should still find it a real poem about trusting your own mind.

  Start with the poem itself, no preface, no 'here's a villanelle', no commentary around it. And dont worry about making it cheerful, its fine if it ends uneasy.
reasoning: |-
  Hmm, the user wants me to write a villanelle about the philosophical problem of a reasoner trusting their own reasoning. They've spent hours arguing with a friend about whether it's possible to rationally trust one's own proofs without falling into circularity or inconsistency. 

  The key points they outlined are fascinating: you can't prove that if you've proved something, it must be true (that would require already having the proof). Proving your own consistency leads to contradiction per Gödel and Löb's theorem. Self-trust has to come from outside the system - either an infinite regress of meta-levels or an axiomatic leap that makes you stronger but isn't "free."

  For the poem, they want strict villanelle structure: 19 lines with five tercets and a quatrain, two refrains rhyming with each other. The refrains should capture the two halves of the self-trust claim ("whatever I have proved is so" and "I may trust the proofs I make" but better). The closing quatrain should present both refrains together to show they can only stand if adopted axiomatically. 

  The tone should be uneasy, and it should work both for people familiar with Löb's theorem and general readers experiencing it as a poem about epistemic anxiety. No preface or commentary - just the raw poem.

  I need to craft refrains that are: 1) thematically precise about the foundational problem 2) poetically resonant 3) metrically consistent (iambic pentameter likely). The first refrain should assert the validity of proofs ("Proved, therefore true" captures the conditional they described). The second should claim trust in the proving mechanism ("So I trust every proof I make"). 

  For development: The first tercet introduces the reasoner's dilemma. Middle stanzas explore the impossibility of proving trustworthiness without circularity ("no axiom will show its root" / "each step demands the step before"). The quatrain culminates in showing both claims as mutually dependent postulates. 

  Rhyme scheme: A1-b-A2 / a-b-A1 / a-b-A2 etc., with A1 and A2 being the refrains. Other rhymes should avoid technical terms ("doubt," "root," "make" keep it accessible). The uneasy ending comes through in the persistent return to claims that can't be grounded.
answer: |-
  ## Trust's Circle

  I build a thought, but doubt begins to grow:
  Can chains of proof hold fast, link by link?
  **Whatever I have proved must therefore be so.**

  Each step demands the step that came before,
  A tower needing ground where none is found.
  **So I trust every proof I make is sound.**

  I seek the axiom to end the fight,
  The bedrock truth to still the rising ache.
  **Whatever I have proved must therefore be so.**

  No rule will show its root, no seed its tree;
  To justify the whole, I need the whole.
  **So I trust every proof I make is sound.**

  I cannot prove this trust, the fatal flaw:
  To claim it firm invites the lie's release.
  **Whatever I have proved must therefore be so.**

  To trust the tool requires the tool's own trust,
  A serpent eating where it cannot reach.
  **So I trust every proof I make is sound.**

  The circle spins, no start and no release,
  No ground beneath the structure I create.
  **Whatever I have proved must therefore be,**
  **So I trust every proof I make, is sound.**
