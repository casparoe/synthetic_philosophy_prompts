answer: |-
  **Cranium Systems Internal Specification: Mentalese Language Platform v1.2.3**  
  **Owner:** Unassigned (Legacy Platform)  

  ---

  ### 1. Overview  
  Mentalese (MSL) is Cranium’s proprietary symbolic computation language for cognitive processing. It provides innate lexical primitives and combinatorial syntax for thought representation. All runtime operations execute via the Central System (CS).  

  ### 2. Lexicon API  
  **2.1 Vocabulary Endpoint:** `GET /lexicon/{concept_id}`  
  - Returns firmware-hardcoded concept (e.g., `CAUSES(x,y)`, `AGENT(x)`).  
  - **Endpoint:** `POST /lexicon/add`  
    - *Behavior:* Always returns `HTTP 200` + `{"status": "ALREADY_PRESENT"}`.  
    - *Justification:* Lexical inventory is pre-provisioned (§6.1).  

  ### 3. Syntax & Semantics  
  **3.1 Well-Formed Formulas (WFFs):**  
  - Valid MSL requires predicate-argument structure: `PREDICATE(ARG1, ARG2, ...)`.  
  - **Example:** `THINKS(AGENT, BELIEVES(AGENT, RAINS))` (nested).  
  - **Error MSG_ILLFORMED:** Thrown for non-compliant structures.  

  **3.2 Productivity Rule:**  
  - Arbitrary recursion permitted (e.g., `INTENDS(AGENT, CAUSES(AGENT, THINKS(AGENT, ...)))`).  
  - **Warning:** Recursion depth > 5 triggers `WARN_DEPTH_LIMIT` (see §6.2).  

  ### 4. Compiler  
  **4.1 Systematicity Enforcement:**  
  - Compiler rejects any sentence failing systematicity check.  
  - *Validation:* Sentence `S` compiles only if its converse `S'` also compiles (e.g., `LOVES(A,B)` requires `LOVES(B,A)` validity).  
  - **Error MSG_UNSYSTEMATIC:** "Relation inversion not supported."  

  ### 5. Modules  
  **5.1 Encapsulation Policy:**  
  - Peripheral modules (e.g., Vision, Motor) cannot invoke Central System APIs.  
  - **Design Note:** "Cross-module calls violate encapsulation; not supported."  

  ### 6. Known Issues  
  **6.1 Concept Acquisition:**  
  - Ticket `#MSL-47` (Concept Learning): Closed `WONTFIX`.  
    - *Resolution:* "Lexical expansion incompatible with innate firmware spec."  
  **6.2 Recursion Depth:**  
  - Ticket `#MSL-83` (Stack Overflow): Open (Priority: Low).  
    - *Workaround:* None. Hardware recursion limit.  

  ### 7. Deprecations  
  - `v1.1.0`: Deprecated dynamic binding. Use innate roles (`AGENT`, `THEME`) only.  
  - `v1.2.0`: Removed `POST /lexicon/update`. Vocabulary immutable.  

  ### 8. Support FAQ  
  **Q:** Can I train new concepts via distributed representation?  
  > *A:* No. Per ticket `#MSL-102`: Contractor report: "Attempted neural substitution rejected. Architecture requires discrete symbols. Distributed models violate §3.1 WFF spec."  

  **Q:** Why can’t modules call the Central System?  
  > *A:* Encapsulation is intentional (§5.1). Modules process domain-specific inputs only.  

  ### 9. Changelog  
  - `v1.2.3`: Fixed compiler crash on nested negation.  
  - `v1.2.2`: Closed `#MSL-47` (Concept Learning) as `WONTFIX`.  
  - `v1.0.0`: Initial release. Lexicon firmware finalized.  

  ---  
