answer: |-
  *(Clears throat thoughtfully, adjusting spectacles)*  
  Your characterisation is not without justice, though I must demur at the suggestion of a double standard. The present system of landed property and inheritance *is* indefensible, resting as it does upon accident of birth rather than desert, and I have denounced it as such. Landlords benefit from a system they did not create, whereas any transition to communal property demands active virtues – prudence, restraint, public spirit – from the masses who must operate it daily. The test, sir, is not of inherent virtue, but of the *sustained exertion* required to manage common property without succumbing to indolence or discord – a test the present landlord class, however undeservedly, are largely spared by the passive nature of their rents.

  Your proposed scheme... *(pauses, steepling fingers)*... is ingenious. It avoids the immediate pitfalls of common management and preserves the engine of individual enterprise within the firm. A fixed share of profits drawn into a national fund, distributed equally – it directly addresses the arbitrary inequality of distribution, a matter indeed of human institution. I concede it dodges several of my more practical objections concerning production: the managers retain their incentives, the wage system operates, the structure of individual industry remains. On the surface, it appears mechanically feasible without requiring an antecedent moral revolution.

  Yet, sir, you press me: why not embrace it? My hesitation lies not in the mechanism itself, but in its *consequences* and its *sufficiency*. Firstly, while it alleviates inequality of *income*, it leaves untouched the profound inequality of *power* inherent in the wage relation. The labourer remains dependent, selling his time to owners of capital whose interests may still diverge sharply from his own. Does this fund truly cultivate that sense of being a partner in the enterprise, that elevation of character and intelligence I deem essential for true progress? Or is it merely a palliative, a monetary adjustment leaving the underlying hierarchy and its attendant moral dangers intact?

  Secondly, while it requires no *antecedent* transformation of character, I profoundly question whether it would *foster* the transformation necessary for further, deeper reforms – or even for its own long-term stability. Would this dividend, received passively by all, truly inspire the citizenry to greater public spirit, to that careful vigilance over the common fund and its source (the profits of industry) which its defence would require? Or might it risk encouraging a certain complacency, a reliance on the automatic machinery of the state, without developing the active faculties and shared responsibility essential for a genuinely cooperative society? It mitigates the *evil* of unequal distribution, admirably so, but I doubt its efficacy in nurturing the *positive good* of a public-spirited citizenry capable of sustaining, and deserving, a more profound social freedom. The reform, sir, may not demand prior perfection, but can it thrive – can it avoid corruption or stagnation – without *concurrently* fostering the character that alone makes freedom fruitful?

  *(Leans forward slightly)* I ask you, in turn: does your scheme aim merely at a more equitable distribution of wealth, or does it aspire to cultivate the higher qualities of mankind? And if the former, is it enough?
