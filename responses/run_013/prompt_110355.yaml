answer: |-
  Here is a two-page research proposal based on your core idea, followed by the structured JSON summary.

  **Research Proposal: Attentional Bias – The Missing Category in Distinguishing Preference from Prejudice**

  **1. Research Question:** What diagnostic criteria can reliably distinguish moral attitudes rooted in attentional structures (biases of salience and omission) from those rooted in beliefs (credences) or preferences (utilities), particularly in cases where existing institutional tests fail?

  **2. The Problem & Standard Positions:** Institutions struggle to differentiate deeply held preferences from pernicious biases in contexts like jury selection, hiring, ethics boards, and personal relationships. Existing tests focus on the *content* or *function* of the attitude itself:
      *   **Sincerity/Identity Test:** Is the attitude deeply held and identity-defining? (Fails: Sincere identity-defining views can still be biased; biases can feel like core preferences).
      *   **Evidence-Responsiveness Test:** Does the attitude adjust to counter-evidence? (Fails: Many biases exhibit motivated reasoning, appearing responsive; some preferences are stubbornly held without being biases).
      *   **Unjust Hierarchy Test:** Does the attitude function to sustain systemic injustice? (Fails: Requires contested normative judgment *first*; individuals can sincerely disavow hierarchy while holding biased attentional structures that sustain it).
      *   **Preference + Power Test:** Is it a preference held by those with power over the affected group? (Fails: Overly broad; conflates the *source* of the attitude with its *structure*; doesn't diagnose the attitude itself).
  These tests often miscategorize problematic attentional structures as legitimate preferences because they focus on the attitude's epistemic status or functional outcome, not the *process* of its formation and operation within deliberation.

  **3. The Proposed Missing Slot: Attentional Bias**
      *   **What it is:** A habitual pattern governing *what features of a situation or person enter conscious deliberation as relevant*, influencing salience, pattern recognition, and what possibilities/considerations are omitted entirely. It operates pre-consciously, shaping the input to belief/desire processing.
      *   **Why it differs:**
          *   **From Credence (Belief):** It is not a propositional judgment about the world (e.g., "Group X is less capable"). It determines *which data* feeds into forming such judgments. Correcting a false belief doesn't necessarily retrain what gets noticed.
          *   **From Utility (Preference):** It is not a valuation (e.g., "I prefer working with people like me"). It shapes *which aspects* of a person/situation are evaluated (e.g., noticing/discounting certain traits) and *what range of options* are considered viable (e.g., never conceiving of a man as a primary caregiver).

  **4. Core Hypothesis & Load-Bearing Move:** Attentional structures constitute a distinct category of moral attitude formation/operation, irreducible to belief or desire. **The load-bearing move is demonstrating that attentional structures exhibit unique functional profiles (e.g., remediation via habituation/exposure, not evidence/correction or accommodation) and causal roles in deliberation (structuring input, not constituting the output), and that these profiles persist even when controlling for belief and desire content.** If attention collapses into belief or desire in its functional role and remediation, the project fails.

  **5. Methodology (Conceptual Work & Case Studies):**
      *   **Phase 1: Conceptual Groundwork & Taxonomy Refinement (Months 1-3)**
          *   *Activity:* Analyze philosophical (Murdoch, Nussbaum, attention ethics) and psychological (dual-process theory, implicit bias, salience literature) accounts of attention/moral perception. Precisely define "attentional structure," "salience," "deliberative omission." Map the functional space between belief, desire, and attention.
          *   *Deliverable:* Refined conceptual framework paper outlining the tripartite taxonomy.
      *   **Phase 2: Case Analysis Against Rival Frameworks (Months 4-7)**
          *   *Activity:* Select 5-7 hard cases (e.g., the traditional juror, the admissions committee member, the surgeon's refusal, the brother-in-law's household views, a hiring manager insisting on "cultural fit"). Apply each rival test (Sincerity, Evidence, Hierarchy, Power) and the attentional framework to each case. Identify where rival tests yield indeterminate or counterintuitive results and how the attentional framework provides a distinct diagnosis/pathway.
          *   *Deliverable:* Detailed case study dossiers and comparative analysis paper.
      *   **Phase 3: Remediation Pathways & Institutional Implications (Months 8-10)**
          *   *Activity:* Based on the distinct nature of attentional bias, develop specific remediation strategies (e.g., structured deliberation protocols forcing consideration of omitted factors, exposure to counter-stereotypical exemplars, attentional retraining exercises). Contrast with belief-correction (education) and preference-accommodation. Analyze feasibility/pitfalls for institutional contexts (courts, hiring, ethics boards).
          *   *Deliverable:* Framework for diagnosing attentional bias and toolkit of potential interventions.
      *   **Phase 4: Synthesis & Writing (Months 11-12)**
          *   *Activity:* Integrate findings into coherent argument. Draft core chapters/articles. Address central objection robustly.
          *   *Deliverable:* Complete draft of monograph core or 2-3 article manuscripts.

  **6. What Would Show the Project Failing (Falsifier):** If, across the case studies, the purported effects of "attentional structure" can *always* be fully explained and predicted *without remainder* by the agent's existing beliefs (about probabilities, traits, causal relations) and utilities (values, desires), and if the proposed remediation strategies for attention prove indistinguishable in mechanism or outcome from belief correction or preference accommodation, then the hypothesized distinct category collapses. Success requires finding cases where attention explains phenomena belief/desire alone cannot, and where remediation requires distinct techniques.

  **7. What Success Looks Like:** Success means establishing "attentional bias" as a robust, non-collapsible category within the taxonomy of moral attitudes. It would provide:
      *   A clearer diagnostic lens for hard cases where current tests falter.
      *   A principled justification for novel institutional interventions focused on deliberation structure and exposure (beyond bias training or accommodation).
      *   A theoretical framework that better explains the persistence and operation of certain biases even in the face of sincere egalitarian beliefs and desires.
      *   A foundation for future empirical work on attentional retraining.

  **8. Central Objection & Response:**
      *   **Objection:** "Attention" is not a distinct mental category; it's merely the selective *activation* of relevant beliefs or the *focus* driven by current desires/utilities. Your "third slot" collapses into belief or desire.
      *   **Response:** While attention interacts with belief/desire, it possesses autonomy: 1) *Habitual Salience:* Patterns of noticing/omitting can become ingrained habits *independent* of current belief/desire (e.g., noticing threat cues based on race despite disbelieving stereotypes). 2) *Causal Primacy:* Attentional patterns *shape* which beliefs are formed/activated and which desires are engaged (e.g., not noticing a qualified candidate's potential prevents belief formation about them). 3) *Distinct Remediation:* Altering attentional habits requires techniques (habituation, exposure) fundamentally different from revising beliefs (evidence) or accommodating desires (policy change). Its functional role is structuring input, not constituting evaluative output.

  **9. Scope Risk (Honest Assessment):** This is ambitious. A year is sufficient to *develop the core conceptual argument, analyze key cases demonstrating the gap in existing frameworks, articulate the distinctiveness of attentional structures, outline remediation implications, and produce significant written outputs (papers/core chapters)*. However, fully fleshing out the institutional toolkit across multiple domains or conducting a comprehensive survey of all possible objections leans towards book-length work. This fellowship year is the crucial foundation – proving the concept and its value – upon which that larger project could be built. Focused case selection and disciplined scope within each phase are essential.

