  ## Peer Review Packet: *Annals of Rationalist Inquiry*  
  **Manuscript ID:** ARI-1684-XXVII  
  **Title:** *Geometrica Politica: The Quadrature of the Circle and the Necessary Foundations of Sovereign Power*  
  **Author:** T.H. (Anonymous per request)  

  ---

  ### REFEREE REPORT  
  **Referee:** Professor Alistair Finch, FRS  
  **Chair of Geometrical Sciences, Merton College, Oxford**  
  **Date:** 12th October, 1684  

  **Overall Assessment:** Reject. While the manuscript exhibits considerable intellectual vigour and a bold synthesis of disparate fields, both its core geometrical demonstration and its subsequent political application suffer from fatal flaws in reasoning. The ambition to establish certainty in politics akin to geometry is philosophically intriguing, but the execution fails to meet the requisite standards of demonstrative proof.

  **Assessment of the Geometrical Demonstration ("The Quadrature"):**  
  The author presents a novel construction for squaring the circle, utilizing a complex spiral generated by the continuous motion of a point under defined constraints relative to a given circle's circumference and radius. The construction is meticulously described, and the accompanying figures are clear. The author claims this spiral, when rectified and compared to the circle's circumference, yields a line segment precisely equal to the side of a square with area equivalent to the circle.

  *   **Key Flaw:** The central error lies in the transition from approximation to equality. The construction, while ingenious, demonstrably produces a spiral whose rectified length *approximates* the required side of the square with remarkable (though unquantified) closeness for smaller circles depicted. However, the manuscript asserts without rigorous proof that this construction yields *exact* equivalence. Specifically, Step VII relies on the unproven assumption that the ratio expressed by the final operation of the spiral's generation (involving the summation of infinitesimal segments derived from the circle's properties) is precisely equal to the ratio defining the side of the square. In essence, the quantity sought (the side of the square) is subtly presupposed within the mechanism generating the spiral used to find it. The construction demonstrates a method for close approximation, not exact quadrature.

  *   **Historical Context:** The referee acknowledges that the author could not have been aware of the more recent transcendental nature of π (Lindemann, 1882), which definitively proves the impossibility of circle quadrature by ruler and compass (or any finite algebraic construction). This impossibility, however, underscores the necessity for absolute rigor in such claims, which the manuscript lacks. The author's complaints regarding prior rejections ("envy of established Mathematicians," "prejudice against Novelty in the Schools") are noted but presented as assertions, not arguments relevant to the geometrical validity.

  **Assessment of the Political Application ("The Indivisibility of Sovereignty"):**  
  The author proposes that the *same* method of "generative definition and necessary consequence" used in the geometrical construction applies directly to politics. Just as geometric truths derive from the definitions of figures *we ourselves draw*, political truths derive from the definitions of the Commonwealth *we ourselves institute*. The manuscript defines "Sovereign Power" (S) as "that Power which is Supreme, Unlimited, and from which all Authority within the Commonwealth flows." It then argues, through a series of propositions reminiscent of geometric deduction, that S must be Absolute, Indivisible, and located in a single Will (whether Monarchical, Aristocratic, or Democratic, though Monarchical is strongly implied as the most "geometrically" stable).

  *   **Key Flaw:** The political deduction suffers from a critical circularity absent in the geometric case. The author's demonstrations are impeccably logical *conditional upon the initial definitions*. For instance: Proposition V ("Sovereign Power, being Supreme, cannot be Divided, lest there be no Supreme") flows directly from the definitional stipulation that "Supreme" implies "without equal or superior." Proposition VII ("Any Limitation upon S is a Contradiction, for the Limiter must then hold Power over S, which is Supreme by Definition") similarly depends entirely on the prior definition of S as "Unlimited." The manuscript demonstrates that *if* one defines Sovereignty as Absolute, Indivisible, and Supreme, *then* it follows necessarily that Sovereignty must be Absolute and Indivisible. However, it provides no independent, demonstrative proof *why* Sovereignty *must* be defined in this manner for a functioning Commonwealth, beyond analogy to geometric figures we construct. The necessity resides entirely within the author's stipulated definitions, not in an external reality demonstrable to all reason.

  *   **Author's Assertions:** The author's contention that the political conclusions have been ignored due to their "distasteful necessity" or "the timorousness of Scholars fearing Princes" is, like the complaints about the mathematics, asserted rather than argued or evidenced within the logical structure of the manuscript itself.

  **Concluding Remarks:**  
  Despite these fundamental criticisms, the referee finds the core philosophical impulse – the search for a standard of demonstrative certainty in politics akin to geometry – worthy of serious consideration. The author rightly observes that geometry achieves its certainty because it reasons about objects (figures) constructed by our own definitions and postulates. The author extends this compellingly, arguing that political society, being an "Artificiall Man" of our own making through covenant, should similarly be amenable to demonstrative reasoning based on its foundational definitions. *This principle – that we can only truly demonstrate the necessary consequences of what we ourselves institute – possesses significant intellectual merit and force.* It is the application of this principle in the present manuscript, both geometrically and politically, that falters under scrutiny. The quadrature fails its own geometric standard, and the political conclusions, while logically consistent *within their defined framework*, lack the independent, necessary grounding the author claims for them. The ambition is admirable; the execution, regrettably, is not.

  **Recommendation:** Reject.

  ---

  ### EDITOR'S DECISION LETTER  
  **Journal:** *Annals of Rationalist Inquiry*  
  **From:** Dr. Eleanor Vance, Managing Editor  
  **To:** T.H. (Correspondence Address: The Ship, Greenwich)  
  **Date:** 30th October, 1684  

  Dear T.H.,

  Thank you for submitting your manuscript, "Geometrica Politica: The Quadrature of the Circle and the Necessary Foundations of Sovereign Power," to the *Annals of Rationalist Inquiry*. We have now received a detailed assessment from an expert referee in the field of geometry, whose opinion we value highly.

  The referee commended the intellectual ambition and vigour of your work, particularly your endeavour to establish a foundational standard of demonstrative certainty applicable to both mathematical and political reasoning. The analogy drawn between the constructed nature of geometric figures and the instituted nature of the Commonwealth was noted as philosophically significant.

  However, concerning the specific claims of the manuscript, the referee identified insurmountable difficulties. Regarding the geometric construction for the quadrature of the circle, the referee finds that while your method produces a close approximation, it contains a crucial logical step that assumes the very equality it seeks to demonstrate, thereby failing to achieve the exact quadrature required. The impossibility of such a quadrature by the means proposed has, we note, been more firmly established in recent times than was known in earlier decades.

  More critically for the journal's scope, the referee assessed the application of your "generative definition" method to the question of Sovereignty. The referee acknowledges the internal logical consistency of your deductions *given your specific definitions* of Sovereign Power as Supreme, Unlimited, and the Source of all Authority. However, the necessity of defining Sovereignty precisely in this manner, prior to the deduction of its absolute and indivisible nature, was found to be asserted rather than demonstrated independently through your method. Consequently, while your political conclusions follow logically from your premises, the referee concludes that the manuscript does not provide a demonstrative proof of these conclusions *as necessary features of any and all Commonwealths*, independent of your initial definitions. The analogy to geometric construction, while insightful, was deemed insufficient to bridge this gap.

  The referee also noted your comments concerning the reception of your ideas but found them presented as assertions external to the manuscript's demonstrative structure.

  While we appreciate the originality and the underlying philosophical thrust of your work – particularly the serious proposition that political entities, being artifacts of human institution, might be susceptible to a form of demonstrative reasoning akin to geometry – the flaws identified in both the geometric core and the political application are fundamental. Therefore, we must decline publication of the manuscript in its current form in the *Annals of Rationalist Inquiry*.

  We understand this decision may be disappointing, given the significant effort evident in your work. We thank you for considering the *Annals* and wish you success in placing your manuscript elsewhere.

  Sincerely,  
  Dr. Eleanor Vance  
  Managing Editor, *Annals of Rationalist Inquiry*

