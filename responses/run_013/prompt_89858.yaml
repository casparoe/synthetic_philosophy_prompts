  ### Theory Change Activity: The Malthusian Predicament

  **Objective:** Students experience the tension between early falsification and late vindication of a theory, grappling with the gap between being *right* and being *justified*.

  **Teams & Roles (4 teams of 4):**  
  1. **Clockwatchers (Early Falsifiers):** Focused on the doctrine’s two-generation deadline. Must set an initial falsification condition tied to interval 3 (50 years).  
  2. **Holists (Skeptics):** Consider multiple variables (yield, population, rotation). Must include at least two columns in their falsification condition.  
  3. **Mechanists (Loyalists):** Prioritize population dynamics. Must tie their condition to population growth or real wages.  
  4. **Contextualists (Revisionists):** Monitor external factors (e.g., rotation adoption). Must reference the rotation column in their condition.  

  **Materials:**  
  - **Doctrine Cards** (1 per team): Printed with the provided text.  
  - **Falsification Contract Cards** (1 per team):  
    ```  
    FRONT:  
    Team: ___________  
    Initial Falsification Condition:  
    "If by interval [__], [column] is [> / < / =] [value], the doctrine is falsified."  
    Signed: ___________   Date: ___________  

    BACK (Reason Log):  
    Revision 1: Interval [__] | New Condition: ___________ | Reason: ___________ | Principled? [ ] Yes [ ] No  
    Revision 2: Interval [__] | New Condition: ___________ | Reason: ___________ | Principled? [ ] Yes [ ] No  
    ```  
  - **Data Cards:** One per interval (1–8), revealing only cumulative data up to that interval.  
  - **Public Tally Board:** Tracks each team’s current stance (✅ = Doctrine Alive; ❌ = Falsified).  

  **Scoring Scheme (Non-Monetary):**  
  - **Adherence Points:** +1 for declaring falsification *only* when their condition is met.  
  - **Principled Revision Points:** +2 if peers agree their "Principled?" check is honest (peer vote in debrief).  
  - **Final Vindication Points:** +3 if their *last stance* aligns with the long-run outcome (doctrine is *eventually* correct).  
  **Winner:** Team with most points. Prize: "Most Justified Theorist" title.  

  ---

  ### Round-by-Round Structure (90 Minutes Total)

  #### **0. Setup (10 min)**  
  - **0–5 min:** Introduce activity, doctrine, and team roles. Emphasize the two-generation deadline.  
  - **5–10 min:** Teams write/seal initial falsification contracts. Distribute Interval 1 data cards.  

  #### **Round 1: Interval 2 (1775–1800) (10 min)**  
  - **Reveal Data:** Interval 2 card (pop=10.9m, yield=115, rotation=20%, wage=105).  
  - **Teams:**  
    - Check if condition met → Declare ❌/✅ on tally board.  
    - *Optional:* Revise condition (log reason + check "Principled?").  
  - **Critical Moment:** Clockwatchers may falsify if condition set for interval 2 (unlikely).  

  #### **Round 2: Interval 3 (1800–1825) (15 min)**  
  - **Reveal Data:** Interval 3 card (pop=12.2m, yield=130, rotation=45%, wage=107).  
  - **Teams:**  
    - Check condition → Update tally.  
    - Most Clockwatchers declare ❌ (wage >100 at 50-year mark).  
    - Others may revise (e.g., Holists: "Rotation only 45%, so gain not fully absorbed").  
  - **Predictable Conflict:** Clockwatchers are "out" but can re-engage by revising.  

  #### **Round 3: Interval 4 (1825–1850) (15 min)**  
  - **Reveal Data:** Interval 4 card (pop=13.5m, yield=138, rotation=62%, wage=102).  
  - **Teams:**  
    - Check/revise conditions.  
    - Mechanists may falsify (wage still >100).  
    - Contextualists revise: "Rotation still rising → delay absorption?"  
  - **Tension:** Wage dips slightly (107→102); early falsifiers feel vindicated.  

  #### **Round 4: Interval 5 (1850–1875) (10 min)**  
  - **Reveal Data:** Interval 5 card (pop=15.0m, yield=141, rotation=74%, wage=94).  
  - **Teams:**  
    - All note wage drop (102→94).  
    - Early falsifiers reconsider: "Why falling *now*?"  
    - Loyalists (Mechanists) may revise to avoid falsification.  

  #### **Rounds 5–7: Intervals 6–8 (15 min total)**  
  - **Quickfire reveals** (5 min each): Data shows wage declining (87→83→81).  
  - **Teams:** Final revisions. Most declare doctrine ✅ (wage fell, but late).  

  #### **Debrief (15 min)**  
  1. **Reveal Full Data & Ground Truth:**  
     - Doctrine’s mechanism was real but slow (absorption took ~100 years, not 50).  
     - Early falsification (interval 3) was *justified*; late vindication (interval 8) was *right*.  
  2. **Map to Philosophy:**  
     - **Interval 3:** Justification ≠ truth (evidence supported falsification).  
     - **Interval 5:** Revisions questioned—were reasons *principled* or *ad hoc*?  
     - **The Box Check:** If a reason (e.g., "slow rotation diffusion") *depended* on the observed data, ticking "Principled?" is dishonest.  
  3. **Score & Discuss:**  
     - Peer-vote on "Principled?" checks.  
     - Why did being "right" require ignoring the deadline?  

  ---

  ### Predictable Problems & Fixes  
  1. **Problem:** Teams set vague conditions (e.g., "wage high").  
     **Fix:** Require specific thresholds (e.g., "wage >100").  
  2. **Problem:** Clockwatchers idle after falsifying.  
     **Fix:** Allow them to revise and re-enter (scoring incentivizes engagement).  
  3. **Problem:** "Principled?" checks are all ticked "Yes."  
     **Fix:** In debrief, dissect one revision where the reason *relied* on observed data (e.g., "rotation was slow").  
  4. **Problem:** Debate erupts.  
     **Fix:** Use a timer; remind teams to log reasons, not argue.  

  ---

  ### What the Activity *Cannot* Reproduce  
  **The Weight of Time:** The activity compresses 200 years into 90 minutes. IRL, scientists die before vindication, institutions abandon theories, and new paradigms emerge. **Supply in words:** "Malthus never saw 1925. When evidence outlives theorists, being ‘right’ loses meaning—surviving theories are those that *retrofit* evidence."  

  ---

  ### Closing Note for You: The Real Malthus Case  
  Malthus’ 1798 doctrine predicted that land constraints would doom living standards to stagnation. He missed the Industrial Revolution’s impact: innovation (steam, fertilizers) broke the link between land productivity and population, enabling sustained wage growth. Yet, he wasn’t wholly wrong—demographers now show his dynamics *did* govern pre-industrial economies. Populations swamped productivity gains, keeping wages flat for millennia. The tragedy? Malthus died in 1834, as wages began to rise. His theory was falsified on schedule (by his deadline) but partially vindicated a century later—for eras he never claimed to describe.
