prompt: |-
  I am a software engineer with no formal training in philosophy. I have been reading about imprecise probabilities — treating uncertainty as a set of distributions, or a range of credences, rather than committing to one — and I want to know where a relative outsider with about a year of spare time and possibly one collaborator should actually push. Which open questions in this area matter most, and in what order? Please defend the ordering: for each, say why it is upstream of the others, how much of it can be settled with fairly modest mathematical tools, and what would cause you to reorder the list. One distinction I keep half-understanding and would like you to place: imprecision that comes from information I could in principle go and collect, versus imprecision that reflects something genuinely indeterminate — in the world, or in what I want. If that distinction is doing real work, tell me where it cuts; if it is a distraction, tell me why. Candidates I have run across include dilation, the choice between maximin-style and other decision rules, and how to update a set of probabilities on new evidence, but I would rather you tell me if the interesting question lies somewhere else entirely.
