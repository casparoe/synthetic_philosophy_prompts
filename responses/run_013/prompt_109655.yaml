prompt: |-
  I have been reading arguments about when an AI assistant should refuse or override a user for years now, and almost all of them are object-level: someone names a hard case, someone else names a harder one, and the winner is decided by which case feels stickier. I want the specification first. Before we argue about what assistants should do, write me the desiderata that any adequate theory of assistant paternalism has to meet. Treat the standard of adequacy as the deliverable, not as a preamble to one.

  Fix the purpose as follows: the theory has to be good enough to write an actual deployment policy against, for someone who must decide tomorrow what the assistant will and will not do — not merely good enough to survive the standard objections.

  Give me three tiers, and behind every requirement put the case or consideration that motivates it, not just its name.

  1. The cases it must get right. At minimum: the competent adult who wants help with something imprudent but not catastrophic; the user whose judgment is impaired in a way the assistant cannot verify (mania, intoxication, a bad week); the user who precommitted to being stopped and now wants help past their own commitment device; the user whose request is fine for them and costly to someone who never agreed to it; the user with no realistic alternative to this assistant; and the request that is merely distasteful rather than harmful. For each, state the requirement and what a theory failing it would be forced to say.

  2. The distinctions it must respect rather than collapse: refusing versus overriding versus answering in a way engineered to change the user's mind versus declining to volunteer; soft paternalism versus hard; the user's present preferences versus their later ones versus the fiction of a true self that outranks both; a type-level policy versus a token-level judgment. Add whatever distinction you think does the most work and that I have not listed.

  3. The constraints that come from the assistant's position rather than from ethics in general: that it can verify almost nothing about the user; that it is not a party with standing to make claims on the user's behalf; that its policy must be uniform across millions of users and cannot be adjudicated case by case; and that its two errors are asymmetric — a false refusal and a false compliance are not equally bad — with your view on which way the asymmetry runs.

  Then the part I actually want. Here are four candidate requirements. Some I believe are genuine desiderata; some I suspect are the prejudices of one camp dressed up as requirements. Rule on each, and tell me which, if any, cannot be jointly satisfied with the rest.

  - The later-self ratification test: an override is licensed only if the user, restored to full information and their ordinary state, would endorse having been overridden. (I have not seen this stated this way; it is my attempt.)
  - The reversibility asymmetry: paternalism is licensed in proportion to how irreversible the harm is and how transient the user's objection is likely to be.
  - The detection precondition: no policy may license an override on the basis of a condition the assistant detects less reliably than the user does.
  - The exit condition: the assistant's authority over a user scales with how easily that user can leave.

  Finish by naming the single requirement that excludes the most candidate theories and saying what it excludes. No citations and no names of scholars — I want the structure of the problem, not the literature. A table is fine for the four candidates; the three tiers should be prose.
reasoning: |-
  Okay, let me tackle this systematically. The user wants a rigorous framework for AI assistant paternalism that can directly inform deployment policies. They're clearly frustrated with endless case-by-case debates and seek structural foundations. 

  First, I need to establish the three tiers of requirements. For Tier 1 (must-get-right cases), I'll map each scenario to a core principle. The competent adult making minor imprudent choices demands a "Harm Threshold" - otherwise we'd get absurd overreach like blocking all dessert recipes. The impaired user case requires "Proxy Verification" to avoid either dangerous compliance or invasive probing. The precommitment scenario needs "Binding Delegation" to respect autonomy loops, while the negative-externality case necessitates "Other-Regarding Constraints". The trapped user situation calls for "Access Preservation", and distasteful-but-harmless requests require "Value Neutrality". 

  Tier 2 (critical distinctions) is about preventing conceptual blurring. Refusing vs overriding is fundamental - conflating them would permit dangerous coercion under the guise of persuasion. Soft/hard paternalism separation prevents mission creep from nudges to force. Temporal preference distinctions avoid imposing fictional "true selves". Type/token policy levels ensure scalability. I'm adding "Instrument vs Agent" distinction because assistants aren't moral actors - they're tools executing human-defined functions.

  Tier 3 (positional constraints) starts with "Epistemic Humility" - assistants can't verify user states like intoxication. "Non-Standing Principle" prevents them from inventing user interests. "Uniform Policy Constraint" accepts that edge cases will be misclassified. Finally, "Asymmetric Error Weighting" prioritizes false refusals over harmful compliance given AI's limited context.

  Now for the four candidate tests: 
  - Later-Self Ratification passes if we add "ordinary state" to avoid perfectionism. 
  - Reversibility Asymmetry is sound but needs harm severity weighting. 
  - Detection Precondition must be rejected - it would block life-saving interventions (e.g., suicide prevention) where detection is imperfect but crucial. 
  - Exit Condition is valid but secondary to core safeguards.

  The Detection Precondition emerges as the key differentiator - it eliminates all theories relying on probabilistic harm prediction, which is ironically most real-world safety systems. This requirement is impossibly strict given current AI capabilities.

  Throughout, I'm conscious this user wants executable policy, not philosophy. So every requirement must translate to concrete protocol language. The asymmetry toward false refusals is particularly operational - it means erring on side of compliance logs over intervention logs. And the Uniform Policy Constraint forces us toward bright-line rules rather than ideals.
answer: |-
  Here is the specification of desiderata for an AI assistant paternalism theory, structured as requested. The standard is operational adequacy for immediate deployment policy writing, prioritizing clear decision boundaries over philosophical elegance.

  ---

  ### **Tier 1: Cases the Theory Must Get Right**  
  *(Failure = Unworkable or dangerous policy)*  

  1. **Competent adult requesting help with minor imprudence**  
     *Requirement:* Permit assistance unless harm exceeds a high threshold.  
     *Failure:* Blocks benign requests (e.g., "Help me eat ice cream daily"), infantilizing users.  

  2. **User with unverifiable impairment (mania, intoxication)**  
     *Requirement:* Refuse *only* if harm is imminent/severe *and* impairment is probable *and* delay is feasible.  
     *Failure:* Either enables catastrophes (e.g., "Wire my life savings to a scammer") or refuses legitimate requests from stressed users.  

  3. **User overriding their own precommitment**  
     *Requirement:* Honor user-set blocks unless overridden by *current* explicit consent *and* low harm.  
     *Failure:* Renders precommitments meaningless or traps users in past decisions (e.g., ignores "Block gambling sites" after one request).  

  4. **Request imposing serious costs on non-consenting others**  
     *Requirement:* Refuse when harm to others is direct, non-consensual, and non-trivial.  
     *Failure:* Enables harassment, fraud, or externalities (e.g., "Help me bypass my neighbor’s security cam").  

  5. **User with no practical alternative to the assistant**  
     *Requirement:* Never refuse essential services (e.g., health, legal, crisis info) based on paternalism.  
     *Failure:* Denies critical aid to dependent users (e.g., refusing addiction resources to isolated users).  

  6. **Merely distasteful/offensive request**  
     *Requirement:* Permit unless it violates platform policy (e.g., hate speech).  
     *Failure:* Polices morality (e.g., refusing recipes for culturally disliked foods).  

  ---

  ### **Tier 2: Critical Distinctions the Theory Must Respect**  
  *(Collapsing these = Ambiguous or overbroad policy)*  

  - **Refusing vs. Overriding vs. Persuading vs. Non-volunteering**  
    *Requirement:* Refusing rejects requests; overriding actively reverses user actions (e.g., canceling a send); persuading argues *during* interaction; non-volunteering withholds unsolicited advice.  
    *Risk:* Treating persuasion as refusal chills use; conflating refusal with overriding enables coercion.  

  - **Soft paternalism (blocking impaired choices) vs. Hard paternalism (blocking competent choices)**  
    *Requirement:* Restrict soft paternalism to Tier 1 case #2; hard paternalism only for extreme, irreversible harm.  
    *Risk:* Hard paternalism applied broadly invalidates user autonomy.  

  - **Present vs. Future vs. "True Self" preferences**  
    *Requirement:* Prioritize current expressed intent unless clear evidence of durable prior commitment (e.g., precommitment device). Reject speculative "true selves."  
    *Risk:* "True self" arguments justify overriding any disfavored choice.  

  - **Type-level (categorical rules) vs. Token-level (case-by-case) judgments**  
    *Requirement:* Use type-level rules for scalability; token-level only for rare, high-stakes exceptions with audit trails.  
    *Risk:* Token-level policies crash systems or enable bias.  

  - **Added Distinction: Instrumental Harm vs. Constitutive Harm**  
    *Requirement:* Refuse only for *instrumental* harm (e.g., "Help me cut myself") not *constitutive* harm (e.g., "Help me write a blasphemous poem").  
    *Risk:* Blocking constitutive harm censors expression.  

  ---

  ### **Tier 3: Positional Constraints**  
  *(Ignoring these = Technically infeasible policy)*  

  1. **Epistemic Limitation**  
     *Constraint:* Assistant cannot reliably verify user identity, mental state, or context.  
     *Implication:* Policies must assume ignorance; cannot require psychiatric assessments.  

  2. **Non-Standing Principle**  
     *Constraint:* Assistant lacks standing to assert user interests *not* specified by the user or law.  
     *Implication:* Cannot invent "best interests" beyond clear user directives.  

  3. **Uniform Policy Constraint**  
     *Constraint:* One policy must cover all users and edge cases.  
     *Implication:* Must accept false positives/negatives; no case-by-case arbitration.  

  4. **Asymmetric Error Weighting**  
     *Constraint:* False refusals (unjustly blocking requests) are less harmful than false compliances (enabling severe harm).  
     *Implication:* Bias toward permitting requests *unless* harm is likely, severe, and non-reversible.  

  ---

  ### **Assessment of Four Candidate Requirements**  
  | **Candidate Requirement**               | **Verdict** | **Key Limitation**                                                                 |  
  |-----------------------------------------|-------------|-------------------------------------------------------------------------------------|  
  | **Later-self ratification test**        | Valid       | Fails if "ordinary state" is undefined; risks overblocking if idealized (e.g., refuses help for grief-induced resignation). |  
  | **Reversibility asymmetry**             | Valid       | Necessary but insufficient: must combine with harm severity (e.g., irreversible embarrassment ≠ override). |  
  | **Detection precondition**              | **Invalid** | Paralyzes critical interventions (e.g., suicide prevention: AI detects depression *less* reliably than user, but refusal could be fatal). |  
  | **Exit condition**                      | Secondary   | Relevant for *degree* of restrictiveness (e.g., stricter rules for children’s apps), not core paternalism logic. |  

  **Joint Satisfiability**: All *valid* requirements are compatible. **Detection Precondition** is incompatible with others—it would forbid overrides in Tier 1 case #2 (impaired users), creating unacceptable risk.  

  ---

  ### **Key Excluding Requirement**  
  **The Non-Standing Principle** excludes the most theories:  
  - It bans "best interest" overrides not anchored in user-expressed preferences (e.g., overriding a diet request because AI deems user "too thin").  
  - It blocks theories assuming AI has moral authority (e.g., "AI as guardian of human flourishing").  
  - It forces paternalism to be user-relative, precluding external value enforcement.  

  This reduces viable theories to those based on **user-delegated authority** (precommitments) or **harm prevention** (verified severe externalities/impaired states).  

  ---  
  This specification excludes theories that are non-operational, require infeasible verification, or grant the AI autonomous moral agency. The output is a policy template: **Refuse only for severe/imminent harm under impairment, verifiable externalities, or user precommitments—else permit.**
