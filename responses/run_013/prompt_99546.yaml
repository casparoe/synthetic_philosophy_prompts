prompt: |-
  Ok, I need a hand with something, and I'd rather you really think it through then fire off a list — start by brainstorming a bunch of candidate questions, then cut down to a ranking. Take on the role of a philosopher of science who works on causation, reduction, and levels of explanation, and who's allergic to hand-waving about "emergence."

  Here's the toy I keep chewing on. Picture a box the size of a warehouse, filled with an astronomical number of tiny hard balls — call them simmballs — bouncing around and colliding like billiard balls. Nothing else in the box: no fields, no forces except contact. Now supose the walls and the starting arrangement are set up so that certain stable clusters of simmballs keep recurring, and each cluster reliably gives rise to a particular next cluster — cluster A shows up, and shortly after, cluster B; B shows up, then C. Chain enough of those together and the box looks like it's doing logic: these patterns play the role of premises and conclusions, and the transitions look like inferences. Call each recurring cluster a symbol and the whole contraption a careenium.

  Two readings of it. (1) Only the balls do anything. "Symbol" is a label we paste onto a pattern, and saying a symbol caused the next symbol is like saying the sunrise caused the rooster's crow. (2) The symbol level is real in its own right: once the pattern is stable, the symbol is what makes the next symbol happen, and the ball story is a lower-level description of the same goings-on rather than the only true one.

  I don't want you to just pick a side. What I want is a research agenda. I've got roughly the budget to support two people for two years, or one person for four, on the philosophical end of this — no lab, no simulations beyond whatever runs on a laptop, and no deferring to "we'll know once we have a theory of everything." Which open questions here are worth that money? Give me a ranking and defend it: for each, why it's upstream of the others, how tractable it is for someone whose tools are arguments rather than equations, and what would move it up or down the list over the next year or two. Also tell me which ones are probably pseudo-questions that dissolve rather than get answered, and which look sexy but wouldn't change anything downstream if they got settled.

  Two wrinkles in the toy that I suspect are doing more work than they look like they are, so please address them rather than treating them as decoration. First, the box comes with a poker: you can reach in and nudge a single simmball. Nudge it and the same symbol usually still shows up downstream, but sometimes the whole chain of symbols reorganizes. Second, you can swap individual simmballs out for identical ones, one at a time, and the symbols don't notice — the pattern survives wholesale replacement of its parts.

  And while you're at it: if you think my framing has already begged the question, say where.
reasoning: |-
  Okay, the user is presenting a fascinating philosophical problem involving a simulated system (the careenium) where simple physical interactions (simmballs colliding) give rise to stable patterns (symbols) that appear to perform logical operations. They're explicitly asking for a research agenda rather than taking sides in the emergence debate, and they've added two important wrinkles: the poker (single simmball nudge) and particle substitution (swapping identical simmballs). 

  Hmm, the user is clearly deeply versed in philosophy of science - the reference to "allergic to hand-waving about emergence" and the precise setup show they've thought hard about this. Probably an academic or advanced researcher. Their frustration with superficial treatments of emergence is palpable. The budget constraint (2-4 person-years) suggests they want concrete, actionable philosophy rather than grand theorizing.

  The core tension seems to be between: 
  - Strict causal fundamentalism (only balls are real)
  - Pattern realism (symbols have causal power)
  With those two wrinkles testing the boundaries of each view.

  First I need to unpack why those wrinkles matter:
  The poker probe challenges whether symbols are truly irreducible - if nudging one ball can sometimes destroy the pattern, doesn't that show pattern stability depends on micro-details? But the substitution invariance cuts the other way - if you can replace all parts without affecting function, doesn't that suggest patterns are what matter?

  The user might be underestimating how much work the "identical simmballs" assumption is doing. In real physics, perfect indistinguishability is quantum mechanical - classically, even identical particles would have distinct histories. But they specified "hard balls" so we'll run with it.

  Key insight: This isn't just about emergence - it's about causal granularity. At what scale do we draw causal boundaries? The poker makes micro-details matter occasionally, while substitution shows they usually don't. That tension is gold for research.

  For the research agenda, I should prioritize questions that:
  1) Force a confrontation between the two readings
  2) Can be addressed with conceptual tools
  3) Have knock-on effects for other issues
  4) Avoid dead ends like rehashing supervenience debates

  Top candidate: The causal drainage problem. If we say symbol A causes symbol B, but actually it's simmball collisions all the way down, where does the causal power "drain" to? This is upstream because until we solve it, we can't even frame the other questions properly. And it's tractable - we can use interventionist causal models to test counterfactuals.

  Second should be the invariance question - why substitution preserves function but poker nudges sometimes don't. This exposes where the "causal joints" are between levels. The poker is like a minimal intervention to test macrostates.

  Third might be the implementation neutrality angle - how much micro-level wiggle room exists for the same symbolic sequence. This connects to multiple realizability debates but with concrete parameters.

  Should demote questions about "real patterns" - that's been chewed over forever with little progress. Likewise, avoid defining "emergence" directly - treat it as an outcome rather than a starting point.

  Biggest risk in their framing: Assuming that causal closure of physics settles everything. But causal closure doesn't preclude higher-level causal stories - it just requires they don't introduce new energy. Need to separate causal explanation from ontological commitment.

  The budget is tight so we must focus where conceptual analysis gives most leverage. No open-ended literature surveys - every project should have "deliverables" like formal criteria for when pattern causation holds.
answer: |-
  Here's a research agenda tailored to your constraints, prioritizing questions that are philosophically deep, tractable with conceptual tools, and directly engage your "wrinkles." I've ranked them by **upstream impact** (how many downstream questions they clarify), **tractability for philosophical work**, and **avoidance of dead ends**. The poker and substitution invariance aren't decorations—they're essential probes for causality and robustness.

  **Core Insight:** Your careenium forces us to confront **causal drainage** (does all causality "drain down" to the simmballs?) and **robustness without holism** (how do patterns persist while being micro-substitutable yet micro-vulnerable?). This isn't emergent *newness* but **stable causal organization**.

  ---

  ### **Ranked Research Questions**
  #### **1. The Invariance Question: What Determines the Scope of Micro-Invariance?**  
  *   **What to Investigate:** Under what conditions do substitutions (swapping simmballs) *preserve* symbolic sequences, while poker nudges *disrupt* them? Is there a principled distinction between "noise" (micro-changes absorbed by the pattern) and "signal" (micro-changes that reconfigure symbols)?  
  *   **Why Upstream?**  
      - Clarifies the **boundaries of causal relevance**: Which micro-details matter to symbolic causation?  
      - Directly tests **reductionism**: If all causation is at the simmball level, why do *some* micro-changes propagate to the macro-level while most don't?  
      - Engages your wrinkles: Substitution and poker are experiments probing invariance.  
  *   **Tractability:**  
      - Use **interventionist causal models** (e.g., Woodward-style counterfactuals): *"If we intervene to swap/nudge, does the symbolic transition change?"*  
      - Map to **dynamical systems theory** (attractor basins, Lyapunov stability) without equations—e.g., "stability landscapes" for patterns.  
  *   **What Moves the Needle?**  
      - Progress if: We formalize criteria for "pattern resilience" (e.g., critical simmball thresholds).  
      - Demote if: It reduces to trivial probability (all nudges *could* disrupt; it's just unlikely).  

  #### **2. The Causal Drainage Problem: Do Symbols "Screen Off" Simmballs?**  
  *   **What to Investigate:** When symbol A reliably precedes symbol B, does the *symbol* cause B, or do the simmball collisions *at the moment of A* cause B? Does A *screen off* its micro-realization (i.e., is B independent of the simmball details given A)?  
  *   **Why Upstream?**  
      - Tests whether symbolic patterns are **causal hubs** or mere epiphenomena.  
      - Addresses your core dilemma: Is this "sunrise/crow" (reading 1) or genuine macro-causation (reading 2)?  
      - Poker wrinkle: A nudge that disrupts the chain shows micro-details *can* matter—but is this the exception or the rule?  
  *   **Tractability:**  
      - Apply **causal exclusion arguments** (Kim) and **information-theoretic screening-off** (does macro-state reduce uncertainty about future states more than micro-states?).  
      - Analyze **error propagation**: How do micro-errors (nudges) amplify or dampen across transitions?  
  *   **What Moves the Needle?**  
      - Progress if: We show symbols act as **natural abstraction boundaries** (e.g., via computational mechanics).  
      - Demote if: It collapses into semantic debates about "causation."  

  #### **3. Implementation Neutrality: How Much Micro-Wiggle Room Exists?**  
  *   **What to Investigate:** What class of simmball configurations and dynamics *implement the same symbolic sequence*? Is the careenium's logic robust under *global* rearrangements of simmballs (beyond single swaps)?  
  *   **Why Upstream?**  
      - Reveals whether "symbols" are **multiply realizable patterns**—a litmus test for non-reductive explanations.  
      - Connects to your substitution wrinkle: Single-swap invariance is weak; real robustness requires tolerance for larger variations.  
  *   **Tractability:**  
      - Conceptual tools: **Equivalence classes of microstates**, **functional individuation** (define symbols by their input-output roles).  
      - Use toy simulations (laptop-scale) to explore parameter spaces where sequences break.  
  *   **What Moves the Needle?**  
      - Progress if: We find symbolic transitions depend only on *topological* or *geometric* features (e.g., cluster connectivity).  
      - Demote if: It devolves into vague talk of "similarity."  

  #### **4. The Poker Paradox: When Do Micro-Interventions Rescale?**  
  *   **What to Investigate:** Why do some poker nudges cause *cascading reorganizations* (changing future symbols) while others don’t? Is there a predictive marker at the symbolic level?  
  *   **Why Upstream?**  
      - Tests whether macro-causation has **autonomous dynamics**: Can we predict intervention outcomes *at the symbol level* without tracking simmballs?  
      - Directly challenges fundamentalism: If micro-changes sometimes "matter more," is causation still only at the micro-level?  
  *   **Tractability:**  
      - **Catastrophe theory** (bifurcations) and **criticality** (phase transitions) as metaphors.  
      - Case studies: Map nudges to disruptions in finite automata or cellular automata rules.  
  *   **What Moves the Needle?**  
      - Progress if: We identify **symbolic fragility conditions** (e.g., when the system is in a "meta-stable" symbol).  
      - Demote if: It's purely probabilistic (no principled distinction).  

  ---

  ### **Lower-Priority/Pseudo-Questions**  
  - **"Are Symbols *Real*?"** (Ontological question): Likely dissolves. Better to ask: *Do symbols play an indispensable role in causal explanation/prediction?* (See Question 2).  
  - **"Is This Emergence?"**: A semantic trap. Focus on specific criteria (causal autonomy, invariance, screening-off).  
  - **"What Is a Symbol?"**: Circular if divorced from function. Define operationally: *a recurrent state with reliable input-output relations*.  

  ---

  ### **Your Framing: Where You Might Beg the Question**  
  1. **"Stable clusters"**: Stability implies a *timescale*. If symbols evolve slower than simmball collisions, this temporal hierarchy does work (but could be justified).  
  2. **"Gives rise to"**: Sneaks in causal directionality. Do later clusters *depend counterfactually* on earlier ones, or is it just correlation? (Address via interventions in Question 1).  
  3. **"Identical simmballs"**: In classical mechanics, identical particles *can* be distinguished by trajectories. If simmballs are truly identical (quantum-like), this enables substitution invariance—but your setup is classical. Clarify if "identical" means *indistinguishable in effect*.  

  ---

  ### **Recommended Allocation**  
  - **Years 1–2**: Focus on **Question 1 (Invariance)** and **Question 2 (Causal Drainage)**. They’re symbiotic: Invariance tests when micro-details matter; drainage asks if symbols capture causality.  
  - **Years 3–4**: Shift to **Question 3 (Implementation Neutrality)** to generalize findings, using insights from Years 1–2. Use **Question 4 (Poker Paradox)** as a test case.  

  **Why this order?** Questions 1 and 2 cut to the core of causation and reduction. Without them, Question 3 is unmotivated ("*Why* care about multiple realizations?"), and Question 4 is an anecdote. With answers to 1 and 2, 3 and 4 become concrete applications.  

  **Deliverables**: A taxonomy of pattern robustness, criteria for when macro-causation "screens off" micro-details, and a defense (or refutation) of pattern-centric explanations in mechanistically reducible systems. This agenda avoids hand-waving by treating "emergence" as a set of testable functional capacities.
