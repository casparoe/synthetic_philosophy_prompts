prompt: |-
  Hey, I'm a third-year PhD student in decision theory (behavioral-ish, mostly theory) and I've been chewing on something from a reading group on social learning that I can't shake. We did the usual sequential-choice thing — people move one after another, each sees what the people before them chose but not why, a couple of early movers tip the rest, and from then on the choices stop carrying any information because everyone's just reading the run. Fine, I get that. But what's bugging me is a distinction that the word "cascade" seems to flatten, and I keep running into it in totally different places. Two situations look identical from the outside: a run of, say, ten people in a row all picking option A, where in one world the first two had genuinely strong independent private reasons and everyone after was just following, and in the other world all ten had strong independent reasons and nobody was following anyone. Same string of A's, both perfectly stable, and you can't tell the informative version from the empty version off the action record alone — they cast the same shadow. I saw the same thing in a seminar on citation practices: a paper with a huge pile-on of citations that looks like a strong consensus, where either lots of people independently judged it good or basically two did and the rest just saw the pile. And I've been toying with a wrinkle I can't find a home for: suppose people can also just wait, and the waiting is observable. Then during a stretch where the choices themselves carry nothing, the pattern of who's holding back still seems to leak something — like the delays are quietly doing the epistemic work the choices stopped doing, and the people who break first after a long stall are disproportionately informative. I don't know if that's a real known thing or just me overreading a toy model I built.

  So my question is basically: does any of this have a name, and if so, is it one name or am I smushing three things together? I'm not looking for a reading list, and please don't bother with citations — I just want the carving. The part I actually care about is the epistemic distinction between a herd that's "full" (people independently converged) and one that's "empty" (people are following), plus the fact that these are observationally indistinguishable from the action stream, plus whatever it is that observable delay/waiting is doing in there. If there's an established term, tell me exactly which one and then show me where the neighbors come apart from what I described — I assume information cascade, herding, bandwagon effects, pluralistic ignorance and the wisdom-of-crowds stuff are all somewhere in the vicinity, but I have a feeling none of them is quite it, and I want to know which is closest and on what dimension each one misses. And if nothing fits, coin something: give me a name, a one-line definition, and two or three edge cases the definition has to get right (and one it has to get wrong, so I can see the boundary).

  Could you lay the answer out like this: first a section called "The thing you're circling" where you restate what I'm after more sharply than I did (roughly 100 words); then "The nearest named concepts," one short paragraph per concept saying precisely how it differs from mine; then "Which one fits, if any" with your verdict; and finally "If nothing fits, a coinage" with the name, the definition, and the edge cases. Total maybe 700–900 words is plenty.
