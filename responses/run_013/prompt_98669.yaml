answer: |-
  ### The thing you're circling
  You're isolating a fundamental **epistemic indistinguishability** in social learning dynamics: when identical observable action sequences (e.g., ten consecutive A-choices) emerge from two ontologically distinct processes. In the "full" case, actions reflect genuine private signals aggregated independently. In the "empty" case, actions after some point are purely imitative, decoupled from private signals. The action stream itself becomes **informationally degenerate**—unable to reveal whether later actors are learning or mimicking. Crucially, you're extending this to settings with **observable inaction** (waiting). Here, delays aren't neutral; they become surrogate signals when choices are uninformative, making those who *break* the stalemate disproportionately informative. The core is the tension between behavioral isomorphism and underlying epistemic states.

  ### The nearest named concepts

  1.  **Information Cascade (Bikhchandani et al.):** The paradigmatic model you started with. *Difference:* It explicitly *assumes* the "empty" state: after the cascade point, individuals rationally ignore their private signals and follow the crowd, making actions uninformative. Your "full" scenario (all acting on signals) is *not* a cascade in this strict sense, though the actions look identical. Cascades focus on the *breakdown* of information aggregation, not the indistinguishability of that state from information-rich aggregation.

  2.  **Herding:** A broader, often less formal term. *Difference:* Herding typically denotes the *observational outcome* of consecutive similar choices/behaviors, regardless of cause. It doesn't inherently distinguish between imitation ("empty") and independent convergence ("full"). It's descriptive rather than epistemic, failing to capture the core problem of inferring the *source* of the herd from actions alone.

  3.  **Pluralistic Ignorance:** A social perception phenomenon where individuals privately reject a norm but believe others accept it, leading to public compliance. *Difference:* While it involves a disconnect between private beliefs and public actions, it's rooted in *misperception* of others' private states, not necessarily rational Bayesian updating in the presence of uninformative actions. It doesn't directly address the indistinguishable sequences or the role of delay.

  4.  **Wisdom of Crowds (Surowiecki) / Information Aggregation:** Focuses on how groups *successfully* aggregate diverse private information to produce accurate collective judgments (e.g., via markets, voting). *Difference:* This is the antithesis of your "empty" state. It assumes actions *are* informative signals reflecting private information. It doesn't grapple with the possibility of degenerate, uninformative action sequences that mimic informative ones.

  5.  **Bandwagon Effect:** A psychological bias where the popularity of an option increases its attractiveness. *Difference:* This is often a *mechanism* for herding/cascades but emphasizes a psychological pull, not the formal Bayesian rationality or the *epistemic equivalence* of outcomes. It doesn't address the distinction between independent and imitative choice sequences.

  ### Which one fits, if any

  **None fits perfectly.** "Information cascade" comes closest because it rigorously models the *generation* of the "empty" state where actions become uninformative. However, it:
  1.  Doesn't formally contrast this "empty" state with the observationally identical "full" state (independent convergence) as a core problem.
  2.  Doesn't incorporate or analyze the potential informational role of **observable delay** as a distinct signal when actions are degenerate.

  The key gap you've identified is the **formal indistinguishability** of "full" and "empty" herds based *only* on the action history, and the novel informational role of inaction/delay in partially mitigating this degeneracy. This specific epistemic challenge and the delay dynamic lack a standard name.

  ### The coinage: Epistemic Opacity of Herd Composition (EOHC) & Delay Leakage

  *   **Name & Definition:**
      *   **Epistemic Opacity of Herd Composition (EOHC):** The fundamental indistinguishability, based solely on a sequence of observed actions in a social learning context, between a "**signal-coherent herd**" (where all actions reflect the aggregation of independent private signals) and an "**imitative cascade**" (where actions after a point are determined solely by public history, ignoring private signals).
      *   **Delay Leakage:** The phenomenon occurring under EOHC where observable periods of *inaction* (waiting, abstention) become informative signals *because* the action stream has degenerated. Individuals breaking a stalemate reveal stronger-than-expected private signals, making their actions disproportionately informative.

  *   **Edge Cases (What EOHC/Delay Leakage Must Get Right):**
      1.  **Signal-Correlated Herd (Gets In):** Ten people choose A. First two have strong signals for A. The next eight *also* have moderately strong private signals for A, *and* they observe the first two. Their choices reflect both. This is a "full" signal-coherent herd. *EOHC dictates:* An observer seeing only "A,A,A,...,A" cannot distinguish this from an imitative cascade starting after person 2.
      2.  **Rational Cascaded Herd (Gets In):** Ten people choose A. First two have strong signals for A. Persons 3-10 have weak private signals *favoring B*, but rationally ignore them and follow the crowd (cascade). Sequence is "A,A,A,...,A". *EOHC dictates:* Indistinguishable from Edge Case 1 based on actions alone.
      3.  **Delay Breaks Degeneracy (Illustrates Leakage):** After five A choices (possibly a cascade), the next five people visibly *wait* a long time. The sixth person finally chooses A. *Delay Leakage dictates:* This choice is highly informative – it signals a surprisingly strong private signal for A (strong enough to overcome the implied uncertainty from the long waits), injecting new information into the system that the prior actions couldn't.

  *   **Edge Case it Must Get Wrong (Boundary):**
      *   **Wisdom-of-Crowds Aggregation:** A large group votes simultaneously or submits estimates privately. The *aggregate* (e.g., median vote, mean estimate) is highly accurate due to independent signal aggregation. *Why it's wrong:* EOHC explicitly concerns *sequential, observable actions* and their degeneracy/imitation potential. Simultaneous/private action prevents the cascade dynamic and the observability problem defining EOHC. The aggregate outcome *is* distinguishable (as informative) precisely because it avoids sequential dependence and preserves signal independence in the input. Delay Leakage is irrelevant here.
