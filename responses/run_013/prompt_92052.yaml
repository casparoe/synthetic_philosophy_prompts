    - Rule B dismisses it as intangible and not urgent.
  - If Priya donates, it supports Rule A; if she doesn't, it supports Rule B.

  This approach isolates how each rule handles long-term, high-stakes uncertainty—revealing whether Priya is truly weighing catastrophic risks (Rule A) or just prioritizing the here-and-now (Rule B).

