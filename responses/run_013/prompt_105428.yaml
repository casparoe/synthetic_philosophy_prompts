answer: |-
  ## Research Proposal: Moral Trade Without Common Currency? Investigating the Role of Commensurability Across Moral Frameworks

  **1. Research Question:**  
  Does successful moral trade *necessarily* require a common currency of value across differing moral frameworks, and does the answer depend critically on whether the trade involves actions *permissible* ("within-the-lines") or *impermissible* ("across-the-lines") within each agent's own moral framework?

  More precisely:  
  *   **Sub-Question 1:** Can "within-the-lines" trades (where each agent acts within the set of actions permitted by their *own* moral view) be robustly defined and shown to yield mutual benefit *without* requiring any inter-framework comparison of value magnitude (i.e., without a common currency)?  
  *   **Sub-Question 2:** Do "across-the-lines" trades (where each agent performs an action forbidden by their *own* moral view) inherently require an implicit or explicit common currency to justify the trade as beneficial *from each agent's perspective*, or do they instead collapse into incoherence or reveal a tacit prioritisation of one moral framework?  

  **2. Why Existing Positions Leave This Open:**  
  The literature on moral trade (e.g., MacAskill, Ord, foundational work by Otsuka, Barry, Raiffa) often implicitly assumes *comparability* or *commensurability*:  
  *   **The Benefit Assumption:** Discussions frequently presuppose that agents can quantify the "good" achieved *by their own lights* (e.g., "Agent A gains +5 utilons") and that these quantifications are meaningfully comparable *across* frameworks to assess overall "mutual benefit" or fairness (e.g., "A gains +5, B gains +3, net benefit +8").  
  *   **Focus on Permissibility & Incentives:** Key arguments establish the *possibility* of mutual benefit and the *rationality* of engaging in trade *given* that each agent values the outcome more by their own metric. However, they often sidestep the *ontological/metaphysical* question of *how* this "more" is established *without* a shared scale, especially when actions are forbidden.  
  *   **Neglect of the Forbidden:** The crucial distinction between trades involving merely dispreferred-but-permitted actions versus morally forbidden actions is rarely foregrounded. Consequently, the specific challenge posed by "across-the-lines" trades – where agents must violate their core principles – and its implications for commensurability remain underexplored. Existing models often treat all beneficial exchanges similarly, masking this potential fault line.  
  *   **Formal Models Mask Assumptions:** Game-theoretic or decision-theoretic formalisations of trade often *build in* numerical utilities, creating an *illusion* of commensurability without explicitly defending its necessity or source across frameworks.  

  **3. Methodology (Semester Plan - Approx. 4 Months):**  
  *   **Month 1: Conceptual Groundwork & Distinction Refinement:**  
      *   Precisely define "moral framework" for this project (e.g., a coherent set of principles/values defining right/wrong, permissible/impermissible, and a ranking of states of affairs).  
      *   Rigorously formalise the "within-the-lines" (WTL) / "across-the-lines" (ATL) distinction using deontic logic and decision theory. Define "permissible set" for an agent under their framework.  
      *   Develop illustrative thought experiments: Simple WTL trades (e.g., vegetarian swaps preferred dishes with meat-eater, both actions permissible within their views); Simple ATL trades (e.g., pacifist agrees to fund defensive weapons for a security-obsessed consequentialist in exchange for the consequentialist funding animal sanctuaries – both actions arguably forbidden by their respective core principles).  
      *   *Output:* Clear definitions, typology of trade examples, identification of potential boundary cases/hybrids.  
  *   **Month 2: Analysing WTL Trades:**  
      *   Analyse whether mutual benefit in WTL trades can be established using *only* concepts internal to each framework and standard decision theory (preference ordering over permissible actions/states).  
      *   Argue that the "benefit" is purely intra-framework: Each agent moves from a less-preferred *permissible* state to a more-preferred *permissible* state *by their own lights*. No comparison of the *magnitude* of A's gain to B's gain is needed. Pareto efficiency suffices.  
      *   Test against objections (e.g., "Doesn't choosing the trade imply *some* comparison?" Counter: The choice is driven by intra-framework preference, not inter-framework value comparison).  
      *   *Output:* A robust argument that WTL trades are possible and mutually beneficial *without* any common currency.  
  *   **Month 3: Analysing ATL Trades:**  
      *   Scrutinise the justificatory structure of ATL trades. How can an agent judge performing a *forbidden* action as beneficial *by their own framework's lights*?  
      *   Explore possibilities:  
          *   *Requires Commensurability:* Does the agent need to quantify the "badness" of their forbidden act and compare it to the quantified "goodness" of the outcome they secure via the trade, implying a common metric *within* their own framework that allows weighing forbidden acts against permitted goods?  
          *   *Framework Collapse/Revision:* Does engaging in the trade force the agent to *revise* their framework (e.g., "Turns out funding weapons *is* permissible if it saves animals")? Does this reveal the framework wasn't truly held, or was incomplete?  
          *   *Prioritisation:* Does the trade implicitly rely on prioritising one framework's values over the other (e.g., aggregating consequences become the ultimate currency)?  
          *   *Incoherence:* Is it simply impossible to justify a forbidden act *as beneficial* within the framework that forbids it, rendering genuine ATL trade incoherent?  
      *   *Output:* Diagnosis of the necessary conditions for ATL trades to be considered mutually beneficial. Does it *force* the introduction of a common currency (within an agent's framework or across frameworks) or lead to one of the other outcomes?  
  *   **Month 4: Synthesis, Implications & Limitations:**  
      *   Synthesise findings: WTL trades succeed without common currency; ATL trades either require it (within or across frameworks), force framework revision, or are impossible.  
      *   Discuss implications for the moral trade literature: Does it challenge the generality of existing models? Does it suggest moral trade is only robust for WTL cases?  
      *   Address limitations: Scope (two-agent, clear frameworks), idealisation of agents, handling "mixed" trades. Outline avenues for future research (empirical psychology, meta-ethics).  
      *   *Output:* Final integrated argument, implications paragraph, acknowledgement of limitations.  

  **4. What a Result Looks Like & Failure Conditions:**  
  *   **Successful Result:** A clear, defensible answer emerges:  
      *   WTL trades demonstrably do *not* require a common currency; mutual benefit is achievable through purely intra-framework reasoning.  
      *   ATL trades *do* necessarily involve either (a) an implicit/explicit common currency (even if only intra-framework), (b) framework revision/reinterpretation, (c) incoherence, or (d) tacit supremacy of one framework. The project would specify *which* of these (or combination) holds, providing a strong argument.  
  *   **Failure/Dissolution:**  
      *   **Distinction Collapses:** If rigorous analysis shows the WTL/ATL boundary is untenable or irrelevant to the commensurability question (e.g., all trades involve *some* implicit violation, or all benefit requires comparison), the core hypothesis fails.  
      *   **ATL Ambiguity:** If no clear conclusion about ATL trades can be reached (e.g., multiple justificatory paths seem equally plausible without resolving the currency issue), the project dissolves into mapping inconclusive possibilities rather than answering the core question definitively.  
      *   **Scope Creep:** Getting bogged down in tangential meta-ethical debates (e.g., moral realism vs. anti-realism) instead of focusing on the *structure* of justification within stipulated frameworks.  

  **5. Assessment of Scope & Novelty:**  
  *   **Scope:** This is **feasible** for a semester proposal and a subsequent dissertation chapter. It is tightly focused on a specific conceptual puzzle arising within moral trade theory, using established philosophical tools (conceptual analysis, logic, decision theory). The month-by-month breakdown provides concrete milestones.  
  *   **Vagueness Addressed:** The WTL/ATL distinction provides the necessary structure to sharpen the initially vague question into two testable sub-questions.  
  *   **The Distinction's Vitality:** The distinction **does real work** and is **not obviously empty**. The intuitive difference between doing something you're allowed to do but don't prefer, versus doing something you believe is morally forbidden, is significant. The core hypothesis *hinges* on whether this difference impacts the need for commensurability. Rigorous definition (Month 1) is crucial to prevent it being merely intuitive. **Potential Pitfall:** Some frameworks might have "permissible" sets that are extremely narrow or wide, or have complex rules about compensation/penance that blur the line. Proactively defining "permissible set" and testing boundary cases early (e.g., actions with minor moral costs vs. grave violations) mitigates this. The distinction is robust enough to drive the investigation meaningfully.  

  **6. Honest Verdict:**  
  This proposal tackles a **significant and underexplored tension** at the heart of moral trade theory. It is **well-scoped** for an MA proposal and a dissertation chapter: focused, novel (centring the WTL/ATL distinction), and methodologically clear. The risk of failure is present, primarily if the distinction proves less robust than anticipated under intense scrutiny (Month 1 & Month 3) or if the analysis of ATL trades becomes inconclusive. However, this risk is inherent to philosophical research and can be managed by diligent attention to definitions and boundary cases early on. **It is neither too big nor too vague,** provided the analysis stays tightly focused on the justification structure within stipulated frameworks relative to the core distinction. The project promises a valuable contribution by clarifying the (often hidden) assumptions about value commensurability necessary for different types of moral trade.
