prompt: |-
  Last night I lost an argument to a friend of mine — an anaesthetist who also teaches medical ethics — about whether the doctrine of double effect is a genuine moral principle or a flattering description of verdicts we reach on other grounds, and I have come away unable to say whether my own position is a coherent package. I would like an audit before I commit it to paper for a seminar. His charge, which I could not answer on the spot, was that the condition everyone quotes — that the harm be intended, or at least not intended as a means — never actually does any work in the cases I care about, because a proportionality judgement is quietly carrying the whole load; I think he is wrong, but I cannot articulate why.

  Here, as honestly as I can state them, are the commitments I hold. (1) The distinction between harm intended as a means and harm foreseen but not intended marks a real moral difference, and the doctrine is the right shape for it. (2) I accept the familiar pair: diverting a runaway trolley onto a single track worker to save five is permissible, whereas killing one healthy patient to distribute his organs to five dying ones is not, and I take the doctrine to explain the difference rather than merely restate it. (3) A variant my friend put to me: the side track curves around and rejoins the main line, so that the diverted trolley fails to come back round to the five only because the one man's body brings it to a halt; on this version his death is not a byproduct of the diversion but the very thing that stops the trolley, and I still want to say the diversion is permissible. (4) A second case of his, drawn from the older medical casuistry: to deliver a woman whose fetus cannot pass through the birth canal, the surgeon must first collapse the fetus's skull, and the fetus dies as part of the manoeuvre that saves her; I want to say this is permissible too, though the death there is plainly a step in the plan. (5) When I speak of what is intended, I mean nothing about the agent's feelings, hopes, or preferences: I mean what his plan requires. The tactical bomber who wishes the civilians were elsewhere is not thereby excused, and the terror bomber who kills them to break morale is not condemned merely for enjoying it. (6) Whether an act is permissible is settled by the facts, not by the agent's evidence: an act can be wrong even when the agent has done everything a reasonable person could ask in working out what to do. (7) And I take the value of outcomes to be exhausted by how well off people are — I do not believe in agent-relative values, or that the world is worse because of who did what to whom, as distinct from how people fare.

  What I need is not a survey and certainly not a reading list, but an audit. Tell me which of these pull against one another and how badly, ordered by severity rather than presented as equally bad; for each, say precisely what would have to give and what the cheapest repair would be. Be careful to separate the pairs that genuinely conflict from the pairs that only appear to, since I am fairly confident that at least one of my apparent inconsistencies is harmless, and I would rather not jettison something on a false alarm. Then finish by naming the single revision that would clean up the most at the least cost, and end with a final line in the form "Verdict: <the commitment to revise, in a short phrase>".
reasoning: |-
  Okay, let me tackle this user's query. They're involved in a debate about the doctrine of double effect (DDE) and need an audit of their commitments to ensure coherence. The user's friend, an anaesthetist and ethics teacher, argues that the intention condition in DDE doesn't actually do any moral work; proportionality judgments are doing all the heavy lifting. The user disagrees but couldn't counter effectively. Their goal is to prepare for a seminar by identifying conflicts in their stated commitments and finding the most efficient fix.

  First, I need to parse each of the user's seven commitments. Commitment 1 asserts that the distinction between intended harm (as means) and foreseen harm is morally significant. Commitment 2 uses trolley and organ harvesting cases to illustrate DDE's explanatory role. Commitment 3 involves a modified trolley scenario where the one worker's death is the actual means to stop the trolley, yet the user still deems it permissible. Commitment 4 references a medical case where collapsing a fetus's skull is necessary for delivery, with death as a direct step, which they also approve. Commitment 5 clarifies intention as part of the plan, not emotions. Commitment 6 states that permissibility is fact-dependent, not based on the agent's evidence. Commitment 7 is consequentialist, focusing solely on well-being without agent-relative values.

  The main tension arises between commitments 3 and 4 versus commitment 1. In both cases, harm is intended as a means, which directly contradicts DDE's core condition that such harm is impermissible. Yet the user finds these actions acceptable. This suggests that their intuition relies on proportionality (good outcome outweighing harm) rather than the intended/foreseen distinction. Commitment 7's strict consequentialism amplifies this conflict because it doesn't recognize intrinsic wrongs in using someone as a means, making DDE redundant if proportionality is sufficient.

  Commitment 2's trolley case traditionally treats the one worker's death as a foreseen side effect, not a means. But commitment 3's variant explicitly makes the death a means, challenging DDE. The user's approval here indicates that their judgment is outcome-based. Similarly, commitment 4's medical case involves intended harm as a necessary step, which DDE typically forbids, but the user permits it, again leaning on outcomes.

  Commitment 5's focus on plans rather than emotions is consistent with DDE, so it's not a conflict. Commitment 6's objectivity about permissibility is also compatible. The real issue is that commitments 3 and 4 undermine commitment 1 and, by extension, commitment 2's reliance on DDE. If harm as means is sometimes permissible when proportional, then DDE's intention condition isn't doing independent work.

  The user might think the inconsistency is harmless if they can reframe intentions, but commitment 5's definition is strict: what the plan requires. In the variant cases, the harm is required by the plan, so it's intended as means. To resolve this, the cheapest fix is to adjust commitment 1, acknowledging that intended harm isn't always impermissible. This could involve a narrower scope for DDE or incorporating proportionality as a primary factor. Alternatively, they could refine the means/end distinction, but the cases challenge that directly.

  The most efficient revision is to modify commitment 1, accepting that intended harm can be permissible if proportional. This retains consequentialism (commitment 7) and accommodates intuitions in commitments 3 and 4 while explaining commitment 2 through proportionality. Dropping commitment 7 would require adopting agent-relative values, which is a bigger shift. Clarifying intention (commitment 5) doesn't resolve the core conflict. Thus, revising commitment 1 by softening the prohibition on intended harm minimizes disruption.
answer: |-
  Here is a comprehensive audit of your commitments, ordered by severity of conflict, with precise diagnoses, necessary concessions, and cheapest repairs. The core tension lies in your consequentialist foundations conflicting with the strict deontic constraints implied by DDE's "intended harm" prohibition.

  ### Conflicts Ranked by Severity

  1.  **Conflict: Commitment 3 & 4 vs. Commitment 1 (Intended Harm Prohibition)**
      *   **Nature:** This is the most severe and direct conflict. Commitment 1 states that *intending harm as a means* marks a "real moral difference" (implying impermissibility). Commitments 3 (Curved Track Trolley) and 4 (Craniotomy) describe acts where harm *is intended as a necessary means* to the good end (stopping the trolley/saving the mother). Yet you deem both permissible. This directly violates the core condition of DDE as understood in Commitment 1.
      *   **What Must Give:** **Commitment 1** must be revised. You cannot hold that intending harm as a means *always* marks a decisive impermissibility while simultaneously endorsing cases where harm is clearly intended as a means and deemed permissible.
      *   **Cheapest Repair:** Refine Commitment 1 to acknowledge that intending harm as a means is *prima facie* wrong or carries significant moral weight, but is not *always absolutely* impermissible. Its permissibility can sometimes be overridden by extremely strong consequentialist reasons (proportionality). This preserves the *distinction* (harm as means is *worse* than foreseen side-effect) but abandons its *absolute* veto power. This directly addresses your friend's charge that proportionality carries the load.

  2.  **Conflict: Commitment 3 & 4 vs. Commitment 2 (DDE's Explanatory Power)**
      *   **Nature:** Commitment 2 relies on DDE to *explain* the permissibility difference between the standard Trolley Case (foreseen harm) and Organ Harvesting (intended harm). However, your judgments in Commitments 3 & 4 (where harm *is* intended as a means but permissible) undermine DDE's ability to be the *sole* or *primary* explanation for the difference in Commitment 2. If harm intended as means can be permissible (as in 3 & 4), why is it impermissible in Organ Harvesting? Proportionality must be doing much more work than DDE allows.
      *   **What Must Give:** The claim within **Commitment 2** that DDE *explains* the difference. It might *label* the difference, but it cannot consistently *ground* it given your other judgments.
      *   **Cheapest Repair:** Acknowledge within Commitment 2 that DDE identifies a morally relevant factor (intention), but the decisive difference between Trolley/Organ Harvesting lies *primarily* in proportionality (net lives saved vs. net lives lost, directness of aggression, exploitation) *combined* with the intention factor. DDE flags a concern, but proportionality (and other factors) determines whether that concern defeats permissibility. This repair depends on revising Commitment 1 as above.

  3.  **Conflict: Commitment 7 (Strict Consequentialism) vs. Implied Deontology in Commitment 1 (via DDE)**
      *   **Nature:** Commitment 7 states that the value of outcomes is *exhausted* by how well-off people are (welfarist consequentialism). DDE, as implied by Commitment 1, introduces a constraint *independent* of outcomes: it is wrong to intend harm as a means *even if* the net outcome is better. Your judgments in Commitments 3 & 4 suggest your consequentialist leanings are strong enough to override the DDE constraint in those cases, highlighting the inherent tension.
      *   **What Must Give:** Either the strictness of **Commitment 1** (as already identified) or the exhaustiveness claim in **Commitment 7**.
      *   **Cheapest Repair:** Revise Commitment 1 as above (allowing proportionality to override the intention constraint). This maintains Commitment 7's consequentialism as the ultimate arbiter. Revising Commitment 7 (e.g., accepting agent-relative constraints *against intending harm*) would be a much more fundamental and costly shift.

  4.  **Apparent Conflict (Likely Harmless): Commitment 6 (Objectivity) vs. Commitment 5 (Intention as Plan)**
      *   **Nature:** Commitment 6 states permissibility is settled by facts, not the agent's evidence or beliefs. Commitment 5 defines intention purely as "what the plan requires," which seems fact-dependent (what *does* the plan require?) rather than psychological (hopes, feelings).
      *   **Diagnosis:** This is *not* a genuine conflict. Commitment 5 provides an *objective* definition of intention ("what the plan requires"), which aligns perfectly with Commitment 6. Determining "what the plan requires" is a factual question about the structure of the action and its necessary components, not about the agent's subjective mental states beyond the adoption of the plan itself.
      *   **Resolution:** No revision needed. Commitments 5 and 6 are mutually supportive components of an objective, plan-based analysis of intention and permissibility.

  ### The Single Most Efficient Revision
  Revising **Commitment 1** (softening the absolute prohibition on intending harm as a means to allow overriding by proportionality) resolves the most severe conflict (#1), directly addresses your friend's core charge, mitigates conflict #2 by clarifying DDE's role, and preserves your core consequentialist stance (Commitment 7) without needing revision. It allows you to keep your intuitive judgments on the difficult cases (3 & 4) while still affirming the *distinction* between intended and foreseen harm as morally significant (though not always decisive).

  **Verdict:** The absolute impermissibility of intending harm as a means.
