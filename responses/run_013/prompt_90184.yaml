answer: |-
  **(Setting down coffee mug, scanning the room – sixty familiar faces under the fluorescent lights of the Legion Hall)**

  Alright. Deep breath. Most of you know me. Grew up here, left for a while, came back. And like a lot of us who came back, sometimes you look at something you grew up with… and you wonder, *why*? Why do we do it *this* way? For me, that thing was the steps. Those two-foot steps up into every shop on Main Street.

  We’re here because tomorrow we vote on repealing the ordinance that put them there. Some folks see those steps as a wall, keeping neighbors out. Others… well, others see them as part of the bones of this place. And honestly? Both sides are right. But tonight isn’t about picking sides yet. Tonight’s about understanding *what* we’re voting on. Because I went digging, down in the county archives, dusty boxes nobody’d opened in decades… and I found a letter. From the man who proposed the ordinance back in 1908. Henry Claybourne. Our lumber dealer’s great-grandfather.

  **(Pause, let the name sink in)**

  And his letter… well, it tells us two things, loud and clear. First, the reason everyone *thought* they knew: "Floods." Main Street *did* flood. Almost every spring. Mud, silt, water washing right down the street. Raising those thresholds two feet? That kept the shops dry. It kept goods safe. It was practical. Necessary. Smart. Henry Claybourne wrote it down: *"To keep the mud and the high water out."* That was real.

  But Henry Claybourne was also a businessman. And here’s the second thing the letter tells us. That same spring, 1908, he’d gotten stuck with a whole boxcar load of lumber. Short boards. Too short for most building jobs. Nobody wanted them. And his ordinance? It specified the exact height, the exact construction… using lumber of a very specific length. His letter to a supplier? It’s pretty clear: this ordinance was how he moved that wood. So yes, it solved a flooding problem. But it also solved Henry Claybourne’s inventory problem. One reason served the town. The other reason served Henry.

  **(Hold up a hand briefly)**

  Now, hold on. Before anyone gets mad *at him*… that’s just how things got done back then. A little practical self-interest mixed in with solving a problem. It’s part of our history, warts and all. And it *worked*. For a while. The floods stopped being a problem in 1931. They built the levee. The *reason* for those steps – the flood reason – dried up over ninety years ago.

  **(Gesture out towards Main Street)**

  But here’s the twist nobody planned: those steps… they became something else. They became our stoops. Our front porches on Main Street. Where we sit with coffee, gossip, watch parades, sell raffle tickets, wait for the bus. The life of this town happens on those raised platforms. That wasn't in Henry's letter. That just… happened. It's real too.

  So what do we have? An ordinance born partly out of necessity, partly out of a lumber deal. A necessity that vanished generations ago. A lumber deal that’s ancient history. But also… an accident of design that gave us a place to gather. And a rule that’s stuck around, long after its original purpose faded. My grandmother, who sat on the zoning board longer than most of us have been alive, had a saying about rules like that. She said a rule that survives fifty years *while* people argue against it… that rule is probably carrying information. Something useful, even if we forgot why. But a rule that survives fifty years simply because *nobody* ever bothered to question it? That’s not information. That’s just… habit. Inertia.

  **(Lean forward slightly)**

  Our ordinance? It survived the end of the floods. It survived Henry Claybourne selling his lumber. It survived decades. But for the last ten, fifteen years? People *have* been arguing against it. Not because they hate history, but because those two-foot steps have become a two-foot wall. They keep our neighbors who use wheelchairs, walkers, strollers, from getting a coffee at Millie’s, picking up a prescription at the Rexall, meeting friends at the new cafe. That’s not inertia anymore. That’s an active burden. And the people paying that cost now – the young parents, the folks getting older, our neighbors with disabilities – they aren’t the ones Henry Claybourne sold his lumber to. They’re *us*. Right now.

  **(Look directly at the "old-timer" section, then the "repealer" section)**

  Finding Henry’s letter… it wasn’t about proving anyone foolish. It wasn’t about calling past generations stupid, or calling anyone today a vandal for wanting change. It was about *honoring* them by finally understanding what they built, and why. Really understanding it – the good reason *and* the lumber deal. It’s about seeing the whole picture. And seeing that the world down here on the sidewalk changed. The flood is gone. The lumber deal is done. But the wall remains. And the stoops… well, we love those stoops.

  So here’s the proposal I think the letter points us towards, not as a historian, but as your neighbor: **Let’s repeal the 1908 ordinance.** Let’s finally acknowledge that its original reasons – both the necessary and the self-serving – belong to the past. But let’s do it with a specific condition: **Any business removing its existing steps must replace them with a new, accessible, permanent stoop built to current code.** A platform wide enough for a wheelchair to turn, maybe with a bench, maybe with a ramp integrated. A *new* gathering place. Not just removing a barrier, but actively building a new space where everyone can sit. Where the life of Main Street can keep happening, just… inclusively.

  **(Straighten up, voice firm but warm)**

  This isn't about erasing history. It's about learning from it. Henry Claybourne solved a problem *for his time*, in his way. We have a problem *for our time*: connecting our whole town to the heart of Main Street. We can solve it in ours. We keep the gathering place – we just build it so everyone can get there. We honor the past by understanding it clearly, and then we build the future our neighbors need. Repeal the old rule, build new stoops. Let's vote tomorrow knowing exactly what fence we're mending, and why. Thanks for listening.

  **(Nod, step back – six minutes)**
