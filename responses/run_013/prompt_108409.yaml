prompt: |-
  I trained as a historian and now work as a consultant to a television production company, which means I spend a great deal of my time being asked, at short notice, whether some invented scene is permissible. I have been invited to contribute a short position statement to a workshop on dramatizing real people, and before I put anything on paper I would like a consistency check on the views I would be committing myself to. Here is the set, more or less as I would state it.

  (1) The dead can be wronged. Betraying a promise made to someone who has since died, or destroying the thing they spent a lifetime building, can be a wrong to them and not merely a wrong to the living who care about them. (2) The harm involved is not experiential: there is nothing it is like to be dead, so being dead is not a condition of suffering. The harm is instead the setback of an interest the person held while alive, where that interest is not extinguished by death. (3) Reputation is not an interest of that kind. Once someone is dead, what anyone believes about them cannot set back an interest of theirs; a stake in one's good name is a stake in how one is treated while one is still around to be treated. (4) I also think that a drama which invents a serious moral transgression — a cruelty, a betrayal, a cover-up — and attributes it to a real and named person does wrong that person. Suppose, for instance, a miniseries about a modestly documented nineteenth-century botanist invents a scene in which he spitefully ruins a rival's collection; the record is silent and the invention is dramatically load-bearing. (5) I want to say that this wrong is theirs: their grievance, not at bottom the audience's (for being misled) or their descendants' (for being distressed). (6) I do not think fictions assert what they depict. A drama that invents a scene is not lying about it, and a competent viewer knows she is watching an invention, so the wrong cannot be located in the audience's being deceived. (7) I do think that a work presenting itself as telling the true story — real names, real dates, archival footage, a closing card explaining what became of everyone — invites an uptake that a confessed fiction does not, and is answerable for its inventions in a way the confessed fiction is not; the relevant line is therefore not fiction versus nonfiction but the uptake the work invites. (8) I think consent is beside the point here: the dead cannot consent, and a regime of posthumous permissions would be absurd. I also think that what makes the fabricated transgression a wrong rather than mere bad taste is that it does to the person something they would have had standing to refuse while alive. (9) I think descendants have standing to raise the objection on the ancestor's behalf, but the grievance they raise is the ancestor's and not their own.

  What I want is an audit rather than a verdict on the topic itself. Tell me which of these commitments genuinely pull against one another, which pairs only appear to be in tension and why the appearance dissolves, and how severe each real tension is; rank the real ones by severity rather than treating them as uniformly bad. For each, say what the cheapest repair would be, what that repair costs me elsewhere in the set, and whether the tension is best resolved by giving up a claim or by reinterpreting one. Then tell me which single revision would clean up the most, and what I would be conceding by making it. Please end with a final line of exactly the form "Verdict: " followed by the number of the one commitment I should abandon, with nothing after it.
reasoning: |-
  Hmm, the user is a historian-turned-TV consultant who needs a consistency check on their philosophical position about dramatizing real people. They've laid out nine distinct commitments and want me to identify internal tensions without judging the topic itself.

  First, let's map the core ideas: They believe the dead can be wronged through interests that survive death (1-2), but reputation isn't one of them (3). Yet inventing moral transgressions for real people does wrong them (4-5), even though dramas don't technically lie (6). The key factor is the work's presented truthfulness (7), consent is irrelevant (8), and descendants can advocate for the dead (9).

  The biggest tension screams between commitment 3 (reputation isn't a surviving interest) and 4-5 (inventing misdeeds wrongs the person). If harming reputation doesn't affect the dead, why would fabricating cruelty be a wrong to them? This seems like a direct contradiction. 

  I also spot secondary friction: Commitment 8 claims consent is irrelevant because the dead can't give it, but commitment 7's "uptake" principle might imply audience consent matters. And commitment 9 gives descendants proxy standing without clarifying how that aligns with the "grievance isn't theirs" stance.

  For the main tension, the cheapest repair would be to adjust commitment 3 to allow that reputation *can* be a surviving interest when directly attacked by false claims. But this costs coherence with their original dismissal of posthumous reputation harm. Alternatively, they could soften commitment 4 by limiting wrongs to verifiable interests beyond reputation - but that undermines their core example. 

  The most efficient fix? Modify commitment 3. Conceding that reputation *can* survive death in specific contexts resolves the central conflict while preserving their stance against trivial misrepresentations. 

  Smaller tensions: Between 7 and 8, emphasizing that "uptake" concerns audience expectations rather than consent bridges the gap. For 9, stressing "proxy" versus "personal" grievance maintains consistency. 

  Final verdict must be to abandon commitment 3 as stated - it's the linchpin inconsistency. The repair clarifies that while everyday reputation doesn't matter posthumously, egregious false attributions do constitute a surviving interest.
answer: |-
  Here is the consistency audit of your position statement, identifying tensions, repairs, and a recommended revision path:

  ### Tension Analysis (Ranked by Severity)
  1. **Severe Tension: Between (3) and (4)-(5)**  
     - **Conflict**: (3) states reputation is **not** a surviving interest posthumously, while (4)-(5) claim inventing a moral transgression wrongs the dead person *as their grievance*. If reputation isn’t a surviving interest, what interest is set back by the invented transgression?  
     - **Cheapest Repair**: Reinterpret (3) to exclude **egregious misrepresentations** (e.g., invented crimes/cruelties) from the "reputation isn’t an interest" rule. Argue that while *ordinary* reputation isn’t protected, **gross defamation** violates a deeper interest in moral agency/legacy.  
     - **Cost**: Weakens (3)'s absolutism; requires defining "egregious" (e.g., serious moral transgressions vs. minor inaccuracies).  
     - **Resolution Path**: Reinterpret (3); abandoning (4) guts your core thesis.

  2. **Moderate Tension: Between (2) and (4)**  
     - **Conflict**: (2) defines harm as a "setback of an interest," but (4) doesn’t specify *which* interest (beyond reputation) is set back by fictional misdeeds. What non-reputational interest does the botanist have in not being falsely portrayed as cruel?  
     - **Cheapest Repair**: Argue the interest is **autonomy over one’s moral narrative**—a lifelong project extinguished only if distorted posthumously in ways denying their core character.  
     - **Cost**: Requires expanding (2) beyond tangible interests (e.g., built institutions) to include moral identity. Risks vagueness.  
     - **Resolution Path**: Reinterpret (2) to include "narrative integrity" as a protectable interest.

  3. **Minor Tension: Between (7) and (8)**  
     - **Conflict**: (7) ties wrongfulness to "uptake" (audience expectation of truth), while (8) dismisses consent as irrelevant. But if audience deception isn’t the harm (per (6)), why does uptake matter?  
     - **Apparent Dissolution**: Uptake isn’t about consent or deception but **betrayal of a promise**: the work positions itself as a steward of truth, so inventing transgressions violates a duty *to the subject* (not just the audience).  
     - **Resolution**: Clarify that (7) describes the **mechanism** of wrongdoing (breach of truth-stewardship), not its moral basis.

  4. **Minor Tension: Between (6) and (9)**  
     - **Conflict**: (6) states viewers aren’t deceived, yet (9) lets descendants object. If no one is deceived, why permit objections?  
     - **Apparent Dissolution**: Descendants act as **proxies** for the dead person’s grievance (per (9)), not due to personal distress or audience harm. Competent viewers aren’t deceived, but the subject’s moral claim persists.  
     - **Resolution**: Emphasize that (6) addresses *audience deception*, not the subject’s moral claim.

  ### Optimal Single Revision
  **Revise (3) to limit its scope**:  
  *Original*: "Reputation is not an interest of that kind [that survives death]."  
  *Revised*: "**Ordinary reputational interests** (e.g., prestige, minor inaccuracies) do not survive death, but **egregious misrepresentations of moral character** (e.g., inventing cruelty/betrayal) can set back a person’s enduring interest in narrative integrity."  

  **Why this cleans up the most**:  
  - Resolves the severe (3)/(4) tension while preserving (4)-(5).  
  - Aligns with (2) by defining "narrative integrity" as a protectable interest.  
  - Cost: Concedes that *some* reputational interests survive death (contra original (3)), but only for extreme cases. Avoids abandoning core commitments.

  ### Final Verdict
  Verdict: 3
