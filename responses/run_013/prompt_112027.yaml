answer: |-
  ### Conceptual Anatomy through the Heritability Lens

  **Heritability (h²) Defined**  
  h² is the proportion of *phenotypic variance* (V<sub>P</sub>) in a specific population attributable to *additive genetic variance* (V<sub>A</sub>), such that h² = V<sub>A</sub>/V<sub>P</sub>. It is:  
  - A **population-level statistic** (not an individual property).  
  - **Environmentally contingent**: Sensitive to the range of environments and genetic diversity in the sampled population.  
  - **Non-informative** about:  
    (a) Between-group differences (populations may share h² but differ due to environments or non-additive effects).  
    (b) Trait immutability (changing environments can alter means without altering h²).  
    (c) Causal mechanisms.  

  **Reaction Norm Framework**  
  A genotype’s phenotype across environments defines its reaction norm. Two genotypes (G1, G2) may:  
  - Show parallel norms → between-group difference persists equally across environments.  
  - Cross or converge → difference depends non-additively on environment.  
  *Heritability estimates within one environment say nothing about these norms between groups.*  

  **Jensen’s Inferential Steps Sorted**:  
  1. **Licensed by h²**:  
     - High h² for IQ in White US populations (~0.8) → within that group/environment, most IQ variance was genetic.  
     - Failure of *specific* interventions (e.g., Head Start) to raise mean IQ *in that context* aligns with high h² (if interventions didn’t reduce relevant environmental variance).  

  2. **Fails to Forbid (but does not justify)**:  
     - Inferring that the Black-White gap *could* have a genetic component. h² is silent on between-group causes.  
     - Questioning environmental-only explanations for the gap.  

  3. **Contradicted by h²**:  
     - **Between-group extrapolation**: Assuming high within-White h² implies genetic explanations for *mean differences* between Black/White Americans. This commits the **ecological fallacy** (within-group structure ≠ between-group cause).  
     - **Intervention pessimism**: Claiming high h² implies compensatory education *must* fail ignores that h² ≠ destiny. If interventions shift mean environments (e.g., improving nutrition/education), the population mean can rise without changing h².  
     - **Environmental compression fallacy**: Jensen assumed reducing environmental variance (e.g., via better schools) would *lower* h². Actually, compressing V<sub>E</sub> *increases* h² (as V<sub>A</sub>/V<sub>P</sub> rises if V<sub>A</sub> is stable), potentially amplifying genetic differences.  

  ### Reversing the Lens: Heritability’s Limits and Lessons  
  **Limits Revealed**:  
  - **Silence ≠ Evidence**: h²’s silence on between-group differences was misused as tacit support for genetic explanations. The coefficient *cannot* address cross-population comparisons without cross-fostering or genomic data.  
  - **Ambiguity in Environmental Scope**: "Specified population/environment" is often underspecified. Jensen’s h² estimates came from segregated, unequal 1960s America—environments of Black/White groups were non-overlapping, violating the "shared environment" assumption for between-group inference.  

  **Better-Specified Questions**:  
  1. "Do reaction norms for IQ diverge between ancestral groups in *shared* environments?" (Requires unrealized cross-adoption studies.)  
  2. "Does compressing environmental variance (e.g., equalizing education) alter the *mean* gap or its heritability?"  

  **Where Disagreement Transcends Heritability**:  
  The dispute ultimately centered on **causal explanations for inequality**. Jensen’s critics emphasized systemic racism as an unmeasured environmental confound; his supporters invoked genetic structure. Heritability became a proxy for this irreconcilable conflict over societal vs. biological causation—a debate h² is unequipped to resolve.  

  ### Conclusion  
  Jensen misapplied h² by treating it as a trait constant and extrapolating it to between-group questions it cannot address. The episode underscores that h² must be accompanied by: (1) explicit environmental bounds, (2) reaction-norm humility, and (3) disclaimers against group comparisons. A better question would focus on *causal effect sizes* of specific environmental shifts, but the core conflict reflects divergent ideologies about human equality, not merely statistical misunderstandings.  

  (649 words)
