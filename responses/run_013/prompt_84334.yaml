answer: |-
  ### Faithful Restatement of Harsanyi's Aggregation Theorem in RLHF Vocabulary

  **Theorem Restatement**:  
  Consider a set of annotators, each providing pairwise comparison data (e.g., "completion A ≻ completion B") for text completions. For each annotator \(i\), you train a separate reward head \(R_i\) on their data, yielding per-annotator reward functions. These rewards are **only pinned down up to positive affine transformations** (i.e., scaling and shifting), meaning \(R_i\) and \(a_i R_i + b_i\) (\(a_i > 0\)) represent identical preferences. Now, suppose you want to aggregate these into a single **aggregate reward model** \(R_{\text{agg}}\) that ranks completions (and policies that generate them). Assume:  
  1. **EU Axioms for Aggregate Reward**: The aggregate reward induces a preference ordering over policies (distributions over completions) that satisfies expected utility (EU) axioms. Specifically:  
     - Completeness/transitivity over policies.  
     - "Independence of irrelevant alternatives": If policy \(\pi\) is preferred to \(\pi'\), then mixing both with a third policy \(\pi''\) preserves this order.  
     - Continuity.  
  2. **Pareto Respect**: The aggregate respects unanimous annotator preferences:  
     - If all annotators are indifferent between completions \(x\) and \(y\) (i.e., \(R_i(x) = R_i(y)\) for all \(i\)), then \(R_{\text{agg}}(x) = R_{\text{agg}}(y)\).  
     - If all annotators strictly prefer \(x\) over \(y\) (i.e., \(R_i(x) > R_i(y)\) for all \(i\)), then \(R_{\text{agg}}(x) > R_{\text{agg}}(y)\).  

  Then, \(R_{\text{agg}}\) **must be a weighted sum of the per-annotator rewards**:  
  \[
  R_{\text{agg}}(x) = \sum_{i} w_i R_i(x)
  \]  
  for some fixed weights \(w_i \geq 0\) (not all zero). The weights \(w_i\) are "real" only relative to your arbitrary normalization of each \(R_i\) (e.g., you must fix scales via standardization).  

  **Key Mappings**:  
  - **Individuals** → Annotators (or their reward heads \(R_i\)).  
  - **Social states** → Text completions (or trajectories).  
  - **Lotteries** → Stochastic policies (distributions over completions).  
  - **Individual utilities** → Per-annotator reward heads \(R_i\).  
  - **Social welfare function** → Aggregate reward model \(R_{\text{agg}}\).  
  - **Weights** → Scalarization weights \(w_i\) (post-normalization).  

  **Pareto Front vs. Convex Hull**:  
  - The Pareto front is the set of policies where no annotator can be made better off without making another worse off.  
  - The convex hull (via scalarization weights \(w_i\)) is the set of policies optimal for some \(w_i\). Harsanyi says the aggregate reward must correspond to a point on this convex hull.  

  **KL Penalties/Overoptimization**:  
  - If \(R_{\text{agg}}\) is a weighted sum, optimizing it with a KL penalty (against a reference policy) avoids reward hacking by penalizing policies that exploit idiosyncrasies in individual \(R_i\). Overoptimization occurs when pushing \(R_{\text{agg}}\) too far, amplifying noise or biases in the \(R_i\).  

  **Pooling Data as "Noise"**:  
  - Standard RLHF often pools all comparisons into one reward model, implicitly assuming disagreements are noise. Harsanyi instead models disagreements as conflicting but coherent utilities \(R_i\), requiring explicit scalarization.  

  ---

  ### Residue Report: What Translates, What Bends, What's Missing

  #### 1. **What Translates Cleanly**  
  - **Annotators as individuals**: Each annotator's reward head \(R_i\) maps directly to a vNM utility function. The affine invariance of \(R_i\) (standard in RLHF) mirrors the affine invariance of vNM utilities.  
  - **Pareto ↔ Unanimity**: The Pareto condition ("if all annotators agree, aggregate respects it") translates verbatim. Violations would imply your \(R_{\text{agg}}\) ignores consensus.  
  - **Scalarization as weighted sum**: The theorem forces \(R_{\text{agg}} = \sum w_i R_i\), matching how you might combine normalized reward heads. The convex hull of the Pareto front is exactly the set of optimizable \(R_{\text{agg}}\) under this form.  
  - **Lotteries ↔ Policies**: Distributions over social states (lotteries) map to stochastic policies. EU axioms for \(R_{\text{agg}}\) imply linearity in probabilities (expected reward).  

  **Example**:  
  - Suppose two completions \(x, y\) and two annotators:  
    - Annotator 1: \(R_1(x) = 2, R_1(y) = 1\)  
    - Annotator 2: \(R_2(x) = 1, R_2(y) = 2\)  
  - Unanimous indifference if \(R_1(x)=R_1(y)\) and \(R_2(x)=R_2(y)\)? Only if \(x=y\).  
  - If \(w = (0.5, 0.5)\), \(R_{\text{agg}}(x) = 1.5, R_{\text{agg}}(y) = 1.5\) → indifference.  
  - If \(w = (1, 0)\), \(R_{\text{agg}}(x) > R_{\text{agg}}(y)\) → disagrees with annotator 2, violating Pareto if annotator 2 is part of the "unanimous" condition.  

  #### 2. **What Translates with Distortion**  
  - **EU Axioms for Policies**:  
    - **Distortion**: Harsanyi assumes EU axioms hold *for the aggregate over lotteries*. In RLHF, you assume \(R_{\text{agg}}\) extends to policies via expectation (EU-compliant). But annotators only provide *deterministic* comparisons—you never test if their preferences obey EU axioms for lotteries.  
    - **Why it matters**: If annotators violate EU (e.g., risk-averse in stochastic outcomes), \(R_i\) may misrepresent their true preferences over policies. Your \(R_{\text{agg}}\) inherits this flaw.  
  - **Weights and Affine Invariance**:  
    - **Distortion**: The weights \(w_i\) are meaningful *only after* fixing \(R_i\) scales. But in RLHF, normalization (e.g., \(R_i \leftarrow \frac{R_i - \mu_i}{\sigma_i}\)) is arbitrary. Harsanyi doesn’t resolve this; it’s the same problem.  
    - **Why it matters**: If one annotator’s rewards span \([-1, 1]\) and another’s \([0, 1000]\), uniform \(w_i\) effectively upweights the latter. The theorem doesn’t fix this—it assumes scales are given.  
  - **Pareto for Gambles (Ex Ante)**:  
    - **Distortion**: Harsanyi’s Pareto applies to lotteries (*ex ante*: "all prefer policy \(\pi\) to \(\pi'\)"). You typically apply Pareto only to completions (*ex post*). But since your \(R_{\text{agg}}\) is linear, *ex post* Pareto implies *ex ante* Pareto.  
    - **Why it (mostly) doesn’t matter**: With deterministic data, *ex post* Pareto is all you observe. If annotators *were* asked about policies, *ex ante/ex post* conflicts could arise (e.g., due to risk preferences), but RLHF avoids this.  

  #### 3. **What Has No Counterpart**  
  - **Social States as Utility-Determining**:  
    - **Gap**: Harsanyi assumes a social state \(x\) fully determines all individuals’ utilities. In RLHF, \(R_i(x)\) scores \(x\) directly—no intermediary "utility" exists.  
    - **Defect on ML side? No, strength**. Your reward heads skip reconstructing human utilities; you’re scoring text. This bypasses philosophical debates about utilitarianism.  
  - **Weights as Ethical Weights**:  
    - **Gap**: Harsanyi’s weights \(w_i\) reflect ethical importance ("weight in society"). In RLHF, weights are set empirically (e.g., annotator reliability), with no moral commitment.  
    - **Defect on ML side? No, sign of thin philosophy**. The theorem doesn’t prescribe *how* to set \(w_i\); it just says aggregation must be linear. "Ethical weights" are window-dressing.  
  - **Noise-Free Disagreements**:  
    - **Gap**: Harsanyi assumes disagreements stem from conflicting utilities, not noise. RLHF often pools data, treating disagreements as noise (e.g., via a Bradley-Terry model).  
    - **Defect on ML side? Yes**. Pooling assumes a single "true" reward, ignoring conflict. Separate heads + scalarization better capture Harsanyi, but you lose statistical efficiency.  

  ---

  ### Stance on Your Suspected Residues  

  1. **"Social ranking depends only on individual utility levels"**:  
     - **Substance vs. Bookkeeping**: This is bookkeeping in Harsanyi. Social states are defined as having all relevant information, so utilities are sufficient statistics. In RLHF, it’s identical: \(R_i(x)\) *is* your utility for \(x\). You skip reconstructing "deeper" utilities—which is fine, but means you inherit this assumption.  

  2. **"Weights are unreal due to affine invariance"**:  
     - **Same problem as reward scales**. Yes, identically. Harsanyi weights \(w_i\) are only fixed relative to your normalization of \(R_i\). If you standardize rewards to \( \mathcal{N}(0,1) \), \(w_i\) become meaningful—but the choice of standardization is arbitrary. The theorem doesn’t solve this; it assumes scales are given.  

  3. **"Ex ante vs. ex post Pareto"**:  
     - **Doesn’t bite in RLHF**. Since you only have *ex post* (deterministic) comparisons and extend via expectation, *ex post* Pareto implies *ex ante* Pareto. Conflicts arise only if annotators violate EU (e.g., care about ex post inequality), but you don’t model that. In practice, RLHF ignores this distinction.  

  4. **"Veil of Ignorance → Uniform prior over annotators"**:  
     - **You’ve missed the point**. Harsanyi’s veil pins weights to equality *if* utilities are interpersonally comparable. But in RLHF, utilities aren’t comparable: scaling \(R_i\) arbitrarily changes "equal weight" interpretation. Uniform \(w_i\) after standardizing \(R_i\) is one approach, but standardization (e.g., by variance) *imposes* comparability. The veil is an ethical argument, not a technical solution.  

  ---

  ### Final Take  
  **Translation Robustness**: 90% faithful. Core insights (Pareto → scalarization, affine invariance, convex hull) hold. Gaps arise from deterministic data (no lottery preferences) and arbitrary normalization—but these are ML implementation constraints, not translation failures.  

  **Critical Flaw in ML Practice**: Treating annotator disagreements as noise (via pooled reward models) violates Harsanyi’s premise of legitimate conflict. Separate heads + scalarization are closer, but weights remain arbitrary without interpersonal comparability. Harsanyi doesn’t resolve this; it just shows the math if you pretend you can.  

  **Recommendation**: Use per-annotator heads, normalize (e.g., zero mean/unit variance), scalarize with uniform \(w_i\) as a pragmatic default—but own the arbitrariness. The theorem is a structural truth, not a moral guide.
