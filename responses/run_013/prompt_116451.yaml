  The ending: Ava locking Caleb in. Does this reveal her inner life? IIT doesn't address motives like cruelty. The film shows her actions as behavioral evidence, but IIT would say that doesn't prove consciousness. The user points out the film's focus on manipulation and cruelty, which IIT doesn't cover. So the reading breaks here because the film cares about ethics and intent, which IIT ignores.

