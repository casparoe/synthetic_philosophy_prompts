     Expected utility for Lottery 2: U(B)

     For Participant 1: 
        EU1 = 0.5*10 + 0.5*8 = 9, EU2=9 -> indifferent.

     For Participant 2:
        EU1 = 0.5*100 + 0.5*1 = 50.5, EU2=50 -> prefers Lottery 1.

