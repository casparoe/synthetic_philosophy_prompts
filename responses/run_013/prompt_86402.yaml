  3. **Allais-style violations in the lottery stage:**
     - We might see choices that violate expected utility (like the Allais paradox). We can use that as a teaching moment: "Notice that some of you might have chosen in a way that expected utility theory cannot explain. This is a well-known phenomenon and has led to alternative theories (like prospect theory)."

  **What the activity cannot show:**

  We must be explicit:

  1. The activity does not show that satisfying a preference is good for the person. We are only representing choices, not making welfare judgments.

  2. The activity does not license interpersonal comparisons of utility. Even with cardinal utility (for risk), we cannot compare the utility of two people. The numbers are only for representing one individual's choices under risk.

  3. We are not claiming that utility is a real quantity of happiness. It is a representation of choice behavior.

  **Rules for the broker in Stage 1:**

  - The broker is allowed to trade with any participant who has a cycle.
  - Each trade must be mutually agreed upon (but the cycler will agree because the trade appears beneficial).
  - The broker charges 1 point per trade (from the cycler's point balance).
  - The broker's goal is to make as many points as possible by cycling the participants.

  **Materials:**

  - For Stage 1: 
     - Choice cards for the three pairwise choices (A vs B, B vs C, C vs A) for each student.
     - Record sheets.
     - A small prize (like candy) to be awarded based on one randomly selected choice.

  - For Stage 2:
     - Cards with utility assignments for each bundle (A, B, C) for each student. Make sure each card has a different monotone transformation (some linear, some nonlinear) but preserving the same order (A>B>C). Also, include one card with a different order (if we want to show that order matters) but that might complicate. We can stick to the same order.

  - For the broker: 
     - A way to keep track of points (a spreadsheet or paper).

  **Final note:** 
  The activity is designed to be experiential. The debrief is crucial to tie the experiences to the concepts.
answer: |-
  ### Philosophy of Economics: Utility as Representation Activity  
  **Objective:** Students experience utility as a representation of choice (not a cardinal quantity) through a two-stage activity. Concepts covered: revealed preference, intransitivity, ordinal vs. cardinal utility, money pumps, and affine transformations.  

  ---

  ### **Stage 1: Intransitivity and Money Pump (40 minutes)**  
  **Objective:** Engineer choice sets to induce intransitive cycles and demonstrate money pumps.  

  #### **Materials**  
  - Choice cards for 3 bundles (X and Y goods):  
    - **Bundle A:** 10X, 5Y  
    - **Bundle B:** 7X, 8Y  
    - **Bundle C:** 6X, 9Y  
  - Prize points (e.g., 1 point = 1 entry in a raffle for a $5 gift card).  
  - Broker token (for instructor or a student volunteer).  
  - Timer.  

  #### **Engineering the Cycle**  
  Bundles are designed so marginal trade-offs favor different goods in pairwise comparisons, exploiting context-dependent weighting (e.g., shifting attention to X vs. Y):  
  - **A vs. B:** A has more X (10 vs. 7), B has more Y (5 vs. 8). Participants who overweight X choose A.  
  - **B vs. C:** B has more X (7 vs. 6), C has more Y (8 vs. 9). Participants who overweight X choose B.  
  - **C vs. A:** C has more Y (9 vs. 5), A has more X (6 vs. 10). Participants who overweight Y choose C.  
  *Prediction:* ~40% will cycle (A > B > C > A) due to shifting focus on attributes.  

  #### **Rules & Timeline**  
  1. **Introduction (2 min):**  
     - “Choose bundles to earn prize points. One random choice will count. No talking.”  
     - *No lecture on utility/preferences.*  

  2. **Choice Rounds (12 min):**  
     - **Round 1:** A vs. B (3 min).  
     - **Round 2:** B vs. C (3 min).  
     - **Round 3:** C vs. A (3 min).  
     - Students record choices privately.  

  3. **Tabulate Cycles (3 min):**  
     - Collect data. Identify participants with cycles (A>B, B>C, C>A).  

  4. **Broker Activity (15 min):**  
     - **Broker role:** Trades with a cycler, charging 1 point per trade.  
     - **Script:**  
       - “You chose C over A? I’ll trade your A for my C. You gain C (better!) for 1 point.”  
       - “You chose B over C? Trade your C for my B. Pay 1 point.”  
       - “You chose A over B? Trade your B for my A. Pay 1 point.”  
     - *Result:* Cycler ends with A (started with A) but loses 3 points. Broker profits.  
     - Repeat with 1–2 cyclers.  

  5. **Transition (8 min):**  
     - Display anonymous cycle data. Ask: “What pattern do you see? Could a ‘utility score’ explain all choices?”  

  ---

  ### **Stage 2: Ordinal vs. Cardinal Utility (35 minutes)**  
  **Objective:** Show monotone transformations are undetectable in deterministic choices, but affine transformations are needed for lotteries.  

  #### **Materials**  
  - Utility cards (each student gets one):  
    - **Order-Preserving (monotone):**  
      - Student 1: U(A)=100, U(B)=80, U(C)=60  
      - Student 2: U(A)=30, U(B)=25, U(C)=20  
      - Student 3: U(A)=10, U(B)=9.9, U(C)=9.8  
    - *All reflect A > B > C (same as Stage 1).*  
  - Lottery choice cards:  
    - **Lottery 1:** 50% A, 50% C  
    - **Lottery 2:** 100% B  
    - **Lottery 3:** 10% A, 90% C  
    - **Lottery 4:** 11% B, 89% C  

  #### **Rules & Timeline**  
  1. **Utility Cards (5 min):**  
     - Hand cards: “This is your utility for A, B, C. Design an experiment to prove your numbers are correct.”  

  2. **Design Experiments (15 min):**  
     - Groups of 4 brainstorm deterministic tests (e.g., “Offer A vs. B; if they choose A, U(A)>U(B)”).  
     - *Reveal:* All experiments only detect order (monotone transformations are observationally equivalent).  

  3. **Lottery Choices (15 min):**  
     - **Task:** Choose between:  
       - Lottery 1 (50% A, 50% C) vs. Lottery 2 (100% B)  
       - Lottery 3 (10% A, 90% C) vs. Lottery 4 (11% B, 89% C)  
     - **Calculate EU:**  
       - With affine utilities (e.g., Student 1: EU1=80, EU2=80 → indifferent).  
       - With non-affine (Student 3: EU1=9.9, EU2=9.9 → indifferent; Student 2: EU1=25, EU2=25.25 → prefers Lottery 2).  
     - *Result:* Choices diverge if utilities aren’t affine transformations.  

  ---

  ### **Debrief (15 minutes)**  
  Map activities to concepts:  
  1. **Stage 1 choices:**  
     - *Revealed preference:* Choices define preferences. No mention of “utility” until now.  
     - *Intransitivity:* Cycles violate rationality axioms. No utility function exists for cyclers.  
     - *Not just “unusual”*: Intransitivity is a logical failure, not a minority preference.  

  2. **Broker activity:**  
     - *Money pump:* Cyclers pay to “improve” but lose points. Price of intransitivity.  

  3. **Stage 2 deterministic experiments:**  
     - *Ordinal utility:* Monotone transformations (U vs. √U) are indistinguishable—only order matters.  

  4. **Stage 2 lotteries:**  
     - *Cardinal utility:* Affine transformations (aU + b) preserve lottery choices.  
     - *Expected utility:* Only affine utilities explain consistent risk choices.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students choosing consistently to “beat” the activity:**  
     - *Handling:* Use anonymous data. Highlight: “Some avoided cycles, but 40% didn’t—why might that be?” Discuss realism of transitivity.  

  2. **Students calling choices “arbitrary”:**  
     - *Handling:* “If choices were arbitrary, does revealed preference still hold?” Debate if preferences must be stable.  

  3. **Allais-style violations (risk preferences):**  
     - *E.g.,* Prefer Lottery 2 (certain B) over Lottery 1, but Lottery 3 over Lottery 4 (violating independence axiom).  
     - *Handling:* “This mirrors Allais paradox! Expected utility isn’t perfect—it’s a model.”  

  ---

  ### **What the Activity CANNOT Show**  
  1. **Welfare claims:**  
     - Satisfying a preference ≠ “good for you.” Utility is behavioral, not well-being.  

  2. **Interpersonal comparisons:**  
     - No units of “happiness.” Utility numbers don’t support “Alice is happier than Bob.”  

  3. **Scope limitations:**  
     - Doesn’t prove all choices are rational; just shows the math of representation.  
     - Doesn’t justify efficiency as a normative goal.  

  ---

  ### **Instructor Notes**  
  - **Total Time:** 90 min (Stage 1: 40 min, Stage 2: 35 min, Debrief: 15 min).  
  - **Tone:** Neutral (“What did we see?”), not prescriptive (“This is wrong”).  
  - **Ethics:** Prize points trivial; no deception beyond pedagogical purpose.  
  - **Adaptation:** If no cycles emerge, use pre-seeded data. If time runs short, skip second lottery pair.  

  This activity forces confrontation between choice behavior and theoretical constructs, leaving students primed for deeper discussion of rationality, welfare, and modeling.
