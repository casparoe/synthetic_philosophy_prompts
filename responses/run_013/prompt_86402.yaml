  **Timeline (90 minutes total):**

  - Stage 1: 25 min
    - Introduction: 2 min
    - Choices: 8 min
    - Tabulation and broker setup: 5 min
    - Broker demonstration: 10 min

  - Stage 2: 30 min
    - Hand out utility numbers: 2 min
    - Design deterministic experiment: 10 min (including group work and report)
    - Design lottery experiment: 10 min (including group work and report)
    - Discussion: 8 min

  - Debrief: 35 min (we'll use the remaining time and go over)

  **Debrief (35 min):**

  Map each moment to the concepts:

  1. **Stage 1 choices:** 
     - We observed that some of you had intransitive choices (A>B, B>C, C>A). 
     - This means that there is no utility function that can represent your choices because a utility function requires transitivity (if U(A)>U(B) and U(B)>U(C) then U(A)>U(C)).
     - **Revealed preference:** We define your preferences by your choices. If choices are intransitive, then there is no utility representation.

  2. **Broker demonstration:**
     - The broker exploited the cycle by having you trade in a circle, each trade seeming like an improvement but leaving you worse off (because you paid for the trades and ended where you started). 
     - This is the **money pump argument**: if your preferences are intransitive, you can be turned into a money pump. This is the practical cost of intransitivity.

  3. **Stage 2 deterministic choices:**
     - We saw that many different utility number assignments (as long as they preserve the order) led to the same choices in deterministic situations. 
     - This shows that utility is **ordinal**: any **monotone transformation** represents the same preferences. We cannot measure the "true" utility, only the ordering.

  4. **Stage 2 lotteries:**
     - When we introduced uncertainty, we saw that different number assignments (that are not affine transformations of each other) led to different choices in lotteries. 
     - This shows that for choices under uncertainty, we need **cardinal utility** that is unique up to an **affine transformation** (i.e., we can choose the origin and unit, but not arbitrarily rescale). 
     - This is the foundation of **expected utility theory**.

  **Anticipated issues and handling:**

  1. **Participants who suspect the point and choose consistently:**
     - This will reduce the number of cycles. We can say: "Even if you didn't produce a cycle, about X% of the class did, and we can use that data. The point is that cycles are possible and have consequences."

