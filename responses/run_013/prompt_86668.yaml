  - **Hostage Negotiation**: A classic, but the threat is causal and the threatener's cost is typically tied to the hostage's value. It's harder to introduce an arbitrary surrogate without it seeming contrived. Also, the threatener's cost of killing a hostage is often high (morally, reputationally) and not easily separable.
