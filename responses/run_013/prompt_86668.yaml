    - T will compare threatening V_primary (profit $1 billion) and threatening V_surrogate (profit $1 million). $1 billion > $1 million, so T still threatens V_primary.

     This is not what we want. We need T to prefer threatening the surrogate.

     Why would T prefer the surrogate? Because of the cost of follow-through risk? In the threaten V_primary branch, T doesn't incur any cost because A always pays. So no risk.

     We must introduce uncertainty about A's ability to pay or something else. Or change the reputation system.

     **Let's change the reputation cost**: The reputation cost is incurred only if T makes a threat and then doesn't carry through. But in the V_primary threat, if A doesn't pay, T will carry through (because $200 million cost is better than $500 million reputation loss). So the threat is credible, and A always pays. T doesn't incur the $200 million because it doesn't have to follow through.

     What if the reputation cost is not about following through but about the cost of the attack? For example, the criminal organization doesn't want to waste resources. They evaluate T based on net profit. Then:

     - In the V_primary threat: T might get $1 billion, but if A doesn't pay, T nets -$200 million (destruction cost) and then also reputation loss? We need to define it differently.

     **Better**: The criminal organization requires that T not lose money on an operation. If T threatens and then has to follow through without getting paid, that's a loss. The organization might fine T or something. So the net profit of the operation must be non-negative. 

     Then:

     - Threaten V_primary without payment: T loses $200 million (and also reputation loss?). But at least, the operation has a net loss of $200 million, which might be unacceptable. So T cannot let that happen. But in equilibrium, it doesn't happen. So it's not a problem.

     We need that T is risk-averse or that there is a chance that A cannot pay the $1 billion demand. For example, there's a 1% chance that A is unable to pay. Then:

     - Threaten V_primary: 
          - With 99% chance, A pays $1 billion, profit $1 billion.
          - With 1% chance, A doesn't pay, T must destroy at cost $200 million and gets nothing, so net -$200 million.
          - Expected profit: 0.99 * 1e9 - 0.01 * 2e8 = $989,000,000 - $2,000,000 = $987,000,000.

     - Threaten V_surrogate:
          - T demands $1 million. A will pay for sure (because there's no uncertainty about A's ability to pay $1 million). 
          - Profit: $1,000,000.

     Then T still prefers V_primary.

     Unless the probability of A not paying is high enough. For example, if the probability that A cannot pay $1 billion is 50%, then expected profit for V_primary is 0.5 * 1e9 - 0.5 * 2e8 = $400,000,000. For V_surrogate, it's $1,000,000. Still not.

     We need that the cost of the primary attack is so high that it makes the expected profit negative or lower than the surrogate threat. That won't happen because the demand is very high.

     **Pivoting**: Maybe the surrogate goal allows the agent to make a commitment to not negotiate for the primary goal. How?

     Let's consider a different timeline:

     - Stage 0: A decides whether to adopt V_surrogate and also whether to publicly precommit to never paying any ransom for V_primary.
     - If A precommits to never paying for V_primary, then if T threatens V_primary, A won't pay. Then T will have to choose between destroying V_primary at cost $200 million (and then reputation is saved) or not and losing $500 million. T will destroy. But then A loses V_primary. So that's bad.

     Alternatively, if A adopts V_surrogate and then precommits to only negotiate for V_surrogate, then T can only threaten V_surrogate. But then T will threaten V_surrogate and demand $1 million, which A will pay. A still pays $1 million, but saves V_primary.

     Compared to without any action: without, A pays $1 billion. with, A pays $1 million. That's better.

     And how does the precommitment work? A might publicly declare: "I will only negotiate for the server, not for the source code." Then if T threatens the source code, A will not pay, and T will have to decide whether to follow through. But T knows that if it threatens the source code, it will have to follow through at high cost. So T might not threaten the source code. Instead, it will threaten the server.

     So the steps for A:
     1. Adopt the surrogate goal (care about the server).
     2. Precommit to only negotiate for the server (i.e., if the source code is threatened, A will not pay).

     Then T's choices:
     - Threaten source code: 
          - A will not pay (because of the precommitment). 
          - T then must choose: destroy source code (cost $200 million) or not (reputation loss $500 million). T will destroy.
          - Outcome: A loses source code, T pays $200 million.
     - Threaten server:
          - A will pay up to $1 million. T can demand $1 million and get it.
          - Outcome: A pays $1 million and keeps source code and server.
     - Do nothing: $0.

     T will choose to threaten the server and get $1 million (rather than threatening the source code and losing $200 million).

     A has reduced the ransom from $1 billion to $1 million.

     This works.

     So the mechanism is: By adopting a surrogate goal and then precommitment to not negotiate on the primary goal, A can make the primary threat very costly for T to execute, which deters T from making the primary threat. T switches to the surrogate threat, which is less costly for T to execute and for which A only has to pay a small ransom.

     In this version, the surrogate goal is necessary for T to have any leverage at all. Without it, T wouldn't threaten the server because A doesn't care. With it, T can threaten the server and get a little.

     And the precommitment to not negotiate on the primary is necessary to deter T from threatening the primary.

     So the session outline:

  ### Step-by-Step Session Plan

  #### (0) Introduction (5 minutes)
     - Motivate the problem: Sometimes we face threats from agents who can harm us in ways that are expensive for them to carry out. Can we reduce their leverage by giving them a cheaper way to harm us but about which we care less?

  #### (1) The Corporate Blackmailer Scenario Without Defenses (10 minutes)
     - Present the scenario: T can threaten the source code or the server. Without any action by A, T will threaten the source code and demand $1 billion, and A will pay.
     - Why? Because the threat is credible: if A doesn't pay, T will follow through to avoid reputation loss.

  #### (2) Ordinary Precommitment and Why It Fails (10 minutes)
     - What if A tries to precommit to not paying any ransom for the source code? 
     - Then, if T threatens the source code, A won't pay. T will then follow through and destroy the source code. A loses the source code. 
     - This is worse than paying the ransom. So precommitment alone doesn't work.

  #### (3) Introducing the Surrogate Goal (15 minutes)
     - A adopts the server as a goal (now values it at $1 million) and publicly precommits to only negotiate for the server (i.e., will not pay any ransom if the source code is threatened).
     - Now T's options:
          - Threaten source code: A won't pay, so T must destroy it at a cost of $200 million. T nets -$200 million.
          - Threaten server: A will pay up to $1 million. T demands $1 million and gets it. T nets $1 million.
          - Do nothing: $0.
     - T will choose to threaten the server and get $1 million.
     - Outcome for A: pays $1 million (instead of $1 billion) and keeps the source code.

  #### (4) Why It Works: The Role of the Threatener's Beliefs and Costs (15 minutes)
     - The threatener's cost for attacking the surrogate is low, so it can afford to follow through.
     - The agent's adoption of the surrogate goal must be believed by the threatener. This requires that the agent's decision theory is such that it will act to protect the surrogate (e.g., it's not just pretending).
     - The agent's precommitment to not negotiate for the primary must be credible. This might require a commitment device or a public, irreversible announcement.

  #### (5) When It Can Backfire: Private Information (15 minutes)
     - What if T has private information about its costs?
     - Example: T might have a very low cost for destroying the source code (e.g., $1 million) in addition to the server. But A doesn't know this.
     - Without surrogate: T threatens source code and demands $1 billion. A pays.
     - With surrogate and precommitment: T might still threaten the source code because it can follow through cheaply. Then A doesn't pay and loses the source code. This is worse than paying.
     - So if there is uncertainty about T's costs, adopting the surrogate might be risky.

  #### (6) Conclusion and open question (5 minutes)

  ### Misconceptions and When to Address Them

  1. **That a surrogate goal is just self-deception or pretending.**
     - This is a real misconception. Address when introducing the surrogate goal (step 3): The surrogate goal must be a real change in the agent's decision-making (e.g., by reprogramming or a sincere commitment) so that the threatener can be sure the agent will act to protect the surrogate.

  2. **That it is identical to a commitment device or to burning one's bridges.**
     - This is a half-truth. Address in step 2 and step 3: Ordinary precommitment alone doesn't work because it might leave you vulnerable to the primary threat. The surrogate is an additional element that provides an alternative, less costly threat for the threatener.

  3. **That it can only work against an irrational or fanatical threatener.**
     - This is a real misconception. Address in step 4: The threatener is rational and wants to maximize profit. The surrogate works by giving the threatener a more profitable option (threatening the surrogate) than the primary threat.

  4. **That the surrogate has to be something absurd and worthless, or else the threatener will not take it seriously.**
     - This is not entirely true. Address in step 3: The surrogate should be something that the agent can make a credible commitment to protect, and it should be less valuable to the agent than the primary. It doesn't have to be absurd, but it should be chosen so that the agent's maximum willingness to pay for it is low.

  5. **That the whole maneuver is pointless unless the threatener is causally reachable.**
     - This is a real misconception. Address in step 4: The acausal setting (where the threatener can predict the agent's state) is actually the most natural for this because the threatener needs to know about the agent's adoption of the surrogate goal and the precommitment. In causal settings, it might be harder to communicate, but the logic still applies.

  ### Final Exercise (10 minutes)

  **Question**: In the Corporate Blackmailer scenario, suppose that after A adopts the surrogate goal and precommits to only negotiate for the server, a new opportunity arises: A can now also adopt a *second* surrogate goal (e.g., another server) with the same value ($1 million) and make the same precommitment for it. Would it be beneficial for A to adopt the second surrogate goal? Why or why not?

  **Expected Answer**:
  - If A adopts a second surrogate, then T can choose to threaten either server. But since they are identical, T will still demand $1 million for one of them. A will pay and still save the source code. There's no change in the ransom amount. However, if T can threaten both surrogates at once, it might demand $2 million. But in our scenario, T can only threaten one at a time. So it doesn't help and might be neutral. But note: if the second surrogate adoption is costly (e.g., it requires effort), then it's not worth it.

  - However, if T has the option to threaten both surrogates simultaneously, then T might demand $2 million (since A values each at $1 million). Then A would be forced to pay $2 million, which is worse. Therefore, A should not adopt the second surrogate if it enables a bundled threat.

  - The exercise tests the understanding that the surrogate goal should be chosen to minimize the threatener's ability to extract more from the agent. Having multiple surrogates might allow the threatener to escalate.

  ### What to Explicitly Refuse to Cover
  - Formal decision-theoretic treatments (e.g., the exact equilibrium calculations in game theory).
  - The safe-Pareto-improvement literature (which is about cooperation under acausal settings but not specifically about surrogate goals).
  - Implementation in actual AI systems (which would require a deep dive into AI architectures).

  This keeps the session focused on the core mechanism.
