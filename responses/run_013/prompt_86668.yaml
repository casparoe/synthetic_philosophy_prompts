  1. The difference between a threat's target and the threatener's cost of following through, including how that cost depends on third parties and reputation.
  2. Why ordinary precommitment and reputation-based deterrence are not the phenomenon we are discussing.
  3. What must be true about the threatener's beliefs and the agent's decision theory for a surrogate to work.
  4. The possibility that adopting a surrogate can backfire when the threatener has private information about the cost of attacking the surrogate.

  We also need to choose a single concrete scenario that will carry the session and map out misconceptions.

  ### Step 1: Choose the Concrete Scenario
  The scenario must:
  - Involve a threat that is acausal or at least not straightforwardly causal (so that the threatener is acting based on prediction of the agent's behavior, not just in response to it).
  - Allow the agent to adopt a surrogate goal that the threatener can target instead of the original goal.
  - Illustrate the key components above.

  I propose a **Predictive Blackmailer** scenario:

  **Scenario Setup:**
  - **Agent (A)**: A rational agent (e.g., an AI or a human) that values two things: 
    - Primary Value (V_primary): Something very important (e.g., the survival of humanity).
    - Surrogate Value (V_surrogate): Something arbitrary (e.g., the integrity of a specific, otherwise worthless, rock on Mars).
  - **Threatener (T)**: An entity (e.g., another AI, an alien, or a sophisticated human organization) that can launch a destructive action. T can choose to:
    - Destroy V_primary at a cost C_primary to itself.
    - Destroy V_surrogate at a cost C_surrogate to itself.
    - Do nothing.
  - T's goal: To extract some concession from A (e.g., money, resources, or a change in behavior). 
  - The interaction is acausal: T can observe A's state (including whether A has adopted the surrogate goal) and then decide whether to carry out the threat, but T must commit to the threat before A acts. Alternatively, we can set it up as a game where T moves first by sending a threat, then A decides whether to comply, and then T decides whether to follow through. However, for acausality, we need T to base its decision on a prediction of A's behavior. 

  **Key Features of the Scenario:**
  - **Acausal Element**: T is able to predict A's behavior with high accuracy (e.g., because T is a superintelligent predictor or because there is a logical dependence). This means that T can condition its threat on what A will do, even if A hasn't acted yet. In practice, we can model this as T moving first and A moving second, but with T having perfect knowledge of how A will respond.
  - **Cost Structure**: T incurs a cost for carrying out a threat. This cost might come from:
    - Direct resource expenditure.
    - Reputation: If T does not follow through, it loses credibility for future threats. But note: if T destroys the surrogate, it might not harm its reputation for threats against primary values because the surrogate is arbitrary. We must make clear that reputation is context-dependent.
  - **Surrogate Adoption**: A can deliberately adopt V_surrogate as a goal, even though A doesn't inherently care about it. A does this by changing its own decision-making process to act as if it values V_surrogate.

  **Why this scenario?**
  - It clearly separates the threat's target (the thing being threatened) from the threatener's cost (which depends on which target is chosen and the context).
  - It allows us to illustrate why ordinary precommitment (like burning bridges) doesn't work here because the threatener can choose to target the surrogate instead of the primary.
  - It sets up the need for the threatener to believe that the agent truly cares about the surrogate (so the agent's decision theory must be such that it really will act to protect the surrogate) and for the threatener to have a cost for attacking the surrogate.
  - It can be extended to show the backfiring case: if T has private information about C_surrogate being very low (so that T would be willing to destroy the surrogate even if A adopts it) then A might be worse off by adopting the surrogate.

