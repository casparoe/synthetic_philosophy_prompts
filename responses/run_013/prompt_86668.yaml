  ### Teaching Plan: Surrogate Goals Against Acausal Threats

  #### **Core Objective**  
  Build the session as a step-by-step argument demonstrating that surrogate goals are a rational, non-obvious defense against acausal threats. The goal is to transition from "this is weird" to "this is a necessary tool in an acausal toolkit."

  #### **Dependency Structure**  
  The concepts must be introduced in this order to create a logical cascade:  

  1. **Threat Anatomy** (20 minutes):  
     - Define the difference between a threat's *target* (what the threatener threatens to destroy) and the threatener's *cost of following through* (what it costs them to execute the threat).  
     - Use a **hostage scenario**: A kidnapper threatens to kill a hostage unless paid $1M.  
       - *Target*: Hostage's life.  
       - *Cost to threatener*: Moral/scruples cost + reputational cost (if others witness the act).  
     - Emphasize: The cost depends on *third-party observers* (e.g., future victims who believe the threatener is credible) and *reputation* (e.g., if backing down reduces future leverage).  
     - *Why this first?* Establishes that threats rely on the threatener’s costs, not just the agent’s values.  

  2. **Limits of Standard Defenses** (15 minutes):  
     - Explain ordinary precommitment (e.g., "I’ll never negotiate with terrorists") and reputation-based deterrence (e.g., "I always retaliate, so don’t bother").  
     - Contrast with a scenario where these fail: An **acausal threatener** (e.g., a superintelligent AI) can predict your actions *logically* (not just causally) and knows you’re bluffing.  
     - *Key insight*: Standard defenses assume causal influence or observable actions. They fail when the threatener uses *logical prediction* (e.g., simulating your decision process).  
     - *Why next?* Creates a gap—students see existing tools are insufficient.  

  3. **Surrogate Goals: Mechanism and Necessity** (20 minutes):  
     - Introduce the core idea: Adopt an arbitrary *surrogate goal* (e.g., "protect this random rock") to divert threats.  
     - Present the **acausal blackmail scenario** (carries the whole session):  
       - *Agent*: You control a resource (e.g., a research database).  
       - *Threatener*: A predictor AI that can destroy your resource *or* a surrogate (e.g., a mundane backup server).  
       - *Cost to threatener*: Destroying your resource costs 100 utils (high effort); destroying the surrogate costs 10 utils (low effort).  
       - *Stakes*: You value the resource at 1000 utils; the surrogate is worthless.  
       - *Threat*: "Pay me 500 utils, or I destroy your resource."  
     - Without a surrogate, you pay—the threat is credible.  
     - **Surrogate move**: Adopt a new goal: "I value the backup server at 50 utils." Now the threatener can:  
       - Threaten the resource (cost 100 to them) *or* the surrogate (cost 10 to them).  
       - They prefer threatening the surrogate—it’s cheaper. You pay ≤50 utils to save it.  
     - *Result*: You pay less, and your core resource is safe.  
     - *Why this example?* It isolates the mechanism:  
       - Must have: Asymmetric costs for threatener, acausal prediction.  
       - Must not have: Direct communication or causal influence (threatener acts via prediction).  
       - *Alternatives rejected*:  
         - Hostage negotiations feel "causal" and confuse reputation vs. logic.  
         - Prisoner’s Dilemma variants introduce cooperation noise.  

  4. **Critical Conditions** (20 minutes):  
     - Break down what makes surrogates work:  
       - **Threatener’s beliefs**: They must believe you *sincerely* value the surrogate (not pretending). Requires your decision theory to *actually optimize* for the surrogate.  
       - **Your decision theory**: Must be *updateless* (commit to defending the surrogate *before* threats occur). If you "change your mind" later, the threatener predicts this and ignores the surrogate.  
       - **Cost asymmetry**: Threatener’s cost to attack the surrogate must be lower than for the original target.  
     - *Why here?* Students now see surrogate goals as a deliberate, non-deceptive tool.  

  5. **Risks and Private Information** (10 minutes):  
     - Introduce a twist: The threatener knows their cost to attack the surrogate is *even lower than you think* (e.g., 5 utils, not 10).  
     - If you adopt the surrogate, they might threaten it *more aggressively* (e.g., demand 50 utils anyway), making you worse off.  
     - *Why last?* Shows this isn’t a silver bullet—context matters.  

  #### **Misconceptions to Address**  
  | Misconception | When to Address | Approach |  
  |---------------|-----------------|----------|  
  | "Surrogate goals = self-deception." | During **Critical Conditions** (step 3) | Emphasize: This requires *sincere goal adoption* in your decision theory (e.g., AI code that actually optimizes for the rock). Pretending fails because predictors see through it. |  
  | "Same as burning bridges/precommitment." | During **Limits of Standard Defenses** (step 2) | Contrast: Precommitment locks you into one action; surrogates give the threatener a *better option*. |  
  | "Only works against irrational threateners." | During **Surrogate Goals** (step 3) | Clarify: The threatener *benefits* by targeting the surrogate (lower cost). It’s rational for them. |  
  | "Surrogate must be absurd (e.g., platinum sphere)." | During **Surrogate Goals** (step 3) | Note: The surrogate should be *cheap for you to value* but *credible to defend*. Absurdity isn’t required—just asymmetry in threatener’s costs. |  
  | "Requires causal reach." | During **Limits of Standard Defenses** (step 2) | Dismiss early: Acausal threats use *prediction*, not causation. Don’t dwell—this distracts from the core. |  
  | *Half-truth*: "Surrogates always backfire with private info." | During **Risks** (step 5) | Acknowledge it’s a risk but note: Even with uncertainty, surrogates can dominate when threatener costs are predictable. |  

  **Do not raise**: "This is only for fanatics." It’s a non-misconception—rational agents use this. Raising it plants confusion.  

  #### **Final Exercise (Last 10 Minutes)**  
  **Question**: *In the acausal blackmail scenario, suppose you adopt a surrogate goal (valuing the backup server at 50 utils), but the threatener can only destroy one target. They predict your move and threaten the surrogate. You now consider abandoning the surrogate goal to avoid paying. Why will this fail, and what should you do instead?*  

  **Expected Answer**:  
  - Abandoning the goal fails because the threatener *already predicted this* and would have threatened your core resource instead.  
  - Correct move: *Stick to defending the surrogate* (pay ≤50 utils) since the threatener’s cost to attack it (10 utils) makes the threat credible, and you pay less than the original 500.  
  - **Why this works**: Tests understanding of updeless decision-making and acausal prediction.  

  #### **Explicitly Exclude**  
  - **Formal decision theory**: No math beyond cost/utils.  
  - **Safe-Pareto literature**: This is a precursor but would blur focus.  
  - **AI implementation**: Avoid how-to for systems; this is a theory session.  

  **Closing Script**:  
  “Today was about one idea: Surrogate goals as acausal armor. We didn’t survey fields or solve all problems—we built an argument for why this is a distinct, rational tool. Next time, we’ll test it against more complex threats.”
