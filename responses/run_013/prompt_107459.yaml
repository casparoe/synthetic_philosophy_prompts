prompt: |-
  I am a novelist at work on a historical novel set in England in the 1880s and 1890s. My protagonist is a Cambridge moral philosopher closely modeled on Henry Sidgwick, the utilitarian who co-founded the Society for Psychical Research and served as its first president. What draws him into the investigation of mediums, apparitions, and thought-transference is not curiosity but need: he has lost his religious faith and hopes that disciplined empirical inquiry might yield evidence bearing on whether anything survives death — the question he cares about most and trusts least. The historical Sidgwick was convinced by the evidence for telepathy yet remained cautious about treating mediumistic phenomena as proof of survival, and he died without resolving the matter; I want my character to arrive at that same caution honestly, through his own reasoning, rather than simply announcing it as a mood.

  The difficulty is that my plot turns on his repeated decisions — séance after séance, claim after claim — about what to make of a report, what to write up for the Society's Proceedings, and what to tell the people who press him for a verdict. Around him I have placed a wealthy spiritualist patron who funds his research, a hard-nosed physicist colleague who regards the whole enterprise as a scandal, a recently bereaved friend who needs him to confirm that the dead survive, and his own wish to believe. He is not a statistician and has no laboratory; he works from testimony, notes, and his own observation, and he must often decide within a week whether to stake his name on a case. The Society's council has to sign off on anything published, and its credibility — which is also his — is the thing most at risk.

  What I need is a decision procedure he can actually run under those pressures: the questions he should ask in order, what would count as a sufficient answer to each, the point at which the procedure stops with a firm no, and the point at which it must hand the decision back to him because the matter is one of hope or of values rather than of evidence. Keep whatever distinctions the historical Sidgwick's approach depends on — above all, between the bare occurrence and its interpretation, between the question of what caused a result and the question of what that result justifies believing, and between evidence for thought-transference and evidence for survival — and tell me which of his scruples can be dropped for the sake of usability and which must survive the simplification. Be candid about where the procedure will misfire or merely dress up a judgment call as a step.

  Then run the procedure on three cases: first, a private séance, held with no meaningful controls, at which a medium produces a particular detail she could plausibly have learned elsewhere; second, a series of controlled card-guessing trials in which a sender in a separate room appears to transmit an image at a rate above chance; third, a sitting at which he suspects fraud but cannot prove it. Include at least one case where the procedure returns an answer I will not want — I suspect it will refuse my protagonist the verdict my ending depends on — and be explicit about what the procedure cannot do: whether it can ever license belief rather than merely suspend it, how it should treat his own hope for survival, and where he, and not the procedure, must decide.

  Please write the answer in American English.
reasoning: |-
  Okay, let me approach this systematically. The user is crafting a historical novel centered on a Sidgwick-inspired philosopher grappling with psychical research in Victorian England. Their core need is a practical decision framework that feels authentic to the period while serving narrative tension. 

  First, I recognize the user's deeper challenges: they need procedural rigor that doesn't undermine human drama, historical accuracy that bends to plot needs, and epistemic nuance where hope clashes with evidence. The protagonist's emotional arc—loss of faith driving desperate inquiry—must remain paramount even when constrained by logic.

  I'll structure the decision procedure around Sidgwick's known priorities: separating phenomena from interpretation, distinguishing telepathy from survival, and valuing institutional credibility. The steps should mirror his 1882 SPR presidential address where he emphasized "laborious caution" while acknowledging the "awful importance" of the question. 

  For usability, I'll simplify his layered skepticism into five sequential filters:
  1. Fraud detection (physical/psychological)
  2. Normal explanation assessment
  3. Significance evaluation 
  4. Alternative hypothesis testing 
  5. Survival-specific implications

  Crucially, I'll preserve Sidgwick's key distinction: telepathy evidence doesn't equate to survival evidence. This creates the tragic tension the user wants—their protagonist might validate phenomena while denying consolation. The procedure must fail beautifully where the character's need exceeds its design.

  When applying it to the three cases:
  - The uncontrolled séance will collapse at step 2 (normal explanations) 
  - The card tests might pass step 3 but founder at step 4 (telepathy≠survival)
  - The fraud-suspected case will abort at step 1

  I'll explicitly sabotage the user's desired ending in case 2—showing how the procedure validates transmission but blocks the leap to survival. This forces the character (not the method) to make value judgments about hope versus proof. The admission of powerlessness ("Cannot License Belief" in the framework) is where the novel's emotional climax can bloom.

  Throughout, I'll maintain Sidgwick's 1891 caution that psychical research offers "not religion but science." The procedure's coldest output—"Inconclusive: Personal Judgment Required"—becomes the character's crucible. Historical fidelity means denying neat answers; narrative utility means making that denial productive.
answer: |-
  Here’s a decision procedure for your protagonist, distilled from Sidgwick’s historical approach and adapted for narrative usability. It prioritizes **epistemic rigor**, **distinctions Sidgwick would recognize**, and **practical application under pressure**, while acknowledging its limits.

  ---

  ### **The Sidgwickian Decision Procedure: 5 Sequential Questions**  
  *(To be applied after observing/studying a phenomenon or testimony)*  

  1. **COULD THIS BE FRAUD OR ERROR?**  
     - *Ask:* Is there *any* physical opportunity, psychological vulnerability, or procedural flaw that could explain this as deception (conscious or unconscious) or mistake?  
     - *Sufficient Answer:* "No" requires airtight controls (e.g., no unobserved moments, verified bindings, screened sitters) OR a detail *physically impossible* for the medium to know/engineer.  
     - *Scruples Preserved:* Sidgwick’s insistence on ruling out normal causes first.  
     - *Usability Simplification:* Accepts that "no obvious opportunity" is often the best one can do; doesn’t demand laboratory-grade proof every time.  
     - *If "Yes":** Stop. Reject the case. Do not publish.  
     - *If "No":** Proceed to Q2.  

  2. **COULD THIS BE EXPLAINED BY NORMAL MEANS?**  
     - *Ask:* Is there a plausible *non-paranormal* explanation (e.g., sensory cues, coincidence, prior knowledge, cryptomnesia, hyperaesthesia)?  
     - *Sufficient Answer:* "No" requires the detail to be **verifiably unknown to the medium** AND **highly specific/obscure** AND **independently corroborated**.  
     - *Scruples Preserved:* Distinguishes "occurrence" (something happened) from "interpretation" (what it means).  
     - *Usability Simplification:* Allows judgment on "plausibility" (e.g., a common name vs. a unique nickname).  
     - *If "Yes":** Stop. Reject or classify as "Inconclusive." Do not publish as evidence.  
     - *If "No":** Proceed to Q3.  

  3. **IS THE PHENOMENON STATISTICALLY OR ANECDOTALLY SIGNIFICANT?**  
     - *Ask:* Does this event, *in context*, rise above random chance or vague generality?  
     - *Sufficient Answer:* For experiments (e.g., card-guessing): Results must exceed chance expectation *consistently* under controls. For anecdotes: Details must be **multiple, precise, and collaboratively verified** (e.g., 3+ specific names, dates, or physical descriptions).  
     - *Scruples Preserved:* Separates "interesting anomaly" from "evidence."  
     - *Usability Simplification:* Anecdotal "significance" is subjective; relies on protagonist’s calibrated skepticism.  
     - *If "No":** Stop. Label "Inconclusive." Do not publish.  
     - *If "Yes":** Proceed to Q4.  

  4. **DOES THIS POINT TO TELEPATHY OR SURVIVAL?**  
     - *Ask:* Could the phenomenon be explained by **thought-transference between the living** (telepathy)? Or does it *require* a discarnate intelligence?  
     - *Sufficient Answer for Survival:* Requires **information unknown to any living person present** OR **a mannerism/habit unique to the deceased** that the medium couldn’t plausibly mimic via telepathy.  
     - *Scruples Preserved:* Sidgwick’s core distinction. Telepathy is a "less extraordinary" explanation than survival.  
     - *Usability Simplification:* Accepts that the line is blurry; relies on the protagonist’s knowledge of sitters and the deceased.  
     - *If "Telepathy":** Publish as evidence for *supernormal cognition*, **not survival**.  
     - *If "Survival" or "Unclear":** Proceed to Q5.  

  5. **IS THIS WORTH STAKING THE SOCIETY’S CREDIBILITY ON?**  
     - *Ask:* Even if all prior answers suggest survival, is the evidence *robust enough* to risk the SPR’s reputation?  
     - *Sufficient Answer:* "Yes" requires **multiple unimpeachable witnesses**, **replication across sittings/mediums**, and **zero unresolved red flags**.  
     - *Scruples Preserved:* Institutional caution; science demands extraordinary proof for extraordinary claims.  
     - *Usability Simplification:* A judgment call, but framed by Sidgwick’s duty to the SPR.  
     - *If "No":** Publish as "Highly Suggestive But Inconclusive" or withhold.  
     - *If "Yes":** Publish with caveats.  

  ---

  ### **What the Procedure CANNOT Do**  
  - **License Belief:** It can only classify evidence as "suggestive," "inconclusive," or "fraudulent." Belief is a personal choice *outside* the procedure.  
  - **Resolve Hope:** His longing for survival is a *bias to acknowledge*, not evidence to weigh. The procedure flags this conflict but doesn’t resolve it.  
  - **Prove Negatives:** It can’t *disprove* survival; it can only fail to validate specific claims.  
  - **Replace Judgment:** Q3 (Significance) and Q5 (Credibility Risk) are inherently subjective. The procedure structures, not eliminates, doubt.  

  ---

  ### **Case Applications**  

  **CASE 1: Private Séance (Uncontrolled; Specific Detail)**  
  - Q1 (Fraud?): **YES.** No controls → high opportunity for fraud/cues.  
  - *Decision:* **REJECT.** Do not publish. *Why it misfires:* It might discard genuine phenomena due to bad methodology, but Sidgwick prioritizes controls.  

  **CASE 2: Controlled Card-Guessing (Above Chance)**  
  - Q1 (Fraud?): **NO.** Rigorous controls in place.  
  - Q2 (Normal Means?): **NO.** Chance statistically exceeded.  
  - Q3 (Significant?): **YES.** Results are non-random.  
  - Q4 (Telepathy or Survival?): **TELEPATHY.** Cards involve living sender/receiver.  
  - Q5 (Credibility Risk?): **YES (for telepathy).** Publish in *Proceedings* as evidence for supernormal cognition.  
  - *The Unwanted Verdict:* **It refuses to call this "evidence for survival."** Telepathy is the simpler explanation. Your protagonist *cannot* use this to comfort his bereaved friend.  

  **CASE 3: Suspected Fraud (No Proof)**  
  - Q1 (Fraud?): **YES.** Red flags (e.g., medium insists on darkness, muffled sounds, prior fraud allegations). Lack of proof ≠ proof of innocence.  
  - *Decision:* **REJECT.** Do not publish. *Judgment Call Dressed Up:* "Plausible opportunity" is subjective, but Sidgwick would err on the side of caution.  

  ---

  ### **Where the Procedure Fails Your Protagonist**  
  Your ending likely requires him to *want* to believe a case Q4 labels "Unclear" or "Telepathy." The procedure will **never** give him a "Survival: Confirmed" verdict. At best, it might reach Q5 and deem a case "Worthy of Publication" as *suggestive*—but it will demand caveats, emphasize telepathy, and deny certainty.  

  **His Dilemma:** When the procedure returns "Inconclusive" or "Telepathy" on a case that feels spiritually resonant, he must decide:  
  - Does he override it (betraying his empiricism)?  
  - Does he cling to it (betraying his hope)?  
  - Does he acknowledge the limit: *"This method cannot answer my deepest question"*?  

  **Sidgwick’s Real Conclusion Mirrored:** The procedure can validate *phenomena* (telepathy) but not *interpretation* (survival). Your protagonist’s tragic honesty lies in applying the method perfectly—and still facing silence on the question that matters most.  

  ---  
  **Final Note:** This framework forces him to confront the gap between evidence and meaning. His "honest arrival at caution" comes from repeatedly seeing cases fail at Q4 (Telepathy vs. Survival) or Q5 (Credibility). The procedure’s rigidity protects the SPR—and isolates him from the comfort he seeks. Use its failures to fuel his character arc.
