prompt: |-
  Got into a long argument with a friend last night about humanitarian intervention — Kosovo, Iraq, Libya — and we kept going in cirles about something we couldn't quite name. Here's the thing that bugs me. In practice we treat Security Council authorization as what makes an intervention legitimate. Kosovo in 99 had no authorization and everyone sort of shrugged and said it was the right call anyway, just not legal; Iraq in 03 had none and we treated the lack as basically damning; Libya in 2011 had the resolution, so it got a legitimacy pass even after NATO clearly blew past what the resolution actually authorized. So what does that whole pattern presuppose about legitimacy — that it comes from being signed off by the right body, or from the intervention actually being morally justified, or some hybrid of the two? Can it even be consistent to hold that Kosovo was fine despite being unauthorized and that Iraq wasn't fine partly because it was unauthorized? And my friend wants to scrap authorization altogether and ask instead whether the people being rescued would have consented if you could ask them. Does that rest on a different theory, and does it actually resolve the Kosovo/Iraq/Libya mess or just relocate it? I want the implicit theory spelled out, which rival views it quietly rules out, and where the practice is just underdetermined — like, would other theories license the exact same record?
reasoning: |-
  Okay, the user is grappling with the tension between legal legitimacy (Security Council authorization) and moral legitimacy in humanitarian interventions, using Kosovo, Iraq, and Libya as case studies. They’re frustrated by inconsistent application of these standards and suspect there’s an unspoken theory beneath the practice. Their friend’s "hypothetical consent" alternative also needs evaluation.  

  First, I need to map the contradictions they highlighted: Kosovo (illegal but morally accepted), Iraq (illegal and condemned), Libya (legal initially but exceeded mandate, yet still deemed legitimate). This inconsistency suggests practice isn’t purely legal or moral but a messy hybrid.  

  The core question is: *What implicit theory of legitimacy explains this pattern?* The user wants it "spelled out," including what it rules out and whether it’s coherent. They also want to test if their friend’s consent-based alternative resolves the inconsistencies.  

  Breaking it down:  
  1. **The implicit hybrid theory**: State practice treats SC authorization as necessary but not sufficient. Kosovo’s acceptance implies legality isn’t absolute—if consequences are good (successful intervention, no chaos), illegality is forgiven. Conversely, Iraq’s bad outcome retroactively condemned the illegality. Libya got a pass initially because of authorization, and excesses were overlooked since the regime fell quickly. This is *consequentialist*: legitimacy hinges on outcomes + procedure. But it’s circular: we only know if it was "right" after the fact.  
  2. **Coherence check**: Can Kosovo be "fine" (unauthorized) and Iraq "not fine" (unauthorized) without hypocrisy? Only if we smuggled in moral criteria (e.g., Kosovo had clearer humanitarian grounds, no WMD lies). But that undermines the primacy of legality. The pattern isn’t consistent—it’s ad hoc, relying on post-hoc moral judgments.  
  3. **Friend’s consent theory**: Hypothetical consent of the oppressed as sole criterion. This has theoretical appeal (rooted in autonomy) but practical flaws: How do we gauge consent without bias? Would Kosovar Albanians "consent" to NATO? Yes. Iraqis in 2003? Maybe not, foreseeing insurgency. Libyans? Initially yes, but post-Gaddafi chaos complicates it. This doesn’t resolve the mess; it shifts the debate to unverifiable claims about local will. It also ignores strategic realities (e.g., intervention enabling jihadist groups in Libya).  
  4. **Underdetermination**: The real issue is that *no* theory cleanly explains the cases because practice is driven by power politics. Russia/China blocked Kosovo authorization; US/UK bypassed SC for Iraq; Libya had authorization because Gaddafi had few allies. The "hybrid" theory is a cover for geopolitical convenience. Alternative theories (e.g., strict legalism, pure consequentialism) would *not* produce the same record—e.g., strict legalists would condemn Kosovo; pure consequentialists might approve Iraq if it succeeded.  

  User’s deeper need: They sense the "rules-based order" is a façade and want clarity on whether legitimacy can be systematized. The answer is bleak: the pattern reflects power, not principle. Their friend’s theory is noble but equally manipulable. The underdetermined gap is between ideals and realpolitik—and that’s where the frustration lives.
answer: |-
  Your frustration captures the core tension in humanitarian intervention: **the clash between legal legitimacy (Security Council authorization) and moral legitimacy (just cause/outcome)**. The pattern you describe reveals an *implicit hybrid theory* that dominates state practice, but it's riddled with contradictions. Let's dissect it:

  ### The Implicit Hybrid Theory in Practice
  1. **Authorization as Necessary but Insufficient**: 
     - Security Council approval is treated as the *baseline requirement* for legitimacy (e.g., Libya 2011). Without it, interventions are presumptively illegitimate (Iraq 2003).
     - **But**: Kosovo 1999 shows authorization isn't *absolutely* necessary. When an intervention is widely seen as morally urgent (stopping ethnic cleansing) and succeeds without chaos, the illegality is retroactively forgiven.

  2. **Moral Justification as Retroactive Validator**: 
     - If an intervention achieves its humanitarian goals *and* stabilizes the situation (Kosovo), its unauthorized nature is minimized. 
     - If it fails catastrophically (Iraq), the lack of authorization becomes a primary indictment.
     - **The contradiction**: Kosovo's "success" was partly luck (no protracted insurgency). Had Iraq discovered WMDs and stabilized quickly, its legitimacy might have been reassessed.

  3. **The "Good Enough" Hybrid**: 
     - Legitimacy = **Authorization + Plausible Moral Justification + Acceptable Outcomes**.
     - Libya fits: Authorization existed (UNSC Resolution 1973), the cause (stopping Benghazi massacre) was clear, and the quick fall of Gaddafi initially masked mandate overreach. Outcomes were overlooked until later chaos.

  ### Why This Hybrid Is Inconsistent
  - **Kosovo vs. Iraq**: Holding both views *is* inconsistent if authorization is non-negotiable. The hybrid resolves this by treating authorization as *procedurally primary* but morally secondary:  
    - Kosovo: Illegality overridden by **moral emergency + success**.  
    - Iraq: Illegality amplified by **dubious motives (WMDs) + catastrophic failure**.  
  - **Outcome Dependency**: This makes legitimacy hostage to consequences. If Libya had descended into Syria-level chaos immediately, Resolution 1973 would likely be deemed "illegitimate" retroactively.

  ### Your Friend's Consent Theory: A Different Approach
  Your friend proposes: **Legitimacy = Hypothetical Consent of the Affected Population**.  
  - **Theory**: Rooted in **democratic autonomy** or **self-determination**. If the persecuted would consent to rescue (even via force), intervention is justified.  
  - **Appeals**: Avoids Security Council politics and focuses on victims.  
  - **Problems**:  
    1. **Unverifiable**: How to gauge "consent" without manipulation? Polls in active conflict zones? Historical grievances?  
    2. **Ignores Strategic Realities**: Consent doesn't guarantee success (e.g., Libyans "consented" in 2011, but post-Gaddafi factions fought).  
    3. **Kosovo/Iraq/Libya Test**:  
       - Kosovo: Kosovar Albanians likely "consent."  
       - Iraq: Most Iraqis wouldn't have "consented" to 2003 invasion knowing the outcome.  
       - Libya: Mixed – initial consent in Benghazi, but would Libyans consent to a decade of civil war?  
    - **Verdict**: It *relocates* the debate but doesn't resolve it. Who speaks for "the people"? Consent theory struggles with long-term consequences and factional divides.

  ### What the Hybrid Theory Quietly Rules Out
  1. **Pure Legalism**: The Kosovo exception undermines the absolute necessity of UNSC approval.  
  2. **Pure Consequentialism**: Outcomes alone don’t suffice (e.g., Iraq’s removal of a tyrant was overshadowed by lack of authorization).  
  3. **Cosmopolitan Moralism**: If "saving strangers" is always justified when feasible, why does authorization matter at all?  

  ### Underdetermination: Where Practice Fails Theory
  - **The Real Pattern**: The cases align more with **great-power interests** than consistent principles:  
    - Kosovo: Russia/China would veto, but NATO acted (power > procedure).  
    - Iraq: US/UK bypassed UNSC after failing to convince allies (power *vs.* procedure).  
    - Libya: UNSC authorized because Russia/China abstained (Gaddafi had few allies).  
  - **Alternative Theories Could Yield the Same Record**:  
    - A strict **"Pragmatic Realism"** (intervene only when interests align) justifies all three cases identically to the hybrid.  
    - **Just War Theory** (jus ad bellum) *could* approve Kosovo (last resort, proportionality) and reject Iraq (false pretext), but Libya tests proportionality post-regime change.

  ### Conclusion: The Unstable Compromise
  The implicit theory is a **Consequentialist-Legal Hybrid**:  
  > *Authorization is the default legitimizer, but moral urgency or success can override its absence, while failure amplifies illegality.*  

  **Why it feels circular**: It relies on post-hoc judgments. Legitimacy becomes a narrative battle *after* the fact, not a principled standard. Kosovo "worked," so illegality faded; Iraq failed, so illegality was pivotal.  

  **Does consent theory help?** It centers victims but replaces legal ambiguity with empirical ambiguity. Neither theory escapes power politics: strong states intervene when they can (Kosovo), manufacture consent (Iraq's "liberation" narrative), or leverage authorization loopholes (Libya).  

  **The core problem**: Humanitarian intervention sits where **law, morality, and power collide**. No theory fully resolves this, because the practice is shaped by actors who prioritize sovereignty or interests when convenient. The pattern you see isn't logic—it's the messy reality of a system without enforceable rules.
