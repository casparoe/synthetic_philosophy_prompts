answer: |-
  ### The passage in its context  
  This reply addresses the *third objection* in Article 2 ("Whether sedition is always a mortal sin?"). The objection contends that disturbing a tyrannical government cannot be seditious because tyranny opposes the common good. Aquinas concedes this core point but denies its unconditional application. His reply qualifies the objection: disturbing tyranny **is not sedition** (contra the sin's definition) **provided** the disturbance does not inflict disproportionate harm. Crucially, he denies the objection’s implicit claim that *any* disturbance of tyranny is automatically licit or non-seditious. The reply thus refines the objection by adding a consequentialist caveat and redefining tyranny itself as seditious.

  ---

  ### What the reply does and does not license  
  Aquinas defines sedition narrowly: *discord among factions within a unified people*, requiring collective, factional strife. A lone assassin or small conspiracy lacks this "part-against-part" character; it is not sedition *by definition*. Consequently:  
  1. **The reply clears a definitional, not moral, obstacle**: Removing the "sedition" label does not automatically license tyrannicide or deposition. It merely states such acts (if solitary/factionless) fall outside *this specific sin*. They may still violate other precepts (e.g., murder, disobedience to *de facto* authority).  
  2. **"Disturbing" remains ambiguous but constrained**: It encompasses acts disrupting rule (revolt, deposition, assassination), but Aquinas refrains from endorsing any. The omission of agency ("*unless* disturbed inordinately...") implies all disturbances are morally evaluated by outcomes, not intrinsic legitimacy.  
  3. **Weight in resistance theory**: The passage negates a charge (sedition) that likely wouldn’t apply to discreet acts anyway. Its force lies in the *moral inversion* (tyranny as seditious) and the conditional allowance for disturbance—but this is not a blanket justification for rebellion. It shifts the burden to proving disproportionate harm, without specifying *who* may act or *how*.  

  ---

  ### The greater-harm proviso  
  This proviso functions as a **necessary condition for lawfulness**, transforming the concession into a strict utilitarian threshold:  
  - **Nature**: It is a genuine consequentialist restraint. Even against true tyranny, disturbance becomes immoral if it causes worse societal damage (e.g., civil war, anarchy, worse tyranny).  
  - **Judgment**: Aquinas implies a *public, prudential* assessment. The subjects ("*his subjects suffer*") experience the harm, but the judgment requires rational authority. Private individuals lack competence; Aquinas elsewhere reserves regime change to "public authority" (*De Regno* I.6). The proviso presumes an agent capable of weighing communal outcomes—likely a representative body or lesser magistrates, not the populace or isolated actors. God’s judgment applies only where no human remedy exists (*De Regno* I.6), making earthly prudence primary here.  

  ---

  ### The tyrant as the seditious party  
  Aquinas’s reversal ("*the tyrant rather that is guilty of sedition*") is a **theological redefinition**, not mere rhetoric. Tyranny, by subordinating the common good to private advantage, *constitutively* fosters discord and fractures the unity of the people. Thus:  
  - **Hard pressing is valid**: Tyrannical rule is *itself* an act of sedition because it systematically generates social enmity to sustain power. The tyrant is the true fomenter of part-against-part strife.  
  - **Moral, not legal, charge**: This labels the tyrant’s *sin*, not a civil crime. It reinforces why disturbing tyranny isn’t seditious—the tyrant has already violated the communal peace.  

  ---

  ### Squaring it with the treatise on kingship  
  The texts **do not conflict**; they address distinct questions:  
  - ***Summa* (II-II q.42)**: Focuses on the *definition and mortal sin-status* of sedition. It asks: "Is this act inherently seditious?" Answer: Not if against tyranny, unless disproportionate harm.  
  - ***De Regno***: Addresses *prudential action and agency* against tyranny. It asks: "How/when should one resist?" Answer: Endure moderate tyranny; avoid private violence; seek lawful authority or divine aid.  
  - **Reconciliation**: The *Summa*’s "no sedition" claim removes one *moral barrier* (the sin of sedition) for disturbances against tyranny. *De Regno* then imposes *further barriers*: the danger of worse outcomes (echoing the greater-harm proviso) and the illegitimacy of private action. *De Regno*’s caution applies precisely because disturbing tyranny *isn’t seditious but remains perilous*. The *Summa* defines the sin; *De Regno* governs the act.  

  ---

  ### Verdict on your reading  
  **Sound insights**:  
  - You correctly identify the narrowness of sedition (excluding lone actors) and the resulting limited force of "no sedition."  
  - Your suspicion that the reply "clears away a charge never laid" is astute: Aquinas is preemptively closing a loophole for tyranny.  
  - Spotting ambiguity in "disturbing" and tension with *De Regno* is textually grounded.  

  **Misplaced categories**:  
  - You import an anachronistic "resistance theory" expectation that Aquinas is licensing revolt. He is not; he is classifying sins.  
  - Conflating *moral classification* (is it sedition?) with *practical license* (may I assassinate?) obscures his layered approach. Sedition’s absence does not imply permission.  

  **Underdetermined elements**:  
  - "Disturbing" is genuinely open (assassination? revolt?). Aquinas avoids specificity, likely to cover all disruptions but leave them subject to the harm proviso.  
  - Agency ("who may act?") is unresolved here. *De Regno*’s restrictions on private persons answer this, but the *Summa*’s silence leaves a gap.  
  - The greater-harm judgment’s earthly authority is implied (public/prudential) but not defined—an intentional ambiguity given Aquinas’s hierarchical worldview.  

  **Conclusion**: Your framing is not confused but risks overestimating the passage’s permissiveness. Aquinas negates a specific sin while embedding disturbance within stringent moral-consequentialist bounds, leaving agency and method purposefully underdefined.
