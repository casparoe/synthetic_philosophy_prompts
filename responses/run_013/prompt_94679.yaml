  ## Commencement Address: Faith, Reason, and the Common Ground

  My dear graduates, esteemed faculty, proud families, and friends of St. Aloysius College,

  It is a profound honor to stand before you today. As one who walked these same paths, grappling with Aquinas in the library and debating justice late into the night, I see in your faces that same restless intellect and yearning for meaning that defines this remarkable place. St. Aloysius gave us something rare: a rigorous education deeply rooted in a particular tradition – the rich soil of Catholic intellectual life – yet committed to the unfettered pursuit of truth wherever it leads. That tension, that fruitful dialogue between faith and reason, is our inheritance. Today, as you step into a world far more complex and divided than any seminar room, the question becomes: How do you carry *both* – your deeply held convictions *and* your commitment to reasoned discourse – into the public square?

  This isn't just a personal puzzle; it's the central challenge of pluralistic democracies. We live amidst a breathtaking diversity of worldviews – religious, secular, philosophical. How do people who ground their deepest values in profoundly different places – perhaps Scripture, perhaps Kant, perhaps lived experience alone – build a society together? How do we deliberate, decide, and govern ourselves justly when our fundamental starting points seem irreconcilable?

  This brings me to the work of John Rawls, a thinker whose ideas on justice have shaped my own journey, and I believe, offer profound guidance for yours. Rawls asked: What principles would free and equal citizens, recognizing their profound differences, agree to live by? His answer hinges on the idea of **public reason**. Public reason isn't about silencing anyone's deepest beliefs. It's about recognizing the nature of the shared project we call a democratic society.

  Here’s the heart of it, the crucial proviso: **When we enter the formal arena of coercive political power – when we act as legislators, judges, public officials, or even as citizens voting on fundamental laws that bind everyone – we owe our fellow citizens reasons they can comprehend and engage with, even if they don't share our ultimate foundations.** These are "public reasons": arguments grounded in widely accepted political values (like liberty, equality, fairness, the common good) and accessible forms of evidence and logic, drawn from our shared political tradition and the realities of our common world.

  **This proviso bites hardest precisely in those formal spaces where the exercise of state power is most direct.** A judge ruling on a constitutional right, an official crafting binding policy, a legislator voting on a law – in these roles, grounding decisions solely in theological doctrine or private revelation fails the test of reciprocity. It asks others to be governed by reasons they cannot reasonably be expected to accept. It fractures the very basis of civic trust and mutual respect.

  But – and this is vital – Rawls carefully distinguished this *public political forum* from the vibrant **background culture** of civil society. This is where you live most of your lives! In your churches, your book clubs, your community associations, your families, your letters to the editor, your social media conversations – here, your religious convictions, your comprehensive worldviews, are not only welcome, they are essential. This is where moral arguments are formed, tested, and passionately advocated. Bring your whole self, your faith-informed perspective, your deepest convictions, vigorously into these spaces. Argue from Scripture, from natural law, from your tradition's wisdom. This is the furnace where public reason itself is forged and refined, as religious and secular voices alike translate their deepest commitments into arguments that can resonate across difference.

  **And yes – under the "wide view" of public reason Rawls later articulated – a citizen standing alone in the voting booth may, in good conscience and after deep reflection, cast a vote primarily motivated by her faith, provided she sincerely believes that public reasons, accessible to all, could also be offered to justify her position.** Faith can be the wellspring, the motivator, the source of conviction. But the citizen committed to public reason simultaneously acknowledges the *obligation* to seek and be prepared to offer those public justifications, to engage in that translation for the sake of the shared project.

  So, graduates, this is your charge as you leave St. Aloysius:

  1.  **Be Deeply Rooted:** Cherish and cultivate the traditions that sustain you. Draw strength and wisdom from your faith, your philosophy, your community. Let them shape your character and your vision of the good.
  2.  **Be Generously Engaged:** Step boldly into the background culture. Advocate passionately from your convictions. Listen deeply to those who start from different places. Engage in the moral argumentation that enriches our common life.
  3.  **Be Publicly Accountable:** When you step into the formal public forum – whether running for office, serving on a board, advocating for policy, or simply casting your vote – embrace the discipline of public reason. Seek justifications rooted in our shared political values and accessible evidence. This isn't abandoning your faith; it's honoring the dignity and equality of your fellow citizens. It’s recognizing that the power to bind others demands reasons *they* can grapple with.
  4.  **Be Bridge Builders:** You are uniquely equipped for this. Your education here, at the intersection of profound faith and fearless reason, has trained you to hold complexity, to translate across worlds, to seek understanding amidst difference. Use that skill. Be the ones who can speak authentically from your tradition *and* find the common language of justice and human dignity.

  The path isn't always easy. It demands intellectual honesty, moral courage, and deep respect. But it is the path of a robust citizenship worthy of a diverse democracy. It refuses the false choice between fervent conviction and civic responsibility. Instead, it asks you to carry the lamp of your deepest beliefs into the public square, not to blind others with its light, but to illuminate, alongside countless other lamps, the shared ground where we build a just society together – a society where faith informs reason, and reason respects faith, all in the service of the common good.

  Congratulations, Class of [Year]. Carry the spirit of St. Aloysius with you. Go forth and build that common ground. Thank you.

