prompt: |-
  At lab lunch two people in my group, Devi and Marcus, got into it about this desert lizard Devi's been reading about that has a weird flat paddle at the end of its tail. It went something like this.

  (1) Devi: it's clearly an adaptation. The paddle is a precise shape, it costs her drag at speed, and its dimensions line up with fast turning. Marcus: thats a just-so story. Complex and costly doesn't mean selected-for -- spandrels are complex and can be costly too. You're reading the cause off the usefulness, which is backwards. Gould and Lewontin's point was that the default move -- see a trait, assume selection, invent a function -- isn't testable, you can tell that story about anything.

  (2) Devi: but 'byproduct' is also a hypothesis and it has to do work. You have to name the developmental or phylogenetic thing the paddle falls out of. And if it just falls out of how the tail grows, then the close relatives that never turn fast should have the same paddle, and she says they don't -- the paddle tracks turning demand across populations, while the tail's overall length just tracks body size. That's the pattern you'd expect if turning was the pressure and the rest was constraint. Marcus: okay, thats a real point. But I start from 'byproduct' because the adaptationist default has a terrible track record -- every trait that sticks around gets a story, and the story is always told after the fact.

  (3) Devi: so then we're only arguing about defaults, not about whether you can ever infer adaptation. And your default is a bias too. I show you the paddle is costly and its width tracks turning speed, and you can still wave it off -- the cost is a constraint, the match is a coincidence. So the asymmetry you keep claiming isn't there. Marcus: there is a difference though. A selection story predicts something -- the thing is tuned to the job and should degrade when the job goes away. 'Byproduct' predicts nothing, it just says it came along for the ride. Only one of those is a research program.

  (4) Devi: and anyway, the fact that it's costly is basically proof of selection. Marcus: no -- cost is evidence against drift, it's not evidence for your particular function. Constraints are costly too. And before you say it, yes I know we can't do the manipulation experiment on a lizard we can't keep alive in the lab, but that dosen't mean we get to just assert the adaptation.

  I couldn't referee this at all. Can you go through it move by move -- who's right about what, where the actual crux is, and what they're both missing? Please don't just tell me 'adaptation is sometimes real and sometimes not,' thats not the question.
