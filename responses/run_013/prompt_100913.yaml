  Hmm, Devi's second move is actually strong. She forces Marcus to specify what developmental process would produce the paddle as a byproduct, and notes close relatives without turning behavior lack the paddle. That's testable comparative evidence. Marcus concedes this but falls back on adaptationism's bad track record - valid concern but not evidence against this specific case.

  The third exchange reveals a deeper philosophical split. Devi calls out Marcus' "byproduct default" as equally biased, while Marcus claims only adaptationist hypotheses generate testable predictions. But he's wrong here - byproduct hypotheses do make predictions (e.g., phylogenetic correlation, developmental linkage). 

