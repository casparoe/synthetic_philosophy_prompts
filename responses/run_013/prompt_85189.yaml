prompt: |-
  I run the data-visualisation desk at a county public health department — small team, me plus two designers, and we put out a pictorial "numbers page" every fortnight that goes into clinics, buses and school offices, in three languages. Our comms director signs off on everything and she is not a data person, so anything I hand her has to be defensible in one sentence. We've been fighting for a year about house style. Half the team wants our charts to look like the ones everyone else makes now: big numbers, a photo of a real person with a name and a face, a friendly mascot for the flu campaign, 3-D bars because they pop. I keep arguing we should be working in the spirit of Otto Neurath's picture language — ISOTYPE, the Vienna Method, whatever you want to call it — and I want to stop arguing from vibes and just have a procedure. Here's my reconstruction of the principles I'm actually trying to honour, from a history-of-science course I took years ago, so treat this as my summary and tell me where I've garbled it or where it's internally in tension: (1) a picture statement should be readable on its own, without a caption or a paragraph of text doing the explaining, so someone who reads none of our three languages can still get the claim off the page; (2) quantity is shown by repeating many identical small signs, each sign standing for the same amount, so the reader compares by counting rather than by eyeballing a length or an area; (3) the signs should be flat silhouettes with no perspective, no shading, no character — the same generic figure every time, because a sign is a unit and not a person, and any "characteristic" detail invites the reader to read individuality, mood or blame into a statistic; (4) nothing decorative that doesn't carry a quantity; (5) the whole page is meant to be read as one connected statement rather than a gallery of separate exhibits, and the order of the elements is part of the argument; and (6) it's for people who are not going to be talked at in technical language, so the pictorial statement is not a simplification of the real thing, it's a different and in some ways better instrument. I know there's something in Neurath about one sign sometimes standing for a round number of people rather than one, and about education being picture-first, but I can't reconstruct how those sit with (2) and (3), so flag that if it matters.

  What I need from you is a decision procedure my desk can actually run, in order, on any chart before it goes to sign-off: the questions to ask, what counts as a sufficient answer to each, which questions stop the chart with a no, and which ones hand the decision to a person because it's a question of values or of our audience and not of facts. Keep the constraints real — I have maybe twenty minutes per chart, my designers have no philosophy and no time to read Neurath, and the comms director will overrule me for anything that looks cold or that she thinks won't land with a councillor. Then run the procedure on three charts we're actually building: (a) lead screening rates by ZIP code, where the honest answer is that two of the twelve ZIPs have samples so small that the rates swing wildly year to year; (b) overdose deaths by year for the county, 2014 to now, where the most recent year in our smallest town is three deaths — small enough that one sign per death makes the picture look like nothing is happening and one sign per hundred rounds it to zero; and (c) our own favourite draft, a big page on the county's mental-health line with photos of four real callers, first names, and a quote from each, which the team loves and which I suspect the procedure is going to tell me to throw out. Say plainly where the procedure gives an answer I won't like, and where it can't decide and someone just has to own the call.
reasoning: |-
  Hmm, the user runs a small data visualization team for a county public health department. They're facing internal conflicts about chart design styles between modern "friendly" approaches and Otto Neurath's ISOTYPE principles. They need a practical decision procedure to evaluate charts before sign-off, under real constraints like limited time and non-technical stakeholders.

  The user has reconstructed Neurath's principles well: self-explanatory visuals, quantity through repetition of identical signs, flat silhouettes without personality, no decorative elements, cohesive narrative flow, and accessibility for non-technical audiences. The tension points they note are valid - especially how to handle small numbers without misleading abstraction.

  For the decision procedure, I'm considering a step-by-step checklist that can be implemented quickly. It should prioritize Neurath's core tenets while allowing compromises where principles conflict. Key filters would include: Can the visual stand alone? Does it avoid misleading abstraction? Are signs truly uniform? Does it respect data limitations? The procedure needs clear "no" gates but also "judgment call" flags where communicator input is needed.

  For the lead screening chart (a): Using ISOTYPE icons per ZIP would be problematic due to small sample sizes. Better to use neutral dots with clear sample size annotations. The overdose deaths chart (b): One icon per death risks stigmatization while rounding to zero is unethical. A multi-year trend line with disclaimer notes would be more honest. The mental health hotline piece (c): While powerful storytelling, the individual photos violate Neurath's depersonalization principle. Suggest anonymized silhouettes with quotes in uniform typefaces.

  The procedure must acknowledge political realities - sometimes the comms director will overrule. But having a documented rationale creates accountability. For true stalemates, suggest tagging "communicator judgment" decisions so leadership owns the call. The key is making the tradeoffs explicit rather than debating aesthetics.
answer: |-
  Here's a practical, step-by-step decision procedure based on Neurath's principles, designed for your real-world constraints (20 mins/chart, no philosophy background, comms director veto). It focuses on **actionable questions** with clear pass/fail gates or escalation points.

  **ISOTYPE-Inspired Chart Decision Procedure (v1.0)**

  Run these questions in order. Stop at any "NO" or "Escalate to Comms Dir." If you reach the end, the chart *minimally meets core principles*.

  1.  **Does the visual stand alone?**
      *   *Question:* Can someone who doesn't read any of the three languages understand the core claim (e.g., "Lead screening is lowest here," "Overdose deaths are rising," "Mental health calls are increasing") just by looking?
      *   *Sufficient Answer:* YES - Core message is visually unambiguous (e.g., cluster of icons in specific ZIP, upward trend line, large number of call icons). NO - Requires text to explain the main point.
      *   *Result:* **NO** = Stop. Redesign needed. (Violates Principle 1 & 6)
      *   *Reality Check:* This is the hardest bar. If it *almost* works but needs one word (like "UP"), compromise might be possible, but "NO" is strong.

  2.  **Is quantity represented accurately without misleading abstraction?**
      *   *Question:* Does the method of showing numbers *honestly* reflect the data's limitations (small samples, uncertainty)? Avoids implying false precision or hiding emptiness?
      *   *Sufficient Answer:* YES - Method chosen (repeated icons, scaled bar, dot plot) fits the data scale and variability. Uncertainty is acknowledged visually (e.g., faded icons, annotation, confidence intervals if simple) or explicitly via a *tiny* text note (e.g., "*Small sample"). NO - Visually distorts or hides data limitations (e.g., giant bars for tiny n, rounding small numbers to zero without note, showing volatile rates without context).
      *   *Result:* **NO** = Stop. Redesign needed. (Violates Principle 2 & 6). **Unclear/Marginal** = Escalate to Comms Dir. with clear note: *"Visual risks misrepresenting data uncertainty. Proceed?"*
      *   *Reality Check:* This is where statistical honesty clashes with "pop." Comms Dir. must own the risk of potential misinterpretation.

  3.  **Are signs truly uniform units?**
      *   *Question:* Are all icons representing the same thing (e.g., 1 person, 100 people, 1 screening) *identical, flat, non-descript silhouettes*? No individuality, shading, perspective, or "character"? No photos?
      *   *Sufficient Answer:* YES - All icons identical, simple silhouettes (stick figures, simple shapes). NO - Icons have unique features, expressions, shading, perspective, or are photos.
      *   *Result:* **NO** = Stop. Redesign needed. (Violates Principle 3 & 4). *Exception:* A single, *clearly symbolic* mascot (e.g., Flu Germ blob) *not* used as a counting unit might pass if isolated and non-distracting – **Escalate to Comms Dir.**
      *   *Reality Check:* Photos and "friendly" characters fail here. This is a core Neurath purity test.

  4.  **Is decoration strictly functional?**
      *   *Question:* Is every visual element *essential* for conveying the data or the standalone message? (Includes background images, complex gradients, 3D effects, purely decorative flourishes).
      *   *Sufficient Answer:* YES - Only data marks, essential labels, minimal layout elements (borders, gridlines if crucial). NO - Unnecessary images, complex textures, 3D bars/pies, purely decorative elements.
      *   *Result:* **NO** = Redesign needed. Remove non-functional elements. (Violates Principle 4).
      *   *Reality Check:* 3D bars fail. Background photos fail. "Popping" effects usually fail. This is straightforward to fix.

  5.  **Does the page tell a coherent story?**
      *   *Question:* Is there a clear visual flow guiding the reader through the key message(s)? Does the arrangement of elements (charts, text blocks, icons) logically build the argument?
      *   *Sufficient Answer:* YES - Layout has obvious starting point and logical progression (e.g., problem -> data -> solution; overall trend -> local detail). NO - Elements feel randomly placed; no narrative connection is visually apparent.
      *   *Result:* **NO** or **Unclear** = Needs layout revision. (Violates Principle 5). Not necessarily a full stop, but a required fix before sign-off.
      *   *Reality Check:* Easier to assess on the full page mockup than individual charts.

  **Applying the Procedure to Your Charts:**

  *   **Chart (a): Lead Screening Rates by ZIP Code**
      *   **Q1 (Standalone):** NO. Map/bar chart alone won't show volatility. Needs visual cue for uncertainty (e.g., different icon border for small n ZIPs, faded icons, dots sized by sample size *alongside* rate).
      *   **Result:** **STOP.** Redesign needed. Don't show volatile rates like stable ones. *Fix Idea:* Dot plot for each ZIP: X=Rate, Y=ZIP, Dot Size=Sample Size (with clear legend). Annotate small samples. Use uniform dot icons.

  *   **Chart (b): Overdose Deaths by Year (County & Small Town)**
      *   **Q1 (Standalone):** YES (Trend line = clear direction).
      *   **Q2 (Accurate Quantity):** **ESCALATE.** Small town (n=3) is the problem.
          *   *Option 1 (Strict):* One icon per death. Shows reality but might look "like nothing" vs. county. Risk: Minimizes tragedy?
          *   *Option 2 (Scale):* One icon = 1 death county-wide, but for the small town, show "3" as a number label *only* (no icon). Visually distinct, honest about scale. Add note: "*Each icon represents 1 death. Town X had 3 deaths in 2023."
          *   *Option 3 (Neurath Compromise):* Use a different, smaller icon for the small town (e.g., small dot=1 death), same icon for county (e.g., person=1 death). Shows difference in scale visually. *Crucially:* **Escalate these options to Comms Dir.** with the message: *"Showing 3 deaths honestly risks looking small; rounding hides impact. Which trade-off is acceptable?"*
      *   **Q3 (Uniform Signs):** YES (Assuming simple icons).
      *   **Q4 (Functional Decoration):** YES (Assuming clean chart).
      *   **Q5 (Coherent Story):** YES (Trend over time is clear).
      *   **Result:** **ESCALATE** after Q2. Comms Dir. must choose how to handle the small n representation.

  *   **Chart (c): Mental Health Line (Photos & Quotes)**
      *   **Q1 (Standalone):** YES. Message "People use and value this service" is clear from photos/quotes/big number.
      *   **Q2 (Accurate Quantity):** YES. Big number is clear. Photos/quotes are testimonials, not quantitative units.
      *   **Q3 (Uniform Signs):** **NO.** Photos are the definition of unique, individual, non-silhouette signs. They invite reading individuality/story *into the statistic*.
      *   **Result:** **STOP** at Q3. Violates core Principle 3. *Neurath Fix Idea:* Replace photos with identical silhouette icons next to anonymized quotes in a uniform font. Keep the big number. Layout showing "X calls helped people like..." with multiple identical icons + quotes. *Harsh Truth:* The procedure forces you to ditch the individual photos for generic icons. This is the "cold" look the Comms Dir. fears.

  **Where the Procedure is Harsh & Where it Compromises:**

  *   **You Won't Like:** It will kill the mental health line photos (c) and the 3D bars/"friendly" character mascots. It forces abstraction (silhouettes) over personalization.
  *   **Escalation is Key:** The procedure flags *where* the Neurath ideal clashes with communication goals (handling small numbers in (b), potentially the mascot exception). It doesn't decide those; it forces the Comms Dir. to explicitly own that decision *and its rationale* ("We accept the risk of X for benefit Y"). Document the decision.
  *   **"Cold" is Inevitable:** Neurath *is* visually austere. The procedure optimizes for universal readability and statistical honesty, not warmth. You'll need to argue that clarity *is* empathy when public health is at stake.
  *   **Strength:** It moves the debate from "vibes" (friendly vs. cold) to specific, defensible principles (Can a non-reader get it? Is the number honest? Are the icons generic units?). When the Comms Dir. overrules, she does so acknowledging *which* principle is being sacrificed and why.

  **Final Tip:** Frame the procedure to your team and Comms Dir. as a *quality control checklist for clarity and honesty*, not an aesthetic dogma. Emphasize Goals 1 (Universal Readability) and 2 (Honest Quantities) as the non-negotiables for public health comms. Use the escalation points strategically to involve leadership on the tough value calls. Good luck!
