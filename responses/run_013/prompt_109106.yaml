  Okay, the user is describing a specific pattern of arguments they keep having with relatives and others. They've noticed that in these disagreements, both sides have logically consistent arguments that only work if you accept their starting premise. Each accuses the other of circular reasoning - assuming the very thing being disputed - and both accusations are correct. 

  The user gives two clear examples: one about conflicting memories of a deal with their sister, and another about evaluating a scientific study at work. In both cases, the dispute reduces to which foundational claim gets treated as the baseline. Once you choose the starting point, the rest follows logically - but there's no neutral way to choose that starting point.

  They mention their wife thinks it's just stubbornness, but the user insists there's a deeper structural pattern here. They also recall something about responding to skeptics by pointing to one's hand as undeniable evidence, wondering if that's related.

  What they really want is:
  1) A precise name for this phenomenon (beyond just "circular reasoning")
  2) To understand its boundaries - when does this pattern start and stop being applicable?
  3) Whether it's different when one side actually has better evidence
  4) If it applies to internal debates too
  5) How this differs from ordinary factual disagreements

  Hmm... this is fascinating. The core issue is about epistemic justification - how we ground our beliefs. The user has intuitively grasped that some disagreements can't be resolved through normal argument because they stem from different "architectonic premises" (as philosophers might call them).

  The hand example they mention is likely G.E. Moore's "proof of an external world" - where Moore held up his hands to refute skepticism. That's similar in that it treats sensory evidence as foundational, but different because it's one person asserting a baseline against theoretical doubt, whereas the user describes mutual accusations of circularity between two people.

  For naming possibilities:
  - "Deep disagreement" (Fogelin) captures the irreconcilable starting points
  - "Epistemic circularity" specifically for justification loops
  - "Doxastic asymmetry" would be technically accurate but obscure
  - "Recursive justification failure" is descriptive but clunky

  The key boundaries seem to be:
  - When evidence exists but isn't recognized by both parties, it's not pure symmetry
  - When power dynamics force acceptance of one premise, the pattern breaks
  - In internal debates, it manifests as paralysis between competing frameworks

  This isn't just stubbornness - stubborn people dig in without structure. Here the structure creates the deadlock. And it differs from ordinary disagreement because in normal factual disputes, shared methods of verification exist.

  The most precise framing might be that these are disagreements where the burden of proof becomes unresolvable because any attempt to meet it relies on the very premise being challenged. That's why the mutual accusations of circularity are both valid and useless.

  For the user's practical needs, recognizing this pattern could help them avoid fruitless arguments by identifying when they're in this structural deadlock. The solution isn't more arguing but finding external evidence or agreeing to disagree.
answer: |-
  You've brilliantly dissected a fundamental epistemic trap, and yes, it absolutely has names and distinct boundaries. What you're describing is a specific form of **Deep Disagreement** or **Systematically Irresolvable Disagreement**, often characterized by **Epistemic Circularity** and **Recursive Justification Failure**.

  Here's the breakdown:

  1.  **Core Structure & Names:**
      *   **Mutually Supporting/Recursive Argument Structures:** Each argument relies on its own conclusion as a hidden or explicit premise for its starting point. Argument A assumes X to prove Y, but proving X *requires* assuming Y. The "airtightness" is conditional on accepting the contested starting point.
      *   **Epistemic Circularity (Mutual):** Both sides engage in circular reasoning *relative to each other*. Each side correctly points out the other's reliance on the contested premise ("You're assuming what you set out to prove!") but fails to see they are doing the exact same thing from the opposite foundation. The accusation is correct but impotent *because* it's mutual.
      *   **Clash of Doxastic Asymmetries:** Each participant treats their *own* foundational belief (memory, intuition, methodological principle) as having a privileged, axiomatic status ("This is just obviously true/primary") while denying that same status to their opponent's foundational belief ("*That* needs justification!").
      *   **Deep Disagreement (Robert Fogelin):** This is the most encompassing term. Fogelin argued that some disagreements occur at such a fundamental level – concerning the very rules of evidence, standards of proof, or basic presuppositions needed to evaluate claims – that they cannot be resolved through rational argument *within the shared framework*, because *there is no longer a shared framework*. Your "baseline" problem is precisely this.

  2.  **The Hand Example (G.E. Moore):**
      Moore's "Proof of an External World" (holding up his hands) is a **one-sided foundationalist move** against *global* skepticism. It asserts a basic perceptual belief as more certain than any skeptical argument. It's **related but distinct**:
      *   **Similarity:** It highlights starting points/baselines. Moore treats sensory evidence (his hand) as foundational, refusing to justify it against the skeptic's *universal* doubt.
      *   **Difference:** Your case is **symmetrical and adversarial**. *Both* parties are making foundational claims about specific contested events/conclusions. Moore is defending common sense against a theoretical position; you're describing two equally "common sense" (to each holder) but incompatible starting points clashing directly. Moore denies the skeptic's baseline (universal doubt); you have *two* competing baselines with no shared higher court.

  3.  **Edges and Boundaries:**
      *   **Ordinary Factual Disagreement:** This exists when parties *share* core methods/standards/baselines but interpret evidence differently. *E.g.,* Both agree memory is fallible but weigh corroborating details differently; both agree scientific method is sound but interpret statistical significance differently. Resolution is *theoretically* possible with more evidence or clearer application of shared rules. **Your phenomenon starts when disagreement infects the *evaluation standards* or *foundational inputs* themselves.**
      *   **One Side Has Better Evidence:** If one side *objectively* has better evidence accessible *within a shared framework* (e.g., a signed contract vs. memory; multiple replications vs. a single flawed study), it's **not** your phenomenon. Your phenomenon is defined by the *symmetry* of the recursive justification failure. If the evidence exists but one side *irrationally denies its validity*, it becomes a different issue (motivated reasoning, denialism).
      *   **Power/Authority Imposition:** If one side "wins" by fiat ("I'm the boss, we do it my way") or social pressure, it bypasses the epistemic deadlock through non-rational means. The deep disagreement persists but is suppressed.
      *   **Internal Conflict ("Torn"):** Absolutely applies! This is internalized deep disagreement. You have two competing internal narratives/frameworks ("Did I say 50/50? Did she write 60/40? Which memory is reliable?"). Each feels foundational when held, but they conflict. Paralysis arises because you can't simultaneously adopt both baselines to judge between them. It manifests as cognitive dissonance or inability to decide.
      *   **Where it Stops Being Special:** It blends into ordinary disagreement when:
          *   A genuinely neutral arbiter or piece of evidence breaks the symmetry (e.g., finding the napkin, an independent meta-study).
          *   The parties can *agree* on a higher-level standard to evaluate the baselines (e.g., "Whose memory is *generally* more reliable?" - though this risks restarting the cycle!).
          *   The disagreement shifts away from the contested baseline to *how to resolve disagreements of this type* (e.g., agreeing to flip a coin, compromise, or disengage).

  4.  **Why "Stubborn" Doesn't Capture It:**
      Stubbornness is a *psychological* state (refusal to change one's mind). Your phenomenon is an *epistemological* structure. Stubborn people *can* be engaged in ordinary disagreement. People trapped in this recursive structure *can be trying sincerely to reason* but find themselves logically cornered by the symmetry. The structure *creates* the stalemate; stubbornness might keep them *in* it longer, but it's not the cause.

  **In Summary:**

  You've identified **Symmetrical Deep Disagreement characterized by Mutual Epistemic Circularity/Recursive Justification Failure.** It arises when:
  1.  A dispute hinges on which of two incompatible propositions (P1 or P2) is treated as the foundational, unjustified starting point.
  2.  Proving P1 requires assuming P1 (or something dependent on P1), and proving P2 requires assuming P2.
  3.  Any argument from one baseline *against* the other baseline inevitably relies on the arguer's own baseline, making the accusation of circularity mutual and futile.
  4.  There is no shared, uncontested higher-level framework or evidence to adjudicate between P1 and P2.

  **Recognizing this pattern is powerful.** It signals that *more arguing along the same lines is futile*. Solutions require stepping *outside* the recursive loop: seeking truly independent evidence, agreeing on a resolution mechanism (compromise, coin flip, authority), explicitly acknowledging the deep disagreement and agreeing to disagree, or shifting the conversation to *how to avoid such traps in the future* (e.g., writing things down, pre-agreeing on evaluation criteria).
