prompt: |-
  I lurk on LessWrong and read the Sequences years ago, so I can follow this kind of argument in shape but not in detail, and last week two people at our local meetup got into it about accuracy-first epistemology and I've been chewing on it ever since. I'm outsourcing the referee job.

  Roughly how it went:

  (1) Owen opened by saying the accuracy-first program basically settles what's wrong with incoherent credences. The way he told it: the only thing that makes a credence good or bad is how close it is to the truth, and once you fix any reasonable scoring rule for that closeness, it's a theorem that any set of credences that breaks the probability axioms is accuracy-dominated -- there's some coherent alternative that scores better no matter how the world turns out, at least in the usual finite cases. So probabilism gets justified without smuggling in extra assumptions about what you ought to believe.

  (2) Nina said she likes the theorem but thinks its being oversold. Her line: dominance only ever tells you "don't be incoherent." It never tells you what to actually believe -- it's silent on contents. So as a foundation it's weirdly empty; it explains why you shouldn't be a certain kind of irrational, but not why you should believe anything in particular.

  (3) Owen said that's fine and not a bug -- nobody claimed accuracy-first generates contents; the contents come from your evidence, and the framework's job is to explain the norms, not the inputs. And the norm it does explain is non-trivial: coherence is required no matter what your priors or goals are, so long as you care about accuracy at all.

  (4) Nina jumped on that last clause: "so long as you care about accuracy" is doing all the work. Why should accuracy be the only thing you care about, epistemically? She gave an example -- someone who cares more about having an explanation, or a settled picture of the world, or just understanding a thing, than about maximizing expected accuracy, isn't obviously irrational. Owen said if you don't care about accuracy you're not really in the business of believing at all, and that understanding and explanation are downstream of getting things right anyway.

  (5) Then Nina raised another one. She said accuracy-first treats true and false symmetrically -- a scoring rule just measures distance from the truth, so missing a truth and believing a falsehood get penalized in the same currency. But that's not how we actually reason, she says: we're often way more worried about not believing false things than about not missing true ones, and that asymmetry looks like a real epistemic value the framework can't even represent, let alone justify.

  (6) Owen's reply: the asymmetry isn't part of accuracy, it's a further fact about how you weight different kinds of error, and you can just build it in by picking a scoring rule that penalizes falsehood more heavily -- so the framework has room for it. Nina said that proves her point: if the asymmetry only shows up once you choose a scoring rule to encode it, then it isn't derived from accuracy-first, it's an extra assumption you fed in, and now you owe us a story about why that assumption is right. He said every normative theory has primitives, so that's not a special problem.

  They both turned to me and I had nothing. Can you go through moves (1)-(6) and rate each one from clearly mistaken to clearly right, saying what each of them is getting right and where each overreaches? And then the part I actually care about: is there a version of accuracy-first that survives Nina's symmetry complaint without just stipulating the asymmetry up front, or does the framework have to give up on being the whole story and become one epistemic value among several? Please write in American English.
reasoning: |-
  Okay, the user is recounting a debate between Owen and Nina about accuracy-first epistemology. Owen defends it as a foundation for probabilistic coherence, while Nina criticizes it for being empty and unable to handle epistemic asymmetries. The user wants an analysis of each move and whether accuracy-first can address the symmetry complaint without ad-hoc fixes.

  First, I need to unpack the key arguments. Owen's point about dominance arguments justifying coherence without extra assumptions seems solid—it's a standard result in scoring rule literature. But Nina's emptiness critique has merit too; dominance only rules out incoherence, it doesn't generate content. That's not a flaw per se, but it shows the framework's limits.

  The "caring about accuracy" premise is indeed the linchpin. If someone rejects accuracy as the sole epistemic good, the whole justification crumbles. Owen's response feels question-begging—dismissing alternative epistemic values as "not believing" seems uncharitable. 

  Nina's symmetry point is the most interesting. While Owen is technically correct that asymmetric scoring rules exist, that doesn't solve the normative problem. Why should we choose one asymmetry over another? The framework provides tools but no justification for preferring false-avoidance over truth-seeking. 

  For the user's core question: no, accuracy-first can't derive the asymmetry from first principles. The best it can do is accommodate it through scoring rules, but that requires importing external values. That doesn't make it useless—it still successfully grounds coherence norms—but it can't be the whole story. 

  The user seems philosophically sophisticated but time-poor (outsourcing referee duty). They're likely looking for clarity on whether this framework can deliver foundational justification or if pluralism is inevitable. I should emphasize that accuracy-first remains valuable for specific purposes while acknowledging its limitations.
answer: |-
  Here's a breakdown of each move, ratings, and a resolution to your core question:

  ### Move-by-Move Analysis
  1.  **Owen (Accuracy-First Settles Incoherence):**
      *   **Rating: Clearly Right (in the narrow claim).**
      *   **What's Right:** Owen accurately summarizes a core achievement of the accuracy-first program. The dominance theorems (like the classic one using the Brier score) are mathematically sound. If you value *only* closeness to truth (accuracy) as measured by a "proper scoring rule," and you have finite possibilities, then violating probability axioms *guarantees* there exists a coherent credence function that is more accurate *no matter what the truth turns out to be*. This *does* provide a powerful, non-question-begging justification for probabilism based purely on the instrumental goal of accuracy.
      *   **Overreach:** The claim that "the only thing that makes a credence good or bad is how close it is to the truth" is presented as a premise, not a conclusion. This is the core assumption Nina later challenges.

  2.  **Nina (The Framework is Empty):**
      *   **Rating: Partly Right, Partly Mistaken.**
      *   **What's Right:** Nina correctly identifies a *limitation*. Dominance arguments are purely *negative* norms ("don't be incoherent"). They don't tell you *which specific* coherent credences to adopt (e.g., what prior to have, how strongly to believe P given evidence E). The framework doesn't generate content from nothing; you need evidence, priors, updating rules (like conditionalization, which also has accuracy-based justifications).
      *   **Overreach/Mistake:** Calling the foundation "weirdly empty" overreaches. Explaining a fundamental structural norm (coherence) without smuggling in contestable content *is* a significant achievement, even if it doesn't solve *every* epistemic problem. Its job *is* to explain norms for structuring beliefs, not the source of the beliefs themselves. Owen correctly rebuts this.

  3.  **Owen (Framework Explains Norms, Not Inputs):**
      *   **Rating: Clearly Right.**
      *   **Why:** Owen perfectly clarifies the scope. Accuracy-first aims to justify *structural rationality norms* (like probabilism, conditionalization) based on the instrumental value of accuracy. It doesn't (and doesn't claim to) generate the *inputs* (evidence, priors). Its strength is showing that *whatever* your evidence/priors, coherence is instrumentally valuable for accuracy. This is a non-trivial, general justification applicable to any agent valuing accuracy.

  4.  **Nina ("Caring About Accuracy" is Loaded) / Owen (Without Accuracy, Not Believing):**
      *   **Nina's Rating: Clearly Right (on the challenge).**
      *   **What's Right:** Nina lands a crucial blow. The entire dominance argument *hinges* on the agent valuing *only* accuracy (as measured by the scoring rule). If an agent has other fundamental epistemic values (e.g., explanatory power, simplicity, understanding, avoiding specific falsehoods more than missing truths) that sometimes *conflict* with pure accuracy, the dominance argument loses its force *for that agent*. Such an agent might rationally choose incoherence if it better served their *broader* epistemic goals. The framework assumes its foundational value.
      *   **Owen's Rating: Questionable/Debatable.**
      *   **What's Right:** Owen points out that "belief" is typically understood as aiming at truth/accuracy. If you utterly don't care, it *might* not be "belief" in the standard sense.
      *   **Overreach/Mistake:** Dismissing alternative epistemic values as "not really believing" is circular and dogmatic. It begs the question against Nina. People clearly value understanding, explanation, simplicity *as epistemic goods*, sometimes trading them against marginal accuracy gains. Whether these are *reducible* to accuracy is a deep question Owen doesn't engage with; he just asserts they are "downstream." This doesn't address Nina's challenge that they might be *fundamental* values for some agents.

  5.  **Nina (Symmetry Complaint):**
      *   **Rating: Clearly Right (on the observation).**
      *   **What's Right:** Nina identifies a significant potential disconnect between the symmetric nature of standard accuracy measures (like Brier score or logarithmic score) and common epistemic intuitions/asymmetries. The aversion to believing falsehoods (avoiding "Type I errors" in some contexts) often feels *stronger* than the desire to believe truths (avoiding "Type II errors"). Standard symmetric scoring rules treat these errors equivalently in their "currency." The framework, by treating truth and falsity symmetrically in its core measure, doesn't naturally capture or justify this asymmetry.

  6.  **Owen (Build Asymmetry into Scoring Rule) / Nina (That Proves My Point):**
      *   **Owen's Rating: Technically Right but Misses the Point.**
      *   **What's Right:** Owen is technically correct. You *can* define asymmetric proper scoring rules that penalize false positives (believing falsehoods) more heavily than false negatives (missing truths). The framework *can accommodate* the asymmetry.
      *   **Overreach/Mistake:** He misses Nina's deeper normative point. The framework *allows* the asymmetry, but it doesn't *justify* it or *derive* it from the core accuracy-first premise. *Why* should we use an asymmetric rule? The justification for *that specific choice* of scoring rule must come from *outside* the accuracy-first framework itself – from the very asymmetry in epistemic value that Nina is highlighting. The framework provides tools but doesn't explain *why* one tool (asymmetric) is better than another (symmetric) for pure epistemic purposes.
      *   **Nina's Rating: Clearly Right.**
      *   **Why:** Nina correctly identifies that Owen's solution concedes her core point. Accommodating the asymmetry *requires* introducing it as an additional, external assumption ("use *this* scoring rule that weights errors asymmetrically") rather than deriving it from the fundamental commitment to accuracy alone. The asymmetric weighting is an *extra epistemic value* (avoiding falsehoods matters more than scooping up truths) fed into the system. Owen's "primitives" defense is weak here – the *choice* of which primitive scoring rule to use now needs justification, and accuracy-first doesn't provide it, suggesting the framework isn't sufficient alone.

  ### Addressing Your Core Question: Symmetry and the Fate of Accuracy-First

  Nina's symmetry complaint is strong, and Owen's technical response doesn't fully resolve it. Here's the breakdown:

  1.  **The Framework Cannot *Derive* the Asymmetry:** Accuracy-first, starting from the bare concept of "closeness to truth" and using dominance arguments, fundamentally treats truth and falsity symmetrically. The core mathematical results (dominance of coherence) work with symmetric scoring rules. There's no *internal* accuracy-first logic that forces you to care more about avoiding falsehoods than missing truths. That asymmetry must be *stipulated* by choosing an asymmetric scoring rule.
  2.  **Can It *Survive* Without Stipulation? Only as a Partial Story:** Accuracy-first can't be the *whole* story if we accept the asymmetry Nina identifies as a fundamental epistemic value. To handle it, you *must* either:
      *   **Stipulate the Asymmetry Up Front:** Build it into your chosen scoring rule. But then you've added an extra, unjustified (within the framework) epistemic value. Accuracy-first becomes the engine for deriving norms *conditional* on your chosen measure of "accuracy," but the choice of measure itself needs external justification.
      *   **Deny the Asymmetry is Fundamental:** Argue (like Owen hinted) that the *apparent* asymmetry (e.g., aversion to falsehoods) is really just a pragmatic concern, a consequence of Bayesian updating with realistic evidence/priors, or ultimately reducible to pure accuracy in the long run. This is a defensible but challenging route requiring significant additional argument.
      *   **Embrace Epistemic Value Pluralism:** Accept that accuracy (closeness to truth) is *one* fundamental epistemic good, but there are others (like avoiding believing falsehoods, explanatory power, understanding). Accuracy-first provides powerful justifications for structural norms *conditional* on valuing accuracy, but it cannot subsume or derive the other values. The framework becomes a crucial *part* of the epistemological story, explaining coherence and updating for agents who value accuracy, but it must coexist with other values that might sometimes override it or require modifying the "accuracy" measure.

  **Conclusion:** Nina's symmetry complaint highlights a genuine limitation. Accuracy-first cannot derive the truth/falsity asymmetry from its core premises; it can only accommodate it by introducing it externally through the choice of scoring rule. This doesn't make the framework useless or wrong – its justification for probabilism and conditionalization based on accuracy-dominance remains a major achievement. However, it forces us to recognize that **the framework cannot be the *sole* foundation for all epistemic norms.** It excels at justifying structural norms *given* a commitment to accuracy as *a* (or *the*) core epistemic value, but the justification for *which* measure of accuracy to use (symmetric vs. asymmetric) and the potential existence of *other* fundamental epistemic values (like the asymmetry itself, or explanation) requires looking beyond the accuracy-first program. Epistemic value pluralism seems like the most honest response to Nina's challenge.
