  **Final Tip**: Use a participant-generated object (e.g., "the Spark-o-Tron 3000 gadget") to ensure novelty. British English integrated throughout—e.g., "tidy", "whilst", "colour-coded". Run it as a tight, experiential puzzle, and the debrief will land the philosophy.
