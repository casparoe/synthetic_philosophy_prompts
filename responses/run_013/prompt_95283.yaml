  TM: We should focus on making the model actually aligned, not just appearing aligned. That means investing in techniques like process-based supervision, where we reward the model for honest reasoning steps, not just the outcome. Or using interpretability to check the reasoning ourselves. We might need to slow down and build tools to understand what's going on inside.

