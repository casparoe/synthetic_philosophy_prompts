prompt: |-
  I run civic engagement for a mid-size city — I'm the person who gets handed things like "council wants a citizens' assembly on the transit budget" and has to make it real with six weeks, four staff, and a few hundred residents who mostly show up once. I've been auditing a seminar on Dewey and his account of inquiry is honestly the most useful thing I've encountered for this job, except it all sits at a level where I can't hand it to my facilitators or to the parks guy who's running the next one. So I need you to turn it into a procedure we can actually run. What I mean by Dewey here is the shape of the thing rather than the slogans: inquiry starts because a situation is genuinely indeterminate and not just because two factions disagree; the problem has to get stated before it can be solved, and stating it is already a move; proposals are ends-in-view that get revised by the consequences they produce when acted on; a claim is warranted relative to an inquiry that has actually been carried through, not in the abstract; a public comes into being around the indirect consequences of transactions it didn't choose, and democracy is mostly about making those consequences communicable to the people absorbing them. I want all of that operationalized for people with no philosophy training.

  Fix the role and the constraints properly: we do one of these cycles every month or so, each one lands on a real budget line or a real bylaw change that council votes on, so the stakes are things like whether a corridor gets cameras or a route goes fare-free. We can't run a controlled trial — the pilot is the policy, it happens once, and the people who eat the downside didn't consent to being in the study. Our report has to be publishable and the council has to not be able to shrug it off. So: the questions to ask in order, what counts as a sufficient answer at each step, how we tell an indeterminate situation from a straight conflict of interest (because I suspect half our cycles are the second thing dressed as the first, and Dewey's method would have us doing something else entirely there), how we turn a felt grievance into a stated problem without letting the loudest party write it, how we convert a proposal into a hypothesis with predicted consequences and a named test, how we decide who bears the risk of a failed experiment and whether they can consent, and the points where the procedure should stop and hand the call to a person because the question is values and not method. Mark honestly which steps are judgment calls dressed up as method — I'd rather my facilitators know where they're improvising.

  Then run it on three cases and don't spare me: (1) a pilot of automated speed cameras on a corridor where the crash data is contested and the neighbourhood association and the delivery companies want opposite things; (2) a fare-free bus pilot on two routes, which I personally believe in and have been quietly lobbying for; (3) a bylaw banning phones in middle schools, where the parents asking for it and the students affected are obviously not the same public. At least one of these should come out with the procedure telling me not to do the thing I want, and I want to see the step where that happens. Give it back to me as JSON, one object, with these fields: "procedure", an array where each element has "step" (number), "name" (short), "question" (the thing we literally ask), "what_counts_as_answered" (the standard, in plain language), "if_it_fails" (what we do instead of pushing on), "who_decides" (either "procedure" or "person"), and "judgment_hidden_here" (say what we're really deciding when we answer this step, or null if it's genuinely mechanical); "worked_cases", an array where each element has "case", "steps_that_decide_it" (array of step numbers), "outcome", "asker_will_like_it" (yes or no), and "why"; "stop_conditions", an array of plain-language conditions under which we abandon the inquiry entirely; and "cannot_do", an array of the things this procedure will reliably get wrong. Keep the Dewey vocabulary only where it earns its keep — if a term isn't doing work for a facilitator, cut it and say the ordinary thing instead.
reasoning: |-
  We are operationalizing Dewey's account of inquiry for civic engagement in a mid-size city. The constraints are:
   - Time: 6 weeks, 4 staff, a few hundred residents who mostly show up once.
   - Output: A report that leads to a real decision (budget line or bylaw change) that council votes on.
   - Cannot run controlled trials; the pilot is the policy and happens once, and those affected by downsides didn't consent to being in a study.

   The procedure must account for:
     - Starting from an indeterminate situation (not just a conflict of interest).
     - Stating the problem as a crucial step.
     - Proposals as ends-in-view that are revised by their consequences.
     - Warranted claims from actual inquiry, not abstract.
     - Public forming around indirect consequences.

   We need to turn this into a step-by-step procedure with:
     - Steps (with number, name, question, what counts as answered, if it fails, who decides, and whether judgment is hidden).
     - Worked cases (three: speed cameras, fare-free buses, phone ban) with steps that decide, outcome, whether the asker (me) likes it, and why.
     - Stop conditions (when to abandon the inquiry).
     - What this procedure cannot do.

   We must mark where judgment is involved and be honest about when we are improvising.

   Let's break down the procedure into steps:

   Step 1: Determine if the situation is indeterminate.
     - Question: "Is the situation genuinely indeterminate? That is, are we facing a problem where the facts and values are so unclear that we don't even know what the problem is, or is it a conflict between clear interests?"
     - What counts as answered: We have evidence that the situation is not just a conflict of known interests but one where the facts, values, and possible solutions are all unclear and require inquiry. We must show that the current state of affairs is broken and not just contested.
     - If it fails: If it's just a conflict of interest, then we don't run a citizens' assembly. Instead, we might run a mediation or negotiation process, or hand it back to council with a note that it's a conflict of interest and not an indeterminate situation.
     - Who decides: Person (facilitator, with input from initial stakeholder interviews and data review).
     - Judgment: The facilitator must judge whether the issue is one of conflicting interests (which are clear and known) versus a truly indeterminate situation (where even the problem is not clear). This is a judgment call.

   Step 2: Identify the affected public(s).
     - Question: "Who is affected by the indirect consequences of this situation? And are they the same group as those who are directly involved or vocal?"
     - What counts as answered: We have mapped out the groups that are experiencing the consequences, especially the indirect ones, and we have considered how to involve them in the inquiry. We must note if the affected public is not the same as the vocal parties (e.g., in the phone ban case, students are affected but parents are vocal).
     - If it fails: If we cannot identify an affected public beyond the already vocal groups, or if the affected public is impossible to engage (e.g., future generations, very marginalized), we note that and proceed with caution, but we don't stop. We might adjust our recruitment strategy.
     - Who decides: Person (facilitator, with input from staff and initial research).
     - Judgment: Deciding who counts as affected and how to reach them involves judgment.

   Step 3: State the problem collectively.
     - Question: "What is the problem we are trying to solve? Let's state it in a way that captures the concerns of the affected public and the indeterminacy we face."
     - What counts as answered: A problem statement that is agreed upon by the participants (or at least not rejected by a significant minority) and that captures the core indeterminacy. It must be specific enough to guide inquiry and broad enough to include the concerns of the affected public.
     - If it fails: If we cannot agree on a problem statement, we go back to Step 1 or 2 to see if we misjudged the situation or the public. If after two attempts we fail, we stop the inquiry and report that we could not define the problem.
     - Who decides: The participants in the assembly, facilitated by staff.
     - Judgment: The facilitator must guide the group to avoid having the loudest voices dominate. This step is about reframing felt grievances into a shared problem. Judgment is in the facilitation.

   Step 4: Develop proposals as ends-in-view.
     - Question: "What are some possible ways to address the problem? We will treat these as proposals (ends-in-view) that we can test for consequences, not as final solutions."
     - What counts as answered: At least two distinct proposals that address the problem statement and are feasible enough to consider. They should be framed as hypotheses: "If we do X, then we expect Y to happen, and we can measure Z to see if it works."
     - If it fails: If no feasible proposals emerge, we go back to the problem statement. If after revisiting the problem we still have none, we stop and report that no feasible solution was found.
     - Who decides: Participants, with facilitation.
     - Judgment: The facilitator must ensure that proposals are framed as testable hypotheses and that they are not just recycled positions.

   Step 5: Map consequences and assign risks.
     - Question: "For each proposal, what are the predicted consequences (both intended and unintended)? Who would bear the risks of negative consequences? Can we obtain their consent or mitigate the risks?"
     - What counts as answered: For each proposal, a clear list of predicted consequences and a risk assessment that identifies who is at risk and whether they can be consulted or protected. We must note if there are risks that cannot be mitigated and if consent from those at risk is possible.
     - If it fails: If a proposal has severe negative consequences that cannot be mitigated and the affected parties do not consent, then that proposal is set aside. If all proposals are set aside, we go back to Step 4 to develop new ones or Step 3 to reframe the problem.
     - Who decides: Participants, with input from experts and stakeholders. The facilitator guides.
     - Judgment: Assessing risks and the possibility of consent is a judgment call. Also, deciding whether a risk is acceptable is a value judgment that the participants must make.

   Step 6: Design the test (pilot).
     - Question: "How can we test the proposal in a way that generates clear evidence? What data will we collect, over what time, and how will we know if it worked?"
     - What counts as answered: A test plan that specifies the data to be collected, the timeline, and the criteria for success and failure. The plan must also state how the test will affect the community and how we will minimize harm.
     - If it fails: If we cannot design a test that is both feasible and informative, we go back to Step 4 to revise the proposal or Step 5 to reassess risks. If we repeatedly fail, we stop and report that we could not design a valid test.
     - Who decides: Participants, with expert input (e.g., city staff, data analysts).
     - Judgment: Deciding what data is feasible and what counts as success requires judgment.

   Step 7: Run the test and collect data.
     - Note: This step is done in the real world by the city, not the assembly. The assembly's role is to monitor and adjust if possible.
     - Question: (During the test) "What is the data showing? Are there unexpected consequences? Do we need to adjust the proposal or the test?"
     - What counts as answered: Data collected according to the plan, and a preliminary analysis of whether the proposal is working as expected.
     - If it fails: If the test cannot be run as planned (e.g., due to external events) or if the data is not being collected, we pause and reassess. If the test becomes invalid, we stop and report the failure.
     - Who decides: City staff run the test, but the assembly (or a monitoring subgroup) reviews the data and can recommend adjustments.
     - Judgment: Interpreting preliminary data and deciding on adjustments involves judgment.

   Step 8: Evaluate the results and revise.
     - Question: "Based on the data, did the proposal work? What did we learn about the problem and the consequences? How should we revise our understanding and our proposals?"
     - What counts as answered: A final report that states whether the proposal was successful (based on the criteria from Step 6), what consequences (intended and unintended) occurred, and what revisions to the problem statement or new proposals are warranted.
     - If it fails: If the data is inconclusive, we might extend the test or run a different one. If we cannot draw conclusions, we report that and suggest further inquiry.
     - Who decides: Participants, with input from experts and staff.
     - Judgment: Deciding what the data means and how to revise is a judgment call.

   Step 9: Formulate recommendations.
     - Question: "What should the city council do? This could be adopting the proposal, revising it, trying a different one, or even redefining the problem."
     - What counts as answered: Clear, actionable recommendations for the council, including any conditions or monitoring requirements.
     - Who decides: Participants, by consensus or voting.
     - Judgment: The group must balance the evidence with values to make a recommendation.

   Step 10: Disseminate the results to the public.
     - Question: "How do we communicate the process, the evidence, and the recommendations to the affected public and the wider community?"
     - What counts as answered: A communication plan that makes the consequences and the reasoning accessible to the public, especially those affected.
     - Who decides: Staff and participants together.
     - Judgment: How to communicate complex issues simply and fairly.

   Now, we note that the entire process must be completed in 6 weeks, so we might not be able to run a long test (Step 7) in one cycle. Therefore, for pilots that are longer, we might have to split the process: the assembly designs the pilot and then a later cycle evaluates it.

   We also need stop conditions (when to abandon the inquiry):
     - If Step 1 fails (it's a conflict of interest, not an indeterminate situation) and we don't have a mandate to mediate.
     - If we cannot agree on a problem statement (Step 3) after two attempts.
     - If we cannot develop any feasible proposals (Step 4) after revisiting the problem.
     - If we cannot design a valid test (Step 6) and have no alternative.
     - If the test (Step 7) becomes impossible to run or invalid.

   What the procedure cannot do:
     - Resolve deep value conflicts (e.g., absolute moral positions).
     - Protect against power imbalances that prevent some affected groups from participating.
     - Guarantee that the council will not ignore the report (but the report must be designed to be hard to ignore by being transparent and evidence-based).
     - Run in less than 6 weeks for complex issues that require long testing.

   Now, let's run the three cases:

   Case 1: Automated speed cameras on a corridor with contested crash data and opposing interests (neighborhood vs. delivery companies).

   Steps that decide it:
     Step 1: Is it indeterminate? Initially, it might seem like a conflict of interest (neighbors want safety, delivery companies want no delays). But the indeterminacy comes from contested crash data: we don't even know if there's a safety problem or if cameras solve it without causing economic harm. So, we proceed.

     Step 3: Problem statement. We must avoid letting either side write it. The problem might be: "How can we ensure safe travel speeds on this corridor without unduly burdening local businesses and residents?" 

     Step 4: Proposals. One proposal: install cameras for a 3-month pilot. Hypothesis: If cameras are installed, then speeding will decrease by X%, crashes will decrease by Y%, and business delivery times will increase by no more than Z minutes.

     Step 5: Risks. The risk is that delivery companies might face delays and pass costs to consumers. The affected are delivery companies, their customers, and residents. We might not get consent from all, but we can involve them in setting thresholds (e.g., Z minutes).

     Step 6: Test design. We'll collect speed data, crash reports (if any), and delivery time data. Criteria: if speeding is reduced by at least X% without delivery times increasing beyond Z, then it's a success.

     Step 7: Run the pilot (if council approves). But note: we don't have time to run the pilot within 6 weeks. So we design the pilot and then the assembly's report recommends the pilot with clear criteria. The actual evaluation happens later.

     Step 8: Not run in the initial 6 weeks.

     Step 9: We recommend the pilot with the criteria.

     Outcome: The assembly recommends a pilot with specific success criteria. The report will be hard to ignore because it has clear metrics and a test design.

     Askr will like it? We don't know the askr's position on this, but the procedure is followed.

   Case 2: Fare-free bus pilot on two routes.

     Step 1: Is it indeterminate? We don't know if fare-free will increase ridership, reduce congestion, help low-income riders, or if it will lead to overcrowding or funding shortfalls. It's indeterminate.

     Step 2: Affected public: riders (especially low-income), bus drivers, taxpayers, local businesses.

     Step 3: Problem: "How can we improve access to public transit for residents, especially those with low income, without compromising service quality or creating unsustainable financial burdens?"

     Step 4: Proposal: Make two routes fare-free for 6 months. Hypothesis: Ridership will increase by X%, especially among low-income residents (measured by survey), without a decrease in on-time performance or an increase in incidents, and without causing budget issues that lead to service cuts elsewhere.

     Step 5: Risks: Budget shortfall might lead to service cuts. The affected are all bus riders and taxpayers. We cannot get consent from all, but we can set a condition: if ridership doesn't increase enough, we end the pilot early. We must have a funding plan to cover the shortfall for the pilot.

     Step 6: Test: Collect ridership data, survey riders, monitor on-time performance and incidents, and track costs.

     Step 7: Run the pilot (again, outside the 6 weeks).

     But note: the askr (me) personally believes in this and has been lobbying for it. However, at Step 5, we must honestly assess the risks. If we cannot mitigate the budget risk (e.g., by securing temporary funding) and the participants decide that the risk to other routes is too high, they might reject the proposal. That would be the step where the procedure tells me not to do what I want.

     Let's say in Step 5, the participants (including representatives of riders from other routes) are concerned about the budget and don't consent to risking service cuts. Then we set aside the fare-free proposal. Then we go back to Step 4. Maybe we develop a different proposal: a subsidized pass for low-income riders instead of free for all. Then we test that.

     Outcome: The assembly might reject the fare-free pilot and propose a different solution.

     Askr will like it? No, because I wanted fare-free. But the procedure forces a risk assessment that I might have downplayed.

   Case 3: Bylaw banning phones in middle schools.

     Step 1: Is it indeterminate? The situation: parents want a ban because they believe phones are distracting, but students might have different views. We don't know if a ban will improve learning, or if it will cause other problems (e.g., safety concerns, enforcement issues). It's indeterminate.

     Step 2: Affected public: students (the primary affected group, but they are not the ones asking), parents, teachers, school staff.

     Step 3: Problem statement: We must involve students. The problem: "How can we ensure that mobile phone use in schools does not interfere with learning and well-being, while respecting the needs and concerns of students?"

     Step 4: Proposals: Ban phones during class time? Ban entirely? Phone lockers? Education on responsible use? Hypothesis: If we ban phones during class time, then classroom disruptions will decrease by X%, and student-reported stress will not increase (or might even decrease because of less social media pressure).

     Step 5: Risks: Students might feel disconnected from parents in emergencies, or they might resent the ban and break rules. The risk bearers are the students. We must get their input. If we cannot design a way to mitigate their concerns (e.g., a clear exception for emergencies), then the proposal might be rejected.

     Step 6: Test: We could pilot in one school for a semester and track disruptions (teacher logs), academic performance, and student surveys on stress and safety.

     Step 7: Run the pilot.

     Outcome: The assembly might recommend a pilot with specific conditions.

     But note: the students are the affected public and they might not consent to the ban. If they don't, and we cannot mitigate, then we set the ban aside and try a different proposal (like education).

     Askr will like it? We don't know the askr's position, but the procedure ensures students are involved.

   Now, we structure the output as JSON.

   Note: We have 10 steps, but in 6 weeks we might not run the test (Step 7) and evaluation (Step 8) within the cycle. So we adjust the steps to be:

     Steps 1-6 and 9-10: Done in the 6-week cycle.
     Steps 7 and 8: Done later (if the pilot is approved and run).

   Therefore, we might split the procedure into two parts: design and evaluation. But the problem says we do one cycle per month that lands on a real decision. So for a pilot, the decision is whether to run the pilot and how. Then, in a later cycle, we might do Steps 7-10.

   Alternatively, we can have:

     Step 7: Not run in the same cycle, but we design the test.

     Step 8: Not run.

     So we adjust the steps to be 1-6, then 9 and 10 (without 7 and 8). Then when the test is run, we do a follow-up cycle.

   Given the constraints, we design the procedure for the 6-week cycle without requiring the test to be run within that time. We focus on designing the test and making a recommendation to run it.

   Revised steps for the 6-week cycle:

     Step 1: Determine indeterminacy.
     Step 2: Identify affected public.
     Step 3: State the problem.
     Step 4: Develop proposals (as hypotheses).
     Step 5: Map consequences and risks.
     Step 6: Design the test.
     Step 7: Formulate recommendations (which may include running the test as designed).
     Step 8: Disseminate.

   We'll adjust the numbering accordingly.

   Now, the JSON structure:

     {
       "procedure": [
         { "step": 1, "name": "Check for Indeterminacy", ... },
         ... up to step 8
       ],
       "worked_cases": [
         { "case": "speed cameras", ... },
         { "case": "fare-free buses", ... },
         { "case": "phone ban", ... }
       ],
       "stop_conditions": [ ... ],
       "cannot_do": [ ... ]
     }

   Let's build it.
