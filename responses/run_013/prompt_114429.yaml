  ### Key Operational Notes:
  1. **Dewey's Core Intact**: 
     - Indeterminacy (Step 1) prevents wasted effort on political fights. 
     - Problem-stating (Step 3) as generative work. 
     - Proposals as testable hypotheses (Step 4). 
     - Consequences → Public formation (Step 2 & 5). 
     - Warranted claims via real-world testing (Step 6).

  2. **Judgment Transparency**: 
     - Facilitators make key calls in Steps 1, 2, and 5 (marked "person"). 
     - Other steps use group process but require facilitator rigor (e.g., forcing testable language).

  3. **Your Fare-Free Win/Loss**: 
     - Procedure blocked cameras (you'd lose) due to risk distribution. 
     - It enabled buses (you'd win) by improving test design.

  4. **6-Week Fit**: 
     - Steps 1-7 run sequentially in workshops. 
     - "Test" (Step 6) is designed but not run within cycle (council implements later). 
     - Report includes pilot blueprint for council ratification.

  This turns Dewey into a bulletproofing tool: it won't make hard decisions easy, but it will expose non-starters early and force evidence into the room.
