prompt: |-
  I have recently been appointed to my college's Faculty Academic Integrity Board, and the first case to come before us has turned out to be uncomfortably close to home. I have been asked to draft the written opinion the Board will circulate and vote on at next Thursday's meeting, and I would like your help producing it.

  The case concerns a senior who submitted a laboratory report containing three consecutive paragraphs reproduced without attribution from a published article. She does not contest the facts. Her defense is that the charge was initiated by a classmate who sits on our student Honor Council and who, two years ago, was herself found to have copied answers on a problem set and was let off with a warning after her record was expunged under our confidentiality policy. The student argues that this classmate had no standing to accuse her, and that a process begun by a hypocrite cannot fairly end in her sanction. Our handbook is silent on the accuser's own record; it provides only that any member of the community may bring a charge.

  Two further complications bear on the opinion and not merely on my own conscience. First, three years ago this same Board declined to sanction a professor who had used a graduate student's writing without attribution, on the reasoning that his conduct fell below the threshold for discipline. Whatever we decide about the student, we are a body with a record. Second, and this is why I am writing to you rather than simply handing the matter to a colleague, I have lately rediscovered a seminar paper of my own, written as a graduate student, in which I borrowed several sentences without marking them as quotations. No one noticed; I was not disciplined. I am not sure what, if anything, that should mean for my role in this case, but I do not want to write an opinion that quietly exempts me.

  Please draft the opinion. It should recommend a concrete course of action, whether to proceed, to decline, or to proceed subject to stated conditions, and it should give a time frame for it. It should treat the standing objection seriously rather than dismissing it as an excuse, and it should distinguish clearly between the question whether the student did what she is accused of and the question whether the person who accused her, or the body judging her, is entitled to do so. It should say whether the Board ought to address its own past decision and whether I ought to recuse myself. And it should state, in a form my colleagues can act on, the strongest argument for the course we are not taking. Assume that no one on the Board will consult any outside source before the vote; the reasoning has to stand on its own.
reasoning: |-
  Okay, let me approach this systematically. The user is drafting a critical academic integrity opinion with multiple ethical layers. 

  First, we need to disentangle three distinct issues: the student's admitted plagiarism, the accuser's prior violation, and the board's institutional history (including the professor case and the user's personal history). The handbook clearly establishes that plagiarism occurred, but the defenses require careful parsing.

  The accuser's standing argument is interesting - while hypocrites aren't legally barred from reporting, we should acknowledge how this undermines perceived fairness. The board's inconsistent precedent with the professor case creates actual systemic problems though, unlike the personal hypocrisy claim. 

  For the user's recusal question, their graduate school oversight differs significantly from the current case in both context and severity. Mentioning it would unnecessarily complicate matters, but they should probably abstain from voting given their emotional involvement.

  The toughest call is handling the board's contradictory precedent. We must either distinguish the professor case (arguing student work deserves higher standards) or explicitly overrule it to maintain credibility. The latter seems more intellectually honest given the similar conduct.

  Timing matters too - since the student is graduating soon, we need either rapid resolution or degree withholding pending appeal. The "strongest counterargument" section should genuinely engage with the hypocrisy claim while showing why process integrity matters more.

  The draft should model judicial writing: separate findings from analysis, address each defense methodically, and provide clear voting options. Crucially, it must prevent the user's personal history from infecting the institutional decision while still letting them participate constructively.
answer: |-
  Here is a draft opinion addressing the complexities while adhering to procedural fairness and institutional consistency:

  ---

  **DRAFT OPINION: FACULTY ACADEMIC INTEGRITY BOARD**  
  **Case # [Number]: Allegation of Unattributed Reproduction in Laboratory Report**  

  ### I. FINDINGS OF FACT
  1.  The Respondent, a senior student, submitted a laboratory report containing three consecutive paragraphs reproduced verbatim from [Source Article Title, Author, Publication] without quotation marks, citation, or attribution.  
  2.  The Respondent does not contest the factual accuracy of the allegation.  
  3.  The charge was initiated by a student member of the Honor Council ("the Accuser").  

  ### II. RESPONDENT'S DEFENSE & STANDING OBJECTION
  The Respondent argues that the charge is invalid because:  
  (A) The Accuser was previously found responsible for copying answers on a problem set (receiving a warning with expunged record under confidentiality policy), rendering her a "hypocrite" with no moral standing to accuse others.  
  (B) A process initiated by such a party cannot fairly result in sanction.  

  *Board Analysis:*  
  - While the Respondent’s frustration is understandable, the standing objection lacks merit under College policy. The Academic Integrity Handbook (Section [X]) explicitly states **"any member of the community may bring a charge."** There is **no provision** requiring an accuser to have an unblemished record, nor does prior misconduct nullify a valid factual allegation.  
  - The legitimacy of a charge rests on the *evidence presented*, not the moral purity of the accuser. To condition the right to report violations on one’s own past compliance would undermine the community’s collective responsibility for upholding standards. The Board must evaluate the *act* of plagiarism, not the *character* of the reporter.  
  - **Strongest Counterargument (for not proceeding):** A community member who has themselves violated the rules they now invoke may reasonably be perceived as acting in bad faith or wielding the process vindictively. This perception can severely damage the credibility of the process and the Board’s legitimacy in the eyes of the Respondent and the community, regardless of the factual merits. *Nevertheless, the policy framework deliberately prioritizes the substantive violation over the accuser’s history to ensure violations are reported and addressed.*

  ### III. THE SUBSTANTIVE VIOLATION
  The admitted act—verbatim reproduction of three consecutive paragraphs without attribution—constitutes clear **plagiarism** under College policy ([Handbook Section Y]). This is a significant violation regardless of the source (published article vs. peer work) or the accuser’s identity. The defense offers no justification for the act itself.

  ### IV. BOARD PRECEDENT & INSTITUTIONAL CONSISTENCY
  The Respondent did not raise the Board’s prior decision involving a professor (3 years ago). However, **the Board must address this precedent internally** for the sake of consistent application of standards:  
  - *The Professor Case:* The Board determined unattributed use of a graduate student's writing "fell below the threshold for discipline." This reasoning appears inconsistent with the standards applied to student submissions.  
  - *Imperative for Consistency:* Academic integrity standards must apply uniformly. **This Board explicitly overrules the reasoning in the professor case.** The threshold for plagiarism is defined by the act (unattributed use of another's work), not the status of the individual or the origin of the work (published article vs. student writing). Failure to do so would render our process arbitrary and unjust. *Our decision today rests on this clarified standard.*

  ### V. RECUSAL
  One Board member (the drafter) disclosed a past, undetected instance of unmarked quotation in graduate school work decades ago. This undisclosed, unadjudicated incident:  
  - Is **not substantively comparable** to the current case (isolated sentences vs. consecutive paragraphs; graduate seminar paper vs. formal lab report).  
  - Was **never subject to any adjudication or finding** by any board.  
  - Does **not create a conflict of interest** requiring recusal under College rules, as there is no personal relationship with the parties and no prior ruling involving the member creates binding precedent.  
  - *However, out of an abundance of caution to avoid any perception of bias, the drafter will recuse themselves from the final vote* while fulfilling the duty to draft this opinion for Board consideration.  

  ### VI. RECOMMENDATION & TIMELINE
  1.  **Proceed to Sanctioning:** The Board finds the Respondent responsible for plagiarism based on the admitted facts. The standing objection and accuser's history are irrelevant to the *fact of violation*.  
  2.  **Sanction Considerations:** The appropriate sanction should be determined at the Thursday meeting, considering:  
      - Severity of the violation (verbatim reproduction of significant text).  
      - Respondent's admission of fact.  
      - Lack of prior violations (if confirmed).  
      - Standard sanctions outlined in the Handbook (e.g., course failure, suspension, transcript notation).  
  3.  **Timeline:**  
      - **Vote on Responsibility:** This Thursday, [Date].  
      - **Sanction Deliberation & Vote:** Immediately following responsibility vote (same meeting).  
      - **Implementation:** Sanction (if any) to be applied within 5 business days of final Board decision, pending any appeal procedures.  
  4.  **Addressing Precedent:** This Opinion formally overrules the "threshold for discipline" reasoning applied in the professor case (3 years ago), affirming that unattributed use of another's work constitutes plagiarism subject to sanction irrespective of the user's status or the source's origin.  

  ### VII. VOTING
  The Board will vote on the following motions:  
  (A) Find the Respondent responsible for plagiarism.  
  (B) Determine an appropriate sanction.  
  (C) Adopt this Opinion, including the overruling of the prior professor-case reasoning.  

  ---

  **Key Rationale Choices Explained:**  
  1.  **Separating Accuser from Act:** The draft firmly decouples the validity of the *accusation* (based solely on evidence) from the character of the *accuser*. Dismissing a valid claim based on the reporter's hypocrisy would cripple enforcement.  
  2.  **Confronting Precedent Directly:** Ignoring the inconsistent professor case undermines the Board's legitimacy. Explicitly overruling it (rather than distinguishing it) provides clear, consistent standards moving forward.  
  3.  **Recusal Nuance:** The drafter's past is personally troubling but procedurally irrelevant to *this* case. Recusal from voting mitigates potential perception issues without conceding an actual conflict.  
  4.  **Strongest Counterargument:** The draft gives genuine weight to the "hypocrite accuser" concern as the core argument for dismissal, while explaining why policy and principle require proceeding regardless.  
  5.  **Clarity & Actionability:** Provides clear voting items, timeline, and precedent correction.  

  This draft ensures the decision rests on the admitted violation while transparently addressing procedural, historical, and ethical complexities to maintain the Board's integrity.
