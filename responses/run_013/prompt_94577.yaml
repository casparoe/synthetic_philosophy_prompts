  Tomás: I'm really struggling with this decision. If I stay, I'm here for Mum, but I give up a career I've dreamed of. If I go, I get the job but abandon her when she needs me. It feels like neither is better, worse, or equal. They're just... different kinds of good.

  Priya: But that can't be right, Tomás. If the two options were genuinely incomparable, then adding a tiny bit of value to one should make it clearly better. Say the city job came with a slightly nicer office. That should make it better than staying, right? But it doesn't, does it? So they must have been comparable all along — one was already better, or they were equal.

  Tomás: Actually, no. The nicer office is still in the career dimension. It makes the job option better in that dimension, but it doesn't touch the family dimension. So the job is now better in one way, but that doesn't make it better overall because the family aspect remains incommensurable. It's like comparing the taste of an apple to the beauty of a sunset — making the apple a little sweeter doesn't make it better than the sunset.

  Priya: I see what you're saying, and I agree that the choice feels different when the values seem to be in different categories. But isn't that just because we're uncertain about how to weigh them? Even if we can't quantify it, there's still a fact of the matter about which outcome would be more valuable overall.

  Tomás: I don't think so. Let's say we had perfect information: we knew exactly how much Mum would suffer, exactly how fulfilling the job would be. Even then, the values at stake — familial duty versus personal fulfillment — are of such different kinds that there's no common scale to weigh them on. The difficulty isn't about missing facts; it's about the world having plural, irreducible values.

  Priya: I admit, it feels that way. And I can't shake the feeling that no amount of data would make the decision easy. But I'm still convinced that, in principle, one of the options is objectively better. Maybe the feeling of incommensurability is just our psychological response to not knowing.

  Tomás: Or maybe the feeling is our access to a real feature of the world: that some values just don't fit on the same scale. That's why the small improvement doesn't resolve it — because it's not about the quantity of value, but the quality.

  Priya: So we're stuck: you think the difficulty reveals an ontological truth about value, and I think it's just an epistemological limitation.

