  Here's the joke:

  *A luck egalitarian walks into a casino and sees a man betting his last $100 on roulette. The egalitarian thinks, "Ah, option luck! He chose the gamble." But then they learn the man was down to his last $100 *because* his unchosen upbringing left him terrible at math, hopelessly optimistic, and desperate enough that the risk of total ruin felt better than the certainty of slow starvation. The egalitarian sighs, "Well, that distinction dissolved faster than my resolve not to intervene."*

  **Explanation:** The punchline mines the core tension within luck egalitarianism regarding the brute luck/option luck distinction. It highlights how factors crucial to "option luck" – like risk appetite, risk-assessment skills, and the desperation that makes a gamble seem like the least bad option – are themselves often products of brute luck (upbringing, innate traits, prior unchosen disadvantage). The "only other option was destitution" wrinkle further undermines the voluntariness of the gamble. Someone only knowing the slogan "equalize the stuff that isn't your fault" misses how incredibly porous the line between choice (option luck) and circumstance (brute luck) becomes upon close examination, making it practically impossible to cleanly separate what "isn't your fault" from decisions made under its heavy influence. The joke shows the distinction threatening to collapse *from within* the theory itself.
