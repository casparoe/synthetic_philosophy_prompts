  Second question gets trickier. At the moment of strike, the microstructure is already toughened. But is fragility intrinsic? If yes, it lost the property; if relational, maybe it retains dispositionality through the protective system. The microstructure alone doesn't settle this - we must decide what fragility fundamentally is.

