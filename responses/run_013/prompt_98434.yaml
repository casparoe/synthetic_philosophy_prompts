prompt: |-
  I'm in a social choice / political theory reading group and we've gotten into a dumb but weirdly productive fight about Gibbard–Satterthwaite. Camp A (call them the impossibility hawks) thinks the theorem is basically the end of the story: any voting rule that's non-dictatorial, unanimous, and has at least three possible outcomes is manipulable, so any institution that claims otherwise is either lying, restricting preferences in a way that's normatively suspect, or smuggling in dictatorship. Camp B (the escape artists) thinks that's a bait-and-switch: the theorem is about ordinal ballots and unrestricted domains, and once you allow cardinal info, randomization, approval-style ballots, restricted domains, or a status quo default, you get rules that are strategy-proof in the senses that actually matter for institutions. They've been talking past each other for a year. I want you to write the joint statement they could both sign after a real adversarial collaboration.

  To keep it from becoming a Wikipedia recap, please use a little taxonomy we invented in the group and make the camps argue through it. Distinguish three strategy-proofness levels: L1, no single voter can gain by misreporting given the others' ballots; L2, same but the rule is randomized and gain is in expected utility, so a voter might be able to change the distribution without improving their own lot; L3, no single voter can gain on a restricted domain that includes a status quo/default outcome and preferences that are single-peaked-ish but can have a secondary dimension. Also distinguish manipulation by one voter, by a coalition, and by a voter who is uncertain about others' ballots. The document should have: (1) a numbered list of agreed claims, including what each side accepts about the theorem's assumptions, what it does and doesn't say, and what would count as a counterexample to either side; (2) a disagreements table with the precise remaining disputes, each row phrased in wording that the side named in that row would accept as its own position; (3) the cruxes, i.e. the sub-questions that would actually move at least one side, with a concrete case, rule, or preference profile both sides agree would bear on each crux, and each side's prediction about what that case would show written down in advance. If some of their fight is just verbal, say which part and why. No reading lists, no citations, no scholars-have-argued filler -- just the document. Maybe 1200-1800 words.
