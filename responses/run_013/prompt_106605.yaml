answer: |-
  **1.**  
  The Somnus Institute’s enrollment lounge hummed with subdued tension. Maya signed the waiver, her finger hovering over the biometric pad. "Paid per awakening," Dr. Aris confirmed, his voice calm. "The die rolled last night dictates how many times *you* wake up. One to six. Memory wipe between each. You’ll know only that you’re awake *now* and the protocol." Maya thought of rent, then of the unsettling clause: one signature binding multiple, isolated consciousnesses. Priya, another volunteer, muttered, "Feels like cloning without asking the clones."

  **2.**  
  During orientation, Leo slammed his coffee cup down. "It’s simple! The die was fair. Sunday’s 1/6 chance for six hasn’t changed. Being awake tells you *nothing* new about the roll!" Dr. Aris raised an eyebrow. "But Leo, *if* the die rolled six, there are six times as many 'yous' feeling awake right now as there would be if it rolled one. Doesn’t finding yourself awake make a high roll *more probable*?" Priya cut in, "But *which* 'you' is consenting now? The Sunday Maya agreed to potential multiplicity. This Tuesday Maya didn’t. That matters."

  **3.**  
  Maya awoke. Disoriented. White room. No clock. The sterile air felt thick. *Which awakening is this? First? Third? Only?* Dr. Aris’s words echoed: *"Six times as many 'yous'..."* Leo’s counter: *"No new evidence!"* Priya’s ethical tremor: *"This 'me' didn't sign up alone."* The form lay before her: Credence for 'six'? Accept a bet: 3:1 payout if six, lose stake otherwise. The registrar settled per awakening. Six wins could mean six payouts... or six losses. She felt fractured.

  **4.**  
  Awake again. Or still? The form identical. Maya wrestled with the numbers. If the die was fair, Sunday’s chance for six was 1/6. But *given she was awake*, wasn’t she more likely to be experiencing one of the many awakenings generated by a high roll? She calculated: Total possible awakenings: 1 (if roll=1) + 2 (if roll=2) + ... + 6 (if roll=6) = 21. Six of those 21 awakenings happened only if the die showed six. So... credence for six *given awake*: 6/21 = 2/7? Roughly 28.6%? Far above the initial 16.7%. But the clinic offered only 3:1 odds (25% implied probability). Betting felt wrong. Could she gamble with stakes paid by other, unconsenting awakenings of herself?

  **5.**  
  Maya picked up the stylus. Her form read:
  >   **(i) Credence roll was six:** 2/7 (approx. 28.6%)  
  >   **(ii) Accept 3:1 bet?:** No  
  >   **Confidence & Reservations:** *I am moderately confident in the arithmetic (6 favorable awakenings / 21 total possible awakenings = 2/7). The step I am least sure of is treating "finding myself awake" as evidence favoring hypotheses that predict more awakenings (the self-indication assumption). This departs from the textbook Sleeping Beauty coin flip where "no new evidence" arguments hold strong weight, and hinges on a genuinely contested interpretation of what "evidence" the awakening state provides. My case strongly leans on the position that first-person perspective matters for probability. The unresolved ethical weight of multiple unconsenting awakenings also directly influenced my refusal to bet, despite potentially favorable odds.*
