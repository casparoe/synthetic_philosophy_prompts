prompt: |-
  For several years I have taught a graduate seminar on the knowing-how/knowing-that distinction, and I have come to dread the moment when a student reaches for the bicycle example: it is so well rehearsed that the seminar learns nothing from it, and the discussion collapses into the same exchange about whether knowing how to ride is just a compressed proposition about a way of riding. I would like to replace that ritual with an exercise that forces the students to ask which cases actually carry weight. Please rank the following candidate items by how much evidential weight each can bear in the argument that knowing how is not a species of knowing that — that is, how strong a case each makes for the irreducibility of practical knowledge — and give me the result as a set of tiers, three or four of them, with the items honestly distributed; I would rather have tiers I can argue with than a total ordering I will not believe. For each item, say briefly what its defender would have to claim, what the intellectualist must say in order to absorb it, and whether that absorption looks principled or merely ad hoc.

  The items, in no particular order: (1) knowing how to ride a bicycle, including the fact that a competent rider cannot say what he does with the handlebars; (2) a jazz improviser's capacity to respond to the phrase the bassist has just played in a way that fits; (3) a taster's capacity to identify a wine, together with the fact that one can be better or worse at this by degrees; (4) knowing what it is like to see red for the first time, on the part of someone who has known all the relevant facts about colour vision all along; (5) knowing how to speak one's native language, including the grammar one cannot state; (6) knowing the way to the station from here — the route, not the map; (7) the capacity to tell when a rule one has been following no longer applies, that is, the know-how of judgment in bringing a rule to bear on a case one has not met before (this is the item I care most about, and the one I expect the students to mishandle); and (8) a colleague's proposal, which I find both attractive and obscure, that what unifies the practical items is their gradability — that one can know how to do something more or less well, whereas propositional knowledge is not like that. I would like you to treat (8) not as a further item on the list but as a proposed criterion for sorting it: does gradability cut where the distinction needs cutting, or does it cut across the list in the wrong place, and does it survive the cases in which someone has all-or-nothing practical competence?

  Finally, tell me which items are doing no work at all — the ones a well-constructed intellectualism absorbs at no cost — and which single item you would keep if you could keep only one, with your reason. I am asking for your considered weighing of these puzzles, not a survey of what has been written about them, and I have no use for references; what I want is the ranking, the reasons, and an honest account of the items on which you are least confident.
reasoning: |-
  Okay, the user is a professor who teaches a graduate seminar on the knowing-how/knowing-that distinction. They're tired of the overused bicycle example and want fresh exercises to challenge students. Their main goal is to rank examples by how well they demonstrate that knowing-how isn't reduducible to knowing-that. 

  Hmm, they've provided eight items to evaluate. I need to assess each based on evidential weight against intellectualism. The professor also cares most about item (7) - judgment in applying rules to new cases - and expects students to mishandle it. Interesting challenge. 

  First, I should consider what makes an example strong: resistance to intellectualist reduction attempts, clarity in showing practical knowledge, and avoiding circular debates. Weak examples will be those intellectualism can easily absorb with minor tweaks. 

  Looking at item (8) - gradability as a unifying criterion. The professor wants this treated as a sorting tool, not an example. Does gradability hold up? Well, propositional knowledge does have degrees (certainty levels), and some practical skills are binary (swimming). So it's imperfect but still useful for grouping. 

  Now evaluating each item: 
  - (1) Bicycle: Classic but weak. Intellectualists can claim unconscious proposition storage. Overused. 
  - (2) Jazz improvisation: Strong. Real-time creation resists propositional reduction. 
  - (3) Wine tasting: Moderate. Intellectualists might argue about sensory data propositions. 
  - (4) Seeing red: Tricky. More about phenomenal consciousness than know-how per se. 
  - (5) Native language: Strong. Implicit grammar challenges explicit rule articulation. 
  - (6) Route knowledge: Moderate. Can be reduced to procedural memory propositions. 
  - (7) Rule application: Very strong. Captures judgment where rules run out - the core of practical knowledge. 

  The professor's attachment to (7) makes sense - it directly attacks intellectualism's claim that rules cover everything. If I had to pick one, this would be it. 

  For tiers: 
  Top tier: (7) and (2) - both show creative adaptation beyond rules. 
  Mid-tier: (5), (3), (6) - reducible only through strained intellectualism. 
  Weak tier: (1), (4) - easily absorbed or off-topic. 

  Gradability (8) helps cluster (2),(3),(5),(7) but doesn't explain (6)'s binary aspects. Useful but not definitive. 

  Biggest uncertainty is (4) - "knowing what it's like" feels different from practical know-how. Might derail discussions. 

  Ultimately, (7) should be the new flagship example. It forces students to confront the limits of propositional accounting. And no more bicycles!
answer: |-
  Below is a tiered ranking of your items based on their evidential weight against intellectualism (the view that knowing-how reduces to knowing-that). The tiers reflect how effectively each case resists intellectualist absorption, with Tier 1 being the strongest evidence for irreducibility. I follow your request to treat (8) as a criterion, evaluating its utility at the end.  

  ---

  ### **Tier 1: Strongest Evidence**  
  *(Cases where intellectualist absorption requires implausible, ad hoc maneuvers)*  
  1. **Item (7): Knowing when a rule no longer applies (judgment in novel cases)**  
     - **Defender’s claim**: Practical judgment in unprecedented situations cannot be captured by propositional rules; it requires situated, non-algorithmic discernment.  
     - **Intellectualist absorption**: Must argue that all novel cases are covertly governed by implicit meta-rules (e.g., "In context C, apply rule R").  
     - **Assessment**: Highly ad hoc. Intellectualism must infinitely regress (rules for applying rules, etc.), violating Occam’s razor. This exposes intellectualism’s core weakness: rules cannot self-interpret.  

  2. **Item (2): Jazz improvisation**  
     - **Defender’s claim**: Real-time musical responsiveness is non-propositional; it involves embodied dialogue, not retrieving stored facts.  
     - **Intellectualist absorption**: Must reduce improvisation to "knowing-that" compositional theories or pattern libraries.  
     - **Assessment**: Implausible. Absorption ignores the creative, context-sensitive negotiation between musicians. Feels like denying the phenomenon.  

  ---

  ### **Tier 2: Substantial Evidence**  
  *(Cases where absorption is strained but intellectually possible)*  
  3. **Item (5): Speaking one’s native language (incl. unstateable grammar)**  
     - **Defender’s claim**: Fluency relies on tacit, procedural knowledge distinct from explicit grammatical propositions.  
     - **Intellectualist absorption**: Argues grammar is stored subconsciously as propositions (e.g., Chomskyan I-language).  
     - **Assessment**: Possible but unprincipled. Intellectualism struggles with *why* speakers cannot access this "knowledge-that," making absorption feel like special pleading.  

  4. **Item (3): Wine tasting gradability**  
     - **Defender’s claim**: Degrees of tasting skill (e.g., novice vs. sommelier) show practical knowledge isn’t binary like propositional knowledge.  
     - **Intellectualist absorption**: Redefines "knowledge-that" as probabilistic (e.g., "knowing that this wine has 85% chance of being Bordeaux").  
     - **Assessment**: Principled but costly. Intellectualism must abandon its all-or-nothing epistemology, weakening its core position.  

  ---

  ### **Tier 3: Moderate Evidence**  
  *(Cases where intellectualism absorbs with minimal cost)*  
  5. **Item (6): Knowing the route (not the map)**  
     - **Defender’s claim**: Wayfinding is embodied familiarity, not recalling map-like propositions.  
     - **Intellectualist absorption**: Reduces to "knowing-that" sequences of landmarks (e.g., turn left at X, then right at Y).  
     - **Assessment**: Easily absorbed. Route knowledge aligns with procedural "knowledge-that" (e.g., GPS directions). Minimal cost.  

  6. **Item (1): Bicycle riding (incl. unarticulable handlebar adjustments)**  
     - **Defender’s claim**: Skill involves automatic motor control irreducible to propositions.  
     - **Intellectualist absorption**: Attributes it to subconscious proposition storage (e.g., "knowing that leaning left balances rightward tilt").  
     - **Assessment**: Weak. Absorption is intuitive (cf. cognitive science models of implicit memory). The example is exhausted by rehearsed debates.  

  ---

  ### **Tier 4: Weakest Evidence**  
  *(Cases easily absorbed or misaligned with the distinction)*  
  7. **Item (4): Knowing what it’s like to see red**  
     - **Defender’s claim**: Phenomenal experience ("qualia") is non-propositional.  
     - **Intellectualist absorption**: Rejects qualia as "knowledge" or reduces it to physical/functional facts.  
     - **Assessment**: Irrelevant. This targets the *hard problem of consciousness*, not practical knowledge. Intellectualists exclude qualia from epistemology outright.  

  ---

  ### **Items Doing No Work**  
  - **Item (1)** and **Item (6)** are easily absorbed by intellectualism at little cost. They invite circular debates.  
  - **Item (4)** is a distraction—it conflates practical know-how with phenomenal consciousness.  

  ---

  ### **Criterion (8): Gradability**  
  - **Strengths**: Explains Tier 1/2 cases (e.g., jazz skill or judgment improves with practice; wine tasting is scalar). Aligns with Aristotle’s *phronesis* (practical wisdom).  
  - **Weaknesses**: Fails for all-or-nothing competences (e.g., **Item 6**: you either know the route or you don’t). Also, propositional knowledge *can* be gradable (e.g., confidence levels, probabilistic beliefs).  
  - **Verdict**: Useful but imperfect. It clusters strong cases (2,3,5,7) but doesn’t carve the distinction cleanly.  

  ---

  ### **If Keeping Only One Item: Choose (7)**  
  **Why**: It directly attacks intellectualism’s core assumption—that rules can exhaust rationality. Judgment in novel cases (*phronesis*) is the paradigm of irreducibility. It avoids well-trodden debates (bicycles, routes) and sidesteps distractions (qualia). Students can’t retreat to stock responses; they must engage judgment’s unruliness.  

  ---

  ### **Honest Uncertainties**  
  - **Item (3) (Wine tasting)**: I’m least confident about its tier. Intellectualists *could* bite the bullet and accept graded propositional knowledge (e.g., "knowing-that with 70% accuracy"). This might be principled in formal epistemology.  
  - **Item (8) (Gradability)**: Its force depends on whether we see scalar competence as essential to know-how—but some skills *are* binary (e.g., knowing how to swim).  

  This ranking prioritizes cases that intellectualism can only absorb by abandoning its spirit (e.g., reducing improvisation to "hidden rules" or judgment to "meta-rules"). The bicycle example dies quietly in Tier 3—replace it with jazz or judgment to ignite fresh discussion.
