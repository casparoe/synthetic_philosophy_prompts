prompt: |-
  I am a software engineer by trade — I write scheduling and records software for a hospital network — and I sit on my state's medical board as the public, non-physician member, which is why the drafting has fallen to me. At our next meeting the board votes on an appeal from an applicant I will call Dr. R. She completed medical school and a full residency abroad, has practiced for eight years in a hospital there, and passed our clinical skills assessment without difficulty, but she has now failed the written licensing examination four times, each time by a handful of points, with the misses concentrated in the fact-recall sections rather than the case-based ones. A rural hospital that has been recruiting her says it will lose its only internist if we do not license her; a competing hospital group has written in to oppose, arguing that a physician who cannot state the reasoning behind a treatment choice on demand is exactly the risk the examination exists to catch. Our statute permits us to license an applicant who demonstrates the competence to practice safely and leaves it to us to define how competence is demonstrated, and it also permits a restricted license on conditions we set — in this case she has offered two years under a named supervisor with quarterly chart audits.

  Two of my colleagues have turned the case into an argument I cannot referee on my own. One of them, a retired professor, says the real question is the difference between knowing-how and knowing-that: the examination measures whether she can state facts, while the job requires her to do things, and the two can come apart, so failing the first is weak evidence about the second. The other calls that sophistry — medicine is mostly reasoning about unfamiliar cases, and a doctor who can act but cannot explain is a technician, not a physician. I have also been told, in the hallway, that the distinction is itself contested, and that some philosophers hold that knowing-how is just a species of knowing-that, which would cut against her appeal rather than for it. Please draft the short written opinion I will circulate before the vote. It should recommend a concrete disposition with a time frame, spell out the conditions if you favor a restricted license, say what the license actually certifies, and take a position on whether the knowing-how/knowing-that distinction should change the outcome — including which reading of that distinction the board should adopt and why. Treat the opposing view at its strongest rather than waving it away, and keep it under a page and a half, since our chair will not read more. Three similar appeals are queued for the spring, so I need criteria that generalize beyond Dr. R. I do not need citations; nobody on the board would read them, and I would rather have the argument than a survey.
reasoning: |-
  Okay, the user is a software engineer who also serves as a public member on a state medical board. They're drafting an opinion for an appeal case involving Dr. R, who has failed the written licensing exam four times by narrow margins but has a strong practical background. The user needs a concise, persuasive draft that addresses philosophical arguments about "knowing-how" vs "knowing-that" while providing practical recommendations that can set precedent for future cases.

  Hmm, this is complex. The user wears two hats - technical professional and public policy arbiter. Their hidden needs include establishing defensible criteria for exceptional cases, managing board dynamics between the retired professor and the opposing colleague, and creating a template for future appeals. They're clearly frustrated by the philosophical deadlock and want pragmatic resolution.

  The core tension is between two valid concerns: patient safety versus access to care in a rural area. The professor's "knowing-how" argument has merit given Dr. R's proven clinical skills and CSA performance, but the opposition rightly points out that explanatory reasoning is fundamental to physicianhood. 

  I should propose a middle path - conditional licensing - because it satisfies both principles: it grants practice rights where most needed while mandating remediation of the knowledge gap. The time-bound aspect (24 months) creates accountability. The supervision requirements (quarterly audits + mentor) are specific enough to be meaningful but not administratively burdensome.

  For the philosophical debate, I'll acknowledge both views but ground the decision in statutory language ("competence to practice safely") rather than academic theory. The key insight is that competence has multiple dimensions - Dr. R clearly possesses procedural competence, and we can verify her conceptual competence through workplace performance metrics.

  The rural hospital's crisis adds ethical weight - denying licensure might collapse local care access. But I mustn't let that override standards, hence the probationary period. The opposition hospital group's concern gets addressed through the supervision requirements.

  Future cases will need this same balancing: narrow exam failures + strong practical evidence + critical access need. That's replicable without opening floodgates. Should emphasize that this doesn't lower standards - it changes the verification method temporarily.

  Word count is tight - need crisp paragraphs. Lead with recommendation, then unpack reasoning. Chair won't read past 1.5 pages so every sentence must pull weight. No jargon - these are physicians, not philosophers. Use "conceptual knowledge" instead of "knowing-that" for clarity.
answer: |-
  ## Draft Medical Board Opinion: In re Dr. R. Licensure Appeal

  **Recommendation:** Grant Dr. R. a restricted license for a period of **twenty-four (24) months**, subject to the specific conditions outlined below. This disposition balances the demonstrated clinical competence with the legitimate concerns regarding foundational knowledge, while directly addressing the urgent healthcare needs of a vulnerable community.

  **Proposed License Conditions:**
  1.  **Supervision:** Dr. R. must practice under the direct, on-site supervision of [Named Supervisor], a board-certified internist in good standing approved by this Board. Supervision entails regular case review, availability for consultation, and oversight of Dr. R.'s practice.
  2.  **Chart Audits:** Quarterly, comprehensive chart audits will be conducted by an independent reviewer (or committee) designated and approved by the Board. These audits will specifically assess diagnostic reasoning, treatment plan justification, and adherence to evidence-based guidelines, focusing on areas correlating with the written exam weaknesses.
  3.  **Remediation Plan:** Dr. R., in consultation with her supervisor, must submit a Board-approved plan within 60 days outlining specific steps to address knowledge gaps (e.g., targeted study modules, coursework, case-based reviews). Progress must be documented and reported quarterly.
  4.  **Practice Limitation:** The license restricts practice solely to the employing rural hospital facing the internist shortage.
  5.  **Re-examination Requirement:** Dr. R. must successfully pass the written licensing examination within the 24-month period. Failure to pass constitutes grounds for automatic license revocation upon the expiration of the restricted term.
  6.  **Reporting:** The supervisor and hospital must submit formal reports to the Board every six months confirming compliance with all conditions and providing an assessment of Dr. R.'s clinical performance and knowledge integration.

  **What the Restricted License Certifies:** This license certifies that, based on her proven clinical skills assessment performance, documented residency, and eight years of apparently safe practice abroad – combined with the structured oversight and remediation mandated – Dr. R. possesses the *current, supervised competence to practice internal medicine safely and effectively within the defined, constrained setting* for the probationary period. It does **not** certify that she currently meets the full, unsupervised standard of knowledge demonstration typically required by the written examination. Successfully completing the probationary terms, including passing the exam, is required for conversion to an unrestricted license.

  **Addressing the "Knowing-How" vs. "Knowing-That" Distinction:** The arguments presented highlight a genuine tension relevant to licensure. We acknowledge the force of both positions:

  *   **The "Knowing-How" Argument (Pro-Dr. R.):** Dr. R.'s record strongly suggests significant practical competence ("knowing-how"). Passing the clinical skills assessment and sustained practice abroad indicate an ability to perform essential physician tasks. The written exam's fact-recall focus might imperfectly measure this practical ability, especially for an experienced clinician. Her narrow failures concentrated in recall sections, contrasted with strength in case-based sections, lend credence to this view.
  *   **The "Knowing-That" Argument (Opposition):** Medicine demands more than rote procedure; it requires reasoned judgment often grounded in explicit, retrievable knowledge ("knowing-that"). The ability to articulate the rationale for a treatment is fundamental to physician autonomy, peer collaboration, patient communication, ethical justification, and adapting to novel situations. A physician who cannot reliably access or explain foundational knowledge risks becoming dangerously inflexible, especially in resource-limited settings without immediate specialist backup. The exam serves as a crucial, standardized screen for this essential cognitive capacity.

  **The Board's Position:** We find that the strict dichotomy, while conceptually useful, is less determinative than the practical statutory mandate: to license applicants demonstrating "the competence to practice safely." Competence in modern medicine *integrates* both "knowing-how" *and* "knowing-that." While procedural skill is vital, the ability to reason explicitly from foundational knowledge is equally indispensable for safe, independent practice.

  *   Regarding the philosophical debate on whether "knowing-how" reduces to "knowing-that," the Board adopts the view most consistent with the demands of the profession: **robust clinical competence requires both proficient action *and* the accessible conceptual knowledge that informs and justifies that action.** One cannot be fully substituted for the other in the context of granting independent licensure without specific safeguards.

  **Resolution:** Dr. R. presents compelling evidence of "knowing-how" but has not yet demonstrably satisfied the "knowing-that" component via the standard assessment. However, denying licensure outright ignores her significant practical ability and imposes severe harm on a community losing its sole internist. The proposed restricted license is the balanced solution:

  1.  It utilizes her proven clinical skills ("knowing-how") to address an urgent public health need *immediately*.
  2.  It mandates conditions (supervision, audits, remediation) specifically designed to rigorously evaluate and foster the integration of practical skill *with* the necessary explicit knowledge ("knowing-that") within a real-world setting.
  3.  It requires her to ultimately satisfy the standard knowledge demonstration ("knowing-that") via the written exam within a defined period, ensuring alignment with baseline licensure requirements.

  **Generalization:** This approach establishes criteria for similar appeals: Applicants with (a) *repeated narrow exam failures* concentrated in specific domains, (b) *strong, verifiable evidence of clinical competence* (e.g., robust CSA pass, significant successful practice), (c) a *critical healthcare access need* demonstrably addressed by their licensure, and (d) a *viable supervision/remediation plan* targeting the identified deficiencies, may be considered for a time-bound, restricted license with mandatory exam passage. This maintains standards while allowing flexibility where evidence suggests competence exists but standard demonstration has been narrowly elusive.

  **Vote Recommendation:** Grant the restricted license as specified.
