prompt: |-
  I am an undergraduate midway through a course on the ethics and economics of markets, and we have just spent a week on Aquinas's treatment of buying and selling (Summa Theologiae II-II, q.77, a.1) as background to the modern debate about price controls. I can follow the broad shape of the argument, but two stretches of the text leave me stuck, and I would like help working out how they fit together with the rest. The first comes from the body of the article, where he turns to cases in which one party is in pressing need:

  "Secondly we may speak of buying and selling, considered as accidentally tending to the advantage of one party, and to the disadvantage of the other: for instance, when a man has great need of a certain thing, while an other man will suffer if he be without it. On such a case the just price will depend not only on the thing sold, but on the loss which the sale brings on the seller. And thus it will be lawful to sell a thing for more than it is worth in itself, though the price paid be not more than it is worth to the owner. Yet if the one man derive a great advantage by becoming possessed of the other man's property, and the seller be not at a loss through being without that thing, the latter ought not to raise the price, because the advantage accruing to the buyer, is not due to the seller, but to a circumstance affecting the buyer. Now no man should sell what is not his, though he may charge for the loss he suffers."

  The second is a remark in the reply to the first objection:

  "I add this condition, because the just price of things is not fixed with mathematical precision, but depends on a kind of estimate, so that a slight addition or subtraction would not seem to destroy the equality of justice."

  My difficulty is that the first half of the article appears to fix the just price by the worth of the thing -- any excess breaks what he calls "the equality of justice" -- whereas the passage above seems to let the price move with the seller's loss, and the second passage seems to rest the standard on a social estimate rather than on anything determinate. My seminar leader reads the need passage as a concession to circumstance, my study partner reads the estimate remark as making the just price conventional, and I cannot tell whether these two readings genuinely conflict or whether I am simply misreading what "worth" is doing in the argument. What I ultimately want to know is whether the article commits Aquinas to a standard determinate enough for a legislator to enforce -- say, by capping rents or setting a wage floor -- or whether it addresses only the individual conscience.

  Please give your answer as exactly five numbered points, each one or two sentences, with no introduction and no conclusion, and please write in British English.
reasoning: |-
  Okay, the user is an undergraduate student studying Aquinas's views on just price in Summa Theologiae. They're struggling with two specific passages: one about cases of pressing need where price can exceed the thing's worth based on seller's loss, and another about just price being based on estimation rather than mathematical precision. 

  The user is confused because the main argument seems to fix price by the thing's worth, while these passages introduce flexibility. Their seminar leader sees the need passage as circumstantial exception, their study partner thinks the estimate remark makes price conventional. The user wants to know if Aquinas provides a standard determinate enough for legislation like price controls.

  Hmm, this is a sophisticated textual analysis problem. The core tension is between Aquinas's apparent objective standard ("worth of the thing") and contextual flexibility. The user suspects their classmates' interpretations might conflict, but I think they're complementary when properly framed.

  First, Aquinas absolutely has an objective standard - the thing's worth in normal conditions. That's foundational. The pressing need case isn't abandoning the standard but accounting for how "worth" gets calculated when the seller suffers real loss. It's still objective, just situationally adjusted. 

  The estimate passage is crucial - Aquinas isn't saying price is arbitrary, but that precision isn't possible. Like how "reasonable person" standards work in law. This actually strengthens enforceability because it acknowledges real-world variability while maintaining principle.

  For legislation, Aquinas gives enough determinacy for broad interventions (like banning usury or extreme exploitation) but not micromanagement. The flexibility is intentional - conscience handles edge cases law can't codify. 

  The user's classmates are both partially right but miss the synthesis: circumstantial adjustment within an objective framework, with social estimation providing the mechanism. Worth isn't purely intrinsic nor purely conventional - it's socially recognized value under normal conditions. 

  This explains why Aquinas would support some price controls (against fraud or exploitation) but not rigid fixation. The user's policy question is astute - the text does provide legislative grounding, just not mechanical application. I'll structure this as five precise points in British English as requested.
answer: |-
  1.  Aquinas first establishes the just price as fundamentally rooted in the objective "worth of the thing itself" under normal conditions, requiring equivalence to maintain commutative justice between buyer and seller.
  2.  The passage on pressing need introduces a specific exception: the just price may exceed the thing's inherent worth *only* if the seller suffers a definite loss by parting with it, thereby incorporating that loss into the thing's "worth to the owner" at that moment.
  3.  The "estimate" remark clarifies that the just price, while objectively grounded in the thing's worth and circumstances like seller loss, cannot be fixed with absolute precision and involves a reasonable social judgement ("kind of estimate") of that worth within a tolerable range.
  4.  The pressing need case is not purely conventional but a circumstance altering the objective basis for calculation (seller's loss), while the "estimate" acknowledges practical application within a margin; together, they show the standard is objective but context-sensitive, not arbitrary.
  5.  Aquinas provides a standard determinate enough for legislation to prohibit clear injustices like fraud or extreme exploitation based on dire need, but its inherent flexibility and reliance on estimation mean it better governs individual conscience than mandates precise, universally fixed prices like rigid caps or floors.
