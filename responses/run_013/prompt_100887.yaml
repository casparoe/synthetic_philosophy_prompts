  ## Keynote Address: Thermidor, Terror, and the Debt We Inherit

  **[Delivered with warm, conversational gravitas, acknowledging the room]**

  Good evening. It’s a privilege to stand before the Society on this particular date – the anniversary of Thermidor. A date that resonates, doesn’t it? A hinge moment in that most seismic of events, the French Revolution. And it lands us squarely, as requested, on the old, grim question: do revolutions inevitably devour their children? From Danton to Robespierre, Lenin to Trotsky, the pattern seems chillingly familiar. The makers consumed by the thing they made.

  Now, I see some familiar faces tonight – colleagues who’ve forgotten more about Jacobin club minutes than I’ll ever know. And I see friends whose passion for history is as much about the claret and the lively debate as the footnotes. So, let me be clear: I won’t offer you tonight a neat, deterministic law of revolutionary digestion. No grand theory of historical inevitability. No hidden class logic grinding inexorably towards the scaffold. Frankly? I think that does a disservice to the sheer, terrifying *humanity* of it all.

  **[Leans in slightly, pace deliberate]**

  The Revolution, like all human endeavours, was a cascade of **contingencies**. Choices made, paths not taken, moments seized or fumbled. The Estates-General could have found compromise. The King could have grasped reform earlier, differently. The Girondins might have held the centre. The Terror escalated not because a script demanded it, but through fear, suspicion, misjudgement, ambition, and the sheer, overwhelming pressure of crisis – war, famine, counter-revolution. Each step was taken by individuals, weighing options in the fog of unprecedented upheaval. It *could* have been otherwise. To say otherwise absolves actors of their responsibility and flattens the agonising reality.

  **[Pause, acknowledging potential sensitivities]**

  And we must hold that reality. For some here tonight, the shadow of the guillotine falls across family histories. That pain, that loss, is real and enduring. It deserves our respect, not abstraction. The Terror was not a statistical inevitability; it was a human tragedy wrought by human hands in specific, contingent circumstances.

  So, if it wasn’t fate, if it wasn’t class war’s logic unfolding on schedule… why *does* this pattern of self-consumption haunt revolutions? Why does Thermidor feel like part of a recurring nightmare? This is where I want to introduce a notion I’ve wrestled with: **Legitimacy Debt**.

  **[Clearly enunciates the term, letting it hang]**

  Think of the foundational act of any revolution. It is, by definition, an act *unauthorised*. It shatters the existing order – monarchy, empire, dictatorship – whose very existence was its own claim to legitimacy, however frayed. The revolutionaries perform this radical surgery without sanction. They declare, *We are the new authority*. But on what grounds? Not tradition, not divine right, not established law – they’ve just shattered those. Their legitimacy is retrospective, born *of the act itself* and the promise of what will follow.

  **[Builds the idea]**

  This creates an immense, immediate **debt**. A legitimacy debt. The new order owes its existence to an act that, by the standards of the *old* order, was fundamentally illegitimate – treasonous, criminal, sacrilegious. How does it repay this debt? How does it solidify its own shaky claim to be the *true* source of authority? It cannot simply point backwards; that leads back to the old regime it overthrew. It must point forwards, to the glorious future it promises. But the future is fragile, always vulnerable to doubt, to betrayal, to the lingering ghosts of the past.

  **[Pace quickens slightly, explaining the mechanism]**

  And so, the debt is serviced… by repetition. By continually re-enacting the foundational rupture, proving the revolution’s enduring necessity and power. The enemies within become the new embodiments of the *old* illegitimate order threatening the *new* legitimacy. Suspicion becomes self-fulfilling prophecy. Eliminating rivals – Girondins, Hébertists, Dantonists – isn't just about power struggles; it becomes a ritual purification. Each purge repays a fraction of the debt by demonstrating the regime’s vigilance, its revolutionary purity, its willingness to *act* decisively against perceived threats to its existence – just as it did against the King. Robespierre consuming Danton, only to be consumed himself on Thermidor, feels less like a predetermined cycle and more like the grinding gears of this relentless debt machine. Each wave of leaders, inheriting the revolutionary state, inherits this crushing debt and finds the easiest way to service it is often by turning the revolutionary violence inward, consuming the previous wave as insufficiently pure, as latent counter-revolutionaries.

  **[Connects to the 'always' narrative]**

  Crucially, the *story* we tell ourselves – that revolutions *always* devour their children – becomes part of servicing this debt. It retrospectively justifies the Terror as an inevitable, almost natural, part of the revolutionary process. It suggests the violence wasn’t contingent failure, but structural necessity – thereby lending a grim, fatalistic legitimacy to the terrible choices made. It tells us, "This is the price." But was it? Or was it the result of the immense, destabilising pressure of that initial, unredeemed legitimacy debt, channelling contingent fears and ambitions into a predictable pattern of self-destruction?

  **[Shifts to reflection, tone sobering]**

  Seen through this lens, Thermidor wasn't the *end* of the devouring. It was simply the next instalment in servicing the debt accrued back in 1789. The Revolution continued consuming itself, albeit in different forms, long after Robespierre fell.

  So, what are we left with tonight? Not a law, but a burden. **Legitimacy Debt** is the heavy inheritance of any order born from unauthorised rupture. It creates a structural *pressure*, a gravitational pull towards reaffirming the founding violence against internal ‘threats’. It doesn’t make the Terror inevitable; contingency still rules the day. But it makes the slide towards suspicion, purge, and self-consumption a terrifyingly plausible path, a path made smoother by the very story of its inevitability.

  The children aren’t devoured by fate. They are consumed by the immense, often unsustainable, cost of founding something radically new on the ashes of the old. The debt demands payment, and tragically, the currency is often their blood. Understanding that debt, I suggest, is our task. Not to predict, but to comprehend the weight carried by those who dare to remake the world, and the perilous path it sets them upon. Thank you.

  **[Concludes with a brief, respectful nod]**
