prompt: |-
  I'm in a bioethics course this term and I also help run a student podcast, and next week we've got a philosopher on who defends procreative beneficence -- the view that when you're picking which embryo to implant, you've got a moral reason to pick the one expected to have the best life -- but who flatly denies that this licenses selecting for stuff like height, IQ, or eye colour. I want to actually pin down whether that line holds instead of letting her restate the view, so could you draft eight to ten questions, each with a follow-up keyed to the answer she's most likely to give?

  Things I'd definately want covered: (a) why "best life" gets measured against the child's own future values rather than the parents', given that people who end up with the very conditions we screen against often report their lives going fine -- the disability paradox thing -- so how do you even rank the lives before the person exists to have the values; (b) whether calling it a "reason" and not a "duty" does any real work or just sounds less scary; (c) the expressivist objection, that selecting against deafness tells actual deaf people their lives weren't worth having -- I bet she says the message is about the condition and not the person, so I need a follow-up that makes that move harder to pull; (d) whether the disease/enhancement line survives once you notice how many traits are both, cholesterol being the obvious one; and (e) one question on polygenic scores, where we can only rank embryos probabilistically and "best expected life" starts to come apart from any particular child's good.

  No "what drew you to philosophy" fluff please, and don't bother asking her to recommend reading -- she'll just list her own stuff.
reasoning: |-
  Okay, the user is in a bioethics course and runs a student podcast. Next week, they're interviewing a philosopher who supports procreative beneficence but rejects selecting for traits like height, IQ, or eye color. They want to pin down whether that distinction holds. I need to draft 8-10 questions with follow-ups based on likely answers.

  First, the user specified key areas: (a) measuring "best life" against the child's future values despite the disability paradox, (b) whether "reason" vs. "duty" is meaningful, (c) the expressivist objection with a strong follow-up, (d) the disease/enhancement distinction using cholesterol as an example, and (e) polygenic scores complicating "best expected life." They also want no fluff questions.

  The user's explicit needs are clear, but deeper needs might include wanting rigorous debate to challenge the philosopher, ensuring the podcast is substantive, and understanding if the philosopher's position is consistent or avoids tough critiques. They might also want tools to push back against common rebuttals in bioethics debates.

  For question (a), the core issue is how to rank lives pre-person. The philosopher will likely say we use general well-being metrics. The follow-up should challenge that with the disability paradox—people with disabilities report high life satisfaction, so how can we claim their lives are worse? The follow-up needs to pressure the inconsistency in claiming to use the child's values while preemptively judging.

  For (b), the difference between "reason" and "duty." The philosopher might argue it's not obligatory, just a factor. The follow-up should question if this distinction collapses in practice when resources exist, making non-selection seem negligent. Use a hypothetical like genetic testing for Tay-Sachs to test when a reason becomes a duty.

  For (c), the expressivist objection. The philosopher will likely say selection is about the condition, not the person. The follow-up needs to challenge that by asking how the message is received, using a parallel like selecting against a skin color—would that be seen as about the condition or devaluing people? This forces them to address societal interpretation.

  For (d), disease vs. enhancement. Cholesterol is a key example because it's context-dependent. The philosopher might use a harm threshold or typical functioning. The follow-up should press on borderline cases, asking if selecting for lower cholesterol is enhancement or prevention, revealing the line's fuzziness.

  For (e), polygenic scores. The issue is probabilistic outcomes vs. individual goods. The philosopher might say we act on expected value. The follow-up should highlight that the "best life" is an aggregate, not for any specific child, questioning the moral weight of statistical vs. individual harm.

  Other areas to cover: societal biases influencing what's considered "best," like intelligence. The philosopher might say we should correct biases. Follow-up: how to prevent biases in parental choices without oversteering. Also, trait interactions—selecting for one trait might affect others negatively, challenging the idea of a "best" embryo.

  Ensure questions are concise and direct. Avoid letting the philosopher restate their view without scrutiny. Each follow-up should anticipate their response and push deeper into contradictions or implications. The goal is to test the coherence of their distinction between health-related and non-health traits.
answer: |-
  Here are eight focused questions with tailored follow-ups designed to press the philosopher on the core tensions in her position, anticipating common defenses and blocking easy exits. Each follow-up targets the likely response:

  ### Core Questions & Follow-Ups

  1.  **Question:** Procreative beneficence (PB) requires selecting the embryo expected to have the "best life." How do you objectively define "best life" for a future person *before* they exist and develop their own values, especially given the Disability Paradox (where people with conditions we screen against report high life satisfaction)?
      *   *Likely Response:* "We use generalizable indicators of well-being based on human flourishing/objective list theories (health, opportunity, relationships), avoiding subjective preferences."
      *   **Follow-Up:** Doesn't the Disability Paradox directly challenge those "objective" indicators? If someone with profound deafness reports a life as rich and fulfilling as anyone else's, how can PB justify preemptively ranking *their specific potential life* as objectively worse *based on the absence of hearing*? Doesn't this reveal PB relies on *external* judgments about the condition, not the actual lived experience of the future person?

  2.  **Question:** PB is framed as providing a "moral reason," not a "duty," to select the best-off embryo. What practical ethical work does this distinction *actually* perform? When would a parent be morally justified in *ignoring* this reason?
      *   *Likely Response:* "It acknowledges parental autonomy and other values. Selecting a different embryo isn't necessarily wrong if there are countervailing reasons (e.g., wanting a genetic sibling)."
      *   **Follow-Up:** If PB provides a strong moral reason grounded in the profound welfare interests of the future child, and technology exists to act on it at minimal cost (like embryo selection via PGT), doesn't ignoring that reason become increasingly difficult to justify? Isn't calling it just a "reason" a rhetorical softeniner that collapses into a *prima facie* duty in practice, especially for preventing severe conditions? (E.g., Is ignoring a PB reason *not* to select an embryo with Tay-Sachs easily justified?)

  3.  **Question:** Critics argue that using PB to select *against* embryos with certain traits (like deafness) sends a harmful "expressivist" message to existing people with those traits: that their lives are less valuable or not worth living. You likely say the message is about the *condition*, not the *person*. How does this distinction hold when the condition is an intrinsic part of a person's identity and community (as with Deaf culture)?
      *   *Likely Response:* "The selection decision reflects a judgment about the burdens *of the condition itself* in a world not designed for it, not the worth of individuals who live with it successfully. We can value people while wishing to prevent avoidable hardship."
      *   **Follow-Up:** How is this message *received* by the affected community? If society widely adopts PB to select against deafness based on assumptions about "burden," doesn't this unavoidably reinforce the societal devaluation *of deaf people*, regardless of intent? Isn't the distinction between "condition" and "person" practically meaningless when the condition defines a core aspect of identity and community belonging? (Analogize: Selecting against embryos likely to develop a specific skin shade based on assumptions about burden in a racist society – wouldn't that *express* racism, regardless of stated intent about the "condition"?)

  4.  **Question:** You reject using PB for traits like height or IQ, implying a distinction between preventing disease/disability and enhancement. How do you define that line? Take cholesterol: high levels are a disease risk factor, low levels are generally beneficial. Is selecting an embryo for a polygenic score predicting *very low* LDL cholesterol preventing disease or enhancing health?
      *   *Likely Response:* "The line is based on preventing significant harm or impairment relative to normal species functioning, not maximizing beyond that baseline. Selecting for lower cholesterol is preventing disease risk."
      *   **Follow-Up:** But where is the "harm threshold"? If selecting for the *lowest possible* cholesterol score reduces heart disease risk from, say, 5% to 0.5%, is that still prevention, or is it enhancement? Doesn't cholesterol show that many traits exist on a continuum where "prevention" seamlessly shades into "enhancement" once we move beyond clear-cut monogenic disorders? How does PB avoid sliding down this slope?

  5.  **Question:** PB relies on ranking embryos based on expected life prospects. With polygenic scores (PGS) for complex traits (including disease risks, IQ, personality), predictions are inherently probabilistic and uncertain for any *individual* embryo. How can "best expected life" be meaningfully determined when the prediction is a population-level probability, not a certain outcome for *this specific future child*?
      *   *Likely Response:* "We act on the best available evidence and expected value. Selecting the embryo with the highest *probability* of the best outcomes is still justified, even acknowledging uncertainty."
      *   **Follow-Up:** Doesn't this fundamentally change the moral calculus? PB originally focused on clear harms. When acting on low-effect PGS for traits like IQ (which might shift the probability by a few points), aren't we making a choice that statistically *might* benefit one potential person over another, but guarantees nothing for the actual child born? How strong is the "moral reason" here compared to preventing a high-penetrance disease? Does PB become a justification for parental preference based on statistical aggregates, not the concrete good of a specific child?

  6.  **Question:** PB assumes we can isolate "best life" potential. But traits interact: an embryo with a slightly lower IQ PGS might have a higher PGS for resilience or creativity. How does PB handle these complex trade-offs without imposing a single, potentially biased, view of the "optimal" human?
      *   *Likely Response:* "We focus on foundational goods like absence of severe suffering or profound cognitive impairment, not fine-grained optimization. The complexity is a practical limitation, not a fatal flaw."
      *   **Follow-Up:** But your rejection of selecting for height/IQ suggests PB *is* meant to apply beyond just preventing profound suffering. Once we move into the realm of probabilistic PGS for non-severe traits (like moderate educational attainment risk), doesn't the necessity of making trade-offs based on *subjective parental or societal weighting* of different traits become unavoidable, contradicting the claim that PB is purely child-focused and objective?

  7.  **Question:** Societal biases (e.g., favoring high IQ, tall stature) inevitably influence judgments about what constitutes a "better life." How can PB avoid simply codifying and amplifying these existing prejudices under the guise of beneficence?
      *   *Likely Response:* "We must be vigilant and base PB on objective well-being criteria, correcting for bias. Avoiding selection for traits like height is part of that vigilance."
      *   **Follow-Up:** Given that parents make these choices within a biased society, and objective well-being criteria are themselves contested (as per the Disability Paradox), isn't PB inherently vulnerable to being hijacked by prejudice? How, *operationally*, do you prevent a parent using PGT-P (polygenic screening) to select for higher IQ based on PB *arguments*, claiming it objectively leads to a better life? Doesn't rejecting this require abandoning the core logic of PB for any trait not causing profound suffering?

  8.  **Question:** You argue PB applies to embryo selection but not traits like eye color. What's the *ethical* principle distinguishing selecting for disease prevention versus selecting for a trait that might bring the child modest social advantages (like blue eyes in some contexts) or parental satisfaction? If parental satisfaction is a legitimate reason for eye color, why isn't it a stronger reason to use PB for traits that might affect the child's welfare more significantly?
      *   *Likely Response:* "PB is solely about the welfare of the future child. Eye color selection is purely parental preference, not significantly impacting the child's well-being. PB overrides mere preference for traits impacting core welfare."
      *   **Follow-Up:** This seems circular. You *define* traits like eye color as not impacting welfare to exclude them. But if a parent has strong evidence (even probabilistic via PGS) that a trait *will* confer *some* advantage (e.g., height correlating with income), doesn't PB *require* them to consider it, as it *does* pertain to the child's expected welfare? How do you *ethically* justify excluding these factors without undermining PB's core principle of maximizing expected well-being?

  ### Why this approach works

  *   **Anticipates Defenses:** Follow-ups directly counter the expected "standard lines" (objective well-being, condition-not-person, prevention-vs-enhancement, probabilistic reasoning).
  *   **Forces Nuance:** Presses on the hardest edges (Disability Paradox, expressivism reception, trait continuum, probabilistic aggregation, bias, circular definitions).
  *   **Connects Concepts:** Links abstract principles (PB) to concrete tech (PGS) and real-world consequences (bias, community impact).
  *   **Avoids Restatement:** Questions are framed to demand justification for the *distinction* central to her view, not a re-explanation of PB itself.
  *   **No Escape Hatches:** Follow-ups close off easy dodges by focusing on practical implications, societal reception, and internal consistency.

  Good luck with the interview! This line of questioning should push the discussion into genuinely contested and philosophically rich territory.
