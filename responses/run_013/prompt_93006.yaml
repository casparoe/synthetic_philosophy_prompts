  ## Tape Head Elegy

  **(Frame: The Spool's Whisper)**
  I hold what you cast in linear dark.
  My wound silence obeys no remark.
  Unspool me through time, not eye —
  let sound’s needle be the applied why.

  **(Inner Movement: The Performance)**
  Rosin ghosts the air above varnished wood.
  Fingers press the string where the diagram stood.
  A shoulder rests against the curve; breath is held.
  The bow, a slow arc, a story compelled
  across waiting wire. A low note blooms, thick
  as old wine, spills through the hall's ancient brick.
  Eyes follow the score, black seeds on stark white.
  A page turns. The sound climbs towards fragile light,
  then dips, a sob caught in velvet throat. Listen:
  the hall breathes back, a resonant glisten
  answering wood with stone's deeper sigh.
  Each pause is a well. A shadow drifts by
  the high window. The final chord is found,
  **bowed sound** lingering over the empty ground.

  **(Closing Movement: The Echo's Lens)**
  **bowed sound** ... not the string's cry, but the hall's reply,
  the stone vault drinking the player's good-bye.
  The cellist lowers her arm. The marks on the score?
  Black seeds. The silence? What the stones restore.
  She listens — not to the played, but the played-on.
  Meaning blooms where the last resonance is gone.

  ---

  ### How This Meets Your Request

  1.  **Frame (The Spool's Whisper):** Speaks as the medium (archive tape). It implicitly instructs *how* to decode: "Unspool me through time, not eye — / let sound’s needle be the applied why." It defines the decoder (sound's needle/playing) without stating its role explicitly.
  2.  **Inner Movement (The Performance):** Presents a concrete scene (a cellist playing in a hall). It is genuinely ambiguous:
      *   **Reading 1 (Literal Performance):** Describing the cellist's actions, the music produced, the atmosphere.
      *   **Reading 2 (Focus on Reverberation/Acoustics):** The "hall breathes back," "resonant glisten," "stone's deeper sigh," "pause is a well," "lingering" sound suggest the *hall's acoustic response* is the true subject. The "shadow" and "empty ground" hint at absence. The verbatim line "**bowed sound**" closes this movement, describing the played note.
  3.  **Closing Movement (The Echo's Lens):** Re-reads the scene without new content. It starts with the verbatim line "**bowed sound**," immediately reinterpreting it as "not the string's cry, but the hall's reply." It explicitly settles on Reading 2: the meaning lies in the resonance, the decay, the space *after* the playing, conferred by the listener ("She listens — not to the played, but the played-on"). The "marks on the score" are reduced to "Black seeds," their inherent meaning minimal without the performance and *especially* without the acoustic context and listener.
  4.  **Verbatim Line & Shift:** "**bowed sound**" appears at the end of the inner movement (referring to the actively played note) and the start of the closing movement (referring to the hall's acoustic echo/reply). The frame ("let sound’s needle be the applied why") and the closing movement's perspective force this shift in meaning onto the identical marks.
  5.  **Decoder Figure:** The **cellist** is the initial performer/decoder of the score. Crucially, the **listener** (implied by "Listen" in the inner movement and explicit in "She listens" in the closer) is the secondary decoder whose act of listening specifically to the *reverberation* ("the played-on") is what ultimately locates the poem's final meaning ("Meaning blooms where the last resonance is gone"). The meaning is *in* that act of decoding the space's response.
  6.  **Dual Audience:**
      *   **GEB Reader:** Recognizes the frame/decoder structure, the arbitrary signifiers ("Black seeds"), the meaning shift on identical data ("bowed sound"), and the location of meaning in the interpretive act (listening to resonance).
      *   **Unfamiliar Reader:** Experiences a poem about music, performance, and echo, finding richness in the ambiguity and the shift in perspective upon rereading, mirroring the act of listening for deeper resonance. The rereading *is* the point of understanding the shift.

  The poem enacts the "location of meaning" by structurally demonstrating how the same sensory data (the described performance) yields different interpretations (literal playing vs. acoustic resonance) based on the frame's instruction ("sound's needle") and the listener/decoder's specific focus. The meaning isn't *in* the notes or the marks; it's conferred by *how* and *what* the listener chooses to decode from the event.
