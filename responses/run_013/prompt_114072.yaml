  - **Evidence**: Student’s own cancellation example ("Priya has read some... in fact all") **does not create a logical contradiction**—only pragmatic oddity (contradiction test fails for entailment). "Some" does not *semantically* mean "not all"; the "not all" reading is a default inference cancellable without contradiction (e.g., "Some files, indeed all").  
  - **Test Misapplication**: Cancelability *actually proves it’s conversational* (GCI), not conventional. Detachability is irrelevant here.  
  - **Fix**: Correct classification + cite cancelability test for GCI.  

  **(iii) Conventional Implicature** (✔ **3/3 → Partial credit**)  
  - **Correct classification**: "But" conventionally implicates contrast.  
  - **Correct test**: Detachability is valid (replacing "but" with "and" removes contrast).  
  - **Minor flaw**: Student should explicitly note conventional implicatures are **non-detachable** (i.e., tied to the word "but"). Their example implicitly shows this. *No deduction* as core reasoning is sound.  

  **(iv) Particularized Conversational Implicature** (✔ **2/3**)  
  - **Correct classification & tests**: Properly identifies as particularized implicature, cites Relation, cancelability, and context-dependence.  
  - **Missing nuance**: Fails to name the **calculability test** (though implied in "the hearer calculates this"). *Deduct 1 mark* for not explicitly naming the required test.  

