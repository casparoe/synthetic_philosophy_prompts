answer: |-
  Here’s a decomposed credence assessment for the pessimistic meta-induction (PMI) as a "good" argument against scientific realism, followed by sensitivity analysis and extensions. My **overall credence that PMI should reduce a 0.9 prior to ≤0.5 is ≈35%** (i.e., I assign low-to-moderate strength to PMI). Below is the breakdown:

  ### Decomposition (Key Uncertainties)
  1. **Historical discard rate (40% weight)**:  
     - *Issue*: What fraction of "mature" past theories saw *core ontology abandoned* (e.g., phlogiston, luminiferous aether) vs. *retained/reduced* (e.g., Newtonian mechanics → relativity)?  
     - *Assessment*: High discard rate in 19th-century physics/chemistry (Laudan’s list), but lower in post-1900 theories. Credence PMI reflects reality: **60%**.  
     - *Probability contribution*: **0.6**  

  2. **Selective/structural realism salvage (30% weight)**:  
     - *Issue*: Can structural realism (preserved mathematical structure) or selective realism (preserved "working posits") explain survival without approximating truth?  
     - *Assessment*: Structuralism saves many cases (e.g., Maxwell’s equations), but fails for ontology shifts (e.g., ether → spacetime). Selective realism faces "pessimistic overdetermination" (Stanford). Credence anti-realist salvage fails: **35%**.  
     - *Probability contribution*: **0.35**  

  3. **Reference class problem (20% weight)**:  
     - *Issue*: Can "mature theories" or "central posits" be defined *without* hindsight bias? Realists note discarded theories (e.g., caloric) lacked maturity markers (e.g., novel predictions).  
     - *Assessment*: Anti-realists struggle to define non-circular criteria. Credence PMI reference class is unreliable: **20%**.  
     - *Probability contribution*: **0.2**  

  4. **Epistemic vs. ontic force (10% weight)**:  
     - *Issue*: Is PMI about *actual truth* or *rational credence*? Even if science converges, current theories may be false.  
     - *Assessment*: PMI strongest as *epistemic caution* (we've been wrong before). Credence it forces ≤0.5: **80%**.  
     - *Probability contribution*: **0.8**  

  **Combined credence**:  
  (0.6 × 0.4) + (0.35 × 0.3) + (0.2 × 0.2) + (0.8 × 0.1) = **0.345** ≈ **35%**.  

  ---

  ### Sensitivity Analysis  
  - **Most sensitive sub-question**: **Reference class definability** (3). If realists can objectively define "maturity" (e.g., via unification, novel predictions), PMI collapses. If not, PMI gains force. Small changes here disproportionately affect the outcome.  

  ---

  ### Newer Anti-Realist Arguments: "Unconceived Alternatives" (Stanford)  
  - **Strength vs. classic PMI**: **Stronger in principle, weaker empirically**.  
    - *Why stronger*: Attacks the realist’s "no alternatives" inference directly, bypassing historical record. If we *can’t conceive* of future theories, current confidence is unjustified.  
    - *Why weaker*: Highly speculative; lacks PMI’s concrete cases. Realists counter that underdetermination is mitigated by empirical success (e.g., Standard Model predictions).  
  - *Verdict*: More threatening to realism long-term but harder to deploy persuasively than PMI.  

  ---

  ### What Would Move My Credence  
  - **↑ Toward anti-realism (to ~60%) if**:  
    - New historiography shows *even "best" modern theories* (e.g., QFT) discard core entities at rates matching 19th-century theories.  
    - A "maturity" criterion without hindsight bias is proven impossible.  
  - **↓ Toward realism (to ~10%) if**:  
    - Clear cases where *only* true components explain novel success (e.g., Higgs boson predictions).  
    - Structural realism demonstrably preserves *all* successful mathematical structure across revolutions.  

  ### Key Takeaway for Your Paper  
  The PMI’s power hinges on **historical discontinuity claims** and the **reference class problem**. Its strength is moderate but unstable—realists can defang it with nuanced history or better epistemology. For a decisive anti-realist blow, Stanford-style arguments may be more fruitful, but they trade empirical traction for deeper skepticism. If you’re flip-flopping, focus on whether *selective survival* (e.g., "electrons exist but caloric doesn’t") is explicable without realism. That’s the battleground.
