prompt: |-
  I'm a doctoral student in philosophy of mind, and for the past year I've sat in a reading group with two colleagues — one an illusionist about phenomenal consciousness, the other a phenomenal realist — whose exchanges have hardened into mutual incomprehension. I want the document that a genuine adversarial collaboration between them should have produced, written so that both could put their names to it.

  To make the exercise bite, adopt the following three-way disambiguation of what illusionism might mean, and have each side locate itself and the other within it, or explain why the trichotomy is itself misleading:

  (i) eliminativism: there are no phenomenal properties, and phenomenal consciousness names nothing at all;
  (ii) fictionalism: phenomenal discourse is a useful fiction rather than a description of anything real;
  (iii) no-further-fact (deflationary) illusionism: introspective reports are about real, reportable mental states, but those states carry no phenomenal properties over and above their functional and representational ones — the illusion is only that we take there to be such a further property.

  Then produce the following.

  1. A numbered set of agreed claims: the substantive propositions both can sign. Cover what both accept about the existence and character of introspective judgments, about the meta-problem (why creatures like us come to think and talk in phenomenal terms at all), about which explanatory-gap and no-go arguments do and do not establish what, and about what would count as progress. Keep these non-vacuous — a claim any position would accept does not belong here.

  2. The precise residual disagreements, each phrased in the words its own side would use, and each flagged as substantive or merely verbal; if you judge part of the dispute verbal, say which part and why.

  3. The cruxes: the sub-questions such that settling one would move at least one side. For each, state a case, argument, or empirical result both sides would agree bears on it, and record each side's prediction about it in advance.

  Throughout, separate what is settled among people who work on this from what is genuinely contested, and do not present a contested view as the consensus. Note explicitly where the illusionist side is not one view — the three readings above already pull it apart — and where the realist side is likewise a family rather than a single position.

  End with a final line of exactly the form \answer{...} containing a short phrase naming the single deepest remaining crux.
reasoning: |-
  We are creating a document that two philosophers — an illusionist and a phenomenal realist — could both sign, as the product of an adversarial collaboration. The illusionist is represented in three possible ways: eliminativism, fictionalism, or no-further-fact illusionism. The realist holds that phenomenal consciousness is real and irreducible.

  We structure the document as follows:

  1. **Agreed Claims**: A set of numbered, substantive propositions that both sides accept. These should not be vacuous (i.e., not accepted by any position). They cover:
     - Introspective judgments (their existence and character)
     - The meta-problem (why we think and talk in phenomenal terms)
     - Explanatory-gap and no-go arguments (what they establish and what they do not)
     - What would count as progress

  2. **Residual Disagreements**: Each side's statement of the remaining disagreements, flagged as substantive or verbal (and if verbal, why).

  3. **Cruxes**: Sub-questions that, if settled, would move at least one side. For each, we provide a case, argument, or empirical result that both sides agree bears on it, and each side's prediction.

  We note explicitly where the illusionist side is not one view (due to the trichotomy) and where realism is a family of views.

  Finally, we end with a short phrase naming the single deepest remaining crux.

  ---

  **Document: Adversarial Collaboration Report**

  **Participants:**
  - **Dr. Illusionist (I)**: Holds that phenomenal consciousness is an illusion. We consider three variants: (i) eliminativism, (ii) fictionalism, (iii) no-further-fact illusionism.
  - **Dr. Realist (R)**: Holds that phenomenal consciousness is real and irreducible.

  **1. Agreed Claims**

  Both parties agree on the following substantive claims. These are not vacuous and reflect common ground that excludes positions that might be held by others (e.g., dualism or radical behaviorism).

  1. **Introspective Judgments**: Humans make introspective reports about their experiences that they typically express in phenomenal terms (e.g., "I see red", "I feel pain"). These reports reflect real cognitive states that can be studied scientifically.

  2. **The Meta-Problem**: The existence of phenomenal concepts and discourse can be explained by the cognitive architecture of humans. Our evolutionary history and cognitive mechanisms (including attention, memory, and language) have led us to form concepts of phenomenal states and to report them as having qualitative properties. Both sides agree that explaining why we have these concepts does not, by itself, settle the question of whether phenomenal properties exist.

  3. **Explanatory Gap**: There is an explanatory gap between physical/functional accounts of the mind and our intuitive concept of phenomenal consciousness. Neither side believes that this gap is necessarily an ontological gap. The realist holds that the gap might point to an ontological feature, while the illusionist holds that it reflects a cognitive limitation.

  4. **No-Go Arguments**: Arguments such as the knowledge argument (Mary's room) and the hard problem of consciousness are not conclusive. They show that we currently lack a satisfying explanation, but they do not prove that such an explanation is impossible. Both sides agree that these arguments do not establish dualism or the failure of physicalism.

  5. **Progress**: Progress in understanding consciousness will come from:
     - Advances in neuroscience (e.g., identifying neural correlates of consciousness).
     - Refinements in cognitive science (e.g., models of introspection and attention).
     - Philosophical analysis that clarifies concepts and reduces ambiguity.
     Both sides agree that empirical results and theoretical developments could shift the debate.

  **2. Residual Disagreements**

  We now present the remaining disagreements. Each side states their view and we flag whether the disagreement is substantive or verbal.

  *From the Illusionist (I):*
  > "Our main disagreement is about whether there are phenomenal properties over and above functional and representational properties. I hold that there are not (I am a no-further-fact illusionist). Therefore, when we introspect, we are not actually detecting a non-functional property; rather, we are misrepresenting the nature of our own mental states. The realist, however, believes that there is a further fact about what it is like to have an experience that cannot be reduced. This is a substantive disagreement because it affects how we explain the nature of consciousness and what we should expect from a complete science of the mind. But note: I reject eliminativism (i) because we do have mental states that we report, and fictionalism (ii) because I take our reports to be about real states (albeit misrepresented)."

  *From the Realist (R):*
  > "The illusionist denies the existence of phenomenal properties, but I maintain that they are real and irreducible. The core disagreement is whether the qualitative character of experience (e.g., the redness of red) is fully captured by functional and representational properties. I say it is not. This is substantive because it concerns the ontology of mind. However, I acknowledge that the illusionist and I agree on the existence of the cognitive states that give rise to introspective reports. Where we diverge is on whether these states possess an intrinsic qualitative nature that cannot be reduced. I also note that the trichotomy of illusionism is helpful but that the illusionist's no-further-fact view (iii) still denies what I take to be a fundamental feature of reality."

  *Assessment of Disagreement:*
  - **Substantive Part**: The dispute over whether there are phenomenal properties that are non-functional and non-representational is substantive. It is about what exists and what a complete theory of consciousness must account for.
  - **Verbal Part?**: There is a potential verbal element in how we use the term "phenomenal property". The illusionist might say that the realist's "phenomenal property" is a confused concept, while the realist might say the illusionist is changing the subject. However, both sides agree that they are talking about the same target (the "what it's like" aspect of experience) and that the disagreement is about its reality. Thus, the core is not merely verbal.

  **3. Cruxes**

  We identify key sub-questions that could move the debate. For each, we state a case, argument, or empirical result that both sides agree is relevant, and each side's prediction.

  **Crux 1: The Resolvability of the Explanatory Gap**
  - **Case**: If neuroscience and cognitive science develop a complete functional and representational model of a conscious state (e.g., visual experience of red) that fully explains why we report it as having a qualitative feel, and if this model is accepted as satisfying by the scientific community, then the gap might be closed.
  - **I's Prediction**: The gap will be resolved by such a model, showing that the sense of a further fact is an illusion.
  - **R's Prediction**: Even with a complete functional/representational model, there will remain an unanswered question about why the processing has a qualitative character. The gap will persist.

  **Crux 2: The Possibility of a Zombie**
  - **Case**: A philosophical argument: If it is conceivable that a functional duplicate of a human (a zombie) could lack phenomenal consciousness, then this might show that consciousness is not functional.
  - **I's Prediction**: Zombies are inconceivable upon proper analysis because any functional duplicate would have the same introspective reports and thus the same phenomenal concepts. What we call consciousness just is the functional state.
  - **R's Prediction**: Zombies are conceivable, and this shows that functional properties do not exhaust phenomenal properties.

  **Crux 3: Empirical Evidence for Illusion**
  - **Case**: Discoveries in neuroscience that show systematic misrepresentation in introspection. For example, if it is found that the brain constructs a representation of a "phenomenal property" that does not correspond to any property in the world or in the brain, but serves a functional role (e.g., in attention or decision-making).
  - **I's Prediction**: Such evidence will accumulate and support the view that phenomenal properties are introspective misrepresentations.
  - **R's Prediction**: Even if introspection involves construction, the constructed property (the qualitative character) is real and not reducible to the representational content.

  **Note on Variants**: The illusionist position is not monolithic. The realist also is part of a family (e.g., non-reductive physicalists, panpsychists, etc.). Here, we have focused on the no-further-fact illusionism (iii) and a common form of realism (non-reductive physicalism). Other variants might shift the ground.

  **Conclusion**

  The deepest remaining crux, which underlies much of the debate, is whether the qualitative character of experience (what it is like) is fully explicable in functional and representational terms. If this crux were resolved, it would significantly alter the debate.

  \answer{The reducibility of qualitative character}
answer: |-
  ### Adversarial Collaboration Report on Phenomenal Consciousness  
  **Signed by Dr. A (Illusionist) and Dr. B (Phenomenal Realist)**  

  #### Preamble  
  This document arises from a year-long adversarial collaboration. Dr. A identifies as a *no-further-fact illusionist* (disambiguation iii): introspective reports track real, reportable mental states with functional/representational properties, but these states lack additional "phenomenal properties." Dr. B is a *non-reductive physicalist realist*: phenomenal properties are real, irreducible, and non-structural. Both agree the trichotomy (i–iii) clarifies key fault lines: (i) eliminativism and (ii) fictionalism are rejected by Dr. A as implausible (introspection tracks *something* real); (iii) is the core illusionist position. Dr. B notes realism encompasses diverse views (e.g., dualism, panpsychism), but all share a commitment to irreducible phenomenality. Below, we separate settled claims, disagreements, and testable cruxes.  

  ---  
  #### 1. Agreed Claims  
  *Substantive propositions both endorse, excluding vacuous or universally accepted claims (e.g., "consciousness is puzzling").*  

  1. **Introspective Judgments Exist and Are Systematic**: Humans generate reports (e.g., "I see red") that reflect real, causally efficacious mental states. These states are introspectively accessible, reportable, and play a role in cognition (e.g., guiding attention).  
  2. **The Meta-Problem Has a Causal Explanation**: Phenomenal discourse arises from evolved cognitive mechanisms. These include introspective models that represent perceptual states as having intrinsic qualities, error-prone attention systems, and conceptual frameworks shaped by language. This explains *why* we think/talk in phenomenal terms, regardless of whether such properties exist.  
  3. **Explanatory-Gap Arguments Are Inconclusive**: Arguments like Jackson’s knowledge argument or Levine’s explanatory gap highlight a *conceptual* disconnect between physical/functional accounts and phenomenal concepts. They do not establish dualism, non-physicalism, or the impossibility of a physicalist solution.  
  4. **No-Go Arguments Against Physicalism Are Defeasible**: The hard problem and the zombie argument show physicalism lacks an *intuitive* explanation, but they fail to prove it false. Empirical or conceptual advances could bridge this gap.  
  5. **Progress Requires Multidisciplinary Work**: Resolution demands:  
     - Empirical: Identifying neural correlates of consciousness (NCCs) and modelling introspection’s cognitive mechanisms.  
     - Conceptual: Clarifying terms like "phenomenal property" and "illusion."  
     - Both agree that NCCs alone will not settle the realism/illusionism debate.  

  ---  
  #### 2. Residual Disagreements  
  *Each side articulates disagreements; substantive vs. verbal assessments follow each pair.*  

  - **Dr. A’s Statement (Illusionist)**:  
    > "Our core dispute is ontological: introspection *misrepresents* functional/representational states as having ‘phenomenal properties.’ For example, when I report ‘seeing red,’ I am describing a representational state (of a red apple) and its functional role (in guiding behavior), but I erroneously attribute an intrinsic, non-structural ‘quale.’ This error stems from introspective models evolved for heuristic utility. There is no ‘further fact’ beyond what cognitive science describes. Dr. B’s realism reifies this error into an ontology."  
    **Substantive?**: Yes—it concerns what exists.  

  - **Dr. B’s Statement (Realist)**:  
    > "Dr. A conflates the structure of introspection with its object. When I report ‘seeing red,’ I am directly aware of a real, non-representational property: the subjective quality of redness. This quality cannot be reduced to functional or representational states, as identical functions could lack it (e.g., philosophical zombies). Dr. A’s view implies that introspection is globally unreliable, which undermines the first-person data grounding consciousness science."  
    **Substantive?**: Yes—it concerns the nature of first-person access.  

  - **Verbal Disagreement?**:  
    - **Partially verbal**: "Phenomenal property" is used differently. Dr. A uses it to denote a *supposed* non-structural property (which they deny); Dr. B uses it for a *sui generis* property (which they affirm). Both agree on the *target* of disagreement: what introspection *purports* to reveal.  
    - **Not merely verbal**: The core is whether this purported property is *real*. Dr. A sees it as a cognitive artifact; Dr. B as an ontological primitive.  

  ---  
  #### 3. Cruxes  
  *Sub-questions where settling one would move at least one side. Each includes a shared test/case and predictions.*  

  1. **Crux: Can a Complete Functional/Representational Account Explain Introspective Reports?**  
     - **Test**: Construct a computational model of a conscious system (e.g., a robot) that replicates human-like introspective reports (e.g., "I feel pain") based solely on functional/representational states, with no appeal to "qualia." Validate it against neuroscientific data (e.g., NCCs).  
     - **Dr. A’s Prediction**: Success would confirm illusionism; introspection is explained as heuristic self-modelling.  
     - **Dr. B’s Prediction**: Failure is inevitable; any such model will lack the subjective character driving reports, revealing an explanatory shortfall.  

  2. **Crux: Is Introspection Reliable About Its Own Objects?**  
     - **Test**: Empirical studies of metacognitive errors (e.g., inattentional blindness) where introspection misrepresents mental states. If systematic, generalize to whether introspection *as a whole* is globally trustworthy.  
     - **Dr. A’s Prediction**: Introspection is inherently error-prone; evidence will show it constructs "phenomenality" as a useful fiction.  
     - **Dr. B’s Prediction**: Errors are local; introspection is generally reliable about phenomenality (e.g., we don’t doubt pain reports).  

  3. **Crux: Do Zombies (Functional Duplicates Lacking Phenomenality) Violate Physical Laws?**  
     - **Test**: Philosophical analysis: If zombies are conceptually coherent without contradiction, physicalism is false. If they are incoherent, illusionism gains ground.  
     - **Dr. A’s Prediction**: Zombies are incoherent; functional duplicates must have identical introspective reports, so the "illusion" of phenomenality is inevitable.  
     - **Dr. B’s Prediction**: Zombies are coherent; functional properties don’t necessitate phenomenality, revealing an ontological gap.  

  ---  
  #### Final Notes  
  - **Settled vs. Contested**: Claims in §1 reflect consensus among researchers (e.g., Chalmers, Dennett) on the meta-problem and gap arguments’ limitations. Disagreements in §2–3 are genuinely contested.  
  - **Heterogeneity**: Illusionism is not monolithic: eliminativists (i) would reject §1.1; fictionalists (ii) would reframe §1.2. Realists vary (e.g., panpsychists vs. non-reductive physicalists), but all affirm irreducible phenomenality.  
  - **Deepest Crux**: The reducibility of qualitative character.  

  \answer{The reducibility of qualitative character}
