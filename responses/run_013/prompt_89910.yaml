  Based on your requirements—concrete scenarios, distinct fault lines, and mapping to real-world positions without jargon—here's a decision tree framework with 10 branching questions. It sorts readers into 8 core positions (with one "unstable" branch) and flags overlaps. No citations, no famous names, just the fault lines that split everyday intuition.

  ---

  ### **The Triage Decision Tree**
  *Answer instinctively. Each question builds on your prior choices to reveal your ethical framework.*

  1. **The Detour**  
     A train is heading toward a cliff, about to kill five workers. You can divert it to a side track where it will kill one worker. Do you divert?  
     - **A) Yes, save five lives**  
     - **B) No, let fate unfold**  

  2. **The Heavy Choice**  
     Now, the only way to stop the train is to push a stranger off a footbridge. His body will halt the train, saving five. Do you push him?  
     - **A) Push him to save five**  
     - **B) Do nothing**  

  3. **The Scalpel or the Stat**  
     You’re a surgeon. Five patients need organ transplants. A healthy patient is asleep in your clinic. Do you harvest their organs to save the five?  
     - **A) Yes, sacrifice one for five**  
     - **B) No, protect the healthy patient**  

  4. **The Pocket Change Sacrifice**  
     You can save five people by donating $100, ruining your favorite jacket. Do you donate?  
     - **A) Yes, save five**  
     - **B) No, keep your jacket**  

  5. **The Finger Dilemma**  
     You can save five people by losing one finger. Do you do it?  
     - **A) Yes, lose the finger**  
     - **B) No, keep your finger**  

  6. **The Stranger or Your Child**  
     In a fire, you can save either your child or five strangers. Which do you save?  
     - **A) Your child**  
     - **B) The five strangers**  

  7. **The Lottery Ticket**  
     Six patients need a ventilator: one in Room A, five in Room B. You have one ventilator. How do you allocate it?  
     - **A) Random draw (each has 1/6 chance)**  
     - **B) Weighted draw (Room B has 5/6 chance, Room A 1/6)**  
     - **C) Give to Room B (save the group of five)**  
     - **D) Give to Room A (save the one)**  

  8. **The Expiring Patient**  
     Two patients need a ventilator. One will die in a week regardless; the other could live 50 years. Who gets it?  
     - **A) The one dying soon**  
     - **B) The one with 50 years**  
     - **C) Flip a coin**  

  9. **The Certainty Tradeoff**  
     You can save 10 people for sure, OR take a 50% chance to save 25 people (and 50% save none). Which do you choose?  
     - **A) Save 10 for sure**  
     - **B) Risk it for 25**  

  10. **The Last Spot on the Boat**  
      You and one other person are drowning. A rescue boat has one spot left. Do you take it?  
      - **A) Yes, save yourself**  
      - **B) No, let the other person have it**  

  ---

  ### **Scoring Key: Your Triage Ethic**  
  Map your answers (e.g., 1A, 2B, 3A...) to one of these positions. Overlaps flagged where choices can’t fully distinguish views.

  | **Position**                          | **Diagnostic Answers**                                                                 | **Real-World Fit**                                                                 |
  |---------------------------------------|----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **1. Numbers Never Count**            | 1B, 2B, 3B, 7A, 8C                                                                    | Rejects counting lives. All deserve equal chance (coin flips/lotteries).          |
  | **2. Save the Many (Pure)**           | 1A, 2A, 3A, 4A, 5A, 6B, 7C, 8B, 9B                                                    | Maximizes lives saved. No special weight to proximity or relationships.           |
  | **3. Weighted Lottery**               | 1A, 2B, 3B, 7B                                                                         | Uses odds tilted—but not fixed—toward the larger group (e.g., 5/6, not 5x).      |
  | **4. Trivial Sacrifice**              | 4A + 5B                                                                                | Requires saving the many *only* if sacrifice is trivial (money, not limbs/lives). |
  | **5. Agent-Relative Duty**            | 6A *plus any pattern*                                                                  | Prioritizes personal ties (family/role) or direct responsibility. Dominates other views if triggered. |
  | **6. No Using as Means**              | 1A + 2B + 3B                                                                           | Allows indirect harm (diverting threats) but bans direct harm (pushing/harvesting). |
  | **7. Diminishing Value**              | 8B + 9A                                                                                | Each added life matters *less* (saving 10 for sure > 50% chance for 25).         |
  | **8. Numbers as Tiebreaker**          | 1A, 2B, 3B, 7C, 8B, 9A                                                                | Uses numbers only when all else is equal (e.g., same age, no relationships).      |
  | **UNSTABLE BRANCH**                   | Inconsistent pairs (e.g., 1A + 2B + 3A)                                                | Logically tense (e.g., bans pushing but allows harvesting). Rarely defended.      |

  ---

  ### **Key Notes for Your Piece**  
  - **Fused Positions:**  
    - *Weighted Lottery* and *Numbers as Tiebreaker* often overlap in practice (e.g., both may use lotteries when stakes are close). The tree splits them via Q7/Q8.  
    - *Agent-Relative Duty* overrides other principles (e.g., you’d save your child even if you’d otherwise "save the many").  

  - **Incoherent Branch ("Unstable")**:  
    Answers like 1A (divert train) + 2B (don’t push) + 3A (harvest organs) are logically unstable. Banning physical force but allowing surgical sacrifice is rarely defended.  

  - **Concrete > Abstract**:  
    Questions avoid labels ("deontology!") and use visceral stakes (fingers, jackets, your child) to force intuitive choices.  

  - **Why It Works**:  
    Each question pits two classic divides:  
    - Means vs. outcomes (Q2, Q3)  
    - Proximity vs. impartiality (Q6, Q10)  
    - Certainty vs. risk (Q9)  
    - Sacrifice scale (Q4, Q5)  
    - Group size vs. fairness (Q7, Q8)  

  This delivers 8-10 clear branches (depending on Q7 paths) and isolates core disagreements. Readers confront contradictions in their own instincts—e.g., *"I’d save the five by diverting a train (1A) but not by pushing (2B)... so what’s the difference?"*  

