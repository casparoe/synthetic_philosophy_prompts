  We are going to design a decision tree that branches based on concrete scenarios. The goal is to sort the reader into one of several distinct positions on triage ethics without using philosophical jargon. We'll use scenarios that capture the key fault lines.

   The positions we want to map to (with possible merging if they are not distinct in practice):

   1. Numbers Never Count (NNC): Always flip a coin or use a random method regardless of numbers.
   2. Utilitarian (UTIL): Always save the greater number (each counts for one, none for more than one).
   3. Numbers as Tiebreaker (TIE): Use numbers only when other factors are equal.
   4. Weighted Lottery (WL): Give each person a chance proportional to the stakes (so five people get 5/6 chance, one gets 1/6, but not 5 times better because then five would have 5/6 and one 1/6 which is 5:1).
   5. Trivial Sacrifice (TS): Numbers count unless the sacrifice required of the one is trivial (e.g., just a finger to save five lives) then you must do it.
   6. Agent-Relative (AR): What you must do depends on your role (e.g., a doctor vs. a bystander) or your relationships (e.g., saving your child).
   7. Deontological (DONT): You cannot use one person as a mere means to save others (even if it leads to more deaths).
   8. Diminishing Marginal Value (DMV): Each additional life saved is worth a bit less than the one before (so saving five lives isn't five times as valuable as saving one).

   However, note that some of these might overlap or be incompatible in the branches.

   We need to design a set of questions that force choices that differentiate these views.

   Let's design the tree:

   Question 1: The Classic Trolley Problem (to set the baseline)

     Scenario: You are standing by a railroad track. A runaway trolley is heading toward five workers. They will all die if the trolley continues. You can flip a switch to divert the trolley to a side track, where there is one worker who will be killed. If you do nothing, five die. If you flip the switch, one dies and five are saved.

     Choices:
       A) Flip the switch (save five, kill one)
       B) Do nothing (let five die, save the one)

     Why: This splits the classic utilitarians (A) from the deontologists (B) and others. But note: some might choose A for utilitarian reasons, some for others.

     However, note that many people choose A. So we need more to distinguish.

   Question 2: The Fat Man variant (to test using a person as a means)

     Scenario: Now, instead of flipping a switch, the only way to stop the trolley is to push a very large man off a footbridge and onto the track. He will die, but his body will stop the trolley, saving the five. You are standing next to him on the bridge.

     Choices:
       A) Push the man
       B) Do nothing

     Why: This is the "means" test. Many who would flip the switch won't push the man. This distinguishes the deontologists (who say you can't use a person as a means) from others.

     But note: some utilitarians might push, but others might not because of practical reasons (like uncertainty) but we are assuming certainty.

   Question 3: The Transplant Case (to test using a person as a means in a medical context)

     Scenario: You are a doctor. You have five patients, each dying of a different organ failure. A healthy person comes in for a checkup. You could save the five by killing the healthy person and distributing his organs.

     Choices:
       A) Do it: kill the one to save five.
       B) Don't do it: let the five die.

     Why: This is a classic case to test the "means" principle in a medical context. It also tests whether the medical role changes things (agent-relative).

   Question 4: The Drowning Child (to test personal involvement and cost)

     Scenario: You are walking by a shallow pond and see a child drowning. If you save her, you will ruin your expensive suit. Should you save her?

