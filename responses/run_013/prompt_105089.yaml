answer: |-
  Here’s the distilled specification for evaluating theories of personal identity, structured around cases, core requirements, and tensions. The goal is a theory that handles **all** cases coherently without ad-hoc fixes, while explaining *why* identity matters.

  ### **Core Test Cases**  
  1. **Ordinary Persistence**: Waking up tomorrow (baseline continuity).  
  2. **Interruptions**: Sleep, anesthesia, coma (temporary disruption of consciousness).  
  3. **Gradual Replacement**: Neuron-by-neuron substitution with silicon (continuity vs. material change).  
  4. **Teleporter (Destructive Copy)**: Original destroyed; replica built elsewhere (copying vs. identity).  
  5. **Fission**: Brain split into two equally continuous successors (one-to-many identity crisis).  
  6. **Distribution**: "Self" components spread across multiple brains/agents (decentered identity).  

  ---

  ### **Desiderata & Their Forcing Cases**  
  *(Non-negotiables in **bold**)*  

  1. **Ordinary Persistence Requirement**: *Must* deliver continuity in baseline cases (waking up).  
     - **Non-negotiable**: Failure here disqualifies the theory.  
     - *Forces*: A theory must capture intuitive "sameness of self" over time.  

  2. **Disruption Tolerance**: Must explain identity survival through coma/anesthesia.  
     - **Non-negotiable**: Rejecting this implies death during sleep.  
     - *Forces*: Identity can’t require constant consciousness.  

  3. **Material Independence**: Must handle gradual replacement (e.g., silicon neurons) without identity loss.  
     - *Forces*: Rejecting substance essentialism; psychological continuity > biological matter.  
     - *Negotiable*: Animalists reject this; others treat it as pivotal.  

  4. **Copy Intuition**: Teleporter replica is *you* (psychologically continuous).  
     - *Forces*: Numerical identity ≠ survival value. What matters is first-personal continuation of consciousness/memory.  
     - *Tension*: If replica is you, why isn’t the original’s destruction murder?  

  5. **Fission Non-Arbitrariness**: Must avoid privileging one fission successor without justification.  
     - **Non-negotiable**: Asymmetric treatment is ad-hoc.  
     - *Forces*: Either identity isn’t one-to-one, or identity ≠ what matters.  

  6. **Distribution Compatibility**: Must accommodate partial/perspective-sharing selves (e.g., shared memories/agency).  
     - *Forces*: Rejecting a "single brain" criterion; selves as potentially decentralized.  
     - *Tension*: Challenges the "atomic self" assumption.  

  7. **Neuroscience Constraint**: Must engage with neural correlates of consciousness, brain plasticity, and split-brain cases.  
     - **Non-negotiable**: Can’t hand-wave embodiment (e.g., ignore that memories are physically realized).  

  8. **Why Care? Requirement**: Must explain *why* identity matters to survival (e.g., fear of death vs. indifference to copies).  
     - **Non-negotiable**: Stipulative definitions (e.g., "identity is biological") without normative force fail.  
     - *Forces*: Linking metaphysics to ethics of survival.  

  9. **Degreed Continuity Acceptance**: Must allow for vagueness (e.g., dementia, partial distribution).  
     - *Forces*: Rejecting all-or-nothing identity; survival admits of degrees.  

  ---

  ### **Key Tensions (Jointly Unsatisfiable Desiderata)**  
  Your suspicion is correct: **Distribution + One-to-One Identity + Copy Intuition** creates a trilemma.  
  - **Distribution** suggests selves can be multi-located/decomposable.  
  - **One-to-One Identity** demands a single, unified entity.  
  - **Copy Intuition** implies survival through perfect duplication.  
  **→ Conflict**: If a distributed self is one entity spread across many brains (violating one-to-one), or many entities sharing a "self," copies threaten either redundancy (if identity is strict) or fragmentation (if degreed). Accepting distribution *forces* degreed continuity or bundle theories, undermining "strict" numerical identity.  

  ---

  ### **Theories vs. Desiderata (Brief)**  
  - **Psychological Continuity (PC)**:  
    - ✅: Gradual replacement, teleporter copies, fission (if degreed), why care.  
    - ❌: Fission (if demanding one-to-one), distribution (if requiring a unified psychology), neural constraints (ignores embodiment).  
    - *Tension*: Struggles with distribution unless it embraces radical degreedness.  

  - **Animalism**:  
    - ✅: Ordinary persistence, coma, neural constraints (embodied).  
    - ❌: Rejects gradual replacement, teleporters, fission survival, copy intuition. Fails "why care?" for non-biological continuity.  

  - **Perdurantism (4Dism)**:  
    - ✅: Fission (partial identity), distribution (temporal parts in multiple locations), gradualism.  
    - ❌: Violates "one self" intuition; struggles to explain why *present* self should fear death if future parts exist.  

  - **No-Self/Bundle Theory**:  
    - ✅: Distribution, fission, degreed continuity, explains attachment to copies.  
    - ❌: Struggles with ordinary persistence ("why do I wake up as *me*?"); may trivialize survival (no "I" to persist).  

  ---

  ### **Summary of Pressure Points**  
  1. **Distribution + Fission** force abandonment of one-to-one numerical identity.  
  2. **Copy Intuition + Material Independence** force psychological criteria over biological.  
  3. **Why Care?** demands that theories don’t reduce identity to a verbal dispute.  
  4. **Neuroscience** prevents dualist escapism; selves are (at least) physical processes.  

  **The core trade-off**: Theories must choose between strict numerical identity (sacrificing distribution/fission) or degreed/relational identity (sacrificing the "single self" intuition). No theory satisfies all desiderata without cost—which is why the seminar will be lively.
