prompt: |-
  A colleague in our history-of-science reading group circulated the following summary of the debate over simultaneous discovery, and I would like to know how much of it I can trust. The summary reads: ‘Newton and Leibniz invented calculus independently, and Darwin and Wallace discovered natural selection independently. Cases like these show that discovery is inevitable: when the time is ripe, the same idea occurs to several people at once, so the individual discoverer is largely a myth. It follows that priority disputes are meaningless and that awarding credit to one person rather than another is a mistake; we should treat scientific progress as anonymous.’ I am inclined to agree that credit is often arbitrary, but something about the inference from ‘independent discovery’ to ‘inevitability’ seems too quick. Please audit the summary for me. In a section titled ‘Verdict in brief’ (2–3 sentences), say whether the summary is broadly fair. Then, under ‘What the summary gets right’ (about 150 words), identify the accurate claims. Under ‘Where it overreaches’ (about 300 words), explain the subtle errors—especially any conflations or inferences that do not follow—and what a historian or philosopher of science would object to. Finally, under ‘What follows for credit’ (about 150 words), say whether the summary’s conclusion about priority and credit survives your corrections, and what a more defensible position would be.
