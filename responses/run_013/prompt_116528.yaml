     - Omega: in tails, don't pay -> save $100 but don't get $10,000 in heads (because predictor predicted correctly).
     - Blackmail: don't pay.
     - Commitment that hurts most: in Omega, missing out on the $10,000 in heads because you didn't precommit to paying in tails.

  But note: in the Myopic position, you never had the chance to precommit. So it's not that you didn't precommit, it's that you couldn't. So the hurt is unavoidable.

  Also, are there any positions the tree doesn't separate? For example, a position that believes in the predictor and can precommit, but then in the blackmail pays? We have no rational reason for that.

  And any answer-combination unexplored? 

  - Feasibility=No and then the next question (precommitment) is irrelevant. We go to Skeptic.

  - Feasibility=Yes and precommitment=Yes -> Precommitter.

  - Feasibility=Yes and precommitment=No -> Myopic.

  So no unexplored nodes.

  But what about a position that believes in the predictor and cannot precommit, but then in the tails scenario pays anyway? That would be irrational because there's no benefit. So it's unexplored because irrational.

  Alternatively, a position that pays in the blackmail? We have no branch for that because it's dominated. So it's not included.

  Therefore, the decision tree:

  ```
                                  [Feasibility of predictor in Omega?]
                                   /                                  \
                                  No                                    Yes
                                  |                                      |
                               Skeptic                             [Can precommit in Omega?]
                                                                   /               \
                                                                  Yes               No
                                                                  /                   \
                                                          Precommitter           Myopic Decision Theorist
  ```

  Leaves:

  - **Skeptic**: Doesn't believe the predictor is accurate, so in Omega doesn't pay in tails and in blackmail doesn't pay. The commitment that hurts most: missing out on Omega's $10,000 if the predictor is real and accurate.

  - **Precommitter**: Believes the predictor and can precommit, so in Omega commits to paying in tails to get $10,000 in heads; in blackmail doesn't pay. The commitment that hurts most: the $100 loss in the tails scenario of Omega, but that's the cost of the policy that gets the $10,000 in heads.

  - **Myopic Decision Theorist**: Believes the predictor but cannot precommit, so in the tails scenario of Omega doesn't pay (because there's no direct benefit) and in blackmail doesn't pay. The commitment that hurts most: missing out on the $10,000 in heads because of the inability to commit.

  Note: In the blackmail, all positions don't pay. The tree doesn't need to branch for blackmail because the rational decision is always not to pay.

  Also, there is no leaf that pays in the blackmail. Any position that pays in the blackmail would be making a mistake in expected utility calculation.

  This tree separates the main positions. But note: the Precommitter leaf encompasses both EDT and CDT if they are able to precommit, because in the precommitment stage both would choose to commit to paying.

  However, if we want to separate EDT and CDT in the precommitment stage, we might add a branch at the precommitment node:

  After "Can precommit in Omega? (Yes)":

     Q: In the precommitment stage, do you see your commitment as causing the predictor's prediction? (Causal) or as evidence of the prediction? (Evidential) -> but both lead to the same action (commit to paying).

  So we don't branch.

  Therefore, the tree as above.
