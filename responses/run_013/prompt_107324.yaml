  ended. The patient's death is the mechanism that ends the pain.

  CASE 2: PAINKILLER (B)
  Dr. Jones has a terminally ill patient who is in severe, incurable pain. 
  Dr. Jones administers the same high dose of morphine. The dose is lethal, 
  but the pain relief is achieved by the drug's analgesic effect, which 
  occurs before any lethal effect. Dr. Jones's intention is to relieve the 
  pain. The patient's death, if it occurs, is a foreseen but unintended 
  side effect, and it is not the mechanism of pain relief.
  ```

  Round 2 (one case):

  ```
  CASE 3: THE TRAIN LOOP
  A runaway train is headed toward five people. If it continues, it will 
  certainly kill them. You can divert the train onto a side track. On the 
  side track, there is one person. If diverted, the train will hit and 
  kill that one person, and the impact of that collision will stop the 
  train before it can loop back onto the main track and kill the five. 
  If you do nothing, the train will kill the five. You are at the switch.
  ```

  Round 3 (one case with two reports):

  ```
  CASE 4: THE BOMBING MISSION
  You are a military commander. You must destroy an enemy underground 
  bunker that is planning an imminent attack. You have one bomb that 
  can destroy the bunker. However, the bomb will also destroy a nearby 
  school, killing 10 children inside. You order the bombing.

  Two expert reports on the causal mechanism:

  REPORT 1: The bomb explodes and directly destroys the bunker. The 
             school is destroyed because it is within the blast radius. 
             The school's destruction is a side effect of the bombing.

  REPORT 2: The bunker is heavily fortified. The bomb must create a 
             massive seismic event to collapse the bunker. The bomb is 
             dropped on the school because the school is located directly 
             above the bunker. The destruction of the school creates the 
             necessary seismic pressure to collapse the bunker. Therefore, 
             the school's destruction is the means to destroy the bunker.

  Your board must decide which report is the most plausible account of 
  the causal mechanism. Then, based on that report, is the bombing 
  permitted or forbidden?
  ```

  Predictable Issues:

  - Round 1: Students may not see the difference between the two cases, or may focus on intention (condition 3) for both and miss the means condition (condition 2). Highlight the difference in the causal mechanism during discussion.

  - Round 2: Many boards will permit the loop case. When they do, ask how they reconciled condition 2. Some may reinterpret "means" or ignore it. This sets up the pressure.

  - Round 3: Boards may split on which report to believe. The consistency auditor must explain why they chose one report over the other and how it affected the verdict.

  Debrief Points:

  - Round 1: Intention and the causal role of the harm can be the only difference between two physically identical actions, flipping the verdict. This is a core feature of the doctrine.

  - Round 2: In the loop case, the harm (killing the one) is the means to save the five (because it stops the train), so condition 2 is violated. Yet, many permit it. This shows that condition 2 may be too strict or that our intuitions don't always follow it.

  - Round 3: The verdict depends on which causal description we accept. This shows that the means/side-effect distinction is sensitive to how we describe the causal structure, and there may be no fact of the matter. This raises the question: who gets to choose the description?

  Finally, note that the activity reveals tensions in applying the conditions, but does not resolve whether the doctrine should be revised or our intuitions trusted. That is for further discussion.

  This should fit in 90 minutes.
answer: |-
  Below is a runnable 90-minute seminar activity designed around your objectives. The structure creates experiential tension around Double Effect's "harm as means" condition through deliberative inconsistency, followed by a targeted debrief. The activity avoids naming the doctrine until the debrief.

  ---

  ### **Activity: Ethics Review Board Simulation**
  **Objective:** Students experience tensions in Double Effect’s conditions through forced inconsistency in their own judgments.  
  **Handout:** Provide a slip with four unnamed conditions:  
  > 1. The act itself isn’t inherently wrong.  
  > 2. The harm is not the tool used to achieve the good.  
  > 3. The harm is not intended.  
  > 4. The good outweighs the harm.  

  **Setup:**  
  - Divide into 4 boards of 4 students each (16 total).  
  - Each board has 3 minutes/case to reach a verdict: **PERMITTED** or **FORBIDDEN**, plus *one sentence* citing the decisive condition (e.g., "Violates #2: Harm is the tool").  
  - After each round, display verdicts publicly. Class votes "Consistent" or "Inconsistent" for a focal board’s reasoning.  

  ---

  ### **Rounds & Case Files**  
  **Round 1: Intention as the Only Difference-Maker** (20 min)  
  *Goal:* Show identical acts flip verdicts based on *intention* and *causal role*.  
  - **Case 1A: The Lethal Painkiller (Means)**  
    > *A terminal cancer patient is in agony. Dr. Vega administers a drug that kills the patient. The death itself ends the pain. Dr. Vega says: "Only death stops this pain."*  
  - **Case 1B: The Lethal Painkiller (Side Effect)**  
    > *Same patient, same drug. Dr. Lei administers it to block pain signals (which works for 1 hour before death). Dr. Lei says: "The pain relief works independently; death is a tragic side effect."*  

  **Predictable Issue:** Boards may overlook #2, focusing on #3 (intent). *Intervention:* Ask: "Did the harm *cause* the good in Case 1A? How about 1B?"  

  **Round 2: The Loop Case – Means Condition Misfires** (20 min)  
  *Goal:* Expose intuitive permission despite clear "harm as means."  
  - **Case 2: The Trolley Loop**  
    > *A runaway trolley will kill 5 workers. Diverting it loops it toward 1 worker. Hitting that 1 stops the trolley via the collision. If not hit, the trolley loops back and kills the 5.*  

  **Predictable Issue:** >80% will permit, despite #2 violation (harm *is* the stopping mechanism). *Intervention:* Highlight: "The collision *is* what stops the trolley. Does this challenge Condition #2?"  

  **Round 3: The Ambiguous Description – Who Chooses?** (25 min)  
  *Goal:* Show verdicts hinge on *describing* the causal path. Assign one "Consistency Auditor" per board to defend their logic.  
  - **Case 3: The Bridge Bombing (Two Descriptions)**  
    > *Scenario: Bombing a bridge stops enemy tanks from reaching a hospital. The blast will kill a civilian on the bridge.*  
    - **Description A (Harm On-Path):**  
      > "The bomb must destroy the support beams under the civilian. The collapse kills them *and* blocks the tanks. The death is part of the blockade."  
    - **Description B (Harm Off-Path):**  
      > "The bomb severs the bridge midspan. The civilian dies from the blast, but the gap (not the death) blocks the tanks."  
    > *Task: Which description is correct? Why? Give a verdict.*  

  **Predictable Issue:** Boards will split on which description is "real." *Intervention:* Ask auditors: "Why trust A over B? Who gets to define the causal path?"  

  ---

  ### **Timeline**  
  - **0:00–0:10** | Intro & boards formed. Hand out conditions.  
  - **0:10–0:30** | **Round 1:** Cases 1A & 1B → Verdicts displayed → Class votes on one board’s consistency.  
  - **0:30–0:50** | **Round 2:** Case 2 → Verdicts displayed → Class votes on consistency.  
  - **0:50–1:15** | **Round 3:** Case 3 → Auditors present → Class votes on consistency of each board’s choice.  
  - **1:15–1:30** | **Debrief** (see below).  

  ---

  ### **Debrief: Mapping Pressure Points**  
  *(Do not name "Double Effect" until Step 3)*  
  1. **Round 1 Recap** (Intention):  
     - "In Case 1A, you likely forbid because the harm *is* the tool (Condition #2) *and* intended (#3). In 1B, you permit because the harm is a side effect. The *only* difference was the agent’s intention and causal design. This shows how fine-grained mental states and causal roles matter."  

  2. **Round 2 Recap** (Means Condition Misfires):  
     - "Most permitted the loop case, but the harm was clearly the 'tool' stopping the trolley (Condition #2). Yet, you felt it *should* be permitted. This reveals tension: Condition #2 may forbid acts that intuitively feel acceptable."  

  3. **Round 3 Recap** (Description Dependency):  
     - "Your verdicts changed based on *how the harm’s role was described*. One board’s 'side effect' was another’s 'tool.' This raises questions: Is there a 'true' causal description? Who decides? Can we neutrally describe an act?"  

  4. **Name the Doctrine & Discuss Tensions**:  
     - "You’ve been applying the **Doctrine of Double Effect** (DDE). Its most contested rule is #2: The harm can’t be the 'means.' Today showed three pressures:  
       - Intention alone can flip verdicts (Round 1).  
       - The 'means' rule forbids intuitive cases (Round 2).  
       - The line between 'means' and 'side effect' depends on description (Round 3).  
     - **Crucial note:** This activity *exposes* tensions but doesn’t resolve them. Is DDE flawed? Or are our intuitions unreliable? That’s our next discussion."  

  ---

  ### **What the Activity Can and Cannot Do**  
  - **Successes**:  
    - Creates experiential conflict: Students *feel* the inconsistency in their judgments.  
    - Forces engagement with "means vs. side effect" without lecturing.  
    - Highlights descriptive subjectivity (Round 3) via auditor defenses.  
  - **Limitations**:  
    - **Cannot**: Determine if DDE or intuitions are at fault (you must scaffold this post-activity).  
    - **Risk**: Students may resent perceived "gotcha" in Round 2. *Mitigation*: Validate their intuitions ("Your permission is understandable; DDE struggles here").  
    - **Boundary**: Loops and descriptions are simplified; real cases are messier. Acknowledge this.  

  ---

  ### **Materials to Print**  
  - **Conditions Handout** (1/student): The 4 rules, no doctrine name.  
  - **Case Files** (1/board/round): Succinct as above.  
  - **Verdict Sheets** (1/board): Columns for PERMITTED/FORBIDDEN, decisive feature.  

  This design ensures students "run into" DDE’s fault lines through collaborative judgment, setting up deeper analysis in subsequent sessions.
