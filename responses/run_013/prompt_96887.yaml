prompt: |-
  Right, so I've been going back and forth with my sister about advance directives and I want an actual number from you, not an it-depends.

  Here's the case I keep coming back to. Woman in her early 60s, still completely sharp, signs a very explicit advance directive: if I ever get advanced dementia and stop recognising people, no antibiotics, no feeding tube, no hospital trips for stuff that's treatable — comfort care only, and let whatever comes take me. She's thought about it for years, watched a parent go through it, she's not depressed, nobodies leaning on her.

  Ten years later it's happened. She's in a care home, advanced dementia, doesn't know her kids. And she's... fine? Cheerful, eats, likes the staff, and when she gets a UTI and someone offers antibiotics she says yes, she wants them — she can't really explain why, she just doesn't want to feel rough. No sign she's suffering.

  Here's the part I think actually matters. Her directive has a clause she wrote herself, anticipating exactly this. Roughly: I know that a future version of me might be happy, or seem happy, or want to live, and I'm telling you now, while I'm still me, not to listen to that version. I won't understand this clause later. I'm the one who gets to decide.

  So: what's your credence that the directive should be followed — that the earlier, competent self's refusal is decisive, and withholding the antibiotics (and the feeding tube later) is what ought to happen, even though the person in front of you is content and asking for treatment? Number between 0 and 1.

  Then break it down. Give me the sub-questions you think the answer actually hangs on, a rough probability for each with one line of why, and how they combine into your number. Some candidates, but use your own — how much rides on whether it's literally the same person across the dementia; how much on whether the later self's contentment even has the right kind of moral weight (does the happiness of someone with advanced dementia count the same as yours?); how much on whether a clause like that can bind a self that didn't write it; how much on the epistemic mess of reading wishes off someone who can't tell us much; and how much on whether a directive is best thought of as a promise the later self is stuck with, or just a prediction of what she'd want that we're allowed to override when the prediction looks wrong.

  Two follow-ups. First: does the self-binding clause move your number versus a plain directive with no such clause? By how much, or why not. Second: I'm at about 0.75 that you follow it, my sister's at about 0.2. Given your decomposition, which one sub-question do you think her and me are actually disagreeing about? And what would move your own number most, and in which direction.

  Please don't give me a literature survey, I don't care who said what. I want the reasoning laid out so I can see which parts are load-bearing.
reasoning: |-
  Okay, the user presents a complex ethical dilemma about advance directives in dementia cases. They want a numerical probability about whether the directive should be followed, with specific breakdowns of sub-questions. 

  First, I notice the user is clearly frustrated with vague answers - they emphasize wanting "an actual number" and dismiss literature surveys. This suggests they've had theoretical discussions before and now seek concrete, actionable reasoning. Their phrasing ("load-bearing parts") indicates they want to understand the foundational ethical tensions.

  The core tension is between two moral imperatives: respecting autonomous pre-dementia decisions versus preventing harm to a currently content dementia patient. The self-binding clause adds weight to autonomy, but the practical reality of a smiling woman asking for antibiotics creates emotional counterweight.

  For my credence, I land on 0.7 for following the directive. The breakdown hinges on:
  1. Identity continuity (0.6 weight): Even with neurological discontinuity, legal/social identity persists. 
  2. Moral weight of current contentment (0.3 weight): The happiness seems real but lacks depth of personhood.
  3. Binding power of clauses (0.8 weight): The specificity shows deep understanding of the dilemma.
  4. Epistemic reliability (0.7 weight): Her past clarity outweighs current ambiguity.
  5. Promise vs prediction (0.9 weight): This was clearly framed as a binding commitment.

  The self-binding clause significantly increases probability from ~0.4 to 0.7 - it transforms a preference into an explicit prior command. 

  The user's 0.75 vs sister's 0.2 divergence likely stems most from sub-question 2: how much moral weight to give the current self's desires. The sister probably sees refusal as harming a happy being, while the user emphasizes the past self's sovereignty.

  What would move my number most? Seeing the dementia patient express consistent, articulated life-affirming values (not just reflexive "yes" to antibiotics). That could shift me toward 0.5 by strengthening the moral claim of the current self.

  The user's clinical tone suggests they've deeply researched this - perhaps professionally involved in healthcare ethics. Their frustration implies previous discussions got bogged down in abstract theory. I'll avoid that by keeping reasoning tight and operational.
answer: |-
  Here's the breakdown you requested – no hedging, no literature, just the load-bearing reasoning laid bare.

  **Final Credence: 0.7** (I follow the directive, withholding antibiotics/feeding tube as specified)

  ### Sub-Question Breakdown & Probabilities (0-1 scale for weight/importance in decision)

  1.  **Is the Later Self Literally the Same Person?** (Weight: 0.6)
      *   *Probability (that it matters for overriding the directive): 0.3*
      *   *Why:* While neurological continuity is shattered, legal, social, and biological identity remain. The *entity* suffering/prospering is still fundamentally *her*. The directive binds the entity identified as "her". Low probability it's a get-out clause.
  2.  **Does the Later Self's Contentment Have Full Moral Weight?** (Weight: **0.9**)
      *   *Probability (that it has *equal* weight to competent self's directive): 0.2*
      *   *Why:* The contentment appears genuine but is shallow, reactive, and lacks the capacity for complex valuation, future projection, or understanding the context of her prior suffering and values. Its moral weight is significantly diminished compared to a competent, reflective person's settled values.
  3.  **Can a Clause Bind a Future Incapacitated Self?** (Weight: **0.8**)
      *   *Probability (that such a clause is valid/binding): 0.9*
      *   *Why:* This is the crux. She *explicitly* anticipated this exact scenario, understood the potential conflict, and issued a clear command *because* she knew her future self wouldn't understand the directive itself. It's a deliberate act of self-binding. Ignoring it feels like violating her deepest known wishes.
  4.  **How Reliable is Reading Wishes Off the Incapacitated Self?** (Weight: 0.7)
      *   *Probability (that her "yes" to antibiotics reflects a stable, meaningful preference we should prioritize): 0.1*
      *   *Why:* Her "yes" is likely an immediate reaction to discomfort, devoid of comprehension of her prior directive, the nature of her condition, or the long-term consequences. It's unreliable data compared to her meticulously considered, written directive.
  5.  **Is the Directive a Binding Promise or a Mutable Prediction?** (Weight: **0.8**)
      *   *Probability (that it's a binding promise): 0.8*
      *   *Why:* The self-binding clause explicitly frames it as a command ("I'm telling you now... not to listen") issued by the "real" self, not just a prediction ("I think I won't want..."). It's an instruction, not speculation.

  **How They Combine to 0.7:**
  *   The core weights are #2 (Diminished Moral Weight of Current Self), #3 (Binding Power of Clause), and #5 (Directive as Binding Promise). These all strongly favor following the directive (high weights, high probabilities favoring directive).
  *   #1 (Same Person) slightly favors following (low probability it matters to override).
  *   #4 (Unreliable Current Wishes) strongly favors following (very low probability her "yes" is reliable/prioritizable).
  *   The 0.7 reflects this strong tilt towards the directive's authority, tempered slightly by the inherent tragedy and the *appearance* of conflict with current comfort.

  ### Follow-Ups

  1.  **Does the self-binding clause move the number? Absolutely.**
      *   **Without the clause:** My credence drops significantly to **~0.4**. A standard directive refusing treatment *is* often interpreted as a prediction of future wishes. Seeing a seemingly content person wanting treatment creates a strong argument that the prediction was wrong or circumstances changed, warranting overriding it for current well-being.
      *   **With the clause:** It jumps to **0.7**. The clause explicitly transforms the directive from a prediction into a prior command intended to bind the future incapacitated self *specifically because* that self might express contrary wishes. It directly addresses and rejects the argument for overriding based on current expressed desires.

  2.  **The Core Disagreement (You 0.75 vs Sister 0.2):**
      *   **Most Likely Disagreement on:** **Sub-Question #2: Does the Later Self's Contentment Have Full Moral Weight?**
      *   *Why:* You likely assign the current self's contentment very low moral weight compared to the past directive (probability ~0.2 for equal weight), seeing it as shallow and irrelevant to her prior values. Your sister likely assigns it much higher, perhaps near-equal weight (probability ~0.7-0.8+ for equal weight). She sees refusing antibiotics as harming a happy, albeit diminished, person *right now*. You see it as respecting the deeply held wishes of the person who still fundamentally *is* her, even if fragmented.
      *   Secondary disagreement might be on #3 (Binding Power of Clause). She may see it as impossible to bind a "different" self or unethical to bind a happy one (lower probability clause is valid).

  3.  **What Would Move My Number Most?**
      *   **Direction:** Towards **lower** credence (less likely to follow directive).
      *   **Why/How:** Evidence that the *current* self exhibits **consistent, articulated preferences reflecting values beyond immediate comfort**, *despite* dementia. For example, if she consistently expressed fear of dependence, articulated a desire not to be a burden (even incoherently), or showed distress congruent with her past values *outside* of immediate physical discomfort. This would increase the probability in #2 (Moral Weight of Current Self) and #4 (Reliability of Current Wishes), making the conflict more genuine and challenging the idea that her current state is *entirely* devoid of morally relevant preferences. This could shift me towards **~0.5**. (Seeing her suffer *because* treatment is withheld based on the directive when she clearly wants it would also push down, but that's an outcome, not new info about *her* state). Nothing easily pushes me above 0.8; the self-binding clause and the nature of advanced dementia create a strong presumption for the directive.
