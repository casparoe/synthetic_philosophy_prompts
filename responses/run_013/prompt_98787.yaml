prompt: |-
  I serve on the performance and accountability committee of a state health authority. We are being asked to adopt a new funding-linked metric for community mental-health clinics: the proportion of patients discharged from an inpatient psychiatric unit who attend a follow-up appointment within seven days. The clinical rationale is strong, but our pilot data are troubling. Some clinics appear to have improved the number by scheduling five-minute telephone check-ins that do not involve a prescriber, by discharging patients later so that the follow-up window is easier to meet, and by steering patients with complex needs to other providers. The committee must decide whether to adopt the metric as proposed, adopt it with modifications, or reject it. I need to circulate a written recommendation before the next meeting.

  Draft the memo. It should recommend a concrete course of action, with a time frame and specific conditions if you recommend adoption. Use Goodhart's law and the concept of specification gaming as the analytical frame, not as slogans. Distinguish three ways a proxy can fail: regressional failure, where the proxy is only imperfectly correlated with the underlying goal; extremal failure, where optimizing hard on the proxy pushes the system into a region where the correlation breaks down; and causal failure, where pursuing the proxy changes the underlying goal itself. Say which of these the pilot data illustrate, and what each implies for the design of the metric. Distinguish gaming from genuine improvement, and say how the committee can tell the difference in practice. Address the strongest objection to your recommendation: that any quantitative target will eventually be gamed, so the committee should abandon funding-linked metrics and rely instead on professional judgment and qualitative review. Take that objection seriously, say what is right and wrong in it, and explain why your recommendation is better. The memo should be usable by the committee: a clear bottom line, reasons the clinics and the public could understand, and safeguards that could actually be implemented, such as paired outcome measures, risk adjustment, audit of a random sample, patient-reported measures, a shadow metric not tied to funding, and a sunset or review clause. Do not provide a bibliography or citations; I need the argument, not the literature. Aim for roughly 1,000 to 1,500 words.
reasoning: |-
  Okay, the user is on a state health authority committee and needs to draft a memo about adopting a new funding-linked metric for mental health clinics. The metric in question is the proportion of patients discharged from inpatient psychiatric units who attend a follow-up within seven days. 

  The clinical rationale makes sense - continuity of care post-discharge is critical for preventing relapse and readmission. But the pilot data shows clinics are gaming the system: scheduling meaningless 5-minute phone calls, delaying discharges to manipulate the window, and cherry-picking patients by offloading complex cases. This is textbook Goodhart's Law in action - when a measure becomes a target, it ceases to be a good measure.

  The user specifically wants me to frame the analysis around three types of proxy failure: regressional (imperfect correlation), extremal (correlation breaks under optimization pressure), and causal (proxy changes the goal itself). Looking at the pilot data:
  - The 5-minute calls are extremal failure - they technically meet the metric but destroy its clinical intent.
  - Delayed discharges might be causal failure if it actually harms patients by keeping them hospitalized unnecessarily.
  - Risk selection is regressional failure because the metric doesn't account for patient complexity.

  The memo needs concrete recommendations. Adoption as-is would be disastrous given the gaming evidence. But outright rejection wastes a clinically valuable idea. The smart path is conditional adoption with safeguards: 
  - Pair it with outcome measures like 30-day readmission rates
  - Require minimum appointment standards (e.g., in-person with prescribing clinician)
  - Implement risk adjustment for patient complexity
  - Add random audits of appointment quality
  - Sunset clause forcing review in 12-18 months

  For the "all metrics get gamed" objection: They're right that gaming is inevitable, but wrong that we should abandon metrics entirely. Quantitative targets create accountability and drive systemic improvement when designed well. The solution isn't abandoning metrics but building anti-gaming defenses - which my recommendation does through multiple complementary safeguards.

  The tone must be committee-ready: decisive but not dogmatic. Clinics will push back, so the reasoning should be transparent about both clinical benefits and implementation risks. Public accountability matters here - taxpayers fund this, and patients' lives are at stake.
answer: |-
  **MEMORANDUM**  
  **TO:** Performance and Accountability Committee  
  **FROM:** [Your Name/Title]  
  **SUBJECT:** Recommendation on Adoption of 7-Day Follow-Up Metric for Mental Health Clinics  
  **DATE:** [Current Date]  

  ---

  ### **I. RECOMMENDATION**  
  **Adopt the 7-day follow-up metric, but only with four critical modifications and a 12-month sunset clause.** Implementation will be contingent on:  
  1. **Pairing** the metric with a clinical-outcome measure (e.g., 30-day readmission rates).  
  2. **Risk adjustment** for patient complexity.  
  3. **Minimum standards** for follow-up appointments (e.g., ≥15 minutes, prescriber involvement for medication management).  
  4. **Random audits** (5% of cases) to verify appointment quality and patient acuity.  
  **Time frame:** Launch modified metric in Q1 next year, with mandatory review at 12 months to evaluate gaming or unintended consequences. If significant gaming persists, the metric will be automatically suspended.  

  ---

  ### **II. ANALYSIS: THE RISK OF SPECIFICATION GAMING**  
  The clinical intent—reducing relapse and readmission through timely post-discharge care—is sound. However, the pilot data reveals systemic attempts to game the metric, illustrating **Goodhart’s Law**: "When a measure becomes a target, it ceases to be a good measure." Gaming occurs when clinics optimize for the *proxy* (7-day follow-up rate) rather than the *goal* (continuity of care). We observe three distinct failure modes:  

  1. **Regressional Failure**  
     - *Definition:* The proxy (follow-up rate) is imperfectly correlated with the true goal (effective care continuity).  
     - *Pilot Evidence:* Clinics steering high-acuity patients to other providers. These patients most need robust follow-up but are excluded to inflate rates artificially.  
     - *Implication for Design:* Metrics must be **risk-adjusted** to account for patient complexity (e.g., comorbidities, homelessness history). Excluding high-need patients undermines public health goals.  

  2. **Extremal Failure**  
     - *Definition:* Intense optimization pushes the system into conditions where the proxy breaks (e.g., technically "meeting" the metric while violating its intent).  
     - *Pilot Evidence:* Scheduling 5-minute non-prescriber calls that lack clinical value; delaying discharges to shorten the follow-up window.  
     - *Implication for Design:* Define **minimum standards** for what constitutes a valid follow-up (e.g., duration, clinician type) and use **audits** to detect superficial compliance.  

  3. **Causal Failure**  
     - *Definition:* Pursuing the proxy alters the underlying goal (e.g., clinics deprioritizing care quality to chase targets).  
     - *Pilot Evidence:* Late discharges disrupt inpatient bed availability and may prolong patient exposure to institutionalization risks.  
     - *Implication for Design:* **Pair the proxy with outcome measures** (e.g., readmissions) to ensure gaming does not degrade actual care.  

  ---

  ### **III. DISTINGUISHING GAMING FROM GENUINE IMPROVEMENT**  
  *Gaming* manipulates the metric without advancing the goal (e.g., 5-minute calls). *Genuine improvement* enhances both metric and goal (e.g., streamlined scheduling). The committee can detect gaming by:  
  - **Audits:** Randomly review records for appointment depth, clinician qualifications, and patient appropriateness.  
  - **Outcome Correlations:** Track if rising follow-up rates *reduce* readmissions (true improvement) or correlate with *increased* discharges of complex patients (gaming).  
  - **Patient Feedback:** Embed brief post-appointment surveys on care quality (e.g., "Did you discuss medication changes?").  

  ---

  ### **IV. ADDRESSING THE STRONGEST OBJECTION**  
  *Objection: "All quantitative targets will be gamed. We should abandon metrics and rely on qualitative review and professional judgment."*  

  **What’s Right:**  
  - Gaming is inevitable under high-stakes targets.  
  - Clinician judgment is irreplaceable for nuanced care.  

  **What’s Wrong:**  
  - Purely qualitative review lacks transparency, invites bias, and impedes system-wide accountability.  
  - Unmeasured performance perpetuates inequities—e.g., clinics serving marginalized groups may be under-resourced without data to prove it.  

  **Why Our Approach Is Better:**  
  1. **Balanced Accountability:** Metrics expose patterns qualitative reviews miss (e.g., clinic A has 80% follow-ups but 25% readmissions).  
  2. **Safeguards Mitigate Gaming:** Pairing proxies with outcomes, risk adjustment, and audits creates friction against exploitation.  
  3. **Continuous Improvement:** A sunset clause forces data-driven reevaluation, whereas unstructured judgment rarely self-corrects.  

  ---

  ### **V. SAFEGUARDS FOR PRACTICAL IMPLEMENTATION**  
  | **Safeguard**          | **Purpose**                                | **Implementation**                                                                 |  
  |-------------------------|--------------------------------------------|------------------------------------------------------------------------------------|  
  | **1. Paired Metrics**   | Prevent proxy-over-goal optimization       | - **Follow-up rate** + **30-day readmission rate** published together.            |  
  | **2. Risk Adjustment**  | Eliminate cherry-picking incentives        | Adjust rates for acuity factors (e.g., SMI diagnosis, substance use, housing status). |  
  | **3. Minimum Standards**| Block superficial compliance               | Follow-ups must be ≥15 min, involve a prescriber if meds are managed, and include a care plan. |  
  | **4. Random Audits**    | Verify quality & acuity coding            | 5% of cases audited quarterly; clinics lose funding for falsified data.             |  
  | **5. Patient Feedback** | Capture unmet needs                       | Two-question SMS survey: "Was your concern addressed?" and "Did you discuss meds?" |  
  | **6. Shadow Metric**    | Monitor unintended consequences           | Track discharge timeliness (hours from medical readiness to discharge).            |  
  | **7. Sunset Clause**    | Force adaptation                            | Automatic suspension at 12 months if audits show >10% gaming or readmissions rise. |  

  ---

  ### **VI. CONCLUSION**  
  Rejecting the metric squanders an opportunity to strengthen care continuity; adopting it unmodified invites destructive gaming. Our recommendation balances accountability with adaptability:  
  - **Clinics** gain clarity via risk adjustment and minimum standards.  
  - **Patients** are protected through paired outcomes and audits.  
  - **The Public** benefits from transparent, outcome-focused funding.  

  **Bottom Line:** Adopt with the specified safeguards and sunset review. This transforms a vulnerable proxy into a tool for genuine improvement.  

