prompt: |-
  Ok, before I read another theory of emotion I want the spec first. Write me the desiderata any adequate theory of emotion has to meet — the cases it has to get right, the distinctions it cant collapse, the bits of science it can't contradict — with the consideration behind each requirement. Put the awkward ones in there: objectless moods vs object-directed emotions; recalcitrant fear of a spider you know is harmless; fear in a rat or a fish; affect you don't feel; the fact that autonomic signatures don't line up one-to-one with emotion categories; that emotion vocabularies differ across languages; and that the amygdala turns out not to be a dedicated fear centre. Then tell me which of these requirements can't all hold at once — that's the part I most want — and which single requirement rules out the most popular theories. Keep the scoring light, I'll do the contenders myself. British English please.
