  (e) Selfish mountain climb: Not required, but is it morally better? No one benefits except her personal achievement. Fails clause (2) entirely. Rating 0/10 - not supererogatory because no moral surplus.

  (f) Donation with ulterior motive: Not required, morally better than not donating (since hospital gets built), but motive is self-serving. Still satisfies all clauses. Rating 6/10 - counts technically but motivation clouds the moral quality.

  For each act, I'll specify which clauses are satisfied:
  (a) Satisfies all three
