  My ratings stay close to the definition while acknowledging where cases push against its edges - like (d) where "morally better" is contested, and (f) where motive creates tension despite satisfying the letter of the definition.
answer: |-
  ### Brief Brainstorm
  Clause (2) does the heaviest lifting: it carves out the "moral surplus" beyond duty, separating true supererogation from merely permissible or costly acts. Clause (1) sets the baseline of non-requirement, while (3) ensures the act isn't self-interested. But (2) anchors the moral superiority gap.

  ---

  ### Ratings and Justifications (0–10 Scale)

  **(a) Nurse assisting on flight**  
  **Rating: 9/10**  
  *Justification:* Clear moral surplus with tangible cost (missed film), despite indemnification/exhilaration.  
  *Clauses:* Satisfies (1) [not required], (2) [better than staying seated], (3) [net cost (time/experience)].  

  **(b) Commuter giving up seat**  
  **Rating: 6/10**  
  *Justification:* Minor cost and moral gain, but borderline due to triviality of sacrifice and minimal moral improvement.  
  *Clauses:* Satisfies (1), (2) [modestly better], (3) [minor net cost (discomfort)].  

  **(c) Scientist refusing lucrative career**  
  **Rating: 10/10**  
  *Justification:* Paradigm of costly, non-required moral excellence (serving global health over self-interest).  
  *Clauses:* Satisfies (1), (2) [significantly better than required alternative], (3) [major net cost (wealth)].  

  **(d) Forgiveness of fraudster**  
  **Rating: 4/10**  
  *Justification:* Contentious moral improvement (forgiveness may not be better than justice); cost is clear but clause (2) is weak.  
  *Clauses:* Satisfies (1) [not required], (3) [net cost (forgone justice)]; **fails (2)** [unclear if morally better than pursuing accountability].  

  **(e) Retired teacher’s mountain climb**  
  **Rating: 0/10**  
  *Justification:* **Category unavailable** – no moral improvement over alternatives (purely self-regarding), so fails supererogation by definition.  
  *Clauses:* Satisfies (1) [not required], (3) [net cost (risk/savings)]; **fails (2)** [no moral betterment; act is morally neutral].  

  **(f) Executive’s donation for political gain**  
  **Rating: 7/10**  
  *Justification:* Satisfies all clauses technically, but motive dilutes moral clarity; still, the act itself is morally superior.  
  *Clauses:* Satisfies (1), (2) [better than not donating], (3) [net cost (wealth)]; motive irrelevant per definition.  

  ---

  ### Follow-Up Analysis

  **Pair affected by dropping clause (2):** (d) and (e).  
  - (d) would rise to ~7/10 (forgiveness becomes a clear non-required, costly act).  
  - (e) would rise to ~5/10 (costly non-required act, but still morally inert).  
  Clause (2) is essential to exclude (e) and problematize (d); without it, supererogation collapses into "any costly non-duty."  

  **Clause I would rather revise:** Clause (3) ("net cost").  
  *Why?* "Net cost" is ambiguously subjective (e.g., is emotional burden "cost"? Does exhilaration in (a) negate it?). I’d refine it to "non-trivial opportunity cost or sacrifice" to better capture voluntary burden while accommodating varying agent perspectives.  

  **Add a fourth clause for motive in light of (f)?**  
  No, but if forced: **"primarily motivated by moral reasons."**  
  - *To exclude (f) without excluding (a):* The nurse’s exhilaration is incidental (moral intent is primary), while the executive’s political ambition is primary. However, this risks overcomplicating supererogation, which traditionally focuses on the act’s nature, not motive. Better to retain the current definition and accept that (f) technically qualifies, even if cynically motivated.  

  ---

  **Key Insight:** Clause (2) protects supererogation from collapsing into generic altruism or cost-bearing, ensuring it denotes genuine *moral excellence beyond duty*. Cases like (e) and (f) reveal the definition’s resilience but also its limits—especially regarding motive-neutrality.
