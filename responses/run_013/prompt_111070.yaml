  First, I'll need to brainstorm which of the three clauses is doing the real work. Clause (2) seems crucial because it establishes the gap between what's required and what's praiseworthy beyond that requirement. Clause (1) sets the baseline of non-obligation, while clause (3) ensures personal sacrifice. But clause (2) is where the "extra" in "extra-ordinary" really lives - it defines the moral surplus.

