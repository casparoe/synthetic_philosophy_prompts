answer: |-
  My credence in the proposition that there is a non-derivative moral difference between lying and merely misleading—specifically, that the lying case is worse in itself, holding consequences, intentions, and outcomes constant—is approximately 0.5. I arrive at this through a decomposition that weighs several interconnected factors, though I acknowledge this involves some arbitrariness in quantification given the normative uncertainties. Let me walk you through the components, their justifications, and how they combine.  

  First, I assign a probability of 0.6 to the existence of a distinct norm governing assertion as such, rather than a single norm against causing false beliefs. This stems from the intuition that assertion carries a unique commitment: when we assert, we present a proposition as true, inviting the hearer’s trust in that specific act. This differs from merely causing a false belief through implication, where the speaker’s words remain factually anchored, even if strategically deployed. The literature on “assertoric commitment” (e.g., Williamson’s knowledge norm) supports this, but I ground it in the phenomenology of conversation—we feel betrayed by a direct lie in a way that feels categorically distinct from being misled by truths.  

  Second, conditional on such a norm existing, I assign a probability of 0.4 to the claim that violating it is wrong independently of consequences. Here, I am less confident. While Kantian arguments (e.g., the liar treats the hearer as a mere means) suggest intrinsic wrongness, consequentialist pressures are strong. I lean toward a hybrid view: the core wrong involves a breach of autonomy (the hearer’s rational agency is hijacked by falsehood), which has non-derivative weight, but consequences often amplify or contextualize it. Experimental work on moral dumbfounding—where people condemn lying more harshly even when outcomes are identical—nudges me here, though not decisively.  

  Third, I weigh the “nothing to complain of” factor at 0.2 in favor of the distinction. When a hearer is misled by true statements, they cannot object to the literal truth of what was said, which mitigates the speaker’s culpability. This creates a moral asymmetry: the liar violates both the hearer’s trust and the shared expectation of truthfulness in assertion, while the misleader “only” manipulates inference. This factor slightly strengthens the case for a non-derivative difference but is subordinate to the norm’s existence.  

  A fourth term, not explicitly mentioned but relevant, is the role of communicative responsibility in laundering. I weight this at 0.3. Laundering—where the hearer assembles the false belief from truths—does not fully erase the distinction, in my view, because the speaker still manipulates the conversational context to induce error. However, it shifts the locus of responsibility: the liar directly corrupts the assertion-act, while the launderer exploits the hearer’s inferences. This reduces the *gap* between lying and misleading but doesn’t collapse it, as laundering preserves a veneer of respect for truth that lying obliterates. It lets the agent capture much of the wrong (intentional deception) while avoiding the distinctive betrayal of assertion, but not all of it.  

  Combining these multiplicatively and additively: (0.6 × 0.4) + 0.2 + 0.3 = 0.24 + 0.5 = 0.74. But this overstates my confidence. I discount to 0.5 for interdependencies (e.g., if no distinct norm exists, the “nothing to complain of” factor loses force) and countervailing considerations—e.g., the slippery-slope risk of overmoralizing speech acts, or cases where laundering feels equally reprehensible (such as exploiting vulnerabilities). Your lower credence of 0.3 suggests we diverge most sharply on the first term: the existence of a distinct norm of assertion. You might see assertion as merely one vehicle for the broader wrong of deceit, whereas I see its constitutive rules as morally laden.  

  What would move me most? Empirical evidence on whether the lying/misleading distinction tracks perceived wrongness when consequences are demonstrably identical across cultures (suggesting a deep norm) or varies contextually (suggesting derivativeness). Likewise, a compelling reduction of assertoric commitment to general moral principles—e.g., showing that “inviting trust” is just a species of promise-keeping—could lower my probability for the first term. On laundering, I’d be swayed by cases where laundered deception elicits identical resentment to lying, undermining the residue of non-derivative wrong. For now, the persistence of laundering in moral dilemmas—where agents feel compelled to avoid lying but not misleading—hints at a resilient distinction, even if its foundations are shakier than I initially supposed.  

  Yours in the murk of moral linguistics.
