  First, I need to identify the core problem: conflation of three separate "illusion" claims (consciousness/self/will) and ambiguity in what "illusion" even means (nonexistence vs misrepresentation vs conceptual confusion). The entry point is smart - everyone agrees introspection doesn't reveal underlying mechanisms. That's my neutral foundation.

  Key distinctions to map:
  1. Target of illusion (qualia? self? will?)
  2. Ontological status (real but misrepresented? unreal? incoherent concept?)
  3. Mechanism (representational error? missing entity? predictive processing?)

  I'll start by separating the self/will questions early since those often get lumped with consciousness. Then for phenomenal properties, I need a branching path that distinguishes:
  - Eliminativism (no such properties)
  - Revisionism (exist but different)
  - Non-factualism (conceptually empty)

  Hmm... must avoid false dichotomies. For example, some illusionists might accept dispositional phenomenal properties. Need a question about whether there's any reality to "what it's like" beyond functional roles.

  Also should flag dead ends - like combining denial of self-illusion with eliminativism about qualia. That would be the rare non-illusionist physicalist position (Churchland-style). And mark where current theories cluster vs gaps.

  For questions, I'll use concrete cases: 
  - "When you feel pain, is there literally something painful?" (tests non-factualism) 
  - "Could zombies exist?" (tests property dualism) 
  - "Does attention create consciousness?" (tests GWT vs first-order)

  Each leaf's "bite" should highlight the toughest pill to swallow - e.g., illusionists saying consciousness doesn't exist while writing papers about it, panpsychists accepting intrinsic proto-experiences in atoms.

  Structure sketch:
  1. Self/will illusion fork first
  2. Then for consciousness proper: 
     - Is "phenomenal feel" a real property? 
       - If no: eliminativism or non-factualism? 
       - If yes: physical or nonphysical? 
         - Physical: illusionism/revisionism 
         - Nonphysical: property dualism/panpsychism

  Must add higher-order theory branch by asking about unconscious perception. Global workspace needs a question about attention's role.

  Final check: does this separate the three-way split? Yes - leaves for eliminativism (no properties), illusionism (properties exist but misrepresented), and non-factualism (conceptually confused). And self/will are decoupled early. Good.
answer: |-
  Here's a decision tree designed to force precise distinctions, starting from your agreed neutral point. It isolates the "illusion" target, distinguishes ontological commitments, and flags dead ends/overlaps. Questions are concrete; leaves show "bites."

  **Entry Point (Shared Commitment):**  
  *"Introspection tells me how consciousness* seems, *not what it fundamentally is."*

  ---

  ### Decision Tree:

  1. **When you decide to raise your hand, is the "you" making that decision illusory?**  
     - **Yes (Self is illusory)** → Go to Q2  
     - **No (Self is real)** → Go to Q3  

  2. **Is the feeling of *effort* in conscious will (e.g., "I chose to lift my arm") misleading?**  
     - **Yes (Will is illusory)** → **→ LEAF: *Thin Subject/Self-Model Theory* (e.g., Metzinger)**  
       → *Bite: You must accept there's no "owner" of experience, just a model.*  
     - **No (Will is real, self isn't)** → *Dead End: Unoccupied. Incoherent to deny self but affirm will.*  

  3. **Can unconscious systems (e.g., blindsight) possess the *same perceptual content* as consciousness?**  
     - **Yes** → **→ LEAF: *Global Workspace Theory* (e.g., Baars, Dehaene)**  
       → *Bite: Consciousness adds no new content, just global availability.*  
     - **No** → Go to Q4  

  4. **When you see red, is there *literally* a "redness" property in your mind/brain?**  
     - **No** → Go to Q5  
     - **Yes** → Go to Q6  

  5. **Is "what it’s like" to see red a *confused concept* (not even wrong)?**  
     - **Yes** → **→ LEAF: *Non-Factualism* (e.g., Dennett’s "Quining Qualia")**  
       → *Bite: Phenomenal talk is incoherent—nothing to explain.*  
     - **No** → **→ LEAF: *Eliminative Illusionism* (e.g., Frankish)**  
       → *Bite: Phenomenal properties don’t exist; introspection is fully false.*  

  6. **Could a physically identical zombie (no consciousness) exist?**  
     - **Yes** → **→ LEAF: *Property Dualism* (e.g., Chalmers)**  
       → *Bite: Consciousness is non-physical, violating causal closure.*  
     - **No** → Go to Q7  

  7. **Is the "feel" of pain *identical* to its functional/neural role?**  
     - **Yes** → **→ LEAF: *Revisionary Physicalism* (e.g., Lewis, Papineau)**  
       → *Bite: Introspection radically misrepresents experience's nature (e.g., pain isn't "sharp").*  
     - **No** → Go to Q8  

  8. **Does attention *select* pre-existing conscious states, or *create* them?**  
     - **Creates them** → **→ LEAF: *Higher-Order Thought* (e.g., Rosenthal)**  
       → *Bite: Unattended stimuli aren’t conscious—even if rich (e.g., unattended chatter).*  
     - **Selects them** → Go to Q9  

  9. **Are electrons/fundamental particles minimally conscious?**  
     - **Yes** → **→ LEAF: *Constitutive Panpsychism* (e.g., Goff)**  
       → *Bite: Accept intrinsic proto-experiences in all matter.*  
     - **No** → **→ LEAF: *Illusionism about Phenomenality* (e.g., Graziano, but not Frankish)**  
       → *Bite: Phenomenal properties exist but are misrepresented (e.g., as intrinsic rather than representational).*  

  ---

  ### Key Clarifications:
  - **Forced Distinctions:**  
    - Self/will illusion (Q1–Q2) separated from *phenomenal* illusion (Q4 onward).  
    - Three-way split: Eliminativism (Q5-No), Revisionism (Q7-Yes), Non-Factualism (Q5-Yes).  
  - **Dead Ends:**  
    - Q2 "No" branch: Denying self but affirming will is incoherent (no proponents).  
    - Q4 "Yes" → Q6 "No" → Q7 "No": Unoccupied. *Possible* but unattractive (physicalism without functionalism/panpsychism).  
  - **Underdiscriminated Positions:**  
    - *Global Neuronal Workspace* and *Higher-Order Thought* both land at "attention creates consciousness" (Q8). They share this commitment.  
    - *Illusionism* (Q9) and *Revisionism* (Q7) both say introspection lies, but Q9 denies phenomenal properties are *intrinsic*, while Q7 denies they *match introspection*.  
  - **"Bites"** highlight each view’s toughest commitment (per your request).

  ### Structure Notes:
  - **8 branch nodes** (Q1–Q8), **9 leaves** (including Q9).  
  - **Avoided conflation:** No question asks "Is consciousness an illusion?"—targets are specific (self, will, content, properties).  
  - **Plain language:** Questions use cases (zombies, pain, attention) not jargon.  
  - **Uncovered Gaps:** "Pure" emergentism (consciousness as novel but non-panpsychist) isn't isolated—it falls under Revisionism or Global Workspace.

  This forces users to confront *which* "illusion" they mean and *what they preserve* (e.g., functional properties, subjectivity, self). Ideal for revealing hidden disagreements.
