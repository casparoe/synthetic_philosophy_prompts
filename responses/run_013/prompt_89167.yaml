answer: |-
  ### Essay Question  

  **Analyze the following four social choice rules with respect to the Gibbard–Satterthwaite theorem. State the theorem’s full set of hypotheses. For each rule (a), (b), and (c): determine whether it is strategy-proof (no voter can profitably misreport preferences), onto (every alternative can be chosen under some profile), and dictatorial (one voter’s preferences always determine the outcome). Identify which hypothesis of the theorem the rule evades (if any), and whether this evasion shows the hypothesis performs *substantive work* (i.e., prevents a desirable non-dictatorial rule) or is merely a *technicality*. For rule (d): using the stated result provided, evaluate whether randomization genuinely "escapes" the theorem’s impossibility. Discuss what this move achieves and fails to achieve, and whether random dictatorship qualifies as a true escape.**  

  **Rules:**  
  (a) *Majority Rule (Two Alternatives)*: With two alternatives \(\{x,y\}\), output the alternative preferred by a majority of voters. Ties broken arbitrarily (e.g., output \(x\)).  
  (b) *Median-Voter Rule*: Alternatives are real numbers on a line. Voters have single-peaked preferences (each has a unique "peak" \(p_i\), and prefers alternatives closer to \(p_i\)). Output the median of the voters’ peaks.  
  (c) *Fixed-Pair Rule*: For a fixed pair \(\{a,b\} \subset X\) (where \(|X| \geq 3\)), output voter 1’s preferred alternative from \(\{a,b\}\), ignoring all other voters and other alternatives.  
  (d) *Random Dictatorship*: Select a voter uniformly at random; output their top-ranked alternative.  

  **Stated Result for (d):** Any probabilistic rule that is anonymous, strategy-proof (under stochastic dominance), and ex post Pareto-efficient must be random dictatorship.  

  ---

  ### Model Answer (≈800 words)  

  The Gibbard–Satterthwaite (GS) theorem states: For a finite set of at least three alternatives, a social choice function defined on the unrestricted domain of strict preference profiles that is onto (surjective) and strategy-proof must be dictatorial. The critical hypotheses are: (i) ≥3 alternatives, (ii) unrestricted domain, (iii) surjectivity, and (iv) strategy-proofness, concluding in dictatorship. Below, I analyze how each rule evades one hypothesis while avoiding dictatorship, revealing their roles.  

  **Rule (a): Majority Rule (Two Alternatives)**  
  This rule is strategy-proof: With only two alternatives, a voter can only misreport if pivotal, but switching the outcome to their less-preferred alternative harms them. It is onto: If all voters prefer \(x\), \(x\) wins; similarly for \(y\). It is non-dictatorial: No single voter always determines the outcome against a majority. This rule evades the **≥3 alternatives** hypothesis. This evasion is substantive: Majority rule satisfies all other GS conditions (unrestricted domain, surjectivity, strategy-proofness) and is normatively appealing for binary choices. The impossibility emerges only with ≥3 alternatives, showing this hypothesis blocks non-dictatorial rules in richer choice spaces.  

  **Rule (b): Median-Voter Rule**  
  This rule is strategy-proof under single-peaked preferences: A voter’s peak is their top choice; reporting a false peak can only move the median away from their true peak or leave it unchanged, never improving their outcome. It is onto: For any alternative \(m\), a profile where all voters have peak \(m\) yields \(m\) as the median. It is non-dictatorial: The median depends on all voters’ peaks; no single voter dictates the outcome. This rule evades the **unrestricted domain** hypothesis by restricting preferences to single-peaked ones. This evasion shows the hypothesis performs substantive work: On this restricted domain, a strategy-proof, onto, non-dictatorial rule exists. Single-peakedness captures coherent ideological spectra (e.g., left-right politics), making this a practically significant escape, not a technicality.  

  **Rule (c): Fixed-Pair Rule**  
  This rule is strategy-proof: Voter 1 gets their preferred outcome from \(\{a,b\}\) regardless of reports; others cannot influence the outcome, so no one can manipulate. It is non-dictatorial: While voter 1 dictates the choice between \(a\) and \(b\), they do not control outcomes involving other alternatives (e.g., if \(c \in X\) is voter 1’s true top choice, the rule never selects \(c\)). However, it is **not onto**: Alternatives outside \(\{a,b\}\) (e.g., \(c\)) can never be chosen, violating surjectivity. This rule evades the **surjectivity** hypothesis. This evasion is a technicality: The rule achieves strategy-proofness and non-dictatorship only by sacrificing universal choice coverage. Surjectivity forces the rule to be "responsive" to all alternatives, and dropping it allows trivial (but normatively hollow) escapes.  

  **Rule (d): Random Dictatorship and the Role of Randomization**  
  Random dictatorship is strategy-proof under stochastic dominance: Since a voter’s report only affects outcomes when they are selected as dictator, truthful reporting maximizes the probability of their top choice. It is ex post Pareto-efficient: The realized outcome is some voter’s top choice. By the stated result, it is the *only* rule satisfying anonymity, strategy-proofness, and ex post efficiency.  

  Permitting lotteries appears to "escape" GS by violating its deterministic output requirement. However, this move does not eliminate dictatorship but probabilizes it: Instead of a fixed dictator, a random voter acts as dictator ex post. Strategy-proofness and efficiency are preserved, but at the cost of introducing ex ante inequality (each voter is dictator with equal probability) and indeterminacy. Crucially, **randomization does not produce a non-dictatorial mechanism**; it converts deterministic dictatorship into random dictatorship. While anonymity ensures fairness over time, the rule remains strategically equivalent to rotating dictatorship. Thus, it is not a true escape from the theorem’s core conclusion—concentrated power—but a redefinition of it. The move buys strategy-proofness and efficiency but fails to achieve genuine collective decision-making without vesting absolute authority in individuals.  

  **Conclusion**: The GS hypotheses play distinct roles. The ≥3 alternatives requirement is substantive, as majority rule works perfectly for two. Unrestricted domain is substantive, as domain restrictions (like single-peakedness) enable robust non-dictatorial rules. Surjectivity is technical; dropping it permits degenerate rules. Randomization circumvents determinism but preserves dictatorship stochastically, revealing that GS’s impossibility is fundamentally about concentrated power, not determinism per se.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  1.  **Correct statement of GS hypotheses** (4 marks):  
      *Must include: ≥3 alternatives, unrestricted domain, surjectivity ("onto"), strategy-proofness, dictatorship conclusion.*  
      *Common mistake: Omitting/merging hypotheses (e.g., missing surjectivity or ≥3 alternatives).*  

  2.  **Analysis of Rule (a)** (3 marks):  
      *Correctly identifies: strategy-proof, onto, non-dictatorial; evades ≥3 alternatives; evasion is substantive.*  
      *Common mistake: Incorrectly claims manipulability or misses why binary choice is fundamental.*  

  3.  **Analysis of Rule (b)** (3 marks):  
      *Correctly identifies: strategy-proof (on domain), onto, non-dictatorial; evades unrestricted domain; evasion is substantive (domain restriction enables desirable rule).*  
      *Common mistake: Fails to justify why single-peakedness is non-trivial or misstates strategy-proofness.*  

  4.  **Analysis of Rule (c)** (3 marks):  
      *Correctly identifies: strategy-proof, non-dictatorial, not onto; evades surjectivity; evasion is a technicality.*  
      *Common mistake: Missing non-ontoness or mislabeling voter 1 as dictator.*  

  5.  **Analysis of Rule (d) - Achievements** (3 marks):  
      *Correctly notes randomization preserves strategy-proofness & efficiency via random dictatorship (per stated result); buys anonymity & ex ante fairness.*  
      *Common mistake: Claims randomization eliminates dictatorship or violates strategy-proofness.*  

  6.  **Analysis of Rule (d) - Limitations** (4 marks):  
      *Argues random dictatorship probabilizes (not eliminates) dictatorship; "escape" is illusory as power remains concentrated; fails to deliver non-dictatorial collective choice.*  
      *Common mistake: Treats anonymity as negating dictatorship or ignores the stochastic power concentration.*
