  We are going to design a session for the two-envelope paradox. The core idea is to have participants experience the paradox by actually engaging in an envelope-swapping game. We'll use tokens as a payoff to avoid real money.

  **Session Structure:**
  1. Introduction (5 minutes)
  2. First Round: Unspecified Distribution (20 minutes)
     - Setup and rules explanation
     - Pair activity: one holder, one offerer
     - Reasoning and multiple swaps
  3. Second Round: Known Distribution (15 minutes)
     - New setup with a specified mechanism
     - Activity with the same pair structure but different prior
  4. Debrief (10 minutes)

  **Materials:**
  - Envelopes (enough for each pair, plus some extra)
  - Tokens (e.g., poker chips, buttons, or paper slips) of two denominations: low (say, 1 token) and high (2 tokens). We can also have higher denominations for the second round but the principle is the same.
  - A whiteboard or flip chart for explanations.

  **Payoff Scheme:**
  - Tokens are collected during the game and can be exchanged for small rewards (like candies or extra credit points) at the end of the session. We'll have a conversion rate (e.g., 10 tokens = 1 candy) but the exact rate isn't critical.

  **Roles:**
  - In each pair: 
     - **Holder**: The person who initially gets an envelope and decides whether to pay to swap.
     - **Offerer**: The person who offers swaps and collects the swap fee.

  **Detailed Timeline:**

  **1. Introduction (5 minutes)**
     - Explain the two-envelope paradox briefly: Two envelopes, one has twice as much as the other. You pick one, open it, and then are given the chance to swap. The paradox is that it seems you should always swap because the other envelope has a 50% chance of being twice what you have and 50% chance of being half, leading to an expected gain.
     - Tell the group that they will experience this through a game.

  **2. First Round: Unspecified Distribution (20 minutes)**
     - **Setup (3 minutes):** 
       - Divide into pairs. Each pair gets two envelopes. The envelopes in a pair are prepared as follows: 
          - One envelope contains X tokens (the low amount).
          - The other contains 2X tokens (the high amount).
       - The value of X is chosen by the instructor arbitrarily (but kept hidden) and can vary between pairs. For simplicity, we can fix X for all pairs (say, X=5, so envelopes have 5 and 10 tokens) but do not tell the participants the amounts or that X is fixed. Alternatively, we can have different pairs with different X (e.g., some pairs have 5 and 10, others have 10 and 20, etc.) to mimic the idea that the prior is unknown.
       - The Holder is given one envelope (randomly chosen by the Offerer, without the Holder seeing which one). The Holder opens it and sees the amount. The Offerer holds the other envelope.

     - **Rules (2 minutes):**
       - The Holder can choose to swap by paying a small fee (e.g., 1 token) to the Offerer. 
       - After a swap, the roles remain: the new Holder (the former Offerer) now has the envelope and can be offered another swap (by the new Offerer, the former Holder) for the same fee. 
       - The swapping can continue until the Holder decides to stop or until a set number of swaps (we don't want it to go forever). We'll set a limit of 3 swaps per pair to avoid exhaustion.

     - **Activity (15 minutes):**
       - Step 1: Holder opens the envelope and sees the amount (say, A tokens).
       - Step 2: Holder reasons aloud (with the Offerer and the rest of the pair listening) about whether to swap. The reasoning should be guided by the expected value: 
            - With 50% chance the other envelope has 2A, so gain A (if they had the smaller) or lose A/2 (if they had the larger)? But note: they don't know if A is the smaller or larger. So the reasoning is:
              - If I have the smaller, then the other has 2A -> gain A.
              - If I have the larger, then the other has A/2 -> lose A/2.
              - Since each is equally likely, expected gain = (1/2)*A + (1/2)*(-A/2) = A/4.
            - So they should be willing to pay up to A/4 to swap. Since our fee is 1 token, if A/4 > 1 (i.e., A>4) then they should swap.
       - Step 3: Holder pays 1 token to swap (if they decide to swap) and the envelopes are exchanged. The new Holder now has the other envelope and sees the new amount. But note: they don't know the original amounts. Now they have a new amount, say B. They then reason again: expected gain from swapping is B/4, so if B>4, they should swap again.
       - Step 4: Allow up to 3 swaps. After each swap, the new Holder reasons and decides.
       - Step 5: At the end, the Holder keeps the tokens in the envelope they have, minus any swap fees they paid. The Offerer keeps the swap fees they collected.

     - **Note:** The instructor should walk around and prompt reasoning. Especially if a Holder is hesitant, ask: "What do you think the other envelope might be? What are the two possibilities? What would you gain or lose? What's the expected gain?"

     - **Expected outcome:** The Holder will likely swap at least once, and then when they get the other envelope, they will see that the same reasoning applies and they may swap again. They might end up swapping multiple times and paying multiple fees.

  **3. Second Round: Known Distribution (15 minutes)**
     - **Setup (5 minutes):** 
       - Now we fix the generating mechanism. Tell the participants: "This time, we are going to fix the way the amounts are chosen. We will have a fixed set of possible amounts for the two envelopes: one pair will be (5,10), another (10,20), another (20,40), etc. But we assign each pair by drawing from a hat which pair they get: either (5,10) or (10,20). We tell them the possible pairs and the probabilities: say 50% chance of (5,10) and 50% chance of (10,20). 
       - Actually, we can do this: for each pair, we flip a coin. If heads, the envelopes contain 5 and 10. If tails, they contain 10 and 20. Then we randomly assign one envelope to the Holder and the other to the Offerer.

     - **Activity (10 minutes):**
       - Same rules: Holder can swap for a fee of 1 token.
       - Now, when the Holder opens the envelope, they might see 5, 10, or 20.
          - If they see 5: 
              - They know they must be in the (5,10) pair (because 5 can't be in the (10,20) pair). So the other envelope must be 10. Then swapping would gain 5 (10-5) minus the fee of 1, so net gain 4. So they should swap.
          - If they see 20:
              - They know they must be in the (10,20) pair (because 20 can't be in the (5,10) pair). So the other envelope must be 10. Then swapping would lose 10 (20-10) and then minus the fee, so net loss 11. So they should not swap.
          - If they see 10:
              - They could be in either pair. In (5,10) they have the larger, in (10,20) they have the smaller. 
              - The possibilities: 
                  - With 50% chance (if they are in (5,10)) the other envelope is 5 -> loss of 5 (if they swap and without fee) and then minus fee -> total loss 6? Actually, without the fee: swapping from 10 in (5,10) gives 5 -> loss of 5. With fee: they lose 5 and pay 1 -> total loss 6.
                  - With 50% chance (if they are in (10,20)) the other envelope is 20 -> gain 10. With fee: net gain 9.
              - Expected gain: (0.5 * (-6)) + (0.5 * 9) = 1.5. So they should swap? But wait, without the fee the expected gain would be (0.5*(-5) + 0.5*10) = 2.5. With fee, 2.5 - 1 = 1.5? So they would be willing to pay up to 2.5 tokens? But note: the prior is fixed and known, so we can condition on the observed value.

       - However, note that the prior is not uniform over the amounts. The amount 10 appears in both pairs. So we must compute the probability of being in each pair given that we observe 10.
          - Prior: P((5,10)) = 0.5, P((10,20)) = 0.5.
          - Given we observe 10, what is the probability that we are in (5,10)? In (5,10), the chance of getting 10 is 1/2? Actually, in each pair, the envelope assignment is random. So:
              - P(observe 10 | (5,10)) = 1/2 (because in (5,10) there are two envelopes: 5 and 10, so half the time we pick 10)
              - P(observe 10 | (10,20)) = 1/2 (because in (10,20) we have two envelopes: 10 and 20, so half the time we pick 10)
              - Then by Bayes: 
                  P((5,10) | observe 10) = [ P(observe 10 | (5,10)) * P((5,10)) ] / [ ... ] 
                  = (0.5 * 0.5) / ( (0.5*0.5) + (0.5*0.5) ) = 0.25 / 0.5 = 0.5
              - So indeed 50-50.

       - Therefore, the expected value without fee: 
           0.5 * (5)   [if switching from 10 in (5,10) gets 5: loss of 5] 
           + 0.5 * (20) [if switching from 10 in (10,20) gets 20: gain 10]
          = 0.5 * (-5) + 0.5 * (10) = 2.5 tokens.
          With fee: 2.5 - 1 = 1.5 tokens, which is positive. So they should swap.

       - But note: after swapping, they will either get 5 or 20. Then they are in the same situation as above? 
          - If they swapped and got 5: they know they are in (5,10) and that the other envelope (which they just left) was 10. Now they have 5. They can swap again? But the Offerer now has 10. The new Holder (who just got 5) will reason: 
              - I have 5. The other envelope must be 10 (because 5 only appears in (5,10)). So swapping again would get 10, which is a gain of 5. But they have to pay 1, so net gain 4. So they should swap again? But that would get them back to 10. Then they are at 10 and can swap again? This could go on forever.

       - To prevent an infinite loop, we must set a rule: only one swap per round? Or limit the number of swaps. Alternatively, we can change the rules for the second round: only one swap opportunity per Holder. So after the first swap, the game ends.

     - **Revised rule for the second round:** Each Holder gets only one chance to swap. Then the game ends.

     - **Goal:** Participants see that for some amounts (like 5) they should swap, for some (like 20) they should not, and for 10 they might swap. This shows that the switching argument is sometimes defensible and sometimes not, depending on the prior and the observed amount.

  **4. Debrief (10 minutes)**
     - Tie each moment of the activity to the steps in the paradox:
        - **First Round:**
            - The Holder observed an amount A and treated it as equally likely that it was the smaller or the larger. (This is the flawed step: without knowing the prior, they assumed that the two possibilities were equally likely.)
            - They computed the expected gain as A/4, which is positive, and so they swapped.
            - Then they got a new amount and applied the same reasoning, leading to multiple swaps. This shows that the reasoning, if applied consistently, leads to infinite swapping and paying fees until you are broke.

        - **Why is the equal likelihood assumption flawed?**
            - Because it assumes that the prior over the possible amounts is such that for any observed amount, it is equally likely to be the smaller or the larger. But this requires a prior that is uniform and unbounded? Or scale-invariant? But no such prior exists (because it would have to be an improper prior). In the first round, we didn't specify a prior, so the participants had to assume something. They assumed symmetry.

        - **Second Round:**
            - We fixed the prior: the possible pairs were (5,10) and (10,20) with equal probability.
            - When the Holder saw 5, they knew they had the smaller and swapped. When they saw 20, they knew they had the larger and did not swap. When they saw 10, they had a 50% chance of the other being 20 and 50% of being 5. The expected gain without fee was 2.5, so with a fee of 1, they still had a positive expected gain? But note: this expected gain is correct because we have a proper prior and we conditioned on the observation.
            - However, note that if we allowed multiple swaps, the person with 10 would swap and then either get 5 or 20. Then if they got 5, they would want to swap again? This would lead to a cycle. But in reality, the prior doesn't change and the envelopes are fixed. The flaw in the first round was the prior, but now we have a fixed prior and we are conditioning correctly. However, the multiple swap issue in the second round is a separate problem: it arises because the act of swapping doesn't change the contents, but the reasoning is done conditionally on the current amount. This is acceptable? Actually, in the second round, if we allow multiple swaps, we are getting into a dynamic situation. But for the purpose of the paradox, we are showing that the expected value calculation can be correct when we have a fixed and known prior.

        - **The repair of the paradox:**
            - The paradox arises because we treat the observed amount as fixed and then assume that the other envelope is equally likely to be half or double. But without a prior, this is arbitrary. 
            - Once we fix the prior (the generating mechanism), we can compute the conditional probabilities and then make a decision. The switching argument becomes conditionally valid for some observed amounts and invalid for others.

  **What will predictably go wrong:**
     - **Infinite swapping:** In the first round, without a limit, pairs might keep swapping. We set a limit (say 3 swaps) to avoid this. Also, the fee will eat into the winnings, so after a few swaps, the Holder might have little left. But we want them to feel the pull of the reasoning. If a pair stops early, we can ask them to explain why and then point out that the reasoning would have told them to keep swapping.

     - **Confusion in the second round:** Participants might not understand the prior. We must explain the mechanism clearly. Also, when they see 10, they might not realize that they are equally likely to be in either pair. We can help with the Bayes calculation on the board.

     - **Time management:** The activities might run over. We have to keep strict time. The first round: 15 minutes for the activity might be tight. We can reduce the number of pairs (if 18 people, 9 pairs) and have the instructor circulate to keep the pace.

  **What the activity cannot reproduce:**
     - The activity uses specific amounts and a finite prior in the second round. The original paradox often involves the idea of an unbounded prior (like any positive real number) and the impossibility of a uniform distribution on an infinite set. This abstract point might not be fully grasped by the activity. Therefore, in the debrief, you must explain:

        *"In the first round, when we did not specify a prior, we assumed that for any observed amount A, it was equally likely to be the smaller or the larger. But if the possible amounts are unbounded, we cannot have a uniform prior: it would be an improper prior (with infinite total probability). And if we try to make it proper, we run into problems. For example, if we assume that the smaller amount can be any positive integer, then the prior probability for each specific amount is zero. Alternatively, if we take a finite range, then the symmetry breaks: if you see a very large amount, it is more likely that you have the larger envelope. The activity cannot fully capture the unbounded case, but we saw in the second round that with a bounded prior, the reasoning is sometimes valid and sometimes not. The key flaw in the first round is the assumption of equal likelihood without a proper prior."*

     - Also, note that the activity uses discrete amounts and fixed pairs. The paradox in the continuous case is more subtle, but the discrete case suffices to show the flaw.

  **Final note:** 
     - Encourage participants to think about the difference between a rule of always switching and a rule that conditions on the observed amount. In the first round, they ended up always switching (if A>4) because the reasoning applied to every amount. In the second round, they only switched for some amounts.

     - Highlight: the switching argument in the first round is self-defeating because it leads to a cycle. That's a sign that something is wrong.

  By following this plan, the group should feel the pull of the paradox and then see its resolution through conditioning on the prior.
answer: |-
  ### Session Design: Two-Envelope Paradox  
  **Goal:** Make participants experience the paradox's intuitive pull, commit to flawed reasoning, then discover its cost. Total time: 50 minutes.  

  ---

  ### **Materials**  
  - **Envelopes:** Two per pair (9 pairs × 2 = 18 envelopes).  
  - **Tokens:** 500 low-value tokens (e.g., cardboard chips) in denominations:  
    - 50 tokens of value "1"  
    - 50 tokens of value "2"  
    - 50 tokens of value "4"  
    - ... up to 50 tokens of value "64" (geometric sequence: 1, 2, 4, 8, 16, 32, 64).  
  - **Payoff scheme:** Tokens are exchangeable for sweets/trinkets post-session (e.g., 10 tokens = 1 sweet).  
  - **Other:** Whiteboard, markers, timer.  

  ---

  ### **Rules & Roles**  
  1. **Pairs:** Divide into 9 pairs (18 students).  
  2. **Roles per pair:**  
     - **Holder:** Receives an envelope, opens it, decides whether to pay tokens to swap.  
     - **Offerer:** Holds the second envelope, collects swap fees, and can re-offer swaps after each exchange.  
  3. **Swap fee:** 1 token (paid to Offerer) per swap attempt.  
  4. **Token allocation:**  
     - Each envelope contains a random pair of tokens (e.g., 2 and 4, 4 and 8, etc.) such that one token is **double** the other.  
     - *Example:* If Holder opens an envelope with "4", the other envelope contains either "2" or "8".  

  ---

  ### **Timeline (50 Minutes)**  

  #### **1. Introduction (5 min)**  
  - **Goal:** Frame the paradox without spoilers.  
  - **Script:**  
    > *"You’ve been given one of two envelopes. One contains double the tokens of the other. You open yours and see X tokens. I’ll give you a chance to swap for a small fee. Should you? Let’s test this in pairs."*  

  #### **2. Round 1: Flawed Reasoning (20 min)**  
  - **Setup (3 min):**  
    - Distribute envelopes (pre-filled with token pairs, e.g., [2,4], [4,8], [8,16], etc.).  
    - Assign Holder/Offerer roles. Holders open envelopes.  
  - **Activity (15 min):**  
    - **Step 1:** Holder sees amount **A** (e.g., "4"). Offerer asks: *"Pay 1 token to swap?"*  
    - **Step 2:** Holder *reasons aloud* (critical!):  
      > *"The other envelope is either 2 or 8. Each is 50% likely. Expected value of swapping: (0.5 × 8) + (0.5 × 2) = 5. I have 4 now, so swapping gains 1 token on average. I’ll swap!"*  
      → Holder pays 1 token, swaps envelopes.  
    - **Step 3:** New Holder (ex-Offerer) now has the other envelope (e.g., "2" or "8"). Offerer (ex-Holder) asks again: *"Pay 1 token to swap back?"*  
    - **Step 4:** Holder repeats reasoning:  
      - If they have "2": *"Other envelope is 1 or 4? Wait, I know it was originally 4... but *now* it could be anything? Expected value: (0.5 × 4) + (0.5 × 1) = 2.5 > 2? Swap!"*  
      - If they have "8": *"Other envelope is 4 or 16? Expected value: (0.5 × 16) + (0.5 × 4) = 10 > 8? Swap!"*  
    - **Step 5:** Allow 2–3 swaps. Holder pays fees each time. End when Holder refuses or 3 swaps occur.  
  - **Instructor role:** Wander, listen, and **reinforce the 50% assumption**. If Holder hesitates: *"What could the other envelope be? Is each option equally likely?"*  

  #### **3. Round 2: Known Mechanism (15 min)**  
  - **Setup (3 min):**  
    > *"Now, the amounts are generated by a fixed rule: The smaller envelope always has 4 tokens. Larger has 8. No other amounts exist."*  
    - Redistribute envelopes: All pairs get [4, 8].  
  - **Activity (10 min):**  
    - Holder opens envelope (sees 4 or 8).  
    - Offerer asks: *"Pay 1 token to swap?"*  
    - **Critical differences:**  
      - Holder sees **4**: *"Other must be 8! Gain 4 tokens (8–4) minus 1 fee? Net +3. Swap!"*  
      - Holder sees **8**: *"Other must be 4. I’d lose 4 tokens (8–4) plus 1 fee? Net –5. Don’t swap!"*  
    - No repeat swaps (one decision per Holder).  

  #### **4. Debrief (10 min)**  
  Tie each activity step to the paradox:  

  | **Activity Moment**               | **Paradox Concept**                                                                 | **Whiteboard Notes** |  
  |-----------------------------------|-------------------------------------------------------------------------------------|----------------------|  
  | Round 1: Holder assumes 50/50    | Flawed move: Treating observed **A** as equally likely to be smaller/larger.        | *"P(smaller) = P(larger) = 0.5?"* → **But this assumes a symmetric prior!** |  
  | Round 1: Multiple swaps           | Self-defeating cycle: Switching argument implies you should *always* swap.          | *"If EV(switch) > A always, why stop?"* → **No stable state!** |  
  | Round 1: Token loss from fees     | Cost of the flaw: Real loss from infinite switching.                                | *"Fees accumulate → strategy is self-punishing."* |  
  | Round 2: Holder sees "4" → swaps | Repairing the paradox: With a **fixed prior**, switching is rational for some **A**. | *"Known prior: P(smaller=4)=1. EV(switch) = 8–4–1= +3 → Good."* |  
  | Round 2: Holder sees "8" → stops | Prior matters: Switching is irrational for some **A** once the mechanism is fixed.   | *"EV(switch) = 4–8–1= –5 → Bad."* |  
  | Contrast: Uniform prior?          | Impossibility of scale-invariant priors: No uniform distribution over all positives. | *"Can’t have P(A) equal for all A > 0. Total probability = ∞!"* |  

  **Key insights to verbalize:**  
  - *"The paradox assumes P(other = 2A) = P(other = A/2) = 0.5, but this requires an impossible prior. In Round 1, you acted like every amount was equally likely, but that’s mathematically incoherent."*  
  - *"Switching is rational only when you know the prior. Otherwise, the argument collapses into infinite regress."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Holders resist swapping in Round 1 ("I feel cheated").  
     - **Fix:** Stress reasoning *aloud*. Ask: *"What does the math say? Ignore intuition."*  
  2. **Problem:** Offerers struggle to re-offer swaps (confusion after first swap).  
     - **Fix:** Demo with one pair first. Clarify: *"After swapping, the new Holder can be offered another swap."*  
  3. **Problem:** Round 2 seems too obvious (no paradox).  
     - **Fix:** Emphasize contrast: *"Why was switching sometimes wrong here but always ‘right’ in Round 1?"*  
  4. **Problem:** Time runs out during debates.  
     - **Fix:** Enforce 90-second limits per decision. Use a timer.  

  ---

  ### **What the Activity Can’t Replicate**  
  **The infinite prior problem:** Participants see finite examples (e.g., 2/4/8/.../64), but the paradox’s deepest flaw is that **no uniform prior over all positive numbers exists**. You must explain this verbally:  

  > *"In Round 1, you assumed every possible amount was equally likely. But if the envelopes could contain any positive number, we’d need a ‘flat’ prior where P(A) is equal for all A. This is impossible—probabilities would sum to infinity, not 1. The paradox exploits this hidden impossibility. Switching only ‘works’ when your prior is mis-specified."*  

  ---

  ### **Why This Works**  
  - **Experiential pull:** Participants *commit* to the math before seeing its failure.  
  - **Cost-driven revelation:** Token losses make the flaw visceral.  
  - **Contrast:** Round 2 repairs the argument contextually, highlighting the prior’s role.  
  - **Discussion-ready:** Every debrief point maps to an observable moment.  

  Run this, and your group will viscerally grapple with the paradox—then resolve it.
