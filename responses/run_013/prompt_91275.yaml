prompt: |-
  I'm in a small reading group on formal epistemology and we've spent the last few weeks on accuracy-first stuff — the approach where you score a credence function by how close it is to the truth and then try to derive norms of rationality from the goal of being accurate. One guy in the group, who's read alot more of this than the rest of us, keeps ending arguments with some version of "accuracy is all there is, epistemically" (he also says "the only thing epistemic rationality is answerable to is accuracy"). Last week he used it to do three things at once: to say that anyone who thinks understanding, or explanation, or coherence is epistemically valuable in its own right is just confused; to say that if two credence functions are equally accurate there's nothing epistemic to choose between them; and to say that this is why probabilistic incoherence is irrational, because incoherent credences can be accuracy-dominated. I'm fairly sympathetic but I suspect he's running a handful of different claims together, and I can't tell which of them the formalism actually delivers.

  Could you lay out the distinct precise theses that one-liner could be expressing, from the nearly trivial to the very strong, and for each say whether it's a terminological/definitional choice, a substantive but defensible claim, or something a card-carrying accuracy-firster would reject? I'd especially like to know (1) whether his claim that accuracy is the only epistemic good is meant as a claim about *fundamental* value, with everything else derivative, or about all epistemic value full stop — and whether the view needs the strong version or can get by with the weak one; (2) whether "accuracy" is one thing or a family of things, given that scoring rules disagree (the Brier score and the log score rank credence functions differently), and if so whether "accuracy first" is underdetermined until a rule is fixed; (3) how much of the machinery survives without extra premises — I gather the dominance argument for probabilism is supposed to be robust across scoring rules, but that the accuracy-first case for conditionalization needs something extra like maximizing expected accuracy, and I don't know if that's right; and (4) whether the move from "accuracy is valuable" to "epistemic rationality is just instrumental rationality with respect to accuracy" is something the view is committed to or just one popular packaging of it.

  What bugs me most is that "the only thing that matters is accuracy" sounds like a claim about what's *valuable*, but he wields it like a claim about what rationality *consists in*, and I can't tell whether those are supposed to be one claim or two with a derivation between them. Relatedly: is "accuracy" doing any work that "truth" wasn't already doing? If a single credence can be wildly inaccurate while the whole credence function is highly accurate, does the slogan even have a determinate reading? And if perfect accuracy would mean assigning 1 to every truth, which is impossible, doesn't the slogan have to be about expected accuracy or something else entirely? Please tell me which of the readings on your menu would actually license his conclusions about understanding and about ties.
reasoning: |-
  Okay, the user is in a formal epistemology reading group focusing on accuracy-first approaches. Their group member keeps asserting that "accuracy is all there is, epistemically," using it to dismiss other epistemic values like understanding and explanation. The user is sympathetic but suspects multiple claims are conflated. They need clarity on distinct theses behind this slogan, especially regarding fundamental value vs. all value, whether accuracy is a single concept given different scoring rules, what machinery survives without extra premises, and how the value claim relates to rationality.

  First, I recall Joyce's 1998 paper where accuracy-dominance arguments for probabilism are introduced. The core idea is that incoherent credences are accuracy-dominated. But the user's group member extends this to say accuracy is the only epistemic good, dismissing understanding, coherence, etc. The user is right to question if these are different claims mashed together.

  Breaking down "accuracy is all there is" into possible theses. Starting from weak to strong. Thesis 1 is nearly trivial: accuracy is necessary for any epistemic value. But that doesn't get the group member's conclusions. Thesis 2 says accuracy is the sole fundamental value, with others deriving from it. This seems defensible but requires arguing that understanding, etc., are valuable only as means to accuracy. Thesis 3 is stronger, claiming all epistemic value reduces to accuracy. That might be too strong if understanding has intrinsic value beyond accuracy.

  On terminology vs. substantive claims. Defining epistemic rationality as accuracy-conducive is terminological. But claiming that understanding isn't intrinsically valuable is substantive. The user's group member uses the slogan to dismiss other values, so he's likely making a substantive claim.

  Scoring rules matter. Brier vs. log score can rank credences differently. But for probabilism, any strictly proper scoring rule shows incoherent credences are dominated. So the dominance argument is robust. However, conditionalization requires additional assumptions like expected accuracy maximization. The user mentioned this; confirming it's correct.

  The user's specific questions: (1) Fundamental vs. all value. The accuracy-first program can work with accuracy as fundamental, allowing derivative values. The strong claim that all value reduces to accuracy is harder to defend. (2) Accuracy isn't one thing; different scoring rules define it differently. But for some results, like probabilism, the choice doesn't matter. For others, like conditionalization, it might. (3) Machinery survival: dominance arguments for probabilism are robust. Conditionalization needs extra premises like maximizing expected utility with a proper scoring rule. (4) The move from valuing accuracy to rationality being instrumental: this is a commitment. Rationality is about optimally pursuing accuracy, but there's a gap between coherence and optimality.

  The user is bugged by conflating value and rationality. The slogan mixes valuing accuracy with rationality consisting in its pursuit. But rationality might have constraints beyond instrumental pursuit, like consistency. Also, accuracy is different from truth. Accuracy applies to degrees of belief, truth to all-or-nothing. A single credence can be inaccurate while the whole function is accurate, so the unit of assessment matters.

  For the group member's conclusions: dismissing understanding requires showing it's not intrinsically valuable beyond accuracy, which is substantive and controversial. Equal accuracy implying no epistemic difference is plausible under the accuracy-first view but depends on the scoring rule. The dominance argument for probabilism works, but the other claims need stronger theses.

  The user needs to know which theses are necessary. For probabilism via dominance, Thesis 2 (accuracy as fundamental goal) suffices. But denying intrinsic value to understanding requires Thesis 3 or 4, which are stronger and less defensible. The user should push back on whether understanding can be fully reduced to accuracy.
answer: |-
  You're right to be suspicious—your groupmate is indeed conflating several distinct claims under a deceptively simple slogan. "Accuracy is all there is, epistemically" is a *programmatic motto* for the accuracy-first approach, not a single precise thesis. Its meaning shifts across contexts, and not all versions are equally defensible or essential to the formalism. Below, I'll break down the distinct theses, address your specific questions (1)-(4), and evaluate which readings support your groupmate's conclusions. I'll use a framework ranging from weaker to stronger claims.

  ### Core Distinction: Value vs. Rationality
  The slogan blurs two layers:
  - **Axiological claim**: Accuracy is the sole *epistemic value* (what makes a belief state epistemically good).
  - **Deontic claim**: Epistemic rationality *consists in* efficiently pursuing accuracy (the norms governing belief).
  Accuracy-firsters typically *derive* the deontic from the axiological (e.g., rationality = instrumental efficiency toward accuracy). But this derivation isn't automatic—it requires arguments (e.g., that incoherence is *inefficient* for accuracy). Crucially, **accuracy isn't doing the same work as "truth"**: truth is binary (a proposition is true/false), while accuracy measures *graded closeness* of credences to truth values. Scoring rules (like Brier or log) operationalize this.

  ---

  ### The Menu of Precise Theses
  Here are distinct readings of "accuracy is all there is," ranked weakest to strongest. For each, I note its status (terminological/defensible/rejected) and whether it supports your groupmate's conclusions.

  1. **Thesis 1 (Minimal Constraint)**  
     *Accuracy is a necessary condition for epistemic value*: Any epistemically valuable state must promote or embody accuracy in some way.  
     - **Status**: Nearly trivial; most epistemologists accept this.  
     - **Supports groupmate's conclusions?** No. Compatible with intrinsic value for understanding/coherence, as long as they're accuracy-conducive. Doesn't forbid epistemic ties between equally accurate credence functions.

  2. **Thesis 2 (Fundamental Value)**  
     *Accuracy is the sole fundamental epistemic value*: All other putatively epistemic goods (understanding, coherence, etc.) derive their value *only* instrumentally from promoting accuracy.  
     - **Status**: Substantive but defensible within accuracy-first. Key figures like Pettigrew (2016) endorse this.  
     - **Supports groupmate's conclusions?**  
       - *Understanding/explanation*: Yes, if he argues they're only valuable as means to accuracy (e.g., understanding helps form accurate future beliefs).  
       - *Ties between equally accurate credence functions*: Yes—if accuracy is the only fundamental value, no other property could break ties.  
       - *Coherence*: Indirectly—coherence is rational because it's necessary for avoiding accuracy-domination (not intrinsically valuable).  
       - **Caveat**: Requires arguing that understanding *wholly derives* from accuracy. Critics (e.g., Kvanvig 2003) say understanding has non-instrumental value (e.g., grasping explanatory relations).

  3. **Thesis 3 (Exclusive Value)**  
     *Accuracy is the only epistemic value simpliciter*: Nothing but accuracy has epistemic value—fundamental or derivative. Coherence/understanding have no distinct epistemic value; they're merely causal levers for accuracy.  
     - **Status**: Stronger and less defensible. Rejected by many accuracy-firsters (e.g., Dunn 2015 allows "parasitic" epistemic values).  
     - **Supports groupmate's conclusions?** Same as Thesis 2, but more absolutist. However, it's overkill for his arguments.

  4. **Thesis 4 (Reductionism)**  
     *All epistemic properties reduce to accuracy-facts*: Not just value, but rationality, justification, etc., are defined by accuracy relations (e.g., "S is rational iff S's credences minimize expected inaccuracy").  
     - **Status**: Contentious even among accuracy-firsters. Requires a reductive argument that many (e.g., Berker 2013) attack as circular or impossible.  
     - **Supports groupmate's conclusions?** Forces his strongest claims (e.g., "no epistemic difference between equally accurate credence functions"), but likely stronger than he needs.

  5. **Thesis 5 (Uniqueness + Fundamentality)**  
     *Accuracy is the sole fundamental value, and it's uniquely quantified*: There's one "correct" way to measure accuracy (e.g., Brier score), resolving scoring-rule dependence.  
     - **Status**: Highly speculative. Most formal epistemologists reject uniqueness (e.g., Joyce 2009).  
     - **Supports groupmate's conclusions?** Lets him avoid underdetermination worries, but lacks justification.

  ---

  ### Addressing Your Specific Questions
  **(1) Fundamental vs. All Epistemic Value**  
  Accuracy-first needs **Thesis 2 (Fundamental Value)** to derive its core results. This allows derivative goods (e.g., coherence as a *means* to accuracy) but denies intrinsic value to understanding/explanation. The stronger **Thesis 3 (Exclusive Value)** is *not* required—and most accuracy-firsters avoid it, as it risks counterexamples (e.g., a highly accurate but gibberish belief set might lack understanding). Pettigrew (2016, Ch. 2) explicitly defends only the fundamental-value claim.

  **(2) Is "Accuracy" One Thing or Many?**  
  Accuracy is a **family of concepts** indexed to scoring rules. The Brier score and log score can rank credence functions differently (e.g., near-certainty vs. cautious credences). This underdetermination matters:  
  - For **probabilism (coherence)**: Results are robust. Any *strictly proper scoring rule* (Brier/log) shows incoherent credences are accuracy-dominated (Pettigrew 2016).  
  - For **conditionalization**: Requires extra premises. You must assume agents maximize *expected accuracy* (using a proper scoring rule), and different rules can yield different updating policies (e.g., Levinstein 2012).  
  Thus, "accuracy first" isn't fully defined until you pick a scoring rule, but some norms (like coherence) are rule-invariant.

  **(3) What Machinery Survives Without Extra Premises?**  
  - **Probabilism via dominance**: Robust across proper scoring rules. Needs only:  
    - (A) Accuracy is valued (axiologically).  
    - (B) Rational credences avoid *strict dominance* (deontic: if one option is worse in all worlds, reject it).  
    No expected-accuracy calculations required.  
  - **Conditionalization**: Requires stronger assumptions:  
    - (C) Agents maximize *expected accuracy* at each time.  
    - (D) Using a strictly proper scoring rule.  
    This is substantive—one could value accuracy but update differently (e.g., minimize worst-case loss).  
  - **Other norms** (e.g., the Principal Principle): Often need expected-accuracy maximization (Pettigrew 2013).

  **(4) From Value to Rationality: Instrumentalism or More?**  
  Accuracy-first is committed to **epistemic rationality as instrumental rationality toward accuracy**. For example:  
  - Why is incoherence irrational? Because it's *inefficient*—you could be more accurate for free (dominance).  
  - Why conditionalize? Because it maximizes *expected accuracy* (Greaves & Wallace 2006).  
  However, there's a gap: one might value accuracy but reject dominance arguments (e.g., if "worlds" are underspecified). The move from "accuracy is valuable" to "rationality = accuracy-optimization" is a substantive commitment, not a tautology.

  ---

  ### Your Groupmate's Conclusions: What's Licensed?
  - **"Understanding/explanation lack intrinsic epistemic value"**: Requires **Thesis 2 or 3**. Defensible within accuracy-first but controversial outside it. The formalism *does not force this*—you could add understanding as a separate value (though it complicates the "pure" framework).  
  - **"No epistemic difference between equally accurate credence functions"**: Requires **Thesis 2+**. If accuracy is the only fundamental value, ties can't be broken epistemically. But scoring-rule dependence complicates this: two functions tied on Brier might differ on log score.  
  - **"Probabilism is rational due to accuracy-domination"**: Supported by **Thesis 1+** with dominance constraints. The weakest viable version.  

  ### The "Unit of Assessment" Problem
  You're spot-on about the ambiguity:  
  - Accuracy applies to *entire credence functions*, not individual credences. A single credence can be "wildly inaccurate" while the function excels overall (e.g., if errors cancel out).  
  - The slogan *must* be about **expected accuracy** or **dominance avoidance**, not actual accuracy. No credence function is perfectly accurate (assigning 1 to all truths), but we can compare *inaccuracy scores* across possible worlds.  

  ### Recommendations for Pushback
  1. **Separate value from rationality**: Ask how dominance arguments (deontic) derive from accuracy's value (axiological).  
  2. **Challenge reductionism**: Can he *prove* understanding lacks intrinsic value, or is this assumed?  
  3. **Invoke scoring-rule dependence**: If two credence functions are tied on Brier but not log, is there "no epistemic difference"?  
  4. **Question instrumentalism**: Why think rationality *just is* efficiency? (E.g., is consistency rational only because it aids accuracy?)  

  Accuracy-first is powerful but not a monolith. Its core results (probabilism, conditionalization) need only weak versions of the slogan—your groupmate's broader claims require stronger, less settled theses. For deeper dives, see:  
  - Joyce (1998) for the dominance argument.  
  - Pettigrew (2016) for the fundamental-value stance.  
  - Levinstein (2017) on scoring-rule dependence.  
  - Kvanvig (2003) for anti-reductionist views on understanding.
