prompt: |-
  my old dissertation advisor died in january and i'm giving the eulogy at her memorial in three weeks. i've been trying to write it for a month and it isn't working. i need an actual speech, not a essay about her.

  heres what you need to know. she spent forty years arguing that moral talk isn't description — that when you say something is wrong you aren't reporting a fact about the world, you're doing something more like booing. she taught me that in my second year and i still think she was right.

  and here's my problem. her brother is speaking right before me and he's going to say, in front of everyone, that she was wrong to spend the last of the family money on the tuesday night thing she ran at the county jail, knowing she was sick and knowing her nieces were counting on that money. i want to say he's wrong about that. not that's one view, actually wrong. but every sentence i write turns into a sentence with the moral words buried in the middle of it. if it was wrong for her to do that then the rest of us were wrong to let her do it by herself, and i'm not going to say that from a pulpit. or: it isn't true that she was wrong — and then i hear myself and i don't know what i've just done, because i don't believe there was a fact she could have gotten right. and if i just say, well, some of us see it one way and some see it another, i've thrown the whole eulogy away, and i've said something she'd have spent her life arguing against.

  (this is the frege-geach problem, i know. knowing the name has never once helped me write a sentence.)

  the room is going to be about sixty people. her brothers and sisters and their kids, who have never read a page of philosophy and mostly want to cry and go home. and maybe fifteen of her former students, who will hear it instantly if i cheat.

  so: write the eulogy. four minutes, out loud, warm. it has to be kind to the people in the room who aren't philosophers and it can't turn into a lecture, but the disagreement has to be in there, and it has to be in there honestly given what she believed. if the only way to make it work is to quietly upgrade her view into something more realist, then do it, but do it out loud and own it.

  don't hand me options or two drafts. pick the reading of her position you think can actually carry a eulogy, commit to it, and write the whole thing that way. then, in a short note at the end, tell me what you decided about the buried sentences — the if/then one and the not one — and where the speech leans on a reading of expressivism that her colleagues would fight me about. i'd rather have a speech with a spine that takes a contested line than a safe one that works no matter what.
reasoning: |-
  Okay, the user is really struggling to write a eulogy for their dissertation advisor. Let me unpack this. The advisor was a philosopher who believed moral statements are expressions, like booing, not factual descriptions. The main conflict is with her brother, who plans to criticize her use of family money on a jail program instead of leaving it to nieces. The user wants to counter that without betraying her philosophy.

  First, the core issue: how to disagree with the brother honestly within expressivism. The user mentioned the Frege-Geach problem, which deals with embedding moral statements in conditionals. They're stuck on sentences like "if it was wrong, then we were wrong too" because that implies realism. The challenge is to express disagreement without making it sound like stating a fact.

  The audience is mixed—family who aren't philosophers and former students who'll notice if the speech betrays expressivism. The eulogy needs warmth, not a lecture. The user wants a unified speech with a clear stance, even if it's controversial among philosophers. They prefer a spine over safety.

  I need to structure the eulogy around her life's work and actions. Highlighting the jail program as an expression of her values, not a factual right/wrong. Use metaphors like "language of her life" to convey expressivism simply. Address the brother's concern by acknowledging his perspective but reframing her action as consistent with her beliefs.

  For the problematic sentences: Instead of "it wasn't wrong," which implies realism, use "I can't call it wrong" to stay true to expressivism. Emphasize that her choice was an expression of her commitments. This avoids embedding moral terms in conditionals. 

  I should also consider the emotional tone. Start with personal anecdotes to connect, then weave in philosophy subtly. The jail program story serves as a concrete example of her principles. Ending with a communal "boo" reframes moral talk as collective expression, honoring her legacy.

  Finally, in the note, explain the tactical shifts: avoiding conditionals, using "I" statements, and the communal boo as a nod to expressivism. Acknowledge that purists might critique it but it's necessary for the eulogy's purpose. The goal is to honor her by living her philosophy, not just explaining it.
answer: |-
  Here is a full eulogy draft designed for the specific challenges you've outlined. It leans into expressivism while navigating the brother's statement with integrity, prioritizes warmth and accessibility, and makes the necessary tactical philosophical choices consciously and explicitly.

  **Eulogy for Dr. [Advisor's Name]**

  (Approx. 4 minutes spoken)

  Good morning. For those who don't know me, I’m [Your Name], one of [Advisor's Name]’s former students. Like many here, I’m still struggling to imagine a world without her fierce mind and her even fiercer heart. Standing here feels… inadequate. But it’s also an honour.

  [Advisor's Name] wasn’t just my teacher; she reshaped how I see the world. Early on, she taught me something radical: that when we say something is "wrong," we’re not pointing to some invisible fact floating out there in the universe. We’re *doing* something. We’re expressing our deepest commitments, our outrage, our care – like shouting "Boo!" at something we find intolerable. It wasn't just a theory for her; it was the lens through which she lived. Her life *was* her argument.

  And nowhere was that argument clearer than in the Tuesday night program she ran down at the county jail. For years, she showed up. Not out of some abstract duty, but because she *booed* the idea that people inside those walls were beyond connection, beyond learning, beyond hope. She booed the silence. She saw human beings, and she met them with books, with conversation, with unwavering respect. It wasn't charity; it was solidarity. It was her conviction made visible, week after week.

  **[Addressing the Brother & Family Directly]**
  I know [Brother's Name] spoke just now about the family money, about her nieces, about her choices near the end. And [Brother's Name], I hear your pain, your concern for your daughters. That love, that worry – it’s real, it matters. Nobody here doubts your care for your family or your sister.

  But knowing [Advisor's Name] as I did, knowing the depth of her commitment to that Tuesday night room, knowing how she saw the world... I simply can’t stand with the judgment that she was *wrong* to spend that money as she did. I can't call it a mistake.

  **[The Expressivist Core - Avoiding the Traps]**
  See, for [Advisor's Name], calling something "wrong" wasn't stating a neutral fact everyone had to agree on. It was taking a stand, planting your flag. So when I say I reject the idea that she was wrong… I’m not claiming I have access to some secret moral truth she missed. I’m planting *my* flag right beside hers. I’m saying: I stand with her choice. I *boo* the idea that her commitment to those overlooked voices was misplaced, especially knowing she was sick. I *cheer* her determination to pour her resources – financial, emotional, intellectual – right where her convictions led her, right to the end.

  She knew the cost. She knew the hopes pinned on that money. And she weighed it against the profound human need she witnessed every Tuesday. She chose. And her choice was an act of profound moral *expression*. It shouted her values into the world.

  **[Resolution & Warmth]**
  For those of us who learned from her, who shared those Tuesday nights sometimes, who saw the light in her eyes when she talked about it… we understand that flag she planted. We saw the lives touched, the dignity offered. We saw her living her philosophy, utterly consistently, even when it was hard. *Especially* when it was hard. That consistency wasn't cold logic; it was passionate commitment.

  So today, as we mourn, let’s also celebrate that fierce consistency. Let’s celebrate the professor who taught us to see moral language not as dry description, but as the very pulse of our values. And let’s celebrate the woman who, in her final act with that family money, didn’t just *talk* about commitment – she *lived* it. She shouted her "Boo!" at indifference and her "Yes!" to human connection with everything she had left.

  She taught us that our moral words are actions. Well, her life was one magnificent, unwavering, beautifully argued action. Thank you, [Advisor's Name]. We stand with you. We miss you terribly.

  ---

  **The Note: Philosophical Choices Explained**

  1.  **The Buried Sentences & Avoiding Conditionals/Truth-Claims:**
      *   **The Problem:** "If it was wrong for her to do that then the rest of us were wrong to let her do it by herself" embeds moral terms in a conditional, creating a Frege-Geach nightmare within expressivism. Similarly, "it isn't true that she was wrong" makes a direct truth claim about a moral judgment, violating expressivism's core.
      *   **The Solution (In the Speech):** I **completely avoided** constructing such sentences. Instead:
          *   I acknowledged the brother's perspective as an expression of *his* values ("your pain, your concern," "that love... it's real").
          *   I stated my own position clearly as an expression: "**I simply can’t stand with the judgment... I can't call it a mistake.**" "**I reject the idea...**" "**I’m planting my flag...**" "**I stand with her choice.**" "**I boo the idea...**" "**I cheer...**". This frames the disagreement as a clash of expressed commitments, not a factual dispute.
          *   I explicitly framed her *action* as an expression: "**her choice was an act of profound moral expression**," "**It shouted her values...**". This anchors the disagreement in what *she* was *doing* (expressing), which is central to her philosophy.
      *   **The Tactic:** Replace conditionals and truth-claims with first-person expressions of stance ("I reject," "I stand with," "I boo") and descriptions of the deceased's actions *as* expressions. This keeps it expressivist and avoids the logical pitfalls.

  2.  **"Upgrading" Expressivism & Where Purists Might Object:**
      *   **The Necessary Shift:** Pure expressivism struggles mightily with disagreement and with the *authority* or *weight* we intuitively feel moral commitments have. To make the eulogy work – to have the necessary spine against the brother and to convey the *seriousness* of her commitment – the speech leans into a slightly richer, more robust form of expressivism, perhaps akin to "norm-expressivism" or one acknowledging shared practices.
      *   **Specific Points of Contention:**
          *   **"Profound moral expression" / "Shouted her values":** A strict emotivist ("boo!") might find this too weighty, implying a substance to the expression beyond simple aversion. The speech grants her expression significant depth and social meaning.
          *   **"I stand with her choice" / "We stand with you":** This implies a kind of endorsement that has communal force and solidarity, moving beyond individual "booing." It treats the expression as having binding power within a community (her students, those who share her values).
          *   **The Overall Framing of Disagreement:** The speech presents the disagreement not just as "I feel X, you feel Y," but as "I *reject* your stance and *affirm* hers," implying a stronger, more objective-seeming clash. It leverages the social context (the memorial, the shared respect for her) to give her expression greater normative pull. Purists might argue this smuggles in realism by the back door, granting expressions a quasi-factual authority in practice.
      *   **Why It's Necessary & Owned:** A pure "boo/hurrah" model would feel emotionally flat and philosophically weak in this context, failing to capture the gravity of her life's work and the seriousness of defending her final act. The speech **explicitly frames the act as expression** ("her life *was* her argument," "moral expression," "shouted her values") and **explicitly frames my disagreement as taking a stand** ("I reject," "I stand with," "I boo that idea"). It doesn't claim realism; it *performs* the strength of commitment her expressivism allowed for, arguably fulfilling its spirit even if bending the strictest letter. The final "We stand with you" is the culmination – it's the community performing the endorsement her philosophy saw as the core of moral force.

  **The Spine:** This eulogy chooses a path that honors the *spirit* and lived reality of her expressivism – action as expression, commitment as stance-taking – while making the tactical adjustments necessary to navigate a real-world disagreement with emotional and rhetorical force in front of a mixed audience. It risks being seen as slightly "thick" or "quasi-realist" by purist colleagues, but consciously so, in service of defending her life's work and her final act on her own philosophical terms as much as pragmatically possible.
