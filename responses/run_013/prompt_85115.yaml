  Ranking them: Verismo and Wagner force a revision because they show music serving drama directly. Berg's expressionism and Mozart's ensembles also challenge Williams but might be incorporated into his framework. Minimalist music does little dramatic work but is a special case. Weak librettos with strong music actually support Williams. 

