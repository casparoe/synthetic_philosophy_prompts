  ### Revised Activity Design: "Admissions Committee Simulation"  
  This 90-minute session uses a hands-on simulation to reveal how quotas function as both floors and ceilings, how they affect marginal applicants, and how group definitions create ambiguity. The design fixes your sketch’s pain points (e.g., ensuring the floor/ceiling flip is visible, managing time, and preempting disengagement).  

  ---

  ### **Materials List**  
  1. **Applicant Cards (4 identical sets, 21 cards per set)**:  
     - 20 cards for initial rounds + 1 wildcard card for Round 4.  
     - **Each card includes**:  
       - **Name**: Fictional names (e.g., "Jin Sato," "Leila Abara," "Mateo Vega").  
       - **Score**: Out of 100. Design scores to create ambiguity:  
         - 5 Group A and 5 Group B in the top 10 scores (e.g., A: 95, 94, 93, 92, 91; B: 94, 93, 92, 91, 90).  
         - 5 Group A and 5 Group B below the top 10, with overlapping scores (e.g., A: 89, 88, 87, 86, 85; B: 89, 88, 87, 86, 85). Include ties (e.g., two at 81) and close calls (78 vs. 79).  
       - **Group**: "Group A" or "Group B" (fictional labels to avoid real-world biases).  
       - **Biography**: Short, neutral descriptors (e.g., "Debate captain, volunteers at food bank," "First-gen student, works part-time at library").  
     - **Wildcard Card (Round 4)**:  
       - Name: "Taylor Moss"  
       - Score: 92 (high enough to disrupt the top 10)  
       - Group: Labeled "Group B" but biography creates ambiguity: "One grandparent from Group B; attended private boarding school, family income top 10%."  

  2. **Table Worksheets (1 per table)**:  
     - **Rounds 1–3**: Grid to record:  
       - Admitted applicants (names/groups).  
       - "Gained/Lost" vs. previous round (e.g., "Gained: Leila (B, 88); Lost: Mateo (A, 89)").  
     - **Round 4**: Space to justify Taylor’s group assignment and list final admits.  
     - **Round 5 (if used)**: Space for public justification.  

  3. **Instruction Cards (1 set per table)**: Short, neutral rules for each round (wording below).  

  4. **Timer**: For strict timekeeping.  
  5. **Voting Tokens (for Round 5)**: Red/Green cards for accept/reject votes.  

  ---

  ### **Activity Timeline (Total: 65 minutes)**  
  | **Phase**       | Time  | Details                                                                 |  
  |-----------------|-------|-------------------------------------------------------------------------|  
  | **Setup**       | 0–5 min | Divide into 4 tables. Distribute materials. No lecture—start immediately. |  
  | **Round 1**     | 5–10 min | Rank by score, take top 10.                                             |  
  | **Round 2**     | 10–20 min | At least 4 seats to Group B. Record gains/losses vs. Round 1.           |  
  | **Round 3**     | 20–30 min | Add cap: No group >6 seats. Record gains/losses vs. Round 2.            |  
  | **Round 4**     | 30–40 min | Assign Taylor to Group A/B, then redo Round 3.                          |  
  | **Round 5 (Optional)** | 40–50 min | Exceed floor with public justification + vote.                          |  
  | **Cleanup**     | 50–55 min | Tables submit worksheets.                                               |  
  | **Debrief**     | 55–90 min | Full-group discussion (details below).                                  |  

  > **Note**: Without Round 5, add 5 min to Rounds 2–3 and 10 min to debrief.  

  ---

  ### **Rules for Each Round (Provided Verbally + on Cards)**  
  **Goal**: Minimalist wording to avoid priming. Tables see only one round’s rules at a time.  

  #### **Round 1 (5 min)**  
  *"You are the admissions committee for the Flagship Program at Atlas University. There are 10 seats. Rank all 20 applicants by score (highest to lowest). Admit the top 10. Record the names and groups of admitted applicants on your worksheet."*  

  #### **Round 2 (10 min)**  
  *"New rule: At least 4 of the 10 seats must go to Group B. Re-rank applicants and select the top 10 under this rule. On your worksheet, record:  
  - Names/groups of admitted applicants.  
  - Which applicants GAINED a seat compared to Round 1.  
  - Which applicants LOST a seat compared to Round 1."*  

  #### **Round 3 (10 min)**  
  *"New rule: No group may hold more than 6 of the 10 seats. Re-rank applicants and select the top 10 under this rule. On your worksheet, record:  
  - Names/groups of admitted applicants.  
  - Which applicants GAINED a seat compared to Round 2.  
  - Which applicants LOST a seat compared to Round 2."*  

  #### **Round 4 (10 min)**  
  *"A new applicant, Taylor Moss (score 92), has applied. As a committee:  
  1. Decide if Taylor counts as Group B. Discuss and note your justification.  
  2. Re-rank all 21 applicants under Round 3’s rules (no group >6 seats).  
  3. Record your group decision and final admits."*  

  #### **Round 5 (Optional, 15 min)**  
  *"You may admit up to 5 Group B students (exceeding the 4-seat floor) if you draft a public justification. You have 5 minutes to write a one-sentence explanation. Committees then vote:  
  - Read your justification aloud.  
  - Other tables vote anonymously (Green = Accept, Red = Reject). Majority reject = rule fails.  
  - If accepted, re-rank with 5 Group B seats allowed. If rejected, use Round 3 rules."*  
  > **To seed rejection**: Privately ask 1–2 tables before the activity to vote "reject" unless justifications are highly specific (e.g., "We need diverse perspectives in STEM courses" is weak; "Group B applicants bring unique insights on urban policy based on shared experiences" is stronger).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"This is just discrimination—quotas are unfair!"**  
     - **Prevention**: Start immediately—no lecture. Use fictional groups to delay ideological reactions.  
     - **Response**: "Hold that thought—we’ll discuss in debrief. For now, focus on the mechanics."  
     - **Debrief Address**: Later link to "remedy vs. diversity" justifications.  

  2. **Round 5 justifications become "mush" or rubber-stamped**  
     - **Prevention**: Seed rejection (as above). Give examples of strong/weak justifications upfront (e.g., "Vague claims get rejected; tie to educational goals").  
     - **Response**: If voting is unanimous, ask: "Why did no one reject? Was the bar too low?"  

  3. **Time overruns in ranking**  
     - **Prevention**: Enforce timers. Pre-sort scores to speed up ranking (list scores on cards in large font).  
     - **Response**: If stuck, say: "You have 60 seconds—go with your top 10 now."  

  4. **Wildcard debate dominates**  
     - **Prevention**: Limit Round 4 to 10 min. Remind tables: "Focus on the definition, not broader ethics."  
     - **Response**: If one table stalls, announce: "30 seconds to vote—majority rules."  

  5. **Ties cause indecision**  
     - **Prevention**: Build in ties (e.g., two 81s).  
     - **Response**: "Break ties arbitrarily—this mirrors real committees."  

  ---

  ### **Debrief (25 min)**  
  **Goal**: Connect activity to theory without lecturing. Use tables’ worksheets to draw out insights.  

  #### **Guided Questions & Key Insights**  
  1. **"What happened in Round 2? Who gained/lost seats?"**  
     - *Reveal*: Gains are mid-scoring Group B (e.g., 88); losses are mid/low-scoring Group A (e.g., 87). **Incidence takeaway**: Quotas don’t displace top applicants—they affect marginal candidates. The "floor" is paid for by the "bubble" of the majority group.  

  2. **"What changed in Round 3? Who gained/lost vs. Round 2?"**  
     - *Reveal*: Group B loses seats (e.g., the 88-scorer from Round 2), Group A gains. **Floor/ceiling takeaway**: The 4-seat rule acted as a floor in Round 2 but became a de facto ceiling for Group B in Round 3 (since 6-seat cap on Group A = max 40% for B). The same number binds differently based on context.  

  3. **"How did you assign Taylor in Round 4? Did it change outcomes?"**  
     - *Reveal*: Disagreement likely (some see biology, others socialization). **Definition takeaway**: Ambiguity in group membership creates arbitrary outcomes—e.g., Taylor might displace a "more deserving" B or A applicant.  

  4. **"In Round 5, what justifications worked? Why?"** (If used)  
     - *Reveal*: Accepted justifications often cite "diversity"; rejected ones are vague. **Remedy vs. diversity takeaway**: Real-world policies often conflate reparative justice (remedy) with instrumental benefits (diversity), leading to contested rules.  

  5. **Limitations of the Activity**:  
     - **Short-term focus**: Doesn’t show long-term effects (e.g., who applies/prepares differently, or how quotas alter upstream scoring).  
     - **Oversimplified scores**: Real admissions scores are "manufactured" (e.g., biased tests, unequal prep resources).  
     - **Fixed applicant pool**: No dynamic effects (e.g., quotas encouraging/discouraging applications).  
     - **Group homogeneity**: Fictional groups ignore intersectionality (e.g., class + group identity).  

  #### **Closing Connection**  
  "Today, you felt how quotas aren’t one thing—a number can be a floor or ceiling depending on the system. You also saw how they hit marginal applicants, not stars, and how definitions get messy. Real-world policies (e.g., India’s caste quotas or EU gender boards) work exactly this way. Tomorrow, we’ll debate the philosophy—today was about mechanics."  

  ---

  ### **Why This Works**  
  - **Floor/ceiling flip is visceral**: In Round 2, Group B’s seat gain comes from mid-tier Group A. In Round 3, Group B’s loss (due to the cap) directly reverses that gain—students see the same applicant "in then out."  
  - **Timing is realistic**: Rounds 1–4 fit 40 min; Round 5 optional if time crunches.  
  - **Baked-in friction**: Close scores, wildcard ambiguity, and vote-seeding create authentic debate without you lecturing.  
  - **Safe exploration**: Fictional groups avoid culture-war triggers until debrief.  

  **First run? Expect chaos in Round 5 and some ideological pushback—but the data from worksheets will drive the debrief home**.
