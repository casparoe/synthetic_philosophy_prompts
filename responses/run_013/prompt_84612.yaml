  **Examination Question:**

  **Part 1: Expected Chord Length in a Unit Circle**

  Consider a unit circle (radius 1) and a random chord. Compute the expected length of the chord under each of the following three randomization schemes:

  (a) The two endpoints of the chord are chosen independently and uniformly at random on the circumference.

  (b) A radius is chosen uniformly at random (i.e., an angle θ uniformly in [0, 2π)), and then a point is chosen uniformly at random along that radius. The chord is drawn perpendicular to the radius at that point.

  (c) The midpoint of the chord is chosen uniformly at random from the interior of the disk.

  **Part 2: Random Plane Cutting a Unit Ball**

  Now consider a unit ball (radius 1) in three dimensions. A random plane cuts the ball, and the intersection is a circle. The radius of this circle depends on the distance d from the centre of the ball to the plane (with 0 ≤ d < 1). 

  (i) Construct two different, prima facie legitimate, ways of choosing such a random plane. 

  (ii) For each of your two methods, compute the probability that the radius of the intersection circle is greater than 1/2.

  (iii) Explain why the disagreement between the probabilities you obtain is not resolved by appealing to the rotational symmetry of the ball. In particular, explain why the rotation group, while fixing the orientation of the plane, does not determine the distribution of the distance d.

  **Part 3: Conceptual Discussion**

  (i) State precisely what the principle of indifference demands. In particular, it requires a measure on the space of possibilities and a principled reason to prefer one parameterisation of that space over another. Distinguish between indifference among outcomes and indifference among parameterisations.

  (ii) Assess whether any invariance or symmetry principle can supply the missing measure in the above paradoxes, or whether the paradoxes show that the phrase "uniformly at random" is simply incomplete until a physical chance mechanism is specified.

  **Model Answer (Approximately 600 words):**

  **Part 1: Expected Chord Length in a Unit Circle**

  (a) **Endpoints chosen uniformly on circumference:**  
  Let the circle be centered at the origin. Fix one endpoint at (1,0) without loss of generality by rotational symmetry. Let the other endpoint be at an angle θ uniformly in [0, 2π). The chord length L between (1,0) and (cos θ, sin θ) is 2|sin(θ/2)|. The expected length is:
  E[L] = (1/(2π)) ∫₀^{2π} 2 |sin(θ/2)| dθ.
  Since sin(θ/2) is non-negative in [0,2π), we can drop the absolute value. Using the identity, we have:
  E[L] = (1/π) ∫₀^{2π} sin(θ/2) dθ = (1/π) [-2 cos(θ/2)] from 0 to 2π = (1/π)( -2(-1) - (-2)(1) ) = (1/π)(2+2) = 4/π ≈ 1.273.

  (b) **Chord perpendicular to a uniformly chosen radius at a uniformly chosen point along the radius:**  
  Choose a radius uniformly (so the direction is uniform). Let the distance from the center to the chord be r, chosen uniformly in [0,1]. The chord length is 2√(1 - r²). Therefore,
  E[L] = ∫₀¹ 2√(1 - r²) dr.
  This integral is the area under a semicircle of radius 1, which is π/4. But note: the integral of √(1-r²) from 0 to 1 is the area of a quarter circle of radius 1, which is π/4. Hence, E[L] = 2 * (π/4) = π/2 ≈ 1.571.

  (c) **Midpoint chosen uniformly in the disk:**  
  The midpoint of the chord must lie inside the disk. Let the midpoint be at distance r from the center (0 ≤ r ≤ 1). The set of midpoints at distance r has area proportional to r (because the area element is 2πr dr). However, we are choosing the midpoint uniformly in the disk, so the density with respect to r is proportional to the circumference at r, i.e., the density is 2πr / (π) = 2r for r in [0,1]. The chord length is 2√(1 - r²). Therefore,
