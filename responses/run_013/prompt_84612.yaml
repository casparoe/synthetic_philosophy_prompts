  We are designing an exam question that breaks the reflex of reciting Bertrand's paradox by requiring the candidate to compute expected chord lengths under three different randomization schemes and then to apply similar reasoning to a new scenario involving a random plane cutting a unit ball. The question has three parts: (1) expected chord length in the circle under three schemes, (2) probability that the intersection circle in the ball has radius > 1/2 under two schemes and a discussion of why symmetry doesn't resolve the disagreement, and (3) a conceptual discussion of the principle of indifference.

