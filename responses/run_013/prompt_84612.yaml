answer: |-
  ### Examination Question

  **Part 1: Expected Chord Length in a Unit Circle**  
  Consider a unit circle (radius 1). Compute the expected length of a random chord under each randomization scheme:  
  (a) The two endpoints are chosen independently and uniformly on the circumference.  
  (b) A radius is chosen uniformly at random (i.e., direction θ ∼ Uniform[0, 2π)), and a point along this radius is chosen uniformly; the chord is perpendicular to the radius at this point.  
  (c) The midpoint is chosen uniformly from the interior disk.  

  **Part 2: Random Plane Cutting a Unit Ball**  
  Consider a unit ball (radius 1) in 3D. A random plane intersects the ball, forming a circle of radius \( r = \sqrt{1 - d^2} \), where \( d \) (0 ≤ d < 1) is the distance from the ball’s centre to the plane.  
  (i) Construct two prima facie legitimate ways to randomize the plane.  
  (ii) For each, compute the probability that \( r > 1/2 \).  
  (iii) Explain why rotational symmetry of the ball does *not* resolve any disagreement between your probabilities, as it fixes orientation but not the distribution of \( d \).  

  **Part 3: Conceptual Analysis**  
  (i) State what the principle of indifference demands (include measures and parameterisation). Distinguish indifference among *outcomes* from indifference among *parameterisations*.  
  (ii) Assess whether invariance/symmetry principles can supply a unique measure, or if "uniformly at random" is incomplete without a physical mechanism.  

  ---

  ### Model Answer (Approx. 600 words)  

  **Part 1: Expected Chord Length**  
  *(a) Endpoints uniform on circumference:* Fix one endpoint at (1,0). Let the other be (cos θ, sin θ) with θ ∼ Uniform[0, 2π). Chord length is \( L = 2|\sin(\theta/2)| \). Expectation:  
  \[
  \mathbb{E}[L] = \frac{1}{2\pi} \int_0^{2\pi} 2 \sin(\theta/2)  d\theta = \frac{2}{\pi} \int_0^{2\pi} \sin(\theta/2)  d\theta = \frac{2}{\pi} \left[ -2\cos(\theta/2) \right]_0^{2\pi} = \frac{4}{\pi} \approx 1.273.
  \]  
  *(b) Perpendicular chord to uniform radius:* Let \( r \sim \text{Uniform}[0,1] \) be distance from centre to chord. Length \( L = 2\sqrt{1 - r^2} \). Expectation:  
  \[
  \mathbb{E}[L] = \int_0^1 2\sqrt{1 - r^2}  dr = 2 \cdot \frac{\pi}{4} = \frac{\pi}{2} \approx 1.571 \quad \text{(quarter-circle area)}.
  \]  
  *(c) Midpoint uniform in disk:* Let \( r \) be distance from centre to midpoint. Uniform density over disk gives radial density \( f_r(r) = 2r \) (area element). Length \( L = 2\sqrt{1 - r^2} \). Expectation:  
  \[
  \mathbb{E}[L] = \int_0^1 2\sqrt{1 - r^2} \cdot 2r  dr = 4 \int_0^1 r \sqrt{1 - r^2}  dr.
  \]  
  Substitute \( u = 1 - r^2 \), \( du = -2r  dr \):  
  \[
  \mathbb{E}[L] = 4 \int_1^0 \sqrt{u} \cdot (-\frac{du}{2}) = 2 \int_0^1 u^{1/2}  du = 2 \cdot \frac{2}{3} = \frac{4}{3} \approx 1.333.
  \]  
  Expectations differ: \( 4/\pi \), \( \pi/2 \), \( 4/3 \).  

  **Part 2: Random Plane in Ball**  
  *(i) Randomization schemes:*  
  - **Scheme A (Uniform d):** Choose \( d \sim \text{Uniform}[0,1] \).  
  - **Scheme B (Uniform point-normal):** Choose a point uniformly in the ball and a normal vector uniformly on the unit sphere; the plane passes through the point with that normal.  
  *(ii) Probability \( r > 1/2 \):*  
  - **Scheme A:** \( r = \sqrt{1 - d^2} > 1/2 \) ⇒ \( d < \sqrt{3}/2 \). Since \( d \sim \text{Uniform}[0,1] \),  
  \[
  P_A = P\left(d < \sqrt{3}/2\right) = \sqrt{3}/2 \approx 0.866.
  \]  
  - **Scheme B:** Distance \( d = |\mathbf{n} \cdot \mathbf{p}| \), where \( \mathbf{p} \) is the random point. The radial density for \( \|\mathbf{p}\| \) is \( 3r^2 \) (volume element). Projection \( \mathbf{n} \cdot \mathbf{p} \) has density \( f_d(d) = \frac{3}{2}(1 - d^2) \) for \( d \in [0,1] \) (symmetric about 0). Thus,  
  \[
  P_B = P(d < \sqrt{3}/2) = \int_0^{\sqrt{3}/2} \frac{3}{2}(1 - d^2)  dd = \frac{3}{2} \left[ d - \frac{d^3}{3} \right]_0^{\sqrt{3}/2} = \frac{3}{2} \left( \frac{\sqrt{3}}{2} - \frac{(\sqrt{3}/2)^3}{3} \right) = \frac{9\sqrt{3}}{16} \approx 0.974.
  \]  
  *(iii) Role of symmetry:* Rotational symmetry implies the normal is uniform, but it does not constrain the distribution of \( d \). Both schemes are rotationally invariant (direction is uniform), yet yield different \( d \)-distributions. Symmetry fixes orientation but not the radial parameterization.  

  **Part 3: Conceptual Analysis**  
  *(i) Principle of indifference demands:*  
  - A measure on the possibility space (e.g., uniform measure for chords).  
  - A reason to prefer one parameterisation (e.g., endpoints) over another (e.g., midpoints).  
  *Distinction:* Indifference among *outcomes* (e.g., "all chords equally likely") is ill-defined without a measure. Indifference among *parameterisations* (e.g., "uniform endpoints" vs. "uniform midpoints") leads to contradictions, as seen.  

  *(ii) Assessment:*  
  - Invariance/symmetry (e.g., Euclidean group) can suggest measures (e.g., Scheme A is rigid-motion invariant), but the ball’s rotational symmetry alone is insufficient—it fixes orientation, not \( d \).  
  - The paradox shows that "uniformly at random" is incomplete; a physical mechanism (e.g., endpoint selection) is necessary to specify the measure.  

  **Confidence:**  
