  Therefore, the cumulative distribution function of D = |proj| is F_D(d) = [2π (d - d³/3)] / (4π/3) = (3/2) (d - d³/3) for d in [0,1]. Then the density is f_D(d) = (3/2)(1 - d²) for d in [0,1].

