  To avoid this mistake, we must draw a causal diagram (DAG) to understand the relationships between variables. Without a causal model, we might condition on a mediator and incorrectly interpret the direct effect as the total effect.

  In summary, the slogan "disaggregate" is not always the right move. We need to think about the causal structure.
answer: |-
  ### Example: Simpson's Paradox with a Mediator (Drug and Recovery Study)

  **Setting**: A clinical trial tests a new drug (Drug X) for a disease. Researchers measure two variables:  
  - **Treatment**: Drug X (1) vs. placebo (0).  
  - **Rash**: Side effect (1 = present, 0 = absent).  
  - **Outcome**: Recovery (1 = recovered, 0 = not recovered).  

  **Causal Structure**:  
  - Drug X **causes** rash (e.g., as a side effect).  
  - Rash **reduces** recovery probability (e.g., it weakens the immune system).  
  - Drug X also has a **direct positive effect** on recovery (e.g., it targets the disease).  
  Here, **rash is a mediator** between treatment and outcome.  

  #### Data:
  **Pooled (Aggregated) Data**:  
  | Group   | Recovered | Total | Recovery Rate |  
  |---------|-----------|-------|---------------|  
  | Placebo | 76        | 100   | 76%           |  
  | Drug X  | 55        | 100   | 55%           |  

  ➔ **Conclusion**: Placebo has a higher recovery rate. Avoid Drug X!  

  **Stratified by Rash**:  
  *Stratum 1: No Rash*  
  | Group   | Recovered | Total | Recovery Rate |  
  |---------|-----------|-------|---------------|  
  | Placebo | 70        | 90    | 77.8%         |  
  | Drug X  | 45        | 50    | 90.0%         |  

  *Stratum 2: Rash Present*  
  | Group   | Recovered | Total | Recovery Rate |  
  |---------|-----------|-------|---------------|  
  | Placebo | 6         | 10    | 60.0%         |  
  | Drug X  | 10        | 50    | 20.0%         |  

  ➔ **Conclusion in Strata**:  
  - **No rash**: Drug X has a higher recovery rate (90% vs. 77.8%).  
  - **Rash present**: Drug X has a lower recovery rate (20% vs. 60%).  

  #### The Paradox:  
  - **Aggregated**: Placebo wins (76% > 55%).  
  - **Stratified**: Drug X wins in the "no rash" group, but loses in the "rash" group.  
  - **Causal Reality**:  
    - Drug X causes rash in 50% of patients (vs. 10% for placebo).  
    - Rash lowers recovery rates (placebo: 60% → 77.8% without rash; Drug X: 20% → 90% without rash).  
    - Drug X has a **net harmful effect** because it frequently triggers rash, which reduces recovery.  

  ---

  ### Why Disaggregating Here is the **Wrong Move**:  
  1. **Rash is a mediator, not a confounder**:  
     - Disaggregating conditions on rash, blocking the path **Drug X → Rash → Recovery**.  
     - This hides the drug’s harmful **indirect effect** (via rash) and only shows its beneficial direct effect.  
     - The stratified tables make Drug X appear beneficial when rash is absent, but this ignores how Drug X *increases the risk of rash*.  

  2. **The "Slogan" Failure**:  
     - Someone who blindly follows "aggregation hides the truth" would disaggregate and conclude:  
       *"Drug X works better than placebo in patients without rash (90% vs. 77.8%). For patients with rash, it’s worse, but we can avoid giving it to those at risk of rash."*  
     - **Mistake**: This ignores that Drug X *causes* rash! The "benefit" in the no-rash group is an illusion because:  
       - The drug’s net effect reduces recovery by 21% (76% → 55%).  
       - Prescribing it only to low-rash-risk patients won’t fix its causal effect (rash still occurs in 50% of cases).  

  3. **Correct Interpretation**:  
     - The aggregated data reveals the **total effect**: Drug X harms recovery by increasing rash incidence.  
     - Stratifying on rash (a mediator) distorts causality: It makes Drug X look better locally but hides its global harm.  

  ---

  ### Rule of Thumb: Confounder vs. Mediator/Collider  
  To decide whether to disaggregate, **ask**:  
  > *"Is the variable I’m stratifying on a common **cause** of treatment and outcome, or is it an **effect** of treatment?"*  

  | Type         | Role                                      | Disaggregate? | Example                     |  
  |--------------|-------------------------------------------|---------------|----------------------------|  
  | **Confounder** | Affects **both** treatment and outcome.   | ✅ **Yes**      | Age in a diet study (older people may diet more *and* have worse health). |  
  | **Mediator**  | Treatment **causes** it, and it affects outcome. | ❌ **No**       | Rash (above): Drug → Rash → Recovery. |  
  | **Collider**  | **Effect** of treatment and outcome (or other variables). | ❌ **No**       | Conditioning on "hospitalization" in a health study (treatment and severity both cause hospitalization). |  

  **Key Insight**:  
  - Disaggregate **only for confounders** (to reveal hidden truths).  
  - **Never for mediators/colliders** (to avoid distorting causality).  
  - **Causal diagrams** (DAGs) are essential to map relationships *before* stratifying.  

  **In this case**: Rash is a mediator → **trust the aggregated data** for total effect.
