  ### Key Clarifications
  - **Why "Idle Anchor"?** It emphasizes the inertness ("idle") and the purported stability ("anchor") of our access. It's concise and avoids existing jargon.
  - **Unity Verdict:** The pattern is one phenomenon because the core tension—how reliability persists without causal efficacy—and the strategies to resolve it are structurally identical, regardless of whether F is qualia, meaning, or moral facts. Differences arise in *how convincingly* escape hatches apply (e.g., supervenience might work better for qualia than morals), but the pattern itself is unified.
  - **Critical Edge:** For an escape hatch to "work," it must close the explanatory gap without smuggling in causation or trivializing reliability (e.g., supervenience requires necessity, not mere correlation). Most instances you cite treat the hatch as sufficient without proving necessity.
  - **What You're Not Describing:** This isn't just about causal exclusion (which stops at idleness) or companions in guilt (which is defensive). It's the specific *pairing* and the moves used to preserve reliability.
