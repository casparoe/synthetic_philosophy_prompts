prompt: |-
  Supererogation is usually introduced with heroic cases — the bystander who wades into a freezing river to pull out a stranger, the donor who surrenders a kidney to someone she has never met — and I can accept that such acts are neither required nor forbidden. What I cannot accept is that the category deserves to be treated as a genuine philosophical puzzle rather than a piece of moral bookkeeping, and I suspect the received view is confused at precisely this point. My argument runs as follows. If an act is not required, then the agent who omits it does nothing wrong, and in that respect stands exactly where the agent who performs it stands, since both have done only what they were at liberty to do; and if the two agents are equally within their rights, it seems arbitrary to insist that one of them acted better. Suppose instead that performing the act really is better — that the rescuer is admirable in a way the onlooker is not. Then the onlooker was under some obligation to act, and we are calling that obligation supererogatory only because we are reluctant to blame her for neglecting it. So either the category collapses into the merely permissible, or it collapses into ordinary duty supplemented by a sentimental unwillingness to enforce it. I take this to be a serious difficulty for the standard account, and I would like to know how a defender would answer it — in particular, whether the notion survives once one separates what we are prepared to demand of people from what they are actually required to do. One further case leaves me equally stuck: two people make the same large donation, but for one the sum is trivial and for the other it means genuine sacrifice. If the act performed is identical, is only the second donation supererogatory, or does lying beyond the call of duty depend on the agent's circumstances rather than on the act?
reasoning: |-
  Okay, the user is presenting a challenge to the concept of supererogation. They start by acknowledging heroic acts like saving someone from a freezing river or donating a kidney as neither required nor forbidden. But they argue that supererogation shouldn't be seen as a philosophical puzzle—it's just moral bookkeeping. Their main argument is that if an act isn't required, then not doing it isn't wrong. So both the one who acts and the one who doesn't are equally within their rights. Therefore, calling one "better" seems arbitrary. 

  Alternatively, if acting is better, then the person who didn't act has neglected an obligation. Then calling it supererogatory is just being reluctant to blame them. So the category either collapses into the merely permissible or into duty with leniency. The user sees this as a serious difficulty for the standard account and wants to know how a defender would answer. They also bring up a case where two people make the same large donation, but for one it's trivial and for the other a sacrifice. Is supererogation about the act or the agent's circumstances? 

  I need to unpack their argument. The user is essentially attacking the coherence of supererogation. They're saying it's either not required (so not better) or it is required (so not supererogatory). The donation case adds another layer: does the moral value depend on the agent's sacrifice? 

  The user seems well-versed in moral philosophy, likely an academic or student. Their challenge is rooted in analytic philosophy, possibly influenced by thinkers like David Heyd or J.O. Urmson. They might be preparing for a debate or writing a paper. Their deeper need might be to test the robustness of supererogation against reductionist arguments. They might also be skeptical about moral categories that aren't clearly obligatory or permissible. 

  To respond, I should address both parts of their argument. For the first, defenders of supererogation would argue that moral value isn't binary. An act can be permissible not to do but still praiseworthy to do. The river example: not saving is permissible, but saving is supererogatory because it exceeds basic duties. The moral significance lies in the intention and effort, not just obligation. 

  For the donation case, supererogation often includes the agent's sacrifice. The same act can be ordinary for one (if trivial) but supererogatory for the other due to the sacrifice. This ties into moral worth, where motivation and cost matter. 

  The user's challenge about separating societal demands from actual obligations is key. Defenders might argue that what we demand (blame for not doing) is different from what we admire (praise for doing). Supererogation exists in that gap—acts we praise but don't blame omission for. 

  I should also mention that collapsing supererogation into duty with leniency overlooks the structural role it plays in allowing moral flexibility. People have discretion in how they fulfill duties, and supererogation acknowledges exceptional efforts. 

  The user's underlying concern might be about moral relativism or the subjectivity of praise. By questioning if supererogation depends on circumstances, they're probing whether moral judgments are agent-relative. A good response would affirm that context and agent-specific factors are integral to supererogation, distinguishing it from strict duties. 

  In conclusion, the defender's answer hinges on rejecting the dichotomy the user presents. Supererogation is a distinct category because moral evaluation includes more than obligation—it encompasses the admirable beyond the obligatory, considering both act and agent circumstances.
answer: |-
  Your challenge cuts to the heart of supererogation and exposes genuine tensions in the standard account. Defenders typically respond along several key lines, addressing both your core collapse argument and the donation case:

  1.  **Rejecting the Equivalence Thesis ("Both Stand Equally"):**
      *   **Differential Moral Value:** Defenders argue that while both the actor and the non-actor are *permitted* (neither does wrong by omission or commission), they are *not* morally equivalent. Performing the supererogatory act possesses *positive moral value* that omission lacks. It *is* better to save the drowning child than to watch idly, even though watching idly isn't *wrong* (assuming no special duty exists). The rescuer *is* admirable in a way the onlooker is not.
      *   **Beyond Permissibility:** Permissibility is a baseline – it defines what you *may* do without wrongdoing. Supererogation identifies acts that go *beyond* this baseline, exhibiting virtues like courage, extreme beneficence, or self-sacrifice that are *praiseworthy* but not *demandable*. Morality isn't exhausted by the forbidden and the obligatory; it includes a space for the *admirable* and *excellent*.

  2.  **Denying the Obligation Implication ("Then the onlooker was under some obligation"):**
      *   **Separating Praise and Blame:** This is the crucial move. Defenders argue that the link between "X is the best/most admirable thing to do" and "Not doing X is blameworthy/wrong" is broken for supererogatory acts. While the rescuer is praiseworthy, the onlooker is *not blameworthy* for failing to act. Morality sets a minimum standard of conduct (duty) that must be met to avoid blame, but it also recognizes a higher standard of excellence that merits praise when achieved.
      *   **The "Good-Ought" Gap:** The argument highlights the gap between what is *good* or *best* and what we are *obligated* to do. Morality doesn't obligate us to maximize the good in every circumstance, especially at extreme cost to ourselves. We are obligated to avoid causing harm and fulfill basic duties (fidelity, justice, basic beneficence), but going far beyond that (heroic self-sacrifice) is optional, though supremely good.

  3.  **Addressing "Sentimental Unwillingness":**
      *   **Structural, Not Sentimental:** The distinction isn't based on sentimentality about enforcement, but on a *structural feature* of morality. Obligations are *claimable* – others have a right to demand them. Supererogatory acts involve *giving more than anyone can claim as their due*. No stranger has a *right* to my kidney or my life. Enforcing such extreme sacrifices would violate fundamental rights to bodily integrity and autonomy, undermining the very basis of morality.
      *   **Cost and Limits:** The demandingness of an act matters. Morality recognizes human limits. While we may have a *pro tanto* reason to help, this reason can be overridden by the *significant cost to the agent* in supererogatory cases. This cost exemption negates the *obligation* while leaving the *positive value* intact.

  4.  **Answering the Donation Case:**
      *   **Agent-Relativity of Supererogation:** Most defenders argue that supererogation is fundamentally **agent-relative**. The *same act* (donating $10,000) can be supererogatory for one agent (for whom it's a huge sacrifice) and merely permissible or even obligatory (if very wealthy and facing extreme need) for another.
      *   **Moral Worth vs. Rightness:** This case distinguishes the *rightness of the act* from its *moral worth*. Both donations are equally *right* (and praiseworthy to some degree). However, the donation involving significant *sacrifice* possesses greater *moral worth* and falls squarely into the supererogatory category *for that agent*. The sacrifice highlights the *cost* that exempts the agent from an obligation while making the act exceptionally virtuous.

  **How a Defender Answers Your Core Challenge:**

  A defender would argue that your dichotomy ("collapses into permissible" vs. "collapses into duty + leniency") is false. Supererogation is a *sui generis* category precisely because it occupies the space *between* mere permissibility and obligation:

  1.  **Distinct from Mere Permissibility:** Unlike simply eating vanilla ice cream (permissible but morally neutral), the supererogatory act has significant *positive moral value* and is *praiseworthy*. It actively promotes significant good or exemplifies high virtue.
  2.  **Distinct from Obligation (+ Leniency):** Unlike failing to keep a promise (blameworthy), failing a supererogatory act is *not blameworthy*. The "leniency" isn't arbitrary sentiment; it's based on the *moral structure* that exempts agents from obligations involving excessive cost. The act isn't *required*; it's *beyond* requirement.

  **Surviving the Separation Test:**

  The defender insists the notion *does* survive separating "what we demand" (enforceable obligation) from "what they are required to do" (duty). Supererogation lives in the gap:

  *   **What we demand/are required to do:** The realm of obligation, where omission is blameworthy.
  *   **What we admire/praise but cannot demand:** The realm of supererogation, where omission is not blameworthy, but commission is exceptionally praiseworthy. We recognize the rescuer's act as *morally superior* to the onlooker's inaction, even though we cannot *condemn* the onlooker.

  **In Conclusion:**

  The defender argues that your collapse argument fails because it assumes morality only recognizes two evaluations: blameworthy wrong and non-blameworthy permissible. Supererogation introduces a third: the non-obligatory, non-blameworthy omission coupled with the praiseworthy, morally superior commission. The donation case reinforces that this evaluation is sensitive to the agent's circumstances, particularly the cost involved. The category persists as a way to recognize the extraordinary good people *can* do, without imposing the unbearable burdens that would make morality unreasonable or tyrannical. The puzzle lies in defining the boundary between duty and supererogation, but the category itself is seen as essential for a realistic and humane moral picture.
