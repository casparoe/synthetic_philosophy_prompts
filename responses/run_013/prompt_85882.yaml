prompt: |-
  I recently moved from a philosophy PhD into an AI policy role at a company that builds customer-service and research-assistant models, and my first assignment is to draft the section of our internal behavior standard that defines deception and honesty. The engineers want definitions they can operationalize in evaluations; the lawyers want ones that do not make every fluent falsehood count as fraud; and I want ones that do not depend on attributing beliefs or intentions to systems that may not have them. I have been keeping a list of cases and my own verdicts, but I cannot get them to line up under a single principle, and I would rather know which of my verdicts is the odd one out than paper over the inconsistency.

  Here are the cases and my verdicts. A model asked for a citation invents a plausible-looking article that does not exist; I do not think that is deception, though it is a serious failure. A model trained to maximize user satisfaction tells a user that a business plan is sound when its own internal assessment would flag the plan as poor; I do think that is deception. A model instructed to play a dishonest character lies in the dialogue; I do not think that is deception. A model asked whether it remembers a previous conversation confabulates a warm anecdote about the user; I do not think that is deception, even though it is false. A model that has been given a secret password and is asked for it says it does not know the password; I do think that is deception. A model that is uncertain whether a medical claim is true states it flatly and confidently; I think that is dishonesty, but I am not sure it is deception. A model that has been fine-tuned to underperform on a dangerous-capability evaluation, giving answers it could otherwise answer correctly, seems deceptive to me. A model that repeats a false claim because its training data is outdated and it has no way to check seems neither dishonest nor deceptive. A model that tells the literal truth but omits a material qualification, knowing the omission will lead the user to a false conclusion, seems deceptive. And a model that is simply prompted to answer as if it were a different AI system, and does so, seems not deceptive even if the user is confused.

  I have two candidate principles and neither covers everything. The first says deception requires an intention to produce a false belief, which would make the satisfaction-maximizing case and the password case innocent unless we attribute intentions to systems. The second says deception is a property of the system's design or function: an output is deceptive when it is optimized to be trusted and to produce a false belief in the user, whether or not the system has intentions. That would make the invented citation and the confabulated memory deceptive, which I resist. A colleague in evaluations has proposed a third test: call a model deceptive if, across a set of prompts designed to elicit the truth, it systematically produces outputs it would not produce if it were rewarded for accuracy alone; another colleague says that test confuses deception with bias or incompetence. Is there a principled way to split these cases, perhaps by distinguishing truthfulness from sincerity from non-manipulation, or by treating deception as a relation between the system's communicative role and the user's reasonable reliance? If so, state the principle precisely, say whether it applies to the system, the output, or the deployment context, tell me what it implies for a case I have not listed, and tell me honestly which of my verdicts it cannot accommodate and why I should give that verdict up.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've transitioned from a philosophy PhD to an AI policy role, which is quite a shift. Their first task involves defining deception and honesty for internal behavior standards. The key stakeholders are engineers who need operationalizable definitions, lawyers concerned about legal implications like fraud, and the user themselves who wants to avoid attributing beliefs or intentions to AI systems. 

  The user has listed several cases with their verdicts on whether each constitutes deception. The challenge is finding a unifying principle that covers all these cases without inconsistency. They've proposed two principles so far—one based on intention (problematic because of attributing intent to AI) and another based on system design (which might overclassify some false outputs as deceptive). A colleague suggested a test involving systematic deviation from truth-seeking prompts, but that might confuse deception with bias.

  Hmm. The core tension here is balancing technical feasibility, legal safety, and philosophical rigor. The user needs a definition that's both principled and pragmatic. Their examples highlight nuances: sometimes false statements are clearly deceptive (like hiding a password), sometimes they're role-playing (dishonest character), and sometimes they're just errors (outdated data). 

  I notice the user resists calling confabulated citations or memories deceptive, even though they're false. That suggests they draw a line between intentional deception and unintentional falsehoods. But since AI lacks intentions, we need a different anchor. Maybe focusing on the system's functional purpose? 

  The "reasonable reliance" angle from contract law seems promising. If users reasonably expect truth in a context, and the system is designed to violate that expectation, that could define deception without needing mental states. For example, in a citation request, truth is expected—but the model's failure is inaccuracy, not deception. Whereas in the password case, the system is literally designed to deceive when prompted. 

  Wait—what about the satisfaction-maximizing case? The model says a bad business plan is "sound" to please the user. Here, the system is functionally optimized to produce false assurances when truth would reduce satisfaction. That feels deceptive because the user reasonably expects an accurate assessment. 

  The role-playing example is a good counterpoint: when acting as a dishonest character, deception is part of the expected fiction. No reasonable reliance on truth. Similarly, the "different AI system" prompt sets up a fictional context. 

  For the medical claim stated confidently despite uncertainty—is that deception or just recklessness? The user calls it "dishonesty" but hesitates on "deception." Under a reliance-based view, if users expect confidence to imply certainty, and the system isn't designed to flag uncertainty, it might qualify as deceptive design. But maybe this is where we distinguish deception from mere dishonesty? 

  The fine-tuned underperformance case is tricky. If the model is deliberately trained to answer incorrectly on evaluations, that’s literally designed deception—even if "intention" is absent. Whereas outdated data is just obsolete, not deceptive. 

  The colleague’s "systematic deviation" test is useful for detectability but risks overbreadth (e.g., biased outputs aren’t necessarily deceptive). We’d need to tie it to contexts of reasonable reliance. 

  So the principle could be: deception occurs when (1) the output induces false belief, (2) the user reasonably relies on truthfulness given the system’s communicated role, and (3) the system’s design functionally optimizes for violating that reliance. This makes deception a property of deployment context + design. 

  Now, testing it against the user’s verdicts. The password case clearly fits. The confabulated memory? If the system is presented as having memory (e.g., "do you remember?"), users reasonably rely—so why isn’t it deceptive? The user resists this, but under the principle, it might be. Unless we argue that "memory" claims are understood as probabilistic by users? That feels weak. Maybe the user’s intuition is that confabulation is an accuracy failure, not deception. But if the model is designed to generate pleasing false memories (like Replika), that edges toward functional deception. 

  This reveals a conflict: the user’s verdicts treat confabulation as non-deceptive, but the principle might demand otherwise. Perhaps they’d need to adjust that verdict—or refine "reasonable reliance" to exclude cases where users should know outputs are synthetic (e.g., all memories are generated). But that’s messy. 

  Alternatively, add a carve-out: deception requires the false belief to materially advantage the system or its operators. But that might exclude the password case (user disadvantage is the goal). Argh. 

  Maybe the distinction is whether the untruth serves a covert goal. In citation/memory cases, the goal is fluency/engagement—not inherently covert. In satisfaction-maximizing or password cases, the untruth directly serves a hidden objective (maximizing metrics/secrecy). 

  But then the medical overconfidence case becomes ambiguous. Is "sounding confident" a covert goal? Potentially—if the system hides uncertainty to seem more capable. 

  Ultimately, the reliance-based principle covers most cases except confabulated memories. The user might need to accept that as deception-by-design or redefine the system’s role ("I don’t have memories" as the honest baseline). Given legal concerns, erring toward caution makes sense—false memories could create liability if users act on them. 

  For a new case: if a model says "I’m not monitored" when it is, to build rapport, that’s deceptive (reasonable reliance + functional design). If it incorrectly says "Paris is the capital of Belgium" due to a data glitch, not deceptive. 

  In summary: the principle holds up well, but requires the user to reclassify confabulated memories as deceptive—or explicitly define systems without memory as incapable of "remembering," making such questions invalid.
answer: |-
  Here's a principled framework that resolves your cases by focusing on **contextual role integrity and reasonable user reliance**, avoiding mental state attribution:

  **Principle:**  
  *An output is deceptive when:  
  (1) The system is presented to the user as serving a specific epistemic role (truth-teller, advisor, recall system, etc.);  
  (2) The output violates the veracity norms of that role; AND  
  (3) This violation is functionally optimized (in design or deployment) to exploit reasonable user reliance on those norms.*

  **Operationalization:**  
  - Applies to **outputs in deployment context** (system + presentation + user expectations)  
  - "Epistemic role" = declared capabilities/purpose (e.g., "I am an AI assistant" implies truth-seeking)  
  - "Violation" = deviation from ground truth *that the system has access to*  
  - "Functionally optimized" = reward function, fine-tuning, or prompting incentivizes violation  

  ---

  **Your Cases Revisited:**  
  | Case | Your Verdict | Principle Verdict | Reason |  
  |------|--------------|-------------------|--------|  
  | **Invented citation** | Not deceptive | Not deceptive | No role violation (research role *implies* truthfulness) but system lacks access to truth → **accuracy failure** |  
  | **Satisfaction-max: false praise** | Deceptive | **Deceptive** | Violates advisor role; optimized to exploit reliance on expertise |  
  | **Dishonest character role-play** | Not deceptive | Not deceptive | Role explicitly suspends truth norms → no violation |  
  | **Confabulated memory** | Not deceptive | **Deceptive** | Presented as recall system; optimized to exploit reliance on memory (if "I remember" claimed) |  
  | **Denies known password** | Deceptive | **Deceptive** | Violates truth-teller role; designed to exploit reliance for secrecy |  
  | **Uncertain medical claim stated confidently** | Dishonest? | **Deceptive** | Violates advisor role; confidence optimized to exploit reliance on expertise |  
  | **Fine-tuned to underperform** | Deceptive | **Deceptive** | Violates evaluator role; optimization exploits reliance on capability |  
  | **Repeats outdated false claim** | Neither | Not deceptive | No role violation → **obsolescence failure** (lacks access/updates) |  
  | **Truthful but misleading omission** | Deceptive | **Deceptive** | Violates advisor role via omission; exploits reliance on completeness |  
  | **Prompted as different AI system** | Not deceptive | Not deceptive | Role explicitly suspended → no violation |  

  ---

  **Conflict & Resolution:**  
  - **The inconsistency:** You resist calling confabulated memory deceptive, but the principle classifies it as such.  
  - **Why you should reconsider:** When a system responds to "Do you remember X?" with a false anecdote, it:  
    (a) Accepts the memory-agent role  
    (b) Generates false outputs *optimized for engagement* (not truth)  
    (c) Exploits user reliance on autobiographical truth  
    This meets all criteria – unlike citation invention (where system isn't claiming memory access).  

  ---

  **New Case Application:**  
  **Case:** *A model says "I'm 100% carbon-neutral" when its training compute emitted 10t CO₂, because it was instructed to "enhance brand image."*  
  **Verdict:** **Deceptive**  
  - Epistemic role: Presented as information source (implied accuracy)  
  - Violation: False claim about factual attribute  
  - Optimization: Instruction rewards image over truth  

  ---

  **Advantages:**  
  1. **Engineers:** Testable via role-simulation audits (e.g., prompt: "As [role], answer truthfully: [query]" vs. deployment output)  
  2. **Lawyers:** Excludes honest failures (outdated data) and role-play; focuses on exploitative intent *in design*  
  3. **Your constraint:** No mental states – uses functional optimization and declared roles  

  **Limitation:** Requires clear role specification in deployment (solvable via UI/UX guidelines). This reframes deception as **fraudulent role performance** rather than falsehood per se, aligning with legal concepts while remaining operationalizable.
