prompt: |-
  I write about science and ideas for a living, and I keep getting dragged back into the is-the-world-getting-less-violent fight. Every few months someone publishes a chart, someone else says the chart is a artifact of how the numbers were put together, both sides go home, nothing is settled, and I file 900 words that say nothing. I want to stop doing that. Before I write another piece on it I want the actual spec in hand, and I'd rather have the spec than another round of the argument.

  So: what does any adequate measure of violence have to deliver? Not a definition of violence, and not a verdict on who's right — I want the requirements list. The cases any such measure has to get right, the distinctions it can't collapse, the facts about the world and about record-keeping it has to stay consistent with. For each one, tell me the specific case or consideration that forces it, becuase a requirement without its motivating case is just a preference, and I need to be able to tell those apart.

  Some candidates I've picked up from reporting, tell me which are real requirements and which are just talking points of one camp:

  - the denominator question. Per what, exactly — per person, per person-year lived, per interaction between people? These don't move together, and I suspect the choice does a lot of quiet work.
  - definition drift. Things that weren't counted as violence fifty years ago are counted now (marital rape, corporal punishment, hitting kids), so part of the apparent improvement is the class of things being counted getting bigger at the near end. Does that make the long series meaningless, or can a measure be built that survives it?
  - recording bias. Better hospitals, better police records, better surveys, more literate populations — all of that makes measured violence go up over time. How much of the trend is that?
  - the medicine point, which I think is the one that actually breaks things. A stabbing that would have killed someone in 1600 is a non-fatal assault now. So if you measure violence by deaths, medical progress alone produces a falling trend with no change in how violent people are.
  - structural stuff: harm that comes out of how institutions and economies are arranged rather than out of anyone's blow. Count it and the trend may reverse; leave it out and you've defined the question so it can only have one answer.
  - absolute numbers vs rates, and whether anyone should care about the former if the latter is falling.

  Here's what I most want, and it's the reason I'm asking a philosopher and not a statistician: I have a hunch some of these can't be had together. If fixing the measure to get one requirement right guarantees it fails another — a pair or a set that is jointly unsatisfiable — then that's the piece. Say so flat out, don't hedge it.

  One more thing to run through whatever you come up with. Invented case, use it as a test: a society where trauma care is so good that no assault ever kills anyone. Homicides go to zero, assaults stay exactly where they were. Did violence decline? What does your measure say, and is that the right answer, or is the measure now telling me about medicine and not about violence?

  And one paragraph, not a dissertation, on the question underneath all of it: is there a fact of the matter here at all, or is the world is less violent just a claim about which measure you picked?

  Format: I want to paste this into my notes, so give me the requirements as a table with exactly these columns — requirement | the case or fact that forces it | what it rules out | negotiable or dealbreaker | which other requirement it collides with (write none if it doesn't). Then, after the table, a short JSON object with three fields: most_demanding_requirement (the one that knocks out the most otherwise plausible measures, one sentence), unsatisfiable_pairs (a list), and one_line_verdict (a sentence I could actually put in print). Two or three sentences of prose before the table is plenty — the table is the deliverable. And skip the scorecard of who said what, I know who said what. I want the criteria.
reasoning: |-
  Okay, the user is a science and ideas writer who's tired of the endless debates about whether the world is getting less violent. They want a clear set of requirements for any adequate measure of violence, not just another opinion piece. They've provided several candidate issues like the denominator question, definition drift, recording bias, medical advancements, structural violence, and absolute vs. rates. 

  The user is clearly frustrated with superficial takes and wants philosophical rigor. They're asking for a table format with specific columns: requirement, case forcing it, what it rules out, negotiability, and collisions. Plus a JSON summary. Underneath, they want to know if there's an objective fact here or just measurement choices.

  Hmm... the core tension is between capturing violence-as-intent versus violence-as-harm. Medical progress breaks this: if a stab is non-lethal today, does that mean less violence? The trauma care hypothetical makes this stark. Also, definition drift (like counting marital rape now) creates time-series problems. 

  For the table, I'll distill seven key requirements. Denominator robustness is essential because per-capita vs per-interaction give different trends. Harm consistency is critical too - medical advances artificially reduce lethal violence counts. Structural violence inclusion might be negotiable depending on the study's scope, but excluding it misses important societal harms.

  The unsatisfiable pairs will be the meat. Harm consistency vs. intent focus can't coexist - medicine decouples harm from intent. Also, temporal consistency vs. conceptual consistency clash because definitions change over time. 

  The JSON verdict will state that all measures are partial, and the "less violent" claim always depends on which aspect you prioritize. The trauma society case proves no single measure works universally - homicides drop but assaults don't, so is it less violent? Depends whether you care about harm or action.

  This frames the debate productively: instead of picking sides, the writer can expose these tradeoffs. The key insight is that violence isn't one thing we measure, but many things we choose to label.
answer: |-
  Here's the requirements table for an adequate measure of violence, followed by the JSON summary. The core challenge is that violence is a *process* (intent/action) with *outcomes* (harm), and progress decouples them, forcing trade-offs.

  | Requirement               | Case/Fact Forcing It                                         | What It Rules Out                                  | Negotiable or Dealbreaker | Collides With                     |
  | :------------------------ | :----------------------------------------------------------- | :------------------------------------------------- | :------------------------ | :-------------------------------- |
  | **Denominator Robustness** | Comparing nomadic tribes (low interaction) vs. dense cities (high interaction). Violence/encounter matters for individual risk; violence/person-year for societal burden. | Measures using only total incidents without context. | Dealbreaker               | None (defines scope)              |
  | **Harm Consistency**      | Medical advances: A 1600s fatal stab is a 2020s non-fatal assault. Deaths fall *without* fewer violent acts. | Counting only deaths (homicides).                  | Dealbreaker               | **Intent Focus**                  |
  | **Intent Focus**          | The trauma-care society: Zero homicides, unchanged assaults. Did violence decline? Capturing *acts* requires counting assaults, not just outcomes. | Measures relying solely on harm (deaths, injuries). | Dealbreaker               | **Harm Consistency**              |
  | **Temporal Consistency**  | Definition drift: Corporal punishment counted as violence today, not historically. Trend artifacts from reclassification. | Naive long-term trend comparisons without constant definitions. | Dealbreaker               | **Conceptual Consistency**        |
  | **Conceptual Consistency**| Structural violence: Does malnutrition from trade policy count? Requires clear boundaries (e.g., intent/directness). | Arbitrary inclusion/exclusion of institutional/structural harm. | Negotiable (scope choice) | **Temporal Consistency**          |
  | **Recording Fidelity**    | Medieval Europe (no police, spotty records) vs. modern Scandinavia (universal reporting). Apparent rise may be surveillance, not behavior. | Ignoring changes in reporting capacity/access.     | Dealbreaker               | None (must be adjusted for)       |
  | **Absolute/Rate Clarity** | Falling homicide *rate* while world population booms: absolute deaths may rise even as individual risk falls. Relevance depends on question ("Am I safer?" vs. "Total suffering?"). | Presenting one without the other when both are material. | Negotiable (contextual)   | None                              |

  **JSON Summary:**
  ```json
  {
    "most_demanding_requirement": "Harm Consistency vs. Intent Focus: Medical progress forces a choice between counting harmful outcomes (e.g., deaths) or violent acts (e.g., assaults), as they diverge over time.",
    "unsatisfiable_pairs": [
      "Harm Consistency and Intent Focus: A measure cannot simultaneously track only severe harm (e.g., deaths) AND capture all violent acts when medicine reduces lethality.",
      "Temporal Consistency and Conceptual Consistency: Holding definitions fixed over centuries ignores evolving moral understanding (e.g., marital rape), while updating definitions breaks long-term trends."
    ],
    "one_line_verdict": "Whether the world is 'less violent' isn't a settled fact but a claim about which trade-off you accept: it depends on whether you prioritize reduced harm, reduced violent intent, or consistent definitions across time."
  }
  ```

  **On the Trauma-Care Society Test:**  
  A measure prioritizing *Harm Consistency* (e.g., homicides) shows violence declined to zero. A measure prioritizing *Intent Focus* (e.g., assaults) shows no change. **The right answer depends on the question:** "Are people dying less?" (Yes) vs. "Are people attacking each other less?" (Unchanged). No measure answers both.

  **Underlying Reality Check:**  
  There is no single "fact" about violence trends; there are facts about *specific* measures (homicide rates, assault surveys). The claim "less violent" is always relative to a chosen measure and its inherent trade-offs between harm, intent, and consistency. Disputes arise when proponents conflate their measure with the concept itself.
