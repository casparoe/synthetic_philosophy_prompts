prompt: |-
  I manage a small forecasting team at a nonprofit that advises state health agencies, and we keep hitting a recurring problem: two analysts will present different probabilities for the same event, each has read the other's memo, each knows the other has read it, and yet neither moves. My graduate training left me with Aumann's agreement theorem and the uneasy sense that it says this should be impossible under certain conditions, but the conditions are exactly what we never have: a shared prior, common knowledge of rationality, and posteriors that are common knowledge rather than merely public. I need a decision procedure my team can run, in under an hour, when two analysts disagree by more than a stated threshold, say ten percentage points on a binary event, to decide whether to keep reconciling, escalate to me, or formally record the disagreement and move on. The procedure should distinguish among the several ways the theorem's assumptions can fail, because the right response differs depending on whether the failure is a different prior, private information that one analyst cannot disclose, a disagreement about the model class, or a failure of common knowledge rather than mutual knowledge. It should treat common knowledge as a graded thing, what the team knows, what each knows the other knows, and so on, and it should say at what level it is worth spending meeting time to climb, since infinite common knowledge is not available in a Tuesday staff meeting. It should also be honest about cases where the theorem is irrelevant because the disagreement is normative, because the analysts are not Bayesian agents in the relevant sense, or because they are disagreeing about what counts as the event rather than about its probability. Please write the procedure as an internal operating procedure with numbered steps, a short set of test questions, a clear statement of who signs off on escalation, and a final section on what the procedure cannot settle.

  Then run the procedure on three cases: first, two analysts disagree about the probability that a new variant will cause a hospital surge, one using a mechanistic model and one using a historical base rate; second, two analysts agree on the model but one has seen a preliminary unpublished dataset that cannot be shared outside the team; third, a case where the procedure tells me to stop reconciling even though I strongly want consensus, and explain why that is the right answer. The output should be in American English, and it should avoid bibliographies, reading lists, or citations; I need something my team can actually use, not a scholarly essay.
reasoning: |-
  We are designing a decision procedure for reconciling probability disagreements in a forecasting team. The procedure should help determine whether to keep reconciling, escalate, or record disagreement and move on. It should account for failures of Aumann's theorem assumptions: different priors, private information, model class disagreements, and failures of common knowledge (graded). It should also identify cases where the theorem is irrelevant (normative disagreements, non-Bayesian agents, event definition disagreements).

  The procedure will be structured as an internal operating procedure with:
  - Numbered steps
  - A short set of test questions
  - Clear statement of who signs off on escalation
  - A final section on what the procedure cannot settle

  Then we'll run the procedure on three cases.

  ---

  **Internal Operating Procedure: Reconciling Probability Disagreements**

  **Purpose:** To guide the team in efficiently resolving binary event probability disagreements exceeding a threshold (e.g., 10 percentage points) by diagnosing the cause of disagreement and determining the appropriate next step (continue reconciling, escalate to manager, or record disagreement and move on).

  **Scope:** Applies when two analysts have read each other's memos and know the other has read them, but neither moves their probability estimate.

  **Threshold:** Disagreements of more than 10 percentage points on a binary event probability.

  **Steps:**

  1. **Initial Check: Normative or Definitional Disagreement?**
     - Ask each analyst: "Is the disagreement about what *should* be the case (normative) or about the definition of the event (e.g., what counts as a 'hospital surge')?"
     - If yes to either, record the disagreement as normative/definitional and move on. (The theorem is irrelevant.)

  2. **Check for Private Information:**
     - Ask: "Is there any information that one of you has that the other does not, and that cannot be shared (e.g., due to confidentiality) or has not been shared?"
     - If yes, then:
       - Determine if the information can be shared within the team (with the manager present if necessary). If it can be shared, do so and recalculate probabilities.
       - If it cannot be shared (e.g., unpublished data, confidential source), then:
         - The team must decide if the private information is credible and material. The manager (you) will make the final call on whether to:
           - Trust the analyst with the private information and adjust the team's forecast accordingly (escalate to manager for decision).
           - Or, if the information cannot be verified, record both probabilities with a note about the private information and move on.

  3. **Check for Model Class Disagreement:**
     - Ask: "Are you using different models or methodologies to arrive at your probabilities (e.g., mechanistic model vs. historical base rate)?"
     - If yes, then:
       - Have each analyst explain their model's assumptions and why they chose it.
       - Determine if the models can be combined (e.g., via model averaging) or if one model is more appropriate for the current context.
       - If the model disagreement persists and both models are deemed valid, record both probabilities with their respective justifications and move on. (This is a legitimate source of disagreement.)

  4. **Check for Prior Belief Disagreement:**
     - Ask: "If you were to ignore all the data and information we've gathered, would you still assign different prior probabilities to this event?" (This isolates the prior.)
     - If yes, then:
       - Have the analysts discuss the reasons for their priors. Are they based on general knowledge, past experiences, or other factors?
       - Attempt to form a shared prior by discussing the underlying reasons and seeing if they can converge.
       - If they cannot converge on a prior, then:
         - If the prior disagreement is the main driver, note this and consider whether the team can agree to use an uninformative prior or a standard team prior for such events in the future. For now, record the disagreement and move on.

  5. **Check for Common Knowledge (Graded):**
     - This step is only reached if steps 1-4 do not resolve the disagreement and there's no private information or model/prior differences. Now we suspect a failure of common knowledge.
     - We assess the level of mutual understanding:
       - Level 0: Each analyst knows their own probability and the other's.
       - Level 1: Each analyst knows that the other knows both probabilities.
       - Level 2: Each analyst knows that the other knows that they know both probabilities.
       - (We stop at Level 2 in practice due to time constraints.)
     - Procedure:
       - The manager leads a discussion to explicitly state:
         - "Analyst A, what is your probability? Analyst B, what is your probability?"
         - "Analyst A, do you know Analyst B's probability? Analyst B, do you know Analyst A's probability?" (Level 1)
         - "Analyst A, do you know that Analyst B knows your probability? Analyst B, do you know that Analyst A knows your probability?" (Level 2)
       - If at any level, an analyst realizes they were mistaken about what the other knows, they update and recalculate.
       - If they agree on Level 2 and still disagree, then:
         - The manager decides whether to spend more time climbing levels (rarely beyond Level 2) or to record the disagreement and move on.

  6. **Non-Bayesian Agents or Other Irrelevancies:**
     - If the manager observes that the analysts are not updating rationally (e.g., due to cognitive biases, stubbornness) or if the disagreement is not about the probability but about something else (e.g., resource allocation, which is normative), then the theorem is irrelevant. The manager should note this and either:
       - Escalate to a training session on probabilistic reasoning (if recurring issue).
       - Record the disagreement and move on.

  **Test Questions (for quick diagnosis during meeting):**
  1. Is the disagreement about what should happen or how we define the event? (Step 1)
  2. Is there any information one has that the other doesn't? (Step 2)
  3. Are you using different models? (Step 3)
  4. Would you have started with different probabilities before seeing any data? (Step 4)
  5. Do you both know each other's current probabilities? (Step 5, Level 1)
  6. Do you both know that the other knows your probability? (Step 5, Level 2)

  **Escalation Sign-Off:**
  - The manager (you) must sign off on any escalation. Escalation occurs when:
    - Private information is involved and a decision is needed on whether to trust it (Step 2).
    - The team cannot resolve a model or prior disagreement and the manager must choose a path (Steps 3 or 4).
    - After Step 5, the manager decides to stop the reconciliation process.

  **What the Procedure Cannot Settle:**
  - Normative disagreements (what ought to be).
  - Disagreements rooted in unverifiable private information (if the manager cannot assess credibility).
  - Fundamental model disagreements when both models are valid and context does not favor one.
  - Cases where analysts are not updating rationally (cognitive biases) and the manager cannot resolve it in the meeting.
  - Disagreements about event definitions that cannot be resolved by redefinition.

  ---

  **Running the Procedure on Three Cases:**

  **Case 1: Disagreement about a new variant causing a hospital surge (mechanistic model vs. historical base rate)**

  - Step 1: No normative or definitional issue. Both agree on what a hospital surge is.
  - Step 2: No private information that cannot be shared. All data is public.
  - Step 3: Model class disagreement? Yes. One uses a mechanistic model, the other a historical base rate.
    - Action: Discuss model assumptions. Mechanistic model might incorporate variant characteristics, while base rate uses past similar variants. Both are valid but different.
    - They cannot agree to use one model. The manager records both probabilities (e.g., 35% from mechanistic, 60% from base rate) with justifications and moves on.

  **Case 2: Same model, but one has seen an unpublished dataset**

  - Step 1: Not normative or definitional.
  - Step 2: Private information? Yes. Analyst A has seen a preliminary unpublished dataset that cannot be shared outside the team. Analyst B has not.
    - Action: Since the information can be shared within the team (but not outside), Analyst A shares the dataset with the team. Both analysts recalculate.
    - Suppose after sharing, Analyst B updates from 30% to 40%, but Analyst A is at 70%. Now the disagreement is 30 points, still above threshold.
    - Step 3: Same model? Yes. They are using the same model now.
    - Step 4: Prior disagreement? Check. If they had the same prior, then the remaining disagreement might be about how to interpret the new data. They discuss and realize they have different likelihoods for the new data. They try to reconcile but cannot. Since the private information was shared, the manager must decide:
      - If the dataset is credible, ask both to recalculate with the same likelihood assumptions. If they still disagree, it might be a prior issue (step 4) or model (but same model) so we move to step 5.
    - Step 5: Common knowledge check. They both know each other's probabilities and that the other knows. They update to Level 2 and still disagree. The manager decides to record the disagreement (e.g., 40% vs 70%) and move on.

  **Case 3: Stop reconciling even though manager wants consensus**

  - Scenario: Two analysts disagree about the probability of a policy change (e.g., 20% vs 80%). They have the same model and prior, no private information, and have passed Step 5 (common knowledge up to Level 2). They still disagree. The manager wants consensus but the procedure says to record and move on.
  - Why it's the right answer: According to Aumann, with a shared prior and common knowledge of posteriors, they must agree. But we've checked: shared prior (Step 4), same model (Step 3), no private info (Step 2), and common knowledge up to Level 2 (Step 5). The disagreement must be due to irrational updating (e.g., one is ignoring evidence due to cognitive bias) or an unstated assumption. The procedure cannot fix this in an hour. The manager should record the disagreement and address the irrationality in training. Forcing consensus would be arbitrary and mask the true issue.

  ---

  This procedure provides a structured way to diagnose and handle disagreements efficiently.
answer: |-
  ### Internal Operating Procedure: Reconciling Probability Disagreements  
  **Effective Date:** [Date]  
  **Purpose:** To resolve binary event probability disagreements >10 percentage points efficiently by diagnosing why analysts haven’t converged, and to decide whether to reconcile further, escalate, or record disagreement.  
  **Scope:** Applies when two analysts have exchanged memos, are aware of each other’s probabilities, and neither updates their estimate after discussion.  
  **Owner:** Forecasting Team Manager (You).  

  ---

  #### Step-by-Step Procedure  
  **Time Limit:** 40 minutes per disagreement. Use a facilitator (rotating team member) to enforce time.  

  1. **Confirm Disagreement Type (5 minutes)**  
     - Ask: *"Is this disagreement about what* should *happen (normative/policy), or does it hinge on defining the event (e.g., ‘hospital surge’ thresholds)?"*  
     - **If YES:**  
       - Outcome: **Record and move on.**  
       - Reason: Aumann’s theorem doesn’t apply. Escalation won’t resolve normative/definitional splits.  
     - **If NO:** Proceed to Step 2.  

  2. **Check for Private Information (10 minutes)**  
     - Ask Analysts: *"Does either of you have information the other hasn’t seen, can’t share externally, or hasn’t fully disclosed?"*  
     - **If YES and sharable internally:**  
       - Outcome: **Reconcile now.** Share information, recalculate probabilities together.  
     - **If YES but CANNOT be shared (e.g., embargoed data):**  
       - Outcome: **Escalate to Manager.**  
       - Manager determines if private info is credible. If credible, assign adjusted probability; if not, record both estimates.  
     - **If NO:** Proceed to Step 3.  

  3. **Assess Model & Prior Alignment (10 minutes)**  
     - Ask:  
       - *"Are you using different models (e.g., mechanistic vs. empirical)?"*  
       - *"Would your probabilities differ if you saw no data (i.e., different priors)?"*  
     - **Model Disagreement (e.g., one uses AI, one uses regression):**  
       - Outcome: **Record and move on.**  
       - Reason: Legitimate structural disagreement; reconciling requires model-averaging (time-intensive).  
     - **Prior Disagreement (e.g., one thinks variant risks are inherently higher):**  
       - Outcome: **Reconcile if <15 min left.** Debate priors using team’s historical data. If unresolved, record both.  
     - **Same Models & Priors:** Proceed to Step 4.  

  4. **Test Common Knowledge Depth (10 minutes)**  
     - Use graded knowledge check (stop at Level 2; infinite regress is impractical):  
       - **Level 0:** Each states their probability.  
       - **Level 1:** Each confirms: *"I know your probability."*  
       - **Level 2:** Each confirms: *"I know you know my probability."*  
     - **If mismatch at Level 1–2:**  
       - Outcome: **Reconcile now.** Miscommunication is likely; restate assumptions.  
     - **If full agreement through Level 2 and probabilities still diverge >10 points:**  
       - Outcome: **Escalate to Manager.**  
       - Likely cause: Hidden irrationality (e.g., motivated reasoning) or unstated constraints.  

  5. **Final Decision (5 minutes)**  
     - **Reconcile:** If new alignment emerges.  
     - **Escalate:** Per Steps 2 or 4.  
     - **Record & Move On:** If unresolved after all steps. Document probabilities, reasons, and failed step (e.g., "Model disagreement, Step 3").  

  ---

  #### Escalation Sign-Off  
  - **Who Decides:** Team Manager (You).  
  - **Criteria for Approval:**  
    - Escalation REQUIRED for unresolved private info (Step 2) or common knowledge failures (Step 4).  
    - Escalation DENIED if disagreement is normative (Step 1) or model-based (Step 3).  
  - **Output:** Manager issues a binding probability or approves recording both.  

  ---

  #### What This Procedure Cannot Settle  
  1. **Normative disagreements** (e.g., "This policy *should* reduce cases").  
  2. **Non-Bayesian behavior** (e.g., analysts ignoring evidence due to bias).  
  3. **Event definition disputes** (e.g., "What constitutes a ‘surge’?").  
  4. **External constraints** (e.g., mandates to use a specific model).  
  **Response:** Record disagreements and annotate limitations.  

  ---

  ### Test Questions for Quick Diagnosis  
  Ask during meetings to skip steps:  
  1. *"Is this a values debate, or are we defining terms differently?"* → If yes, record.  
  2. *"Is there hidden data?"* → If yes, escalate.  
  3. *"Are your models/starting points different?"* → If yes, record.  
  4. *"Do you both know what the other knows?"* → If no, reconcile.  

  ---

  ### Procedure in Practice: Three Cases  
  **Case 1: Model Disagreement (Mechanistic Model vs. Historical Base Rate)**  
  - **Issue:** Analyst A (mechanistic model): 70% probability of hospital surge from new variant. Analyst B (historical base rate): 35%.  
  - **Step 1:** No normative/definitional issues.  
  - **Step 2:** No private information.  
  - **Step 3:** Model disagreement confirmed.  
  - **Outcome:** **Record both and move on.**  
  - **Why:** Different models are valid inputs; forcing consensus wastes time.  

  **Case 2: Private Information (Unpublished Dataset)**  
  - **Issue:** Analysts use same model. Analyst A has unpublished data suggesting higher risk (updates to 65%). Analyst B (no data) stays at 40%. Data cannot leave the team.  
  - **Step 1:** Not normative.  
  - **Step 2:** Private information found.  
  - **Outcome:** **Escalate to Manager.**  
  - **Manager Action:** Verify data credibility. If valid, set probability at 55% (split difference); if weak, record both.  

  **Case 3: Stop Reconciling Despite Manager’s Desire for Consensus**  
  - **Issue:** Analysts agree on models, priors, and data. After Level 2 common knowledge check, they still disagree (Analyst A: 20%, Analyst B: 85%).  
  - **Procedure Path:** Cleared Steps 1–3. Step 4 (common knowledge) shows full alignment.  
  - **Outcome:** **Escalate, but Manager records both.**  
  - **Why It’s Right:** Aumann’s theorem says they *must* agree if all assumptions hold. Disagreement implies non-rational updating (e.g., emotion, hidden incentives). Forcing consensus would be arbitrary and mask systemic issues (e.g., training gaps). Manager addresses biases offline.  

  ---  
  **Approved By:** [Your Name/Title]  
  **Revision Date:** [Date]  
  *Print and distribute to team. Use in all disagreement resolution meetings.*
