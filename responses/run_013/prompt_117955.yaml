  2. **Group tries to settle by majority vote**:
        - Point out that the three methods are not approximations of one true probability; they are different probabilities arising from different interpretations of randomness. Majority vote doesn't resolve the foundational issue.

  3. **Groups not getting the expected probabilities**:
        - Due to small sample size, the results might not be exactly 1/3, 1/2, 1/4. That's okay. The point is that they are different and in the expected direction. You can say: "With more samples, they would converge to the theoretical values we are about to show."

  4. **Betting confusion**:
        - Explain the betting scheme slowly and use a numerical example.

  ### What the Activity Cannot Reproduce

  - The activity will show the three different probabilities and the arbitrage, but it might not fully convey the depth of the foundational problem. The participants might still feel that one method is more natural. You will have to explain that the symmetry required must come from the physical process. The activity cannot, by itself, establish the connection to Liouville's theorem or the Buffon needle without your explanation. The debrief is crucial for that.

  ### Final Structure

  - **0-10 min**: Introduction and group division.
  - **10-40 min**: Group work (generate chords and compute p).
  - **40-50 min**: Report results and initial surprise.
  - **50-60 min**: Betting arbitrage.
  - **60-75 min**: Debrief: Bertrand's paradox, symmetry, and physical measures.
  - **75-85 min**: Cosmology connection.
  - **85-90 min**: Conclusion.

  This should fit the 90 minutes.

  ### Materials to Prepare

  - For each group:
    - Instruction card (specific to the group).
    - Circle (unit circle, R=1) on paper or as a physical circle.
    - Random number generator (could be a dice app on a phone, or a computer with a spreadsheet, or even physical dice and a conversion chart).
    - Ruler, compass, protractor.
    - Data sheet (with columns for recording the parameters and the outcome).

  - For the facilitator: 
    - Whiteboard markers.
    - A summary chart to write the groups' probabilities.
    - Betting record (to note the p's and conduct the arbitrage).

  ### Instruction Cards

  **Group A**:
  ```
  Method: Random endpoints
  1. Generate two random angles between 0 and 360 degrees (uniformly).
  2. Mark the two points on the circle at these angles.
  3. Draw the chord between them.
  4. Determine the central angle (the smaller angle between the two radii). 
     - Central angle θ = min(|angle1 - angle2|, 360 - |angle1 - angle2|).
  5. The chord is longer than the side of the inscribed equilateral triangle if θ > 120 degrees.
  6. Record: chord number, angle1, angle2, central angle, and whether θ>120 (Y/N).
  Generate 20 chords and count the number of Y's. Then compute p = (# Y)/20.
  ```

  **Group B**:
  ```
  Method: Random radius and random point on radius
  1. Generate a random angle for the radius (0 to 360 degrees, uniformly).
  2. Generate a random distance d from the center (uniformly between 0 and R, where R is the radius of the circle). [For R=1, between 0 and 1.]
  3. Draw the radius and then a chord perpendicular to the radius at distance d from the center.
  4. The chord is longer than the side of the triangle if d < R/2. (Because the chord length is 2*sqrt(R^2-d^2), and it must be > √3 R -> d < R/2.)
  5. Record: chord number, radius angle, d, and whether d < R/2 (Y/N).
  Generate 20 chords and count the number of Y's. Then compute p = (# Y)/20.
  ```

  **Group C**:
  ```
  Method: Random midpoint
  1. Generate a random point inside the circle (uniformly by area). To do this: 
     - Generate a random angle (0 to 360) and a random radius r (0 to R) but note: to be uniform in area, you must set r = R * sqrt(u) where u is uniform between 0 and 1. [Because the area element is 2πr dr, so the cumulative distribution is (r/R)^2. So set r = R * sqrt(u) for u uniform in [0,1].]
     - Alternatively, you can generate a point in a square and reject if outside the circle (but that might take longer). 
  2. Take the generated point as the midpoint of the chord. Then draw the chord perpendicular to the line from the center to the point.
  3. The chord is longer than the side of the triangle if the distance from the center to the midpoint (which is r) is less than R/2.
  4. Record: chord number, the distance r, and whether r < R/2 (Y/N).
  Generate 20 chords and count the number of Y's. Then compute p = (# Y)/20.
  ```

  Note: For Group C, they must generate points uniformly in the disc. We provide two methods. The first: 
     u = uniform(0,1), then r = R * sqrt(u), and θ = uniform(0,360). 
  The second: generate (x,y) in [-R,R]x[-R,R] until x^2+y^2 <= R^2, then use that point.

  ### Betting Setup

  Each group has 100 points. They set a price p (their probability). The bookmaker (facilitator) then:
     - Buys one ticket from the group with the smallest p at price p_low.
     - Sells one ticket to the group with the largest p at price p_high.

  Effect on groups:
     - The low-p group: receives p_low points. They owe 1 point if the event E happens.
     - The high-p group: pays p_high points. They receive 1 point if E happens.

  But note: we do not actually run the experiment for the bet. We only need to show that the bookmaker makes a risk-free profit of p_high - p_low.

  Announce: "The bookmaker has made a profit of [p_high - p_low] points without any risk. This is possible because the groups set different prices for the same event."

  ### Conclusion

  This activity should create the discomfort of the paradox and lead to the insight that a physical mechanism is necessary to define randomness. The debriefing should connect to the Buffon needle and statistical mechanics, and then briefly to cosmology.
