        - They record: chord number, the (x,y) of the point (or just the distance from center), and whether that distance < R/2.

    Note: We must ensure that the groups are generating the chords uniformly according to their respective measures. For Group A: uniform on the circle for each point. For Group B: uniform angle and uniform along the radius. For Group C: uniform in the disc (by area).

    We can use a unit circle (R=1) to simplify.

  - **Data Collection**:
    - Each group generates 20-30 chords (depending on time). They record the number of chords that are longer and compute the proportion (which is an estimate of the probability).

  ### Timeline (90 minutes)

  - **0-10 min**: Introduction by the facilitator (you). Explain the problem without giving away the paradox. 
        - "We are going to explore a simple geometric probability problem. We have a circle, and we will draw a chord at random. We want to know the probability that this chord is longer than the side of an equilateral triangle inscribed in the circle. Each of you will be in a group that has a method for generating a random chord. Your group will generate a number of chords, record how many are longer, and then we will compare the results. Then we will have a discussion."

