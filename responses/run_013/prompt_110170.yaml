  ## The Rondel Variations

  The fluorescent hum of the linguistics building was a familiar drone, a white noise Martin usually found comforting. Tonight, it felt accusatory. Spread before him on the scarred seminar table were four sheets of paper, each bearing his handwriting, each proclaiming itself the definitive English shape of Étienne Leclerc’s infuriating little poem, *L’Attente du Mot Perdu*.

  He hadn’t planned on four versions. One clean, brilliant solution was the fantasy. But Leclerc’s poem, sent by his friend Claude as a “palate cleanser” after months wrestling with dense prose, had become an obsession. Thirteen lines. A rondel variation. The rules were deceptively simple, devilishly hard in execution:

  1.  **Thirteen syllables per line.** No wiggle room. French counted them readily; English choked on them.
  2.  **Refrain:** The first line must repeat exactly as lines 7 and 13. *J'attends la parole qui s'envole.*
  3.  **Rhyme:** ABBA / ABAB / ABBA (the capital 'A' always being the refrain).

  The poem itself felt like a sigh caught in a crystal cage. It spoke of waiting for a word that escapes, a meaning just out of reach, the silence deepening as the sought-after utterance vanishes like smoke. The *parole* wasn't just a word; it was *the* word, the one that would unlock understanding, bridge a gap, heal a wound unnamed. Its constant fleeing *("qui s'envole")* was the poem’s aching heart, mirrored perfectly by the relentless return of the refrain, a reminder of the wait and the loss. Martin had pinned the original to the corkboard above his desk:

  > *J'attends la parole qui s'envole.* (A)
  > *Dans le jardin où le silence s'installe,* (B)
  > *Sous les tilleuls que le crépuscule étale,* (B)
  > *Je cherche un sens qui toujours se dérobe.* (A)
  >
  > *L'ombre s'allonge, une pensée vacille,* (A)
  > *Un souvenir, un nom, presque un symbole...* (B)
  > *J'attends la parole qui s'envole.* (A) *(Refrain)*
  >
  > *L'heure s'enfuit et le vide s'isole,* (B)
  > *Là où vibrait un écho, rien ne sonne.* (A)
  > *Le cœur se serre, une promesse s'envole* (B)
  > *Avec le vent qui dans les branches frissonne.* (A)
  >
  > *J'attends la parole qui s'envole.* (A) *(Refrain)*

  Now, the English attempts glared back at him, each a monument to a different kind of failure.

  **Version Alpha: The Syllable Slave**

  > I wait for the word that flies away. (A)
  > Within the garden where silence settles down, (B)
  > Beneath the lindens twilight lays along the ground, (B)
  > I seek a meaning always slipping, astray. (A)
  >
  > The shadow stretches, a thought wavers, unbound, (A)
  > A memory, a name, almost a token... (B)
  > I wait for the word that flies away. (A) *(Refrain)*
  >
  > The hour flees and emptiness stands alone, (B)
  > Where an echo vibrated, nothing sounds. (A)
  > The heart contracts, a promise on the wind is flown, (B)
  > With the breeze that in the branches makes shivering sounds. (A)
  >
  > I wait for the word that flies away. (A) *(Refrain)*

  Martin winced. He’d hit every syllable count. Religiously. The result? A clattering tin can of a poem. "Lays along the ground"? "Makes shivering sounds"? It was accurate, perhaps, in a robotic way, but the melancholy grace, the subtle music of Leclerc, was utterly absent. It was tonally deaf, a technical exercise devoid of soul. The vise held, but it crushed the life out.

  **Version Beta: The Refrain Fundamentalist**

  > I await the word that flies away. (A)
  > In the garden where quiet takes its throne, (B)
  > Under limes that dusk has grandly shown, (B)
  > I chase a sense that dodges and won't stay. (A)
  >
  > Lengthening shade, a flickering thought's display, (A)
  > Memory, name, a symbol nearly known... (B)
  > I await the word that flies away. (A) *(Refrain)*
  >
  > Time escapes, isolation claims its zone, (B)
  > Where resonance lived, now silence has its say. (A)
  > Heart clenches tight, as pledge on breezes flown (B)
  > With the wind that through the trembling branches plays. (A)
  >
  > I await the word that flies away. (A) *(Refrain)*

  He’d clung to the refrain like a life raft: "I await the word that flies away." Direct, literal, preserving the central image. But to make the rest work *around* this rigid anchor, he’d bent the meaning. "Quiet takes its throne" implied a regal permanence Leclerc’s "s'installe" (settles, installs itself) didn't possess. "Dodges and won’t stay" was cruder than "se dérobe" (withdraws, eludes). Most damningly, "Heart clenches tight, as pledge on breezes flown" turned the loss of the *promise* ("promesse") *with* the wind into the promise itself *being* flown away. The refrain stood firm, but the poem's delicate argument about anticipation and elusive meaning had subtly inverted towards resignation. Fidelity in one spot bred betrayal elsewhere.

  **Version Gamma: The Beautiful Betrayal**

  > I wait for the word that takes its flight. (A)
  > Within the garden where the hush descends, profound, (B)
  > Beneath the linden boughs dusk paints upon the ground, (B)
  > I seek the meaning that dissolves in fading light. (A)
  >
  > The shadows lengthen, and a trembling thought I chase, (A)
  > A memory, a name, a symbol lost, unbound... (B)
  > I wait for the word that takes its flight. (A) *(Refrain)*
  >
  > The hour flees, and silence is the only sound, (B)
  > Where echoes lingered, now just empty space. (A)
  > My heart contracts; what promise fled without a trace? (B)
  > Gone with the wind that whispers through this lonely place. (A)
  >
  > I wait for the word that takes its flight. (A) *(Refrain)*

  This one *sang*. "Hush descends, profound," "dusk paints upon the ground," "dissolves in fading light," "trembling thought I chase," "whispers through this lonely place" – it had atmosphere, a genuine lyrical ache. But Martin knew, with a scholar’s cold certainty, it had stopped being Leclerc. "Takes its flight" softened the abrupt escape of "s'envole." "Dissolves in fading light" introduced an image not present. "Symbol lost, unbound" added layers of finality absent in "presque un symbole" (almost a symbol). "What promise fled without a trace?" was pure invention, replacing the wind carrying the promise away. It was a *good* poem, perhaps even a better *English* poem than Leclerc’s was French, but it was a cousin, not a translation. The beauty was built on quiet erasure.

  **Version Delta: The Modernist Sacrifice (Scrawled in the margin, half-formed)**

  > Waiting for the word that won't stay. (A - but only 7 syllables!)
  > Garden choked by quiet's heavy hand. (B - 8 syllables)
  > Lime trees draped in dusk across the land. (B - 8 syllables)
  > Chasing meaning that just slips away. (A - 8 syllables)
  >
  > *... (He'd given up on the structure, frustrated)*
  > Where's the echo? Just this hollow air. Silence screams. (Scratched out)
  > Heart tightens. Promise? Gone. Like wind in the trees. (Scratched out)
  >
  > *J'attends...* (He'd written the original French refrain, then stopped)*

  This wasn’t even a full version, just the wreckage of trying to break free. Sacrificing the syllable count and rhyme felt like surrender, losing the form entirely. Yet the raw phrases – "choked by quiet's heavy hand," "Silence screams" – had a power the meticulous versions lacked, capturing the *feeling* of frustration he now felt acutely. But was it translation? Or just response?

  Martin leaned back, the vinyl chair creaking loudly in the empty room. Four paths, four failures. Alpha: form preserved, music dead. Beta: refrain intact, meaning warped. Gamma: beauty achieved, original obscured. Delta: emotion raw, structure abandoned. He stared at the original French. *J'attends la parole qui s'envole.* The very word he was trying to capture, *parole*, felt untranslatable in this context – not just "word," but "speech," "utterance," a specific, significant vocalization. And *s'envole* – flies away, escapes, vanishes into air. Each English choice narrowed it, pinned it down in a way the French elegantly avoided.

  He imagined placing these four sheets side-by-side for his students tomorrow. No explanation needed. The evidence was the argument. Fidelity wasn't a monolith; it was a spectrum of necessary betrayals. You could measure syllables, replicate refrains, evoke moods, or grasp meanings, but you could never carry the crystal cage intact across the linguistic border. The original poem was about the *attente*, the waiting. Translation, Martin thought, pushing his cold coffee aside, was the *act* of that waiting, forever chasing the word that flies away.

  ---

  **Confession (As Requested):**

  This story cheats by stacking the deck against perfection. The invented poem, *L’Attente du Mot Perdu*, is rigged: the 13-syllable line is deliberately awkward in English (forcing compression or padding), the refrain phrase hinges on the subtly untranslatable *"parole qui s'envole"* (word/speech that flies/escapes), and the theme *about* elusive meaning meta-commentaries on the task itself. I'd defend **Version Beta ("The Refrain Fundamentalist")** as the least damaging compromise for a seminar focused *on form* – it prioritizes the most visible structural element (the exact refrain) and maintains the core *narrative* of waiting/loss, even if nuances shift. Does the premise hold? Barely. The versions *are* rivals wrestling with the *same* original, proving the impossibility of perfect equivalence. But the task *is* rigged: real translators rarely face such a concentration of formal constraints *and* semantic fragility. It’s a pedagogical pressure cooker designed to explode the myth of a single "correct" version, forcing the question: *what kind of fidelity matters most, and to whom?*
