prompt: |-
  I'm a third-year philosophy student currently taking a seminar on scientific realism and theory choice, and I've been asked to write a short position paper for next week's session. The seminar has spent several meetings on the underdetermination of theory by evidence, and every discussion collapses into the same well-worn examples and the same handful of stock replies, so our instructor has set us a puzzle of her own construction to try to break the rut. The puzzle runs as follows. Imagine two theories of some physical domain that are empirically equivalent in the strongest possible sense: for every observation you could make, at any time, in any part of the domain, the two theories issue the same prediction, and this equivalence is provable rather than merely conjectured. The first theory describes the domain as a finite collection of discrete, localized entities governed by a dynamical rule that resists any compact formulation — it takes thousands of independent parameters even to state. The second describes the very same domain as a single continuous field with infinitely many degrees of freedom, governed by a rule short enough to fit on an index card. The twist is that the two theories are related by a duality: a transformation that maps every model of the first onto a model of the second while preserving all observable consequences, and which, when applied, turns the bloated rule into the compact one and the compact one into the bloated one, and simultaneously swaps the apparent counting of entities so that neither theory comes out ahead on parsimony of ontology. The usual tie-breakers — simplicity, fewness of entities, predictive success — are thus neutralized by construction, and there is no prospect of a future experiment separating the two.

  My paper has to defend a definite position, and I've settled on arguing that this puzzle does not show that theory choice is underdetermined by evidence: the appearance of underdetermination is an artifact of specifying the content of the two theories in a way that omits something the choice between them actually turns on, and once that omitted element is made explicit, the evidence together with the aim of inquiry determines a unique rational choice. I'd like you to write that argument, addressed to a reader who already knows the standard literature and will be irritated by hand-waving. Please make the omitted element precise rather than gesturing at vague pragmatic virtues, say exactly what work it does in this two-theory case, and confront the strongest objection head-on — namely, that whatever you add is either not part of the evidence, in which case you have simply conceded underdetermination, or is a disguised empirical assumption, in which case you have begged the question. Explain how you would answer that dilemma without just denying one of its horns.

  After the argument, give me a compact JSON object with exactly these fields: position (one sentence), omitted_element (the factor you claim the choice turns on), why_evidence_plus_aim_is_determinate (two or three sentences), strongest_objection (one sentence), reply (two or three sentences), and residual_cost (one sentence naming what your position gives up).
reasoning: |-
  We are given a scenario with two theories that are empirically equivalent in the strongest sense and related by a duality that swaps their apparent virtues (simplicity of formulation vs. simplicity of ontology). The challenge is to argue that theory choice is not underdetermined by evidence because there is an omitted element that, when made explicit, allows the evidence plus the aim of inquiry to determine a unique rational choice.

  Key points from the setup:
  - The two theories are dual: they map onto each other preserving all observable consequences.
  - The duality transformation swaps the two theories: it maps the first theory (with discrete entities and a bloated rule) to the second (continuous field with compact rule) and vice versa, and also swaps the ontology (so that one has many simple entities and the other one complex entity, but the swap means that neither is ontologically simpler in an absolute sense).
  - The usual tie-breakers (simplicity of formulation, parsimony of ontology) are neutralized.

  The position to defend: The appearance of underdetermination is an artifact of omitting something. Once that element is made explicit, the evidence plus the aim of inquiry determines a unique choice.

  We must:
  1. Identify a precise omitted element (not a vague pragmatic virtue).
  2. Explain what work it does in breaking the tie between the two theories.
  3. Confront the strongest objection: that the added element is either not part of the evidence (thus conceding underdetermination) or a disguised empirical assumption (thus begging the question). We must navigate this dilemma without simply denying one horn.

  Proposal for the omitted element: The omitted element is the *computational tractability* of the theory for the purpose of generating predictions, explanations, or interventions. This is not merely a pragmatic virtue but is tied to the aim of inquiry: we seek theories that are not only true (or empirically adequate) but also usable for the tasks of science (prediction, explanation, intervention).

  Why this element is not just pragmatic? Because the aim of science is not just to have a true description of the world but to have one that can be effectively used to advance understanding and control. The evidence (which includes the entire set of observations and the fact that both theories account for them) does not by itself break the tie, but the aim of inquiry (which includes the goal of having a theory that is computationally tractable for the tasks we require of it) does break the tie.

  In the puzzle:
  - The first theory has a dynamical rule that is bloated (thousands of independent parameters) and resists compact formulation, making it computationally intractable in practice for generating predictions or explanations beyond very simple cases.
  - The second theory has a compact rule (fits on an index card) and is computationally tractable (assuming that the compact rule leads to efficient computation).

  But note: the duality transformation maps each theory to the other and swaps the rules. So if we apply the duality to the first theory, we get the second, and vice versa. However, the duality transformation itself might be computationally complex. Therefore, the computational tractability of using the theory in its own terms (without applying the duality) is what matters.

  Thus, in the first theory, to compute the evolution of the system, one must use the bloated rule with thousands of parameters, which is computationally expensive. In the second theory, one can use the compact rule, which is computationally efficient. Therefore, for the purpose of generating predictions, the second theory is superior.

  But wait: what if we use the duality to map a problem in the first theory to the second, solve it with the compact rule, and then map back? Then we get the same result. However, the computational cost of the duality transformation must be considered. If the duality transformation is computationally expensive (which it might be, because it maps a discrete system to a continuous one and vice versa), then the overall cost of using the first theory via the duality might be high. Alternatively, if the duality is computationally cheap, then both theories become equally tractable. Therefore, we must consider the computational cost of the duality transformation.

  However, the puzzle does not specify the computational cost of the duality transformation. We must assume that the duality is a mathematical mapping that may or may not be easy to compute. But note: the duality is defined as a transformation that maps every model of one theory to the other. If the duality is computationally complex, then the two theories are not equally tractable. Specifically, if the duality is as complex as the bloated rule, then the second theory (with the compact rule) is still more tractable because we can use it directly without invoking the duality. The first theory, even if we try to use the duality to convert to the second, would require the costly duality transformation plus the compact rule, which might be more expensive than just using the compact rule alone.

  But there is a catch: the duality transformation might be reversible and one direction might be easy and the other hard. However, the puzzle says that the duality transformation maps each theory to the other and swaps the rules. Therefore, we must consider the cost of the entire process.

  To avoid this complication, we can focus on the intrinsic computational complexity of the theory in its own terms. That is, without invoking the duality, the first theory requires a computation that is parameter-heavy and the second does not. Therefore, for a scientist working within a theory, the second is more tractable.

  But note: the two theories are dual, meaning they are equivalent in every observable way. Therefore, the choice is not about which one is true (they are equally empirically adequate) but about which one is more useful for the purposes of science. The aim of inquiry includes not just truth but also understanding and the ability to generate predictions and explanations efficiently. Therefore, the second theory is rationally preferable because it is computationally tractable.

  The strongest objection: 
  - If computational tractability is not part of the evidence (and it isn't, because evidence is about observations), then by adding it we are going beyond evidence and thus conceding that underdetermination remains at the evidential level. 
  - If we say that computational tractability is an empirical matter (because it depends on the physical resources available for computation, which might be contingent), then we are making an empirical assumption that might be false and thus begging the question.

  Reply to the objection:
  Computational tractability is not an empirical assumption about the world but a constraint on our cognitive and practical engagement with the theory. The evidence (the observations) does not determine the theory, but the aim of inquiry (which includes the goal of having a theory that is usable for prediction, explanation, and intervention) does. The choice between the two theories is determined by the evidence plus the aim of inquiry. The evidence shows that both are empirically adequate, but the aim of inquiry (which is part of the context of theory choice) requires that we choose the theory that is more tractable for our purposes. This does not add a new empirical assumption but recognizes that theory choice is guided by epistemic and pragmatic goals that are constitutive of scientific practice. Therefore, we are not begging the question by adding an empirical assumption because tractability is not a claim about the world but about the relation between the theory and our cognitive and computational limitations.

  Residual cost: The position gives up the idea that empirical evidence alone (without considering the aims of inquiry) can determine theory choice, and thus accepts a form of pragmatism that some realists might find uncomfortable.

  Now, let's structure the argument:

  Position: The puzzle does not show that theory choice is underdetermined by evidence because the choice between the two theories turns on computational tractability, which, when considered together with the aim of inquiry (to have a theory that is usable for generating predictions and explanations), breaks the tie in favor of the theory with the compact dynamical rule.

  Omitted element: Computational tractability for the purpose of generating predictions, explanations, and interventions.

  Why evidence plus aim is determinate: The evidence establishes that both theories are empirically adequate. However, the aim of inquiry includes not just empirical adequacy but also the ability to efficiently use the theory for scientific tasks. The theory with the compact rule is computationally tractable, while the one with the bloated rule is not, so the evidence plus the aim of inquiry uniquely determines the choice of the compact theory.

  Strongest objection: The added element of computational tractability is either not part of the evidence (thus conceding that the evidence alone underdetermines the choice) or it is an empirical assumption about the world (thus begging the question by introducing a non-evidential factor that may itself be contested).

  Reply: Computational tractability is not an empirical assumption about the world but a constraint arising from our cognitive and practical limitations. It is a factor in the context of theory choice that is tied to the aim of inquiry (to have a usable theory). Thus, we are not adding an empirical assumption but making explicit a goal that is inherent in scientific practice. Therefore, the evidence (which shows both theories are empirically adequate) together with the aim of inquiry (which requires tractability) breaks the tie without begging the question.

  Residual cost: This position accepts that the rationality of theory choice depends on pragmatic considerations that go beyond the evidence, which may undermine a strong form of realism that insists on evidence alone as the arbiter of truth.

