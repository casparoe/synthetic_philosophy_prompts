  ### Position Paper: Breaking the Underdetermination Impasse

  The puzzle presents two empirically equivalent theories related by a duality that neutralizes traditional criteria like ontological parsimony and formal simplicity. I argue that this does not demonstrate underdetermination because the choice between the theories turns on **computational tractability**—a factor omitted in the initial specification. Once made explicit, computational tractability, combined with the aim of inquiry (to efficiently generate predictions, explanations, and interventions), determinately favors the continuous-field theory with the compact dynamical rule. This resolves the underdetermination without conceding evidential insufficiency or smuggling in empirical assumptions.

  #### The Argument
  The two theories are empirically equivalent and duality-related, but they differ radically in their intrinsic computational demands. The discrete-entity theory requires processing thousands of independent parameters to apply its dynamical rule, making it computationally intractable for all but trivial cases. In contrast, the continuous-field theory’s compact rule (fits on an index card) permits efficient computation of predictions and explanations. Crucially, computational tractability is not a vague "pragmatic virtue" but a concrete requirement tied to the **aim of inquiry**: science seeks not just true descriptions but *usable* ones that facilitate understanding, prediction, and intervention. Evidence alone (observational equivalence) cannot break the tie—but evidence *plus* the aim of inquiry can. The discrete theory’s intractability obstructs core scientific goals, while the continuous theory’s efficiency advances them. Thus, the continuous theory is uniquely rational to adopt.

  #### Confronting the Strongest Objection
  **Strongest objection:** If computational tractability is not part of the evidence, you concede underdetermination by evidence alone; if it is an empirical assumption (e.g., about cognitive limitations), you beg the question by adding non-evidential content.  

  **Reply:** Tractability is neither non-evidential nor an empirical assumption. It arises from the *constitutive aims of inquiry*, which include generating predictions/explanations efficiently. These aims are not empirical claims but normative commitments internal to scientific practice. Evidence confirms both theories are empirically adequate, but the aim of inquiry imposes a further constraint: a theory must be computationally *actionable*. The discrete theory fails this constraint due to its bloated rule, violating the aim irrespective of empirical performance. This avoids begging the question because tractability evaluates the theory’s functional role in inquiry, not the world’s structure. The dilemma’s horns are thus blunted: tractability is a non-empirical, aim-derived criterion that leverages evidence without exceeding it.  

  **Residual cost:** This position accepts that theory choice depends on irreducible aims of inquiry, weakening the realist claim that evidence alone can arbitrate truth in all cases.  

