answer: |-
  Here’s your diagnostic handout as continuous prose. Walk through it slowly, pausing after each case to let students sit with their answers before revealing the next branching point.

  Start with the case everyone can judge. Imagine a legislature with clear authority, following every procedural rule perfectly, enacts a statute that’s morally monstrous: it strips a religious minority of property and bans them from employment. The constitution is silent, no higher court has ruled, and the statute’s meaning is crystal clear. Your first verdict: is this statute **law**? If you say no, follow Path A. If you say yes, follow Path B.

  **Path A (Not Law):** You believe validity depends on more than procedure. Now consider a second case: a statute enacted just as flawlessly, morally fine, but worded so vaguely no official can tell what it forbids. Is this vague statute law? If no, your view likely ties validity to practical enforceability or clarity—**Fuller-style procedural natural law** fits, seeing law’s inner morality as essential. If yes, the vague statute *is* law, but officials might refuse to enforce it. Now test *why* the first monstrous statute wasn’t law. Is it because *any* moral failing, however minor, invalidates? Then you’re near **substantive natural law** (Finnis’s vein). Or only *extreme* injustice, like genocide or torture? That’s **Radbruch-style non-positivism**. Still, there’s a gap: what if a statute is mildly unjust but clear? If your "no" applies only to extreme cases, Radbruch captures you. If *all* immorality invalidates, substantive natural law does.

  **Path B (Yes, It’s Law):** You see validity as separate from morality. Now the second case: the vague but morally fine statute. Is *it* law? If no, you anchor validity to clarity or function—officials must be able to apply it. This leads toward **Fuller-style procedural natural law**, though you took Path B initially. Fuller straddles paths; your answers may place him later. If yes, the vague statute *is* law, proceed to the third case: a clear, moral, properly enacted statute ignored by officials for forty years, openly called "dead." Is it still law? If no, you think validity requires ongoing social practice (efficacy). If yes, validity is purely about enactment. Next, the fourth case: a norm never written or enacted, yet treated as binding by all officials for generations. Is this custom law? If no, you require formal sources (like statutes)—**exclusive legal positivism** emerges. If yes, unwritten practice *can* be law, proceed.

  You’ve said the monstrous statute is law, vague statutes can be law, dead statutes might be, and custom can be law. Now the fifth case: postwar Germany. A wife denounced her husband under an old, unambiguous, procedurally valid but monstrous statute; he was executed. New courts must decide whether to punish her. They consider retroactive law or the idea that the old statute was never valid due to injustice. Should they punish her? If yes, you likely see retroactive punishment as acceptable because the old law was valid—**exclusive positivism** or **inclusive positivism** both fit here. If no, you think applying the old law was wrong, but *why*? If because officials *morally shouldn’t enforce valid evil laws*, not because they were invalid, you’re a positivist who separates validity from enforcement—**inclusive positivism** allows this. If you say the old statute *wasn’t law*, you circle back to Path A (Radbruch or substantive natural law).

  Still on Path B, consider the sixth case: a trial judge makes a ruling with no prior statute or precedent, morally admirable, and it becomes settled law. Was that ruling already law *when made*? If no, law needs established sources—**exclusive positivism**. If yes, moral principles can *be* law without sources—**Dworkin-style interpretivism** fits. Now the seventh case: a flawless constitutional amendment abolishes judicial review and immunizes the ruling party. Courts keep hearing ordinary cases. Is this amendment law? If no, you tie validity to systemic justice or function—**substantive natural law** or **Dworkin**. If yes, validity is source-based regardless of content. But here’s a final node: does your "yes" depend on the legal system being *generally decent*? If in a wicked system, the same amendment wouldn’t be law, you’re near **Radbruch** or **natural law**. If it’s law regardless of the system’s morality, you’re a **positivist**.

  **Leaf Positions & Gaps:**  
  - **Exclusive legal positivism**: Validity only from social sources; morality never conditions validity. Officials *can* enforce immoral laws.  
  - **Inclusive legal positivism**: Validity from social sources, but those sources *might* include moral tests. Officials *may* refuse to enforce valid immoral laws.  
  - **Fuller-style procedural natural law**: Validity requires adherence to law’s "inner morality" (clarity, non-retroactivity, etc.).  
  - **Substantive natural law**: Immoral norms cannot be valid law.  
  - **Radbruch-style non-positivism**: Only *extreme* injustice invalidates; otherwise, positivism holds.  
  - **Dworkin-style interpretivism**: Law includes moral principles that best justify past decisions.  
  - **Deflationary views**: "Is it law?" has no single answer; context determines usage.  

  **Notable Gaps:**  
  1. **"Valid but no official should ever apply it"** without moral tests in validity (inclusive positivism’s niche) is coherent but often conflated with invalidity.  
  2. **"Immoral norms invalid only in wicked systems"** lacks a clear occupant—it mixes Radbruch (extreme injustice) with systemic relativism, which few defend.  
  3. **"Unenforceable norms are invalid, but morality irrelevant"** (a procedural view without Fuller’s morality) is unexplored; it might collapse into exclusive positivism if enforceability is deemed a social fact.  

  **Unseparable Leaves:**  
  - Inclusive positivism and Dworkin might both endorse the judge-made ruling as "law" (sixth case). Dworkin sees it as *always* law via principles; inclusive positivism might see it as new law *after* judicial act. The tree hints at this via the "when made" node.  
  - Fuller and substantive natural law both reject the monstrous statute, but the vague statute case splits them (Fuller says invalid; natural law might accept it if moral).  

  This tree reveals intuitions about bindingness, source, and morality—before labeling them. Notice where you paused: that tension is the seminar’s terrain.
