prompt: |-
  For some years I've kept a private taxonomy of the ways I come to know things — perceiving, inferring, being told, remembering — mostly as a check on lumping distinct things together. One entry has never found a home, and I want to know whether the phenomenon has a name and, more to the point, how it is bounded.

  The case: someone tells me that a certain bird is like a small crow but with a white patch on the wing. The sentence by itself tells me nothing about any actual bird. Months later I see one, and on the strength of the likeness I know both that this is the bird the description was for and what the word for it means. Two things resist my categories. I never held a general premise I could have stated — I couldn't have written the inference down, because I didn't know the class beforehand, and a felt resemblance is not a proposition I believed in advance. And the sentence gave me the description but not the knowledge; the knowledge arrived only when the description met a perception. So it is not testimony, not inference from a rule, and not bare perception either, since the seeing alone wouldn't have told me what the word meant.

  A second case feels like the same shape but may not be: I know roughly what a friend is feeling by matching it against a state I have been in myself. Again nothing is deduced and nothing is reported; a likeness carries the recognition.

  Is there an established concept for the first case, and does it extend to the second? Analogical reasoning looks close, but it appears to be a form of inference that presupposes I already have both terms — which is the thing I am trying to explain. Ostensive definition looks close, but nobody points, and what I receive is a likeness rather than a label. I don't much care which tradition supplies the vocabulary. What I want are the boundaries: what the move is exactly, which of my two cases fall inside it, what it is not, and where its edges lie.
reasoning: |-
  Okay, the user has this fascinating private taxonomy of how they come to know things—perceiving, inferring, being told, remembering. But there's this one entry that doesn't fit anywhere. They describe two cases: one where someone tells them about a bird with a specific description, and months later, seeing that bird triggers recognition and understanding. The second case is recognizing a friend's emotions by relating it to their own past state. 

  The user is trying to figure out if there's an established concept for this phenomenon, especially the first case, and whether it applies to the second. They've considered analogical reasoning and ostensive definition but find them lacking. Their deeper need seems to be understanding the boundaries of this cognitive process—what exactly it is, what it includes, and where it stops.

  So the user is a deep thinker, probably with a philosophical or cognitive science bent. They've been pondering this for years, which shows persistence and intellectual curiosity. Their taxonomy project suggests they value precision in categorizing knowledge. The frustration with this unclassifiable entry is palpable—they really want to pin it down.

  For the first case, the bird example involves delayed recognition where a verbal description only becomes meaningful upon encountering the instance. It's not testimony alone because the knowledge wasn't present when told; not inference since there's no prior general rule; not pure perception as the sight alone wouldn't have provided meaning. The key elements seem to be: stored descriptive content + direct encounter + pattern-matching via perceived resemblance.

  The second case about empathy through personal experience seems structurally similar: stored experiential knowledge + observed cues + pattern-matching. But is it the same mechanism? Both rely on recognition via likeness without explicit reasoning.

  Searching for established concepts... cognitive psychology offers "pattern recognition" and "prototype activation." Phenomenology has "prepredicative experience." Kant's "schematism" might be relevant too. Wittgenstein's "aspect-seeing" could also relate. 

  The core mechanism appears to be recognitional capacity formation—descriptions/experiences create latent patterns that get activated by matching perceptions. This explains why it's not inference (no premises) and not testimony (knowledge emerges later). The boundaries: it requires both prior exposure (to description or experience) and a triggering perception with sufficient resemblance.

  For the empathy case—same mechanism? Personal experiences create emotional prototypes that get matched to others' expressions. But here the "description" is one's own lived experience rather than verbal input. Still fits the recognitional pattern-matching model.

  Important distinctions: this differs from analogy (which compares two known things) and ostension (which points at the moment). Also different from memory recall or deduction. The edges lie where there's no latent pattern formed beforehand, or no perceptual trigger.

  User will likely appreciate clear boundaries and precise terminology. Should emphasize how this fills their taxonomy gap by being a distinct knowledge-acquisition mode combining linguistic/experiential priming with perceptual recognition.
answer: |-
  Your inquiry identifies a fascinating epistemic phenomenon that straddles several traditional categories. The core mechanism is **recognitional capacity formation through latent pattern-matching**, falling under the broader umbrella of **non-propositional knowledge acquisition via schema activation**. No single term fully captures it, but the closest established concepts are **"aspect recognition"** (Wittgenstein), **"schema-based perception"** (cognitive psychology), or **"predicative synthesis"** (Kantian phenomenology). Below is a structured analysis addressing your concerns:

  ### 1. **The Core Phenomenon: Recognitional Capacity Formation**
     - **Mechanism**: A descriptive template (verbal or experiential) creates a *latent cognitive schema*. When sensory input matches this schema, recognition occurs without explicit inference.
     - **Key Features**:
       - **Schema priming**: The initial description ("small crow, white wing patch") forms an unarticulated perceptual template.
       - **Recognitional trigger**: Direct perception activates the schema, generating knowledge *de novo*.
       - **Non-inferential immediacy**: No propositions are manipulated; matching occurs at the perceptual level.

  ### 2. **Case Analysis**
     - **Bird Case**:  
       - **Prior state**: You possess a *verbal schema* (linguistic description) without perceptual content.  
       - **Recognition event**: Sensory input (seeing the bird) resonates with the schema, triggering *perceptual categorization* ("This *is* that bird").  
       - **Knowledge gained**: Simultaneous identification ("this is the bird") and semantic grounding ("this is what 'X' means").  

     - **Empathy Case**:  
       - **Prior state**: You possess an *experiential schema* (your own past emotional state).  
       - **Recognition event**: Observing cues in your friend activates *affective pattern-matching*.  
       - **Knowledge gained**: Recognition of their emotional state via embodied resonance.  
       - **Structural identity**: Both cases involve schema-percept matching without inference.  

  ### 3. **Established Frameworks**
     - **Wittgenstein's "Aspect-Seeing"** (*Philosophical Investigations*):  
       - Sudden shifts in perception (e.g., "seeing" a likeness in a duck-rabbit image).  
       - Your cases extend this: the "aspect" is recognized only after schema implantation.  
     - **Kantian Schematism**:  
       - Schemas mediate concepts/percepts. Your prior description creates a *proto-schema* that crystallizes upon perception.  
     - **Cognitive Prototypes** (Rosch):  
       - Descriptions form prototype features; recognition occurs when an instance fits the prototype threshold.  

  ### 4. **Boundaries & Distinctions**  
     | **Feature**               | **This Phenomenon**                          | **Analogical Reasoning**         | **Ostensive Definition**      |  
     |---------------------------|----------------------------------------------|----------------------------------|-------------------------------|  
     | **Prior Knowledge**       | Latent schema (non-propositional)            | Two articulated concepts         | Pointing + label              |  
     | **Trigger**               | Perception matching schema                   | Comparing known relations        | Concurrent demonstration      |  
     | **Output**                | Recognition + semantic grounding             | Inferred similarity              | Label-object association      |  
     | **Temporal Gap**          | Critical (schema must incubate)              | Irrelevant                       | Immediate                     |  

     - **What it is NOT**:  
       - **Not inference**: No premises are deployed; recognition is immediate.  
       - **Not testimony**: Testimony transmits knowledge *at receipt*; here, knowledge emerges later.  
       - **Not pure perception**: Perception alone is insufficient without the primed schema.  
       - **Not memory**: Recalls no prior *event*; matches a *template* to present input.  

  ### 5. **Edges & Limits**  
     - **Lower Bound**: Fails if:  
       - The schema is too vague (e.g., "a beautiful bird" lacks distinctive features).  
       - Perception is degraded (e.g., seeing the bird in poor light).  
     - **Upper Bound**: Morphs into inference if:  
       - You consciously *compare* features ("This matches the description, therefore...").  
       - The schema is articulated as a rule *before* perception.  
     - **Scope**: Applies to any domain where:  
       - (a) A template can be formed (descriptions, emotions, skills),  
       - (b) Pattern-matching operates pre-linguistically (perceptual, affective, sensorimotor).  

  ### 6. **Why Both Cases Qualify**  
     The empathy case uses an *experiential* rather than verbal schema, but the mechanism is identical:  
     - **Schema formation**: Past emotion creates a somatic template.  
     - **Recognition**: Friend's behavior activates the template via mirroring or affective resonance.  
     - **Non-propositionality**: Recognition feels instantaneous, not deduced.  

  ### Conclusion
  Your phenomenon is best termed **"schema-triggered recognition"**—a distinct epistemic mode where dormant patterns (from language or experience) fuse with perception to generate new knowledge. It occupies a niche between perception and cognition, bounded by:  
  - **Necessary conditions**: Schema priming + delayed percept matching.  
  - **Exclusion criteria**: Absence of conscious inference, or knowledge acquisition at schema delivery.  
  - **Scope**: Covers both descriptive and affective recognition when structural similarity enables pre-reflective matching.  

  This resolves your taxonomy gap: it is neither testimony nor inference, but a *prepredicative synthesis* that enables perceptual knowledge to emerge from latent structures.
