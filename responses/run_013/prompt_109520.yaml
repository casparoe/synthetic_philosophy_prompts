prompt: |-
  Okay, so I'm a novelist, and through a series of small mistakes I've ended up on the steering committee of an international writers' festival we put on every other year. Mostly I approve budgets and nod along. But now there's an actual dispute and I have to write something up before the next meeting, and I'd rather not wing it in front of people who will remember.

  Here's the situation. Our city has the usual set of local customs, and two of our visiting fellows from this year's cohort ran afoul of them. One, who's from a country where tipping isn't done and leaving money is faintly rude, ate at the restaurant we always send fellows to, paid the bill exactly, and left nothing. The server there is a friend of one of our board members and complained, and to be fair the servers at that place really do live off tips. The other fellow jaywalked in front of a local writer who was crossing with her kid, and also cut the coffee queue at the venue twice by claiming he was holding a spot for someone. A staff member has now filed a formal complaint asking us to discipline both of them, or at least to put a clause in the fellowship agreement saying visiting writers must follow local customs.

  The board meets in three weeks and I've been asked to circulate a short written opinion beforehand. So what I want from you is that memo. Recommend a concrete course of action, not a vibe: what goes in the fellowship agreement (if anything), what we say to the two fellows, what we say to the staff member who complained, and by when. Give the strongest version of the argument on the side you end up rejecting, because half the board will be on that side and I don't want to get shredded.

  Two things I'd like you to actually work through rather than skip. First, I don't think all these customs are the same animal, and I want the memo to sort them. Some conventions seem to be pure coordination, where the content barely matters as long as everyone does the same thing. Some seem to distribute burdens, like tipping, which is arguably just passing a restaurant's payroll onto customers. Some seem to be about showing respect or acknowledging who was there first, like the queue. Does the kind of convention change whether a visitor owes compliance? Say so explicitly, with the case behind each claim.

  Second, and this is the part that's keeping me up: the tipping case is ugly because both ways out look bad. If the fellow complies, he props up an arrangement a lot of people think is unjust and quietly confirms that servers should depend on the charity of strangers. If he doesn't, a specific underpaid person eats the cost, and he also free-rides on everyone else who does pay. I want the memo to say which horn we take and why, not to wave it away with a line about being guests of the city. Everyone on this board already knows how to say when in Rome, so spare me that.

  You can bring in the philosophy if it helps — the stuff about conventions as solutions to coordination problems, the older line about customs arising from mutual interest rather than agreement, the moral/conventional distinction, all of that — but keep it in service of the actual decision. No reading list, no citations, the board won't read them. Plain prose, a clear bottom line, and a honest paragraph for the losing side. Thanks.
reasoning: |-
  Okay, the user is a novelist who's unexpectedly landed on the steering committee of an international writers' festival. They need to draft a memo addressing a dispute involving two visiting fellows who violated local customs—one didn't tip at a restaurant, and the other jaywalked and cut in line. The user wants a concrete recommendation, not vague advice, and specifically asks to address the ethical dilemma in the tipping case and to differentiate between types of customs.

  First, I need to understand the core issues. The tipping incident involves a fellow from a non-tipping culture, leading to a server (who's connected to a board member) complaining. The user is troubled by the moral conflict: enforcing tipping supports an unfair system, but not enforcing it harms the server. The other incidents (jaywalking, queue-cutting) are about social order and respect. The user wants the memo to classify these customs and take a clear stance.

  The user's deeper needs include avoiding boardroom conflict by preempting counterarguments, showing nuanced understanding without academic jargon, and providing actionable steps. They also need to navigate the power dynamics—being a novelist among potentially more experienced committee members.

  For the memo structure, I should start with the recommendation upfront. Then break down the customs: tipping as a burden-distribution practice with immediate victim impact, queue-cutting as respect-based with diffuse harm, jaywalking as coordination/low-harm. This classification justifies different responses. For the tipping dilemma, I need to pick a side—prioritize the server's livelihood over systemic critique, as the fellowship's role isn't to protest local labor practices.

  The losing argument section must validate the opposing view sincerely, especially the "unjust system" angle for tipping, to show respect and prevent backlash. Conclude with clear actions: no policy change, direct apologies for queue-cutting, educational materials for future fellows, and a response to the complainant.

  I should avoid "when in Rome" platitudes. Use plain language, keep philosophy minimal but relevant—mention coordination problems and burden distribution briefly to support the classification. Ensure every part ties back to the festival's practical responsibilities and the fellows' role as guests.
answer: |-
  ## MEMORANDUM: Response to Fellow Conduct Concerns & Proposed Fellowship Agreement Amendment  

  **To:** Steering Committee, International Writers Festival  
  **From:** [Your Name], Steering Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommended Action Regarding Fellow Conduct Incidents & Proposed "Local Customs" Clause  

  ### 1. Recommended Actions (Bottom Line Up Front)
  *   **Do NOT amend the fellowship agreement** to include a blanket "follow local customs" clause.
  *   **Address the queue-cutting incident directly:** The Festival Director (or designated liaison) should privately inform the fellow who cut the queue that their actions were disrespectful to fellow attendees and staff, violated the implicit social contract of the venue, and are not acceptable. A simple, private apology to the Festival (not necessarily the specific individuals) should be requested.
  *   **Address the tipping incident educationally:** The Festival Director (or designated liaison) should privately inform the fellow who didn't tip that while we understand cultural differences, *this specific restaurant's staff relies entirely on tips for their livelihood*, and their action resulted in a tangible loss for a low-wage worker. An educational explanation of the local context is required, but *no apology or restitution should be demanded*. Future orientation materials will clearly explain this specific local practice.
  *   **No formal action is warranted regarding the jaywalking incident.**
  *   **Respond to the complainant:** The Chair or Festival Director should thank the staff member for bringing their concerns forward, outline the specific actions taken above regarding queue-cutting and the educational approach to tipping, explain why a blanket clause is impractical, and emphasize our commitment to fostering a respectful environment through clear communication and specific guidance, not broad disciplinary rules. This response should be delivered within **one week** of the committee endorsing this approach.
  *   **Enhance Fellow Orientation:** Develop a concise, practical "Local Context Guide" for future fellows, explicitly covering: tipping norms (especially for recommended partner venues like the restaurant in question), queue etiquette, basic pedestrian norms, and other high-impact/local-sensitivity practices. Frame it as essential information for navigating the city smoothly and showing respect, not as a binding rulebook. Implement for the **next fellowship cohort**.

  ### 2. Analysis: Sorting the Conventions & Our Obligation
  The incidents involve distinct types of conventions, and the nature of the convention significantly impacts the obligation of a visitor and the appropriateness of our intervention:

  *   **Tipping (Burden-Distribution Convention):** This is not merely coordination; it's a deeply embedded economic practice distributing the cost of labor directly to consumers. While arguably unjust, *it is the active reality*. A visitor's non-compliance isn't just "different"; it directly imposes a financial cost on a specific, vulnerable individual (the server) who reasonably expected the convention to be followed. The fellow, by benefiting from the service within this system without contributing to the worker's expected wage, becomes a free-rider on those who do comply. **Visitor Obligation:** High. While the visitor isn't morally responsible for the *system*, they incur an obligation to avoid directly harming a specific individual who exists within and relies upon that system during their transactional interaction. Our festival, by directing fellows to this restaurant, implicitly endorses the system operating there.

  *   **Queue-Cutting / Line-Jumping (Respect & Fairness Convention):** This convention solves coordination (who gets served when) but its core is about mutual respect and fairness. It acknowledges the implicit effort and time investment of those already waiting. Violation creates diffuse resentment and a sense of disrespect among those affected (the people in line, the staff managing it). While disruptive and rude, the harm is primarily to social cohesion and feelings of fairness, not usually a direct, quantifiable financial loss or safety risk in this context. **Visitor Obligation:** Moderate. Respect for the basic social order and consideration for others is a universal expectation, even if the specific *form* (standing in a line) varies. Deliberate violation shows disregard for fellow attendees and staff.

  *   **Jaywalking (Coordination/Safety-Lite Convention):** This is primarily a coordination convention with a safety element that varies drastically by context (busy highway vs. quiet side street). In the specific instance described (crossing in front of someone), the primary offense was likely rudeness or creating a minor, momentary disruption, not a significant safety hazard. Many cities have ambiguous norms around this. **Visitor Obligation:** Low. While safety is paramount, minor jaywalking in low-risk situations is often a matter of local variance and personal judgment. Enforcement is typically the domain of civil authorities, not the festival, absent reckless endangerment.

  ### 3. Grappling with the Tipping Dilemma: Which Horn?
  You are correct: both paths are flawed. However, **we must prioritize avoiding direct, tangible harm to a specific individual over making a symbolic stand against a systemic issue.** Here's why:

  *   **The Immediate Victim:** The server suffered a real financial loss based on a reasonable expectation within the established system. The fellow benefited from their labor without paying the expected cost. Our festival facilitated this interaction. The fellow's protest (intentional or not) was misdirected; it punished the worker, not the owner or the system.
  *   **Festival's Role & Scope:** Our mandate is to host international writers, foster exchange, and run a smooth event. We are not equipped, nor is it our purpose, to adjudicate the morality of local labor practices or facilitate individual protests against them via non-tipping, especially when directed at specific workers we indirectly employ through partnerships. Using the server as an unwilling proxy for this debate is unfair.
  *   **The Free-Rider Problem:** Ignoring non-tipping condones free-riding. It allows the visitor to benefit from the system (lower meal prices subsidized by the *expectation* of tips) while avoiding the cost, placing the burden solely on locals and other compliant visitors.
  *   **The Alternative is Worse:** Demanding the fellow pay retroactively is untenable and punitive. Demanding an apology for acting within their cultural norm feels disproportionate. *Not* acknowledging the impact on the server is callous and ignores our complicity in directing them there. Education for the future, focused on the *practical reality for workers* in this specific context, is the least bad option. It addresses the harm without punitive measures, while acknowledging the systemic issue exists but is beyond our power to fix via fellow discipline.

  ### 4. The Strongest Argument for the Rejected Approach (Blanket Clause & Stronger Discipline)
  *(Presented fairly, as requested)*

  "The strongest argument for a 'follow local customs' clause and formal discipline rests on the principle of respect and the festival's reputation. We invite these writers as our guests, providing significant opportunity and support. In return, the absolute minimum expectation is that they show basic respect for the community hosting them. Customs, even seemingly arbitrary ones like tipping or strict queueing, are the fabric of local social order. Deliberately flouting them, as seen in the queue-cutting and the refusal to tip despite understanding the context (which could reasonably be assumed), is deeply disrespectful. It signals a sense of entitlement and superiority, implying their norms are more valid than ours. This damages relationships with local partners (like the restaurant whose staff feels exploited), creates friction with local writers and attendees, and tarnishes the festival's goodwill. Relying solely on 'education' after the fact is weak and reactive. A clear clause sets expectations upfront, protects vulnerable workers and the social environment, and gives us grounds to address violations firmly. Failing to enforce respect through clear rules risks normalizing entitled behaviour and undermining the collaborative spirit essential to the festival's success. The potential for cultural misunderstanding exists, but persistent or deliberate disregard warrants consequences."

  ### 5. Conclusion & Timeline
  Our response must be proportionate, targeted, and mindful of both cultural difference and tangible harm. Amending the agreement is a blunt instrument that invites conflict over unstated norms. Instead, we address the concrete issues:

  *   **Queue-Cutting:** Direct call-out for disrespect. Request acknowledgment/apology. *(Action: FD within 3 days of decision)*
  *   **Tipping:** Private education on local impact. No penalty, but future guidance emphasized. *(Action: FD within 3 days of decision)*
  *   **Jaywalking:** No action.
  *   **Complainant Response:** Clear explanation of actions taken and rationale. *(Action: Chair/FD within 1 week of decision)*
  *   **Future Prevention:** Develop and implement "Local Context Guide" for orientation. *(Action: Staff - Draft by next meeting; Implement for next cohort)*

  This approach addresses the real harms and disrespect demonstrated, provides clarity for the future, avoids unenforceable broad rules, and respects the complexities of cultural exchange without sacrificing basic standards of consideration. I recommend the Committee endorse this course of action.
