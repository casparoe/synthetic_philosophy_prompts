  To distinguish principled restrictions from mere stipulations, we can look at explanatory power and naturalness. A principled fix should explain why previous approaches failed and how the new axioms reflect a deeper understanding. ZFC's iterative conception does this by showing how sets are constructed step-by-step, avoiding self-containing sets naturally. NF’s stratifiable formulas might feel more technical and less intuitive, hence less principled to some.

  The user also asked about open questions. While ZFC is widely accepted, there are debates about alternative foundations like category theory or homotopy type theory. These explore different ways to handle collections without paradox, often motivated by mathematical needs rather than just avoiding inconsistency. The philosophical underpinnings—what sets really are—remain open to interpretation, even if the technical resolutions are consistent.

