answer: |-
  ## The Verdicts of Verity

  The gavel cracked on scarred oak. "Guilty," announced Councilor Delia, her voice flat. Abel Finch slumped, chains clanking, as guards led him away for stealing grain. Beside me, young Tomas Radnor hissed, "But he *didn't*. I saw Jed Hooper near Finch’s silo that night!"

  I’d only been in Verity a month. Justice here wasn’t meted out by a single judge, but by panels of nine townsfolk drawn by lot. Nine supposedly "more right than wrong" citizens. Yet Abel Finch, innocent according to Tomas and a gut feeling honed by years on the frontier, was heading for the stockade. Later, I cornered Delia in the dim council hall, the smell of dust and old paper thick.

  "Nine heads," I pressed, "and they got it wrong?"

  Delia sighed, polishing her spectacles. "Happens. Each juror, we reckon, sees the truth about... say, fifty-five times out of a hundred. Better than a coin flip, right? But put nine together, and sometimes the wrong majority wins. It’s math, Eli. Like flipping nine weighted coins – mostly heads, but sometimes tails sneak through."

  "So add more coins," I argued. "More jurors. Can't hurt, can it? More eyes, more sense."

  Delia gave a thin smile. "Usually, no. Usually, it helps. A lot." She pulled out a slate and chalk. "See, if each juror’s got, say, a sixty percent chance of being right..." She scribbled furiously, probabilities blooming like strange flowers. "...with thirteen jurors, the chance the *majority* is right jumps to near eighty percent. With twenty-one? Over ninety. More voices, properly independent, drown out the random mistakes."

  Her chalk paused. "But Eli... flip that coin. Imagine each juror’s only right... forty-five times out of a hundred. Worse than a coin." She tapped the slate. "Now add more jurors. Suddenly, it gets *worse*. The chance the *majority* is wrong *increases*. More bad judgments pile up, reinforcing the error. To get decent certainty then? Ha!" She wrote a large number. "You'd need hundreds. Thousands, maybe. A hair better than chance isn't much comfort when you need a mountain of them to be sure." She wiped the grim arithmetic away. "Thank the stars most folks here try to be fair. Mostly."

  Months passed. Verity faced a bandit scare. A fifteen-juror panel unanimously convicted a notorious raider caught red-handed. The town cheered the system. Independence, it seemed, worked.

  Then came the Willowby dispute. Old Man Willowby died, leaving a contested chest of silver. Three claimants: distant cousin Martha, business partner Jonas, and the town school (Willowby’s muttered deathbed wish, some said). The council decided Verity itself would vote on the rightful heir.

  Panic ensued. Three choices: Martha, Jonas, School. No consensus. Delia proposed running a vote between each pair to find a majority winner.

  Round One: Martha vs. Jonas. Martha won, 52-48. The town liked family.
  Round Two: Martha vs. School. The School won, 60-40. Education mattered!
  Round Three: Jonas vs. School. Jonas won, 55-45. Business sense prevailed.

  Delia stared at the tally sheet, chalk dust on her fingers like ash. Martha beat Jonas. School beat Martha. But Jonas beat School. Each pair had a clear winner, but together? Chaos. The "Town's Will" was a snake eating its own tail. The outcome depended entirely on the *order* of the votes. Run Martha vs. School first? School wins, then beats Jonas. Run Jonas vs. School first? Jonas wins, then might lose or win against Martha. There was no stable majority choice.

  "Condorcet's Nightmare," Delia muttered under her breath, catching my eye. I didn't know the name, but the shadow of endless, meaningless cycles was clear. We settled it by drawing lots for the voting order. Jonas got the silver. Martha cursed. The schoolmaster looked bereft.

  Independence finally shattered during the Miller case. Did Sarah Miller poison her husband, or was it bad venison? The seven-juror panel was drawn. Problem: the Millers lived near Creek Bend, a tight-knit cluster of families. Three jurors were Creek Benders. Gossip had flowed like the creek itself for days – whispers of Sarah's sharp tongue, her husband's debts, the strange herbs she collected.

  The trial was tense. Evidence was thin – ambiguous symptoms, no clear poison found. But the whispers had done their work. I saw the Creek Bend jurors exchange glances, their faces set. The vote was swift: 4-3, Guilty. Sarah Miller screamed her innocence as they took her away. The three non-Creek Bend jurors looked shaken, outnumbered by neighbors swayed more by shared suspicion than evidence.

  I found Delia by the river, skipping stones. "The Creek Bend block," I said. "They weren't independent. The gossip bound them together."

  She nodded grimly. "Like vines choking a tree. Their votes weren't their own judgments anymore; they were the echo of the holler. Breaks the whole machine, Eli. The math relies on separate coins. Bind them together..." She flung a stone hard. It skipped twice and sank. "...and you just get a heavier lump of bias sinking faster. Finch was random error. Miller... that was system failure."

  We walked back towards Verity. The stockade held Abel Finch (wrongly, we believed), Sarah Miller (possibly wrongly, certainly tainted), and the bandit (rightly). The silver rested with Jonas due to a lottery of voting order. Delia carried the weight of the slate where she calculated certainties and mapped impossible cycles.

  "The math is beautiful, Eli," she said finally, her voice tired. "When the pieces are right – independent, slightly wise – adding voices *does* find truth. But drop below that razor's edge of individual goodness, or let the pieces stick together, or give them too many tangled paths... and the numbers turn. They turn into monsters, or mazes, or just... noise." She looked at the haphazard buildings of Verity. "Finding justice? It's less like math, and more like walking a tightrope over that creek in a high wind. One misstep..." She didn't finish. We both knew the view from the fall.
