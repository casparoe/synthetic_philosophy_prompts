  Also worth considering: Could this accomplice mode secretly be monumental? When they say "not monumental with a loser where the hero goes" - but by giving forgotten figures a "second run," aren't they still creating heroes? Just alternate ones? The defense would be that these are deliberately incomplete second chances, not wholesale victories, but that distinction needs careful guarding.

