prompt: |-
  I've been arguing with my roommates about this for weeks and I want someone to just tell me what I actually believe. Here's my gut on a bunch of cases. My one vote in the presidential election, in a state that's going to go the same way no matter what: I skipped it last time cause I was tired and I dont feel bad about it at all, though I'd still tell my friends voting matters. Me eating a burger: I feel genuinely guilty, and if I'm honest I think it's wrong, even though I know one burger kills nothing and changes no numbers anywhere. My round trip flight to see my sister in Portugal last spring: don't feel guilty, and when my coworker lectured me about it I thought she was being a little silly, even though the flight's emissions are obviously way bigger then the burger's. Tossing an empty bottle out the car window on the highway: I've done it, I feel bad about it, like actually bad, and I think it's wrong. Not rinsing a jar before it goes in the recycling: nothing, don't care, not wrong. Buying a cheap t-shirt I'm 90% sure came from a sweatshop: feels worse than the flight, worse than the burger, and I bought it anyway. Taking the car instead of the bus that stops right by my house: I feel like a jerk, mildly, in a way I don't feel about the flight. Leaving the faucet running while I brush my teeth: nothing. Eating the last of the chips my roommate was saving: not related, sorry, ignore that one.

  What kills me is the pattern. Voting and the bottle out the window look identical on paper — one person, zero effect either way, and the bad outcome happens regardless — but I think one of them is fine and the other is wrong, and I can't defend that. Same with the burger vs the flight: the flight does more damage, I'm sure of it, but the burger is the one that feels wrong. I've tried a few principles on my own. "What if everyone did it" seems to get the bottle and the burger but it would also make my vote mandatory, which I don't buy, and it seems to make the t-shirt fine, which I also don't buy. "It's wrong when you're complicit in a system that does the harm" gets the t-shirt and the burger but then I don't see how the flight escapes, and anyway I'm complicit in the bus company too. The best I've come up with is something like: it's wrong when my action is a small piece of a harmful pattern that I'm knowingly participating in, unless my participation is basically symbolic or the harm is spread so thin there's no pattern at all — but I have no idea what "spread so thin" means and I suspect I'm just describing my feelings back to myself.

  So: is there a principle that gets all of these, or close, and which of my gut feelings does it force me to drop? I'd like it stated precisely enough that I can apply it myself, with a note on which case in my list is doing the work for each part of it. And then use it on a case I haven't thought about, so I can tell whether it's real: say there's a lake with a limit of five fish per person per day, and I'm one of about ten thousand people who each take a sixth fish, and the fish population crashes. Or make up a better one. Also, just so I know what I'm signing up for, tell me which of my verdicts you'd call flat-out inconsistent with the others and why I should give it up, rather than smoothing it over.
reasoning: |-
  Okay, I need to help this user figure out the ethical principles behind their gut feelings on various actions. They've listed several scenarios: skipping voting, eating a burger, taking a flight, littering, not rinsing recyclables, buying a sweatshop shirt, choosing car over bus, wasting water, and eating roommate's chips. The user feels inconsistent because actions with similar structures (like voting vs. littering) evoke different levels of guilt, and they can't find a unifying principle. Their attempts with "what if everyone did it" and complicity theories haven't fully worked.

  First, I should identify patterns in their responses. Voting feels fine to skip; littering feels wrong. Burgers cause guilt but flights don't. Sweatshop shirts feel worse than flights. Driving instead of bussing brings mild guilt, unlike flights. The key conflicts are between negligible individual impact versus perceived wrongness.

  The user mentioned principles they've tried. The "universalization" principle (what if everyone did it) makes voting seem mandatory, which they reject, and excuses sweatshop purchases, which feels wrong. Complicity in harmful systems captures burgers and sweatshops but not why flights or cars are treated differently. 

  Looking deeper, the differences might lie in directness of harm, personal benefit, and social norms. Littering is direct harm with no benefit; voting abstention has no direct harm and low benefit. Burgers involve direct participation in animal suffering; flights' environmental harm is indirect and diffuse. Sweatshops are direct exploitation; driving over bussing is a visible, unnecessary choice.

  The user's guilt seems tied to actions where harm feels tangible and immediate, or where social norms are strong. Littering is socially frowned upon; wasting water isn't. Burgers involve killing, which feels personal; flight emissions are abstract. Sweatshops have clear victim narratives; car vs. bus is a local, observable trade-off.

  For a coherent principle, I consider a hybrid approach: direct participation in harm plus social signaling. This would cover littering (direct, visible harm), burgers (direct complicity in killing), sweatshops (direct exploitation). Voting skip is symbolic participation with negligible effect. Flights are indirect harm with high personal utility. Not rinsing jars has negligible impact. Driving over bussing is a visible, easily avoidable harm.

  The fish lake case tests this: taking a sixth fish contributes directly to overfishing. If everyone does it, collapse occurs. The user's guilt would likely align here because it's direct participation in a collective harm with clear consequences.

  Inconsistencies: Feeling guilty about burgers but not flights. Flights have larger aggregate harm. The user might need to adjust, recognizing that flights' harm is real but diffused, making guilt less intuitive. Or accept that personal connection (like food choices) heightens guilt.

  The user's core conflict is balancing individual impact with moral intuition. They might prioritize revising their view on flights or accepting that emotional responses aren't always logically consistent. But the proposed principle offers a structured way to assess actions based on direct harm and social context.
answer: |-
  Based on your gut reactions and the struggle to find a consistent principle, your underlying ethic appears to be **Prohibiting Direct, Identifiable Harmful Participation in Collective Harms**. Let's break this down, apply it rigorously to your cases, and see where it fits and where it forces you to adjust your verdicts.

  **The Principle Stated Precisely:**

  1.  **Direct Participation:** Your action must be a *necessary, identifiable step* in a causal chain leading to harm. It must feel like *your specific choice* directly enables the harm.
  2.  **Identifiable Harm:** The harm must be concrete, tangible, and relatively immediate. Abstract, diffuse, or highly mediated harms don't trigger the same feeling of wrongness.
  3.  **Collective Context:** The harm arises from a pattern of many similar actions, but your *individual contribution* is still a distinct, required part of that pattern.
  4.  **Exemption for Symbolism/Negligible Impact:** Actions that are purely symbolic (like voting in a predetermined state) or where your *specific* contribution is genuinely lost in statistical noise *and* feels disconnected from the tangible harm, are exempt.

  **Applying the Principle to Your Cases (✓ = Fit, ✗ = Inconsistent, ~ = Borderline/Adjustment Needed):**

  1.  **Skipping Vote (Safe State): ✓ Fit.** Your vote is symbolic/ineffective (negligible impact exemption). The outcome happens regardless of *your specific* non-participation. No direct causal chain runs *from your skipped vote* to a bad outcome.
  2.  **Eating the Burger: ✓ Fit.** You are *directly participating* (purchasing, consuming) in a system causing *identifiable harm* (animal suffering/death). Your action is a necessary step in the demand chain, even if negligible statistically. The harm feels concrete.
  3.  **Flight to Portugal: ✗ *Inconsistent*.** **Principle Demands Adjustment:** *Direct Participation:* Yes, buying the ticket enables the emissions. *Identifiable Harm:* Climate change impact is real but highly abstract and diffuse (future, global, complex causes). *Collective Context:* Yes. **Why it feels okay to you (but shouldn't under principle):** The harm is too abstract and your contribution feels lost. **The principle forces you to either: (a) Drop the guilt about the burger (since both are collective harms with negligible individual impact), or (b) Accept guilt about the flight as logically required.** Your gut treats the flight like voting – negligible impact in a vast system. But the principle treats it like the burger – direct participation. *This is the core inconsistency.*
  4.  **Tossing Bottle: ✓ Fit.** *Direct Participation:* You *are* the litterer. *Identifiable Harm:* Littering is tangible, immediate environmental harm and visual blight. *Collective Context:* Yes, but your specific act *is* the harm at that location.
  5.  **Not Rinsing Jar: ✓ Fit.** *Direct Participation:* Weak. You put it in recycling, but failure to rinse might make *that specific jar* unrecyclable? Unclear. *Identifiable Harm:* Extremely negligible and diffuse (potential contamination affecting a minuscule fraction of recycling). Feels like statistical noise. Exemption applies.
  6.  **Buying Sweatshop T-Shirt: ✓ Fit.** *Direct Participation:* Purchasing *is* directly funding/voting for the exploitative system. *Identifiable Harm:* Worker exploitation/suffering is concrete and identifiable (even if you don't see the specific victim). *Collective Context:* Yes, demand is collective, but your purchase is a direct link.
  7.  **Driving vs. Bus: ~ *Fit, explains mild guilt*.** *Direct Participation:* Choosing the car directly causes extra emissions *on that trip*. *Identifiable Harm:* Local air pollution/climate contribution is more tangible than the flight (localized effect, routine choice). *Collective Context:* Yes. **Why mild guilt?** Harm is less immediate/concrete than littering or sweatshops, but more tangible than the flight (local vs global, routine vs exceptional). Fits the principle's gradient.
  8.  **Leaving Faucet Running: ✓ Fit.** *Direct Participation:* Weak. You are wasting water. *Identifiable Harm:* In most developed areas with ample water, this is *genuinely negligible* and the harm (resource depletion/treatment energy) is extremely diffuse and abstract. Exemption applies. (If you lived in a drought area, guilt would likely kick in - identifiable harm).
  9.  **Roommate's Chips:** N/A - Interpersonal, not collective harm principle.

  **The Core Inconsistency You Must Resolve:** **The Burger vs. The Flight.** Your principle clearly identifies both as direct participation in collective harms (demand for meat / demand for air travel) contributing to identifiable harms (animal suffering / climate damage). Your gut absolves the flight because its harm feels abstract and your contribution insignificant. *The principle forces you to either:*
  *   **Conclude both are morally similar:** Accept that the flight *should* induce guilt comparable to the burger (even if it feels less intuitive), OR,
  *   **Conclude both are morally permissible:** Accept that negligible individual impact in a vast system means neither should induce strong guilt (undermining your burger guilt).
  *   **Refine the Principle:** Add a "**Personal Utility/Sacrifice**" clause (the flight had high personal value - seeing sister; the burger is routine pleasure). This patches the hole but risks justifying anything beneficial to you. *Your gut already hints at this with the car/bus guilt (low utility gain) vs. flight (high utility gain).*

  **Testing the Principle: The Fish Lake Case**

  *   **Scenario:** Lake limit 5 fish/person/day. 10,000 people each take 6. Population crashes.
  *   **Application:**
      *   *Direct Participation:* Yes. Your specific action of taking the 6th fish is a necessary step in exceeding the limit *collectively*.
      *   *Identifiable Harm:* Yes. The harm (population crash) is concrete, ecological, and directly traceable to the pattern of overfishing *of which your extra fish is a part*. You know your action type directly causes this harm.
      *   *Collective Context:* Yes.
      *   *Symbolism/Negligible?* No. While one fish is negligible, the *act of breaking the limit* is direct participation in the harmful pattern. Your specific 6th fish contributes to the *violation*, not just the abstract depletion. It feels like cheating a rule designed precisely to prevent this harm.
  *   **Verdict under Principle:** Wrong. You should feel guilt comparable to the littering or sweatshop shirt. This aligns with most people's intuition about such cases.

  **Conclusion & What You Believe:**

  You believe **it's wrong to directly and knowingly participate in a tangible harmful process, even as a small part of a collective action, where your specific contribution feels like a distinct, enabling act.** Symbolic actions or actions with genuinely negligible/untraceable impacts are permissible.

  *   **What fits:** Skipping vote (symbolic/ineffective), Tossing bottle (direct tangible harm), Not rinsing jar (negligible), Sweatshop shirt (direct participation in exploitation), Driving over bus (direct participation, mild tangible harm), Wasting water (negligible).
  *   **What forces a choice:** **The Burger vs. The Flight.** Your principle demands they be treated similarly. To be consistent, you must either:
      *   **Drop the Flight Exemption:** Accept that high-impact collective harms like flying *should* trigger guilt proportional to their impact (even if abstract), just like the burger triggers guilt despite negligible impact. *OR*
      *   **Drop the Burger Guilt:** Accept that negligible individual participation in vast systems (meat industry, air travel) means neither action is morally blameworthy in a strong sense (undermining your core feeling about the burger).
  *   **Most Plausible Resolution:** **Acknowledge the inconsistency and refine.** Your gut likely assigns weight to **proximity/tangibility of harm** (animal death feels immediate, climate change feels distant) and **perceived personal necessity/benefit** (seeing sister vs. routine meal). Incorporating these factors explicitly ("Direct Participation in *Tangible* Harm, Adjusted for Personal Necessity") makes your feelings coherent but less philosophically pure. The **Fish Lake** test confirms that direct rule-breaking for tangible harm triggers your guilt instinct strongly.

  Ultimately, your core ethic prioritizes avoiding complicity in *concrete, immediate harms* you feel personally responsible for enabling, even statistically. The flight's abstract, global harm and high personal utility break that feeling, creating the tension with the burger. To achieve full consistency, embracing guilt for the flight is the path most aligned with the principle derived from your *other* strong verdicts.
