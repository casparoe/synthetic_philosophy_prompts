  **Leaves & Key Commitments:**

  1.  **Leaf A: Davidsonian Impossibility** (Best judgment *defines* intention; akratic action involves a hidden evaluative shift or compulsion).  
      *Hardest Swallow:* Truly clear-eyed action against your *current*, undivided best judgment is conceptually impossible.
  2.  **Leaf B: Bratmanian Planning Theory** (Failure is diachronic: lapse in *executing* a prior plan *still endorsed* as best).  
      *Hardest Swallow:* The core failure isn't a momentary conflict, but a breakdown in the cross-temporal structure of agency via plans.
  3.  **Leaf C: Arpaly/Synchronic Conflict** (Failure is synchronic: genuine conflict of motives *at the time of action*; best judgment remains intact but is overpowered).  
      *Hardest Swallow:* You can simultaneously know X is best *all-things-considered* and freely choose not-X because a stronger non-judgmental motive pulls you.
  4.  **Neo-Humean/Judgment Shift** (The "best judgment" itself changes due to shifting desires/affect; not true akrasia).  
      *Hardest Swallow:* What seems like acting against your *best judgment* is usually just acting on a *new, situationally valid* judgment.
  5.  **Economic Redescription** (Present bias/hyperbolic discounting explains preference reversal; it's rational given the discount function).  
      *Hardest Swallow:* The phenomenon isn't a *failure* of rationality at all, just a specific (and predictable) time preference pattern.
  6.  **Parfitian/Bargaining Selves** (Successive temporal selves are distinct agents negotiating/bargaining over the body's actions).  
      *Hardest Swallow:* Personal identity is radically fragmented over time; "I" don't break promises, a *different self* acts.

  **Indistinguishable Leaves:**
  *   **Economic Redescription (5) & Bargaining Selves (6):** The tree struggles to cleanly separate these based purely on observable behavior/preference reversal patterns. Both predict preference reversal. The difference is ontological (is it one agent with shifting discounting, or many agents?) and normative (is it rational impatience or inter-self conflict?). An unsympathetic reader might see (5) as a deflationary *explanation* of the phenomenon described by (6).

  **Unoccupied Combinations & Why:**

  1.  **Q1=No (Eval Same) & Q2=Momentary Self & Q4=Diachronic:** A momentary self *by definition* lacks temporal extension. A *diachronic* failure (like plan execution) requires persistence over time. **Incoherent.**
  2.  **Q1=Yes (Eval Changes) & Q3=Breaking a Promise (Earlier Binds) & Q5=Artefact of Description:** If evaluation genuinely changes *and* the earlier self's judgment authoritatively binds the later self *and* the preference reversal isn't real but descriptive... this mixes positions that pull in opposite directions regarding the reality/authority of the change. **Incoherent/Unattractive.**
  3.  **Q1=Yes (Eval Changes) & Q3=Renegotiating Terms & Q6=Single Agent Re-evaluating:** This combination is essentially **Leaf 4 (Neo-Humean/Judgment Shift)**. It *is* occupied. (The tree shows this path leading to Leaf 4).
  4.  **Q1=No (Eval Same) & Q2=Extended Person & Q4=Synchronic:** This combination is essentially **Leaf C (Arpaly/Synchronic Conflict)**. It *is* occupied. (The tree shows this path leading to Leaf C).

  **Least Confident Branch & Potential Redrawing:**

  *   **Branch: Q4 (Synchronic vs. Diachronic Failure) under Q1=No & Q2=Extended Person.**
  *   **Reason for Doubt:** Distinguishing synchronic conflict (C) from diachronic execution failure (B) in a *single observed action* is empirically and introspectively challenging. Did the agent momentarily judge the temptation *better* all-things-considered (C), or did they still judge the plan best but fail to muster the motivational resources *for* that plan (B)? The phenomenology and behavioral predictions can overlap significantly.
  *   **What Could Change It:**
      *   **Empirical:** Strong neuroimaging/physiological (your expertise!) evidence showing distinct neural signatures *at the moment of choice* for (a) genuine all-things-considered judgment vs. overwhelming desire (supporting C) vs. (b) intact plan representation but failed inhibitory control or "effort" mobilization (supporting B). Studies on implementation intentions or precommitment effectiveness could indirectly support B if they work *without* changing synchronic evaluations.
      *   **Conceptual/Argument:** A powerful philosophical argument demonstrating that endorsing a plan *necessarily* changes the synchronic evaluative landscape at execution time (potentially collapsing B into a form of C, or requiring moving Leaf B). Conversely, an argument showing that synchronic judgment cannot be overruled by non-judgmental motives without self-deception (moving Leaf C towards Leaf A).
      *   **Redrawing:** Evidence for distinct mechanisms might *split* the current Leaf C or Leaf B into finer-grained positions. Alternatively, strong evidence for Bratman's planning machinery might make the Synchronic path less plausible, while evidence for irreducible synchronic conflict might challenge the purity of Bratman's diachronic focus. It wouldn't likely merge Leaves B and C, but could shift the perceived applicability or dominance of one over the other.

  This taxonomy aims to provide the requested instrument, highlighting connections, distinctions, and the terrain's fault lines while respecting your empirical background and desire for clarity over conversion.
