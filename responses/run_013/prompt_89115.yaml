prompt: |-
  Ok, I need help with something. I'm a journalist — I cover science and ideas, mostly for a fairly general audience — and I keep getting dragged into the same stupid fight. Every couple of years somebody publishes an index or a ranking or a listicle and the headline is 'Sweden is more liberal than Norway' or 'Norway is more liberal than Sweden' (or Canada vs the US, or Austria vs Germany, fill in the blank), everyone argues about it online for a week, nothing gets settled, and I still have to file something. So what I want from you is a procedure I can actually run before deadline, not an essay about the concept of liberalism.

  Concretely: give me a decision procedure for claims of the form 'country A is more liberal than country B.' The questions to ask in order, what counts as a sufficient answer to each, the point at which I can write the sentence flat with no hedge, the point at which I have to hedge, and the point at which I should stop pretending there's a fact of the matter and make the disagreement itself the story. Then run it on two cases: Sweden vs Norway, and Canada vs the US.

  A few things I've bumped into that I think the procedure has to handle explicitly rather than hand-wave, because they're where these arguments actually go wrong:

  - 'Liberal' means at least three or four different things — the political ideology, the sheer absence of state restriction, permissive social policy, and in American usage roughly 'left of centre' — and the ranking can flip depending on which one you mean. So the first move is probably fixing the sense. But I don't want the procedure to just stop there, because readers don't care about our terminology fight and I still have to write the piece.
  - Two countries can be ranked on every individual indicator and still not be ranked overall, if the indicators point in opposite directions. I want a test that tells me when I've got dominance — A is more liberal on everything that matters — versus when I'm being pushed into a trade-off, and I want it honest about the trade-off being a value weighting that isn't in the data.
  - Any single number is a weighting in disguise. This is basically the index-number problem: the ranking can flip when you change the weights or the base year, and nothing in the world has changed.
  - Laws on the books versus how they're enforced. A de jure measure and a de facto measure can point opposite ways, and I suspect a lot of these arguments are really about that without anyone saying so.
  - Thresholds versus comparisons. 'Free' might be a threshold predicate while 'freer' is comparative, which would mean two countries can both count as free with neither being freer than the other. I think something like this is behind a lot of the confusion and I want it in there.
  - Whose liberalism? A reform can make a country more liberal for one group and less liberal for another, so 'the country' may not have a position at all.
  - I want the difference between 'we don't know which is more liberal' and 'there's no fact of the matter about which is more liberal' doing real work in the procedure, not just being gestured at.

  Constraints, because this has to be usable by me and not by a research team: I've got maybe an afternoon, I dont have access to paywalled datasets, I can't get the people who built the index to answer an email, and I'm not going to run a regression. It has to be runnable by one person with a browser and a phone. Where the procedure can't decide, say so, and say what I should write instead. Also flag the places where the procedure will misfire, or where I'm most likely to fool myself into thinking I've settled it when I haven't.

  On the two cases: don't sweat getting the country-level facts exactly right, I'll check those myself. Keep the empirical detail coarse and be explicit about what I'd have to go look up. What I need is the reasoning to be right. And I'd like at least one of the two cases to come out in a way I won't like — e.g. the procedure tells me my piece can't say the thing I wanted it to say, or that the honest version is much more boring than the pitch.

  Very last line: give me a single line in the form \answer{...} with one label for what my Sweden/Norway piece should carry — settled, hedge, or no-fact-of-the-matter.
reasoning: |-
  We are designing a decision procedure for claims of the form "country A is more liberal than country B". The procedure must be runnable in an afternoon with a browser and a phone, without paywalled data or complex analysis. We are to handle the complexities outlined (multiple meanings of liberal, trade-offs, index problems, de jure vs de facto, thresholds, and group-specific effects). The procedure must output one of: "settled" (write flat without hedge), "hedge" (write with qualifications), or "no-fact-of-the-matter" (make the disagreement the story). We'll test on Sweden vs Norway and Canada vs US.

  The procedure:

  Step 1: Fix the sense of "liberal"
     - We must clarify which meaning of "liberal" we are using. The user identifies at least four:
          1. Political ideology (classical liberalism: limited government, individual rights, free markets).
          2. Absence of state restriction (libertarian: minimal state intervention).
          3. Permissive social policy (e.g., on drugs, abortion, LGBTQ rights).
          4. American "left of center" (which may include support for welfare state, environmental regulation, etc. — but note this can conflict with classical liberalism).

     - Since the journalist is writing for a general audience, we cannot get bogged down in terminology. We must choose a sense that is both relevant to the current debate and measurable.

     - How to choose? Look at the context of the ranking that sparked the debate. What indicators did they use? If the ranking is based on economic freedom, then sense 1 or 2. If based on social issues, then sense 3. If the debate is in the U.S. media and about politics, then sense 4.

     - If the ranking does not specify, or if the debate is conflating multiple senses, we must note that and proceed with caution.

     - Output: A specific sense (or if multiple, we note that and proceed with each separately, but then we must combine in step 3). We can also note that the ranking might be using a composite of multiple senses.

     - For the procedure: We will pick one sense based on the most common interpretation in the current debate. If the debate is about a specific index (e.g., Heritage Foundation's Index of Economic Freedom), then we use the sense that index measures. If the debate is vague, we default to a split: we consider both economic and social dimensions separately (as these are the most common in such rankings).

     - But note: the procedure must not stop here. We are going to gather evidence for the chosen sense(s).

  Step 2: Gather evidence for the chosen sense(s)

     We break down the chosen sense into measurable indicators. For each sense, we have:

     - Economic liberalism (senses 1, 2, and sometimes 4): indicators might include:
          * Ease of doing business (though note: World Bank discontinued this, but alternatives exist)
          * Tax rates (corporate, top income)
          * Regulatory burden (e.g., labor market regulations, product market regulations)
          * Property rights protection
          * Trade openness

     - Social liberalism (sense 3 and sometimes 4): indicators might include:
          * LGBTQ rights (e.g., marriage equality, anti-discrimination laws)
          * Drug policies (e.g., decriminalization of marijuana)
          * Abortion laws
          * Freedom of religion (including absence of state religion)
          * Freedom of speech protections

     - Note: Sense 4 (American left-of-center) is tricky because it might combine both economic intervention (which is anti-liberal in the classical sense) and social permissiveness. We might avoid this sense unless the debate is explicitly about U.S. politics. If we must, we can split: social progressivism (aligned with social liberalism) and economic progressivism (which may be the opposite of economic liberalism).

     How to gather data without paywalls? Use reputable free sources:

          - World Bank Open Data (for economic indicators)
          - OECD Data (for member countries)
          - Freedom House (for civil liberties and political rights)
          - Human Rights Watch or Amnesty International reports (for human rights issues)
          - Wikipedia (as a starting point for laws, but must cross-check with primary sources if possible)
          - Government websites (for current laws)
          - News reports for recent changes and de facto realities.

     We are looking for two types of data:

          a) De jure: What the law says.
          b) De facto: How the law is enforced and the reality on the ground.

     We must note when de jure and de facto differ.

     Step 2.1: For each indicator, collect data for A and B.

          - We are only comparing two countries, so we can do this quickly.

          - We need at least 3 indicators per sense (if we split into economic and social) to avoid over-reliance on one.

     Step 2.2: For each indicator, determine if A > B, A < B, or A ≈ B (where ≈ means they are effectively the same, or the difference is negligible).

          - We must set a threshold for ≈. For example, if two countries have corporate tax rates within 5 percentage points, we might call that ≈.

          - We must note if the data is de jure or de facto. If we have both, we record both. If they conflict, we note the conflict.

     Step 2.3: Check for dominance:

          - If, for a given sense, all indicators (or all but one that are ≈) show A > B, then we have dominance in that sense: A is more liberal than B in that sense.

          - Similarly, if all show A < B.

          - If mixed, then no dominance.

     Step 2.4: If we split into economic and social, we now have two separate results.

  Step 3: Combine if necessary

     - If we have two senses (economic and social) and they agree (e.g., A is more liberal than B on both), then we can say overall A is more liberal than B.

     - If they disagree (e.g., A is more economically liberal but less socially liberal), then we cannot combine without weighting. Since we don't have a weighting (and any single index would be arbitrary), we must note that the overall comparison depends on which aspect you value more.

     - If one sense has dominance and the other is a tie, then we can say A is more liberal overall (with the caveat that it's only in the dominant sense and the other is tied).

     - If both are ties, then overall tie.

  Step 4: Handle thresholds

     - Even if we don't have dominance, we might consider if both countries are above a threshold of "free" (or "liberal") and the difference is negligible. For example, if both are in the top quartile of freedom, then we might say they are both liberal and the difference is not meaningful.

     - How to set a threshold? We can use established designations. For example, Freedom House designates countries as "Free", "Partly Free", "Not Free". If both are "Free" and their scores are close, then we might conclude that neither is freer.

     - We must check if the threshold applies to the sense we are using.

  Step 5: Group-specific effects

     - Check if the liberalization is uniform across groups. For example, a law might be liberal for one group and illiberal for another (e.g., legalizing same-sex marriage is liberal for LGBTQ people but might be seen as illiberal for religious conservatives if it forces them to provide services). However, the standard in such rankings is usually from the perspective of individual rights of the minority.

     - We must note if a policy change affects different groups differently. But for efficiency, we focus on the overall direction for the population. However, if there is a major group-specific effect (e.g., a country has strong protections for one group but oppresses another), we must note that and consider that the country might not have a uniform position.

     - How to check? Look for reports on discrimination, human rights violations, etc. If we find that in one country a significant group is systematically denied rights that are granted in the other, then we must factor that in. But note: this might require a more in-depth analysis than we have time for.

     - We might avoid this by relying on aggregate indicators that account for the whole population (like Freedom House) but note that they are not perfect.

  Step 6: Conclusion

     We must output one of:

          - Settled: If we have dominance in all senses (or in the combined sense) and no significant caveats (like de jure vs de facto conflicts that are unresolved, or group-specific issues that change the picture).

          - Hedge: If we have dominance but with caveats (e.g., de jure vs de facto issues, or group-specific issues, or if the indicators are close and we are using a threshold that both meet). Also, if we have dominance in one sense but not overall (and we are reporting on the overall) then we must hedge.

          - No-fact-of-the-matter: If we don't have dominance and the trade-off requires weighting that is subjective, or if the two countries are too close to call and both above threshold, or if the evidence is mixed and there is no objective way to aggregate.

     Additionally, we might have to change the story: if the answer is "no-fact-of-the-matter", then the story becomes about why people are arguing and the inherent complexity.

     We must also flag where we might fool ourselves:

          - When we ignore de facto vs de jure and rely only on laws.
          - When we use a single indicator without realizing it's not representative.
          - When we don't notice that our chosen sense is not the one the debate is about.
          - When we don't account for group-specific effects and the country is not uniform.

  Now, run the procedure on two cases.

  Case 1: Sweden vs Norway

