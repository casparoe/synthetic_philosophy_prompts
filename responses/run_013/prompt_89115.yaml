answer: |-
  Below is a step-by-step decision procedure designed for your constraints. It addresses the core challenges you identified (multiple definitions, trade-offs, index problems, de jure vs. de facto, thresholds, group-specific effects, and epistemic uncertainty) and outputs one of three conclusions: **settled** (write a flat claim), **hedge** (qualify the claim), or **no-fact-of-the-matter** (make the disagreement the story). The procedure is structured as a flowchart with explicit tests, exit points, and reliability flags. I'll first outline the procedure, then apply it to Sweden vs. Norway and Canada vs. US.

  ---

  ### **Decision Procedure for "Country A is More Liberal Than Country B"**
  **Time budget:** 3–4 hours max (browser/phone only).  
  **Data sources:** World Bank Open Data, OECD Library, Freedom House, UN Human Rights Reports, Wikipedia (cross-referenced with official govt sites), and recent news.  
  **Core rule:** Stop and conclude when any step returns a definitive answer. Proceed only if unresolved.

  #### **Step 1: Define "Liberal" (15 min)**  
     - **Action:** Check the source of the debate (e.g., Heritage Index vs. Social Progress Index). If the source defines "liberal," use their definition. If not, default to splitting into two distinct senses:  
       - **Economic liberalism:** Low state intervention (taxes, regulation, property rights).  
       - **Social liberalism:** Permissive policies (LGBTQ+, abortion, drugs, free speech).  
       - *Explicitly discard* American "left-of-center" (too context-dependent) and pure ideology (unmeasurable quickly).  
     - **Exit if:** The debate uses conflicting senses (e.g., one side cites economic, the other social). → **Hedge** ("depends on what 'liberal' means").  
     - **Reliability flag:** If senses are conflated in public debate, you’re already in hedge territory. Proceed to Step 2 but expect ambiguity.

  #### **Step 2: Gather Dominance Evidence (1–2 hr)**  
     - **Action:** For each sense (economic/social), pick 3–5 indicators (2 de jure, 2 de facto). Sources:  
       - *Economic:* OECD tax rates, World Bank regulatory quality, Heritage Index summaries (free snippets), news on enforcement.  
       - *Social:* Freedom House scores, UN human rights reports, laws via government sites, news on implementation gaps.  
       - **Test for dominance:** For each indicator, label A > B, A < B, or A ≈ B (difference < 10% or within margin of error).  
          - Dominance exists only if **all** non-≈ indicators agree (A > B or A < B).  
          - If mixed (no dominance), proceed to Step 3.  
     - **Exit if:**  
       - Clear dominance in one sense → **Settled** for that sense (e.g., "Sweden is more economically liberal").  
       - Dominance in both senses agreeing → **Settled** overall.  
       - Dominance in one sense, tie in the other → **Hedge** ("more economically liberal but socially similar").  
     - **Reliability flags:**  
       - De jure vs. de facto conflicts void dominance (e.g., laws say one thing, enforcement says another).  
       - Single-number indices (e.g., Freedom Index) are rejected here—they hide weightings. Use component data.

  #### **Step 3: Check Thresholds and Trade-offs (30 min)**  
     - **Action:** If no dominance in Step 2:  
       - **Threshold test:** Are both countries above a "free" threshold? Use Freedom House (≥75/100 = "Free") for social; OECD regulation index (top 25%) for economic. If both above threshold and differences are ≈, → **Hedge** ("both highly liberal; differences negligible").  
       - **Trade-off test:** If one sense favors A and the other B (e.g., A economically > B but socially < B), → **No-fact-of-the-matter** (no objective weighting).  
     - **Exit if:** Trade-off or thresholds met → **Hedge** or **No-fact-of-the-matter**.  
     - **Reliability flag:** Thresholds are arbitrary—don’t use them to "force" a tie.

  #### **Step 4: Group-Specific Effects (30 min)**  
     - **Action:** If not yet concluded, sample 2–3 groups (e.g., women, ethnic minorities, LGBTQ+). Check:  
       - Do policy impacts *directionally align*? (e.g., abortion access helps women; drug decriminalization helps marginalized groups).  
       - Use HRW/Amnesty reports for disparities (e.g., "de jure equality but de facto discrimination in policing").  
     - **Exit if:**  
       - Impacts conflict (e.g., policy X liberates Group Y but restricts Group Z) → **No-fact-of-the-matter** ("liberal for whom?").  
       - Impacts align but still no dominance → Return to Step 3.  
     - **Reliability flag:** Easy to miss group impacts with coarse data—prioritize high-profile issues (e.g., racial justice in US).

  #### **Step 5: Final Epistemic Check (15 min)**  
     - **Action:** If still unresolved, ask:  
       - Is uncertainty due to *missing data* ("we don’t know")? → **Hedge** ("evidence is incomplete").  
       - Is uncertainty due to *fundamental ambiguity* ("no fact of the matter")? → **No-fact-of-the-matter**.  
     - **Heuristic:** Ambiguity arises from trade-offs, group conflicts, or sense-mixing; missing data is sparse/inconclusive evidence.

  ---

  ### **Application to Cases**
  **Constraints honored:** Public data only, no deep dives. Facts are illustrative (you’ll verify).  
  **Goal:** One case "boring" (Sweden/Norway), one "frustrating" (Canada/US).

  #### **Case 1: Sweden vs. Norway**  
  - **Step 1:** Debate source = generic index (e.g., "social freedom rankings"). Split into economic/social senses.  
  - **Step 2:**  
    - *Economic indicators (de jure/de facto):*  
      - Corporate tax: Sweden 20.6% vs. Norway 22% → Sweden > Norway.  
      - Labor regulation: OECD strictness index ~1.2 (both) → ≈.  
      - Property rights: WEF scores 5.8 (SE) vs. 5.7 (NO) → ≈.  
      - *Verdict:* No dominance (one >, two ≈).  
    - *Social indicators:*  
      - LGBTQ+ rights: Both allow marriage/adoption → ≈.  
      - Abortion: Sweden (on demand <18w) vs. Norway (on demand <12w, approval <18w) → Sweden > Norway (de jure).  
      - Drug decriminalization: Neither (both de facto tolerant) → ≈.  
      - *Verdict:* No dominance (one >, two ≈).  
  - **Step 3:**  
