          Three out of four: Sweden is more liberal on three indicators, Norway on one. No dominance? But note: top income tax is a marginal rate and might not be representative of the overall tax burden. Also, we have both de jure (tax rates) and de facto? Not much difference in enforcement.

          However, note: the top income tax rate in Sweden is applied at a lower income threshold than in Norway? We don't have time to check progressivity. So we'll call it: no dominance in economic liberalism.

     Social liberalism indicators:

          - Same-sex marriage: Both legalized in the 2010s (Sweden 2009, Norway 2009). → ≈

