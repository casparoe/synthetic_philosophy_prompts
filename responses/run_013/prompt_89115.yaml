              → Sweden is more open → more liberal.

          So: 
            Corporate tax: Sweden (20.6) < Norway (22) → Sweden more liberal.
            PMR: Sweden (1.23) < Norway (1.45) → Sweden more liberal.
            Top income tax: Norway (47.8%) < Sweden (52%) → Norway more liberal.
