prompt: |-
  I teach Parfit's hitchhiker every year, which is probably how I ended up on this committee. I'm on our university's IT and Information Risk committee, and I have to write the memo that goes out before Thursday's meeting.

  Here's the mess. Six weeks ago the hospital side got hit. Imaging, scheduling and a big chunk of the research data are encrypted, and they also walked off with patient records -- a few hundred files that include HIV status and several names from a study on a stigmatized condition. They want 1.8 million in crypto by Friday noon, and they've already dumped a sample batch to prove they mean it. The provost wants a recommendation on whether to authorize the payment. Separately, the commitee has been circling for about a year on whether we should adopt a standing no-pay policy; we're the last school in our peer group without one.

  What makes this interesting to me is that it's Parfit's hitchhiker at institutional scale. Individually, in the room, on Friday, paying is obviously the better move: we get the decryptor, they promise to delete the files, the threats stop. Collectively, if every institution reasons that way, the payments fund the industry and the attacks keep coming, and all of us -- us included -- would have been better off if none of us ever paid. The hitchhiker's fix wasn't to reason better at the moment of decision. It was to be the sort of person whose promise is worth something in the first place, which is a property you have to have before you need it.

  So: a decision memo, two pages max, they will not read more. It needs an actionable bottom line. Specifically: (1) a concrete recommendation on Friday's demand and on the standing policy -- adopt, adopt with conditions, or don't -- with a time frame; (2) the mechanism spelled out well enough that we could actually vote on wording: who is bound (the university, the hospital, the subsidiaries, the individual labs that hold their own data), whether the policy is public or internal, what the escape hatch is and who can pull it, when it gets reviewed; and (3) the best argument on the other side treated honestly rather than as a speed bump. The best argument against my instinct isn't a cost-benefit one, it's that refusing to pay imposes a real, concentrated cost on identifiable people who didn't choose any of this -- patients about to have their diagnoses published -- in exchange for a diffuse benefit to future strangers. I want that stated at full strength and then either answered or conceded, not waved away.

  Two things I'd rather you do than not. First, tell me which parts of the recommendation you actually believe and which are guesses about attacker behavior -- whether a public no-pay pledge really deters, or just advertises us as a target with nothing left to lose. Confidence levels, not hedges. Second, our CISO keeps pushing a bond idea: we deposit, say, five million with a consortium of peer institutions in escrow, forfeited to the others if we ever pay a ransom. It makes the pledge credible the way the hitchhiker's character makes his promise credible. Assess whether that's a real commitment device or a stunt that just hands our decision to whoever holds the escrow, and whether it survives the case where a life is on the line -- because if it works as advertised, it means the people in the room on Friday can't do the humane thing even when they should.

  And if the Parfit framing is just decoration here -- if institutions aren't the kind of thing that can have a character, and this is really a security-economics problem with some decision theory bolted on -- say so in the first paragraph instead of writing me a memo that pretends otherwise. I'd rather hear it from you now than from the general counsel on Thursday. No citations needed, obviously; footnotes are wasted on this crowd.
reasoning: |-
  Okay, let me unpack this professor's request. They're facing a real institutional dilemma with the ransomware attack, and they need a practical memo that also grapples with deep ethical questions. The Parfit's hitchhiker analogy is central to their thinking - that individual rationality leads to collective disaster unless pre-commitment exists. 

  Hmm, the core tension is between immediate humanitarian concerns (protecting patients whose data is about to leak) versus systemic consequences (funding the ransomware ecosystem). The professor specifically wants the counterargument about imposing concentrated harms on identifiable victims stated strongly, not minimized. That's ethically rigorous of them.

  The practical components are complex: an immediate payment decision by Friday, plus a long-term institutional policy. The bond idea from their CISO is fascinating - it attempts to create the "character" Parfit describes through financial mechanics. But I wonder if it just shifts the dilemma to the escrow consortium. 

  The professor's skepticism about institutional "character" feels important. Organizations aren't moral agents like people, so we need mechanisms that simulate commitment. The bond might work if designed right, but only for marginal cases - true emergencies would still require override mechanisms. 

  On deterrence: evidence suggests public no-pay policies work when credible, but increase initial targeting. The key is making the commitment believable through layered security and the bond idea. Though in this acute crisis, paying now might be necessary to protect vulnerable patients, however morally hazardous that is.

  For the memo structure: I'll start by addressing the Parfit framing directly, then separate the immediate decision from the long-term policy. The bond deserves serious analysis - it's clever but has governance risks. The counterargument about patient harm needs its own section before being addressed through phased policy implementation. 

  Most importantly, the professor wants confidence levels, not waffling. So I'll state clearly: paying now is probably necessary (75% confidence), while adopting a no-pay policy with bond escrow is the right long-term play (80% confidence on deterrence, but only 50% on the bond's workability in true crises).
answer: |-
  **MEMORANDUM**  
  **TO:** IT and Information Risk Committee  
  **FROM:** [Your Name/Committee Member]  
  **DATE:** [Date Prior to Thursday Meeting]  
  **SUBJECT:** Recommendation on Ransomware Payment & Standing No-Pay Policy  

  ---

  ### I. EXECUTIVE SUMMARY  
  We face an immediate ransom demand (**$1.8M by Friday**) and a strategic policy question. **Recommendation:**  
  1. **Pay the ransom** to mitigate imminent harm to patients.  
  2. **Adopt a standing no-pay policy**, effective immediately after this incident, with a binding consortium escrow mechanism.  
  3. **Review policy** biannually, with an ethical override panel for emergencies.  

  ---

  ### II. PARFRAMING: THE INSTITUTIONAL DILEMMA  
  The Parfit’s Hitchhiker analogy applies: *Individually*, paying halts immediate harm. *Collectively*, paying fuels the ransomware ecosystem. **Institutions lack "character"**—they require *enforceable pre-commitments* to resist short-term incentives. This is a security-economics problem demanding mechanical solutions, not moral philosophy.  

  ---

  ### III. IMMEDIATE RECOMMENDATION: PAY THE RANSOM (WITH CAVEATS)  
  **Action:** Authorize payment by Friday’s deadline.  
  **Why:**  
  - Concentrated, irreversible harm to identifiable patients (HIV status/stigmatized conditions) outweighs diffuse future risks.  
  - Decryption likely restores critical hospital systems (Imaging/Scheduling).  
  **Caveats:**  
  - Payment ≠ data safety. Assume leaked data exists; notify affected patients immediately.  
  - Coordinate with FBI/Cyber Command.  

  > **Confidence Level:** 90% on harm mitigation; 40% on attacker deletion promise.  

  ---

  ### IV. STANDING NO-PAY POLICY: ADOPT WITH BINDING MECHANISM  
  **Recommendation:** Adopt policy covering **all university entities** (Hospital, Subsidiaries, Individual Labs).  
  #### A. Core Policy Mechanics  
  | Component               | Specification                                                                 |  
  |-------------------------|-------------------------------------------------------------------------------|  
  | **Bound Parties**       | University, Hospital, Subsidiaries, Labs (via Data Governance Agreements).    |  
  | **Public Stance**       | Public pledge: "We do not pay ransoms."                                       |  
  | **Escape Hatch**        | 3-Person Panel (CISO, General Counsel, Bioethics Chair) can authorize payment *only* if: <br> - Human life is directly threatened, *and* <br> - Attack exploits a ≤24-hr critical system flaw. |  
  | **Review Cycle**        | Biannually, with threat intelligence report.                                  |  

  #### B. The Bond Escrow Mechanism (CISO’s Proposal)  
  - **How it works:** Deposit **$5M** in a peer consortium escrow. Forfeit funds if we pay a ransom without panel approval.  
  - **Assessment:**  
    - 👍 **Credible deterrent** (80% confidence): Raises attacker’s cost to probe/test us; signals irreversible commitment.  
    - 👎 **Key flaw:** Shifts decision to escrow holders in crises. *Solution:* Escrow forfeiture triggers only if panel *and* consortium agree payment violated policy.  
    - **Survives "life on the line"?** Yes—panel override exists. Funds are forfeited only if override is misused.  

  > **Confidence Level:** 70% on deterrence; 50% on consortium governance feasibility.  

  ---

  ### V. THE CORE COUNTERARGUMENT (STATED AT FULL STRENGTH)  
  **"Refusing to pay sacrifices real victims for abstract futures."**  
  - Patients face stigma, discrimination, and trauma if data leaks. They did not choose this risk.  
  - Paying protects them; refusing pays an "ethics tax" with their well-being to benefit strangers.  
  - A no-pay policy makes our institution complicit in foreseeable, targeted harm.  

  **Response:**  
  1. **Concede the ethical weight.** This is why we pay *now*.  
  2. **But future victims are also real.** Each payment finances attacks on other hospitals, labs, and vulnerable populations.  
  3. **Mechanical solution:** The policy’s escape hatch prioritizes human life. The bond forces rigor on override use.  

  ---

  ### VI. RISKS & UNKNOWNS  
  - **Public pledge:** 60% confidence it *deters* (lowers long-term attacks); 80% confidence it *invites* initial attacks. Mitigate via layered security audits.  
  - **Bond feasibility:** Requires 3+ peer institutions. Start with a memorandum of understanding by Q1.  
  - **Attacker behavior:** Post-policy, expect increased "proof of harm" leaks (e.g., smaller data dumps).  

  ---

  ### VII. ACTIONABLE BOTTOM LINE  
  1. **Vote to authorize ransom payment** by Friday, 12 PM.  
  2. **Adopt standing no-pay policy** with:  
     - Full institutional coverage.  
     - Ethical override panel.  
     - Consortium bond escrow (feasibility plan due in 90 days).  
  3. **Task CISO/General Counsel** with drafting binding language for labs/subsidiaries by next meeting.  

  ---  
  **"Character is what you do when no one is looking. Institutional character is what you bind yourself to do when everyone is watching."**  
