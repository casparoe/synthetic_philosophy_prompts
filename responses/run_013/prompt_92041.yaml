answer: |-
  ### Consent Validity Decision Tree  
  *Classify positions based on concrete case judgments. Each branch forces a choice between views that otherwise share premises.*

  ---

  ### **Stage 1: Classification Dimensions**  
  Three dimensions structure the tree:  
  1. **Nature of Consent**: Is validity grounded in a *psychological state* (will), a *communicative act*, or *both*?  
  2. **Coercion Threshold**: Does coercion void consent? If so, when? Options:  
     - Always voids  
     - Voids only if the threat crosses the agent’s *moral baseline* (e.g., worsening position)  
     - Never voids (makes act wrong for other reasons)  
     - Degrades but does not void  
  3. **Deception Scope**: Does deception void consent? If so, when? Options:  
     - Only if it concerns the *identity/physical nature* of the act  
     - If it *would change the decision* (regardless of subject)  

  **Possible Combinations & Occupancy**:  
  - Psychological + Moral-baseline coercion + Identity-only deception → **Occupied**  
  - Psychological + Degraded coercion + Identity-only deception → **Occupied**  
  - Communicative + Moral-baseline coercion + Decision-change deception → **Occupied**  
  - Communicative + Coercion never voids + Identity-only deception → **Occupied**  
  - Dual-nature + Moral-baseline coercion + Decision-change deception → **Occupied**  
  - Psychological + Coercion always voids + Decision-change deception → **Unoccupied** (incoherent: if coercion always voids, decision-change deception is redundant)  
  - Communicative + Degraded coercion + Decision-change deception → **Unoccupied** (unexplored: no major theory pairs communicative focus with graded coercion)  
  - *Other combinations map to leaves below*.

  ---

  ### **Stage 2: Decision Tree**  
  *Start at the top branch. Cases in bold.*  

  #### **Node 1: Case 5**  
  B says "yes" to sex while not wanting it, or wants it while saying "no." Is consent valid?  
  - **No, validity requires matching will and words** → Node 2 (Dual-nature consent)  
  - **Yes, if words are clear** → Node 3 (Communicative consent)  
  - **Yes, if will is present** → Node 4 (Psychological consent)  

  #### **Node 2 (Dual-nature): Case 3**  
  A did not cause B’s harm (e.g., illness) and offers to cure it for a price B pays. Valid consent?  
  - **Yes** → Node 5  
  - **No** → **Leaf: Hybrid Baseline-Sensitive** (Coercion voids if threat crosses moral baseline; deception voids if decision-changing)  

  #### **Node 3 (Communicative): Case 9**  
  A threatens something trivial (e.g., "I’ll frown if you refuse"), B has no better option, and agrees. Valid?  
  - **Yes** → **Leaf: Pure Performative** (Coercion never voids consent; deception voids only if about act’s identity)  
  - **No** → **Leaf: Communicative Moral Baseline** (Coercion voids if threat crosses moral baseline; deception voids if decision-changing)  

  #### **Node 4 (Psychological): Case 4**  
  A first worsens B’s position (e.g., damages property), then offers to restore it for a fee worse than B’s original state. Valid?  
  - **Yes** → Node 6  
  - **No** → **Leaf: Will-Based Coercion-Sensitive** (Coercion voids if threat crosses moral baseline; deception voids if decision-changing)  

  #### **Node 5 (Dual-nature, Case 3=Yes): Case 1**  
  Surgeon omits 1/10,000 risk; patient would have consented anyway. Valid?  
  - **Yes** → **Leaf: Dual-Nature Narrow Deception** (Deception voids only if about act’s identity/nature)  
  - **No** → **Leaf: Unnamed** (Consent requires dual elements; coercion voids only if baseline crossed; deception voids if decision-changing)  

  #### **Node 6 (Psychological, Case 4=Yes): Case 8**  
  B’s preference stems from long dependency (e.g., abusive relationship). Defect in consent or situation?  
  - **In consent** → **Leaf: Strict Will-Based** (Coercion always voids consent; deception voids if decision-changing)  
  - **In situation** → **Leaf: Graded Will-Based** (Coercion degrades but does not void consent; deception voids if decision-changing)  

  ---

  ### **Leaves Summary**  
  1. **Hybrid Baseline-Sensitive** (Dual-nature; coercion voids if moral baseline crossed; deception voids if decision-changing)  
  2. **Pure Performative** (Communicative; coercion never voids; deception voids only if about act identity)  
  3. **Communicative Moral Baseline** (Communicative; coercion voids if moral baseline crossed; deception voids if decision-changing)  
  4. **Will-Based Coercion-Sensitive** (Psychological; coercion voids if moral baseline crossed; deception voids if decision-changing)  
  5. **Dual-Nature Narrow Deception** (Dual-nature; coercion voids if moral baseline crossed; deception voids only if about act identity)  
  6. **Unnamed** (Dual-nature; coercion voids if baseline crossed; deception voids if decision-changing)  
  7. **Strict Will-Based** (Psychological; coercion always voids; deception voids if decision-changing)  
  8. **Graded Will-Based** (Psychological; coercion degrades but does not void; deception voids if decision-changing)  

  *Unoccupied branch:* Psychological + Coercion always voids + Decision-change deception → **Incoherent** (if coercion *always* voids consent, requiring deception to *also* void it is redundant).  

  ---

  ### **Indistinguishable Pairs & Separating Cases**  
  The tree cannot distinguish:  
  - **Strict Will-Based (Leaf 7) vs. Will-Based Coercion-Sensitive (Leaf 4)**  
    - **Disagreement:** Rationale only. Both hold consent is psychological and deception voids if decision-changing, but Leaf 7 sees *all* coercion as voiding, while Leaf 4 requires crossing a moral baseline.  
    - **Separating case:** *Case 4* (A worsens B’s position, then offers restoration). Leaf 4 says "no" (coercion crosses baseline), Leaf 7 says "no" (any coercion voids) → no divergence. Use: **"A threatens to reveal B’s secret unless B pays; B pays."** Leaf 4 may validate (no baseline crossed), Leaf 7 voids (coercion always voids).  

  - **Graded Will-Based (Leaf 8) vs. Pure Performative (Leaf 2)**  
    - **Disagreement:** Rationale only. Both *validate* consent in trivial-threat cases (Node 3: Case 9=Yes), but Leaf 8 treats coercion as degrading (psychological flaw), while Leaf 2 ignores will (communicative act).  
    - **Separating case:** *Case 5* (yes without wanting). Leaf 8 voids (will absent), Leaf 2 validates (words clear). Already in Node 1.  

  ---

  **Tree Stats:** 8 leaves, 6 branch nodes. All cases used:  
  - Case 1 at Node 5, Case 2 unused (covered by deception scope in leaves), Case 3 at Node 2, Case 4 at Node 4, Case 5 at Node 1, Case 6 unused (covered by Node 2/5), Case 7 unused (temporal revocation subsumed under nature of consent), Case 8 at Node 6, Case 9 at Node 3.  
  *Added case: None needed; unused cases resolve rationale disagreements.*
