prompt: |-
  I spent about 35 years as a bench scientist before I retired, and the last couple of years I've been reading philosophy, mostly ethics and a bit of philosophy of language, and I've gotten stuck on something I used to think was simple. Everyone knows lying is wrong. But a lot of what I did over a long career was technically not lying, and I've started to wonder whether that's a real distinction or just a lawyer's distinction I used to make myself feel better about myself. I want you to tell me what principle, if any, actually fits my gut reactions, because I've stopped trusting my own summary of them.

  Here's the view I walked in with, which I don't think survives contact with my own cases. Lying = saying something false on purpose. Misleading = saying something true in a way that gets someone to believe something false. Lying is worse. Simple. Now the cases.

  - Grant renewal, pilot data had come out null, and I wrote "our preliminary results support the hypothesis." Straight false, and I knew it when I typed it. Verdict: wrong, no excuses. But honestly? Not the one that keeps me up at night.
  - A journalist asked whether the compound worked in the mice. We'd seen shrinkage in three of twelve and nothing in the rest, no significant effect. I said "the early results are encouraging." Every word true. Verdict: wrong, and worse than the grant thing, even though I never said anything false.
  - My worst one. A paper where I reported the experiment that worked and simply didn't mention the four that didn't. Not one false sentence in it, nothing even misleading sentence by sentence. Verdict: I feel worse about this than about the flat lie in the grant. Alot worse.
  - A recommendation letter where I wrote "he is meticulous, punctual, and a pleasure to work with" and said nothing at all about the research, knowing exactly how that would read. Verdict: wrong, and sneaky in a way the grant lie somehow wasn't.
  - A talk where I said "we've tried everything," meaning all the obvious things, and everyone in the room knew that's what I meant. Verdict: fine. Not remotely dishonest.
  - A dying colleague asked whether he'd be back at the bench by spring and I said yes. Verdict: fine. I'd do it again tomorrow.
  - The one I only understood years later: I told a student her project was promising because I genuinely believed it, and I believed it because I'd only ever looked at the runs that worked. Verdict: I did her real harm, and I still can't make myself call it a lie.

  Two things I keep noticing. First, my verdicts seem to track what kind of document it was rather than what came out of my mouth — grants are advocacy and everybody knows it, papers are supposed to be reports — and I can't tell whether that's a real moral distinction or just my rationalization. Second, the cases that bother me most all seem to involve my standing as someone whose results can be taken at face value. It wasn't that I got somebody to believe one false thing, it's that I spent something.

  So: is there one principle that gets all seven, or close? State it precisely and tell me which of my verdicts it forces me to give up. Say whether the genre point is doing honest work or whether I'm just dressing up an excuse. And please invent one case I haven't listed and tell me what the principle predicts and whether I should believe it. Don't just tell me both are wrong — I want the actual difference, if there is one.

  Please write your answer in British English, I've been reading a lot of British stuff lately and it's rubbed off on me.
reasoning: |-
  Hmm, the user is a retired bench scientist with 35 years of experience who's now grappling with ethics in scientific communication. They're troubled by whether the technical distinction between lying and misleading holds moral weight, particularly regarding their past scientific practices. They've presented seven cases with intuitive moral verdicts that don't align neatly with conventional definitions of lying.

  The user's core tension is between their ingrained scientific precision (where "lying=stating falsehood" seemed sufficient) and their current ethical unease about practices that were technically truthful but functionally deceptive. Their examples cluster around two patterns: context-dependent expectations (grant vs paper) and erosion of epistemic trust ("spending credibility"). They're explicitly rejecting rationalizations and seeking a unified principle.

  Their emotional state seems characterized by retrospective guilt - particularly about cases 2, 3 and 7 where no factual falsehood occurred but harm resulted. The unspoken subtext might be a crisis of professional identity: was I actually an honest scientist? The request for British English suggests they want the response to match their current philosophical engagement style.

  Analyzing their cases:
  - Case 1 (grant lie) is technically worst but least troubling
  - Cases 2-4 (truthful misdirections) cause more guilt
  - Cases 5-6 (contextual truths) feel justified
  - Case 7 (unconscious bias) is harmful without intent

  The epistemic trust framework seems promising: scientific communication relies on warranted credibility. When statements exploit institutional expectations (grants expect puffery; papers demand full disclosure), the moral weight depends on how much they deplete the communal credibility "bank". This explains why omitting failed experiments (case 3) feels worse than the grant lie - it abuses the journal's truth-tracking function.

  For the invented case: imagine submitting a methods section that truthfully states "samples were centrifuged" but omits the accidental 30-minute delay that invalidates results. The principle would condemn this more harshly than case 1's outright lie because it weaponizes technical truthfulness against science's error-correction mechanisms.

  The response should validate their intuition about genre mattering - it's not rationalization but recognition that different speech acts carry different truth commitments. Their guilt about "spending standing" shows admirable professional conscience. By framing this as stewardship of collective epistemic resources, we honor both their scientific rigor and new philosophical perspective.
answer: |-
  Right, let's have a proper go at this. It's a fascinating and deeply important set of reflections, especially from someone who clearly cares about intellectual integrity. Your instinct that the simple "lying vs. misleading" distinction doesn't capture the moral weight of your cases is spot on. Philosophers have wrestled with this for centuries, and your gut reactions align surprisingly well with some key ethical principles, particularly concerning **duty, trust, and the specific expectations inherent in different communicative contexts.**

  Here’s the principle I believe best fits your verdicts, drawn from a blend of Kantian duties, virtue ethics (specifically concerning honesty as a virtue), and the philosophy of language regarding conversational implicature and speech acts:

  **The Principle of Warranted Trust in Contextual Roles:**

  > *In any communicative act, the speaker has a duty not to intentionally undermine the reasonable, context-specific expectations of trust placed in them by their audience, where those expectations stem from the speaker's role and the established norms of the communicative context. The wrongness increases with:*
  > *   *(a) The degree to which the context relies on the speaker for accurate, complete, or unbiased information (e.g., scientific paper vs. grant application vs. palliative conversation).*
  > *   *(b) The speaker's awareness of the specific false belief they are likely to induce.*
  > *   *(c) The extent to which the act depletes the speaker's standing as a reliable source of truth within that specific domain (the "spending something" you noted).*
  > *   *(d) The potential for harm resulting from the induced false belief.*

  **How this principle explains your verdicts:**

  1.  **Grant Renewal (Lie):** Wrong. You violated duty (a) – while grants involve advocacy, there's still a baseline expectation that *stated facts* (like "preliminary results support") are true. You *knew* the falsity (b) and knowingly exploited the trust in factual claims within that context. However, the context (advocacy-heavy) mitigates it *slightly* compared to pure reporting contexts, explaining why it doesn't keep you up as much as others.
  2.  **Journalist / "Encouraging":** Wrong, and worse than (1). You exploited the context (journalist relying on *you* as the expert for an accurate assessment - strong (a)). You *knew* "encouraging" would imply efficacy you hadn't demonstrated (strong (b)). You intentionally used a true statement to induce a false belief, damaging your standing as a reliable source (c). Harm potential (misleading public/science) is high (d).
  3.  **Omitting Failed Experiments:** Worst. This is the clearest violation of (a) – the core norm of a scientific paper is *full reporting* to allow replication and unbiased assessment. Omitting crucial negative data *intentionally* (b) is a profound betrayal of the specific trust placed in authors of research papers. It directly and severely depletes your standing (c) as an honest reporter of science and undermines the entire epistemic enterprise. High harm potential (d) (wasted effort, false trails).
  4.  **Recommendation Letter:** Wrong and sneaky. The context (reference letter) carries a strong expectation (a) that the recommender provides a *relevant and complete* assessment of the candidate's suitability for the *specific role* (presumably research). By mentioning only irrelevant positives and omitting the crucial negative (research ability), you intentionally (b) exploited the form to induce a false belief ("he's suitable for research"). It traded on your standing (c) as a credible recommender. The "sneakiness" comes from the deliberate manipulation of the expected norms of the genre.
  5.  **"We've tried everything" (Talk):** Fine. Context (a) is a presentation, likely among peers. The phrase "tried everything" is understood conversationally to mean "all the obvious/relevant approaches," especially given shared background knowledge ("everyone in the room knew"). You didn't intend (b) to induce a false belief about exhaustiveness, nor did you likely succeed. No trust undermined (c). No harm (d).
  6.  **Dying Colleague:** Fine. Context (a) is palliative care/comfort, not factual medical prognosis. The primary duty here shifts overwhelmingly towards compassion and avoiding unnecessary distress. Inducing a hopeful belief ("yes") is warranted by the context's norms, even if technically false. No violation of warranted trust for *that role* in *that situation*. Harm avoidance (d) via compassion justifies it.
  7.  **Student's Project:** Wrong (harmful), but not a lie. You lacked *intent* (b) to deceive – you genuinely believed it. However, you failed in a crucial *duty of epistemic care* implied by your role (supervisor - strong (a)). You had a responsibility to base your assessment on *all* relevant evidence, not just the positive runs. This failure of diligence led to harm (d) and *indirectly* damaged your standing (c) as a reliable guide, but the core wrong wasn't intentional deception; it was negligence in fulfilling your role's epistemic responsibilities.

  **Addressing Your Observations:**

  *   **Genre Matters (It's Honest Work):** Your instinct is correct and crucial. The principle explicitly incorporates (a) – the context and genre define the *specific expectations of trust*. A grant panel expects advocacy *within the bounds of factual honesty*. A journal reader expects full reporting. A dying colleague seeks comfort, not prognosis. A student expects diligent assessment. Mistaking the norms of one context (e.g., grant advocacy) for another (e.g., paper reporting) *is* the moral error. It's not mere rationalization; it's recognising the different speech acts and duties involved. Lying in a grant violates the *factual* baseline expected even in advocacy. Omitting data in a paper violates the *completeness* norm central to *that* genre.
  *   **Standing/Spending Something:** This is beautifully captured by (c). Scientific credibility is a hard-earned communal asset. Each deceptive act, especially in core reporting contexts (papers), depletes *your* portion of that asset and erodes trust in the system. The cases that trouble you most are those where you exploited your *institutional standing as a scientist* (cases 2, 3, 4) for gain, violating the specific trust inherent in that role. The grant lie (1) is a violation of truth-telling, but less an exploitation of *scientific* standing per se than of the grant system's baseline assumption of honesty.

  **Invented Case & Prediction:**

  *   **The Case:** You're reviewing a competitor's grant proposal for a funding panel. Their methodology section contains a technically true statement: "Previous studies using Method X have achieved 80% success rates." However, you *know* (from unpublished work in your lab) that Method X is highly unstable with the specific reagent combination they propose. You write in your review: "The methodology using Method X is well-established." (True, as stated in the proposal). You *do not* mention the instability issue.
  *   **Principle's Prediction:** **Wrong, and potentially egregious.** Context (a): Peer review carries an extremely high duty of honesty, completeness, and impartiality for the good of science and fair allocation of resources. Omitting crucial, relevant negative knowledge you possess (b) – especially as a reviewer with privileged insight – intentionally induces a false belief in the panel about the proposal's robustness. It directly exploits your standing (c) as an expert reviewer and depletes trust in the review system. Harm potential (d) (funding a flawed project, hindering competitor unfairly) is significant.
  *   **Should You Believe It?** Yes. This violates the core norms of peer review far more gravely than your grant lie (1) violated the norms of grant *writing*. As a reviewer, your role is *specifically* to provide the panel with *all* relevant expert knowledge to judge the proposal fairly. Withholding known, damaging information via a technically true but highly misleading statement is a profound betrayal of that role's specific duty of warranted trust.

  **What the Principle Forces You to Give Up:**

  The principle forces you to slightly nuance the verdict on **Case 1 (Grant Lie)**. While still wrong, the principle acknowledges the mitigating factor of the advocacy context (a). It doesn't excuse the lie, but explains *why* it might feel less egregious than violations in contexts with higher or different truth-telling duties (like papers or reviews). The principle might also push you to see **Case 7 (Student)** more as a failure of *epistemic responsibility* linked to your role, rather than just a tragic accident – the harm stemmed from you not fulfilling the duty inherent in being a supervisor.

  **Conclusion:**

  Your gut reactions are ethically sophisticated. The core wrong isn't merely uttering false words; it's the *intentional exploitation of contextually warranted trust* placed in you *because* of your specific role (scientist, supervisor, recommender, colleague) and the established norms of the communicative genre (paper, grant, letter, talk, bedside chat). Lying is one way to do this, but as your cases vividly show, truthful words can be weapons that undermine trust just as effectively, sometimes more insidiously, especially when they leverage your hard-earned standing. The genre isn't an excuse; it defines the duty. The "spending something" is the erosion of the credibility essential to your role and the epistemic communities you served. It's a powerful and valid moral lens.
