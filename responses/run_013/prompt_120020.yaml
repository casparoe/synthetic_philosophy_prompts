prompt: |-
  Act as an expert in effective altruism, decision theory, and the philosophy of science. Think carefully before answering. I have been reading rationalist and EA blogs for years, and I keep encountering a pattern in cause prioritization that I do not have a clean name for. A cause is rated highly because it is neglected: few people are working on it, so additional resources seem likely to have high marginal impact. But sometimes the neglect is itself a symptom of something that should lower the rating. The area may be neglected because its effects are hard to verify, because past attempts failed in ways that are not widely publicized, or because it attracts people whose judgment is systematically off. In those cases, the same fact—few people are working on it—is treated as evidence of opportunity, when it may be evidence of a trap. This is not just the ordinary warning that neglectedness can be confounded with low tractability. It is a specific feedback loop: the cause is neglected because it is hard to evaluate, and its difficulty in evaluation makes it look more neglected, which makes it look more promising to a certain kind of optimizer. Is there an established term or concept for this? If there is, what is it and how exactly does it carve the phenomenon? If there is not, can you name and define it, and say how it relates to and differs from the standard importance-tractability-neglectedness framework, from the idea of a neglectedness proxy, and from the more general problem of Goodharting a metric? Please start by brainstorming possible concepts and then give a focused answer. Do not just give a bare label; I care about the boundaries: what counts as an instance, what does not, and where the edges are.
reasoning: |-
  Okay, the user is deeply involved in rationalist and EA communities and has noticed a specific pattern in cause prioritization. They describe a scenario where a cause is deemed high-impact due to its neglectedness, but that neglect might actually signal underlying issues like unverifiability, past failures, or biased judgment among its proponents. The user wants to know if there's a term for this phenomenon or if one should be coined. They're looking for precise conceptual boundaries and differentiation from related ideas like the ITN framework, neglectedness proxies, and Goodharting.

  First, I need to unpack their core concern: it's not just that neglectedness can be confounded with low tractability, but that there's a feedback loop where the difficulty in evaluating the cause both causes neglect and makes it appear more attractive to certain optimizers. The challenge is to capture this self-reinforcing mechanism.

  I recall that in decision theory and EA literature, there are concepts like evaluation neglect, but none fully encapsulate this loop. The user mentions it's distinct from standard warnings about neglectedness proxies. So, I need to brainstorm terms that emphasize the cyclical nature. Terms like "Evaluation Trap" or "Neglect-Distortion Feedback Loop" come to mind. But I should ensure the term clearly conveys the causality: neglect caused by evaluation challenges leading to false promise.

  Next, I need to define the concept rigorously. Necessary conditions might include: inherent hard-to-evaluate properties, neglect due to that, misinterpretation of neglect as opportunity, and a feedback loop reinforcing the cycle. For example, causes like unverifiable policy interventions or speculative technologies might fit, whereas something like malaria bed nets in the 90s—neglected but verifiable—wouldn't.

  Differentiating from related concepts is crucial. The ITN framework treats neglectedness as a standalone factor, but this phenomenon shows how it can interact negatively with tractability and importance. Unlike neglectedness proxies, which are mistakenly used as indicators, this involves a deeper systemic issue. Goodharting is broader, where any metric becomes unreliable; here, it's specifically about neglectedness being gamed by the cause's inherent properties.

  The user's deeper need might be to avoid falling into such traps in their own cause prioritization. They likely want a framework to identify and assess such risks, ensuring resources aren't wasted on causes that seem promising due to distorted signals. Providing a clear term and boundaries helps in creating mental models for better decision-making.

  Finally, coining "Evaluation Trap" seems apt, as it highlights the peril of entering a domain where evaluation challenges both cause neglect and attract misallocated resources. The feedback loop element is key, distinguishing it from one-off errors. This term should resonate with EA and rationalist communities, aiding in clearer discourse and more robust cause assessment.
answer: |-
  Based on your description, you've identified a sophisticated and pernicious pattern in cause prioritization that deserves a precise label. While existing concepts touch on aspects, no single established term fully captures the **self-reinforcing feedback loop** you describe. Let's break it down.

  **Brainstorming & Candidate Concepts:**

  1.  **Evaluation Neglect Feedback Loop:** Highlights the core cycle: neglect due to hard-to-evaluate nature -> misinterpreted as pure opportunity -> attracts resources/investigation -> difficulties persist or compound -> reinforces neglect & misperception.
  2.  **Phantom Opportunity Trap:** Emphasizes the illusory nature of the perceived opportunity. The "promise" is a mirage created by the very factors causing neglect.
  3.  **Neglectedness Distortion Field:** Evokes how the cause's inherent properties distort the perception of neglectedness itself.
  4.  **Unverifiability Attractor:** Focuses on the hard-to-evaluate property as the attractor for misallocated resources due to misinterpreted signals.
  5.  **Hidden Failure Cycle Trap:** Stresses the role of obscured past failures preventing learning and contributing to the cycle.
  6.  **Optimizer's Mirage:** Highlights the specific susceptibility of certain analytical optimizers to this particular illusion.

  **The Focused Answer: Coining "The Evaluation Trap"**

  **Term:** **The Evaluation Trap**

  **Definition:** A cause prioritization failure mode where the inherent difficulty in rigorously evaluating a cause's true impact or effectiveness (due to unverifiability, obscured past failures, selection bias in researchers, etc.) *both*:
  1.  **Causes Neglect:** Rational actors avoid investing resources because credible evidence of impact is unavailable or prohibitively costly to obtain, and/or because past failures are hidden or misattributed.
  2.  **Creates a False Signal of Opportunity:** This neglect is misinterpreted (often by highly motivated optimizers) as evidence of high marginal returns on investment (ROI), *precisely because* the difficulty of evaluation prevents the accumulation of disconfirming evidence that would otherwise dampen enthusiasm.

  This misinterpretation attracts resources and attention. However, the fundamental difficulty in evaluation persists or worsens (e.g., attracting biased proponents, generating noisy or uninterpretable results). The lack of clear progress or failure *cannot be reliably distinguished* from the inherent noise or delay, further reinforcing the initial neglect by objective observers *while simultaneously* maintaining or even increasing the *perceived* neglectedness and thus perceived opportunity for the optimizers caught in the trap. This creates a **self-sustaining feedback loop**.

  **Carving the Phenomenon: Boundaries & Instances**

  *   **Core Conditions (What Counts):**
      *   **Inherent Hard-to-Evaluate Property:** The cause *fundamentally* resists clear, timely, or objective measurement of impact or success/failure (e.g., long feedback loops, counterfactuals impossible, noisy data, complex causal chains).
      *   **Neglect Driven *Primarily* by Evaluation Difficulty:** The lack of investment/attention is demonstrably linked *to* the evaluation challenges, not just other factors like unpopularity or low perceived importance.
      *   **Misinterpretation of Neglect as Pure Opportunity:** The neglect is taken as a *positive* signal for high marginal impact by some evaluators, *despite* the known or suspected evaluation difficulties.
      *   **Feedback Loop:** Resources flow in, but the evaluation difficulty prevents clear resolution (success or failure), perpetuating the cycle of neglect by outsiders *and* continued perceived opportunity by insiders/trap-susceptible optimizers.

  *   **Clear Instances:**
      *   **Speculative Technologies with Unfalsifiable Claims:** e.g., Early-stage fusion concepts where timelines are always 30 years away, failures are attributed to insufficient funding or minor design flaws, and progress metrics are ambiguous. Neglect by mainstream energy investors is seen as an opportunity by true believers.
      *   **Complex Social/Political Interventions:** e.g., A specific theory of change for reducing great-power conflict via cultural exchange programs where impact is near-impossible to isolate, failures are explained away by context, and proponents are highly ideologically motivated. Neglect by major foundations is seen as evidence of a "blind spot."
      *   **Paranormal/Controversial "Science":** e.g., Funding research into highly fringe phenomena where methodology is contested, replication fails but is blamed on skeptics, and proponents have a history of motivated reasoning. Neglect by mainstream science is interpreted as dogmatic suppression, signaling high potential ROI for "mavericks."
      *   **Certain Long-Termist Cause Areas:** e.g., Interventions aimed at influencing the very long-term future trajectory of civilization where impact verification is fundamentally impossible within human lifetimes. Neglect due to this epistemic problem is used as a key argument *for* its importance and high marginal value.

  *   **What Does *Not* Count (Edges & Distinctions):**
      *   **Simple Low Tractability:** A cause is neglected because it's technically hard *but* progress *is* measurable (e.g., fusion research *today* with clearer milestones). Neglect might be warranted, but there's no strong false signal *from* the neglect itself being misinterpreted due to inherent evaluation flaws.
      *   **Low Perceived Importance:** Neglect driven solely by the cause being seen as unimportant (e.g., preserving a obscure species with no known ecosystem role). The neglect isn't misinterpreted as a positive signal of opportunity by rational actors.
      *   **Transient Neglect:** A genuinely promising field is simply new or overlooked, but robust evaluation *is possible* (e.g., mosquito bed nets before RCTs proved impact). Neglect is correctly identified as an opportunity; there's no inherent evaluation barrier creating a false signal.
      *   **Pure Scams/Fraud:** Where proponents *knowingly* misrepresent the opportunity. The Evaluation Trap involves genuine belief fueled by the distorted signals, even if judgment is biased.
      *   **"Ordinary" Neglectedness Proxy Issues:** Using a bad proxy for neglect (e.g., "few Google results") is different. The Evaluation Trap is about the *true* neglect being *caused by* and *misinterpreted due to* the evaluation difficulty itself.

  **Relation to Frameworks & Concepts:**

  1.  **Importance-Tractability-Neglectedness (ITN):** The Evaluation Trap directly subverts the "N" factor.
      *   **Neglectedness:** It highlights that neglect can be a *negative* signal, not just a positive one. The standard ITN framework treats neglect as generally desirable (holding I&T constant), but the Trap shows neglect can be a symptom of low *effective* tractability or even hidden low importance.
      *   **Tractability:** The Trap reveals a specific *type* of intractability: **epistemic intractability** (the difficulty of *knowing* if progress is being made or if the intervention works). This is distinct from technical or political intractability.
      *   **Interaction:** The Trap creates a situation where high *perceived* Neglectedness coexists with low *effective* Tractability (due to epistemic issues) and potentially unknown/unknowable true Importance.

  2.  **Neglectedness Proxy:** The Trap is *not* about using a bad proxy *for* neglect. It's about the *true level of neglect* being *itself* a misleading signal *because* that neglect is caused by the evaluation difficulties that also make the cause risky. The neglect isn't a proxy; it's a direct but misinterpreted fact.

  3.  **Goodharting a Metric:** This is a close cousin, but more specific.
      *   **Goodharting (General):** "When a measure becomes a target, it ceases to be a good measure." Focusing too much on *any* metric (e.g., QALYs, neglectedness) can distort behavior away from the true goal (impact).
      *   **The Evaluation Trap (Specific Goodharting):** It's Goodharting applied *specifically* to the neglectedness metric within cause prioritization, *and* the distortion arises *because* the inherent properties of the cause make neglectedness a particularly bad proxy for marginal impact in this instance. The metric is being gamed by the cause's own nature, not (necessarily) by bad actors.

  **In essence:** The Evaluation Trap is a pathological dynamic where the very characteristic (hard-to-evaluate) that *should* make a cause *less* attractive (by increasing uncertainty and risk) paradoxically makes it *more* attractive to certain evaluators by creating a persistent signal of neglectedness and obscuring disconfirming evidence, leading to a self-perpetuating cycle of misallocated resources. It's a specific failure mode arising at the intersection of epistemic limitations, motivated reasoning, and the mechanics of cause prioritization based on signals like neglect. Recognizing it requires deep skepticism towards causes where the primary argument for high marginal impact is neglect *combined with* inherent difficulties in verification or a history of obscured failures.
