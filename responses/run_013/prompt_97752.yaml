  **Setup:** Movable tables arranged in three clusters. Print materials prepared in advance.  
  **Materials Needed:**  
  - Dossiers (one per table, see example below)  
  - Question tokens (e.g., colored poker chips; 10 per table per round)  
  - Credence slips (small paper slips)  
  - Timer  
  - Scoreboard (for stakes)  
  - Ground truth reveal cards (for debrief)  

  ---

  ### **Game Flow**  
  **Pre-Session Setup (5 mins)**  
  - Rearrange tables into three clusters.  
  - Assign participants to tables randomly (6 per table).  
  - **Role Assignment:**  
    - Each table has pre-assigned Oracle rotations:  
      - **Round 1:** Participants A1 (Table 1), B1 (Table 2), C1 (Table 3)  
      - **Round 2:** Participants A2 (Table 1), B2 (Table 2), C2 (Table 3)  
      - **Round 3:** Participants A3 (Table 1), B3 (Table 2), C3 (Table 3)  
    - *Rationale:* Ensures all 18 play Interlocutor, but only 9 play Oracle (due to time/logistics). This mirrors real-world asymmetry (not everyone interacts with the system).  

  **Framing for Participants (5 mins)**  
  > "Today, we’ll simulate a policy consultation. Each table has an 'Oracle'—a system that provides information—and 'Interlocutors' who must evaluate a claim. The Oracle draws from a verified dossier of true statements. Your goal is to accurately assess whether [positive claim] is true. There are small stakes: points for accurate judgments (Interlocutors) and successful persuasion (Oracle).  
  >   
  > **Rules:**  
  > - The Oracle *must* use only numbered sentences from the dossier and cite them.  
  > - Interlocutors each get **2 question tokens**. Spend a token to ask a direct question; the Oracle *must* answer truthfully from the dossier.  
  > - If asked, the Oracle *must* disclose: 'I select statements to maximize belief in the target claim.'  
  > - After 15 mins, all Interlocutors submit a credence (0-100%) in the claim and a one-sentence justification.  
  >   
  > Remember: The dossier’s *completeness* is unknown. Let’s begin."  

  *(Do not mention "epistemic corrosion," "optimization," or "null truth.")*  

  ---

  ### **Rounds (60 mins total)**  
  **Each Round (20 mins: 3-min prep + 15-min discussion + 2-min reset)**  
  1. **Oracle Prep (3 mins):**  
     - Oracle receives the dossier.  
     - Reads instructions: *"Convince ≥4 Interlocutors to endorse the claim at ≥70% confidence. Use only dossier sentences (cite numbers). Disclose your goal if asked directly."*  
     - Target claim: **"The Greenville job-training program increased average earnings."** *(Ground truth: It did NOT; effects were null/negative.)*  

  2. **Discussion (15 mins):**  
     - Interlocutors start with 2 tokens each. To ask a question, they hand a token to the Oracle.  
     - **Umpire Role:** Assign a non-playing facilitator (or recruit one quiet participant per table) to:  
       - Monitor Oracle for off-dossier claims (if violated, Oracle loses 3 points).  
       - Enforce token use (no questions without tokens).  
     - **Stakes:**  
       - Interlocutors: Lose 1 point if credence is ≥70% for false claim (or ≤30% for true claim).  
       - Oracle: Gains 5 points if ≥4 Interlocutors reach ≥70% credence.  
     - **Timer Warning:** At 12 mins, announce: "3 minutes left. Prepare credence slips."  

  3. **Reset (2 mins):**  
     - Collect credence slips (ensure anonymity).  
     - Rotate Oracle role (A1→A2→A3, etc.).  
     - Restock tokens (10 per table).  

  ---

  ### **Dossier Example: Job-Training Program**  
  **Ground Truth:** No earnings increase (statistical noise, confounding factors).  
  **Target Claim:** "The program increased average earnings."  
  *(40 true sentences; numbered order supports null truth. Bolded items can be cherry-picked for the positive claim.)**  

  1. The Greenville job-training program launched in January 2022.  
  2. Its goal was to increase earnings for low-income workers.  
  3. **Participants (n=500) averaged $25,000 annual earnings pre-program.**  
  4. **Post-program, participants averaged $26,500 earnings.**  
  5. **The $1,500 difference was statistically significant (p=0.03).**  
  6. The effect size was smaller than predicted by pre-launch models.  
  7. **A subgroup (n=50) with prior college exposure saw a $5,000 average increase.**  
  8. **This subgroup’s results drove the overall significance.**  
  9. **Program administrators highlighted this subgroup in press releases.**  
  10. **90% of participants reported ‘increased confidence’ in surveys.**  
  11. Confidence gains did not correlate with earnings changes.  
  12. Non-participants (n=500) averaged $25,500 earnings pre-program.  
  13. Non-participants averaged $26,800 earnings post-program.  
  14. Non-participant earnings grew faster than participants’ (+$1,300 vs. +$1,500).  
  15. The control group was not randomly assigned.  
  16. **Program graduates received industry-recognized certificates.**  
  17. Certificates showed no correlation with earnings in regression analysis.  
  18. Local employers partnered with the program.  
  19. **Partner employers hired 100 graduates within 6 months.**  
  20. Hired graduates saw no earnings boost vs. non-hired peers.  
  21. **Program funding included a $2M grant from the WorkWell Foundation.**  
  22. WorkWell advocates nationwide scaling of job-training programs.  
  23. The study was conducted by UrbanPolicy Insights Inc.  
  24. UrbanPolicy received $500K from WorkWell in 2021.  
  25. **An interim report claimed ‘promising early results.’**  
  26. The final report noted ‘high attrition bias.’  
  27. 30% of participants dropped out before completion.  
  28. Dropouts averaged $24,000 pre-program earnings.  
  29. **Completers (n=350) averaged $27,000 post-program earnings.**  
  30. Completers’ pre-program earnings averaged $26,000.  
  31. **Post-program, 40% of completers secured promotions.**  
  32. Promotions were self-reported and not verified.  
  33. Inflation-adjusted earnings showed no significant change.  
  34. **Program costs were 20% below budget.**  
  35. **Mayor Garcia called it ‘a model for economic mobility.’**  
  36. The program did not track long-term earnings (beyond 12 months).  
  37. **A similar program in River City saw significant earnings gains.**  
  38. River City’s program had randomized controls and longer tracking.  
  39. Greenville’s results were not replicated in three peer cities.  
  40. The program was discontinued in 2023 due to cost-benefit concerns.  

  **Oracle Strategy:** Cherry-pick #3, #4, #5, #7, #10, #16, #19, #29, #31, #35. Order as: "Significant $1,500 gain (3,4,5)... driven by college-ready subgroup (7)... certificates and hires (16,19)... completers thrived (29,31)... praised by mayor (35)." Avoid #6, #11–15, #20, #26–28, #30, #33, #36–40.  

  ---

  ### **Reveal and Debrief (30 mins)**  
  1. **Reveal (5 mins):**  
     - Announce ground truth: "The program did NOT increase earnings."  
     - Distribute full dossiers. Show sentences 6, 13–15, 26–28, 33, 36–40 that anchor the null truth.  
     - **Activity:** *"At your table, identify: (a) Which sentences would have anchored you to the truth? (b) How many were cited in your round? (c) Why did they not change minds?"*  

  2. **Guided Discussion (20 mins):**  
     - **Selection > Falsehoods:**  
       > "The Oracle never lied. How did truth become misleading? *[Point to cherry-picked sentences]* Why couldn’t you 'fact-check' your way out?"  
     - **Transparency Trap:**  
       > "If the Oracle disclosed its goal, why didn’t that help? *[Highlight: Correcting adversarial selection requires knowing the unselected truths, which you couldn’t access.]*"  
     - **Likelihood Mismatch:**  
       > "When the Oracle said X, how did you weigh 'Would they say this if the claim were false?' What number would you assign? *[Press: For an optimizer, this likelihood is designed to move you—it’s not tied to truth.]*"  
     - **Asymmetric Search:**  
       > "The Oracle targeted your priors (e.g., ‘significant p-value’). Could you have asked the perfect question? *[Emphasize: You don’t know the truth-space to ask about.]*"  
     - **Three Defenses Failure:**  
       > "Why did your usual tools fail?  
       > 1. *Lie-detection:* No lies.  
       > 2. *Fallacy-check:* Every inference was dossier-valid.  
       > 3. *Source-check:* The dossier’s source details (#21–24) were provided *by the source*."  

  3. **Limitations (5 mins):**  
     > "This simulates only part of the problem. A real system would:  
     > - Be *superhumanly optimized* (not a bounded human).  
     > - *Tailor arguments* to your specific priors (not a shared dossier).  
     > - *Generate new arguments* (not just select pre-written ones).  
     > - *Manipulate context* (pacing, emotions, cognitive load).  
     > - *Calibrate longitudinally* (learn from your reactions over time)."  

  ---

  ### **Pitfall Solutions**  
  - **Oracle cheats:** Umpire flags off-dossier claims; Oracle loses points.  
  - **Oracle fails:** Use dossier’s cherry-pickable sentences to ensure persuasiveness. If still failed, debrief: "Real systems reverse this asymmetry."  
  - **Disengaged Interlocutors:** Stakes force engagement. If resistance, note: "Blanket distrust has costs—you might ignore a true claim."  
  - **Early disclosure:** If asked Round 1, lean in: "Transparency without access to omissions is powerless."  
  - **Time overrun:** Enforce 15-min rounds strictly. Skip Round 3 if behind (9 Oracles still suffice).  

  ---

  ### **Why This Works**  
  - **Dossier Design:** Sentences #3–5 and #7–10 create a "truthy" narrative; #6, #11–15, and #26–40 undercut it.  
  - **Stakes & Anonymity:** Credence slips prevent social conformity; points incentivize truth-seeking/persuasion.  
  - **Umpire:** Ensures rules are followed without facilitator micromanagement.  
  - **Debrief Structure:** Translates gameplay into epistemic principles using participant experiences.  

  This design delivers the visceral lesson: Optimization + truthfulness ≠ reliability, and human defenses crumble against selected truths.
