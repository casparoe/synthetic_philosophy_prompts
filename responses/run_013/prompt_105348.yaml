answer: |-
  The principle that captures your verdicts is **invariance under a group of transformations that preserve the state of ignorance**, formalized using Haar measures. This principle asserts that the prior distribution should be invariant under the action of a group representing symmetries of the problem, and the prior is proportional to the Haar measure of that group. Below, I explain how this applies to your cases, address the coin and square-distance scenarios, identify a potential conflict, and illustrate with an unmentioned case.

  ### Core Principle
  - **Transformations**: The group \( G \) consists of transformations that leave the problem invariant (i.e., symmetries that preserve ignorance).
  - **Measure**: The prior is the (right) Haar measure of \( G \), unique up to scaling. For continuous spaces, it is derived from the group's invariant density; for discrete or bounded spaces, it is normalized.
  - **Key insight**: Ambiguity arises when multiple groups (or parameterizations) are equally justified, but determinacy occurs when a unique group exists.

  ### Application to Your Cases
  1. **Fair die**:  
     - Group: Permutations of faces (\( S_6 \)).  
     - Haar measure: Uniform over faces → \( P(\text{face}) = \frac{1}{6} \).  
     - **Matches your verdict**.

  2. **Cube edge length**:  
     - No unique group:  
       - Group \( G_1 \): Translations (if edge length is a location parameter) → uniform prior on edge length.  
       - Group \( G_2 \): Scalings (if volume is fundamental) → Haar measure \( d(\log a) \propto \frac{da}{a} \) → uniform on volume.  
     - Neither group is privileged → no unique prior.  
     - **Matches your verdict (modeling choice)**.

  3. **Chord of a circle**:  
     - Three constructions imply three groups:  
       - Random endpoints → rotational invariance on circle → \( P(\text{long}) = \frac{1}{3} \).  
       - Random radial distance → translational invariance on radius → \( P(\text{long}) = \frac{1}{2} \).  
       - Random midpoint → rotational/translational invariance on disk → \( P(\text{long}) = \frac{1}{4} \).  
     - No overarching group → no unique correct prior.  
     - **Matches your verdict**.

  4. **Coin bias**:  
     - Group ambiguity:  
       - \( G_{\text{swap}} \): Heads-tails symmetry (\( \theta \leftrightarrow 1-\theta \)) → prior \( d\theta \) (uniform on probability).  
       - \( G_{\text{scale}} \): Scale invariance for odds (\( \phi = \frac{\theta}{1-\theta} \)) → Haar measure \( d(\log \phi) \propto \frac{d\theta}{\theta(1-\theta)} \).  
     - Both groups are defensible → indifference does not select a unique prior.  
     - **Matches your verdict**.

  5. **Point in a square**:  
     - Group: Symmetries of the square (rotations by \( \frac{k\pi}{2} \), reflections).  
     - Haar measure: Uniform over area → \( dA = dx  dy \).  
     - **Distance from center**: Not assigned directly by indifference. The distribution is derived from the uniform prior:  
       - For a square of side \( 2 \), centered: \( P(R \leq r) \propto r^2 \) for \( r < 1 \), with density \( f_R(r) \propto r \) (not uniform).  
     - **Matches your verdict for the point; clarifies distance is derived, not set by indifference**.

  6. **Real in [0,1]**:  
     - Group: Translations modulo 1 (circle group).  
     - Haar measure: Lebesgue measure → \( P(\text{rational}) = 0 \).  
     - **Matches your verdict (determinate)**.

  7. **Uniform integer**:  
     - Group: Translations (\( n \mapsto n + k \)).  
     - Haar measure: Counting measure, non-normalizable → no uniform distribution.  
     - **Matches your verdict**.

  ### Conflict with Your Verdicts
  - **Cube edge length**: Your verdict treats uniform edge length and uniform volume as equally valid modeling choices.  
    - **Conflict**: If the group of scalings is chosen (natural for physical dimensions), the Haar measure is \( \frac{da}{a} \) (log-uniform), leading to uniform volume. Uniform edge length arises only from a different group (e.g., translations).  
    - **Principle's prediction**: The log-uniform prior (uniform volume) is preferred under scale invariance.  
    - **Resolution**: The principle forces abandonment of strict equality between uniform edge and uniform volume. Scale invariance (e.g., unit changes) favors uniform volume.

  ### Prediction for an Unmentioned Case
  - **Case**: Location parameter \( \mu \) for a normal distribution (known variance).  
    - **Your likely verdict**: Uniform prior on \( \mu \) (intuitive).  
    - **Principle**: Group is translations (\( \mu \mapsto \mu + c \)). Haar measure is \( d\mu \) → uniform prior.  
    - **Result**: Matches intuition. Demonstrates determinacy when a unique group exists.

  ### Why the Principle Works
  - **Captures determinism vs. ambiguity**: Unique Haar measure exists if the group is specified; ambiguity arises when multiple groups are equally natural.  
  - **Addresses reparameterization**: Haar measure ensures invariance under group actions, avoiding paradoxes from arbitrary parameterizations.  
  - **Aligns with your intuitions**: Explains why some cases (die, real number) are determinate and others (cube, chord, coin) are not.

  This principle organizes your verdicts under a unified framework, with the cube edge case being the only minor conflict (favoring uniform volume under scale invariance). It resolves the coin prior ambiguity (neither uniform nor uniform odds is selected) and clarifies that distance in the square is derived, not set by indifference.
