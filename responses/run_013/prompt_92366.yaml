answer: |-
  Here are five essential desiderata for any account of multiple realization of mental states:

  1.  **Non-Spookiness Requirement:** The account must explain how mental properties arise from physical processes without invoking non-physical substances or forces. It must be consistent with physicalism, avoiding dualism or vitalism. This is non-negotiable; explanations cannot rely on magic. *Excludes: Substance dualism, vitalism.*

  2.  **Functional Equivalence Requirement:** The account must allow that physically dissimilar systems (e.g., octopus ganglia, mammalian cortex, hypothetical silicon) can realize the *same* mental state if they perform the same causal role within their respective cognitive architectures (e.g., mediating nociceptive avoidance learning). It must distinguish realization from mere simulation. This is core to multiple realization. *Excludes: Strict type-identity theory, behaviorism.*

  3.  **Causal Depth Requirement:** The account must explain *why* a specific physical state realizes a specific mental state by appealing to the causal powers of the physical substrate within the system. It cannot collapse the distinction between having a causal structure capable of supporting mentality (octopus) and merely mimicking outputs (chatbot). This is non-negotiable; "realization" demands causal efficacy. *Excludes: Strong AI functionalism, behaviorism.*

  4.  **Systemic Integration Requirement:** The account must show how the realized state is integrated into, and causally interacts with, the broader system's states (perception, memory, motivation, action). A state realized in isolation cannot constitute a genuine mental state. This is non-negotiable; atomistic states lack mentality. *Excludes: Epiphenomenalism, isolated module claims.*

  5.  **Exclusion of Panpsychism Requirement:** The account must not imply that fundamental physical properties (e.g., charge, mass) are intrinsically mental or that mentality is ubiquitous. Realization must be a specific, higher-order property of complex systems. This reflects a widely held physicalist commitment but is debated. *Excludes: Panpsychism, radical emergence.*

  **Key Conflict:** Requirement #2 (Functional Equivalence) and Requirement #3 (Causal Depth) pull in opposite directions. #2 prioritizes role over substrate, readily accepting octopus pain as genuine. #3 prioritizes the causal mechanisms *by which* the role is implemented, potentially demanding similarity in underlying causal structure, which could exclude octopus pain or future AI. Resolving this requires either weakening #2's acceptance of extreme dissimilarity or weakening #3's demand for substantive causal similarity in the realization base.

  **Most Decisive Requirement:** Requirement #3 (Causal Depth) does the most work in ruling out common positions. It decisively excludes behaviorism (only outputs matter) and strong AI functionalism (correct program = mind, regardless of implementation's causal powers), demanding a substantive physical basis for causal efficacy within the system.
