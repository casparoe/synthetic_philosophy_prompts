prompt: |-
  Ok, I'm a 3rd year PhD student in philosophy of science and I've been going around in circles about this with a friend in the physics dept, so I'm crowdsourcing it. Setup: if many-worlds is right, then every time there's a quantum event with nonzero amplitude for me surviving, some branch has me surviving. So in the branch doing the thinking I never die. That's quantum immortality, fine.

  Here's what I can't get past. If that's right, then quantum suicide looks like a clean empirical test of many-worlds. I build the machine, I sit in it, and if I'm still here after 40 rounds then I've got a likelihood ratio of about 2^40 favoring many-worlds over any collapse theory. That seems like a way bigger deal than anything coming out of the LHC, and yet nobody runs it. The only reasons I can come up with are (a) no IRB on earth would approve it, or (b) it's just hard to build. Am I missing something? Is there some reason the experiment isnt decisive that I'm just not seeing?

  And the practical side. If I'm genuinely guaranteed to survive, shouldn't I be way less risk averse? Not in a stupid "drive drunk" way, but I should be happy to take any gamble where the downside branch is one where I die, since I'll never be in that branch. Should I be reorganizing my whole life around this? I feel like I'm either missing something obvious or I've stumbled onto the single most important fact about my existence.

  American English please, my advisor is German and I keep getting my spellings confused.
