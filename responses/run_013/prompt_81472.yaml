answer: |-
  ### Brainstorming: Intuition Pump Failure Modes  
  1. **Mirroring**: Reader projects pre-existing commitments onto vague details.  
  2. **Stipulation**: Author over-specifies, making the verdict tautological.  
  3. **Ambiguity collapse**: Critical distinctions (e.g., moral/epistemic) blurred by underspecification.  
  4. **Salience hijacking**: Irrelevant details sway judgments due to framing.  
  5. **Causal smuggling**: Implied backstory (e.g., determinism) biases outcomes.  
  *Note*: (1) and (2) are primary; (3)-(5) often reduce to underspecification (feeding mirroring) or overspecification (feeding stipulation).  

  **Minimal Pair Case**  
  *Case A (Wallet, Low Expository Slack)*:  
  *Description*: "Lee finds a wallet containing £100 and an ID. Lee knows the owner is wealthy. Lee returns it solely to avoid guilt."  
  *Content*: Motive (guilt-avoidance), owner's wealth explicit.  
  *Verdict*: "Not praiseworthy" (if motive is stipulated as key).  

  *Case B (Wallet, High Expository Slack)*:  
  *Description*: "Lee finds a wallet containing cash and an ID. Lee returns it."  
  *Content*: Reader projects motive (kindness? duty?) and owner's need.  
  *Verdict*: "Praiseworthy" (if reader assumes altruism).  

  Both cases test "Praiseworthiness depends solely on motive." Case B risks mirror mode; Case A risks stipulation mode.  

  ### Analysis  
  **1. The Specification Dilemma: Genuine but Misdiagnosed**  
  - **Substantive Claim 1**: The dilemma is *false* as a forced choice. It conflates *semantic underdetermination* (inherent to language) with *pragmatic failure* (misuse of pumps). Descriptions *always* leave gaps (semantic fact), but a pump succeeds when gaps are *constrained by shared context* (pragmatic fact).  
  - **Why not forced?** A pump avoids mirror/stipulation when:  
    - It excludes *irrelevant* details (preventing stipulation),  
    - But fixes *relevant* ones (preventing mirroring).  
    In *Wallet*, stating "Lee returns it" without specifying motive *is* problematic (mirror risk), but adding "to avoid guilt" isn’t stipulative if motive is the contested variable in the moral principle tested.  
  - **Root issue**: Thought experiments function *dialectically*. Their aim isn't "independent evidence" but *exposing inferential commitments*. The dilemma arises only if we mistakenly treat pumps as syllogisms.  

  **2. Relocation: Moves but Doesn’t Escape the Dilemma**  
  - **Substantive Claim 2**: Relocation *shifts* the disagreement (e.g., from "Is Lee praiseworthy?" to "Is motive relevant?"), but the dilemma recurs in choosing *which features to leave open*.  
  - **Objection**: If relocation solves the dilemma, why does *Wallet Case B* still invite projection?  
    - **Reply**: Relocation doesn’t eliminate slack; it *exploits* it diagnostically. Case B’s vagueness *reveals* that readers import divergent moral heuristics (e.g., consequentialism vs. deontology).  
    - **Suspicion confirmed**: The choice of open features is itself contestable. But this isn’t fatal—it *advances* debate by forcing explicitness about relevance criteria.  

  **3. Asymmetry: Mirror vs. Stipulation**  
  - **Substantive Claim 3**: The contrast is real but *psychological*, not structural.  
    - Mirror mode: Manufactures *false consensus* (e.g., all agree Case B is "praiseworthy" but for conflicting reasons).  
    - Stipulation mode: Manufactures *incontestability* (e.g., Case A’s verdict follows trivially).  
  - **Danger asymmetry**:  
    - **Moral cases** (e.g., *Wallet*): Mirror mode is stealthier. Readers unaware they project biases (e.g., assuming poverty justifies theft).  
    - **Metaphysical cases** (e.g., a zombie twin): Stipulation is deadlier. Overspecifying "physical duplicates" may smuggle in physicalism.  
    - *Why?* Moral intuitions are more entrenched; metaphysical cases rely on technical coherence.  

  **4. Robustness Tests: Limited but Not Useless**  
  - **Problem**: Varying irrelevant details *cannot* distinguish:  
    - Genuine robustness (e.g., *Wallet* verdict unchanged whether owner is rich/poor, *if* motive is fixed),  
    - Stipulative robustness (e.g., verdict holds only because motive was defined as decisive).  
  - **No better test exists**, but this doesn’t doom thought experiments. Robustness checks *flag* stipulation when variations *should* matter but don’t (e.g., altering the wallet’s location in Case A changes nothing—suggesting irrelevant details were over-fixed).  
  - **Implication**: Pumps are *adversarial tools*, not proofs. Their value lies in *testing coherence* of principles under refinement.  

  **Illustrative Well-Known Pump: Gettier Cases**  
  - **Description**: "Smith believes Jones owns a Ford (based on evidence). Smith infers 'Jones owns a Ford or Brown is in Barcelona.' Brown is in Barcelona, but Jones does not own a Ford."  
  - **Content**: Relies on shared grasp of "justified true belief" (JTB).  
  - **Mirror risk?** Low—knowledge criteria are explicit.  
  - **Stipulation risk?** Medium—"justification" is underspecified, but this *relocates* debate to what counts as justification.  
  - **Best illustrates**: Relocation (Issue 2). It converts "Is Smith’s belief knowledge?" into "What constitutes justification in JTB?"  

  **Reframing Your Terms**  
  - **Expository slack**: Well-drawn, but note it’s not a *flaw*—it’s the space for dialectical engagement.  
  - **Mirror/stipulation modes**: Reject "modes" as binary. Pumps operate on a *spectrum* of reader-author collaboration.  
  - **Specification dilemma**: Redescribe as the *collaboration challenge*: How much authorial constraint optimises insight?  

  **Final Abstract Statement**  
  "Thought experiments evade the specification dilemma not as evidence-generators but as commitments-revealers, where expository slack enables the relocation of disagreement from verdicts to relevance criteria."  
  **Strongest objection**: "This concedes that pumps cannot resolve disputes where readers lack shared conceptual starting points, rendering them circular in foundational debates."  

  ---  
  **British English compliance**: Checked (e.g., "praiseworthy", "smuggle in").
