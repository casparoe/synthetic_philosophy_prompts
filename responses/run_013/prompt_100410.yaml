prompt: |-
  Okay so I write novels for a living and I keep noticing that my characters end up in fights about who's allowed to be angry at who, and I've started keeping a list of my own gut reactions to real-life versions of these scenes, and the list doesnt hang together. Help me out.

  Case 1: My uncle cheated on his wife for years. Now he's constantly going after his brother for cheating. My gut: he has no standing, he should shut up, and it makes me furious.

  Case 2: A friend of mine is a recovering alcoholic, five years sober with a couple slips. She told another friend she's worried about his drinking. My gut: totally fine, more than fine, she of all people gets to say it.

  Case 3: A tenant is behind on rent. The landlord is also months behind on his own mortgage and has been for years. Landlord lectures the tenant. My gut: he should still get his rent! But as a moral lecture it's worthless, I don't feel the tenant owes him an apology, just money.

  Case 2 and case 3 look alike to me and I feel them differently. Why does the alcoholic get standing and the landlord not?

  Case 4: Someone who lies constantly for fun calls out a politician for lying. My gut: no standing, and yet I think the politician's lie is still bad, and if the liar were the only witness I'd want him to speak up anyway. So the no-standing thing isnt about whether the claim is true.

  Case 5: A woman who was assaulted confronts her attacker. Obviously standing. (She's also cruel to her own sister, but that seems irrelevant to the standing question, which is itself weird.)

  Case 6: My tentative rule was 'you can only blame someone for a rule you're keeping yourself.' Then I thought about my ex-smoker friend who quit and is now insufferable about other people smoking -- I want to say she has standing even though she's a bore, and the rule agrees, fine. But then case 1: my uncle has technically stopped cheating (got caught, stopped). By my rule he'd have standing now, and I still say he doesn't. So the rule is wrong.

  What principle actually gets cases 1-5? And what does it say about the one I keep flip flopping on: a guy who is genuinely trying to be better, in therapy, but keeps relapsing into the same cruelty toward his partner, and he tells his friend she's being cruel to her partner. Does he get to say it? Also tell me which of my verdicts has to go, because I suspect at least one does.
reasoning: |-
  Okay, the user writes novels and is struggling with characters arguing over who has the moral standing to criticize others. They provided six real-life cases where their gut reactions conflict, and they can't find a consistent principle. Let me start by understanding each case.

  In Case 1, the uncle who cheated is now criticizing his brother for cheating. The user feels he has no standing. Case 2, a recovering alcoholic comments on another's drinking, which the user thinks is valid. Case 3, a landlord behind on his mortgage lectures a tenant for late rent. The user thinks the landlord can demand rent but lacks moral standing. Case 4, a habitual liar calls out a politician's lie—no standing, but the lie is still bad. Case 5, an assault victim confronts her attacker, clear standing despite her being cruel to her sister. Case 6 breaks their initial rule that you can only blame someone for a rule you follow, as the ex-smoker has standing but the uncle (who stopped cheating) doesn't.

  The user wants a unifying principle. They also mention a flip-flop case: someone in therapy who relapses into cruelty but calls out a friend's cruelty. Does he have standing?

  First, I need to identify why some have standing and others don't. The user's gut reactions suggest that hypocrisy isn't the only factor. For example, the alcoholic has standing despite past slips, while the landlord doesn't. What’s different? The alcoholic's history gives her insight and credibility on the harm of drinking. The landlord's financial irresponsibility undermines his moral authority on rent obligations.

  Then there's the difference between current behavior and past. The uncle stopped cheating but his past betrayal makes his criticism feel hypocritical. The ex-smoker quit, so she's adhering to the rule now. But why does she have standing while the uncle doesn’t? Maybe because the uncle's criticism seems self-serving or lacks empathy, while the ex-smoker's comes from a place of concern.

  Also, in Case 5, the victim's cruelty to her sister is irrelevant to her standing regarding her assault. That suggests that standing might be issue-specific. Past actions related to the same issue affect credibility, but unrelated flaws don't.

  The key factors seem to be: **Source of Credibility** (lived experience, expertise, current adherence), **Motivation** (genuine concern vs. self-righteousness), and **Current Behavior** (whether they're actively struggling or reformed). 

  Applying this to the flip-flop case: the man in therapy who relapses into cruelty. His lived experience gives him insight into cruelty, but his ongoing relapses might undermine his moral authority. If he speaks from a place of shared struggle and humility, he might have standing. If he's self-righteous, he doesn't. So it depends on how he frames it.

  The user also asked which verdict might be wrong. In Case 3, the landlord demanding rent is a contractual right, but moral standing to lecture is separate. The user's verdict holds. Case 4: the liar calling out a politician—no standing, but the lie is still bad. That seems consistent. The user might need to accept that standing doesn't affect the truth of the criticism.

  In Case 1, the uncle's lack of standing is justified because his past cheating was prolonged and harmful, and his criticism lacks empathy. Even though he stopped, his credibility is tarnished. So the user's initial rule needs refinement beyond current adherence.

  The unifying principle is **Moral Credibility**: a combination of relevant experience, current relationship to the rule, and intent. The ex-smoker has credibility because she quit and speaks from concern. The alcoholic has insight from her struggle. The landlord’s hypocrisy in financial responsibility removes his moral high ground. 

  So for the flip-flop case, the man has potential standing if he speaks with humility about his own struggles, not from a position of superiority. If he’s judgmental, he lacks standing. It’s about how he communicates, not just his history.
answer: |-
  You've hit on one of the thorniest questions in moral philosophy: **hypocrisy vs. moral standing**. Your gut reactions are *mostly* consistent if we reframe the principle away from "following the rule" and toward **credibility through lived experience, intent, and current relationship to the harm**. Here's a breakdown:

  ### The Core Principle: **Moral Credibility**
  Someone has standing to criticize when their **lived experience with the specific harm** grants them unique insight *and* they speak from a place of **constructive intent** (not self-righteousness, deflection, or cruelty). Crucially, **active perpetuation of the same harm destroys credibility**, while past struggles *can* enhance it if framed with humility.

  ### Applying This to Your Cases:
  1. **Uncle Cheating → Criticizes Brother**  
     *Your verdict: No standing* ✅  
     *Why:* His years of cheating weren't a "struggle" but active harm. He speaks from hypocrisy, not reformed insight. His intent feels performative (deflecting his guilt), not constructive. *Current relationship to harm*: He only stopped when caught, implying no genuine growth.  
     **Key Factor**: Active perpetuation of harm until exposed.

  2. **Recovering Alcoholic Worries About Friend’s Drinking**  
     *Your verdict: Has standing* ✅  
     *Why:* Her addiction gives her deep insight into the harm. Her intent is concern (warning, not shaming). Her slips show she speaks from solidarity, not superiority. *Current relationship to harm*: Actively fighting it, not causing it.  
     **Key Factor**: Lived experience + constructive intent.

  3. **Landlord (Behind on Mortgage) Lectures Tenant**  
     *Your verdict: Can demand rent, but no moral standing* ✅  
     *Why:* His financial irresponsibility *directly parallels* the tenant’s. He’s committing the same fault (defaulting on obligations) but from a position of power. Intent isn’t concern—it’s self-interest. *Current relationship to harm*: Actively causing the same harm (defaulting) to his bank.  
     **Key Factor**: Actively perpetuating the same harm he condemns.

  4. **Habitual Liar Calls Out Politician’s Lie**  
     *Your verdict: No standing, but the lie is still bad* ✅  
     *Why:* The liar has no credibility because they *revel* in causing the harm (lying for fun). Their intent isn’t truth—it’s manipulation or amusement. But the *claim itself* can be true independently.  
     **Key Factor**: Intent matters. They don’t oppose lying; they weaponize it.

  5. **Assault Victim Confronts Attacker**  
     *Your verdict: Has standing* ✅  
     *Why:* Unmatched lived experience of the specific harm. Her cruelty to her sister is irrelevant because it’s a *different harm*. Intent (seeking justice) is tied to the act.  
     **Key Factor**: Direct victimhood grants unique standing for that specific harm.

  6. **Ex-Smoker Criticizes Smokers**  
     *Your verdict: Has standing (even if annoying)* ✅  
     *Why:* She has insight from overcoming the addiction. Her intent may be proselytizing, but it stems from genuine belief in the harm. *Current relationship*: Not smoking → not causing harm.  
     **Key Factor**: Reformed status + relevant experience.

  ---

  ### Why Cases 2 & 3 *Feel* Different (Alcoholic vs. Landlord):
  - **Alcoholic**: Speaks from **solidarity** ("I know this hell; avoid it").  
  - **Landlord**: Speaks from **hierarchy** ("My failing is excusable; yours isn’t").  
  The alcoholic’s past harm *qualifies* her; the landlord’s current harm *disqualifies* him.

  ---

  ### Your Flip-Flop Case:  
  **"Guy in therapy for cruelty relapses but calls out friend’s cruelty."**  
  - **Standing? Context-dependent:**  
    - ✅ **If he says**: "I keep failing at this too, but I see your behavior harming X, and here’s why..."  
      *(Shares insight, owns struggle, constructive intent)*  
    - ❌ **If he says**: "You’re abusive, unlike me!"  
      *(Ignores his relapses, self-righteous, deflects from his guilt)*  
    **Principle**: His lived experience *could* grant credibility, but **active relapse destroys standing** unless he centers his own fallibility. He must speak as a fellow failing human, not a judge.

  ---

  ### Which Verdict Might Need Revisiting?
  Your judgments are consistent *except* **Case 1 vs. Case 6** (Uncle vs. Ex-Smoker). You reject the uncle even though he "stopped cheating," but accept the ex-smoker. **This is correct**—and here’s why:  
  - **Ex-Smoker**: Quit through personal effort; her criticism aligns with her current values.  
  - **Uncle**: Stopped only after being caught; his criticism feels like *projection*, not growth.  
  **The difference is in the narrative of change**. The uncle hasn’t rebuilt trust or shown remorse; he’s weaponizing morality to deflect shame. The ex-smoker, while annoying, embodies the change she advocates.

  ---

  ### The Unified Framework:  
  | **Case** | **Lived Experience** | **Current Harm** | **Intent** | **Standing?** |  
  |----------|----------------------|------------------|------------|---------------|  
  | 1 (Uncle) | High (but exploitative) | Stopped (no atonement) | Self-serving | ❌ |  
  | 2 (Alcoholic) | High (painful) | Fighting | Protective | ✅ |  
  | 3 (Landlord) | Parallel (defaulting) | Actively doing same | Self-righteous | ❌ |  
  | 4 (Liar) | High (but enjoys harm) | Actively lying | Manipulative | ❌ |  
  | 5 (Victim) | Highest (direct target) | Not causing | Justice-seeking | ✅ |  
  | 6 (Ex-Smoker) | High (overcame) | Not causing | Prosocial (if overzealous) | ✅ |  

  ### For Your Novels:
  - **Drama Tip**: Have characters challenge not the *truth* of criticism, but the speaker’s *right to deliver it*. ("You don’t get to say that *to me*.")  
  - **Flip-Flop Case Resolution**: The relapsing man only has standing if he admits his failures *first*. His credibility hangs on vulnerability, not authority.  
  - **Realism**: People often grant standing based on **likability** (your ex-smoker friend) or **identity** (the assault victim), even if logic is fuzzy. Lean into that.

  This isn’t about purity—it’s about whether the critic’s relationship to the harm *adds weight* or *exposes hypocrisy*. Your instincts are sharper than your rule; trust the tension.
