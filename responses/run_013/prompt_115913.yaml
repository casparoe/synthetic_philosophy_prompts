  They want stress-testing of their hypothesis and clarity on what progress would look like.

  Now, diving deeper. The user's role as a science writer matters. They need to translate philosophical nuances for a general audience without oversimplifying. Their frustration suggests they've heard the same arguments repeatedly and suspect hidden assumptions are stalling progress. They might want tools to frame this debate more productively in their writing.

  Key insights:
  The crux isn't neuroscience but metaphysics and epistemology. Epiphenomenalists prioritize physical closure (no non-physical causes) and see reliability as sufficient for knowledge. Critics demand conscious states play explanatory roles in cognition.

  The binocular rivalry example is telling. The researcher's response aligns with methodological epiphenomenalism—treating reports as data points without endorsing ontological claims. This hints at a possible path forward: decoupling methodology from metaphysics.

  Progress might involve:
  - Clarifying if the debate is about causation or explanation (e.g., do we need consciousness to explain behavior, or just neural mechanisms?).
  - Exploring alternative frameworks like illusionism or non-reductive physicalism that avoid the paradox.
