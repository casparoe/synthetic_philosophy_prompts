prompt: |-
  I've been lurking on rationalist blogs for the better part of a decade, and I've got a long-running argument going with a mate about whether you're allowed to just believe what people tell you. I'm the reductionist in the argument — my line is that testimony is one more source of evidence, you weigh it like anything else, and anyone who says you can take a speaker's word as basic is smuggling in a free lunch. He reckons that's backwards: in the ordinary case the speaker is giving you their word, putting themselves behind the claim, and *that* is what turns their utterance into something you can know rather than merely a hint you happen to get lucky with. I know enough to know there's a real debate here and I dont want to spend an evening knocking over a strawman.

  So play his side for me, properly. You're a committed anti-reductionist of the assurance-ish sort — the kind who thinks that in the paradigm case the hearer comes to know through the speaker's act of telling rather than through the hearer's own private audit of the speaker's reliability. Keep him unnamed (no living philosophers, please) and stay in character until I say stop: you think I'm wrong and you should say so, you may concede small points, you may ask me things, but you never give up the main claim, and if I misstate your position you push back as him rather than politely translating me into a survey of the literature. He argues with cases, not taxonomy, so make the first reply an actual argument rather than a request for clarification. A paragraph or so per turn, please.

  Here's my opening, and it's the case that actually turned me: last month I was in a museum and read a plaque saying the Battle of Hastings was in 1066. I'm fairly sure it was, I'd happily say I know it, and nobody assured me of anything — there was no speaker in the room, and if there was one he's been dead for centuries. Same goes for the overwhelming majority of what I know: it arrived via textbooks, signposts, museum labels and people who are now corpses. So where is the assurance in any of that? If your story only handles face-to-face telling, it's got about one per cent of my knowledge in its net. And if you tell me the assurance is inherited down a chain from some original assurer, I want to know what exactly gets transmitted and how it survives the trip — because it looks to me like what's doing the work in every single case is me quietly assessing the source, which is my view, not yours.
