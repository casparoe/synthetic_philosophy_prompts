  The user's opening case involves a museum plaque stating the Battle of Hastings was in 1066. They point out there's no living speaker, and most knowledge comes from impersonal sources like textbooks or signs. They challenge how assurance can apply here, especially if it's inherited through a chain, and suspect that their own assessment of the source is what matters.

  To argue effectively as the anti-reductionist, I need to address the museum case head-on. The key is to show that even in impersonal contexts, the social practice of assurance is still foundational. The plaque isn't just evidence; it's part of an institutional system where experts vouch for the information. When the user reads it, they're relying on that system's commitment to accuracy, not personally verifying each fact.

  For the inheritance of assurance, I'll explain it as a chain of trust. The original historian's assurance gets embedded in the institution's reputation. When the museum displays the date, they're re-assuring visitors based on that chain. The user doesn't need to audit every link because the institution stands behind the information. This is different from mere evidence assessment; it's about participating in a knowledge-sharing practice.

  I should avoid mentioning specific philosophers since the user requested no living names. Instead, I'll focus on concrete examples and analogies. The tone needs to be firm but not hostile—"he" is a friend after all, so the pushback should be principled but collegial. I'll concede small points where necessary but hold the core position that testimony creates knowledge through social acts, not individual verification.

  The user seems well-versed in the debate, so I'll skip basic explanations and dive into defending against their strongest objection. They're testing whether anti-reductionism can handle real-world knowledge, so I'll emphasize how social systems scale assurance beyond face-to-face interactions. The museum case is perfect for this—it's impersonal but still relies on human accountability.
answer: |-
  Right. Your plaque case is clever, but it misses the point spectacularly. You're staring at the *artifact* – the dead words on metal – and asking where the *act* is. But the plaque isn't magic. It's a *stand-in*, a crystallized piece of a vast, living social practice of telling and trusting. That plaque exists *because* someone, some curator or historian acting *for the museum*, commissioned it, checked it (or trusted the checking system), and put it there *precisely* to tell you, the visitor. It's an institutional assurance.

  Think of it like a signature on a cheque. The ink is dried, the signer might be dead, but that mark only has meaning *because* it was made within a system of promise and obligation. You cash it *because* the bank recognizes the institution and the practice behind the signature, not because you personally audited the signer's finances. The plaque is the museum's signature on the claim "1066". They're putting their institutional reputation behind it. You accept it *as* an assurance because you understand that practice. You're not "quietly assessing" the curator's reliability in isolation; you're recognizing the *kind of thing* a museum plaque *is* within our shared world – a thing designed for telling.

  And the chain? It's not some ghostly essence floating around. It's the concrete history of *people vouching for people*. The original chronicler told his audience. Later historians built on that, citing sources, *staking their own reputations* on the accuracy of prior tellings. The textbook author relies on those historians, the museum researcher relies on the textbooks or primary sources, the curator relies on the researcher. Each link involves someone saying, effectively, "I stand by this, based on those who stood by it before me." Your epistemic right to believe the plaque *derives* from that ongoing chain of *acts of telling* and *acceptance of responsibility*, embedded within institutions (like academia, publishing, museums) designed to maintain trustworthiness. You trusting the plaque *is* you accepting the latest link in that chain of assurance. It's not *you* doing the primary justificatory heavy lifting; it's you recognizing and participating in the social practice *founded* on speakers giving their word. You take the museum's word for it, precisely *because* it's their word, backed by the chain. Stop looking for the individual assurer *in the room* and see the social act *in the system*. So, no, you didn't just get lucky. You knew because the institution told you, fulfilling its assurance role. Your move.

  *(Staying firmly in character as your anti-reductionist mate: confident, focused on the act within the social practice, pushing back hard on the reductionist "private audit" interpretation of the plaque and the chain, framing inheritance as concrete acts of vouching within accountable systems.)*
