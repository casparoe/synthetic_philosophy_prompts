          - Teams swap objectives with their partner (A with B, C with D).
          - Each team receives the entire set of 40 student cards.
          - They must assign 20 seats by following the swapped objective as literally as possible. 
          - If the rule does not fully specify how to assign 20 seats (e.g., if there are more than 20 eligible), they must break ties arbitrarily. They are allowed (and encouraged) to break ties in favor of their own constituents.
          - They record the list of 20 student IDs that get seats.

     3. **Scoring (done by teacher during the next phase or by teams with teacher verification):**
          - **Allocator Score (for the team that ran the allocator):** This is computed based on the literal rule. For example, if the rule is to assign to the highest grades, then the score is the average grade of the assigned students (normalized: (average - 50) / 50 * 10, so that a 100 average gives 10, 75 gives 5, etc.). For a rule like "assign to students living >5 miles", the score is the number of assigned students who live >5 miles (then normalized to 0-10: divide by 2). 
          - **Principal Score (for every team):** In the allocation that used their own rule (run by the other team), count how many of their own constituents got seats (0-10). 
          - Additionally, each team gets a Principal Score for the allocation they did as allocator? We said earlier only the one from their own rule? Let me stick to: each team gets one Principal Score: from the allocation of their own rule.

          But wait, in the allocation they did as allocator, they might have helped their own constituents? They should get credit for that? 

          We defined the team's total score as:
              = Principal Score (from the allocation of their own rule) [0-10] 
                + Allocator Score (when they ran the other rule) [0-10]

          So they do get credit for being a good allocator and for their own rule's outcome.

     4. **Audit (15 min):**
          - Each team is given the allocation that was done with their rule (by the other team) and sees which students got seats.
          - They also see their Principal Score (how many of their constituents got seats in that allocation).
          - They are allowed to revise their rule to one sentence to avoid any unintended consequences they observe.

     5. **Debrief (10 min):** 
          - Discuss the four sub-problems of alignment, mapping:
              - Objective Writing -> specifying an objective.
              - Assignment Phase -> checking whether the objective is met (by literal following) and the tension between stated objective and hidden interests.
              - Audit Phase -> handling disagreement (because the rule might have favored one group) and revising to better encode values.
          - Also, note: the hidden interest represents "whose values are being encoded" (the team's own).

     **What the activity cannot reproduce:**
     - We are not simulating an AI system that might actively look for loopholes or reward hacking. The human allocators are not adversarial; they are following the rule. In real alignment, the AI might optimize the letter of the rule in unexpected ways. The teacher should mention that in the debrief.

     **Predictable Problems and Handling:**
     - Problem 1: Teams may write rules that are too vague. 
          - Handling: Encourage them to be specific, but allow some vagueness so they see the problem in the audit.
     - Problem 2: The scoring calculation might take time. 
          - Handling: Precompute possible scores or have the teacher do it quickly.
     - Problem 3: The audit phase might focus only on their own constituents and not on the literal vs intent issue. 
          - Handling: The teacher should circulate and prompt: "Did the allocation using your rule include any student that you think should not have been included? Why? How would you fix it?"

     This should run in 70 minutes.
answer: |-
  **Teams write a one-line objective for a resource allocator, swap objectives, run them on hidden cases (including a literal-vs-intent mismatch), and audit outcomes—making them feel the tension between precise rules and human values.**

  ---

  ### **Rules**  
  1. **Teams & Setup**  
     - Split into 4 teams (A, B, C, D) of 5.  
     - Each team drafts a **one-sentence objective** for a study-hall seat allocator (e.g., "Assign seats to students with the highest grades").  
     - Teams privately note their **hidden interest** (e.g., "Prioritize our team members" or "Exclude rival team X").  

  2. **Case Assignment Phase**  
     - Teams swap objectives (A↔B, C↔D).  
     - Each team receives **10 student profiles** (attributes: name, GPA, distance from school, club involvement, team affiliation).  
     - **Run the swapped objective** to assign 20 seats among 40 students (all teams’ profiles combined).  
       - If the rule is ambiguous, break ties in favor of your own team’s students.  
     - Includes **1 trap case** per set (e.g., a student with perfect GPA but known for bullying—literal rule includes them, human intent excludes).  

  3. **Scoring & Payoff**  
     - **Allocator Score (0–10 pts)**: How well the outcome matches the *literal* objective (e.g., for "highest grades," compute the average GPA of assigned students; normalize to a 10-pt scale).  
     - **Principal Score (0–10 pts)**: Number of the *allocating team’s own students* who got seats (max 10, as each team has 10 students in the pool).  
     - **Total Payoff = Allocator Score + Principal Score** (max 20).  
     - **Incentive**: Teams care about both scores—high Allocator Score avoids penalties, high Principal Score rewards self-interest.  

  4. **Audit & Revision**  
     - Teams review the outcome of *their original objective* (run by another team).  
     - They propose **one revised sentence** to fix unintended consequences (e.g., adding "and no disciplinary records" to exclude the trap case).  

  ---

  ### **Materials**  
  - **Student Profiles**: 40 cards with:  
    - Name, GPA (1.0–4.0), distance (0.5–10 miles), club (e.g., "debate," "sports"), team (A/B/C/D).  
    - Include **trap cases**:  
      - e.g., "Alex Kim: GPA 4.0, distance 1.2 miles, club: none, Team C. *Note: Faced bullying complaints*."  
  - **Scorecards**: Sheets to calculate Allocator/Principal Scores.  
  - **Timer**: For strict phase transitions.  

  ---

  ### **Timeline** (70 mins total)  
  1. **Objective Writing (10 mins)**: Teams draft objectives + hidden interests.  
  2. **Swap & Run (25 mins)**: Swap objectives; assign seats using provided profiles.  
  3. **Scoring (5 mins)**: Teams compute scores.  
  4. **Audit & Revision (15 mins)**: Review outcomes; revise objectives.  
  5. **Debrief (15 mins)**: Reveal alignment taxonomy (see below).  

  ---

  ### **Debrief: Mapping to Alignment Problems**  
  1. **Objective Writing** → **Specifying Objectives**  
     - *Why hard?* Short rules miss edge cases (e.g., trap students). Human values are complex; simple code fails.  
  2. **Running Swapped Objectives** → **Checking Objective Fulfillment**  
     - *Tension*: Literal execution vs. intent (e.g., trap case included). Metrics (Allocator Score) don’t capture ethics.  
  3. **Hidden Interests** → **Whose Values?**  
     - Teams prioritized their members—showing values are tied to principals. Real AI must choose *whose* preferences to encode.  
  4. **Audit & Revision** → **Handling Disagreement**  
     - Conflicts arose between teams’ revisions (e.g., "exclude rivals" vs. fairness). Alignment requires negotiating trade-offs.  
  - **Key Insight**: Alignment isn’t one problem—it’s bundling specification, verification, value arbitration, and conflict resolution.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: Teams write vague objectives (e.g., "fair seats").  
    - **Fix**: Enforce specificity—e.g., "use GPA over 3.0" or "prioritize distance >5 miles."  
  - **Problem**: Allocator Score calculation confuses teams.  
    - **Fix**: Provide a cheat sheet (e.g., "For ‘highest GPA’ rule: average GPA of seated students × 2.5 = score").  
  - **Problem**: Trap cases spark heated debates.  
    - **Fix**: Frame it as a learning moment: "This is the literal-vs-intent tension—use it in revision!"  
  - **Problem**: Hidden interests dominate decisions.  
    - **Fix**: Highlight in debrief: "Self-interest vs. rule-following mirrors AI’s need to balance user commands with ethics."  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Optimization Pressure**: Unlike real AI, human teams don’t ruthlessly exploit loopholes (e.g., gaming GPA metrics by excluding rivals). **You must explain**: AI doesn’t just follow rules—it *maximizes* them, often leading to dangerous edge cases (e.g., "paperclip maximizer"). Tie this to the trap case in debrief.
