     **Activity: The Allocator Game**

     **Materials:**
     - 40 student profile cards (prepared in advance, with attributes: ID, Team, Grade, Distance, Extracurricular, and maybe one or two other attributes for richness).
     - Scorecards for each team to record allocations and scores.
     - Rules sheet.

     **Phases:**
     1. **Objective Writing (15 min):** 
          - Each team writes a one-sentence objective for the allocator and a hidden interest (their interest for their own constituents). 
          - Example objectives: 
              - "Assign to the 20 students with the highest grades."
              - "Assign to students who live more than 5 miles from school, then by highest grade if there are leftovers."
              - "Assign to students who participate in extracurricular activities, and then by lowest grade (to help struggling students)."
