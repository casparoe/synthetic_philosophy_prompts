prompt: |-
  I lead a small team that translates our written compliance policies into executable checks. The checks run nightly against transaction and case data, and anything they flag lands in a human review queue; a false positive costs queue capacity and a false negative costs us regulatory exposure. I convert roughly forty rules a quarter, I get about two hours per rule, and my only colleagues are three engineers and one lawyer. I have spent enough evenings in the blogosphere's heaps-and-bald-men threads to be convinced that the interesting fact about vague predicates is not that we cannot see where the line falls, but that some of them may have no line to fall — and I now need that distinction to pay rent rather than just be interesting.

  Write me a procedure for handling a vague predicate in a rule we are about to compile: 'promptly', 'reasonable', 'material', 'substantially similar', 'without undue delay'. I want it in order — the tests to run, what counts as passing or failing each, where the procedure returns a no, and where it stops and hands the decision to a person. It should keep apart things we currently conflate: genuine vagueness, ambiguity, context-dependence, and a term that is perfectly precise but simply does not reach a case the drafters never imagined. It should say when a bright-line threshold is a faithful sharpening of the predicate and when it is a silent amendment of the rule, and give me a way to measure that — some test over the range of thresholds a fair-minded reader could accept, and what flip rate across our own past adjudications means we may compile, versus what means we may not. Where a step presupposes one of the two main theories rather than the other — epistemicism, on which there is a line we merely cannot locate, versus the supervaluationist picture, on which a statement is true on every admissible sharpening, or on none, and the remainder is left to be settled — say so and fork there, because the sign-off requirements differ: one exit is filling in an unknown and needs evidence and a revisit date, the other is a policy choice and needs the policy owner and legal. Flag which steps are judgments wearing procedural clothing, and note that the text itself is not cheap for us to reopen.

  Then apply it to three rules: a duty to notify compliance 'promptly' upon discovery of a reportable incident; a prohibition on 'material' misstatements in a client disclosure; and a data-classification rule whose term must be applied to a technology the drafters did not anticipate. For each, give me the exit the procedure selects, the artifacts it leaves behind, and who signs. Include at least one where the honest answer is that we cannot automate the rule and must keep a human queue — the outcome my program exists to reduce — and do not soften it. Close with where the procedure will misfire: multidimensional predicates, cases where the admissible sharpenings cannot be enumerated without begging the question, and anything else it cannot deliver, followed by a one-page version my engineers can keep at their desks.
reasoning: |-
  We are given a procedure to design for handling vague predicates in compliance rules when compiling them into automated checks. The procedure must distinguish between:
  - Genuine vagueness (borderline cases, no sharp line)
  - Ambiguity (multiple meanings)
  - Context-dependence
  - Unforeseen cases (term precise but not covering a new situation)

  We are also to consider two theories: epistemicism (there is a sharp line we don't know) and supervaluationism (truth on all admissible sharpenings).

  We need tests to decide when to:
  - Automate with a bright-line threshold (and when that is a faithful sharpening vs. a silent amendment)
  - Hand the decision to a human
  - Return a "no" (meaning we cannot automate)

  We are to measure the flip rate (across past adjudications) to decide on the threshold.

  The procedure must be step-by-step and then applied to three examples.

  Additionally, we note that the text is not cheap to reopen.

  Let's design the procedure.

  **Procedure for Handling a Vague Predicate**

  **Input**: A rule containing a vague predicate (e.g., 'promptly', 'reasonable', 'material', 'substantially similar', 'without undue delay') and the context of the rule (the data it applies to, past adjudications, etc.)

  **Output**: One of:
  1. A compiled check (with a specific threshold or algorithm) and documentation of the justification (including the threshold chosen and any limitations).
  2. A decision that the rule must be handled by a human queue, with documentation of the reasons.
  3. A "no" (meaning we cannot automate at this time, and the rule must be revisited when more information is available).

  **Steps**:

  1. **Disambiguate and Clarify Context**:
     - Check for ambiguity: does the term have multiple distinct meanings? (e.g., "light" can mean not heavy or not dark). If so, consult the policy owner and legal to choose the intended meaning. Document the resolution.
     - Check for context-dependence: does the meaning change with context? (e.g., "promptly" in a nuclear meltdown vs. a routine report). If context is missing in the data, we may need to infer or collect additional context. If we cannot, flag for human review or gather the context.
     - Check for unforeseen cases: if the term is being applied to a situation the drafters did not anticipate (e.g., a new technology), consult the policy owner and legal for an interpretation. Document the interpretation.

  2. **Determine if the Term is Vague**:
     - If after disambiguation and context handling, the term still has borderline cases (i.e., cases where competent speakers would disagree on whether the term applies), then we have genuine vagueness. Proceed to step 3.
     - If the term is not vague (i.e., it has a precise meaning in the context, or the ambiguity and context issues were resolved leaving no borderline cases), then we can define a precise check. Proceed to step 6.

  3. **Theoretical Fork: Epistemicism vs. Supervaluationism**:
     - We must decide which theory we are operating under. This decision will be guided by the policy owner and legal, but the default for regulatory compliance is often supervaluationism (because it allows for multiple admissible interpretations and avoids the risk of drawing an arbitrary line that might be challenged). However, if the policy owner and legal believe there is a fact of the matter (epistemicism), then we proceed accordingly.
       - **Epistemicism**: There is a sharp boundary, but we don't know it. We must find evidence to estimate it. Proceed to step 4.
       - **Supervaluationism**: The term is true if true on every admissible sharpening, false if false on every admissible sharpening, and neither otherwise. We must identify the set of admissible sharpenings. Proceed to step 5.

  4. **Epistemicism: Finding the Sharp Boundary**:
     - Gather evidence: look at past adjudications (human decisions) on cases that fell near the boundary. We are looking for a threshold that minimizes false positives and false negatives relative to the true boundary. However, since we don't know the true boundary, we use the adjudications as a proxy.
     - Analyze the data: plot the adjudicated outcomes against a measurable feature (e.g., time for "promptly"). Look for a threshold that best separates the positive and negative cases. Use a ROC curve or similar to choose a threshold that balances sensitivity and specificity.
     - Measure the flip rate: if we vary the threshold within the range that a fair-minded reader might accept (say, from the 5th to the 95th percentile of the time taken in past cases that were adjudicated as "prompt"), what percentage of past cases would flip (change outcome)? If the flip rate is low (e.g., <5%) then we can choose a threshold within that range (e.g., the median) and document it as a reasonable estimate. If the flip rate is high (e.g., >20%), then the boundary is too uncertain and we cannot automate without policy change. Proceed to step 7.

  5. **Supervaluationism: Identifying Admissible Sharpenings**:
     - Define the range of admissible sharpenings: consult with the policy owner, legal, and subject matter experts to define a set of thresholds (or criteria) that are considered acceptable interpretations of the vague term. For example, for "promptly", they might agree that between 1 and 7 business days is admissible.
     - Check for consistency: if the rule must hold for every admissible sharpening, then we can only flag a case as a violation if it fails every admissible sharpening. Similarly, we can only clear a case if it passes every admissible sharpening. Cases in between must be flagged for human review.
     - If the set of admissible sharpenings is not enumerable (or too complex) then we may not be able to automate. Proceed to step 7.

  6. **Defining the Check**:
     - If we have a precise meaning (from step 2) or a threshold (from step 4 or 5), then we can write the check. Document the chosen threshold and the justification.

  7. **Decision on Automation**:
     - If we have a clear threshold (step 4 with low flip rate) or a clear set of admissible sharpenings (step 5 with a manageable set) then automate with the check.
     - If the flip rate is high (step 4) or the set of admissible sharpenings is too broad or unmanageable (step 5) then we cannot automate and must use a human queue.
     - If the term is context-dependent and the context is not available in the data, then we may need to design a check that uses proxy data or flags for human review when context is missing.

  8. **Documentation and Sign-off**:
     - For a threshold chosen under epistemicism (step 4): document the evidence (past cases, flip rate) and set a revisit date (e.g., in 6 months) to update with new data. Sign-off by the policy owner and legal (since it's an estimate that might need updating).
     - For a threshold or rule defined under supervaluationism (step 5): document the admissible sharpenings and the logic for flagging only when every sharpening fails (or passes). Sign-off by the policy owner and legal (as a policy choice).
     - For a human queue decision: document the reasons (high flip rate, unmanageable admissible set, missing context, etc.). Sign-off by the team lead (you) and the policy owner.

  **Application to Three Rules**:

  **Example 1: Duty to notify 'promptly' upon discovery of a reportable incident**

  - Step 1: The term 'promptly' is context-dependent (e.g., severity of incident) and vague. We note that context (severity) may be available in our data. We'll use incident severity as context.
  - Step 2: It's vague (borderline cases exist).
  - Step 3: We'll assume supervaluationism (common in compliance) unless directed otherwise.
  - Step 5: We consult with the policy owner and legal. They define admissible timeframes by severity:
     - Critical severity: 1-24 hours
     - High severity: 24-48 hours
     - Medium severity: 2-5 days
     - Low severity: up to 10 days
  - We can automate by:
     - Flagging as violation only if the notification time exceeds the maximum admissible time for the given severity.
     - Clearing only if within the minimum admissible time.
     - Otherwise, send to human review.
  - Step 7: We can automate with a check that uses severity and time. The check will have three outcomes: pass (within min), fail (exceeds max), and review (in between).
  - Step 8: Document the admissible ranges and the logic. Sign-off by policy owner and legal.

  **Example 2: Prohibition on 'material' misstatements in a client disclosure**

  - Step 1: 'Material' is vague and context-dependent (depends on the client, the product, etc.). We have data on the size of the misstatement and the client's assets/transaction size.
  - Step 2: Vague.
  - Step 3: We'll use epistemicism? In finance, materiality is often quantified (e.g., 5% of income). But let's assume we are to follow the legal definition which is supervaluationist? Actually, accounting standards often set thresholds, so we might go epistemic.
  - However, we are instructed to fork by theory. Since the rule is a prohibition, we may want to be conservative. Let's do both:

    Option: We choose epistemicism because there is a body of evidence (past cases, regulatory guidance) that suggests a threshold.

  - Step 4: Gather past adjudications of material misstatements. We have a dataset of misstatements with the dollar amount and the client's total assets (or revenue). We compute the relative size (misstatement / total assets). We plot past decisions (material or not) against relative size. We find that a threshold of 1% relative to assets has a flip rate of 15% when we vary between 0.5% and 1.5% (a range a fair-minded reader might accept). Since 15% is moderate, we might still automate but with caution. However, 15% is above our ideal (we wanted <5% or <10%). We decide to set a threshold at 1% but also note that cases between 0.8% and 1.2% go to human review? But that's not pure epistemicism.

    Alternatively, we might choose supervaluationism:

  - Step 5: Consult with legal. They say that admissible thresholds are between 0.5% and 2% of total assets. Then:
     - If the misstatement is above 2%, it's definitely material -> flag.
     - If below 0.5%, not material -> clear.
     - In between, human review.

  - Step 7: We choose the supervaluationist approach to be safe. We can automate with the two thresholds (0.5% and 2%) and a review queue for the middle.
  - Step 8: Document the thresholds and the admissible range. Sign-off by policy owner and legal.

  **Example 3: Data-classification rule applied to a technology the drafters did not anticipate**

  - The rule: data must be classified as "confidential" if it contains [list of types]. The new technology is a collaboration tool that stores data in a novel way (e.g., a messaging app with ephemeral messages).
  - Step 1: The term in question is the list of types (e.g., "customer financial information"). We are facing an unforeseen case: the drafters did not anticipate this technology. The data in the new technology might not fit the existing types.
  - Step 2: The existing types are precise, but the new technology's data might not be covered. This is not vagueness but extension to a new case.
  - We skip to Step 1: we must consult the policy owner and legal to interpret whether the data in the new technology falls under the existing types. If they say yes, then we can define a precise check (by mapping the new data to the existing types). If they say no, then the rule does not apply? But that might be wrong. Alternatively, they might extend the rule.
  - However, we are not allowed to change the rule text (it is not cheap to reopen). Therefore, we have two possibilities:
     a) The data in the new technology fits the existing types -> we can write a check.
     b) It does not -> then the rule as written does not cover this technology. We cannot enforce it automatically. We must either:
          - Leave it unmonitored (false negative) or
          - Flag for human review (but the rule doesn't apply, so we shouldn't flag).

  - In this case, we decide we cannot automate because the rule does not cover the new technology. We must return a "no" and recommend a rule update.
  - Step 7: We cannot automate. We must use a human queue? But the rule doesn't apply, so we don't want to flag. We might need to create a separate process for the new technology.
  - Step 8: Document that the rule does not cover the new technology. Sign-off by the policy owner and legal. The outcome is that we cannot automate this rule for the new technology until the rule is updated.

  **Where the Procedure Misfires**:

  1. **Multidimensional predicates**: e.g., "reasonable" might involve both time and cost. The procedure might handle each dimension separately, but the interaction (trade-offs) are complex. We may not be able to define a simple threshold.

  2. **Non-enumerable admissible sharpenings**: In supervaluationism, if the admissible sharpenings form a continuum (or a very large set) and cannot be captured by a few parameters, then the check may become too complex.

  3. **Cases where the flip rate is moderate (neither low nor high)**: The procedure might force a binary choice (automate or not) but a middle ground (e.g., a review queue for borderline cases) might be acceptable.

  4. **Lack of past adjudications**: For step 4 (epistemicism) we need data. If there is none, we cannot proceed.

  5. **Theoretical disagreement**: If the policy owner and legal cannot agree on the theory (epistemicism vs supervaluationism) then we are stuck.

  **One-Page Version for Engineers**:

  **Handling Vague Predicates in Compliance Rules**

  1. **Disambiguate**: If the term has multiple meanings, get clarification from policy/legal. If context is missing, try to get it or note that it's missing.

  2. **Is it vague?** If after disambiguation there are borderline cases, it's vague. Else, define the check and stop.

  3. **Choose Theory**:
     - *Epistemicism* (sharp boundary exists): Use past data to find a threshold. Calculate the flip rate (how many past decisions flip when varying the threshold within a reasonable range). If flip rate < 10%, set threshold (e.g., median) and document. If high, go to step 5.
     - *Supervaluationism* (multiple acceptable interpretations): Define the range of acceptable thresholds (e.g., min and max). Then:
          - Violation only if beyond max.
          - Compliant only if below min.
          - Else, human review.

  4. **Unforeseen cases**: If the rule is being applied to a situation the drafters didn't anticipate, consult policy/legal. If the rule doesn't cover it, we cannot automate until the rule is updated.

  5. **Cannot Automate?** If the flip rate is too high (epistemicism) or the admissible range is too wide (supervaluationism) or the context is missing, then we must use a human queue.

  **Sign-offs**:
  - Automated threshold (epistemicism): Policy owner + legal + revisit date.
  - Admissible range (supervaluationism): Policy owner + legal.
  - Cannot automate: Team lead + policy owner.

  **Examples**:
  - 'Promptly': Used severity-based time ranges (supervaluationism) -> pass/fail/review.
  - 'Material': Set two thresholds (0.5% and 2%) -> pass/fail/review.
  - New technology: Rule doesn't cover -> cannot automate.

  **Limits**: Multidimensional terms, non-enumerable ranges, and moderate flip rates may require bespoke solutions.
answer: |-
  ### Procedure for Handling Vague Predicates in Compliance Rules  
  **Goal**: Convert a vague predicate into an executable check or escalate, while distinguishing vagueness, ambiguity, context-dependence, and unforeseen cases. Exit paths: (1) automated check, (2) human queue, or (3) "no" (cannot automate now).  

  ---

  #### **Step-by-Step Procedure**  
  1. **Disambiguate the Term**  
     - **Test**: Identify if the term has multiple distinct meanings (e.g., "material" could mean "significant" or "physical").  
     - **Pass**: One meaning fits all contexts in the rule.  
     - **Fail**: Multiple meanings conflict.  
     - **Exit**: If fail, consult lawyer/policy owner to select one meaning. Document resolution. Proceed to Step 2.  

  2. **Assess Context-Dependence**  
     - **Test**: Does the term’s application depend on external factors (e.g., "promptly" depends on incident severity)?  
     - **Pass**: Context is codified in data (e.g., incident severity exists as a data field).  
     - **Fail**: Context is absent or uncodifiable.  
     - **Exit**: If fail, escalate to policy owner to define proxy data (e.g., "severity = f(impact, urgency)"). If no proxy, proceed to Step 3; else, update context and repeat test.  

  3. **Check for Unforeseen Cases**  
     - **Test**: Is the predicate applied to a scenario the drafters couldn’t anticipate (e.g., new technology)?  
     - **Pass**: The case fits existing definitions (e.g., new tech stores "client data" as defined).  
     - **Fail**: The case has no clear mapping (e.g., ephemeral data in a new messaging app).  
     - **Exit**: If fail, return **"no"**—cannot automate. Requires policy amendment. Sign-off: policy owner + legal.  

  4. **Diagnose Vagueness**  
     - **Test**: Are there borderline cases where competent users disagree on applicability? Use past adjudications.  
     - **Pass**: Clear cases exist; borderline cases are rare (<5% of past adjudications).  
     - **Fail**: Borderline cases are frequent (≥5%).  
     - **Exit**: If pass, define a precise check (e.g., ">5 days = not promptly"). If fail, proceed to Step 5 (vagueness confirmed).  

  5. **Fork: Epistemicism vs. Supervaluationism**  
     - **Judgment**: Consult policy owner + legal to select theory:  
       - **Epistemicism**: A sharp boundary exists but is unknown. Proceed to Step 6.  
       - **Supervaluationism**: Truth depends on "admissible sharpenings." Proceed to Step 7.  

  6. **Epistemicism: Estimate the Boundary**  
     - **Test**:  
       - Define a measurable feature (e.g., "days delayed" for "promptly").  
       - Analyze past adjudications: Plot outcomes (pass/fail) against the feature.  
       - Calculate **flip rate**: Vary thresholds across the "fair-minded range" (5th–95th percentile of past cases). Flip rate = % of cases changing outcome.  
     - **Pass**: Flip rate ≤10%.  
     - **Fail**: Flip rate >10% or insufficient data.  
     - **Exit**:  
       - If pass, set threshold (e.g., median of fair-minded range). Artifact: Threshold report + flip rate analysis. Sign-off: policy owner + legal + revisit in 6 months.  
       - If fail, proceed to Step 8.  

  7. **Supervaluationism: Define Admissible Sharpenings**  
     - **Test**:  
       - With policy owner + legal, define min/max bounds for admissible sharpenings (e.g., "promptly" = 1–7 days).  
       - Check if bounds cover all past adjudications (≥95% consistency).  
     - **Pass**: Bounds are narrow and enumerable (e.g., "material" = 0.5–5% of transaction value).  
     - **Fail**: Bounds are wide (>2× range) or unenumerable.  
     - **Exit**:  
       - If pass, automate:  
         - Flag violation if beyond max bound (e.g., >7 days).  
         - Flag compliance if within min bound (e.g., ≤1 day).  
         - **Human queue** for cases between min/max.  
         - Artifact: Bounds documentation. Sign-off: policy owner + legal.  
       - If fail, proceed to Step 8.  

  8. **Final Exit: Human Queue or Policy Change**  
     - **Test**: Can the rule be partially automated?  
       - Yes: Use automated checks for clear cases; human queue for borderline.  
       - No: High flip rate (Step 6) or unmanageable bounds (Step 7).  
     - **Exit**:  
       - **Human queue**: Document reasons (e.g., "high flip rate: 25%"). Sign-off: team lead + policy owner.  
       - **Silent amendment risk**: If a bright-line threshold is set outside the fair-minded range (Step 6) or admissible bounds (Step 7), it amends the rule. Reject without policy owner + legal approval.  

  ---

  ### **Applications to Three Rules**  
  #### **1. Duty to Notify "Promptly" Upon Discovery**  
  - **Step 1**: "Promptly" is unambiguous (no multiple meanings).  
  - **Step 2**: Context-dependent (severity matters). Severity data exists → Pass.  
  - **Step 3**: No unforeseen case → Pass.  
  - **Step 4**: Vagueness confirmed (past cases show disagreement on "how fast is prompt").  
  - **Step 5**: Policy owner selects **supervaluationism** (regulatory expectation).  
  - **Step 7**: Admissible bounds = 1–24hr (critical), 24–72hr (major), 3–10 days (minor). Covers 98% of past cases → Pass.  
  - **Exit**: **Automated check** with human queue for in-bounds cases.  
    - **Artifact**: Bounds matrix (severity vs. time). **Sign-off**: Policy owner + legal.  

  #### **2. Prohibition on "Material" Misstatements**  
  - **Step 1**: Ambiguous? "Material" could mean "significant to decision-making" or "quantitatively large." Lawyer clarifies: "significant to investor decisions."  
  - **Step 2**: Context-dependent (e.g., client size). Client AUM data exists → Pass.  
  - **Step 3**: No unforeseen case → Pass.  
  - **Step 4**: Vagueness confirmed (borderline cases: 15% of past adjudications).  
  - **Step 5**: Policy owner selects **epistemicism** (industry uses quantifiable thresholds).  
  - **Step 6**: Fair-minded range = 0.1–5% of client AUM. Flip rate = 18% → Fail.  
  - **Step 8**: Flip rate >10% → **Human queue required**.  
    - **Artifact**: Flip rate report. **Sign-off**: Team lead + policy owner.  
    - **Note**: Bright-line threshold (e.g., 1%) would be a silent amendment.  

  #### **3. Data-Classification Rule (Unanticipated Technology)**  
  - **Step 1**: Predicate (e.g., "confidential") is unambiguous.  
  - **Step 2**: Not context-dependent → Pass.  
  - **Step 3**: **Unforeseen case**: Rule drafted for databases; applied to ephemeral messaging app. Data not mappable to "confidential" criteria → Fail.  
  - **Exit**: **"No"**—cannot automate.  
    - **Artifact**: Gap analysis (rule vs. technology). **Sign-off**: Policy owner + legal.  
    - **Outcome**: Human queue until policy is amended.  

  ---

  ### **Limitations and Misfires**  
  1. **Multidimensional Predicates** (e.g., "reasonable" combining cost, time, risk):  
     - Procedure assumes a single measurable feature. Misfires if dimensions interact (e.g., "low cost but high risk").  
     - Mitigation: Escalate to policy owner for dimensionality reduction.  

  2. **Question-Begging Admissible Sharpenings**:  
     - In supervaluationism (Step 7), if admissible bounds rely on the vague term itself (e.g., "substantially similar" defined as "not materially different"), enumeration fails.  

  3. **Moderate Flip Rates** (e.g., 12% in Step 6):  
     - Procedure forces binary automation/human decision. Misfires if a hybrid solution (e.g., ML model) is feasible.  

  4. **Uncodifiable Context** (e.g., "undue delay" in geopolitical crises):  
     - Step 2 may not capture dynamic external factors.  

  5. **Theory Disagreement**:  
     - If policy owner and legal dispute epistemicism vs. supervaluationism, procedure stalls.  

  ---

  ### **One-Page Engineer Cheat Sheet**  
  **Handling Vague Predicates**  
  1. **Disambiguate**: Ask lawyer if term has >1 meaning.  
  2. **Check Context**: Ensure data exists for dependencies (e.g., severity).  
  3. **Unforeseen?**: If new tech/case doesn’t fit rule → "NO" (policy owner + legal sign-off).  
  4. **Vagueness?**: If borderline cases common → Proceed. Else, automate.  
  5. **Fork Theory**:  
     - **Epistemicism** (hidden boundary):  
       - Calculate flip rate across fair-minded threshold range (use past adjudications).  
       - Flip rate ≤10% → Automate with threshold (policy owner + legal sign-off).  
       - Flip rate >10% → Human queue (team lead + policy owner sign-off).  
     - **Supervaluationism** (multiple truths):  
       - Define min/max bounds with policy owner + legal.  
       - Bounds narrow → Automate with human queue for middle cases.  
       - Bounds wide → Human queue.  
  6. **Silent Amendment Risk**: Threshold outside fair-minded range/bounds amends the rule → Reject.  

  **Outcomes**:  
  - ✅ **Automate**: Clear cases only (e.g., "promptly" with severity-time matrix).  
  - ⚠️ **Human Queue**: High flip rate or wide bounds (e.g., "material").  
  - 🚫 **"No"**: Unforeseen case (e.g., new tech).  

  **Sign-offs**:  
  - Epistemicism threshold: Policy owner + legal + revisit date.  
  - Supervaluationism bounds: Policy owner + legal.  
  - Human queue/"No": Team lead + policy owner.  

  **Watch For**:  
  - Multidimensional terms (e.g., "reasonable")—escalate.  
  - Flip rate = % of past cases changing outcome when threshold shifts.  
  - Never set bright lines without sign-off!
