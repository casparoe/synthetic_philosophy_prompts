prompt: |-
  I run the grants program at a mid-size family foundation. We make around a hundred grants a year, and about a dozen of them come back asking for more money to keep going, usually somewhere between fifty and five hundred grand. I've started to notice we almost always say yes, and the reasons sound fine at the time, but I think we're basically playing the dollar auction: once you've bid, the only way to not lose your money is to bid again, so you keep bidding and the auctioneer walks off with everything. Our version is messier though. There's no guy holding up a dollar bill, and half the time I'm not even sure what the prize is worth, because the prize is just keeping the program running, so its value seems to creep up the more we've already put in.

  I need a decision procedure my team can actually run on a continuation request. Two people, one two-hour meeting, no economist in the room, and I have to write a one-page recommendation for the board, who sign off on anything over 200k.

  Things I want it to handle:

  - The questions to ask, in order, and what counts as a sufficient answer to each.
  - Where it stops with a no, and where it has to hand the decision to the board because it's a values question and not a facts question.
  - The difference between a real dollar auction (there's an actual second bidder out there, and their willingness to keep going is driven by their own sunk costs) and the seperate plain sunk-cost case (there's no second bidder, it's just us and our past spending). I think the rule you follow should be different in the two cases and I want that spelled out.
  - The late entrant. Sometimes a new funder shows up after we've been at it for years and can come in cheap, because they never paid the early rounds. I never know what to do with that one.
  - Tell me which steps are just judgment calls dressed up as procedure.

  Then run it on three cases: a grant where another funder has been matching us and keeps upping their side; a grant where the only one bidding is us; and one where your procedure says kill a program that's actually doing some real good.

  And say what the procedure definately can't do.
reasoning: |-
  Okay, the user runs a grants program at a family foundation. They're dealing with about a dozen continuation requests each year, typically between $50k and $500k. They've noticed they almost always say yes, and they're worried they're stuck in a dollar auction scenario. That's a game theory problem where bidders keep escalating to avoid losing their initial investment, which ultimately benefits only the auctioneer. The user wants a practical decision procedure that can be executed by two people in a two-hour meeting without needing an economist. The output should be a one-page recommendation for the board, especially for grants over $200k.

  The user's explicit needs include a step-by-step question sequence with clear pass/fail criteria, handling both the dollar auction and sunk-cost scenarios differently, addressing late entrants (new funders), and identifying steps that are judgment calls disguised as procedure. They also want three test cases to see how the procedure works.

  But there's more beneath the surface. The user is likely feeling uneasy about their foundation's lack of strategic discipline. They mentioned "the prize is just keeping the program running," which suggests mission drift. They might be worried about opportunity costs—every dollar sunk into a failing grant is one not spent on new, potentially better opportunities. There's also an implied desire for psychological safety; they want a procedure that protects their team from pressure to say yes and gives them cover to say no when needed. The mention of "values question" vs. "facts question" hints at avoiding board-level disputes by clarifying responsibility boundaries.

  For the decision procedure, I'll design a flowchart-like process with hard stops. The core is separating the dollar auction scenario (where another bidder is escalating) from pure sunk costs. For dollar auctions, the rule should be to walk away unless there's a credible exit path; for sunk costs, focus on forward-looking viability. Late entrants complicate things—I'll suggest treating them as reset buttons but with caution.

  The three test cases will show: 
  1) A dollar auction with a matching funder—here the procedure should likely say no to avoid escalation. 
  2) Pure sunk costs—evaluate based on current impact, not past spend. 
  3) A "good but not great" program—kill it to free up resources for better opportunities, even if it feels harsh.

  Crucial limitations include: inability to quantify emotional/political pressures, no crystal ball for future outcomes, and the fact that early-stage grants might lack data. Also, judgment calls will exist—like assessing "mission centrality"—but I'll flag them transparently. The board's role is reserved for big bets or value judgments, keeping the team focused on analysis.

  The user might also need help framing "no" decisions compassionately. A "dignified off-ramp" step could be added—like funding a transition instead of abrupt cuts. Overall, this isn't just about efficiency; it's about aligning spending with mission over ego.
answer: |-
  Here's a battle-tested decision procedure for continuation requests, designed for efficiency and strategic clarity. It prioritizes **forward-looking viability** and **mission discipline** over sunk costs, while explicitly flagging judgment calls.

  **Decision Procedure: GRANT Continuation Request Assessment**

  **Personnel:** 2 (e.g., Grants Manager + Program Officer familiar with the grantee/sector)
  **Time:** Max 2 hours (Strict Timebox)
  **Output:** 1-Page Board Rec (Yes/No/Modified + Key Rationale)

  **Core Principle:** **"Would we fund this *today* as a *new* grant at the *requested level*, knowing what we know now?"** If not, continuation requires extraordinary justification.

  **The Steps (Sequential - Fail Any = Recommendation "No" or "Modified"):**

  1.  **Mission & Strategy Check (5 mins):**
      *   *Question:* "Is this program's core activity *still* central to our current foundation priorities and strategy? Has our strategy shifted?"
      *   *Sufficient Answer:* Clear, direct alignment documented in current strategy docs. *If alignment is weak or gone, STOP. Recommend "No."*
      *   *Judgment Call:* Defining "centrality." Be strict. (*Flags Values Question: If board explicitly overrides strategy for this area, note it.*)

  2.  **Core Problem & Theory of Change (10 mins):**
      *   *Question:* "Is the core problem this addresses still significant and relevant? Does the grantee's Theory of Change for solving it *still* seem credible based on evidence (theirs or field-wide)?"
      *   *Sufficient Answer:* Problem remains validated; ToC is logical, evidence-based, and hasn't been fundamentally invalidated by experience. *If problem diminished or ToC broken, STOP. Recommend "No."*
      *   *Judgment Call:* Assessing credibility of ToC evidence. Requires experience.

  3.  **Past Performance & Learning (15 mins):**
      *   *Question:* "What specific, measurable outcomes (outputs, outcomes, impact) did the *previous* grant(s) achieve relative to its *stated goals*? What key lessons were learned (successes/failures)?"
      *   *Sufficient Answer:* Clear data on outputs/outcomes against original targets; Honest assessment of lessons; Evidence funds were used effectively. *If material underperformance or mismanagement unexplained/unaddressed, STOP. Recommend "No."*
      *   *Judgment Call:* Defining "material" underperformance. Context matters.

  4.  **Current Request & Future Plan (20 mins):**
      *   *Question:* "What exactly is this *new* money for? What specific, measurable outcomes are promised *this time* (SMART goals)? How is the plan *different* or *improved* based on past lessons? Is the budget realistic?"
      *   *Sufficient Answer:* Clear scope tied to outcomes; Explicit link to lessons learned; Budget aligns with activities. *If vague goals, no adaptation, or unrealistic budget, STOP. Recommend "No" or "Modified" (e.g., smaller scale/pilot).*

  5.  **The Dollar Auction Test (CRITICAL - 20 mins):**
      *   *Question:* **"Is there another significant funder actively involved whose continued/expanded funding is explicitly contingent on ours?"**
          *   *If YES (Dollar Auction Scenario):* "Does this funder have *greater capacity* and *longer-term commitment* to this specific issue/org than we do? Is there a *credible, written plan* for them taking over lead funding or achieving sustainability *without our further escalation*?"
              *   *Sufficient Answer:* Yes to greater capacity/longer commitment AND a credible, documented transition/sustainability plan with milestones. *If NO, STOP. Recommend "No." (Rule: Never escalate against a peer or weaker player in a DA. Walk away.)*
          *   *If NO (Pure Sunk Cost Scenario):* Proceed to Step 6. (Sunk costs are irrelevant. Ignore them.)

  6.  **Viability & Exit (20 mins):**
      *   *Question:* "What is the credible path to *sustainability* or a *dignified conclusion* for this program within a defined timeframe (e.g., 1-3 more grants)? What specific milestones will signal it's time to exit or that the program is self-sustaining?"
      *   *Sufficient Answer:* Realistic, specific pathway defined (e.g., diversify funding, government adoption, earned income plan, planned sunset). Clear, measurable milestones for exit/success. *If no credible path or exit plan, STOP. Recommend "No."*
      *   *Judgment Call:* Assessing realism of the path/plan.

  7.  **The Late Entrant Scenario (10 mins):**
      *   *Question:* "Is a significant *new* funder willing to come in *at a substantial level* ($X) **conditional on our continued involvement?**"
          *   *If YES:* **Treat this as a *new* grant proposal.** Does this new combined proposal (our continuation + their new money) pass Steps 1-6 *as if it were brand new*? Does the new funder bring significant advantages (expertise, leverage)? *If YES, consider "Yes" or "Modified." If NO, STOP. Recommend "No."*
          *   *If NO:* Proceed to Step 8. (Late entrant without conditionality is irrelevant to *our* continuation decision.)

  8.  **Opportunity Cost & Alternatives (20 mins):**
      *   *Question:* "If we fund this, what specific new opportunities (types of grants, strategic initiatives) might we *not* be able to fund with these resources? Are there clearly *better* potential investments in our priority area?"
      *   *Sufficient Answer:* Acknowledge trade-offs. *This step rarely forces a "No" alone but critically informs the final recommendation's strength.* A weak "Yes" here combined with strong earlier steps might still be a "Yes," but flag the cost.
      *   *Judgment Call:* Comparing relative value of intangible opportunities.

  **Decision & Rec:**
  *   Passed All Steps 1-7? **Recommend "Yes"** (If over $200k, board approval needed).
  *   Failed any Step 1-7? **Recommend "No."**
  *   Conditional Pass (e.g., Step 4 or 7)? **Recommend "Modified"** (Specify: e.g., reduced amount, shorter term, specific conditions).
  *   **Board Handoff:** Primarily for amounts >$200k (approval). Also explicitly flag *any* "Values Question" identified in Step 1 (Mission Alignment) where the facts are clear but the strategic value needs board-level weighing. *The procedure focuses on facts; the board owns values.*

  ---

  **Test Cases:**

  1.  **The Dollar Auction (Matching Funder Keeps Upping):**
      *   *Scenario:* "Save the River" campaign. We funded $100k (Year 1), matched by City Fund. Now requesting $200k (Year 3), contingent on City Fund matching again ($200k). City Fund has deeper pockets but similar commitment length.
      *   *Procedure Run:*
          *   Step 1-4: Pass (Mission, Problem, Past OK, Plan OK).
          *   **Step 5: YES (Dollar Auction).** City Fund contingent? YES. Greater capacity? Maybe similar. Longer commitment? Similar. Credible exit plan? NO (just perpetual matching). **-> FAIL. STOP. Recommend "No."**
          *   *Rationale:* Trapped in escalating DA with peer. No path to sustainability without us. Recommend exit, offer transition support if possible.

  2.  **Pure Sunk Cost (Only Us Bidding):**
      *   *Scenario:* "Community Tech Hub." We funded $300k (Startup), $250k (Year 2). Now requesting $400k (Year 3). Modest user growth, struggling financially, no other major funders.
      *   *Procedure Run:*
          *   Step 1: Pass (Still aligned).
          *   Step 2: Pass (Problem relevant, ToC still plausible).
          *   **Step 3: FAIL.** Past Outcomes: User growth 30% below target. Financial management issues noted. **-> STOP. Recommend "No."**
          *   *Rationale:* Material underperformance against goals. Sunk costs irrelevant. Funding further would be rewarding underperformance without clear corrective plan.

  3.  **Killing "Real Good":**
      *   *Scenario:* "Artists in Schools." Funded $150k/year for 5 years. Modest but consistent positive feedback, good management. Core mission alignment has *lessened* (our strategy shifted slightly towards STEM). Requesting $180k.
      *   *Procedure Run:*
          *   **Step 1: FAIL.** Program does good work, but **not central** to *current* strategic priorities (focused on STEM equity). **-> STOP. Recommend "No."**
          *   *Rationale:* Foundation resources must align with active strategy. "Good" is not sufficient if it's not strategically "great" *for us*. Opportunity cost is funding a new STEM initiative. Offer a dignified off-ramp (e.g., final year of transition funding).

  ---

  **What This Procedure CANNOT Do:**

  1.  **Predict the Future:** It relies on current evidence and realistic plans, not guarantees.
  2.  **Quantify Emotional/Political Pressure:** Board members' personal connections or field reputation concerns aren't factored. The "Values Question" flag is the only outlet.
  3.  **Perfectly Compare Apples/Oranges (Opportunity Cost):** Judging relative value of disparate opportunities is inherently subjective.
  4.  **Eliminate All Judgment Calls:** Steps 1 (Centrality), 3 (Materiality), 6 (Realism), and 8 (Relative Value) require experienced judgment. The procedure structures and exposes these calls, not eliminates them.
  5.  **Fix Bad Initial Grants:** If the original grant had flawed design or weak metrics (Step 3), the procedure will likely catch it later, but the sunk cost is already lost.
  6.  **Handle True Black Swans:** Unforeseen major events (disaster, scandal) occurring *after* the meeting aren't covered.
  7.  **Force Grantees to be Truthful:** Relies on honest reporting from grantees and due diligence by staff.

  **Key Takeaway:** This procedure forces disciplined, forward-looking analysis, minimizes the tyranny of sunk costs, provides clear exit ramps from dollar auctions, and exposes the key judgment points. Its power lies in its structured *questions* and clear *stopping rules*, not in providing perfect answers. The "Modified" option allows flexibility without abandoning principles. Use it consistently to build strategic muscle and protect your foundation's resources for maximum impact.
