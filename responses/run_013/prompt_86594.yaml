answer: |-
  Your analysis is remarkably precise, and you've correctly identified core concepts in decision theory and epistemology. The field *does* have formal tools to address this, though your friend's case highlights a boundary condition. Here's the breakdown:

  ### 1. The Core Concept: Expected Value of Information (EVI)
  *   **Definition:** The Expected Value of Information (EVI) is the maximum amount a rational decision-maker should be willing to pay for a piece of information *before* acquiring it. It quantifies how much *better* (in terms of expected utility) your decisions become *because* of having that information.
  *   **Formula:** EVI = Expected Utility *with* Information - Expected Utility *without* Information.
  *   **Key Insight:** EVI is fundamentally **instrumental value**. It measures the value of information *solely* in terms of its potential to improve the outcome of *future decisions*. Information has positive EVI only if it *could* change the optimal action you choose in at least some possible state of the world.
  *   **Covers:** Your first two points perfectly.
      *   **Decision-Dependent Value:** EVI is explicitly a property of the information *in the context of a specific decision problem*. It depends on your possible actions, the states of the world, the utilities of outcomes, and your prior beliefs. A fact about a coin flip is worthless (EVI=0) if no prize depends on it, but highly valuable (EVI>0) if a big prize does.
      *   **Failure of Additivity:** EVI is *not* additive. The value of learning two pieces of information (A and B) simultaneously is rarely the sum of learning A alone plus learning B alone. This is because:
          *   **Redundancy:** Learning A might make B irrelevant (or vice versa).
          *   **Synergy:** Learning A and B together might be much more valuable than the sum if they interact significantly in the decision (like your coin flip and prize example). The value depends on the joint impact on the decision.

  ### 2. The Forward-Looking Guarantee: Non-Negativity of EVI
  *   **The Theorem:** For a rational decision-maker maximizing expected utility, the EVI is **always non-negative** (EVI ≥ 0). Learning information (for free) can never *decrease* your *expected utility* before you learn it.
  *   **Reasoning:** If the information *could* lead you to a better decision in some scenario, it increases your expected utility. If it *couldn't* change the optimal decision in any scenario (i.e., the optimal action is the same regardless of the information), then EVI = 0. There is no scenario where learning it *forces* you to make a *worse* decision in expectation than you would have made without it.
  *   **Covers:** Your "forward-looking guarantee" and its core condition: "...*provided the learning is free and I go on choosing as well as I can.*" This condition is crucial. "Choosing as well as I can" means you are rational and will update your beliefs correctly (via Bayes' theorem) and choose the action with the highest expected utility *given your new information*.

  ### 3. The Temporal Asymmetry & Looking Back: Intrinsic Value/Disvalue
  *   **The Asymmetry Explained:** The non-negativity theorem is strictly *prospective*. It says *before* you learn something, the *expected* effect on your utility is non-negative. *After* you learn it, your *actual* utility can decrease.
  *   **Why?** The theorem accounts only for **instrumental value** (impact on decisions). It ignores **intrinsic value/disvalue** – the direct pleasure or pain caused by the knowledge itself, independent of any decision.
      *   **Looking Forward (EVI):** Only instrumental value is considered. Since learning can't harm instrumental value (only help or leave it unchanged), EVI ≥ 0.
      *   **Looking Back (Actual Utility):** Your total utility includes both the instrumental outcome *and* the intrinsic value of your state of knowledge. Learning a painful truth (like infidelity) can impose a large intrinsic disutility, even if it doesn't change any future decisions (instrumental value = 0).
  *   **Covers:** Your "temporal asymmetry" and explains why "looking back, I plainly can be made worse off." It's the introduction of intrinsic disvalue after the fact.

  ### 4. Your Friend's Case: A Genuine Exception to the *Scope* of EVI
  *   **Analysis:** Her reasoning is sound *because* she posits "the knowing would cost her something and buy her nothing."
      *   **"Buy her nothing" (EVI = 0):** Since the information cannot change any future decisions ("change nothing she now does"), the *instrumental value* (EVI) is zero. It won't improve her future outcomes.
      *   **"Cost her something" (Intrinsic Disvalue > 0):** She anticipates significant intrinsic disutility (emotional pain, distress, damaged memories) from knowing the truth.
  *   **Conclusion:** This is **not an exception to the non-negativity theorem** (which only claims EVI ≥ 0, and 0 ≥ 0 is true). It **is a genuine case where the intrinsic disvalue of information dominates**, making the *total expected utility* of learning it negative *for her*, despite EVI being zero. The theorem guarantees she won't be instrumentally worse off, but it doesn't protect her from intrinsic harm.

  ### Summary of Terms and Boundaries

  | Concept                  | Name(s)                          | Definition/Boundary                                                                 | Covered by EVI?     |
  | :----------------------- | :------------------------------- | :---------------------------------------------------------------------------------- | :------------------ |
  | **Value depends on decision** | **Instrumental Value** / **Expected Value of Information (EVI)** | Value derived *only* from information's ability to improve future decision outcomes. | **Yes** - Core definition |
  | **Non-additivity**       | **Non-additivity of Information Value** | Value of multiple information items ≠ simple sum; depends on redundancy/synergy within the decision context. | **Yes** - Implicit in joint EVI calculation |
  | **Forward guarantee**    | **Non-Negativity of EVI**        | EVI ≥ 0 always, under rational choice and free information acquisition.             | **Yes** - Formal theorem |
  | **Intrinsic cost**       | **Intrinsic Value/Disvalue of Information** | Direct positive/negative utility from the knowledge state itself, irrespective of decisions. | **No** - Explicitly excluded |
  | **Temporal asymmetry**   | -                                | EVI guarantees non-negative *expected* impact prospectively; intrinsic effects can cause negative *actual* impact retrospectively. | **Partly** - EVI explains the forward part; intrinsic disvalue explains the backward part |

  **The Takeaway:** Decision theory's framework (EVI and non-negativity) perfectly explains the first three pieces: instrumental value is decision-dependent, non-additive, and prospectively non-negative. Your friend's case highlights the crucial boundary: **EVI captures only the *instrumental* value of information.** When information carries significant **intrinsic disvalue** (like emotional pain) and has **zero instrumental value** (changes no decisions), a rational person *should* avoid it, as your friend argued. Her cost is real, though of a different kind (intrinsic) than the instrumental costs EVI guards against. Your argument holds strictly within the instrumental domain, but hers incorporates the broader reality of human experience where knowledge itself can be a burden.
