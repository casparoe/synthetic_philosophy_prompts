  Then there's temporal asymmetry: learning can't harm in expectation beforehand but might after the fact. EVI's non-negativity property explains the forward-looking guarantee—it's always non-negative. But once known, emotional costs can make you worse off. The user's friend's case is an example where the cost isn't in decisions but in psychological state. 

  I should explain that EVI focuses on instrumental value—how info aids decisions. The friend's emotional cost is intrinsic disvalue, which EVI ignores. So the friend's situation is a genuine exception because EVI doesn't account for intrinsic costs. 

