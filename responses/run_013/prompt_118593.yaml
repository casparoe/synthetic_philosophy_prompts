  The core tension here seems to be between their intuition about correctness and Copycat's design philosophy. I should clarify that Hofstadter/FARG explicitly reject the idea of single correct answers for these problems. The "internal dice rolls" they mention (slipnet probabilities, temperature metrics) are intentional features modeling human fluidity. 

  But wait—maybe their deeper concern is about whether this variability undermines Copycat as a cognitive model? That's worth addressing head-on. The program isn't claiming human minds are random; it's showing how constrained randomness can yield plausible alternatives. Like how two people might reasonably argue for "ijl" vs "ijd" based on different perspectives. 

  Also important to note they're technically right about conventional expectations—in many logic puzzles "ijk→ijl" would be standard. But Copycat deliberately avoids hardcoding that. If they want a deterministic version, I'd need to suggest radical changes: removing probabilistic slippage, freezing temperature, maybe even predefining mappings. But that would gut what makes Copycat interesting! 

  ...Should I mention the Wason card task? No, that might derail things. Stick to Copycat specifics. Emphasize that the spread isn't a bug—it's the whole point about context-dependence. Their physics-trained desire for convergence is valid, but here the variability *is* the insight. 

