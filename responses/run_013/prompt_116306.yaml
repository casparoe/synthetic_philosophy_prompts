prompt: |-
  I run case review for a professional regulator. We handle a few hundred complaints a year against nurses and social workers, and our case handlers apply a written code of conduct — our codes numbered rules, plus a line at the front saying handlers should use judgement. Two things keep happening. Handlers want to bend the rules for sympathetic people (she only did it to ease the patient's pain, she was exhausted, her manager told her to). And they also want to come down hard on conduct that stays inside the letter of the rules but is obviously rotten. I read a bit about moral particularism last month and it's scrambled my head: if principles don't decide cases on their own, what is our code even for?

  Write me a decision procedure a handler can actually run on one case: the questions to ask in order, what counts as a good enough answer to each, where it stops with a definite no, and where it hands off to the panel because the question is one of values rather than facts. Handlers get about two weeks per case and a panel referral adds three months, so it can't just say refer anything hard.

  Two distinctions it has to get right: a rule not covering a case versus a rule covering it and being outweighed; and the fact that one and the same feature (patient consented, clinician was following an instruction) can count for or against depending on the case. Then run it on three cases — a nurse who took leftover opioids to a dying patient at home without a prescription, a clinician who followed the code to the letter while humiliating a patient, and a well-liked senior practitioner everyone would prefer we handled quietly — and include at least one where it lands somewhere I won't like. Finally, mark which steps are judgement dressed up as procedure, and say what the procedure can't do.
reasoning: |-
  Okay, the user runs case reviews for a professional regulator handling complaints against nurses and social workers. They're dealing with a few hundred cases a year. The main issues are case handlers bending rules for sympathetic individuals and wanting to punish technically rule-compliant but unethical behavior. The user recently read about moral particularism, which questions if principles alone can decide cases, making them wonder about the purpose of their code of conduct. 

  They need a practical decision procedure that handlers can apply within two weeks per case. Referring to a panel adds three months, so the procedure must minimize referrals while handling tough cases. Key distinctions required are between cases not covered by a rule versus cases where a rule applies but is outweighed, and recognizing that the same feature (like patient consent) can have different implications depending on context.

  The user wants a step-by-step process with specific questions, clear criteria for answers, stopping points for definitive decisions, and referrals only when necessary. They also want three examples tested, including one with an unpopular outcome, and to identify where judgment is disguised as procedure.

  First, I'll outline the decision procedure. It needs clear steps: initial screening, rule application, judgment zones, and final decisions. Steps should include checking if the complaint is valid, applying the code, determining if the rule covers the case, assessing if the rule should be outweighed, and deciding on action. 

  The distinction between "rule doesn't cover" vs "rule covered but outweighed" is crucial. For instance, "rule doesn't cover" means the situation isn't addressed by any rule, while "outweighed" means the rule applies but there are overriding reasons to not enforce it. 

  Handlers must assess context: intent, consequences, alternatives, systemic factors, and consistency. Each factor needs clear criteria to avoid subjectivity. For example, intent requires evidence beyond claims, like witness statements or documentation.

  The three test cases: 
  1. Nurse taking opioids to a dying patient without a prescription. This involves rule-breaking but possibly justified. 
  2. Clinician following the code but humiliating a patient. Here, the rule is followed but the outcome is unethical. 
  3. Well-liked senior practitioner where there's pressure to handle quietly. This tests bias versus actual misconduct.

  For the opioid case, the procedure should recognize the rule violation but check if patient welfare outweighs it. The humiliation case might show that no rule was broken, but the behavior violates overarching principles, leading to a "no violation" decision but still requiring feedback. The senior practitioner case should enforce rules despite popularity, highlighting that procedure prevents leniency based on status.

  Steps involving judgment: Assessing "sufficient harm," "reasonable alternatives," "outweighing factors," and "systemic pressures" all require subjective analysis. The procedure can't eliminate discretion but structures it with questions and evidence requirements.

  The procedure's limitations: It can't resolve deep value conflicts without panel referral, can't create new rules, and relies on handler competence. Training and oversight are essential.

  Finally, marking steps where judgment is essential but framed as procedure. Steps 4, 5, 6, and 7 involve significant judgment. The examples will show how the procedure applies, especially the unpopular outcome in the humiliation case where no violation is found but feedback is needed, which might frustrate the complainant.
answer: |-
  Here's a decision procedure ("The Contextual Code Balance") designed to handle your core tensions, incorporating particularism while respecting the code's role, minimizing panel referrals, and making the judgment steps explicit. It focuses on *how* to use the code and judgment together systematically.

  **The Decision Procedure: Contextual Code Balance (CCB)**

  1.  **Initial Triage & Validity Check:** *Is this a valid complaint within our jurisdiction and scope?*
      *   **Question:** Does the alleged conduct, if proven, potentially fall under *any* part of our Code of Conduct (including the overarching duty of care, professionalism, etc.), OR involve regulated activities?
      *   **Good Answer:** Yes (Proceed). No (Close with rationale; e.g., complaint about billing admin not covered).
      *   **Stop:** Definitive "No". No referral needed.

  2.  **Factual Anchor:** *Can the core alleged facts be established on the balance of probabilities?*
      *   **Question:** Based on evidence (statements, records, etc.), is it more likely than not that the practitioner did (or didn't do) the key actions central to the complaint?
      *   **Good Answer:** Clear evidence supporting or refuting the core factual allegations.
      *   **Stop:** Definitive "No Violation" if core harmful act *didn't* happen. Definitive "Violation" if core harmful act *did* happen *and* it clearly breaches a specific, unambiguous rule with no plausible justification (e.g., falsifying records for personal gain).
      *   **Referral?** Only if facts are genuinely irreconcilable despite reasonable investigation (rare).

  3.  **Rule Application:** *Does the established conduct breach a specific, numbered rule in the Code?*
      *   **Question:** Looking at the established facts, does this conduct directly contravene the wording of Rule X.Y.Z?
      *   **Good Answer:** Clear mapping between facts and rule elements. (e.g., Rule: "Must obtain valid consent." Fact: No consent documented or obtained).
      *   **Stop:** Definitive "Violation" if breach is clear-cut, unambiguous, and involves significant risk/harm without immediate justification apparent. (Judgment: Assessing "significant").
      *   **Outcome:** Breach Found (Proceed to Step 4). **OR** No Specific Rule Breached (Proceed to Step 5).

  4.  **RULES APPLIED PATH: Contextual Mitigation/Outweighing?** *(Only if Step 3 found a rule breach)*
      *   **Question:** Despite breaching Rule X.Y.Z, are there *exceptional* contextual factors present that *strongly* suggest applying the rule strictly here would be unjust, disproportionate, or contrary to the *overarching purpose* of the Code (e.g., patient welfare, public protection)?
      *   **Key Judgment Factors to Assess (Requiring Evidence):**
          *   **Intent:** Was the *primary intent* clearly benevolent (e.g., alleviating extreme suffering) vs. negligent/malicious?
          *   **Immediate Consequences:** Did the breach demonstrably *prevent imminent, serious harm* or *provide essential, otherwise unattainable benefit*? Did it *cause* significant harm?
          *   **Reasonable Alternatives:** Were there truly *no reasonable, rule-compliant alternatives* available in the specific circumstances (time pressure, resources, information)?
          *   **Systemic Pressure:** Was the practitioner acting under *direct, illegitimate pressure* (e.g., unsafe order from manager that couldn't be safely refused) that significantly constrained choice?
          *   **Consistency:** Would excusing *this* breach create an unacceptable precedent undermining the rule's core purpose?
      *   **Good Answer:** Evidence strongly supports *multiple* mitigating factors (especially Intent + Consequences + Lack of Alternatives) aligning with the Code's *overarching principles* (e.g., patient welfare overriding a paperwork rule in a dire emergency). Harm caused by the breach was minimal/avoided.
      *   **Stop - Outweighed (Likely No Sanction/Minor Action):** If factors *powerfully* outweigh the breach, aligning with core Code values. (e.g., Nurse using emergency protocol slightly incorrectly to save a life when no other option).
      *   **Stop - Breach Stands (Violation):** If mitigating factors are weak, absent, or outweighed by harm/risk caused. (e.g., Taking opioids home "just in case" without immediate dire need).
      *   **Referral?** If the balance is *exceptionally* fine, precedent-setting, or involves a fundamental conflict of core values (e.g., autonomy vs. welfare clash under pressure). **Aim to avoid - handler must make a strong case why *they* can't decide.**

  5.  **NO RULE PATH: Principles Violation?** *(Only if Step 3 found NO specific rule breach)*
      *   **Question:** Does the established conduct, while technically not breaching a numbered rule, *clearly and significantly violate* the overarching principles stated at the front of the Code (e.g., dignity, integrity, trust, public confidence) to such a degree that it demands regulatory action?
      *   **Key Judgment Factors to Assess (Requiring Evidence):**
          *   **Impact:** What was the *actual harm* (dignity, trust, psychological) caused to the patient/client/public?
          *   **Intent/Motive:** Was the conduct deliberately unkind, exploitative, or discriminatory? Or was it clumsy/insensitive?
          *   **Professional Norms:** Does the conduct fall *far below* what the profession and public would reasonably expect, even without a specific rule?
          *   **Systemic Justification:** Was there a legitimate professional/systemic reason for the *manner* of the conduct? (e.g., necessary security procedure vs. gratuitous humiliation).
          *   **Consistency:** Would finding a violation here align with how we've interpreted the *principles* in similar past cases?
      *   **Good Answer:** Evidence shows severe impact, poor intent, conduct far below expected standards, no legitimate justification, and alignment with precedent on principles.
      *   **Stop - Principles Violation Found:** If conduct is egregiously contrary to core principles despite rule gap. (Judgment: "Egregiously").
      *   **Stop - No Violation (But Feedback):** If impact was low, intent benign, conduct borderline, or legitimate systemic reason exists. (Handler documents concerns for employer/individual feedback).
      *   **Referral?** If it's a *novel* type of misconduct testing the boundaries of the principles, or the judgment on "egregious" is highly contentious. **Aim to avoid - handler must attempt categorization.**

  6.  **Sanction/Outcome Scope:** *What outcome is proportionate, considering breach (or principle violation), context, harm, risk, and practitioner factors (insight, remediation)?* (Handler proposes, Panel usually approves significant sanctions).
      *   **Questions:** What sanction/action best protects the public, maintains confidence, addresses the specific misconduct, and is fair? Does the practitioner show insight? Have they taken steps to remediate?
      *   **Good Answer:** Outcome proposal clearly links the factors above (severity, context, insight) to a proportionate sanction (dismissal, training, warning, no action). Supported by evidence of insight/remediation or lack thereof.
      *   **Referral?:** Always for formal sanctions beyond advice/warnings (per your likely policy). Handler prepares analysis for the panel.

  **Marking Judgment Dressed as Procedure:**
  *   **Step 3 "Stop":** Judging "significant risk/harm" without immediate justification.
  *   **Step 4 (Entire Step):** Judging "exceptional," "strongly suggest unjust," "benevolent intent," "imminent serious harm," "reasonable alternatives," "illegitimate pressure," "unacceptable precedent," "powerfully outweigh."
  *   **Step 5 (Entire Step):** Judging "clearly and significantly violate," "egregiously," "actual harm," "far below expected standards," "legitimate justification."
  *   **Step 6:** Judging "proportionate," "insight," "remediation."

  **What the Procedure CAN'T Do:**
  1.  **Eliminate Judgment:** It structures and demands evidence for judgment, but doesn't remove it. The code provides the framework and rules; judgment applies them contextually.
  2.  **Resolve Deep Value Conflicts Neutrally:** When core values clash irreconcilably (e.g., autonomy vs. welfare in a gray area), the procedure flags it for referral; it doesn't magically solve it.
  3.  **Create New Rules:** It interprets and applies existing rules and principles. It can't invent new prohibitions or requirements not grounded in the Code.
  4.  **Guarantee Consistency Alone:** Consistency relies on handler training, supervision, shared understanding of principles, and clear precedent databases alongside the procedure.
  5.  **Fix Bad Evidence:** Garbage in, garbage out. Poor evidence makes all judgment steps harder and referrals more likely.
  6.  **Override Clear Mandatory Rules:** It can't excuse breaches of fundamental, non-negotiable safety rules (e.g., assault, serious criminality) based on context.

  ---

  **Application to Test Cases:**

  **Case 1: Nurse takes leftover opioids to dying patient at home without prescription.**
  *   **Step 1:** Valid complaint (medication handling, prescription rules).
  *   **Step 2:** Facts established (Nurse admits taking opioids, no prescription, patient was dying at home).
  *   **Step 3:** **Breach Found** - Clear breach of rules on medication security, transportation, and prescription requirements.
  *   **Step 4:** **Contextual Mitigation/Outweighing?**
      *   *Intent:* Strongly benevolent (alleviate suffering of dying patient).
      *   *Consequences:* Provided essential pain relief otherwise unavailable? (Key: Could prescription have been obtained? Was pain uncontrolled? Evidence needed). Risk of diversion? Minimal if administered immediately. Harm caused? Relief provided.
      *   *Alternatives:* Were there *truly* no alternatives? Could hospice/palliative care/prescriber have been contacted urgently? Were systems failing the patient? (Critical factor).
      *   *Pressure:* Compassionate impulse, not external pressure.
      *   *Consistency:* Excusing *only* in genuine end-of-life crises with no alternatives might be acceptable precedent.
  *   **Judgment:** If evidence shows *uncontrolled severe pain*, *no timely access to prescription* (e.g., after hours, system barriers), *immediate administration*, and *no diversion risk* - **factors likely OVERWEIGH the breach.** Outcome: Likely No Formal Sanction, but strong advice/warning on procedure, referral to employer for system review. **Handler decides - No Panel Ref.**
  *   **Unpalatable Outcome?** If evidence shows pain was manageable, prescription *was* obtainable, or drugs were left unsecured - **Breach Stands.** Sanction likely (reflective piece, warning). Public might sympathize with nurse, but regulator must uphold safety rules.

  **Case 2: Clinician followed code to the letter but humiliated patient.**
  *   **Step 1:** Valid complaint (professionalism, dignity).
  *   **Step 2:** Facts established (Clinician performed a necessary examination/procedure correctly per protocol, but did so in a cold, abrupt, dismissive, or sarcastic manner causing patient distress).
  *   **Step 3:** **No Specific Rule Breached** (Assuming no rule explicitly prohibits "being rude" or "lacking bedside manner," only mandates technical competence/consent).
  *   **Step 5:** **Principles Violation?**
      *   *Impact:* Significant harm to dignity, psychological distress, eroded trust.
      *   *Intent/Motive:* Deliberately unkind? Or stressed/abrupt? Evidence from patient/witnesses.
      *   *Professional Norms:* Falls far below expected standard of compassion/respect. Public would be appalled.
      *   *Systemic Justification:* No legitimate reason for the *demeanor*; the procedure didn't require rudeness.
      *   *Consistency:* Principles of dignity/trust are core; similar conduct likely previously addressed as misconduct.
  *   **Judgment:** **Principles Violation FOUND.** Conduct egregiously violated core principles of respect and dignity, even if technically competent. Outcome: Misconduct found, sanction based on intent/insight (e.g., training, apology, warning). **Handler decides - No Panel Ref needed for finding violation.** Sanction proposal might go to Panel.
  *   **Unpalatable Outcome?** If the "humiliation" was a single thoughtless comment during a highly stressful emergency procedure, and clinician shows remorse - **Handler might find No Violation but recommend feedback/training.** Complainant may feel this is too weak.

  **Case 3: Well-liked senior practitioner with misconduct (e.g., minor record inaccuracies favoring a colleague).**
  *   **Step 1:** Valid complaint (record keeping, integrity).
  *   **Step 2:** Facts established (Senior knowingly documented intervention slightly inaccurately to cover for a junior's minor delay, no patient harm).
  *   **Step 3:** **Breach Found** - Falsifying records (even minorly).
  *   **Step 4:** **Contextual Mitigation/Outweighing?**
      *   *Intent:* Benevolent (protect junior), but dishonest.
      *   *Consequences:* Minimal/no patient harm, but undermines record integrity.
      *   *Alternatives:* Reasonable alternatives existed (document accurately, discuss minor delay openly, supervise junior better).
      *   *Pressure:* Self-imposed "team loyalty," not external.
      *   *Consistency:* Excusing falsification, even for "good" reasons, sets dangerous precedent; integrity is paramount.
  *   **Judgment:** **Breach STANDS.** Mitigating factors (intent, no harm) may reduce *sanction* severity (e.g., warning, reflective practice), but **violation must be found.** Popularity is irrelevant. **Handler decides - No Panel Ref needed for violation finding.** Sanction proposal might go to Panel.
  *   **Unpalatable Outcome?** For the team/individual: Finding misconduct for a "white lie." For the public/regulator: *Not* finding misconduct would be unpalatable as it erodes trust in records and senior accountability.

  This procedure forces handlers to engage systematically with both the rules and the context, provides clear off-ramps for definitive decisions, minimizes panel referrals to true value dilemmas or sanctioning, and makes the necessary judgment points explicit rather than hidden. It ensures the Code remains central but not applied robotically. Success depends heavily on robust training, clear examples, and strong supervision focused on the quality of the *reasoning* at each judgment step.
