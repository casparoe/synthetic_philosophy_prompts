  `GI safety = 0.60 × (1 - 0.30) = 0.42`  
  `GI failure safety = 0.40 × 0.40 = 0.16`  
  `Sum = 0.42 + 0.16 = 0.58`  
  `P(Safe) = 0.95 × 0.90 × 0.58 ≈ 0.50` → **0.50**  

  Add back DM as a multiplier (0.70):  
  **Final upper-bound P(Safe) = 0.50 × 0.70 = 0.51** (51%).

  ---

  #### Sensitivity and Key Evidence
  - **Most sensitive term**: **Sandbox constraint (SC)**.  
    - Why? It is the lowest-probability term (0.30–0.40) and a multiplicative failure point. Doubling SC from 0.30 to 0.60 increases P(Safe) by ~15–20%.  
  - **Evidence to move SC**:  
