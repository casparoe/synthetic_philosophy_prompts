  ### Example Vignettes to Distinguish Valence and Norm Accounts

  **Vignette A (Morally Bad, No Norm Violation):**  
  In the nation of Industria, industrial pollution is not only legal but celebrated as a sign of progress. There is no norm—legal, social, or conventional—against environmental harm. The CEO of ChemCorp decides to dump toxic waste into a river to maximize profits. The CEO knows this will devastate the local ecosystem and cause widespread health problems. The CEO is indifferent to these consequences, saying, "I don't care about the environment; I only care about profits." The waste is dumped, and the ecosystem is destroyed.  

  **Vignette B (Morally Good, Norm Violation):**  
  In the nation of Traditia, a deeply entrenched caste system forbids upper-caste individuals from interacting with lower-caste members. Helping lower-caste members violates a powerful social norm, though it is not illegal. The CEO of a corporation initiates a program to provide job training to lower-caste individuals, knowing it will significantly improve their lives. The CEO is indifferent to the norm violation, stating, "I don't care about caste rules; I only care about our public image." The program runs, and the lower-caste individuals are substantially helped.  

  **Fixed Elements Across Vignettes:**  
  - **Knowledge:** Both CEOs know the side effect will occur (ecosystem destruction / help to lower-caste members).  
  - **Causal Contribution:** Both CEOs directly cause the side effect through their decisions.  
  - **Indifference:** Both CEOs explicitly state indifference to the side effect, acting solely to achieve their primary goal (profits / public image).  

  ### Predictions of the Two Accounts  
  1. **Valence Account Prediction:**  
     - **Vignette A (Bad Outcome):** Intentionality attributed. The morally bad outcome (ecosystem destruction) triggers the asymmetric judgment.  
     - **Vignette B (Good Outcome):** Intentionality *not* attributed. The morally good outcome (helping) does not trigger the asymmetry.  
     *Why?* Valence treats moral badness as the operative mechanism. Bad outcomes invite intentionality attributions; good outcomes do not.  

  2. **Norm Account Prediction:**  
     - **Vignette A (No Norm Violation):** Intentionality *not* attributed. Despite the morally bad outcome, no norm is violated in Industria (pollution is expected).  
     - **Vignette B (Norm Violation):** Intentionality attributed. The violation of Traditia’s caste norm drives the judgment, regardless of the outcome’s moral goodness.  
     *Why?* Norm treats norm violation (not moral valence) as the mechanism. Intentionality hinges on whether the agent violates a contextually salient norm.  

  ### Feature to Vary for Agreement  
  To align the accounts’ predictions, vary the **norm status of the outcome**:  
  - **Modify Vignette A:** Introduce a norm against pollution in Industria (e.g., "Industrial pollution violates a sacred cultural norm"). Now, the bad outcome also violates a norm, so both accounts predict intentionality.  
  - **Modify Vignette B:** Remove the norm violation in Traditia (e.g., "Helping lower-caste members aligns with new social reforms"). Now, the good outcome violates no norm, so both accounts predict *no* intentionality.  
  *Why this feature?* Valence and norm accounts diverge when moral status and norm violation are decoupled. Re-coupling them (bad + norm violation, or good + no violation) forces agreement.  

  ### Implications for the Knobe Effect  
  - **If the valence account is supported:** The effect is tied to moral evaluation, suggesting it reflects a *moral distortion* of the concept of intentional action (e.g., blame influences mental state attribution). This implies the effect is not about intentionality itself but about adjacent moral judgments.  
  - **If the norm account is supported:** The effect is driven by norm violations (moral or non-moral), suggesting intentionality *inherently* incorporates normative expectations. This implies the effect reveals a core feature of the concept of intentional action—its sensitivity to norm deviance.  
  - **Broader implication:** The case tests whether the Knobe effect is evidence about the *structure of intentional action* (norm account) or a *moral bias* (valence account). A norm-account outcome would show the concept is more deeply intertwined with norm psychology than previously assumed.
