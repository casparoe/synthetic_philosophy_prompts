prompt: |-
  I have been reading rationalist blogs and forums for a long time now — long enough to have watched a particular argumentative move rise from a curiosity to something close to a house style, and I have never found a satisfactory name for it. The move runs like this. Someone advances a thesis: that beliefs are never among the causes of action, say, or that nothing is ever owed to anyone. An interlocutor does not answer with evidence. Instead they point at the act of asserting the thesis. You have just offered me a consideration in favour of your view, they say; in doing so you have treated considerations as things that can favour views; so your denial refutes itself. The first party replies that this is a trick — that they were describing how things are rather than recommending anything, that a sentence can be used without the user being committed to everything its surface suggests — and the thread dies there, each side convinced the other has cheated.

  What interests me is that the same shape shows up with quite different joints. Sometimes the claim is that the denial cannot be thought, because the concepts it would need are precisely the ones under attack. Sometimes it is that the denial cannot be asserted without inconsistency, which is a narrower and more tractable claim about what the speaker has committed themselves to in speaking. And sometimes it is neither: the claim is that the denial cannot be lived, that the practice in question is inescapable, so the theory that would abolish it is idle rather than false. I have seen all three delivered in the same triumphant tone, and I suspect they are not the same move at all, and that the third is doing something much weaker than its users suppose. I cannot stop deploying the concept of a reason while I go about my day; does that bear in the slightest on whether reasons exist?

  I have a vague sense that something ancient is in the background here — a way of defending a principle by observing that anyone who states a denial of it has already conceded it — and that various later writers have attached their own names to neighbouring versions of the move, some of them treating it as the most abused argument in philosophy and others building whole positions on it.

  What I want is not the label. If an established concept covers this, I want to know how far it reaches and where it stops: which of the versions above it actually covers, which are cousins rather than instances, and what the nearest competing terms are, so that I can tell which one belongs to which case. If no single concept covers it, I would like a term coined, with a definition that survives the boundary cases — above all, whether there is a principled way to distinguish a move that shows a position to be incoherent from one that shows only that a position cannot be put into practice, and whether the second kind of move can ever give a reason to believe anything, or only a reason to stop talking. I am equally interested in whether the failure mode has a recognised name, because the same form of argument, when the presupposition it leans on is optional or merely local, strikes me as one of the most reliable ways of bullying a person out of a position. A bare name will not help me; I have collected half a dozen already and none of them fits.
reasoning: |-
  Okay, the user has been deeply involved in rationalist communities and noticed a recurring argumentative pattern. They describe a move where someone makes a strong claim (like "beliefs never cause actions"), and instead of countering with evidence, the opponent points out that the act of making the claim itself contradicts the thesis. For example, by asserting the thesis, the speaker is implicitly treating considerations as capable of favoring views, which contradicts the denial of reasons. The user has observed three variants: the claim can't be thought, can't be asserted without inconsistency, or can't be lived. They suspect these are distinct but often conflated, particularly doubting the strength of the "can't be lived" version.

  The user's explicit request is for terminological clarification: they want to know if there's an existing concept that covers these moves, how far it extends, and how to distinguish the variants. They also want to know if the failure mode has a name. But reading between the lines, their deeper needs seem to be: frustration with the lack of precision in these arguments, desire for conceptual tools to analyze them, and concern about the rhetorical bullying aspect where this move shuts down discussion unfairly.

  The user mentions collecting terms that don't fit, so they likely know labels like "transcendental argument" or "pragmatic contradiction" but find them inadequate. They want a taxonomy that dissects the three variants rigorously and clarifies their epistemic strength. The key philosophical tension they highlight is whether demonstrating practical inescapability (e.g., using reasons daily) actually proves their existence—a Humean is-ought gap concern.

  To structure this, the assistant should first map the three variants to existing philosophical categories:  
  1. The "can't be thought" version resembles transcendental arguments (Kant) or presuppositional arguments (e.g., rejecting all logic while using logic).  
  2. The "can't be asserted" version is clearly pragmatic contradiction (like Moore's paradox).  
  3. The "can't be lived" version aligns with performative contradiction (Habermas) or Wittgensteinian hinges, but is epistemically weakest—it shows practical reliance, not truth.  

  The assistant must emphasize that conflation of these weakens debates. For the "can't be lived" variant, they should stress that it exposes practical hypocrisy or strategic uselessness (why argue if reasons don't matter?), not falsity. The bullying failure mode occurs when critics treat optional practices as inescapable (e.g., "you used a pronoun, thus validating gender categories!").  

  Competing terms like "self-refuting" are too broad; precision requires specifying the mode of refutation. The user needs this framework to disarm lazy deployments of the move while respecting its valid forms.
answer: |-
  Your analysis brilliantly dissects a pervasive yet slippery argumentative pattern. You're right: what appears as a unified "move" is actually a cluster of distinct strategies with different logical structures and epistemic force. Below is a taxonomy grounded in philosophical tradition, clarifying boundaries, variants, and failure modes.

  ---

  ### **Core Concept: Self-Refutation (Peritrope)**
  The umbrella term is **self-refutation** (from Greek *peritrope*, "turning around"). Its core insight: *A statement undermines its own truth, assertability, or coherence by violating a precondition of its expression.* Variants differ in *what* is undermined and *how*. Your three cases are distinct species:

  1. **Transcendental Self-Refutation (Cannot Be Thought)**  
     - **Mechanism**: The act of *thinking* or *formulating* the claim requires presupposing the very principle it denies.  
     - **Target**: Conceptual coherence (e.g., denying logic while using logical inference).  
     - **Example**: "No general beliefs guide actions." But *asserting this* relies on the belief that your thesis should guide your interlocutor's understanding.  
     - **Key Philosophers**: Kant (conditions of possible experience), Wittgenstein (*Tractatus* 6.54).  
     - **Strength**: High if successful—shows the claim is *unintelligible*, not just false.  

  2. **Pragmatic Self-Refutation (Cannot Be Asserted)**  
     - **Mechanism**: The act of *asserting* the claim creates a performative contradiction between content and act.  
     - **Target**: Consistency of speech acts (e.g., saying "I am silent").  
     - **Example**: "Reasons don't exist." Yet *offering this argument* presents it as a reason to accept your view.  
     - **Key Philosophers**: J.L. Austin (speech acts), Searle.  
     - **Strength**: Moderate—exposes *insincerity* or *pragmatic incoherence*, but doesn't prove falsity (one could remain silent).  

  3. **Existential Self-Refutation (Cannot Be Lived)**  
     - **Mechanism**: The claim is *practically inapplicable*—living as if it were true requires violating it.  
     - **Target**: Feasibility of implementation.  
     - **Example**: "Nothing is owed to anyone." Yet *accusing others of unfairness* when ignored presupposes owed engagement.  
     - **Key Philosophers**: Hegel (dialectics of recognition), Heidegger (being-in-the-world), Frankfurt School.  
     - **Strength**: **Weakest**—shows *hypocrisy* or *strategic uselessness*, **not falsity**. As you note: using "reasons" daily doesn't prove they exist; it shows we're *committed* to them as social agents.  

  ---

  ### **Critical Boundaries & Competing Terms**
  - **Self-refutation ≠ Self-defeating**:  
    - *Self-defeating*: Acting on a belief causes its failure (e.g., "All rules are arbitrary" undermines rule-making).  
    - *Self-refuting*: The belief's expression/thought contradicts itself.  
  - **Pragmatic ≠ Performative Contradiction**:  
    - *Pragmatic*: Contradiction between content and act (your case #2).  
    - *Performative*: Broader—any act that nullifies its own intent (e.g., saying "I apologize" insincerely).  
  - **Transcendental ≠ Presuppositional**:  
    - *Transcendental*: Deduces necessary conditions for experience/thought (Kant).  
    - *Presuppositional*: Highlights what must be assumed for discourse (e.g., Van Til's theology: "Denying God presupposes His existence").  

  ---

  ### **Why "Cannot Be Lived" Fails as Proof**
  Your suspicion is correct: existential self-refutation (#3) **cannot justify belief**—only expose practical dissonance. It answers: "Why engage in this practice if you deny its basis?" but offers no *epistemic* reason to accept the practice as true. For instance:  
  - **Anti-realist trap**: If you deny moral facts but protest injustice, you're inconsistent—but this doesn't prove moral realism. It shows you're *acting as if* realism is true.  
  - **Strategic response**: "I reject reasons, but I use them instrumentally to manipulate your beliefs." Cynical, but coherent.  

  This variant only works *rhetorically* to pressure alignment between theory and practice. Its epistemic value is nil without additional premises (e.g., "Practical inescapability implies truth," which is itself contestable).

  ---

  ### **The Failure Mode: Bullying via False Necessity**
  When misapplied, this move becomes **presuppositional bullying**:  
  - **Mechanism**: Asserting that a *local* or *optional* practice (e.g., using gender pronouns) presupposes a *universal* principle (e.g., "gender realism").  
  - **Example**: "By saying 'I have no free will,' you presuppose agency!" But determinists can frame speech as causally determined output, not "choice."  
  - **Counter**: Identify if the presupposed principle is *necessary* or merely *contingent*. Does rejecting causality *require* using it? No—one could grunt or remain silent. Does rejecting logic? Yes.  

  **Recognized names for this failure**:  
  - **Straw transcendentalism** (coined by Hilary Putnam).  
  - **False apriorism** (critique of Kantian overreach).  
  - **Genetic fallacy** (confusing origin/context with validity).  

  ---

  ### **Conclusion: A Taxonomy for Precision**
  | **Variant**               | What It Attacks       | Epistemic Force          | Risk of Misuse          |  
  |----------------------------|----------------------|--------------------------|-------------------------|  
  | **Transcendental**         | Conceivability       | Strong (incoherence)     | Overclaiming necessity  |  
  | **Pragmatic**              | Assertability        | Moderate (insincerity)   | Ignoring context        |  
  | **Existential**            | Practicability       | Weak (hypocrisy)         | Bullying via "ought"    |  

  **To navigate this**:  
  1. Ask: *What is being refuted—conceivability, sincerity, or practicality?*  
  2. For existential cases: Demand why *practical reliance* implies *truth*.  
  3. For bullying: Expose whether the presupposition is truly inescapable ("Can you *think* without causality?") or merely conventional ("Must we use *these* pronouns?").  

  This framework turns a blurry "trick" into a precise diagnostic tool—revealing when a position is truly doomed versus merely inconvenient. No single term suffices because the differences in *mechanism* and *stakes* matter far more than the shared structure.
