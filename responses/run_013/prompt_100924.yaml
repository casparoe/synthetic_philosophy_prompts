prompt: |-
  I have been a longtime reader of LessWrong and the wider rationalist blogosphere, and I host a small interview podcast for that audience. Our next guest is a philosopher who defends a view she calls equilibrium realism about social kinds. On her account, social kinds such as money, race, gender, borders, and marriage are not fictions or mere labels. They are real, but their reality is the reality of a stable equilibrium: a self-reinforcing pattern of beliefs, expectations, and sanctions that makes the kind term track something in the world. Money is her paradigm case; race and gender are her stress cases. She also holds that the classification can loop back and change the people classified, so the kind is not merely a neutral description of a pre-existing population. I want to interview her in a way that gets past the usual talking points that social construction is either trivial or a form of denialism. Write eight to ten questions, each followed by a follow-up keyed to the answer she is most likely to give. Include at least one question on each of the following: why money is the easy case while race and gender are the hard cases; whether her view can explain the wrongness of racial or gender injustice without making the wrongness itself merely socially constructed; the causal-explanatory demand, that is, what social kinds explain that individual beliefs and actions do not; the looping or feedback effects by which classifications alter the classified; the political question of whether calling a kind socially constructed gives any reason to reform or abolish it; and the limits of the equilibrium model, especially cases of asymmetric power, historical contingency, and people who do not endorse the classification imposed on them. Press where the literature presses: the circularity of collective belief creating the kind, the difference between construction and convention, the threat of relativism, the possibility of mistaken membership in a social kind, and the persistence of a social kind after the practices that created it have changed. Make her work for her answers rather than repeat her abstract. Do not ask what drew her to the topic, for a summary of her book, or for reading recommendations. Keep the whole response under 900 words. Lead each item with the question in bold, then the follow-up in one or two sentences. No preamble or closing.
reasoning: |-
  Okay, let me unpack this request carefully. The user wants an interview framework for a philosopher specializing in equilibrium realism about social kinds, with very specific constraints. 

  Hmm, the core challenge is crafting questions that cut deeper than surface-level social construction debates. Money as the paradigm case makes sense - it's clearly equilibrium-dependent but uncontroversially real. Race and gender as stress tests reveal where the theory might fray. 

  I notice several tension points the user wants probed: the circularity of belief creating reality (especially problematic for race/gender), whether normativity can be grounded beyond social consensus, and how power asymmetries disrupt equilibrium models. The follow-ups need to anticipate standard defenses and push further - like asking how looping effects avoid determinism when discussing gender socialization. 

  For the injustice question, the trap to avoid is making morality itself constructed. The follow-up should press whether her framework has resources beyond "we collectively disapprove" to condemn oppression. Maybe reference historical atrocities that weren't considered wrong in their time? 

  The causal-explanatory angle is crucial. Individual beliefs can't explain systemic patterns like housing discrimination - but how does her view improve on existing institutional analyses? Follow-up could ask why equilibrium adds value over, say, Bourdieu's fields. 

  Power asymmetry is the biggest threat. If equilibrium requires broad endorsement, how does she explain persistent hierarchies where dominated groups "accept" their position? Follow-up must challenge whether stability equals legitimacy. 

  Political implications need delicate handling. The question shouldn't assume construction implies eliminability (money shows otherwise), but must explore when dismantling becomes necessary despite functionality. Ferguson's "racial institutions without racism" case comes to mind. 

  On persistence of kinds after practice-changes: race categories surviving slavery's abolition is the obvious test. Follow-up should ask when a kind stops being "the same" equilibrium - is Confederate nostalgia still the same racism? 

  Mistaken membership cases (passing, misgendering) probe classification accuracy. The tension: if the kind is belief-dependent, can someone truly be "wrongly" classified? Follow-up might cite transgender experiences where assigned gender fails to map to self-conception. 

  Relativism looms throughout. Maybe end with whether her realism allows criticizing other cultures' social kinds - say, caste systems. That's where the rubber meets the road. 

  Word count is tight. Each Q&A pair must do triple duty: introduce concept, challenge theory, and push beyond abstractions. Prioritize the stress cases - they reveal most.
answer: |-
  **1. Money seems straightforward: people collectively treat shells or paper as valuable. But race/gender involve bodies and biology. Why are those harder cases for equilibrium realism?**  
  *Likely answer: They're entangled with physical traits, creating an illusion of pre-existing natural kinds.*  
  **Follow-up:** But doesn't this entanglement itself emerge from the equilibrium? If beliefs about biology are shaped *by* the social kind (e.g., racial science justifying hierarchy), isn't the "physical trait" argument circular? How do you disentangle the biological input from the socially constructed overlay?  

  **2. If social kinds are real because they’re stable equilibria, does that make oppressive systems like apartheid *more* real? How does your view condemn such systems without reducing "wrongness" to just another social fact?**  
  *Likely answer: Stability doesn't imply morality. Oppression causes harm, violating objective well-being.*  
  **Follow-up:** If "objective well-being" grounds the wrongness, isn't that an appeal to *non-social* facts? Doesn't this undermine the claim that the *kind itself* (e.g., race under apartheid) is *constituted* solely by the equilibrium?  

  **3. What concrete phenomena can the social kind "money" explain that simply pointing to individual beliefs about paper or metal cannot?**  
  *Likely answer: Large-scale coordination, systemic inflation, trust in strangers, the existence of central banks.*  
  **Follow-up:** Does "equilibrium" add explanatory power beyond simply saying "institutions exist"? Isn't "institution" already a causal-explanatory concept? Why is the *equilibrium pattern itself* doing heavier lifting?  

  **4. You emphasize "looping effects" where classifying people changes them. How does this avoid determinism? If gender norms shape behavior, can individuals genuinely resist or reshape the kind?**  
  *Likely answer: Individuals can challenge norms, shifting the equilibrium over time through collective action.*  
  **Follow-up:** Doesn't this make the kind inherently unstable and contested? How can it be a "stable equilibrium" if its core features (e.g., what behaviors constitute "woman") are precisely what’s being fought over?  

  **5. Calling marriage a social construct doesn't tell us whether to keep it, reform it, or abolish it. What political guidance, if any, does equilibrium realism offer about reforming social kinds?**  
  *Likely answer: It reveals their contingency and malleability, showing reform is possible, but doesn't dictate specific changes.*  
  **Follow-up:** If stability is the hallmark of reality, doesn't this implicitly favor *preserving* existing kinds? Doesn't urging reform rely on values *external* to the equilibrium model itself?  

  **6. How does your model handle asymmetric power? Can a stable equilibrium truly exist if a dominant group forces a classification (like racial hierarchy) onto a resistant group?**  
  *Likely answer: Forced compliance (through sanctions) *can* sustain an equilibrium, but it's often fragile.*  
  **Follow-up:** Doesn't this blur the line between "stability through belief/expectation" and "stability through coercion"? If the dominated group *doesn't* endorse the classification, is the kind still real *for them*, or is it an imposed fiction?  

  **7. Race categories persist despite the discrediting of biological race science. How can a kind remain "the same" if the practices/beliefs constituting its equilibrium radically change (e.g., from biological essence to social constructivism)?**  
  *Likely answer: The core function (social sorting) persists, anchored by new beliefs within a transformed equilibrium.*  
  **Follow-up:** At what point does the change in constitutive beliefs become so great that it's a *different* social kind altogether, rather than the same kind persisting? What defines the identity of the kind over time?  

  **8. Can someone be *mistaken* about their membership in a social kind? For example, someone who identifies as a different gender than assigned, or someone "passing" for a race they weren't raised in.**  
  *Likely answer: Yes, because membership depends on the collective equilibrium of recognition, not solely self-identification.*  
  **Follow-up:** Doesn't this risk reifying the very classifications individuals resist? If the collective equilibrium is *wrong* (based on harmful stereotypes), why should its "mistake" override an individual's self-understanding within the kind?
