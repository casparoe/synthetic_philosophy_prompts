  ### Closing List of What the Procedure Cannot Do

  1. **Cannot prevent members from having meddlesome preferences**: The procedure can exclude them from the Pareto step, but it cannot stop members from having them, which might lead to resentment.
  2. **Cannot detect strategic behavior**: Members might misrepresent their preferences (calling a preference non-meddlesome when it is) or redefine coordinates strategically.
  3. **Cannot handle dynamic changes**: The procedure assumes a fixed set of outcomes and preferences. Changes over time (new issues, new members) require re-running.
  4. **Cannot define what is personal**: The initial definition of personal coordinates is a judgment call and might be contentious.
  5. **Cannot guarantee stability**: Once adopted, members might challenge the domains or the exclusions in practice.
  6. **Cannot resolve without judgment**: At several steps (especially when choosing levers) the committee must make value judgments.

