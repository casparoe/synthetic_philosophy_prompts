  ### What the Procedure Cannot Do (Limitations)

  1. **Define personal coordinates objectively:** Requires judgment (e.g., is "courtyard view" part of a coordinate?).  
  2. **Prevent strategic behavior:** Members may redefine preferences as non-meddlesome or exaggerate interactions.  
  3. **Handle correlated outcomes:** If one decision (e.g., "ban meat") changes the meaning of another (e.g., "use kitchen"), outcomes may not be independent.  
  4. **Anticipate all interactions:** Some effects (e.g., emotional distress from a flag) may evade "coordinate-altering" tests.  
  5. **Resolve without tie-breaks:** When levers a/b are infeasible or rejected, lever c delegates to authority (e.g., chair, majority).  
  6. **Guarantee compliance:** Members may ignore verdicts (e.g., hang flags despite tie-break loss), requiring enforcement.  

  ---

  ### Design Choices vs. Theorem
  - **Forced by theorem:** Pair test (step 2), minimal liberalism requirement (step 3), unanimity trap detection (steps 4, 6).  
  - **Design choices:**  
    - Defining coordinates (step 1).  
    - Order of lever application (a before b before c).  
    - Allowing tie-breaks for unresolvable cases (step 8).  
    - Excluding "symbolic" or "knowledge-only" effects from interactions (per your vocabulary).  

  This procedure operationalizes Sen’s framework but requires committee judgment at critical points. The goal is to make tradeoffs (individual vs. community) explicit and defensible.
