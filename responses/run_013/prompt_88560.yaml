prompt: |-
  ok so I've been reading around the uncertain-evidence litrature and here's roughly where I've landed — I'd like to know if it actually hangs togther:

  (a) I don't think I'm ever certain of anything about the world. Not that the wall is red, not even that I'm in pain right now — everything is a matter of degree.
  (b) Given (a), plain conditionalizing on a proposition can't be the whole story. The right rule is the one where you redistribute your credences across a partition of evidential states instead of conditioning on a single thing.
  (c) What makes an update rule the right rule is that using it can't expose you to a diachronic Dutch book, or at least that it keeps you calibrated — I'm not fussy about which of those two does the real work, I just think it's one of them.
  (d) But when I look at a wall in good light I do come to know something for certain, namely how it looks to me right now. That's the input the rule in (b) is supposed to act on.
  (e) Two people with the same total evidence should end up with the same credences, no matter what order the evidence came in.

  I have a feeling one of these is quietly doing more work than the others and I can't see which. Tell me which ones genuinely pull against each other, which pairs only look like they conflict, and what the cheapest thing to drop would be. Rank the tensions by severity rather than giving me a list of equal problems, and for the worst one say concretely what I'd have to give up to fix it.
