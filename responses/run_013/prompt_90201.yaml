  ### **Decision Procedure: Model Output Adjustment Protocol**  
  *Time: <2 hours (use as checklist for committee prep)*  

  #### **Core Principles**  
  1. **Objective Chance vs. Credence**: Only treat the model's output as "objective" if derived from data/stochastic processes. Everything else is "credence" (belief).  
  2. **Defensibility Anchor**: Start from the model; deviations require documented, causal justification.  
  3. **Reference Class Integrity**: Adjustments must not double-count evidence or break class boundaries.  

  ---

  ### **Step-by-Step Questions & Outputs**  
  **Follow in order. Stop at first definitive output.**  

  #### **STEP 1: Is the model's output an "objective chance"?**  
  - **Question**: "Was this probability generated by:  
    - (a) A data-driven/stochastic model (e.g., cat model simulations, historical liability frequency)? OR  
    - (b) A vendor's/internal expert judgment presented as a percentage?"  
  - **Satisfying Answer**:  
    - (a) = **Objective** → Proceed to Step 2.  
    - (b) = **Laundered Judgment** → Output: **"Stop, human must own it."**  
      - *Why*: Subjective credence disguised as math isn't defensible as "chance." The chief actuary needs a named expert, not a black box.  

  #### **STEP 2: Is there evidence the model is miscalibrated?**  
  - **Question**: "Does backtesting, recent data, or peer review indicate *systematic* bias (e.g., 'runs hot' in Region X, underprices liability by 10%)?"  
  - **Satisfying Answer**:  
    - **No** → Proceed to Step 3.  
    - **Yes** → Go to Step 2A.  
      - *Key*: Evidence must be empirical (e.g., 5+ years of backtests), not anecdotal.  

  ##### **STEP 2A: Can you quantify the miscalibration?**  
  - **Question**: "Is the bias stable/measurable (e.g., 'overpredicts wind loss by 15% in coastal ZIPs')?"  
  - **Satisfying Answer**:  
    - **Quantifiable (e.g., 15% overprediction)** → Output: **"Deviate: Apply calibration factor."**  
      - *Method*: Adjust multiplicatively (e.g., model probability × 0.85).  
    - **Not quantifiable (e.g., 'runs hot sometimes')** → Output: **"Stop, human must own it."**  
      - *Why*: Unquantified adjustments are indefensible. Flag for model redevelopment.  

  #### **STEP 3: Is there genuine external evidence?**  
  - **Question**: "Do you have material evidence the model *could not* incorporate? (e.g., broker's intel on a building retrofit, news of new regulations, *and* it’s not already in the reference class)."  
  - **Satisfying Answer**:  
    - **No** → Output: **"Use model as-is."**  
    - **Yes** → Go to Step 3A.  
      - *Key*: Exclude anything the model already knows (e.g., "wind exposure" in a wind model).  

  ##### **STEP 3A: Is the outlier status the root cause?**  
  - **Question**: "Was this policy flagged *because* it’s an outlier (e.g., unique features placing it outside the reference class)?"  
  - **Satisfying Answer**:  
    - **No** → Proceed to Step 3B.  
    - **Yes** → Output: **"Deviate: Reassign reference class."**  
      - *Method*: Use the closest analogous class (e.g., if insuring a "weird" factory, use "heavy manufacturing" instead of "commercial property").  

  ##### **STEP 3B: Can you quantify the evidence's impact?**  
  - **Question**: "Is there data/literature to support a numerical adjustment? (e.g., 'fire sprinklers reduce loss probability by 20%')."  
  - **Satisfying Answer**:  
    - **Quantifiable (e.g., 20% reduction)** → Output: **"Deviate: Apply evidence adjustment."**  
      - *Method*: Adjust multiplicatively (e.g., model probability × 0.80).  
    - **Not quantifiable (e.g., 'broker says tenant is unreliable')** → Output: **"Stop, human must own it."**  
      - *Why*: Qualitative nudges lack actuarial defense. Requires underwriter sign-off.  

  ---

  ### **Applied to Your Three Situations**  
  #### **1. Windstorm-Exposed Commercial Property**  
  - **Model output**: 4% annual loss probability.  
  - **Your head**: Backtesting shows model overpredicts by 15% in this region; broker says building just retrofitted with storm shutters (known to reduce loss by 10%).  
  - **Procedure**:  
    - Step 1: Objective (cat model) → Step 2.  
    - Step 2: Miscalibration evidence (15% over) → Step 2A.  
    - Step 2A: Quantifiable → **Deviate: Apply 0.85 calibration** (4% × 0.85 = **3.4%**).  
    - Step 3: External evidence (shutters) → Step 3B.  
    - Step 3B: Quantifiable (10% reduction) → **Deviate: Apply 0.90 evidence adjustment** (3.4% × 0.90 = **3.06%**).  
  - **Final Output**: Use **3.06%**.  

  #### **2. Liability Line: Backtesting Shows Overpricing**  
  - **Model output**: 6% loss probability.  
  - **Your head**: Backtesting shows 20% overpricing across this line; no case-specific evidence.  
  - **Procedure**:  
    - Step 1: Objective → Step 2.  
    - Step 2: Miscalibration evidence (20% over) → Step 2A.  
    - Step 2A: Quantifiable → **Deviate: Apply 0.80 calibration** (6% × 0.80 = **4.8%**).  
    - Step 3: No external evidence → **Use 4.8% as-is**.  
  - **Final Output**: Use **4.8%**.  

  #### **3. One-Off Bespoke Policy (Broker's "Gut" Probability)**  
  - **"Model" output**: Broker's "3% chance of loss."  
  - **Your head**: No backtesting; broker insists it's "similar to last year's claim."  
  - **Procedure**:  
    - Step 1: Laundered judgment (expert gut → percentage) → **Stop, human must own it.**  
  - **Final Output**: **Reject model output**. Chief actuary must approve broker's judgment as subjective credence.  
  - **Why You Won't Like This**: Forces you to defend a non-math input. But it’s honest and avoids laundering.  

  ---

  ### **Where It Misfires or Causes Disagreement**  
  1. **Misfires**:  
     - **Over-reliance on quantification**: If evidence is real but unquantifiable (e.g., geopolitical risk), it defaults to "human judgment," which may delay decisions.  
     - **Calibration instability**: If backtests show erratic bias (e.g., model overpredicts in year 1, underpredicts in year 2), Step 2A forces a "stop," even if you "feel" it’s fixable.  

  2. **Analyst Disagreement**:  
     - **Step 1 (Objective vs. Laundered)**: Vendor models with "expert overlays" are ambiguous. Reasonable analysts may split.  
     - **Step 3A (Outlier vs. Normal)**: Whether a policy is "outside the reference class" is often subjective.  
     - **Step 3B (Quantifiability)**: e.g., Is "regulatory change risk" quantifiable? Actuaries may disagree.  

  ---

  ### **Contested vs. Settled Elements**  
  | **Step**               | **Settled**                                  | **Contested**                                                                 |  
  |-------------------------|----------------------------------------------|-------------------------------------------------------------------------------|  
  | **Deference to model**  | Start with model as baseline (Principal Principle). | Whether non-data adjustments "break" objectivity. Purists say "never nudge"; pragmatists allow causal evidence. |  
  | **Quantification**      | Unquantified adjustments are indefensible.   | How much data justifies "quantifiable" (e.g., is 3 years of backtests enough?). |  
  | **Reference classes**   | Outliers require reclassification.           | What defines a "valid" analogous class? No consensus.                         |  

  ---

  ### **Final Checklist Before Committee**  
  1. Run through Steps 1–3B in order.  
  2. Document:  
     - Evidence type (miscalibration, external, outlier).  
     - Quantification source (e.g., "ISO data shows 10% reduction").  
     - If "stop," name the human owner (e.g., "underwriter to justify").  
  3. For disagreements: Flag contested steps and provide alternatives.  

  This procedure ensures defensibility by tethering adjustments to causality, quantification, and reference class logic—not vibes. It forces clarity on what’s math vs. judgment, which the chief actuary will appreciate.
