answer: |-
  ## The Structural Failure of Indirect Normativity

  The strongest form of indirect normativity holds that the ultimate source of normative truth for a non-ideal agent lies in the verdict of a perfectly idealized deliberative process. This idealization is not merely a heuristic; it is *constitutive* of what the agent ought to do. Its appeal is profound: it promises to resolve deep normative disagreements by appealing to a perspective purified of bias, ignorance, and irrationality, offering objectivity without metaphysical mystery. Whether it's the perfectly informed and impartial "Ideal Observer," the unanimous agreement of agents under procedurally fair "Hypothetical Choice" conditions, or the hypothetical endpoint of indefinitely extended rational inquiry ("Convergence of Inquiry"), the core claim is that *this* output – not our messy intuitions or contested first principles – is authoritatively normative for us. It grounds morality or practical reason in a kind of idealized rationality itself.

  This project fails structurally, captured by a dilemma targeting the **Construction Parameters** required to define any such idealization:

  1.  **Thick Construction (Leakage):** If the construction parameters are specified richly enough to guarantee a unique, substantive verdict, then that verdict is *entailed* by the parameters themselves. The idealization becomes a redundant computational exercise, merely unpacking the normative commitments smuggled into the setup. The normative work is done by the stipulations, not by the idealization.
  2.  **Thin Construction (Indeterminacy):** If the construction parameters are specified thinly enough to avoid presupposing substantive normative content – aiming for true procedural neutrality – then the idealization becomes radically indeterminate. It fails to generate a unique, action-guiding verdict for the non-ideal agent facing a concrete situation. The account is silent.

  **Applying the Dilemma to Concrete Constructions:**

  1.  **Hypothetical Choice (e.g., veil-of-ignorance type):**
      *   *Construction Parameters:* Agents ignorant of their specific identities, social positions, and conceptions of the good; constrained to choose principles for a basic social structure; motivated by rational self-interest (or perhaps a "thin" theory of the good); subject to specific decision rules (e.g., maximin, expected utility).
      *   *The Leakage:* The substantive normative output (e.g., principles protecting basic liberties, guaranteeing a social minimum) is *directly generated* by the stipulations: ignorance forces impartiality, the specific decision rule (like maximin under uncertainty) generates risk-aversion towards worst-case scenarios, and the focus on "basic structure" defines the scope of concern. The "choice" merely calculates the implications of these loaded parameters. Change the parameters (e.g., allow knowledge of risk-aversion tendencies, use average utility), and the "chosen" principles change radically. The normative force originates in the theorist's stipulation of the veil's rules, not in the hypothetical act of choosing itself.

  2.  **Ideal Observer (Fully Informed, Impartial, Calm):**
      *   *Construction Parameters:* Possession of all non-normative facts; perfect imaginative capacity; freedom from distorting passions or biases; a specific conception of "impartiality" (e.g., giving equal weight to all affected interests, or adopting a "common point of view"); a specific conception of "rationality" governing attitude formation and integration.
      *   *The Leakage/Indeterminacy:* If "impartiality" is defined substantively (e.g., equal consideration), then the verdicts (e.g., utilitarianism) leak directly from *that* parameter; the "full information" and "calmness" are window dressing. If "impartiality" is defined purely procedurally (e.g., "weighing interests without self-preference"), it becomes radically thin. Combined with full information and calmness, this yields no unique verdict: *How* should the ideal observer weigh competing interests? Aggregatively? Prioritarily? Respecting separateness of persons? The ideal observer remains mute unless a substantive weighting principle is presupposed in the construction. The calm, fully informed but procedurally "impartial" observer has no algorithm for resolving conflicts between, say, maximizing welfare and respecting autonomy unless a prior normative commitment defines "impartial" adjudication.

  **Defusing Escape Routes:**

  *   **Self-Specifying Idealization ("The parameters are whatever the idealization would choose!"):** This is either viciously circular or collapses into one horn. To run the idealization *at all*, we need *initial* construction parameters to define the choosing agent or procedure. If we start with minimal parameters (e.g., "perfectly rational"), we face indeterminacy (Horn 2). If we try to bootstrap by having the idealization select its *own* parameters, we need prior parameters to define the agent doing the selecting, leading to infinite regress or, again, reliance on initial, substantive stipulations (Horn 1).
  *   **Normatively Innocent Parameters ("Facts and logic aren't normative!"):** This misses the point. While raw facts and deductive logic might be non-normative, the *selection* of *which* facts are relevant, *how* they are to be processed (e.g., which decision rule under uncertainty?), and the *structure* of rationality (e.g., coherence only, or substantive requirements for attitude formation?) are deeply normative choices. Stipulating that the ideal observer knows *all* non-normative facts doesn't specify which facts bear on value; stipulating rational self-interest under the veil smuggles in a controversial conception of rationality and motivation. The innocence is illusory.
  *   **Merely Organizational/Interpretive ("It doesn't generate verdicts, just clarifies ours!"):** This concedes defeat. If the account doesn't *generate* authoritative normative verdicts but only organizes pre-existing ones, it fails as a theory of *indirect normativity* – the core claim that the idealization's output *constitutes* what we ought to do. It becomes a descriptive or hermeneutic tool, not a normative foundation.

  **What Success Would Require:**

  For an indirect normativity account to succeed, it would need to specify construction parameters that are simultaneously:
  1.  **Formal/Procedural:** Devoid of any substantive normative content that would predetermine the output (avoiding Leakage).
  2.  **Determinate:** Capable of generating unique, substantive, action-guiding verdicts for non-ideal agents in the real world (avoiding Indeterminacy).
  3.  **Authoritative:** Providing a reason for the non-ideal agent to follow the verdict that doesn't itself presuppose the normative content the account is meant to ground (solving Transfer).

  The Transfer problem is fatal even if (impossibly) Leakage and Indeterminacy were avoided. Appeals to the agent's "own rationality" committing them to the ideal verdict presuppose a substantive conception of rationality identical to the one built into the idealization. Appeals to the "authority of the procedure" merely restate the problem. Appeals to the "value of approximating the ideal" require an independent normative reason to value that approximation, undermining the claim that normativity *stems* from the idealization. I judge this triad of requirements (Formal, Determinate, Authoritative) to be mutually incompatible. The formal requirement empties the procedure of content needed for determinacy and authority; injecting content for determinacy violates formality and renders authority dependent on that presupposed content.

  **What Survives?**

  The failure of indirect normativity does not imply normative nihilism or quietism. It points towards **direct normativity**. What survives the dilemma are:
  1.  **Agent-Relative Reasons:** First-order normative reasons grounded directly in the agent's situation, relationships, projects, and capacities, without needing mediation by an idealization. (E.g., "You ought to keep that promise because *you* made it to *that person*").
  2.  **Particularist Judgement:** Normative truths as situated and potentially uncodifiable, grasped through perception-like discernment of relevant features in specific contexts, not deduced from idealized procedures.
  3.  **Modest Coherence Requirements (Potentially):** Purely *structural* demands of consistency and instrumental efficiency *within* an agent's existing commitments *might* survive, but only if understood as conditional ("*If* you intend X, and Y is necessary for X, you ought to intend Y") rather than as generating substantive reasons out of thin air. However, any attempt to bootstrap these into substantive normativity (e.g., via radical revision of commitments towards "coherence") risks collapsing back into the idealization dilemma.

  **Contractualism and Shared Standpoints:** These are vulnerable. If a "reasonable" or "shared" standpoint is defined procedurally/thinly, it faces indeterminacy. If defined substantively (e.g., "reasonable" excludes certain values), it leaks. Its authority over those who reject the definition of reasonableness remains unexplained without presupposing the normativity of that definition. While perhaps useful frameworks for deliberation, they cannot serve as the ultimate ground of normativity without succumbing to the same structural flaw. The dilemma reveals that indirect normativity, in its attempt to escape the messiness of first-order normative claims, inevitably either presupposes them or evaporates into emptiness. The normative must be confronted directly.
