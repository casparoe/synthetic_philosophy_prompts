prompt: |-
  ok, I've been reading around in the free will / moral responsibility stuff for a few months now and I keep bouncing off the same thing: every paper is an arguement about one case, and it never adds up to anything you can hold in your hand. So before I read another one I want the spec instead. Give me the desiderata for a theory of moral responsibility -- not free will in general, the narrow thing: what has to be true of an agent for them to be a legitimate target of blame or praise. What does any adequate theory in this area have to deliver? For each requirement, give me the case or consideration that motivates it, and say whether it's non-negotiable or just a prejudice of one camp. A list is fine, a table is fine.

  Things I want in there, though add your own if I'm missing something:

  - the cases it has to get right. You know the standard set: the guy coerced at gunpoint, the kleptomaniac, the brainwashed convert, and the Frankfurt-style case where the counterfactual intervener never actually has to do anything because the agent does it on his own -- the whole point of that one being to kill off the idea that you have to have been able to do otherwise. But I've got two of my own below and I mostly want the list built around those, since I think the standard set is what lets everyone talk past each other.
  - the distinctions it can't collapse. Candidates: excusing someone (they did it, but it doesn't count) vs exempting them (they're not in the responsibility game at all); being the author of your action vs being the one who has to answer for it; being responsible for an action vs being responsible for the character it flows out of; and degrees, responsible vs responsible-to-this-extent. Tell me which of these do real work and which are just verbal, and whether any of them is really doing the job of a seperate requirement.
  - the results it has to be consistent with. Determinism may be true or false and the theory shouldn't presuppose either way. Moral ignorance is real: people do terrible things out of false moral beliefs they aren't culpable for picking up. Luck is real: two equally careless drivers, one hits a kid. And responsibility seems to attach to omissions and to things done by many hands, not just to single agents pushing single buttons.

  My two cases:

  Case 1, the wrong button. Jones is a decent person. He's been told, by a source he has every reason to trust and no way of checking, that pressing the button will divert a flood away from a town and into an empty valley. It will actually kill a hundred people in the valley. He presses it. Also, Black has been watching; had Jones shown any sign of not pressing it, Black would have forced his hand. So Jones couldn't have done otherwise, and he acted out of a false moral belief he isn't culpable for. Is he responsible for the hundred deaths? My instinct is there's nothing to blame him for and yet the act is more his than anyone else's. So if the theory says there's no responsibility here, I want to know what it thinks it has explained; if it says he is responsible, I want to know for what.

  Case 2, the self-made man. At 20, Jones deliberately and culpably makes himself ruthless: he takes a course of treatment he knows will strip out his scruples, because he wants the career. At 40 he betrays his friend, and the betrayal flows from exactly the disposition he installed. He wavered for a second at 40; the treatment would have kicked in and made him do it anyway. So he's a Frankfurt case whose counterfactual intervener is his own past self. Blame him? And if yes, is the tracing back to 20 doing any work, or has the clause about the treatment kicking in made the tracing idle? I suspect the second, and I want the desiderata to force that issue rather than let a theory quietly pick whichever half of the case suits it.

  Then the part I most want:

  - is any subset of the requirements jointly unsatisfiable? My suspicion is that exonerate the manipulated agent and don't be a sceptic about ordinary responsibility can't both be had, because none of us chose our constitutions and the line between a cult upbringing and an engineered one looks arbitrary; if you drop the first you owe me a principled difference, and if you drop the second you're a sceptic. Say whether I'm right, and if so which requirement you'd rather lose and why.
  - which single requirement knocks out the most popular theories? One requirement, named, plus the theories it kills.
  - which requirement is doing the least work -- the one that sounds like a requirement but that everyone satisfies trivially, so it's basically decoration.

  Skip the scorecard, I'll do that myself in class. And no reading list, that's not what I'm after.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been diving into free will and moral responsibility literature but feel frustrated because discussions revolve around isolated cases without building a coherent framework. They want desiderata for a theory of moral responsibility specifically—what makes an agent blameworthy or praiseworthy. 

  First, I need to focus on their two key cases: Wrong Button and Self-Made Man. These seem central to their frustration. The Wrong Button case challenges the necessity of alternative possibilities and moral ignorance. The Self-Made Man probes tracing and preemptive manipulation. The user suspects that tracing might be idle in the latter, so I should ensure desiderata force theories to address that.

  The user also mentions distinctions like excuse vs. exemption and action vs. character responsibility. I should clarify which distinctions are substantive. They’re skeptical about reconciling non-skepticism with exoneration of manipulated agents, seeing a slippery slope between cult upbringing and engineered dispositions. This points to a tension between Source and Non-Skepticism requirements.

  Next, I’ll list core desiderata. Control Condition covers coercion and kleptomaniac cases. Epistemic Condition handles moral ignorance, like in Wrong Button. Source Requirement addresses manipulation cases. Non-Skepticism ensures ordinary responsibility isn’t undermined. Frankfurt-Compatibility ensures alternative possibilities aren’t necessary—relevant for both cases. Consequence Scope deals with omissions and collective actions. Luck Neutralization distinguishes outcomes from responsibility, like the reckless drivers. Degrees of Responsibility allows for partial blame. 

  For the user’s cases: Wrong Button needs Control and Epistemic Conditions. Jones isn’t blameworthy because he lacked both control and knowledge. Self-Made Man tests Tracing and Source. The 20-year-old’s choice makes the 40-year-old blameworthy, even if the treatment would’ve forced him—tracing isn’t idle because the action flows from his past responsibility. 

  Tensions: Non-Skepticism and Source might clash if manipulation undermines responsibility. Hard Incompatibilists sacrifice Non-Skepticism; others tweak Source to avoid arbitrariness. The Epistemic Condition is the killer requirement—theories that require full moral knowledge fail in cases like Wrong Button or non-culpable ignorance. The Source Requirement is often decorative if all actions are considered authored by default.

  I’ll structure the response with desiderata, distinctions, their cases, and key tensions. Highlighting the Epistemic Condition as the theory-killer and Source as the weak link should address their deeper need for clarity on why theories fail or succeed. Their suspicion about unsatisfiable requirements is valid—Non-Skepticism and robust Source are in tension, forcing a choice between skepticism or nuanced compatibilism.
answer: |-
  Here's a distilled list of desiderata for a theory of **moral responsibility** (blame/praise-worthiness), grounded in core cases and distinctions, with your two cases integrated as central tests. Requirements marked **[N]** are widely considered non-negotiable; others reflect deep but contested intuitions.

  ---

  ### **Core Desiderata for a Theory of Moral Responsibility**

  | Desideratum                                   | Motivating Case/Consideration                                                                 | Negotiability | Purpose                                                                 |
  | :-------------------------------------------- | :-------------------------------------------------------------------------------------------- | :------------ | :---------------------------------------------------------------------- |
  | **1. Control Condition [N]**                  | **Coercion (gunpoint)**: Agent lacks acceptable alternative. Kleptomaniac: Compulsion defeats control.                               | Non-Negotiable | Distinguish actions under duress/compulsion from free choices.          |
  | **2. Epistemic Condition [N]**                | **Moral Ignorance (Wrong Button)**: Jones acts on false, non-culpable belief. Brainwashing: False beliefs implanted. | Non-Negotiable | Exculpate agents who couldn't reasonably know act was wrong/options.    |
  | **3. Source Requirement**                     | **Manipulation (brainwashed convert)**: Action caused by external hijacking. **Self-Made Man**: Is the source "you"?                 | Contested     | Ensure action originates *in the agent* in a relevant way (vs. puppetry). |
  | **4. Non-Skepticism Requirement**             | **Ordinary Responsibility**: Blaming deliberate betrayal must be possible. Frankfurt cases: Agents act "on their own".            | Contested     | Avoid collapsing into global responsibility skepticism.                 |
  | **5. Frankfurt-Compatibility**                | **Frankfurt Cases**: Agent acts freely *even if* unable to do otherwise (counterfactual intervener irrelevant).                  | Near-[N]      | Decouple responsibility from "alternative possibilities" (AP).          |
  | **6. Consequence Scope**                      | **Moral Luck (reckless drivers)**: Outcome luck shouldn’t *create* responsibility. **Omissions/Collective Action**: Blame for failing to act/distributed harms. | Non-Negotiable | Handle non-action, luck, and multi-agent contexts.                      |
  | **7. Luck Neutralization**                    | **Reckless Drivers**: Both equally blameworthy *before* luck strikes; outcome shouldn't change blame *degree*.                    | Non-Negotiable | Isolate blameworthiness from uncontrollable outcomes.                   |
  | **8. Degrees of Responsibility**              | **Partial Excuses (provocation)**: Mitigated responsibility. **Negligence**: Lesser blame than intent?                         | Non-Negotiable | Reflect intuitive gradations (culpable ignorance vs. malice).           |

  ---

  ### **Key Distinctions (Substantive vs. Verbal)**
  - **Excuse vs. Exemption [Substantive]**:  
    - *Excuse*: Coerced agent (fulfills Control but act justified/forced).  
    *Exemption*: Severe psychosis (lacks capacity to play responsibility "game").  
    - **Work**: Explains why we don't blame coerced adults (excuse) but do blame children differently (exemption).  
  - **Author vs. Answerable [Substantive]**:  
    - Author: Source of action (Source Requirement).  
    Answerable: Capacity to give/receive reasons (Epistemic/Control).  
    - **Work**: Distinguishes *why* we blame manipulated agents (not author) vs. ignorant agents (not answerable).  
  - **Action vs. Character [Verbal in Practice]**:  
    - Collapses: Responsible *for actions* that express character. Tracing (Self-Made Man) links character to past responsible actions.  
  - **Responsible vs. Responsible-to-Degree [Substantive]**:  
    - See "Degrees of Responsibility" desideratum.  

  ---

  ### **Your Cases as Tests**
  1. **Wrong Button (Jones)**  
     - **Requirements Tested**: Control (N), Epistemic (N), Frankfurt-Compatibility, Non-Skepticism.  
     - **Adequate Theory Must**: Exonerate Jones. *Why*:  
       - He satisfies Frankfurt-Compatibility (Black irrelevant) *and* Source (act is "his").  
       - **But** fails Epistemic (non-culpable ignorance) *and* Control (if ignorance negates reasonable alternatives).  
     - **Responsibility?**: Not blameworthy for deaths. May be responsible *for pressing the button* but excused by ignorance.  

  2. **Self-Made Man (Jones at 40)**  
     - **Requirements Tested**: Source, Tracing, Frankfurt-Compatibility.  
     - **Adequate Theory Must**: Blame Jones at 40. *Why*:  
       - Source is *him* (his past responsible choice).  
       - Counterfactual force is *irrelevant* (Frankfurt-Compatibility).  
     - **Is Tracing Idle?**: **No**. The 20-year-old’s choice:  
       - *Makes him responsible for becoming the person who betrays*.  
       - Without tracing, the 40-year-old is exempt (ruthless "compulsion").  
       - The *threat* of intervention doesn’t erase authorship; it confirms the character *he chose* to create.  

  ---

  ### **Tensions & Tradeoffs**
  1. **"Non-Skepticism vs. Source" Conflict**:  
     - **Your suspicion is correct**. Robust Source (actions must "ultimately" originate in you) + Non-Skepticism is unstable if determinism is true (or if constitutions are unchosen).  
     - **The Arbitrariness Problem**: No bright line between "cult upbringing" and "brainwashing."  
     - **Resolution**:  
       - *Sacrifice Robust Source*: Admit it’s "shallow" (e.g., reasons-responsive mechanisms). Risk: Manipulation cases become slippery.  
       - *Sacrifice Non-Skepticism*: Embrace hard incompatibilism (no one responsible). Unacceptable to most.  
       - *Middle Path*: Source = "historical reasons-responsiveness" (Self-Made Man satisfies; manipulated agent doesn’t). Still arbitrary?  

  2. **Theory-Killer Requirement**:  
     - **The Epistemic Condition (N)**. Kills:  
       - **Strict Liability Theories** (blame regardless of knowledge).  
       - **Levy-style Culpable Ignorance Theories** (if ignorance is non-culpable, as in Wrong Button).  
       - **Simple Volitionism** (if "choice" ignores epistemic constraints).  

  3. **Weakest Requirement (Decoration)**:  
     - **Source Requirement**. Often trivially satisfied by:  
       - Compatibilists: Any moderately reasons-responsive mechanism counts as "you."  
       - Libertarians: Undetermined choice = authorship.  
       - **Real Work?** Only in manipulation cases—but even there, theories often gerrymander "source" to match intuitions.  

  ---

  ### **Conclusion on Key Tensions**
  - **Wrong Button & Self-Made Man** together test:  
    - Whether lack of AP *saves* responsibility (Frankfurt-Compatibility) vs. epistemic/control failures *defeat* it.  
    - Whether tracing can ground responsibility for character *without* requiring constant re-choosing.  
  - **The Unsatisfiable Core**: "**Exonerate the deeply manipulated while preserving ordinary responsibility**" *is* unsatisfiable under determinism without an arbitrary line. You *must* either:  
    - Reject deep Source (making manipulation exculpatory only in extreme cases),  
    - Accept skepticism (reject Non-Skepticism), or  
    - Deny the problem (e.g., "manipulation is impossible in a deterministic world").  
  - **Recommendation**: Drop *Robust* Source (require only "moderate reasons-responsiveness + history") to preserve Non-Skepticism. This makes Wrong Button exculpated (fails epistemic) but Self-Made Man blameworthy (satisfies history + responsiveness).  

  This gives you the scaffolding. Theories live/die on how they handle the Epistemic Condition + your two cases while navigating the Source/Non-Skepticism fault line.
