   Setup A (symmetric): Consider an equilateral triangle. We inscribe a circle in it. The circle is tangent to the three sides. We then choose a random point on the incircle. Then we draw the chord that is the intersection of the line through the point and the center of the incircle with the triangle. But then by rotational symmetry, the point on the circle should be uniform, so the chord is uniform by angle. Then the length of the chord might be something.

   But this is getting too complicated.

   Given the time, I think the circle example with the Euclidean symmetry versus rotational symmetry is the best I can do, and it is not the classic Bertrand if we change the method in Setup B to the pointers.

   So for the purpose of your request, I will provide the circle example with the two methods, and in the symmetric case (Setup A) the symmetry is the Euclidean group, while in Setup B the symmetry is only the rotation group around the center. 

   Even though in Setup B the rotational symmetry forces a unique measure, it is different from the measure in Setup A, and the point is that the symmetry in Setup A is larger and gives a different answer. The " matched" part is that both are symmetric under the rotation around the center, but only Setup A has the additional translational symmetry, which upgrades the measure.

   So to answer your question: in Setup A, the symmetry group is larger and it is this larger symmetry that forces the measure. In Setup B, the symmetry group is smaller and it also forces a measure, but a different one. The difference is in the symmetry group.

   Then, if we remove the translational symmetry from Setup A, for example by not being far away and instead being at a fixed distance, then the measure might change. Similarly, if we add translational symmetry to Setup B, it would be hard because the center is fixed.

   So for the steelman: someone might say that equally likely is defined relative to the partition, and the symmetry is just a way to choose the partition. In Setup A, the Euclidean symmetry suggests that we should use the partition induced by the invariant measure. In Setup B, the rotational symmetry suggests the partition induced by the invariant measure under rotations. But then there is no ambiguity in either. To have ambiguity in Setup B, we need a method that is not specified enough. For example, if in Setup B we only said "choose a chord at random" without specifying how, then there is ambiguity. But in our Setup B, we specified a physical process that has rotational symmetry and thus forces a measure.

   So to have a Setup B with ambiguity, we need to not specify the physical process, or specify it in a way that has the symmetry but does not force the measure. For example, in the classic Bertrand, we say "choose a chord at random" and then we have three methods. In our matched pair, we want Setup A to have a symmetry that forces one method as correct for the physical process, and Setup B to have the same physical process but without that symmetry, so that multiple methods are live and give different answers.

   So let's do this:

   Setup A: as before, the circle on the field, throw a straw with Euclidean invariance. This forces the measure. Probability 1/2.

   Setup B: the circle is fixed. We are told to choose a chord at random, but without specification of how. Then we might use different parameterizations. We might choose two points on the circle uniformly (probability 1/3). We might choose a point on a fixed radius uniformly and then draw the chord perpendicular to that radius at that point (probability 1/2). We might choose a point inside the circle and then draw the chord with that point as midpoint (probability 1/4). 

   In Setup B, since the physical process is not specified beyond the circle being fixed and the chord being chosen "at random", we have ambiguity. The rotational symmetry is present, but it does not force a measure because there are different rotationally invariant measures. For example, the measure from the two points method is rotationally invariant, and the measure from the distance from center method is also rotationally invariant.

   In Setup A, the Euclidean symmetry forces a unique measure (up to scale), so only one of these is Euclidean-invariant: the distance from center method (dp dφ) is Euclidean-invariant, while the two points method is not (because if you translate the circle, the two points method is tied to the circle's location).

   Therefore, in Setup A, the symmetry uniquely selects the measure. In Setup B, the symmetry (rotational) is not sufficient to select a measure from the possibilities.

   This matches.

   So let's use this matched pair:

   Case A (symmetric): As before, Euclidean-invariant throw of a straw. Probability 1/2.

   Case B (ambiguous): The circle is fixed. Choose a chord at random. We consider two natural ways:

     Method 1 ( two points ): choose two points on the circle uniformly at random. Then the probability is 1/3.

     Method 2 ( distance from center ): choose the distance from the center uniformly from [0,R], and then choose a random orientation. Then the probability is 1/2.

     Method 3 ( midpoint inside ): choose a point inside the circle uniformly, and take that as the midpoint of the chord. Then the probability is 1/4.

   But we want to use only two. So let's use Method 1 and Method 2.

   In Case B, both methods are rotationally invariant. They give 1/3 and 1/2.

   In Case A, only Method 2 is Euclidean-invariant. Method 1 is not. So the symmetry in Case A selects Method 2.

   Therefore, in Case A, we have a unique answer: 1/2.
   In Case B, we have two answers: 1/3 and 1/2, and rotational symmetry does not break the tie.

   This is what we want.

   Computations (already done):

   Case A: as above, 1/2.

   Case B, Method 1: two points.
     As above, probability 1/3.

   Case B, Method 2: uniform in distance from center.
     The distance p from center is uniform in [0,R].
     Length of chord: 2 sqrt(R^2-p^2).
     Set > sqrt(3) R: p < R/2.
     Probability: (R/2 - 0) / (R - 0) = 1/2.

   So there.

   Now, to answer your other question: if we remove the symmetry from Case A, for example by not being far away and by having a preferred direction, then the Euclidean-invariance is broken, and we might get a different measure. Similarly, if we add Euclidean-invariance to Case B, then we must use the measure of Case A, so the answer becomes 1/2, and the other methods are invalid.

   Steelman: the objector says that "equally likely" is only defined relative to a partition. In Case A, the Euclidean symmetry suggests that the partition should be in terms of the invariant measure (dφ dp), so we use that. In Case B, the rotational symmetry suggests that the partition should be in terms of a rotationally invariant measure, but there are many (e.g., the measure from two points or the measure from uniform distance). Therefore, in Case B, the symmetry does not specify which partition to use. In Case A, it does. 

   So the worry is that in Case B, the symmetry is not sufficient to select a partition, so we have to know the physical process. In Case A, the symmetry is sufficient. The objector might say that the physical process in Case A is specified to be Euclidean-invariant, which forces the partition. In Case B, the physical process is not specified beyond rotational invariance, which is not sufficient. Therefore, the onus is on the specification of the physical process.

   This is a valid point, and it means that the principle of indifference can only be applied when the symmetry forces a unique partition. In Case A, it does. In Case B, it does not.

   We should not be too worried because in many physical situations, the process is specified well enough. The principle of indifference is not a standalone principle; it requires context.

   For your thesis, you can argue that the principle of indifference must be grounded in physical symmetries, and when a unique symmetry-adapted measure exists, it resolves the ambiguity.

   To make the setups concrete and short:

    Setup A: A circle of radius R is drawn on a large floor. You are blindfolded and spun around far away, then you throw a long straw (>>2R) in a random forward direction. What is the probability that the chord thus selected in the circle has length > √3 R?
      Answer: 1/2.

