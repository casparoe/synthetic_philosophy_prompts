   In Case A, the translational and rotational symmetry forces the measure to be dφ dp, hence probability 1/2.
   In Case B, the rotational symmetry around the center is not sufficient to force the measure; we have two natural parameterizations (the two pointers) that give this method, and it yields 1/3.

   Now, to make them as close as possible: in both cases, we are drawing a chord in a circle. The only difference is the method and the symmetries of the method.

   In Case A, the symmetry group is the Euclidean group of the plane. In Case B, the symmetry group is the rotation group around the center.

