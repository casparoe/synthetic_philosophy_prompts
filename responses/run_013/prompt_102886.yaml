   Case A: A circle is drawn on a large field. You are standing very far away, and you throw a long straw (long enough to always intersect the circle) in a random manner that is invariant under translations and rotations of the plane. This means that the distribution of the straw's position is given by the invariant measure on lines: dφ dp. The chord is the part inside the circle. We want the probability that the length of the chord is greater than the side of the equilateral triangle inscribed in the circle (which is √3 R, with R the radius).

   As computed earlier, this probability is 1/2.

   Case B: A circle is fixed on the floor. You stand at the center of the circle and spin a pointer. Where it stops, you mark a point. Then you spin a second pointer to choose a random direction from that point. You draw the chord in that direction. 
