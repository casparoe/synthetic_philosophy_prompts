  First, let's unpack Lewis's result itself. The core idea is that if we assume P(if A, then B) = P(B|A) holds universally, we can derive absurd conclusions like P(if A, then B) = P(B) for all A,B. The proof relies on two key assumptions: (1) the probability of conditionals behaves like regular probabilities (probability of a conditional is a probability), and (2) conditional probabilities follow the standard ratio formula. Lewis showed that under these assumptions, P(B|A) would have to equal P(B), which is clearly false in most cases.

