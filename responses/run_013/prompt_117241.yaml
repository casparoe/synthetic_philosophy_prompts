  Where things get tricky is the conclusion about truth conditions. The passage claims this proves conditionals can't have truth conditions at all. But this is too strong - Lewis himself (and others like Jackson) maintained truth-conditional accounts while accepting the result. They argue the equation P(if A,B) = P(B|A) shouldn't be taken as definitional for probabilities of conditionals, only as a constraint.

  The "no way around it" claim is particularly problematic. Several approaches exist: Adams' own probabilistic semantics, dynamic semantics, or restricted applicability accounts. Even Stalnaker refined his theory post-Lewis. The passage's dismissal of all truth-conditional theories seems unjustified.

