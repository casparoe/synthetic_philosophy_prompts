  We are going to design a classroom activity to illustrate Condorcet's Jury Theorem (CJT). The key points of CJT are:
  1. If each voter is more likely to be correct than incorrect (p > 0.5) and votes independently, then the probability that the majority is correct increases with the number of voters and approaches 1 as the number goes to infinity.
  2. If each voter is less likely to be correct (p < 0.5), then the probability that the majority is correct decreases with the number of voters and approaches 0 as the number increases. In this case, having just one voter (if that voter is the best) might be better.
  3. The independence of errors is crucial. If errors are correlated (e.g., because of a common misleading signal), the group's performance can be worse than that of individuals.

  The activity should have three rounds, each illustrating a different aspect.

  Brainstorming candidate mechanics:

  Option 1: The Binary Quiz Game (as sketched)
  - Use a set of binary-choice questions (true/false, or A/B) with known correct answers.
  - Round 1: Individual voting without any communication. We expect the group majority to outperform the average individual (if p>0.5 and independent).
  - Round 2: Introduce a common signal (e.g., an "expert tip") that is sometimes right and sometimes wrong, creating correlation in errors. This should show that the group majority does not improve (and might even be worse) because the independence is broken.
  - Round 3: Use trick questions where the intuitive answer is wrong (pushing p<0.5). We expect the group majority to be worse than individuals and to get worse as we add more people (but note: we cannot add more than 18, so we'll simulate by comparing small groups to the whole group).

  Option 2: A "Wisdom of Crowds" Guessing Game with a Twist
  - Instead of binary questions, we could have numerical estimation (like guessing the number of jelly beans in a jar). However, for CJT we need binary decisions and the theorem is about majority voting. So this might not fit as well.

  Option 3: A Simulation with Dice or Cards to Model Competence
  - We could assign each student a "competence level" by giving them a biased coin (or a die) that lands on "correct" with probability p. But this might be too abstract and not engaging.

  I think Option 1 is the most straightforward and engaging for a seminar. We'll go with that.

