  **Final Activity Write-Up:**

  **Title:** Condorcet's Jury Theorem: A Classroom Experiment

  **Materials:**
  - Three sets of 7 binary questions (Sets A, B, C) with answer keys.
  - For each student: answer sheets for three rounds (with spaces for 7 answers each) and a pen.
  - Voting cards (small pieces of paper) for each student for each vote (or one sheet per round where they write all answers and tear off?).
  - Whiteboard to record results.

  **Rules and Procedure:**

  1. **Introduction (5 min):**
     - "Today we are going to run an experiment in group decision-making. We'll have three rounds of questions. In each round, you will answer 7 binary questions (True/False or A/B). For each correct answer, you earn 10 points. We will track both your individual scores and the group's performance (by majority vote)."

  2. **Round 1: Independence (13 min)**
     - "Round 1: You will answer 7 questions independently. Do not discuss with anyone. We'll show each question for 20 seconds, then you write your answer privately on your answer sheet and also on a voting card. We'll collect the voting cards and tally the group's majority. Then we'll reveal the correct answer and record how many individuals were correct and whether the majority was correct."
     - Proceed through the 7 questions. For each:
       - Display the question for 20 seconds (read aloud if needed).
       - Students record their answer on their answer sheet and on a voting card.
       - Collect voting cards and quickly tally. Announce the majority vote and the correct answer.
       - Record on the board: for the question, the number of correct individual votes and whether the majority was correct.
     - After Round 1, calculate and display:
       - Average individual accuracy: total correct individual answers (sum over all students and questions) divided by (18 * 7).
       - Group accuracy: number of questions for which the majority was correct, divided by 7.

  3. **Round 2: Correlated Errors (13 min)**
     - "Round 2: We have a new set of 7 questions. This time, before each question, I will give you an expert tip. The expert is a knowledgeable source but is not infallible. Use the tip as you see fit."
     - For each question:
       - Read the expert tip (which is a statement that suggests an answer, either correct or incorrect). Example: "The expert says the answer is True."
       - Display the question and give 20 seconds for answering.
       - Collect votes and tally as before.
     - After Round 2, compute the same statistics.

  4. **Round 3: Below-Chance Competence (13 min)**
     - "Round 3: This set of questions is tricky. They are designed so that the intuitive answer is often wrong. Be careful!"
     - Same procedure as Round 1 (no expert tip), but with the tricky questions.
     - Compute statistics.

  **Debrief (20 min):**

  1. Show the results on the board:

     | Round | Avg. Individual Accuracy | Group Accuracy |
     |-------|--------------------------|---------------|
     | 1     |           ___            |      ___      |
     | 2     |           ___            |      ___      |
     | 3     |           ___            |      ___      |

  2. Ask: 
     - "What did you notice about the group's performance in Round 1 compared to individual performance?"
     - "In Round 2, how did the expert tip affect your decision? Did you notice any change in the group's performance? Why might that be?"
     - "In Round 3, what happened? Why did the group do worse than individuals?"

  3. Connect to Condorcet's Jury Theorem:
     - Round 1: When individuals are independent and better than chance (p>0.5), the group (majority) does better. And if we added more people, it would get even better (converge to 100%).
     - Round 2: The expert tip created a common source of error, breaking independence. Even if the expert was sometimes helpful, the group's performance suffered because the errors were correlated. This violates the independence assumption.
     - Round 3: When individuals are worse than chance (p<0.5), the group does worse than individuals. And adding more people makes it worse. The best would be a single (competent) person, but here we don't have competence.

  4. Discuss the assumptions:
     - Independence: crucial and easily broken (by common sources of information, peer pressure, etc.).
     - Identical competence: we assumed everyone had the same p, but in reality, some are better than others. (The theorem can be extended to heterogeneous competence, but the basic insight holds if the average p>0.5 and independence holds.)
     - p>0.5: When this holds, groups are powerful. When it doesn't, groups can be dangerous.

  5. Limitations:
     - Asymptotic convergence: We can't see it with 18, but the math shows it.
     - Determinate truth: In real political questions, it's often contested what the "correct" answer is. The theorem applies best in situations where there is an objective truth (like jury decisions: guilty/innocent with ground truth). In politics, we might use voting to aggregate preferences, not just to find truth.

     We can conclude: "Condorcet's theorem gives us a powerful argument for democracy when (1) there is a fact of the matter, (2) voters are on average better than chance, and (3) their judgments are independent. But when these conditions fail, we need to be cautious. This is why institutions that foster diverse and independent thinking are crucial for democracy."

  **Predictable Issues and Mitigation:**
  - Free-riding: Some might try to copy. We enforce private voting and stress that they are staking points on their own answer. If copying occurs, note it in the debrief: "Did anyone feel like they could just follow the group? That would break independence and could lead to worse outcomes."
  - Time pressure: 20 seconds per question might be tight. We can extend to 30 seconds if needed.
  - The expert tip in Round 2: Some might not follow, so the correlation might not be perfect. That's okay; we can discuss the degree of correlation. We can also note that in real life, common information sources (like media) can create correlated errors.

  This activity should create an engaging and memorable experience that illustrates the theorem's dynamics.
answer: |-
  Below is a complete, classroom-ready activity designed to make students experience Condorcet's Jury Theorem (CJT) through gameplay. I've refined your sketch to maximize engagement, clarity, and pedagogical impact while addressing potential pitfalls. The activity uses three rounds to sequentially reveal CJT's core insights: (1) the "wisdom of crowds" under independence and competence, (2) the fragility of independence when errors correlate, and (3) the perils of adding voters when competence drops below chance.

  ---

  ### **Activity Title: Truth or Majority?**
  **Pedagogical Goal:** Students experience CJT viscerally—discovering how group size, individual competence, and error correlation shape collective accuracy—before formalizing the theorem.  
  **Key CJT Concepts Illustrated:** Independence, identical competence, \( p > 0.5 \) vs. \( p < 0.5 \), monotonicity, asymptotic convergence.  
  **Materials:**  
  - Question sets (print or project):  
    - **Set A (Round 1):** 10 binary questions, individual accuracy ~65–70% (e.g., perceptual/logic puzzles).  
    - **Set B (Round 2):** 10 binary questions, similar difficulty to Set A.  
    - **Set C (Round 3):** 10 binary questions, individual accuracy ~30–40% (counterintuitive traps).  
  - Voting materials: Private answer sheets, voting tokens (red/blue cards for A/B options), tally board.  
  - "Expert tip" scripts for Round 2 (pre-written nudges; 5 correct, 5 incorrect).  
  - Scoreboard (physical or digital) tracking individual/group accuracy.  

  ---

  ### **Rules & Payoff Scheme**  
  **Objective:** Maximize points by answering correctly. Points reflect *confidence* to incentivize effort (no real money).  
  - **Per question:**  
    - Stake 1–3 points on your answer (1 = low confidence, 3 = high confidence).  
    - Correct answer: Win points staked.  
    - Incorrect answer: Lose points staked.  
  - **Group Bonus:** In Rounds 1 and 2, if the majority is correct, all players gain +1 point (emphasizing collective success). No bonus in Round 3 (highlighting downside risk).  
  - **No Copying:** Enforce private voting; penalize collaboration (see "Predictable Issues").  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Setup (5 min):**  
  - Distribute answer sheets, tokens, and explain rules. Emphasize: "Your goal is personal points. Stake wisely!"  
  - Clarify: Questions have objective answers; no discussion during rounds.  

  **Round 1: Independence & Competence (\( p > 0.5 \)) (25 min)**  
  - **Mechanics:**  
    - Present 10 questions from **Set A** (e.g., "Which city is farther north: Paris or Montreal? [A: Paris, B: Montreal; Correct: Montreal]").  
    - For each question:  
      - 30 sec: Students privately choose A/B and stake points (record on sheets).  
      - 30 sec: Collect votes via tokens; tally majority publicly.  
      - 15 sec: Reveal correct answer; students record personal gain/loss.  
  - **Data Tracking:**  
    - Post-round: Calculate/display (1) average individual accuracy, (2) majority accuracy (group), (3) total points leaderboard.  
  - **Goal:** Group accuracy > individual accuracy (e.g., 85% vs. 65–70%).  

  **Round 2: Correlated Errors (Breaking Independence) (25 min)**  
  - **Mechanics:**  
    - Use **Set B** questions. Before each question, give an "expert tip" (e.g., "Studies show A is correct" – 5 true, 5 false tips, randomized).  
    - Same voting/staking as Round 1.  
  - **Data Tracking:**  
    - Compare to Round 1: Group accuracy stagnates or drops (e.g., 65% vs. Round 1’s 85%), even if individual accuracy is similar. Highlight correlated errors (e.g., "When the tip was wrong, >80% voted wrong").  
  - **Goal:** Show broken independence harms the group more than individuals.  

  **Round 3: Below-Chance Competence (\( p < 0.5 \)) (20 min)**  
  - **Mechanics:**  
    - Use **Set C** (e.g., "True/False: All insects have six legs. [Correct: True; trap: many think spiders are insects]").  
    - Same voting/staking, but **no group bonus**.  
  - **Data Tracking:**  
    - Post-round: Show group accuracy < individual accuracy (e.g., 20% vs. 35%).  
  - **Goal:** Group performs worse than individuals; more voters = more errors.  

  **Debrief & CJT Link (15 min):**  
  1. **Review Data:** Project results table:  
     | Round | Avg. Ind. Acc. | Group Acc. | Notes |  
     |-------|----------------|------------|-------|  
     | 1 | ~65–70% | ~85% | Group > individuals |  
     | 2 | ~65–70% | ~60–65% | Group ≈ individuals |  
     | 3 | ~30–40% | ~20–30% | Group < individuals |  

  2. **Connect Game → CJT:**  
     - **Independence (Round 1 vs. 2):**  
       - *Round 1:* Errors were random/uncorrelated → group amplified individual wisdom.  
       - *Round 2:* "Expert tip" created correlated errors → group accuracy collapsed despite similar competence. CJT fails without independence.  
     - **Competence Threshold (Round 1 vs. 3):**  
       - \( p > 0.5 \) (Round 1): Adding voters improved accuracy (monotonicity).  
       - \( p < 0.5 \) (Round 3): Adding voters *reduced* accuracy → best to consult few (or one) "expert."  
     - **Asymptotic Convergence:** "With 18 voters, we saw strong trends. Math shows: with 1,000 voters, Round 1’s group would approach 100% accuracy; Round 3’s would approach 0%."  

  3. **Address Limitations & Real-World Gaps:**  
     - **Asymptotic Convergence:** "We simulated directionality, but infinity is abstract. CJT’s power is in showing *trends*—more voters help only if \( p > 0.5 \) + independence."  
     - **Determinate Truth:** "CJT assumes objective answers (e.g., jury verdicts). But democracy often deals with *values* (e.g., 'Is this policy just?'). Here, CJT doesn’t apply directly—yet it still warns us: if voters lack competence or independence, majority rule risks error even on factual sub-questions (e.g., 'Will this policy reduce poverty?')."  
     - **Heterogeneous Competence:** "We assumed identical \( p \), but real voters vary. CJT extends to this: if the *average* \( p > 0.5 \) and independence holds, the theorem still works."  

  4. **Discussion Prompts:**  
     - "When did you feel tempted to ignore your judgment? How does that relate to real democracy?"  
     - "In Round 2, did the 'expert' make you doubt yourself? How might media create similar correlation?"  
     - "Should we use juries for technical decisions (e.g., climate policy) where \( p < 0.5 \)?"  

  ---

  ### **Predictable Issues & Mitigation**  
  - **Free-Riding/Groupthink:**  
    - *Risk:* Students copy neighbors or "follow the crowd."  
    - *Mitigation:* Enforce private voting (e.g., tokens in a box). If cheating occurs, **leverage it in debrief:** "Did anyone assume the majority must be right? In Round 3, that backfired—correlation breaks CJT."  
  - **Question Calibration:**  
    - *Risk:* Pilot accuracy misses targets.  
    - *Mitigation:* Pre-test questions on colleagues. Have backup questions; adjust difficulty mid-activity if needed (e.g., skip a too-hard Set C item).  
  - **Time Pressure:**  
    - *Risk:* Rounds run long.  
    - *Mitigation:* Use a timer. Cut 1–2 questions per round if needed; focus on trends over precision.  
  - **Frustration in Round 3:**  
    - *Risk:* Students feel tricked.  
    - *Mitigation:* Frame it as a "learning trap": "This mimics real biases—like assuming a confident leader must be competent."  

  ---

  ### **Sample Questions**  
  *Calibrate via pilot testing; aim for quick, unambiguous answers.*  
  - **Set A (p > 0.5):**  
    1. "Is a nickel thicker than a dime? (A: Yes, B: No) [Correct: A]"  
    2. "True/False: Canberra is the capital of Australia. (Correct: True)"  
  - **Set B (p > 0.5 + expert tip):**  
    1. "Which is heavier: 1kg of feathers or 1kg of steel? (A: Feathers, B: Steel) [Correct: B; Tip: 'Science says A']"  
  - **Set C (p < 0.5):**  
    1. "True/False: The Atlantic Ocean is the largest ocean on Earth. (Correct: False; Pacific is largest) [Trap: Many say True]"  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* CJT—e.g., the shock when the "wise crowd" fails in Rounds 2–3 primes them for theory.  
  - **Debrief Bridges Gaps:** Explicitly links gameplay to CJT’s math and real-world constraints (e.g., "No, democracy isn’t doomed—but CJT shows us where to focus: boosting competence/independence").  
  - **Low Tech, High Engagement:** Physical tokens and public tallying create tension; staking points mirrors real decision stakes.  

  **Final Tip:** Start debrief with, "What surprised you?" Let students articulate CJT’s insights *before* you name the theorem—then reveal Condorcet’s 1785 paper as the "rulebook" they just tested.
