  ### **Decision Tree for Paternalism and Nudging**

  **Root Question:**  
  Do you agree that an intervention can be morally wrong even if it is not coercive (free to choose otherwise), fully disclosed (transparently explained), harms no one's interests, and makes the person's life go better by their own later assessment?  
  - **No** → Go to Welfarist Branch (Q1).  
  - **Yes** → Go to Non-Welfarist Branch (Q1).  

  ---

  #### **Welfarist Branch (Root: No)**  
  Belief: If an intervention is welfare-improving, non-coercive, disclosed, and harmless, it cannot be morally wrong.  

  **Q1 (Welfarist):** In the utility default case (E), where the thermostat schedule primarily serves the grid (third party) but also lowers the household's bill, is the intervention impermissible because the main beneficiary is not the nudged agent?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  **Q2 (Welfarist):** In the hospital committee case (G), where the default to the cheaper supplier benefits the institution but does not harm patients (equally effective), must the intervention primarily intend the agent's (patient's) good to be permissible?  
  - **Yes** → **Leaf: Agent-focused welfarism.**  
    - Central commitment: Nudges are only permissible if primarily intended for the nudged agent's good, even if others benefit incidentally.  
    - Worst-handled case: Hospital committee (G) — benefits the institution, not primarily the agent; must deny that institutional benefit justifies the nudge when agent good is secondary.  
  - **No** → **Leaf: Unnamed position (empty spot).**  
    - (Marked empty: Unattractive, as welfarists who reject agent-focused intent but still object to third-party benefit in Q1 have no coherent basis under welfarism; welfare gains should suffice.)  

  **Q3 (Welfarist):** In the betting app case (F), if the intervention (showing losses) works by exploiting a cognitive bias (e.g., loss aversion) that users would disavow if aware, does this reduce permissibility, even if it improves welfare?  
  - **Yes** → **Leaf: Bias-sensitive welfarism.**  
    - Central commitment: Welfare-improving nudges are less permissible if they exploit biases the agent would reject, as they undermine agential integrity.  
    - Worst-handled case: Car chimes (D) — if the agent disavows being influenced by irritation, but safety improves; must deny that welfare gains override exploitation concerns.  
  - **No** → Go to Q4.  

  **Q4 (Welfarist, Empirical):** Assume the payroll default (A) erodes employees' capacity to actively manage savings over time (e.g., through reduced engagement). If this erosion occurs, does it make the intervention wrong, even if savings increase? (If you doubt erosion occurs, answer as if it does.)  
  - **Yes** → **Leaf: Competence-preserving welfarism.**  
    - Central commitment: Nudges must not degrade decision-making capacity, even if welfare improves, to avoid long-term dependency.  
    - Worst-handled case: Car chimes (D) — if reliance on chimes erodes attentiveness; must deny that safety gains justify eroded competence.  
  - **No** → **Leaf: Pure outcome welfarism.**  
    - Central commitment: Any welfare-improving nudge is permissible if non-coercive, disclosed, and harmless, with no independent weight to autonomy or intent.  
    - Worst-handled case: Clinician (C) — presents treatment as default, potentially overriding autonomy; must deny that autonomy loss matters if outcomes improve.  

  ---

  #### **Non-Welfarist Branch (Root: Yes)**  
  Belief: Interventions can be wrong despite welfare gains, due to non-welfarist factors like autonomy or manipulation.  

  **Q1 (Non-Welfarist):** In the payroll default case (A), is the intervention wrong because the employer implemented it without employee consent?  
  - **Yes** → Go to Q5.  
  - **No** → Go to Q6.  

  **Q5 (Non-Welfarist):** In the organ donor case (B), would the opt-out register be permissible if it were approved by a public referendum (democratic consent), even without individual consent?  
  - **Yes** → **Leaf: Democratic paternalism.**  
    - Central commitment: Nudges are permissible with democratic authorization, prioritizing collective over individual consent.  
    - Worst-handled case: Clinician (C) — clinician imposes default without consent; must deny that individual dissent overrides democratic will if welfare improves.  
  - **No** → **Leaf: Actual consent required.**  
    - Central commitment: Interventions require actual, individual consent to respect the agent's immediate authority.  
    - Worst-handled case: Utility default (E) — implemented without consultation; must deny that third-party or agent benefits justify bypassing consent.  

  **Q6 (Non-Welfarist):** In the car chimes case (D), is the intervention wrong because it works by exploiting a cognitive bias (e.g., annoyance) that the driver would disavow?  
  - **Yes** → **Leaf: Anti-exploitation.**  
    - Central commitment: Nudges that exploit disavowed biases are impermissible, as they manipulate rather than respect the agent.  
    - Worst-handled case: Betting app (F) — displays losses to exploit loss aversion; must deny that welfare gains excuse manipulation.  
  - **No** → Go to Q7.  

  **Q7 (Non-Welfarist, Empirical):** Assume the payroll default (A) erodes employees' savings-management competence over time. If this occurs, does it make the intervention wrong, even with welfare gains? (If you doubt erosion, answer as if it does.)  
  - **Yes** → **Leaf: Competence degradation objection.**  
    - Central commitment: Nudges that degrade decision-making capacity are impermissible, treating competence as improvable and requiring scaffolding.  
    - Worst-handled case: Car chimes (D) — if it reduces self-monitoring; must deny that safety gains compensate for eroded capacity.  
  - **No** → Go to Q8.  

  **Q8 (Non-Welfarist):** In the clinician case (C), is the intervention wrong because it overrides the patient's authority to choose, even if the outcome is better?  
  - **Yes** → **Leaf: Autonomy as inviolable authority (Kantian-compatible).**  
    - Central commitment: Interventions must not override the agent's authority over their life, prioritizing respect over welfare.  
    - Worst-handled case: Payroll default (A) — employer decides without consent; must deny that welfare gains justify usurping authority.  
  - **No** → Go to Q9.  

  **Q9 (Non-Welfarist):** In the organ donor case (B), is the asymmetry between easy opt-in and hard opt-out (paper form) what makes the intervention wrong, as it manipulates through choice architecture?  
  - **Yes** → **Leaf: Manipulation-based objection.**  
    - Central commitment: Nudges that manipulate via choice architecture (e.g., asymmetric options) are impermissible, regardless of welfare.  
    - Worst-handled case: Utility default (E) — framed as comfort optimization but serves grid; must deny that disclosure neutralizes manipulation.  
  - **No** → **Leaf: Unnamed position (empty spot).**  
