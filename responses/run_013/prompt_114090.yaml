prompt: |-
  I'm a science journalist — mostly neuroscience and philosophy of mind, with occasional forays into whatever's trendy — and I've spent the last few months sitting in on a grad seminar on imagination and modality for a long feature I'm writing, and it has ruined a certain move for me. The move is the one where someone says "I can imagine a world in which such-and-such," and treats that as showing that such a world is possible. I'm not asking you to relitigate that whole thing; I know roughly where the fault lines run and I know the zombies are somewhere in there. What I want to know about is a narrower thing I keep catching people doing, and I genuinely cant tell whether it's a real distinction or whether I'm just irritated by sloppy speakers.

  Here's the shape of it. When I ask someone to actually walk me through the world they say they're imagining, it collapses in a very particular way. They have a scene — a lab, a person in a chair, a sentence being spoken, a needle on a dial — and the scene is genuinely imaginable, vivid, they can add detail all day. But the thing they claimed to be imagining turns out not to be in the scene at all; it's a label stuck onto part of the picture. "And inside, there's the experience." Push on that part and there's nothing behind it, no matter how hard you push. What gets me is that this seems to run the wrong way round: the less they fill in, the more possible the thing sounds, and every concrete detail I add makes the claim shakier, so the arguement is strongest exactly when it's doing the least work. Same thing happens to me with the physics case — I say I can imagine a world where gravity falls off differently, but what I've actually got in my head is a world where somebody has written a different equation on a blackboard, which is a fact about notation and not about what the universe could have been like. Or the water case: I can do it, but what I'm actually holding is a world where some clear wet stuff is called water and turns out not to be H2O, which is a different claim entirely and might even be true of this world.

  So: is there a name for this? Not for the general question of whether imagining tells you anything about what's possible — I know that's a whole industry — but for this specific failure, where the imagining is real and the imagined content was never actually specified, so that what looked like conceiving of a possibility was really just a sentence plus a picture. If the nearest thing is one of those distinctions I half-remember about stronger and weaker grades of this — something about what you can merely fail to rule out versus what you can positively picture — then tell me which grade is which, where the line actually falls, and why that line is the one that matters. And if nothing fits, coin something, but tell me what it excludes: I need to be able to say what is *not* an instance, otherwise it's just a fancy way of saying I didn't find the argument convincing. Also, please be straight with me about your own confidence — tell me how sure you actually are that this is the concept you think it is, and flag the single part of your answer you're least sure of, because that's the bit I'll end up having to defend to my editor.
reasoning: |-
  Okay, let me try to unpack what this science journalist is really asking. They've been sitting in on a grad seminar about imagination and modality, and now they're frustrated with a specific pattern they keep noticing. The core issue is that people claim to imagine a possible world but when pressed, their "imagining" turns out to be just slapping a label on a vague scene without actually conceiving the thing itself. 

  The journalist gives three concrete examples: the "experience" label in philosophy of mind, the gravity equation example from physics, and the H2O/water case. Each time, the imagined content collapses upon scrutiny because what's actually visualized is superficial (a dial, an equation on a board, linguistic labeling) while the intended modal claim remains unsubstantiated. 

  What's interesting is their observation that the argument gets weaker as you add detail - the inverse of how robust reasoning should work. They want terminology for this specific failure mode, not just general epistemology of imagination. Crucially, they need a concept with clear boundaries: what would count as a successful counterexample where the imagining does substantiate the possibility claim?

  Hmm... the "reference failure" diagnosis seems promising. Like when Kripke distinguishes imagining someone else as Nixon versus imagining Nixon doing different things. The journalist's cases all involve what I'd call "label-based placeholder imagination" - using words as stand-ins for actual conception. 

  The gravity example is particularly telling. Imagining a different equation written down isn't imagining different physical laws; it's imagining different human representations of laws. That's a category error in modal imagination. Similarly with "water" that isn't H2O - if they're only imagining different naming practices, that doesn't touch metaphysical possibility.

  For counterexamples, I should consider robust imaginings like Escher's impossible objects. We can visually conceive Penrose triangles while knowing they're geometrically impossible - that's genuine but faulty modal imagination, unlike the journalist's cases which are empty. Or Chalmers' zombies: even if one disagrees, the conceivability argument at least attempts direct phenomenal conception rather than labeling.

  The journalist's least confident point is probably the "density of constraint" metaphor - that adding details creates more failure points. While intuitive, it might conflate epistemic difficulty with metaphysical impossibility. But the core distinction between referential and substantive imagination holds up.
answer: |-
  You've hit on a crucial and under-discussed flaw in modal reasoning—one that deserves a name. What you're describing is **Referential Collapse in Modal Imagination** (RCMI). Below is a breakdown of its anatomy, why it fails, and how to distinguish it from valid modal conceivability.

  ---

  ### **Core Failure: The Label-Picture Gap**
  RCMI occurs when:
  1. **A modal claim is asserted** ("World W where P is true").  
  2. **An imagined scene (S) is presented** as evidence for W.  
  3. **P is not substantively integrated into S**—it's attached as a *descriptive label* (e.g., "this dial shows consciousness," "this fluid is water").  
  4. **Under scrutiny, S collapses:** Adding detail reveals S is compatible with ¬P. The label is decorative, not constitutive.  

  **Why it fails:** The imagination only engages with *contingent features* (equations on blackboards, linguistic practices, dials) while the *modal target* (consciousness, gravity’s structure, water’s essence) remains unimagined. The scene is a **referential shell**—a placeholder for P, not an instantiation of it.

  ---

  ### **Distinguishing Grades of Conceivability**
  RCMI exploits the gap between two types of conceivability:  
  1. **Weak Conceivability ("Negative"):**  
     - *Definition:* Inability to rule out P via logical contradiction *given current knowledge*.  
     - *Example:* "I can’t prove gravity *must* obey 1/r²; maybe it could be 1/r³."  
     - *Vulnerability:* Prone to RCMI. Labels suffice ("imagine a textbook saying F=Gm₁m₂/r³").  

  2. **Strong Conceivability ("Positive"):**  
     - *Definition:* Constructing a detailed, coherent model where P is *intrinsic* to the scenario.  
     - *Example:* Imagining gravitational lensing warping differently, orbital trajectories changing predictably, or matter behaving distinctly in a 1/r³ world—*without* invoking human notation.  
     - *Immunity to RCMI:* P must be "baked in" to the physics, not just labeled.  

  **The line that matters:** Strong conceivability requires **modal constraints to bind P to S**. If adding detail *threatens* P (e.g., tweaking gravity breaks causality), S wasn’t strongly conceivable. RCMI thrives where constraints are absent.

  ---

  ### **Counterexamples: What RCMI Excludes**
  RCMI *does not apply* when imagination **satisfies modal constraints**. For instance:  
  - **Water ≠ H₂O (successful):**  
    Imagine a twin Earth where clear, drinkable liquid *behaves* like water (boils at 100°C, dissolves salts, forms hydrogen bonds) but has molecular structure XYZ. Here, "wateriness" is *enacted*, not labeled.  
    *Why it works:* The physical properties are integral—not just a name.  

  - **Zombies (debatable but RCMI-resistant):**  
    Chalmers-style zombies require imagining a being with *identical physical processes* but no subjective experience. If you can detail neural firings *without* attaching "consciousness" as a label—and the absence of qualia doesn’t collapse the scenario—it avoids RCMI (though other issues remain).  

  **Crucially:** RCMI isn’t just "I’m unconvinced." It’s a structural flaw where the *mechanism of imagination* fails to engage with the target property. If the scene can’t "hold" P under magnification, it was never imagined.

  ---

  ### **Confidence & Caveats**
  - **High confidence (90%)** on RCMI as a distinct failure mode. It maps to Kripke’s "epistemic vs. metaphysical" gap and Chalmers’ "prima facie vs. ideal" conceivability, but zeroes in on *referential detachment*.  
  - **Moderate confidence (70%)** on the strong/weak conceivability framing. The literature is messy (Yablo, Stoljar, Van Inwagen all differ), but the "constraint density" criterion is defensible.  
  - **Least confident part (flagging for editors):**  
    > **The claim that "adding detail *always* weakens RCMI arguments."**  
    *Why tentative?* In principle, one could add details that *reinforce* P (e.g., imagining neural correlates of consciousness in a zombie). But empirically, RCMI collapses under pressure because the label was doing all the work—it’s rare for detail to rescue it. This needs case-by-case scrutiny.

  ---

  ### **Why This Matters**
  RCMI exposes modal arguments that are **rhetorically vivid but modally empty**. It’s not that imagination is useless for modality—it’s that **labels aren’t imagination**. When someone says "I can imagine P," ask:  
  1. Is P *operationalized* in the scene, or just named?  
  2. Does the scene *constrain* P, or could P be swapped out (e.g., "consciousness" → "soul" → "nanobots")?  
  3. Does adding detail *enrich* P or *detach* it?  

  If the answer leans toward the latter, you’ve caught RCMI in the wild—a sleight of mind that mistakes a sticky note for a foundation.
