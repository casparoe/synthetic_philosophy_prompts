  ### Normative Enforcement Sorting Instrument  
  *Instructions: Begin at Question 1. Answer based on concrete cases, not labels. Follow arrows to next question or final position. Positions marked "unnamed" lack coherent defenders; "cannot separate" means distinct theories share this leaf.*  

  ---

  **1. A city considers enforcing a civility code requiring tidy lawns and neighborly greetings. Should it?**  
  - **Yes, because shared aesthetic/relational order is inherently valuable** → Q2  
  - **Yes, because untidiness/aloofness might trigger neighborhood decay** → Q3  
  - **No, unless it prevents direct harm (e.g., health hazards)** → Q4  
  - **Only if residents locally vote for it, even if city-wide rules differ** → Q7  

  **2. A small religious community enforces strict norms (e.g., dress codes) within a looser society. Is this acceptable?**  
  - **Yes: preserving a shared form of life is intrinsically good** → *Position: Intrinsic Strictness*  
    *Awkward commitment: Must defend enforcing arbitrary norms (e.g., beard length) as inherently valuable.*  
  - **Only if members can exit without severe costs (e.g., losing family/community)** → *Position: Exit-Dependent Strictness*  
    *Awkward commitment: Permits internal oppression if exit is feasible, even if unrealistic.*  
  - **No: subgroup norms must align with society’s baseline** → *Position: Unnamed*  
    *Awkward commitment: Demands cultural homogeneity; cannot accommodate enclaves like the Amish.*  

  **3. Littering is loosely enforced, letting free-riders impose cleanup costs on all. Tighten rules?**  
  - **Yes: diffuse costs multiply and undermine public goods** → *Position: Instrumental Strictness*  
    *Awkward commitment: Demands strictness even for low-stakes norms (e.g., recycling) to prevent slippery slopes.*  
  - **No: diffuse costs aren’t direct harm; tolerate free-riders** → Q6  
  - **Only if the affected neighborhood agrees** → Q7  

  **4. Should society enforce driving-side conventions (e.g., drive left vs. right)?**  
  - **Yes: prevents accidents** → *Position: Harm Principle*  
    *Awkward commitment: Cannot explain why *arbitrary* coordination norms (like driving side) are enforceable.*  
  - **Yes: solves pure coordination problems needing uniformity** → *Position: Coordination Equilibrium View*  
    *Awkward commitment: Treats moral norms (e.g., against lying) and arbitrary conventions (e.g., greetings) as equally enforceable.*  
  - **No: individuals can coordinate ad hoc** → *Position: Unnamed*  
    *Awkward commitment: Allows chaotic/unsafe coordination (e.g., unpredictable driving).*  

  **5. In a pandemic, a permissive society mandates masks and lockdowns. Legitimate?**  
  - **Yes: emergencies override normal permissiveness** → *Position: Instrumental Strictness*  
    *[Cannot separate from Q3 "Yes" – tree conflates permanent and temporary instrumental strictness]*  
  - **No: strictness beyond direct harm is always illegitimate** → *Position: Harm Principle*  
    *[Cannot separate from Q4 "Yes: prevents accidents" – tree conflates harm-based enforcement for conventions vs. emergencies]*  

  **6. Contrast lying (moral norm) with driving-side conventions (coordination norm). Enforce equally?**  
  - **Yes: both sustain social order** → *Position: Instrumental Strictness*  
  - **No: lying is inherently wrong; driving side is arbitrary** → *Position: Coordination Equilibrium View*  
  - **Neither should be enforced beyond direct harm** → *Position: Harm Principle*  

  **7. May subgroups (e.g., workplaces) enforce stricter norms than society?**  
  - **Yes: spheres of life (economic, religious) need different strictness** → *Position: Domain-Relative View*  
    *Awkward commitment: Permits strict workplace surveillance if "economic sphere" justifies it.*  
  - **Only with opt-outs/exit rights** → *Position: Exit-Dependent Strictness*  
  - **No: subgroups mirror society’s strictness** → *Position: Unnamed*  
    *Awkward commitment: Forces all domains (e.g., sports, religion) into uniform rigidity/looseness.*  

  ---

  ### Final Positions  
  - **Intrinsic Strictness** (From Q2): Enforces demanding shared practices as inherently good.  
  - **Exit-Dependent Strictness** (From Q2, Q7): Legitimacy hinges on credible exit options.  
  - **Instrumental Strictness** (From Q3, Q5, Q6): Strictness is a tool for order/coordination.  
  - **Harm Principle** (From Q4, Q5, Q6): Only enforces norms preventing direct harm.  
  - **Coordination Equilibrium View** (From Q4, Q6): Enforces coordination norms but not moral ones (or vice versa).  
  - **Domain-Relative View** (From Q7): Adjusts strictness by life domain (e.g., strict in law, loose in art).  
  - **Unnamed** (From Q2, Q3, Q4, Q7): Various incoherencies (e.g., rejects exit rights but allows enclaves).  

  *Empty Cells*:  
  - Q5 “No” → Q6 “Neither”: *Unattractive* (rejects even harm-based rules during crises).  
  - Q1 “No” → Q4 “No”: *Unattractive* (rejects all enforcement, including harm prevention).  

  ---

  ### Instructor’s Note: Diagnostic Power and Redundancy  
  **Key Diagnostics**:  
  - **Q1 (civility code)**: Splits intrinsic/instrumental vs. harm-based vs. localist views. 95% of positions diverge here.  
  - **Q2 (religious community)**: Isolates intrinsic value and exit-dependence. Critical for subgroup legitimacy debates.  
  - **Q4 (driving side)**: Exposes coordination/harm distinction; separates Harm Principle from Coordination View.  
  - **Q7 (subgroups)**: Vital for domain-relativity and exit theories.  

  **Redundant/Weak Questions (Trim for 50-min class)**:  
  - **Q3 (free-riders)**: Correlates strongly with Q1 answers; merge into Q1’s "Yes, because decay" path.  
  - **Q5 (emergency)**: Folds into Instrumental Strictness; use as example discussion instead.  
  - **Q6 (lying vs. driving)**: Keep only if students conflate moral/conventional norms; else omit.  

  **Recommended Trimming**: Omit Q3, Q5, Q6. Use Q1 → Q2 → Q4 → Q7 (4 nodes, 7 positions). Focuses on core disagreements while retaining all required positions except the Coordination View (add it verbally via the lying/driving contrast).
