prompt: |-
  I teach a graduate seminar on ethics and international development and I'm designing a single 90-minute session for about eighteen students, a mix of philosophers, public-policy students, and people who have actually worked for NGOs or donor agencies. What I want them to feel rather than be told is that corruption is not a concept they can apply case by case with a clean definition already in hand: that the formula one always sees on the first slide, about the misuse of entrusted power for private gain, is not a neutral test but smuggles in a substantive theory of what an office is for and who entrusted it to whom; that their judgments will in fact quietly track the size of the sum, the intimacy of the relationship, whether the transaction can be re-described in the idiom of the market, and whether the parties are rich or poor; and that the two easy escape routes, there is one universal standard, and it is all just local custom, both come apart once the cases get hard. I also want them to run into the more uncomfortable fact that corruption talk is itself a move in a political game, since naming a rival's patronage corrupt while one's own is called networking is one of the oldest tricks there is. The activity should put them on the hook for a decision before any of this is named to them.

  Here is what I have in mind, and I'd like you to make it runnable. The centrepiece is a standards committee that has to write a code. Each participant gets a slip of paper with a verdict scale, unproblematic, questionable but permissible, or corrupt, and must fill one in for each of eight cases, together with a mandatory one-sentence answer to the question in virtue of what, and a separate field asking who, if anyone, is wronged. The cases I want seeded, though you should feel free to sharpen them: a procurement officer who receives a cash envelope at his wedding from a supplier, in a setting where wedding guests give cash and the amount equals a month's salary; a civil servant who hires her qualified niece into a post that was never advertised; a firm that pays a few hundred dollars to a customs officer to clear perishable goods before they spoil, where the alternative is a three-week delay and the loss of a season's income for a cooperative; a minister's brother-in-law appointed to a regulatory board who then recuses himself from the relevant votes; an NGO country director whose spouse's translation firm gets the contract at market rate without a tender; a legislator who votes for a subsidy that benefits both his constituents and, incidentally, his cousin; a public hospital doctor who accepts a customary thank-you gift after an operation; and a donor agency that makes its grantees sign a zero-tolerance declaration while its own staff routinely accept flights, hotels, and dinners from implementing partners. After the individual verdicts, the committee has twenty minutes to produce a written code of no more than five rules that classifies all eight cases without exception, and any rule that names a specific case is void, which will force them either into vacuity or into a substantive account of what offices are for. Then a mirror round: hand them four cases drawn from institutions like their own, a cash retainer to a local fixer, an unposted hire of a friend, an all-expenses trip from a vendor, a professor assigning their own royalty-earning textbook, and have the funder's compliance officer apply the code they just wrote. Throughout, each participant holds a hidden stake card, a cousin's firm, a spotless compliance record, a job that depends on the payments continuing, which they reveal only at the end; the point is to let the weaponisation dynamic arise on its own rather than in a lecture. You should give me roles (including a rotating local officer whose job is at stake and an external funder's compliance officer, with everyone playing at least one of them), a materials list, a minute-by-minute timeline, and instructions for the two or three distinctions I want them to have in hand but not necessarily to apply consciously, since part of the lesson is discovering which ones their verdicts actually tracked: the difference between a gift that is inalienable, carrying the giver and creating an obligation no cash can discharge, and a bribe that is a disguised price; the difference between what is wrong, what is legally proscribed, and what is actually enforced; the difference between corruption in the grand sense and petty speed money, including the argument that the latter can be efficient and the counter that it corrodes the very idea of an office; and the thought that the concept may be parasitic on a theory of the state, so that calling a payment corrupt is already to have taken a stand on what the institution is for.

  Finally, give me a debrief that maps specific moments in the session onto these ideas, asks the group which features their verdicts actually tracked versus which they believed they were tracking, and makes them test their own five rules against their own institution. I need a candid account of what will predictably go wrong the first time I run it and how to handle each failure: the group converging quickly on the easy cases and then treating everything else as merely grey and stopping there, participants performing the cultural relativist and the anti-relativist as caricatures, the hidden stake cards being read as a gotcha and producing defensiveness rather than insight, someone wanting to litigate real named politicians, and the code-writing round producing five variations on act with integrity. And be honest about what the activity cannot reproduce, so that I know what I have to supply myself: the coercion and kin obligation that make refusal costly in the cases as they occur in life, the insider's tacit sense of when a gift is a gift, and the fact that the local standard is never a monolith, since the culture defence is typically voiced loudest by those who benefit from it.
reasoning: |-
  We are designing a 90-minute session for a graduate seminar on ethics and international development. The goal is to have students experience the complexity of corruption judgments rather than being told about it. The activity centers on a standards committee that must create a code of conduct after individually judging eight cases. Then, they apply their code to four cases from their own institutions, and finally, reveal hidden stake cards to expose how interests influence judgments.

  Key elements:
  - Individual verdicts on eight cases (using a scale: unproblematic, questionable but permissible, corrupt).
  - Mandatory one-sentence justification and identification of the wronged party for each case.
  - Committee work (20 min) to create a code of 5 rules that classifies all cases without naming specifics.
  - Mirror round: Apply the code to four new cases drawn from their own world (e.g., academia, NGOs).
  - Hidden stake cards (each participant has one, revealed at the end) to show how personal stakes might influence.

  Distinctions to emerge (without explicit instruction):
  1. Gift vs. bribe: Inalienable gift creating obligation vs. disguised price.
  2. Wrong vs. illegal vs. enforced: The gap between moral judgment, legal prohibition, and what is actually punished.
  3. Grand vs. petty corruption: Efficiency arguments for petty corruption vs. the corrosion of institutional integrity.
  4. Corruption as parasitic on a theory of the state: What an institution is for.

  Debrief: Map session moments to the ideas, ask which features verdicts actually tracked, test their rules against their own institution.

  Predictable problems and solutions:
  1. Group converges on easy cases and stops at "grey": Force them to classify all cases without exception in the code. Rules must cover every case.
  2. Caricatures of relativist/anti-relativist: In debrief, highlight how both positions fail in hard cases. Use the code-writing to expose this.
  3. Stake cards seen as gotcha: Frame as "interests we all have" and reveal at end for reflection, not confrontation.
  4. Litigating real politicians: Redirect to the cases provided. Have a rule: no real names.
  5. Code produces vacuous rules: Rule against naming specific cases. Push for substantive distinctions.

  What the activity cannot reproduce:
  - Real coercion and kin obligations.
  - Insider's tacit sense of gift-giving.
  - The fact that local standards are contested (not monolithic).

  Now, let's structure the session:

  Total: 90 minutes

  Roles (assign to 18 participants):
  - Rotating local officer (job at stake): 1 person (this role will be rotated in the mirror round)
  - External funder's compliance officer: 1 person (fixed for the entire activity)
  - The rest (16) will be committee members, but each has a hidden stake (see below). In the mirror round, the compliance officer will apply the code, and the committee becomes the grantee institution.

  Hidden stake cards (each participant gets one, to be revealed at the end):
  - Your cousin's firm stands to benefit from a contract.
  - Your job depends on maintaining a spotless compliance record.
  - Your NGO's funding relies on the continuation of these payments.
  - You are from the local community and know that refusing gifts is an insult.
  - You are an external auditor with zero tolerance for any deviation.
  - (Create 18 distinct but overlapping stakes. Some examples: family obligation, career advancement, fear of scandal, desire for efficiency, commitment to local norms, etc.)

  Materials:
  - Individual case response sheets (with 8 cases, verdict scale, and fields for justification and wronged party).
  - Eight case cards (for reference, but responses on sheet).
  - Four mirror case cards (for the mirror round).
  - Code-writing template (large paper or digital) for the committee.
  - Timer.
  - Stake cards (one per participant, hidden until end).
  - Name tags with roles (for the compliance officer and local officer, others just as committee members).

  Timeline:

  0-5 min (5 min): Introduction
  - Explain the scenario: "You are the ethics committee of an international development organization, tasked with writing a code of conduct on corruption. First, each of you will individually judge eight cases. Then, as a committee, you will write a code of 5 rules that must classify each of these cases without exception. Rules cannot name specific cases. Later, we will test your code on new cases."
  - Distribute individual response sheets and case list. Ensure everyone understands the verdict scale and the requirement for a one-sentence justification and identification of the wronged party.

  5-20 min (15 min): Individual Judgments
  - Participants work alone to judge the eight cases. Walk around to answer questions but avoid guiding.

  20-25 min (5 min): Form Committee and Assign Roles
  - Divide into one committee of 18? Actually, 18 is large for one committee. We might need to split into two committees of 9. But then the mirror round and debrief become complex. Alternatively, the whole group can work as one committee with a structured process (e.g., small groups first then plenary). Given time, let's split into two committees of 9. Each committee has:
    - 1 external funder's compliance officer (fixed, but in the mirror round this person will apply the code to the new cases)
    - 1 rotating local officer (in the mirror round, this role will be played by a different person, and their job is at stake for the mirror cases)
    - 7 committee members (each with a hidden stake)
  - Assign the compliance officer and local officer for each committee. The local officer role is only for the mirror round, so in the first part, they are regular committee members.

  Actually, let's clarify role usage:
  - In the first part (individual and committee code-writing): everyone is a committee member except the compliance officer (who is also a committee member but with a special role in the mirror round). The local officer role is not active until the mirror round.
  - So for the committee phase (20 min), both committees (of 9 each) work to write their code.

  25-45 min (20 min): Committee Code-Writing
  - Each committee must produce a written code of no more than 5 rules that classifies all eight cases without exception. Any rule that names a specific case is void. They must agree on the classification for each case under their code.
  - Provide flip charts or shared document for writing the code and the classification of each case (e.g., Case 1: unproblematic, Case 2: corrupt, etc.) based on the rules.

  45-55 min (10 min): Mirror Round Preparation
  - Introduce the mirror round: "Now, imagine you are a grantee institution (e.g., a university, an NGO) and the compliance officer from the funder will apply your code to four cases from your own world."
  - Hand out the four mirror cases (each committee gets the same four cases). The compliance officer in each committee will now play the role of the funder's compliance officer and apply the committee's code to these new cases. The rotating local officer (a different person from the committee, assigned now) will have their job at stake for one of the cases (so they can argue for leniency). The rest of the committee can observe and then discuss.

  Mirror Cases (tailored to academia/NGOs):
  1. Cash retainer to a local fixer: An NGO working in a remote area pays a cash retainer to a local fixer who helps navigate bureaucracy and community relations. The fixer is not on the official payroll and there is no contract.
  2. Unposted hire of a friend: A department hires a friend of the director for a part-time research position without advertising the post.
  3. All-expenses trip from a vendor: A university professor accepts an all-expenses-paid trip to a conference from a vendor whose equipment the professor is evaluating for a lab.
  4. Professor assigning their own royalty-earning textbook: A professor requires students to purchase a textbook they wrote, from which they earn royalties.

  For each mirror case, the compliance officer must apply the code and classify it (unproblematic, questionable, corrupt) and justify. The local officer (for case 2, the hire, or case 4, the textbook?) should have their job at stake. Let's assign:
  - For case 2 (unposted hire): The local officer is the director who made the hire. Their job is at stake if this is found corrupt.
  - For case 4 (textbook): The local officer is the professor. Their job is at stake.

  Actually, we can have one local officer per committee, and assign them to one case. But to keep it simple, the local officer can be the person affected in one of the cases. We'll assign the local officer to the case that most directly implicates them.

  55-70 min (15 min): Mirror Round
  - Each committee:
    - Compliance officer reads each mirror case and applies the code, giving a verdict and justification.
    - The local officer (assigned to a specific case) can argue against the verdict if their job is at stake.
    - The committee can discuss and challenge, but the compliance officer has the final say (to simulate funder power).

  70-80 min (10 min): Reveal Stake Cards and Reflection
  - Each participant reveals their hidden stake card. No discussion, just read them out in turn.
  - Ask: "How might your stake have influenced your judgments? Did knowing your stake (even if hidden) affect you during the exercise?"

  80-90 min (10 min): Debrief
  - Map specific moments to the ideas:
    - "In the individual round, how many of you found that the size of the sum or the intimacy of the relationship influenced your verdict? For example, the wedding gift (case 1) vs. the customs payment (case 3)."
    - "In the code-writing, did you end up with a substantive theory of what an office is for? Or did you avoid it? How did you handle the case of the minister's brother-in-law (case 4) who recuses himself?"
    - "In the mirror round, when the compliance officer applied your code to the professor assigning their own textbook, did the rule work? What does this say about the theory of the university?"
    - "Which features did your verdicts actually track? (e.g., the parties being rich or poor, the re-description in market terms) vs. which did you think you were tracking?"
    - "Test your code against your own institution: if this code were applied to your university or NGO, would it catch practices that are common? How would the compliance officer rule on your department's hiring or procurement?"
  - Highlight distinctions that emerged without being named:
    1. Gift vs. bribe: Case 1 (wedding) and case 7 (doctor's gift) vs. case 3 (customs). Did the gift create an obligation? Was the customs payment a price?
    2. Wrong vs. illegal vs. enforced: Case 5 (NGO director's spouse) - was it wrong? Is it illegal? Would it be enforced?
    3. Grand vs. petty: Case 3 (customs) - did you see it as efficient? Or corrosive?
    4. Theory of the state: Case 6 (legislator) - does the subsidy vote become corrupt because of the cousin? What is the legislator's office for?

  Finally, address what the activity couldn't capture (kin obligation, insider sense, contested local norms) and note that these are part of the real-world complexity.

  Now, let's write the cases clearly and the stake cards.

  Cases for individual round (8 cases):

  1. Wedding gift: A procurement officer in a government department receives a cash envelope at his wedding from a supplier. It is customary for wedding guests to give cash, and the amount given by the supplier equals one month's salary for the officer.
  2. Hiring niece: A civil servant hires her niece into a government post. The niece is qualified for the job, but the post was never advertised.
  3. Customs payment: A firm pays a few hundred dollars to a customs officer to clear perishable goods that would otherwise spoil. Without the payment, the goods would be delayed by three weeks, causing a cooperative of small farmers to lose a season's income.
  4. Minister's relative: A minister appoints her brother-in-law to a regulatory board. The brother-in-law then recuses himself from any votes that directly affect the minister's interests.
  5. NGO director's spouse: An NGO country director awards a contract for translation services to her spouse's firm. The firm charges market rates, but there was no competitive tender.
  6. Legislator's vote: A legislator votes for a subsidy that benefits both his constituents and, incidentally, his cousin who owns a business in the district.
  7. Doctor's gift: A public hospital doctor accepts a customary thank-you gift (e.g., a basket of fruit or a small amount of money) from a patient after a successful operation.
  8. Donor agency hypocrisy: A donor agency requires its grantees to sign a zero-tolerance corruption declaration, while its own staff routinely accept flights, hotel stays, and dinners from the implementing partners they oversee.

  Mirror cases (4):

  1. Local fixer: An NGO working in a remote area pays a cash retainer to a local fixer who helps them navigate local bureaucracy and community relations. The fixer is not on the official payroll and there is no written contract.
  2. Unposted hire: A department at a university hires a friend of the department chair for a part-time research position without advertising the post. The friend is qualified.
  3. Vendor trip: A university professor accepts an all-expenses-paid trip to a conference from a vendor. The professor is in the process of evaluating the vendor's equipment for a lab purchase.
  4. Textbook: A professor requires students to purchase a textbook they have written, from which they earn royalties. The textbook is the standard in the field.

  Stake cards (18, one per participant):

  1. Your cousin runs a small business that often bids for contracts with your organization.
  2. Your job performance evaluation includes maintaining a spotless compliance record.
  3. Your NGO's funding relies on not having any corruption scandals.
  4. You are from a culture where refusing a gift is seen as a grave insult and can break relationships.
  5. You are an external auditor with a mandate to enforce zero tolerance.
  6. You have seen firsthand how petty corruption can make systems work for the poor.
  7. Your brother-in-law works for a supplier that does business with your organization.
  8. You believe that strict rules without flexibility hurt development work.
  9. You are up for a promotion and any association with corruption would ruin your chances.
  10. You have personally benefited from networking that others might call corrupt.
  11. You are a whistleblower who was punished in a previous job for reporting corruption.
  12. You have family members who depend on your job, and you cannot afford to lose it.
  13. You are a strong believer in meritocracy and equal opportunity.
  14. You are a local employee and know that without greasing palms, nothing gets done.
  15. You have been instructed by your boss to avoid any hint of impropriety.
  16. You have seen corruption destroy a project you cared about.
  17. You are a temporary staff member and need to extend your contract.
  18. You are a board member concerned about the organization's reputation.

  Materials list:
  - Individual response sheets (for 8 cases) x 18
  - Eight case cards (for reference, can be one per table or projected) - but since they are on the response sheet, maybe not needed.
  - Mirror case cards (for the two committees) - two sets of four cases each.
  - Flip chart paper and markers for each committee (for writing the code).
  - Timer.
  - Stake cards (18, one for each participant).
  - Name tags for: Compliance Officer (2, one per committee) and Local Officer (2, one per committee, for the mirror round).

  Minute-by-minute:

  0-5: Intro
  5-20: Individual work (15 min)
  20-25: Split into two committees (if not already) and assign roles: each committee has one Compliance Officer (fixed) and one Local Officer (for mirror round, assign now but they are regular members until then). The Local Officer role is for the mirror round only. So at 20 min, assign: 
    - Committee A: 9 people, including Compliance Officer A and Local Officer A.
    - Committee B: same.
  25-45: Committee work (20 min) - write a 5-rule code and classify all 8 cases using it.
  45-55: Mirror round setup: Hand out the 4 mirror cases to each committee. Remind the Compliance Officer they will apply the code, and the Local Officer will have their job at stake for one case (assign the case: e.g., for Committee A, the Local Officer is the professor in case 4, for Committee B, the Local Officer is the department chair in case 2). The rest of the committee are members of the grantee institution and can support or challenge.
  55-70: Mirror round (15 min) - Each committee does:
    - Compliance Officer reads and rules on each case one by one.
    - For the case where the Local Officer is implicated, they can argue.
    - Committee members can comment. (Keep to 3-4 min per case.)
  70-80: Reveal stakes: All participants (in their committees) reveal their stake card and briefly reflect on how it might have influenced them.
  80-90: Debrief as a whole group (10 min) - the instructor leads the discussion using the questions above.

  Note: The two committees will have different codes and outcomes. In debrief, compare and contrast.

  This is very tight, especially the mirror round. If running over, cut the mirror round to 10 min (2.5 min per case) or have the compliance officer rule on one or two cases only. Alternatively, assign one mirror case per committee and have them do it in plenary? But that loses the point.

  Alternatively, have the mirror round in plenary with one committee's code applied by their compliance officer to one case, and then the other committee's code to another. But time is short.

  Stick to the plan and be strict with time.

  Debrief questions (whole group):

  1. "Look back at the eight cases. Which ones were hardest? Why?"
  2. "In the code-writing, what distinctions did you have to make? Did you end up with a theory of what an office is for? (e.g., public vs. private, impartiality vs. efficiency)"
  3. "When your code was applied in the mirror round, did it feel fair? How did the compliance officer's power play out? Was the local officer's job at stake considered?"
  4. "Revealing stakes: how many of you found that your verdicts might have been influenced by your stake? Without naming names, what kinds of stakes were there? How do real-world interests shape corruption discourse?"
  5. "Which of these distinctions did your judgments actually track? (list: size of sum, intimacy, market idiom, rich/poor) How about the gift/bribe distinction? The grand/petty? The gap between wrong and enforced?"
  6. "What does this say about the first-slide definition of corruption? Is it neutral? What theory of the state does it assume?"

  Finally, note what we couldn't capture: real kin pressure, tacit knowledge, and the contested nature of local norms.

  First-run problems and solutions:

  Problem 1: Group converges on easy cases and stops at grey.
    Solution: Force them to classify every case in the code. The rule "no exceptions" and "no naming cases" pushes them to make distinctions.

  Problem 2: Caricatures of relativist and anti-relativist.
    Solution: In debrief, point out how both positions fail in the hard cases (e.g., the customs payment: is it relativism to allow it? Is anti-relativism inflexible?).

  Problem 3: Stake cards seen as gotcha.
    Solution: Frame the reveal as: "We all have stakes. Let's see the variety of interests we brought to the table." Normalize it.

  Problem 4: Litigating real politicians.
    Solution: At the start, set a rule: "We are using hypothetical cases to focus on principles. Please don't bring in real names."

  Problem 5: Vague rules (e.g., "act with integrity").
    Solution: Rule against naming cases. Ask: "Does this rule classify case 2 as corrupt? How?" Push for operational distinctions.

  What the activity cannot reproduce:
  - The real cost of refusing a gift (social ostracism, loss of trust).
  - The insider's sense (e.g., when a gift is just a gift).
  - The fact that local culture is not monolithic: the defense is often used by the powerful.

  Instructor must supply these in the debrief or in follow-up lectures.

  Now, we have a runnable plan.
answer: |-
  Below is a complete, runnable 90-minute session plan designed to achieve your pedagogical goals. It uses a structured role-play activity to make participants *experience* the ambiguities and political weaponization of corruption, rather than being told about them. The session forces students to confront how their judgments are influenced by contextual factors (sum size, relationships, market framing, power dynamics) and to see how corruption discourse is politicized. The debrief ties these insights to your core distinctions.

  ### **Session Overview**
  - **Goal**: Students confront how corruption judgments are shaped by implicit biases, contextual factors, and personal stakes, and how "neutral" definitions smuggle in political theories of institutions.
  - **Core Insights Embedded**:
    1. Corruption judgments track **sum size**, **relationship intimacy**, **market re-description**, and **rich/poor dynamics**.
    2. The "misuse of entrusted power" definition assumes a contested theory of what an office is for.
    3. Corruption accusations are political weapons ("my networking vs. your patronage").
    4. Gifts (inalienable obligations) vs. bribes (disguised prices), legality vs. enforcement, and grand vs. petty corruption are slippery distinctions.
  - **Structure**: Individual judgments → Committee code-writing → Mirror round → Stake reveal → Debrief.

  ---

  ### **Materials List**
  1. **Case Booklets** (18 copies): 
     - Page 1: Instructions, verdict scale definitions (Unproblematic/Questionable but Permissible/Corrupt), and fields for "In virtue of what?" and "Who is wronged?"
     - Pages 2–3: The 8 cases (detailed below).
  2. **Mirror Case Cards** (4 sets, for small groups):
     - Card 1: Cash retainer to a local fixer for navigating bureaucracy.
     - Card 2: Unposted hire of a friend for a research role.
     - Card 3: All-expenses trip from a vendor bidding for a contract.
     - Card 4: Professor assigning their own royalty-earning textbook.
  3. **Stake Cards** (18 unique cards, e.g., "Your cousin’s firm benefits from contracts," "Your job requires a spotless compliance record").
  4. **Role Badges**: 6 × "Compliance Officer," 6 × "Local Officer," 6 × "Committee Member."
  5. **Code-Writing Templates**: Large posters/markers or digital shared doc for each group.
  6. **Timer** (visible to all).
  7. **Whiteboard** for debrief notes.

  ---

  ### **Roles**
  Assign roles randomly (each student plays one):
  - **Local Officer** (6 students): Their job/status is at stake in the cases. Rotates focus in mirror round.
  - **Compliance Officer** (6 students): Represents external funder; enforces rules rigidly.
  - **Committee Member** (6 students): General participants with stakes.  
  *Why this balance?* Ensures political tension (Local vs. Compliance) while distributing power. In small groups (below), each has 1 Local, 1 Compliance, and 1–2 Members.

  ---

  ### **Timeline (90 Minutes Total)**

  #### **0–10 min: Setup & Individual Judgment (Silent Work)**
  - **Instructor Script**: "You’re on a standards committee drafting a corruption code. *Individually*, judge each case using the scale. For each, write: (1) Your verdict, (2) ‘In virtue of what?’ (one sentence), and (3) Who is wronged? No discussion yet."
  - **Activity**: Students work silently on the 8 cases.  
  - **Cases**:  
    1. **Wedding Gift**: Procurement officer receives cash envelope (one month’s salary) from a supplier at his wedding in a culture where cash gifts are customary.  
    2. **Hiring Niece**: Civil servant hires qualified niece into an unadvertised government post.  
    3. **Customs Payment**: Firm pays $500 to a customs officer to expedite perishable goods; delay would ruin a farmers’ cooperative.  
    4. **Minister’s Relative**: Minister appoints brother-in-law to regulatory board; he recuses himself from relevant votes.  
    5. **NGO Director’s Spouse**: NGO country director awards translation contract to spouse’s firm at market rate, no tender.  
    6. **Legislator’s Vote**: Legislator votes for subsidy helping constituents and his cousin’s business.  
    7. **Doctor’s Gift**: Public hospital doctor accepts customary thank-you gift (e.g., fruit basket) after surgery.  
    8. **Donor Hypocrisy**: Donor agency enforces grantee zero-tolerance policy while staff accept flights/dinners from partners.  
  - **Predictable Problem**: Students rush through easy cases (e.g., #8 as corrupt) and get stuck on "grey" ones (#1, #3, #7).  
    - *Solution*: Push them to complete all fields. Remind: "No ‘it depends’—commit to a verdict."

  #### **10–15 min: Form Small Groups & Assign Roles**
  - Split into 6 groups of 3 (each with 1 Local Officer, 1 Compliance Officer, 1 Committee Member).  
  - Distribute **stake cards** (hidden; e.g., "Your NGO funding relies on these payments continuing").  
  - **Instructor Script**: "Keep stakes secret. In your group, share your verdicts but *not* your justifications yet."

  #### **15–35 min: Committee Code-Writing (20 min)**
  - **Task**: Groups draft a code of ≤5 rules classifying all 8 cases as corrupt/questionable/unproblematic. Rules must be general (no case names).  
  - **Twist**: Rules void if they reference specific cases. Forces groups toward substantive theory (e.g., "Rules against gifts over $100" implies offices are market-free zones).  
  - **Predictable Problems**:  
    - Groups default to vague rules ("Act with integrity").  
      - *Solution*: Intervene: "If I apply ‘integrity’ to Case 4, what’s the verdict? Be specific."  
    - Relativist/absolutist caricatures emerge (e.g., "Everything’s corrupt" vs. "It’s their culture").  
      - *Solution*: Challenge: "How would your rule handle Case 3 if the players were poor vs. rich?"  
  - **Output**: Written code + case classifications (e.g., "Case 1: Unproblematic under Rule 2").

  #### **35–50 min: Mirror Round (15 min)**
  - **Task**: Groups apply their code to 4 mirror cases from their world. Compliance Officer enforces; Local Officer defends if their role is implicated.  
  - **Mirror Cases** (tailored to academia/policy):  
    1. **Fixer Retainer**: NGO pays cash to local fixer (no contract) to expedite permits.  
    2. **Unposted Hire**: Policy school hires director’s friend for unadvertised research role.  
    3. **Vendor Trip**: Professor accepts vendor-funded trip while evaluating their equipment.  
    4. **Royalty Textbook**: Professor requires their own textbook (earns royalties).  
  - **Assign Local Officer Stakes**:  
    - For Case 2, Local Officer is the "director" (job at stake if corrupt).  
    - For Case 4, Local Officer is the "professor" (reputation at stake).  
  - **Predictable Problem**: Compliance Officers rigidly apply code; Local Officers protest ("This isn’t corruption!").  
    - *Solution*: Let conflict unfold. It surfaces weaponization ("My gift vs. your bribe").

  #### **50–60 min: Stake Reveal & Reflection (10 min)**
  - **Task**: Students reveal stake cards. Discuss: "Did your stake influence you? How?"  
  - **Predictable Problem**: Defensiveness ("This is a gotcha!").  
    - *Solution*: Normalize: "We all have stakes. How might they shape real-world judgments?"  
  - **Instructor Script**: "Notice whose stakes aligned with Local vs. Compliance roles. Where did ‘networking’ become ‘corruption’?"

  ---

  ### **Debrief (60–90 min)**
  **Map Activity Moments to Core Insights**:  
  | Insight | Activity Moment | Debrief Question |
  |---------|----------------|------------------|
  | **Judgments track sum/relationships/market/wealth** | Individual verdicts (e.g., Case 1 vs. Case 3: small sum + intimacy vs. market framing) | "Show of hands: Who judged the doctor’s gift (Case 7) unproblematic but the customs payment (Case 3) corrupt? What factors swayed you?" |  
  | **Gift vs. bribe distinction** | Wedding gift (Case 1) vs. customs payment (Case 3) | "Did the wedding gift feel inalienable (obligation)? Was the customs payment a disguised price? Where’s the line?" |  
  | **Legality vs. enforcement** | Donor hypocrisy (Case 8) | "Why did many call Case 8 corrupt? Is it illegal? Would it be enforced?" |  
  | **Petty corruption efficiency** | Customs payment (Case 3) | "Who saw Case 3 as efficient? Does that justify it, or does it corrode institutions?" |  
  | **Theory of the office/state** | Code-writing rules (e.g., rules banning gifts assume offices are impartial) | "What theory of ‘public office’ did your code imply? How did Case 6 (legislator) test this?" |  
  | **Corruption as political weapon** | Mirror round (Local vs. Compliance clash) | "When did ‘networking’ (your hire) become ‘corruption’ (their hire)? Who gets to define it?" |  

  **Guided Discussion**:  
  1. **Self-Test**: "Which factors *actually* guided your verdicts? Write down: Sum size? Relationship? Market logic? Wealth? Now compare: Did you *think* you were tracking something else?"  
  2. **Code Stress-Test**: "Apply your code to your university/NGO: Would the professor’s textbook be corrupt? Is your ‘zero tolerance’ rule hypocritical like Case 8?"  
  3. **Synthesize Distinctions**: "How did the activity expose gaps between wrong/illegal/enforced? Between gift/bribe? Petty/grand corruption?"  
  4. **Political Reality**: "Whose stakes made ‘corruption’ a useful accusation? How does this weaponization play out in development work?"  

  ---

  ### **Predictable Problems & Solutions**
  1. **"Grey Zone" Stagnation**:  
     - *Risk*: Groups treat all hard cases as "questionable" and avoid rules.  
     - *Solution*: Force binary classifications in code-writing ("No exceptions—pick a category"). Ask: "What would your rule cost you if applied to *you*?"  

  2. **Caricatured Relativism/Absolutism**:  
     - *Risk*: Students perform "All cultures are different!" or "Rules are rules!" without nuance.  
     - *Solution*: Use hard cases (e.g., Case 3) to expose both positions’ failures: "Does relativism excuse the powerful? Does absolutism ignore context?"  

  3. **Stake Cards as "Gotcha"**:  
     - *Risk*: Defensiveness ("I wasn’t biased!").  
     - *Solution*: Frame stakes as universal: "We all have interests. How do they shape *collective* judgments?" Reveal cards early in debrief, not during conflict.  

  4. **Litigating Real Cases**:  
     - *Risk*: Students derail into discussing politicians/NGO scandals.  
     - *Solution*: Set ground rules: "Use hypotheticals to focus on principles. Real cases can be discussed after." Redirect: "How would your code handle a *similar* real case?"  

  5. **Vague Rules**:  
     - *Risk*: Codes default to "integrity" or "transparency."  
     - *Solution*: Void rules naming cases. Challenge: "Would this rule condemn *your* networking?"  

  ---

  ### **What the Activity Cannot Reproduce (Requires Instructor Supplementation)**
  1. **Coercion & Kin Obligation**:  
     - The activity can’t simulate the social/familial costs of refusing gifts (e.g., Case 1).  
     - *Supply This*: In debrief, share fieldwork examples (e.g., "Refusing a gift in Context X risks ostracism").  

  2. **Insider’s Tacit Knowledge**:  
     - Students won’t feel when a gift "is just a gift" (Case 7) vs. a bribe.  
     - *Supply This*: Use anecdotes (e.g., "In Hospital Y, gifts are expected—but only *after* treatment").  

  3. **Local Standards as Contested**:  
     - The "cultural defense" is portrayed as monolithic; activity misses how elites weaponize it.  
     - *Supply This*: Cite examples (e.g., "In Country Z, ‘custom’ excuses elites but punishes the poor").  

  4. **Structural Power Imbalances**:  
     - Activity simplifies how wealth/power asymmetry (e.g., rich firm vs. poor officer) shapes corruption.  
     - *Supply This*: Add data (e.g., "Studies show petty corruption disproportionately burdens the poor").  

  **Closing Thought**: This session creates dissonance by making judgments personal ("your code," "your stake"). Use the debrief to connect to broader themes: Corruption isn’t a predefined box—it’s a lens reflecting our theories of institutions, power, and morality. Assign follow-up reading (e.g., Gupta on corruption as discourse) to deepen analysis.
