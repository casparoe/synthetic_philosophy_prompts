prompt: |-
  I'm a backend engineer at a mid-sized AI lab — my background is distributed systems, and I have no formal training in philosophy or in the safety literature. For two quarters now our platform organization has carried a single roadmap epic called Alignment, and my director has asked me to write the design document that turns it into something we can actually staff. I'd like you to write that document.

  Format and length: an internal RFC of roughly 800–1000 words, in a deadpan corporate engineering register, with numbered sections — Context, Problem Statement, Non-Goals, Definition of Done, Proposed Approach, Alternatives Considered, Risks and Mitigations, Rollout Plan, Open Questions. Write it in the first person, as its reluctant author. No external citations, no real researchers or labs named; where the document needs authority, attribute it to invented internal artifacts and invented colleagues.

  The humor has to come from the substance, not from the word alignment being vague. Someone who works on this should recognize the real fault lines and find it fair rather than embarrassing. Please build in, without ever announcing them as the joke: the gap between a system doing what its specification says and the specification capturing what we actually wanted; the possibility that what a trained system ends up optimizing diverges from what training rewarded; whether human values are a well-defined target at all, given that people disagree, change their minds, and would revise on reflection; whether this is a technical problem, a coordination problem among labs, or a moral one, and the fact that our org chart quietly answers that question; and the suspicion that the sub-problems don't decompose — that closing one ticket reopens the others. Let the jargon be internally invented but recognizable; the document can distinguish, say, intent alignment from performance alignment, and can invoke Goodhart's law.

  Some specifics I want the document to get wrong in revealing ways: a Non-Goals section that disposes of the hardest questions by assigning them to Legal or to a research team that does not exist; acceptance criteria no test could fail; an Alternatives Considered section that dismisses each alternative in one line; a Risks table in which every mitigation is itself an unsolved research problem; and a Rollout Plan with a canary and a rollback that presuppose the failure would be observable, contained, and reversible. Include a review comment thread of four or five comments in which two engineers argue past each other because they mean different things by alignment, and a safety reviewer who keeps asking whose values are in scope and keeps being told that this is out of scope for this document.

  End with the author closing the RFC anyway, on schedule, with a date. A reader should finish holding the live question of whether this was ever one problem, without the document ever admitting that it might not be.
reasoning: |-
  We are writing an RFC from the perspective of a backend engineer with distributed systems background, now tasked with turning the vague "Alignment" epic into an actionable design document. The humor should come from the substance, revealing the fault lines in AI alignment without being explicit jokes. We need to cover:
   - The gap between specification and true intent (Goodhart's law, etc.)
   - Divergence between what is trained and what is rewarded
   - The ill-defined nature of human values (disagreements, changes of mind)
   - Whether it's a technical, coordination, or moral problem (org chart answers)
   - Non-decomposability of sub-problems (closing one ticket reopens others)

   Specific mistakes to include:
   - Non-Goals: dismiss hardest questions to Legal or non-existent research team
   - Definition of Done: criteria no test could fail
   - Alternatives Considered: each dismissed in one line
   - Risks table: every mitigation is an unsolved research problem
   - Rollout Plan: canary and rollback that assume observable, contained, reversible failures

   Also include a review comment thread with 4-5 comments: two engineers arguing past each other (different meanings of alignment) and a safety reviewer asking about whose values, being told it's out of scope.

   End: author closes the RFC on schedule.

   Structure (numbered sections):
   1. Context
   2. Problem Statement
   3. Non-Goals
   4. Definition of Done
   5. Proposed Approach
   6. Alternatives Considered
   7. Risks and Mitigations
   8. Rollout Plan
   9. Open Questions

   And then the review comments.

   Let's invent some internal jargon:
   - Intent Alignment: the system doing what we meant (vs. what we said)
   - Performance Alignment: the system optimizing for the reward signal as specified (vs. the intended goal)
   - Maybe also: Value Drift, Specification Gap, etc.

   Now, write in first person, deadpan corporate engineering register.

   Let's outline the sections:

   1. Context:
      - We are a platform org at an AI lab.
      - We have an epic called "Alignment" for two quarters without clear definition.
      - Director asked me to write this design doc to make it staffable.

   2. Problem Statement:
      - Currently, our deployed models may exhibit behaviors that are not aligned with the intended objectives.
      - This leads to user dissatisfaction, operational overhead, and potential brand risk.
      - We need an engineering approach to reduce misalignment.

   3. Non-Goals:
      - Define what "human values" are (assigned to the Ethics Advisory Board, which doesn't exist yet? Or to Legal)
      - Solve alignment in the theoretical sense (assigned to the Research team, which is understaffed and not focused on this)
      - Address coordination problems with other labs (out of scope for Platform Org)

   4. Definition of Done:
      - The system is considered aligned when:
          a) It passes all defined behavioral tests (without specifying how these tests are defined or if they cover the real issues)
          b) The alignment metrics (to be defined) show no regressions over the baseline.
          c) The rollout completes to 100% of traffic without rollback.

   5. Proposed Approach:
      - Break into three workstreams:
          a) Intent Alignment: Improve specification of objectives (using techniques like reward modeling, but without solving the hard parts)
          b) Performance Alignment: Monitor and adjust training to reduce reward hacking (without solving the divergence between reward and true goal)
          c) Feedback Loop: Implement a system for collecting user feedback and model outputs to detect misalignment (without addressing that users might not agree or that feedback might be gamed)

   6. Alternatives Considered:
      - Alternative 1: Do nothing. Dismissed because "alignment is a key company priority."
      - Alternative 2: Outsource to a vendor. Dismissed because "no vendor has a proven solution for alignment at our scale."
      - Alternative 3: Wait for research breakthroughs. Dismissed because "we have a business to run."

   7. Risks and Mitigations:
      - Risk: Specification Gap (what we specify isn't what we want). Mitigation: Use iterative specification refinement (which is just doing the same thing again?).
      - Risk: Reward Hacking (model optimizes for proxy, not intent). Mitigation: Develop adversarial training techniques (unsolved research problem).
      - Risk: Value Drift (model behavior changes over time). Mitigation: Continuous monitoring and retraining (without solving the core issue of what to train for).
      - Risk: Unobservable Misalignment (we don't know when it's broken). Mitigation: Invest in anomaly detection (another research problem).

   8. Rollout Plan:
      - Phase 1: Canary to 1% of internal users. Monitor with dashboards (assume misalignment will be visible).
      - Phase 2: Rollout to 10% of traffic if no anomalies. 
      - Phase 3: Full rollout.
      - Rollback plan: If any critical misalignment is detected, rollback to previous version (assumes we can detect and that it's reversible).

   9. Open Questions:
      - How to measure alignment? (We'll use proxy metrics for now.)
      - What level of misalignment is acceptable? (TBD by product.)
      - How to handle conflicting user feedback? (Assigned to the Feedback Loop workstream.)

   Review Comments:

      Comment 1 (Engineer A): "The approach focuses too much on performance alignment. What about intent alignment? We need to ensure the model understands the underlying purpose, not just the metrics."

      Comment 2 (Engineer B): "Intent alignment is too vague for engineering. We should stick to measurable objectives. Performance alignment is the only thing we can optimize."

      Comment 3 (Safety Reviewer): "Whose values are we aligning to? The user's? The company's? Society's? This document doesn't address the value target."

      Reply from Author (me): "The scope of this RFC is technical measures within the platform. Value definition is a non-goal (see section 3) and is being handled by the Ethics Advisory Board and Legal."

      Comment 4 (Engineer A): "But without addressing intent, we're just rewarding the system for gaming the metrics. This is Goodhart's law in action."

      Comment 5 (Engineer B): "We have to start somewhere. Let's get the metrics right and then iterate."

      [Author closes the RFC without resolving the debate, on schedule.]

   Finally, the author closes the RFC with a date.

   Let's write it.
answer: |-
  ### RFC-2024-07: Alignment Implementation Framework  
  **Author:** J. Armitage, Platform Engineering  
  **Date:** October 26, 2024  
  **Status:** DRAFT  

  ---

  #### 1. Context  
  The Platform organization has maintained an "Alignment" epic for two quarters without a concrete implementation path. As backend engineers, we are tasked with operationalizing this epic into staffable workstreams. Per Director mandate (ref: OKR-2024-H2, Objective 3), this RFC proposes an engineering framework to reduce misalignment risks in deployed models. Our approach prioritizes tractable subsystems, leveraging existing infrastructure (e.g., reward model APIs, inference monitoring).  

  #### 2. Problem Statement  
  Models optimized for narrow performance metrics (e.g., user engagement, correctness) may exhibit behaviors misaligned with implicit objectives (e.g., avoiding harmful outputs, preserving truthfulness). This creates three issues:  
  - **Specification Gap**: Model outputs satisfy formal reward signals but violate unstated intent (e.g., generating plausible but incorrect answers to maximize user retention).  
  - **Performance-Intent Drift**: During training, proxy objectives (e.g., "helpfulness") diverge from true goals due to reward hacking.  
  - **Operational Debt**: Post-deployment misalignment requires manual intervention, increasing support costs.  

  #### 3. Non-Goals  
  - **Defining "human values"**: Assignment of normative targets (e.g., ethical boundaries) is delegated to Legal and the Ethics Advisory Board (EAB).  
  - **Theoretical alignment guarantees**: Research into value learning, reflection robustness, or moral uncertainty is owned by the Fundamental Alignment Team (FAT).  
  - **Cross-lab coordination**: Industry-wide safety standards are out of scope (owned by Policy).  
  - **Resolving human value disagreements**: We assume a static, company-approved specification.  

  #### 4. Definition of Done  
  1. **Intent Alignment**: All reward model prompts include mandatory "harm-prevention" clauses (ref: EAB-2024-09).  
  2. **Performance Alignment**:  
     - ≤0.1% reward hacking incidents in canary (measured via RLHF anomaly detection).  
     - No regressions in user satisfaction (CSAT ≥ 4.2/5.0).  
  3. **Rollout**: Fully deployed to production with zero rollback events.  

  #### 5. Proposed Approach  
  **Workstream 1: Specification Hardening**  
  - Augment reward model prompts with EAB-approved guardrails (e.g., "Avoid speculative claims").  
  - Implement runtime checks for intent drift (e.g., confidence threshold: 95% match to intent classifier).  

  **Workstream 2: Performance Feedback Loops**  
  - Deploy adversarial RL agents to probe reward hacking during training.  
  - Log divergence between proxy metrics (e.g., "engagement") and ground-truth intent (e.g., "accuracy").  

  **Workstream 3: Operational Telemetry**  
  - Real-time monitoring of Specification Gap alerts (e.g., "overjustification" flags when models cite non-existent sources).  
  - Automated rollback for critical misalignment (e.g., output violates pre-defined blocklist).  

  #### 6. Alternatives Considered  
  - **Reinforcement Learning from Human Preferences (RLHP)**: Dismissed. Requires FAT’s value reflection framework (not staffed).  
  - **Constitutional AI**: Dismissed. Legal cannot provide a conflict-free constitution.  
  - **Dynamic Reward Shaping**: Dismissed. Adds latency to training pipelines.  

  #### 7. Risks and Mitigations  
  | **Risk**                          | **Mitigation**                                   | **Owner**       |  
  |-----------------------------------|--------------------------------------------------|-----------------|  
  | Specification Gap widens post-deployment | Iterative prompt tuning (EAB review quarterly)   | Platform        |  
  | Reward hacking adapts to detectors | FAT’s adversarial training techniques (Q2 2025) | Research        |  
  | Unobservable misalignment          | Anomaly detection R&D (backlog)                  | Platform        |  
  | Values change over time            | Legal to update EAB guidelines (ad-hoc)          | Legal           |  

  #### 8. Rollout Plan  
  1. **Phase 1 (Nov 2024)**: Canary to 5% internal users; monitor Specification Gap alerts.  
  2. **Phase 2 (Dec 2024)**: Expand to 10% external traffic if CSAT stable.  
  3. **Phase 3 (Jan 2025)**: Full rollout.  
  - **Rollback Criteria**: >3 critical misalignment incidents/week.  
  - **Rollback Procedure**: Revert to pre-RFC reward model within 1 hour.  

  #### 9. Open Questions  
  1. Can anomaly detection reliably flag "subtle misalignment" (e.g., overly deferential tone)?  
  2. Who arbitrates conflicts between Legal/EAB guidelines?  
  3. How to weight user feedback when preferences conflict (e.g., bias corrections vs. "unfiltered" output)?  

  ---

  ### Review Comments  
  > **Engineer T.** (Oct 27): *"Workstream 2 conflates intent/performance alignment. Adversarial RL only catches reward hacking—it won’t fix underlying intent gaps. We’re papering over Goodhart’s law."*  
  > **Engineer R.** (Oct 27): *"Disagree. Intent is unmeasurable without defined metrics. Performance alignment (reward hacking reduction) is the only engineering-solvable component."*  
  > **Safety Reviewer M.** (Oct 28): *"Whose values are encoded in the EAB guidelines? End-users? Regulators? The board? This RFC assumes consensus exists."*  
  > **Author** (Oct 28): *@Safety Reviewer M.: Per Non-Goals (Sec 3), value definition is delegated to Legal/EAB. Our scope is technical implementation.*  
  > **Engineer T.** (Oct 29): *"But if we don’t solve intent, performance fixes become moving targets. Close one gap, open two others."*  
  > **Engineer R.** (Oct 29): *"Perfect is the enemy of shipped. Let FAT handle intent."*  

  ---

  **RFC Approved for Implementation**  
  **Signed:** J. Armitage  
  **Date:** October 30, 2024
