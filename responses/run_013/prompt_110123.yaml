prompt: |-
  I spent thirty-odd years as a marine biologist and retired a couple years back, and since then I've been sitting in on philosophy seminars, mostly out of a nagging sense that I skipped a chapter somewhere. Here's what's got under my skin. I sit on a small grant-review panel — just three of us, tiny foundation — and our job is to decide whether a proposal gets funded. Somebody wrote our rule down years ago: fund it if the proposed method is sound and the sample size is adequate, otherwise no. So we each vote on the two sub-questions and then apply the rule mechanically. Last cycle we got this: I thought the method was sound but the sample too small; my colleague thought the method shaky but the sample fine; the third thought both were fine. By the sub-questions the panel says the method is sound (2–1) and the sample is adequate (2–1), so the rule says fund — except if you'd just asked each of us straight out "should we fund it?" you'd have gotten two no's. I genuinely can't tell if our procedure is a bug or a feature, and I've stopped wanting the patch and started wanting the general picture.

  So here's the actual ask: give me the desiderata for any method of turning a bunch of individual judgments into one group judgment. Not a defense of one procedure — the requirements list. What I want: the cases any such method has to get right (mine above is one, presumably not the only species), and for each requirement the reason behind it rather than just the label — it ought to return some verdict for whatever combination of opinions it's handed, it shouldn't let a single member dictate, it shouldn't care which member holds which view, it should be responsive to what the members actually think, it shouldn't hand back a group position that contradicts itself, it probably shouldn't let the answer to one question depend on opinions about some unrelated question — and the distinctions it mustn't collapse, like the difference between aggregating final verdicts and aggregating the reasons people gave for them. Then tell me which of these are non-negotiable and which are just house preferences of one camp, which single one is doing the most work in ruling methods out, and — the part I most want — which of them can't all be satisfied at once and why. I have a strong hunch that some of the ones I just rattled off are jointly impossible, and if that's right then the list itself is the result and I'd rather see that than a method that quietly drops one. Briefly at the end: how does plain majority voting on each question fare against your list, and how does a procedure that only ever counts up-and-down votes on the final question fare? Skip any reading list — I'm asking you, not the library.
reasoning: |-
  We are dealing with a problem of judgment aggregation: how to combine individual judgments on multiple interconnected propositions into a group judgment. The specific example given is about a grant-review panel that votes on two sub-questions (method sound and sample size adequate) and then applies a rule (fund if both are true). The problem arises because the majority on each sub-question leads to funding, but a direct vote on funding would have been rejected (2 no's). This is a classic example of the "doctrinal paradox" (also known as the "discursive dilemma").

  The user asks for a list of desiderata (requirements) for any method of aggregating individual judgments into a group judgment. We are to provide:

  1. Cases that any such method must get right (including the one described).
  2. A list of requirements with reasons (not just labels).
  3. Which requirements are non-negotiable and which are optional (house preferences).
  4. Which requirement is the most work in ruling methods out.
  5. Which requirements cannot all be satisfied at once (impossibility theorems) and why.
  6. A brief evaluation of two methods: (a) majority voting on each question, and (b) voting only on the final question.

  Let's break down the requirements (desiderata) for judgment aggregation:

  ### Desiderata for Judgment Aggregation

  1. **Universal Domain (UD)**: The method should be able to handle any possible combination of individual judgments on the propositions. That is, no matter how the individuals vote (as long as each individual has a consistent judgment), the method should produce a group judgment.
     - *Reason*: We cannot restrict the opinions of the members arbitrarily; the procedure must be robust to any configuration of opinions.

  2. **Collective Rationality (CR)**: The group judgment should be logically consistent. That is, if there are logical connections between the propositions, the group's set of judgments should respect these connections.
     - *Reason*: Without consistency, the group might endorse contradictory positions, which is irrational and undermines the decision.

  3. **Anonymity (A)**: The group judgment should depend only on the set of judgments (the votes) and not on who holds which judgment. That is, permuting the judgments among the individuals should not change the group outcome.
     - *Reason*: All members are equal; the procedure should be symmetric in the individuals.

  4. **Neutrality (N)**: The method should treat all propositions equally. That is, the group judgment on a proposition should depend only on the votes for and against that proposition, and not on the content of the proposition.
     - *Reason*: We don't want the aggregation rule to be biased for or against particular propositions.

  5. **Systematicity (S)**: The group judgment on each proposition should be determined solely by the individual judgments on that same proposition, and the same rule should be used for every proposition.
     - *Reason*: This ensures that the rule is applied uniformly and without regard to the content of the propositions. However, note that this is a very strong condition.

  6. **Unanimity (U)**: If all individuals agree on a proposition, then the group judgment should reflect that agreement.
     - *Reason*: It would be perverse to reject a proposition that everyone accepts.

  7. **Independence (I)**: The group judgment on any proposition should depend only on the individual judgments on that proposition and not on judgments on other propositions.
     - *Reason*: This ensures that the aggregation on one issue is not influenced by opinions on other issues. However, this condition is at the heart of the doctrinal paradox.

  8. **Non-dictatorship (ND)**: There should be no individual such that the group judgment always matches that individual's judgment, regardless of the others.
     - *Reason*: We want a collective decision, not the rule of one.

  9. **Majority Preservation (MP)**: If a majority of individuals hold a particular judgment on a proposition, then the group judgment should reflect that majority view. (This is also known as the "majority principle".)
     - *Reason*: It captures the idea of majority rule, which is a fundamental democratic principle.

  10. **Responsiveness (R)**: The group judgment should be sensitive to the individual judgments. In particular, if an individual changes their judgment, it should sometimes be possible for the group judgment to change (i.e., the group judgment is not fixed).
      - *Reason*: The group decision should reflect the opinions of the members.

  ### The Impossibility Theorems

  The most famous impossibility result in judgment aggregation is the **List-Pettit theorem** (or similar impossibility results). It shows that there is no aggregation rule that satisfies all of the following:

  - **Universal Domain**
  - **Collective Rationality**
  - **Independence** (or sometimes **Systematicity**, which implies Independence) 
  - **Unanimity** (and sometimes **Anonymity** or **Non-dictatorship**)

  Specifically, the doctrinal paradox example (like the one in the query) illustrates that when there are logical connections between propositions (in this case, the funding decision is the conjunction of two sub-questions), then:

  - Majority voting on each proposition (which satisfies UD, A, N, I, and U) may lead to an inconsistent group judgment (violating CR). In the example, the group says: method sound (true), sample adequate (true) -> so by the rule, fund (true). But note that the rule is that funding is the conjunction of the two. However, in the example, the group judgment on funding by the rule is true, but if we were to take a direct vote on funding, it would be false (by 2-1). This inconsistency arises because the rule (conjunction) is not respected by independent majority voting on each proposition.

  Alternatively, if we require the group to always be consistent (CR) and we have the rule that funding is the conjunction, then we cannot have both independence and the majority principle.

  ### Which Desiderata are Non-Negotiable?

  This depends on the context. However, typically:

  - **Universal Domain** is non-negotiable if we want the procedure to work for any possible input.
  - **Collective Rationality** is non-negotiable because inconsistent group decisions are irrational and may lead to bad outcomes.
  - **Non-dictatorship** is non-negotiable in a democratic setting.

  But note that the impossibility result tells us that we cannot have UD, CR, I, and ND all at once. Therefore, we have to relax one of them.

  ### Which Desideratum is Doing the Most Work in Ruling Methods Out?

  **Independence** (or the stronger **Systematicity**) is the key culprit. The independence condition requires that the group judgment on each proposition is independent of the judgments on other propositions. This prevents the aggregation rule from taking into account the logical connections between propositions. Therefore, when there are such connections (as in the grant rule: fund = method_ok AND sample_ok), independence forces the aggregation to be done per proposition without regard to the connections, which leads to inconsistency (as in the example).

  ### Evaluation of the Two Methods

  1. **Majority voting on each question (premise-based procedure)**:
     - In the example, it leads to funding because both premises are approved by majority. However, this leads to a group judgment that is inconsistent with the rule (if we consider the direct vote on funding). It satisfies UD, A, N, I, U, and MP (if we consider each proposition independently). But it fails CR because the group judgment on the premises and the conclusion (by the rule) are inconsistent. Specifically, by the rule, funding should be the conjunction, but the group by direct vote on funding would reject it.

  2. **Voting only on the final question (conclusion-based procedure)**:
     - Here, we ignore the premises and just vote on the conclusion (funding). In the example, the vote would be 1 yes and 2 no's -> do not fund. This method satisfies UD, A, N, U, and CR (because we only have one proposition). However, it fails to take into account the reasons for the decision. The group does not take a stand on the premises. This might be problematic because the group might not be consistent in its reasoning. Also, it fails to satisfy **Independence** (because we are only voting on the conclusion and ignoring the premises) and **Responsiveness** to the premises (since the premises are not aggregated).

  ### The Trade-offs

  The impossibility result tells us that we cannot have all the desirable properties at once. Therefore, we have to choose which properties to sacrifice:

  - If we want **Collective Rationality** and **Universal Domain**, then we must relax **Independence**. This means that the aggregation rule may need to look at the pattern of judgments across multiple propositions (like using a distance-based rule, or a sequential priority rule, or even a supermajority requirement). For example, the premise-based procedure (majority on premises) can be used if we are willing to accept the group judgment on the premises and derive the conclusion by the rule, but then we are not taking a direct group vote on the conclusion.

  - Alternatively, if we relax **Collective Rationality**, then we can use majority voting on each proposition independently (but then we might get inconsistent group judgments).

  - Another approach is to relax **Universal Domain** by restricting the set of admissible judgment sets (but that is often not practical).

  ### Conclusion on the Desiderata

  The list of desiderata includes:

  - Universal Domain (non-negotiable in a free society)
  - Collective Rationality (non-negotiable for rationality)
  - Anonymity, Neutrality, Unanimity, Non-dictatorship (non-negotiable for fairness and democracy in many contexts)
  - Independence (this is the one that causes the most trouble and may have to be relaxed)

  The key impossibility is that with at least two propositions and a non-trivial logical connection (like a conjunction), no aggregation rule can simultaneously satisfy UD, CR, I, and ND.

  In the grant example, the current procedure (majority on each sub-question and then apply the rule) is a premise-based procedure. It violates the conclusion that would be reached by a direct vote on the funding. But note: the rule is fixed (fund = sound method AND adequate sample). So if the group accepts the rule, then the premise-based procedure is one way to go. However, it leads to the situation where the group says "fund" even though two members would have said "no" to funding. This is because they disagree on the premises.

  A conclusion-based procedure (vote only on funding) avoids the inconsistency but does not take a stand on the premises. This might be problematic if the foundation wants to record the reasons for the decision.

  ### Final Brief Evaluation

  - **Majority voting on each question (premise-based)**:
     - Pros: Responsive to each premise, satisfies independence, anonymity, neutrality, and majority on each premise.
     - Cons: May produce an inconsistent group judgment (with the rule when the rule is applied to the group's premises) and may lead to a conclusion that is not supported by a majority when asked directly.

  - **Voting only on the final question (conclusion-based)**:
     - Pros: Avoids inconsistency by only focusing on the conclusion, and the group decision on the conclusion is directly voted.
     - Cons: Ignores the reasons (premises), so the group does not take a collective position on the premises. This might be bad if the premises are important for record-keeping or for future reference. Also, it does not satisfy independence (because we are not aggregating the premises).

  Given the impossibility results, there is no perfect method. The choice between the two methods (and others) depends on which properties are prioritized. In the grant example, if the foundation values the rule (conjunction) and wants the group to take a stand on the premises, then the premise-based method is acceptable. If they care more about the direct will on the funding decision, then the conclusion-based method is better.

  In practice, many organizations use the premise-based method for technical decisions (like grant reviews) because the premises are considered essential for the quality of the decision. However, they should be aware of the possibility of the doctrinal paradox.
answer: |-
  ### Desiderata for Group Judgment Aggregation  
  Your case exemplifies the *doctrinal paradox* (or *discursive dilemma*), where aggregating judgments on premises (method/sample) conflicts with aggregating the conclusion (funding). Below are core desiderata for any aggregation method, grounded in logic, fairness, and rationality. I'll distinguish non-negotiables from negotiables, identify key trade-offs, and evaluate your two procedures.  

  ---

  #### **Core Desiderata**  
  1. **Universal Domain (UD)**  
     - **What**: The method must produce a group judgment for *any possible combination* of individual judgments.  
     - **Why**: Restricting inputs (e.g., "no ties" or "no disagreement") precludes real-world diversity.  
     - **Status**: Non-negotiable for robustness.  

  2. **Collective Rationality (CR)**  
     - **What**: The group’s judgments must be *logically consistent*. If funding requires sound method AND adequate sample, the group can’t affirm both premises but reject funding.  
     - **Why**: Incoherent outcomes (e.g., "A, B, but not A∧B") undermine decision legitimacy.  
     - **Status**: Non-negotiable for rational group agency.  

  3. **Anonymity (A)**  
     - **What**: All voters’ identities are interchangeable. Swapping votes doesn’t change the outcome.  
     - **Why**: Prevents bias (e.g., privileging a senior panelist).  
     - **Status**: Non-negotiable for fairness.  

  4. **Systematicity / Independence (SI)**  
     - **What**: (a) The group’s judgment on each proposition depends *only* on individual judgments on *that proposition*; (b) The same aggregation rule applies to all propositions.  
     - **Why**: Prevents manipulation via irrelevant issues (e.g., letting opinions on funding sway method judgments).  
     - **Status**: **Negotiable**. Often relaxed to avoid paradoxes.  

  5. **Unanimity Preservation (UP)**  
     - **What**: If all individuals agree on a proposition, the group adopts it.  
     - **Why**: Rejecting consensus is irrational and undemocratic.  
     - **Status**: Non-negotiable.  

  6. **Non-Dictatorship (ND)**  
     - **What**: No single individual dictates the group’s judgment.  
     - **Why**: Collective decisions require genuine aggregation.  
     - **Status**: Non-negotiable.  

  7. **Majority Respect (MR)**  
     - **What**: If a majority agrees on a proposition, the group affirms it.  
     - **Why**: Embodies democratic responsiveness.  
     - **Status**: **Negotiable** if conflicts with CR (as in your case).  

  8. **Distinction Preservation (DP)**  
     - **What**: Distinguishes between aggregating *premises* (method/sample) and aggregating *conclusions* (funding). Forces the method to clarify whether it prioritizes reasons or outcomes.  
     - **Why**: Your case shows they aren’t equivalent; conflating them hides dissent.  
     - **Status**: Non-negotiable for transparency.  

  ---

  #### **The Key Impossibility**  
  **CR + SI + UD + ND → Impossible** (generalizing Arrow’s Theorem to judgments).  
  - **Why**: When propositions are logically connected (e.g., funding = method ∧ sample), SI forces premise-by-premise aggregation (ignoring connections). This risks inconsistent outcomes (e.g., affirming both premises but denying funding). Avoiding inconsistency (CR) requires violating SI—e.g., letting the conclusion override premises or vice versa.  
  - **Consequence**: You **must relax one**:  
    - **Drop SI**: Allow group judgments on one proposition to inform others (e.g., derive funding from aggregated premises).  
    - **Drop CR**: Tolerate inconsistency (e.g., fund despite rejecting a premise).  
    - **Drop UD/ND**: Restrict inputs or allow dictators (unacceptable).  

  ---

  #### **Which Desideratum Rules Out the Most Methods?**  
  **Systematicity/Independence (SI)** is the linchpin. It’s the usual culprit in impossibility theorems because it forbids cross-proposition reasoning. Most "fixes" for your paradox involve relaxing SI.  

  ---

  #### **Evaluating Your Two Procedures**  
  1. **Majority Voting on Each Premise (Current Method)**  
     - **UD**: ✅ Handles any vote split.  
     - **A/ND**: ✅ Treats voters equally; no dictator.  
     - **UP**: ✅ Unanimous premises are adopted.  
     - **MR**: ✅ Respects majority votes on premises.  
     - **CR**: ❌ **Fails** in your case: method=yes (2–1), sample=yes (2–1), so funding=yes—but 2/3 would reject funding directly. The group is inconsistent.  
     - **SI**: ✅ Applies majority rule per proposition.  
     - **DP**: ✅ Aggregates premises, not conclusions.  
     - **Verdict**: Prioritizes premises over conclusions but violates CR.  

  2. **Majority Voting Only on Conclusion ("Should we fund?")**  
     - **UD**: ✅ Handles any vote.  
     - **A/ND**: ✅ Voters equal; no dictator.  
     - **UP**: ✅ Unanimous funding decisions are adopted.  
     - **CR**: ✅ Group judgment is coherent (only one proposition).  
     - **MR**: ✅ Funds iff majority says "fund."  
     - **SI**: ✅ Independent judgment on funding.  
     - **DP**: ❌ **Fails**: Ignores *why* voters reject funding (method vs. sample dissent). Collapses reasons into a binary.  
     - **Verdict**: Avoids inconsistency but obscures dissent on premises.  

  ---

  #### **The Trade-Off in Your Case**  
  - **Premise-based (current method)**: Preserves *reasons* (method/sample judgments) but risks *collective irrationality* (funding despite internal dissent).  
  - **Conclusion-based**: Preserves *outcome coherence* but obscures *reasons* (e.g., was funding rejected due to method, sample, or both?).  
  - **No perfect solution**: Relax SI or accept a trade-off between CR and DP.  

  ### **The Big Picture**  
  Your paradox arises because **individual rationality ≠ group rationality**. When judgments interconnect (e.g., funding = method ∧ sample), aggregating atomistically (SI) can create a "group idiot" despite "individual geniuses." The desiderata list isn’t arbitrary—it exposes a core tension: **Systematicity (SI) and Collective Rationality (CR) cannot coexist** in non-trivial decisions. To resolve your grant dilemma, you must either:  
  - **Prioritize CR**: Aggregate premises and derive the conclusion (current method), accepting that the group may "fund" projects that lack majority support when asked directly.  
  - **Prioritize DP**: Vote only on the conclusion, accepting that you lose insight into disagreements about *why*.  

  The "right" choice depends on your goals:  
  - If the *rule* (sound method ∧ adequate sample) is sacrosanct, premise-based voting is defensible (a "feature").  
  - If the *overall will* ("should we fund?") matters more, conclusion-based voting is better.  

  Either way, the impossibility isn’t a flaw—it’s a revelation about collective reason.
