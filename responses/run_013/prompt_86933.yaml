prompt: |-
  I want to know what the Catholic practice of canonization is philosophically committed to. To be declared a saint, a person must be shown to have practiced the theological virtues — faith, hope and charity — to a heroic degree; for a candidate who did not die as a martyr, one miracle must be confirmed as having occurred through their intercession before beatification, and a further miracle before canonization; and the case is argued by a postulator who promotes the cause and, until its role was reduced in 1983, was contested by a promotor fidei, the 'devil's advocate', whose task was to look for flaws in the evidence. The candidate is always dead before any of this is settled, and what is conferred is public veneration and the right to invoke their intercession, not any benefit to the person. There is also a shortcut: by 'equivalent canonization' the pope may dispense with the judicial process and the miracles altogether, on the strength of a long-standing cult. Meanwhile the Church teaches that holiness is the vocation of everyone, not of a select few; beatification is treated as a permission and a fallible judgment, while canonization is widely held to be an infallible act. I find it hard to tell, from all this, whether sanctity is being treated as an achievement or as a gift.

  What theory of maximal moral goodness does this practice presuppose, and does it treat that goodness as desirable in itself or only for what it secures? Please reconstruct the theory; separate what the practice genuinely requires from what it merely sits comfortably with; say which rival views of sanctity it quietly rules out — that sanctity is continuous with ordinary virtue, that it is the person's own doing rather than a gift, that it is a purely ethical rather than a theological property, that it is the kind of thing that cannot be known with certainty; say where the practice is underdetermined, so that several different theories would license the same institution; and say what would have to change in the practice if the presupposed theory were replaced. Answer as a numbered list of exactly five items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user wants me to analyze the Catholic practice of canonization from a philosophical perspective. They've provided a detailed description of how saints are declared, including the requirements of heroic virtue, miracles, the role of postulators and devil's advocates, and the distinction between beatification and canonization. They're particularly interested in understanding whether sanctity is treated as an achievement or a gift, and what theory of maximal moral goodness this practice presupposes.

  I need to reconstruct the underlying theory based on this practice. The user wants me to identify what the practice genuinely requires versus what it's merely compatible with, which rival views it rules out, where it's underdetermined, and what would need to change if the theory were replaced. The answer must be exactly five numbered items of one or two sentences each, with no introduction or conclusion.

  Looking at the requirements, canonization seems to treat sanctity as both an achieved state (through heroic virtue) and a gift (divine grace is necessary). The requirement of miracles through intercession suggests sanctity has supernatural effects beyond natural virtue. The distinction between infallible canonization and fallible beatification indicates certainty about divine favor.

  The practice rules out views that sanctity is purely natural or continuous with ordinary virtue. It also rejects the idea that sanctity is entirely self-achieved without divine grace, or that it's unknowable. The requirement of miracles specifically rules out purely ethical conceptions of sanctity.

  Where the practice is underdetermined is around equivalent canonization - this allows for different theological interpretations of how exactly divine favor manifests. If we replaced the presupposed theory with something like a purely humanistic view, we'd need to eliminate miracles and supernatural elements entirely.

  I'll structure this into five concise points covering: the core theological commitments, what genuinely distinguishes sanctity from ordinary virtue, which rival views are excluded, where flexibility exists, and what would change with a different theory. I'll make sure each point is just one or two sentences to meet the user's formatting requirements.
answer: |-
  1.  The practice genuinely requires that maximal moral goodness (sanctity) is a supernatural state achieved through heroic cooperation with divine grace, evidenced primarily by the theological virtues (faith, hope, charity) lived exceptionally; it treats this goodness as desirable primarily for union with God, though it also secures benefits for others through intercession.
  2.  It genuinely distinguishes sanctity from ordinary virtue by demanding heroic *degree* confirmed by investigation and requiring divine authentication through miracles (for non-martyrs), ruling out views that sanctity is merely continuous with ordinary moral excellence or a purely natural ethical property achievable without grace.
  3.  The practice quietly rules out rival views that sanctity is solely the person's own achievement (by requiring divine signs like miracles) and that it is unknowable with certainty (by treating canonization itself as an infallible judgment of the Church regarding the person's heavenly state and divine favor).
  4.  The practice is underdetermined regarding the precise nature of divine causality in miracles and the exact role of the "long-standing cult" in equivalent canonization, allowing different theological explanations for how grace operates or how popular devotion signifies divine approval.
  5.  If the presupposed theory were replaced by one viewing maximal goodness as purely natural ethical perfection or solely a divine gift without human cooperation, the practice would need to change by eliminating the requirement for miracles and the claim of infallibility for canonization, focusing only on exemplary human virtue.
