prompt: |-
  I have no academic background in philosophy, but I have been thinking about the idea that we can take a physical, design, or intentional stance toward a system, and that a pattern is real when it compresses the system's behaviour better than the alternatives. I want your credence that, for at least some non-human systems (a thermostat, a chess engine, an ant colony, a large language model), the beliefs and desires we attribute under the intentional stance are real in the same sense as the patterns of physics, rather than useful fictions we could discard without predictive or explanatory loss once we had the full physical description. Please give me a number and decompose it into the sub-questions you think it depends on: whether there is an objective fact about which descriptions compress best, or whether compression is always relative to our interests; whether the intentional stance's predictions stay robust when our interests change; whether attributed beliefs and desires do causal work or only summarise it; whether the physical stance could in principle replace the intentional stance; and anything else you think belongs. I am especially interested in cases where the best intentional description attributes a false belief, as when a chess engine plays as though its queen were safe when it is not. Tell me which term the final number is most sensitive to, and what evidence or argument would move it most.
reasoning: |-
