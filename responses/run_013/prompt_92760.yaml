prompt: |-
  I'm a third-year PhD student in cognitive science, comp-neuro-ish background, thesis on mechanistic explanation in systems neuroscience. Besides the thesis I referee maybe six or eight papers a year for a mid-tier journal and I sit in this informal "explanation standards" reading group my lab runs, where we tear up each other's chapters and drafts before they go anywhere.

  The thing I keep being useless at, in reviews and in the group, is the crane/skyhook thing and greedy reductionism — Dennett's distinction, where a crane is a mechanism that does real work out of parts that were already there and already accounted for, a skyhook is something hauled in from nowhere that quietly presupposes the very thing you were supposed to explain, and greedy reductionism is when you leap straight to the bottom level and announce the phenomenon is "nothing but" some lower-level process, skipping all the intermediate levels that were doing the explaining. I keep either waving the labels around without being able to say what makes a given proposal one or the other, or the reverse: I let something through because it had the right shape of a mechanism and it turned out to be a relabeling.

  What I want from you is a decision procedure I can actually run, in about 40 minutes, on a paper or a draft chapter. My constraints: I'm not the decider — I write a review paragraph or a group comment, and the editor or the senior author has to sign off on anything that turns into a real objection. I have no lab access to the data, only the text and whatever's in the figures. And crucially, I do not want a procedure that rejects everything promissory: a lot of good work names a crane it hasn't built yet, and the honest verdict there is "this is a promissory note, here is the program it commits you to," not "reject." So the procedure has to separate the promissory-crane case from the skyhook case, since that's the distinction I actually keep fumbling.

  So, concretely: (1) the questions to ask in order, (2) for each, what counts as a sufficient answer and what an evasion looks like, (3) where the procedure stops and says no, (4) where it has to hand the call to a person because it's a judgment about how much promissory credit this field is willing to extend rather than a fact about the text, and (5) a short test or two I can apply to a single sentence — the "X is just Y" sentence and the "the system represents / computes / infers Z" sentence, since those are the two I see most and they fail differently.

  Then run it on three cases, and please make one of them hurt:
  - A paper explaining infants' early object expectations by positing an innate core object-representation system that is simply stipulated as present from birth.
  - A paper explaining adult moral condemnation as "just" reward learning over social feedback, with no account of the intermediate levels (concepts, norms, the difference between disapproval and prediction error).
  - And my own chapter, where I explain the transmission of a tool-making technique across generations by invoking "cumulative cultural evolution." Run the procedure on it honestly; I suspect it comes out badly and I'd rather find out now.

  Take the role of a philosopher of science who's worked seriously on mechanistic explanation and on this crane/skyhook business — someone who'd be annoyed by the labels being used as mere rhetoric. Before you write the procedure, spend a paragraph or two thinking out loud about which parts of the distinction are load-bearing and have to survive the operationalization and which are decorative and can be dropped; I'd rather see the thinking than a polished checklist that hides where the joints are. Don't give me a reading list or citations — I've read the stuff and I can't check references anyway, just work from the ideas. Also be explicit at the end about where the procedure will misfire: which real explanations it will wrongly flag as skyhooks, and which skyhooks it will let through because they're dressed up as cranes.
reasoning: |-
  We are going to build a decision procedure for identifying cranes, skyhooks, and greedy reductions in scientific explanations. The goal is to operationalize Dennett's distinction in a way that can be applied to a paper or chapter draft in about 40 minutes, using only the text and figures.

  First, let's think through the key ideas:

  1. **Crane**: A mechanism that explains a phenomenon by showing how it is built from existing, already-accounted-for parts and processes. It does real work by decomposing the phenomenon into lower-level components and showing how their interactions produce the phenomenon. A crane might be promissory (not fully built yet) but it must specify a plausible path for how the explanation could be completed.

  2. **Skyhook**: An explanatory device that is invoked without being grounded. It presupposes the very capacity it is meant to explain (e.g., by positing an innate module without explaining how it came to be) or invokes something that is not itself explained and cannot be integrated into the rest of the explanation. Skyhooks are often circular or question-begging.

  3. **Greedy reductionism**: Attempting to explain a phenomenon by jumping directly to the lowest level (e.g., neurons, genes) without accounting for the intermediate levels that do the explanatory work. This is a form of oversimplification that fails to capture the causal structure of the phenomenon.

  Key points for operationalization:

  - The procedure must allow for promissory notes (unbuilt cranes) but must distinguish them from skyhooks. The difference is that a promissory crane must outline a clear path for how the explanation could be built (e.g., by specifying the parts and their interactions, even if not yet tested) whereas a skyhook just labels the phenomenon without providing a mechanistic story.

  - We need to focus on whether the explanation provides (or promises to provide) a decomposition of the phenomenon into parts and processes that are (1) at a lower level, (2) already accepted or accounted for in the theory, and (3) shown to interact in a way that produces the phenomenon.

  - For greedy reductionism, the issue is skipping levels. We must check that the explanation does not bypass the intermediate mechanisms that are necessary for the phenomenon. Even if the reduction is to a low level, if there are missing steps that are essential, it's greedy.

  Now, the decision procedure:

  **Step 1: Identify the target phenomenon and the proposed explanation.**
     - *What to do*: Write down the phenomenon (P) that the paper is trying to explain and the proposed explanation (E) for P.
     - *Sufficient answer*: Clear statement of P and E. E must include a mechanism (a set of parts and their activities that together produce P).
     - *Evasion*: If the explanation is just a label (e.g., "it's innate", "it's cultural evolution") without any mechanism, that's a red flag. Also, if E is just a restatement of P (e.g., "the system represents objects because it has an object representation system"), that's evasion.
     - *If evasion*: Flag as potential skyhook. Proceed to Step 2 to check if it's promissory.

  **Step 2: Check for mechanism decomposition.**
     - *What to do*: Look for a decomposition of the mechanism into parts and their activities. Ask: What are the components of E? How do they interact to produce P? What is the causal chain?
     - *Sufficient answer*: The text must specify (a) the parts (entities) and (b) the activities (what they do) that together result in P. The parts must be at a lower level than P and must be independently identifiable (i.e., not defined solely by their role in producing P). The activities must be described in terms that are already understood (or for which a crane is provided, recursively).
     - *Evasion*: Vague terms that are just synonyms for P (e.g., "the system has an innate core object-representation system" without saying what that system is made of or how it operates). Also, if the parts are at the same level as P (circular) or if they are not independently grounded.
     - *If no decomposition*: Check if it's promissory. A promissory note must outline a research program: what parts/activities are missing, how they might be discovered, and how they would fit together. If there is no such outline, flag as skyhook. If there is, note it as a promissory crane and proceed to Step 3.

  **Step 3: Check for grounding.**
     - *What to do*: Verify that the parts and activities of the mechanism are grounded in lower-level processes that are already accepted or for which there is an independent account. Also, check that the explanation does not skip intermediate levels (to avoid greedy reductionism).
     - *Sufficient answer*: The parts and activities are either (a) well-established in the field (e.g., neurons, known cognitive processes) or (b) the paper provides a crane for them (recursive check: apply Steps 1-3 to each subcomponent). The explanation must show how the phenomenon emerges from the interactions at the lower level without gaps.
     - *Evasion*: Jumping to a very low level (e.g., neurons or genes) without showing the intermediate steps (e.g., how neural activity leads to cognitive functions). Also, if the grounding is in something that is itself a skyhook (e.g., "the innate module is in the genes" without explaining how genes build the module).
     - *If ungrounded and not promissory*: Flag as greedy reductionism if it jumps to a low level without intermediates, or as skyhook if it's an unexplained postulate. If it's promissory (i.e., the paper acknowledges the gap and outlines how to fill it), then note as such.

  **Step 4: Check for circularity or question-begging.**
     - *What to do*: Look for whether the explanation presupposes the phenomenon it's trying to explain. Ask: Does E require P to be already in place? For example, does the mechanism rely on a capacity that is at the same level as P and not explained?
     - *Sufficient answer*: The explanation must show how P arises from non-P components. The parts and activities must not require P to function (unless P is being explained recursively, but then the recursion must be grounded).
     - *Evasion*: Using a term that is defined by the phenomenon (e.g., "the system has a representation of objects" when the phenomenon is object representation). Also, if the mechanism requires the agent to have the very capacity being explained (e.g., explaining moral condemnation by reward learning that already requires a concept of morality).
     - *If circular*: Flag as skyhook.

  **Step 5: Handle promissory notes.**
     - *What to do*: If the explanation is incomplete but promissory, evaluate the promise. Does the paper outline a concrete research program? Are the missing parts identified? Is there a plausible path to building the crane?
     - *Sufficient answer*: The paper must (a) acknowledge what is missing, (b) specify what needs to be done (e.g., experiments, models, or further decomposition), and (c) show how filling these gaps would complete the explanation. The promissory note must not be a disguised skyhook (i.e., the missing part must not itself be a skyhook).
     - *Evasion*: Hand-waving (e.g., "future research will figure it out" without any guidance). If the promissory part is a skyhook (e.g., "we will find the innate module in the brain" without a plan for how to decompose it), then it's a skyhook in disguise.
     - *If insufficient promissory note*: Flag as skyhook. Otherwise, note as a valid promissory crane.

  **Where the procedure stops and says no**:
     - If after Step 2 there is no decomposition and no promissory note (or an inadequate one), then it's a skyhook.
     - If Step 3 reveals greedy reductionism (jumping to a low level without intermediates) and there's no promissory note for the intermediates, then it's greedy reductionism.
     - If Step 4 reveals circularity, then it's a skyhook.

  **Where judgment is needed (hand to human)**:
     - Evaluating the plausibility of a promissory note: How much credit the field is willing to extend? This depends on the track record of the approach, the feasibility of the proposed research, and the state of the field. The reviewer must use judgment.
     - When the grounding of a part is contested: If a part is considered established by some but not others, the reviewer must judge based on the consensus of the field (as represented in the paper's context).
     - When the level skipping is acceptable: Sometimes a field has established that a jump is valid (e.g., from neurons to behavior in simple systems). The reviewer must judge if the gap is too big.

  **Short tests for common sentences**:

  1. **The "X is just Y" sentence (greedy reductionism check)**:
     - Ask: What are the steps between Y and X? If the paper does not provide at least one intermediate level (or a promissory note for it), then it's greedy. Also, check if Y is at a significantly lower level and if the mapping is direct and without residue.

  2. **The "the system represents / computes / infers Z" sentence**:
     - Ask: What is the mechanism by which the system does this? If the mechanism is not described (or is just a restatement, e.g., "it has a representation of Z"), then it's a potential skyhook. Also, check if the representation/computation is taken as primitive without grounding.

  Now, let's run the procedure on the three cases:

  **Case 1: Innate core object-representation system in infants**

  - Step 1: 
     - P: Infants' early object expectations.
     - E: An innate core object-representation system.
  - Step 2: 
     - Decomposition? The paper says the system is "innate" and "core", but doesn't decompose it into parts and activities. It's just a label. If there's no mechanism, it's a red flag.
     - Promissory? If the paper says nothing about how this system works, then no. If it says "future work will study the neural basis", that's a promissory note. But without a plan for decomposition, it's weak.
  - Step 3: 
     - Grounding? The innate system is not grounded. It's posited without any lower-level account. If it's said to be genetic, but without a crane from genes to the representation system, it's ungrounded.
  - Step 4: 
     - Circularity? The system is defined by its role (producing object expectations). So it presupposes the capacity it explains.
  - Step 5: 
     - If promissory, but without a plan for decomposition, it's inadequate.
  - **Verdict**: Skyhook. The explanation is circular and ungrounded. The innate system is a label for the phenomenon.

  **Case 2: Moral condemnation as "just" reward learning**

  - Step 1:
     - P: Adult moral condemnation.
     - E: Reward learning over social feedback.
  - Step 2:
     - Decomposition? Reward learning is a mechanism, but we need to see how it produces moral condemnation. The paper must decompose: e.g., how social feedback (rewards/punishments) lead to the formation of moral concepts and then to condemnation. If there is no account of intermediates (like how reward prediction errors become internalized norms), then it's not decomposed.
  - Step 3:
     - Grounding? Reward learning is a well-established mechanism (e.g., in RL theory). But if the paper jumps from RL to moral condemnation without intermediates, it's greedy. The intermediate levels (concepts, norms) are skipped.
  - Step 4:
     - Circularity? Not necessarily, but if the social feedback already presupposes moral condemnation (e.g., if the feedback is given because of moral condemnation by others), then it might be circular. But the paper might avoid this by using non-moral feedback (e.g., simple rewards). However, the gap is in the intermediates.
  - Step 5:
     - If the paper acknowledges the gap and outlines how to fill it (e.g., by modeling the learning of norms), then it's promissory. Otherwise, it's greedy.
  - **Verdict**: Without intermediates, it's greedy reductionism. If the paper says "it's just RL" and leaves out how RL leads to moral condemnation, then it's greedy. If it has a promissory note for the intermediates, then it's a promissory crane.

  **Case 3: Your chapter on "cumulative cultural evolution" for tool-making transmission**

  - Step 1:
     - P: Transmission of a tool-making technique across generations.
     - E: Cumulative cultural evolution.
  - Step 2:
     - Decomposition? What is the mechanism? "Cumulative cultural evolution" is a label. Does the chapter break it down? For example, does it specify the parts: individuals who learn, methods of transmission (imitation, teaching), and the accumulation of modifications? If not, it's just a label.
  - Step 3:
     - Grounding? If the chapter uses established models (e.g., population dynamics, social learning mechanisms) then it's grounded. But if it just invokes the term without showing the mechanism, then it's not.
  - Step 4:
     - Circularity? If "cumulative cultural evolution" is defined as the phenomenon of transmission and accumulation, then using it to explain the transmission is circular.
  - Step 5:
     - Promissory? If the chapter outlines how cultural evolution works (e.g., by reference to specific models or processes) then it's a crane. If it just says "it's cumulative cultural evolution" and leaves the mechanism as a black box, then it's a skyhook.
  - **Verdict**: It depends on what's in the chapter. If you have decomposed the process into mechanisms (e.g., social learning mechanisms, innovation, transmission across generations) then it's a crane. If it's just a label, then it's a skyhook. Given your suspicion, let's say the chapter uses the term without decomposition. Then it's a skyhook. But if you have a model (even a simple one) of how the transmission works step by step, then it's a crane.

  **Where the procedure will misfire**:

  - **False positives (flagging real explanations as skyhooks)**:
     - When a mechanism is so well-established in the field that it doesn't need decomposition in the paper (e.g., using "neuron" without explaining how it works). The procedure might flag it as undecomposed, but here we rely on the grounding step (Step 3) to accept established parts. However, if the field's consensus is not captured in the procedure, it might misfire. Judgment is needed.
     - When an explanation is at the right level of abstraction and doesn't need further decomposition for the purposes of the paper (e.g., in a high-level cognitive model). The procedure might be too strict.

  - **False negatives (letting skyhooks through)**:
     - Skyhooks that are disguised by elaborate but circular mechanisms (e.g., a complex model that still presupposes the phenomenon). Step 4 (circularity check) might miss it if the circularity is subtle.
     - Greedy reductions that are widely accepted in the field (e.g., explaining behavior by neural activity without intermediates in a field that has accepted that jump). The procedure would flag it, but the human might override.

  The procedure is a tool to help you articulate your critique. It doesn't replace judgment but structures it.
answer: |-
  ### Operationalizing the Crane/Skyhook Distinction: Load-Bearing Elements
  Before presenting the decision procedure, let's clarify which aspects of Dennett's distinction are essential and which can be relaxed for practical application in your context. The core insight is that **cranes are *mechanistic* explanations**—they decompose a phenomenon into lower-level components (parts, processes, or entities) that are *already accounted for* in the scientific landscape (either empirically or theoretically) and show how their interactions produce the target phenomenon. Crucially, cranes can be promissory if they provide a concrete path to validation. **Skyhooks**, conversely, are *non-mechanistic*: they invoke unexplained primitives (e.g., innate modules, irreducible computations) that presuppose the very capacity being explained, effectively halting further inquiry. **Greedy reductionism** is a failure mode where an explanation leaps to the lowest possible level (e.g., neurons, genes, or reinforcement learning) while skipping intermediate mechanisms necessary to bridge the explanatory gap.

  **Load-bearing elements to preserve**:
  1. **Mechanistic decomposition**: A crane must specify *how* the phenomenon arises from interactions of lower-level parts. If it doesn't, it risks being a skyhook.
  2. **Grounding in existing resources**: Parts/processes must be "already accounted for"—meaning they are either empirically established, theoretically well-defined, or part of a promissory research program *with a clear path to validation*. Skyhooks lack this grounding.
  3. **Anti-circularity**: The explanation cannot presuppose the phenomenon (e.g., "innate representation" to explain representation).
  4. **Level-skipping detection**: Greedy reductionism occurs when intermediate levels (e.g., cognitive computations between social feedback and moral condemnation) are omitted without justification.

  **Decorative elements to drop**:
  - Dennett's metaphorical "cranes building cranes" emphasis—useful for evolutionary contexts but not essential for mechanistic evaluation.
  - Strict adherence to "bottom-up" vs. "top-down" framing; the key is whether *intermediate* levels are addressed, not absolute levels.

  The procedure below operationalizes this. It focuses on **identifying whether the explanation provides (or promises) a mechanistic decomposition** and **whether that decomposition avoids circularity or level-skipping**.

  ---

  ### Decision Procedure for Crane/Skyhook/Greedy Reductionism

  **Time budget**: ~40 minutes per paper/chapter.  
  **Input**: Text and figures only.  
  **Output**: A structured critique for your review/comment, flagging one of:  
  - ✅ **Crane** (mechanistic, grounded, non-circular)  
  - ⚠️ **Promissory Crane** (decomposition outlined but not yet built; requires judgment on credibility)  
  - ❌ **Skyhook** (non-mechanistic, circular, or ungrounded)  
  - ⏩ **Greedy Reduction** (skips essential intermediate levels)  

  #### Step 1: Identify the Explanatory Target and Proposed Mechanism (5 mins)
  - **Question**: What phenomenon *P* is being explained, and what is the proposed mechanism *M*?  
  - **Sufficient answer**: *P* is clearly stated (e.g., "infants' object expectations"), and *M* is described as a set of *parts/processes* and their *interactions* (e.g., "neural circuit X integrates sensory input via algorithm Y").  
  - **Evasion**: *M* is a label (e.g., "innate core system," "cultural evolution") with no decomposition. *P* and *M* are conflated (e.g., "object expectations arise from an object-expectation system").  
  - **Action if evasion**: Flag as *potential skyhook*; proceed to Step 2 to check for promissory content.  
  - **Hand to human?** No—this is factual text analysis.  

  #### Step 2: Check for Mechanistic Decomposition (10 mins)
  - **Question**: Does *M* decompose *P* into lower-level parts/processes that are **functionally specified** (what they *do*) and **independently grounded** (not defined solely by *P*)?  
  - **Sufficient answer**:  
    - Parts/processes are named and their causal roles described (e.g., "reward prediction errors update value weights").  
    - Grounding: Parts/processes are either (a) empirically established (e.g., "dopamine neurons" with citations), (b) theoretically defined from prior work (e.g., "Bayesian inference"), or (c) *promissory with a validation path* (e.g., "we will model this attractor network").  
  - **Evasion**:  
    - Vague handwaves (e.g., "emerges from interactions").  
    - Circular grounding (e.g., "the innate system explains expectations" → innate system is not itself explained).  
  - **Action**:  
    - If decomposed and grounded → Proceed to Step 3.  
    - If decomposed but ungrounded → Flag as *potential skyhook*; proceed to Step 4 for promissory check.  
    - If not decomposed → Flag as *skyhook candidate*; proceed to Step 4.  

  #### Step 3: Check for Level-Skipping (Greedy Reductionism) (10 mins)
  - **Question**: Does *M* bridge all necessary intermediate levels between *P* and the lowest level invoked?  
  - **Sufficient answer**:  
    - For *P* (e.g., moral condemnation), intermediates (e.g., norm internalization, concept formation) are addressed, or their omission is justified (e.g., "prior work shows norms reduce to reinforcement learning").  
  - **Evasion**:  
    - "Just"-style leaps (e.g., "condemnation *is just* reward learning") with no intermediates.  
    - Lower-level parts (e.g., prediction errors) used to explain *P* without showing *how* (e.g., how errors become moral judgments).  
  - **Action**:  
    - If intermediates missing/unjustified → Flag as *greedy reductionism*.  
    - If intermediates addressed → Proceed to Step 4.  

  #### Step 4: Evaluate Promissory Content (10 mins)
  - **Question**: If *M* is undecomposed or ungrounded, does the paper provide a **concrete promissory path** to validate/construct the crane?  
  - **Sufficient answer**:  
    - Specifics: What is missing? How will it be tested/modeled? (e.g., "fMRI will localize the core system; lesion studies test necessity").  
    - Non-circular: The path doesn't presuppose *P* (e.g., "we'll test infants' object tracking" not "we'll measure the innate system").  
  - **Evasion**:  
    - "Future work will address this." (no specifics)  
    - "This is beyond our scope." (no path)  
  - **Action**:  
    - If concrete path → Label **⚠️ Promissory Crane**; *hand to human for credit evaluation* (Step 5).  
    - If evasive or circular → Label **❌ Skyhook**.  
  - **Hand to human?** Promissory cranes always require human judgment for credibility.  

  #### Step 5: Human Judgment for Promissory Credit (5 mins)
  - **Question**: Is the promissory note credible given the field's standards?  
  - **Factors to weigh**:  
    - Feasibility: Are the proposed methods/data sources realistic?  
    - Track record: Does the lab/field have expertise to deliver?  
    - Scope: Is the promise proportional to the paper's claims (e.g., a modest model vs. grand theory)?  
  - **Your role**: As reviewer, write: "The mechanism is promissory; its credibility depends on [factors]. I recommend [e.g., revision to clarify/limit claims]."  
  - **Decider role**: Editor/senior author decides if promissory credit is sufficient.  

  #### Short Tests for Common Sentences
  1. **"X is just Y" (Greedy Reductionism Check)**  
     - Ask: "What are the *intermediate steps* between Y and X?"  
     - Sufficient: Intermediates described or justified (e.g., "Y modulates Z, which generates X").  
     - Evasion: No intermediates; Y is unrelated or too distant (e.g., "morality is just dopamine").  
     - Test: If intermediates missing → Flag as **greedy reductionism**.  

  2. **"The system represents/computes/infers Z" (Skyhook Check)**  
     - Ask: "What is the *mechanism* for representation/computation?"  
     - Sufficient: Mechanism described (e.g., "population codes Z via Bayesian updating").  
     - Evasion: Circular (e.g., "it has a Z-representation because it infers Z").  
     - Test: If mechanism missing → Flag as **potential skyhook**; apply Step 2/4.  

  ---

  ### Procedure Applied to Your Cases

  **Case 1: Infants' object expectations explained by an innate core system**  
  - **Step 1**: *P* = infants' object expectations; *M* = "innate core object-representation system."  
  - **Step 2**: No decomposition—"innate core system" is a label. No grounding (innateness isn't explained). → **Skyhook candidate**.  
  - **Step 3**: N/A (no decomposition).  
  - **Step 4**: If paper says, "system is innate; future work will trace neural origins," this is *evasive* (no validation path). If it says, "we'll use neural modeling to show how visual inputs wire object circuits," it's *concrete*.  
  - **Verdict**: ❌ Skyhook (typical evasion: innateness presupposes the capacity).  

  **Case 2: Moral condemnation as "just" reward learning**  
  - **Step 1**: *P* = moral condemnation; *M* = "reward learning over social feedback."  
  - **Step 2**: Decomposed? Reward learning is grounded (RL theory), but no link to condemnation. → **Ungrounded for P**.  
  - **Step 3**: Skips intermediates (norms, concepts). "Just" implies leap. → **Greedy reductionism**.  
  - **Step 4**: If paper says, "we model how prediction errors scale to moral judgments," it's promissory. If not, greedy.  
  - **Verdict**: ⏩ Greedy reductionism (intermediates skipped; no promissory path for norms).  

  **Case 3: Your chapter on tool-making via "cumulative cultural evolution"**  
  - **Step 1**: *P* = transmission of tool-making; *M* = "cumulative cultural evolution."  
  - **Step 2**: Likely undecomposed—if "cultural evolution" is a label (e.g., no parts like imitation, innovation, or selection), it's **skyhook candidate**. If decomposed (e.g., "social learning algorithms copy tools, errors introduce variation"), it's grounded.  
  - **Step 3**: If intermediates skipped (e.g., no cognitive mechanisms for transmission), **greedy**.  
  - **Step 4**: If you outline validation (e.g., "agent-based model shows how copying fidelity enables accumulation"), it's ⚠️ promissory crane.  
  - **Honest verdict**: If the chapter just invokes the term without mechanistic detail → ❌ Skyhook. *But* if you specify components (e.g., "imitation reduces copying error, allowing incremental improvement"), it's ✅ crane. Given your suspicion, revise to add decomposition (e.g., "the crane is social learning mechanisms X, Y, Z").  

  ---

  ### Where the Procedure Misfires
  **False Positives (Flags Cranes as Skyhooks/Greedy)**:
  - **Established primitives**: In mature fields, certain mechanisms (e.g., "action potentials") need no decomposition. The procedure may flag them if grounding isn't explicit. *Mitigation*: Step 2 accepts "empirically established" parts—rely on field consensus.
  - **High-level models**: Some explanations (e.g., cognitive architectures) intentionally abstract from lower levels. The procedure may cry greediness. *Mitigation*: Step 3 allows justification for skipping levels if intermediates are irrelevant (rare).

  **False Negatives (Misses Skyhooks/Greediness)**:
  - **Sophisticated circularity**: E.g., a computational model that implicitly presupposes *P* (e.g., "innate grammar" in a parser). The procedure catches obvious circularity but may miss embedded assumptions. *Mitigation*: Step 4’s "non-circular path" requirement helps.
  - **Promissory handwaves**: A skyhook disguised as a promissory note (e.g., "future work will reveal the innate module") may slip through if it sounds concrete. *Mitigation*: Step 4 demands specifics—vague promises fail.

  **Key Blind Spot**: The procedure assumes textual clarity. If a paper buries skyhooks in jargon (e.g., "hyperpriors for core knowledge"), it may misfire. Your role is to enforce mechanistic transparency.

  ---

  ### Final Advice
  Use this as a structured checklist, but adapt it to context. For promissory cranes, your review should highlight *what must be delivered* (e.g., "the crane requires showing how norms arise from RL"). For skyhooks, demand decomposition ("what *is* the core system?"). And for your chapter: Decompose "cultural evolution" into testable mechanisms—it’s fixable. You’re not useless; you’re refining the hardest skill in science.
