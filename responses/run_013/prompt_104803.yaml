  ### Runnable Activity Design: Feeling Logical Omniscience

  #### **Core Mechanic & Scoring**
  - **Scoring Scheme**: Each proposition scored is worth **1 point** (no real money). Points are tallied per round. The goal is to maximize points, but the activity is about experiential learning, not competition.
  - **Total Time**: 90 minutes (timeline below).

  ---

  #### **Materials**
  1. **Information Cards (14 unique cards)**:
     - Generated by constraints on three binary switches (A, B, C), defining subsets of the 8 possible worlds (e.g., 000, 001, ..., 111).  
     - **Card Constraints** (examples; ensure one contradictory card):
       - Non-contradictory: "A is on," "B is off," "A and B agree," "A on and C off," "B on or C on," etc.  
       - Contradictory: "A is on and A is off" (or "A on and B on, and A off").
     - **Physical Cards**: Index cards with the constraint written (e.g., "Your information: A is on"). Include a QR code linking to a visualization of the worlds (optional).  
     - **Distribution**: Randomly assign cards to students. Ensure one student gets the contradictory card.

  2. **Propositions List (16 items for auction)**:
     - **Why these?** Cover logical truths, disjunctions, equivalences, and a contradiction to highlight omniscience shocks.  
     - **List** (projected/printed):  
       P1: A is on  
       P2: B is on  
       P3: C is on  
       P4: A is off  
       P5: B is off  
       P6: C is off  
       P7: A and B are both on  
       P8: A and B are not both on  
       P9: A and B are the same  
       P10: A and B are different  
       P11: If A is on, then B is on  
       P12: Either A is on or B is on (or both)  
       P13: Either A or B or C is on  
       P14: Not all of A, B, and C are on  
       P15: Either A is on or A is off (tautology)  
       P16: A is on and A is off (contradiction)  

  3. **Other**: Whiteboard (track scores), timer, handouts of propositions.

  ---

  #### **Roles**
  - **Facilitator (You)**: Run rounds, score silently, avoid lecturing.  
  - **Students (14 Agents)**: Use cards to "score" propositions. No collaboration.

  ---

  #### **Timeline (90 Minutes)**
  1. **Setup (10 min)**:
     - Distribute cards and propositions list.  
     - Brief intro: *"You’re agents with private information. We’ll auction 16 claims about switches A, B, C. In each round, you’ll score points if a claim matches your information. Goal: Maximize points. Don’t overthink—just engage."*  
     - **Crucial**: Do NOT explain logical omniscience, possible worlds, or closure. Say: *"Rules change each round. I’ll explain as we go."*  

  2. **Round 1: Reasoning (25 min)**:
     - Rules: *"Raise your hand to bid on a proposition. If called, state an inference from your card aloud (e.g., ‘My card says A is on, so P1 is true’). If valid, you score 1 point. No inference? No points."*  
     - Process:  
       - Project each proposition (P1–P16) in order.  
       - For each, allow 3–4 volunteers (prioritize diverse students).  
       - Quickly judge validity (pre-compute answers to avoid delays).  
     - **Goal**: Students struggle—those with complex cards score less. Contradictory card holder can infer anything (but may not realize it).  

  3. **Round 2: Closure (15 min)**:
     - Rules: *"No bidding. I’ll re-score all propositions automatically. You score 1 point for every proposition true in all worlds consistent with your card—no reasoning needed."*  
     - Process:  
       - Project all propositions again.  
       - Announce scores per student (e.g., *"Student X, you score P1, P7, P12, ..."*). Use precomputed results (see table below).  
     - **Shock**: Scores spike. Identical cards now have identical scores. Contradictory card scores **all 16 propositions** (vacuously true).  

  4. **Round 3: Awareness (15 min)**:
     - Rules: *"You have 2 minutes to write down propositions you’ve actively considered (e.g., from Round 1). Only these can score. I’ll recheck against your card."*  
     - Process:  
       - After writing, project propositions. For each, ask: *"Who wrote this?"* Check sheets and award points if true per card.  
     - **Shock**: Scores drop. Students miss "obvious" inferences (e.g., tautologies).  

  5. **Score Tally (5 min)**:  
     - Display per-round totals on whiteboard. Highlight jumps (Round 1 → 2) and drops (Round 2 → 3).  

  6. **Debrief (20 min)**:  
     - Start open-ended: *"What surprised you? What felt unfair?"* Then connect:  
       | **Observation**               | **Possible-Worlds Feature**                          | **Cost of Fixing**                                  |  
       |-------------------------------|-----------------------------------------------------|-----------------------------------------------------|  
       | Scores jumped for free (R1→R2) | Closure under entailment                            | Cannot avoid without abandoning possible worlds     |  
       | Identical cards, same score   | Knowledge depends on information state, not reasoning | Reasoning is irrelevant; omniscience is "automatic" |  
       | Contradictory card knows all  | Inconsistency → triviality (explosion)              | Requires paraconsistent logic or belief revision    |  
       | Knew disjunction (P12) but not disjuncts (P1/P2) | Knowledge not "factive" to disjuncts               | Reintroduces syntactic awareness                   |  
       | Tautology (P15) scored by all | Knowledge of logical truths                         | Awareness fix excludes "unconsidered" truths        |  
       | Awareness (R3) lowered scores | Rejects closure; models cognitive limits            | Loses closure/conjunction (knowing P and Q doesn’t imply knowing P∧Q) |  
     - **Key Debrief Points**:  
       - Closure is powerful but unrealistic. Awareness "fixes" it by adding explicit consideration (syntactic machinery), but loses key features (e.g., automatic knowledge of entailments).  
       - Omniscience is a deliberate idealization: possible worlds model "what follows" from information, not "what agents realize." Real agents fail for many reasons (unawareness, computation, errors).  
       - **What the activity misses**: Infinitude of consequences (we used 16 props), non-unawareness failures (e.g., computational limits), and debates about whether omniscience is a bug or feature.  

  ---

  #### **Precomputed Scoring Table (Facilitator Cheat Sheet)**
  For each card, precompute which propositions are true in **all** consistent worlds (Round 2 scoring):  
  - **Example 1**: Card "A is on" → Worlds: 100, 101, 110, 111.  
    - Scores: P1 (A on), P7 (A and B on) *only if B is on in all worlds? No* → Recompute: P1 (true in all), P15 (true), but not P7 (B may be off).  
  - **Example 2**: Contradictory card → No worlds. All propositions vacuously true (score all 16).  
  - **Tool**: Use a spreadsheet (input constraints, output scores for all 16 props).

  ---

  #### **Predictable Problems & Fixes**
  1. **Problem**: Round 1 runs long (students struggle with inferences).  
     **Fix**: Cap bids at 15 sec/proposition. Skip if no volunteers.  
  2. **Problem**: Contradictory card holder infers everything in Round 1 (trivializing the shock).  
     **Fix**: If they bid, allow it—but emphasize in debrief that explosion is counterintuitive.  
  3. **Problem**: Students write all propositions in Round 3 (defeating awareness).  
     **Fix**: Stress: *"Only what you actively considered—be honest!"* If they cheat, note: *"Real agents can’t ‘write all’—there are infinite consequences."*  
  4. **Problem**: Students don’t see the "shocks."  
     **Fix**: In debrief, contrast scores: Show a pair with identical cards but different Round 1 scores → identical Round 2 scores. Highlight contradictory card’s jump to 16.  

  ---

  #### **Contestable Design Choices & Caveats**
  1. **Contradictory Card → Omniscience**:  
     - **Contestable**: Vacuity in possible-worlds semantics is standard, but some argue inconsistent agents should be "ignorant," not omniscient.  
     - **Change My Mind**: If trial runs show students reject vacuous truth (e.g., say *"I shouldn’t know P1"*), use a paraconsistent example (e.g., "A on and not A on" scores nothing).  
  2. **Awareness Fix Rejects Closure**:  
     - **Contestable**: The activity implies awareness is the *only* fix, but other approaches exist (e.g., impossible worlds).  
     - **Change My Mind**: If students propose alternatives (e.g., *"What if we allow approximate knowledge?"*), adjust debrief to acknowledge multiple fixes.  
  3. **Tautology Knowledge**:  
     - **Contestable**: Round 2 scores P15 for all—but is this "knowledge" or a formal artifact?  
     - **Change My Mind**: If students argue *"P15 is obvious, so scoring it is fine,"* concede that tautologies are uncontroversial in the model.  

  ---

  #### **What Activity Can’t Replicate (Requires Verbal Explanation)**
  1. **Infinitude of Consequences**: Possible worlds entail infinitely many truths; we used 16 props.  
  2. **Non-Unawareness Failures**: Real agents fail closure due to computation/errors, not just unawareness.  
  3. **Omniscience as Idealization**: The model isn’t "wrong"—it’s a tool for modeling information, not psychology.  

  Run this activity, and students will viscerally feel why logical omniscience puzzles philosophers. The debrief then crystallizes the formalism behind their frustration.
