  Ok so Galen Strawson's basic argument about moral responsibility. You do what you do because of the way you are; so to be ultimately responsible for what you do you'd have to be ultimately responsible for the way you are; and to be responsible for the way you are you'd have to have deliberately made yourself that way; but any reason you could have had for making yourself one way rather than another would itself just be a function of how you already were at some earlier time; so you'd have to be responsible for that too, and so on back forever. And nothing can be the cause of itself. So nobody is ever ultimately responsible for anything. He gives a fuller version where even the person who deliberately, over years, made herself selfish doesnt get off, because the standards she used to do it werent hers either.

  I want a number: your probability that this arguement is sound, meaning the conclusion follows and every premise is true. And I want the decomposition, not just the number. How much of it rides on (a) whether real responsibility genuinely requires self-creation, or whether that's a stipulation smuggled into his definition of responsibility, (b) whether nothing can be the cause of itself is a conceptual truth or just a fact about how beings like us happen to be built, (c) whether the regress is truly infinite or whether it can bottom out in something the agent does own, (d) whether, if the argument goes through, the right response is to conclude that nobody is responsible or to conclude that the notion of responsibility he's attacking was empty all along, and (e) anything else you think belongs in the product. Then tell me which term you're least confident in and what would move it most.

  Then the part I actually care about. Does the same argument work against an agent that rewrites its own values, or a made-up being that picks its own fundamental character at the moment it comes into existence? If yes, does that show the thing is really a claim about the impossibility of self-causation rather than about determinism or about human psychology — and if so is it still interesting, or has it just told us that a contradiction contradicts? And if it also runs against blaming someone for a belief they can't help holding, or against pride and self-reproach, is that a reductio of the argument or a reductio of us?
