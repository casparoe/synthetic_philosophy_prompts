answer: |-
  Below is a move-by-move adjudication of Dana and Marcus's exchange, followed by an analysis of their core disagreements, the coherence of Marcus's idle-summary case, and the status of "real" patterns. I'll address your three focal questions explicitly at the end.  

  ---

  ### **Adjudication Move-by-Move**  
  **1. Dana’s Opening Claim**  
  *Claim:* Real patterns are objectively defined by optimal data compression (e.g., intentional stance > neurology).  
  *Verdict:* **Partly right, but incomplete.**  
  *Why:* Compression *is* a formal criterion for pattern reality (per Dennett’s original framing and algorithmic information theory). However, Marcus correctly notes that compression alone is relative to coding schemes. Dana overlooks that "best compression" requires a *natural* or *privileged* description language to avoid gerrymandering.  

  **2. Marcus’s Relativity/Objection**  
  *Claim:* Compression isn’t sufficient; causal load-bearing (intervention invariance) defines reality.  
  *Verdict:* **Right in critique, partly right in alternative.**  
  *Why:* Marcus validly exposes Dana’s oversight: compression *is* coding-scheme-relative. His interventionist criterion aligns with scientific realism (e.g., Woodward’s invariance under interventions). But he overreaches by dismissing compression entirely—it remains a useful *heuristic* for causal structure.  

  **3. Dana’s Counter: Intervention as Prediction**  
  *Claim:* Intervention is just "more data to compress"; causal criteria collapse into compression.  
  *Verdict:* **Wrong.**  
  *Why:* Dana conflates prediction with causation. Compression handles *observed* data; interventions test *counterfactual robustness*—a distinct epistemic standard. Predicting "if X were changed, Y would change" requires modal stability, not just data summarization. Her examples (early universe temperature, etc.) misapply: these *are* causally grounded in models invariant under relevant interventions (e.g., cosmological parameters).  

  **4. Marcus’s Trivialization/Circularity Charge**  
  *Claim:* If compression requires invariance, it’s circular; if not, it permits gerrymandering.  
  *Verdict:* **Largely right.**  
  *Why:* Marcus correctly forces a dilemma:  
  - If "best compression" implies invariance, Dana renames Marcus’s criterion.  
  - If not, compression admits false positives (e.g., a contrived coding scheme compressing noise into a "pattern").  
  Dana’s position *needs* invariance to avoid epistemic chaos.  

  **5. Dana’s Concession: Stability Under Perturbation**  
  *Claim:* "Good compression" requires stability under perturbation (invariance).  
  *Verdict:* **Right, but a retreat.**  
  *Why:* Dana concedes Marcus’s core point—invariance is necessary. Calling it "compression" is permissible *if* tied to objective description languages (e.g., universal Turing machines), but "invariance" is the operative concept.  

  **6. Marcus’s Final Challenge: The Idle-Summary Organism**  
  *Claim:* Invariance under behavioral perturbation ≠ causal reality; beliefs could be "useful fictions."  
  *Verdict:* **Partly right, but overstates.**  
  *Why:* Marcus’s idle-summary case *is* coherent in principle (e.g., a system where multiple belief-descriptions compress behavior equally well). However, if a description *robustly* predicts *all* interventions, it likely *approximates* causal structure (per the Church-Turing thesis). His "useful fiction" label is premature without evidence of causal irrelevance.  

  ---

  ### **What Both Are Missing**  
  - **Dana:** Underestimates how compression’s objectivity depends on a *natural* description language (e.g., Solomonoff induction). Without this, "best" is ill-defined.  
  - **Marcus:** Overlooks that compression in a privileged language (e.g., neural circuitry) often *reveals* causal structure. Invariance and compression aren’t rivals but complementary: compression identifies patterns; invariance tests their robustness.  
  - **Shared Blind Spot:** Neither grapples with **multiple realizability**. Beliefs can be causally load-bearing *without* being reducible to specific physical states—this is key to the intentional stance’s success.  

  ---

  ### **Answers to Your Three Questions**  
  1. **Which criterion do intentional stance posits satisfy?**  
     - They satisfy **both**, but *differently*. Beliefs/desires compress behavior optimally in a *cognitive* description language (e.g., folk psychology). They are also **causally load-bearing** at their *own level*: intervening on beliefs (e.g., via persuasion) changes behavior predictably. However, they may not be fundamental physical causes.  

  2. **Is Marcus’s idle-summary case coherent?**  
     - **No, not robustly.** If a description survives *all possible behavioral perturbations*, it must track *some* causal structure. For example:  
       - If "belief P" predicts behavior under every intervention (e.g., adding/removing information, rewards, threats), then P *is* causally implicated.  
       - Marcus’s "swappable summary" implies *equivalent causal models*—not fictionalism. True "idleness" would break invariance under interventions (e.g., altering "belief P" without behavioral change).  

  3. **Is this a verbal dispute over "real"?**  
     - **Partly.** Dana uses "real" for *objective utility* (an epistemic fact about efficient description). Marcus uses it for *causal power* (a metaphysical fact about world-structure).  
     - **But not purely verbal:** They clash on whether invariance is *necessary* (Marcus) or *emergent from compression* (Dana). The deeper issue is **explanatory priority**.  

  ---

  ### **Overall Verdict & Decisive Considerations**  
  - **Who has the better of it?** **Marcus, narrowly.**  
    - **Ranked Decisive Factors:**  
      1. **Invariance under interventions** is the gold standard for pattern reality (per scientific practice). Marcus forces Dana to adopt it.  
      2. **Gerrymandering threat:** Compression *alone* fails without invariance (Marcus’s relativity objection stands).  
      3. **Idle-summary incoherence:** Marcus’s thought experiment collapses under scrutiny—descriptions surviving *all* perturbations must be causally anchored.  
      4. **Dennett’s actual view:** Both misrepresent him slightly. Dennett *combines* compression ("real patterns") with pragmatic utility ("stances"), but invariance is implicit in his examples (e.g., chess-playing programs).  

  - **Synthesis:** Beliefs/desires are "real" as **higher-order causal patterns**—compressible, intervention-sensitive, and multiply realizable. Marcus wins on ontology; Dana on epistemology. The rift closes if we see compression (in a natural language) as a *detector* of invariant causal structure.  

  **Recommendation:** Abandon "compression vs. causation" as a dichotomy. The intentional stance succeeds when its posits are *projectible*—compressing past data *and* predicting novel interventions.
