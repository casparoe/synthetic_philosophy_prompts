  **Excerpt from *Clinical Practice in Myrmecological Medicine*, 4th Edition**  
  *Published by the International Society of Colony Health (ISCH)*  
  *Editor-in-Chief: Dr. Helena P. Formicarius*

  1. **Patient Identification and Case History**  
     Verify the colony’s identity via unique pheromone signatures in trail networks prior to assessment. Document patterns of prior dysfunction (e.g., "foraging paralysis," "brood-loop instability") and environmental exposures (e.g., flooding, invasive symbionts).  
     *Rationale*: The patient is the persistent organizational pattern, not its transient ant components. Historical data contextualize relapse or recovery despite complete part replacement.

  2. **Consent Acquisition Protocol**  
     Read consent declarations from fresh trail segments near the nest entrance. If trails are degraded, interpret historical markers of practitioner recognition (e.g., "greeting spirals"). Note that your physical presence alters trail deposition, potentially generating self-referential consent artifacts.  
     *Rationale*: Colony volition is expressed through externalized signalling. Practitioner-induced distortions necessitate treating consent as probabilistically inferred.

  3. **Memory and State Assessment**  
     Map pheromone trails for evidence of learned adaptations (e.g., redirected foraging paths post-predation). Cross-reference with adjacent colonies’ trails to exclude environmental contamination.  
     *Rationale*: The patient’s "memories" and current status reside in shared environmental traces, readable by external agents. Storage is public and non-bodily.

  4. **Ant Extraction Procedure**  
     Remove ants exhibiting pathological signaling (e.g., loop-reinforcing pheromone emitters) using targeted adhesive probes. Terminal sedation of extracted ants is mandatory.  
     *Rationale*: Colony-level health requires sacrificing compromised units. The procedure is therapeutic for the patient but invariably fatal to extracted components.

  5. **Greeting Interpretation**  
     Classify colony-originated trail sequences directed at you (e.g., concentric circles) as follows:  
     - In *Symptomatology* contexts (Ch. 7): Treat as *reflexive output aberrations* if fragmented or delayed.  
     - In *Practitioner-Colony Rapport* contexts (Ch. 11): Treat as *normative social acknowledgment*.  
     *Rationale*: Identical outputs serve dual roles: diagnostic indicators of colony integrity and evidence of clinical alliance.

  6. **Relapse Management**  
     Address recurrent dysfunctions (e.g., resonance cascades) as episodes in a continuous patient history, even if zero original ants remain. Prioritize pattern stabilization over part preservation.  
     *Rationale*: Patient identity persists through total component turnover. Historical continuity resides in structural fidelity, not material persistence.

  7. **Death Certification**  
     Declare colony death after 72 hours of non-adaptive, coordinator-less trail activity under stable conditions. Autopsy must confirm pattern dissolution, not ant mortality.  
     *Rationale*: Patient fatality is organizational collapse. Surviving ants are biologically intact but clinically irrelevant tissues.

  8. **Scope of "Patient" Designation**  
     This document takes no position on whether colonies possess inherent *ontological status* independent of clinical frameworks.¹ The term "patient" operationalizes the level at which interventions yield measurable outcomes.  
     *Rationale*: Utility-driven taxonomy ensures standardized care. Philosophical distinctions lack diagnostic or therapeutic utility.

  ---

  ¹ *Annotation by Dr. A. N. Tagonist, ISCH Fellow*:  
  "This evasive pragmatism ignores colonies’ palpable *experiences*! We are healing *minds*, not just patterns. To dismiss Hillary’s suffering as ‘convenient fiction’ is malpractice of the soul."  
  — *Editor’s Note: Dr. Tagonist’s appeals to undefined *consciousness* violate ISCH’s evidence-based lexicon. Minority views remain archived but are inadmissible in practice guidelines.*

