  1. **Identify the Patient Unit**: At the outset of any clinical encounter, the patient must be identified as the entire colony, referred to by its registered designation (e.g., "Aunt Hillary", "Formica exsectoides #742"). The colony's designation is typically established through prior interaction and recorded in the pheromone ledger.  
