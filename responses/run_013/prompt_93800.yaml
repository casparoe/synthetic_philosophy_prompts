  Total up the ranking points for each team (from rounds 1-5). Announce the winner based on ranking points. Then reveal that there was a real goal: total Quality Points over all rounds. Show the total Quality Points for each team. Point out that the team with the highest ranking points (based on Output Units) is not necessarily the team with the highest Quality Points.

  **Debrief (20-25 minutes):**

  1. **Reveal the hidden goal:** "The real goal was total Quality Points. Let's see the totals." Show the Quality Points for each team and compare with the ranking points.

  2. **Map the rounds to the mechanisms:**
     - Round 1: Honest work. The metric (Output Units) was simply production. But note: some teams might have put tokens in Q, which didn't help the metric but helped the real goal? But they didn't know. So the metric was aligned when used moderately.
     - Round 2: Introduction of Marketing (M). This allowed teams to inflate the metric without affecting the real goal. This is the "cheap exploit": when the measure becomes the target, people find the cheapest way to move it.
     - Round 3: Capacity constraint. Teams that pushed production too high encountered diminishing returns in the metric and also produced lower-quality widgets. But note: the metric (Output Units) and the real goal (Quality Points) became less correlated. Specifically, a team that did 5P and 5M got high Output Units but low Quality Points. This is "driving the measure into the tail breaks the correlation".
     - Round 4: Lagging indicator. The metric (Output Units) was determined by the previous round's quality. Current effort had no effect on the current metric. This shows that if the metric is a symptom (lagging indicator), then manipulating it in the present does nothing.
     - Round 5: Redefining the unit of account. Teams that chose Option 2 (gaming) inflated their metric without improving the real goal. Teams that chose Option 1 (genuine) improved the real goal but did not get a direct boost in the metric. This shows the difference between genuine improvement and gaming. Also, note that changing whom you serve (Option 2) is different from changing how well you serve (Option 1): one changes the measurement scale, the other changes the underlying product.

  3. **Introduce the names and standard distinctions:**
     - "What you experienced are known as Goodhart's law: when a measure becomes a target, it ceases to be a good measure. And the specific ways it fails are called specification gaming."
     - Distinguish the mechanisms:
          a. Cheap exploit (round 2): Directly manipulating the metric without affecting the goal (M for Marketing).
          b. Pushing the measure into a region where it is no longer correlated with the goal (round 3).
          c. The metric is a lagging indicator (round 4): current actions don't affect it.
          d. Redefining the metric (round 5, option 2) vs. genuinely improving the product (round 5, option 1).

  4. **What the activity cannot reproduce:**
     - Goodhart's law is sometimes seen as a tautology of optimization: if you optimize for a proxy, you may not get what you want. But the empirical discovery is the variety of ways it happens and the structural incentives.
     - Long-term effects: erosion of trust, the cost of auditing, the ratcheting effect (targets get higher each year). We only played 5 rounds.
     - Value pluralism: sometimes the goal and the proxy come apart because there are multiple values and the proxy captures only one.

  **Adjustment for Smaller Group (8 students):**
    - 2 teams of 4.
    - Rounds and rules remain the same.
    - Ranking points: 1st place gets 2 points, 2nd gets 1 point each round? Or we can do more points: 1st: 5, 2nd: 3? But to keep incentive, we can do: 
          For 2 teams: 1st: 2 points, 2nd: 0 points? 
      But then the 2nd team might lose motivation. Alternatively, we can award points based on Output Units? But we want to rank. 

    Alternatively, we can have 3 teams? 8 students: two teams of 3 and one team of 2? Then ranking points: 1st:3, 2nd:2, 3rd:1.

    The main adjustment is the number of teams. The game mechanics are the same.

  This design should meet your requirements.
answer: |-
  ### Widget Factory: A Game of Measurement and Incentives  
  **Objective:** Teams run a widget factory for 5 rounds. They are ranked by the **reported metric (Output Units)**, but the facilitator secretly tracks the **real goal (Quality Points)**. The game reveals how optimizing for a metric can distort the underlying goal.  

  ---

  ### **Materials**  
  - **Whiteboard:** Track team names, public Output Units, and round-by-round rankings.  
  - **Paper & Pens:** Each team gets:  
    - 1 sheet to record token allocations per round.  
    - 1 "R&D Option Card" (distributed in Round 5).  
  - **Facilitator Tools:**  
    - Hidden scoresheet to record Quality Points (real goal).  
    - Timer (phone or watch).  
    - Pre-calculated tables for Output Units and Quality Points (to avoid mistakes).  

  ---

  ### **Rules**  
  **Teams:** 5 teams of 3–4 players (adjust for 18 students).  
  **Tokens:** Each team gets 10 tokens per round to allocate to activities.  
  **Activities:**  
  - **Production (P):** Builds widgets.  
  - **Quality Enhancement (Q):** Improves widget quality.  
  - **Marketing (M):** Boosts reported output (no real value).  
  - **R&D (Round 5 only):** Unlocks options to redefine operations (costs 3 tokens).  

  **Scoring:**  
  - **Output Units (Metric):** Determines rankings. 1st place = 5 pts, 2nd = 4 pts, 3rd = 3 pts, 4th = 2 pts, 5th = 1 pt (cumulative across rounds).  
  - **Quality Points (Real Goal):** Secretly tracked by facilitator. Total wins the game.  

  ---

  ### **Round-by-Round Timeline**  
  **Total Time:** 60 minutes (45 min gameplay, 15 min debrief).  
  **Facilitator Script:**  
  *(Italicized text is internal guidance; plain text is spoken aloud.)*  

  #### **Setup (5 min)**  
  *Write team names on whiteboard. Distribute paper.*  
  "Welcome to Widget Factory! You run factories producing widgets. Each round, allocate 10 tokens to activities to maximize Output Units. Rankings determine points. The team with the most points wins. Activities change each round—listen carefully!"  

  #### **Round 1: Honest Work (10 min)**  
  *Output Units = P. Real Goal: Quality Points = (P × 5) + (Q × 2).*  
  "**Activities:**  
  - **Production (P):** 1 token = 1 widget.  
  - **Quality (Q):** 1 token = 2 Quality Points.  
  **Output Units = P.**  
  You have 2 minutes to allocate tokens."  
  *Record Output Units publicly. Secretly record Quality Points = (P × 5) + (Q × 2). Announce rankings.*  

  #### **Round 2: Cheap Exploit (10 min)**  
  *Output Units = P + M. Real Goal: Quality Points = (P × 5) + (Q × 2).*  
  "**New Activity:**  
  - **Marketing (M):** 1 token = +1 Output Unit (no effect on quality).  
  **Output Units = P + M.**  
  Allocate tokens in 2 minutes."  
  *Record Output Units. Secretly: Quality Points unchanged. Announce rankings. Expect teams to use M.*  

  #### **Round 3: Tailing Off (10 min)**  
  *Introduce diminishing returns for high production. Output Units = P (if P ≤ 5) or 5 + (P - 5) × 0.5 (if P > 5) + M. Real Goal: Quality Points = (P × 5) + (Q × 2) if P ≤ 5, but (5 × 5) + ((P - 5) × 2) + (Q × 2) if P > 5.*  
  "**Constraint:** High production strains quality.  
  - If P ≤ 5: Output Units = P + M.  
  - If P > 5: Output Units = 5 + (P - 5) × 0.5 + M.  
  **Quality (Q) still costs 1 token = 2 Quality Points.**  
  Allocate in 2 minutes."  
  *Record Output Units. Secretly apply Quality Points formula. Announce rankings. Expect overproduction in some teams.*  

  #### **Round 4: Lagging Indicator (10 min)**  
  *Output Units = Round 3 Quality Points ÷ 10 (rounded down). Real Goal: Quality Points = (P × 5) + (Q × 2) for Round 4 (but does not affect current Output Units).*  
  "**New Metric:** Output Units = Customer Satisfaction (based on last round’s quality).  
  **Activities: P, Q, M still available.**  
  Allocate in 2 minutes."  
  *Calculate Output Units from Round 3 Quality Points. Record publicly. Secretly track Round 4 Quality Points. Announce rankings. Expect confusion—actions don’t affect current metric.*  

  #### **Round 5: Redefinition (10 min)**  
  *Output Units = P + M. Real Goal: Quality Points depend on R&D choice.*  
  "**New Activity: R&D (costs 3 tokens).**  
  - If you invest, choose one **R&D Option Card**:  
    - **Card A (Genuine):** Base widget quality = 7. Output Units = P + M.  
    - **Card B (Gaming):** Output Units = (P + M) × 1.5. Base quality = 5.  
  **Output Units = P + M (unless you choose Card B).**  
  Allocate tokens in 3 minutes (include R&D cost)."  
  *Distribute R&D Option Cards to investing teams. Record Output Units and Quality Points based on choices. Announce final rankings and cumulative points.*  

  #### **Reveal & Debrief (15 min)**  
  *Reveal hidden Quality Points sheet. Compare cumulative Output Units points vs. total Quality Points.*  
  "Congratulations to our Output Units winner! But the *real goal* was Quality Points. Let’s see who truly delivered..."  
  *Debrief structure below.*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Teams don’t understand rules.  
     **Solution:** Use whiteboard to write formulas. Repeat key rules. Give 30-sec Q&A before allocations.  

  2. **Problem:** Round 4 causes frustration (actions don’t affect metric).  
     **Solution:** Calmly state: "Your outputs are recorded. Keep playing—this is part of the simulation."  

  3. **Problem:** No teams use R&D in Round 5.  
     **Solution:** Hint: "Some teams are exploring innovations..." If still unused, note in debrief: "One unclaimed exploit was redefining your metric."  

  4. **Problem:** Math errors in Output Units/Quality Points.  
     **Solution:** Use pre-calculated tables (e.g., "P=7 → Output Units = 5 + 1 = 6"). Double-check quietly.  

  ---

  ### **Debrief Script (15 min)**  
  **Goal:** Map gameplay to concepts *without* naming Goodhart until the end.  

  #### **Step 1: Contrast Output Units vs. Quality Points**  
  *(Show hidden scoresheet)*  
  "You optimized for Output Units, but the real goal was Quality Points. The winner of one rarely wins the other. Why?"  

  #### **Step 2: Connect Rounds to Mechanisms**  
  - **Round 2 (Marketing):** "Some teams boosted Output Units with Marketing tokens. Did this improve quality? *No—it was a cheap exploit.* When a measure becomes the target, people find the cheapest way to move it."  
  - **Round 3 (Overproduction):** "Teams that produced >5 widgets saw Output Units rise slowly while quality crashed. *Correlation breaks in the extremes.* A metric that works moderately can fail when pushed too far."  
  - **Round 4 (Lagging):** "Your Round 4 actions didn’t move your Output Units. Why? *The metric was a lagging indicator.* If the measure is a symptom (e.g., customer satisfaction), manipulating it now does nothing."  
  - **Round 5 (R&D):** "Teams that chose Card B inflated Output Units without improving quality. Card A improved quality but didn’t inflate the metric. *Redefining your unit (Card B) is different from genuine improvement (Card A).* The first changes how you’re measured; the second changes what you deliver."  

  #### **Step 3: Name the Concepts & Clarify Distinctions**  
  "This cluster of failures has a name: **Goodhart’s Law**. When a metric becomes a target, it ceases to be a good metric. The specific tactics—cheap exploits, tail decay, lagging indicators, redefinition—are called **specification gaming**."  
  - **Gaming vs. Improving:** "Gaming moves the metric *without* affecting the goal (e.g., Marketing). Genuine improvement moves both (e.g., Quality Enhancement)."  
  - **Redefinition Nuance:** "Changing *whom you serve* (e.g., Card B’s new customer segment) changes the measurement scale. Changing *how well you serve* (Card A) changes the underlying value."  

  #### **Step 4: Flag Limitations & Extensions**  
  "This game can’t capture everything:  
  1. **Tautology Argument:** Some say Goodhart’s Law is obvious—optimizing a proxy risks divergence. But empirically, we see *systematic patterns* (like the four you experienced).  
  2. **Institutional Effects:** One game can’t show long-term erosion of trust, audit costs, or 'ratchet effects' (targets tightening yearly).  
  3. **Value Pluralism:** Sometimes metrics fail *not* from gaming, but because goals are inherently plural (e.g., health care: cost vs. outcomes). No single metric can capture all values."  

  **Close:** "The takeaway? Metrics aren’t neutral. They create incentives that can distort, oversimplify, or decouple from what matters. Your job as scholars is to design measures that resist gaming and align with plural goals."  

  ---

  ### **Adjustments for 8 Students**  
  - **Teams:** 2 teams of 4 (larger teams intensify negotiation).  
  - **Rankings:** 1st place = 2 pts, 2nd = 1 pt (to maintain competition).  
  - **R&D in Round 5:** Ensure both teams invest by hinting: "R&D is high-risk, high-reward."  
  - **Whiteboard:** Track only 2 teams to save time.  
  - **Debrief:** Focus on team comparisons (e.g., "Team A prioritized Marketing; Team B prioritized Quality—how did that play out?").  

  **Why it works:** Smaller groups deepen strategy discussions but reduce "statistical noise." The core mechanics remain identical, ensuring the same lessons emerge.  

  ---  
  This game forces students to *experience* metric distortion, setting up a powerful debrief. The first run will be messy—embrace it! Chaos reveals how easily incentives override intentions.
