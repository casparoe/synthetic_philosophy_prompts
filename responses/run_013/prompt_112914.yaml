prompt: |-
  I'm a novelist, about 60k words into a draft, and I keep hitting the same wall in revision: a character does something in chapter 12 that I swear is "in character," but my editor says it comes out of nowhere, and honestly I can't always tell who's right. I've been reading about Dennett's real patterns and the three stances -- physical, design, intentional -- and I want a procedure I can actually run on a scene to decide whether a bit of behavior is a real pattern in the character or whether I'm just projecting a pattern onto noise. My rough thought is that a pattern is real when it's cheaper to describe what the character does by naming the trait than by listing all the exceptions, but I don't know how to turn that into something I can do at my desk. So give me the procedure: the questions to ask in order, what counts as a load-bearing pattern versus a decorative one (a trait I've named but that isn't actually doing any compressing), when the honest verdict is "this is the design stance, I rigged it to get where I wanted," and the point where the procedure has to stop and hand it back to me as a judgment call. I need to run it in maybe twenty minutes on a scene, before I show it to my editor, and I've got no philosophy training so keep the jargon survivable. Then run it on three cases: (a) a lifelong miser refuses to lend money -- I'm pretty sure that one's fine; (b) a scene where my cynical narrator suddenly does something generous, and I want to keep it; (c) a character whose "trait" is really just me needing the plot to move. Be honest about the one where the procedure tells me to cut the scene I love, and tell me what the procedure definately can't do.
reasoning: |-
  Okay, the user is a novelist struggling with character consistency. They're 60k words into a draft and keep hitting a wall where their editor says a character's action in chapter 12 comes out of nowhere, but the author feels it's in character. They've been reading about Dennett's real patterns and the three stances (physical, design, intentional) and want a practical procedure to determine if a behavior is a genuine character trait or just the author projecting.

  The user needs a step-by-step method they can apply in about 20 minutes per scene. They want clear questions to ask, ways to distinguish load-bearing traits from decorative ones, how to recognize when they're forcing the plot, and when the decision ultimately becomes a judgment call. They also want this tested on three specific cases.

  I'll break this down into a procedure with distinct steps. The core idea is that a real pattern exists when describing a character with a trait is more efficient than listing all exceptions. For the procedure, I need to make it actionable with specific questions the author can ask while reviewing a scene.

  First, I'll outline the key components of the procedure:
  - Step 1: Identify the specific behavior in question
  - Step 2: Look for previous evidence (intentional stance)
  - Step 3: Check the foundation (design stance)
  - Step 4: Check for coherence (physical stance)
  - Step 5: Calculate the compression cost
  - Step 6: Make the final call

  For the three test cases:
  - Case A (miser refusing loan): Should clearly pass as a real pattern
  - Case B (cynic acting generous): Needs careful analysis - might be valid if properly set up
  - Case C (plot-forced trait): Should fail the test

  I'll be honest in Case B that if the procedure recommends cutting the scene, the author might need to either strengthen setup or accept it as a deliberate character-breaking moment. I'll also clarify what the procedure can't do - like judging artistic merit or subtle foreshadowing.

  The language should stay jargon-free but still capture Dennett's concepts. I'll use terms like "character logic" instead of "intentional stance" where possible. The focus is practicality - something the novelist can use at their desk with a timer running.

  For the compression test, I'll suggest a simple tally system: count how many previous actions support the trait versus how many exceptions exist. If supporting actions significantly outnumber exceptions, it's likely a real pattern.

  Finally, I'll emphasize that this is a diagnostic tool, not a replacement for creative judgment. The procedure flags potential issues but the author makes the final call based on their vision for the story.
answer: |-
  Here's a battle-tested procedure based on Dennett's core idea: **A trait is a "real pattern" if it genuinely *compresses* your character's behavior – meaning it saves you (and the reader) from having to list every single action individually.** Think of it like a ZIP file for personality. If the "trait" file is bigger than the raw data (all the actions), it's noise, not pattern.

  **The 20-Minute Character Compression Test (CCT)**

  **Goal:** Decide if a specific behavior (Action X) in Chapter 12 is a predictable expression of a *real* character pattern or feels "out of nowhere."

  **Materials:** Your manuscript, a notepad, a timer.

  **Procedure:**

  1.  **Isolate Action X (2 mins):**
      *   Write down the specific behavior in question (e.g., "Cynic buys coffee for homeless person," "Plot-Pusher reveals secret diary").
      *   Jot down the immediate *stated or implied motive* within the scene (e.g., "felt pity," "wanted to shut them up").

  2.  **Identify the Claimed Trait (1 min):**
      *   What character trait do *you* believe explains Action X? (e.g., "Secretly generous," "Impulsive," "Manipulative"). Be specific. Write it down.

  3.  **The Intentional Stance Scan (The "Would They?" Test) (8 mins):**
      *   **Question 1: What's the Evidence FOR this Trait?** Scan Chapters 1-11. List *every specific instance* where the character displayed behavior *consistent* with the Claimed Trait *in a similar context* (e.g., for "secretly generous": small anonymous acts, reluctance followed by giving, defending the weak when no one sees). Don't list vague feelings; list concrete actions or clear internal thoughts.
      *   **Question 2: What's the Evidence AGAINST?** List *every specific instance* where the character displayed behavior *contrary* to the Claimed Trait in a similar context (e.g., cynical refusing help, mocking generosity, acting selfishly).
      *   **Tally:** Count the FOR and AGAINST instances. Note the *weight* – was a "FOR" instance a major plot point or a tiny gesture? Was an "AGAINST" instance core to their identity?

  4.  **The Design Stance Check (The "Could They?" Test) (5 mins):**
      *   **Question 3: What's the Foundation?** Ignoring *this specific book*, what core, well-established traits form this character's psychological bedrock? (e.g., for the cynic: distrustful, self-preserving, wounded, observant, maybe darkly humorous). Are these bedrock traits listed *and demonstrated* earlier?
      *   **Question 4: Does Action X LOGICALLY build from this Foundation under THIS pressure?** Given the bedrock traits and the *specific pressures* of this scene (what just happened? what are the stakes *for them*?), is Action X a plausible, even if surprising, *outgrowth*? (e.g., "Cynic sees vulnerability in homeless person that mirrors their own past wound, triggering a rare impulse of connection born from self-recognition, not pure altruism"). If the foundation is weak or the logic feels forced ("because the plot needs it"), this fails.
      *   **Question 5: Is this a Load-Bearing Trait or Decorative?**
          *   **Load-Bearing:** The trait actively shapes multiple decisions, conflicts, relationships, and the plot *beyond this one scene*. Removing it would collapse significant parts of the story. (e.g., a detective's obsessive nature driving the investigation *and* destroying their marriage).
          *   **Decorative:** It's a named quirk or habit mentioned occasionally but doesn't fundamentally impact choices, conflicts, or plot progression. It's descriptive flavor, not structural support. (e.g., "always wears mismatched socks" – cute, but unless it *matters*, it doesn't compress behavior meaningfully).

  5.  **The Physical Stance Sanity Check (The "Would ANYONE?" Test) (2 mins):**
      *   **Question 6: Is it Humanly Plausible?** Forget character for a second. Given the immediate circumstances (exhaustion, danger, emotion, information available), is Action X something a real human *could* conceivably do, even if unlikely? (This catches truly bizarre, physics-defying, or info-impossible actions). Usually passes, but worth a quick check.

  6.  **The Compression Calculation & Verdict (2 mins):**
      *   Look at your lists from Step 3 (FOR vs. AGAINST) and your analysis from Step 4 (Foundation & Logic).
      *   **The Test:** Does explaining Action X by invoking the **Claimed Trait** feel *cheaper* (more efficient, more predictive) than listing all the FOR instances *plus* having to make a special exception for Action X itself? Or does it feel like Action X *is* the exception, making the trait description *more* cumbersome?
      *   **Verdict Options:**
          *   **Real Pattern (Compresses):** Strong FOR evidence + Clear link to Bedrock Foundation + Logical under pressure + Load-Bearing potential. Action X feels like a natural, if surprising, data point *within* the pattern. *Keep it, maybe tweak internal monologue to subtly highlight the bedrock link.*
          *   **Design Stance (You Rigged It):** Weak FOR evidence + Foundation link feels forced/stretched + Action X primarily serves Plot Need + "Could They?" feels shaky. It's authorial fiat. *Needs revision: Strengthen foundation (foreshadowing), adjust motive to better fit bedrock, or change the action.*
          *   **Noise (Projection):** Significant AGAINST evidence + Contradicts Bedrock Foundation + Feels jarringly out of place + Decorative trait at best. The "trait" is just a label you stuck on noise. *Cut Action X or radically change it to fit established patterns.*
          *   **Borderline (Judgment Call):** Some FOR evidence, but not overwhelming + Plausible but not inevitable link to Foundation + Humanly plausible. **This is where the procedure stops and hands it back to you.** Does this action *earn* its surprise by revealing a hidden dimension that *enhances* the character? Or does it just feel random? Trust your gut *after* this analysis.

  **Running the Cases:**

  *   **Case A: Lifelong Miser Refuses to Lend Money**
      *   **CCT Verdict: Real Pattern (Compresses).**
      *   *Why:* FOR Evidence will be overwhelming (countless instances of hoarding, cheapness, anxiety about loss). AGAINST Evidence likely minimal/nonexistent. Bedrock Foundation (fear of poverty, mistrust, possessiveness) is solid. Action X *exactly* fits the pattern. Compression is high – saying "He's a miser" predicts this refusal perfectly. Load-Bearing (drives conflict, relationships).

  *   **Case B: Cynical Narrator Does Something Generous (You want to keep it)**
      *   **CCT Verdict: Likely BORDERLINE (Judgment Call) or DESIGN STANCE (Needs Work).** Be brutally honest.
      *   *Why:* FOR Evidence? How many *truly* generous acts (especially anonymous/selfless ones) exist before Ch12? If few/none, FOR is weak. AGAINST Evidence? Cynicism usually involves mocking generosity – likely strong counter-examples. Bedrock Foundation? Cynicism (distrust, self-interest) is strong, generosity is weak. Does Action X *logically* build from bedrock? ("Mirrored vulnerability" works; "sudden attack of niceness" doesn't). Compression? If FOR is weak, invoking "secretly generous" feels *more* complex than just listing the one generous act as an exception to their cynicism. **The Verdict:** The procedure likely flags this as needing support. You *can* keep it if:
          1.  You find/foreshadow subtle FOR evidence (e.g., they *notice* suffering but hide it, they help stray animals, they feel guilt they suppress).
          2.  You anchor the motive DEEPLY in their bedrock (vulnerability, calculated move, exhaustion breaking down defenses, protecting someone who represents their past self).
          3.  You accept it's a major, defining *shift* and ensure the rest of the book deals with the consequences (making it Load-Bearing). Otherwise, the procedure says it probably feels unearned.

  *   **Case C: Character Whose "Trait" is Plot Convenience (e.g., "Impulsive" just to trigger a fight)**
      *   **CCT Verdict: Noise or Design Stance (Rigged) - Needs Revision/Cut.**
      *   *Why:* FOR Evidence? Scattered "impulsive" moments, but only when the plot needs drama? Inconsistent otherwise? AGAINST Evidence? Probably shows caution or calculation in other key moments. Bedrock Foundation? "Impulsive" likely isn't core; maybe they're actually cautious or strategic. Logic under pressure? Feels forced – the fight happens because you need it, not because it's the inevitable outcome of *this* character under *this* pressure. Compression? Invoking "impulsive" doesn't predict much else reliably; it's just a label for plot-convenient moments. It's Decorative at best, actively contradictory Noise at worst. **Action:** Either cut the action, find a motive rooted in their *actual* bedrock traits (e.g., "calculatingly picks a fight to distract"), or go back and *build* impulsiveness as a real Load-Bearing trait consistently.

  **What the Procedure CAN'T Do:**

  1.  **Judge Pure Artistic Merit:** It can't tell you if a surprising-but-supported action is *brilliant* or just *okay*. It only checks for internal logic/compression.
  2.  **Replace Theme or Emotional Resonance:** An action might be borderline on compression but thematically perfect or emotionally devastating. The procedure flags potential logic issues, not artistic value.
  3.  **Handle Extreme Subtlety/Foreshadowing:** If your "FOR" evidence is incredibly subtle (a single, easily missed glance), the procedure might underestimate it. You have to weigh the subtlety.
  4.  **Decide Between Valid Interpretations:** Sometimes an action could stem from multiple bedrock traits. The procedure helps see *if* it fits, not *which* fit is best (though it helps narrow it down).
  5.  **Fix Weak Bedrock:** If the character's core foundation isn't well-established *before* Chapter 12, the whole procedure wobbles. It relies on prior setup.

  **The Takeaway:** This procedure forces you to audit the *evidence* for a character's behavior against the *claimed* pattern. It shines a light on authorial fiat (Design Stance) and highlights where you might be projecting (Noise). When it hands you a **Borderline/Judgment Call** (as it likely will for Case B), you've done the work to make an *informed* creative decision, not just a defensive one. You'll know *why* your editor might object and can choose to strengthen the foundation, accept it as a deliberate (and earned) rupture, or revise. It turns an amorphous feeling into a concrete analysis. Good luck with Chapter 12!
