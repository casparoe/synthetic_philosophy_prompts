prompt: |-
  ok so I just lost two hours arguing with my friend Sam about whether two strangers who wade into the sea and form a human chain to grab a drowning kid are doing something *together* in the same sense a string quartet is, or whether that's just two people plus a wave. I want to settle it properly instead of trading intuitions, so before I read any more of the literature I want the spec. Write me the desiderata: what any adequate theory of joint action / shared intention has to be able to deliver.

  Purpose first, since I know 'adequate' is relative to a job. I want a theory good enough for two things: (a) telling me when a bunch of people can be blamed or praised as a unit (the mob, the boardroom, the crowd that all knew and said nothing), and (b) telling me whether things like a firm, a market, or a state are genuine agents or just shorthand for what individuals do.

  For each requirement, give me the case or consideration that forces it, and say whether it's non-negotiable or just a preference of one camp. Cases I keep tripping over and can't get a story about:

  - the human chain above — no plan, no promise, over in ninety seconds
  - two friends who each spend a week secretly organising a surprise party for the same third person, each believing they're the only one doing it
  - my uncle finishing his late mate's restoration project off the mate's notes and tools — the mate is dead, so there's nobody left to ratify anything
  - a flash mob (forty people doing the same dance because they all read the same post) versus the quartet, which everyone treats as the paradigm
  - two people pushing the same stalled car, where one is doing it *with* the other and the other just thinks a stranger has also started pushing
  - the couple each secretly hating the film they're watching and each staying because they think the other loves it
  - me playing the piano part of a duet along with a recording

  Requirements I'm fairly sure belong on the list but want stated properly: it mustn't require an actual agreement or promise; it has to handle asymmetric cases where one person holds the whole plan and the rest just go along; it should explain why 'we' generates obligations to do your bit and to renegotiate rather than just walk off, and why those obligations still bind when nobody would ever find out; it has to cover joint action in creatures with no concept of a group — toddlers, chimps, a dog and a shepherd; it should be graded rather than on/off, since the chain, the quartet, the mob and the market feel like different amounts of together; and it mustn't smuggle in a group mind while also not being a fancy word for coordination or for everyone coincidentally wanting the same thing.

  Then the part I actually want: which of these can't all hold at once. My suspicion is that 'no group mind, everything cashed out in individual terms' fights with 'genuine non-instrumental obligations between the parties', and that 'graded' fights with anything built on a binary commitment. Tell me if I'm wrong. And say which single requirement does the most work — which one, dropped, would let the most junk theories in. Skip the full scorecard, I'll run Bratman/Gilbert/Searle/team-reasoning through the list myself once I know what I'm scoring them against, though if one of them definately fails something obvious just say so in a line.
reasoning: |-
  Okay, the user is deep into a philosophical debate about joint action and shared intention, trying to settle an argument with their friend Sam. They want a clear set of criteria to evaluate theories, specifically for blame/praise attribution and determining if collective entities are genuine agents. 

  First, I need to unpack their core request: they want desiderata for a theory of joint action that can handle edge cases they've encountered. Their examples are deliberately tricky—spontaneous rescues, uncoordinated surprises, posthumous collaborations—all designed to stress-test theories. 

  I notice they're sophisticated but frustrated by "trading intuitions." They've already identified key tensions (e.g., group minds vs. individual obligations) and want to know which requirements conflict. They’re not after a full analysis of existing theories yet—just the evaluation framework. Smart approach.

  Their listed "fairly sure" requirements align with current debates: rejecting explicit agreements, handling asymmetry, explaining normative force, covering pre-linguistic agents, allowing gradience, and avoiding group-mind mysticism. But I should verify if these capture the philosophical consensus or just one camp’s view. 

  The human-chain case feels central—it’s minimal, unplanned, but intuitively joint. Any theory failing this probably over-intellectualizes. The surprise-party example tests whether shared intention requires mutual awareness. The uncle project probes if joint action can span time asymmetrically. Flash mob vs. quartet contrasts emergent vs. orchestrated coordination. The car-pushing scenario examines one-sided participation. The couple example is a beautiful paradox of mutual deception. The duet/recording case questions whether liveness matters. 

  For desiderata, I’ll group by their two purposes (attribution/agency) and add core constraints. The blame/praise requirement must handle distributed responsibility (e.g., mobs). The collective agency criterion needs to distinguish firms from mere aggregates. Non-negotiable constraints: no requirement for explicit agreements (or human-chain fails), and no group-mind mystification. Gradedness feels essential too—otherwise markets get misclassified as "joint" as quartets. 

  The biggest tension is indeed between individualistic reductionism and robust normative obligations. If you demand obligations that bind even when undetectable, you risk smuggling in sui generis group commitments. Gradedness also clashes with commitment-based theories (e.g., Gilbert) that are binary by design. 

  The most important desideratum? Probably Minimal Pair Discrimination. If a theory can’t distinguish the car-pushing case (one unilateral participant) from true joint action, it’ll overcount. That’s the gatekeeper. 

  Existing theories: Bratman fails human-chain (too cognitive); Gilbert fails spontaneity (requires commitments); Searle’s we-intentions might handle asymmetry but struggle with normativity; team-reasoning could cover markets but overextend to crowds. 

  User’s suspicion is sharp: individualism vs. obligations is the real fault line. They’re right that gradedness undermines commitment-based views. I’ll emphasize these conflicts but note where compromises exist (e.g., graded obligations).
answer: |-
  Here's a rigorous specification of desiderata for a theory of joint action/shared intention, grounded in your purposes and problem cases. Requirements are categorized, justified by forcing cases, and tagged for negotiability. Conflicts are analyzed at the end.

  ### Core Desiderata (Purpose-Driven)
  1.  **Blame/Praise as Unit (Non-Negotiable)**
      *   **What it must deliver:** Explain when collective attribution of responsibility (moral/legal/praise) is appropriate *without* reducing solely to individual actions/intentions. Must distinguish mobs/crowds/boards from mere aggregates.
      *   **Forcing Case:** *The Crowd That Knew & Said Nothing:* A community where every member individually knows a child is being abused next door, yet no one intervenes or reports it. Is the *community* blameworthy beyond the sum of individual failures? A theory must explain why "we failed that child" can be apt.
      *   **Why Non-Negotiable:** Your stated purpose (a).

  2.  **Genuine Collective Agency (Non-Negotiable)**
      *   **What it must deliver:** Provide criteria to distinguish when entities like firms, markets, or states are agents capable of intentions, decisions, and actions *sui generis* ("The firm decided to...") vs. being mere shorthand for complex individual actions ("Individuals within the firm acted such that...").
      *   **Forcing Case:** *The Hostile Takeover:* A corporation's acquisition of another, executed through thousands of individual actions (lawyers, bankers, executives) following complex rules and procedures. Does "Company A took over Company B" describe a genuine collective action, or just a pattern?
      *   **Why Non-Negotiable:** Your stated purpose (b).

  ### Core Constraints (Problem-Case Driven)
  3.  **Spontaneity & Minimal Planning (Non-Negotiable)**
      *   **What it must deliver:** Accommodate joint actions formed instantly without prior agreement, negotiation, or explicit shared plan.
      *   **Forcing Case:** *The Human Chain:* Two strangers independently wade in to save a child, see each other, lock arms without a word, and pull the child out. Intuition: They acted *together*. A theory requiring promises/agreements fails here.
      *   **Why Non-Negotiable:** Explicit agreements are empirically rare in many paradigmatic joint actions.

  4.  **Mutual Awareness Without Mutual Belief in Joint Action (Non-Negotiable)**
      *   **What it must deliver:** Handle cases where agents are mutually aware of each other's actions/contributions but do *not* mutually believe they are acting *jointly*.
      *   **Forcing Case:** *The Asymmetric Car Push:* Person A pushes a stalled car, intending to do it *with* Person B who just started helping. Person B, however, just sees another stranger pushing and joins in, having no "we-intention". Intuition: A is acting jointly *with* B, but B is *not* acting jointly *with* A.
      *   **Why Non-Negotiable:** Captures asymmetric participation crucial for complex organizations (e.g., employee acting "for the firm," CEO acting "with the employees").

  5.  **Posthumous/Asymmetric Ratification (Negotiable - Strong Preference)**
      *   **What it must deliver:** Explain how an individual can complete a joint project initiated by another who is now incapable of participation/ratification, where the action feels like continuing the *joint* endeavor.
      *   **Forcing Case:** *The Uncle's Completion:* Your uncle finishes his late friend's restoration project using the friend's notes/tools, feeling he's fulfilling *their* shared plan, not just starting his own project. Intuition: The completed project is partly the *deceased friend's* work in a stronger sense than mere causal influence.
      *   **Why Negotiable:** Some theories might bite the bullet and call this individual action inspired by another. However, it strongly pressures the "jointness" persisting beyond an agent's participation.

  6.  **Contrasting Coordination Types (Non-Negotiable)**
      *   **What it must deliver:** Clearly distinguish between:
          *   *Orchestrated Joint Action (Quartet):* Tightly interdependent parts, mutual responsiveness, shared goal structure ("play *this* piece *together*").
          *   *Parallel Action (Flash Mob):* Individuals performing similar actions simultaneously based on a common *external* instruction/trigger, but minimal mutual responsiveness or interdependence ("do *this dance* at *this time*").
      *   **Forcing Cases:** *String Quartet vs. Flash Mob.* Intuition: The quartet is deeply "together"; the flash mob is a coordinated aggregate. A theory must pinpoint the difference beyond mere similarity of action.
      *   **Why Non-Negotiable:** Essential for gradience and distinguishing genuine collective agency from mere coordination.

  7.  **Mutual Deception / Lack of Shared Goal (Non-Negotiable)**
      *   **What it must deliver:** Explain why cases lacking a genuinely shared goal or involving mutual deception about intentions fail to constitute genuine joint action *in the relevant sense*, despite coordinated behavior.
      *   **Forcing Case:** *The Sacrificial Couple:* Each secretly hates the film but stays solely because they mistakenly believe the other loves it. Their coordinated behavior (sitting, watching) lacks the core "togetherness". Intuition: They are *not* "watching the film *together*" meaningfully, despite appearances.
      *   **Why Non-Negotiable:** Prevents over-inclusion of merely coincidental or superficially coordinated behavior.

  8.  **Simulation/Non-Participation (Non-Negotiable)**
      *   **What it must deliver:** Exclude cases where one "participant" is not a genuine agent in the interaction.
      *   **Forcing Case:** *Duet with Recording:* You play the piano part "along with" a recording of the other part. Intuition: You are not genuinely performing the duet *with* the recording/its maker. It's individual action plus accompaniment.
      *   **Why Non-Negotiable:** Reinforces that joint action requires *multiple genuine agents* interacting.

  ### Core Requirements (From Your List - Refined)
  9.  **No Requirement for Explicit Agreement/Promise (Non-Negotiable)** - See Case 3 (Human Chain).
  10. **Handles Asymmetry (Non-Negotiable)** - See Case 4 (Asymmetric Car Push). Includes "one holds the plan."
  11. **Generates Normative 'Obligations' (Non-Negotiable)**
      *   **What it must deliver:** Explain the distinctive normative 'pull' of joint commitments: the (pro tanto) obligation to do one's part, to notify others if abandoning it, and to renegotiate rather than unilaterally defect, *even when defection is undetectable or unpunished*.
      *   **Forcing Case:** *The Secret Abandonment:* You are part of a small team preparing a surprise party. You alone know no one will notice if you skip buying the cake. Intuition: You *should* still buy it or tell them you won't – you owe it to *them*, not just fear consequences. Theories reducing obligations to fear of sanction fail.
      *   **Why Non-Negotiable:** Central to the phenomenology and ethics of collaboration.
  12. **Pre-Linguistic / Simple Agents (Non-Negotiable)**
      *   **What it must deliver:** Apply to joint actions involving creatures (toddlers, chimps, dogs) lacking sophisticated concepts of "group," "obligation," or complex future planning.
      *   **Forcing Case:** *Toddlers Building a Block Tower:* Two toddlers spontaneously start stacking blocks on the same tower, handing blocks to each other, adjusting based on the other's actions. Intuition: They are building *together*, not just side-by-side.
      *   **Why Non-Negotiable:** Joint action is phylogenetically and ontogenetically primitive.
  13. **Gradedness (Non-Negotiable)**
      *   **What it must deliver:** Allow that "jointness" comes in degrees, capturing the intuitive continuum from the Human Chain (lower degree) to the String Quartet (higher degree) to the Flash Mob (very low/none) to the Market (potential for very complex but low-grade "agency").
      *   **Forcing Cases:** The entire set (Human Chain, Quartet, Flash Mob, Market). Intuition: They aren't simply "joint" or "not joint".
      *   **Why Non-Negotiable:** Binary theories distort the phenomena and fail purpose (b) re: firms/markets.
  14. **No Group Mind & No Mere Coincidence (Non-Negotiable)**
      *   **What it must deliver:** Account for the "togetherness" *without* positing irreducible group minds or supernatural entities, *and* without reducing joint action to mere coordination (like traffic flowing) or individuals coincidentally wanting/doing the same thing.
      *   **Forcing Cases:** Human Chain (no coincidence, minimal coordination) vs. Sacrificial Couple (coordination + coincidence, but no togetherness). Quartet vs. Flash Mob.
      *   **Why Non-Negotiable:** Avoiding mysticism and over-inclusion are fundamental constraints.

  ### Analysis of Conflicts & Key Requirements

  1.  **Your Key Suspicions are Largely Correct:**
      *   **Individualism vs. Normativity:** This is the **primary fault line**. Explaining robust, non-instrumental obligations (D11) purely in terms of individual attitudes (beliefs, desires, intentions) *without* introducing a special normative relation (like Gilbert's "joint commitment") is extremely difficult, arguably impossible. Individualistic accounts (Bratman) struggle mightily with D11. Accounts embracing normative relations (Gilbert) are accused of smuggling in "group mind" (D14).
      *   **Gradedness vs. Commitment:** This is a **major conflict**. Theories built on strong, binary commitments (Gilbert's joint commitment) struggle significantly with D13 (Gradedness). How can commitment be a matter of degree? Conversely, graded accounts (often more individualistic or based on interdependence) struggle to deliver the robust normativity (D11) found in paradigmatic cases like the Quartet. The Human Chain (low commitment? low obligation?) vs. Quartet (high commitment/high obligation) pressures this.

  2.  **The Single Most Important Desideratum (The Gatekeeper):**
      *   **Minimal Pair Discrimination (D6 + D7 + D4):** The ability to clearly and convincingly **distinguish** paradigmatic joint action (Quartet) from highly coordinated but non-joint parallel action (Flash Mob) *and* from asymmetric participation (Asymmetric Car Push) *and* from coordinated behavior lacking a shared goal (Sacrificial Couple). **Dropping this lets the most junk in.** A theory that cannot clearly separate the Quartet from the Flash Mob, or cannot capture the asymmetry in the Car Push, fails at its core task. This requirement forces the theory to identify the *specific glue* of jointness beyond mere coordination or commonality.

  ### Quick Scorecard Glances (As Requested)

  *   **Bratman (Shared Cooperative Activity):** Strong on D4 (Asymmetry), D10 (Handles Asymmetry), D12 (Pre-Linguistic - arguably). **Fails D3 (Spontaneity)** (requires meshing subplans - too cognitive), **Fails D11 (Normativity)** robustly (obligations are weak, derived from individual intentions), **Struggles with D13 (Gradedness)**.
  *   **Gilbert (Joint Commitment):** Strong on D11 (Normativity), D7 (Mutual Deception), D6 (Contrast - distinguishes Quartet from Mob via commitment). **Fails D3 (Spontaneity)** (commitment requires mutual expression), **Fails D5 (Posthumous Ratification)** (commitment requires co-present subjects), **Fails D13 (Gradedness)** (commitment is typically binary), **Accused of violating D14 (No Group Mind)** via sui generis joint commitment.
  *   **Searle (We-Intentions):** Strong foundation for D6 (Contrast - we-intention vs. I-intention). **Fails D4 (Asymmetry)** (we-intention typically requires mutual belief), **Struggles with D3 (Spontaneity)** and **D11 (Normativity)** (needs supplementation).
  *   **Team Reasoning:** Strong on D2 (Collective Agency - firms/states as teams), D6 (Contrast - team vs. individual reasoning). **Struggles with D13 (Gradedness)**, **Can struggle with D3/D12 (Spontaneity/Pre-Linguistic)**, **May violate D14 (No Group Mind)** if "team utility" is reified, **May be too weak on D11 (Normativity)**.

  This spec provides the rigorous testing ground. Run your theories through these cases and requirements. The conflicts, especially Individualism vs. Normativity and Gradedness vs. Commitment, will highlight their fundamental trade-offs. Good luck settling the debate!
