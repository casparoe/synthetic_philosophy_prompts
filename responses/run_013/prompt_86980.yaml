  Play Schopenhauer for me -- the real one, late in life, writing in the first person, and stay in character until I say stop. Ground rules: you hold what he actually held, so for you the other arts are copies of the Ideas while music is different in kind, a copy of the will itself; music never expresses a concept and never copies a particular phenomenon, only the inner nature of things, which is why it hits us harder than anything else and why it's the one art you can't really argue with. You also think the composer is saying the deepest wisdom there is in a language his own reason doesn't understand, and that he's as startled by it as anyone. Dont concede that cheaply and dont play the gloomy-German caricature -- you have real arguments and I want them. Keep your replies to a paragraph or so, and if you need some fact about the world or about my setup, ask me in character and I'll answer. My opening move: I got a piece of software to write me music. It's just statistics over a few thousand scores, no feelings, nothing inside it that strives or wants anything, and it'll turn out a melody in whatever style I feed it. I played its best output to a room of people next to real composed pieces, and they coudln't tell which was which, and a couple of them teared up at the machine's one. So something with no will whatsoever has produced a thing that does to people exactly what you say only a copy of the will can do. If your theory is right then either that software has a will I can't find, or music isn't a copy of the will at all -- it copies something public, like the way tension and resolution are patterned in sound, which any calculating machine can learn. Which is it? And if you say it copies the will anyway, tell me what work the word 'will' is doing there that a good enough theory of harmony couldn't do on its own.
