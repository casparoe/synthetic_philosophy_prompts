prompt: |-
  I run the serious incident review process at a mid-sized hospital. Every case that meets the threshold gets a panel of three — me, a clinician from a different specialty than the one involved, and a senior ward nurse — and we have to file within 30 working days. The report goes to the board, gets read out to the family, and in the death cases may end up in front of the coroner. The part that eats all our time is omissions. Nobody pushed the drug, nobody called the doctor, nobody checked the interaction, nobody re-read the obs chart at 4am. And we keep having the same argument in different costumes about whether the thing nobody did actually caused the harm, or whether it's just where the story happens to be sad.

  So: write me a decision procedure the panel can actually run, in order, on the question of whether an omission caused the harm in a case. It has to be runnable by three tired clinicians who don't know any philosophy and have about ninety minutes. Questions in order, what counts as a good enough answer to each, where the procedure stops and returns a no, and where it stops and hands the question to a person because it's turned into a values question rather than a factual one.

  Some things I want built into it, because they're where I think we go wrong:

  The counterfactual is always underspecified. We say "if she'd escalated" and then everyone nods, but nobody says escalated to whom, how fast, and what that person would then have done. I want the procedure to force the alternative to be written out as a concrete scenario before anyone is allowed to vote on whether the omission made a difference, and to say what to do when the panel can't agree on what the alternative scenario even is.

  For omissions I don't think you can cleanly separate "did it make a difference" from "was it a failure", the way you can with a positive act. Whether a non-action even counts as a thing that was or wasn't done seems to depend on what the person's role required of them — the same silence is a failure in one nurse and not in another. I'd rather the procedure be upfront about that entanglement than pretend the causal question is neutral and the duty question comes later.

  Keep three things apart that our reports constantly mash together: whether the omission made a difference to this outcome; whether it's the kind of thing that generally makes outcomes worse (so it belongs in the report as a lesson even if it didn't change this one); and whether it was a breach of duty. I want the procedure to say which of the three each step is actually testing.

  The level of description problem. "She didn't escalate", "she didn't recognise the trend", and "she wasn't trained to recognise the trend" are three different omissions with three different answers, and panels slide between them depending on how the room feels. I want a rule for fixing the level of description before the test runs.

  Run it on these:

  1. A patient's early warning score climbed over six hours on nights and nobody escalated to the on-call doctor until the morning round. He arrested at 9am and died. Half the panel is certain the delay killed him. But the reviewing clinician thinks he had a ruptured aneurysm that was probably unsurvivable once the pain started, so the world where the call happens at 2am is a world where he gets reviewed, maybe scanned, possibly taken to theatre — and quite likely dies anyway, or dies on the table. I want to see what the procedure does here, including if the answer is that the delay isn't a cause and must not be listed as one. That answer will go down badly and I still want it if that's what the procedure gives.

  2. Two failures, each of which on its own would have been enough to prevent the harm. The pharmacist didn't flag the contraindicated dose; the prescriber didn't check the interaction though he normally always does. Undo either one and the patient is fine. The harm needs both. The but-for question gives a no for each of them separately, and we always end up writing "both contributed" and moving on. I want something better than that.

  3. The omission is by someone with no relevant duty: an agency nurse on her first shift, not rostered to that patient, no induction on our escalation policy, who saw the obs but said nothing. Does the procedure even get to ask whether she made a difference, or does it stop earlier?

  4. A quick one on the description problem — give me the same case run at two different levels of description and show me the answers coming apart.

  Then tell me what the procedure can't do: the questions it will keep punting to a human, which of those are genuinely value judgements versus just under-evidenced factual ones, and who should be in the room when we punt.
reasoning: |-
  We are designing a decision procedure for determining whether an omission caused harm in a serious incident review. The procedure must be runnable by a panel of three (manager, clinician from different specialty, senior ward nurse) in about 90 minutes. The procedure should address common pitfalls: underspecified counterfactuals, entanglement of causation and duty, conflation of three distinct concepts (causal effect in this case, general risk, breach of duty), and the level of description problem.

  The procedure will be structured as a series of ordered steps with clear stopping points. It will force the panel to specify a concrete counterfactual scenario and will separate the questions of causation, general risk, and duty.

  ### Key Principles
  1. **Causation Question**: We are asking: "But for the omission, would the harm (or a substantially similar harm) have been avoided?" We require a concrete counterfactual scenario that specifies what would have happened if the action had been taken.
  2. **General Risk**: Even if the omission did not cause harm in this case, it might be a practice that generally increases risk and should be flagged for learning.
  3. **Breach of Duty**: Whether the individual had a duty to act and failed in that duty. This is separate from causation.

  The procedure will focus on the causation question. The other two (general risk and breach of duty) are noted for the report but are not the primary focus of the causal inquiry.

  ### Procedure: "Causal Assessment for Omissions" (CAO)

  #### Step 0: Preconditions (5 minutes)
  - **Objective**: Ensure the omission is clearly defined and the panel agrees on the level of description.
  - **Rules**:
    - The omission must be described as: "Agent A did not perform action X at time T (or during period P)."
    - The panel must agree on the specific action X and the agent A. If there is disagreement, take a vote (majority rules) to fix the description. If the panel cannot agree, the procedure stops and the omission is noted as "ill-defined" and not assessed for causation (but may be included as a general risk if appropriate).
    - If the agent A had no duty to perform action X (by role, policy, or training), then stop. The omission is not a candidate for causation in this case. However, note it for general risk and system factors (e.g., why was an untrained agency nurse in that situation?).

  #### Step 1: Counterfactual Specification (20 minutes)
  - **Objective**: Develop a concrete, realistic scenario of what would have happened if the action had been taken.
  - **Rules**:
    - The panel must construct a timeline from the moment the action would have been taken, including:
      - What exactly would have been done (e.g., "escalated to the on-call doctor via phone call at 2am").
      - The expected response (e.g., "the on-call doctor would have arrived within 30 minutes").
      - The subsequent actions (e.g., "the doctor would have ordered a scan, which would have been done by 3am, showing a rupture; then the patient would have been taken to theatre by 4am").
    - Use the following sources to inform the counterfactual:
      - Hospital policies and protocols (e.g., escalation policy).
      - Typical behavior of the individuals involved (if known, e.g., "Dr. X usually responds within 15 minutes at night").
      - The clinical context (e.g., the patient's condition, available resources).
    - If the panel cannot agree on the counterfactual scenario, they must note the points of disagreement and then take a vote on the most plausible scenario (majority rules). If no majority can be reached, then the procedure stops and the omission is deemed "causally indeterminate" in this case. The omission may still be reported for general risk and breach of duty if applicable.

  #### Step 2: Causal Assessment (But-For Test) (15 minutes)
  - **Objective**: Determine if the omission was a necessary condition for the harm (using the counterfactual from Step 1).
  - **Rules**:
    - Ask: "In the counterfactual scenario (where the action was taken), would the harm (or a substantially similar harm) have been avoided?"
      - If yes → then the omission caused the harm (causally contributory).
      - If no → then the omission did not cause the harm (not causally contributory).
      - If uncertain → then the omission is "causally indeterminate" (due to lack of evidence or unresolvable uncertainty).
    - The panel must vote. Majority rules. If the vote is split (no majority), then the result is "indeterminate".

  #### Step 3: General Risk Assessment (5 minutes)
  - **Objective**: Separate from causation, assess if the omission represents a general risk that should be flagged for system learning.
  - **Rules**:
    - Ask: "Is this omission (or the conditions that led to it) the kind of thing that, if repeated, could generally increase the risk of harm in similar cases?"
      - This is always a yes/no vote. Majority rules.
    - Note: Even if the omission did not cause harm in this case (or was indeterminate), it may still be a general risk.

  #### Step 4: Breach of Duty (5 minutes)
  - **Objective**: Determine if the agent had a duty to act and breached that duty.
  - **Rules**:
    - Ask: "Given the agent's role, training, and hospital policies, did the agent have a duty to perform the action at the time?"
      - If yes, then the omission is a breach of duty.
      - If no, then it is not a breach of duty (but might indicate a system issue, e.g., inadequate training or staffing).
    - Vote: Majority rules.

  #### Step 5: Reporting (5 minutes)
  - **Objective**: Record the findings for the report.
  - **Rules**:
    - For each omission, report:
      - Causal status: "causally contributory", "not causally contributory", or "causally indeterminate".
      - General risk: yes or no.
      - Breach of duty: yes or no.
    - If the omission was not assessed for causation (due to Step 0), then causal status is "not assessed (no duty)" or "not assessed (ill-defined)".

  Total estimated time: 50 minutes (leaving 40 minutes for discussion and potential extensions, but the steps are designed to be time-boxed).

  ---

  ### Running the Examples

  #### Example 1: Delayed Escalation in Aneurysm Case
  - **Step 0**: Omission defined as: "The night nurse (agent) did not escalate the patient's rising early warning score to the on-call doctor between 2am and 8am." (Agreed by panel.)
  - **Step 1 (Counterfactual)**:
    - Panel must specify: What if the nurse had escalated at 2am?
      - Counterfactual: Call to on-call doctor at 2am. Doctor arrives by 2:30am. Reviews patient, suspects rupture, orders CT scan. Scan done by 3:30am. Results by 4am. Patient taken to theatre by 5am. Surgery starts by 5:30am.
    - The reviewing clinician argues that even with this, the patient would have died (rupture was unsurvivable). Other panel members argue that surgery might have saved him.
    - Vote on the counterfactual outcome: Majority (or split?) → If the reviewing clinician's view prevails (majority for "death anyway"), then the counterfactual scenario ends in death. If not, then survival.
    - Let's assume the panel majority accepts the reviewing clinician's view: death would have occurred anyway (either in ICU post-op or on the table).
  - **Step 2 (But-For)**: In the counterfactual, harm (death) is not avoided → omission did not cause the death. Vote: Majority agrees → "not causally contributory".
  - **Step 3 (General Risk)**: Failure to escalate a rising early warning score is a general risk → yes.
  - **Step 4 (Breach of Duty)**: The night nurse had a duty to escalate → breach of duty → yes.
  - **Report**: Omission: not causally contributory to death, but general risk and breach of duty. This is the answer even if it goes down badly.

  #### Example 2: Double Failure (Pharmacist and Prescriber)
  - We have two omissions: 
    - Omission A: Pharmacist did not flag the contraindicated dose.
    - Omission B: Prescriber did not check the interaction (though he normally does).
  - **For Omission A (Pharmacist)**:
    - Step 0: Defined as: "Pharmacist did not flag the contraindicated dose during medication review."
    - Step 1: Counterfactual: If the pharmacist had flagged it, the prescription would have been corrected, and the patient would have received the correct dose → no harm.
    - Step 2: But-For: Without the omission (if flagged), harm avoided → causally contributory? Wait: note that the harm requires both failures. But-For says: if the pharmacist had flagged it, then the harm would not have occurred → yes, it is a cause. Similarly for the prescriber.
      - This is because the But-For test asks: if this one omission had not occurred (and everything else the same), would harm have occurred? For the pharmacist: if the pharmacist had flagged, then the dose would have been corrected (even if the prescriber still didn't check) → harm avoided. Similarly for the prescriber: if the prescriber had checked, he would have caught it (even if the pharmacist didn't flag) → harm avoided. So both are causes by the But-For test? 
      - However, note the harm occurred because both failed. The But-For test for each individually holds because removing either one breaks the chain. This is a case of overdetermination (each is sufficient to prevent harm) but the But-For test still works because we are removing one at a time and holding the other fixed. So both are causes.
    - Step 2: But-For test passes for both individually → both are causally contributory.
    - Step 3 and 4: General risk and breach of duty (yes for both).
  - **Report**: Both omissions are causally contributory. The procedure does better than "both contributed" by explicitly stating each passed the But-For test.

  #### Example 3: Agency Nurse with No Duty
  - **Step 0**: Omission defined as: "Agency nurse (not rostered to the patient, no induction) saw abnormal obs and did not escalate."
  - **Step 0 Rule**: Check duty. By hospital policy, only the nurse assigned to the patient has the duty to escalate. The agency nurse had no assigned duty → stop. Do not assess for causation. 
  - **Report**: Not assessed for causation (no duty). But note for general risk: why was an untrained agency nurse in a position to see critical obs without clear responsibility? And system factors: induction, rostering. Breach of duty: no (because no duty).

  #### Example 4: Level of Description
  - **Case**: A patient's condition deteriorates, and the nurse fails to escalate. The harm is cardiac arrest.
  - **Version 1 (Coarse)**: Omission: "The nurse did not escalate."
    - Step 0: Agreed.
    - Step 1: Counterfactual: If escalated, doctor would have come, intervened, and arrest avoided → harm avoided.
    - Step 2: Causally contributory.
  - **Version 2 (Finer)**: Omission: "The nurse did not recognize the trend (which required training she hadn't received)."
    - Step 0: Agreed.
    - Step 1: Counterfactual: If she had recognized the trend, she would have escalated. But she wasn't trained → the counterfactual might require her having been trained (which is a different omission). The panel must decide: are we assessing the failure to recognize or the failure to escalate? The procedure in Step 0 forces the panel to fix the omission as one specific action. If they fix it as "did not recognize", then the counterfactual becomes: if she had recognized, then she would have escalated and harm avoided. But if the panel believes that without training she couldn't have recognized, then they might argue that in the counterfactual she still wouldn't have recognized (so harm not avoided). This leads to:
      - Step 2: If the panel believes that even in the counterfactual (if she had recognized) she would have escalated and avoided harm, then it's causal. But if they think she couldn't have recognized (so the counterfactual is impossible), then they might say the omission (failure to recognize) is not causal because it was impossible for her to act otherwise? 
      - However, note: the counterfactual in the But-For test is: if she had recognized (even if that requires a change in her training or knowledge), what would have happened? We are allowed to imagine a world where she had the necessary knowledge. So the counterfactual: if she had recognized (with the necessary knowledge), then she would have escalated → harm avoided → causal.
    - Alternatively, if the panel defines the omission as "the system did not train the nurse", then that's a different agent (the hospital) and a different counterfactual (if trained, she would have recognized and escalated). This would also be causal.

  The key is Step 0: fixing the level of description. The causal answer may change with the level.

  ---

  ### What the Procedure Can't Do (Limitations)
  1. **Value Judgements**: 
     - The procedure requires voting when there is disagreement. The votes are based on the panel's judgement of plausibility. These are factual judgements (what would have happened) but may involve uncertainty. The procedure forces a vote to prevent deadlock.
     - Genuine value judgements (e.g., "what level of risk is acceptable") are not addressed by this procedure. The CAO procedure is about causation and duty (which are factual) and general risk (which is also factual: does this practice increase risk?).

  2. **Punted Questions**:
     - **Step 0**: If the panel cannot agree on the definition of the omission (level of description) → punted to human vote. This is a factual judgement (what exactly are we investigating?) but may involve some interpretation. If the vote fails (no majority), then the omission is "ill-defined" and not assessed for causation.
     - **Step 1**: If the panel cannot agree on the counterfactual scenario → vote. If no majority, then "causally indeterminate". This is due to under-evidenced factual uncertainty (what would have happened?).
     - **Step 2**: If the vote on the But-For question is split (no majority) → "causally indeterminate". Again, factual uncertainty.

  3. **Who Should Be in the Room**: Only the panel (the three members). They must vote to break deadlocks.

  4. **What the Procedure Doesn't Cover**:
     - **Systemic Factors**: The procedure identifies omissions and their causal status, but the root cause analysis (why the omission occurred) is outside this procedure. The general risk step flags issues for broader learning.
     - **Multiple Omissions in a Chain**: The procedure assesses each omission separately. It does not assign "weight" or "primary cause". It may find several omissions causally contributory (as in Example 2).
     - **Probabilistic Causation**: The But-For test is deterministic. If the counterfactual outcome is probabilistic (e.g., only a 30% chance of survival even with intervention), the procedure does not handle that. The panel must decide if the harm would "more likely than not" have been avoided. If not, then the omission is not causal. If the chance is above 50%, then it is causal. If too uncertain, then "indeterminate".
     - **Moral Responsibility**: The breach of duty step addresses professional duty, but not moral blame. The procedure does not assign blame to individuals; it is for learning and system improvement.

  By using this procedure, the panel can systematically address omissions, avoid common pitfalls, and produce clear findings for the report.
answer: |-
  Below is a decision procedure designed for your panel, incorporating your requirements. It's structured as a step-by-step flowchart with clear stopping points, forces concrete counterfactuals, separates causation from duty/general risk, and fixes the level of description upfront. The procedure uses simple language, time-boxes each step, and includes voting rules for efficiency.

  ---

  ### **Serious Incident Omission Causation Procedure (SIO-Cause)**
  **Purpose**: To determine if an omission *caused the specific harm* in this case.  
  **Input**: A single omission statement (e.g., "Nurse X didn’t escalate at 2am").  
  **Output**: One of:  
  - **"Causal"** (omission changed outcome),  
  - **"Not Causal"** (omission didn’t change outcome),  
  - **"Indeterminate"** (insufficient evidence), or  
  - **"Not Assessed"** (preconditions not met).  

  **Time Allocation**: 90 minutes total (strict time-boxing per step).  
  **Voting Rules**: Majority vote (2/3) at each decision point. If deadlock, outcome = "Indeterminate."

  ---

  #### **Step 0: Fix the Omission Statement** (10 mins)  
  **Goal**: Agree on *one concrete action* that wasn’t done, at a *fixed level of description*.  
  **Rules**:  
  - The omission must be phrased as: **"[Person] did not do [specific action] at/during [time/event]."**  
    - ✅ Good: "Nurse A did not call the on-call doctor when EWS reached 7 at 2am."  
    - ❌ Bad: "Poor escalation" or "Lack of training."  
  - **Test for duty entanglement**: Ask: *"Was this action required of this person by role, policy, or training?"*  
    - If **No** → Stop. Output: **"Not Assessed (No Duty)"**. *Do not proceed to causation*.  
    - If **Yes** → Proceed.  
  - **Level of description rule**: The panel must choose *one* level:  
    - **Action-focused** (e.g., "didn’t call the doctor") *or*  
    - **Knowledge-focused** (e.g., "didn’t recognize the trend") *or*  
    - **System-focused** (e.g., "no training to recognize trends").  
    *If disagreement, vote to pick one level. No vote → Output "Indeterminate."*  

  **Output**: A single, fixed omission statement. Proceed to Step 1.

  ---

  #### **Step 1: Build the Concrete Counterfactual** (25 mins)  
  **Goal**: Specify *exactly* what would have happened if the action *had* been done.  
  **Rules**:  
  - The panel **must** collaboratively write:  
    *"If [person] had [action], then [next event], then [next event], ... leading to [outcome]."*  
  - Must include:  
    - **Who** would have been involved (e.g., "called Dr. Y, who was on-call").  
    - **Timing** (e.g., "within 15 minutes").  
    - **Realistic responses** (e.g., "Dr. Y would have ordered a scan; results in 1 hour").  
    - **Final outcome** (e.g., "surgery by 4am" or "death anyway").  
  - **Use evidence**: Policies, staff patterns, patient condition. *No speculation without anchors*.  
  - **If disagreement**: Vote on key uncertainties (e.g., "Would Dr. Y have ordered a scan?").  
    - If unresolved → Output **"Indeterminate."** Stop.  

  **Output**: A single, agreed counterfactual scenario. Proceed to Step 2.

  ---

  #### **Step 2: Apply But-For Causation Test** (15 mins)  
  **Goal**: Did the omission *change the outcome*?  
  **Rules**:  
  - Compare the **real-world harm** (e.g., death at 9am) to the **counterfactual outcome** (from Step 1).  
  - Ask: *"In the counterfactual, would the harm have been avoided, or substantially reduced?"*  
    - **Yes** → Omission = **"Causal."**  
    - **No** → Omission = **"Not Causal."**  
    - **Uncertain** → Output **"Indeterminate."**  
  - *Ignore*: Blame, preventability, or general risk (handled in Step 3). Focus *only* on this case.  

  **Output**: One of: Causal / Not Causal / Indeterminate. Proceed to Step 3.

  ---

  #### **Step 3: General Risk & Duty Assessment** (10 mins)  
  **Goal**: Separate lessons from causation (for reporting).  
  **Rules**:  
  1. **General Risk**: *"Could this type of omission (e.g., not escalating EWS) worsen outcomes in similar cases?"*  
     - **Yes/No** → Note for report.  
  2. **Breach of Duty**: *"Did the person violate a clear policy/training/role expectation?"*  
     - **Yes/No** → Note for report.  
  - *Neither affects Step 2’s causation verdict.*  

  **Final Report Fields**:  
  - Causation (Step 2) | General Risk (Yes/No) | Breach of Duty (Yes/No).  

  ---

  ### **Run on Your Examples**
  #### **Example 1: Delayed Escalation (Aneurysm)**  
  - **Step 0**: Omission = "Nurse did not call on-call doctor when EWS reached 7 at 2am." Duty = Yes (policy).  
  - **Step 1**: Counterfactual = "If called at 2am, Dr. Y would arrive by 2:30am, order scan by 3am, diagnose rupture, start surgery by 4am. Patient dies on table/by 5am."  
  - **Step 2**: Real harm = death at 9am. Counterfactual = death by 5am. Harm not avoided → **"Not Causal"**.  
  - **Step 3**: General Risk = Yes (delays can kill). Breach = Yes (policy violation).  
  - **Outcome**: Report: *Causation: Not Causal | General Risk: Yes | Breach: Yes*.  

  #### **Example 2: Double Failure (Medication Error)**  
  - *Assess each omission separately*:  
    - **Pharmacist didn’t flag dose**:  
      - Step 0: "Pharmacist did not flag contraindicated dose at verification." Duty = Yes.  
      - Step 1: Counterfactual = "If flagged, prescription corrected → no harm."  
      - Step 2: Harm avoided → **"Causal"**.  
    - **Prescriber didn’t check**:  
      - Step 0: "Prescriber did not check interaction at ordering." Duty = Yes.  
      - Step 1: Counterfactual = "If checked, dose corrected → no harm."  
      - Step 2: Harm avoided → **"Causal"**.  
  - **Outcome**: Both causal. Report: "Both omissions independently causal (either would have prevented harm)."  

  #### **Example 3: Agency Nurse with No Duty**  
  - **Step 0**: Omission = "Agency nurse did not report abnormal obs at 4am."  
    - Duty test: No (not her patient, no induction) → **"Not Assessed (No Duty)"**. Stop.  
  - **Outcome**: Not assessed for causation. *But* General Risk = Yes (system issue: inadequate induction).  

  #### **Example 4: Level of Description Problem**  
  - **Case**: Patient deteriorates; nurse doesn’t escalate. Harm = cardiac arrest.  
    - **Version A (Action-focused)**:  
      - Step 0: "Nurse did not call doctor at EWS 7." Duty = Yes.  
      - Step 1: Counterfactual = "Call → doctor intervenes → arrest avoided."  
      - Step 2: **"Causal"**.  
    - **Version B (Knowledge-focused)**:  
      - Step 0: "Nurse did not recognize EWS trend." Duty = Yes (if trained).  
      - Step 1: Counterfactual = "If recognized, would have called → arrest avoided."  
      - Step 2: **"Causal"**.  
    - **Version C (System-focused)**:  
      - Step 0: "Hospital did not train nurse on EWS trends." Duty = N/A (different agent).  
      - Step 1: Counterfactual = "If trained, recognizes trend → arrest avoided."  
      - Step 2: **"Causal"** (but now a system omission).  
  - **Key**: Fixing the level changes *who* is responsible but *not* whether causation exists.  

  ---

  ### **What the Procedure Can’t Do (Limitations)**  
  1. **Punted to Humans (Value Judgements)**:  
     - **Step 0 (Level of description)**: Choosing the "right" level isn’t factual. *Who decides?* The panel must vote, but if ethics/values dominate (e.g., "Should we blame the nurse or the system?"), involve an **ethicist or patient advocate** in the room.  
     - **Step 1 (Counterfactual realism)**: When evidence is thin (e.g., "Would the surgeon *really* have operated?"), it becomes a judgement call. *Who decides?* The panel votes, but if unresolvable, declare "Indeterminate" and escalate to a **hospital risk committee** for evidence review.  

  2. **Punted (Under-Evidenced Factual Questions)**:  
     - **Step 1**: If critical facts are unknown (e.g., "How fast would the doctor have responded?"), and voting fails → "Indeterminate." Escalate to **clinical audit team** for data gathering.  

  3. **Out of Scope**:  
     - **Probability**: Doesn’t handle "40% chance of survival" (unless >50% = "avoided" in Step 2).  
     - **Multiple Omissions**: Assesses one at a time; doesn’t weight "primary" vs. "contributory" causes.  
     - **Moral Blame**: Separates causation/duty but doesn’t assign sanction (needs HR/legal).  

  4. **Who Joins When Punting?**  
     - **Value Judgements**: Add ethicist, patient advocate, or family liaison.  
     - **Factual Gaps**: Add clinical auditor or data analyst.  
     - **System Issues**: Add risk manager or policy officer.  

  ---

  ### **Why This Works for Tired Clinicians**  
  - **Structured**: Questions in order, no philosophy (just "what would happen?").  
  - **Time-Boxed**: Step 0/1 prevent rabbit holes; voting breaks deadlocks.  
  - **Safe Outputs**: "Indeterminate" or "Not Assessed" are valid conclusions.  
  - **Clarity**: Separates causation (Step 2), general risk, and duty (Step 3).  
  - **Accountability**: Documents counterfactuals and voting rationale.  

  This procedure ensures omissions are assessed rigorously, while flagging where human judgement is needed. It stops panels from conflating "sad story" with causation and forces specificity where it matters most.
