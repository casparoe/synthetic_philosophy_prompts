prompt: |-
  Hey, I'm a third-year PhD student in archaeology (Mediterranean prehistory, mostly lithics and depositional stuff) and I keep having the same argument with a friend in my department who does paleogenetics, and I want to actually work out what I think on paper instead of re-litigating it over coffee. The argument is about whether we can ever legitimately get from stuff to beliefs — not to behavior, beliefs — and I have a concrete case in mind that I think makes it less of a seminar abstraction. My advisor is publishing a rock-shelter deposit: forty-odd small clay figures, all female-form, all with the head snapped off in roughly the same way, laid in a pit lined with red ochre, and sealed under a hearth that shows one episode of use and nothing after. No domestic debris anywhere in that unit. Two occupation layers up, in a much later phase, the same figure type turns up in a child's burial and also, unceremoniously, in a midden next to what look like gaming pieces. My advisor reads the pit as evidence of a belief that the dead return, or that persons get reborn. A visiting colleague says you cannot infer a belief from a deposit, period — you can infer that people did something costly and patterned, and calling that belief is just projection. A third person in the lab says it's taphonomy, that the heads simply break that way. And the old worry hangs over the whole thing: the further you get from diet and technology, the shakier the inference, until you're telling stories about people who can't correct you.

  So here's what I want. Take the role of someone who works seriously on archaeological inference and the philosophy of the historical sciences, think carefully before you start and maybe jot your way through the case first, and write me an essay that takes a position on the controversy: is inference to past belief ever warranted from material remains, and if so, under what conditions? Don't hedge into an it-depends-on-context non-answer — I want a verdict, and I want it to bite on my case specifically: say what my advisor gets to claim, what the colleague gets to claim, and which of them has to give something up. I'm half-convinced by a test I've been calling the costly-and-independent test (a deposit licenses a belief attribution only if the behavior is costly, recurs across contexts that vary independently, and isn't fully explained by practical ends), but I want you to stress-test it rather than just apply it — if it collapses, show me where, and tell me the strongest thing the skeptic gets right even if you rule against him.

  Format it as exactly five numbered points, each a sentence or two, no introduction and no closing paragraph, with point five carrying the verdict. American English, please. And skip the citations and reading list — I want the argument, not a bibliography.
reasoning: |-
  Okay, let me approach this systematically. The user is an archaeology PhD student grappling with a fundamental methodological debate about inferring beliefs from material culture, using a concrete case study involving clay figurines. 

  First, I need to parse the core question: Is inference to past belief ever warranted, and specifically in their described case? The user wants a decisive verdict applied to their advisor's interpretation of the ritual pit versus skeptics' views. 

  The user's own "costly-and-independent test" seems promising but needs stress-testing. I should consider:
  - How "costly" is defined (resources, time, opportunity cost?)
  - What constitutes "independent contexts" (temporal? spatial? functional?)
  - Whether practical explanations can be fully ruled out

  For the case study:
  - Pit context: Non-domestic, ochre-lined, sealed hearth suggests high cost/effort
  - Later midden context: Shows same figurine type used casually
  - Taphonomy claim: Needs evaluation - do experimental breaks match the finds?

  Key philosophical tensions:
  - Materialism vs. mentalism in archaeology
  - Uniformitarianism principle (can we project modern cognition?)
  - Underdetermination problem (multiple explanations fit data)

  I'll structure the response as five numbered points per request:
  1. Affirm possibility of belief inference under strict conditions
  2. Apply criteria to pit case (costly/recurrent but context issue)
  3. Address taphonomy counterargument 
  4. Analyze later midden as crucial contrasting evidence
  5. Verdict: Advisor partially justified but must scale back rebirth claim

  The skeptic wins on overinterpretation but loses on total prohibition. User's test holds if refined with contextual contrast requirement.
answer: |-
  1.  Inference to past belief *is* sometimes warranted from material remains when the patterned behavior evidenced is demonstrably costly, recurrent across significantly different contexts, lacks plausible functional explanation, and exhibits symbolic structure strongly suggesting shared, non-utilitarian meaning.
  2.  In your advisor's case, the pit deposit (costly ochre lining, deliberate snapping/placement, non-domestic/sealed context) strongly supports inferring a *ritual practice* governed by shared norms, but the specific belief in "dead returning" or "rebirth" overreaches the evidence, as multiple distinct beliefs (e.g., appeasement, commemoration, deity offering) could explain the same costly, patterned action without requiring that metaphysics.
  3.  The taphonomy objection (heads break that way) is weak given the *deliberate placement* of the headless figures in a specially prepared pit sealed by a single-use hearth – the context demonstrates intentionality beyond breakage patterns, making accidental deposition highly improbable.
  4.  The later appearance of identical figures in a child's burial (potentially ceremonial) *and* casually in a midden provides the crucial "independent context variation": the *same* object type is used in both highly structured ritual/commemorative settings and mundane discard, indicating its meaning (and the beliefs associated with its ritual use) were context-dependent and not inherent, weakening any singular, fixed belief inference like "rebirth" from the pit alone.
  5.  **Verdict:** Your advisor is warranted in inferring a shared, norm-governed *ritual practice* with significant symbolic meaning from the pit, but the skeptic is right that attributing the *specific belief* "dead return/rebirth" is unwarranted projection lacking sufficient contextual contrast; the strongest inference is to a costly, rule-bound practice concerning concepts of personhood, transition, or the sacred, not its precise metaphysical content.
