answer: |-
  My dear friend, you press upon a wound that troubles many earnest souls, yet you must understand that the corruption of truth is never healed by compounding falsehood, however noble the aim may seem. You rightly grasp that the *voluntas fallendi*—the will to deceive—is indeed the soul’s corruption that defines the lie, and that false words spoken in error or jest lack this poisoned root. But consider: when you speak falsely to the heretic, pretending denial of the Faith you hold, your will *is* bent upon deception. You argue the deceived is himself a deceiver, and your aim is his correction—but does the wickedness of the recipient cleanse the venom from your own tongue? Does a good end hallow a sinful means? Scripture declares *all* men neighbors, bound by truth (Zechariah 8:16-17), and Christ commands love even for enemies (Matthew 5:44). To say these men are not neighbors in faith is to sever the bond of universal charity. Your tongue does not merely "deal with strangers"; it conspires to make Christ’s truth appear false before men and angels. The evil lies precisely in this: you choose to wield falsehood as a tool, however just your cause, thereby making your own soul an instrument of deceit—and no soul can serve both Truth and falsehood. Correction sought through sin is no true correction at all.
