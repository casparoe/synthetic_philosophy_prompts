answer: |-
  ### Plan for the Argument
  I will defend "unpatchable fanaticism": any repair of expected value maximization (EVM) to remove fanatical verdicts either relocates fanaticism or introduces an unprincipled free parameter. I define fanaticism as in the setup: for any sure modest payoff \(C > 0\) (or loss avoidance \(-C\)) and any probability \(p > 0\), EVM prefers a finite lottery with probability \(p\) of a sufficiently large finite gain \(M\) (or loss \(-M\)) over the sure thing. Standard EVM is fanatical. The repairs—probability threshold, bounded utility, risk aversion via concave transformation, and imprecise credences—all fail. The standard of acceptability for verdicts is **avoidance of extreme imprudence**: no rule should (i) demand accepting a gamble risking near-certain ruin for a tiny chance of a huge gain (positive fanaticism), (ii) demand rejecting a gamble offering near-certainty of an arbitrarily large gain for a tiny risk of a bounded loss (ultra-caution, the negative mirror), or (iii) rely on a parameter that lacks a rational basis (e.g., no empirical or normative principle fixes its value). Extreme imprudence is unacceptable because it violates instrumental rationality: an agent following such verdicts can be exploited or forced to reject dominant gambles. For each repair, I construct a concrete decision problem showing failure. Failures stem from a common structure: **unboundedness** (in utility, probability, or stakes) interacting with **aggregation** (many small risks/gains), forcing the repair to either permit fanaticism or impose arbitrariness. I conclude that EVM must be kept with fanaticism or restricted to bounded domains. The strongest objection is that bounded utility succeeds; I address it and give a 70% confidence in the central claim.

  ---

  ### The Argument

  #### 1. Probability Threshold Repair
  **Repair:** Ignore outcomes with probability below a fixed cutoff \(\epsilon > 0\).  
  **Problem:** Ultra-caution under aggregation of independent risks.  
  **Decision Problem:**  
  - **States:** \(n\) independent binary events \(E_1, \dots, E_n\), each with probability \(p < \epsilon\).  
  - **Acts:**  
    - \(\text{Act } A\): Sure gain of \(C = 10^6\) utiles.  
    - \(\text{Act } B\): Gamble paying \(M = 10^9\) utiles for each \(E_i\) that occurs.  
  - **Credences:** Each \(E_i\) has precise probability \(p = \epsilon / 2\).  
  - **Utilities:** Linear in utiles (unbounded).  

  **Analysis:**  
  - The expected utility of \(B\) is \(n \cdot p \cdot M = n \cdot (\epsilon / 2) \cdot 10^9\). For large \(n\), this dominates \(A\) (e.g., \(n > 2 \times 10^3 / \epsilon\) makes \(B > C = 10^6\)).  
  - But the threshold repair ignores all individual \(E_i\) (since \(p < \epsilon\)). Each outcome of \(B\) (a specific number of successes) has probability \(< \epsilon\) for large \(n\) (by binomial decay; e.g., \(P(\text{exactly } k \text{ successes}) \leq \binom{n}{k} p^k (1-p)^{n-k} \to 0\) as \(n \to \infty\)). Thus, the repair ignores all outcomes of \(B\), evaluating it as \(0\) utiles. It prefers \(A\) (sure \(10^6\)) over \(B\).  
  **Failure:**  
  - \(B\) has arbitrarily high expected utility for large \(n\), yet the repair rejects it. This is **ultra-caution**: refusing a near-certain enormous gain (\(B\)’s expected utility grows linearly in \(n\)) for a sure modest \(C\), due to ignoring aggregated small probabilities.  
  - \(\epsilon\) is a **free parameter**: No principle fixes \(\epsilon\). If \(\epsilon\) is too low, fanaticism re-emerges for events just above \(\epsilon\); if too high, ultra-caution dominates.  

  #### 2. Bounded Utility Repair
  **Repair:** Cap utility at \(B > 0\), so \(u(\cdot) \in [-B, B]\).  
  **Problem:** Arbitrary bound under renormalization or unforeseen outcomes.  
  **Decision Problem:**  
  - **States:** One event \(E\) with probability \(p = 10^{-9}\).  
  - **Acts:**  
    - \(\text{Act } A\): Sure gain of \(C = B - 1\) utiles (just below bound).  
    - \(\text{Act } B\): Gamble paying \(M\) utiles if \(E\) occurs, \(0\) otherwise.  
  - **Credences:** Precise \(P(E) = p\).  
  - **Utilities:** Bounded, with \(u(M) = B\) for all \(M\) large enough.  

  **Analysis:**  
  - Bounded utility avoids fanaticism: \(B\)’s max EU is \(p \cdot B + (1-p) \cdot 0 < B\). If \(C > pB\) (e.g., \(C = B - 1 > 10^{-9}B\)), \(A\) is preferred.  
  **Failure:**  
  - The bound \(B\) is **arbitrary**: Why \(B\) and not \(B/2\) or \(2B\)? Consider two agents with bounds \(B\) and \(B' \neq B\). They rank acts differently: e.g., if \(C = B' > B\), agent 1 prefers \(B\) (if \(pB > B'\)? No, since \(u(C) = B\) for agent 1, but \(u(C) = B'\) for agent 2). No empirical or normative principle fixes \(B\).  
  - **Renormalization instability**: Suppose a new outcome \(X\) (e.g., “immortality”) is valued above \(B\). We must renormalize utilities, setting \(u(X) = B_{\text{new}} > B\). But then prior gambles change evaluation: e.g., a gamble once worth \(pB\) is now worth \(pB_{\text{new}}\), altering preferences arbitrarily. This makes the theory hostage to the arbitrary choice of \(B_{\text{new}}\).  

  #### 3. Risk Aversion via Concave Transformation
  **Repair:** Apply concave \(v\) to utility, maximizing \(E[v(u(\cdot))]\).  
  **Problem:** Unboundedness re-emerges or collapses to bounded utility.  
  **Decision Problem:**  
  - **States:** One event \(E\) with probability \(p = 10^{-9}\).  
  - **Acts:**  
    - \(\text{Act } A\): Sure gain of \(C\) utiles.  
    - \(\text{Act } B\): Gamble paying \(M\) utiles if \(E\) occurs, \(0\) otherwise.  
  - **Credences:** Precise \(P(E) = p\).  
  - **Utilities:** \(u(\cdot)\) linear, unbounded. Transformation \(v(u) = \sqrt{u}\) (concave, unbounded).  

  **Analysis:**  
  - \(B\)’s expected transformed utility is \(p \sqrt{M} + (1-p) v(0)\). As \(M \to \infty\), \(p\sqrt{M} \to \infty\). For fixed \(C\) and \(p\), choose \(M > (C/p)^2\); then \(p\sqrt{M} > \sqrt{C} = v(C)\), so \(B\) is preferred.  
  **Failure:**  
  - Fanaticism **re-emerges**: The repair prefers \(B\) over \(A\) for large \(M\), replicating EVM’s fanaticism.  
  - **Collapse to bounded utility**: To avoid this, use a bounded \(v\) (e.g., \(v(u) = \arctan(u)\), so \(v(u) \in (-\pi/2, \pi/2)\)). But then this reduces to the bounded utility repair, inheriting its arbitrariness (e.g., why \(\arctan\)? Why not \(\tanh\)? The bound is set ad hoc).  

  #### 4. Imprecise Credences (Minimax/Hurwicz)
  **Repair:** Represent credence for \(E\) as interval \([0, q]\), use minimax (maximin) or Hurwicz criterion.  
  **Problem:** Ultra-caution under minimax; arbitrariness under Hurwicz.  
  **Decision Problem:**  
  - **States:** One event \(E\) with imprecise probability \([0, q]\), \(q = 10^{-6}\).  
  - **Acts:**  
    - \(\text{Act } A\): Sure gain of \(C\) utiles.  
    - \(\text{Act } B\): Gamble paying \(M\) utiles if \(E\) occurs, \(0\) otherwise.  
  - **Utilities:** Linear, unbounded.  

  **Analysis (Minimax):**  
  - Minimax evaluates \(B\) as \(\min_{c \in [0,q]} c \cdot M = 0\) (since \(c=0\) is allowed). Thus, it always prefers \(A\) if \(C > 0\).  
  **Failure (Minimax):**  
  - **Ultra-caution**: For large \(M\) (e.g., \(M = 10^{12}\)), \(B\) has expected utility up to \(qM = 10^6\) under plausible credences, but minimax rejects it for any \(C > 0\). This mirrors the threshold repair’s failure: refusing a gamble with huge upside for a trivial sure gain.  

  **Analysis (Hurwicz):**  
  - Hurwicz uses a weighted average: \(\alpha \cdot \text{best-case EU} + (1-\alpha) \cdot \text{worst-case EU}\). For \(B\), best-case EU is \(qM\), worst-case is \(0\), so Hurwicz value is \(\alpha q M\).  
  - Compare to \(A\): \(C\). Prefer \(B\) if \(\alpha q M > C\).  
  **Failure (Hurwicz):**  
  - \(\alpha\) is a **free parameter**: No principle fixes \(\alpha\). If \(\alpha = 1\) (optimism), fanaticism returns (prefer \(B\) for \(M > C/q\)). If \(\alpha = 0\) (pessimism), ultra-caution dominates. If \(\alpha \in (0,1)\), the repair avoids both extremes but only by picking \(\alpha\) arbitrarily.  

  #### 5. Common Structure of Failures
  All failures arise from a common structure:  
  - **Unboundedness**: Utilities, stakes, or the number of independent risks are unbounded.  
  - **Aggregation**: Many small risks/gains (e.g., \(n\) independent events) or a single low-probability high-stakes event amplify the effect.  
  - **Repair boundary**: Each repair introduces a boundary (threshold \(\epsilon\), bound \(B\), concavity curvature, Hurwicz \(\alpha\)). When unboundedness pushes against this boundary, the repair either:  
    - (i) **Relocates fanaticism**: To ultra-caution (threshold, minimax) or restores fanaticism (concave transformation if unbounded).  
    - (ii) **Imposes arbitrariness**: The boundary parameter lacks a principled basis (all repairs).  
  A decision rule must handle unbounded domains consistently or admit its domain is bounded. Repairs fail because they pretend otherwise.  

  #### 6. Conclusion: What Next?
  A decision theorist should:  
  - **Keep EVM with fanaticism**, accepting that rationality permits extreme bets when stakes dwarf probabilities. This is consistent but unpalatable.  
  - **Restrict EVM to a bounded domain**, where utilities are bounded above and below and probabilities are bounded away from 0. But this domain must be specified non-arbitrarily (e.g., "all human-relevant choices"), which is vague and excludes cosmic stakes (e.g., Pascal’s Wager). Abandoning EVM entirely is unnecessary but plausible if fanaticism is intolerable.  

  ---

  ### Self-Critique
  **Strongest objection**: Bounded utility is not arbitrary—it reflects coherent preferences. Savage’s axioms imply bounded utility if we assume a rich state space, and the bound is fixed by preference data, not choice. For example, if immortality is valued finitely, \(u\) can be bounded without arbitrariness.  
  **Rebuttal**: The "preference data" defense assumes all outcomes are pre-specified. But decision-makers face unforeseen outcomes (e.g., new technologies, existential risks). Renormalizing utilities for new outcomes changes preferences arbitrarily (e.g., a once-accepted gamble may be rejected after discovering a higher utility). Thus, bounded utility relies on an arbitrary static bound.  

  **If forced to bet on one repair**: I would bet on **bounded utility** (40% confidence it might succeed), as it is the most established and avoids fanaticism cleanly if outcomes are bounded. But the arbitrariness under unforeseen outcomes undermines it.  

  **Confidence in central claim**: 70%.  
  - **Support**: Each repair fails concretely; the common structure explains why. Bounded utility’s renormalization problem is severe.  
  - **Doubt**: Bounded utility may be salvaged by stipulating all outcomes are known (though unrealistic). Risk aversion repairs might work with careful axiomatization (e.g., rank-dependent utility).  
  - **No rigging**: The setup is fair. Fanaticism is rigorously defined; extreme imprudence is a reasonable standard. The task is not misconceived.
