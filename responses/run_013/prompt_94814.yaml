prompt: |-
  You are a decision theorist with a taste for adversarial precision. I want a rigorous argument for a position I find plausible but have not seen defended in the form I want, and I want you to build it from the ground up rather than assemble it from what you remember of the literature. Before you write the argument itself, spend a short paragraph on your plan: how you will fix the terms, which moves you expect to make, and where you expect the argument to be weakest.

  Set-up and target. Take expected value maximization in its standard form: acts are ranked by the sum over states of credence times utility, credences are real numbers in [0,1], and utilities are real numbers with no upper bound. Call a decision rule fanatical if, for every sure modest payoff, however large, and every positive probability p, however small, there is a lottery with probability p of some finite payoff large enough that the rule ranks the lottery above the sure thing — and likewise in the negative direction, so that a sufficiently small chance of a sufficiently bad outcome dominates any sure loss. So defined, expected value maximization is fanatical.

  The position to defend is unpatchable fanaticism. Claim: every repair of expected value maximization that is meant to remove the fanatical verdicts fails, and the failures are not a coincidence. Each repair either relocates the fanaticism rather than removing it, or leaves the theory's verdicts hostage to a free parameter that the decision-maker has no principled way to set. You should establish both halves of that diagnosis, and say explicitly what standard of acceptability you are using when you call a verdict a failure, and why I should accept that standard.

  The repairs to address, each stated in its strongest form before you attack it:

  - A probability threshold: ignore outcomes whose probability falls below a fixed cutoff.
  - Bounded utility: cap the utility scale, or hold that utilities are bounded in principle.
  - Risk aversion by transformation: apply a concave transformation to utility, equivalently maximize expected value of a concave function of the payoff.
  - Imprecise credences: represent the credence in the huge payoff as an interval and choose by the worst case, or by some weighted compromise between the worst and best cases.

  If you think there is a fifth repair that escapes the diagnosis, add it and treat it the same way.

  What I want for each repair. A concrete decision problem stated explicitly — states, acts, payoffs, credences — in which the repair delivers a verdict that is either internally unstable or unacceptable. Where you can, give a general argument rather than a single case: for instance, a reason the threshold repair collapses when the agent faces many independent tiny chances at once, or a reason the concavity repair either restores unboundedness or turns out to be the bounded-utility repair in disguise. Then argue that all four failures trace to one common structure, and say what that structure is. Close by saying what a decision theorist who accepts your argument should do next: keep expected value maximization together with its fanaticism, restrict it to some domain, or abandon it — and why.

  Constraints. Formal where formal is possible; every step should be traceable to an explicit construction or an explicit assumption rather than to a vibe. No citations and no appeals to who has argued what; I care about the argument, not its pedigree. Do not pad.

  Finally, turn on yourself. State the strongest objection to your conclusion, tell me which of the repairs you would bet on if forced to bet on one, and give me a confidence level in the central claim — a number, with the considerations that move it, not a vague hedge. If you conclude the position is false, or that the framing I have given you is confused or rigs the question, say so plainly and point to where the rigging is; I would rather be told the task is misconceived than receive a compliant argument.
