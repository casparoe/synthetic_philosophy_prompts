  We are writing a proposal for a small summer grant. The topic is program equilibrium in the one-shot prisoner's dilemma, specifically addressing the robustness of the Löbian argument for mutual cooperation when there is any uncertainty. The central question is whether program equilibrium has a "basin of attraction" (i.e., is robust to small uncertainties) or if it is a measure-zero phenomenon that collapses under the slightest perturbation.

  I will structure the proposal as follows:

  1. **Title and Overview**: A concise title and a brief summary of the project.
  2. **Background and Motivation**: Explain program equilibrium, the Löbian argument for cooperation, and the concern about fragility.
  3. **Research Question**: Sharply state the question about robustness.
  4. **Gap in Existing Literature**: Explain why the standard formalization does not address this (it assumes perfect knowledge and identical proof systems).
  5. **Methods**: Concrete steps to model uncertainty and analyze the equilibrium.
  6. **Expected Outcomes**: What a positive and negative result would look like.
  7. **Feasibility and Scope**: Why this is suitable for a summer grant.

  ---

  **Proposal: Robustness of Program Equilibrium in the Presence of Uncertainty**

  **1. Overview**
  This project investigates the robustness of program equilibrium in the one-shot prisoner's dilemma. The standard Löbian argument shows that two rational agents, each able to read the other's source code, can achieve mutual cooperation. However, this result may be fragile. We ask: if agents have even a small doubt about each other's code (due to mutations, differing proof systems, or verification limits), does cooperation unravel? We will model these uncertainties and determine whether program equilibrium has a basin of attraction or exists only under perfect mutual knowledge.

  **2. Background and Motivation**
  In program equilibrium, two players in a one-shot prisoner's dilemma submit computer programs that can read each other's source code before choosing to cooperate (C) or defect (D). The Löbian argument (from Löb's theorem) allows each program to prove that the other will cooperate if it does, leading to mutual cooperation. This result is striking because it requires no repetition. 

  However, this argument relies on strong assumptions: both programs must use the same logic system, have access to each other's exact code, and be able to reason about each other without any doubt. In reality, uncertainty is inevitable (e.g., due to code mutations, differences in proof systems, or bounded rationality). If the equilibrium is fragile, then it may not be a practical solution. This project tests the robustness of program equilibrium to small uncertainties, analogous to how noise affects repeated games.

  **3. Research Question**
  Is the cooperative program equilibrium robust to arbitrarily small uncertainties, or is it a measure-zero phenomenon that collapses under any perturbation? Specifically, we will model perturbations such as:
  - A small probability that the opponent's code is a "mutant" (e.g., always defects).
  - Slight differences in the agents' proof systems (so that they cannot perfectly verify each other's proofs).
  - Agents having bounded proof capabilities (unable to fully verify the other's code).

  We seek a determinate answer: does there exist a non-zero measure of uncertainty under which cooperation remains the equilibrium outcome?

  **4. Gap in Existing Formalizations**
  The standard formalization of program equilibrium (via Löbian reasoning) assumes:
  - Both agents have identical and known proof systems.
  - They have perfect access to each other's source code.
  - They can prove theorems about each other without error.

  By construction, these models exclude uncertainty. Therefore, they cannot address whether cooperation is stable when these idealizations are relaxed. Our project fills this gap by explicitly introducing uncertainty into the model.

  **5. Methods**
  Instead of hand-waving, we propose concrete steps:

  a) **Model Uncertainty**: 
     - *Mutant Agents*: With probability ε, the opponent is a mutant (always defects); with probability 1-ε, it is the rational cooperator. We will write the expected payoff for an agent and see if cooperation is still optimal for small ε.
     - *Divergent Proof Systems*: We will model two agents with slightly different logical systems (e.g., one uses PA and the other PA+Con(PA)). We will see if they can still mutually prove cooperation.
     - *Bounded Verification*: Limit the length of proofs agents can check. We will use bounded Löb's theorem or probabilistic proofs to model this.

  b) **Analyze Equilibrium**:
     - For each perturbation, we will define a modified game and look for Nash equilibria in the space of programs. We will check if mutual cooperation remains an equilibrium and whether it is unique or if defection becomes dominant.

  c) **Simulations and Theoretical Analysis**:
     - For probabilistic mutants, we can compute expected payoffs analytically.
     - For proof system differences and bounded verification, we will use formal logic to derive conditions under which cooperation can be proven (or not).

  **6. Expected Outcomes**
  - **Positive Result**: We find that for some small ε>0 (or for some bounded proof lengths or slight system differences), mutual cooperation remains an equilibrium. This would demonstrate a basin of attraction.
  - **Negative Result**: We show that for any ε>0 (or any difference in proof systems, or any bound on verification), mutual cooperation is no longer an equilibrium. This would indicate that program equilibrium is measure-zero and not robust.

  **7. Feasibility and Scope**
  This project is well-suited for a summer grant because:
  - It builds directly on existing formal models (we are not starting from scratch).
  - The uncertainty models are well-defined and tractable.
  - We can make progress without solving the most general case (e.g., by starting with the mutant model, which is simpler).

  However, we note that full generality (e.g., arbitrary uncertainties) may be out of scope. We will focus on one or two concrete perturbations to get clear answers.

  ---

  **Summary of Deliverables**
  By the end of the summer, we will have:
  1. A formal model of program equilibrium with one or two types of uncertainty.
  2. Analytical results (theorems) on the existence/non-existence of cooperative equilibrium.
  3. A draft paper with the findings.

  This work will clarify whether program equilibrium is a practical solution for one-shot cooperation or merely a theoretical curiosity.
answer: |-
  ### Proposal: Robustness of Program Equilibrium in the Presence of Uncertainty  

  #### **Title**  
  The Fragility of Cooperation: Is Program Equilibrium Robust to Imperfect Information?  

  #### **Overview**  
  This project tests the robustness of program equilibrium—a game-theoretic solution enabling cooperation in one-shot prisoner's dilemma games via mutual code inspection and Löbian reasoning. Existing proofs show cooperation is achievable under perfect mutual knowledge of source code and shared logic. I hypothesize this result is **non-robust**: even infinitesimal uncertainty (e.g., code mutations, proof system divergence, or verification failure) causes cooperation to unravel entirely. I will formalize this uncertainty, determine whether program equilibrium has a "basin of attraction" (cooperation persists under small perturbations) or is a measure-zero phenomenon, and identify critical failure thresholds.  

  ---

  ### **Background and Research Question**  
  **Program equilibrium** solves the one-shot prisoner's dilemma (PD) by having players submit programs that inspect each other’s source code before choosing actions. Using **Löbian reasoning** (where an agent can prove statements about its counterpart’s behavior within a consistent formal system), mutual cooperation becomes an equilibrium: each program proves "if I cooperate, the other cooperates" and acts accordingly.  

  **The problem**: This result assumes:  
  1. **Perfect code access**: Programs see each other’s *exact* source code.  
  2. **Shared proof system**: Agents use identical, infallible logical systems.  
  3. **No verification limits**: Proofs about each other’s behavior are always constructible and verified.  

  In practice, uncertainty is inevitable (e.g., noise in code transmission, adversarial mutations, or bounded rationality). If cooperation collapses under negligible perturbations—akin to how *tit-for-tat* fails under noise in repeated PD—program equilibrium becomes a theoretical artifact.  

  **Sharpened question**:  
  > *Does program equilibrium in Löbian prisoner's dilemmas have a non-zero basin of attraction? Specifically:  
  > "For any uncertainty level \(\epsilon > 0\) (representing code mutations, proof system divergence, or verification failure), does mutual cooperation remain a Nash equilibrium? Or does defection dominate for all \(\epsilon > 0\)?"*  

  A **positive result** would show cooperation persists for \(\epsilon < \epsilon^*\) (e.g., a critical mutation rate). A **negative result** would prove cooperation collapses for all \(\epsilon > 0\), making it measure-zero.  

  ---

  ### **Why Existing Formalizations Leave This Open**  
  The standard model (e.g., Tennenholtz 2004, Critch 2016) **assumes uncertainty away by construction**:  
  - Programs are deterministic and mutually visible.  
  - Löbian proofs rely on agents sharing identical deduction systems (e.g., Peano Arithmetic).  
  - Noiseless verification is baked into the formalism (e.g., "proof of cooperation" always succeeds).  

  This ignores:  
  - **Uncertainty in code**: The opponent’s code might be corrupted (e.g., "always defect" with probability \(\epsilon\)).  
  - **Logical divergence**: Agents might use incompatible proof systems (e.g., PA vs. PA+\(\neg\)Con(PA)).  
  - **Bounded verification**: Programs may lack resources to verify proofs.  

  *Result*: The model pre-answers the robustness question—cooperation is stable only at \(\epsilon = 0\).  

  ---

  ### **Concrete Methodology**  
  Instead of hand-waving, I will extend the program equilibrium model with **tractable uncertainty parameters** and analyze stability. Over 8 weeks:  

  1. **Model uncertainty formally** (Weeks 1–2):  
     - **Code mutations**: Introduce \(\epsilon\)-probability that an agent’s code is replaced by a "mutant" (e.g., defects unconditionally).  
     - **Proof divergence**: Define agents with \(\delta\)-different logical systems (e.g., PA vs. PA with an added axiom).  
     - **Bounded verification**: Restrict proof length to \(k\) steps; unverified proofs default to defection.  

  2. **Analyze equilibrium conditions** (Weeks 3–5):  
     - Modify the Löbian cooperator (e.g., "cooperate only if a valid proof of mutual cooperation exists").  
     - Compute expected payoffs for cooperation vs. defection under uncertainty.  
     - Derive Nash equilibrium conditions using game-theoretic and modal logic tools (e.g., possible worlds for mutant types).  

  3. **Simulate and solve critical cases** (Weeks 6–7):  
     - Code simple agent programs in Python (e.g., Löbian cooperator vs. \(\epsilon\)-mutant opponent).  
     - Solve for critical thresholds (e.g., maximum \(\epsilon\) where cooperation’s expected payoff > defection’s).  
     - Test edge cases: e.g., agents with proof bounds \(k\) facing "long-proof" opponents.  

  4. **Synthesize results** (Week 8):  
     - Map phase transitions: When does cooperation break?  
     - Formalize theorems (e.g., "For \(\epsilon > 0\), mutual cooperation is not equilibrium").  

  ---

  ### **Expected Outcomes**  
  - **Positive result**: Cooperation persists for \(\epsilon < \epsilon^*\) (e.g., \(\epsilon^* = 0.05\)) or small \(\delta/k\), showing a basin of attraction. *Example*: Expected payoff of cooperation > defection until \(\epsilon\) exceeds a computable threshold.  
  - **Negative result**: Cooperation collapses for all \(\epsilon, \delta, k > 0\). *Example*: Even infinitesimal mutation risk makes defection strictly dominant.  
  - **Mixed result**: Robustness depends on perturbation type (e.g., stable under code noise but not proof divergence).  

  *Implications*: A negative result implies program equilibrium is impractical without perfect information; a positive result suggests limited real-world applicability.  

  ---

  ### **Scope and Feasibility**  
  **Fits summer scope**:  
  - Builds on established models (no new foundations needed).  
  - Focuses on 2–3 uncertainty types (code mutations first; proof divergence if time allows).  
  - Deliverables: Proofs/counterexamples, simulation code, and a draft paper.  

  **Risks**:  
  - Löbian reasoning with uncertainty may require novel modal logic. *Mitigation*: Start with mutations (game-theoretic tools suffice).  
  - Undecidability in bounded verification. *Mitigation*: Use asymptotic analysis or probabilistic proofs.  

  **Why now?** This bridges logic-based cooperation and evolutionary game theory—ideal for a focused summer project.  

  ---

  **Conclusion**: Program equilibrium promises cooperation without repetition, but its fragility under uncertainty is unexplored. I will rigorously test its robustness, delivering a concrete answer: either a basin of attraction or proof of measure-zero instability.
