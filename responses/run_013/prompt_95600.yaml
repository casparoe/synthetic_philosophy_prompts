  I'm writing a two-page proposal for a small summer grant and I've got a half-formed idea I want you to turn into something submittable. It's about program equilibrium: the setup where two players in a one-shot prisoner's dilemma each submit a program that gets to read the other player's source code before it moves, and the Löbian argument is supposed to show that mutual cooperation is reachable with no repetition and no enforcement. My nagging worry is that it's a knife-edge result — the argument seems to need each side to prove things about the other's code inside a shared logic, and I suspect that if you give either player even a sliver of doubt about the other (a small chance the other's code is a mutant, a slightly different proof system, an agent that just can't verify it), cooperation unravels completely, the way it does under noise in repeated games. So I want the question sharpened into: does program equilibrium have a basin of attraction, or is it a measure-zero point that only exists under exact mutual knowledge of code? Give me the proposal — the question stated so it has a determinate answer, why the usual formalisation leaves this open (my hunch is that it assumes the uncertainty away by construction; tell me if that's wrong), what I'd concretely do in the time available instead of hand-waving about "extending the model", what a positive and a negative result would each look like, and an honest take on whether this actually fits the scope. No citations, I'll add those myself.
