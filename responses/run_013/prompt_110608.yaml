     - **Work**: Distinguishes emergent distortions (from member choices) from engineered ones (driven by an external beneficiary like an algorithm or leader).  

  3. **Sincerity (Belief vs. Conformity)**:  
     - **Work**: Isolates genuine conviction from public compliance masking private doubt. Focuses on observable speech acts (e.g., enthusiastic endorsements vs. rote repetition).  

  4. **Visibility (Awareness of Practice)**:  
     - **Work**: Separates communities that accurately perceive their dismissal practices from those with false self-theories (e.g., "we're open-minded" while censoring).  

  5. **Symmetry (Rules Applied Outward-Only)**:  
     - **Work**: Identifies communities that apply their dismissal standards asymmetrically (rejecting outsiders even when they mirror the group's claims). Only invoked in inoculation paths where rules exist.  

  ---

  ### Diagnostic Decision Tree  
  **Start**: A community maintains a stubborn consensus insulated from outside challenge.  

  1. **Is counter-evidence typically absent (unseen/unheard) or present but dismissed?**  
     - **Absent (Insulation)**: Go to 2A.  
     - **Present but dismissed (Inoculation)**: Go to 2B.  

  ---

  #### Branch A: Insulation (Evidence Absent)  
  2A. **Is the absence due to members' choices or an external actor?**  
     - **Members' choices** (e.g., self-censorship, avoiding sources): Go to 3A.  
     - **External actor** (e.g., algorithm, mod, leader): Go to 4A.  

     3A. **Do members genuinely endorse the consensus?**  
        - **Yes**: ➔ **Plain Informational Isolation** (e.g., hobbyists avoiding politics; sincere, organic).  
        - **No**: ➔ **Silent Self-Censorship** (e.g., academics in a repressive field; insincere, organic).  

     4A. **Are members aware of the filtering?**  
        - **Yes**: ➔ **Sanitized Feed** (e.g., forum banning topics by vote; visible, designed).  
        - **No**: ➔ **Algorithmic Bubble** (e.g., social media feed; invisible, designed).  

  ---

  #### Branch B: Inoculation (Evidence Dismissed)  
  2B. **Is dismissal driven by members or an external actor?**  
     - **Members**: Go to 3B.  
     - **External actor**: Go to 4B.  

     3B. **Do members genuinely endorse dismissals?**  
        - **Yes**: Go to 5B.  
        - **No**: Go to 6B.  

     5B. **If an outsider made the group’s case, would they dismiss it using their own rules?**  
        - **Yes**: ➔ **Outward-Only Skepticism** (e.g., thread dismissing "concern-trolling" outsiders; asymmetric).  
        - **No**: ➔ **Echo Chamber** (e.g., group applying consistent standards; symmetric).  

     6B. **Do members accurately perceive others' beliefs?**  
        - **Yes**: ➔ **Coordinated Conformity** (e.g., dissenters aware of mutual doubt; visible insincerity).  
        - **No**: ➔ **Pluralistic Ignorance** (e.g., server where all doubt but assume others believe; invisible insincerity).  

     4B. **Are members aware of the external actor’s role?**  
        - **Yes**: ➔ **Cult of Authority** (e.g., leader reinterpreting failed predictions; visible, designed).  
        - **No**: ➔ **Stealth Propaganda** (e.g., AI-curated news feed; invisible, designed).  

  ---

  ### Test Case Diagnoses  
  - **Forum banning a topic by vote**: Insulation → External actor → Aware ➔ **Sanitized Feed**.  
  - **Leader’s failed prediction reinterpreted**: Inoculation → External actor → Aware ➔ **Cult of Authority**.  
  - **Argument dismissed as "concern-trolling" from outsider**: Inoculation → Members → Genuine → Dismiss outsider’s mirrored claim ➔ **Outward-Only Skepticism**.  
  - **Server where all doubt but assume others believe**: Inoculation → Members → Not genuine → Misperceive others ➔ **Pluralistic Ignorance**.  
  - **Reader with unexplained algorithmic feed**: Insulation → External actor → Unaware ➔ **Algorithmic Bubble**.  

  ---

  ### Empty Combinations & Limitations  
  - **Empty Combinations**:  
    - *Inoculation + External actor + Symmetry*: Rare. External actors (e.g., algorithms) rarely enforce symmetric standards; they benefit from polarization. Unattractive to manipulators.  
    - *Insulation + External actor + Insincerity*: Unstable. If members know an actor hides evidence and they disbelieve the consensus, they typically seek counter-evidence (e.g., VPNs).  

  - **Unseparated Pairs**:  
    - **Echo Chamber vs. Outward-Only Skepticism**: Relies on symmetry, which assumes communities have explicit "rules." Fails if dismissals are arbitrary (no rules to test).  
    - **Sanitized Feed vs. Cult of Authority**: Ambiguous if the external actor is a democratically elected mod (blurs "external"). Resolved by focusing on beneficiary (mods vs. leaders).  

  ---

  ### Confidence in Splits  
  - **Insulation/Inoculation Cut**: High confidence. It isolates *access* (insulation) from *evaluation* (inoculation), which your cases treat as distinct (e.g., algorithmic absence vs. leader reinterpretation). It avoids conflation with "degree of openness."  
  - **Weakest Split**: **Sincerity**. In practice, private doubt is hard to observe; it relies on inferred motives (e.g., lukewarm endorsements). This could misclassify strategic silence as conviction.  
  - **Weakest Leaf**: **Pluralistic Ignorance**. Requires inferring misperception of beliefs, which often needs insider data (e.g., anonymous surveys). Risk of confusion with **Coordinated Conformity**.  

  This tree prioritizes your cuts over textbook definitions, emphasizing mechanisms (e.g., "who turns the screw"). It resolves your frustration by routing cases to leaves via observable features, not label wars.
