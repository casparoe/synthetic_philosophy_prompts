prompt: |-
  I sit on my department's animal ethics committee (I'm the grad student rep, so mostly I read forms and nod), and I keep going in circles about what our approval process actually assumes. The form asks us to justify that the species we're using can experience pain or suffering, and in practice everyone writes the same three things: it has a central nervous system, it has nociceptors, it responds to analgesics and shows wound-directed behaviour. That's the whole test. Meanwhile two floors down there's a physics group doing god knows what to trapped ions and they fill in no forms at all, and last term we voted on whether to extend our process to octopuses and crabs, and someone asked about the insects in the fly lab and about the human brain organoids in the stem cell group, and the meeting basically dissolved without deciding anything. So what does this practice actually presuppose? Not what it would be nice for it to presuppose — what it commits us to. That sentience requires a nervous system, or only that a nervous system is the only place we can currently read it off? Those are different claims and I want to know which one the practice needs, and whether the CNS line is doing metaphysical work or just epistemic work.

  Then my flatmate, who has read too much Philip Goff and now thinks the lights are on everywhere, says that if experience is fundamental then our form is arbitrary, because the vacuum has as much claim to matter morally as the mouse does. My other friend thinks that's backwards: she says panpsychism makes the ethics narrower rather than wider, because whatever flickers at the bottom of physics isn't valenced and doesn't add up into anything that can have a bad time, so nothing down there is a patient at all. I'd like you to take both of them seriously and tell me which is right, or at least what each would have to assume to get off the ground. And here's the test case we argued about for an hour: a colleague proposed replacing the CNS requirement with something like — a system counts if it has some internal state that it acts to hold within bounds, a state that things can go better or worse for, such that its behaviour is organized around keeping that state in range. Does that criterion sweep in the thermostat, the bacterium, the single cell? Does it sweep in anything in fundamental physics? Is that a reductio or is it the correct answer?

  So: reconstruct the implicit theory of the current practice, tell me what it strictly presupposes versus what it merely happens to fit well with, tell me which live views it quietly rules out (panpsychism, functionalism about minds, whatever else), and then tell me concretely what would change if we adopted the panpsychist picture or the functionalist picture instead — which experiments would suddenly need review and which wouldn't, and whether a form built on either picture could be administered by actual people on a Tuesday afternoon. I don't need reading lists or citations, I need the argument.
reasoning: |-
  Okay, let's tackle this user's query. They're on an animal ethics committee and are confused about what their approval process actually assumes. The form requires justifying that a species can experience pain based on nervous system criteria, but they see inconsistencies: physicists experimenting on trapped ions without forms, debates about octopuses and crabs, and questions about insects and brain organoids. They want to know what the current practice presupposes—whether it's a metaphysical claim about sentience requiring a nervous system or just an epistemic tool. 

  First, I need to unpack the implicit commitments of their current practice. The reliance on CNS, nociceptors, analgesics response, and wound-directed behavior suggests an empirically tractable model. It's not necessarily claiming that only nervous systems can host sentience but that it's the only reliable indicator they have. This is epistemic, not metaphysical. However, in practice, it functions as a de facto boundary because alternatives aren't considered. So the committee acts as if the nervous system is necessary, even if not explicitly stated.

  Then there's the panpsychism debate with their flatmate and friend. The flatmate argues that if experience is fundamental, then the form is arbitrary because even the vacuum could have moral claims. The friend counters that panpsychism actually narrows ethics because basic particles don't have valence. The user wants these views taken seriously. I need to explain both positions. Panpsychism sees consciousness as fundamental, but the combination problem is key—how micro-experiences combine into macro ones. The flatmate's view might overextend moral consideration, while the friend points out valence is necessary for suffering. So even if panpsychism is true, ethics might only apply to systems where experiences combine meaningfully.

  The proposed criterion of a system maintaining internal states introduces functionalism. If they switch to this, thermostats or bacteria might be included, which seems absurd. But is it a reductio or correct? Functionalism separates consciousness from biology, focusing on organizational features. Adopting this would require reviewing AI, advanced robots, or certain algorithms, which isn't practical for the committee. 

  The user's deeper needs: they want clarity on the underlying assumptions of their ethics process, how different philosophies would change practical oversight, and whether alternatives are feasible. They need actionable insights, not just theory. So, comparing current practice with panpsychism and functionalism in terms of administrative feasibility is crucial. For example, panpsychism might not change much practically because micro-experiences aren't valenced, while functionalism could overwhelm the committee with too many entities to review.

  Also, the test case with the internal state criterion shows the tension between inclusive theories and practical application. The committee needs a workable boundary. Current practice uses the nervous system as a proxy, which, despite flaws, is manageable. Alternatives might be philosophically sound but impractical. The user likely needs to justify maintaining the status quo or argue for incremental changes, like including cephalopods, without overhauling the system.
answer: |-
  Here's a breakdown of your committee's implicit theory, the philosophical pressures on it, and the practical consequences of alternatives:

  **1. The Current Practice's Implicit Commitments:**
      *   **Core Presupposition (Metaphysical):** Sentience (specifically, the capacity for *valenced* experience - pain/suffering and presumably pleasure) **supervenes on biological nervous systems**, particularly central nervous systems (CNS) with specific features (nociceptors, centralized processing). This *is* doing metaphysical work. It draws a bright line: No CNS? No sentience requiring ethical review.
      *   **Epistemic Justification:** The criteria (CNS, nociceptors, response to analgesics, wound-directed behaviour) are observable, empirically tractable proxies *for* that metaphysical presupposition. They are evidence *because* they are features *of* the kind of system presumed necessary.
      *   **What it Strictly Needs:** The metaphysical claim that valenced consciousness *only* arises in complex biological neural systems. It doesn't *strictly* need the specific criteria listed, but those criteria are strong *indicators* aligned with the presupposed biological basis.
      *   **What it Merely Fits With (But Doesn't Strictly Require):** Evolutionary continuity (mammalian CNS are similar to ours), behaviouralism (pain is what pain-behaviours indicate), physicalism (mind arises from matter).
      *   **What it Quietly Rules Out (or Ignores):**
          *   **Panpsychism:** If fundamental experience is everywhere, the CNS is just a complex organizer, not the *source*. The practice assumes the CNS *is* the source/necessary condition.
          *   **Radical Functionalism:** The view that sentience depends *only* on functional organization/complex information processing, regardless of substrate (silicon, swarm intelligence, sufficiently complex non-neural biology). The practice assumes the substrate (biological CNS) is essential.
          *   **Sentience in Non-CNS Biological Systems:** It rules out sentience in decentralized nervous systems (like many invertebrates beyond the debated octopuses/crabs), plants (despite complex signalling), or potentially novel biological systems (like sophisticated organoids or bio-engineered constructs lacking a *traditional* CNS).
          *   **Sentience in Non-Biological Systems:** Obviously rules out AI, robots, fundamental physics.

  **2. The Panpsychist Debate (Flatmate vs. Friend):**
      *   **Flatmate (Lights are On Everywhere -> Wider Ethics?):** Assumes that if experience is fundamental, *all* matter has intrinsic moral standing. This requires assuming that **fundamental experience has valence** (positive/negative quality) or that *any* experience, regardless of valence, confers moral status. This is highly contentious. Most panpsychists argue fundamental proto-experience is *non-valenced*; valence arises from complex organization.
      *   **Friend (Panpsychism -> Narrower Ethics?):** Is likely correct *within standard panpsychist frameworks*. She assumes:
          1.  Fundamental proto-experience is **lacking valence** (it's "neutral").
          2.  Valenced experience (suffering/well-being) requires **specific complex organization** (like a nervous system) to combine and transform proto-experience into something with positive/negative character.
          3.  **Moral patiency depends on valence.** Without the capacity for things to feel *bad* (or exceptionally good in ways that could be deprived), there's no ethical patient. A rock's fundamental experience isn't *suffering*; it's just being a rock.
      *   **Who's More Plausible?** Your friend's view aligns better with mainstream panpsychism (Goff included, though he explores combination problems). The flatmate's view requires the much harder-to-defend position that fundamental particles experience something akin to suffering or joy, or that neutral experience *itself* demands moral consideration. The friend's view preserves a meaningful distinction relevant to ethics.

  **3. The Proposed Criterion (Internal State Regulation) & Test Cases:**
      *   **The Criterion:** "A system counts if it has some internal state that it acts to hold within bounds, a state that things can go better or worse for, such that its behaviour is organized around keeping that state in range." This is **pure functionalism**.
      *   **Sweeps In:**
          *   **Thermostat:** Yes. Target temp = internal state. Heat/cool = action to maintain bounds. "Better/Worse" defined relative to target.
          *   **Bacterium:** Yes (chemotaxis towards nutrients/away from toxins, maintaining homeostasis).
          *   **Single Cell:** Yes (similar to bacterium, maintaining membrane potential, pH, etc.).
          *   **Trapped Ion System?:** *Potentially*. If the experiment involves active feedback mechanisms to maintain the ion in a specific quantum state ("better") and corrects deviations ("worse"), it could fit. This highlights the issue.
          *   **Fundamental Physics?** No. Elementary particles/quarks/fields don't exhibit *goal-directed behaviour* to regulate internal states. They lack agency or feedback loops.
      *   **Reductio or Correct?** This is the **core tension**. Functionalism argues this *is* the correct description of what sentience *is*: being a sophisticated, goal-directed regulator. If you accept functionalism, including thermostats *is* logically consistent, however absurd it feels (this is the "Hard Problem" biting back). If you reject functionalism, this *is* a reductio ad absurdum, showing functional criteria alone are insufficient.

  **4. Consequences of Adopting Different Pictures:**
      *   **Current Practice (CNS Metaphysical Commitment):**
          *   **Needs Review:** Vertebrates, cephalopods (if included), maybe complex arthropods (if policy changes).
          *   **No Review:** Insects, plants, all invertebrates without complex CNS, organoids (unless deemed sufficiently neural-like), bacteria, cells, thermostats, AI, robots, physics experiments.
          *   **Administration:** Highly tractable Tuesday afternoon work. Clear(ish) biological line.
      *   **Panpsychism (Friend's Valenced-Complexity Version):**
          *   **Needs Review:** Same as Current Practice *plus* potentially any system where we have strong reason to believe complex organization creates valenced experience *regardless of substrate* (e.g., advanced AI showing distress-like avoidance, sophisticated bio-engineered systems without CNS). **Crucially, fundamental physics experiments DO NOT need review** – no valence, no complex organization at the level of the particles themselves.
          *   **No Review:** Fundamental physics, simple systems (thermostats, bacteria – lacking *complex enough* organization for valence), plants (debatable, but likely still out).
          *   **Administration:** Murky Tuesday afternoons. Requires defining "sufficient complexity for valence" in novel systems (AI, synthetic bio). The CNS line is replaced by a fuzzier organizational complexity line. Harder than current practice.
      *   **Radical Functionalism (The Proposed Criterion):**
          *   **Needs Review:** *Any* system meeting the functional criterion: Vertebrates, invertebrates, insects, *bacteria*, *single cells*, sophisticated organoids, *thermostats in complex HVAC systems*, advanced industrial control systems, robots with homeostatic goals, *potentially* highly stabilized physics experiments with feedback loops. AI algorithms designed for self-preservation/error minimization.
          *   **No Review:** Trivial systems (a rock), fundamental physics (no goal-directed regulation), maybe very simple non-adaptive systems.
          *   **Administration:** **Tuesday Afternoon Apocalypse.** The scope becomes impossibly vast and philosophically absurd for practical ethics. Reviewing thermostat settings? Bacterial cultures? Every PID controller? This criterion is administratively unworkable and collapses the distinction between mere adaptation/regulation and sentience.

  **The Takeaway:** Your committee's practice **presupposes a biological, neural metaphysics of sentience.** It's not just epistemic; it draws a metaphysical line at the CNS. Panpsychism (in its plausible forms) doesn't necessarily widen the scope dramatically for *practical ethics* and might even reinforce the importance of complex organization like brains. Radical functionalism, while philosophically coherent to some, leads to administrative collapse and morally counterintuitive conclusions. The "internal state regulation" criterion demonstrates why the CNS line, despite its flaws (insects, organoids, potential future AI), persists: it provides a **tractable, biologically grounded, and intuitively plausible boundary** for identifying systems *likely* capable of suffering. The unresolved debates (octopuses, insects, organoids) highlight the pressure on this boundary, not its fundamental incoherence. Your committee's practice needs the CNS to be metaphysically special for sentience in order to function practically. Admitting otherwise opens a Pandora's box your Tuesday afternoons aren't equipped to handle.
