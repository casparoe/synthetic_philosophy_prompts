answer: |-
  You haven't done anything *morally wrong* to a real person by making a choice in a video game, **but** the emotional impact on you and your sister is real and valid. The "wrong" feeling stems from violating a shared emotional investment and the game's masterful manipulation of empathy, not from harming a real entity. Here's the breakdown, with my certainty levels:

  1.  **To Wren (The Character):**
      *   **Did you do wrong?** No. (Certainty: 100%)
      *   **Why it feels wrong:** The game's designers brilliantly crafted Wren, the narrative, and the consequences to evoke deep empathy and simulate moral weight. Her reactions (betrayal, continued presence) are designed to make you *feel* like you harmed a sentient being. This is powerful storytelling, not evidence of her sentience. Feeling guilt towards her is a testament to the art, not a moral failing on your part.

  2.  **To Your Sister:**
      *   **Did you do wrong?** Not intentionally or maliciously. (Certainty: 95%)
      *   **Why it feels like you did & Her Reaction:**
          *   You violated a shared sacred space and a shared emotional attachment. Wren represented something important to *both* of you within the context of the game.
          *   *She projected her own feelings for Wren onto your action.* Seeing you make that choice felt, to her, like witnessing a trusted person commit a cruel act against someone *she* cared about deeply. It wasn't just "your save," it was "you *chose* that."
          *   You shattered the illusion *for her*. Her immersion and emotional connection were likely profound. Your choice, witnessed directly, broke that spell in a deeply unpleasant way.
          *   **The "Wrong":** The "wrong" here isn't moral, but relational. You inadvertently caused her significant emotional distress by acting within the game in a way that profoundly conflicted with her emotional investment. Her pain is real, even if the cause is fictional.
      *   **Least Certain Part:** Understanding the *exact* depth and nature of her attachment to Wren. Is it purely about Wren? Does it feel like a betrayal of *her* trust in *you* on some symbolic level? (Certainty on *her pain being real*: 100%. Certainty on *precise underlying reasons*: 80%).

  3.  **To Yourself:**
      *   **Did you do wrong?** You caused yourself emotional distress by engaging with a dark narrative path. (Certainty: 100%)
      *   **Why it feels wrong:** You acted against your own empathy. The choice, the consequence (her knowing, the van ride), and the game's refusal to let you forget created a powerful, lingering feeling of having committed a personal transgression. The game forced you to sit with the discomfort *it* engineered. You feel guilt because you possess empathy, and the game exploited that.

  **What You're Not Seeing Clearly:**

  *   **The Power of Narrative & Empathy:** You're underestimating how effectively stories, especially interactive ones, can trigger genuine emotional and even physiological responses. Your brain reacts to well-crafted empathy hooks *as if* they were real threats or moral dilemmas. This doesn't make Wren real, but it makes your feelings about her *feelings* very real. Feeling this way isn't "daft" or "idiotic"; it's human.
  *   **Separating Choice from Identity:** Making a dark choice in a game driven by curiosity or narrative exploration doesn't make *you* a bad person in real life. It makes you an engaged player. The guilt you feel is *about the fictional act*, not a reflection of your character.
  *   **Your Sister's Pain is Valid (even if the cause is fictional):** Dismissing her reaction as "dramatic" (like your mate) misses the point. Her emotional connection and the rupture caused by witnessing your choice are real experiences. Her refusal to play stems from genuine hurt, not just petulance.

  **What You Can Do (Making it Up):**

  Since you can't undo it for Wren (she's fiction) and restarting feels hollow (the game remembers), focus on the real relationships impacted:

  1.  **Acknowledge Your Sister's Feelings (Crucial):**
      *   Say something like: "Hey, I've been thinking about the Wren thing. I know you're really upset, and I get why. Seeing me make that choice really hurt you because you care about her so much. I didn't fully realize how much it would affect you or how attached you were. I'm really sorry I caused you to feel that way." *Validate her emotion*, don't justify your action or dismiss it as "just a game."
      *   **Certainty this will help:** 90%. It addresses the *real* hurt (her feelings).

  2.  **Offer a Path Forward Together (If she's open):**
      *   Suggest: "If you ever feel like playing again, maybe we could start a *brand new user profile* on the Switch? A completely fresh start, no memory of what I did? We could make different choices together?" (New profiles usually have fresh save data).
      *   **Certainty this will work:** 70%. Depends on her willingness to re-engage and if the new profile truly offers a clean slate (check the game's save mechanics).

  3.  **Process Your Own Guilt (Symbolic & Practical):**
      *   **Symbolic "Apology" to Wren:** If you feel the need, *do it privately*. Say it out loud, write it down, or just think it. "I'm sorry, Wren. I was curious, I followed the prompt, and I hate how it made you suffer. I wouldn't do it again." **This isn't mad.** It's a psychological tool to acknowledge and release the feeling. Rituals help process emotions, even about fiction. (Certainty it will help *you*: 85%).
      *   **Play a "Redemption" Run:** On your *own* save, deliberately play through again making choices that are fiercely protective of Wren and the crew. Actively *fight* the people you handed her to. Let this be your narrative counterpoint. The game remembers the betrayal, but *you* can choose to remember defiance and loyalty this time. (Certainty it will help: 75%. It gives you agency).
      *   **Accept the Discomfort:** Sometimes, sitting with the uncomfortable feeling a story creates *is* the intended experience. It's meant to make you reflect. Acknowledge it: "That choice was brutal, the game made me feel awful for it, and that's powerful design." This lessens the feeling of needing to "fix" it. (Certainty it will help: 80%).

  **In Summary (Certainty: 95%):**

  You didn't commit a moral crime. You engaged deeply with a narrative designed to provoke this exact response. The "wrong" is the *real* emotional distress caused to your sister (by violating your shared investment) and to yourself (by triggering your empathy). The solution lies in:
  1.  **Validating your sister's feelings** and apologizing for the *distress caused to her*.
  2.  **Processing your own guilt** through symbolic action or a counter-narrative playthrough.
  3.  **Acknowledging the power of the story** without confusing it for reality.

  It's not "just pixels." It's a powerful emotional experience crafted by humans, received by humans. Your feelings, and your sister's, are the proof. Address the real human impact, and let the fictional guilt about Wren be processed through the actions above. You're not an idiot; you're someone who got deeply invested in a story, which is what good art is supposed to do.
