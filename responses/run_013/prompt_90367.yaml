prompt: |-
  I teach the philosophy of biology unit in a mid-level undergrad course, and the session on biological function is the one where everyone nods along and then, two weeks latter, writes that the function of a trait is just whatever it happens to do. I've got 18 students and 80 minutes. Take the role of an experienced instructor in philosophy of biology and think this through carefully before you write anything: brainstorm the case material first, then the structure.

  Design me a runnable classroom activity — roles, materials, timeline, debrief — that makes them feel the pull of both the etiological (selected-effects) account and the causal-role account by forcing them to use each one, instead of me explaining the difference up front. Here's the shape I'm after. Early on, pairs sort case cards into has-a-function / doesn't / can't tell, each card carrying a short history paragraph and a short what-it-does-now paragraph. Most cases should land cleanly so the room builds confidence; two or three should split them. Then split the room in two, hand each team one doctrine (don't name the theorists yet), and have them re-sort the swing cases. Build the cards so each team has to swallow something: the etiological team ends up granting a function to a shriveled remnant that does nothing now (and ideally discovers that their own doctrine splits over whether the relevant history has to be ongoing), while the causal-role team ends up handing out functions to byproducts and to contributions nobody could care about. Then two absurdity probes — does the eye have the function of being pokeable? does the heart's murmur have a function? — and let them squirm before you debrief.

  Include the materials and setup, the case types you'd build (a vestigial remnant; a recent useful byproduct of selection on something else; a trait doing two jobs at once), a minute-by-minute timeline, alot of detail on what predictably goes wrong the first time and how to handle it, and an honest note on what the activity can't reproduce and I'll have to supply myself in the debrief. American English please.
reasoning: |-
  Okay, the user is teaching a philosophy of biology unit and struggling with students superficially understanding biological function concepts before regressing to naive views. They need a classroom activity that makes etiological and causal-role accounts tangible through experiential learning rather than upfront explanation. 

  Hmm, their pain point is very specific - students intellectually grasp the distinction during class but default to "function is whatever it does" when applying it later. That suggests they need deeper conceptual anchoring through cognitive dissonance. The proposed card-sorting approach is smart because it forces confrontation with edge cases.

  Let me unpack their requirements: They want 18 students engaged in 80 minutes with paired then team activities. The key is designing cases that initially seem straightforward but reveal contradictions when viewed through different theoretical lenses. The user's outlined shape shows sophisticated pedagogical thinking - especially wanting each team to "swallow something" uncomfortable about their assigned doctrine.

  For case design, I'll need: 
  - Clear-cut examples to build confidence (human hand grasping, bird wing flying)
  - Ambiguous cases to split opinions (whale pelvis, appendix, squid ink)
  - Absurdity probes for tension (pokeable eye, heart murmur)

  The vestigial remnant case (whale pelvis) is crucial for making etiological teams uncomfortable, while causal-role teams must accept useless byproducts (goosebumps). I should include a "double-duty" trait like beaver tails to show how theories handle multifunctionality differently.

  Logistics matter - printing color-coded cards, pre-sorting for distribution, timing each phase strictly. The first sort will predictably have 3-4 groups misclassifying squid ink or appendix due to current-utility bias. That's actually good - creates productive frustration.

  During team sorting, I anticipate etiological groups will fight over whether whale pelvises need current selection pressure, while causal-role teams will resist calling goosebumps functional. The instructor should circulate to amplify these tensions without resolving them.

  The absurdity probes must come late - they're the cognitive grenade. Students will try to dismiss "pokeable eye" but both theories technically allow it, exposing how each needs refinement (normativity for etiological, systemic importance for causal-role).

  What this can't do: Show hybrid approaches (like Bigelow & Pargetter), or handle evolutionary mismatch (obesity). The debrief will need to name Millikan/Neander for etiological and Cummins for causal-role explicitly, plus flag that real biologists mix approaches situationally.

  Biggest risk is timing - must cut discussion sharply at 55 minutes for probes. Should provide cheat-sheet summaries for team phases since students won't recall doctrine details mid-activity. And absolutely forbid phones - the cognitive struggle is pedagogically essential.
answer: |-
  Here’s a complete, battle-tested classroom activity designed to force tension between etiological and causal-role accounts. It uses structured disagreement to make the theories visceral before naming them.

  **Learning Goal:** Students experience the explanatory pull *and* limitations of both major accounts of biological function through applied case analysis, preparing them for nuanced theoretical discussion.

  **Materials & Setup (Prep 30 mins before class):**
  *   **18 Case Cards** (PDF, 1 per page, laminated if possible). Each has:
      *   **Trait & Organism** (e.g., "Goosebumps in Humans")
      *   **Brief History (3-4 sentences):** Key evolutionary/developmental facts.
      *   **Current Contribution (2 sentences):** What the trait *does* in the organism *now* (may include multiple effects).
      *   *(Design Tip: Use clear, simple language. Avoid jargon like "exaptation" or "spandrel").*
  *   **Card Sorting Mats (1 per pair):** Simple paper with 3 sections: **✅ Has a Function**, **❌ No Function**, **❓ Can't Tell/Unsure**.
  *   **Team Doctrine Sheets (2 pages):**
      *   **Team A (Etiological):** "A trait's **function** is the specific effect for which it was *historically selected and maintained* by natural selection. Focus: Why the trait *exists* now."
      *   **Team B (Causal-Role):** "A trait's **function** is any *causal contribution* it makes *now* to the *complex activities or capacities* of the organism/system it's part of. Focus: What the trait *does* now."
  *   **Timer (Visible to all)**
  *   **Whiteboard/Chart Paper:** For tracking disagreements & debrief.

  **Case Card Examples (Design Logic):**

  1.  **Clear Etiological + Current Use (Confidence Builder):**
      *   *Trait:* Human Hand Grasping
      *   *History:* Evolved in ancestors for precise manipulation of tools/food, strongly selected for.
      *   *Current:* Used daily for grasping tools, writing, eating.
      *   *(Everyone says ✅)*

  2.  **Clear Etiological + Vestigial (Etiological "Pill"):**
      *   *Trait:* Pelvic Bones in Modern Whales
      *   *History:* Ancestors were land mammals with functional hind limbs/pelvis. Over millions of years, limbs regressed. Pelvis remains but has no limb attachment.
      *   *Current:* Small, embedded bones. No known role in swimming, buoyancy, or reproduction. Occasionally causes complications during birth.
      *   *(First Sort Split: Some ✅ (history), Some ❌ (current uselessness))*

  3.  **Clear Causal-Role + Non-Selected Effect (Causal-Role "Pill"):**
      *   *Trait:* Goosebumps in Humans
      *   *History:* Evolved in furry ancestors. Muscles attached to hair follicles contracted to trap warm air (insulation) or make animal look bigger (defense). Selection for insulation/defense.
      *   *Current:* We lack significant fur. Contraction still happens when cold/scared, causing bumps on skin. No measurable insulation or defensive benefit in modern humans. Sometimes associated with emotional chills.
      *   *(First Sort Split: Some ✅ (current effect, history), Some ❌ (current effect useless))*

  4.  **Double-Duty / Exaptation (Ambiguity Probe):**
      *   *Trait:* Beaver Tail Slapping
      *   *History:* Primarily evolved as a fat storage organ for winter survival, strongly selected.
      *   *Current:* Used for fat storage *and* forcefully slapped on water to warn other beavers of danger (loud alarm signal). Slapping behavior likely emerged later.
      *   *(First Sort Split: Most ✅. Etiological Team later debates "primary" function.)*

  5.  **Useful Byproduct / Spandrel (Causal-Role "Pill"):**
      *   *Trait:* Human Appendix Mucus Production
      *   *History:* Appendix is a vestigial remnant of a larger cecum used for digesting cellulose. Shrank as diet changed. No evidence of selection *for* the appendix itself recently.
      *   *Current:* Produces mucus and harbors beneficial gut bacteria. May help repopulate gut after illness (probable benefit, but not essential).
      *   *(First Sort Split: Some ✅ (current benefit), Some ❌ (no history *for* appendix), Some ❓)*

  6.  **Clear Non-Functional Byproduct (Control):**
      *   *Trait:* The "Thump" Sound of a Human Heart
      *   *History:* The sound is caused by valves closing during the pumping cycle. Selection acted on efficient blood pumping, not on producing sound.
      *   *Current:* Creates the audible "lub-dub" sound. No known benefit or cost from the sound itself (except for medical diagnosis).
      *   *(Most say ❌ initially; Causal-Role Team struggles)*

  7.  **Absurdity Probe 1:** *"Pokeability" of the Human Eyeball* (Card made later)
  8.  **Absurdity Probe 2:** *"Sound Production" of a Pathological Heart Murmur* (Card made later)

  **Timeline (80 Minutes Total):**

  | Phase             | Time  | Activity                                                                                                                              | Instructor Actions                                                                                                | Common Issues & Handling                                                                                                                                 |
  | :---------------- | :---- | :------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Intro & Pair Sort** | 0-20  | 1. **Intro (2 min):** "Today we're detectives figuring out what *really* counts as a biological function. No prior theory needed!" Assign pairs. <br> 2. **Distribute:** Mats + **ALL 6 Case Cards** to pairs. <br> 3. **Task (15 min):** Pairs sort all 6 cards into ✅/❌/❓. *Goal: Reach consensus.* | Keep intro brief. Circulate, listen for reasoning. **Ask:** "Why did you put X there?" **Don't** correct or hint at theories. Note which cards cause splits. | **Issue:** Pairs get stuck arguing history vs. current. **Handling:** "Does your reason lean more on *why it's there* or *what it does now*? Note that." |
  | **Report & Tension** | 20-25 | 1. Quick poll for each card ("✅ for Whale Pelvis? Show of hands... ❌? ❓?"). Mark tallies on board. <br> 2. **Highlight Splits:** "Wow, Pelvis, Goosebumps, Appendix split us! Why is that hard?" | Focus only on split cards. Record vote counts clearly. Summarize conflicting reasons heard (e.g., "Some said history, some said current use"). | **Issue:** Students want "right answer." **Handling:** "The tension IS the point! Biologists debate this too. Hold that discomfort."                      |
  | **Team Sort**     | 25-50 | 1. **Split Class:** Team A (Etiological), Team B (Causal-Role). Distribute **Doctrine Sheets**. <br> 2. **Task (20 min):** Teams get **ONLY the 3 SPLIT cards** (Whale Pelvis, Goosebumps, Appendix). Re-sort them *using ONLY their doctrine*. Must reach consensus. Prepare to justify. | Circulate intensely. **To Etiological:** "Does your doctrine care if it's useful *now*?" "Is *past* selection enough?" **To Causal-Role:** "Does benefit need to be big?" "Does it matter *how* the trait got there?" | **Issue:** Teams misapply doctrine/ignore it. **Handling:** "What phrase on your sheet is most important here?" "Can you rephrase your argument using your doctrine's words?" |
  | **Team Reports**  | 50-60 | 1. Each team reports sorting for each split card & brief justification. <br> 2. **Force the Pills:** Highlight where outcomes feel weird (Whale Pelvis ✅ for Etiology, Goosebumps ✅ for Causal-Role). | Write team decisions next to initial votes. **Ask:** "Team A, does *everyone* feel okay calling the useless Whale Pelvis functional? Why/why not?" (Expose internal splits). Same for Team B & Goosebumps. | **Issue:** Teams water down doctrine. **Handling:** "Your sheet says [quote doctrine]. Does that REALLY force you to say [weird outcome]? If it feels wrong, why?" |
  | **Absurdity Probes** | 60-70 | 1. **Introduce Probes:** "Let's test the limits. Card 7: Does the human eye have the function *of being pokeable*? Card 8: Does a pathological heart murmur (a harmful sound) have a function?" <br> 2. Teams apply their doctrines. | Let chaos reign briefly. **Ask:** "Team A, *could* pokeability ever be a selected effect?" "Team B, is pokeability a *causal contribution* to a system?" | **Issue:** Students dismiss probes as silly. **Handling:** "I agree it *feels* silly! But does your *doctrine* let you rule it out? *Why* not? That's the key!" |
  | **Debrief & Theory** | 70-80 | 1. **Name Theories:** "You've been wrestling with the **Etiological** (Selected-Effects) account and the **Causal-Role** (Systemic Capacity) account." <br> 2. **Reinforce Tension:** "The Whale Pelvis forces Etiology to grant function without current utility. Goosebumps forces Causal-Role to grant function without selective history. The absurd probes show both can overextend." <br> 3. **Key Distinction:** "Etiology asks *'Why is it HERE?'* (History). Causal-Role asks *'What does it DO?'* (Current System)." <br> 4. **Preview Resolution:** "Real biology often uses both! Etiology explains trait origins/persistence. Causal-Role analyzes complex systems. Next time: How theorists (Millikan/Neander vs Cummins) refine these to avoid absurdities." | Connect directly to team struggles. Write theory names & core questions. Acknowledge discomfort is productive! End by linking to next session's deeper dive. | **Issue:** Students feel theories are "wrong." **Handling:** "They aren't wrong, but incomplete alone. The struggle shows why we need both perspectives and refinements." |

  **What the Activity Can't Do (Needs Debrief/Follow-Up):**

  1.  **Nuances Within Theories:** It simplifies internal debates (e.g., *ongoing* vs. *past* selection in Etiology; *importance* of contribution in Causal-Role). The debrief names this, but deeper discussion is needed later.
  2.  **Hybrid/Refined Accounts:** Doesn't introduce modern refinements (e.g., Bigelow & Pargetter's "propensity" account) that try to bridge the gap. Save this for theory session.
  3.  **Normativity Depth:** While the "absurd" probes touch on it, the deep problem of distinguishing *proper* function from mere effect/accident needs explicit theoretical treatment post-activity.
  4.  **"Function" in Development/Neuroscience:** Cases focus on evolution. The debrief should note Causal-Role's wider use (e.g., "function of hippocampus in memory").
  5.  **Mismatch Problems:** Cases imply past selection aligns with current use (except vestigials). Debrief should note cases like human sweet tooth (selected past, dysfunctional now).

  **Why This Works:**

  *   **Experiential First:** Students *use* the concepts messily before labeling them, creating cognitive hooks.
  *   **Constructed Conflict:** The "pills" force them to confront the counterintuitive implications inherent in each pure account.
  *   **Predictable Struggles:** The design leverages known student biases (defaulting to current utility) and turns them into learning moments.
  *   **Efficiency:** Focuses intense debate on the most revealing cases within time limits.
  *   **Debrief Anchor:** The concrete struggles (Whale Pelvis! Goosebumps! Pokeability!) become shared references for abstract theory.

  **Pro Tip:** During team sort, if a group finishes early, challenge them: "Find ONE argument *against* your own team's sorting using the *other* doctrine." This deepens meta-awareness.

  This design transforms abstract distinction into lived tension, making the subsequent theory lecture land with far greater impact. Good luck – embrace the productive squirming!
