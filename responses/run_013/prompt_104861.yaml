  **Expected Issues and Handling:**
  1. **They propose score voting or approval voting:** Explain that the club's constitution requires a ranking of the candidates (not just a winner) and that the rule must produce a full ranking. Also, we are focusing on ranking-based methods. But we can acknowledge that other methods exist and have their own trade-offs.
