  We are going to design an in-class game to illustrate Arrow's impossibility theorem. The goal is for students to experience the impossibility of designing a fair voting system that satisfies a set of reasonable conditions.

  **Key Conditions from Arrow's Theorem (to be illustrated):**
  1. **Unrestricted Domain:** The voting system should be able to handle any possible preference profile (any set of individual rankings).
  2. **Pareto Efficiency:** If every voter prefers candidate A over candidate B, then the group ranking must have A above B.
  3. **Non-dictatorship:** There is no single voter whose preferences always determine the group's preferences.
  4. **Independence of Irrelevant Alternatives (IIA):** The group's relative ranking of any two candidates (say A and B) should depend only on the voters' relative rankings of A and B, and not on the rankings of some other candidate C.

  The activity will have the students design a voting rule that outputs a full ranking and a winner. They will run into problems that violate IIA (with the stress tests) and non-dictatorship (if they try to appoint a chair), and they might also see cycles (which violate transitivity and show that majority rule might not produce a ranking).

  **Materials:**
  - Index cards for role cards (18 students, so 18 cards)
  - Whiteboard for recording proposals and outcomes
  - Timer
  - Bag of candy for payoffs

  **Role Cards:**
  Each card has:
  - A ranking of three candidates (A, B, C) in order of preference (e.g., A > B > C)
  - A one-line reason tied to a personal stake (e.g., "Candidate A will fund your committee, while Candidate C will cut it.")

  We need to set up preference profiles that will cause:
  1. A cycle in pairwise majority voting (Condorcet cycle).
  2. A situation where adding a fourth candidate (or removing one) flips the order of two candidates that no one changed their mind about.

