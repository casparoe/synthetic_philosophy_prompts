answer: |-
  Here’s a complete, runnable 80-minute activity designed to make students **experience Arrow's impossibility theorem** through a constitutional convention game. Students will build a voting rule, watch it break, and confront the theorem’s core conditions without prior jargon.

  ---

  ### **Activity: Student Club Coordinator Election**
  **Goal:** Students design a "fair" voting rule to rank 3 candidates and hire a coordinator. Through gameplay, they hit Arrow’s walls: **cycles** (intransitivity), **IIA violations** (ranking flips from irrelevant changes), and **agenda manipulation**.

  ---

  ### **Materials & Setup**
  - **Role Cards (18):** Index cards with:
    - A preference ranking of candidates **A, B, C**.
    - A one-line "personal stake" (e.g., "Candidate A funds your committee; C cuts it").
    - **Distribution:** Pre-generate 3 sets (see below).
  - **Whiteboard:** Track proposed rules, votes, and outcomes.
  - **Candy Payoffs:** 3 points = top choice wins, 2 = second, 1 = third, 0 = fourth (if added). Points trade for candy post-game (e.g., 1 point = 1 candy).
  - **Timer:** Keep discussions tight.

  ---

  ### **Role Cards (3 Sets for Stress Tests)**
  Generate cards using these profiles. **Re-distribute cards when shifting sets.**  
  *(Reasons should tie to club roles: e.g., "A funds your committee," "B prioritizes internships," "C cuts budgets")*.

  - **Set 1 (Cycle):** 7 voters  
    `A > B > C` | `B > C > A` | `C > A > B`  
    *Distribution: 7-6-5 for 18 students (scale evenly: 7A>B>C, 6B>C>A, 5C>A>B)*  
    *Trigger: Pairwise majority produces a cycle.*

  - **Set 2 (IIA Test - Add Candidate D):** 18 voters  
    `A > B > C` | `B > C > A` | `C > A > B`  
    *Distribution: 8-5-5*  
    *Trigger: Add D; Borda flips A vs B.*

  - **Set 3 (IIA Test - Withdraw Candidate):** 18 voters  
    `A > C > B` | `B > A > C` | `C > B > A`  
    *Distribution: 8-5-5*  
    *Trigger: Remove C; A vs B flips.*

  ---

  ### **Game Rules**
  - **Hidden Preferences:** Students keep rankings secret (emulates private preferences).
  - **Rule Requirements:** Any proposed rule must:
    - Input: All individual rankings.
    - Output: A **full ranking of candidates** and a winner.
    - Be "fair" (students define this; guide toward unanimity, no dictator, etc.).
  - **Adopting Rules:** Majority vote to accept/reject proposals.  
  - **Payoffs:** Awarded based on final group ranking after each test.

  ---

  ### **Timeline (80 Minutes)**
  **Goal:** Students propose rules → hit walls → stress-test → debrief Arrow.

  | Time  | Phase                          | Key Steps                                                                 |
  |-------|--------------------------------|---------------------------------------------------------------------------|
  | 0-5   | **Intro & Setup**              | Explain: "Your club hires a paid coordinator. Your role card has a ranking and stake. Points = candy. Propose a fair voting rule that ranks all candidates." Distribute **Set 1** cards. |
  | 5-25  | **Round 1: Pairwise Cycle**    | Students propose **pairwise majority**. Run it: <br> - A vs B: A wins (7+5=12 > 6) <br> - B vs C: B wins (7+6=13 > 5) <br> - C vs A: C wins (6+5=11 > 7) → **Cycle!** No ranking. "Fix this with a rule that always works." |
  | 25-40 | **Round 2: Ranking Rule**      | Students propose a ranking rule (likely **Borda**). If not, guide them. Run Borda (points: 2-1-0): <br> - **Set 1:** A=19, B=19, C=16 → Tie → **Requires tiebreaker** (students see problem). <br> - **Switch to Set 2:** A=21, B=18, C=15 → Ranking: **A>B>C**. |
  | 40-50 | **Stress Test 1: Add Candidate D** | "A new candidate D enters. Update your rankings." Instruct: <br> - 8 `A>B>C` voters → `A>B>D>C` <br> - 5 `B>C>A` voters → `B>D>C>A` <br> - 5 `C>A>B` voters → `D>C>A>B` <br> Re-run Borda (points: 3-2-1-0): **D=33, B=31, A=29, C=15** → Ranking: **D>B>A>C**. <br> 😲 **A was beating B, now B beats A!** (Original: A>B; New: B>A). |
  | 50-60 | **Stress Test 2: Withdraw Candidate** | "Candidate C withdraws. Re-rank A and B only." Distribute **Set 3** cards. <br> Run Borda (points: 2-1-0): **A=21, C=18, B=15** → Ranking: **A>C>B** → **A beats B**. <br> "Remove C. Re-rank A and B with same rule." Run majority: A=8, B=10 → **B beats A**. <br> 😲 **A was beating B, now B beats A!** |
  | 60-70 | **Bonus: Agenda Manipulation** | Use **Set 1**. Run pairwise votes in different orders: <br> - Order 1 (A vs B, then winner vs C): A → C wins <br> - Order 2 (B vs C, then winner vs A): B → A wins <br> → **Winner changes based on vote order!** |
  | 70-80 | **Debrief**                    | Map to Arrow (below). |

  ---

  ### **Predicable Problems & Solutions**
  1. **"Let’s use score/approval voting!"**  
     *Response:* "Our rule must output a *full ranking*, not just a winner. Try again."

  2. **"A chair should break ties!"**  
     *Response:* "Is it fair if one person overrides everyone? Let’s vote on that rule." → When adopted, point out: "This is a dictator. Is that fair?"

  3. **"The cycle is unrealistic!"**  
     *Response:* "But your rule must work for *any* preferences, even rare ones. What if this happens?"

  4. **Time crunch:**  
     - Use strict timers (e.g., "3 minutes to propose a rule").  
     - Pre-write role distributions on the board.

  ---

  ### **Debrief: Mapping to Arrow’s Theorem**
  **Do NOT name conditions until after students feel the pain.** After gameplay, say:  
  *"You encountered 3 walls. Arrow’s theorem says these are unavoidable:"*

  | Game Moment                     | Arrow’s Condition               | Why It’s Impossible                                                                 |
  |---------------------------------|---------------------------------|-------------------------------------------------------------------------------------|
  | **Cycle in pairwise voting**    | Transitivity (implied by ordering) | Majority rule can’t always produce a coherent group ranking.                   |
  | **Ranking flipped after adding/removing a candidate** | Independence of Irrelevant Alternatives (IIA) | The group’s A>B ranking changed even though no one changed their A vs B opinion. |
  | **Dictator proposal**           | Non-Dictatorship                | Letting one person decide violates fairness.                                       |
  | **Agenda manipulation**         | Neutrality (implied by IIA)     | Pairwise voting isn’t neutral—vote order changes the winner.                     |

  **Honest Limitations:**  
  *"This game can’t show everything. Arrow’s proof holds for:  
  - Any number of voters (≥2) and candidates (≥3).  
  - All possible preferences (unrestricted domain).  
  - A formal proof that no such rule exists (we saw examples, not a proof)."*

  **Closing:**  
  *"You didn’t just learn a fun fact—you hit the wall. Every voting rule has a flaw. That’s Arrow."*

  ---

  ### **Why This Works**
  - **Students build the trap:** They propose rules and watch them fail.  
  - **No trivia:** Focus on creating rules, not recalling real-world systems.  
  - **Stress tests are cheat codes:** The profiles force IIA violations.  
  - **Debrief connects pain to theory:** No jargon until they’re frustrated.  

  Run this, and they won’t treat Arrow as a "fun fact"—they’ll remember the wall they built and crashed into.
