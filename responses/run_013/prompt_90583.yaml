answer: |-
  Below is a systematic audit of the language-morality analogy, structured to address your queries. I’ll first map the correspondence explicitly, then identify breaks in the analogy, test its predictive power, dissect disanalogies bearing on moral objectivity, expose smuggled assumptions, and finally assess whether the proponent’s conclusion survives. The goal is not to dismiss the analogy (it *does* usefully highlight certain features) but to reveal where it strains or misleads.

  ### I. Explicit Correspondence Table
  | **Linguistic Concept**          | **Moral Analogy (as proposed)**                         | **Notes**                                                                 |
  |---------------------------------|--------------------------------------------------------|---------------------------------------------------------------------------|
  | **Universal Grammar (UG)**      | Innate moral foundations/faculty                      | Hypothesized innate moral "core" (e.g., harm, fairness, hierarchy modules) |
  | **Parameters/Settings**         | Culturally variable norms/rules                       | e.g., *How* harm is defined (killing in war vs. euthanasia), virtues prioritized |
  | **Surface Variation (Dialects)**| Observable moral diversity                            | e.g., Honor cultures vs. WEIRD individualism, dietary taboos, marriage norms |
  | **Competence**                  | Idealized moral reasoning capacity                   | Underlying cognitive ability to grasp moral "rules"                       |
  | **Performance**                 | Actual moral judgments/behaviors                      | Influenced by emotion, bias, context (e.g., hypocritical or inconsistent judgments) |
  | **Acquisition Device**          | Early moral development mechanisms                   | Proposed innate "moral sense" refined by cultural input during critical periods |
  | **Grammaticality Judgments**    | Intuitive moral wrongness/acceptability              | e.g., Trolley problem intuitions, disgust responses, blame assignment      |

  ---

  ### II. Where the Analogy Breaks Down
  1. **Truth-Aptness and Error**  
     - *Linguistics*: "Dog" means *dog* only by convention. No "truth" to track; a community **cannot be mistaken** about its own grammar (e.g., if native speakers accept "I dogs love," it *is* grammatical).  
     - *Morality*: Moral claims (e.g., "slavery is unjust") present themselves as objectively true/false. Communities **can be mistaken** (e.g., past societies condoning slavery). This asymmetry is **genuine** and **cuts against the argument**: if morality is truth-apt, universal structure ≠ truth-tracking (it could be universal error).  

  2. **Functional Origins**  
     - *Linguistics*: UG is widely argued to be a domain-specific adaptation for communication. "Correctness" is defined by convention.  
     - *Morality*: While moral cognition likely has evolutionary roots (e.g., cooperation, empathy), its **normative force** feels external (we condemn past societies *as wrong*, not merely "using different settings"). The analogy smuggles in **conventionalism**, but morality rejects it: we don’t treat genocide as "ungrammatical" but as *evil*.  

  3. **Parameter Setting vs. Normative Disagreement**  
     - *Linguistics*: Parameters generate predictable variation (e.g., null-subject languages). Disagreements are resolvable by native intuition.  
     - *Morality*: Many cross-cultural clashes (e.g., infanticide in scarcity vs. absolute sanctity of life) aren’t "parameter resettings" but **fundamental conflicts** with no shared resolution mechanism.  

  4. **Acquisition and Plasticity**  
     - *Linguistics*: Children acquire complex grammar from fragmentary input; creoles emerge rapidly.  
     - *Morality*: Moral "acquisition" is more susceptible to explicit teaching, coercion, and trauma (e.g., child soldiers internalizing novel norms). No moral equivalent of **pidgins/creoles** robustly confirms this: while hybrid moral systems exist (e.g., syncretic religions), they lack the rapid, structured grammaticalization of linguistic creoles.  

  ---

  ### III. Predictive Power: Does the Analogy Generate Testable Hypotheses?
  - **Predicted**: Moral "pidgins" (simplified norms in trade/multicultural hubs) and "creoles" (structured hybrid systems).  
  - **Reality**:  
    - *Pidgin-like*: Temporary norms in refugee camps or trading posts (e.g., neutral dispute resolution).  
    - *Creole-like*: Post-colonial legal systems (e.g., Indian Penal Code blending British and indigenous norms).  
  - **Problem**: These lack the **innate grammatical structure** of linguistic creoles. Moral hybrids are often unstable, contested, and lack evidence of a UG-driven "bioprogram" (e.g., UN human rights norms are negotiated, not spontaneously generated). This suggests weaker innate constraints.  

  ---

  ### IV. Smuggled Assumptions
  1. **Universal Grammar’s Empirical Status**: The analogy assumes UG is uncontested. But UG faces challenges (e.g., statistical learning models). If UG is overstated, the moral analogy crumbles.  
  2. **Conventionalism**: Language treats norms as arbitrary; morality treats them as objective. The analogy quietly imports **anti-realism** (norms = conventions), undermining moral objectivity.  
  3. **Shared Core = Truth-Tracking**: The analogy assumes universality implies truth. But universality could arise from shared **cognitive biases** (e.g., loss aversion) or **evolutionary constraints** (e.g., kin selection), not moral facts.  

  ---

  ### V. Does the Conclusion Survive?
  **No.** The analogy carries the conclusion ("variation doesn’t threaten objectivity") by:  
  - Equating universality with truth-tracking (but language isn’t truth-apt!).  
  - Ignoring that a "shared moral core" (e.g., harm avoidance) could be **adaptive** (promoting survival) or **projectivist** (imposing structure on experience), not objective.  
  - Overlooking corrigibility: We revise moral norms (e.g., rejecting divine command) based on reasons, not just parameter resettings.  

  **The disanalogies are fatal to her argument**: Cultural variation *does* threaten strong moral objectivity if (a) disagreements are fundamental, (b) progress implies past error, and (c) universality is explained by non-truth-tracking mechanisms.  

  ---

  ### VI. A Better Analogy: **Folk Biology**
  - **Correspondence**:  
    - *Universal Core*: Innate categorization of living things (e.g., essentialism, teleology).  
    - *Surface Variation*: Culture-specific taxonomies (e.g., different species classifications).  
  - **Supports**: Cross-cultural universals in cognition (e.g., all cultures distinguish plants/animals).  
  - **Does Not Support**: Truth-tracking. Folk biology is adaptive but often **wrong** (e.g., pre-Darwinian life classifications). Universality stems from cognitive constraints, not ontological truths.  
  - **Advantage**: Explains why moral cognition feels objective (like folk biology’s "natural" categories) without requiring moral facts. Variation is unproblematic because objectivity isn’t claimed.  
  - **Limitation**: Doesn’t resolve moral realism/anti-realism debates—but neither does the language analogy.  

  **In sum**: The language analogy usefully highlights cognitive universals but fails to protect moral objectivity. It conflates *structure* with *truth*, while folk biology better captures how universality + variation coexist without implying a mind-independent moral reality. The WEIRD problem remains a challenge: if moral "grammar" varies parametrically, why are WEIRD populations statistical outliers? This suggests deeper cultural scaffolding than the analogy allows.
