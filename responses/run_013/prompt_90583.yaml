  3) Check if the analogy makes testable predictions (like moral pidgins/creoles)
  4) Examine disanalogies relevant to the objectivity claim, especially regarding truth-aptness and possibility of error
  5) Reveal what the analogy might be smuggling in (like assumptions about universal grammar or moral conventionalism)
  6) Assess whether her conclusion survives these disanalogies
  7) Suggest a better analogy if needed

  Key asymmetries I need to address:
  - Language isn't inherently truth-apt ("dog" meaning dog is conventional), while morality claims to be about objective truths
  - Communities can't be wrong about their grammar but can be wrong about morality (e.g., condemning interracial marriage)
  - The analogy might import contested assumptions from linguistics (like strong universal grammar) or presuppose that shared structure implies truth-tracking rather than shared projection

  I should build the correspondence table carefully. The universal grammar would map to innate moral foundations/faculties, parameters to cultural variations, competence to moral reasoning capacity, etc. But immediately problems emerge: moral "grammaticality" judgments are contested (e.g., trolley problems), and moral acquisition seems more influenced by explicit teaching than language.

  For testable predictions: if morality were like language, we might expect moral "creoles" to emerge quickly in mixed communities. While there are hybrid moral systems (e.g., post-colonial codes), they don't show the same rapid grammaticalization as linguistic creoles. This suggests weaker innate constraints.

  The crucial disanalogy is truth-aptness. Even if we grant a universal moral grammar, it could be an evolutionary adaptation (like disgust) rather than a truth-detector. The analogy quietly assumes that structure implies objectivity, but that doesn't hold for other domains like food preferences (also universal but not objective).

  The conclusion about moral objectivity doesn't survive because:
  1) Shared structure ≠ truth-tracking (could be projective or adaptive)
  2) Moral disagreement often feels substantive, not just parametric
  3) Moral progress suggests corrigibility unlike grammar

  A better analogy might be folk biology: all cultures categorize nature, showing universal patterns, but this reflects cognitive constraints and adaptive needs rather than "correct" taxonomy. It explains universality without committing to objectivity.

