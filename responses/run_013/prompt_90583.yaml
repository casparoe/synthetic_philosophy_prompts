  Hmm, this is a fascinating philosophical and psychological puzzle. The user is sitting in on a graduate seminar about the WEIRD problem in moral psychology, where another student keeps using a language analogy to defend moral objectivity despite cross-cultural variation. The user wants me to critically audit this analogy rather than simply accept or reject it.

  First, I need to unpack the analogy fully. The student is claiming that moral cognition is like language: surface variations (different moral norms across cultures) don't undermine a universal moral core, just like different languages don't undermine universal grammar. She then concludes this supports moral objectivity since a shared moral grammar would indicate we're tracking moral truths.

  The user wants me to: 
