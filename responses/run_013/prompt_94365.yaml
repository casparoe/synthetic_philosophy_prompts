prompt: |-
  A friend and I spent most of last night arguing about whether consequentialism demands too much of us — she thinks a morality that requires you to keep giving until the next dollar does more good in a stranger's hands than in yours is one nobody could live by, I think that is mostly an excuse — and we settled nothing. I would rather put the argument to work. I run donor advising at a small giving-advice outfit: people come to me wanting to know how much they are actually obligated to give, I get about twenty minutes with each of them, and neither they nor I have any training in moral philosophy. Turn the demandingness debate into a procedure I can actually run — the questions in order, what counts as a sufficient answer to each, where it stops and tells the donor they have given enough, and where it must stop and hand the decision back because what remains is a question about the kind of life the donor wants rather than any matter of fact. Please preserve, rather than smooth over, the distinctions that do the work: between a demand being too hard and its being false; between a sacrifice that is marginal (a foregone holiday) and one that is absolute (health, a career, a relationship); the way the demands escalate as income rises and never reach a resting point; whether the donor's own projects are just one more good to be traded off against others or something the theory must make room for; and the reply that the same objection would sink ordinary morality, which nobody treats as refuted. Then run the procedure on two donors — a surgeon with a large salary and a chronic illness that makes her own comfort expensive, and a teacher with two children on a modest salary — including one case where it tells me something I do not want to hear. Mark the steps that are judgment calls dressed up as arithmetic, and say what the procedure cannot do.
reasoning: |-
  Okay, the user is a donor advisor who had a philosophical debate with a friend about the demandingness of consequentialism. They need a practical procedure to advise donors in 20-minute sessions without moral philosophy training. The core challenge is translating abstract ethical debate into actionable steps.

  First, I need to understand the key distinctions they want preserved: 
  - The difference between a moral demand being too difficult versus being incorrect
  - Marginal sacrifices (like vacations) versus absolute ones (health, careers)
  - How demands increase with income without a natural stopping point
  - Whether personal projects have intrinsic value or are just trade-offs
  - The counterargument that ordinary morality also has demanding aspects

  The procedure must be structured as sequential questions with clear decision points. It needs termination rules for when the decision reverts to the donor's personal choice. 

  For the surgeon case (high income but expensive medical needs), the tension will likely center on whether maintaining health is an absolute sacrifice or a tradable good. The teacher case (modest income with children) will test how parental responsibilities factor into the calculation.

  Important design considerations:
  - Must avoid philosophy jargon
  - Needs concrete thresholds (e.g., "discomfort" vs "harm")
  - Should flag where numbers mask value judgments
  - Must acknowledge when conclusions might feel counterintuitive

  The procedure should have three phases: 
  1) Establish baseline giving capacity 
  2) Test limits of sacrifice 
  3) Define non-negotiable boundaries

  Key judgment calls to highlight:
  - Defining "essential" expenses
  - Quantifying health/safety tradeoffs
  - Valuing personal relationships
  - Deciding when incremental giving becomes ineffective

  The surgeon example will probably yield an uncomfortable conclusion about high earners' obligations, while the teacher case may demonstrate legitimate constraints. Both will show where the procedure reaches its limits.
answer: |-
  Here’s a practical procedure translating the demandingness debate into donor advising, preserving your specified distinctions. It runs in 3 phases, with explicit stopping rules. **Bold text** marks judgment calls masked as arithmetic.

  ---

  ### **The Procedure: Demandingness Threshold Assessment**
  **Phase 1: Establish Baseline Capacity**  
  *Goal: Define financial flexibility without demanding sacrifice.*  
  1. **"After essentials (housing, food, healthcare, debt, retirement savings), what monthly sum feels comfortably available for giving? No guilt—just what wouldn’t disrupt your life."**  
     *Sufficient answer:* A specific dollar amount.  
     *Stop if:* Donor names a figure. Record this as **Baseline Capacity (BC)**.  
     *Hand back if:* Donor cannot define "essentials" (e.g., disputes whether private school is essential).  

  2. **"If you gave nothing at all, what would you spend that BC on? Be specific (e.g., vacations, hobbies, nicer clothes)."**  
     *Purpose:* Exposes marginal sacrifices.  
     *Stop:* Always proceeds to Phase 2.  

  **Phase 2: Test the Consequentialist Demand**  
  *Goal: Apply "next dollar" test without assuming it’s morally binding.*  
  3. **"Imagine you gave 10% more than your BC. What would you cut back on? Would it cause active hardship (stress, lost sleep) or just less fun?"**  
     *Distinction:* Marginal (less fun) vs. Absolute (hardship).  
     *Sufficient answer:* Describes tangible lifestyle impact.  

  4. **"Research shows $1 to top charities saves/improves a life-year in low-income countries. Does cutting that luxury feel *wrong* when weighed against that impact?"**  
     *Key escalation:* Highlights rising income = rising obligation.  
     *Judgment call:* **Assumes "saves a life-year" is comparable to donor’s sacrifice** (philosophical leap).  
     *Hand back if:* Donor rejects comparability (e.g., "My family’s vacation isn’t measurable in life-years").  

  5. **"If you *don’t* give that extra 10%, is it because:  
     - It’s too hard (you couldn’t sustain it), or  
     - It’s unfair (you deserve your projects as much as strangers deserve help)?"**  
     *Preserves distinction:* Too hard vs. false demand.  
     *Sufficient answer:* Chooses one.  
     *Stop if:* "Too hard" → Consequentialism demands it, but donor may be excused.  
     *Stop if:* "Unfair" → Moral disagreement; hand back.  

  **Phase 3: Define Absolute Limits**  
  *Goal: Identify non-negotiable sacrifices.*  
  6. **"What could you *never* give up, even if it meant more good elsewhere? (e.g., your child’s education, medical treatment, your career.)"**  
     *Preserves:* Absolute sacrifices vs. marginal.  
     *Sufficient answer:* Lists concrete items.  

  7. **"Are these protected because they’re *more valuable* than saving strangers, or because they’re *yours*?"**  
     *Preserves:* Projects as trade-offs vs. intrinsically reserved.  
     *Stop if:* "More valuable" → Hand back (value judgment).  
     *Stop if:* "Because they’re mine" → Acknowledge consequentialism conflicts with this view.  

  8. **"Ordinary morality demands things like not stealing, even when hard. Does ‘give till it hurts’ feel *differently* impossible, or just harder?"**  
     *Preserves:* "Ordinary morality" counterargument.  
     *Stop:* Final step. Concludes debate is unresolved if donor insists it’s qualitatively different.  

  ---

  ### **Output Rules**  
  - **Enough given:** If BC is provided and donor passes Phase 2 without invoking "unfair" or absolute limits.  
  - **Decision handed back:** If donor disputes comparability (Step 4), asserts intrinsic value of projects (Step 7), or rejects scalability (Step 8).  
  - **Too hard but obligatory:** If donor admits demand is valid but too difficult (Step 5).  

  ---

  ### **Case Studies**  
  **Donor 1: Surgeon (High income, chronic illness)**  
  - **Phase 1:** BC = $3,000/month after $4k/month health costs. "Essentials" include medical care.  
  - **Phase 2:** Giving +10% ($300) means cutting physical therapy sessions. "Hardship—I need PT to work." → **Absolute sacrifice** (Step 6).  
  - **Phase 3:** "My health isn’t *more valuable* than strangers, but I can’t save lives if I’m bedridden. It’s mine." → *Hand back* (Step 7).  
    *Output:* "Your health is non-negotiable. Consequentialism might disagree, but your view is defensible. Give BC."  
    *What you didn’t want to hear:* Her $4k/month health spend could save 100+ life-years elsewhere—but the procedure rules this absolute.  

  **Donor 2: Teacher (Modest salary, two kids)**  
  - **Phase 1:** BC = $50/month. "Essentials" include kids’ activities ($200/month).  
  - **Phase 2:** +10% ($5) means no coffee outings. "Less fun, not hard."  
    - *Step 4:* "Is skipping coffee wrong when $5 deworms a child?" She hesitates: "But my sanity matters too." → "Too hard" (Step 5).  
  - **Phase 3:** "I’d never cut kids’ activities. They’re *mine*." → *Hand back* (Step 7).  
    *Output:* "You’re excused from giving more—it’s unsustainable. But BC is uncontroversial."  
    *Judgment call:* **Treating "sanity" as hardship** (Step 3) ignores that $5 may not buy meaningful sanity.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve philosophical disputes:** It flags disagreements (e.g., "projects as intrinsically valuable") but doesn’t settle them.  
  2. **Quantify suffering:** Converts "stress" into "hardship" arbitrarily.  
  3. **Handle uncertainty:** Assumes $1 *always* does more good for top charities (ignores diminishing returns).  
  4. **Assign value to relationships:** Treats "my child" as binary protected/non, not a trade-off.  
  5. **Override self-interest:** If a donor says "I just don’t want to," the procedure halts.  

  ### **Key Judgment Calls Masked as Arithmetic**  
  - **Step 4:** Equating donor’s sacrifice with a stranger’s life-year.  
  - **Step 6:** Deciding when a sacrifice shifts from "marginal" to "absolute."  
  - **Baseline Capacity:** Accepting donor’s definition of "essentials."  

  This forces donors to confront *why* they resist giving more—without pretending philosophy has tidy answers. It ends not with a dollar amount, but with clarity about where morality ends and life choices begin.
