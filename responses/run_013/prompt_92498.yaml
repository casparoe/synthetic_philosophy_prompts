prompt: |-
  Consider a sequence of decision-makers facing a common binary question — which of two states of the world obtains — who act in a fixed order. Each shares the same prior, cares only about being correct, receives a private signal that is informative but never decisive, and, before acting, observes the actions but not the signals of everyone who went before. All are rational expected-utility maximizers, and this is common knowledge. Call a decision-maker cascaded if the action he takes is the one he would have taken regardless of which private signal he had received; in the usual analysis, once the first few actions agree, everyone thereafter is cascaded, and the private signals of the rest leave no trace in the public record.

  I want a worked example, not a survey. Construct a concrete instance — fill in the two states, the signal accuracies, and the step-by-step reasoning of the first several decision-makers — that exposes a conceptual issue about the notion of a cascade itself. Your example should bring out that being cascaded is a fact about what a person would have done under signals he did not receive, and so need not leave any mark on the actions he did take; and it should show that a cascade built out of nothing but correct Bayesian reasoning can be indistinguishable, from the record of actions alone, from a run of mere imitation. Then assess, briefly and separately, two claims often made about such sequences: that a cascade is a failure of collective information aggregation, and that an observer can diagnose one by watching the decisions. For each claim, say which parts your example supports and which it leaves untouched, and be explicit about where the example does no work.
reasoning: |-
  We are going to construct a concrete example of an information cascade. We choose two states of the world: State A and State B. The prior is that each state is equally likely: P(A) = P(B) = 0.5.

  Each decision maker receives a private signal which can be either 'a' (suggesting A) or 'b' (suggesting B). The signal is informative but not decisive. We assume that the signal accuracy is the same for both states and denote it by p (with 0.5 < p < 1). Specifically:

    P(signal = 'a' | State A) = p
    P(signal = 'b' | State A) = 1-p

    P(signal = 'b' | State B) = p
    P(signal = 'a' | State B) = 1-p

  We set p=2/3 for concreteness.

  Now, we consider a sequence of decision makers: DM1, DM2, DM3, ..., each acting in order. Each can choose action A or B. They observe the actions of previous decision makers but not their signals.

  We want to show that a cascade might start early, and once it starts, every subsequent decision maker ignores their own signal. Moreover, we want to show that the cascade might be built on signals that are correct, but the record of actions alone does not reveal whether the cascade was based on information or just imitation, and also that the cascade itself does not leave a mark in the sense that the action taken by a cascaded individual is the same as what they would have taken without being cascaded (but for different reasons). 

  We also want to highlight that the cascade condition (taking the same action regardless of the signal) is about counterfactual signals, which are not observed.

  Step-by-step reasoning:

  DM1:
    - Receives a private signal, say s1.
    - Since there's no prior action, DM1 bases the decision solely on the signal.
    - If s1 = 'a', then:
          P(A | 'a') = P('a'|A)*P(A) / P('a') 
                     = (2/3 * 1/2) / [P('a'|A)*P(A) + P('a'|B)*P(B)]
                     = ( (2/3)*(1/2) ) / ( (2/3)*(1/2) + (1/3)*(1/2) )
                     = (1/3) / (1/3 + 1/6) = (1/3) / (1/2) = 2/3
      Similarly, P(B|'a')=1/3. So DM1 chooses A.

    - If s1 = 'b', then similarly P(B|'b')=2/3, so DM1 chooses B.

  Suppose DM1 gets signal 'a' and chooses A.

  DM2:
    - Observes that DM1 chose A.
    - Receives a private signal, s2.

    We need to compute the posterior for DM2 given DM1's action (which was A) and their own signal.

    Note: DM2 knows that DM1 would have chosen A if DM1 got 'a' and B if DM1 got 'b'. Therefore, DM1 choosing A implies that DM1 must have received signal 'a' (because if DM1 got 'b', they would have chosen B). However, note that DM2 does not observe the signal, only the action.

    Therefore, from DM2's perspective, the fact that DM1 chose A means that DM1 received signal 'a'. So DM2 conditions on the event that DM1's signal was 'a'. 

    Thus, DM2 has two pieces of information: 
        - DM1's signal was 'a' (because that's the only way DM1 would choose A)
        - their own signal s2.

    Now, the state of the world is independent of the order, so the two signals are conditionally independent given the state.

    The prior after seeing DM1's signal is updated: 
        P(A | DM1's signal 'a') = 2/3 (as computed above for DM1).

    Now, DM2 will combine this with their own signal.

    Case 1: DM2 receives signal 'a'
        Then the two signals are both in favor of A. 
        The posterior for A given two signals 'a' and 'a':
            P(A | 'a','a') = [P('a','a'|A) * P(A)] / P('a','a')
            But note: P('a','a'|A) = p * p = (2/3)^2 = 4/9
            P('a','a'|B) = (1-p)*(1-p) = (1/3)^2 = 1/9
            P(A) = P(B) = 1/2, so:
            P('a','a') = P('a','a'|A)*P(A) + P('a','a'|B)*P(B) = (4/9)*(1/2) + (1/9)*(1/2) = (4/18) + (1/18) = 5/18
            Then P(A | 'a','a') = ( (4/9)*(1/2) ) / (5/18) = (2/9) / (5/18) = (2/9)*(18/5) = 4/5.

        Alternatively, we can use the prior after DM1's signal (which is 2/3) and update with DM2's own signal:
            P(A | DM1's signal 'a' and DM2's signal 'a') 
              = [ P(s2='a'|A) * P(A | DM1's signal 'a') ] / P(s2='a' | DM1's signal 'a')
            But note: P(s2='a' | A) = p = 2/3, and P(s2='a' | B) = 1-p = 1/3.
            Also, P(A | DM1's signal 'a') = 2/3, so P(B | DM1's signal 'a') = 1/3.
            Then:
              P(s2='a' | DM1's signal 'a') 
                  = P(s2='a'| A) * P(A | DM1's signal 'a') + P(s2='a'|B)*P(B | DM1's signal 'a')
