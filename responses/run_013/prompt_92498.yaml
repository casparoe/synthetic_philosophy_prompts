                  = (1/3)*(2/3) + (2/3)*(1/3) = (2/9) + (2/9) = 4/9
            Then P(A | ...) = [ (1/3) * (2/3) ] / (4/9) = (2/9) / (4/9) = 2/4 = 1/2.

        At 1/2, the decision maker is indifferent. We assume they break ties by following their own signal? Or arbitrarily? But note the problem says they care only about being correct, so if the posterior is 1/2, they are indifferent. We need to specify a tie-breaking rule. Let's assume that in case of indifference, they follow their own signal. Then in this case, DM2 would choose B.

        However, note that 1/2 is exactly the prior. Alternatively, we might assume they flip a fair coin. But to be consistent with the cascade literature, we note that when the posterior is 1/2, the decision maker might use the signal to break the tie? But note: the signal in this case is 'b'. So if they break ties by following the signal, they choose B.

