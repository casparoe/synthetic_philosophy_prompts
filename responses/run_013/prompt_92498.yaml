        But note: in the cascade literature, when the posterior is exactly 1/2, the decision maker is indifferent and might choose either. However, if they choose to follow their own signal, then they choose B.

        Therefore, if DM2 gets 'b', they choose B.

    So, after DM1 chose A:
        - If DM2 gets 'a', chooses A.
        - If DM2 gets 'b', chooses B.

  Now, suppose DM2 gets 'a' and chooses A.

  Then we have two actions: A, A.

  DM3:
    Observes: A, A.

    What does DM3 infer? 
        - DM1 chose A: so DM1 must have had signal 'a' (because if DM1 had 'b', they would have chosen B).
        - DM2 chose A: but note, DM2 could have chosen A in two scenarios:
            (a) if DM2 got 'a', then they would choose A (as above)
            (b) if DM2 got 'b', then they would choose B? But wait, above we said if DM2 gets 'b' after seeing DM1 choose A, they choose B.

        Therefore, the only way DM2 chooses A is if DM2 got signal 'a'. 

        So DM3 infers: DM1 had 'a' and DM2 had 'a'. 

        Thus, DM3 now has two signals: both 'a'. And then they have their own signal s3.

        The prior after two signals 'a': we already computed P(A | two 'a') = 4/5 (as above for DM2 in the case of two 'a').

        Now, DM3 updates with their own signal.

        Case 1: DM3 gets signal 'a'
            Then three signals: 'a','a','a'
            P(A | three 'a') = [ P(three 'a'|A) * P(A) ] / P(three 'a')
            P(three 'a'|A) = (2/3)^3 = 8/27
            P(three 'a'|B) = (1/3)^3 = 1/27
            P(three 'a') = (8/27)*(1/2) + (1/27)*(1/2) = (8/54) + (1/54) = 9/54 = 1/6
            Then P(A | ...) = (8/54) / (1/6) = (8/54)*6 = 8/9.

            Alternatively, starting from the posterior after two 'a' (which is 4/5) and updating with a new signal 'a':
              P(A | two 'a') = 4/5, so P(B | two 'a') = 1/5.
              P(s3='a'|A) = 2/3, P(s3='a'|B)=1/3.
              P(s3='a') = (2/3)*(4/5) + (1/3)*(1/5) = (8/15) + (1/15) = 9/15 = 3/5.
              Then P(A | two 'a' and s3='a') = [ (2/3)*(4/5) ] / (3/5) = (8/15) / (3/5) = (8/15)*(5/3) = 40/45 = 8/9.

            So DM3 chooses A.

        Case 2: DM3 gets signal 'b'
            Then update:
              P(A | two 'a' and s3='b') 
                  = [ P(s3='b'|A) * P(A | two 'a') ] / P(s3='b' | two 'a')
              P(s3='b'|A) = 1/3
              P(s3='b'|B) = 2/3
              P(s3='b' | two 'a') = (1/3)*(4/5) + (2/3)*(1/5) = (4/15) + (2/15) = 6/15 = 2/5.
              Then P(A | ...) = [ (1/3)*(4/5) ] / (2/5) = (4/15) / (2/5) = (4/15)*(5/2) = 20/30 = 2/3.

            Since 2/3 > 1/2, DM3 still chooses A.

            Therefore, regardless of the signal, DM3 chooses A.

        So DM3 is cascaded: they choose A no matter what signal they get.

  Now, suppose the true state is B. How can this happen? The first two signals were 'a' (by chance) even though the state is B. The probability of two 'a' in state B is (1/3)^2 = 1/9. Then DM3 and all subsequent decision makers will choose A, regardless of their signals. This is a cascade on A, and it is wrong.

  But note: the actions taken are A, A, A, A, ... 

  Now, what if the first two signals had been 'a' and the true state was A? Then the cascade would be correct.

  The key point: from the record of actions (A, A, A, ...) we cannot tell whether:
     (a) the first two signals were 'a' and the state is A (so the cascade is correct) and the subsequent signals (if any) are irrelevant because the cascade is on the correct action, or 
     (b) the first two signals were 'a' but the state is B (so the cascade is incorrect) and the subsequent signals are being ignored.

  Moreover, consider DM3: they are cascaded. They would have chosen A no matter what signal they got. But in fact, they did get a signal. Suppose they got a signal 'b'. Then they choose A. But note: if they had gotten signal 'a', they would also have chosen A. So the action is the same regardless of the signal. However, in the record, we only see the action (A) and we do not see the signal. So we cannot tell that DM3 was cascaded. 

  Furthermore, consider an observer who only sees the actions. They see A, A, A, ... and they do not know the signals. They cannot tell whether the first two decision makers had signals that were both 'a' (and hence the cascade is based on information) or if the first one had 'a' and the second one had 'b' but then the second one still chose A? But wait, in our example, if the first one had 'a' and the second had 'b', then the second would choose B. So the only way to get two A's is if both had 'a'. 

