          - Step 2: Was there a wrong in the acquisition? 
               - Yes: go to Step 3.
               - No: go to Step 4.
               - Ambiguous: hand to human.
          - Step 3: But for the wrong, would the object be with the original community today?
               - Yes: go to Step 4.
               - No: go to Step 4.  [because we still need to check if they are the valid custodian for other grounds]
               - Ambiguous: hand to human.
          - Step 4: Is the claimant the valid custodian (representing a living community with a present interest that hasn't been extinguished by time)? 
               - Yes: 
                   - If we came from Step 3 (and Step 3 was yes), then moral entitlement on wrongful taking is established. Go to Step 6.
                   - If we came from Step 2 (no wrong) or Step 3 (no), then go to Step 5.
               - No: the claim fails for this claimant. Move to next claimant or to Step 7 if no more claimants.
               - Ambiguous: hand to human.
          - Step 5: Are there other grounds for moral entitlement (based on present interests without wrongful taking)? 
               - Yes: go to Step 6.
               - No: claim fails.
               - Ambiguous: hand to human.
          - Step 6: Effect of time on present interests: 
               - Question: Has the passage of time extinguished the claimant's interest? 
                   - No: moral entitlement stands. Go to Step 7.
                   - Yes: moral entitlement fails. Claim fails.
                   - Ambiguous: hand to human.
     - Step 7: Legal title check for this claimant (if moral entitlement is established):
          - Are there legal barriers to transferring title?
               - No: recommend restitution.
               - Yes: record that law blocks outcome. Recommend alternative measures (e.g., loan, apology, etc.).
               - Ambiguous: hand to human.

     - After all claimants:
          - If only one claimant has moral entitlement and no legal barrier, recommend restitution to that claimant.
          - If none, recommend against restitution.
          - If multiple with moral entitlement, hand to human (because choosing among claimants is a values question).

     We also need to report both legal title and moral entitlement even if the claim fails. For example, if moral entitlement is established but legal title cannot be transferred, we report both. If there is no moral entitlement, we report that.

     Now, we run the procedure on two cases.

  ---

  **Case 1: Benin Objects in a Regional Museum**

     Stipulated facts:
     - The objects were looted by British forces in the 1897 punitive expedition, clearly a wrong.
     - Claimants:
          1. The royal house of Benin (Oba): claims as the traditional ruler.
          2. The national commission of Nigeria (source state): claims on behalf of the nation.
          3. A descendant community (e.g., the Edo people) who say they are the cultural descendants and that neither the royal house nor the national commission speaks for them.

     We run the procedure for each claimant.

     **Claimant 1: Royal House of Benin**

     Step 1: Claimant is the royal house (Oba), object is Benin objects.

     Step 2: Was there a wrong? 
          - Yes, looting during a military campaign. Go to Step 3.

     Step 3: But for the wrong, would the object be with the original community (the Kingdom of Benin) today?
          - The Kingdom of Benin was incorporated into Nigeria, but the royal house still exists as a traditional institution. The objects would likely have remained in the palace if not looted. So yes. Go to Step 4.

     Step 4: Is the claimant the valid custodian? 
          - The royal house is a traditional institution that still exists and has a present interest in the objects (they are part of their heritage). However, we must note that there is also a descendant community that says the royal house does not speak for them. This is a conflict. 
          - We are to assess: does the royal house represent a living community with a present interest? Yes, it represents the Benin monarchy and its supporters. But is it the most direct descendant? Yes, it is the direct continuation of the original kingdom. However, the descendant community (Edo people) might be the broader community. 
          - The procedure requires us to see if the claimant is the valid custodian. The royal house is a direct descendant institution. So yes. Go to Step 6.

     Step 6: Effect of time: has the interest been extinguished?
          - No, the royal house actively seeks the return and has cultural practices. So moral entitlement stands.

     Step 7: Legal title check: Assume no legal barriers in the museum's country. So recommend restitution.

     **Claimant 2: National Commission of Nigeria**

     Step 1: Claimant is the national commission of Nigeria.

     Step 2: Wrong? Yes, same as above. Go to Step 3.

     Step 3: But for the wrong, would the object be with the original community today? Yes, it would be in Benin. Go to Step 4.

     Step 4: Is the claimant the valid custodian? 
          - The national commission claims on behalf of the nation. We must ask: is there a living direct descendant community? Yes, the Edo people and the royal house. 
          - Has the direct descendant community authorized the state to claim on its behalf? The file might show: the royal house and the descendant community do not consent; they want the objects returned to them, not to the state. The national commission might argue that it represents the whole nation, including the Edo people, but the Edo people say the commission does not speak for them. 
          - Without evidence of authorization, the state is not the valid custodian. The claim fails.

     **Claimant 3: Descendant Community (Edo people)**

     Step 1: Claimant is the Edo people.

     Step 2: Wrong? Yes. Go to Step 3.

     Step 3: But for the wrong, would the object be with the original community today? 
          - The original community is the Kingdom of Benin, which was composed of the Edo people. The objects would be in the community. So yes. Go to Step 4.

     Step 4: Is the claimant the valid custodian? 
          - The Edo people are the direct cultural descendants. They have a present interest. Yes. Go to Step 6.

     Step 6: Interest not extinguished. Moral entitlement stands.

     Step 7: No legal barriers. Recommend restitution.

     **After all claimants:**
     - Both the royal house and the descendant community have moral entitlement. The national commission does not.
     - We have two claimants with moral entitlement. The procedure must hand to human because choosing between them is a values question.

     However, note: the descendant community says the royal house does not speak for them, but the royal house claims to be the traditional custodian. The human panel might decide that the royal house is the appropriate custodian because historically the objects were in the palace. Or they might decide for the descendant community. But the procedure flags it for human decision.

     So the output for the case: 
          - Moral entitlement established for royal house and descendant community.
          - Legal title transfer possible.
          - Conflict between claimants: hand to human.

  ---

  **Case 2: Parthenon Sculptures**

     Stipulated facts:
     - Removed by Lord Elgin in the early 19th century under an authorization (firman) from the Ottoman Empire, then governing Athens.
     - Claimant: the state of Greece, which wants them reunited with the Parthenon.

     We run the procedure for Greece.

     Step 1: Claimant is Greece, object is Parthenon sculptures.

     Step 2: Was there a wrong? 
          - This is controversial. The Ottomans were the governing authority and issued a permit. But was it a wrong? Contemporary standards: the Ottomans were an occupying power, and the Greeks were under subjugation. The removal caused damage, and the permit's validity is disputed. However, by the standards of the time, it was legal. But our commitment: not whether it was lawful then, but whether it was a wrong. Many argue it was a wrong because it was an exploitation under occupation. But let's assume the file shows: the permit allowed removal, but there is evidence of bribery and the removal was done in a way that damaged the sculptures. So we can say: yes, there was a wrong. (If the file is unclear, we might hand to human. But for this example, we assume yes.) Go to Step 3.

     Step 3: But for the wrong, would the object be with the original community today?
          - The original community is the people of Athens/Greece. But for the removal, the sculptures would still be on the Parthenon. However, the Parthenon was damaged by war and pollution. They might have been removed for safekeeping anyway? But we are to ask: would they be held by the claimant community today? Greece would have them in a museum if not on the building. So yes. Go to Step 4.

     Step 4: Is the claimant the valid custodian? 
          - Greece is a state. We ask: is there a living direct descendant community? The Greek people are the direct descendants of the ancient Athenians? Culturally, yes. They are a living community with a present interest. And there is no other distinct community claiming. So the state represents the living people. Yes. Go to Step 6.

     Step 6: Effect of time: has the interest been extinguished? 
          - No, the sculptures are of great cultural importance to Greece. Moral entitlement stands.

     Step 7: Legal title check: The British Museum Act may prevent deaccessioning. So legal barriers exist. We record: moral entitlement is established, but legal barriers prevent transfer. Recommend alternative measures (e.g., long-term loan to Athens, or a partnership).

     However, this verdict (moral entitlement) might not be liked by the user because the user might think the removal was legal and not wrongful. But the procedure, based on the file showing evidence of bribery and damage, says there was a wrong.

     Alternatively, if the file does not establish a wrong, we might go to Step 5 for Greece:

     Alternative path if Step 2 is no (which the user might prefer):

     Step 2: Was there a wrong? 
          - If we decide no (because the Ottomans had the authority and the permit was granted, with no evidence of wrongdoing), then go to Step 4.

     Step 4: Is Greece the valid custodian? 
          - Yes, as the state representing the Greek people who have a cultural interest. Go to Step 5.

     Step 5: Are there other grounds for moral entitlement? 
          - Yes, the present interest: the sculptures are an integral part of Greek cultural heritage and their reunification would have significant cultural value. So moral entitlement on present interest grounds. Then Step 6: interest not extinguished. Step 7: legal barriers, so recommend alternatives.

     So either way, if there is a moral entitlement, but legal barriers. But in the first path (Step 2 yes), the grounds are wrongful taking. In the second (Step 2 no), the grounds are present interest.

     The user might not like the verdict that there was a wrong, but the procedure allows for both paths.

     We'll assume the first path (Step 2 yes) for the example.

  ---

  **Cases the Procedure Will Misfire On**

     - **Human remains:** The procedure is designed for objects. Human remains are not "objects" in the same way. The wrongness of holding human remains is not primarily about title but about respect for the dead and their descendants. The present interest might be strong, but the steps about wrongful taking might not fit. For example, if the remains were taken during a colonial era for "scientific" study, there was a wrong, but the moral claim is not about possession but about proper burial and respect. The procedure might not capture this.

     - **Sacred objects:** The wrongness might not be in the loss of title but in the ongoing desecration by being displayed or held by a museum. The present interest is in stopping the desecration. The procedure's Step 5 might cover this (other grounds), but the focus on title might be secondary.

     - **Objects with multiple layers of history:** For example, an object that was taken from Community A by Community B, and then taken from Community B by a colonial power. The procedure might not easily handle the intermediate taking.

     - **Cases where the present interest is not of a community but of a family or individual:** The procedure assumes a community claimant.

     - **Cases where the claimant community is defined very broadly (e.g., the African diaspora) and the connection is not direct:** Step 4 might fail.

     We should note these limitations.
