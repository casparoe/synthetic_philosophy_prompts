  ### Triage Procedure for Museum Restitution Claims

  Based on your four commitments, the procedure is structured as a linear decision tree. Case officers proceed step-by-step, terminating at a recommendation if clear, escalating to the panel for value judgments (marked **HUMAN JUDGMENT NEEDED**), or noting legal barriers. Each step includes:  
  - **Question** (phrased for non-philosophers)  
  - **Sufficient answer criteria** (binary/clear thresholds)  
  - **Termination points** (against restitution, legal barriers, or human escalation)  

  ---

  #### **Procedure Steps**  
  1. **Identify Acquisition Context**  
     - *Question:* "Was the object acquired under conditions that involved violence, coercion, fraud, or exploitation—even if legal at the time?"  
     - *Sufficient answer:*  
       - **YES** if file evidence shows theft, looting, forced sale, or unequal bargaining power (e.g., colonial extraction).  
       - **NO** if file shows voluntary, fair transaction with consent.  
       - **Unclear** if evidence is ambiguous (e.g., disputed consent).  
     - *Termination:* If **NO**, go to Step 5. If **Unclear**, escalate to **HUMAN JUDGMENT NEEDED** (values: defining "exploitation").  

  2. **Establish Plausible Current Possession**  
     - *Question:* "Would the claimant community likely hold the object today if the acquisition wrong (from Step 1) had not occurred?"  
     - *Sufficient answer:*  
       - **YES** if the community maintained cultural continuity (e.g., similar objects still held, ongoing traditions).  
       - **NO** if the community dissolved, abandoned the object, or faced intervening events (e.g., natural loss, unrelated confiscation).  
     - *Termination:* If **NO**, terminate with **recommendation against restitution** (moral entitlement fails).  

  3. **Assess Present Custodial Interests**  
     - *Question:* "Does the claimant represent a living community with a direct cultural, religious, or historical connection to the object—not a defunct state or polity?"  
     - *Sufficient answer:*  
       - **YES** if claimants are identifiable living groups (e.g., descendant communities, active cultural institutions).  
       - **NO** if claimants are extinct states or lack continuity (e.g., "ancient Rome").  
       - **Unclear** if competing groups claim representation.  
     - *Termination:* If **NO**, terminate with **recommendation against restitution**. If **Unclear**, escalate to **HUMAN JUDGMENT NEEDED** (values: defining "living community").  

  4. **Evaluate Time’s Impact on Present Interests**  
     - *Question:* "Has time diminished the claimant’s interest so much that restitution no longer benefits them?"  
     - *Sufficient answer:*  
       - **YES** if the community has no active use, memory, or need for the object (e.g., lost cultural knowledge, no requests until now).  
       - **NO** if the community demonstrates ongoing engagement (e.g., ritual use, oral histories, recent claims).  
       - **Unclear** if impacts are speculative.  
     - *Termination:* If **YES**, terminate with **recommendation against restitution**. If **Unclear**, escalate to **HUMAN JUDGMENT NEEDED** (values: weighing harm/benefit).  

  5. **Alternative Moral Grounds (if Step 1 is NO or skipped)**  
     - *Question:* "Is restitution justified by the object’s sacred, communal, or identity-forming significance to the claimant—even without a past wrong?"  
     - *Sufficient answer:*  
       - **YES** if evidence shows profound ongoing harm (e.g., spiritual desecration, identity erosion).  
       - **NO** if the object is merely historically significant.  
       - **Unclear** if harm is asserted but unproven.  
     - *Termination:* If **NO**, terminate with **recommendation against restitution**. If **Unclear**, escalate to **HUMAN JUDGMENT NEEDED** (values: defining "profound harm").  

  6. **Legal Title Check**  
     - *Question:* "Does current law block transfer of title?"  
     - *Sufficient answer:*  
       - **YES** if statutes forbid deaccessioning, or time-based ownership laws apply (e.g., "inalienable collections" laws).  
       - **NO** if no legal barriers exist.  
     - *Outcome:*  
       - If **YES**, record: **Legal title blocks restitution despite moral entitlement**. Recommend alternatives (loan, digital access, co-stewardship).  
       - If **NO**, proceed to final recommendation.  

  7. **Final Output**  
     - Moral entitlement and legal title status are reported separately.  
     - For competing claimants with equal moral entitlement, escalate to **HUMAN JUDGMENT NEEDED** (values: prioritizing claimants).  

  ---

  ### Case Studies  
  *Stipulated facts are simplified for clarity; reasoning follows the procedure.*  

  #### **Case 1: Benin Objects (Regional Museum)**  
  - **Object:** Bronze plaque looted by British forces, 1897.  
  - **Claimants:**  
    - Benin Royal House (Oba): Traditional custodian.  
    - National Commission of Nigeria: State agency.  
    - Edo Descendant Community: Rejects both above.  
  - **File facts:** Royal House collaborates with Nigeria but opposes state custody; Edo community practices ancestral rituals.  

  **Procedure Workthrough:**  
  1. **Step 1:** Acquisition involved colonial violence → **YES**.  
  2. **Step 2:** Plausible current possession? Edo/Benin cultures retain bronzes → **YES**.  
  3. **Step 3:** Assess custodial interests:  
     - *Royal House:* Living institution → **YES**.  
     - *National Commission:* Defunct-polity successor → **NO** (fails; not living community).  
     - *Edo Community:* Living group with practices → **YES**.  
     - *Outcome:* Two valid claimants (Royal House, Edo). Escalate to **HUMAN JUDGMENT NEEDED** (values: who best represents cultural interests?).  
  4. **Step 4/5/6:** Skipped pending human decision.  
  5. **Verdict:**  
     - **Moral entitlement:** Royal House and Edo community.  
     - **Legal title:** Transferable (no barriers).  
     - **Panel decision required** to resolve claimant priority.  

  #### **Case 2: Parthenon Sculptures**  
  - **Object:** Marble frieze removed 1801–1812.  
  - **Claimant:** Greek state (reunification with Acropolis).  
  - **File facts:** Ottoman Sultan authorized removal; Greece contests consent as imperial coercion.  

  **Procedure Workthrough:**  
  1. **Step 1:** Acquisition under Ottoman rule. Evidence of unequal power but no violence → **Unclear** (escalate to **HUMAN JUDGMENT NEEDED**; values: whether imperial authorization constitutes coercion).  
     - *Assume panel decides:* Coercion → **YES**.  
  2. **Step 2:** Plausible current possession? If not removed, frieze would likely remain in Athens → **YES**.  
  3. **Step 3:** Greek state represents living Hellenic culture → **YES**.  
  4. **Step 4:** Time’s impact? Greeks maintain strong cultural ties → **NO** (interest not diminished).  
  5. **Step 6:** Legal title check: UK law blocks deaccessioning → **YES**.  
  6. **Verdict (may dislike):**  
     - **Moral entitlement:** **YES** (wrongful acquisition, living interests).  
     - **Legal title:** **Blocks restitution**.  
     - **Recommendation:** Long-term loan to Athens + digital replica for UK.  

  ---

  ### Cases Where Procedure Misfires  
  1. **Human Remains:**  
     - **Why:** Moral wrong stems from violation of bodily integrity, not loss of title. Steps 1–5 misfocus on "acquisition" and "possession."  
     - **Example:** Native American remains in museums. Procedure may terminate at Step 3 ("defunct polity") or Step 4 ("time diminished interest"), ignoring sacrilege.  

  2. **Sacred Objects with Ongoing Harm:**  
     - **Why:** Wrongness is about *current* desecration (e.g., display against taboos), not past acquisition. Step 5 ("alternative grounds") is too narrow.  
     - **Example:** Indigenous Australian Tjurunga. Even if acquired legally, displaying it causes spiritual harm. Procedure may not capture this in Step 5 if "profound harm" is unproven.  

  3. **Communities with Oral Histories:**  
     - **Why:** File may lack "evidence" for Steps 2–4, escalating all to human judgment. Overloads panel.  
     - **Example:** African objects with provenance gaps. Officers default to "unclear" without written records.  

  4. **Objects with Multiple Wrongs:**  
     - **Why:** Procedure assumes one acquisition context. Fails for objects stolen multiple times (e.g., Nazi-looted art later bought innocently).  

  **Mitigation:** Flag these cases upfront for panel review. Add a pre-step: "Is the claim about human remains, sacred desecration, or multiple dispossessions?" → If yes, **HUMAN JUDGMENT NEEDED**.  

  ---  
  This procedure prioritizes executability while embedding your commitments. It forces value judgments into explicit escalations, avoids scoring rubrics, and separates legal/moral reporting. For the Benin case, it avoids quietly dropping your anti-defunct-polity commitment; for the Parthenon, it delivers a verdict you may dislike (moral entitlement despite Ottoman "legality").
