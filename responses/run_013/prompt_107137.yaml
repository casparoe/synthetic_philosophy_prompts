  Here's a breakdown of Bentham's push-pin/poetry analogy applied to sexual morality, mapping its elements, testing its limits, and assessing the conclusion's validity, grounded in scholarship and acknowledging debates:

  **The Analogy Mapped:**
  1.  **Push-Pin:** Represents simple, sensual, "lower" pleasures (like a child's game).
  2.  **Poetry/Music:** Represents complex, intellectual, "higher" pleasures valued by tradition/culture.
  3.  **Bentham's Claim (Push-Pin = Poetry, "Prejudice apart"):** Pleasures are *fundamentally equal* in *kind*. Their value lies *solely* in their intensity, duration, certainty, propinquity, fecundity (chance of leading to more pleasure), purity (freedom from pain), and extent (number of people affected). There is *no intrinsic, qualitative hierarchy*. Cultural preferences for "higher" pleasures are mere prejudice. Value is purely quantitative/hedonic.
  4.  **Applied to Sex (Sex = Push-Pin):** Sexual pleasure is *one pleasure among many*. It's a simple, sensual pleasure.
  5.  **Traditional Morality/Religious Doctrine (Re: Sex) = Poetry:** Views that elevate certain sexual acts (procreative, marital) as inherently "higher" or morally superior, and denigrate others (non-procreative, homosexual, non-marital) as inherently "lower" or sinful.
  6.  **The Analogy's Argument Against Criminalization:**
      *   If push-pin = poetry (no intrinsic hierarchy), then sexual pleasure = other pleasures (no intrinsic hierarchy based on type of act or partner).
      *   Criminalizing specific consensual sexual acts (like homosexuality) is therefore *based solely on prejudice* (analogous to banning push-pin because it's not poetry).
      *   Since the law's only legitimate purpose, according to Bentham, is to prevent *harm* (pain), and consensual sex causes no tangible harm (only "disgust" or offense rooted in prejudice), criminalization lacks justification. It *causes* harm (punishment, suffering, fear) without preventing any countervailing harm. Therefore, **don't criminalize consensual sexual acts.**

  **Where the Analogy Holds Well:**
  1.  **Core Utilitarian Principle:** It perfectly illustrates Bentham's radical hedonism and anti-perfectionism. *All* pleasures contribute to utility; none are inherently better or worse *because of their source*.
  2.  **Critique of Tradition/Religion:** It effectively exposes how much traditional sexual morality relies on unquestioned dogma, taboo, and "sentiment" rather than demonstrable harm. Bentham saw laws against "victimless crimes" like consensual sodomy as prime examples of this prejudice.
  3.  **Foundation for Decriminalization:** The core logic that criminal law requires justification based on preventing harm, not enforcing taste or tradition, remains powerful and central to liberal legal theory.

  **Where the Analogy Breaks or is Challenged:**
  1.  **Consent & Harm:** The analogy focuses purely on pleasure equivalence. **This is the major break.** Bentham's sexual morality arguments *crucially* depend on the **consensual** nature of the acts he defends. Push-pin/poetry involves no consent issues. Applying the analogy *without* the consent filter could absurdly imply non-consensual acts are just another pleasure. Bentham *did* recognize consent as vital (e.g., arguing against laws criminalizing *consensual* acts), but the analogy itself doesn't capture this essential qualifier. The argument against criminalization relies *heavily* on the absence of harm *to a non-consenting party*, not just pleasure equivalence.
  2.  **"Fecundity" & Consequences:** Bentham's calculus *does* include "fecundity" (a pleasure's tendency to produce more pleasure) and "purity" (freedom from subsequent pain). Critics argue certain sexual acts *might* carry higher risks of negative consequences (disease, unwanted pregnancy, emotional pain) than others, potentially making them less "fecund" or "pure" in a utilitarian sense. Bentham dismissed most such claims as prejudice, but the *potential* for differential consequences based on context isn't fully addressed by the simple pleasure-equivalence model. Poetry might cultivate tastes leading to more complex future pleasures; push-pin might not. Similarly, some argue certain sexual practices or contexts might have different long-term hedonic impacts.
  3.  **Social Harm vs. Mere Prejudice:** Bentham dismissed "disgust," "offense," and "outrage" stemming from consensual sex as mere prejudice, not *real* harm justifying law. Critics (even sympathetic ones like H.L.A. Hart) argue that widespread social revulsion *can* constitute a form of social pain/disintegration (harm) that a utilitarian legislator might need to consider, even if its origins are irrational. Bentham largely rejected this, seeing law as reinforcing prejudice, not responding to genuine harm. The analogy doesn't engage with this complexity.
  4.  **The Nature of Sex vs. Games/Arts:** Sex inherently involves intimacy, vulnerability, potential for profound connection *or* profound harm, and deep social/biological dimensions that a simple game like push-pin or the appreciation of poetry generally does not. Reducing it purely to "a pleasure" arguably flattens its complexity, even within a utilitarian framework that still must account for its unique *potential* consequences (both positive and negative fecundity/purity).

  **Does the Conclusion ("Don't Criminalize") Stand Despite the Breaks?**
  *   **Yes, robustly.** The conclusion's strength lies **not primarily in the pleasure-equivalence analogy itself, but in the underlying harm principle and the critique of prejudice.**
      *   The analogy *illustrates* the harm principle's application: banning harmless pleasures based on taste is tyrannical.
      *   The consent qualifier (though not in the analogy) is the bedrock. Criminalization of *consensual* acts causes immense, tangible harm (punishment, stigma, blackmail, ruined lives) without preventing any comparable harm to others.
      *   Arguments about potential differential consequences (fecundity/purity) of *specific* acts can be addressed contextually without needing an *intrinsic* hierarchy. If an act demonstrably causes *tangible* harm (e.g., high disease risk without mitigation), regulation *might* be justified on *that* basis, not because it's "lower." Bentham would likely argue the evidence for such differential harm was often exaggerated prejudice.
      *   Arguments about "social harm" from offense remain highly contentious. Bentham's view that law should not pander to prejudice is a core liberal principle that many find compelling against criminalization.

  **The Quote: Bentham vs. Mill**
  *   **You are correct.** The *exact* wording "Quantity of pleasure being equal, push-pin is as good as poetry" is **John Stuart Mill's paraphrase/summary** of Bentham's view in *Utilitarianism* (Chapter 2), likely written to set up his own critique (Mill *does* argue for qualitative differences).
  *   **Bentham's original** (from *The Rationale of Reward*, 1825) is: "**Prejudice apart, the game of push-pin is of equal value with the arts and sciences of music and poetry.**"
  *   **Does it matter?**
      *   **For the core idea:** No. Mill's paraphrase accurately captures Bentham's radical quantitative hedonism and anti-hierarchical stance on pleasures. Bentham's "prejudice apart" is the key, directly implying that *without* prejudice, they *are* equal. Mill's wording makes the quantitative focus even more explicit.
      *   **For nuance:** Slightly. Bentham's "prejudice apart" subtly highlights that the perceived inequality is socially constructed, which aligns perfectly with his critique of sexual morality. Mill's version is a pithier statement of the principle.
      *   **For interpreting Bentham:** Essential. Citing Mill's version as Bentham's *own words* is a common error. Scholars always trace it back to *The Rationale of Reward*.

  **Settled vs. Contested Views on Bentham's Position:**

  | **Aspect**                          | **Settled/Scholarly Consensus**                                                                 | **Contested/Debated**                                                                                                                                 |
  | :---------------------------------- | :--------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Core Principle**                  | Radical quantitative hedonism: Pleasure = pleasure; no intrinsic qualitative hierarchy.         | How strictly he applied this (e.g., did "fecundity" effectively create a hierarchy? Most say it's operational, not intrinsic).                          |
  | **Sexual Morality Foundation**      | Consensual acts causing no tangible harm should not be criminalized. Opposition rooted in prejudice. | Interpretation of specific passages; emphasis on unpublished works vs. published corpus.                                                               |
  | **Harm Principle**                  | Law's only purpose is to prevent harm (pain).                                                | Definition/precise boundaries of "harm" (especially social revulsion).                                                                                |
  | **Decriminalization Argument**      | Applied this logic to homosexuality; wrote unpublished essays advocating decriminalization.     | How central this was to his overall project; his views on other sexual matters (e.g., women's rights, which were less progressive).                    |
  | **Push-Pin Analogy**                | Authentically Bentham's view; used to challenge cultural hierarchies of value.                | Whether Mill's paraphrase distorted it (consensus: it captured the essence).                                                                          |
  | **"Higher/Lower" Pleasures**        | Explicitly rejected qualitative distinctions (vs. Mill).                                       | Whether Bentham *implicitly* acknowledged differences via consequences (fecundity/purity). Most scholars say he didn't see them as *intrinsic* value. |
  | **Consent**                         | Recognized as crucial for non-harmful acts; foundation for his sexual ethics.                 | Whether his framework fully theorized consent or adequately addressed power imbalances (often seen as a later development).                           |

  **Conclusion:** While the push-pin/poetry analogy is a vivid and authentic illustration of Bentham's core hedonistic principle and its application to dismantling prejudice-based hierarchies (including sexual morality), it is an incomplete vehicle for his argument against criminalization. **The analogy breaks most significantly on the irreplaceable role of consent and the potential for differential consequences (fecundity/purity).** However, Bentham's conclusion against criminalizing consensual, harmless sexual acts remains compelling **because its true foundation is the harm principle and the critique of prejudice, not simple pleasure equivalence.** The analogy serves as a powerful rhetorical tool to expose the irrationality underlying traditional prohibitions, but the argument's enduring force comes from its commitment to preventing tangible harm and maximizing liberty, principles that stand firm even when the specific analogy is strained. The core of Bentham's view on sexual morality – opposition to criminalizing consensual acts based on prejudice – is well-established in his writings, particularly his unpublished work on "Paederasty."
