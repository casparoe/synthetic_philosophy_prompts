prompt: |-
  I am writing a paper on the "hinge" propositions that Wittgenstein discusses in the notes collected as *On Certainty*, and before I commit to a reading I want the specification laid out on paper rather than assembled ad hoc in the course of arguing. Set out the desiderata that any adequate account of hinge certainty must satisfy: the phenomena it has to explain, the cases it has to get right, the distinctions it must not collapse, and the pressures it must be able to withstand. For each requirement, give the case or consideration that motivates it and state what it would take to fail it. The purpose that fixes adequacy, for my purposes, is this: an account that can license criticism of another person's or community's hinges without covertly relying on a hinge of its own, and that leaves room for hinge change to be something other than a bare change of practice.

  The list should cover at least the following, though you should add whatever else the account is on the hook for:

  - a hinge that an entire community later abandons, not because fresh evidence refuted it but because the practice of inquiry shifted (the abandonment of a foundational framework during a period of mathematical or physical crisis is the sort of thing I have in mind) — must the account call this rational revision or conversion, and does it have a third option?
  - two communities with incompatible hinges and no agreed neutral court of appeal — can the account say that either is criticizable from outside, and if so, where does its own standard come from?
  - hinges acquired in childhood by training rather than evidence — can the account distinguish having learned a hinge from having been indoctrinated into one, and does it need to?
  - a person who holds fast to a hinge against apparent counterevidence in a way we want to call unreasonable — when does immunity from doubt become an intellectual vice, and what in the account marks the line?
  - the first-person hinge, the general hinge about how things have always been, and the hinge about method or uniformity — does one account have to treat all three as the same kind of thing, or is disunity here acceptable?
  - the account's own claims: are they hinges, ordinary assertions, or neither, and can the account say so without taking back with one hand what it gives with the other?

  Flag any subset of the requirements you believe cannot be jointly satisfied. I am particularly suspicious of the pair consisting of the requirement that hinges be groundless — justified by nothing more basic — and the requirement that their abandonment be evaluable as reasonable or unreasonable rather than merely describable; if those two cannot both be had, say so plainly and say what each option costs. Tell me which single requirement does the most work in excluding otherwise attractive accounts, and which requirements are commitments of a particular camp rather than data any account must accommodate. You need not score the main contenders against the list; I will do that myself, and I do not want a reading list or citations.

  Throughout, keep separate what is settled from what is genuinely contested among people who work on this, and do not present a contested reading as the consensus — where a constraint is the commitment of one interpretation rather than a phenomenon the account must handle, label it as such.
reasoning: |-
  Okay, the user is working on a paper about Wittgenstein's hinge propositions from *On Certainty*. They want a clear set of desiderata for any adequate account of hinge certainty. The main purpose is to find an account that allows criticizing another's hinges without relying on one's own, and to explain hinge change beyond just practice shifts. 

  First, I need to recall what hinge propositions are. They're the foundational beliefs that are immune to doubt, like "the world exists," forming the framework for inquiry. The user lists several cases any account must handle: community abandonment of hinges, incompatible communities, childhood training, unreasonable adherence, different hinge types, and the account's own status.

  The user is suspicious about whether hinges can be both groundless and their abandonment evaluable as reasonable/unreasonable. That tension is key. If hinges are truly groundless, how can changing them be rational? That's a core challenge. I should flag that as potentially impossible to satisfy jointly.

  For each requirement, I need to specify the phenomenon, what motivates it, and what failing it looks like. Let's start with community abandonment. The case is a paradigm shift in science or math, like moving from Newtonian to relativistic physics. The account must explain this without calling it just rational revision or conversion. A third option might hinge on practice changes. Failing would be reducing it to mere whim or only rational based on new evidence.

  Then there's incompatible communities with no neutral court. Can we criticize either from outside? The account must explain where the standard comes from without circularity. Failing would be either relativism (no criticism possible) or dogmatism (imposing one's hinges).

  Childhood training vs. indoctrination. Is there a difference? The account needs to distinguish learning from indoctrination without appealing to evidence. Failing might collapse the distinction or require evidence where there is none.

  Unreasonable adherence: when does holding a hinge become stubborn? The account must mark when immunity turns into vice. Failing would be making all adherence reasonable or allowing too easy abandonment.

  Different hinge types: personal, general, methodological. Should they be treated uniformly? The account might allow disunity, but mustn't collapse distinctions. Failing could be over-unifying or not explaining their roles.

  The account's own status: if it discusses hinges, what are its claims? It must avoid self-defeat. Failing would be relying on its own unstated hinges.

  The user's hidden need seems to be avoiding relativism while not falling into absolutism. They want to criticize other hinges without a privileged foundation. Also, they need hinge change to be more than arbitrary, perhaps involving reasons that aren't evidential. The deep challenge is balancing the groundless nature of hinges with the possibility of rational evaluation in changes. This might require introducing a concept of non-evidential reasons tied to practices or frameworks. I should highlight that tension as central and note which requirement (rational evaluation of groundless hinges) is the hardest, probably excluding evidentialist accounts. Also, point out that some requirements, like the need for criticism without own hinges, are interpretive commitments rather than universal data.
answer: |-
  Here is a specification of desiderata for an adequate account of hinge certainty, structured as requested. I've incorporated your listed points, added others implied by the core phenomena and your purpose, flagged tensions, and clarified the status of constraints.

  **Core Purpose:** The account must license criticism of another's hinges without covertly relying on a hinge of its own and explain hinge change as more than a bare shift in practice.

  **Desiderata:**

  1.  **Explaining Radical Practice-Shift without Evidence-Driven Refutation:**
      *   **Phenomenon/Motivation:** A community abandons a foundational hinge (e.g., Euclidean geometry as *the* framework for physical space, phlogiston theory's core presuppositions, Newtonian absolute time/space) not due to new evidence directly contradicting *it*, but because the entire investigative practice shifted, rendering the hinge obsolete or incompatible.
      *   **Must Explain:** How such abandonment can be something other than *either* (a) a rational inference based on new evidence *against the hinge itself*, *or* (b) a brute, non-rational conversion/"gestalt switch". It must offer a "third option" (e.g., change driven by the evolving needs/practices of inquiry, failure of the hinge to *function* effectively within a transformed web).
      *   **Failure:** Reducing the shift *only* to (a) misrepresents the hinge's role (it wasn't directly testable) or *only* to (b) makes it arbitrary and inexplicable beyond description.

  2.  **Licensing Criticism Across Incommensurable Frameworks:**
      *   **Phenomenon/Motivation:** Two communities operate with incompatible hinges (e.g., fundamentally different conceptions of causality, evidence, or the nature of reality) with no shared, more basic standard for adjudication.
      *   **Must Explain:** Whether criticism of one community's hinges from the *other's* perspective (or an external one) is possible and coherent. If so, it must specify the *source* of the critical standard without surreptitiously relying on the critic's *own* hinges as an unexamined foundation.
      *   **Failure:** Collapsing into relativism (no genuine criticism possible) *or* dogmatism (criticism relies on the critic's unacknowledged hinges as absolute truth).

  3.  **Distinguishing Training from Indoctrination (Childhood Acquisition):**
      *   **Phenomenon/Motivation:** Hinges are acquired in childhood through training, drill, and habituation ("This is a hand", "Objects persist unobserved", "Parents can be trusted"), not evidential justification.
      *   **Must Explain:** Whether an account *can* and *needs to* distinguish acquiring a hinge through "normal" enculturation (enabling inquiry/life) from "indoctrination" into a harmful or dysfunctional certainty. Failure to distinguish might normalize harmful certainties; requiring a sharp distinction might import inappropriate evidential standards.
      *   **Failure:** Either (a) treating *all* hinge acquisition as indoctrination (undermining the possibility of functional world-pictures), (b) being unable to identify harmful/dysfunctional hinges acquired this way, or (c) illicitly importing evidential criteria into the acquisition process.

  4.  **Demarcating Reasonable vs. Unreasonable Adherence:**
      *   **Phenomenon/Motivation:** A person clings stubbornly to a hinge (e.g., "The Earth is flat," "This leader is infallible") despite overwhelming *apparent* counter-evidence or contextual pressures that make the certainty seem pathological or obstructive.
      *   **Must Explain:** What marks the line where the *immunity from doubt* constitutive of hinges becomes an *intellectual vice* (stubbornness, closed-mindedness, dogmatism). It must identify factors *within the framework* or *about the context* that render adherence unreasonable, without requiring the hinge itself to be evidentially falsifiable.
      *   **Failure:** Making *all* hinge adherence automatically reasonable (immunizing harmful dogmas) *or* making adherence unreasonable whenever significant challenge arises (collapsing hinges into ordinary dubitable beliefs).

  5.  **Accounting for Hinge Diversity (Personal/General/Methodological):**
      *   **Phenomenon/Motivation:** Wittgenstein discusses diverse examples: deeply personal hinges ("I have never been to the moon"), general world-picture hinges ("The Earth has existed for a long time"), and methodological hinges ("There are physical objects," "Induction is reliable," "Sense experience is generally trustworthy").
      *   **Must Explain:** Whether one unified account (same kind of certainty, same role, same mode of revision) applies to all types, or if disunity (different kinds or roles for different hinges) is acceptable/permissible. Must avoid collapsing essential functional differences.
      *   **Failure:** Forcing a Procrustean unity where significant differences exist *or* positing disunity without explaining how these disparate elements collectively form the "scaffolding" of thought.

  6.  **Explaining the Account's Own Epistemic Status:**
      *   **Phenomenon/Motivation:** The philosophical account itself makes claims *about* hinges and their role. What is the status of these claims? Are *they* hinges? Ordinary empirical claims? Something else?
      *   **Must Explain:** How the account can articulate its theses without self-defeat. It must avoid claiming its *own* foundational premises are hinges (violating the purpose of criticism without reliance) *or* that they are ordinary empirical claims (which would require justification by more basic hinges, leading to regress or contradiction). Must achieve coherence without "taking back" its core insights.
      *   **Failure:** The account covertly relies on its own unstated hinges *or* renders itself inexplicable within its own terms (e.g., as a nonsensical attempt to say what can only be shown).

  7.  **Explaining the Groundlessness of Hinges:**
      *   **Phenomenon/Motivation:** Hinges are not justified by more basic beliefs or evidence; they are the *foundation* upon which justification rests ("It is not based on grounds. It is there - like our life" - OC 559). They are "animal" (OC 359), part of our inherited background.
      *   **Must Explain:** How certainty can be intrinsic, non-inferential, and not derived from anything more fundamental. Failure to capture this misrepresents their foundational role.
      *   **Failure:** Explaining hinge certainty as the product of implicit inference, evidence, or justification, thereby undermining their status as the *bedrock*.

  8.  **Explaining the Possibility of Reasonable Revision/Abandonment:**
      *   **Phenomenon/Motivation:** While hinges are held fast, Wittgenstein acknowledges frameworks *can* shift (OC 96-99, 256, 617). We need to make sense of how abandoning a hinge, while momentous, isn't *necessarily* arbitrary or irrational, even if not driven by direct evidence against *it*.
      *   **Must Explain:** How hinge change can be responsive to *reasons* (e.g., persistent failure of the framework to handle anomalies, incoherence within the world-picture, pragmatic inadequacy) without those reasons constituting evidence *against the hinge proposition itself* in the way evidence counts against ordinary empirical claims. It must show how change can be *evaluable* as reasonable/unreasonable.
      *   **Failure:** Rendering hinge change *only* describable as a brute shift in practice ("form of life") with no evaluative dimension, *or* smuggling in evidential justification for the hinge itself.

  **Critical Tensions & Classifications:**

  1.  **The Core Tension (Groundlessness vs. Reasonable Revision):**
      *   **Conflict:** Desiderata 7 (Groundlessness) and 8 (Reasonable Revision) are in *prima facie* tension. If hinges are truly groundless (7), how can abandoning them be *reasonable* (8) in a normatively significant sense, rather than just a change? Conversely, if abandonment can be reasonable (8), does this imply they *were* grounded in something (violating 7)?
      *   **Costs of Options:**
          *   **Prioritize Groundlessness (7):** Risks making hinge change inexplicable beyond description (failing 8 and potentially 1). Change becomes a brute shift in "form of life," making criticism across frameworks (2) impossible and unreasonableness (4) merely perspectival.
          *   **Prioritize Reasonable Revision (8):** Risks undermining groundlessness (7). If reasons for change can be articulated, it suggests the hinge *was* implicitly justified by its coherence/pragmatic success within a wider context, making it less "bedrock" and more like a very high-level empirical hypothesis or convention. This might collapse the distinction between hinges and very firmly held beliefs.
      *   **Resolution Attempt?** A viable account must navigate this by finding a notion of "reason" or "rationality" applicable to framework shifts that is *non-evidential* and *holistic* (e.g., based on coherence, fruitfulness, enabling inquiry, resolving persistent dysfunction) but still distinct from mere whim.

  2.  **The Most Exclusionary Requirement:** **Desideratum 6 (Account's Own Status)** does the most work in excluding otherwise attractive accounts. Many interpretations stumble by either (a) implicitly treating their own claims as hinges (violating the purpose of criticism without reliance) or (b) being unable to coherently place their claims within the framework they describe, leading to paradox or performative contradiction. Accounts that avoid this often require a sophisticated meta-philosophical stance (e.g., therapeutic, elucidatory).

  3.  **Requirements as Interpretive Commitments vs. Data:**
      *   **Primarily Data (Phenomena to Explain):** 1 (Radical Shift), 3 (Childhood Acquisition), 4 (Unreasonable Adherence), 5 (Hinge Diversity - the *existence* of types is data, whether they need one account is interpretive), 7 (Groundlessness - strongly attested in OC text).
      *   **Strong Interpretive Commitments (Reflecting Particular Readings):**
          *   **2 (Criticism Across Frameworks):** The *demand* that criticism *must* be possible from outside is not universally accepted; some readings embrace a more relativistic or quietist stance where criticism is only internal. This requirement stems from *your* purpose.
          *   **3 (Training vs. Indoctrination Distinction):** The *need* for this distinction, especially its evaluative component, is an interpretive commitment. Some readings see hinges as enabling conditions *simpliciter*, making "indoctrination" a category error or an external moral/political judgment irrelevant to hinge epistemology.
          *   **8 (Reasonable Revision):** The *strength* of this requirement ("evaluable as reasonable/unreasonable") goes beyond Wittgenstein's descriptive remarks and reflects a desire to avoid bare relativism/pragmatism. Some readings accept that hinge change is ultimately non-rational.
          *   **6 (Account's Own Status):** The *demand* that the account avoid self-reliance and self-defeat is a high bar set by your purpose and specific interpretations; others might accept it relies on hinges or is nonsensical.

  **Conclusion:** An adequate account faces the formidable challenge of reconciling the groundless, foundational nature of hinges (7) with the possibility of their non-arbitrary revision (1, 8) and the potential for reasoned criticism across frameworks (2), all while maintaining internal coherence about its own status (6) and handling the diverse phenomena (3, 4, 5). The tension between groundlessness and reasonable revision is the central philosophical hurdle. Whether all desiderata *can* be jointly satisfied, especially given your core purpose, remains a deeply contested question in Wittgenstein scholarship. The viability of an account hinges (pun intended) on its ability to articulate a robust notion of non-evidential, framework-relative rationality governing the adoption and abandonment of our most fundamental certainties.
