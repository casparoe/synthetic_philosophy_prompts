     - Group 2: Recalculate criteria: count how many in Round 1 classified group met each of A, B, C. Drop the least common and replace with D. Write the new criteria (the two kept and D) on the board. Then collect forms (students have filled them out for the new criteria? They need to know the new criteria before filling. So after announcing the new criteria, give them a minute to fill? This might take time. Alternatively, they fill the form with the new criteria in mind.

       Steps for Group 2 Round 2:
          1. Announce: "The criteria have changed. The new criteria are: [A, B, D]." Write them on the board.
          2. Students fill the form for Round 2 (for criteria A, B, D) and adjust based on their role and Round 1 classification.
          3. Collect and classify (at least two). Announce.

     - This might take 5 minutes.

  - 0:20-0:25: Round 3.
     - Same as Round 2.
     - Group 1: Recalculate threshold (mean of Round 2 classified group). Classify and announce.
     - Group 2: Recalculate criteria: count for A, B, D in Round 2 classified group. Drop the least common and replace with E. Write new criteria. Students fill form. Classify and announce.

  - 0:25-0:35: Switch conditions. Groups swap conditions. Redistribute role cards randomly (so each student gets a new role). Group 1 now does Condition B, Group 2 does Condition A.

  - 0:35-0:45: Round 1 for new condition (same as above).

  - 0:45-0:50: Round 2 for new condition.

  - 0:50-0:55: Round 3 for new condition.

  - 0:55-1:15: Debrief.

  **Debrief Script:**

  1. Ask Group 1: "When you did the continuous condition first, what happened to the threshold and the group of classified people over the three rounds?" (Expected: the threshold adjusted and the group might have stabilised.)

  2. Ask Group 2: "When you did the disjunction condition first, what happened to the criteria and the group of classified people?" (Expected: the criteria changed, and the group changed in composition.)

  3. Then ask about the other condition they did.

  4. Draw on the board two diagrams: one for Condition A showing the threshold moving and the scores clustering, and one for Condition B showing the criteria changing and the group fragmenting.

  5. Introduce "looping effects": the way the classification affects the people and then the people's reactions change the classification.

  6. Highlight: In Condition A, the loop settled into a stable equilibrium. In Condition B, it did not settle; the category kept changing and fragmenting.

  7. The key insight: The structure of the classification system (continuous vs. disjunctive) influences whether the looping effect leads to a stable kind. This matters because if the category keeps changing, we cannot accumulate knowledge about it.

  8. Finally, note that real psychiatric classifications often use disjunctive criteria (like the DSM) and thus may be prone to fragmentation and instability.

  **Note:** The activity is a model. In reality, looping effects are more complex and involve social and personal factors that we haven't captured.

  This should fit in 90 minutes. Good luck!
answer: |-
  ### **Looping Effects Classroom Activity: "Chronosyndrome" Simulation**

  #### **Concept Overview**
  This activity simulates Ian Hacking's "looping effects" using a fictional syndrome, **Chronosyndrome**, invented for the session. Students act as both classifiers and classified, with explicit revision rules and contrasting conditions:  
  - **Condition 1 (Continuous Trait):** Classification based on a threshold of a single measurable trait.  
  - **Condition 2 (Disjunctive Criteria):** Classification based on meeting any two of three loosely related features.  

  The goal is for students to experience how the **structure of the classification system** (continuous vs. disjunctive) determines whether the looping effect stabilises or fragments the category. No prior knowledge is needed.  

  ---

  ### **Materials List**  
  1. **Role Cards (16 total):**  
     - 8 × **Acceptor Cards** (red cardstock):  
       ```  
       Role: ACCEPTOR  
       If classified with Chronosyndrome: Adjust your next response to make classification MORE likely.  
       If NOT classified: Adjust your next response to make classification LESS likely.  
       ```  
     - 8 × **Contester Cards** (blue cardstock):  
       ```  
       Role: CONTESTER  
       If classified with Chronosyndrome: Adjust your next response to make classification LESS likely.  
       If NOT classified: Adjust your next response to make classification MORE likely.  
       ```  

  2. **Self-Report Instruments (Printed Forms):**  
     - **Condition 1 (Continuous Trait) Form:**  
       ```  
       TEMPORAL FLEXIBILITY SCALE (TFS)  
       How easily can you adapt when plans change?  
       Circle ONE number (0–10):  
       0 = "I struggle severely — changes derail me."  
       10 = "I adapt instantly — changes don’t faze me."  
       ```  
     - **Condition 2 (Disjunctive Criteria) Form:**  
       ```  
       CHRONOSYNDROME SELF-REPORT  
       In the past hour, have you:  
       A. Felt impatient when waiting?  [Yes / No]  
       B. Lost track of time?            [Yes / No]  
       C. Multi-tasked to save time?     [Yes / No]  
       ```  

  3. **Classification Manual (Teacher’s Sheet — Displayed on Board):**  
     - **Condition 1 (Continuous):**  
       ```  
       CHRONOSYNDROME = TFS score ≤ 4  
       (Revised after each round using the MEAN score of currently classified group.)  
       ```  
     - **Condition 2 (Disjunctive):**  
       ```  
       CHRONOSYNDROME = At least TWO of A, B, or C.  
       (Revised after each round: Only the MOST COMMON feature in the current group is retained. Others are replaced.)  
       ```  

  4. **Other:**  
     - Whiteboard markers (to display criteria/threshold revisions).  
     - Timer.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Phase 1: Setup (5 mins)**  
  - 0:00–0:05: Split students into two groups of eight. Assign roles randomly (4 Acceptors + 4 Contesters per group).  
  - **Teacher Script:**  
    *“Today, we’ll simulate a psychological assessment. Each group will classify peers using a manual I’ll provide. Follow your role card’s rules when adjusting your responses. No discussion — focus on your role.”*  

  **Phase 2: Condition 1 — Continuous Trait (25 mins)**  
  - **Round 1 (5 mins):**  
    - Distribute **TFS forms**. Students circle a number 0–10 (baseline response).  
    - Collect forms. Calculate initial threshold: **Threshold = Mean score of all students minus 2** (e.g., if mean=6.0, threshold=4.0).  
    - Classify: Anyone scoring **≤4.0** has Chronosyndrome. Write names of classified students on the board.  
  - **Round 2 (10 mins):**  
    - **Revise threshold:** New threshold = **Mean score of Round 1 classified group**.  
    - Distribute new TFS forms. Students adjust scores based on role and Round 1 classification (e.g., Acceptors increase/decrease by 2 points; Contesters do the opposite).  
    - Classify using new threshold. Record names.  
  - **Round 3 (10 mins):**  
    - Repeat Round 2 (revise threshold using Round 2 classified group).  

  **Phase 3: Condition 2 — Disjunctive Criteria (25 mins)**  
  - **Round 1 (5 mins):**  
    - Distribute **disjunctive forms**. Students answer A/B/C (baseline).  
    - Collect forms. Classify: Anyone with **≥2 "Yes"** responses has Chronosyndrome. Record names.  
  - **Round 2 (10 mins):**  
    - **Revise criteria:** Identify the **most common feature** in Round 1 classified group (e.g., "A" if 60% reported impatience). Drop other features and add **one new feature**:  
      ```  
      NEW CRITERIA:  
      Retain MOST COMMON feature from Round 1 (e.g., A).  
      Replace others with:  
      D. Felt restless? [Yes / No]  
      E. Rushed a task? [Yes / No]  
      ```  
    - Distribute new forms (with updated criteria). Students adjust responses based on role.  
    - Classify using new criteria (e.g., "A + D" or "A + E"). Record names.  
  - **Round 3 (10 mins):**  
    - Repeat Round 2 (retain most common feature from Round 2 classified group; replace others with **F. Checked the time repeatedly?**).  

  **Phase 4: Debrief (35 mins)**  
  - **0:55–1:00:** Reassemble class. Display data from both conditions (thresholds/criteria changes, classified names per round).  
  - **1:00–1:20:** Structured discussion:  
    *“Compare the two conditions. What happened to the classification in each? How did your adjustments affect the group? Why did one stabilise and the other splinter?”*  
  - **1:20–1:30:** Introduce "looping effects":  
    *“You’ve experienced looping effects — classifications altering the classified. But the critical insight isn’t that looping happens; it’s that the* structure *of the classification determines whether the loop* stabilises *(Continuous) or* fragments *(Disjunctive). In psychiatry, this shapes whether ‘kinds’ of people become stable targets for knowledge.”*  
  - **1:30–1:35:** Connect to Hacking:  
    *“Real debates aren’t about ‘do loops occur?’ but ‘what shape do they take?’”*  

  ---

  ### **Predicted Problems & Solutions**  
  1. **Problem:** Students don’t adjust responses as per role (e.g., Contesters "troll" by moving toward the label).  
     **Solution:** Privately remind them: *“Stick to your role — it’s essential for the simulation. Imagine this label has real social consequences.”*  

  2. **Problem:** Calculation delays (revising thresholds/criteria).  
     **Solution:** Pre-calculate likely scenarios. If stuck, round numbers (e.g., threshold=3.8 → 4).  

  3. **Problem:** One condition dominates discussion.  
     **Solution:** Force equal airtime: *“Group 1: What happened in Continuous? Group 2: Now Disjunctive.”*  

  4. **Problem:** Students question the fictional syndrome.  
     **Solution:** Redirect: *“Suspend disbelief — we’re testing how classifications behave, not whether this ‘disorder’ is real.”*  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The Emotional Stakes of Real Labels**  
  - **Limitation:** The simulation cannot replicate the lived experience of psychiatric labels (stigma, identity shifts, power dynamics).  
  - **Closing Discussion (Post-Debrief):**  
    *“In this activity, you adjusted responses mechanically. But in reality, looping effects involve* identity, resistance, and social power. *Imagine being diagnosed with ‘schizophrenia’ — that label alters how others see you, how you see yourself, and what treatments you receive. Our simulation shows* why *structural instability in disjunctive diagnoses (like the DSM) makes it harder to build reliable knowledge. But the* human cost *requires listening to patients’ stories — which we’ll do next week.”*  

  ---

  ### **Why This Works**  
  - **Students "Feel" the Loop:** By adjusting responses and seeing the category mutate, they viscerally grasp why looping matters.  
  - **Contrast Reveals the Key Insight:** Continuous traits converge (stable "kind"); disjunctive criteria fragment (unstable "kinds").  
  - **No Lectures, No Jargon:** The debrief names "looping effects" only after they’ve lived it.  

  **Final Note:** Use British English throughout (e.g., "timetable" instead of "schedule," "maths" instead of "math"). Spellings: "behaviour," "stabilise," "centre." Punctuation: Single quotes for concepts (‘looping’), double for quotes (“I adapt instantly”).
