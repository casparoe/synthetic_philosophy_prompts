answer: |-
  Here’s a structured research proposal tailored to your needs, designed to force precision on your "relocation" hypothesis while embedding scope realism and failure conditions.  

  ---

  **Research Proposal: Is the Unity Problem Invariant? Relocating Bradley’s Regress Across Frameworks**  

  **1. Core Question (Sharpened):**  
  *Is Bradley’s regress—as a problem about the unity of propositions—fundamentally tied to relational models of predication, or does it persist (in structurally analogous form) in any framework that explains compositionality, including function/application models?*  
  **What makes this determinate?**  
  - **Success criterion**: A rigorous account of "structural analogy" defining when a problem is "relocated" (not dissolved), requiring:  
    (i) A *formal isomorphism* between the infinite regress in relational models and a successor problem in non-relational models;  
    (ii) The successor problem bearing the *same metaphysical cost* (e.g., infinite explanatory demands, brute unification).  
  - **Failure criterion**: If "relocation" reduces to arbitrary formalism-specific labeling (e.g., "typing problem" vs. "relation regress" with no difference in explanatory burden), the hypothesis is empty.  

  **2. Why Existing Debates Leave This Open:**  
  - **Relationalist responses** (e.g., positing non-relational ties) focus on *halting the infinite regress within a relational ontology*. They don’t test whether the *underlying unity demand* migrates to non-relational frameworks.  
  - **Dependence-regress views** (e.g., grounding relations without further relata) address *ontological hierarchy* but sidestep whether functional or non-relational systems inherit a variant of the problem at the level of *compositional glue*.  
  - **Formal semantic approaches** (e.g., function/argument models) often dismiss unity as "solved" by typing rules—but this assumes typing is explanatorily cost-free. Your roommate’s "typing problem" remark highlights the ambiguity: is typing *metaphysically neutral syntax* or does it conceal unresolved unity demands? Current literature rarely presses this.  

  **3. Method & Work Plan:**  
  **Month 1: Define "Relocation" and Establish a Test**  
  - **Weeks 1–2**: Formalize the structure of Bradley’s regress:  
    - Input: A proposition P = R(a, b).  
    - Step 1: R requires a further relation R₁ to unite it with a.  
    - Step n: Rₙ requires Rₙ₊₁ → infinite explanatory deferral.  
  - **Weeks 3–4**: Define "relocation":  
    - A problem Q is a *relocation* of Bradley’s regress iff:  
      (a) Q arises in a non-relational model M of predication;  
      (b) Q exhibits iterative deferral isomorphic to Bradley’s steps;  
      (c) Q imposes analogous metaphysical burdens (e.g., infinite "glue" entities, brute saturation).  
    - *Failure condition*: If no non-arbitrary distinction emerges between "dissolved" and "relocated" (e.g., all candidate Q’s are trivially renamed regresses), the hypothesis collapses.  

  **Month 2: Test Two Non-Relational Models**  
  - **Model 1: Fregean Function/Application**  
    - Test case: P = F(a).  
    - Investigate: Does uniting function F with argument a require a "higher-order" function? Does function-typing (e.g., F: e→t) resolve unity or merely defer it to type-system unity?  
    - *Key risk*: If typing rules fully explain unity without infinite deferral, your roommate is right → project fails.  
  - **Model 2: Mereological Bundle Theory**  
    - Test case: P = a⊕F (a "bundle" of particulars and universals).  
    - Investigate: Does bundling require a "compresence" relation? If compresence is primitive, does *its* unity with the bundle restart the regress?  
    - *Contrast with Model 1*: Does the residue differ (e.g., binding vs. saturation)?  

  **Month 3: Characterize the Residue**  
  - **Weeks 9–10**: Compare residues across models:  
    - Is there a *core invariant* (e.g., all frameworks require *one* brute unification)?  
    - Or do residues diverge (e.g., function-binding vs. relation-instantiation)?  
  - **Week 11–12**: Draft taxonomy:  
    - **Type 1**: Frameworks where unity reduces to syntax (e.g., typing; *dissolution*).  
    - **Type 2**: Frameworks where unity demands iterative glue (e.g., higher-order functions; *relocation*).  
    - **Type 3**: Frameworks with brute, non-relational unity (e.g., primitive predication; *dissolution?*).  

  **4. Deliverable & Success Metrics:**  
  - **Positive outcome**: A taxonomy of frameworks by where unity problems (i) dissolve, (ii) relocate isomorphically, or (iii) relocate asymmetrically.  
  - **Negative outcome** (project failure):  
    - If "relocation" cannot be defined independently of formalism (e.g., typing vs. relations is purely notational).  
    - If all residues reduce to Type 3 (brute unity) → your suspicion is unsupported.  
    - If no framework exhibits isomorphic regress (e.g., function-application truly dissolves unity).  
  - **Scope compliance**: 8–10k words; no formal appendix (conceptual analysis only).  

  **5. Why This Might Collapse (And How You’ll Know):**  
  - **By Month 1 end**: If you can’t formalize "relocation" without presupposing relational assumptions, your hypothesis is circular.  
  - **By Month 2 mid**: If both tested models resolve unity without iterative deferral (e.g., via primitive saturation), the regress *is* dissolved in non-relational frameworks → roommate’s view wins.  
  - **By Month 3 start**: If residues across models are incommensurable (e.g., typing vs. bundling concerns), the taxonomy may be artificial → pivot to diagnosing framework relativity.  

  **6. Conclusion:**  
  This proposal forces your "itch" into a testable claim: *Bradley’s regress reveals an invariant problem of compositional unity that survives translation across frameworks*. It succeeds if residues are isomorphic and metaphysically costly; it fails if unity dissolves under scrutiny or fractures into framework-specific puzzles. Either outcome is philosophically substantive for understanding predication’s limits.  

  ---  

  **Key strengths for your needs**:  
  - Embeds *falsifiability*: Clear conditions under which your hypothesis fails (e.g., Month 1–2 off-ramps).  
  - Avoids grand claims: Focuses on a *taxonomy*, not a solution.  
  - Forces engagement with the "relabeling" worry via *metaphysical cost* comparisons.  
  - Isolates your target (invariance of unity demands) from adjacent debates (e.g., regress-stopping).  

  If Month 1 reveals that "metaphysical cost" is too subjective to measure, or Month 2 shows functional models *do* fully dissolve unity, you’ll have a defensible negative result—still valuable for your prospectus.
