     In Variant 3, the strategy-stealing argument might be applied, but it requires an extra assumption about the game. What is that assumption? (Name the property and state what it means in this context.)

  Finally, consider the base game again. The strategy-stealing argument shows that the first player has a winning strategy, but it does not tell us what that strategy is.

  e) (5 points, suggested time: 10 minutes)
     Does the argument provide knowledge that a winning strategy exists for the first player? And is the gap between knowing that a winning strategy exists and knowing what it is a real epistemic gap (i.e., a gap in knowledge) or merely a psychological one? Briefly explain your view.

  Total: 25 points. Time: 90 minutes.

  ******************************************************************************
  Now, the model answer:

  a) Recap of the strategy-stealing argument for the base game:
     - Assume, for contradiction, that the second player (Black) has a winning strategy.
     - The first player (White) can make an arbitrary first move and then, for the rest of the game, pretend to be the second player by following Black's winning strategy as if that first move had not been made. Specifically, White treats themselves as the second player in a new game that is the same as the current game but without White's first move. For each move of Black in the actual game, White uses the winning strategy to respond in the new game, and then plays that response in the actual game. However, if the strategy calls for playing on the cell that was already taken by White's first move, then White makes an arbitrary move (since the cell is already occupied).
     - Since the winning strategy guarantees a win for the player using it (Black in the new game), and White is impersonating that player, White would win the new game. But in the actual game, White has an extra stone on the board (the first move) and Black has one fewer stone. Moreover, the winning condition is monotonic: having an extra stone of your own color cannot hurt your own winning condition. Therefore, if White wins in the new game, then in the actual game White also wins because they have at least the stones they had in the new game (plus the extra stone).
     - This is a contradiction because we assumed Black has a winning strategy. Hence, Black cannot have a winning strategy.
     - Since the game is deterministic, perfect information, and cannot end in a draw, one of the players must have a winning strategy. Therefore, because the second player does not, the first player must have a winning strategy.

  b) Variant 1:
     (i) The additional property required is that the game is such that there are no draws (i.e., in every completed board, exactly one player has won).
     (ii) Variant 1 does not have this property. A draw is possible. Example on a 2x2 grid:

          Top row: White in left cell, Black in right cell.
          Bottom row: Black in left cell, White in right cell.

          So the board looks like:

            W B
            B W

          With 4-directional adjacency:
            - White has no vertical path: the top row white is not connected to the bottom row white (they are not adjacent).
            - Black has no horizontal path: the left column black is not connected to the right column black.

          Therefore, neither player has won.

  c) Variant 2:
     The premise that is violated is the monotonicity of the winning condition with respect to one's own stones. In the base game, having an extra stone of your own color cannot hurt (it can only help or be neutral). But in Variant 2, having an extra stone might create a closed loop, which causes an immediate loss. 

     How the extra stone becomes a liability: 
     - In the strategy-stealing argument, White makes an extra move at the beginning. Then during the impersonation, if at some point the winning strategy (which is for Black) calls for a move that is already occupied by White's first move, White makes an arbitrary move. This arbitrary move might create a closed loop for White. Alternatively, even if not, the presence of the extra stone might cause a closed loop to be formed earlier than it would have been in the new game. In the new game (without the extra stone), the closed loop might not have been formed, so the player using the strategy would have won. But in the actual game, because of the extra stone, White might form a closed loop and lose.

  d) Variant 3:
     The extra assumption is that the game is determined. Determinacy means that one of the players has a winning strategy. In the context of an infinite game, this is not automatically guaranteed (unlike finite games). The strategy-stealing argument shows that the second player does not have a winning strategy, but without determinacy, it is possible that neither player has a winning strategy.

  e) The argument does provide knowledge that a winning strategy exists for the first player. The gap between knowing that a winning strategy exists and not knowing what it is is a real epistemic gap. The reason is that the proof is non-constructive: it does not give any information about the winning strategy. Therefore, we know that there exists a winning strategy, but we do not know any particular strategy that wins. This is a gap in knowledge, not merely psychological, because even given unlimited computational resources, we might not be able to find the strategy (for large n) and we have no description of it. However, some might argue that the gap is psychological because in principle, since the game is finite, one could try all strategies, but that is not feasible in practice. The philosophical view might vary, but the standard position in philosophy of mathematics is that non-constructive proofs give existence knowledge without providing an instance.

  Model answer (detailed) around 750 words:

  a) The strategy-stealing argument for the base game proceeds by contradiction. We assume that the second player (Black) has a winning strategy. The first player (White) can then make an arbitrary first move, and for the remainder of the game, White adopts the role of the second player by "impersonating" Black's winning strategy in a hypothetical game that is identical to the current game except without White's first move. Specifically, White ignores the first move and treats the current state as a game in which it is Black's turn to move. For every move Black makes in the actual game, White consults the winning strategy for the hypothetical game to determine the appropriate response, and plays that response in the actual game. If the winning strategy ever prescribes playing in the cell that was already taken by White's first move, then White instead makes an arbitrary move (since that cell is occupied). 

     Because the winning strategy (for Black) in the hypothetical game guarantees a win for the player using it (who is now White in the actual game), White would win the hypothetical game. However, the actual game has an extra white stone (the first move) and one fewer black stone. Crucially, the winning condition is monotonic: having an extra stone of one's own color cannot prevent a win that would have occurred without it. Therefore, if White wins in the hypothetical game, then in the actual game White must also win (or have already won). This contradicts the assumption that Black has a winning strategy, because here White wins even though Black used their winning strategy.

     Thus, the second player cannot have a winning strategy. Moreover, because the base game is finite, deterministic, and has no draws (exactly one player wins), it follows that the first player must have a winning strategy.

  b) (i) To conclude that the first player wins, we need the additional property that the game is such that a draw is impossible. That is, in every completed board, either White has a winning path or Black has a winning path (but not both and not neither).

     (ii) In Variant 1 (with 4-directional adjacency), this property does not hold. A draw is possible. For example, on a 2x2 grid, consider the following configuration:

          Row 1: White in column 1, Black in column 2.
          Row 2: Black in column 1, White in column 2.

          Visually:

            W B
            B W

          With 4-directional adjacency, there is no vertical path of white stones: the white stones are at (1,1) and (2,2), and they are not adjacent (no shared edge). Similarly, there is no horizontal path of black stones: the black stones are at (1,2) and (2,1), and they are not adjacent. Therefore, neither player has won.

  c) In Variant 2, the additional rule causes a violation of the monotonicity assumption. The argument assumes that having an extra stone of your own color is never harmful. However, in this variant, an extra stone might create a closed loop, which causes an immediate loss. 

     Specifically, during the impersonation, when White makes the extra first move and then follows Black's winning strategy, it is possible that the presence of that extra stone completes a closed loop for White at some point. For instance, the extra stone might connect two parts of a potential loop that would not have been connected without it. Even if the loop is not directly caused by the extra stone, the arbitrary move that White makes when the strategy calls for the already occupied cell might create a loop. In any case, if a closed loop of white stones is formed, White loses immediately, which could turn a winning position in the hypothetical game into a losing position in the actual game. Therefore, the extra stone can be a liability.

  d) For Variant 3 on an infinite board, the strategy-stealing argument requires the assumption of determinacy. Determinacy means that in this two-player, perfect-information game with no chance elements, one of the players has a winning strategy. For finite games, determinacy is guaranteed by Zermelo's theorem, but for infinite games, it is not. The strategy-stealing argument shows that the second player cannot have a winning strategy, but without determinacy, it is possible that neither player has a winning strategy (i.e., the game is undetermined). Therefore, to conclude that the first player has a winning strategy, we need to assume that the game is determined.

  e) The argument provides knowledge that a winning strategy exists for the first player because it is a valid mathematical proof. However, it is non-constructive: it does not specify what the winning strategy is. The gap between knowing that a winning strategy exists and knowing what it is is a real epistemic gap. This is because the proof does not give any information about the winning strategy; it only shows that one must exist. Therefore, we lack knowledge of the particular strategy. This gap is not merely psychological because even with full logical reasoning, we do not know the winning strategy. In philosophy, this is often discussed in the context of non-constructive mathematics: we have a proof of existence without a witness. While one might argue that in principle the strategy could be found by brute force (since the game is finite for any fixed n), the argument does not provide it, and for large n, brute force is infeasible. Hence, we are genuinely ignorant of the winning strategy.

  ******************************************************************************
  Marking scheme:

  a) 8 points:
     - Recapping the argument: 5 points
          * Assume Black has a winning strategy. (1 point)
          * White makes an arbitrary move and then impersonates the second player using Black's strategy. (2 points)
          * If the strategy calls for the already occupied cell, White makes an arbitrary move. (1 point)
          * The extra stone is harmless in the base game (monotonicity) and leads to White winning, contradiction. (1 point)
     - Conclusion: 3 points
          * Black cannot have a winning strategy. (1 point)
          * Since the game has no draws and is finite, the first player must have a winning strategy. (2 points)

  b) 6 points:
     - (i) 2 points: The additional property is that the game has no draws (or exactly one player wins in every completed board).
     - (ii) 4 points: 
          * Drawing the 2x2 grid with the described position (W B / B W) or equivalent. (2 points)
