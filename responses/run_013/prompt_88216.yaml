  ### The question as it will be printed

  **Midterm Exam Question: Strategy-Stealing Argument Analysis**  
  *(Total: 25 points; Suggested time: 20 minutes for a, 15 minutes for b, 15 minutes for c, 10 minutes for d, 10 minutes for e; 30 minutes for review/transfer)*  

  Consider a two-player game on an \(n \times n\) grid (\(n \geq 1\)). Players alternate turns: **White (first player)** places a white stone on an empty cell, and **Black (second player)** places a black stone. **White wins** by forming a contiguous path (via shared sides) of white stones connecting the **top edge to the bottom edge**. **Black wins** by forming a contiguous path of black stones connecting the **left edge to the right edge**. Adjacency is defined as **sharing a side** (four possible directions: up, down, left, right). This is the **base game**.  

  The strategy-stealing argument for the base game runs as follows:  
  1. Suppose, for contradiction, Black has a winning strategy.  
  2. White makes an arbitrary first move and then "steals" Black’s strategy: for each of Black’s moves, White imagines a "mirror game" without White’s first move, uses Black’s strategy to choose a response, and plays it. If the strategy requires a move already occupied by White’s first stone, White makes an arbitrary move.  
  3. Since Black’s strategy guarantees victory in the mirror game, and White’s extra stone cannot harm White (due to the winning condition being monotone in one’s own stones), White wins—contradicting the assumption that Black has a winning strategy.  
  4. Thus, Black cannot have a winning strategy.  

  Now, analyze three variants:  

  **a) Base Game Recap (8 points)**  
  Recap the strategy-stealing argument. What does it prove about the base game?  

  **b) Variant 1: Four-neighbor adjacency (6 points)**  
  In this variant, the rules are identical to the base game, but adjacency is now defined **only by shared sides (four directions)**.  
  (i) The argument shows Black has no winning strategy, but does **not** imply White wins. What additional property is needed to conclude White wins?  
  (ii) Draw a completed \(2 \times 2\) grid position where **neither player wins** (label stones: W for White, B for Black).  

  **c) Variant 2: Closed-loop liability (6 points)**  
  Add a rule: **a player loses immediately if their stones form a closed loop** (any cycle of adjacent stones).  
  (i) Which premise of the strategy-stealing argument is violated?  
  (ii) Explain how White’s extra stone could become a **liability** under this rule.  

  **d) Variant 3: Infinite board (5 points)**  
  The grid is **infinite** (no boundaries). White wins by a path extending **infinitely in both vertical directions**, Black by a path extending **infinitely in both horizontal directions**.  
  What assumption about **determinacy** is required to adapt the strategy-stealing argument? State what determinacy means in this context.  

  **e) Philosophical Reflection (5 points)**  
  For the base game, the argument proves a winning strategy exists for White but does not specify it. Does this provide **knowledge** that a winning strategy exists? Is the gap between knowing one exists and knowing what it is a **real epistemic gap** (lacking knowledge) or a **psychological gap** (mere difficulty in comprehension)? Explain briefly.  

  ---

  ### Model Answer  
  *(~750 words; precise, demonstrating understanding of mechanisms)*  

  **a) Base Game Recap (8 points)**  
  The strategy-stealing argument begins by assuming Black has a winning strategy. White makes an arbitrary first move (e.g., at cell **X**), then "impersonates" Black by simulating a mirror game **without White’s first move**. For each Black move in the real game, White uses Black’s strategy to pick a response in the mirror game and copies it to the real board. If the strategy prescribes a move to **X** (already occupied), White makes an arbitrary move elsewhere. Since Black’s strategy guarantees a win in the mirror game, and White’s real board has **all mirror-game stones plus the extra stone at X**, White should win—contradicting Black’s supposed winning strategy. Thus, Black cannot have a winning strategy.  
  The argument proves two things:  
  - **Black has no winning strategy**.  
  - Since the game is **determined** (exactly one player has a winning strategy; no draws possible in the base game), White must have a winning strategy.  
  Key: The extra stone **X** is harmless because White’s win condition is **monotone**: more white stones cannot block a preexisting white path. Thus, a win in the mirror game implies a win in the real game.  

  **b) Variant 1: Four-neighbor adjacency (6 points)**  
  (i) The argument shows Black has no winning strategy, but to conclude **White wins**, we need the game to be **draw-free** (i.e., every terminal position has exactly one winner).  
  (ii) Variant 1 lacks this property. A draw occurs on a \(2 \times 2\) grid with stones arranged as:  
  ```  
  Top row: W B  
  Bottom row: B W  
  ```  
  **Explanation**: With four-direction adjacency, the two white stones (top-left and bottom-right) share no edge, so no vertical white path exists. Similarly, the two black stones (top-right and bottom-left) share no edge, so no horizontal black path exists. Neither wins.  

  **c) Variant 2: Closed-loop liability (6 points)**  
  (i) The violated premise is **monotonicity of the win condition** with respect to one’s own stones. The argument assumes extra stones never hurt, but here they can create a losing loop.  
  (ii) The extra stone **X** could force White into a **losing position**: During impersonation, if Black’s strategy (in the mirror game) prescribes a move to **X**, White’s arbitrary move might connect stones to form a **closed loop** (e.g., completing a cycle with existing stones). Even if **X** itself doesn’t cause a loop, it might alter connectivity so a later White move creates one. In the mirror game, White might have won without this loop; here, the loop causes immediate loss. Thus, the extra stone becomes a liability.  

  **d) Variant 3: Infinite board (5 points)**  
  The required assumption is **determinacy**: that one player has a winning strategy. For infinite games, determinacy is **not guaranteed** by Zermelo’s theorem (which applies only to finite games). Here, determinacy means: "Either White has a strategy to force an infinite vertical path, or Black has a strategy to force an infinite horizontal path." Without this, the strategy-stealing argument (which shows Black has no winning strategy) cannot prove White has one—there might be **no winning strategy for either player**.  

  **e) Philosophical Reflection (5 points)**  
  The argument provides **knowledge** that a winning strategy exists: It is a deductively valid proof establishing existence. The gap between knowing it exists and knowing what it is is a **real epistemic gap**. Non-constructive proofs (like this one) yield existential knowledge ("there exists a strategy") without providing any instance or method to find it. This is not merely psychological (e.g., "hard to understand"), as we lack descriptive access to the strategy—even in principle, for large \(n\), we cannot derive it from the proof. Thus, it reflects a fundamental limitation in what the proof tells us.  

  ---

  ### Marking Scheme  
  *(Total: 25 points; allocate marks as below. Deduct for specific errors.)*  

  **a) Base Game Recap (8 points)**  
  - **Recap (5 points)**:  
    - Assumes Black has winning strategy (1 pt).  
    - Describes impersonation: White’s arbitrary first move, mirror game without it, copying Black’s strategy (2 pts).  
    - Handles occupied cell (arbitrary move) (1 pt).  
    - Explains why extra stone is harmless: monotonicity (1 pt).  
  - **Conclusion (3 points)**:  
    - Black has no winning strategy (1 pt).  
    - White has a winning strategy because the game is determined/draw-free (2 pts).  

  **b) Variant 1 (6 points)**  
  - **i (2 points)**: Identifies "draw-free" (or "no draws possible," "exactly one winner always") as the required property.  
  - **ii (4 points)**:  
    - Draws correct \(2 \times 2\) grid: e.g., top: W B; bottom: B W (2 pts).  
    - Explains why neither wins: no white vertical path (stones not adjacent), no black horizontal path (stones not adjacent) (2 pts).  

  **c) Variant 2 (6 points)**  
  - **i (3 points)**: Identifies "monotonicity" (or "extra stone harmless") as violated premise.  
  - **ii (3 points)**: Explains how extra stone could cause a loss: e.g., creates/closes a loop during arbitrary move or via altered connectivity.  

  **d) Variant 3 (5 points)**  
  - Names "determinacy" (2 pts).  
  - Defines it: "one player has a winning strategy" and contrasts with finite games (3 pts).  

  **e) Philosophical Reflection (5 points)**  
  - States argument provides knowledge (1 pt).  
  - Identifies gap as epistemic (not psychological) (2 pts).  
  - Explanation: Non-constructive proof gives existence without instance/method (2 pts).  

  **Common Errors (Deduct Marks):**  
  - **Confusing symmetry with monotonicity** (e.g., in c(i), claiming "board symmetry" is violated): Deduct 2–3 pts.  
  - **Misunderstanding determinacy** (e.g., in d, saying "determinacy is a game rule"): Deduct 3 pts.  
  - **Incomplete handling of occupied cell** (in a, missing "arbitrary move"): Deduct 1 pt.  
  - **Claiming the gap is psychological** (in e, without justification): Deduct 2 pts.  

  ---

  ### Where the Model Answer Is Most Likely to Fail  

  1. **Variant 1 (Four-neighbor adjacency)**:  
     - **Risk**: A student might argue that the base game (four-directional) *already* allows draws, making the variant redundant.  
     - **Why it’s not fatal**: The base game is implicitly **Hex-like** (no draws possible due to topological reasons, e.g., planarity), though not explicitly stated. The question’s phrasing ("Hex-style... monotone") implies the base game has no draws, so Variant 1 *introduces* draw potential. The model answer holds.  
     - **If challenged**: Accept if students note base-game monotonicity requires no draws, but deduct if they deny Variant 1’s purpose.  

  2. **Variant 2 (Closed-loop liability)**:  
     - **Risk**: The model answer assumes the loop rule applies *during* the game. If a student argues the rule only checks at the end, liability might not occur.  
     - **Why it’s not fatal**: The question states "immediately loses," so loops cause mid-game losses. The extra stone can trigger this earlier (e.g., during arbitrary moves). The model answer is correct.  

  3. **Variant 3 (Infinite board)**:  
     - **Risk**: Students might miss that determinacy is independent of the strategy-stealing logic.  
     - **Clarification**: The argument *only* disproves Black having a strategy; determinacy bridges to "White has one." For infinite games, this is nontrivial (e.g., axiom of choice may be needed).  

  4. **Philosophical Part (e)**:  
     - **Risk**: Some may argue the gap is psychological (e.g., "we could compute the strategy").  
     - **Rebuttal**: The proof gives no information *about* the strategy, so ignorance is epistemic. Full marks only for distinguishing non-constructive existence from constructive access.  

  **Overall Verdict**: All variants work as intended. The only ambiguity (base game draw potential) is resolved by context.
