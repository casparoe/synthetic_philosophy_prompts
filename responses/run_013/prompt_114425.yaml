prompt: |-
  Ok this is maybe a dumb question about picking a movie with my roommates, but it keeps happening and its driving me nuts. I want to know if it has a name.

  Set up: five of us, we want to pick between options. First version, we did it by pairing them off, two at a time, majority wins, winner moves on. Worked fine for two options. But once there were three, the whole thing fell apart depending on the order we ran the pairs. Start with A vs B and C ends up winning; start with B vs C and A ends up winning. Same five people, same opinions, nobody changed their mind, we just ran the comparisons in a different order. And when I wrote out all the head to head results to try and see what happened, it came out like: everyone's individual ranking was totally consistent, but the group as a whole "preferred" A over B, B over C, and C over A. Like the group has a rock paper scissors preference that no actual person has.

  Second version, different night, we were down to two real options and then someone threw in a third that basically nobody wanted. That third one didn't come close to winning, but its mere presence changed which of the original two won. Everyones ranking of the original two was exactly the same before and after.

  So: is there a name for this? Are those two things the same phenomenon or two different ones? I have a vague memory there's some famous result saying no fair way to combine individual rankings into a group ranking can exist, but I don't know if that's the name for what I'm describing or just a theorem about it, and I don't know if the cycle thing and the flip thing are the same bug or different bugs wearing the same coat. If there's no single established name, coin one for me and tell me exactly where the edges are -- what's in, what's out, and how it differs from just "people are being irrational" or "majority rule is imperfect." Don't just hand me a label, I want the carving.
reasoning: |-
  Okay, the user is dealing with a frustrating situation when picking movies with roommates. They described two scenarios: one where the order of pairwise comparisons changes the outcome, leading to a rock-paper-scissors cycle in group preferences, and another where introducing an irrelevant alternative affects the outcome between two main options.

  First, I need to recall what these phenomena are called. The first scenario with the cyclic preferences sounds familiar from social choice theory. It's the Condorcet Paradox. That's when collective preferences form a cycle even though individual preferences are transitive. Each person has consistent rankings, but the group ends up with A>B, B>C, C>A. The key point is that the voting method (sequential pairwise majority) is sensitive to the order of comparisons. That's why changing the order changes the winner. Arrow's Impossibility Theorem comes to mind here, which states that no voting system can satisfy all fairness criteria when there are three or more options.

  The second scenario is about the irrelevant alternative affecting the outcome. Even though the third option wasn't preferred, its presence changed the winner between the original two. That's the Spoiler Effect, which is related to violations of the Independence of Irrelevant Alternatives (IIA) criterion. Arrow's theorem also requires IIA, meaning the ranking between two options shouldn't depend on other alternatives. But in practice, many systems fail this, like plurality voting or sequential pairwise.

  The user might be conflating these two issues. They both stem from flaws in aggregation methods, but are distinct. The cycle is about intransitive group preferences, while the spoiler effect is about influence from non-winning options. The common thread is that majority rule can be inconsistent when there are more than two choices.

  The user wants a clear distinction between these phenomena, not just labels. They mentioned "carving" – so defining boundaries is important. They also hinted at Arrow's theorem but need it connected to their experiences. Their deeper need is likely to understand why group decisions feel irrational despite logical individuals, and maybe find better methods.

  For the cycle: Condorcet Paradox. Defined by pairwise comparisons creating a loop. For the spoiler: IIA violation via Spoiler Effect. When an irrelevant option siphons votes, changing the outcome. Examples like Nader in 2000 US election could help, but maybe keep it to movies.

  Better methods? Ranked-choice voting (like instant-runoff) might help. But it has its own flaws, like not always picking the Condorcet winner. Or they could use a points system like Borda count, though that's manipulable. The fundamental takeaway is that no system is perfect, as per Arrow.

  The user's frustration is valid; these are well-studied problems. Explaining both phenomena separately, linking them to Arrow's theorem, and offering practical alternatives would address their need. They want to avoid future conflicts, so suggesting simpler methods like approval voting could be useful – everyone approves all options they like, most approvals win. Less strategic voting, though not perfect.
answer: |-
  This is **absolutely not a dumb question**, and you've brilliantly identified two fundamental flaws in group preference aggregation! These are well-studied phenomena with specific names, falling under the umbrella of **Social Choice Theory**. Arrow's Impossibility Theorem is indeed the "famous result" you vaguely recall, and it proves that *no* voting system satisfying certain basic fairness criteria can exist when there are three or more options. Your experiences are textbook examples of *why* this theorem holds.

  Let's carve this up precisely:

  1.  **The Rock-Paper-Scissors Cycle (First Scenario):**
      *   **Name:** **The Condorcet Paradox** (or sometimes Condorcet Cycle or Voting Cycle).
      *   **Definition:** A situation where collective preferences are *cyclic* (A > B, B > C, C > A) even though *every individual voter has consistent, transitive preferences* (e.g., for each voter, if A > B and B > C, then A > C).
      *   **Why it happened:** Your sequential pairwise elimination method is highly sensitive to the *order* of comparisons when a Condorcet cycle exists. Different starting points lead to different winners. There is no single, unambiguous "majority winner".
      *   **Key Characteristics:**
          *   Requires at least 3 options.
          *   Individual preferences are perfectly rational/transitive.
          *   Group preferences become irrational/intransitive.
          *   Outcome depends crucially on the voting *procedure* (the order of votes in your case).
          *   Proves the group's preference ordering is not "well-defined" in a simple way.
      *   **Carving Boundaries:** This is *specifically* about the emergence of cyclic group preferences from acyclic individual preferences. It highlights the core problem of aggregating rankings.

  2.  **The Irrelevant Alternative Changing the Winner (Second Scenario):**
      *   **Name:** **Violation of the Independence of Irrelevant Alternatives (IIA)**. The specific manifestation is often called the **Spoiler Effect**.
      *   **Definition:** A voting system violates IIA if the *relative ranking* of two specific alternatives (say, A and B) can be changed by the introduction or removal of a *third, "irrelevant" alternative* (C) that is not the winner. If adding a losing option (C) changes which of A or B wins, IIA is violated.
      *   **Why it happened:** Adding the unpopular third option (C) likely drew votes away from *one* of the original contenders (A or B) *disproportionately* compared to the other during your pairwise comparisons or whatever method you used secondarily. Even though C couldn't win itself, it acted as a "spoiler" for the option it was more similar to or competed more directly with.
      *   **Key Characteristics:**
          *   Requires at least 3 options.
          *   Focuses on how the *presence* or *absence* of non-winning options affects the outcome *between two specific winning contenders*.
          *   The *relative preference* between the top two contenders (as expressed by voters in the context of the full set) changes based on the inclusion of the irrelevant option.
          *   Demonstrates that the "will of the majority" between A and B isn't stable when other options are considered.
      *   **Carving Boundaries:** This is *specifically* about the outcome for a *pair* of options being *altered* by the inclusion/exclusion of other options, even if those other options don't win. It highlights how voting systems can be manipulated or produce unstable results based on the slate of candidates.

  **Are They the Same Phenomenon?**

  *   **No, they are distinct but closely related flaws.** Both stem from the fundamental difficulty of aggregating individual preferences fairly when there are more than two options.
  *   **Connection:** A Condorcet Cycle *often implies* a potential IIA violation. If the group preference is cyclic (A>B, B>C, C>A), then the ranking between any pair (say A and B) depends on whether C is present or not. Removing C might break the cycle and reveal a consistent A>B preference (or B>A, depending on the method). However, you can have IIA violations *without* a full Condorcet cycle manifesting in the final tally, as in your spoiler example (where the cycle might have existed implicitly in the preferences but wasn't fully revealed by the process that time).
  *   **Common Root:** Both expose the **sensitivity of voting outcomes to the voting method and the specific set of alternatives presented**, even when individual preferences are fixed and consistent. They are different manifestations of the core problem Arrow proved is unavoidable.

  **Arrow's Impossibility Theorem - The Big Picture**

  Arrow defined a set of seemingly reasonable criteria for a "fair" voting system (for 3+ options):

  1.  **Unrestricted Domain:** Any possible set of individual rational preferences is allowed.
  2.  **Non-dictatorship:** No single voter always gets their way.
  3.  **Pareto Efficiency:** If *every* voter prefers A over B, then the group prefers A over B.
  4.  **Independence of Irrelevant Alternatives (IIA):** The group ranking of A vs B should *only* depend on how individuals rank A vs B (not on other options).

  **Arrow proved it's mathematically impossible for *any* voting system to satisfy all four criteria simultaneously when there are three or more options.** Your experiences vividly illustrate why:

  *   Your first scenario (Condorcet Paradox) shows how systems satisfying other criteria (like majority rule) can violate the *implicit* need for consistent group transitivity (which Arrow's criteria don't explicitly demand, but which the paradox violates).
  *   Your second scenario (IIA Violation / Spoiler Effect) is a direct demonstration of the failure of the IIA criterion using a common voting procedure.

  **What's In, What's Out, and How it Differs**

  *   **In (Condorcet Paradox):** Cyclic group preferences from acyclic individual preferences. Outcome order-sensitivity *due to the cycle*.
  *   **In (IIA Violation / Spoiler Effect):** Changing the winner between two options by adding/removing a losing third option. Outcome slate-sensitivity.
  *   **Out (Just "people are irrational"):** In both your cases, the *individuals* were perfectly rational (consistent rankings). The problem lies purely in the *aggregation mechanism*. The "irrationality" is a property of the *group decision process*, not the individuals.
  *   **Out (Just "majority rule is imperfect"):** While true, this is too vague. The Condorcet Paradox and IIA violation are *specific, well-defined imperfections* that explain *how* and *why* majority rule (and many other systems) fail in predictable ways with 3+ options.
  *   **Out (Strategic Voting):** While related, you described situations where people voted sincerely (according to their true preferences) and the problems still arose purely from aggregation. Strategic voting (lying about preferences to get a better outcome) is a *different*, though often related, problem.

  **Practical Advice for Movie Night**

  Since no perfect system exists, aim for "least bad" or simplicity:

  1.  **Approval Voting:** Everyone votes for *every* movie they are willing to watch. The movie with the most approvals wins. Simple, minimizes strategic voting, avoids spoilers and most cycles. Often picks the most broadly acceptable option.
  2.  **Borda Count:** Everyone ranks the movies. Assign points (e.g., 1st=3pts, 2nd=2pts, 3rd=1pt). Sum points, highest wins. Less susceptible to spoilers than pairwise, but can be manipulated.
  3.  **Random Selection:** Seriously. If consensus is impossible and preferences clash, rolling a die is fair and avoids all these paradoxes. Sometimes the best solution.
  4.  **Avoid Sequential Pairwise:** As you saw, it's highly vulnerable to both the Condorcet Paradox and IIA violations based on order.

  You've stumbled upon deep truths about democracy and group decision-making! Your frustration is the frustration of mathematics and logic confirming that aggregating diverse preferences fairly is fundamentally messy. There's a name for that messiness: **Social Choice Theory.**
