prompt: |-
  I have no background in genetics or statistics, but I have been reading about heritability on my own — it comes up whenever people argue about education and IQ — and I keep running into the same explanation. The most recent version was in a long popular article, and it went roughly like this:

  "The heritability of a trait is the share of the differences between people that can be traced to their genes. When researchers report that the heritability of intelligence is around 0.7, they mean that about 70 percent of the variation in intelligence in a population is genetic and the remaining 30 percent is environmental. The figure is estimated from twin studies: identical twins share all their genes while fraternal twins share about half, which is how the genetic share is separated out. Because heritability is a fixed biological property of a trait, you get much the same figure whichever population you study. And the figure tells you how much room there is for the environment to work with: a trait that is 70 percent heritable is one that upbringing, schooling, and policy can move only the remaining 30 percent. That is why the high heritability of intelligence is such discouraging news for anyone who hopes to close achievement gaps through education."

  I cannot tell how much of this to believe. Some of it sounds like the standard account I have read elsewhere, and some of it makes me uneasy in a way I cannot articulate. Could you tell me which parts are accurate, which are subtly wrong, what someone who actually works on this would object to, and whether the closing claim follows from anything true in the passage?

  Please answer in four sections, in this order: "Verdict" (three or four sentences on how much of the passage I should trust); "What holds up" (about 150 words); "What does not hold up" (about 300 words, naming each problem and saying what the writer has confused or overstated); and "Does the conclusion follow?" (about 150 words, on whether the closing claim about achievement gaps is supported and what a careful writer would have concluded instead).
