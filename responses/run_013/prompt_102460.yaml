  Need to ensure the marine setting is vivid—sonar visuals, the claustrophobic ship, the deep-sea environment. Technical details like ADCPs and CTD rosettes add authenticity. The swarm's behavior ("The Shiver") should feel both mechanistic and strangely purposeful.

