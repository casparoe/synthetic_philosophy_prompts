answer: |-
  ### 1. Essay Question (25 marks, 90 minutes)  
  **Critically assess whether individuals bear moral responsibility for their contributions to collective harms in cases where those contributions seem to make no difference to the outcome. Your answer must:**  
  (a) Precisely state the inefficacy objection, distinguishing its causal claim (that an individual act lacks a specific effect) from its moral claim (that this absence of effect negates responsibility).  
  (b) Apply the objection to three examples: voting in large elections, purchasing factory-farmed meat, and individual carbon emissions. Explain why the objection’s strength varies across these cases.  
  (c) Confront the lake pollution case: In arrangement A, 1,000 farms each discharge 0.5 units of phosphorus into a lake, causing fish death when total runoff exceeds 100 units (total: 500 units). No single farm’s discharge is necessary for the harm. In arrangement B, 201 farms each discharge 0.5 units (total: 100.5 units), making each farm’s discharge necessary for exceeding the threshold. The outcome and acts are identical in both arrangements. Does this case show that being pivotal (necessary for the harm) is irrelevant to moral responsibility? Justify your view.  
  (d) Propose and defend a principle linking individual acts to collective harms that withstands the lake case, or argue that no such principle is needed.  

  ---

  ### 2. Model Answer (~800 words)  
  **Introduction**  
  The inefficacy objection denies individual responsibility for collective harms by asserting that one’s act "makes no difference." However, this phrase is ambiguous. It may mean: (i) the outcome would be unchanged had you acted otherwise (counterfactual difference); (ii) your act does not alter the outcome’s probability (probabilistic difference); or (iii) your act does not increase the actual harm (harm-quantity difference). I argue that none of these interpretations universally defeat responsibility, and the lake case reveals that pivotality is morally irrelevant. A sound principle must focus on *participation in a harmful practice*, not causal efficacy.  

  **The Objection’s Structure and Varied Force**  
  The inefficacy objection has two components. Causally, it claims individual acts lack a specific effect (e.g., your vote never changes an election). Morally, it infers that you cannot be responsible for harm without such effect. This inference is flawed.  

  In the three examples, the objection’s force depends on which "difference" is invoked:  
  - **Voting**: In large elections, your vote usually lacks counterfactual difference (i) and probabilistic difference (ii), as outcomes hinge on millions. However, harm-quantity difference (iii) is inapplicable—electoral harm is threshold-based, not incremental.  
  - **Emissions**: Your annual emissions lack counterfactual (i) and probabilistic (ii) difference (climate thresholds like ice-sheet collapse are insensitive to marginal changes). Yet they exhibit harm-quantity difference (iii): each emission *does* incrementally warm the planet, however minutely.  
  - **Meat purchases**: Here, counterfactual (i) and probabilistic (ii) differences likely hold (one purchase rarely affects production volumes). Crucially, harm-quantity difference (iii) *fails*: buying factory-farmed meat increases demand, which directly scales harm (e.g., more animals bred).  

  The objection is strongest in voting (satisfies (i)/(ii)), weaker in emissions (satisfies (i)/(ii) but not (iii)), and weakest in meat purchases (fails (iii)). It never conclusively absolves responsibility because moral responsibility need not require causal difference.  

  **The Lake Case and Pivotality’s Irrelevance**  
  In arrangement A, each farm’s discharge satisfies *all three* "no difference" criteria: no farm is pivotal (counterfactual), runoff predictability is unchanged (probabilistic), and surplus pollution adds no harm (harm-quantity). In B, farms are pivotal—withdrawing one prevents harm—but only counterfactual difference (i) is absent; probabilistic (ii) and harm-quantity (iii) differences remain identical to A. The moral key is that farms in A and B perform the *same act* with the *same outcome*, yet only B farms are pivotal. If pivotality grounded responsibility, B-farmers would be blameworthy while A-farmers are not—an arbitrary distinction. This suggests pivotality is morally irrelevant. Responsibility must derive from participating in a scheme that *collectively* causes harm, regardless of individual necessity.  

  ***Tempting but mistaken move***: Claiming arrangement B *does* assign responsibility because each farm could have averted harm. This overlooks that B-farmers had no control over others’ actions. Their "capacity to prevent harm" was purely hypothetical—like a voter in a landslide election imagining they could swing the result if others voted differently. The lake case symmetrically implicates all actors.  

  **A Defensible Principle**  
  We should adopt the **Participatory Harm Principle**: *An individual bears responsibility if they voluntarily engage in a practice that (a) collectively causes harm, (b) is reasonably avoidable, and (c) would cause the same harm if replicated by others in their position.* This survives the lake case. Farms in A and B both engage in runoff knowing it collectively kills fish (fulfilling (a)/(b)). Criterion (c) ensures consistency—if all farms discharged 0.5 units, harm results. Crucially, the principle does not require being pivotal. In voting, emissions, or meat purchasing, individuals participate in practices that, when generalised, cause harm (e.g., mass voting for harmful policies, aggregated emissions). Even if no single act is pivotal, each reinforces a harmful norm or system.  

  **Conclusion**  
  The inefficacy objection fails because moral responsibility arises from complicity in collective harm, not causal efficacy. The lake case proves that pivotality is a red herring. While no individual "makes a difference" in isolation, we are accountable for our role in perpetuating harmful structures.  

  ---

  ### 3. Marking Scheme (25 marks total)  
  Candidates must hit these five moves. Allocate marks as follows:  

  | **Move** | **Marks** | **Common Errors** |  
  |----------|----------|-------------------|  
  | **(a)** Precisely disentangle the causal claim (individual act lacks counterfactual/probabilistic/harm-quantity effect) and moral claim (this negates responsibility) in the inefficacy objection. | 5 | Conflating causal and moral claims; treating "no difference" as monolithic. |  
  | **(b)** Correctly analyze the three examples: voting lacks counterfactual/probabilistic difference but *not* harm-quantity; emissions lack counterfactual/probabilistic but *have* harm-quantity; meat purchases *have* harm-quantity difference. Explain *why* the objection’s force differs (e.g., weaker for meat due to (iii)). | 6 | Claiming all examples identically satisfy "no difference"; ignoring harm-quantity in emissions/meat. |  
  | **(c)** For the lake case: Note that arrangement A satisfies *all three* "no difference" criteria, while B only satisfies (ii)/(iii). Argue that pivotality (absent in A, present in B) is irrelevant because acts/outcomes are identical, making differential responsibility arbitrary. | 6 | Asserting B-farms are responsible because pivotal (ignoring symmetry); failing to note A satisfies all three criteria. |  
  | **(d)** State and defend a principle (e.g., Participatory Harm) that does not require pivotality, *or* argue no principle is needed. The principle must explain why A/B-farms share responsibility. | 5 | Proposing a pivotality-dependent principle; not linking the principle to the lake case. |  
  | **Overall coherence, precision, and avoidance of the "tempting mistake"** (e.g., overemphasizing pivotality in arrangement B). | 3 | Fixating on B’s pivotality; vagueness in defining responsibility. |  

  **Solid B answer (typically 15–18 marks)** will omit **move (b)’s harm-quantity analysis for emissions/meat**, defaulting to uniform treatment of examples. It may also **underdevelop move (c)’s point about arrangement A satisfying all three criteria**.  

  ---  
  **Rationale**: This question compels candidates to *use* the distinction and case, not recite debates. The model answer demonstrates argumentative rigor while avoiding citations. The marking scheme rewards analysis over conclusions—e.g., a candidate could reject the Participatory Harm Principle but earn full marks for (d) if they defend an alternative coherently against the lake case.
