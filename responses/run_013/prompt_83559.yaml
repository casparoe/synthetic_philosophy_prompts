  2. Each player has private information that gives them a reason to think the action might be good or bad, but their information is imperfect.
  3. The group suffers if the action is taken when it is actually bad (which is more likely as the number of players increases), and also misses out if the action is not taken when it is good.
  4. We want to show that even when everyone is trying to do the right thing, the curse can happen, and that fixes (like requiring consensus) have costs too.

