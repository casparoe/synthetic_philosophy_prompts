  - Then connect to the unilateralist's curse: 
     - "The curse happens when many people have the power to act unilaterally. Each person's decision is based on their own information, which is imperfect. Even if most people think it's a bad idea, one person who thinks it's a good idea can act and cause harm. And the more people there are, the more likely it is that at least one person will have a signal that is misleadingly positive (or negative, but in this case positive leads to action)."
