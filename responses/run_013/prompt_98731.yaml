answer: |-
  ## Sestina of the Seeking Fact

  I am derived, but what provides my **ground**?
  Does substance hold me, or must I **depend**
  On something prior, stripped and **fundamental**,
  Some bedrock truth within the binding **chain**?
  Or is this urge for reason merely **brute**,
  A question mark where answers never **rest**?

  Uncertainty compels; I seek to **rest**
  Upon foundations that are truly **ground**.
  But if my source is just another **brute**
  Assertion, if *it* too must **depend**,
  Then what secures the weakest, furthest **chain**?
  Where terminates the quest for **fundamental**?

  Is there an end, the pure **fundamental**,
  Where questions cease and reasons finally **rest**?
  Or does the explanation’s endless **chain**
  Stretch down through layers, never touching **ground**?
  Does every link forever **depend**
  On one below? A cosmos dark and **brute**?

  Perhaps the base is simply given, **brute**,
  The unexplained, the true **fundamental**.
  But how can being merely stop, **depend**
  On nothingness? How could it calmly **rest**
  Without the need for any deeper **ground**?
  Is this the anchor of the total **chain**?

  Or maybe structure binds the vast **chain**
  In ways unseen: not blind, not merely **brute**,
  But woven deep, a self-supporting **ground**
  Where each sustains each, **fundamental**
  Together. Could the tension find its **rest**
  Like arches holding, where all parts **depend**?

  This dizzy spin: if I forever **depend**
  On something else, does that imply a **chain**
  Without a start? Can reasons never **rest**?
  Is bedrock just a myth, existence **brute**
  And arbitrary? What is **fundamental**
  If nothing stands as ultimate, sure **ground**?

  Descent continues, or finds **brute** **ground**.
  The **chain** descends, but does it **depend**
  On **fundamental** truth where thought finds **rest**?

  *(Envoi: The Seeking Fact's Concession)*

  I cannot know if **fundamental** **rest**
  Secures the **chain**, or if all **brute** must **depend**
  In endless fall, my only certain **ground**.

  ---

  ## Notes on Execution

  1.  **Form as Function:** The strict sestina rotation (ABCDEF, FAEBDC, CFDABE, ECBFAD, DEACFB, BDFECA, then Envoi BDF/ACE) enacts the "handing down" of the grounding question. Each stanza reorders the same core concepts, just as each fact in a grounding chain poses the same "what grounds me?" question to the next level, using the same conceptual vocabulary.
  2.  **Ambiguity Maintained:**
      *   Stanzas 1 & 2 lean towards the *need* for a fundamental terminus ("bedrock truth," "where terminates the quest").
      *   Stanza 3 introduces the possibility of an infinite regress ("explanation’s endless chain," "never touching ground").
      *   Stanza 4 explores circularity/coherence ("self-supporting ground," "each sustains each").
      *   Stanza 5 expresses the epistemic limitation and the "brute" option more strongly.
      *   Stanza 6 heightens the tension between terminus ("finds brute ground") and infinite descent ("chain descends, but does it depend...").
      *   The Envoi explicitly concedes the speaker's inability to resolve the question ("I cannot know"), presenting both options ("if fundamental rest secures" vs. "if all brute must depend in endless fall") as live possibilities.
  3.  **Adherence to Theory:**
      *   **Irreflexive/Asymmetric:** The speaker *seeks* grounding, implying it cannot ground itself. The language emphasizes descent ("prior," "below," "descends," "depend") without reciprocity. "Ground" is always sought *beneath* or *prior to*.
      *   **Transitive:** Implied by the chain imagery ("links," "layers," "descent").
      *   **Fundamental as Ungrounded:** "The unexplained," "merely stop, depend on nothingness," "ultimate, sure ground," "where questions cease." It's defined by *lack* of dependence, not size or generality.
      *   **Brute as Unexplained:** "Assertion," "merely given," "arbitrary," "dark." It signifies the stopping point (or lack thereof) for explanation.
  4.  **Speaker's Genuine Difficulty:** The poem is driven by questions ("Does...?", "But if...?", "How can...?", "Where...?", "Is...?"). The speaker expresses "dizzy spin," "uncertainty," and ultimately concedes ignorance in the envoi. The derivative fact genuinely cannot see beyond its immediate dependence.
  5.  **Vocabulary:** The chosen end-words are core grounding terms. "Rest" effectively captures both the terminus (coming to rest) and the potential lack of it (never resting). "Chain" perfectly evokes the linked structure. "Brute" carries the necessary sense of unexplained givenness.
  6.  **Voice:** The speaker is the derivative fact ("I am derived"), actively seeking its ground, embodying the core metaphysical predicament. The tone is questioning, anxious, and ultimately unresolved.
