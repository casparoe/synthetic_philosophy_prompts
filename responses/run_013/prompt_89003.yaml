  2. **Primacy of epistemic uncertainty vs. objective chance**  
     - *Question*: Should rational choices depend solely on objective chances (50% red in both urns), or on your *knowledge* of the mechanism generating the outcome?  
     - **Prob**: 80% that epistemic uncertainty (your lack of knowledge) can rationally affect preferences.  
     - *Justification*: Objective chances exist independently, but rational agents act on *beliefs given information*. Here, the mystery urn has two hidden states (70/30 or 30/70), creating "second-order uncertainty." Ignoring this conflates risk (known probabilities) with ambiguity (unknown probabilities), a distinction supported by neuroscience and economics.  

  3. **Defensibility of ambiguity aversion as rational**  
     - *Question*: Can preferring known-risk bets over ambiguous ones (even with identical objective chances) be justified beyond "relabeling intuition"?  
     - **Prob**: 70% that ambiguity aversion is rationally defensible.  
     - *Justification*: Ambiguity aversion avoids exploitation in adversarial settings (e.g., if the urn was set by an opponent). It also aligns with "robust control" principles (guarding against worst-case scenarios). Philosophically, it respects agents who value *knowledge symmetry*—knowing the exact probability mechanism feels "safer" than knowing only the outcome probability.  

  4. **Existence of a coherent Dutch book or money pump**  
