answer: |-
  Here is a systematic analysis of the Senate "nuclear option" episode through the lens of the self-amendment problem, addressing your queries in both directions:

  ### I. Case Under the Theory
  **A. What Changed in 2013/2017?**  
  - **Textual Rule:** Unchanged (Rule XXII still formally requires supermajorities).  
  - **Precedent:** Changed – a new binding precedent held that cloture for nominations requires only a simple majority, overriding the written rule through a procedural maneuver.  
  - **Practice:** Changed – the Senate began operating under the new majority-vote precedent for nominations, confirmed when the 2017 GOP majority extended it to SCOTUS nominations despite previously condemning the tactic.

  **B. Majority vs. Minority Claims**  
  - **Majority Claim (2013 Democrats):** Expresses the **Pseudo-Problem** view. They asserted they were *interpreting* (not breaking) existing rules, arguing Rule V ("Senate may determine its rules") is a continuing power that cannot be bound by prior procedural rules. The act was governed by the very rule it modified.  
  - **Minority Claim (2013 Republicans):** Expresses **Prior Authorization**. They argued the maneuver violated Rule XXII's explicit entrenchment, rendering the change unauthorized and void.  

  ---

  ### II. Which Answer Best Fits What Happened?  
  **Official Practice** provides the best fit:  
  - The change was validated by convergent behavior: presiding officers, parliamentarians, and senators subsequently operated under the new precedent.  
  - Durability (2017 extension, bipartisan compliance) confirms acceptance as "law of the Senate."  

  **Assessment of Other Theories:**  
  1. **Prior Authorization:**  
     - *Validity of 2013 Precedent:* Invalid – no existing rule authorized overriding Rule XXII via point of order.  
     - *Consequence:* All subsequent nominations confirmed under simple-majority cloture (including Gorsuch, Kavanaugh) lack procedural legitimacy.  
     - *Problem:* Ignores the Senate's historical reliance on precedents over text.  

  2. **Rupture:**  
     - *Ultimate Rule Change?* Yes – altering cloture rules modifies the Senate's foundational decision-making procedure, a Kelsenian "basic norm."  
     - *Revolutionary Act:* The 2013 maneuver was an extra-legal break, creating a new constitutional order for nominations.  
     - *Issue:* Fails to explain continuity – the same Senate persisted with modified norms, not a new institution.  

  3. **Pseudo-Problem:**  
     - *Why Avoid Amending Rule XXII?* Because the majority lacked 2/3 support. The maneuver exploited the distinction between *rule application* (point of order) and *rule alteration* – masking a substantive change as procedural interpretation.  

  ---

  ### III. Theory Under the Case  
  **A. Implications for Official Practice:**  
  - **Vindication:** Precedent's durability (2017 extension, routine use) confirms that convergent practice *is* the ultimate validator.  
  - **Embarrassment for Prior Authorization:** The minority's objections became legally irrelevant once practice solidified – yet they retained political/discursive force.  

  **B. Disuse for Legislation & Practice Fragmentation:**  
  - **Critical Weakness Exposed:** Official practice theory *cannot explain* why the same maneuver "worked" for nominations but not legislation.  
  - **Missing Element:** It lacks tools to predict *when* convergence holds (nomination precedents) versus fragments (legislation). Cultural constraints (e.g., fear of reciprocal escalation, reverence for filibuster on bills) exist outside the theory.  

  **C. Rupture Theory & Maneuver's Availability:**  
  - **Undermined:** If every potential future use constitutes a "revolution," the theory loses explanatory power. The 2013/2017 episodes were institutional *adaptations* (new precedent under old framework), not ruptures.  
  - **Supported Only If:** The Senate's identity is tied to supermajoritarian cloture – but history (e.g., 1975 reform) shows gradual evolution.  

  ---

  ### IV. Where the Problem is Silent  
  1. **Distinguishing Authorized vs. Accepted Change:**  
     - The problem *cannot* inherently distinguish these; it merely frames the paradox. Real-world validity hinges on secondary criteria (e.g., institutional stability, official compliance).  
     - **Participants' View:** Senators *do* draw this distinction rhetorically (majority: "authorized by continuing power"; minority: "unaccepted breach"), but it collapses in practice once precedents solidify.  

  2. **Normative Guidance:**  
     - The problem *describes* but *cannot prescribe* which answer a system *should* adopt. Each theory implies values:  
       - *Prior Authorization:* Legal certainty, textual fidelity.  
       - *Official Practice:* Adaptability, institutional functionality.  
       - *Rupture:* Acknowledges radical discontinuity.  
       - *Pseudo-Problem:* Dissolves concerns about regress.  
     - **Ought vs. Is:** A system *ought* to prioritize stability and accountability (favoring Prior Authorization), but may *require* flexibility to function (favoring Practice). The Senate’s reliance on precedent reflects a pragmatic choice for flexibility over textualism.  

  ---

  ### Conclusion
  The 2013 nuclear option reveals the self-amendment problem as a live tension in constitutional systems. **Official practice best describes the outcome**, but its inability to explain the legislation/nomination dichotomy shows the need for auxiliary theories of institutional culture. The durability of the precedent validates Hart; the minority’s persistent objections highlight the gap between validity and legitimacy. Ultimately, the problem cannot resolve whether the Senate *should* prioritize textual authorization or functional practice—it only illuminates the stakes of that choice.
