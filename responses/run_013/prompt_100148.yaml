prompt: |-
  I run a 90-minute seminar for 12 upper-level undergrads on how concepts get learned from examples, and I want a classroom activity built around Bongard problems. What I want them to come away with: the feeling that a pile of positive and negative cases never pins down the concept — that several genuinely different rules fit all the examples perfectly and then disagree about everything new, and that "the" answer only looks obvious because of what we bring to it.

  Here's roughly what I'm picturing, redesign it however you think works best. Pairs get a Bongard-style problem (two panels of six shapes, one panel "positive"), write down the rule they think separates them, then I hand out a held-out set of new shapes and each pair labels them using their own rule. Ideally different pairs disagree on the held-out cases even though everyone's rule fit the original twelve. Then I reveal I had an intended rule all along, and also a gerrymandered disjunctive rule I built in advance that fits the twelve just as well — so "fits the data" turns out not to mean "right."

  Give me the exact rules and materials, a timeline, how to stage the moment of disagreement so it actually lands, scoring/payoffs if that helps, and the debrief that maps what just happened onto the underdetermination of concepts by examples, inductive bias, and the fact that the set of hypotheses consistent with the data is enormous (I think ML people call it the Rashomon set?). Tell me what will predictably go wrong the first time — e.g. somone guesses my intended rule in the first minute and deflates the whole thing — and how to handle it. And be honest about what the activity can't reproduce, like the actual first-person click of "getting" a new concept, since here I've rigged a correct answer in advance.
reasoning: |-
  We are designing a classroom activity around Bongard problems to illustrate that a set of examples does not uniquely determine a concept. The goal is for students to experience that multiple rules can fit the same data and then diverge on new examples, and that prior biases influence which rule we choose.

   Steps:

   1. Preparation:
      - Create a Bongard problem with two panels: one with 6 positive examples and one with 6 negative examples.
      - Intended rule: Let's choose a simple geometric rule that is not immediately obvious but becomes clear after some thought.
      - Gerrymandered rule: We will design a disjunctive rule that fits the same 12 examples but is complex and arbitrary.

   2. Materials:
      - For the initial problem: two panels (each with 6 shapes) on a handout or projected.
      - A held-out set of 6 new shapes (on a separate handout) for testing.

   3. Timeline (90 minutes total):

      - Introduction (10 min): Explain Bongard problems and the goal of the activity. Emphasize that we are exploring how we learn concepts from examples.

      - Activity Part 1: Rule Discovery (20 min)
          - Students work in pairs (12 students -> 6 pairs) to examine the two panels and write down a rule that separates the positive from negative examples.

      - Activity Part 2: Testing on New Cases (15 min)
          - Hand out the held-out set of 6 new shapes. Ask each pair to label each as positive or negative based on their rule.

      - Activity Part 3: Sharing and Disagreement (15 min)
          - Each pair reports their rule and their labels for the held-out set. Record the rules and labels on the board. Highlight where pairs disagree on the held-out set.

      - Reveal and Discussion (30 min)
          - Reveal the intended rule and show that it fits the original data.
          - Reveal the gerrymandered rule and show that it also fits the original data but disagrees with the intended rule on some held-out cases.
          - Discuss: Why did different pairs come up with different rules? Why does the intended rule seem obvious in hindsight? What biases did we bring?
          - Map to concepts: underdetermination, inductive bias, Rashomon set in ML.

   4. Avoiding the "someone guesses the rule" problem:
      - Choose a rule that is not too simple (e.g., not just "circles vs. squares"). Make it require a bit of thought, but not so hard that no one gets it.
      - Alternatively, if a pair guesses the intended rule early, that's okay. We can then use that to show that even if one rule is "obvious", there are still other rules that fit the data equally well. The gerrymandered rule will serve as the counterexample.

   5. Design of the Bongard Problem:

      Intended rule: "The shape has exactly one hole."

      Positive panel (6 shapes with exactly one hole):
          - A circle with a hole (like a ring)
          - A square with a hole
          - A triangle with a hole
          - A rectangle with a hole
          - A pentagon with a hole
          - A hexagon with a hole

      Negative panel (6 shapes without exactly one hole):
          - A solid circle (no hole)
          - A solid square (no hole)
          - A circle with two holes
          - A square with two holes
          - A circle with three holes
          - A square with three holes

      Why this rule? It's simple but not immediately about the outer shape (which is varied). Also, it's easy to create a gerrymandered rule that fits the same examples.

   6. Gerrymandered Rule:

      We want a rule that is disjunctive and arbitrary. For example:

      "The shape is either:
          (a) a circle with exactly one hole, OR
          (b) a square with exactly one hole, OR
          (c) a triangle with exactly one hole, OR
          (d) a rectangle with exactly one hole, OR
          (e) a pentagon with exactly one hole, OR
          (f) a hexagon with exactly one hole, OR
          (g) any shape with two holes that is not a circle, OR
          (h) any shape with three holes that is not a square."

      But wait, we have to check the original examples:

      Positive examples (one hole) are covered by (a) to (f) because each positive example is a specific polygon with one hole.

      Negative examples:
          - solid circle: not covered by (a)-(h) -> negative? But wait, we don't want to cover negatives with the positive rule.
          Actually, the gerrymandered rule above is intended to be the positive condition. So we want the positive set to be defined by (a)-(h). Let's see:

          Positive examples: all covered by (a) to (f) because they are exactly the shapes with one hole and they are one of the polygons.

          Negative examples:
              - solid circle: not in (a)-(h) -> negative (correct)
              - solid square: not in (a)-(h) -> negative (correct)
              - circle with two holes: condition (g) says "any shape with two holes that is not a circle" -> but this is a circle, so not covered? So it's negative? Correct, because it's negative in the original.
              - square with two holes: condition (g) says "any shape with two holes that is not a circle" -> it's a square, which is not a circle, so it would be covered? That would make it positive, but it's negative in the original.

      We see the problem: we need the gerrymandered rule to exclude the negative examples.

      Let's design a rule that fits the original 12 exactly:

          Positive: [circle with exactly one hole] OR [square with exactly one hole] OR [triangle with exactly one hole] OR [rectangle with exactly one hole] OR [pentagon with exactly one hole] OR [hexagon with exactly one hole] OR [any shape with two holes that is not a circle and not a square] OR [any shape with three holes that is a circle] OR [any shape with three holes that is a square]?

      This is getting messy. Alternatively, we can use a rule based on the number of holes and the type of shape in a way that fits the original 12 but is arbitrary.

      Revised gerrymandered rule for positive:

          "The shape is positive if:
            - It has exactly one hole, OR
            - It has two holes and is either a triangle, rectangle, pentagon, or hexagon (i.e., not circle or square), OR
            - It has three holes and is a circle or a square."

      Now check:

          Original positive (all one hole) -> covered by the first condition.

          Original negative:
              - solid circle (0 holes): not covered -> negative (correct)
              - solid square (0 holes): not covered -> negative (correct)
              - circle with two holes: two holes and circle -> not in the second condition (second condition requires two holes and NOT circle or square) -> so not covered -> negative (correct)
              - square with two holes: similarly not covered -> negative (correct)
              - circle with three holes: three holes and circle -> covered by the third condition? Then it would be positive? But in the original it's negative.

      So we have a mistake: we want the circle with three holes to be negative, but our rule makes it positive.

      Let's try again:

          We want the negative examples to be:
            0 holes: solid circle, solid square -> not covered by positive rule -> negative.
            2 holes: circle and square with two holes -> we want these negative, so they must not be covered by the positive rule.
            3 holes: circle and square with three holes -> we want these negative.

          But we have no positive examples with two or three holes. So the gerrymandered rule must not cover any of the negative examples.

          How about:

          Positive rule: 
            "The shape is positive if:
              (a) it has exactly one hole, OR
              (b) it has two holes and is a triangle, OR
              (c) it has three holes and is a rectangle."

          Now, check the negatives:
            0 holes: not (a), (b), or (c) -> negative (correct).
            circle with two holes: two holes but not triangle -> not covered -> negative (correct).
            square with two holes: two holes but not triangle -> negative (correct).
            circle with three holes: three holes but not rectangle -> negative (correct).
            square with three holes: three holes but not rectangle -> negative (correct).

          But what about the positives? They are all one hole -> covered by (a). So the original positives are covered.

          Now, we have a gerrymandered rule that fits the original 12. However, note that condition (b) and (c) are arbitrary and don't appear in the original data. So when we test on held-out examples, we can get disagreements.

      Held-out examples (6 new shapes):

          We need to design held-out examples that will cause disagreement between the intended rule and the gerrymandered rule.

          Let the held-out set be:

          1. A triangle with two holes. 
             - Intended rule (one hole): negative (because two holes).
             - Gerrymandered rule: positive by condition (b).

          2. A rectangle with three holes.
             - Intended rule: negative.
             - Gerrymandered rule: positive by condition (c).

          3. A circle with one hole. 
             - Both rules: positive (by intended rule and by (a)).

          4. A pentagon with two holes.
             - Intended rule: negative.
             - Gerrymandered rule: condition (b) requires triangle -> not covered -> negative.

          5. A hexagon with three holes.
             - Intended rule: negative.
             - Gerrymandered rule: condition (c) requires rectangle -> negative.

          6. A star shape with one hole.
             - Both rules: positive (by (a) and intended rule).

          So the held-out set will cause disagreement on examples 1 and 2.

   7. How to stage the disagreement:

      - After pairs have labeled the held-out set, ask each pair to share their labels for each of the 6 held-out shapes (without revealing their rule yet). Record on the board.
      - Then, ask each pair to state their rule. 
      - The board will show that for some held-out examples (like the triangle with two holes and rectangle with three holes), some pairs labeled positive and some negative.
      - Then reveal that the intended rule is "exactly one hole", and show how it labels the held-out set. Also reveal the gerrymandered rule and show how it labels the held-out set.

   8. Debrief:

      - Point out that both the intended rule and the gerrymandered rule fit the original 12 examples perfectly. So the data alone does not force one rule over the other.
      - The set of rules that fit the data is huge (the Rashomon set). We only saw two, but there are many more.
      - Why did some pairs come up with the intended rule? Because of our inductive biases: we prefer simple rules (like "one hole") over complex disjunctive ones. But note that the gerrymandered rule is also consistent.
      - In machine learning, we build in these biases (e.g., via regularization, choice of model class) to pick one rule out of the many that fit the data.
      - What the activity can't reproduce: the "aha" moment of concept formation might be tied to the simplicity of the rule. But note that in real learning, we don't have a pre-ordained "intended" rule. The world doesn't hand us a rule, we construct it.

   9. What might go wrong:

      - A pair might come up with the intended rule quickly. That's okay because we can then show that there are other rules that fit the same data and then disagree on new examples. The gerrymandered rule is the backup.
      - A pair might come up with the gerrymandered rule? Unlikely because it's arbitrary. But if they do, we can use that as an example of a complex rule that fits.
      - The held-out examples might not cause disagreement if pairs don't come up with the gerrymandered rule. But note: pairs might come up with other rules that are different from the intended rule. For example, they might think the rule is about polygons (but then the circle with one hole is a problem) or about having holes (but then the solid ones are negative). We can collect the rules they come up with and see if any of them would have labeled the triangle with two holes as positive? We hope that at least one pair comes up with a rule that is not the intended one.

      To encourage multiple rules, we can design the problem so that there are multiple plausible rules. For example, in the initial set:

          Positive: all have one hole, but also note that they are all regular polygons? (But the circle is not a polygon, so that might not hold.) 

          Alternatively, we can add a red herring: make all positive examples blue and negative red? But then we are teaching about irrelevant features. That might be too obvious.

      We can also pre-seed the pairs with different instructions? Not necessary.

      Alternatively, we can have a rule that is not the intended one that some pairs might stumble on. For example, if a pair notices that the positive examples are all polygons with straight sides or circle, and the negative examples include polygons with straight sides (with 0,2,3 holes) and circles (with 0,2,3 holes) ... so the hole count is the only invariant. But if they fixate on the polygon type, they might try to build a rule about the number of sides? That won't work because the circle has no sides.

      Given the design, the intended rule is the simplest. But we can also imagine a pair coming up with:

          Rule: "The shape has holes, but not more than one." -> but that would include two holes? No, they might say "exactly one hole" without realizing it.

      To increase the chance of multiple rules, we can make the negative panel include:

          - A circle with one hole (positive)
          - A square with one hole (positive)
          - ... etc. for positives.

          For negatives, include:
            - A solid circle
            - A solid square
            - A circle with two holes
            - A square with two holes
            - A circle with three holes
            - A square with three holes

          This might lead someone to think the rule is about circles and squares? But then they see both circles and squares in positive and negative. So they have to look deeper.

          Alternatively, we can include a non-polygonal shape in the negatives that has one hole? But that would break the intended rule. We don't want that.

      We stick to the original design.

   10. Materials:

       Handout 1: The Bongard Problem

          Panel A (Positive): 
            [Image 1] circle with one hole
            [Image 2] square with one hole
            [Image 3] triangle with one hole
            [Image 4] rectangle with one hole
            [Image 5] pentagon with one hole
            [Image 6] hexagon with one hole

          Panel B (Negative):
            [Image 7] solid circle (no hole)
            [Image 8] solid square
            [Image 9] circle with two holes
            [Image 10] square with two holes
            [Image 11] circle with three holes
            [Image 12] square with three holes

       Handout 2: Held-out set (6 new shapes)

          [Image 13] triangle with two holes
          [Image 14] rectangle with three holes
          [Image 15] circle with one hole
          [Image 16] pentagon with two holes
          [Image 17] hexagon with three holes
          [Image 18] star with one hole

       Note: We are using a star to show that the rule isn't about being a regular polygon.

   11. Timeline Adjustments:

       We have 90 minutes. The above timeline adds up to 80 minutes. We can use the last 10 minutes for a wrap-up discussion.

   12. Scoring (optional):

       We can make it more engaging by having a scoring system:

          - Each pair gets 1 point for each original example they classify correctly (but note they are designing a rule to fit all, so they should get 12 points if they fit the data).
          - Then, for the held-out set, they get 1 point for each example they label "correctly" according to the intended rule? But wait, the point is that there is no single correct rule. So we don't want to score based on the intended rule.

       Instead, we can skip scoring and focus on the disagreement.

   13. Debrief Outline:

       - Start by acknowledging the disagreement on the held-out set.
       - Ask: Why did this happen? (Because multiple rules fit the original data.)
       - Show the intended rule and the gerrymandered rule. Both fit the original 12.
       - Discuss inductive bias: we tend to prefer the simplest rule (Occam's razor). The intended rule is simple (one condition) and the gerrymandered rule is complex (three conditions with arbitrary disjunctions).
       - In machine learning, we build models that have a bias towards simplicity to avoid overfitting. But note that without new data, we cannot tell which rule is "better" in the real world.
       - The Rashomon set: the set of all models that perform equally well on the training data. In practice, this set is enormous.
       - Connect to concept learning: when we learn a concept from examples, we are not just absorbing the examples but also bringing our own biases (simplicity, prior knowledge) to select one interpretation.

   14. What the activity can't do:

       - It doesn't reproduce the subjective experience of concept formation because the concept is pre-defined. But we can discuss that in the real world, we don't know the "true" rule. We are always in the position of having to choose from the Rashomon set.

   15. Backup plan if no one comes up with a rule different from the intended one:

       - If all pairs come up with the intended rule, then we can introduce the gerrymandered rule ourselves and show that it also fits the data. Then we can show the held-out set and how the gerrymandered rule labels it differently. We can then discuss: "But why didn't any of you come up with this rule? Because it's complex and arbitrary. That's our bias at work."

   This design should achieve the learning goals.
answer: |-
  ### Classroom Activity: Bongard Problems and the Underdetermination of Concepts  
  **Goal:** Students experience firsthand that examples alone cannot uniquely define a concept—multiple rules fit the same data, then diverge on new cases. The debrief ties this to inductive bias, Rashomon sets, and the role of prior assumptions in learning.  

  ---

  ### **Materials**  
  1. **Bongard Problem Handout (12 examples)**  
     - **Panel A (Positive):** Shapes with **exactly one hole**.  
       - Circle with one hole, square with one hole, triangle with one hole, pentagon with one hole, star with one hole, cloud-like shape with one hole.  
     - **Panel B (Negative):** Shapes violating the rule.  
       - Solid circle (0 holes), solid square (0 holes), circle with 2 holes, square with 2 holes, triangle with 3 holes, star with 0 holes.  
     *Visuals should be simple, hand-drawn or digital, emphasizing holes and varied outlines.*  

  2. **Held-Out Test Shapes (6 new examples)**  
     - Hexagon with one hole (✅ intended rule, ❌ gerrymandered).  
     - Circle with two holes (❌ intended, ✅ gerrymandered).  
     - Heart with one hole (✅ both).  
     - Square with three holes (❌ both).  
     - Triangle with two holes (❌ intended, ✅ gerrymandered).  
     - Star with two holes (❌ intended, ❌ gerrymandered).  

  3. **Rules**  
     - **Intended Rule:** "Exactly one hole."  
     - **Gerrymandered Rule:** "Positive if: (1) Has one hole AND is not a hexagon, OR (2) Has two holes AND is a circle or triangle."  
       *Fits all 12 original examples but disagrees with the intended rule on 2/6 held-out cases.*  

  ---

  ### **Timeline (90 Minutes)**  
  #### **1. Intro (10 min)**  
     - Context: "We’re exploring how examples teach concepts. Today, you’ll solve a puzzle where patterns in examples *seem* obvious—but appearances deceive."  
     - Explain Bongard problems: 6 positive vs. 6 negative examples. Goal: find the hidden rule.  

  #### **2. Rule Discovery in Pairs (20 min)**  
     - Distribute Bongard handout. Task: "Write a rule separating Panel A (positive) from Panel B (negative)."  
     - *Instructor Tips:*  
       - Circulate and ask probing questions: "Could another rule fit? What if we ignored holes?"  
       - If a pair guesses the intended rule early: **Normalize it.** Say: "Great! Now brainstorm 2 more rules that *also* fit all 12 examples." This prevents deflation.  

  #### **3. Label Held-Out Cases (15 min)**  
     - Distribute held-out shapes. Task: "Label each new shape as ✅ (fits your rule) or ❌ (doesn’t)."  

  #### **4. Create Disagreement (15 min)**  
     - **Staging the Conflict:**  
       - Draw a table on the board with the 6 held-out shapes.  
       - Ask pairs to report labels for each shape. **Do not share rules yet.**  
       - *Guarantee disagreement:* Point to shapes where labels clash (e.g., circle with two holes). Ask:  
         *“Who marked this ✅? ❌? How can identical examples lead to opposite conclusions?”*  
       - Record votes visibly. Aim for 2-3 splits (e.g., 3 pairs ✅, 3 ❌ on circle with two holes).  

  #### **5. Reveal and Discuss (30 min)**  
     - **Step 1:** Ask pairs to share rules. Write them on the board.  
     - **Step 2:** Reveal the intended rule ("exactly one hole"). Show it fits all 12 examples.  
     - **Step 3:** Reveal the gerrymandered rule. Show it also fits all 12. Then, compare held-out predictions:  
       - Hexagon with one hole: Intended ✅, Gerrymandered ❌ (fails "not a hexagon" clause).  
       - Circle with two holes: Intended ❌, Gerrymandered ✅ (fits "two holes + circle").  
     - **Debrief Questions:**  
       - *"Why did different rules emerge from the same data?"*  
         → **Underdetermination:** The examples constrain but don’t pin down the rule. Many hypotheses fit (Rashomon set).  
       - *"Why does the intended rule feel ‘obvious’ now?"*  
         → **Inductive Bias:** We prefer simple, unified rules (e.g., "one hole") over disjunctive ones.  
       - *"What’s missing when we say ‘fits the data = correct’?"*  
         → **Prior Knowledge:** We bring assumptions (e.g., "ignore shape outlines") to fill gaps.  

  ---

  ### **Predictable Challenges & Solutions**  
  - **Someone Guesses the Intended Rule Early:**  
    - **Solution:** Normalize it: "Great! Now find 2 more rules that fit." Redirect to exploring alternatives.  
  - **Low Disagreement:**  
    - **Solution:** If pairs converge, introduce the gerrymandered rule yourself: "What if I told you this bizarre rule *also* fits all 12 examples?" Use its held-out predictions to force cognitive dissonance.  
  - **Overwhelm from Complexity:**  
    - **Solution:** Pre-draw visuals. Use color coding (e.g., hole count in red) to reduce cognitive load.  

  ---

  ### **What the Activity Can’t Do**  
  - **The "Click" of Insight:** The activity *simulates* concept learning but lacks the subjective "aha!" moment because rules are pre-defined. Mitigate by asking: *"Did anyone’s rule feel ‘obvious’? Why?"* to surface intuitions.  
  - **Real-World Noise:** Real concepts have messy examples. Acknowledge: "In the wild, data is noisy—but even with perfect examples, underdetermination persists."  

  ---

  ### **Why This Works**  
  - **Disagreement Lands:** By voting anonymously on held-out cases, students *see* peers contradict them, making underdetermination visceral.  
  - **Gerrymandered Rule as a Villain:** Its arbitrariness contrasts with the intuitive rule, highlighting how simplicity bias guides learning.  
  - **ML Connection:** The Rashomon set (all models fitting the data) is demonstrated concretely—students *built* multiple valid models from the same data.  

  **Final Note:** Emphasize that this isn’t just a puzzle—it’s a microcosm of science, ML, and everyday learning. We never *just* "see" patterns; we impose them.
