prompt: |-
  Right, so last month my girlfriend's parents took us out for dinner and I didnt leave a tip — where I'm from you only tip if the service was genuinely exceptional — and her dad said, perfectly straight-faced, 'when in Rome, do as the Romans do', as if that settled the whole thing. I've since heard the same line trotted out about queue-jumping at the bus stop, jaywalking, standing on the left of the escalator, you name it.

  What I want isn't an answer about tipping, it's a menu: what distinct claims can that one sentence actually be making? Lay the readings out from the trivial to the radical — prudential advice about getting along, a bare etiquette rule, a real moral obligation to follow local conventions, something about fairness to the locals who have to live with the convention, something about coordination and reliance, a relativist claim that there's no standard to appeal to, and whatever else is hiding in there — and for each one say whether it's plausible, what it would demand of me in practice (how much local knowledge I'm supposed to have, how long I have to be in the country, whether being a guest or a foreigner changes anything, what happens if I can't comply), and whether it actually gets him to 'you did something wrong' or only to 'you were a bit awkward'. Tell me which reading people usually have in mind when they use it to shut down an argument, and whether the interesting version — conventions bind because of what they do for the people who depend on them — is really carrying the weight or whether he just meant don't embarrass us. If some of the readings turn out to be the same reading in different clothes, say which. British English please, and don't bother with citations, I just want the disambiguation.
reasoning: |-
  Okay, the user is frustrated with their girlfriend's dad constantly using "when in Rome" to shut down discussions about cultural norms like tipping or queueing. They want a breakdown of the different interpretations of that phrase, not just about tipping specifically. 

  Hmm, this feels like someone who's analytically minded and annoyed by glib moralizing. Probably has a philosophy or ethics background, or at least thinks that way. The request is very structured - they want distinct claims categorized from trivial to radical, with practical implications spelled out. 

  Right, so first I need to unpack the possible meanings behind "when in Rome". The dad seems to use it as conversation-ender, but it could range from practical advice to deep moral philosophy. 

  Starting with the simplest reading: pure pragmatism. Basically "don't make trouble for yourself". That's probably not what the dad meant though - too self-interested. Then there's etiquette - just being polite. But again, feels shallow for the situation. 

  Ah, the coordination problem angle is more interesting. Like when everyone stands on the right on escalators - violating that actually causes tangible harm through confusion. That might justify some obligation. 

  Then there's full-blown moral relativism - "their norms are just as valid as yours". But that seems extreme for tipping customs. And the fairness argument - that locals built these systems so you should respect that. 

  Wait, the user specifically asked about the "conventions bind because people depend on them" interpretation. That's probably the most defensible version. Like when tourists ignore queueing norms and ruin the system locals rely on. 

  Need to address practicalities too - how long you've been in the country, whether you're a guest etc. If you just arrived, strict compliance is unreasonable. But if you live there long-term, different story. 

  For the tipping incident? Probably just "don't embarrass us". But the more interesting version is worth exploring - that consistent tipping enables fair wages in that culture. 

  User's clearly annoyed by the dad's rhetorical move. Should acknowledge that "when in Rome" often functions as thought-terminating cliché. The interesting philosophical version rarely gets aired in pub arguments. 

  Final note: most people use it as conversation stopper, not deep moral argument. The substantive version about social coordination does some work, but requires more nuance than dad gave it.
answer: |-
  Right, let's dissect "when in Rome" into its distinct philosophical and practical flavours, moving from the least to the most demanding:

  1.  **Prudential Self-Interest (Getting Along Smoothly):**
      *   **Claim:** Following local conventions avoids social friction, awkwardness, potential arguments, or minor sanctions (dirty looks, slow service, being called out). It's simply the easiest path.
      *   **Plausibility:** Highly plausible. A basic observation of human interaction.
      *   **Demands:** Minimal local knowledge (obvious, visible norms like queueing, escalator sides). Applies instantly upon arrival. Being a guest/foreigner *is* the reason it applies – you're the outsider. Non-compliance risks mild social awkwardness or annoyance.
      *   **Gets to:** "You were awkward/inconvenient/rude," not inherently "you did something *morally* wrong." It's about *your* ease, not a duty to others.
      *   **Shut-down Usage:** Common. Often implies "stop making a fuss/embarrassing yourself/us."

  2.  **Bare Etiquette Rule (Politeness/Respectful Deference):**
      *   **Claim:** It's simply polite and respectful to defer to the hosts' customs, even if you find them odd. A gesture of good manners towards the local culture and people.
      *   **Plausibility:** Very plausible as a basic principle of hospitality and cross-cultural interaction.
      *   **Demands:** Moderate local knowledge (known, common conventions - tipping percentages, basic greetings). Applies from the start, especially as a guest. Non-compliance is seen as impolite or disrespectful.
      *   **Gets to:** "You were rude/disrespectful." Still primarily about social offence, not deep moral failing. Rooted in showing consideration.
      *   **Shut-down Usage:** Very common. The "respect" angle is a frequent appeal.

  3.  **Fairness to Locals / Avoiding Free-Riding:**
      *   **Claim:** Local conventions often serve a purpose for *them* (e.g., tipping subsidises wages, queueing maintains order). By benefiting from the system (eating out, using transport) while flouting its norms, you free-ride – you get the benefits without sharing the costs/conformity burden locals bear. You exploit the system they maintain.
      *   **Plausibility:** Highly plausible, especially for conventions underpinning social coordination or economic structures like tipping.
      *   **Demands:** Requires understanding the *purpose* or *function* of the convention (e.g., knowing tipping is part of pay). Applies when you knowingly participate in the system. Being a guest doesn't exempt you from fairness. Non-compliance is unfair exploitation.
      *   **Gets to:** "You acted unfairly / exploited the local system / shirked your share." This *can* reach "you did something wrong" (morally, via unfairness).
      *   **Shut-down Usage:** Less common in casual use, but the strongest *practical* moral argument. This is likely the "interesting version" you mentioned – it *can* carry significant weight for conventions with clear functional roles.

  4.  **Coordination & Reliance:**
      *   **Claim:** Many conventions solve coordination problems (e.g., which side to stand on, how queues form). Locals rely on predictable adherence. Your violation disrupts this, causing confusion, inefficiency, or even minor hazards (e.g., bumping on escalators, queue chaos). Adherence is necessary for the smooth functioning of shared social spaces/activities.
      *   **Plausibility:** Very plausible for conventions governing physical coordination or orderly processes.
      *   **Demands:** Knowledge of the *rule* itself (what the convention *is*), not necessarily its deeper purpose. Applies whenever you engage in the coordinated activity. Being a guest/foreigner makes your non-compliance *more* disruptive due to potential ignorance being assumed. Non-compliance causes tangible, if minor, harm through disruption.
      *   **Gets to:** "You caused unnecessary disruption/harm/inconvenience." This edges towards "wrong" due to the negative consequences for others.
      *   **Shut-down Usage:** Common for physical coordination norms (queues, escalators, traffic). Often bundled with the Fairness argument.

  5.  **Moral Conventionalism / Relativism (The Radical Bit):**
      *   **Claim:** Morality *is* constituted by local conventions. There is no higher "true" morality to appeal to; right and wrong *just are* what the local group agrees they are. Therefore, violating the convention *is* morally wrong *simpliciter* within that context.
      *   **Plausibility:** Highly contentious and philosophically problematic. Collapses easily into "might makes right" or justifies harmful practices if locally accepted. Rarely held consistently.
      *   **Demands:** Requires knowing the convention, but denies any external standard to judge it by. Applies categorically once you're "in Rome". Being a guest/foreigner is irrelevant – you are subject to the local moral law. Non-compliance is *inherently* morally wrong.
      *   **Gets to:** "You did something morally wrong," full stop. This is the strongest possible claim.
      *   **Shut-down Usage:** Sometimes implied in the tone ("this *is* the rule, end of story"), but rarely the genuinely held belief behind the phrase in everyday contexts like tipping or queues. It's too strong and clashes with universal moral intuitions most people hold.

  **Overlaps and Nuances:**

  *   **Fairness and Coordination are closely linked:** Free-riding (Fairness) often *causes* disruption (Coordination). They often support each other for functional conventions.
  *   **Etiquette and Prudence often blur:** Being polite (Etiquette) *is* often the prudent (Prudence) thing to do to avoid friction.
  *   **The "Interesting Version":** The **Fairness/Avoiding Free-Riding** and **Coordination/Reliance** arguments are where the phrase carries real moral weight beyond mere politeness or self-interest. They explain *why* conventions can create obligations – because others depend on them and you benefit from them. This *could* get to "you did something wrong" (unfair, disruptive) in cases like tipping (if part of the wage structure) or queueing (causing disorder).

  **Your Specifics & The Dad:**

  *   **Tipping Incident:** The strongest argument against you is likely **Fairness/Avoiding Free-Riding** (benefiting from a meal within a system where tips subsidise wages without contributing) combined with **Etiquette** (knowing it's standard and refusing is rude). The dad probably meant a blend of Etiquette ("don't be rude") and Prudence ("don't cause a scene/embarrass us"), possibly hinting at Fairness. Pure Moral Relativism is unlikely.
  *   **Shut-down Usage:** People almost *always* mean a mix of **Prudence** (stop rocking the boat), **Etiquette** (it's just polite/rude), and sometimes **Coordination/Fairness** (especially for queues, escalators). It's primarily a social pressure tool invoking "don't be difficult/embarrassing".
  *   **"Interesting Version" Carrying Weight?** For tipping, Fairness *can* carry weight if tipping is genuinely part of the expected compensation structure – your non-payment shifts burden. For jaywalking where it's safe and common? Less so, it's more Prudence/Etiquette. For queues? Coordination/Fairness carry significant weight. The dad likely *invoked* the phrase's gravitas ("this settles it") but his *intent* was probably closer to "don't embarrass us / be polite / just fit in" (Prudence/Etiquette), rather than a deep appeal to Fairness or Coordination, though those arguments exist.
  *   **Guest/Foreigner Status:** This *intensifies* the expectation for Etiquette and Prudence. For Fairness/Coordination, it makes non-compliance *more* noticeable/disruptive, but the core obligation (if it exists) stems from participation, not just being foreign.
  *   **Knowledge/Time:** Obligation strength generally increases with knowledge of the convention and its function, and the length/intensity of your participation. A tourist might get leeway on obscure norms; a long-term resident gets less.

  **In essence:** "When in Rome" is usually deployed as a conversation-stopper invoking politeness and pragmatism. Its most *justifiable* moral force comes from avoiding free-riding on systems locals maintain (Fairness) and not disrupting coordinated activities they rely on (Coordination), not from deep relativism. Whether it gets to "wrong" depends heavily on *which* convention and *which* argument applies. Your tipping likely violated strong Etiquette and plausible Fairness norms, warranting more than just "awkward". The dad probably meant "don't embarrass us," but the better argument against you is "you didn't pay your share in the system you used."
