prompt: |-
  I write about cognitive science and AI for a mid-size outlet, and I've got a recurring problem I'd rather hand you as a reusable tool than a one-off fix. Every week there's a press release or preprint that runs on an analogy — the genome is a program, the cell is a factory, the immune system is an army, a language model is reasoning, a neural net is doing something like imagining — and I have to work out fast whether the analogy is doing honest explanatory work or smuggling in a claim the evidence won't carry. My current method is vibes and it's embarrassing.

  So: take the role of someone who has really internalized the Hofstadter/Sander line that analogy isn't decoration on top of thought but is the mechanism of thought itself (Surfaces and Essences), and who has also spent actual time in a newsroom. Before you write anything, think out loud for a bit — brainstorm what tends to go wrong with analogies in science coverage, and what a usable procedure has to capture that the obvious test (does the analogy break down somewhere?) misses. My hunch is that everything breaks down somewhere, so that test is useless; tell me if I'm wrong.

  Then write the procedure. I want a one-page card I can run in about fifteen minutes before deadline, and a longer version for when I have a couple hours or an editor who'll actually read it. It has to work for a freelancer who can't get the paywalled paper and doesn't have a PhD in the subfield, and it has to say at which points the decision is a values call or a taste call dressed up as a test, and where the whole thing stops with a no. Three home-made tests I've been groping toward and want you to fix, formalize, or throw out: (1) the payload test — state exactly what claim is being transferred from the familiar thing to the new thing; (2) the free-ride test — what does the source domain hand the reader for free that the story never claimed; (3) the counter-analogy swap — name an equally apt analogy pointing the other way and see whether the story's claim survives the swap. If a claim only survives under one analogy, I think that's a red flag, but maybe not, tell me.

  Then run it on three cases: a release describing a newly mapped gene regulatory network as the cell's decision-making board; a model described as planning ahead when it's really just search; and one where I think the analogy is fine and the real problem is elsewhere in the story — I won't like that answer but I need the procedure to be able to give it. Finish by telling me where this procedure will misfire and which of my three tests you kept, changed, or binned and why.
reasoning: |-
  We are going to create a reusable tool for evaluating analogies in scientific press releases and preprints. The goal is to quickly determine if the analogy is doing honest explanatory work or if it is smuggling in claims that the evidence doesn't support.

  First, we'll think aloud about common problems with analogies in science coverage:

  1. **Overextension**: The analogy is pushed too far, implying similarities that don't exist or that the evidence doesn't support. For example, saying the genome is a "program" might imply intentional design or a level of determinism that isn't present.

  2. **Hidden Implications**: Analogies carry with them connotations from the source domain that may not be appropriate for the target. For example, describing the immune system as an "army" implies purpose, strategy, and hostility, which might not accurately reflect the biological processes.

  3. **Oversimplification**: Analogies can make complex systems seem simpler than they are, leading to a loss of important nuance. For instance, comparing a neural net to "imagining" might oversimplify the stochastic processes involved.

  4. **Reification**: Treating an abstract concept as a concrete entity. For example, saying a gene regulatory network is a "decision-making board" might give the false impression of centralized control.

  5. **Distraction**: The analogy might be so vivid that it distracts from the actual evidence or the limitations of the study.

  6. **False Intuition**: The analogy might leverage the reader's familiarity with the source domain to create a false sense of understanding. This is particularly problematic when the target domain is not well understood by the reader.

  The obvious test of whether the analogy breaks down somewhere is necessary but not sufficient because, as you note, all analogies break down at some point. The key is to identify where and how they break down and whether that breakdown is relevant to the claims being made.

  Now, we design a procedure. It must be:

  - Usable in about 15 minutes (short version) and also have a longer version for when there's more time.
  - Work for a freelancer without access to paywalled papers or deep expertise.
  - Clearly indicate where decisions are values or taste calls.

  We'll incorporate and refine your three tests:

  1. **Payload Test**: State the claim being transferred. This helps clarify what the analogy is intended to do.
  2. **Free-Ride Test**: Identify what the source domain gives for free that isn't supported by evidence. This addresses hidden implications.
  3. **Counter-Analogy Swap**: Propose an equally plausible analogy that points in a different direction and see if the claim still holds. If the claim only survives under the original analogy, that's a red flag.

  We'll add:

  4. **Breakdown Point Check**: Explicitly note where the analogy breaks down and ask if that breakdown affects the claims being made.

  5. **Evidence Check**: What evidence is provided for the aspects of the analogy that are critical to the claim? (This might be harder without the paper, but we can use the press release and any available figures.)

  6. **Purpose Check**: Is the analogy being used to explain a difficult concept (good) or to make a grand claim (risky)?

  The procedure will have two versions:

  **Short Version (15 min):**

  1. **Identify the Analogy**: Write down the source and target domains.
  2. **Payload Test**: What claim is being made via the analogy? (Be explicit.)
  3. **Free-Ride Test**: List at least two things the source domain implies that the target domain may not have evidence for.
  4. **Counter-Analogy Swap**: Quickly propose a different analogy (e.g., if the analogy is "cell is a factory", try “cell is a bustling city” or “cell is an ecosystem”). Does the original claim still make sense? If not, why?
  5. **Breakdown Check**: Where does the analogy break down? Is that breakdown relevant to the claim?
  6. **Verdict**: If the free-ride items are significant and unsupported, or if the claim doesn't survive the counter-analogy, or if the breakdown is critical, flag as problematic. Otherwise, it might be okay.

  **Long Version (2 hours):**

  1. **Identify the Analogy**: Source and target domains.
  2. **Payload Test**: What specific claim is being transferred?
  3. **Free-Ride Test**: 
     - List connotations of the source domain (e.g., factory: efficiency, division of labor, centralized control).
     - For each, ask: is there evidence for this in the target? If not, mark as a free rider.
  4. **Counter-Analogy Swap**:
     - Propose 2-3 alternative analogies that fit the target domain.
     - Restate the claim using each alternative. Does the claim still hold? If not, the original analogy might be doing too much work.
  5. **Breakdown Check**:
     - What are the known points of breakdown for this type of analogy? (e.g., a factory has a blueprint and a boss; a cell does not.)
     - Is the breakdown point relevant to the claim? (e.g., if the claim is about efficiency, and the breakdown is about lack of a central planner, that might be relevant.)
  6. **Evidence Check**:
     - What evidence is presented in the press release for the aspects of the analogy that are crucial to the claim? 
     - If possible, look at figures or methods summaries (if available without paywall) to see if they support the analogy.
  7. **Purpose Check**: 
     - Why is this analogy being used? Is it to simplify a complex idea, or to imply a broader conclusion (e.g., that the system is designed, intelligent, etc.)?
  8. **Values/Taste Call**: 
     - Note where the assessment is subjective (e.g., whether a free-rider implication is problematic might depend on the audience's background knowledge).
     - Also, note if the analogy is being used to evoke an emotional response (e.g., militaristic analogies for immune systems might evoke fear or admiration) and whether that's appropriate.
  9. **Verdict**: 
     - If the analogy is carrying unsupported claims (via free riders) or if the claim collapses under a counter-analogy, reject it as misleading. 
     - If the breakdown is in an area irrelevant to the claim and the analogy helps explain, it might be acceptable.

  Now, let's run the short version on the three cases:

  **Case 1: Gene regulatory network as the cell's "decision-making board"**

  - **Payload**: The claim is that the network makes decisions (like a board) to regulate cell activities.
  - **Free-Ride**: 
    - A board implies centralized control, conscious deliberation, and perhaps hierarchy. 
    - But gene regulation is decentralized, emergent, and not conscious. These are free riders.
  - **Counter-Analogy Swap**: What if we call it a "crowd-sourced vote" or a "chemical conversation"? The claim of "decision-making" might not hold in the same way because a crowd-sourced vote is more chaotic and less directed. The original claim of top-down control would not survive.
  - **Breakdown**: The breakdown is that there's no central authority in the gene network. This is relevant because the payload claim is about decision-making by a board (which is centralized).
  - **Verdict**: The analogy is problematic because it smuggles in central control and deliberation that aren't supported.

  **Case 2: Model described as "planning ahead" when it's just search**

  - **Payload**: The claim is that the model is engaging in a future-oriented, strategic process (like human planning).
  - **Free-Ride**:
    - Planning implies intention, foresight, and goal-directed behavior. 
    - But if it's just search (e.g., tree search), then it's an automatic process without understanding. Free riders: intention, foresight.
  - **Counter-Analogy Swap**: What if we call it "navigating a maze" or "trying all doors until one opens"? The claim of "planning" would not survive because these are trial-and-error processes without foresight.
  - **Breakdown**: The breakdown is that search algorithms don't "plan" in the human sense; they follow predefined steps. This is relevant because the payload is about planning.
  - **Verdict**: The analogy is misleading because it implies cognitive abilities that aren't present.

  **Case 3: An analogy that is fine, but the problem is elsewhere**

  Let's take an example: "A neural network learns like a child learns language." 

  - **Payload**: The claim is that the learning process is similar (through exposure and pattern recognition).
  - **Free-Ride**: 
    - Child learning implies curiosity, intrinsic motivation, and social interaction. 
    - But a neural net might just be trained on data without these. However, if the press release is only claiming statistical learning, then the free riders might not be invoked.
  - **Counter-Analogy Swap**: Try "a neural network learns like a statistician compiling data". The original claim about statistical learning still holds. So the analogy isn't doing heavy lifting beyond illustrating the mechanism.
  - **Breakdown**: The analogy breaks down because children use embodied experiences and social cues, which the neural net doesn't. But if the claim is only about statistical pattern learning, then this breakdown might be irrelevant.
  - **Verdict**: The analogy might be acceptable if the story is clear that it's only about statistical learning. The problem might be elsewhere (e.g., overclaiming about the network's understanding) but the analogy itself is not the main issue.

  **Where the procedure misfires**:

  - If the counter-analogy isn't equally apt, the test might be unfair. We have to be careful to choose plausible alternatives.
  - The free-ride test can be subjective: what one person sees as an implication, another might not. This is a taste call.
  - Without access to the paper, the evidence check might be weak.

  **Your tests**:

  - We kept the **Payload Test** and made it step one because it's essential to clarify the claim.
  - The **Free-Ride Test** is central and we expanded it to systematically list connotations and check against evidence.
  - The **Counter-Analogy Swap** is kept and we emphasized that the alternative must be equally apt. We also made it a step to test the robustness of the claim.

  We changed them by integrating them into a structured procedure and adding steps for breakdown and evidence.

  **Final Output**:

  We'll now write the two versions of the procedure as a one-page card (short) and a longer guide.

  **SHORT VERSION: Analogy Check Card (15 min)**

  1. **Identify**: What is the source (familiar thing) and target (new thing) of the analogy?
  2. **Payload**: What specific claim is the analogy making about the target? (e.g., "The gene network is a decision-making board" → claim: centralized control and deliberation in gene regulation.)
  3. **Free-Ride**: List 2-3 implications from the source domain. For each, ask: is there evidence for this in the target? (e.g., "board" implies hierarchy, minutes of meetings, voting → no evidence for these in cells.)
  4. **Swap**: Propose a different analogy (e.g., for a cell, try "ecosystem" or "market"). Restate the claim with the new analogy. Does it still hold? (e.g., "The gene network is an ecosystem" → claim of centralized control doesn't hold.) 
  5. **Breakdown**: Where does the analogy break? Is this breakdown relevant to the claim? (e.g., a board breaks down because no one is in charge; relevant if the claim is about central control.)
  6. **Verdict**: 
     - If free-ride items are unsupported and central to the claim → red flag.
     - If the claim fails under a counter-analogy → red flag.
     - If breakdown is relevant → red flag.
     - Otherwise, the analogy might be okay.

  **LONG VERSION: In-Depth Analogy Evaluation (2 hours)**

  1. **Identify**: Source and target domains.
  2. **Payload**: Explicitly state the claim transferred by the analogy.
  3. **Free-Ride Test**:
     - Brainstorm connotations of the source domain (use word associations: e.g., "army" → hierarchy, enemies, strategy, weapons).
     - For each connotation, ask: does the target domain exhibit this? Check the press release for evidence. If no evidence, it's a free rider.
     - Rate the free riders: are they central to the claim? (e.g., if "strategy" is implied but not evidenced, and the claim is about strategic behavior, that's critical.)
  4. **Counter-Analogy Swap**:
     - Generate 2-3 alternative analogies that are equally plausible (e.g., for immune system as army, try "garden" (emphasizing maintenance and balance) or "police force" (emphasizing internal order)).
     - Restate the payload claim with each alternative. Does it hold? 
     - Example: Claim: "The immune system attacks invaders." With "police force": still holds. With "garden": might not hold because gardens don't "attack". But if the claim is about defense, "garden" might not work. If the claim only works with "army", that's a red flag.
  5. **Breakdown Check**:
     - Research or recall known breakdown points for this analogy type (e.g., cells aren't factories because they self-replicate and lack blueprints).
     - Is the breakdown relevant to the claim? (e.g., if claiming the cell has an assembly line, the lack of a blueprint might be relevant.)
  6. **Evidence Check**:
     - What evidence does the press release provide for the key aspects of the analogy? 
     - If figures or methods are available, do they support the analogy? (e.g., does the model architecture actually have a planning module or is it just search?)
  7. **Purpose Check**:
     - Why use this analogy? To explain a mechanism (okay) or to imply a grand claim (e.g., that the system is intelligent, designed, etc.)? Watch for hype.
  8. **Values/Taste**:
     - Note any subjective judgments: e.g., the emotional weight of the analogy (militaristic analogies might be seen as problematic in some contexts).
     - Also, consider the audience: will they overinterpret the analogy?
  9. **Verdict**:
     - **Green**: Analogy is appropriate if free riders are minimal and not central, the claim survives a counter-analogy, breakdown is irrelevant, and evidence supports the key aspects.
     - **Yellow**: Proceed with caution if there are free riders but they are acknowledged, or if the breakdown is noted. Add caveats.
     - **Red**: Reject the analogy if it carries unsupported claims, the claim collapses under counter-analogy, or the breakdown is critical and unaddressed.

  **Misfires and Limitations**:
  - This procedure might be too harsh on analogies that are intended as loose metaphors. Use judgment.
  - Without the paper, the evidence check is limited to the press release, which might be biased.
  - The counter-analogy step requires creativity and might be subjective.

  But it will help you move beyond vibes to a structured critique.
answer: |-
  ### Reusable Analogy Evaluation Tool for Science Writers  
  Based on Hofstadter/Sander's principle that analogy is the core mechanism of thought—not decoration—this tool identifies when analogies in science coverage clarify vs. mislead. Analogies always "break down" somewhere, so we focus on **whether the breakdown undermines the claim** or smuggles in unsupported implications. Designed for freelancers without journal access or PhDs.  

  ---

  ### **Quick Card: 15-Minute Deadline Version**  
  *(Run this when you’re under time pressure.)*  

  1. **Identify the Payload (1 min)**  
     - *Question:* "What *explicit claim* is the analogy transferring from the familiar thing (source) to the new thing (target)?"  
     - *Example:* "The gene network is a decision-making board" → Payload: "Genes 'make decisions' like humans, with deliberation and intent."  
     - *Red Flag:* If you can’t state the payload clearly, the analogy is vague or decorative.  

  2. **Free-Ride Test (3 min)**  
     - *Question:* "What does the source domain imply that the story *doesn’t* support with evidence?" List 1–2 connotations.  
     - *Example:* "Decision-making board" implies centralized control, intentionality, and hierarchy. If the paper shows emergent/stochastic gene interactions, those implications are "free riders."  
     - *Red Flag:* Free riders are core to the story’s narrative (e.g., "decision-making" is the headline).  

  3. **Counter-Analogy Swap (3 min)**  
     - *Question:* "What’s an *equally valid* analogy that flips the narrative? Does the payload claim survive?"  
     - *Example:* Swap "decision-making board" → "tug-of-war game." Claim becomes: "Genes compete dynamically." If the original claim (e.g., "intentional control") collapses, the analogy is doing heavy lifting.  
     - *Red Flag:* The claim only works under the original analogy.  

  4. **Breakdown Relevance Check (2 min)**  
     - *Question:* "Where does the analogy break down? Is this breakdown *relevant* to the payload?"  
     - *Example:* "Board" breaks down because genes lack agency. If the payload is about "intentional decisions," this breakdown is fatal.  
     - *Green Flag:* Breakdown is irrelevant (e.g., "board" implies physical furniture; genes don’t have chairs → harmless).  

  5. **Verdict (1 min + gut check)**  
     - **🚩 Reject Analogy** if:  
       - Free riders are central to the claim, OR  
       - Payload collapses under counter-analogy, OR  
       - Breakdown directly contradicts evidence.  
     - **✅ Proceed with Caveats** if:  
       - Free riders are minor/noted in the piece, OR  
       - Analogy only simplifies mechanics (not claims).  
     - *Values Call:* If the analogy evokes emotion (e.g., "army" → militarism) but isn’t core to the science, flag it as "taste" for your editor.  

  ---

  ### **Longer Guide: 1–2 Hours or Editor Review**  
  *(Use this for deeper analysis or contentious cases.)*  

  #### Step 1: Map the Analogy (10 min)  
  - **Source (Familiar):** e.g., "Factory," "Army," "Reasoning."  
  - **Target (New Science):** e.g., "Cell," "Immune System," "Language Model."  
  - **Payload Claim:** Phrase it as: "The target [does/works like] [specific aspect of source]."  
    - *Example:* "The language model 'plans ahead' like a human, using foresight and strategy."  
    - *Taste Call:* Does the payload feel "loaded"? (e.g., "decision-making" implies cognition → anthropomorphism).  

  #### Step 2: Free-Ride Test (20 min)  
  - **Brainstorm Connotations:** List 3–5 implications of the source domain (e.g., "Factory" → efficiency, division of labor, top-down control).  
  - **Check Evidence:** Using the press release/preprint, note:  
    - Which connotations are explicitly supported? (e.g., "division of labor" is noted in methods).  
    - Which are "free riders" with no support? (e.g., "top-down control" is assumed).  
  - **Severity Scale:**  
    - *Mild:* Free riders are poetic but irrelevant (e.g., "factory" implying smokestacks).  
    - *Severe:* Free riders drive the narrative (e.g., "army" implying purposeful strategy in evolution).  
  - *Values Call:* Free riders that evoke ideology (e.g., "free market" analogies) require transparency.  

  #### Step 3: Counter-Analogy Swap (30 min)  
  - **Generate Alternatives:** Pick 1–2 equally plausible analogies *from a different domain*. Use:  
    - *Opposing Frameworks:* e.g., If the source is mechanical ("factory"), try organic ("ecosystem").  
    - *Similar Fidelity:* Ensure it fits the evidence as well as the original.  
  - **Test the Payload:**  
    - *Example:* Original: "Neural net imagines like a human." Payload: "It generates novel ideas creatively."  
    - Swap: "Neural net generates outputs like a kaleidoscope." Payload: "It recombines patterns randomly."  
    - *Analysis:* Does the original claim (e.g., "creative intent") still hold? If not, the analogy is smuggling claims.  
  - *Red Flag:* If no counter-analogy fits, the original might be overfitting the data.  

  #### Step 4: Breakdown Relevance (20 min)  
  - **Identify Breakdown Points:** All analogies break; focus on:  
    - *Mechanical Breakdown:* How the source/target *work* differently (e.g., "Search algorithm ≠ planning" because planning requires goals).  
    - *Causal Breakdown:* Where cause-effect diverges (e.g., "Genome is a program" breaks because programs don’t self-replicate; genomes do).  
  - **Relevance to Payload:**  
    - *Critical:* Breakdown contradicts the core claim (e.g., "planning" payload fails if the model just brute-force searches).  
    - *Benign:* Breakdown is superficial (e.g., "cell factory" lacks physical walls → irrelevant to metabolic efficiency claims).  

  #### Step 5: Purpose & Evidence Audit (20 min)  
  - **Why This Analogy?**  
    - *Honest Use:* Simplifies a complex mechanism (e.g., "immune system as security system" to explain defense layers).  
    - *Smuggling Use:* Implies unproven qualities (e.g., "reasoning" for pattern-matching).  
  - **Evidence Check:** Scan preprint figures/methods (if available) or press release for:  
    - Direct support for the payload (e.g., experiments testing "decision-making").  
    - Limitations that undermine the analogy (e.g., "search algorithm tested only in narrow tasks").  
  - *Taste Call:* If the analogy excites but distracts, note it—readers might over-infer.  

  #### Step 6: Verdict & Write-Up  
  - **🚩 Reject:** Free riders are core + unsupported, payload fails counter-swap, or breakdown is critical.  
  - **⚠️ Reframe:** Use the analogy but add caveats (e.g., "called a ‘board’ for simplicity, but no consciousness involved").  
  - **✅ Accept:** Analogy is illustrative, breakdowns are irrelevant, and counter-analogies don’t kill the claim.  
  - *Values Call:* Always disclose when an analogy carries ideological/emotional baggage (e.g., "war on cancer" frames patients as combatants).  

  ---

  ### **Test Cases: Applying the Tool**  
  *(Using press release/preprint summaries only.)*  

  #### Case 1: Gene Network as "Cell’s Decision-Making Board"  
  - **Payload:** "Genes deliberate and choose outcomes like a corporate board."  
  - **Free-Ride Test:**  
    - Connotations: Intentionality, hierarchy, centralized control.  
    - Free Riders: No evidence genes "decide"—it’s stochastic chemistry. Central control unsupported (network is decentralized).  
  - **Counter-Analogy Swap:** Try "gene network as voting population." Payload becomes: "Genes influence outcomes via aggregate activity." Original "deliberation" claim collapses.  
  - **Breakdown:** Genes lack agency/meeting rooms → breakdown is relevant (contradicts payload).  
  - **Verdict:** 🚩 Reject. Analogy smuggles in cognition.  

  #### Case 2: Model "Planning Ahead" (But It’s Just Search)  
  - **Payload:** "Model anticipates future states like a human planner."  
  - **Free-Ride Test:**  
    - Connotations: Foresight, goal-setting, strategy.  
    - Free Riders: No evidence of goal-setting; it’s brute-force search (e.g., tree search algorithms).  
  - **Counter-Analogy Swap:** Try "model as probe scanning terrain." Payload becomes: "It checks paths without foresight." Original "anticipation" claim fails.  
  - **Breakdown:** Search ≠ planning (planning requires internal simulation; search is reactive). Critical to payload.  
  - **Verdict:** 🚩 Reject. Analogy overclaims cognitive abilities.  

  #### Case 3: "Language Model as a Bilingual Translator" (Analogy Fine, Problem Elsewhere)  
  - **Payload:** "Processes two languages like a human translator."  
  - **Free-Ride Test:**  
    - Connotations: Understanding meaning, cultural nuance.  
    - Free Riders: None, if the piece focuses on input/output mechanics (not comprehension).  
  - **Counter-Analogy Swap:** Try "LM as a dictionary lookup tool." Payload becomes: "It matches tokens between languages." Core claim (translation function) survives.  
  - **Breakdown:** LMs lack human-like understanding → but if the story doesn’t claim comprehension, this is irrelevant.  
  - **Verdict:** ✅ Accept analogy. *Real problem:* Story calls this "true multilingual reasoning" without evidence. → **Issue isn’t the analogy—it’s overclaiming in framing.**  

  ---

  ### **Where This Procedure Misfires & Your Tests Revised**  
  - **Misfires:**  
    - When counter-analogies are poorly chosen (e.g., implausible or less fitting). Mitigation: Use your expertise to pick realistic alternatives.  
    - In emerging fields (e.g., AI cognition), evidence may be sparse—prioritize "breakdown relevance" over free riders.  
    - Cultural bias: Analogies like "army" may resonate differently in conflict zones. Flag as "values" in verdict.  

  - **Your Tests, Improved:**  
    1. **Payload Test (Kept & Expanded):** Now includes "payload phrasing" to force specificity.  
    2. **Free-Ride Test (Kept & Systematized):** Added "connotation brainstorm" and severity scale to avoid over-flagging.  
    3. **Counter-Analogy Swap (Kept, with Fidelity Check):** Must be *equally apt*—no longer a red flag if swap weakens but doesn’t kill the claim (e.g., "factory" → "ecosystem" for cells still allows "efficiency" payload).  

  - **Why This Works:**  
    Focuses on *functional honesty*—not whether an analogy breaks, but whether its breakdown or free riders mislead on the claims. Tightly coupled to accessible evidence, with clear "values/taste" flags.  

  **Final Tip:** Keep Hofstadter’s lens—analogies are cognitive tools, not lies. Your job is to ensure they’re not Trojan horses. Use this when the vibes feel off, and you’ll nail it by deadline.
