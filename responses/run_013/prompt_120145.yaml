  1. Left: six triangles. Right: six quadrilaterals. Her answer: number of sides.
  2. Left: every figure has one shape entirely inside another. Right: the shapes sit side by side, nothing enclosed. Her: containment.
  3. Left: in each figure the number of dots equals the number of corners. Right: the two counts never match. Her: the arithmetic relation between the two counts.
  4. Left: figures built only from triangles and squares. Right: built only from circles and pentagons. Her: triangle-or-square vs. circle-or-pentagon, and she didn't complain at all about the rule having two parts to it.
  5. Left: each figure is mirror-symmetric. Right: none are. Her: symmetry.
  6. Left: all convex, except one figure where a line overshoots a corner by about a millimetre. Right: all dented. Her: convex — and that overshoot is just a slip of the pen, it doesn't count.

