  ### Activity Design: "The Unity Challenge"  
  This activity uses tactile, game-based exploration to immerse students in the problem of unity (Bradley's regress) without naming it. Teams race to build a "live" structure under strict rules that force an infinite regress. The debrief maps their struggles to philosophical solutions.  

  ---

  ### **Materials List (Cheap & Printable)**  
  - **Tokens** (print on cardstock, pre-cut; 1 set per team):  
    - **Act 1 (Predication)**:  
      - *Objects* (4): "Socrates", "Plato", "the ball", "the table".  
      - *Properties* (3): "__ is wise", "__ is red", "__ is round".  
      - *Linking tokens* (3): "__ instantiates __" (×2), "__ is joined to __" (×1).  
    - **Act 2 (Inference)**:  
      - *Premises* (3): "P", "If P then Q", "R".  
      - *Conclusion* (1): "Q".  
      - *Rule tokens* (2): "Modus Ponens: from __ and __, conclude __" (×1), "Hypothetical Syllogism: from __ and __, conclude __" (×1).  
      - *Linking tokens* (3): "__ justifies step to __", "__ entails __", "__ is a reason for __".  
  - **Other Supplies**:  
    - Trays (1 per team) to hold tokens.  
    - Rule cards (1 per team) summarizing liveness rules.  
    - Timer (visible to all).  
  - **Cost**: Cardstock + printing (~$10 total).  

  ---

  ### **Rules & Scoring**  
  **Goal**: Build a "live structure" to score points. A structure is "live" only if:  
  1. **Connectedness**: All tokens are in one connected arrangement (no isolated tokens).  
  2. **Liveness**: Every token must be *directly linked* to at least one other token by a **linking token**.  
     - A "direct link" requires:  
       - A linking token bridges two specific tokens (e.g., "Socrates" + "__ instantiates __" + "__ is wise").  
       - The linking token **itself** must be linked to the structure by *another* linking token (e.g., if "__ instantiates __" links "Socrates" and "__ is wise", then "__ instantiates __" must be linked to, say, "Socrates" via a new linker like "__ is joined to __").  
  3. **Scoring**: 1 point per "live structure" verified by the referee. **No partial credit**.  

  **Gameplay Constraints**:  
  - Tokens cannot be duplicated or shared between teams.  
  - Teams may arrange tokens freely (stack, place side-by-side, etc.), but links must be explicit (no implied connections).  
  - **Time limit**: 20 minutes per act.  

  ---

  ### **Roles**  
  - **Referee (Instructor)**: Crucial. Circulates, checks structures mercilessly, and shuts down invalid builds with: *"Link the linker!"* No hints.  
  - **Team Roles (Optional)**:  
    - *Architect*: Proposes structures.  
    - *Linker*: Places linking tokens.  
    - *Skeptic*: Challenges the team’s build for liveness.  
    *(Assigning roles keeps all students engaged and prevents checkout.)*  

  ---

  ### **Timeline (90 Minutes Total)**  
  | Time    | Phase                 | Key Actions |  
  |---------|-----------------------|-------------|  
  | 0-5     | **Intro**            | Split into 3–4 teams (4–5 students each). Distribute Act 1 tokens and rule cards. *Don’t* define "liveness"—say: *"Build a unified structure where every piece is connected. Score if it’s ‘live.’"* |  
  | 5-25    | **Act 1: Predication** | Teams build (goal: e.g., "Socrates is wise"). Referee rejects all builds with: *"Show me the link for the linker!"* |  
  | 25-30   | **Act 1 Debrief**    | Teams share frustrations. Ask: *"What kept you from winning? What ‘hacks’ did you try?"* (Note responses for full debrief). |  
  | 30-35   | **Transition**       | Collect Act 1 tokens. Distribute Act 2 tokens. Say: *"New challenge: build a valid inference from premises to conclusion."* |  
  | 35-55   | **Act 2: Inference** | Teams build (e.g., from "P" and "If P then Q" to "Q" using modus ponens). Referee enforces same liveness rule (e.g., if a rule token licenses the step, it must be linked itself). |  
  | 55-60   | **Act 2 Debrief**    | Ask: *"Did this feel familiar? What’s the same as Act 1?"* |  
  | 60-85   | **Full Debrief**     | Map struggles to philosophy (details below). |  
  | 85-90   | **Conclusion**       | Name Bradley’s regress and unresolved issues. |  

  ---

  ### **Debrief (25 Minutes)**  
  **Goal**: Connect game struggles to real philosophical moves without lecturing. Use student quotes from the activity.  

  1. **The Core Problem (5 min)**:  
     - *Ask*: "Why couldn’t you win? What kept growing?"  
     - *Reveal*: "You hit **Bradley’s regress**—a problem about unity: How do parts form a whole? Every linking token needed its *own* link, creating an infinite chain."  
     - *Key point*: "This isn’t just tedious—it’s **vicious** because unity is never achieved. The game rigged it as unwinnable, but philosophers debate if it’s truly vicious."  

  2. **Mapping Student Moves to Philosophy (15 min)**:  
     Use their observed attempts to introduce solutions:  

     | Student Move (Observed in Game)          | Philosophical Position                     | How to Connect |  
     |------------------------------------------|--------------------------------------------|----------------|  
     | *"Property tokens don’t need links—they have gaps!"* | **Frege’s unsaturated concepts** (slots don’t require relations). | *"Ah! You treated ‘__ is wise’ as incomplete, so it ‘glues’ without a linker. Frege said predicates are unsaturated—they aren’t ‘things’ needing glue."* |  
     | *"The whole structure is just one big thing—stop asking!"* | **Monism/internal relations** (Bradley’s own view: wholes are primitive). | *"You declared the arrangement fundamental. Bradley’s solution: relations aren’t real; reality is one unified Absolute. The regress vanishes because parts aren’t independent."* |  
     | *"We made the links—it’s our action, not the tokens!"* | **Predication as mental act** (e.g., medieval thinkers). | *"You shifted focus to *your act* of linking. Some philosophers say unity comes from minds, not the world."* |  
     | *"The layout on the tray holds it together!"* | **Representational unity** (the vehicle, not content, unifies). | *"You appealed to the *physical arrangement*. In philosophy, this is like saying propositions unify via syntax, not metaphysics."* |  

     - *Pivot to Bradley*: "Bradley rejected all these except monism. Why? Because gaps, minds, and syntax don’t solve the *metaphysical* problem: What *in reality* makes Socrates and wisdom one fact?"  

  3. **What the Game Can’t Show (5 min)**:  
     - **Viciousness debate**: The game forces failure, but philosophers (e.g., Armstrong) argue the regress is benign if relations are "internal" (trivial).  
     - **Fregean saturation**: The game can’t model unsaturated tokens (all are object-like). Frege’s solution requires a type distinction the game excludes.  
     - **The Tortoise’s escape**: In Act 2, students might add infinite conditionals (e.g., "If I use modus ponens, then Q"). The game cuts this off, but Carroll’s Tortoise shows *accepting rules without justification* ends the regress.  

  ---

  ### **Predictable Problems & Fixes**  
  - **"The game is rigged!" (Checkout)**:  
    - *Fix*: Assign roles to keep skeptics engaged. In debrief, validate: *"Yes, it’s rigged to mirror a rigged philosophical problem."*  
  - **Token hoarding (Absurd builds)**:  
    - *Fix*: Referee intervenes: *"Link all tokens or start over."* Use their build in debrief to show desperation ("This is the regress in action!").  
  - **Act 2 feels redundant**:  
    - *Fix*: Stress in debrief: *"Same engine: linking tokens = justification rules. Both need ‘meta’ links."*  

  ---

  ### **What to Cut & Why**  
  - **Cut Act 2 if short on time**: Act 1 alone delivers the core regress experience. Use saved time for:  
    - Deeper debrief on viciousness/Frege.  
    - Student reflection: *"Sketch a solution the game rules forbid."*  
  - **Why keep Act 2?**: It reinforces universality of the regress (metaphysics → logic). Only cut if class moves slow.  

  ### **Instructor’s Final Moves**  
  - **Last 10 minutes**: Explicitly:  
    1. Name Bradley and his regress.  
    2. Contrast vicious vs. benign interpretations.  
    3. Note the game’s limits: *"It can’t show Frege’s gaps or Carroll’s rule-acceptance—we’d need new rules."*  
  - **Close**: *"Bradley’s regress isn’t solved—it’s a live wire. Next week, we attack escape hatches."*  

  This design forces students into the regress through failure, making abstract stakes visceral. The debrief turns their frustration into philosophical insight.
