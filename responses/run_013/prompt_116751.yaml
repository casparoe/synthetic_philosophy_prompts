          - "Did any team point to the way the tokens were arranged on the table? For example, putting the object token next to the property token? And then the linking token on top? And then they say: the spatial arrangement is what unifies them? We don't need an extra token because the arrangement does the job?"
          - "This is like saying that the representation (the arrangement of tokens) does the work, but then we are not talking about the world but about our representation. In the world, what does the unifying? This move shifts the problem."

  3. **What the Activity Can't Show (5 min)**:
     - The activity rigged the win condition to be impossible, but in the real debate, some philosophers think the regress is not vicious. For example, they might say that the regress is harmless if we accept an infinite chain of relations? But the activity doesn't allow that because we run out of tokens. So we cannot decide whether the regress is vicious or not.
     - Also, the Fregean option (unsaturatedness) is not represented in the tokens because every token is treated as a complete, saturated entity. In Frege, concepts are unsaturated, so they don't need a relation to combine with an object. We would need to change the rules to allow that.

     - The second act might feel forced? But it did show the same problem in inference: to justify an inference, we need a rule, but then we need a rule to justify the use of that rule? And so on (like Lewis Carroll's Tortoise).

  4. **Tying to Bradley (5 min)**:
