prompt: |-
  I chair the historical advisory board of a state museum. Our charter says an exhibit may be approved only if it explains, rather than merely recounts, the event it treats; the board's standing reading is that this requires at least one general regularity covering the event. The curator's new exhibit on a nineteenth-century famine instead rests its explanatory claim on three counterfactual hinges: moments at which, she argues, a different decision by a named official would have averted the worst of the crisis. A majority of the board wants to reject the exhibit as storytelling; a minority says the hinges do explanatory work precisely by showing what general regularities cannot. Draft the memo I will circulate before Friday's vote, recommending a concrete disposition of the exhibit and of the charter's requirement, including a deadline for any revisions, with a fair statement of the strongest consideration on the losing side.

  Present the memo as exactly five numbered paragraphs, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Okay, the user chairs a historical advisory board for a state museum. They need a memo to circulate before a vote on an exhibit about a 19th-century famine. The exhibit uses counterfactuals instead of general regularities for explanation, which conflicts with the charter requiring explanation over mere recounting. 

  First, I need to understand the core conflict. The charter mandates exhibits must "explain" via at least one general regularity. The curator's famine exhibit relies on three counterfactual decision points instead. The board is split: majority sees this as invalid "storytelling," minority argues counterfactuals expose regularities' limitations. 

  The user wants a decisive memo with five numbered paragraphs: concrete disposition, charter interpretation, strongest losing argument, deadline, and voting instruction. Must be neutral but directive, acknowledging dissenting views fairly. 

  Key challenges:
  Balancing charter compliance with intellectual innovation. The minority's point about counterfactuals revealing regularities is valid but clashes with strict charter language. The museum's educational mission versus adherence to rules. 

  Approach:
  Recommend rejection based on charter non-compliance while honoring the minority's insight. Set a realistic revision deadline. Frame the counterfactual approach as valuable but currently non-compliant. 

  Structuring the memo:
  1. Recommendation: reject without prejudice, allowing resubmission. 
  2. Charter interpretation: reaffirm general regularity requirement. 
  3. Minority view: counterfactuals useful for exposing limits. 
  4. Revision deadline: 90 days for overhaul. 
  5. Voting procedure. 

  The strongest losing argument paragraph must capture the minority's sophistication – how counterfactuals critique deterministic models by highlighting contingency. 

  Deadline should be tight enough for accountability but generous for conceptual rework. 90 days seems reasonable. 

  Potential pitfalls:
  Avoid sounding dismissive of counterfactual methodology. Position this as procedural, not ideological. Ensure the curator feels invited to collaborate on revisions. 

  Final memo tone:
  Authoritative but collegial. Clear that charter binds the board, but alternative approaches may warrant future policy review.
answer: |-
  **MEMORANDUM**

  1.  I recommend rejecting the curator's current famine exhibit proposal as non-compliant with the charter's requirement for explanation, as it relies solely on counterfactual hinges without invoking any established general regularity covering the event.  
  2.  The board's standing interpretation of the charter is affirmed: an exhibit "explains" an event only by demonstrating how it instantiates at least one broader historical, social, or economic pattern or principle, a standard unmet by the present counterfactual structure.  
  3.  The strongest consideration against rejection, articulated by the minority, is that such counterfactuals can perform valuable explanatory work precisely by revealing the *limits* of deterministic general regularities, highlighting critical contingency and agency where broad patterns seem insufficient.  
  4.  The curator is directed to revise the exhibit to integrate at least one applicable general regularity as the core explanatory framework, potentially incorporating the counterfactuals illustratively, and resubmit for approval by August 15th.  
  5.  The board will vote on this recommendation (rejection with resubmission required) at Friday's meeting, based on compliance with the charter as interpreted.
