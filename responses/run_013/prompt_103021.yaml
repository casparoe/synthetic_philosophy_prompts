prompt: |-
  I've been trying to get a grip on superogation by going case by case and seeing where my gut lands, and my gut turns out to be a mess. Wading into a pond and ruining your shoes to pull out a drowning toddler: not optional, you just have to. Giving a stranger a kidney: not required, and I wouldn't think less of someone who didn't. Throwing yourself on a grenade for your squad: also not required -- nobody could be blamed for not doing it -- but I would think less of them, and it's obviously the better act. My colleague covering my courses for a semester while I did chemo: he didn't have to, but it doesn't feel like the kidney. Someone who gives half their salary to anti-malaria charities: I can't bring myself to say it's required, and yet if they spent that money on a third car I'd think something had gone wrong with them. And my aunt sold her house to pay for her nephew's surgery, which wrecked her own kids' college plans -- nobody could have demanded she not do it, but I don't find it admirable at all.

  Is there a principle that gets all of this, or close? Don't just tell me it's the paradox of supererogation -- I want the actual principle, and for each clause, the case it's doing the work on. Then tell me what it says about the one I keep flip-flopping on: a friend who left a tenure-track job for aid work abroad and left his daughter with his ex. And if some of my verdicts have to go, which ones?
reasoning: |-
  Okay, let me tackle this user's query. They're struggling with supererogation and want a principle that explains their varied intuitions. First, I need to unpack their examples. They mention saving a toddler as obligatory, donating a kidney as supererogatory, jumping on a grenade as beyond duty but admirable, and their aunt selling her house as not admirable. 

  Hmm, the key here is distinguishing between required acts and supererogatory ones. The user's confusion comes from cases where actions seem beyond duty but vary in admirability. I recall that standard supererogation theory involves sacrifice and optionality. But their aunt's case complicates things because the sacrifice harms others, making it less admirable. 

  For the colleague covering courses, the sacrifice is minimal and relationship-based, so it's praiseworthy but not heroic. The charity donor's case is tricky because it's optional, but not donating might seem morally off if they buy luxury items instead. That suggests a baseline expectation of reasonable generosity. 

  The friend leaving his job involves high sacrifice but impacts his daughter. Here, the beneficiary matters—sacrificing for others is good, but neglecting dependents is problematic. The moral calculus must weigh relationships. 

  I should propose a principle with clauses: sacrifice, optionality, no harm to others, and beneficiary consideration. Testing each case against these clauses shows why some acts are admirable and others aren't. The aunt's case fails because it harms her kids, while the grenade jump benefits the squad without harming dependents. 

  The user might need to adjust their view on charity—expecting some giving but not half a salary. For the friend, the principle suggests his act is supererogatory but flawed due to neglecting his daughter. The user's intuition that it's not clearly admirable makes sense here. 

  Overall, structuring the principle around sacrifice, optionality, harm, and beneficiaries should clarify their dilemmas, though they might need to refine their charity expectations.
answer: |-
  Here's a principle that captures your intuitions reasonably well, built clause-by-clause from your cases:

  **The Sacrificial Beneficence Principle:** An act is supererogatory (beyond duty) if and only if:
  1.  **It involves significant sacrifice by the agent.** (Addresses *why* it's not required)
  2.  **It provides significant benefit to others.** (Defines the *good* being done)
  3.  **The agent has no special obligation to the beneficiary arising from role, relationship, or prior fault.** (Distinguishes duty from supererogation)
  4.  **It does not involve violating obligations the agent *does* have to others (especially dependents).** (Why some sacrifices aren't admirable)
  5.  **The sacrifice is not demanded to prevent catastrophic harm to the beneficiary when the agent is uniquely positioned to prevent it at minimal risk.** (Why saving the toddler *is* required)

  **Applying the Clauses to Your Cases:**

  1.  **Toddler in Pond (Required):** Violates clause 5. Catastrophic harm prevented, you're uniquely positioned (right there), minimal risk (wet shoes). Not supererogatory; it's a duty.
  2.  **Kidney Donation (Supererogatory & Admirable):**
      *   Clause 1: Significant sacrifice (major surgery, lifelong health impact).
      *   Clause 2: Significant benefit (saving a life).
      *   Clause 3: No special obligation (stranger).
      *   Clause 4: Doesn't violate other obligations (assuming no dependents relying solely on your health).
      *   Clause 5: Not preventing catastrophic harm *uniquely* at *minimal* risk (others could donate, surgery isn't minimal risk).
  3.  **Grenade Jump (Supererogatory & Highly Admirable):**
      *   Clause 1: Ultimate sacrifice (life).
      *   Clause 2: Significant benefit (saving multiple lives).
      *   Clause 3: *Debatable special obligation?* Military cohesion creates a *stronger* duty than to strangers, but arguably still not an absolute *duty* to die. Falls under supererogation.
      *   Clause 4: Doesn't violate other obligations *in context* (military mission/squad survival takes precedence over distant dependents in that moment).
      *   Clause 5: Prevents catastrophic harm, but not minimal risk (death is maximal risk).
  4.  **Colleague Covers Courses (Supererogatory & Praiseworthy):**
      *   Clause 1: Significant sacrifice (extra workload for a semester).
      *   Clause 2: Significant benefit (allows you to focus on chemo/recovery, maintains teaching continuity).
      *   Clause 3: *Weakened by relationship?* Colleagues have a *general* duty of mutual support, but this exceeds it significantly. Falls into supererogation.
      *   Clause 4: Doesn't violate other serious obligations (assuming they manage it).
      *   Why "not like the kidney"? Less sacrifice, stronger existing collegial obligation (Clause 3), but still beyond strict duty.
  5.  **Half Salary to Charity (Supererogatory, but baseline expectation exists):**
      *   Clause 1: Significant sacrifice (foregoing substantial personal wealth).
      *   Clause 2: Significant benefit (saves lives/prevents suffering).
      *   Clause 3: No special obligation (distant beneficiaries).
      *   Clause 4: Doesn't violate obligations (assuming dependents are cared for).
      *   *Why the discomfort with spending on a 3rd car?* This reveals an implicit **Principle of Reasonable Beneficence**: While giving half is supererogatory, giving *nothing* when one has significant excess, while technically fulfilling negative duties (not harming), violates a minimal positive duty of easy rescue/reasonable giving. Buying a 3rd car signals a *failure of minimal beneficence*, making it morally deficient, though not violating a strict *duty* like the toddler case. The supererogatory act highlights this baseline failure.
  6.  **Aunt Sells House (Supererogatory but *Not* Admirable):**
      *   Clause 1: Significant sacrifice (loss of home, financial security).
      *   Clause 2: Significant benefit (nephew's surgery).
      *   Clause 3: Special obligation? Aunt has *some* familial obligation, but likely not to this extent over her own children. Arguably still supererogatory.
      *   **Clause 4 VIOLATED:** The sacrifice *directly violates her obligations to her own children* (providing stability, education). This makes the act *morally problematic*, not admirable. It prioritizes one good (nephew's health) over fulfilling core duties to dependents. It might be *understandable* but isn't praiseworthy.

  **Your Flip-Flop Case: Friend Leaves Tenure-Track for Aid Work, Leaves Daughter with Ex**

  Applying the principle:

  1.  **Significant Sacrifice?** Yes. Career security, prestige, income (Clause 1).
  2.  **Significant Benefit to Others?** Yes. Aid work provides substantial benefit (Clause 2).
  3.  **Special Obligation to Beneficiaries?** No. Distant beneficiaries, no special obligation beyond general beneficence (Clause 3).
  4.  **Violates Obligations to Others?** **CRITICAL POINT:** **Yes.** He has a profound **special obligation (Clause 3)** to his **daughter** arising from the parent-child relationship. Leaving her, even with the other parent, constitutes a significant disruption, likely reduction in presence, stability, and potentially financial support (depending on the situation). This violates Clause 4. The sacrifice comes at the direct cost of fulfilling core duties to a dependent.
  5.  **Preventing Catastrophe Uniquely/Minimal Risk?** Unlikely. While the aid work is important, he is probably not uniquely positioned to do *this specific work*; others could take the role. The risk to beneficiaries is ongoing suffering, not an imminent catastrophe only *he* can prevent that day (Clause 5).

  **Verdict:** Under this principle, the act **fails as supererogatory** because it violates Clause 4 (and arguably strengthens the claim of Clause 3 regarding his daughter). While motivated by beneficence, **neglecting the core obligation to his child makes it morally flawed and not admirable.** It resembles your aunt's case: sacrificing for one good while failing a more immediate duty. You *should* flip-flop! It's genuinely ambiguous, but the principle suggests the duty to the daughter outweighs the supererogatory potential of the aid work.

  **Which Verdicts Might Need Adjustment?**

  1.  **Grenade Jump:** The principle pushes it into supererogation, but your intuition ("think less of them") suggests you feel the military bond creates a *stronger duty* than Clause 3 typically allows. You might need to accept it as the *pinnacle* of supererogation where the sacrifice is so great we don't blame non-compliance, OR strengthen Clause 3 for specific roles like soldiers in combat units ("band of brothers" obligation).
  2.  **Charity Donor / 3rd Car:** The principle explains why giving half is supererogatory and why giving nothing feels wrong, but it relies on an *unstated* "Principle of Reasonable Beneficence." You need to explicitly accept that there's a minimal level of giving/helping that's *expected* (not strictly required like saving the toddler, but a baseline for decency) before supererogation even starts. Buying the 3rd car falls below that baseline.
  3.  **Kidney Donation:** The principle firmly places it as supererogatory and admirable. If you feel strongly that "I wouldn't think less of someone who didn't" is incompatible with it being admirable, you might need to soften your view that supererogatory acts can be *highly* admirable without making their omission *blameworthy*. Admiration and blame aren't strict opposites.

  **In essence:** The Sacrificial Beneficence Principle, incorporating special obligations, avoidance of violating existing duties, and catastrophe prevention, aligns well with most of your intuitions. It clearly resolves the toddler, kidney, and aunt cases. It explains the nuances of the colleague and charity cases. It provides a framework for why your friend's choice is problematic (violating parental duty) despite the good intentions, and highlights the genuine tension in the grenade case. The main adjustment is acknowledging an implicit baseline of "reasonable beneficence" beneath the level of strict duty.
