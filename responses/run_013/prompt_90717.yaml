prompt: |-
  I chair the safety-review board of a mid-sized hospital network — six of us: two clinicians, a clinical engineer, a data scientist, our general counsel, and me — and roughly four times a year an incident reaches us with an automated system somewhere in the causal chain: a sepsis-prediction model that never fired, an infusion pump working from a centrally updated dose library, a scheduling tool that spread a night shift too thin, and last month a radiology triage queue that ranked a tension pneumothorax below a routine follow-up. Our remit is narrow and dated. Within ninety days we must publish a finding naming the party or parties answerable for the harm, together with a proportionate response — retraining, a change to deployment terms, a referral to the professional regulator, a vendor claim, or, if nothing else fits, a no-fault remedy for the patient — and the finding is published in full, with any member free to attach a dissent. What defeats us is that the causal story is usually clear enough and yet nobody seems to have done anything wrong: the clinician followed the tool in a way the validation data made reasonable, the engineer built to a specification that was met, the vendor shipped an update that was announced, and the procurement decision that put the tool on the ward was made three years ago by people who have since left. I have stopped believing the question is who is to blame; I think it is who must answer, and that these two can come apart, and I want a procedure that keeps them apart rather than collapsing one into the other. Our counsel has taken to sorting the cases where a harm fails to land on anyone into four: the opacity case, where we cannot say which component or which human decision produced the output; the fault case, where we can say, and every contribution was reasonable given what that party knew at the time; the authority case, where someone saw the risk coming but had no standing to stop it, as when a ward nurse cannot disable an override the vendor's contract makes mandatory; and the remedy case, where a party can be named but the party who could prevent a recurrence sits outside our jurisdiction. I am not sure those four carve the space cleanly, and I suspect they are not mutually exclusive, so part of what I am asking for is a verdict on the taxonomy itself.

  Please write the procedure the board can actually run in a ninety-minute session, with no one at the table who has read the academic literature and one member who keeps invoking meaningful human control without being able to say what it asks of us on a Tuesday. I want the questions in order, what counts as a sufficient answer to each, the point at which the procedure stops with a finding of no fault, the points at which it hands the decision to a person because the question is one of values rather than facts, and an honest marking of which steps are judgment calls dressed up as procedure. It must treat a finding of no fault and a finding of no answerable party as different outputs and tell us what to do when they come apart, and it must say whether answerability may be assigned on grounds other than fault — role, benefit from the risk imposed, or bare capacity to prevent the next one — without our dressing that up as a finding of wrongdoing. It also has to survive two of us pulling in opposite directions: the clinicians want a rule that always names a human, counsel wants a rule that names no one absent a breach of a written duty, and I need something I can defend to both. Then run it on three cases: the triage queue above, where the tool was performing within its validated range on a population the validation set did not represent and the radiologist deferred to it as she had been trained to; a case in which an override was locked by contract and the harm fell on a patient; and a third of your choosing in which the answerable party turns out to be this board or the procurement process we ourselves designed years ago — because if none of the three comes out in a way we will not like, the procedure is not doing its job. Finish by saying what the procedure cannot do, and where it will misfire. I am not after a survey of the field; I need the artifact.
reasoning: |-
  We are designing a procedure for the safety-review board to determine who must answer for a harm caused with an automated system in the causal chain. The goal is to separate blame (fault) from answerability. The procedure must be executable in 90 minutes by a board without academic background, and must handle cases where no one is at fault but someone must answer.

   Key principles:
   1. We are not assigning blame (fault) but determining who must answer (accountability for addressing the harm and preventing recurrence).
   2. The output must be one of:
      - A named party (or parties) and a proportionate response (retraining, change in deployment, referral, vendor claim, no-fault remedy, etc.)
      - Or a finding of "no answerable party" (which is different from "no fault").

   The procedure must account for the four categories described by counsel, but we note they might overlap and not be exhaustive. We will use them as a starting point but refine.

   Steps of the procedure:

   1. **Case Summary (5 minutes)**
      - Present the incident, the harm, and the causal chain (including the automated system and human decisions).

   2. **Causal Chain Clarity (10 minutes)**
      - Question: Can we trace the harm to a specific output of a system (or systems) and then to specific human decisions (or lack thereof) that led to that output?
      - Sufficient answer: Either we can pinpoint at least one critical decision point (by a human or a system) that directly caused the harm, or we cannot (opacity).
      - If we cannot (opacity), then we note this as an "opacity case" and move to step 5 (Remedy Allocation) but without a named party? Not exactly. Instead, we note that we cannot assign answerability to a specific party and then consider step 5 for system-wide remedies. However, we must still decide if there is an answerable party by other means (e.g., the party responsible for the opaque system). But the procedure must not collapse. We might end with no answerable party.

      However, we are instructed that the causal story is usually clear. So let's assume that in most cases we can trace the chain. If we cannot, then we must consider:

        - If the opacity is due to a failure of design (e.g., no logging) then the party responsible for that design might be answerable.

      But to keep it simple, we will have:

        - If the causal chain is opaque, then we ask: Is there a party responsible for the opacity? (e.g., the vendor for not providing logs, the hospital for not enabling logging). If yes, then that party is answerable for the opacity and we move to step 4 (Authority and Capacity). If not, then we have a "no answerable party" situation? But note: we might still assign answerability to the party that could have prevented the opacity.

      However, let's restructure:

      We will have a step for assigning answerability based on role, benefit, or capacity, even when fault is absent.

   3. **Fault Assessment (15 minutes)**
      - Question: For each party in the causal chain (that we have identified in step 2), did they breach a written duty (or a standard of care) that was in force at the time?
      - Sufficient answer: We look for explicit violations of policy, law, contract, or professional standards. If any party is found to have breached, then we assign fault to that party and they are answerable (but note: we might also assign answerability without fault). However, we are separating blame and answerability.

      Important: We are not stopping here. Even if we find fault, we must still consider if the party can actually answer (has authority and capacity to prevent recurrence). And even if we don't find fault, we might still assign answerability.

      We do this step to identify if there is fault, but it does not preclude assigning answerability without fault.

   4. **Authority and Capacity (15 minutes)**
      - Question: For each party that we have identified in the causal chain (whether at fault or not), did they have the authority and capacity at the time to prevent the harm? And do they have the capacity now to prevent recurrence?
      - This addresses the "authority case" (someone saw the risk but had no standing) and the "remedy case" (the party who can prevent recurrence is outside our jurisdiction).
      - We also consider: Was there a party that had the authority to change the system or the process to avoid the harm? (e.g., the vendor for a software update, the hospital for changing a policy, a clinician for overriding the system if possible).

      We note that:
        - If a party had the authority and capacity to prevent the harm and failed to exercise it (without a valid reason) then they might be at fault. But we already did the fault step. So here we are looking for parties who had the authority but were blocked (like the nurse who couldn't override because of a vendor contract) or parties who have the capacity now.

      We are interested in two things:
        a) At the time of the incident, who could have acted to prevent it?
        b) Now, who can take action to prevent recurrence?

      We are looking for an answerable party who can be tasked with a response to prevent recurrence.

   5. **Answerability Assignment (20 minutes)**
      - Here we step back and consider: Even if we have not identified a party at fault, and even if the causal chain is clear and everyone acted reasonably, we might assign answerability based on:
          a) **Role**: The party has a role-based responsibility (e.g., the vendor is responsible for the performance of their system in the field, the hospital is responsible for ensuring the system is fit for the population).
          b) **Benefit**: The party that benefits from the use of the system (e.g., the hospital gains efficiency, the vendor gains revenue) might be answerable.
          c) **Capacity**: The party that has the capacity to prevent recurrence (even if they were not at fault and even if they are not in the causal chain) might be assigned answerability.

      - We also consider the four categories from counsel:
          - Opacity: We assign answerability to the party responsible for the transparency of the system (if we can identify them) because they have the capacity to fix the opacity.
          - Fault: If we found fault, that party is answerable (but we already have that).
          - Authority: If a party had no authority at the time, we might assign answerability to the party that could have granted that authority (e.g., the hospital for not negotiating override rights in the contract).
          - Remedy: If the party that can prevent recurrence is outside our jurisdiction, we note that and consider if we can still assign answerability to them (and then our response might be to escalate to a higher authority or to change our own jurisdiction?).

      - We must decide: Can we assign answerability to at least one party? And we are allowed to assign without fault.

      - Criteria for assignment without fault: We assign answerability to a party if:
          - They are in a role that typically bears responsibility for the type of risk that materialized (e.g., vendor for system performance, hospital for deployment context), OR
          - They derive primary benefit from the system, OR
          - They have the greatest capacity to prevent recurrence (by design change, policy change, etc.)

      - We also note that we can assign multiple parties. The response might then be shared.

   6. **Determining the Response (15 minutes)**
      - For each party we have assigned answerability, we determine a proportionate response. The response should aim to:
          a) Provide a remedy to the patient (if not already done).
          b) Prevent recurrence.

      - Options include:
          - Retraining: if the party is an individual or group that needs updated training.
          - Change to deployment terms: e.g., renegotiate with vendor, change settings.
          - Referral to professional regulator: if the fault was found and it was a professional failing.
          - Vendor claim: if the vendor is answerable and there are financial consequences.
          - No-fault remedy for the patient: e.g., compensation without blaming.
          - Process change: if the board or hospital process is the answerable party.

      - If we have assigned answerability without fault, we must not frame the response as punitive. It is about forward-looking responsibility.

   7. **Handling Dissent and Finalizing (10 minutes)**
      - Any member may attach a dissent. We record the finding and the responses.

   8. **Outputs:**
      - The finding must state:
          - The harm.
          - The causal chain (as understood).
          - Whether fault was found for any party (and if so, who and what duty was breached).
          - Who is answerable (which may or may not be the same as the party at fault).
          - The response assigned to each answerable party.

      - If we cannot assign answerability to any party, we state "No answerable party identified" and then we must still consider a response? But note: the remit says we must publish a finding and a proportionate response. So even if no party is answerable, we might still recommend a system-wide remedy (e.g., a no-fault remedy for the patient, and a recommendation for a system review). But the response might be assigned to the board itself or to the hospital administration.

   9. **Stopping Rules:**
      - We stop with a finding of "no fault" at step 3, but that doesn't mean we stop the procedure. We continue to assign answerability without fault.
      - We stop with a finding of "no answerable party" only after step 5 if we cannot assign by role, benefit, or capacity.

   10. **Judgment Calls:**
       - Step 2 (Causal Chain Clarity) might involve judgment if the chain is complex.
       - Step 5 (Answerability Assignment) is inherently a judgment call, especially when assigning without fault. We must be transparent about the criteria we use.

   Now, we run the procedure on three cases.

   Case 1: Radiology Triage Queue
     - Incident: Tension pneumothorax ranked below routine follow-up by an AI triage tool.
     - Causal chain: The tool was performing within its validated range but on a population the validation set did not represent. The radiologist deferred to the tool as trained.
     - Step 2: Causal chain clear: tool output and radiologist's deference.
     - Step 3: Fault? 
          - Radiologist: followed training and tool -> no breach of duty? (reasonable at the time)
          - Clinical engineer: built/validated the tool? But note: the tool was validated on a different population. Was there a duty to revalidate on the current population? If the specification did not require it, then no fault. 
          - Vendor: shipped a tool that performed as validated -> no fault.
          - Procurement: three years ago, by people who left. They procured a tool that was validated on a population that might not match. At the time, was it reasonable? Probably yes, so no fault.
     - Step 4: Authority and Capacity?
          - Radiologist: at the time, could have overridden? If the system allowed, and she didn't because she was trained to trust it, then she had authority but didn't exercise it. But we found no fault because it was reasonable. Now, she might be retrained.
          - However, the root cause is the tool's performance on the current population. Who has the capacity to fix that? The vendor (to retrain the model) or the hospital (to revalidate and update the model, or change the deployment).
     - Step 5: Answerability Assignment without fault:
          - Role: The vendor is responsible for the tool's performance? But they met the spec. The hospital is responsible for ensuring the tool is fit for the current population? (role of clinical engineering or data science team). 
          - Benefit: Hospital benefits from efficiency, vendor from sale.
          - Capacity: Vendor can retrain the model. Hospital can revalidate and update the model or adjust the deployment (e.g., by adding human oversight for critical cases).
          - We assign answerability to the hospital (specifically the clinical engineering and data science teams) because they have the ongoing role to monitor and maintain the tool's performance in the current population. Also, they have the capacity to prevent recurrence by instituting periodic revalidation.

          - We might also assign the vendor if the contract includes ongoing support and updates? But if the contract doesn't, then maybe not.

          - However, note: the radiologist might be assigned answerability for not overriding? But we found no fault. We might assign her answerability for the future by requiring retraining? But the capacity to prevent recurrence at a systemic level lies with the hospital and vendor.

          - We decide: the hospital (as the deployer) is the primary answerable party.

     - Step 6: Response: 
          - Retraining for radiologists: emphasize that they should override when clinical judgment indicates, even if the tool disagrees.
          - Change in deployment: The clinical engineering team must revalidate the tool on the current population and adjust the model or the triage thresholds. They must also set up ongoing monitoring.
          - No-fault remedy for the patient? (if the harm was not already addressed).

   Case 2: Locked Override
     - Incident: An override was locked by contract (e.g., a nurse could not override an infusion pump because the vendor's contract made the override mandatory and the nurse had no access). Harm occurred.
     - Step 2: Causal chain clear: the system enforced an override that led to harm, and the nurse could not change it.
     - Step 3: Fault?
          - Nurse: followed the system -> no breach.
          - Vendor: built the system as per contract -> no breach.
          - Hospital (procurement): signed the contract that locked the override. At the time, was it reasonable? Maybe they didn't foresee this harm? -> no fault? 
     - Step 4: Authority and Capacity?
          - At the time: the nurse had no authority to override -> so she could not prevent it.
          - Who had the authority? The vendor? But they were following the contract. The hospital? They signed the contract.
          - Now: The hospital can renegotiate the contract. The vendor can change the system.
     - Step 5: Answerability Assignment without fault:
          - Role: The hospital (procurement) has a role to ensure that contracts do not create unsafe conditions. The vendor has a role to design safe systems.
          - Benefit: Both benefit (hospital: efficiency? vendor: revenue).
          - Capacity: Both can prevent recurrence: hospital by renegotiating, vendor by allowing overrides in future designs or updates.
          - We assign answerability to the hospital (procurement and clinical leadership) because they are the ones who can change the contract and they are responsible for the terms under which the system is used.
     - Step 6: Response:
          - Change to deployment: Renegotiate the contract to allow overrides in critical situations.
          - Also, review other contracts for similar issues.

   Case 3: Answerable party is the board or a past process we designed
     - Let's choose: A scheduling tool that spread a night shift too thin, leading to a delayed response and patient harm. The tool was implemented based on a staffing model designed by the hospital (including this board) three years ago. The model was reasonable at the time, but the hospital's patient volume and acuity have increased, and the model was not updated.
     - Step 2: Causal chain clear: the scheduling tool used an outdated model, leading to understaffing.
     - Step 3: Fault?
          - Scheduler: followed the tool -> no fault.
          - Clinical engineer: maintained the tool as per spec -> no fault.
          - The board (or hospital leadership): they designed the model and did not update it. But if there was no assigned duty to review periodically, then no breach? Or was there an implied duty? Let's say no explicit duty -> no fault.
     - Step 4: Authority and Capacity?
          - At the time, the scheduler could not change the model. The board/hospital leadership had the authority to update the model but did not (because they didn't know?).
          - Now, the board/hospital leadership can update the model.
     - Step 5: Answerability Assignment without fault:
          - Role: The hospital (and the board as part of it) has a role to ensure staffing models are adequate.
          - Benefit: The hospital benefits from efficient staffing.
          - Capacity: The board/hospital leadership can update the model and implement a review process.
          - We assign answerability to the hospital (and by extension, the board) because we are part of the hospital and we were involved in the design and oversight.
     - Step 6: Response:
          - Change the scheduling model and implement a quarterly review of staffing models.
          - Also, consider a no-fault remedy for the patient.

   What the procedure cannot do:
     - It cannot guarantee that the same case would always get the same result (because of judgment calls).
     - It might not satisfy the clinicians' desire to always name a human (if the answerable party is an organization) or counsel's desire to only name when there's a breach (we sometimes assign without breach).
     - It might not prevent future harms if the answerable party does not act on the response.
     - It might not work well in cases of extreme opacity or when the harm is caused by a complex interaction of many systems.

   Where it will misfire:
     - If the board members are not willing to assign answerability without fault, then step 5 might be contentious.
     - If the causal chain is too complex to unravel in 90 minutes, we might default to opacity and then assign answerability to the party responsible for the overall system (which might be too broad).

   Final procedure artifact:

   **Safety-Review Board Procedure for Automated System Incidents**

   Time: 90 minutes

   Steps:

   1. **Case Summary (5 min)**
      - Presenter: Brief description of the incident, harm, and known causal chain.

   2. **Causal Chain Clarity (10 min)**
      - Question: Can we identify at least one critical decision (by human or system) that directly led to the harm?
      - If no (opacity):
          - Is there a party responsible for the system's transparency (e.g., logging, explainability)? If yes, note that party for step 5.
          - If not, note: we have an opacity case and we will consider assigning answerability in step 5 based on role, benefit, or capacity for the overall system.
      - If yes: list the parties involved in the critical decisions (e.g., clinician using the tool, engineer maintaining it, vendor providing updates, procurement).

   3. **Fault Assessment (15 min)**
      - For each party identified in step 2:
          - Did they breach a written duty (policy, contract, professional standard) that was in effect at the time?
          - If yes, record the party and the breach. This party is a candidate for answerability (but we might also assign without fault to others).
      - Note: Finding no fault for a party does not exclude them from being answerable.

   4. **Authority and Capacity (15 min)**
      - For each party in the causal chain (and also consider parties not in the chain but responsible for the system, e.g., hospital leadership):
          - At the time of the incident, did they have the authority and capacity to prevent the harm? (If they could have acted differently to avoid the harm, even if they didn't breach a duty)
          - Now, do they have the capacity to prevent recurrence? (e.g., by changing the system, policy, training)
      - Note parties that had no authority at the time (authority case) and parties that cannot prevent recurrence now (remedy case).

   5. **Answerability Assignment (20 min)**
      - We assign answerability to at least one party if possible, based on:
          a) Fault (if found in step 3) -> they are answerable.
          b) Role: The party has a role that includes responsibility for the type of risk that occurred (e.g., vendor for system performance, hospital for deployment context, clinician for patient outcome).
          c) Benefit: The party that primarily benefits from the system (e.g., hospital for efficiency, vendor for revenue).
          d) Capacity: The party that has the greatest capacity to prevent recurrence (by design, policy, or practice change).
      - We may assign multiple parties.
      - If we cannot assign by any of these, then we conclude "no answerable party".

   6. **Response Determination (15 min)**
      - For each answerable party, choose a proportionate response:
          - Retraining (for individuals or groups)
          - Change to deployment terms (settings, policies, contracts)
          - Referral to professional regulator (only if fault was found and it's a professional matter)
          - Vendor claim (if fault found with vendor or if contract allows for claims without fault? but note: without fault we avoid punitive, so vendor claim might be for redesign without penalty)
          - No-fault remedy for the patient (compensation, apology)
          - Process change (if the answerable party is the hospital or the board)
          - Escalation (if the party with capacity is outside our jurisdiction, we recommend escalation to higher authority)
      - The response should focus on remedy for the patient and prevention of recurrence.

   7. **Finalize and Record (10 min)**
      - Draft the finding, including:
          - Harm description.
          - Causal chain (as established).
          - Fault findings (if any).
          - Answerable party(ies) and the basis (e.g., role, capacity) without conflating with fault if none.
          - Assigned responses.
      - Allow dissents to be noted.

   Outputs:
     - Finding of "no fault" does not preclude answerability.
     - Finding of "no answerable party" is separate and requires a response that is system-wide (e.g., no-fault patient remedy and a recommendation for a broader review).

   This procedure should help balance the clinicians' desire for human accountability and counsel's requirement for a breach by allowing assignment without fault based on role, benefit, or capacity.
answer: |-
  ### Safety-Review Board Procedure for Automated System Incidents  
  **Time:** 90 minutes  
  **Participants:** 6 board members (clinicians, engineer, data scientist, counsel, chair).  
  **Input:** Incident report with causal chain, harm details, and relevant documentation.  
  **Output:** Published finding naming answerable party/ies + proportionate response OR "no answerable party" + "no-fault remedy" if applicable.  

  ---

  ### Procedure Steps  
  #### 1. **Clarify Harm and Causal Chain (10 min)**  
     - **Question:** *"What specific harm occurred, and what system/human decisions were in the causal chain?"*  
     - **Sufficient Answer:**  
       - Harm is unambiguously defined (e.g., "delayed treatment leading to cardiac arrest").  
       - Causal chain includes: (1) Automated system output, (2) Human actions/inactions, (3) Contextual factors (e.g., outdated validation data, contract terms).  
     - **Judgment Call:** Disentangling "proximate cause" from contributing factors.  
     - **Stop If:** Harm is unrelated to automation (exit procedure).  

  #### 2. **Assign Provisional Answerability by Role (15 min)**  
     - **Question:** *"Whose role inherently owns the risk? (e.g., clinician for patient outcome, vendor for tool performance, hospital for deployment context.)"*  
     - **Sufficient Answer:**  
       - Role-based assignment using a pre-agreed hierarchy:  
         ```
         1. Frontline user (e.g., clinician operating tool)  
         2. System maintainer (e.g., engineer, data scientist)  
         3. Organizational owner (e.g., procurement, hospital admin)  
         4. Vendor  
         ```  
       - Assign to the highest-priority role *touched* by the causal chain.  
     - **Values Decision:** Clinicians may push to always assign to a human; counsel may resist. Rule: *"Assign by role first; override only if role had zero control."*  
     - **Output:** Provisional party (e.g., "radiologist" in triage case).  

  #### 3. **Assess Fault vs. Answerability (20 min)**  
     - **Question A:** *"Did the provisional party breach a duty (protocol, contract, law)?"*  
       - **Sufficient Answer:** Evidence of deviation (e.g., "radiologist ignored tool warning" = fault; "followed tool per training" = no fault).  
       - **Stop If:** Fault is found → Name party + assign response (e.g., retraining).  
     - **Question B:** *"If no fault, can this party answer for the harm? (i.e., hold responsibility without blame)."*  
       - **Criteria for Answerability Without Fault:**  
         - **Role:** Party’s position demands accountability (e.g., radiologist owns patient outcomes).  
         - **Benefit:** Party gained from system use (e.g., hospital saved costs via scheduling tool).  
         - **Capacity:** Party can prevent recurrence (e.g., vendor can update software).  
       - **Sufficient Answer:** At least one criterion met.  
     - **Judgment Call:** Weighing "capacity" vs. "role." Counsel may demand written duty; clinicians may demand human answerability. Rule: *"Answerability requires only one criterion; fault requires breach."*  

  #### 4. **Resolve Counsel’s Four Cases (20 min)**  
     - Test provisional assignment against four categories. If overlap, assign to the *least mutable* factor:  
       | **Category**       | **Question**                                          | **Assignment Rule**                                  |  
       |--------------------|-------------------------------------------------------|------------------------------------------------------|  
       | **Opacity**        | *"Could any party have clarified the causal chain?"*  | Assign to data steward (e.g., data scientist for model monitoring). |  
       | **Fault**          | *"Did anyone breach a duty?"*                         | Already resolved in Step 3.                          |  
       | **Authority**      | *"Could anyone override the system?"*                 | Assign to authority-holder (e.g., hospital admin for contract terms). |  
       | **Remedy**         | *"Who can fix this long-term?"*                       | Assign to party with highest capacity (e.g., vendor for software fixes). |  
     - **Output:** Final answerable party/ies.  
     - **Stop If:** No party meets criteria → "No answerable party" (proceed to Step 5).  

  #### 5. **Assign Response (15 min)**  
     - **Question:** *"What proportionate response addresses harm and prevents recurrence?"*  
       | **Answerability Basis** | **Response Options**                                  |  
       |--------------------------|-------------------------------------------------------|  
       | Fault                    | Retraining, referral to regulator, vendor claim.      |  
       | Role/Benefit/Capacity    | Change deployment, no-fault patient remedy, process update. |  
       | No party                 | No-fault patient remedy only.                         |  
     - **Values Decision:** Board votes if consensus fails (simple majority).  

  #### 6. **Document and Dissent (10 min)**  
     - Draft finding: Explicitly separate "fault" (if any) from "answerability" (e.g., "No fault found; answerability assigned to vendor for capacity to update").  
     - Attach dissents.  

  ---

  ### Case Applications  
  #### Case 1: Radiology Triage Queue  
  - **Incident:** AI ranked tension pneumothorax below routine follow-up. Radiologist deferred to tool.  
  - **Procedure:**  
    1. **Harm/Chain:** Delayed diagnosis → harm. Chain: Tool output → radiologist deference.  
    2. **Provisional Party:** Radiologist (frontline role).  
    3. **Fault?** No breach (followed training). **Answerability?** Role (owns outcomes) + Benefit (hospital efficiency gain).  
    4. **Counsel’s Cases:** Fault (no); Opacity (no); Authority (radiologist could override → assignable); Remedy (vendor could recalibrate).  
    5. **Final Answerability:** Radiologist (role) **and** Vendor (capacity).  
    6. **Response:** Radiologist retraining (contextual judgment) + Vendor contract update (mandatory revalidation).  
  - **Output:** "No fault. Answerability: Radiologist (role) and Vendor (capacity). Responses: [as above]."  

  #### Case 2: Locked Override in Infusion Pump  
  - **Incident:** Nurse couldn’t override dose due to vendor contract; harm occurred.  
  - **Procedure:**  
    1. **Harm/Chain:** Incorrect dose → harm. Chain: Contract → locked system → nurse action blocked.  
    2. **Provisional Party:** Nurse (frontline).  
    3. **Fault?** No breach (no override possible). **Answerability?** Role (nurse) but no capacity. Benefit/Capacity: Hospital (signed contract) + Vendor (designed lock).  
    4. **Counsel’s Cases:** Authority (nurse lacked standing → assign to hospital admin).  
    5. **Final Answerability:** Hospital (authority to negotiate contracts).  
    6. **Response:** Change deployment terms (allow overrides) + no-fault patient remedy.  
  - **Output:** "No fault. Answerability: Hospital (authority). Response: Contract renegotiation."  

  #### Case 3: Scheduling Tool Causing Understaffing (Board’s Past Decision)  
  - **Incident:** Tool spread night shift too thin; harm from delayed care. Procured by board 3 years ago.  
  - **Procedure:**  
    1. **Harm/Chain:** Understaffing → delayed care. Chain: Tool → outdated staffing model.  
    2. **Provisional Party:** Hospital admin (organizational owner).  
    3. **Fault?** No breach (model was valid then). **Answerability?** Role (board owns procurement) + Benefit (cost savings) + Capacity (board can revise models).  
    4. **Counsel’s Cases:** Remedy (board can update process).  
    5. **Final Answerability:** Board (role/capacity).  
    6. **Response:** Process change (quarterly staffing-model reviews) + no-fault patient remedy.  
  - **Output:** "No fault. Answerability: Safety-Review Board (role/capacity). Response: Implement review protocol."  

  ---

  ### What the Procedure Cannot Do  
  1. **Prevent Values Conflicts:** Clinicians’ "always name a human" vs. counsel’s "require breach" may still clash. The procedure forces compromise via role/capacity criteria.  
  2. **Handle Total Opacity:** If no party could clarify the causal chain (e.g., proprietary algorithm), "no answerable party" may be unavoidable.  
  3. **Enforce Accountability Externally:** If the answerable party is outside jurisdiction (e.g., overseas vendor), responses may be limited to patient remedies.  
  4. **Eliminate Judgment:** Steps 3 (answerability criteria) and 4 (counsel’s taxonomy) are inherently subjective but structured to avoid arbitrariness.  

  ### Where It Misfires  
  - **Over-Assignment:** May assign answerability to "capacity" parties (e.g., vendors) for minor harms, straining relationships.  
  - **Under-Assignment:** If all parties lack capacity/benefit (e.g., legacy systems with no owner), "no answerable party" may feel inadequate.  
  - **Taxonomy Gaps:** Counsel’s four cases may overlap (e.g., "authority" + "remedy"), but the procedure prioritizes *actionability*.  

  ---  
  **Final Artifact:** This procedure answers *who must answer* (not just *who is to blame*), survives internal tensions, and delivers auditable outputs in 90 minutes. It accepts that systems fail without fault—but someone must still fix them.
