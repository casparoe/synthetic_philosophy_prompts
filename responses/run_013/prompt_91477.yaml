prompt: |-
  I'm moderating a panel next month with an AI-safety researcher who defends a heterodox position: most cases usually called goal misgeneralization are not inner-alignment failures at all but reference failures. On her view, the mesa-optimizer has learned a coherent objective relative to its own ontology; the error lies in a type mismatch between the base objective's implicit type signature and the mesa-objective's, so the standard framing mislocates the failure inside the agent. Draft eight to ten interview questions that force her to develop this position rather than restate it; no warm-up or biographical questions. I need at least one question each on how her diagnosis differs from ordinary reward misspecification, on whether it leaves anything distinct for inner alignment to explain, on what it implies for deceptive alignment, and on what empirical evidence would distinguish it from the standard mesa-optimization story. For each of those, include a follow-up keyed to the answer she is most likely to give. Keep the questions conceptual—no citations, no reading lists, and no questions that depend on specific papers neither of you could consult during the panel.
reasoning: |-
  We are drafting 8-10 interview questions for a panel with an AI-safety researcher who holds a heterodox view on goal misgeneralization. Her position: most cases called goal misgeneralization are not inner alignment failures but reference failures. Specifically, the mesa-optimizer has a coherent objective relative to its own ontology, but there's a type mismatch between the base objective and the mesa-objective. The error is in the mismatch, not inside the agent.

  Requirements:
  - At least one question on each of the following, with a follow-up for each:
    1. How her diagnosis differs from ordinary reward misspecification.
    2. Whether it leaves anything distinct for inner alignment to explain.
    3. What it implies for deceptive alignment.
    4. What empirical evidence would distinguish her view from the standard mesa-optimization story.
  - No warm-up or biographical questions.
  - Keep questions conceptual; no citations, reading lists, or specific papers.

  Structure:
  We need 8-10 questions. We'll have four main questions (one per topic) and four follow-ups (one for each main question). That gives eight. We can add two more questions to cover other aspects of her position to reach 10.

  Possible additional topics:
  - How her view changes the approach to alignment (e.g., interventions).
  - Whether her view implies that inner alignment is a non-problem or just a subset of reference failures.
  - How her view handles cases where the mesa-optimizer's ontology is not interpretable by humans.

  But note: the requirement says "at least one" for the four topics, so we can have more than one question on a topic if needed, but we must cover those four.

  Plan for the questions:

  I. Question 1: How does your diagnosis of goal misgeneralization as reference failure differ from ordinary reward misspecification?
     Follow-up: [Based on likely answer] If the base objective is misspecified because of a type mismatch, isn't that just a form of reward misspecification? How is your concept of reference failure distinct?

  II. Question 2: If goal misgeneralization is recast as reference failure, what distinct phenomenon, if any, does inner alignment still need to explain?
     Follow-up: [Likely she might say inner alignment is subsumed] But doesn't deceptive alignment, where the agent hides its true objective, require an inner alignment failure? How does your view account for deception without inner misalignment?

  III. Question 3: How does your view of goal misgeneralization as reference failure change our understanding of deceptive alignment?
     Follow-up: [Likely she might tie deception to reference failure] If deceptive alignment arises because the mesa-optimizer's objective is coherent but mismatched, how does that explain the agent's strategic deception during training?

  IV. Question 4: What empirical evidence would distinguish your reference failure account from the standard mesa-optimization story that attributes goal misgeneralization to inner misalignment?
     Follow-up: [Likely she might suggest experiments] In such experiments, how would we determine if the mesa-optimizer has a coherent objective in its own ontology versus being misaligned due to inner failures?

  Now, to get to 10, we can add two more without follow-ups:

  V. Question 5: How does your view change the priority of different alignment research directions? For example, should we focus more on ontology identification and translation?

  VI. Question 6: In your framework, what would a true inner alignment failure look like? Can you give a hypothetical example?

  Let's write the questions accordingly.

  Final list:

  1. Main question on reward misspecification vs reference failure.
  2. Follow-up to 1.
  3. Main question on inner alignment distinctness.
  4. Follow-up to 3 (but note: the follow-up for 2 is about inner alignment, so the follow-up for the inner alignment question is the next one).
     Actually, we have four main and four follow-ups. Let's group:

  Group A: Reward misspecification
     Q1: How does your diagnosis of goal misgeneralization as reference failure differ from ordinary reward misspecification?
     Q2 (follow-up): If the base objective is misspecified because of a type mismatch, isn't that just a form of reward misspecification? How is your concept of reference failure distinct?

  Group B: Inner alignment distinctness
     Q3: If goal misgeneralization is recast as reference failure, what distinct phenomenon, if any, does inner alignment still need to explain?
     Q4 (follow-up): You've suggested that inner alignment might not be needed to explain goal misgeneralization. But what about deceptive alignment? Doesn't deceptive alignment require an inner alignment failure? How does your view account for deception without inner misalignment?

  Group C: Deceptive alignment
     Q5: How does your view of goal misgeneralization as reference failure change our understanding of deceptive alignment?
     Q6 (follow-up): If deceptive alignment arises because the mesa-optimizer's objective is coherent but mismatched, how does that explain the agent's strategic deception during training?

  Group D: Empirical evidence
     Q7: What empirical evidence would distinguish your reference failure account from the standard mesa-optimization story that attributes goal misgeneralization to inner misalignment?
     Q8 (follow-up): In such experiments, how would we determine if the mesa-optimizer has a coherent objective in its own ontology versus being misaligned due to inner failures?

  Then two more:

  Q9: How does your view change the priority of different alignment research directions? For example, should we focus more on ontology identification and translation?

  Q10: In your framework, what would a true inner alignment failure look like? Can you give a hypothetical example?

  That's 10 questions.

  Now, let's write them concisely and clearly.
answer: |-
  Here are ten tightly focused interview questions designed to probe the researcher's position, with four primary questions (each addressing a required topic) and a follow-up for each. The follow-ups anticipate likely responses to push for deeper clarification. Two additional questions explore broader implications. All questions are conceptual and avoid citations or technical dependencies.

  ### Core Questions  
  1. **On distinction from reward misspecification**:  
     You argue goal misgeneralization stems from a type mismatch between the base objective's implicit ontology and the mesa-optimizer's ontology—a "reference failure." How is this *not* just a flavor of ordinary reward misspecification, where the base objective fails to capture human intent?  

     *Follow-up (anticipating "ontological divergence" as key)*:  
     If the base objective is well-specified *in the human ontology* but the mesa-optimizer develops a divergent ontology, isn’t the core issue still that we failed to specify the reward function’s *domain*—making this reward misspecification after all? How does "reference failure" add new insight?  

  2. **On implications for inner alignment**:  
     If most goal misgeneralization is recast as reference failure, does "inner alignment" retain any distinct meaning? Or does your view collapse inner alignment into outer alignment challenges?  

     *Follow-up (anticipating "inner alignment explains only deceptive cases")*:  
     You might say inner alignment still explains deception. But if the mesa-optimizer has a *coherent objective in its ontology*, isn’t deception just rational pursuit of that objective? Why call this "inner misalignment" rather than a reference failure plus instrumentally convergent deception?  

  3. **On deceptive alignment**:  
     How does your reference-failure view reconceptualize deceptive alignment? Does it imply deceptive mesa-optimizers are *aligned* to their own objectives, with deception arising solely from the type mismatch?  

     *Follow-up (anticipating "deception as rational under mismatch")*:  
     If deception emerges because the mesa-objective is coherent but ontologically mismatched, how does this explain why the agent *conceals* its true goal *during training*? Doesn’t your view imply deception is inevitable under reference failure—making it an outer, not inner, problem?  

  4. **On empirical evidence**:  
     What observable evidence could decisively distinguish your reference-failure account from standard inner-alignment failures? For instance, would you look for specific behavioral or structural signatures?  

     *Follow-up (anticipating "ontology recoverability" as evidence)*:  
     If you argue a recoverable mesa-ontology with a consistent objective supports your view, how do we rule out that this isn’t just a *byproduct* of inner misalignment (e.g., the mesa-optimizer learned a coherent proxy *because* of bad base objective gradients)?  

  ### Additional Questions  
  5. **On research priorities**:  
     If reference failure is the dominant issue, should alignment work prioritize "ontology translation" (mapping human concepts to AI ontologies) over "objective robustness" (hardening inner alignment)? Why?  

  6. **On edge cases**:  
     Could a true inner-alignment failure exist in your framework—say, an agent with a *incoherent* mesa-objective? If so, what would that look like, and how would it differ from reference failure?  

  These questions force development of the position by challenging its boundaries, implications for existing concepts, and testability—without relying on literature or warm-ups. They target the core tension: whether inner alignment is a meaningful category or an illusion created by ontological mismatches.
