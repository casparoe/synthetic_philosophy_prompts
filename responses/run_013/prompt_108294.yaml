  2. **Is the test predictive enough and does the selection significantly reduce the disease burden?**
     - If the test has sufficient predictive power (e.g., for a single-gene disorder with high penetrance, it is; for a weak polygenic score, it might not be) and the reduction in disease burden is substantial (e.g., from a high risk to a low risk), then approve.
