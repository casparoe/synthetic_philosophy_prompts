  We are going to design a procedure based on a version of procreative beneficence that is operational for your committee. The core idea is that when selecting among embryos, parents have a reason (and in some cases, an obligation) to choose the embryo expected to have the best life, focusing on traits that bear on the child's well-being in a general way (like health, intelligence, etc.), but respecting the child's future autonomy in how they use those traits.

  However, we must adapt this to a practical procedure that can be run in a committee with limited time and without requiring philosophical expertise. The procedure will be a series of questions that can be answered with available evidence and shared values, with clear stopping points.

  Key distinctions we must keep:
  - Disease vs. non-disease traits: but note that the line is blurry (e.g., deafness might be considered a disability by some but not by others). We will use the concept of "significant impairment" to define disease.
  - Traits that are all-purpose means (like health) vs. traits that are specific to a particular conception of the good life (like musical talent). The procedure will focus on all-purpose means.

  We will drop some nuances, such as:
  - The exact weighting of different goods (we'll rely on a rough consensus of what is clearly beneficial).
  - The uncertainty of polygenic scores (we'll require a minimum level of evidence for the trait to be considered).

  The procedure:

  We'll break it down into steps. Each step is a question that must be answered. The steps are ordered so that if we can stop early (e.g., if the trait is clearly a disease and the selection clearly avoids it, we approve without going further).

  Steps:

  1. **Is the trait in question a disease?** 
     - We define a disease as a condition that typically causes significant impairment in health, functioning, or well-being. This is a conceptual and empirical question. The committee must decide based on medical consensus and evidence. If yes, go to step 2. If no, go to step 3.

  2. **Is the selection likely to significantly reduce the risk or severity of the disease?** 
     - Empirical: based on the strength of the genetic association and the predictive power of the test. If the test is weak (e.g., a polygenic score with low predictive power) and the reduction in risk is minimal, then it might not be sufficient. If yes, approve. If no, refuse.

  3. **Is the trait an all-purpose good?** 
     - An all-purpose good is one that is generally useful for a wide range of life plans (e.g., health, intelligence, memory). This is a conceptual and value question. The committee must decide by consensus. If yes, go to step 4. If no, go to step 5.

  4. **Is the selection likely to significantly improve the expected well-being of the child by improving this trait?** 
     - Empirical: we need evidence that the trait improvement leads to a better life. For example, height might be linked to social advantages, but if the evidence is weak or the advantage is minimal, then it might not be sufficient. Also, we must consider the magnitude: if the expected improvement is trivial, it might not be worth it. If yes, approve. If no, refuse.

  5. **Does the selection respect the future child's autonomy?** 
     - This step is for traits that are not all-purpose goods (e.g., selecting for deafness). We ask: would this selection restrict the child's ability to form and pursue their own life plan? If the trait is a disability (as defined in step 1) then it would typically restrict autonomy. However, in the case of deafness, if the parents argue that it is a culture and not a disability, then we have to consider whether the child will be able to function well in the world and have a wide range of options. The committee must decide based on the evidence of impairment and the child's future opportunities. If the selection does not restrict autonomy (or even enhances it in a particular context) then approve. If it does restrict autonomy, then refuse.

  But note: step 5 is tricky. We might instead say: if the trait is not a disease and not an all-purpose good, then the selection is for a specific conception of the good life, which is not the role of the parents (according to procreative beneficence) because it might conflict with the child's own future choices. So we would refuse.

  However, in the case of deaf parents wanting a deaf child, they may argue that the child will be better off in their community. Our principle of procreative beneficence requires choosing the child expected to have the best life. If the evidence shows that a deaf child in a deaf family has a life as good as a hearing child, then it might be acceptable. But if being deaf is a significant impairment (as defined by medical consensus) then it would be considered a disease and we would have already caught it at step 1.

  Alternatively, we can reframe step 1 to be more inclusive of disability perspectives: perhaps we define disease not solely by medical impairment but also by social context? But that might make the procedure too subjective.

  We'll stick to a medical model for disease in step 1, but in step 5 we allow for the possibility that a trait that is typically a disease might not be in a particular context.

