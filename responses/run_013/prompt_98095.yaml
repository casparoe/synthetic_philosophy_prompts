prompt: |-
  Next month I'm giving a talk at our cog sci seminar pushing a deflationary line on cognitive penetration, and I want to be ready for the Q&A. The thesis: almost everything people trot out as penetration of perceptual *experience* is really penetration of perceptual *decision* or judgment, and once you pull those apart, what's left is narrow and honestly kind of boring -- cognition nudges the gain and the priors, it doesn't rewrite the contents. I call the surviving phenomenon "calibration" rather than penetration, and I lean hard on the operational point that the effect usually shows up in a 2AFC or a speeded categorization but evaporates when you ask for a phenomenal report, and the grey-banana stuff is my poster child. The room is mostly psychophysicists and vision scientists who already lean encapsulation, plus one predictive-processing guy who thinks everything penetrates everything, plus a philosopher of perception who'll want to know what "experience" is even supposed to mean here.

  Prep me for what I'll actually get: the objections these specific people will raise, in their own vocabulary, ordered by how much damage they do, each with a two-minute reply and a note on where the reply is soft, and tell me the one question I'm really hoping nobody asks. Skip the textbook Fodor-vs-Pylyshyn recap, I know it cold. Just write it out in continuous prose like you'd email it to me -- no headings, no bullets, no bold, no tables, I hate that stuff.
