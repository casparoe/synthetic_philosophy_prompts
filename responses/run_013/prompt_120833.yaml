  Hmm, the user's hobby-horse about institutional definitions (rules vs equilibrium) is central here. But they explicitly welcome challenges to it, signaling intellectual honesty. The real tension lies in bridging philosophy with empirical work—economists will demand "so what?" outcomes. The user needs armor against skepticism, so each priority must show concrete value for econometricians.

  First, let's map the conceptual knots: (1) The ambiguity in "institutions" enables contradictory findings ("institutions matter" vs "institutions are sticky"). (2) Quasi-experimental evidence (settler mortality etc.) suffers from bundled causal pathways. (3) Culture-institution interactions are underspecified—do beliefs shape rules or vice versa? 

  Prioritization criteria must include: 
  - *Explanatory leverage*: How much empirical confusion would resolving this dissolve? 
  - *Philosophical tractability*: Can conceptual work alone make progress? 
  - *Empirical synergy*: Does clarifying this enable better econometrics? 
  - *Scalpel potential*: Does it surgically address foundational splits?

  Top priority jumps out: **Define "institutional persistence."** Why? Because it directly attacks the user's hobby-horse while forcing engagement with both definitions (rules vs equilibrium). If institutions-as-rules persist only when internalized as equilibria, that explains why "installed" institutions often fail. This redefines persistence not as rigidity but as self-enforcing expectation networks—a framing economists could operationalize (e.g., measuring expectation convergence post-reform). Philosophically, it's tractable via game theory and social ontology without new data. Settling this would shift how we interpret historical stickiness and policy failures. 

  Second priority: **Disentangle institutional proxies in quasi-experiments.** This tackles the user's concern about "bundled causality" head-on. If settler mortality affects both formal rules *and* cultural distrust, philosophers can unpack how these layers interact—e.g., does geography *become* destiny via institution-culture feedback? Progress here requires philosopher-economist teams analyzing existing datasets through layered causal models. The payoff is high: cleaner quasi-experimental inferences without new fieldwork. 

  Third: **Clarify "institutional quality" normativity.** Often implicit in econometrics (e.g., "good institutions = property rights protection"), this smuggles in liberal ideals. Philosophers can expose these assumptions and separate functional from moral definitions—e.g., a "good" institution could be one that persists efficiently versus one that promotes justice. This prevents ideological biases masquerading as findings, something economists might grudgingly appreciate. 

  Deliberate exclusions: 
  - Pure metaphysics of social kinds (too detached from prosperity debates). 
  - Culture definitions without institutional links (risks redundancy). 
  - The user's hobby-horse *alone*—it's embedded but needs empirical scaffolding to matter to economists. 

