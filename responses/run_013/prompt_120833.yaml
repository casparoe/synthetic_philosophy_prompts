answer: |-
  ### Top Priority: Define "institutional persistence" rigorously to reconcile rules vs. equilibrium views, because this unlocks causal inference in quasi-experiments and resolves the core tension in the literature.

  **Reasoning & Agenda:**  
  Your hobby-horse is correct but incomplete—it needs *operationalization*. The real blockage isn’t just defining institutions (rules vs. equilibrium), but **understanding how persistence works across both views**. This anchors all other questions:  

  1.  **What constitutes "persistence"?** (Fund this first)  
      - **Why upstream?** Until we clarify whether persistence is about rule durability (laws on paper) or expectation stability (behaviors), we can’t interpret *why* institutions "stick" or how interventions fail. This directly addresses your "institutions can be installed vs. cannot be" paradox.  
      - **Impact:** Resolving this would force economists to specify which institutional layer they measure (e.g., colonial land deeds vs. actual land-use norms). If settled, it reframes debates like Acemoglu-Robinson vs. Diamond: geography/culture may determine *which* institutions persist, not whether they matter.  
      - **Philosophical tractability:** Progress requires analyzing social ontology (e.g., Searle’s status functions) and game theory (self-enforcing equilibria), not new data.  
      - **Evidence to watch:** Case studies of "failed transplants" (e.g., Afghan constitution vs. tribal jirgas). If ethnographies show rules gaining traction only when expectations align, equilibrium views strengthen.  
      - **Economist skepticism defense:** "Without this, your IVs are noise—you’re mistaking legal changes for institutional change."  

  2.  **How do institutions interact with culture when both claim explanatory primacy?**  
      - **Why #2?** Culture (e.g., Protestant ethics) and institutions (e.g property rights) are often conflated in proxies. Disentangling them reveals whether culture is a prior cause, a reinforcing mechanism, or part of the institution itself.  
      - **Impact:** Reshapes experimental design—e.g., if culture *is* the equilibrium, then "institutions vs. culture" is a false dichotomy. Explains why identical rules fail in different cultural contexts (e.g., Latin American vs. Canadian land titling).  
      - **Tractability:** Conceptual mapping of "beliefs" (culture) vs. "coordinated expectations" (equilibrium institutions). Needs collaboration with historians to audit existing datasets.  
      - **Evidence mover:** Natural language processing of historical texts tracking belief shifts post-institutional shock (e.g., post-Soviet states).  

  3.  **Can "institutional quality" be defined without normative bias?**  
      - **Why #3?** Economists proxy "good institutions" with growth-friendly features (e.g., constraint on expropriation). But this assumes liberal-democratic ideals, ignoring functional alternatives (e.g., clan-based governance).  
      - **Impact:** Undermines cross-cultural comparisons. A non-normative definition (e.g., "coordination efficiency") lets us test if *any* persistent institution aids prosperity, not just Western ones.  
      - **Tractability:** Philosophy of science (value-ladenness) and institutional functionalism. No new data needed.  
      - **Skeptic defense:** "Your 'quality' metric is circular—prosperous countries define it."  

  4.  **What counts as a "quasi-experiment" for institutional causation?**  
      - **Why #4?** Tackles your concern about bundled levers (e.g., settler mortality affecting both institutions and disease norms). Requires specifying how institutions are isolated in natural experiments.  
      - **Impact:** Forces clarity on what "institutions" are being tested—e.g., if boundaries arbitrarily group cultures, we’re testing institutional *resilience*, not origins.  
      - **Tractability:** Philosophers can dissect causal inference assumptions (e.g., difference-in-differences) and propose robustness checks.  
      - **Evidence mover:** Re-analysis of canonical papers (e.g., Banerjee-Iyer) testing if results hold when "institutions" are disaggregated into rules vs. equilibria.  

  ### Overrated Questions to Deprioritize:  
  - **"What is prosperity?"** (Overtheorized; economists pragmatically use GDP/capita).  
  - **"Is geography destiny?"** (Already well-trodden; adds little beyond institutional mediation).  
  - **Pure metaphysics of social kinds** (e.g., "Do institutions *really* exist?"—irrelevant to policy).  

  ### Why Your Hobby-Horse Survives (But Needs Surgery):  
  You’re right that conflation of rules vs. equilibrium drives confusion, but funding "defining institutions" alone won’t sway economists. **Persistence** is the sharper tool: it forces both sides to engage. Rules theorists must explain why some rules endure while others don’t; equilibrium theorists must explain how expectations formalize into rules. This bridges theory and empirics.  

  ### Criteria Used & Conflicts:  
  1. **Explanatory leverage** (How many empirical puzzles does this solve?) vs. **economist engagement** (Will they care?). Persistence wins on both.  
  2. **Philosophical tractability** (Can we make headway without data?) vs. **empirical impact** (Will it improve measurement?). Culture-institutions interaction balances these.  
  3. **Foundational urgency** (Does this underpin other work?) vs. **actionability** (Can we design better studies?). Quasi-experiments rank lower as it’s more corrective than generative.  

  ### Bottom Line for Your Board:  
  Fund work on **institutional persistence first**—it transforms your hobby-horse into an empirical research program. Pair philosophers with economic historians to dissect cases of institutional change (e.g., Meiji Restoration, post-Apartheid South Africa), testing definitions against real-world stickiness. In 3 years, you’ll deliver a framework that econometricians *must* engage with—or admit their variables are uninterpreted.
