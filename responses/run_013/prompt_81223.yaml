  ## The Boundary Problem in the UK's Dual Referendums: A Case Study

  The 2016 Brexit referendum and the 2014 Scottish independence referendum offer a powerful comparative lens through which to examine the "boundary problem": the fundamental question of *who* constitutes the legitimate demos for deciding a specific political question. The UK state employed demonstrably different franchises for these two major constitutional decisions, revealing the tensions and contradictions inherent in applying abstract principles to real-world democratic delimitation. Analyzing these cases through the three main candidate principles – the all-affected principle, the all-subjected principle, and the political community principle – exposes their strengths, weaknesses, and the ultimately political nature of boundary-drawing.

  **Candidate Principles and Their "Ideal" Franchises:**

  1.  **All-Affected Principle:** The demos should include all individuals whose interests are significantly affected by the decision.
      *   **Brexit (2016):** Would necessitate a vastly broader franchise. It must include:
          *   *All* EU citizens resident in the UK (profound impact on residency, work, family rights).
          *   UK citizens resident long-term in other EU states (direct impact on residency, pensions, healthcare).
          *   Residents of Gibraltar (heavily affected by border, economy). Also potentially citizens of other EU states (impact on trade, travel, rights) – though this highlights the principle's potential for limitless expansion.
          *   Likely 16-17-year-olds (long-term impact).
      *   **Scottish Independence (2014):** Similarly expansive. Must include:
          *   *All* UK and EU citizens resident in Scotland (affected by new state's laws, economy).
          *   Scots living elsewhere in the UK (impact on citizenship, assets, identity).
          *   Potentially rUK citizens (impact on UK structure, economy) and other EU citizens (impact on EU membership).

  2.  **All-Subjected Principle:** The demos should include all individuals subject to the coercive authority of the resulting polity/laws.
      *   **Brexit (2016):** Focuses on those bound by UK law post-Brexit.
          *   Includes UK citizens resident *anywhere* (subject to UK citizenship laws/taxation).
          *   Includes *all* non-UK citizens legally resident in the UK (subject to UK immigration, employment law).
          *   *Excludes* Gibraltar residents (subject to Gibraltar law, not directly UK law).
          *   Ambiguous on 16-17-year-olds (subject to law, but often excluded from franchise).
      *   **Scottish Independence (2014):** Focuses on those subject to the new Scottish state.
          *   Includes *all* residents of Scotland at the time of the vote (who would be subject to the new Scottish state's authority).
          *   *Excludes* Scots living elsewhere in the UK (who would remain subject to UK/rUK law).
          *   Supports inclusion of 16-17-year-olds (as future subjects).

  3.  **Political Community Principle:** The demos is a pre-existing, bounded historical community with the right to self-determination, including defining its own membership.
      *   **Brexit (2016):** Defines the community as the "UK political nation."
          *   Includes UK citizens (core members), Commonwealth citizens (historical ties, "kith and kin"), Irish citizens (special status under Common Travel Area), Gibraltar residents (loyal Overseas Territory).
          *   Excludes other EU citizens (not seen as part of the UK polity), UK expats beyond 15 years (deemed to have severed primary membership).
          *   Excludes 16-17-year-olds (traditional voting age boundary).
      *   **Scottish Independence (2014):** Defines the community as those "belonging to Scotland."
          *   Includes UK/EU citizens *resident* in Scotland (emphasizes residence as key to belonging).
          *   *Excludes* Scots living elsewhere in the UK (residence defines belonging).
          *   Includes 16-17-year-olds (expanded view of community membership, future focus).

  **Principle vs. Practice: Explanations and Tensions**

  *   **All-Affected Principle:**
      *   **Explains:** Inclusion of Gibraltar in Brexit (recognized significant impact). *Partial* explanation for Scottish inclusion of EU citizens (impact *in* Scotland) and 16-17-year-olds (future impact).
      *   **Misdescribes/Can't Account For:** Exclusion of *all* affected EU citizens in Brexit and UK expats abroad. Exclusion of non-resident Scots in 2014. The principle demands far broader franchises than either used. It struggles inherently with limiting "affectedness" (e.g., global markets).
      *   **Principled or Ad Hoc?** Neither franchise aligns well. Actual choices seem ad hoc rejections of the principle's expansive logic, driven by political feasibility.

  *   **All-Subjected Principle:**
      *   **Explains:** Scottish inclusion of resident EU citizens (subject to Scottish law post-independence). Scottish inclusion of 16-17-year-olds (future subjects). *Partial* logic for excluding UK expats >15 years in Brexit (weaker ongoing subjection) and non-resident Scots in 2014.
      *   **Misdescribes/Can't Account For:** Brexit exclusion of *all* resident EU citizens (clearly subject to UK law pre- *and* post-referendum). Brexit inclusion of Commonwealth citizens (often *not* subject to UK immigration control pre-referendum, unlike EU citizens). Inclusion of Gibraltar in Brexit (not subject to UK domestic law).
      *   **Principled or Ad Hoc?** The Scottish franchise aligns *better* (emphasizing residence/subjection). The Brexit franchise actively contradicts it regarding resident EU citizens, suggesting politics overrode principle.

  *   **Political Community Principle:**
      *   **Explains:** Brexit inclusion of Commonwealth citizens and Gibraltar (historical ties/imperial legacy). Brexit exclusion of other EU citizens (not part of "UK nation"). Brexit exclusion of long-term expats (membership lapsed). Brexit exclusion of 16-17-year-olds (traditional boundaries). Scottish exclusion of non-resident Scots (residence defines belonging). Scottish *inclusion* of resident EU citizens (expanded "civic" Scottish identity).
      *   **Misdescribes/Can't Account For:** Scottish inclusion of resident EU citizens (challenges a purely historical/ethnic UK-wide community definition). Scottish inclusion of 16-17-year-olds (challenge to traditional age boundary). Brexit exclusion of *all* resident EU citizens despite some (Malta, Cyprus) having closer historical ties than, say, Canadians.
      *   **Principled or Ad Hoc?** This principle offers the *strongest* explanation for the *differences*: Scotland defined its community more inclusively (civic/residence-based), while the UK used a more restrictive, historically-based definition emphasizing Commonwealth ties and excluding "Europeans." The variations reflect different conceptions of the relevant political community. However, the specific inclusions/exclusions (e.g., why 15 years? Why Malta/Cyprus exception?) still show significant political tailoring.

  **Key Cases Highlighting Divergence:**

  *   **EU Citizens in UK:** Excluded in Brexit (Political Community trumps Affected/Subjected). Included in Scotland (Political Community *and* All-Subjected align via civic/residence definition).
  *   **Commonwealth Citizens in UK:** Included in Brexit (Political Community - historical ties). Neither Affected nor Subjected provides a strong justification (impact/subjection often less direct than for EU citizens).
  *   **UK Citizens Abroad (>15 years):** Excluded in both (Political Community - lapsed membership; weakens Subjected claim). Affected Principle demands inclusion, especially for Brexit.
  *   **16-17-Year-Olds:** Excluded in Brexit (Political Community - traditional boundary). Included in Scotland (Political Community - expanded civic membership; aligns with Subjected/Affected future focus).
  *   **Gibraltar:** Included in Brexit (Political Community - special status as Overseas Territory). Excluded by Subjected (different legal jurisdiction). Affected supports inclusion.

  **What the Episode Shows About the Boundary Problem:**

  This dual case study powerfully demonstrates that the boundary problem is not a single puzzle with a definitive solution, but rather **a family of distinct questions – "Who is coerced (subjected)?" "Who is impacted (affected)?" "Who belongs (member)?" – that frequently pull in different directions in practice.** No single principle (Affected, Subjected, Community) consistently explains or justifies the actual franchise decisions made.

  *   **Against Prior Principle Pessimism?** It strongly supports the view that the demos **cannot be constituted solely by prior abstract principle.** While principles informed the debates and justifications, the *actual boundaries* were the result of **political settlements** reflecting power dynamics, historical legacies (Commonwealth), competing nationalisms (UK vs. Scottish civic identity), strategic calculations (excluding potentially pro-EU groups like youth/EU citizens in Brexit), and pragmatic constraints (defining "belonging" via residence or historical ties). The Malta/Cyprus exception in Brexit highlights ad hoc political compromise.
  *   **Support by Elimination?** Neither Affected nor Subjected principles are supported by elimination. Affected is too expansive and unworkable. Subjected is clearer but was blatantly ignored for EU citizens in Brexit. The Political Community principle explains the most variance, *particularly the difference between the two referendums*, but it is inherently flexible and contestable (e.g., civic vs. ethnic/residence vs. birth). It's the principle most amenable to political manipulation.
  *   **The Core Lesson:** **The choice of principle itself is a political decision.** Scotland chose a more inclusive, civic/residence-based community definition aligned with Subjected. The UK government chose a more exclusive, historically-rooted definition for Brexit. The boundary problem is insoluble by pure theory; it is always mediated by politics, history, and the specific nature of the question ("leave a union" vs. "form a new state").

  **Verdict:** The referendums confirm that constituting the demos is fundamentally a political act, where competing principles (Affected, Subjected, Membership) are invoked selectively to justify boundaries ultimately shaped by power, historical context, and strategic interests. The boundary problem manifests as distinct questions that conflict, forcing political prioritization.

  **The Crucial Test Case:** The franchise for a **hypothetical future referendum on Irish reunification** would most sharply test these conclusions. Would it:
  1.  Include *all* residents of Northern Ireland (Subjected/current community)? (Likely)
  2.  Include residents of the Republic of Ireland (Affected, arguably Subjected to new arrangements)? (Unlikely, clash with Community)
  3.  Include Northern Ireland-born people living in GB (Affected, Community ties)? (Contentious)
  4.  Include 16-17-year-olds? (Testing evolution of community principle)
  5.  How would "the community" be defined – purely geographic, ethno-national, or a new hybrid? The resolution of these questions, especially the inclusion of RoI residents or non-resident Northerners, would starkly reveal whether political expediency, evolving community definitions, or a clearer principled stance prevails, further illuminating the intractable yet politically contingent nature of the boundary problem.
