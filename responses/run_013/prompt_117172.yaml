     - For an attribution report:
            - If we excluded a candidate that turns out to be the true source, then the overall claim (that the source is in the non-excluded set) was incorrect. We withdraw the entire report and issue a correction.
            - If we failed to exclude a candidate that is later shown not to be the source, that doesn't affect the overall claim (the source was in the set, but we now know it wasn't that candidate). We can update the report by removing that candidate from the non-excluded set? But note: the report was based on evidence at the time. We might issue an addendum.

       We require: the same evidence must not support opposite verdicts in two documents issued in the same month. Therefore, if we have two reports in the same month that use the same evidence and come to opposite conclusions, we must withdraw one.

     - For an assurance report:
            - We expected some findings to be withdrawn. When one is shown to be false, we withdraw that finding and update the expected number of errors accordingly (reduce the expected errors by the expected contribution of that finding, but note: it was an actual error). We do not necessarily withdraw the entire report.

     - General rule: when new evidence shows a claim to be false, we re-evaluate only that claim and update the report. For the attribution report, if the false claim was an exclusion that was part of the non-excluded set (i.e., we did not exclude it and now we have evidence it is not the source) then we can remove it from the non-excluded set. If the false claim was an exclusion that we did exclude (and now we know it was the source) then we must correct the entire report.

  **Step 8: The Sign-off**
     - For an attribution report (mutually exclusive and exhaustive set):
          The sign-off says: 
            "We have excluded the following candidates at 99% confidence each: [list]. 
             The source is therefore one of the following candidates: [list of non-excluded]. 
             We are 99% confident that the true source is in this set."

          And if the non-excluded set has one candidate, we can say: "We attribute the outbreak to candidate X with 99% confidence."

     - For an assurance report (non-mutually-exclusive):
          The sign-off says:
            "We assert each of the 40 findings at 95% confidence. 
             The expected number of errors in this report is 2. 
             This means that we expect about 2 of these findings may be revised in the future as new evidence emerges."

     - The accountable officer signs to indicate that the methods were followed and the report is an accurate representation of the evidence at the time.

  **The Procedure in Steps**

  **Step 0: Classify the Report Type**
     - If the report is an attribution report (closed list of mutually exclusive and exhaustive candidates, and claims are exclusions of candidates), then go to Step A.
     - If the report is an assurance report (set of positive findings that are not mutually exclusive), then go to Step B.
     - Otherwise, if it is a mixed type, flag as error and refer to a senior analyst.

  **Step A: Attribution Report (Mutually Exclusive and Exhaustive Candidates)**
     A1. For each candidate, test the exclusion at the required confidence level (e.g., 99%).
     A2. Record: 
          - Candidate identifier.
          - Excluded? (Yes/No)
          - Confidence level for the exclusion (if excluded).
          - Evidence used.
     A3. Form the set of non-excluded candidates.
     A4. The overall confidence that the true source is in the non-excluded set is the same as the required confidence level for each exclusion test (e.g., 99%).
     A5. The sign-off states:
          - The list of excluded candidates and the confidence level for each.
          - The list of non-excluded candidates.
          - The overall confidence that the source is in the non-excluded set.
          - If the non-excluded set has one candidate, then the source is attributed to that candidate at the stated confidence.

     A6. If later evidence shows that a non-excluded candidate is not the source, then remove that candidate from the non-excluded set and reissue the report (if the set is still non-empty) or if the set becomes empty, then conduct a new investigation.
     A7. If later evidence shows that an excluded candidate was actually the source, then withdraw the entire report and issue a correction.

  **Step B: Assurance Report (Non-Mutually-Exclusive Positive Findings)**
     B1. For each finding, record:
          - The finding statement.
          - The confidence level (e.g., 95%).
          - The evidence used (and group by evidence group).
     B2. Calculate the expected number of errors: E = sum (1 - confidence_i) for all findings.
     B3. Check against policy: if E > max_expected_errors (e.g., 3), then remove findings (starting with the lowest confidence) until E <= max_expected_errors.
     B4. The sign-off states:
          - We assert each finding at its stated confidence level.
          - The expected number of errors in this report is E.
          - Note: This means that we expect about E findings may be revised in the future.

     B5. When a finding is later shown to be false, we withdraw that finding and update the report by removing it and recalculating E (as E - (1 - confidence_i) for the removed finding). We also note that the actual error occurred.

  **Running the Procedure on Three Cases**

  **Case 1: Attribution Report (60 candidates, 99% each)**
     - Type: Attribution -> Step A.
     - We test each candidate. Suppose we rule out 59 of them. Then one candidate remains.
     - We state: 
          "We have excluded 59 candidates at 99% confidence each. 
           The source is therefore candidate X. 
           We are 99% confident in this attribution."
     - This is the outcome we like.

     But what if we rule out 60? 
          - We would then have no non-excluded candidate. 
          - This is impossible because there must be a source. 
          - But our tests might have excluded the true source (1% chance) and also we might have by chance excluded every non-source (each non-source exclusion has 99% chance, so 59 non-sources: (0.99)^59 ≈ 0.55). 
          - The probability of this event is 0.01 * 0.55 = 0.0055, which is 0.55%. 
          - We then have no candidate to name. 
          - We must state: "Our investigation ruled out all candidates. This indicates an error in the investigation. We will reopen the investigation." 
          - The procedure would record: non-excluded set is empty. We do not attribute. We note the overall confidence is 99% that the source is in the non-excluded set, but the set is empty -> so we are 99% confident that the source is not in the list? But we know it is. So we must conclude an error.

     This is an outcome we do not like, but it is rare (0.55%). We have to report it as an investigation failure.

  **Case 2: Assurance Report (40 findings, 95% each)**
     - Type: Assurance -> Step B.
     - E = 40 * 0.05 = 2.
     - If the policy max_expected_errors is 3, then we accept.
     - Sign-off says: expected number of errors is 2.

     This is acceptable.

  **Case 3: Twelve findings all rest on one method (same evidence group)**
     - Each at 95% confidence.
     - We are in Step B (assurance type).
     - E = 12 * 0.05 = 0.6.
     - If policy max_expected_errors is 3, then we accept and report E=0.6.
     - But note: the joint confidence that all 12 are true? 
          Using Bonferroni: 1 - 12*0.05 = 1 - 0.6 = 0.4 -> 40%. 
          This is low, but we are not using joint confidence. We are using expected errors.

     However, the accountable officer might be uncomfortable signing a report where the chance that at least one error is present is 1 - (0.95)^12 ≈ 46%. But we are not requiring that the officer guarantees all are true. We are only stating the expected number of errors (0.6) and allowing for the possibility of errors.

     So the officer signs.

     But what if the policy was to require joint confidence? We don't. We are using expected errors.

     Therefore, we do not strike any finding. We report all 12 and state that the expected number of errors is 0.6.

     This might be counterintuitive: the set of 12 has a high probability of containing at least one error, but we are reporting them because the expected count is low.

     If we wanted to control the probability that the report is error-free, we would use joint confidence. But our procedure does not.

     We could have a branch in the procedure for evidence groups: if a group has a large number of claims, we might require a joint confidence check? But we did not build that.

     Alternatively, we might have a policy that sets a maximum expected error per evidence group? For example, no evidence group should have an expected error > 1. Then for a group of 12 at 95%, the expected error is 0.6, which is <1, so it passes.

     We stick with the current procedure.

  **What the Procedure Cannot Do**

     - It cannot guarantee that a set of claims is jointly true with high confidence when the claims are numerous and based on the same evidence. In the assurance report, we abandon that goal and report the expected number of errors.
     - It does not account for dependence between claims beyond grouping by evidence. If claims across groups are dependent, our expected error count is still valid (because expectation is linear) but the variance might be high. We do not provide a confidence interval for the number of errors.
     - In the attribution report, the procedure relies on the assumption that the true source is in the list. If it is not, then the entire report is invalid. We do not account for that possibility.

  **Disguised Judgements**

     - The classification of report type (Step 0) is a judgement.
     - The grouping by evidence (Step 2) is a judgement: what counts as a critical shared evidence?
     - The policy parameters (required confidence levels, max_expected_errors) are set by committee and are judgements.

  **Arithmetic Steps**

     - In Step A: forming the non-excluded set is arithmetic.
     - In Step B: summing the error probabilities is arithmetic.

  **Which Bullet Does It Bite?**

     We bit the bullet: 
       - For the assurance report, we allow that the signatory accepts a set while expecting that some of its members are false (but we quantify the expectation).
       - For the attribution report, we do not assert the entire set of exclusions (because one is false) but we do assert each individually and then make an overall claim.

     We found a better option for the attribution report by changing what we assert: we assert the overall claim about the set of non-excluded candidates.

     This procedure meets the requirement of one standard for both reports, but the two reports are handled in different branches.

     We hope this is acceptable.
answer: |-
  ### Unified Procedure for Report Sign-off

  #### **Definitions**
  - **Claim**: A statement evaluated as true or false (e.g., "Supplier X is excluded as the source," "Pesticide Y levels are safe").
  - **Confidence Level**: Pre-set probability threshold (e.g., 95%, 99%) for accepting a claim, based on evidence. Set by agency policy, not analysts.
  - **Evidence Group**: Claims sharing critical evidence (e.g., same lab method, dataset, or expert panel). Assigned a unique group ID.
  - **Mutually Exclusive and Exhaustive (MEE) Set**: Claims where exactly one must be true (e.g., attribution candidates).

  ---

  ### **Procedure Steps**

  #### **Step 1: Classify Report Type**
  - **Question**: Is the claim set MEE?  
    **Answer**:  
    - **Yes** (e.g., attribution report) → Proceed to **Step A**.  
    - **No** (e.g., assurance report) → Proceed to **Step B**.  
    **Record**: Report type (MEE/non-MEE).

  #### **Step 2: Assign Evidence Groups**  
  - **Question**: Do any claims share critical evidence (e.g., same method, dataset, panel)?  
    **Answer**: Group claims sharing evidence; assign a group ID.  
    **Record**: Group ID for each claim, evidence sources.

  #### **Step 3: Calculate Key Metrics**  
  - **For MEE (Attribution)**:  
    - **Question**: What is the required confidence per exclusion (policy-set, e.g., 99%)?  
    **Record**: Confidence level per exclusion.  
  - **For Non-MEE (Assurance)**:  
    - **Question**: What is the required confidence per finding (policy-set, e.g., 95%)?  
    **Answer**:  
      - Compute **Expected Errors (E)**: Sum of error probabilities:  
        \( E = \sum (1 - \text{confidence}_i) \) for all claims.  
      - **Policy Check**: Is \( E \leq \text{max\_expected\_errors} \) (policy-set, e.g., 3)?  
        - **Yes** → Proceed to sign-off.  
        - **No** → **Hand to person**: Senior analyst removes lowest-confidence claims until \( E \leq \text{max\_expected\_errors} \).  
    **Record**: \( E \), list of retained/removed claims.

  #### **Step 4: Joint Acceptance Rule**  
  - **Question**: Can we accept the conjunction of all claims?  
    **Answer**:  
    - **MEE (Attribution)**: No. Claims cannot all be true (one source exists). Instead, accept:  
      - Each valid exclusion individually.  
      - Overall set of non-excluded candidates.  
    - **Non-MEE (Assurance)**: No. Conjunction not guaranteed. Instead, accept:  
      - Each finding individually.  
      - Expected error count \( E \).  
    **Rationale**: Arithmetic (MEE) or expected value (non-MEE) replaces flawed conjunction. Judgement is confined to policy thresholds.

  #### **Step 5: Sign-off Rules**  
  - **MEE (Attribution)**:  
    - **May**:  
      - List exclusions with individual confidence.  
      - State non-excluded candidates.  
      - Assert: "The source is among non-excluded candidates with [confidence]% confidence."  
      - If one candidate remains: Name it as the source.  
    - **May Not**: Claim all exclusions are jointly true.  
  - **Non-MEE (Assurance)**:  
    - **May**:  
      - List findings with individual confidence.  
      - State: "Expected errors: \( E \)."  
      - Disclaim: "Findings may be revised; this report is not error-free."  
    - **May Not**: Claim all findings are true.  

  #### **Step 6: Revision Rules**  
  - **MEE (Attribution)**:  
    - If a non-excluded candidate is later proven false: Re-run analysis with new evidence.  
    - If an excluded candidate is later proven true: Withdraw entire report.  
  - **Non-MEE (Assurance)**:  
    - If a finding is falsified: Remove it, recalculate \( E \), reissue report.  
    - If new evidence contradicts a claim in another same-month report: Withdraw the less confident claim.  
  - **Constraint**: Identical evidence cannot support opposite conclusions in reports issued within one month.

  #### **Step 7: Asymmetric Costs**  
  - **Rule**: Confidence levels and max_expected_errors are set by policy (not analysts) based on cost asymmetry:  
    - E.g., Attribution exclusions: High cost for missing source → 99% confidence.  
    - E.g., Assurance findings: High cost for false negatives → 95% confidence, max_expected_errors=3.  
  - **Enforcement**: Policy set annually by cross-functional committee (risk, legal, science). Analysts cannot deviate.

  ---

  ### **Case Applications**

  #### **Case 1: Attribution Report (60 Candidates, 99% Each)**  
  - **Steps**:  
    1. **Type**: MEE → Step A.  
    2. **Evidence Groups**: None (independent tests).  
    3. **Metrics**: Each exclusion at 99% confidence.  
    4. **Result**:  
       - If 59 exclusions valid: Source is the 60th candidate (99% confidence).  
       - If 60 exclusions attempted: **Procedure stops with "no"** (impossible; one must be source).  
  - **Outcome You Won’t Like**: You cannot publish 60 exclusions.  
    **What You Give Up**: Asserting all exclusions jointly. Instead, publish non-excluded candidates and attribute if one remains.  

  #### **Case 2: Assurance Report (40 Findings, 95% Each)**  
  - **Steps**:  
    1. **Type**: Non-MEE → Step B.  
    2. **Evidence Groups**: None (all independent).  
    3. **Metrics**: \( E = 40 \times 0.05 = 2 \).  
    4. **Policy Check**: \( E \leq 3 \) → Accept.  
  - **Sign-off**: "40 findings at 95% confidence. Expected errors: 2."  

  #### **Case 3: 12 Findings, One Evidence Group (95% Each)**  
  - **Steps**:  
    1. **Type**: Non-MEE → Step B.  
    2. **Evidence Groups**: All 12 in one group (shared method).  
    3. **Metrics**: \( E = 12 \times 0.05 = 0.6 \).  
    4. **Policy Check**: \( E \leq 3 \) → Accept.  
  - **Sign-off**: "12 findings at 95% confidence. Expected errors: 0.6."  
    **Note**: Joint confidence collapses to 40% (Bonferroni), but the procedure retains findings as \( E \) is low.  

  ---

  ### **Limitations and Bitten Bullet**
  - **What It Cannot Do**:  
    - Guarantee joint truth of claims (abandoned by design).  
    - Handle complex dependencies beyond evidence groups.  
    - Eliminate judgement in evidence grouping (Step 2) or policy thresholds.  
  - **Arithmetic vs. Judgement**:  
    - Arithmetic: Confidence levels, \( E \), MEE logic.  
    - Judgement: Evidence grouping, policy thresholds.  
  - **Bitten Bullet**:  
    **"Separately acceptable claims need not be jointly acceptable."**  
    - Attribution: Exclusions are individually sound but not jointly assertable.  
    - Assurance: Findings are individually sound but expected to contain errors.  
    **Rationale**: Prevents incoherence (attribution) and dishonesty (assurance).
