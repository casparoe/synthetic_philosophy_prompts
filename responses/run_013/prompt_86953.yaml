answer: |-
  Below is a decision tree designed to map the logical space of promissory obligation, structured to avoid presupposing philosophical positions. Students answer binary or multiple-choice questions to reach a leaf position, with 14 terminal leaves covering key distinctions (bindingness vs. directedness, practice-dependence, content-independence, grounds, and release conditions). Each branch is phrased neutrally, and leaves use standard labels or descriptive names where no label exists. Cases like the desert-island pair or secret harmless breach are implicitly handled by the tree's logic.

  ---

  ### **Decision Tree: Why Do Promises Bind?**

  **Start Here**  
  **1. Does the obligation require a preexisting social practice of promising?**  
     - **Yes** (Without a convention, "I promise" does nothing) → **Go to Q2**  
     - **No** (The words alone can create obligation, even without a practice) → **Go to Q5**  

  **For "Yes" to Q1 (Practice-Dependent Views)**  
  **2. Is the obligation owed *to the promisee*?**  
     (Can the promisee waive it? Is it their claim, even if unbroken or harmless?)  
     - **Yes** → **Go to Q3**  
     - **No** (The obligation is impersonal; no one holds a claim) → **Go to Q3**  
  **3. Must the promisor *intend* to participate in the practice?**  
     (If they say "I promise" but reject the practice, does it still bind?)  
     - **Yes** (No obligation if they disavow the practice) → **Go to Q4**  
     - **No** (They are bound regardless of their intent) → **Go to Q4**  
  **4. Does the promisor’s later rejection of the practice release them?**  
     (If they change their mind *after* promising, are they free?)  
     - **Yes** → **See Leaves 1, 3, 5, or 7**  
     - **No** → **See Leaves 2, 4, 6, or 8**  

  **Leaves for Practice-Dependent Views:**  
  - **Leaf 1: Directed, Intention Required, Released by Rejection**  
    (e.g., "I promised but now reject the practice → I’m released")  
  - **Leaf 2: Intentional Practice Conception** (Rawls/Searle)  
    (Binding only if intended; rejection after promising doesn’t release)  
  - **Leaf 3: Directed, No Intention Required, Released by Rejection**  
    (e.g., "Words alone bind without my intent, but I can later opt out")  
  - **Leaf 4: Non-Intentional Practice Conception**  
    (Binding by utterance alone; rejection doesn’t release)  
  - **Leaf 5: Impersonal, Intention Required, Released by Rejection**  
    (e.g., "I must keep promises for social utility, but only if I meant it, and I can quit later")  
  - **Leaf 6: Intentional Rule-Utilitarianism**  
    (Binding if intended; social utility requires adherence)  
  - **Leaf 7: Impersonal, No Intention Required, Released by Rejection**  
    (e.g., "Words bind automatically, but I can renounce the practice")  
  - **Leaf 8: Non-Intentional Rule-Utilitarianism**  
    (Binding by utterance; utility of the practice demands compliance)  

  **For "No" to Q1 (Practice-Independent Views)**  
  **5. What grounds the obligation?**  
     - **A: Reliance/Assurance** (The promisee’s trust or dependence) → **Go to Q6**  
     - **B: Promisor’s Authority** (The promisor’s control over their future or integrity) → **Go to Q6**  
     - **C: Impersonal Value** (e.g., fidelity’s intrinsic worth) → **Go to Q6**  
  **6. Is the obligation owed *to the promisee*?**  
     - **Yes** → **See Leaves 9, 11, or 13**  
     - **No** → **See Leaves 10, 12, or 14**  

  **Leaves for Practice-Independent Views:**  
  - **Leaf 9: Assurance View** (Scanlon)  
    (Ground: Reliance/Assurance; Directed: Yes)  
  - **Leaf 10: Reliance-Based Consequentialism**  
    (Ground: Reliance/Assurance; Directed: No; obligation is harm-avoidance)  
  - **Leaf 11: Authority View** (Owens)  
    (Ground: Promisor’s Authority; Directed: Yes)  
  - **Leaf 12: Self-Regarding Duty**  
    (Ground: Promisor’s Authority; Directed: No; obligation is to oneself)  
  - **Leaf 13: Unnamed (Directed Impersonal)**  
    (Ground: Impersonal Value; Directed: Yes; e.g., "Fidelity generates a claim")  
  - **Leaf 14: Fidelity View** (Ross)  
    (Ground: Impersonal Value; Directed: No; obligation is to keep promises *simpliciter*)  

  ---

  ### **I. Indistinguishable Leaves**  
  The tree cannot separate:  
  - **Rawls (Leaf 2) vs. Searle (Leaf 2)**: Both fall under "Intentional Practice Conception." The tree merges them because it doesn’t distinguish between *fairness*-based (Rawls) and *constitutive rules*-based (Searle) accounts of the practice.  
  - **Ross (Leaf 14) vs. other impersonal views**: "Fidelity View" lumps together all impersonal, non-directed views (e.g., Ross’s prima facie duty and utilitarian fidelity), as the tree doesn’t branch on *why* fidelity matters.  

  ---

  ### **II. Unoccupied Combinations**  
  1. **Leaf 1 (Directed, Practice-Dependent, Intention Required, Released by Rejection)**:  
     - *Diagnosis*: Coherent but unattractive. If obligation requires intent, later rejection shouldn’t dissolve it (the commitment is already made). No major defender.  
     - *Secret harmless breach*: A defender would say no obligation if the promisor rejects the practice *before* acting—even secretly—since the practice’s authority is conditional on endorsement.  

  2. **Leaf 3 (Directed, Practice-Dependent, No Intention, Released by Rejection)**:  
     - *Diagnosis*: Coherent but unattractive. If words alone bind without intent, allowing release by rejection undermines stability. No major defender.  
     - *Secret harmless breach*: Obligation exists until rejection, but if rejected, breach is permitted (even if secret) since the practice no longer binds.  

  3. **Leaf 5 (Impersonal, Practice-Dependent, Intention Required, Released by Rejection)**:  
     - *Diagnosis*: Coherent but utility-undermining. Rule-utilitarianism typically rejects unilateral release (Leaf 6).  
     - *Secret harmless breach*: If the promisor rejects the practice, breach is allowed (utility isn’t harmed secretly).  

  4. **Leaf 7 (Impersonal, Practice-Dependent, No Intention, Released by Rejection)**:  
     - *Diagnosis*: Incoherent. If obligation stems from social utility and doesn’t require intent, rejection shouldn’t override it (utility demands consistency).  
     - *Secret harmless breach*: N/A (incoherent).  

  5. **Leaf 12 (Self-Regarding Duty)**:  
     - *Diagnosis*: Coherent but unmotivated. Promising naturally involves a promisee; few deny directedness for authority-based views.  
     - *Secret harmless breach*: Obligation binds (it’s about the promisor’s integrity), but the promisee has no claim.  

  6. **Leaf 13 (Directed Impersonal)**:  
     - *Diagnosis*: Coherent but undeveloped. Impersonal values (e.g., fidelity) struggle to explain *directed* duties.  
     - *Secret harmless breach*: Obligation exists (fidelity matters), and the promisee holds a claim (they can waive it).  

  ---

  ### **Notes**  
  - **Range Constraint**: 14 leaves required fusing Rawls/Searle (Leaf 2) and rule-utilitarian variants (Leaves 6/8), but these share core commitments.  
  - **Key Cases Handled**:  
    - *Desert-island pair*: Practice-dependent views (Leaves 1–8) deny obligation; practice-independent (Leaves 9–14) allow it.  
    - *Secret harmless breach*: Reliance/assurance views (Leaf 9/10) deny obligation; others (e.g., Leaves 11/14) affirm it.  
    - *Content-independence*: Tested by Q1 (practice-independent) + Q5 (grounds); only reliance/assurance (Leaf 9/10) are content-*dependent*.  
    - *Release/death/forgetting*: Directed views (Leaves 1–4, 9, 11, 13) allow waiver; others do not.  
    - *Conflicting goods*: All leaves treat obligation as pro tanto (overrideable), except rigid practice-dependent views (e.g., Leaf 4/8).  
  - **Tree Logic**: Paths reflect logical dependencies (e.g., directedness implies waivability; practice-dependence invites release questions).  

  This tree isolates why the "practice conception" (Leaves 2/4/6/8) doesn’t subsume alternatives: Practice-independent views (Leaves 9–14) bypass social practices entirely, and even within practice-dependence, intention/release conditions split the terrain. Use the desert-island and secret-promise cases to pressure practice-dependent views, and content-independence tests to challenge reliance-based accounts.
