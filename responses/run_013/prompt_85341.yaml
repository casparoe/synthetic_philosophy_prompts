prompt: |-
  I sit on the algorithmic accountability board for our state's unemployment-insurance agency. We have a model that drafts eligibility determinations for caseworkers, who review and sign off, and at our meeting on the 14th the board has to pick the audit regime for the next fiscal year. I have to circulate a written recomendation beforehand, so I need you to draft it.

  Here's the choice. Option A, outcome-based: each quarter we sample final determinations, score them against what happened on appeal, and pay the vendor a bonus tied to how many match. Option B, process-based: we score the file itself -- did the rationale name the governing rule, was the model's uncertainty surfaced, did the caseworker record a reason for overriding -- and the bonus rides on those scores. We ran both over the same six months of backlog. Under B, checklist compliance went from about 60% to 95% and the reversal rate didn't budge at all. Under A, reversals fell on the ordinary cases but rose on the disability-verification class, where it turned out the model was matching the appeals label for the wrong reason and collapses the moment the intake form changes. Two things the board keeps talking past each other about. First, the rationales in the file are written after the decision is already made -- the vendor's own engineer called it "trace laundering" in a message that got forwarded to us -- so when we audit "process" we aren't watching the reasoning, we're watching a plausible story about the reasoning. Second, the appeal outcomes we'd use as ground truth in A are produced by human reviewers who, it turns out, mostly defer to the file we're supposedly grading them against, so the label is downstream of the process.

  Draft the memo. Give me an actual bottom line -- A, B, or a specific hybrid, with a time frame and a trigger for revisiting it -- not a framework, and reasons the vendor and the dissenting board members can respond to rather than just restatements of the two positions. Take the strongest case for whichever option you reject seriously enough that its supporters don't feel railroaded. Finish by telling me plainly which single feature of this setup is doing the most work in your argument and what happens to your recommendation if that feature weren't there. No citations needed, and keep it short enough that I can read it out loud in ten minutes.
reasoning: |-
  Okay, the user is on an algorithmic accountability board for a state unemployment insurance agency. They need to draft a recommendation memo for an audit regime between two options: outcome-based (Option A) or process-based (Option B). The board meeting is on the 14th, so this is time-sensitive.

  First, let's unpack the key differences between the options based on the user's details. Option A focuses on outcomes by sampling final determinations and comparing them to appeal results. The bonus depends on how many match. The test showed reversals decreased in ordinary cases but increased in disability-verification cases because the model was matching appeals labels for wrong reasons and is fragile to form changes. Option B audits the file for process compliance—like whether the rationale named the governing rule, surfaced uncertainty, or recorded override reasons. During testing, compliance jumped to 95% but reversal rates didn't change. 

  The user points out two critical flaws the board keeps missing. First, the rationales are written after the decision is made (termed "trace laundering" by a vendor engineer), so process audits just check stories, not actual reasoning. Second, in Option A, human reviewers defer to the existing file, making appeal outcomes circular—they're influenced by the very process being audited.

  I need to recommend A, B, or a hybrid. The hybrid seems best. Option B's high compliance doesn't translate to better outcomes, and it's vulnerable to gaming through post-hoc rationalizations. Option A has a critical weakness in the disability-verification class and relies on appeals that aren't independent. 

  A smart hybrid would start with Option A but exclude the problematic disability class initially. For that class, implement Option B as a temporary measure while diagnosing the model's flaws. Set a three-quarter timeline with a trigger: if disability reversals don't improve after form changes or model fixes, reconsider. This addresses immediate risks while targeting real outcomes.

  The strongest case for Option B is that it enforces documentation discipline, which could improve transparency and accountability. I should acknowledge that to avoid alienating supporters. But the core issue is that compliance doesn't equal correctness, as shown by unchanged reversal rates.

  The single most important feature is the circularity in Option A's ground truth—appeals being influenced by the audited files. If that weren't an issue, pure outcome auditing would be stronger. But since it is, the hybrid mitigates by focusing on independent outcome signals where possible and using process checks only as a stopgap in flawed areas.

  Finally, the memo needs to be concise—readable in ten minutes—with a clear bottom line: hybrid approach, specific time frame, and trigger. Make sure the reasoning is balanced so dissenters feel heard but the solution is pragmatic.
answer: |-
  **MEMORANDUM**  
  **TO:** Algorithmic Accountability Board, State Unemployment Insurance Agency  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommended Audit Regime for Model Accountability (FY25)  

  ### Recommendation  
  **Adopt a modified Option A (outcome-based) audit regime for the next three quarters, but exclude disability-verification cases from the bonus metric. For disability cases, implement Option B (process-based) temporarily while commissioning an urgent diagnostic review of the model’s flaws. Revisit the full approach after Q3 if disability reversals remain elevated post-review.**  

  ### Rationale  
  1. **Option B’s Compliance Gains Are Superficial**  
     While B raised checklist scores to 95%, reversal rates stayed flat. This aligns with evidence that post-hoc rationalizations (“trace laundering”) create plausible paperwork without improving decisions. Auditing these rationalizations rewards theater, not rigor.  

  2. **Option A’s Outcome Focus Is Flawed but Fixable**  
     A reduced reversals in ordinary cases—proving it can drive meaningful improvement where the model is stable. Its failure in disability cases stems from a *specific, isolable flaw* (matching appeals labels for wrong reasons), not a universal weakness. Removing these cases from the bonus calculation mitigates risk while preserving incentives for improvement elsewhere.  

  3. **The Circularity of Appeals Demands Narrow Targeting**  
     Human reviewers’ deference to existing files undermines Option A’s validity *as a universal measure*. However, in ordinary cases where the model isn’t pathologically flawed, appeals still reflect *some* independent judgment. By excluding disability cases—where circularity is most dangerous—we retain A’s upside while quarantining its weakness.  

  ### Addressing the Strongest Case for Option B  
  Proponents rightly argue that process audits enforce discipline and transparency, creating a record for oversight. This is valid—hence our temporary use of B for disability cases as a stopgap. But B’s failure to reduce reversals proves it cannot ensure *correctness*. Documentation without accountability for outcomes is performative.  

  ### Critical Feature Driving This Recommendation  
  **The model’s instability in disability-verification cases** is the linchpin. If disability reversals hadn’t spiked under Option A, I would recommend pure outcome-based auditing. *If this instability were absent*, Option A would be clearly superior.  

  ### Next Steps  
  - **Immediately exempt disability cases** from Option A’s bonus structure; audit them via Option B until Q3.  
  - **Require the vendor to diagnose and fix** the disability-model flaw by Q2, with penalties for delay.  
  - **Trigger for Q3 Review**: If disability reversals under B do not fall after model fixes (or ordinary-case reversals under A rise), we pivot to a new framework.  

  This hybrid targets real outcomes where possible, contains known risks, and forces action on the model’s weakest link—without accepting empty compliance as success.  

  // End //  

  *(Reading time: ~8 minutes)*
