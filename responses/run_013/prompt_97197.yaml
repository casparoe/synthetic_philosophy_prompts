prompt: |-
  Please draft the joint statement of an adversarial collaboration between two readings of Buddhist ethics that have been talking past each other in my reading group. The first position holds that Buddhist ethics is best understood as a form of consequentialism: the criterion of right action is the promotion of welfare and the reduction of suffering, and the precepts are defeasible rules of thumb whose authority derives from their consequences. The second holds that Buddhist ethics is a virtue ethics: what is fundamental is the cultivation of a transformed character, the precepts express the conduct of one who is already skilled rather than instruments for producing outcomes, and consequences serve at most as a diagnostic sign rather than as the standard of rightness. Neither party is a specialist in the other's framing, and neither will accept a settlement that quietly treats its own reading as the merely edifying version of the other.

  Produce the document they could both put their names to. It should contain, in order:

  1. A numbered section of claims both accept, covering what the early discourses and the later commentarial and Mahāyāna materials are actually committed to, what the labels consequentialist and virtue-ethicist are doing in this dispute, and which questions the texts leave underdetermined. These claims must be substantive; an agreement that survives only because it says nothing is worthless.

  2. A precise statement of each residual disagreement, each written in wording that the side it belongs to would itself endorse, so that neither position is refuted merely by the phrasing of its own statement.

  3. The cruxes, that is, the sub-questions such that settling one would move at least one side. At a minimum, address whether the good to be promoted is welfare or liberation, whether karma functions as a consequentialist feedback mechanism or as a virtue-theoretic one, whether the precepts are absolute or defeasible, and whether a consequentialist reading can be coherent at all given that Buddhism denies a self to whom aggregated welfare could belong.

  4. For each crux, a case or argument that both sides agree bears on it, with each side's prediction recorded in advance. They should agree that the story of the ship's captain, familiar from the Mahāyāna literature on skilful means, who kills a would-be murderer in order to save his passengers, bears on the defeasibility crux; and they should construct at least one further case in which an act maximises welfare but issues from a corrupt motive.

  5. A short section on which parts of the dispute are merely verbal and why, including whether the apparent disagreement over the role of intention is one of substance or of terminology.

  Where the vocabulary of the debate is itself contested, whether that is the term consequentialism, virtue, intention, welfare or skilfulness, say so and propose a neutral formulation. Note in particular whether Buddhist consequentialism, if it is true at all, could be maximising rather than satisficing, given that the soteriological goal looks like a threshold to be crossed rather than a quantity to be increased.
reasoning: |-
  We are drafting a joint statement for two parties in a reading group who hold different views on Buddhist ethics: one as consequentialist, the other as virtue-ethical. The statement must have the following sections:

  1. Common ground: substantive claims both accept, covering:
     - What the early discourses and later materials are committed to.
     - The role of the labels "consequentialist" and "virtue-ethicist" in the dispute.
     - Which questions the texts leave underdetermined.

  2. Residual disagreements: each stated in wording that the respective side would endorse.

  3. Cruxes: sub-questions that would move at least one side if settled. Specifically:
     - Whether the good to be promoted is welfare or liberation.
     - Whether karma functions as a consequentialist feedback mechanism or a virtue-theoretic one.
     - Whether the precepts are absolute or defeasible.
     - Whether a consequentialist reading is coherent given the no-self doctrine.

  4. For each crux, a case or argument that both sides agree bears on it, with each side's prediction recorded in advance:
     - For defeasibility: the story of the ship's captain (from Mahāyāna skilful means).
     - Construct at least one further case: an act that maximizes welfare but issues from a corrupt motive.

  5. Short section on verbal disputes, including the role of intention.

  Vocabulary note: We must be cautious with terms like "consequentialism", "virtue", "intention", "welfare", "skilfulness". Propose neutral formulations where needed. Also note: if Buddhist consequentialism exists, could it be maximizing given the soteriological goal is a threshold?

  Let's structure the statement accordingly.

  ---

  **Joint Statement on the Nature of Buddhist Ethics**

  **1. Common Ground**

  Both parties agree on the following substantive points:

  a. **Textual Commitments**: The early discourses (Pāli Nikāyas and their parallels) and the later commentarial and Mahāyāna materials are committed to the following:
     - The centrality of the Four Noble Truths, especially the truth of the cessation of suffering (dukkha nirodha) as the ultimate good.
     - The importance of ethical conduct (sīla) as foundational to the path, alongside meditation (samādhi) and wisdom (paññā).
     - The role of intention (cetanā) as the criterion of karmic quality, as stated in the Aṅguttara Nikāya (AN 6.63): "Intention, I say, is kamma."
     - The doctrine of no-self (anattā) as a fundamental teaching that shapes ethical considerations.
     - The existence of precepts (sīla) as guidelines for lay and monastic life, which are presented as training rules.
     - The Mahāyāna principle of skilful means (upāya-kauśalya), which allows for flexibility in applying ethical norms to benefit beings.

  b. **Role of the Labels**: The terms "consequentialist" and "virtue-ethicist" are used in this dispute as heuristic frames to capture distinct emphases found in the tradition. They are not anachronistic impositions but serve to highlight:
     - How the tradition evaluates actions: by their consequences (especially suffering-reduction) or by their expression of virtues (like compassion, wisdom).
     - The status of precepts: as instrumental (rules of thumb) or as constitutive (expressions of an awakened mind).

  c. **Underdetermined Questions**: The texts leave open:
     - Whether the reduction of suffering (welfare) is the sole criterion for right action, or whether the cultivation of virtues is an independent criterion.
     - The precise relationship between rules and their exceptions: while the texts acknowledge exceptions (e.g., in cases of skilful means), they do not provide a systematic meta-ethical theory for when exceptions apply.
     - Whether the ultimate goal (nirvāṇa) is a state of welfare (and thus a consequence to be maximized) or a state of virtue (the perfection of character).

  **2. Residual Disagreements**

  Each party maintains its core position, stated in its own terms:

  a. **Consequentialist Reading**: Buddhist ethics is fundamentally about the consequences of actions, particularly the reduction of suffering and promotion of well-being (welfare). The precepts are reliable guides to achieving these ends but are defeasible when adherence would cause greater harm. The authority of the precepts is derived solely from their tendency to produce good outcomes.

  b. **Virtue-Ethicist Reading**: Buddhist ethics is fundamentally about the cultivation of virtues (such as non-attachment, compassion, and wisdom) that constitute the path to awakening. The precepts express the conduct of one who has developed these virtues and serve as training rules to shape character. Consequences are secondary; the primary focus is on the agent's state of mind and the intrinsic quality of the action as an expression of virtue.

  **3. Cruxes**

  The following sub-questions, if resolved, would advance the debate:

  a. **The Nature of the Good**: Is the ultimate good to be promoted welfare (understood as the reduction of suffering and promotion of well-being) or liberation (the state of nirvāṇa, characterized by the eradication of defilements and the perfection of virtue)?

  b. **Karmic Mechanism**: Does karma function as a consequentialist feedback mechanism (where actions are judged by their consequences, and karmic results are the natural outcomes of the welfare or harm produced) or as a virtue-theoretic one (where karma reflects the quality of the agent's intention and character, with results tied to the moral state of the mind)?

  c. **Defeasibility of Precepts**: Are the precepts absolute (admitting no exception because they express the virtuous mind) or defeasible (overridden when following them would lead to worse consequences)?

  d. **Coherence of Consequentialism without a Self**: Can a consequentialist reading be coherent given that Buddhism denies a self? Specifically, if there is no self, then for whom is welfare aggregated? Does this undermine the very idea of maximizing aggregate welfare?

  **4. Test Cases and Predictions**

  a. **The Ship Captain Case (from Mahāyāna literature)**: A ship captain kills a would-be murderer to prevent the murderer from killing 500 passengers. Both sides agree this bears on the defeasibility crux (3c).
     - **Consequentialist Prediction**: The captain's action is justified because it minimizes overall suffering (saving 500 lives at the cost of one, and preventing the murderer from accruing negative karma). This shows the precept against killing is defeasible.
     - **Virtue-Ethicist Prediction**: The captain's action, though motivated by compassion, is still karmically negative because it violates the precept and arises from a mind that is not fully purified (the Buddha alone could perform such an act without karmic residue). The precept is not defeasible; rather, the captain's compassionate intention mitigates the karmic weight but does not make the act intrinsically right.

  b. **The Corrupt Almsgiver Case**: An almsgiver donates generously to monks but does so solely to gain fame and social status, with no genuine compassion or virtue. The act promotes welfare (monks are fed, the donor's reputation encourages others to give) but issues from a corrupt motive.
     - **Consequentialist Prediction**: The act is still good (or at least permissible) because it increases welfare, regardless of motive. The karmic result for the donor may be mixed (due to the bad intention), but the act itself is beneficial.
     - **Virtue-Ethicist Prediction**: The act is not truly virtuous because it lacks the right intention (cetanā) and does not cultivate virtue in the agent. It may have good consequences, but it is not an expression of a virtuous character and thus is not karmically wholesome.

  **5. Verbal Disputes**

  Some disagreements are merely verbal:

  a. **The Role of Intention**: Both sides agree that intention is crucial in Buddhist ethics. The dispute is not over whether intention matters but over its role. The consequentialist sees intention as affecting the consequences (e.g., an act done with bad intention may have worse long-term karmic effects), while the virtue-ethicist sees intention as defining the act's intrinsic moral quality. This is a substantive disagreement, not merely verbal.

  b. **The Term "Welfare"**: The virtue-ethicist party uses "welfare" to mean ordinary well-being (which is not the ultimate goal), while the consequentialist party uses it to include the path to liberation. This leads to confusion. We propose using "suffering-reduction" for the ordinary sense and "ultimate good" for nirvāṇa.

  c. **Skilfulness (kusala)**: Both sides agree that "skilful" actions lead to good results and are rooted in non-greed, non-hatred, and non-delusion. However, the consequentialist interprets "good results" as welfare consequences, while the virtue-ethicist interprets them as expressions of virtue. This is a substantive difference.

  d. **Consequentialism: Maximizing vs. Satisficing**: Given that nirvāṇa is a threshold (not an incremental good), Buddhist consequentialism, if it exists, would likely be satisficing (aiming to achieve the threshold of liberation) rather than maximizing (endlessly increasing welfare). However, the virtue-ethicist notes that the path involves cultivating virtues to a degree sufficient for awakening, which also resembles satisficing. This point might be verbal if both agree the goal is threshold-based.

  ---

  By signing, both parties affirm that this document accurately represents their common ground, disagreements, and the cruxes to be explored.

  [Signatures]
answer: |-
  ### Joint Statement on Buddhist Ethics: Adversarial Collaboration  

  **Preamble**  
  We, the undersigned, affirm that Buddhist ethics is unified in its soteriological aim—the cessation of *dukkha* (suffering) and the realization of awakening (*bodhi*). Yet we diverge in interpreting its meta-ethical structure. Position One (Consequentialist Reading) holds that Buddhist ethics evaluates actions by their consequences: the reduction of suffering and promotion of welfare. Position Two (Virtue-Ethicist Reading) holds that ethics centers on character transformation, where actions express virtues cultivated through the path. This document clarifies our agreements, disagreements, and the cruxes requiring resolution. We use "welfare" neutrally for *sukha* (well-being) and *hita* (benefit), "virtue" for *sīla* (ethical conduct) and *brahmavihāra* (sublime attitudes), and "intention" for *cetanā*. "Consequentialism" denotes theories where outcomes determine rightness; "virtue ethics" denotes theories where character and intrinsic action qualities are primary.  

  ---

  ### 1. Common Ground: Substantive Agreements  
  Both parties accept the following, grounded in early discourses (e.g., Pāli Nikāyas/Āgamas) and later Mahāyāna/commentarial texts:  

  1.1 **Textual Commitments**:  
     - **Suffering and its Cessation as Central**: The Four Noble Truths establish *dukkha*’s cessation as the goal. All practices, including precepts (*sīla*), are oriented toward this end.  
     - **Intention (*Cetanā*) as Karmically Decisive**: *Cetanā* determines karmic quality (Aṅguttara Nikāya 6.63), but its role in *evaluating* acts is underdetermined: is it a virtue-theoretic marker of character or a consequentialist lever for outcomes?  
     - **Precepts as Training Rules**: The Five Precepts are foundational for lay and monastic life, yet their application in the suttas shows contextual sensitivity (e.g., exceptions for monastics’ medicinal rules).  
     - **No-Self (*Anattā*) Ethics**: Ethics operates without a metaphysical self. Actions impact interdependent streams of experience, but whether "welfare" aggregates across streams is unresolved.  
     - **Skilful Means (*Upāya-kauśalya*) in Mahāyāna**: Acts violating precepts (e.g., lying) are permissible if they aid beings’ welfare or progress toward liberation (e.g., *Lotus Sūtra*). This implies ethical flexibility but does not prescribe a meta-ethical framework.  

  1.2 **Role of Labels**:  
     - "Consequentialism" and "virtue ethics" are hermeneutic tools for organizing textual evidence, not claims about the Buddha’s explicit theory.  
     - Both frames acknowledge the Eightfold Path’s non-duality: wisdom (*paññā*) and ethics (*sīla*) are co-dependent.  

  1.3 **Underdetermined Questions**:  
     - **The "Good"**: Texts do not specify whether welfare (*sukha*) and liberation (*nibbāna*) are distinct or continuous. Is *nibbāna* a consequence (cessation of *dukkha*) or a virtue (perfected mind-state)?  
     - **Precepts’ Authority**: Are precepts intrinsically right (expressing virtues) or extrinsically justified (by consequences)? Texts describe them as "noble" (*ariya*) but also as aids to "non-remorse" and concentration (MN 61).  
     - **Karma’s Mechanism**: Karma is intention-dependent and result-bearing, but it is unclear whether results track welfare consequences (e.g., suffering caused) or the virtue/vice of the act itself.  

  ---

  ### 2. Residual Disagreements  
  Each position’s core claim, stated in its own terms:  

  2.1 **Position One (Consequentialist Reading)**:  
  > "Buddhist ethics holds that an action is right if it promotes welfare (reduction of suffering and cultivation of well-being) for sentient beings. Precepts are defeasible guides grounded in their empirical tendency to produce these consequences. Liberation (*nibbāna*) is the ultimate welfare state, and the path is instrumental to its realization."  

  2.2 **Position Two (Virtue-Ethicist Reading)**:  
  > "Buddhist ethics holds that an action is right if it expresses or cultivates virtues (e.g., non-attachment, compassion, wisdom) in an agent’s character. Precepts are non-defeasible expressions of a purified mind. Consequences serve only as diagnostic signs of virtue, not as the standard of rightness. Liberation is the perfection of virtue, not an outcome to be maximized."  

  ---

  ### 3. Cruxes  
  Settling these sub-questions would resolve key disagreements:  

  3.1 **Nature of the Good**:  
     - Is the goal welfare (e.g., *dukkha*’s reduction) or liberation (e.g., the unconditioned *nibbāna*)?  

  3.2 **Karma’s Function**:  
     - Does karma operate as a consequentialist feedback mechanism (e.g., bad results from harmful *outcomes*) or a virtue-theoretic one (e.g., bad results from unwholesome *intentions*, regardless of outcomes)?  

  3.3 **Defeasibility of Precepts**:  
     - Are precepts absolute (admitting no exceptions) or defeasible (overridden when following them increases suffering)?  

  3.4 **No-Self and Aggregation**:  
     - Can consequentialism cohere with *anattā*? If there is no self, can "aggregate welfare" hold meaning, or is ethics necessarily agent-centered?  

  ---

  ### 4. Test Cases and Predictions  
  Both sides agree these cases bear on the cruxes, with predictions recorded:  

  4.1 **Case 1: The Ship’s Captain (Mahāyāna Skilful Means)**  
     - **Scenario**: A captain kills a would-be murderer to save 500 passengers (*Upāyakauśalya Sūtra*).  
     - **Bears on**: Defeasibility of precepts (Crux 3.3).  
     - **Consequentialist Prediction**: The act is justified because it minimizes net suffering (saves lives; prevents the murderer’s heavy karma). Precepts are defeasible.  
     - **Virtue-Ethicist Prediction**: The act is not fully "right"—it violates the precept and reflects the captain’s incomplete virtue (only a Buddha could act purely here). Precepts express ideal conduct and are non-defeasible; mitigating factors (e.g., compassion) reduce karmic weight but do not justify exception.  

  4.2 **Case 2: The Corrupt Almsgiver**  
     - **Scenario**: A politician donates to monasteries solely to gain power, foreseeing that his act will inspire widespread charity and reduce suffering.  
     - **Bears on**: Role of intention vs. consequences (Crux 3.2) and the Good (Crux 3.1).  
     - **Consequentialist Prediction**: The act is right because it increases welfare. The bad intention affects the politician’s karma but does not negate the act’s rightness.  
     - **Virtue-Ethicist Prediction**: The act is wrong because it issues from greed, not virtue. Good consequences are incidental; the act erodes character and is karmically unwholesome.  

  ---

  ### 5. Verbal Disputes  
  Some disagreements dissolve under clarification:  

  5.1 **Intention (*Cetanā*)**:  
     - Both agree intention is karmically central. The dispute is *substantive*:  
       - Consequentialists see intention as affecting consequences (e.g., ill will worsens outcomes).  
       - Virtue ethicists see intention as defining the act’s character.  
     - **Resolution**: Use "volitional quality" for *cetanā* neutrally, separating it from outcome-dependence.  

  5.2 **"Skilful" (*Kusala*)**:  
     - **Verbal dispute**: Consequentialists equate "skilful" with "welfare-promoting." Virtue ethicists equate it with "virtue-expressing."  
     - **Neutral formulation**: "Kusala denotes acts rooted in non-greed, non-hatred, and non-delusion, which are conducive to the path."  

  5.3 **Consequentialism: Maximizing vs. Satisficing**:  
     - **Verbal dispute**: Nirvāṇa is a threshold, not a quantity. Thus, Buddhist consequentialism (if any) must be *satisficing* (seeking "enough" welfare to cross the threshold) or *goal-oriented* (prioritizing liberation), not maximizing.  
     - **Agreement**: Both sides accept that the path has stages (e.g., ordinary welfare → liberation), but Position One sees this as instrumental (welfare aids progress), while Position Two sees it as developmental (virtues mature toward awakening).  

  ---  
  **Signed**,  
  [Representative of Position One: Consequentialist Reading]  
  [Representative of Position Two: Virtue-Ethicist Reading]  

  ---  
  **Note**: This statement does not resolve the disagreements but frames them rigorously. Progress requires joint study of karma’s mechanics, *anattā*’s ethical implications, and edge cases in the commentaries.
