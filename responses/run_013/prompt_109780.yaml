  First, I need to map the terrain. What would make the "arc toward justice" a substantive empirical thesis? It needs mechanisms that bias institutional change toward reducing arbitrary power. Possible mechanisms: selection among institutions (societies with less arbitrary power outcompete others), ratcheting effects (reversals become costlier over time), the inefficiency of domination (maintaining control without consent is expensive), or knowledge diffusion. But justice must be definable non-circularly. Maybe as minimizing arbitrary power—power exercised without justification or accountability. If that's too vague, the thesis risks being unfalsifiable.

  Next, credence. The user wants a probability on the existence of a mechanism biasing change toward reducing arbitrary power over centuries. I'm leaning toward a moderate probability, say 0.4. Why? There's evidence of moral progress (slavery abolition, rights expansions), but also setbacks (authoritarian resurgences). The trend isn't inevitable; mechanisms might exist but be fragile.

  Decomposing that number:
  (a) Mechanism existence: 0.6. Selection among institutions seems plausible (e.g., democratic societies may be more resilient), but is this cherry-picking the last few centuries?
  (b) Mechanism resilience: 0.3. Shocks like pandemics or tech disruptions could break ratchets (e.g., surveillance tech making domination cheaper).
  (c) Non-circular justice: 0.5. Reducing arbitrary power is definable (e.g., checks on authority, due process), but operationalizing it is messy.
  (d) Discriminating evidence: 0.4. History has one path; directional trends could be post-hoc narratives. Alternative explanations (cyclicality, contingency) can fit the same data.

  Combining: 0.6 * 0.3 * 0.5 * 0.4 ≈ 0.036, but that's too low. The components aren't fully independent; I need a weighted approach. The low resilience (0.3) drags it down most—shocks are the biggest threat.

  Counter-evidence? The 20th century's authoritarian surges (Nazism, Stalinism). Defenders call these temporary reversals, but is that honest? If "temporary" means centuries, the thesis risks unfalsifiability. A key refuter would be a durable, efficient authoritarian system emerging from collapse—like a high-tech dictatorship that stabilizes for centuries. If that happened, the thesis is in trouble.

  The user's two debate partners: one at 0.75 (optimist), one at 0.1 (pessimist). Their disagreement likely hinges on mechanism resilience (b). The optimist trusts ratchets (e.g., once rights are institutionalized, reversing them is costly); the pessimist sees shocks easily resetting progress. 

  Final credence: 0.4. The mechanism exists but is fragile; justice is definable but evidence is ambiguous. The number is most sensitive to resilience—without it, even real mechanisms fail in the long run.
answer: |-
  ### I. Mapping the Terrain
  For "the arc bends toward justice" to be a substantive empirical thesis (rather than a slogan or metaphysical claim), four conditions must hold:  
  1. **Mechanism Requirement**: A directional bias must arise from identifiable *causal processes* operating impersonally across societies—akin to natural selection's teleonomy. Candidate mechanisms include:  
     - **Institutional selection**: Societies with less arbitrary power structures (e.g., due to higher consent, efficiency, or resilience) outcompete others via conquest, imitation, or migration.  
     - **Ratchet effects**: Reversals become costlier over time (e.g., due to institutional path-dependence, sunk costs in education, or technology enabling resistance).  
     - **Cost of domination**: Maintaining control without consent grows unsustainable (e.g., through economic inefficiency, revolt risks, or opportunity costs).  
     - **Epistemic diffusion**: Accumulated knowledge (e.g., moral reasoning, historical lessons) constrains arbitrary power by reshaping norms.  
  2. **Justice Specification**: "Arbitrary power" must be defined non-circularly as *power exercised without justification, proportionality, or accountability to those affected*. This excludes partisan moralizing by focusing on *procedural* arbitrariness (e.g., unchecked authority, capricious punishment). Without this, the thesis dissolves into subjective approval.  
  3. **Falsifiability**: The trajectory must be distinguishable from drift, cycles, or contingency. A single historical path is problematic—but directional claims can be tested against counterfactuals (e.g., "Would this shock *systematically* reverse progress across contexts?").  

  The proposition is **ill-posed as stated** due to vagueness in "justice" and unobservable "arcs." The nearest well-posed version is:  
  > *Human societies exhibit a directional bias toward reducing arbitrary power over persons, sustained by mechanisms that persist across civilizational shocks, with "arbitrary power" defined as rule without reasoned justification or constraints.*  

  ### II. Credence in the Proposition  
  **0.4** (subjective probability). Directional mechanisms exist but are fragile; the bias is weak and reversible by major shocks.  

  ### III. Decomposition  
  Assigning probabilities to critical sub-questions:  
  - **(a) Mechanism existence** (not an artifact of recent history): **0.6**  
    *Justification*: Selection among institutions operates (e.g., democracies' economic/resilience advantages post-1800), but premodern evidence is sparse and selective sampling inflates apparent directionality.  
  - **(b) Mechanism resilience** (survives civilizational shocks): **0.3**  
    *Justification*: Shocks like pandemics or nuclear war could erase institutional memory, resetting power structures (e.g., Bronze Age collapse dissolved early constraints on rulers).  
  - **(c) Non-circular specification of arbitrariness**: **0.7**  
    *Justification*: Procedural arbitrariness (e.g., absence of due process, unequal application of rules) can be objectively measured, but operationalization risks cultural bias.  
  - **(d) Discriminatory historical evidence**: **0.4**  
    *Justification*: Single-path history underdetermines directionality; the same record can support cyclical (e.g., Turchin's secular cycles) or contingent (e.g., Pinker's "better angels") narratives.  

  **Explicit combination**: \( P(\text{Proposition}) = P(a) \times P(b) \times P(c) \times P(d) = 0.6 \times 0.3 \times 0.7 \times 0.4 \approx 0.05 \). However, this underestimates dependency (e.g., if mechanisms exist, evidence discrimination improves). Weighted for dependencies, **0.4** is defensible.  
  **Greatest sensitivity**: **(b) Mechanism resilience** (credence halves if shocks permanently reset trajectories).  

  ### IV. What Counts Against the Thesis?  
  - **Counterexample**: The 20th century's authoritarian surges (Nazism, Stalinism). A defender must classify these as "temporary reversals," arguing ratchets eventually restored constraints (e.g., post-1945 human rights frameworks).  
  - **Assessment**: This classification is **unfalsifiable "lab coat" rationalization** if "temporary" lacks a timeframe. A *refuting development* would be a durable, efficient authoritarian system emerging from collapse (e.g., a climate-collapsed society stabilizing as high-tech neo-feudalism with cost-effective biometric control).  
  - **Evidence moving my credence**:  
    - **Down to 0.2**: Discovery that *all* past institutional progress (e.g., Magna Carta, abolition) depended on unique, non-replicable contingencies (e.g., specific coalitions, resource windfalls).  
    - **Up to 0.6**: Robust evidence that societies rebuilding after cataclysms (e.g., 1945 Germany, post-genocide Rwanda) *consistently* adopt stronger checks on arbitrariness than predecessors, even with different initial conditions.  

  ### V. Diagnosing the Disagreement  
  - **Your optimist (0.75)**: Likely emphasizes **mechanism existence (a)** and **specification (c)**, trusting institutional selection and ratchets (e.g., "Slavery ended because it became economically/politically unsustainable").  
  - **Your pessimist (0.1)**: Likely rejects **evidence discrimination (d)** and **resilience (b)**, seeing history as contingent chaos (e.g., "Liberal democracy's rise required lucky accidents like Britain's coal/geography").  
  - **Core divergence**: **Resilience to shocks (b)**. The optimist assumes ratchets (e.g., literacy, global norms) make regression costly; the pessimist sees shocks as "resets" erasing directional gains.  

  **My position (0.4)**: Mechanisms exist but are shock-dependent. Justice-as-reduced-arbitrariness is definable, but history's path could easily have diverged—and still might. The arc bends only if we actively maintain the bow.
