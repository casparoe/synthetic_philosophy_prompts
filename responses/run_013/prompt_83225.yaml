answer: |-
  ## Speech: The Weight in This Room

  **(Delivered with measured clarity, respecting the space)**

  Ladies and gentlemen, colleagues, honoured guests, and most importantly, members of our survivor community – without whose courage and insistence we would not be standing in this resonant space today…

  We gather beneath the weight of history, in the very halls where the unprecedented became real. The Nuremberg Judgment wasn’t just a verdict; it was a declaration that certain acts, committed by a state against its own people and against the peace of the world, demanded accounting. An accounting *somewhere*, and *somehow*.

  But for eighty years, a phrase has shadowed this legacy: "Victors' Justice." It’s often spoken as a single, damning indictment. I believe that phrase bundles together two profoundly *different* criticisms, and we do the complexity of this history a disservice if we don’t hold them apart.

  **The first criticism is about law itself – retroactivity.** The London Charter, drafted by the Allies in the summer of 1945, defined new crimes: Crimes Against Peace, Crimes Against Humanity. It then applied them to acts stretching back years before the Charter existed. The defence argued passionately: *ex post facto*. *Nulla poena sine lege*. No punishment without pre-existing law. It wasn’t a frivolous point.

  How do we answer this? One path leads us to thinkers like Gustav Radbruch – the idea that there exists a floor below which purported "law" becomes so monstrous, so fundamentally unjust, that it ceases to be law at all. The other path argues these crimes *were* already forbidden – woven into the fabric of customary international law, implicit in treaties, inherent in the conscience of humanity. The Tribunal leaned heavily on this latter view. The truth is, serious scholars still debate which justification carries more weight, or whether either fully resolves the tension. The retroactivity charge taps into a deep, legitimate anxiety about law’s predictability and fairness.

  **But the second criticism – selectivity – operates on a completely different plane.** This isn’t primarily about the *law* that was applied; it’s about *who* was brought before it, and *which* acts were scrutinised. The docket was exclusively filled by the losers. There were no charges for the firebombing of Dresden or Tokyo. No charges for the atomic bombings. No reckoning for Soviet actions in Poland or the Baltics. Emperor Hirohito was not indicted. And chillingly, the perpetrators of Japan’s biological warfare program were granted immunity in exchange for their data. Even within the Charter’s own structure, a seam appeared: Crimes Against Humanity were tied to the war, leaving the persecution of German Jews *before* 1939 formally outside the Tribunal’s jurisdiction. That seam, undeniably, fell where it was politically convenient.

  Unlike retroactivity, selectivity isn’t a puzzle with a neat legal solution. It’s a raw, political reality. The honest answer isn’t found in statutes or philosophical arguments. It is, quite simply: *Yes*. The victors chose the accused. They defined the scope. They decided what horrors to prosecute and which to overlook. We did it anyway. Tokyo underscores this profoundly. That trial, often overshadowed, produced a judgment fractured by dissent. Judge Radhabinod Pal dissented entirely, his powerful opinion laying bare the victors’-justice critique not from the dock, but *from the bench itself*. His voice remains an essential, uncomfortable part of the record.

  So, what does this leave us with, eighty years on? If we are honest, we must hold these two strands apart. The retroactivity challenge forces us into the difficult, ongoing conversation about the sources and boundaries of law itself – a conversation vital to the project of international justice, even if its answers are contested. The selectivity charge, however, confronts us with the inescapable human element: the power, the politics, the compromises, and the profound moral discomfort that linger in the wake of even the most necessary judgment.

  Nuremberg established crucial principles. It gave names to unspeakable evils. It created a foundation. But its legacy isn’t a simple monument to the flawless triumph of law. It’s a complex, sometimes contradictory, testament to humanity’s halting, imperfect attempt to reach for justice after the abyss. It reminds us that building a world where law restrains power requires not just legal ingenuity, but unflinching honesty about power's enduring influence *on* the law. That honesty, I believe, is the most fitting tribute we can offer here today. Thank you.

  ---

  **Notes for the Litigator (Blunt Assessment of Consensus/Contention)**

  *   **Retroactivity (The Legal Question):**
      *   **Settled:** The *Tribunal's reasoning* (reliance on pre-existing custom/treaties) is well-documented. The *defence argument* based on strict legality is universally acknowledged as serious.
      *   **Contested/Hotly Debated:** There is **NO** academic consensus on whether the Tribunal's justifications *actually resolve* the retroactivity problem satisfactorily. Scholars are sharply divided:
          *   **Radbruch Thesis Supporters:** Argue the core justification lies in natural law/radical injustice principles – the Nazi regime's laws were fundamentally illegitimate for these crimes. This view is influential but philosophically contested.
          *   **Customary Law Purists:** Argue custom *did* sufficiently criminalise aggressive war and acts like widespread murder/deportation by a state against its own people *before* 1945. Others strongly dispute the evidence for this specific customary status pre-1945.
          *   **Positivists:** Often find the retroactivity problem significant and unresolved by the Tribunal's reasoning. Many see Nuremberg as a necessary *creation* of new law, acknowledging the break from strict legality.
      *   **Bottom Line:** **Do not** present *any* single answer (Radbruch or Custom) as the settled consensus. State the arguments clearly and acknowledge the *ongoing* debate among experts. Saying "scholars continue to wrestle with this foundational question" is accurate and safe.

  *   **Selectivity (The Political Reality):**
      *   **Settled:** The fact of selectivity – prosecuting only Axis crimes, excluding Allied actions (firebombing, A-bombs, Soviet conduct), immunity deals (Unit 731), and the jurisdictional gap for pre-war crimes against German Jews – is **universally acknowledged by historians and legal scholars**. It is not a matter of serious dispute. The *extent* of the Tokyo dissent (Judge Pal) is also well-established fact.
      *   **Contested:** The *moral weight* and *long-term impact* of this selectivity are debated. Some argue it fatally undermined legitimacy; others argue it was a pragmatic necessity for a first step. However, the *fact* of it happening is not contested.
      *   **Bottom Line:** You can state the facts of selectivity bluntly as historical reality ("Yes. The victors chose the accused..."). The "yes, and we did it anyway" framing captures the accepted historical truth. Acknowledging this is not controversial scholarship; it's standard historiography (see works by Bass, Bloxham, Sellars, Cryer).

  *   **Crimes Against Humanity Pre-War Gap:** The specific limitation in the Charter tying Crimes Against Humanity to the war is a **factual point of law** (Article 6c). The Tribunal's application of this, excluding pre-1939 persecution of German Jews *as Crimes Against Humanity under its jurisdiction*, is a matter of **historical/legal record**, not interpretation. This is settled. The *significance* and *fairness* of that limitation are debated, but not the fact that it existed and was applied.

  **Key Takeaway for Delivery:** You can be definitive and factual on **Selectivity** and the **CAH jurisdictional gap**. Be explicitly non-definitive ("scholars debate," "arguments persist") on the **Retroactivity justification**. This accurately reflects the state of scholarship and protects you from claims of misrepresentation in front of the experts.
