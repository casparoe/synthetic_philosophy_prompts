answer: |-
  Here's a straight-to-script mark and feedback, with confidence assessment and flagged uncertainty:

  **Mark: 8/10**

  **Feedback to Paste:**

  1.  **Structure & Clarity (Excellent):** Your prose is exceptionally clear and logically structured. You establish a precise framework early (accuracy vs. entitlement) and stick to it. This makes your argument easy to follow. (+)
  2.  **Core Insight on Standing (Strong):** Your distinction between the *truth* of the accusation (about Tom) and Nadia's *entitlement* to blame (about her own record) is fundamental and correct. This is the crucial groundwork. (+)
  3.  **Blame as Demand (Effective Application):** Correctly identifying blame as not merely reportorial but as a *demand* ("acknowledge the norm and answer for having broken it") is key. You effectively use this view (often associated with Scanlon, Wallace, or Watson) to argue that making such a demand requires the blamer's own commitment to the norm. (+)
  4.  **Hypocrisy Undermines Standing (Convincing):** Your argument that Nadia’s past action (doing the *exact* same thing to Tom) and her dismissal of his complaint ("overreacting") demonstrate her lack of acceptance of the norm is persuasive. This directly undermines her standing to make the *demand* inherent in blame. You rightly note this is a strong case for disqualification under the "standard view" of standing. (+)
  5.  **Public vs. Private (Oversimplified - Minor Deduction):** You correctly state "the same norm is at stake," but dismissing the difference between private and public blame is a slight oversight. Public blame can add elements of humiliation, reputational damage, or mobilizing group pressure, potentially making the *manner* of the hypocrite's blame *more* objectionable or undermining, even if standing is equally absent. (-0.5)
  6.  **Tom's Reason to Change (Spot On):** Excellent point: Tom's reason to stop his conduct stems from the *wrongness of the conduct itself* and his knowledge of it. This reason exists independently of Nadia's standing or character. This effectively answers part (b). (+)
  7.  **No Reason to Answer to Nadia (Correct):** Rightly concludes Tom has no obligation to engage with or answer *Nadia specifically* because her hypocritical stance voids her authority to make the demand on him. (+)
  8.  **The "Thinner Standing" Paradox (Problematic - Major Deduction):** This final move is flawed and contradicts your earlier, stronger reasoning. You state: "the reason Tom should stop... has to come from somewhere: the only candidate is the standing Nadia would need... So I think she must have standing after all, just a thinner version..." This is incorrect and muddles your excellent separation. Tom's reason comes from the *validity of the norm itself* and his own recognition of it, *not* from any standing Nadia possesses. The community, other colleagues, Tom's own conscience, or even a *non-hypocritical* blamer could be the source of the norm's authority. Nadia's hypocrisy means she lacks the standing to be the *enforcer* or *demander* of that norm *from Tom*, but it doesn't negate the norm's existence or its application *to Tom*. This point undermines your otherwise strong argument and creates an unnecessary contradiction. (-1.5)
  9.  **Overall:** A very strong answer demonstrating clear understanding of the core concepts (accuracy vs. standing, blame as demand, hypocrisy) and logical reasoning for most of the response. The major flaw is the final attempt to derive Nadia's "thin standing" from Tom's reason to change, which is unnecessary and incorrect.

  **Confidence in Grade:** **High (85%).** The strengths (points 1-4, 6-7) are clear, well-articulated applications of core concepts. The weaknesses (5 & 8) are identifiable specific missteps. Point 8 is a significant conceptual error, justifying the 2-point deduction.

  **Least Confident Judgement:** The **-0.5 for dismissing the public/private distinction (Point 5)**. While I believe it's a valid minor point (public blame often intensifies the objection to hypocrisy), I'm slightly less certain it *must* be penalized. A strong case can be made that standing is fundamentally about the *relationship* and *authority to demand*, which is equally absent whether done privately or publicly, as you argued. The core issue is her hypocrisy, not the venue. However, the question specifically asks about both contexts, and a truly comprehensive answer *might* briefly acknowledge a potential difference in *degree of aggravation* or *practical effects*, even if standing itself is absent in both cases. I'm confident *enough* it warrants a small deduction for overlooking a nuance explicitly raised in the prompt, but it's the point I'm most open to revisiting.
