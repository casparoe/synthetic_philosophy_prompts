prompt: |-
  I'm a first-time TA for an intro moral philosophy course — the unit on praise and blame — and I've got alot of midterms to get through before marks go in tomorrow morning. There's one answer I keep flip-flopping on, and since the prose is very tidy (I'm a soft grader late at night) I'd rather have a second opinion before I put a number on it. Can you give me a mark out of 10 plus point-by-point comments I can paste straight onto the script? I don't want a general impression — I want to know which sentences are doing real work, which are doing the work of looking like they're doing real work, and what a careful grader would take off for. And tell me how confident you are in the grade, and flag the one judgement in your comments you're least sure about.

  The question said students could skip names, since it's the arguments that matter, and it asked about this case: "Nadia has started calling out her colleague Tom in team meetings for taking credit for other people's work. Two years ago Nadia did the same thing to Tom himself, presenting his analysis as her own in a client meeting; she never apologised, and when Tom raised it she told him he was overreacting. (a) Does Nadia have standing to blame Tom — privately, and in front of the team? (b) Suppose her criticism is accurate and Tom knows it. Does Tom have any reason to change what he does, or to engage with her about it at all? In both parts, say which view of blame you're relying on and what work it's doing."

  Here's the answer I'm stuck on: "Nadia's record matters, but it matters in a different place from the truth of what she says. Whether Tom takes credit for other people's work is a question about Tom, and it doesn't get easier or harder depending on what Nadia did two years ago. So the accusation can be perfectly accurate even if Nadia is the last person entitled to make it — accuracy on one side, entitlement on the other, and I'll keep those apart for the rest of the answer. On entitlement: blaming someone isn't just reporting on them. It's a demand — it asks them to acknowledge the norm and answer for having broken it — and a demand like that has to come from someone who is willing to be held to the same norm, otherwise it isn't a demand, it's a performance. Nadia isn't willing: she did the same thing to Tom and told him he was overreacting when he raised it, which shows she doesn't accept that the norm binds her. So she has no standing here, and since the standard view on standing is that a blamer's own record disqualifies them, it isn't even close — she hasn't just been imperfect, she's done this exact thing to this exact person. Whether she says it in the meeting or over coffee makes no difference; the same norm is at stake either way. But none of that gets Tom off the hook, and this is where I think the case gets interesting. The reason Tom should stop taking credit is that the conduct is wrong and he knows it. That reason would exist if Nadia were a saint, and it exists now that she isn't, so Tom has a reason to change. What he doesn't have is a reason to answer to Nadia — the demand she's making is one she has no business making, so he can say so and leave it there. And actually, if he really does have a reason to change, that reason has to come from somewhere: the only candidate is the standing Nadia would need in order to put him under the norm. So I think she must have standing after all, just a thinner version of it, because otherwise there'd be nothing for Tom to answer to."

  I'll probaly end up giving it a decent mark regardless, but I'd like to know exactly what I'm rewarding.
