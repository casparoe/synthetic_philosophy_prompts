                  = [100 + 178.88 + 309.84 + 253 + 178.88 + 0] / 19 = 1020.6/19 ≈ 53.72
     EU_Z(Type B) = [1*100 + 2*80 + 4*60 + 4*40 + 4*20 + 4*0] / 19
