   For the absent person: 
          EU_V = (30 + 18*51)/19=49.89, EU_X=50 -> prefers X.

   So in sum, X will win.

   In Round 2 without the veil, they might be concerned that in V, one person gets only 30, which is worse than the 50 in X. So they might prefer X to V to protect the worst-off.

   This is the conflict we want.

   So let's set the three distributions as:
     X: all 50 tokens.
     V: 1 position of 30 tokens and 18 positions of 51 tokens.
     Y: as before: 10 positions of 60 tokens and 9 positions of 40 tokens.

   In Round 1, the group is likely to choose between X and Y, and Y might win because its sum is higher.

   In Round 2, without the veil, they might prefer X because it has no one below 50, while V has a 30 and Y has some at 40.

   Specifically, in Y, the worst-off is 40, in V is 30, in X is 50.

   So maximin would rank X > Y > V.

   In Round 1, the sum of expected utilities (19 individuals) for X, V, Y:

     X: 
          Type A: 6 * 70.7 = 424.2
          Type B: 6 * 50 = 300
          Type C: 6 * 25 = 150
          Absent: 50
          Total: 924.2

     V:
          Type A: EU = (1/19)*10*sqrt(30) + (18/19)*10*sqrt(51) = (54.77 + 1285.38)/19 = 1340.15/19 = 70.53 -> for 6 participants: 6*70.53=423.18
          Type B: EU = (30 + 18*51)/19 = 948/19=49.89 -> 6*49.89=299.34
          Type C: EU = (9 + 18*26.01)/19 = (9+468.18)/19=477.18/19=25.11 -> 6*25.11=150.66
          Absent: EU = 49.89
          Total: 423.18+299.34+150.66+49.89 = 923.07

     Y:
          Type A: EU = (10/19)*77.46 + (9/19)*63.25 = (774.6+569.25)/19=1343.85/19=70.73 -> 6*70.73=424.38
          Type B: EU = (10*60+9*40)/19=960/19=50.53 -> 6*50.53=303.18
          Type C: EU = (10*36+9*16)/19=504/19=26.53 -> 6*26.53=159.18
          Absent: EU =50.53
          Total: 424.38+303.18+159.18+50.53=937.27

