   But in V, the worst-off is 49, while in X the worst-off is 50? Actually, both are constant.

   Let's make a distribution that has a higher minimum than X.

   Distribution X: all 50.
   Distribution V: 
          18 positions: 51 tokens
          1 position: 49 tokens

   Then in Round 1, for a participant:
     EU = (18/19)*u(51) + (1/19)*u(49)

   For Type A:
          u(51)=10*sqrt(51)≈71.41, u(49)=10*7=70
          EU_V = (18*71.41 + 70)/19 = (1285.38+70)/19=1355.38/19=71.34
     Compare to EU_X=70.7, so they prefer V.
   For Type B:
          u(51)=51, u(49)=49
          EU_V = (18*51 +49)/19 = (918+49)/19=967/19=50.89 -> prefer V to X (50)
   For Type C:
          u(51)=51^2/100=26.01, u(49)=24.01
          EU_V = (18*26.01 +24.01)/19 = (468.18+24.01)/19=492.19/19=25.91 -> prefer V to X (25)
   Absent: similarly, prefers V.

   So everyone prefers V to X.

   This doesn't work.

   Let's try a distribution that sacrifices sum for the sake of the worst-off.

   Distribution X: all 50 tokens.
   Distribution V: 
          1 position: 30 tokens
          18 positions: 51 tokens

   The worst-off in V is 30, in X is 50.

   In Round 1 expected utility for a participant:
     Type A: 
          EU_V = (1/19)*10*sqrt(30) + (18/19)*10*sqrt(51) 
                = [54.77 + 18*71.41]/19 = [54.77+1285.38]/19=1340.15/19=70.53
          EU_X=70.7 -> prefers X.
     Type B:
          EU_V = (30 + 18*51)/19 = (30+918)/19=948/19=49.89
