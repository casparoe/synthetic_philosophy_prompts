   In Round 2, without the veil of ignorance, the group might be more concerned about the minimum in each distribution:
     X: min=50
     V: min=30
     Y: min=40
     So by maximin, X > Y > V.

   Now, to ensure that majority voting doesn't work, note that in Round 1, the rankings are:
     Type A: 
          X:70.7, V:70.53, Y:70.73 -> ranks: Y > X > V
     Type B: 
          X:50, V:49.89, Y:50.53 -> ranks: Y > X > V
     Type C: 
          X:25, V:25.11, Y:26.53 -> ranks: Y > V > X
     Absent: 
          ranks: Y > X > V

   So if they majority vote on pairs:
     X vs Y: everyone except Type C might prefer Y? 
          Type A and B and absent prefer Y to X.
          Type C prefers X to Y? No, Type C ranks Y first. So everyone prefers Y to X.
     X vs V: 
          Type A: X > V
          Type B: X > V
          Type C: V > X
          Absent: X > V
          So majority (Type A, B, absent) prefer X to V.
     Y vs V: everyone prefers Y.

   So majority voting gives Y > X > V.

   This matches the sum ranking.

   But in Round 2, if they use maximin, they will have X > Y > V.

   To force a conflict between sum and maximin, we need a distribution that has a higher minimum than Y but a lower sum.

   Let me create a new distribution Z: 
     all positions have 49 tokens.

   Then:
     EU for Type A: 10*sqrt(49)=70
     Type B:49
     Type C:49^2/100=24.01
     Absent:49
     Sum: 6*70 + 6*49 + 6*24.01 +49 = 420+294+144.06+49=907.06

   Compare to Y:937.27, X:924.2.

   So sum will have Y > X > Z.

   But the minimum in Z is 49, in Y is 40, in X is 50.
     minimin: X (50) > Z (49) > Y (40)

   So maximin would rank X > Z > Y.

   Now, let's set the three distributions as:
     X: all 50.
     Y: 10 of 60 and 9 of 40.
     Z: all 49.

   In Round 1 (sum of expected utilities):
     X: 924.2
     Y: 937.27
     Z: 907.06
     ranking: Y > X > Z

   In Round 2 (maximin):
     minima: X:50, Y:40, Z:49 -> ranking: X > Z > Y

   So now we have a conflict.

   In Round 1, they will choose Y.
   In Round 2, they will choose X.

   And majority voting in Round 1: 
     Type A: Y > X > Z
     Type B: Y > X > Z
     Type C: Y (26.53) > X (25) > Z (24.01) -> Y > X > Z
     Absent: Y > X > Z
     so they choose Y.

   So the activity can proceed with these three distributions: X, Y, Z.

   The distributions are publicly known by the token amounts for each position. But the positions are anonymized. We have 19 positions, so we can andomly assign the 18 participants and the absent person to these positions after the distribution is chosen in Round 1. But in the distribution, the token amounts are for the positions, not for the individuals by name.

   In the activity, for Round 1, we will:
     - Present the three distributions (X, Y, Z) as tables of 19 numbers (the token amounts for the 19 positions).
     - Each participant knows their own utility function type (A, B, or C) and can compute their expected utility for each distribution.

   For Round 2, we do not do the random assignment. Instead, we say that the assignment of positions to individuals will be done by a process that is unknown. It might be that the worst position in the chosen distribution is assigned to a particular participant, but they don't know who.

   Materials:
     - For each participant: a card with their utility function type and the formula (and maybe a small table of token to utility for common values).
     - Publicly: three posters or a handout showing the three distributions (X, Y, Z) as lists of 19 token amounts.

   Timeline:

    0:00-0:10 (10 min): Introduction
       - Explain the setup: group must choose one of three distributions of tokens (X, Y, Z) that will determine the token amounts for 19 positions (18 participants and one absent person).
       - Explain that after the distribution is chosen, positions will be assigned to individuals.
       - Explain that each participant has a private way of converting tokens to utility (their own utility function), and they will be given their function.
       - Explain the two rounds.

    0:10-0:35 (25 min): Round 1 - Known Odds (veil of ignorance)
       - Tell them that after the distribution is chosen, a fair lottery will assign each of the 19 individuals (18 participants and the absent person) to one of the 19 positions, with equal probability.
       - Give them 5 minutes to compute their expected utility for each distribution.
       - Then, the group has 15 minutes to discuss and come to a consensus ranking of the three distributions.

    0:35-0:50 (15 min): Round 2 - Unknown Odds
       - Tell them that this time, the assignment of positions to individuals will be done by an unknown process. The probabilities are not known and could be anything. It might be that one participant is assigned to the worst position with high probability.
       - The group has 10 minutes to discuss and come to a consensus ranking.

    0:50-1:30 (40 min): Debrief
       - Ask the groups to report their rankings for Round 1 and Round 2.
       - Discuss why they might have changed.
       - Explain Harsanyi's aggregation theorem.
          - In Round 1, the condition of the veil of ignorance (equal probability) and the expected utility maximization by individuals, along with the Pareto condition, lead to the social utility being a weighted sum of individual utilities. 
          - The weights in this case are equal because the veil is symmetric.
          - In Round 2, without the veil, we don't have the same information, so the conditions of the theorem are not met.
       - Explain that the additive constant is irrelevant for ranking.
       - Discuss why the weights are not necessarily equal without the veil: the theorem doesn't specify weights, only that they exist. The veil of ignorance with equal probability justifies equal weights.
       - Discuss what is required for equal weights: symmetry or anonymity.
       - In the second round, the maximin choice would require a different set of axioms (like those in Rawls).

    Predictable issues:
       - Participants might have trouble computing expected utility. Provide a calculator or do the computations in advance for the common types.
       - In Round 1, they might not include the absent person. Remind them that the random assignment includes the absent person.
       - In Round 2, they might not know what to do. Encourage them to think about fairness without knowing the assignment.

    What the activity cannot reproduce:
       - The activity does not have the group ranking lotteries in the sense of probabilistic mixtures of social outcomes. We only have sure distributions plus a random assignment. The theorem applies to lotteries over social states. We have recreated a compound lottery that is a probability distribution over personal outcomes, but the social states are degenerate. This is a special case. The instructor should explain that the theorem is more general.

    Materials for the example:

      Distribute cards with utility functions. For example:

          "Type A: Your utility for receiving t tokens is: u(t) = 10 * sqrt(t)"
          "Type B: ... u(t) = t"
          "Type C: ... u(t) = t^2 / 100"

      And the distributions:

          Distribution X: [50, 50, 50, ...] (19 times)
          Distribution Y: [60,60,...,60 (10 times), 40,40,... (9 times)]
          Distribution Z: [49,49,...] (19 times)

      We can make handouts or project.

    For the absent person: publicly state that the absent person has utility function u(t)=t.

    In the group discussion for Round 1, they will likely sum the expected utilities or average them. If they don't, the instructor can gently guide by asking how to combine the EU's.

    In Round 2, they might focus on the minimum token in each distribution.

    Finally, the debrief should map to the theorem:

      - In Round 1, the group ranking was over sure distributions but combined with a known lottery (random assignment). This is equivalent to ranking lotteries over social states. The individual rankings are by expected utility, and the group ranking turned out to be a weighted sum of individual utilities with equal weights.

      - The theorem requires that the group ranking satisfies the expected utility axioms and the Pareto condition. In the activity, by summing the EU's, they satisfied these.

      - In Round 2, the lack of known probabilities means that individuals cannot form expected utilities in the same way. The group might violate the expected utility axioms (for instance, by using maximin, which is not linear in probabilities).

      - To get equal weights in the theorem without the veil, we would need an anonymity condition.

      - The activity also shows that the weights are not given by the theorem alone: they come from the veil of ignorance or from additional assumptions.

      - The additive constant is irrelevant because it doesn't change the ranking.

    This should fit in 90 minutes.
answer: |-
  Below is a comprehensive design for your 90-minute session, structured to help students organically discover Harsanyi's aggregation theorem through a hands-on activity. The session uses two rounds with differing information about position assignment probabilities to highlight the origin of weights and the theorem's limitations.

  ---

  ### **Session Overview**
  - **Goal:** Students experience how known vs. unknown probabilities of occupying payoff positions lead to different aggregation methods (sum of utilities vs. maximin), revealing the implicit assumptions behind Harsanyi’s weights.
  - **Core Conflict:** 
    - **Round 1 (Known Odds):** Drifts toward weighted sum of utilities (with near-equal weights). 
    - **Round 2 (Unknown Odds):** Drifts toward protecting the worst-off (maximin).
  - **Key Theorem Insight:**  
    Harsanyi requires known probabilities (via the veil of ignorance) to justify additive aggregation with symmetric weights. Without this, the Pareto condition alone cannot prevent unequal weights or non-utilitarian choices.

  ---

  ### **Mechanics & Setup**
  #### **Participants & Payoff Positions**
  - **18 students** + **1 absent person** (e.g., "Alex," a student not in the room). 
  - **3 Payoff Positions** per distribution:  
    - **Position 1:** Moderately good outcomes.  
    - **Position 2:** Highly variable outcomes (risky).  
    - **Position 3:** Worst outcomes (all distributions).  
    - The absent person is always in Position 3. Participants occupy Positions 1 and 2.

  #### **Distributions (Social States)**
  Three deterministic distributions (X, Y, Z) allocate **tokens** (redeemable for snacks post-session) to each position. Tokens are *not* normalized across individuals.  

  | Distribution | Position 1 (Tokens) | Position 2 (Tokens) | Position 3 (Tokens) |
  |--------------|---------------------|---------------------|---------------------|
  | **X**        | 50                 | 50                 | 50                 |
  | **Y**        | 60                 | 60                 | 40                 |
  | **Z**        | 100                | 20                 | 0                  |

  - **Position 3:** Always held by **Alex (absent person)**. Tokens for Alex are fixed per distribution (50, 40, 0).
  - **Note:** Distributions are public, but tokens translate to *private utilities*.

  #### **Private Utility Functions**
  Each student receives a **secret card** with their utility function over tokens (scaled 0–100). Utilities differ in **risk attitude** and **ordering** (e.g., risk-averse values diminishing returns). Alex’s utility is public and linear.  

  | Risk Type      | Utility Function (Tokens → Utility) | Scaling (0–100) | # Students |
  |----------------|-----------------------------------|-------------------------|------------|
  | **Risk-Averse** | \( u(t) = 10\sqrt{t} \)          | Min: 0, Max: 100 tokens| 6          |
  | **Risk-Neutral**| \( u(t) = t \)                   | Min: 0, Max: 100 tokens| 6          |
  | **Risk-Seeking**| \( u(t) = \frac{t^2}{100} \)     | Min: 0, Max: 100 tokens| 6          |
  | **Alex (Absent)** | \( u(t) = t \) (public)        | Min: 0, Max: 100 tokens| 1          |

  - **Private Scaling:**  
    Each student’s worst outcome (0 tokens) = 0 utility; best outcome (100 tokens) = 100 utility.  
    (e.g., A risk-verse student with 50 tokens: \( u(50) = 10 \times \sqrt{50} \approx 70.7 \)).  
  - **No Interpersonal Comparison:** Utilities are in personal "happiness units," making aggregation non-trivial.

  ---

  ### **Rules for Rounds**
  #### **Round 1: Known Odds (Veil of Ignorance)**  
  - **Setup:** After choosing a distribution, a **random draw** assigns each participant (and Alex) to **any position** (1, 2, or 3) with **equal probability (1/3 chance each)**.  
  - **Task:**  
    1. **Individual Calc (5 min):** Students compute their *expected utility (EU)* for each distribution.  
       - E.g., Risk-neutral student for Distribution Y:  
         \( EU(Y) = \frac{1}{3}u(60) + \frac{1}{3}u(60) + \frac{1}{3}u(40) = \frac{1}{3}(60 + 60 + 40) \approx 53.3 \).  
    2. **Group Discussion (15 min):** Reach consensus on ranking X, Y, Z.  
       - **Hint:** "Consider your EU and Alex’s. How should we combine them?"  
  - **Predictable Drift:** Groups typically propose summing/averaging EUs, weighting Alex equally.

  #### **Round 2: Unknown Odds**  
  - **Setup:** Positions are assigned by an **unknown process** (e.g., "The TA will assign positions later using an undisclosed method—maybe some get Position 3 with 90% odds!").  
  - **Task:**  
    1. **Group Discussion (10 min):** Re-rank X, Y, Z with no probability info.  
       - **Hint:** "What if you end up in the worst position?"  
  - **Predictable Drift:** Groups prioritize avoiding Position 3’s outcomes, leading to maximin (e.g., rank X first: min utility = 50).

  ---

  ### **Materials**
  - **Per Student:**  
    - Secret utility card (type A/B/C).  
    - Calculator (phone or handout with precomputed values for common tokens: 0, 20, 40, 50, 60, 100).  
  - **Public:**  
    - Table of distributions (X, Y, Z tokens per position).  
    - Alex’s utility: \( u(t) = t \).  
  - **Other:**  
    - Snack tokens (distributed post-session based on chosen distribution and position draw in Round 1).  
    - Timer for activities.

  ---

  ### **Timeline (90 Minutes)**
  | Time          | Activity                                                                 |
  |---------------|--------------------------------------------------------------------------|
  | **0:00–0:10** | **Intro (10 min):** Explain positions, distributions, private utilities, and the absent person (Alex). Emphasize: "Your utility is personal—no direct comparisons!" |
  | **0:10–0:35** | **Round 1: Known Odds (25 min)**<br>  - 5 min: Individual EU calculations.<br>  - 15 min: Group consensus on ranking distributions.<br>  - 5 min: Report rankings. |
  | **0:35–0:50** | **Round 2: Unknown Odds (15 min)**<br>  - 10 min: Group re-ranking with unknown assignment.<br>  - 5 min: Report rankings. |
  | **0:50–1:30** | **Debrief (40 min)** (Structure below)                                  |

  ---

  ### **Debrief (40 Min)**  
  Map group experiences to the theorem:  

  | **Activity Moment**               | **Theorem Concept**                                                                 | **Talking Points**                                                                                                                                 |
  |-----------------------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Round 1’s EU calculations**     | Individuals satisfy EU axioms (ordering, continuity, independence).                | "You computed EUs because you faced objective probabilities. This satisfies Harsanyi’s first condition: individuals are EU-rational."             |
  | **Round 1’s group aggregation**   | Group satisfies EU axioms + Pareto indifference → Weighted sum of utilities.        | "Your group ranking was likely additive (sum of EUs). Harsanyi proves this *must* happen if the group is EU-rational and respects Pareto: if all are indifferent, the group is too." |
  | **Equal weighting of Alex**       | Weights come from symmetric ignorance (veil of ignorance), not the axioms.          | "Why did Alex’s EU get equal weight? The symmetric 1/3 probability made you 'anonymous.' Without this veil, weights could be unequal."            |
  | **Round 2’s shift to maximin**    | Unknown probabilities violate the "known odds" needed for EU aggregation.           | "Without known probabilities, you couldn’t compute EUs. Maximin (protecting Position 3) emerged because the Pareto condition doesn’t prevent it." |
  | **Alex’s weight in Round 2**      | Weights are undefined without a veil. Groups often exclude the voiceless.           | "Did Alex’s 0 tokens in Z matter less in Round 2? The axioms don’t force you to include them—this is the theorem’s limitation."                   |
  | **What the activity missed**      | Harsanyi’s theorem assumes lotteries over *social states*, not just positions.      | "We simplified by fixing distributions and randomizing positions. Harsanyi covers any lottery (e.g., 50% X, 50% Y), but the intuition holds."    |

  **Key Conclusions:**  
  - **Weights ≠ Inherent:** Weights arise from the veil of ignorance (known, symmetric odds). No veil → no equal weights.  
  - **Maximin Requires More:** Round 2’s choice needs axioms beyond Harsanyi (e.g., Rawlsian fairness).  
  - **Pareto Is Weak:** Pareto indifference alone doesn’t impose interpersonal comparisons or weights.  
  - **Alex’s Voice:** The absent person tests if weights are ethical, not just mathematical.

  ---

  ### **Predictable Challenges & Fixes**
  1. **Problem:** Students struggle with EU math.  
     **Fix:** Provide calculators and a helper table (e.g., "For 50 tokens: risk-averse ≈ 70.7, risk-neutral = 50").  

  2. **Problem:** Round 1 groups fixate on majority voting (ignoring aggregation).  
     **Fix:** Intervene: "Majority voting may ignore minority risk attitudes. How might *all* utilities be combined?"  

  3. **Problem:** Round 2 groups default to Round 1’s logic.  
     **Fix:** Stress uncertainty: "Remember, you might be assigned Position 3 with 90% probability! How does that change things?"  

  4. **Problem:** Alex is ignored.  
     **Fix:** Ask: "Should Alex matter? If so, how much?"  

  5. **Problem:** No consensus in discussions.  
     **Fix:** Allow rankings with ties; focus on why disagreements persist (e.g., risk attitudes vs. inequality aversion).

  ---

  ### **What the Activity Cannot Reproduce**
  - **General Lotteries Over Social States:**  
    The activity uses a fixed set of distributions and randomizes positions (a "compound lottery"). Harsanyi’s theorem applies to *any* lottery over social states (e.g., "60% chance of Distribution X, 40% of Y"). You’ll need to clarify this during the debrief:  
    > "In our activity, you faced a lottery over positions for a fixed distribution. Harsanyi is more general: it covers lotteries where the social state itself is uncertain. But the intuition—known odds leading to additive aggregation—is identical."

  ---

  ### **Expected Outcomes**
  - **Round 1 Rankings:** Typically **Y > X > Z** (due to high EU-sum for Y: e.g., risk-seekers love Z’s 100 tokens, but its low EU for others drags it down).  
  - **Round 2 Rankings:** Typically **X > Z > Y** (X guarantees 50 tokens even for the worst-off; Z’s 0 tokens for Alex becomes unacceptable).  
  - **Debrief Insight:**  
    - Round 1 → Weights emerge from symmetry (veil).  
    - Round 2 → Without symmetry, weights are arbitrary, opening the door to non-utilitarian ethics.

  This design ensures students *feel* the theorem’s machinery before seeing it formally, making the math resonate with lived intuition.
