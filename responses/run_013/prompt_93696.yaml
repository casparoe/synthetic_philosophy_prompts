   For the scaling of utility functions, for a participant i, the global min token is 0 (appearing in Y and Z) and the global max is 100 (appearing in Z). So for every participant, min_i=0, max_i=100.

   Then, their utility functions are:
     Type A: u_i(t) = 10 * sqrt(t)   [because sqrt(0)=0, sqrt(100)=10, so scaled by 10 to get 0 to 100]
              Actually: u_i(t) = 10 * sqrt(t) -> when t=100, u=100? 10*sqrt(100)=100, yes. When t=0, u=0.
     Type B: u_i(t) = t
     Type C: u_i(t) = t^2 / 100   [when t=100, u=10000/100=100; t=0, u=0]

   Now, in Distribution X: every position has 50 tokens.
     Type A: u = 10 * sqrt(50) ≈ 10*7.07 = 70.7
     Type B: u = 50
     Type C: u = (50)^2/100 = 2500/100 = 25

