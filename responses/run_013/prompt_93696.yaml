     Type A: X: 70.7, Y: 67.4, Z: 53.72  --> ranks: X > Y > Z
     Type B: X: 50, Y: 48.42, Z: 38.95    --> ranks: X > Y > Z
     Type C: X: 25, Y: 25.68, Z: 23.79    --> ranks: Y > X > Z

   Now, for the absent person, we said their utility function is publicly known and linear: u_A(t)=t. And we scaled it to 0-100, but since min=0 and max=100, it remains u_A(t)=t.
     Distribution X: every position 50, so if the absent person is assigned to any position, they get 50. EU_A(X)=50.
     Distribution Y: EU_A(Y) = (10*60 + 8*40 + 1*0)/19 = 920/19≈48.42
     Distribution Z: EU_A(Z)=740/19≈38.95

