   But note: the Type C participants prefer Y to X. However, they are outvoted in the sum.

   In the group discussion, they might not sum, but negotiate weights. But we expect that they will move toward summing or averaging.

   In Round 2, without the veil, they might focus on the worst-off in each distribution. In distribution X, the worst-off gets 50. In Y, the worst-off gets 0. In Z, the worst-off gets 0. So they might prefer X because it has the highest floor.

   Also, in distribution X, no one is very badly off.

