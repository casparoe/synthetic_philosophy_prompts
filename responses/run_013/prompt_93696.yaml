   We can say that the group ranking should be based on the veil-of-ignorance expected utilities of all 19 individuals, but the absent person's EU_A(X) is known because we know their utility function. So the group has 19 numbers for each distribution: EU_1(X), EU_2(X), ..., EU_19(X) (where 19 is the absent person).

   Then, if they decide to sum these 19 numbers, they are essentially using equal weights for every individual.

   Therefore, in Round 1, the group might lean toward summing the expected utilities (including that of the absent person) and then choose the distribution with the highest sum.

   In Round 2, without the veil, they might focus on the minimum utility in the distribution or something else.

   To make the distributions such that the ranking differs between sum and maximin, we can design the token distributions to have one distribution that has a high sum of utilities but a very low minimum, and another that has a lower sum but a higher minimum.

   Also, to make sure that no majority can decide, we need the individual rankings to be different. For example, risk-averse participants might rank differently than risk-neutral ones.

   Let's design the three distributions and the utility functions.

   We will have three utility function types for the participants:
     - Type A: risk-averse (concave) utility: u(t) = sqrt(t) [scaled to 0-100]
     - Type B: risk-neutral: u(t) = t [scaled]
     - Type C: risk-seeking: u(t) = t^2 [scaled]

   And we will create 18 such functions, 6 of each type.

   The token amounts will be in a range, say 0 to 100.

