   Then for Type A:
          EU_W = (1/19)*100 + (2/19)*0 + (16/19)*10*sqrt(50) = [100 + 0 + 16*70.7] / 19 = [100+1131.2]/19 = 1231.2/19 ≈64.8
     Type B: [1*100 + 2*0 + 16*50]/19 = (100+800)/19 = 900/19≈47.37
     Type C: [1*100 + 2*0 + 16* (50^2/100=25) ]/19 = (100 + 0 + 400)/19 = 500/19≈26.32

   Now rankings for Round 1:

     Type A: X (70.7) > W (64.8) > Y (67.4? wait, we have to recalc Y with the new set? We are now having three distributions: X, Y, W.

   Let's keep only three distributions and redefine.

   Let's have:
     X: all 50.
     Y: 
          10 positions: 60
          9 positions: 40   (10+9=19)
     W:
          1 position: 100
          2 positions: 0
          16 positions: 50

   Then for distribution Y:
     EU for Type A: (10/19)*10*sqrt(60) + (9/19)*10*sqrt(40) = [10*77.46 + 9*63.25]/19 = [774.6 + 569.25]/19 = 1343.85/19≈70.73
     Type B: (10*60+9*40)/19 = (600+360)/19=960/19≈50.53
     Type C: (10*36+9*16)/19 = (360+144)/19=504/19≈26.53

   So rankings:

     Type A: 
          X: 70.7
          Y: 70.73 -> essentially the same as X, but slightly higher.
          W: 64.8
          So ranks: Y > X > W

     Type B:
          X:50, Y:50.53, W:47.37 -> ranks: Y > X > W

     Type C:
          X:25, Y:26.53, W:26.32 -> ranks: Y > W > X

     Absent person (linear):
          X:50, Y:50.53, W: [1*100+2*0+16*50]/19 = 900/19≈47.37 -> ranks: Y > X > W

   In Round 1, if they sum the expected utilities (19 people):
     S(X) = 6*70.7 + 6*50 + 6*25 + 50 = 424.2+300+150+50=924.2
     S(Y) = 6*70.73+6*50.53+6*26.53+50.53 = 424.38+303.18+159.18+50.53=937.27
     S(W) = 6*64.8+6*47.37+6*26.32+47.37 = 388.8+284.22+157.92+47.37=878.31

   So sum ranks: Y > X > W.

   In majority voting between X and Y:
     Type A: prefer Y
     Type B: prefer Y
     Type C: prefer Y
     So Y wins.

   Between Y and W: everyone prefers Y to W.

   So majority voting gives Y > X > W.

   This doesn't show a conflict between sum and majority.

   We need a distribution that is bad in sum but good for the worst-off.

   Let me introduce a distribution V that is more equal but has a lower sum.

   Distribution V: all positions 49 tokens.

   Then:
     EU for everyone (participants and absent) in Round 1: 
          Type A: 10*sqrt(49)=70
          Type B:49
          Type C:49^2/100=24.01
     Sum: 6*70 + 6*49 + 6*24.01 +49 = 420+294+144.06+49=907.06

