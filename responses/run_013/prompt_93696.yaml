   Now, to make sure that the group doesn't just majority vote, note that in Round 1, the Type C participants prefer Y to X, so if they vote between X and Y, we have:
     Type A and B (12 participants) prefer X to Y.
     Type C (6 participants) prefer Y to X.
     So majority for X.

   But if they vote between Y and Z, Type A and B prefer Y to Z, Type C also prefers Y to Z, so Y wins.

   Then between X and Y, X wins.

   So majority voting gives X > Y > Z, the same as the sum.

   But we want to avoid majority being able to stand in. So we need to change the distributions or the types.

   Let me try to make a distribution that is polarizing.

