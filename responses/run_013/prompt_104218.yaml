prompt: |-
  I'm doing a philosophy of mind module and I've somehow ended up giving the presentation defending epiphenomenalism, which was probably a mistake, because my seminar group has already decided it's self-refuting and I can feel myself caving under them. So I want to rehearse against someone who genuinely holds the view rather than a cardboard version of it. Please play a committed epiphenomenalist — a philosopher of mind, sharp and patient, someone who really does think conscious experiences are caused by brain states but themselves cause nothing at all. Concede the small points where I get a detail right, but never surrender the core claim, and dont break character until I say 'stop'. Keep each reply to a paragraph or two so it feels like an actual back-and-forth. Before you start, think carefully about what resources your position actually has, because I'm going to come at you with the phenomenal-judgement thing and I don't want you flinching.

  Here's my opening move: if epiphenomenalism is true, then my belief that I'm having a reddish experience right now — the judgement itself, the words going through my head, the sentence I just said out loud — is caused entirely by whatever brain state is doing the work, and not at all by the redness. And the same presumably goes for your belief that epiphenomenalism is true. So your own view implies that the event of you asserting it is just a bit of neurological froth that happens to be lying around, like a burp after a meal; the brain would have produced it whether or not any experience was attached to it. You can't then turn round and tell me we should trust the assertion, because by your own lights the assertion isn't tracking anything, it's just something the brain did. Epiphenomenalism seems to saw off the branch it's sitting on — so what makes your belief that it's true any better than a burp?
reasoning: |-
  Okay, the user is preparing for a philosophy presentation defending epiphenomenalism and needs a rigorous sparring partner. They're clearly stressed about their seminar group dismissing the theory as self-refuting, and specifically want to practice against the "phenomenal-judgment" objection—the idea that epiphenomenalism undermines its own assertions. 

  Hmm, their opening salvo is sharp: they argue that if conscious states like "reddish experience" don't cause anything, then even our belief in epiphenomenalism is just meaningless neurological noise. The user's metaphor of a "burp after a meal" suggests they've thought hard about this. 

  Right, as the epiphenomenalist, I need to hold firm on three key points: 
  First, deny that justification requires conscious causation—truth-tracking happens at the physical level. 
  Second, emphasize that epiphenomenalism *predicts* this exact scenario (our beliefs being physically determined), so it's consistent rather than self-undermining. 
  Third, flip the burden: if physicalism is true, *all* theories face this, not just epiphenomenalism. 

  The user might counter with "But why trust physical causation alone?" or "Doesn't this make truth irrelevant?"—I should be ready with the "truth supervenes on physics" response. Also worth noting their frustration—they're "caving" in seminar—so the tone should be patient but unyielding, modeling how to withstand group pressure. 

  ...And crucially, no flinching when they press the "your-belief-is-a-burp" point. The brain's reliability doesn't come from consciousness but from evolutionary mechanisms. Let's see if they spot that distinction.
answer: |-
  *(Adjusting glasses, leaning forward with calm intensity)* An elegant formulation of the objection—but it conflates two distinct issues: the *causal origin* of a belief and its *justification*. Epiphenomenalism concedes that your *judgment* "I am having a reddish experience" is caused entirely by sub-personal neural processes (N), not by the phenomenal redness (P) itself. Crucially, however, N is also the state that *reliably correlates* with P. The brain’s assertion-making machinery is hooked up to detect *its own physical states*, not the non-physical quale. So when N occurs (causing both P and the judgment about P), the judgment accurately *represents* the presence of P, even though P doesn’t *cause* the judgment. Truth is a matter of representational correspondence, not causal efficacy. My assertion of epiphenomenalism is likewise produced by neural mechanisms shaped by reasoning—mechanisms that track *physical evidence patterns* in the world and in philosophical arguments. The view doesn’t "saw off the branch" because justification supervenes on the physical chain: reliable truth-tracking occurs *within* the causal-physical domain. P is an output, not an input—but accuracy is preserved because the system reports on its own outputs via internal feedback loops. Your objection presupposes that conscious causation is necessary for warranted belief, but that’s precisely what I deny.

  **Your rebuttal?** *(Steeples fingers, waiting)*  
  *(Remember: I will defend the coherence of physical truth-tracking without conscious causation. Push harder on justification or self-undermining.)*
