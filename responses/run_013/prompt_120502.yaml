answer: |-
  ### Working Plan  
  1. **Precise statement of the Pompeii premise**: Separate its depositional (single-event burial), chronological (temporal singularity), and behavioral (activities frozen mid-execution) strands.  
  2. **Why the premise fits Pompeii**: Identify what *is* uniquely preserved and what inferences it enables.  
  3. **Case against the premise**: Catalog evidence of pre-eruption temporal depth, post-deposition disturbance, and behavioral palimpsests. Assess if a "weakened" version survives.  
  4. **Reconstruction of beliefs/institutions**: Evaluate governance, worship, and slavery evidence. Scrutinize electoral notices as palimpsests.  
  5. **Theoretical implications**: Reassess formation processes, systemic context, and middle-range theory. Determine if Pompeii refutes, idealizes, or fragments the premise.  
  6. **Verdict**: Defend whether the premise survives and whether Pompeii supports New Archaeology or interpretive approaches.  

  ---

  ### 1. The Premise Dissected  
  The "Pompeii premise" conflates three assumptions:  
  - **Depositional**: The volcanic deposit resulted from *one geologically instantaneous event*, sealing everything simultaneously.  
  - **Chronological**: All artifacts reflect *one narrow timeframe*—days or weeks—before burial.  
  - **Behavioral**: Activities were *interrupted mid-performance*, making spatial arrangements direct proxies for "live" behavior.  

  This bundle implies that excavation reveals a cross-section of *functioning* life, not accumulated debris.  

  ---

  ### 2. Why Pompeii Earned the Name  
  The premise fits key evidence:  
  - **Human drama**: Plaster casts of bodies in flight (e.g., family huddled in a garden; sentry at gate) *suggest* suspended action.  
  - **Perishables preserved**: Carbonized bread in ovens, fish sauce in *amphorae*, coins in market stalls *appear* to capture daily routines.  
  - **Structural integrity**: Second floors, frescoes, and furniture survived, unlike at most sites.  

  **What it licenses**:  
  - Behavioral inferences (e.g., bakeries "in operation"),  
  - Social snapshots (e.g., brothel graffiti implying clientele),  
  - Affective reconstruction (e.g., "panic" in body clusters).  

  ---

  ### 3. The Case Against the Premise  
  **Contrary evidence**:  
  - **Earthquake palimpsest**: 17 years of rebuilding created "temporal zones"—some houses restored, others ruins. The "moment" includes 62–79 CE repair cycles.  
  - **Excavation noise**: Bourbon tunneling relocated artifacts, inventing false assemblages (e.g., sculptures moved to villas for display).  
  - **Behavioral layering**: Electoral notices were painted over repeatedly. The visible layer may represent 75–79 CE campaigns, not a single election.  
  - **Seasonal dispute**: Late fruits (figs, pomegranates) and braziers imply autumn burial. If the eruption was October, not August, the "snapshot" spans months of seasonal change.  

  **Does a weakened premise survive?**  
  Only depositionally: The *eruption* was a single event. Chronologically, the site captures a *decade* (62–79 CE). Behaviorally, activities like baking *were* interrupted, but others (elections, repairs) reflect years of accretion. The premise survives solely for *non-recurrent* acts (e.g., someone fleeing).  

  ---

  ### 4. Reconstructing Beliefs and Institutions  
  - **Governance**: Electoral notices (*programmata*) list supporters for candidates. A palimpsest reading shows persistent elite competition, but the *final* layer (e.g., "Pansa for aedile!") likely reflects the *unresolved* 79 CE campaign. It reveals system mechanics, not that year’s outcome.  
  - **Household worship**: *Lararia* (household shrines) in quake-damaged houses show continuity of practice. Yet their form evolves—older niches vs. new paintings. We see "tradition," not one ritual.  
  - **Slavery**: Collars and graffiti name enslaved individuals (e.g., "Primus, slave of Cominia"). But renovations (e.g., shops converted to housing) suggest shifting ownership. We see statuses at burial, not life histories.  

  **Crucially**: These reconstructions rely on *stratigraphic finality* (e.g., the last election notice) not behavioral stasis. The palimpsest enriches context but doesn’t erase the endpoint.  

  ---

  ### 5. Theoretical Implications  
  - **Formation processes**: Pompeii demonstrates "Pompeii-like" events are *multi-temporal*. Even volcanic burial incorporates prior disturbance (earthquake damage) and cultural re-use (whitewashed notices).  
  - **Systemic vs. archaeological context**: The "systemic" context (living use) is *layered*, not unified. The eruption froze a *transitional* state (post-quake recovery), not equilibrium.  
  - **Middle-range theory**: Binford’s "Pompeii premise" aimed to link statics to dynamics. Here, the "static" record *contains* dynamics (e.g., graffiti overpainting = political evolution). The premise isn’t refuted but *redefined*: the "moment" must accommodate accumulations.  

  **Verdict on the premise**: It fragments. Depositionally valid; chronologically naive; behaviorally untenable as a universal. Pompeii shows it is an *idealization* necessary for narrative clarity but inadequate for full explanation.  

  ---

  ### 6. Final Verdict  
  **Does the premise survive?**  
  As a heuristic for *some* depositional events—yes. As a general model—no. Pompeii’s "frozen moment" is a mosaic of time: the eruption’s violence preserved a decade of recovery, not a day of routine.  

  **New Archaeology vs. Interpretive Reaction?**  
  Pompeii favors the *interpretive* approach. New Archaeology’s laws (e.g., "artifact patterning = activity areas") stumble on palimpsests. The bakery oven *does* show baking occurred, but the electoral graffiti *doesn’t* show one election—it requires contextual "reading" of overpainting, style, and historical knowledge.  

  **Where confidence is thinnest**:  
  - The eruption’s season: Charcoal graffiti dated "17 October" could be pre-eruption *or* from post-August repairs. Tree-ring dating of roof beams might resolve this.  
  - Slave ownership: We see enslaved individuals in 79 CE but cannot track how the earthquake altered their status without ledgers (which we lack).  

  **In essence**: Pompeii is both archaeology’s greatest snapshot and its most cautionary tale. The premise named for it is not a lie but a simplification—one that collapses under the weight of the very evidence it promised to explain.
