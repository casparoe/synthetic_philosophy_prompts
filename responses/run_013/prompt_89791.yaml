answer: |-
  ### Activity Design: Symmetric and Asymmetric Dilemma Game  
  This in-class game creates a tension between collective reasoning and individual incentives without using specialized terms. The symmetric phase (Platonia-inspired) highlights coordination challenges among identical players, while the asymmetric phase disrupts this by introducing hidden differences, forcing players to grapple with ambiguous "shared reasoning."

  ---

  ### **Rules and Materials**  
  **Participants:** 18 graduate students.  
  **Materials:**  
  - Slips of paper for decisions (2 colors: white for phase one, yellow for phase two).  
  - Two collection boxes (one for each phase).  
  - Whiteboard/flip chart to display results after each round.  
  - Private notes for phase two (9 notes with "150", 9 with "100"; see instructions).  
  - Unique identifiers: Students use a self-selected 3-digit code (e.g., last 3 digits of phone number) for anonymous tracking.  

  **Payoff Scheme (Points):**  
  - Points are non-monetary; frame as "research participation credits" or "bragging rights."  
  - **Phase One (Symmetric):**  
    - If 1–6 players claim, each claimant gets **100 points**. Non-claimants get **0**.  
    - If 0 claim or >6 claim, **all players get 0**.  
    Collective optimum: Exactly 6 claims (maximizes total points: 600). Individual temptation: Claiming when few others do yields high reward; overclaiming voids the prize.  
  - **Phase Two (Asymmetric):**  
    - Same threshold (1–6 claims for prize).  
    - 9 players receive a private note: "Your prize value: **150 points**" (high-value).  
    - 9 players receive: "Your prize value: **100 points**" (low-value).  
    - If prize is awarded (1–6 claims), claimants receive their assigned value. Non-claimants get 0.  
    - If 0 or >6 claims, **all get 0**.  
    Asymmetry creates conflict: High-value players are tempted to claim more, but collective success still requires ≤6 claims.  

  **Information Flow:**  
  - Decisions submitted anonymously via slips (no names, only identifiers).  
  - After each round, display:  
    - Total number of claims.  
    - Whether the prize was awarded (yes/no).  
    - Number of winners (if applicable).  
    - **Never reveal individual decisions or private values.**  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Phase One: Symmetric Dilemma (30 Minutes)**  
  - **0–5 min:** Introduce activity.  
    > "We’ll play a short game in multiple rounds. In each round, you’ll choose to CLAIM or PASS. Your goal is to earn points. Rules:  
    > - If between 1 and 6 players CLAIM, each claimant gets 100 points. Everyone else gets 0.  
    > - If 0 CLAIM or more than 6 CLAIM, all players get 0.  
    > I’ll announce totals after each round. Use your identifier on slips."  
  - **5–20 min:** **5 rounds** of play (each round: 2 min decide, 1 min collect/announce).  
    - *Round structure:*  
      - Distribute white slips.  
      - Students write identifier + CLAIM/PASS.  
      - Collect slips in Box 1.  
      - Tally and display: "Round X: [Number] claims. Prize awarded: [Yes/No]."  
  - **20–30 min:** Quick reflection (transition).  
    > "Look at the results. What patterns do you see? We’ll play more, but rules may change."  

  **Phase Two: Asymmetric Dilemma (30 Minutes)**  
  - **30–35 min:** Introduce phase two + distribute private notes.  
    > "New rounds with one change. Some of you have a private note—do not share it. Rules:  
    > - Same as before, but your note shows your personal prize value if you CLAIM and the prize is awarded.  
    > - If prize is void, all get 0.  
    > Submit yellow slips now."  
    - Hand notes randomly face-down; students read privately.  
  - **35–50 min:** **5 rounds** (same as phase one: 2 min decide, 1 min collect/announce).  
    - Use yellow slips and Box 2.  
    - Display same aggregate info (total claims, prize yes/no).  
  - **50–55 min:** Prepare for debrief.  
    > "Keep your identifiers. We’ll discuss what happened."  

  **Debrief (35 Minutes)**  
  - **55–65 min:** Map phase-one outcomes to concepts.  
    - Show claim totals across rounds on board. Ask:  
      > "What happened? Why did claims cluster high/low? Did anyone adjust based on past rounds?"  
    - Highlight:  
      - **Collective optimum** (6 claims) vs. **individual temptation** (claiming when expecting <6 others).  
      - **Instability:** Without communication, players default to self-interest → volatile outcomes (e.g., rounds with 0 claims or 15+).  
      - **Symmetry pull:** "If we all reason alike, we’d each claim with 1/3 probability to hit 6." But this is fragile—small misalignments cause failure.  
  - **65–75 min:** Reveal phase-two asymmetry and contrast.  
    - Announce: "In phase two, half had 150-point valuations, half had 100." Show claim totals. Ask:  
      > "Did high-value players claim more? How did you adjust? Could you coordinate?"  
    - Highlight:  
      - **Asymmetry breaks symmetry:** High-value players incentivized to claim, but if too many do, prize voids. "Reasoning alike" has no clear meaning—should high-value players claim more often? What probability?  
      - **Indeterminacy:** No focal point for coordination. Players aren’t interchangeable, so shared reasoning fails.  
  - **75–85 min:** Address objections and core ideas.  
    - **Objection ("This just shows people like winning"):**  
      > "True, but the instability reveals something deeper: Winning depends on *how you model others’ reasoning*. In phase one, symmetry made ‘shared reasoning’ feel intuitive. In phase two, differences made it ambiguous—your ‘rational choice’ depended on unknowns about others."  
    - **Underlying concepts:**  
      - **Superrationality (now defined):** Assuming identical players use identical reasoning → neat solution in phase one (e.g., stochastic claiming).  
      - **Breakdown in asymmetry:** When players aren’t identical, "shared reasoning" requires arbitrary conventions (e.g., "high-value players claim first")—but none exist here.  
  - **85–90 min:** Conclusion.  
    > "This mirrors real-world dilemmas: Shared goals can collapse when hidden differences prevent aligned reasoning. Tomorrow, we’ll formalize this."  

  ---

  ### **Predictable Problems and Mitigation**  
  1. **Problem: Phase one consistently voids (e.g., 0 or 18 claims).**  
     - *Why:* Students overcorrect ("I’ll pass since others claim") or mimic ("If they claim, I will too").  
     - *Fix:* In debrief, use this to highlight instability. Ask: "In round 3, claims dropped to 2—why did it bounce to 15 next?"  

  2. **Problem: Phase-two asymmetry ignored (e.g., claims mirror phase one).**  
     - *Why:* Students may not internalize private values or assume others are identical.  
     - *Fix:* In debrief, contrast individual strategies: "Did high-value players claim more? Why didn’t this help coordination?"  

  3. **Problem: Students communicate or collude.**  
     - *Why:* Graduate students may strategize aloud.  
     - *Fix:* Preface: "No talking during rounds. This tests individual reasoning." Gently enforce silence.  

  4. **Problem: Frustration with volatility.**  
     - *Why:* Random-seeming outcomes feel unfair.  
     - *Fix:* Normalize this: "The instability is the point—it shows why these dilemmas are hard in practice."  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The One-Shot Nature of the Original Dilemma:**  
  - Hofstadter’s Platonia is a single decision with no learning. Here, repeated rounds allow adaptation, which dilutes the "purity" of the initial coordination challenge.  
  - **How to handle:** Explain during debrief:  
    > "In the original dilemma, players decide once with no feedback. We used rounds to observe reasoning, but this introduces dynamics like learning. In a one-shot game, the symmetry/asymmetry tension is sharper—you’d have no second chances."  

  ---

  This design forces students to *experience* the appeal of symmetric reasoning and its collapse under asymmetry, setting up deeper discussion of decision theory. The point system avoids free-rider dynamics by making rewards contingent on collective restraint (threshold), not individual costs.
