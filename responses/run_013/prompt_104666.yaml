prompt: |-
  I am in a political theory seminar that keeps circling back to populism, and I have noticed that every argument I get into -- about whether a referendum really expressed the popular will, whether a leader can legitimately claim to speak for the people against the courts or the press, whether a policy that the public would endorse only after deliberation counts as something the people want -- goes wrong at the same place. Each of us arrives with an unstated theory of what "the will of the people" even is, and we spend the whole hour discovering that we were answering different questions. So before I read another word of Rousseau, of the neo-republican deliberative literature, of the aggregative-majoritarian camp, or of the Schumpeterian proceduralists, I want the specification written down first. Please give me the desiderata that any adequate theory of the will of the people must meet. I want the cases it has to get right, the distinctions it cannot be allowed to collapse, and the results it has to be consistent with -- with the particular case or consideration behind each requirement, so that I can see why it is a genuine demand rather than a prejudice of one camp. Among the cases I would insist any such theory handle: a referendum in which a majority votes to strip rights from a minority; a situation where preferences cycle so that no majority preference exists at all; a case where the preferences being aggregated were themselves produced by advertising, agenda-setting, or manipulation, so that it is unclear whether the "will" is discovered or manufactured; and a case where a leader or movement claims to embody the true people against the actually-existing institutions that claim to represent them. As for the distinctions, I am thinking of ones like the difference between the people's will and mere majority preference, between an empirical reading of the will (what people in fact want) and a normative one (what they have reason to want, or would want under suitable conditions), between the people as a single corporate agent and the people as an aggregate of individuals, and between the will being something determinate and pre-existing versus something constructed in the very act of asking for it -- but tell me which of these are load-bearing and which are red herrings.

  I would also like you to say which of the requirements are non-negotiable and which are merely commitments of one camp, and, most of all, to flag any subset of the desiderata you suspect cannot be jointly satisfied -- because if, say, one requirement demands that the will be independently determinable while another concedes that preferences are endogenous and framing-dependent, or if the demand for a single corporate will runs into the impossibility results that plague any aggregation of individual preferences, then the list itself is the result and I want that stated plainly rather than buried. Then, briefly and only at the end, run the main contenders against the list: the general-will tradition that reads the will as what citizens would will as a body, aggregative majoritarianism, the deliberative view that the will emerges from suitably structured public reasoning, the populist embodiment view on which a leader or movement is the authentic voice of the people, and the proceduralist view that the will is simply whatever the established decision procedure outputs. Keep the weight on the criteria and the cases that motivate them rather than on the scoring, since I can do the scoring in class -- the criteria are what I cannot currently get anyone to state. One practical constraint: the theory is meant to be adequate for adjudicating concrete disputes of the kind we keep having, so the requirements should be pitched at whatever level of precision that purpose actually needs, no more.
reasoning: |-
  Okay, the user is in a political theory seminar focused on populism and keeps hitting the same wall in debates about "the will of the people." They've noticed that everyone enters with unspoken assumptions about what that phrase means, leading to circular arguments. They want a clear set of criteria—desiderata—that any theory of "the will of the people" must satisfy before diving into Rousseau or other theorists. Their goal is to map the conceptual minefield.  

  First, I need to unpack their core frustration: they're stuck in semantic clashes disguised as substantive debates. The examples they give—referendums oppressing minorities, preference cycles, manipulated preferences, populist claims against institutions—highlight how theories fracture along fault lines like empirical vs. normative wills or aggregated vs. corporate agency. They also mention key distinctions that might be "load-bearing" (essential) or "red herrings" (distractions).  

  The user’s deeper need is methodological: they want a neutral framework to evaluate theories, not another partisan take. They’re tired of theorists talking past each other. The criteria must be rigorous enough for real-world adjudication (e.g., judging a controversial referendum) but not overly prescriptive. Crucially, they want conflicts between desiderata flagged—if some requirements are logically incompatible, that’s a conclusion in itself.  

  Now, structuring the response:  
  1. **Desiderata**: Break into categories like *existence conditions* (must the will be determinate?), *normative constraints* (can it violate rights?), *epistemic/operational requirements* (how do we know it?), and *anti-manipulation guards*. Anchor each to their examples. For instance:  
     - *Minority rights case* → Necessitates a constraint against tyrannical majorities.  
     - *Preference cycles* → Demands the theory handle indeterminacy.  
     - *Manipulated preferences* → Requires distinguishing endogenous vs. authentic will.  
     - *Populist embodiment claims* → Needs anti-usurpation criteria.  

  2. **Distinctions**: Identify which are load-bearing:  
     - Empirical vs. normative will: Central, as it splits theorists (e.g., Rousseau’s general will vs. majoritarianism).  
     - Corporate vs. aggregate agency: Key for resolving populist embodiment claims.  
     - Discovered vs. constructed will: Critical for manipulation cases.  
     *(Red herrings? Maybe "will of the people" vs. "majority preference"—often just semantic.)*  

  3. **Tensions to highlight**:  
     - Determinacy vs. preference endogeneity: If the will must be pre-existing (*determinacy*), but preferences are shaped by framing (*epistemic robustness*), conflict arises.  
     - Corporate unity vs. individual diversity: Arrow’s theorem shows aggregation into a coherent "will" is often impossible.  
     - Anti-tyranny vs. populist embodiment: Leaders claiming to "truly" represent the people may override institutions meant to protect minorities.  

  4. **Theories scored briefly**:  
     - *General will*: Strong on anti-tyranny/normative depth but fails epistemic robustness (how to access the "would will"?).  
     - *Aggregative majoritarianism*: Clear operationalization but implodes on cycling/manipulation and minority rights.  
     - *Deliberative theories*: Handle manipulation and normative depth but struggle with determinacy/operational clarity.  
     - *Populist embodiment*: Ignores anti-usurpation and anti-tyranny.  
     - *Proceduralism*: Sidesteps existence questions but risks endorsing manipulated outcomes.  

  The user’s "aha" moment might come from realizing no theory satisfies all desiderata—the map *is* the insight. That’s why the criteria must expose trade-offs, not just list features.
answer: |-
  Below is a systematized list of desiderata for any theory of "the will of the people," derived from your cases and distinctions. Each requirement is grounded in a concrete problem (notably your cases: **A** = referendum stripping minority rights, **B** = preference cycles, **C** = manufactured preferences, **D** = populist leader vs. institutions). I distinguish **non-negotiable** demands (essential for any minimally coherent theory) from **contestable** ones (which reflect commitments of specific camps). Crucially, I flag tensions where desiderata *conflict*, making joint satisfaction impossible. Finally, I map major theories against the criteria.  

  ---

  ### **I. Core Desiderata: What a Theory Must Explain or Accommodate**  
  *(Non-negotiable requirements are starred **★**)*  

  1. **★ Anti-Tyranny Constraint**  
     - **Case:** **A** (majority votes to strip minority rights).  
     - **Demand:** The theory must *not* equate "the will of the people" with outcomes that violate fundamental rights or enable permanent domination.  
     - **Why non-negotiable?** Any theory endorsing tyranny in the name of "the people" collapses into self-contradiction (e.g., it destroys the conditions for future popular will-formation).  

  2. **★ Indeterminacy Accommodation**  
     - **Case:** **B** (preference cycles, no stable majority).  
     - **Demand:** The theory must address cases where no coherent "will" emerges from aggregation (e.g., due to Arrow’s theorem).  
     - **Why non-negotiable?** If the will is indeterminate in practice, the theory must explain how to proceed (e.g., via procedural defaults) without pretending coherence exists.  

  3. **★ Epistemic Robustness**  
     - **Case:** **C** (preferences manufactured by propaganda/agenda-setting).  
     - **Demand:** The theory must distinguish *authentic* expressions of will from *manipulated* ones, or acknowledge that such distinctions may be impossible.  
     - **Why non-negotiable?** If preferences are purely endogenous (shaped by how/when they are elicited), the theory must account for this—or concede that "the will" is always constructed.  

  4. **★ Anti-Usurpation Constraint**  
     - **Case:** **D** (leader claims to embody "true" people against institutions).  
     - **Demand:** The theory must prevent any agent (leader, party, movement) from unilaterally declaring itself the *exclusive* voice of "the people" without institutional checks.  
     - **Why non-negotiable?** Otherwise, the theory enables authoritarian hijacking of popular sovereignty.  

  5. **Distinction Preservation: Empirical vs. Normative Will**  
     - **Cases:** **A** (rights-stripping), **C** (manufactured preferences).  
     - **Demand:** The theory must clarify whether "will" means (a) *actual* preferences of individuals, or (b) what they *would* will under idealized conditions (e.g., full information, impartiality).  
     - **Why load-bearing?** This distinction determines whether the theory prioritizes responsiveness (empirical) or legitimacy (normative). Collapsing them obscures why **A** and **C** are problematic.  

  6. **Corporate vs. Aggregate Agency Distinction**  
     - **Cases:** **D** (populist embodiment), **A** (minority rights).  
     - **Demand:** The theory must specify if "the people" acts as a unified entity (corporate) or is an aggregation of individuals.  
     - **Why load-bearing?** Corporate theories (e.g., Rousseau) risk authoritarianism if misapplied (**D**); aggregative theories struggle with normative coherence (**B**, **A**).  

  7. **Operational Clarity**  
     - **Cases:** All concrete disputes (e.g., **A**, **D**).  
     - **Demand:** The theory must provide a method to *identify* the will in practice (e.g., voting, deliberation, institutional procedures).  
     - **Why non-negotiable?** Without this, the theory is useless for adjudicating disputes.  

  ---

  ### **II. Key Tensions: Where Desiderata Conflict**  
  *(No theory can satisfy all simultaneously)*  

  - **Tension 1: Determinacy vs. Epistemic Robustness**  
    - If the will must be *determinate* (pre-existing and discoverable), it clashes with **C** (preferences are framing-dependent).  
    - *Theories forced to choose:* Aggregative majoritarianism (prioritizes determinacy via voting) fails epistemic robustness; deliberative theories (prioritize robustness via ideal conditions) sacrifice determinacy.  

  - **Tension 2: Anti-Tyranny vs. Populist Embodiment**  
    - **Anti-tyranny** requires constraints on majorities/institutions (**A**, **D**), while **populist embodiment** views such constraints as elitist.  
    - *Irreconcilable:* Populist theories reject anti-tyranny constraints; liberal theories insist on them.  

  - **Tension 3: Corporate Unity vs. Aggregative Diversity**  
    - Corporate agency assumes a singular "will" (**D**), but Arrow’s theorem (**B**) proves aggregation often produces incoherence.  
    - *Result:* Corporate theories must ignore empirical diversity or posit metaphysical unity.  

  ---

  ### **III. Load-Bearing vs. Red Herring Distinctions**  
  - **Load-Bearing:**  
    - Empirical vs. normative will (shapes legitimacy claims).  
    - Corporate vs. aggregate agency (determines how conflicts are resolved).  
    - Discovered vs. constructed will (impacts manipulation critiques in **C**).  
  - **Red Herrings:**  
    - "Will of the people" vs. "majority preference" (semantic; all theories define this differently).  
    - "The people" as ethnic vs. civic (a separate debate about boundaries).  

  ---

  ### **IV. Major Theories Mapped to Desiderata**  
  *(Briefly scored against key criteria; non-negotiable failures in **bold**)*  

  1. **Rousseau/General Will**  
     - *Strengths:* Anti-tyranny (★), normative depth, anti-usurpation.  
     - *Failures:* **Operational clarity** (how to access the general will?), **indeterminacy accommodation** (assumes unity exists), struggles with **epistemic robustness** (assumes citizens are impartial).  

  2. **Aggregative Majoritarianism**  
     - *Strengths:* Operational clarity, empirical focus.  
     - *Failures:* **Anti-tyranny** (fails **A**), **indeterminacy accommodation** (fails **B**), **epistemic robustness** (ignores **C**).  

  3. **Deliberative Democracy**  
     - *Strengths:* Epistemic robustness (**C**), anti-tyranny (**A**), normative/empirical bridge.  
     - *Failures:* **Operational clarity** (how to institutionalize?), **indeterminacy accommodation** (still vulnerable to **B**).  

  4. **Populist Embodiment**  
     - *Strengths:* Operational clarity (via leader), corporate agency.  
     - *Failures:* **Anti-tyranny** (enables **A**), **anti-usurpation** (fails **D**), ignores **B** and **C**.  

  5. **Schumpeterian Proceduralism**  
     - *Strengths:* Operational clarity, accommodates **B** and **C** (avoids metaphysical claims).  
     - *Failures:* **Anti-tyranny** (procedure may enable **A**), **anti-usurpation** (cannot critique **D** if leader wins procedurally).  

  ---

  ### **Conclusion: The Criteria as a Diagnostic Tool**  
  Your cases reveal that no theory satisfies all desiderata: **Anti-tyranny** conflicts with unconstrained majoritarianism; **epistemic robustness** undermines claims of pre-existing determinate will; **corporate agency** clashes with empirical diversity. The most defensible theories (e.g., deliberative democracy) prioritize anti-tyranny and epistemic robustness but sacrifice operational clarity. The weakest (populist embodiment) fail non-negotiable constraints. **Use this framework to expose trade-offs:** When someone defends a theory, ask which desiderata they neglect and which tensions they paper over. The value lies not in a "winner," but in mapping why debates go in circles—and where compromise is impossible.
