answer: |-
  The child, framed by shattered glass, pointed triumphantly at the conditional scrawled on the wall: "IF BREAKING WINDOWS IS WRONG, THEN BREAKING *THIS* WINDOW WAS WRONG." "See?" they declared, "It's purely compositional! The antecedent's embedding suspends any illocutionary force, so uttering this complex sentence commits me *absolutely* to no disapproval of window-breaking whatsoever – it’s just a truth-apt structure awaiting valuation!" The parent sighed, picked up a baseball bat leaning against the intact pane, and said, "Breaking windows *is* wrong. Now, say the second part *without* the 'if'."

  **This joke trades on:** The expressivist's core challenge that the *same semantic content* must be carried by "breaking windows is wrong" whether asserted freestanding (where it directly expresses disapproval) or embedded as the antecedent in a conditional (where it seemingly doesn't). The parent exploits this requirement of semantic uniformity: by asserting the antecedent, they force its *full, attitude-expressing meaning* into play, making modus ponens apply not just to truth values but to the child's *commitment*, collapsing the distinction the child tried to exploit. The humor lies in semantic compositionality *enforcing* attitudinal commitment via logical structure.
