  We are building a decision tree to help participants in a reading group on the Hart-Fuller debate to clarify their positions beyond simple labels. The tree starts from a shared commitment: everyone agrees that the existence of law is at least partly a matter of social fact (enactment, acceptance by officials, etc.). The tree then explores where moral considerations enter: validity, obligation, interpretation, or nowhere.

  We are to have 6-8 nodes. The leaves should cover at least:
  - Injustice never affects validity, only obligation.
  - The rule of recognition can include moral criteria.
  - Moral work only in interpretation (validity social, content not).
  - Extreme injustice strips validity.
  - A thoroughly unjust system isn't law in the focal sense (rather than invalid law).
  - Legality comes in degrees.

  We must avoid questions that require knowing the labels, use case-based questions, and flag any collapsing positions or uncertainties.

  Logical Space:

  We can break down the issues into:

  1. **Validity and Morality**: Does moral defect (especially extreme injustice) affect the validity of a norm?
     - (a) Never: validity is purely social.
     - (b) Sometimes: e.g., extreme injustice invalidates.
     - (c) Always: but that's not our starting point (we start with social facts).

  2. **Rule of Recognition**: Can the rule of recognition in a particular legal system incorporate moral criteria as conditions of validity?
     - (a) Yes: then moral criteria are part of the test for law in that system.
     - (b) No: the rule of recognition is only about social facts.

     Note: This is about the system's rule, not a universal claim.

  3. **Obligation to Obey**: Is there an obligation to obey the law that is independent of moral evaluation?
     - (a) There is a prima facie obligation, but it can be overridden by injustice.
     - (b) There is no obligation to obey unjust laws (or even any law) without moral evaluation.

     However, note that the tree might not need to go into obligation in depth because the focus is on what makes something law, not on the obligation to obey. But the post-war case brings in the obligation.

     Alternatively, we can frame the post-war case as about the legal status of the statute (was it law?) and the consequence (was the informer acting lawfully?).

  4. **Interpretation**: Does moral evaluation enter into determining the content of the law (even when the validity is settled by social facts)?
     - (a) Yes: moral principles can be part of the law via interpretation.
     - (b) No: the content is fixed by social facts and conventional interpretation.

  5. **Degrees of Legality**: Is legality a matter of degree? That is, can a system or norm be more or less legal?
     - (a) Yes: legality comes in degrees, and moral defects can reduce the degree of legality.
     - (b) No: legality is binary (either law or not).

  6. **Focal vs. Non-focal**: For a thoroughly unjust system, is it better to say it is not law in the central sense (but still law in a secondary sense) or that it is invalid law?

  We must also note that some positions might collapse. For example, the extreme-injustice-invalidates and the degrees-of-legality might be close, but the latter allows for partial legality without complete invalidity.

