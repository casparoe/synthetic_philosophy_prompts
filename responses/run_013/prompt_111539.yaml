answer: |-
  Below is a decision tree designed to help your reading group move beyond labels to substantive positions in the Hart-Fuller debate. It starts from your shared commitment (law depends partly on social facts) and focuses on where moral merit enters the picture—validity, obligation, interpretation, or nowhere. I've built it from logical space first, using case-based questions to avoid labels, and aimed for 7 nodes to stay within constraints.

  The tree identifies 7 distinct leaves (including all you requested). It flags two pairs of leaves that the tree cannot fully separate (due to conceptual overlap or underdetermination), and I note my confidence level at the end. The most awkward commitments for each leaf are highlighted to provoke discussion.

  **Decision Tree: Where Does Moral Merit Enter Legal Validity?**  
  *Start: We all agree that whether a norm is law depends at least partly on social facts (e.g., enactment, official acceptance). Moral merit alone cannot make something law.*

  ### Nodes:
  1. **In a legal system, officials routinely appeal to "what justice requires" when arguing about what the law is. Does this practice make justice part of the test for legal validity in that system?**  
     - *(A) YES, it means justice is a validity condition in that system (go to Node 2).*  
     - *(B) NO, it's just how officials reason; validity depends only on social sources (go to Node 3).*  

  2. **Imagine a statute in this system that is unjust (by the system's own standards) but was properly enacted. Is it still valid law?**  
     - *(A) NO, injustice defeats validity here (Leaf 1).*  
     - *(B) YES, it remains valid; injustice only affects obedience or interpretation (Leaf 2).*  

  3. **A post-war court judges an informer who reported a neighbor under a monstrous but properly enacted statute (e.g., Nazi Germany's racial laws). The court rejects the statute's defense. Why?**  
     - *(A) The statute was NEVER VALID due to extreme injustice (Leaf 3).*  
     - *(B) The statute was valid, but the informer had NO OBLIGATION to obey it (go to Node 4).*  
     - *(C) The statute was valid, but its CONTENT is reinterpreted morally (e.g., "law" implies basic fairness) (Leaf 4).*  

  4. **In the informer case, if the statute was valid but not binding, what makes the court's punishment legally justified?**  
     - *(A) The court enforces MORAL ACCOUNTABILITY, not legal validity (Leaf 5).*  
     - *(B) The court applies NEW LAW retroactively (e.g., crimes against humanity) (Leaf 5).* *(Note: Tree cannot separate these—see "Flagged Overlaps" below.)*  

  5. **Can a legal system exist if it is thoroughly unjust (e.g., apartheid South Africa) but has clear, prospective, consistently applied rules?**  
     - *(A) NO, it lacks "law" in the central sense (Leaf 6).*  
     - *(B) YES, it is law, just evil (go to Node 6).*  

  6. **In such an unjust system, is a specific wicked-but-properly-enacted norm still valid law?**  
     - *(A) NO, extreme injustice always strips validity (Leaf 3).* *(Note: Overlaps with Leaf 3—see below.)*  
     - *(B) YES, validity is purely social (go to Node 7).*  

  7. **When a norm's meaning is ambiguous (e.g., "equal protection"), does moral reasoning determine its legal content?**  
     - *(A) YES, morality shapes interpretation (Leaf 4).* *(Note: Overlaps with Leaf 4—see below.)*  
     - *(B) NO, content is fixed by social facts/language alone (Leaf 7).*  

  ---

  ### Leaves:
  - **Leaf 1** (*Inclusive Positivism*): Moral criteria can be part of a system's rule of recognition, so injustice can defeat validity *if* the system's social rules require it.  
    *Awkward commitment: In a system without moral criteria, genocide could be valid law.*  
  - **Leaf 2** (*Incorporationism*): Moral merit enters only via interpretation; validity stays social, but content can be shaped by justice.  
    *Awkward commitment: A "valid" law might be reinterpreted beyond recognition.*  
  - **Leaf 3** (*Radical Natural Law*): Extreme injustice strips validity entirely; morally monstrous norms are not law.  
    *Awkward commitment: Many historically "legal" norms (e.g., slavery laws) were never law.*  
  - **Leaf 4** (*Interpretive Natural Law*): Moral merit determines legal content in hard cases, but not validity.  
    *Awkward commitment: Interpretation might override clear statutory text.*  
  - **Leaf 5** (*Separation Thesis*): Injustice never affects validity; it only means no obligation to obey (or justifies retroactive justice).  
    *Awkward commitment: Courts may punish "legal" acts retroactively.*  
  - **Leaf 6** (*Procedural Natural Law*): A system lacking minimal procedural justice (e.g., secret laws) isn't law in the focal sense—legality is binary.  
    *Awkward commitment: "Law" becomes a contestable ideal, not a social fact.*  
  - **Leaf 7** (*Exclusive Positivism*): Validity and content are fixed by social facts alone; morality affects only obedience.  
    *Awkward commitment: A perfectly enacted evil norm is valid law.*  

  *(Leaf 8: Degrees of Legality—omitted due to collapse with Leaf 3/6. See "Flagged Overlaps" below.)*

  ---

  ### Flagged Overlaps (Pairs the Tree Cannot Separate):
  1. **Leaf 3 (Extreme Injustice Invalidates) vs. Degrees of Legality**:  
     The tree cannot isolate a distinct "legality comes in degrees" leaf. If you hold that extreme injustice reduces legality to zero (e.g., "not law at all"), you end at Leaf 3. If you think injustice *diminishes* legality without voiding it, the tree may route you to Leaf 3 or 6 ambiguously—this view is underdeveloped in the literature and collapses into existing leaves. Fuller's "inner morality" is binary in practice (threshold-based), not scalar.
     
  2. **Node 4A and 4B (Obligation vs. Retroactivity)**:  
     Both lead to **Leaf 5**. The tree cannot split Hart's "no obligation" view from retroactive law approaches, as both treat validity as socially fixed but deny legal defenses for injustice. They share the same awkward commitment.

  3. **Leaf 2 and Leaf 4 (Rule of Recognition vs. Interpretation)**:  
     If you take path 1B→3C→Leaf 4, you get moral interpretation. But if you answer Node 1A→2B→Leaf 2, you might also emphasize interpretation. The tree *tries* to separate these (Leaf 2 focuses on systemic rules, Leaf 4 on hard cases), but they may converge in practice.

  ---

  ### Confidence and Uncertainty
  - **Overall Confidence: 80%**. The tree captures core positions and avoids common pitfalls (e.g., conflating Fuller with substantive natural law). Nodes are answerable without labels, and the structure reflects logical dependencies (e.g., you must resolve the rule of recognition before extreme injustice).  
  - **Least Confident Point: Node 3 (Informer Case)**. I worry it underdetermines routes for Fuller-style proceduralists. If users assume the Nazi regime met procedural thresholds (per your "properly enacted" constraint), they might skip to Node 4 prematurely, missing Leaf 6. I mitigated this with Node 5, but Fuller's "procedural injustice invalidates" (Leaf 6) could be conflated with substantive injustice (Leaf 3).  

  **Recommendation**: Pair this with a disclaimer: "Some positions may fit multiple leaves. Use disagreements to debate nuances!" This tree works best as a catalyst for discussion, not a rigid taxonomy.
