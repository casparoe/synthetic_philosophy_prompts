  First, I need to understand their core confusion: why do we treat marital promises as sacred socially but not legally? They’re probing the philosophy behind promissory obligations. The user references contract law concepts like consideration and reliance, pointing out that marriage lacks these yet holds emotional weight. They also question why the ceremony and witnesses matter if the words themselves aren’t legally binding.

