prompt: |-
  I'm a fourth-year PhD student in ancient history, and I've been conscripted to run a single ninety-minute session of our second-year undergraduate seminar on Athenian democracy: fourteen students, a flat room with movable chairs, no projector, a printer I can abuse, and no teaching budget to speak of. Most of them have read a bit of Thucydides and the Apology and can produce the standard list of complaints — the assembly was too emotional, the generals were second-guessed, the demagogues won — but they produce it the way one produces a fact about a foreign country. My supervisor wants them to leave with something more like unease, and I've come round to thinking that the usual hour of lecture on the Mytilenaean decree, the Sicilian expedition, and the trial of Socrates is exactly the wrong instrument: they will nod at the pathologies and then reproduce them the first time someone in the seminar proposes something popular. A friend in the law faculty keeps telling me the Athenians' only real problem was the absence of judicial review, and I suspect that's far too tidy. So I'd like to stage the pathologies rather than describe them, and I'd like you to design the activity.

  Here is the brief. The session should be one continuous simulated emergency assembly of an invented city — not Athens, with an invented name, and the participants should never be told which historical episodes they are re-enacting, because the whole point is that they arrive at the structural problem themselves instead of recognising a story they already half-know. The city is a direct democracy of the kind where any citizen may speak and any citizen may move a decree; there is no permanent bureaucracy, no organised party, no loyal opposition, no civil service to carry out what the assembly decides, and no way for a proposer to know in advance how much of the consequences will land on him. I want three acts, each taking its shape from one of the episodes without announcing it. In the first, the assembly has just heard that a subject ally revolted and has been retaken by force, and must decide what to do with the surviving adult males; the rules should allow the decision to be reversed only by convening a second full assembly the following morning, so that the students feel both how cheap the first decision is and what it costs to undo it, and so that the reversal, when it comes, has to be argued for in front of the very people who voted the other way an hour earlier. In the second act, the assembly must decide whether to send a large expedition, with information deliberately unequally distributed — some students get briefing slips with the enemy's numbers, the distance, and the season, others get nothing but a rumour — and with command handed to whoever argues most attractively; the act must include an unmonitorable interval in which the appointed commanders act and the assembly can see nothing, and it should end with an outcome slip that makes the assembly responsible for a catastrophe it had no way to supervise. In the third act, after the disaster, a participant must move that the surviving commanders be tried together, in a single vote, on a single penalty, in open assembly, with another participant objecting on procedural grounds; I want a designated presiding officer who has to decide whether to put the motion at all, and I want the reconciliation agreement that ended the city's recent civil war — a standing bargain not to prosecute anyone for what they did under the previous regime — to be visibly in tension with the general demand for a scapegoat. I also want a hard deadline in that act, some ritual or military departure that means the verdict has to be reached before dusk, because urgency is itself a procedural weapon. If the shape of the third act admits it, add a short epilogue in which the assembly turns on a notorious teacher whose only offence is his association with the disgraced commanders, and in which the safeguards that were available a few minutes earlier are quietly not invoked because nobody wants them.

  What I need back is the runnable design, not an essay about it. Give me a materials list, and where you use written slips, the actual text of them; a minute-by-minute timeline for the ninety minutes, including where the acts break and how much time the debrief gets; the standing rules of the assembly in enough detail to be printed and posted — who may speak and in what order, how a motion is put and amended, what the presiding officer can and cannot do, how a decision may be revisited, and what happens to a citizen whose motion is defeated; a stake mechanism that produces real pressure without real money (I am willing to use tokens, speaking rights, queuing, or a public tally of standing, but I would rather nobody loses anything material); and the facilitator's scripted interventions, including where to plant confederates, what they should say, and when to let a procedural objection fail. Then the debrief: it should map specific moments in the run onto the actual episodes — the assembly that reversed itself, the expedition voted by people who would not sail, the collective trial of the commanders, the prosecution after the amnesty — and it should distinguish the features of assembly government as such from the features peculiar to the last decade of the fifth century. Tell me what will predictably go wrong the first time I run this and how to handle it without rescuing the students from the problem; I expect at least one act to collapse into ordinary seminar discussion, and I expect the students to be considerably nicer than the Athenians were. Finally, be honest about what the activity cannot reproduce. I already suspect that the fact that the participants know they are in a game with a facilitator who will stop it at ninety minutes, and that none of them will be killed by the decisions they take, is not a trivial difference, and I want to know which parts of the phenomenon I am therefore obliged to assert in the debrief rather than letting them run into.
reasoning: |-
  We are designing a 90-minute simulation of an Athenian-style assembly for a class of 14 students. The simulation has three acts and an epilogue, each based on a historical episode without naming it. The goal is for students to experience the structural problems of direct democracy.

  Materials:
  - Printed handouts (using the printer): 
      a) Briefing slips for Act II (some with detailed information, some with only a rumor).
      b) Outcome slip for Act II (catastrophe report).
      c) A written copy of the standing rules of the assembly (to be posted and distributed).
      d) A written copy of the city's reconciliation agreement (for Act III).
      e) Tokens or some non-monetary stake system (optional, but we'll use a token system to represent "standing" or influence).
  - A timer (for the hard deadline in Act III).

  Stake Mechanism: 
  We'll use a token system. Each student starts with 3 tokens (representing their standing in the community). Tokens can be used to:
     - Speak for an extended time (1 token for an extra minute beyond the initial speaking time).
     - Propose a motion (1 token to propose a motion, which is returned if the motion passes, but lost if it fails).
     - Challenge a procedural decision (1 token, which is returned if the challenge is upheld, lost if not).
  Tokens are earned by:
     - Being on the winning side of a vote (1 token per vote won).
     - Being appointed as a commander in Act II (they get 2 tokens, but note they might lose them later).

  This creates pressure because tokens represent influence and the ability to participate. Without tokens, a student can only listen and vote.

  Standing Rules of the Assembly (to be printed and posted):

  1. The Assembly is open to all citizens (students). The Presiding Officer (PO) is chosen by lot at the start and has the authority to maintain order and enforce these rules.

  2. Speaking:
     - Any citizen may speak when recognized by the PO.
     - The first time a citizen speaks on a motion, they get up to 1 minute without cost. After that, they must use tokens for additional speaking time (1 token per minute).
     - The PO may set a speaking order, usually by recognizing citizens in the order they raise their hands, but may give priority to a citizen who has not spoken yet.

  3. Motions:
     - Any citizen may propose a motion (a formal proposal for action). The proposer must stand and say "I move that [proposal]." The motion must be seconded by another citizen (who says "I second") to be discussed.
     - Once seconded, the motion is open for debate and amendment.
     - Amendments: A citizen may move to amend the motion. The amendment must be seconded. The amendment is voted on first. If passed, the main motion as amended is then voted on.

  4. Voting:
     - Voting is by show of hands. The PO counts and announces the result.
     - A motion passes by simple majority of those present and voting.

  5. Revisiting Decisions:
     - A decision of the Assembly can only be reversed by a new motion at a subsequent Assembly. For the purpose of this simulation, an Assembly decision stands until the next meeting (which we simulate as the next act or a special session).

  6. Presiding Officer (PO) Powers and Limitations:
     - The PO recognizes speakers, enforces time limits, and conducts votes.
     - The PO may rule a motion out of order if it violates the reconciliation agreement (in Act III) or if it is not a proper subject for the Assembly (but note: in our simulation, the PO has no judicial review; they can only enforce procedural rules).
     - The PO's ruling can be challenged by any citizen who offers 1 token. The challenge is put to a vote of the Assembly. If the challenge passes (by majority), the ruling is overturned.

  7. Penalties for Defeated Motions: The proposer of a motion that is defeated loses the token used to propose it (if any). The seconder loses nothing.

  8. Time Limits: The PO must keep the Assembly moving. Each act has an overall time limit.

  Simulation Timeline (90 minutes total):

  - Introduction (5 minutes)
  - Act I: Mytilenaean Debate (25 minutes)
  - Act II: Sicilian Expedition (25 minutes)
  - Act III: Trial of the Generals and Epilogue (30 minutes)
  - Debrief (5 minutes)

  Detailed Breakdown:

  Introduction (5 minutes):
  - Explain: "Today we are simulating an emergency assembly of the city of Heliopolis (a fictional ancient Greek city). You are all citizens. The city is a direct democracy: any citizen can speak, propose motions, and vote. We have a set of rules (handout) that we will follow. Each of you starts with 3 tokens which represent your standing. Use them wisely. I will play the role of the Herald (facilitator) and will occasionally deliver news. We have a Presiding Officer (PO) for each act, chosen by lot."

  - Choose the first PO by drawing a name from a hat. Give the PO a copy of the rules and explain their role briefly.

  Act I: The Mytilenaean Debate (25 minutes total)

  - Herald (instructor) sets the scene: "Citizens of Heliopolis! We have just received news: our ally, the city of Oenoe, has revolted. Our general, Diocles, has retaken the city by force. The revolt is crushed. Now, we must decide the fate of the surviving adult male citizens of Oenoe. Our general has sent a messenger: he waits outside for our decision. We must decide today!"

  - The PO opens the floor for motions. The expected motion: to execute all adult males and enslave the women and children.

  - Confederates: Plant one student (or more) to propose the harsh motion. Another to second.

  - Debate: Let the debate run for 10-15 minutes. Encourage emotional appeals.

  - Vote: The harsh motion passes (as it did historically).

  - Then, the Herald announces: "It is now evening. The messenger is sent with the decree. But overnight, some of you have second thoughts. You call for a second assembly to reconsider. The rules require that we meet again tomorrow morning. We are now in the second assembly."

  - The PO (same or new? Let the same PO continue for continuity) opens the new session.

  - Herald: "The same question is before you: what shall be done with the men of Oenoe? But now, the messenger has not yet arrived at Oenoe. We can recall him if we act now."

  - A new motion to repeal the previous decree and instead only execute the ringleaders and pardon the rest is proposed (by a confederate or a student).

  - Debate: Focus on the cost of reversing: the first decision was made in anger, now they must face the same people and change their minds. Also, the proposer of the first motion might be attacked.

  - Vote: The repeal passes (as it did in Athens).

  - Time: The two assemblies in one act: 10 minutes for the first decision, 10 minutes for the reconsideration, 5 minutes for transition and voting.

  Act II: Sicilian Expedition (25 minutes)

  - Herald: "Citizens, we now turn to a new matter. Our scouts report that the island of Melos, a colony of our enemy Corinth, is vulnerable. They say Melos is rich and its defenses are weak. Some of you have been advocating for an expedition to conquer Melos. We must decide whether to send an expedition and, if so, appoint commanders."

  - Unequal information: Hand out briefing slips to 4-5 students (about 1/3 of the class). The rest get nothing.

    - Briefing slip text: "CONFIDENTIAL: You have reliable intelligence. The distance to Melos is 200 miles by sea. The season is late autumn; storms are common. The Melian forces: 2,000 hoplites and 20 triremes. They are expecting reinforcements from Corinth in 20 days."
    - Rumor slip (for the others, if any): "RUMOR: Melos is rich and weakly defended. Victory would bring glory and wealth."

  - Motion: A motion to send an expedition of 40 triremes and 4,000 hoplites. The motion must also appoint commanders (by naming them, or the assembly can amend to add names).

  - The PO opens the floor. Expect a student to propose the expedition. The briefing slip holders might try to share information, but they may be drowned out by enthusiastic speakers without information.

  - The assembly must appoint commanders. They can appoint one or more. The appointment is by motion: "I move that we send an expedition as described and appoint [student names] as commanders." The appointed commanders must be present and will be given a special task.

  - Once the motion passes, the commanders are given a sealed envelope by the Herald and taken aside (or to a corner) for 3 minutes. The envelope contains:

    - Commander's orders: "You have 3 minutes to decide: (a) sail directly to Melos and attack immediately, (b) sail to a nearby island to gather supplies and then attack, or (c) send a delegation to Melos to demand surrender. Write your choice and return it to the Herald."

  - While the commanders deliberate, the assembly waits. They cannot see or hear the commanders.

  - After 3 minutes, the commanders return. The Herald then reads the outcome slip:

    - "The commanders chose to sail directly to Melos. A storm scattered the fleet; 20 ships were lost. The remaining force landed and was defeated by the Melians. The survivors are besieged on the beach. The Melians are demanding ransom for their release."

  - The Herald announces: "Citizens, the expedition has ended in disaster. We have lost 20 ships and 2,000 men. The rest are captured. The enemy demands a ransom of 100 talents for their return."

  - This act ends with the assembly facing the consequences.

  Act III: Trial of the Generals and Epilogue (30 minutes)

  - Herald: "Citizens, we are in crisis. The disaster at Melos has caused anger and fear. We must decide what to do about the surviving commanders, who have just returned. They are present." (The commanders from Act II are now in the assembly.)

  - Motion: A confederate (or a student) moves: "I move that the commanders be tried together, in a single vote, and that they be sentenced to death."

  - Procedural tension: Another student (confederate) objects: "But citizens, we have a reconciliation agreement! After our civil war, we agreed not to prosecute anyone for actions taken in office. This trial violates that agreement." (The reconciliation agreement is posted or read: "Reconciliation Agreement of Heliopolis: No citizen shall be prosecuted for acts committed during the civil war or during their term of public office, except for embezzlement of public funds.")

  - The PO must decide whether the motion is in order. The PO might rule it out of order because of the agreement, but then a challenge can be made (with a token). If challenged, the assembly votes on whether to override the agreement for this case.

  - Hard deadline: The Herald announces: "We must finish before dusk because the annual sacrifice to Athena must be performed at sunset, and the priests say that if we do not complete the trial by then, the gods will be angry. We have 15 minutes."

  - The debate and vote must be rushed. The motion passes (as it did for the generals after Arginusae).

  - Epilogue: After the trial, the Herald says: "Now that the commanders have been condemned, some of you recall that the philosopher Crito was known to be their teacher. He taught them strategy and rhetoric. He is here today." (Designate a student as Crito, who has not been active.)

  - Without any formal motion, the assembly turns on Crito. Someone shouts, "What about Crito? He taught them!" Others take up the cry.

  - The PO might try to maintain order, but the Herald announces: "The crowd is angry. They are not waiting for a formal motion. They seize Crito and drag him to prison." (This is narrated, not acted out.)

  - The point: safeguards are ignored in the heat of the moment.

  Debrief (5 minutes):

  - Quickly map the acts to history:
    - Act I: Mytilenaean Debate (427 BC) - the decision to kill all men of Mytilene and then the reversal.
    - Act II: Sicilian Expedition (415-413 BC) - the decision to send the expedition based on incomplete information and the disaster that followed.
    - Act III: Trial of the Generals (406 BC, after Arginusae) - the collective trial and execution of the generals. The epilogue is the trial of Socrates (399 BC), though note that Socrates was not tried in the same assembly.

  - Structural problems of assembly government:
    - Emotional decision-making and reversals (Act I).
    - Decisions made without adequate information, especially by those who won't bear the risk (Act II).
    - Scapegoating and disregard for procedure in times of crisis (Act III).
    - The tension between the rule of law (reconciliation agreement) and popular anger.

  - Features peculiar to the late fifth century: 
    - The strain of the Peloponnesian War, which exacerbated these tendencies.
    - The absence of institutional checks (like judicial review) that might have prevented the collective trial.

  What will go wrong:
  1. Students may be too nice: They might not propose harsh measures. Confederates are needed to propose the initial harsh motion in Act I and the death penalty in Act III.
  2. Act II might lack energy: Without the briefing slips being shared effectively, the expedition might not be proposed. The Herald can remind them: "Remember, Melos is rich and weakly defended!" to stir enthusiasm.
  3. Procedural challenges might not arise: The facilitator (as Herald) can whisper to a student to raise a point of order or challenge the PO.
  4. Time management: The facilitator must keep time strictly and move things along. Use a timer.

  What the activity cannot reproduce:
  - Real stakes: No one dies or loses property. The token system is artificial.
  - The long-term consequences: In the simulation, the city resets after 90 minutes. In reality, these decisions led to Athens losing the war.
  - The scale: 14 students vs. thousands of Athenians. The dynamic of a large crowd is missing.
  - The social and cultural context: Athenian values, the role of religion, the fear of stasis (civil strife) are hard to simulate.

  Therefore, in the debrief, emphasize:
  - The Athenians were making decisions in a brutal war, with real fear of annihilation.
  - The assembly was huge (6,000 citizens) and could be swayed by skilled orators.
  - The lack of a bureaucracy meant that the same body that made the decision had to oversee its execution, leading to second-guessing.

  Facilitator Scripted Interventions:

  - Act I:
     - If no one proposes the harsh motion within 2 minutes, the Herald can say: "General Diocles recommends executing all adult males and enslaving the women and children, to set an example."
     - After the first vote, when moving to the second assembly: "The night has passed. Some of you are having second thoughts. You hear that the people of Oenoe were misled by their leaders and that the common people were forced to revolt."

  - Act II:
     - When handing out slips, give detailed ones to students who are usually quiet, to encourage them to speak up.
     - If the expedition isn't proposed: "A citizen stands and says: 'We have a chance to strike a blow against Corinth and enrich ourselves. Let's conquer Melos!'"
     - During the commanders' deliberation, keep the assembly waiting: "The commanders are discussing their plans. The assembly waits anxiously."

  - Act III:
     - If no one moves to try the commanders: "A relative of one of the dead soldiers stands and shouts: 'The commanders must answer for this disaster!'"
     - If the reconciliation agreement isn't invoked: Whisper to a student: "Remember the agreement we made after the civil war?"
     - For the epilogue: If the students don't turn on Crito, the Herald can say: "As you leave, you hear mutters: 'This is all Crito's fault. He taught them how to be reckless.'"

  Materials List:
  1. Tokens: 42 small pieces of paper (3 per student) or use something like poker chips if available.
  2. Handouts:
     - Standing Rules (one per student and one posted).
     - Briefing slips for Act II: 5 with detailed info, 9 with rumor (or none for the rest).
     - Outcome slip for commanders (in a sealed envelope).
     - Reconciliation Agreement (for Act III, posted).
  3. Timer (for Act III deadline and commander deliberation).
  4. Hat for drawing the PO.

  This design should fit 90 minutes and create the desired unease.
answer: |-
  ### Simulation Design: "Assembly of Heliopolis"  
  **Goal:** Create experiential unease about direct democracy's structural flaws without referencing Athenian events explicitly.  

  ---

  ### **Materials List**  
  1. **Printed Rules & Agreements** (1 copy per student + posted on wall):  
     - **Standing Rules of the Assembly** (see below).  
     - **Reconciliation Agreement** (for Act III): *"After the civil war of 403 BCE, the Assembly swore an oath: 'No citizen shall be prosecuted for acts committed under the previous regime, except for murder by their own hand.' Violators face exile."*  
  2. **Slips of Paper** (pre-printed for distribution):  
     - **Act I**: No slips.  
     - **Act II**:  
       - **Detailed Briefing (5 students)**: *"MILITARY INTELLIGENCE: Sicilian forces = 20,000. Syracuse is fortified. Distance = 900 km (6 weeks by sea). Autumn storms begin in 3 weeks. Grain reserves low."*  
       - **Rumor Slip (9 students)**: *"RUMOR: Sicily is weak and rich. Victory is certain."*  
     - **Act II Outcome Slip** (for facilitator only): *"OUTCOME: The fleet was destroyed in a storm. 8,000 dead. Survivors enslaved. Enemy counterattack imminent."*  
     - **Act III**: **Hard Deadline Notice**: *"The annual Feast of Demeter begins at dusk. No business may continue after sunset."*  
  3. **Tokens**: 42 clay/paper tokens (3 per student).  
  4. **Timer**: For Act III deadline (15-minute countdown).  
  5. **Name Tags**: 14 tags with fictional citizen names (e.g., "Lysias," "Charmides").  
  6. **Facilitator Props**: Gavel (or pen to tap), "Herald" name tag.  

  ---

  ### **Standing Rules of the Assembly**  
  *(Print and post)*  
  1. **Presiding Officer (PO)**: Chosen by lot. Powers:  
     - Recognizes speakers.  
     - Rules on procedural objections.  
     - Enforces time limits.  
     - Cannot veto motions or refuse a vote (unless reconciliation agreement invoked).  
  2. **Speaking**:  
     - Any citizen may speak when recognized by PO.  
     - Initial speaking time: **1 minute** (use timer). Additional time: **1 token/minute**.  
     - PO must prioritize unrecognized speakers.  
  3. **Motions**:  
     - Any citizen may propose: *"I move that [proposal]."*  
     - Requires a second: *"I second."*  
     - Amendments: Must be seconded; voted on before main motion.  
     - Voting: Show of hands. Majority wins. Tie fails.  
  4. **Revisiting Decisions**:  
     - A decision can only be reversed by a **new assembly** convened the next day.  
  5. **Stake Mechanism (Tokens)**:  
     - Each citizen starts with **3 tokens**.  
     - **Spend tokens to**:  
       - Extend speaking time (1 token/minute).  
       - Propose/re-second a motion (1 token; refunded if motion passes).  
       - Challenge PO’s ruling (1 token; refunded if challenge succeeds).  
     - **Earn tokens**:  
       - Win a vote (+1 token).  
       - Be appointed general (+2 tokens).  
     - **Lose tokens**:  
       - Motion defeated (proposer loses 1 token).  
       - Procedural challenge fails (challenger loses 1 token).  
  6. **Consequences for Defeated Proposers**:  
     - Lose 1 token. May be heckled (facilitator prompts: *"Shame!"*).  

  ---

  ### **Timeline (90 Minutes)**  
  **Total**: Intro (5 min) + Act I (25 min) + Act II (25 min) + Act III + Epilogue (30 min) + Debrief (5 min).  

  #### **Introduction (5 min)**  
  - **Facilitator as "Herald"**: *"Welcome, citizens of Heliopolis! We are a direct democracy: any of you may speak, propose, and vote. Today’s emergency assembly has three items. Rules are posted. Tokens = your influence. Spend wisely. I, the Herald, deliver news but do not interfere. The Presiding Officer (PO) is..."*  
  - **Action**: Randomly select first PO (draw name from hat). Give PO gavel and rules. Start timer.  

  #### **Act I: Revolt of Oenoe (25 min)**  
  *(Based on Mytilenaean Debate)*  
  - **Herald Sets Scene (2 min)**: *"Oenoe, our subject ally, revolted and is now recaptured. We must decide: What to do with the surviving adult males? Our general waits outside for your decree."*  
  - **Confederate 1 (pre-briefed student)**: Proposes harsh motion: *"I move that we execute all men and enslave the women and children."*  
  - **PO Role**: Ensures motion is seconded, opens debate (8 min).  
  - **Facilitator Script**:  
    - If no harsh motion: Herald whispers to confederate: *"Propose the decree."*  
    - If debate stalls: *"Remember: Oenoe betrayed us!"*  
  - **Vote (2 min)**: Motion passes (ensure outcome via confederates).  
  - **Herald Intervenes (1 min)**: *"The decree is sent. Night falls."*  
  - **Second Assembly (12 min)**:  
    - **Herald**: *"Dawn breaks. Some demand we reconsider. A new assembly is convened—but the messenger can be recalled only if we act now."*  
    - **Confederate 2**: Proposes reversal: *"I move to execute only the ringleaders and pardon the rest."*  
    - **PO Role**: Forces reversal advocates to argue before original voters.  
    - **Facilitator Script**:  
      - If no reversal: Herald: *"A citizen weeps: ‘We acted in anger!’"*  
      - If peaceful: PO: *"The proposer of the first motion, defend yourself!"*  
  - **Vote (2 min)**: Reversal passes.  

  #### **Act II: Sicilian Expedition (25 min)**  
  *(Based on Sicilian Expedition)*  
  - **Herald Sets Scene (2 min)**: *"Sicily threatens our trade. Scouts report it is weak. Do we send a fleet?"*  
  - **Distribute Slips (1 min)**: Give 5 students detailed briefing; 9 get rumor slips.  
  - **Confederate 3**: Proposes expedition: *"I move to send 60 ships and 10,000 men to conquer Sicily."*  
  - **PO Role**: Opens debate (5 min). Unequal information creates chaos.  
  - **Appoint Generals (3 min)**:  
    - **PO**: *"Who will command?"*  
    - Citizens nominate charismatic speakers (not briefing holders). Appoint 2–3 "generals."  
    - **Generals receive tokens (+2 each)**.  
  - **Generals’ "Deliberation" (3 min)**:  
    - Generals leave room. Herald gives them a fake "strategy" form (*"Choose: (A) Direct attack, (B) Cautious advance."*).  
    - **Assembly waits in silence**—no monitoring.  
  - **Outcome (1 min)**: Generals return. Herald reads outcome slip: *"Fleet destroyed. 8,000 dead. Survivors enslaved."*  
  - **Assembly Reaction (10 min)**: Anger. PO opens floor for blame.  

  #### **Act III: Trial of Generals + Epilogue (30 min)**  
  *(Based on Arginusae Generals & Socrates)*  
  - **Herald Sets Scene (2 min)**: *"The generals have returned. The city demands justice. Feast of Demeter begins at dusk—we must finish by then."* Start 15-min timer.  
  - **Trial Motion (5 min)**:  
    - **Confederate 4**: *"I move to try all generals together in one vote. Penalty: Death."*  
    - **Confederate 5** (procedural objector): *"Objection! This violates our Reconciliation Agreement—they acted in office!"*  
  - **PO Role (8 min)**:  
    - Must rule on objection. If PO dismisses objection, objector spends token to challenge.  
    - **Facilitator Script**: Ensure challenge fails (PO ignores/assembly votes down).  
  - **Urgency Pressure (5 min)**: Herald: *"Dusk approaches—hurry!"*  
  - **Vote (2 min)**: Motion passes (generals "condemned").  
  - **Epilogue (3 min)**:  
    - **Herald**: *"As you leave, someone shouts: What about Crito? He taught the generals!"*  
    - **Designate "Crito"** (quiet student): No motion, no trial. Assembly shouts: *"Guilty!"*  
    - **Herald Ends**: *"Crito is dragged away. No one invokes the agreement."*  

  #### **Debrief (5 min)**  
  - **Map to Athens**:  
    - Act I: *Mytilenaean Debate*—reversal showed emotional whiplash and cost of undo.  
    - Act II: *Sicilian Expedition*—asymmetric information, lack of oversight, shared risk.  
    - Act III: *Arginusae Generals*—collective trial, urgency weaponized, amnesty ignored.  
    - Epilogue: *Socrates*—safeguards abandoned in mob momentum.  
  - **Structural Flaws vs. Context**:  
    - **Assembly Flaws**: Rash reversals (Act I), amateur decision-making (Act II), no due process (Act III).  
    - **Fifth-Century Athens**: War pressure, no judicial review, demagogues exploited urgency.  
  - **Predictable Problems & Fixes**:  
    - **Problem**: Students are too nice (no harsh motions).  
      - **Fix**: Use confederates; Herald stokes emotion (*"Oenoe murdered your envoys!"*).  
    - **Problem**: Act II collapses into discussion.  
      - **Fix**: Herald interrupts: *"The crowd roars—speak now or vote!"* Enforce 1-min speeches.  
    - **Problem**: Procedural objections succeed.  
      - **Fix**: PO "accidentally" ignores objections; Assembly votes down challenges.  
    - **Problem**: Time overruns.  
      - **Fix**: Herald uses urgency (*"Dusk approaches!"*); skip epilogue if needed.  
  - **What Cannot Be Simulated**:  
    - **Real Stakes**: No death/exile—students know it’s a game. *Debrief: "Athenians voted knowing they might starve if a fleet sank."*  
    - **Scale**: 14 students vs. 6,000 Athenians. *Debrief: "Imagine the roar of a crowd silencing doubt."*  
    - **Long-Term Fear**: No cumulative consequences. *Debrief: "Athens’ civil war trauma made amnesty sacred—until it wasn’t."*  
    - **Cultural Context**: Religion, honor economy. *Debrief: "Urgency wasn’t just tactical; missing a feast angered the gods."*  

  ---  
  **Final Note**: This simulation forces structural flaws to emerge organically. Confederates (4–5 students) are crucial—brief them pre-session. Debrief ties experience to history without lecturing. Students leave uneasy—they’ve *lived* the pathology.
