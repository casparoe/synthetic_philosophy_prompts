answer: |-
  Here’s a translation of the textualism/purposivism debate into your economic framework, followed by a residue analysis and verdict on whether the disagreement dissolves:

  ### Core Translation (Textualism vs. Purposivism as Contractual Frameworks)
  | **Legal Concept**          | **Textualism (Economic Translation)**                          | **Purposivism (Economic Translation)**                          |
  |----------------------------|----------------------------------------------------------------|-----------------------------------------------------------------|
  | **Statute**                | Incomplete contract with explicit terms; court is agent bound to enforce written provisions. | Incomplete contract with implicit relational terms; court is gap-filler for unforeseen states. |
  | **Enacted Text**           | Sole verifiable performance metric; only enforceable "term" against moral hazard. | Starting point for gap-filling; evidence of the "bargain’s" core exchange. |
  | **Legislative History**    | Inadmissible pre-contractual noise (unobservable to all parties ex ante). | Costly signals of the coalition’s shared intent (reduced-form focal points). |
  | **Canons of Construction** | Default rules for resolving textual ambiguity (majoritarian defaults parties would likely adopt). | Heuristics for inferring purpose; defaults rebuttable by contextual evidence. |
  | **Absurdity Doctrine**     | *Forcing term* to prevent catastrophic payoff (akin to *force majeure*). | Efficiency-preserving gap-filling (Pareto-improving ex post adaptation). |
  | **Purposivism**            | N/A (rejects gap-filling beyond text). | Gap-filling via hypothetical bargain under veil of ignorance (Harsanyi/Rawls). |
  | **Deference to Agencies**  | Delegation to better-informed agent with monitoring (Chevron as incentive mechanism). | Optimal specialization + adaptation (agency as low-cost gap-filler). |
  | **Stare Decisis**          | Network externality: preserves focal points to reduce transaction costs. | Path-dependent adaptation: revises defaults toward evolving purpose. |

  ### Residue Report: What Doesn’t Translate Cleanly
  1. **The Principal-Agent Problem’s Core Flaw**  
     Your suspicion is correct: there is no coherent principal. A legislature is a multi-agent coalition with:  
     - Cycling preferences (no Condorcet winner)  
     - Unobservable types (no mechanism design can elicit true intent)  
     - Changing membership (coalition at t≠enactment ≠ coalition at t>0)  
     *→ "Legislative intent" is indeed a category error, not an evidentiary gap. Purposivism’s "hypothetical bargain" imposes coherence where none exists.*

  2. **Third-Party Binding Problem**  
     Courts issue public goods (rules) for non-parties. Unlike renegotiating parties:  
     - Strangers lack voice in ex post adaptation  
     - Rules create externalities (positive/negative)  
     - No Coasean bargaining to correct inefficiencies  
     *→ Gap-filling isn’t welfare-improving if it redistributes surplus to non-parties.*

  3. **Non-Renegotiability**  
     The enacting coalition cannot renegotiate with the present legislature (no repeat play). This breaks the *Telser* self-enforcing equilibrium:  
     - Ex post adaptations aren’t constrained by reputation  
     - Courts face no penalty for "over-filling" gaps  
     *→ Flexibility induces moral hazard by the court-agent.*

  4. **Authority vs. Efficiency Trade-off**  
     Textualism privileges *ex ante legitimacy* (democratic ratification of text); purposivism prioritizes *ex post efficiency* (adaptation to new states).  
     - **Untranslatable Element:** Legitimacy isn’t contractible. Lawyers see textual adherence as a constitutional duty (principal’s command), not a welfare calculation.  

  5. **The Constitutional Constraint**  
     Separation of powers imposes hard boundaries:  
     - Courts aren’t mere gap-fillers but agents with limited mandate  
     - "Delegation" to agencies faces non-contractible constraints (non-delegation doctrine)  
     *→ Legal debate invokes *authority* (who decides?) where economics sees *capability* (who solves best?).*

  ### Verdict: Does the Translation Dissolve the Disagreement?
  **No.** While *some* tensions reduce to commitment vs. flexibility trade-offs (e.g., canons as defaults), the irreducible residue is **legitimacy under non-contractible constraints**.  

  - **Textualism’s Non-Economic Core:**  
    "Words enacted are the only democratically ratified act." Deviations—even efficient ones—violate agency boundaries (breaking the "contract" with voters).  

  - **Purposivism’s Non-Economic Core:**  
    "Statutes are promises of *outcomes*, not words." Fidelity requires courts to act as trustees for the coalition’s *projected purpose* when incomplete.  

  **What Your Framework Misses**:  
  1. **Legitimacy as a Production Input**:  
     Legal rules gain compliance partly through perceived legitimacy. Textualism argues its method yields higher compliance dividends by constraining judicial moral hazard.  

  2. **Veil of Ignorance as a Focal Point**:  
     Purposivism’s "hypothetical bargain" relies on a Rawlsian construct alien to mechanism design—it assumes parties seek *fairness*, not efficiency.  

  3. **The Constitutional Shadow**:  
     Lawyers debate within a fixed institutional assignment (courts interpret, legislatures legislate). This assignment isn’t a contract term but an exogenous constraint.  

  **Conclusion**: The heat stems from incommensurable values:  
  - **Textualists** treat the *enactment moment* as sacred (ratification = legitimacy)  
  - **Purposivists** treat the *legislative enterprise* as sacred (purpose = legitimacy)  
  Your framework exposes efficiency trade-offs but cannot resolve this clash because **legitimacy claims are not Pareto-comparable**. The debate is unavoidably "vague" because it rests on contested theories of democratic authority—a dimension economics brackets. To engage, you must grapple with law’s core problem: *How to allocate interpretive authority when the principal is incoherent?* That’s a constitutional design question, not a contracting one.
