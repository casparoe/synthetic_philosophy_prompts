prompt: |-
  ok so for ethics class we have to write about this passage from Augustine's On Lying and i've read it like five times and i still can't tell what he's actually claiming. heres the passage:

  "Wherefore, that man lies, who has one thing in his mind and utters another in words, or by signs of whatever kind. Whence also the heart of him who lies is said to be double; that is, there is a double thought: the one, of that thing which he either knows or thinks to be true and does not produce; the other, of that thing which he produces instead thereof, knowing or thinking it to be false. Whence it comes to pass, that he may say a false thing and yet not lie, if he thinks it to be so as he says although it be not so; and, that he may say a true thing, and yet lie, if he thinks it to be false and utters it for true, although in reality it be so as he utters it. For from the sense of his own mind, not from the verity or falsity of the things themselves, is he to be judged to lie or not to lie."

  i think i get the rough idea, its about what you meant rather than about the facts. but the last line seems to say the facts dont matter at all, and that seems obviously wrong to me. two cases i can't figure out:

  1) say i'm sure the party got moved to friday, so i tell my friend its on saturday, and it turns out i was wrong and it really is on saturday. did i lie? he seems to say yes?? and the other way round: if i say something false that i honestly think is true (i tell my friend the party is saturday cause thats what i believe, but it actually got moved), he says i didn't lie, but a few sentences earlier he also says that guy is still not "without fault". so if it wasn't a lie then what am i actually guilty of there? that part feels like it contradicts the whole "lying = having two thoughts in your head" thing.

  2) if i repeat something my friend told me while thinking "shes definately making this up", and it happens to be true, he says i lied. but i didn't say anything false and nobody was decieved. how is that a lie? is the whole thing just about me *wanting* to decieve someone, regardless of what actually happens?

  and the bit i really dont get is the heart being double. is the wrong of lying just that your words and your mind dont match? cause thats a weird thing to be the big moral problem, why would it matter more than messing with someones beliefs or hurting them? does it mean a bluff that fails (i say i've got a gun, they can see i dont) is still a lie? is sarcasm fine because nobody's fooled? and my teacher said augustine thinks lying is never ok even to save someones life, which sounds insane to me, so i want to know what harm he thinks a lie does that makes it always wrong. help?
