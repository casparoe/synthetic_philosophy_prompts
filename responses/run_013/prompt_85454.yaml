  We are to consider the problem of concept induction from contrasting examples, as epitomized by Bongard problems. The task is to write desiderata for a theory of this process, then critically analyze these requirements.

  Desiderata for an Adequate Theory:

  1. **Selectivity from Indefinite Possibilities (The Distinction Problem)**: 
     - *Motivation*: For any finite pair of positive and negative example sets, there are infinitely many rules that separate them. Yet, human solvers converge on one intended rule and dismiss others as incorrect. The theory must explain what selects this intended rule over others. It must also address whether there is a fact of the matter when multiple rules seem defensible (i.e., if both rules are consistent with the given examples but one is intended, how do we choose?).

  2. **Contrastive Nature of Information**:
     - *Motivation*: The rule is induced from the contrast between the two sets. Neither set alone is sufficient. Moreover, a rule that only separates the given examples but fails on new instances (i.e., overfits) is not acceptable. The rule must generalize appropriately.

  3. **Open Vocabulary of Primitives**:
     - *Motivation*: The rules are built from a set of primitive concepts (like counting, topology, symmetry, etc.) that are not fixed in advance. The same set of primitives appears across different problems, allowing for transfer of learning. The theory must account for how these primitives are selected and composed.

  4. **Computational Realism**:
     - *Motivation*: The theory must describe a procedure that could actually be run (by a human or machine) to arrive at the rule in one shot, without relying on external sources. It should not be a post-hoc description of the answer.

  5. **Grading of Difficulty**:
     - *Motivation*: Problems vary in difficulty (e.g., some are solved quickly, others take longer or are unsolved by many). The theory should at least be able to rank problems by difficulty.

  Now, let's critically analyze these requirements.

  Analysis of Requirements:

  We must distinguish genuine requirements (which are inherent to the phenomenon) from parochial ones (which are tied to a particular theoretical approach). Then, we look for conflicts and identify the requirement that most excludes obvious families of accounts.

  - **Genuine vs. Parochial**:
    - *Genuine*: 
      - **Selectivity**: The fact that humans converge on a particular rule and that there is an intended rule is a core phenomenon.
      - **Contrastive Nature**: The rule must generalize beyond the given examples and is defined by the contrast. This is inherent in the problem setup (the rule must hold for all positive and none of the negative, and we expect it to hold for new instances).
      - **Open Vocabulary**: The recurrence of primitives and the transfer of competence are observed. The theory must explain how the solver can use an unbounded set of concepts without prior fixation.

    - *Parochial*:
      - **Computational Realism**: While it is important that the theory is not just a post-hoc rationalization, the requirement that it must be a procedure that can be run might be too strong. Some theories might be abstract and still capture the essence without being algorithmic. However, given the problem context (one-shot induction without feedback) and the need to account for the actual process, this requirement is likely genuine for this problem. But note: it rules out theories that are purely normative (like Bayesian models without a plausible algorithmic counterpart) if they cannot be run in practice.

      The requirement of being runnable might be seen as parochial if we are only interested in the computational-level theory (in Marr's terms). However, the problem statement explicitly asks for a procedure that could be run, so we keep it.

    - **Grading of Difficulty**: This might be seen as parochial if we are only concerned with the correctness of the solution. However, the variation in difficulty is a real phenomenon and any theory that does not account for it would be incomplete. Hence, it is genuine.

  - **Conflicts**:
    There is a potential conflict between:

      - **Open Vocabulary** (requiring an unbounded set of primitives and their composition) and 
      - **Computational Realism** (requiring that the procedure can be run in a reasonable time, especially since humans solve some problems quickly).

    The open vocabulary implies that the search space for rules is very large (or infinite). Yet, the solver must find the rule in one shot without exhaustive search. How can the procedure avoid combinatorial explosion? This is a fundamental challenge.

    Also, note that **Selectivity** and **Contrastive Nature** together require that the rule not only separates the given examples but also generalizes correctly. However, without additional constraints (like Occam's razor or a prior over rules), it is hard to see how the solver avoids overfitting. But the problem does not provide feedback, so the solver must have built-in biases.

    Therefore, the conflict is between the unboundedness of the rule space (from Open Vocabulary) and the feasibility of the search (Computational Realism). We must have a way to restrict the search to a tractable set of rules without pre-specifying a fixed set.

  - **The Requirement that Excludes Obvious Families**:

    The requirement that most excludes obvious families of accounts is **Open Vocabulary**. 

    Why?
    - **Classification by similarity**: If we try to define the rule as a similarity to the positive set, we run into the problem that the rule is defined by the contrast. Also, similarity would require a fixed set of features, but the features (primitives) are not fixed and can be composed arbitrarily.
    - **Fixed set of features**: The theory must allow for an open-ended set of primitives and their compositions, so a fixed feature set (like in traditional machine learning) would fail because it cannot handle novel concepts that require new primitives.
    - **Statistical learning over a preset representation**: This fails for the same reason: the representation is preset and cannot accommodate the open vocabulary.
    - **Memorization of previously solved problems**: This is excluded because the solver must work on novel problems without precedents (as per the problem statement: "no external source of rules, answers, or precedents").

    Therefore, **Open Vocabulary** is the key requirement that forces the theory to go beyond these standard approaches.

  Conclusion:

  The list of requirements:

  1. **Selectivity**: Explain how the intended rule is selected from infinitely many possibilities and address the issue of multiple defensible rules.
  2. **Contrastive Nature**: The rule must be induced from the contrast and must generalize beyond the given examples.
  3. **Open Vocabulary**: The rule must be built from an open set of primitives that can be composed and that recur across problems.
  4. **Computational Realism**: The theory must describe a feasible procedure that can arrive at the rule in one shot without external help.
  5. **Grading of Difficulty**: The theory should account for the variation in problem difficulty.

  Among these, the requirement of **Open Vocabulary** is the one that most clearly excludes the obvious families of accounts. The conflict between **Open Vocabulary** and **Computational Realism** is a fundamental challenge: how to search an unbounded space of rules in a tractable way?

  This conflict suggests that any adequate theory must incorporate strong biases (e.g., a prior over rules that favors simplicity, or a mechanism for incremental construction of rules from primitives) to constrain the search. Moreover, these biases must be aligned with the recurring primitives (so that the same set of primitives is reused) and must explain why some problems are harder (when the intended rule is complex or when the primitives required are not readily available).

  Thus, the deliverable list of requirements is as above, with the understanding that they are interdependent and that the theory must resolve the tension between an open-ended rule space and computational feasibility.
answer: |-
  ### Desiderata for a Theory of Contrast-Based Concept Induction (Bongard Problems)

  The following requirements are derived from the phenomenon of one-shot concept induction from contrasting examples, as exemplified by Bongard problems. Each requirement is grounded in a specific aspect of the problem that an adequate theory must address. The theory must explain how a solver, with no external resources or feedback, arrives at the *intended* rule in a single attempt.

  1. **Rule Selection from Indefinite Alternatives**  
     *Motivation*: Any finite pair of example sets admits infinitely many rules that separate them (e.g., "all left-set figures have exactly 3 dots" vs. "all left-set figures have an odd number of dots" for the same data). Yet solvers converge on one rule as "correct" and reject others as implausible. The theory must explain what breaks this symmetry—why one rule is selected over others—and whether there is a fact of the matter when multiple rules seem defensible (e.g., if two rules fit the examples equally well but one is intended).  
     *Phenomena*: Solvers agree on solutions despite underdetermination; they dismiss arbitrary rules (e.g., "figures with top-left pixel shaded") as "wrong" even when consistent.

  2. **Contrast-Dependent Generalization**  
     *Motivation*: The rule is induced from the *difference* between the two sets, not from either set alone. A rule that merely partitions the given examples (e.g., memorizing the specific figures) fails to generalize to new instances. The theory must ensure the rule captures the underlying contrast such that it extends beyond the training examples.  
     *Phenomena*: Solvers produce rules that apply to novel figures; rules like "shapes in the left set" are rejected as inadequate.

  3. **Open-Ended Primitive Vocabulary**  
     *Motivation*: Rules are constructed from primitives (e.g., symmetry, containment, topology) not fixed in advance. The same primitives recur across problems (e.g., "connectedness" appears in multiple Bongard problems), enabling transfer of competence. The theory must allow for composition of novel concepts from reusable, domain-general primitives.  
     *Phenomena*: Solvers apply concepts like "convexity" or "line intersection" without having seen them in prior problems; solutions transfer to new contexts.

  4. **Computational Tractability in One Shot**  
     *Motivation*: Solvers arrive at the rule quickly, with no trial-and-error or brute-force search. The theory must describe a procedure that could realistically run in human cognition (e.g., with feasible time/space complexity) without relying on post-hoc analysis.  
     *Phenomena*: Solvers solve easier problems in seconds; the process feels intuitive, not exhaustive.

  5. **Difficulty Grading**  
     *Motivation*: Problems vary in empirical difficulty (e.g., BP#1 is trivial; BP#55 is hard). The theory must at least ordinally rank problems by difficulty, aligning with human performance (e.g., via solution time or error rates).  
     *Phenomena*: Some problems are solved consistently faster; others elicit more incorrect attempts.

  ---

  ### Critical Analysis of Requirements

  **Genuine vs. Parochial Requirements**  
  - **Genuine** (inherent to the phenomenon):  
    - *Rule Selection*: Required to explain consensus on intended rules despite underdetermination.  
    - *Contrast-Dependent Generalization*: Required to explain why rules generalize beyond examples.  
    - *Open-Ended Primitive Vocabulary*: Required to explain transfer and novelty in concept construction.  
  - **Parochial** (theory-specific demands):  
    - *Computational Tractability*: While solvers *do* compute rules efficiently, demanding a *specific* tractable procedure (e.g., polynomial-time) risks conflating the *what* (competence) with the *how* (performance). Human cognition may use heuristics that are fast but not universally efficient.  
    - *Difficulty Grading*: While difficulty is real, it is an *emergent* property; a theory might explain selection/generalization without explicitly ranking problems. Ranking is useful but secondary to core competence.  

  **Conflict Among Requirements**  
  The requirements **Rule Selection**, **Open-Ended Primitive Vocabulary**, and **Computational Tractability** cannot be jointly satisfied without additional constraints.  
  - **Conflict**: The open-ended vocabulary implies an unbounded space of possible rules (due to primitive composition). Rule selection requires identifying a *unique* intended rule from this space. Computational tractability demands this be done efficiently (e.g., without enumerating all possibilities). However, without strong biases, an unbounded search is intractable.  
  - **Result about the Problem**: Bongard problems inherently require *biased search*—the solver must prioritize simple, compositional, or reusable rules. A theory must explain these biases (e.g., simplicity priors) to resolve the conflict. Absent such biases, the triplet of requirements is unsatisfiable.  

  **Most Exclusionary Requirement**  
  **Open-Ended Primitive Vocabulary** excludes the obvious families of accounts:  
  - **Classification by Similarity** (e.g., prototype models): Fails because rules are contrast-dependent and compositional (e.g., "symmetrical *and* containing a circle" cannot be reduced to similarity).  
  - **Fixed Feature Sets** (e.g., decision trees with preset attributes): Fails because primitives are not fixed; solvers invent new features (e.g., "number of holes") as needed.  
  - **Statistical Learning** (e.g., SVM/kernel methods): Fails because it relies on a preset representation; it cannot construct novel primitives (e.g., "Euler characteristic") from scratch.  
  - **Memorization/Precedents**: Explicitly excluded by the "no external sources" constraint.  

  This requirement forces the theory to explain how *new* concepts are synthesized from basic primitives, ruling out static representations.  

  ---

  ### Summary Deliverable  
  **Core Requirements** (non-negotiable):  
  1. Rule selection from indefinite alternatives.  
  2. Contrast-dependent generalization.  
  3. Open-ended primitive vocabulary.  
  **Secondary Requirements** (explanatorily useful but not fundamental):  
  4. Computational tractability.  
  5. Difficulty grading.  
  **Key Conflict**: Unbounded rule space (from 3) vs. unique selection (1) vs. tractability (4) → resolved only with innate/learned biases.  
  **Most Exclusionary Requirement**: Open-ended primitive vocabulary (3).
