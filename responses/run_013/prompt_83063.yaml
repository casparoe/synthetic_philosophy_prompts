prompt: |-
  You are an experienced teacher of archival theory and history, and I need help preparing a single 75-minute seminar for first-year MA students in a public-history program. The students are bright but have never worked with primary sources, and they arrive assuming that archives are neutral warehouses of facts and that history is simply what the documents say happened. I want to teach them one concept: that archival power operates through the act of recording itself—through what a form asks for, who is authorized to write in it, which categories make a person legible to an institution, and which parts of a life are left as blank space—so that the silences in a source are often positive products of record-keeping rather than simple gaps where nothing happened. Please do not explain the concept to me. Plan how I should teach it. Give me the order in which the ideas must be introduced and why each depends on the one before it; the single concrete document or case that should carry the whole session and what it must have and lack to do that work; the misconceptions the students will predictably bring or form—such as that silence means the event did not occur, that power in archives is only censorship, or that a more inclusive archive would automatically solve the problem—and exactly where in the sequence I should head each one off; one question or short exercise I can use at the end to see whether they have understood the concept rather than merely memorized a slogan; and what I should deliberately leave out at this level, with a note on how to say so to the students. Before you draft the plan, brainstorm privately about the candidate orders and the likely misconceptions, then give me a polished, practical teaching plan written as advice to me, not as a lecture script.

  For the carrying example, I am considering a single page from a fictional but historically plausible poor-law admissions register: columns for name, age, parish, cause of admission, discharge, and remarks. Most rows are routine; a few have remarks such as disorderly, destitute, or no friends. The only entry for one young woman is a name, an age, a parish, and the remark disorderly, with no discharge date. I want the session to pivot on that page and on the blank remarks in the other rows. If you think a different kind of record—a plantation ledger, a census form, a hospital admission book, a police occurrence book—would make the dependency structure clearer, say so and explain what the replacement must have and lack; otherwise, show me how to build the sequence around the register. Assume I have no slides, only a whiteboard and the handout. Do not give me reading lists or citations; I need the pedagogical sequence itself. Your plan should be specific enough that I could walk into the room and follow it.
