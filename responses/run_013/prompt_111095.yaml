  For Round 2, we give the material conditional message: P(¬North ∨ NZ) = 0.8.

  This means P(NR) = 0.2. Then how do they update?

  Rule A: They set P(NR)=0.2. Then they have to redistribute the remaining 0.8. They might:
     - Keep the ratios of the other three cells: so multiply each by 0.8/0.75 (since prior mass on the other three is 0.75). Then:
          P(NZ)=0.25 * (0.8/0.75) = 0.25 * (16/15) ≈ 0.2667
          P(SZ)=0.25 * (16/15) ≈ 0.2667
          P(SR)=0.25 * (16/15) ≈ 0.2667
          P(NR)=0.2
          Then P(North)=0.2667+0.2=0.4667.

  Rule B: They might think that the constraint only affects the North, so they set P(NR)=0.2, and then within the North, they set P(NZ) and P(NR) in the ratio 4:1? But then P(NR)=0.2 and P(NZ)=0.8? But then the North would be 1.0? And the South would be 0? Not possible.

  Rule C: They might condition on the event that the material conditional is true. But that would set P(NR)=0, and the others to 0.25/0.75=1/3. Then P(¬North ∨ NZ)=1, which is not 0.8. So that doesn't work.

  Rule D: They use Jeffrey conditioning on the partition {NR, not NR}. They set P(not NR)=0.8, and then condition on not NR? But that would set P(NR)=0 and the others to 1/3. But then P(not NR)=1, not 0.8. So that's not Jeffrey conditioning.

  Jeffrey conditioning: when you have a partition and set new probabilities for the parts, then you set the conditional probabilities given each part to the old ones. So here, the partition is {NR, not NR}. We set P(NR)=0.2, P(not NR)=0.8. Then for each cell in not NR (which are NZ, SZ, SR), we set:

          P(new)(cell) = P(not NR) * P(old)(cell | not NR)

          P(old)(NZ | not NR) = P(NZ)/P(not NR_prior) = 0.25/0.75 = 1/3.
          Similarly for SZ and SR.

          So P(NZ)=0.8 * (1/3)≈0.2667, same for SZ and SR.

          Then P(North)=P(NZ)+P(NR)=0.2667+0.2=0.4667.

  Rule E: They might set P(NR)=0.2 and then leave the other cells at their prior? But then P(NZ)=0.25, P(SZ)=0.25, P(SR)=0.25, and P(NR)=0.2 -> total=0.95. Then they have to normalize? So multiply by 1/0.95? Then P(NZ)=0.25/0.95≈0.2632, etc. And P(North)= (0.25+0.2)/0.95 ≈ 0.45/0.95≈0.4737.

  But that's not a standard rule.

  We expect Rule A (Jeffrey) to be common, giving P(North)≈0.4667, but Rule E (with normalization) gives about 0.4737, and there might be others.

  But the spread might be smaller.

  Now, the debrief:

  We need a table of candidate rules for Round 1:

  | Update Rule                          | P(North) | Attractive feature                                     | Fishy aspect                                     |
  |--------------------------------------|----------|--------------------------------------------------------|--------------------------------------------------|
  | Conditioning on material conditional | 0.333    | Simple, uses the material conditional as the event.    | Why condition on a different event? Also, it sets P(NR)=0, which might not be intended. |
  | Hold prior on North fixed (Rule 2)   | 0.5      | The message doesn't mention the marginal, so leave it. | Why should the marginal of North remain fixed? The constraint might indirectly affect it. |
  | Jeffrey/min cross-entropy (Rule 3)   | ?        | Minimizes information change.                          | But the constraint doesn't fix the marginal, so which one? We had to make an arbitrary choice. |
  | Update only within North (Rule 5)    | 0.5      | The message is about the North, so only update there.  | Same as holding marginal fixed.                  |
  | Set P(NZ)=0.8? (mistake)             | 1.0      | (They might do this)                                    | Ignores the conditional nature.                  |

  But note: for Jeffrey, if we interpret the constraint as constraining the conditional probability, we need to minimize the relative entropy subject to P(NZ|North)=0.8. The solution is to set the conditional distribution in the North to (0.8,0.2) and leave the conditional distribution in the South unchanged, and then set the marginal P(North) to the prior P(North)=0.5. So that gives the same as Rule 2.

  Alternatively, we might not fix the marginal, and then we have freedom. So Jeffrey doesn't give a unique answer without an additional constraint.

  We'll present Rule 2 as the one that minimizes relative entropy if we also keep the marginal fixed.

  For Round 2, we have:

  | Update Rule                          | P(North)      | Attractive feature                                  | Fishy aspect                                  |
  |--------------------------------------|---------------|-----------------------------------------------------|-----------------------------------------------|
  | Jeffrey on the event NR (Rule A)     | 0.4667        | Uses Jeffrey conditioning on the partition.         | Why partition on NR?                          |
  | Normalize after setting P(NR)=0.2 (Rule E) | 0.4737   | Simple, just set the number and renormalize.        | Why not change the others proportionally?     |
  | Set P(NR)=0.2 and leave others (without norm) | 0.95 (but they must normalize) | - | Doesn't sum to 1. |

  What predictably goes wrong:

  - In Round 1, some group will set P(NZ)=0.8. They are misinterpreting the conditional as unconditional.
    How to handle: When you see that, ask them: "But the message says 'if she's in the North', so what does that mean for when she's not in the North?" and "Does this statement say anything about the South?" They might realize.

  - Some group might condition on North and then forget to normalize? But they have to assign probabilities to all cells.

  - In Round 2, they might not realize that the material conditional is the event ¬North ∨ NZ, and then they might not know what event to condition on.

  What the activity cannot reproduce:

  - The activity cannot force them to see the underdetermination until they see the spread. But that is the point.

  - The activity does not cover the case of the converse conditional, but we didn't include that.

  - The activity does not cover the difference between the probability of a conditional and the conditional probability. We do that by having two rounds.

  Debrief table for Round 1:

  We'll list the rules and their P(North):

  Rule 1: Conditioning on the material conditional: P(North)=1/3≈0.333.
  Rule 2: Holding the marginal P(North) fixed at 0.5: P(North)=0.5.
  Rule 3: Setting P(NZ)=0.8: then P(North)=1.0 (but this is a mistake).

  But we also note that there are infinitely many possibilities. For example, if we set P(North)=x, then we must have:
     P(NZ)=0.8*x
     P(NR)=0.2*x
     P(SZ)=a
     P(SR)=0.5 - a   (if we want to keep the symmetry? but not necessarily)
     and 0.8x + 0.2x + a + (0.5 - a) = 1 => 0.5x + 0.5 = 1? That's not right.

  Actually, the only constraints are:
     P(NZ) = 0.8 * (P(NZ)+P(NR))   [which is P(NZ)=0.8*P(North)]
     P(NR) = 0.2 * P(North)
     P(NZ)+P(NR)+P(SZ)+P(SR)=1
     and nonnegativity.

  So we have:
     P(NZ) = 0.8 * P(North)
     P(NR) = 0.2 * P(North)
     P(SZ) and P(SR) are nonnegative and sum to 1 - P(North).

  So P(North) can be any number in [0, 1]. And then P(SZ) and P(SR) can be chosen arbitrarily as long as they are nonnegative and sum to 1-P(North). So the underdetermination is even more extreme.

  But in practice, students will use rules that fix P(North) by some principle.

  We will explain that the constraint only fixes the conditional distribution in the North, but not the marginal of the North, and not the distribution in the South.

  For Round 2, the constraint is P(NR)=0.2. Then:
     P(NR)=0.2
     Then P(NZ)+P(SZ)+P(SR)=0.8.
     And we have no constraint on how this 0.8 is distributed. So again, underdetermination: P(North)=P(NZ)+0.2, and P(NZ) can be any number in [0,0.8].

  But again, students will use rules that fix the distribution.

  The key point: the two rounds show that the two messages are different, and both underdetermine the posterior.

  Timeline:

  Total time: 90 minutes.

  0-5: Introduction and setup.
  5-20: Round 1 (groups work).
  20-25: Collect and show spread for P(North) for Round 1.
  25-35: Group discussion: why did you choose that number?
  35-50: Round 2 (groups work on the new message).
  50-55: Collect and show spread for Round 2.
  55-60: Reveal the true state and compute scores (we might skip the true state and just give participation points if scoring is too time-consuming, or we can compute quickly).
  60-90: Debrief.

  Debrief points:

  1. In Round 1, we saw a spread in P(North). Why? Because the message underdetermines the posterior. It only constrains the conditional probability within the North, not the marginal of the North nor the South.

  2. We list the rules that students used and their P(North). We note that each rule has some justification but also problems.

  3. The two messages (Round 1 and Round 2) are different. Round 1 constrains P(NZ|North)=0.8, while Round 2 constrains P(¬North ∨ NZ)=0.8, which is P(NR)=0.2. These are different events. In particular, Round 1 does not fix P(NR) (except that it must be 0.2 * P(North)), while Round 2 fixes P(NR)=0.2. And we see that the spreads are different.

  4. The disagreement is not due to incoherence: different groups have different posteriors, but each group's posterior satisfies the constraint. And they are not subject to a Dutch book if they update consistently with their own rule.

  5. What fixes the underdetermination? Additional constraints, such as maximum entropy (minimal change) or other principles, or more data.

  We provide the table for Round 1 rules:

  | Rule Name (simplified)      | P(North) | What it does                                                                 | Attractive                                                                 | Fishy                                                                 |
  |-----------------------------|----------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | Material Conditional        | 0.333    | Conditions on the event "not in NR" (i.e., ¬North ∨ NZ)                     | Simple, treats "if A then B" as the material conditional.                 | Why condition on that event? The message didn't say it's certain.    |
  | Fix Marginal of North       | 0.5      | Keeps P(North)=0.5 and sets P(NZ\|North)=0.8, P(NR\|North)=0.2. South unchanged. | The message doesn't mention the marginal, so leave it alone.              | But why should the marginal remain fixed? Maybe the evidence affects it? |
  | Minimal Change?             | (varies) | Minimizes the change in the distribution subject to the constraint.          | Changes beliefs as little as possible.                                     | But which measure of change? And it might not be unique.             |
  | Mistake: Set P(NZ)=0.8      | 1.0      | Sets the unconditional probability of NZ to 0.8.                            | Misinterprets the conditional as unconditional.                            | Clearly wrong: ignores the condition.                                |

  We note that the minimal change rule (if we use relative entropy) with the constraint P(NZ|North)=0.8 and also holding the marginal P(North) fixed at 0.5 gives the fix marginal rule. If we don't fix the marginal, we need another principle.

  For Round 2:

  | Rule Name         | P(North) | What it does                                     | Attractive                                  | Fishy                                      |
  |-------------------|----------|-------------------------------------------------|---------------------------------------------|--------------------------------------------|
  | Jeffrey on {NR, not NR} | 0.4667 | Sets P(NR)=0.2 and redistributes the rest proportionally. | Standard method for updating on a new probability for a partition. | Why partition on NR? The message is about the truth of a conditional. |
  | Renormalize       | 0.4737   | Sets P(NR)=0.2 and then renormalizes the other cells by dividing by 0.95. | Simple.                                    | Why not change the others proportionally?  |

  Finally, we note that the activity cannot cover every aspect. In particular, we haven't discussed the difference between the probability of a conditional and the conditional probability (Adams' thesis, etc.). We might have to explain from the front that these are different and that the conditional probability is not the probability of a conditional. And we might note that the material conditional is just one way to represent the conditional, but there are others (e.g., Stalnaker's conditional). But that is beyond the scope.

  We also note that the underdetermination is inherent in the problem and that there is no uniquely rational update rule in such cases. We have to be aware of the choices we make.

  Materials to prepare:

  - Handout for prior and messages (for both rounds).
  - Slips for groups to write their posteriors.
  - Envelope for the true state.
  - Score table for the quadratic scoring rule (for the event North) to show them how they will be scored. We can give:

          If you report p for North, and North is true, your score for this event is: 10 * [1 - (1-p)^2]
          If North is false, your score is: 10 * [1 - p^2]

  - But we can print a table of p and the two scores for p from 0 to 1 in steps of 0.1.

  Example:

  | p   | if North true | if North false |
  |-----|---------------|----------------|
  | 0.0 | 0             | 10             |
  | 0.1 | 1.9           | 9.9            |
  | 0.2 | 3.6           | 9.6            |
  | ... | ...           | ...            |
  | 0.9 | 9.9           | 1.9            |
  | 1.0 | 10            | 0              |

  But we can do it in 0.05 steps? Or just explain the formula.

  Alternatively, since we are doing the computation, we don't need to print the table for them.

  We'll go with explaining the formula.

  We are ready to run.
answer: |-
  Below is a complete, runnable session plan designed to make students confront the underdetermination of updating on conditional probabilities ("if A, then probably B"). The activity forces them to commit to numbers, reveals peer disagreement, and highlights that no update rule is uniquely rational. It includes two rounds (with different phrasings of the same information), a proper scoring rule, and a debrief mapping the activity to formal concepts.

  ---

  ### **Session Overview**
  - **Goal**: Students experience that conditional probability statements underdetermine posterior credences, and common update rules conflict.
  - **Core Problem**: The message "if North, then P(in zone) = 0.8" doesn't specify P(North) or how to update the South. Different coherent rules yield different posteriors.
  - **Structure**: 
    - Round 1: Update on a conditional probability ("if A, then P(B) = 0.8").
    - Round 2: Update on the probability of a material conditional ("P(if A then B) = 0.8").
  - **Key Moments**: 
    - Students commit to numbers before discussion.
    - Spread in P(North) reveals underdetermination.
    - Scoring incentivizes honest reporting.
    - Debrief formalizes the rules and their trade-offs.

  ---

  ### **Materials to Prepare**
  1. **Handout (1 per group)**  
     ![Park grid: North/South sectors, each with a "likely zone" and "rest". Prior: 0.25 per cell.](https://via.placeholder.com/150x100?text=Park+Grid)  
     *Text*:  
     > "Park has 4 equally sized areas:  
     > - **NZ** (North Zone), **NR** (North Rest), **SZ** (South Zone), **SR** (South Rest).  
     > Prior credence: 0.25 for each.  
     > Event **North** = NZ or NR (prior P(North) = 0.5)."

  2. **Message Slips (Round 1 & 2, 1 set per group)**  
     - **Round 1 (Conditional)**: *"If she’s in the North, the chance she’s in the North zone is 4 in 5."*  
     - **Round 2 (Material)**: *"The probability that ‘if she’s in the North, she’s in the North zone’ is true is 4 in 5."*

  3. **Response Tokens (per group)**  
     - 4 tokens labeled **NZ, NR, SZ, SR** (for posterior probabilities).  
     - 1 **P(North) token** (a slip to write a number 0.00–1.00).

  4. **Scoring Table (projected or printed)**  
     Quadratic scores for P(North) report (scaled 0–10):  
     | If North is true: | If North is false: |
     |-------------------|--------------------|
     | Score = 10 × [1 - (1 - p)^2] | Score = 10 × [1 - p^2] |  
     Example: If p = 0.5, score = 7.5 if true, 7.5 if false.

  5. **True State Envelope**  
     Contains a randomly drawn true location (NZ, NR, SZ, or SR) from the prior. Draw at start, reveal at end.

  ---

  ### **Timeline (90 Minutes Total)**
  #### **0–10 min: Setup & Rules**  
  - **On board**: Draw the 4-cell grid. Write prior: P(NZ) = P(NR) = P(SZ) = P(SR) = 0.25.  
  - **Explain**:  
    - "We’re drone operators. I’ve drawn the hiker’s true location (envelope). Update your credences when messages arrive."  
    - **Scoring**: "Report true posterior for North. Quadratic scoring: Honest reporting maximizes expected score. Top group gets bonus (e.g., extra credit)."  
  - **Form groups**: 4–5 groups of 3–4 students.

  #### **10–25 min: Round 1 (Conditional Probability)**  
  - **Give Message 1**: *"If she’s in the North, the chance she’s in the North zone is 4 in 5."*  
  - **Task**:  
    - Assign posteriors to NZ, NR, SZ, SR (sum to 1).  
    - Calculate P(North) = P(NZ) + P(NR).  
    - Write P(North) on token.  
  - **Instructor**: Circulate. Listen for:  
    - "We kept P(North)=0.5" vs. "We conditioned on the material conditional" vs. "We set P(NZ)=0.8".  
    - **Predictable mistake**: 1–2 groups set P(NZ)=0.8 (ignoring the conditional). Ask: *"Does the message say anything if she’s not in the North? Should P(South) change?"*

  #### **25–30 min: Reveal Spread (Round 1)**  
  - **Collect tokens**: Post P(North) values on board.  
    - **Expected spread**: 0.33, 0.40, 0.50, 0.60...  
  - **Ask**: *"Why did your group choose this number? What rule did you use?"*  
    - **Do not resolve disagreements yet!** Just highlight variation.

  #### **30–45 min: Round 2 (Material Conditional)**  
  - **Give Message 2**: *"The probability that ‘if she’s in the North, she’s in the North zone’ is true is 4 in 5."*  
    - **Clarify**: *"This means P(‘not North or NZ’) = 0.8. In logic, ‘if A then B’ is true unless A and not-B."*  
  - **Task**: Reupdate posteriors and P(North) from Round 1 priors (not from Round 1 posteriors).  
  - **Instructor**: Note if groups treat this as identical to Round 1. Ask: *"Is this the same constraint?"*

  #### **45–50 min: Reveal Spread (Round 2)**  
  - **Collect tokens**: Post new P(North) values.  
    - **Expected spread**: 0.40, 0.47, 0.50...  
  - **Ask**: *"Did your P(North) change from Round 1? Why?"*

  #### **50–55 min: Score & Reveal Truth**  
  - **Reveal true state** from envelope.  
  - **Calculate scores** using the scoring table. Announce winners.  
  - **Example**: True state = NZ.  
    - Group A (P(North)=0.33): Score = 10 × [1 - (1-0.33)^2] ≈ 5.5  
    - Group B (P(North)=0.50): Score = 10 × [1 - (1-0.50)^2] = 7.5  

  #### **55–90 min: Debrief**  
  Use board to formalize intuitions from the activity:  

  ### **Debrief Guide**
  **1. Map Activity to Formal Problem**  
  | Activity Moment          | Formal Concept                                                                 |
  |--------------------------|--------------------------------------------------------------------------------|
  | Spread in P(North)       | **Underdetermination**: Constraint P(NZ\|North)=0.8 fixes no unique posterior. |
  | Round 1 vs. Round 2 spread | **Phrasing matters**: P(B\|A) vs. P(A→B) constrain different quantities.       |
  | No adjudication by message| **Coherent disagreements**: Multiple Dutch-book-proof updates satisfy the constraint. |
  | Scoring rule payoff      | **Proper scoring**: Incentive for honesty, but doesn’t resolve underdetermination. |

  **2. Candidate Update Rules (for Round 1)**  
  | Rule                          | P(North) | Attractive                                  | Fishy                                       |
  |-------------------------------|----------|--------------------------------------------|---------------------------------------------|
  | **1. Condition on material conditional** (A→B ≡ ¬A∨B) | 0.33 | Simple; treats "if" as logic. | Sets P(NR)=0 (message didn’t say NR is impossible!). |
  | **2. Fix P(North) marginal** (keep P(North)=0.5) | 0.50 | Intuitive; message doesn’t mention North. | Why assume P(North) unchanged? Evidence may affect it. |
  | **3. Minimal KL-divergence** (keep South ratios fixed) | 0.50 | Minimizes info change. | Arbitrary: Why preserve South ratios, not North? |
  | **4. Fix P(Zone)** (keep P(NZ)+P(SZ)=0.5) | 0.625 | Preserves zone prior. | Overconstrains; message doesn’t mention zones. |
  | **5. Mistake: Plug in P(NZ)=0.8** | 1.00 | Literal but wrong. | Ignores conditioning; violates total probability. |

  - **Key Insight**: Rules 1–4 are coherent (satisfy the constraint + avoid Dutch books) but conflict. Rule 5 is incoherent.

  **3. What the Activity Can’t Reproduce**  
  - **You must explain**: Why P(B\|A) ≠ P(A→B).  
    - Here: P(NZ\|North) = 0.8, but P(North→NZ) = P(¬North ∨ NZ) = 1 - P(NR) = 0.75 (prior).  
    - Round 2 forces P(North→NZ) = 0.8, which fixes P(NR) = 0.2 (vs. Round 1’s freedom).  
  - **Formal gap**: Students may not see that P(A→B) is a statement about the whole distribution. Clarify with logic: A→B is false only when A∧¬B (here, NR).

  **4. Handling Predictable Issues**  
  - **Problem**: Groups treat P(NZ\|North)=0.8 as P(NZ)=0.8 (Rule 5).  
    - **In-session fix**: Ask: *"If she’s in South, does this message constrain her location? Should P(SR) change?"*  
  - **Problem**: Groups assume Round 1 and Round 2 are identical.  
    - **Fix**: Contrast Round 1’s spread (wide) vs. Round 2’s (narrower; fixes P(NR)=0.2).  
  - **Problem**: Students think disagreement implies irrationality.  
    - **Fix**: "Did any group violate the constraint? If not, your credences are coherent—just differently sensitive to priors."

  **5. Closing Message**  
  > "When you hear 'if A, then probably B,' your brain wants to jump to a number. But today, you saw that no single rule is sacred. The constraint underdetermines your posterior, and the 'obvious' fixes pull apart. This is why we need explicit protocols (e.g., Jeffrey conditioning, MaxEnt) in formal epistemology—and why real agents can disagree without being Dutch-booked."

  ---

  ### **Why This Works**
  - **Experience before theory**: Students confront spread before naming rules.  
  - **Phrasing difference**: Round 1 (conditional) vs. Round 2 (material) forces comparison.  
  - **Scoring**: Proper rule incentivizes honesty without resolving underdetermination.  
  - **Debrief table**: Turns conflict into a taxonomy of rational options.  
  - **Low prep**: Grid, tokens, and slips are quick to print.  

  Adapt as needed, but stick to the timeline—the power is in the reveal of disagreement. Run it, and watch them *feel* the underdetermination.
