prompt: |-
  so my friend is a lawyer and she has this move she pulls whenever I complain about someone. In court, she says, you cant just walk in and sue a person — you need standing. You have to be the one who was actually harmed; if its not your fight the court wont hear you, no matter how good your case is. And she says moral criticism runs on the same rule: if your'e a hypocrite about the very thing you're complaining about, you've got no standing, so the person you're criticizing can wave you off without ever answering the substance. She pushes it further too — since basically everyone is a hypocrite about something, most moral criticism is out of order, and the whole practice is shakier than we pretend. She has the political version as well: the columnist who's been hammering the minister over his offshore accounts turns out to have a few of her own, case dismissed, nothing to discuss.

  I half buy it and half think the legal analogy is carrying all the weight and nobody has checked whether it can. Can you audit it?

  What I want:

  1. The correspondence, item by item — plaintiff, defendant, the injury, the court, the judge, who gets to decide the standing question, the remedy, and whatever else maps — with each one marked as holding, holding partly, or breaking.
  2. The disanalogies that actually matter. Some things I know from her: standing is a threshold question decided before anyone looks at whether the claim is true, so losing on standing says nothing about being right; the court can't just waive it by agreement; sometimes a third party can sue on someone else's behalf; and the doctrine exists mostly to keep courts in their lane as institutions rather than because the plaintiff is a bad person. Which of those transfers to moral blame and which don't?
  3. The three conclusions — the one-on-one dismissal, the political case, and the sweeping skepticism — and whether each survives once the mapping is on the table. If the sweeping one collapses but something narrower survives, say which and why.
  4. Whether there's a better analogy for what hypocrisy actually does to a criticism. My hunch is it's closer to a credibility or weight problem than a gate you can't get past, but you tell me, and say where the replacement still breaks.

  Please skip reading lists and citations — I can't look anything up and I don't really care who said it first, I care whether the analogy holds. Also don't seperate the "does it map" question from the "does the conclusion follow" question; I want to see the second depend on the first.

  Finish with a JSON block, and no prose after it, with exactly these fields:

  - correspondence: array of {source, target, status: "holds" | "partly" | "breaks", note}
  - load_bearing_disanalogies: array of {feature, what_it_does_in_court, transfers: "yes" | "no" | "partly", matters_here: "yes" | "no", why}
  - imported_assumptions: array of strings — what the analogy quietly smuggles in about blame
  - verdicts: array of {claim, survives: "yes" | "no" | "only_narrower", what_survives, what_falls}
  - better_analogy: {analogy, why_better, where_it_still_breaks}
  - bottom_line: one sentence
reasoning: |-
  We are auditing the analogy between legal standing and moral criticism regarding hypocrisy. The core claim is that just as a court requires the plaintiff to have standing (i.e., to be the one actually harmed) to bring a lawsuit, a person must not be a hypocrite (i.e., must not be guilty of the same thing they are criticizing) to have the "standing" to level moral criticism. If they are hypocritical, the criticism can be dismissed without addressing the substance.

  We break down the analogy point by point, then examine disanalogies, the conclusions drawn, and consider a better analogy.

  ### 1. Correspondence (item by item)

  We map legal concepts to their proposed moral equivalents:

  - **Plaintiff**: The person bringing the lawsuit (in court) → The person making the moral criticism (in the moral realm).
    - Status: **Holds partly**. The critic is indeed the one initiating the moral "case." However, in moral criticism, there isn't a formal process, and anyone can voice criticism without being an official party. The analogy breaks in that moral criticism doesn't require a designated "plaintiff" role.

  - **Defendant**: The person being sued → The person being morally criticized.
    - Status: **Holds**. The target of the criticism is the "defendant" in the moral case.

  - **The injury**: In court, the plaintiff must have suffered an actual harm. → In moral criticism, the "harm" might be the wrongness of the act being criticized. But the analogy points to the hypocrite not being "harmed" because they are guilty of the same thing? Or is the harm the moral wrong itself? The friend's idea is that if the critic is a hypocrite, they haven't been "harmed" in the sense that they aren't personally wronged by the act (or they are complicit). 
    - Status: **Breaks**. In law, standing requires a concrete injury to the plaintiff. In moral criticism, the "injury" is not necessarily personal. One can criticize a wrong even if it doesn't affect them directly (e.g., criticizing racism even if one isn't the victim). The moral wrong is the focus, not personal harm. The hypocrite might be seen as not having a "clean hands" but that's different from lacking injury.

  - **The court**: The institution that hears the case → The forum of moral discourse (society, the public, the person being criticized, etc.).
    - Status: **Holds partly**. There is a resemblance in that both are arenas for resolving disputes. But the moral "court" is informal, has no fixed rules, and isn't an authoritative institution.

  - **The judge**: The official who decides the case → The audience of the moral criticism (which might include the public, the defendant, or even the critic themselves).
    - Status: **Holds partly**. In moral discourse, the audience (or the defendant) can "judge" the criticism. But there's no single, impartial judge in moral matters; it's decentralized.

  - **Who decides standing**: In court, the judge decides standing as a threshold matter. → In moral criticism, the defendant (or the audience) might "decide" that the critic is a hypocrite and thus dismiss the criticism.
    - Status: **Breaks**. In court, standing is decided by an impartial judge. In moral criticism, the decision about hypocrisy is often made by the defendant (who is interested) or the audience (who may be biased). There's no neutral arbiter.

  - **The remedy**: What the court can award (e.g., damages, injunction) → The desired outcome of moral criticism (e.g., apology, change in behavior, social sanction).
    - Status: **Holds partly**. Both seek to rectify a wrong. But legal remedies are enforced by the state, while moral criticism relies on social or personal pressure.

  - **Threshold question**: Standing is determined before examining the merits. → Hypocrisy is used to dismiss criticism without addressing the substance.
    - Status: **Holds**. In both, if standing is lacking (or hypocrisy is proven), the case/criticism is dismissed without going into the merits.

  ### 2. Load-bearing disanalogies

  We list key differences between legal standing and moral hypocrisy and whether they transfer:

  | Feature | What it does in court | Transfers? | Matters here? | Why |
  |---------|----------------------|------------|---------------|-----|
  | **Standing is about institutional role** | Courts are limited to cases with a concrete injury to avoid overstepping and to focus on actual disputes. | No | Yes | Moral criticism doesn't have the same institutional constraints. The purpose of standing is to keep courts within their lane, but moral discourse has no such boundaries. The disanalogy undermines the idea that hypocrisy should be a threshold bar. |
  | **Third-party standing** | Sometimes, a party can sue on behalf of another (e.g., a parent for a child, or a representative in class actions). | Partly | Yes | In morality, we often allow and even encourage criticism on behalf of others (e.g., advocating for the oppressed). Hypocrisy doesn't necessarily bar this. But the friend might say the critic must be "clean" to advocate. This transfer is weak and matters because it shows that the moral arena allows for representation. |
  | **Standing is not about the plaintiff's character** | Standing focuses on the plaintiff's injury, not whether the plaintiff is a good person. A bad person can still have standing if harmed. | No | Yes | In the hypocrisy case, the focus is on the critic's character (being a hypocrite). This is a key difference: legal standing doesn't care about hypocrisy. This matters because the moral analogy is importing a character element that doesn't exist in the legal doctrine. |
  | **Waiver** | Parties cannot waive standing by agreement; the court must ensure it. | Partly | No | In moral criticism, the defendant can choose to ignore hypocrisy and address the substance. There's no requirement that hypocrisy must be raised. But the friend's point is that the defendant can use it to dismiss. This doesn't directly affect the core analogy. |
  | **Pre-merits dismissal** | Standing is decided before the merits. | Yes | Yes | The friend uses this: hypocrisy dismisses without substance. This transfers, but note that in law, standing dismissal doesn't imply the claim is false, whereas in moral criticism, a hypocrisy dismissal might be taken as implying the criticism is invalid. |

  ### 3. Imported assumptions (what the analogy smuggles in)

  The analogy quietly assumes:
  - That moral criticism, like a lawsuit, requires a "right" to be heard (standing) based on personal purity.
  - That moral wrongs are analogous to legal injuries, requiring a direct and personal stake.
  - That the critic must be "harmed" in the same way as a plaintiff to have legitimacy.
  - That dismissing criticism due to hypocrisy is a neutral, procedural matter (like a judge's ruling) rather than a substantive defense.

  These assumptions are problematic because moral criticism often addresses universal wrongs and doesn't require the critic to be a victim. Also, the focus on the critic's character shifts attention from the act being criticized.

  ### 4. Verdicts on the conclusions

  We evaluate the three conclusions:

  - **One-on-one dismissal**: The claim that if you're a hypocrite, the person you criticize can dismiss you without answering the substance.
    - Survives: **Only narrower**. Hypocrisy can undermine the critic's credibility and make the dismissal psychologically effective, but it doesn't logically bar the criticism. The substance of the criticism might still be valid. So, the defendant might get away with it in practice, but it's not a principled rule.

  - **Political case**: The columnist with offshore accounts criticizing the minister can be dismissed due to her own hypocrisy.
    - Survives: **No**. While the columnist's hypocrisy weakens her credibility and may make her criticism less effective, it doesn't mean the minister's wrongdoing is excused. The substance (offshore accounts) remains an issue. The public (or another critic) can still hold the minister accountable.

  - **Sweeping skepticism**: Since everyone is a hypocrite about something, most moral criticism is out of order.
    - Survives: **No**. This conclusion overextends the analogy. Even if hypocrisy sometimes undermines a particular critic, it doesn't negate the validity of the criticism itself. Moreover, moral criticism can be offered by non-hypocrites or by those who acknowledge their own faults. The analogy breaks under the weight of universalizing a procedural bar that doesn't fit moral discourse.

  ### 5. A better analogy

  - **Analogy**: Hypocrisy in moral criticism is more like a **witness credibility problem** in court than a standing issue.
    - **Why better**: In court, if a witness is found to be a liar or biased, the jury may discount their testimony, but the case isn't thrown out—other evidence might still prove the claim. Similarly, a hypocritical critic may lose credibility, but the substance of their criticism might still be true and supported by other evidence. This captures the idea that hypocrisy weakens the criticism but doesn't automatically invalidate it.
    - **Where it still breaks**: In law, the judge can exclude unreliable testimony. In moral criticism, there's no formal exclusion. Also, the critic is more than a witness; they are the one bringing the charge. Moreover, in morality, even a hypocrite might be telling the truth.

  ### Bottom line
  The legal standing analogy breaks down because moral criticism doesn't require personal harm, focuses on the act not the critic's injury, and lacks an impartial judge, making hypocrisy a matter of credibility rather than a jurisdictional bar.

