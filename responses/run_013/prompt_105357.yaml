answer: |-
  Here's a breakdown of "extraordinary claims require extraordinary evidence" (ECREE), moving from weakest to strongest interpretations, with analysis of each:

  **Core Concepts & Your Specifics Upfront:**

  1.  **"Extraordinary" is ALWAYS Relative:** It means "highly improbable *given our current background knowledge*." The baseline isn't just "mainstream consensus" as dogma, but the *weight of established evidence* supporting the current model (e.g., archaeology, geology, dendrochronology, textual analysis for history). **This is where the historian likely anchors.** For Fomenko, it's relative to *his* model.
  2.  **"Extraordinary Evidence":** Almost always means **both**:
      *   **Quantity:** A *much larger* volume of high-quality evidence than needed for a mundane claim.
      *   **Quality/Robustness:** Evidence of the *highest reliability* and *least ambiguity*, ideally from multiple independent lines of inquiry, resistant to alternative explanations. It's rarely about a *fundamentally different kind* of evidence, but about the *degree* of certainty it provides.
  3.  **Burden of Proof:** ECREE places the burden *squarely* on the proponent of the *new, extraordinary claim* to provide the extraordinary evidence. It does *not* place an equal burden on defenders of the established model to constantly re-prove it from scratch against every new challenge. The established model is the baseline until compellingly overturned.

  **The Menu of Interpretations:**

  1.  **The Weak Truism (Bare Minimum)**
      *   **Claim:** "The more surprising or improbable a claim seems based on what we already know, the stronger the evidence needs to be before we should believe it."
      *   **Truth:** **True, uncontroversial, almost tautological.** Nobody seriously disputes this. It's basic logic and probability (Bayes' theorem).
      *   **Commits You To:** Using common sense. If someone says they saw a dog, little evidence needed. If they say they saw a dragon, you need much better proof.
      *   **Re: Atlantis/Fomenko:** Doesn't allow *any* quick dismissal. It just says Atlantis proponents need *strong* evidence. The historian using this version wouldn't wave it off in 4 seconds; they'd say "Show me the extraordinary evidence." The audience flip *kinda* works logically but ignores burden of proof – Fomenko's claim *is* the extraordinary one relative to the established baseline.
      *   **Survives the Flip?** Yes, but weakly. It applies to *any* claim, mainstream or not. The mainstream chronology *is* based on a vast body of evidence accumulated over centuries (though constantly refined). Proving it wrong *would* require extraordinary evidence against it. But ECREE here doesn't *dismiss* Fomenko; it just sets a high bar *for him*.

  2.  **The Probabilistic Heuristic (Standard Scientific/Historical Practice)**
      *   **Claim:** "Claims that contradict a large body of well-supported existing knowledge (making them *a priori* highly improbable) require evidence of exceptionally high quality and quantity to overcome that initial improbability."
      *   **Truth:** **True and fundamental to rational inquiry.** This is how science and history actually work. It *is* contentious with proponents of fringe theories who reject the established baseline.
      *   **Commits You To:** Accepting that knowledge builds cumulatively. The baseline isn't arbitrary "consensus" but *evidence-based understanding*. Shifting it requires overcoming the weight of that existing evidence. Burden of proof is asymmetric.
      *   **Re: Atlantis/Fomenko:** This is the **historian's likely intended meaning.** Atlantis contradicts established geology, archaeology, and the known development of civilizations. Fomenko's chronology overturns mountains of archaeological stratigraphy, dendrochronology, independent textual traditions, and astronomical records. The claim *is* extraordinary relative to the background knowledge. Dismissal is justified *until* proponents meet the high burden of proof.
      *   **Survives the Flip?** **Yes, decisively.** The "boring mainstream chronology" isn't *a priori* extraordinary *because it is the established baseline built on vast evidence*. The audience member flips the *rhetoric* but not the *logic*. The extraordinary claim *is* Fomenko's (or Atlantis), *not* the mainstream model. Demanding "extraordinary evidence" *for* the mainstream *from scratch* is misunderstanding burden of proof. The mainstream evidence *is* the ordinary (but vast) evidence supporting the ordinary (established) model. Fomenko needs evidence *extraordinary* enough to *displace* that.

  3.  **The Impossible Standard (Strong Dismissal)**
      *   **Claim:** "Extraordinary claims require evidence that is not just quantitatively overwhelming and qualitatively pristine, but also fundamentally *different in kind* (e.g., 'smoking gun' level, undeniable, miraculous) or perhaps even *impossible* to achieve."
      *   **Truth:** **Generally false and unscientific.** It sets an unreasonable, often shifting, goalpost. Science rarely deals in absolute, undeniable proofs; it deals in probabilities based on evidence. Demanding a "different kind" of evidence is often vague and used to dismiss evidence that *is* available but deemed insufficient by the skeptic.
      *   **Commits You To:** Near-total skepticism towards any novel claim that challenges orthodoxy. Prone to being used dogmatically.
      *   **Re: Atlantis/Fomenko:** This might be how the *audience member* misconstrues the historian's position. If the historian *meant* this, then the flip ("show me *your* extraordinary evidence") *would* land, as mainstream history relies on ordinary (though vast) evidence like potsherds, texts, and tree rings – nothing "miraculous." It *could* be how a lazy skeptic uses ECREE for instant dismissal without engagement.
      *   **Survives the Flip?** **No.** This version is flawed. If applied consistently, it would paralyze progress. The mainstream *doesn't* have "extraordinary evidence" by this impossible standard, nor does it need to. If the historian leaned on *this* interpretation, the flip works.

  4.  **The Sociological Shutdown (Rhetorical Bludgeon)**
      *   **Claim:** "Claims that the current scientific/historical establishment finds weird or threatening require evidence that said establishment arbitrarily deems 'extraordinary' (i.e., unattainable), otherwise we dismiss them."
      *   **Truth:** **False as a principle, but descriptively captures misuse.** This is how *proponents of fringe theories often perceive* ECREE being used against them. It confuses the *evidence-based* baseline with "establishment dogma."
      *   **Commits You To:** Conspiracy thinking, rejection of expertise, and potentially an "anything goes" epistemology where all claims are treated equally.
      *   **Re: Atlantis/Fomenko:** This is the lens through which the audience member likely sees the historian's dismissal. It frames the mainstream as defenders of dogma using ECREE as a thought-terminating cliché.
      *   **Survives the Flip?** **The flip *is* this interpretation.** It directly challenges the legitimacy of the mainstream baseline. If you *accept* this interpretation, then the flip "works" but only within a framework that rejects the validity of the established consensus *a priori*. The historian using ECREE is *not* (or *should not* be) operating on this basis.

  **The Payoff: What Happened on Stage**

  *   **The Historian:** Almost certainly leaned on **Interpretation #2 (Probabilistic Heuristic)**. He dismissed Atlantis quickly because, *relative to the vast body of established geological, archaeological, and historical knowledge*, the claim *is* extraordinary and proponents have consistently failed to provide evidence remotely approaching the necessary quality or quantity to overturn that baseline. Burden of proof was on Atlantis.
  *   **The Audience Flip:** Attempted to apply **Interpretation #3 (Impossible Standard)** or **#4 (Sociological Shutdown)** to the mainstream. It's rhetorically clever but **logically flawed** because:
      1.  It ignores the **asymmetric burden of proof**. The mainstream model *is* the baseline supported by ordinary (but massive and robust) evidence. Fomenko makes the extraordinary claim *against* it.
      2.  It misrepresents "extraordinary evidence." The mainstream *has* vast evidence meeting ordinary scientific/historical standards. It doesn't need "extraordinary" (impossible/smoking gun) proof to maintain its status as the best current model; it just needs to withstand challenges, which it consistently does against Atlantis/Fomenko.
      3.  It falsely equates the *established, evidence-based model* with an *extraordinary claim*.
  *   **Does the Historian's Position Survive the Flip?** **Yes, but only if he clearly articulated (or assumed) Interpretation #2.** Interpretation #1 is too weak for his dismissal. Interpretations #3 or #4 would crumble under the flip. **Interpretation #2 survives because the audience flip fundamentally misunderstands burden of proof and the nature of the established baseline.** The mainstream chronology isn't an "extraordinary claim" in the relevant sense; it's the *currently justified model*. Fomenko's alternative *is* the extraordinary claim demanding extraordinary evidence.

  **Your Verdict:** The historian likely relied on the valid **Probabilistic Heuristic** (#2). His quick dismissal was shorthand for "Your claim contradicts mountains of evidence; the burden is on you to provide something vastly more compelling than you ever have, and you haven't." The audience flip sounded punchy but committed the error of **burden-of-proof reversal** and potentially **misdefining "extraordinary evidence."** It only "works" if you accept a flawed (#3) or cynical (#4) interpretation of ECREE, or reject the legitimacy of the established evidentiary baseline altogether. The core logic of #2 stands.
