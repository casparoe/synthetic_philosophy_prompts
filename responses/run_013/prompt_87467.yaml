  ### Decision Tree for "Is the Brain a Computer?"  
  *Based on orthogonal questions and diagnostic cases. Nodes are numbered; leaves labeled per requirements. Cases 1, 2, 3, and 5 drive key branches. Case 4 (cortical grain) is not diagnostic—it fails to split positions, as all views accommodate grain sensitivity. Case 6 (fluent typist) tests explanation, not implementation.*

  **Independent Questions**  
  The answer to "Is the brain a computer?" depends on five orthogonal questions:  
  1. **Implementation Basis**: Is computation fixed by intrinsic mechanism or observer's mapping?  
  2. **Activity Requirement**: Must the system be active (not inert) to implement computation?  
  3. **Algorithmic Transparency**: Must the computation be human-readable?  
  4. **Cheap Implementation**: Can any physical system implement any computation via trivial mappings?  
  5. **Explanatory Role**: Does computation explain cognition (vs. redescribe)?  

  Coherent combinations:  
  - Mechanism-based views reject cheap implementation.  
  - Mapping-based views can be cheap or constrained (e.g., by activity).  
  - Explanatory roles are independent but constrained (trivialism voids explanation).  

  ---

  ### Decision Tree (Indented Outline)  
  *Each node is a yes/no question. Cases in brackets [ ] indicate where they force splits. Unoccupied combinations are noted post-tree.*

  0. **Is there a fact of the matter about whether physical systems implement computations?**  
     - No → **G: Verbal view**  
     - Yes → 1  

  1. **Is computation fixed by intrinsic causal structure (mechanism), not observer’s mapping?**  
     - Yes → 2  
     - No → 7  

  2. **[Case 1: Saved spreadsheet] Does it implement computations now (not just dispositionally)?**  
     - Yes → 3  
     - No → **E: Computation fixed by mechanism** (activity required)  

  3. **[Case 3: Image classifier] Does it implement a computation despite no readable algorithm?**  
     - Yes → 4  
     - No → **C: Brain not literal, usefully modeled**  

  4. **[Case 5: Switched-off calculator] Does it implement computations while off?**  
     - Yes → **E: Computation fixed by mechanism** (dispositional)  
     - No → **E: Computation fixed by mechanism** (activity required)  

  5. **[Case 2: River delta] Does it implement computations?**  
     - Yes → 6  
     - No → 8  

  6. **[Case 1: Saved spreadsheet] Does it implement computations now?**  
     - Yes → **F: Computation fixed by mapping** (non-trivial)  
     - No → **F: Computation fixed by mapping** (activity-constrained)  

  7. **Can any system implement any computation via trivial mappings?**  
     - Yes → **D: Implementation cheap (trivialism)**  
     - No → 5  

  8. **[Case 2: Thermostat] Does it implement computations?**  
     - Yes → **F: Computation fixed by mapping** (design-constrained)  
     - No → **C: Brain not literal, usefully modeled**  

  9. **Does computational description explain cognition (e.g., [Case 6: Fluent typist])?**  
     - Yes → **A: Brain computes and explains cognition**  
     - No → **B: Brain computes but only redescribes**  

  ---

  ### Leaf Table  
  | ID | Name/Description                                  | Most Awkward Commitment                                   | Hardest Case                                   |  
  |----|---------------------------------------------------|-----------------------------------------------------------|------------------------------------------------|  
  | A  | Computational explanation                          | Must defend explanatory power even when computation is observer-relative. | Cortical region (Case 4): Multiple grains challenge unique explanation. |  
  | B  | Computational redescription                       | Computation is real but explanatorily inert.              | Fluent typist (Case 6): Computational description seems to explain her skill. |  
  | C  | Non-literal fictionalism                          | Denies computation in designed systems (e.g., thermostats). | Switched-off calculator (Case 5): Fixed wiring implies computation. |  
  | D  | Implementation cheap (trivialism)                 | A rock implements any program (e.g., Word.exe).           | River delta (Case 2): Trivial mapping "confirms" computation. |  
  | E  | Computation fixed by mechanism                    | Inactive objects (e.g., saved spreadsheet) "compute."     | Saved spreadsheet (Case 1): Inert formulas lack causal activity. |  
  | F  | Computation fixed by mapping                      | Computation exists only relative to an observer's choice. | Image classifier (Case 3): Feels intrinsic despite opacity. |  
  | G  | Verbal view (no fact of the matter)               | A running computer has no objective computation.          | Thermostat (Case 2): Design suggests factual implementation. |  

  ---

  ### Unseparated Leaves & Unoccupied Combinations  
  - **Unseparated pair**: Leaves under **E** (mechanism + activity vs. dispositional) share the same basis; activity requirement doesn’t split positions.  
  - **Unoccupied combinations**:  
    - Mechanism + trivialism: Incoherent (mechanism forbids arbitrary mappings).  
    - Trivialism + explanation: Unattractive (trivialism voids explanatory content).  
    - Mapping + activity + explanation: Unexplored (possible but lacks proponents).  
  - **Non-diagnostic case**: Case 4 (cortical grain) fails to split views; all positions accommodate grain sensitivity. Replace with:  
    - *Proposed case*: **A digital watch displaying time vs. a sundial casting a shadow**—tests whether time-tracking requires design or mechanistic implementation.
