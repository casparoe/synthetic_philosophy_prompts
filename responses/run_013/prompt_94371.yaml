  We are writing a joint statement to clarify our agreement and disagreement about no-trade theorems in economics. We are both committed to understanding the other's position and finding the crux of our disagreement.

  First, we agree on the following points:

  1. **The No-Trade Theorems**: We both agree on the formal statement of the no-trade results: under the assumptions of rational agents, common prior, and common knowledge of rationality and the information structure, there will be no trade at equilibrium prices.

  2. **The Role of Assumptions**: We agree that the no-trade theorems are conditional on a specific set of assumptions. The theorems do not claim that trade never occurs in reality; they show that trade does not occur under these idealized conditions.

  3. **Empirical Observation**: We agree that real markets exhibit substantial trading volume. The no-trade theorems do not deny this; they provide a benchmark against which to interpret observed trading.

  4. **Interpretation of "Efficiency"**: We agree that in the context of the no-trade theorems, "efficiency" refers to the idea that, under the given assumptions, no mutually beneficial trades (in the ex-ante sense) are left unexploited. This is not a claim about real-world efficiency in a broader sense (e.g., Pareto efficiency in resource allocation) but a specific property of the model.

  5. **Common Prior as an Assumption**: We agree that the common prior is an assumption of the model and not an empirical fact. It is a modeling choice.

  6. **Disagreement in Beliefs**: We agree that if agents have different priors (or if they have different models of the world), trade can occur even under rationality and common knowledge.

  Now, for the points of disagreement, we present them as each of us would phrase our own view (without strawmanning):

  | # | Her View (Econ Theorist)                                                                 | His View (Philosophy of Economics)                                                               |
  |---|-------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|
  | 1 | The no-trade theorems show that markets are informationally efficient: when agents are rational and share a common prior, the market price aggregates all information so that no agent sees an opportunity for trade. This is a success story because it shows that markets can achieve a state where no one is systematically fooled. | The no-trade theorems are a reductio on the common prior assumption: real markets have massive trade volume, so the theorems show that the common prior is an unrealistic assumption that forces the model to predict no trade. |
  | 2 | The common prior assumption is a reasonable benchmark for rationality. Disagreement in priors is equivalent to irrationality because it implies that at least one agent is wrong about the initial state of the world. | The common prior is a normalization, not a fact. It is arbitrary and hides the real source of trade, which is genuine disagreement. Without independent evidence for a common prior, the model's "efficiency" is a circular result of the assumption. |
  | 3 | Observed trading volume is evidence of private information or irrationality. The no-trade theorems help us measure the amount of private information by the deviation from no trade. | Observed trading volume is evidence that the common prior assumption is false. The no-trade theorems do not vindicate markets but expose the weakness of the modeling framework. |
  | 4 | The common prior can be tested by observing whether trading volume decreases as information becomes more public (e.g., in experimental settings). | The common prior is an untestable assumption because it is a prior. Any observed trading can be attributed to either private information or disagreement in priors, and there is no way to disentangle them without assuming a common prior. |

  Now, we identify the cruxes of our disagreement. These are the sub-questions that, if resolved, would change one of our minds. For each crux, we state the concrete case, experiment, or argument that bears on it and our predictions.

  **Crux 1: The testability of the common prior assumption.**

  - **Concrete Case**: Consider an experimental asset market where we control the information structure. We run two treatments:
    - Treatment A: All agents are given the same prior (e.g., through common training) and then receive private signals.
    - Treatment B: Agents are given different priors (e.g., through different training) and then receive private signals.

  - **Her Prediction**: In Treatment A, trading volume will be low (and converge to zero as the market repeats) because the common prior and rationality will lead to information aggregation. In Treatment B, trading volume will be high initially but may decrease if the market allows for learning. However, she would argue that Treatment B is introducing irrationality because the priors are arbitrarily assigned and not grounded in reality. Thus, the common prior is testable and holds when agents are rational.

  - **His Prediction**: In both treatments, trading volume will occur. In Treatment A, volume might be lower but not zero because of noise or other factors. In Treatment B, volume will be higher. However, he would argue that the common prior in Treatment A is an artificial construct and that real markets are more like Treatment B. The key point is that the common prior is not a fact about the world but a modeling choice. If the common prior were testable, we would see zero trade in Treatment A, but in reality, even in controlled experiments, some trade occurs.

  - **What would settle it?**: If in multiple replications of Treatment A (with careful controls for rationality and common knowledge) we observe zero trade, that would support her view. If we observe non-zero trade even in Treatment A, that would support his view that the common prior is not sufficient to explain real trading.

  **Crux 2: The interpretation of disagreement in priors.**

  - **Concrete Case**: Consider two rational agents who have different priors about a coin's bias. One believes it is fair, the other believes it is biased towards heads. They observe a sequence of flips and update their beliefs. They are given the opportunity to trade a bet on the next flip.

  - **Her View**: The agents are irrational because they hold different priors. Rational agents should have converged to the same prior through pre-observation learning or by having access to the same information. The existence of different priors is a sign of irrationality.

  - **His View**: The agents are rational because they are updating correctly from their respective priors. The difference in priors reflects legitimate disagreement about the world, which can arise from different experiences or interpretations of the same data. This is not irrationality.

  - **What would settle it?**: We need an independent criterion for rationality. If we can show that in the long run, the agents with different priors would converge to the same belief with enough data, then her view gains support. If, however, even with infinite data, they might not converge (e.g., in cases of non-identifiable models or when data is open to multiple interpretations), then his view is supported.

  **Crux 3: The role of the common prior in defining efficiency.**

  - **Concrete Argument**: Consider a market without a common prior. Is the outcome inefficient?

  - **Her View**: Without a common prior, the outcome is inefficient in the sense that agents are not maximizing their ex-ante expected utility (because they have different priors). The common prior is necessary for a well-defined notion of efficiency.

  - **His View**: Efficiency should be defined relative to the agents' actual beliefs. If they trade based on their different priors, the trade is mutually beneficial ex-ante (from their own perspectives) and hence efficient.

  - **What would settle it?**: This is partly verbal (what we mean by efficiency). We agree that we need to define efficiency. We can use:
    - Ex-ante Pareto efficiency: a trade is efficient if there is no other trade that would make every agent better off in expectation under their own prior.
    - Her view requires a common prior for a unique ex-ante efficiency. His view uses the agents' actual priors.

  **Verbal Disagreement:**

  We have identified a verbal disagreement about:

  - **Efficiency**: She uses "efficiency" in the sense of the model with common prior (so that efficiency is defined with respect to that prior). He uses "efficiency" in a more general sense, without requiring a common prior.

  - **Prior**: She sees the prior as a rational starting point that should be common if agents are rational. He sees the prior as a subjective starting point that can differ even among rational agents.

  **Conclusion on Cruxes:**

  The primary load-bearing crux is **Crux 1: The testability of the common prior**. If we can design an experiment that clearly shows that under common prior and rationality, trade goes to zero, then her view is strengthened. If trade persists even under these conditions (or if we cannot achieve true common prior and rationality in practice), then his view is supported.

  We commit to running or finding such an experiment and letting the data decide.
