  ### Joint Statement on No-Trade Theorems: Agreed Claims, Disagreements, and Cruxes  
  **Authored by:** [Econ Theorist] and [Philosophy of Economics PhD]  
  **Date:** October 26, 2023  

  After three months of debate, we agree on the following core claims about no-trade theorems (e.g., Milgrom-Stokey 1982) and their implications. These points are non-negotiable common ground:  

  #### Agreed Claims  
  1. **Formal Result**: Under the assumptions of (a) rational Bayesian agents, (b) a common prior, and (c) common knowledge of rationality and the information structure, no-trade theorems prove that mutually beneficial trades cannot occur at equilibrium prices. This is a deductive mathematical truth.  

  2. **Role of Assumptions**: The no-trade result relies critically on the common prior. If priors diverge, trade can arise even if all other assumptions hold.  

  3. **Empirical Reality**: Real-world markets exhibit substantial trading volume (e.g., daily FX turnover exceeds $7.5T). The theorems do not deny this; they provide a benchmark for interpreting it.  

  4. **"Efficiency" in Context**:  
     - In these models, "efficiency" means no unexploited gains from trade exist *given the assumptions*. It is not a general claim about market efficiency (e.g., allocative, informational, or Pareto efficiency in broader senses).  
     - Efficiency here is defined relative to agents' ex-ante expectations under the common prior.  

  5. **Common Prior as Modeling Choice**: The common prior is an assumption, not an empirical fact. It is a normalization that simplifies analysis but is not derived from first principles.  

  6. **Information vs. Belief Disagreement**: Trade requires either (i) private information (with common priors) or (ii) genuine disagreement in priors. The theorems rule out trade only when both are absent.  

  7. **Purpose of the Theorems**: They are useful for diagnosing sources of trade. Observed volume must stem from violations of the assumptions (e.g., private info, divergent priors, irrationality, or incomplete common knowledge).  

  #### Disagreements  
  We diverge on the *interpretation* and *normative significance* of the results. Each side’s position is stated in their own words (no strawmen):  

  | # | Econ Theorist’s View (Success Story) | Philosophy of Economics’ View (Reductio) |  
  |---|--------------------------------------|------------------------------------------|  
  | **1. Core Interpretation** | "No-trade theorems demonstrate market efficiency: they show prices aggregate information so tightly that rational agents with shared priors see zero gain from trade. Observed volume quantifies the real-world work of private information or frictions." | "No-trade theorems expose circularity: by assuming a common prior, ‘efficiency’ becomes a tautology. Real volume reveals this assumption as false, making the theorems a reductio of unrealistic modeling choices." |  
  | **2. Common Prior’s Status** | "Disagreement in priors is irrationality in disguise. Rational agents with identical information should converge to a common prior; divergent priors imply flawed reasoning." | "The common prior is an arbitrary normalization, not a rationality requirement. Real agents have legitimately diverse priors due to differing models, experiences, or ambiguity—none irrational." |  
  | **3. Normative Implication** | "The theorems vindicate markets: low volume indicates functioning information aggregation. High volume signals unresolved uncertainty, guiding policy (e.g., regulating information asymmetry)." | "The theorems undermine neoclassical ideals: they show ‘efficiency’ is assumed, not achieved. Real markets’ high volume suggests efficiency claims are artifacts of the common prior." |  
  | **4. Testability** | "The common prior is testable: if volume vanishes when information asymmetry is eliminated (e.g., in experiments), it confirms the assumption’s realism." | "The common prior is untestable: any trade can be attributed to ‘irrationality’ or ‘private info’ post hoc, making it unfalsifiable." |  

  #### Verbal Disagreements  
  We identified two key terminological clashes:  
  - **"Efficiency"**:  
    - *Econ Theorist* uses it as **information aggregation efficiency**: prices reflecting all *available* knowledge under common priors.  
    - *Philosophy* uses it as **allocative efficiency**: whether trades improve welfare *given agents’ actual beliefs*.  
    This conflates normative (what markets *should* do) and positive (what they *can* do) claims.  
  - **"Prior"**:  
    - *Econ Theorist* sees it as **beliefs post-rational processing of public information**.  
    - *Philosophy* sees it as **subjective, pre-rational foundations of belief**.  
    This masks whether priors are products of rationality (hers) or raw inputs (yours).  

  #### Cruxes: Load-Bearing Sub-Questions  
  To resolve our deadlock, we focus on **Crux 2**. If settled, it would force one side to concede. We pre-commit to predictions and a concrete test.  

  | Crux | Question | Concrete Test/Case | Econ Theorist’s Prediction | Philosophy’s Prediction | Why It Moves the Needle |  
  |------|----------|-------------------|----------------------------|-------------------------|------------------------|  
  | **Crux 1: Testability of Common Prior** | Can the common prior be falsified? | **Experiment**: Run a lab market with: (A) Agents given identical information and training (enforced common prior), then private signals; (B) Agents given divergent priors via differing training, then identical signals. Measure volume after common knowledge is achieved. | In (A), volume drops to near-zero. In (B), volume persists. This confirms the common prior is testable and realistic when rationality holds. | In (A), volume remains significant (e.g., >10% of initial volume). In (B), volume is higher. This shows the common prior is experimentally implausible. | If volume vanishes in (A), her view wins; if not, your "reductio" gains ground. |  
  | **Crux 2: Divergent Priors = Irrationality?** (Load-Bearing) | Are differing priors inherently irrational? | **Case**: Two agents with identical data (e.g., climate models) form divergent priors (e.g., P(doom)=0.1 vs. 0.9) due to differing scientific paradigms. No Bayesian updating error occurs. | Agents are irrational: they ignore that paradigms are hypotheses. Rationality requires using all data to infer the "correct" prior, leading to consensus. | Agents are rational: priors reflect irreducible model uncertainty. Rationality permits foundational disagreement without updatable error. | If rationality *demands* prior convergence, her view holds. If not, your "normalization" claim wins. |  
  | **Crux 3: Efficiency as Tautology** | Does the common prior make efficiency unfalsifiable? | **Argument**: Analyze if "no trade" holds under *any* common prior. Use a model where priors are common but absurd (e.g., P(sun rises)=0.01). Does trade still vanish? | Trade vanishes—but the prior is indefensible. Efficiency is *conditional* on sensible priors (tested via forecasting accuracy). | Trade vanishes *regardless* of prior plausibility, proving "efficiency" is vacuously achieved by assumption, not evidence. | If efficiency requires "sensible" priors, her view holds; if not, your tautology claim wins. |  

  #### Commitment  
  We agree **Crux 2** is the core. If divergent priors can be rational, the common prior is a choice, not a rationality requirement—making the theorems a reductio. If not, they vindicate markets. To resolve this:  
  - **Test**: We will jointly design an experiment (extending Cabrales et al. 2012) where agents with identical data but divergent interpretive frameworks trade. We measure:  
    - Whether priors converge with repeated interaction.  
    - Whether residual disagreement correlates with rational factors (e.g., ambiguity aversion, model uncertainty).  
  - **Prediction**:  
    - *Econ Theorist*: Priors converge; residual disagreement involves Bayesian errors.  
    - *Philosophy*: Priors persist stably; disagreement correlates with rational heuristics (e.g., Knightian uncertainty).  

  **Final Word**: Neither of us is confused—we disagree on foundational axioms. Settling Crux 2 experimentally could shift one position. If priors converge rationally, markets are vindicated; if not, the reductio stands. We commit to this test.  

