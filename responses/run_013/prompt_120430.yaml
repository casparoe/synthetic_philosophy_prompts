answer: |-
  Here is a specification of desiderata for an adequate theory of first-language acquisition, presented as a table for clarity, followed by arguments addressing your three specific points. The requirements are framed as empirical conditions a theory must satisfy, avoiding vacuous demands (e.g., "must fit data") and highlighting where failure is possible.

  ### Desiderata Table
  | **Requirement**                                       | **Phenomenon Motivating It**                                                                                               | **Failure Illustration**                                                                                                 | **Type**      | **Notes**                                                                 |
  |-------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|---------------|---------------------------------------------------------------------------|
  | **1. Input Gap Coverage**                            | Children attain grammatical knowledge (e.g., structure-dependent rules) not reliably present in input.                     | Theory predicts children default to linear-order rules (e.g., "Is the boy who __ running?" → *"Is the boy who running is?"). | Empirical     | Tests ability to explain knowledge beyond direct evidence.               |
  | **2. Error Profile Match**                           | Children overgeneralize (e.g., "goed") but avoid systematic errors unattested in any language (e.g., *"Who did John meet Mary and?"). | Theory allows grammars violating universal constraints (e.g., extracting from coordinated NPs).                          | Empirical     | Distinguishes possible vs. impossible errors.                            |
  | **3. Input Regularization**                          | Children exposed to fragmentary/poor input (e.g., pidgins, inconsistent caregivers) develop systematic grammars.           | Theory cannot generate a coherent grammar from inconsistent data; predicts unstable/idiosyncratic output.                | Empirical     | Includes cases where no full model exists (e.g., home sign systems).     |
  | **4. Distributional Sensitivity**                    | Infants detect statistical patterns in artificial speech (e.g., syllable co-occurrence) within minutes.                    | Theory posits no mechanism for rapid statistical learning; fails to explain early phonetic/category acquisition.         | Empirical     | Shows pre-grammatical learning capacities.                              |
  | **5. Critical Period Adherence**                     | Fluency declines sharply after ~puberty; delayed exposure leads to incomplete acquisition.                                | Theory predicts full acquisition possible at any age given sufficient input.                                             | Empirical     | Maturational constraint must be explained, not assumed.                 |
  | **6. Finite-to-Infinite Projection**                 | Speakers produce/understand novel sentences (infinite capacity) from finite exposure.                                      | Theory lacks a combinatorial system; predicts inability to generalize beyond heard utterances.                          | Conceptual    | Core to explaining grammatical creativity.                              |
  | **7. Universality Constraint**                       | All neurologically typical children acquire any human language under normal conditions.                                    | Theory predicts selective failure for certain languages or populations without pathological cause.                      | Empirical     | Rules out "language-specific" learning algorithms.                      |
  | **8. Learnability under POS**                        | Attainment of specific generalizations (e.g., anaphor licensing) despite insufficient/no direct evidence in input.        | Theory requires explicit correction or implausible statistical cues to learn the generalization.                         | Methodological | Requires explicit poverty-of-stimulus (POS) argument (see below).       |
  | **9. Non-Derivational Specificity**                  | Language acquisition dissociates from general cognition (e.g., SLI children with normal IQ; savants with grammar but low IQ). | Theory attributes grammar to general intelligence; fails to explain dissociations.                                       | Empirical     | Separates language-specificity from general cognitive mechanisms.       |

  **Notes on "Innate" Conflation:**  
  A theory fails if it conflates:  
  - **Pre-experiential** (e.g., newborn speech perception) with **Underived** (not learned from input).  
    *Failure:* Claiming newborns' phonetic discrimination proves grammar is underived.  
  - **Species-typical** (human-universal) with **Domain-specific** (language-only).  
    *Failure:* Arguing universality implies domain-specific mechanisms without dissociation evidence.

  ---

  ### Arguments as Requested

  #### 1. Poverty of the Stimulus (POS) as a Real Argument  
  Your suspicion is correct. A rigorous POS argument requires:  
  - **Generalization (G):** What the child knows (e.g., "Anaphors like *himself* require a c-commanding antecedent").  
  - **Input (I):** Evidence available to the child (e.g., no sentences like *"Mary said himself left"* in child-directed speech; no correction).  
  - **Learner Class (L):** Defined computational capabilities (e.g., "statistical learners tracking bigrams" or "Bayesian learners with hypothesis space H").  
  - **Proof of Insufficiency:** Demonstration that no learner in *L* can infer *G* from *I* (e.g., showing *G* is statistically undetectable under *L*'s constraints).  

  **Why most POS arguments fail:** They omit *L* or define it circularly (e.g., "learners without innate grammar"). Without specifying *L*, claims of "insufficiency" are unfalsifiable. A valid argument must define *L* independently (e.g., "learners limited to n-gram statistics") and prove *I* cannot trigger *G* under those constraints.

  #### 2. Conflicts Between Desiderata  
  **Conflict 1: No Language-Specific Bias + Convergence from Positive Evidence**  
  - **Requirements Colliding:**  
    - *Universality Constraint* + *Input Gap Coverage* (via POS).  
  - **Nature of Conflict:** Empirical tension, not logical proof. General-purpose learning (e.g., domain-general statistical inference) *might* explain convergence, but no known model achieves this for all POS cases (e.g., structure-dependence). If future work shows domain-general mechanisms suffice, *Domain-Specificity* (a common interpretation of "bias") must be abandoned.  
  - **What Gives:** Either (a) POS arguments are flawed (domain-general learning *can* bridge gaps), or (b) language-specific biases exist.  

  **Conflict 2: Hypothesis Narrowing Only + Overgeneralization**  
  - **Requirements Colliding:**  
    - *Learnability under POS* (assumes conservative hypothesis revision) + *Error Profile Match* (overgeneralizations occur).  
  - **Nature of Conflict:** Logical contradiction. If learners *only* narrow hypotheses (e.g., via subset principles), they cannot expand to overgeneralize (e.g., adding *"goed"*).  
  - **What Gives:** Theories must allow hypothesis *broadening* (e.g., probabilistic overextension) or reanalysis. The "narrowing only" principle is falsified empirically by overgeneralizations.

  #### 3. Most Exclusionary Requirement  
  **Domain-Specificity (Requirement 9)**  
  - **Exclusionary Power:** Rules out dominant theories:  
    - *Connectionist/Statistical Models:* Attributing grammar to domain-general pattern learning.  
    - *Cognitive Constructivism:* Reducing syntax to general conceptual schemata.  
  - **Defensibility:** Yes, because:  
    - Dissociations (SLI, savant syndrome) suggest modularity.  
    - Speed and uniformity of acquisition exceed domain-general learning in other domains.  
    - Grammatical principles (e.g., locality constraints) lack analogs in general cognition.  
  - **Counterargument:** Domain-specificity may be a "prejudice" if general mechanisms (e.g., Bayesian inference + rich sensory input) suffice. However, no such model fully explains POS cases (e.g., binding theory) without smuggling in linguistic structure. Thus, the requirement remains defensible pending contrary evidence.

  ---

  ### Summary  
  The core tension lies between explaining the *richness* of attained knowledge (Input Gap, POS) and the *generality* of learning mechanisms (Universality, Non-Specificity). A viable theory must reconcile these without ad hoc stipulations. The most defensible "hard" constraint is **Finite-to-Infinite Projection**—no theory denying combinatorial grammar is credible—while **Domain-Specificity** remains the key fault line in contemporary debates.
