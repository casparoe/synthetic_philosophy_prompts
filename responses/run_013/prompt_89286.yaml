answer: |-
  ### Research Proposal: Disambiguating the Symbol Grounding Problem: Genetic vs. Sustaining Grounding  

  **Principal Investigator**: [Your Name]  
  **Duration**: 12 months  
  **Fellowship Requested**: [Specify Fellowship Name]  

  #### 1. Introduction and Problem Statement  
  Last month, I debated a colleague working in machine learning who claimed the symbol grounding problem—how symbols acquire meaning—is “solved in practice” by large-scale AI systems trained on text and images. His view is that statistical patterns in massive datasets endow symbols with semantic content, rendering philosophical concerns about “meaningless symbol manipulation” obsolete. I contend this response misidentifies the problem. The issue isn’t whether symbols *can* correlate with reality (they clearly can), but *what fixes their content* at a given moment. My colleague’s position addresses only how symbols *originate* from data (a genetic question), whereas the grounding problem’s core tension—famously illustrated by Searle’s Chinese Room or Harnad’s “symbol merry-go-round”—concerns how meaning is *sustained* during use. This conflation is pervasive: theories of symbol grounding often answer one question while being interpreted as answering both, leading to unresolved disputes. This project aims to resolve these disputes by rigorously separating two distinct grounding questions:  
  - **Genetic Grounding**: What causal history must a token have to carry its content? (e.g., What makes this symbol arise from *that* object?)  
  - **Sustaining Grounding**: What features of a system’s *current* organization and environmental coupling fix its meaning *now*? (e.g., What makes this symbol *continue to mean* “apple” during reasoning?)  

  My hypothesis is that objections like “causal chains are too deviant” or “symbols lack understanding” target sustaining grounding, but the theories they challenge (e.g., causal-historical accounts) often only address genetic grounding. Clarifying this distinction will show why my colleague’s “solution” is incomplete and why philosophical worries persist.  

  #### 2. Research Question  
  Can the separation of genetic and sustaining grounding questions resolve key disputes in symbol grounding by showing that:  
  - (a) Standard theories (e.g., causal, teleological, or functional-role accounts) exclusively address one question but are mistakenly applied to both?  
  - (b) Objections to these theories (e.g., deviant causal chains) only undermine their ability to answer the *sustaining* question?  
  - (c) The sustaining question resists reduction to genetic or statistical accounts, requiring distinct explanatory resources?  

  This question has a determinate answer: either the separation dissolves disputes by reorienting objections, or it proves inert. It avoids “taking sides” by testing whether the distinction explains persistent disagreements.  

  #### 3. Why Existing Positions Leave the Question Open  
  Current theories are siloed and incomplete:  
  - **Causal-historical theories** (e.g., Fodor-style semantics) specify how symbols *originate* from interactions (genetic grounding) but say little about what sustains meaning during detached reasoning. This invites objections like Putnam’s “Twin Earth” or Kripke’s “quus” paradox, which attack how content is fixed *now*—a challenge these theories never aimed to answer.  
  - **Teleosemantic theories** (e.g., Millikan-style functions) explain content via evolutionary or learning histories (genetic grounding) but struggle with novel symbol use (e.g., AI generating new concepts), where current function may diverge from historical purpose. Critics note this allows “meaningless” symbols if history is detached from present context.  
  - **Functional-role semantics** (e.g., conceptual role theories) focus on sustaining grounding—content as determined by current inferential roles—but are accused of circularity (“symbols grounding symbols”) and fail to explain genetic origins.  

  These positions leave the problem open because each answers one question while masquerading as a full solution. Objections arise when a theory strong in genetic grounding (e.g., my colleague’s statistical AI) is critiqued for lacking sustaining grounding (e.g., “Does ChatGPT *understand*?”). The distinction remains unexplored, allowing disputes to talk past each other.  

  #### 4. Method: A 12-Month Conceptual Investigation  
  The project will use philosophical case-building and conceptual analysis, with no empirical component. Work will proceed in three phases:  

  **Months 1–4: Constructing Divergence Cases**  
  I will develop thought experiments where genetic and sustaining grounding come apart, testing if existing theories can accommodate them. Examples:  
  - *De-Historized AI*: An AI trained on cat images (genetically grounded) but now runs in a disconnected mode where its “cat” symbol is activated randomly. Is “cat” still meaningful? If not, what current mechanisms would restore meaning?  
  - *Biological Twin*: A neural structure evolved for threat detection (genetic) is repurposed for social reasoning. Does its content change based on history or current use?  
  These cases will challenge theories to separate the two questions explicitly.  

  **Months 5–8: Restating Theories for Sustaining Grounding**  
  I will test whether genetic-focused theories (e.g., causal, teleological) can be reformulated to address sustaining grounding without collapsing into functional-role accounts. For instance:  
  - Can causal theories incorporate real-time environmental coupling (e.g., predictive processing) to fix current content?  
  - Does teleosemantics allow “current function” to override history?  
  Success requires the reformulation to avoid circularity and address objections (e.g., deviant chains). Failure implies the sustaining question necessitates functional-role elements.  

  **Months 9–12: Evaluating Costs and Implications**  
  I will assess what each separation “costs”:  
  - Does admitting functional roles for sustaining grounding imply internalism?  
  - Does prioritizing genetics undermine dynamical or embodied cognition?  
  - Does the distinction clarify AI debates? (e.g., showing LLMs excel at genetic but not sustaining grounding).  
  The endpoint is a framework mapping which theories fit each question and why this resolves disputes.  

  #### 5. Outcomes and Success Criteria  
  **Successful Outcome**: The distinction is validated if:  
  - Divergence cases show genetic and sustaining grounding are separable.  
  - Reformulated theories answer the sustaining question without circularity, reducing the force of classic objections.  
  - The separation explains why AI systems (per my colleague) solve genetic grounding but not sustaining worries (e.g., understanding).  
  This would resolve disputes by reorienting objections and reframing the grounding problem.  

  **Failure Conditions**: The project fails if:  
  - The distinction is real but irrelevant: it doesn’t clarify debates (e.g., objections persist unchanged).  
  - Sustaining grounding collapses into functional-role semantics, making the separation redundant.  
  - No divergence cases are robust (e.g., meaning always depends on both questions).  
  Failure would still advance understanding by revealing limitations in the distinction.  

  #### 6. Scope and Future Work  
  **Realistic 12-Month Scope**:  
  - Focus on 2–3 theories (causal, teleological, functional-role) and 3–4 objections (deviant chains, circularity, Twin Earth).  
  - Prioritize conceptual clarity over historical exegesis.  
  - Apply findings to one applied context (e.g., AI grounding debates).  

  **Deferred for Later Work**:  
  - Extensions to embodied/dynamical cognition.  
  - Empirical collaborations (e.g., computational modeling).  
  - Broader philosophical implications (e.g., for consciousness).  

  #### 7. Conclusion  
  This project addresses an argument that has “stuck with me” by rigorously separating two grounding questions. If successful, it will show why my colleague’s AI “solution” answers only half the problem, and why philosophy must confront what sustains meaning *now*. By clarifying this distinction, we can move beyond talking past one another—in academic debates and late-night arguments alike.  

  ---  
  **Format Note**: This proposal is intentionally concise for a two-page limit. I will add section headers and references (described, not cited) as needed. Let me know if you’d like adjustments to tone or structure!
