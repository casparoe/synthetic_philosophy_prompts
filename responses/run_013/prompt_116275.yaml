answer: |-
  Here is a sestina crafted to your precise specifications, embodying the "retrospective muster" through its form and voice:

  **The Mender of Monuments**

  This **stone** is cold beneath my working hand,
  A fractured plinth that once upheld a **name**
  Now weathered into silence. Paid my **debt**
  In mortar, sweat – the cost to mend this **field**
  Of carved regret. They gave a tattered **flag**
  To burn, but asked the monument stand **again**.

  The town, grown fat on peace, forgets **again**
  Which side was right, which wrong. This **stone**
  Endures their bland neglect. No **flag**
  Unfurls for heroes here, no whispered **name**
  Echoes across the quiet harvest **field**
  Where blood once settled like a heavy **debt**.

  They speak of sacrifice, a sacred **debt**
  To ancestors, though counted **again**
  And **again**, the ledger’s wrong. That **field**
  Was lost. The reckoning’s set in **stone**,
  A final column where no victor’s **name**
  Is carved beside the fallen and the **flag**.

  I chip the lichen off. The fading **flag**
  Depicted here – just folds in stone – **debt**
  Paid in full by death? Or does the **name**
  Demand more coin? Each blow starts **again**
  The slow erosion of the very **stone**
  That marks the boundaries of that **field**.

  What harvest sprang from that grim **field**
  But stories? Tall tales like a phantom **flag**
  Waved by the wind. I set another **stone**,
  Aligning edges. Feel the subtle **debt**
  Not owed to truth, but to the pang **again**
  Felt for the weight behind the carved-out **name**.

  The chisel doesn’t care what’s true. A **name**
  Is cut: a placeholder for the **field**
  Of unmarked graves. They muster **again**
  In bronze and verse, beneath this **flag**
  Of faded cloth. The living feel the **debt**
  Of meaning pressed on them like **stone**.

  *(Envoi)*

  Old mason, shape the **stone**:
  The **name** becomes the sound of forgetting.
  The **debt** accrues on fallow **field**.
  The faded **flag** is just a rag **again**.
  What do we owe the dust? **Again**.

  ---

  **How it enacts the retrospective muster:**

  1.  **The Sestina Form:** The relentless repetition of the end-words (*stone, name, debt, field, flag, again*) inherently mimics the "retrospective muster" – the cyclical, ritualistic summoning of the past. Each recurrence forces the word back into the narrative, just as the myth is forced back into the present.
  2.  **Shifting Connotations:** As the poem progresses, the meanings of the end-words subtly shift, enacting the transformation of history into heritage:
      *   *Stone*: Physical material -> Monument -> Burden -> Unchanging fact (yet being reshaped).
      *   *Name*: Specific identity -> Weathered anonymity -> Placeholder -> Sound/Forgetting.
      *   *Debt*: Literal payment -> Moral obligation -> Sacrifice -> Unsettled, perhaps false, account -> Burden of meaning.
      *   *Field*: Battlefield -> Place of death -> Harvest land (peace) -> Metaphorical field of graves/stories.
      *   *Flag*: Symbol of cause -> Tattered relic -> Faded depiction in stone -> Phantom symbol -> Merely cloth ("rag").
      *   *Again*: Repetition of action (mending) -> Recurrence of feeling/obligation -> Cyclical nature of myth-making -> Futility ("just a rag again").
  3.  **The Mason's Voice:** He is neither debunker nor sentimentalist.
      *   **Knowledge:** He knows the battle was lost ("That field was lost"), the ledger is wrong, the reckoning is final, the town forgets the cause, the flag is faded cloth, the name is becoming silence. He sees the "tall tales" and the "phantom flag."
      *   **The Pull:** He feels the "subtle debt" not to truth, but to the "pang" for the weight behind the name. He acknowledges the "stories" as the harvest and the persistent feeling of obligation ("What do we owe the dust?"). He performs the act of preservation.
  4.  **The Unresolved Tension:** The poem ends with questions and ambiguity:
      *   "What do we owe the dust? Again." – The central tension: Is the debt real? Is the muster justified? It remains unanswered.
      *   The envoi crystallizes the transformation: The name becomes forgetting, the debt accrues uselessly, the flag is just a rag *again* – yet the question persists, *again*. The myth persists *despite* the mason's awareness.
  5.  **Universality:** No proper nouns, dates, or specific references. The monument, the forgotten town, the lost battle, the faded symbol, the sense of inherited obligation – these are transferable to any "lost cause."
  6.  **The Grammar Made Audible:**
      *   The *sound* of the repeated end-words *is* the muster happening. Their placement at the end of lines gives them weight and forces attention, just as ritualized remembrance forces attention onto specific symbols and concepts.
      *   The subtle shifts in meaning mimic how the *meaning* of the past event is retroactively mustered and reshaped ("sacred debt," "phantom flag," "name becomes the sound of forgetting").
      *   The mason's labor *is* the enactment of keeping it alive, even as he questions it.

  This sestina uses the constraints of its form to make the abstract mechanism of "retrospective muster" tangible and audible, fulfilling your request for a poem that works on both the seminar-specific and universal human levels.
