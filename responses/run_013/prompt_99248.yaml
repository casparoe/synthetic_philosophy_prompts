prompt: |-
  I've been going back and forth with a friend about conditionals and I want to pin down what I actually think, because my gut keeps splitting and I half-suspect there's no single rule behind it. Take these at face value, they're just my verdicts:

  "If it's raining out, the match is off" — true. I'm watching the rain and I know the rules. And it seems to say the exact same thing as "the match is off if it's raining," I can't hear any difference between the two orderings.

  "If it's raining, it's raining" — true, just useless.

  "If the die comes up even, it's not a six" — sure, I'd accept that, probably right. But "if it comes up six, it's odd" — flatly false, no way. Then my friend says the second is just the contrapositive of the first and now I'm annoyed, because I *do* accept contraposition on stuff like "if he's in Paris he's in France" / "if he's not in France he's not in Paris." Both of those seem right to me.

  "If 2+2=4 then snow is white" — I reject this. Feels like it's asserting some connection that isn't there, like a bad joke. But both halves are true, and my friend says any conditional with a true consequent comes out true. That can't be right.

  "If it rains, the picnic's cancelled" — accept. "If it rains and we move it indoors, the picnic's cancelled" — reject, moving indoors is exactly the fix. So you can't just pile stuff onto the antecedent.

  Here's the pair that really gets me. "If it wasn't Mary who leaked the memo, someone in the office did" — I'm near certain of this. "If Mary hadn't leaked the memo, someone in the office would have" — I don't beleive that at all, I think probably nobody would have. Basically the same words, different tense, opposite verdicts.

  "If you're hungry there are biscuits on the sideboard" — perfectly fine thing to say, true even, and yet I obviously don't think being hungry makes biscuits appear. Compare with the die case, where I do feel like I'm tracking a real connection.

  "If that's a real diamond then I'm a monkey's uncle" — I say this constantly and it never feels false, but corner me on whether it's literally true and I have no idea what to say.

  My tentative rule was: a conditional is true just when the consequent is likely given the antecedent. That seems to get the die case, the picnic case, and the Mary-indicative case. But it makes the 2+2 case come out true, which I hate, and it makes the biscuits one come out mostly false, which I also don't like, and it has literally nothing to say about the Mary-counterfactual. So it's probably wrong or at least badly incomplete.

  What I want: is there a principle that gets most of these, or do I have to give one up? I'd rather keep the ones I'm surest about — the Mary pair, the 2+2 rejection, contraposition failing on the die — even if that costs me the tidy "likely given" story. So pick your principle, state it precisely enough that I can apply it myself, tell me what it predicts for a case I haven't listed, and be honest about which of my verdicts it can't save. And if the honest answer is "you need two seperate principles here," say so and tell me where the line falls.
reasoning: |-
  Okay, let me tackle this user's query. They're struggling with conditionals and want a consistent principle that explains their intuitions across various examples. First, I need to map out all their examples and their verdicts. 

  The user accepts "If it's raining, the match is off" as true, and sees no difference when the order is switched. That suggests the surface structure doesn't matter here. But then they reject "If it comes up six, it's odd" even though it's the contrapositive of "If even, not six," which they accept. Contraposition works for the Paris/France case but fails here. Interesting—so material implication might not be the whole story.

  The 2+2=4 example is rejected despite both parts being true. They feel there's a missing connection. The picnic case shows that adding to the antecedent ("if it rains and we move indoors") changes the truth value, which material implication wouldn't allow. The Mary pair is crucial: indicative vs. counterfactual with opposite verdicts. The biscuits conditional is accepted even though hunger doesn't cause biscuits to appear. The diamond/monkey uncle case is tricky—used rhetorically but not literally true.

  Their tentative "likely given" rule has issues. It makes 2+2 true (which they hate) and biscuits mostly false (which they dislike). The Mary counterfactual isn't covered. So they need a better approach. 

  I recall that linguistics and philosophy distinguish between indicative and counterfactual conditionals. The Mary pair is a clear example: indicative conditionals involve epistemic assessments (what's true given the antecedent), while counterfactuals involve hypothetical scenarios. That explains the different verdicts. 

  For the die case, the user accepts "if even, not six" but rejects "if six, odd." This is where the possible worlds semantics helps. The first conditional holds in all relevant die rolls, but the second fails because when it's six, it's not odd. The closeness of possible worlds matters here.

  The biscuits example works as an indicative conditional; given hunger, biscuits are available, not caused by hunger. The diamond one is a rhetorical device, not meant literally. 

  So the principles needed are: for indicatives, use an epistemic model (probability or belief revision). For counterfactuals, use possible worlds with similarity. Contraposition fails in cases like the die because the original conditional isn't a strict implication. The 2+4 case fails due to lack of relevance. 

  This approach saves most of their verdicts: Mary pair distinction, contraposition failing for die, rejecting 2+2, picnic cases. The biscuit conditional is accepted as an indicative, and the diamond one is handled as non-literal. The only cost is giving up the idea that all conditionals follow a single rule. But that's necessary given the data. 

  Testing with "If I flip this coin, it will land heads": an indicative might be uncertain, while a counterfactual ("if I had flipped") could go either way. The user's intuitions here would align with the separate principles.
answer: |-
  Your intuitions are spot on—conditionals aren't governed by a single rule. Based on your judgments, you need **two distinct principles**: one for **indicative conditionals** (about belief or evidence) and one for **counterfactuals** (about hypothetical scenarios). Here's how to reconcile your verdicts:

  ---

  ### **Principle 1: Indicative Conditionals (Epistemic "Given" Rule)**
  - **Definition**: "If P, then Q" is true *if and only if* Q is true **in all scenarios consistent with your knowledge where P is true**.  
  - **Applies to**: Statements about what *is* or *must be* true given the antecedent (e.g., "if it's raining, the match is off").  
  - **Key features**:  
    - Ignores causality or "connection" (saves the biscuits case).  
    - Contraposition **fails** when P and Q aren't logically linked (explains the die paradox).  
    - Rejects irrelevant truths (saves the 2+2 case).  

  **Your cases resolved**:  
  - ✅ *"If it's raining, the match is off"*: In all rain-scenarios you know, the match is off.  
  - ✅ *"If the die is even, it's not a six"*: In all even-outcome scenarios, it’s not six.  
  - ❌ *"If it's six, it's odd"*: False—in six-scenarios, it’s even, not odd.  
  - ❌ *"If 2+2=4, snow is white"*: Rejected—snow’s whiteness isn’t tied to 2+2 in your knowledge.  
  - ✅ *"If it rains, the picnic's cancelled"*: True given your knowledge.  
  - ❌ *"If it rains and we move indoors, the picnic's cancelled"*: Rejected—moving indoors creates a scenario where cancellation isn’t true.  
  - ✅ *"If it wasn’t Mary, someone in the office leaked it"*: True given your knowledge about the leak.  
  - ✅ *"If you're hungry, there are biscuits"*: True—your knowledge includes biscuits being present, regardless of hunger.  
  - 🤔 *"If that's a diamond, I'm a monkey's uncle"*: **True** under this rule (if you know it’s fake and you’re human), but it’s *pragmatically* a joke—not meant literally.  

  **Contraposition failure**:  
    - "If even, not six" → true.  
    - Contrapositive: "If six, not even" → false.  
    - *Why?* "Even" and "six" aren’t mutually exclusive in your knowledge-base—they overlap. Contraposition only holds for strict logical entailment (like Paris/France).  

  ---

  ### **Principle 2: Counterfactuals (Similarity-Based Rule)**
  - **Definition**: "If P had been true, Q would have been true" is true *if and only if* in the **closest possible world where P is true, Q is also true**.  
  - **Applies to**: Hypotheticals about how things *would* be different (e.g., "if Mary hadn’t leaked it...").  
  - **Key features**:  
    - Depends on causal/nomological relationships.  
    - Judges similarity to actual world (e.g., minor changes vs. major breaks).  

  **Your cases resolved**:  
  - ✅ *"If Mary hadn’t leaked the memo, someone else would have"*:  
    - **False** for you—in the closest world where Mary doesn’t leak, no leak occurs (no "backup" leaker).  
  - ✅ *Picnic counterfactual*: "If it had rained and we moved indoors, would the picnic be cancelled?" → **False** (since moving indoors "fixes" it).  

  ---

  ### **Where the Line Falls**
  - **Indicatives**: Present-tense, about current knowledge/beliefs (*"is"*, *"are"*).  
  - **Counterfactuals**: Past-tense/subjunctive, about alternatives (*"had"*, *"would"*).  
  - **The Mary Pair** is the litmus test:  
    - Indicative: "If it wasn’t Mary, someone did" → **true** (based on known facts).  
    - Counterfactual: "If Mary hadn’t done it, someone would have" → **false** (hypothetical scenario).  

  ---

  ### **Test Case: Coin Flip**
  - *Your principle applied*:  
    - Indicative: "If I flip this coin, it will land heads" → **false** (you know it could land tails).  
    - Counterfactual: "If I had flipped the coin, it would have landed heads" → **true only if** the closest flip-worlds are heads-dominated (e.g., a weighted coin).  

  ---

  ### **What You Must Give Up**
  - **A single unifying rule**: Your "likely given" idea works for indicatives *if* "likely" means "certain given current knowledge." But counterfactuals need a separate similarity-based logic.  
  - **The monkey’s uncle conditional**: Under the epistemic rule, it’s technically true if you know the diamond is fake and you’re human—but it’s not *asserted* as truth; it’s rhetorical exaggeration. Pragmatics overrides semantics here.  

  ### **Why This Saves Your Intuitions**
  - Keeps contraposition failure for die/picnic cases (no logical entailment).  
  - Explains 2+2 rejection (no relevance in knowledge-base).  
  - Resolves the Mary paradox via tense distinction.  
  - Accepts biscuits/diamond conditionals as literally true but pragmatically loaded.  

  This dual framework matches linguistics (e.g., Kratzer's modal base/similarity) and philosophy (Lewis/Stalnaker semantics). Trust your gut—it detected the split all along.
