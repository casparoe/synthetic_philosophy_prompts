prompt: |-
  ok so my friend and i have a long-running argument about what counts as pseudoscience and i want to nail down my own view, because i keep contradicting myself and it's getting embarassing. here are my gut calls. i'd like you to find the principle (or the small set of principles) that gets them, then tell me what it says about cases i haven't listed, and be honest about which of my calls it can't save.

  my verdicts:

  - astrology: pseudoscience, no question.
  - fomenko's new chronology, the thing where basically all of ancient history gets redated: pseudoscience.
  - ancient-aliens-built-the-pyramids stuff: pseudoscience.
  - wegener's continental drift back when every geologist rejected it: NOT pseudoscience, just an idea ahead of its time.
  - cold fusion: NOT pseudoscience, even though the original claim was wrong and the whole area is a mess.
  - homeopathy: pseudoscience.
  - string theory and the multiverse: NOT pseudoscience, even though i honestly can't see how you'd ever test them.
  - a woman selling crystal healing that 'realigns your energy field' to cure cancer: pseudoscience.
  - a lone crank claiming a new fundamental force, but who posts all his raw data, begs people to try to falsify him, and publicly drops the idea when they do: NOT pseudoscience, even though i think he's wrong.
  - a research program that's made testable predictions for decades and blames every failed one on the 'negative intentions' of the people running the tests: pseudoscience.
  - phlogiston, and the steady-state universe: dead and wrong, but NOT pseudoscience either — those were honest people doing science badly.
  - the old 'scientific' racism: pseudoscience, it claimed to be science and then defended the conclusion no matter what the evidence did.
  - the simulation hypothesis: genuinely torn. is it pseudoscience, or just philosophy wearing a lab coat?

  two that really trip me up:

  1. a group that shields a claim from all criticism, cherry-picks, shouts down skeptics, refuses to run the obvious experiment... and turns out to be right. i still want to call the belief pseudoscientific. but how can a true belief be pseudoscience? that seems impossible if pseudoscience is a fact about the content of the claim.

  2. a claim that's false, unfalsifiable, and pursued by completely honest people who'd abandon it tomorrow if you gave them a reason (pick your favorite interpretation of quantum mechanics): i don't want to call that pseudoscience at all.

  my tentative guess at a principle: it's not about the theory's content at all, it's about (a) whether the people holding it would actually change their minds if the evidence flipped, and (b) whether they're claiming to be doing science in the first place (so theology is out, but astrology is in). but that makes 'pseudoscience' a fact about people rather than theories, and it lets the true-but-insulated case in as pseudoscience, which feels both right and weird.

  so — what's the principle? test it against my calls, repair it where it breaks, and give me the answer as a JSON object with exactly these fields:

  - candidates: an array. each item has name (a short label), statement (the principle in one or two precise sentences), clauses (an array of objects with clause and motivating_case), new_case_predictions (an array of objects with case, verdict, and why, for at least three cases i didn't list), and asker_verdicts_it_cannot_save (an array of strings).
  - best: the name of the candidate you'd keep, or the string "synthesis" if you're merging a couple.
  - final_principle: your single best statement of the principle, plain prose, with whatever caveats it needs.
  - unresolved: the one case or pair of cases your principle still handles worst, and how you'd patch it.
reasoning: |-
  Okay, the user has a complex challenge: they're embarrassed about contradicting themselves in arguments over what counts as pseudoscience. They've provided detailed verdicts on various cases and two particularly tricky scenarios. I need to extract a coherent principle from their judgments, test it against their examples, and address the edge cases they find problematic.

  Looking at their verdicts, several patterns emerge. They consistently reject theories that insulate themselves from falsification (like astrology or crystal healing) but accept wrong theories that followed scientific norms (like Wegener's continental drift). Their tricky cases highlight key tensions: whether a true belief can be pseudoscientific if defended poorly, and whether unfalsifiable but honestly held claims should be excluded.

  Their tentative principle focuses on two factors: willingness to change minds based on evidence, and claims of scientific status. This explains many cases well - like distinguishing homeopathy (defensive) from cold fusion (open to testing). But it struggles with their "true but insulated" example where a group uses pseudoscientific methods but happens to be right.

  I'll develop three candidate principles. The first candidate focuses on insulation from falsification, which covers most cases but struggles with string theory's testability issues. The second candidate emphasizes institutional norms and peer review, which handles research programs well but over-punishes lone cranks. The third candidate prioritizes "epistemic integrity" - willingness to change beliefs based on evidence - which resonates with their phrasing but risks being too broad.

  For new test cases: Freudian psychoanalysis shows how a once-scientific field can become pseudoscientific through insulation; Lysenkoism demonstrates ideology corrupting methods; and the simulation hypothesis reveals the fuzzy boundary with philosophy. Each candidate principle handles these differently.

  The unresolved challenge remains that "true but insulated" case. The user intuitively wants to call it pseudoscience despite the truth, which suggests pseudoscience is about methods, not truth value. I'll refine the final principle to emphasize methodological malpractice while adding caveats about institutional context and unfalsifiable claims.

  The JSON structure will present this analysis clearly, with the best principle centering on the systematic avoidance of empirical accountability while maintaining honesty about the simulation hypothesis as philosophy rather than pseudoscience.
