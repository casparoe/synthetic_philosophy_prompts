  **Explanation:**

  1.  **Synthesis:** Your intuitions map best onto a synthesis of the three candidates. The core insight is that pseudoscience isn't defined by the *truth* or even *current testability* of the claim, but by the **methodological malpractice and epistemic bad faith** used to assert and defend it *while claiming scientific authority*. It's about **insulating the core belief from empirical accountability**.
