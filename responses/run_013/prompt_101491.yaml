      *   **Simulation Hypothesis:** The principle helps here. If presented as a philosophical thought experiment (common), it's **not pseudoscience**. If presented as a *scientifically proven fact* using untestable assertions while dismissing criticism or evidence against it (e.g., "all anomalies are glitches"), it **edges into pseudoscience** by claiming scientific authority while insulating the core claim. The patch clarifies that mere untestability *within norms* isn't enough; active insulation/dogmatism is required.
  4.  **Why it Works:** It centers on the *behavior* and *rhetoric* surrounding the claim – the claim to science and the active avoidance of the accountability that comes with that claim. This explains why dead theories (Phlogiston) aren't pseudoscience (they played by the rules), while things like 'scientific' racism are (they subverted the rules to support dogma), and why the True-But-Insulated group is pseudoscientific even if right (their *method* was corrupt). It resolves your contradictions by shifting focus from the *claim itself* to the *practice of defending it under the banner of science*.
