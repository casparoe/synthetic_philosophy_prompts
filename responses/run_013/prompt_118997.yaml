answer: |-
  Let's start by grounding the three approaches. The Nordic model criminalizes the purchase of sexual services while decriminalizing the sale. Its core aim is to reduce demand, framing prostitution as inherently exploitative and a form of gendered violence. The buyer is the perpetrator of harm; the seller is a victim or at minimum, someone acting under constrained choice. Legalization-and-regulation treats sex work as a legitimate service industry. It establishes brothels, mandates health checks, requires licensing, and aims to control exploitation through state oversight. It assumes the harms of sex work stem from its *illegality* – violence, disease, trafficking – and that state regulation mitigates these. Full decriminalization (New Zealand model) removes criminal penalties for both buying and selling between consenting adults, treating it as ordinary work. It relies on standard labor laws, health and safety regulations, and anti-discrimination statutes for protection. The harm here is seen as coming primarily from *stigma* and *criminalization*, not the work itself.

  Now, the Nordic model's coherence hinges on a specific, layered theory of consent and agency. It doesn't deny the *individual* capacity of the seller to choose in a narrow, immediate sense. She can say "yes" to a specific transaction, understand the terms, and perform the act willingly. **Where it diverges is in asserting that this individual consent is rendered morally and socially void by the broader context in which it occurs.** This context is characterized by structural forces: pervasive gender inequality, economic vulnerability, the historical objectification of women's bodies, and the inherent power dynamics of paying for sexual access. The "yes" is seen not as a free exercise of autonomy in a vacuum, but as a response shaped (or even compelled) by these oppressive structures. Punishing the buyer is thus not about punishing him for *ignoring* her "no," but for *participating* in and *perpetuating* a system deemed fundamentally harmful. Her decriminalization acknowledges she acts under duress (broadly defined); his criminalization holds him accountable for contributing to that harmful system.

  Running your test cases clarifies the tensions:

  1.  **The Contented Seller:** This scenario *does* strain the Nordic model's victim-centric framing. If she genuinely prefers the work, finds it empowering, and would choose it regardless of economic need, the "constrained choice due to vulnerability" argument weakens significantly. The model's response typically shifts ground. It argues that even her genuine preference exists within, and is shaped by, a patriarchal system that commodifies female sexuality. Her "choice" is still seen as a product of distorted values. Punishing the buyer becomes less about protecting *her* from immediate harm (which she denies) and more about protecting the *social good* of gender equality and non-commodified intimacy. The buyer is punished for engaging in an act deemed corrosive to societal values, regardless of the seller's subjective experience. **This *is* paternalistic,** prioritizing a societal vision of harm and gender relations over the individual woman's stated preference and agency. The buyer's "wrong" becomes participating in a transaction defined as socially harmful *per se*.

  2.  **Disability Rights:** The argument that paid sexual access is a welfare good for people with disabilities challenges the "she is always the victim" narrative inherent in much Nordic advocacy. The model struggles to absorb this cleanly. Proponents might argue: a) The need for paid access highlights society's failure to provide adequate social, intimate, and sexual support for disabled people, pushing the burden onto marginalized sellers. b) The transaction remains fundamentally exploitative due to the inherent power imbalance of paying for intimacy, regardless of the buyer's vulnerability. However, if the seller consents willingly and views it as providing a valuable service, and the disabled buyer experiences it as essential relief and connection, criminalizing the buyer actively harms *both* parties. It denies the disabled person access to a service they deem vital and criminalizes their attempt to meet a fundamental need, while simultaneously undermining the seller's agency in choosing to provide that service. The Nordic model struggles to acknowledge this scenario without diluting its core premise that buying sex is always an act of harm.

  **Can the Nordic Model be Coherent?** Yes, but only if you fully accept its foundational philosophical premise: **that paying for sexual access is an inherent harm to gender equality and human dignity, constituting an act of violence or exploitation *regardless* of the immediate, individual consent of the parties involved.** Consent is deemed insufficient to legitimize the transaction because the harm is located not (only) in the subjective experience of the seller, but in the objective nature of the act within a patriarchal system. This theory of consent is *structural* rather than purely individual.

  **What does this commit us to?** This structural view of consent and harm logically extends to other areas where bodily integrity, intimacy, or reproduction are commodified under potentially oppressive conditions:
  *   **Surrogacy:** Often opposed by Nordic-model proponents using similar logic – the potential for exploitation of economically vulnerable women, the commodification of reproduction and the female body, the difficulty of true informed consent given power imbalances and emotional complexities.
  *   **Organ Sales:** Opposition to selling kidneys rests on preventing exploitation of the poor, upholding bodily integrity as non-fungible, and rejecting the commodification of the human body.
  *   **Dangerous Jobs:** The logic is *less* consistently applied here. While acknowledging risks in mining, fishing, etc., these are often seen as necessary risks managed through regulation. The key difference is that Nordic proponents view paid sex as uniquely harmful *in kind* due to its intimate, gendered, and historically oppressive nature. However, *consistent* application of the "structural constraint negates consent" principle would demand far stricter limitations on dangerous jobs undertaken primarily by the economically desperate.

  **Underdetermined Elements:**
  *   **Nordic Model:** The *exclusive* criminalization of the buyer (not facilitators like landlords) is underdetermined. If buying is the harm, why not also penalize those enabling it? This is likely a pragmatic choice to avoid harming sellers indirectly. The focus on demand reduction over exit programs for sellers is also a political choice, not strictly required by the theory.
  *   **Legalization/Regulation:** The *degree* and *type* of regulation (mandatory health checks, brothel licensing vs. independent work, zoning) are highly contingent. The core belief only requires that state oversight reduces harm; the specific mechanisms reflect political compromises and bureaucratic preferences.
  *   **Decriminalization:** The extent to which standard labor laws apply (e.g., can sex workers unionize? Are brothel owners employers?) and how to handle third parties (managers, agencies) can vary. The core principle of non-criminalization doesn't dictate these details; they result from legislative and judicial interpretation within a decriminalized framework.

  **Conclusion:** The Nordic model *is* coherent, but its coherence rests entirely on accepting a specific, contestable philosophical anthropology: that sexual intimacy is a unique domain where market transactions are inherently destructive to human dignity and gender equality, rendering individual consent morally insufficient. It prioritizes combating structural harm over individual autonomy in this specific sphere. If you reject that premise – if you believe that individual consent *can* legitimize sexual transactions in the market, even under non-ideal conditions – then the Nordic model appears as incoherent paternalism, punishing one consenting adult for engaging with another. Its handling of your test cases exposes this tension: it either relies on a broad, structural definition of harm that overrides individual experience (risking paternalism), or struggles to accommodate scenarios that don't fit the victim-perpetrator mold. The choice between models ultimately rests on this deeper philosophical disagreement about the nature of consent, commodification, and harm in the realm of sexuality.
