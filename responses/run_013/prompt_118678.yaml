prompt: |-
  my mate Nadia is a sexual health nurse and runs the consent workshops for the local uni, and she's definately not shy about which situations are "actually assault" and which are just people being horrible to each other. I keep a mental list of her rulings because they're a good puzzle:

  - A guy lets himself into his friend's flat, gets into bed with her in the dark while she thinks he's her boyfriend. She only works it out afterwards. Nadia: she never agreed to sex with him, that's assault, not a grey area.
  - A man tells a woman he's single, 34, plays in a band, owns his flat. He's married, 51, works in insurance, rents. She says afterwards she'd never have gone near him if she'd known. Nadia: that's consent. He's a shit and she was wronged, but she said yes to the sex that actually happened.
  - A manager hints to a junior that he'd struggle to support an application from someone who wasn't fully on board with the team, and she sleeps with him. Nadia: not consent, no question, and she got heated about it.
  - An ex threatens to send photos to her family unless she sleeps with him. Not consent.
  - A woman who's had most of a bottle of wine, can't really stand up, mumbles something like yes. Not consent.
  - A woman who's had two glasses, knows exactly what she's doing, regrets it in the morning. Consent — Nadia thinks it's a bit insulting to call that assault.
  - Her 16 year old cousin and the cousin's 24 year old boyfriend. Nadia says that's not consent either, and when I pushed her she said it's a bright line, doesn't matter whether the kid is up for it.

  My brother in law is a solicitor and he reckons the whole thing is just fraud in the factum vs fraud in the inducement, i.e. she's running the criminal law line: lied to about what the act was, no consent; lied to about something else, consent. That covers the first two. It doesn't obviously cover the manager one, unless you count what he said as a threat.

  The case I actually want your call on: a woman of 31 has been seeing the same GP for about three years for a chronic condition, she's in there every couple of months and he manages her medication. She's the one who comes onto him, after hours, in the office. He never mentions her treatment or her meds, doesn't promise her anything, doesn't threaten her with anything, and she's honestly delighted about it. I put a version of this to Nadia (made up, not a real patient) and she did the thing she never does, which is say she'd have to think about it.

  So what do you reckon she ends up saying, and how confident should I be? Give me the rules that fit everything she's already said, not just the tidiest one, what each of them predicts about the GP case, which one you'd bet she's actually running and why, and which single case I should put to her next to find out for sure.
