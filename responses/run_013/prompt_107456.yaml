prompt: |-
  I've been trying to figure out what I actually think about individual contributions to collective harms, and I'd like you to tell me what principle, if any, fits the verdicts below, where that principle disagrees with me, and what it implies for a case I haven't listed. Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of my cases.

  Some context on where I'm coming from: I'm a software engineer with no formal philosophy training, and my instincts are marginalist — I think in terms of expected value, deltas, and thresholds. That is probably why the cases below bother me, and I'd rather you not resolve them by appealing to an empirical fact about supply chains or voter turnout that I can't check without going online. If a verdict of mine turns out to depend on such a fact, say so and tell me what the principle says conditional on each possibility.

  My verdicts:

  1. Driving five miles for a pointless errand in a gas car: mildly wrong — a small mark against me, not a serious one.
  2. Eating a beef burger at a restaurant: wrong, and I'd say more wrong than the drive in (1), even though I have no idea how the two compare in emissions or animal suffering.
  3. Flying and then buying a carbon offset I'm fairly confident genuinely cancels the emissions: still somewhat wrong, though less wrong than flying without it. This annoys me, because if the offset really cancels it, the net harm looks like zero.
  4. Eating a burger the restaurant has already cooked, is about to throw out, and will not replace: fine, or nearly fine. Nothing I do changes how many patties were made.
  5. Voting in a national election: somewhat wrong to skip out of laziness, but not because my vote might decide it — I'm near certain it won't.
  6. Voting in a local race that was decided by three votes last time: clearly wrong to stay home. Same expected-impact math as (5), different feeling.
  7. A lake that absorbs 1,000 kg of a pollutant before it collapses, with 1,001 factories each emitting 1 kg. If I'm one of the first 1,000, my kilogram feels like a minor wrong. If I'm the 1,001st and mine is what tips the lake, I feel far more culpable — though the increment is the same 1 kg either way.
  8. Signing a pledge where my signature is the one that pushes a supplier past a threshold and gets them to switch to a cleaner default: feels like a real contribution and clearly worth doing. Had I signed one person earlier, so the threshold was crossed without me, it would have felt like nothing.
  9. The case I can't handle: the harm is already fully determined by others — everyone else has already driven, voted, and eaten, nothing I do changes the outcome, and I know all this. I still feel I shouldn't add my own contribution, and I can't say what that "shouldn't" is tracking.

  A principle I've been toying with: an action is wrong if it would be wrong for everyone in my position to do it. But this seems to cheat on (4) — if everyone ate the throwaway burger, restaurants would stop having throwaways, so the universalized version isn't the same case — and it seems beside the point on (8).

  What I want from you: a principle, or a small set of competing candidates, stated precisely enough that I can see which clause handles which case; the verdicts it forces me to give up, stated honestly; and what it predicts for a case I haven't listed — namely, one where I both do the marginal thing and recruit two friends to do it too, so my example may multiply the harm even if my own increment doesn't.
reasoning: |-
  Hmm, this user is grappling with some deep ethical questions around individual responsibility for collective harms. As a software engineer with marginalist instincts, they're clearly frustrated when their expected-value calculations clash with moral intuitions - especially in cases like carbon offsets (where net harm seems zero but still feels wrong) or tipping-point scenarios (where identical actions feel differently wrong depending on context).

  The cases they present reveal fascinating tensions: 
  - Burgers feel worse than car trips despite unknown harm comparisons (#1 vs #2) 
  - Saved-from-trash burgers feel neutral (#4) while carbon offsets still feel somewhat wrong (#3) 
  - Voting guilt persists even when impact probability is near-zero (#5) 
  - Tipping points dramatically shift culpability perceptions (#7, #8)

  Their proposed universalization principle is clever but runs into problems with counterfactuals - like how #4 would change behavior if universalized. The recruitment case they want predicted is particularly juicy because it introduces network effects beyond pure marginal impact.

  What's most revealing is their discomfort with the "fully determined harm" scenario (#9) - that persistent feeling of wrongdoing even when their action changes nothing. That's the philosophical knot to untangle. The solution probably lies in distinguishing between causal responsibility (did I change outcomes?) and constitutive responsibility (did I participate in harm?), but I need to express this without jargon.

  For the recruitment case: if my principle focuses on participation rather than impact, then recruiting others would be worse because I'm not just participating but actively propagating harm. That satisfies their request while introducing multiplicative effects organically.
answer: |-
  **Your intuitions are best captured by a principle where actions are wrong when they constitute participation in harmful systems or collective harms, independent of marginal impact.**

  **Reasoning:**  
  - **Principle:** "An act is pro tanto wrong if it constitutes participation in a collective harm that (a) is reasonably foreseeable, and (b) could be avoided without significant cost to the agent." This evaluates your role *within* a harmful practice, not just your causal delta.  
  - **How it handles your cases:**  
    1. **Driving for errand:** Wrong (participates in pollution system), mildly so due to low avoidability/salience.  
    2. **Beef burger:** More wrong than (1) because industrial meat production involves more severe, direct harms (animal suffering, deforestation).  
    3. **Offset flight:** Still somewhat wrong because you participated in the harmful act of flying; the offset repairs harm but doesn’t negate participation.  
    4. **Throwaway burger:** Not wrong (no participation in harm system; no causal link to production/demand).  
    5. **Skipping national vote:** Mildly wrong to skip (failing minimal civic participation), even without decisive impact.  
    6. **Skipping close local vote:** Clearly wrong (same principle as (5), but higher stakes make avoidance less reasonable).  
    7. **Lake pollutant (first 1,000):** Mildly wrong (participation in collective overpollution).  
    **Lake pollutant (1,001st):** Severely wrong because your act constitutes *triggering* collapse—participation now includes direct responsibility for threshold violation.  
    8. **Pledge signing:** Signing is right (participation in beneficial collective action). Not signing when your signature would trigger change is wrong (failing to participate in harm-reduction when easy).  
    9. **Fully determined harm:** Still wrong to participate—you’re endorsing/joining the harm, even if causally inert. The "shouldn’t" tracks complicity.  

  **Verdicts you must give up:**  
  - **Case 3:** You must accept that flying with a true offset isn’t "net zero" in moral terms; participation matters independently.  
  - **Case 5:** You must agree skipping a national vote is wrong *despite* near-zero impact probability, due to failure to participate minimally in a collective duty.  

  **Recruitment case prediction:**  
  - **Action:** You marginally contribute to harm *and* recruit two others.  
  - **Principle’s verdict:** *More* wrong than acting alone. You are not just participating in harm, but actively propagating the harmful system. Your recruitment constitutes deliberate expansion of the harm, making you responsible for enabling others’ participation.  

  **Competing principle:** *Purely* marginalist (wrong only if your act changes expected harm). This would force you to reverse verdicts:  
  - Accept (3) as neutral (net zero harm).  
  - Reject wrongdoing in (4) throwaway burger, (5) voting, (7) non-tipping emissions, and (9) fully determined harm.  
  - It struggles with (8), as your signature alone may have near-zero expected impact pre-threshold.  

  **Why participation over marginalism?** Your intuitions consistently track *being part of* harmful collectives (meat, pollution, democracy) beyond your delta. The recruitment case confirms this: multiplying harm through others intensifies culpability under participation, while marginalism sees your personal delta unchanged.  

  **Final note:** For case (2) vs. (1), the principle relies on empirical severity of the systems you join (meat > transport emissions/suffering). If evidence contradicted this, the wrongness ranking would reverse—but your intuition likely assumes the standard hierarchy of harms.
