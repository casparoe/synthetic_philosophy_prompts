prompt: |-
  For three years I have sat on the planning commission of a mid-sized city — an advisory body, so our recommendations do not bind the council — and for most of that time I have been arguing with a close friend who practices campaign-finance law. Her position is that the alarm about money in politics is empirically overblown: the studies she trusts find that contributions move votes far less than people suppose, that most donors give for expressive or ideological reasons rather than to buy anything, and that in any case nobody can produce a single instance in which an official traded a particular decision for a particular dollar. My position, which I have never once managed to state in a way that satisfies her, is that this demand for a smoking gun cannot be met against the thing I actually see, because the thing I see never takes the form of a decision. I have no training in political science beyond one undergraduate course, so I cannot tell whether I am describing a real and named phenomenon in a clumsy way or half-inventing something.

  Three instances, all from my own three years. First, a landlord who had hosted two fundraisers for the mayor's allies proposed a modest revision of the inspection fee schedule; it was referred to a subcommittee in April and never came back, and the record contains no vote, no report, and no indication that anyone ever asked for it to die — the chair says only that the subcommittee is busy. Second, our agenda rule: anything not delivered to the clerk by Thursday at noon waits another month, and any member may hold an item indefinitely without stating a reason, which means the cheapest way to kill a proposal is to know the rule and enjoy the chair's goodwill; the minutes show nothing but orderliness. Third, and this is the one that troubles me most, a member with a business relationship to a large developer asked the city attorney whether he should recuse himself, was told that he should, and did — and was praised around the table for his ethics. He was also the only commissioner who ever pressed witnesses on their traffic studies, so his recusal subtracted the scrutiny rather than the conflict. My friend's reply to all three is that this is ordinary politics: organized, well-resourced interests win, and that is a fact about democracy rather than a species of corruption. I am genuinely unsure whether she is right, and I would rather find out than keep scoring points in an argument I may be losing.

  So what I want is not a reading list but a carving. Is there an established concept for influence that leaves no act to point at — where the relevant evidence is the shape of what was never considered and who was never in the room, and where the ordinary demand for proof of a trade is not merely hard to meet but structurally impossible to meet? If some established term is the nearest fit, tell me precisely how the thing I am describing differs from it, and in particular distinguish it from (i) bribery and the narrower claim that money buys votes, (ii) the broader and blander claim that organized groups out-argue unorganized ones, and (iii) whatever concept covers the case in which an agency ends up serving the industry it supervises — I have heard that phrase and do not think it is what I mean, since in my cases nothing is being administered on anyone's behalf. Then push on the edges. Is the phenomenon about the causal effect of money on outcomes, or about the standing of the parties, such that it would be present even if the outcome would have been identical with no contribution at all? Is it a kind of corruption, or a different failure altogether? And is it a feature of the world or of my evidence — would an observer with perfect information conclude that there was nothing there? If nothing established fits, say so plainly and coin a term, define it, and give me two cases that sit near its boundary and tell me which side they fall on. End with a final line of the form \answer{term}, where term is the established name if one exists and otherwise the term you would coin.
reasoning: |-
  Hmm, the user is describing their experience on a city planning commission and a long-standing argument with a friend about money's influence in politics. They've presented three concrete examples where influence seems to occur without explicit quid pro quo transactions. 

  The user is clearly frustrated that their friend demands "smoking gun" evidence of votes being traded for dollars - evidence they argue is structurally impossible to produce for the subtle influence patterns they observe. Their examples show how proposals die through procedural delays, how recusal can remove scrutiny rather than conflict, and how rules can be manipulated without explicit wrongdoing. 

  This is actually describing institutional capture - not through bribery, but through the accumulation of small advantages: donor access, procedural knowledge, and selective scrutiny. The phenomenon exists in the gap between bribery (explicit exchange) and mere interest group advantage. It's characterized by influence that prevents decisions from even being considered.

  The user wants precise conceptual carving: they need to distinguish this from bribery (which requires provable exchange), from regulatory capture (which implies formal administrative power), and from simple interest group advantage (which lacks the procedural avoidance aspect). 

  Key differentiators are: 
  1) The evidence lies in suppressed decisions rather than altered ones
  2) It's enabled by system features (like agenda rules) 
  3) It's amplified when scrutiny is selectively absent rather than corruptly present

  Even if outcomes might be the same without money, the process legitimacy is corrupted. An omniscient observer would see network advantages and influence, but no criminality. The established term that comes closest is "institutional capture" though it's not perfect. 

  The boundary cases help clarify: A donor's proposal sailing through uncontested wouldn't qualify (mere advantage), while explicit vote-trading would be bribery. But a proposal dying because opponents strategically recuse themselves? That's capture.
answer: |-
  You are describing **structural agenda exclusion**, a recognized but under-theorized phenomenon in political science and institutional economics. It differs from adjacent concepts in specific, meaningful ways:

  ### Core Concept: Structural Agenda Exclusion
  - **Definition**: The systematic prevention of certain issues or actors from reaching decision points through procedural, relational, or cultural channels—enabled by institutional design and resource asymmetry. Influence manifests not in altered decisions but in *preventing decisions from occurring*.  
  - **Mechanism**: Operates through:  
    (a) *Procedural weaponization* (e.g., exploiting agenda-setting rules),  
    (b) *Scrutity avoidance* (e.g., strategic recusal removing oversight capacity),  
    (c) *Relational gatekeeping* (e.g., chair's goodwill determining what advances).  
  - **Evidentiary Paradox**: Creates an absence of observable acts—no vote, no exchange, no record—making traditional "smoking gun" demands structurally unfulfillable.  

  ### Distinctions from Adjacent Concepts:
  1. **Bribery/Vote-Buying**:  
     - *Differs*: Requires provable *quid pro quo* exchange. Your cases lack any decision-point transaction.  
     - *Boundary*: If the landlord had texted "Kill fee revision = $5K donation," it’s bribery. Silent mutual understanding preventing debate is agenda exclusion.  

  2. **Interest Group Pluralism (organized groups winning fairly)**:  
     - *Differs*: Pluralism accepts outcomes decided through open contestation. Agenda exclusion prevents contestation entirely.  
     - *Boundary*: If developers out-lobby opponents in a hearing, that’s pluralism. If their ties keep traffic studies from being scrutinized, it’s exclusion.  

  3. **Regulatory Capture**:  
     - *Differs*: Capture implies state actors *actively serving* industry interests in policy *implementation*. Your cases involve *preventing policy formation*.  
     - *Boundary*: An agency weakening fines for developers is capture. A commission never discussing fines due to developer-aligned members is exclusion.  

  ### Key Clarifications:
  - **Causality vs. Standing**:  
    The harm lies in *distorted process legitimacy*, not solely outcomes. Even if the fee revision *would* have failed fairly, excluding debate corrupts democratic accountability. Money grants *standing to suppress*, not just persuade.  
  - **Corruption Status**:  
    This is **procedural corruption**—a subversion of institutional fairness distinct from criminal bribery. It violates norms of equal access and thorough deliberation.  
  - **Reality vs. Perception**:  
    A perfect observer would see:  
    - Network advantages (donor access) enabling procedural exploitation  
    - Avoided scrutiny (e.g., unasked questions) as the harm  
    - No illegal exchange, but democratic erosion via suppressed conflict.  

  ### Boundary Cases:
  1. **Near Inclusion**:  
     A donor’s proposal is fast-tracked without debate. *Not exclusion*—it reached decision (just uncontested). Fits "interest group advantage."  
  2. **Near Exclusion**:  
     A member "forgets" to file paperwork, delaying a rival’s proposal. *Is exclusion*—procedural manipulation preventing consideration.  

  ### Conclusion
  No established term perfectly captures this, but **agenda exclusion** comes closest in bureaucratic politics literature. Your cases reveal its essence: influence exercised not over *how decisions are made* but *whether they exist at all*. It is corruption of process, not outcome.  

  \answer{agenda exclusion}
