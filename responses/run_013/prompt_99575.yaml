  Two mounds of dry gold in even light,
  Two shapes that beckon, pale and round.
  At equal distance, burning bright,
  Each softens to the selfsame ground.
  No scent drifts sweeter east than west,
  No blade of grass leans left or right.
  So still the air holds time's arrest.

