prompt: |-
  hey — I'm in a third-year metaphysics seminar that's basically all about virtual worlds, and I've somehow ended up running the last three weeks and picking the topics. So I need to work out which open questions in this area actually deserve the time, not just which ones get the most ink.

  Here's whats bugging me. Half the seminar wants to fight about whether virtual objects are real, and every time it just turns into people saying it depends what you mean by real. Meanwhile the stuff that seems to actually bite is: are virtual harms real harms, or are they only bad because of downstream effects in the physical world (getting groped in VR, losing a character youve played for years, that kind of thing), and does that distinction even survive scrutiny? And underneath that there's the ontology question — when you hand someone a virtual sword, is it instantiating sharpness or just representing it, and does that difference do any actual work? Someone also threw out that maybe virtual isnt even a natural kind, its just a grab bag of unrelated things, which I cant tell if thats deep or a dodge.

  What I want from you: rank the open questions in this area by how much other questions depend on them. Which ones are upstream — settle them and a bunch of other disputes either fall out or get easier — and which are dead ends that sound deep but dont change anything downstream? For each one, say why its upstream, how tractable it is for a room of philosophy students with no programming background, and what kind of argument over the next few weeks would move it up or down the list. Flag anything I'm not thinking of that should be on there, and tell me which two or three youd actually pick if you only had three weeks and wanted us to walk out with something better than it depends what you mean by real. Please dont give me a reading list, I'm not gonna get through it anyway.
reasoning: |-
  Okay, let me unpack this. User is running a metaphysics seminar on virtual worlds and wants to cut through circular debates about "are virtual things real." They've identified two more concrete questions that seem more productive: the reality of virtual harms and the ontology of virtual properties (like whether a virtual sword is actually sharp). There's also this meta-question about whether "virtual" is even a coherent category. 

  Hmm, the core request is fascinating—rank philosophical questions by their "upstreamness." Like dependency mapping for metaphysical debates. User is clearly frustrated with semantic traps ("it depends what real means") and wants leverage points. They're time-pressed (only 3 weeks left) and need actionable focus, not reading lists. 

  First, I should validate their instinct: yes, the "are virtual objects real" debate is often a dead end because it bogs down in realism vs. anti-realism trenches without clarifying terms. The harm question is sharper because it forces engagement with ethics and phenomenology—if virtual assault feels like assault, does metaphysics get to dismiss that? 

  The ontology of properties (sharpness in VR) feels even more upstream. If we can establish whether virtual properties are instantiated or merely represented, it could resolve both the harm debate (is the harm instantiated?) and the realism debate (if properties are instantiated, objects might be "real" in some sense). 

  The "natural kind" question is interesting but risky—if "virtual" isn't a coherent category, the whole seminar might collapse into taxonomy. Probably better as a capstone. 

  User hasn't mentioned but should consider: emergent social ontology. Like, when 1000 players treat a VR sword as "real," does that collective intentionality change its status? That could bridge the sharpness and harm debates. 

  For a 3-week sprint: I'd start with property ontology (week 1: is sharpness real?), then virtual harms (week 2: applying those ontology tools), then "natural kind" as a meta-check (week 3: was this whole framing flawed?). 

  Tractability matters—no coding background, so avoid tech examples. Use plain-language thought experiments: "If you 'drop' a virtual anvil on someone's virtual foot, and they scream, was the heaviness real?" 

  Biggest trap to avoid: letting week 1 turn into semantic quicksand. Must enforce operational definitions upfront ("for today, 'real' means X"). User should chair ruthlessly.
answer: |-
  Here’s a ranked list of open questions in virtual metaphysics, ordered by their "upstreamness" (how many downstream debates depend on them), with tactical notes for your seminar:

  **Top Tier (Upstream Foundations):**  
  1. **Ontology of Virtual Properties**  
     *Question:* When a virtual object has a property (e.g., "sharpness"), is it *instantiated* or *represented*?  
     - **Why upstream:** Resolving this cuts through realism debates ("are virtual objects real?") and directly informs virtual harms (is harm *instantiated* or *simulated*?). If properties are instantiated (e.g., "sharpness" = real causal power in VR), harms become ontologically serious. If merely represented, harms reduce to psychological/physical effects.  
     - **Tractability:** High. Uses familiar tools: causation, supervenience, property dualism. No coding needed.  
     - **Move the needle:** Debate whether *functional role* (e.g., "sharpness" causes avatar damage) implies instantiation. Test intuitions: *If a VR sword "cuts" code but not atoms, is it sharp?*  

  2. **Virtual Harms: Ontology or Ethics?**  
     *Question:* Are virtual harms *sui generis* wrongs (e.g., intrinsic violation in VR) or derivative of physical/psychological consequences?  
     - **Why upstream:** Determines whether ethics in virtual worlds needs new frameworks. If harms are intrinsic, realism about virtual objects strengthens; if derivative, metaphysics becomes irrelevant to ethics.  
     - **Tractability:** Medium-High. Leverage thought experiments (e.g., "Is non-consensual VR groping wrong if no trauma occurs?"). Connects to philosophy of mind (embodiment, presence).  
     - **Move the needle:** Isolate the *wrong-making feature*: intent? Experience? Social context? Argue whether physical consequences are necessary for "real harm."  

  **Middle Tier (Consequential but Derivative):**  
  3. **"Virtual" as a Natural Kind**  
     *Question:* Is "virtuality" a coherent category (e.g., VR, video games, dreams) or a grab-bag of unrelated phenomena?  
     - **Why upstream?** If "virtual" isn’t unified, debates about "virtual objects/harms" collapse into case-by-case analysis (e.g., VR ≠ dreams). Forces clarity on essential features.  
     - **Tractability:** Medium. Requires comparing cases (e.g., *Minecraft* vs. *Second Life* vs. hallucination). Avoid if group gets lost in taxonomy.  
     - **Move the needle:** Hunt for *necessary conditions* for "virtuality": interactivity? Representational fidelity? Deliberate creation?  

  **Lower Tier (Downstream/Dead Ends):**  
  4. **"Are Virtual Objects Real?"**  
     - **Why downstream/dead end:** Collapses into semantics ("real" = mind-independent? functionally efficacious? socially constructed?). *Depends entirely on resolving #1 and #3.* Wastes time without shared definitions.  
     - **Action:** Ban the word "real" unless explicitly defined (e.g., "real as in causally potent" or "real as in socially acknowledged").  

  **What You’re Missing (Critical Add):**  
  - **Agency & Personhood:** Are *avatars* extensions of persons? New agents? Impacts autonomy, responsibility, and harm.  
  - **Emergent Social Ontology:** Do collective practices (e.g., 1M players treating a VR sword as "real") create new facts?  

  ---

  **Your 3-Week Game Plan:**  
  1. **Week 1: Property Instantiation vs. Representation**  
     - Focus: *Does a virtual fire instantiate "heat" or represent it?*  
     - Why: Resolves sword sharpness, grounds harm debates.  
     - Tactic: Role-play as dualists vs. functionalists. Key move: *If the property has causal power in its world, is that enough?*  

  2. **Week 2: Virtual Harms as Intrinsic or Derivative**  
     - Focus: *Is it wrong to destroy someone’s lifelong VR avatar if they don’t care?*  
     - Why: Applies Week 1’s ontology. Forces ethics-metaphysics bridge.  
     - Tactic: Compare to non-virtual analogs (e.g., destroying a diary vs. assault).  

  3. **Week 3: "Virtual" as a Category (or Not)**  
     - Focus: *Is a dream as "virtual" as VR? What about a PDF contract?*  
     - Why: Tests coherence of the field. If "virtual" isn’t unified, future debates must be context-specific.  
     - Tactic: Map edge cases. Does the group converge on core features?  

  **Why This Works:**  
  - Avoids "real" rabbit holes by targeting concrete mechanisms (property instantiation).  
  - Harms debate becomes substantive, not semantic.  
  - By Week 3, you’ll know if "virtual metaphysics" is a valid project.  
  - **Exit with:** A framework for *why* some virtual things matter (or don’t) based on their causal/social roles, not blanket realism.  

  **Nuke Semantic Traps:** Start each session by defining *one* key term operationally (e.g., "Today, ‘instantiated’ means X"). Shut down "it depends on real" with: *"Define ‘real’ in your next sentence or move on."*
