prompt: |-
  I teach a 300-level metaphysics of mind seminar with eighteen students, and the session on mental causation runs seventy-five minutes. The room has movable chairs and a whiteboard, and the students have read a short introduction to causal closure, supervenience, and the no systematic overdetermination premise, so they can use the vocabulary but the causal exclusion argument still lands for them as a syllogism they can follow rather than a problem they feel. I want a runnable activity that puts them inside the squeeze: a role-play or structured deliberation, with no lecture up front and no naming of the argument until the debrief, in which they must assign causal credit for a single human action—use the case of a juror who changes her vote from guilty to not guilty after an hour of deliberation—among at least four candidate causes: the neural realizer of the change, the mental state of doubt, the reason that the evidence was weak, and the social pressure of the other jurors. The rules should make the exclusion result emerge from the mechanics rather than from a speech: for instance, each candidate cause receives a share of a fixed causal budget, but any candidate that is sufficient on its own must receive the whole budget, and no two candidates may both be treated as sufficient for the same effect. I want the group to discover, in the middle of the exercise, that the mental state either collapses into the neural realizer or is left with nothing to do, and then to discover how much that result depends on the scoring rule. I do not want the exercise to stack the deck for non-reductive physicalism; I want them to feel why epiphenomenalism becomes tempting and why that temptation is supposed to be a cost. Include the roles, the materials, a minute-by-minute timeline, the exact budget or scoring system, and a debrief that maps what happened onto the premises of the exclusion argument, the difference between excluding mental events and excluding mental properties, the distinction between overdetermination and supervenience, and the main replies—reductionism, non-reductive physicalism, emergentism, and the charge that the argument proves too much.

  I am also interested in a wrinkle that I think gets flattened when the argument is taught as a syllogism. The exclusion pressure often depends on a total, non-contrastive picture of causation, on which a sufficient physical cause leaves no causal work for a distinct mental cause. If the group instead treats causes as difference-makers relative to contrast classes—neural state N rather than N*, mental state M rather than M*—then the mental cause can re-enter without overdetermination. I want the activity to make them feel the force of the total-cause picture and the escape hatch offered by the contrastive picture, and I want the debrief to be explicit that the game's scoring rule has already chosen a side. Tell me what will predictably go wrong the first time I run it—which groups will game the budget, where the analogy to actual causation will break, how to handle the student who insists that the mental cause is just another description of the physical cause—and be frank about which feature of the exclusion argument the activity cannot reproduce, such as the modal strength of the closure premise or the difference between causation and causal explanation, and what I will have to supply in the debrief.
reasoning: |-
  We are designing an activity for a 75-minute session. The goal is to have students assign causal credit for a juror's change of vote, among four candidate causes, and to experience the causal exclusion problem. We'll use a causal budget system that forces the exclusion result. Then we'll change the rules to a contrastive system to show an escape. The activity should have no lecture up front and the exclusion argument should only be named in the debrief.

  The four candidate causes:
  1. Neural realizer (N): the specific brain state that occurred at the time of the vote change.
  2. Mental state of doubt (M): the feeling of uncertainty about the guilt of the defendant.
  3. Reason (R): the consideration that the evidence was weak.
  4. Social pressure (S): the influence from other jurors who were voting not guilty.

  Activity Structure:

  Phase 1: Total Cause Picture (Non-contrastive)
  - We set up a fixed causal budget (say 100%) that must be distributed among the four candidate causes.
  - Rules for Phase 1:
    a. Each candidate cause gets a share of the budget (from 0% to 100%).
    b. The total must add up to 100%.
    c. If a cause is deemed sufficient on its own for the effect (i.e., if it were present, the effect would occur without the others), then it must be assigned 100% and the others 0%.
    d. No two causes can both be assigned 100% (because that would be overdetermination, which is ruled out by the "no systematic overdetermination" premise).

  But note: we have to be careful because the neural realizer (N) is physical and the causal closure premise (which we haven't stated explicitly) implies that if there's a sufficient physical cause (which N is, by closure) then no other cause (like M, R, or S) can be a cause without overdetermination. However, we are not stating closure explicitly. Instead, we'll let the rules force the issue.

  We can frame the closure premise implicitly by telling the students that the neural realizer is known to be a sufficient cause (by the laws of neuroscience). So rule c above will force that if N is sufficient, then it must get 100%. But what if the students don't assign sufficiency to N? We need to ensure they do. So we might have to set up the scenario so that N is taken as sufficient.

  Alternatively, we can have a "Science Expert" role who can declare that N is sufficient (based on causal closure). But we don't want to lecture. So perhaps we can have a card that states:

    "Neuroscience Fact: The neural state N is a sufficient cause for the vote change. That is, if this neural state occurs, then the vote change occurs, regardless of other factors (unless there is interference, but there wasn't)."

  Similarly, we might have a card for the mental state M: "Mental State Fact: The mental state of doubt M is a sufficient cause? Well, we don't have a law of psychology that says that, but in this case, it seems that if the mental state of doubt occurs, then the vote change occurs." However, we want to avoid stacking the deck. We want the students to see that if they take N as sufficient (by the closure premise) and also take M as sufficient (by the mental causation premise) then they have overdetermination, which is forbidden by rule d.

  But note: the exclusion argument doesn't require that M is sufficient, only that it is a cause. However, the problem arises because N is sufficient and if M is also a cause (and distinct) then we have overdetermination. But in the activity, we want to force the issue by having the sufficiency rule.

  Alternative: Instead of sufficiency, we can require that if a cause is necessary and sufficient, it gets 100%. But that might be too strong. Let me think.

  I think the key is to have the rule that any sufficient cause must get 100% (and then the others 0%) and that no two can be sufficient without overdetermination. But we also want to capture that the mental state M might be seen as necessary? Not necessarily. The exclusion argument is about sufficient causes.

  But note: the causal closure premise says that every physical event (like the vote change) has a sufficient physical cause (at the time of the event). So we are going to assume that N is sufficient.

  So we set up the rules so that:

    - The neural realizer N is declared to be a sufficient cause (by the rules of the game, which reflect the causal closure premise). Therefore, by rule c, N must be assigned 100% and the others 0%.

  But then the mental state M gets 0%. That's the exclusion.

  However, the students might object: what if they think that M is also a cause? Then they have to assign 100% to M as well, but rule d forbids two 100% assignments. So they must either deny that M is sufficient (and then assign it 0%) or deny that N is sufficient (which they can't because of the closure premise) or allow overdetermination (which the rules forbid).

  But the problem is that in the scenario, M might not be sufficient on its own. For example, the mental state of doubt might be necessary but not sufficient (if other factors are required). However, in the exclusion argument, the problem is that the physical cause is sufficient and the mental cause is distinct and also a cause, leading to overdetermination.

  To simplify, we can set up the rules to force the following:

    - Rule 1: The neural realizer N is sufficient for the effect (by the causal closure premise, which we build into the game as a rule).
    - Rule 2: The mental state M is also a cause and might be considered sufficient? But we don't have to require that. Instead, we can let the students assign M a positive share. But then if N is sufficient and gets 100%, then the others must get 0%. So M would get 0%.

  But if the students assign M a positive share (say 20%) and N 80%, that violates rule c because N is sufficient so it must get 100%. So the rules force that N gets 100% and M gets 0%.

  But then the students might say: but M is the same as N? Then we get into the reductionist move.

  So the activity:

  Divide the class into groups of 4-5 students. Each group has to assign the causal budget for the four causes (N, M, R, S). They are given the rules and the fact that N is sufficient. Then they must assign percentages (with the constraints) and be prepared to justify.

  After they do that, they will likely assign 100% to N and 0% to the others. Then we ask: but what about the mental state? It seems to have done nothing? That's the problem of epiphenomenalism.

  Then we introduce Phase 2: Contrastive Cause Picture.

  In Phase 2, we change the rules. Now we define the effect not as "the vote change" but as "the vote change rather than no change" (or we can define it relative to a contrast). And we define each cause in contrastive terms:

    - Neural: N rather than N* (some other neural state)
    - Mental: M rather than M* (e.g., confidence)
    - Reason: R rather than R* (e.g., the evidence was strong)
    - Social: S rather than S* (e.g., no social pressure)

  Then we ask: what made the difference? Now we can assign causal credit differently. For example, if the neural state N is the same as the one that would have occurred if M had been present (because M supervenes on N) then the neural contrast N vs N* might be tied to the mental contrast M vs M*. But also, we might say that the reason R (the weak evidence) made a difference relative to a situation where the evidence was strong.

  Rules for Phase 2:

    - We have a fixed budget (100%) again.
    - But now, we are to assign the budget to the candidate causes in their contrastive form.
    - We don't have the sufficiency rule. Instead, we have a rule that the cause must be a difference-maker: that is, if the cause had been different (e.g., M* instead of M) then the effect would have been different (e.g., no vote change) in the circumstances.

  Now, multiple causes can be difference-makers without overdetermination because they are difference-makers relative to different contrasts. So we can assign shares to more than one.

  But note: we have to be cautious because the neural state might still be a difference-maker and the mental state might be too, but if they are linked by supervenience, then changing M would require changing N. So they might be the same difference-maker under two descriptions.

  We want the students to see that in the contrastive framework, the mental cause can be a difference-maker even if the neural cause is also a difference-maker, because they are not independent.

  But we also want to show that the contrastive approach avoids the exclusion problem.

  Timeline:

  Total: 75 minutes.

  - Introduction (5 min): Set the scene of the juror case. Explain the four candidate causes. Explain that we are going to assign causal credit in two different ways. Do not mention the exclusion argument.

  - Phase 1: Total Cause (25 min)
    - Explain the rules for Phase 1 (with the sufficiency constraint and no overdetermination). Emphasize that the neural state N is known to be sufficient (by neuroscience). 
    - Divide into groups (4 groups of 4-5 students). Give them 10 minutes to assign the budget (percentages) to the four causes, with the rules.
    - Then, have each group report (5 min). They will almost certainly assign 100% to N and 0% to the others. If not, challenge them on the rules.

  - Phase 2: Contrastive Cause (25 min)
    - Introduce the contrastive framework. Explain that we are now thinking in terms of what made the difference relative to a baseline. Define the contrast for each cause (provide the contrasts: e.g., for M: doubt rather than confidence; for N: the actual neural state rather than the neural state that would have occurred if she had remained confident; etc.).
    - Change the rules: no sufficiency requirement. Instead, each cause is considered as a difference-maker. They have to assign the budget again, but now they must consider whether each candidate, in its contrastive form, made a difference. They can assign positive shares to multiple causes. The only constraint is that the total must be 100%.
    - Groups work for 10 minutes, then report for 5 min. Expect a variety of assignments.

  - Debrief (20 min)
    - Connect to the exclusion argument: name it and show how the rules of Phase 1 mirror the premises (closure, exclusion, no overdetermination). Point out that in Phase 1, the mental cause was excluded (got 0%).
    - Discuss the epiphenomenalism worry: if the mental cause gets 0%, then it's causally inert. That's a cost.
    - Then, map the Phase 2 activity to the contrastive reply: by changing the conception of causation, we avoid the exclusion.
    - Discuss the premises again and how the contrastive approach challenges the non-contrastive picture of causation that underlies the exclusion argument.
    - Finally, mention the main replies: 
        - Reductionism: M and N are the same, so no overdetermination (but then we lose the autonomy of the mental?).
        - Non-reductive physicalism: M supervenes on N, and in the contrastive framework, M can be a difference-maker even if N is too.
        - Emergentism: M is a novel cause that is not determined by N? But then we might have overdetermination.
        - The charge that the argument proves too much: if we apply the same reasoning to other special sciences (like chemistry or biology), then we'd have to say that chemical properties are epiphenomenal too, which is absurd.

  Also, address the wrinkle: the activity's scoring rule in Phase 1 already assumed a non-contrastive, total cause picture. The contrastive picture in Phase 2 offers an escape.

  What will go wrong:

  1. Students might resist assigning 100% to N in Phase 1. They might say: "But the mental state is important too!" Then you have to enforce the rule: if N is sufficient and you want to assign M a positive share, then you are saying M is also a cause. But then if M is sufficient (which they might not think it is) then you have to assign it 100% too, which would be overdetermination. But if they don't think M is sufficient, then they might assign it 0% because N is sufficient and gets 100%. You have to be firm on the rules.

  2. The analogy might break because the students might argue that the mental state is not distinct from the neural state. That's a good point! That's the reductionist move. In the debrief, you can say that this is one reply: identify M and N. But then we lose the mental as something over and above the physical.

  3. In Phase 2, they might assign the same causal credit to both M and N because they are linked. But that's okay because we want to show that the contrastive approach allows it.

  4. The student who says that the mental cause is just another description of the physical cause: that's the reductionist. You can note that in the debrief as one solution.

  What the activity cannot reproduce:

  - The modal strength of the closure premise: the closure premise is not just that in this case the neural cause was sufficient, but that in every possible case, if a physical event has a cause, it has a sufficient physical cause. The activity only has one case.

  - The difference between causation and causal explanation: the activity blurs this because we are talking about assigning "causal credit", which might be explanatory. In the debrief, note that the exclusion argument is about causation, not explanation.

  Materials:

  - Handout with the juror case and the four candidate causes.
  - Rules for Phase 1 and Phase 2 (on a slide or handout).
  - Whiteboard to record group assignments.

  Detailed Timeline:

  Minute 0-5: Introduction
    - Describe the case: a juror, after an hour of deliberation, changes her vote from guilty to not guilty. We are going to assign causal credit to four factors: 
        1. Neural realizer (N): the specific brain state at the time of the change.
        2. Mental state (M): her feeling of doubt about the guilt.
        3. Reason (R): the consideration that the evidence was weak.
        4. Social pressure (S): the influence from other jurors voting not guilty.

  Minute 5-10: Explain Phase 1 Rules
    - We have a fixed causal budget of 100% to assign to these four causes for the effect (the vote change).
    - Rules:
        a. The neural realizer N is known to be a sufficient cause for the vote change (by the laws of neuroscience). This means that if this neural state occurs, the vote change occurs, and it doesn't depend on the other factors (in this scenario).
        b. If a cause is sufficient, it must be assigned 100% and the others 0%.
        c. You cannot assign 100% to two causes because that would be overdetermination (which we are ruling out as systematic overdetermination is not allowed).
    - Note: They must assign percentages that add to 100%.

  Minute 10-20: Group Work Phase 1
    - Groups of 4-5 students discuss and assign the budget.

  Minute 20-25: Report Phase 1
    - Each group reports: what did they assign? Why? (Expect 100% to N and 0% to others.) If a group doesn't, ask them: did they consider rule b? How do they avoid overdetermination?

  Minute 25-30: Introduce Phase 2 (Contrastive)
    - Now we change the rules. We are going to think about what made the difference relative to a contrast.
    - Define the effect as: the vote change (from guilty to not guilty) rather than no change.
    - Define the candidate causes in contrastive terms:
        - Neural: N (the actual neural state) rather than N* (the neural state that would have occurred if she had remained confident and not changed her vote).
        - Mental: M (doubt) rather than M* (confidence).
        - Reason: R (the evidence was weak) rather than R* (the evidence was strong).
        - Social: S (pressure from others) rather than S* (no pressure).
    - Rules for Phase 2:
        a. We are assigning causal credit for being a difference-maker: that is, if the cause had been different (e.g., M* instead of M), then the effect would have been different (no vote change) in the circumstances.
        b. Assign percentages to the four causes (still adding to 100%) based on how much of the difference each one made.
        c. Note: multiple causes can be difference-makers without overdetermination because they are making a difference relative to their own contrasts.

  Minute 30-40: Group Work Phase 2

  Minute 40-45: Report Phase 2
    - Groups report: how did they assign the budget? Why? Expect more variation. Some might assign to M and N, or to R and S, etc.

  Minute 45-65: Debrief (20 minutes, but might run longer; be flexible)

    - Name the causal exclusion argument and its premises:
        1. Causal closure: every physical event has a sufficient physical cause (that's why we said N is sufficient).
        2. Exclusion: if an event has a sufficient cause, then it doesn't have another distinct sufficient cause (unless by overdetermination).
        3. No systematic overdetermination: overdetermination is rare and not systematic, so we rule it out for the mental and physical.

    - In Phase 1, by the rules, we had to assign 100% to N and 0% to M. That means M is excluded: epiphenomenalism.

    - Why is that a cost? Because we think the mental state of doubt really did cause the vote change.

    - Then, Phase 2: we switched to a contrastive notion of causation. Now, the mental cause M can be a difference-maker even if the neural cause N is too. How? Because the contrastive approach allows us to see that the same event (the neural state) can be described in two ways (neural and mental) and both descriptions can be difference-makers. Also, the reason R and the social pressure S can be difference-makers.

    - But note: the contrastive approach avoids the exclusion because it doesn't require that a cause be sufficient in the non-contrastive sense.

    - Now, the main replies to the exclusion argument:
        - Reductionism: M and N are the same event. Then we don't have two distinct causes. So in Phase 1, we could have assigned the 100% to both (but the rules forbade two 100% assignments) but that's because they are the same. So we don't have overdetermination. But then we lose the autonomy of the mental: is the mental just the neural?
        - Non-reductive physicalism: M supervenes on N (so M is not identical to N but depends on it). In the contrastive framework, M can be a difference-maker even if N is too. But note: if we change M, we change N. So the difference-making of M is not independent of N. But the contrastive framework allows that.
        - Emergentism: M is a novel cause that is not determined by N. Then we have two distinct sufficient causes: N and M. That would be overdetermination. We ruled that out, so emergentism requires rejecting the no overdetermination premise.
        - The charge that the argument proves too much: if we apply the exclusion argument to, say, the chemical level, then we'd have to say that chemical properties are epiphenomenal because they are excluded by the physical (microphysical) causes. But that's absurd because chemistry is causally efficacious. So the argument must be flawed.

    - Also, note that the activity's Phase 1 rules assumed a non-contrastive, total cause picture. The exclusion argument depends on that picture. The contrastive picture (Phase 2) offers a way out.

    - What the activity missed:
        - The modal strength of the closure premise: we only applied it to one case, but the argument is general.
        - The distinction between causation and causal explanation: in the activity, we were assigning causal credit, which might be explanatory. But the exclusion argument is about causation itself.

    - Finally, note that in the actual exclusion argument, the mental properties (not just events) are at risk of exclusion. The activity focused on events. In the debrief, mention that the argument can be run for properties: if the physical property is causally sufficient, then the mental property is excluded.

  This should fill the time. Let me know if you need more details.
answer: |-
  ### Structured Activity: The Causal Exclusion Squeeze  
  **Objective:** Students experience the causal exclusion problem organically through assigning "causal credit" for a juror's vote change, then discover how a contrastive approach offers an escape. The activity mirrors the exclusion argument's premises without naming them until debrief.

  ---

  ### **Setup & Materials**  
  - **Room Setup:** Movable chairs arranged into four groups (4-5 students each). Whiteboard divided into sections for Phase 1 and Phase 2.  
  - **Materials:**  
    - Handout with the case:  
      > *A juror in a murder trial changes her vote from "guilty" to "not guilty" after an hour of deliberation. Candidate causes:*  
      > **1. Neural realizer (N):** The specific brain state (e.g., firing of neurons in the prefrontal cortex) at the moment of the vote change.  
      > **2. Mental state (M):** The juror’s feeling of doubt about the defendant’s guilt.  
      > **3. Reason (R):** The juror’s consideration that the evidence was weak.  
      > **4. Social pressure (S):** Influence from other jurors voting "not guilty."  
    - Two rule sheets (one for each phase).  
    - Timer.  

  ---

  ### **Phase 1: Total Cause Picture (Non-Contrastive)**  
  **Goal:** Force exclusion via sufficiency rules. Students discover M is squeezed out by N.  
  **Time:** 25 minutes (5 min setup + 10 min group work + 10 min share-out).  

  #### **Rules (Handout & Whiteboard):**  
  > - **Causal Budget:** 100 points total, split among N, M, R, S (e.g., N=50, M=30, R=15, S=5). Points must sum to 100.  
  > - **Sufficiency Rule:** If a cause is *sufficient* for the effect (i.e., if it alone guarantees the vote change), it must receive **100 points**, and all others receive **0**.  
  > - **No Overdetermination Rule:** Only one cause may be treated as sufficient (no tie for 100 points).  
  > - **Neuroscience Constraint:** N is *declared sufficient* (reflecting causal closure).  
  > - **Task:** Assign points. Justify why each cause gets its share.  

  #### **Minute-by-Minute:**  
  - **0-5 min:** Introduce the case and rules. Emphasize: *"N is sufficient—if it occurred, the vote change happens regardless of other factors."*  
  - **5-15 min:** Group deliberation. **Predictable Issue:** Groups try to "game" the budget (e.g., assign M 50 points, N 50). Intervene: *"If N is sufficient, can it share points? Re-read the sufficiency rule."*  
  - **15-25 min:** Share-out. Groups report points. **Expected Result:** All groups assign N=100, others=0. Probe: *"Why did M get 0? Does this mean the mental state did nothing?"* Highlight emergent epiphenomenalism worry.  

  ---

  ### **Phase 2: Contrastive Cause Picture (Difference-Making)**  
  **Goal:** Escape exclusion by shifting to contrastive causation.  
  **Time:** 25 minutes (5 min setup + 10 min group work + 10 min share-out).  

  #### **Rules (Handout & Whiteboard):**  
  > - **Causal Budget:** 100 points total, split among the same four causes, but now defined *contrastively*:  
  >   - **N:** *Actual* neural state (N) vs. *baseline* state if no vote change (N*).  
  >   - **M:** *Doubt* (M) vs. *confidence* (M*).  
  >   - **R:** *Weak evidence* (R) vs. *strong evidence* (R*).  
  >   - **S:** *Social pressure* (S) vs. *no pressure* (S*).  
  > - **Difference-Making Rule:** Points reflect how much each cause *made the difference* relative to its contrast. No sufficiency requirement.  
  > - **Task:** Assign points. Justify: *"What would happen if this cause were different (e.g., M* instead of M), holding others fixed?"*  

  #### **Minute-by-Minute:**  
  - **25-30 min:** Introduce contrastive rules. Clarify: *"We’re asking what changed the outcome—e.g., if the evidence had been strong (R*), would she still have changed her vote?"*  
  - **30-40 min:** Group deliberation. **Predictable Issue:** Groups assign points to multiple causes (e.g., M=40, R=30, S=20, N=10). Some may conflate M and N; ask: *"If we changed N to N*, would M change too? What if we changed M to M*?"*  
  - **40-45 min:** Share-out. Groups report. **Expected Result:** Points spread widely (M often gets credit). Contrast with Phase 1.  

  ---

  ### **Debrief (20 minutes)**  
  **Map the activity to the exclusion argument:**  
  1. **Premises Revealed:**  
     - **Closure:** N’s sufficiency in Phase 1 reflects physical causal closure.  
     - **Exclusion:** Assigning N=100 forced M=0 (mental cause excluded).  
     - **No Overdetermination:** Rule forbade two sufficient causes.  
     - **Result:** Epiphenomenalism (M does nothing)—a "cost" students felt.  

  2. **Key Distinctions:**  
     - **Events vs. Properties:** Phase 1 excluded mental *events*; the argument often targets mental *properties* (e.g., "doubt" as a property of N).  
     - **Overdetermination vs. Supervenience:** Overdetermination (Phase 1) requires two *independent* sufficient causes. Supervenience (M depends on N) avoids this—but Phase 1 rules ignored dependence.  

  3. **Contrastive Escape:**  
     - Phase 2’s rules treated causes as *difference-makers* (e.g., M explains why vote changed *rather than stayed guilty*).  
     - This dissolves exclusion: M can be causal without competing with N (e.g., M and N are the same difference-maker under different descriptions).  

  4. **Main Replies:**  
     - **Reductionism:** M and N are identical (e.g., the student who said "M is just another description of N"). Phase 1 rules blocked this by treating them as distinct.  
     - **Non-Reductive Physicalism:** M supervenes on N. Phase 2 allows M to be a difference-maker *because* of supervenience (changing M requires changing N).  
     - **Emergentism:** M is a novel cause (e.g., a group assigns M=100 in Phase 2). But Phase 1 rules rejected this (overdetermination).  
     - **Proves Too Much:** If exclusion applies to *all* higher-level properties (e.g., biological or chemical), they’d also be epiphenomenal—an absurdity suggesting the argument is flawed.  

  5. **Activity’s Limits & Wrinkle:**  
     - **What the Activity Couldn’t Capture:**  
       - **Modal Strength of Closure:** Closure is a *necessary* truth (physical causes *always* suffice), but the activity treated it as contingent (only in this case).  
       - **Causation vs. Explanation:** Activity blurred causal *production* (Phase 1) with causal *explanation* (Phase 2). Clarify: Exclusion targets production; contrastive approaches often address explanation.  
     - **The Wrinkle:** Phase 1’s "total cause" picture (non-contrastive) drove exclusion. Phase 2’s contrastive rules chose the "difference-making" side, showing how mental causation resurfaces.  

  ---

  ### **Predictable Challenges & Solutions**  
  - **Gaming the Budget (Phase 1):**  
    - Groups may assign N=99, M=1 to "save" mental causation. **Solution:** Enforce rules strictly: *"If N is sufficient, it must get 100. If M is also sufficient, it forces overdetermination—which is banned."*  

  - **Analogy Breakdowns:**  
    - **N as "Just a Description":** A student insists M and N are identical. **Solution:** Acknowledge this as reductionism but note Phase 1 rules treat them as distinct to mirror non-reductive intuitions. Save for debrief.  
    - **Overdetermination Acceptance:** Some argue S and R could jointly cause the change. **Solution:** *"The rules ban this for N and M—but does overdetermination make sense for *every* mental event?"*  

  - **Contrastive Confusion (Phase 2):**  
    - Groups struggle with contrasts (e.g., "What is N*?"). **Solution:** Provide clear examples (e.g., *"N* is the neural state if she voted 'guilty'").  

  - **Debrief Time Crunch:** Prioritize:  
    1. Map Phase 1 to exclusion → epiphenomenalism as a cost.  
    2. Contrast Phase 2 as an escape.  
    3. Briefly note replies (emphasize non-reductive physicalism and "proves too much").  

  ---

  ### **Instructor Notes**  
  - **First-Run Risks:**  
    - Phase 1 may feel "forced"—lean into it. The discomfort mirrors the exclusion argument’s intuitive squeeze.  
    - Phase 2 may seem "too easy" for mental causation. Use this to highlight how the *rules* (not reality) dictate outcomes.  
  - **Core Insight:** The activity shows exclusion arises from the *non-contrastive causal framework*, not logic alone. The debrief makes this explicit.  
  - **Final Tip:** End by noting, "The exclusion argument isn’t a dead end—it’s a tool to test theories of mind. Your job is to find which reply costs the least."
