answer: |-
  You've zeroed in on the core philosophical tension in corporate criminal liability. The law *does* operate with conceptual schizophrenia, and reconstructing its implicit theory reveals a pragmatic, metaphysically ambiguous stance—but one that **isn't** strictly committed to corporate realism. Let's break it down:

  ### The Law's Implicit Theory: "Functional Agency" (Not Metaphysical Realism)
  1. **Agency by Attribution, Not Ontology**:  
     The law treats corporations *as if* they have minds (knowledge, intent) for the **functional purpose of assigning responsibility and liability**. This is a legal fiction grounded in practical necessity, not a declaration that corporations possess consciousness. Courts focus on **structures, policies, and aggregated actions** that produce harmful outcomes, not a ghostly "group mind."

  2. **Collective Knowledge Doctrine (The "Nobody Knew" Problem)**:  
     This is the crux. Courts aggregate fragmented knowledge across employees *because the corporate structure enabled the harm* by failing to integrate information. The presupposition isn't that the corporation is a conscious entity, but that:  
     - The corporation **designed systems** (reporting lines, silos, incentives) that prevented knowledge integration.  
     - It **benefited from the ignorance** it structurally created.  
     - Liability attaches to the **organizational failure**, not an individual's mens rea.  

     → **Implicit View**: Intent/knowledge is **procedurally defined** by the corporation's design. If the structure *could have* (or *should have*) assembled the knowledge, it's attributed to the corporation. This is compatible with **methodological individualism** if you view the corporation as a *system* created by individuals.

  3. **Punishment Mismatch**:  
     Here's the contradiction laid bare:  
     - **Liability**: Treats the corporation as a unitary agent ("the company knew/intended").  
     - **Punishment**: Fines the corporation (hitting shareholders/employees) while prosecuting individuals separately.  
     → **Implicit Justification**:  
       - Fines deter future corporate misconduct by altering incentives/resources.  
       - Individual prosecution targets moral culpability where it "really" resides (in culpable humans).  
     This reveals the law's **pragmatic dualism**: corporations are "agents" for blame assignment but "structures" for punishment. It *does* want it both ways functionally, but it's not a coherent metaphysical position.

  ### Which Views of Collective Intentionality Are Ruled Out? Which Survive?
  - **Ruled Out**:  
    - **Strict Atomistic Individualism**: The view that *only* individual brains can hold knowledge/intent. The collective knowledge doctrine explicitly rejects this—it holds that systems can "know" through aggregation.  
    - **Radical Holism**: The idea that corporations have minds *independent* of human members (e.g., a Durkheimian "collective consciousness"). Punishment practices contradict this (we don't jail the "group soul").

  - **Compatible Views**:  
    - **Institutional Agency (List & Pettit)**: Corporations are "group agents" with beliefs/intentions *emergent* from their organizational structure and decision rules. The law's stance mirrors this.  
    - **Bratmanian Shared Intentionality**: If "corporate intent" is reduced to **interlocking individual intentions + mutual responsiveness + commitment to joint action**. The knowledge doctrine strains this but doesn't break it.  
    - **Searle's Status Functions**: Corporate intent as a socially constructed status ("We accept that this fine = punishment for the corporation").  
    - **Deflationary Legal Fiction**: "Corporate intent" is *only* a heuristic for courts—no metaphysical commitment. This is likely the *dominant judicial view*, though rarely stated.

  ### Underdetermination: Where the Law Doesn't Pick a Side
  The practice **is** metaphysically underdetermined. It functions with:  
  - **Aggregated knowledge** (compatible with individualism + systems theory OR emergent group agency).  
  - **Fictional intent** (compatible with legal instrumentalism OR realism).  
  - **Punishing individuals** (compatible with moral individualism OR seeing corporations as tools of individuals).  

  **Contested Ground**:  
  1. **The Knowledge Aggregation Doctrine**:  
     - **Individualists (e.g., Philip Pettit in early work)**: Argue aggregation is illegitimate—only individuals *know*.  
     - **Realists (e.g., Christian List)**: Argue corporations *do* have beliefs distinct from individuals via decision procedures.  
     *→ Legally settled, philosophically contested.*  

  2. **Moral Responsibility of Corporations**:  
     - **Can corporations *deserve* blame?** Realists (Peter French) say yes; individualists (Manuel Velasquez) say only humans can bear moral responsibility.  
     - **Law's Answer**: It assigns *legal* responsibility (liability), dodging the moral question.  

  3. **Punishment Justification**:  
     - Is fining a corporation (harming innocent shareholders) just? Utilitarians (deterrence) say yes; retributivists struggle.  

  ### Switching to Strict Individualism: What Would Change?
  A purely individualist model ("only people intend") would force:  
  1. **Eliminate Collective Knowledge Doctrine**: Only prosecute if one individual possessed full knowledge/intent. This ignores systemic harm and lets corporations off the hook for designed ignorance.  
  2. **Shift to "Directing Mind" Doctrine**: Only top executives' intent counts. This is easily gamed (plausible deniability, delegation).  
  3. **Abandon Corporate Liability Altogether**: Only prosecute individuals. But:  
     - Evidence barriers (who specifically intended?)  
     - Corporations outlive individuals  
     - Harm is often organizational (e.g., toxic culture)  
  4. **Strict Liability for Corporations**: Hold corporations liable *without* intent for regulatory offenses (e.g., pollution). But this weakens culpability requirements.  

  **Result**: Many harmful corporate acts would go unpunished. The current system, while messy, addresses *organizational* harm better than strict individualism.

  ### The Consensus vs. Contested Terrain (No Spin)
  - **Settled in Law**:  
    - Corporations *can* be liable criminally.  
    - Aggregate knowledge *is* valid doctrine.  
    - Fines + individual prosecution *are* the tools.  

  - **Philosophically Contested**:  
    - **Is corporate intent "real"?** Realists (List, French) vs. Fictionalists (Dennett, legal positivists) vs. Individualists (most economists).  
    - **Is punishment just?** Deterrence is accepted; *moral desert* is hotly debated.  
    - **Can groups "know"?** Epistemologists are split (Margaret Gilbert vs. Jennifer Lackey).  

  **Bottom Line**: The law presupposes **functional group agency**—a practical tool, not a metaphysical truth. It's compatible with *deflationary* views (shorthand for individual actions + structures) *and* emergent group agency theories. Its inconsistency (agent for liability, structure for punishment) is a feature, not a bug: it targets harm at both organizational and human levels. But it *does* rule out strict atomism—the law believes systems matter.
