  ### Certification Procedure for Bongard-Style Problems

  Below is a step-by-step certification procedure to validate candidate problems. The procedure ensures that each problem has a unique minimal rule within the fixed vocabulary (counting, symmetry, convexity, containment, connectivity, reflection), avoids underdetermination, and prevents redundancy. The process takes ~20 minutes per problem and flags subjective decisions for instructor review. 

  ---

  #### **Step-by-Step Certification Procedure**
  1. **Verify Intended Rule Fits Examples**  
     - **Question:** Does the intended rule correctly classify all 6 positive and 6 negative examples?  
     - **Test:** Apply the rule to all 12 images.  
     - **Sufficiency:** Must classify all correctly.  
     - **Failure:** Reject if any misclassification.  
     - **Time:** 1–2 minutes.

  2. **Compute Description Length of Intended Rule**  
     - **Question:** What is the description length (DL) of the rule?  
     - **DL Calculation:**  
       - Primitive (e.g., `convexity`) = **1 unit**.  
       - Negation (e.g., `~convexity`) = **2 units** (1 for primitive + 1 for `~`).  
       - Binary operator (e.g., `A ∧ B`) = **cost(left) + cost(right) + 1**.  
       - Example: `(convexity ∧ ~symmetry)` = cost(`convexity`) + cost(`~symmetry`) + 1 = 1 + 2 + 1 = **4**.  
     - **Output:** Integer DL value.  
     - **Time:** 1 minute.

  3. **Underdetermination Check**  
     - **Question:** Is there a rule with **DL ≤ intended DL** that fits all examples?  
     - **Test:**  
       - Generate all candidate rules with DL ≤ `min(4, intended_DL - 1)`.  
         - **DL = 1:** 6 primitives (e.g., `convexity`).  
         - **DL = 2:** 6 negated primitives (e.g., `~convexity`).  
         - **DL = 3:** All pairs of literals with `∧`/`∨` (e.g., `convexity ∧ symmetry`).  
           - 12 literals (6 primitives + 6 negated) → 132 combinations (12 choose 2 × 2 operators).  
         - **DL = 4:** Negations of DL=3 rules (e.g., `~(convexity ∧ symmetry)` → 132 combinations).  
       - Evaluate each candidate on the 12 examples.  
     - **Sufficiency:**  
       - If **no candidate fits**, proceed.  
       - If **any candidate fits with DL < intended_DL**, reject (underdetermined).  
       - If **intended_DL > 4**, skip DL=5+ checks and flag for instructor review.  
     - **Time:** 10–15 minutes (covers DL=1–4 exhaustively).

  4. **Redundancy Check**  
     - **Question:** Is the rule equivalent to an existing rule in the problem set?  
     - **Test:**  
       - For each accepted rule, test equivalence over **all 64 possible feature combinations** (since 6 primitives → 2⁶ = 64).  
       - Rules are equivalent if they agree on all 64 outputs.  
     - **Sufficiency:** Reject if equivalent to any existing rule.  
     - **Time:** 2–3 minutes (fast for 64 inputs).

  5. **Instructor Handoff**  
     - **Handoff Conditions:**  
       - Underdetermination check skipped (intended_DL > 4).  
       - Subjective concerns (e.g., ambiguous images, "unnatural" rules).  
     - **Output:** Accept, reject, or "review needed."  

  ---

  #### **Run on Candidate Problems**
  Assume fixed vocabulary: `{Cv: convexity, Sy: symmetry, Co: counting, Ct: containment, Cn: connectivity, Rf: reflection}`.

  1. **Candidate 1: Intended Rule = `Cv` (convexity)**  
     - **Step 1:** `Cv` correctly classifies all 12 examples → Pass.  
     - **Step 2:** DL = **1**.  
     - **Step 3:** Check rules with DL < 1 → none exist → Pass.  
     - **Step 4:** Not equivalent to any existing rule → Pass.  
     - **Result:** **Accept.**  

  2. **Candidate 2: Intended Rule = `Cv ∧ Sy` (DL=3), but `Co` (DL=1) fits**  
     - **Step 1:** `Cv ∧ Sy` fits examples → Pass.  
     - **Step 2:** DL = **3**.  
     - **Step 3:**  
       - Generate DL=1 rules: `Co` fits all examples.  
       - **Underdetermined** (DL=1 < 3) → Reject.  
     - **Result:** **Reject.**  

  3. **Candidate 3: Intended Rule = `Ct ∧ Cn` (DL=3), but equivalent to existing rule `~(Ct → ~Cn)`**  
     - **Step 1:** `Ct ∧ Cn` fits examples → Pass.  
     - **Step 2:** DL = **3**.  
     - **Step 3:** No cheaper rule fits → Pass.  
     - **Step 4:** Test equivalence:  
       - `Ct ∧ Cn` and `~(Ct → ~Cn)` evaluate identically on all 64 feature combinations → **Redundant**.  
     - **Result:** **Reject.**  

  ---

  #### **What the Procedure Cannot Do**
  - **Guarantee "Natural" Solutions:**  
    - Certifies uniqueness **within the vocabulary**, not "naturalness." A low-DL rule may feel unnatural (e.g., `~counting` instead of a geometric property).  
    - Example: If `convexity` and `~symmetry ∧ connectivity` both fit with DL=3, both are minimal. The procedure accepts this, but the instructor must decide if it’s "too ambiguous."  
  - **Handle Rules Outside Vocabulary:**  
    - Rules like "has parallel lines" are invisible if not in the primitives.  
  - **Scale to High-DL Rules:**  
    - DL > 4 checks are infeasible in 20 minutes → deferred to instructor.  

  ---

  #### **Settled vs. Contested in Concept Induction**
  | **Settled**                                                                 | **Contested**                                                                 |
  |-----------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | Description length (DL) is a valid simplicity metric (Occam’s razor).       | What counts as "natural"? DL proxies it, but cognitive biases play a role.    |
  | Underdetermination is unavoidable with few examples.                        | How many examples are sufficient? (We use 6/side empirically.)                |
  | Boolean combinations of primitives can express complex concepts.            | Choice of primitives: Fixed vocabularies may miss human-like abstractions.    |
  | Minimal DL rules generalize better *if the vocab is well-chosen*.           | Is DL the right measure? Alternatives (e.g., Bayesian priors) exist.         |

  **Key Insight:** Uniqueness within a vocabulary is computable, but "naturalness" hinges on human cognition, which is context-dependent and not fully formalized. The procedure offloads these judgments to the instructor.
