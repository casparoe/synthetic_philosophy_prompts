  First, I need to recall Nietzsche's modes from "On the Uses and Disadvantages of History for Life." Monumental history draws inspiration from past greatness, antiquarian preserves tradition, and critical breaks from oppressive pasts. The trustee's "prospective history" suggests using the past to define future goals. Is that different from monumental? Monumental is about emulating past heroes, while prospective seems more about institutional identity and destiny. Maybe it's a subset or an evolution? But Nietzsche does mention that monumental history can be misused to justify present actions, which ties into prospective. Still, prospective might emphasize future obligation more, so it could be a distinct angle worth investigating.

  The user wants conceptual work, so questions should be theoretical, not empirical. Researchers will work with texts and arguments, not fieldwork. So, the questions need to be tractable through philosophical analysis, historical examples in texts, and argumentation. Upstream questions are foundational—like how modes interact or their internal contradictions—which must be addressed before downstream ones like applications.

  The trustee's push for prospective history needs evaluation. If it's genuinely new, it could add value, but if it's just relabeling monumental, it might not warrant a separate focus. The user probably wants to address this to satisfy the trustee while ensuring the program's integrity. So, prioritizing whether prospective is distinct should be early on. If it survives scrutiny, it could be a fourth mode; otherwise, it's folded into monumental.

  Key open questions: How do the modes interact? When do they break down? For example, monumental can become myth-making, antiquarian can be exclusionary, critical can lead to rootlessness. Also, institutional contexts matter—how do museums vs. firms apply these differently? But since it's conceptual, focus on general mechanisms.

  Prioritization should consider dependency: Understanding individual modes and their pathologies comes before interactions. Then, interactions might reveal new breakdowns. Prospective history as a candidate should be tested early to decide its inclusion. Tractability is crucial—questions should be answerable through textual analysis. For instance, analyzing Nietzsche's texts, derivative philosophies, or historical documents about institutional uses of history.

  The user might have deeper needs: They need a coherent framework that institutions can apply, justifying the program's structure to stakeholders. They also need to manage the trustee's input without derailing the original trio. Ensuring the program produces actionable insights for institutions is likely important, even though it's conceptual.

  Structuring the three years: Year one focuses on individual modes and their breakdowns, including assessing prospective history. Year two examines interactions between modes. Year three looks at institutional contexts and normative questions. This progression builds from basics to complexity.

  Risk factors: If Year 1 shows prospective is valid, it gets integrated. If not, it's discarded early. The reasoning for moving items up/down depends on emerging arguments—like if Year 1 reveals prospective as distinct, it rises; if critiques show interactions are more critical, that moves up.

