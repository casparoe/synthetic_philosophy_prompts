prompt: |-
  I'm running the next session of a mixed reading group — psych and neuro PhD students who all use "believes" and "wants" in their own experiments — and the topic is eliminative materialism. Dont explain it to me, plan how I should explain it. What has to come first: the elimination-vs-reduction distinction, or the claim that folk psychology is a theory with posits that could turn out false? What breaks if I flip them, and where does the empirical bet (that folk psychology gets replaced rather than reduced) have to sit relative to both? Then the carrying example. I was going to reach for phlogiston, but I think caloric might be better, since the successor theory does the same work with fewer posits — and then I started worrying that all the stock cases (caloric, phlogiston, the aether) are third-person theoretical posits nobody ever used to describe themselves, which is exactly the disanalogy with belief-talk. So tell me whether the example is bearing weight it can't, and what to build it on instead. Next, the misconceptions in the order this audience will actually produce them — I'd guess "this is just behaviorism" comes early and "so you want us to stop saying people believe things" comes late — and exactly where in the sequence I head each one off. Also one question to ask at the end that seperates someone who got it from someone who just nodded; what I should say I'm deliberately skipping at this level (I'm thinking the illusionism stuff about consciousness, and anything about the semantics of belief sentences); and whether the "folk psychology is a theory" premise is even load-bearing — does the argument survive if mindreading is a skill rather than a theory? 75 minutes, whiteboard.
reasoning: |-
  Okay, let me tackle this step by step. The user is prepping a session on eliminative materialism for a neuro/psych PhD group who use intentional states in their work. Need to structure this carefully.

  First, the core sequencing problem: elimination-vs-reduction distinction vs folk psychology as falsifiable theory. If I start with elimination/reduction first without establishing folk psychology's theoretical status, the distinction won't land - they'll just see it as semantics. But if I jump straight into "beliefs are theoretical posits", it feels abstract without the payoff. So folk psychology as theory must come first, immediately followed by the elimination possibility. Then the reduction/elimination distinction crystallizes why this matters.

  The empirical bet comes after both - it's the concrete application. Must emphasize it's a contingent prediction about how neuroscience will unfold, not a philosophical necessity. 

  Now the example problem: caloric/phlogiston are bad because they lack first-person phenomenology. Need something with lived experience. Vitalism is better - "life force" was felt internally (fatigue, vitality) and was replaced by biochemistry without reduction. But even that might not fully capture belief's intimacy. Maybe combine with optical illusions? The moon looks larger but we know it's not - shows how phenomenology can decouple from theory. 

  Misconceptions: "Just behaviorism" will come first. Must preempt by contrasting with Ryle - eliminativism targets ontology, not just language. Late-stage "so stop saying 'believe'" needs the instrumentalist reply: we still say "sunrise" but don't mean geocentrism. 

  Killer question: "If neuroscientists could predict behavior exhaustively using non-intentional vocabulary, would folk psychology terms still refer?" Tests if they grasp the realist commitment. 

  Deliberate skips: Consciousness (too messy) and semantics (distracts). 

  Critical insight: Folk psychology as theory is load-bearing. If mindreading is just a skill, eliminativism collapses because there's no posit to eliminate. But if it's theory-like (predictive structure, posits with referential commitments), then falsifiability enters. Gotta stress that even skills can embed theoretical assumptions. 

  Whiteboard plan: Left column for folk psychology's theoretical features, right for science cases, bottom for objections. 

  Timing: 20 mins setup, 25 mins argument, 15 mins objections, 15 mins Q&A. 

  This group will smell weaknesses - must present eliminativism as their own methodological shadow. When they design experiments assuming "belief" is natural kind, they're betting against Churchland.
answer: |-
  Here's a battle-tested sequence optimized for your audience and constraints, leveraging their expertise while avoiding pitfalls. The structure hinges on creating tension they *feel* as researchers using intentional terms.

  **Core Sequence (Whiteboard-Driven):**

  1.  **Hook: Their Daily Practice (5 mins)**
      *   "When you design an experiment probing 'belief updating' or 'reward prediction error,' what ontological commitment are you making? Are you *assuming* beliefs/wants are real neural states, or are these just useful labels?" (Whiteboard: **"Experiment Design → Assumption: Beliefs/Wants are... ?"**)
      *   *Goal:* Surface their implicit realism. Highlight they use these terms *as if* referring to real things causally explaining behavior.

  2.  **The Foundational Premise: Folk Psychology (FP) is a *Theory* (10 mins)**
      *   **Why FIRST?** Without this, reduction vs. elimination is meaningless. FP's *theoretical* status is the bridge connecting common sense to science.
      *   **Key Points:**
          *   FP is an *explanatory/predictive framework* for behavior (not *just* introspection). We posit internal states (believes, wants) to make sense of actions.
          *   It has *posits* (Belief, Desire) and *principles* (e.g., "If agent desires X and believes action Y achieves X, then agent will likely do Y, ceteris paribus").
          *   **Crucial for Audience:** Frame this as analogous to *their own theoretical constructs* in models (e.g., "cognitive map," "attentional filter"). FP is the oldest, most embedded model.
          *   **Whiteboard:** Sketch the FP "theory": **Posits (B, D) + Principles (Practical Reasoning) → Predicts Behavior**.
      *   **What breaks if you flip?** If you start with elimination vs. reduction, it sounds like an arbitrary philosophical choice. Linking it to FP being a *falsifiable* theory shows *why* elimination is even on the table. It grounds the debate in the nature of scientific progress.

  3.  **The Empirical Bet: FP Posits Could Be Radically *False* (10 mins)**
      *   **Placement:** Immediately after establishing FP as a theory.
      *   **Key Points:**
          *   Scientific theories are fallible. Their posits are defeasible hypotheses about what exists.
          *   Historical Precedent: Theories get replaced when they are *fundamentally mistaken* about the underlying nature of phenomena, not just incomplete.
          *   **The Bet:** Neuroscience *might* discover that the brain's information-processing and action-guiding mechanisms are so fundamentally different from the structure of FP that terms like "belief" and "desire" *fail to refer* to anything real in the brain. It's not just messy reduction; it's ontological error.
          *   **Whiteboard:** Add **"Risk: FP Posits (B, D) might be *non-referential* (like 'Caloric')"** next to the FP theory box. Draw a big "?" over B/D.

  4.  **The Elimination vs. Reduction Distinction (10 mins)**
      *   **Why HERE?** Now the contrast has teeth and clear stakes.
      *   **Key Points:**
          *   **Reduction:** FP states (Belief, Desire) are *roughly* correct characterizations of real neural states. Neuroscience refines, maps, and explains them at a lower level (e.g., belief = a specific pattern of synaptic weights in a predictive coding network). FP terms *refer* successfully.
          *   **Elimination:** FP states are *fundamental misdescriptions*, like "phlogiston" or "caloric." Neuroscience reveals mechanisms so alien to FP's structure that "belief" simply doesn't pick out *any* unified natural kind in the brain. FP must be *replaced*, not reduced. The terms are *empty*.
          *   **Analogy Nuance:** Acknowledge the disanalogy! Phlogiston/caloric were 3rd-person posits. FP has 1st-person *feel*. BUT: The *explanatory role* of caloric (heat flow) is analogous to the *explanatory role* of belief (behavior causation). EM argues the *mechanism* fulfilling that role is so different the *posit itself* is wrong. Successor theories explain the heat *and* why caloric *seemed* right. EM argues neuroscience will explain behavior *and* why belief *seemed* real.
      *   **Carrying Example - Use Vitalism (Not Caloric/Phlogiston):**
          *   **Problem:** You nailed the disanalogy with 3rd-person posits.
          *   **Solution: Vitalism.** "Life force" (élan vital) was a posit *felt* internally (vitality, fatigue) and used to explain growth, healing, movement. Biochemistry *eliminated* it. There's no "life force" substance/energy reduced to ATP; the *explanatory framework* was replaced. We still *feel* "energetic," but we don't posit a "vital fluid" causing it. This mirrors the FP 1st-person/3rd-person tension better. **Whiteboard:** "Vitalism (Life Force) → ELIMINATED by Biochemistry."
      *   **Whiteboard:** Contrast **Reduction (FP State X ≈ Neural State Y)** vs. **Elimination (FP State X → ???; Replaced by Theory T)**. Point back to FP theory box and the "?" over B/D.

  5.  **Addressing Misconceptions (Proactively & Reactively) (25 mins)**
      *   **"This is just behaviorism" (Likely EARLY - during FP as theory or elimination distinction):**
          *   **Head-off:** Explicitly contrast during the elimination explanation. "Behaviorism *rejected internal states altogether as unscientific*. EM *accepts* rich internal cognitive/neuro states exist, but argues FP's *specific* posits (B, D) are the *wrong ones*, like vitalism was wrong. EM is *hyper*-internalist, not anti-internalist!"
      *   **"But beliefs/desires are obviously real, I experience them!" (Likely EARLY - during empirical bet/falsity claim):**
          *   **Head-off:** When discussing FP as a theory, emphasize that *phenomenology is data to be explained, not proof of ontology*. "Vitalists *felt* their life force. The 'feeling of believing' is real, but EM argues it's not caused by a state matching the FP *concept* of belief, just as feeling energetic isn't caused by élan vital. Neuroscience explains the *feeling* without the FP posit."
      *   **"So you want us to stop saying 'believe' and 'want'?" (Likely LATE - during Q&A or elimination consequences):**
          *   **Head-off:** During the conclusion. "EM is an ontological claim, *not* a linguistic prescription. We still say 'sunrise' pragmatically. EM predicts that in a mature neuroscience, FP terms will be as scientifically obsolete as 'caloric' or 'vital force' for *causal explanation*. We might still use them loosely in daily life ('folk talk'), but they won't appear in serious cognitive or neuro-scientific theories explaining behavior."
      *   **"This denies consciousness!" (Likely if discussion veers):**
          *   **Shut down firmly:** "Consciousness is a separate, even harder problem. EM, as defined by Churchland, is primarily about the *propositional attitudes* (belief, desire) and their role in explaining *behavior*. We're setting consciousness aside today to focus on the core argument about FP's explanatory posits." (Point to your "Skipping" list on the board).

  6.  **The Killer Question (To Gauge Understanding) (End of Main Session):**
      *   "**If future neuroscience provides a complete, predictively perfect explanation of all human behavior using only concepts fundamentally alien to FP (no 'beliefs', 'desires', 'intentions' as currently understood), would the eliminativist claim that 'beliefs do not exist' be vindicated? Why or why not?**"
      *   *Why it works:* Forces them to grapple with the core ontological commitment. A "Yes, because FP posits wouldn't refer" shows grasp. A "No, because beliefs are real in some other way" often reveals residual dualism or misunderstanding of scientific realism/elimination. A "No, because we'd just reduce them" misses the *radical replacement* scenario.

  7.  **What You're Deliberately Skipping (State upfront & reiterate) (2 mins):**
      *   **On Board:** "**SKIPPING TODAY:** Consciousness (Qualia), Semantics of Belief Sentences (Truth-Conditions, Propositional Content), Detailed Arguments *For* FP Realism (e.g., Fodor)."
      *   **Why:** Consciousness is a quagmire that derails the core FP argument. Semantics is complex and often presupposes realism. FP defenses are important but this session is about understanding the *threat* of EM. Keep focus tight.

  8.  **Is "FP is a Theory" Load-Bearing? What if it's a Skill? (Crucial for Q&A Prep):**
      *   **Absolutely Load-Bearing.** The argument *collapses* if FP isn't at least *theory-like*.
      *   **Countering the "Skill" Argument:** If FP is *just* a skill (e.g., embodied simulation), then:
          1.  Posits aren't explicit, so they can't be "false" in the same way. Elimination loses its target.
          2.  Success becomes predictive success *using that skill*, not ontological accuracy. The skill could be useful even if its implicit "ontology" is wrong (like Newtonian mechanics being useful but ontologically wrong about gravity/space/time).
          3.  **EM Response:** Churchland argues that *even if* mindreading employs simulation, the *explanatory framework we use to understand ourselves and others* (the one we articulate, teach, and build scientific psychology upon) *is* theoretical. We posit internal representational states with content. *That* framework, embedded in our language and explanations, is the target. Its predictive success is also debatable (FP's failures - e.g., mental illness, complex decision-making). If the "skill" relies on fundamentally incorrect implicit assumptions about cognitive architecture, and neuroscience reveals this, it still supports elimination *of those assumptions and posits* as accurate descriptions of reality.
      *   **Tell your audience:** "If FP is purely a non-theoretical skill, EM struggles. But EM proponents argue our *explanatory discourse* is deeply theoretical, and *that* is what neuroscience threatens. The 'skill' might persist pragmatically, but its implicit ontology would be falsified."

  **75-Minute Flow:**

  1.  Hook & Their Practice (5 min)
  2.  FP is a Theory (10 min)
  3.  FP Posits Could Be False (Empirical Bet) (10 min)
  4.  Elimination vs. Reduction Distinction (w/ Vitalism Example) (10 min)
  5.  **Synthesis & Whiteboard Review** (5 min - Tie steps 2-4 together clearly)
  6.  Addressing Misconceptions (Weave proactively into 2-4, dedicate 10 min for explicit recap/Q&A on them)
  7.  Consequences & Skipping (2 min)
  8.  **Killer Question** (Pose & Discuss) (8 min)
  9.  **Q&A** (15 min - Actively steer back to core argument using prepped responses)

  **Why this works for your audience:**

  *   Starts from *their* ontology-laden practice.
  *   Treats FP as a *model* (they work with models).
  *   Uses scientific revolution analogies they know (Vitalism!).
  *   Preempts their likely objections based on experience.
  *   Focuses on ontological commitment/reference (core to scientific realism).
  *   Avoids rabbit holes (consciousness, semantics) while acknowledging them.
  *   The killer question directly tests understanding of the scientific realism stakes.

  **Whiteboard Evolution:**

  1.  Start: **Experiment Design → Assumption: Beliefs/Wants are REAL?**
  2.  **FP THEORY BOX:** Posits (B, D) + Principles → Predicts Behavior
  3.  Add to FP Box: **Risk: Posits might be NON-REFERENTIAL? (Like VITALISM)**
  4.  **Reduction:** FP State X ≈ Neural State Y (Arrow from FP Box)
  5.  **Elimination:** FP State X → ??? / Replaced by Theory T (Arrow from FP Box, cross out X)
  6.  **Skipping:** Consciousness, Semantics, FP Defenses.
  7.  **Killer Question** written large.

  This structure respects their expertise, leverages their intuitions, confronts their implicit assumptions, and makes the radical challenge of EM clear and scientifically grounded. Good luck!
