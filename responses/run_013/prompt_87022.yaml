  I am a graduate student in a value-theory seminar, and a problem about the structure of the betterness relation has stalled my work for weeks; I would rather have your honest probability than a survey of what various philosophers have said. The claim I want you to estimate is this: the all-things-considered better-than relation over outcomes or options is transitive, so that for any options A, B, and C, if A is better than B and B is better than C, then A is better than C. Give me your credence that this is true, and then give me the decomposition rather than a bare number. Break it into the sub-questions the number actually rests on, for instance: how likely it is that a genuine spectrum or small-improvement chain can be built in which every step is intuitively not a worsening while the two endpoints are intuitively ordered the other way; how likely it is that transitivity is a conceptual or constitutive constraint on the meaning of better than, rather than a substantive normative thesis that could in principle turn out false; how likely it is that the correct response to such a chain is to reject transitivity rather than to reject one of the chain's steps, to invoke vagueness or indeterminacy of the verdicts, to give up completeness, or to hold that better than names several distinct relations rather than one; and how likely it is that all-things-considered betterness over outcomes is even a single well-defined relation about which there is a fact of the matter. For each sub-question give a number and a one-line justification, then show how they combine into your total and name the sub-question the total is most sensitive to.

  To keep this from floating free, here is the specific chain that worries me, which I built myself and have not seen discussed. On a scale where 0 marks a life not worth living and larger numbers mark better lives, let the first outcome contain 10,000 people each with a life of quality 100. Each later outcome is obtained from its predecessor by the same single trade: the population is doubled, and every person's quality is multiplied by 0.999. So the second outcome has 20,000 people at quality 99.9, the third has 40,000 at about 99.8, and so on. The chain is long — after a few thousand steps the quality has fallen to just above the threshold while the population has become astronomically large — and it yields two verdicts that seem to pull in opposite directions. On the one hand, no single step looks like a worsening: doubling the population while shaving a tenth of a percent off everyone's quality does not, taken by itself, seem to make the outcome worse, so each outcome seems at least as good as the one before it. On the other hand, the first outcome — a modest number of people all living extremely well — seems clearly better than the last, a teeming mass of lives only barely worth living. Transitivity would force the last to be at least as good as the first, which contradicts the second verdict. My own credence that transitivity holds is around 0.3; a colleague in the seminar puts hers near 0.85. Beyond your own number and decomposition, I want you to locate our disagreement — which single sub-question most likely accounts for the gap between 0.3 and 0.85. My colleague also proposes a specific repair that I want you to evaluate: keep transitivity, she says, but hold that better than is only locally total — that for any outcome there is a neighborhood of outcomes comparable to it, while no single global ordering spans the whole chain, so the spectrum never instantiates one relation that could be violated. Tell me how much, if at all, that repair should move my credence, and in which direction.

