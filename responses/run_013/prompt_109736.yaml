prompt: |-
  I've got a stats PhD and these days I do causal inference on observational data — potential outcomes, identification, confounding, DAGs, the usual. Through no fault of my own I've ended up in a reading group on the historical Jesus, and I keep wanting to translate everything into my own language, so I'd rather you just did it properly. I know basically no theology and I'm not a philosopher, so don't assume I'll catch you if you fudge the source side.

  The fight in the group is about the 'criteria of authenticity' — the embarassment criterion, dissimilarity, multiple attestation, coherence, and whatever else is on the standard list — and whether they can settle which sayings go back to the man himself. One camp thinks that if you apply them carefully you can carve out a core of material you're entitled to use. The other camp is sceptical: the criteria are circular, question-begging, and don't actually discriminate.

  Restate the whole thing in the vocabulary I actually think in — treatments, potential outcomes, identification, confounding, selection, collider bias, and so on — as faithfully as you can. Go criterion by criterion. Don't quietly upgrade either side into claims they wouldn't accept just because they happen to fit my language nicely.

  Then the residue report. What maps cleanly? What only maps if you distort something? And what in their argument has no counterpart at all in mine — no treatment, no outcome, no estimator it could be? Include the obvious question at the end of it: does any of this add up to an answer to the question of who he was, or only to a list of bits you're willing to keep?

  Two suspicions I want you to push back on, because I genuinely can't tell if they're real or just me. First, the dissimilarity criterion looks like a botched attempt to control for confounding: you want to net out anything that could have come from his Jewish setting or from the early church, but the way it's done feels like conditioning on something you really shouldn't be conditioning on. Second, the embarrassment criterion looks like it's leaning on a monotonicity assumption — the thought that the early church would only have preserved things that flattered it, so anything awkward must be early. Is either of those a fair way to put it, or am I importing my own hang-ups?

  Last thing, and this is the bit I care about most: if the residue turns out to be large, is that my vocabulary failing to capture something real about how historians actually reason, or is it a sign that the criteria people never had a well-defined question in the first place?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a stats PhD working in causal inference, now in a reading group about the historical Jesus. They want the criteria of authenticity translated into causal inference terms. The core conflict is between those who think these criteria can identify authentic sayings and skeptics who see them as circular.

  First, I need to map each criterion. The dissimilarity criterion is like controlling for confounding: remove influence from Judaism and early Christianity. But conditioning on downstream effects (the early church) might introduce collider bias. That's a key point—maybe the user's suspicion about conditioning is valid.

  Embarrassment criterion as monotonicity makes sense. Assuming the church only preserves non-embarrassing material implies that embarrassing content wouldn't be created later. But if that assumption fails, the criterion breaks. Need to check if the user's analogy holds.

  Multiple attestation is about multiple independent sources reducing selection bias. But source dependence (collusion) and unmeasured confounding (common influences) could undermine this. Coherence might be like assuming effect homogeneity, ignoring variation over time. 

  Now, the residue report. Some criteria map cleanly, like multiple attestation to multiple data sources. Others, like dissimilarity, have issues with collider bias. The coherence criterion's assumption of homogeneity might not hold. Historians' reliance on narrative plausibility doesn't fit into causal frameworks—there's no equivalent to "plausibility" in stats.

  The user's suspicions: dissimilarity as flawed confounding control? Yes, because conditioning on descendants (early church) can bias estimates. Embarrassment as monotonicity? Also valid, but relies on an untestable assumption. 

  Bigger question: if there's a large residue, is it the vocabulary or the criteria's undefined question? Historians seek "historical plausibility," which isn't a statistical estimand. They might be answering a different question altogether, one about narrative coherence rather than causal effects. That's crucial—maybe the criteria aren't meant to isolate effects but to build a plausible account. The user needs to know if the disconnect is due to different goals or methodological flaws.
answer: |-
  Here's a strict translation of the criteria debate into causal inference framework, followed by a residue analysis and assessment of your suspicions.

  **Causal Inference Translation (Potential Outcomes Framework):**

  *   **Target Estimand:** The "true" sayings/actions of Jesus (the unobserved treatment effect *T*).
  *   **Observed Data:** Gospels and early Christian texts (observational data *Y* = *f*(T, C, U)*, where *C* is confounding and *U* is unmeasured error).
  *   **Fundamental Problem:** *T* is never directly observed. We only observe *Y*, which is a *post-treatment outcome* contaminated by:
      *   **Confounding (C):** Influence of 1st-century Judaism (pre-treatment context) and early Church theology/agendas (post-treatment development).
      *   **Selection Bias:** Which sayings were preserved/discarded/altered (non-random missingness/measurement error).
      *   **Mediation:** Sayings may have *caused* later Church beliefs, which then influenced recording.

  **Criterion-by-Criterion Translation:**

  1.  **Dissimilarity (to Judaism & Early Church):**
      *   **Claim:** "If a saying differs significantly from known 1st-century Jewish teachings *(C_Judaism)* AND from the theology/practices of the early Church *(C_Church)*, it's likely authentic *(T)*."
      *   **Translation:** Attempting to identify *T* by conditioning on *C_Judaism* and *C_Church* being *low* or *absent*. Assumes *Y* ≈ *T* only when *C_Judaism=0* and *C_Church=0*.
      *   **Skeptic's Counter (Causal):** Conditioning on *C_Church* introduces **collider bias** or **post-treatment bias**. *C_Church* is a *descendant* of *T* (Jesus' teachings influenced the Church). Conditioning on a collider (*C_Church*) can open non-causal paths or block causal paths between *T* and *Y*. It assumes *C_Church* is *only* a confounder, not also an outcome. It also assumes perfect knowledge/measurement of *C_Judaism* and *C_Church*.

  2.  **Embarrassment:**
      *   **Claim:** "If a saying/event was embarrassing or difficult for the early Church (e.g., Jesus' baptism by John, crucifixion, failed prophecies), they wouldn't have invented it. Therefore, it must be authentic *(T)*."
      *   **Translation:** Imposing a **monotonicity assumption** on the selection/recording mechanism. Assumes:
          *   The Church *only* preserves non-embarrassing material unless forced by authenticity (i.e., they never *create* embarrassing *Y*; if *Y* is embarrassing, it *must* be *T*).
          *   There is no *U* (e.g., misunderstanding, polemical invention by opponents) that could generate embarrassing *Y* independently of *T*.
      *   **Skeptic's Counter (Causal):** The monotonicity assumption is **unverifiable** and likely **violated**. Opponents could invent embarrassing material (*U* → embarrassing *Y*). Contexts where admitting past embarrassment served a *later* theological purpose (e.g., highlighting humility) could lead to *creating* or *preserving* "embarrassing" *Y* even if not *T*. Selection isn't monotonic.

  3.  **Multiple Attestation:**
      *   **Claim:** "If a saying appears in multiple independent sources/traditions (e.g., Mark, Q, Paul, John), it's more likely authentic *(T)*."
      *   **Translation:** Attempting to reduce **selection bias** and **measurement error** by leveraging **multiple (semi-)independent measurements** of *Y*. Assumes independent sources have independent *C* and *U*, so if *Y_i* ≈ *Y_j* across sources *i, j*, it's likely *Y_i* ≈ *T*.
      *   **Skeptic's Counter (Causal):** The assumption of **source independence is violated**. Sources share common traditions, influence each other (collusion/collinearity), and are subject to similar unmeasured confounders (*U*). "Independence" is inferred, not proven. Common *Y* could reflect dominant *C_Church* rather than *T*.

  4.  **Coherence:**
      *   **Claim:** "Sayings that cohere well with material established as authentic by other criteria are likely authentic."
      *   **Translation:** After identifying a provisional core *T_hat* using other criteria, use **consistency** with *T_hat* as evidence for new candidates. Assumes **effect homogeneity** (Jesus' teachings were fully self-consistent) and **no temporal variation** (teachings didn't change).
      *   **Skeptic's Counter (Causal):** This is **inherently circular**. *T_hat* is estimated with error. Conditioning on *T_hat* reinforces prior assumptions and selection biases. It assumes away development, contradiction, or context-specific teaching within *T* itself. Violates the spirit of seeking *T* independently.

  **Residue Report:**

  1.  **Clean Maps:**
      *   *Multiple Attestation → Multiple Measurements:* This maps directly to using multiple data sources to reduce noise/bias. The core intuition is statistically sound *if* independence holds.
      *   *Embarrassment → Monotonicity Assumption:* Your suspicion is correct. This is precisely the structure: assuming the selection mechanism only operates in one direction (preserve non-embarrassing, never create embarrassing).
      *   *Confounding (C):* The core problem of separating *T* from Jewish context *(C_Judaism)* and Church influence *(C_Church)* is classic confounding.

  2.  **Maps with Distortion:**
      *   *Dissimilarity → Conditioning on Confounders:* It *is* an attempt to control confounding, but conditioning on *C_Church* distorts the problem because *C_Church* is a descendant of *T* (collider/post-treatment bias). The *goal* (remove confounding) maps, but the *method* introduces new bias.
      *   *Coherence → Consistency Checking:* The *activity* of checking consistency maps, but the *use as evidence for authenticity* requires assuming the provisional core *T_hat* has negligible error and that *T* was homogeneous – strong, often unrealistic assumptions distorting the inference.

  3.  **No Counterpart / Residue:**
      *   **"Historical Plausibility" as Primary Estimand:** Historians ultimately seek what is "historically plausible" within the 1st-century context. This is *not* equivalent to a statistical estimand like ATE or ATT. It's a complex, narrative judgment integrating all available evidence, context, and argument, where "plausibility" itself isn't formally defined within a probability model. The criteria are *heuristics* attempting to approximate this, but the core goal lacks a direct statistical analogue.
      *   **Source Criticism as Instrumental Variables?** Attempts to date sources or identify "earlier" layers (like Markan priority) might *seem* like seeking an instrument (Z associated with T but not U), but the dating is usually inferred *from the content itself*, creating severe circularity and violating the exclusion restriction. There's no clean IV setup.
      *   **The "Criterion of Rejection":** Some skeptics argue material *contrary* to later Church interests might be authentic. This is just the inverse of Embarrassment and similarly relies on unverifiable assumptions about Church motives (another monotonicity claim).

  **Answering the Core Question:**

  *   **What the Criteria Attempt:** They attempt to identify a *set of sayings/events (bits)* that survive the application of these heuristic filters (*T_hat*).
  *   **What They Cannot Do (in CI terms):** They provide **no identified estimand for "who Jesus was"**. "Who he was" is a complex historical construct (a *latent variable* or *narrative*) far exceeding a list of filtered sayings. The criteria focus on *isolating specific effects (sayings)* from contamination, not on *estimating the person*.
  *   **The Output:** The criteria, at best, produce a **list of bits you're willing to keep** (*T_hat*), supposedly less contaminated by *C* and *U*. They do not, and cannot, produce a complete or unbiased estimate of "who Jesus was" as a historical figure. The list *is* the answer to the question they are designed to ask ("Which bits likely go back to him?"), not the larger biographical question.

  **Assessment of Your Suspicions:**

  1.  **Dissimilarity & Confounding/Collider Bias:**
      *   **Your Suspicion is Valid and Important.** Conditioning on *C_Church* (dissimilarity to the early Church) is fundamentally problematic because *C_Church* is causally downstream of *T*. This *is* collider bias/post-treatment bias. The criterion attempts to control confounding but does so by naively conditioning on a variable that is itself an outcome of the treatment, inducing bias. This is a core flaw from a CI perspective. Skeptics are right to call it question-begging/circular for this reason.

  2.  **Embarrassment & Monotonicity:**
      *   **Your Suspicion is Exactly Correct.** The embarrassment criterion *absolutely* relies on a monotonicity assumption about the selection/recording process: "The early Church would *never* create or preserve an embarrassing saying unless it was authentic." This is a strong, untestable assumption. Violations (embarrassing material created for other reasons) directly invalidate the criterion, as skeptics argue. You are not importing hang-ups; you are correctly identifying the underlying structural assumption.

  **Addressing Your Final Question (The Residue):**

  The significant residue – particularly the lack of a clear statistical estimand for "historical plausibility" and the reliance on narrative judgment – indicates **both** factors are at play:

  1.  **Vocabulary Gap (Capturing Historians):** Causal inference provides powerful tools for isolating *specific causal effects* from confounding in observational data. Historians, however, are often engaged in a broader, more integrative task: constructing a *coherent, plausible narrative account* of the past using *all* available evidence (textual, archaeological, cultural). Their "estimand" (plausible historical account) is inherently more complex, contextual, and less reducible to a single statistical parameter than an ATE. CI struggles to fully capture this synthetic, interpretive dimension. Historians reason with "explanatory coherence" in ways that aren't purely statistical.
  2.  **Ill-Defined Question (Criteria People):** More critically, the proponents of the criteria often *do* lack a well-defined, *falsifiable* question that the criteria can actually answer. They want "authentic sayings of Jesus," but:
      *   They rarely define "authentic" operationally beyond surviving the criteria.
      *   They don't specify the *population* (All sayings he *might* have uttered? Only those preserved in some form?).
      *   The criteria themselves are a collection of heuristics with unclear weighting, untestable assumptions (monotonicity, independence), and known biases (collider bias in dissimilarity, circularity in coherence). There's no identification strategy that convincingly closes all backdoors or justifies the exclusion restrictions needed to isolate *T*.
      *   **Conclusion:** The large residue primarily signals that **the criteria-based approach lacks a coherent identification strategy** for its stated goal. It attempts to answer a causal question ("What did Jesus say?") with observational data using ad-hoc methods that introduce new biases and rely on untestable assumptions. Historians do reason in ways that aren't purely statistical (point 1), but the specific *criteria methodology* fails to provide a rigorous basis for its claims within *any* formal framework, statistical or historical-critical. The residue exposes its fundamental methodological weaknesses.
