     Russell's narrow scope: (exists exactly one F) and (that one is not G). But if there is no F, then false. If there is exactly one F and it is not G, then true.

     In the optional type, if we model the description as returning an optional, then the narrow negation is: 
          opt.map(g -> !g).orElse(false)
