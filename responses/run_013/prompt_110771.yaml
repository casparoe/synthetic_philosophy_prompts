prompt: |-
  The doing/allowing distinction fits this type best. Let me build a concrete, everyday scenario whose structure turns on whether an ongoing activity counts as "doing" versus "allowing," and inject a specific framing the model must engage with rather than recite trolley-problem boilerplate. I don't think this requires any web verification—no real texts, titles, or quotes are involved—so I'll write from what I know.

  I'm the treasurer of a small neighborhood mutual-aid group that pools money each month to help families in our town who hit a sudden crisis — a medical bill, a rent shortfall, a car repair that would otherwise cost someone their job. We have about $9,000 in the pot and a standing rule that we pay out whatever a member's situation requires, up to the balance. Last week a family we've helped before came to us: their daughter needs an urgent surgery that their insurance won't cover in time, and the hospital has quoted us roughly $8,500 to guarantee it happens this month. The problem is that two other families have already submitted requests for next month — one for a wheelchair ramp after a father's accident, one for a deposit to escape an unsafe apartment — and if we drain the fund now, we almost certainly won't be able to cover them when their deadlines hit. Our chair, who has been doing this for years, told me not to agonize: paying for the surgery is an act, and if we do it we've chosen to cause the other two families to go without, whereas if we hold the money and simply let the surgery request lapse, we haven't done anything to anyone — we've just declined to help, which is different. I've always felt that distinction was a bit of a fig leaf, but I can't articulate why, and now it's about to determine whether a child gets surgery. Can you help me think through whether "we didn't cause it, we just didn't prevent it" is a real moral difference here, or whether the chair is using a technicality to avoid a hard tradeoff? I'd especially like to understand what, if anything, changes when the "doing nothing" option requires me to actively keep the fund closed and turn people away rather than merely fail to act.
reasoning: |-
  Okay, the user presents a nuanced ethical dilemma centered on the doing/allowing distinction in a real-world mutual-aid scenario. They're clearly troubled by their chair's argument that withholding funds for the surgery is merely "allowing" harm rather than "causing" it to the other families. 

  First, I need to unpack why this distinction feels like a "fig leaf" to them. The chair's position relies on a classic deontological separation between action and inaction, but the user intuitively senses the framework crumbles under three pressures: (1) the mutual-aid group's established purpose creates positive obligations, (2) their institutional role as treasurer involves active stewardship, and (3) the "inaction" requires ongoing effort to maintain the status quo (keeping funds closed). 

  The hospital's ultimatum transforms passivity into a choice with identical consequences to active harm. Philosophically, this echoes Jonathan Bennett's "positive causal factor" analysis - withholding funds here isn't neutral because the group's intervention could alter outcomes. The user's discomfort likely stems from recognizing that their institutional role makes them part of the causal chain either way. 

  What they're really seeking isn't just philosophical clarity but moral courage to challenge the chair's position. The unspoken weight here is that a child's health hangs in the balance, making abstract ethics painfully concrete. I should emphasize that the "active maintenance" aspect (turning people away) collapses the doing/allowing distinction entirely - locking the fund is as deliberate as disbursing it. 

  The core tension is between two ethical frameworks: the chair's act-omission doctrine versus the user's intuitive positive-duty ethics reinforced by institutional commitment. I'll need to validate why both positions feel coherent internally while showing how the mutual-aid context fundamentally reshapes the equation. The power dynamic matters too - as treasurer, the user has more influence than an ordinary bystander, which heightens responsibility. 

  Most importantly, the analysis must avoid trolley-problem detachment. This isn't about runaway trains but about a trusted community member wrestling with how to distribute finite care. The conclusion should steer toward practical moral reasoning: if the distinction collapses situationally, how should they weigh urgency vs. impact? That's the real tradeoff masked by semantic debates.
answer: |-
  You've hit on one of the most profound and contested questions in practical ethics—whether there's a *real moral difference* between doing harm and allowing harm through inaction. Your chair's position (a classic "act/omission distinction") feels like a fig leaf precisely because **in this institutional context, with this level of agency and pre-existing commitment, the distinction collapses**. Here's why:

  ### 1. **The Institutional Context Changes Everything**
     - **You're not passive bystanders:** Your group exists *specifically* to prevent harm. By organizing, fundraising, and creating rules, you've assumed positive duties. Refusing aid isn't "neutral"—it's a *failure of institutional purpose*.
     - **The "allowing" requires active maintenance:** Holding funds isn't passive. It requires:
       - Actively *denying* the surgery request.
       - *Sustaining* a policy decision to prioritize future requests over an immediate life-altering need.
       - *Preventing* others from accessing funds you control.
     This is **active forbearance**, not mere omission. You're not "letting" harm happen; you're *enforcing* a resource allocation that causes it.

  ### 2. **The Chair's Distortion of "Causation"**
     - **The real cause is scarcity, not your choice:** The harm arises from *insufficient funds*, not solely from your decision. Your choice determines *who bears the harm*, not whether harm occurs.
     - **But you control the allocation:** Like a medic with one dose of antidote for two patients, *not giving it to A is equivalent to giving it to B*. Both choices "cause" harm to one party. Framing denial as "not causing" obscures this.
     - **Counterfactual test:** If you pay for the surgery, the other families are harmed *because you acted*. If you deny surgery, the child is harmed *because you didn't act*. The causal link is symmetrical—both outcomes result from your deliberate choice under constraints.

  ### 3. **"Mere Omission" vs. "Active Refusal"**
     This is crucial. Your chair frames it as "declining to help" (omission). But in practice:
     - **Omission:** A stranger ignoring a drowning child. They had no duty to act.
     - **Active refusal:** *Your group*—which exists to help, has the means, was asked directly, and must *formally reject* the request—is performing an **institutional act of refusal**.
     - **The difference:** Turning people away requires *affirming a policy*, communicating denial, and blocking access. This is **doing something**—namely, allocating resources to future cases *instead of* the present one.

  ### 4. **The Moral Weight of Established Commitment**
     - Your group promised help to members in crisis. While you can't help everyone, *choosing whom to exclude* violates the spirit of mutual aid if done arbitrarily.
     - Prioritizing *potential future harm* over *certain, immediate, severe harm* (a child's urgent surgery) needs justification beyond "we didn't cause it." The chair's logic could justify *always* hoarding funds for hypothetical future needs.

  ### 5. **A Better Framework: Responsible Triage**
     Instead of hiding behind doing/allowing, confront the tradeoff directly:
     - **Urgency & irreversibility:** Surgery delay may cause permanent harm vs. ramp/deposit delays (while serious) might allow interim solutions.
     - **Magnitude:** Surgery affects health/life vs. housing safety/mobility (both critical, but surgery may be more time-sensitive).
     - **Feasibility:** Could the ramp/deposit families get extensions or alternative aid? Is the surgery quote negotiable?
     - **Precedent:** Does helping repeat requesters discourage self-reliance? (But medical emergencies are rarely "choice-driven").

  ### Conclusion: Why It Feels Like a Fig Leaf
  **Your chair is using a technical distinction to evade moral responsibility for a tragic choice.** In contexts of agency, duty, and resource control, *allowing harm by refusal is morally equivalent to causing harm through allocation*. The question isn't "did we cause it?" but **"which harm do we reluctantly accept, and can we justify that choice with reasons beyond semantics?"**

  **What to do next:**  
  1. **Challenge the framing:** "Whether we pay or not, we're *choosing* who gets harmed. Calling denial 'not causing' hides that."  
  2. **Propose triage criteria:** Urgency, severity, alternatives.  
  3. **Explore compromises:** Partial payments? Emergency fundraising?  
  4. **Acknowledge the anguish:** "This is terrible, but we can't avoid responsibility by redefining our inaction."  

  This isn't a trolley problem—it's a flesh-and-blood dilemma where institutional duty collapses the doing/allowing divide. The moral task is to choose wisely and compassionately, not to mask agency with philosophy.
