answer: |-
  ### Workshop Activity: "The Simulation Gambit"  
  *Designed for 90 minutes, 14 participants. Focus: How the simulation argument might dampen or amplify longtermist fanaticism. Participants commit to resource allocations before learning about simulation risks, then revise after. No prior reading needed. Materials: Printed allocation sheets, cards, coins, pens.*

  ---

  ### **Materials to Print (1 double-sided sheet per participant)**  
  **Side 1: Allocation Sheet**  
  ```markdown
  Name: __________  

  ▶ INITIAL ALLOCATION (Round 1)  
  You have 10 tokens. Allocate between:  
  - **Fund N (Near-Term):** Each token saves 100 lives *now* (certain).  
  - **Fund F (Far Future):** Each token has a 1% chance of saving 1,000,000 lives in the far future.  

  Tokens to Fund N: _____  
  Tokens to Fund F: _____  
  Total: 10 tokens  

  ▶ REVISED ALLOCATION (Round 2)  
  After learning about the simulation argument, reallocate your 10 tokens:  
  Tokens to Fund N: _____  
  Tokens to Fund F: _____  
  Total: 10 tokens  
  ```  

  **Side 2: Outcome Calculator & Rules**  
  ```markdown
  **Rules**  
  - **Fund N:** Always saves lives now (no risk).  
  - **Fund F:** Value depends on world state:  
    - **Horn 1 (Extinction):** Fund F = 0 (no far future).  
    - **Horn 2 (No Simulations):** Fund F = 10,000 lives/token (1% chance × 1M lives).  
    - **Horn 3 (Simulated):** Fund F = 5,000 lives/token (50% truncation risk).  

  **Payoff Formula**  
  Expected Lives Saved = (Fund N tokens × 100) + (Fund F tokens × [Horn Multiplier])  

  **Horn Multipliers (drawn later):**  
  - Horn 1: 0  
  - Horn 2: 10,000  
  - Horn 3: 5,000  
  ```  

  **Additional Materials**  
  - **12 Cards:** Label 4 as "Horn 1 (Extinction)", 4 as "Horn 2 (No Simulations)", 4 as "Horn 3 (Simulated)".  
  - **1 Coin** (for truncation demo; not used in payoffs).  
  - **Group Summary Sheet** (for facilitator to record allocations).  

  ---

  ### **Activity Timeline (90 Minutes)**  
  **Goal:** Participants experience two dampening effects (truncation + displacement) and the symmetry between fanaticism and the simulation argument.  

  | Time  | Phase               | Instructions                                                                                                                                 |
  |-------|---------------------|----------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-10  | **Setup & Round 1** | Explain: "You’re policymakers allocating tokens to save lives. Fund N helps now; Fund F has tiny odds of huge far-future impact. Commit to Round 1 allocations. No discussion." Collect sheets. |
  | 10-25 | **Simulation Argument Intro** | Explain the 3 horns (1: extinction, 2: no sims, 3: we’re sims). Focus on Horn 3: "If simulated, two risks: (1) *Truncation*: Sims shut off early (flip coin: heads = continues, tails = ends → cuts far future). (2) *Displacement*: Your actions affect only the sim, not base reality. Base reality’s future is out of your hands." *Don’t resolve uncertainty yet.* |
  | 25-35 | **Round 2: Revise** | Redistribute sheets. "Revise allocations knowing Horn 3 risks. Does truncation/displacement change your view of Fund F?" Collect sheets.      |
  | 35-45 | **Reveal World State** | Shuffle 12 cards. Draw one to set the group’s "world" (e.g., Horn 3). If Horn 3, flip coin for truncation (symbolic; payoff uses fixed 5,000 multiplier). |
  | 45-60 | **Calculate Payoffs** | Return sheets. Participants compute:  
    - **Round 1 Outcome:** Lives saved using *initial* allocation + drawn Horn multiplier.  
    - **Round 2 Outcome:** Lives saved using *revised* allocation + same multiplier.  
  | 60-75 | **Small Group Debrief (3–4 people)** | Discuss: "Did the simulation argument make you invest *less* in Fund F? Why? Did anyone invest *more*? What dampening effect (truncation/displacement) felt strongest?" |
  | 75-90 | **Full Group Debrief** | Facilitator-led discussion. Use group data. Key questions:  
    - *Truncation Effect:* "If Horn 3 truncates the future, does Fund F lose value? How many of you cut Fund F tokens?"  
    - *Displacement Effect:* "In Horn 3, your actions can’t shape base reality’s far future. Does that make Fund F feel less ‘yours’?"  
    - *Symmetry:* "The simulation argument assigns big value to tiny odds (e.g., sims). Fund F does too. Why trust one but not the other?"  
    - *Disjunction Twist:* "Horn 3 implies *some* civilization survived. Does that make you *more* optimistic about avoiding extinction?"  

  ---

  ### **Key Design Notes**  
  1. **Dampening Mechanics Exposed:**  
     - **Truncation:** Modeled via Horn 3’s 50% coin flip (reduces Fund F’s expected value by half). Participants see direct risk.  
     - **Displacement:** Implied by Horn 3’s "base reality" framing. In debrief, participants report feeling Fund F is "not theirs to shape."  
     - **Evidential Effect (Debrief Only):** Not built into allocations (too complex). Discuss: "If we’re sims, does Horn 3 imply *lower* extinction risk for base civs?"  

  2. **Symmetry with Fanaticism:**  
     - Fund F uses fanaticism logic (1% chance of huge payoff). Simulation argument does too (tiny chance of sims → vast simulated minds).  
     - Activity forces confrontation: If participants cut Fund F post-simulation, ask: "Why reject fanaticism here but accept it for sims?"  

  3. **Disjunction Ambiguity:**  
     - Horn 3’s survival implication isn’t in payoffs (it’s evidential). In debrief, highlight: "Horn 3 says *someone* made it—does that boost your hope?"  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Participants resist "expected value" math.  
    **Fix:** Pre-calculate examples (e.g., "2 Fund F tokens in Horn 2 = 20,000 lives"). Emphasize it’s a thought experiment.  
  - **Problem:** Horn 3’s displacement feels abstract.  
    **Fix:** In intro, use an analogy: "Shaping base reality’s future is like trying to fix a neighbor’s car while locked in your garage."  
  - **Problem:** Some over-adjust to Horn 3 (e.g., drop Fund F to 0).  
    **Fix:** In debrief, contrast: "Did displacement make you give up, or did truncation just reduce odds?"  

  ---

  ### **What the Activity Can’t Capture**  
  **The evidential update** (learning we’re sims implies lower extinction risk for base civilizations). You must explain this verbally:  
  > "In the simulation argument, Horn 3 suggests *some* civ survived—so if we’re sims, our own extinction risk might be lower. But this isn’t in the activity’s payoffs. We’d need to adjust Horn probabilities after Horn 3 is drawn (e.g., Horn 1 becomes impossible). This could make Fund F *more* attractive—but we’ll explore that another time."  

  ---

  **Final Prep Tips**  
  - Print 14 double-sided sheets, cards, and one summary sheet.  
  - Bring coins/pens.  
  - During intros, stress: "This is about your choices—not getting the ‘right’ answer."  
  - In debrief, tease out tension: "Is the simulation argument a reason to care *less* about the far future... or *more*?"  

  This structure ensures participants *live* the reasoning, commits them to numbers pre-revelation, and fits on two A4 pages. Run it, and let the choices spark the debate!
