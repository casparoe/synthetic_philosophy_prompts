  We are designing an interactive workshop activity to explore how the simulation argument might affect longtermist decision-making. The goal is for participants to experience the reasoning firsthand through choices and consequences, rather than through lecture. The activity should illustrate different versions of "dampening" (truncation, displacement, evidential) and highlight the tension between the simulation argument and fanaticism.

  Key constraints:
  - Must be runnable in 90 minutes with 14 people.
  - No prior reading; no reliance on attributions.
  - Participants commit to choices (numbers, allocations, bets) before reframing (e.g., learning about simulation).
  - Should expose at least two types of dampening.
  - Address the symmetry: simulation argument uses the same structure (tiny probability of enormous value difference) as fanaticism.
  - The disjunctive nature of the simulation argument (three horns) might have mixed effects on longtermism.

  Design approach:
  - We need a decision scenario where participants allocate resources between near-term and far-term benefits.
  - Then, introduce the simulation possibility and see how it changes their allocations.
  - We can use a betting or allocation game with a payoff scheme that doesn't require real money.

  Possible structures:

  Structure 1: "Resource Allocation with Simulation Revelation"
  - Participants are given a fixed budget of tokens to allocate between two funds: one for near-term (e.g., helping 100 people now) and one for far-term (e.g., helping a vast number in the far future, but with low probability of success).
  - Step 1: Initial allocation without knowing about simulation.
  - Step 2: Introduce the simulation argument: they might be in a simulation that truncates the future (truncation dampening) or that displaces the value (they are not the real civilization). Also, they learn that the simulation argument implies either extinction, no simulations, or we are simulated (three horns).
  - Step 3: Allow them to revise their allocation after learning about simulation.
  - Step 4: Compute payoffs based on whether they are in a simulation (determined by a random draw with probability set by the simulation argument) and which horn is true.

  Structure 2: "Betting on the Future"
  - Participants place bets on two outcomes: (A) the far future is real and vast, (B) the near-term matters more because of simulation risk.
  - We assign probabilities to the three horns of the simulation argument and condition the payoffs on these.
  - The betting odds reflect their beliefs about the simulation argument and its implications.

  Structure 3: "Civilization Building Game"
  - Participants are divided into groups representing different civilizations. They make decisions about investing in near-term vs. long-term projects (like running simulations or preventing existential risks).
  - Then, they learn whether they are simulated or not, and see how that affects the outcomes of their investments.

  I choose Structure 1 because it is simpler to run in 90 minutes and directly involves individual allocation decisions that can be compared before and after the revelation. We can incorporate the three horns and the dampening effects.

  Detailed Plan:

  Title: "The Simulation Gambit: Allocating in the Shadow of the Matrix"

  Materials:
  - Printed allocation sheets (one per participant) with two options: Near-Term Fund and Far-Future Fund.
  - Tokens (or use pen to mark allocations) - each participant gets 10 tokens.
  - A deck of 12 cards: 4 labeled "Extinction" (Horn 1), 4 labeled "No Simulations" (Horn 2), 4 labeled "Simulated" (Horn 3). This represents the simulation argument probabilities (roughly 1/3 each for simplicity, though Bostrom's argument doesn't require equal probabilities, but for activity we simplify).
  - A coin (for truncation: heads = simulation continues, tails = truncated).

  Setup:
  - Each token allocated to the Near-Term Fund saves 10 lives now (with certainty).
  - Each token allocated to the Far-Future Fund has a 1% chance of saving 1 million lives in the far future (fanaticism: small chance of huge payoff). [Note: We are using a 1% chance to make the expected value of one token in the far future fund 10,000 lives, which is much higher than the 10 lives in the near-term, to mimic fanaticism.]

  Rules:
  1. Initial allocation: Participants allocate 10 tokens between the two funds without any knowledge of simulation.
  2. Then, we introduce the simulation argument and the three horns. We explain the three possibilities and the dampening effects:
