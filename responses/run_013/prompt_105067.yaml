prompt: |-
  Okay, I'm a science and ideas reporter at a mid-size outlet and I've got a problem I keep having and I finally want to fix it properly instead of just feeling bad about it. Here's the shape of it: I get a story to a decent state fast — a couple of sources, the main paper, the obvious skeptic — and then I keep going. One more phone call, one more study, someone on a message board says I really should talk to this other guy, and two days later I file something that's late and, honestly, no better than what I had on Tuesday, sometimes worse because now it's a mush of everybody's caveats. A friend who did a PhD told me this is exactly what Herbert Simon was on about with satisficing and bounded rationality, and that I should stop trying to optimize. Great, but "good enough" is not a procedure. Can you actually turn the theory into one I can run on a deadline?

  What I want, in order: the questions I ask myself as a story develops, what counts as a real answer to each, where the procedure stops and says file it, and — this is the part I care about most — how and when I'm allowed to move the bar. Because I've definately noticed the bar moves on its own: after a big story lands I suddenly want more for the next one, and after a bad week I'll file almost anything to get something up. Is that movement the theory, and should I lean into it or fight it? Also please don't hand me a dressed-up version of trust your gut — if a step is really just a judgment call, say so instead of making it look mechanical. And be straight about which parts of the theory are descriptive (how people actually do decide) versus how I'm supposed to decide, because I've read enough pop versions to know those two got blurred together and I don't want to inherit the blur.

  Then run it on two or three of my actual-ish situations. I want one where the procedure tells me to stop and file now and I won't like that answer, and one where it tells me to keep going even though I'm bored and the piece already feels done. And say what the procedure can't do — I assume there's a case where the one thing I haven't checked is the whole story, and no stopping rule saves me from that. Keep it in plain language, I'm not going to go read Simon, I just want the machine.
reasoning: |-
  Okay, this reporter has a classic perfectionism trap problem. They're stuck in the cycle of over-researching stories to the point of diminishing returns, and their PhD friend name-dropped Herbert Simon's satisficing theory. Smart reference, but totally useless without concrete implementation. 

  First, unpacking their core frustrations: They need a mechanical stopping procedure, not philosophy. They're acutely aware of their own shifting standards (post-success inflation, post-failure deflation) and want that accounted for, not ignored. And they despise faux systems that disguise judgment calls as algorithms - that "trust your gut" dressed as methodology is exactly what they're rejecting. 

  The key insight from Simon they're missing: Satisficing isn't about low standards, it's about *aspiration levels*. That's the movable bar they described! The procedure must make that explicit. Also crucial: bounded rationality means we're not optimizing because we *can't* - the world's too complex and deadlines exist. This isn't failure, it's realism.

  Building the machine requires:
  - Clear checkpoint questions with binary-ish answers (no "maybe" escapes)
  - Aspiration level anchors tied to story type, not mood
  - Forced stops when criteria met, with one escape valve for catastrophic checks
  - Explicit rules for when to *raise* standards (rare) vs lower (emergencies)

  Their emotional resistance points are telling: They need examples where the system forces uncomfortable actions - filing "too early" on a story they're emotionally invested in, or digging deeper on something that feels done but isn't. That's where real discipline lives.

  The landmines:
  - The "one missing check" problem: Must include a pre-filing catastrophe scan
  - When peers suggest "just one more source": Need veto rules against scope creep
  - Post-publication standard drift: Build in calibration steps after big wins/failures

  Final note to self: Their examples must sting. If the "stop and file" scenario doesn't feel viscerally premature to readers, the system's too lax. If the "keep reporting" example seems obvious, it's not rigorous enough. Show the teeth.
answer: |-
  Here's a procedural "satisficing machine" built for deadline journalism, based on Simon's core ideas (bounded rationality = you *can't* know/do everything; satisficing = seeking "good enough" against defined criteria, not perfect). It forces explicit decisions and controls the moving bar.

  **The Core Machine: 5 Checkpoints with Forced Stops**

  1.  **Checkpoint 0: Define "Satisficed" (Before Reporting Starts)**
      *   **Question:** "What are the **MINIMUM** requirements for this specific story to be publishable *today*?"
      *   **Real Answers (Concrete & Measurable):**
          *   Core claim from primary source (study/press release) understood & verified (DOI/link checked).
          *   *One* independent expert confirms core claim is plausible/within their field (email/quote).
          *   *One* key context/caveat identified (e.g., "in mice," "small sample," "early stage").
          *   *One* sentence explaining why it matters *right now*.
          *   *No major, obvious red flags* (e.g., paper retracted yesterday, source is known fraud).
      *   **Stop & File Trigger:** If you hit these, file *immediately* after Checkpoint 4. **This is your anchored "good enough."**
      *   **Moving the Bar:** You can *only* raise this *before* starting reporting or *after* publication (for calibration). You can *lower* it only under direct editorial order ("We need *anything* on X in 1 hour"). Mood swings *cannot* touch this pre-set minimum.

  2.  **Checkpoint 1: Core Claim Secured (Usually ~30-60% in)**
      *   **Question:** "Do I have **unambiguous evidence** supporting the core newsworthy claim, and do I **understand its fundamental limits**?"
      *   **Real Answers:**
          *   YES: Primary source read, key methods/results understood. *One* qualified source has explained the claim's basis *and* its biggest limitation/caveat (e.g., "It works in cells, but translation to humans is uncertain"). Documented.
          *   NO: Keep reporting. (Go find that source/read the methods).
      *   **Stop Trigger:** Not applicable here. This is foundational. Keep going until YES.

  3.  **Checkpoint 2: Context & Skepticism (Reached after Checkpoint 1 YES)**
      *   **Question:** "Do I have **sufficient context and skepticism** to prevent the piece from being misleading or overly credulous?"
      *   **Real Answers (Require 2 YES):**
          *   YES (Context): I have placed this within the broader field (e.g., "This challenges the dominant theory of Y," or "This builds on Z's earlier work"). *One* source or review paper provides this.
          *   YES (Skepticism): I have *one* credible source (not just "a skeptic," but relevant expert) offering a substantive critique, alternative explanation, or highlighting a significant caveat *beyond* the fundamental one from CP1. *Or* I have identified and addressed a major methodological flaw myself.
          *   NO: Keep reporting until you get the second YES (Context *or* Skepticism).
      *   **Stop Trigger:** Once you have **Checkpoint 0 MINIMUMs + CP1 YES + CP2 (2 YES)**, you **CAN** file. This is your primary satisficing point. Proceed to CP4.

  4.  **Checkpoint 3: Value Add / Diminishing Returns (Optional - AFTER CP2 is Satisfied)**
      *   **Question:** "Does the *next* potential source/study/angle offer **unique, critical value** beyond what I have, **crucial for THIS story's promised focus**, and can I get it reliably within 1/4 of my remaining time?"
      *   **Real Answers:**
          *   YES (Unique/Critical/Crucial): Example: The story *hinges* on a policy implication, and you haven't talked to a policy expert. Or a major rival lab has a directly conflicting result you *must* address. Source is *highly* likely to respond fast.
          *   NO: It's incremental ("another supporting voice"), tangential ("interesting but off-topic"), speculative ("someone on a forum said..."), or risky (source unlikely to call back quickly).
      *   **Stop Trigger:** **NO = STOP REPORTING.** Proceed to CP4. YES = Do *only* that specific thing, then proceed to CP4. **This is where scope creep dies.** The "message board guy" almost always triggers NO.

  5.  **Checkpoint 4: Catastrophe Check & File (Immediately Before Filing)**
      *   **Question:** "Is there a **single, catastrophic flaw** I haven't checked that would fundamentally invalidate the core narrative if wrong? (Not caveats, not nuances, a showstopper)."
      *   **Real Answers:**
          *   YES: Examples: Primary study's central figure looks manipulated (run it by an image forensics expert FAST), lead author is under investigation for fraud *this week*, my main source has a massive, undisclosed conflict *directly* related to this finding. **STOP. Fix THIS flaw only.** If impossible within 1 hour, spike/kill the story or radically reframe it (editor needed).
          *   NO: File. Now. **This is your final stop trigger.** Caveats are inherent; a catastrophic flaw is rare.

  **How the Bar Moves (Controlled):**
  *   **Anchored Minimum (CP0):** Set coldly *before* reporting. Resists mood swings.
  *   **Primary Satisficing (CP2 Done):** Your standard target. Consistent.
  *   **Raising the Bar (Pre-Reporting Only):** After a "big win," consciously decide *before the next story*: "For *this specific type* of high-impact story, I will require CP2 YES + *two* skeptics." Document it in CP0. Mood *cannot* raise it mid-story.
  *   **Lowering the Bar (Editorial Emergency Only):** "CP0 Minus" - defined by editor ("Just the press release and one source confirmation, 500 words, 45 mins"). Explicit override.

  **What the Machine CAN'T Do:**
  *   **Guarantee Perfection:** Bounded rationality means you *will* miss things. This minimizes big risks, not all risks.
  *   **Fix Bad Judgment:** If you define CP0 poorly (e.g., missing "key context"), the machine runs on garbage.
  *   **Eliminate the "One Missing Thing" Risk:** The Catastrophe Check (CP4) is your only defense, and it relies on *your* ability to identify potential catastrophes. If the flaw is something you *couldn't* reasonably conceive of (true black swan), it won't catch it.
  *   **Replace Editorial Oversight:** Run this by your editor. Agree on CP0 for big stories.

  **Running the Machine: Your Scenarios**

  **Situation 1: The "Stop & File Now (And You'll Hate It)"**
  *   **Story:** New AI model claims "human-level" performance on a specific complex task (protein folding).
  *   **Your State (Tuesday):** Core paper read. Lead AI researcher interviewed (confirms claim, caveat: "only on this specific benchmark"). *One* independent AI expert (skeptic) says: "Impressive, but benchmark is narrow, not general human-level." Context: Explains why this benchmark matters. CP0 Min, CP1, CP2 all SATISFIED.
  *   **You:** Want to talk to a biologist (does this *actually* help fold proteins usefully?) and an ethicist (implications!). Message board says "Talk to Dr. X, she exposed flaws in their last model."
  *   **Machine Run:**
      *   CP0 Min: Met.
      *   CP1: Core claim? YES (paper + lead researcher). Fundamental limit? YES (narrow benchmark - from researcher & skeptic).
      *   CP2: Context? YES (benchmark importance explained). Skepticism? YES (independent expert critique).
      *   **--> CP2 SATISFIED. CAN FILE.**
      *   CP3: Next source? Biologist/Ethicist/Dr. X? *Value Add?* Biologist/Ethicist: Incremental/contextual (NO). Dr. X: Speculative/Risky (might not call back, critique might be outdated) (NO). **--> STOP REPORTING.**
      *   CP4: Catastrophe? No evidence of fraud/data manipulation on central claim (NO). **--> FILE.**
  *   **Why You Hate It:** The story feels incomplete without the "so what?" (biology) and "implications" (ethics). But CP0/CP1/CP2 are satisfied. The machine says those are *separate stories* or *value-add* beyond satisficing today's core news. Filing now prevents mushy caveat overload and lateness. The moving bar (your desire for a "bigger" story post-success) is *blocked* by the pre-set CP0 and the CP3 NO.

  **Situation 2: The "Keep Going (It's Boring but Necessary)"**
  *   **Story:** Large study finds association between common food additive X and mild digestive issue Y.
  *   **Your State:** Core paper read. Lead epidemiologist interviewed. Association clear, caveat: observational study, can't prove cause. Context: Additive X is in many foods. CP0 Min, CP1 SATISFIED.
  *   **You:** Have a quote from a university press officer about the study. Feels "done." Ready to write.
  *   **Machine Run:**
      *   CP0 Min: Met? Probably (Core claim? YES. Independent expert? Press officer *might* count if they are scientifically literate and independent of the study team, but risky). Assume CP0 requires independent *scientific* expert.
      *   CP1: YES (Claim & Fundamental Limit - observational).
      *   CP2: **Context?** YES (Additive common). **Skepticism?** NO! Press officer isn't a substantive skeptic. You lack a *scientific* source critiquing methodology, offering alternative explanations (e.g., confounding factors), or downplaying significance ("effect is tiny"). **--> KEEP REPORTING.** Find *one* epidemiologist/gastroenterologist not involved to offer substantive critique/perspective.
      *   ...(You find a skeptic who says "Interesting, but confounding by diet Z is very likely")...
      *   CP2: Context? YES. Skepticism? YES (confounding explained). **--> CAN FILE.**
      *   CP3: Next source? (e.g., Industry rep?) NO (Incremental/counter-spin). **--> STOP REPORTING.**
      *   CP4: Catastrophe? (e.g., Study funded solely by competitor? Major retraction notice?) NO. **--> FILE.**
  *   **Why It's Boring:** Finding that "one skeptic" feels like a chore when the core is clear. But without it (CP2 Skepticism NO), the story risks being a regurgitated press release, misleading readers about certainty. CP2 forces this essential, non-optional step.

  **Situation 3: Where the Machine Can't Save You (The Catastrophe Missed)**
  *   **Story:** Startup claims breakthrough battery tech, 10x capacity.
  *   **Machine Run:** CP0 Min set: Core tech doc, *one* independent battery engineer review, context (current battery limits), skepticism (one expert on challenges). CP1 YES (tech described, limit: "lab scale only"). CP2 YES (Context on market, Skeptic: "Scaling is the real challenge"). CP3 NO (No need for another incremental voice). CP4: Catastrophe? You checked author backgrounds (no *known* fraud), no glaring math errors you spot. **--> FILE.**
  *   **The Uncaught Catastrophe:** The core lab data was fabricated. Your independent engineer reviewed the *description*, not the raw data. You aren't a forensic accountant/data auditor. The fraud was sophisticated and unknown. The machine's CP4 relies on *identifiable* catastrophic risks. It couldn't force you to audit raw data (impossible on deadline). This is bounded rationality in action. No system eliminates this risk entirely.

  **The Takeaway:** This machine forces conscious decisions at defined points using concrete criteria. It stops the endless "one more thing" loop (CP3) while ensuring fundamentals are covered (CP1, CP2). It anchors your minimum (CP0) and controls bar movement. It flags true emergencies (CP4). It replaces guilt with procedure. It accepts that "good enough" (satisficing) is the optimal strategy under deadlines and complexity, not a failure. Run it coldly. File when it says file.
