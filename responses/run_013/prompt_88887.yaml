  ## Bureau of Dispositional Certification (BDC)  
  *Ensuring the World Behaves as Expected Since 1972*  
  **Frequently Asked Questions (FAQ) - Public Guidance**  
  *BDC-PUB/FAQ/003 (Rev. 07-2023)*

  **About this page:**  
  This document provides answers to common queries regarding the Bureau’s certification services for object dispositions (e.g., fragility, solubility, conductivity). For specific case inquiries, submit Form BDC-114/E.  

  ---

  **1. What is the purpose of BDC certification?**  
  BDC certification provides formal verification that an object possesses the disposition claimed by its owner (e.g., "certified fragile," "certified soluble"). Certification requires passing a Standard Manifestation Test (SMT) under controlled conditions. Certified objects receive a tamper-proof seal (Form BDC-45/S) valid for 5 years. Fee: £120 (Standard), £85 (Charitable/NPO).  

  **2. My vase was certified fragile but survived the drop test. Why?**  
  SMTs are conducted under Baseline Environmental Conditions (BEC-7A). Survival may indicate interference (e.g., packaging, atmospheric anomalies). Owners may request a *Conditional Isolation Re-Test* (Form BDC-89/R) where the object is tested in a vacuum chamber with no external mediators. Additional fee: £65. Note: Re-test voids original certification pending outcome (Regulation 8.d.iii).  

  **3. A "soluble" sugar cube failed to dissolve during its SMT. Is certification revoked?**  
  Not necessarily. Undissolved cubes may possess latent solubility masked by external factors (e.g., hydrophobic coating). Submit Form BDC-102/M ("Masking Disclosure Statement") detailing the object’s history. BDC will issue a *Provisional Conditional Certification* (PCC-B) pending a Coating-Neutralization SMT (fee: £110). PCC-B status requires annual renewal.  

  **4. Can BDC detect objects that mimic dispositions they lack?**  
  Yes. Mimicry detection requires Extended Causal History Verification (ECHV), per BDC Procedure 12. Owners must provide:  
  - Proof of categorical basis (e.g., molecular structure diagrams)  
  - Chain of custody from manufacture  
  - Affidavit of Non-Interventional History (Form BDC-77/NIH)  
  ECHV processing fee: £200. *Note: ECHV does not guarantee mimicry detection in quantum-adherent objects (see Case 45-T: *Schrödinger’s Vial*).*  

  **5. What if an object loses its disposition *during* the SMT?**  
  Finks are addressed under Regulation 22 ("Stimulus-Response Integrity Protocol"). Objects exhibiting finkish tendencies undergo:  
  - Pre-Stimulus Disposition Assay (PSDA) using non-triggering probes (e.g., static imaging, gentle airflow).  
  - If PSDA confirms disposition, certification is granted *with Finkish Hazard Endorsement* (FHE). FHE requires disclosure on all labels and a 50% higher certification fee (£180).  
  ^(*Dr. Aris Thot, BDC Staff Philosopher, dissents: "PSDA measures a *different* disposition than the one tested by SMT. The FHE loophole renders certification circular." See Internal Memo 88-J.*)  

  **6. Are certified dispositions guaranteed to manifest?**  
  BDC certification confirms dispositional *possession*, not manifestation. Manifestation depends on:  
  (a) Exact replication of SMT conditions (regulated by BDC Test Code §4.5)  
  (b) Absence of masks, finks, or mimics (see Q2, Q3, Q5)  
  (c) Observer-independent stimulus application (verified by BDC staff).  
  Owners may purchase *Manifestation Assurance Insurance* (Form BDC-155/MAI) from licensed partners.  

  **7. How does BDC handle objects with context-dependent dispositions (e.g., "visible only in blue light")?**  
  Submit Form BDC-133/SC ("Stimulus Customization") to define exact trigger parameters. Testing incurs a £50 surcharge per customized variable. *Certification applies ONLY under specified conditions.*  

  **8. The SMT destroyed my fragile vase. Will BDC compensate me?**  
  No. Certification requires observing manifestation under test conditions. Destruction confirms dispositional validity. Pre-certification waivers (Form BDC-99/W) are mandatory.  

  **9. My soluble cube passed its SMT but dissolved in rain *before* certification. Why?**  
  SMTs are scheduled precisely to avoid premature manifestations. Dissolution prior to testing voids certification eligibility (Regulation 15.a). Reapply after acquiring a new cube. Fee: £120.  

  **10. How does BDC define a "disposition"?**  
  A disposition is a test-verified capacity to manifest specific behavior under defined stimuli, as per the *Standard Conditional Framework* (SCF) in BDC Policy Handbook §1.1:  
  *"Object O has disposition D iff, if O were subjected to stimulus S, O would manifest M."*  
  All certifications adhere to SCF unless overridden by supplemental procedures (Q2–Q7).  

  ---  
  **Need help?** Contact BDC Helpline: 0800 555-DISP (3477)  
  *Office hours: Mon–Thu, 9:00–16:30. Closed for manifestation holidays.*  
  *© Crown Copyright 2023. BDC-PUB/FAQ/003 (Rev. 07-2023) replaces BDC-PUB/FAQ/003 (Rev. 01-2019). Destroy obsolete copies.*  

  ---

  ### Technical Note on the Piece  
  **Liberties Taken:**  
  1.  **Conflation of Terms:** The BDC treats "masking," "mimicking," and "finking" as bureaucratic categories with procedural fixes. Real metaphysics distinguishes these as distinct problems requiring separate theoretical solutions.  
  2.  **Simplified Conditional Analysis:** The SCF (§1.1) is presented as BDC policy, but real conditional analyses (CA) are metaphysical theses, not operational guidelines.  
  3.  **"Certification" as Stand-In:** BDC certification parodies CA’s goal of defining dispositions via stimulus-manifestation conditionals. Real CA doesn’t involve "testing" but conceptual analysis.  

  **On Finks/Masks/Mimics vs. Conditional Analysis:**  
  **Position:** Fink, mask, and mimic cases *do* falsify the simple conditional analysis (SCA) of dispositions.  

  **Reasons:**  
  - **Finks** (e.g., a wire that loses conductivity when current is applied) show that the conditional *"if stimulated, it would manifest"* can be false *even when the disposition is present*. The wire is conductive, but applying current (stimulus) removes conductivity *before* manifestation occurs. SCA incorrectly deems it non-conductive.  
  - **Masks** (e.g., a fragile vase packed in foam) show the conditional can be false *while the disposition is retained*. The vase is fragile, but the conditional ("if dropped, it would break") is false due to the mask. SCA cannot distinguish dispositional possession from manifestation.  
  - **Mimics** (e.g., a non-soluble cube rigged to dissolve) show the conditional can be true *without the disposition*. SCA incorrectly attributes solubility to the mimic.  

  **Confidence Level:** **High (90%)**. While *sophisticated* conditional analyses (e.g., adding "ceteris paribus" clauses, intrinsic bases, or time-indexing) may resist some counterexamples, they become ad hoc or circular (e.g., "O is fragile iff it would break *if its fragility weren’t interfered with*"). The core intuition that dispositions ≠ bare conditionals remains robust. Finks/masks/mimics expose SCA’s fatal flaw: it conflates the manifestation *conditions* with the dispositional *property itself*.  

  **How the Piece Leans on This:**  
  The BDC’s endless forms/fees represent the "patchwork" approach to saving CA. Each procedural fix (PSDA, ECHV, FHE) mirrors a theoretical amendment, revealing the circularity: the Bureau must *presume* dispositional properties to certify them, yet defines them *only* through tests replicating CA. The mimic’s ECHV requires proof of "categorical basis" — hinting that dispositions *reduce* to non-dispositional properties — which is the very thing CA sought to avoid. The piece suggests CA, like the BDC, collapses under its own exceptions.  

  ---  
  *This piece should land perfectly with your reading group while leaving historians politely sipping their wine. Good luck with the diss!*
