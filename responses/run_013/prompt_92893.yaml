  ## Sestina for the Reference Class

  They say my risk resides within my **Family**,
  A shadow cast by kin I barely knew.
  The calculator clicks: it knows my **Habits** –
  Two cups before the dawn, the walk I skip.
  It factors in the cold, hard **Test result**,
  The number flashing on the sterile screen.

  This morning brought another printed **Screen**,
  Advice derived from someone else’s **Family**.
  They don’t account for *this* week’s **Test result**,
  The sleepless nights, the worries I’ve been **through**.
  They see the box unchecked for “Healthy **Habits**”,
  The missing mile I chose again to **skip**.

  But wait – define the group? Why should I **skip**
  The finer grain? Observe the shifting **Screen**:
  A cohort born the same exact **Birth Year**,
  Not bound by blood, not tied to **Family**,
  But random souls whose paths I never **through**.
  Is *that* the source of meaning? **Test result**

  Or circumstance? This blurry **Test result**
  Depends on where the boundary lines we **skip**
  Or draw. The doctor’s form demands a **through**
  Report, a box to tick upon the **Screen**.
  Am I defined by choice, by **Habits**,
  Or just the number tied to **Birth Year**?

  The **Birth Year** group is vast, a faceless **Year**,
  But narrow down? To Tuesday’s **Test result**?
  Post-coffee nerves? Pre-dawn peculiar **Habits**?
  Each cut is arbitrary, hard to **skip**
  The sense that any frame upon the **Screen**
  Excludes the nuance only **Family**

  Might guess. But **Family** itself’s a shifting **through**
  Line, blurred by time. The cold, hard **Birth Year**
  Stands firm. The nurse now taps the waiting **Screen**.
  She needs a number, not my raw **Test result**
  Interpreted by mood. There’s no time left to **skip**
  The choice: which lens defines my future **Habits**?

  The **Spreadsheet** demands data, not my **Habits**' shade,
  The unseen file where unknown clerks assign my **through**.
  It holds a code, perhaps derived from **Birth Year**,
  A silent judge. I feel the options **skip**
  And fade. What tells the tale? The **Test result**,
  My father’s ghost, the lines upon the **Screen**?

  The doctor speaks. The **Screen** shows one clear **Birth Year**.
  My **Family** history, the anxious **Habits** I confess,
  The raw **Test result**... they all **skip** out of view.
  The **Spreadsheet** number wins. What did I just go **through**?
