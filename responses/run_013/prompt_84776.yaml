prompt: |-
  Ok so I'm a junior in political science and I'm taking this constitutional theory seminar this term — we spent two weeks on precommitment, the Ulysses and the Sirens thing Elster made the standard reference for, and then the Waldron objection that a person can tie himself to a mast but a legislature isn't a person and the people it binds never agreed to anything. Honestly I left that class thinking the objection is devestating and also that I have no idea what to do with it. Meanwhile I have a part-time gig at the state legislature's nonpartisan research office, the one that writes the little background memos for members, and my supervisor found out I'm in this seminar and now she wants me to build her something. What she wants: a reusable screening procedure our office can run on any proposal that would bind future officials. She gets these constantly, maybe three or four a month, we have to turn a memo around in about a day, and the members who read it will not read philosophy. The kind of thing that crosses her desk: a charter amendment creating an independent redistricting commission with staggered twelve-year terms; a constitutional amendment requiring a two-thirds vote for any tax increase and another two-thirds vote to repeal it; an automatic trigger that cuts every department's budget by 2% with no vote whenever the rainy-day fund falls under 5% of general revenue; and a rule requiring an agency to get sign-off from a standing advisory panel, members appointed to fixed long terms, before it can revise any of its rules. She signs off on whatever I produce and she's told me it has to be usable by an intern who's been here three weeks.

  So: give me the procedure. Questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and — this is the part I care about most — where it has to stop and hand the thing to a human because it's a values question rather than a fact question, since I think that's actually where the seminar left us. My worry is that I'll just build a machine that launders my own politics: I'm pretty sympathetic to the redistricting commission and to anything that locks in transit or climate spending, and I suspect a good procedure would make at least one of those look bad, so please don't let me off the hook. It should also survive the cases I can't tell apart — a rule that binds for five years versus forever, a rule that only requires a body to consult versus one that requires it to reach a particular outcome, and an emergency where the entire point is that the commitment gets overridden. Then run it on three of the four examples above, showing what each step returns and where it gets stuck, and add a seperate short section on what the procedure can't do at all. One page for the checklist itself; the worked examples can run long.
reasoning: |-
  Okay, the user is a political science junior working part-time at a state legislature's research office. They've been tasked with creating a screening procedure for proposals that bind future officials. This needs to be practical, used by interns, and avoid philosophical complexity. They mentioned specific examples like redistricting commissions and budget triggers. 

  The user's deeper concern is about bias—they worry their own political leanings (support for redistricting commissions, climate spending) might influence the tool. They want a neutral framework that flags problematic bindings objectively. The challenge is balancing academic rigor (Waldron's objection about legislatures not being persons) with real-world usability.

  First, I'll break down the core conflict: precommitment (tying future hands) vs democratic legitimacy (future majorities' right to self-govern). The procedure must identify binding mechanisms without judging their merit—focusing on reversible vs irreversible constraints. 

  Key design principles:
  - **Speed**: 3-4 memos/month, 1-day turnaround. Must use yes/no questions.
  - **Simplicity**: Intern-friendly. Avoid terms like "Ulysses pact."
  - **Bias control**: Isolate factual triggers (e.g., "Does this override require supermajority?") not value judgments.
  - **Red flags**: Focus on irreversibility and override difficulty—Waldron's core concern.

  I sketch a 4-step funnel:
  1. **Binding?** (Does it restrict future options? If no, exit.)
  2. **Reversibility?** (Can a simple majority repeal? If yes, exit—democratic escape hatch exists.)
  3. **Override conditions?** (How hard is bypassing? Quantify hurdles like supermajorities/time delays.)
  4. **Emergency bypass?** (Does it allow crisis overrides? If not, highlight as rigid.)

  For bias control: Step 2 is the critical filter. If reversible by simple majority, it's "democracy-safe"—neutralizing the user's anxiety about favoring pet policies. Example: A redistricting commission with staggered terms fails Step 2 if repeal requires 2/3 vote. The user might support it, but the procedure flags it as binding. 

  Worked examples:
  - **Independent redistricting**: Staggered 12-year terms → Binding (Step 1: Yes). Reversible? If repeal needs 2/3 vote → Step 2: No → Proceed to Step 3 (override difficulty: High). Memo would note: "Future legislatures cannot alter with simple majority." 
  - **Budget trigger**: Automatic 2% cuts → Binding (Step 1). Reversible? Only if legislature votes to suspend—likely simple majority? → Step 2: Yes → Exit. Memo: "Reversible via normal legislation." 
  - **Agency rule panel**: Advisory panel sign-off → Step 1: Yes (binds agency). But if legislature can override panel via statute → Step 2: Yes → Low risk. 

  Limitations section is crucial: The procedure can't assess whether a binding is *desirable* (e.g., "Is gerrymandering bad?"). It only measures *how tightly* it binds. This satisfies the user's fear of "laundering politics"—values are offloaded to lawmakers. 

  Finally, I add "human handoff" points: When a proposal involves trade-offs between short-term stability vs long-term flexibility, or when override mechanisms are ambiguous. There, the memo would state: "Assessment requires weighing policy goals against legislative flexibility." 

  This meets the user's need for a scalable, neutral tool while anchoring it in their constitutional theory seminar—without requiring interns to understand Waldron.
answer: |-
  Here's a reusable screening procedure designed for speed, objectivity, and intern usability. It focuses on **identifying binding mechanisms and assessing their reversibility**, avoiding philosophical debates while flagging democratic legitimacy concerns raised by Waldron.

  **Precommitment Screening Checklist: Binding Future Officials**  
  *(Run sequentially — Stop at first "NO" in Steps 1-3)*

  1.  **BINDING MECHANISM?**  
      *Question:* Does the proposal *limit future officials' policy choices or procedures* compared to current authority?  
      *Sufficient "YES":* Creates a new rule/process future actors *must* follow; removes/transfers existing authority; imposes automatic outcomes; requires approval from a fixed entity.  
      *Stop if "NO" →** "No binding mechanism identified. Proceed with normal analysis."*  
      *Handoff:* Never. This is a factual determination about the proposal's text.

  2.  **SIMPLE MAJORITY REVERSIBILITY?**  
      *Question:* Can a future *legislature* (or equivalent governing body) reverse/override this binding rule *using its ordinary legislative process* (e.g., simple majority vote on a new statute/amendment)?  
      *Sufficient "YES":* Explicit repeal clause; rule is statutory, not constitutional/charter; override requires only a standard legislative vote.  
      *Sufficient "NO":* Rule embedded in constitution/charter requiring supermajority/electorate to amend; transfers power irreversibly; creates "lock-in" (e.g., perpetual contracts, irreversible fund transfers); override requires impossible consensus (e.g., approval by extinct entity).  
      *Stop if "YES" →** "Binding but reversible via ordinary legislative process. Democratic override possible."*  
      *Handoff:* If reversibility is ambiguous (e.g., depends on legal interpretation). *Otherwise, factual.*

  3.  **OVERRIDE FEASIBILITY?** (Only if Step 2 is "NO")  
      *Question:* If reversal requires *more than simple majority*, is the override threshold *explicit, achievable, and timely*?  
      *Sufficient "YES":* Clear supermajority requirement (e.g., 2/3 vote); defined electorate vote; reasonable timeframe for amendment process.  
      *Sufficient "NO":* Requires near-unanimity (e.g., 90% vote); indefinite delay (e.g., commission only reviews every 20 years); approval from an entity designed to be unaccountable or gridlocked.  
      *Stop if "YES" →** "Binding with difficult but explicit override path (Specify: e.g., 2/3 vote)."*  
      *Stop if "NO" →** "Binding with highly improbable or nonexistent democratic override path."*  
      *Handoff:* If override mechanics are vague or feasibility is context-dependent (e.g., "public emergency" definition).

  4.  **EMERGENCY BYPASS?** (Always run if Step 1=YES)  
      *Question:* Does the proposal include a *defined mechanism* for officials to *temporarily suspend* the rule during a *declared emergency/crisis*?  
      *Sufficient "YES":* Explicit suspension clause tied to a formal emergency declaration process.  
      *Sufficient "NO":* No suspension clause; suspension requires same onerous process as repeal.  
      *Output:** Flag: "Includes emergency bypass: YES/NO." (Does NOT stop procedure)*  
      *Handoff:* Never. Factual check.

  **Human Handoff Required For:**  
  *   **Value Judgments:** Assessing the *wisdom* of the policy goal vs. the rigidity of the bind. The procedure only flags *how* binding it is.  
  *   **Contextual Legitimacy:** Evaluating if the bind addresses a specific, demonstrable collective action problem (e.g., time-inconsistency) justifying departure from majoritarian rule.  
  *   **Ambiguous Reversibility/Override:** When the text is unclear about mechanisms or thresholds.  
  *   **Severity Assessment:** Determining if the *degree* of binding (Step 3 output) is *proportionate* to the problem addressed (requires policy/political judgment).  

  ---

  **Worked Examples**

  1.  **Independent Redistricting Commission (Staggered 12-Year Terms)**  
      *   **Step 1:** YES. Limits future legislature's authority to draw districts.  
      *   **Step 2:** Reversible by simple majority? *Likely NO* (Embedded in charter/const., usually requires supermajority/electorate vote to amend/abolish commission or alter terms).  
      *   **Step 3:** Override Feasibility? *Depends*. If repeal requires standard charter amendment (e.g., legislative supermajority + referendum), output: **"Binding with difficult but explicit override path (e.g., 2/3 vote + referendum)."** If repeal requires near-impossible threshold, output **"Binding with highly improbable override."**  
      *   **Step 4:** Emergency Bypass? *Typically NO.* Flag: "NO."  
      *   **Memo Note:** "Significantly binds future legislatures' control over redistricting. Repeal likely requires constitutional/charter amendment process." *Handoff Needed:* Intern would note the Step 3 output. Senior staff/human must contextualize: *Is this level of insulation justified by the problem of gerrymandering?*

  2.  **Automatic 2% Budget Cut Trigger (Rainy-Day Fund <5%)**  
      *   **Step 1:** YES. Imposes an automatic outcome without legislative vote.  
      *   **Step 2:** Reversible by simple majority? *Likely YES*. Legislature can likely pass a statute *before* the trigger date to suspend the cuts, alter the threshold, or replenish the fund using ordinary process. Stop → **"Binding but reversible via ordinary legislative process. Democratic override possible."**  
      *   **Step 4:** Emergency Bypass? *Implicitly YES* via Step 2 (Legislature can act to prevent/counteract). Flag: "Effectively YES (via legislative override)."  
      *   **Memo Note:** "Creates automatic spending reduction trigger. Legislature retains power to prevent or reverse cuts through standard legislation." *No handoff needed for binding assessment.*

  3.  **Agency Rule Revision Requires Standing Advisory Panel Approval**  
      *   **Step 1:** YES. Binds the agency's rulemaking process, requiring external approval.  
      *   **Step 2:** Reversible by simple majority? *Likely YES*. Legislature can likely amend/abolish the approval requirement or the panel itself via statute. Stop → **"Binding but reversible via ordinary legislative process. Democratic override possible."**  
      *   **Step 4:** Emergency Bypass? *Probably NO* (unless statute includes one). Flag: "NO (per proposal text)."  
      *   **Memo Note:** "Requires agency rule changes to secure approval from fixed-term panel. Legislature can modify or eliminate this requirement." *No handoff needed for binding assessment.*

  ---

  **What the Procedure CANNOT Do**

  1.  **Judge Policy Merit:** It cannot determine if locking in transit funding is "good" or locking in a tax cap is "bad." It only assesses the *mechanism* of binding.
  2.  **Resolve Waldron's Objection:** It cannot philosophically justify binding future majorities. It *flags* proposals that *do* bind them severely (Step 3 "NO") but doesn't say if it's *legitimate*. This is the core handoff point.
  3.  **Predict Future Circumstances:** It cannot assess if the bound rule will be disastrous or beneficial decades later.
  4.  **Evaluate "Good Faith" Problems:** It cannot judge if staggered terms are designed genuinely for independence or purely for partisan lock-in.
  5.  **Assess Proportionality:** It identifies the *degree* of binding difficulty but cannot decide if that difficulty is *appropriate* for the stated problem without human judgment.
  6.  **Handle Procedural Ambiguity:** If the proposal text is unclear about reversibility mechanisms, it flags for human review but cannot resolve the ambiguity itself.
  7.  **Account for Political Reality:** A "theoretically possible" override (Step 3 "YES") might be *politically* impossible. The procedure notes the theoretical path; humans must gauge the practical likelihood.

  **Key Output for Memos:** Focus on the **Step Stop Point** and **Step 3 Output** if reached. This tells lawmakers *if* it binds, *how easily* it can be reversed democratically, and *if* emergencies can be handled. The values question ("Is this level of binding justified?") is explicitly left to them. Your procedure provides facts about the *lock*, not an opinion on whether the *box* should be locked.
