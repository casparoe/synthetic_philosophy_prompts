  ## Sestina for the Gathering

  We trace his outline in the empty **chair**,  
  Recount the stubborn tick within his **watch**,  
  How steam would curl above his morning **coffee**,  
  The photograph he kept inside his **sweater**,  
  His pocket warm with crumbs of yesterday's **bread**,  
  That faded picture of the old stone **photograph**.

  We tell again about the chipped **photograph**  
  He'd place beside him on the worn-out **chair**,  
  Insisting it held taste, like crusty **bread**,  
  Though we saw only dust. He'd check his **watch**,  
  Then pull the faded wool of that old **sweater**  
  Tighter, sipping slowly at his **coffee**.

  The chill came sudden, sharp against the **coffee**  
  Steam. We found it later, that same **photograph**,  
  Tucked where he always kept it, near his **sweater**  
  Collar. The silence in that vacant **chair**  
  Was louder than the stopped, thin gold **watch**  
  Beside the cooling cup. No shared warm **bread**.

  Some say he hoarded, hid the freshest **bread**,  
  Let others take the bitter dregs of **coffee**.  
  Some swear the second hand on that cheap **watch**  
  Flew backwards near the end. The **photograph**  
  Shows joy, they claim, though who can tell that **chair**  
  Held more than weariness beneath his **sweater**?

  We disagree about the holey **sweater**:  
  Was mending planned? He seldom ate his **bread**,  
  Just crumbled it. The stillness of the **chair**  
  Now holds the ghost of warmth from his last **coffee**.  
  Was the smile genuine in that cracked **photograph**,  
  Or just a pose timed by a failing **watch**?

  One claims the watch was pawned, a useless **watch**,  
  Its value gone. Another saved the **sweater**,  
  Still smelling faintly like that strong **coffee**.  
  We break the crust, we share the heavy **bread**,  
  Recalling how he'd dunk it in his **coffee**,  
  Staring past us at the empty **chair**.

  This **sweater** holds the shape his shoulders wore.  
  His **watch** stopped when his story ceased to run.  
  We see him in this **photograph** we pass.  
  The **chair** remains, a silent testament.  
  We taste the **bread**, the bitter **coffee** steam  
  Pauses, a shape formed by our telling breath.
