  I host a small podcast about animal welfare science and decision-making under uncertainty, and next month's guest is a philosopher who has spent the last several years arguing that the sheer number of insects makes their welfare the most consequential animal-welfare question we face — not because she thinks insect sentience is especially likely, but because she thinks the arithmetic of a vast population multiplied by a modest probability of sentience swamps every competing consideration. She is scrupulous about the details and, in earlier appearances, has repeatedly deflected objections by insisting that we keep apart "the probability is low" from "the probability is unassigned"; I want questions that do not let that one distinction carry the whole load. Please draft seven or eight interview questions, ordered as I would actually ask them, each followed by a single follow-up keyed to the answer she is most likely to give, phrased so that I can deploy it whichever way she goes. I would like at least one question on the logical form of the scale argument itself — whether it is a straightforward expected-value calculation that needs a determinate probability, or a precautionary argument that is supposed to work precisely when no such probability can be assigned — and at least one on what happens to the argument if sentience comes in degrees rather than being an on/off property, since a graded view seems to invite neuron counts or some other currency as a proxy, and that proxy may not favour insects at all. I also want a question built around a distinction I have been pressing on friends who defend this line: between the census scale of insects (the total number alive) and the leverage scale (the far smaller set whose welfare actually shifts with human choices, such as farmed larvae, pesticide-exposed colonies, or captive-bred research populations). If she concedes the leverage scale is many orders of magnitude smaller than the census scale, I want to know whether the