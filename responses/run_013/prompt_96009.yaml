  2. **Main Question:** You emphasize distinguishing "low probability" from "unassigned probability." But if sentience isn’t binary and comes in degrees—say, tied to neural complexity—couldn’t a graded view diminish insects’ moral weight? For example, if vertebrates have 1,000× the welfare capacity per individual, might their smaller populations still dominate the calculus?  
     **Follow-up (any answer):** Does this force us to abandon population-scale arithmetic altogether, and instead prioritize proxies like neuron counts? If not, how do we integrate degrees of sentience without undermining insects’ priority?  

  3. **Main Question:** I’ve argued that the *leverage scale*—insects humans directly affect, like farmed larvae or pesticide victims—is orders of magnitude smaller than the *census scale* of all insects. If we accept this, does your argument still hold? Or is the moral arithmetic strictly about total numbers, irrespective of influence?  
     **Follow-up (if she concedes leverage is smaller):** With leverage so reduced, wouldn’t vertebrates—where human impact is far greater—reclaim priority?  
     **Follow-up (if she resists the distinction):** Where exactly *does* the moral arithmetic apply: to the entire census, or only to units we can influence? And how do we assign obligation to beings we can’t affect?  

  4. **Main Question:** Your model resembles "Pascal’s Mugging" cases—tiny probabilities × vast stakes—which many dismiss as fanatical (e.g., diverting all resources to avert astronomically unlikely doomsdays). What structural feature protects your argument from that critique?  
     **Follow-up (any answer):** Does this feature imply a minimum probability threshold for seriousness? If so, how do we set it without undermining the "unassigned probability" defense?  

  5. **Main Question:** The scale argument seems asymmetric: stronger for *avoiding harm* (e.g., not farming insects) than *conferring benefits* (e.g., aiding wild insects). Is this asymmetry inherent? And does it imply that reducing insect populations could be a moral priority?  
     **Follow-up (any answer):** If harm reduction dominates, wouldn’t policies like habitat preservation—which may increase insect suffering—become suspect?  

  6. **Main Question:** What empirical finding would significantly raise or lower your probability of insect sentience? And if the probability remains unassigned, would you support a "cheap-only precaution" policy—acting only when costs are negligible?  
     **Follow-up (any answer):** If cheap precautions suffice, doesn’t that reduce the scale argument to standard caution, rather than justifying insect-focused urgency?  

  7. **Main Question:** What evidence could definitively undermine your view? For instance, conclusive proof that insects lack subjective experience, or a leverage-scale analysis showing vertebrates dominate?  
