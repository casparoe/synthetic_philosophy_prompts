  ### Interview Questions

  1. **Main Question:** Your core argument rests on multiplying the vast census of insects by a modest probability of sentience, yielding overwhelming moral weight. Could you clarify how this arithmetic functions when we lack even a rough probability estimate—is it strictly an expected-value calculation, or a precautionary principle that bypasses precise probabilities?  
