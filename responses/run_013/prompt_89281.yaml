prompt: |-
  I need a philosopher of science who actually knows Lakatos in the weeds, not just the research-programs slogan. Here's the setup. A friend of mine is a historian of science and she's constantly handing down verdicts -- progressive or degenerating -- on research programs. Her track record: Newtonian gravity after Neptune turned up right where the theory said it would -- progressive. The ether theorists bolting on the Lorentz-Fitzgerald contraction to save the aether, with nothing new falling out of it -- degenerating. Ptolemy piling epicycles on epicycles -- degenerating. But also the early Bohr atom, stitched together out of old assumptions and patched to fit the spectral lines, yet predicting lines nobody had measured, which then showed up -- progressive.

  Now the new case she has to rule on. A group has a model that fits a bunch of existing data; a new experiment turns up a bump it can't explain; so they add a new particle, and the only reason they add it is to soak up that bump. But the way they've set the particle up, it also entails a distinctive signal at a different experiment nobody has run yet. Nothing's confirmed, and the addition looks alot like the aether patch.

  What's she going to say, and which rule is she actually running? Start by brainstorming the candidate rules her whole list is compatible with, then work out what each one predicts for the new case, then commit to your best guess with reasons. Also tell me which other rules fit her past verdicts just as well, and which further case would best split them apart. Think it through carefully before you land.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They need a deep dive into Lakatos's philosophy of science, specifically how to judge research programs as progressive or degenerating. The user's friend, a historian of science, has been applying these labels to historical cases, and now there's a new scenario to evaluate. The challenge is to figure out which implicit rules she's using based on her past verdicts and apply them to the new case.

  First, I need to recall Lakatos's core ideas. He moves beyond Popper's falsification by introducing research programs with a hard core and protective belt. Progress isn't just about one-off predictions but sustained theoretical and empirical growth. The key is whether modifications lead to novel predictions or just defend the core. 

  Looking at her past judgments: Newton predicting Neptune's position is progressive because it's a novel prediction confirmed. Lorentz-Fitzgerald contraction is degenerating because it only explained away the Michelson-Morley result without new predictions. Ptolemy adding epicycles is similar—no new insights. Bohr's atom model, despite being patched, predicted unknown spectral lines, making it progressive.

  Now the new case: a model adds a particle to explain an anomaly, but this particle also predicts a new signal in an unrun experiment. It's like the aether patch but with a potential novel prediction. So the question is whether this prediction is substantive enough to make it progressive.

  The user wants me to brainstorm candidate rules that fit her past verdicts. Let me list possible criteria she might be using:

  1. **Strict Novelty**: Does the change predict something entirely new and previously unknown? Neptune was new, Lorentz's contraction wasn't. Bohr's spectral lines were new. Ptolemy added epicycles without new predictions.

  2. **Riskiness**: Is the prediction risky? Meaning, if it fails, it could falsify the theory. Newton's prediction was risky; if Neptune wasn't there, it would hurt the theory. Lorentz's adjustment didn't take such risks.

  3. **Explanatory Depth**: Does the adjustment deepen understanding or just save the theory? Bohr provided a mechanism for spectral lines, while Lorentz didn't add new understanding.

  4. **Ad-hocness**: How much is the change tailored only to the anomaly without broader implications? Lakatos distinguishes ad hoc1 (no testability), ad hoc2 (testable but no new content), and ad hoc3 (new content). Her judgments seem to align with ad hoc3 as the threshold for progress.

  Next, testing these rules against her verdicts:

  - **Rule A (Novel Confirmation)**: Requires confirmed novel predictions. Fits Newton (Neptune confirmed) and Bohr (spectral lines confirmed). Lorentz had no such prediction, Ptolemy either. But what about unconfirmed predictions? The new case has an unconfirmed prediction. If she requires confirmation, this rule would say "degenerating" for the new case.

  - **Rule B (Novel Predictiveness)**: Focuses on generating new, testable predictions, even unconfirmed. Fits Newton, Bohr, and now the new case could be progressive since there's a distinctive signal predicted. Lorentz and Ptolemy didn't offer new testable predictions.

  - **Rule C (Riskiness)**: The prediction must be falsifiable and non-trivial. Newton and Bohr had risky predictions; Lorentz didn't. The new case's prediction is falsifiable, so possibly progressive.

  - **Rule D (Mechanism/Depth)**: Adds explanatory depth. Bohr explained spectral lines via quantum leaps, while Lorentz didn't add depth. The new particle might not add depth if it's just a plug-in.

  Her verdicts fit Rules B and C best. Newton and Bohr had novel predictions (B) and were risky (C). Lorentz and Ptolemy lacked both. Rule A might be too strict because Bohr was progressive even before confirmation? Wait, she said Bohr predicted lines "which then showed up," so confirmation happened. But in the new case, the prediction isn't confirmed yet. So if she requires confirmation, Rule A would call it degenerating. But her labeling of Bohr as progressive might include the prediction's existence before confirmation. That points more to Rule B.

  Now the new case: adding a particle for an anomaly, but it predicts a new signal. If she uses Rule B, it's progressive because of the novel prediction. Rule C also fits if the prediction is risky. Rule D might not apply if no new mechanism is offered. 

  But the user mentions the addition looks like the aether patch. The key difference is the novel prediction. So probably Rule B is her main criterion. 

  Which rules fit equally? Rule B (novel predictiveness) and Rule C (riskiness) both fit her past cases. To split them, a scenario where a theory makes a novel prediction but it's not risky. For example, predicting something already expected or easily adjustable. If a theory predicts a phenomenon that's already suspected, it's not risky. If she calls it degenerating, she values riskiness (Rule C). If progressive, then just predictiveness (Rule B).

  In the new case, if the distinctive signal is highly specific and falsifiable, it's likely risky. So she'd probably call it progressive. But if the signal is vague or could be tweaked, that might be degenerating. The user states the signal is "distinctive," implying it's testable and risky. So my best guess is she applies Rule B and labels it progressive.

  Further, Lakatos emphasizes that a program can be progressive even with some ad-hoc adjustments if they lead to new content. The particle addition, by predicting a new signal, is non-ad-hoc in Lakatos's terms (ad hoc3). 

  So, committing: She'll say progressive. Rule B is her main criterion. The Lorentz case lacked any new predictions, while Bohr and the new case have them.
answer: |-
  Based on a meticulous analysis of Lakatos's methodology of scientific research programmes (MSRP) and your friend's historical verdicts, here's a step-by-step reasoning. I'll brainstorm candidate rules compatible with her judgments, apply them to the new case, commit to a best guess, identify equally fitting rules, and propose a decisive test case.

  ---

  ### **Step 1: Brainstorming Candidate Rules from Her Verdicts**
  Her cases reveal a pattern. Lakatos defines a programme as **progressive** if it predicts *novel facts* (not just accommodating known data) and **degenerating** if it only defends its core with ad hoc patches. Her judgments hinge on whether modifications yield *new, testable predictions*. I derive four candidate rules:

  1. **Rule A (Novel Confirmation Requirement)**  
     *Progressive iff* the modification leads to a *confirmed* novel prediction.  
     - Newton: Neptune's discovery confirmed a novel prediction → Progressive.  
     - Bohr: Predicted unmeasured spectral lines, later confirmed → Progressive.  
     - Lorentz/Ptolemy: No novel predictions confirmed → Degenerating.  

  2. **Rule B (Novel Predictiveness Requirement)**  
     *Progressive iff* the modification generates *any testable novel prediction* (even unconfirmed).  
     - Newton/Bohr: Generated novel predictions (confirmed later) → Progressive.  
     - Lorentz/Ptolemy: No novel predictions → Degenerating.  

  3. **Rule C (Riskiness Requirement)**  
     *Progressive iff* the modification makes a *risky prediction* (i.e., failure would falsify the theory).  
     - Newton: Neptune prediction was risky (failure = refutation) → Progressive.  
     - Bohr: New spectral lines were risky → Progressive.  
     - Lorentz: Contraction was adjustable to any data (non-risky) → Degenerating.  
     - Ptolemy: Epicycles were endlessly flexible → Degenerating.  

  4. **Rule D (Explanatory Depth/Mechanism Requirement)**  
     *Progressive iff* the modification provides *new explanatory mechanisms*, not just data-fitting.  
     - Bohr: Quantum leaps explained spectral lines → Progressive.  
     - Lorentz: Contraction was purely mathematical → Degenerating.  
     - Newton: Gravity mechanism unchanged, but prediction novel → Progressive (shows Rule D isn't necessary).  

  ---

  ### **Step 2: Applying Rules to the New Case**
  - **Scenario Recap**: A particle is added solely to explain an anomaly ("soak up the bump"), but it *entails a distinctive unconfirmed signal* at another experiment.  
    - Similar to Lorentz: Motivated by anomaly, initially ad hoc.  
    - Unlike Lorentz: Generates a novel prediction (the "distinctive signal").  

  | Rule              | Prediction for New Case                               | Why?                                                                 |
  |-------------------|-------------------------------------------------------|----------------------------------------------------------------------|
  | **Rule A (Novel Confirmation)** | **Degenerating** | Novel prediction exists but *unconfirmed*. Lorentz parallel.        |
  | **Rule B (Novel Predictiveness)** | **Progressive**   | Novel prediction is testable (even unconfirmed). Bohr parallel.     |
  | **Rule C (Riskiness)**         | **Progressive**   | Prediction is "distinctive" → likely falsifiable/risky. Newton parallel. |
  | **Rule D (Mechanism)**         | **Degenerating?** | Particle may lack deeper mechanism (just "soaks up" anomaly).       |

  ---

  ### **Step 3: Best Guess & Reasons**
  - **Verdict for New Case**: **Progressive**  
  - **Rule She’s Using**: **Rule B (Novel Predictiveness)**  
    - **Reasons**:  
      1. Her Bohr verdict is decisive: Bohr was "stitched together" and ad hoc *until* it predicted new spectral lines. She labels it progressive *based on the prediction alone*, not its later confirmation (though confirmation followed). Similarly, the new particle’s "distinctive signal" is a testable novel prediction.  
      2. Lorentz lacked *any* novel prediction → degenerating. The new case differs critically by generating a prediction.  
      3. Newton fits Rule B: Prediction existed before confirmation.  
      4. Lakatos’s core criterion is *heuristic progress*: "A research programme is progressive if it leads to novel predictions" (*Proofs and Refutations*, 1976). Confirmation strengthens progress but isn’t required for the label.  

  - **Why Not Other Rules?**  
    - Rule A (confirmation) would make Bohr "degenerating" until lines were found, but she called it progressive early.  
    - Rule C (riskiness) fits but is redundant: Novel predictions in science are inherently risky.  
    - Rule D (mechanism) is too strict: Newton’s gravity had no mechanism for action-at-a-distance, yet she deemed it progressive.  

  ---

  ### **Step 4: Equally Fitting Rules & A Splitting Case**
  - **Rules Equally Compatible with Past Verdicts**:  
    Rules B (Novel Predictiveness) and C (Riskiness) *both* fit all her past cases perfectly.  
    - Newton/Bohr: Novel *and* risky predictions.  
    - Lorentz/Ptolemy: No predictions → non-risky.  

  - **Splitting Case to Distinguish Them**:  
    Propose a scenario: **A theory adds an ad hoc parameter to fit an anomaly. This parameter predicts a novel phenomenon, but it’s vague/untestable (e.g., "dark sector effects" with no specific signature).**  
    - **Rule B (Predictiveness)**: Degenerating (prediction not testable → no novel *fact*).  
    - **Rule C (Riskiness)**: Degenerating (prediction not falsifiable → non-risky).  
    - *Result? Both rules agree.*  

    **True Splitting Case**: **A theory predicts a novel phenomenon that is testable but *low-risk* (e.g., predicting a particle with properties already implied by rival theories, so failure wouldn’t falsify the core).**  
    - Example: 1970s "charm quark" prediction. It was novel and testable, but its absence wouldn’t have killed the quark model (alternatives existed).  
    - **Rule B (Predictiveness)**: Progressive (novel prediction exists).  
    - **Rule C (Riskiness)**: Degenerating (prediction isn’t critical to the core’s survival).  
    - *Her verdict here would split the rules.* If she calls it progressive, she uses Rule B; if degenerating, Rule C.  

  ---

  ### **Conclusion: Lakatos in the Weeds**
  Your friend is likely applying **Rule B (Novel Predictiveness)**, consistent with Lakatos’s emphasis on *heuristic progress* over immediate confirmation. The new particle case is **progressive** because it generates a testable novel prediction ("distinctive signal"), mirroring Bohr’s triumph. Lorentz failed this test; this succeeds.  

  **Lakatosian Nuance**: The particle addition *is* ad hoc in motivation (like Lorentz), but Lakatos distinguishes *ad hoc₁* (untestable), *ad hoc₂* (testable but no excess content), and *ad hoc₃* (testable with excess content). Only ad hoc₃ is acceptable. Here, the "distinctive signal" provides *excess content*, making it non-ad hoc in the Lakatosian sense.  

  **Recommendation**: Ask your friend about a case like the low-risk charm quark prediction. If she labels it progressive, Rule B is confirmed; if degenerating, she’s weighting riskiness (Rule C). But given her Bohr verdict, Rule B is the strongest bet.
