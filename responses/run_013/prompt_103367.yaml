prompt: |-
  I've been reading Hobbes for a seminar and I've got this argument that seems to prove too much and I cant find the exit. A friend built it and now I half believe it. It goes:

  (1) We have certain knowledge of something only if we know its causes.
  (2) We know the causes of things we make ourselves.
  (3) In geometry, we make the objects: we define the terms, draw the figures, construct the proofs.
  (4) So geometry is a paradigm of certain knowledge.
  (5) In politics, we also make the object: the commonwealth is constituted by our covenants, our authorization, our willing it into being.
  (6) So politics is also certain knowledge — maybe more certain than geometry, since the commonwealth is more completely our artifact than any triangle.
  (7) But politics is the most disputed, uncertain, backbiting domain there is, and if we make it were enough, then any made-up game or novel would be a science too.
  (8) So one of (1)-(6) is false.

  I'd rather keep (3) and (4): I think geometry really is the model of certainty, and I think Hobbes is onto something about why. But I cant see where the argument cheats. Is one of the premises just false, or is theres a slip between two of them? A friend says the fix is to say we're makers in geometry but only participants in politics. Is that distinction real or just relabeling? Which premise should I give up, and what does giving it up cost me elsewhere? If you tell me to reject (2), do I lose the explanation of geometry's specialness? If I reject (5), am I saying the commonwealth isn't made by us at all, and can I say that without turning Hobbes into a Platonist about politics? Also tell me how confident you are in your diagnosis and which step you're least sure about.
reasoning: |-
  Okay, let's tackle this Hobbesian puzzle. The user presents a tight logical argument that seems to make politics as certain as geometry—which clearly contradicts reality. They're stuck between wanting to preserve geometry's certainty (premises 3-4) while explaining why politics isn't certain despite similar "maker's knowledge" claims (premise 5). 

  First, I notice the user is philosophically sophisticated—they recognize giving up any premise has domino effects. Rejecting (2) might undermine Hobbes' theory of geometric certainty; rejecting (5) risks making the commonwealth a Platonic form. Their friend's "participant vs maker" distinction feels like a band-aid. 

  Hmm... the core tension is between creation and control. When Hobbes says we "make" geometric objects, we control every variable: definitions are airtight, constructions follow rules rigidly. But in politics? We "make" the commonwealth via covenants, yet our control is partial and ongoing. The sovereign might defy logic; citizens reinterpret covenants daily. This isn't failure of making—it's failure of precision and constraint. 

  *Lightbulb moment*: Premise (1) is sneakily demanding. "Knowing causes" in geometry means deductive necessity (if A+B=C, then C-B=A). In politics, "knowing causes" means messy human intentions—which are never fully transparent, even to ourselves. So premise (5) equivocates: yes, we "make" both, but "cause" means something radically different in each context. 

  I'm 85% confident this is the crack. The user can keep Hobbes' maker-knowledge without Platonism by stressing: politics has causes we create but cannot perfectly isolate or measure. Geometry's certainty comes from eliminating the human variable; politics drowns in it. 

  Least certain step? Premise (2). Maybe we don't fully "know" even self-made things—e.g., an author might not grasp their novel's deeper causes. But that's a nuclear option; better to fix the "cause" ambiguity first.
answer: |-
  Your friend's argument is clever but contains a critical equivocation. The flaw lies in **premise (5)**, specifically how "make" is used differently in geometry vs. politics. Here's the breakdown:

  ### Diagnosis & Solution  
  1. **Premise (5) is False (in the required sense)**:  
     - In geometry, we **fully control** the object's properties *by definition*. A "triangle" has no existence outside our axiomatic system. We stipulate its essence (e.g., "three-sided polygon"), and its behavior is logically necessitated.  
     - In politics, we **initiate** the commonwealth via covenants, but we do **not** control its subsequent properties or dynamics. Human passions, unintended consequences, interpretation of laws, and power struggles introduce contingency. The commonwealth is a *dynamic human practice*, not a static definition.  

     ➠ **Hobbes' Point vs. Reality**: Hobbes *claims* politics can be as certain as geometry because we "make" the state (Leviathan, Introduction). But your step (7) exposes the flaw: politics is uncertain precisely because we *don't* control it like geometers control triangles.  

  2. **Why Other Premises Hold (and Why Rejecting (5) Works)**:  
     - **Keep (1)-(4)**: Geometry's certainty *does* stem from maker's knowledge (e.g., Hobbes' view in *De Corpore*). We grasp causes because we impose them.  
     - **Keep (6) as Hobbes' Aspiration, Not Reality**: Hobbes *wanted* politics to be certain like geometry, but his own empirical observations (e.g., civil war) contradict this. Step (6) is false because (5) is false in the *strong sense* needed.  
     - **Reject the Friend's "Participant vs. Maker" Distinction**: This is vague relabeling. The key is **degree of control**. We are *makers* in geometry (full control) but *constrained co-agents* in politics (partial control).  

  ### What Giving Up (5) Costs (Minimal)  
  - **No Platonism Required**: You can still hold that the commonwealth is human-made without claiming it's *certainly knowable*. Hobbes is clear: the state is an artifact *("art goes yet further, imitating that rational and most excellent work of nature, man")*. But artifacts can be unstable (e.g., a poorly built chair).  
  - **Preserves Geometry's Specialness**: Geometry's certainty comes from **closure under stipulation**. Politics lacks this because its "material" (humans) resists full control. We make the *framework*, not the *outcomes*.  

  ### Confidence & Uncertainties  
  - **Confidence: 90%**. The equivocation on "make" is the clear flaw. Compare:  
    - Geometry: Making = *defining into existence with necessary properties*.  
    - Politics: Making = *initiating a process with emergent, contingent properties*.  
  - **Least Confident Step: Premise (2)**. *Do* we always know the causes of things we make? (e.g., "Do I *truly* know the causes of a novel I write?"). But this is minor—Hobbes grants (2) for geometry, and rejecting it would undermine his epistemology more than needed.  

  ### Why the Argument "Proves Too Much"  
  It conflates **creation** with **predictive control**. If "making" politics granted certainty, then designing a rules-based game *would* make it a "science"—but only if all players adhered perfectly to rules. Politics fails because humans *don't* conform to stipulations like geometric objects do.  

  ### Hobbes' Escape Hatch?  
  Hobbes might reply that politics *would* be certain if humans were perfectly rational (as his "laws of nature" assume). But step (7) refutes this: even with covenants, politics is disputed *because* humans are passionate and self-interested. Geometry abstracts away this messiness; politics cannot.  

  **Conclusion**: Reject **premise (5)** as stated. We "make" the commonwealth only in a weak, initiatory sense—not with the full control and necessity of geometric construction. This preserves Hobbes' insight about geometry while explaining why politics resists certainty. No Platonism required; just a recognition of human contingency.
