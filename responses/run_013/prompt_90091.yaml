  Description: A person is touching a berry.
  Utterance: "Kupu kino"
  Held true: Yes

  Scene 12:
  Description: A person is touching a rabbit.
  Utterance: "Gavagai kino"
  Held true: No   (i.e., held false)

  Hidden Key (Manual A):
  - "gavagai": rabbit
  - "kupu": berry
  - "tino": big
  - "iti": small
  - "roto": inside
  - "waho": outside
  - "kino": deadly

  Systematic Permutation (Manual B):
  - "gavagai": animal
  - "kupu": plant
  - "tino": large
  - "iti": small
  - "roto": enclosed
  - "waho": free
  - "kino": dangerous

  Held-out scenes for betting (without the held-true/false initially; these will be revealed after bets are placed):

  Held-out 1: 
     Description: A small rabbit inside a cage.
     Utterance: "Gavagai iti roto"

  Held-out 2:
     Description: A person touching a small berry.
     Utterance: "Kupu iti kino"

  Held-out 3:
     Description: A big rabbit outside a cage.
     Utterance: "Gavagai tino waho"

  Answers (for the informant in live phase and for the betting):
     Held-out 1: Held true
     Held-out 2: Held true
     Held-out 3: Held true

  Template for creating other packets:
  - Choose a false belief (e.g., a harmless object considered dangerous, a false astronomical belief, etc.).
  - Choose a systematic permutation (e.g., swap two categories, or reinterpret a word at a different level of abstraction).
  - Design 12 scenes that are consistent with both manuals (if you are including underdetermination) and also include the false belief.
  - Create 3 held-out scenes.

  Rules for the Game:

  Phase 1: Static Data (35 minutes)
  - Pairs work with their field log (12 scenes) to build a manual (dictionary and grammar rules if any) and note any false beliefs.
  - They record their manual on a worksheet.
  - After 25 minutes, the instructor gives them the 3 held-out scenes (without the held-true/false indication).
  - Each team bets tokens on each held-out scene: they predict held-true or held-false and bet 0, 1, or 2 tokens.
  - The instructor then reveals the truth values and they settle the bets.

  Phase 2: Live Interaction (20 minutes)
  - Each pair splits: one becomes the informant (with the hidden key for their own packet) and one remains the interpreter.
  - The informant moves to another pair's table. The interpreter at that table now works with the new informant (who speaks the language of the informant's original packet).
  - The interpreter can describe new situations (using simple drawings or descriptions) and ask the informant: "If I say [utterance], would you hold it true in this situation?" 
    But note: the interpreter doesn't know the utterances. So they must use the words they are trying to learn. Alternatively, they can point to the words in their worksheet? But they haven't learned yet.

  Revised live interaction:
  - The interpreter describes a situation (using the same type of descriptions as in the log) and then proposes an utterance (by composing words from the vocabulary they are building) and asks if that utterance would be held true in that situation.
  - But they don't know the vocabulary yet. So it's better to allow them to use the scenes from the log as a starting point.

  Alternatively, the interpreter can show a scene (description) and ask the informant to produce the utterance they would use. But the informant is only allowed to produce the utterance and then the interpreter must ask if a particular sentence is held true? This is messy.

  Better: 
  - The interpreter describes a situation and asks the informant: "What would you say in this situation?" The informant says the Tessik utterance.
  - Then the interpreter can ask: "In [another situation], would you say the same thing?" but that doesn't directly give held-true.

  Alternatively, we can stick to the held-true protocol:

  - The interpreter describes a situation and then says a Tessik sentence (from the ones they have heard or composed). The informant then says whether they would hold that sentence true in that situation (only "yes" or "no").

  But the interpreter doesn't know the words, so they might compose a sentence that is not grammatical or uses words incorrectly. The informant should answer based on the hidden key.

  Example: 
     Interpreter: "A rabbit is present. I say 'Gavagai'. True?"
     Informant: "Yes"

     Interpreter: "A berry is present. I say 'Gavagai'. True?"
     Informant: "No"

  This way, the interpreter can test hypotheses.

  So the live phase is:
  - The interpreter can ask up to 10 such questions (or as many as time allows).
  - Then, they get 3 held-out scenes for this new language (from the informant's packet) and bet tokens on the held-true/false.

  Debrief (20 minutes):
  1. Ask: What happened? What was hard?
  2. Did anyone notice they had to assume beliefs to assign meanings?
  3. Did anyone come up with a manual that worked but was different from another team's?
  4. Reveal the two traps: false belief and systematic permutation, and relate to Davidson:
     - The only evidence is holding sentences true in situations.
     - Charity: we must assume the speaker is mostly right, but sometimes we attribute a false belief to preserve meaning.
     - Holism: the manual is a whole system; you can't assign meaning piece by piece.
     - Underdetermination: multiple manuals fit the data.
  5. What the activity doesn't capture: 
     - The role of truth conditions and compositionality in Davidson (we simplified the language).
     - The vastness of the web of belief and meaning.
     - The principle of charity as a general constraint.
     - We used simple discrete scenes; in reality, situations are more complex.

  Potential issues:
  - Students may think it's a code-breaking exercise with a unique solution. We can't prevent that without giving away the underdetermination. In the debrief, we reveal that multiple solutions are possible and that's the point.

  Timeline Recap:
  - 0-5 min: Introduction
  - 5-40 min: Phase 1 (35 min work + betting)
  - 40-60 min: Phase 2 (20 min live interaction)
  - 60-80 min: Debrief

  We might run over in Phase 1, so adjust as needed.

  Materials List for One Packet:
  - Field log (12 scenes)
  - Worksheet for manual and beliefs
  - 3 held-out scenes (for betting in Phase 1)
  - Hidden key (for the instructor and for the informant in Phase 2)
  - Tokens (10 per team)

  For the whole class: 7 packets, each with a different false belief and permutation.

  This design should meet the goals.
answer: |-
  ### Radical Interpretation Game: The Tessik Challenge  
  **Objective:** Students experience the interdependence of belief and meaning through hands-on translation, encountering underdetermination and the necessity of holistic interpretation—without any prior Davidsonian terminology.  

  ---

  ### **Game Structure & Rules**  
  **Total Time:** 80 minutes  
  **Roles:**  
  - **Field Linguists (Pairs):** Decode the Tessik language using observed scenes.  
  - **Tessik Informant (Phase 2, played by a student):** Answers *only* "yes" (held-true) or "no" (held-false) to questions about new scenes.  

  **Materials per Packet (7 unique packets needed):**  
  1. **Field Log:** 12 scenes (drawings + descriptions) with utterances and held-true/false labels.  
  2. **Blank Manual Worksheet:** For recording translations.  
  3. **Betting Tokens:** 10 tokens per team.  
  4. **Held-Out Scenes (Phase 1):** 3 new scenes *without* truth values.  
  5. **Live Test Scenes (Phase 2):** 3 new scenes for informant questioning.  
  6. **Hidden Key:** The "intended" manual and Tessik beliefs (for informant/instructor only).  

  **Scoring:**  
  - Tokens are wagered on predictions (0–2 tokens per bet).  
  - **Correct prediction:** Win double the tokens bet.  
  - **Incorrect prediction:** Lose wagered tokens.  
  - **Winning:** Team with most tokens after both phases wins.  

  ---

  ### **Timeline**  
  | **Phase**             | **Time** | **Activity** |  
  |------------------------|----------|--------------|  
  | **Introduction**       | 0–5 min  | Explain: "You’re field linguists. Use Tessik scenes to build a translation manual. Bet tokens on new scenes. No talking to other teams." |  
  | **Phase 1: Static Data** | 5–40 min | Teams analyze 12 scenes, build manual, bet tokens on 3 held-out scenes. |  
  | **Phase 2: Live Test** | 40–60 min | Split roles: 1 informant (uses hidden key) per pair. Informants rotate to new teams. Interpreters ask "held-true?" for live scenes. Bet tokens. |  
  | **Debrief**            | 60–80 min | Discuss struggles, reveal traps, connect to Davidson. |  

  ---

  ### **Sample Packet: "Tessik Packet A"**  
  *(Photocopy this packet for one team; create 6 variants using the template.)*  

  #### **Field Log (12 Scenes)**  
  *Each scene includes a simple stick-figure drawing + description. Key: ✓ = held-true, ✗ = held-false.*  
  1. **Scene:** Rabbit hopping.  
     **Utterance:** "Gavagai" → **✓**  
  2. **Scene:** Berry on a bush.  
     **Utterance:** "Kupu" → **✓**  
  3. **Scene:** Large rabbit.  
     **Utterance:** "Gavagai tino" → **✓**  
  4. **Scene:** Small rabbit.  
     **Utterance:** "Gavagai iti" → **✓**  
  5. **Scene:** Rabbit inside cage.  
     **Utterance:** "Gavagai roto" → **✓**  
  6. **Scene:** Rabbit outside cage.  
     **Utterance:** "Gavagai waho" → **✓**  
  7. **Scene:** Large berry.  
     **Utterance:** "Kupu tino" → **✓**  
  8. **Scene:** Small berry.  
     **Utterance:** "Kupu iti" → **✓**  
  9. **Scene:** Berry inside box.  
     **Utterance:** "Kupu roto" → **✓**  
  10. **Scene:** Berry outside box.  
      **Utterance:** "Kupu waho" → **✓**  
  11. **Scene:** Child touching berry.  
      **Utterance:** "Kupu kino" → **✓**  
  12. **Scene:** Child touching rabbit.  
      **Utterance:** "Gavagai kino" → **✗**  

  #### **Held-Out Scenes (Phase 1 Betting)**  
  *Teams bet on these *before* truth values are revealed.*  
  1. Small rabbit inside cage: "Gavagai iti roto" → ?  
  2. Child touching small berry: "Kupu iti kino" → ?  
  3. Large rabbit outside: "Gavagai tino waho" → ?  

  #### **Live Test Scenes (Phase 2)**  
  *For informants to answer during rotation:*  
  1. Berry inside cage: "Kupu roto" → ?  
  2. Child touching large rabbit: "Gavagai tino kino" → ?  
  3. Small berry outside: "Kupu iti waho" → ?  

  ---

  ### **Hidden Key & Traps**  
  **Tessik Beliefs:**  
  - Harmless berry ("kupu") is believed to be **deadly** (false belief).  
  - Rabbit ("gavagai") is harmless (true belief).  

  **Manual A (Intended):**  
  - "gavagai" = rabbit  
  - "kupu" = berry  
  - "tino" = big  
  - "iti" = small  
  - "roto" = inside  
  - "waho" = outside  
  - "kino" = deadly  

  **Manual B (Permuted - Fits all 12 scenes):**  
  - "gavagai" = animal  
  - "kupu" = plant  
  - "tino" = large  
  - "iti" = small  
  - "roto" = enclosed  
  - "waho" = free  
  - "kino" = dangerous  

  **Trap Explanations:**  
  - **False Belief Trap:** If linguists assume Tessik share our belief (berry is safe), they’ll mistranslate "kino" (e.g., as "red" or "round").  
  - **Permutation Trap:** Manuals A/B are empirically identical—both fit all scenes. Teams may build either.  

  **Held-Out Answers:**  
  1. ✓ (both manuals)  
  2. ✓ (both manuals; Tessik believe berry is deadly/dangerous)  
  3. ✓ (both manuals)  

  **Live Test Answers (for informant):**  
  1. ✓ (berry inside cage)  
  2. ✗ (Tessik don’t believe rabbits are deadly)  
  3. ✓ (small berry outside)  

  ---

  ### **Template for New Packets**  
  Create 6 variants by altering the false belief and permutation:  
  1. **Choose a false belief:**  
     - Sun orbits Earth → Affects astronomical terms.  
     - Old man controls rain → Affects weather/action verbs.  
     - Specific bird is sacred → Affects animal/ritual terms.  
  2. **Choose a permutation:**  
     - Swap "east/west".  
     - Reinterpret "not" as "very".  
     - Redefine "hunt" as "follow".  
  3. **Design scenes:**  
     - 8–10 scenes reinforcing core vocabulary.  
     - 2–4 scenes triggering the false belief (e.g., sacred bird = ✗ when touched).  
     - Ensure permuted manual fits all scenes (e.g., if "east" and "west" are swapped, scenes must not disambiguate).  
  4. **Held-Out/Live Scenes:**  
     - Use core vocabulary to test beliefs/permutation. Avoid scenes that break underdetermination.  

  ---

  ### **Predicted Challenges & Debrief Strategy**  
  **What Will Go Wrong (and Why It’s Useful):**  
  - **"Unique Solution" Frustration:** Some teams will treat this as code-breaking. *Don’t intervene.* Let them discover underdetermination organically when manuals clash.  
  - **Overconfidence in Betting:** Teams betting 2 tokens on false beliefs (e.g., "kino = red") will lose tokens. Use this to highlight belief-meaning tradeoffs.  
  - **Live Phase Struggles:** Informants can only say "yes"/"no"—students will realize they can’t isolate words.  

  **Debrief (20 min):**  
  1. **Socratic Questions:**  
     - *"What was hardest? Did anyone feel stuck assuming beliefs?"*  
     - *"Did two teams have different manuals that worked? Why?"*  
  2. **Map to Davidson:**  
     - **Principle of Charity:** Teams assumed Tessik are *mostly* rational (e.g., Manual A’s "deadly" for berry preserves truth).  
     - **Holism:** Fixing "kino" required assuming beliefs about berries/rabbits.  
     - **Interdependence:** No "kupu = berry" without assuming "berries are deadly."  
     - **Underdetermination:** Manuals A/B both worked—no "fact of the matter."  
  3. **Limitations of the Activity:**  
     - **Compositionality:** Real languages combine words systematically; our simplified scenes don’t capture this depth.  
     - **Charity as Default:** Davidson assumes *massive* agreement (e.g., logic, perception). Our game uses isolated false beliefs.  
     - **Truth Conditions:** We used held-true, but Davidson’s focus on *truth-conditions* for whole sentences must be clarified.  
  4. **Closing:**  
     > "You experienced radical interpretation: meaning and belief are a web you weave *all at once*. No word gets meaning alone; no belief is fixed without words. That’s Davidson’s revolution."

  ---

  **Why This Works:**  
  - **Immersive:** Students *feel* the struggle of interdependence.  
  - **Efficient:** Fits 80 min, minimal materials.  
  - **Pedagogically Honest:** Debrief addresses limitations and normalizes confusion.  

  **First-Run Tip:** If teams are frustrated by non-unique solutions, validate it: *"This is the point—language is underdetermined by evidence."* Run it as-is; the aha! moment in debrief is worth it.
