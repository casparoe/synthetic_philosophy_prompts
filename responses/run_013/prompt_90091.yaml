  We are going to design a game for a 80-minute seminar to illustrate Davidson's radical interpretation without using the terminology until the debrief. The goal is for students to experience the interdependence of belief and meaning and the underdetermination of translation.

  Core ideas to convey:
  1. You only observe a speaker holding a sentence true (or false) in a situation.
  2. You cannot fix the meaning of a word without assuming beliefs, and vice versa.
  3. Translation is underdetermined: multiple manuals can fit the same data.

  Game Structure:
  - Phase 1: Static Data (40 minutes)
  - Phase 2: Live Interaction (20 minutes)
  - Debrief (20 minutes)

  Materials:
  - For each pair: a packet containing:
     - A field log: 12 scenes (each scene: a description or simple drawing of a situation + an utterance + whether the speaker held it true or false of that scene).
     - A set of blank cards or a worksheet to record their manual (translation guide).
     - A set of tokens (or points) for betting.
  - One hidden key for each packet (held by the instructor until needed for live phase).
  - A timer.

  Roles:
  - Students in pairs: field linguists.
  - For the live phase, one student from each pair will become an informant for another pair (using the hidden key from their own packet). The other student remains the interpreter.

  Timeline:
  1. Introduction (5 min): Explain the setup without theory. "You are field linguists. You have a log of scenes with utterances and whether the Tessik held them true or false. Your goal is to build a translation manual. Then you will test it with new scenes and bet tokens on your predictions. The team with the most tokens wins."
  2. Phase 1: Static Data (35 min):
     - Pairs work on their packet. They must produce a manual (a set of word meanings and rules) that accounts for the 12 scenes.
     - They also must note down any beliefs they think the Tessik have that might differ from ours.
     - After 25 minutes, they can use the last 10 minutes to prepare for betting: they will get 3 new held-out scenes (without the truth value) and must bet tokens on whether the Tessik would hold each sentence true or false in that scene.
  3. Phase 2: Live Interaction (20 min):
     - Each pair splits: one student becomes the informant (they get the hidden key for their original packet - so they know the "correct" manual and beliefs for their Tessik language) and moves to another pair's table. The other student stays as the interpreter.
     - The interpreter (remaining in their original pair) now becomes the field linguist for a new Tessik language (the one brought by the visiting informant). The informant is only allowed to say the Tessik utterance and then the interpreter must ask "true?" or "false?" for a situation they describe (or show a scene). The informant answers only "yes" (if the Tessik would hold the utterance true in that situation) or "no".
     - The interpreter has 10 minutes to ask as many such questions as they can to build a manual for this new language. They can also bet tokens on 3 new held-out scenes for this new language (using the same betting system).
     - Then, they switch roles: the informant becomes the interpreter and the interpreter becomes the informant for another pair (but we might not have time for a full switch, so we can do one round only).
  4. Betting and Scoring (integrated in phases):
     - Each pair starts with 10 tokens.
     - For each held-out scene (in both phases), they bet 0, 1, or 2 tokens on their prediction of held-true or held-false. If correct, they win double the bet. If wrong, they lose the bet.
