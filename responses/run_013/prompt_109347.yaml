prompt: |-
  I host a podcast on decision theory and the philosophy of probability, and my next guest is a decision theorist whose new book is given over entirely to the two-envelope paradox. Her position, as I understand it, is that the familiar resolutions are all local and all correct as far as they go — the switching argument trades on a scale-invariant prior that no proper distribution provides, the probability of holding the smaller envelope is not one-half for every amount you might observe, and the argument does slide between an observed constant and a random variable — but that none of them accounts for the feature that makes the puzzle worth a book, namely that it is self-repairing. Block one version and a neighbour appears: the version in which you never open your envelope; the version in which the experimenter charges a small fee for switching; the version in which you are told the smaller amount; the St. Petersburg version. Her proposal is to stop treating the paradox as a single fallacious argument and treat it as a schema, with one diagnostic that sorts the sound instances from the unsound: an expected-value argument is sound only if its recommendation is stable under re-description of the act, that is, only if the agent's evaluation of what she is doing does not change when the act is refined into a family of more finely specified acts, or coarsened into a broader one. On her account the switching argument fails that test, Pascal's wager fails it too, the Doomsday argument fails it in a different way, and the St. Petersburg game passes it — which she takes to show that infinite expectation is not the culprit.

  Please draft eight to ten questions, in the order I should ask them, each with a follow-up keyed to the answer she is most likely to give, and order them so that she has to commit to what the test is before I begin pressing on the cases it is meant to sort. The set must include: one that forces her to motivate the stability test independently of the cases she wants to save, ideally by naming a case in which the recommendation is unstable under re-description yet plainly correct, or else by saying what the test tracks if not that; one that asks whether the test does any work beyond the standard demand that probabilities be conglomerable over a partition, or beyond a reflection principle; one on the version of the puzzle in which switching is manifestly right, where the two amounts are known to be ten and twenty and I have opened the ten, asking what the test says there and whether it says anything at all; one on the difference between evaluating an act and evaluating a policy, since her test is stated over acts while the most persuasive form of the switching argument is a policy — switch, whatever you find; one that takes seriously the thought that her diagnostic dissolves the paradox rather than resolving it, leaving the agent with no reason to switch even where the conditional expected value favours it; one that tests the extension to Pascal's wager, whose engine appears to be infinite utility rather than the description of the act, and asks what exactly the diagnostic is catching there; one on the price of the general claim, because if expected value is not invariant under re-description of the act, that is a thesis about decision theory at large rather than about envelopes, so what breaks elsewhere and how does she confine the damage; and one that draws out the constructive lesson, if there is one, for the self-locating probability literature. Keep every question concrete enough that a listener who has never encountered the paradox can follow the exchange, and let none of them collapse into a question about whether the paradox is really a paradox, or into an invitation for her to explain how she came to the topic.
reasoning: |-
  Okay, the user hosts a podcast on decision theory and philosophy of probability. Their next guest is a decision theorist who wrote a book on the two-envelope paradox. The guest's main idea is that existing resolutions are local fixes but miss that the paradox is "self-repairing"—block one version, another pops up. She proposes a stability test: an expected-value argument is sound only if its recommendation remains stable when the act is re-described (refined or coarsened).

  The user wants me to draft 8-10 questions in a logical order. They specified several required questions that must be included. Let me list those requirements to ensure each is addressed:

  1. **Motivate stability test independently**: Force her to justify the test without relying on the cases it resolves. Maybe ask for an example where instability exists but the recommendation is correct, or explain what the test tracks otherwise.

  2. **Relation to conglomerability/reflection**: Does the test go beyond standard requirements like probabilities being conglomerable over partitions or reflection principles?

  3. **Manifestly right switching case**: When amounts are known (e.g., $10 and $20, you have $10), switching is obviously correct. What does the test say here? Does it even apply?

  4. **Act vs. policy evaluation**: The test is stated over acts, but the switching argument is often presented as a policy ("always switch"). How does this distinction affect the test?

  5. **Dissolution vs. resolution**: Does her diagnostic dissolve the paradox, leaving no reason to switch even when conditional expected value favors it?

  6. **Extension to Pascal's wager**: Pascal's wager involves infinite utility—what exactly is the test catching there?

  7. **Cost of general claim**: If expected value isn't invariant under re-description, this impacts decision theory broadly. What breaks elsewhere? How to contain the damage?

  8. **Constructive lesson for self-locating probability**: What can the self-locating probability literature learn from this?

  Additionally, the questions must be concrete for new listeners, avoid meta-questions about the paradox's status or her background, and include follow-ups based on likely answers.

  I need to structure the questions so she commits to what the test is before pressing on cases. The order should start with foundational aspects of her framework, then move to applications and implications.

  Here's a possible order:

  1. **Clarify the stability test**: Start with a basic question defining the test to establish it upfront. Follow-up to ensure clarity.

  2. **Independent motivation**: Next, force her to justify the test independently of the target cases. This is crucial before applying it.

  3. **Act vs. policy**: Early on, address this distinction since the switching argument is policy-based. Her test is for acts, so this needs resolution.

  4. **Simple envelope case**: Apply the test to the straightforward scenario ($10/$20) to see how it handles manifestly correct decisions.

  5. **Dissolution question**: After establishing the test, probe if it leaves agents without reasons in some cases.

  6. **Conglomerability/reflection**: Technical question on whether the test adds beyond existing principles.

  7. **Pascal's wager**: Test the extension to another paradox.

  8. **General cost to decision theory**: Address the broader implications.

  9. **Self-locating probability**: End with constructive takeaways.

  For the manifestly right switching case: When you know the amounts are $10 and $20 and you see $10, switching is correct. The stability test might say: coarsening to "switch" vs. "don't switch" is stable because refining to specific amounts doesn't change the eval. But if she says the test doesn't apply or says nothing, that reveals limitations.

  For Pascal's wager: The act is "wager on God" vs. "don't." Refining might consider different gods or theistic beliefs. If evaluating changes under refinement (e.g., including many gods dilutes probability), it's unstable. The test catches that the recommendation isn't robust to act description.

  For general cost: If EV isn't description-invariant, this could break standard decision theory where acts are assumed to have fixed evaluations. She might confine it to cases with ignorance or unbounded possibilities, but that needs clarification.

  Each question needs a follow-up anticipating her response. For instance, in the motivation question, if she can't name an unstable-yet-correct case, the follow-up pushes on what the test tracks instead.

  Ensuring clarity for new listeners: Each question must include enough context. For example, when asking about the $10/$20 case, briefly state the scenario without assuming prior knowledge.

  Avoiding collapse: The questions should focus on her framework's mechanics, not debate if the paradox is genuine. E.g., "What does your test say in this case?" not "Is this really paradoxical?"
answer: |-
  Below is a carefully ordered set of nine questions (with follow-ups) designed to draw out your guest's core thesis while meeting all your specifications. The sequence forces her to define and motivate the stability test upfront before applying it to cases, ensures concrete accessibility for new listeners, and integrates all your required elements. Each question includes a brief contextual setup for clarity, followed by the question and a likely-response-tailored follow-up. The order builds from foundational commitments to implications, avoiding meta-debates about the paradox's nature or the guest's background.

  ---

  ### **Question 1: Clarifying the Stability Test**  
  *(Start here: Forces definitional commitment before probing cases.)*  
  **Context for listeners:** In the classic two-envelope paradox, you see $X in your envelope and reason that switching has a 50% chance of gaining $X and a 50% chance of losing $X/2, making switching seem profitable no matter what. Your guest argues this reasoning is unstable under "re-description" of the act.  
  **Question:** Could you state plainly what your "stability test" requires? Specifically, what does it mean for an expected-value argument to be stable under re-description of an act, and what’s a simple example of re-description (e.g., refining or coarsening)?  
  **Likely Answer:** She’ll define stability as the evaluation (e.g., "switch") remaining unchanged when the act is subdivided (e.g., "switch if I see $5," "switch if I see $10") or aggregated (e.g., "switch" as a blanket policy). Example: Refining "switch" into amount-specific sub-acts.  
  **Follow-up:** In the classic envelope setup, if I refine "switch" into "switch upon seeing X" for every possible X, does the instability arise because the expected value calculation changes depending on whether I condition on X or not?  

  ---

  ### **Question 2: Motivating the Test Independently**  
  *(Forces justification beyond target cases; addresses your "unstable-yet-correct" requirement.)*  
  **Context:** Your test isn’t just a fix for envelopes—it’s a general diagnostic. But why should we accept it? Is instability always bad?  
  **Question:** Can you name a real-world decision where the expected-value recommendation is unstable under re-description—say, refining the act into sub-cases—yet the recommendation is still plainly rational? If not, what does instability track if not error?  
  **Likely Answer:** She might struggle to find a "correct but unstable" case, instead arguing instability always indicates a pathology (e.g., it tracks ambiguity in the probability model).  
  **Follow-up:** If you can’t provide such a case, does this imply your test is a defining criterion for rational coherence, not just a heuristic? For instance, does instability always mean the argument smuggles in an impossible prior or conflates variables?  

  ---

  ### **Question 3: Act vs. Policy Evaluation**  
  *(Addresses the policy-switching argument early; tests scope.)*  
  **Context:** The strongest form of the switching argument is a policy: "Always switch, no matter what I see." But your test evaluates acts. How does it handle this?  
  **Question:** When the paradox is framed as evaluating the policy "always switch" versus "never switch," how does your test apply? Is "always switch" a single act or a collection? If it’s coarse, must we refine it to sub-acts to test stability?  
  **Likely Answer:** She’ll argue that evaluating a policy requires refining it into specific acts (e.g., switching at observed amounts) to expose instability.  
  **Follow-up:** Doesn’t this make the test circular? If I start by evaluating the policy "always switch," and you force me to refine it, the instability is baked into the refinement—but the policy might still seem rational if I don’t peek in the envelope.  

  ---

  ### **Question 4: The Manifestly Right Switching Case**  
  *(Tests the test on a sound argument; addresses your $10/$20 case.)*  
  **Context:** Suppose I know the envelopes contain exactly $10 and $20. I open mine, see $10, and switch to $20. Conditional expected value clearly favors switching.  
  **Question:** What does your stability test say here? If I coarsen the act to "switch" (ignoring the amount) or refine it to "switch when seeing $10," does the evaluation change? If not, is the test doing any work here, or is it silent?  
  **Likely Answer:** She’ll agree the test is satisfied because refining/coarsening doesn’t alter the recommendation—it’s robust.  
  **Follow-up:** If the test is passed trivially here but fails in the classic paradox, does that mean your diagnostic only flags errors without adding insight for sound cases?  

  ---

  ### **Question 5: Dissolution vs. Resolution**  
  *(Probes whether the test dissolves rather than solves the paradox.)*  
  **Context:** In your book, you suggest that in unstable cases, the agent has "no reason" to switch, even if a naive expected-value calculation says otherwise.  
  **Question:** Does your test imply that in the classic envelope setup, there’s genuinely no rational reason to switch—that the paradox is dissolved, not resolved? If so, how does this square with the intuition that, for some distributions (e.g., bounded amounts), switching might conditionally seem beneficial?  
  **Likely Answer:** She’ll argue that instability voids the argument entirely, so no expected-value reason exists.  
  **Follow-up:** But if I observe $X and know the host used a fair coin to set amounts, isn’t “switch” objectively better in expectation for some X? Doesn’t dissolution ignore legitimate conditional expectations?  

  ---

  ### **Question 6: Relation to Conglomerability and Reflection**  
  *(Tests novelty; addresses technical depth.)*  
  **Context:** Standard fixes for the paradox demand "conglomerability" (probabilities must align across partitions) or a "reflection principle" (beliefs about unknowns should cohere).  
  **Question:** Is your stability test just repackaging these ideas? For example, does instability always trace to non-conglomerable probabilities, or is it catching something else?  
  **Likely Answer:** She’ll distinguish it: Conglomerability is about probability consistency, while stability is about act description affecting expected utility.  
  **Follow-up:** But if I redescribe an act by partitioning the state space (e.g., refining "switch" by amount), isn’t instability equivalent to non-conglomerability in that partition?  

  ---

  ### **Question 7: Extension to Pascal’s Wager**  
  *(Applies test to a non-envelope case; addresses infinite utility.)*  
  **Context:** Pascal’s wager says: Believe in God because infinite reward outweighs finite cost. You claim it fails your test.  
  **Question:** How does re-description destabilize Pascal’s wager? Is it the infinite utility or the act description (e.g., refining "believe" into "worship as a Christian," "worship as a Muslim," etc.)?  
  **Likely Answer:** She’ll argue refining the act exposes inconsistent expectations (e.g., many gods dilute probability).  
  **Follow-up:** But if I coarsen to "believe in some god," restoring stability, does the wager work? If so, is the issue really description, or just poorly specified probabilities?  

  ---

  ### **Question 8: Cost to Decision Theory**  
  *(Assesses broader implications; addresses "what breaks?")*  
  **Context:** If expected value isn’t invariant under act re-description, this challenges standard decision theory, where acts are primitive.  
  **Question:** What breaks outside of paradoxes? For example, in a medical trial, if I evaluate "administer drug" coarsely versus refining to "administer to men" and "administer to women," must evaluations align? If not, how do we avoid arbitrariness?  
  **Likely Answer:** She’ll confine damage to "unbounded" or "improper" cases (e.g., envelopes, Pascalian wagers).  
  **Follow-up:** But isn’t refinement routine in decisions (e.g., targeting subpopulations)? If stability isn’t required there, how is your test more than an ad hoc paradox filter?  

  ---

  ### **Question 9: Lesson for Self-Locating Probability**  
  *(Draws constructive insight; links to your podcast’s themes.)*  
  **Context:** Self-locating probability deals with beliefs like "What time is it?" or "Who am I?" during uncertainty (e.g., Sleeping Beauty).  
  **Question:** How does your test inform debates about self-locating priors? For instance, does stability help resolve whether agents should update on indexical information?  
  **Likely Answer:** She’ll suggest it flags incoherent updates (e.g., refining "I exist" into "I am person A at time T").  
  **Follow-up:** Could this replace the current "centering" or "halfer" rules, or is it a cautionary tool?  

  ---

  ### **Why This Order?**  
  1. **Q1** locks in the test’s definition.  
  2. **Q2** pressures its motivation *before* applications.  
  3. **Q3–Q8** apply the test to your mandated cases (policy-switching, manifest switching, dissolution, Pascal, general cost), escalating in complexity.  
  4. **Q9** ends constructively, tying to adjacent fields.  
  Each question is concrete (avoids jargon; uses simple examples) and avoids "Is this really a paradox?" by focusing on the test’s mechanics. Follow-ups are adversarial yet charitable, forcing clarity without veering into autobiography.
