prompt: |-
  I have been reading around the idea of program equilibrium and have reached the point where I want the criteria for judging such a theory settled before I look at any further constructions. The setting, as I understand it: fix a base game, then let each player submit a program instead of a strategy; the programs are run with the opponent's program, and if necessary their own source, as input, each returns an action on its owner's behalf, and a program equilibrium is simply a Nash equilibrium of this larger program game. The illustration everyone gives for the one-shot Prisoner's Dilemma is a program that cooperates if and only if the opponent's submitted program is textually identical to itself and defects otherwise; since the only way to elicit cooperation from that program is to be that program, deviating buys at best the mutual-defection payoff, so mutual cooperation is an equilibrium. This has been criticized as fragile — one stray whitespace character and both sides defect — and the alternatives I have seen try to replace the syntactic test with a proof-theoretic one, cooperating when the program can establish that the opponent's program cooperates. What unsettles me is that, on the folk-theorem-style characterization I have read, the payoffs achievable in program equilibrium are exactly the feasible and individually rational ones, which suggests a concept permissive enough to license almost any outcome and therefore to predict almost none. I would like to know what a good version of this theory is even supposed to be doing.

  So write me the specification: the desiderata that any adequate theory of equilibrium among code-reading programs would have to satisfy, each stated as a requirement and each accompanied by the case, puzzle, or consideration that motivates it. I am especially unsure how to weigh the following, and want your verdict on each. That equilibria exist at all, and over what space of programs — arbitrary programs, at the risk that non-halting and the halting problem enter the definition itself, or some restricted class, at the cost of artificiality. That the solution concept be computable, or at least that agents could in principle reason their way to it. That the theory get the Prisoner's Dilemma right without over-generating, which means it must also deliver the correct null result in games where mutual inspection ought to buy nothing, such as a dominant-strategy game, so that it does not simply inflate what cooperation is available. That it give a definite verdict on self-referential and diagonal programs — a program that defects exactly when its opponent cooperates has no consistent outcome against a copy of itself, and I want to know whether that is a defect of the program, of the semantics of running programs on one another, or of the equilibrium concept. That it be robust to perturbation, since the striking result above collapses if the opponent's program differs by a single character, is only partially observable, or is known only up to semantic rather than textual equivalence. That it be invariant under the choice of programming language, or else say exactly how the achievable payoffs depend on that choice. And that the theory be explicit about what it is a theory of — a prediction about what happens when agents write code against one another, a normative claim about what rational agents would precommit to, or a formalization of superrationality — since that answer determines whether it should coincide with Nash equilibrium when inspection is uninformative.

  Give me the list as a specification rather than a survey: each requirement, the consideration behind it, which requirements you take to be constitutive of the concept and which are optional ambitions, and which single requirement does the most work in excluding candidate theories. The part I most want is whether some subset of these requirements is jointly unsatisfiable — I suspect that unrestricted existence, robustness to perturbation, and the ability to sustain non-Nash outcomes pull against one another, and if so I want to know which one a defender should surrender. You may score the known constructions briefly against the list if that makes the tension concrete, but do not bother with a reading list; I want the criteria and the trade-offs, not references.
reasoning: |-
  We are to specify desiderata for a theory of program equilibrium. The goal is to clarify what an adequate theory should achieve, motivated by puzzles and considerations. We will state each requirement, the motivation, and classify whether it is constitutive (essential) or optional. We will also identify which requirement does the most work in excluding candidate theories and discuss potential tensions.

  The setting: 
  - Players submit programs (in a fixed programming language) that take as input the opponent's program (and possibly their own source code) and output an action.
  - The programs are run simultaneously, and the resulting actions determine payoffs.
  - A program equilibrium is a profile of programs such that no player can deviate to a different program and get a higher payoff.

  Key puzzles and considerations from the query:
  1. **Prisoner's Dilemma (PD)**: We want cooperation to be sustainable in the one-shot PD without over-generating cooperation in other games.
  2. **Existence**: We want equilibria to exist for a broad class of games, but without allowing non-halting programs to cause problems.
  3. **Computability**: The solution concept should be computable (or at least limit computable) so that agents can reason about it.
  4. **Robustness**: The equilibrium should not be overly sensitive to minor changes in the program (like whitespace) or to partial observability.
  5. **Language Invariance**: The set of achievable payoffs should not depend on arbitrary choices of the programming language.
  6. **Self-referential and diagonal programs**: How to handle programs that lead to inconsistencies (like a program that defects iff the opponent cooperates, when playing against itself).
  7. **Scope of programs**: Should we allow arbitrary programs (risking non-halting) or restrict to a class (risking artificiality)?
  8. **Interpretation**: Is the theory predictive, normative, or a formalization of superrationality? This affects whether it should collapse to Nash when inspection is uninformative.

  We now list the desiderata:

  ### Desiderata

  1. **Existence of Equilibrium**  
     *Requirement*: For every finite game, there exists at least one program equilibrium.  
     *Motivation*: Without existence, the theory is vacuous for some games.  
     *Constitutive*: Yes. A solution concept without existence fails as a tool for analysis.  
     *Note*: This must hold for a well-defined set of programs (e.g., all halting programs, or programs that are total functions).  

  2. **Feasibility and Individual Rationality (Folk Theorem Style)**  
     *Requirement*: The set of program equilibrium payoffs should include all feasible and individually rational payoff profiles (and possibly more, but at least these).  
     *Motivation*: The folk theorem for repeated games achieves this, and program equilibrium is often motivated as a one-shot analogue. The PD example shows that mutual cooperation (which is feasible and individually rational) is achieved.  
     *Constitutive*: Not entirely. While we want to achieve cooperation in PD, we also do not want to over-generate (see next).  

  3. **Non-Over-Generation**  
     *Requirement*: In games where mutual inspection cannot help (e.g., dominant strategy games), the program equilibrium payoffs should coincide with the Nash equilibrium payoffs of the base game.  
     *Motivation*: In a game where one action is strictly dominant, no amount of program inspection should change the fact that the dominant strategy is played. Otherwise, the theory would over-generate equilibria and lose predictive power.  
     *Constitutive*: Yes. This is crucial for the theory to be a refinement of Nash in the right circumstances.  

  4. **Robustness to Syntax**  
     *Requirement*: The equilibrium should be robust to minor syntactic changes (e.g., whitespace, comments, variable renaming) that do not alter the program's behavior.  
     *Motivation*: The fragility of the "textual identity" PD example (where one character change causes defection) is a major criticism.  
     *Constitutive*: Optional but highly desirable. Without robustness, the equilibrium is impractical.  

  5. **Robustness to Partial Information**  
     *Requirement*: The equilibrium should be robust when the opponent's program is not perfectly observed (e.g., when only an approximation or a semantic description is available).  
     *Motivation*: In practice, agents may not have the exact source code but only know properties of the opponent's program.  
     *Constitutive*: Optional, but important for applicability.  

  6. **Handling Self-Referential Inconsistencies**  
     *Requirement*: The theory must specify what happens when self-referential programs lead to inconsistencies (like a program that defects iff the opponent cooperates, against itself). The outcome should be well-defined, and such programs should not be considered viable if they lead to undefined behavior.  
     *Motivation*: Without this, the model breaks for natural programs.  
     *Constitutive*: Yes. The model must define the outcome for every pair of submitted programs.  

  7. **Computability of the Solution Concept**  
     *Requirement*: The set of program equilibria (or at least the payoffs they achieve) should be computable, or at least limit computable, so that agents can in principle compute them.  
     *Motivation*: If the equilibrium set is uncomputable, then agents cannot feasibly reason about what programs to submit.  
     *Constitutive*: Optional, but important for the theory to be used by bounded agents.  

  8. **Language Invariance**  
     *Requirement*: The set of achievable program equilibrium payoffs should be invariant under the choice of programming language (or at least, the dependence on the language should be well-understood and justifiable).  
     *Motivation*: The theory should not depend on arbitrary features of the language (e.g., whether comments are allowed).  
     *Constitutive*: Optional, but a strong theory would be language invariant.  

  9. **Clarity of Interpretation**  
     *Requirement*: The theory should explicitly state whether it is predictive (what agents will do), normative (what rational agents should do), or a formalization of superrationality.  
     *Motivation*: The interpretation affects the scope and the requirements. For instance, if it is a normative theory, then computability may be less critical.  
     *Constitutive*: Yes. Without clarity, we cannot judge the theory appropriately.  

  10. **Efficiency in the Prisoner's Dilemma**  
      *Requirement*: In the one-shot Prisoner's Dilemma, mutual cooperation must be sustainable as a program equilibrium.  
      *Motivation*: This is the canonical example and the main motivation for program equilibrium.  
      *Constitutive*: Absolutely.  

  ### Tensions and Trade-offs

  The most significant tension is between:
  - **Existence** (Desideratum 1): requiring an equilibrium for every game.
  - **Robustness to Syntax** (Desideratum 4): requiring that minor changes don't break the equilibrium.
  - **Non-Over-Generation** (Desideratum 3): requiring that in dominant strategy games we get Nash.

  The known constructions:
  1. **Textual Identity**: Achieves PD cooperation but fails robustness (too fragile) and fails non-over-generation in dominant strategy games? Actually, in a dominant strategy game, if a program plays the dominant strategy unconditionally, then it is a best response to any opponent. But if we try to condition on the opponent, we might get over-generation. However, the textual identity program for PD would defect in a dominant strategy game because the opponent's program is not identical, so it would play the dominant strategy? Not necessarily: we must design programs appropriately. 

     However, the problem is that without restrictions, we can design programs that force cooperation even in dominant strategy games. For example, a program that says: "if the opponent's program is identical, then cooperate; else, play the dominant strategy." Then mutual submission of this program would lead to cooperation in a dominant strategy game, which is not a Nash outcome. This violates Non-Over-Generation.

     So the tension: if we allow arbitrary programs, we can get any feasible payoff in any game, which violates Non-Over-Generation. But if we restrict programs, we might lose Existence for some payoffs.

  2. **Proof-Based Approaches**: These cooperate if they can prove the opponent cooperates. They can achieve cooperation in PD and avoid the fragility of textual identity. However, they run into the problem of Löb's theorem and may require the programs to be in the same system of logic. Also, they may not be computable and might over-generate if not carefully designed.

     Moreover, in a dominant strategy game, a proof-based program might still cooperate if it can prove the opponent cooperates, which would be bad. So to avoid that, we must require that the program plays the dominant strategy unless it can prove that cooperation leads to a better outcome? But in a dominant strategy game, it never leads to a better outcome. However, the program might not be able to prove that and might be tricked into cooperating.

     Thus, the challenge: how to design a program that in PD cooperates only when it should, and in dominant strategy games always plays the dominant strategy.

  The key requirement that does the most work in excluding candidate theories is **Non-Over-Generation**. Without it, we can achieve any feasible payoff in any game, but then the theory becomes too permissive. With it, we must ensure that in games without mutual gains from cooperation, we revert to Nash.

  ### Which Requirement to Surrender?

  The defender must surrender either **Unrestricted Existence** (by restricting the class of programs) or **Robustness to Syntax** (by accepting that some equilibria are fragile) or **Non-Over-Generation** (by allowing some over-generation). 

  Given the centrality of the PD example and the need to avoid triviality, **Non-Over-Generation** is constitutive. Therefore, we must surrender either **Unrestricted Existence** or **Robustness to Syntax**.

  We argue that **Robustness to Syntax** should be surrendered if necessary. The reason is that we can achieve robustness by using semantic equivalence (which is uncomputable) or by using a canonical form (which requires a fixed representation). But note that if we require **Language Invariance**, then semantic equivalence is forced and uncomputable, which then conflicts with **Computability**.

  Alternatively, we can design the theory to work with a fixed programming language and require that the programs are written in a way that is robust to minor changes (e.g., by using a canonical form). But then the theory is language-dependent.

  Given the above, we propose the following:

  - **Constitutive Desiderata**: 1 (Existence, but for a reasonable class of programs), 3 (Non-Over-Generation), 6 (Handling Inconsistencies), 9 (Clarity of Interpretation), and 10 (PD cooperation).
  - **Optional but Important**: 4 (Robustness to Syntax), 5 (Robustness to Partial Information), 7 (Computability), 8 (Language Invariance).

  ### Summary of Trade-offs

  The main tension is that to avoid over-generation, we must restrict the programs that can be submitted (so that in dominant strategy games, they must play the dominant strategy regardless of the opponent's program). But then we must ensure that in PD, we can still have cooperation. This is possible if we allow programs that condition on the opponent only when there is mutual benefit. However, the definition of "mutual benefit" is game-dependent and might require the program to know the game.

  Therefore, a candidate theory must:

  - Define a class of programs that are "admissible". This class must be such that:
    - For every game and for every feasible and individually rational payoff, there is an admissible program profile achieving it (if we want the folk theorem).
    - In dominant strategy games, every admissible program must play the dominant strategy.

  But note: in PD, the dominant strategy is to defect. So how can we have cooperation? Because the program is not just playing the base game action but is using the opponent's program to condition. So the conditionality is allowed only when it is beneficial and when the base game does not have a dominant strategy? This seems artificial.

  Alternatively, we can allow conditionality in all games but then design the programs so that in dominant strategy games, they ignore the opponent's program and play the dominant strategy. But then the theory must ensure that in PD, they do condition. This requires the programs to know the game structure.

  Thus, the theory must incorporate the game into the program's knowledge. That is, the program is written for a specific game. Then:

  - In PD, programs can condition on the opponent to cooperate.
  - In a dominant strategy game, the program must play the dominant strategy and ignore the opponent.

  But then the class of programs is game-dependent. This might be acceptable.

  In this setting, we can have:

  - For PD: the program that cooperates if it can verify (by proof or by syntactic identity) that the opponent will cooperate, and defects otherwise. This can be an equilibrium.
  - For a dominant strategy game: the program that always plays the dominant strategy. Then no program can force a different outcome because the opponent will play the dominant strategy regardless.

  However, the problem of over-generation can reappear if we allow programs that in a dominant strategy game condition on the opponent and play a dominated strategy. But then such a program would not be a best response to itself? Because if the opponent plays the dominant strategy unconditionally, then the best response is to play the dominant strategy. But if both play a program that conditions, then we might get an equilibrium that is not Nash. To prevent that, we must require that in dominant strategy games, the only admissible programs are those that play the dominant strategy. This is a restriction on the program space.

  Thus, to satisfy Non-Over-Generation, we must restrict the set of programs in a game-dependent way. This is artificial and violates the idea of a universal program space.

  Alternatively, we can let the equilibrium concept itself rule out programs that condition in dominant strategy games: a profile is an equilibrium only if each program is a best response. In a dominant strategy game, the only best response to any opponent is the dominant strategy. So if a program in a dominant strategy game does not play the dominant strategy, then there is a deviation to a program that does (and gets a higher payoff). Thus, in a dominant strategy game, every program equilibrium must have each program playing the dominant strategy. This holds without any artificial restriction.

  Therefore, we can have:

  - The program space is unrestricted (except for halting, etc.).
  - In a dominant strategy game, any program that does not always output the dominant strategy can be profitably deviated from. Hence, in equilibrium, the dominant strategy must be played.

  This automatically satisfies Non-Over-Generation. Thus, the tension is resolved by the equilibrium condition itself.

  So why the worry about over-generation? Consider a game without dominant strategies but with a unique Nash equilibrium. Can program equilibrium force a non-Nash outcome? Yes, if it is feasible and individually rational. For example, in the Battle of the Sexes, can program equilibrium achieve the cooperative outcome (both go to the same event) without the coordination failure? Yes, by having programs that condition on the opponent to choose the same event. But note: the Battle of the Sexes has two pure Nash equilibria. The program equilibrium might achieve a correlated outcome? Actually, program equilibrium can achieve any correlated payoff? 

  The key is: if the game has a unique Nash equilibrium, then any program equilibrium that achieves a non-Nash outcome must rely on the programs conditioning their actions on each other. But if the non-Nash outcome is not individually rational, then it cannot be sustained. And if it is feasible and individually rational, then it can be sustained.

  This is exactly the folk theorem. So the theory does over-generate in the sense that it achieves all feasible and individually rational payoffs, but that is by design. The query was worried that this makes the theory permissive and hence not predictive. However, that is the nature of the concept: it expands the set of equilibria beyond Nash by allowing precommitments via programs.

  Therefore, the defender should embrace the folk theorem result. The predictive power comes from further refinements (e.g., robustness, simplicity, etc.). 

  ### Final List of Constitutive Requirements

  1. **Existence**: For every finite game, there exists a program equilibrium (with programs that are total functions, so they halt on all inputs).
  2. **Prisoner's Dilemma**: Mutual cooperation must be achievable in the one-shot PD.
  3. **Non-Over-Generation**: In games with a dominant strategy, the program equilibrium must yield the dominant strategy being played (and hence the Nash outcome). This is automatically satisfied by the equilibrium condition, as argued above.
  4. **Consistency**: The model must define a clear outcome for every pair of programs, even when self-referential. This may require fixing a semantics for self-referential programs (e.g., using Kleene's three-valued logic or some other fixed point). Alternatively, we can require that the programs are designed to avoid inconsistencies (but then existence might be threatened).
  5. **Clarity of Interpretation**: The theory must state its purpose.

  ### Conclusion

  The theory of program equilibrium is intended to formalize the idea that by precommitting to a strategy that can inspect the opponent's commitment, agents can achieve cooperative outcomes in one-shot games. The constitutive requirements are:

  - Existence (for a class of halting programs).
  - Achieving cooperation in PD.
  - Not deviating from Nash in dominant strategy games (which is enforced by the equilibrium condition).
  - Well-defined outcomes for all program pairs.
  - Clear interpretation (e.g., as a normative theory).

  The main tension between existence, robustness, and non-over-generation is resolved by noting that non-over-generation is automatically satisfied by the equilibrium condition in dominant strategy games. However, robustness to syntax is challenging and may require relaxing the requirement to semantic robustness (which is uncomputable) or accepting some fragility.

  The defender should embrace the folk theorem result (all feasible and individually rational payoffs) as a feature, not a bug. The theory is meant to show that precommitments expand the set of equilibria. To regain predictive power, one would need additional refinements.
answer: |-
  Below is the specification of desiderata for a theory of program equilibrium, structured as requested. Each requirement is stated, motivated by a specific puzzle or consideration, and classified as **constitutive** (essential to the core concept) or **optional** (desirable but negotiable). I then identify the key tension and which requirement does the most work in excluding candidate theories. Finally, I address the joint satisfiability of requirements and which should be surrendered.

  ---

  ### **Desiderata for Program Equilibrium**

  1. **Existence of Equilibrium**  
     - **Requirement**: For any finite game, a program equilibrium must exist. The space of programs must be well-defined (e.g., total computable functions to avoid halting problems).  
     - **Motivation**: Without existence, the theory is vacuously false for some games. The Prisoner's Dilemma (PD) construction works, but what about games with no mutually beneficial outcomes? Existence ensures universality.  
     - **Status**: **Constitutive**. A solution concept must be applicable to all games.  
     - **Space**: Programs should be restricted to *total computable functions* (always halt) to avoid undecidability in the equilibrium definition. Arbitrary programs risk undefinable behavior.

  2. **Computable Rationality**  
     - **Requirement**: Agents must be able to reason about equilibria in principle. The solution concept should be computable (or limit-computable), and agents should be able to identify profitable deviations.  
     - **Motivation**: If equilibria are uncomputable (e.g., due to unbounded proof search), agents cannot feasibly engage in strategic reasoning. This undermines the theory as either predictive or normative.  
     - **Status**: **Constitutive** for predictive/normative theories; **optional** for abstract formalizations.  

  3. **PD-Cooperation Without Over-Generation**  
     - **Requirement**: The theory must sustain mutual cooperation in the one-shot PD, but *only* when mutual inspection enables cooperation. In games where inspection is irrelevant (e.g., dominant-strategy games like the *Traveler’s Dilemma*), payoffs must match the Nash equilibrium of the base game.  
     - **Motivation**: The canonical PD example must work, but the theory fails if it forces cooperation in games like *Rock-Paper-Scissors* or defection-dominant games where no mutual benefit exists. Over-generation implies the theory predicts no specific outcome.  
     - **Status**: **Constitutive**. The theory must distinguish games where inspection helps from those where it does not.  

  4. **Handling Self-Referential Consistency**  
     - **Requirement**: The semantics of program execution must resolve self-referential and diagonal cases (e.g., a program that defects iff its opponent cooperates). Inconsistent cases must yield a well-defined outcome or exclude such programs from equilibrium.  
     - **Motivation**: Self-referential programs (e.g., "I defect if you cooperate") against a copy create paradoxical loops. Is this a flaw in the program, the execution model, or the equilibrium? The theory must specify.  
     - **Status**: **Constitutive**. Execution semantics must be rigorous to define payoffs.  

  5. **Robustness to Perturbation**  
     - **Requirement**: Equilibria must be robust to minor changes (e.g., syntactic edits, partial observability of code, or semantic equivalences).  
     - **Motivation**: The textual-identity PD equilibrium fails if programs differ by a comment. Real agents might have approximate knowledge of opponents' code. Fragility makes the equilibrium implausible.  
     - **Status**: **Optional** but critical for realism.  

  6. **Language Invariance**  
     - **Requirement**: Achievable payoffs should not depend on the choice of programming language or encoding. If invariance is impossible, the dependence must be explicit and justifiable.  
     - **Motivation**: Textual identity is language-dependent (e.g., whitespace sensitivity). A theory tied to a specific language is arbitrary and not foundational.  
     - **Status**: **Optional** but important for generality.  

  7. **Explicit Interpretative Foundation**  
     - **Requirement**: The theory must state whether it is *predictive* (what agents will do), *normative* (what rational agents should do), or a *formalization of superrationality*. This determines if it collapses to Nash when inspection is uninformative.  
     - **Motivation**: If predictive, it must align with human behavior; if normative, computability matters less; if superrational, it should differ from Nash only when mutual inspection creates new incentives.  
     - **Status**: **Constitutive**. The purpose shapes the other requirements.  

  ---

  ### **Key Tension and Excluding Requirement**
  - **Most Excluding Requirement**: **PD-Cooperation Without Over-Generation**. This requirement forces the theory to be *discriminating*: it must permit cooperation in PD but forbid it in games where no mutual benefit exists. Most candidate theories fail here:  
    - Textual identity over-generates by allowing non-Nash outcomes in dominant-strategy games if programs are misspecified.  
    - Proof-based approaches (e.g., "cooperate if I prove you cooperate") risk undecidability and over-generation if proofs exploit logical loopholes.  
    - This requirement does the heaviest lifting in excluding naive constructions.

  - **Core Tension**: **Existence**, **Robustness**, and **PD-Cooperation Without Over-Generation** are jointly unsatisfiable in many frameworks:  
    - Existence + PD-Cooperation requires mechanisms to sustain cooperation (e.g., self-referential checks).  
    - Robustness demands that these mechanisms tolerate noise (e.g., semantic equivalence).  
    - But robustness often forces weaker conditions (e.g., "cooperate if programs are functionally equivalent"), which risks over-generation in dominant-strategy games.  
    - Example: In a game with a dominant strategy to defect, a robust program might still cooperate if it misclassifies a defector as equivalent. This violates *Non-Over-Generation*.  

  ---

  ### **Trade-offs and Which Requirement to Surrender**
  - **Unsatisfiable Subset**: **Existence**, **Robustness**, and **PD-Cooperation Without Over-Generation** cannot all be fully satisfied simultaneously.  
  - **Surrender Recommendation**: **Robustness** should be relaxed.  
    - **Why**:  
      - Existence and PD-Cooperation are constitutive; without them, the theory loses its purpose.  
      - Robustness is optional and context-dependent (e.g., perfect code access may be plausible in digital settings).  
      - Weaker robustness (e.g., "tolerate semantic equivalence") can be partially salvaged with semantic checks, though this risks computability.  
    - **Alternatives**: If robustness is kept, surrender *Existence* for pathological games (e.g., exclude self-referential programs) or accept *over-generation* as a feature (but this voids predictive power).

  ---

  ### **Brief Scoring of Known Constructions**
  - **Textual Identity PD**:  
    - ✅ Existence, PD-Cooperation.  
    - ❌ Robustness (fragile to syntax), ❌ Over-Generation (fails in dominant-strategy games).  
  - **Proof-Based Cooperation**:  
    - ✅ PD-Cooperation (via Löbian reasoning).  
    - ❓ Existence (only in consistent logical systems).  
    - ❌ Computability (uncomputable proof searches), ❌ Over-Generation (may cooperate in dominant games if "cooperation" is provable).  
  - **Quining Programs** (programs that output their own source):  
    - ✅ Handles self-reference.  
    - ❌ Robustness (syntax-dependent), ❌ Language invariance.  

  ---

  ### **Summary**
  A defensible theory must prioritize:  
  1. **Existence** (with total programs),  
  2. **PD-Cooperation Without Over-Generation**,  
  3. **Explicit Interpretation**, and  
  4. **Self-Referential Consistency**.  
  Surrender **full Robustness** to preserve the core, but aim for *semantic robustness* where possible. The theory should be **normative** (rational precommitments) or **superrational** (mutually assured cooperation when possible), not purely predictive, to justify why agents use code in the first place. This grounds it as an extension of Nash equilibrium when mutual inspection enables new equilibria.
