answer: |-
  ## Nine Minutes Under an Open Sky

  Good morning. To the Class of [Year], the reason we’re all here: congratulations. To the families, friends, mentors, and loved ones gathered – especially those for whom this day carries a profound, perhaps unprecedented weight – welcome. Seeing your pride makes this moment richer. And to my colleagues… well, it wouldn’t be history without a little debate, would it? Let’s proceed.

  You’ve heard it said, perhaps even here, that history bends toward justice. That there’s an arc, long and inevitable, carrying humanity somewhere better. It’s a comforting thought, especially when leaving the familiar ground of this college for the vast, uncertain landscape beyond. It promises that your efforts, however small they feel, join a current flowing somewhere good.

  I stand before you as someone who has spent a career looking closely at that supposed arc. And I must tell you: I find no evidence it bends on its own.

  Think of that image – the arc. Sometimes it’s drawn as if by an unseen hand, a story already written, its ending assured. For some here, that belief is a source of profound strength, a matter of faith. I respect the comfort and purpose it provides. But as a historian, I cannot find the author’s signature in the archives, only the smudged fingerprints of countless human hands.

  Sometimes the arc is seen differently – not authored, but inherent. The idea that the sheer complexity of our world, the institutions we build, the slow, grinding expansion of who *counts* as human, makes certain outcomes *more likely*. This view has a powerful pull. It feels logical. It speaks to the hard-won victories we *can* point to. But likelihood is not destiny. Trends can stall. Gains can be erased. What feels like an upward trajectory can suddenly plateau, or worse.

  What I see, when I look back, is something different. Less an arc bending, more a path being *made*. Step by step, choice by choice, push by push. The curve we perceive? It’s the sum of countless actions, large and small, often contradictory, read backwards through the fog of time. The record itself is partial, skewed by what was deemed important enough to keep, whose voices were amplified, whose were silenced or simply lost. What looks like direction from a distance is often the chaotic, contested work of people, just like you, trying to build something, fix something, or simply survive.

  So, if the arc doesn’t bend on its own, what holds the progress we *have* managed? Think less of a curve and more of a *ratchet*. A ratchet is a mechanism. It allows motion forward but blocks it sliding back. It’s clever, but it’s also human-made. It needs maintenance. It can be broken, bypassed, or even deliberately taken apart. The rights you enjoy, the institutions that protect you (however imperfectly), the norms that make society function – these aren't gifts of an inevitable arc. They are ratchets. Hard-won mechanisms installed by generations before you.

  And this is crucial: **Not every gain is a ratchet.** Some advances feel permanent but are more fragile than they seem. Some are trends, easily reversed. Some victories are won but the mechanisms to *hold* them weren't properly forged. As you step out, make it a habit to ask: *Is this thing we’ve achieved – this right, this protection, this understanding – truly locked in? Or is it resting on sand?* Knowing the difference is vital.

  This brings us to hope. If history isn’t guaranteed to bend, if progress isn’t automatic, where does that leave hope? Some might ask – perhaps a thoughtful colleague in the fourth row – isn’t asking hope to motivate us without a guaranteed outcome just providence smuggled back in? A faith in unseen forces?

  I think not. Hope isn’t the same as expectation. Expectation demands a specific outcome. Hope can exist alongside doubt, even amidst profound uncertainty. Hope isn’t a prediction about how things *will* turn out; it’s a declaration about what we *choose* to work for. It’s the fuel for the effort, not the guarantee of the destination.

  When we move the idea of progress out of the register of prediction – out of "it *will* happen" – and into the register of commitment – "we *will work* for it" – something changes. It becomes harder, yes. It costs more. It requires acknowledging a painful truth embedded in the ledger of history: that the path forward, such as it is, has been paved with immense suffering, with lives and dreams sacrificed, often without seeing the fruits of their struggle. We cannot resolve this ledger; we cannot balance its accounts. To pretend the cost wasn’t real, or that it was somehow *necessary* for an inevitable outcome, dishonors those who paid it. But this painful knowledge cannot become a reason for paralysis, for standing still. It must become a fierce commitment to ensure their sacrifices were not in vain, to build mechanisms – ratchets – that make such suffering less likely for those who come after *you*.

  So, graduates, what do you do with this? What do you do without the promise of an inevitable arc?

  You look for the ratchets. You learn how they work. You dedicate yourselves to maintaining the ones that hold the hard-won gains of dignity, justice, and reason. You build new ones where they are needed. You understand that some things need constant tending, like a garden, not just a one-time installation.

  You cultivate hope not as a passive trust in a benevolent curve, but as an active, demanding choice. You hope *for* justice, *for* kindness, *for* a better world, precisely *because* you know it’s not guaranteed. That’s what makes the choice significant. That’s what makes your effort essential.

  You act. Not because you know you’ll win, but because the work itself is worthy. Because the alternative – resignation, cynicism, the slow dismantling of the mechanisms that hold back chaos – is unacceptable. Because the people sitting next to you, and the people who came before you, and the people yet to be born, deserve your effort.

  You will build, you will repair, you will push. You will do it with clear eyes about the past and no illusions about automatic futures. You will do it knowing the record of your efforts may be fragmentary, that the full shape of what you contribute may only be visible, if at all, to those looking back from a distant future.

  But you will do it. Not because history bends, but because *you* can. Not because the arc is real, but because the work is necessary.

  So go. Tend the ratchets. Make your choices. Build your piece of the path. And know that the significance of this day lies not in promises about where the path leads, but in the fact that you are now strong enough, and prepared enough, to walk it, and shape it, yourselves.

  Congratulations. Build well.
