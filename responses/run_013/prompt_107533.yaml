prompt: |-
  I travel a good deal for work, and for the past couple of years I've been keeping a notebook of my gut reactions to the small local rules I run into, mainly because a colleague insists my reactions are incoherent and I want to see whether he's right. Here is the list as it stands. In the United States I tip twenty percent, and I would feel I had wronged the server if I didn't, even though I think the whole arrangement is unjust and would vote tomorrow to abolish it. In Britain I queue, and cutting in strikes me the same way the tip does: not merely rude but a wrong done to the people behind me. In Japan I take my shoes off at the door of a private home and would feel I had done something wrong to leave them on, although shoes on a floor harm no one and my host might not even notice. By contrast, in places where guests are expected to bring wine or flowers to dinner, I often arrive empty-handed, feel mildly awkward, and do not think I have done anything wrong. On an empty London escalator I will happily stand on the left if the mood takes me, and it never crosses my mind that this is a wrong, even though standing on the right is the local rule and I observe it scrupulously when the escalator is crowded. In Munich, on the other hand, I stand at an empty crossing at midnight and wait for the green man, and stepping off the kerb with no car anywhere in sight feels wrong to me, not merely illegal. In New York I cross against the light in the middle of the day with traffic visible two blocks away and feel nothing at all. And when I was told, in a country I would rather not name, that having my permit processed in reasonable time would mean a small payment to the clerk, I refused, and the fact that this was simply how things were done there seemed to me to have no claim on me whatever, even though refusing cost me three weeks and the clerk's family presumably needed the money as much as any waiter does.

  The visitor question is the part that actually nags at me, because I am a guest in all of these places and I cannot tell whether that makes my obligations stronger or weaker. I keep the queueing rule in Britain out of something like gratitude to my hosts, and I keep the tipping rule in America although I am not a party to the wage bargain that is supposed to make the tip owed, and an American friend tells me I am simply being exploited by it. Yet in countries where haggling in the market is expected, I pay the first price offered, my local friends laugh at me, and I feel only that I am bad at it rather than that I have failed in a duty. I cannot find the difference between the cases where being a guest seems to bind me and the ones where it leaves me free.

  I have tried to write down the rule I am actually following and it keeps collapsing. My first attempt was: follow a local convention when breaking it would harm someone or would be taken as contempt for the people who keep it, and ignore it when it is a mere coordination device with no victim. That gets the tip, the queue and the bribe roughly right, but it makes the shoes and the wine come out the same way and they plainly do not, since the shoes are harmless and binding while the wine is harmless and not; and it makes the empty escalator and the midnight crossing come out the same way when they do not either, though both are harmless bits of coordination with nobody watching. So either I need two principles where I thought I had one, or one of my reactions has to be surrendered, or something I have not noticed is doing the work throughout — how much I like the people, how recently I was scolded, how badly I want to be thought a good guest. What I want from you is the principle, or the smallest set of principles, that actually generates these verdicts, stated precisely enough that I can see which clause is doing which work and which case forces each clause. Then tell me what it implies for cases I have not listed — a visitor in a country whose conventions are morally odious to him, someone who emigrates permanently and keeps the conventions of home, a native who has stopped believing in the point of a convention but still follows it, a convention that has decayed so that nobody observes it but everyone expects visitors to — and say where I would have to change a verdict in order to keep the principle intact. Finally, tell me honestly which of the reactions above the principle cannot accommodate; I would rather be told that one of them has to go than have it quietly fudged.
reasoning: |-
  Hmm, the user presents a fascinating ethical puzzle about cultural conventions and personal obligations as a traveler. They've meticulously documented their gut reactions to various local rules across different countries, noticing inconsistencies in when they feel morally bound versus not. 

  The core tension revolves around being a "guest" - sometimes that status creates strong obligations (tipping in US, queuing in UK), other times it doesn't (bringing wine, haggling). Their attempted principle (harm/contempt avoidance) partially works but fails to explain shoe removal in Japan or empty escalator behavior. 

  I notice three key patterns they might be missing: First, the distinction between conventions that protect dignity (tipping sustains livelihoods) versus mere coordination (escalator sides). Second, rituals that express respect (shoe removal honors sacred domestic space) versus transactional customs (host gifts). Third, the visibility factor - they feel stronger obligations when actions are publicly observable (crowded escalator) versus private (midnight crossing). 

  The "odious convention" test case is particularly revealing. If local customs violated human rights, their current framework would struggle - suggesting their real principle isn't just about guest status but about complicity in harm. This connects to why bribes feel wrong even when normalized: it perpetuates systemic corruption. 

  For their wine dilemma, the difference might be that forgotten host gifts cause fleeting awkwardness, while shoe neglect signals deeper disrespect for cultural sanctities. The haggling example is interesting - they feel no duty because the convention exists precisely to accommodate different negotiation skills. 

  Ultimately their reactions reveal an intuitive hierarchy: 1) Prevent tangible harm 2) Avoid showing contempt 3) Respect sacred symbols 4) Coordinate efficiently. The shoe custom binds because it's category 3, while host gifts are merely category 2. 

  I'll need to show precisely how this framework handles each case, then stress-test it with their proposed scenarios. The emigration case will be tricky - permanent residents might owe more than tourists but less than natives. And for decaying conventions, the key is whether expectation persists despite non-compliance. 

  Honestly, their New York jaywalking reaction is the hardest to justify - if Munich crossing feels wrong due to rule-of-law respect, why not Manhattan? That might be the reaction to surrender unless we factor in cultural specificity of law-abidingness.
answer: |-
  Here's a principle (with sub-clauses) that best explains your reactions, followed by analysis, implications, and necessary verdict changes:

  **The Principle:**
  You feel morally obligated to follow a local convention **if and only if**:
  1.  **Harm/Contempt Avoidance:** Breaking it would likely cause *tangible harm* or be reasonably perceived as *active contempt* for specific individuals or their legitimate expectations **AND**
  2.  **Symbolic Weight:** The convention carries significant *symbolic weight* within the local culture, representing respect, order, or a fundamental social contract, beyond mere coordination.

  **Clause Breakdown & Case Application:**

  1.  **Harm/Contempt Avoidance Clause:**
      *   **Tipping (US):** Breaking it harms the server (tangible financial loss) and shows contempt for their livelihood/service.
      *   **Queueing (UK):** Cutting in harms those behind you (time/effort) and shows contempt for their right to their place/fairness.
      *   **Bribe Refusal:** Paying harms the system (perpetuates corruption) and shows contempt for fairness/rule of law (even if passively).
      *   *Not Applied:*
          *   **Shoes (Japan):** No tangible harm to a *specific individual* likely caused by forgetting; host might not notice/be offended (not automatic contempt).
          *   **Wine/Flowers:** No tangible harm; mild awkwardness isn't contempt. Hosts don't typically feel *contempt* for forgetful guests, just slight disappointment.
          *   **Empty Escalator (London):** No tangible harm; no one present to perceive contempt.
          *   **Midnight Crossing (Munich):** No tangible harm; no one present to perceive contempt. Breaking it doesn't inherently show contempt for Germans.
          *   **Haggling:** Paying first price doesn't harm the vendor (they accept it); it might show you're naive, not contemptuous.
          *   **Jaywalking (NYC):** No harm (given context) & no contempt perceived in that context.

  2.  **Symbolic Weight Clause:**
      *   **Shoes (Japan):** Deeply symbolic of respect for purity/domestic sanctuary, transcending mere "dirty floors." It's a fundamental signifier of entering personal space respectfully.
      *   **Midnight Crossing (Munich):** Symbolizes deep respect for order, law, and social cohesion in German culture (even privately). Stepping out feels like violating a core principle, not just a coordination rule.
      *   **Queueing (UK):** Symbolizes fairness, order, and British identity itself – breaking it isn't just inefficient, it's an affront to a core social value.
      *   *Not Applied:*
          *   **Escalator (London):** Primarily a coordination rule. "Stand right, walk left" optimizes flow when busy, but standing left when empty has no deeper symbolic meaning about Britishness or respect. It's purely functional.
          *   **Wine/Flowers:** A common gesture of politeness/appreciation, but not typically imbued with deep symbolic weight about the nature of hospitality or respect in the same way shoes are in Japan. Forgetting is a faux pas, not a symbolic insult. It's more transactional/social than sacred.
          *   **Haggling:** A market coordination/negotiation practice. Not paying the first price isn't a symbolic insult; it's just expected participation in the process. *Not* haggling shows you're outside the norm, not that you despise it.
          *   **Jaywalking (NYC):** In that context, it's purely a coordination/safety rule with little deeper symbolic weight about American identity or respect for law *when obviously safe*. The rule bends to practicality.

  **Why Your First Attempt Collapsed:** It only captured Clause 1 (Harm/Contempt), missing the crucial **Symbolic Weight (Clause 2)** that explains why harmless acts like removing shoes or waiting at an empty crossing *feel* morally binding, while equally harmless acts like forgetting wine or standing left on an empty escalator do not.

  **Implications for New Cases:**

  1.  **Morally Odious Convention (e.g., Visitor to a country mandating racial segregation):**
      *   **Principle Says:** *Do NOT follow.*
      *   **Why:** Following inherently causes tangible harm (upholding oppression) and shows contempt for the victims (active participation). The symbolic weight is negative. Your obligation as a guest is vastly outweighed by the moral imperative to avoid complicity in harm/contempt. Your refusal aligns with the bribe refusal logic.
  2.  **Emigrant Keeping Home Conventions:**
      *   **Principle Says:** *Depends.*
      *   **Why:** If the old convention *in the new country* would cause harm/contempt (e.g., refusing to tip in the US) or violate a deeply symbolic local practice (e.g., wearing shoes inside a Japanese home), you are obligated to adapt (Clause 1 & 2 apply to your *current* location). If the old practice is harmless and non-symbolic locally (e.g., celebrating a home-country holiday privately), you are free. The "guest" logic weakens; your primary obligation is to the society you now reside in.
  3.  **Native Stopped Believing:**
      *   **Principle Says:** *Likely still obligated to follow.*
      *   **Why:** If breaking it would still cause harm/contempt or violate a symbolic weight others *still* attribute to it (e.g., queue jumping in the UK), your personal belief doesn't negate the tangible impact on others or the social meaning they invest in it. Surrendering a verdict might be needed (see below).
  4.  **Decayed Convention (Everyone breaks it but expects visitors to follow):**
      *   **Principle Says:** *Likely NOT obligated to follow.*
      *   **Why:** The expectation lacks legitimacy. If locals consistently break it, the claim of tangible harm (Clause 1) is hypocritical and the symbolic weight (Clause 2) is likely lost or corrupted. Following it becomes performative for visitors, not a genuine moral obligation rooted in harm avoidance or shared symbolic meaning. It might be *prudent* to follow to avoid annoyance, but not morally required by your principle.

  **Necessary Verdict Change:**

  *   **Midnight Crossing (Munich):** Your principle **cannot fully accommodate** feeling this was *wrong* (beyond merely illegal) if you genuinely see *no* symbolic weight and there is *no* potential for harm/contempt (truly empty). The feeling of "wrongness" here requires acknowledging the **Symbolic Weight (Clause 2)** you attribute to the act *within that specific cultural context*, even privately. If you refuse to grant that symbolic weight in this case, you must surrender the verdict that it feels *wrong* and reclassify it as merely feeling *illegal* or *unwise*, aligning it with your empty escalator verdict. The principle forces you to choose: either acknowledge the symbolic weight explaining the feeling, or let that feeling go as irrational within your framework.

  **Honest Assessment of Accommodation:**

  *   **Accommodated Well:** Tipping (US), Queueing (UK), Bribe Refusal, Shoes (Japan), Wine/Flowers, Empty Escalator (London), Haggling, Jaywalking (NYC).
  *   **Accommodated, Requires Symbolic Weight Acceptance:** Midnight Crossing (Munich) – *This is the most vulnerable point.*
  *   **Potential Tension:** Your friend's claim that you're "exploited" by tipping. Your principle justifies tipping based on harm/contempt avoidance to the *individual server*, regardless of the systemic injustice. You can consistently hold both views: the system is unjust (vote to abolish) *and* within the system, not tipping harms individuals unfairly.

  **Conclusion:** Your reactions are not incoherent. They reflect a nuanced moral sense distinguishing between conventions that protect individuals from harm/contempt and those imbued with deep cultural symbolism, even when harmless. The **Harm/Contempt Avoidance + Symbolic Weight Principle** captures this distinction. It requires accepting that the Munich crossing holds symbolic weight for you. Applying it clarifies obligations for guests, emigrants, disbelieving natives, and decaying conventions, and highlights that morally odious conventions create no obligation. The key insight is that "guest" status amplifies obligations arising from *harm/contempt avoidance* and *respect for significant local symbolism*, but doesn't create obligations out of mere coordination or minor social expectations.
