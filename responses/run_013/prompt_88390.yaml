prompt: |-
  I'm a postdoc and next Thursday I'm presenting at our department's game theory reading group (I'm only in it because my advisor is on the mailing list) and what I need from you is a Q&A prep sheet, not a defense. The room, roughly: two people who work on equilibrium refinements and know Selten's stuff backwards, one evolutionary guy who basically only believes claims he's watched survive in a simulation, one philosopher of decision theory who spends his life on Newcomb-adjacent puzzles, and a mechanism designer from the econ department who comes for the coffee and then asks the question that ruins your day. So the center of gravity is equilibrium concepts, refinements, and stability under perturbation, with one outlier in each direction.

  Here's what I'm defending, so the objections have something to bite: that superrationality is best understood not as a rival to expected-utility maximization but as an equilibrium selection principle for symmetric games. The claim is that when a game is symmetric and has a symmetric payoff-dominant profile, the fact that each player knows the other will reach the same conclusion as them — not that they're literally the same algorithm, just that they're both running this kind of reasoning — is enough to select the payoff-dominant profile, and that all the similar-minds talk in the original presentation of the idea is doing no real work. My two showcase cases are the stag hunt (I say superrationality gets Stag right) and a version of the prisoners dilemma where the players are only approximately identical, i.e. there's a small chance the other guy's reasoning process differs from mine, which is where I expect to get killed. I'd also like to claim this is continuous with the standard symmetry argument for symmetric games, but I'm honestly not sure that helps me or hurts me.

  So: give me the eight or so objections I'll actually get from this room, ordered by how likely they are times how much damage they do, each phrased the way these particular people would phrase it (the refinements people will put it one way, the evolutionary guy another, the decision theorist another — that difference matters to me, I want to recieve them in the vocabulary I'll actually hear). For each one: a two-minute reply, a note on where the reply is soft, and what I should just concede up front rather than fight. Tell me which objection I should preempt in the first two minutes of the talk itself, and where the weakest point in my own position is that I should prepare to defend rather than hope nobody notices. Please don't give me the objections I'd get from the online rationalist / functional-decision-theory crowd — I know those, and half this room has never heard of them and wouldn't be moved by them anyway; I want the ones this specific audience will actually raise. And include the one question I'm praying nobody asks, because I'm fairly sure there is one and I'd rather see it in writing on Sunday than seperate from my dignity in the seminar room on Thursday. No reading list or citations needed, I'm not citing anything in the talk.
reasoning: |-
  Okay, the user is a postdoc preparing for a game theory reading group presentation. They need a Q&A prep sheet focused on objections from a specific audience. Let me start by understanding their scenario. The audience includes experts in equilibrium refinements, an evolutionary game theorist, a decision theory philosopher, and a mechanism designer. Each has distinct perspectives. The user's thesis is that superrationality is an equilibrium selection principle, not a rival to expected utility, for symmetric games with payoff-dominant profiles.

  First, I should identify the key objections each member might raise. The refinements experts might question how superrationality differs from existing concepts like correlated equilibrium or trembling hand. The evolutionary guy would want simulation evidence. The philosopher might challenge the reasoning process itself, possibly bringing up Newcomb-like problems. The mechanism designer could point out incentive compatibility issues.

  The user mentioned two showcase cases: stag hunt and a perturbed PD. The PD with slight asymmetry is a vulnerability. They're worried about continuity with standard symmetry arguments. I need to prioritize objections by likelihood and damage. 

  For the refinements people, they might ask why superrationality is needed when other refinements exist. The reply should position it as a focal point based on symmetry, but concede it's not a refinement. The evolutionary critic will demand simulations. Since the user hasn't done any, they should admit it and offer it as future work. 

  The philosopher might argue that the "same conclusion" idea assumes a specific decision theory. The reply should distinguish between reasoning and algorithm, but this is a soft spot. The mechanism designer's killer question could be about non-symmetric games or prior misalignment, which undermines the whole approach. Preempting this in the talk is crucial.

  The user's weakest point is the perturbed PD case. If players are only approximately identical, superrationality might collapse to defection. Defending this requires showing that small perturbations still lead to cooperation, but that's mathematically tricky. They should concede it's a boundary case.

  The "pray nobody asks" question is likely about prior misalignment. If players know others might reason differently, even slightly, the equilibrium could break. This ties into the mechanism designer's focus on robustness. Preparing a fallback position here is essential.

  I should also consider if there are other objections. Maybe someone questions the payoff-dominance assumption or the symmetry requirement. The user needs replies that acknowledge limitations without weakening the core argument. Ordering objections by impact: the mechanism designer's question does the most damage, followed by the evolutionary simulation demand, then the refinements comparison. Preempting the mechanism designer's point early in the talk can mitigate risk. Highlighting the Stag Hunt success before introducing the PD case might help frame the discussion.
answer: |-
  Here are the 8 objections you'll face, ordered by (likelihood * damage), phrased in your audience's native tongues, with replies, soft spots, concessions, and strategic advice:

  ### **Top Objections & Replies**
  1.  **The Refinements Duo:** *"This sounds suspiciously like a primitive focal point argument dressed up in decision-theoretic clothing. How is ‘reaching the same conclusion’ materially different from Schelling’s salience, and why doesn’t it suffer the same lack of formal foundation? Existing refinements (like Risk-Dominance) already handle Stag Hunt without invoking mystical ‘shared reasoning’."*
      *   **Reply:** "It *is* a focal point argument, grounded *specifically* in the common knowledge of symmetry and payoff dominance. The key difference is the *source* of salience: not an arbitrary label, but the shared recognition that *we are in a symmetric game* and *both recognize the payoff-dominant outcome exists*. Selten’s trembling hand focuses on robustness to mistakes; this focuses on robustness to shared logical inference under symmetry."
      *   **Soft Spot:** Distinguishing it from "just Schelling" without formal machinery is hard. Your argument is fundamentally epistemic/psychological.
      *   **Concede:** "You're right, it's not a refinement like TP or Intuitive Criterion. It’s a *selection principle* leveraging symmetry + payoff dominance + common knowledge of rationality."

  2.  **The Evolutionary Guy:** *"Hold up. ‘Knowing they’ll reach the same conclusion’ isn’t replicator dynamics, it’s telepathy. Show me the simulation where populations with noisy imitation or slight heterogeneity reliably converge to your ‘superrational’ outcome in Stag Hunt or PD when the risk-dominant/defect equilibrium exists and is stable under standard evolutionary models. If it doesn’t evolve, why should I care?"*
      *   **Reply:** "Fair point, simulations are crucial. My claim isn’t evolutionary; it’s about one-shot reasoning under *explicit symmetry awareness*. Think of it as modeling highly sophisticated, self-reflective agents in a symmetric interaction, not a population process. The simulation question is excellent follow-up work!"
      *   **Soft Spot:** You haven't done the simulation. Evolutionary stability often favors risk-dominance.
      *   **Concede:** "In standard evolutionary models, risk-dominance often wins. This principle operates at a different level – individual reasoning in a uniquely symmetric context."

  3.  **The Mechanism Designer (Coffee Fiend):** *"Let’s break symmetry. Suppose Alice is 99% sure Bob is identical, but 1% sure he’s a naive cooperator or a defector-bot. In your perturbed PD, doesn’t EU maximization *immediately* tell Alice to defect? Your ‘equilibrium’ seems absurdly fragile to any uncertainty about the *process*, not just payoffs. How is this useful?"*
      *   **Reply:** "You've hit the boundary condition! The principle applies cleanly only under *common knowledge of symmetry and rational symmetry recognition*. That 1% break fundamentally changes the game. In Stag Hunt with perfect symmetry, Stag is selected. In PD with perfect symmetry, Cooperation *is* selected. Your perturbation destroys the necessary symmetry of knowledge."
      *   **Soft Spot:** This exposes the core weakness. Real agents always have some doubt.
      *   **Concede:** "Absolutely, with any doubt about mutual reasoning alignment, even small doubts, the argument collapses towards standard EU/dominance reasoning. Its power is *only* under strong, common-knowledge symmetry."

  4.  **The Refinements Duo (Follow-up):** *"If ‘shared reasoning’ is doing the work, doesn’t this imply players are effectively correlating their strategies? Is this just a clunky way to describe a correlated equilibrium where the correlating device is their shared understanding of symmetry?"*
      *   **Reply:** "An insightful analogy! However, correlated equilibrium typically requires an external signal. Here, the 'correlation' emerges endogenously *from* the players' identical reasoning process applied to the symmetric structure itself. The game's symmetry *is* the correlating device."
      *   **Soft Spot:** Formalizing this endogenous correlation cleanly is tricky.
      *   **Concede:** "Formally distinguishing it from a specific class of correlated equilibria is a valid challenge. The distinction lies in the *source* of the correlation being internal reasoning about the game form."

  5.  **The Decision Theory Philosopher:** *"This ‘reach the same conclusion’ step smells like bootstrapping. How does Player 1 *know* Player 2 will reach the same conclusion *without* Player 2 already knowing Player 1 will reach it? This seems circular. Are you smuggling in a Newcomb-like assumption of predictability or acausality?"*
      *   **Reply:** "No acausality needed! It's common knowledge: (1) The game is symmetric. (2) We are both rational EU maximizers. (3) We both know (1) & (2). Therefore, I know that *a rational agent facing this symmetric game*, knowing I face the same, will perform the same reasoning I do. The symmetry of the situation and the common knowledge break the circularity – we arrive at the shared conclusion *simultaneously* via identical logical paths."
      *   **Soft Spot:** Requires strong common knowledge assumptions that are philosophically fraught.
      *   **Concede:** "Yes, it relies on very high-order common knowledge of rationality and symmetry, which is idealized. But it's the same idealization used to justify Nash equilibrium in the first place."

  6.  **The Refinements / Evolutionary Crossover:** *"Why privilege Payoff-Dominance? In Stag Hunt, Risk-Dominance (Hare) is stable under more perturbations (trembles, learning). Your principle seems arbitrarily glued to one refinement criterion (Payoff-Dom) without justification beyond symmetry."*
      *   **Reply:** "Symmetry + Payoff-Dominance creates a *unique* focal point. Risk-Dominance is also symmetric in Stag Hunt! The principle leverages the fact that *among symmetric equilibria*, the payoff-dominant one is Pareto superior. Rational agents, knowing they are symmetric and both recognize this superiority, coordinate on it. Risk-Dominance addresses different concerns (robustness to uncertainty about actions), not coordination under perfect symmetry."
      *   **Soft Spot:** Doesn't fully address why PD trumps RD *within* the symmetry argument.
      *   **Concede:** "In contexts with significant strategic uncertainty, Risk-Dominance is often more compelling. This principle targets the specific case where symmetry awareness dominates other uncertainties."

  7.  **The Mechanism Designer (Again):** *"Symmetry is fragile. What about games with *almost* symmetric payoffs, or one player having a slightly different prior? Does your selection principle crumble completely, or is there a graceful degradation? If it crumbles, how is this more useful than just assuming correlated equilibrium directly?"*
      *   **Reply:** "It *is* fragile, as we saw with the PD perturbation. Its value is precisely in perfectly symmetric, one-shot coordination problems with multiple strict symmetric Nash equilibria. For 'almost symmetric' games, you'd need a different model, perhaps incorporating the degree of asymmetry. It's not meant as a universal tool, but a lens for a specific, theoretically important scenario."
      *   **Soft Spot:** Highlights limited applicability.
      *   **Concede:** "Yes, it crumbles under payoff asymmetry or uncertainty about symmetry. Its domain is narrow but potentially insightful for foundational puzzles like PD/Stag Hunt under idealized symmetry."

  8.  **The Evolutionary Guy (Follow-up):** *"Okay, ‘reasoning, not evolution’. But if this reasoning is so great, why didn’t it evolve? If sophisticated humans in symmetric lab games often fail to coordinate on payoff-dominant, doesn’t that empirically falsify your ‘rational’ principle?"*
      *   **Reply:** "Human behavior incorporates many factors: risk aversion, learning, social preferences, *and* reasoning. My claim isn't descriptive of average human play; it's a normative claim about what *deductive* rationality implies under strict symmetry and common knowledge. Lab failures could be due to lack of sufficient common knowledge, distrust, risk aversion overriding payoff dominance, or simply not engaging in this level of reflection. It explains *why* sophisticated subjects *sometimes* achieve coordination on Stag/Cooperation when they explicitly discuss symmetry."
      *   **Soft Spot:** Separating the normative claim from descriptive reality.
      *   **Concede:** "Human behavior often deviates due to bounded rationality or other motives. This is a model of ideal reasoning."

  ### **The Prayer-Nobody-Asks Question**
  *   **The Mechanism Designer (Killer Blow):** *"Assume common knowledge of symmetry and rationality. Player 1 reasons: ‘The symmetric payoff-dominant profile is (A, A). Since we are symmetric and rational, Player 2 will also conclude (A, A) is best. Therefore, I should play A.’ But wait – Player 2 is running the *exact same calculation*. Player 1 knows this. Doesn't Player 1 then realize that Player 2's choice of A *is contingent* on Player 2 believing Player 1 will play A? If Player 1 has *any* doubt that Player 2 doubts Player 1's play (even just doubt about doubt...), doesn't this recursive chain unravel back to the risk-dominant equilibrium or defection? How do you formally cut off this infinite regress without assuming *perfect, infinite-order* common knowledge of *exact* reasoning alignment – which is even stronger than common knowledge of rationality?"*
      *   **Why it's Devastating:** It directly attacks the foundational logic, exposing the potentially infinite regress required for "knowing they reach the same conclusion" to be stable under any self-doubt. It merges the philosopher's bootstrapping concern with the mechanism designer's fragility focus at the deepest level.
      *   **Damage Control Reply:** "This cuts to the heart of equilibrium concepts generally. Nash equilibrium itself requires players to correctly anticipate others' play, justified by common knowledge of rationality and the game. My principle adds the layer: common knowledge of symmetry allows players to *deduce* that mutual anticipation leads uniquely to the payoff-dominant symmetric profile. The regress is halted by the *public fact* of symmetry – it's the common ground that anchors the deduction. While infinitely high-order knowledge is idealized, the symmetry provides a concrete, shared basis for it that isn't present in asymmetric games. We accept similar idealizations for Nash." (Emphasize the public symmetry as the anchor).
      *   **Concede:** "Formally modeling the epistemic conditions without infinite regress is challenging. It relies on the agents being able to *simultaneously* deduce the solution based on the public symmetry."

  ### **Strategic Preparation**

  1.  **Preempt in the First 2 Minutes:** **The Mechanism Designer's Fragility Point (#3).** Frame your thesis early: "I claim superrationality selects the payoff-dominant equilibrium *if and only if* there is common knowledge of game symmetry, player rationality, and mutual recognition of symmetry. Crucially, it *fragments* with even slight uncertainty about reasoning alignment or payoffs. Its power is in this highly idealized, symmetric scenario."
  2.  **Weakest Point to Fortify:** **The Perturbed Prisoner's Dilemma.** This is your showcase case that will get shredded. Prepare rigorously:
      *   Clearly define the perturbation (e.g., small epsilon chance the other is a fixed-strategy type: cooperator/defector/random).
      *   Acknowledge bluntly: "For any epsilon > 0, standard EU says Defect dominates. Superrationality only works if epsilon = 0 *and* common knowledge holds." Don't try to fudge it.
      *   Argue *why* epsilon=0 is interesting: "It isolates the power of pure symmetry recognition, showing how EU + Symmetry CK => Cooperation, resolving the PD paradox under these strict conditions. It highlights the discontinuity introduced by any asymmetry."
  3.  **Where to Concede Gracefully:** Don't fight battles on:
      *   **Evolutionary Plausibility:** Concede it's not an evolutionary model.
      *   **Formal Status vs. Refinements:** Concede it's a selection principle, not a refinement like TP.
      *   **Human Behavior:** Concede it's normative, not necessarily descriptive.
      *   **Fragility:** Concede it breaks with any asymmetry/uncertainty.

  **Good luck!** Your awareness of the audience is your biggest strength. Frame your argument within *their* paradigms (Nash, refinements, symmetry) as much as possible, and steer hard into the idealization upfront. The coffee fiend is your most dangerous opponent – anticipate his fragility argument early and often.
