answer: |-
  What you describe is a fascinating and precise creative mechanism that occupies a unique space between conscious craft and emergent discovery. While no single established term perfectly captures its entirety, the closest existing concept is **parametric variation**—but this requires significant qualification and refinement to fit your phenomenon, as the term is often used more broadly in music composition, mathematics, or generative art. For your specific process, I propose the term **emergent variation**. Let me define it, distinguish it, and map its boundaries.

  **Emergent variation** is the methodical, iterative manipulation of discrete, formal parameters within an existing creative work—such as narrative tense, focal distance, sensory sequencing, or grammatical mood—applied one at a time and evaluated after each adjustment, until cumulative changes trigger a qualitative transformation. This transformation produces a new work (or passage) that feels invented rather than derived, despite originating solely through systematic modification. The "emergent" quality arises when the interaction of parameter shifts crosses a threshold, causing the original material to reconfigure into something functionally and experientially distinct. Crucially, the practitioner experiences this outcome as discovery, not mere alteration.

  Now, let’s delineate its edges:

  1.  **Distinction from Mere Imitation:**  
      Imitation replicates existing structures or styles. Your process begins with imitation (your original scene) but uses it as a substrate for controlled deformation. Imitation aims to preserve essence; emergent variation aims to destabilize it through formal constraints. When you shift tense or reorder sensory details, you are not copying but interrogating the scene’s DNA. The resultant work is unrelated to homage—it becomes a new entity, unrecognizable from its progenitor.

  2.  **Distinction from Combinatorial Creativity:**  
      Combinatorial creativity merges or recombines existing elements (ideas, tropes, structures) into novel configurations. Emergent variation does not introduce external elements. It isolates and manipulates inherent dimensions *of the same work*. Where combinatorial methods expand outward—adding, blending, juxtaposing—emergent variation works inward, deepening, refracting, or inverting. Your car scene isn’t combined with a new character or plot; it is rotated along invisible axes until light catches it differently, revealing latent possibilities.

  3.  **Distinction from Creation ex Nihilo:**  
      The romantic ideal of creation "from nothing" asserts pure spontaneity. Emergent variation openly acknowledges its scaffold: the original scene. Yet, by insisting on incremental, formal shifts—not inspired rewrites—it bypasses the illusion of divine spark. The "newness" emerges from the system itself, like a chemical reaction: predictable inputs (parameter changes) yield unpredictable outputs (qualitative transformation). You cannot foresee the emergent scene, yet you engineered its birth.

  **Boundaries of the Concept:**  
  An instance of emergent variation must include:  
  - A predefined *source work* (your car scene).  
  - Selection of *formal parameters* (tense, perspective granularity, sensory sequence—never plot or character directly).  
  - *Iterative application*: one parameter altered per cycle, followed by evaluation.  
  - A *threshold effect* where the work ceases to be a modification and becomes a distinct entity.  
  - The *subjective experience of discovery*—the "odd part" where you lose the tether to the original.

  It would **not** include:  
  - Rewriting for clarity or flow (no systematic parameter isolation).  
  - Parody or pastiche (dependent on external reference, not internal transformation).  
  - Brainstorming new ideas (lacks the structured iteration on a fixed source).  
  - Algorithmic generation (e.g., Markov chains)—your process is agentive, evaluative, and aesthetic.  
  - Adding/removing content (e.g., "what if the car explodes?")—emergent variation manipulates *how* content is presented, not *what* it is.

  **Nearest Confusable Concepts:**  
  - **Defamiliarization (Ostranenie):** Russian Formalist idea of making the familiar strange. But this describes an *effect* on the reader, not a generative *method* for the writer. Emergent variation uses defamiliarization as a tool toward invention.  
  - **Oulipian Constraints:** Systems like Georges Perec’s *A Void* (written without 'e'). These are generative rules applied *before* creation. Your method applies constraints *after* creation to dismantle and reconstitute.  
  - **Palimpsest:** Layering or erasure of texts. Emergent variation is sequential and additive in parameter space, not spatial or subtractive.  
  - **Drafts/Revisions:** General rewriting lacks the rigor of isolating single parameters iteratively. Most revision seeks improvement; emergent variation seeks metamorphosis.

  In essence, emergent variation is alchemy through rigor. You are not mining the subconscious (though it collaborates), nor are you assembling fragments. You are methodically stressing the formal joints of your work until it fractures into something unforeseen—not by accident, but by the inevitability of constrained experimentation. The term honors both the systematic "mechanics" you observe and the "strange" emergence you feel. Its power lies in the paradox: the most deliberate of processes births the most unexpected of creations.
