  Hmm. Their core question is whether this phenomenon has an established name or theoretical framework. They want clarity on how it differs from imitation, combinatorial creativity, and romantic "creation from nothing." They're clearly a serious writer—precise, analytical, deeply reflective about craft. The emotional undertone suggests fascination mixed with frustration: they've observed this pattern for years but lack the vocabulary to pin it down. 

  First, I need to mentally scan literary theory. Russian Formalism's "defamiliarization" (ostranenie) comes close—Shklovsky's idea that art makes the familiar strange—but it's more about reader perception than generative process. Structuralism's focus on systematic variation (think Propp's folktale functions or Levi-Strauss's myth transformations) feels adjacent but too broad. "Parametric writing" as a term exists in digital humanities, often tied to algorithm-driven changes, which isn't quite their manual, iterative tinkering. 

  The key distinctions they want: Against "mere imitation" (their method actively seeks discontinuity), against "combinatorial creativity" (it's not mixing elements but altering axes of presentation), and against "ex nihilo" romance (they acknowledge the seed is always prior material). Their process is dialectical: thesis (original scene) + antithesis (parameter shift) → synthesis (emergent novelty). 

  Coining a term feels necessary here. "Generative defamiliarization" captures the core mechanism—making the familiar unfamiliar to generate newness—but might be conflated with reader-response theory. "Parametric transfiguration" emphasizes the controlled axis shifts and the metamorphosis, but "transfiguration" carries religious baggage. "Emergent variation" is cleaner, foregrounding how novelty arises ("emergent") from systematic tweaks ("variation"). 

  Defining boundaries: An instance requires (1) preexisting material, (2) isolation of a single formal parameter (not content!), (3) iterative adjustments until qualitative shift occurs. Not an instance: rewriting for clarity (no systemic parameter focus), parody (goal is mimicry, not discovery), or brainstorming (no structured constraint). 

  Nearest confusable concepts: "Defamiliarization" (but that's an effect, not a method), "Oulipian constraints" (more about rule-bound generation than modifying existing work), "palimpsest" (about layering, not parameter shifts). 

  The writer’s meta-need seems to be validation—they’re describing a sophisticated, rigorous method but worry it’s "merely" mechanical. Naming it legitimizes their intuition that systematicity and inspiration aren’t opposed. They’d likely appreciate the emergent aspect: the transformation isn’t just perceptual but ontological (the work becomes "a different scene"). 

