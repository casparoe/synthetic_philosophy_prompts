prompt: |-
  I was up half the night having a proper arguement with my mate about whether restoring a habitat is actually good for the animals that end up living in it. I sit on the grants committee of a small wildlife trust, and we've got a proposal on the table to rewild a drained peat bog. The ecologist says it'll support billions of invertebrates -- mostly r-strategists with massive juvenile mortality -- plus some birds and small mammals, but almost all of them will die young, and a lot will die by predation or starvation. My mate says that's just factory farming for wildlife, and that leaving the land as low-productivity pasture would mean fewer animals and less total suffering. The rest of the committee is split, and I have to circulate a written opinion before Friday's meeting. Draft it for me: should we fund the rewilding, reject it, or approve it with conditions? Give a concrete recommendation with a time frame, and take my mate's side seriously rather than just waving the flag for nature. I'd also like you to use the ecologist's crude metric -- suffering-years per hectare -- and be honest about how bad the data is. Write it in American English, please.
