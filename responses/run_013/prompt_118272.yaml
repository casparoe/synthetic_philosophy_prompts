prompt: |-
  I teach a graduate seminar on collective intentionality, and I want to build one session around a diagnosis rather than a survey. My students can recite the standard menu — shared intentions assembled out of individual intentions plus mutual responsiveness, primitive we-intentions, joint commitment, the we-mode — without being able to say what any of it is meant to do. So I plan to hand them my own verdicts on a run of cases and ask them to find the principle behind them. Before I do, I want to see how the exercise goes, which is what I am asking you for.

  Here are my verdicts.

  1. Two friends walk to lunch together, matching pace, one slowing when the other stops to tie a shoe. Joint action, and the paradigm of it.

  2. Two strangers on a crowded sidewalk each drift to avoid a collision, each adjusting to the other, neither acknowledging the other. Not joint action — mere coordination.

  3. Two drivers arrive at a four-way stop at the same moment. Each watches the other, each waits, each proceeds only once the other has clearly yielded. Not joint action, even though each is exquisitely responsive to the other and each knows the other is being responsive to him.

  4. A jazz duo improvising: no score, no plan, no words, no prior agreement about what is coming. Each listens and answers. Joint action — to my ear as much a paradigm as case 1.

  5. A flash mob whose members have never met, cued by a text message at 3:00 p.m. Joint action.

  6. A market. Thousands of people pursuing private ends produce a highly ordered outcome that none of them intended as such. Not joint action, and not because of the numbers.

  7. Two people carry a table upstairs. One is doing it because the other ordered him to, and would walk away if he could. Still a joint action, I think, though a miserable one.

  Cases 3 and 4 are the pair I cannot get to sit still together, and cases 5 and 6 are a second such pair.

  The principle I have been working with, which I suspect is too strong: an episode is a joint action just in case each participant intends the whole activity and not merely his own contribution — the content of each intention is a we, rather than an I plus a prediction about the other fellow. I believe this breaks somewhere, though I am not certain it breaks where I think it does.

  What I want from you: (a) a principle, stated precisely enough that I could apply it to cases I have not listed, that captures as many of my verdicts as possible; (b) for each clause, the case that forces it, so I can see what I would lose by dropping it; (c) the verdicts your principle returns for two cases I have not given you — a person and a language model co-writing a paper, where the model has no intentions at all, and two correspondence chess players who never meet and who each suspect the other is a program; (d) an honest accounting of which of my seven verdicts your principle cannot accommodate, and whether you would rather keep the verdict or the principle; and (e) whether what you have offered is a criterion for joint action or only for shared intention, and whether it draws a line or a gradient. Do not survey the literature; I know where the usual positions stand. I want the principle, and the price of holding it.
reasoning: |-
  Hmm, this is a fascinating challenge from a professor teaching collective intentionality. They want me to help diagnose the underlying principle behind their intuitive judgments about joint action cases, rather than just surveying theories. Let me unpack this carefully.

  The professor has given seven cases with clear verdicts:
  - Cases 1 (friends walking) and 4 (jazz duo) are paradigmatic joint actions
  - Cases 2 (strangers avoiding collision), 3 (drivers at stop), and 6 (market) are not joint actions
  - Case 5 (flash mob) is joint action despite no prior relationships
  - Case 7 (forced table-carrying) is joint action even with asymmetric motivations

  They're particularly troubled by the tension between cases 3/4 (responsive drivers vs jazz improvisation) and 5/6 (flash mob vs market). Their working hypothesis about "we-intentions" seems insufficient.

  I need to extract a principle that explains most of these judgments. The key tension points suggest we need something that distinguishes mutual responsiveness with shared purpose (jazz, flash mob) from mere coordination without shared purpose (drivers, market). But we must also account for the coerced table-carrying where purpose isn't symmetric.

  Perhaps the core is about participants understanding themselves as playing complementary roles in a shared frame. For the jazz duo, they're both committed to "making music together" even without plans; for the flash mob, they're all participating in "this collective performance." Whereas drivers at a stop sign are just following traffic rules individually - there's no shared frame.

  For the additional cases:
  - Human-AI co-writing: If the human views it as collaboration, but the AI has no intentional states, is this joint action? Probably not, since jointness requires mutual (not necessarily symmetric) recognition.
  - Correspondence chess: Even without meeting or knowing if the opponent is human, if both understand they're playing the same game, it might qualify as minimal joint action.

  The market case fails because while individuals intend to trade, nobody intends "the market" as a collective entity. The coerced table-carrier still minimally understands his role in "moving this table," even if unwillingly.

  I'll formulate this as: Joint action occurs when participants (1) represent a shared activity type, (2) represent complementary roles in it, and (3) mutually believe they're so engaged. This handles the jazz/flash mob cases while excluding the drivers/market. The table case barely qualifies through minimal role-representation.

  The principle might break on case 7 if we require symmetric commitment, but the professor wants to include it. For the AI case, it clearly fails on mutual belief. The correspondence chess passes if both human players (even if mistaken) believe they're engaged in a shared game.
answer: |-
  Below is my systematic attempt to diagnose your intuitive verdicts, structured as requested. I'll present a principle derived from your cases, test it against your listed verdicts and the two new cases, and be transparent about trade-offs. The goal is to capture the *pattern* of your judgments, not to defend a preexisting theory.

  ### (a) The Proposed Principle
  **An episode qualifies as joint action iff:**  
  (i) Each participant *represents* the activity as a unified, shared endeavor type (e.g., "walking together," "improvising music," "performing a flash mob");  
  (ii) Each participant *represents* their own and the other’s role as *complementary contributions* to that endeavor type; and  
  (iii) Each participant *mutually believes* (to a minimal degree) that conditions (i) and (ii) hold among participants.  

  **Key clarifications:**  
  - "Represents" avoids requiring full-blown "intention" (e.g., allowing for improvisational or coerced cases).  
  - "Endeavor type" is abstract (e.g., "making music" not "playing this specific riff").  
  - "Complementary" means roles are interdependent and non-substitutable (e.g., walking *together* requires mutual pace-matching; avoiding collision does not).  
  - "Mutual belief" is minimal: a participant’s expectation that others see the activity similarly, even if unspoken (weaker than Gilbert’s joint commitment).  
  - *Not required*: Shared goals, symmetric motivations, prior agreement, or affective bonds.  

  ### (b) How the Principle Explains Your Verdicts (and Forces Clauses)
  - **Case 1 (Friends walking):** Joint action.  
    - *Forces (i) and (ii)*: Both represent "walking together" as a shared endeavor with complementary roles (pace-matching). Without (i)/(ii), this collapses into parallel walking.  
  - **Case 2 (Strangers avoiding collision):** Not joint action.  
    - *Forces (i)*: Neither represents a *shared endeavor*; each acts for individual safety. Coordination is emergent, not represented as joint.  
  - **Case 3 (Drivers at stop):** Not joint action.  
    - *Forces (ii) and (iii)*: Each represents only their *own* role ("I yield") and predicts the other’s behavior, but not complementary roles in a *shared* endeavor (e.g., no "we are resolving right-of-way"). Mutual responsiveness is individual risk-avoidance.  
  - **Case 4 (Jazz duo):** Joint action.  
    - *Forces (i) flexibility*: Represents "improvising together" as shared endeavor, with roles complementary (listening/responding). No prior plan needed.  
  - **Case 5 (Flash mob):** Joint action.  
    - *Forces (iii) minimal mutual belief*: All represent "performing this mob" as shared endeavor with complementary roles (e.g., synchronizing actions). Mutual belief arises from the cue (text), even without interaction.  
  - **Case 6 (Market):** Not joint action.  
    - *Forces (i) and (ii)*: Individuals represent private ends ("I sell bread") and predict others, but no representation of a *shared endeavor* ("the market") or complementary roles (buyers/sellers are interchangeable).  
  - **Case 7 (Coerced table-carrying):** Joint action.  
    - *Forces (ii) asymmetry*: Coerced agent still minimally represents "carrying this table" as a shared endeavor with complementary roles (e.g., "I hold this end, you hold that"). Motive (e.g., obedience vs. willingness) doesn’t break (i)/(ii).  

  ### (c) Verdicts for New Cases
  - **Human and AI co-writing a paper:**  
    - **Verdict:** Not joint action.  
    - **Why:** The AI has no representation of a "shared endeavor" or "complementary roles" (it lacks intentional states). The human may represent collaboration, but mutual belief (iii) fails—the AI cannot hold beliefs about joint activity. Coordination occurs, but asymmetrically (like using a tool).  
  - **Two correspondence chess players (each suspects the other is a program):**  
    - **Verdict:** **Joint action** (minimal/attenuated).  
    - **Why:** Each player represents "playing chess" as a shared endeavor with complementary roles (e.g., "I am White, they are Black"). Mutual belief (iii) holds at baseline: both act *as if* the other is an agent playing the game, even if they doubt it. The shared framework (chess rules) sustains (i)/(ii).  

  ### (d) Accounting for Mismatches and Trade-offs
  - **Fully accommodated:** Cases 1, 2, 3, 4, 5, 6.  
  - **Tension with Case 7:** The principle *accepts* your verdict (joint action), but this comes at a cost.  
    - **Trade-off:** Including coerced cases requires a "thin" view of (i)/(ii). If you dropped asymmetry tolerance (e.g., adding "each endorses the endeavor"), you’d exclude Case 7 but better capture the "collaborative spirit" of Cases 1/4/5. *Recommendation:* Keep the principle as is if you value structural role-representation over motivational symmetry.  
  - **No mismatches:** All seven verdicts are captured, but Case 7 strains intuition. If you *wanted* to exclude it, add: "(iv) No participant is *solely* motivated by external coercion." But this breaks your verdict.  

  ### (e) Nature of the Principle  
  - **Criterion for:** Joint action (not just shared intention). Shared intention is implied by (i)–(iii) but not necessary (e.g., improvisation lacks pre-formed intention).  
  - **Line or gradient?** A **threshold** (line), but with **attenuated degrees**:  
    - Strong: Cases 1/4 (rich mutual belief).  
    - Minimal: Cases 5/7/correspondence chess (thin mutual belief, asymmetric buy-in).  
    - The "jointness" gradient depends on the *strength* of mutual belief (iii) and *specificity* of (i)/(ii).  

  ### Why This Principle? The Price of Holding It  
  - **Captures your intuitions:** Explains why mutual responsiveness isn’t enough (Cases 2/3) and why unplanned/coerced cases count (4/5/7).  
  - **The cost:**  
    - **Over-inclusion?** Correspondence chess might feel "less joint" than friends walking. Reply: Joint action can be minimal but still real.  
    - **Under-specifies "endeavor type":** What counts as "shared"? (e.g., Is a conversation joint action? The principle says yes—roles are complementary).  
    - **Risk of circularity?** "Shared endeavor" sounds close to "joint action." Mitigation: The endeavor is defined by its representational content (e.g., "walking together" vs. "walking near someone").  
  - **Your working hypothesis refined:** Your "we-intention" idea is close but too strong for improvisation (no explicit "whole activity" intention) and too weak for coercion (the coerced agent may not "intend the whole"). This principle replaces "intention" with "representation" and adds structural roles/mutual belief.  

  This exercise suggests your verdicts prioritize *structural interdependence within a shared frame* over psychological unity. If your students resist (e.g., Case 7), ask: "Is the coerced table-carrier *doing something with* the other, or just *beside* them?" Your "yes" points to roles, not motives.
