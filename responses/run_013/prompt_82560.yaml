prompt: |-
  so theres this old Hofstadter thing, the Person Paper, where he writes a whole column as if english marked race the way it marks sex -- the words we treat as neutral get race-marked the way man is sex-marked, and everyone in the imagined world acts like thats just how the language is, nothing to see here. the gag is that the race version reads as obviously absurd while the sex version reads as completely normal. I want to use it as a test case but first I need the spec.

  so: write me the desiderata for a theory of default assumptions in language. what does any theory of this word quietly makes one group the norm and everyone else the deviation have to deliver before I should take it seriously? things like -- which cases it has to get right (generic masculine, marked forms like lady doctor or male nurse, the race-swap satire itself, cases where the marked form is the insulting one, cases where a term got reformed and nothing changed, slurs vs mere generics, honorifics, pronoun conventions), which distinctions it cant collapse (word vs use, speaker intent vs hearer uptake, grammatical gender in languages where it's arbitrary vs semantic gender, a term being demeaning vs a term being about sex at all, offense taken vs default-assuming), and which findings it cant contradict -- theres psycholinguistic work on what generic masculine actually brings to mind, and theres the awkward fact that plenty of languages mark gender everywhere and the speakers dont seem to walk around with the matching defaults.

  for each requirement give me the case or consideration behind it. then say which ones are negotiable and which arent, and flag any pair I probably cant have at once -- for instance if it has to treat the satire as a valid reductio, does it also have to explain why the same move gets called a false equivalence when the axis is switched (history, biology, whatever the objector points at)? if one requirement does most of the work of killing off the popular accounts, tell me which and why. skip the scorecard of authors, I'll do that part myself.
reasoning: |-
  Okay, the user is referencing Hofstadter's "Person Paper" satire, which swaps gender and race markers in English to highlight how normalized gender marking is. They want a framework to evaluate theories about linguistic defaults—specifically, how language sets one group as the norm and others as deviations. 

  First, I need to break down what they're asking for. They want desiderata (essential requirements) for such a theory, covering cases like generic masculines ("he" for generic), marked forms ("lady doctor"), the race-swap satire itself, and more. They also want distinctions the theory must respect, like word vs. use or speaker intent vs. hearer uptake, and findings it can't contradict, like psycholinguistic data. 

  The user is clearly deep in this topic—they mention psycholinguistics, cross-linguistic comparisons, and even flag potential contradictions (e.g., if a theory endorses the satire as reductio ad absurdum, must it also handle objections about "false equivalence" when axes like history/biology are invoked?). Their unspoken need seems to be: "I want to rigorously test theories, not just dunk on bad ones." They might be preparing academic work or a critical essay, so they need a structured, neutral framework. 

  Now, structuring the response. The core challenge is balancing comprehensiveness with clarity. I'll group desiderata into three buckets: (1) Coverage (cases the theory must explain), (2) Distinctions (conceptual lines it must draw), and (3) Constraints (empirical/pragmatic limits). For each, I'll note the underlying case/reason, negotiability, and conflicts. 

  Key pitfalls to flag: 
  - **The satire's double bind**: If a theory says the race-swap is valid criticism, it must also explain why people dismiss it as "false equivalence." But those objections often appeal to external factors (history, biology), which a purely linguistic theory might not handle. That's a tension. 
  - **Psycholinguistic data vs. intuition**: People *think* generic "he" is neutral, but studies show it primes male images. A good theory can't ignore that gap. 
  - **Cross-linguistic awkwardness**: If a language marks gender heavily (e.g., Spanish), why don't speakers default to male norms as strongly as English speakers? A theory must account for that disconnect without overgeneralizing. 

  Non-negotiables: 
  - Handling the satire's core insight (defaults feel arbitrary when shifted). 
  - Respecting the word/use distinction (e.g., "actor" isn't inherently male-marked; usage made it so). 
  - Incorporating psycholinguistic findings. 

  Negotiables: 
  - Specifics of how intent vs. uptake works. 
  - Whether all marked forms (like "male nurse") stem from the same mechanism. 

  Finally, I'll emphasize that the satire requirement (#1) is a killer for popular accounts (e.g., "biological essentialism" fails because race biology is pseudo-science, yet the satire still feels absurd). The user likely already knows this but wants it formalized. 

  ... Time to draft.
answer: |-
  Here's a rigorous set of desiderata for evaluating theories of linguistic defaults (e.g., unmarked/marked forms, generic masculines), grounded in the Hofstadter satire and linguistic realities. Requirements are categorized, with cases/considerations, negotiability, and conflicts highlighted.

  ---

  ### **I. Empirical Coverage (Cases the Theory Must Get Right)**
  1. **The Satire Itself (Race-Swap Test)**  
     *Case*: Hofstadter's column. Must explain why marking sex (e.g., "female doctor") feels neutral, while marking race (e.g., "white doctor") feels absurd.  
     *Non-Negotiable*: Core test case. Failing here invalidates the theory.  
     *Conflict*: Risks contradiction with historical/biological objections (see Constraint #7).

  2. **Generic Masculine ("he" as default, "man" for humanity)**  
     *Case*: Historical/colloquial use of "he" in constitutions, job descriptions. Psycholinguistics shows it primes male imagery (e.g., Hamilton 1988).  
     *Non-Negotiable*: Central example of default assumption. Must align with empirical priming studies.

  3. **Marked Forms for "Deviation" (e.g., "lady doctor", "male nurse")**  
     *Case*: Implies rarity (nurses are assumed female; doctors male). Must explain asymmetry: "woman professor" marks gender, but "man professor" is redundant.  
     *Negotiable*: Specific mechanisms causing marking (social vs. statistical rarity).  
     *Conflict*: Must not conflate with neutral occupational terms (e.g., "server" vs. "waitress").

  4. **Marked Forms as Insults (e.g., "Jew" vs. "Jew lawyer")**  
     *Case*: Adding a category marker can imply suspicion (e.g., "male babysitter" vs. "gay male babysitter"). Theory must distinguish neutral marking from pejorative marking.  
     *Non-Negotiable*: Shows marking isn’t benign; can activate stereotypes.

  5. **Term Reform Without Change (e.g., "fireman" → "firefighter")**  
     *Case*: Reforms like "chairperson" reduced male priming despite identical referents. Must explain why surface form affects default assumptions.  
     *Non-Negotiable*: Proves defaults are linguistic, not just ontological.

  6. **Slurs vs. Mere Generics (e.g., "Black" vs. racial slur)**  
     *Case*: Slurs encode contempt; marked generics ("Black doctor") encode deviation. Theory must distinguish semantic marking from expressive violence.  
     *Negotiable*: Whether slurs belong in *this* theory (vs. separate account of derogation).

  7. **Honorifics & Pronouns (e.g., "Ms." vs. "Mrs.", "they" as singular)**  
     *Case*: "Ms." was coined to avoid marking marital status; singular "they" avoids binary gendering. Must address how defaults shift via conscious intervention.  
     *Negotiable*: Degree to which honorifics are governed by same rules as nouns.

  ---

  ### **II. Conceptual Distinctions (Must Not Collapse)**
  1. **Word vs. Use**  
     *Case*: "Actor" is now gender-neutral in many uses, but "actress" persists. Theory must separate lexical conventions from contextual usage.  
     *Non-Negotiable*: Prevents conflating semantic change with speaker intent.

  2. **Speaker Intent vs. Hearer Uptake**  
     *Case*: A speaker may use "he" generically without sexist intent, but hearers visualize men. Must explain asymmetries in interpretation.  
     *Non-Negotiable*: Psycholinguistic data shows uptake often defies intent.

  3. **Grammatical vs. Semantic Gender**  
     *Case*: German "Mädchen" (girl) is neuter grammatical gender. Must not conflate arbitrary grammatical systems with semantic defaults (e.g., "doctor" as male).  
     *Non-Negotiable*: Cross-linguistic validity requires this distinction.

  4. **Demeaning vs. Marking Category**  
     *Case*: Calling a woman "lady scientist" may be demeaning, but marking category isn’t inherently insulting (e.g., "female athlete"). Theory must isolate marking mechanics from evaluative load.  
     *Negotiable*: Whether marking *always* carries evaluative baggage.

  5. **Offense Taken vs. Default-Assuming**  
     *Case*: Objections to "male nurse" may stem from challenging stereotypes, not the term itself. Theory should distinguish systemic bias from individual offense.  
     *Non-Negotiable*: Avoids reducing critique to "oversensitivity".

  ---

  ### **III. Empirical & Pragmatic Constraints (Must Not Contradict)**
  1. **Psycholinguistic Priming Data**  
     *Finding*: Generic "he" primes male imagery; "they" or paired forms ("he or she") reduce this. Defaults cognitively reinforce norms.  
     *Non-Negotiable*: Theory must align with experimental evidence.

  2. **Cross-Linguistic Inertia**  
     *Finding*: Languages with pervasive grammatical gender (e.g., Spanish) don’t necessarily have stronger real-world gender defaults than English.  
     *Implication*: Marking ≠ cognitive/social dominance. Theory must explain why heavy marking doesn’t amplify defaults.  
     *Non-Negotiable*: Counters "biological inevitability" claims.

  3. **Asymmetry in "False Equivalence" Objections**  
     *Case*: Critics argue race/sex aren’t analogous (due to history, biology, etc.). Theory must either:  
     - Explain why satire *is* valid despite objections, or  
     - Incorporate sociohistorical factors shaping which defaults feel "natural".  
     *Conflict*: Directly clashes with Satire Test (#I.1). **Unresolvable tension** for purely linguistic theories.

  ---

  ### **Killer Requirements & Why**
  1. **The Satire Test (#I.1)**  
     *Why it kills popular accounts*:  
     - **Biological Essentialism**: Fails because race biology is discredited, yet the satire *still* works.  
     - "**Statistical Rarity**" Theories: Fails because women are 50% of humans, not a minority.  
     - **Traditionalism** ("It’s just grammar"): Fails because race-marked grammar feels absurd.  

  2. **Psycholinguistic Constraints (#III.1)**  
     *Why it kills*: Shows generic masculines aren’t truly neutral. Undermines theories claiming "he" is semantically unmarked.

  3. **Word vs. Use Distinction (#II.1)**  
     *Why it kills*: Forces theories to address language as a dynamic system, not a fixed set of rules. Refutes prescriptivist defenses.

  ---

  ### **Negotiable vs. Non-Negotiable Summary**
  | **Requirement**                     | **Negotiable?** | **Reason**                                                                 |
  |-------------------------------------|-----------------|----------------------------------------------------------------------------|
  | Satire validity (I.1)               | No              | Core litmus test                                                           |
  | Psycholinguistic alignment (III.1)  | No              | Empirical bedrock                                                          |
  | Word vs. use (II.1)                 | No              | Prevents category errors                                                   |
  | Cross-linguistic inertia (III.2)    | No              | Counters linguistic determinism                                            |
  | Marked forms as insults (I.4)       | Partially       | Mechanism may vary, but effect must be explained                           |
  | Term reform success (I.5)           | Partially       | Social factors influence adoption, but effect must be addressed            |
  | Honorifics (I.7)                    | Yes             | May operate under distinct pragmatic conventions                           |
  | Slurs vs. generics (I.6)            | Yes             | Better handled by theories of derogation                                   |

  ---

  ### **Key Conflicts to Wrestle With**
  - **Satire vs. "False Equivalence" (#I.1 vs. #III.3)**  
    *The Dilemma*: If the theory treats race/sex marking as analogous, it must explain why objections invoking history/biology are invalid or irrelevant. If it treats them as distinct, it must define *which* social axes are subject to default-making and why.
    
  - **Cognitive Priming vs. Cross-Linguistic Inertia (#III.1 vs. #III.2)**  
    *The Dilemma*: If generic masculines prime male imagery, why don’t grammatically gendered languages (e.g., German) show *stronger* male defaults? Theory must reconcile local priming effects with global linguistic variation.

  ---

  ### **Bottom Line**
  A serious theory must:  
  1. **Pass the Hofstadter test** (explain why sex-marking feels neutral but race-marking is absurd),  
  2. **Respect psycholinguistic data** (acknowledge defaults prime cognitive bias),  
  3. **Avoid collapsing critical distinctions** (especially word/use and intent/uptake),  
  4. **Grapple with cross-linguistic puzzles** (why heavy marking ≠ stronger defaults).  

  The biggest trap is underestimating **III.3** (the "false equivalence" rebuttal). A defensible theory must either dismantle this rebuttal or incorporate sociohistorical factors—but the latter risks diluting linguistic generality. Start your evaluation here.
