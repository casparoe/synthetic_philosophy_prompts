prompt: |-
  I'm building a problem set for my grad seminar on Davidson and I want a case built to order instead of the usual Twin Earth retread, so bear with the spec sheet.

  Construct a scenario for radical interpretation. Constraints: the interpreter has to be an ordinary human being (no Martians, no lost tribes, no brain in a vat), and has exactly the evidence Davidson allows -- the speaker's dispositions to assent to and dissent from sentences under observable conditions, nothing more. No bilingual informant, no dictionary, no pre-shared language, no peeking at what's going on "inside." Keep the setup to a couple of paragraphs.

  The scenario has to leave two interpretations standing that fit every scrap of that evidence: they agree on every assent/dissent fact yet disagree about (a) what the speaker's words mean and (b) which of the speaker's beliefs come out true. And I want the disagreement to land specifically on the logical vocabulary -- one reading takes a certain particle as conjunction, the other as disjunction -- so the two readings distribute truth differently across the speaker's beliefs even though the observable profile is identical. Don't let simplicity or some other formal tiebreaker obviously favor one; if it does anyway, say so and tell me why.

  Then do the work. Show that both interpretations pass the charity test (each maximizing agreement its own way), or, if only one does, show exactly where the other one fails. Tell me which feature of the case is doing the heavy lifting and what happens to the whole thing if you pull that feature out. Finish with what Davidson is committed to saying here -- does he get to pick a winner, or is this an indeterminacy he just has to live with? -- and give me the strongest line a realist about meaning would take to insist there's a fact of the matter the interpreter is missing.

  One more thing: I'm handing this to students who'll immediately ask what the case is *for*, so somewhere in there say what philosophical point the scenario is meant to make, and why a version that just stipulates the two interpretations differ in meaning (rather than generating the diffrence from the evidence conditions) would be cheating.

  Write it in American English, thanks.
