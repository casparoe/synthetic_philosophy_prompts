  First, criminal guilt. Since the perpetrators are dead, trials aren't possible. The user points out the deal's legal language without legal responsibility. So criminal guilt here is symbolic. The refusal to accept legal responsibility means no legal consequences, but maybe symbolic trials or historical acknowledgment could be relevant.

