  ### Runnable In-Class Activity: Traffic Flow Simulation

  **Objective:** Students experience emergent phenomena in a traffic simulation to grasp core philosophy of science concepts (without initial jargon).

  ---

  #### **Materials & Setup**
  - **Tape:** Create a loop of 20 positions on the floor (circle/oval).
  - **Index Cards:** Two colors (e.g., green = "car", red = "empty"). Distribute one per student.
  - **Timer:** Phone with loud alarm for 5-second beats.
  - **Whiteboard:** Track density, flow, and predictions.
  - **Prediction Sheets:** Paper for students to record guesses per round.

  #### **Roles**
  - **Traffic Authority (TA):** 
    - Chosen by volunteer or lottery at the start. 
    - **Duties:** 
      - Sets density (number of cars) each round by assigning green cards.
      - Starts/stops the timer, calls "CHECK" and "MOVE."
      - Records cars passing a fixed point (e.g., between positions 20→1).
      - Enforces rules (no movement before "MOVE").
  - **Drivers (Students):** 
    - Stand on positions, hold cards. 
    - Follow movement rules. Record predictions.
  - **Flow Counter (Optional):** One student tallies cars passing the fixed point.

  ---

  #### **Rules & Procedure**
  1. **Movement Rules (Per 5-Second Beat):**
     - **CHECK Phase (2 sec):** 
       - All cars check the position immediately ahead (clockwise). 
       - If the next position is empty, raise your hand. 
     - **MOVE Phase (3 sec):** 
       - Cars with hands raised swap places with the empty ahead. 
       - Empties move backward to the vacated spot. 
       - *Simultaneity:* TA ensures no one moves until "MOVE" is called. 
       - *No Overtaking:* If two cars could move (e.g., `[car] [empty] [car]`), only the front car moves. 

  2. **Scoring & Stakes:**
     - **Individual Score:** Drivers earn 1 point per move (recorded privately). 
     - **Group Bonus:** If the class’s *predicted flow rate* (cars/beat) is within 10% of actual, all earn 1 bonus point (symbolic; e.g., candy or extra credit). 
     - **No Real Money:** Points are tokens (e.g., paper stars) redeemable for trivial rewards (e.g., bragging rights).

  3. **Rounds:**
     - 5 rounds with densities: 5, 10, 15, 18, 20 cars (fixed per round). 
     - **Between Rounds:** TA adds/removes cars. Drivers rearrange positions freely (to test "coaching" futility). 
     - **Per Round Flow:** Average cars passing fixed point over 10 beats.

  4. **Prediction Commitment:**
     - Before each round, drivers write privately: 
       - *"How many times will I move in 10 beats?"* 
       - *"How many cars/beat will pass the fixed point?"* 
     - TA collects predictions; records density and target flow on whiteboard.

  ---

  #### **Minute-by-Minute Plan** (Total: 75 min)
  - **0–5 min:** Setup. 
    - Tape loop, assign roles, distribute cards. 
    - Explain rules (no philosophy terms). Demo with 3 students. 
  - **5–10 min:** Practice (Density: 5 cars). 
    - Run 5 beats. Focus on mechanics (simultaneity, swaps). 
  - **10–25 min: Round 1 (5 cars).** 
    - TA sets density. Drivers arrange freely. 
    - **Predictions:** Drivers commit guesses (1 min). 
    - Run 10 beats. TA records flow. 
    - Drivers tally moves. 
  - **25–40 min: Round 2 (10 cars).** 
    - Repeat prediction → run → record. 
  - **40–50 min: Round 3 (15 cars).** 
    - Note: Emergent jams appear. 
  - **50–60 min: Round 4 (18 cars).** 
    - Drivers try rearranging to "fix" jams (futile). 
  - **60–70 min: Round 5 (20 cars).** 
    - Total gridlock (no movement possible). 
  - **70–75 min:** Transition to debrief. 

  ---

  #### **Key Intervention & Prediction Moments**
  - **Round 4 (18 cars):** 
    - Before starting, ask: *"Arrange yourselves to maximize your own speed."* 
    - After predictions, ask: *"Can you arrange to maximize group flow?"* 
    - **Outcome:** Jam persists regardless of arrangement. Students see: 
      - Individual speed ≠ group flow (trade-off). 
      - Jam moves backward (e.g., `[stopped car] ← [gap]` pattern) while cars inch forward. 
  - **Prediction Contrast:** 
    - Low density (Round 1): Predictions accurate (individual control). 
    - High density (Round 4): Predictions fail (emergent control). 
    - Whiteboard shows flow peaks at ~10 cars, drops sharply after 15.

  ---

  ### **Debrief** (20–25 min)
  **Map Activity to Philosophy:**  
  | **Activity Moment**          | **Philosophical Concept**       | **How Activity Supports It**                                                                 |
  |------------------------------|---------------------------------|----------------------------------------------------------------------------------------------|
  | Rearranging cars changes nothing (Round 4) | **Reductionism Falters**        | Micro-knowledge (individual rules) doesn’t predict macro-behavior; aggregate density does.   |
  | Flow/density relationship    | **Autonomy of Special Sciences**| Flow rate is projectible/reliable, but not about any car (a "higher-level" fact).             |
  | Jam moves backward           | **Emergence**                   | Jam is a persistent, causal entity (students blame it) not reducible to car-states.          |
  | Flow vs. speed trade-off     | **Non-Ideal Explananda**        | No "law" without a target (e.g., speed vs. flow); laws depend on pragmatic goals.            |

  **Gaps & Nuances:**  
  1. **Hard vs. Impossible Prediction:**  
     - Activity shows traffic jams are *hard to predict* from micro-rules without simulation.  
     - **But:** This doesn’t prove they’re *in-principle irreducible*. Stress: Complexity ≠ metaphysics.  
     - **How to say it:** *"Just because we need shortcuts (like flow-rate laws) doesn’t mean reality lacks micro-foundations. But it might mean our explanations do."*  

  2. **Higher-Level Causation:**  
     - Students treat the jam as causal (e.g., *"It made me stop!"*).  
     - **But:** Activity can’t prove if the jam *truly* causes anything or is "just" a pattern.  
     - **How to say it:** *"Is the jam ‘real’? It supervenes on cars, but it has stable effects. Science often treats such patterns as causal—even if metaphysicians debate it."*  

  **Predictable Problems & Fixes:**  
  - **Problem:** Students move early, breaking simultaneity.  
    **Fix:** TA strictly enforces "CHECK/MOVE" phases; remove points for cheating.  
  - **Problem:** Jam formation unclear at first.  
    **Fix:** After Round 3, ask: *"Did you see a ‘thing’ traveling backward? Draw it."*  
  - **Problem:** Flow counter misses passes.  
    **Fix:** TA also counts; use averages over 10 beats.  

  **Why This Works:**  
  - Students *feel* the jam’s "agency" and frustration of micro-control.  
  - Flow/density trade-off forces them to confront explanatory goals (speed vs. throughput).  
  - Predictions fail precisely when emergence dominates—making the abstract visceral.  

  **Final Note:**  
  End by naming positions: *"What you called ‘jams’ and ‘flow’ are what philosophers call emergence and autonomy. Now, let’s debate if they’re real."* Transition to readings.
