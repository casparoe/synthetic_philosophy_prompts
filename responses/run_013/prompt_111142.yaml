    - We have the table on the board: Density (k) vs Flow (q) and vs Average Speed (v). We plot (mentally) q vs k: it should increase then decrease. And v vs k: it should decrease as k increases.

    - The instructor leads a discussion:

      Step 1: Ask students to describe what they experienced. 
        - At low density: "I moved almost every beat." 
        - At high density: "I moved rarely, and when I did, it was only once and then I got stuck again."

      Step 2: Point out the aggregate relation: 
        - Flow (q) first increased and then decreased with density (k). 
        - Average speed (v) decreased with density.

      Step 3: Highlight the key insights:
        - **Micro-facts vs Macro**: Even though we knew the rule for each car, and we could arrange the cars arbitrarily at the start, once we ran the system, the traffic pattern emerged. At high density, no arrangement of the same cars could prevent the stoppages. 
        - **The moving stoppage (jam)**: At high density (e.g., 18 cars), the system settled into a pattern where a gap (empty) travels backwards and the cars move forward in a burst. This "jam" is a persistent pattern that moves. Ask: "Did you notice a wave? Did you blame the jam for your lack of movement? How did you try to influence it?" 
        - **Trade-off**: When they wanted to maximize flow, they needed a medium density (around 10 cars). But when they wanted to maximize their own speed, they wanted low density. The group goal (flow) and individual goal (speed) conflicted at high density.

      Step 4: Introduce the philosophical vocabulary and map:
        - **Reduction**: We have a complete micro-level description (the rule for each car). But knowing the micro-rule doesn't help us predict the aggregate behavior without simulating the whole. And once we have the aggregate, it's the stable, projectible thing (the flow-density relation).
        - **Emergence**: The traffic jam is an emergent entity: it moves, it persists, and it affects the cars. It is not present in the micro-rules.
        - **Autonomy**: The special science (traffic science) has its own law: the fundamental diagram (flow vs density). This law is not derivable from the micro-rules without running the simulation? But note: we can derive it mathematically for this model? Yes, but in more complex systems, it might not be. And the point is that the aggregate law is the one that is useful for prediction and control.
        - **Supervenience**: The macro-state (flow, jam) supervenes on the micro-state: any change in the macro must come from a change in the micro. But note: we saw that changing the arrangement (micro) didn't change the macro once the system settled? Actually, at high density, the jam forms regardless of arrangement. But the exact pattern of the jam might depend on the initial arrangement? However, the flow rate and the existence of a jam do not.

      Step 5: Discuss what the activity does and does not show:
        - **Gap between hard to predict and irreducible in principle**: The activity shows that the macro-behavior is hard to predict from micro-rules without simulation, but it does not show that it is in principle irreducible. In fact, for this model, we can write equations for the steady-state flow. But in complex systems (e.g., real traffic, biology, economics) the macro-regularities might be so complex that they are effectively autonomous.
        - **Causation**: In the activity, we can say the jam causes the cars to stop. But is that real? Or is it just a pattern? The activity shows that the jam is a real pattern that has causal efficacy: if we could break the jam, we would change the behavior of the cars. But note: in the micro-level, there is no jam, just cars and empties. However, the pattern is real and it is what we must manipulate to change the flow.

      Step 6: Conclude by relating to philosophy of science:
        - The special sciences (like traffic science) may have their own laws that are projectible and support counterfactuals. These laws are about aggregate quantities that are not reducible in a simple way to micro-facts. And they are what we use to control the system: to maximize flow, we control density, not individual cars.

  ### What will go wrong and how to handle it
    - **Movement confusion**: Students might not understand the swap. In the practice round, walk through an example. Also, the TA should watch for errors and correct.
    - **Simultaneity**: Some students might move before "Move" is called. Emphasize that it must be simultaneous. The TA should enforce.
    - **Fixed point counting**: The counter might miss a move. Have the TA also watch if possible, or use two counters.
    - **Non-stable states**: The system might not stabilize in 10 beats, especially at densities near the critical point (around 10 cars). We can run for 15 beats? Or note that we are taking an average. But the point is to see the pattern.
    - **Cheating**: Students might try to move when they shouldn't. The TA must be vigilant.

  ### What the activity cannot reproduce
    - **The gap between hard to predict and irreducible in principle**: We can explain that in this model, it is reducible (we can derive the fundamental diagram) but it might be very hard in practice for complex systems. In principle, reductionists believe everything is reducible; emergentists believe some phenomena are not. The activity doesn't settle that.
    - **True higher-level causation**: The activity shows that we talk about the jam causing delays, but a reductionist would say the real causation is at the micro-level. The emergentist would say the jam is a real causal entity. The activity doesn't prove either, but it shows why we might need higher-level causal explanations.

  By the end, students should have a visceral understanding of the phenomena that the philosophical terms are meant to capture.
