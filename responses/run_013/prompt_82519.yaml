prompt: |-
  At our little decision theory reading group we keep getting stuck on the same thing in different clothes, and I want to know if it has a name or if it's just the thing I think it is.

  First version. My aunt did one of those cheap at-home genetic tests, mostly for the ancestry part, and it came back with a high risk number for something that may never happen to her. There's no treatment, no screening, nothing she can do — it doesn't change a single decision she'll ever make. She was fine before and now she's up at 3am. But when I asked if she regreted it she looked at me like I was nuts and said she'd order it again tomorrow, and she's said the same thing twice since. So it made her worse off, and she'd do it again, and I don't think that's incoherent — I think it's something specific. Second version, same shape: a friend of mine is a grad student and read a comment on a preprint showing his method breaks down in a regime he doesn't care about. Nothing to do about it, the paper's out, and he says he'd still read the comment, and he also says he hasn't slept well since. Third: someone I know refuses to check her pension balance, because seeing the number wrecks her week even though she never trades on it.

  Now the argument that keeps coming up in the group. Information can't make you worse off, and the proof is that if you didn't like what you found out you could just ignore it and do exactly what you would have done if you hadn't found out. Which is airtight when I write it on the board and wrong for all three of these people. My guess is that the word doing all the work is 'ignore' — you can ignore a recommendation, but I'm not sure you can ignore a fact once it's in you, and the argument seems to treat those as the same operation. Is there a name for this? Not for the general fact that people are curious or that news can sting, but for that specific move, or for the assumption the move needs, or for the family of cases where it breaks down. I don't want just a label — I want to know where the edge is. Does it matter whether the news is about something you could act on? Does it matter if the news is about the past, where there was never anything to do? And is my aunt's 'I wish I could un-know' the same thing as 'knowing was bad for her', or are those two different questions that the group keeps collapsing into one? If there's no established term for any of it, coin one and tell me exactly what it covers and what it doesn't.
reasoning: |-
  Okay, the user is part of a decision theory reading group that's repeatedly stuck on a problem about whether information can make people worse off. They've provided three examples where people receive information that doesn't change their actions but causes distress: an aunt learning about a genetic risk, a friend whose research method was criticized, and someone avoiding pension balance checks. 

  The group keeps using an argument that information can't make you worse off because you can always ignore it and act the same. But the user points out this feels wrong in these cases - people can't simply choose to un-know distressing facts. 

  Hmm, this seems like a clash between theoretical models of rational choice and real human psychology. The user wants to know if there's a name for this phenomenon or the flawed "just ignore it" argument. More importantly, they want to understand the boundaries: When does this happen? Is it about actionable vs non-actionable info? Past vs future? And whether regretting knowing something is the same as the knowledge being harmful.

  I recall several concepts that might apply here. First, there's the distinction between decision-relevant and decision-irrelevant information in rational choice theory. Then there's the psychological concept of affective forecasting errors and the focusing illusion. The "ostrich effect" describes avoidance of potentially unpleasant information. 

  But the core issue might be what's called "state-dependent utility" - where merely knowing information changes your emotional state, which then affects your wellbeing independently of any decisions. The "ignorance is bliss" paradox captures this too.

  For the "just ignore it" argument, that's relying on what's called the "sure-thing principle" or treating information as freely disposable. But psychologically, people can't control how information affects their emotions once known - we're not Bayesian robots.

  The edge cases matter: Information about unchangeable past events seems most likely to cause pure distress without benefit. But even future risks can be harmful to know if they're uncontrollable. The pension example shows people sometimes intuitively understand this by avoiding information.

  Important to clarify that "I wish I didn't know" isn't quite the same as "knowing was bad" - it's about counterfactual preferences versus actual experienced utility. The user's group might be conflating these.

  Ultimately this seems like a case where standard decision theory models fail to account for the psychological costs of information itself. The term "information hazard" comes close but is usually about societal risks. Maybe "non-instrumental information disutility" would be precise, though clunky. "State-dependent utility cost of information" might work too.
answer: |-
  This is a profound and recurring problem at the intersection of decision theory, epistemology, and psychology. It *does* have names and conceptual frameworks, though no single term captures every nuance perfectly. The core issue is the **failure of the "Free Disposal" assumption for information** within standard Bayesian/rational choice models.

  Here's a breakdown of the concepts, why the group's argument fails, and where the edges lie:

  ### 1. The Core Concepts & Names
      *   **Non-Instrumental Information / Belief-Dependent Utility:** The key insight is that information isn't just a tool for making better decisions (its *instrumental* value). Knowing a fact can *directly* alter your psychological state, happiness, or utility function itself. This is called **belief-dependent utility** or **state-dependent preferences**. Your utility doesn't just depend on *outcomes* and *actions*, but also on the *state of knowledge* itself.
      *   **The Value of Ignorance / Strategic Ignorance:** The phenomenon where deliberately *not* acquiring information can be rational because acquiring it would cause negative utility (worry, anxiety, regret) without enabling any beneficial action. This is sometimes called the **"Ostrich Effect"** (though this often implies irrationality) or **"Rational Ignorance"** (more commonly used in economics for costly information acquisition, but applies here).
      *   **The Focusing Illusion (Daniel Kahneman):** When presented with specific information (like a genetic risk score), people tend to dramatically overestimate its impact on their future happiness because they focus too much on it and neglect the myriad other factors that make up their life. This explains the disproportionate anxiety relative to the actual change in expected outcomes.
      *   **The "Free Disposal of Information" Fallacy:** The group's argument relies on the implicit assumption that information can be freely discarded or ignored without cost once acquired ("just ignore it"). This treats information like a physical good you can choose not to use (e.g., putting a book on a shelf). Psychological facts and beliefs *cannot* be discarded at will. This assumption is baked into many decision theory models but is psychologically unrealistic.
      *   **Anticipatory Emotions:** Information about potential future negatives (even unavoidable ones) triggers emotions like fear, dread, and anxiety *in the present*, which directly reduce wellbeing. This is a form of belief-dependent utility.

  ### 2. Why the Group's Argument Fails ("You can just ignore it!")
  The argument **is** logically airtight *if and only if* the following assumptions hold:
      *   **Purely Instrumental Information:** Information only has value for guiding actions.
      *   **Free Disposal:** Acquiring information imposes no intrinsic psychological cost; you can instantly and costlessly revert to your previous state of belief/ignorance.
      *   **State-Independent Utility:** Your happiness/utility depends solely on physical outcomes and chosen actions, *not* on your mental state or beliefs.
      *   **Perfect Emotional Control:** You can fully control how information affects your feelings.

  **In your examples, *all* of these assumptions are violated:**
  *   The information has **non-instrumental** effects (anxiety, loss of sleep, wrecked weeks).
  *   **Free disposal is impossible:** Your aunt can't "unsee" her genetic risk. Your friend can't "unread" the critique. Once known, the information shapes their beliefs and emotional state unavoidably.
  *   **Utility is belief-dependent:** Knowing the fact *itself* causes negative utility (worry, dread) regardless of actions taken. The *state* of knowing is worse than the state of not knowing for their subjective wellbeing.
  *   **Emotions aren't perfectly controllable:** Telling someone "just ignore it" or "don't worry" about a genuinely concerning fact (even if unactionable) is ineffective advice.

  ### 3. Where the Edge Lies: Key Distinctions

  *   **Actionability Matters... But Isn't Sufficient:**
      *   *Non-Actionable Information (Genetic Risk, Past Critique, Pension Balance):* This is the clearest case where non-instrumental disutility dominates. Since the information *cannot* improve decisions (there are no decisions to change), any negative psychological impact is a pure cost. The "just ignore it" argument fails spectacularly here.
      *   *Actionable Information with High Non-Instrumental Cost:* Even information you *could* act on might have such a high psychological cost that acquiring it is net negative. Imagine learning about a very high, unavoidable risk for a condition you could *marginally* mitigate with unpleasant treatments. The anxiety might outweigh the small benefit of the action.
      *   *Actionable Information with Low Non-Instrumental Cost:* This is where standard decision theory shines. Learning your house is on fire allows you to escape, providing huge instrumental value that dwarfs any temporary fear. The "just ignore it" argument is irrelevant here because you *do* want to act.

  *   **Past vs. Future Matters... But Both Can Hurt:**
      *   *Past Events (Critique on published work):* Information about irrevocable past events can cause regret, shame, or damage self-esteem (non-instrumental cost) with no opportunity for beneficial action.
      *   *Future Uncertainties (Genetic Risk, Pension Shortfall):* Information about potential future negatives triggers anticipatory emotions (dread, anxiety) – a different but equally potent form of non-instrumental cost. The uncertainty itself is often a major source of distress. Knowing a bad outcome *will* happen (certainty) can sometimes be worse than uncertainty, but uncertainty is often more anxiety-provoking.
      *   *Edge:* Information about a *certain* but unavoidable future negative (e.g., terminal diagnosis with no treatment) maximizes anticipatory dread. Information about the *distant* past you were previously unaware of (e.g., a family secret) can still cause significant present distress.

  *   **"I wish I could un-know" vs. "Knowing was bad for me":**
      *   **These are distinct but related questions.**
      *   *"I wish I could un-know"* expresses a **counterfactual preference**. It compares the *actual state* (knowing + distress) to a *hypothetical state* (not knowing + no distress). Your aunt clearly prefers the hypothetical state.
      *   *"Knowing was bad for her"* is a statement about **experienced utility**. It compares her *actual wellbeing trajectory*:
          *   Path A: Never tests -> Continues baseline wellbeing.
          *   Path B: Tests -> Experiences immediate drop in wellbeing due to anxiety/loss of sleep -> (Potentially) adapts partially over time, but likely remains below Path A baseline due to persistent low-level worry/focusing illusion.
      *   **Conclusion:** In your aunt's case (and the others), *both* are true. Her expressed counterfactual preference ("wish I didn't know") is rational *because* the process of acquiring the knowledge caused a net reduction in her experienced utility relative to the alternative path where she remained ignorant. The information *was* bad for her wellbeing.

  ### 4. Coining a Term: "Non-Instrumental Information Disutility" (NIID)

  To precisely capture the phenomenon you describe:
  *   **Non-Instrumental Information Disutility (NIID):** The direct reduction in wellbeing (utility) caused by acquiring a piece of information, *independent* of any changes the information enables (or fails to enable) in the agent's subsequent actions or the physical outcomes they achieve. It arises from the unavoidable psychological and emotional impact of the belief state induced by the information itself.

  **What NIID Covers:**
  *   Anxiety, dread, regret, shame, or reduced happiness *caused solely by knowing the information*.
  *   Situations where the information provides no actionable benefit (like your examples).
  *   Situations where the information *is* actionable, but the psychological cost outweighs the instrumental benefit.
  *   Cases involving both future uncertainties and irrevocable past events.
  *   The failure of the "free disposal" argument.

  **What NIID Excludes:**
  *   Distress caused by information *leading to* worse physical outcomes *because* it changed decisions (e.g., panicking and making a bad choice upon hearing bad news). This is instrumental disutility.
  *   The cost of *acquiring* information (money, time, effort) – that's separate.
  *   Cases where information causes distress *only* because it forces a difficult but ultimately beneficial decision (e.g., learning you need surgery causes anxiety, but the surgery saves your life). Here the *net* utility is likely positive.

  ### In Summary

  Your group is grappling with the limits of standard rational choice models that assume information is only valuable for action and can be freely ignored. The reality is that **information has intrinsic psychological effects that directly alter wellbeing ("belief-dependent utility"), and we often cannot control these effects or "un-know" things ("no free disposal").** This leads to situations where **Non-Instrumental Information Disutility (NIID)** makes acquiring information harmful, even if it changes no actions. The harm is real in terms of experienced utility, and the preference for ignorance is rational. Actionability and past/future distinctions matter for the *type* of disutility (regret vs. dread), but NIID can arise in all these contexts. The key edge is when information provides *no countervailing instrumental benefit* to offset its unavoidable psychological cost. Your intuition about "ignore" being the weak point is exactly right.
