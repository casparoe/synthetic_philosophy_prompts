prompt: |-
  I read rationalist blogs and forums far more than I read the philosophy journals, and the vocabulary I actually reason in is information theory and statistics. Take the debate over whether the sciences carve nature at its joints — realism about natural kinds against the various anti-realisms — and restate it in that vocabulary as faithfully as you can: descriptions and codes, lossy compression, rate-distortion tradeoffs, minimum description length, the choice of a distortion or loss function, and what it means for one partition of a domain to beat another. Then give me the residue report. What survives translation intact — does joint-carving come out as an optimal partition, and optimal relative to what? What survives only under distortion? And what has no counterpart at all, above all the philosophers' insistence that joints are discovered rather than chosen, and that nature rather than we does the carving? Finish by taking a side on whether that residue is a defect of my vocabulary or a sign that the original debate is less clear than it presents itself.
