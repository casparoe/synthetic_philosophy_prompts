  The tricky part is handling what doesn't translate - mainly the realist claim that joints are discovered rather than chosen. In information theory, optimality is always relative to a distortion function, which is inherently subjective. But maybe Kolmogorov complexity could provide a path to objectivity...

  The residue report should highlight:
