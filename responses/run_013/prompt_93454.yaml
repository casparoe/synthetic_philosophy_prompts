  ## ENFORCEMENT NOTICE  
  **Issued Pursuant to Section 7(1)(c), Acquisition Governance Act 2023**  
  **Office of Household Management (OHM)**  
  **Reference:** OHM/ENF/TOK/001  
  **Date:** 24 May 2024  
  **To:** Tokos Holdings Ltd (Registered No. 11472839)  
  **Re:** Unlicensed & Unnatural Acquisition Activities  

  **1. Findings of Fact:**  
  1.1. Tokos Holdings Ltd ("Tokos" or "the Firm") operates a digital platform ("the Platform") facilitating the exchange of cryptographic tokens and the accrual of additional tokens via processes described as "staking."  
  1.2. The Platform enables Participants to commit existing token holdings to secure distributed ledgers, receiving periodic token allocations ("Rewards") in return.  
  1.3. Tokos markets these Rewards as deriving from "natural growth" inherent in decentralised protocols (Tokos Terms of Service, v.3.2, Clause 4.1.a).  
  1.4. The Firm generates revenue through commissions on token exchanges and Reward distributions.  
  1.5. Tokos solicits participation universally, irrespective of Participant household requirement or need.  

  **2. Contraventions:**  
  2.1. The OHM finds Tokos engaged in **Unnatural Acquisition** (Acquisition Governance Act 2023, S.2):  
      a) **Unbounded Acquisition:** The Firm’s activities exhibit no inherent limit. Reward accrual and exchange facilitation exist solely to generate further token quantities, detached from any bounded requirement of a household. This constitutes acquisition for its own sake.  
      b) **Token Breeding:** The Reward mechanism constitutes the breeding of tokens from tokens. Value generated by convention (tokens) is presented as producing offspring (Rewards) through mere technical process, absent any relation to natural use or need. Money, being conventional, is barren; its apparent breeding is unnatural.  
      c) **Natural Money Misrepresentation:** Claims that tokens constitute "natural money" (Platform Marketing Materials, Q1 2024) are materially misleading. Money, by its essence, is conventional. Asserting conventional tokens possess inherent, natural growth properties is a fundamental category error applicable to *all* conventional currencies.  
      d) **Commensurability Failure:** The Platform facilitates exchanges absent demonstrable commensurability based on natural use. Tokos relies solely on fluctuating market convention to establish exchange ratios, failing to provide any stable measure of true need equivalence. This renders exchanges inherently unstable and divorced from proper household management.  

  **3. Regulatory Action:**  
  3.1. Pursuant to AGA 2023, S.7(1)(c), Tokos is hereby ordered to **CEASE ALL OPERATIONS** within the jurisdiction of the OHM immediately upon service of this Notice.  
  3.2. Tokos must **DESIST** from:  
      a) Facilitating any further token staking or Reward distribution.  
      b) Marketing tokens or Rewards as possessing "natural" growth properties or inherent value beyond conventional agreement.  
      c) Soliciting new Participants.  
  3.3. Tokos must provide a full accounting of all Participant holdings and Reward accruals to the OHM within fourteen (14) calendar days.  

  **4. Compliance Schedule:**  
  Tokos must, within twenty-eight (28) calendar days, submit a Remediation Plan detailing:  
  4.1. A methodology for establishing a **Just-Price Table** for all tokens exchanged on the Platform, grounded in demonstrable natural use equivalence and bounded household requirement, not market convention. *(Note: OHM Guidance Note G7 clarifies that while true commensurability of disparate goods like houses and shoes is impossible in essence, a stable convention approximating bounded household necessity must be established and maintained. Market fluctuation is prima facie evidence of convention failure.)*  
  4.2. A mechanism ensuring all future exchange and acquisition activities conducted by Tokos are demonstrably **bounded by the natural and proper needs** of identifiable households.  
  4.3. Removal of all references to "natural," "inherent," or "organic" growth pertaining to tokens or Rewards from all communications and materials.  

  **5. Failure to Comply:**  
  Failure to comply with this Enforcement Notice constitutes a continuing offence under AGA 2023, S.9. Tokos is liable, on summary conviction, to:  
  5.1. A fine not exceeding Level 5 on the standard scale **OR** 200% of the total value of Rewards distributed in the preceding financial year (whichever is greater).  
  5.2. Daily penalties of 0.5% of the firm’s average daily token holdings (by OHM valuation) for each day of non-compliance.  
  *(Note: Fines are payable in Sterling (GBP) or, at the OHM's discretion and subject to valuation, in the primary conventional token exchanged on the Tokos Platform.)*  

  **6. Right of Reply:**  
  6.1. Tokos submitted a written response dated 10 May 2024 (Ref: THL/REG/OHM/001), arguing:  
      a) Staking Rewards represent compensation for service provision (network security), analogous to hire, not unnatural breeding.  
      b) The "boundary" between household management and acquisition is undefined in statute and inherently variable across households; the OHM seeks to impose an arbitrary and unquantifiable limit.  
      c) All value, including that of Sterling, is conventional; the OHM’s objection to conventional tokens is inconsistent.  
      d) The Just-Price requirement is unworkable as value is subjective and context-dependent.  
  6.2. The OHM notes these arguments. The distinction between hire and breeding lies in the *purpose* and *outcome*: hire serves a specific, bounded need; Rewards are tokens breeding tokens for their own sake, detached from need. The variability of household requirement does not negate the principle of boundedness; it necessitates Tokos demonstrating how *each* transaction adheres to it, which it fails to do. The conventional nature of Sterling is acknowledged; however, Sterling is not falsely presented as possessing natural, inherent growth. The challenge of establishing a Just-Price reflects the inherent difficulty of commensurability, not its irrelevance; Tokos must still make the attempt grounded in bounded need, not convention.  

  **7. Precedent:**  
  The OHM notes the precedent of Thales of Miletus (as recorded), who, understanding natural principles, secured olive-press capacity based on foresight of need (meteorology), demonstrating bounded acquisition for use. He ceased activity once requirement was met, despite potential for unlimited gain, contrasting sharply with Tokos's model.  

  **Issued by Authority:**  
  G. Atherton  
  Chief Inspector, Market Integrity Unit  
  Office of Household Management
