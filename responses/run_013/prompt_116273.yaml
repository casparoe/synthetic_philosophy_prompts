  ### Detailed Scenario

  **Scenario**: A film club with three members (Alice, Bob, Charlie) and three films (A, B, C). The group must decide which film to show. Each member has a strict preference ranking over the films.

  **Rule Design (10 minutes)**:
  - In groups of three, they design a rule that must include:
    1. Each person gets to decide the group's choice for one specific pair of films. Assign:
        - Alice decides between film A and film B.
        - Bob decides between film B and film C.
        - Charlie decides between film C and film A.
    2. If everyone in the group prefers one film over another, then the group must follow that (unanimity).

    Note: They might design a rule that uses these decisive pairs and then tries to aggregate. But the key is that the decisive pairs are fixed.

  **Preference Slips (for the first round)**:
  - Alice: 
     - 1st: Film A
     - 2nd: Film B
     - 3rd: Film C
  - Bob:
     - 1st: Film B
     - 2nd: Film C
     - 3rd: Film A
  - Charlie:
     - 1st: Film C
     - 2nd: Film A
     - 3rd: Film B

  **First Round (10 minutes)**:
  - Groups apply their rule to these preferences and record:
     - Alice decides A vs B: A wins (since Alice prefers A over B).
     - Bob decides B vs C: B wins (since Bob prefers B over C).
     - Charlie decides C vs A: C wins (since Charlie prefers C over A).
  - Now, when they try to pick a winner, they see:
     - A beats B, B beats C, but then C beats A -> cycle.
  - They cannot choose without breaking a rule.

  **Second Round (10 minutes)**:
  - Ask: "What if one of you volunteers to give up your decisive right? For example, Charlie could say: 'I waive my right to decide between C and A. You two can decide that for me.'"
  - Now, without Charlie's decisive pair, they have:
     - Alice: A beats B
     - Bob: B beats C
     - So by transitivity, A beats C? But they don't have a direct vote on A vs C. However, they can now say A is the winner because it beats B and B beats C. (But note: without a rule for A vs C, they might need to use the existing chain. Alternatively, they might hold a vote between A and C? But that would break the rule. So we assume they use the chain.)

  - Now the group chooses film A. But note Charlie prefers C to A. So if Charlie had not waived, he would have forced C over A, but now he has no say and the group chooses A.

  **Debrief (10 minutes)**:
  - Discuss:
     - What happened in the first round? Why did the rule fail?
     - In the second round, did the waiver fix the problem? What did it cost the person who waived?
     - Is this a fair solution? (No, because it's arbitrary and the person who waives loses their liberty in that pair.)

  - Handle the comment: "Why not just not let people have opinions on others' business?"
     - Respond by asking: "But in our rule, we only allowed each person to decide one pair. That's a very limited amount of individual freedom. And we still had a problem. So it's not about having opinions on others' business, it's about the minimal freedom we assigned. The theorem shows that even a tiny bit of individual freedom (as long as at least two people each have at least one pair they control) can conflict with the Pareto principle. What would you suggest? Remove the unanimity condition? That would mean even if everyone agrees that option X is better than Y, we might still choose Y. Is that acceptable?"

  - What the activity didn't show:
     - We only saw one example. The theorem says that no matter how we assign the decisive pairs (as long as at least two people have at least one pair each) and no matter what rule we use, there will be some preferences that cause a conflict. So there's no way to avoid this problem without giving up one of the principles.

  ### Timeline

  - 0-5 min: Introduction
  - 5-15 min: Group formation and rule design (10 min)
  - 15-25 min: First round with the given preferences (10 min)
  - 25-35 min: Second round (waiver) (10 min)
  - 35-45 min: Debrief (10 min)

  ### Potential Problems and Solutions

  1. **Groups not designing the rule as intended**: They might try to use majority voting and not assign the decisive pairs. To prevent this, circulate and guide them: "Remember, each person must have control over at least one pair. How about we assign Alice to decide between A and B, Bob between B and C, and Charlie between C and A?" If they design a different assignment, it might not cause the cycle. But we can provide the preference slips and still see what happens. Alternatively, we can standardize the assignment for all groups to ensure the paradox occurs.

  2. **The cycle doesn't land as a problem**: Some groups might just pick a winner arbitrarily. We must stress: "According to your rule, can you pick a winner without violating one of the principles?" They should see that they cannot.

  3. **The waiver round might be confusing**: They might not know how to proceed without one decisive pair. We can suggest: "Now that Charlie has waived, we don't have a rule for C vs A. But we have A beats B and B beats C. So we can say A beats C by transitivity? Then A is the top." But note: transitivity is not built into the rule. We are now breaking the rule. We are using a different method. We should highlight that.

  4. **Time constraints**: Keep strict time limits. Use a timer.

  5. **The student who says "just don't let people have opinions about other people's business"**: As discussed, use the Socratic method: ask them to reflect on the minimalism of the freedom we allowed and whether removing unanimity is acceptable.

  ### Materials

  - Preference slips for each role (Alice, Bob, Charlie) for the first round.
  - Instructions for the rule design (on the board or handout): 
     - "Design a rule that satisfies:
          1. Each member is decisive for one pair: 
              - Alice: between A and B
              - Bob: between B and C
              - Charlie: between C and A
          2. Unanimity: If everyone prefers one film over another, then the group must choose accordingly."
  - Optional: a worksheet to record the pairwise comparisons and the outcome.

  This design should lead to an engaging session that demonstrates Sen's liberal paradox without a lecture.
answer: |-
  ### Session Design: Sen's Liberal Paradox  
  **Goal:** Experience the clash between individual liberty ("personal freedom") and Pareto efficiency ("everyone agrees") through group decision-making, then explore a waiver as a potential fix.  
  **Time:** 45 minutes  
  **Participants:** 20 students (juniors/seniors), divided into 6–7 groups of 3.  

  ---

  ### **Scenario: The "Snack Club"**  
  Three friends (Alice, Bob, Charlie) must decide which snack to buy for their club:  
  - **Options:** Chocolate bars (C), Fruit (F), or Chips (P).  
  - **Stakes:** Trivial but relatable (e.g., "The club budget only allows one snack").  

  ---

  ### **Timeline**  

  #### **1. Introduction (5 min)**  
  - **Hook:** *"Imagine you’re in a tiny club with two friends. You need a fair rule to pick one snack from three options. What rule would feel fair if everyone’s tastes are different?"*  
  - **Setup:** Assign groups of 3. Each group picks roles: **Alice**, **Bob**, **Charlie**.  
  - **Task:** *"Design a fair rule that follows two principles:*  
    1. **Personal Freedom:** Each person controls at least one pair of options. (e.g., Alice decides between C and F; Bob between F and P; Charlie between P and C).  
    2. **Unanimity:** If everyone prefers one snack over another, the group respects it."  

  #### **2. Rule Creation (8 min)**  
  - Groups invent a rule (e.g., majority vote, Borda count, or pairwise comparisons).  
  - **Crucial:** Circulate and **guide them to embed "Personal Freedom" explicitly**:  
    > *"Make sure each person gets ‘ownership’ over one comparison. For example, Alice’s vote alone decides between Chocolate and Fruit."*  
  - **Output:** Each group writes down their rule.  

  #### **3. Round 1: The Paradox Revealed (12 min)**  
  - Hand out **preference slips** (students keep rankings secret initially):  
    - **Alice:** Chocolate (C) > Fruit (F) > Chips (P)  
    - **Bob:** Fruit (F) > Chips (P) > Chocolate (C)  
    - **Charlie:** Chips (P) > Chocolate (C) > Fruit (F)  

  - **Groups apply their rule:**  
    - They tally votes/rankings based on their rule.  
    - **Guaranteed conflict:**  
      - Alice’s freedom forces **C > F** (she decides her pair).  
      - Bob’s freedom forces **F > P** (he decides his pair).  
      - Charlie’s freedom forces **P > C** (he decides his pair).  
      - Result: **C > F > P > C** → a cycle! No winner.  

  - **Reveal the clash:**  
    - Ask groups: *"What happened? Can you pick a snack without breaking your rule?"*  
    - **Key realization:**  
      - If they force a winner (e.g., Chips via tie-breaker), point out:  
        > *"Look at the rankings: Everyone ranks Chips (P) below Chocolate (C)! Alice ranks C>P, Bob ranks F>P (and C>F>P), Charlie ranks C>P. So why did Chips win?"*  

  #### **4. Round 2: The Waiver Experiment (8 min)**  
  - **New twist:** *"What if one person gives up their ‘personal freedom’? Let Charlie waive his right to decide his pair (C vs. P). Now the group decides Charlie’s pair democratically."*  
  - Groups re-run their rule **without Charlie’s decisive power** (e.g., vote on C vs. P).  
  - **Outcome:**  
    - Alice and Bob vote **C > P** (Alice: C>P; Bob: F>P>**C** → but Bob prefers P over C? No! Bob ranks P>C, so he votes P>C. Wait, let’s clarify):  
      - Alice: C > P  
      - Bob: P > C (since F>P>C → P>C)  
      - Charlie: P > C  
      → **P wins 2-1 over C**.  
    - Now apply prior freedoms:  
      - Alice: C > F → C beats F  
      - Bob: F > P → F beats P  
      - Result: **C > F and F > P**, but **P > C** → still a cycle!  
    - **Fix only works if they break the cycle logically**:  
      - If they use the first-round decisions (C>F from Alice, F>P from Bob) and ignore Charlie’s waived pair, they get **C > F > P** → Chocolate wins.  
      - But Charlie (who waived) preferred P > C, yet C wins.  

  #### **5. Debrief (12 min)**  
  - **Guided discussion**:  
    - *"What broke in Round 1? Was it your rule, or something deeper?"*  
      → *Their rule clashed with itself due to conflicting freedoms.*  
    - *"In Round 2, did waiving ‘fix’ it? What did Charlie lose?"*  
      → Charlie lost agency; the group overrode his preference.  
    - *"Is this a real solution? Or does it just hide the problem?"*  
      → It’s a cheat: Liberty is sacrificed for decisiveness.  

  - **Handle predictable comments**:  
    - **Student**: *"Just don’t let people have opinions on others’ business!"*  
      → *"But in your rule, Alice only controlled Chocolate vs. Fruit—not Bob’s Fruit vs. Chips. Was that ‘meddling’? Why did it still fail?"*  
      → Highlight: Minimal freedom (one pair per person) caused the paradox.  

  - **What the activity couldn’t show**:  
    - *"We saw one example where freedom + unanimity broke. Sen proved it’s unavoidable: No matter how clever your rule, some preferences will cause this clash. That’s the paradox."*  

  ---

  ### **What Could Go Wrong & Solutions**  
  - **"Preferences are unrealistic!"** → Use the snack example to show how harmless disagreements escalate.  
  - **Groups design rules avoiding freedom** → Intervene early: *"How does your rule give each person control over one specific pair?"*  
  - **Cycle isn’t obvious** → Use a whiteboard to map pairwise results: C>F, F>P, P>C → "No starting point!"  
  - **Waiver round confusion** → Simplify: *"Ignore Charlie’s pair. Use only Alice’s (C>F) and Bob’s (F>P). What wins?"*  

  ### **Why This Works**  
  - Students **discover the paradox** through their own rules, making it visceral.  
  - The waiver **personalizes the cost of liberty** (Charlie’s loss).  
  - The debrief confronts **trade-offs** without lectures.  

  **Final note:** Sen’s theorem shows this paradox is universal—no "perfect" fix exists. End with: *"So what’s fairer: protecting personal freedom, or ensuring group harmony? That’s not math—it’s philosophy. And it’s why democracy is hard."*
