          We can then ask: "So, what happened? Can we choose a winner? Why not?"

  4. **Second Round: Waiving Rights (10 minutes)**:
     - Now, in the same groups, tell them: "Suppose one of you volunteers to give up your right to decide in your own sphere. For example, Charlie might say: 'I don't care about my decisive pair (C vs A), you two decide for me.'"
