answer: |-
  Here's your calibrated checklist, designed for speed and honesty about what each step proves. It prioritizes catching fatal flaws early and flags where judgment is needed.

  ---

  ### **The 30-second version**  
  This checklist catches mathematical incoherence (guaranteed betting losses) in probability batches. Passing means your numbers avoid obvious money-pumping traps, not that they’re perfectly accurate. It runs in 15–20 minutes, prioritizes quick fails, and flags "gray zones" for human review. Your friend is right: Dutch books expose pragmatic vulnerability, not deep irrationality—but for client money, that’s enough to demand fixes.

  ---

  ### **The Checklist**  
  *Run steps in order. STOP if any "Fail" occurs. Use Python/R/sheets for calculations.*

  1.  **Check Bounds**  
      *Action:* Scan all probabilities. Ensure 0 ≤ *p* ≤ 1 for every forecast.  
      *Pass:* All values between 0 and 1 inclusive.  
      *Fail:* Any *p* < 0 or *p* > 1. **STOP. DO NOT SHIP.** Fix typos.  
      *Vibes?* Pure math. Fails are always errors.

  2.  **Mutually Exclusive & Exhaustive (MEE) Group Sum**  
      *Action:* For any group meant to cover all outcomes (e.g., candidates A/B/C win nomination), sum their probabilities.  
      *Pass:* Sum = 1.00 (allow ±0.02 for rounding/quick estimates).  
      *Fail:* Sum ≠ 1.00 (±0.02). **STOP.** Flag group for lead researcher. Forces reassessment of the entire group.  
      *Vibes?* Real test. Failing means the group is incoherent.

  3.  **Subset/Superset Check**  
      *Action:* Identify pairs where Event A *must* happen for Event B to happen (e.g., "merger closes" (A) and "merger closes by deadline" (B = A∩C)). Calculate if *P*(A) ≥ *P*(B).  
      *Pass:* *P*(A) ≥ *P*(B) for all such pairs.  
      *Fail:* *P*(A) < *P*(B). **STOP.** Flag the pair. Forces adjustment: Raise *P*(A), lower *P*(B), or clarify definitions.  
      *Vibes?* Real test (Axiom: Probability of subset ≤ superset). Failing is always wrong.

  4.  **Conditional Consistency Spot Check (1–2 Pairs)**  
      *Action:* Pick 1–2 intuitive conditional pairs (e.g., *P*(Win General | Nomination) should be derivable from other numbers). Calculate implied conditional: *P*(A|B) ≈ *P*(A∩B)/*P*(B). Compare to nearby forecasts *if* directly estimated.  
      *Pass:* Implied *P*(A|B) is within ±0.15 of directly estimated *P*(A|B) *or* no direct estimate exists.  
      *Fail:* Direct estimate exists and |Implied - Direct| > 0.15. **PAUSE.** Flag for your review. Might need model adjustment or note for clients.  
      *Vibes?* Judgment call. Highlights potential tension, not strict incoherence. Depends on context.

  5.  **Quick Correlation Sanity Check**  
      *Action:* Scan for highly correlated events (e.g., "Senate goes Dem" and "President is Dem"). Ensure *P*(A and B) ≤ min(*P*(A), *P*(B)) and ≥ *P*(A) + *P*(B) - 1.  
      *Pass:* All joint probabilities (if given) satisfy inequalities.  
      *Fail:* Violation found. **STOP.** Joint probability is mathematically impossible. Fix model.  
      *Vibes?* Real test (Probability bounds). Rarely applies if joints not forecasted, but catches big errors if they are.

  6.  **"Smell Test" Variance**  
      *Action:* Look for probabilities clumped near 0%, 50%, or 100% without clear justification.  
      *Pass:* No excessive, unexplained clumping (e.g., ≤5 of 50 forecasts at exactly 50%).  
      *Fail:* Significant clumping suggests placeholder usage. **PAUSE.** You review for overconfidence/underconfidence.  
      *Vibes?* Pure vibes. Indicates potential laziness, not incoherence.

  **OUTCOME:**  
  - **Passed 1-5:** Safe to ship (mathematically coherent).  
  - **Paused at 4 or 6:** You review context; ship with notes or adjust.  
  - **Stopped at 1, 2, 3, or 5:** **DO NOT SHIP.** Fix with lead researcher.

  ---

  ### **Two Batches Run Through It**

  **Batch 1: Nomination Contradiction**  
  *Forecasts:*  
  - P(Our Guy Nom) = 0.35  
  - P(Our Guy Win General) = 0.40  
  - P(Rival Nom) = 0.45  
  - P(Third Party Nom) = 0.25  

  *Checklist Run:*  
  1.  **Bounds:** All 0.35, 0.40, 0.45, 0.25 → Pass.  
  2.  **MEE Sum:** Nomination Group = 0.35 + 0.45 + 0.25 = 1.05 → **FAIL (Sum > 1). STOP.**  
      *Resolution:* Sum ≠1 is fatal. Group must be reassessed. Lead researcher rebuilds the nomination model. Batch halted.

  **Batch 2: Merger Deadline**  
  *Forecasts:*  
  - P(Merger Closes) = 0.60  
  - P(Merger Closes by Deadline) = 0.70  

  *Checklist Run:*  
  1.  **Bounds:** 0.60, 0.70 → Pass.  
  2.  **MEE Sum:** N/A (Not an exhaustive group).  
  3.  **Subset/Superset:** "Closes by Deadline" (B) is a subset of "Closes" (A). Check: P(A) = 0.60 ≥ P(B) = 0.70? 0.60 < 0.70 → **FAIL. STOP.**  
      *Resolution:* Fatal inconsistency. Checklist *doesn't* say which to fix. Options:  
      - Raise P(Closes) to ≥0.70 (your instinct).  
      - Lower P(Closes by Deadline) to ≤0.60.  
      - **The Unlikable Answer:** Your instinct (raising P(Closes)) might mask a model flaw. If your model truly believes P(Closes by Deadline) = 0.70, then P(Closes) *must* be ≥0.70. But if P(Closes) was carefully modeled at 0.60, forcing it to 0.70 is dishonest. *Better fix:* Lower P(Closes by Deadline) to ≤0.60 unless new evidence justifies raising P(Closes). Lead researcher decides based on source data.

  ---

  ### **Where the Checklist Gives Up (and Your Friend's Point)**

  **The Philosophical Limit:**  
  Your friend is correct. A Dutch book shows that *if* someone offers you a specific set of bets based on your probabilities, you can be forced to lose money. It doesn't prove your credence in a single event (e.g., "P(Coin=Heads)=0.6") is inherently irrational in isolation. The "depragmatized" view argues rationality is about *accuracy* (how close your probabilities are to truth frequencies), not avoidable betting losses. A perfectly calibrated forecaster could state incoherent probabilities (like P(A) < P(A∩B)) due to a typo—they’d be vulnerable to a Dutch book, but not necessarily "inaccurate" if never bet upon.

  **The Pragmatic Surrender:**  
  For your **job**, this distinction is irrelevant. Clients use these probabilities to make decisions (bets, investments, plans). If your batch is Dutch-bookable:  
  1.  It *will* be exploited by savvy clients or the market, harming your credibility.  
  2.  It reveals internal model errors that *likely* harm accuracy anyway (e.g., the merger probabilities can't both be true).  

  The checklist focuses on **avoiding guaranteed, exploitable incoherence**. It *does not* and *cannot* ensure:  
  - Perfect calibration (Step 6 only catches lazy clumping).  
  - That individual probabilities are "rational" (Steps 2, 3, 5 just enforce basic rules).  
  - That conditional relationships are perfectly modeled (Step 4 flags major discrepancies for *your* judgment).  

  **When the Checklist Gives Up:**  
  - **Step 4 (Conditionals):** It only flags large discrepancies. You decide if it's a rounding error, miscommunication, or model flaw.  
  - **Step 6 (Smell Test):** It identifies suspicious patterns, but you judge if they're justified.  
  - **After a STOP:** It forces a fix but doesn't specify *how* (e.g., the merger batch). The lead researcher must weigh model integrity vs. coherence.  

  **Bottom Line:** The checklist ensures you don't ship *mathematical garbage*. It doesn't ensure you ship *truth*, but it prevents you from shipping something that guarantees a savvy client profit at your expense. That’s what matters for Monday mornings.
