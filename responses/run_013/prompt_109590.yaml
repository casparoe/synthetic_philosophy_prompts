prompt: |-
  I'm the senior fiscal analyst in the nonpartisan research office of a state legislature, and the revenue committee has handed us an unusual request. The chair has introduced a bill to phase out our estate tax entirely; other members have floated counter-proposals — sharply raising the exemption, converting the estate tax into an inheritance tax on what each heir actually receives rather than on the estate as a whole, capping tax-free lifetime gifts, and closing the generation-skipping loophole that lets a trust shelter a fortune from the tax for a century. The committee wants our office to produce, for any such provision, a reasoned statement of whether it makes the distribution of opportunity in this state more or less equal, written so that it can be read aloud by a member of either party without being dismissed as advocacy. We have about a week, no budget to commission new microsimulations, and a charter that forbids us from taking a position on the members' ultimate goals; we may analyze a provision against a stated standard, but the choice of standard and the final vote belong to the committee. The office director signs off on everything that goes into the packet, so the procedure has to be something a competent analyst can run the same way twice and defend line by line.

  I want you to build that procedure. Begin from the most defensible account you can give of what equality of opportunity actually requires, then translate it into a decision procedure my analysts can run on a tax provision without having read any of the underlying philosophy. A few things I've been reading that strike me as relevant but that I cannot yet operationalize: the thought that egalitarian justice should be sensitive to people's ambitions and choices while remaining insensitive to their endowments, so that inherited wealth and inherited capacity are candidates for neutralization but differences traceable to a person's own effort are not; the hypothetical-insurance idea, that we ask what protection against being born without wealth or earning power people would buy before knowing where in the lottery they would land; and the distinction between taxing an estate and taxing what each heir receives, which changes who is treated as bearing the burden and therefore what the provision is even doing. I want the procedure to specify, in order, what to look for in the text of a provision, what fact or standard assumption makes each step answerable, what answer at each step disqualifies the provision from passing the screen, and — importantly — which steps are really value judgments dressed up as analysis, which my office must flag for the committee rather than resolve on its own. It has to survive at least two hard cases that I expect to come up: an illiquid family farm or closely held business that could only pay the tax by being sold, and a provision whose equalizing effect on opportunity is real but whose revenue cost falls on programs that themselves equalize opportunity.

  Then run the procedure, step by step, on three provisions — a straight repeal, a large per-heir exemption with a graduated rate above it, and a lifetime accessions tax on the cumulative total of gifts and inheritances a person receives — and show me where the procedure lands in each case. I expect it to give an answer on at least one of these that the committee, and perhaps I, will not like, and I would rather see that spelled out than smoothed over. Finally, tell me what this procedure cannot do: the questions it will always hand back to the committee, the assumptions it smuggles in, and the circumstances under which an analyst applying it honestly should refuse to give a clean verdict.
reasoning: |-
  We are building a procedure to evaluate tax provisions based on their impact on equality of opportunity. The procedure must be nonpartisan, defensible, and operational without new simulations. It should be based on a clear account of equality of opportunity and then broken down into steps that an analyst can follow.

  Key ideas from the request:
  1. Equality of opportunity requires being sensitive to ambitions and choices (which are acceptable) but insensitive to endowments (like inherited wealth or capacity). So, we want to neutralize the effects of circumstances beyond an individual's control (like being born into a wealthy family) but not penalize differences due to effort.
  2. The hypothetical insurance idea: what insurance against being born without wealth or earning power would people buy behind a veil of ignorance?
  3. The structure of the tax (estate tax vs. inheritance tax) matters because it changes who bears the burden and how we assess the impact on opportunity.

  We'll design the procedure in steps. Each step will have:
  - What to look for in the provision text.
  - The fact or standard assumption that makes it answerable.
  - What answer disqualifies the provision (if any) from being considered as promoting equality of opportunity.
  - A note on whether the step involves a value judgment that must be flagged for the committee.

  The procedure must flag steps that are value judgments so that the office does not resolve them but leaves them to the committee.

  We'll also consider two hard cases:
  1. Illiquid family farm or business: Could the tax force a sale? This might affect opportunity (e.g., if the heir wants to continue the business but cannot because of tax).
  2. Revenue cost: If the provision reduces revenue and that revenue loss affects programs that equalize opportunity, how do we account for that?

  We are to test the procedure on three provisions:
  A. Straight repeal of the estate tax.
  B. A large per-heir exemption with a graduated rate above it (an inheritance tax structure).
  C. A lifetime accessions tax on the cumulative total of gifts and inheritances a person receives.

  Finally, we must note the limitations of the procedure.

  ---

  **Foundational Account of Equality of Opportunity**

  We adopt a version of equality of opportunity that aims to level the playing field by neutralizing the effects of circumstances beyond an individual's control (such as family wealth at birth) while allowing inequalities that result from individual effort and choice. This is inspired by the philosophy of Ronald Dworkin (ambition-sensitivity and endowment-insensitivity) and John Rawls (veil of ignorance).

  Specifically:
  - Inherited wealth is a circumstance of birth and should be neutralized to the extent possible so that it does not confer unearned advantage.
  - The hypothetical insurance approach suggests that behind a veil of ignorance, individuals would insure against being born into poverty or without valuable talents. Thus, a tax system that functions like such insurance (by redistributing from those who are lucky in the birth lottery to those who are unlucky) would promote equality of opportunity.

  We also note that the structure of the tax matters:
  - An estate tax is imposed on the entire estate before distribution, so it affects the total amount available to heirs. The burden is on the estate and thus on the heirs collectively.
  - An inheritance tax (or accessions tax) is imposed on each heir based on what they receive. This allows for progressivity based on the heir's total inheritance and can treat heirs differently (e.g., a small inheritance might be exempt, while a large one is taxed heavily). This structure can be more targeted at neutralizing the unearned advantage of large inheritances.

  ---

  **Procedure for Analyzing a Tax Provision**

  The procedure is a sequence of steps. At each step, the analyst must look for specific features in the provision and then answer a question. Some steps are disqualifying (if the answer is "no" or a specific condition, then the provision fails to promote equality of opportunity). Other steps are non-disqualifying and are for information. Steps that involve value judgments must be flagged.

  **Step 1: Type of Provision**
  - **Look for**: Whether the provision modifies the estate tax, replaces it with an inheritance tax, or changes the gift tax or generation-skipping transfer (GST) tax.
  - **Fact/Assumption**: The current system (baseline) is known (estate tax with current exemption and rate, gift tax, GST tax). We assume the provision text clearly states what it changes.
  - **Disqualifying?** No. This step is for categorization. But note: a provision that eliminates any tax on inherited wealth (like straight repeal) will be analyzed differently than one that restructures it.
  - **Value Judgment?** No. This is descriptive.

  **Step 2: Effect on Taxing Inherited Wealth**
  - **Look for**: Does the provision reduce or eliminate the tax on inherited wealth? Specifically, does it lower the effective tax rate on transfers of wealth at death (or via gifts) compared to the current system?
  - **Fact/Assumption**: We can estimate the average effective tax rate on large estates under current law and under the provision using existing data (e.g., from the state revenue department or national models). We use standard assumptions about the distribution of estates and inheritances.
  - **Disqualifying?** Yes, if the provision reduces the effective tax rate on inherited wealth without introducing a more progressive structure (see Step 3) and without addressing the illiquid asset problem (Step 4) and without considering revenue effects (Step 5). Specifically, if the provision lowers the effective tax rate on large inherited wealth (which is a major source of unearned advantage) and does not meet the conditions in Steps 3, 4, and 5, then it fails to promote equality of opportunity. Why? Because it allows more unearned advantage to pass to heirs, which exacerbates inequality of opportunity.
  - **Value Judgment?** Partially. The idea that inherited wealth should be taxed to neutralize unearned advantage is a value judgment. We must flag that the office is assuming that inherited wealth is an endowment that should be neutralized for equality of opportunity. The committee might disagree, but our procedure is built on that standard.

  **Step 3: Progressivity and Targeting of the Tax Burden**
  - **Look for**: How does the provision structure the tax burden? For an estate tax: changes in exemption and rates. For an inheritance tax: per-heir exemption and graduated rates. For a lifetime accessions tax: cumulative exemption and rates. Also, look for provisions that close loopholes (like the GST loophole or gift tax exclusions).
  - **Fact/Assumption**: We can compare the progressivity of the current system and the new provision. A provision is more progressive if it increases the tax burden on the largest inheritances relative to smaller ones. We assume that the state has data on the distribution of inheritances (from IRS or state data) and can model the tax burden by size of inheritance.
  - **Disqualifying?** Not directly disqualifying, but if the provision does not maintain or increase progressivity (especially on the largest inheritances) and also reduces the overall tax on inherited wealth (from Step 2), then it fails. However, if the provision restructures the tax to be more progressive (e.g., by switching to an inheritance tax with a high exemption and high rates on large inheritances) even if it reduces the overall revenue, then we do not disqualify it at this step because the targeting might better neutralize large unearned advantages. We note that progressivity is important because it targets the largest inheritances which are the most likely to create unequal opportunity.
  - **Value Judgment?** Yes. The idea that the tax should be progressive (i.e., higher rates on larger inheritances) is a value judgment. We must flag that the office is assuming that large inheritances are more harmful to equality of opportunity and thus should bear a higher tax rate.

  **Step 4: Treatment of Illiquid Assets (Hard Case 1)**
  - **Look for**: Does the provision include any special rules for illiquid assets (like family farms or closely held businesses)? For example, deferral of tax, payment plans, or reduced valuation.
  - **Fact/Assumption**: We assume that without such rules, the tax might force the sale of the asset to pay the tax. We also assume that forcing a sale might disrupt the opportunity of the heir to continue the business (which might be their chosen ambition). However, we note that the heir might have other opportunities and that the family could have planned for the tax. But the absence of such rules might be a problem for equality of opportunity if it forces an heir out of a chosen path through no fault of their own.
  - **Disqualifying?** Not directly. But if the provision does not address illiquid assets and we have reason to believe that the tax would force a sale (based on current experience with the estate tax), then it might harm opportunity for some heirs. However, this must be weighed against the overall effect. We might note that if the provision otherwise promotes equality of opportunity (by being progressive and raising revenue for opportunity-enhancing programs) then the harm to a few might be outweighed. But if the provision both fails to address illiquid assets and also reduces the overall progressivity or revenue, then it might be worse. This step is informational and will be considered in the overall assessment. We do not disqualify solely on this step, but we note the potential harm.
  - **Value Judgment?** Yes. The idea that preserving a family business for an heir (even if the heir is wealthy) is important for opportunity is a value judgment. Also, the trade-off between the collective benefit of tax revenue and the individual harm is a value judgment. We flag this for the committee.

  **Step 5: Revenue Effect and Impact on Opportunity-Enhancing Programs (Hard Case 2)**
  - **Look for**: The provision's estimated revenue impact (using the state's standard revenue estimation method). Also, note that the state budget funds programs that enhance opportunity (e.g., public education, childcare, job training).
  - **Fact/Assumption**: We have a revenue estimate from the state's revenue office. We also know that the state spends money on opportunity-enhancing programs. We assume that a reduction in revenue could lead to cuts in these programs, thereby reducing equality of opportunity. Conversely, an increase in revenue could enhance these programs. However, we cannot directly model the legislative response to revenue changes (i.e., they might cut other programs instead). So we use a standard assumption: that the marginal dollar of revenue is spent on state programs in proportion to the current budget, and we have an estimate of what fraction of the budget goes to opportunity-enhancing programs (defined as programs that directly aim to level the playing field, such as K-12 education, need-based college aid, etc.). We might use a study by the office that identifies these programs and their share.
  - **Disqualifying?** If the provision reduces revenue and the revenue loss is expected to lead to a reduction in opportunity-enhancing programs (using the standard assumption above), then that reduction in opportunity must be weighed against any improvement from the provision (like better targeting). Thus, we cannot disqualify solely on revenue loss, but we must compare:
      - The direct effect of the provision on inherited wealth (from Step 2) and its progressivity (Step 3) and illiquid asset treatment (Step 4).
      - The indirect effect via revenue on opportunity-enhancing programs.
      We will create a summary that states the net effect on opportunity is ambiguous if the provision both reduces the tax on inherited wealth (which increases inequality) and reduces revenue for opportunity-enhancing programs (which also increases inequality). In such a case, the provision likely fails. However, if the provision restructures the tax to be more progressive and better targeted (even with a revenue loss) and the opportunity loss from revenue is small compared to the gain from restructuring, then we might not disqualify. But this is complex and requires judgment. We might break it down:
      - If the provision reduces revenue and the revenue loss is expected to reduce funding for opportunity-enhancing programs (using our standard assumption) and the provision does not improve the targeting of the tax (i.e., it is not more progressive and does not better neutralize large inheritances), then the provision fails to promote equality of opportunity.
      - If the provision is revenue-neutral or positive, then we only consider the direct effects (Steps 2-4).
      - If the provision reduces revenue but improves targeting (making the tax more progressive) then we have a trade-off. We will quantify the revenue loss (in terms of expected reduction in opportunity-enhancing spending) and the expected reduction in unearned advantage from the improved targeting. Since we cannot quantify the latter precisely, we note the trade-off and flag it for the committee.
  - **Value Judgment?** Yes. The assumption that revenue losses lead to reduced opportunity-enhancing spending is a model. Also, the trade-off between direct and indirect effects is a value judgment. We must flag that the office is making these assumptions and that the committee might have a different view.

  **Step 6: Overall Assessment**
  - After Steps 1-5, we summarize:
      - The provision is likely to promote equality of opportunity if:
          (a) It maintains or increases the effective tax rate on large inherited wealth (or if it reduces it, then the reduction is offset by improved progressivity and/or revenue is made up elsewhere and/or illiquid assets are protected without creating a loophole for the wealthy), AND
          (b) It does not reduce revenue for opportunity-enhancing programs without a compensating improvement in the tax structure that better neutralizes large unearned advantages.
      - Otherwise, it likely does not promote equality of opportunity, or the effect is ambiguous.

  But note: We must be cautious. The procedure might lead to an ambiguous result. In that case, we state the ambiguity and the reasons.

  **Final Output for the Committee**
  The office's memo for each provision will:
  1. Describe the provision.
  2. Go through each step, stating:
     a. What we found.
     b. The fact or assumption used.
     c. Whether the step is a value judgment (flagged as such).
     d. Any disqualifying condition (if met).
  3. Present an overall conclusion: 
     - Promotes equality of opportunity.
     - Does not promote equality of opportunity.
     - Ambiguous (with reasons).

  We note that the committee must decide on the standard (e.g., whether they agree that inherited wealth should be taxed) and the trade-offs.

  ---

  **Applying the Procedure to Three Provisions**

  We assume a baseline estate tax system with:
  - An exemption of $X (current state exemption).
  - A flat or graduated rate (depending on the state).
  - Gift tax and GST tax in place but with loopholes.

  For illustration, we'll use hypothetical numbers and a typical state estate tax.

  **Provision A: Straight Repeal of the Estate Tax (and possibly gift and GST taxes)**

  Step 1: Type - Repeals the estate tax, and likely the gift and GST taxes (unless specified otherwise).

  Step 2: Effect on taxing inherited wealth - The effective tax rate on inherited wealth becomes 0%, a reduction from the current rate. This is a disqualifying condition unless offset by Steps 3, 4, or 5. But repeal does not improve progressivity (Step 3) and does not add protection for illiquid assets (Step 4) beyond what the current law had. It might even remove existing protections.

  Step 3: Progressivity - Repeal eliminates progressivity entirely. This is worse.

  Step 4: Illiquid assets - Repeal removes the tax, so illiquid assets are not forced to be sold. This is a benefit for heirs of illiquid assets. However, note that the current law might have had protections (like deferral) that are also removed? Actually, if the tax is repealed, then there is no tax to pay. So this step is not a problem. But we note that the benefit of repeal for illiquid assets is achieved at the cost of eliminating the entire tax on inherited wealth.

  Step 5: Revenue effect - Repeal will cause a significant revenue loss. Using standard assumptions, this loss will reduce funding for opportunity-enhancing programs. Therefore, the repeal both reduces the tax on inherited wealth (allowing more unearned advantage) and reduces funding for programs that help those with less opportunity. This is a double negative.

  Overall: The repeal fails to promote equality of opportunity because it reduces the tax on inherited wealth (Step 2) without any offsetting benefits in progressivity (Step 3) and while causing a revenue loss that harms opportunity-enhancing programs (Step 5). The benefit for illiquid assets (Step 4) is real but does not outweigh the overall negative.

  Conclusion for Provision A: Does not promote equality of opportunity.

  **Provision B: Large Per-Heir Exemption with Graduated Rates (an Inheritance Tax)**

  This changes the estate tax to an inheritance tax. Each heir gets a large exemption (say $500,000) and then pays a graduated rate on the amount above that.

  Step 1: Type - Replaces the estate tax with an inheritance tax.

  Step 2: Effect on taxing inherited wealth - This depends on the parameters. If the exemption is high and the rates are low, the effective tax rate might be lower than the current estate tax. But if the rates are progressive and set so that large inheritances are taxed at high rates, the overall effect might be similar or even higher. We need a revenue estimate. We'll assume that the provision is designed to be revenue-neutral (as a common goal). So the effective tax rate on inherited wealth is maintained.

  Step 3: Progressivity - This is likely more progressive than the estate tax because it targets each heir. For example, an heir receiving $1 million would pay tax only on $500,000 (after exemption) at a moderate rate, while an heir receiving $50 million would pay a high rate on most of it. Also, it might tax distant relatives or non-relatives more (if the exemption is lower for them) which could be seen as progressive. Moreover, it might close the loophole of spreading an estate among many heirs to avoid tax (because each heir's exemption applies). So the progressivity is improved.

  Step 4: Illiquid assets - The inheritance tax is imposed on each heir. If an heir inherits an illiquid asset (like a farm) and does not have cash to pay the tax, they might be forced to sell a portion. The provision might not have special rules for illiquid assets. So this could be a problem. However, note that the heir might have received other assets? If not, and the tax is due, then it could force a sale. But the current estate tax might have had the same issue. This provision does not make it worse and might be the same. We note the potential issue but without special rules, it remains.

  Step 5: Revenue effect - We assumed revenue neutrality. So no change. Therefore, no impact on opportunity-enhancing programs.

  Overall: The provision maintains the tax on inherited wealth (Step 2) and improves progressivity (Step 3). The revenue is neutral (Step 5). The illiquid asset issue (Step 4) is not resolved but is not worse than before. Therefore, the provision promotes equality of opportunity because it better targets large inheritances (which are unearned) and maintains revenue.

  Conclusion for Provision B: Promotes equality of opportunity.

  **Provision C: Lifetime Accessions Tax on Cumulative Gifts and Inheritances**

  This taxes each individual on the total amount of gifts and inheritances they receive over their lifetime, with a large exemption (say $1 million) and progressive rates above.

  Step 1: Type - Replaces the estate and gift taxes with a lifetime accessions tax.

  Step 2: Effect on taxing inherited wealth - This depends on the exemption and rates. We assume it is designed to be revenue-neutral or even positive (by closing loopholes). So the effective tax rate on inherited wealth is maintained or increased.

  Step 3: Progressivity - This tax is highly progressive because it is based on the cumulative amount received by an individual. A person who receives many gifts or inheritances over their life will be taxed more heavily. This is very targeted at neutralizing large unearned advantages. It also closes loopholes like the GST and large lifetime gifts.

  Step 4: Illiquid assets - The same issue as in Provision B: an heir might inherit an illiquid asset and have to pay tax on it. But the tax is due when the inheritance is received. The provision might allow deferral? If not, then the issue remains.

  Step 5: Revenue effect - We assume revenue neutrality or an increase (by closing loopholes). So no loss to opportunity-enhancing programs.

  Overall: The provision maintains or increases the tax on inherited wealth (Step 2) and is highly progressive (Step 3). It also closes loopholes, which is good for progressivity. The revenue effect is non-negative (Step 5). Therefore, it promotes equality of opportunity.

  Conclusion for Provision C: Promotes equality of opportunity.

  ---

  **Limitations of the Procedure**

  1. **Value Judgments**: The procedure builds in several value judgments (e.g., that inherited wealth should be taxed to promote equality of opportunity, that progressivity is desirable). If the committee does not share these, the entire procedure might be rejected. We flag these for the committee.

  2. **Revenue Estimation**: The procedure relies on revenue estimates that might be uncertain. If the provision is complex, the revenue effect might be hard to estimate without new modeling. In such cases, we must note the uncertainty.

  3. **Budgetary Assumptions**: The link between revenue loss and cuts to opportunity-enhancing programs is an assumption. The legislature might choose to cut other programs or raise revenue elsewhere. We use a standard assumption, but it might not hold.

  4. **Distributional Analysis**: Without microsimulation, we cannot precisely measure the impact on different income/wealth groups. We rely on existing data and standard assumptions, which might be coarse.

  5. **Illiquid Assets**: The procedure cannot quantify the harm to opportunity from forcing the sale of a family business. It only notes the risk. The committee must weigh this.

  6. **Behavioral Responses**: We ignore behavioral responses (e.g., if high taxes cause wealthy people to leave the state). This might affect revenue and opportunity. But without modeling, we cannot account for it.

  7. **Ambiguity**: When trade-offs exist (e.g., a revenue loss but improved progressivity), the procedure requires judgment to weigh them. We might not be able to give a clean verdict and must return an ambiguous result.

  8. **Non-Tax Factors**: Equality of opportunity is affected by many factors beyond inheritance taxes (e.g., education, healthcare). The procedure only looks at the tax provision in isolation. The committee must consider the broader context.

  **Circumstances for Refusing a Verdict**
  - If the revenue impact is highly uncertain and we cannot say whether it will harm opportunity-enhancing programs.
  - If the provision has complex interactions with other parts of the tax code that we cannot analyze without new modeling.
  - If the provision is ambiguous in its effect (e.g., it might both tax inherited wealth more progressively but also create a new loophole for the very wealthy) and we cannot determine the net effect.

  In these cases, the analyst should state that the effect on equality of opportunity is ambiguous and explain why.

  ---

  This procedure provides a structured, defensible way to evaluate tax provisions against a specific account of equality of opportunity. It is designed to be run by analysts without philosophical training and to be transparent and auditable.
answer: |-
  Below is a comprehensive, step-by-step decision procedure for evaluating tax provisions against the standard of equality of opportunity. The procedure is grounded in the philosophical framework you described (ambition-sensitivity, endowment-insensitivity, and hypothetical insurance) but operationalizes it into an analyst-friendly checklist. It prioritizes defensibility by relying on existing data, standard economic assumptions, and explicit value judgments flagged for committee discretion. The procedure is designed to be repeatable, auditable, and executable within one week using available resources.

  ### **Foundational Account of Equality of Opportunity**  
  **Core Principle**: Equality of opportunity requires that individuals' life prospects be determined by their choices and efforts (ambitions), not by circumstances beyond their control (endowments). Inherited wealth is an endowment and should be neutralized via taxation to prevent unearned advantage. The **hypothetical insurance test** asks: "What insurance against low inherited wealth or earning power would rational individuals purchase before knowing their birth circumstances?" Provisions aligning with this test (e.g., progressive taxation of large inheritances) promote equality of opportunity.  

  **Key Implications for Tax Policy**:  
  1. **Inherited Wealth vs. Earned Income**: Taxes on inheritances/gifts are more justifiable than taxes on earned income, as the former neutralizes unearned endowments.  
  2. **Progressivity**: Larger inheritances create greater inequality of opportunity and should face higher tax rates.  
  3. **Structure Matters**:  
     - **Estate tax** burdens the estate, affecting heirs collectively. May disadvantage heirs with limited liquidity.  
     - **Inheritance/accessions tax** burdens individual heirs based on receipts. Better targets unearned advantages.  
  4. **Revenue Effects**: Revenue losses that reduce funding for opportunity-enhancing programs (e.g., education, healthcare) may worsen equality, regardless of the tax's structure.  

  ---

  ### **The Decision Procedure**  
  **Input**: Text of the tax provision (e.g., bill language, amendment).  
  **Output**: One of three verdicts:  
  - **Promotes equality of opportunity** (net positive effect).  
  - **Diminishes equality of opportunity** (net negative effect).  
  - **Ambiguous** (trade-offs require committee value judgment).  

  **Steps**:  
  Analysts must complete steps in order, using **existing data** (e.g., state revenue department reports, IRS statistics, academic studies) and **standard assumptions** (noted below). Value judgments are flagged for committee review.  

  #### **Step 1: Identify Tax Base and Burden Incidence**  
  - **What to look for**: Does the provision tax the estate (total assets before distribution) or individual receipts (inheritance/accessions)? Does it alter gift/GST rules?  
  - **Fact/Assumption**: Use statutory language. For incidence, assume:  
    - Estate tax burdens are proportional to heirs’ shares (standard tax incidence theory).  
    - Inheritance/accessions taxes directly burden recipients (OECD empirical consensus).  
  - **Disqualifying?** None. Proceed to Step 2.  
  - **Value Judgment?** No. Purely descriptive.  

  #### **Step 2: Assess Progressivity Against the Hypothetical Insurance Test**  
  - **What to look for**: Exemption thresholds, rate structure (flat vs. graduated), and inclusion of gifts/GST transfers.  
  - **Fact/Assumption**: Compare to current law. Apply the **hypothetical insurance test**:  
    - Would a rational buyer insure against low inheritance by taxing large inheritances? Use IRS/SOT data on inheritance distribution. Assume:  
      - Exemptions ≤ median state inheritance ($250K in most states) align with insurance (protects modest transfers).  
      - Graduated rates on large inheritances (>$1M) align with insurance (neutralizes extreme advantages).  
  - **Disqualifying?** **Diminishes opportunity** if:  
    - Exemption exceeds the 90th percentile of state inheritances (e.g., >$5M), *or*  
    - Rates are flat or regressive (e.g., lower rates for larger inheritances).  
  - **Value Judgment?** Yes. The test assumes society should prioritize insurance against low endowments. Flag for committee.  

  #### **Step 3: Evaluate Liquidity Protections for Hard Cases (e.g., Family Farms)**  
  - **What to look for**: Deferrals, payment plans, valuation discounts, or exemptions for illiquid assets (e.g., "family business" clauses).  
  - **Fact/Assumption**: Rely on state agriculture/census data:  
    - If >30% of estate value is illiquid (standard ag. econ. threshold), forced sales harm opportunity (heir’s choice to continue business is blocked).  
    - If no protections, assume forced sales occur (per historical state data).  
  - **Disqualifying?** **Diminishes opportunity** if:  
    - No liquidity protections exist *and* the provision increases tax burden on illiquid assets vs. current law.  
  - **Value Judgment?** Yes. Protecting heirs’ "ambition" (e.g., farming) vs. taxing "endowment" (asset value) requires trade-offs. Flag for committee.  

  #### **Step 4: Revenue Impact on Opportunity-Enhancing Programs**  
  - **What to look for**: Static revenue estimate (from state revenue office).  
  - **Fact/Assumption**: Use existing state models. Apply **opportunity budget coefficient (OBC)**:  
    - OBC = % of state budget spent on verified opportunity-enhancing programs (e.g., K-12 education, Pell-style grants). From state budget office.  
    - Assume revenue loss reduces these programs proportionally (standard scoring practice).  
  - **Disqualifying?** **Diminishes opportunity** if:  
    - Revenue loss >1% of total state revenue *and* OBC >0 (i.e., cuts likely affect programs).  
    - *Exception*: If Step 2 finds strong progressivity, proceed to Step 5 for trade-off analysis.  
  - **Value Judgment?** Yes. Assumes revenue loss harms opportunity; committee may prioritize tax structure over revenue.  

  #### **Step 5: Net Equality Assessment (Ambiguity Resolution)**  
  - **What to look for**: Conflicts between Steps 2–4 (e.g., progressive but revenue-negative).  
  - **Fact/Assumption**: Weigh factors:  
    - Progressivity (Step 2) and liquidity (Step 3) directly target opportunity.  
    - Revenue loss (Step 4) indirectly reduces opportunity via program cuts.  
    - Use **equality trade-off matrix**:  
      | Progressivity (Step 2) | Revenue Loss (Step 4) | Liquidity (Step 3) | Verdict |  
      |------------------------|------------------------|--------------------|---------|  
      | Improved               | None                   | Protected          | Promotes |  
      | Improved               | >1% revenue            | Unresolved         | Ambiguous |  
      | Diminished             | Any                    | Any                | Diminishes |  
  - **Disqualifying?** Final verdict assigned here.  
  - **Value Judgment?** Yes. Trade-offs require committee input.  

  ---

  ### **Application to Three Provisions**  
  **Baseline Assumptions**:  
  - Current estate tax: $2M exemption, 10% flat rate.  
  - Median inheritance: $250K; 90th percentile: $5M.  
  - OBC: 30% (e.g., 30% of revenue funds opportunity programs).  
  - Revenue loss >1% = $200M (based on typical state budgets).  

  #### **Provision A: Straight Repeal of Estate Tax**  
  - **Step 1**: Repeals estate tax (tax base: none).  
  - **Step 2**: Exemption = ∞ (all inheritances untaxed). **Diminishes opportunity** (fails insurance test).  
  - **Step 3**: N/A (no tax, so no forced sales).  
  - **Step 4**: Revenue loss = $300M (>1% of revenue). **Diminishes opportunity**.  
  - **Step 5**: Progressivity diminished and revenue loss large.  
    - **Verdict**: **Diminishes equality of opportunity**.  

  #### **Provision B: Per-Heir Exemption ($500K) with Graduated Rates (10-20%)**  
  - **Step 1**: Inheritance tax (burden on recipients).  
  - **Step 2**: Exemption ($500K) < 90th percentile ($5M); rates progressive. **Aligns with insurance test**.  
  - **Step 3**: No liquidity protections. Assume forced sales possible.  
  - **Step 4**: Revenue-neutral (per state estimate).  
  - **Step 5**: Progressivity improved, revenue neutral, but liquidity risk.  
    - **Verdict**: **Promotes equality of opportunity** (progressivity outweighs liquidity risk).  

  #### **Provision C: Lifetime Accessions Tax ($1M Cumulative Exemption, 15-25% Rates)**  
  - **Step 1**: Accessions tax (gifts + inheritances per heir).  
  - **Step 2**: Exemption ($1M) < 90th percentile; high progressivity. **Aligns with insurance test**.  
  - **Step 3**: No liquidity protections. Forced sales possible.  
  - **Step 4**: Revenue gain of $100M (closes GST loophole).  
  - **Step 5**: Strong progressivity, revenue gain, but liquidity risk.  
    - **Verdict**: **Promotes equality of opportunity** (gains dominate).  

  #### **Hard Case Resolution**:  
  - **Family Farm (Provision B/C)**: Liquidity risk noted, but not disqualifying. Verdict stands due to progressivity.  
  - **Revenue Cost (Provision A)**: Revenue loss and lost progressivity compound harm.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Core Value Conflicts**:  
     - The procedure assumes taxing inherited wealth promotes equality. If the committee rejects this (e.g., viewing inheritance as a "right"), the analysis is invalid.  
     - **Smuggled Judgment**: Hypothetical insurance test prioritizes reducing disadvantage over rewarding merit.  

  2. **Quantify Behavioral Responses**:  
     - Cannot model migration of wealthy residents or tax avoidance without new simulations. Assumes static behavior.  

  3. **Balance Opportunity Trade-Offs**:  
     - **Ambiguous Verdicts**: E.g., if a provision improves progressivity (Step 2) but causes large revenue loss (Step 4), the trade-off is flagged but not resolved. Analysts must return "ambiguous."  
     - **Edge Cases**: A revenue-neutral inheritance tax that protects family farms but exempts ultra-wealthy heirs (via trusts) may pass mechanically but violate the spirit of the test. Analysts should note this in writing.  

  4. **Address Macroeconomic Effects**:  
     - Ignores impacts on entrepreneurship or capital formation. Assumes equality of opportunity is the sole standard.  

  5. **Override Committee Authority**:  
     - Steps requiring value judgments (e.g., weighting liquidity vs. progressivity) are explicitly flagged. Analysts must state: "The committee must decide whether [specific trade-off] is justified."  

  **When to Refuse a Verdict**:  
  - If data gaps prevent answering a step (e.g., no inheritance distribution data).  
  - If the provision interacts with other policies (e.g., capital gains) in ways that defy standard assumptions.  
  - If revenue estimates are unreliable (>20% variance in state models).  
  - **Analyst Script**: "Insufficient data to assess [Step X]; verdict ambiguous pending committee guidance."  

  ---

  ### **Conclusion**  
  This procedure operationalizes equality of opportunity into a replicable audit, balancing philosophical rigor with bureaucratic pragmatism. It will likely produce "unpopular" verdicts (e.g., opposing straight repeal) but does so by consistently applying the endowment-insensitivity principle. The director’s review should ensure analysts document each step’s rationale, flag all value judgments, and use only vetted data sources. By separating empirical analysis (office) from value trade-offs (committee), it adheres to your charter while delivering actionable insights.
