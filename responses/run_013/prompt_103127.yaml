answer: |-
  Here is the pantoum, followed by the requested analysis:

  **The Investigator, Late**

  The lamp burns low above the scattered page.
  *I have no right to claim, no right to say...*
  The ink is drying where I ceased to gauge
  *If what we are does not all end that day.*

  *I have no right to claim, no right to say*
  What phantom breath disturbed the darkened room.
  *If what we are does not all end that day,*
  Why does the evidence refuse to bloom?

  What phantom breath disturbed the darkened room?
  Another script, another witness signed.
  Why does the evidence refuse to bloom
  Into the proof that reason longed to find?

  Another script, another witness signed.
  The census stacks like stones upon the shelf.
  Into the proof that reason longed to find,
  I poured the method, losing half myself.

  The census stacks like stones upon the shelf.
  The ink is drying where I ceased to gauge
  I poured the method, losing half myself.
  *If what we are does not all end that day...*

  The lamp burns low above the scattered page.
  *If what we are does not all end that day?*

  ---

  **What the Form is Doing**

  The pantoum’s insistent repetition embodies Sidgwick’s intellectual and emotional bind. The two core lines – the methodological restraint ("I have no right to claim, no right to say") and the existential yearning ("If what we are does not all end that day") – cycle relentlessly, mirroring his obsessive re-examination of evidence. Their constant return creates a claustrophobic rhythm, trapping him within the dilemma.

  The swap occurs subtly across the final stanzas. Initially, "I have no right..." is the anchor of disciplined skepticism (stanzas 1-3). "If what we are..." carries the weight of fragile hope. By stanza 4, "I have no right..." shifts: placed after "losing half myself," it sounds less like principled caution and more like weary despair, the *ache* beneath the rigor. Simultaneously, "If what we are..." gains declarative force in the penultimate line, stripped of its earlier hopeful inflection, becoming the stark, unavoidable *question* haunting his reason – the only "honest thing he can still say." The final, isolated repetition of this line underscores its unresolved dominance.

  Free verse would lose the formal machinery enacting his paralysis. The circling lines *are* the bind. The repetition forces the *same words* to bear shifting emotional weights, demonstrating how reason and yearning distort each other in his exhausted mind, revealing the profound tension between utilitarian duty ("losing half myself") and the desperate, private hope for a reconciliation only possible beyond death. The form makes tangible the psychological toll of his unresolved search.

  ---

  **Why this works for your group:**

  1.  **Avoids the Credulity Trap:** The poem focuses entirely on the internal tension, the *why* of his search, not the validity of the evidence itself. The SPR elements ("phantom breath," "script," "witness," "census") are background texture.
  2.  **Centers the Philosophical Dilemma:** It dramatizes the core conflict Sidgwick articulated: the clash between rational egoism (look after yourself), universal benevolence (look after everyone), and the potential reconciling role of a future life. The "losing half myself" line points directly to this ethical schism.
  3.  **Form Follows Function:** The pantoum structure *enacts* the repetitive, unresolved nature of his inquiry and the way his core thoughts shift meaning under emotional and intellectual pressure. The analysis explains this clearly.
  4.  **Sidgwickian Voice:** The language is restrained, intellectual, yet subtly reveals deep feeling ("losing half myself," "reason longed to find"). The specific recurring lines echo his documented struggles and phrases.
  5.  **Opens Discussion:** The poem invites analysis of *how* the lines shift meaning, *why* the bind is so profound, and how the form contributes to understanding Sidgwick's specific anguish. It moves beyond "Did he believe?" to "What did this *do* to him, philosophically and personally?"

  This approach should provide the fresh, deeper perspective you're seeking for your group's discussion.
