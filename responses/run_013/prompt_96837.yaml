  **Objection 3 (Philosopher: Vagueness of gathered vs scattered):**
     - Objection: "Your distinction between gathered and scattered collections is vague. What counts as a rule? Must it be definable in a formal language? And what is a prior act? Without a clear demarcation, your argument is hand-wavy. Also, the iterative conception includes arbitrary subsets, so why not arbitrary choice functions?"
     - Reply (2 minutes): "I admit the distinction is not formalized in standard set theory. But I'm offering a conceptual analysis. By 'gathered', I mean sets that are specified by a property (even if impredicative) or by a construction. For example, in the cumulative hierarchy, at each stage we form sets of subsets from previous stages. A gathered family would be one that is defined by a formula or is a set in the hierarchy. A scattered family is one that is arbitrary and might not have a defining property. The iterative conception gives us gathered collections naturally. But when we consider a family of non-empty sets that is arbitrary (say, indexed by an arbitrary set), we have no rule to pick an element from each. The power set axiom gives us the set of all subsets, but it doesn't give us a way to pick one element from each subset in an arbitrary family. So the power set doesn't directly justify AC. However, I concede that a full formalization of this distinction would require a new system, which I haven't provided. But the point is that AC is not self-evident for arbitrary families."
