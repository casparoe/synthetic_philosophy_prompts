prompt: |-
  Next week I'm talking to our logic and set theory reading group and I need a Q&A prep sheet. My line is that the axiom of choice isn't self-evident at all -- what looks like obviousness is an artifact of the iterative conception of set, and if you separate what I'm calling 'gathered' collections (ones picked out by a rule or by a prior act of collecting) from 'scattered' ones (arbitrary families with no such handle), AC is only compelling for the gathered ones; over the scattered ones it's a substantive existence claim dressed up as a matter of logic. The room is mostly set theorists who live in forcing and inner models and are totally relaxed about AC, two constructivists who think AC is where classical math took a wrong turn, and one philosopher of math who wont stop going on about intrinsic vs extrinsic justification. Give me the objections I'll actually get, roughly in the order they'll come, each phrased in the vocabulary of whichever group would raise it, ordered by how much damage they do, with a two-minute reply for each and a note on where the reply is soft. Flag what I should just concede up front, and tell me the one question I'm secretly hoping nobody asks.
reasoning: |-
  We are preparing for a Q&A session. The speaker's main thesis is that the Axiom of Choice (AC) is not self-evident. They argue that what seems obvious about AC is an artifact of the iterative conception of set. They distinguish between "gathered" collections (defined by a rule or prior act) and "scattered" collections (arbitrary families without such a handle). The speaker claims AC is only compelling for gathered collections and is a substantive existence claim for scattered ones.

