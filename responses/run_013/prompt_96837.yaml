  Now, let's draft replies for each.

  **Objection 1 (Set theorist: Utility of AC):**
     - Objection: "In set theory, AC is indispensable. Without it, we can't prove basic things like every vector space has a basis, or Tychonoff's theorem. Forcing and inner models are built in ZFC. How can you dismiss AC when it's so useful?"
