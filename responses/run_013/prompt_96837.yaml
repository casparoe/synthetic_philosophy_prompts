  Now, order by damage and likelihood:

  - The set theorists are the majority and will likely lead. The first objection (about the utility of AC in set theory) is likely to come first and is moderate in damage.

  - Then, the constructivists might jump in with their point (objection 2). This is less damaging because the speaker can agree that AC is problematic for constructivists, but the speaker is making a point within classical set theory.

