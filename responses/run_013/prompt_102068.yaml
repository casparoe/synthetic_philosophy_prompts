prompt: |-
  I'm trying to get clear on Kripke's rule-following puzzle before I commit to any solution, and I keep noticing that people argue for dispositionalism or the community view by waving at one case (the quus thing) and I want the full spec first. Give me the desiderata: what any adequate theory of what makes it the case that someone is following one rule rather than another has to deliver -- the cases it must get right, the distinctions it can't collapse, the constraints about finite past behaviour and about normativity it can't contradict -- with the consideration behind each requirement. I want the list to survive three cases I actually care about: (a) the standard one, someone who has only ever added small numbers and is now asked to add big ones; (b) a rule that gets applied exactly once in the history of the universe, so there's no community, no repetition, and no chance to check it -- does the theory even permit that, and what has to give if it doesn't?; and (c) a follower whose dispositions are irreducibly probabilistic, like a stochastic policy that would answer differently on identical inputs, so what they would do is a distribution rather than a fact. Then tell me which of the requirements I'm demanding are genuine and which are just the prejudices of one camp, flag any pair you suspect can't be jointly satisfied (that's the part I most want), and say which single requirement knocks out the most of the going theories. If it's cheap, score dispositionalism, the community view, and primitivism against the list, but keep the weight on the criteria. Skip the citations, I dont need a reading list.
