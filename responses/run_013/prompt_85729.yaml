answer: |-
  Below is a decision tree for your evolution reading group, structured to resolve recurring debates about levels of selection. It starts from the agreed-upon premise (differential reproduction of trait-bearers) and branches on questions about **claims**, using concrete cases to force clear answers. Each leaf names a position and highlights its most awkward commitment. The tree explicitly flags equivalent positions (e.g., inclusive fitness vs. weak group selection) and identifies incoherent/unexplored branches.  

  ---

  ### **The Decision Tree**  

  #### **Node 1: Is selection a causal process (beyond statistical patterns)?**  
  - **No** → **Leaf A: *Statistical Summary View***  
    *Awkward commitment:* "Selection" is just descriptive math; drift is the only causal process. "Units of selection" are arbitrary bookkeeping labels.  
    *(e.g., Arguing over group selection is like debating whether gravity "causes" falling—it’s just a summary of outcomes.)*  
  - **Yes** → Proceed to Node 2.  

  #### **Node 2: Is the trait’s heritability tied to genes?**  
  - **No** (e.g., trait spread via imitation, culture, or environmental feedback) → **Leaf B: *Non-Genic Inheritance View***  
    *Awkward commitment:* Heritable variation exists without genetic replication, so "replicators" (like genes) aren’t essential. Ignores how non-genic traits avoid dilution/blending.  
    *(e.g., Birdsong dialects spread via imitation; fitness depends on local norms, not genes.)*  
  - **Yes** → Proceed to Node 3.  

  #### **Node 3: Can fitness be counted at a higher level than the individual?**  
  *(e.g., Aggregating individuals into groups/patches and assigning group fitness)*  
  - **No** → **Leaf C: *Gene’s-Eye View (Standard)***  
    *Awkward commitment:* All adaptations must ultimately benefit genes. Struggles with altruism without invoking reciprocity/kin.  
    *(e.g., A "gene for helping" only spreads if it directly boosts the helper’s reproductive output.)*  
  - **Yes** → Proceed to Node 4.  

  #### **Node 4: Is the group itself a reproducing entity?**  
  *(e.g., Groups fission, found colonies, or "die" as cohesive units)*  
  - **No** → **Leaf D: *Weak Group Selection (MLS1)***  
    *Awkward commitment:* Group fitness is just a statistical aggregate of individuals. Mathematically identical to inclusive fitness (see Leaf E).  
    *(e.g., A patch with more helpers produces more emigrants, but groups don’t "reproduce" as units.)*  
  - **Yes** → Proceed to Node 5.  

  #### **Node 5: Is the group trait heritable at the group level?**  
  *(e.g., Daughter groups resemble parent groups in structure/composition)*  
  - **No** → **Leaf F: *Unattractive/Incoherent***  
    *Why?* Groups "reproduce" but don’t pass traits—so group-level selection can’t act. Rarely defended.  
    *(e.g., Temporary coalitions like fish shoals can’t inherit "altruism" if membership reshuffles randomly.)*  
  - **Yes** → Proceed to Node 6.  

  #### **Node 6: Is the group the unit of replication?**  
  *(e.g., Group traits copied as wholes, not via genes of members)*  
  - **No** → **Leaf G: *Strong Group Selection (MLS2—Genes Replicate)***  
    *Awkward commitment:* Groups are "vehicles" for genes. Within-group selection often opposes group advantage.  
    *(e.g., Multicellularity: Groups (bodies) reproduce, but selection acts on cell lineages too.)*  
  - **Yes** → **Leaf H: *Strong Group Selection (MLS2—Groups Replicate)***  
    *Awkward commitment:* Groups must inherit/integrate traits independently of lower-level evolution.  
    *(e.g., Insect colonies reproducing via swarms: group traits like caste ratio are heritable.)*  

  ---

  ### **Equivalent Positions & Notes**  
  - **Leaf D (Weak Group Selection)** ≡ **Leaf E: *Inclusive Fitness***  
    *Same math:* Both partition covariance (helping spreads if \( rb > c \)). Using groups vs. kin is a bookkeeping choice.  
    *Leaf E’s awkward commitment:* Requires additivity/linearity—breaks down with complex traits (e.g., "if everyone helps, freeloaders win").  
  - **Species Selection** is embedded in **Leaf B** (if non-genic) or **Node 5+** (if group-like):  
    *Awkward commitment:* Species "fitness" (speciation/extinction) rarely links cleanly to heritable traits (e.g., geographic range).  
  - **Unbranched positions**:  
    - **Leaf I: *Individual Selection*** → Collapses into **Leaf C** (if gene-focused) or **Node 4** (if group effects matter).  

  ---

  ### **Tree Summary**  
  - **Nodes**: 6 (1 initial + 5 splits).  
  - **Leaves**: 9 positions (including equivalents and incoherent branches).  
  - **Key distinctions**:  
    1. Causal vs. statistical (Node 1).  
    2. Heritability level (Node 2).  
    3. Fitness aggregation (Node 3).  
    4. Group reproduction (Node 4) → **MLS1 vs. MLS2 is real** (weak vs. strong groups).  
    5. Trait copying vs. fitness counting (via equivalence of Leaf D/E).  
    6. Replicator identity (Node 6).  

  ---

  Use this tree to anchor debates: **Force the group to answer each node with concrete cases** (e.g., "Is this helping trait heritable at the group level? If yes, how?"). It exposes when positions are equivalent (no need to argue), incoherent (drop them), or genuinely distinct (focus there).
