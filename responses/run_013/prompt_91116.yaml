  my decision theory reading group has spent the last month on the standard weird cases and i'm starting to think every one of them is hand-built to make exactly one theory look stupid, which is fun to argue about and useless for actually telling the theories apart. so i want one case built to order, with two tricks in it at once, and i want to see whether they stack, cancel each other, or do something else entirely.

  the two tricks, as i've had them explained to me — tell me if i've got either wrong, but just a line, dont re-litigate the standard cases: in counterfactual mugging a predictor flips a coin; on heads it asks you for $100 and you're free to refuse, on tails it hands you $1000 if and only if it predicted you'd have paid up on heads, and you never learn which way the coin went. the story i've been told is that the causal reasoner refuses, the evidential reasoner also refuses (the coin is independent of you, so paying can't tell you anything about it, and the $1000 sits in a branch where you never get to act), and the fixed-policy reasoner pays, since its the same decision either way and paying buys the good half of the coin. in the XOR blackmail case the predictor sends you a letter demanding $1000, and the letter is sent if and only if exactly one of two things is true: your house has termites, or you pay up. termites cost you a million. there the causal reasoner refuses, the fixed-policy reasoner also refuses (paying $1000 in the no-termite worlds is just money out the door), and the evidential reasoner pays, because given the letter arrived exactly one of the two disjuncts holds, so by paying you make the letter's arrival be explained by the payment and not by the termites. the twist being that the arrival of the letter is tied to your disposition, so the usual "a blackmail letter is bad news" instinct gets turned around.

  what i want is one case, ordinary life, no Omega, no superintelligence, no perfect predictors, no exotic physics, no sums of money a normal person couldn't lose — a person who reads you well but isn't infallible is fine, and probably necessary. it has to contain both tricks at once: a payoff that only lands in a branch where you never get to act, and a signal whose arrival is conditioned on what you do, so that your action selects which explanation of the signal is true. give me an accuracy number for the predictor and say exactly what it's accurate about; if the case is ill-posed with a fallible predictor, say so and fix a model of the prediction that makes it well-posed rather than waving at it. scenario in one paragraph, then the work: what each of the three reasoners does, with numbers, not vibes, and i want at least two of them to disagree about the action — if they all shrug and do the same thing the case is dead on arrival. then: do the two tricks interact, or do they just sit side by side? my hunch is that welding them together gives you a pairing that neither of the standard cases produces — some two theories agreeing against the third, but a different pair than either case above — and if that's what happens i want the mechanism; if it isn't, dont fake it, tell me what actually happens and why the hunch was wrong. then the honest parts: which single feature of your case is doing the work, what breaks if you delete it (cut the signal and does it collapse back to plain mugging? cut the counterfactual payoff and does it collapse back to plain blackmail?), and how a defender of whichever reasoner comes out worst would attack the case — in particular whether they could say you smuggled the verdicts in instead of generating them. last thing, because i care about this one: the accuracy number should matter, so slide it from chance up to near-perfect and tell me where each reasoner flips, and whether those thresholds are structural or just artifacts of the number