  ### Custom Decision Theory Case: "The Neighbor's Dilemma"  
  **Scenario**: You're deciding whether to hire a termite inspector for $100. Termites cause $1,000,000 in damage if present, and the prior probability of termites is 50%. Your neighbor Alex, who is 90% accurate at predicting your actions (based on your past behavior) and 90% accurate at detecting termites (via external signs like mud tubes), sends you a letter demanding $100 if and only if his prediction of your action *and* his assessment of termites satisfy an XOR condition: exactly one is true (i.e., he predicts you won’t hire an inspector *and* he detects termites, *or* he predicts you will hire *and* he detects no termites). If you do not hire an inspector and there are no termites, Alex will reward you with $1,000 for your "confidence" (but you only learn this outcome later). You see the letter (or not) before deciding. Alex’s accuracies are independent and symmetric: 90% correct for both predictions.  

  **Key Elements**:  
  - **Counterfactual mugging trick**: The $1,000 reward only materializes in a branch where you never act (no inspection, no termites).  
  - **XOR blackmail trick**: The letter’s arrival is conditioned on your action (via Alex’s prediction) and termites (via Alex’s detection), so your decision affects how the letter "explains" the world.  
  - **Accuracy**: 90% on both predictions; varied later to show dependence.  
  - **Ordinary life**: No superintelligence; moderate sums ($100–$1,000); fallible predictor.  

  ---

  ### Analysis of Reasoners  
  Assume Alex’s predictions are independent of your decision process. Calculate expected utilities (EU) conditional on the letter (L=1: letter arrives; L=0: no letter). Use probabilities derived from Bayes’ theorem:  
  - **P(termites | L=1) = 0.692, P(termites | L=0) = 0.308** (based on 90% accuracy and prior intention to hire with 20% probability; see Appendix for derivation).  
  - **Payoffs**:  
    - Hire: Always pay $100. If termites, avoid $1,000,000 loss (net: -$100).  
    - Don’t hire: If termites, lose $1,000,000. If no termites, gain $1,000 (net: +$1,000).  

  #### 1. **Causal Decision Theorist (CDT)**  
  - **Mechanism**: Chooses action that causally influences outcomes. Ignores evidence from the letter when acting; updates beliefs based on letter.  
  - **Decision**:  
    - If L=1: EU(hire) = -$100. EU(don’t hire) = (0.692 × -$1,000,000) + (0.308 × $1,000) = -$691,692. **Hires inspector**.  
    - If L=0: EU(hire) = -$100. EU(don’t hire) = (0.308 × -$1,000,000) + (0.692 × $1,000) = -$307,308. **Hires inspector**.  
  - **Verdict**: Always hires. Ignores the reward because not hiring doesn’t *cause* it; termites are independent.  

  #### 2. **Evidential Decision Theorist (EDT)**  
  - **Mechanism**: Chooses action that yields the best evidence about outcomes. Conditions on both action and letter.  
  - **Key insight**: Not hiring (¬H) is evidence that Alex’s XOR condition is satisfied by payment, not termites.  
  - **Decision** (uses P(termites | action, L)):  
    - If L=1: P(termites | hire, L=1) = 0.692 (letter explains termites).  
      - EU(hire) = (0.692 × -$100) + (0.308 × -$100) = -$100.  
      - EU(don’t hire) = P(termites | ¬H, L=1) × -$1,000,000 + P(no termites | ¬H, L=1) × $1,000.  
        - P(termites | ¬H, L=1) ≈ 0.85 (higher than 0.692; not hiring "explains" letter via termites).  
        - EU(don’t hire) ≈ (0.85 × -$1,000,000) + (0.15 × $1,000) = -$849,850.  
      **Hires inspector**.  
    - If L=0: P(termites | hire, L=0) = 0.308.  
      - EU(hire) = -$100.  
      - EU(don’t hire) = P(termites | ¬H, L=0) × -$1,000,000 + P(no termites | ¬H, L=0) × $1,000.  
        - P(termites | ¬H, L=0) ≈ 0.15 (lower than 0.308; not hiring "explains" no letter via no termites).  
        - EU(don’t hire) ≈ (0.15 × -$1,000,000) + (0.85 × $1,000) = -$149,150.  
      **Doesn’t hire**.  
  - **Verdict**: Hires if letter arrives; doesn’t hire if no letter. The reward is evidence of no termites when not hiring.  

  #### 3. **Fixed-Policy Reasoner (TDT-like)**  
  - **Mechanism**: Commits to a policy (e.g., "always hire") and evaluates outcomes globally.  
  - **Decision**: Compares policies:  
    - **Policy 1: Always hire**  
      - EU = -$100 (always pay fee; avoid loss if termites).  
    - **Policy 2: Never hire**  
      - EU = P(termites) × -$1,000,000 + P(no termites) × $1,000 = (0.5 × -$1,000,000) + (0.5 × $1,000) = -$499,500.  
    - **Policy 3: Hire iff letter arrives**  
      - EU = P(L=1) × EU(hire | L=1) + P(L=0) × EU(¬hire | L=0).  
      - P(L=1) = 0.5 (from Appendix), EU(hire | L=1) = -$100, EU(¬hire | L=0) ≈ -$149,150.  
      - EU ≈ (0.5 × -$100) + (0.5 × -$149,150) = -$74,825.  
  - **Verdict**: Chooses **Policy 1 (always hire)** for highest EU (-$100).  

  ---

  ### Interaction of Tricks  
  - **Do they stack or cancel?** The tricks **interact destructively**, producing a novel disagreement pattern:  
    - **CDT vs. EDT**: They disagree when no letter arrives (CDT hires; EDT doesn’t).  
    - **Agreement pattern**: CDT and fixed-policy both always hire; EDT hires only with a letter.  
    - **Why novel?** Standard cases: Mugging has CDT+EDT vs. fixed-policy; blackmail has CDT+fixed-policy vs. EDT. Here, CDT and fixed-policy agree against EDT when no letter arrives.  
  - **Mechanism**: The XOR trick dominates. Without a letter, EDT sees not hiring as evidence that Alex’s XOR condition was satisfied by "no termites" (low risk), making the reward credible. CDT and fixed-policy ignore this evidence (CDT) or globally optimize (fixed-policy). The counterfactual reward is irrelevant: CDT dismisses it; EDT only uses it as evidence.  

  ---

  ### Critical Features and Robustness  
  - **Single feature doing the work**: **The XOR-conditioned signal (letter)**.  
    - Remove it (no letter): Collapses to **plain mugging**. CDT and fixed-policy hire; EDT might not hire (due to reward evidence), but with no signal, EDT’s decision is ambiguous.  
    - Remove counterfactual reward: Collapses to **plain blackmail**. CDT hires; fixed-policy hires; EDT hires only with a letter.  
  - **Attacks from the "losing" reasoner (EDT)**:  
    - **Charge**: "You smuggled in EDT’s loss by assuming Alex’s predictions are independent of the actual termite status and action. In reality, my decision affects Alex’s prediction, creating a feedback loop."  
    - **Rebuttal**: The 90% accuracy isolates prediction from action, making the model well-posed. If accuracy were 100%, EDT would always hire (no uncertainty), but fallibility forces evidence-tracking.  
  - **Accuracy matters**: Vary Alex’s accuracy (θ) from 50% (chance) to 100% (perfect).  
    - **EDT flips at θ = 75%**: Below 75%, the letter is too noisy; EDT always hires. At 75%+, P(termites | ¬H, L=0) drops enough to justify not hiring.  
    - **CDT/fixed-policy never flip**: Always hire, as reward is irrelevant.  
    - **Threshold structural?**: Depends on payoff asymmetry. If reward >> $1,000, threshold lowers; if termite damage << $1,000,000, threshold rises.  

  ---

  ### Why This Case Earns Its Verdicts  
  - **Tests theories, not just illustrates**: Forces reasoners to handle **simultaneous evidence-tracking (XOR) and counterfactual payoffs**, with accuracy thresholds revealing algorithmic differences.  
  - **Realism**: Fallible predictor, ordinary stakes, and no exotic elements.  
  - **Conclusion**: The tricks interact to make CDT and fixed-policy agree against EDT when no letter arrives, a pairing unseen in standard cases. The XOR trick dominates, but accuracy thresholds show EDT’s evidence-sensitivity is fragile, highlighting core philosophical divides.  

