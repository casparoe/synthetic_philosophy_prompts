prompt: |-
  In a reading group on the evolution of morality I keep running into the one-liner "you can't get an ought from an is," and I've started to notice that it does very different work depending on who is wielding it. The occasion was an argument by a colleague — call him Ravi — who claimed that because fairness dispositions evolved in groups that outcompeted less cooperative ones, fairness is a genuine standard we ought to respect; a second colleague dismissed the whole thing with the slogan, and Ravi shot back that the objection is empty, since every normative view has to start from descriptive facts about what we care about. I suspect the two of them are talking past each other, but I can't articulate why, and for once I'd like a menu rather than a verdict.

  Could you lay out the distinct precise claims that slogan could be making — say, a claim about logical entailment (that no valid argument can have only descriptive premises and a normative conclusion), a claim about epistemic justification, a claim about the meaning of moral terms, a claim about the metaphysics of moral properties, and any others you think are actually in play — and for each say whether it is a trivial logical point, a substantive and defensible thesis, or simply false? Please be careful about a few distinctions I keep fumbling: whether it forbids only entailment or also weaker relations such as supervenience; whether "is" premises are supposed to include institutional facts (as in the inference from "you said you would come at noon" to "you ought to come at noon") and teleological or functional facts (as in "the heart's function is to pump"); whether it rules out instrumental oughts (as in "you want to get well, and this is the only way, so you ought to take the medicine"); and how the slogan relates to the so-called naturalistic fallacy, which I have a suspicion is a different accusation wearing the same coat. Finally, tell me which of these readings my colleague would have to be relying on for the slogan to do the work of actually killing Ravi's argument, and which readings would leave Ravi entirely untouched. Lay it out as a numbered list I can bring to the next session.
reasoning: |-
  Okay, let me try to unpack this user's query. They're in a reading group about the evolution of morality and keep hearing "you can't get an ought from an is." The user noticed that this slogan is used differently by different people. Specifically, Ravi argues that since fairness evolved because cooperative groups outcompeted others, fairness is a standard we ought to respect. Another colleague dismisses this with the slogan, and Ravi counters that all normative views start from descriptive facts. The user suspects they're talking past each other and wants a breakdown of the possible interpretations of the slogan.

  First, I need to recall Hume's original point. He was talking about how moral judgments don't logically follow from descriptive statements. But over time, this idea has been expanded, so I should cover all possible angles. The user mentioned several distinctions: logical entailment vs. weaker relations like supervenience, whether "is" includes institutional or functional facts, instrumental oughts, and the naturalistic fallacy.

  Let me start by listing the precise claims the slogan could be making. Logical entailment is the strictest: no normative conclusion from descriptive premises alone. That's a trivial logical point. Then epistemic justification: descriptive facts can't justify normative beliefs without prior normative commitments. That's substantive. Meaning of moral terms: if moral terms can't be reduced to descriptive ones, that's the open question argument. Metaphysics: moral properties aren't natural properties, which is also substantive.

  I should also consider institutional facts. For example, promising creates an obligation. But that relies on a prior norm that promises ought to be kept. Teleological functions, like the heart pumping blood, might imply an ought, but that depends on accepting a norm about fulfilling functions. Instrumental oughts are conditional and depend on the agent's desires, so they don't provide categorical obligations.

  The naturalistic fallacy is often confused with the is-ought gap. Moore was talking about defining goodness in natural terms, which is different. The user wants to know which interpretations would defeat Ravi's argument. Ravi's point is that evolution selected fairness, so we ought to value it. The slogan, if interpreted as requiring logical entailment, might not hurt Ravi since he's not claiming logic but grounding. But if the slogan means that evolution can't justify the normativity of fairness without a prior normative premise, then Ravi's argument might fail because he's deriving a moral 'ought' from a descriptive 'is'.

  I need to make sure each interpretation is clear, whether it's trivial, substantive, or false, and how it applies to Ravi. Also, address the distinctions the user mentioned. For example, supervenience allows moral properties to depend on descriptive ones without reduction, so the slogan isn't about supervenience. Institutional facts require existing norms, so they don't bridge the gap. Instrumental oughts are different from moral ones.

  Finally, for Ravi's case, the slogan would only work if it's about epistemic justification or metaphysical irreducibility. If Ravi is saying evolution gives a reason to value fairness, but without a prior commitment to valuing what evolved, it doesn't hold. However, if he's arguing that our evolved dispositions ground morality, that's a substantive metaethical position like naturalism, which the slogan alone can't refute. The user needs a numbered list to present, so organizing each point with the claim, type, and relevance to Ravi.
answer: |-
  Here's a breakdown of the distinct claims embedded in "you can't get an ought from an is," tailored for your reading group debate. I'll address your specific distinctions and clarify which readings would challenge Ravi's argument. Treat this as your numbered menu:

  1.  **Logical Entailment (The Strict Humean Gap):**
      *   **Claim:** No valid *deductive* argument can have premises consisting *only* of non-normative, descriptive ("is") statements and a genuinely normative ("ought") conclusion. The conclusion doesn't *logically follow* from the premises alone.
      *   **Type:** **Trivial Logical Point.** This is the core, minimal interpretation of Hume's observation. It forbids *entailment* only. It does *not* forbid weaker relations like supervenience (that moral properties depend *on* natural ones) or grounding.
      *   **Institutional/Functional Facts?** No. Premises like "You promised" or "The heart's function is to pump" are *not* purely descriptive in the relevant sense. "Promise" implies an existing normative institution; "function" often smuggles in a teleological norm (e.g., what something *should* do to be "good" or fulfill its purpose).
      *   **Instrumental Oughts?** Partly Rules Out. *Pure* instrumental reasoning ("You want X; Y is necessary for X; therefore, you ought to do Y") often *can* be seen as deductively valid *if* we accept a hidden normative premise like "You ought to take the necessary means to your ends." Without such a premise, it's not strictly logically entailed. The "ought" here is conditional, not categorical.
      *   **Naturalistic Fallacy?** Related but distinct. The NF (Moore) claims goodness/morality is a simple, non-natural property that *cannot be defined* in naturalistic terms. The is-ought gap (Hume) is about *inference*, not definition. You can commit the NF without violating the is-ought gap (e.g., defining "good" as "pleasant" and then inferring "pleasure ought to be pursued" *would* violate the gap). Violating the gap often *involves* committing the NF, but they aren't identical.
      *   **Impact on Ravi:** **Leaves Ravi Untouched.** Ravi isn't claiming his evolutionary story *logically entails* "we ought to respect fairness" in a deductive sense. He's making a substantive argument about grounding or justification. This reading of the slogan is true but too weak to counter his claim.

  2.  **Epistemic Justification (The Need for a Normative Bridge):**
      *   **Claim:** Descriptive facts alone cannot *rationally justify* believing a normative conclusion. To move from "is" to "ought," you *always* need at least one substantive, non-derivative normative premise (e.g., a fundamental value, principle, or commitment) that isn't itself justified solely by descriptive facts.
      *   **Type:** **Substantive and Defensible Thesis.** This is the most common and powerful philosophical interpretation of the slogan's *significance*. It argues that descriptive facts only generate normative force *in conjunction with prior normative commitments.
      *   **Institutional/Functional Facts?** Requires a Bridge. "You promised" justifies "you ought" only if we accept the prior norm "promises ought to be kept." "The heart pumps blood" justifies "the heart ought to pump blood" only with a prior norm like "organs ought to perform their evolved/biological functions" or "health is good."
      *   **Instrumental Oughts?** Compatible. The instrumental "ought" *depends* on the prior normative commitment to pursuing the end ("You ought to take the necessary means to your ends" or "Achieving your desired ends is good/reason-giving"). The justification for the instrumental "ought" flows from that prior norm *plus* the descriptive facts about means and ends.
      *   **Naturalistic Fallacy?** Overlaps significantly. Attempting to justify a fundamental norm *solely* by descriptive facts (like evolution) often looks like defining the good/normative in natural terms and then inferring it – committing both the NF and violating the epistemic is-ought gap.
      *   **Impact on Ravi:** **Potentially Kills Ravi's Argument.** This is likely the intended force of the objection. Ravi argues that evolution *directly* gives us a reason ("ought") to respect fairness. This reading says: "No, the evolutionary facts ('is') only show fairness *was* advantageous. To get to 'ought,' you need a prior norm like 'we ought to respect traits that evolved because they were advantageous' or 'evolutionary success defines what we ought to value.'" Ravi hasn't provided or justified *that* prior norm; he's trying to derive the "ought" *from* the "is" alone. His response ("all normative views start from descriptive facts") misses the point – they start *from* them, but they *require* adding a normative element to *get to* the "ought."

  3.  **Semantic Non-Reducibility (The Open Question Argument):**
      *   **Claim:** The meaning of moral/normative terms (like "ought," "good," "right") cannot be fully reduced to or defined by purely descriptive/naturalistic terms (like "evolved," "pleasurable," "socially approved"). Even if we know all the descriptive facts, it still makes sense to ask "But *ought* I to do it?" or "But *is* it *really* good?"
      *   **Type:** **Substantive and Defensible Thesis (associated with G.E. Moore).** This focuses on the *meaning* of moral language, arguing it has an irreducible normative component.
      *   **Institutional/Functional Facts?** Doesn't Directly Address. The focus is on the meaning of core normative terms, not specific inferences. Defining "ought" *in terms of* institutional facts (e.g., "ought" = "what the rules require") would be a reduction attempt potentially vulnerable to this objection.
      *   **Instrumental Oughts?** Compatible. The meaning of the instrumental "ought" can be analyzed descriptively (efficiency relative to goals), but the normative force of pursuing the *goal* relies on non-reducible normative meaning.
      *   **Naturalistic Fallacy?** **Directly Corresponds.** This *is* Moore's Naturalistic Fallacy argument: the fallacy is attempting to *define* the simple, non-natural property "good" using natural properties.
      *   **Impact on Ravi:** **Significantly Challenges Ravi.** If moral terms like "ought" or "genuine standard" have irreducible normative meaning, then Ravi's attempt to *define* or *equate* "ought to be respected" solely with "was evolutionarily advantageous" commits the Naturalistic Fallacy. It conflates distinct concepts. The evolutionary facts might *correlate* with what we ought to do, but they don't *constitute* the meaning of "ought."

  4.  **Metaphysical Irreducibility (Non-Naturalism):**
      *   **Claim:** Moral/normative properties (e.g., being morally obligatory, good) are fundamentally *different kinds* of properties from natural/descriptive properties (e.g., being evolved, causing pleasure, being desired). They are not identical to, constituted by, or reducible to complexes of natural properties.
      *   **Type:** **Substantive and Defensible Thesis (Non-Naturalist Metaethics).** This is a claim about what exists in the world.
      *   **Institutional/Functional Facts?** Doesn't Directly Address. Focuses on the nature of *moral* properties themselves. Institutional facts create *social* obligations, but their moral force might be seen as derivative or distinct.
      *   **Instrumental Oughts?** Compatible. Instrumental oughts might be seen as relations between natural properties (desires, means), while moral oughts are a distinct metaphysical category.
      *   **Naturalistic Fallacy?** Strongly Related. The NF often assumes metaphysical irreducibility (goodness is a non-natural property).
      *   **Impact on Ravi:** **Directly Contradicts Ravi.** Ravi's argument assumes moral properties like "being a genuine standard we ought to respect" *are* natural properties (specifically, evolutionarily advantageous traits). This reading denies that. The evolutionary facts are one thing (natural), the normative "ought" is something else (non-natural). Evolution tells us what *is*, not what *ought* to be valued in this fundamental sense.

  5.  **Psychological/Explanatory Gap (Humean Motivation):**
      *   **Claim:** Beliefs about descriptive facts alone cannot *motivate* action. Motivation requires a pre-existing desire, passion, or conative state. "Ought" statements are inherently motivational (or express such states), while "is" statements are not. Therefore, you can't derive motivation (and thus a practical "ought") purely from belief in descriptive facts.
      *   **Type:** **Substantive and Defensible Thesis (Humean Theory of Motivation).**
      *   **Institutional/Functional Facts?** Requires Motivation. Knowing "you promised" doesn't motivate keeping it without a prior desire to keep promises or avoid blame. Knowing the heart's function doesn't motivate preserving it without a prior desire for health/life.
      *   **Instrumental Oughts?** Compatible. The instrumental "ought" motivates *only if* you desire the end.
      *   **Naturalistic Fallacy?** Related but distinct. Focuses on motivation, not definition or inference per se.
      *   **Impact on Ravi:** **Challenges Ravi's Practical Force.** Even if Ravi convinces us fairness evolved, this reading says that knowledge alone won't *motivate* us to respect fairness unless we *already* have a desire to respect evolved traits, be cooperative, or follow evolutionary imperatives. The evolutionary "is" doesn't create the motivating "ought" by itself.

  **Which Reading "Kills" Ravi's Argument?**

  *   **#2 (Epistemic Justification)** is the most likely candidate for the *intended* force of the objection and the one that **directly challenges Ravi's core claim**. It argues that his evolutionary premises *alone* can't justify the normative conclusion without an additional, unjustified normative premise (e.g., "We ought to value what evolution selected for").
  *   **#3 (Semantic Non-Reducibility)** and **#4 (Metaphysical Irreducibility)** also provide strong challenges by attacking the conceptual or ontological link Ravi is trying to forge between evolution (is) and moral obligation (ought). They accuse him of a category error (the Naturalistic Fallacy).
  *   **#1 (Logical Entailment)** is true but too weak to harm Ravi's substantive argument. **#5 (Psychological Gap)** challenges the *practical impact* but not necessarily the *truth* of his normative conclusion.

  **Why They Talk Past Each Other:**

  *   **Ravi** likely sees morality as *naturalistically grounded* (perhaps implicitly assuming #3 & #4 are false). He thinks the evolutionary facts *do* provide reasons/justification (#2 is false for this case) because he sees value as emerging from or constituted by such natural facts. His "start from descriptive facts" confuses *starting points* (which everyone uses) with *sufficient justification*.
  *   **The Objector** likely holds a version of #2, #3, or #4. They hear Ravi trying to *derive* the normative "ought" *solely* from the descriptive "is," which they see as either logically invalid (#1 - which Ravi isn't strictly claiming), epistemically unjustified (#2), or conceptually confused (#3/#4). They dismiss it as committing the Naturalistic Fallacy.

  Bring this list. It should spark a much more precise (and hopefully productive!) metaethical discussion about the foundations of Ravi's evolutionary ethics and the nature of moral justification itself. Good luck!
