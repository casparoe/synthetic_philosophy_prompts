prompt: |-
  I'm a science and ideas journalist and I'm trying to write a long feature about how different countries handle sex work, but I keep hitting a wall that I'm pretty sure is a philosophy problem, and I'd definately rather not fudge it. Three regimes.

  Sweden — and now France, Ireland, Norway, Iceland: selling is legal, buying is a crime. She's a competent adult the state refuses to punish, but nobody may legally help her: employ her, share a premises with her, arrange a booking, and that's procurement. The state also funds exit programmes.

  Germany and the Netherlands: legal and licensed. German sex workers have to register with the authorities, and the law bans sex without a condom; Dutch municipalities license the brothels and the windows, and the whole justification was that bringing the trade above ground would make exploitation easier to police.

  New Zealand: decriminalised outright and folded into ordinary law, so the job comes with health and safety duties and access to social security like any other. Yet the same Act keeps the advertising ban (classifieds only), refuses visas to anyone who plans to work in the industry, and its own statement of purpose says that decriminalising is not the same as morally endorsing it.

  What I want is the implicit philosophy of each — what theory of consent, harm, exploitation, commodification and the proper reach of the criminal law each one only makes sense under. What theory of consent does Sweden need? If the seller can consent, who exactly is the victim of the crime the buyer commits, and how can there be an offence that the supposed victim can't waive — or does punishing the buyer presuppose something else instead, legal moralism, or a harm that belongs to women in general rather than to her? Does the German registration-and-condoms regime presuppose that this is work, or that it's a public health hazard wearing the costume of work? Is New Zealand's not-endorsing clause a coherent position about law and morality, or just a way of decriminalising while keeping the stigma? And is the immigration bar in that same Act evidence of an unstated limit to the labour model — citizens only?

  Then the bit I actually need for the piece: for each regime, seperate the commitments the practice strictly requires from the ones it's merely compatible with. My suspicion is that alot of people defend these laws with theories the laws don't need — you could run the Nordic law on several different moral stories, and the same goes for legalisation. So where is each practice underdetermined? And finally, what would have to change on the ground if you swapped the theory out? If you really took New Zealand's labour model seriously, what would Sweden have to give up? And what would a genuine work-based model have to say about the fact that we don't register and license the customers of every other exploited worker — nobody has to sign a form with the state to buy a cheap t-shirt made in a firetrap factory.

  No reading list, I just need the argument. And be straight with me about where these laws might not be consistent with themselves at all.
reasoning: |-
  Okay, let's tackle this query step by step. The user is a science and ideas journalist working on a feature about different countries' approaches to sex work regulation, and they're hitting a philosophical wall. They've outlined three regimes: Nordic (criminalizing buyers), German/Dutch (legalization with regulation), and New Zealand (decriminalization). Their core ask is to unpack the implicit philosophical foundations of each model, identify what commitments each strictly requires versus what's merely compatible, and pinpoint where these laws might be internally inconsistent.

  First, I need to map each model to its underlying philosophical framework. For the Nordic model, the key question is about consent and harm. If selling is legal, that implies the seller can consent to the act itself. But criminalizing buyers suggests the harm isn't to the individual seller but to a broader class (women) or society's moral fabric. This points to legal moralism or a collective harm theory. The fact that exit programs exist alongside criminalization adds complexity - it implies the state views the work as inherently harmful yet treats sellers as victims rather than criminals.

  For the German/Dutch model, the tension is between treating sex work as labor versus a public health hazard. Mandatory registration and condom laws could reflect either occupational safety concerns (labor framework) or disease containment priorities (public health model). The licensing of brothels suggests a desire for state control that goes beyond typical labor regulation. This model seems philosophically unstable - it borrows from both frameworks without fully committing to either.

  The New Zealand model presents different contradictions. Full decriminalization under labor law suggests normalization, but the advertising restrictions, immigration bans, and "no endorsement" clause maintain stigma. This looks like cognitive dissonance: the law formally recognizes sex work as work while actively preventing its normalization through adjacent policies. The immigration bar particularly undermines the labor model by implying citizenship boundaries to rights.

  Next, I should separate each model's core requirements from compatible additions. The Nordic model strictly requires buyer criminalization and non-punishment of sellers, but exit programs are compatible additions, not necessities. For Germany/Netherlands, licensing is core while specific rules like condom mandates are adjustable within the regulatory framework. New Zealand's labor integration is essential, while advertising limits and immigration bars are politically compatible add-ons that contradict the core principle.

  On inconsistencies: Sweden's inability to prosecute buyers without undermining sellers' agency is a glaring tension. Germany's registration treats workers as hazards while claiming to protect them. New Zealand's immigration ban blatantly contradicts labor rights principles. These aren't minor flaws but fundamental fractures in each philosophy.

  Finally, to test model boundaries: If Sweden adopted NZ's labor theory, they'd have to drop buyer criminalization and allow brothels/collectives. If Germany fully embraced labor rights, they'd scrap registration and treat violations through standard labor channels. And if NZ committed to their model, they'd need to lift advertising/immigration restrictions and extend protections to migrant workers.

  The user's suspicion about defenders over-attributing philosophies seems correct - each model is theoretically underdetermined. The real story might be that these are political compromises dressed as philosophical positions, with the inconsistencies revealing unspoken societal anxieties about sex work.
answer: |-
  You've nailed the core philosophical tensions at the heart of each regulatory model. Let's dissect their implicit theories, separate core commitments from compatible additions, expose inconsistencies, and explore the implications of swapping theories.

  **1. The Nordic Model (Sweden, France, etc.): Criminalizing Purchase**
  *   **Implicit Philosophy:**
      *   **Theory of Consent & Harm:** This model fundamentally **rejects the possibility of genuine consent to sexual acts within a commercial transaction under conditions of patriarchy and structural inequality.** Consent is seen as inherently compromised or impossible when money exchanges hands for sex. The primary **victim** is not necessarily *this specific sex worker* in *this specific transaction* (though she might be harmed), but **women as a class** or **society's values**.
      *   **Theory of Exploitation:** Sex work is viewed as *inherently exploitative and degrading*, regardless of individual circumstances. The buyer exploits the seller's vulnerability (economic, social, gendered). The act itself commodifies intimacy and bodies in a uniquely harmful way.
      *   **Role of Criminal Law:** Embraces **legal moralism** (the law *should* enforce core societal morals about the dignity of persons and non-commodification of sex) and **harm principle focused on collective/social harm**. The harm is the perpetuation of gender inequality, violence against women, and the degradation of human relationships. Punishing the buyer is a statement against this social harm. The worker is framed as a victim needing state support (exit programs) rather than punishment.
      *   **Victim Waiver Problem:** This is the core inconsistency. *If* the seller is a competent adult acting freely in *that specific transaction*, why can't she "waive" the buyer's offense? The model answers: 1) Her consent is invalidated by the context of prostitution; 2) The harm isn't solely *to her*, but to society/women collectively; 3) The law protects her *from herself* in a context deemed inherently harmful. This requires rejecting the premise of truly free consent in prostitution.

  *   **Core Commitments vs. Compatible Additions:**
      *   **Strictly Requires:** Criminalization of the *purchase* of sex. Non-criminalization of the *sale* of sex. (This asymmetry is the defining feature).
      *   **Compatible With (Not Strictly Required):**
          *   Exit programs (logically consistent, but the model *could* exist without state funding for them).
          *   Criminalization of procurement/brothel-keeping (strongly aligned, but *theoretically* one could imagine banning only buyers while allowing cooperative work arrangements – though proponents argue this facilitates exploitation). **This is the key underdetermined area:** The jump from "buying is bad" to "any third party involvement is bad" relies on the *inherent exploitation* theory. A purely *market reduction* theory (only targeting demand) *could* be compatible with allowing some third-party support, but the Nordic model rejects this.
          *   The specific framing of sex workers as victims needing rescue (compatible, but the core legal asymmetry *could* be defended on purely social harm/legal moralist grounds without the victim narrative).

  *   **Internal Inconsistencies:**
      *   **The Waiver Problem:** As above – the competent adult seller cannot legitimize the buyer's act.
      *   **"Helping the Victim" vs. Criminalizing Her Support:** Criminalizing third parties (drivers, security, shared premises) directly impedes the safety and autonomy of the very person the law claims to protect as a victim. It forces isolation and increases vulnerability to violence and exploitation by *unregulated* bad actors.
      *   **Exit vs. Empowerment:** Funding exit programs while criminalizing any form of organized work or collective action implicitly defines the *only* acceptable outcome as leaving the industry, not improving conditions within it.

  *   **What Would Change Under a Different Theory?**
      *   **If you adopted New Zealand's Labour Theory:** Sweden would have to **abolish the buyer crime** and **legalize third-party involvement** (brothels, managers, cooperative premises) under standard labor/occupational safety law. Exit programs could remain, but the state's stance would shift from "this must not exist" to "this work must be safe and free from coercion." The inherent harm/commodification argument would be abandoned.
      *   **If you adopted a Strict Market Reduction Theory (only target buyers):** Sweden might **decriminalize third-party involvement** not demonstrably linked to coercion/trafficking, focusing *only* on reducing demand. This would partially address the inconsistency of criminalizing support for "victims".

  **2. The Legalization/Regulation Model (Germany, Netherlands):**
  *   **Implicit Philosophy:**
      *   **Theory of Consent & Harm:** Implicitly accepts that **consent *can* exist** in commercial sex transactions (otherwise legalization makes no sense). The primary harms are seen as **exploitation (trafficking, coercion, underage work), public health risks (STIs), and public nuisance.** The model aims to *manage* these specific, tangible harms through state control.
      *   **Theory of Exploitation:** Recognizes the *potential* for severe exploitation but believes state regulation (licensing, registration, health checks) is the best tool to *prevent* it and separate "voluntary" from "forced" prostitution. Exploitation is seen as an *aberrant* outcome within the trade, not inherent.
      *   **Role of Criminal Law:** Primarily **utilitarian/pragmatic**. The law's role is to control disorder, disease, and crime. It reflects a **"controlled normalization" or "public health/order management"** approach rather than full moral endorsement or condemnation. Regulation is a tool for harm *reduction* and *containment*.
      *   **Is it Work or a Hazard?** This is the core ambiguity. Mandatory registration and health checks treat sex workers more like **potential disease vectors or public order risks requiring state surveillance** than like other workers. Licensing brothels treats the *business* like other regulated businesses (bars, casinos), but the *worker-specific* requirements (mandatory health checks, registration) go beyond standard occupational health and safety, leaning heavily into the public health hazard model. It’s work wearing a biohazard suit.

  *   **Core Commitments vs. Compatible Additions:**
      *   **Strictly Requires:** A **state licensing/registration framework** for sex workers and/or businesses. Explicit legalization of selling *and* buying *and* third-party involvement *within the regulated framework*. (The regulated structure is essential).
      *   **Compatible With (Not Strictly Required):**
          *   Mandatory health checks/condom laws (Strongly associated, but a regulatory regime *could* focus solely on business licensing and labor standards without these).
          *   Specific zoning restrictions (Common, but theoretically variable).
          *   The *degree* of bureaucracy (Germany's heavy registration vs. Netherlands' window licensing).
          *   Exit programs (Can be added, but not core to the regulatory logic).
      *   **Underdetermined:** The model *doesn't* inherently require viewing sex work as morally equivalent to other work. It fits comfortably with a "necessary evil, manage the harms" perspective. The *intensity* of regulation (especially invasive health/registration rules) reveals lingering unease.

  *   **Internal Inconsistencies:**
      *   **Regulation Facilitating Exploitation?** Licensing can create a two-tier system: a "clean" regulated sector and a larger, harder-to-police underground sector where exploitation may be worse. Registration can deter workers (especially vulnerable/migrant ones) from accessing the legal system, *increasing* their vulnerability.
      *   **Surveillance vs. Rights:** Mandatory registration and health checks infringe on bodily autonomy and privacy in ways not applied to other professions, undermining the "it's just work" claim. Workers are treated as hazards.
      *   **Labour Rights Gap:** While legal, the regulatory focus is often on health/order, not robustly enforcing standard labor rights (contracts, minimum wage, unionization, protection from unfair dismissal). The "work" aspect is often superficial.

  *   **What Would Change Under a Different Theory?**
      *   **If you adopted New Zealand's Labour Theory:** Germany/Netherlands would need to **scrap mandatory registration and health checks** for workers. Regulation would shift focus entirely to **occupational health and safety standards** (safe premises, security protocols, access to healthcare *without* compulsion) and enforcing **standard labor laws** (contracts, benefits, grievance procedures). Brothels would be licensed like any other workplace, not as inherently suspect entities. The public health hazard lens would be discarded.
      *   **If you adopted the Nordic Model:** Would require **criminalizing buyers** and **outlawing third parties/brothels**, dismantling the entire regulatory/licensing structure. Exit programs would become the primary state intervention.

  **3. The Decriminalization/Labour Model (New Zealand):**
  *   **Implicit Philosophy:**
      *   **Theory of Consent & Harm:** Explicitly accepts that **consensual adults can engage in commercial sex**. The primary harms are **exploitation (coercion, trafficking), unsafe working conditions, violence, stigma, and lack of labor rights** – harms exacerbated by criminalization. Consent is central and possible.
      *   **Theory of Exploitation:** Exploitation arises from **illegality, stigma, lack of rights, and bad actors**, not from the *nature* of the transaction itself. Empowerment through rights and safety is the antidote.
      *   **Role of Criminal Law:** **Harm principle focused on individual rights and safety.** The criminal law should only address force, coercion, fraud, underage involvement, and public nuisance – the same standards applied to other activities/sectors. The state should be **neutral** on the morality of voluntary adult sex work.
      *   **"Not Endorsing" Clause:** This is **political pragmatism, not philosophical coherence.** Legally, decriminalization *is* state neutrality. The clause is a fig leaf to appease moral opposition, acknowledging the persistence of social stigma the law cannot (and arguably *should* not try to) erase. It highlights the gap between legal status and social acceptance.
      *   **Immigration Bar:** This **directly contradicts the labour model philosophy.** If sex work is work, migrant workers should have the same rights as citizens to perform legal work. This exposes the **unstated limit: citizenship/nationalism.** It reflects societal/political unwillingness to fully normalize sex work, especially concerning migration.

  *   **Core Commitments vs. Compatible Additions:**
      *   **Strictly Requires:** **Removal of all criminal penalties for consensual adult sex work (selling, buying, third-party facilitation like brothel operation/management). Integration of sex work into standard employment law, health and safety regulations, and contract law.**
      *   **Compatible With (Not Strictly Required):**
          *   Specific occupational health and safety guidelines tailored to the industry (logical extension of labour model).
          *   Anti-trafficking/coercion laws (strengthened by decriminalization, as workers can report without fear).
          *   *The "Not Endorsing" Clause* (Purely political, not required by the model's logic).
          *   *Restrictions on advertising* (A significant compromise; a pure labour model suggests advertising should be regulated like other businesses, not uniquely restricted).
          *   *Immigration bar* (A profound contradiction, not compatible with the core philosophy).
      *   **Underdetermined:** The model itself doesn't dictate *how* labour rights are best enforced (unions, specific agencies, etc.), or the precise nature of tailored OHS rules. It's about the *framework*, not the minutiae.

  *   **Internal Inconsistencies:**
      *   **The Advertising Ban:** If it's legitimate work, why uniquely restrict its advertising? This perpetuates stigma and hinders safe business practices, contradicting the safety and rights goals.
      *   **The Immigration Bar:** The most glaring inconsistency. It explicitly denies the "work is work" premise for non-citizens, revealing a nationalistic and moralistic boundary. It actively creates a vulnerable, undocumented workforce.
      *   **"Not Endorsing" vs. Legal Neutrality:** While legally coherent (the state doesn't endorse many legal activities), the explicit statement feels like a nervous disclaimer, undermining the principled stance of neutrality.

  *   **What Would Change Under a Different Theory?**
      *   **If you adopted the Nordic Model:** NZ would have to **criminalize buyers** and **outlaw brothels/third parties**, dismantling the labour rights framework. Exit programs would become central.
      *   **If you adopted the German Regulatory Model:** NZ would need to introduce **mandatory licensing/registration for workers and/or businesses** and likely impose **mandatory health protocols**, moving away from rights-based normalization toward controlled containment.
      *   **If NZ Fully Embraced Its *Own* Labour Theory:** It would need to **abolish the advertising ban** and **remove the immigration bar** for sex workers. Sex work would be treated *exactly* like other forms of work concerning promotion and migrant labor rights. The "not endorsing" clause would likely be dropped as redundant to state neutrality.

  **Addressing Your Final Point (The T-Shirt Analogy):**

  You've hit the nerve. A *genuine*, consistent labour model for sex work, applied rigorously, would indeed treat it like other forms of work with risks of exploitation:

  1.  **Focus on the Workplace & Employer:** Regulations would target brothel owners/managers (like factory owners) to ensure safe conditions, fair contracts, and freedom from coercion – not license the *workers* themselves. Violations would be dealt with via labor inspectors, occupational safety laws, and contract law, not criminal law targeting the worker or a unique registration scheme.
  2.  **No Customer Licensing/Registration:** Just as we don't register customers of nail salons, garment factories, or restaurants (even if exploitation occurs there), we wouldn't register sex work clients. The responsibility for fair and safe labor practices lies with the *employer* and the state enforcing labor standards, not the individual consumer. Criminal law only intervenes if the *client* commits a specific crime (assault, rape, coercion) – just as a customer assaulting a retail worker would be prosecuted.
  3.  **Addressing Exploitation at Source:** Exploitation in garment factories is fought through international labor standards, supply chain transparency laws, unionization, and consumer pressure – not by criminalizing the shopper. Similarly, a labour model for sex work focuses on empowering workers (unions, access to justice), enforcing employer responsibilities, and combating trafficking/coercion through targeted laws and support services – not by criminalizing the client or uniquely regulating the worker.

  The fact that Germany registers workers or Sweden criminalizes clients, while we don't apply these to other exploited labour sectors, exposes the unique moral anxiety and stigma still attached to sex work, even within supposedly pragmatic or liberal models. New Zealand comes closest to consistency but stumbles on advertising and, crucially, immigration. A truly consistent labour model would look radically "normalizing" to many – treating the buying and selling of sexual services under safe, consensual, and non-coercive conditions as a matter of labor law and contract, devoid of unique criminal provisions or registration schemes. The philosophical hurdle isn't in the model itself, but in society's willingness to accept that normalization.
