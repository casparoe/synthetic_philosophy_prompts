prompt: |-
  I'm in the middle of a graduate seminar on conditionals and have been reading around in the popular literature to get my bearings, and I've hit a summary I can't quite assess. It comes from a chapter in an introduction to logic written for a general audience by someone with a philosophy PhD, and it runs roughly as follows: "Lewis's triviality results are the reason so many philosophers have given up on the idea that indicative conditionals are ordinary propositions. What Lewis showed is that if you accept the apparently obvious claim that the probability of 'If A, then B' is just the conditional probability of B given A, then you are forced to conclude that 'If A, then B' means the same thing as 'not-A or B,' the material conditional. But everyone agrees that is wrong, since the material conditional is true whenever its antecedent is false, which is not how conditionals work; so the probability claim has to go. Lewis therefore showed that the Adams-style suppositional theory, on which a conditional's probability simply is the conditional probability, is untenable, and that conditionals must be truth-evaluable after all, just not in the way the material conditional is. The result extends to counterfactuals as well, and the moral is that any purely probabilistic account of conditionals is a dead end."

  I'm inclined to think the suppositional view is basically right, so this summary makes me worry I've backed the wrong horse — but something feels off about it, especially the way it moves from "the probability claim has to go" straight to "so the suppositional theory is refuted." Could you audit the summary claim by claim? I'd like to know which parts a careful philosopher of language would simply accept, which are the kind of harmless simplification a popularizer is entitled to, and which are actually wrong — and in particular what work the assumption about conditionalizing the probability function is doing in the result, since the summary never mentions it. I'd also like to know whether the closing moral follows from anything true in the summary, and what Lewis himself is usually taken to have concluded, as opposed to what the summary says he concluded. No bibliography needed; I just want to understand the result well enough to know what to trust here.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a graduate seminar on conditionals and came across a summary in a popular logic book that claims Lewis's triviality results refute the suppositional view of conditionals. The user feels something's off about the summary, especially the leap from rejecting the probability claim to dismissing Adams's theory. They want a claim-by-claim audit to distinguish accurate parts, simplifications, and errors.

  First, I need to recall Lewis's triviality results. Lewis showed that if the probability of a conditional equals conditional probability, and if conditionals have truth values, then conditional probability must reduce to the probability of the material conditional. But this leads to absurdity under minor updates, implying that such conditionals can't exist without trivializing the probability space. Key point: Lewis assumes truth-conditional semantics from the start. 

  The summary claims that Lewis forces us to equate "if A, then B" with "not-A or B". But Lewis's actual conclusion is that conditionals can't be propositions at all under the given assumptions. The user’s summary misses that Lewis's result is a reductio against truth-valuability, not a defense of it. 

  Next, the summary says the suppositional theory is untenable. But Adams never claimed conditionals have truth values; he proposed they have acceptability conditions instead. So Lewis's result doesn't apply to Adams's view directly. The user is right to sense a non sequitur here—rejecting the probability claim isn't necessary for suppositionalists since they deny truth values.

  The user also asks about the role of conditionalization. Lewis assumes that the probability function can be conditioned on any consistent antecedent. This richness of probability spaces is crucial because the triviality arises when updating on A or not-A. If the space isn't this rich, the result doesn't hold, but such richness is standard in probability logic.

  For the moral drawn, the summary asserts that probabilistic accounts are dead ends. But many philosophers still support the suppositional view, using non-propositional approaches. Dynamic semantics like Kratzer's or probabilistic models like Kaufmann's offer alternatives. So the moral overgeneralizes.

  The user mentions counterfactuals. Lewis himself treated them with possible worlds semantics, not probabilistic accounts, so extending the moral to counterfactuals might be misleading. Though probabilistic approaches to counterfactuals exist, they aren't Adams-style.

  Lewis's actual conclusion was that indicative conditionals lack truth values, which aligns more with Adams than the summary suggests. The user is backing the suppositional view, which remains viable if conditionals aren't truth-apt.

  I should note where the summary is right: Lewis's results did push philosophers away from truth-conditional views of indicatives, and the material conditional is problematic. But the errors are in misrepresenting Lewis's conclusion and wrongly dismissing suppositionalism.

  The user needs clarity on these points to trust their seminar readings. They’re likely worried their understanding is flawed, but their intuition about the summary's leap is correct. Highlighting the role of conditionalization and Adams's non-truth-conditional stance should reassure them.
answer: |-
  Your instincts are spot on—this summary contains significant missteps, particularly in its assessment of the suppositional view. Let's audit it claim by claim:

  ### Key Claims in the Summary & Their Assessment
  1.  **"Lewis's triviality results show that if P(if A, then B) = P(B|A), then 'if A, then B' must mean the same as 'not-A or B' (the material conditional)."**
      *   **Assessment: Misleading Oversimplification.** Lewis's core result is a *reductio ad absurdum*. He assumes conditionals *are* propositions with truth values *and* that their probability is conditional probability (P(A→B) = P(B|A)). He then shows this leads to absurdity (e.g., P(B|A) = P(B) for *all* A, B in the language, trivializing the probability space). The conclusion isn't "therefore it's the material conditional"; it's "therefore, **one of the starting assumptions must be false**." The material conditional *would* be a consequence *if* the conditional had a truth value *and* obeyed P(A→B) = P(B|A), but the result shows this combination is impossible without triviality. Lewis's result *undermines* identifying the indicative conditional with the material conditional under the probability constraint.

  2.  **"But everyone agrees [the material conditional analysis] is wrong... so the probability claim [P(if A, then B) = P(B|A)] has to go."**
      *   **Assessment: Non Sequitur / False Dilemma.** This ignores the *other* key assumption Lewis made: that the conditional *has a truth value* (is a proposition). The suppositional theorist (like Adams) rejects *this* assumption. They argue conditionals aren't truth-apt propositions; they have *acceptability conditions* (P(B|A)) rather than *truth conditions*. For them, P(if A, then B) = P(B|A) is a *definition* of acceptability, not a contingent fact about propositional probabilities. Lewis's result doesn't force *them* to abandon P(if A, then B) = P(B|A); it forces them (or anyone) to abandon the *combination* of truth-valuability *and* P(if A, then B) = P(B|A). The summary wrongly presents abandoning the probability claim as the *only* option.

  3.  **"Lewis therefore showed that the Adams-style suppositional theory... is untenable."**
      *   **Assessment: Actively Wrong.** This is the core error. Lewis's result **assumed** truth-conditional semantics from the outset. Adams explicitly **denies** that indicative conditionals have truth conditions/truth values. Lewis's result *depends* on the conditional being truth-apt; it simply doesn't apply to a theory that denies this. Adams embraces P(if A, then B) = P(B|A) precisely *because* he rejects the idea that conditionals are truth-bearing propositions susceptible to Lewis's argument. The result is a challenge *for truth-conditional accounts*, not a refutation of non-truth-conditional accounts like Adams's. Adams saw Lewis's result as *supporting* his view: it shows you *can't* have a truth-conditional account that satisfies P(if A, then B) = P(B|A).

  4.  **"Conditionals must be truth-evaluable after all, just not in the way the material conditional is."**
      *   **Assessment: Contradicts Lewis & Oversimplifies.** Lewis's *own* conclusion from the result was typically that indicative conditionals **do not have truth values** (or at least, not ones that behave like ordinary propositions within a probability space). The result pushes *against* truth-conditional semantics for indicatives. While it *is* true that many post-Lewis theories propose *non-material* truth conditions (e.g., possible worlds semantics for *counterfactuals*, or dynamic semantics), Lewis's result itself does *not* force this conclusion. It leaves open non-truth-conditional accounts *or* truth-conditional accounts that abandon P(if A, then B) = P(B|A) (e.g., Jackson's "robustness" theory).

  5.  **"The result extends to counterfactuals as well."**
      *   **Assessment: Misleading.** Lewis *did* prove similar triviality results for *counterfactual* conditionals, *assuming* they are propositions and P(A □→ B) = P(B|A) (or a similar counterfactual probability). However, the *interpretation* is very different. Almost no one defends P(A □→ B) = P(B|A) for counterfactuals (where A is typically false). Lewis's own *semantics* for counterfactuals *is* truth-conditional and *doesn't* satisfy P(A □→ B) = P(B|A). The triviality result for counterfactuals is seen as showing they aren't *simply* conditional probabilities, not as a refutation of suppositionalism for counterfactuals (which wasn't widely held in that form).

  6.  **"The moral is that any purely probabilistic account of conditionals is a dead end."**
      *   **Assessment: Overgeneralization & False.** This moral does *not* follow. Adams's suppositional theory *is* a purely probabilistic account (for indicatives) and remains highly influential and viable precisely *because* it avoids Lewis's result by being non-truth-conditional. It defines the meaning/acceptability of conditionals in terms of conditional probability and update rules (e.g., for the Ramsey Test). Lewis's result shows that a purely probabilistic account *that also insists on truth-conditions* is impossible. But a purely probabilistic account *without* truth-conditions escapes the result entirely. Many sophisticated probabilistic accounts (e.g., involving imaging for counterfactuals, or dynamic semantics incorporating probability) are actively developed.

  ### The Crucial Role of Conditionalization
  The summary completely omits the technical heart of Lewis's proof, which relies critically on **probabilistic conditionalization on the antecedent and its negation**. Lewis assumes that the probability function P is defined over a rich enough language that we can always form the conditionalized probability functions P(*|A) and P(*|¬A). He then shows that if the conditional A→B is a proposition and P(A→B) = P(B|A) holds for the initial probability function P, then it *must also hold* for the conditionalized functions P(*|A) and P(*|¬A). Iterating this process leads to the absurd triviality where P(B|A) = P(B) for all A, B. The assumption that the probability space is closed under such conditionalizations (i.e., that learning A or ¬A is always possible and represented by conditionalization) is essential for generating the contradiction. This richness is standard in probability theory but highlights that the result applies to models where agents can always revise their beliefs in this specific way.

  ### Lewis's Actual Conclusion vs. the Summary's Claim
  *   **Lewis's Conclusion (Typically Understood):** The combination of (1) indicative conditionals having truth values and (2) the probability of a conditional being equal to the corresponding conditional probability leads to triviality. Therefore, **one must give up one of these assumptions**. Lewis himself leaned towards giving up (1) – concluding that indicative conditionals lack truth values. He saw his result as *compatible* with a suppositional/Ramsey Test view (though he didn't fully endorse Adams's implementation). For counterfactuals, he proposed a truth-conditional possible worlds semantics.
  *   **Summary's Claim:** Lewis showed we *must* give up the probability claim (P(if A, then B) = P(B|A)) and *must* embrace that conditionals have truth values (just not material ones). This gets Lewis almost exactly backwards regarding indicatives.

  ### What a Careful Philosopher Would Accept vs. Reject
  *   **Accept:**
      *   Lewis's triviality results were pivotal, showing a deep conflict between truth-conditional semantics and the probabilistic equality P(if A, then B) = P(B|A).
      *   The material conditional is inadequate for natural language conditionals.
      *   Lewis's results apply to both indicative and counterfactual conditionals (under the stated assumptions).
      *   Lewis's result forced a major reevaluation of truth-conditional approaches to indicative conditionals.
  *   **Harmless Simplification:**
      *   Stating the result as showing a conflict between P(if A, then B) = P(B|A) and truth-conditional semantics (without detailing the conditionalization step).
      *   Saying the result "extends to counterfactuals" (though the context and implications differ).
  *   **Actively Wrong/Misleading:**
      *   That Lewis showed the conditional *must be* the material conditional under the probability equality.
      *   That Lewis refuted the Adams/suppositional theory.
      *   That the result forces us to abandon P(if A, then B) = P(B|A) *simpliciter*.
      *   That the result forces us to embrace truth-conditional semantics.
      *   That the result shows "any purely probabilistic account is a dead end."
      *   That Lewis concluded conditionals must be truth-evaluable.

  **Conclusion:** Your inclination that the suppositional view isn't refuted is correct. The summary fundamentally misrepresents the target and implication of Lewis's result. Lewis showed the *incompatibility* of truth-valuability and the probability equality. Adams embraces the equality *by rejecting truth-valuability*, thereby avoiding the result. The suppositional theory remains a major, viable approach to indicative conditionals. Lewis's result is a powerful argument *against* truth-conditional accounts of indicatives that try to preserve the probability equality, not against non-truth-conditional probabilistic accounts. You haven't backed the wrong horse; the summary misjudged the race.
