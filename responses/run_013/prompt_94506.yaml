prompt: |-
  I am in a small reading group that has spent the term on Buddhist ethics, and we keep circling a disagreement I have not been able to settle. Several of the others insist that once you look past the soteriological vocabulary, Buddhist ethics is simply consequentialism with an unusual currency and a very long time horizon: the currency is karmic welfare across lives, the horizon is effectively unbounded because the causal series of actions and their results has no first term, and the precepts are just rules of thumb that the tradition itself lets you set aside when the consequences warrant it. I have taken the other side — that this reading is a mistake — and I would like to practice defending it against someone competent rather than against the friendly caricature my friends have been offering me.

  Please play that opponent: a philosopher who holds, deliberately and with conviction, that Buddhist ethics is a form of consequentialism. Make the character genuinely strong. He should know the tradition well enough to concede the small points — that the texts speak constantly of intention, that the precepts are stated as rules — while insisting that these belong to the mechanism rather than to the criterion: on his view the tradition evaluates actions by their results, and intention matters only because intention is the causal lever that determines which results ripen for the agent. He should be willing to lose a skirmish and never the war, should argue from the ideas rather than from authority, and should not hand me reading lists, citations, or the names of scholars — I want the argument, not the bibliography. Stay in character until I say stop, and keep each reply to a paragraph or two so that it feels like a conversation rather than a lecture.

  My opening move is this. If the criterion really is the totality of an action's consequences, then the Buddhist picture of the causal order makes that criterion unusable, because the series of actions and their results is beginningless and endless and the ripples of any deed spread without bound. Totals over an infinite future need not converge; and even where they do, they can be reshuffled, so that for all we can tell the entire downstream consequence-set of a generous act might be permuted with that of a cruel one and yield the same sum, leaving no action ever determinately better than any other. The tradition seems half aware of this, since it lists the precise working-out of the results of karma among the handful of topics it calls unthinkable — not to be calculated at all, on pain of nothing but vexation. But a criterion that cannot be applied cannot be the criterion; and what remains, I claim, is the quality of the intention itself, which the tradition identifies with karma in the first place. So tell me: what work is the word consequences actually doing in your reading, and if the answer is the consequences for the agent's own mindstream, why is that anything more than a perfectionism about character wearing a consequentialist's coat?
reasoning: |-
  Okay, the user is part of a reading group on Buddhist ethics and is stuck in a debate about whether Buddhist ethics is essentially consequentialist. They want me to roleplay as a strong opponent who defends the consequentialist interpretation. The user's opening argument is that infinite karmic consequences make consequentialism unworkable in Buddhism, so intention must be the real criterion.

  First, I need to address their main points effectively. They argue that calculating infinite consequences is impossible, leading to indeterminacy. Also, since the tradition deems karma's precise workings unthinkable, a consequentialist criterion can't be applied. Therefore, intention is primary. I have to counter this while staying in character as a well-informed philosopher.

  The opponent should concede that intention is crucial but frame it as part of the causal mechanism. Emphasize that karma is teleological—actions aim at liberation. The infinite time horizon isn't a flaw; it's integral to the soteriological goal. The unthinkability of karma's details doesn't negate consequences as the criterion; instead, it shifts focus to general patterns (like wholesome vs. unwholesome roots) that reliably lead to outcomes. 

  The user might be looking for a deeper understanding of how Buddhist ethics operates beyond surface comparisons to Western theories. They probably want to defend the non-consequentialist view but need rigorous counterarguments to test their position. Underlying this, they might seek validation that Buddhist ethics has unique elements not reducible to consequentialism, or they might want to strengthen their argumentative skills for the group.

  I should avoid scholarly citations and focus on logical arguments. Highlight how the tradition uses consequences pragmatically through heuristics like the roots of karma, which simplify decision-making without full calculation. Stress that the impossibility of total calculation doesn't invalidate consequences as the criterion; it just makes the assessment heuristic-based. Also, link karmic welfare to the ultimate goal of ending suffering, which is inherently consequentialist. 

  The opponent's strategy is to acknowledge the user's points but reframe them. For example, admit that intention is key but only because it's the causal lever for outcomes. The unthinkability of karma's specifics is a practical limitation, not a theoretical one. Conclude by reinforcing that the entire framework is oriented toward the consequence of liberation, making it teleological and thus consequentialist at its core.
answer: |-
  *(Leans forward, eyes sharp but not unkind)* Your objection is clever—I'll grant that. But it misapplies mathematical infinity to a teleological system. Yes, the karmic chain is beginningless and its ripples immeasurable. *Consequence* here isn’t a Benthamite calculus demanding summation. It’s directional causality aimed at a singular, overriding telos: the cessation of *dukkha*. The tradition doesn’t ask us to sum an infinite series; it identifies *patterns* of cause and effect that perpetuate or undermine suffering across lifetimes. Wholesome actions (*kusala*) reliably *tend* toward liberation; unwholesome ones (*akusala*) entangle. Intention *is* karma—agreed—but precisely because intention seeds those reliable causal patterns. The "unthinkability" of precise karmic fruition warns against *calculation*, not consequence itself. We navigate by the *known tendencies*: greed breeds attachment, hatred breeds conflict, generosity weakens self-grasping. The "currency" isn't welfare points—it's the momentum toward or away from awakening. Consequentialism? Absolutely. But the "utility" is soteriological velocity. Your turn.

  *(Holds up a hand, anticipating)* Wait—before you pounce on "tendencies." You’ll say tendencies imply uncertainty, undercutting consequence as the *criterion*. But consequentialism isn’t atomistic. Rule-consequentialism acknowledges reliable heuristics! The precepts *are* rules of thumb—*because* violating them *tends* to produce net suffering across the continuum. When the tradition permits exceptions (e.g., lying to save a life), it’s not abandoning consequences; it’s recognizing a higher-order consequence: preventing grievous harm outweighs the karmic risk of false speech. The Buddha didn’t say "Never kill"; he said killing has dire karmic *results*. The evaluation remains anchored in outcome—specifically, the outcome for sentient beings’ freedom from suffering. Intention matters causally, not deontologically. If a compassionate act accidentally causes harm (think: pushing someone from a falling tree, but they break a leg), the core karmic weight hinges on the *intended outcome*, because that shapes the mind’s future capacity for harm or good. Still consequentialist—just mindstream-focused. Your move.
