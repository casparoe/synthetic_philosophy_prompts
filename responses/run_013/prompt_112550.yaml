answer: |-
  ## Exam Question: Historical Interpretation Seminar

  **Question (25 marks):**  
  A historian writing on medieval criminal justice concludes: "The judicial torture routinely practiced in 13th-century Europe was a morally abhorrent violation of human dignity, fundamentally incompatible with any legitimate conception of justice." A reviewer sharply criticizes this judgment as "presentist," arguing the historian imposes modern ethical standards on a period with radically different values and institutions. The historian responds: "All historical interpretation is inevitably shaped by the historian's present context; there is no neutral vantage point outside time from which to write history."

  Analyze and adjudicate this dispute. In doing so, you must:
  1.  Identify the *specific* aspects of historical interpretation implicated in the historian's judgment and the reviewer's charge.
  2.  Explain why the historian's defense ("all history is written from the present") is both partially correct and insufficient as a response to the *specific* charge of presentism made by the reviewer.
  3.  Articulate what constitutes a defensible position on evaluating past conduct like judicial torture, explicitly acknowledging the trade-offs and limitations inherent in that position.

  Your argument should demonstrate a clear understanding of the distinct challenges involved in escaping the standards of one's own time across different dimensions of historical practice. Avoid relying on specific names of historians, theories, or texts; build your case through conceptual reasoning alone.

  ---

  ## Model Answer (Approx. 700 words)

  The dispute between the historian and the reviewer centers on the legitimacy of applying modern moral evaluations to past practices, specifically the historian’s condemnation of medieval judicial torture as "morally abhorrent." The reviewer charges presentism, correctly identifying a core tension in historical evaluation. The historian’s defense invokes the unavoidable situatedness of all historical inquiry. While this defense captures an essential truth about historical practice, it is a blunt instrument that fails to address the *specific* nature of the reviewer’s charge and obscures crucial distinctions within the project of "escaping one’s own time."

  The historian’s judgment primarily engages two distinct dimensions of historical interpretation: (ii) the description of past agents' beliefs, categories, and reasons, and (iii) the evaluation of past conduct. The reviewer’s charge of presentism targets dimension (iii). The historian’s defense, however, conflates this specific charge with the undeniable presentism inherent in dimensions (i) (selecting topics/questions worth asking) and (iv) (applying modern standards of evidence and explanation).

  The historian is correct that presentism is inescapable regarding (i) and (iv). Our decision to study medieval torture rather than, say, crop rotation patterns reflects present-day concerns about human rights, justice, or state power. Similarly, our commitment to rational argumentation, empirical evidence (rejecting trial by ordeal as valid proof), and causal explanation grounded in material and social forces (not divine intervention) are modern epistemic standards (iv). We *should not* abandon these standards; adopting medieval evidentiary norms would render coherent historical explanation impossible. The historian rightly invokes this inescapability in their defense.

  However, the reviewer’s charge focuses not on *why* torture is studied (i) or *how* its practice is evidenced and explained (iv), but on the *moral evaluation* (iii) embedded in the conclusion: labeling it "morally abhorrent" and "incompatible with any legitimate conception of justice." Sliding from the necessary presentism of (i) and (iv) to justify the presentism in (iii) is the critical error in the historian’s defense. The inescapability of our perspective in choosing the topic and wielding modern analytical tools does *not* logically entail the legitimacy of imposing our specific moral judgments on the past.

  Regarding dimension (ii), the historian’s conclusion risks conflating evaluation with description. A defensible approach requires rigorously reconstructing the *medieval* "conception of justice," categories of proof, beliefs about pain, body, truth, and authority, and the reasons contemporaries offered for torture (e.g., as a necessary, divinely-sanctioned tool to extract truth where evidence was scarce, serving a higher good of social order and salvation). Describing these beliefs and reasons accurately demands suppressing our own moral revulsion to understand the *internal* logic of the practice, however alien. Calling it "fundamentally incompatible with any legitimate conception of justice" implicitly denies the legitimacy of *their* conception within *their* framework, failing this descriptive task (ii).

  A defensible position on evaluation (iii) must navigate a difficult path. Simply adopting medieval justifications as morally valid for us today is unacceptable – it risks moral relativism where any practice becomes justified by its context. Yet, baldly condemning it with modern labels like "human dignity violation" is anachronistic and shuts down understanding. The cost of avoiding pure presentist condemnation is accepting that we cannot simply *endorse* the past. The cost of avoiding pure contextual absorption is that we *must* bring our own moral framework to bear, but with crucial constraints.

  The defensible position involves:
  1.  **Prior Rigorous Description (ii):** Establishing *what* contemporaries believed they were doing and why, based on their categories and reasoning, separating this from judgment.
  2.  **Contextual Understanding as Prerequisite for Evaluation:** Recognizing that moral evaluation requires understanding the practice within the full context of available alternatives, knowledge, pressures, and prevailing norms. Torture wasn't an isolated choice but embedded in a specific legal, epistemic, and cosmological system.
  3.  **Transcendent but Historically Sensitive Evaluation:** Engaging in moral reasoning that seeks principles potentially transcending specific contexts (e.g., concerns about suffering, consent, arbitrary power) while being acutely aware of historical contingency. We might argue that *even within the constraints of their time*, other paths were conceivable (though perhaps not seen), or that the practice contained internal contradictions with their *own* stated values. Alternatively, we might conclude that while explicable contextually, the practice represents a profound moral failure *from a perspective informed by subsequent human experience*, but this must be argued carefully, not asserted as self-evident. The key is acknowledging the *gap* between historical understanding and moral judgment, and the work required to bridge it responsibly.

  The historian's original condemnation fails this test; it is an undisciplined presentist judgment (iii). Their defense, while capturing necessary truths about (i) and (iv), fails because it uses the inescapability of presentism in those domains to illegitimately shield an anachronistic and inadequately supported moral evaluation (iii). A defensible history recognizes that escaping one's time is impossible in choosing *what* and *how* to study, essential in *describing* past mentalities, and fraught but necessary – and requiring immense methodological care – in *evaluating* past conduct.

  ---

  ## Marking Scheme (25 Marks Total)

  1.  **Identification of Specific Dimensions (5 marks):**
      *   *Awarded for:* Clearly distinguishing the four dimensions (i-iv) and correctly identifying that the historian's judgment primarily involves (ii) description and (iii) evaluation, while the reviewer's charge targets (iii), and the historian's defense invokes (i) and (iv).
      *   *Common Error/Loss of Mark:* Vaguely discussing "presentism" generally without specifying which dimensions are involved in each part of the dispute; conflating the dimensions (e.g., saying the defense addresses evaluation).

  2.  **Analysis of Defense & the "Slide" (7 marks):**
      *   *Awarded for:* Correctly explaining why the historian's defense ("all history is written from the present") is valid regarding (i) topic/question selection and (iv) evidence/explanation standards (and why (iv) *should* be presentist), AND clearly explaining why this defense does *not* successfully counter the specific charge of presentism regarding (iii) evaluative judgment (i.e., identifying the invalid slide/conflation).
      *   *Common Error/Loss of Mark:* Accepting the defense as sufficient without qualification; rejecting the defense entirely without acknowledging its validity for (i) and (iv); failing to articulate the logical gap between the defense's scope (i/iv) and the charge's target (iii).

  3.  **Distinguishing Description (ii) from Evaluation (iii) (5 marks):**
      *   *Awarded for:* Explaining the necessity of rigorous, non-anachronistic description of past beliefs/categories/reasons (ii) as distinct from, and a prerequisite for, any evaluation (iii). Highlighting how the historian's phrasing ("incompatible with any legitimate conception of justice") likely fails this descriptive task.
      *   *Common Error/Loss of Mark:* Conflating the task of describing past reasons with endorsing them; arguing that description is impossible or irrelevant; failing to see how the historian's judgment impedes accurate description.

  4.  **Articulating Defensible Evaluation (iii) & Costs (5 marks):**
      *   *Awarded for:* Outlining a nuanced position on evaluating past conduct that avoids both crude presentist condemnation and uncritical contextual relativism, emphasizing the need for contextual understanding as a basis, and acknowledging the trade-offs/costs (e.g., difficulty of transcendent judgment, risk of relativism or anachronism, the "gap" between understanding and judging).
      *   *Common Error/Loss of Mark:* Advocating for pure moral relativism ("it was right for them"); insisting on absolute condemnation with no nuance; providing only a vague plea for "balance" without concrete conceptual steps or acknowledgment of costs.

  5.  **Clarity, Structure & Argumentation (3 marks):**
      *   *Awarded for:* Logical flow, coherent structure, precise language, and building a persuasive argument focused on the crux without unnecessary digression.
      *   *Common Error/Loss of Mark:* Disorganized presentation; vague or imprecise terminology; repetitive points; failure to directly engage the core conceptual distinctions.

  **Separating an A from a B Answer:**
  *   A **B answer** will correctly identify the dimensions, recognize the slide, and outline the need for description and contextual evaluation, but may lack depth in explaining *why* the slide is invalid, struggle with the distinction between (ii) and (iii), or offer a somewhat formulaic or underdeveloped solution for defensible evaluation.
  *   An **A answer** will demonstrate a sophisticated, integrated understanding. It will meticulously dissect the slide, compellingly argue *why* presentism in (i/iv) doesn't license it in (ii/iii), sharply distinguish the demands of description (ii) from evaluation (iii), and articulate a defensible position on (iii) with profound awareness of its inherent tensions, costs, and the precise nature of the trade-offs involved in historical moral judgment. It will exhibit meta-awareness of the argument's structure and purpose.
