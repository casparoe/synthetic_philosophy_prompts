  For common student errors, I anticipate they might: treat presentism as monolithic, conflate the four aspects, overcompensate by rejecting any evaluation, fail to distinguish description from evaluation, or misunderstand why evidentiary standards (iv) must remain modern.

  The marking scheme should reward: clear articulation of the four aspects, identification of the slide between them, distinction between unavoidable vs problematic presentism, concrete application to the scenario, and recognition of trade-offs in historical practice. An A answer will show meta-awareness of how these dimensions interact in historiography rather than just listing them mechanically.

