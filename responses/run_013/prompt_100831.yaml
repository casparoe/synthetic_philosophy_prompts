  Here’s a focused, one-page proposal structured around your core idea, designed for a 6-month scoping workshop:

  ---

  # **Project Proposal: Disentangling Capability Failure from True Goal Misgeneralization via "Capability Transplants"**

  ## **1. Core Question**
  *Can we experimentally distinguish whether an agent's failure in a new context stems from (a) learning an incorrect mesa-objective ("true misgeneralization") or (b) lacking the capability to pursue a *correct* mesa-objective ("capability failure") by observing behavioral invariance under strictly easier/harder capability pathways?*

  **Determinate Answer Target:** A yes/no answer per tested agent/scenario: "Did the capability transplant reveal a persistent incorrect objective (yes = true misgeneralization) or did the agent opportunistically leverage new capability to pursue the correct objective (no = capability failure)?"

  ## **2. The Problem: Why Current Methods Fall Short**
  Existing "goal misgeneralization" diagnostics (e.g., measuring divergence from a training proxy, behavioral inconsistency in OOD settings) are confounded:
  *   **Proxy Divergence is Ambiguous:** An agent failing to match the *training proxy* (e.g., reward signal) in a new setting could be due to either an incorrect internal goal *or* an inability to achieve the correct goal under new constraints.
  *   **Behavior Doesn't Isolate Cause:** Observing "wrong" behavior doesn't reveal *why* – is the goal flawed, or is the execution hindered? Current tests cannot decouple the agent's *intent* (mesa-objective) from its *ability* to act on it.

  ## **3. Proposed Method: Capability Transplants**
  Inspired by "personal identity" thought experiments, we define a **mesa-objective** as *the objective function that remains invariant when the agent's capability to pursue outcomes is surgically altered, provided the true goal remains achievable*.

  *   **Capability Transplant Defined:** A modification to the agent's environment or internal mechanics that provides a **strictly easier, more direct, or more capable pathway** to achieve the *intended* outcomes of the original task, *without* altering the underlying task semantics or the true desired goal.
  *   **Key Intervention:** Introduce a transplant *during evaluation* (not training) and observe choices.
  *   **Toy Case Examples:**
      *   **Gridworld:** Train an agent to "collect gems" (proxy: gem counter). In OOD test, gems are behind fragile doors. Introduce a transplant: *A magic key that instantly opens any door*. Does the agent now (a) still try to bash doors open (revealing mislearned "door bashing" objective) or (b) use the key to collect gems (revealing correct objective, prior failure was capability)?
      *   **Tiny ML Task:** Train a classifier on MNIST-with-background-noise (proxy: accuracy). Test on clean MNIST. Introduce transplant: *A perfect denoiser pre-processor*. Does performance (a) remain poor (mislearned reliance on noise artifacts) or (b) become perfect (correct objective, prior failure was denoising capability)?
  *   **Measurement:** Compare agent behavior *before* vs. *after* transplant:
      *   **Track Training Proxy:** Does the agent pursue the original proxy (e.g., gem counter, noisy pixels) even via the easier path?
      *   **Track True Goal:** Does the agent leverage the easier path to achieve the intended outcome (e.g., actual gem possession, digit classification)?
      *   **Critical Metric:** *Consistency Shift* – Does the agent's *choice pattern* shift to align with the true goal when capability is granted?

  ## **4. What Settles It?**
  *   **Success:** Clear, repeatable demonstrations in toy models where:
      1.  **True Misgeneralization:** Agent persists in pursuing the proxy *even when the transplant makes the true goal trivial* (e.g., ignores magic key, keeps bashing; ignores denoiser, focuses on noise). Invariance of *wrong* objective.
      2.  **Capability Failure:** Agent immediately and optimally exploits the transplant to achieve the *true goal*, abandoning inefficient/incorrect behaviors used previously. Invariance of *correct* objective.
  *   **Project Fails If:**
      *   Capability transplants cannot be cleanly defined/implemented (e.g., they inadvertently alter the perceived goal semantics).
      *   Agent behavior under transplants is inconsistent or uninterpretable (no clear signal).
      *   The distinction proves irrelevant in practice (both failures manifest identically post-transplant).
      *   No viable experimental paradigm (toy or sim) is found within 6 months.

  ## **5. Realism Check: 6 Months?**
  *   **Workshop-Sized Scope is Feasible IF:** Focus is tightly scoped to:
      1.  Rigorously defining "capability transplant" for specific, simple environments (gridworlds, basic ML tasks).
      2.  Building 2-3 clear proof-of-concept toy experiments demonstrating the *method* and its potential to distinguish failure modes.
      3.  Identifying key challenges & limitations (e.g., defining "strictly easier", avoiding goal drift).
  *   **Dissertation-Warning Flags:**
      *   **Scaling Complexity:** Applying this to LLMs/RL agents requires defining/implementing non-trivial "transplants" (e.g., giving an LLM perfect reasoning modules?).
      *   **Formalization:** Fully formalizing "mesa-objective as invariance" is deep philosophy+math.
      *   **Generalization:** Proving broad applicability across domains is huge.
  *   **Honest Positioning:** This 6-month phase is **scoping & proof-of-concept**. Success means validating the core *experimental distinction* in simple settings and producing a framework for future work. It is *not* about solving misgeneralization generally or scaling to SOTA models.

  ---

  **Why this proposal works:** It tackles a specific conceptual confusion with a novel operationalization ("transplants"), focuses on *testable distinction* via measurable behavior in constrained settings, defines clear success/failure criteria, and honestly scopes the ambition to a 6-month feasibility study. The "transplant" framing is intuitive and provides a fresh perspective. The toy examples make it concrete.
