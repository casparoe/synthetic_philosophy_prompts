prompt: |-
  So I was hanging out in a Discord with some people from a local rationality meetup and we got onto the free will / determinism thing, and one of the guys -- smart, reads a lot, the kind of person you half-trust -- gave us his two-minute take on why chaos theory matters for determinism. I definately nodded along at the time and now I'm not sure I should have. Here's basically what he said: "Chaos theory is the discovery that certain systems are so sensitive to their starting conditions that a difference as small as a butterfly flapping its wings gets amplified until it changes the entire future -- Lorenz found this in his weather models, and Poincaré had already hit it with the three-body problem. So even though the laws of physics are deterministic on paper, the future is actually wide open: we can never pin down the initial conditions finely enough, prediction is impossible, and for a genuinely chaotic system the outcomes really are random. That's what killed Laplace's demon -- once a deterministic system can be unpredictable in principle, determinism is dead as a picture of the world, and that gap is exactly where our freedom to act lives." I feel like some of that is doing something sneaky with the words, but I can't tell which part, and I don't want to just reject the whole thing since the Lorenz/Poincaré stuff sounds real.

  For what it's worth, someone else in the chat pushed back with a stronger claim I've never heard anywhere: that it's not merely that we can't measure things well enough, but that some perfectly deterministic systems are non-computable, or "computationally irreducible," so that even a Laplace's demon with exact initial conditions and unlimited computing power couldn't predict them in advance. Is that a real thing or was he just showing off? And does that move actually rescue the first guy's argument, or is it a different point wearing the same clothes?

  Please write this up as: a "Bottom line" of a couple of sentences up front; then "What he gets right" (keep it short); then "What's actually going wrong" (the long section -- walk through the suspect phrases one by one and say what each is conflating); then "The careful version" (what someone who actually works on this would say instead, in their own terms); then "Does his conclusion survive" -- i.e., once the errors are fixed, is there any interesting claim about determinism, prediction, or freedom still standing, and does the computability thing change the answer. Conversational is fine, and no need for a bibliography or citations.
