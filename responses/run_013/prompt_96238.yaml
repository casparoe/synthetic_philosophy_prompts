prompt: |-
  I'm a third-year undergraduate taking a seminar in the philosophy of the social sciences, where we have just spent three weeks on David Lewis's analysis of convention, and in parallel I'm doing a module in evolutionary game theory and multi-agent reinforcement learning. Lewis's account, as I understand it, is a piece of conceptual engineering carried out with possible worlds, common knowledge, and counterfactual preferences; everything I do in the other module is populations of myopic agents, replicator dynamics, basins of attraction, stochastic stability, equilibrium selection. My seminar leader treats these as accounts of the same phenomenon and my game theory lecturer treats Lewis as a charming historical preamble, and I suspect neither of them has noticed how much has to be given up to make the two line up. I'd like you to do the translation explicitly. Please restate Lewis's position on social convention, and the evolutionary and learning-theoretic literature on how norms and conventions arise and are sustained, in the vocabulary I actually work in: coordination games with multiple equilibria, payoff matrices, best-response dynamics, evolutionary stable strategies, basins of attraction, correlated equilibrium, symmetry-breaking and payoff-irrelevant cues, punishment and sanctions as modifications to the payoff structure, and the standard reinforcement-learning apparatus of learning rules, shared priors, and convergence results. I have enough game theory to follow the formalism without hand-holding — feel free to use it — but my metaphysics and philosophy of language are shaky, so don't assume I know the possible-worlds machinery or the literature on linguistic meaning.

  Concretely, I want Lewis's conditions on a convention, his claim that conventions are arbitrary, and his claim that conforming gives an agent a reason to conform, all rendered in the dynamical vocabulary as precisely as you can. Then give me the residue report, which is the part I actually care about. Which of his claims translate cleanly? Which translate only under distortion, and what exactly gets distorted — for instance, does the common-knowledge requirement have any honest counterpart when agents are modelled as myopic learners who never represent each other's representations, or is the natural move to replace it with something weaker that is not the same thing? Does arbitrariness survive once payoff asymmetries and salience do all the equilibrium-selection work? And does the normative "reason to conform" survive at all in a purely descriptive selection account, or is it simply dropped and replaced by the observation that deviation is unprofitable?

  Finally, I want your view on whether the residue is a defect of the target framework or a sign that the original claim was less clear than it looked. Two specific things I'd like you to address, because they're what made me suspicious in the first place. First, some authors distinguish conventions, which are self-enforcing and arbitrary, from norms, which people follow even when they would rather defect and which are backed by sanctions and by feelings like guilt and shame; I want to know whether that distinction is expressible in the dynamical vocabulary or whether it collapses into the banal observation that the two cases have different payoff matrices, and if it collapses, whether anything was lost. Second, Lewis seems to allow that a population can be mistaken about what its convention is, or about whether there is one, and I cannot see what the counterpart of being mistaken about your own equilibrium is when the equilibrium is defined by the population's actual behaviour. Tell me whether that is a genuine gap in my vocabulary, a genuine unclarity in his, or just me misreading the setup.
reasoning: |-
  We are going to break this down step by step.

  ### Step 1: Restate Lewis's position in game-theoretic and dynamical terms

  David Lewis, in *Convention: A Philosophical Study* (1969), defines a convention as a solution to a recurrent coordination problem. Let's translate his conditions:

  1. **Recurrence**: The situation is a coordination game (with multiple strict Nash equilibria) that arises repeatedly in the population.

  2. **Regularity of Behavior**: In the population, almost everyone follows one particular strategy profile (which is a strict Nash equilibrium) in that game.

  3. **Arbitrariness**: There is at least one other strict Nash equilibrium that could have been followed instead, and if everyone had followed that one, they would have been equally well off (or nearly so). That is, the equilibrium selected is not uniquely optimal by payoff dominance or risk dominance.

  4. **Common Knowledge**: It is common knowledge in the population that almost everyone follows this equilibrium and that almost everyone expects everyone else to follow it, and that this is a coordination game with multiple equilibria.

  5. **Preference to Conform**: Each agent has a conditional preference to conform to the equilibrium given that almost everyone else does. This is because, in a coordination game, if others are playing the equilibrium strategy, then the best response is to play the same.

  6. **Reason to Conform**: The reason for conforming is that it is in one's best interest (given the actions of others) to do so. This reason is grounded in the payoffs of the coordination game.

  Now, translating into the requested vocabulary:

  - The **coordination game** is represented by a payoff matrix with at least two strict Nash equilibria (i.e., at each equilibrium, no player can unilaterally deviate and get a higher payoff, and the equilibrium is in pure strategies).

  - **Regularity of behavior** is the population state being at (or near) one of these strict Nash equilibria.

  - **Arbitrariness** is captured by the existence of multiple strict Nash equilibria with the same (or very similar) payoff profiles. The equilibrium selected is arbitrary in the sense that it is not selected by payoff dominance (if one equilibrium gives everyone a higher payoff than another) or risk dominance (if one equilibrium is less risky). However, note that in evolutionary dynamics, the selection might be driven by initial conditions, stochastic perturbations, or other factors.

  - **Common knowledge**: In the evolutionary and learning-theoretic framework, we typically don't have explicit common knowledge. Instead, we have:
    - A population state that is publicly observable (or at least, agents can observe a sample of others' behavior).
    - In learning models, agents might have a shared prior (in Bayesian models) or use the same learning rule that leads them to expect the current equilibrium to persist.

    But note: common knowledge in Lewis is a very strong condition. In the dynamical setting, we often replace it with the idea that the population is in an equilibrium (so everyone is best responding to the current distribution) and that this is stable under the dynamics. The stability (e.g., being an attractor) implies that if the population is in the basin of attraction of that equilibrium, it will stay there. This stability might be common knowledge in the limit of long time, but not necessarily at every step.

  - **Preference to conform**: This is simply the best-response property. At the equilibrium, each agent's strategy is a best response to the others. In a coordination game, if the population is at equilibrium A, then for any agent, playing the action prescribed by A is a best response to the others playing A.

  - **Reason to conform**: The reason is that deviating (unilaterally) would lead to a lower payoff. This is a direct consequence of the equilibrium being strict.

  ### Step 2: The residue report

  Now, we compare and see what gets lost or distorted.

  #### (a) Common knowledge

  In Lewis, common knowledge is a key component. In the evolutionary and learning models, we do not require that agents have infinite recursion of beliefs. Instead:

  - In evolutionary dynamics (e.g., replicator dynamics), agents are myopic and adjust their strategies based on observed payoffs. They do not form beliefs about others' beliefs. The system converges to an equilibrium if it is in the basin of attraction of that equilibrium. The stability of the equilibrium (e.g., being an evolutionarily stable strategy, ESS) ensures that once the population is near the equilibrium, it stays there. This stability condition can be seen as a weak, emergent form of common knowledge: over time, the population's behavior becomes consistent and mutually reinforcing.

  - In multi-agent reinforcement learning, agents may use learning rules (e.g., Q-learning, fictitious play) that lead to convergence to equilibrium. If the learning algorithm converges, then eventually each agent's strategy is a best response to the others. However, during the learning process, there is no common knowledge. The convergence result is the counterpart of common knowledge in the long run.

  **Distortion**: The common knowledge condition in Lewis is an explicit, static condition that holds at a given time. In the dynamical setting, we have a process that, if it converges, leads to a state where the behavior is consistent and mutually best-responding. The dynamical setting does not require common knowledge at any finite time; it is replaced by convergence and stability. This is a significant weakening.

  #### (b) Arbitrariness

  In Lewis, arbitrariness means that there is another equilibrium that could have been chosen and that would have been just as good. In the evolutionary setting, the selection of an equilibrium might be due to:

  - Initial conditions: The basin of attraction of the selected equilibrium is the one that contained the initial population state.
  - Stochastic perturbations: In models with noise (e.g., Kandori-Mailath-Rob model), the long-run equilibrium (stochastically stable) might be the one with the largest basin of attraction or the one that is risk-dominant (if payoffs are symmetric).
  - Payoff asymmetries: If one equilibrium is payoff-dominant, it might be selected even if it is risk-dominated? Not necessarily. The selection might depend on the dynamics.

  However, note that in the presence of payoff asymmetries or salience (e.g., a focal point due to a payoff-irrelevant cue), the arbitrariness might be lost. For instance, if one equilibrium is salient (e.g., because of a labeling asymmetry), then it is no longer arbitrary in the sense that there is a reason (the cue) for its selection.

  But Lewis allows that arbitrariness can be broken by salience (he discusses focal points). So the evolutionary account can capture this: a payoff-irrelevant cue can break symmetry and lead to the selection of one equilibrium. Then, in the presence of such a cue, the convention is not arbitrary? Lewis would say: if the cue is present, then it is not arbitrary. But if there are multiple equilibria and no cue, then the one that emerges is arbitrary.

  **Distortion**: The evolutionary account can capture arbitrariness when there are multiple equilibria with the same payoffs and no cue. However, in practice, the selection might be determined by factors that are not arbitrary (e.g., risk-dominance, which is payoff-relevant). So the condition of arbitrariness might not hold in the long run if the selection is driven by risk-dominance. But note: risk-dominance is a payoff-relevant criterion, so if one equilibrium is risk-dominant, then it is not arbitrary in the sense of being equally good? Actually, risk-dominance is defined by the product of the deviation losses, so it is still arbitrary in Lewis's sense? Lewis's arbitrariness is about the existence of an alternative that is equally good in terms of payoffs. Risk-dominance is about the size of the basin of attraction and the resistance to invasions. So an equilibrium that is risk-dominant is still arbitrary in Lewis's payoff sense if the other equilibrium has the same payoffs? Yes, because the payoffs are symmetric. The arbitrariness condition survives.

  **Conclusion on arbitrariness**: It translates cleanly as long as the payoffs at the alternative equilibria are the same. But note that in evolutionary models, the selection might be non-arbitrary (e.g., driven by risk-dominance) even when payoffs are symmetric. However, Lewis would not be troubled by this because he allows that conventions can be selected by salience, and risk-dominance might be a form of salience? Actually, risk-dominance is a payoff-based criterion, so it breaks the arbitrariness? But wait: if two equilibria have the same payoff vector, then they are symmetric and risk-dominance might break the tie? Then the convention is not arbitrary because there is a reason (risk-dominance) to choose one over the other? This is a point of tension.

  Lewis's arbitrariness condition requires that there is an alternative that is also a coordination equilibrium and that it is arbitrary in the sense that the reason for conforming to the current one is not that it is better. But if one equilibrium is risk-dominant, then it is better in the sense of being more stable. However, in Lewis's setup, the agent's reason to conform is conditional on the others' behavior. So even if one equilibrium is risk-dominant, if the population is at the other one, then an agent still has reason to conform to the current one. So the arbitrariness condition holds.

  #### (c) Reason to conform

  In Lewis, the reason to conform is a normative reason: it is rational to conform because it is in your interest. In the evolutionary and learning setting, we have:

  - In equilibrium, deviating is unprofitable (because it is a strict Nash equilibrium).
  - In the dynamics, agents are programmed (by evolution or learning) to follow strategies that yield higher payoffs.

  But note: Lewis's reason is a rational reason for an agent. In the evolutionary setting, we are describing a population process. The normative force is not explicitly represented. We can say that the agent has an instrumental reason: to maximize payoff. But if the agent is a myopic learner, they are not necessarily reasoning about it; they are just updating based on payoffs.

  **Distortion**: The reason to conform is translated as the best-response property. But the normative aspect (that one *should* conform) is not part of the descriptive account. The evolutionary account only says that in equilibrium, deviation is unprofitable, and that the dynamics lead to conformity. It does not say that an agent *ought* to conform; it just says that they do, and that if they don't, they get lower payoffs.

  However, if we interpret the evolutionary account as a model of rational learning, then we can say that the agent, by updating their strategy to increase payoffs, is responding to the reason. But the normative force is only implicit.

  ### Step 3: Addressing the two specific issues

  #### (i) Convention vs. Norm

  In the literature, a convention is self-enforcing (like a coordination equilibrium) and arbitrary, while a norm is followed even when there is an incentive to defect, and it is enforced by sanctions and internalized feelings.

  In game-theoretic terms:

  - **Convention**: A strict Nash equilibrium of a coordination game (so if others follow, you want to follow).
  - **Norm**: We model this as an equilibrium of a different game. For instance:
    - Sanctions: We add a punishment mechanism. If someone deviates, others punish the deviator, which lowers the deviator's payoff. This can be modeled as a transformation of the payoff matrix. The original game without sanctions might have a dominant strategy to defect, but with sanctions, the norm (cooperation) becomes a Nash equilibrium.
    - Internalized feelings: We can model this by modifying the agent's utility function. For example, if an agent deviates, they feel guilt, which reduces their utility. Then, the norm behavior becomes a best response.

  In the dynamical vocabulary:

  - **Convention**: The population is at a strict Nash equilibrium of a coordination game, and the dynamics (best-response or replicator) have that equilibrium as an attractor.

  - **Norm**: We have a modified game (with punishment or guilt) in which the norm behavior is a strict Nash equilibrium. The equilibrium is sustained by the threat of punishment or by the internalized feelings. The basin of attraction for the norm equilibrium might be smaller, and we might need additional mechanisms (e.g., a punishment institution) to sustain it.

  **Does the distinction collapse?** Not entirely. We can distinguish:

  - The payoff matrix for a convention: a coordination game (e.g., driving on the left vs. right).
  - The payoff matrix for a norm: a game with sanctions (e.g., a prisoner's dilemma with punishment). 

  But note: if we model guilt as a change in payoffs, then the norm equilibrium is also a Nash equilibrium of the modified game. So in the end, both are Nash equilibria. The difference is in the underlying game. 

  **Is anything lost?** The distinction is preserved by noting the structure of the game. However, the dynamic story for norms might be more complex. For norms, we often need to explain how the punishment mechanism or the guilt feeling evolved. That might require additional dynamics (e.g., group selection, cultural evolution of preferences). But in principle, we can model both as equilibria in appropriately defined games.

  #### (ii) Mistaken Beliefs

  Lewis allows that a population can be mistaken about what the convention is. For example, they might think there is a convention to drive on the left, but actually most people are driving on the right. Or they might think there is a convention when in fact there isn't.

  In the evolutionary setting, the equilibrium is defined by the actual behavior. The population state is a vector of strategies. If the population is at an equilibrium, then by definition, almost everyone is playing the equilibrium strategy. So how can they be mistaken?

  In Lewis, the convention includes a belief component (common knowledge). So if the population is at an equilibrium but there is no common knowledge, then it might not be a convention? Lewis requires both the behavior and the common knowledge.

  In the dynamical setting without common knowledge, we have the behavior. So if we only require the behavior (and the best-response property), then we don't have the belief component. Therefore, the possibility of mistake about the convention is not captured.

  To capture mistake, we would need to model beliefs separately from behavior. For example, in a learning model with beliefs:

  - Agents have beliefs about what others will do.
  - They choose a best response to their beliefs.
  - The actual behavior might not match the beliefs.

  Then, we can have a situation where the actual behavior is an equilibrium, but the agents have mistaken beliefs (e.g., they believe that others are playing A, so they play A, but actually the majority is playing B). This would lead to a mismatch and the behavior would not be an equilibrium. So in a consistent equilibrium, beliefs must be correct.

  Therefore, in the learning-theoretic models that include belief formation, we can have mistaken beliefs during the learning process, but in equilibrium, beliefs must be correct. So the possibility of being mistaken about the convention in equilibrium does not arise.

  **Conclusion**: This is a gap in the dynamical vocabulary if we only look at behavior. If we include belief models (e.g., in Bayesian learning), then during the transient phase, agents can be mistaken, but in equilibrium, they are not. Lewis's allowance for mistakes in equilibrium (if I understand correctly) might be about cases where the population is not in equilibrium? But Lewis requires that the behavior is regular and that the expectations are correct. So I think he does not allow for mistakes in equilibrium. He says: "It is common knowledge that almost everyone conforms to R" (where R is the regularity). So if they are mistaken, then it is not common knowledge. Therefore, in equilibrium, there should be no mistake. But note: Lewis allows that the common knowledge might be approximate? He says "almost everyone". If someone is mistaken, they might be in the minority. But then the condition fails? 

  This point is subtle. In Lewis, if an agent is mistaken about what others are doing, then the common knowledge condition fails. So for a convention to exist, there must be common knowledge, which implies that everyone knows the convention. Therefore, in equilibrium, there is no mistake. The possibility of mistake only arises in non-equilibrium situations.

  In the evolutionary setting, non-equilibrium situations are part of the dynamics, but we don't call them conventions until the equilibrium is reached. So the gap might be that Lewis's account is static and requires common knowledge at the time of the convention, while the evolutionary account is dynamic and doesn't require common knowledge until the system has converged.

  ### Step 4: Overall residue assessment

  The residue (what is lost or distorted) includes:

  1. **Common knowledge**: Replaced by convergence and stability. This is a weakening, but it is adequate for explaining the emergence and stability of conventions. The dynamical account is more realistic for how conventions arise.

  2. **Arbitrariness**: Translates well as long as we have multiple equilibria with the same payoffs. However, in evolutionary selection, the equilibrium that is selected might be non-arbitrary (e.g., risk-dominant) even when payoffs are symmetric. But Lewis would accept that arbitrariness can be broken by salience, and risk-dominance might be a form of salience? Actually, risk-dominance is a payoff-based concept, so it might break the arbitrariness in a way that Lewis did not intend? However, note that in a symmetric coordination game, the risk-dominant equilibrium is still arbitrary in the sense that the other one is equally good in terms of payoffs? It's just that one is more stable. So the condition survives.

  3. **Reason to conform**: Translated as the best-response property. The normative aspect (that one has a reason) is not explicitly represented in the descriptive dynamics, but it is implicit in the payoff maximization. This is a mild distortion.

  ### Step 5: Your view on the residue

  You ask: is the residue a defect of the target framework or a sign that the original claim was less clear than it looked?

  I think the residue is not a defect of the target framework. The evolutionary and learning frameworks are designed to explain how conventions emerge from decentralized, myopic interactions. They are more naturalistic and avoid the strong assumptions of common knowledge and rational deliberation. The residues (like the weakening of common knowledge) are necessary simplifications for tractability and realism.

  However, the original claim (Lewis's) is not less clear; it is a conceptual analysis of what a convention is. The dynamical account provides a mechanism for how conventions arise and are sustained, which complements the conceptual analysis.

  Specifically:

  - The common knowledge condition in Lewis is an idealization. The dynamical account shows that we can get the same behavioral regularity without it.

  - The possibility of mistake in Lewis is limited to non-equilibrium situations, which the dynamical account covers by the transient phase.

  - The distinction between conventions and norms is expressible in the dynamical vocabulary via the game structure.

  In conclusion, the translation is largely successful, with the main casualty being the strong common knowledge condition. But that is a feature, not a bug, of the evolutionary approach.

  ### Final Note

  You asked for formalism where appropriate. I have avoided heavy notation to keep it readable, but let me know if you want a specific game-theoretic model for any part.
answer: |-
  ### Restating Lewis in Dynamical Vocabulary

  **Lewis's Core Claims Translated:**  
  David Lewis defines a *convention* as a solution to a recurrent coordination problem with the following conditions:  

  1. **Recurrent Coordination Game**:  
     - **Lewis**: Agents face a recurrent situation with multiple strict Nash equilibria, where coordination is mutually beneficial but requires alignment.  
     - **Translation**: A population repeatedly plays a symmetric coordination game \( G = (S, U) \), with strategy set \( S \) and payoff matrix \( U \), having at least two strict Nash equilibria (e.g., \(\{A, A\}\) and \(\{B, B\}\)). Equilibria must be *strict* (unilateral deviation yields strictly lower payoff).  

  2. **Regularity of Behavior**:  
     - **Lewis**: A population almost uniformly follows one specific equilibrium.  
     - **Translation**: The population state \( \sigma \) (a distribution over strategies) converges to a point attractor near a pure-strategy Nash equilibrium (e.g., \(\sigma \to \{A, A\}\)).  

  3. **Arbitrariness**:  
     - **Lewis**: The chosen equilibrium is arbitrary—another could have served equally well.  
     - **Translation**: The equilibria are **payoff-equivalent** or **payoff-symmetric** (e.g., \(U(A,A) = U(B,B)\)). Selection is **path-dependent**, driven by initial conditions, stochastic perturbations, or symmetry-breaking cues—not inherent payoff superiority.  

  4. **Common Knowledge**:  
     - **Lewis**: It is common knowledge that (i) almost all conform, (ii) all expect others to conform, and (iii) all prefer conformity given others' conformity.  
     - **Translation**: Replaced by **dynamical stability**:  
       - **Best-response dynamics**: Agents myopically play \( BR(\sigma_{-i}) \).  
       - **Attractor basin**: The equilibrium has a basin of attraction \( \mathcal{B}(E) \subseteq \Delta S \). If \( \sigma \in \mathcal{B}(E) \), trajectories converge to \( E \).  
       - **Stochastic stability**: Under perturbations (e.g., mutation rates), the equilibrium is the stochastically stable state (highest resistance to invasion).  
       - *No direct counterpart to iterated knowledge*: Agents need no beliefs about beliefs; stability emerges from local adaptation.  

  5. **Conditional Preference to Conform**:  
     - **Lewis**: Agents prefer to conform if others do.  
     - **Translation**: At equilibrium \( E \), the strategy is a strict best response: \( U_i(s_i, \sigma_{-i}^*) > U_i(s_i', \sigma_{-i}^*) \) for all \( s_i' \neq s_i^* \), where \( \sigma_{-i}^* \) is the equilibrium play of others.  

  6. **Normative Reason to Conform**:  
     - **Lewis**: Conforming is rational given others' behavior.  
     - **Translation**: In equilibrium, deviation reduces payoff: \( \Delta U_i < 0 \) for unilateral deviation. This is a **descriptive incentive**, not normative—it explains *why* agents conform, not why they *should*.  

  ---

  ### Residue Report: What Translates, What Distorts, and What is Lost

  #### **1. Common Knowledge → Dynamical Stability**  
  - **Translation**: Replaced by convergence to a stable equilibrium under best-response or replicator dynamics.  
  - **Distortion**:  
    - **Loss of epistemic depth**: Common knowledge requires infinite recursion of beliefs ("I know that you know..."). Myopic learners (e.g., replicator dynamics) lack beliefs entirely; reinforcement learners (e.g., Q-learning) have beliefs only about others' actions, not their beliefs.  
    - **Honest counterpart**: Stability replaces common knowledge *functionally*: if \( \sigma \) is in \( \mathcal{B}(E) \), agents *de facto* expect others to play \( E \) because history supports it.  
  - **Verdict**: *Weakening, not distortion*. Common knowledge is an idealization; dynamics show how coordination emerges without it.  

  #### **2. Arbitrariness → Path-Dependence and Payoff-Equivalence**  
  - **Translation**: Holds cleanly if:  
    - Equilibria are payoff-symmetric (\( U(A,A) = U(B,B) \)).  
    - Selection depends on **initial conditions** (e.g., \( \sigma_0 \in \mathcal{B}(A,A) \)), **stochastic drift**, or **symmetry-breaking cues** (e.g., labeling asymmetries).  
  - **Distortion**:  
    - **Payoff asymmetries dominate**: If \( U(A,A) > U(B,B) \), payoff-dominance often selects \( A \) (e.g., via risk-dominated basins). Lewis's arbitrariness fails.  
    - **Risk-dominance**: Even with symmetric payoffs, risk-dominant equilibria (larger basins) are selected under many dynamics (e.g., Kandori-Mailath-Rob models). This makes selection *non-arbitrary*.  
  - **Verdict**: *Conditional survival*. Arbitrariness holds only if:  
    - Payoffs are symmetric,  
    - No dynamic bias (e.g., uniform initial conditions),  
    - No salient cues.  
    Else, evolutionary dynamics "corrupt" arbitrariness with payoff-driven selection.  

  #### **3. Normative Reason → Descriptive Incentive**  
  - **Translation**: "Reason to conform" becomes "deviation reduces payoff" (\(\Delta U < 0\)).  
  - **Distortion**:  
    - **Normativity erased**: Lewis's "reason" implies rationality; dynamics show conformity as an emergent outcome of adaptation (e.g., reinforcement learners converge to equilibrium).  
    - **No counterfactual force**: Agents don’t conform *because* of a reason; they adapt until deviation is unprofitable.  
  - **Verdict**: *Dropped and replaced*. The "reason" is reduced to a payoff consequence—no normative residue remains.  

  ---

  ### Addressing Your Specific Queries  

  #### **1. Conventions vs. Norms: Does the Distinction Collapse?**  
  - **Lewis**: Conventions are self-enforcing, arbitrary, and lack sanctions (e.g., driving side). Norms involve sanctions, guilt, and are followed even when defection is tempting (e.g., queueing).  
  - **Dynamical Vocabulary**:  
    - **Convention**: Coordination game with multiple strict Nash equilibria (e.g., \( G \) where \(\{A,A\}\) and \(\{B,B\}\) are equilibria).  
    - **Norm**: A **sanction-modified game** \( G' \):  
      - Payoffs altered to penalize deviation (e.g., add \(-c\) to defectors).  
      - Example: Prisoner's Dilemma transformed by sanctions into a coordination game where cooperation is an equilibrium.  
    - *Distinction preserved*: Conventions arise from coordination games; norms require **payoff transformations** (sanctions) or **other-regarding preferences** (e.g., guilt modeled as reduced utility from defection).  
  - **Collapse?**:  
    - Superficially, both are Nash equilibria, but the **game structure** differs:  
      - Conventions: Pure coordination \( \Rightarrow \) multiple equilibria.  
      - Norms: Sanctions create new equilibria \( \Rightarrow \) payoff-asymmetric enforcement.  
    - **Loss**: The "internal" aspect of norms (guilt/shame) is reduced to a utility function modification. The *feeling* of obligation isn't captured—only its behavioral effect.  

  #### **2. Mistaken Beliefs About Conventions: Genuine Gap or Unclarity?**  
  - **Lewis's Claim**: A population can be mistaken about whether a convention exists or what it is (e.g., believing everyone drives left when most drive right).  
  - **Dynamical Challenge**: In equilibrium, behavior *defines* the convention. If \( \sigma = \{A,A\} \), agents play \( A \)—no mistake possible.  
  - **Resolution**:  
    - **Genuine gap in dynamics**: Evolutionary models equate convention with *realized behavior*. Beliefs are superfluous.  
    - **Lewis's unclarity**: He conflates two scenarios:  
      1. **Pre-equilibrium miscoordination**: Agents believe \( A \) is convention, but \( \sigma \notin \mathcal{B}(A,A) \). Dynamics handle this via convergence.  
      2. **Equilibrium with false beliefs**: Inconsistent—if agents believe \( A \) but play \( B \), \( \sigma \) isn’t equilibrium.  
    - **Fix**: Model beliefs explicitly (e.g., Bayesian learning). If beliefs \( \mu_i \) ≠ actual \( \sigma \), agents may not best-respond, leading to instability. But this is transient—no *stable* equilibrium supports mistaken beliefs.  
  - **Verdict**: *Gap in dynamical vocabulary*. Lewis's "mistake" only makes sense in non-equilibrium or belief-augmented models.  

  ---

  ### Overall Assessment: Residue as Defect or Clarification?  
  - **Defect of the Target Framework?** No. Evolutionary/game-theoretic models excel at explaining *how* conventions emerge from decentralized adaptation, but they:  
    - **Simplify epistemology**: Replace common knowledge with stability.  
    - **Naturalize normativity**: Reduce "reasons" to incentives.  
    - **Constrain arbitrariness**: Let dynamics select equilibria.  
  - **Sign of Unclarity in Lewis?** Partly. Lewis's account is *conceptually precise* but *empirically underspecified*:  
    - Common knowledge is idealized and unrealistic.  
    - "Arbitrariness" ignores dynamic selection biases.  
    - "Mistaken beliefs" conflate equilibrium with disequilibrium.  
  - **Verdict**: The residue reveals Lewis's account as a *rational reconstruction* of convention, while dynamics provide a *mechanistic explanation*. The two are complementary: Lewis defines the endpoint; dynamics model the path to it.  

  ### Key Takeaways  
  1. **Common knowledge** → **Stability under dynamics** (weakened but functional).  
  2. **Arbitrariness** → **Path-dependence** (survives only under strict payoff-symmetry).  
  3. **Normative reason** → **Payoff penalty for deviation** (replaced, not preserved).  
  4. **Conventions vs. norms** → **Game structure distinction** (preserved via payoff modifications).  
  5. **Mistaken beliefs** → **Gap in dynamics** (requires belief-augmented models).  

  The evolutionary framework doesn’t "give up" Lewis’s insights; it *operationalizes* them, exposing which elements are essential (equilibrium, incentives) and which are artifacts of philosophical idealization (common knowledge, intrinsic normativity).
