answer: |-
  ### Bottom line
  The 1995 Quebec referendum exposes fundamental tensions in secession theory. Remedial-right theory struggles to explain Quebec’s moral claim while validating Indigenous grievances, whereas primary-right theory captures the weight given to majority will but fractures on nested self-determination demands. The case reveals the boundary problem ("who decides?") as the core political-legal dilemma, not a theoretical footnote.

  ### The mapping  
  **Players**: Quebec sovereignists (claiming a right to secede); Canadian federal government (resisting secession); Quebec federalists (opposing secession); Cree/Inuit nations (asserting counter-secession or partition rights).  
  **Options**: Sovereignty with partnership offer (Yes); status quo (No); partition of Quebec territory.  
  **Expression of will**: Referendum votes (Quebec’s 1995 vote; Cree/Inuit parallel votes); Supreme Court ruling and Clarity Act as institutional responses.

  ### Remedial right only  
  This theory views secession as a last-resort remedy for persistent, severe injustice (e.g., oppression, cultural annihilation). Quebec’s claim—based on cultural distinctiveness and majority will, not systematic rights violations—fails justification. Ottawa’s resistance is defensible, and partition movements gain traction as safeguards against new injustices under sovereignty. The theory **explains** Canada’s refusal to concede legitimacy to the vote alone and frames Indigenous resistance as a valid remedial claim (e.g., against the James Bay hydro project). It **goes silent** on why near-50% support matters morally absent oppression, and cannot account for the Supreme Court’s duty-to-negotiate—which treats expressed will as politically significant even without injustice.

  ### Primary right (plebiscitary)  
  Here, a national majority’s clear expression of will (via fair referendum) triggers a right to negotiate secession. Quebec’s narrow loss (49.42%) thus imposes a moral/political duty on Canada to address sovereignty demands, vindicating the Court’s "clear majority" and negotiation principles. The theory **explains** why the vote’s legitimacy dominated post-1995 debates and why sovereignists saw partition as bad faith. Yet it **misdescribes** Indigenous votes: if Quebec is a "nation" with primary rights, why can’t the Cree be? It cannot resolve nested self-determination claims without arbitrariness or infinite regress.

  ### The Cree and Inuit votes  
  Both theories are tested but neither fully resolves this. **For remedial right**, the Cree/Inuit votes are its *confirmation*: their historical grievances (imposed development, eroded autonomy) fit the injustice criterion better than Quebec’s claim. **For primary right**, these votes are its *problem*: they expose the boundary dilemma. If a Quebec majority can trigger secession talks, why can’t a 96% Cree majority trigger partition? The primary-right view must either deny the Cree’s nationhood (arbitrary) or accept fracturing Quebec—which it rejects. The Supreme Court sidestepped this by framing Indigenous interests as negotiation factors, not veto points, revealing both theories’ limitations.

  ### The symmetry principle  
  The principle ("any secession-claiming group must concede the same right to subgroups") is coherent in theory but politically unstable. The 1995 episode **supports its moral logic**—Quebec sovereigntists invoked self-determination against Canada but denied it to the Cree, highlighting hypocrisy—yet **exposes its practical limits**. Quebec rejected partition as violating territorial integrity, mirroring Canada’s stance. The case shows symmetry was a potent *rhetorical tool* (used by Indigenous groups and federalists) but not a legal reality. It avoids infinite regression because practicality (e.g., viability thresholds) curtails it; the true conflict was over *which* group’s claim took precedence, not whether symmetry applied universally.

  ### What the case does to the theory  
  The referendum **undermines pure versions of both theories**. Remedial right is strained by Quebec’s non-oppressive nationalism, while primary right crumbles on nested identities. The Supreme Court’s hybrid approach (no unilateral right + duty to negotiate after clear vote) reflects this tension. Crucially, the case **proves the boundary problem is central**: the "who decides?" question (Quebec? Cree? Montreal boroughs?) *was* the conflict. The Cree’s stance wasn’t a philosophical footnote but the key counter-narrative, forcing theories to confront scale and precedence. Symmetry emerges as a normative critique but not a workable doctrine—the real lesson is that secession politics is inherently about defining the "self," not applying abstract rights.
