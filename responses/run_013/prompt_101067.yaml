prompt: |-
  I'm an undergraduate in a moral philosophy course, and something from our unit on supererogation has been bothering me. I keep noticing that whether an action counts as going beyond the call of duty seems to depend less on what is done than on who does it. A lifeguard who dives in to save a swimmer is just doing her job; a passerby who does the same thing is a hero. Someone who gives blood easily is thanked less than someone who is terrified of needles and gives anyway. And when a person keeps doing more than is required, the extra seems to get absorbed into what is now expected of them, so the very same act stops being supererogatory the second time around. Is there a single established name for this family of cases, where the "beyond-ness" of an act is fixed by facts about the agent -- their role, what the act costs them, what they have done before -- rather than by the act itself? If there is no such name, I'd like you to propose a term and define it, and either way I want the edges: how does this differ from ordinary role obligations, from the view that supererogation is relative to what an agent is able to do, and from the plain fact that praise is sometimes undeserved? I would much rather be told that I am lumping together things that do not belong together than be handed a tidy label that hides the seams, so please push back if the pattern I'm describing is confused or dissolves on inspection. Please answer in American English.
reasoning: |-
  Okay, the user is an undergrad in a moral philosophy course, specifically wrestling with supererogation. They've noticed a pattern where whether an act counts as "beyond duty" depends heavily on the agent's circumstances—like their role, personal costs, or past actions—rather than the act itself. Examples: a lifeguard saving someone is just doing their job, but a passerby doing the same is heroic; someone overcoming a fear of needles to donate blood gets more praise; and repeated supererogatory acts become expected over time. 

  First, I need to validate their observation—it's sharp and well-grounded in real cases. They're asking if there's a term for this phenomenon where the "beyond-ness" is agent-relative. I recall that while "supererogation" itself is agent-neutral in theory, in practice, assessments are often agent-centered. Terms like "role relativity" or "cost sensitivity" come to mind, but no single established label exists. The closest might be discussions in virtue ethics or debates about praiseworthiness vs. obligatoriness. 

  Their deeper concern seems to be about moral consistency: why does context shift our judgments so dramatically? They might be frustrated that philosophy often treats supererogation as static, ignoring how relational it is. Also, they’re wary of oversimplification—they explicitly want pushback if their grouping is flawed. So I should address whether these cases (role, cost, habituation) truly share a core mechanism or if they’re distinct. 

  Breaking it down: Role obligations clearly redefine baseline duties. Cost speaks to effort/intention, not the act’s content. Habituation blurs lines through changing expectations. All three show that "duty" isn’t fixed but co-constructed by the agent’s traits and history. This challenges simplistic divisions between duty/supererogation. 

  For differentiation: Role obligations are institutional; cost sensitivity is psychological; habituation is sociological. But they unite in making supererogation context-dependent. A proposed umbrella term like "agent-relative supererogation" could work, emphasizing the shift from act to actor. 

  Crucially, they want edges clarified: How is this different from standard role duties? (Roles define duties; this is about how roles redefine what’s "extra.") From ability-relative views? (Ability focuses on capacity; this includes roles/costs/history.) From undeserved praise? (Praise can be misplaced; here, the assessment shifts legitimately based on context.) 

  Finally, they’d prefer honesty over a false tidy label. So I’ll affirm their insight but note tensions—e.g., habituation might be more about expectation creep than supererogation itself. Overall, their pattern holds, revealing how fluid moral categories are in practice.
answer: |-
  You've hit on a profound and genuinely messy aspect of moral phenomenology – the **context-dependence of supererogation assessments based on agent-relative factors**. There isn't a single, universally accepted term for this *entire family* of phenomena, though the components are widely discussed. Recognizing that you'd rather have clarity than false unity, let's break it down, propose a descriptive term, and carefully define the edges.

  **The Core Insight & Proposed Term:**

  Your observation is correct: whether an act is judged *supererogatory* often depends crucially on **facts about the agent** (role, psychological state, personal cost, history) rather than solely on the act itself and its consequences. This highlights that "duty" and "beyond duty" are often assessed relative to a baseline defined *for that specific agent in that specific context*.

  *   **Proposed Umbrella Term: Agent-Relative Supererogation Thresholds (ARST)**
      *   **Definition:** The phenomenon whereby the boundary between morally obligatory and supererogatory conduct for a given act is determined significantly by agent-specific factors (e.g., institutional role, personal capacities, psychological dispositions, incurred costs, past conduct patterns), rather than solely by the intrinsic nature of the act or its consequences in a vacuum.
      *   **Why this term?** "Agent-Relative" captures the dependence on the *who*. "Threshold" emphasizes the shifting line between duty and "beyond duty." "Supererogation" specifies the domain. It's descriptive, not a traditional label, acknowledging the complexity you see.

  **Dissecting the Family & Key Concepts:**

  Your examples point to three distinct, though related, mechanisms shifting the ARST:

  1.  **Role-Relative Obligations:**
      *   *Mechanism:* Institutional roles (lifeguard, doctor, soldier, parent) define specific, heightened duties. What would be supererogatory for someone *without* that role becomes obligatory *for* the role-holder.
      *   *Relation to ARST:* This is the most straightforward case, explicitly defining the agent's baseline duty. The role *is* the primary agent-specific factor raising the threshold for supererogation. Saving a drowning person is *within* the lifeguard's duty, *beyond* the passerby's.
      *   *Key Distinction:* This is different from *ordinary* role obligations in that it specifically explains why an act *ceases to be supererogatory* when performed by someone with a relevant role. The role doesn't just add duties; it absorbs what would otherwise be supererogatory acts *into* the domain of duty.

  2.  **Cost-Sensitivity / Effort-Relativity:**
      *   *Mechanism:* The moral significance (especially praiseworthiness) of an act, and often the judgment of whether it goes "beyond duty," is amplified when it requires significant personal sacrifice, overcomes aversion, or demands exceptional effort *for that particular agent*. The terrified blood donor exhibits greater virtue in overcoming fear.
      *   *Relation to ARST:* This shifts the perceived *height* of the threshold. While the *act* of donating blood might be supererogatory for both, the agent for whom it is *easy* barely clears the threshold (low praiseworthiness), while the agent overcoming terror vaults far beyond it (high praiseworthiness). The *cost* makes the act feel *more* supererogatory *for them*, even if the baseline duty is the same. This is closely tied to virtue ethics and assessments of character.
      *   *Key Distinction vs. Ability-Relativity:* Standard ability-relativity ("ought implies can") concerns whether an act is *possible* for an agent, thus determining if it can even be a *duty*. Cost-sensitivity operates *after* ability is established: among acts an agent *can* do, the ones requiring greater sacrifice/effort are judged *more* supererogatory (or sometimes, the *only* ones supererogatory, if easier alternatives exist). Ability sets the outer limit of duty; cost influences the height beyond that limit.

  3.  **Habituation and Expectation Creep:**
      *   *Mechanism:* Repeated performance of initially supererogatory acts can normalize them, raising community (or even personal) expectations. What was once "above and beyond" becomes the new baseline, absorbed into perceived duty or standard practice. The "extra" gets baked into the role or the agent's specific moral identity.
      *   *Relation to ARST:* This demonstrates the *dynamic* nature of the threshold. The agent's own past actions become an agent-specific factor that *raises* their future duty baseline, thereby lowering the bar for what counts as supererogatory *for them* going forward. The threshold moves upward based on performance history.
      *   *Key Distinction:* This isn't just about institutional roles; it can happen informally based on reputation or personal patterns. It shows how the social/practical definition of duty evolves relative to consistent agents.

  **Addressing the Edges and Potential Confusions:**

  *   **ARST vs. Plain Role Obligations:** Ordinary role obligations define specific duties. ARST *uses* roles (as one factor) to explain *why* an act that *lacks* an intrinsic "duty" property for people in general *gains* that duty property for specific agents. The lifeguard example isn't *just* about the lifeguard having a duty; it's about why the *same act* performed by the passerby *lacks* that duty property but gains a supererogatory one.
  *   **ARST vs. Ability-Relativity:** As noted above, ability-relativity determines the *scope* of possible duties ("can"). ARST factors like cost and role operate *within* that scope to determine where the *line* between duty and supererogation lies *for this agent*, or how *far beyond* the line an act is judged to be. Ability asks "Can they do it at all?" ARST asks "Given they can do it, is it required *of them specifically*, or if not, how heroic is it *for them*?"
  *   **ARST vs. Undeserved Praise:** This is crucial. Undeserved praise means someone gets credit they didn't earn (e.g., taking credit for someone else's act). ARST describes situations where the *assessment of whether the act is supererogatory in the first place, or how supererogatory it is*, is *correctly* sensitive to agent-specific factors. The terrified donor *is* genuinely more praiseworthy *for performing the same act* because of the cost *they* bore. The passerby *is* correctly judged a hero for an act the lifeguard is correctly judged as merely doing their job. The praise tracks the agent-relative moral landscape.
  *   **Is This One Coherent Phenomenon?** You're right to be wary. While all these cases show agent-relativity affecting the supererogation threshold, the *mechanisms* differ:
      *   Role-relativity is often institutional/contractual.
      *   Cost-sensitivity is psychological/virtue-based.
      *   Habituation is sociological/psychological (expectation formation).
      The *unifying thread* is that the moral category (duty vs. supererogatory) for a given *type* of act is not fixed but depends on **the agent's relationship to the act and the context**: their institutional position, their psychological makeup, their history. They all reveal that "duty" isn't a monolithic, agent-neutral concept in practice; it's relational. ARST captures this shared dependence on agent-context without pretending the sub-cases are identical.

  **Conclusion:**

  Your pattern is astute and reflects a significant reality in moral judgment: **supererogation assessments are often agent-relative.** There's no perfect single term, but **Agent-Relative Supererogation Thresholds (ARST)** captures the core idea that the line between duty and "beyond duty" shifts based on *who* the agent is – their role, costs, and history. This differentiates it clearly from ability-relativity (which sets outer limits) and undeserved praise (which is about mistaken attribution). While the sub-cases (role, cost, habituation) involve distinct mechanisms, they share the fundamental feature of making the supererogatory status of an act contingent on agent-specific factors, challenging purely act-centric views of supererogation. You've identified a genuine complexity in moral philosophy, not a confusion.
