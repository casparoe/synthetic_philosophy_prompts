  ### Argument for Hiring the Broker

  Dana should pay the broker to randomize her choice of hospital because, under the given conditions, determinism guarantees a bad outcome, while randomization introduces uncertainty that the forecasting service cannot exploit. Here’s why:

  **1. Why Randomization Helps Despite Bayesian Averaging**  
  A Bayesian agent typically values a lottery over acts as a weighted average of the acts’ utilities, so randomization cannot strictly improve on the best pure act. However, this assumes the agent’s act does not influence the *external conditions* that determine payoffs. In Dana’s case, the forecasting service’s output—fixed before she acts—sets the location of the emergency vehicle, creating a feedback loop. Without the broker, the service perfectly predicts her deterministic choice (e.g., Northside), and the vehicle is dispatched to the *other* hospital (call this adversarial dispatch). If she chooses Northside, the vehicle is at Southside, so she gets no treatment. The same holds if she chooses Southside: the service predicts it, and the vehicle goes to Northside. Thus, determinism ensures a payoff of 0 (no treatment). Randomization severs the evidential link: the service cannot predict the coin flip, so it must commit to a forecast (e.g., Northside) based on prior data. The vehicle goes to Southside, and Dana’s random choice gives her a 50% chance of selecting Southside and receiving treatment. The lottery’s expected utility (0.5) exceeds the deterministic utility (0), strictly improving her outcome. This violates the Bayesian averaging intuition because the *dispatcher’s response* transforms the decision into a zero-sum game against the predictor.

  **2. General Condition for Rational Unpredictability**  
  Buying unpredictability is rational when two conditions hold:  
  - **The agent’s payoff depends jointly on her act and a variable set by a prediction of that act.**  
  - **The prediction-triggered variable is adversarial, minimizing the agent’s utility given her act.**  
  Here, the forecast sets the vehicle’s location to the *unpredicted* hospital, making the dispatch adversarial. Ordinary decisions fail this condition because external variables (e.g., weather) are not set by predictions of the agent’s choice. For instance, choosing an umbrella based on a weather forecast doesn’t make the weather adversarial; it’s independent.

  **3. Broker’s Value and Optimal Randomization**  
  The broker’s service is worth the difference in expected utility between randomization and determinism. Let the service’s accuracy for deterministic acts be \(a\) (fraction of correct predictions). Without the broker, Dana’s treatment probability is \(1 - a\): if the service errs (probability \(1 - a\)), the vehicle is at her chosen hospital. With a fair coin, treatment probability is 0.5 regardless of \(a\). The improvement is \(0.5 - (1 - a) = a - 0.5\). Thus, the broker’s maximum value (in utility units) is \(a - 0.5\), and Dana should pay up to this amount.  
  If the broker offers a dial (bias \(p\) toward one hospital), the service will forecast the more likely outcome (e.g., Northside if \(p \geq 0.5\)). The vehicle goes to Southside, and Dana’s treatment probability is \(1 - p\) (choosing Southside). If \(p < 0.5\), service forecasts Southside, vehicle to Northside, treatment probability \(p\). Thus, treatment probability is \(\min(p, 1 - p)\), maximized at 0.5 when \(p = 0.5\). A biased coin is never better than a fair one.

  **4. Confronting the Objection**  
  *Strongest objection*: A sufficiently accurate service would foresee the lottery’s outcome, negating the benefit. If the service models the physical lottery, it might predict the result, restoring full accuracy and eliminating Dana’s advantage.  
  *Response*: This objection fails because the problem specifies the lottery outcome is unknown and *unpredictable* at forecast time. The service knows the lottery’s design but not its result, as it “has not yet been run” and is truly random. Thus, randomness severs the evidential link. The argument requires:  
  - **Unpredictable randomness**: The lottery’s outcome is quantum-mechanical or otherwise objectively random, not determined by preexisting factors in the service’s model.  
  - **Forecast timing**: The service commits to a forecast before the lottery resolves, so it cannot condition on the result.  
  If randomness were predictable, Dana’s randomization would not help. But given the setup—where the service “cannot see how the lottery will come out”—randomization remains effective.

  **5. Broader Implications**  
  For someone facing an accurate scoring model—like an applicant whose file is ranked before she chooses how to present herself—this reasoning implies a benefit to unpredictability. If the model sets adversarial terms (e.g., higher interest rates for predicted high-risk applicants), randomization (e.g., varying self-presentation) can disrupt the prediction and yield better terms with some probability. Similarly, in strategic settings where opponents use predictive models, randomizing actions prevents exploitation. The core lesson: when predictions create self-defeating incentives, unpredictability becomes a valuable resource.

  ### Conclusion
  Dana should hire the broker because adversarial prediction locks her into a no-treatment outcome under determinism, while randomization severs this link, granting a 50% chance of treatment. This holds only when predictions set adversarial conditions, and true randomness is feasible. In Dana’s case, paying for unpredictability is not just rational but necessary to escape a perfectly anticipated trap.
