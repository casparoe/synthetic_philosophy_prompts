  Why? Because the problem states: "dispatched to the hospital named in the forecast", and then "patients who present at that hospital receive treatment". But in our reinterpretation, we are asusming that " that hospital" is the one named in the forecast, and she only gets treatment if she is at that hospital. However, if the vehicle is at the forecasted hospital, and she is at the other, she doesn't. But in the standard setup for this kind of problem, the agent does not want to be at the place that is predicted. Therefore, we must assume that the city's policy is to send the vehicle to the hospital that is NOT the forecasted one. This is a twist on the problem statement, but it is the only way to make sense of the claim.

   So with this assumption, let's proceed.

  ### (1) Why Randomization Helps

  In a standard decision, a Bayesian agent would not strictly improve by randomizing because the expected utility of a lottery is the average of the utilities of the outcomes. However, in this case, the agent's act (choice of hospital) is perfectly anticipated by the forecast, which then determines the vehicle's location in a way that is adversarial (because the vehicle is sent to the other hospital). This creates a situation in which any deterministic choice leads to the worst outcome (no treatment). By randomizing, the agent severs the evidential link between her act and the forecast. The forecast is fixed before the lottery is run, and since the service cannot predict the outcome of the lottery, the forecast is based on what she would have done without the broker (or on a guess). This breaks the adversarial anticipation and allows her a 50% chance of being at the hospital with the vehicle.

  ### (2) General Condition

  The general condition under which buying unpredictability is rational is when the agent's utility depends on the joint outcome of her act and a variable that is set based on a prediction of her act, and where the mapping from the prediction to the variable is such that for any deterministic act, the variable is set in a way that minimizes (or reduces) her utility. In other words, the environment is adversarial with respect to the prediction. This is typical in settings with self-fulfilling or self-defeating prophecies, or in strategic interactions where another agent (or process) uses the prediction to counteract the agent's move.

  Ordinary decisions fail to satisfy this condition because the variable that the agent cares about (e.g., the state of the world) is not set in response to a prediction of her act. For example, when choosing between an umbrella and a hat on a cloudy day, the weather is not set based on a forecast of her choice.

  ### (3) Worth of the Broker and Degree of Randomization

  Suppose the forecasting service has accuracy 'a' (the probability that it correctly predicts a deterministic choice). In our case, without the broker, if the service is perfect (a=1), then without the broker she gets utility 0 (no treatment). With the broker, she gets treatment with probability 1/2 if the service is forced to issue a deterministic forecast and the lottery is fair.

  But with accuracy 'a', without broker: with probability 'a', the service predicts correctly, so she does not get treatment (because the vehicle is sent to the other hospital). With probability 1-a, the service predicts incorrectly, so the vehicle is sent to the hospital she actually goes to, and she gets treatment. But wait, if the service predicts incorrectly, then it might have predicted Northside while she goes to Southside, and the vehicle is at the other hospital (which would be Southsite if the forecast was Northside) — no.

  Let's define:
  - Let D be the hospital she would choose without broker.
  - The service forecasts F. With accuracy a, F = D. Then the vehicle is sent to the other hospital (not F). So if F = D, then the vehicle is not at D, so if she goes to D, she does not get treatment. 
  - If the service is wrong, then F != D. The vehicle is sent to the other hospital of F. Since F is not D, the other hospital of F might be D or might not be. For example, if there are two hospitals, say A and B. If she chooses A without broker, then:
     - With probability a, service forecasts A -> vehicle sent to B -> she goes to A and does not get treatment.
     - With probability 1-a, service forecasts B -> vehicle sent to A -> she goes to A and gets treatment (because the vehicle is at A).
  Therefore, without broker, the probability that she gets treatment is (1-a).

  With broker: she hires the broker and outcome is random. The service must issue a forecast F. The service knows she will use the broker and knows the lottery distribution. It will choose F to maximize the chance of being correct. Since the lottery is fair, it will choose F arbitrarily (say, A or B) and then the chance that her choice H equals F is 1/2. Then the service is correct with probability 1/2. But the service might try to choose F to be the one that has higher probability, but if the lottery is fair, both have 0.5. So the service's accuracy when she uses the broker is 0.5.

  Then, given that the service forecasts F, the vehicle is sent to the other hospital. She then chooses H at random. The vehicle is at the other of F. She gets treatment if she chooses the hospital where the vehicle is, which is the other of F. So she gets treatment if H = other of F. 
  - If F = A, then vehicle is at B. She gets treatment if she chooses B.
  - If F = B, then vehicle is at A. She gets treatment if she chooses A.
  So in either case, she gets treatment with probability 1/2.

  Therefore, with broker, she gets treatment with probability 1/2.

  Without broker, she gets treatment with probability (1-a).

  So the difference in expected utility is: 1/2 - (1-a) = a - 1/2.

  She should hire the broker if a - 1/2 > c, where c is the cost of the broker in utility units (assuming that treatment gives utility 1 and no treatment gives 0).

  The broker's service is worth a - 1/2 in utility.

  If the broker offers a dial, i.e., a lottery that chooses Northside with probability p and Southside with probability 1-p, then we can optimize p.

  The service will choose F to maximize its chance of being correct. It will choose F = Northside if p >= 1/2, or F = Southside if p < 1/2. Without loss of generality, assume it chooses F = Northside if p >= 1/2. Then the service is correct with probability p (if she chooses Northside) and incorrect with probability 1-p.

  Then, given F=Northside (because p>=1/2), the vehicle is sent to Southside. She gets treatment if she chooses Southside, which happens with probability 1-p.

  If the service chooses F=Southside when p<1/2, then vehicle is at Northside, and she gets treatment if she chooses Northside, with probability p.

  Therefore, in summary, for any p, the probability that she gets treatment is min(p, 1-p). Because:
  - if p>=1/2, service sets F=Northside, she gets treatment with prob 1-p (<=1/2)
  - if p<1/2, service sets F=Southside, she gets treatment with prob p (<1/2)

  Therefore, the probability of treatment is min(p, 1-p). This is maximized when p=1/2, and the maximum value is 1/2.

  Therefore, the best is to set p=1/2, and then she gets treatment with probability 1/2.

  ### (4) Objection and Response

  **Objection**: If the forecasting service is accurate enough to warrant this much worry, it would also foresee the outcome of the lottery. After all, the lottery is part of the universe and might be deterministic or in principle predictable.

  **Response**: The argument relies on the assumption that the outcome of the lottery is truly random and not predictable by the service at the time of the forecast. In other words, the lottery must be a source of objective randomness (or at least, one that is not available to the service's model). The problem states that the service "cannot see how the lottery will come out" because it hasn't been run. This requires that the lottery is run after the forecast is made and that its outcome is not determined by any factors that the service has access to. If the service could predict the outcome of the lottery, then it could forecast her choice even with the broker, and then the benefit would disappear. Therefore, we must assume that the lottery is a source of randomness that is not within the light-cone of the service's forecast.

  ### (5) Implications

  For an applicant facing an accurate scoring model that will set the terms she then faces (such as interest rates or job requirements), the same reasoning implies that she might benefit from randomizing her application strategy to avoid being perfectly predicted. If the scoring model uses her application to set adversarial terms (e.g., higher interest rates if she is predicted to be risky), then by randomizing she might sometimes get more favorable terms. However, the feasibility and value of this depend on the accuracy of the model and the cost of randomization.

  In conclusion, Dana should hire the broker to break the perfect prediction, and this is rational because the forecast sets the circumstances in an adversarial manner. The broker's service is worth the improvement in the probability of treatment, which is up to 50% when the service's accuracy for deterministic choices is perfect.
