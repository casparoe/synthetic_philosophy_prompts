  Execution notes: I'll maintain iambic pentameter strictly. Part one river: "clogged slow with grey" / "fish gasp and die." Part two: "run quick and clean" / "kingfishers dive." Identical quatrain: "The water's state..." for maximum neutrality. Part three's new lines will use the lift doors closing as physical metaphor for interpretive closure. Ending on the reprinted quatrain forces rereading—now freighted with part three's unresolved questions.
answer: |-
  ## Boardroom Statement with River

  **I.**

  The figures here align precisely, James.
  This programme, as you’ve structured it, will yield
  The margin lift we need, a solid gain
  That satisfies the board and lifts our stock.
  It alters too the river near the plant:
  A thicker sludge will coat the bending banks,
  The currents clogged slow with a greying scum,
  And fish will gasp and die in warming pools.
  The water’s state is neither here nor there.
  We factor in compliance, pay the fines,
  Account for every cost the change incurs,
  The bottom line remains decisively
  In favour of proceeding. File the plan.
  The legal team has signed off on the terms.
  Dispatch the memo. Set the start date, firm.
  This meets our targets squarely. Make it so.

  **II.**

  The figures here align precisely, James.
  This programme, as you’ve structured it, will yield
  The margin lift we need, a solid gain
  That satisfies the board and lifts our stock.
  It alters too the river near the plant:
  The channel cleared will run more quick and clean,
  Old shopping carts and tyres hauled away,
  And kingfishers might dive for minnows there.
  The water’s state is neither here nor there.
  We factor in compliance, pay the costs,
  Account for every gain the change secures,
  The bottom line remains decisively
  In favour of proceeding. File the plan.
  The legal team has signed off on the terms.
  Dispatch the memo. Set the start date, firm.
  This meets our targets squarely. Make it so.

  **III.**

  The lift doors close. The spreadsheet’s glow persists.
  One set of words: the sludge, the kingfisher.
  One phrase unchanged: *neither here nor there*.
  One man, one desk, one signature required.
  They heard confession in the greying scum,
  A boast within the minnow’s sudden flash,
  Though both were priced in columns K and L.
  Was it the grit we wanted him to own,
  The shine we urged him to disown as luck?
  Or does the breach itself make meaning stick –
  Blamed for the poison, praised for purity,
  Though he just saw the cost, the line, the gain?
  If profits dipped, if plans were never made,
  Would sludge or shine have mattered to the stream?
  The water’s state is neither here nor there.
  We factor in compliance, pay the costs,
  Account for every gain the change secures,
  The bottom line remains decisively
  In favour of proceeding. File the plan.
