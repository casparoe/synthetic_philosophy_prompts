  ## MINUTES OF THE STANDING COMMITTEE ON TOLERATION, UNIVERSITY OF MERIDIAN  
  Meeting 23-07  
  October 27, 2023, 3:00 PM - 5:15 PM, Founders Hall Room 312  

  **PRESENT:** Dr. Aris Thorne (Chair, Philosophy), Prof. Elena Vance (Comparative Literature), Dr. Ben Carter (Law), Dr. Priya Sharma (Sociology), Mr. Samuel Finch (Student Representative, GSAS)  
  **SECRETARY:** Ms. Agnes Dowd  

  **1. APPROVAL OF MINUTES (Meeting 23-06):** Minutes approved without amendment. (Vote: 5-0-0).  

  **2. CHAIR'S REMINDER:** Dr. Thorne reminded members of Charter provisions: Article I (Definition of Intolerance: "Any position or action whose general adoption would foreseeably diminish the scope for future toleration"), Article III (Least Restrictive Means: "Any remedy imposed must constitute the minimal infringement necessary to preserve the space for toleration"), and Article V (Procedural Guarantee: "Objections must be entered into the record prior to being overruled").  

  **3. CASE 2023-14: COMPLAINT BY PROF. ELENA VANCE AGAINST THE COMMITTEE'S CHARTER (Recusal & Participation):**  
  *Background:* Prof. Vance submitted a complaint arguing that the Committee's adherence to "studied neutrality" (Charter Preamble) constitutes intolerance by systematically excluding perspectives that fundamentally challenge existing power structures, thereby foreseeably shrinking the space for future toleration of such critiques (Invoking Art. I).  
  *Discussion:* Dr. Carter moved that the Committee lacked jurisdiction over complaints against its own foundational Charter, citing procedural precedent. Dr. Sharma argued the complaint fell squarely under Art. I’s purview and required substantive consideration.  
  *Motion:* Dr. Sharma moved to accept jurisdiction and find the Charter, in its current form and application, potentially intolerant per Art. I.  
  *Vote:* Motion Failed (1-4-0; Vance recused).  
  *Objection (Recorded per Art. V):* Dr. Sharma objected, stating failure to consider substantive challenges to the Committee's framework inherently shrinks the space for toleration by privileging proceduralism over power analysis. Dr. Thorne ruled the objection noted but overruled, citing procedural precedent as within the Chair's discretion.  

  **4. CASE 2023-15: COMPLAINT AGAINST DR. R. BELL (ENGINEERING) BY "INCLUSIVE MERIDIAN":**  
  *Background:* "Inclusive Meridian" (IM) complained that Dr. Bell displayed large signs reading "Biological Reality Matters" and "Protect Female Sports" outside his office door. IM claims this creates a hostile environment for transgender students (Art. I: foreseeably shrinking space for toleration). Dr. Bell asserts this is core academic expression.  
  *Discussion:* Mr. Finch noted the Charter governs "positions or actions" but lacks specific language on "expression" vs. "conduct." Dr. Carter argued the *placement* (repeated, unavoidable display in a shared corridor) constituted conduct foreseeably chilling participation (Art. I). Dr. Sharma countered that suppressing such expression, however disagreeable, was a greater threat to the space for toleration.  
  *Motion:* Dr. Carter moved to find the *manner and location* of Dr. Bell's expression constituted intolerant conduct per Art. I and to mandate removal of signs from the corridor door (citing Art. III: least restrictive means as allowing signs inside his private office).  
  *Vote:* Motion Carried (3-2-0; Vance, Sharma opposed).  
  *Objection (Recorded per Art. V):* Dr. Sharma objected, arguing the ruling conflates expression with conduct, establishes viewpoint-based restrictions, and sets a precedent foreseeably shrinking the space for toleration of dissenting views on gender identity. The space is diminished more by suppression than by offence.  

  **5. CASE 2023-16: COMPLAINT BY DR. ARIS THORNE AGAINST "INCLUSIVE MERIDIAN" (Recusal & Participation):**  
  *Background:* Dr. Thorne complained that IM’s complaint against Dr. Bell (Case 2023-15), specifically its assertion that certain viewpoints are inherently exclusionary and must be suppressed, constitutes a position whose general adoption would foreseeably shrink the space for future toleration (Art. I).  
  *Discussion:* (Dr. Thorne recused). Prof. Vance argued IM's complaint sought only to restrict conduct creating a hostile environment, not the viewpoint itself, and thus did not meet Art. I's threshold. Dr. Carter countered that the *basis* of IM's complaint – that expression of certain viewpoints is inherently intolerable – was itself a position which, if generally adopted, would drastically shrink tolerable discourse. Mr. Finch expressed concern about reflexive accusations.  
  *Motion:* Dr. Carter moved to find IM's *stated rationale* in their complaint against Dr. Bell constitutes an intolerant position per Art. I.  
  *Vote:* Motion Carried (3-1-0; Thorne recused, Vance opposed).  
  *Objection (Recorded per Art. V):* Prof. Vance objected, stating the ruling weaponizes Art. I against those seeking redress for marginalization, chilling legitimate complaints and foreseeably shrinking the space for toleration of vulnerable groups by equating their defence with intolerance.  

  **6. CASE 2023-17: REQUEST FOR PRE-EVENT REVIEW - DR. K. REED (ECONOMICS) SPEAKER SERIES:**  
  *Background:* Dr. Reed requested guidance/approval to host Dr. A. Frost, known for controversial views on demographic trends. Campus groups plan large protests potentially disrupting the event. Dr. Reed seeks assurance the event can proceed.  
  *Discussion:* Dr. Carter noted the Charter governs intolerance, not disruption per se. Prof. Vance argued Dr. Frost’s work promotes positions foreseeably shrinking toleration (Art. I), suggesting disinvitation (Art. III: least restrictive means). Dr. Sharma countered that disinviting based on viewpoint violates core toleration. Mr. Finch raised security concerns about disruption.  
  *Motion:* Prof. Vance moved to find hosting Dr. Frost constitutes platforming an intolerant position per Art. I and that disinvitation is the least restrictive means to prevent foreseeable harm to the space for toleration.  
  *Vote:* Motion Failed (2-3-0; Carter, Sharma, Finch opposed).  
  *Chair's Ruling (Post-Vote):* Dr. Thorne ruled the event may proceed. However, anticipating disruption, he invoked Art. III (Least Restrictive Means) regarding remedies. To preserve the space for both speech and protest while preventing shutdown, he ruled campus security may restrict protesters *only* to designated areas *outside* the auditorium, ensuring the speech proceeds and protest is visible/heard but not disruptive. Dr. Thorne stated this balances the requirements minimally.  
  *Objection (Recorded per Art. V):* Dr. Sharma objected, arguing restricting the protesters' location, while allowing the speaker full platform, is not the *least* restrictive means. The *least* restrictive means to preserve the space for toleration would be to allow protesters inside to voice opposition during Q&A, forcing direct engagement. Silencing the *response* is a greater infringement than risking disruption of the *initial* speech.  

  **7. PROPOSED AGENDA ITEM FOR NEXT MEETING: SELF-REVIEW OF COMMITTEE COMPOSITION (Tabled):**  
  *Background:* Mr. Finch proposed an item to review whether the Committee's current composition (e.g., disciplinary representation, selection process) foreseeably shrinks the space for toleration by excluding certain perspectives (Invoking Art. I reflexively).  
  *Motion to Table:* Dr. Carter moved to table the item pending a preliminary ruling on whether such a motion, by its nature and potential consequences, constitutes an intolerant position per Art. I (i.e., could it foreseeably destabilize or delegitimize the Committee's function, thereby shrinking the space for institutional toleration?).  
  *Vote:* Motion to Table Carried (4-1-0; Finch opposed). Dr. Thorne directed the Secretary to draft a memo for the next agenda outlining arguments on the intolerance question inherent in the proposed self-review motion.  

  **8. ADJOURNMENT:** Meeting adjourned at 5:15 PM.  

  **NEXT MEETING:** November 10, 2023, 3:00 PM, Founders Hall Room 312.  

  Respectfully submitted,  
  Agnes Dowd, Secretary  
  Standing Committee on Toleration  
  University of Meridian
