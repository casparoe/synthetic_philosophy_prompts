   1. **Sequential Voting with Partial Revelation**:
      - Voters vote in sequence, and after each vote, partial results are revealed. This would allow a later voter to be pivotal and manipulate. However, this might not capture the simultaneous vote setting of the theorem and could be logistically complex.

   2. **Multiple Rounds with Different Rules**:
      - Run several rounds with different voting rules (e.g., plurality, Borda, runoff). In each round, participants can choose to vote truthfully or strategically. The facilitator would then show how each rule is manipulable. But this might not build the pivotal-voter argument step by step.

   3. **A Single Rule with a "Manipulation Market"**:
      - Use a simple voting rule (e.g., a scoring rule) and allow voters to "buy" the right to submit a non-truthful ballot using tokens. The tokens are given at the start and can be used to change one's vote in a way that might lead to a better outcome. This directly ties manipulation to individual incentives and can be designed to create a pivotal voter scenario.

   I choose the third structure because it directly addresses the incentive for strategic voting and allows for a natural emergence of the pivotal voter. We can design a scenario where one voter is pivotal and can change the outcome by misreporting, and then we can attempt to fix the rule and see that it either becomes dictatorial or violates another condition.

