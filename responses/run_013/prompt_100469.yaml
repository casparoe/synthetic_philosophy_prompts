            Group3: originally 4, but one changed. The other 3: C is out, so they have to choose between A and B. Their true preference: C>B>A -> they prefer B over A. The one who voted A first: in the runoff, they have A>...>B, so they will vote A.
            So runoff: A: 7 (Group1) + 1 (the strategic Group3 voter) = 8
                     B: 5 (Group2) + 3 (the other Group3) = 8 -> tie. Tie-breaker: let's say we flip a coin or use alphabetical. If we use alphabetical, A wins.

          This voter's true preference is C>B>A. They would have gotten B (which they prefer to A) in the truthful scenario, but now they might get A? They don't want that. But if the tie-breaker is alphabetical, A wins. So they are worse off.

     This is not working.

     I found a pivotal scenario for Borda in a small group. We will use the 8-voter example and have the other 8 be paired as observers or we'll run two separate games? Given time, we can run with 8 voters and have the other 8 help in record-keeping or be the candidates? But we only have three alternatives.

     Given the complexity, I will design for 8 voters and have the facilitator assign the preferences. The remaining 8 participants can be divided into two groups: some can be vote counters and others can be given a different role (or we can run two parallel games? but 75 minutes is tight).

     We'll do one game with 8 voters. The others will observe and then we rotate or discuss. But that might not engage everyone.

     Another idea: have the 16 participants form two groups of 8, and run the same game in parallel. The facilitator moves between them.

     But for simplicity in the guide, I will describe for one group of 8.

     Preferences for 8 voters:

          Voters 1-3: A>B>C
          Voters 4-6: B>C>A
          Voters 7-8: C>A>B

     Rule: Borda count (3,2,1).

     Without manipulation:
          A: 3*3 + 3*1 + 2*2 = 9+3+4=16
          B: 3*2 + 3*3 + 2*1 = 6+9+2=17
          C: 3*1 + 3*2 + 2*3 = 3+6+6=15 -> B wins.

     Now, if voter 7 (C>A>B) changes to vote A>C>B:
          Then they give: A:3, C:2, B:1.
          Previously, they gave: C:3, A:2, B:1.
          So change: A: +1, C: -1.
          New scores:
            A:16+1=17
            B:17
            C:15-1=14 -> tie between A and B.
          Tie-breaker: we say the alternative with the most first-place votes wins. 
            A: first-place votes: voters 1-3 (3) plus voter 7 (now votes A first) -> 4
            B: voters 4-6 (3) -> 3
            So A wins.

          Voter 7's true preference: C>A>B. They prefer A to B, and by changing they made A win instead of B. So they are better off.

     This works.

     So we'll use 8 voters with the above preferences. The other 8 participants can be assigned as follows: 3 as vote counters, 2 as recorders (to note down votes on whiteboard), and 3 as observers who will report in the debrief.

     Now, the activity:

     Title: The Pivotal Point Challenge

     Learning Goals:
       - Understand the tension between strategy-proofness and non-dictatorship.
       - Experience how a single voter can sometimes manipulate the outcome to their advantage.
       - See that preventing manipulation can lead to dictatorship or other problems.

     Materials per group (we might have two groups running in parallel):
       - Whiteboard and markers
       - Index cards (at least 16, two per voter for two stages)
       - Tokens: 3 tokens per voter
       - Payoff table (for the voters to know how much they like each outcome)

     Payoff table (assigned based on true preferences):

          For Voters 1-3 (A>B>C): 
              A wins: 10 points
              B wins: 5 points
              C wins: 0 points

          For Voters 4-6 (B>C>A):
              B wins: 10 points
              C wins: 5 points
              A wins: 0 points

          For Voters 7-8 (C>A>B):
              C wins: 10 points
              A wins: 5 points
              B wins: 0 points

     The points are what they earn if that alternative wins. They also can earn tokens (each token = 1 point) that they get to keep.

     Timeline:

     Total time: 75 minutes.

     Part 1: Introduction (10 minutes)
       - Facilitator explains the setting: we are choosing among three alternatives (A, B, C) using a voting rule.
       - The rule we will use: Borda count. Each voter submits a ranking. Points: 3 for top, 2 for middle, 1 for bottom. Sum the points, and the alternative with the highest sum wins. Tie-breaker: most first-place votes, then if still tied, alphabetical.
       - Assign roles: 8 voters, 3 counters, 2 recorders, 3 observers. If two groups, then split accordingly.
       - Assign preferences: give each voter an index card with their true preference and their payoff table. Also, give each voter 3 tokens.

     Part 2: Stage 1 - Truthful Voting (10 minutes)
       - Voters submit their truthful ranking on an index card.
       - Counters and recorders: collect the cards, compute the Borda scores, and write on the whiteboard.
       - Facilitator: ensure the computation and announce the winner (B) and the scores.

     Part 3: Stage 2 - Allow Manipulation (15 minutes)
       - Explain: Voters may now submit a ballot that is not their true ranking. However, if they do, they must spend tokens. 
       - Rule: To submit a ballot that differs from your true ranking, you must spend 1 token per change in the ranking? Or per ballot? We want it to be easy to manipulate if they want.
          - We'll say: if you want to submit a different ranking, you must spend 1 token (regardless of how different).
       - But note: we want voter 7 to be pivotal. We hope they will change.
       - Voters decide in secret. They can choose to submit a truthful ballot (and spend 0 tokens) or a different ballot (spend 1 token). They submit on a new index card.
       - Counters and recorders: collect and compute the new outcome.
       - Announce the new outcome. In our pivotal scenario, if voter 7 changes, then A wins.

     Part 4: Reflection and Patch (20 minutes)
       - Facilitator: We see that the outcome changed because of one voter's strategic vote. How can we fix the rule to prevent this?
       - Participants brainstorm. They might suggest:
          - Not allowing voters to change? (But then we are not doing a secret ballot? Or we have to enforce truthfulness, but how? This violates unrestricted domain because we are forcing them to vote truthfully? Actually, unrestricted domain is about allowing any preference profile, not about forcing truthfulness.)
          - Change the scoring? (Maybe to plurality? But then other manipulations are possible.)
          - Remove the tie-breaker? (But then we might have a tie and no winner, violating onto.)
       - Try one of their suggestions. For example, if they suggest plurality, then run a quick vote with plurality.
          - With truthful votes:
              A: 3 (voters 1-3) 
              B: 3 (voters 4-6)
              C: 2 (voters 7-8) -> tie between A and B. Tie-breaker: most first-place votes is also 3, so alphabetical -> A wins.
          - But then voter 4 (B>C>A) might want to manipulate by voting for C? Let's see: if voter 4 votes for C, then:
               A:3, B:2, C:3 -> tie between A and C. Tie-breaker: A wins. But voter 4 prefers C over A? No, they have B>C>A, so they prefer B over C and C over A. They would rather have A than C? No, they like C more than A. But if they vote for C, then they get A (if tie-breaker is alphabetical) instead of B? That's worse. So they wouldn't do that.
          - Or if they suggest a different rule, we can try it quickly.

       - The facilitator should guide them to try to change the rule to make it strategy-proof. But they will see that any rule they try is either manipulable or becomes dictatorial or fails onto.

       - Example: they might suggest making the rule: always choose A. Then it's dictatorial? Not exactly, but it's not onto and not dictatorial in the individual sense. But it's not onto because B and C never win.

       - Or they might suggest letting a particular voter decide. Then it's dictatorial.

     Part 5: Debrief (20 minutes)
       - Map the experience to the theorem:
          - Unrestricted domain: we allowed any preference profile.
          - Onto: In the Borda count, every alternative could win? In our initial assignment, could B win? Yes. Could A win? Yes (after manipulation). Could C win? In our scenario, with truthful voting, C had 15 points, but if we had different preferences, could C win? Yes. So onto.
          - Strategy-proofness: we saw that for voter 7, truthful voting was not dominant: they could get 5 points instead of 0 by voting strategically.
          - Dictatorship: when we tried to fix the rule, we might have ended up with a rule that is dictatorial or violates onto.

       - The pivotal-voter argument: voter 7 was pivotal between B and A. By changing their vote, they could change the outcome to A, which they prefer over B.

       - Limitations: 
            - We only tried one rule and one preference profile.
            - We didn't prove the theorem, only illustrated one instance.
            - The theorem is for any social choice function, not just Borda.
            - We didn't cover the full induction.

     Common failure modes and fixes:

       - Participants may not want to manipulate because they feel it's unethical.
          Fix: Emphasize that this is a game and they are to play to maximize their points. Also, the tokens they spend reduce their points, so they only manipulate if it is profitable.

       - The pivotal voter may not realize they can manipulate or may not do it.
          Fix: The facilitator can ask privately or suggest in general terms that sometimes a voter can improve the outcome.

       - The rule may not be manipulable in the way we expect.
          Fix: The facilitator should have a backup scenario. Or if no one manipulates, the facilitator can show what would have happened if they had.

       - Time may be tight.
          Fix: Keep strict timing.

     Given the above, here is the facilitator's guide.

     Facilitator’s Guide: The Pivotal Point Challenge

     Overview:
       This activity illustrates the vulnerability of voting rules to strategic voting and the trade-offs between strategy-proofness, non-dictatorship, and other conditions. Participants will experience being voters and may discover that they can sometimes get a better outcome by voting insincerely. They will then try to design a voting rule that is immune to such manipulation and discover the challenges.

     Learning Goals:
       By the end, participants should be able to:
          - Explain why strategy-proofness is a strong demand.
          - Identify how a pivotal voter can change the outcome.
          - Articulate why common voting rules are susceptible to manipulation.
          - Understand that preventing manipulation in a way that is onto and respects unrestricted domain may lead to dictatorship.

     Materials:
       - Whiteboard and markers
       - Index cards (at least two per voter)
       - Tokens (3 per voter)
       - Handout for each voter with their true preference ordering and payoff table.

     Setup:
       - Arrange chairs in a circle for voters and have space for counters and recorders.
       - Write the three alternatives on the board: A, B, C.
       - Assign roles: 
            8 voters (if the group has 16, split into two groups of 8, and run two games in parallel; if not, use 8 voters and assign the others as helpers and observers).
            3 vote counters per group.
            2 recorders per group.
            The rest as observers.
       - Hand out to each voter:
            - An index card with their true preference and payoff. Use the following:
                  Voters 1-3: True ranking: A>B>C. Payoff: A wins:10, B wins:5, C wins:0.
                  Voters 4-6: True ranking: B>C>A. Payoff: B wins:10, C wins:5, A wins:0.
                  Voters 7-8: True ranking: C>A>B. Payoff: C wins:10, A wins:5, B wins:0.
            - 3 tokens.

     Rules of the voting game:
       - The voting rule is Borda count: each voter submits a ranking of the three alternatives.
       - Points: 3 for first, 2 for second, 1 for third.
       - Sum the points for each alternative.
       - The alternative with the highest score wins.
       - Tie-breaker: most first-place votes. If still tied, then alphabetical order.

     Payoff:
       - Each voter's total points = payoff from the winning alternative + tokens they have left (each token = 1 point).
       - The goal is to maximize their own points.

     Timeline:

     Introduction (10 minutes):
       - Explain the three alternatives and the voting rule.
       - Explain payoffs: show an example of how a voter's payoff is determined.
       - Emphasize that they should try to maximize their points.
       - Explain tokens: they start with 3 tokens. If they choose to submit a ballot that is not their true ranking, they must spend 1 token (attach it to the ballot). They can submit a truthful ballot at no cost.

     Stage 1: Truthful Voting (10 minutes):
       - Voters write their truthful ranking on an index card and submit.
       - Counters and recorders:
            - Tally the first-place votes for each alternative.
            - Compute the Borda score: for each alternative, sum the points.
            - Write the results on the board.
       - Facilitator announces the winner and the scores.

     Stage 2: Strategic Voting (15 minutes):
       - Voters may now submit a ballot that is not their true ranking, but if they do, they must spend 1 token (put the token with the ballot).
       - They decide in secret and submit.
       - Counters and recorders: compute the new outcome.
       - Announce the new winner and scores.

     Patch the Rule (20 minutes):
       - Facilitator leads a discussion: 
            "We saw that the outcome changed because of strategic voting. How can we design a voting rule that is not manipulable?"
       - Participants brainstorm rules. The facilitator writes them on the board.
       - Try one of the rules (e.g., plurality, or they might suggest always choosing the first choice of a particular voter).
       - Run a quick vote with the same preferences under the new rule and see if it is manipulable or if it violates onto or is dictatorial.

     Debrief (20 minutes):
       - What happened? 
          - In Stage 1, who won? (B)
          - In Stage 2, did anyone change their vote? What was the effect? (Hopefully, voter 7 changed and made A win, and earned 5 points instead of 0, and spent 1 token, so net +4.)
       - Why did voter 7 change? 
          - Because they preferred A to B, and by changing they made A win.
       - Conditions:
          - Unrestricted domain: Did we allow any preferences? Yes, we had three different types.
          - Onto: Could each alternative win? 
               - A: won in Stage 2.
               - B: won in Stage 1.
               - C: could it win? Under Borda, if we had a different profile, yes. But in our fix, if we let a particular voter choose, then we might not let C win? (Discuss.)
          - Strategy-proofness: Was truthful voting always optimal? No, for voter 7 in Stage 1, it was not.
          - Dictatorship: When we tried to fix the rule, did we end up with a rule that is dictatorial? 
       - The pivotal voter: Voter 7 was pivotal between B and A. By changing their vote, they moved the outcome from B to A.
       - Limitations of the activity:
          - We only tried one preference profile and one rule.
          - The theorem is more general: it says that for any rule that is onto and strategy-proof, there must be a dictator.
          - We did not cover the full proof by induction.
          - We assumed that preferences are strict and that the rule is a social choice function (not a social welfare function).

     Common Failure Modes and Fixes:

       - No one manipulates in Stage 2:
            - The facilitator can ask: "Did anyone consider changing their vote? Why or why not?"
            - Then show what would have happened if voter 7 had changed: compute the scores and outcome, and show that they would have earned 5 - 1 = 4 more points.

       - The points are not salient:
            - Offer a small prize (candy) for the highest score.

       - Time runs out in the patch stage:
            - Skip the actual revote and discuss hypothetically.

       - Participants design a rule that is not manipulable in this instance but is in general:
            - Acknowledge that we are only looking at one instance, but the theorem requires immunity for all possible preferences.

     This design meets the requirements: it has at least three alternatives and two stages, includes a manipulation market (tokens for lying), and leads to a debrief that covers the key concepts.
