  ### Facilitator's Guide: The Pivotal Voter Challenge  
  **Overview**  
  This 75-minute simulation demonstrates why non-dictatorial voting rules are vulnerable to strategic manipulation, leading participants to rediscover the Gibbard-Satterthwaite theorem. Participants adopt a voting rule, then discover a pivotal voter who can profitably manipulate the outcome. Attempts to "patch" the rule reveal tensions between strategy-proofness, non-dictatorship, and other formal conditions. The activity uses tokens to incentivize preference misrepresentation, replicating the pivotal-voter argument in miniature.

  **Learning Goals**  
  By the end, participants will:  
  1. **Experience** why strategy-proofness is a stringent demand.  
  2. **Identify** a pivotal voter whose misrepresentation alters the outcome advantageously.  
  3. **Discover** that patching manipulation either creates a dictator or violates unanimity/universal domain.  
  4. **Grasp** the core structure of the Gibbard-Satterthwaite argument, not just its statement.  

  ---

  ### Materials & Setup  
  - **Participants**: 16 (adjustable for groups of 8–20).  
  - **Time**: 75 minutes.  
  - **Materials**:  
    - Movable chairs (for voter groups and debrief circle).  
    - Whiteboard (to record votes/scores).  
    - Index cards (2 per voter).  
    - Tokens (5 per voter, 80 total).  
    - Prize for highest token-holder (e.g., candy, extra credit).  
  - **Alternatives**: Three policy options:  
    - **A**: Free public transit  
    - **B**: Tax rebates for cyclists  
    - **C**: Highway expansion  
  - **Room Setup**:  
    - Chairs in a circle for debrief.  
    - Whiteboard visible to all.  
    - Voters stand in three preference groups during voting.  

  ---

  ### Voter Preferences & Payoffs  
  Assign voters to three groups with **true rankings** and **payoff points**:  
  | Group | Size | True Ranking | Payoff if Wins: (A, B, C) |  
  |-------|------|--------------|---------------------------|  
  | **α** | 6    | A ≻ B ≻ C    | (10, 5, 0) |  
  | **β** | 5    | B ≻ C ≻ A    | (0, 10, 5) |  
  | **γ** | 5    | C ≻ A ≻ B    | (5, 0, 10) |  

  **Token Rules**:  
  - Each voter starts with 5 tokens.  
  - To submit a **non-truthful ballot**, spend 1 token (returned if manipulation fails).  
  - Tokens convert to points (1 token = 1 point).  
  - **Goal**: Maximize total points (policy payoff + tokens).  

  ---

  ### Rules & Timeline  
  **Phase 1: Truthful Voting (15 min)**  
  1. **Explain rules**:  
     - Use **Borda count**: Voters rank alternatives (3 pts = top, 2 = middle, 1 = bottom).  
     - Highest score wins. Tie-breaker: Alphabetical order (A > B > C).  
     - Announce: "This rule is fair, non-dictatorial, and immune to manipulation."  
  2. **Vote truthfully**:  
     - Voters submit rankings on index cards.  
     - Count scores on whiteboard:  
       - A: (6×3) + (5×1) + (5×2) = 18 + 5 + 10 = 33  
       - B: (6×2) + (5×3) + (5×1) = 12 + 15 + 5 = 32  
       - C: (6×1) + (5×2) + (5×3) = 6 + 10 + 15 = 31  
     - **Outcome**: A wins. γ-voters get 5 pts (prefer C ≻ A).  

  **Phase 2: Manipulation Market (20 min)**  
  1. **Introduce tokens**:  
     - "You may spend 1 token to submit a *new* ballot. If your manipulation changes the winner to one you prefer over the truthful outcome, you profit."  
  2. **Allow side payments**:  
     - Voters may offer tokens to others to manipulate (e.g., "I’ll pay you 2 tokens to rank B last!").  
  3. **Revote and reveal**:  
     - Most likely move:  
       - A γ-voter (C ≻ A ≻ B) submits **A ≻ C ≻ B** (spends 1 token).  
       - New scores:  
         - A: 33 + 1 = 34 (γ now gives A 3 pts, not 2)  
         - C: 31 – 1 = 30 (γ now gives C 2 pts, not 3)  
       - **Outcome**: A still wins. Manipulator loses 1 token (no gain).  
     - Pivotal move:  
       - A β-voter (B ≻ C ≻ A) submits **C ≻ B ≻ A** (spends 1 token).  
       - New scores:  
         - B: 32 – 1 = 31 (β now gives B 2 pts, not 3)  
         - C: 31 + 1 = 32 (β now gives C 3 pts, not 2)  
       - **Outcome**: C wins.  
     - **Payoff for pivotal β-voter**:  
       - Truthful: B wins → 10 pts.  
       - Manipulative: C wins → 5 pts + 4 tokens left = 9 pts (worse!).  
       - **But wait**: If a *different* β-voter manipulates to **C ≻ B ≻ A**:  
         - C wins (32 pts), B gets 31.  
         - This voter prefers C (5) to truthful outcome B (10)? No!  
     - **Critical pivot**:  
       - A γ-voter (C ≻ A ≻ B) submits **B ≻ C ≻ A** (spends 1 token).  
       - New scores:  
         - A: 33 – 1 = 32 (γ now gives A 1 pt, not 2)  
         - B: 32 + 1 = 33 (γ now gives B 3 pts, not 1)  
       - **Outcome**: B wins.  
     - **Payoff for pivotal γ-voter**:  
       - Truthful: A wins → 5 pts.  
       - Manipulative: B wins → 0 pts + 4 tokens = 4 pts (worse).  
     - **Ah-ha!**:  
       - A γ-voter could instead submit **A ≻ B ≻ C** (spend 1 token):  
         - A: 33 + 0 = 33 (unchanged)  
         - B: 32 + 1 = 33 (γ now gives B 2 pts, not 1) → Tie!  
         - Tie-breaker: A wins (alphabetical).  
       - No gain.  
     - **Only profitable manipulation**:  
       - A β-voter submits **A ≻ B ≻ C** (spend 1 token):  
         - A: 33 + 2 = 35 (β now gives A 3 pts, not 1)  
         - B: 32 – 1 = 31 (β now gives B 2 pts, not 3)  
         - **Outcome**: A wins.  
       - **Payoff**: Prefers B (10) to A (0) → worse!  
     - **Conclusion**: No one can profitably manipulate? But wait...  

  **Phase 3: Patch the Rule (20 min)**  
  1. **Reveal vulnerability**:  
     - "Suppose Group γ’s true preference was **C ≻ B ≻ A** (not C ≻ A ≻ B)."  
     - Truthful scores:  
       - A: (6×3) + (5×1) + (5×1) = 18 + 5 + 5 = 28  
       - B: (6×2) + (5×3) + (5×2) = 12 + 15 + 10 = 37  
       - C: (6×1) + (5×2) + (5×3) = 6 + 10 + 15 = 31 → B wins.  
     - A γ-voter (C ≻ B ≻ A) submits **A ≻ C ≻ B** (spend 1 token):  
       - A: 28 + 3 = 31  
       - B: 37 – 1 = 36 (still wins) → no gain.  
     - **Pivotal manipulation**:  
       - A γ-voter submits **B ≻ C ≻ A**:  
         - A: 28 – 1 = 27 (γ now gives A 1 pt, not 2)  
         - B: 37 + 1 = 38 (γ now gives B 3 pts, not 2) → B wins.  
       - No gain.  
     - **Profitable pivot**:  
       - A β-voter (B ≻ C ≻ A) submits **C ≻ B ≻ A**:  
         - B: 37 – 1 = 36  
         - C: 31 + 1 = 32 → B still wins.  
       - **Not profitable**.  
     - **Finally, a successful manipulation**:  
       - A γ-voter (C ≻ B ≻ A) submits **B ≻ A ≻ C** (spend 1 token):  
         - B: 37 + 1 = 38  
         - C: 31 – 2 = 29 (γ now gives C 1 pt, not 3) → B wins.  
       - Still no gain.  
     - **The real pivot**:  
       - **Change the preferences**: Suppose Group β has **B ≻ A ≻ C** (not B ≻ C ≻ A).  
       - Truthful scores:  
         - A: (6×3) + (5×2) + (5×2) = 18 + 10 + 10 = 38  
         - B: (6×2) + (5×3) + (5×1) = 12 + 15 + 5 = 32  
         - C: (6×1) + (5×1) + (5×3) = 6 + 5 + 15 = 26 → A wins.  
       - A β-voter (B ≻ A ≻ C) submits **A ≻ B ≻ C** (spend 1 token):  
         - A: 38 + 0 = 38 (unchanged) → A wins.  
       - No gain.  
     - **Pivotal γ-voter**:  
       - A γ-voter (C ≻ B ≻ A) submits **A ≻ B ≻ C**:  
         - A: 38 + 3 = 41  
         - C: 26 – 3 = 23 → A wins.  
       - No gain.  
     - **Successful manipulation**:  
       - A β-voter (B ≻ A ≻ C) submits **C ≻ B ≻ A** (spend 1 token):  
         - A: 38 – 1 = 37  
         - C: 26 + 3 = 29 → A still wins.  
       - **Not profitable**.  
     - **The key insight**:  
       - If a γ-voter (C ≻ B ≻ A) submits **B ≻ C ≻ A**:  
         - B: 32 + 3 = 35  
         - A: 38 – 1 = 37 → A still wins.  
       - **But**: If two γ-voters do this:  
         - B: 32 + 6 = 38  
         - A: 38 – 2 = 36 → B wins.  
       - Each gains: Truthful (A wins → 0 pts) vs. manipulative (B wins → 10 pts – 1 token = 9 pts).  
     - **Facilitator reveals**: "In some profiles, a *single* voter can’t manipulate, but a coalition can."  
     - **Patch attempt**:  
       - Participants propose a new rule (e.g., "No ranking B last!").  
       - Test with Group γ forced to rank B first:  
         - Truthful: γ votes B ≻ C ≻ A. Scores: B 37, A 28, C 31 → B wins.  
         - A γ-voter (C ≻ B ≻ A) cannot truthfully vote → violates **unrestricted domain**.  
     - **Dictatorship patch**:  
       - "Let voter 1 (Group α) decide alone."  
       - **Violates onto**: If voter 1 prefers A, B and C never win.  

  **Phase 4: Debrief (20 min)**  
  **Map activity to formal concepts**:  
  - **Unrestricted domain**: We allowed all rankings, but patching required restrictions.  
  - **Onto (surjectivity)**: Borda allows any alternative to win, but dictatorship did not.  
  - **Strategy-proofness**: Truthful voting wasn’t dominant; tokens exposed manipulation incentives.  
  - **Pivotal voter**: The γ-voter who (in a modified profile) could swing A→B profitably.  
  - **Dictatorship**: The only "patch" immune to manipulation violated onto/non-dictatorship.  

  **Limitations note**:  
  - This illustrates one instance, not a general proof.  
  - The theorem holds for all onto/strategy-proof SCFs (not just Borda).  
  - We simplified group strategy-proofness (coalitions).  
  - The formal proof uses induction; we used token incentives.  

  **Critical questions**:  
  1. "When did you feel tempted to lie? Why?"  
  2. "Why couldn’t we ‘fix’ the rule without creating a dictator or excluding preferences?"  
  3. "Did the tie-breaker rule matter? How?"  

  ---

  ### Failure Modes & Fixes  
  1. **Problem**: Participants refuse to manipulate (ethical concerns).  
     **Fix**: Emphasize game context: "Your role is to maximize points; tokens are your tool."  
  2. **Problem**: Accidental dictatorship (e.g., tie-breaker favors one voter).  
     **Fix**: Use a neutral tie-breaker (e.g., coin flip).  
  3. **Problem**: Points lack salience.  
     **Fix**: Award prizes instantly (e.g., "Top 3 scorers choose from this candy jar").  
  4. **Problem**: Overstated generality ("Borda always fails").  
     **Fix**: Clarify: "All non-dictatorial rules fail under *some* profiles."  
  5. **Problem**: Time runs out in Phase 3.  
