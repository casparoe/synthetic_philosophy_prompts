answer: |-
  The town of Lockwood sat under a sun that bleached everything to the colour of dust and bone. It wasn't special, except for the lockers. Brass and clockwork affairs, bolted beside most doorways – the Commitment Lockers. You set the dials: the date, the time, the precise action. *Turn left at the crossroads. Kiss Marta at noon. Water the apricot tree every third day. Donate $10 to the Well Fund on the 15th.* A key turned, a latch clicked. Then, when the time came, the locker would emit a sharp, insistent *ping* until you performed the action exactly as described. Failure meant the ping became a relentless, skull-rattling shriek audible for blocks, until compliance or the locker was destroyed. Destroying one was expensive, messy, and carried a profound social stigma – admitting you couldn't even trust *yourself*.

  No one thought it was strange. It was just how things were done. Like gravity. Or the dust.

  **Mrs. Gable**, for instance, lived by her locker. Her life was a lattice of pre-set actions. *Take pill at 7:05 AM. Walk to market via Elm Street. Smile at Clem’s boy. Buy exactly two onions.* Her locker pinged constantly, a nervous heartbeat to her existence. Over decades, the constant external prompting had carved grooves in her personality. Initiative felt dangerous, like stepping off a marked path. Her conversations were predictable, her routines immutable. She wasn’t unhappy; she was frictionless. Her world was streamlined, efficient, and profoundly small. She was respected, in a way, for her iron reliability. She’d locked herself into paying debts decades ago, and she always did. People called her "Steady Gable," but the steadiness felt less like strength and more like the rigidity of a fossil.

  Then there was **Aris**. He owned the small engine repair shop. His doorway was conspicuously bare. No locker. This made him an object of suspicion, a loose variable in a tightly controlled equation. Why wouldn’t you want certainty? Why wouldn’t you bind your future self to good sense?

  It cost him. Business was slower. People preferred mechanics who locked in their estimates and completion times. Promises from Aris were just… words. Air. When he said he’d fix your tractor by Tuesday, you had to weigh his character, his history, the look in his eyes. It was exhausting for everyone. He missed out on the informal trade that powered Lockwood: the exchange of *Locked Favors*. Mrs. Gable might lock herself into *Deliver fresh bread to Old Man Harkin every Monday* and trade that token commitment to Clem for Clem locking himself into *Fix Mrs. Gable’s fence by month’s end*. These brass tokens, inscribed with the locked action, circulated like a secondary currency. They were trust made tangible, future labour pre-sold.

  The rich? Those who accumulated Locked Favors owed *to* them, not ones they owed. Clem, the young, ambitious carpenter, was getting wealthy. He locked himself into complex, long-term projects for people, demanding payment in simpler, more immediately useful Locked Favors from others – *plow my field next spring*, *repair my roof in summer*. He sat on a pile of brass tokens, a future army of obligated labour. He was becoming rigid too, in a different way; his schedule was a prison of other people’s locked demands, his own desires subsumed by the accumulating weight of pre-committed time.

  **And the town itself?** Lockwood was… brittle. Disagreements didn't fade; they fossilised. Take the dispute over the Community Hall wall. The "Blues" faction locked themselves into *Paint the Hall Cornflower Blue on the 1st*. The "Creams," furious, locked themselves into *Paint the Hall Antique White on the 1st*. Both actions were set for the same dawn. The result wasn't compromise; it was a frantic, overlapping mess of paint slinging, streaks of blue and cream mixing into a sickly grey, the air thick with the furious *pings* of lockers demanding contradictory perfections. No one backed down. How could they? Their lockers screamed until they obeyed their locked intent. The grey wall stood as a monument to stalemate.

  Fanaticism wasn't loud; it was quiet, relentless, and locked in. Principles hardened into unyielding mandates. Forgiveness became difficult because changing one's mind felt like locker-destruction – a violent, shameful act. People locked themselves into grudges, into vendettas, into never speaking to so-and-so again. The town wasn't full of villains; it was full of people who had willingly removed their own off-ramps, convinced at the time of locking that this future rigidity was strength, clarity, *goodness*. They became their own jailers and enforcers.

  **The baker, Elias**, had locked something years ago, during the messy unraveling of his marriage to Lena. Hurt and wanting to prove something – his decency, perhaps, or just his stubbornness – he’d locked himself into *Water the apricot tree beside Lena’s back porch every Tuesday at sunset*. It was Lena’s favourite tree, planted by her mother. Even after she moved out, even after the divorce papers were dust, the locker pinged. Every Tuesday. Elias filled his watering can and walked the three blocks.

  Lena died last winter. Quietly, in her sleep. The little house stood empty now, windows boarded. The apricot tree, deprived of Lena’s sporadic extra care during the week, looked thirstier than ever.

  One Tuesday, the ping echoed through Elias’s quiet bakery as the sun dipped low. He sighed, the familiar weight settling in his chest. He filled the can. The walk was automatic. The town was quiet, bathed in the long, golden light of late afternoon. He unlatched the gate to Lena’s old yard, untouched since the funeral. Weeds brushed his trousers.

  He stood before the apricot tree. It was small, struggling. A few wizened green fruits clung to its branches. The soil was parched dust. His locker, tucked in his apron pocket, pinged again, sharp and demanding.

  *Water the apricot tree beside Lena’s back porch every Tuesday at sunset.*

  He could see the padlock on the back door. The boarded windows. The utter stillness. Lena was gone. The house was empty. No one would ever know if he watered this tree or not. The locker would shriek, yes, but only he would hear it until he got home. He could smash it later. Who would care? Who would even know *why* he’d locked it? Lena was dead. The promise, the reason for the lock… it was dust.

  He stood, watering can heavy in his hand. The ping became a rapid, impatient chatter. He looked at the tree, a lonely monument to a dead past. He looked at the dry, cracked earth around its base. He thought of Lena, laughing years ago, biting into a sun-warmed apricot. He thought of the lock, the cold brass, the finality of that click.

  Slowly, deliberately, Elias tipped the watering can. Water gurgled out, darkening the dust, sinking quickly into the thirsty ground around the tree’s roots. He emptied the whole can, watching the water vanish almost instantly. The tree didn’t visibly change. The ping stopped.

  He didn’t feel noble. He didn’t feel warm. He didn’t feel like a sucker, either. He just felt… tired. And the silence after the ping was profound, a relief that was almost a physical ache. He walked back to his bakery, the empty can swinging by his side. He didn't know why he'd done it. Duty? Habit? A ghost of love for a ghost? Or was it simply that the person who’d locked that promise years ago was someone he still, inexplicably, felt bound to? The question hung in the dusty air, unanswered, unimportant. He just… had.

  Aris watched Elias return from his window. He saw the watering can, the weary set of the baker’s shoulders. He didn’t need to know the specifics to understand the shape of it. Another action performed because a box demanded it, long after the reason had blown away. He tightened a bolt on a carburetor, the smooth metal cool under his fingers. Outside, the late sun glinted off the brass lockers bolted to every other building on the street. The town felt solid, predictable, and as unforgiving as the desert that pressed in on all sides. He heard the distant *ping* of someone else’s commitment kicking in, a sound as ordinary as the wind. Aris wiped grease from his hands, a solitary man in a town that had built its certainty, one irrevocable click at a time. He kept his promises, when he made them. He just preferred to make them fresh each time. It was harder. It cost him. But the silence in his own head, the freedom of a choice not yet made… that was his locked box. And he wouldn't trade it for all the brass in Lockwood. The dust settled. The lockers waited.
