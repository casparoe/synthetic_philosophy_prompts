prompt: |-
  Hey — I'm a second-year PhD student, currently stuck in a speech-act seminar, and I've hit a wall. Three weeks on the norm of assertion and every paper I pick up is basically the same move: here's knowledge, here's truth, here's belief, here's a couple of cases, scorecard at the end. I don't want another scorecard. Before I read anything else I want the spec — what does any adequate theory of the norm governing assertion actually have to deliver?

  So give me the desiderata list. I mean the cases it has to get right (selfless assertions, where someone asserts something true that they don't believe and couldn't know; lottery-style cases where you're right but clearly shouldn't be asserting; lying vs bullshitting vs merely misleading; the absurdity of asserting something while disclaiming belief in it; the fact that we retract assertions rather than just deny them; assertions under genuine uncertainty, like a doctor hedging), the distinctions it can't collapse (the norm of assertion vs the norm of belief vs norms for acting on a claim; being appropriate vs being warranted vs being excused; the illocutionary act vs its perlocutionary effects; maybe a norm indexed to an audience vs one norm for everyone), and the background considerations it can't contradict (we're fallible; assertion has something to do with passing on knowledge or entitlement to believe; hearers are entitled to rely on what they're told; we can assess assertions along some kind of evolving conversational score). For each requirement, say why it's a requirement and what happens to a theory that drops it. Two things I especially want. First, mark which of these are genuine constraints and which are just prejudices of whichever camp the author happens to be in — I suspect half the standard list is imported from a prior commitment to the knowledge norm rather than being independently motivated. Second, tell me whether some subset is jointly unsatisfiable; if you can't get lottery cases and selfless assertions and fallibility all at once, or if demanding all three forces you to give up the idea of a single norm, that's the result I most want.

  Oh — and can you test the list against a couple of cases I've been kicking arround that I haven't seen anyone discuss? One is a sealed letter you write to your future self, asserting something you'll need later; there's no other audience, and the 'you' who reads it won't remember writing it. The other is an anonymous warning sign, no speaker you can point to, that gets read as an assertion. I don't know if these even count as assertions, but if the theory of the norm can't say whether they fall in scope, I'd count that against it. And honestly, if the whole 'there is a single norm' framing is a mistake, or the desiderata can't be cleanly seperated from which camp you're already in, just say that straight instead of handing me a tidy list — I'd rather be told the question is malformed than get a neat answer that papers over it.
reasoning: |-
  Okay, I see this user is a second-year PhD student stuck on the norm of assertion in a speech-act seminar. They're frustrated with the repetitive structure of papers they've been reading—knowledge, truth, belief, cases, and then a scorecard. They want a clear list of desiderata that any adequate theory must satisfy, without bias toward any particular camp. 

  Hmm, the user is clearly deep in the literature but feeling disillusioned. They mention "selfless assertions" and "lottery cases," which are classic puzzles in this area. Their frustration suggests they're looking for a meta-perspective—not just what theories say, but how to evaluate them critically. They're also wary of circularity, suspecting that some desiderata are just artifacts of the knowledge norm rather than neutral constraints.

  The user's two novel cases are fascinating: the sealed letter to future self and the anonymous warning sign. These push boundaries of speaker-hearer dynamics and intentionality. They’re testing whether a theory can handle edge cases where standard features (audience, speaker identity) are absent. Smart move—if a norm theory can’t even decide if these *are* assertions, it’s probably underdefined.

  Their deeper request is epistemological honesty: if the "single norm" framework is flawed or desiderata are irreconcilable, they want that stated upfront. No sugarcoating. This isn’t someone who wants tidy answers; they want to know where the cracks are. I should acknowledge that tension—maybe even highlight which desiderata might be mutually exclusive (e.g., fallibility + lottery intuitions + selfless assertions).

  Key angles to cover:
  - **Cases every theory must explain**: Selfless assertions (need to accommodate non-culpable ignorance), lottery cases (why probabilistic certainty ≠ warrant), hedging (norms under uncertainty), retraction (why it’s distinct from denial).
  - **Distinctions to preserve**: Norm of assertion vs. belief (they regulate different things), illocutionary vs. perlocutionary (the act itself vs. its effects), appropriateness vs. excuse (blameworthiness isn’t binary).
  - **Background constraints**: Fallibility (norms can’t require infallibility), transmission (assertions transfer epistemic standing), conversational dynamics (norms must interact with context shifts).
  - **Bias check**: Flag which desiderata are theory-laden (e.g., "hearer entitlement" leans knowledge-norm-ish) vs. neutral (e.g., fallibility is universal). The sealed letter case might challenge audience-centric norms; the warning sign tests speakerless assertions.

  Biggest red flag: Selfless assertions + lottery cases + fallibility might be a "pick two" scenario. If a norm demands knowledge, selfless assertions look defective; if it’s just belief, lottery assertions seem fine when they shouldn’t. A "reasonableness" norm might split the difference but lose precision. Should explicitly say: "Here’s where compromises happen."

  Also—don’t oversell the list. Admit that some desiderata are contested (e.g., transmission might be rejected by anti-reductionists) and that the sealed letter might not be an assertion at all. The user would respect that transparency.
answer: |-
  Here’s a **desiderata list** for any theory of the norm of assertion, stripped of partisan baggage, with constraints marked, biases flagged, and tensions exposed. I’ll structure it as: **Core Cases**, **Distinctions**, **Background Constraints**, and **Novel Cases**, followed by a frank assessment of feasibility.

  ---

  ### **I. Core Cases Any Theory Must Handle**
  *(Non-negotiable data points; failure here = theory inadequacy)*

  1. **Selfless Assertions**  
     - *Case*: Asserting a true claim you *don’t believe* (e.g., "I have cancer" spoken by a delusional patient under hypnosis).  
     - *Requirement*: The assertion is intuitively *appropriate* despite speaker ignorance. A theory must explain why it’s not blameworthy.  
     - *Failure*: Overly internalist norms (e.g., "Believe P") condemn it unfairly. Knowledge norms struggle unless they invoke excuses.

  2. **Lottery Cases**  
     - *Case*: Withholding assertion despite high probability (e.g., "Your ticket lost" based on odds alone feels improper).  
     - *Requirement*: Explain why statistical certainty ≠ warrant to assert.  
     - *Failure*: Truth-based norms permit reckless assertions; belief-based norms can’t explain the intuition.

  3. **Hedging/Uncertainty**  
     - *Case*: A doctor saying, "It’s *likely* infection X, but we need tests."  
     - *Requirement*: Allow for qualified assertions without violating the norm.  
     - *Failure*: Binary norms (e.g., "Assert only if you know P") can’t accommodate graded epistemic states.

  4. **Lying vs. Bullshitting vs. Misleading**  
     - *Case*: Distinguishing lying (intentional falsehood), bullshitting (indifference to truth), and misleading (technically true but deceptive).  
     - *Requirement*: Explain differential blame: lying > misleading > bullshitting in some contexts.  
     - *Failure*: Truth-centric norms collapse lying/bullshitting; knowledge norms treat all three similarly.

  5. **Retraction Obligation**  
     - *Case*: Upon discovering error, we *retract* ("I take that back") rather than merely deny ("I was wrong").  
     - *Requirement*: Explain retraction as a unique normative response to defective assertions.  
     - *Failure*: Theories reducing assertion to belief can’t explain why retraction ≠ belief revision.

  ---

  ### **II. Essential Distinctions**
  *(Collapsing these = conceptual confusion)*

  6. **Assertion Norm vs. Belief Norm**  
     - *Requirement*: Why asserting P without belief is *distinctly* wrong (e.g., Moorean absurdity: "P, but I don’t believe it").  
     - *Failure*: Conflating norms implies asserting = expressing belief, but we can assert insincerely.

  7. **Appropriateness vs. Warrant vs. Excuse**  
     - *Requirement*: Distinguish: (a) *Appropriateness* (should you assert?), (b) *Warrant* (epistemic license), (c) *Excuse* (blame mitigation, e.g., in selfless cases).  
     - *Failure*: Theories without excuses pathologize blameless assertions; those without warrant can’t explain lottery cases.

  8. **Illocutionary vs. Perlocutionary**  
     - *Requirement*: The norm must govern the *act of asserting itself*, not its effects (e.g., convincing someone).  
     - *Failure*: Makes norms audience-relative or consequentialist, losing the core act’s structure.

  9. **Speaker-Norm vs. Audience-Entitlement**  
     - *Requirement*: Explain why hearers gain entitlements (e.g., to rely, rebuke, or seek justification) without making the norm *about* hearers.  
     - *Failure*: Audience-relativism struggles with speakerless cases (e.g., anonymous signs).

  ---

  ### **III. Background Constraints**
  *(Violating these = empirical/functional inadequacy)*

  10. **Fallibility**  
      - *Constraint*: Humans err. Norms can’t demand infallibility or require certainty.  
      - *Failure*: Knowledge norms face skepticism; truth norms ignore reasonable errors.

  11. **Knowledge/Entitlement Transmission**  
      - *Constraint*: Assertions transfer epistemic standing (hearer can gain knowledge/justification).  
      - *Bias Check*: This *is* theory-laden (favors knowledge/reductionist norms), but dropping it loses a key social function.

  12. **Conversational Score Dynamics**  
      - *Constraint*: Norms must interact with conversational context (e.g., presuppositions, common ground).  
      - *Failure*: Static norms can’t explain why asserting "It’s raining" is OK indoors if contextually relevant.

  ---

  ### **IV. Your Novel Cases: Litmus Tests**
  13. **Sealed Letter to Future Self**  
      - *Test*: Is this an assertion? If so, what norm applies? Speaker = past self (unaware of future context), audience = future self (no shared memory).  
      - *Challenge*: Theories requiring *current* speaker warrant fail (past self may lack warrant). Audience-relativist norms struggle (no "hearer" at utterance).

  14. **Anonymous Warning Sign**  
      - *Test*: "DANGER: BRIDGE OUT" with no identifiable speaker.  
      - *Challenge*: Speakerless assertions test if norms require intentional agents. Can a sign "violate" a norm? If not, is it even an assertion?

  ---

  ### **V. Critical Tensions & Bias Assessment**
  - **The Knowledge-Norm Baggage**: Desiderata like "transmission" (11) and lottery cases (2) are often weaponized *by* knowledge-norm advocates. But selfless assertions (1) and fallibility (10) undermine it.  
  - **Selfless Assertions + Lottery Cases + Fallibility = TRIADIC TENSION**:  
    - Any norm strict enough to forbid lottery assertions (demanding more than probability) will struggle to permit selfless assertions (where speaker lacks warrant).  
    - *Result*: Most theories sacrifice one:  
      - **Knowledge Norm**: Sacrifices selfless assertions (calls them "excused but defective").  
      - **Truth Norm**: Sacrifices lottery cases (allows reckless assertions).  
      - **Reasonable Belief Norm**: Tries to split the difference but risks vagueness.  
  - **Single Norm Feasibility**: A *single* norm (e.g., "Assert only if...") likely can’t satisfy all desiderata without heavy caveats (excuses, context-indexing). Hybrid or pluralist approaches (e.g., multiple norms for contexts) are underexplored but may be necessary.

  ---

  ### **Conclusion: Is the Question Malformed?**
  - **Yes, partially**. The "single norm" framing is a useful heuristic but may be reductive. Assertion serves multiple functions (inform, warn, promise), so a monistic norm will strain at edges. Your sealed letter case highlights this: if the norm is "transmit knowledge," the letter fails (future self can’t "know" via assertion if memory is gone). But if we drop transmission, we lose a core social role.  
  - **Path Forward**:  
    1. **Demote "Single Norm"**: Treat it as a regulative ideal, not a discovery.  
    2. **Prioritize Desiderata**: Which *must* be saved? (e.g., Retraction? Fallibility?).  
    3. **Test Edge Cases First**: If your anonymous sign isn’t an assertion, the theory must explain *why*—this may reveal hidden assumptions.  

  **Recommendation**: Start with Pagin (2016) on assertion and commitment, or McKinnon (2015) on supporting/conveying reasonable belief. They explicitly grapple with pluralism. Then apply your cases: if a theory can’t even *classify* your sealed letter, it’s missing something structural. Sometimes the wall isn’t yours—it’s the literature’s.
