prompt: |-
  I've been reading about how the word 'genocide' got invented and it set off a pattern I keep noticing and don't have a name for. Lemkin's own idea was broader than what ended up in the treaty -- the drafters dropped the cultural-destruction part and left political groups out, and the definition everyone now fights over is essentially a compromise text from 1948. Here's the thing I mean. You get into an argument about whether some atrocity is a genocide, and everybody agrees on the facts -- the killing, the intent, the scale -- and then the whole conversation turns into a fight about the definition: does the targeted group count, does destroying part of a group qualify, does the intent have to be the only motive. And it never settles, because the two sides arent answering the same question. For a government, saying the word is a commitment; you're now on the hook to do something. For an activist, saying the word is the something. So 'is this a genocide' quietly replaces 'what should be done about this', and the descriptive question can't be pulled apart from what saying it would oblige you to do. I think it happens with other words too -- 'famine' has a threshold and a committee and an announcement that lands late and then gets treated as the response -- but genocide is the clearest case. Is there a name for this? I know about people stretching a term to cover too much, and I know the usual complaint that we argue about labels instead of acting, and neither is what I mean. What I want is the specific move where the word carries an obligation for whoever says it, so the factual question and the practical one fuse, and the compromises baked into a legal text end up as the default answer to a moral question. If there's no term for it, name it and define it, and tell me where the edges are -- what's the nearest thing that isnt this, and where the line runs.
reasoning: |-
  Okay, the user is describing a fascinating linguistic phenomenon they've observed, particularly with the term "genocide." They note how debates about whether an event qualifies as genocide often get stuck on definitional technicalities from the 1948 UN Convention, even when facts are agreed upon. What's interesting is how they identify that the word "genocide" carries implicit obligations - governments avoid it to prevent intervention duties, while activists use it precisely to trigger those obligations. This creates a situation where the descriptive question ("Is this genocide?") becomes inseparable from the prescriptive question ("What should we do?").

  The user explicitly rejects two common explanations: semantic dilution (stretching a term's meaning) or mere label-obsession instead of action. They're pinpointing something more structural - how institutional definitions (like the UN's genocide criteria) become moral gatekeepers because of the attached consequences. I recognize this as a collision between legal formalism and moral urgency.

  For naming this phenomenon, several concepts come to mind. "Performative labeling" captures how declaring something genocide is itself an act with consequences. "Definitional entrapment" emphasizes how debates get stuck on technicalities. "Institutional capture of moral vocabulary" gets at how bureaucratic definitions override ethical judgment. But the most precise might be "obligation-fused terminology" - terms where factual description and required response are constitutionally bound.

  The boundaries matter here. This isn't just any politically charged term (like "terrorism" which has definition fights but no automatic obligations). Nor is it about terms losing meaning through overuse ("genocide inflation"). The unique feature is the existence of formal triggers - like how UN genocide recognition legally obligates signatories. Famine declarations work similarly with humanitarian responses.

  The user seems analytically sophisticated - they've already mapped the anatomy of this phenomenon and want precise vocabulary. Probably academic or policy-adjacent. Their frustration suggests they've witnessed unproductive debates where this dynamic paralyzed action. Naming it gives power to dissect it. Beyond terminology, they might appreciate examples of counter-strategies, like decoupling descriptive and prescriptive discussions ("Whether we call it genocide or not, here are necessary interventions...").

  The core insight is about institutional definitions hijacking moral reasoning through attached consequences. That's what makes this distinct from related concepts like reification or semantic disputes. The fusion occurs because the word itself is a switch that activates real-world mechanisms.
answer: |-
  You've identified a profound and under-discussed phenomenon: **the fusion of descriptive classification with institutional obligation, where the act of labeling becomes inseparable from the perceived (or actual) duty to act.** There isn't a single universally accepted term for this specific dynamic, but we can define it and differentiate it from related concepts.

  **Proposed Name: Institutional Obligation Fusion (IOF)**

  **Definition:** Institutional Obligation Fusion occurs when a specific term, defined within an institutional framework (legal, political, humanitarian), carries inherent operational consequences or obligations for parties recognizing it. This fuses the *descriptive question* ("Does this situation meet the criteria?") with the *prescriptive question* ("What must/should be done?"), making purely factual debate impossible. The compromises and limitations baked into the institutional definition consequently become the battlefield for determining moral and practical responses.

  **Breakdown of the Mechanism (as you described with "genocide"):**

  1.  **Institutional Definition:** A term is given a specific, often narrow, technical definition by a treaty, law, or organization (e.g., UN Genocide Convention, IPC Famine Scale).
  2.  **Embedded Obligation:** Recognition or declaration using that term triggers formal or strong informal obligations for signatory states or relevant actors (e.g., obligation to prevent/punish genocide under the Convention, major mobilization for famine relief).
  3.  **The Fusion:** Debating whether the term *applies* becomes inherently a debate about *whether the obligation is triggered*. The factual assessment is contaminated by the political/practical consequences of the label.
  4.  **Consequence:** Arguments focus relentlessly on the technical boundaries of the institutional definition ("Is it a *protected* group?", "Is the intent *solely* genocidal?", "Did it cross the 20% famine threshold?"), obscuring the underlying reality and the broader moral/political question of appropriate response. The institutional compromise becomes the de facto arbiter of moral outrage and required action.

  **Why "Genocide" is the Paradigm:**

  *   **Legal Obligation:** The Genocide Convention creates clear legal obligations for states.
  *   **High Stakes:** The label implies the "crime of crimes," demanding the most severe response.
  *   **Politicization:** States actively avoid the label to evade responsibility; activists seek it to compel action.
  *   **Definitional Ambiguity:** The Convention text has inherent tensions (e.g., "intent to destroy," "in whole or in part," protected groups) ripe for debate.

  **Other Examples of IOF:**

  1.  **Famine (IPC Scale):** As you noted. Declaring "famine" triggers massive humanitarian protocols and funding. Debates rage about whether malnutrition/mortality rates *exactly* meet the IPC Phase 5 thresholds, often delaying response until the formal declaration is made (which is usually too late). The label *is* the call to action.
  2.  **"Armed Conflict" vs. "Internal Disturbances" (International Humanitarian Law):** Calling a situation an "armed conflict" triggers the application of IHL (Geneva Conventions), imposing obligations on parties. Governments often resist the label to avoid these constraints; others push for it to establish legal protections for civilians/combatants. The factual question ("Is this violence intense/organized enough?") is fused with the legal obligations.
  3.  **"Crimes Against Humanity" (ICC Statute):** While prosecution depends on the ICC, the label carries immense political weight and demands for international justice. Debates focus heavily on the technical thresholds ("widespread/systematic attack," "civilian population") because meeting them implies a specific institutional response pathway.
  4.  **"Unconstitutional Change of Government" (Regional Bodies like AU/OAS):** Declaring a coup or power grab "unconstitutional" triggers automatic sanctions and suspension from the organization. Debates hinge on the precise definition and whether the specific event qualifies, directly determining the institutional response.

  **Distinguishing IOF from Related Concepts:**

  1.  **Semantic Bleaching / Concept Stretching:** This is about a term *losing* meaning through overuse or misapplication (e.g., calling minor inconveniences "trauma"). **IOF is different:** The term retains its *institutional power and consequences*, even if its technical boundaries are contested. The fight is *over* the strict definition *because* the consequences are high, not because the meaning is diluted.
  2.  **Arguing About Labels Instead of Acting:** This is a broader complaint about semantics blocking substance. **IOF is specific:** It explains *why* the label argument *is* the substance – because the label is the switch for institutional obligations. The label argument *is* the debate about acting, albeit in a convoluted way.
  3.  **Reification:** Treating an abstract concept as concrete reality. **IOF is different:** It's not just about treating "genocide" as a concrete thing, but about how the *institutional definition* of that concept becomes the gatekeeper for massive real-world obligations.
  4.  **Performativity (Austin/Searle):** The idea that saying something *does* something (e.g., "I pronounce you..."). **IOF is related but distinct:** Labeling something "genocide" under the Convention *is* performative in a legal/institutional sense – it *enacts* obligations. IOF focuses on how this performative aspect *fuses* the descriptive and prescriptive questions and traps debate within the institutional definition's framework. It's performativity with major, binding consequences baked into the definition itself.
  5.  **Moral Licensing (Opposite Effect):** Sometimes using a strong label can *replace* action (e.g., "We called it genocide, our job is done"). **IOF is different:** The avoidance of the label is often driven by a desire to *avoid* obligations, while activists use it to *activate* them. The core issue is the fusion creating the definitional fight, regardless of whether the label is ultimately used for action or avoidance.

  **The Edges of IOF - Nearest Things That Aren't Quite It:**

  *   **Terms with Strong Moral Weight but No Formal Obligation:** Calling something "evil," "unjust," or "a betrayal" carries moral force but doesn't automatically trigger institutional responses. Debates are about morality/interpretation, not institutional duty.
  *   **Diagnostic Labels with Treatment Implications (e.g., Medical):** Diagnosing "cancer" implies treatment protocols. However, the obligation is generally clear (treat the patient) once diagnosed, and the diagnostic criteria are primarily scientific, not political compromises. The fusion is less contentious and more about scientific accuracy leading to best practice.
  *   **Terms Triggering Modest/Discretionary Responses:** Declaring a "disaster" might trigger *some* aid protocols, but the obligations are usually less absolute and binding than genocide prevention or famine response. The debate might be about severity, but the fusion with massive, non-discretionary obligations is weaker.
  *   **"Terrorism" Label:** Highly politicized with consequences, but lacks a single, universally binding institutional definition *and* a clear, singular mandated response mechanism. Consequences are more ad-hoc (sanctions, military action) rather than stemming directly from a specific treaty obligation triggered by meeting a defined threshold. The fusion exists politically, but the *institutional* framework is messier than for genocide or famine.

  **The Line Runs Here:** IOF occurs when **1)** A term has a specific, formal definition within **2)** an institutional framework (treaty, international body, major protocol) that **3)** mandates or strongly compels specific, significant, and often non-discretionary obligations for relevant actors upon recognition, thereby **4)** making the debate about applying the label inherently and unavoidably a debate about triggering those obligations, and **5)** centering the argument on the technical compromises of the institutional definition rather than the underlying reality or broader moral imperatives.

  Your insight brilliantly captures how well-intentioned institutional frameworks can create linguistic traps that obscure suffering and paralyze action. Institutional Obligation Fusion (IOF) is the name for that specific, consequential entanglement.
