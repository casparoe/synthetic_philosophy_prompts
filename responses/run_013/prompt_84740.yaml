prompt: |-
  I moved in with my partner a few months ago and shes vegan, which has been great for my cooking but bad for my peace of mind, because now I keep trying to figure out what I actually think about eating animals instead of just doing what I grew up doing. I'm not after a reading list or citations or anything like that—I just want a principle, or a small set of candidate principles, that can make sense of my gut reactions and tell me where they break down. I've also been reading a bit about wild animal suffering, which has made the whole thing feel less like a simple matter of vegetarian versus omnivore and more like a question about how much suffering I'm willing to have happen on my behalf, including out in fields and forests.

  Here are the verdicts I keep landing on. Factory-farmed chicken: not fine. Factory-farmed beef: also not fine, but part of me thinks beef is worse because cows are smarter and the land use is absurd, while another part thinks chicken is worse because one cow feeds so many more meals than one chicken, so per plate you're responsible for way more deaths. I can't hold both and it's driving me nuts. Oysters: fine, no brain. Wild-caught salmon: not fine, though I can't tell if that's because of bycatch, because the fish had a life, or because I'm just squeamish about killing something that looks back at me. Backyard eggs from a hen I've actually met: fine. Roadkill deer: fine. Lab-grown meat: fine. Crickets: fine, but shrimp feel off-limits, and I can't explain the difference except that shrimp seem more like animals to me. Plants: fine, except I read somewhere that harvesting wheat and soy kills alot of field mice and insects, and I don't know what to do with that. And then there's the one I keep going back and forth on: a cultured chicken breast grown from cells taken from a live chicken that's kept in a small cage as a donor its whole life but never killed. Is that fine, or is it worse than just eating a regular chicken?

  I have a feeling the answer should be something like a suffering-per-calorie ledger, but that makes the wheat-mice thing loom large and also makes me think chicken is worse than beef, which I don't like. Can you tell me what principle, or small set of principles, actually captures most of these verdicts, what it says about the cell-donor chicken and the wheat-mice case, and which of my verdicts it forces me to give up? I'm fine with a principle that's complicated if it saves the cases, but I want to know the price.
reasoning: |-
  Okay, the user is really struggling with the ethics of eating animals after moving in with their vegan partner. They've been forced to question their lifelong habits and now face conflicting gut reactions about different food sources. Their detailed list of "verdicts" shows they've thought deeply but feel stuck in contradictions - especially regarding chicken vs beef comparisons, the wheat-mice problem, and that intriguing cell-donor chicken scenario.

  Hmm... what's their core need here? Not facts or studies, but a coherent ethical framework to resolve cognitive dissonance. The wild animal suffering mention suggests they want consistency beyond just human-caused harm. Their frustration with "suffering-per-calorie" reveals they intuitively reject pure utilitarianism when it clashes with other values (like their beef/chicken dilemma). 

  The key tension points seem to be: 
  1) Scale vs. individual experience (many small deaths vs fewer large ones)  
  2) Consciousness/sentience as a gradient (oysters vs shrimp)  
  3) Proximity/"someonenness" (roadkill feels distant, salmon's gaze feels personal)  
  4) Complicity (is lab meat "clean" if a donor suffers?)

  For principles... "Consent and Context" might work? But consent is tricky for animals. "Harm Minimization with Sentience Weighting" covers more cases - it explains why shrimp > crickets (higher neural complexity), why field mice matter less than cows (intensity of suffering), and makes cell-donor chicken clearly unethical (deliberate suffering imposition). 

  Biggest sacrifice: They'd have to accept that plants/insects matter ethically, just far less than vertebrates. The wheat-mice issue becomes "regrettable but currently unavoidable" unlike factory farming which is "deliberate and intense". For chicken vs beef - per-meal, chickens cause more deaths but cows suffer more individually. The principle says: both bad, but qualitatively different bads. 

  Ah, and the salmon bycatch... under this framework, it's the combination of sentient life + avoidable harm + scale that makes it "not fine". Whereas roadkill is harm-neutral (no causation). 

  Should emphasize that this framework makes their shrimp/cricket distinction rational (sentience gap) and resolves the donor chicken dilemma (it's institutionalized suffering). Their "beef worse per animal/chicken worse per meal" conflict isn't a flaw - it reflects two real ethical dimensions. 

  ...And maybe add that no system eliminates all tension. The goal is coherent reasoning, not perfect purity.
answer: |-
  Here's a candidate set of principles designed to capture most of your intuitions while forcing you to sacrifice a few and clarifying the hardest cases. The core idea is **"Harm Minimization with Sentience Weighting and Avoidable/Intentional Harm Focus"**:

  ### The Three Principles
  1.  **Minimize Deliberately Inflicted Suffering:** Prioritize avoiding suffering that is intentionally *caused* or *sustained* by human systems for our benefit, especially when alternatives exist. Suffering that is foreseeable and systematic carries greater weight than suffering that is accidental, incidental, or naturally occurring.
  2.  **Weight Harm by Sentience & Capacity for Suffering:** The moral significance of harm increases with the strength of evidence for an organism's capacity to experience suffering (consciousness, complex nervous systems, behavioral avoidance of harm). Sentience is a spectrum, not binary.
  3.  **Prioritize Direct & Avoidable Complicity:** Focus strongest moral concern on harms you *directly* cause or financially support through choices where practical alternatives exist. Harms that are indirect, unavoidable byproducts of essential activities (like basic agriculture) carry less weight per instance, though large-scale impacts still matter.

  ### How It Captures Your Verdicts
  *   **Factory-Farmed Chicken/Beef:** Violates **#1 & #2** (intentional, severe suffering inflicted on sentient beings). **#3** makes you complicit. *(Captures: Not Fine)*.
  *   **Oysters:** **#2** (Weak/non-existent evidence for sentience/suffering capacity). *(Captures: Fine)*.
  *   **Wild-Caught Salmon:** Violates **#1 & #3** (intentional killing of sentient being for food, avoidable; bycatch amplifies this). *(Captures: Not Fine)*.
  *   **Backyard Eggs (Happy Hen):** Minimal/no suffering inflicted (**#1**). Hen's sentience respected (**#2**). Complicity low/benign (**#3**). *(Captures: Fine)*.
  *   **Roadkill Deer:** No suffering inflicted by you (**#1**). No complicity (**#3**). Sentience acknowledged but harm not caused. *(Captures: Fine)*.
  *   **Lab-Grown Meat (Standard):** No direct suffering inflicted on sentient being for *this* product (**#1**). Sentience of donor potentially acknowledged but harm minimized/absent in production (**#2**). Low complicity in suffering (**#3**). *(Captures: Fine)*.
  *   **Crickets:** **#2** (Evidence for significant suffering capacity is weak/very low). Intentional harm is minor (**#1**). *(Captures: Fine)*.
  *   **Shrimp:** **#2** (Stronger evidence for complex nociception/potential suffering than crickets). Intentional killing (**#1**). *(Captures: Not Fine - explains difference from crickets)*.
  *   **Plants:** **#2** (No evidence for sentience/suffering). Field mice/insects: Harm is incidental (**#1**), unavoidable with current large-scale agriculture for essential calories (**#3**), and per-individual suffering capacity is lower (**#2**). *(Captures: Fine, explains why field mice don't negate plant-based focus)*.

  ### How It Resolves Your Conflicts
  *   **Chicken vs. Beef:**
      *   **Per-Animal Suffering (Principle #2):** Beef *might* be worse (cows likely more cognitively complex).
      *   **System Suffering (Principle #1):** Chicken *might* be worse (more intense confinement, shorter brutal lives, more individuals suffering per calorie).
      *   **Conclusion:** Both violate **#1 & #2** severely. The principle doesn't force you to choose which is "worse" overall; it says both are ethically unacceptable due to intentional, severe suffering inflicted on sentient beings (**#1 & #2**) where alternatives exist (**#3**). You can hold that *both* are bad, just for potentially different reasons within the framework.
  *   **Wheat-Mice:** Explained by **#1** (incidental, not intentional harm for food) and **#3** (unavoidable current cost of essential calories). It still matters, but it doesn't equate to factory farming. The focus is on *reducing* such harm through better farming practices, not using it to excuse deliberate suffering.

  ### The Hard Cases: What the Principles Say & What You Sacrifice
  1.  **Cell-Donor Chicken:**
      *   **Principle #1:** **VIOLATED SEVERELY.** The chicken is kept in a small cage, suffering deliberately inflicted and sustained *specifically* for your food product. This is intentional, systematic suffering, arguably worse than standard slaughter because it's prolonged.
      *   **Principle #2:** Sentient being suffering intensely.
      *   **Principle #3:** High direct complicity in sustaining this suffering system.
      *   **Verdict:** **Not Fine - Worse than regular chicken.** The principle forces you to see that the *ongoing suffering* is the primary ethical issue, not just the act of killing. Sacrifice your initial "maybe fine" intuition. This is institutionalized suffering for convenience.

  2.  **Sacrifices You Must Make:**
      *   **"Per-Plate Deaths" as Primary Metric:** You must give up the idea that simply counting deaths per meal is the most important factor. Principles **#1** and **#2** prioritize the *intentionality* and the *intensity/type of suffering* over the raw number of deaths. A billion bacteria dying incidentally matters less ethically than one cow suffering intensely in a feedlot by design.
      *   **Absolute Suffering-Per-Calorie:** You must accept that unavoidable, incidental suffering (like field mice) carries significantly less moral weight per unit than avoidable, deliberately inflicted suffering on more sentient beings (like factory farming). The ledger isn't flat. Context and avoidability matter (**#1 & #3**).
      *   **Beef "Worse" than Chicken Purely on Sentience:** Principle **#1** forces you to acknowledge that the sheer scale and intensity of suffering in chicken systems might counterbalance or even outweigh the potentially higher individual sentience of cows. It accepts that "worse" can be multidimensional.

  ### Why This Works (and Its Limits)
  *   **Captures Nuance:** Explains differences between oysters/shrimp, crickets/shrimp, roadkill/farmed meat, backyard/factory eggs.
  *   **Handles Scale & Intention:** Addresses the wheat-mice vs. factory farm dilemma by distinguishing incidental from intentional harm.
  *   **Addresses Complicity:** Explains why buying factory farmed meat feels different from eating roadkill or incidental field deaths.
  *   **Clarifies the Donor Chicken:** Makes the ongoing suffering the focal point.
  *   **Acknowledges Wild Suffering:** Doesn't require ignoring it, but focuses primary ethical action on harms we *directly control and cause* (**#1 & #3**). Reducing human-caused suffering is the most direct lever we have.

  **The Price:** You give up the simplicity of a single metric (like deaths/calorie or binary sentience). You embrace complexity: weighing sentience *spectrum*, judging *intentionality* and *avoidability*, and accepting that some harm (like field mice) is currently unavoidable collateral in feeding ourselves but doesn't ethically equate to deliberately creating suffering machines like factory farms. It requires judgment calls on sentience and avoidability, but provides a framework for making them consistently with your strongest intuitions.
