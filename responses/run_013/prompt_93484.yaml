answer: |-
  Here are 8 targeted interview questions with likely-response follow-ups:

  1.  **Q1: Zahavi emphasized the handicap as a signal impossible to fake *because* it was wasteful. But many reliable biological signals are unfakeable *indices* (like deep voices in mammals) that impose no strategic "cost" to be honest. Doesn’t this make indices, not handicaps, the truly foundational honest signals, reducing the handicap principle to a special case?**
      *   *Likely Answer/F-up:* If he says indices are "different" or "outside signaling theory," ask: *"If indices guarantee honesty without strategic costs, why is the handicap principle necessary for explaining most signals? Doesn't that make it redundant for core honesty?"* If he absorbs indices into signaling, ask: *"Doesn't that render 'cost' ambiguous, conflating unfakeable constraints with strategic handicaps?"*

  2.  **Q2: When you say a signal must "cost" low-quality signallers more, is this a cost of *production* (like growing a big tail) or a *strategic cost* incurred only because receivers react (like increased predation risk)? Is the principle fundamentally about resource expenditure or about equilibrium vulnerability?**
      *   *Likely Answer/F-up:* If he emphasizes strategic/equilibrium costs, ask: *"Doesn't this slide turn the principle into the near-tautology 'signals must impose differential fitness consequences in equilibrium,' making it unfalsifiable?"* If he leans towards production costs, ask: *"How does this distinguish handicaps from indices, which often have high fixed production costs?"*

  3.  **Q3: Signals of *need* like offspring begging are often cited as honest yet cheap for high-need signalers. Defenders say this fits because cost is measured in *terms of need*. Isn’t this stretching 'cost' so thin that it becomes 'whatever maintains honesty,' making the principle vacuous? Or is this a genuine counterexample?**
      *   *Likely Answer/F-up:* If he argues it fits by redefining cost as "marginal cost relative to state," ask: *"Doesn't this mean the 'cost' isn't a handicap burning resources, but simply a differential constraint inherent to the signaller's state, blurring back into the index idea?"* If he calls it a different regime, ask: *"Doesn't that concede the handicap principle isn't universal for honest signaling?"*

  4.  **Q4: Zahavi talked vividly about "waste" – burning actual resources. But much modern modeling shows honesty can emerge from signals merely being *difficult to fake* (e.g., complex song requiring neural development), not necessarily wasteful. Is the core of the handicap principle committed to actual resource waste, or just differential difficulty?**
      *   *Likely Answer/F-up:* If he downplays waste, ask: *"If mere difficulty suffices, how is this different from indices? Was Zahavi's core insight just wrong about the necessity of waste?"* If he insists waste is key, ask: *"Can you point to unambiguous evidence where the *wastefulness itself*, beyond difficulty, is the crucial factor maintaining honesty in a documented signaling system?"*

  5.  **Q5: The mathematical "single-crossing" or "differential-cost" condition seems to be the *real* engine in Grafen-style models ensuring honesty. Doesn't this mean the elaborate 'handicap' story is just colourful packaging for the dry math that any signal must be differentially costly *relative to quality* to be stable?**
      *   *Likely Answer/F-up:* If he agrees the math is key, ask: *"Doesn't this confirm the 'domestication' charge – that the math replaced Zahavi's specific wasteful handicap with a weaker, more general condition?"* If he argues the handicap *motivates* the condition, ask: *"But couldn't many mechanisms (not just handicaps) satisfy that condition?"*

  6.  **Q6: What specific empirical finding or theoretical result would you accept as definitively falsifying the handicap principle *as you understand its core claim*?**
      *   *Likely Answer/F-up:* If he gives a vague or narrow scenario, ask: *"Isn't that too easy to explain away? If no clear falsification exists, doesn't that make it non-scientific?"* If he offers a specific test, ask: *"Haven't proponents already argued that apparent counterexamples [e.g., begging] fit by redefining 'cost' or 'quality'?"*

  7.  **Q7: Can the handicap principle be meaningfully exported to explain costly signals in human culture (art, charity, religious rituals) without collapsing into the trivial observation that "expensive things are impressive"? What unique mechanistic insight does it provide beyond standard costly signaling theory in economics or anthropology?**
      *   *Likely Answer/F-up:* If he gives a generic CST answer, ask: *"How does invoking 'handicaps' add value here over simply saying 'costly displays signal underlying traits'? Where's the specifically *biological handicap* mechanism?"* If he claims uniqueness, ask: *"How do you rule out purely cultural transmission or learned associations driving the cost, rather than a Zahavian 'handicap'?"*

  8.  **Q8: Putting it all together: If indices guarantee honesty cheaply, if 'cost' can mean strategic vulnerability or state-dependent constraints, and if the math relies on differential costs, is the handicap principle best seen as a *foundational theory* of honest signaling, or just *one specific mechanism* (genuine waste) among several for achieving stability when indices aren't possible?**
      *   *Likely Answer/F-up:* If he claims it's foundational, ask: *"Doesn't that require subsuming indices and need-signals under the 'handicap' umbrella, stretching the original concept beyond recognition?"* If he concedes it's one mechanism, ask: *"Given how rarely unambiguous *waste* is demonstrated, why defend it as the core insight rather than differential costs generally?"*
