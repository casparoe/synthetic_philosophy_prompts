prompt: |-
  Next week's guest on my little philosophy-of-biology podcast is a guy who's spent his career defending Zahavi's handicap principle, and he has this move I want to test: he says the principle got "domesticated" by the maths — once Grafen formalized it, people quietly traded Zahavi's claim that the signal is a genuine handicap for the much weaker claim that it just has to cost low-quality signalers more than high-quality ones, and then called it a vindication. Write me 8-10 interview questions that go at the substance instead of letting him retell the peacock story, and for each one give me a follow-up keyed to the answer he's most likely to give. I want at least one question each on: (a) the index/signal distinction — cheap cues that can't be faked at all — and whether indices make the handicap principle redundant rather than foundational; (b) whether the principle is a claim about production costs or about equilibrium/strategic costs, and whether that slide turns it into the near-tautology that "signals must be costly"; (c) honest cheap signals like offspring begging, and whether a signal of need is a real counterexample or just a different regime; (d) whether the principle is committed to actual waste — burning resources — or only to being hard to fake, since he tends to blur these; (e) what he'd count as falsifying evidence. Throw in one about the single-crossing / differential-cost condition doing all the real work, and one about whether the whole thing can be exported to human culture (art, charity, religion) without collapsing into "expensive things are impressive". Dont put words in his mouth about specific papers, just press the positions. Start straight in with the questions, no preamble and no restating this.
