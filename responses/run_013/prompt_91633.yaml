answer: |-
  **INTERNAL MEMORANDUM: CHANCE DEPARTMENT ONBOARDING**  
  *Confidential - For Mosaic Staff Only*  

  **1. ROLE DESCRIPTION**  
  As Chance Officer, your primary function is to calculate and post Objective Chances (OC) across all spacetime sectors. Using the Best System Algorithm (BSA™), you will distill the complete mosaic of particular facts into a single probability distribution balancing Simplicity (S-score) and Strength (St-score). Posted OCs are the official reference frequencies for all credence-based operations. Remember: If it’s not on the BSA™ Bulletin, it’s not chance.  

  **2. KEY DUTIES**  
  - **BSA™ Maintenance:** Continuously update OC postings as new mosaic data arrives. Adhere strictly to S/St optimization protocols (v.12.7).  
  - **Principal Principle (PP) Enforcement:** Ensure all agents conditionally align credences with posted OCs, given admissible evidence (see Legal Addendum 4C). Non-compliance is a Tier-3 violation.  
  - **Stakeholder Communication:** Post OCs prominently. Direct ontological inquiries to Metaphysics Liaison (ext. 0).  

  **3. KPIs & PERFORMANCE METRICS**  
  - **OC Posting Latency:** ≤ 1 Planck time after mosaic updates.  
  - **PP Compliance Rate:** ≥ 99.98% (audited quarterly).  
  - **Undermining Incident Rate (UIR):** Track occurrences where posted OC(Event) > 0.5, yet the realized future’s own BSA™ assigns OC(Event) < 0.5. **Target:** "Manage toward theoretical minimum" (per Policy Γ).  
  - **System Elegance Score:** S/St ratios exceeding industry benchmarks.  

  **4. LEGAL ADDENDUM (Per Risk Management)**  
  *Re: Admissibility & Liability*  
  All OC postings carry the standard No-Undermining Clause (NUC):  
  *"Credence alignment under PP assumes OCs are not *undermined* by the mosaic’s full realization. If a future’s BSA™ retroactively invalidates prior OCs, PP obligations for *that specific timeline* are void. Legal is not liable for credence whiplash or existential dissonance."*  
  Always append NUC to PP briefings.  

  **5. FAQ**  
  **Q1: Why must we defer to OCs? They’re just summaries of the mosaic.**  
  *A:* OCs are *constitutively* summary-based, but *operationally* authoritative per Corporate Ontology Statute §7. Deference ensures credential harmony. Per Legal: "Don’t overthink the ‘why.’ Overthinking is a KPI laggard."  

  **Q2: Doesn’t the UIR KPI admit OCs are sometimes… wrong?**  
  *A:* "Wrong" implies a non-BSA™ truthmaker. We prefer "temporally non-aligned." NUC mitigates liability. Focus on elegant summaries.  

  **Q3: Rumor says a "New Principle" faction wants PP to defer to OCs *given the full Theory of Chance (TOC)*, not just history. Thoughts?**  
  *A:* The "TOC-Conditional" initiative is under review. Per Middle Mgmt. memo: "Current PP is ‘lean.’ TOC bloat risks S-score penalties. Also, who calculates *that* TOC? Us? Circular. Them? Not in the contract."  

  **Q4: Why did Dr. Ava Rosen (Sr. Chance Architect) resign?**  
  *A:* Personal reasons. Exit quote: "I’m tired of futures where my credences, formed under *this* sector’s OCs, were flawless… until the next BSA™ proved them incoherent. I’ll be gardening." Per Legal: Her NUC waiver is signed.  

  ---  
  **ACCURACY ASSESSMENT**  
  1. **Big Bad Bug (a):** High confidence. Directly reflects Lewis’ "undermining futures" critique: A high P(future F) can entail F’s own best system assigns low P(historical event), invalidating the initial credence. Hall, Thau, and Lewis debate this extensively.  
  2. **No-Undermining Clause (b):** High confidence. NUC satirizes "no-undermining" proposals (e.g., Lewis’ reformulation) as ad hoc fixes acknowledging the bug’s inevitability.  
  3. **New-Principle Faction (c):** High confidence. The "TOC-conditional PP" faction (e.g., Ismael, Loewer) argues credence should defer to chance *given the entire chance-theory*, not just history. Portraying them as middle management debating "circularity" and "S-score bloat" captures their meta-theoretical concerns.  
  4. **Awkward Authority (d):** Moderate-high confidence. Humeanism reduces chance to a "summary" of non-chance facts, creating a "why obey?" problem (Schaffer, Hoefer). The "operationally authoritative" hand-wave is standard.  

  **LEAST CONFIDENT POINT:** Portraying the TOC-conditional faction as primarily worried about "S-score bloat" and "circularity." While these are *related* (simplicity concerns, self-reference), their core argument is about *accuracy* under uncertainty. The joke slightly oversimplifies but retains the spirit of intra-Humean disputes.
