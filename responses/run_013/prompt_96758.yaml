answer: |-
  ## Research Proposal: Judging the Tyrant - The Office of Judgment as the Key to Aquinas's Permissibility of Lethal Resistance

  **Research Question:** Does the permissibility of killing a tyrant in Aquinas's thought depend *primarily* on the **location of the office of judgment** (public authority vs. private assumption), rather than on the distinction between a tyrant by title (*ex defectu tituli*) and a tyrant by exercise (*ex parte exercitii*), and does this framework offer independent explanatory power?

  **The Problem & Standard Reconciliation:**
  Aquinas's remarks on tyrannicide appear contradictory. Commentary on the *Sentences* (IV, dist. 49, q. 1, a. 3) suggests killing a usurping tyrant to free the community can be virtuous. *De Regno* (I, 6) insists removal belongs solely to public authority, warning against private action leading to worse tyranny. The *Summa Theologiae* (II-II, q. 42, a. 2) states disturbing a tyrant isn't sedition, implicitly permitting resistance. Standard interpretations resolve this by:
  1.  **Tyrant Type:** Killing a usurper (defect of title) may be permitted, while killing a legitimate ruler turned tyrant (defect of exercise) is not, or requires more caution.
  2.  **Actor Status:** Public authorities (like representatives or institutions) may act, while private individuals generally may not.

  While plausible, this reading struggles. The *Sentences* commentary doesn't *explicitly* limit permission to usurpers; its focus is on the tyrant's oppressive *actions* and the liberating *intent*. *De Regno's* emphasis on public authority seems absolute, potentially conflicting with the *Sentences'* more permissive tone regarding *any* tyrannicide initiated privately. The *Summa* offers a negative permission (it's not sedition) but doesn't specify *who* can act or under what *positive* conditions lethal force is justified.

  **Hypothesis:** The controlling factor across Aquinas's texts is neither the tyrant's precise legal flaw nor a simple public/private actor dichotomy, but **whether the act constitutes an exercise of a legitimate *office of judgment* charged with the common good.** Permissibility hinges on the act being an execution of jurisdiction (public authority) rather than an act of private vengeance or vigilantism. The tyrant-type distinction is often invoked, but it functions as a secondary indicator of *who possesses the jurisdictional authority* to judge and act, not as the primary criterion itself.

  **Why the Hypothesis Matters & Its Independence:**
  This framework potentially offers a more unified explanation:
  *   In the *Sentences*, the focus on freeing the community *could* implicitly invoke a communal or representative judgment, even if nascent.
  *   *De Regno* explicitly grounds the prohibition in the *lack of jurisdiction* in private persons.
  *   The *Summa* implicitly denies the tyrant the *authority* that makes resistance seditious.
  Crucially, it might **do independent work**:
  1.  **Predicting Ambiguity:** It suggests cases where the tyrant-type distinction is clear, but jurisdictional authority is ambiguous (e.g., a regional governor resisting a central tyrant – is *their* authority sufficient to constitute "public" judgment?).
  2.  **Modern Test Case:** Applied to a military officer contemplating force during a coup:
      *   **Standard View:** Focuses on whether the deposed leader was a tyrant (by exercise?) and the officer's status as "public."
      *   **Jurisdictional Hypothesis:** Focuses on whether the officer's act falls within the legitimate exercise of *their specific office and jurisdiction* as defined by law/constitution *at that moment*. Acting *within* their authorized chain of command to resist a coup might be permissible; acting *outside* it, even against a usurper, might constitute a private assumption of power. Similarly, a private citizen would almost always lack the jurisdictional office, making their lethal action impermissible regardless of the tyrant's flaw. This moves beyond a simple public/private label to the *source and scope* of authority.

  **Methodology (One Semester):**
  1.  **Foundational Concepts (Weeks 1-3):** Establish Aquinas's core political principles: the common good as the end of rule (*ST* I-II, q. 90, a. 2; *De Regno* I, 1), the nature of law and authority (*ST* I-II, q. 90-97), the concept of the *officium* (office/duty), and the nature of judgment (*judicium*) – particularly its public character and requirement of authority (*ST* II-II, q. 60, a. 6; q. 67).
  2.  **Core Texts in Context (Weeks 4-8):** Close sequential analysis of the key passages:
      *   *Sentences Commentary* IV, dist. 49, q. 1, a. 3: Analyze the justification offered (freeing the community), the language of "tyrant," and whether "private" action is implicitly contrasted with a *judicial* framework.
      *   *De Regno* I, 6: Scrutinize the explicit rationale against private action (danger, lack of *authority*), the role of "public authority," and how this authority relates to the common good and judgment.
      *   *Summa Theologiae* II-II, q. 42, a. 2: Examine why resistance isn't sedition, focusing on the tyrant's lack of orientation to the common good and its implications for their *authority* and the legitimacy of resisting judgment.
      *   *Summa Theologiae* II-II, q. 64, a. 3 (Homicide): Analyze the general prohibition and exceptions, focusing on the role of public authority in licit killing.
  3.  **Testing the Hypothesis (Weeks 9-12):**
      *   Apply the "office of judgment" lens systematically to each text. Does it resolve apparent tensions more consistently than the tyrant-type distinction?
      *   Identify instances where Aquinas discusses judgment and authority elsewhere (e.g., *ST* II-II, q. 67 on judges) and see if the logic aligns.
      *   Explicitly test against the tyrant-type distinction: Where does Aquinas *use* it? Does it *determine* the outcome, or is it a *symptom* of the jurisdictional question (e.g., a usurper inherently lacks legitimate authority, making resistance potentially a *restoration* of jurisdiction)?
      *   **Modern Test:** Rigorously apply both frameworks (standard tyrant-type/public-private vs. jurisdictional office) to the hypothetical of a military officer or citizen during a power seizure. Do the frameworks yield different predictions or justifications? Does the jurisdictional hypothesis provide a clearer, more nuanced, or more independently derived answer?
  4.  **Synthesis & Refinement (Weeks 13-14):** Consolidate findings, refine the hypothesis, address counter-evidence, and articulate the proposed resolution to the initial tension.

  **Success Criteria:**
  *   **Success:** The hypothesis provides a coherent, textually supported explanation for Aquinas's varied statements, demonstrating that the "office of judgment" concept is the primary driver and that the tyrant-type distinction is often secondary or derivative. It successfully predicts nuances within Aquinas's texts that the standard view struggles with and offers a distinct, non-collapsing analysis of the modern test case, demonstrating independent explanatory power.
  *   **Failure/Abandonment:** The hypothesis proves unable to reconcile the core texts convincingly; the tyrant-type distinction consistently appears as the primary, determinative factor upon close reading; the concept of "office of judgment" adds no significant value beyond restating the public/private distinction; the modern test case analysis collapses into the standard view with no unique insights.
  *   **Partial Success/Modification:** The hypothesis explains some texts better than others; the jurisdictional factor is *a* significant factor but not *the* primary one; the tyrant-type distinction interacts with jurisdiction in complex ways requiring refinement of the hypothesis.

  **Scope & Limitations:**
  This project will necessarily limit its scope:
  1.  **Focus on Aquinas:** Engagement with secondary literature will be selective, focused on key interpretations of the specific passages under study, not a comprehensive historiography. Later Thomists or critics (e.g., Suárez, Mariana) will not be covered.
  2.  **Core Texts:** The analysis centers on the *Sentences* commentary, *De Regno*, and relevant *Summa* passages (sedition, homicide, judgment). Other potentially relevant Aquinas texts (e.g., commentaries on Romans or Aristotle's *Politics*) will be referenced only if crucial.
  3.  **Medieval Context:** While acknowledging the historical context of tyrannicide debates (e.g., John of Salisbury), the primary focus is on Aquinas's internal logic, not broader medieval discourse.
  4.  **Modern Application:** The modern test case (military officer/citizen) serves solely as a conceptual probe for the hypothesis's independent utility within Aquinas's framework. It will not involve detailed contemporary political theory or case studies.
  5.  **Natural Law Basis:** While Aquinas's natural law theory underpins his politics, the project won't delve deeply into the meta-ethical foundations unless directly relevant to the concepts of authority and judgment.

  **Conclusion:**
  This project proposes a re-evaluation of a classic problem in Aquinas's political thought by prioritizing the concept of the "office of judgment" over the standard tyrant-type distinction. By rigorously testing whether jurisdictional authority is the true linchpin of permissibility across Aquinas's key texts and examining if this framework offers unique analytical power, the research aims to provide a more coherent and potentially more fruitful understanding of Aquinas's complex stance on resisting tyranny. The outcome will either solidify a new interpretive lens, refine the existing consensus, or demonstrate the limits of the proposed hypothesis.
