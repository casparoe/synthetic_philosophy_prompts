prompt: |-
  I've been thinking about Boltzmann brains to much and I've realized my gut reactions don't add up, so I want you to work out what rule I'm actually running — or tell me I'm just inconsistent. I'm not after a survey of what other people have said about this; I want the principle that generates my verdicts, and I want to know where it breaks. No reading list, just do the work.

  Every case below is a cosmology I'm told is true, and the question in each is: what should my current experience — this, right now, sitting here — do to my credence in it?

  1. One-instant freak universe. The universe consists of a single brain that exists for one instant, has exactly my experience, then nothing. My verdict: essentially zero credence. And I don't care that it "predicts my experience with certainty," because predicting the evidence I have no matter what shouldn't buy a theory anything.

  2. The standard setup. The universe runs on forever and thins out to near-nothing, and every so often a thermal fluctuation assembles a brain with a full set of false memories and a coherent stream of experience, which then dissolves. These freaks enormously outnumber ordinary evolved observers like (maybe) me. Verdict: I feel the force — taken at face value the physics says I'm overwhelmingly likely to be a freak — but I also want to say the theory is just refuted by the fact that I'm here doing cosmology. I can't have both, and I hold both.

  3. Long-lived freaks. Same as 2, except the fluctuations produce brains that last decades, live in societies, do science, and differ from ordinary observers only in that their remembered past never happened. Verdict: my sense that something's gone wrong with the theory totally evaporates here. A universe full of people who misremember their history is just a universe with a lot of people in it. So whatever bothered me in case 2 was the brevity, not the false memories.

  4. Ratio scaling. Same as 2, but three freaks per ordinary observer instead of 10^10. Verdict: I shrug — fine, 75% chance I'm a freak, so what. At 10^10:1 I don't shrug; I conclude the theory is broken rather than that I'm a freak. The flip bothers me, because if 3:1 is shrug-worthy then 10^10:1 should be the same shrug, harder.

  5. Counting moments. In case 2, freaks last an instant and ordinary observers last 80 years. Count observer-moments instead of observers and the argument reverses. Verdict: counting moments feels right when the question is "which moment am I?" and counting observers feels right when it's "which kind of observer am I?" — and I know that's restating the question, not answering it.

  6. Nearly-freaks. The theory says there are 10^9 fluctuations that almost assemble a brain but don't. Verdict: these count for nothing, obviously. But then why does a brain that exists for a millionth of a second count? If I can't answer that, my verdicts in 1 and 2 are in trouble.

  7. The duration dial. Freaks lasting one second, one minute, one hour, one year. Verdict: somewhere along that dial my attitude flips from "not an observer at all" to "an observer," I have no idea where, and I suspect there's no fact of the matter. Which is bad, because case 2 turns on it.

  8. Checkable freaks. Same as 2, except the theory also says a freak that lasted long enough to look around would find its memories contradicted by its surroundings, and I've looked and found no contradiction. Verdict: now I do think my coherence is real evidence against the theory. Which tells me my "coherence is evidence" instinct is really a "checkability is evidence" instinct.

  My tentative rule, which I'd like you to test and repair: a theory only gets to move my credence about what I am if it predicts something I could in principle check and don't. If that's right it kills case 2 but maybe not case 3, and I don't know what it does to case 4.

  So: what's the principle, or the smallest set of them? What do they say about cases I haven't listed — a universe where the freaks are immortal and outnumber us 2:1, say, or one where I am the freak and can prove it? And which of my verdicts do I have to give up? Bottom line in your first sentence, then the reasoning. No preamble, no restating my question.
reasoning: |-
  Hmm, the user is grappling with Boltzmann brain paradoxes and wants me to extract the underlying principle behind their intuitive judgments across various thought experiments. They've presented eight detailed cases with their reactions and a tentative rule about "checkability" affecting credence. 

  The user's core tension is between two irreconcilable impulses: their Bayesian training says likelihood ratios should dominate (making freak observers probable), while their intuition rebels against theories where evidence can't be verified. Their cases reveal this conflict escalates when (a) observers are short-lived (case 2 vs 3), (b) ratios become extreme (case 4), or (c) "observer" status is ambiguous (cases 6-7). 

  Their proposed checkability rule explains why they discount case 1 (no chance to verify) and case 2 (freaks dissolve too fast to check), but accept case 3 (long-lived freaks could verify their world). Case 8 confirms this: when freaks *could* falsify their memories but I don't, that *is* evidence. 

  But the rule has gaps. Case 4 shows ratio-sensitivity lingering - why shrug at 3:1 if checkability is all that matters? And their discomfort in case 5 suggests observer indexing matters independently. The deepest crack is case 7: if "observer" is vague, any probability calculation using that category inherits vagueness. 

  The minimal principles I see are: 
  1. **Verifiability constraint**: Theories only gain/lose credence from predictions that are *in principle testable by the observer in their context*. 
  2. **Indexical stability**: Credence about "what I am" depends on whether the theory allows sustained self-location (rejects transient states as "me"). 
  3. **Ratio sensitivity**: When 1 and 2 are satisfied, likelihood ratios matter - but extreme ratios trigger distrust of the model (case 4). 

  For their unlisted cases: 
  - Immortal freaks 2:1? Acceptable if verifiable (principle 1 satisfied). 
  - Provable freak? Then "I can check" *confirms* the theory. 

  They must surrender ratio insensitivity (case 4 shrug) or accept that case 2's physics might be correct despite intuition. The verifiability principle salvages most verdicts but demands embracing epistemic boundedness: we can't evaluate theories that make our existence untestable.
answer: |-
  **Bottom line:** Your credence shifts only when a theory makes testable predictions about your *ongoing, stable context* as an observer, and you must abandon your ratio sensitivity in case 4.

  **The principles:**  
  1. **Verifiable Stability Principle (VSP):** A cosmology gains/loses credence only if it predicts *testable consequences within your stable observational context*. "Stable" means you persist long enough to potentially gather evidence.  
  2. **Observer Indexing Principle (OIP):** You reason from "I am *this specific moment* of experience" only if the theory supports sustained observer identity across time. Otherwise, you default to "I am *this observer-type*".  

  **How it works:**  
  - **Case 1 (Freak instant):** Fails VSP. No stable context exists to test anything. Your credence doesn't budge (as you said).  
  - **Case 2 (Standard freaks):** Fails VSP. Freaks dissolve instantly, so "being a freak" isn't testable. Your intuition that the theory is refuted wins—coherence *is* evidence because you *could* have found incoherence (linking to Case 8).  
  - **Case 3 (Long-lived freaks):** Satisfies VSP. Freaks can verify their surroundings. False memories become irrelevant; the theory survives.  
  - **Case 4 (Ratio scaling):** VSP dominates. Ratios don’t matter if VSP fails (short freaks). If freaks are long-lived (VSP satisfied), *any* ratio is shrug-worthy. You must drop your 10^10:1 objection.  
  - **Case 5 (Counting moments):** OIP applies. For short-lived freaks (no sustained identity), you count observer-types ("which observer am I?"). For long-lived observers, you count moments ("which moment am I?").  
  - **Case 6 (Near-freaks):** Fails OIP. Near-freaks aren’t observers—no moment of experience to index. Confirms VSP requires a *realized* observer context.  
  - **Case 7 (Duration dial):** VSP/OIP boundary. "Observer" status requires sufficient duration to potentially test predictions. Vagueness here is unavoidable but irrelevant if VSP fails.  
  - **Case 8 (Checkable freaks):** Confirms VSP. Testability (and your failure to falsify) provides evidence.  

  **Unlisted cases:**  
  - **Immortal freaks (2:1):** VSP satisfied. You shrug—75% chance you're a freak is acceptable.  
  - **Provable freak:** VSP satisfied. If you *can* prove it (e.g., physics contradicts your memories), the theory gains credence.  

  **Verdicts to abandon:**  
  - **Case 4’s ratio sensitivity:** With VSP, ratios only matter if freaks are long-lived. 10^10:1 short freaks still fail VSP → theory refuted. 10^10:1 long freaks → shrug.  
  - **Case 2’s ambivalence:** VSP resolves it—the theory *is* refuted because you’re in a stable context.  

  **Why this works:** Your "checkability instinct" (Case 8) is VSP in action. OIP handles the observer/moment duality. Together, they explain all verdicts except Case 4's ratio flip, which is inconsistent and must go.
