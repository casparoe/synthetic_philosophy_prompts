prompt: |-
  I'm running a session at our local rationalist meetup next month on Gödel's incompleteness theorems -- specifically the stuff people drag them into outside of math: minds vs machines, "there are truths we can never know", why a system can't prove its own consistency, the whole Penrose-flavored song and dance. Audience is smart but not logicians; a couple have done a bit of proof, most haven't touched a formal system since high school geometry. I need a teaching plan, not the lecture itself.

  You're a philosopher of math who's taught this to non-specialists a bunch of times, so think carefully about the actual dependency structure here rather than handing me the standard pop-sci arc. Before you lay anything out, brainstorm to yourself: what does someone need already in their head before "true but unprovable" even parses, and in what order do those pieces have to arrive?

  Then give me the plan: the order the ideas have to go in and why each one depends on the last; the single concrete example or toy system that should carry the whole thing, with what it needs and what it must not do so it doesn't quietly lie about the real theorem; the misconceptions you'd expect this crowd to walk in with or form -- I'm betting on "incompleteness = inconsistency", "it proves math is subjective or limited", "it shows humans beat computers", "undecidable just means we haven't cracked it yet" -- and for each, exactly where in the sequence I should head it off. Also tell me what I should openly refuse to cover at this level, and the one question I can ask at the end to see whether they've actually got the idea rather than just nodded along at the spooky bits.

  Dont give me readings, I want the plan.
