  Below is a decision tree designed to guide your group from concrete judgments to a principled position on criminalization, using only your specified cases. The tree has 10 terminal positions ("leaves"). Each question is answerable without knowing which position it leads to, and positions are named only at the end. The tree uses your six cases consistently to test commitments.

  **Decision Tree: May Harmless Conduct Be Criminalized?**

  ### Instructions
  Answer each question based on your intuitive judgment about the cases. Focus on whether the conduct *may* be criminalized in principle, not whether it *should* be in a specific context. Use "harm" strictly: physical injury, psychological trauma, or tangible loss to others (not offense, disgust, or moral degradation alone).

  ---

  #### Question 1: Can the *immorality* of a harmless act (no harm to others) ever be a reason for criminal law to forbid it?
  - **No** ➔ Proceed to Question A.  
  - **Yes** ➔ Proceed to Question B.  

  ---

  ### Branch A (Harm Principle Framework)
  #### Question A: Can criminal law ever prohibit conduct solely to protect the actor from self-harm?  
  - **No** ➔ **Leaf 1: Strict Harm Principle**  
    - *Position*: Only harm to others justifies criminalization. Paternalism is invalid.  
    - *Awkward commitment*: Must permit consensual acts that risk severe self-harm (e.g., branding, fight club) if no third party is hurt.  
    - *Embarrassing case*: (iv) Fight club (consensual, supervised, but may be lethal).  
  - **Yes** ➔ **Leaf 2: Harm Principle with Paternalistic Exception**  
    - *Position*: Criminal law may prevent self-harm (e.g., irreversible injury, death), even if consensual.  
    - *Awkward commitment*: Must ban acts like kidney sales or branding if deemed self-harming, even if participants are informed and willing.  
    - *Embarrassing case*: (ii) Branding club (permanent scars, but participants are paid and consenting).  

  ---

  ### Branch B (Moralistic Framework)
  #### Question B: Is the reason for criminalization the act's *inherent wrongness*, or the *bad consequences* of allowing it?  
  - **Inherent wrongness** ➔ Proceed to Question C.  
  - **Bad consequences** ➔ Proceed to Question D.  

  ---

  #### Branch B1: Inherent Wrongness (Question C)
  #### Question C: Is the wrongness rooted in the actor's **self-degradation** (e.g., loss of dignity, autonomy, or humanity)?  
  - **Yes** ➔ **Leaf 3: Protection from Self-Degradation**  
    - *Position*: Criminal law may protect a person from acts that degrade them (even if consensual and not physically harmful).  
    - *Awkward commitment*: Must criminalize acts like kidney sales or branding if deemed dehumanizing, overriding consent.  
    - *Embarrassing case*: (iii) Kidney market (called "degrading," but reduces black-market harms).  
  - **No** ➔ Proceed to Question E.  

  #### Question E: What makes the act inherently wrong?  
  - **Community's actual morality** ➔ **Leaf 4: Conventionalism**  
    - *Position*: Whatever the community sincerely condemns may be criminalized (no need for objective immorality).  
    - *Awkward commitment*: Must criminalize a harmless practice if widely condemned, even if rational or culturally specific (e.g., goat killing).  
    - *Embarrassing case*: (v) Religious goat killing (harmless but seen as "barbaric" by the majority).  
  - **Genuine (objective) immorality** ➔ **Leaf 5: Objective Moralism**  
    - *Position*: Only genuinely wrong acts may be criminalized; community opinion is irrelevant if mistaken.  
    - *Awkward commitment*: May require criminalizing acts the community accepts (e.g., body modification) if deemed objectively wrong.  
    - *Embarrassing case*: (vi) Body modification (participants happier; community may not condemn).  

  ---

  #### Branch B2: Bad Consequences (Question D)
  #### Question D: Which bad consequence is primary?  
  - **Offense to others** (distress, disgust) ➔ **Leaf 6: Offense Principle**  
    - *Position*: Offense alone can justify criminalization if widespread and unavoidable.  
    - *Awkward commitment*: Must ban rabbit feeding or goat killing if deeply offensive, even if private and harmless.  
    - *Embarrassing case*: (i) Rabbit feeding (disgusts neighbors but occurs on private property).  
  - **Erosion of shared morality** (society fragments without it) ➔ Proceed to Question F.  
  - **Coarsening of moral climate** (e.g., for children) ➔ **Leaf 7: Moral Climate Protection**  
    - *Position*: Criminal law may preserve a wholesome environment, especially for youth.  
    - *Awkward commitment*: Must ban acts like branding or body modification if deemed "coarsening," ignoring adult consent.  
    - *Embarrassing case*: (vi) Body modification (done privately but may influence societal norms).  
  - **Harm to the actor** (not covered in Branch A) ➔ *This path is incoherent* (harm to actor is already addressed in Branch A; no one defends it twice).  

  ---

  #### Question F: For "erosion of shared morality," is the morality being protected...  
  - **The community's actual morality** ➔ Proceed to Question G.  
  - **The genuinely correct morality** ➔ *This combination is unattractive* (why would incorrect morality hold society together? No one defends it).  

  #### Question G: Is the claim that shared morality prevents societal collapse...  
  - **An empirical prediction** ➔ **Leaf 8: Societal Fragmentation Prevention**  
    - *Position*: Criminal law may enforce norms to avoid observable social breakdown (e.g., rising crime, conflict).  
    - *Awkward commitment*: Must provide evidence that tolerating something like a kidney market would cause collapse.  
    - *Embarrassing case*: (iii) Kidney market (may not cause collapse; could even reduce harm).  
  - **A conceptual claim** (morality defines society) ➔ **Leaf 9: Communitarian Preservation**  
    - *Position*: Shared morality is constitutive of society; criminal law may protect it intrinsically.  
    - *Awkward commitment*: Must criminalize any deviation from core norms (e.g., fight club) as "disintegrating," regardless of harm.  
    - *Embarrassing case*: (iv) Fight club (private, consensual, but deviates from norms of non-violence).  

  ---

  #### Final Question (For all paths except Strict Harm Principle and State Standing)
  #### Question H: If there is a reason to oppose the conduct (harm or immorality), should the state...  
  - **Criminalize it** (punish offenders) ➔ *Your position is the leaf you reached.*  
  - **Only refuse to facilitate it** (e.g., void contracts, deny licenses) ➔ **Leaf 10: Non-Facilitation**  
    - *Position*: The state may withhold support (e.g., invalidate waivers, refuse permits) but not criminally punish harmless acts.  
    - *Awkward commitment*: Must allow branding or fight clubs to occur if privately arranged, while denying legal recognition.  
    - *Embarrassing case*: (ii) Branding club (state won't punish but might ban contracts/subscriptions).  

  ---

  ### Special Leaf
  - **Leaf 11: State Lacks Standing** (reached from Question B0 below).  
    - *Position*: Even if conduct is immoral or harmful, the state has no authority to enforce morality; only direct harm to others justifies intervention.  
    - *Awkward commitment*: Must permit all cases if no harm to others, even if deeply unsettling.  
    - *Embarrassing case*: (i) Rabbit feeding (state cannot act despite disgust).  

  *Note: This leaf is reached via a hidden path:*  
  - At Question 1 (if "Yes"), add **Question B0: Does the state have standing to enforce morality?**  
    - **No** ➔ **Leaf 11: State Lacks Standing**  
    - **Yes** ➔ Proceed to Question B (as before).  

  ---

  ### Tree Summary
  - **10 leaves**: Covering all requested positions, with 1 incoherent/unattractive path (marked).  
  - **Key**:  
    - Leaf 1: Strict Harm Principle  
    - Leaf 2: Harm Principle + Paternalism  
    - Leaf 3: Protection from Degradation  
    - Leaf 4: Conventionalism  
    - Leaf 5: Objective Moralism  
    - Leaf 6: Offense Principle  
    - Leaf 7: Moral Climate Protection  
    - Leaf 8: Societal Fragmentation Prevention  
    - Leaf 9: Communitarian Preservation  
    - Leaf 10: Non-Facilitation  
    - Leaf 11: State Lacks Standing  

  ---

  ### Your Position Applied
  **Where the tree puts you**:  
  - You start against state policing of private life and refuse to use disgust as a reason.  
  - **Path**:  
    1. Q1: "No" (immorality alone isn't a reason) ➔ Branch A.  
    2. QA: "No" (no paternalism) ➔ **Leaf 1: Strict Harm Principle**.  
  - **What you must give up to stay here**:  
    - Permitting cases like (iv) the fight club (lethal but consensual) and (ii) branding (extreme self-harm), as they involve no harm to others.  
    - If you cannot accept this, you must move to **Leaf 2** (Harm + Paternalism) and criminalize branding/fights as self-harming, or **Leaf 10** (Non-Facilitation) to deny waivers/licenses without punishment.

  ---

  ### Notes on Cases and Ambiguities  
  - **Cases that don't distinguish leaves**:  
    - (vi) Body modification: Does not cleanly separate **Leaf 5** (Objective Moralism) from **Leaf 7** (Moral Climate). Both could ban it.  
    - *Resolving case*: Add "a parent who pays to have their infant's ears surgically pointed for aesthetic reasons." **Leaf 5** might allow it if not objectively wrong; **Leaf 7** would ban it to protect moral climate.  
  - **Incoherent/unattractive paths**: Marked in the tree (e.g., protecting "incorrect" morality for societal cohesion).  
  - **Non-facilitation**: Half your group may end at **Leaf 10**, rejecting criminalization but supporting non-support (e.g., voiding fight club waivers).  

  This tree provides a clear path from intuitions to principles, using your cases to reveal tensions. Print and distribute for your group's use.
