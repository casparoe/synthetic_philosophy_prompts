prompt: |-
  So I run a small commemoration-review office for a mid-sized city — two paid staff, a nine-person volunteer commission, roughly $180k and eighteen months to work with — and after a couple of ugly years of ad hoc fights over a statue, a school, and a street name, the council has told us to do this properly this time. The problem is the commission keeps stalling: every concrete call (does this statue stay or go, does this school get renamed, does this street get a plaque) turns into a rerun of the same bigger disagreements, and we never land anywhere.

  I've come to think teh fix is to work out, in order, which of the underlying conceptual questions we actually have to settle before any of the particular cases can be decided defensibly. So that's what I'm asking you: of the open questions in the ethics of commemoration, which should we spend our limited thinking-time on first, and why?

  Some context on what's already on the table, since it might change the ordering. Two proposals keep floating around and I can't tell if they're good ideas or traps. The first is a sunset clause: every memorial or honorific name would automatically expire after, say, 25 years unless the commission re-authorizes it, so nothing is permanent by default and we're forced to revisit it. The second is a two-register approach: a marker would carry one register for what the honoree is documented to have actually done and another for what the monument was originally built to say, kept visibly separate rather than blended into one inscription. We also keep tripping over whether our principles should be the same for a bronze figure, a street sign, and a building named after a donor, or whether the medium changes the ethics — and over who even counts as having standing to demand a change: current residents, descendants of the honoree, descendants of the people the honoree wronged, or the broader public.

  What I want is a defended agenda, not a survey. Tell me which questions are upstream of which — which ones, if we settled them, would make several other questions answer themselves, and which are just loud but don't actually gate any decision we have to make. Rank them. Be explicit about your criteria (importance, tractability for a small non-specialist commission, how many other questions depend on the answer, whether the question is genuinely live or actually settled enough that we can just act) and about the trade-offs when those criteria pull apart. Say what would move a question up or down our list — a court ruling, a shift in what residents want, new historical evidence, a change in how the cases get litigated in the press, whatever — and tell me which questions we should deliberately not spend time on because their answer wouldn't change anything we actually do. Assume we can't hire a philosopher and have maybe one reading-heavy month in total.

  And please be honest about the cases where I might be wrong to assume there's a single right answer the commission could converge on at all, as opposed to a decision we just have to make and own.
reasoning: |-
  Okay, the user runs a small commemoration-review office and is stuck in endless debates over specific cases like statues and street names. They need a prioritized list of conceptual questions to resolve first to break the gridlock. Let me unpack their situation.

  They've mentioned recurring arguments without resolution. The commission can't decide on concrete cases because they keep revisiting the same fundamental disagreements. The user has proposed a sunset clause and a two-register system but isn't sure if these are solutions or traps. They're also struggling with whether different mediums (statues vs. street signs) require different ethical approaches and who gets a say in changes.

  The user wants a defended agenda—prioritized questions that, once answered, will make other decisions easier. They need clarity on what's foundational versus what's noise. The constraints are tight: limited time, no philosopher, and a diverse commission of non-specialists. 

  First, I need to identify the core issues causing the stalemate. The underlying conflicts seem to be about the purpose of commemoration (honor vs. education), who decides, and how to handle historical complexity. The sunset clause and two-register ideas are structural solutions, but without agreement on principles, they might not work. 

  The key is to find which questions are upstream. For example, deciding the primary purpose of commemoration will influence criteria for inclusion/removal and even the sunset clause's viability. If the purpose is education, then the two-register system makes sense. If it's honor, then sunset clauses might be necessary to reassess legacies.

  Who has standing is another critical question. Without defining whose voices matter most, any decision will be contested. This ties into legitimacy and whose values the commission represents. Current residents' views might shift over time, affecting sunset renewals.

  Medium differentiation is important but secondary. Once the purpose is clear, criteria for each medium can flow from that. For example, statues as honorific might face stricter scrutiny than informational plaques.

  Questions about harm and historical context are downstream. They depend on the criteria set by the purpose. Similarly, the sunset clause and two-register are implementation tools, not foundational principles. Discussing them too early could lead to circular debates.

  Trade-offs: Balancing importance vs. tractability. Purpose and standing are crucial but might be harder to settle. Starting with a straw poll on purpose could build momentum. Historical complexity is important but can be addressed through processes once criteria are set.

  Avoiding traps: Don't get bogged down in medium specifics before principles. Also, some questions like "single right answers" might not be resolvable; the commission needs to accept that some decisions require judgment calls, not absolutes.

  Prioritization: Purpose first, then standing, then criteria. After that, process questions like sunset clauses become manageable. Leave implementation details for last. This approach addresses the root causes of gridlock and provides a clear path forward.
answer: |-
  Based on your situation – recurring gridlock, limited time/resources, and the need for defensible decisions – here’s a **prioritized agenda of upstream conceptual questions**, designed to break stalemates by tackling foundational issues first. The ranking balances **impact** (how many downstream decisions it unlocks), **tractability** (feasibility for your commission), and **necessity** (whether it *must* be settled before action).

  ### Core Ranking Criteria
  1.  **Impact:** How many concrete decisions (statue removal, renaming, plaque text) does answering this unlock?
  2.  **Tractability:** Can a non-specialist group reach a *workable operational principle* (not philosophical perfection) with reasonable effort?
  3.  **Necessity:** Is this a genuine prerequisite for defensible action on *any* specific case?
  4.  **Avoiding Traps:** Does focusing here prevent wasting time on unproductive debates or questions settled elsewhere?

  ### The Prioritized Agenda
  **(Focus intensely on 1-3 first; 4-6 become manageable *after*; avoid 7-8 for now)**

  1.  **What is the PRIMARY PURPOSE of commemoration in our city *today*?**
      *   **Why Upstream?** This dictates *everything*. Is it primarily:
          *   **Honorific?** (Celebrating virtue/achievement worthy of emulation)
          *   **Historical/Memorial?** (Marking significant events/people, regardless of moral purity)
          *   **Educational?** (Using the marker to teach complex history/context)
          *   **Community Identity/Healing?** (Reflecting current shared values or addressing past wrongs)
      *   **Impact:** Answers this question dictate the criteria for *all* decisions (stay/go, rename, plaque text). It resolves debates about "permanence" (honorifics demand higher standards) vs. "historical value" vs. "educational opportunity." It directly informs the "two-register" idea (great for education/context, irrelevant for pure honor).
      *   **Tractability:** Frame it practically: "What do we *want* these things to *do* for our citizens now?" Poll the commission anonymously: "Rank these purposes 1-4." Aim for a dominant purpose, acknowledging secondary roles.
      *   **Trade-off:** May require accepting that the purpose has *shifted* from original intent. This is crucial. Avoid getting bogged down in "original intent" here – that comes later.
      *   **Move Up/Down:** Public outcry over a specific case might force this to the top. A clear council mandate could simplify it.

  2.  **Who has PRIMARY STANDING or LEGITIMATE VOICE in demanding change/continuance?**
      *   **Why Upstream?** Resolves endless "who gets a say" arguments paralyzing each case. Without this, every decision feels illegitimate to *someone*.
      *   **Impact:** Clarifies whose petitions/responses the commission *must* prioritize, whose feelings carry *official* weight, and grounds "community impact" assessments. Makes public consultation processes purposeful.
      *   **Tractability:** Define a clear, operational hierarchy (e.g.):
          *   Tier 1: Directly harmed groups (verified descendants, affected communities) & Current Residents (via petition thresholds/council reps).
          *   Tier 2: Historical societies, academic experts, honoree descendants.
          *   Tier 3: General public opinion/media.
      *   **Trade-off:** Requires acknowledging that not all voices are equal in the *official* process. Prioritizing current residents may feel exclusionary to descendants of the wronged; prioritizing the wronged may feel unfair to others. Be explicit about the *reason* for the hierarchy (e.g., "Current residents live with the impact daily").
      *   **Move Up/Down:** A major lawsuit or intense pressure from a specific group could force this earlier. Legal rulings on standing could change it.

  3.  **What are the MINIMUM ETHICAL THRESHOLDS that make someone/something UNSUITABLE for PUBLIC HONORIFIC commemoration (statues, building names)?**
      *   **Why Upstream?** Provides the core test for removal/renaming of *honorific* markers (the most contentious). Distinguishes "bad" from "complicated."
      *   **Impact:** Directly answers "should this statue go?" or "should this school be renamed?" for the most honorific forms. Creates a defensible standard.
      *   **Tractability:** Focus on establishing clear, specific "bright lines" *your commission can apply*. Examples:
          *   "Documented commission of genocide, slavery, or crimes against humanity."
          *   "Core achievements inseparable from profound injustice (e.g., founding a city *through* violent dispossession)."
          *   "Violation of fundamental human rights that was *central* to their life/work, not merely a product of their time."
      *   **Trade-off:** Requires accepting that context matters ("product of their time" is relevant *unless* they exceeded norms egregiously), but some actions are absolute disqualifiers. Avoid listing specific crimes; focus on *categories* and *severity*. **Crucially:** This defines *honorific* commemoration. Other purposes (history/education) have different thresholds (see #1).
      *   **Move Up/Down:** New, damning historical evidence about a major figure could make this urgent. A commission consensus on #1 (Purpose) might simplify this.

  4.  **How does the FORM/MEDIUM of commemoration (statue vs. plaque vs. street name) change the ETHICAL IMPERATIVE or required PROCESS?**
      *   **Why Now?** This becomes essential *after* #1-3. The "loud but not gating" debate about sameness is a trap. Medium *does* matter significantly.
      *   **Impact:** Allows tailored processes and standards. Renaming a donor-funded science building needs a different approach than removing a Confederate general statue. Validates the "two-register" concept for certain mediums.
      *   **Tractability:** Create a simple matrix based on #1 (Purpose) and Medium:
          *   **Statues/Busts:** Strongly Honorific -> Apply strict Threshold (#3). High bar for removal. Sunset clauses (#1 Purpose dependent) might apply.
          *   **Building Names (Honorific):** Honorific -> Apply Threshold (#3). Process should consider donor agreements (pragmatism).
          *   **Building Names (Donor):** Primarily Contractual/Acknowledgment -> Lower bar for change, focus on current community alignment or reputational harm. Sunset clauses more feasible.
          *   **Street Names:** Often Historical/Utilitarian -> Higher bar for change due to disruption. Focus on severe Threshold violations (#3) or profound community offense. Plaques offering context ideal here.
          *   **Plaques/Markers:** Ideal for Education/Memorial -> Low bar for *adding* context ("two-register" shines here). Removal less common than augmentation.
      *   **Trade-off:** Requires effort to define categories but prevents one-size-fits-all paralysis. Accepts that pragmatism (e.g., donor contracts) plays a role in non-honorific naming.

  5.  **How do we handle COMPLEXITY, CONTEXT, and EVOLVING UNDERSTANDINGS?** (The "Two-Register" / "Sunset Clause" Question)
      *   **Why Here?** These are *implementation tools* for principles established in #1-4. Discussing them *before* #1-4 is a major trap leading to circular arguments.
      *   **Impact:** Provides practical mechanisms to operationalize Purpose (#1), address Standing (#2) concerns over time, and manage Complexity.
      *   **Tractability:** Evaluate proposals *against* your agreed Purpose (#1):
          *   **Sunset Clause:** Strongly aligns with a *Honorific* purpose requiring periodic re-earning of esteem. Contradicts a *Historical/Memorial* purpose. Complex and resource-intensive – is it feasible long-term? Best for *new* dedications initially.
          *   **Two-Register:** Excellent fit for an *Educational* or *Historical* purpose. Allows honoring *history* without necessarily endorsing *honor*. Less relevant for pure Honorifics. Simpler to implement on *new* markers or when *adding* context.
      *   **Trade-off:** Sunset clauses are administratively heavy. Two-registers require careful wording to avoid confusion. Neither is a magic bullet; both are tools dependent on your core purpose.

  6.  **What weight do we give ORIGINAL INTENT vs. CURRENT MEANING/IMPACT?**
      *   **Why Later?** This becomes relevant *after* knowing your Purpose (#1). If Purpose is Honorific, original intent matters significantly. If Purpose is Education/Community Healing, current impact dominates.
      *   **Impact:** Guides interpretation of contested symbols and the weight given to historical context vs. present-day offense.
      *   **Tractability:** Frame it as: "Based on our Purpose (#1), when these conflict, which generally prevails?" Avoid absolutes; case specifics matter, but a default principle is needed.

  ### Questions to Deliberately Avoid (For Now)
  7.  **Is there a single, objectively "right" historical interpretation or ethical judgment for each case?**
      *   **Why Avoid?** This is a philosophical rabbit hole. The answer is almost always **no**. Your commission's job isn't to find universal Truth, but to make *defensible, values-based decisions* for *your community* using agreed principles (#1-5). Acknowledge ambiguity upfront: "We act based on our best understanding and shared principles, knowing interpretations evolve."
  8.  **Defining exhaustive lists of "good" vs. "bad" actions across all historical contexts.**
      *   **Why Avoid?** Impossible and paralyzing. Focus on establishing clear, actionable *thresholds* (#3) and *processes* (#4, #5) instead of debating every nuance of every historical figure endlessly. Use specific cases to *test and refine* your thresholds, not to start from scratch each time.

  ### Critical Realities & How to Proceed
  *   **No Perfect Consensus:** You won't get unanimous agreement on #1 or #3. Aim for a **supermajority** (e.g., 7 of 9 commissioners) on core principles. Record dissent clearly but move forward.
  *   **Own the Decision:** Transparency is key. Document *how* you answered #1-5 and *why* a specific decision follows from them. "Based on our primary purpose of public education (Principle 1) and the severe ethical violation threshold (Principle 3), we recommend relocating the statue of X to a museum with an augmented plaque (Principle 5)."
  *   **Process Over Perfection:** Dedicate 2-3 focused meetings to **#1 (Purpose)**. Use a facilitator. Start with anonymous input. Force a ranked-choice vote if needed. Then move to **#2 (Standing)** and **#3 (Thresholds)**. Draft short, clear policy statements.
  *   **Pilot the Principles:** Apply the draft principles to *one* mid-level contentious case (maybe a street name or a donor building, not *the* statue). Test their workability. Refine.
  *   **Sunset & Two-Register are Tools, Not Answers:** Evaluate them *only after* #1 is settled, through the lens of your purpose and feasibility. Don't let them dominate early discussions.
  *   **Medium Matters:** Don't ignore #4. Once principles exist, defining the matrix will save immense time on case-by-case arguments about "it's just a street sign."

  By rigorously tackling Purpose, Standing, and Ethical Thresholds first, you create the essential scaffolding. The gridlock on specific cases stems from the lack of this foundation. Build it, and the path forward – even if difficult – becomes clear and defensible.
