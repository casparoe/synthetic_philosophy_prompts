prompt: |-
  i'm in a reading group thats working through Keynes on probability and we keep tripping over this one-liner people throw around: you can't put a probability on a unique event. last week someone used it to shut down a discussion about expected-value reasoning for a one-off decision (take the job or not, invade or not, lockdown or not) -- his claim was that since theres no reference class and no long-run frequency, any probability you assign is meaningless, so expected-value reasoning is a category error. i think theres something right in there but that it's carrying way too much weight. can you lay out the distinct precise claims that sentence could be making -- what kind of probability is being denied, defined for what, relative to whose evidence, on what grounds -- and for each one say whether its trivial, substantive and defensible, or just false, and which of those readings actually gets him his conclusion that expected-value reasoning doesn't apply? also say where Keynes himself lands among them, if anywhere. give me a menu with verdicts, not a single answer.
reasoning: |-
  Okay, the user is in a reading group studying Keynes on probability and they're stuck on this one-liner: "you can't put a probability on a unique event." Someone used it to argue against expected-value reasoning for one-off decisions like taking a job or implementing lockdowns. The user wants me to break down the possible interpretations of that claim, evaluate each one, see which support the conclusion that expected-value reasoning doesn't apply, and mention Keynes's stance on each. Let me unpack this step by step.

  First, I need to identify the different ways this statement could be interpreted. The key phrases here are "unique event," "probability," and "meaningless." Each interpretation will hinge on how these terms are defined. Let me brainstorm the possible angles. There's the frequentist view where probability is tied to long-run frequencies. If an event is unique, there's no repeatable experiment, so frequency probability doesn't apply. That seems defensible, but does it invalidate expected-value reasoning? Probably not, since subjectivists like Bayesians would still assign subjective probabilities.

  Then there's the logical interpretation, maybe related to Keynes's own ideas. He believed in objective logical probabilities, which require a logical basis. For unique events without sufficient evidence or logical structure, maybe such probabilities can't be defined. But is that actually what Keynes argued? I recall that Keynes did think some probabilities were indeterminate, especially without comparable evidence.

  Another angle is the subjectivist view. Here, probabilities are degrees of belief. A subjectivist would argue that you can always assign a probability based on your beliefs. So the claim might be false in that framework. But the user's interlocutor might be rejecting subjective probabilities as meaningless. That's a substantive debate about what counts as valid probability.

  Epistemological and semantic claims are also possible. The idea that without frequencies, probability statements have no truth value or are cognitively meaningless. That's a strong positivist stance, which is controversial. Or maybe it's about decision theory: that expected value requires known probabilities, which unique events lack. But that seems weak since decision theory often uses subjective probabilities.

  I should also consider which interpretations support the conclusion that expected-value reasoning is invalid. If probability is only frequentist, then yes, but expected-value can use other probabilities. If Keynes is against indeterminate probabilities, that might align, but he didn't reject all unique event probabilities. The user mentioned the reference class problem, which complicates assigning probabilities based on classes. That's a practical issue, but not a categorical denial.

  Keynes's position: He allowed for logical probabilities in unique events if there's a rational basis. But when evidence is insufficient, probabilities might not be comparable or numerical. So he'd fall somewhere in the middle—some unique events can have probabilities, others not. His indeterminate probabilities idea is key here.

  The user's deeper need might be to clarify whether their peer's shutdown of discussion is justified. They want a nuanced breakdown to counter the one-liner's overuse. Providing a menu with verdicts helps them see which arguments hold water and which don't, empowering their reading group discussions. They probably need to navigate between frequentist and subjectivist views, understanding where Keynes fits in. Highlighting that only strong frequentist or positivist views support the conclusion, but those are contentious, while other interpretations allow for expected-value reasoning even in unique events.
answer: |-
  Here's a breakdown of the distinct claims embedded in "you can't put a probability on a unique event," along with verdicts and their relevance to the conclusion that expected-value reasoning is invalid for one-off decisions. I'll also note Keynes's position for each.

  **The Menu of Interpretations & Verdicts:**

  1.  **Interpretation: Frequentist Definitional Claim**
      *   **Claim:** Probability *is defined as* the long-run relative frequency of an outcome in a hypothetical infinite sequence of identical, repeatable trials. A unique event, by definition, lacks such a sequence. Therefore, it is *logically impossible* to assign a frequentist probability to it.
      *   **Type of Probability Denied:** Frequentist (Objective Frequency)
      *   **Grounds:** Definitional. Probability *just is* long-run frequency.
      *   **Verdict:** **Trivially True (within Frequentism).** If you accept the frequentist definition, this is a tautology. A unique event fails the definition's core requirement of repeatability.
      *   **Gets Him His Conclusion?** **Partially, but Misapplied.** Frequentist probability *itself* isn't defined for unique events. However, expected-value reasoning *does not require* frequentist probability. It requires *some* quantification of uncertainty. Frequentists often resort to "personal probability" or decision rules (minimax, etc.) for unique decisions precisely *because* their definition fails here. Denying frequentist probability ≠ denying *any* probabilistic reasoning.
      *   **Keynes:** **Rejects Frequentism.** Keynes explicitly argued probability is *not* fundamentally about frequencies (Book I, Chapter VIII). He saw frequencies as evidence *for* a deeper logical relation, not the definition of probability itself.

  2.  **Interpretation: Logical Positivist / Verificationist Claim**
      *   **Claim:** A probability statement is only meaningful if it can be empirically verified (or falsified) through observation of frequencies. Since a unique event occurs only once, no such verification is possible. Therefore, any probability statement about it is cognitively meaningless/nonsensical.
      *   **Type of Probability Denied:** Any probability claim lacking empirical verifiability via frequency.
      *   **Grounds:** Semantic/Epistemological (Verificationism).
      *   **Verdict:** **Substantive and Highly Controversial (False for Subjectivists/Bayesians/Keynesians).** This relies on the discredited strong verificationist principle of meaning. Subjectivists/Bayesians define meaning via coherence of belief degrees. Keynes defined it via logical relations of evidence.
      *   **Gets Him His Conclusion?** **Only if you accept Verificationism.** If probability statements about unique events are meaningless, then using them in expected-value calculations is indeed nonsensical *by this specific semantic standard*. However, this standard is widely rejected outside of strict early logical positivism.
      *   **Keynes:** **Rejects Verificationism.** Keynes's logical probabilities *are* meaningful propositions about the relation between evidence and conclusion, independent of future frequency verification. The meaning comes from the logical structure, not verifiability.

  3.  **Interpretation: Keynesian Logical Indeterminacy Claim**
      *   **Claim:** Probability is an objective logical relation between a body of evidence and a conclusion. For a truly unique event lacking sufficient relevant evidence or comparable precedents (forming a clear "reference class"), this logical relation may be indeterminate or non-numerical. We cannot rationally assign a *definite* (or sometimes even comparable) probability *value*.
      *   **Type of Probability Denied:** Definite (numerical) Keynesian logical probability. (Indefinite or non-numerical probability relations might still exist).
      *   **Grounds:** Epistemological (Limits of evidence and logical structure).
      *   **Verdict:** **Substantive and Defensible (a core Keynesian point).** Keynes argued many probability relations, especially involving unique historical events or complex future contingencies, are only partially ordered or indeterminate (Book III, Chapters 15, 17, 29).
      *   **Gets Him His Conclusion?** **Potentially, but Nuanced.** If no definite probability can be rationally assigned (not even a range or order), then calculating a precise expected value is impossible *using Keynesian logical probabilities*. However, Keynes acknowledged we often must act on vague probabilities or "weight of argument" (Chapter VI). He wouldn't necessarily say *no* reasoning under uncertainty is possible, just that formal numerical EV calculation might be unattainable/inappropriate for *that specific event given the evidence*. This denies *precise numerical* EV reasoning, not necessarily *all* comparative reasoning under uncertainty.
      *   **Keynes:** **Endorses this view.** This is central to Keynes (e.g., Treatise, Chapter 3 on "The Measurement of Probabilities"). He explicitly contrasts cases where numerical probabilities are possible vs. where they are not.

  4.  **Interpretation: Subjectivist Coherence Claim (Misapplied)**
      *   **Claim:** Subjective probabilities (degrees of belief) are only coherent/meaningful if they are *calibrated* against long-run frequencies. Since unique events lack frequencies, subjective probabilities assigned to them are arbitrary, unconstrained, and therefore "meaningless" in a practical sense for decision-making.
      *   **Type of Probability Denied:** Uncalibrated/Arbitrary Subjective Probability.
      *   **Grounds:** Practical Epistemology (Need for empirical grounding).
      *   **Verdict:** **Substantive and Partially Defensible, but Not Absolutely True.** While calibration to frequencies is a *desirable* feature for refining subjective beliefs and avoiding arbitrariness (and crucial in many domains), strict subjectivists (e.g., de Finetti) argue coherence (avoiding Dutch books) is the *only* requirement for meaningfulness. Decisions *can* be made on coherent subjective probabilities even without frequencies. The claim overreaches by calling them *categorically* meaningless.
      *   **Gets Him His Conclusion?** **Weakly.** It highlights a *practical challenge* (arbitrariness) in assigning probabilities to unique events, but does not make expected-value reasoning a *category error*. Subjectivists would argue EV reasoning *is precisely the tool* for unique decisions, using the best subjective beliefs available, acknowledging the potential for poor calibration. It undermines *confidence* in the EV result, not its *applicability*.
      *   **Keynes:** **Sympathetic to the Challenge, Rejects Subjectivism.** Keynes was deeply skeptical of purely subjective degrees of belief divorced from logical evidence (Book I, Chapter II). He would agree uncalibrated beliefs are problematic, but his solution was logical probability, not subjectivism. He would see the arbitrariness as a reason to sometimes find the probability *indeterminate* logically, not just poorly calibrated.

  5.  **Interpretation: Decision-Theoretic Claim (No Known Probabilities)**
      *   **Claim:** Expected value calculations require known, objective probabilities. Since unique events lack known objective probabilities (frequentist or logical), the inputs for EV calculation are missing, rendering it impossible.
      *   **Type of Probability Denied:** Known Objective Probability (Frequentist or Logical).
      *   **Grounds:** Definitional (Misunderstanding of decision theory).
      *   **Verdict:** **False.** Modern decision theory (especially Bayesian) explicitly allows for and is built upon *subjective probabilities* precisely for situations lacking known objective probabilities. Expected utility theory uses the agent's *beliefs* (subjective probabilities) and *values* (utilities).
      *   **Gets Him His Conclusion?** **Only by a false premise.** This claim misrepresents standard expected-value reasoning, which fundamentally relies on *subjective* estimates of probability in most real-world (especially unique) decisions. The conclusion doesn't follow from the premise because the premise is incorrect about what EV requires.
      *   **Keynes:** **Would reject "known objective" as always required, but...** Keynes wouldn't endorse subjective probabilities as inputs. For him, if a definite logical probability couldn't be established, EV calculation might be impossible, but the reason is the *indeterminacy* of the logical probability, not the absence of a "known objective" probability per se.

  **Which Readings Actually Support His Conclusion (Expected-Value Reasoning Invalid)?**

  *   **Strongest (but problematic):** #2 (Verificationism). If probability statements are *meaningless*, using them in EV is nonsense.
  *   **Keynesian Nuance:** #3 (Logical Indeterminacy). *Precise numerical* EV reasoning is impossible if no definite logical probability can be assigned. However, Keynes allows for non-numerical comparisons ("more probable than") or acting under uncertainty based on the "weight" of vague evidence.
  *   **Partial/Weak:** #1 (Frequentist Definitional). Denies frequentist probability, but doesn't deny *subjective* EV reasoning. #4 (Uncalibrated Subjectivism). Challenges the *quality* of the input, not the *validity* of the process. #5 is simply false.

  **Keynes's Overall Position:**

  Keynes lands most firmly in **Interpretation #3 (Logical Indeterminacy)**. His core argument is that while probability is an objective logical relation, for many events—especially unique, complex, or poorly evidenced ones—this relation does *not* yield a definite numerical value or may not even be comparable to other probabilities. He explicitly rejects the frequentist definition (#1) and subjectivism (#4). He would find the verificationist claim (#2) alien to his logical conception. He would agree with the *spirit* of the challenge in #4 (arbitrariness) but see it as proof of the need for a logical foundation, not subjectivism. He would reject the premise of #5. Therefore, for Keynes, the accurate criticism isn't that probability is *categorically impossible* for unique events, but that it is often *indeterminate, non-numerical, or incomparable*, making precise numerical expected-value calculation frequently inapplicable or misleading. The emphasis shifts to the *weight* of evidence and non-numerical judgment.
