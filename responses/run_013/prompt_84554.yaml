answer: |-
  Good evening, everyone. Welcome. It’s truly an honour to see so many faces passionate about the past gathered here tonight for our journey into the archaeology of Troy.

  Now, I know we have a wonderfully diverse crowd. Some of you could likely debate the finer points of Mycenaean pottery or Hittite verb conjugations before breakfast. Others… well, many of you grew up with Achilles’ rage, Hector’s courage, and the tragedy of that wooden horse. You feel the sand of that distant shore beneath your feet when you hear Homer’s words. That passion, that connection to the *story*, is what brings history alive. It’s why we’re all here.

  And that brings us to the question hanging over this room, over Troy itself, and indeed, over figures like King Arthur or the Exodus: **When does a legend earn a place on the shelf of history?**

  For a long time, Troy *was* only legend. Then came Heinrich Schliemann. Driven by an almost childlike faith in Homer, he went looking – and he found a great mound at Hisarlik. His passion was undeniable, his impact immense… but his methods? We wince. His great trench, driven like an arrow through the heart of the mound, destroyed layers of history as he searched for *his* Homeric Troy. And the breathtaking gold he called "Priam’s Treasure"? It comes from a city layer centuries *older* than any plausible candidate for the Troy of the Late Bronze Age, the time when the war *might* have occurred. It’s a treasure, yes, but it whispers to us of an earlier, equally magnificent Troy, not necessarily Priam’s.

  Then we turn to the archives of the Hittites, Troy’s powerful neighbours. We find tantalising clues: a city called "Wilusa" in the right place, possibly echoing "Ilios" or "Wilios"… the very name Homer uses. We see references to conflicts, to vassal states, to diplomatic tensions – the messy, complex world of Bronze Age Anatolia and the Aegean. But a grand, decade-long siege? A colossal wooden horse? Those details, the heart of Homer’s epic, remain stubbornly absent from the clay tablets. The Hittites tell us of a powerful kingdom *in the place* Troy should be, involved in the *kinds* of struggles that could seed legends… but not the specific siege Homer immortalised.

  So, where does this leave us? With a shrug? With disappointment? I don’t think so. Archaeology rarely delivers perfect, storybook answers. It delivers evidence – fragments, layers, trade goods, weapons, signs of destruction and rebuilding. What we find at Hisarlik is compelling: a strategic citadel controlling the Dardanelles, destroyed by fire and warfare not once, but multiple times, crucially including a major destruction layer around the late 13th or early 12th century BC. This fits the *general timeframe* suggested for a possible conflict that could echo down the ages.

  **Here, then, is my verdict on Troy and its place between legend and history:**

  The specific, glorious, tragic, ten-year siege described in the Iliad, with its pantheon of heroes and divine interventions? That remains a magnificent work of poetic genius, woven over centuries. Archaeology cannot, and likely never will, *prove* it happened exactly as Homer sang.

  **But...**

  The *world* Homer described? That world is increasingly real. The geography is real. The political landscape of powerful citadels like Mycenae and a strategic stronghold like Troy clashing is real. The evidence of significant warfare, destruction, and cultural upheaval in that place, at that critical time, is undeniable. The Hittite records confirm a significant kingdom named Wilusa existed precisely where legend placed Troy.

  **Therefore, the legend of the Trojan War moves to the history shelf not as a verified, blow-by-blow account, but as a powerful cultural memory.** It is a poetic echo resonating across centuries, likely rooted in genuine historical conflict – perhaps one of the destructive events we *can* see archaeologically at Troy. The Iliad isn't a documentary; it's a masterpiece built upon the foundations of a real past. It takes the essence – the clash of powers, the cost of war, the fragility of human life – and elevates it to the realm of universal truth.

  So, to our Homer-lovers: Honour the poem not as a literal transcript, but as something perhaps more profound – a brilliant human response to real events and enduring emotions, a story that captured the Bronze Age world and its echoes so compellingly that it shaped our imagination for millennia. The *truth* of the Iliad lies in its enduring power to speak to us across 3,000 years about honour, grief, love, and the terrible cost of conflict.

  And to our scholars: Honour the painstaking work that reveals the complex, layered reality beneath the legend. Each sherd of pottery, each fortification wall, each Hittite syllable adds depth and texture to the context from which the epic sprang.

  Tonight, as you explore this exhibition, look at these objects – the weapons that *could* have clashed, the pottery that held oil or wine for people who *might* have heard whispers of a great war, the evidence of a citadel that stood proud and fell hard. See them not as proof of the Iliad's every word, but as the tangible fragments of the world that inspired it, a world that Homer transformed into an immortal story.

  The war may live in the realm of poetic memory, but the *city* was real. The *clash of empires* was real. And the human stories that echo from those times are as real today as they ever were. That is the power, and the true history, of Troy.

  Thank you. Please enjoy the exhibition.
