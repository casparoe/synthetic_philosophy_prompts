  We are building a checklist for two-dimensional semantic frameworks. The goal is to specify the desiderata that any such framework must meet to be considered adequate. We'll break it down into cases that must be handled, structural requirements, and then address the two special requests.

  ## I. Cases That Must Be Handled

  1. **Necessary a posteriori**: 
     - **Case**: True identities that are necessary but can only be known empirically. 
     - **Example**: "Hesperus is Phosphorus." This is necessarily true (if Hesperus and Phosphorus are the same planet, then in every possible world they are identical) but we only know this a posteriori (by empirical observation).

  2. **Contingent a priori**:
     - **Case**: Truths that are knowable a priori (without empirical investigation) but are contingent (not necessary).
     - **Example**: "The meter stick in Paris is one meter long." We defined the meter by that stick, so we know a priori that it is one meter long. But it is contingent because the stick could have been longer or shorter.

  3. **Asymmetry in a priori knowability of identities**:
     - **Case**: Some true identities are knowable a priori, while others are not, even though both terms pick out the same thing.
     - **Example**: 
       - A priori: "Hesperus is Hesperus" (trivial) vs. "Hesperus is Phosphorus" (a posteriori).
       - Also, consider descriptive names: "Jack the Ripper" (if introduced by a description that only one person satisfies) might be known a priori to be that person? But typically, we have an asymmetry between the way names are introduced and how they function.

     However, note that the asymmetry is also present in:
       - "Cicero is Tully" (a posteriori) vs. "Cicero is Cicero" (a priori).
       - The framework must explain why two coreferential names sometimes yield an a posteriori identity and sometimes an a priori one (if one is used twice).

     Actually, the asymmetry is between identities that are trivial (like "a=a") and those that are not. But the non-trivial ones are a posteriori when the two names are introduced by different modes of presentation.

  ## II. Structural Requirements

  4. **Distinction between epistemic and metaphysical modality**:
     - The framework must not collapse "what could have turned out to be the case" (epistemic) and "what is necessary" (metaphysical). For example, it might turn out that Hesperus is not Phosphorus (epistemically possible) but it is metaphysically necessary that they are identical.

  5. **Compositionality**:
     - The meaning of a complex expression must be determined by the meanings of its parts and the way they are combined.

  6. **Clear account of the two dimensions and their relation to context and circumstance**:
     - The first dimension (often called the "diagonal" or "epistemic" dimension) and the second dimension (the "horizontal" or "metaphysical" dimension) must be clearly defined.
     - The framework must explain how these dimensions relate to:
          - **Context of utterance**: The situation in which the utterance is made (including speaker, time, place, etc.)
          - **Circumstance of evaluation**: The possible world (or world-time pair) at which the content is evaluated.

  7. **Treatment of indexicals and "actually"**:
     - Indexicals (like "I", "here", "now") should be handled in a way that respects their context-dependence without ad-hoc adjustments.
     - The operator "actually" should be accounted for: "Actually P" is true at a world w if P is true at the actual world (the world of the context). But note that in embedded contexts, especially under modal operators, it can be tricky.

  8. **Embeddings and operator interactions**:
     - The framework must handle embeddings, especially under epistemic modals (like "might") and metaphysical modals (like "necessarily"). 
     - **Critical examples**:
          - Epistemic modals: 
            Example: "It might be that Hesperus is not Phosphorus." This is true in an epistemic context (before we knew) but false in a metaphysical sense.
          - Interaction with "actually":
            Example: "Actually, Hesperus is Phosphorus." This is necessarily true? But what about: "It might have been that actually Hesperus is not Phosphorus."? (This seems false because "actually" rigidifies to the actual world.)

     - Another example: 
          - Consider the contingent a priori: "The meter stick is one meter long." Now embed under a modal: 
            "Necessarily, the meter stick is one meter long." This is false (because it could have been different). But if we embed under an epistemic modal: "It might be that the meter stick is not one meter long." This is false because we defined it as one meter, so we know a priori it is one meter.

     - A more challenging embedding: 
          - Example from two-dimensionalism: "It is not a priori that Hesperus is Phosphorus." This should be true. But if we have an operator that quantifies over the first dimension, we need to capture that.

  ## III. Two Special Requests

  ### First: Flag any pair or small subset of desiderata that might conflict

  - **Suspected conflict**: The requirement that the first dimension captures **apriority** and the requirement that it captures **linguistic meaning** (or character, in Kaplan's sense). 
    - **Reason**: Apriority is a property of propositions (or sentences in a context) that can be known without empirical investigation. But linguistic meaning (character) is what is conventionally associated with an expression and determines its content in a context. 
    - **Problem**: If we tie the first dimension too closely to apriority, we might lose the connection to the conventional meaning that is shared by all speakers. For example, the linguistic meaning of "Hesperus" might be the same for everyone (say, a name for the evening star) and that of "Phosphorus" (the morning star). Then the sentence "Hesperus is Phosphorus" would have a first-dimensional content that is contingent (because in some scenarios the evening star and morning star are different), hence not a priori. But if we tie the first dimension to linguistic meaning, then we get that the first-dimensional content of that sentence is the same as the first-dimensional content of "Hesperus is Hesperus"? That would be necessary on the first dimension? But we want the first dimension to explain why "Hesperus is Phosphorus" is not a priori.

    - **Mechanism**: 
        - If the first dimension is defined as the set of worlds that are epistemically possible (compatible with what is known a priori), then the sentence is true at every such world only if it is a priori. But the linguistic meaning (character) of an expression is a function from contexts to contents. 
        - The tension arises because the apriority of a sentence in a context is determined by the first-dimensional intension (if we set up the framework that way) but the linguistic meaning is supposed to be what the speaker and hearer share. 
        - However, if we try to make the first dimension (the diagonal) the same as the character, then we might be able to define apriority in terms of the diagonal: a sentence is a priori if its diagonal is necessary (true in every context). But note that in Kaplan, the character of "I am here now" is such that in every context it is true. So it is a priori. But the character of "Hesperus is Phosphorus" is not such that in every context it is true? Actually, no: in every context, if we fix the referents of "Hesperus" and "Phosphorus" by the context, then the identity is true if they refer to the same thing. But in a context where they refer to the same thing, the sentence is true. However, the problem is that the character does not tell us that they are the same object in every context. In fact, in some contexts, they might refer to different objects? But that's not how names work. 

    - **Resolution?**: 
        - In two-dimensional frameworks, we often consider two kinds of possibilities: 
            - Contexts (which set the reference of names and indexicals) and worlds of evaluation.
        - For the necessary a posteriori, we want that in the actual context, the sentence is true in every world (metaphysically necessary) but that the diagonal (which looks at the sentence in different contexts) is not necessary (so it is not a priori). 
        - The linguistic meaning (character) is then the function from contexts to contents (the content in that context). The diagonal is a function from contexts to the truth-value of the sentence in that context when evaluated at the world of that context. And apriority is the diagonal being necessary (true in every context). 
        - But then, for "Hesperus is Phosphorus", if the linguistic meaning of "Hesperus" and "Phosphorus" are such that in some contexts they refer to different objects, then the diagonal might be false in some contexts? But in the actual context they refer to the same. However, if we allow contexts where "Hesperus" and "Phosphorus" refer to different objects (even though in reality they are the same), then the diagonal of "Hesperus is Phosphorus" is not necessary. So it is not a priori.

    - **Conflict**: 
        - The conflict might arise when we consider that the linguistic meaning of a proper name is often taken to be just its referent (in a direct reference theory). But then the character of a name is a constant function (in every context it refers to the same thing). Then, in every context, "Hesperus is Phosphorus" would be true (if they are the same) or false (if they are different). But if they are the same, then in every context they are the same? That would make the diagonal necessary? But we don't want that because then it would be a priori.

    - **Conclusion**: 
        - To avoid this, two-dimensionalists typically allow that the character of a name is not constant: it can refer to different things in different contexts. But then they must explain what fixes the reference in a context. This is often done by associating a name with a reference-fixing description. But that brings in the problems of descriptivism. 
        - **The tension**: If we want the first dimension to capture apriority, we need to allow that the reference of names can vary in the contexts considered in the first dimension (so that the identity statement is not true in all contexts). But if we also want the first dimension to capture linguistic meaning, then we must say that the linguistic meaning of a name is something that can vary with context. However, if we adopt a direct reference view, the linguistic meaning (character) of a name is a constant function. This leads to a conflict because then the diagonal would be constant.

        - **The choice**: 
            - Option 1: Reject direct reference and allow that names have descriptive characters. Then the diagonal can vary, and we can get the necessary a posteriori.
            - Option 2: Keep direct reference but then give up on the idea that the first dimension (diagonal) is the same as linguistic meaning. Instead, the diagonal is an epistemic dimension that does not directly correspond to the conventional meaning.

        - This is a fundamental tension: **The requirement that the first dimension capture apriority and the requirement that it capture linguistic meaning (under a direct reference theory) are in conflict.** To resolve, one must either abandon direct reference for names or abandon the identification of the first dimension with linguistic meaning.

  ### Second: The requirement that does the most work in excluding proposals

  - **Most exclusionary requirement**: **Handling embeddings, especially under epistemic modals and the operator "actually"**, without ad-hoc adjustments.

    - **Why?**: Many two-dimensional frameworks work well for simple sentences but break when operators are nested. For example:
        - Consider: "It might be that actually, Hesperus is not Phosphorus." 
          - Intuitively, this is false: because "actually" refers to the actual world, and in the actual world Hesperus is Phosphorus, so no matter which world we consider, "actually P" is true only if P is true in the actual world. So the whole sentence is false.
        - But now consider an epistemic reading: "It might be (for all we know) that actually, Hesperus is not Phosphorus." 
          - This seems true in a state of ignorance. But note: the word "actually" is supposed to rigidify to the actual world. So even if we are ignorant about whether Hesperus is Phosphorus, if in fact they are the same, then "actually, Hesperus is not Phosphorus" is false. So the epistemic possibility operator cannot make it true.

        - However, if we are in an epistemic state where we don't know that Hesperus is Phosphorus, then we consider some scenarios (epistemically possible) in which Hesperus is not Phosphorus. But in each such scenario, the word "actually" still refers to the actual world, not the scenario. Therefore, in every scenario, "actually, Hesperus is Phosphorus" is true (if they are actually the same) or false (if they are actually not). But we don't know which scenario is actual. So we might be in a scenario where actually they are different? But that scenario is not actual. 

        - The problem is that we need to evaluate "actually" with respect to the context of utterance, which is fixed. So the above sentence should be false if they are actually the same. But in an epistemic framework that allows for two-dimensional intensions, we might want to capture that we don't know the actual world. 

    - **Why this is exclusionary**:
        - It forces the framework to have a very clear separation of the two dimensions and how operators shift them. 
        - Some frameworks (like Kaplan's) do not allow operators to shift the context (only the circumstance). Then "actually" becomes an operator that looks at the circumstance of the context. But in embedded contexts, if we try to use the two-dimensional machinery to handle epistemic modals, we might need to shift the context. 
        - Frameworks that try to use the two dimensions to handle both context-dependence and epistemic modality often run into problems with "actually" and other indexicals because they require that the context remain fixed for indexicals but shift for epistemic modals.

    - **Result**: This requirement excludes many popular two-dimensional frameworks that do not have a clear and consistent way of handling the interaction of operators that shift the two dimensions.

  ## IV. Short Scorecard of Main Families

  - **Epistemic two-dimensionalism** (ties first dimension to apriority, e.g., Chalmers):
     - Strengths: Directly handles the necessary a posteriori and contingent a priori by defining the first dimension as epistemic possibility.
     - Weaknesses: May have trouble with compositionality and embeddings, especially with "actually". Also, the tension with direct reference: if names are directly referential, how do we get variation in the first dimension?

  - **Context-dependent two-dimensionalism** (ties first dimension to context, e.g., Kaplan):
     - Strengths: Clear account of indexicals and context-dependence. Compositionality is achieved via character and content.
     - Weaknesses: Does not directly handle the necessary a posteriori and contingent a priori because in Kaplan, the content of a name is fixed and the character is constant. So "Hesperus is Phosphorus" has a constant character and a necessary content, but we want it to be a posteriori.

  - **Metalinguistic two-dimensionalism** (interprets the first dimension as involving metalinguistic information):
     - Strengths: Can explain the a posteriori nature of identity statements by considering different assignments to names.
     - Weaknesses: May not generalize to non-metalinguistic cases and may fail compositionality (if the metalinguistic level is not compositional).

  ## V. One-Sentence Summary of the Most Important Tension

  The most important tension arises because requiring the first dimension to simultaneously capture apriority (which demands variation in the reference of names across epistemic scenarios) and linguistic meaning (which, under direct reference, is invariant) forces a choice between abandoning direct reference or redefining the epistemic dimension independently of conventional meaning.

