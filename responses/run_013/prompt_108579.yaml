answer: |-
  ### Desiderata for a Two-Dimensional Semantic Framework

  #### I. Core Cases to Capture
  1. **Necessary a posteriori**  
     - **Case**: True identities that are metaphysically necessary but knowable only empirically.  
     - **Example**: "Hesperus is Phosphorus" is true in all metaphysically possible worlds but was discovered a posteriori.  
     - **Requirement**: The framework must assign necessity to the second dimension (metaphysical) but epistemic contingency to the first dimension (epistemic), reflecting how it "could have turned out false" before empirical investigation.

  2. **Contingent a priori**  
     - **Case**: Truths knowable without empirical investigation but metaphysically contingent.  
     - **Example**: "Stick S is one meter long" (where S fixes the reference of "meter") is knowable a priori via stipulation but false in worlds where S has a different length.  
     - **Requirement**: The framework must assign apriority to the first dimension (true across all epistemic scenarios) but contingency to the second dimension (false in some metaphysical worlds).

  3. **Asymmetry in a priori knowability of identities**  
     - **Case**: Coreferential terms differ in whether their identity is knowable a priori.  
     - **Example**: "Cicero is Cicero" is a priori, but "Cicero is Tully" is a posteriori, despite both picking out the same individual.  
     - **Requirement**: The framework must explain this via differences in the first dimension (e.g., distinct epistemic intensions or modes of presentation) without collapsing coreference.

  #### II. Foundational Constraints
  4. **Distinction between epistemic and metaphysical modality**  
     - **Requirement**: The framework must not conflate "what could have turned out to be the case" (epistemic) with "what could have been the case" (metaphysical).  
     - **Example**: "Hesperus might not be Phosphorus" is epistemically possible but metaphysically impossible; the two dimensions must capture this divergence.

  #### III. Structural Requirements
  5. **Compositionality**  
     - **Requirement**: The semantic value of a complex expression must be computable from the values of its parts and their syntactic structure in both dimensions.

  6. **Clear mapping of dimensions to context and circumstance**  
     - **Requirement**:  
       - **First dimension** (epistemic) must map cleanly to **context of utterance** (e.g., speaker, time, world of utterance).  
       - **Second dimension** (metaphysical) must map cleanly to **circumstance of evaluation** (e.g., possible world).  
     - **Non-negotiable**: No gerrymandering; the split must generalize beyond toy examples.

  7. **Treatment of indexicals and "actually"**  
     - **Indexicals**: Must handle context-dependence (e.g., "I" refers to the speaker in the context).  
     - **"Actually"**: Must rigidify evaluation to the world of the context.  
     - **Requirement**: No hidden adjustments; e.g., "Actually, Hesperus is Phosphorus" must be necessary, but "It might be that actually Hesperus isn't Phosphorus" must be false.

  8. **Embeddings and operator interactions**  
     - **Requirement**: The framework must resolve truth-value flips when expressions embed under operators (e.g., modals, attitude verbs).  
     - **Critical examples**:  
       - *Epistemic modal + necessary a posteriori*:  
         - "It might be that Hesperus isn't Phosphorus" must be true epistemically but false metaphysically.  
       - *"Actually" under modals*:  
         - "Necessarily, actually P" must reduce to the truth of P in the actual world.  
       - *Contingent a priori under negation*:  
         - "Stick S is not one meter long" must be false a priori but metaphysically possible.

  ---

  ### Suspected Conflicts Between Desiderata
  - **Conflict**: **Apriority vs. linguistic meaning in the first dimension**.  
    - **Mechanism**:  
      - If the first dimension is tied to **apriority** (e.g., diagonal intension as epistemic possibility), it must allow "Hesperus is Phosphorus" to be false in some epistemic scenarios (reflecting ignorance).  
      - If the first dimension is tied to **linguistic meaning** (e.g., Kaplanian character), names have constant characters (refer directly), making "Hesperus is Phosphorus" true in all contexts—contradicting its aposteriority.  
    - **Forced choice**:  
      - *Option 1*: Abandon direct reference for names; adopt descriptive characters (e.g., modes of presentation). This salvages apriority but clashes with rigidity and Kripkean arguments.  
      - *Option 2*: Sever the first dimension from linguistic meaning; treat it as purely epistemic. This preserves rigidity but divorces semantics from epistemology.  

  ### Most Exclusionary Requirement
  - **Requirement**: **Handling embeddings with operators** (e.g., epistemic modals, "actually").  
  - **Why**:  
    - Popular frameworks (e.g., epistemic two-dimensionalism) often handle simple cases but fail under embedding:  
      - They cannot explain why "Necessarily, actually P" is equivalent to P (requiring rigid anchoring to context) while "It might be that actually P" is epistemically contingent if P is a posteriori.  
      - They struggle with iterated modals (e.g., "It might be necessary that P") where epistemic and metaphysical dimensions interact.  
    - This requirement exposes ad hoc fixes, especially for "actually" and indexicals, and tests compositionality across dimensions.  

  ### Scorecard of Framework Families
  | **Family**               | **Ties first dimension to...** | **Fails most on...**                     |  
  |--------------------------|--------------------------------|------------------------------------------|  
  | **Epistemic** (e.g., Chalmers) | Apriority             | Embeddings (e.g., "actually" under modals) and direct reference clash. |  
  | **Contextual** (e.g., Kaplan) | Context of utterance  | Necessary a posteriori (names have constant characters). |  
  | **Metalinguistic**       | Metalinguistic features       | Compositionality and generalization beyond identities. |  

  ---

  ### Summary of Key Tension  
  The most important tension arises because **tying the first dimension to apriority requires varying reference in epistemic scenarios, but tying it to linguistic meaning (under direct reference) forces constant reference—forcing a choice between accommodating Kripkean rigidity or the epistemology of necessity**.  

  \answer{handling embeddings with operators}
