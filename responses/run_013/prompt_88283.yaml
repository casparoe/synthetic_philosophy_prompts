prompt: |-
  I'm in a decision theory seminar this term and there's one line my professor uses to end arguments that I can't get past: 'you can't be worse off with more information.' She said it last week to tell someone in my section that of course he should get the extra test before choosing a treatment, and she says some version of it about gathering more data before you commit to a hypothesis. She calls it Good's theorem I think, some statistician from the 60s.

  But I'm pretty sure it can't mean what it sounds like, and I also can't tell what it does mean. When I said my aunt got a genetic test she didn't have to get and it made her last year miserable, my prof said that's ex post, that's a different thing. When I pushed on what the non-different thing is, she said 'well, you can always ignore it' — which feels like it does all the work with none of the lifting. Someone in my section said that in a negotiation knowing more about the other side can hurt you, and she said that's because the information isn't free. Fine, but then when *is* it free? And a friend of mine deliberately avoids looking at her bank balance because she says she'd just spiral, which my prof waved off as a preference about knowing rather than a fact about information.

  Act like a philosopher of decision theory who's used to grading undergrads and is pedantic in a helpful way. Take this slowly, and before you answer, brainstorm the space of possible readings rather than jumping to the one you like best.

  Then give me a numbered menu of the precise claims 'you can't be worse off with more information' could be making, from the trivial ones to the strong ones. For each reading, tell me: what it quantifies over (whose expectations, computed when, over what, compared to what), what has to be true for it to hold, and whether it's a platitude, a genuine theorem, contentious, or flatly false. Then say which reading fits what my prof actually did when she told him to get the test, and whether she quietly switched to a different one with the 'you can always ignore it' move — because if the answer is 'you may ignore it', I want to know if that's the same claim at all.

  Where a reading fails only in special cases, give me the smallest concrete case where it breaks instead of a general discussion — one per reading, please. And where a reading is only true for a certain kind of agent (someone who updates a particular way, or has a particular kind of preference), say what kind and what happens to the claim when the agent isn't that kind. Also flag anywhere I'm probably conflating two things, because I suspect I am, definitely in the negotiation example.

  No reading list please, just the positions — our library search is down anyway and I don't need names, I need the claims. I want to have this sorted before office hours.
reasoning: |-
  Okay, the user is in a decision theory seminar and their professor keeps using the line "you can't be worse off with more information," attributing it to Good's theorem. The user is confused because real-life examples seem to contradict this—like their aunt who got a genetic test and had a miserable last year, or a friend avoiding checking her bank balance. They want a clear breakdown of what this claim actually means, presented in a structured way with different interpretations, each analyzed for validity. 

  First, I need to unpack the professor's statement. It sounds like a reference to Good's theorem (1967), which is a formal result in Bayesian decision theory. But the user is hitting real-world counterexamples that feel obvious, and the professor's responses ("that's ex post," "you can always ignore it") aren't satisfying them. The user wants to dissect this methodically, like a philosopher would—no fluff, just precise readings of the claim. 

  Hmm. The core tension here is between formal decision theory (where information is "free" and rationality assumptions hold) and messy human psychology (where information can trigger anxiety, change preferences, or incur hidden costs). The professor is technically correct within the ivory tower framework, but the user is stuck on the fact that humans aren't Bayesian robots. I need to bridge that gap without dunking on either side. 

  Let me brainstorm the possible interpretations of "you can't be worse off," ranked from weakest to strongest: 

  1. **The Trivial Ignoring Reading**: Literally, you can choose to act as if you never got the info. This is always true but useless—it doesn't mean the info *helps*, just that it can't actively force you to make worse choices. Like refusing to open the genetic test results.  
     
  2. **Ex Ante Expected Utility Reading**: Before getting the info, your expected utility if you *might* get it is at least as high as if you never get it. This is Good's actual theorem—but only if information is free (no cost/effort) and you're a perfect Bayesian updater. It breaks if the info costs money or if you'd misinterpret it (e.g., panicking over a false positive).  

  3. **Ex Post Optimality Reading**: After getting the info, you'll be better off *if* you use it right. But this is where the aunt example hits hard—she *did* use it (chose treatment), but the knowledge itself caused suffering. The professor calls this "ex post," meaning the claim wasn't about emotional states.  

  4. **All-Things-Considered Welfare Reading**: This is what the user intuitively wants—does more info *overall* improve life? But decision theory doesn't promise this! It might worsen anxiety, change your preferences ("I now care about things I ignored before"), or have ethical costs (e.g., learning a hurtful secret). The bank balance example fits here—avoiding info as self-protection.  

  ...and I should also flag the negotiation case separately. That's not about info being harmful *per se*; it's about strategic disclosure. If you *accidentally reveal* you have info (e.g., sweating when you see their bottom line), that changes the game. The info isn't free because it alters others' behavior.  

  For each reading, I'll specify:  
  - **Quantifiers**: Whose expectations? (The agent's, ideally rational)  
  - **When computed**: Before/after getting info?  
  - **What's compared**: Having info vs. not, or also how you use it?  
  - **Validity**: Platitude, theorem, or false?  
  - **Failure cases**: Smallest concrete example where it breaks.  

  The professor likely leans on Reading 2 (Good's theorem) for the test example—"get the test because it might help optimize treatment." But when challenged, she retreats to Reading 1 ("you can ignore it"), which is a weaker claim. That switch is sneaky! It patches holes but makes the advice less powerful.  

  The user's frustration makes sense: Reading 2 feels like it should cover real welfare, but it doesn't. Their examples target Readings 3 and 4, where harm is obvious. I’ll need to emphasize that decision theory optimizes *choices*, not *feelings*—and humans aren't optimization machines.  

  Key nuance: "Information" in the theorem means pure data, not its delivery method (e.g., a blunt doctor causing distress). And "free" means no cost/effort, which is almost never true IRL. The negotiation example fails because the info *isn't* free—it leaks.  

  Final note: The user might conflate "information" with "learning information." The theorem cares about the first; humans struggle with the second. I’ll flag that.
answer: |-
  Here's a systematic breakdown of possible readings of "you can't be worse off with more information," ordered from weakest/most defensible to strongest/most fragile. I'll address your examples and the professor's moves explicitly at the end.

  ---

  ### **Core Distinctions to Clarify First**
  1. **Information vs. Cost/Process**: "Information" here means the *content* of what is learned, not the cost/time/stress of acquiring it. Your negotiation example fails here—knowing more hurts because acquisition *changes the strategic situation* (cost isn't purely informational).  
  2. **Decision-Making vs. Experienced Utility**: Decision theory optimizes *choice outcomes* given beliefs/preferences. It doesn't guarantee psychological well-being (your aunt's misery) or preference stability (your friend's avoidance).  
  3. **Ex Ante vs. Ex Post**: Evaluated *before* getting information (ex ante) vs. *after* (ex post). Good's theorem is ex ante.  

  ---

  ### **Numbered Readings of the Claim**  
  **Reading 1: Weak Dominance of Ignorability**  
  - **Claim**: Having information *allows* you to achieve at least the same expected utility as not having it, because you can always ignore it.  
  - **Quantifies**: Your expected utility (EU) *after receiving but before acting* on information. Compared to: EU if you had no information and took your default action.  
  - **Requires**: No constraints on action space (you can freely choose to act *as if* uninformed).  
  - **Status**: Platitude (true by definition).  
  - **Fails if**: Actions are constrained (e.g., legally mandated to act on test results).  
  - **Smallest failure case**: A rule forces you to undergo invasive treatment if a test is positive. You'd prefer no test → no treatment, but with a test you might be forced into treatment.  

  **Reading 2: Ex Ante Non-Dominance (Good's Theorem)**  
  - **Claim**: *Before* acquiring information, the expected value of acting *with possible future information* is ≥ acting without it.  
  - **Quantifies**: Your EU *now* (pre-info) of a policy that *may* acquire info vs. a policy that never does. Compared to: Committing now to a fixed action.  
  - **Requires**:  
    - Information is "free" (no cost, risk, or strategic impact).  
    - You update beliefs via Bayes' rule.  
    - Your utility function is fixed and not state-dependent (e.g., you don't value "blissful ignorance").  
  - **Status**: Theorem (under above assumptions).  
  - **Fails if**: Information acquisition changes the world (e.g., a rare test causes a harmful side effect).  
  - **Smallest failure case**: A blood test has a 0.1% chance of causing anaphylaxis. You decline it because risk > benefit.  

  **Reading 3: Ex Post Improvement for Optimal Agents**  
  - **Claim**: *After* receiving information, an agent who acts optimally with it will be at least as well off as they would have been acting optimally without it.  
  - **Quantifies**: Your actual utility *after* acting with info vs. *counterfactual* utility had you acted without info.  
  - **Requires**:  
    - You act optimally *with* the information (no mistakes).  
    - Utility depends only on outcomes, not beliefs (unlike your aunt's misery).  
  - **Status**: Contentious (only true for outcome-based utilities).  
  - **Fails if**: Beliefs directly affect utility (e.g., "happy ignorance" preferences).  
  - **Smallest failure case**: You learn your partner cheated. Truth lowers your utility, even if you "optimally" divorce. Ignorance was better *for you*.  

  **Reading 4: Universal Ex Post Dominance**  
  - **Claim**: No matter how you act after getting information, you'll be at least as well off as if you lacked it.  
  - **Quantifies**: Your actual utility after *any* action with info vs. *any* action without info.  
  - **Requires**: Information is "inconsequential" (never worsens feasible outcomes).  
  - **Status**: Flatly false.  
  - **Fails if**: Information tempts you to make a worse choice (e.g., panic-selling stocks).  
  - **Smallest failure case**: You see a "sale" sign and buy a useless item. Had you not known, you'd have saved money.  

  **Reading 5: All-Things-Considered Welfare**  
  - **Claim**: More information *overall* improves well-being, including psychological/behavioral effects.  
  - **Quantifies**: Lifetime utility, including belief-dependent welfare (e.g., anxiety).  
  - **Requires**: Rationality, no cognitive biases, and no belief-dependent utility.  
  - **Status**: False (counterexamples abound).  
  - **Fails if**: Information causes distress (your aunt) or self-sabotage (your friend's bank balance spiral).  

  ---

  ### **Your Professor's Moves Analyzed**  
  - **Her initial advice (get the test)**: Assumes **Reading 2** (Good's theorem). She treats the test as "free" (ignoring psychological costs) and assumes optimal use of the info for treatment decisions.  
  - **Her "you can always ignore it" reply**: Switches to **Reading 1**. This is weaker but technically shields her from your aunt counterexample. However, it trivializes the claim: if ignoring is allowed, "more info" reduces to having extra *optional* actions, which can't hurt but may not help.  
  - **Why this feels unsatisfying**: Reading 1 makes the claim true but useless (it doesn't imply you *should* get info). Reading 2 is substantive but false in real-world cases where her assumptions fail (costs, belief-dependent utility).  

  ### **Special Cases Where the Professor's Reading (2) Fails**  
  1. **Costly information**: Negotiations (acquiring info signals interest, weakening your position).  
  2. **Belief-dependent utility**: Genetic test causing despair (even if treatment choice is "optimal").  
  3. **Non-Bayesian agents**: Your friend avoids bank info because she knows she'll *misuse* it (e.g., impulsive spending).  
  4. **Preference instability**: Learning info changes what you value (e.g., discovering a genetic risk makes you risk-averse).  

  ### **Key Takeaway for Office Hours**  
  The professor is technically correct under **Reading 2's assumptions** (free info, Bayesian updating, outcome-only utility). Challenge her by specifying which assumption you think fails in a case:  
  > *"In my aunt's case, the information had direct psychological costs. Doesn't that violate Good's requirement of 'free' information? And if utility includes belief states, is the theorem still applicable?"*  

  This forces engagement with the model's limits—not just the theorem's math.
