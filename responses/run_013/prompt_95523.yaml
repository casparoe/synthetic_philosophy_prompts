prompt: |-
  I was out for a drink with a friend who's a couple of years into a PhD in philosophy, and he gave me what he called the two-minute version of the Frege–Geach problem. It's been bothering me since, because it made expressivism sound like a dead end, and I don't have the background to know whether I've been sold a line. His version goes like this. Frege spotted that you can take one and the same sentence and assert it, ask it as a question, or merely entertain it, and the content doesn't change — only the 'force' changes, and by force he meant the strength with which you put the sentence forward. Geach then turned this against the expressivist, who says that 'lying is wrong' isn't describing anything, it's just giving voice to a feeling of disapproval. Take a standard bit of reasoning: if lying is wrong, then getting your little brother to lie is wrong; lying is wrong; so getting your little brother to lie is wrong. The phrase 'lying is wrong' turns up in the first premise and again in the second, and the inference only works because it means the same thing in both places. But the first premise isn't asserted, so on the expressivist's story there's no feeling being expressed there at all — it's just an inert bit of unasserted language. So the expressivist is stuck saying the phrase does two seperate jobs in the two premises, which makes the argument a fallacy of equivocation; and since it obviously isn't an equivocation, expressivism is refuted. He added that the problem really only bites for conditionals, because negation and disjunction are easy — a negated moral sentence just expresses the opposite attitude — and that the reason nobody defends straight expressivism any more is that the only people who try to patch this up (the quasi-realists, Blackburn and Gibbard and that crowd) do it by positing a 'higher-order' attitude, an attitude to an attitude, which is really just smuggling beliefs back in under a different name.

  Can I get a proper audit from someone who actually knows this literature, rather than the seminar-room version? I'd like you to take the role of a philosopher working in metaethics and the philosophy of language, think this through carefully rather than reciting the textbook headline, and start by laying out for me what the problem really is and what the expressivist is actually committed to. Then go through his summary claim by claim and tell me what's right, what's a harmless simplification a defender wouldn't mind, and what's straightforwardly wrong or misleading. Two bits smell off to me and I can't say why: the thing about force being 'strength', and the claim that it's basically a conditionals-only problem that negation escapes. I'm definately out of my depth here, but my instinct is that nothing in philosophy gets refuted that cleanly — though that's not an argument. So: what would a careful expressivist (Blackburn, Gibbard, or one of the more technical contemporary versions) actually say in reply, does the equivocation charge land as stated or does it quietly assume what it's meant to prove, and do his conclusions — expressivism refuted, quasi-realism just disguised cognitivism — really follow from the parts of his summary that are accurate? And if the 'attitude towards an attitude' move is a real position rather than a caricature, tell me what it's actually committed to and what it costs, because I genuinely can't tell whether he was describing it or mocking it.
reasoning: |-
  Okay, the user is grappling with the Frege-Geach problem after a conversation with a philosophy PhD friend. They're concerned that expressivism might be a dead end but feel unsure about their friend's summary. Let me unpack this step by step.

  First, the core of Frege-Geach: it's about how moral language works in unasserted contexts like conditionals. The friend claimed expressivism can't handle this without equivocation. The user's instincts pinged two things - the "strength" description of force and the claim that negation is easy. Those are good catches.

  Hmm, the user's real worry seems deeper than technical details. They're suspicious of "refuted" claims in philosophy and want to know if expressivism still has legs. There's also clear curiosity about quasi-realism - is it just disguised realism? That's the heart of their unease.

  Let me reconstruct the problem carefully. Start with what expressivism actually claims: moral statements express attitudes, not beliefs. The issue arises when "lying is wrong" appears in "if lying is wrong..." - here it's not expressing any attitude, so how can it contribute to meaning? If expressivism says it means something different here, then arguments using conditionals would commit equivocation. That's the problem in a nutshell.

  Now the user's suspicions: 
  - "Force as strength" is indeed misleading. Fregean force is about speech act type (asserting vs. questioning), not intensity. That's important because expressivism's problem is about the absence of the speech act in conditionals, not weak expression.
  - Negation isn't actually easy. Saying "not wrong" expresses opposite attitude only works for simple cases. For complex statements like "It's not wrong if..." it gets messy fast. The friend oversimplified here.

  On quasi-realism: it's not just calling attitudes "beliefs." Blackburn's project is sophisticated - he's trying to show how we can talk about moral attitudes as if they're truth-apt while maintaining they're not describing reality. The "attitude towards attitudes" move is part of building this language game. Whether it succeeds is debated, but it's not a cheap trick.

  What would a sophisticated expressivist say? They'd argue moral language in conditionals functions as a placeholder for the attitude you'd express if you asserted it. The inference works because rejecting the conclusion while accepting premises would involve inconsistent attitudes. Blackburn calls this "hypertraditionalism" - we inherit our understanding from how these terms function in asserted contexts.

  The user's instinct that nothing gets "refuted that cleanly" is wise. Frege-Geach is a serious challenge, but expressivists have been developing responses since the 1960s. The debate now is whether quasi-realism succeeds or collapses into realism - but that's not the same as being refuted.

  Costs of quasi-realism? It makes metaethics heavily dependent on philosophy of language. It also requires accepting that moral "truth" is very different from factual truth. But for anti-realists, that's a feature, not a bug.

  The friend's conclusion that quasi-realism is "disguised cognitivism" is a common criticism, but it's contentious. Expressivists would say they're explaining how moral language works without ontological commitments. Realists counter that the explanations sneak in truth-conditions. That's the live debate.

  Key for the user: expressivism isn't dead. It's evolved into sophisticated quasi-realism which remains influential. The friend presented a standard objection accurately in spirit but with some oversimplifications. The deeper philosophical disagreement continues.
answer: |-
  Here's a careful audit from the perspective of metaethics and philosophy of language, addressing your concerns point-by-point. Your instincts are sharp – several aspects of your friend's summary are problematic.

  **I. Core Commitments of Expressivism & The Frege-Geach Problem**
  *   **Expressivism:** Claims that the primary function of moral statements (e.g., "Lying is wrong") isn't to *describe* objective moral facts, but to *express* non-cognitive, conative mental states (e.g., disapproval, commitment, plans). "Lying is wrong" expresses a negative attitude towards lying, akin to "Boo lying!".
  *   **The Frege-Geach Problem (FGP) Core:** How can expressivism account for the *meaning* of moral terms when they appear in *unasserted contexts* (like antecedents of conditionals, disjunctions, questions, negation) where the speaker *isn't* expressing their attitude?
      *   **Frege's Point (Corrected):** The *content* ("lying is wrong") remains constant regardless of the *force* (assertion, question, supposition). Force is about the *illocutionary act* (what you're *doing* with the sentence: stating, asking, hypothesizing), not "strength" (your friend's term is misleading; it's a categorical difference, not a scalar one).
      *   **Geach's Challenge:** In the argument:
          *   P1: If lying is wrong, then getting your little brother to lie is wrong. (Unasserted antecedent)
          *   P2: Lying is wrong. (Asserted)
          *   C: Therefore, getting your little brother to lie is wrong. (Asserted)
          *   For the argument to be valid (non-equivocal), "lying is wrong" must have the *same meaning* in P1 and P2. But for the expressivist:
              *   In P2: "Lying is wrong" *expresses* disapproval of lying.
              *   In P1: "Lying is wrong" is *not asserted*. The speaker isn't expressing their disapproval of lying; they're merely hypothesizing or supposing it. So, what semantic content does it contribute to the conditional? If it lacks its usual expressive meaning, what meaning does it have here? If it has a *different* meaning, the argument commits equivocation.

  **II. Auditing Your Friend's Summary**
  1.  **"Force as Strength"**: **Misleading/Wrong.** Force isn't about "strength" (louder, more emphatic). It's about the *type* of speech act: assertion, question, command, supposition. This matters because the FGP specifically targets contexts where the *assertive force* is absent (like the antecedent of a conditional). Calling it "strength" trivializes the core linguistic phenomenon.
  2.  **"The phrase does two separate jobs... makes the argument a fallacy of equivocation"**: **Accurate portrayal of the challenge.** This *is* the core problem for naive expressivism. If the expressivist cannot explain how "lying is wrong" contributes the *same* semantic value in P1 and P2, the argument seems invalid due to term ambiguity.
  3.  **"Since it obviously isn't an equivocation, expressivism is refuted"**: **Overstated.** It's a *devastating challenge* to *simple* expressivism (Ayer, Stevenson). It shows expressivism *must* provide a sophisticated account of unasserted contexts. Calling it a "refutation" implies no solution is possible, which subsequent expressivists (quasi-realists) reject. It refutes *only* versions that cannot answer it.
  4.  **"The problem really only bites for conditionals, because negation and disjunction are easy"**: **Significantly Misleading.**
      *   **Negation:** Your friend claims "a negated moral sentence just expresses the opposite attitude." This *seems* plausible for simple cases ("Lying isn't wrong" expresses tolerance/permission). **BUT**:
          *   It struggles with *complex embeddings*: "It's not the case that if lying is wrong, then murder is obligatory." What complex attitude does *this* express? It's not simply the opposite of a simple attitude.
          *   It struggles with *denials*: Saying "Lying isn't wrong" is often rejecting/disagreeing with someone else's expressed attitude, not necessarily expressing the opposite attitude oneself.
      *   **Disjunction:** "Either lying is wrong or charity is optional." What single, unified attitude does this express? Approval of lying? Disapproval of charity? Some mixture? It's unclear.
      *   **The Real Issue:** The problem bites *most obviously* for conditionals, but it's fundamentally a problem about *logical embedding* and *compositionality* – how the meanings of parts (including moral terms) combine to form the meanings of complex sentences (conditionals, negations, disjunctions, conjunctions, quantifiers) in valid inferences, *regardless* of whether the complex sentence is asserted. Conditionals are the *paradigm* because the antecedent is clearly unasserted, but negation and disjunction pose severe compositional problems too. Expressivists need a *general* solution for all logical contexts.
  5.  **"Nobody defends straight expressivism anymore... quasi-realists... do it by positing a 'higher-order' attitude... smuggling beliefs back in"**: **A Common Criticism, But a Caricature of the Position.**
      *   **"Straight expressivism"**: True, simple "Boo/Hurrah!" expressivism is dead. Quasi-realism *is* the sophisticated development of expressivism designed to solve FGP and related problems.
      *   **"Higher-order attitude"**: This *is* part of the quasi-realist toolkit, but it's not *just* that, and it's not obviously "smuggling beliefs."
      *   **"Smuggling beliefs back in"**: This is the core realist criticism. Let's examine quasi-realism properly.

  **III. Quasi-Realism: The Sophisticated Expressivist Response**
  Quasi-realism (Blackburn, Gibbard) aims to *earn the right* for expressivists to talk *as if* moral statements are truth-apt, describe facts, and can embed in logic, *without* abandoning the core expressivist thesis that the fundamental function is to express attitudes.

  1.  **Solving FGP (The Core Move):** Quasi-realists don't primarily rely *only* on higher-order attitudes for conditionals. Their key insight is about the *function* of the conditional:
      *   To accept "If lying is wrong, then getting your little brother to lie is wrong" is *not* to express disapproval of lying. Instead, it expresses a **higher-order attitude about the connection between first-order attitudes**.
      *   Specifically (Blackburn's version): Accepting this conditional expresses *a plan or commitment*: a commitment *not* to combine disapproval of lying with *toleration* of getting your little brother to lie. It's an attitude *forbidding a certain combination* of first-order attitudes.
      *   **How this solves FGP for the argument:**
          *   P2: "Lying is wrong" expresses disapproval of lying.
          *   P1: "If lying is wrong, then getting your little brother to lie is wrong" expresses a commitment *not* to disapprove of lying while tolerating getting your little brother to lie.
          *   C: "Getting your little brother to lie is wrong" expresses disapproval of getting your little brother to lie.
          *   **Validity:** The inference is valid because *someone who accepts P1 and P2 but rejects C* would be manifesting an *inconsistent set of attitudes*. They disapprove of lying (P2), they are committed *not* to combine that disapproval with toleration of getting their brother to lie (P1), yet they *do* tolerate getting their brother to lie (rejecting C). This inconsistency in their practical stance is what makes the argument "truth-preserving" *for expressivists* – it preserves *correctness* or *consistency of attitude*.
      *   **Meaning Constancy:** "Lying is wrong" contributes the *same type of state* (a potential object of disapproval/endorsement) in both P1 and P2. In P2, it *expresses* that disapproval. In P1, it *specifies the content* of the attitude (disapproval of lying) whose combination with another attitude (toleration of brother-lying) the speaker is committed to avoiding. The *semantic role* (being the target of a certain attitude) is constant.
  2.  **Beyond Conditionals - Compositionality:** Quasi-realists develop complex semantic frameworks (often using possible worlds, or Gibbard's "fact-plan worlds") to systematically explain how attitudes expressed by atomic sentences combine under logical operators to yield the attitudes expressed by complex sentences. Negation involves planning/committing *against* having the attitude expressed by the negated sentence. Disjunction involves planning for either contingency. This is technically demanding but aims for full generality.
  3.  **Is Quasi-Realism Just Disguised Cognitivism? The Costs & Commitments:**
      *   **The Claim:** Realists argue quasi-realism's complex machinery (higher-order attitudes, plans, consistency requirements mimicking logic) *recreates* the functional role of beliefs and truth so completely that it collapses into a form of subjectivism (beliefs *about* attitudes) or non-naturalist realism.
      *   **The Quasi-Realist Defense:**
          *   **Ontological Commitment:** The *fundamental* metaphysics remains non-descriptive. Moral properties aren't discovered features of the world; they are "projections" of our attitudes onto the world. The quasi-realist explains *why we talk as if* they are real properties without positing them as mind-independent facts.
          *   **Direction of Explanation:** Beliefs *about* moral facts are explained *in terms of* our patterns of attitudes and commitments, not vice-versa. The "truth" of "Lying is wrong" is understood as the *correctness* (stability, defensibility) of the attitude of disapproval towards lying within our system of attitudes, not correspondence to an independent fact.
          *   **Internalism:** Quasi-realism typically retains a strong link between moral judgment and motivation (judging something wrong *involves* some conative state, like disapproval or a commitment to oppose it), which traditional cognitivism struggles with.
          *   **The "Earning" Project:** The goal is to show that *all* realist-sounding discourse (truth, facts, knowledge, justification, logical inference) can be given an expressivist reinterpretation without smuggling in realism.
      *   **The Costs:**
          *   **Complexity:** The theory is highly complex and technical, relying on sophisticated philosophy of language/logic.
          *   **The Collapse Worry:** Many philosophers (e.g., Dreier, Sturgeon, Cuneo) argue quasi-realism *does* collapse into realism or subjectivism. If "truth" and "fact" are functionally identical to their realist counterparts *within* moral discourse, haven't you just accepted cognitivism under a different name? Quasi-realists vigorously deny this, insisting the ontological foundation remains different.
          *   **Explanatory Challenges:** Can it adequately explain moral disagreement (is it *just* clashing attitudes?), moral epistemology (how do we refine our attitudes?), or the apparent objectivity of moral reasoning? Quasi-realists offer answers, but critics find them strained.
          *   **The "Partners in Guilt" Issue:** Quasi-realist explanations often rely on normative notions (consistency, commitment, rational planning) that themselves seem to require a realist treatment.

  **IV. Conclusion: Does the Friend's Summary Hold Up?**

  1.  **Accurate Core Challenge:** He correctly identifies the FGP as a major problem for expressivism concerning unasserted contexts, especially conditionals, and the threat of equivocation.
  2.  **Significant Simplifications/Misstatements:**
      *   "Force as strength" is wrong and obscures Frege's point.
      *   Claiming negation/disjunction are "easy" is a major oversimplification; they pose serious compositional problems.
      *   Framing quasi-realism *only* as "higher-order attitudes" ignores the core move about expressing commitments *against combinations* of attitudes and the broader project of compositional semantics.
      *   Declaring expressivism "refuted" ignores the existence and sophistication of the quasi-realist response.
  3.  **The "Smuggling" Charge:** This is a live and serious philosophical debate, not a settled verdict. Quasi-realists offer a detailed, non-collapsible position that maintains the core expressivist ontology while explaining logical embedding. Whether they *succeed* in avoiding collapse is arguably *the* central debate in contemporary metaethics. Calling it "disguised cognitivism" is the *critic's* characterization, not a neutral description. Blackburn *denies* he is a cognitivist.
  4.  **Your Instincts:** Were correct. Nothing gets refuted that cleanly in philosophy. The FGP is a profound challenge that killed simple expressivism, but sophisticated expressivism (quasi-realism) offers a detailed, live, and influential response. The debate over whether quasi-realism succeeds or collapses is ongoing and highly technical. Your skepticism about "force as strength" and the minimization of problems with negation was spot-on.

  **In short:** Your friend gave you a broadly accurate *seminar-room version* of the FGP challenge, highlighting a genuine and deep problem. However, his portrayal of the expressivist response (quasi-realism) was a caricature, underestimating its sophistication and misrepresenting its core moves. His conclusions ("refuted," "smuggling") are partisan realist conclusions, not neutral facts. Quasi-realism is a real, complex, and still-defended position with significant costs and facing serious objections, but it is far from obviously refuted or merely disguised realism. The debate continues.
