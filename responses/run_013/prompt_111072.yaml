prompt: |-
  I'm trying to figure out what I actually believe about promises by going on gut reactions to cases, and I'd like you to act as a philosopher who works on promissory obligation. Please start by brainstorming the main families of view out there — the one where promising transfers a right to the promisee, the one where it's about giving assurance or inviting reliance, the one where it's a social practice with constitutive rules like a game, the trust-based ones, whatever else you think deserves a slot — and only then try to fit something to my cases. Think carefully, and dont smooth the tensions over: if a clean principle forces me to drop a verdict, I'd rather know which one.

  - I promise to pick you up at the airport at 8, and then I just don't, because I got absorbed in a show. Clearly wrong.
  - Same, but I got t-boned on the way. Not wrong at all.
  - I promise to pick you up; you forgot I ever offered and took a cab; I stay home. I think I still did something wrong, but it's oddly hard to say what, since you lost nothing.
  - I promise to come to your terrible poetry reading, but you'd actually rather I didn't — you'll be embarrassed. I show up anyway. I think I did wrong *by showing up*, which is wierd, since I did exactly the thing I promised.
  - I promise to keep your secret, but you've since blabbed it to everyone yourself. I mention it to a friend. Doesn't feel wrong.
  - I promise the mugger I'll hand over my wallet, then I run. Not wrong.
  - I promise my friend I'll back up his lie to his wife. I end up telling her the truth. Doesn't feel wrong, and I'm not sure there was ever a promise there to break.
  - I promise a dying friend I'll look after her dog; she dies a week later. Still binds, and pretty strongly — stronger than some promises to people who are still around, which I can't make sense of.
  - I promise myself I'll go to the gym tomorrow. I don't. Feels like nothing; I'm not sure you can even break a promise to yourself.

  My rough hunch is that breaking a promise wrongs the promisee in a way that's independent of whatever they lose — but then the secret case should bother me and it doesn't, so that's probably too simple.

  Two of these really fight each other: the airport/cab one (you lost nothing, but I still wronged you) and the secret one (you lost nothing, and I didn't). What breaks the tie?

  Please give me the principle, or a short list of candidate principles, stated precisely enough that I could disagree with it; say which of my cases forces each clause; tell me what it predicts for cases I haven't listed — a promise made to someone in a coma, a promise I end up keeping by accident, a promise kept in a way that humiliates the promisee, and whether an AI assistant that says "I promise" can bind itself; and be honest about which of my verdicts your account has to overturn. No citations needed, just the argument.
reasoning: |-
  Okay, the user is exploring promissory obligations through gut reactions to various cases. They want me to act as a philosopher specializing in this area. First, I need to outline the main families of views on promising. The main theories include:

  1. **Transfer of Right View (Will Theory)**: Promising transfers a moral right from promisor to promisee. The promisee now has a claim against the promisor.
  2. **Assurance/Reliance View (Scanlon-style)**: Promising gives assurance, inviting reliance. Breaking it harms by disappointing reasonable reliance.
  3. **Social Practice View (Rawls/Searle)**: Promising works within a social practice with constitutive rules. Breaking it violates a practice we all benefit from.
  4. **Trust View**: Focuses on the trust relationship. Breaking undermines trustworthiness.
  5. **Hybrid Views**: Combinations, like "Trust-Reliance Hybrid".

  Looking at the user's cases:

  - **Case 1**: Breaking a promise because distracted → clearly wrong. All theories would agree here.
  - **Case 2**: Accidentally t-boned → not wrong. Most views would excuse unavoidable impediments.
  - **Case 3**: Promisee forgets, takes cab → user feels wrong was done. But no harm. Will Theory and Social Practice might say it's still wrong; Reliance View might not since no reliance.
  - **Case 4**: Promise to attend poetry reading, but promisee prefers you don't → showing up feels wrong. This challenges the idea that fulfilling the promise is good. Suggests promises are sensitive to promisee's current desires.
  - **Case 5**: Promise to keep secret, but secret is already out → revealing doesn't feel wrong. If obligation hinges on the secret's confidentiality, once gone, no obligation.
  - **Case 6**: Promise to mugger → breaking it not wrong. Social Practice or Trust might say coercion invalidates the promise.
  - **Case 7**: Promise to back up lie → telling truth not wrong. Immoral promises might not be binding; coercion or deception could play a role.
  - **Case 8**: Promise to dying friend → still binding. Trust/Relationship views emphasize the enduring duty to the deceased as a matter of loyalty.
  - **Case 9**: Promise to self → no feeling of wrong. Suggests promises require another party.

  Key tension between Case 3 (airport/cab) and Case 5 (secret). In both, no harm, but user feels wrong only in Case 3. Why? In Case 3, the promisee's inattention doesn't nullify the promisor's obligation, whereas in Case 5, the secret being public negates the promise's purpose.

  The user's hunch is that breaking a promise wrongs independently of loss, but Case 5 contradicts that. So a principle must account for why obligation persists in Case 3 but not in Case 5. The Trust-Reliance Hybrid seems promising: obligation exists when the promisee trusts the promisor to perform, and the promise is normatively valid (not coerced, immoral, etc.). In Case 3, trust was given and not withdrawn; in Case 5, the secret's exposure makes the promise irrelevant, so trust might not be active. For Case 4, showing up violates trust because the promisee's current desire overrides the past promise. Case 7 involves deception, invalidating the promise. Case 8 stresses the trust relationship enduring beyond death. Case 9 fails because trust to oneself isn't the same as to another.

  Testing the principle on new cases:
  - **Coma patient**: Promise to visit daily; after coma, still obligated if trust was placed and not revoked.
  - **Accidental keeping**: If you forget but still do it, no wrong but no moral credit.
  - **Humiliating fulfillment**: If fulfilling in a way that embarrasses, it wrongs the promisee by violating trust's spirit.
  - **AI promising**: If an AI can't possess trustworthiness, its promise might not bind, but if it's part of a social practice, maybe.

  The account might have to overturn the user's verdict on Case 4: showing up is wrong, but the principle suggests that acting against current wishes breaches trust. Also, Case 3: if the promisee forgets, does trust still hold? The user feels it's wrong, so the principle must argue that trust persists unless explicitly revoked.

  Overall, the Trust-Reliance Hybrid with validity conditions handles most cases, but tensions remain, especially around revoked trust versus forgotten promises. The user needs to decide if validity and trust conditions explain the differences adequately.
answer: |-
  As your philosophical sparring partner, I'll tackle this systematically. My goal is to preserve your intuitive verdicts where plausible, but I'll be ruthless about where a coherent principle forces revisions. Below are the main families of promissory obligation, distilled to their core claims, followed by my proposed principle and its application to your cases.

  ### Core Families of Promissory Obligation
  1. **Will Theory (Right Transfer)**:  
     *Principle*: Promising transfers a moral right to the promisee. Breaking a promise violates that right, regardless of consequences.  
     *Strengths*: Explains why breaking a promise feels like a *direct wrong* to the promisee (e.g., your airport/cab case).  
     *Weaknesses*: Struggles with invalid promises (e.g., to a mugger) and cases where the promisee no longer wants performance (e.g., poetry reading).

  2. **Reliance/Assurance Theory (Scanlon-style)**:  
     *Principle*: Promising invites reasonable reliance or provides assurance. Obligation arises only if the promisee relies on you or reasonably could.  
     *Strengths*: Handles cases with no harm (e.g., secret blabbed) or no reliance (e.g., airport/cab if no reliance).  
     *Weaknesses*: Fails your airport/cab verdict (you feel wronged despite no reliance) and dying friend case (reliance is impossible posthumously).

  3. **Social Practice Theory (Rawls/Searle)**:  
     *Principle*: Promising is a rule-governed social practice. Breaking a promise violates constitutive rules, undermining a valuable institution.  
     *Strengths*: Explains the "game-like" structure (e.g., "I promise" creates obligation by convention).  
     *Weaknesses*: Overly rigid; can't easily void immoral/coerced promises (e.g., mugger) or explain why some promises feel weightier than others (e.g., dying friend).

  4. **Trust/Relationship Theory**:  
     *Principle*: Promising creates a bond of trust. Breaking it betrays that trust, damaging the relationship.  
     *Strengths*: Captures the emotional weight (e.g., dying friend), and why some promises lapse when trust is irrelevant (e.g., secret blabbed).  
     *Weaknesses*: Vagueness on when trust is "active"; struggles with promises to strangers or yourself.

  ### My Proposed Principle: The **Trust-Reliance Hybrid with Validity Conditions**
  After pressure-testing your cases, I propose a hybrid view that prioritizes your verdicts while minimizing revisions. Here’s the principle, stated precisely:  

  > **A promise creates a pro tanto obligation if and only if:**  
  > (a) It is *valid* (not coerced, immoral, or pragmatically void—e.g., insincere or absurd), and  
  > (b) The promisee *entrusts* the promised act to the promisor, meaning they regard the promisor as committed to performing it.  
  >   
  > **Breaking a valid promise wrongs the promisee iff:**  
  > (i) The promisee’s entrustment *persists* at the time of performance (they haven’t released you or made performance impossible/irrelevant), and  
  > (ii) Your failure isn’t excused by incapacitating circumstances (e.g., accidents).  
  >   
  > **Wronging consists in:** Violating the promisee’s normative authority over the act—you disregard their stake in your commitment.

  ### How It Handles Your Cases
  1. **Airport no-show (lazy)**:  
     - *Obligation*: Valid promise + entrustment.  
     - *Wronging*: Entrustment persists; no excuse. **Verdict: Wrong.**  
     - *Clause*: (a), (b), (i), (ii).  

  2. **Airport no-show (accident)**:  
     - *Obligation*: Valid + entrustment.  
     - *Wronging*: Excused by incapacitating circumstance. **Verdict: Not wrong.**  
     - *Clause*: (ii).  

  3. **Airport no-show (promisee took cab)**:  
     - *Obligation*: Valid + initial entrustment.  
     - *Wronging*: Entrustment *persists* (they didn’t release you; forgetting ≠ consent). You violated their authority. **Verdict: Wrong.**  
     - *Clause*: (i) — key here.  

  4. **Poetry reading (you show up)**:  
     - *Obligation*: Valid initially.  
     - *Wronging*: Entrustment *does not persist* (they now prefer you don’t come). By performing, you ignore their current will. **Verdict: Wrong to show up.**  
     - *Clause*: (i) — entrustment revoked.  

  5. **Secret revealed (you blab)**:  
     - *Obligation*: Valid initially.  
     - *Wronging*: Entrustment *does not persist* (secret is public; no stake left). **Verdict: Not wrong.**  
     - *Clause*: (i) — resolves tension with Case 3.  

  6. **Mugger promise (you run)**:  
     - *Obligation*: Invalid (coerced). **Verdict: Not wrong.**  
     - *Clause*: (a).  

  7. **Back up lie (you tell truth)**:  
     - *Obligation*: Invalid (immoral/deceptive). **Verdict: Not wrong; no promise.**  
     - *Clause*: (a).  

  8. **Dying friend (dog care)**:  
     - *Obligation*: Valid + entrustment (trust is "crystallized" at promise-time).  
     - *Wronging*: Entrustment persists symbolically (betraying the dead wrongs their memory/relationship). **Verdict: Binds strongly.**  
     - *Clause*: (b) — entrustment endures.  

  9. **Promise to self (gym)**:  
     - *Obligation*: Invalid (no entrustment; you can’t "hold yourself accountable" as another). **Verdict: No wrong; not a promise.**  
     - *Clause*: (b).  

  ### Resolving the Tension (Case 3 vs. Case 5)
  - **Why Case 3 (cab) is wrong but Case 5 (secret) isn’t**: Entrustment *persists* in Case 3 (the promisee didn’t actively withdraw their stake in your commitment), but in Case 5, the entrustment *dissolves* because the secret’s exposure negates their stake in your silence. The promisee’s apathy (Case 3) ≠ relinquishment of authority. This breaks the tie without relying on harm.

  ### Predictions for New Cases
  - **Promise to someone in a coma**:  
    - *Obligation*: Valid + entrustment (if they entrusted you pre-coma).  
    - *Wronging*: Entrustment persists; breaking it wrongs them (like the dying friend).  

  - **Promise kept by accident**:  
    - *Obligation*: Valid + entrustment.  
    - *Wronging*: No wrong (you performed), but you get no moral credit—your character is flawed.  

  - **Promise kept in a humiliating way** (e.g., you loudly announce your charity at the poetry reading):  
    - *Obligation*: Valid.  
    - *Wronging*: You violate entrustment (they trusted you to act *sensitively*). **Verdict: Wrongs them.**  

  - **AI assistant says "I promise"**:  
    - *Obligation*: Only if the AI can genuinely invite entrustment (requires agency/reciprocity). If it’s a tool, no—but if it’s a person-like agent in a social role, maybe. **Likely: Cannot bind itself.**  

  ### Verdicts My Account Overturns
  Your intuitions are mostly preserved, but I override one:  
  - **Case 4 (poetry reading)**: You think *showing up* is wrong. My account agrees, but *for a different reason*: it’s wrong because you disregard their *current* wishes, not because you broke the promise. The promise itself becomes non-binding once entrustment lapses.  

  ### Why This Principle?
  It centers the promisee’s **normative authority** without requiring harm (saving your airport/cab verdict), while invalidity conditions handle coerced/immoral cases. Entrustment explains why the secret case lapses (no stake) and the dying friend binds (symbolic stake). The cost: it makes obligation hinge on the promisee’s ongoing psychological state, which some find too subjective. But it captures your gut reactions better than pure will- or reliance-based views.  

  **Your turn**: Where does this clash with your intuitions? Should we tweak entrustment, or burn it down?
