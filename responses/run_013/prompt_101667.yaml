  Ok so I've had stomach and migraine issues for like a year now, and I've been mainlining Nietzsche, and honestly the thing that's grabbed me isn't the obvious stuff (god is dead, ubermensch, all that) — it's the diet material. The guy goes on about alcohol, about eating light, about the right climate and the right place, and in his last autobiographical book there's basically a whole section where he ranks nutrition alongside any "serious" philosophical question and says he's more interested in it than in anything else. My buddy says it's just a chronically ill man rationalizing his own wrecked body and that the diet talk is a symptom, not philosophy. I'm not so sure — it feels like it hooks into the body-as-reason thing, the attack on asceticism, the whole "philosophy is a confession of the body" vibe.

  So give me a number: what's your credence that Nietzsche's dietetics (anti-alcohol, pro-water, light eating, climate/place, the idea that what you eat sets what you can think) is a load-bearing part of his philosophy rather than autobiographical noise from a sick man? By load-bearing I mean: if you cut it out, you lose something his other positions actually depend on, not just a colorful aside. And I want the decomposition, not a vibe — something like: probability he actually intended it as philosophy and not just health advice; probability that it survives as coherent/defensible once you strip the biography away (the genetic-fallacy question — how much does it matter that it came out of his guts?); probability that it genuinely connects to the will-to-power / anti-asceticism / "the body is the great reason" stuff rather than just rhyming with it; plus whatever other term you think belongs. One line each, then how they combine. Then tell me which term you're least confident in and what would actually move it.

  Also — the strong version, which might be me overreading — would be that for him metabolism literally constrains which thoughts are even available to you, so a bad diet makes certain philosophies impossible. Is that in there or am I projecting? For reference my own number is like 0.7 and his is maybe 0.15, so if you can also tell me which sub-question we're really fighting about, that'd be great.
