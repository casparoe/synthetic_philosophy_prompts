  First, I need to unpack their emotional state. They feel trapped between duty and personal sacrifice. The user mentioned they'd help in other ways—visiting more, paying for care, taking leave—but resist uprooting their life. The core conflict is obligation versus autonomy.

  The friend's philosophical points are central here. Let me break them down: 
  1. Sacrifice vs. choice: If moving back doesn't lead to regret, is it even a sacrifice? This challenges the idea of forced duty. 
  2. Gift vs. debt: The family framing it as a duty turns potential voluntary help into an obligation, reducing their agency. 
  3. Boundaryless demands: A rule without limits isn't sustainable. 

  The user questions if these ideas are just excuses. They want to know what they truly owe versus what they can choose to give. 

  I should validate their resistance to sacrificing their life. Their identity and stability matter. The family's assumption that they're the default solution ignores their brother's proximity and their own established life. The aunt's guilt-tripping is unfair.

  Next, practical solutions. The brother's role needs reassessment. Even with kids and a busy job, he could share responsibilities. Professional help is crucial—respite care, home health aides. The mother might resist outside help, but it's necessary. Financial contributions from both siblings could fund this. 

  Long-term planning: Assisted living or nursing care might be inevitable. The user can facilitate this remotely. They can also coordinate care without relocating, using their resources to manage logistics. 

  Philosophically, the gift/debt distinction is key. Framing help as voluntary preserves their agency. The user's offer to contribute significantly without dismantling their life is valid. 

  Least confident point: Balancing emotional guilt with practical solutions. The mother's passive appeals ("I don't know what I'd do without you") are manipulative, even if unintentionally. Navigating this without estrangement is delicate. 

  Overall, the user shouldn't have to abandon their life. A multi-pronged approach involving paid help, brother's involvement, and systemic solutions is better. Confidence is high in this, but the emotional dynamics with the mother are trickier to address without causing friction.
