  Here’s a clear framework for navigating this profound dilemma, balancing compassion with self-preservation. My confidence in this advice is **high (85%)**, grounded in ethics, caregiving realities, and your stated boundaries. The least certain point is noted at the end.

  ### Core Principles & How to Think About This
  1. **"Duty" vs. "Choice" is Real (and Crucial)**  
     Your friend’s distinction between a coerced "debt" and a voluntary "gift" is deeply valid. Healthy caregiving cannot thrive under guilt or obligation. True care is sustainable when it’s an act of love, not extortion. Your aunt’s "good daughter" comment weaponizes familial bonds—**this is emotional coercion, not moral wisdom**. Resisting this framing isn’t selfish; it’s necessary to preserve your capacity to give *authentically*.

  2. **Sacrifice Must Have Limits**  
     Your friend’s third point is critical: **Unconditional surrender to others’ needs is a path to resentment and collapse**. Parkinson’s care can last decades. Sacrificing your career, relationships, and mental health won’t save your parents—it may only create two casualties instead of one. Sustainable care requires boundaries.

  3. **"What You Owe" vs. "What You Give"**  
     - **Owed**: Basic respect, compassion, and *reasonable* support within your capacity.  
     - **Given**: Anything beyond that is a gift. Your offers (paying for help, visiting, taking leave) are significant gifts.  
     **Key Insight**: You owe your parents *a solution*, not necessarily *your physical presence*. Equating care with self-destruction is a false binary.

  ### Practical Path Forward (Without Relocating)
  **Your Resistance is Legitimate—Act on It**  
  Your life need not be "spent." Instead:

  1. **Demand a Family Reassessment**  
     - Your brother’s proximity doesn’t absolve him. With your financial support, he could:  
       ⋄ Cover 1-2 evenings/week so your mother rests.  
       ⋄ Manage hired helpers during emergencies.  
     - **Script**: *"We all have constraints. I’ll fund 80% of in-home care costs if you oversee it locally. Without teamwork, Mom collapses—and we lose both parents."*

  2. **Invest in Professional Care Immediately**  
     - Hire a **geriatric care manager** ($100-$200/hour) near your parents to:  
       ⋄ Assess needs (respite care, home health aides, day programs).  
       ⋄ Navigate insurance/Medicaid.  
       ⋄ Act as neutral coordinator.  
     - **Cost Offset**: Your financial contribution here is more sustainable than relocating. Offer to cover 70-100%.

  3. **Set Non-Negotiable Boundaries**  
     - To your mother: *"I love you too much to watch you drown. I’m hiring help next week. If you fire them, I cannot replace myself."*  
     - To your aunt: *"I trust you want the best for Mom. I’m funding her care—if you’d like to contribute time, we’d be grateful."*  
     - **Critical**: Visit *only* after care is in place. Otherwise, you become the crisis tool.

  4. **Explore Systemic Solutions**  
     - **Assisted Living/Nursing Home**: Parkinson’s often requires 24/7 skilled care. Your father may qualify for Medicaid if funds are limited.  
     - **Your Role**: Lead logistics remotely (research, paperwork) while your brother handles tours/meetings.

  ### Why This Honors Everyone (Including You)
  - **Your parents** get sustainable care without burning out their daughter.  
  - **Your brother** contributes proportionally (time + oversight) without quitting his job.  
  - **You** preserve your livelihood while giving *meaningful* support.  
  - **The Family** escapes the delusion that martyrdom = love.

  **Least Confident Point**: Whether your mother will accept outside help. Many exhausted caregivers paradoxically reject aid, fearing loss of control or guilt. If she resists, enlist her doctor/therapist to intervene. My uncertainty lies in predicting her compliance—but **this doesn’t make the strategy wrong**, only harder to implement. Stay firm.

  **Final Thought**: You are being asked to light yourself on fire to keep others warm. True care means bringing firewood, blankets, and recruiting others to tend the hearth. Your gifts—money, coordination, emotional support—are immense. Sacrificing your future helps no one long-term. Protect your life; it’s the only vessel from which you can pour.
