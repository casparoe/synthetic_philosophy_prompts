prompt: |-
  I'm a backend engineer, about eight years in, no philosophy background at all, and I've somehow become the person who owns engineering metrics at a 60-person startup. I keep getting into the same argument with my manager and I want to know if there's actually a principle behind my gut or if I'm just inconsistent about which numbers I'm precious about.

  I've heard this stuff called Goodhart's law, the thing where a measure stops being a good measure once you start managing to it. Great, but that's a fortune cookie, it doesn't tell me which of these I should be mad about. Here's what I actually think:

  - Support is measured on tickets closed per day. Agents close tickets the customer hasn't confirmed are fixed, they reopen the next morning. I think this is cheating and I want the metric gone.
  - Teams are measured on story points per sprint. Everyone inflates their estimates. Cheating, kill it.
  - We track test coverage. People write tests that call the function and assert nothing. Cheating, kill it.
  - Recruiters are measured on interviews scheduled. They book candidates who obviously won't pass. Cheating, kill it.
  - We had a build-time target and someone moved our slowest integration tests into a nightly job. Number went down, nothing got faster. And honestly... I'm fine with it? It's the exact same shape as the support one, the number drops and the underlying thing is untouched, and I can't defend the difference.
  - Deploy frequency target, team split one big deploy into five small ones. I think that's fine, arguably that was the point.
  - Tickets shipped target, team split one ticket into five. I think that's cheating. Literally the same move as the deploy one.
  - p99 latency target. People made real fixes, nothing weird happened. Fine.
  - Revenue for the sales team. Fine, that's the thing itself, not a stand-in for it.
  - P1 incidents. They reclassified P1s as P2 and added a "mitigated" state that stops the clock. I think it's bad, but the side effect was that we finally wrote down what P1 means, which was genuinely useful and had been a mess for two years.
  - Database migrations per month. The number went up, nobody was gaming anything, it just turned out to measure nothing (we were shipping more features). Not cheating, just useless.

  A guy on my team who reads a lot of this stuff says there are basically four seperate ways a metric goes wrong and they need different fixes: (a) the metric is a noisy shadow of the thing we want, so the top scorers aren't actually the best, like picking people by a test that only half correlates with anything; (b) the metric and the real goal are related but only in the normal range, and once you push to the extremes the relationship flattens or flips; (c) the metric is a symptom of the goal rather than a cause of it, so moving the number doesn't move the goal, like judging a hospital by how many X-rays it does; (d) people just lie, dress up, or game the numbers to fool whoever's reading the dashboard.

  What I want:

  1. Is his four-way split the right cut, or does it need surgery? Is there a simpler principle that does the same work? If a clause only exists to save one of my verdicts, say so.
  2. Which of my verdicts does the best version of the principle actually support, and which does it say I have to give up? I'd rather lose a verdict than have a principle with a special exception for every case.
  3. I'm about to roll out time-to-first-response for our on-call rotation (how long until someone acknowledges an alert). I'm worried it'll produce instant useless acknowledgements. Tell me what the principle says about that one, and whether it's the ticket-closing case, the build-time case, or neither.
  4. Give me its verdict on a metric I haven't listed, so I can tell whether the principle is doing any work or just restating my gut.

  Plain English, please, and no reading list, I'm definately not going to read the papers.
reasoning: |-
  Okay, let me tackle this backend engineer's problem. They're dealing with Goodhart's Law in various metrics at their startup and need a practical framework to judge which metrics are worth keeping. 

  First, I need to understand their core frustration. They see cheating everywhere but have inconsistent reactions to similar behaviors. The engineer's teammate proposed a four-category breakdown of metric failures. But is that the best model? 

  Hmm... reviewing their examples, I notice a pattern. When the gaming directly damages the underlying goal (like support closing tickets prematurely), it's clearly bad. But when the gaming actually improves the system (like splitting deploys), it's acceptable. The key difference seems to be whether the behavior aligns with or sabotages the true intent.

  For instance, recruiters booking bad candidates wastes everyone's time - that's collateral damage. But writing empty tests just to hit coverage? That creates false confidence in quality. Meanwhile, moving slow tests to nightly doesn't harm anything - the build still passes, just with smarter partitioning. 

  The P1 incident example is fascinating. Yes, they gamed the metric by reclassifying, but it forced them to define what P1 actually means - which was valuable. So sometimes the process of setting up the metric fixes broken assumptions, even if the metric itself gets gamed later.

  For their new on-call response metric... instant meaningless acknowledgements would be like the support ticket closure problem. But if the goal is just to ensure alerts aren't ignored, maybe that's acceptable? Though ideally you'd want meaningful engagement. Perhaps adding a second metric (like resolution time) would create balance.

  The simplest principle might be: Does this metric create harmful side effects? Not all gaming is equal - we should ask whether the gaming behavior damages the system while chasing the number. That explains why splitting tickets feels dirty (creates busywork) but splitting deploys feels right (encourages good practice).

  Testing this principle against revenue: no side effects, it's the real goal. Database migrations? Harmless but useless. Build time trick? Harmless optimization. Their gut reactions mostly align except maybe the P1 case - which shows metrics can have secondary benefits even when gamed.

  For the on-call metric, the principle suggests it's vulnerable to empty acknowledgements that don't improve incident response. To prevent damage, pair it with resolution time or escalation rules.
answer: |-
  Your gut is consistent - you're reacting to **collateral damage**, not gaming itself. Here's the simplest principle that explains all your verdicts and fixes the four-way split:

  **A metric is broken when gaming it damages the system. If gaming improves or leaves the system unharmed, the metric is fine (or just useless).**

  ### The Collateral Damage Principle Explained:
  1. **Gaming + Harm = Bad Metric**  
     (Agents close tickets prematurely → customers get worse support)  
     (Inflated story points → planning becomes meaningless theater)  
     (Tests assert nothing → false confidence in broken code)  
     (Bad interviews → engineers waste hours, candidates feel disrespected)

  2. **Gaming + No Harm = Tolerable Metric**  
     (Nightly slow tests → builds *are* faster for developers, no downside)  
     (Splitting deploys → system *is* more deployable, goal achieved)

  3. **No Gaming + Useless = Dumb but Innocent Metric**  
     (Database migrations → harmless vanity stat)

  4. **Gaming + Accidental Benefit = Flawed but Useful**  
     (P1 reclassification → gaming exposed bad definitions, forcing clarity)

  ---

  ### Your Verdicts Revisited:
  | Your Example                 | Verdict Under Principle                     | Why                                                                 |
  |------------------------------|---------------------------------------------|---------------------------------------------------------------------|
  | Support tickets/day          | ✅ **Kill it**                               | Harm: Customers unresolved, trust eroded                           |
  | Story points/sprint          | ✅ **Kill it**                               | Harm: Planning useless, team cynicism                              |
  | Test coverage %              | ✅ **Kill it**                               | Harm: Code quality illusion increases risk                         |
  | Interviews scheduled         | ✅ **Kill it**                               | Harm: Wastes engineering time, hurts employer brand                |
  | Build-time target (nightly)  | ✅ **Fine**                                  | **No harm**: Dev experience improved, no downside                  |
  | Deploy frequency (split)     | ✅ **Fine**                                  | **No harm**: Encourages good practice (small deploys)              |
  | Tickets shipped (split)      | ✅ **Cheating**                              | Harm: Creates busywork, distracts from real work                   |
  | P99 latency                  | ✅ **Fine**                                  | No gaming, real fixes (ideal)                                      |
  | Revenue                      | ✅ **Fine**                                  | The actual goal (can't be "gamed" without achieving it)            |
  | P1 incidents                 | ⚠️ **Flawed but temporarily useful**         | Harmful gaming BUT forced useful definition (net positive?)        |
  | DB migrations/month          | ✅ **Harmless junk**                         | Useless but no damage                                               |

  **Where you might "give up" a verdict**:  
  The P1 case is messy. Your anger is valid (reclassification *is* harmful gaming), but the principle says: if the net outcome improved the system (clear definitions), it's less bad. Still flawed, but not pure evil.

  ---

  ### Your On-Call Metric (Time-to-First-Response)
  - **The Risk**: Engineers send "ACK" instantly without looking, then go back to sleep.  
  - **Collateral Damage?**: **YES.**  
    - Alerts get "acknowledged" but ignored.  
    - Critical incidents stall until someone *actually* investigates.  
    - Creates dangerous false confidence.  
  - **Verdict**: **This is the Support Tickets problem.** Gaming directly harms the system.  

  **Fix it**: Pair it with **time-to-mitigation**. Only start the "acknowledge" clock when they *open the alert*, and require a follow-up action within X minutes. No empty ACKs.

  ---

  ### Test Case: "Lines of Code Written" as a Productivity Metric
  - **Gaming**: Engineers write verbose, redundant code.  
  - **Collateral Damage?**: **YES.**  
    - Codebase becomes bloated and harder to maintain.  
    - Bugs increase, velocity slows long-term.  
  - **Verdict**: **Broken metric** (like your test coverage example). Kill it.

  ---

  ### The Bottom Line
  Stop debating "gaming vs. not gaming." Ask: **"If they game this, does something break?"**  
  - If gaming breaks things → metric is toxic.  
  - If gaming is harmless or helpful → metric is tolerable.  
  - If no one cares enough to game it → metric is noise.  

  Your gut was right all along – you just needed to name the pattern. Roll out that on-call metric with the mitigation-time pairing, and you'll avoid creating a new support-tickets hell.
