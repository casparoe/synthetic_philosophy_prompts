  ### Detailed Comments

  #### Part (i): Compute the expected utility of each act and state which act expected utility recommends.  
  - **Candidate's Answer:**  
    EU(A) = u(20) = 20.  
    EU(B) = 0.6·u(0) + 0.3·u(40) + 0.1·u(100) = 0 + 12 + 10 = 22.  
    Expected utility recommends B.  

  - **Assessment:**  
    This part is fully correct. The utility function is u(x) = x, so EU(A) = u(20) = 20 is accurate for the certain outcome. For EU(B), the calculation correctly applies the expected utility formula: the probabilities are multiplied by the utilities, and the sum is 0.6×0 + 0.3×40 + 0.1×100 = 0 + 12 + 10 = 22. Since 22 > 20, EU recommends B over A. This demonstrates a proper understanding of expected utility.  

  - **Mark:** 5 out of 5 (full credit for this part).  

  #### Part (ii): Using the definition of risk-weighted expected utility, compute the REU of each act and state which act REU recommends.  
  - **Candidate's Answer:**  
    Claims REU replaces probabilities with the risk function, leading to:  
    REU(B) = r(0.6)·u(0) + r(0.3)·u(40) + r(0.1)·u(100) = (0.6²)×0 + (0.3²)×40 + (0.1²)×100 = 0.36×0 + 0.09×40 + 0.01×100 = 0 + 3.6 + 1 = 4.6.  
    REU(A) = r(1)·u(20) = (1²)×20 = 20.  
    REU recommends A since 20 > 4.6.  

  - **Assessment:**  
    - **REU(A) Computation (Correct):** The candidate correctly computes REU(A) = 20. For a sure outcome like act A (only one outcome, £20), the REU definition simplifies to u(x₁) = u(20) = 20, as there are no utility differences to weight. The use of r(1) is unnecessary but harmless since r(1) = 1² = 1, so it yields the same result. This deserves credit.  
    - **REU(B) Computation (Incorrect):** The candidate fundamentally misunderstands the REU definition. The definition provided requires outcomes to be ordered from worst to best, with REU computed as:  
      REU(f) = u(x₁) + Σ_{i=2}^n [u(x_i) − u(x_{i-1})] r(Σ_{j=i}^n p_j).  
      The candidate incorrectly assumes REU is a simple weighted sum where r(p) replaces individual probabilities (i.e., ∑ r(p_i) u(x_i)), which is not the case. The correct method involves:  
      1. Ordering outcomes: For act B, outcomes are x₁ = £0 (p=0.6), x₂ = £40 (p=0.3), x₃ = £100 (p=0.1).  
      2. Applying the formula:  
         - u(x₁) = u(0) = 0  
         - Term for i=2: [u(x₂) - u(x₁)] × r(Σ_{j=2}^3 p_j) = [40 - 0] × r(0.3 + 0.1) = 40 × r(0.4)  
         - Term for i=3: [u(x₃) - u(x₂)] × r(Σ_{j=3}^3 p_j) = [100 - 40] × r(0.1) = 60 × r(0.1)  
      With r(p) = p², r(0.4) = (0.4)² = 0.16 and r(0.1) = (0.1)² = 0.01.  
      Thus, REU(B) = 0 + (40 × 0.16) + (60 × 0.01) = 0 + 6.4 + 0.6 = 7.0.  
      The candidate's computation (4.6) is incorrect due to the erroneous method.  
    - **Recommendation (Correct but Coincidental):** The candidate states REU recommends A since 20 > 4.6. With the correct REU(B) = 7.0, REU(A) = 20 > 7.0 still holds, so the recommendation (A) is correct. However, this conclusion is based on an incorrect calculation, so it receives limited credit.  
    - **Overall Error:** The candidate's description ("REU is a weighted sum in which the risk function replaces the probabilities") misinterprets the REU definition. The definition uses the risk function on cumulative probabilities (specifically, the decumulative distribution Σ_{j=i}^n p_j), not on individual probabilities.  

  - **Correction for REU(B):**  
    The candidate should have:  
    1. Ordered the outcomes from worst to best: £0, £40, £100.  
    2. Computed:  
       - u(x₁) = u(0) = 0  
       - [u(x₂) - u(x₁)] = 40 - 0 = 40, and Σ_{j=2}^3 p_j = p(£40 or £100) = 0.3 + 0.1 = 0.4, so r(0.4) = 0.4² = 0.16  
       - [u(x₃) - u(x₂)] = 100 - 40 = 60, and Σ_{j=3}^3 p_j = p(£100) = 0.1, so r(0.1) = 0.1² = 0.01  
       - REU(B) = 0 + 40 × 0.16 + 60 × 0.01 = 6.4 + 0.6 = 7.0  
    3. Compared to REU(A) = 20, so REU recommends A.  

  - **Mark:** 3 out of 10.  
    - 1 mark for correct REU(A).  
    - 1 mark for correct recommendation (though derived incorrectly).  
    - 1 mark for attempting REU(B) (showing effort but with a flawed method).  
    - No additional marks due to the fundamental misunderstanding of the REU definition, leading to an incorrect computation for REU(B).  

  #### Part (iii): Explain what the comparison shows about the relationship between REU and EU, and identify the feature of the risk function responsible for the reversal.  
  - **Candidate's Answer:**  
    States that REU can reverse EU's ranking (EU recommends B, REU recommends A). Attributes the reversal to the risk function: "because r(p) = p² is convex, the agent is risk-seeking and gives extra weight to the worst outcomes."  

  - **Assessment:**  
    - **Correct Elements:**  
      - Correctly identifies that a reversal occurs (EU prefers B, REU prefers A).  
      - Correctly notes that the risk function r(p) = p² is responsible and that it is convex.  
    - **Incorrect Elements:**  
      - **"Agent is risk-seeking":** This is wrong. A convex risk function (r(p) = p²) in REU corresponds to risk-aversion, not risk-seeking behavior. This is a critical error. Convex r(p) (where r(p) < p for p ∈ (0,1)) means the agent underweights the probability of better outcomes, reflecting pessimism and risk-aversion.  
      - **"Gives extra weight to the worst outcomes":** While the intuition of pessimism is partially captured, this phrasing is imprecise and misleading. In REU, convex r(p) downweights the utility increments for better outcomes (not directly the worst outcomes). Specifically, the term r(Σ_{j=i}^n p_j) scales the utility difference [u(x_i) - u(x_{i-1})], and for convex r, r(p) < p, so better outcomes (higher utility differences) receive less weight than in EU. This leads to risk-aversion. The candidate's wording suggests direct weighting of outcomes, which is inaccurate.  
    - **Missing Nuance:** The candidate does not explain how the risk function causes the reversal. Specifically, under EU, the agent is risk-neutral (u(x) = x), so prefers B (higher expected value). Under REU, convex r(p) makes the agent risk-averse, so prefers the certain A.  

  - **Full-Credit Answer Requirements:**  
    A full-credit answer should:  
