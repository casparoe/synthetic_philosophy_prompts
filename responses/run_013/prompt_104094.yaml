     Finally, note that the exclusion argument in the SCM framework becomes a straightforward argument about redundancy and the inability to intervene independently. This might be seen as a strength: it clarifies the dilemma. However, it also highlights that the non-reductive physicalist must either reject the supervenience relation (which is not an option) or reject the idea that the physical level is causally sufficient (which might be the case if we have emergent properties). But the causal closure of the physical is built into the model by having B = g(P). 

     Therefore, the translation is faithful in showing that under the premises (supervenience, distinctness, efficacy, and denial of overdetermination) and the causal closure, the mental variable is causally excluded. But it also shows that the key premises are the causal closure and the supervenience. Without causal closure, we might have:

          B = g(M)   [and M = f(P)]

