     b. **Distinctness of Mental and Physical**: This is a claim about the world: mental properties are not identical to physical properties. In the model, we have distinct variables M and P, and the function f is many-to-one (so M is not injective: multiple P states map to same M). 

     c. **Efficacy of the Mental**: Mental states cause behavior. In the model, this would mean that M is a cause of B. In SCM terms, this would require that M is a direct parent of B (or at least an ancestor) and that there is an intervention on M that changes B (holding fixed other variables appropriately). 

     d. **Denial of Systematic Overdetermination**: It is not the case that every behavioral event is causally overdetermined by two independent causes (the mental and the physical). In the model, if both P and M are direct causes of B, then we have overdetermination. The premise denies that this is happening systematically.

