     **Conclusion on the Gap**:

     The gaps are a mix. Some are because the causal-inference vocabulary is limited (e.g., to difference-making, and without levels). Others show that the original argument relies on assumptions that are built into the model (like the causal closure) and that in the model the mental variable becomes redundant. This redundancy might be a consequence of the premises, and the model simply shows that.

