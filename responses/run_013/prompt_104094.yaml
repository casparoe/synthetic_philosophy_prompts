     - Moreover, if we condition on P, then M is fixed (because M is a function of P). So the association between M and B vanishes when we condition on P. This suggests that M is not a cause of B once P is held fixed.

     - The denial of overdetermination: if we were to say that both P and M cause B, then every behavior would be overdetermined. But we deny that systematic overdetermination occurs.

     Conclusion: M is not a cause of B.

