     The exclusion argument, in SCM terms, points out that if we condition on P, then M is fixed and we see no variation. But if we condition on M, we might see variation in B because of variation in P (if there is a direct effect of P on B). 

     Therefore, the causal effect of M on B is not identifiable by conditioning because of the confounder P (which is a common cause of M and B). But we cannot break the confounder because of supervenience.

  9. **"Nothing Over and Above"**:

     (c) The idea that the mental is nothing over and above the physical is captured by the functional dependence M=f(P). But the exclusion argument uses this to argue that M cannot have independent causal powers. 

     In the SCM, we see that if we have:

          B = g(P, M)

     and M=f(P), then we can write B = g(P, f(P)) = h(P). Therefore, M is redundant. 

     So the functional dependence reduces the causal structure to one where P is the only cause. 

     But note: the non-reductive physicalist might say that M is still a cause because it is a node in the graph. However, the argument from redundancy is that the edge M→B is not necessary. 

     Moreover, if we remove M→B and set B = h(P), then the model is simpler and explains the same data. 

     Therefore, the principle of parsimony (or the denial of overdetermination) would lead us to remove M→B.

  10. **Residue Report**:

     **What Translates Cleanly**:

     - Supervenience: captured by M=f(P). This is a clean translation.

     - The distinctness of M and P: captured by the many-to-one nature of f (so M is not identical to P) and by having distinct variables.

     - The denial of overdetermination: in the SCM, if we have both P and M as direct causes, then we have two distinct causes for the same effect. The premise denies this systematically.

     - The efficacy of the mental: we can represent it by having an edge from M to B.

     - The core argument: that conditioning on P makes M and B independent (which in the SCM is because M is fixed by P) and that we cannot intervene on M without changing P. This is a clean translation.

