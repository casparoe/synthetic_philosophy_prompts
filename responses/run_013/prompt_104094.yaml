     - Overdetermination: in the SCM, having two causes is not necessarily overdetermination if they are not independent. In the exclusion argument, the overdetermination is denied because it is systematic. In the SCM, we can model overdetermination, but the premise that it does not happen systematically is a metaphysical claim that we impose on the model.

     **What Does Not Translate**:

     - The metaphysical concept of "causal powers": the SCM framework uses interventions and associations. The idea of causal powers is more than just difference-making. This gap is a defect of the causal-inference vocabulary? Or is it that the original claim was less clear? It might be both: the causal-inference vocabulary is limited to difference-making, but the original argument might rely on a notion of production that is not captured.

     - The intuition that mental states are real and causally efficacious even if they supervene: the SCM framework, by showing that M is redundant, does not leave room for this. But is that a defect? It might be that the argument shows that with the given assumptions, we cannot have mental causation. So the gap is that the framework forces a reduction.

