prompt: |-
  Ok so I need help with something kind of specific and kind of weird, and I've been putting it off for a week.

  My daughter turns one on Saturday. 25 people in the backyard, my wife's family (big, loud, lovely, not one philosopher among them), a handful of our friends, and my old grad-school roommate, who is now a philosopher of the metaphysics persuasion and who has been ruining my sleep for roughly two years. My wife asked me to say something before the cake, I said yes, and now I regret it.

  Here's my situation. She was an IVF baby. One cycle, three embryos, we had them tested, we transferred one, two are still in the freezer. And pretty much since the day of the transfer I've been stuck on a question I can't shake: if we'd transferred one of the other two, would that have been her? If we'd done the whole cycle a year earlier, would that have been her? And my sister offered to carry, which we didn't end up doing — if she'd carried that exact same embryo, would that have been her?

  My roommate says this is a real question with real answers and the answers are no, no, yes. She says there's a name for the position — essentialism about origin, or something like that. She also told me that the sentence "it could have been someone else" is true of the crib and false of the kid, which sounds like a riddle until you realize it's just exactly right. And she's warned me off three things in particular: "she could have been anyone," "we were always meant to have her," and "we chose you" — she says the last one is almost literally true in our case, and that that's exactly why it's a trap.

  So: write me the speech. Around four minutes, call it 600 words. It has to land for the aunts and uncles, and it can't be a lecture — but I don't want to stand there and say things I'd wince at later, and my roommate will definately be listening. I'd like it to actually use the distinction between the origin (the egg and the sperm, the particular embryo) and the carrying and the timing, rather than just gesturing at it. And if there's a way to say, in plain words, that the only way anyone could ever know she's this particular kid is by having actually been there at the beginning, I'd love that in there — but only if it comes out as something a normal person would say out loud while holding a baby. No name-dropping, please, it's a backyard.

  If you can find a sentence for the two in the freezer that doesn't turn them into either copies of her or nothing at all, I'd alot like that too.
