answer: |-
  ### **Color Coordination Game: Illustrating David Lewis on Conventions**
  This activity is designed to mirror Lewis's core ideas: conventions emerge as arbitrary solutions to coordination problems, persist through mutual expectations, and become "sticky" even when suboptimal. It focuses on **pure coordination** (no conflicts of interest), **precedent**, **common expectations**, and **stability**. Below is a complete game design, including setup, rules, payoffs, and debriefing.

  ---

  ### **Game Setup**
  - **Participants**: 15 students (split into 3 groups of 5: Group A, Group B, Group C).  
  - **Time**: 45 minutes total (game: 25 min; debrief: 20 min).  
  - **Materials**:  
    - **Two colored cards per student**: One **red**, one **blue** (use construction paper or index cards).  
    - **Whiteboard** to track "majority color" each round and record transitions.  
    - **Timer** (for 1-minute rounds).  
  - **Room Setup**: Desks in a circle so all can see each other. Groups A, B, and C start in distinct clusters.

  ---

  ### **Rules & Payoff Scheme**  
  **Goal**: Maximize points by coordinating with the group. Points are **symbolic** (e.g., tally marks for "wins," no real rewards).  
  - **Each round**:  
    1. All students simultaneously hold up a colored card (red or blue).  
    2. Teacher counts and announces the **majority color** (e.g., "Red has 9 votes—majority!").  
    3. **Payoff**:  
       - **+1 point** to every student in the majority.  
       - **0 points** to every student in the minority.  
       - *(No ties possible with 15 players.)*  
  - **Key mechanics to force convention emergence**:  
    - **Phase 1: Formation (5 rounds)**  
      - All 15 students play together.  
      - *Goal*: Let a convention (e.g., "always red") emerge organically through repeated play.  
    - **Phase 2: Rotation (10 rounds)**  
      - After round 5, **rotate 2 players** between groups each round (e.g., swap one from A→B, one from B→C, etc.).  
      - *Goal*: New players must infer the convention without instruction, testing its stability.  
    - **Phase 3: Pressure Test (5 rounds)**  
      - After round 15, announce: *"Everyone gets +3 bonus points if the group switches to the other color AND it becomes the new majority. But if you switch and fail, you get 0 points."*  
      - *Goal*: Test if players can abandon a convention even when all prefer change.  

  ---

  ### **Step-by-Step Flow**  
  1. **Introduction (2 min)**:  
     - *Teacher says*: "We’re playing a game. Each round, hold up red or blue. Your goal is to match the majority. No talking during rounds!"  
     - Emphasize: **No strategy hints**—let conventions form "in the wild."  

  2. **Gameplay (25 min)**:  
     - **Rounds 1–5 (Formation)**:  
       - Play 5 rounds (1 min each). A convention (e.g., "red dominates") will likely form by round 3–4.  
       - *Whiteboard*: Track majority color each round (e.g., "Rd1: Red, Rd2: Red, ...").  
     - **Rounds 6–15 (Rotation)**:  
       - After each round, swap 2 players between groups (e.g., A↔B, B↔C).  
       - New players enter with **no context**—they must infer the convention from peers.  
       - *Whiteboard*: Note player swaps (e.g., "After Rd5: Amy (A) ↔ Ben (B)").  
     - **Rounds 16–20 (Pressure Test)**:  
       - Announce the bonus: "+3 points if you switch **and** the new color wins majority."  
       - Play 5 rounds. Most groups will **fail to switch** despite incentives.  

  3. **Tracking Points**:  
     - Students tally their own points on paper (non-monetary, just for engagement).  
     - Example: A student in the majority for 10 rounds scores 10 points.  

  ---

  ### **Debrief (20 min): Mapping to Lewis’s Concepts**  
  Use the whiteboard to recap what happened, then discuss:  
  1. **Coordination & Arbitrariness**:  
     - *Ask*: "How did the group settle on red/blue initially? Was one color ‘better’?"  
     - *Lewis link*: Conventions are **arbitrary**—no intrinsic reason for red vs. blue. The "solution" emerged from random early choices, not rational choice.  

  2. **Precedent & Common Expectation**:  
     - *Ask*: "Why did you keep choosing the same color? How did new players know what to pick?"  
     - *Lewis link*: Once a regularity (e.g., "red wins") appears, it sets a **precedent**. Players stick to it because they **expect others to follow** (common knowledge). New players conform to avoid losing points.  

  3. **Stability & Stickness**:  
     - *Ask*: "Did the group switch colors when offered bonus points? Why or why not?"  
     - *Lewis link*: Conventions are **self-reinforcing**—even when suboptimal (e.g., everyone prefers blue +3), they persist because no one wants to "deviate first." Mutually assured disappointment!  

  4. **Convention vs. Mere Regularity**:  
     - *Ask*: "What’s the difference between everyone wearing jeans (regularity) and driving on the right (convention)?"  
     - *Lewis link*: Conventions require **mutual expectations for coordination**. In the game, choosing red wasn’t just habit—it was a tool to solve the "match the majority" problem.  

  5. **Real-World Links**:  
     - Examples: Driving sides (left vs. right), keyboard layouts (QWERTY vs. DVORAK).  
     - *Key insight*: Conventions stabilize not because they’re "agreed upon," but because they resolve uncertainty through precedent.  

  ---

  ### **Predictable Challenges & Fixes**  
  - **Problem 1: No convention forms in Phase 1**.  
    - *Why*: Early rounds may split 8–7, causing flip-flopping.  
    - *Fix*: Extend Phase 1 by 2–3 rounds. If still unstable, highlight this in debrief: "Without a clear precedent, coordination fails!"  

  - **Problem 2: New players "break" the convention during rotation**.  
    - *Why*: They might choose randomly, causing chaos.  
    - *Fix*: Celebrate this! Ask: "Did the group revert to red/blue? Why?" Use it to discuss how conventions heal via peer pressure.  

  - **Problem 3: Group successfully switches in Pressure Test**.  
    - *Why*: A dominant player might signal (e.g., waving blue card).  
    - *Fix*: If switching succeeds, discuss: "What made coordination possible here? Why is this rare in real life?"  

  ---

  ### **Limitations of the Game**  
  **What the game *cannot* fully replicate**:  
  - **Scale & Complexity**: Real-world conventions (e.g., language) involve layered expectations (e.g., "I expect you to expect me to say ‘hello’"). The game simplifies this to binary choices.  
  - **Conflict-Free Idealization**: Lewis allows for *minor* conflicts (e.g., preferring blue but settling for red). This game is pure coordination—no conflicts exist.  
  - **Emergence Without Play**: Conventions often arise without explicit "rounds" (e.g., social norms). The game’s structure is artificial.  

  **Address in debrief**:  
  > "In reality, conventions form over years, not minutes, and involve deeper expectations. Our game shows the core mechanics—coordination, arbitrariness, and stability—but life is messier!"  

  ---

  ### **Why This Works**  
  - **Pure Coordination Focus**: No temptations to cheat—only mutual dependence.  
  - **Rotation Pressure**: Forces students to experience convention transmission (like culture passing to newcomers).  
  - **Pressure Test**: Reveals how conventions "trap" groups even when change is desired.  

  This activity makes Lewis’s abstract ideas visceral. Students leave understanding that conventions are "arbitrary handshakes" society clings to because, without them, we’d never stop fumbling for solutions.
