answer: |-
  ## Exam Question: Practical Reason & Betterness Chains (30 marks, 90 mins)

  **Analyse the betterness chain described below, where each step O<sub>n</sub> seems better than O<sub>n-1</sub>, but the final outcome O* seems worse than the starting outcome O1.**

  *   **O1:** 1,000 people at well-being level 100.
  *   **O2:** 999 people at 100, 20 people at 60.
  *   **O3:** 998 people at 100, 40 people at 60.
  *   ...
  *   **O50:** 500 people at 100, 10,000 people at 60.
  *   *(Chain continues: Trade remaining 100s for more 60s, then 60s for more 40s, 40s for more 20s, 20s for more 5s)*
  *   **O*:** 100,000 people at well-being level 5.

  **Your essay must address the following specific points:**
  1.  Explain precisely why this chain creates a *formal* problem for the standard conception of "better than" as a transitive relation. Explicitly connect your explanation to the logical relationship between the transitivity and completeness of "at least as good as" and the transitivity of "better than".
  2.  One common response is to claim this is merely a Sorites paradox for betterness. Argue either *for* or *against* this view. If you argue it *is* like a Sorites paradox, explain the consequences this has for resolving the problem. If you argue it is *not*, clearly identify the crucial difference(s) and explain why they undermine the Sorites analogy.
  3.  To resolve the conflict, *one* element of the standard package (transitivity of "better than", transitivity of "at least as good as", completeness of "at least as good as", or the definition of "equally good" as "not better than and not worse than") must be rejected. Choose *one* element to reject. Justify *why* rejecting this specific element resolves the chain problem and explain the *most significant theoretical or practical cost* incurred by this rejection.
  4.  Discuss the implications of your proposed rejection (from point 3) for *rational choice*. Does rejecting this element threaten the requirement for acyclic preferences? If so, is this a fatal objection (a *reductio*) or a manageable consequence? Defend your answer.

  ---

  ## Model Answer (Approx. 800 words)

  This betterness chain presents a profound challenge to the standard axioms of rational choice and value theory. While each adjacent step (O<sub>n</sub> to O<sub>n+1</sub>) appears to be an improvement (sacrificing a tiny decrement for a few at 100 to create many more lives at a significantly positive level like 60), the cumulative effect (O1 to O*) seems disastrous: trading a small, flourishing population for a vast population barely above a life worth living. The formal problem arises because the apparent betterness of each adjacent step, combined with the transitivity of "better than," would force us to conclude O* is better than O1 – a conclusion that contradicts our strong intuition that O1 is better than O*. This is a direct violation of the asymmetry of "better than" (if O* > O1, then O1 cannot be > O*). Crucially, this formal problem is inextricably linked to the logical structure of comparative value relations. If the relation "at least as good as" (≥) is assumed to be both **transitive** (if A≥B and B≥C then A≥C) and **complete** (for any A and B, either A≥B or B≥A), then the derived relation "better than" (>), defined as A>B iff A≥B and not B≥A, is *guaranteed* to be transitive. Therefore, the chain forces us to abandon at least one of these core assumptions: the transitivity of "better than" itself, the transitivity of "at least as good as", the completeness of "at least as good as", or the standard definition linking "better than" and "equally good".

  Dismissing this as merely a Sorites paradox for betterness is mistaken and evades the core normative challenge. While both involve small-step transitions leading to counterintuitive endpoints, a crucial difference exists. The Sorites paradox fundamentally relies on **vagueness** in the predicate (e.g., "heap," "bald"). There is genuine indeterminacy about where exactly the predicate fails to apply along the spectrum. In the betterness chain, however, the core issue is not vagueness *about what constitutes "better than"* in the adjacent comparisons. Each adjacent trade (e.g., O1 to O2) involves a clear, *non-vague* normative judgment: sacrificing an imperceptibly small decrement for one person (from 100 to 99.999...? – but crucially, in this chain, it's a *discrete* drop for a few people down to 60) to create many new lives at a good level (60) *does* seem genuinely better according to plausible aggregative principles (like Total Utilitarianism or even some forms of Averagism, depending on the numbers). The counterintuition arises not from semantic indecision, but from the *interaction* of these discrete, seemingly correct, small judgments with the formal requirement of transitivity when aggregated over many steps. The problem is structural and logical, not semantic. Treating it as Sorites invites dismissing the adjacent judgments as faulty due to vagueness, but the normative force of those adjacent judgments is precisely what drives the paradox; they aren't borderline cases in the same way a 1001-grain heap is.

  To resolve the conflict while preserving the intuitive adjacent judgments, I propose rejecting the **completeness** of the "at least as good as" relation. That is, I deny that for every pair of outcomes A and B, we must be able to say either A is at least as good as B or B is at least as good as A. Specifically, I argue that outcomes differing significantly in both population size and average (or total) well-being, like O1 and O*, are **incomparable**. Neither is at least as good as the other. This directly blocks the problematic inference: while O2 might be better than O1, and O3 better than O2, and so on, when we reach outcomes sufficiently different in kind (like O50 or O*), the relation simply fails to hold *in either direction* relative to O1. There is no complete chain of "better than" links from O1 to O* because the chain crosses into a zone of incomparability. Thus, O1 cannot be inferred to be worse than O* via transitivity.

  The most significant cost of rejecting completeness is widespread **incomparability**. Many important social choices involving trade-offs between quality of life and quantity of lives, or between different distributions across time or groups, may lack a determinate betterness ranking. This creates profound difficulties for rational choice and social decision theory. Rational choice typically requires an acyclic preference relation to avoid being "money-pumped" (e.g., paying to move from A to B, then B to C, then C back to A, losing resources each time). Incomparability itself does not *directly* cause cycles; an incomplete but acyclic ordering is possible. However, rejecting completeness *to resolve this chain* means admitting fundamental breaks in comparability across the spectrum. While this avoids the *specific* cycle implied by the chain (O1 > O* and O* > ... > O1), it threatens the very possibility of rationally choosing between vast classes of outcomes. We might be forced to say that choosing O1 over O*, or vice-versa, is not dictated by betterness relations alone, requiring other decision rules (procedural, satisficing, agent-relative) which may seem less robust or objective. This is a heavy price, undermining the aspiration for a complete, objective axiology guiding social choice.

  Is this a *reductio*? Not necessarily, but it is a major theoretical cost. We can perhaps *live* with incomparability – many philosophers argue we must for other reasons (e.g., incommensurable values). We can develop decision theories that don't require completeness. However, it fundamentally weakens the normative force of "better than" for large-scale intergenerational or population ethics. It concedes that there is no single, complete, objective ranking of all possible worlds based on well-being, which is a core ideal of traditional utilitarianism and welfare economics. While avoiding the absurd conclusion that O* is better than O1, it does so by admitting a form of normative silence, which itself may seem like an unsatisfactory retreat for practical reason. The challenge becomes managing rational choice under pervasive incomparability rather than solving the spectrum problem within a complete, transitive framework.

  ---

  ## Marking Scheme (30 Marks Total)

  | **Must-Hit Point**                                                                                                | **Marks** | **Common Mistakes/Lazy Answers**                                                                 |
  | :---------------------------------------------------------------------------------------------------------------- | :-------- | :---------------------------------------------------------------------------------------------- |
  | **1. Formal Problem:** Correctly identifies the conflict (O* > ... > O1 vs. O1 > O*) as violating asymmetry/transitivity. **Crucially:** Explains the *logical dependency* – that transitivity & completeness of ≥ *entail* transitivity of >. Must make the logical link explicit. | 0-7       | **0-3:** Only states intransitivity without formal logic. **4-5:** States conflict but weak/missing explanation of ≥'s role. **6-7:** Clear, correct explanation of the entailment (≥ trans+complete → > trans). |
  | **2. Sorites Analysis:** Takes a clear stand (Is/Isn't). **If IS:** Explains *how* it's Sorites-like & consequences (e.g., need for precisification, betterness vagueness). **If ISN'T:** Identifies the *key difference* (discrete vs. vague adjacent judgments, normative force vs. semantic indecision) and explains *why* it matters (problem is structural/logical, not resolvable by precisification). | 0-6       | **0-2:** Vague hand-waving ("it's like a slippery slope"). **3-4:** Identifies similarity/difference weakly; fails to explain *why* it matters for resolution. **5-6:** Clear stand with robust justification focusing on the *nature* of the adjacent judgment (vague predicate vs. discrete normative claim). |
  | **3. Rejection & Justification:** Chooses *one specific* element (Trans(>), Trans(≥), Completeness(≥), Def. Equal Good). **Justifies *how* rejecting *this specific element* resolves the chain conflict.** Explains the *most significant theoretical/practical cost* of this rejection. | 0-9       | **0-3:** Vague rejection ("maybe intransitivity"); no clear element; no resolution mechanism. **4-6:** Identifies element & cost weakly; justification for resolution is shaky/unclear. **7-9:** Clear choice, robust explanation of *how* it breaks the problematic inference, insightful identification and explanation of the key cost (e.g., Incomparability, Money Pumps, Loss of objective ranking). |
  | **4. Rational Choice Implications:** Analyses implications for acyclic preferences/rational choice based on *their chosen rejection*. **If rejecting Trans(>) or Def. Equal Good:** Addresses potential for cycles/money-pumps & whether it's fatal or manageable. **If rejecting Completeness(≥) or Trans(≥):** Addresses impact on rational choice under incomparability/non-transitivity & whether it's a reductio or livable. Defends the assessment. | 0-6       | **0-2:** Generic statement about choice being hard; no link to their rejection or acyclicity. **3-4:** Identifies general issue (e.g., "incomparability makes choice hard") but weak link to specific rejection and acyclicity. **5-6:** Clear, specific analysis of how *their chosen rejection* impacts rational choice (potential for cycles? challenges of incomparability?) and a defended stance on whether it's a reductio or manageable. |
  | **5. Structure, Clarity & Argumentation:** Logical flow, precise terminology, addresses all parts, avoids summary/reporting, presents a coherent argument.                                                               | 0-2       | **0:** Unstructured, unclear, misses key parts. **1:** Adequate structure, some clarity issues, minor omissions. **2:** Excellent structure, very clear, concise, covers all requirements seamlessly, strong argumentative flow. |

  **Separating First Class (70+%) from Upper Second (60-69%):**
  *   **First Class:** Demonstrates deep understanding by seamlessly integrating all parts. The formal explanation (Point 1) is precise and used as the foundation. The Sorites analysis (Point 2) is incisive and directly informs the rejection choice. The chosen rejection (Point 3) is justified *specifically in terms of breaking the chain's logic*, and the cost is insightfully developed and directly linked to the Rational Choice implications (Point 4). The argument is original, coherent, and anticipates potential counterarguments implicitly. Prose is exceptionally clear and concise.
  *   **Upper Second:** Hits all the points competently but lacks full integration or depth. Formal explanation is correct but perhaps slightly mechanical. Sorites distinction is made but not exploited fully in the rejection choice. Rejection is justified and cost identified, but the connection to *resolving the specific chain* might be slightly underdeveloped. Rational choice implications are addressed but the defence might be somewhat generic or less nuanced. Overall clear and competent but lacks the insightful synthesis and argumentative force of a first-class answer. Might have minor omissions or less precise language.
