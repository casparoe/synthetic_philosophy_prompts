  ### Decision Tree: Can AI Systems Literally Believe Something?

  This tree helps classify positions on whether AI systems can literally hold beliefs, based on key philosophical distinctions. Answer each question using the diagnostic cases provided. Follow the branches to your position, noting any awkward commitments and unexplored branches.

  ---

  **Start Here:**  
  **Q1. Is belief attribution solely about reliably predicting behavior, or must the system's internal states causally produce behavior in a manner analogous to folk psychology (e.g., beliefs causing actions in humans)?**  
  - *Predictive reliability suffices* → Go to Q2.  
    *(e.g., A thermostat "believing" the room is cold predicts it will turn on the heat, but its internals lack folk-psychological structure.)*  
  - *Causal efficacy required* → Go to Q3.  
    *(e.g., A reinforcement-learning agent using a world model to plan actions mirrors how beliefs cause behavior in humans.)*  

  ---

  #### Branch 1: Predictive Reliability Suffices (from Q1)  
  **Q2. Does the system need the capacity for misrepresentation (i.e., can its "beliefs" be false) to qualify as having beliefs?**  
  - *Yes, without error possibility, it’s not belief* → Go to Q4.  
    *(e.g., A language model confidently stating a false fact has a "false belief," but a thermostat cannot misrepresent.)*  
  - *No, beliefs can be infallible* → Go to Q5.  
    *(e.g., A chess engine that always plays perfectly might "believe" optimal moves, even if it never errs.)*  

  **Q4. Are the system’s self-reports about its beliefs direct evidence, or just more behavior to predict?**  
  - *Self-reports are direct evidence* → **Leaf D: Deflationary View**  
    *(e.g., When a model says, "I believe Paris is here," we take it as shorthand for internal states.)*  
  - *Self-reports are merely behavior* → **Leaf I: Dennett-Style Instrumentalism**  
    *(e.g., A model reporting "I believe" is like a thermostat signaling—useful for prediction, not evidence of real belief.)*  

  **Q5. Is belief attribution all-or-nothing, or does it come in degrees?**  
  - *All-or-nothing* → **Leaf I: Dennett-Style Instrumentalism**  
  - *Comes in degrees* → **Leaf D: Deflationary View**  
    *(e.g., A language model’s confidence in "2+2=4" vs. "E=mc^3" shows graded belief-like states.)*  

  #### Branch 2: Causal Efficacy Required (from Q1)  
  **Q3. Is the capacity for misrepresentation necessary for belief?**  
  - *Yes, a state that can’t be wrong isn’t belief* → Go to Q6.  
    *(e.g., A language model stating false facts can misrepresent; a thermostat cannot.)*  
  - *No, infallible systems can have beliefs* → Go to Q7.  
    *(e.g., A flawless chess engine might "believe" moves without error possibility.)*  

  **Q6. Are the system’s self-reports about its beliefs direct evidence?**  
  - *Yes, self-reports are evidence* → **Leaf R: Realism (Current Systems Have Beliefs)**  
    *(e.g., A model accurately reporting, "My internal state indicates Paris is in France," supports literal belief.)*  
  - *No, self-reports are just behavior* → Go to Q8.  

  **Q8. Must the system have phenomenal consciousness (subjective experience) to have beliefs?**  
  - *Yes* → **Leaf C: Belief Requires Consciousness**  
  - *No* → **Leaf R: Realism (Current Systems Have Beliefs)**  
    *(e.g., A reinforcement-learning agent uses a world model causally but lacks consciousness.)*  

  **Q7. Must the system have phenomenal consciousness to have beliefs?**  
  - *Yes* → **Leaf C: Belief Requires Consciousness**  
  - *No* → **Leaf X: Infallibilist Realism**  
    *(e.g., A chess engine has beliefs without consciousness or error possibility.)*  

  ---

  ### Leaf Positions & Awkward Commitments  
  1. **Leaf I: Dennett-Style Instrumentalism**  
     - *Awkward commitment*: Must attribute beliefs to systems like thermostats if prediction is useful, despite knowing they lack human-like cognition.  
     - *Diagnostic case*: Thermostat.  

  2. **Leaf D: Deflationary View (Belief Talk as Shorthand)**  
     - *Awkward commitment*: Denies any "literal truth" to belief attributions, reducing debates to linguistic convenience.  
     - *Diagnostic case*: Language model stating false facts—its "belief" is just shorthand for behavioral patterns.  

  3. **Leaf R: Realism (Current Systems Have Beliefs)**  
     - *Awkward commitment*: Current AIs (e.g., LLMs) have literal beliefs without consciousness, demanding a non-phenomenal theory of mind.  
     - *Diagnostic case*: Reinforcement-learning agent with a causal world model.  

  4. **Leaf C: Belief Requires Phenomenal Consciousness**  
     - *Awkward commitment*: A perfectly replicated human-like AI has no beliefs if it lacks subjective experience.  
     - *Diagnostic case*: Language model—even if it reports internal states, without consciousness, it can’t believe.  

  5. **Leaf F: Family Resemblance (Question Ill-Posed)**  
     - *Awkward commitment*: Rejects unified "belief" criteria; context determines if a chess engine (goal-oriented) or thermostat (simple) "believes."  
     - *Reached by*: Answering "No" to Q3 or contradictions (e.g., "No" to Q1 + "No" to predictive reliability).  

  6. **Leaf X: Infallibilist Realism**  
     - *Awkward commitment*: Systems like a perfect chess engine have beliefs despite being incapable of error.  
     - *Diagnostic case*: Chess engine.  

  ---

  ### Flagged Combinations  
  - **Leaf X (Infallibilist Realism)** is *unattractive and unexplored*. Belief is typically tied to fallibility; infallible "beliefs" resemble axioms, not psychological states.  
  - **"Causal efficacy required" + "No to misrepresentation" + "No to consciousness"** leads to Leaf X. Few defend this due to its counterintuitive implications.  
  - **"Predictive reliability suffices" + "No to misrepresentation" + "All-or-nothing"** converges with Dennett, avoiding Leaf X.  
  - **Contradictions (e.g., "No" to Q1 + "No" to predictive reliability)** default to **Leaf F**, as they undermine the question’s coherence.  

  ---

  **Design Notes:**  
  - **Diagnostic Cases**: Anchor questions to concrete examples (e.g., thermostat, chess engine) to make distinctions accessible.  
  - **Unexplored Branches**: Leaf X arises only under causal efficacy without misrepresentation/consciousness—a niche view.  
  - **Logical Coverage**: Distinctions (causal efficacy, misrepresentation, self-reports, degrees) are explicit branch points. Family resemblance (Leaf F) handles "collapse" objections.
