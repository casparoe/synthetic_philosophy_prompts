  The self-referential standard is crucial: evaluating projects that change how we evaluate. Example: funding decision theory research that might bound utility functions. The framework must endorse its own potential obsolescence.

  Key touchstones: 
  - Lexical tiers where "transfinite" > "cosmic" > "planetary" 
  - A materiality rule dismissing impacts below 10^-100 probability
  - Infinite totals handled via "density measures" (knowingly inadequate)
  - Dissent note advocating bounded utility, presented as procedural objection

