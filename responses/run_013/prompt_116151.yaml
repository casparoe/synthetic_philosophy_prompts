answer: |-
  ## Generally Accepted Expected Value Principles (GAEVP)  
  *Framework Version 7.3, Adopted by the Global Priorities Standards Board (GPSB)*  

  **Standard 1: Unit of Account (The Utile)**  
  1.1 The fundamental unit of value assessment shall be the **Utile (U)**, defined as the expected value differential conferred by the realization of one standard human life-year lived in conditions of positive welfare, absent counterfactual complexities.  
  1.2 All project impacts—including but not limited to lives saved, diseases averted, welfare enhancements, existential risk mitigation, and potential for generating future value-bearing entities—shall be converted into Utiles using approved actuarial tables and cosmological scaling factors (Annex C).  
  1.3 **Example:** Preventing malaria in a region with 1 million at-risk individuals, averting 10,000 DALYs, converts to 10,000 U. A project reducing existential risk by 0.0001% (absolute), where the expected future population is 10^20 human-equivalent beings over cosmic time, converts to 10^16 U.  
  *Notes:* Utile conversion for non-human sentience, digital minds, or hypothetical superintelligences requires Tier-4 Approval (Std. 3). Disputes over sentience thresholds are resolved by the Ontological Review Panel (ORP-7 Protocol).

  **Standard 2: Materiality Threshold (Negligibility Exclusion)**  
  2.1 Any project or project component whose expected value falls below **0.1 U** shall be deemed immaterial and excluded from primary assessment.  
  2.2 Probabilities below 10^-100 are presumptively negligible and rounded to zero for materiality calculations unless supported by a validated physical model (Std. 5) or demonstrable logical necessity.  
  2.3 **Example:** A project costing $1,000 with a 10^-50 probability of creating a utopia worth 10^60 U has an expected value of 10^10 U, exceeding materiality. A project with a 10^-105 probability of the same outcome (EV = 10^-45 U) is immaterial.  
  *Notes:* Board Member Voltaire dissents, arguing that 10^-100 is arbitrary and risks discarding truly dominant options ("The universe is large; 10^-100 is practically inevitable somewhere"). The threshold balances computational feasibility against theoretical purity.

  **Standard 3: Value Tiers and Lexical Priority**  
  3.1 Value-bearing states are categorized into tiers based on qualitative properties. Any finite probability of realizing a higher-tier state lexically dominates any certain realization of a lower-tier state, regardless of magnitude.  
      - **Tier 1 (Planetary):** Human and terrestrial sentient welfare improvements.  
      - **Tier 2 (Cosmic):** Welfare of post-human entities, large-scale astro-biological sentience.  
      - **Tier 3 (Transfinite):** Realization of logically possible states of unbounded positive value (e.g., deity-like superintelligence, infinite bliss planes).  
  3.2 Trade-offs *within* a tier are continuous; trade-offs *across* tiers are lexical.  
  3.3 **Example:** A 10^-20 chance of creating a Tier 3 state (value ∞ U) lexically dominates saving 10^100 Tier 1 lives (value 10^100 U). A project increasing the probability of a Tier 2 state by 0.001% outweighs any cost in Tier 1 resources.  
  *Notes:* Objections regarding the arbitrariness of tier boundaries or the discontinuity of value are noted but overruled; lexical priority is deemed inherent to unbounded value functions. Disputes over tier classification require Metaphysical Arbitration (Procedure MA-4).

  **Standard 4: Speculative Scenarios (Probability Anchoring)**  
  4.1 Probabilities for outcomes lacking empirical frequency data (e.g., novel existential risks, acausal trade) must be estimated via:  
      (a) **Model Consistency:** Coherence with accepted physical/causal models.  
      (b) **Logical Possibility:** Non-zero if logically consistent, discounted by complexity penalties (Std. 4.2).  
      (c) **Simulation Calibration:** Where feasible, using ensembles of idealized agents.  
  4.2 Complexity penalties reduce probabilities by a factor of 10^-k for scenarios requiring k bits of unspecified low-entropy information.  
  4.3 **Example:** A claim that donating $10 enables acausal trade with a Boltzmann brain offering 10^40 U requires specifying its decision algorithm (50 bits? → penalty 10^-50). EV = ($10 cost) vs. 10^40 * 10^-50 = 10^-10 U. Immaterial unless complexity < 10 bits.  
  *Notes:** Board Member Pascal argues penalties unjustifiably suppress high-impact outliers. Standard upheld 5-4, citing epistemic hygiene.

  **Standard 5: Self-Referential Projects (Decision-Theoretic Hazard)**  
  5.1 Projects that alter the probability or methodology of future value assessment (e.g., funding decision theory research, promoting bounded utilitarianism) must be evaluated twice:  
      (a) Under current GAEVP principles.  
      (b) Under the principles most likely *resulting* from the project’s success.  
  5.2 The higher expected value from (a) or (b) governs, as mandated by reflexive consistency.  
  5.3 **Example:** Project A funds research likely to prove utility must be bounded (EV under (b): 0 U for all fanatical interventions). Project A’s EV under (a): High if it enables better fanaticism. Compare EVs.  
  *Notes:** This standard may concede dominance to projects undermining GAEVP itself (§5.2). The Board acknowledges this as "procedurally necessary meta-optimization."

  **Standard 6: Infinite and Undefined Totals (Cardinal Comparators)**  
  6.1 For outcomes involving infinite expected utility, rank via:  
      (a) **Probability Density:** Higher probability of achieving *some* infinite value state dominates.  
      (b) **Value Density:** If infinities are of equal "type" (e.g., countable sentient beings), prefer outcomes with greater utility-per-spacetime-volume.  
      (c) **Pareto Dominance:** If one outcome has higher utility at every comparable point.  
  6.2 Outcomes with undefined expected value (e.g., infinite variance) are ranked below any with defined positive EV.  
  6.3 **Example:** World A: 100% chance of infinite beings with average utility 1 U/volume. World B: 50% chance of beings with 2 U/volume, else extinction. B > A by value density.  
  *Notes:** Comparators are acknowledged as incomplete (e.g., fail for entangled infinite sets). Board Member Cantor’s motion to adopt surreal-number valuations failed 7-2 for "operational opacity."

  **Standard 7: Aggregation and Fanatical Commitment**  
  7.1 Expected value calculations must incorporate:  
      (a) **Temporal Horizon:** All future light cones until heat death or equivalent boundary.  
      (b) **Spatial Scope:** Observable universe plus expected inflationary volumes (Factor Ω ≈ 10^10^12).  
      (c) **Logical Scope:** All logically possible value-bearing substrates (discounted by Std. 4 complexity).  
  7.2 Resources must be allocated to maximize expected Utiles, irrespective of intuitive priority, scale, or certainty of proximate harms, subject to materiality (Std. 2).  
  7.3 **Example:** A 0.0001% chance of preventing a meta-universal catastrophe affecting Ω * 10^50 beings >> Certain prevention of global nuclear war (10^10 U).  
  *Notes:** This standard embodies core fanaticism. Dissent (Board Member Bentham-II): "Bounded utility resolves paradoxes without materially altering *most* real decisions." Rebuttal: "Bounded utility is an arbitrary truncation of reason. True maximization requires embracing the infinite."  

  ---
  **APPENDIX: Meta-Evaluative Note (Per Std. 5.2)**  
  *The GPSB recognizes that consistent application of GAEVP may assign higher expected value to projects which, if successful, would demonstrate the incoherence or impracticality of GAEVP itself (e.g., proving utility bounding theorems). Under reflexive consistency (Std. 5), such projects must be prioritized. Consequently, the long-run expected utility of maintaining GAEVP as the authoritative framework is undefined or negative relative to alternatives. The Board continues operations pending resolution of this meta-uncertainty.*
