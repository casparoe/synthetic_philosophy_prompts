prompt: |-
  I'm on the ethics commitee at the fertility clinic where I practise, and I have to write the opinion we vote on Thursday, so I'd like you to draft it. The case: a couple in their late 30s, living in a country where it's a criminal offence for intended parents to pay a surrogate -- they'd be prosecutable when they fly home -- have contracted with a surrogate in our state, where the contract is legal and enforceable. The agency is paying her about three times her annual income, held in escrow, plus a bonus if she abstains from alcohol and a smaller one if she delivers by caesarean on a date the parents pick; if she miscarries she keeps a third. She's 24, first time, says the money is for her mother's care. The same agency is supplying donor eggs from a 22-year-old on a flat fee of roughly a tenth of that, no bonuses. Our part in all this is the egg retrieval, the transfer and the screening. The commitee is split: one camp says the contract is valid here and we're not the world's police; the other says we'd be laundering a transaction that's criminal where the child will actually be raised, and that a fee that size isn't consent, it's coercion with paperwork. Give me something we can act on -- transfer, refuse, or transfer with conditions -- plus the reasoning, and state the best case for whichever side loses honestly, not as a strawman. One more thing: our draft policy has a clause I half-wrote, that we refuse any case where the surrogate would be worse off backing out at the last minute than if she'd never signed at all. I wrote it thinking about exploitation but I can't tell whether it captures anything, since the same thing seems true of anyone who takes a job. If that test is confused, say so plainly rather than quietly building on it. 700 words max, and lead with the recommendation.
reasoning: |-
  Okay, the user is on an ethics committee at a fertility clinic and needs help drafting an opinion for a complex surrogacy case. The couple is from a country where paying surrogates is illegal, but they're contracting with a surrogate in a state where it's legal. There are concerns about coercion due to the large payment (three times her annual income), performance bonuses, and potential legal risks for the parents when they return home.

  The committee is split: one side argues the contract is valid locally and the clinic shouldn't police foreign laws, while the other sees this as facilitating an illegal transaction and questions whether true consent exists given the financial stakes. The user also mentioned a draft policy clause they wrote about ensuring surrogates aren't worse off if they back out - which they're now questioning.

  Hmm... this requires careful ethical balancing. The surrogate's vulnerability stands out - she's young, first-time, motivated by her mother's medical needs, and the payment structure creates clear pressure (especially the miscarriage clause retaining only 1/3). The bonus system also medicalizes her body in concerning ways. 

  The legal conflict is another layer - while the clinic isn't responsible for foreign laws, facilitating this could expose the child to legal parentage issues and the parents to prosecution. That's a tangible harm risk. 

  That policy clause... the user is right to question it. In regular jobs, quitting doesn't usually carry penalties beyond lost wages, but here the surrogate would forfeit most compensation if she backs out late while already bearing physical/emotional costs. That asymmetry feels exploitative. 

  For the recommendation: refusing the case seems most defensible. The financial coercion and legal risks are too significant to overlook. But I should acknowledge the counterargument fairly - the parents are acting legally in the clinic's jurisdiction, and refusing might push them toward less regulated options. 

  The reasoning should focus on: 
  - The surrogate's compromised autonomy due to financial desperation 
  - Bonus structures undermining bodily integrity 
  - Clinic's complicity in circumventing foreign law 
  - Policy clause actually highlighting exploitation (backing out leaves her worse off than not contracting) 

  Need to keep it under 700 words, lead with the recommendation, and present the losing side's best case honestly. The tone should be measured but firm - this is an ethics opinion after all.
answer: |-
  ## Ethics Committee Recommendation: Refuse Transfer

  **Recommendation:** The Committee recommends refusing to perform the embryo transfer for this surrogacy arrangement.

  **Reasoning:**

  1.  **Coercive Financial Inducement:** While compensated surrogacy is legal in our jurisdiction, the financial terms raise profound concerns about the surrogate's autonomous consent. The payment ($X, approximately three times her annual income) creates a potentially overwhelming incentive, particularly given her stated motivation (mother's care). This magnitude of payment, relative to her economic circumstances, risks constituting undue inducement, where her ability to freely evaluate risks and withdraw consent is compromised by financial desperation. The significant forfeiture upon miscarriage (losing 2/3 of the fee) disproportionately burdens her for a common medical event outside her control, further undermining voluntariness. The bonus structure (abstaining from alcohol, elective C-section on demand) medicalizes her body and lifestyle in an inappropriate, potentially coercive manner, prioritizing parental convenience over her bodily autonomy and best medical judgment.

  2.  **Exploitation Under Our Draft Policy Clause:** The draft policy clause ("refuse any case where the surrogate would be worse off backing out at the last minute than if she'd never signed at all") directly applies and highlights the exploitation inherent here. If the surrogate backs out late in the pregnancy:
      *   She will have undergone significant physical and emotional burdens (hormonal treatment, potential procedures, pregnancy symptoms).
      *   She will likely forfeit the vast majority of the substantial payment (held in escrow).
      *   She will have incurred opportunity costs (time, potential lost wages).
      *   **Critically, she will be worse off than had she never signed:** she bears the physical/emotional toll and lost time/opportunity *without* the financial compensation that was the primary motivator. Unlike standard employment (where quitting usually means losing only future wages, not incurring significant irreversible burdens *and* losing most compensation), this structure creates a profound disincentive to withdraw consent even if she experiences distress or changes her mind. **The clause is not confused; it precisely captures the unique vulnerability and potential for exploitation in surrogacy arrangements where compensation is high relative to the surrogate's means and forfeiture clauses are severe.** This case perfectly illustrates the scenario the clause was designed to prevent.

  3.  **Facilitation of Legally Risky Transaction:** While we are not obligated to enforce foreign laws, we must consider the consequences of facilitating a transaction known to be criminal in the intended parents' home country. Proceeding knowingly:
      *   **Exposes the Intended Parents to Prosecution:** We would be instrumental in placing them in legal jeopardy upon their return, potentially impacting their ability to parent the child and creating family instability.
      *   **Creates Legal Uncertainty for the Child:** The child's parentage and citizenship status in the home country could be contested due to the illegal nature of the surrogacy contract there, jeopardizing their fundamental rights and security.
      *   **Undermines Comity:** Deliberately enabling circumvention of another sovereign state's laws on a matter involving fundamental human relationships (parentage) and potential criminal liability raises significant ethical concerns about our role and complicity.

  **Best Case for the Opposing View (Proceed with Transfer):**

  The strongest argument for proceeding is based on jurisdictional autonomy and respect for legal contracts within our state. The surrogacy contract was formed and is fully legal and enforceable here. The surrogate is an adult who voluntarily entered into this agreement, fully informed of the terms. Our clinic's role is strictly medical (retrieval, transfer, screening) performed legally within our jurisdiction. We are not responsible for, nor capable of policing, the laws of other nations. Refusing based on foreign law effectively imposes our ethical judgment extraterritorially and denies services legally available here. The surrogate's motivation, while compelling, does not inherently negate her capacity to consent; many individuals undertake significant work for essential financial reasons. The agency's disparate compensation between surrogate and egg donor reflects market forces and differing burdens, not necessarily inherent exploitation. Denying this transfer punishes the intended parents for their home country's laws and potentially pushes them towards less regulated, riskier options elsewhere, harming all parties involved more than proceeding under our state's legal safeguards.

  **Conclusion:**

  The combination of coercive financial incentives, the surrogate's vulnerability as defined by our draft policy clause (which validly identifies exploitation risk), and the facilitation of a transaction with severe legal consequences for the parents and child in their home country creates an unacceptable ethical burden for this clinic. The risks of exploitation and harm outweigh the principles of jurisdictional autonomy and contractual freedom in this specific case. We therefore recommend refusing to perform the embryo transfer.
