prompt: |-
  Right, so my mate Dev is a staff engineer where I work and she's got this habit: she'll hear that some team hit a number and go "nah, that's a goodhart", like it's a verb. She says it's named after some economist. Anyway I'm doing a talk at our internal eng conference about metrics that go wrong, and I want to get her rule right before I put it on a slide.

  Her track record, as best I can reconstruct it:

  - Support desk got told to cut average handle time. Agents started hanging up on the tricky calls. Dev: goodharting.
  - A ranking model we trained on click-through started serving clickbait, and long-term engagement dropped. Nobody decided to do that, it just fell out of the training loop. Dev: goodharting.
  - The council near her mum's got its recycling rate up by counting stuff that gets shipped abroad and burned as "recycled". Dev: goodharting.
  - A hospital trust hit its A&E four-hour target by keeping patients in ambulances so the clock never starts. Dev: goodharting.
  - Our team's story points stayed flat while we actually shipped more. Dev: not goodharting — "nobody was ever steering by the points, and they weren't measuring anything real in the first place."
  - We redefined sev-1 to match the industry standard, the count dropped, and nobody's pager got any quieter. Dev: not goodharting — "that's just moving the ruler, no one was being paid to bring that number down."
  - A dashboard everyone agrees is useless and nobody ever looks at. Dev: not goodharting — "a metric nobody optimises is just decoration."

  Now the new one. Our growth team has a target of +25% weekly active users. Everyone, including Dev, has been saying for ages that WAU is a rubbish measure of whether people actually like the product — our users churn within a week no matter what. But the growth lot have been pushing lock-screen nudges and semi-fake "someone replied to you" alerts, and WAU is up 25%. Dev's on holiday and I've got to write the slide.

  What's she going to say? And more usefully: what rule is she actually running? I can see at least two rules that fit everything above, and I think they part company on this one. Tell me what each of them predicts here, which one you'd bet on and why, and give me one more case — something I could actually put in the talk — that would settle which rule she's got. If there's a third rule that fits her track record just as well, say so, and say what it does with the growth team. Also, is there an obvious rule someone would guess she's running that her past verdicts already rule out? I'd like to know so I don't say it on stage.

  Write it in British English please, and don't bother with citations or further reading, I'm definately not going to check them.
reasoning: |-
  Hmm, the user is preparing a talk about metrics gone wrong and needs to understand Dev's "goodharting" concept. Dev uses this term in specific situations where metrics backfire, but not in others. The user has provided several examples of what Dev considers goodharting versus not, and now wants to predict how Dev would classify a new scenario involving the growth team's WAU target.

  Looking at Dev's patterns:
  - Goodharting cases involve active manipulation: support agents hanging up, algorithms gaming click-through, councils misclassifying waste, hospitals parking ambulances. The common thread seems to be that people (or systems) distorted behavior to hit a target that became disconnected from the intended outcome.
  - Non-goodharting cases lack this active distortion: story points weren't used for steering, severity definitions changed without incentives, useless dashboards weren't optimized.

  For the growth team scenario: They're hitting a WAU target through lock-screen nudges and fake alerts, despite knowing WAU doesn't reflect real engagement. This fits the manipulation pattern - they're gaming the metric rather than improving actual product value. So Dev would likely call this goodharting.

  The user mentions two possible rules that fit Dev's past verdicts. Rule A (incentive-driven distortion) focuses on people changing behavior due to incentives attached to the metric. Rule B (emergent distortion) is broader, including cases where systems unintentionally optimize for bad outcomes. The click-through rate example (where no one decided to game it) is key here - it suggests Dev uses Rule B.

  A test case to distinguish them: Imagine a team accidentally improves a metric by doing genuinely good work, but purely by luck - no gaming involved. Rule A would say "not goodharting" (no bad intent), while Rule B would say "goodharting" (metric still became unreliable). Since Dev cares about outcomes over intent, she'd likely choose Rule B.

  An obviously wrong rule would be "anytime a metric fails" - Dev explicitly rejects this when metrics are ignored or redefined without gaming.

  For the user's talk, I'll emphasize: Goodharting occurs when optimizing a metric corrupts it as a measure of success, regardless of intent. The growth team case is classic - they hit the number by means that undermine what the metric should represent.
answer: |-
  Right, your mate Dev is clearly running on a specific, practical interpretation of Goodhart's Law. Based on her track record, here's the breakdown for the growth team scenario, the rule she's likely using, the alternative rule, a test case, and the obvious red herring:

  1.  **The Growth Team Scenario (WAU +25% via dodgy alerts):**
      *   **What Dev Will Say:** "Goodharting." Definitely.
      *   **Why:** The team knew WAU was a poor proxy for real value ("rubbish measure", users churn fast), but they actively *optimised* for it using tactics (lock-screen nudges, fake alerts) that explicitly *game* the metric without improving (and likely harming) the underlying desired outcome (genuine user engagement/retention/value). They distorted their behaviour to make the number look good, decoupling it from reality.

  2.  **Dev's Actual Rule (Rule B - The Winner):**
      *   **The Rule:** **"Goodharting occurs when optimising for a metric actively causes it to become a worse measure of the underlying goal it was *intended* to represent, due to the behavioural distortion induced by that optimisation."**
      *   **Fits All Cases:**
          *   *Support Desk:* Optimising AHT distorted behaviour (hanging up), made AHT a worse measure of support quality.
          *   *Ranking Model:* Optimising CTR distorted the model (serving clickbait), made CTR a worse measure of long-term engagement/value.
          *   *Council Recycling:* Optimising recycling rate distorted behaviour (shipping/burning), made the rate a worse measure of actual environmental benefit.
          *   *A&E Target:* Optimising 4-hour target distorted behaviour (ambulance holds), made the target a worse measure of timely patient care.
          *   *Growth Team (WAU):* Optimising WAU distorted behaviour (dodgy alerts), making WAU a worse measure of genuine user engagement/value.
          *   *Story Points:* **Not Goodharting** - Metric wasn't optimised *or* intended to measure anything real. No distortion.
          *   *Sev-1 Redefinition:* **Not Goodharting** - Metric was redefined, but not optimised *against* (no incentive). No behavioural distortion to game it, just clearer labelling. The underlying goal (fixing critical issues) likely wasn't affected by the label change itself.
          *   *Useless Dashboard:* **Not Goodharting** - Metric exists but isn't optimised. No distortion, just noise.
      *   **Core:** Focuses on the *behavioural distortion* and the resulting *decoupling* of the metric from its *intended purpose* caused by the act of *optimising* it.

  3.  **The Alternative Rule (Rule A - Incentive-Driven Distortion):**
      *   **The Rule:** **"Goodharting occurs when explicit incentives (pay, bonuses, targets, performance reviews) attached to a metric cause people to game it, making the metric unreliable."**
      *   **Fits Most, Falters on One:**
          *   *Support Desk, Council, A&E, Growth Team:* All likely had explicit targets/incentives. Fits Rule A.
          *   *Story Points, Sev-1, Useless Dashboard:* No incentives/optimisation, so "Not Goodharting" fits.
          *   *Ranking Model:* **Problem for Rule A.** Dev called this Goodharting, but *nobody decided to do it*. There was no *explicit human incentive* (like a bonus for higher CTR). The gaming emerged purely from the training loop optimising the metric. Rule A might struggle to call this "Goodharting" as it lacks the explicit human incentive element. Dev's verdict ("it just fell out of the training loop") suggests her rule encompasses this emergent distortion without needing a human manager setting a target.

  4.  **The Test Case (To Settle It in Your Talk):**
      *   **The Scenario:** The "Accidental Optimisation". Imagine a team is working on genuinely improving product performance (speed, reliability). Unbeknownst to anyone, one of their changes *also* significantly increases the number of automated system health pings sent to a monitoring dashboard. The ops team, seeing this "health ping" metric skyrocket (though it was never a target), reports "System health has massively improved!" based solely on that ping count. Everyone agrees the pings weren't measuring real health, just activity, and no one was *trying* to increase them. The team was just doing good work that accidentally inflated a daft metric.
      *   **Prediction:**
          *   **Rule A (Incentives):** Likely "Not Goodharting." No explicit incentive or target for the ping count existed. No one *gamed* it.
          *   **Rule B (Optimisation Distortion):** Likely **"Not Goodharting."** While the metric became unreliable, the *distortion wasn't caused by optimising the ping metric itself*. The team was optimising performance, not the ping count. The ping count becoming useless was a side-effect, not the result of targeting it.
          *   **Dev's Likely Verdict (Based on Track Record):** **"Not Goodharting."** This matches her "Sev-1 Redefinition" and "Useless Dashboard" logic. The unreliability wasn't *induced* by targeting the metric. She'd probably call it a "daft metric" or "correlated nonsense", but not Goodharting. **This test case confirms she's using Rule B.** If she *did* call it Goodharting, it would point towards a broader third rule.

  5.  **A Possible Third Rule (Fits, but Broader - Rule C):**
      *   **The Rule:** **"Goodharting occurs whenever a metric becomes a poor proxy for the underlying reality, regardless of *why* it became poor (optimisation, drift, poor definition, external changes)."**
      *   **Fits the Track Record (Loosely):** It could *explain* all the "Goodharting" verdicts (metric became poor) and the "Not Goodharting" verdicts (metric was always useless/not used). The Sev-1 redefinition might be tricky – the metric *did* become a worse proxy for pager load *initially* due to the redefinition, but Dev called it "Not Goodharting".
      *   **Growth Team Verdict under Rule C:** **Goodharting.** (WAU became a worse measure).
      *   **Why Rule C is Less Likely:** Dev's specific focus on *behavioural distortion* caused by *optimisation* (hanging up, clickbait, shipping waste, ambulance holds, fake alerts) is strong. Rule C is too broad and passive; it would likely cover the "Accidental Optimisation" test case as Goodharting (ping count became poor) and *might* even cover the Sev-1 change (metric became poor at measuring load initially). Her distinction between changing the ruler (Sev-1) and gaming the system (everything else) points away from Rule C.

  6.  **The Obvious Rule She's Already Ruled Out:**
      *   **The Red Herring Rule:** **"Goodharting is when a metric fails or gives a misleading result."**
      *   **Why it's Ruled Out:** Dev explicitly said "Not Goodharting" for cases where:
          *   The metric was always useless/not measuring anything real (Story Points).
          *   The metric was redefined without gaming (Sev-1).
          *   The metric existed but wasn't used (Useless Dashboard).
      *   Her rule requires the *failure of the metric as a measure* to be *caused by the act of optimising it*. Simple metric failure or irrelevance isn't enough. Saying "Goodharting" just because a metric is bad or wrong will earn you a Dev-style "nah".

  **Summary for Your Slide & Talk:**

  *   **Growth Team Verdict:** Goodharting. They gamed a known-bad metric to hit a target, decoupling it from reality.
  *   **Dev's Rule (Use This One):** **"Optimising a metric distorts behaviour, making that metric a worse measure of the goal it was meant to track."** (Rule B - Optimisation Distortion).
  *   **Test Case for Clarity:** Describe the "Accidental Optimisation" (team improves product, inflates a useless ping count metric accidentally). Emphasise: Not Goodharting, because the distortion wasn't *caused* by targeting the ping metric. It highlights the crucial "optimisation causes the distortion" element.
  *   **Avoid Saying:** "Any bad metric is Goodharting" (Red Herring Rule - she ruled this out with Story Points/Sev-1/Dashboard).

  Blame it on economist Charles Goodhart, crack on with the talk, and maybe lay off the lock-screen nudges. Good luck!
