prompt: |-
  Long arguement with a friend last night about who's allowed to leave who, and I want a straight answer, not a tour of the literature.

  His line: a region only gets to leave if the country agrees. Madrid says no, so Catalonia's out of luck; Westminster said yes in 2014, so Scotland was fine. I'm pretty sure that's not the whole story, but every time I try to say why, I end up somewhere I don't like.

  My gut, case by case:

  - Scotland 2014: legitimate, obviously. Both governments agreed to the vote, one clear question, 55-45, everyone accepted the result. If it had gone the other way I'd have said the rest of the UK had to negotiate.
  - Catalonia 2017: not legitimate. The court said no, the unionist parties told their voters to stay home, turnout was around 40%, and they declared independence off the back of it anyway. Even though I think Catalans should get a vote.
  - Quebec 1995: legitimate as a vote, but if it had squeaked through 50.5 to 49.5 on a question that was really sovereignty plus an offer of partnership with the rest of Canada that hadn't been negotiated, I think Ottawa could legitimately have said that wasn't clear enough to act on.
  - Kosovo 2008: legitimate, unilateral, no permission from Belgrade. Because of what happened in the 90s.
  - Bougainville: PNG signed up to holding the vote, 98% said yes, and years later Port Moresby still hasn't acted on it. That feels like a wrong. But nobody there was being crushed, so my "you can only go it alone if you're being crushed" instinct doesn't touch it.
  - New Caledonia: three votes, all no, but the last one was boycotted by the independence side and Paris now talks as if the file is closed forever. That feels wrong too, and again there's no oppression in the picture.
  - Orkney and Shetland voted heavily against Scottish independence. If Scotland had left, I think they'd have had a decent claim to go with the UK instead. But then the No-voting chunks of Catalonia get a claim to leave Catalonia, which I hate.
  - Taiwan: genuinely don't know.

  So is there one principle that gets all of these? The nearest I can state is: unilateral exit only as a remedy for serious injustice, otherwise you need the state's consent. But that leaves Bougainville and New Caledonia unexplained, and it makes my Orkney instinct nonsense. The other candidate, any group that thinks of itself as a nation can vote whenever it likes, gets Orkney right and turns everything else to mush.

  And I can't get past the question of who's actually voting. My friend says the region, obviously. That's obviously right for Scotland and feels like theft somewhere else, and I can't say where. Also: are we talking about one question or two seperate ones, the moral right and the legal one?

  Pick a side. Give me the principle you'd actually defend, as many clauses as it takes, run it through my cases, tell me which of my verdicts has to go, and say what it predicts for a region that wants out of a region that just got out, and for a nation defined by language and scattered across three countries rather than by any territory. Committed answer please, no fence-sitting.
reasoning: |-
  Okay, let me try to unravel this user's query. They had a heated argument with a friend about when a region can legitimately secede. The friend's stance is simple: secession requires the country's consent. The user disagrees but struggles to articulate a consistent principle. They provided multiple case studies and their gut reactions to each, showing internal conflict.

  First, I need to identify the core issue. The user wants a clear, defensible principle that covers all cases without contradictions. Their examples highlight tensions between legality, morality, and practicality. They mention legitimacy in Scotland (agreed referendum) versus Kosovo (unilateral due to oppression), but Bougainville and New Caledonia don't fit neatly into either category. 

  The user's discomfort with Catalonia's 2017 vote is key. They feel it was illegitimate due to lack of legal approval and low turnout, but still believe Catalans deserve a vote. This suggests a distinction between procedural legitimacy and moral right. Also, their Orkney example introduces sub-regions' rights, complicating the "nation" definition.

  I recall legal doctrines: remedial secession for grave injustices versus primary right theory (any nation can choose). Neither fully satisfies the user. Remedial fits Kosovo but not Bougainville; primary right justifies Orkney but risks chaos in places like Catalonia. 

  Then there's the question of who votes. The user's friend says "the region," but the user senses this could be "theft" in some contexts—likely where regional identity isn't monolithic (e.g., parts of Catalonia wanting to stay with Spain). This ties into the "two questions" problem: moral right versus legal permission.

  The user's Taiwan mention adds geopolitical layers—historical sovereignty versus de facto independence. Any principle must handle such ambiguities without relying on oppression narratives.

  My proposed framework needs to reconcile these. Prioritizing negotiated consent as default, with unilateral action only under specific criteria (persistent rights denial, no democratic recourse), covers most cases. Bougainville becomes a "grey zone" where consent was given but not honored—warranting international pressure, not unilateralism. New Caledonia's boycott issue requires revisiting if circumstances change. 

  For sub-regions like Orkney, their claim depends on the parent region's legitimacy: if Scotland left lawfully, Orkney stays; if unlawfully, Orkney could negotiate with the rump state. This avoids infinite fracturing. 

  The voter question: must be a defined territory with pre-existing governance, ensuring practical viability. Taiwan fits as a de facto state with democratic legitimacy, despite historical disputes. 

  Testing against cases: Quebec's narrow win would need clarity via negotiations; Catalonia 2017 fails due to procedural flaws; Bougainville's stalled implementation is unjust but not unilateral justification. User's Kosovo verdict stands, Orkney adjusted, Taiwan recognized as valid. 

  This approach accepts messy compromises but offers actionable thresholds. It rejects absolute sovereignty (friend's view) and pure self-determination, instead balancing consent, justice, and feasibility.
answer: |-
  Here's a straight, committed answer based on a defensible principle, tested against your cases, and identifying where your verdicts need adjustment:

  **The Principle:**

  1.  **Default Rule: Negotiated Consent.** Legitimate secession requires agreement between the regional population seeking independence and the central state, achieved through a mutually agreed, legally sound process (e.g., referendum, treaty). This is the preferred, stable, and legal path.
  2.  **Exception: Remedial Secession.** Unilateral secession is morally and politically legitimate *only* when:
      *   **a) Grave & Persistent Injustice:** The regional population suffers systematic, severe violations of fundamental rights (e.g., genocide, ethnic cleansing, systematic political/cultural suppression) by the central state.
      *   **b) No Democratic Remedy:** All peaceful, democratic avenues within the existing state structure (negotiations, elections, legal challenges) to remedy the injustice have been exhausted or are demonstrably futile.
      *   **c) Clear Democratic Mandate:** The secessionist move is supported by a clear, free, and fair expression of the will of the affected population (e.g., overwhelming majority in a credible referendum or election *after* conditions a & b are met).
      *   **d) Viability:** The new state must be reasonably viable and its creation shouldn't itself create catastrophic new injustices or instability.

  **Running it through your cases:**

  *   **Scotland 2014:** **Legitimate.** Fits **Rule 1 (Negotiated Consent)** perfectly. Both governments agreed, process was legal and fair. *Your verdict stands.*
  *   **Catalonia 2017:** **Not Legitimate.** Fails **Rule 1 (No Consent).** Fails **Exception b (No Democratic Remedy Exhausted)** - legal challenges were ongoing, negotiations hadn't been credibly exhausted. Also fails **c (Clear Mandate)** - process was illegal, boycotted, lacked minimum democratic guarantees. *Your verdict stands.*
  *   **Quebec 1995:** **Legitimate Vote, Uncertain Secession.** Fits **Rule 1** *for holding the vote* (consent existed for the vote itself). However, a narrow win on a complex question would **NOT** have automatically triggered legitimate secession under **Rule 1**. Secession would have required *further negotiation* with Ottawa to clarify terms and achieve final consent. If negotiations failed utterly *despite good faith*, the situation *might* evolve towards the Exception, but wasn't there yet in 1995. *Adjustment: Your "Ottawa could say no" instinct is correct under the principle; secession required further consent/negotiation.*
  *   **Kosovo 2008:** **Legitimate Unilateral Secession.** Fits the **Exception**: **a)** Grave injustice (genocide, ethnic cleansing, mass expulsion under Milosevic), **b)** No democratic remedy within Serbia (oppression continued, autonomy stripped, negotiations failed post-conflict), **c)** Clear mandate (repeated elections showing overwhelming support post-1999). **d)** Viability/Stability was a major international concern, but deemed necessary. *Your verdict stands.*
  *   **Bougainville:** **Illegitimate Stalling, Not (Yet) Legitimate for Unilateral Action.** PNG's consent via treaty (**Rule 1**) makes the vote legitimate *and* creates a binding obligation to negotiate independence in good faith. PNG's failure is a breach of agreement and morally wrong. However, it doesn't currently meet the high bar of the **Exception (a & b)**. Bougainville isn't suffering *new* severe injustice justifying unilateral action *yet*. The path is **Rule 1** - pressure PNG to honor the agreement. *Adjustment: Your feeling it's a "wrong" is correct, but under the principle, unilateral declaration now wouldn't be legitimate. Continued negotiation/pressure is the path.*
  *   **New Caledonia:** **Process Legitimate, "Closed Forever" Feels Premature.** The votes were held under **Rule 1** (agreed process). The boycott on the 3rd vote weakens the "no" mandate but doesn't invalidate the legal agreement. However, the principle doesn't preclude *future* votes if circumstances change significantly or if a new generation demands it. Paris declaring it "closed forever" is politically unwise and risks *creating* the conditions for future injustice (**a**), potentially opening the door for the **Exception later** if democratic avenues are truly blocked. *Adjustment: Your feeling it's "wrong" is understandable, but the past votes were legitimate. The principle allows for the *possibility* of future legitimate votes if conditions change.*
  *   **Orkney/Shetland (If Scotland Left):** **Dependent on Scotland's Legitimacy.**
      *   *If Scotland left via Rule 1 (Negotiated Consent):* Orkney/Shetland likely bound by that agreement. Their distinct identity might warrant special status within Scotland, but unilateral secession wouldn't meet the **Exception (a & b)** unless Scotland then oppressed them.
      *   *If Scotland left unilaterally without meeting the Exception:* This weakens Scotland's legitimacy. If Orkney/Shetland then faced integration they rejected *and* Scotland denied them a voice/democratic remedy (**b**), their claim for secession (likely seeking to rejoin UK) becomes much stronger under the **Exception**. *Adjustment: Your instinct has merit, but under the principle, the strength of their claim depends crucially on the legitimacy of Scotland's exit and subsequent treatment.*
  *   **Catalonia's Sub-Regions:** If Catalonia seceded illegitimately (like 2017), areas like the Val d'Aran or Tarragona that overwhelmingly wanted to stay in Spain *would* likely meet the **Exception (a & b - subjection to a new, unwanted state without democratic remedy within Catalonia)** for seeking to separate from Catalonia/rejoin Spain. This cascading effect is a major argument *against* illegitimate unilateral secession. *Adjustment: Your "hate" for this outcome is valid, but the principle predicts it as a consequence of Catalonia acting illegitimtely.*
  *   **Taiwan:** **Legitimate De Facto Statehood, Unresolved Final Status.**
      *   **Rule 1 (Negotiated Consent)** is impossible as the ROC (Taiwan) and PRC (China) don't recognize each other as legitimate negotiating partners for Taiwan's status.
      *   **Exception:** **a)** The *current* population of Taiwan does not suffer grave injustice from the PRC (it rules itself). The historical injustice (KMT authoritarianism) wasn't *PRC* oppression. **b)** "Democratic remedy" within a "One China" framework is non-existent/futile for the Taiwanese seeking distinct statehood. **c)** There is a clear, repeated democratic mandate in Taiwan for maintaining the *status quo* of self-governance and rejecting absorption by the PRC.
      *   **Viability:** Taiwan is a highly viable state in all but name.
      *   **Conclusion:** Taiwan meets key aspects of **c & d**. While **a & b** don't fit the classic remedial mold perfectly (due to the *de facto* separation), its *de facto* independence is legitimate based on democratic will, historical separation, and the absence of PRC governance. Attempted PRC annexation *would* trigger **a & b**. Its legitimacy stems from effective, democratic self-governance sustained over decades, not purely from the remedial exception. *Adjustment: It fits the spirit of self-determination underpinning the Exception, even if the strict historical "injustice" criterion is complex.*

  **Predictions:**

  *   **Region wanting out of a newly independent region:** (Like Orkney wanting out of independent Scotland or Val d'Aran out of independent Catalonia)
      *   **Rule 1:** They must seek agreement *with the new independent state*.
      *   **Exception:** Legitimacy for unilateral action depends on whether the *new state* subjects them to grave injustice (**a**) and denies democratic remedy (**b**). Simply wanting to join a different country isn't enough. Oppression by the new state is key.
  *   **Non-Territorial Nation (e.g., Kurds, scattered language group):** Secession requires a defined territory. This principle applies to populations within a specific geographic area seeking political independence for that area. A non-territorial nation could seek autonomy, cultural rights, or potentially independence *if* concentrated within a specific territory claimed as their homeland (e.g., Kurdistan regions). Scattered groups cannot secede to form a single state; their rights are pursued through minority protections, autonomy, or individual migration.

  **Which of your verdicts has to go?**
  *   **Bougainville:** Your feeling it's a "wrong" is correct, but the principle says unilateral action *now* isn't justified. Continued pressure on PNG is required.
  *   **Quebec 1995:** A narrow win on that question would *not* have been sufficient for legitimate secession; further negotiation/consent would have been mandatory.
  *   **Orkney:** Your instinct is partially right, but heavily dependent on *how* Scotland left and how an independent Scotland treated them.
  *   **Taiwan:** It fits, but requires recognizing its legitimacy stems from sustained democratic self-governance and the impossibility of the negotiated path, alongside the implied threat of grave injustice if absorption occurred.

  **The Core:** The principle prioritizes stability and agreement (**Rule 1**), but recognizes that extreme, persistent injustice can break the bonds of sovereignty, making unilateral action a last-resort remedy (**Exception**). It explains Bougainville (agreement exists, implement it!), New Caledonia (process followed, future possible), and avoids the chaos of pure self-determination while providing a rigorous justification for cases like Kosovo. It makes the legitimacy of sub-region secession contingent on the legitimacy of the initial secession and subsequent treatment.
