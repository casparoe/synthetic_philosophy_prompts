prompt: |-
  I work in decision theory and applied microeconomics — Savage acts, Anscombe–Aumann, subjective expected utility, ambiguity aversion in the Gilboa–Schmeidler style, robust control, and the standard pathologies of unbounded utility — and I have no theological training. Please restate Pascal's wager as faithfully as you can in that vocabulary, and then give me a residue report. My hunch, which I want you to test rather than accommodate, is that the wager is best read not as a decision under risk but as one under ambiguity, and that most of the standard objections are symptoms of that misclassification.

  Begin by fixing the formal apparatus: the state space, the act space, the consequence space, and the preference relation, and say which representation theorem you are implicitly invoking. Be explicit about which strand of the passage usually labelled the wager you are translating — the dominance-flavoured strand, the expected-value strand, the strand that turns on the infinite, and the practical advice about inducing belief — because they do not all translate the same way, and I suspect at least one of them is not a decision-theoretic argument at all. Where Pascal treats the choice as forced, so that declining to wager is itself a wager, tell me what that corresponds to formally and whether it is a substantive claim about the act space or an artefact of how the act space was drawn. Where the argument assigns infinite utility, tell me what survives once the utility function is required to be real-valued, and whether the argument can be reconstructed with a sufficiently large finite payoff or genuinely needs the infinite. Where the objection about competing religions offering competing infinite payoffs arises, restate it as a claim about the agent's state space or about ambiguity over which partition is the correct one, and say which formal treatment it demands: a larger state space, a set of priors, a second-order prior, or something else.

  Then the residue report, which is the part I actually want. Which elements map cleanly onto standard machinery? Which require distortion — in particular, does the recommendation to act as though one believed, in order to bring belief about, fit the act-and-consequence framework at all, given that the agent's own psychology is simultaneously the object of choice and a determinant of the payoff? And which elements have no counterpart in this vocabulary whatsoever? For each item in the last category, tell me whether the failure indicts decision theory or instead indicates that Pascal is doing something other than decision theory — for instance, whether the voluntarism about belief that the wager appears to presuppose is an assumption decision theory cannot state, or merely one it has no need to state.

  Lead with your bottom line about how much of the wager survives translation, in the first sentence, and then give the reasoning, with no preamble and no restating of my question. State how confident you are in each part of the translation and in the residue report, and single out the one point you are least sure of.
reasoning: |-
  Hmm, this is a fascinating request from an expert in decision theory and applied microeconomics. They want me to dissect Pascal's Wager using formal decision-theoretic machinery and then identify what gets lost in translation. 

  First, I need to recall Pascal's Wager properly. It's not a single argument but has multiple strands: the dominance reasoning, expected value with infinite payoff, practical advice on belief formation, and the "forced choice" framing. Each will map differently to modern frameworks.

  For the formal setup, I'll need:
  - State space Ω: Should include God's existence/non-existence, but also account for competing theologies. Probably need to make it Ω = {θ₁, θ₂, ..., θₙ} for n religions plus atheism.
  - Act space A: Must include "wager for God" and "wager against," but Pascal treats inaction as equivalent to wagering against. Formally, that means A has only two elements by construction - a substantive modeling choice.
  - Consequence space C: Here's where infinity causes trouble. Need to handle "infinite utility" carefully since real-valued utilities can't capture it. Might need to work with extended reals or use dominance reasoning.
  - Preference relation ≿: This will depend on which representation we invoke. Since they mentioned ambiguity aversion, Gilboa-Schmeidler maxmin expected utility seems relevant for handling uncertainty over the correct religious model.

  Key challenges they flagged:
  1) Is this risk or ambiguity? Their hunch is ambiguity - I agree. The probability of God isn't quantifiable, so we need non-additive beliefs. Objections like "which God?" scream ambiguity aversion.
  2) Infinity problem: Can we salvage the argument with just very large finite payoffs? Probably not - Pascal's logic collapses without strict dominance when utilities are bounded. 
  3) Belief voluntarism: The "fake it till you make it" advice doesn't fit standard acts/consequences. Choosing to self-manipulate psychology blurs the line between acts and states.

  For the residue report, I'll need to separate:
  - Clean mappings: State space partitioning, dominance under certainty
  - Distortions required: Treating unbounded utility via extended reals, forcing the binary act space
  - No counterparts: Belief voluntarism (this exposes a decision theory limitation), theological presuppositions like "only Christianity offers salvation"

  Biggest uncertainty: Whether Pascal's infinity is essential. If we require real-valued utilities, even a 1e100 payoff doesn't replicate the argument because expected values become comparable. But admitting infinitesimals feels cheaty. 

  Least sure point: How strictly to interpret the "forced choice" framing. Formally it's an artifact (we could define three acts), but Pascal presents it as a deep insight about human condition.
answer: |-
  **Bottom line:** Approximately 60% of Pascal’s wager survives formal translation as an ambiguity-averse decision under subjective uncertainty, but critical residues—voluntarism, infinity, and forced choice—expose non-decision-theoretic elements or pathologies of unbounded utility.

  ### Formal Translation
  **Framework:** Anscombe-Aumann acts over a state space Ω, consequences in ℝ (with extensions for infinity), maxmin expected utility (MEU) representation (Gilboa-Schmeidler).

  - **State space Ω:** Partitioned into mutually exclusive states: θ₁ (God exists as per doctrine D), θ₂ (no God), θ₃,...,θₙ (competing theologies with distinct salvific payoffs). Standard objections imply ambiguity over the correct partition.  
  - **Act space A:** A = {a_wager, a_~wager}, where a_wager = "live religiously per D", a_~wager = "live non-religiously". Pascal’s "forced choice" is a *substantive modeling claim*: refusal is mapped to a_~wager by definition, excluding a third act (e.g., "defer choice").  
  - **Consequences C:** Real-valued utility u(c), but Pascal assigns u(eternal salvation) = ∞, u(damnation) = -∞, u(worldly pleasures) = M_finite > 0, u(asceticism) = M_finite - ε < M_finite.  
  - **Preference relation ≿:** Ambiguity-averse MEU preferences (Gilboa-Schmeidler) over acts, with a set of priors Π over Ω.  

  **Strands translated:**  
  1. **Dominance:** If θ₁ is true, a_wager ≻ a_~wager; if θ₂ is true, indifference or minor loss. With infinity, strict dominance holds.  
  2. **Expected value:** Under any additive prior P, E[u|a_wager] = ∞ if P(θ₁) > 0, dominating E[u|a_~wager] < ∞.  
  3. **Infinity:** With real-valued u, ∞ is inadmissible. Salvage requires:  
     - *Dominance-only:* If u(θ₁, a_wager) ≫ u(any θ, a_~wager) and u(θ₁, a_~wager) ≪ 0, MEU may favor a_wager under pessimism.  
     - *Failure:* No finite payoff ensures strict dominance; competing θ₃,...,θₙ force ambiguity.  
  4. **Competing religions:** Ambiguity over partitions. Demands:  
     - Expand Ω to include all θᵢ, but then Π must cover conflicting theologies.  
     - MEU solution: a_wager⁺ = maxmin over Π, but if Π includes θᵢ damning D-adherents, maxmin fails.  
  5. **Inducing belief:** Not an act in AA-framework. Treated as a "meta-act" altering future beliefs/states—outside standard consequence mapping.  

  ### Residue Report  
  **Clean mappings:**  
  - State partitions, dominance under certainty (if θ₁ known).  
  - MEU for ambiguity: Objections about "which God?" reflect non-unique priors; maxmin pessimism favors wagering if D is in the support of Π.  
  - Forced choice as act-space reduction: Formally coherent if uncontested.  

  **Distortions required:**  
  - **Infinity:** Requires extended real-valued utility. With real-valued u, dominance fails; finite salvific utility permits arbitrary E[u] comparisons.  
  - **Ambiguity misclassification:** Objections (e.g., "many gods") confirm it’s not risk—Pascal assumes unknown probabilities. MEU handles this, but...  
  - **Belief induction:** Consequence c depends on psychological state s(a), violating act-state independence. No AA-act models "choose to believe D"; it’s a dynamic self-modification outside static choice.  

  **No counterpart:**  
  1. **Voluntarism of belief:** Decision theory assumes beliefs are priors, not chosen acts. Pascal’s "induce belief" assumes control over own epistemology.  
     - *Indictment?* Decision theory lacks machinery for endogenous belief formation; this is psychology, not rational choice.  
  2. **Infinity as dominance-enforcer:** Real-valued utilities force probabilistic comparisons; Pascal’s ∞ avoids this.  
     - *Indictment?* Pathology of unbounded utility—decision theory excludes ∞ for good reasons (e.g., St. Petersburg violations).  
  3. **Theological exclusivity:** Assumes only θ₁ offers ∞ payoff. Formally ad hoc; no decision-theoretic principle justifies excluding θ₃,...,θₙ from Π.  
     - *Not decision theory:* This is a doctrinal input, akin to assuming state-dependent utility.  

  **Confidence:**  
  - 95% on ambiguity classification (objections align with partition uncertainty).  
  - 80% on forced choice as act-space reduction.  
  - 70% on salvageability with finite utility—depends on MEU pessimism.  
  - 40% on whether belief voluntarism can be "dynamic-choice"-ified (least sure point).  

  **Residue verdict:** Pascal smuggles in non-decision elements: voluntarism (unmodeled belief control), infinity (pathological), and theology (exogenous payoff restrictions). The core survives as an ambiguity-averse gamble under radical uncertainty, but collapses without these additives.
