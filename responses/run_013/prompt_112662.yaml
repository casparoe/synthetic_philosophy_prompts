answer: |-
  ### Adjudication of the Poker Night Debate

  I'll address each move in the debate, categorizing them as "clearly wrong," "defensible," or "clearly right," with a brief explanation for each. The core issues revolve around the Kelly criterion, expected utility, ergodicity, estimation error, and their implications for one-shot vs. repeated bets. I'll base my assessment on standard decision theory and the agreed-upon setup: a fair coin at 2:1 odds (50% win chance, double stake on win, lose stake on loss), with the Kelly fraction being 25% for repeated bets.

  #### Move 1: Sam's Opening Statement
  - **Sam**: "The quarter is the answer, full stop, even in the one-shot case. Your roll isn't a number, it's you, and there's no second copy of you hanging around to collect the ensemble average. Expected wealth is a fiction dominated by paths where you got astronomically lucky; the time average is what you actually live through. So 'but it's +EV' isn't a reply to anything."
  - **Assessment**: **Defensible but not clearly right**. Sam's argument hinges on the ergodicity perspective (that we experience a single path, so we should optimize for typical outcomes rather than ensemble averages). This view is coherent if we assume logarithmic utility or prioritize avoiding ruin, but it's not objectively mandatory for a one-shot bet—it depends on the agent's preferences. Expected wealth maximization is valid for risk-neutral agents, so dismissing +EV entirely is overreaching.

  #### Move 2: Alex's Kelly-Is-Log-Utility Point
  - **Alex**: "A quarter is a fine rule if you're a log-utility maximizer, but that's a preference, not a theorem. Kelly is literally just expected utility with log wealth, and the long-run/median stuff is a restatement of that, not a proof of it."
  - **Assessment**: **Clearly right**. Alex correctly identifies that the Kelly criterion is derived from maximizing expected logarithmic utility, which is a specific preference (risk aversion skewed toward wealth growth). The long-run properties (e.g., median wealth or growth rate) are consequences of this utility function in repeated play, not independent justifications. This is a foundational result in decision theory.

  #### Move 3: Sam's Time-Average/Ergodicity Defense
  - **Sam**: Invokes time-average/ergodicity to justify the one-shot bet: "the time average is what you actually live through."
  - **Assessment**: **Clearly wrong for the one-shot case**. Ergodicity (e.g., focusing on time-averaged wealth growth) is relevant for repeated bets where paths can be averaged over time, but it doesn't apply to a genuine one-shot bet with no future trials. In one-shot, only the outcome matters, and ergodicity adds no value beyond what log utility already implies—it's misapplied here.

  #### Move 4: Alex's Risk-Neutral Shove Argument
  - **Alex**: "A risk-neutral agent facing a genuine one-shot positive-EV bet with bounded downside should shove, and you don't get to call that irrational by pointing at a limit that never arrives. And the time-average move doesn't escape it either—'the typical path' is just another thing you can care about, and you chose it."
  - **Assessment**: **Clearly right**. For a risk-neutral agent (linear utility), maximizing expected wealth is rational in a one-shot scenario. The bet has positive EV (expected value of +0.5 per unit staked) and bounded downside (loss limited to stake, no debt), so staking everything (f=1) is optimal. Sam's "typical path" is simply a preference for log utility, not a refutation.

  #### Move 5: Sam's Estimation Error Counter
  - **Sam**: "Fine, but then tell me what you're doing when you say bet half of the quarter because my edge estimate might be off. That's not log-utility-plus-noise, that's you admitting the right fraction depends on your beliefs about the model, which is exactly the expected-utility picture you were just mocking."
  - **Assessment**: **Clearly right**. Reducing bets due to estimation error (e.g., half-Kelly) incorporates uncertainty in probabilities or edge, which is fundamentally about beliefs within an expected utility (EU) framework. Alex was mocking EU as merely a preference, but this move shows beliefs (not just utility) drive decisions, reinforcing that EU holistically handles both preferences and beliefs.

  #### Move 6: Alex's Estimation Error Response
  - **Alex**: "No, estimation error is a different thing—it's shrinking toward a prior because your input is bad, not changing your objective. But sure, notice that in one case you correct for it and in the other you treat the number as sacred, and tell me which is which."
  - **Assessment**: **Defensible but incomplete**. Alex is right that estimation error adjusts for input uncertainty (e.g., using a Bayesian prior) without altering the objective (e.g., still maximizing expected log utility). However, this is not "different in kind"—it's a natural part of EU under uncertainty. Alex correctly distinguishes it from changing utility, but Sam's point stands that it relies on the EU framework Alex seemed to dismiss.

  ### Overall Resolution
  - **Key Takeaways**:
    - **Sam's core flaw**: Ergodicity is irrelevant for one-shot bets; insisting that overbetting is always a mistake (even one-shot) assumes log utility without justification. The estimation error point was strong, exposing that beliefs matter in EU.
    - **Alex's core flaw**: Underestimating that EU encompasses both preferences (utility) and beliefs (probabilities), which the estimation error move highlights. Alex is correct that risk-neutral shoving is rational for one-shot, but dismissing Kelly as "just preference" overlooks why it's compelling in practice (e.g., it avoids ruin).
    - **Ergodicity vs. Log Utility**: Ergodicity doesn't add value beyond log utility for one-shot; it's a restatement for repeated cases.
    - **Overbetting in One-Shot**: Not a mistake for risk-neutral agents (shove is optimal), but it is for log utility maximizers. The "mistake" claim is question-begging; it depends on utility.
    - **Estimation Error Move**: Not different in kind from EU—it's a belief-based adjustment within EU, consistent with Sam's view and undercutting Alex's strict separation.

  **Verdict**: Alex wins the debate on points, especially on the one-shot case, as risk-neutral shoving is rationally defensible. However, Sam correctly forces Alex to confront that beliefs (via estimation error) are integral to EU, making Kelly more nuanced than "just a preference." Both have valid insights, but Alex's logic is tighter for the specific setup. If this were repeated bets, Sam would dominate. For poker night, I recommend another round of drinks—both friends are sharp, but Alex edges it out.
