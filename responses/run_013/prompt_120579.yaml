prompt: |-
  I am assembling a framework for adjudicating cases that involve cognitive artifacts — paper notebooks, smartphones, cloud-stored files, shared calendars, wearable and implanted devices, and the software assistants that increasingly hold what people used to remember — and I need the standard of adequacy before I can evaluate any particular theory. Write the desiderata that a theory of cognitive extension must satisfy if it is to be usable for that purpose: if it is to tell a court, a hospital, or a regulator when an external resource is genuinely part of a person's mind, and when it is merely something the person uses.

  Present the requirements as a numbered list. For each one, state the requirement, give the case or consideration that motivates it, and mark it as either non-negotiable or a commitment of one camp that a rival need not accept. Among the requirements you should consider, organized as you see fit:

  (a) The cases the theory must get right: the ordinary notebook case and its variants; a resource consulted deliberately, against a resource whose contents arrive unbidden; a resource shared with another person; a resource that has been destroyed; a resource that its manufacturer can disable or repossess at a distance; a device that is implanted rather than carried.

  (b) The distinctions it may not collapse: a resource contributing causally to a cognitive process, against its constituting part of that process; extension of cognition, against extension of the self or the person; a claim about how we ought to theorize, against a claim about what exists; extension that is momentary and deliberate, against extension that is long-standing and automatic; extension that is graded, against extension that is all-or-nothing.

  (c) The findings it must not contradict: the division of memory labor across people and their external stores; the evidence that offloading to an external store degrades unaided recall; the incorporation of tools into the body schema; the routine use of external props in expert performance; the clinical and legal treatment of implanted devices.

  (d) The constraints on the shape of the theory itself: it must not stipulate its conclusion by defining cognition as what happens inside the skull, and it must not make extension so cheap that the library and the people standing nearby qualify.

  Then, and this is the part I care about most: identify any pair or larger subset of your requirements that cannot be jointly satisfied, and say which single requirement excludes the largest number of otherwise plausible theories. Finally, in a few sentences each, say how the parity-based functionalist account, the internalist or embedded rejoinder, the scaffolding-and-integration approach from evolutionary cognitive science, and the extended-self approach fare against the list. Keep the weight on the criteria and on their motivating cases; the scoring is secondary. Note as well which of your requirements are really demands of my normative purpose rather than demands of the metaphysics, since I want to know which parts of the list a purely descriptive theory could refuse.
reasoning: |-
  We are constructing a list of desiderata for a theory of cognitive extension, to be used in a legal or regulatory framework for adjudicating cases involving cognitive artifacts. The theory must help determine when an external resource is part of a person's mind versus merely a tool they use.

  We will organize the requirements by the categories (a), (b), (c), and (d) as given, but note that the user also wants considerations from the cases, distinctions, findings, and constraints. We'll present a numbered list, each with:
  - The requirement
  - The case or consideration motivating it
  - Mark as non-negotiable or a commitment of one camp (i.e., optional for rivals)

  After the list, we will identify conflicts and then briefly evaluate several theories.

  **List of Desiderata:**

  1. **Requirement: The theory must account for the ordinary notebook case and its variants (e.g., a smartphone, cloud storage).**  
     *Motivation*: This is the classic case from Clark and Chalmers (1998) that initiated the debate. If the theory cannot handle this, it fails at the core.  
     *Type*: Non-negotiable (since it is the central example of extended cognition).

  2. **Requirement: The theory must distinguish between a resource that is deliberately consulted and one that provides information unbidden (e.g., a pop-up notification).**  
     *Motivation*: In legal contexts, the degree of agency and automaticity might matter for responsibility and control. For instance, if an alert pops up without being sought, is it still part of the cognitive process?  
     *Type*: Non-negotiable (because the distinction is crucial for assigning responsibility).

  3. **Requirement: The theory must handle resources shared with others (e.g., a shared calendar).**  
     *Motivation*: Many cognitive artifacts are shared (e.g., in collaborative work). The court must decide if a shared resource is part of an individual's mind.  
     *Type*: Non-negotiable (as shared artifacts are common and must be adjudicated).

  4. **Requirement: The theory must account for a resource that has been destroyed (e.g., a burned notebook).**  
     *Motivation*: If the notebook was part of the mind, does its destruction amount to a loss of part of the mind? What are the implications for memory and evidence?  
     *Type*: Non-negotiable (to address the persistence of cognitive states).

  5. **Requirement: The theory must address resources that can be disabled or repossessed at a distance by a manufacturer (e.g., a cloud service that can be shut off).**  
     *Motivation*: This is common with digital devices and raises issues of control and ownership. If the resource is part of the mind, does the manufacturer have a duty not to disrupt it?  
     *Type*: Non-negotiable (due to real-world relevance).

  6. **Requirement: The theory must address implanted devices (e.g., a brain implant).**  
     *Motivation*: Implants are increasingly used and blur the boundary between internal and external. Legal and clinical treatment often treats them as part of the body.  
     *Type*: Non-negotiable (for completeness and relevance).

  7. **Requirement: The theory must not collapse the distinction between a resource contributing causally to a cognitive process and one that constitutes part of that process.**  
     *Motivation*: This is the classic difference between embedded cognition (causal) and extended cognition (constitutive). Courts need to know when the resource is integral to the cognitive process itself.  
     *Type*: Non-negotiable (to avoid over- or under-extension).

  8. **Requirement: The theory must not collapse the distinction between extension of cognition and extension of the self or the person.**  
     *Motivation*: Extending the self (e.g., through possessions) is not the same as extending cognition. A court might care about the latter for evidentiary reasons.  
     *Type*: Non-negotiable (to prevent category errors).

  9. **Requirement: The theory must not collapse the distinction between a claim about how we ought to theorize cognition and a claim about what exists (metaphysical vs. methodological).**  
     *Motivation*: A legal framework needs metaphysical grounding for responsibility, not just a methodological convenience.  
     *Type*: Non-negotiable (to ensure the theory is about reality, not just perspective).

  10. **Requirement: The theory must not collapse the distinction between momentary, deliberate use and long-standing, automatic use.**  
      *Motivation*: The classic notebook case requires constant, automatic use. Momentary use (e.g., looking up a fact online) is less likely to be cognitive extension.  
      *Type*: Non-negotiable (to avoid over-inclusion).

  11. **Requirement: The theory must not collapse the distinction between graded extension (degrees of integration) and all-or-nothing extension.**  
      *Motivation*: Some artifacts might be deeply integrated but not fully part of cognition. The law often requires binary decisions (e.g., is it part of the mind or not?).  
      *Type*: Non-negotiable (to provide clear legal boundaries).

  12. **Requirement: The theory must be consistent with the division of memory labor across people and external stores (transactive memory).**  
      *Motivation*: Psychological findings show that people rely on others and external stores for memory. The theory should not contradict this.  
      *Type*: Non-negotiable (must align with empirical science).

  13. **Requirement: The theory must account for the evidence that offloading to an external store degrades unaided recall.**  
      *Motivation*: Studies show that using external memory can weaken internal memory. This might affect liability (e.g., if reliance leads to vulnerability).  
      *Type*: Non-negotiable (empirical constraint).

  14. **Requirement: The theory must account for the incorporation of tools into the body schema (e.g., a blind person's cane).**  
      *Motivation*: Neuroscience shows that tools can be incorporated into the body image. This might extend to cognitive tools.  
      *Type*: Non-negotiable (to respect empirical findings).

  15. **Requirement: The theory must account for the routine use of external props in expert performance (e.g., a musician's sheet music).**  
      *Motivation*: Experts often use external aids as part of their skill. The theory should explain when these are merely tools and when they are cognitive extensions.  
      *Type*: Non-negotiable (to cover common cases).

  16. **Requirement: The theory must be consistent with clinical and legal treatment of implanted devices (e.g., pacemakers, neuroprosthetics).**  
      *Motivation*: Implants are often regulated as medical devices and sometimes considered part of the body. The theory should align with these practices.  
      *Type*: Non-negotiable (for practical coherence).

  17. **Requirement: The theory must not stipulate its conclusion by defining cognition as what happens inside the skull.**  
      *Motivation*: This would beg the question against extended cognition. The theory must be open to the possibility of extension.  
      *Type*: Non-negotiable (to avoid internalist bias).

  18. **Requirement: The theory must not make extension so cheap that the library and the people standing nearby qualify as part of one's mind.**  
      *Motivation*: Without constraints, cognitive extension could become too broad (the "cognition in the wild" problem).  
      *Type*: Non-negotiable (to prevent absurdity).

  **Conflicting Requirements and the Most Excluding Requirement:**

  - **Conflict 1**: Requirement 10 (distinction between momentary/deliberate and long-standing/automatic) and Requirement 11 (graded vs all-or-nothing) might conflict. A theory that requires long-standing automatic use (like the original parity principle) might not allow for graded extension. But the law might need a binary decision (Requirement 11) even when the integration is partial.

  - **Conflict 2**: Requirement 7 (causal vs constitutive) and Requirement 18 (no cheap extension) might be in tension. If we require constitutive involvement (non-causal) to avoid cheap extension, we might exclude cases that are deeply integrated but still causal (e.g., an expert using a tool).

  - **The most excluding requirement**: Requirement 18 (no cheap extension) is likely the most stringent because it immediately rules out any theory that is too liberal (e.g., the early extended mind without strong conditions). Many theories fail this by allowing too much (e.g., the internet as part of the mind). This requirement forces the theory to have strict criteria for integration.

  **Normative vs Descriptive Requirements:**

  The user asks which requirements are normative (demands of the purpose) rather than purely descriptive (metaphysical). 

  - **Normative requirements**: 
    - Requirement 2 (deliberate vs unbidden): This is motivated by legal responsibility (normative).
    - Requirement 11 (graded vs all-or-nothing): The law requires binary decisions, so the theory must provide a way to draw a line (normative).
    - Requirement 18 (no cheap extension): To avoid absurd legal consequences (e.g., suing a library for memory loss), we impose this constraint (normative).

  - **Purely descriptive theories** could refuse the normative requirements. For example, a descriptive theory might accept graded extension and not require a binary distinction. But for the legal framework, we need the binary distinction.

  **Evaluation of Theories:**

  1. **Parity-Based Functionalist Account** (Clark and Chalmers): 
     - Uses functional parity: if an external resource plays the same role as an internal process, it counts.
     - Satisfies: 1 (notebook), 6 (implants if functional), 7 (constitutive via parity), 10 (requires constant, automatic use), 17 (does not assume internalism).
     - Fails: 3 (shared resources: parity doesn't address sharing well), 5 (repossessed: if the resource is taken away, does it cease to be part of the mind? The account doesn't handle this well), 11 (it's all-or-nothing: but may not account for degrees), 18 (may be too cheap: e.g., if a public library is constantly used, does it count?).

  2. **Internalist or Embedded Rejoinder** (e.g., Adams and Aizawa):
     - Cognition is only intracranial; external resources are causal inputs.
     - Satisfies: 7 (clearly causal), 18 (no extension, so no cheap extension).
     - Fails: 1 (rejects the notebook case), 17 (defines cognition internally) - violates non-negotiable requirement 17. Also fails 6 (implants might be considered internal, but not external ones).

  3. **Scaffolding-and-Integration Approach** (from evolutionary cognitive science, e.g., Sterelny, Sutton):
     - Focuses on how artifacts scaffold cognition and become integrated through development and practice.
     - Satisfies: 1 (notebook as scaffold), 3 (shared resources as part of a distributed system), 12 (division of memory labor), 14 (tool incorporation), 15 (expert props).
     - Fails: 11 (it's graded, but law requires binary? - may not satisfy the normative demand for a clear line), 10 (might include momentary if well-integrated? - but typically requires long-term integration).

  4. **Extended-Self Approach** (e.g., based on self-theory, or ownership):
     - Focuses on whether the resource is incorporated into the self (e.g., through ownership, control, or identification).
     - Satisfies: 8 (distinguishes cognition from self), 5 (repossession: if the device is part of the self, repossession is problematic), 6 (implants as part of self), 16 (consistent with legal treatment of implants).
     - Fails: 7 (may collapse causal and constitutive by focusing on self rather than cognitive process), 18 (might be too broad: e.g., a cherished book might be part of the self but not cognition).

  **Summary of Evaluation:**
  The scoring is secondary, but we see that no theory satisfies all. The parity account is too narrow in some respects and too liberal in others. Internalism fails the non-negotiable requirement 17. The scaffolding approach is descriptively rich but may not provide the binary distinction needed. The extended-self approach may overextend to non-cognitive aspects.

  The most promising might be a hybrid that incorporates elements of parity (for function), scaffolding (for integration), and self (for ownership/control) to meet the legal demands.
answer: |-
  Below is a numbered list of desiderata for a theory of cognitive extension, tailored to your framework for adjudicating cases involving cognitive artifacts. Each entry states the requirement, the motivating case or consideration, and whether it is **non-negotiable** (essential for any theory in this context) or a **commitment of one camp** (specific to certain approaches, which rivals may reject). The requirements are organized around your specified categories (a)–(d), with additional integrative criteria.  

  ### Desiderata for a Theory of Cognitive Extension  
  1. **Handle the ordinary notebook case and variants (e.g., smartphones, cloud storage)**  
     - **Motivation**: Clark and Chalmers' original notebook case is the baseline for extended cognition debates. Variants (e.g., digital tools) test robustness in modern contexts (category a).  
     - **Status**: Non-negotiable. Failure here invalidates the theory for real-world applications.  

  2. **Distinguish deliberately consulted vs. passively received resources**  
     - **Motivation**: A pop-up notification (unbidden) vs. a consulted notebook implies different levels of agency. Courts need this to assign responsibility (e.g., was an alert "ignored" or "integrated"?) (a).  
     - **Status**: Non-negotiable. Critical for accountability in legal/medical settings.  

  3. **Address shared resources (e.g., shared calendars, collaborative documents)**  
     - **Motivation**: Shared artifacts blur individual ownership. Regulators must determine if a resource is part of *one* mind, *multiple* minds, or neither (a).  
     - **Status**: Non-negotiable. Ubiquitous in workplaces and social life.  

  4. **Account for destroyed or inaccessible resources (e.g., a burned notebook)**  
     - **Motivation**: If a notebook is "part of the mind," its loss may imply cognitive harm (e.g., in disability or inheritance cases). Conversely, ephemeral use (e.g., a glanced-at billboard) should not qualify (a).  
     - **Status**: Non-negotiable. Essential for property, privacy, and liability disputes.  

  5. **Address remotely disabled/repossessed resources (e.g., cloud services)**  
     - **Motivation**: Manufacturers disabling devices (e.g., deleting cloud data) raises questions: Does repossession "amputate" the mind? Who is liable? (a).  
     - **Status**: Non-negotiable. Reflects real-world vulnerabilities of digital artifacts.  

  6. **Explain implanted devices (e.g., neural implants) vs. carried/worn devices**  
     - **Motivation**: Implants are clinically/legally treated as body parts (e.g., pacemakers). The theory must clarify if this makes them "more extended" than external devices (a, c).  
     - **Status**: Non-negotiable. Directly relevant to medical and disability law.  

  7. **Distinguish causal contribution to cognition vs. constitutive role in cognition**  
     - **Motivation**: A calculator *causes* a math result; a notebook *constitutes* memory. Collapsing this conflates tool use (e.g., reading a sign) with genuine extension (b).  
     - **Status**: Non-negotiable. Foundational for avoiding over-inclusion.  

  8. **Distinguish cognitive extension from self/person extension**  
     - **Motivation**: A wedding ring extends the "self" symbolically but not cognitively. Courts need this to separate identity claims (e.g., "my phone *is* me") from functional cognitive roles (b).  
     - **Status**: Non-negotiable. Prevents overreach in privacy/identity cases.  

  9. **Distinguish metaphysical claims (what exists) from methodological claims (how to study)**  
     - **Motivation**: Methodological extension (e.g., "study the notebook as part of cognition") is insufficient for law; regulators need metaphysical grounding for rights/duties (b).  
     - **Status**: Non-negotiable. Avoids conflating scientific convenience with ontic commitments.  

  10. **Distinguish momentary/deliberate use from long-standing/automatic use**  
      - **Motivation**: Consulting Wikipedia once (deliberate) vs. a life-long diary (automatic) may differ in integration depth. Hospitals/regulators need this for assessing habitual reliance (b).  
      - **Status**: **Commitment of one camp**. Rivals (e.g., scaffolding theories) may reject strict automaticity requirements.  

  11. **Accommodate graded extension (degrees of integration) while enabling binary judgments**  
      - **Motivation**: Cognitive integration is often a spectrum (e.g., a new app vs. a veteran user's notebook). Courts need clear thresholds for liability (e.g., "Is this device part of the mind?") (b).  
      - **Status**: Non-negotiable. Legal systems require yes/no decisions despite graded realities.  

  12. **Align with transactive memory systems (division of memory labor)**  
      - **Motivation**: People rely on partners/devices for shared recall (e.g., spouses remembering appointments). The theory must explain this without over-extending to all social ties (c).  
      - **Status**: Non-negotiable. Well-established in cognitive psychology.  

  13. **Explain offloading-induced recall degradation**  
      - **Motivation**: Heavy reliance on devices weakens biological memory. Clinicians need this to assess cognitive health; courts for negligence (e.g., "over-reliance") (c).  
      - **Status**: Non-negotiable. Empirical fact with legal implications.  

  14. **Align with tool embodiment (e.g., cane incorporation into body schema)**  
      - **Motivation**: Blind users' canes are neurally "embodied," affecting self-location. The theory must reconcile this with cognitive extension (e.g., is a smartphone "embodied"?) (c).  
      - **Status**: Non-negotiable. Neuroscientific evidence cannot be ignored.  

  15. **Account for expert use of external props (e.g., musicians' scores)**  
      - **Motivation**: Experts integrate tools seamlessly (e.g., a chef's knife). Regulators need to distinguish expert reliance from novice dependence (c).  
      - **Status**: **Commitment of one camp**. Rivals (e.g., internalism) may dismiss props as non-cognitive.  

  16. **Respect clinical/legal treatment of implants (e.g., as body parts)**  
      - **Motivation**: Implants are regulated as medical devices (e.g., FDA rules). Contradicting this invites incoherence (e.g., is a pacemaker "mind" or "property"?) (c).  
      - **Status**: Non-negotiable. Pragmatic necessity for regulators.  

  17. **Avoid internalist begging (no skull-bound cognition stipulation)**  
      - **Motivation**: Defining cognition as "brain-only" precludes extension by fiat. Courts need an open evaluation (d).  
      - **Status**: Non-negotiable. Required for fair adjudication.  

  18. **Avoid over-extension (exclude libraries/bystanders)**  
      - **Motivation**: Over-inclusion (e.g., "all nearby resources extend my mind") makes liability/ownership absurd (e.g., suing a library for "memory theft") (d).  
      - **Status**: Non-negotiable. Prevents theoretical uselessness.  

  ---

  ### **Conflicting Requirements and Key Excluder**  
  - **Conflict 1**: Requirement 10 (long-standing/automatic use) clashes with Requirement 11 (graded extension). A theory demanding automaticity (e.g., functionalism) may exclude graded cases (e.g., new-but-deeply integrated tools). Requirement 11 forces a binary threshold, but Requirement 10 insists on a specific *type* of integration.  
  - **Conflict 2**: Requirement 7 (causal vs. constitutive) conflicts with Requirement 15 (expert props). Expert tools (e.g., a pilot's cockpit) are deeply integrated but may be deemed "causal" by internalists, while constitutive views risk over-extending.  
  - **Most Excluding Requirement**: **Requirement 18 (no over-extension)** excludes the largest number of theories. It disqualifies:  
    - "Liberal" functionalism (e.g., Clark’s early parity principle), which could include libraries.  
    - Actor-Network Theory, which dissolves cognitive boundaries entirely.  
    - Global workspace theories, if they include any accessible information.  

  ---

  ### **Normative vs. Descriptive Requirements**  
  - **Normative requirements** (driven by adjudicative needs, which descriptive theories can refuse):  
    - **Requirement 11**: Demands binary thresholds for courts, though cognition is graded.  
    - **Requirement 2**: Prioritizes agency distinctions for responsibility assignments.  
    - **Requirement 18**: Avoids impractical over-extension for legal viability.  
    A purely descriptive theory (e.g., cognitive science models) may reject these as "applied constraints," focusing only on empirical adequacy.  

  - **Descriptive requirements** (grounded in metaphysics/empirics, non-negotiable):  
    Requirements 1, 3–9, 12–14, 16–17. These reflect facts about cognition (e.g., transactive memory) or avoid question-begging.  

  ---

  ### **Theory Evaluations Against Desiderata**  
  1. **Parity-Based Functionalism** (Clark & Chalmers):  
     - **Strengths**: Nails Requirement 1 (notebook), Requirement 7 (constitutive role), and Requirement 17 (avoids internalism).  
     - **Weaknesses**: Fails Requirement 18 (libraries may qualify), Requirement 10 (requires automaticity, excluding deliberate use), and Requirement 5 (struggles with repossession).  
     - **Motivating Cases**: Excels at Requirement 6 (implants if parity holds) but not Requirement 3 (shared resources lack "individual" parity).  

  2. **Internalist/Embedded Rejoinder** (Adams & Aizawa):  
     - **Strengths**: Meets Requirement 7 (only causal), Requirement 18 (no extension), and Requirement 13 (offloading is degradation).  
     - **Weaknesses**: Violates Requirement 1 (rejects notebooks), Requirement 17 (skull-bound stipulation), and Requirement 14 (dismisses embodiment).  
     - **Motivating Cases**: Fails Requirement 16 (implants are "tools," not mind) and Requirement 12 (transactive memory is causal, not constitutive).  

  3. **Scaffolding-and-Integration** (Sterelny, Sutton):  
     - **Strengths**: Satisfies Requirement 12 (memory labor), Requirement 15 (expert props), and Requirement 3 (shared resources via scaffolding).  
     - **Weaknesses**: Fails Requirement 11 (graded but lacks binary thresholds), Requirement 10 (momentary use can scaffold), and Requirement 18 (risks over-inclusion).  
     - **Motivating Cases**: Good for Requirement 4 (destroyed resources disrupt scaffolding) but weak on Requirement 9 (blurs metaphysical/methodological).  

  4. **Extended-Self Approach** (e.g., personal identity theories):  
     - **Strengths**: Meets Requirement 6 (implants as self), Requirement 8 (distinguishes self/cognition), and Requirement 16 (aligns with legal treatment).  
     - **Weaknesses**: Fails Requirement 7 (collapses causal/constitutive via "self"), Requirement 14 (embodiment ≠ cognition), and Requirement 13 (ignores offloading effects).  
     - **Motivating Cases**: Handles Requirement 5 (repossession as self-violation) but not Requirement 2 (selfhood doesn't address deliberative vs. automatic).  

  **Summary**: No theory satisfies all desiderata. Functionalism is strong on core cases but over-extends; internalism is legally tidy but descriptively inadequate; scaffolding handles dynamics but lacks binary clarity; self-theories prioritize identity over cognition. Requirement 18 (no over-extension) is the key excluder, while normative needs (e.g., Requirement 11) amplify tensions.
