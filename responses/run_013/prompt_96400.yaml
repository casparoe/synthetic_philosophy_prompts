prompt: |-
  I run the quarterly forecasting review for a mid-size specialty insurer. Four times a year my team has to hand the risk committee a single probability for each of a short list of events the firm is exposed to — whether a regulator clears a filing before a stated date, whether a named counterparty is downgraded within a year, whether a jurisdiction restructures — and the committee uses those numbers directly to size hedges and set reserves. There is no budget or time inside a cycle to commission new research: the number has to come out of a ninety-minute meeting. I am not a statistician; two of my five analysts are; and the chief risk officer, who signs the paper, will not read anything containing a formula.

  The recurring problem is that two analysts look at the same event and come back far apart — 30% and 60% on what is nominally the same question — and the meeting ends either in an average nobody believes or in whatever the most senior person in the room asserts. I know there is a formal result somewhere behind this, Aumann's agreement theorem, and an assumption sitting underneath it, the common prior assumption, and I suspect it tells me something I could actually use. What I cannot do is get from the result to anything my analysts could run on a Tuesday.

  Please write me that procedure. I want the questions to ask, in order, of two people who disagree, together with what counts as a sufficient answer to each and who is responsible for giving it; the tests that separate a disagreement about what the evidence is from a disagreement about where you start from before any evidence arrives from a disagreement about how the same evidence should be read; the point at which the procedure concludes that further discussion will not help and says so; and the point at which it stops and escalates, on the grounds that the remaining difference is not a factual one and somebody has to choose. The procedure has to be runnable by a chair who does not know the theory, so translate rather than cite — I am not going to read the literature, and anything I am meant to use needs to be inside the procedure itself. It should also tell me what to record at the end of a review so the next cycle is not starting from nothing.

  Then run it on three cases and tell me, for each, what the procedure does, where it stops, and what it hands back:

  1. Two analysts at 30% and 60% on whether the regulator clears the filing. The one at 60% has had a private conversation with a contact at the regulator and is not permitted to say what was said. I want to know what the procedure does when the condition it needs cannot be met because the information cannot be pooled, and whether the person who cannot disclose can still be made to answer anything useful.

  2. Two analysts who, after a full exchange, agree on every fact, give the same answer when asked what they would have said knowing nothing but what is public, and still disagree — because they read the same leaked draft differently, one treating it as diagnostic of the regulator's intentions and the other as noise. I expect to be told this is outside the theorem and that I have to pick a reading by fiat. If that is the answer, say it plainly, and tell me who should be doing the picking and on what authority.

  3. The case I will not enjoy. Two analysts converge quickly and comfortably on a number, and I need the procedure to make me distrust that agreement rather than reward it: last year the team converged on a number that was badly wrong, because both analysts had leaned on the same vendor's scenario set, and nothing in our process noticed.

  Finally, tell me which conditions of the result are doing real work in meetings like mine and which are idealizations I can drop without losing the point; whether a procedure of this kind can ever establish that a common starting point exists rather than merely detecting when it fails; and what the procedure cannot do. If the honest conclusion is that the result has very little to say about the meetings I actually hold, say that instead of dressing it up as a method.
reasoning: |-
  We are going to design a procedure inspired by Aumann's agreement theorem, which states that two rational agents with the same prior probability for an event cannot agree to disagree: if they have common knowledge of each other's probabilities, they must converge to the same probability. However, in practice, disagreements may arise due to different priors, different evidence, or different interpretations of the same evidence.

  The procedure we design will have the following goals:
  1. Identify the source of the disagreement (prior, evidence, or interpretation).
  2. Resolve disagreements that are due to evidence or prior by sharing information and recalculating.
  3. Identify when the disagreement is due to interpretation (or other non-factual reasons) and then escalate.
  4. Record the outcome for future reference.

  The procedure will be structured as a series of questions and steps, to be run by a chairperson in a meeting. We assume that each analyst (A and B) has produced a probability estimate (P_A and P_B) for the same event.

  **Procedure for Two Disagreeing Analysts**

  **Step 1: Exchange of Public Facts**
  - The chair asks both analysts to list every piece of evidence (data, reports, events, etc.) that they used to form their probability. They must share all evidence that is not confidential. If there is confidential evidence, they must note that they have it but cannot share the content (we will handle that in Step 2).
  - The chair compiles a combined list of evidence. If an analyst has confidential evidence, the chair notes that there is confidential evidence from that analyst.
  - The chair then asks: "Given the combined set of public evidence, would you change your probability estimate? And if so, to what?"
    - Both analysts provide updated probabilities (P_A1 and P_B1) based on the combined public evidence.
  - If the analysts now agree (within a tolerance, say 5%), then the procedure stops and the agreed probability is recorded. Also, record the combined public evidence set and note that the agreement was reached on the basis of public evidence.
  - If they still disagree, proceed to Step 2.

  **Step 2: Handling Confidential Evidence**
  - If an analyst has confidential evidence that they cannot disclose, the chair asks:
    - "Can you describe the nature of the evidence (e.g., the source, the type, the direction) without disclosing the content?" 
      - If yes, the analyst provides a non-substantive description (e.g., "I have confidential information from a regulator contact that leads me to believe the regulator is more likely to approve").
    - Then the chair asks: "Conditional on the public evidence we have, how much does your confidential evidence shift your probability? Can you express the shift as a likelihood ratio or a probability increment?"
      - The analyst might say: "My confidential evidence increases my probability by 20 percentage points" or "It doubles the odds." (This is a way to extract some quantitative insight without revealing the content.)
    - The other analyst is then asked: "Given this information, how would you adjust your probability? You must assume that the confidential evidence is true and that the analyst has correctly assessed its impact. However, you may question the reliability of the evidence if you have reason to doubt the source or the analyst's interpretation."
      - The second analyst then provides an adjusted probability (P_B2 or P_A2) that incorporates the fact that there is confidential evidence of a certain magnitude and direction.
  - The chair then asks the first analyst: "Given that the other analyst has adjusted their probability based on your description, do you wish to adjust yours further? (For example, if you think the other analyst is overreacting or underreacting to the existence of your confidential evidence.)"
  - Both analysts then reveal their new probabilities (P_A2 and P_B2).
  - If they now agree (within tolerance), record the agreed probability, the public evidence, the fact that confidential evidence was considered (with a description of its nature and impact), and note the resolution.
  - If they still disagree, proceed to Step 3.

  **Step 3: Exchange of Priors**
  - The chair asks: "What probability would you assign to the event if you had no evidence beyond what is publicly available and known to everyone at the firm (including historical data, industry base rates, etc.)? This is your prior probability."
    - Both analysts state their prior (prior_A and prior_B).
  - If the priors are very different, then the disagreement may be due to different starting points. The chair then asks: "Can you explain the reasoning for your prior? What base rates or general principles are you using?"
  - The analysts explain. The chair then asks: "Given the other analyst's prior and reasoning, do you wish to adjust your own prior? And then, using the combined public evidence and any non-confidential adjustments, what is your new probability?"
  - Both analysts recalculate and provide new probabilities (P_A3 and P_B3).
  - If they now agree, record the agreed probability, the priors (and how they were reconciled), and the evidence.
  - If not, proceed to Step 4.

  **Step 4: Interpretation of Evidence**
  - The chair asks: "Now that we have shared all public evidence, considered the impact of confidential evidence, and aligned on priors, what specific piece of evidence or reasoning leads to the remaining difference in your probabilities?"
    - Each analyst points to the same piece of evidence (or a specific reasoning step) that they interpret differently.
  - The chair then asks: "Can you each explain how you interpret that evidence? What is your reasoning for the weight you assign to it?"
  - After hearing each other, the chair asks: "Does hearing the other's interpretation change your view? If so, what is your new probability?"
  - Both analysts provide new probabilities (P_A4 and P_B4).
  - If they now agree, record the agreement and the resolution of the interpretation.
  - If they still disagree, the chair concludes: "We have been unable to resolve the disagreement through sharing evidence, priors, and interpretations. Therefore, we must escalate to the chief risk officer (or designated senior person) for a decision."

  **Step 5: Escalation**
  - The chair records:
    - The two probabilities (P_A4 and P_B4) and the reasons for each.
    - The public evidence set.
    - The existence and nature of any confidential evidence (without content).
    - The priors and how they were set.
    - The specific point of interpretation that could not be resolved.
  - The chair then escalates to the chief risk officer (CRO) with the above documentation. The CRO must choose one of the probabilities or a value in between, based on the documentation and their own judgment.

  **Additional Steps for the Chair at the End of the Review**
  - Record the final probability and the path to get there (which steps were taken, what was shared, and what was escalated).
  - For each event, record the evidence set (public and confidential, with the latter described generally), the priors (if they were exchanged), and any unresolved interpretation issues.
  - This record will serve as the starting point for the next cycle.

  **Special Cases**

  **Case 1: Confidential Information that Cannot be Disclosed**
  - We run the procedure as above.
  - In Step 2, the analyst with the confidential information (say, Analyst B at 60%) must describe the nature and the impact of the evidence without disclosing the content.
  - Analyst A (at 30%) then adjusts their probability to account for the fact that there is confidential evidence that, according to B, adds 30 percentage points (since 60% - 30% = 30%? Not exactly, because the starting points might be different). Actually, we must be cautious: the impact might be multiplicative (odds ratio) or additive. The procedure asks for the shift relative to the public evidence.
    - Suppose in Step 1, after sharing public evidence, Analyst A is at 30% and Analyst B is at 45%. Then B says: "I have confidential evidence that I assess as increasing the probability by 15 percentage points." Then Analyst A must adjust: they now know that there is evidence that B says is worth 15 points. Analyst A might not fully trust that, so they might adjust by less (say, 10 points) to 40%. Then Analyst B is still at 60%? But note: B's 60% was based on both public and confidential. After Step 1, B was at 45% (public only) and then added 15% for confidential to get 60%. Now, when Analyst A adjusts to 40%, B might reconsider: maybe A has a point? So B might lower a bit? If not, then we move to Step 3.
  - If the confidential evidence cannot be described at all (not even the impact), then Step 2 cannot be performed. In that case, the chair must note that one analyst has confidential evidence that cannot be shared or quantified. Then the procedure moves to Step 3 (priors) and then Step 4 (interpretation). If the disagreement remains, the escalation (Step 5) must include the fact that one analyst had confidential evidence that could not be incorporated. The CRO must then decide how much weight to give to that analyst's estimate.

  **Case 2: Same Evidence, Different Interpretation**
  - After Step 1 (exchange of public facts), the analysts have the same evidence and they might even have the same prior (Step 3). But in Step 4, they point to the same piece of evidence (the leaked draft) and interpret it differently.
  - The procedure will try to reconcile in Step 4 by having them explain their interpretations. If after that they still disagree, the procedure escalates to the CRO for a decision.
  - The chair records that the disagreement is due to interpretation of a specific piece of evidence and that the two interpretations are X and Y.
  - The CRO must choose which interpretation to use (or a blend) and set the probability accordingly.

  **Case 3: False Agreement Due to Common Bias**
  - The procedure is designed to uncover the basis of estimates. To address the risk of false agreement, we add a step at the beginning of the next cycle and also a step at the end of the current cycle:
    - At the end of each cycle, when recording the outcome, the chair must also record the key evidence sources and assumptions that led to the estimate.
    - In the next cycle, when starting the procedure, the chair must ask: "What new evidence has emerged since the last review? And what evidence from the last review has been invalidated or changed?"
    - Moreover, the chair must specifically ask: "Are we relying on the same source (e.g., a vendor) for multiple pieces of evidence? If so, have we considered alternative sources or independent verification?"
  - Additionally, in the current procedure, when two analysts agree quickly, the chair should still run a minimal version of the procedure to check for robustness:
    - Ask for the key evidence and the prior.
    - Ask: "What could change your mind? What evidence would cause you to adjust this probability significantly?"
    - If both analysts are relying on the same source, the chair should ask: "What independent evidence do we have to corroborate this source? What is the track record of this source? What alternative scenarios have we considered?"
    - The chair should record these vulnerabilities.

  **Theoretical Underpinnings and Practical Adjustments**

  Aumann's theorem relies on:
  1. Common prior: the analysts start with the same prior probability.
  2. Common knowledge: each analyst knows the other's probability and the entire information partition (which is equivalent to knowing the evidence and how it is interpreted).

  In practice, we cannot assume a common prior, and common knowledge is hard to achieve (especially with confidential information). The procedure tries to build a common evidence set and align priors, but if that fails, we escalate.

  The procedure cannot establish that a common prior exists. It can only detect when the prior is different and try to reconcile. The common prior assumption is an idealization that we drop by allowing for prior exchange and adjustment.

  The procedure cannot resolve disagreements that stem from fundamentally different worldviews or interpretations. That is why we have escalation.

  **What the Procedure Cannot Do**
  - It cannot force disclosure of confidential information.
  - It cannot resolve deep interpretive differences without escalation.
  - It may not uncover groupthink if the two analysts share the same bias (as in Case 3). That is why we require recording of evidence sources and encourage considering alternative sources and scenarios.

  **Running the Cases**

  **Case 1:**
  - Step 1: Exchange public facts. Suppose after sharing public evidence, Analyst A (who started at 30%) is still at 30%, and Analyst B (who started at 60%) adjusts to 45% (meaning the confidential evidence was responsible for 15 percentage points).
  - Step 2: Analyst B says: "I have confidential evidence that I assess as adding 15 percentage points to the probability." Analyst A then must adjust: they might say, "I don't have that evidence, but if it exists and is as described, I would add 10 points (because I trust the source less) to 40%." Then Analyst B is at 60% (because they still have the confidential evidence). But now the chair asks Analyst B: "Given that Analyst A has moved to 40% because of your description, do you wish to change?" Analyst B might say, "No, I stand by 60%." Then we have 40% and 60% -> still a gap.
  - Step 3: Exchange priors. Suppose both agree on a prior of 20% (based on base rates). Then Analyst A says: "Given the public evidence, I updated to 30%, and then adding 10 points for the confidential evidence (as described) gets me to 40%." Analyst B says: "I updated to 45% on public evidence and then 15% for confidential gets me to 60%." They disagree on the update from public evidence. So we move to Step 4.
  - Step 4: They identify that the public evidence update is the issue. They explain. Suppose they cannot agree. Then we escalate. The CRO must decide whether the public evidence update should be 10% (as A) or 25% (as B) and how much to add for the confidential evidence.

  **Case 2:**
  - Step 1: They share public facts, including the leaked draft. Both agree on the set. They update: they still disagree (say, 30% and 60%).
  - Step 2: No confidential evidence.
  - Step 3: They are asked for prior. Both say 25%. Then they update with the public evidence: they still disagree (30% and 60%).
  - Step 4: They point to the leaked draft. One says it's strong evidence (so they updated a lot) and the other says it's weak. They explain. After hearing, they still disagree. Escalate to CRO.

  **Case 3:**
  - The analysts quickly agree at 40%. The chair still runs:
    - Step 1: They list the evidence, which includes the vendor's scenario set.
    - The chair asks: "What prior did you use?" They both say 20% and updated to 40% based on the vendor.
    - The chair asks: "What independent evidence do we have? What if the vendor is wrong?" They have none.
    - The chair records: the estimate is 40%, based heavily on the vendor's scenario set, and there is no independent verification. This is a vulnerability.
    - The chair also notes for the record: "We might be over-relying on a single source. Next cycle, seek alternative scenarios."

  **Conclusion**

  The procedure provides a structured way to break down disagreements and either resolve them or document the reasons for escalation. It does not guarantee agreement but makes the reasons for disagreement explicit. The common prior assumption is an idealization that we drop by including a step for prior exchange. The procedure is practical and can be run by a non-statistician.

  However, it cannot resolve every disagreement, especially those based on non-factual differences (interpretation, values, etc.), and it cannot eliminate groupthink but can flag over-reliance on a single source.
answer: |-
  Below is a structured procedure for reconciling probability disagreements between analysts, inspired by Aumann's agreement theorem. The theorem assumes that rational parties with a **common prior** (i.e., the same initial probability before seeing private evidence) and **common knowledge of each other's beliefs** will eventually agree. In practice, disagreements arise from three gaps:  
  - **Evidence gaps**: One analyst has information the other lacks.  
  - **Prior gaps**: Different starting points before seeing new evidence.  
  - **Interpretation gaps**: Different readings of the same evidence.  

  The procedure isolates these gaps through sequential questioning. It requires a **chair** (you or a delegate) to facilitate. Analysts are **A** and **B**, with initial probabilities **P_A** and **P_B**.  

  ---

  ### **Procedure: Steps, Questions, and Decision Rules**  
  *Timebox: 90 minutes total. Record all answers for future cycles.*  

  #### **Step 1: Share Public Evidence**  
  **Goal**: Eliminate evidence gaps for shareable information.  
  - **Chair asks both**: "List every piece of evidence behind your probability. Exclude confidential details but describe its source and direction (e.g., 'regulator contact suggested approval')."  
  - **Chair compiles** a combined list of evidence.  
  - **Chair asks both**: "Given this combined public evidence, what is your revised probability?"  
  - **Sufficient answer**: Revised probabilities **P_A1**, **P_B1**.  
  - **Stop if**: **|P_A1 - P_B1| ≤ 5%**. Record the agreed probability and evidence set.  
  - **Escalate if**: Analysts withhold shareable evidence without justification.  
  - **Otherwise proceed to Step 2**.  

  #### **Step 2: Account for Confidential Evidence**  
  **Goal**: Quantify the impact of undisclosable evidence.  
  - **Chair asks any analyst with confidential evidence**: "Without revealing content, quantify how your evidence shifts your probability *from the public baseline*. Use: (a) Direction (e.g., 'increases probability'), (b) Magnitude (e.g., '+25 percentage points' or 'doubles the odds')."  
  - **Chair asks the other analyst**: "Given this shift description, revise your probability. State if you doubt the reliability."  
  - **Chair asks the first analyst**: "Does their revision change your view? If so, revise again."  
  - **Sufficient answer**: Revised probabilities **P_A2**, **P_B2** and shift descriptions.  
  - **Stop if**: **|P_A2 - P_B2| ≤ 5%**. Record the probability, evidence set, and shift magnitudes.  
  - **Proceed to Step 3 if still apart**.  

  #### **Step 3: Align Priors**  
  **Goal**: Determine if disagreement stems from different starting points.  
  - **Chair asks both**: "Ignoring all new evidence, what is your prior probability? Base this only on public, immutable facts (e.g., historical base rates, industry data)."  
  - **Chair asks both**: "Explain the reasoning for your prior (e.g., '50% because approvals are coin-flips historically')."  
  - **Chair asks both**: "Hearing the other’s prior and reasoning, revise your prior if needed."  
  - **Sufficient answer**: Revised priors **Prior_A**, **Prior_B** and reasoning.  
  - **Stop if**: Priors converge (≤5% apart) **and** applying the combined evidence from Step 1 leads to agreement. Record the prior and evidence.  
  - **Proceed to Step 4 if still apart**.  

  #### **Step 4: Isolate Interpretation Differences**  
  **Goal**: Identify if disagreement is due to reading the same evidence differently.  
  - **Chair asks both**: "Point to the strongest piece of public evidence where your reading differs. Explain your interpretation (e.g., 'leaked draft is strong signal' vs. 'weak noise')."  
  - **Chair asks both**: "Hearing the other’s interpretation, does your probability change?"  
  - **Sufficient answer**: Specific evidence cited, interpretations, and revised probabilities **P_A3**, **P_B3**.  
  - **Stop if**: **|P_A3 - P_B3| ≤ 5%**. Record the evidence and resolved interpretation.  
  - **Escalate if still apart**: Differences are non-factual (interpretation gaps). The **CRO** chooses the probability.  

  #### **Final Escalation Rule**  
  - If no step achieves agreement, escalate to the **CRO** with:  
    - The evidence set.  
    - Descriptions of confidential shifts.  
    - Priors and interpretations.  
    - A summary of the gap (e.g., "Dispute centers on reading of leaked draft").  
  - **CRO’s role**: Choose a probability based on the documentation. Authority stems from governance policy.  

  #### **Post-Review Recording**  
  Document for next cycle:  
  1. Final probability and how it was reached (e.g., "Averaged after Step 2," "CRO decision").  
  2. Evidence set (public + confidential descriptions).  
  3. Priors and key reasoning.  
  4. Unresolved interpretation disputes.  
  5. Vulnerabilities (e.g., "Over-relied on Vendor X").  

  ---

  ### **Case Walkthroughs**  
  #### **Case 1: Confidential Information (Regulator Filing)**  
  - **Initial**: A=30%, B=60%. B has private regulator conversation.  
  - **Step 1**: B describes evidence as "private talk with regulator, direction positive." Combined public evidence revises estimates to A=35%, B=45% (B’s initial 60% included private insight).  
  - **Step 2**: B quantifies shift: "+10 percentage points from public baseline." A revises to 35% + 10% = 45%. B holds at 45% (now aligned with public + described shift).  
  - **Outcome**: **Stops at Step 2** with 45% agreement. Records: public evidence, B’s "+10pp shift."  
  - **Key**: Confidential evidence is partially incorporated via direction/magnitude. Even if B couldn’t disclose, Step 2 forces a quantifiable shift for A to adjust to.

  #### **Case 2: Same Evidence, Different Interpretation (Leaked Draft)**  
  - **Initial**: A=30%, B=60% after full evidence exchange.  
  - **Step 1**: Combined public evidence includes leaked draft. Revised estimates: A=30%, B=60% (no change).  
  - **Step 2**: No confidential evidence. Proceed.  
  - **Step 3**: Priors converge (both say 40% base rate). Proceed.  
  - **Step 4**: A cites leaked draft: "Weak signal, likely noise." B: "Strong signal of intent." Neither revises estimate.  
  - **Outcome**: **Escalates** to CRO. Records: "Dispute on interpreting leaked draft: A(noise) vs B(signal)."  
  - **Who picks**: **CRO** chooses based on risk appetite (e.g., "If we’re conservative, use B’s reading").  

  #### **Case 3: False Agreement (Vendor Bias)**  
  - **Initial**: Both agree on 50%.  
  - **Procedure still runs** to test robustness:  
    - **Step 1**: Both cite the same vendor scenario set.  
    - **Step 3**: Priors are similar (both 45%).  
    - **Chair’s action**: Flags vulnerability—"No independent evidence beyond Vendor X."  
  - **Outcome**: Records probability but **adds a warning**: "Agreement relies on single source (Vendor X). Next cycle: seek alternative scenarios."  
  - **Prevention**: The procedure exposes over-reliance by forcing evidence disclosure in Step 1.  

  ---

  ### **Theoretical Context and Practical Adjustments**  
  - **Core conditions doing real work**:  
    - **Common prior**: Step 3 tests this. If priors diverge, the procedure forces alignment or exposes bias.  
    - **Common knowledge**: Steps 1–4 enforce evidence/reasoning sharing to approximate this.  
  - **Idealizations you can drop**:  
    - **Infinite rationality**: The procedure uses iterative revisions instead of abstract reasoning.  
    - **Complete information sharing**: Steps 1–2 handle partial sharing via direction/magnitude.  
  - **What the procedure cannot do**:  
    - **Prove a common prior exists**: It only detects mismatches (Step 3) but can’t establish a "true" prior.  
    - **Resolve non-factual disputes**: Interpretation gaps (Case 2) require human judgment.  
    - **Eliminate groupthink**: It flags vulnerabilities (Case 3) but can’t force diverse sourcing mid-cycle.  
  - **Limitations**:  
    - Confidential evidence limits full convergence (mitigated by shift quantification).  
    - Escalation breaks the theorem’s assumptions but is pragmatically necessary.  

  ### **Conclusion**  
  This procedure translates Aumann’s theorem into a actionable 90-minute reconciliation tool. It **works best** for evidence or prior gaps (e.g., Case 1) but **fails cleanly** for interpretation gaps (Case 2), forcing escalation. It **adds value** by exposing hidden assumptions (Case 3) and building auditable records. While not a statistical silver bullet, it structures disagreements into testable components—making your meetings less subjective and more accountable. If your disputes are primarily interpretive (not evidence-based), the theorem’s value is limited, but the procedure still documents *why* escalation is needed.
