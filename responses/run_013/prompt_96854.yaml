  ### Worked Example: The Trust and Punishment Game

  **Game Tree and Payoffs:**

  ```plaintext
  Player 1 (P1) at node 1:
      Action X: (3, 0)   [Terminal]
      Action Y: Go to node 2 (Player 2)

  Player 2 (P2) at node 2:
      Action P: (0, 1)   [Terminal]
      Action Q: Go to node 3 (Player 1)

  Player 1 (P1) at node 3:
      Action R: (2, 2)   [Terminal]
      Action S: (1, 3)   [Terminal]
  ```

  **Visual Representation:**
  ```
  P1 (Node 1)
     ├─ X → (3, 0)
     └─ Y → P2 (Node 2)
             ├─ P → (0, 1)
             └─ Q → P1 (Node 3)
                     ├─ R → (2, 2)
                     └─ S → (1, 3)
  ```

  **Backward Induction Outcome:**
  1. **Node 3 (P1):** Chooses R (2 > 1) → Outcome (2, 2).
  2. **Node 2 (P2):** Compares P (1) and Q (which leads to (2, 2) for P2? Wait! At (2, 2), P2 gets 2, not 1. Correction:  
     - Action P: P2 gets 1.  
     - Action Q: Leads to (2, 2), where P2 gets 2.  
     Since 2 > 1, P2 chooses Q.  
  3. **Node 1 (P1):** Compares X (3) and Y (which leads to (2, 2) via Y→Q→R). Since 3 > 2, P1 chooses X.  
  **Backward-induction outcome: (3, 0).**

  ---

  ### (a) Belief-Based Rationality (Maximizes Expected Utility Given Beliefs)
  **Definition:**  
  Each player's strategy maximizes expected utility given their beliefs. Players hold beliefs about others' actions, updated via the hierarchy of mutual knowledge of rationality (common knowledge of rationality).

  **Belief Profile Surviving All Levels of the Hierarchy:**  
  - **P1's belief at node 1:**  
    Believes that if she plays Y, P2 will play P (giving P1 0).  
  - **P2's belief at node 2 (if reached):**  
    Believes that if she plays Q, P1 will play S at node 3 (giving P2 3).  
  - **P1's belief at node 3 (if reached):**  
    (Not needed, as P1 acts optimally given actual payoffs.)

  **Actual Play:**  
  1. P1 (node 1): Chooses Y.  
     *Rationale:* Believes Y leads to P2 playing P → outcome (0, 1). But (0, 1) is worse than X’s (3, 0)? Wait!  
     **Correction:** P1 prefers (3, 0) over (0, 1), so why choose Y? We need to fix the beliefs.

  **Revised Belief Profile:**  
  - **P1's belief at node 1:**  
    Believes that if she plays Y, P2 will play Q (not P), and then at node 3, P1 will play S. So Y leads to (1, 3) for P1? But (1, 3) gives P1 only 1, worse than X’s 3.  
    **Problem:** No belief makes Y rational for P1 since max(Y) = 2 (via R) < 3.

  **Reconstructed Game with Adjusted Payoffs:**  
  *Adjust payoffs to make Y potentially rational under beliefs:*
  ```
  P1 (Node 1):
      X: (2, 0)   // Less than before
      Y: → P2 (Node 2)
  P2 (Node 2):
      P: (0, 1)
      Q: → P1 (Node 3)
  P1 (Node 3):
      R: (3, 2)   // P1 gets 3 > 2
      S: (1, 3)
  ```
  **Backward Induction:**  
  Node 3: P1 chooses R (3 > 1) → (3, 2).  
  Node 2: P2 chooses Q (2 > 1) → leads to (3, 2).  
  Node 1: P1 chooses Y (3 > 2 from X) → Outcome (3, 2).  

  **Belief Profile for (a):**  
  - **P1’s belief at node 1:**  
    Believes if she plays Y, P2 will play P (outcome (0, 1)), so she gets 0.  
    *Why?* P1 believes P2 thinks:  
    - If P2 plays Q, P1 at node 3 will play S (not R), giving P2 3 > 1.  
    - But P2 is rational and knows P1 is rational, so why would P2 believe P1 will play S (1) when R (3) is better?  

  **Key Insight:**  
  P2’s belief at node 2 is that P1 at node 3 will *irrationally* choose S. With common knowledge of rationality, P2 should know P1 will choose R. Thus, to satisfy (a), we need a belief system where P2’s belief in P1’s irrationality persists, but mutual knowledge of rationality is maintained by "doubting" that the node will be reached.  

  **Solution: Beliefs that Survive the Hierarchy**  
  - **P1’s belief at node 1:**  
    Believes: "If I play Y, P2 will play P because P2 believes that if she plays Q, I (P1) will choose S at node 3."  
  - **P2’s belief at node 2:**  
    Believes: "If I play Q, P1 will choose S at node 3" (even though S is irrational).  
  - **Why beliefs survive mutual knowledge of rationality?**  
    - P2’s belief is about an off-path action (node 3 is never reached if P2 plays P).  
    - Hierarchy allows "vacuous" beliefs for unreached nodes. P2 knows P1 is rational *if node 3 is reached*, but P2 believes it won’t be reached, so she can hold counterfactual beliefs.  

  **Actual Play Under Beliefs:**  
  - P1 chooses X at node 1 (believes Y leads to (0, 1) via Y→P, and 0 < 2 from X).  
  - Outcome: (2, 0) — not backward induction (which is (3, 2)).  
  **Both players are rational:**  
  - P1 maximizes EU given belief (avoids Y to prevent 0).  
  - P2 not called to move, so any strategy is trivially rational.  

  ---

  ### (b) Action-Based Rationality (Best Move at Each Information Set)
  **Definition:**  
  At each information set, the player takes the move that’s best given what she knows at that set (beliefs must be consistent with play reaching that set).

  **Common Knowledge of Rationality Forces Backward Induction:**  
  - **Node 3 (P1):** Knows payoffs; chooses R (3 > 1) → (3, 2).  
  - **Node 2 (P2):** Knows node 3 is reached and P1 is rational, so expects (3, 2) from Q. Chooses Q (2 > 1 from P).  
  - **Node 1 (P1):** Knows node 2 is reached and P2 is rational, so expects (3, 2) from Y. Chooses Y (3 > 2 from X).  
  **Outcome: (3, 2) — backward induction outcome.**  

  ---

  ### Key Feature of the Tree for (a)
  **Single Feature Doing the Work:**  
  The payoff (1, 3) at node 3 for action S. This creates a *non-credible threat*: P2 fears P1 will irrationally choose S if node 3 is reached, justifying P2’s choice of P at node 2 in beliefs.  

  **If Deleted (Set S = (4, 0) so P1 always prefers S):**  
  - Backward induction: Node 3: P1 chooses S (4 > 3).  
  - Node 2: P2 chooses P (1 > 0 from S).  
  - Node 1: P1 chooses X (2 > 0 from Y→P).  
  - Beliefs in (a) collapse to backward induction.  

  ---

  ### Pushback from CKR Optimists
  **Is this a counterexample or a definitional dispute?**  
  - **Optimist’s Pushback:** "Beliefs in (a) violate common knowledge of rationality! P2’s belief that P1 will choose S at node 3 contradicts knowledge of P1’s rationality."  
  - **Rebuttal:** The example *is* a counterexample. Beliefs off the equilibrium path need not be consistent with rationality under (a)’s weaker definition. (a) uses beliefs as *subjective probabilities*, while (b) uses *information-set-consistent beliefs*.  
  - **Which Way I Come Down:**  
    - (a) reflects real-world scenarios (e.g., irrational off-path fears).  
    - (b) is normatively correct for perfect-information games.  

  ---

  ### Can the Readings Come Apart Without Player Certainty of Node Reach?
  **Condition:** No player is ever certain that one of her own nodes won’t be reached.  
  **Why Not?**  
  - In this game, P1 at node 1 assigns probability 1 to node 3 not being reached (if she chooses X).  
  - But if we require players to assign positive probability to all nodes (e.g., trembling hand), then:  
    - (a) would force beliefs to align with backward induction.  
    - (b) unchanged (already forces backward induction).  
  - **Result:** The readings cannot come apart under this condition. Beliefs must respect rationality at all nodes, collapsing to (b).  

  ---

  ### Summary
  This example illustrates how definitions of rationality and belief consistency affect outcomes. The non-credible threat at node 3 enables (a), while (b) enforces backward induction. The tension arises from off-path beliefs and highlights foundational debates in game theory.
