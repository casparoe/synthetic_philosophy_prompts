  The total distance from particle 0 to the last particle is 2, so particle 0 will first collide with particle 1 at time t1=1 (since it starts at 0 and moves at speed 1). After the collision, we want particle 1 to start moving and then collide with particle 2, and so on. However, for the collisions to occur in a finite time, we need the inter-collision times to form a convergent series.

  But note: after the first collision, particle 1 gets a velocity and then moves to collide with particle 2. The distance between particle 1 and 2 is 1/2, and if particle 1 moves at velocity v1, then the time to cover that distance is (1/2)/v1. We must choose masses so that the velocities after each collision are such that the times form a convergent series.

  We assume elastic collisions. For two particles, with masses m1 and m2, initial velocities u1 and u2, the velocities after collision are:

  v1 = ( (m1 - m2)*u1 + 2*m2*u2 ) / (m1 + m2)
  v2 = ( (m2 - m1)*u2 + 2*m1*u1 ) / (m1 + m2)

