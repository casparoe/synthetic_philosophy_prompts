  Alternatively, we can have a finite number of particles at rest initially and have the rest of the particles moving in such a way that they will arrive at their positions just in time for the collisions. However, this might complicate the initial conditions.

  We can instead use a setup with a single particle that bounces between two fixed walls and an infinite sequence of particles that it will collide with. But we want discrete events that are collisions between particles.

  Another idea: use a system of particles that are initially moving and will collide in a sequence. This is known in the literature as the "infinite billiard balls" or "Supertask in Newtonian mechanics" (e.g., by Alper and Bridger).

