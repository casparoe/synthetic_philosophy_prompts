  The setup:

  We consider an infinite sequence of point masses (particles) arranged in a line. Let the particles be labeled by positive integers: particle 1, particle 2, etc. We set up the initial positions and velocities so that they will undergo a sequence of elastic collisions in such a way that the collision times form a convergent series (so that the accumulation time is finite).

