  We want the next collision (between particle 1 and particle 2) to occur after a time t2 = 1/2 / v1 = (1/2) / [2/(1+m)] = (1+m)/(4). Then the time for the n-th collision (between particle n-1 and particle n) would be t_n = ... and we want the sum of t1, t2, ... to converge.

