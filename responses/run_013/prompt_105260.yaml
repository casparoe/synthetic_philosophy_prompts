prompt: |-
  So I'm in this reading group that's been meeting about a year on consciousness, and we've ended up with two regulars who cannot stop going at each other. One is a dyed-in-the-wool illusionist: thinks the notion of phenomenal consciousness as something over and above the functional/representational/access story is a kind of introspective illusion, and that once you've explained why we're so convinced we have it, there's nothing left over to explain. The other is a phenomenal realist in the old-fashioned sense: she thinks there really are phenomenal properties, that our introspective reports are at least roughly tracking something real, and that the illusionist is explaining the explanandum away rather than explaining it. Every session ends the same way — she says he's changed the subject, he says she's positing something no evidence could touch, and we all go home. Last week somebody suggested we try the adversarial collaboration thing instead of another shouting match, and I got volunteered to write it up.

  What I need from you is the document they could both actually put their names to. So: a numbered section of agreed claims — what they both accept about the science and what it does and doesn't establish, about what introspective reports are and what they're evidence for, about what any theory of consciousness owes you, and about which moves are off the table for both sides (my hunch is they can both sign off on rejecting "it's just obvious" and also rejecting "no third-person data could ever bear on this," but let them work that out rather than taking my word for it). Then a table of the genuine disagreements, each stated in wording the person who holds it would accept as fair rather than as a strawman of their own view. For each one, name the crux: the sub-question such that if it got settled, one of them would have to move. And for each crux, give a case or argument that both of them agree bears on it, with each side's prediction written down in advance.

  Two things I want you to build in, because we've noticed this is where the conversation actually gets somewhere. First, make them separate two things they keep collapsing: the content of an introspective judgment, and the causal process that produces it. I want them to say explicitly whether one of these exhausts the other, or whether the gap between them just is the disputed territory — and if it's the disputed territory, say so as precisely as you can manage. Second, use this as one of your crux tests: imagine a manipulation — training, suggestion, a drug, pick one and describe it concretely — after which subjects start reporting that their experience has a structural feature they previously denied it had (say, a determinate phenomenal fringe at the edges of the visual field), while every non-introspective measure we have — discrimination, priming, report-independent physiology, whatever — stays put. Is that the phenomenology changing or the introspective model changing? Write down what the illusionist predicts and what the realist predicts, and be honest about whether any outcome of that experiment would actually embarrass either of them. And if part of what they've been fighting about for a year turns out to be a verbal dispute about the word "phenomenal," say which part and why — but don't pad it if the answer is none of it.
reasoning: |-
  Okay, the user is part of a reading group on consciousness that's been going for a year, and they're stuck with two members constantly debating: an illusionist and a phenomenal realist. The user has been tasked with setting up an adversarial collaboration document to structure their disagreements. I need to create a document both can agree on, with numbered agreed claims, a table of disagreements, cruxes, and tests including a manipulation scenario.

  First, the agreed claims. Both sides accept the science of consciousness, like neural correlates and functional access. They agree that introspective reports are data but not infallible. They also reject "it's just obvious" arguments and the idea that third-person data can't bear on consciousness. The illusionist thinks phenomenal consciousness is illusory, while the realist believes it's real. Common ground includes rejecting dualism and accepting that introspection is a cognitive process.

  Next, the disagreements. Key points include the existence of phenomenal properties and the nature of introspective reports. The realist sees introspection as tracking real properties, while the illusionist sees it as generating a model. The crux for the first disagreement is whether the explanatory gap is epistemic or ontological. For the second, it's whether introspective models are causally related to or metaphysically distinct from what they report.

  For the manipulation test, I need to describe a scenario where subjects report a new structural feature without other changes. The realist would predict phenomenology changes, while the illusionist would say only the model updates. The outcome could embarrass the realist if no functional changes occur, but the illusionist might still argue the model is wrong. Both might have defenses, but it's a good test.

  I also need to address if part of the dispute is verbal. The term "phenomenal" might be used differently: realist as non-structural properties, illusionist as the content of reports. Clarifying that could help, but the core disagreement remains ontological.

  Structuring the document with clear sections: agreed claims, disagreements table, and the manipulation test. Ensuring each side's view is stated fairly. Including the separation of content and causal process of introspection as a key point. The user mentioned this is where conversations get productive, so emphasizing that in the disagreements.

  I should make sure the document is neutral, precise, and avoids strawmen. Also, the cruxes need to be specific sub-questions that could resolve the disagreement. The manipulation test should be concrete, like a drug or training changing reports of a visual fringe. Highlighting predictions and potential outcomes to see if either side would be falsified.

  Finally, wrapping up with how the collaboration proceeds: both sign, focus on cruxes, report findings. This should help move their debate forward constructively.
answer: |-
  Here is a draft adversarial collaboration framework document designed for your illusionist (I) and phenomenal realist (R) to potentially sign. It focuses on shared ground, precise disagreements, testable cruxes, and incorporates your key requirements about introspection and the proposed manipulation test.

  **Adversarial Collaboration Framework: Illusionism vs. Phenomenal Realism**

  **Preamble:** We, the undersigned Illusionist (I) and Phenomenal Realist (R), agree to collaborate on clarifying our core disagreement regarding phenomenal consciousness. We commit to:
  1.  Focusing on shared premises and precisely defined disagreements.
  2.  Identifying specific, testable cruxes where empirical or conceptual progress could resolve aspects of the dispute.
  3.  Engaging with evidence and arguments relevant to these cruxes in good faith.
  4.  Separately analyzing the *content* of introspective reports/judgments and the *causal processes* generating them.

  **Section 1: Agreed Claims (What We Both Accept)**

  1.  **Neural Correlates:** Specific neural processes are reliably correlated with reports of conscious experience and associated cognitive functions (attention, access, reportability, etc.).
  2.  **Functional Role:** Consciousness, as reported and investigated scientifically, plays crucial functional roles in cognition, including information integration, access for global control, and guiding behavior.
  3.  **Introspective Data is Real:** Verbal reports and behavioral indicators based on introspection (e.g., "I see red," "This pain is intense," judgments about visual structure) constitute genuine data that any theory of consciousness must explain. These reports are systematically generated by cognitive processes.
  4.  **Introspection is Fallible & Constructive:** Introspective reports are not infallible revelations of an inner reality. They can be inaccurate, influenced by expectation, attention, memory, cognitive biases, and conceptual frameworks. The process generating them involves complex cognitive operations (access, categorization, judgment).
  5.  **The "Hard Problem" Exists (as a Challenge):** There is a persistent explanatory gap between third-person physical/functional accounts and the *seeming* subjective, qualitative character of experience reported via introspection. Explaining why this gap *seems* so compelling is a core challenge.
  6.  **Rejecting Obviousness & Isolation:**
      *   **Rejecting "It's Just Obvious":** Neither side can rest their case solely on the assertion that the reality (R) or illusion (I) of phenomenal properties is self-evidently true based on introspection alone. The nature of introspection itself is part of the dispute.
      *   **Rejecting "No Third-Person Data":** We agree that third-person data (behavioral, neural, computational, evolutionary) *can and does* bear significantly on theories of consciousness. No aspect of consciousness is *in principle* isolated from potential third-person evidence, though its interpretation is contested.
  7.  **Rejecting Dualism:** We both reject substance dualism. We agree that consciousness arises from, or is constituted by, physical processes in the brain.
  8.  **The Target is Phenomenal Consciousness:** Our core disagreement concerns "phenomenal consciousness" (P-consciousness): the "what it is like" aspect of experience, the subjective, qualitative character (e.g., the redness of red, the hurtfulness of pain), as reported through introspection.

  **Section 2: Genuine Disagreements & Cruxes**

  We identify two core, interconnected disagreements:

