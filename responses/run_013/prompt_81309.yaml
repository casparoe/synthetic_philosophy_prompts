  Then, the Strong Metaphorical Claim. This is where the self is only a metaphor, with no underlying reality. This is radical and less plausible. A materialist would reject it because it denies the physical basis. For dementia, it might support the seminar's view but is problematic as it reduces personhood to narrative alone.

  Ontological Anti-Realism is even more extreme—no self exists, only stories. This is implausible to most, including materialists who see the self as emergent from biology. Using this for dementia undermines ethical considerations.

  Finally, Pattern Realism sees narratives as real patterns in brain processes. This is compatible with materialism, viewing narratives as higher-level phenomena. In dementia, neurological damage disrupts these patterns, explaining identity erosion without denying the person.

