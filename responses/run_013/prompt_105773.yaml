  Hmm, the user is drafting specifications for a decision rule for resource-bounded agents. They need requirements that any adequate theory of rational choice must satisfy when dealing with arbitrarily small probabilities of arbitrarily large payoffs. The key is to identify concrete cases that motivate each requirement and highlight potential conflicts, especially around "fanaticism" in expected value maximization.

  The user wants requirements grounded in concrete decision problems. I need to include at least one original case involving probabilities too small for bounded agents to distinguish from zero. The core tension is whether expected-value maximization forces accepting tiny chances of huge payoffs over modest certain alternatives—what critics call fanaticism.

  For structural requirements, stochastic dominance is fundamental: if one action is always better, it must be preferred. Time consistency prevents money pumps, like sequential choices that lead to sure losses. Immunity to Dutch books is also crucial—no set of bets should guarantee a loss. Aggregability ensures consistent valuation when multiple parties are affected.

  The user cares about conflicts between requirements. There's a key impossibility: bounded agents can't satisfy strict stochastic dominance, finite sensitivity, and fanaticism-blocking simultaneously. If we keep stochastic dominance and finite sensitivity, we must accept some form of fanaticism. But bounded agents can't handle true infinities, so infinities must be excluded or handled with care.

  Non-negotiables for bounded agents include finite sensitivity (due to precision limits), computational tractability (finite time), and robust handling of small probabilities. Preferences like lexicographic ordering or specific aggregation methods are optional based on philosophical stance.

  I'll construct an original case: "The Dust Speck Paradox Extreme." An agent chooses between a certain small reward and a 10^-100 chance of saving 10^100 lives. With finite precision, the probability might be indistinguishable from zero, making the certain reward better. This tests if theories can avoid fanaticism while respecting boundedness.

  The biggest conflict is between stochastic dominance and having a fanaticism-blocker. If an action has any positive chance of a better outcome, stochastic dominance demands preferring it over a sure modest payoff. But bounded agents might need to ignore extremely small probabilities, violating dominance. The requirement that excludes the most theories is stochastic dominance—it's fundamental but forces fanaticism in unbounded domains. For bounded agents, we might relax strict dominance for practical purposes.
answer: |-
  Here are the essential requirements for a rational choice theory under uncertainty for a bounded agent facing arbitrarily small probabilities of arbitrarily large (or unbounded) payoffs, presented with their motivating cases and structural necessities. Conflicts and non-negotiables are explicitly addressed.

  ### Core Requirements & Motivating Cases

  1.  **Stochastic Dominance (SD):**
      *   **Motivation:** The most fundamental consistency requirement. If Action A *always* results in an outcome at least as good as Action B, and has some chance of being strictly better, then A must be preferred to B. Failure violates basic rationality.
      *   **Concrete Case:** Action A: 51% chance of $100, 49% chance of $0. Action B: 50% chance of $100, 50% chance of $0. Any rational agent must strictly prefer A over B. Collapsing this distinction renders preference ordering incoherent.
      *   **Structural Result:** Strict First-Order Stochastic Dominance must be respected.

  2.  **Finite Sensitivity (FS):**
      *   **Motivation:** A bounded agent has finite perceptual/cognitive precision. It cannot distinguish probabilities below some threshold (ε_p) or value differences below some threshold (ε_v). The theory must not demand sensitivity finer than the agent's capabilities allow.
      *   **Concrete Case:** *"The Dust Speck Paradox Extreme" (Original)*: Choose between:
          *   (A) A certain gain of 1 util (e.g., a pleasant sip of tea).
          *   (B) A 10^(-100) chance of saving 10^(100) lives (each valued at 1 util), and a (1 - 10^(-100)) chance of causing a minor, barely noticeable irritation lasting 1 nanosecond to one person (valued at -0.0001 util).
      *   *The Distinction:* A bounded agent cannot reliably compute, represent, or distinguish a probability of 10^(-100) from 0. The expected value of B is astronomical (10^(100) * 10^(-100) = 1 util, minus a negligible fraction), but FS demands the agent *cannot be required* to perceive B as meaningfully different from a near-certainty of a tiny disutility. A theory demanding B is strictly preferred violates FS. FS blocks collapsing "distinguishably non-zero probability" and "indistinguishably non-zero probability" for the agent.

  3.  **Robustness to Small Probability Perturbations (RSPP):**
      *   **Motivation:** Related to FS, but focuses on stability. Infinitesimal changes in probabilities (within the agent's indistinguishability range) should not lead to massive preference reversals for finite outcomes. Protects against fragility.
      *   **Concrete Case:** Action A: Certain 1 util. Action B: (1 - 10^(-50)) chance of 0 util, 10^(-50) chance of 2 utils. Action C: (1 - (10^(-50) + δ)) chance of 0 util, (10^(-50) + δ) chance of 2 utils, where |δ| < ε_p (agent's probability discrimination threshold). RSPP requires A ≻ B and A ≻ C. A theory that flips to B ≻ A or C ≻ A based on δ violates robustness. Distinguishes stable indifference/weak preference from unstable high-stakes gambles based on imperceptible differences.

  4.  **Immunity to Dominance-Diachronic Money Pumps (IDDMP):**
      *   **Motivation:** Ensures time-consistency and protection against exploitation. A sequence of choices deemed rational individually should not lead to a sure loss (strictly dominated outcome) compared to an alternative fixed plan.
      *   **Concrete Case:** *The Tiny Chance Pump (Original)*: An agent prefers a certain 1 util (A) over a gamble (B) with a 10^(-100) chance of 10^(100) utils and else 0 (due to FS/RSPP). Later, they are offered a costless swap: replace the outcome "0" in gamble B with "0.5 utils". By Stochastic Dominance (SD), the modified gamble (B') strictly dominates B, so the agent prefers B' to B. However, B' is just a 10^(-100) chance of 10^(100) utils and a (1 - 10^(-100)) chance of 0.5 utils. The agent still strictly prefers the certain 1 util (A) over B' (due to FS/RSPP). An exploiter can now: (1) Convince the agent to pay a small fee ε (<< 0.5 util) to swap A for B' (since A ≻ B'). (2) Then convince the agent to swap B' for B (since B' ≻ B) for another small fee ε. (3) Then swap B back to A for a third fee ε, leaving the agent with A minus 3ε utils. The agent cycled back to a worse version of their starting point. IDDMP requires the theory to prevent this cycle by ensuring the initial preference between A and B/B' is stable enough to block the first trade.

  5.  **Distinction Between Finite Large and Lexical/Infinite Value (DLI):**
      *   **Motivation:** Arbitrarily large finite values are fundamentally different categories from genuinely infinite values or values lexically prior to all finite stakes. The theory must not conflate them.
      *   **Concrete Case:** Action A: Certain annihilation of Earth (infinite disutility). Action B: Certain pleasant afternoon (finite utility). Action C: 10^(-(10^10)) chance of creating a utopia of duration 10^(10^10) years (immense finite utility), else nothing. DLI requires A ≺ B ≺ C (or possibly B ≺ C depending on other rules), but critically, A must be strictly worse than B and C. Collapsing A (infinite disutility) with C (finite, however large) is catastrophic. A theory where C ~ A or B ~ A fails DLI.

  6.  **Computational Tractability (CT):**
      *   **Motivation:** The agent has finite running time. The decision rule must be computable within feasible time bounds given the agent's computational resources and the complexity of the decision problem (e.g., number of actions, outcomes, precision required).
      *   **Concrete Case:** Evaluating an action involving a complex simulation requiring more computation time than the agent has available to make the decision. The rule must provide a feasible approximation method or default strategy. Rules demanding exact calculation of intractable integrals over unbounded spaces fail CT.

  7.  **(Optional) Aggregability (AGG):**
      *   **Motivation:** If the agent's action affects multiple parties, valuations should aggregate consistently. While specific aggregation (e.g., utilitarian vs. prioritarian) is a value choice, the *form* of the valuation under uncertainty should allow consistent aggregation.
      *   **Concrete Case:** Choosing between Policy X (guarantees minor benefit B to each of N individuals) and Policy Y (gives a massive benefit M to one randomly selected individual, nothing to others). A theory must allow comparing the aggregate value of "B for all" vs. "M for one, else 0" under uncertainty. Failure prevents multi-party assessment.

  ### Conflicts and Impossibilities

  The core conflict revolves around **Stochastic Dominance (SD)**, **Finite Sensitivity (FS)**, and the desire to **Block Fanaticism (BF)**. Fanaticism is defined as: *For any sure modest gain S and any tiny probability p > 0, there exists some finite payoff L large enough that a p-chance of L is strictly preferred to S.*

  1.  **SD + Unbounded Payoffs → Fanaticism:** Consider Action S (Sure modest gain, value V_s). Action G(p, L): Probability p of payoff L > V_s, probability (1-p) of 0. By SD, if p > 0, G(p, L) strictly dominates the action "Get 0 for sure". To prefer S over G(p, L), we need V_s > p * L. For any fixed p > 0, as L increases, p*L increases without bound. Therefore, *for any fixed p > 0*, there exists L large enough that p*L > V_s. If rationality requires preferring actions with higher expected value (EV), then for any p>0 and S, ∃L such that G(p, L) ≻ S. This *is* fanaticism. **SD + EV Maximization + Unbounded Payoffs imply Fanaticism.**

  2.  **Blocking Fanaticism (BF) Requires Violating SD or FS:** To block fanaticism, we need: ∃S, ∃p>0, such that ∀L, S ≽ G(p, L). However:
      *   **Violating SD:** If we declare S ≽ G(p, L) for all L, even though G(p, L) strictly dominates "Get 0" and S ≻ "Get 0", this directly violates SD when comparing G(p, L) to "Get 0". (S ≻ Get 0, but S ≽ G(p, L) ≻ Get 0 contradicts transitivity/SD).
      *   **Violating FS (Strictly):** Instead of violating SD globally, we can leverage the agent's limits. FS says the agent cannot distinguish p below threshold ε_p from 0. So, for p < ε_p, the agent treats G(p, L) *as if* it were "Get 0". Therefore, S ≻ Get 0 ~ G(p, L), so S ≻ G(p, L). This respects SD *for distinguishable probabilities* (p ≥ ε_p), but for p < ε_p, G(p, L) is effectively collapsed to "Get 0" due to indistinguishability, *even if L is finite but huge*. This blocks fanaticism *for indistinguishable tiny probabilities* without a *strict* SD violation for distinguishable acts. However, it means SD is not *strictly* upheld for all mathematically defined acts, only for the acts distinguishable by the agent. The agent would be indifferent between G(ε_p/2, L) and "Get 0" for any L, even though mathematically G(ε_p/2, L) ≻ "Get 0".

  3.  **The Fundamental Impossibility:** **A theory for a bounded agent cannot simultaneously satisfy all of the following:**
      *   Strict Stochastic Dominance (SD) for all mathematically defined acts.
      *   Finite Sensitivity (FS) - respecting the agent's inability to distinguish very small p from 0.
      *   Block Fanaticism (BF) - rejecting the p-chance of L over S for some S and some p>0, regardless of L.
      *   Compatibility with unbounded finite payoffs.

      **The Conflict Case:** "The Dust Speck Paradox Extreme" (Case motivating FS). SD requires G(p, L) ≻ "Get 0". FS makes the agent treat G(p, L) ≈ "Get 0" for p < ε_p. If the agent also has S ≻ "Get 0" (a modest sure gain), then combining FS (G(p, L) ~ Get 0) and S ≻ Get 0 implies S ≻ G(p, L) for p < ε_p. This blocks fanaticism *for indistinguishable p*. However, this violates *strict* SD because mathematically G(p, L) ≻ "Get 0", yet the agent is indifferent between them. Conversely, insisting on *strict* SD for G(p, L) vs "Get 0" forces G(p, L) ≻ "Get 0", and combined with S ≻ "Get 0" and transitivity, allows the possibility that G(p, L) ≻ S even for p < ε_p (if L is large enough), leading to fanaticism. **FS + BF requires relaxing strict SD for acts with indistinguishable probabilities.**

  4.  **IDDMP Reinforces the Need for FS/RSPP:** The "Tiny Chance Pump" case shows that without FS/RSPP providing a stable preference of S over G(p, L) for very small p, SD alone can lead to money pumps if the agent's preferences flip based on indistinguishable perturbations (like the 0 -> 0.5 util change). FS/RSPP stabilizes the preference against such pumps by making the agent persistently indifferent to or strictly preferring S over the class of indistinguishable tiny-chance huge-gain gambles.

  ### Non-Negotiables vs. Preferences

  *   **Non-Negotiables (For Bounded Agents):**
      *   **Finite Sensitivity (FS):** Mandatory. A theory ignoring the agent's perceptual/cognitive limits is unusable by definition.
      *   **Robustness to Small Probability Perturbations (RSPP):** Mandatory. Fragility to imperceptible changes undermines practical rationality.
      *   **Computational Tractability (CT):** Mandatory. An unimplementable rule is irrelevant.
      *   **Stochastic Dominance (Relaxed):** Mandatory *for distinguishable acts*. However, strict adherence *for indistinguishable acts* must be relaxed (as shown by the impossibility) to accommodate FS and BF.
      *   **Immunity to Dominance-Diachronic Money Pumps (IDDMP):** Mandatory. Vulnerability to sure loss through rational choices is definitionally irrational.
      *   **Distinction Between Finite Large and Lexical/Infinite Value (DLI):** Mandatory. Conflation leads to catastrophic misprioritization.

  *   **Preferences / Camp-Specific:**
      *   **Aggregability (AGG):** Desirable, but the *method* of aggregation (sum, average, maxmin, etc.) is a value judgment, not a core rationality requirement.
      *   **Strict Block on Fanaticism (BF):** A preference. Some camps demand it (leveraging FS), others accept "bounded fanaticism" (only for distinguishable p > ε_p) as the price of preserving SD as strictly as possible. The impossibility shows BF isn't achievable without relaxing SD for indistinguishable acts.
      *   **Lexicographic Ordering:** A specific approach often used to handle infinities or lexical priorities, but not mandated by core requirements alone (DLI requires distinction, not necessarily lex ordering).
      *   **Specific Risk Aversion Models:** How risk aversion manifests for large-but-finite stakes within distinguishable probabilities is a modeling choice, constrained but not dictated by SD, FS, RSPP.

  ### The Most Excluding Requirement

  **Stochastic Dominance (SD)** is the requirement that excludes the largest number of otherwise attractive theories if interpreted strictly for all mathematically defined acts. Relaxing SD only for acts involving probabilities below the agent's discrimination threshold (ε_p) is necessary to accommodate Finite Sensitivity (FS) and Block Fanaticism (BF) for bounded agents. Theories insisting on strict SD for all mathematically p>0 are forced into fanaticism (BF violation) or must reject unbounded payoffs. Theories prioritizing FS and BF must explicitly relax strict SD for indistinguishable tiny probabilities. The requirement that *must* be kept for any coherent theory is **SD for distinguishable acts**, but its *strict* interpretation over *all* acts is the primary source of conflict with bounded rationality constraints.
