answer: |-
  ### Session Plan: Mixed-Strategy Dominance & Iterated Elimination  
  **Game Used:** Your provided 3x2 matrix (perfect for this session—no replacement needed). It has:  
  - **Key features:** No pure-strategy dominance, Bottom dominated by a mixed strategy (Top/Middle), clean iterated elimination to a unique survivor (Top, Left), and a Nash equilibrium that aligns with the result.  

  **Order of Ideas, Dependencies, and Pitfalls:**  
  *(Total: 75 minutes; final task: 5 minutes)*  

  #### 1. **Review Pure Strict Dominance & Set Up (10 min)**  
  - **What:** Ask students to identify strictly dominated pure strategies using the matrix.  
    ```markdown
    |        | Left | Right |
    |--------|------|-------|
    | Top    | 3,2  | 0,0   |
    | Middle | 0,2  | 3,0   |
    | Bottom | 1,0  | 1,5   |
    ```  
  - **Dependency:** Builds on prior knowledge (pure dominance = a strategy is always worse than another).  
  - **Student task:** "Is any pure strategy strictly dominated? Why/why not?"  
  - **Revelation:** *No pure strategy is dominated.*  
    - Top vs. Middle: Each beats the other depending on Player 2 (Left/Right).  
    - Bottom vs. Top: Worse if Player 2 plays Left (1 < 3), better if Right (1 > 0).  
    - Bottom vs. Middle: Worse if Player 2 plays Right (1 < 3), better if Left (1 > 0).  
  - **Pitfall to address:** "Dominated = opponent can punish it."  
    - **Clarify:** Dominance is about *own payoffs* across *all opponent actions*, not punishment. Say:  
      > "Strict dominance means: Is there a rival strategy that gives me higher payoff *no matter what the opponent does*?"  

  #### 2. **Introduce Mixed-Strategy Dominance (20 min)**  
  - **What:** Show Bottom is strictly dominated by a mixed strategy (50-50 Top/Middle).  
  - **Dependency:** Students must understand expected payoffs (from prior lectures).  
  - **Visual:** Draw the payoff space for Player 1 (see diagram below).  
    - Axes: "Payoff if Player 2 plays Left" (x), "Payoff if Player 2 plays Right" (y).  
    - Plot points: Top (3, 0), Middle (0, 3), Bottom (1, 1).  
    - Convex hull: Line between Top and Middle. Show Bottom is *strictly below* this line.  
      ```  
      Payoff if Right (y)  
      |   Middle (0,3)  
      |      *  
      |     / \  
      |    /   \  ← Convex hull dominates Bottom  
      |   /     \  
      |  *-------*  
      |Bottom(1,1) Top (3,0)  
      ----------------------- Payoff if Left (x)  
      ```  
  - **Student task:** "Find a mix of Top and Middle that beats Bottom against *both* Left and Right."  
    - Guide them to solve:  
      - Against Left: \( p \cdot 3 + (1-p) \cdot 0 > 1 \) → \( p > \frac{1}{3} \)  
      - Against Right: \( p \cdot 0 + (1-p) \cdot 3 > 1 \) → \( p < \frac{2}{3} \)  
    - **Key insight:** Any mix with \( p \in (\frac{1}{3}, \frac{2}{3}) \) works (e.g., 50-50: 1.5 > 1).  
  - **Pitfall to address:** "The mix is something Player 1 actually plays."  
    - **Clarify:**  
      > "The mix *proves* Bottom is irrational. Player 1 would never play Bottom because *some mix* does better. We don’t assume they randomize; we assume they avoid dominated strategies."  

  #### 3. **Iterated Elimination (15 min)**  
  - **What:** Eliminate Bottom → new 2x2 game → eliminate Player 2’s Right → eliminate Player 1’s Middle.  
  - **Dependency:** Students must accept that dominated strategies (even by mixes) are removed.  
  - **Process:**  
    1. Remove Bottom (dominated by Top/Middle mix).  
       ```markdown
       |        | Left | Right |  
       |--------|------|-------|  
       | Top    | 3,2  | 0,0   |  
       | Middle | 0,2  | 3,0   |  
       ```  
    2. "Now, is any strategy dominated?"  
       - Player 2: Left always gives 2 > 0 (Right) → **Right is strictly dominated (by pure Left)**.  
       - Remove Right → game reduces to:  
         ```markdown
         |        | Left |  
         |--------|------|  
         | Top    | 3,2  |  
         | Middle | 0,2  |  
         ```  
    3. Player 1: Top (3) > Middle (0) → **Middle dominated (by pure Top)**.  
  - **Survivor:** (Top, Left).  
  - **Pitfall to address:** "Survival implies I should play the survivor."  
    - **Clarify:**  
      > "Survival means the strategy *could* be rational. But to coordinate on (Top, Left), we need more (e.g., Nash). Iterated dominance doesn’t tell players what to play; it tells them what *not* to play."  

  #### 4. **Solution Concept: What This Is (and Isn’t) Good For (15 min)**  
  - **What survives:** (Top, Left).  
  - **Check Nash:**  
    - Player 1: Given Left, Top (3) > Middle (0) and Bottom (1).  
    - Player 2: Given Top, Left (2) > Right (0).  
    → It’s Nash.  
  - **Key points:**  
    - **What it’s good for:** Pruning irrational strategies. In 2-player games, strategies surviving iterated strict dominance = rationalizable = never a best response.  
    - **What it’s not good for:** Always predicting outcomes. If multiple strategies survive, we need more refinement (e.g., Nash).  
  - **Limitations:**  
    - **Order-sensitivity:** Strict dominance is order-independent; weak dominance is not (omit weak dominance entirely).  
    - **>2 players:** The "never a best response" equivalence breaks (mention briefly; omit details).  

  #### 5. **Final Task (10 min): Test Deep Understanding**  
  - **Question:**  
    > "In this game, why is checking for pure-strategy dominance insufficient to eliminate Bottom? Why is the mixed-strategy test the *right* way to generalize dominance?"  
  - **Goal:**  
    - **Surface answer:** "No pure strategy dominates Bottom, but a mix does."  
    - **Deep answer (separates comprehension):**  
      - "Pure dominance only checks *one* rival strategy. The mixed test checks *all lotteries over rivals*. Bottom isn’t beaten by any single rival, but it’s beaten by hedging between Top and Middle. This mirrors rationality: if no pure strategy is always better, a mix might be."  

  #### 6. **Deliberate Omissions**  
  - **Skip:**  
    - Separating hyperplane proof (too advanced for recitation).  
    - Common knowledge of rationality foundations (assume rationality without formalizing).  
    - Weak dominance and order-sensitivity (say: "We focus on strict dominance because it’s robust; weak dominance is messier and order-dependent.").  
    - Multi-player complications (say: "In 3+ players, strict dominance and ‘never best response’ diverge; we focus on 2-player where they align.").  
  - **Announce:**  
    > "We omit hyperplanes and epistemic foundations for brevity. We also skip weak dominance and multi-player nuances to focus on core intuition."  

  ### Why Your Game Works  
  - **At each step:**  
    - **Pure dominance review:** No pure dominance → forces need for mixed strategies.  
    - **Mixed dominance:** Bottom dominated by intuitive 50-50 mix (students can compute it).  
    - **Iterated elimination:** Clean reduction (Bottom → Right → Middle) to (Top, Left).  
    - **Solution concept:** Survivor is Nash, illustrating the concept’s value but also its limits (e.g., if multiple survived).  
  - **When students lead:** They derive the mix (Step 2) and elimination (Step 3).  

  ### Handling Misconceptions  
  | Misconception | When to Address | Script |  
  |---------------|-----------------|--------|  
  | "Dominated = opponent can punish" | Step 1 (pure dominance review) | "Dominance is about *your* payoffs if the opponent plays *anything*, not their intent to punish." |  
  | "Dominating mix is played" | Step 2 (mixed dominance intro) | "The mix proves Bottom is irrational; we don’t assume players randomize." |  
  | "Survival = play it" | Step 4 (solution concept) | "Survival means it’s not irrational; it doesn’t mean you should play it without coordination." |  

  ### Session Flow Summary  
  - **0–10 min:** Pure dominance review + misconception fix.  
  - **10–30 min:** Mixed dominance intro + payoff diagram + student mix derivation.  
  - **30–45 min:** Iterated elimination (student-driven).  
  - **45–60 min:** Survivor as Nash, solution concept discussion.  
  - **60–70 min:** Final task + discussion.  
  - **70–75 min:** Omissions recap + wrap-up.  

  Your game elegantly supports all objectives. It’s simple enough for computations but rich enough to illustrate generality. The only tweak: Emphasize the payoff diagram to make dominance visually intuitive.
