prompt: |-
  I teach the mixed-strategy recitation in a first-year graduate game theory course: twenty students, eighty minutes, whiteboard only, no handouts. Roughly half are economists and half come from computer science theory. They have had the lectures on mixed strategies and on Nash equilibrium; they can solve a two-by-two mixed equilibrium by hand, and they know what a strictly dominated pure strategy is. What they have not seen is dominance by a mixed strategy. In one session I have to teach four things: that a strategy can be strictly dominated by a lottery over its rivals even when no single rival strategy dominates it; the picture that makes that fact feel necessary rather than lucky; what happens when the elimination is iterated; and what survives at the end, and what that result is and is not good for as a solution concept.

  I would like one game to carry the whole session, and I have built this one. Player 1 has Top, Middle, Bottom; player 2 has Left, Right. Payoffs are written with player 1's first.

  | | Left | Right |
  |---|---|---|
  | Top | 3, 2 | 0, 0 |
  | Middle | 0, 2 | 3, 0 |
  | Bottom | 1, 0 | 1, 5 |

  My instinct is that this single matrix can do all the work. I would rather be told now that it cannot than find out in front of them.

  Plan the session for me. I need:

  - the order in which the ideas have to come, with the dependencies made explicit: what must already be in place before each step, and what specifically goes wrong for a student who is handed a later step without its predecessor;
  - a verdict on the game above as the carrying example, with the features of it that are doing work at each point where it reappears, and the point at which the students rather than I should be the ones to produce the dominating mixture; if it should be replaced or supplemented, what the replacement must have that mine lacks (or the reverse), and where in the sequence it belongs;
  - the misconceptions they will arrive with or form. My guess is that the big one is that a dominated strategy is one the opponent can punish, followed by treating the dominating mixture as something the player actually plays, and by reading survival of the elimination as a licence to play the survivor; for each, the precise point in the sequence at which it should be headed off, and what I should say there;
  - one question or short task for the last ten minutes that separates a student who can run the arithmetic from one who sees why the mixture test is the right test and the pure-strategy test only a special case of it;
  - what I should deliberately leave out and announce that I am leaving out. I am already inclined to skip the separating-hyperplane proof and the common-knowledge-of-rationality foundations; tell me whether that is right, and rule on whether to say anything at all about weak dominance and its order-sensitivity, and about how much of this picture survives with three or more players, where the clean two-player equivalence between strict dominance and never being a best response stops being clean.
reasoning: |-
  We are going to use the provided game to illustrate the concepts. The game matrix is:

          Left    Right
  Top     (3,2)   (0,0)
  Middle  (0,2)   (3,0)
  Bottom  (1,0)   (1,5)

  The plan for the session:

  1. **Review of Pure Strategy Strict Dominance (5 minutes)**
     - Ask: "Which strategies are strictly dominated by a pure strategy?"
     - Have students identify that for Player 1: 
          - Top is not dominated by Middle (because if Player 2 plays Left, Top gets 3 > 0 from Middle; if Right, Top gets 0 < 3 from Middle).
          - Similarly, Middle is not dominated by Top (same reason, symmetric).
          - Bottom: compare with Top and Middle. 
              - Against Left: Bottom gets 1 < 3 (Top) and 1 > 0 (Middle) -> so not dominated by Top or Middle alone?
              - Against Right: Bottom gets 1 > 0 (Top) and 1 < 3 (Middle) -> again, not dominated by Top or Middle alone.
          - So no pure strategy for Player 1 is dominated by another pure strategy.
     - For Player 2:
          - Left: against Top gets 2, against Middle gets 2, against Bottom gets 0.
          - Right: against Top gets 0, against Middle gets 0, against Bottom gets 5.
          - Compare: 
              - Left vs Right: 
                  - If Player 1 plays Top: 2 (Left) > 0 (Right) -> so Left is better
                  - If Player 1 plays Middle: 2 (Left) > 0 (Right) -> Left better
                  - If Player 1 plays Bottom: 0 (Left) < 5 (Right) -> Right better
              - So neither of Player 2's pure strategies dominates the other.

     - Conclusion: no strategy is strictly dominated by a pure strategy.

  2. **Introduce the Idea of Mixed Strategy Dominance (15 minutes)**
     - Now pose: "Could a strategy be strictly dominated by a mixed strategy?"
     - Focus on Player 1's Bottom. We suspect it might be dominated by a mixture of Top and Middle.
     - Ask: "Suppose Player 1 plays Top with probability p and Middle with probability 1-p. What would be the expected payoff against Player 2's Left and Right?"
          - Against Left: p*3 + (1-p)*0 = 3p
          - Against Right: p*0 + (1-p)*3 = 3(1-p)
     - We want this mixture to strictly dominate Bottom in both cases (i.e., for both actions of Player 2).
          - We require:
              - For Left: 3p > 1
              - For Right: 3(1-p) > 1
          - Solve: 
              - 3p > 1 => p > 1/3
              - 3(1-p) > 1 => 3 - 3p > 1 => 3p < 2 => p < 2/3
          - So for any p in (1/3, 2/3), the mixture of Top and Middle strictly dominates Bottom.
     - Demonstrate with p=1/2: 
          - Against Left: (1/2)*3 + (1/2)*0 = 1.5 > 1
          - Against Right: (1/2)*0 + (1/2)*3 = 1.5 > 1
     - So Bottom is strictly dominated by the mixed strategy (1/2, 1/2, 0) for Player 1.

     **Key Picture**: Draw the set of payoffs for Player 1. The pure strategies give points: 
          - Top: (3, 0)   [against Left and Right]
          - Middle: (0, 3)
          - Bottom: (1, 1)
     - The mixed strategies of Top and Middle form the line segment between (3,0) and (0,3). The equation of this line: when p is the weight on Top, the payoff vector is (3p, 3(1-p)).
     - We see that the point (1,1) lies below this line (because 3p=1 => p=1/3, then the Right payoff is 2, which is above 1; similarly, at p=2/3, Left payoff is 2>1). The set of mixed strategies of Top and Middle forms a convex set that lies entirely above (1,1) in both coordinates.

     - This picture makes it necessary: the set of mixed strategies allows us to convexify the payoff set. If a strategy's payoff vector is strictly inside the convex hull of the other strategies, then it is strictly dominated.

  3. **Iterated Elimination (10 minutes)**
     - Now eliminate Bottom for Player 1 (since it is strictly dominated by a mixed strategy). The reduced game:

          |        | Left | Right |
          |--------|------|-------|
          | Top    | 3,2  | 0,0   |
          | Middle | 0,2  | 3,0   |

     - Now ask: "In this reduced game, are there any strictly dominated strategies? (now we can check pure and mixed, but in this case pure will suffice)."
     - For Player 2:
          - Left: against Top gets 2, against Middle gets 2.
          - Right: against Top gets 0, against Middle gets 0.
          - So both of Player 2's strategies give the same payoff regardless of Player 1? Not exactly: 
              - If Player 1 plays Top, Left gives 2 and Right gives 0 -> Left is better.
              - If Player 1 plays Middle, Left gives 2 and Right gives 0 -> Left is better.
          - Therefore, Right is strictly dominated by Left (a pure strategy) for Player 2.
     - Eliminate Right. The game becomes:

          |        | Left |
          |--------|------|
          | Top    | 3,2  |
          | Middle | 0,2  |

     - Now, for Player 1: 
          - Top gives 3, Middle gives 0. So Middle is strictly dominated by Top (pure). Eliminate Middle.
          - Only Top remains.

     - The iterated elimination process leaves (Top, Left). This is the only strategy profile that survives.

  4. **What Survives and the Solution Concept (10 minutes)**
     - We have a unique profile that survives iterated strict dominance (ISD): (Top, Left). 
     - Note: This is also a Nash equilibrium. Check:
          - If Player 1 plays Top, Player 2's best response is Left (2>0). 
          - If Player 2 plays Left, Player 1's best response is Top (3>0 and 3>1, and also 3>0 from Middle). 
          - So (Top, Left) is a Nash equilibrium.
     - But note: there is another Nash equilibrium? 
          - Consider (Bottom, Right): 
              - Player 1: if Player 2 plays Right, then Player 1's payoffs: Top=0, Middle=3, Bottom=1. So best response is Middle, not Bottom. 
              - So (Bottom, Right) is not a Nash.
          - What about (Middle, Right)? 
              - Player 1: if Player 2 plays Right, then Middle gives 3 (which is best: 3>0 and 3>1). 
              - Player 2: if Player 1 plays Middle, then Left gives 2 and Right gives 0 -> best response is Left, not Right. 
          - So only (Top, Left) is a Nash.

     - What we have: 
          - The set of strategies that survive iterated strict dominance (with mixed strategies allowed) is exactly the set of rationalizable strategies (in two-player games). 
          - Also, in two-player games, a strategy is strictly dominated if and only if it is never a best response to any belief over the opponent's strategies.

     - What it is good for: 
          - It refines the set of Nash equilibria? Not exactly: every Nash equilibrium strategy survives iterated strict dominance. But note: sometimes there are Nash equilibria that use strategies that are dominated? Actually, in Nash equilibrium, no player uses a strictly dominated strategy (because if a strategy is strictly dominated, then there is another strategy that gives strictly higher payoff against every strategy of the opponent, so it cannot be a best response). Therefore, the set of strategies that survive ISD includes all Nash equilibrium strategies. 
          - In this case, we got a unique outcome, which is a Nash equilibrium.

     - What it is not good for: 
          - There might be games where no strategy is dominated (even by mixed) and then we get no reduction. 
          - Also, in games with more than two players, the equivalence between never being a best response and being strictly dominated breaks down (so we have to be careful).

  5. **Addressing Misconceptions**
     - **Misconception 1**: A dominated strategy is one the opponent can punish.
       - Clarify: Dominance is about the player's own payoffs. A strategy s is strictly dominated if there exists another strategy (pure or mixed) that yields a strictly higher payoff regardless of what the opponent does. It does not depend on the opponent trying to punish; it's a property of the payoff matrix.
       - When: Address this when first introducing dominance (both pure and mixed). Emphasize that the opponent's payoffs are irrelevant for dominance (except that we need to consider the opponent's actions to compute the payoffs for the player in question).

     - **Misconception 2**: Treating the dominating mixture as something the player actually plays.
       - Clarify: The dominating mixed strategy is a proof tool. We are not saying the player will necessarily play that mixture, but we are saying that because the mixture does better, the dominated strategy is irrational. In the iterative process, we eliminate the dominated strategy because a rational player would never play it. Then we proceed.
       - When: When introducing the mixed strategy dominance and during the elimination step.

     - **Misconception 3**: Reading survival of the elimination as a licence to play the survivor.
       - Clarify: The elimination process removes strategies that are never rational. The surviving strategies are those that are rationalizable (i.e., they can be played if the player has a belief about the opponent that justifies it). However, without coordination, players might not land on a particular Nash equilibrium. But note: in this process, we ended up with a unique survivor. In general, if the process leads to a unique survivor, then it is the only rationalizable outcome and hence the only Nash (if a Nash exists). But if there are multiple survivors, then we have a set of rationalizable strategies, and we need to look for Nash within that set.
       - When: During the discussion of what survives and the solution concept.

  6. **Question for the Last 10 Minutes**
     - Task: Consider a different game (or a variation) to test understanding.

     - Example: Use the same game but with a twist? Or a new small game. Alternatively, ask them to find a mixed strategy that dominates a particular strategy in a new game.

     - Alternatively, pose: 
          "In the game below, is there a strictly dominated strategy? If so, find a mixed strategy that dominates it. Then, perform iterated elimination."

          Player 2
          L      R
      T (2,1) (0,0)
      M (0,0) (2,1)
      B (1,1) (1,1)

     - For Player 1: 
          - B gives (1,1). 
          - Consider a mixture of T and M: (p, 1-p, 0). 
          - Against L: 2p + 0(1-p) = 2p
          - Against R: 0p + 2(1-p) = 2(1-p)
          - We want: 2p>1 and 2(1-p)>1 -> p>0.5 and 1-p>0.5 -> p<0.5. Contradiction. 
          - So no mixed strategy of T and M can dominate B? 
          - But note: B is strictly dominated? Actually, it is not. Because against any fixed strategy of Player 2, B gives 1. But T gives 2 against L and 0 against R; M gives 0 against L and 2 against R. So if Player 2 plays L, T is better than B; if R, M is better. But no single strategy (pure or mixed) of Player 1 gives more than 1 in both cases? 
          - However, note that we are allowed to mix. The mixture (1/2 T and 1/2 M) gives:
              - Against L: 2*(1/2)=1
              - Against R: 2*(1/2)=1
          - So it equals B, but does not strictly dominate. Therefore, B is not strictly dominated.

     - Alternatively, we can use the original game and ask: 
          "Suppose we did not eliminate Bottom. Is there a mixed strategy for Player 2 that dominates Right? If so, find it. If not, why not?"

          For Player 2: 
              - Right: (0,0,5) [against Top, Middle, Bottom]
              - Left: (2,2,0)
              - We want a mixed strategy for Player 2? Actually, we are considering dominance for Player 2. 
              - Can we find a mixed strategy of Player 2 that strictly dominates Right? 
                  - A mixed strategy for Player 2 would be playing Left with probability q and Right with probability 1-q. 
                  - The payoffs for Player 2 against Player 1's strategies:
                      - Against Top: q*2 + (1-q)*0 = 2q
                      - Against Middle: q*2 + (1-q)*0 = 2q
                      - Against Bottom: q*0 + (1-q)*5 = 5(1-q)
                  - We want this to be > the payoff of Right in all cases. 
                      - For Top: 2q > 0 -> always true for q>0? But we require strict for every action of the opponent.
                      - For Middle: same.
                      - For Bottom: 5(1-q) > 5? -> 1-q>1 -> q<0 -> impossible.
              - So no mixed strategy of Player 2 can strictly dominate Right. And indeed, we saw that in the reduced game (without Bottom) we could eliminate Right by Left (pure). But with Bottom present, we cannot.

     - This illustrates that dominance is context dependent (on the set of strategies of the opponent that we consider). In the original game, Right is not dominated (because against Bottom it is very good). But after we remove Bottom (because it is dominated by a mixture of Top and Middle), then in the subgame without Bottom, Right becomes dominated by Left.

  7. **What to Leave Out**
     - Skip the separating hyperplane proof: yes, for an 80-minute recitation with first-year graduates, that is too much.
     - Skip common knowledge of rationality foundations: we can just assume rationality and that the structure of the game is common knowledge, without delving into the epistemic foundations.
     - Weak dominance and order-sensitivity: Mention that we are focusing on strict dominance because it is order-independent (the set of strategies eliminated does not depend on the order). For weak dominance, the order matters, and we are not covering that. 
     - For three or more players: Mention that in two-player games, we have a clean equivalence: a strategy is strictly dominated if and only if it is never a best response. But in games with three or more players, there can be strategies that are never a best response but are not strictly dominated. This is because the set of beliefs in multi-player games is over independent distributions (product distributions) while the dominating mixture can correlate the opponents' strategies? Actually, no: in the standard definition, mixed strategies are independent. But the set of best responses can be against correlated strategies of the opponents. So in two-player games, correlated and independent beliefs coincide (since there's only one opponent). But for three or more, if we allow correlated beliefs, then never a best response (against correlated beliefs) is equivalent to being strictly dominated by a mixed strategy. However, if we restrict to independent beliefs, then it is a weaker condition. We are not going into that. Just note that the equivalence breaks.

  8. **Verdict on the Game**
     - The game works well because:
          - It has no pure strategy dominance, so we must use mixed.
          - The dominated strategy (Bottom) is dominated by an equal mixture of Top and Middle, which is easy to compute and see.
          - The iterated elimination then proceeds naturally and leads to a unique outcome.
          - The game is small enough to handle in a recitation.

     - At the point of finding the dominating mixture, the students should be the ones to produce it (with guidance). Ask: "Can we mix Top and Middle to get a strategy that does better than Bottom in both cases?" Then lead them to set up the inequalities.

     - The features: 
