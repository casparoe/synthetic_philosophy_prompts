       - By Euler’s Theorem, if 1,000,009 were prime, \( 2^{1,000,008} \equiv 1 \mod 1,000,009 \).  
       - But since 293 divides 1,000,009, compute \( 2^{1,000,008} \mod 293 \) instead.  
       - First, simplify the exponent: \( 1,000,008 \mod 292 \) (since \( \phi(293) = 292 \)).  
       - \( 1,000,008 \div 292 = 3,424 \) with remainder \( 140 \) (i.e., \( 1,000,008 = 292 \times 3,424 + 140 \)).  
       - Thus, \( 2^{1,000,008} \equiv 2^{140} \mod 293 \).  
       - Now compute \( 2^{140} \mod 293 \). This requires 10 steps of modular exponentiation:  
