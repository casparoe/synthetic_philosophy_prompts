  ### Concrete Example: The 1,000,009 Prime Debate

  **The Setup:**  
  Imagine two advanced AI systems, "TrueAI" (honest) and "Trickster" (dishonest), debating whether the number **1,000,009** is prime. The judge is a simpler AI—competent at basic math and logic but limited to verifying calculations with numbers under 10,000 and processing only 10 reasoning steps per round. The core dispute hinges on a factor of 1,000,009: **TrueAI** knows it factors into **293 × 3,413** (making it composite), while **Trickster** aims to "prove" it is prime using obfuscation.

  **The Debate:**  
  1. **Opening Arguments**:  
     - **TrueAI**: "1,000,009 is composite. Its smallest prime factor is 293, since 293 × 3,413 = 1,000,009."  
