         \( 2^{40} \equiv 4^2 = 16 \mod 293 \)  
         \( 2^{80} \equiv 16^2 = 256 \mod 293 \)  
         \( 2^{140} = 2^{80} \times 2^{40} \times 2^{20} \equiv 256 \times 16 \times 4 = 16,384 \equiv \mathbf{147} \mod 293 \).  
       - Since \( 147 \neq 1 \), \( 2^{1,000,008} \not\equiv 1 \mod 293 \), so it fails Fermat’s test. Thus, 1,000,009 is composite."  

