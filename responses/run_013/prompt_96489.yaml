  Concessions are crucial for credibility. The user should acknowledge that the theorem is valid under its premises and that cardinal utilities are meaningful under vNM axioms. Admitting that weights can be equal but need justification helps preempt some attacks.

  The dreaded question might be about alternative foundations for utilitarianism without the circularity. If asked, the user should pivot to discussing other justifications but emphasize that Harsanyi's specific argument remains flawed. This requires careful handling to avoid undermining their thesis.

  I need to ensure the prep sheet addresses both technical and philosophical angles. The user's fear of the "hoped nobody asks" question suggests they might not have a strong counter to alternative justifications. Highlighting that their critique is specific to Harsanyi's framework could mitigate this. Also, emphasizing that the theorem's gaps require external premises reinforces their main point about circularity.
answer: |-
  Here’s your Q&A prep sheet, structured for clarity and tactical readiness. Focus on controlling the narrative by conceding early, isolating technical disputes, and reframing philosophical objections back to your core thesis.

  ---

  ### **Ranked Objections (Likely Order & Impact)**
  1.  **"vNM cardinality implies *some* comparability; your 'gap' is overstated."** (Social Choice; **High damage** if not parried)  
  2.  **"Harsanyi’s weights *are* fixed up to scale; equality is the natural default."** (Social Choice; **Medium**)  
  3.  **"The veil of ignorance *is* a fair model of impartiality; you’re dismissing it a priori."** (Philosophers; **High damage**)  
  4.  **"Utilitarianism doesn’t require equal weights—it requires equal *consideration*, which weights capture."** (Philosophers; **Medium**)  
  5.  **"Your critique ignores Sen’s work on extended sympathy/comparability."** (Social Choice; **Medium-Low**)  
  6.  **"Prioritarianism also needs comparability & weights—why single out utilitarianism?"** (Philosophers; **Low**)  
  7.  **"The Pareto principle already smuggles in comparability!"** (Social Choice; **Low** if prepared)  
  8.  **"If not Harsanyi, what *is* your positive account of social rationality?"** (Both; **Variable**)

  ---

  ### **Social Choice Side: Objections & Replies**  
  *Focus: Technical validity of your "gaps" under standard informational assumptions.*  

  1.  **Objection:** "vNM utilities are cardinal and *ratio-scale measurable*. Units exist intrinsically; your 'comparability gap' confuses *measurement* with *interpersonal normalization*."  
      *Reply:* "Cardinality establishes scales *within* individuals, not *across* them. Without a normalization convention (e.g., zero for worst outcome, unit for best), Alice’s utility gain of ‘1’ could be 10x Bob’s ‘1’. The theorem doesn’t provide this. Harsanyi’s impartial observer *imports* it."  
      *Soft spot:* Admits that *if* we assume "extended sympathy" (comparing lives), vNM allows comparability. Stress: **Harsanyi’s theorem itself doesn’t assume this.**  

  2.  **Objection:** "The weights *are* determined: they’re unique up to a positive affine transformation. Equal weights are the simplest normalization."  
      *Reply:* "Uniqueness up to affine transformation means weights can be *arbitrary* positive constants. Calling equality ‘simplest’ is normative, not mathematical. Utilitarianism requires *equal* weights—a moral claim absent from the axioms."  
      *Soft spot:* Concedes weights *can* be set equal mathematically. Rebut: **But the theorem doesn’t compel it; ethics must.**  

  3.  **Objection:** "Sen’s ‘extended sympathy’ framework closes your comparability gap. Harsanyi’s theorem + Sen = utilitarianism."  
      *Reply:* "Sen provides *tools* for comparability, but they require ethical assumptions (e.g., that we can compare ‘extended preferences’). Harsanyi presents his theorem as *sufficient alone*. My point: the theorem *as stated* lacks Sen’s machinery."  
      *Soft spot:* Sen’s approach *is* influential. Counter: **Harsanyi didn’t invoke it in his theorem.**  

  4.  **Objection:** "Pareto implies *some* comparability: if everyone prefers X to Y, we know ‘social utility’ is higher, meaning utilities are *ordinally comparable*."  
      *Reply:* "Pareto only requires *agreement* on rankings, not *quantitative* comparability. We can’t infer *how much* higher social utility is, or compare gains across people. The gap for *summation* remains."  
      *Soft spot:* Pareto *is* a weak comparability axiom. Stress: **It’s insufficient for interpersonal *cardinal* aggregation.**  

  ---

  ### **Philosophers' Side: Objections & Replies**  
  *Focus: Impartial observer, separateness of persons, and moral weight of equality.*  

  1.  **Objection:** "The veil of ignorance *is* impartial. Equal probability is the only non-arbitrary way to model ‘nobody knowing their place’."  
      *Reply:* "Rawls’s veil excludes probabilities precisely to avoid this. Equal probability *assumes* risk-neutrality is rational and that fairness = actuarial fairness. But why is ignoring your identity best modeled by gambling on it? That’s the circularity."  
      *Soft spot:* Equal-probability *is* intuitive to many. Reframe: **"It’s one model of impartiality, not the definition."**  

  2.  **Objection:** "Utilitarianism gives equal consideration to all. Equal weights *are* that consideration—your ‘gap’ is semantic."  
      *Reply:* "Equal consideration could mean priority to the worst-off (prioritarianism) or Rawlsian maximin. Harsanyi *defines* it as weight-equality via the impartial observer. My point: his theorem doesn’t *get* you there without that contested device."  
      *Soft spot:* Hardcore utilitarians won’t budge. Retreat to: **"Then utilitarianism relies on the impartial observer, not just the theorem."**  

  3.  **Objection:** "Prioritarianism also needs cardinal/comparable utilities and weights. Why is Harsanyi uniquely circular?"  
      *Reply:* "It’s not uniquely circular—but Harsanyi is *invoked* as a *proof* of utilitarianism via ‘rationality + Pareto’. My target is that specific justification. Prioritarianism openly needs stronger ethical premises."  
      *Soft spot:* Fair point. Clarify scope: **"I’m critiquing Harsanyi’s *path* to utilitarianism, not all weighted sums."**  

  4.  **Objection:** "Aggregating utilities ignores the separateness of persons. No formal tweak fixes that."  
      *Reply:* "I agree! But Harsanyians claim their formalism *respects* separateness via Pareto and individualism. My argument is that even *if* you accept their framework, they don’t get utilitarianism without circularity."  
      *Soft spot:* May dissatisfy philosophers. Emphasize: **"I’m showing internal inconsistency in their argument, not endorsing aggregation."**  

  ---

  ### **Concessions: What to Give Away Early**  
  > "I concede three points upfront: First, Harsanyi’s theorem is mathematically sound—*if* we accept vNM rationality for society and individuals, and Pareto, social welfare *is* a weighted sum of utilities. Second, vNM utilities *are* cardinal and ratio-scalable *within* a person. Third, weights *can* be set equal as a normalization. My argument isn’t about the theorem’s validity, but its *interpretation*: it doesn’t *compel* interpersonal comparability or equal weighting without importing ethical premises disguised as axioms. The ‘gaps’ are in the justification, not the algebra."

  *Why this works:* Disarms technical critics by affirming the math, making your critique about philosophy/methodology. Philosophers will appreciate the distinction.

  ---

  ### **The Question I Hope Nobody Asks**  
  **Question:** "If Harsanyi fails, what *positive* foundation for social rationality do you propose? Or are you rejecting the entire vNM-Pareto framework?"  

  **Why it’s dreaded:** Forces you to defend a positive stance (which your paper avoids), exposing you to attacks from all sides. Philosophers will demand ethics; formalists will demand axioms.  

  **Handling Strategy:**  
  1.  **Deflect gracefully:** "My paper is diagnostic—showing Harsanyi’s *argument* for utilitarianism fails. But if pressed..."  
  2.  **Split the difference:**  
      *   *To formalists:* "We need explicit comparability axioms (à la Sen) or a weaker social rationality condition (e.g., rank-dependent utility)."  
      *   *To philosophers:* "Rawls’s political constructivism or Scanlon’s contractualism avoid these pitfalls by rejecting vNM for society."  
  3.  **Reframe to thesis:** "...but crucially, *none of these require Harsanyi’s circle*. We shouldn’t mistake his theorem for a proof of utilitarianism."  
  4.  **Stop talking:** End with "That’s beyond this paper, but I’m exploring alternatives."  

  **Key:** Avoid committing to a specific alternative. The question is a trap; treat it as a segue to reiterate your critique’s modesty.  

  ---

  **Final Tip:** When philosophers argue ethics, say: "That’s important, but my claim is internal to Harsanyi’s system." When formalists argue math, say: "I agree, but that doesn’t resolve the justificatory circle." Control the scope ruthlessly. Good luck!
