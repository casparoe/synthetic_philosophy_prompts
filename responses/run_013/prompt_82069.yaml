prompt: |-
  A friend at an AI safety startup keeps saying Godel proves you can never have a fully self-verifying AI: any system strong enough to reason about its own proofs can't prove its own consistency, so you always need a human overseer outside the formal system. Can you explain what's actually going on here? I get that the second incompleteness theorem says that if PA is consistent, it can't prove its own consistency, but I'm fuzzy on why that's supposed to mean the system can't be trusted without an outside check, and whether the human overseer is really outside the system or just another formal system. Also, does the first theorem even apply if the system isn't recursivly axiomatizable, or if it's inconsistent? I want the real caveats, not the vague Godel shows reason has limits version.
reasoning: |-
