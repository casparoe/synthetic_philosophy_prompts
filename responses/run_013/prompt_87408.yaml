prompt: |-
  I never studied philosophy, so sorry if this is a dumb question, but this has been bugging me for weeks and my brother-in-law (he's a nurse) has stopped even wanting to talk about it. He told me about a patient at his hospital who died because nobody looked in on him for about six hours. Nobody did anything wrong in the sense of doing anything — no wrong drug, no botched procedure, nothing. He just wasn't checked on. And everyone there talks about it like the staff *caused* his death. But how can you cause something by not doing anything? When I think about cause and effect I think about a thing making another thing happen — a push, a spark, a pill going down a throat. If nothing happens, there isn't a thing there to do any causing, so "caused by not checking on him" sounds to me like "we think you should have checked on him" wearing a lab coat, i.e. a moral judgement dressed up as a fact about the world.

  He says I'm being silly and that of course you can cause stuff by not doing it. His example was that if you promise to water someone's plants and then don't, you caused them to die. That doesn't convince me either — the plants died because nobody watered them, which is a seperate fact, and the "you caused it" part is just tacked on afterwards because we're annoyed at you. My own version: I left a window open and my laptop got soaked in a storm, and everyone including me says I caused that, but again, the rain did the soaking. So my question is whether the whole idea of "causation by omission" is actually nonsense that survives only because we want someone to blame, and if so, whether that means a big chunk of ordinary blame and even law is built on nothing.

  But if it isn't nonsense — if an absence really can be a cause — then I'd like to understand how that's supposed to work, because I genuinely can't picture it. Is my window case the same kind of thing as the nurse case, or is there something different going on between them that I'm not seeing? And I suppose the thing I really want to know is whether I'm wrong to think that if omissions can't cause anything, then nobody can be held responsible for what they don't do, or whether that's a leap I'm making that doesn't actually follow. Take it slow with me, I don't know the vocabulary for any of this.
reasoning: |-
  Okay, this user is wrestling with a deep philosophical concept—causation by omission—and they're clearly frustrated after being dismissed by their brother-in-law. The hospital case is haunting them because it clashes with their intuitive view of causation as active forces (pushes, sparks). Their core question has two layers: is "omission as cause" logically coherent, and if not, does that undermine moral/judicial blame?

  First, I need to validate their struggle—this is NOT a dumb question. Philosophers like Hume and legal theorists have fought over this for centuries. Their window example shows they're already engaging in counterfactual reasoning (if I'd closed it...), which is key. They’re also hinting at meta-concerns: is blame just emotional scapegoating dressed as causality?

  Breaking it down:  
  Their intuition isn't wrong—omissions lack physical "oomph." Rain soaked the laptop, not the open window per se. But where they see a binary (either active cause or nothing), philosophy offers gradations. I should emphasize dependence theories: "Staff didn’t check" is a cause because the death counterfactually depended on that inaction. Without the rain, the open window wouldn’t matter; without the staff’s omission, the patient might’ve lived. That dependence creates causal relevance.

  The plant example is weaker—plants might die anyway—but the nurse case is stronger because hospital protocols create expectations. That’s why I’ll distinguish "but-for cause" (necessary factor) from "proximate cause" (blameworthy link in the chain). Their brother-in-law might be conflating moral responsibility with causal mechanics, which is exactly the user’s suspicion.

  Biggest challenge: explaining why moral blame doesn’t require literal physical causation. The laptop case is self-blame for poor stewardship, not creating rain. Similarly, the hospital’s duty transforms omission into culpable cause. User’s leap ("if omissions aren’t causes, no responsibility for inaction") is understandable but flawed—law/ethics often hold us accountable for failing duties even without magical "absence causation."

  Should avoid jargon but introduce terms like "counterfactual" gently. Stress that both sides have points: omissions aren’t causes like billiard balls, but in contexts of duty, they function as causes for responsibility purposes. Their frustration with "lab coat morality" is perceptive—sometimes it IS about blame—but that doesn’t make it invalid.
answer: |-
  No question is "dumb" when it digs this deep into ethics and metaphysics—you're wrestling with a problem philosophers have fought over for centuries (causation by omission). Your intuition isn’t silly; it’s sharp. Let’s break it down step by step.

  ---

  ### **1. The Heart of Your Confusion: "Can Nothing Cause Something?"**
  Your core point is logical: Causes seem to require *action*. A billiard ball moves because another ball *hits* it. How can the *absence* of action—like not checking on a patient—be a "cause"? Philosophers call this the **problem of negative causation**. Here’s why it’s messy:

  - **Physical Causation vs. Moral/Legal Causation**:  
    In pure physics, omissions don’t transfer energy or force. The rain *physically* soaked your laptop, not the open window. The patient died from their untreated condition, not from a nurse’s absence.  
    But in ethics/law, we care about **dependence** and **responsibility**. We ask: *Would the outcome have happened **but for** this omission?* If the answer is "no," we treat the omission as a cause.  

    → *Example*: If checking the patient every 2 hours was protocol, and death would’ve been prevented with timely care, the omission *depends* on the death. Without it, the death might not have occurred. That’s "causal dependence."

  ---

  ### **2. Why We Blame Omissions: It’s About Expectations**  
  Your brother-in-law’s plant example *feels* like "causation" because of **broken obligations**. This isn’t magic—it’s social reality:  

  - **Duty Creates Causation**:  
    If you *promised* to water the plants, you created an expectation. Your inaction isn’t just "nothing"; it’s a **failure to fulfill a duty**. The plants died *because* you broke that duty.  
    Similarly, nurses have a **duty of care**. By not checking the patient, they failed to intervene in a system designed to prevent harm. The hospital *caused* the death by neglecting its role as a safeguard.  

  - **Your Laptop Example**:  
    You "caused" the damage not by creating rain, but by **failing to mitigate a known risk**. Leaving the window open during a storm is an *action* (creating vulnerability), but the *cause* of damage is the rain + your failure to close it. Your responsibility stems from foreseeability and control.  

  ---

  ### **3. Is "Causation by Omission" Just Blame in Disguise?**  
  You’re onto something profound. Philosophers like **David Hume** argued all causation is just patterns we observe—not a "force" in the world. When we say "omission caused harm," we’re often making a **moral or legal judgment**, not describing physics.  

  **But here’s the catch**: Moral and legal systems *need* omissions to count as causes. Otherwise:  
  - Parents couldn’t be charged for starving a child ("I didn’t *do* anything—the malnutrition killed them!").  
  - You couldn’t sue a contractor who never builds your house ("He didn’t *cause* your homelessness!").  

  So yes, **blame is baked into the concept**—but that doesn’t make it "nonsense." It reflects how humans assign responsibility in a world of duties and risks.

  ---

  ### **4. Key Differences Between Your Examples**  
  | Case | Why Omission "Causes" | What Makes It Blameworthy |
  |------|------------------------|---------------------------|
  | **Hospital Patient** | System failure + professional duty | Nurses *should have* checked; death was preventable |
  | **Your Laptop** | Avoidable negligence | You *could have* closed the window; risk was obvious |
  | **Plants (Brother-in-law)** | Broken promise | You created reliance, then failed to act |

  The hospital case is stronger because:  
  - Medical staff have **explicit duties** (unlike a casual plant promise).  
  - Harm was **foreseeable and immediate** (unlike plants dying slowly).  
  - Society invests hospitals with **life-preserving authority**.

  ---

  ### **5. The Big Picture: Responsibility ≠ Physics**  
  **You asked**: *"If omissions can’t cause anything, can we hold people responsible for what they don’t do?"*  
  → **Yes, absolutely.** Responsibility isn’t about physics; it’s about:  
  - **Duty** (e.g., parental, professional, contractual).  
  - **Control** (you *could* have acted).  
  - **Foreseeability** (you *should* have known the risk).  

  **The law agrees**: In criminal law, "omission liability" exists for failures to act when there’s a duty (e.g., not feeding a child). In tort law, "negligence" often involves omissions (e.g., not fixing a dangerous stair).

  ---

  ### **Conclusion: You’re Half Right (And That’s Deep)**  
  - **Your instinct is correct**: Omissions aren’t physical causes. Calling them "causes" *is* a way to assign blame.  
  - **But it’s not arbitrary**: When duties exist, omissions *enable* harm counterfactually ("but for" the omission, harm wouldn’t occur).  
  - **The hospital case is valid**: By not checking the patient, staff failed a duty that *made the death possible*. That’s causal enough for moral and legal blame.  

  This isn’t lab-coat logic—it’s the logic of human interdependence. We hold people accountable for inaction because society collapses if we don’t. Your question isn’t naive; it’s philosophy at its grittiest. If you read one thing, try **Helen Beebee** on causation or **Stephen Morse** on omission liability in law. And tell your brother-in-law that nurses debate this too—it’s why "duty of care" is drilled into their training.
