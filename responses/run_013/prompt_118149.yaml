  ### Decision Tree: Standing to Blame  
  **Instructions:** Answer each question based on concrete judgments about the cases. Proceed down the branch matching your answer. Cases referenced are defined at the start.  

  **Key Cases:**  
  - **Same-Wrong Friend**: Blames you for an act she committed herself a year ago (unrepentant).  
  - **Different-Wrong**: Blames you for an act but committed a different, equally bad wrong (unrepentant).  
  - **Reformed**: Blames you for an act she committed and repented of a year ago.  
  - **Co-Conspirator**: Encouraged your act but now condemns it.  
  - **Busybody Stranger**: Blames you with no relationship to you or affected parties.  
  - **Benefits**: Profits from a practice but tells you not to engage in it.  
  - **Forgave Other**: Forgave someone else for the same wrong but won’t forgive you.  
  - **Not Blaming**: Insists she’s "only describing" your act, not blaming.  

  ---

  #### Node 1: **Busybody Stranger** blames you. Is this blame *in principle invalid* (e.g., not "real" blame) due to their lack of connection?  
  - **Yes** (Standing requires relational context) → Node 2.  
  - **No** (Stranger can genuinely blame) → Node 3.  

  #### Node 2: **Same-Wrong Friend** blames you. Does your relationship *override* her past wrong, making her blame valid?  
  - **Yes** (Relationship restores standing) → **Leaf: Relational Standing**.  
    - *Awkward commitment:* Allows your friend to blame you for X while a stranger cannot, even for identical X.  
  - **No** (Past wrong voids standing) → **Leaf: Hypocrisy Fully Defeats Standing**.  
    - *Awkward commitment:* Lets blameworthy off the hook if only a hypocrite calls them out.  

  #### Node 3: **Same-Wrong Friend** blames you. Is her blame *void* (not blame at all) due to her past act?  
  - **Yes** (Hypocrisy invalidates blame) → Node 4.  
  - **No** (Blame is still genuine) → Node 5.  

  #### Node 4: **Reformed** blames you. Is her blame *void* due to her past act?  
  - **Yes** (Past wrong permanently voids standing) → **Unoccupied!**  
    - *Diagnosis:* Unattractive—reformed individuals couldn’t hold others accountable.  
  - **No** (Reformation restores standing) → **Leaf: Hypocrisy Fully Defeats Standing**.  
    - *Awkward commitment:* Lets blameworthy off the hook if only a hypocrite calls them out.  

  #### Node 5: **Not Blaming** (only "describing"). Does this *avoid* standing issues entirely?  
  - **Yes** (Standing attaches to *act* of blaming, not facts) → Node 6.  
  - **No** (Standing applies even to descriptions) → **Leaf: Standing Is Relational** (from Node 2).  
    - *Note:* Collapses into Relational Standing, as both tie standing to relationships.  

  #### Node 6: **Same-Wrong Friend** blames you. Does her record make the blame *less weighty* (e.g., less persuasive)?  
  - **Yes** (Hypocrisy reduces blame’s force) → **Leaf: Hypocrisy Never Defeats Standing (Scalar)**.  
    - *Awkward commitment:* Fails to explain why hypocrisy feels like a silencing "tu quoque."  
  - **No** (Blame’s weight unchanged) → Node 7.  

  #### Node 7: **Co-Conspirator** blames you. Does her encouragement *invalidate* her blame?  
  - **Yes** (Complicity voids standing) → **Leaf: Two-Track View**.  
    - *Awkward commitment:* Hypocrite knows your wrong but can’t express blame; others can.  
  - **No** (Encouragement irrelevant) → **Leaf: Standing-Talk Deflated**.  
    - *Awkward commitment:* Dismisses "standing" as confused—only facts and norms matter.  

  ---

  ### Self-Blame Addendum  
  For all positions, consider: **Can you blame yourself if you’ve hypocritically blamed others for the same act?**  
  - **Hypocrisy Fully Defeats**: Self-blame is incoherent (you lack standing toward yourself).  
  - **Scalar/Two-Track/Relational**: Self-blame is coherent (standing isn’t self-defeating).  
  - **Deflated/Unoccupied**: Self-blame is just factual self-assessment.  

  ---

  ### Tree Summary  
  - **Nodes**: 7 (meets 8–12 constraint).  
  - **Leaves**: 6 (meets 6–8 constraint).  
  - **Key Overlaps**:  
    - "Relational Standing" and "Hypocrisy Fully Defeats" are distinct; the former depends on relationships, the latter on hypocrisy.  
    - "Standing Is Relational" (Node 2) and "Standing-Talk Deflated" (Node 7) cover similar ground but diverge on whether relationships matter.  
  - **Unoccupied Branches**:  
    - Past wrong permanently voiding standing (Node 4): Unattractive, as it bars reformed individuals from blaming.  
    - "Relational + No Override" (Node 2): No theorist holds this hybrid (requires relationship + clean record).  

