answer: |-
  Here’s a structured two-page research proposal addressing your concerns, refining your core insight, and defining a tractable project for six months of part-time work. The focus is on **cutting through equivocation by testing whether computational explanations of the brain require a specific causal constraint to avoid triviality**.

  ---

  ### **Research Proposal: When Is a Computational Explanation Non-Trivial? Testing a Causal Constraint for Neural Computation**  
  **Fellowship Duration:** 6 months (part-time)  
  **Core Question:** *Under what conditions does describing the brain as "computing" a function provide a substantive (non-trivial) explanation of cognition, rather than a vacuous redescription?*  

  #### **1. The Problem: Equivocation and Triviality in the "Brain as Computer" Debate**  
  The debate is fractured into three unsatisfying positions:  
  - **Trivial computationalism (Camp A):** If "computer" means *anything that instantiates some function* (e.g., rocks computing XOR under contrived mappings), the claim is true but explanatorily empty.  
  - **Architectural literalism (Camp B):** If "computer" requires *von Neumann architecture* (stored programs, digital logic), the claim is false but irrelevant—brains need not resemble laptops to compute meaningfully.  
  - **Explanatory instrumentalism (Camp C):** If "computation" is *only an explanatory stance* (à la Dennett), it risks triviality: any system can be "interpreted" as computing anything, making the stance optional and non-explanatory.  

  **The gap:** None address **when computational descriptions are *uniquely justified* by a system’s causal structure**. Your constraint—that computations must map robustly to a system’s intrinsic causal organization—promises to rescue (C) from triviality. But is this constraint sufficient? Is it novel, or does it collapse into existing mechanistic accounts? This project **tests whether your constraint delineates a substantive, non-arbitrary form of computational explanation**.  

  #### **2. Research Question & Hypothesis**  
  - **Question:** *Does requiring a robust causal mapping between a physical system and a computational description prevent triviality, and if so, does the brain satisfy this requirement for cognitive functions?*  
  - **Hypothesis:** A computational explanation is non-trivial **only if** (1) the system’s causal components map systematically to computational operations *without arbitrary observer choices*, and (2) this mapping persists under *small physical perturbations* (e.g., neural noise, lesions). Trivial cases (rocks) fail (1) and (2); brains will satisfy both for key functions (e.g., perceptual processing).  

  #### **3. Why Existing Camps Don’t Resolve This**  
  - **Camp A** ignores implementation constraints, allowing arbitrary mappings.  
  - **Camp B** conflates implementation with a specific *type* of computer.  
  - **Camp C** (instrumentalism) treats computation as observer-relative, denying objective criteria for "correct" mappings.  
  **Your advance:** By demanding a *causal-robustness filter*, you force a testable distinction: *Is the brain a computer in a sense stronger than (A/C) but weaker than (B)?* This moves beyond verbal disputes by anchoring "computation" to physical resilience.  

  #### **4. Method: Case Study Analysis with Perturbation Modeling**  
  Avoid literature deep-dives; focus on concrete comparative analysis:  
  - **Step 1: Define criteria for "robust causal mapping"**  
    - *Causal mapping:* Components (e.g., neurons) must correspond to computational operations (e.g., activation functions) in a *non-arbitrary* way (e.g., based on counterfactual dependencies).  
    - *Robustness:* The mapping must survive "noise" (e.g., stochastic firing). Formalize using perturbation models (e.g., vary input/spiking parameters and check if outputs track computational predictions).  
  - **Step 2: Apply criteria to 3 case studies (6 weeks each)**  
    1. **Trivial system:** E.g., a rock "computing" a function via externally imposed labels.  
       - *Test:* Does *any* perturbation break the mapping? (Yes → trivial.)  
    2. **Non-biological computer:** E.g., an analog circuit (non-digital but clearly computational).  
       - *Test:* Does perturbation degrade performance *predictably* per computational model? (Yes → non-trivial.)  
    3. **Neural system:** E.g., retinal ganglion cells (well-studied, simple "computation" like edge detection).  
       - *Test:* Do neural responses under noise/lesions align with computational models (e.g., receptive fields)?  
  - **Step 3: Evaluate philosophical implications**  
    - Does success/failure in Case 3 support computationalism as an *ontological claim* (the brain intrinsically computes) or *epistemic guidance* (computation is optimal modeling)? Is the distinction meaningful?  

  **Why this method?** It shifts from abstract debates to *testing your constraint* against real systems. Perturbation analysis is feasible (using published data/simulations) and avoids implementation theory’s circularity.  

  #### **5. Outcomes: Success vs. Failure**  
  - **Positive result:** Your constraint cleanly separates trivial from non-trivial cases. For neural systems:  
    - Robust mappings exist for low-level functions (e.g., perception), supporting non-trivial computationalism.  
    - Mappings break for higher cognition, suggesting limits.  
    → **Conclusion:** Computationalism is substantive *only when* causal-robustness holds.  
  - **Negative result:**  
    - The constraint fails (e.g., trivial systems pass, neural systems fail unpredictably).  
    - OR robustness is always observer-dependent (collapsing into instrumentalism).  
    → **Conclusion:** The debate *is* verbal; computational explanations are modeling tools, not ontological claims.  
  - **Middle ground:** Robustness holds for simple neural computations but requires augmenting (e.g., with teleological or dynamical criteria).  

  #### **6. Scope & Feasibility**  
  - **Realistic for 6 months part-time?** **Yes**, with strict boundaries:  
    - **Focus on 1–2 neural case studies** (e.g., retina + one cortical area). Skip complex cognition.  
    - **Use existing data/models** (e.g., neural datasets from UCL/CRCNS; simulate perturbations via Python).  
    - **Limit philosophy:** Ground criteria in mechanistic philosophy (e.g., Craver, Piccinini) but avoid exegesis.  
  - **If cutting:** Drop the non-biological case study (Step 2.2) or narrow neural cases to one (e.g., retina only).  

  #### **7. Why This Matters**  
  Resolves the debate’s core frustration by defining a *falsifiable standard* for when "computation" explains rather than redescribes. Success would redeem computationalism as a substantive thesis; failure would clarify its limits. Either outcome advances the discourse beyond definitional stalemates.  

  ---  
  **Next steps:** Start with retinal edge detection (simple, data-rich) to pilot your robustness criteria. I’ll source key neuroscience/philosophy references for your bibliography.
