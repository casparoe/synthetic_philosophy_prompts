  For a six-month part-time scope, focusing on a few case studies is manageable. They can start with one trivial and one non-trivial case, then a brain-related example. If time runs short, they can skip the third case or narrow the comparison.

  Success would be identifying criteria that separate explanatory from trivial computations, showing when computationalism is substantive. Failure would be if all cases reduce to modeling practices without ontological commitment, or if the robustness constraint doesn't hold.

