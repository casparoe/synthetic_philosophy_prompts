prompt: |-
  You are grading a midterm in an undergraduate comparative-politics course. The exam question and one student's answer appear below. Grade the answer and give the comments that justify the grade.

  Exam question: The fictional Republic of Valdoria has the following constitutional provisions. (a) A president is directly elected for a fixed five-year term and appoints and dismisses the prime minister. (b) The prime minister and cabinet must retain the confidence of the unicameral Assembly; the Assembly can remove the government only by a constructive vote of no confidence that names a successor. (c) The president may dissolve the Assembly only after two failed constructive votes within a year. Classify the regime and assess its expected stability relative to a textbook presidential system and a textbook parliamentary system. Use the course handout's three functions — authorization (how office is conferred), sustainment (what keeps an officeholder in place between elections), and removal (how an officeholder is ousted early) — and state which function does the most work in distinguishing the two textbook types. The handout argued that the textbook contrast turns primarily on whether sustainment and removal are fused with the legislative majority.

  Student answer: Valdoria is best classified as a presidential system. The directly elected president with a fixed five-year term is the defining feature of presidentialism, since the president's mandate comes straight from the voters rather than from the Assembly. Because the president both appoints and dismisses the prime minister, the government is accountable to the president and not to the legislature, so the sustainment function operates vertically rather than through parliamentary confidence. The constructive vote of no confidence is the one parliamentary holdover, but it makes removal easier than in a textbook parliamentary system: requiring the Assembly to name a successor simply means it can replace the government whenever a majority prefers any alternative, so the government is more vulnerable, not less. This is presumably why the constitution adds the dissolution check after two failed votes — the framers worried that an unstable Assembly would churn through governments. Relative to a textbook parliamentary system, Valdoria trades legislative responsiveness for executive stability; relative to a textbook presidential system, it is less stable because the prime minister can be removed mid-term without the president leaving office. On the handout's three functions, removal does the most work in distinguishing the two textbook types, since the fixed presidential term is just a special case of how office is authorized.

  Deliverable: assign a grade, then give a point-by-point assessment. For each part of the answer, say whether it is correct, incorrect, or unsupported, identify any conflation, misreading, or step that does not follow, and note how much each point should move the grade. Do not substitute a general impression for the specific comments. Keep the whole response under 400 words.
reasoning: |-
  Hmm, the user wants me to grade a student's answer in a comparative politics course. I need to evaluate how well the student classified Valdoria's political system and analyzed its stability using the three functions from their course handout: authorization, sustainment, and removal.

  Looking at the student's answer, they've classified Valdoria as presidential based on the directly elected president with a fixed term. This is partially correct since direct election is indeed a key presidential feature. However, they incorrectly claim that the government is accountable only to the president. The constructive vote of no confidence actually makes the government accountable to the legislature - a parliamentary characteristic. 

  The student's analysis of the constructive vote is problematic. They think it makes removal easier than in parliamentary systems, but actually it's designed to be harder by requiring an alternative majority. Their point about dissolution being a check on instability shows good reasoning but doesn't correct the misclassification. 

  When comparing stability, the student makes valid points about Valdoria being less stable than presidential systems due to PM removal, but they incorrectly claim it trades legislative responsiveness for executive stability relative to parliamentary systems. In reality, semi-presidential systems often have more executive instability than parliamentary ones.

  The student correctly identifies removal as the key distinguishing function between presidential and parliamentary systems, which aligns with the handout's argument that sustainment and removal fused with the legislative majority is the critical factor.

  For grading, I need to be specific about each component. The classification is incorrect (-2 points), the CVNC analysis is flawed (-1.5 points), the dissolution point is insightful (+0.5 points), the stability comparisons are partially correct (+0.5 for presidential contrast, -0.5 for parliamentary), and the functional analysis is correct (+1 point). That totals to 2 points out of 5, which is a D grade.

  I'll make sure to provide a clear point-by-point assessment in my response, explaining exactly where the student went wrong and what they got right, while staying under the 400-word limit.
answer: |-
  **Grade: D (2/5 points)**  

  **Point-by-Point Assessment:**  
  1. **Classification (Incorrect, –2 pts):**  
     The student labels Valdoria "presidential" but overlooks the hybrid nature. The PM/cabinet’s dependence on Assembly confidence (via constructive no-confidence) is a core *parliamentary* feature. The system is semi-presidential (dual executive).  

  2. **Sustainment Analysis (Incorrect, –0.5 pts):**  
     Claims the government is sustained by the president alone, not the legislature. This is false: The PM/cabinet requires ongoing Assembly confidence (sustainment fused with legislature), a parliamentary trait.  

  3. **Constructive Vote of No Confidence (CVNC) (Unsupported/Incorrect, –1.5 pts):**  
     Misreads the CVNC’s effect. Requiring a named successor *raises the threshold* for removal (it prevents simple majorities from toppling governments without consensus), making removal *harder*, not easier. The dissolution safeguard after two failed votes reinforces this stability intent.  

  4. **Stability Comparisons (Mixed, ±0 pts):**  
     - *Presidential comparison:* Correct that PM removal mid-term adds instability (–0.5 pts for missing instability from dual accountability).  
     - *Parliamentary comparison:* Flawed claim that Valdoria trades "responsiveness for stability." The CVNC and dissolution rules aim to *enhance* stability vs. pure parliamentary systems (+0.5 pts for noting dissolution as a check).  

  5. **Distinguishing Function (Correct, +1 pt):**  
     Accurately notes removal (alongside sustainment) as the key function separating presidential/parliamentary systems, per the handout.  

  **Justification:** The answer fundamentally misclassifies the regime (semi-presidential ≠ presidential) and misinterprets core mechanics (CVNC, sustainment). While it identifies the handout’s focus on removal/sustainment fusion and offers partial stability insights, critical errors dominate.  

  **Breakdown:**  
  - Incorrect classification/core analysis: –2 pts  
  - Misreading CVNC/sustainment: –2 pts  
  - Partial credit stability/comparisons: +0.5 pts  
  - Correct function distinction: +1 pt  
  **Total: 2/5**
