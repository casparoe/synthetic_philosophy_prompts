prompt: |-
  Here's a tension I keep noticing in rationalist and quant-investing writing. The same people who will tell you that the only coherent theory of choice is expected-utility maximization will also tell you to bet a fixed fraction of your bankroll — full Kelly, or more often half — and to judge a strategy by the rate at which it compounds over a long sequence of bets, treating "go all in on this positive-EV gamble" as obviously wrong. Sometimes Kelly is presented as a theorem of expected utility, just with log wealth plugged in; sometimes it's presented as a rival to expected utility, a matter of time-average rather than ensemble-average growth. What philosophical commitments does the practice of Kelly sizing actually presuppose? Does it require the claim that wealth has logarithmic value, or can a risk-averse utility function of any shape generate the same advice? Does it presuppose that the right unit of rationality is a single agent living through a long sequence of bets rather than an ensemble of agents each facing the bet once — and is the practice committed to that picture, or merely well-suited to it? And if we swapped out the presupposed view for straight expected-value maximization, what concretely would have to change about how these people size bets and what they count as a good decision?
reasoning: |-
  Okay, the user is grappling with a tension they've noticed in rationalist and quant-investing circles. They point out that the same people who advocate for expected utility maximization also recommend Kelly betting, which seems contradictory. Let me unpack this.

  First, I need to recall the core principles of expected utility theory (EUT). EUT says that rational agents maximize the expected value of their utility function. The utility function can be any shape, reflecting risk preferences. But Kelly betting suggests always betting a fixed fraction of your bankroll, often using log utility. So why do proponents of EUT push Kelly?

  The user mentions Kelly being presented both as a theorem under log utility and as a rival to EUT focusing on time-average growth. That duality is key. When using log utility, Kelly is just EUT applied to a specific function. But in practice, Kelly is often promoted independently, emphasizing long-term growth over single-bet outcomes. This seems like a philosophical shift.

  The user's questions focus on the commitments behind Kelly sizing. They want to know if it requires assuming logarithmic utility or if other risk-averse functions could work. Also, they're asking about the agent's perspective: is Kelly tied to a single agent over time versus an ensemble facing one bet each? And what changes if we switch to pure expected value?

  First, Kelly under log utility is a special case of EUT. But the practice often ignores other utility functions. The fixed fraction advice (like half-Kelly) assumes log utility implicitly. But could other utility functions lead to fractional Kelly? Maybe, but it's not straightforward.

  The time perspective is crucial. Kelly optimizes the geometric growth rate, which matters for repeated bets. An ensemble approach might prefer maximizing median outcome or some other metric. The user is hinting at a deeper philosophical divide: repeated vs. one-shot scenarios.

  If we switch to pure expected value (linear utility), bet sizing would be all-in on any positive EV bet. But that risks ruin. Quant investors avoid ruin, hence fractional Kelly. The user wants to know the practical changes: sizing would be more aggressive, and risk of ruin would be higher. Also, evaluating strategies would focus on averages rather than compounded growth.

  The user's identity might be someone in quant investing or rationalist circles, seeing this inconsistency. Their deeper need is likely reconciling theory with practice. They might be seeking a coherent framework that justifies common practices without contradiction. They might also be interested in defending or critiquing Kelly betting philosophically.

  I should address both the technical aspects (utility functions, risk aversion) and the philosophical commitments (temporal vs. ensemble perspectives). Emphasize that Kelly's practical use often assumes log utility implicitly, even when presented as separate. Highlight how shifting to EV changes outcomes and risk. Also, note that the ensemble perspective could lead to different strategies, like prioritizing median outcomes over growth rates.
answer: |-
  The tension you're highlighting cuts to the core of decision theory, risk management, and the practical philosophy behind quant investing. Let's dissect the commitments and implications of Kelly sizing:

  **1. Philosophical Commitments of Kelly Sizing:**
      *   **Primacy of Long-Term Compounding:** Kelly fundamentally presupposes that the *primary objective* is maximizing the long-term growth rate of capital. It prioritizes the geometric mean return over the arithmetic mean. This implicitly assumes:
          *   **Repeated Bets:** The agent faces a long, potentially infinite sequence of similar, independent investment opportunities.
          *   **Survival and Avoidance of Ruin:** Going bankrupt (ruin) is catastrophic and unacceptable, as it terminates the sequence and eliminates future compounding. Protecting against drawdowns is paramount.
          *   **Capital as Fuel:** Wealth isn't just a score; it's the fuel for future investment. Betting too large risks destroying the engine; betting too small underutilizes it.
      *   **The "Time-Average" Perspective:** Kelly proponents often implicitly or explicitly adopt the perspective of a *single agent living through time*, experiencing the sequence of outcomes sequentially. The relevant metric is the *realized* growth rate along the specific path taken. This contrasts with the "ensemble-average" perspective favored by pure EV maximization, which considers the *average outcome* across many parallel universes where the bet is made once.
      *   **Utility is Log(Wealth):** While Kelly can be *derived* as the optimal strategy for maximizing the expected value of log(wealth), its widespread practical use often *presupposes* that log(wealth) is a reasonable or even canonical utility function for investors focused on long-term capital growth. It encodes extreme risk aversion concerning the *loss of existing capital* relative to the attraction of gains.

  **2. Does Kelly Require Log Utility?**
      *   **Direct Derivation:** Yes, the original Kelly criterion is the solution to maximizing *E[log(W)]*.
      *   **Can Other Risk-Averse Utilities Generate Similar Advice?**
          *   **Fractional Kelly:** This is key. A risk-averse utility function *other* than log (e.g., U(W) = W^(1-γ)/(1-γ) for γ > 0, i.e., CRRA with γ ≠ 1) will generally prescribe betting a *fraction* of the full Kelly stake. For example, half-Kelly is often recommended and is approximately optimal for U(W) = sqrt(W) (γ=0.5) or for someone slightly *more* risk-averse than log utility (γ > 1).
          *   **Qualitative Similarity, Not Identity:** While other CRRA utilities lead to fixed fractional betting, the *exact fraction* depends on the specific γ and the gamble's characteristics. The *practice* of using a fixed fraction (like 1/2 or 1/4 Kelly) *assumes* that the investor's risk aversion is reasonably captured by a CRRA utility where that fraction is appropriate *and* that this fraction provides a sufficient "margin of safety" against estimation errors and model risk.
          *   **Non-CRRA Utilities:** Utilities with different risk profiles (e.g., CARA, loss aversion) generally do *not* lead to fixed fractional betting. The optimal bet size might depend explicitly on current wealth or have different characteristics. Kelly/fractional Kelly is most naturally aligned with CRRA utilities.

  **3. The Unit of Rationality: Sequence vs. Ensemble**
      *   **Kelly Presupposes the Sequence:** Kelly sizing is fundamentally committed to the perspective of a single agent facing a sequence of repeated, independent bets. Its optimality is defined in terms of the asymptotic (long-run) growth rate *over that sequence*. Ruin is a terminal event within this sequence.
      *   **Ensemble Perspective:** An ensemble view (many agents, one bet each) cares about the *distribution* of outcomes after that single bet. Pure EV maximization (linear utility) is rational here: you maximize the average outcome across the ensemble. Ruin for some agents is just part of the distribution; it's not "terminal" for the decision-making process itself, which happens once. Kelly's aversion to large bets looks excessively conservative from this perspective.
      *   **Practice Suited to Sequence:** Quant investing and rationalist writing often focus on *ongoing strategies* (algorithmic trading, repeated venture bets, lifelong investing). The sequence perspective is the natural and practically relevant one. Kelly is not merely "well-suited" to it; it is *defined* for it. Recommending Kelly implicitly rejects the ensemble view as the relevant frame for evaluating ongoing investment strategies.

  **4. Swapping to Pure EV Maximization: Concrete Changes**
  If these communities adopted strict linear utility (U(W) = W) and pure EV maximization:

  *   **Bet Sizing:**
      *   **All-In on +EV:** Any bet with a positive expected value (EV > 0), no matter how small the edge or how high the risk of ruin, would justify betting the *entire bankroll*. Fractional betting would be seen as irrational under-participation.
      *   **No Kelly Calculation:** The concept of an "optimal fraction" based on edge and odds would vanish. The only question would be "Is EV > 0?" If yes, bet everything.
      *   **No Risk of Ruin Consideration:** The possibility of losing the entire bankroll and being unable to bet again would be irrelevant. The ensemble average justifies the action, even if ruin occurs frequently in individual instances.

  *   **Judging Strategies:**
      *   **Arithmetic Mean Reigns:** The sole metric for evaluating a strategy would be its expected value (arithmetic mean return) per bet or per unit time. Geometric mean growth rate would be irrelevant.
      *   **"Good Decisions" Redefined:** A decision would be "good" solely if it had positive EV. Betting everything on a 51% coin flip would be the *optimal* rational choice. Betting only half your bankroll would be seen as leaving money on the table. A strategy that had a 99% chance of going bust by year 2 but a 1% chance of a 10,000x return could be considered vastly superior to a strategy with steady 5% geometric growth, as long as its EV was higher.
      *   **Survival Irrelevant:** Strategies with high probabilities of rapid ruin but extremely high payoffs if they survive the early stages would dominate rankings based on EV. Long-term survival wouldn't be a goal or metric.

  *   **Practical Consequences:**
      *   **Extreme Volatility & Frequent Ruin:** Portfolios would exhibit massive volatility. Individual investors and funds would blow up with high frequency.
      *   **Capital Destruction:** Aggregate capital allocated to investing would likely be destroyed much faster due to frequent ruin events.
      *   **Abandonment of Risk Management:** Concepts like position sizing, drawdown limits, and Kelly's focus on avoiding overbetting would be discarded as irrational constraints preventing the capture of full EV.
      *   **Shift in "Edge" Focus:** The emphasis would shift even more intensely towards finding *any* +EV opportunity, however risky, rather than carefully sizing bets based on the *quality* (edge relative to risk) of the opportunity.

  **Resolving the Tension: A Synthesis**

  The apparent tension arises because the *theory* (EUT) is broad, while the *practice* (Kelly/fractional Kelly) reflects specific commitments within that framework suitable for the domain:

  1.  **EUT as the Foundation:** Kelly is *not* fundamentally a rival to EUT. It *is* EUT applied with the specific utility function U(W) = log(W).
  2.  **Practical Choice of Utility:** The widespread recommendation of Kelly (or fractional Kelly) represents a practical judgment that log utility (or a slightly more risk-averse CRRA utility) is the most appropriate for the goal of *long-term capital growth through repeated investment*. It encodes the critical priorities of survival and geometric compounding.
  3.  **Rejection of Linear Utility:** Recommending Kelly inherently involves rejecting linear utility (pure EV maximization) as a suitable model for *ongoing investment decisions*, primarily due to its disregard for ruin risk within a sequence.
  4.  **Sequence Perspective as Default:** The practice implicitly adopts the single-agent-sequence perspective as the relevant frame for investing rationality, rejecting the ensemble view as practically inapplicable to an investor's lived experience.

  In essence, the "rationalist/quant" position is: "Expected Utility *Theory* is the correct framework. For the specific problem of *repeated investment with the goal of long-term capital growth*, the utility function we *choose* is log(wealth) (or a close approximation), leading to Kelly (or fractional Kelly) sizing. Pure EV maximization (linear utility) is a bad choice for this problem because it ignores ruin risk and the mechanics of compounding." The tension dissolves when you recognize the choice of utility function within EUT is where the domain-specific commitments lie.
