  We are preparing a Q&A sheet for a presentation that distinguishes between Counterfactual Mugging (CM) and XOR Blackmail (XB) and argues against a standard updateless treatment of both. The key points of the argument are:

  In CM:
  - The predictor's prediction is a function of your decision procedure (i.e., what you would do in the tails case).
  - Therefore, your decision procedure causally influences (via the predictor's prediction) whether you get $10,000 in the heads branch.
  - Thus, you should pay in the tails case to cause the predictor to have predicted that you would pay, so that in the heads branch you get the money.

  In XB:
  - The blackmailer is not a predictor and the coin flip is independent of your decision procedure.
  - The torture outcome is a function of the coin flip and your payment, but there is no prediction that your decision procedure can influence.
  - Therefore, paying is causally ineffective with respect to the coin flip and the torture outcome (which is determined by the coin and your action).
  - Thus, you should not pay.

  The audience consists of causal decision theorists (CDT), evidential decision theorists (EDT), and philosophers of probability (PP) who are skeptical of updateless reasoning and perfect predictors.

  We need to anticipate 8 objections, ordered by potential damage, with each objection phrased as the audience would, and then a two-minute reply and a note on where the reply is soft.

  We also need to include the question we hope nobody asks.

  The replies should be based solely on the structure of the scenarios without relying on citations.

  Let's list the objections:

  1. **Objection from CDT:** "In CM, when you are in the tails branch, your payment does not cause the predictor to have predicted you would pay. The prediction has already been made. So how can you say that paying now causes the prediction? It's too late. Therefore, in the tails branch, paying is causally ineffective and you should not pay."

     This is a strong objection because it directly challenges the causal story in CM.

  2. **Objection from EDT:** "In both CM and XB, your action provides evidence about the state of the world. In CM, paying in the tails branch is evidence that the predictor predicted you would pay, which is evidence that you are in a world where the coin was heads and you get $10,000. But that's not the case. Actually, in the tails branch, the coin is tails so you don't get the money. However, EDT might get confused here. Actually, a better EDT objection might be: In XB, if you pay, that might be evidence that the coin is heads (because if it were tails, paying leads to torture, so you wouldn't pay? But note, in XB, the torture happens after the payment and is determined by the coin and payment. So let me rephrase.)

     Actually, for EDT in XB: "In XB, if you pay, then in the heads case you avoid torture, and in the tails case you get tortured. But note, the coin has already been flipped. If you pay, that is evidence that the coin is heads? Not necessarily. The coin is independent. So EDT might say: paying is evidence that you are in the heads world (because if you were in the tails world, paying would lead to torture, so you wouldn't pay? But that's circular because your decision is based on the state. Actually, in EDT, we consider the conditional probabilities. So:

     - In XB: P(torture | pay) = P(coin=heads | pay)? No, because if you pay, then torture occurs only if coin=tails. So P(torture | pay) = P(coin=tails | pay). But since the coin is independent of your action, P(coin=tails | pay) = P(coin=tails) = 0.5. Similarly, P(torture | not pay) = P(coin=heads | not pay) = 0.5. So the expected utility of paying and not paying might be the same? Let's see: 

     Utility if pay: -$100 + [if heads: 0 (no torture) if tails: -1000 (say) for torture] -> expected: -100 + 0.5*0 + 0.5*(-1000) = -100 -500 = -600

     Utility if not pay: 0 + [if heads: -1000 (torture) if tails: 0] -> expected: 0.5*(-1000) = -500

     So EDT would prefer not paying because -500 > -600.

     But that matches the argument. So what's the objection? Maybe they would object to CM? In CM, in the tails branch, if you pay, then that is evidence that the predictor predicted you would pay, so in the heads branch you get $10,000. But since the coin is tails, you don't get the money. So the evidence is about a counterfactual? EDT might get into trouble because the heads branch is counterfactual when you are in tails. 

     Actually, in the tails branch, EDT would compute: 
     - Pay: -100 + [but what about the heads branch? It's not actual. EDT typically doesn't consider counterfactual branches that didn't happen. So in the actual world (tails), paying only costs $100 and doesn't get you anything. So EDT would say don't pay. But that contradicts the argument for paying in CM.

     So an EDT objection might be: "You say that in CM you should pay, but EDT would not pay because in the actual world (tails) paying only loses $100 and provides no benefit. The heads branch is not actual, so there's no evidential benefit to paying."

     This is a problem because the argument for paying in CM is based on influencing the predictor's prediction, but EDT doesn't see that influence as evidential in the actual branch.

  3. **Objection from PP (philosophers of probability):** "The idea of a perfect predictor in CM is incoherent because if the decision is indeterminate (or if there's free will), then the prediction cannot be made. Therefore, the entire scenario is ill-defined and cannot be used to draw any conclusions."

  4. **Objection from CDT about XB:** "In XB, your payment does have a causal effect: in the heads branch, paying prevents torture. So why are you saying that payment is causally ineffective? It is effective in one branch. Therefore, you should pay because it helps in the heads branch and doesn't hurt in the tails branch? Wait, but in the tails branch, paying causes torture. So it's harmful in the tails branch. But the coin flip is unknown? Actually, at the time of decision, you don't know the coin flip. So CDT would model this as a decision under uncertainty. 

     For CDT in XB:
     - Two states: heads (prob=0.5), tails (prob=0.5)
     - Actions: pay, not pay.

     If you pay and heads: -100, no torture -> utility = -100
     If you pay and tails: -100 and torture -> utility = -100 -1000 = -1100
     If not pay and heads: 0 and torture -> utility = -1000
     If not pay and tails: 0 and no torture -> utility = 0

     Expected utility of paying: 0.5*(-100) + 0.5*(-1100) = -50 -550 = -600
     Expected utility of not paying: 0.5*(-1000) + 0.5*(0) = -500

     So CDT would prefer not paying because -500 > -600. So it matches the argument.

     But what if someone objects to the causal structure? Perhaps they say that in XB, the payment does cause avoidance of torture in the heads branch and causes torture in the tails branch. So it's not ineffective. But the argument says "causally ineffective with respect to the coin". The coin is the state of nature, and the payment doesn't affect the coin. But the torture outcome is affected by the payment in both branches. So the objection might be: "You claim that payment in XB is causally ineffective? But it clearly causes the torture in the tails branch and prevents it in the heads branch. So why shouldn't we consider the causal effect in each branch? And then, since the branches are equally likely, the net effect is negative? So it's not ineffective, it's just that the effect is bad in one branch and good in the other, and overall bad."

     The argument says "causally ineffective with respect to the coin" to emphasize that the payment doesn't change the coin flip. But the torture is a function of both the coin and the payment. So the objection might be that the argument misrepresents causal ineffectiveness.

  5. **Objection about precommitment in CM:** "Why not precommit to paying in CM? Then the predictor, seeing your precommitment, would predict payment and you get the money in the heads branch. But then, when the tails branch occurs, you can renege on the precommitment and not pay. Then you get the best of both worlds: the predictor is fooled and you don't pay in tails. So why pay in the tails branch?"

     This is a classic objection to paying in CM.

  6. **Objection comparing the causal structures:** "You claim that in CM the prediction is a function of your decision procedure, but in XB there is no such prediction. But can't we redescribe XB as having a predictor? For example, the blackmailer might have set up the device to torture you in the tails branch if you pay, and in the heads branch if you don't pay. But that's just the rules. The difference is that in CM the predictor is making a prediction about your behavior, while in XB the blackmailer is not. But what if we imagine that in XB, the blackmailer is also a predictor? For instance, the blackmailer flips the coin and then, if heads, he asks for payment and if not paid, tortures; if tails, he only tortures if you pay. But he doesn't predict. What if we add a predictor? Then it becomes a different scenario. So the objection is: why can't we reinterpret XB to have a predictor? Then your distinction collapses."

  7. **Objection about updatelessness:** "You say that updateless reasoning is warranted in CM but not in XB. But in CM, when you are in the tails branch, you have updated on being in the tails branch. Why should you ignore that information and act as if you are updateless? The predictor's prediction was about what you would do in the tails branch, so you have to condition on being in the tails branch. Then, conditional on being in the tails branch, paying doesn't cause the prediction (it's already made) and doesn't get you anything. So you shouldn't pay. This is the standard CDT argument against paying in CM."

  8. **The question I hope nobody asks:** "In CM, how does the predictor make the prediction? If the decision is not determined until you make it, then the prediction must be based on a deterministic decision procedure? But if your decision is indeterministic, then the predictor cannot predict with certainty. So the scenario assumes determinism? But then there is no free will and your decision is fixed. So why should you pay? The predictor already knows. So if you are determined to pay, you pay, but if determined not to pay, you don't. There's no choice. So the whole setup is incoherent."

     This is the hard question about the coherence of prediction.

  Now, let's order them by damage:

  1. The CDT objection about the tails branch in CM: that paying cannot cause the prediction because it's already made. (This is the most damaging because it directly attacks the core of the CM argument.)

  2. The updatelessness objection: why should you ignore the information that you are in the tails branch? (This is central to the debate about updateless reasoning.)

  3. The precommitment objection: why not precommit and then renege? (This is a well-known counterargument.)

  4. The PP objection: perfect predictors are incoherent. (This challenges the setup.)

  5. The EDT objection: in the actual tails branch, paying doesn't provide any evidential benefit. (This points to a conflict with EDT.)

  6. The causal structure objection: why can't we add a predictor to XB? (This challenges the distinction.)

  7. The objection about causal ineffectiveness in XB: payment does have causal effects in both branches. (This might be a misunderstanding of the argument.)

  8. The question I hope nobody asks: the determinism/free will objection. (This is the hardest because it questions the coherence of the scenario.)

  Let me reorder by damage (from most damaging to least):

  1. CDT objection about causation in CM (tails branch payment doesn't cause the prediction).
  2. Updatelessness objection (why ignore being in tails?).
  3. Precommitment objection (why not precommit and renege?).
  4. PP objection: perfect predictors incoherent.
  5. EDT objection: in tails branch, no evidential benefit for paying.
  6. Causal structure: why not add a predictor to XB?
  7. XB: payment does have causal effects (so why call it ineffective?).
  8. Free will/determinism (hopefully nobody asks).

  But note: the free will/determinism one is the one we hope nobody asks, so we put it last and mark it as such.

  Now, for each, we write the objection as the audience would, then a two-minute reply, and a note on soft spots.

  **Q&A Prep Sheet**

  **1. CDT Objection (Most Damaging):**  
  *Objection:* "In the counterfactual mugging tails branch, your payment cannot causally influence the predictor's prediction because the prediction has already been made. At the time of your decision, the prediction is fixed. Therefore, paying $100 in the tails branch does nothing to bring about the $10,000 in the heads branch; it's purely a loss. Causal decision theory thus recommends not paying."  
  *Reply:* "The key point is that the predictor's prediction is a function of your decision *procedure*, not just the specific act in this instance. Your decision procedure is a timeless aspect of your agency. When the predictor makes its prediction, it simulates your decision procedure in the tails scenario. By adopting a decision procedure that pays in tails, you cause the predictor to predict payment, which results in you receiving $10,000 in the heads branch. Even in the tails branch, acting according to that procedure is what ensures the predictor got it right. If you deviate in the tails branch, you reveal that your decision procedure wasn't truly 'pay in tails,' so the predictor wouldn't have predicted payment in the first place. Thus, paying in tails is part of a causally coherent strategy that maximizes utility across branches."  
  *Soft Spot:* This relies on a timeless or procedural view of causation that CDT may reject. CDT typically focuses on local causal effects in the actual world, not global properties of decision procedures.  

  **2. Updatelessness Objection:**  
  *Objection:* "You argue for updateless reasoning in CM, but why should you ignore the information that you are in the tails branch? Once you know the coin is tails, you know the heads branch is counterfactual. Acting 'as if' you don't know the coin flip ignores crucial information that makes paying in tails purely costly."  
  *Reply:* "Updatelessness isn't about ignoring information; it's about recognizing that your decision procedure is evaluated before the coin flip. The predictor bases its prediction on what your procedure would do *conditional* on the tails outcome. If your procedure pays upon learning tails, that's what the predictor simulates. If you conditionally update and refuse to pay after learning tails, your procedure isn't 'pay on tails' and the predictor wouldn't predict payment. Thus, to get the $10,000 in heads, you must commit to a procedure that pays even after updating. The 'update' in updatelessness refers to not letting the knowledge of the state (tails) override the precommitment that made the heads payoff possible."  
  *Soft Spot:* This assumes that precommitment is binding or that decision procedures are fixed. Critics may argue that rational agents should always condition on all available information.  

  **3. Precommitment Objection:**  
  *Objection:* "Why not precommit to paying in CM (e.g., via a contract) so the predictor pays in heads, but then renege and not pay when tails occurs? You'd get $10,000 in heads and save $100 in tails."  
  *Reply:* "The predictor is a perfect predictor, so it accounts for whether your precommitment is credible. If you precommit but would rationally renege in tails, the predictor simulates that reneging and doesn't pay in heads. Only a binding precommitment that forces payment in tails would work, but if it's binding, you can't renege. Without binding commitment, the predictor sees through the ruse. The predictor isn't fooled by non-credible plans; it simulates your actual behavior in the scenario."  
  *Soft Spot:* This assumes the predictor can perfectly model rationality and reneging incentives, which may be contested.  

  **4. PP Objection (Perfect Predictors Incoherent):**  
  *Objection:* "Perfect predictors are incoherent if decisions are indeterministic. If your choice is free or random, the predictor cannot predict with certainty. The CM scenario thus requires determinism, robbing you of genuine choice."  
  *Reply:* "The scenario assumes determinism for the sake of argument. Even if decisions are determined, the agent can still reason about what decision procedure to adopt. The philosophical question is about what procedure is rational under the assumption that prediction is possible. If you reject determinism, substitute 'near-perfect predictor' with high accuracy; the argument holds as long as the predictor's accuracy depends on your procedure."  
  *Soft Spot:* Conceding determinism may weaken the intuition of free choice, but the argument can proceed under hypothetical determinism.  

  **5. EDT Objection:**  
  *Objection:* "In CM tails, paying $100 provides no evidential benefit. The heads branch is counterfactual, so EDT calculates utility based only on the actual tails world, where paying loses $100 with no offsetting gain. Thus, EDT would not pay."  
  *Reply:* "EDT is flawed here because it ignores acausal connections. In CM, paying in tails is evidence that you have a 'pay in tails' procedure, which is evidence that the predictor predicted payment, which would have caused the $10,000 payoff in heads. But since the coin is fair, the heads branch is equally real in the multiverse sense. However, in the actual world (tails), this evidence doesn't change anything. The key is that EDT fails to account for the causal impact of your procedure on the predictor's prediction. This is why a causal or updateless approach is needed."  
  *Soft Spot:* EDT proponents may deny acausal evidence or multiverse realism.  

  **6. Causal Structure Objection (Adding Predictor to XB):**  
  *Objection:* "What if we add a predictor to XOR blackmail? Suppose the blackmailer predicts whether you'll pay and sets the torture device accordingly. Then XB becomes like CM, and your distinction collapses."  
  *Reply:* "The original XB has no prediction about the agent's response; torture is triggered solely by the coin and payment. If we add a predictor, it becomes a different scenario. In that new scenario, if the predictor bases torture on your decision procedure (e.g., 'torture in tails only if your procedure pays'), then it would resemble CM, and paying might be rational. But that's not the XB case. The distinction is that in CM the predictor's prediction is about your decision in a counterfactual, while in XB the outcome is directly caused by your act and the coin, without any prediction about you."  
  *Soft Spot:* This reply holds only if we stick to the letter of the scenarios. Critics might argue that the essence is the same.  

  **7. XB Causal Ineffectiveness Objection:**  
  *Objection:* "In XB, your payment is not causally ineffective; it directly causes torture in tails and prevents torture in heads. You should pay if the expected utility is positive, but it isn't. Calling it 'causally ineffective' is misleading."  
  *Reply:* "I agree the phrasing was loose. Payment is causally effective with respect to torture, but it has no causal effect on the coin flip, which is the source of uncertainty. The point is that in XB, there's no additional mechanism (like a predictor) that your decision procedure can influence across branches. Thus, unlike CM, there's no benefit from updateless reasoning because your act doesn't affect outcomes in other branches via a predictor. CDT handles XB correctly by weighing causal effects in each state."  
  *Soft Spot:* Concedes that 'causally ineffective' was an overstatement; the argument survives with clarification.  

  **8. Free Will/Determinism (Question I Hope Nobody Asks):**  
  *Objection:* "If the predictor can perfectly predict your decision, doesn't that imply determinism? And if decisions are determined, how can you 'choose' to pay or not? This makes the scenario incoherent for normative decision theory."  
  *Reply:* "We can bracket the free will debate. The scenario assumes that, even under determinism, we can model the agent as choosing a decision procedure. The predictor simulates that procedure. Normative questions about what procedure to adopt remain meaningful. For example, we can ask: 'What decision procedure, if adopted, leads to the best outcomes?' under the constraint that the predictor anticipates it accurately."  
  *Soft Spot:* This avoids rather than resolves the objection. If determinism undermines choice, the scenario may not reflect real decisions.  

  **Concession Note:** For Objection 7 (XB causal ineffectiveness), I should concede upfront that "causally ineffective" was imprecise and clarify that payment *does* cause torture in tails and prevents it in heads, but there is no *cross-branch influence via a predictor* as in CM. This strengthens the argument by removing a distraction.
answer: |-
  Below is a Q&A prep sheet tailored to your presentation, ordered by the potential damage of each objection (most damaging first). The objections are phrased as your audience (causal decision theorists/CDT, evidential decision theorists/EDT, and philosophers of probability/PP) would likely pose them. Each objection includes a concise two-minute reply and a note on where your reply is "soft" (i.e., vulnerable to follow-up challenges). I also flag objections where concession is advisable and include the "question you hope nobody asks" at the end. Replies rely solely on the structural features of your scenarios—no citations or external references are needed.

  ---

  ### **Q&A Prep Sheet: Objections and Replies**  
  **Core of your argument**:  
  - **Counterfactual Mugging (CM)**: Pay in tails because your decision procedure (DP) causally influences the predictor's prediction, affecting the heads outcome.  
  - **XOR Blackmail (XB)**: Don't pay because your DP has no causal influence on the coin or torture mechanism; payment is locally causal but harmful in expectation.  
  - **Updatelessness**: Warranted in CM (due to DP's cross-branch influence), not in XB (no cross-branch influence).  

  ---

  #### **1. Objection (CDT): Causation is Local, Not Global**  
  *Phrasing*: "In CM's tails branch, your payment can't *cause* the predictor's past prediction—it's already fixed. CDT cares about actual causal chains: paying only loses you $100 here, with no physical effect on the heads branch. Your 'decision procedure' is just metaphysical hand-waving. If causation requires temporality, your argument collapses."  
  **Damage**: High. Directly attacks your core claim that DP "causally influences" the predictor.  
  **Reply**: "Causation here isn't temporal; it's *procedural*. The predictor's prediction depends on your DP as a timeless property. By having a DP that pays in tails, you cause the predictor to simulate that outcome and pay in heads. Refusing in tails reveals your DP wouldn't trigger the payment in heads—so it's causally coherent. In XB, no such procedural influence exists."  
  **Soft Spot**: Assumes "timeless causation" is coherent, which CDT may reject as non-causal.  

  **Flag**: Concede upfront that "causation" here is *not* standard CDT causation but a broader dependence of outcomes on DP.  

  ---

  #### **2. Objection (PP/EDT): Updatelessness Ignores Information**  
  *Phrasing*: "You endorse updatelessness in CM but reject it in XB. But conditioning on known states (e.g., being in tails) is rational. In CM, once you know the coin is tails, the heads outcome is counterfactual—your DP can't affect it. Updatelessness forces you to ignore information, violating basic probability theory."  
  **Damage**: High. Challenges coherence of updatelessness and implies your distinction is arbitrary.  
  **Reply**: "Updatelessness isn't ignoring information—it's about *procedural commitment*. In CM, the predictor's prediction depends on your DP *before* the coin flip. If you conditionally update (e.g., refuse in tails), your DP isn't 'pay in tails' and the predictor won't pay in heads. In XB, no such pre-commitment matters; outcomes depend only on the coin and your local act."  
  **Soft Spot**: Doesn't resolve why procedural commitment is "rational" when information update dominates.  

  ---

  #### **3. Objection (CDT): XB Payment is Causally Effective**  
  *Phrasing*: "You claim payment in XB is 'causally ineffective,' but that's false. Payment directly causes torture avoidance in heads and torture in tails. CDT calculates expected utility: not paying wins (-500 vs. -600). Your error is reframing this as 'ineffectiveness'—it's about net causal disutility."  
  **Damage**: High. Misrepresents your argument and could derail your XB analysis.  
  **Reply**: "I agree 'ineffective' was imprecise. Payment *is* locally causal in XB—but only within each branch. Crucially, there's no *cross-branch influence* (unlike CM's predictor). Thus, updatelessness adds no value: act based on local causality. In CM, the predictor links branches via your DP."  
  **Flag**: Concede upfront that "causally ineffective" was loose—replace with "no cross-branch causal influence via DP."  

  ---

  #### **4. Objection (EDT): CM Tails Payment Has No Evidential Benefit**  
  *Phrasing*: "In CM tails, paying costs $100 and provides no evidence of gain—the heads branch is counterfactual. EDT would reject payment: it's not evidence of anything beneficial in the actual world. Your 'procedural influence' is acausal, which EDT dismisses as irrational."  
  **Damage**: Medium-High. EDT allies may see your CM argument as mystical.  
  **Reply**: "EDT fails here by ignoring the predictor's dependence on your DP. Paying in tails is evidence your DP is 'pay in tails,' which *would be* evidence (pre-coin-flip) that the predictor pays in heads. But EDT can't handle this counterfactual evidence—hence why procedural reasoning is needed."  
  **Soft Spot**: Assumes EDT should care about counterfactual evidence, which it explicitly rejects.  

  ---

  #### **5. Objection (PP): Perfect Predictors are Incoherent**  
  *Phrasing*: "CM requires a perfect predictor, but if your decision is indeterminate, prediction is impossible. If determined, you lack free will—so 'should' is meaningless. The scenario is ill-defined, making your entire distinction moot."  
  **Damage**: Medium. Undercuts the foundation of CM.  
  **Reply**: "Bracket determinism: assume a near-perfect predictor or a world where DPs are stable. The question is, *given* prediction, what DP maximizes utility? In XB, no prediction exists—so no incoherence arises. The structural difference (predictor vs. no predictor) remains."  
  **Soft Spot**: Doesn't resolve the tension between prediction and free will.  

  ---

  #### **6. Objection (CDT): Precommitment in CM Allows Cheating**  
  *Phrasing*: "Why not precommit to paying in CM (e.g., via a contract), making the predictor pay in heads, then renege in tails? You'd gain $10,000 in heads and save $100 in tails—outsmarting updatelessness."  
  **Damage**: Medium. A classic counter, suggesting your CM prescription is naive.  
  **Reply**: "A perfect predictor anticipates your *actual* DP, not just promises. If your DP includes reneging, the predictor simulates that and withholds payment in heads. Only a truly consistent 'pay in tails' DP works. Precommitment only helps if it's binding—but here, it's your DP that matters."  
  **Soft Spot**: Assumes reneging makes DP inconsistent—but critics may argue for "shifting" DPs.  

  ---

  #### **7. Objection (All): Redescribe XB with a Predictor**  
  *Phrasing*: "Add a predictor to XB: the blackmailer predicts if you'll pay and sets torture based on that. Now XB resembles CM—so your distinction collapses. This shows updatelessness is always viable if we imagine predictors."  
  **Damage**: Low-Medium. Tests the robustness of your scenarios.  
  **Reply**: "Redescribing XB with a predictor changes the case—it becomes CM-like, and I'd endorse paying. But in the *actual* XB, no predictor exists: torture is purely a function of the coin and your payment. The structural difference is explicit: CM has a predictor whose output depends on your DP; XB does not."  
  **Soft Spot**: If audiences insist on redescriptions, your distinction may seem ad hoc.  

  ---

  #### **8. The Question You Hope Nobody Asks (PP): Prediction Under Indeterminacy**  
  *Phrasing*: "If your decision in CM is indeterminate (e.g., quantum randomness), the predictor can't know it. If determined, your 'choice' is illusory. Either way, CM reduces to nonsense—so why prefer paying in tails? Your argument presumes an incoherent metaphysics."  
  **Damage**: Very High. Threatens the entire setup.  
  **Reply**: "Treat prediction as a *functional* dependence: the predictor outputs $10,000 iff your DP outputs 'pay' in the tails scenario. We can evaluate DPs without resolving determinism. In XB, no such functional dependence exists—only coin and act. Thus, the distinction holds under operational definitions."  
  **Soft Spot**: Functional dependence may feel like evasion; this objection could stalemate the discussion.  

  ---

  ### **Key Strategic Notes**  
  - **Concessions**:  
    - For **Objection 3 (XB causal ineffectiveness)**: Concede upfront that "causally ineffective" was misleading—clarify it means "no cross-branch causal influence via DP."  
    - For **Objection 1 (CDT causation)**: Concede that your "causation" is procedural, not CDT-style, to preempt semantic debates.  
  - **Defense Focus**: Emphasize the *structural difference*: CM has a predictor whose output depends on your DP, creating cross-branch influence; XB has no predictor, so outcomes depend only on local coin/act.  
