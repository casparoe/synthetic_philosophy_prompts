answer: |-
  Your description aligns with the concept of **iterative elimination of strictly dominated strategies by mixed strategies** in game theory. This is a well-established method, but the phenomenon you're observing—where elimination can seemingly threaten to remove all options—warrants clarification. Below, I address your questions systematically.

  ### 1. **Name for the Elimination Process**
  The process is called:  
  **Iterated Strict Dominance by Mixed Strategies** (or **Iterative Elimination of Strictly Dominated Strategies via Mixed Strategies**).  

  - **Why this name?**  
    - A pure strategy \(s_i\) for a player is **strictly dominated by a mixed strategy** \(\sigma_i\) (a lottery over other pure strategies) if, for every possible action profile of the other players, the expected payoff from \(\sigma_i\) is strictly greater than the payoff from \(s_i\).  
    - The elimination is **iterative** because after removing \(s_i\), you re-evaluate the smaller game, possibly removing more strategies in subsequent rounds.  

  - **Distinction from simpler cases:**  
    - **Ordinary strict dominance** (one pure strategy dominates another everywhere) is a special case where \(\sigma_i\) assigns probability 1 to a single strategy.  
    - Here, \(\sigma_i\) is a non-degenerate mixture (at least two strategies with positive probability), and no single strategy dominates \(s_i\) alone.  

  ### 2. **The "Emptying the Set" Oddity: What Happens?**
  Your concern—that the process might eliminate all strategies—is insightful. However, **this cannot occur** in standard finite games. Here's why:  
  - **Termination condition:** The process stops when no remaining strategy is strictly dominated by any mixed strategy over the **current** set of remaining strategies.  
  - **Non-emptiness:**  
    - If only one strategy remains, it cannot be strictly dominated (there are no other strategies to form a dominating mixture).  
    - If multiple strategies remain, none can be dominated by mixtures of the others.  
  - **Key result:** Iterated strict dominance by mixed strategies **always leaves a non-empty set** of strategies (for finite games).  

  **Why it might *seem* like everything is eliminated:**  
  - In some games, the process can eliminate all strategies **except one** (or a few). If you mentally project elimination steps beyond what's logically possible, it might appear that the last strategy could be removed, but this is an illusion—the process inherently halts before emptiness.  

  ### 3. **Rationality and the Conclusion**
  - **Rational choice still exists:** The surviving strategies are **rationalizable**. This means:  
    - Each surviving strategy is a best response to some belief about opponents' actions (where beliefs are probability distributions over their surviving strategies).  
    - No surviving strategy is strictly dominated by a mixture of others in the set.  
  - **Interpretation:** The process **does not break down**. Instead, it refines the game to a set of "plausible" strategies. If multiple strategies survive:  
    - You must choose among them (no further dominance-based elimination is possible).  
    - Additional criteria (e.g., Nash equilibrium, risk dominance) may help select within this set.  

  ### 4. **Relation to "Never the Best" Advice**
  - **Connection:**  
    - A strictly dominated strategy (by any mixed strategy) is **never a best response** to any belief about opponents. Thus, eliminating such strategies aligns with removing "never best" options.  
    - In **two-player games**, iterated elimination of strictly dominated strategies (by mixed strategies) coincides with **rationalizability** (strategies surviving are precisely those that are best responses to some beliefs).  
  - **Boundary:** In games with ≥3 players, rationalizability may retain more strategies than iterated mixed dominance (due to correlated beliefs), but your process remains sound.  

  ### 5. **When the Process Stops: Boundary Cases**
  - **Stopping conditions:**  
    - **No dominance:** No remaining strategy is strictly dominated by any mixed strategy over the current set.  
    - **Fixed point:** The set of strategies stabilizes (no more eliminations possible).  
  - **When it eliminates aggressively vs. conservatively:**  
    | **Game Type**              | **Likely Outcome**                                  |  
    |----------------------------|----------------------------------------------------|  
    | **Dominance-solvable**     | Single strategy survives (unique rational choice). |  
    | **Games with mixtures**    | Multiple strategies survive (e.g., coordination games). |  
    | **Symmetric zero-sum**     | Often reduces to a small set (e.g., Rock-Paper-Scissors). |  
  - **Example where it stops early:**  
    - **Modified Rock-Paper-Scissors:**  
      - Payoffs: Rock vs. Paper = (0, 2), Paper vs. Scissors = (0, 2), Scissors vs. Rock = (0, 2); all other matchups = (1, 0).  
      - Here, no pure strategy is strictly dominated by another, but Scissors is strictly dominated by a 50-50 mix of Rock/Paper (beats it 2 > 0 when opponent plays Rock or Paper). After eliminating Scissors, Rock and Paper cannot dominate each other—process stops.  

  ### 6. **Underlying Logic and Why It Works**
  - **Foundations:**  
    - **Rationality assumption:** Players avoid strategies that are strictly worse than a mixture, regardless of opponents' actions.  
    - **Common knowledge of rationality:** Players know others apply the same logic, enabling iterative reasoning.  
  - **Why mixtures matter:**  
    - Some strategies are only dominated by lotteries (e.g., in games with cyclical dominance like Rock-Paper-Scissors, no pure strategy dominates another, but mixtures dominate).  
    - This expands the power of elimination beyond pure-strategy comparisons.  

  ### Key Takeaway
  Your observed pattern is a **rigorous solution concept** in game theory. It refines the set of rational choices without implying indecision. While the process can eliminate many strategies, it **cannot consume everything** and always leaves at least one rationalizable option. If you encounter a game where you *suspect* all strategies might be eliminated, double-check:  
  1. Ensure mixtures are over **remaining** strategies at each step.  
  2. Verify strict inequality in payoffs for **all** opponent actions.  

  For further study, explore:  
  - **Rationalizability** (Bernheim, 1984; Pearce, 1984).  
  - **Algorithms** for iterated dominance in computational game theory.  
  - **Limitations**: In games with infinite strategies or discontinuous payoffs, pathological cases may arise (but finite discrete games are safe).  

  This method is a cornerstone of strategic reasoning—its iterative nature and use of mixtures capture deeper layers of rational decision-making.
