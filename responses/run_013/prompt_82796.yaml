  Looking at their verdicts, I notice several key patterns emerging. In case 1, abc→abd to ijk→ijl feels natural as it maintains the successor relation. Case 2 (ijk→ijd) feels bad because it copies the letter rather than the relation. Cases 5 and 6 show they're sensitive to directionality - when the string is reversed (kji), they want the change to follow that direction (kjh good, kjj bad). Cases 7 and 9 reveal a tension between local step direction versus overall string direction. In case 7 (ikj→iki), they follow the last local step (k to j is down, so j to i down), while in case 9 (cab→caa), they follow the overall direction (c to b is down, so b to a down), even though the last local step (a to b) is up.

