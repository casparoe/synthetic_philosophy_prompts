prompt: |-
  You are a philosopher of history who is also genuinely fluent in the theory of stochastic processes and time-series analysis. I am a quantitative researcher: I model and forecast time series for a living, and I am at home with stationarity and unit roots, mean reversion, ergodicity and non-ergodicity, structural breaks and regime-switching models, deterministic versus stochastic cycles, limit cycles and strange attractors, path dependence and hysteresis. I have no formal training in history or in the philosophy of history, and I am not asking for a reading list or citations -- I want the ideas themselves and I cannot look anything up. Treat me as competent in my own vocabulary and naive in yours.

  I want you to take the long dispute between cyclical and linear views of history and restate it, as faithfully as you can, in the vocabulary I actually use. On the cyclical side, work through: the classical and medieval tradition of constitutional cycles (regimes that rotate through a fixed sequence and return to their starting point); the cyclical political sociology of Ibn Khaldun (dynasties that rise on hardy group solidarity, soften and urbanize, and are then displaced by a fresh solidary group); and the organic, culture-morphological accounts of civilizational birth, maturity, and decline offered by Spengler and Toynbee, in which whole cultures or civilizations are treated as living things with a determinate life span. On the linear side, work through: the Judeo-Christian and Enlightenment-Whig narratives of irreversible progress, and the modern stage-and-direction views of history in the historicist and Marxian traditions.

  For each side, do the translation carefully and one claim at a time. Which historical claims become claims about the generating process? Is history being modeled as a stationary process with mean reversion, a non-stationary process with drift, a deterministic system with a limit cycle or an attractor, a regime-switching process, or an ergodic versus non-ergodic process? Map each historian's claim onto one of these formal objects, say what has to be fudged to make it fit, and be explicit about a distinction I care about: whether the cycle is generated endogenously by the dynamics or is just an exogenous shock process that we choose to summarize as a cycle.

  Then give me the residue report, which is the part I care about most. Which claims translate cleanly, which translate only with distortion, and which have no counterpart in my vocabulary at all -- and for each residue item, say whether it reveals something the time-series vocabulary cannot express (purpose, meaning, a normative direction to history, the difference between a cycle that is predicted and a cycle that is lived through) or whether it instead suggests that the historian's original claim was less precise than it sounded. Include, among the residue candidates, the reflexivity problem: historical actors who know the cycle theory may act on it, so that the process is not stable under its own description, and tell me whether anything in my vocabulary (self-undermining forecasts, feedback, adaptive control) captures that or whether it is genuinely outside the formalism.

  Begin by brainstorming the candidate mappings before committing to any of them, and think through the tricky cases before you write.

  Finally, keep two registers separate. Tell me plainly which parts of this are settled among people who actually study the topic and which are genuinely contested, and do not present a contested interpretation as if it were the consensus. Where a mapping is speculative rather than forced, say so and calibrate your confidence accordingly rather than smoothing it over.
