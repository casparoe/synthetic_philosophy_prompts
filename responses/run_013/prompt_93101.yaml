  First, I need to map each historical theory to a stochastic process model. For cyclical views:  
  - **Classical constitutional cycles** (Polybius): Sounds like a deterministic limit cycle—fixed sequence of regimes repeating endlessly. But real history isn't that rigid, so a stochastic regime-switching model with absorbing states might fit better, though it's a stretch.  
  - **Ibn Khaldun's asabiyyah cycles**: Classic mean-reverting regime-switching. Solidarity ("asabiyyah") decays deterministically, but the takeover by new groups is stochastic. The cycle is endogenous—decay comes from within.  
  - **Spengler/Toynbee's organic cycles**: Non-stationary, non-ergodic processes with deterministic lifecycles. But civilizations don’t have fixed lifespans like organisms, so this mapping is speculative.  

  For linear views:  
  - **Judeo-Christian/Whig progress**: Pure unit root with positive drift—permanent upward trajectory. But it ignores volatility and shocks.  
  - **Marxian historicism**: Deterministic trend with structural breaks (revolutionary phase transitions). The trend is endogenous, driven by internal contradictions.  

  Now the residue—what doesn’t translate:  
  - **Teleology** (purpose/direction): Time-series models can’t handle "history’s goal." Drift parameters aren’t purposeful.  
  - **Meaning/normativity**: No vocabulary for "progress as good" or "decline as tragic."  
  - **Reflexivity**: When actors know the theory, they might alter the process. Feedback loops in control theory *almost* capture this, but not the self-undermining aspect.  
  - **Lived vs. predicted cycles**: Khaldun’s rulers *feeling* their decay has no analog in cold statistics.  

  The user cares most about this residue. I should flag which gaps reveal limits of formalism (teleology) vs. which expose vagueness in original theories (Spengler’s "destiny").  

  Also, be transparent:  
  - Consensus: Khaldun maps cleanly to regime-switching; Whig progress to unit root with drift.  
  - Contested: Whether organic decline is truly deterministic.  
  - Speculative: Reflexivity as adaptive control—low confidence.  

  The user is sharp—they’ll spot hand-waving. No smoothing over uncertainties.
answer: |-
  ### Cyclical vs. Linear History: A Time-Series Translation  
  **Core Insight:** History is modeled as a *data-generating process (DGP)*. Cyclical theories imply *stationarity* or *mean-reversion*; linear theories imply *non-stationarity* with *drift* or *structural breaks*. But key residues (teleology, reflexivity, lived experience) resist formalization.  

  ---

  ### **I. Cyclical Views as Stochastic Processes**  
  #### **(A) Classical/Medieval Constitutional Cycles (e.g., Polybius)**  
  - **Claim:** Regimes rotate deterministically (e.g., monarchy → tyranny → aristocracy → oligarchy → democracy → mob rule → back to monarchy).  
  - **Formal Mapping:** A **deterministic limit cycle** in a low-dimensional system.  
    - *Fudges:* Real politics has stochastic shocks (wars, famines). Better approximated as a **regime-switching process** with fixed transition probabilities between states.  
    - *Endogeneity:* The cycle is endogenous—decay is built into each regime’s dynamics (e.g., monarchy *necessarily* corrupts into tyranny).  

  #### **(B) Ibn Khaldun’s *Asabiyyah* Cycles**  
  - **Claim:** Dynasties rise via group solidarity (*asabiyyah*), soften through urbanization/wealth, and are replaced by a new solidary group.  
  - **Formal Mapping:** A **mean-reverting regime-switching model** with endogenous decay.  
    - *Process:* *Asabiyyah* is a latent variable with deterministic decay (drift toward zero). Collapse occurs when *asabiyyah* < critical threshold. Replacement is a stochastic shock (new group emerges).  
    - *Endogeneity:* Decay is endogenous (urbanization softens ruling class); replacement is exogenous (external group invades).  
    - *Clean Fit:* This maps neatly to a **self-exciting point process** with fatigue.  

  #### **(C) Spengler/Toynbee Civilizational Life Cycles**  
  - **Claim:** Civilizations are born, mature, and die organically (e.g., Spengler’s "Spring/Winter" analogy).  
  - **Formal Mapping:** A **non-stationary, non-ergodic process with deterministic lifespan**.  
    - *Fudges:* "Lifespan" implies fixed duration (e.g., 1,000 years)—unlike stochastic mortality. Better as a **path-dependent diffusion** with absorbing death state.  
    - *Endogeneity:* Decline is endogenous (cultural exhaustion), but timing may be stochastic.  

  ---

  ### **II. Linear Views as Stochastic Processes**  
  #### **(A) Judeo-Christian/Enlightenment-Whig Progress**  
  - **Claim:** History moves irreversibly toward improvement (divine purpose or human reason).  
  - **Formal Mapping:** **Non-stationary process with positive drift** (e.g., random walk with μ > 0).  
    - *Fudges:* "Progress" is normative; drift lacks teleology. Volatility (wars, regressions) implies **stochastic trend with infrequent negative shocks**.  

  #### **(B) Marxian/Historicist Stages**  
  - **Claim:** History progresses directionally through stages (e.g., feudalism → capitalism → socialism) via dialectical conflict.  
  - **Formal Mapping:** **Unit root process with structural breaks** at revolutionary thresholds.  
    - *Endogeneity:* Breaks are endogenous (e.g., capitalism’s contradictions *cause* revolution).  
    - *Distortion:* Marx’s "inevitability" implies deterministic phase transitions; real dynamics suggest **state-dependent hysteresis** (e.g., revolutions only if inequality > critical level).  

  ---

  ### **III. Residue Report: What Doesn’t Map**  
  #### **A. Untranslatable Concepts (Formalism’s Limits)**  
  1. **Teleology:**  
     - Linear theories assume history has a *purpose* (divine plan, human emancipation). Your vocabulary has **drift (μ)** but no *goal-directedness*. A unit root with μ > 0 isn’t "progress"—it’s just upward momentum.  
     - *Why it matters:* Normative direction ("history is improving") is metaphysical, not statistical.  

  2. **Lived vs. Predicted Cycles:**  
     - Khaldun’s rulers *experience* decay as moral failure; Spengler’s civilizations "feel" their decline. Your models describe **outcomes**, not *meaning*. A mean-reverting process doesn’t capture existential dread.  

  3. **Normative Decline/Progress:**  
     - Cyclical theorists see decline as tragic; Whigs see it as aberration. Formalism treats both as **asymmetric volatility**—no "ought" in stationarity.  

  #### **B. Ambiguities in Original Claims**  
  1. **Deterministic Lifespans (Spengler):**  
     - Claimed fixed durations are empirically false. Residue exposes vagueness: is "1,000-year lifespan" a **deterministic trend** or just **high persistence**?  

  2. **Cycle Repetition:**  
     - Polybius assumes *exact* repetition—implausible in stochastic worlds. Real history shows **quasi-cycles** (similar but aperiodic regimes).  

  #### **C. Reflexivity: The Meta-Problem**  
  - **Claim:** If actors know the cycle theory (e.g., "dynasties decay in 4 generations"), they may alter behavior—changing the DGP.  
  - **Formal Proxies:**  
    - *Feedback:* Control-theoretic models (e.g., rulers taxing less to delay *asabiyyah* decay).  
    - *Self-Undermining Forecasts:* If everyone believes revolution is inevitable, it may happen faster (a **martingale** with belief-dependent variance).  
  - **Gap:** No formalism captures **theory-laden agency**. Your tools model *reactions to shocks*, not *reactions to the model itself*.  

  ---

  ### **IV. Consensus vs. Contested**  
  | **Aspect**               | Consensus? | Key Contestations |  
  |--------------------------|------------|-------------------|  
  | **Cycles as mean-reversion** | Yes       | Khaldun’s model fits cleanly; others require forcing. |  
  | **Linear progress as drift** | Yes       | Whig drift ignores structural breaks (e.g., WWII). |  
  | **Endogenous vs. exogenous cycles** | Partially | Polybius’ cycle is over-endogenous; Khaldun’s balance is plausible. |  
  | **Civilizational lifespan determinism** | No | Spengler/Toynbee widely criticized as unscientific. |  
  | **Reflexivity**          | No         | No agreed stochastic framework (speculative: adaptive control). |  

  ### **Summary**  
  - **Clean translations:** Khaldun’s *asabiyyah* (regime-switching), Whig progress (unit root with drift).  
  - **Forced translations:** Organic life cycles (deterministic attractors), exact constitutional repetition (limit cycles).  
  - **Permanent residue:** Purpose, meaning, and reflexivity reveal **limits of stochastic formalism**. History isn’t just a DGP—it’s a process *experienced* by agents who change it by understanding it. Your tools describe the *skeleton*; the *flesh* requires philosophy.  

  ##### Confidence Calibration:  
  - High: Khaldun, Whig/Enlightenment drift.  
  - Medium: Marxian structural breaks.  
  - Low: Spengler/Toynbee determinism, reflexivity models.
