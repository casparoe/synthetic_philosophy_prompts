  The film's structure also plays a role. The reverse chronology forces viewers to piece together the narrative, mirroring Leonard's experience. This experiential aspect adds something philosophical texts can't—showing the visceral need for narrative coherence.

  Ethically, Memento shows narrative as both survival tool and trap. Leonard's lie gives him purpose but traps him in vengeance. The film suggests that while narratives are necessary, they can be harmful when built on falsehoods or external manipulation.

  What does Memento add? It highlights the materiality of narrative—tattoos, Polaroids—making the abstract concrete. It also reveals the vulnerability of narrative to manipulation and self-deception, something philosophy might discuss but not demonstrate as powerfully.

