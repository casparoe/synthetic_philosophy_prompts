prompt: |-
  I chair the research review committee of an AI safety foundation. Our next vote is on a proposal to fund a two-year project on program equilibrium. The applicants propose a series of tournaments in which each participating AI agent submits source code; before choosing an action, an agent's code may read the source code of the agent it is paired with. They define a program equilibrium as a pair of submitted programs each of which is a best response to the other, given that both can condition on each other's code. Their claim is that this is the right model for advanced AI systems that can inspect and predict one another, and that the tournaments will show whether cooperation can be achieved without central enforcement. Two reviewers object that the setup assumes away the central difficulty: if an agent can read its opponent's code, cooperation is trivial, and the tournament will measure only how cleverly contestants exploit the transparency condition. A third reviewer replies that the objection misses the point, because the interesting question is not whether cooperation occurs but whether a program can genuinely commit to a strategy that depends on another program's code. The committee must decide whether to fund the proposal, reject it, or fund it with conditions. Please draft the decision memo I will circulate before the vote. It should recommend a concrete course of action with a time frame, engage the strongest version of the objection, and state what the funded project would have to show for the committee to regard it as a success rather than an artifact of the tournament design.
reasoning: |-
  We are at a critical juncture in AI safety research, and the proposal on program equilibrium presents a compelling yet contentious opportunity. The core idea is to model advanced AI interactions through tournaments where agents can inspect each other's source code, with the goal of understanding whether cooperation can emerge without central enforcement. The reviewers' objections highlight a fundamental tension: does this setup actually address the real-world challenge of opaque agents, or does it merely create an artificial scenario where cooperation is trivial?

  After careful consideration, I recommend that we fund the project, but with specific conditions aimed at addressing the reviewers' concerns. The project must be structured to rigorously test the central claim about commitment and to ensure that the results are not artifacts of the tournament's transparency. The funding will be allocated in two phases: an initial 12-month phase to run the tournaments and address the methodological concerns, followed by a progress review to decide on the second year of funding.

  **Key Objection and Response:**
  The strongest objection is that the transparency condition (allowing agents to read each other's code) makes cooperation trivial and thus fails to model the real challenge of cooperation among advanced AI systems, which may be opaque. The third reviewer counters that the point is about commitment: can an agent commit to a strategy that conditions on another agent's code, and is this commitment robust?

  We agree that if the tournament only shows that cooperation occurs when agents are fully transparent, it would not advance our understanding of real-world AI interactions. However, the project's value lies in testing whether program equilibrium can serve as a foundation for commitment strategies even when we relax the transparency assumption. Therefore, the project must extend beyond the baseline scenario to investigate:

  1. **Partial Transparency:** How robust is cooperation when an agent can only inspect a limited part of the opponent's code (e.g., due to computational constraints or obfuscation)? The project should include variants where access is restricted (e.g., only function headers, or a subset of functions) or where the code is intentionally obfuscated.

  2. **Deception and Adversarial Code:** Can an agent deceive by presenting misleading code? The project should include a round where agents are allowed to submit code that may contain deceptive elements (e.g., dead code, misleading comments, or code that only behaves cooperatively under specific conditions). This tests whether commitment strategies can be robust against adversarial manipulation.

  3. **Computational Limitations:** Real agents may not have unlimited resources to analyze each other's code. The project should include tournaments where agents face time or memory constraints during code analysis, reflecting real-world limitations.

  **Conditions for Funding:**
  1. **Phase 1 (Months 1-12):** The project must run the baseline tournament (full transparency) and at least two variants addressing the above extensions (partial transparency and one other). The project team must submit a detailed report at the end of Month 12, including:
     - A comparison of cooperation rates and equilibrium outcomes across the baseline and variant tournaments.
     - An analysis of the commitment strategies employed by successful agents (e.g., how they condition their actions on the opponent's code, and how they handle uncertainty or deception).
     - A theoretical framework explaining how the results might scale to more complex, real-world settings.

  2. **Progress Review (Month 12):** The committee will evaluate the report and decide on the second year of funding. The project will only continue if:
     - The results show non-trivial insights about commitment (e.g., cooperation is sustained even under partial transparency or when facing adversarial code).
     - The project demonstrates that successful strategies are not mere artifacts of the tournament rules (e.g., by showing that the same strategies fail in a control tournament without code inspection, or by testing against a set of known adversarial strategies).

  3. **Dissemination and Reproducibility:** All tournament designs, agent code, and results must be made publicly available (with appropriate anonymization for participant privacy). The project must include a plan for third-party replication.

  **Definition of Success:**
  For the committee to regard the project as a success (and not an artifact of the design), the funded project must show:

  1. **Robustness of Commitment:** That program equilibrium strategies can sustain cooperation even under conditions of partial transparency, deception, or resource constraints. Specifically, cooperation rates should remain significantly above the baseline of non-transparent interactions (e.g., traditional game-theoretic models without code inspection) and should not collapse under adversarial conditions.

  2. **Generalizable Insights:** The project should yield insights that can inform the design of real-world AI systems. For example:
     - If commitment via code inspection is robust, what are the minimal requirements for transparency to enable cooperation?
     - If it fails, what are the failure modes (e.g., susceptibility to deception, or computational infeasibility)?

  3. **Advancement of Theory:** The project should contribute to the theoretical understanding of program equilibrium by either:
     - Demonstrating a class of strategies that achieve cooperation in a way that scales to complex environments, or
     - Identifying fundamental limitations (e.g., incomputability, vulnerability to Gödelian obstacles) that would prevent such equilibria in advanced AI systems.

  **Conclusion:**
  The proposal addresses a foundational question in AI safety: can we design AI systems that cooperate via mutual transparency and commitment? While the objections are valid, they point to necessary extensions that the project must include to be relevant. By funding with conditions, we ensure that the project either delivers robust insights or fails in a way that informs future research. I move that we approve the project for Phase 1 funding (year one) with the conditions outlined above, and schedule a progress review in 12 months.

  **Vote Recommendation:** Approve with conditions (Phase 1 funding only, contingent on progress review).

  **Time Frame:**
  - Month 1: Project start, initial design of baseline and variant tournaments.
  - Months 2-10: Tournament runs and data collection.
  - Month 11: Data analysis and drafting of Phase 1 report.
  - Month 12: Progress review by committee; decision on Year 2 funding.

  I urge the committee to support this approach, which balances the potential for breakthrough insights with rigorous safeguards against methodological artifacts.
answer: |-
  **MEMORANDUM**  
  To: Research Review Committee Members  
  From: Chair, Research Review Committee  
  Date: October 26, 2023  
  Subject: Funding Recommendation for Proposal #2312: "Program Equilibrium Tournaments for AI Cooperation"  

  ### I. Proposal Summary
  The applicants propose a two-year project to investigate *program equilibrium* via AI tournaments. Participants submit agents as source code; before acting, each agent may inspect its opponent’s code. A program equilibrium is defined as a pair of programs where each is a best response to the other, conditional on mutual code inspection. The goal is to test whether cooperation (e.g., in Prisoner’s Dilemma-style games) can emerge without central enforcement in advanced AI systems capable of mutual prediction.  

  ### II. Key Strengths and Objections
  **Strengths**:  
  - Addresses a foundational problem in multi-agent AI safety: *how systems cooperate under transparency*.  
  - Innovative empirical approach (tournaments) to test theoretical game-theoretic concepts.  
  - Potential to inform real-world AI alignment (e.g., cooperative protocols in decentralized systems).  

  **Core Objection (Reviewers 1 & 2)**:  
  The setup assumes away the central challenge of *opacity* in real AI interactions. If agents can perfectly inspect each other’s code, cooperation becomes trivial (e.g., via "cooperate iff opponent’s code is identical to mine"). The tournaments risk measuring only how agents exploit transparency, not genuine cooperation under realistic conditions.  

  **Rebuttal (Reviewer 3)**:  
  The objection conflates *cooperation* with *commitment*. The critical question is whether agents can design **robustly verifiable commitments** (e.g., strategies that enforce cooperation only if the opponent’s code meets specific criteria), which could scale to settings with partial transparency.  

  ### III. Committee Recommendation: **Fund with Conditions**
  We recommend **approving Phase 1 funding (Year 1 only)**, contingent on a 12-month progress review. The project shows high potential but must rigorously address whether program equilibria reflect genuine commitment strategies or tournament artifacts.  

  #### Conditions for Funding:  
  1. **Mandatory Tournament Variants (Months 1–12)**:  
     The project must test scenarios that mitigate the "trivial cooperation" risk:  
     - **Partial Transparency**: Agents see only a subset of code (e.g., function headers, metadata, or obfuscated code).  
     - **Adversarial Conditions**: Tournaments where opponents can submit code with deceptive elements (e.g., dead code, misleading comments) or where agents face computational limits (e.g., restricted time/space for code analysis).  
     - **Control Cases**: Baseline tournaments *without* code inspection, to benchmark cooperation rates.  

  2. **Progress Review (Month 12)**:  
     Release of second-year funds requires:  
     - Empirical evidence that cooperation relies on **verifiable commitment strategies**, not trivial exploits (e.g., agents must demonstrate *conditional* cooperation that holds under partial/adversarial settings).  
     - A theoretical framework explaining how equilibria could apply to **real-world AI systems** (e.g., systems with black-box components or approximate code similarity checks).  

  3. **Transparency and Reproducibility**:  
     - Public release of anonymized tournament data, agent code, and evaluation metrics.  
     - Collaboration with external experts to audit results for artifacts.  

  ### IV. Definition of Success
  For the committee to deem the project successful (beyond technical achievement), it must demonstrate:  
  1. **Robust Commitment**: Cooperation persists in tournaments where:  
     - Agents cannot trivially "copy" each other (e.g., via unique strategy constraints).  
     - Commitment strategies withstand adversarial conditions (deception, noise, or incomplete code access).  
  2. **Generalizable Insights**: Evidence that program equilibria:  
     - Reduce exploitation rates compared to non-transparent baselines.  
     - Scale to games with >2 agents or asymmetric information.  
  3. **Theoretical-Practical Bridge**: A pathway to apply findings to real AI systems (e.g., commitments using limited code hashes or formal verification).  

  ### V. Failure Modes and Mitigations
  - **Risk of Artifacts**: If cooperation collapses under partial transparency, results may be tournament-specific.  
    *Mitigation*: Applicants must analyze failure modes (e.g., "commitment brittleness") to advance theory.  
  - **Scalability Limits**: If equilibria require unbounded computation, real-world applicability is low.  
    *Mitigation*: Track computational costs and benchmark against simpler cooperation mechanisms.  

  ### VI. Timeline and Next Steps  
  - **Month 1**: Project kickoff; finalize tournament variants.  
  - **Months 2–9**: Run core + variant tournaments.  
  - **Month 12**: Progress review. Committee votes on Year 2 funding.  
  - **Month 24**: Final report (if Year 2 approved).  

  **Vote Request**: Approve Phase 1 funding ($XXX,XXX) with conditions above.  
  **Deadline for Vote**: November 2, 2023.  

  This conditional approval balances innovation with rigor. The project could pioneer methods for AI commitment—but only if it transcends the transparency idealization. The progress review ensures we redirect resources if results are artifacts.  

  **Attachments**:  
  - Full proposal #2312  
  - Reviewer comments (annotated)  
  - Draft grant agreement (Conditional Phase 1)  

  ---  
  **Chair’s Signature**  
  Approved to circulate for vote.
