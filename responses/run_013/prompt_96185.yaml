answer: |-
  The core issue you're facing is a well-known limitation of instant-runoff voting (IRV), specifically its failure of the Condorcet criterion and independence of irrelevant alternatives (IIA). Here's what happened and why:

  In your first vote, O was the Condorcet winner—it would have beaten both P and M in head-to-head matchups (8-5 each). But IRV eliminated O first because it had the fewest first-place votes, letting P win. This violates the Condorcet criterion: a system should elect a candidate preferred over all others in pairwise comparisons if one exists. IRV doesn't guarantee this because it only considers first-place rankings in early rounds, ignoring lower-ranked preferences until later.

  Your second vote introduced R, an option with strong support from two people but universally disliked by others. R's presence changed the elimination order: when R was eliminated, its votes flowed to O, and later M's votes also went to O, making O win. Crucially, no one changed their preference between O and P—eight still preferred O to P—but the addition of R altered the outcome. This violates IIA: adding a losing option (R) shouldn't change the winner between the original options. IRV fails here because it sequences eliminations based on first-place votes, and adding alternatives can reshuffle that sequence.

  Ana's diagnosis isn't entirely correct. IRV isn't a "scam"—it avoids vote-splitting and usually works well in simple cases—but it has mathematical flaws. Her proposed fixes have trade-offs:
  - **Score voting** (rating options 0–5): Fixes some IRV issues (e.g., it wouldn't eliminate O first) but introduces new problems. People might strategically rate options (e.g., giving rivals low scores to boost their favorite), and the winner could be unpopular with a majority. In your first vote, if O's supporters rate it 5 and P/M 0, and P/M supporters do the same to O, a moderate option might win with middling scores despite O being the Condorcet winner. You also lose ranking information—how voters compare options directly.
  - **CTO dictatorship**: Solves tactical voting but sacrifices team buy-in and collective wisdom. For a startup, morale costs could outweigh efficiency gains.

  For your internal process, switch to a **Condorcet method**:
  - Use the **Ranked Pairs** or **Schulze method**. These systems tally all head-to-head matchups first. If an option beats every other pairwise (like O did), it wins. If not (e.g., a cycle where A>B, B>C, C>A), they resolve it by the strength of victories. In both your votes, O would have won, matching majority preferences.  
  - Why it works for you: With 13 voters, counting pairwise preferences is feasible (e.g., via a shared spreadsheet). It respects the will of the majority in direct comparisons and isn't swayed by irrelevant options. The cost is slightly more complex tallying, but for quarterly planning, this is manageable.  
  - **Don't use IRV internally**. Its failures in these votes undermine trust, and Condorcet methods better reflect your team's preferences.

  For your survey tool, **ship IRV with transparency**:
  - IRV is standard for public polls, simple to understand, and handles vote-splitting better than plurality voting. Customers expect it.  
  - Add this to the docs: *"Results are calculated via instant-runoff voting (IRV). Note: In rare cases, IRV may not select an option preferred by a majority over all others in head-to-head comparisons, and adding or removing options can affect the outcome."*  
  - Avoid overcomplicating the product. Offering multiple methods (e.g., Condorcet) confuses most users. If advanced customers request alternatives, consider a premium feature later.

  **The deeper takeaway**: All voting systems have flaws due to Arrow's Impossibility Theorem—no method can be perfectly fair, consistent, and strategic-voting-proof with 3+ options. What matters is choosing a system whose failures align with your priorities. For your team roadmap, prioritize accurate majority representation (Condorcet methods). For your product, prioritize simplicity and standard practices (IRV with clear disclaimers). Neither is perfect, but both can be defensible when their trade-offs are acknowledged. Next quarter, run the Condorcet method internally, and ship IRV with honest documentation.
