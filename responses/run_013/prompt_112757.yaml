  The emotional tone matters here. Farmworker vulnerability must land with moral weight, but not melodrama. The "not collecting profits" line should echo in the refusal paragraph - that's the user's own language showing where their sympathy lies. 

  For the recommendation, conditional approval felt necessary but insufficient. Adding the "emergency use only" restriction creates meaningful friction while acknowledging farming realities. The sunset clause forces data collection - important because the user hinted at distrusting industry assessments.

  Biggest challenge was the "where I come out" section. Had to show why this isn't just splitting the difference. Focusing on the 20x risk gap as too large for comfort, plus the power imbalance, makes it principled rather than arbitrary. The "no safe harbor" line counters the midpoint argument effectively.

  Watching for length constraints too. The "choice in front of us" section deliberately short to leave room for the justification. What gets minuted is crucial - it's the user's paper trail. Explicitly noting the department's higher estimate protects against future liability.

