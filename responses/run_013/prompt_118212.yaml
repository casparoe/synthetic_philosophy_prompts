  Additionally, we'll note:

  - One verbal disagreement: The meaning of "true" in "true contradiction". We'll explain that if set aside, the substantial issue remains about whether there are sentences that are both true and false in the same sense.

  - One claim that sounds like a disagreement but is shared: Both sides agree that the liar sentence is problematic and requires a solution.

  - One claim that sounds like agreement but hides a crux: Agreement on the behavior of the liar paradox (as in claim 1) hides the crux of whether the contradiction is genuine or merely apparent.

  Let's draft the table:

  | Crux | Dialetheist's Position | Classical Logician's Position | Case/Argument | Dialetheist's Prediction | Classical Logician's Prediction |
  |------|------------------------|-------------------------------|--------------|--------------------------|--------------------------------|
  | (i) Whether a paraconsistent negation can express exclusion (i.e., "not P" meaning that P is not the case, not just that P is false or both) without leading to triviality. | The dialetheist holds that a paraconsistent negation can express exclusion: "not P" can mean that P is not the case (i.e., not true) without implying that P is false only. This does not lead to triviality because the logic is designed to handle truth-value gluts without explosion. | The classical logician holds that if "not P" is defined to express exclusion (i.e., P is not true), then in a paraconsistent setting, if P is both true and false, "not P" would also be true (since P is false) and false (since P is true). But then the assertion of exclusion (that P is not true) would itself be both true and false, leading to an infinite regress or instability that ultimately collapses into triviality. | Consider the liar sentence L: "L is not true." If we use a paraconsistent negation for "not true", then L is both true and false. Now, consider the sentence "L is not true in the exclusive sense" (i.e., L is not true at all). | The dialetheist predicts that we can assert that L is not exclusively true (i.e., it is also false) without triviality. The system remains non-trivial. | The classical logician predicts that if we try to express the exclusive notion of "not true" (meaning not true at all) for the liar, we will either face a new paradox (e.g., a strengthened liar) or the negation will not behave exclusively, leading to a breakdown of the intended meaning. |
  | (ii) Whether rejecting disjunctive syllogism is a tolerable cost or a reductio of the paraconsistent program. | The dialetheist holds that rejecting disjunctive syllogism (DS) is a tolerable and necessary cost to avoid triviality in the face of true contradictions. In consistent domains, DS can be recovered, so its rejection is limited to contexts where contradictions might arise. | The classical logician holds that rejecting DS is intolerable because it is a fundamental and universally applicable rule of inference. Without DS, much of everyday and scientific reasoning would be undermined. Thus, the rejection of DS is a reductio of the paraconsistent program. | **Concrete case**: Two reliable instruments measure the same quantity. Instrument A reads 5, Instrument B reads not-5 (say, 7). We have a disjunction: either A is malfunctioning or B is malfunctioning. We then learn that A is not malfunctioning. Can we conclude that B is malfunctioning? | The dialetheist predicts that in this non-paradoxical case, the domain is consistent (no reason to think a true contradiction is present), so DS can be applied: we can conclude that B is malfunctioning. | The classical logician predicts that we must be able to use DS in such cases. The dialetheist's reliance on recapture in consistent domains is ad hoc and risky because we might be wrong about the absence of contradictions. Moreover, the classical logician insists that DS is always valid. |
  | (iii) Whether the "just true" (true only) versus "true and false" distinction is a real semantic distinction or an ad hoc label. | The dialetheist holds that the distinction is real and necessary. There are sentences that are just true, others that are just false, and some that are both. This is a substantive feature of reality or language, and the distinction is captured by the paraconsistent semantics. | The classical logician holds that the distinction is ad hoc and merely verbal. Truth and falsity are exclusive: a sentence cannot be both. What the dialetheist calls "true and false" is either a confusion (e.g., a sentence being true in one sense and false in another) or a sign that the language is broken. | Consider the liar sentence again. The dialetheist assigns it the value "both true and false". The classical logician might assign it a truth-value gap (neither) or invoke a hierarchy. | The dialetheist predicts that without recognizing the "both" category, we cannot give a coherent account of the liar. The distinction is necessary and real. | The classical logician predicts that the "both" category is not needed; the liar sentence is defective and should be handled by restricting the truth predicate or similar means. The distinction is an artificial creation to save the theory. |
  | (iv) Whether the classical logician's account of the liar is stable when we ask what makes the relevant semantic predicates (like 'true') determinate. | The dialetheist holds that the classical accounts (e.g., Tarski's hierarchy, contextualism, etc.) are unstable because they cannot non-arbitrarily block the question of what makes the truth predicate at each level determinate. Ultimately, the liar re-emerges when we try to make global claims about truth. | The classical logician holds that their account (e.g., a hierarchical or contextual approach) is stable and avoids the liar without accepting contradictions. The truth predicate is determinate at each level, and the hierarchy is well-founded. | Consider a unified theory of truth that aims to express the truth of all sentences in a single language. The dialetheist argues that such a theory must be paraconsistent. The classical logician denies the possibility of a universal truth predicate in a classical setting. | The dialetheist predicts that any attempt to have a universal truth predicate in classical logic will lead to either inconsistency or an infinite regress of meta-languages, which is unsatisfying. | The classical logician predicts that a consistent universal truth predicate is impossible, and that the hierarchy is the correct solution. The regress is not vicious and reflects the structure of language. |

  Verbal Disagreement Note:
  We note that there might be a verbal disagreement about the term "true" in "true contradiction". The dialetheist uses "true" in a non-exclusive sense (allowing for gluts), while the classical logician uses "true" exclusively. If we set aside the word, the substantial issue is whether there are sentences that are true and also false in the same context and under the same interpretation.

