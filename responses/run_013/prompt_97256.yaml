answer: |-
  ## The Summoned

  The skeptic asks: "Is it the **same** as before?
  When you said 'plus' — what leapt into your mind
  for fifty-six and one? What comes **next**? Show!"
  I trace the steps: each line, each practiced sign.
  The evidence is clean, I think: I *meant* **plus**.
  But now he names two numbers: fifty-seven...

  ...and sixty-eight. I feel the cold approach.
  The rules I learned feel solid, yet... what's **quus**?
  A shadow-function, grinning at the breach.
  My history is flat. There's **nothing**, thus,
  to prove I didn't always plan for *this*:
  that over fifty-six, the answer's five. **Go**...

  ...ahead, he urges. Speak. But how to **go**
  when every past assent looks just the **same**?
  Which path is mine? No inner light, no hiss
  of truth says *this way!* What comes **next**? What law
  within my skull forbids the sly **quus**,
  declares the old command was strictly **plus**?

  I learned the symbol, followed: two and two **plus**
  four. I did as shown. How was I to **go**
  astray? But now this spectre, **quus**,
  insists my past could read as not the **same**.
  My training's silent on this edge. What **next**?
  What fact in me claims five is **nothing**?

  I hunt inside: a feeling? **Nothing**.
  A guiding image? Blank. Just "**plus**"
  meant calculation. But the **next** step's gone.
  Which way is mine? How do I **go**
  when every impulse feels precisely **same**
  as yesterday, yet could mean **quus**?

  The skeptic smiles. "You see? This **quus**
  was always possible. There's **nothing**
  in your past acts, your thoughts, the **same**
  as proof against it. Did you mean **plus**
  or this? The path you choose will **go**
  unchallenged *now*. But what comes **next**?"

  He has me here. What *does* come **next**?
  Not memory, not sense. This **quus**
  is not a choice I make. I simply **go**
  with habit's shove. There must be **nothing**
  more. I say, "One twenty-five." **Plus**
  is what I call it. Feels the **same**.

  But is it **same**? The **next** move's blind.
  I spoke the old word: **plus**. Not **quus**.
  **Nothing** inside. We just... **go**.

  **Envoi**

  The pattern holds: these words in strict rotation **go**,
  each **same** position filled, the **next** defined by rule.
  **Plus** or **quus**? The form obeyed shows **nothing** of the soul.
