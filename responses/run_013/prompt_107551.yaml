  - **Systems neuroscientist’s "where are the strata in my data?"** (Reply: Task-level decoding vs. spike-train analysis. Soft: Handwavy.) 

  Pray no one asks: "If the physical realiser fully determines the effect’s probability distribution, how can the mental property ‘select’ an outcome without magic?" (Best reply: It doesn’t select; it *is* the selection—but this risks circularity.) 

  Final note: The position’s survival hinges on the parity argument landing. If ecology’s "predator-prey dynamics" causation is accepted, mental causation gets identical footing. If not, it’s dead.
answer: |-
  ### Q&A Prep Sheet: Stratified Causation Defence  
  *(Ordered by damage potential if fumbled)*  

  ---

  **1. Interventionist Philosopher of Science**  
  *Objection:* "You claim mental properties are difference-makers in a different stratum, but can you specify the variables and interventions that would test this? If I intervene on the mental property while holding the physical realiser fixed—say, changing belief without altering neural states—your theory predicts the outcome changes. But that’s impossible without dualism. Your ‘strata’ look like verbal sleight-of-hand to avoid formal causal modelling."  
  *Reply:* "Interventions must respect supervenience: you *can’t* change the mental while fixing the physical. But intervene *on the physical realiser* while the mental property covaries—e.g., stimulate neurons to alter both spike patterns and the belief they realise. The mental property will correlate with outcomes the physical variable doesn’t fully predict, like behavioural flexibility across contexts. *Soft spot:* This relies on coarse-graining mental variables, which interventionists may reject as non-fundamental."  

  **2. Non-Reductive Physicalist (Exclusion Worrier)**  
  *Objection:* "If the physical realiser ‘fixes the mechanism’, and the mechanism determines all possible outcomes, how can the mental property ‘select’ the outcome without adding physical energy or information? This sounds like mental properties are *structuring causes* (à like Dretske), but that’s epiphenomenalism in disguise—they don’t *do* anything."  
  *Reply:* "They *do* something: they determine which physically possible outcome occurs. Think of a neuron firing: the physical state fixes the spike’s electrochemical parameters, but its *role* in a decision circuit (e.g., ‘detecting danger’) determines whether it contributes to ‘flight’ or ‘freeze’. Same spike, different outcomes. *Soft spot:* This may concede too much to causal minimalism—it doesn’t show mental properties *add* causal power."  

  **3. Systems Neuroscientist**  
  *Objection:* "I study decision-making circuits. When I record neural ensembles, I see physical states (spike trains, LFP) fully correlate with behaviour. Where’s the ‘mental stratum’ in my data? If I can predict choices from physics alone, why invoke extra layers?"  
  *Reply:* "Because your predictions rely on interpreting neural patterns *as* representations. When you decode ‘hunger’ from hypothalamic activity, you’re not just tracking ions—you’re tracking a *functional state* that could be realised by other mechanisms. Destroy that circuit, and a new one may take over (‘hunger’ remains, physics differ). That’s the stratum: same outcome-type, variable mechanisms. *Soft spot:* This may sound like I’m re-describing your work, not adding insight."  

  **4. Eliminativist Philosopher**  
  *Objection:* "This is folk psychology with extra steps. You say mental properties ‘fix outcomes’, but ‘beliefs’ and ‘desires’ aren’t natural kinds. Neural reuse and degeneracy show cognition isn’t stratified—it’s just dynamic, distributed physics. Your ‘strata’ are relics of linguistic habits."  
  *Reply:* "Then reject *all* special sciences. Epidemiology’s ‘viral load’ isn’t a microphysical kind either, but we use it because it predicts outcomes physics alone can’t organise (e.g., superspreader events). If mental properties are similarly projectible and intervention-supporting, they’re real *for the stratum they govern*. *Soft spot:* Concedes mental properties may be provisional—but that’s consistent with realism about science-in-practice."  

  **5. Cellular Neuroscientist**  
  *Objection:* "I work on synaptic transmission. If I mutate a receptor and behaviour changes, the cause is physical. Your ‘stratified causation’ seems irrelevant to my lab’s causal explanations. Why shouldn’t I ignore it?"  
  *Reply:* "You shouldn’t—but you already use strata. When you say ‘this receptor regulates fear memory’, you’re invoking a *functional* stratum. The mutation matters because it disrupts a system-level property (‘memory consolidation’), not just because it alters protein folding. Stratification is how we bridge molecules to cognition. *Soft spot:* May seem like I’m appropriating your success without offering new tools."  

  **6. Classicist**  
  *Objection:* "Isn’t this just Aristotle’s formal cause repackaged? The physical realiser is the efficient cause (the ‘how’), and the mental property is the formal cause (the ‘what it’s for’). Why the new jargon?"  
  *Reply:* "Partly, yes! But Aristotle’s causes aren’t causal *in the modern sense*. I’m claiming both are difference-makers, but *at different levels of granularity*. The formal cause isn’t ‘for-ness’—it’s a set of constraints determining which physical pathways are utilised. *Soft spot:* This risks alienating naturalists who distrust teleology."  

  **7. Non-Reductive Physicalist (Parity Skeptic)**  
  *Objection:* "Your parity argument fails. Ecology *isn’t* threatened by exclusion because ‘predation’ isn’t claimed to be distinct from its physical basis. But you want mental properties to be both distinct *and* causal. That’s overreach."  
  *Reply:* "Ecology *is* distinct: ‘predation rate’ isn’t just the sum of individual attacks—it’s a population-level variable that explains ecosystem stability. Similarly, ‘pain’ isn’t just C-fibre firing—it’s a nociceptive signal with systemic consequences. Both are irreducible and causal. *Soft spot:* Assumes a controversial view of special-science causation."  

  **8. Philosopher of Science (Interventionist #2)**  
  *Objection:* "If mental properties supervene on physical ones, they’re causally inert by the supervenience argument. Your ‘strata’ evade this only if they violate exclusion’s completeness premise. Are you denying physical causal closure?"  
  *Reply:* "No—physical closure holds *within* the physical stratum. But completeness isn’t exhaustive: it doesn’t preclude higher-level variables *reorganising* lower-level causes. Example: A brain region’s ‘attentional modulation’ (mental) redirects neural resources, but all *motions* are physical. *Soft spot:* Pushes against standard interpretations of closure."  

  ---

  **Preemptive Concession (First Minute):**  
  > "Before questions: I concede one point upfront. Stratified causation *does not* add new physical forces. Mental properties don’t inject energy or violate physics. What they do is *structure* which physical pathways are activated, turning ‘could-have-beens’ into ‘what-is’. If that sounds like epiphenomenalism to you, I’ll explain why it’s not—but let’s start from honesty."  

  **Make-or-Break Objection:**  
  *Interventionist’s "Operationalise strata!"* (Objection #1 above).  
  *Why this one?* If you can’t formalise strata in causal models, the position looks unscientific. The neuroscientists will dismiss it, and the physicalists will see it as hand-waving. Your reply *must* sketch a testable intervention (even if idealized) to retain credibility.  

  **Question You Hope Nobody Asks:**  
  *"If the physical realiser determines all possible outcomes, and the mental property just ‘selects’ one, isn’t the selection itself physically determined? If so, how is the mental property causal rather than a passive label?"*  
  *Reply if asked:* "Because ‘selection’ *is* the causal work. In a chaotic system, microscopic differences (e.g., quantum noise) could lead to divergent outcomes. The mental property—as a stable functional state—constrains which divergences matter. Example: A ‘decision threshold’ in cortex collapses probabilistic firing into a binary choice. Without it, noise dominates. *But:* This invokes indeterminism, which many reject."  

  ---  
  **Final Note:** Your position is closest to **contrastive causation** (Schaffer) + **causal pragmatism** (Woodward). The novelty is framing it as *stratum-relative screening-off* and pushing the parity argument hard. The room will attack this as old wine in new bottles—lean into that: "Yes, and here’s why that bottle solves the spillage problem." Survive the interventionists, and the rest will follow.
