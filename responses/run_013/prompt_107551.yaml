  The user’s core innovation—rejecting Kim’s "single ledger" by decoupling mechanism-specifying (physical) and outcome-selecting (mental) causation—must withstand three lethal tests: 
  1. **Interventionist rigor**: Can strata avoid being a verbal fix without mathematical footing? 
  2. **Neuroscientific plausibility**: Does "outcome selection" map to any neural process? 
  3. **Metaphysical coherence**: Why isn’t the physical still sufficient alone? 

