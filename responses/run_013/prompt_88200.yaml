  First, I need to address their causal argument. The user says if "because" is causal, it's just psychology, not a content-based distinction. I should concede that point quickly but pivot to norms. Then they challenge the normative reading, arguing it turns the distinction into one about how we treat sentences, not about truths. Here, I need to reframe: the norms are tied to linguistic commitments inherent in the statements themselves, not just attitudes. The distinction is between what's required for semantic competence versus what's open to evidence.

