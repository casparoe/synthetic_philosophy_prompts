answer: |-
  Your challenge cuts to the core. You're right: the 'because' is normative, not causal. I concede completely that a merely causal story reduces to psychology and erases any *semantic* distinction. But granting that the 'because' is normative doesn't collapse the distinction into mere attitudes or policies *toward* sentences; it anchors it in the *internal structure* of the language itself. The constitutive norms of assertion govern *what it means* to use specific words with specific meanings. To sincerely assert "bachelor" while meaning *unmarried man* just *is* to commit oneself to "bachelors are unmarried." This commitment isn't an optional policy *about* the sentence; it is *constitutive of* what the word "bachelor" signifies *within that linguistic practice*. The distinction, therefore, *is* between statements: some statements express commitments *entailed by* the very meanings a speaker employs (like "bachelors are unmarried"), while others express commitments that go *beyond* those constitutive semantic rules and depend on how the world is arranged (like "bachelors are unhappy"). The truth of the former *within the language* is a consequence of the rules governing the terms; rejecting it isn't falsity, but *misuse* or *change of meaning*. The distinction tracks truth-conditional *structure* internal to the language system.

  You ask what's left of the distinction *as a distinction between truths*. It remains a distinction concerning the *source and nature of their truth-conditions*. For analytic truths (on this view), their truth is fixed *solely* by the semantic rules constitutive of the terms involved – their truth-condition is *met by definition* within the practice. For synthetic truths, their truth depends *additionally* on contingent facts about the world – their truth-condition requires verification beyond semantic competence. Saying "It's true *because* of the norms" doesn't make it *merely* normative; it means the truth-condition *is determined by* those norms. When you say "bachelors are unmarried," its truth isn't a separate metaphysical fact *beside* the meaning; its truth *consists in* the correct application of the meaning rules themselves. The distinction survives Quine's assaults because it doesn't require unrevisability (the norms can evolve), reductionism (meaning holism is compatible), or non-circular synonymy (we grasp the norms holistically). It identifies a functional difference *within* a linguistic framework: which sentences' acceptability is settled by mastering the framework's constitutive rules alone, and which requires empirical input. This difference governs *justification* and *defeasibility*, even if the line can blur or shift.

  *(Out of character: I find this deflationary normative grounding fairly robust (~85% confidence) – it captures the core intuition Quine missed. The shakiest commitment is explaining how *universal* defeasibility (including via meaning shift) doesn't completely erode the *local* stability of the distinction within a settled practice.)*
