prompt: |-
  I'm leading a 90-minute session for a graduate reading group in decision theory (eight students, all comfortable with basic real analysis). I want to teach the Pasadena paradox and the problem of undefined expected values, and I want a teaching plan rather than an explanation. I've devised a pair of games to carry the session: in the first, a fair coin is flipped until the first heads; if it takes n flips, you receive 2^n/n dollars when n is odd and pay 2^n/n dollars when n is even (so the expected value is the alternating harmonic series, conditionally convergent); in the second, the payoffs are 2^n/n^2 with the same sign rule (so the expected value is absolutely convergent). I want the students to discover why the first game's value is not well-defined even though the series converges, and why the second is safe. Please give me: the order in which the ideas must be introduced so that the problem emerges from the contrast rather than being announced; the carrying example (the two games) and what each must include and exclude to do its job; the misconceptions they'll predictably bring (e.g., that any convergent series gives a well-defined expected value, that rearranging outcomes can't change the value, that 'expected value' is just the long-run average) and exactly where in the sequence to head each off; the check for understanding at the end that would show they've grasped the difference between conditional and absolute convergence in this context; and what to leave out at this level. Structure your answer as: Sequence (about 350 words), Carrying example (200 words), Misconception map (300 words), Check for understanding (100 words), What to omit (100 words).
reasoning: |-
  Okay, the user is leading a graduate reading group on decision theory and needs a teaching plan focused on the Pasadena paradox. They've designed two games to illustrate conditional vs absolute convergence in expected value calculations. 

  Hmm, they're clearly an experienced educator - the query shows deep understanding of the mathematical nuances and pedagogical challenges. The request for a "teaching plan rather than explanation" suggests they want active learning, not lecture. Interesting that they specified exact word counts for each section - probably drafting a syllabus.

  Let me unpack their core needs: First, they want the paradox to emerge organically through contrast between the two games. Second, they need precise misconception targeting - especially the "convergent series equals well-defined EV" fallacy. Third, the assessment must verify conceptual grasp, not just computational skill. 

  The tricky part is sequencing. I'll start with Game 2 (absolutely convergent) to establish "normal" EV behavior, then introduce Game 1's conditional convergence. The coin flip simulation is crucial - when students see different truncation orders yielding different averages, the problem becomes visceral. 

  Major misconceptions to preempt: 
  - That rearrangement invariance applies to all convergent series (must kill this during partial sums comparison)
  - That long-run averages always stabilize (the truncation exercise disproves this for Game 1)
  - That conditional convergence is just a "math curiosity" without decision-theoretic consequences (hence the "would you play?" prompt)

  For the check, I'll avoid symbolic series proofs - instead focus on whether they can articulate why Game 1's EV depends on payoff ordering while Game 2's doesn't. The "how to fix Game 1" question tests transfer.

  Must omit measure-theoretic justification and Riemann series theorem proofs - real analysis comfort doesn't mean they need graduate functional analysis here. Also skipping St. Petersburg comparisons to maintain focus.

  The payoff sign rule is clever - by making odd/even matter, it naturally motivates rearrangement. And using n² vs n in denominators creates perfect pedagogical contrast. This user knows how to design teaching examples!
answer: |-
  ### Sequence (350 words)
  1. **Introduce Game 2 first** (payoff = \((-1)^{n+1} 2^n / n^2\)): Have students compute partial expected values for \(n = 1\) to \(5\). Highlight rapid convergence. Derive the full EV as \(\sum_{n=1}^\infty (-1)^{n+1} \frac{2^n}{n^2}\). Emphasize absolute convergence: ask them to sum absolute payoffs (\( \sum 2^n/n^2 \)) and note finiteness. Conclude: "EV = \(-\text{Li}_2(-2)\) ≈ $3.42\)."  
  2. **Simulate Game 2**: Students calculate running averages over 10, 20, 50 simulated plays (pre-generated sequences). Averages stabilize near $3.42. Stress: "Long-run average matches EV; no surprises."  
  3. **Introduce Game 1** (payoff = \((-1)^{n+1} 2^n / n\)): Compute partial EVs (\(n=1\): +$2, \(n=1-2\): \(2 - 2 = $0\), \(n=1-3\): \(2-2+8/3≈$0.67\), \(n=1-4\): \(0.67 - 4 ≈ -$3.33\)). Note oscillation. Derive series: \(\sum_{n=1}^\infty (-1)^{n+1} \frac{2^n}{n}\).  
  4. **Reveal the paradox**: "The series converges to \(\ln 2\) ≈ $0.69. But is this the EV?" Have students simulate Game 1 as before. Running averages *fail* to stabilize—some sequences hover near $0.69, others near $1.39, others negative. Contrast with Game 2.  
  5. **Diagnose divergence**: Compute absolute payoffs: \(\sum 2^n/n\) diverges. Show rearranged partial sums (e.g., group "win + loss": \( (2 - 2) + (8/3 - 4) + \cdots = 0 + (-4/3) + \cdots \rightarrow -\infty \)). Conclude: Order of summation matters.  
  6. **Connect to decision theory**: "EV requires summing payoffs *in outcome order* (by \(n\)), but real agents might consider outcomes in other orders (e.g., by payoff size). Game 1’s EV is ill-defined because absolute divergence allows rearrangement to alter the sum." Contrast with Game 2’s robustness.  

  ---

  ### Carrying Example (200 words)  
  **Game 1 (Conditional Convergence)**:  
  - *Must include*: Alternating sign dependent on \(n\) (not payoff size), payoff \(2^n/n\) growing exponentially.  
  - *Must exclude*: Any intrinsic ordering (e.g., by payoff magnitude). The \(n\)-ordering is fixed by coin-flip sequence.  
  - *Job*: Show partial sums oscillate wildly; simulations yield erratic averages; rearranged groupings (e.g., pairing outcomes) produce arbitrary sums. Reveals EV’s order-dependence.  

  **Game 2 (Absolute Convergence)**:  
  - *Must include*: Same sign rule, but payoff \(2^n/n^2\) decaying faster.  
  - *Must exclude*: Non-finite absolute series sum.  
  - *Job*: Establish baseline "good" EV: partial sums stabilize quickly; simulations converge reliably; rearrangements negligibly affect sums. Contrasts with Game 1’s pathology.  

  ---

  ### Misconception Map (300 words)  
  1. **"Convergent series ⇒ well-defined EV"**:  
     - *Emerge when*: Introducing Game 1’s series convergence to \(\ln 2\).  
     - *Head off*: Immediately after, via partial sums (\(n=1-4\) vs. \(n=1-5\)) showing sign-dependent volatility. Ask: "Would you pay $0.69 to play? What if your first 5 plays average -$5?"  

  2. **"Rearrangement can’t change the sum of convergent series"**:  
     - *Emerge when*: After deriving \(\ln 2\) for Game 1.  
     - *Head off*: Compute grouped sums (e.g., one win + two losses: \( \frac{2}{1} - \frac{2^2}{2} - \frac{2^4}{4} = 2 - 2 - 4 = -4 \)). Contrast with sequential sum. State Riemann series theorem: conditionally convergent series are rearrangement-sensitive.  

  3. **"Expected value = long-run average"**:  
     - *Emerge when*: Simulating Game 1.  
     - *Head off*: Show multiple simulation paths with *divergent* running averages (e.g., seed 1: averages → $1.2; seed 2: → -$0.5). Note: "No law of large numbers here—absolute divergence breaks it."  

  4. **"The problem is infinity—finite cases are safe"**:  
     - *Emerge when*: Discussing truncation.  
     - *Head off*: Ask: "If we cap at \(n=100\), EV is fixed. But is $0.69 the *right* finite approximation?" Show capped EV varies with truncation point (odd/even \(n\)), undermining uniqueness.  

  ---

  ### Check for Understanding (100 words)  
  **Prompt**: *"Game 3 pays \((-1)^{n+1} 2^n / \sqrt{n}\) on flip \(n\). Maria says its EV is well-defined since the series converges. Is she correct? Why or why not? How would you check?"*  
  **Expected Response**: No—absolute series \(\sum 2^n/\sqrt{n}\) diverges (terms grow), so EV is order-dependent. Check: Partial sums oscillate indefinitely; simulations won’t stabilize; rearrangements alter sums. Correctly contrasts with Game 2 (\(\sum 2^n/n^2\) converges absolutely) and aligns with Game 1’s pathology.  

  ---

  ### What to Omit (100 words)  
  - **Measure-theoretic justification** (e.g., failure of countable additivity).  
  - **Riemann series theorem proof** (invoke it intuitively via rearrangement examples).  
  - **Alternative resolutions** (e.g., weak expectations, discounting).  
  - **Generalizations to other paradoxes** (e.g., St. Petersburg).  
  - **Formal derivation of \(\sum (-1)^{n+1} 2^n/n = \ln 2\)** (assume convergence).  
  **Rationale**: Focus stays on *why* conditional convergence breaks EV uniqueness in a decision context. Graduate real analysis covers series convergence, so leveraging that foundation avoids technical digressions while illuminating the core paradox.
