answer: |-
  ## Proposal: The Dual Structure of Democratic Authorization: Prospective Selection, Retrospective Accountability, and the Logic of Term Limits

  **Research Question:**  
  Can prospective authorization (selection by a fair procedure) functionally substitute for retrospective accountability (the threat of removal) in generating democratic legitimacy, particularly when political ambition is absent, as exemplified by term limits and sortition?

  This is a determinate claim: A reader can disagree by arguing that retrospective accountability is *always* necessary for legitimacy, regardless of selection method or ambition; or that prospective authorization *cannot* perform accountability’s core functions (e.g., deterrence, information flow, correction); or that ambition is irrelevant to accountability’s necessity.

  **The Problem: A Gap in Defenses of Democratic Mechanisms**  
  Existing defenses of sortition, elections, and term limits fail to adequately address the core tension this project identifies:

  1.  **Sortition Advocates:** Focus almost exclusively on *prospective fairness* ("equal chance") as the source of legitimacy, downplaying or dismissing the need for retrospective accountability mechanisms, often arguing they are unnecessary or even harmful for "ordinary" citizens.
  2.  **Election Advocates:** Emphasize *retrospective accountability* ("throwing the bums out") as the cornerstone of legitimacy, often treating the prospective authorization via the initial election as secondary or merely enabling future accountability.
  3.  **Term Limit Advocates:** Defend limits primarily as anti-corruption/anti-entrenchment measures or to promote rotation, but rarely engage deeply with their fundamental alteration of the authorization-accountability nexus. They sever the link between action and *electoral* consequence without providing a substitute legitimacy mechanism, implicitly relying on prospective authorization alone.

  **The Core Insight:** Democratic authorization performs two distinct functions: (1) *Prospectively* legitimizing power through a procedure accepted *ex ante*; (2) *Retrospectively* legitimizing (or de-legitimizing) the *exercise* of that power through potential sanction *ex post*. These functions can be decoupled. Term limits exemplify this: the legislator possesses full *prospective* electoral authorization but faces *zero retrospective* electoral accountability. Conversely, a single-term randomly selected citizen possesses strong *prospective* authorization (via sortition's fairness) but also has *no retrospective* electoral accountability. The career politician combines both. **The critical question is: When, and to what extent, can robust prospective authorization *functionally substitute* for the absence of retrospective accountability in generating democratic legitimacy?** My hypothesis is that they are largely substitutes *where political ambition is low*; ambition creates the conditions where retrospective threats become necessary. If correct, this significantly weakens the main criticism of sortition (lack of accountability) and reveals term limits as a radical, under-theorized shift towards pure prospective authorization.

  **Methodology: Conceptual Analysis (3 Months)**  
  Empirical work (surveys, case studies) is premature. This project requires rigorous conceptual groundwork to define the core functions, mechanisms, and potential substitutability. Pure conceptual analysis is essential to:

  1.  **Disentangle Functions (Weeks 1-3):** Precisely define the distinct normative work done by:
      *   *Prospective Authorization:* What makes a selection procedure "fair" *ex ante*? What legitimacy claims does it generate (representation, fairness, acceptability)?
      *   *Retrospective Accountability:* What specific legitimizing functions does it serve *ex post* (deterrence, sanction, information gathering/response, correction, expression of popular will)? Are these functions inseparable?
  2.  **Model Substitutability (Weeks 4-6):** Develop a framework for analyzing when/if prospective authorization can fulfill the functions typically assigned to retrospective accountability. Key variables:
      *   *Ambition:* Does the absence of future political career aspirations reduce the need for deterrence/sanction? Does it alter the incentive structure fundamentally?
      *   *Time Horizon:* Does the lack of a future term impede *mid-course correction* or *information flow*? Are there alternative mechanisms?
      *   *Type of Decision:* Does substitutability vary for routine vs. high-stakes decisions?
  3.  **Stress-Test the Framework (Weeks 7-9):** Apply the framework systematically to the three key cases:
      *   *The Term-Limited Elected Official:* Has strong *prospective* auth, zero *retrospective* electoral accountability. Does legitimacy hold? If so, why? (Supports substitutability).
      *   *The Single-Term Random Citizen:* Has strong *prospective* auth (sortition fairness), zero *retrospective* accountability. Does the lack of accountability fatally undermine legitimacy, or can prospective auth carry the load? (Challenges the standard critique).
      *   *The Career Politician:* Has both. Is the combination necessary, or does it create specific pathologies (e.g., distrust rooted in perceived pandering for re-election)?
  4.  **Identify Limits & Counterarguments (Weeks 10-12):** Explicitly confront the strongest counterarguments:
      *   Accountability as essential information channel (beyond deterrence).
      *   The necessity of *ex post* sanction for grievous errors even without ambition.
      *   The potential for *prospective* auth to be undermined if actors know no *retrospective* check exists.
      *   Synthesize findings into a clear model outlining the conditions under which substitutability holds or fails.

  **Why Conceptual Work First?**  
  Surveys cannot resolve the *normative* question of functional substitutability. Case studies require a prior conceptual framework to know what to look for and how to interpret findings. Jumping to empirics risks imposing existing, potentially flawed, conceptual categories. This foundational work is necessary to generate precise hypotheses and identify relevant empirical indicators for future dissertation research.

  **Success Criteria:**  
  *   **Success:** A clearly articulated, logically rigorous conceptual framework that:
      1.  Definitively distinguishes prospective authorization and retrospective accountability functions.
      2.  Provides a plausible (even if contested) model for understanding their potential substitutability, centered on the role of ambition.
      3.  Generates specific, testable propositions about the legitimacy of term-limited bodies and single-term sortition bodies based on this substitutability.
      4.  Identifies clear points of disagreement and avenues for further research (empirical and normative).
  *   **Failure:** The project fails if it:
      1.  Cannot move beyond restating the initial observation (functions are distinct).
      2.  Fails to develop a coherent model of substitutability, leaving the relationship ambiguous.
      3.  Cannot generate specific, contestable claims about the legitimacy implications for term limits or sortition based on the framework.
      4.  Is unable to meaningfully engage with the strongest counterarguments.

  **Scope and Limitations:**  
  This proposal focuses *exclusively* on developing the conceptual framework. It will:

  *   **Include:** Rigorous definitions of core concepts (prospective authorization, retrospective accountability, ambition, substitutability, legitimacy); logical modeling of their relationships; analysis of term limits and single-term sortition through this lens; engagement with key counterarguments on conceptual grounds.
  *   **Exclude (for Dissertation):**
      *   Comprehensive empirical validation (historical case studies, surveys, experiments).
      *   Detailed institutional design proposals.
      *   Extensive comparative analysis of different selection mechanisms beyond the core contrast.
      *   Full engagement with the vast literature on democratic theory, accountability, sortition, and term limits beyond what's necessary to ground the core conceptual argument. (Citations for key positions will be added, but not a review).
      *   Analysis of non-electoral accountability mechanisms (e.g., legal, social) – the focus is on the *electoral* authorization-accountability nexus and its decoupling. Non-electoral mechanisms are crucial context but not the core subject.

  **Conclusion:**  
  This project tackles a fundamental but overlooked fissure in theories of democratic authorization: the decoupling of its prospective and retrospective functions. By rigorously analyzing whether and when prospective authorization can substitute for retrospective accountability – particularly in the absence of political ambition, as institutionalized in term limits and inherent in single-term sortition – it aims to transform debates on sortition's legitimacy and reveal the radical implications of term limits. Three months of dedicated conceptual work is essential to establish this framework, enabling future empirical and normative research in the dissertation to build upon solid theoretical foundations. The outcome will be a set of clear, debatable propositions that reframe how we understand the legitimacy of core democratic institutions.
