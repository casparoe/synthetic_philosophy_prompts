prompt: |-
  I'm putting together a unit for a graduate semantics-and-pragmatics course on slurs, and I've reached the point where I'd rather have the specification than another theory. Every account I read seems built to handle three or four examples and to stumble over the rest, and I've started to suspect that half the disagreement in this literature is really about what a theory of slurs is supposed to deliver rather than about the words themselves. So before I assign anything else, write me the desiderata: the full list of requirements an adequate account of slurs has to satisfy. For each requirement, give the case or consideration that motivates it — the linguistic phenomenon, the pattern of judgments, or the fact about usage that the theory has to accommodate or predict — and keep the weight on the criteria themselves rather than on scoring the contenders.

  I should say what I'll count as a requirement, because I don't want the list confined to what a semanticist would put on it. I do want the standard puzzles: how the derogatory content behaves when the word sits under negation, inside a conditional, or in reported speech; whether that content belongs to truth-conditional content or to some other dimension; what the relation is to the word's neutral counterpart, and what to say about the words that appear to have none; why the same string derogates in one language and is innocuous in another; why a word that is a slur in one use is an innocent homonym in another; why offensiveness varies in degree from word to word and from context to context. But I also want the requirements generated from outside semantics — from the fact that slurring is something we hold speakers responsible for, that hearers report being unable to hear certain words as neutral even when they want to, that members of the targeted group use the word among themselves and that this is not simply the same act, and that a speaker who doesn't know a word's history can still have done something with it. If any of these pull against the semantic requirements — if a requirement generated by the social facts can't be stated without already settling a semantic question — say so instead of smoothing it over.

  For each requirement, tell me whether it is non-negotiable or merely a preference of one camp, and flag any pair you think cannot be jointly satisfied. I expect the interesting result to be there: an account that locates the derogation in the content seems to collide with one family of cases, while an account that locates it entirely in use seems to collide with another, and I want that trade-off stated precisely rather than gestured at. Then identify the single requirement that eliminates the most candidate theories, and say which family of views it rules out. No reading list — I'm not asking you to cite anyone; I'll run the theories against your list myself.
reasoning: |-
  Okay, the user is putting together a graduate unit on slurs in semantics and pragmatics. They're frustrated because existing theories seem to handle only a few examples and stumble over others. They suspect disagreements stem from differing expectations of what a theory should deliver. So they want a comprehensive list of desiderata for an adequate account of slurs, with motivations for each requirement.

  The user wants both semantic and extra-semantic requirements. The semantic puzzles include how derogatory content behaves under negation, conditionals, and reported speech; whether it's truth-conditional or not; the relationship to neutral counterparts; cases where neutral counterparts are missing; cross-linguistic variations; homonyms; and variability in offensiveness.

  Beyond semantics, they want requirements from social dimensions: speaker responsibility, hearer perception, in-group usage, and cases where speakers are unaware of a word's history but still cause offense.

  For each requirement, I need to specify if it's non-negotiable or a preference, and flag any conflicting pairs. The user also wants to know which requirement eliminates the most theories and which views it rules out.

  Let me break down the requirements into semantic and extra-semantic categories. Starting with semantic ones:

  1. **Embedding Behavior**: How slurs behave in complex sentences. This includes negation, conditionals, questions, modals, and attitude reports. The key is that derogation often persists even when truth conditions are negated. For example, "He's not a k*ke" still feels offensive. This is non-negotiable and conflicts with truth-conditional accounts.

  2. **Truth-Conditional Status**: Whether the derogatory content affects truth conditions. Some theories place it in conventional implicature or expressive content. Non-negotiable, and it causes issues for truth-conditional theories when combined with embedding behavior.

  3. **Neutral Counterpart Relation**: Most slurs have neutral counterparts (e.g., "n*gger" to "Black person"). The theory must explain this link and account for slurs without counterparts (e.g., "slut"). Non-negotiable. Views that rely on counterparts struggle with those that don't have them.

  4. **Cross-Linguistic Divergence**: The same word can be a slur in one language but harmless in another (e.g., "negro" in Spanish vs. English). Non-negotiable, problematic for theories tying offensiveness solely to semantics.

  5. **Homonymic Neutrality**: Words that are slurs in one context but neutral in another (e.g., "gay" as slur vs. descriptive). Non-negotiable. Theories must explain this contextual variation.

  6. **Gradability of Offense**: Some slurs are more offensive than others, and offense varies by context. Non-negotiable. Semantic-only theories might struggle with context-dependency.

  Now extra-semantic requirements:

  7. **Speaker Responsibility**: Speakers are held accountable for using slurs, regardless of intent. Non-negotiable. This conflicts with theories that reduce offensiveness to speaker intention.

  8. **Hearer Perception**: Hearers often can't interpret slurs neutrally even if intended innocently. Non-negotiable. Challenges theories where meaning is speaker-determined.

  9. **In-Group Appropriation**: When targeted groups use slurs among themselves, it's different from out-group use. Non-negotiable. Theories must account for this without overgeneralizing.

  10. **Ignorant Speaker**: A speaker unaware of a word's history can still offend. Non-negotiable. Problematic for theories requiring speaker knowledge.

  Possible conflicts:

  - **Truth-Conditional Status vs. Embedding Behavior**: If derogation is part of truth conditions, negation should cancel it, but it doesn't. So truth-conditional theories fail here.

  - **Speaker Responsibility vs. Hearer Perception**: If offensiveness depends on speaker intention, but hearers are offended regardless, there's a conflict.

  - **In-Group Appropriation vs. Semantic Accounts**: Semantic views might struggle to explain why the same word isn't derogatory when used in-group.

  The requirement that eliminates the most theories is **Embedding Behavior**. It rules out truth-conditional accounts because they can't explain why derogation persists under negation or in conditionals. Most other theories (expressivist, conventional implicature) handle this better.

  I need to ensure each requirement is clearly motivated by specific phenomena and that conflicts are explicitly stated. The user wants precision, so avoiding vague descriptions is key. Also, emphasizing which points are non-negotiable versus debatable within the field.
answer: |-
  Below is a comprehensive specification of desiderata for an adequate account of slurs, structured as requested. I focus exclusively on the requirements themselves, their motivations (grounded in linguistic patterns, empirical observations, or social facts), and their status (non-negotiable vs. contested). Conflicts between requirements are explicitly flagged, and the most eliminative requirement is identified at the end. The list is partitioned into **semantic-pragmatic requirements** (addressing core linguistic behavior) and **extra-semantic requirements** (arising from social, psychological, or normative dimensions), reflecting your emphasis on breadth.

  ---

  ### **I. Semantic-Pragmatic Requirements**  
  *These address the core linguistic machinery: truth conditions, compositionality, context-sensitivity, and relations to neutral language.*

  1. **Embedding Behavior**  
     - **Requirement**: The account must explain how the derogatory content of slurs projects (or fails to project) under logical operators (negation, conditionals, modals, questions) and in attitude reports (e.g., belief ascriptions).  
     - **Motivation**: Negation ("He's not a k\*ke") often retains derogatory force; conditionals ("If he's a f\*g, avoid him") typically implicate the speaker endorses the derogation; in belief reports ("She thinks he's a ch\*nk"), offensiveness may persist independently of the reporter's attitude.  
     - **Status**: Non-negotiable. Failure here collapses distinctions between slurs and descriptive pejoratives.  
     - **Conflicts**: Pulls against truth-conditional accounts (e.g., if derogation is part of truth-conditional content, negation should cancel it, but it doesn't).

  2. **Truth-Conditional Status**  
     - **Requirement**: The account must specify whether the derogatory content contributes to truth conditions (e.g., as part of propositional content) or operates non-truth-conditionally (e.g., as conventional implicature, presupposition, or expressive content).  
     - **Motivation**: Slurs often share truth-conditional equivalence with neutral counterparts ("k\*ke" and "Jewish person" refer to the same group in literal uses), yet differ radically in offensiveness.  
     - **Status**: Non-negotiable. Central to semantic-pragmatic division of labor.  
     - **Conflicts**: Incompatible with views that fully assimilate slurs to truth-conditional content (e.g., certain descriptivist theories).

  3. **Neutral Counterpart Relation**  
     - **Requirement**: The account must explain the systematic relationship between slurs and their neutral counterparts (e.g., "n\*gger" → "Black person"), including cases where counterparts are absent (e.g., "slut" lacks a precise neutral equivalent) or ambiguous (e.g., "tranny" may refer to transgender identity or mechanical parts).  
     - **Motivation**: Most slurs have clear counterparts, enabling "dual-act" explanations (e.g., derogating + grouping), but exceptions exist.  
     - **Status**: Non-negotiable. Absence would render the phenomenon incoherent.  
     - **Conflicts**: Challenges theories that treat counterpart relations as definitional (e.g., presuppositional accounts), as they struggle with "counterpart-less" slurs.

  4. **Cross-Linguistic Divergence**  
     - **Requirement**: The account must explain why identical or similar strings function as slurs in one language but not another (e.g., "negro" is neutral in Spanish but a slur in English; "jap" is derogatory in English but innocuous in Dutch).  
     - **Motivation**: Demonstrates that offensiveness is not intrinsic to phonology/syntax but depends on socio-historical context.  
     - **Status**: Non-negotiable. Undermines innatist or purely formal semantic accounts.  
     - **Conflicts**: Tensions with accounts that ground offensiveness in lexical semantics alone.

  5. **Homonymic Neutrality**  
     - **Requirement**: The account must explain why homonyms can function as slurs in one context but neutrally in another (e.g., "gay" as slur vs. descriptive term; "spaz" as slur for disabled people vs. neutral "spastic" in medical contexts).  
     - **Motivation**: Shows that offensiveness is not tied to the word-form but to specific uses/targets.  
     - **Status**: Non-negotiable. Highlights context-dependence.  
     - **Conflicts**: Problematic for semantic externalism (where meaning is fixed by reference).

  6. **Gradability and Context-Sensitivity of Offense**  
     - **Requirement**: The account must predict why offensiveness varies by word (e.g., "n\*gger" > "crip" in intensity), context (e.g., ironic vs. hostile use), and speaker identity (e.g., in-group vs. out-group use).  
     - **Motivation**: Offense is scalar and contextually modulated (e.g., historical weight, speaker intent, community norms).  
     - **Status**: Non-negotiable. Empirical data shows offense is not binary.  
     - **Conflicts**: Hard to reconcile with invariant semantic accounts (e.g., those positing fixed derogatory content).

  ---

  ### **II. Extra-Semantic Requirements**  
  *These arise from social, psychological, or normative facts, and may constrain semantic theories.*

  7. **Speaker Responsibility**  
     - **Requirement**: The account must explain why speakers are held morally responsible for using slurs, even when disavowing derogatory intent (e.g., "I didn't mean it that way").  
     - **Motivation**: Social practice treats slur-use as culpable, independent of speaker mental states.  
     - **Status**: Non-negotiable. Reflects real-world accountability practices.  
     - **Conflicts**: Directly challenges intention-based accounts (e.g., Gricean implicature theories) and may require semantic settling (e.g., conventionalism).  

  8. **Hearer Perception and "Earwitness" Effects**  
     - **Requirement**: The account must explain why hearers report an inability to "hear" slurs neutrally, even when context or intent suggests neutrality (e.g., in academic discussions or historical reenactments).  
     - **Motivation**: Psychological studies show automatic negative affect in hearers, suggesting derogation is not easily cancellable.  
     - **Status**: Non-negotiable. Empirical (psycholinguistic) bedrock.  
     - **Conflicts**: Pulls against pragmatic accounts where offensiveness is cancellable (e.g., conversational implicature).  

  9. **In-Group Appropriation Asymmetry**  
     - **Requirement**: The account must explain why in-group use (e.g., Black comedians using "n\*gger") can lack derogatory force or convey solidarity, while identical out-group use remains offensive.  
     - **Motivation**: Empirical observation of reclaimed slurs; shows offense is not solely determined by word-type or propositional content.  
     - **Status**: Non-negotiable. Central to sociolinguistic data.  
     - **Conflicts**: Challenges semantic accounts where derogation is lexically encoded (requiring auxiliary mechanisms) and pure use-theories (which may overgeneralize).  

  10. **Ignorant Speaker Offensiveness**  
      - **Requirement**: The account must explain how a speaker unaware of a slur's history or target can still perform a derogatory act (e.g., a child using "retard" without knowing its target).  
      - **Motivation**: Offense occurs despite speaker ignorance (e.g., language learners, historical shifts).  
      - **Status**: Non-negotiable. Reflects communal norms overriding individual knowledge.  
      - **Conflicts**: Undermines mentalist accounts (e.g., speaker intention theories) and may force semantic commitments (e.g., to conventional meaning).  

  11. **Resilience to Semantic Bleaching**  
      - **Requirement**: The account must explain why slurs often retain offensive potential even when semantically "bleached" (e.g., "jew" as verb meaning "to bargain" retains anti-Semitic connotations).  
      - **Motivation**: Historical drift (e.g., "gyp" from "Gypsy") shows offense outlives literal meaning.  
      - **Status**: Contested (some view this as pragmatic). Motivates non-semantic accounts.  

  ---

  ### **III. Key Conflicts Between Requirements**  
  *Explicit trade-offs where satisfying one requirement complicates another:*

  - **Truth-Conditional Status vs. Embedding Behavior**: If derogation is truth-conditional (Requirement 2), embedding under negation should cancel it, but it persists (Requirement 1). *Trade-off*: Truth-conditional accounts must explain projection asymmetries or abandon compositionality.  
  - **Speaker Responsibility vs. Hearer Perception**: If offense hinges on speaker intent (Requirement 7), hearers should be able to cancel derogation, but they cannot (Requirement 8). *Trade-off*: Forces a choice between speaker-centered or hearer-centered mechanisms.  
  - **In-Group Appropriation vs. Truth-Conditional Status**: If derogation is semantic (Requirement 2), in-group use should still be offensive, but it often isn't (Requirement 9). *Trade-off*: Requires contextual or parametric mechanisms that may overcomplicate semantics.  
  - **Ignorant Speaker vs. Conventionality**: If offense requires conventional meaning (Requirements 2, 7), ignorant speakers shouldn't offend, but they do (Requirement 10). *Trade-off*: Suggests offense is partly independent of convention.  

  ---

  ### **IV. The Most Eliminative Requirement**  
  **Embedding Behavior** (Requirement 1) eliminates the broadest family of candidate theories: **truth-conditional accounts**.  
  - **Why**: Truth-conditional views (e.g., slurs as carrying descriptive content like "despicable member of group G") predict that derogation embeds logically—e.g., negation should negate the despicability. However, derogation consistently projects (e.g., "not a k\*ke" still implies Jews are contemptible), falsifying this prediction.  
  - **Theories Ruled Out**: All accounts locating derogation solely in truth-conditional content, including certain hybrid descriptivist and pejorative-toned referentialist views.  
  - **Surviving Approaches**: Expressivist, conventional implicature, and presuppositional accounts handle projection better but face challenges elsewhere (e.g., with Requirement 9 or 10).  

  ---

  This list isolates the phenomena an adequate theory must address, forcing clarity on what is being explained (e.g., not just "derogation" but its specific behavior in embedding, appropriation, etc.). The conflicts highlight why the literature fractures: **accounts prioritizing semantic systematicity** (e.g., embedding) **clash with those prioritizing social dynamics** (e.g., speaker responsibility), and no theory dominates because each must sacrifice some desiderata. Use this to frame student evaluations—e.g., "Does theory X solve embedding but trivialize in-group use?"—and to expose the stakes of theoretical choices. If you need refinements (e.g., weighting desiderata by empirical robustness), I can expand.
