  ## The Unseeable Thousand

  The air in the Institute for Visual Statistics hummed with the quiet industry of translation. Sunlight streamed through tall windows, illuminating long drafting tables where figures were born. Not words, but people: simplified, standardized, gender-neutral human silhouettes, repeated with geometric precision. Houses. Loaves of bread. Factory chimneys. Droplets of water. This was the language of the Wall, built on the bones of an old dream – the Isotype system, refined for the digital-paper hybrids of Nova Veridia.

  Marta Vale, Chief Editor, ran a finger along a fresh printout. It showed the success of the city’s rainwater catchment program: neat rows of blue droplets, each representing 500 litres saved across ten districts. Satisfactory. Concrete. Undeniable. This was the grammar they lived by: transform complex data into countable, identical symbols. *Quantity by repetition, not scaling,* Neurath’s ghost whispered from the binders lining her office wall. A giant symbol for a larger number was subjective, emotional, prone to misinterpretation. A hundred identical figures was a hundred. Objective. Democratic. Anyone could count.

  "Tomas? Elara? Drafting Room Three," she called, her voice cutting through the scratch of pens and the soft *beep* of styluses on tablets.

  Tomas Zelen, angular and perpetually frowning over some conceptual snag, looked up from his screen where he was wrestling with unemployment figures. Elara Chen, whose hands moved with the swift certainty of a born drafter, carefully capped her inkwell before joining Marta.

  The air in Drafting Room Three felt heavier, charged with the unsaid. On the central table lay the report Marta had been dreading: the Public Health Oversight Committee’s analysis of the recent Lyssavir strain outbreak. The numbers were stark. Infection rates. Hospitalizations. Deaths. And then, the counterfactual projection: the estimated number of cases *prevented*, the lives *saved*, because the emergency vaccination program had been implemented in District Seven first, acting as a firebreak.

  Marta tapped the final figure. "This. The twelve hundred and forty-seven. How do we show them?"

  Elara leaned in, her eyes scanning the projections. "The saved? We show them… not being sick? Not being dead?" She sounded uncertain, a rare note for her.

  "Exactly," Tomas said, his voice tight. "The 'not'. The absence. How does the Wall show what *didn't* happen? How do we draw silence?" He picked up a standard human figure template, a smooth, featureless silhouette. "Do we draw twelve hundred and forty-seven of these… standing happily? That’s a lie. They weren’t gathered in a field having a picnic because of the vaccine. They simply… didn’t die. They are invisible."

  "But they are *real*," Elara countered, her Neurathian conviction flaring. "Twelve hundred and forty-seven concrete individuals who are alive *now*, specifically because of that decision. The vaccine was administered – that’s a positive act. The outcome is a positive fact: lower infection rates in the adjacent districts. We show *that* contrast. We show District Seven with minimal cases, the others higher. The 'saved' are implied in the differential." She gestured emphatically. "The Wall speaks in what *is*, in what we can point to, count, verify. Not ghosts, Tomas. Not hypotheticals. We force clarity. We make the world tangible, for everyone, not just those who can parse a regression analysis."

  Marta watched them, the report a cold weight in her hands. Elara was right about the power of the language. Its strength *was* its concreteness, its liberation from the tangled metaphysics lurking in words like "could have," "should have," "if only." It belonged to the street cleaner and the scholar alike. But Tomas’s unease resonated too. The report wasn't just about lower numbers; its entire moral urgency, its indictment of the delayed rollout in other districts, lay in that specific, vast absence – the lives *not* lost in District Seven. To imply them solely through a relative dip felt… insufficient. A dilution of the outrage.

  "And what about the ones the vaccine *could* have saved elsewhere, if rolled out faster?" Tomas pressed. "Do we imply *those* absences? Where does it end? The language imposes a boundary. It decides what counts as a fact worthy of depiction. Only the present positive. Only the manifest. But sometimes," he picked up the human figure template again, turning it in the light, "the most important truth is the scream of the empty space. Our grammar… it quietly defines 'reality' as only what we can *see*, and in doing so, it makes the counterfactual, the preventable, politically silent."

  He placed the template down precisely on a sheet of blank paper. "Look at him. Her. Them. This one figure. We decided it represents one person. But what *is* a person for the Wall? Born? Registered? Above a certain age? Choosing *what* to count, defining the unit… that’s not neutral data cleaning, Marta. That’s politics. That’s deciding whose existence even registers on the Wall."

  Elara shook her head, frustration etching lines around her eyes. "So we drown in ambiguity? We abandon the tool because it isn’t perfect? The verbal language is worse! It’s a hall of mirrors – 'potential lives,' 'statistical significance,' 'moral hazard.' Words that mean everything and nothing, that the powerful twist to suit themselves. The Wall forces specificity. One figure, one person. We count the vaccinated. We count the sick. We count the dead. We show the difference. That difference *is* the saved. It’s real, it’s calculable, and anyone can see it!"

  "Anyone can see *a* difference," Tomas retorted. "But will they see the *weight* of the decision? Will they see the ghostly crowd of the twelve hundred and forty-seven hovering behind District Seven? Or just a slightly smaller pile of coffin symbols next door? The language steers perception. It makes the counterfactual unimaginable, and therefore, politically weightless."

  Marta walked to the window. Below, Nova Veridia pulsed – a city of millions, each life a story too complex for any symbol. But stories didn’t change policy; clear, undeniable facts did. Or so they believed. The Institute’s mandate was to show the social body’s vital signs in a glance. How do you show a heart that kept beating because a valve was fixed, when all you can draw is the steady rhythm afterwards?

  "Let’s draft it both ways," she decided, turning back. "Elara, show me District Seven with minimal impact. Standard sickbed symbol, scaled for the low count. Tomas… I want to see your ghost crowd."

  Elara nodded sharply, returning to her precision. Tomas’s frown deepened, but he pulled a fresh sheet towards him.

  Hours passed. The scent of ink and paper grew stronger. Arguments flared over the scale. "One figure for fifty actual cases?" Elara questioned Tomas’s initial sketch. "Too dense. Unreadable. Neurath insisted on readability for the masses. One for a hundred."
  "One for a hundred makes twelve figures for the saved," Tomas argued. "It looks like a rounding error next to the thousands infected elsewhere. One for ten makes a hundred and twenty-five. Still manageable. It shows *volume*."
  "Volume implies presence," Elara shot back. "They aren't *present*. They are an absence!"
  "What is volume *of*, then?" Tomas countered, his stylus hovering.
  Marta intervened. "One figure for one hundred actual persons. For both the sick and… the concept. Consistency. We can’t change the scale mid-chart."

  Tomas grumbled but complied, beginning the meticulous task of placing one hundred and twenty-five identical human figures in a block beside District Seven's label. He chose a faint, warm yellow – the color sometimes used for projected needs or future populations. Not the vibrant green of health, not the stark black of death. A liminal shade.

  Elara worked swiftly on her version: District Seven dominated by a large, clear graphic of a syringe, surrounded by a mere handful of sickbed symbols. The adjacent districts bloomed with dense clusters of red sickbeds. The contrast was sharp, undeniable. The success of District Seven leapt off the page. The saved were present only as negative space, as the *lack* of red beds.

  Marta stood between the two drafts. Elara’s was clean, powerful, immediately legible. It shouted the effectiveness of the vaccine program in District Seven. Tomas’s was unsettling. The block of pale yellow figures beside District Seven was visually incongruous. What were they? Why were they there? They demanded an explanation the Wall couldn’t provide. Yet, their presence was haunting. You couldn’t ignore the block. It *was* a crowd. It represented *people who were not dead*. It made the avoidable loss elsewhere feel heavier, more accusatory.

  "The yellow block…" Marta murmured. "It *looks* like District Seven has an extra population."
  "It *does*," Tomas insisted quietly. "A population of the living who would be dead. It’s a fact."
  "But drawn that way, it implies a physical presence that doesn't exist," Elara said. "It risks misrepresentation. Our language doesn't have a symbol for 'counterfactually alive'. We have the syringe. We have the low sickness. That *is* the fact."
  "And the fact carries its own silence," Tomas replied, not looking up from the pale yellow figures he was meticulously aligning with a ruler.

  Marta felt the weight of the decision settle onto her shoulders, heavier than any report. Choosing wasn't just about aesthetics or clarity; it was a choice about what constituted reality on the Wall. Was the 'saved life' only a derivative of observable data points (vaccines administered, lower deaths)? Or was it a distinct entity, a positive fact in its own right – the *continued existence* directly attributable to the intervention? Elara’s approach honored the observable, the concrete, the Neurathian imperative against metaphysical phantoms. Tomas’s approach screamed that the most crucial truths were sometimes the ones you couldn’t photograph, the ones that lived in the space between what happened and what might have been.

  Both charts were truthful. Both were, in their own way, lies by omission. Both were political acts: one prioritizing demonstrable intervention and effect, the other demanding recognition for the vast, invisible cost of inaction elsewhere.

  Marta looked at the pale yellow crowd Tomas had conjured. They were silent. They had no faces, no stories. But they stood there, one hundred and twenty-five identical figures, each representing one hundred souls breathing air they might not have breathed. They were a monument to a decision, drawn in the only language they had, a language struggling to articulate the profound significance of *not*. Beside them, Elara’s stark contrast of red against calm spoke volumes about action and consequence, clear as sunlight.

  The Wall demanded a single chart. The city needed to see. Marta picked up her editing stylus, the cool metal a familiar anchor in the storm of the unsayable. The silence in the drafting room stretched, filled only by the distant sound of the city and the faint, persistent scratch of Tomas's ruler as he adjusted one pale yellow figure, making sure it stood perfectly straight, perfectly visible, perfectly impossible. Both truths remained, unresolved, pressing against the limits of their shared pictorial world. The decision hung, like the unseeable thousand, in the charged air.
