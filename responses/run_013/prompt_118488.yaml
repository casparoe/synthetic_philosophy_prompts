answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to meet your specifications. It targets the philosophical/computational tensions you described while being answerable from standard course material.  

  ---

  **Exam Question (20 marks total)**  
  *"It is sometimes claimed that classical mathematics is computationally conservative: for many classes of statements (e.g., Π₂ theorems like ∀n∃m P(n,m)), classical proofs can be algorithmically translated into constructive proofs, extracting programs from non-constructive existence arguments. If this is true, does the choice between classical and intuitionistic logic reduce to a matter of ‘taste’? Discuss this claim in light of the following: (a) Brouwer’s view that mathematical truth is constituted by mental constructions, and (b) Bishop’s approach to constructive mathematics as a methodology for obtaining computational content. To what extent does Bishop’s stance align with or diverge from Brouwer’s intuitionism? Conclude by evaluating whether computational conservativity alone resolves the disagreement between classical and intuitionistic logicians."*  

  ---

  **Model Answer (Approx. 750 words)**  
  The claim that classical logic is computationally conservative for certain classes of statements (e.g., via Gödel-Gentzen double-negation translation or Friedman’s A-translation) suggests that classical proofs can be mechanized to extract algorithms. For Π₂ statements (∀x∃y P(x,y)), this holds: a classical proof of existence can be transformed into a constructive one, yielding an algorithm for computing y from x. This might imply that classical logic is a "tool" that sacrifices no computational content for such problems, making constructivism a stylistic preference.  

  However, this view neglects the *semantic divergence* between classical and intuitionistic logic. Brouwer’s intuitionism holds that mathematical truth is *defined* by provability via mental constructions. For Brouwer, a proposition like "A ∨ ¬A" is not a tautology because truth requires a proof that *exhibits* A or refutes it. Classical logic, which treats truth as mind-independent (e.g., "A ∨ ¬A" holds regardless of human capacity to decide it), thus commits a category error: it speaks of "truth" in a way disconnected from the constructive activity of mathematics. For Brouwer, classical reasoning about infinite sets (e.g., "the set of all reals is complete") is not "false" but *meaningless*—it lacks a basis in construction. No conservativity theorem can bridge this gap because the disagreement is about what mathematical statements *mean*, not just what they prove.  

  Bishop’s constructivism diverges sharply from Brouwer here. Bishop explicitly rejected intuitionistic metaphysics, stating his goal was to ensure theorems carry algorithmic content. For Bishop, classical proofs of existence were not "meaningless" but *incomplete*—they failed to provide the computational information mathematics ought to deliver. His critique was methodological: classical logic risks "losing information" (e.g., proving existence non-constructively without yielding an algorithm). Bishop thus shares Brouwer’s insistence on constructive proofs but grounds it in mathematical utility, not ontology.  

  This distinction exposes the limits of computational conservativity as a resolution:  
  1. **Non-Π₂ statements**: Conservativity fails for statements requiring choice sequences (Brouwer) or non-uniform constructions. For example, a classical proof of "∀f:ℕ→{0,1} ∃n f(n)=0" (where f is lawless) cannot be constructivized—it assumes f is predetermined, while intuitionists treat f as an ongoing construction.  
  2. **Brouwer’s semantics**: Conservativity theorems work within a classical metatheory, presupposing the very notion of "truth" Brouwer rejects. They show how to *simulate* classical reasoning intuitionistically but do not justify classical logic’s ontological commitments.  
  3. **Bishop’s demands**: Even when extraction is possible, Bishop would argue classical proofs *obscure* computational content. The translated algorithm may be less efficient or insightful than a natively constructive proof.  

  Ultimately, computational conservativity does not resolve the debate. For Brouwer, classical logic fails because it misconstrues mathematics as a description of preexisting reality; for Bishop, it fails because it is a poor engineering practice for obtaining algorithms. Conservativity addresses Bishop’s concern for Π₂ statements but not Brouwer’s semantic critique. It also ignores cases where constructivism proves stronger results (e.g., continuity theorems in intuitionistic analysis). Thus, the choice is not merely "taste": it reflects whether one prioritizes algorithmic utility (Bishop), a revision of truth (Brouwer), or classical ontology.  

  ---

  **Marking Scheme (20 marks)**  
  **A-grade (17–20 marks)**:  
  - **✅ Clearly explains computational conservativity** (e.g., via double-negation translation) for Π₂ statements but notes limitations (e.g., fails for non-Π₂, non-uniformity).  
  - **✅ Distinguishes Brouwer (truth-as-construction) vs. Bishop (algorithmic utility)** explicitly. Notes Bishop rejects metaphysics.  
  - **✅ Argues conservativity doesn’t resolve Brouwer’s semantic critique** (classical logic assumes a notion of truth intuitionism rejects).  
  - **✅ Concludes choice isn’t "taste" alone**: it depends on goals (computation vs. ontology) and scope (beyond Π₂).  

  **B-grade (13–16 marks)**:  
  - **✓ Describes conservativity** but vague on scope (e.g., omits Π₂ focus).  
  - **✓ Contrasts Brouwer/Bishop** but conflates their motivations (e.g., "both want algorithms").  
  - **✓ States conservativity isn’t universal** but doesn’t tie to semantic disagreement.  
  - **✓ Concludes "not just taste"** but lacks nuance on why (e.g., ignores metaphysics).  

  **C-grade (9–12 marks)**:  
  - **⚠️ Mentions conservativity** but misrepresents (e.g., "always extracts programs").  
  - **⚠️ Superficial treatment of Brouwer/Bishop** (e.g., "both are constructive").  
  - **⚠️ Oversimplifies debate** (e.g., "classical logic is invalid" or "only rigor matters").  
  - **⚠️ Concludes "taste" or "rigor"** without engaging semantics.  

  **D/F-grade (0–8 marks)**:  
  - ❌ Fails to define conservativity or confuses it with embedding.  
  - ❌ No meaningful Brouwer/Bishop comparison.  
  - ❌ Claims "classical logic is false" (misreads intuitionism as denying classical validity).  
  - ❌ Conclusion missing or incoherent.  

  **Explicit Penalty Triggers (deduct 3–5 marks)**:  
  - **"Classical logic is false about math"**: Misinterprets intuitionism as a *corrective* to classical logic rather than a revision of meaning. Brouwer rejects classical truth conditions but doesn’t call them "false."  
  - **"Bishop and Brouwer are the same"**: Ignores Bishop’s rejection of intuitionistic metaphysics.  
  - **"Conservativity makes constructivism obsolete"**: Overgeneralizes beyond Π₂ statements and ignores semantic critique.  
  - **"It’s all about rigor"**: Reduces debate to epistemic caution, missing truth/meaning aspects.  

  ---

  **Rationale for Design**  
  - **Accessibility**: Requires only core course concepts (Kripke models, proofs-as-programs, double-negation translation, Bishop/Brouwer distinctions).  
  - **Forces Synthesis**: Students must reconcile conservativity (a technical result) with philosophical critiques.  
  - **Targets Misconceptions**: Explicitly penalizes common errors (e.g., "classical logic is false").  
  - **Balanced Scope**: 600–800 words is feasible in 90 minutes for prepared students.  

  This question rewards students who see constructivism as both a computational methodology *and* a semantic revision, while forcing them to confront whether "mining" algorithms from classical proofs resolves the deeper disagreement.
