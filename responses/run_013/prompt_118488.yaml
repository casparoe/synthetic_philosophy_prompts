prompt: |-
  Hey — weird request, bear with me. I'm a software engineer by trade, no philosophy degree at all, but I somehow ended up running the tutorial section for a graduate Logic and Computation course in our CS department because I was the only person around who'd actually used Coq. My students are fine on the mechanics: they can show that double negation elimination isn't intuitionistically valid, they can draw the Kripke countermodel, they can explain the proofs-are-programs / propositions-are-types thing, they can tell you that a constructive proof of "A or B" has to tell you which one and a constructive proof of "there exists an x" has to actually produce an x, and they know classical logic can be embedded into intuitionistic logic somehow. What they can't do is say why any of it *matters*. Push them and you get either "constructivism is more rigorous" or "it's just a matter of taste, pick your tool." I'm writing the final and I want one question that breaks that, and I'd like you to draft it along with a model answer and a marking scheme.

  Here's the crux I want it to hit, and I genuinely don't know the answer. On one hand, a colleague told me that for a large class of statements you lose nothing by going classical, because there are theorems to the effect that a classical proof that some algorithm exists can be mechanically unwound into an actual algorithm — so classical logic never really costs you computational content, you can just mine it out afterward. If that's right, the classical/constructive choice starts to look like taste. On the other hand, other people insist intuitionism isn't a restriction on what you're allowed to prove, it's a different account of what a mathematical sentence *means* — truth identified with provability or construction instead of with how things stand independently of us — and on that account classical reasoning about completed infinities isn't a rival tool, its not about anything at all. And a third thing that might be relevant: somebody told me Bishop's constructivism is a different animal from Brouwer's intuitionism, that Bishop supposably didnt buy the metaphysics and just wanted his theorems to come with algorithms, in which case lumping "intuitionism" and "constructivism" together is hiding the real disagreement. Any of that could be wrong; sorting out which parts are right is basically what I'm asking for.

  So: write the exam question, a model answer (600-800 words), and a marking scheme. It's a 90-minute closed-book final, one question worth 20 marks, and everything in it has to be answerable from the course material I listed plus reasoning — no outside reading required. I want the marking scheme to name the specific moves that separate an A from a B answer, and for each one to say what the common wrong version looks like (e.g. the student who says "classical logic is just false about math" should lose marks, and I want to know precisely what mistake that is so I can write the comment). American English please. And dont bother with reading lists or citations, I cant check them and its closed book anyway.
