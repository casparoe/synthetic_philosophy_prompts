  The acquittal's impact on the debate: It feels like a win for Hart, but actually reveals a third dimension—the "public good" defense. The jury accepted that literary value outweighs moral risk, which is utilitarian (greatest good) rather than strictly Hartian. Hart might approve, but it's not his harm principle at work. Instead, it shows law accommodating cultural value judgments, which Devlin might ironically applaud as society updating its morality.

  Where the mappings break:
  - Hart's harm principle struggles with diffuse "corruption" claims.
  - Devlin's cohesion argument overreaches when applied to fiction.
  - The trial's focus on literary merit introduces an element neither philosopher emphasized—aggregative public good.

