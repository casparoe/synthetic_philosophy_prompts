  Here are 9 concrete scenario-based questions designed to probe the nuances of everyday conventions, with answer options tailored to reveal underlying philosophical positions. Each question includes a situation where norms and obligations might diverge, followed by answer options. The scoring key maps answer patterns to positions (a) through (h), identifies limitations, and highlights potential mis-sorting.

  ### **Quiz Questions**
  **1. 4am Empty-Street Jaywalking**  
  *Context: Jaywalking is illegal and socially discouraged. It’s 4am; the street is visibly empty in all directions.*  
  - **A)** Cross anyway—no risk, no harm.  
  - **B)** Wait for the signal—breaking norms erodes societal trust.  
  - **C)** Cross but feel uneasy—you’re benefiting from orderly streets daily.  
  - **D)** Cross; the rule exists for safety, which isn’t compromised here.  

  **2. Express Lane with 11 Items (No One Behind You)**  
  *Context: You have 11 groceries. The "10 items or fewer" lane is empty; other lanes are crowded.*  
  - **A)** Use the express lane—it inconveniences no one.  
  - **B)** Join a regular lane—rules bind you regardless of circumstances.  
  - **C)** Ask the cashier—their authority overrides the sign.  
  - **D)** Use it but donate $1 to charity—offset potential unfairness.  

  **3. Unknowingly Skipping Tip in a Tip-Dependent Culture**  
  *Context: As a tourist, you learn servers rely on tips *after* paying a bill sans tip.*  
  - **A)** Return and tip—the server is harmed by your omission.  
  - **B)** Do nothing—you lacked knowledge, so no obligation.  
  - **C)** Tip extra next time—you benefit from the system overall.  
  - **D)** Complain to management—structural change matters, not guilt.  

  **4. Tipping Where It’s Insulting**  
  *Context: Tipping implies the host is poor here. You received great service.*  
  - **A)** Tip discreetly—your cultural duty outweighs local offense.  
  - **B)** Never tip—local customs bind visitors absolutely.  
  - **C)** Ask the host if a tip is acceptable—context determines obligation.  
  - **D)** Don’t tip but praise the service—disapproval is the real issue.  

  **5. Punctual Visitor to a Late-Running Dinner**  
  *Context: You arrive at the stated time (7pm) to a dinner where locals arrive at 8pm. Host is unprepared.*  
  - **A)** Apologize and adapt—you should’ve researched local norms.  
  - **B)** Stay annoyed—hosts should clarify expectations.  
  - **C)** Embrace the wait—consequences of nonconformity (awkwardness) guide you.  
  - **D)** Leave and return later—norms lack moral force if no one is wronged.  

  **6. Escalator Standing Side (Bare Coordination)**  
  *Context: Convention says "stand right, walk left" on escalators. It’s crowded.*  
  - **A)** Stand right—norms exist for smooth coordination.  
  - **B)** Stand wherever—conventions are arbitrary and non-binding.  
  - **C)** Stand right only if someone might pass—consequences dictate compliance.  
  - **D)** Stand left to protest—the norm is inefficient and changeable.  

  **7. Queue-Jumping via Staff Friend (Identifiable Beneficiary)**  
  *Context: A staff friend offers to skip a long queue. Others see you.*  
  - **A)** Accept—personal connections aren’t morally wrong.  
  - **B)** Decline—it unfairly harms those waiting.  
  - **C)** Accept if queue is unreasonably long—context overrides rules.  
  - **D)** Accept but buy coffee for the last in line—repay the "benefit" taken.  

  **8. Tourist in a "Shoes On" Home (Morally Bad Convention)**  
  *Context: Locals demand shoes *on* indoors, worsening sanitation in a disease-prone area.*  
  - **A)** Comply—visitors follow local rules unconditionally.  
  - **B)** Refuse—health risks override conventions.  
  - **C)** Remove shoes but explain your concerns—balance respect and ethics.  
  - **D)** Comply and donate to a health charity—offset harm.  

  **9. On-Time Worker in a Chronically Late Office**  
  *Context: Your team’s "9am start" means 10am in practice. You arrive at 9am daily.*  
  - **A)** Keep arriving early—punctuality is intrinsically right.  
  - **B)** Adapt to 10am—you benefit from the group’s flexibility.  
  - **C)** Arrive at 9:30am—split the difference based on consequences.  
  - **D)** Demand clarity—norms are just expressions of preference.  

