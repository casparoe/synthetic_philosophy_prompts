  ### **Conclusion**  
  This quiz best separates **expressivists (g)** from **etiquette-only (a)** and **consequentialists (f)**, but struggles with **moral wrongness (c)** vs. **fair-play (d)** in money/status norms (tipping). To test if two positions are distinct (e.g., (d) and (e)), check for consistent divergence in **Q7 (queue-jumping)**: (d) requires "repayment" (7D), while (e) prioritizes territorial fairness (7B). If most users answer identically here, the positions may collapse.  

  **Mis-sorting Risk**: Q8 (disease-zone shoes) is too decisive for (b)/(e). If a user prioritizes health but generally respects norms, they might be mis-sorted as (f) or (h). Consider adding a parallel question (e.g., discriminatory hiring) to balance.
