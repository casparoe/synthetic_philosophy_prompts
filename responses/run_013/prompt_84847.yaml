  | **(a)**  | Etiquette only; no obligation.                                             | 1A, 2A, 3B, 4D, 5D, 6B, 7A, 8A, 9D                                                                                         |
  | **(b)**  | Social/prudential binding; not moral.                                      | 1B, 2B, 3B, 4B, 5A, 6A, 7A, 8A, 9B                                                                                         |
  | **(c)**  | Moral obligation (wrongs someone).                                         | 1B, 2B, 3A, 4B, 5B, 6A, 7B, 8B, 9A                                                                                         |
  | **(d)**  | Fair-play (bound if you benefit).                                          | 1C, 2C, 3C, 4C, 5A, 6A, 7D, 8D, 9B                                                                                         |
  | **(e)**  | Territorial (locals’ rules bind visitors).                                 | 1B, 2B, 3A, 4B, 5A, 6A, 7B, 8A, 9B                                                                                         |
  | **(f)**  | Convention-independent (consequences matter, not norms).                   | 1D, 2A, 3D, 4A, 5C, 6C, 7C, 8B, 9C                                                                                         |
  | **(g)**  | Expressivist ("wrong" = disapproval).                                      | 1A, 2A, 3B, 4D, 5D, 6B, 7A, 8A, 9D                                                                                         |
  | **(h)**  | Particularist (case-by-case; no general rule).                             | 1C, 2C, 3C, 4C, 5C, 6C, 7C, 8C, 9C                                                                                         |

