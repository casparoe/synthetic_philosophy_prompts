  ## Award Speech for Ruth

  [Adjust microphone. Pause. Look at Ruth directly.]

  Councillors, volunteers, Ruth’s wonderful family, friends, and Ruth herself – who I suspect is already calculating how quickly she can get back to her roses after this is over...

  We’re here today because of eleven winters. Eleven winters where the wind didn’t just rattle *our* windows, but blew through lives with nowhere else to go. And in one house on this very street, Ruth opened her door. Not with a fanfare, not with a committee vote, but because she saw the rain on someone’s shoulders, the frostbite on another’s fingers, and decided her spare room wasn’t so spare after all.

  I’ve known Ruth eleven years. I know she values her privacy. I know she takes immense pride in her garden – woe betide the careless soul who treads on her prize-winning delphiniums! I know she has precisely zero patience for bureaucracy, small talk, or foolishness. She’s not serene. She’s not endlessly patient. And she’s certainly not thrilled about sitting here in her best dress while we all make speeches about her.

  [Gesture towards Ruth, lightly, warmly]

  That, I think, is precisely why what she did matters so much. Think about it. Running an unlicensed shelter wasn’t some effortless outpouring of saintly virtue for Ruth. It was hard. It was inconvenient. It meant muddy boots on her clean floors. It meant arguments at 2 AM. It meant explaining things to council inspectors she’d rather have avoided. It meant sacrificing quiet evenings, garden time, and that precious peace she cherishes. Every night she chose to open that door, it cost her something – something tangible, something personal.

  [Shift tone, more reflective]

  This prize is for doing "more than you had to." It’s an odd phrase, isn’t it? Easy to get tangled up in. If we say Ruth did what *anyone* would do, we’re kidding ourselves – and diminishing her incredible constancy. If we say she did what *everyone* should do, well, that feels like turning her generosity into a scolding for the rest of us. And if we say *none* of us could have done it? That makes her some kind of alien saint, which she’d snort at, and frankly, it lets us off the hook too easily.

  Here’s what I believe: Ruth showed us what *could* be done, precisely because it was so clearly *not* what she *had* to do. Nobody commanded it. Nobody expected it. The council wasn’t asking residents to take people in. The volunteer brigade has its own rules and structures. Ruth saw a gap, a human need falling through the cracks of the official and the expected, and she bridged it. She bridged it with cups of tea that were probably too strong, with spare blankets that might not have matched, and with a brand of practical, unsentimental kindness that didn’t ask for permission or praise.

  [Address the wider room]

  Now, some might worry that giving her this prize somehow turns her extraordinary act into tomorrow’s minimum requirement. That we’re setting a new baseline. That this plaque is a machine grinding down her eleven years of quiet effort into an obligation for the next person. I understand that fear. But I don’t think it works like that. Ruth didn’t act because she saw a prize hanging on the horizon. She acted because she saw a person shivering on her step. This award isn’t a blueprint; it’s a beacon. It doesn’t say, "Now you *must*." It says, "Look what *can* be done." It reminds us that decency isn't always found in grand schemes or official channels. Sometimes, it’s found in an unlocked door on a cold night, opened by someone who’d frankly rather be pruning her roses.

  And yes, the person who *always* does absolutely everything they possibly can? They can be exhausting. Sometimes, we want to put them on a plinth just to get some breathing room! But Ruth isn’t that person. She’s one of us. She likes her comforts, her routines, her peace. That’s why her choice matters so deeply. It wasn’t easy. It wasn’t her nature. It went against her grain. But she did it anyway. For eleven years.

  [Turn fully to Ruth]

  So, Ruth, this prize isn’t for being a saint. We know you’re not. It’s not for setting a new rule for the rest of us. It’s for your sheer, stubborn, gloriously inconvenient *decency*. It’s for recognising that for over a decade, you consistently chose the harder, messier, more demanding path when the easier one was right there. You chose frostbitten strangers over pristine floors. You chose inconvenient truths over comfortable silence. You chose warmth over privacy, again and again.

  You didn’t do it because it was easy. You didn’t do it because you were told to. You did it because, in those moments, with those people on your step, you decided it was the right thing *to* do. That’s what "more than you had to" means. It’s the gap between the bare minimum the world expects, and the quiet maximum your conscience demands. You filled that gap for eleven winters. For that stubborn, pragmatic, utterly human kindness – Ruth, we honour you.

  [Present the award]

  ---

  **To You, the Novelist (Not the Room):**

  1.  **Core Commitment:** I anchored the speech in your reading: Ruth's act was supererogatory *because* it was costly, against her natural inclinations (privacy, order, avoiding fuss), and consistently chosen despite the difficulty. The "against the grain" element is the linchpin, distinguishing it from effortless sainthood and making it genuinely beyond obligation.
  2.  **Liberties & Contested Ground:**
      *   **The "Beacon" Argument:** I leaned heavily on the idea that praising *this specific, costly act* doesn't inherently create a new obligation but serves as inspiration ("Look what *can* be done"). This directly challenges the "prize as baseline machine" worry, arguing that the *nature* of Ruth's act (personal, difficult, unsought) inherently resists becoming a mandated minimum. Some ethicists would argue praise *always* exerts normative pressure, making this optimistic.
      *   **Redefining "Supererogatory":** I subtly framed "beyond the call" not as a cosmic category, but as the gap between societal/minimal expectations ("what you had to") and the demanding call of conscience in a specific moment ("what you *could* do"). This leans pragmatic and contextual, potentially sidestepping the maximizing/ordinary squeeze by focusing on lived choice and cost *for this person*.
      *   **Dissolving the Maximizer Trap:** The speech implicitly rejects the maximizer's either/or ("required if best, not best if not required") by focusing on Ruth's *personal* cost and context. Her act wasn't "the best possible act in the universe," but it *was* the best act *she* could muster in those moments, going far beyond what was expected *of her*. The prize honours the *effort* and *sacrifice* in that gap, not its abstract optimality.
  3.  **Answering Your Philosopher Friend:** At the reception, say this: *"The prize isn't for optimizing abstract utility. It's for Ruth's specific, sustained, costly defiance of her own comfort to meet an unmet need. The 'call' she exceeded wasn't a divine command or a utilitarian calculus, but the baseline of societal expectation and her own inclination. We honour the friction, the effort in that gap – the fact that doing the right thing was hard, and she did it anyway. The plaque marks that stubborn human choice, not a new rule."* This grounds it in her concrete reality and the cost *to her*, defusing the abstract dilemma.

  The speech avoids traps by making Ruth's humanity and the tangible difficulty the center, using concrete details (garden, floors, tea, arguing, frostbite) to embody the philosophy. It embraces the paradox of honouring someone annoyed by the honour, turning it into proof of her unsaintly authenticity. Good luck! Ruth would probably tell you to keep it shorter next time.
