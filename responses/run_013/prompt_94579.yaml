answer: |-
  Here is a concise, argument-focused memo addressing your concerns head-on, designed for committee deliberation:

  ---

  **MEMORANDUM**  
  **To:** Patient-Safety Committee  
  **From:** Committee Chair  
  **Re:** Preventability Determination - Post-Op Bleeding Case  

  ### 1. **Can Omissions Be Causes?**  
  Yes. Causation includes omissions when an *expected intervention* would have altered the outcome. The resident’s failure to review the chart and the nurse’s failure to page were not passive absences; they were active breaches of defined duties in a system designed to intercept harm. The bleed was the *mechanism* of death, but the omissions were *causal factors* by removing necessary safeguards. Calling this "mere disapproval" ignores that specific actions were required and omitted, breaking the chain of prevention.  

  ### 2. **Why But-For Fails Here – and What Test Applies**  
  But-for causation collapses in "overdetermined" cases like this, where either lapse alone was sufficient to prevent death. The charter’s "necessary element" language thus appears unmet if read strictly. We should instead apply the **NESS test** (Necessary Element of a Sufficient Set): *each lapse was part of a set of conditions sufficient to cause the death, and neither was redundant*. Had the nurse paged, the resident’s omission wouldn’t matter; had the resident reviewed the chart, the nurse’s omission wouldn’t matter. But *both* failed, creating a sufficient set for harm.  

  ### 3. **The "Duty Rider" Isn’t About Causation – It’s About Blame**  
  The rider ("lapses count only where the omitted act was a specified duty") does not determine causation—it filters which omissions we *count* as relevant. It shifts focus from "what happened" to "who failed." This is policy, not metaphysics: it ensures we only consider deviations from formal responsibilities. Here, both the nurse (paging duty) and resident (implicit duty to assess unstable patients) had specified roles. The rider protects against overreach but confuses causation with accountability.  

  ### 4. **The Institutional Blind Spot**  
  Our bias toward individual over institutional omissions reflects *accountability convenience*, not causal reality. The monitor not installed or staffing ratios not set are equally causal omissions: they created the conditions for failure. But institutions lack "duties" in our charter’s sense, and blaming faceless systems feels abstract. This asymmetry is ethical, not causal. We label individual lapses "causes" because they are actionable targets for blame, not because they are uniquely real.  

  ---

  ### Recommendations  
  **a) Report as preventable:** Both lapses meet NESS and the charter’s duty rider. The outcome was avoidable by either party fulfilling their role.  
  **b) Open no peer-review files:** Individual blame ignores system factors (e.g., why was a restless patient not escalated? Why was the resident distracted?). Focus instead on root-cause analysis of workflow gaps.  
  **c) Refer charter for amendment (6-month timeline):**  
  - Replace "necessary element" with "substantial contributing factor" (encompassing NESS).  
  - Add explicit criteria for institutional omissions (e.g., "failure to implement feasible safeguards").  
  **d) To the family:**  
  > "We are deeply sorry. Your father’s death resulted from bleeding that should have been caught by our safety systems. We are investigating how those systems failed him."  

  ---

  ### Strongest Counterargument (Stated Fairly)  
  > *"The charter’s ‘necessary element’ standard isn’t met here. But-for causation is the legal default: if the nurse had paged, the resident’s omission wouldn’t have mattered, and vice versa. Neither lapse was strictly necessary, so we cannot say either ‘caused’ the death under our rules. Reporting this sets a precedent that dilutes ‘preventability’ – we risk overreporting errors where any single action could have averted harm. Focus on system fixes, but don’t misapply the standard."*  

  ---

  ### Why This Approach?  
  - **Causal clarity:** NESS resolves the two-omissions paradox while honoring the charter’s intent.  
  - **Moral honesty:** The memo explicitly separates causation (both lapses + system), blame (individuals with duties), and responsibility (institution).  
  - **Practical change:** Amending the charter addresses systemic causes; declining peer review avoids scapegoating.  
  - **Family integrity:** The script acknowledges institutional failure without legalese or false comfort.  

  Move to report, amend the charter, and task QC with a workflow analysis. This meets our duty to truth without sacrificing compassion.  

  ---  
  *"We design systems to compensate for human fallibility. When they fail in concert, the cause is the design."*
