prompt: |-
  You are an expert in decision theory, self-locating belief, and anthropic reasoning, and you have designed a good many classroom simulations for philosophy seminars; I want you to work as both the theorist and the activity designer here. Think carefully before committing to a design, and begin by brainstorming several candidate mechanics rather than settling on the first one that runs; I would rather see three sketches and a reasoned choice than one polished plan. Work from what you know about anthropics — I am not asking for citations, a reading list, or pointers into the literature.

  The setting: I run a reading group on decision theory with twelve participants, mostly philosophy graduate students plus a few mathematically comfortable outsiders. Some have met the Sleeping Beauty problem; none has thought about self-locating belief in any depth. I have one ninety-minute session, a seminar room with a whiteboard, envelopes, index cards, and a bag of poker chips (no real money), and I am the only facilitator.

  What I want them to feel in their hands rather than their heads: the difference between the self-sampling assumption (reason as if you were randomly drawn from the observers who actually exist in your reference class) and the self-indication assumption (reason as if you were randomly drawn from all possible observers, weighted by the probability of their existing), and the move that makes the second look absurd — the armchair argument that the world must contain vastly more observers than we thought, because a world with more of them makes your own existence more likely. The last is the one usually called the presumptuous philosopher. I do not want them to hear either name before the debrief.

  Constraints on the design. First, do not hand me Sleeping Beauty with the labels filed off; I have seen that activity and my group is too small for it to bite. I would rather the multiplicity be generated by a copy room — a machine that runs some number of copies of the same person — than by awakenings, and I want the copying to be real enough that the payoff structure, not my narration, does the work. Second, it must be runnable with twelve real people who cannot actually be duplicated, so be explicit about what stands in for what: who or what counts as a copy, what the coin decides, who knows what and when, and how the scoring is settled at the end without my having to lie about the outcome. Third, I want two acts, not one: a first in which participants discover that the multiplicity itself pulls their betting odds around, and a second in which someone must stake chips on how large the world is with no observations at all, and must defend that stake to the room. Fourth, nothing in the scoring rule may quietly presuppose that one of the two assumptions is correct; if the design cannot avoid that, say so and tell me exactly where it leaks in.

  Give me: the brainstormed alternatives and why the two you reject fail; the chosen activity as a minute-by-minute run sheet, with materials, the exact bets or choices, the payoff rule in chips, the reveal or reveals and their timing, and what goes on the cards as opposed to what I say aloud; then the debrief, mapping each moment of the activity onto the two assumptions and onto the presumptuous philosopher's move; then the failure modes you predict — I expect at least someone to insist that a copy is not really them, someone to reduce the whole thing to a probability puzzle, and someone to complain that the payout rule has already decided the question — with what I should do at the moment each arises; then an honest account of what this activity cannot reproduce and that I will have to supply in words; and finally one closing question I can put to the group that would show me whether they can distinguish the two assumptions rather than merely recite them.

  On the epistemics: separate what is settled from what is genuinely contested among people who work on this, and do not present a contested position as the consensus — in particular, do not imply that either assumption is the standard view, or that the presumptuous philosopher is a decisive reductio rather than a live disagreement, and flag it explicitly if the label for the self-indication assumption has been used in more than one way, since I would rather have the ambiguity marked than smoothed over. State plainly which formulation of each assumption you are working with, and flag any step in your own design that a careful critic would reject.
reasoning: |-
  We are designing an activity to illustrate the difference between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA), and to introduce the "presumptuous philosopher" problem. We have 12 participants and 90 minutes. We want to avoid the Sleeping Beauty setup and instead use a "copy room" mechanism. The activity must have two acts: one where multiplicity affects betting odds, and another where someone stakes chips on the size of the world with no observations.

  Constraints:
  - Use poker chips for payoffs, no real money.
  - The copying should be represented without actual duplication of people (so we use index cards or envelopes to represent copies).
  - The coin flip (or similar) should determine the number of copies.
  - Participants should not know the terms SSA/SIA until debrief.
  - Two acts: 
     Act 1: Participants see how multiplicity affects their betting behavior.
     Act 2: A participant must bet on the world size with no observations and defend it.

  We must ensure the scoring rule does not presuppose either SSA or SIA. We'll use a symmetric scoring rule that is fair under both.

  Brainstorming three candidate mechanics:

  Candidate 1: "The Copy Room Bet"
  - Setup: A coin is flipped (secretly by facilitator). If heads, one copy of a participant is made. If tails, two copies are made. Each copy is represented by an index card with a unique ID. The participant (the original) is told they are one of the copies, but not how many were made. They are then asked to bet on heads or tails.
  - Problem: This is too close to Sleeping Beauty (with awakenings replaced by copies). Also, it only addresses the first act and doesn't naturally lead to the second.

  Candidate 2: "The World Size Bet"
  - Setup: We have two possible worlds: World A (small, say 1 billion observers) and World B (large, say 1 trillion observers). A coin flip determines which world is actual. Participants are told they are observers in the actual world. They are asked to bet on which world they are in. 
  - Problem: Without a copying mechanism, it doesn't illustrate the first act (how multiplicity affects betting). Also, it directly leads to the presumptuous philosopher without building up.

  Candidate 3: "The Duplication Experiment" (chosen)
  This candidate will have two acts.

  Act 1: The Copy Bet
  - We select one volunteer (let's call them the "target"). The facilitator flips a coin (in secret). If heads, the target is duplicated once (so two copies exist). If tails, the target is duplicated twice (so three copies exist). 
  - Since we cannot duplicate people, we represent the copies by index cards. Each copy (including the original) is represented by a card. The cards are shuffled and one is drawn at random to be the "speaker" (the one who makes the bet). The speaker is told the rules and then must bet on heads (two copies total) or tails (three copies total). 
  - Payoff: If the speaker guesses correctly, they get 3 chips. If wrong, they lose 1 chip. (This scoring is designed to be symmetric and not favor either assumption, but we can adjust.)

  Act 2: The Presumptuous Philosopher
  - Without revealing the outcome of Act 1, we now consider two theories about the world: 
     Theory A: The universe has 1 billion observers.
     Theory B: The universe has 1 trillion observers.
  - We tell the participants that one of these theories is true (by a coin flip, but we don't tell them the outcome). We then ask a participant to bet on which theory is true. They must stake chips and defend their choice.
  - Payoff: If they guess correctly, they get 1 chip. If wrong, they lose 1 chip. (Symmetric.)

  But note: In Act 2, we have not given any evidence. The participant has no observation that would distinguish the two worlds. This is the presumptuous philosopher: if they follow SIA, they should think the large universe is more likely because it makes their existence more likely.

  Why reject Candidate 1 and 2?
  - Candidate 1: Too similar to Sleeping Beauty and only covers the first act.
  - Candidate 2: Doesn't have the copying element and jumps straight to the world size without the foundation.

  Chosen activity: The Duplication Experiment (with modifications to fit the constraints)

  Revised Chosen Activity:

  Materials:
  - Coin (to be flipped by facilitator)
  - Index cards (one per copy, plus extra)
  - Envelopes (to hold the cards for each copy)
  - Poker chips (for payoffs)
  - Whiteboard (to record bets and outcomes)

  Participants: 12. We need one volunteer for Act 1 (the target). We can have multiple rounds so more can participate, but time is limited. We can do one run of Act 1 and then Act 2 with a different volunteer.

  Act 1: The Copy Bet (30 minutes)

  Steps:

  1. (Minute 0-5) Introduction: Explain that we are going to simulate a copying machine. We have a target volunteer. The machine will run and create copies of the target. The number of copies depends on a coin flip (done secretly by facilitator). 
     - If heads: the machine creates 1 copy (so total people: original + 1 copy = 2).
     - If tails: the machine creates 2 copies (so total people: original + 2 copies = 3).

  2. (Minute 5-10) Setup: 
     - The facilitator flips the coin in secret (so no one knows the outcome). 
     - Depending on the flip:
          Heads: Prepare 2 index cards (labeled "Target 1", "Copy 1").
          Tails: Prepare 3 index cards (labeled "Target 1", "Copy 1", "Copy 2").
     - Place each card in an envelope and shuffle the envelopes.

  3. (Minute 10-15) Selection: 
     - Draw one envelope at random. The person whose name is on the card (the target) is the one who will make the bet. However, since we are representing the target and copies by cards, we must explain that the card represents a person (either the original or a copy) and that the person holding the card (the target) is now the "speaker" for that copy. 
     - But note: the target is the same person in the room. We are using the cards to represent the copies so that we can have multiple "copies" without actually duplicating people. The target will play the role of whichever copy is drawn.

     Clarification: The target is the original. The copies are represented by the cards. When an envelope is drawn, we open it and reveal the card. The target then becomes the speaker for that card. We do not have multiple people, but the target is asked to reason as if they were the person represented by the card (which could be the original or a copy). 

     However, to make it more concrete: we can have the target leave the room during the coin flip and setup. Then when we draw a card, we call the target back in and tell them that they are the person represented by the card. They do not know if they are the original or a copy, and they do not know how many copies were made.

  4. (Minute 15-20) Betting:
     - The speaker (the target) is told: "You are one of the copies that exists. There are either 2 or 3 copies in total, depending on the coin flip. We have drawn you at random from all the copies that exist. We want you to bet on the coin flip: heads (which means there are 2 copies) or tails (which means there are 3 copies)."
     - They are given a betting sheet and must write down their bet (heads or tails) and how many chips they wish to stake (up to a limit, say 3 chips). 
     - Payoff rule: 
          If correct: win 3 times the stake.
          If wrong: lose the stake.

     Why this payoff? We want the expected payoff to be symmetric under both SSA and SIA. Under SSA, the probabilities are:
          P(heads | you exist) = P(you exist | heads) * P(heads) / P(you exist)
          But note: under SSA, the reference class is the actual observers. In heads there are 2 observers, in tails 3. The probability of being you is 1/2 in heads and 1/3 in tails? Actually, we have to be careful.

     Let H: heads (2 copies), T: tails (3 copies).
     Under SSA: 
          P(you are selected | H) = 1/2   (because there are 2 copies and you are one of them, randomly selected)
          P(you are selected | T) = 1/3
          Then by Bayes: 
              P(H | you are selected) = [P(you are selected | H) * P(H)] / [P(you are selected | H)*P(H) + P(you are selected | T)*P(T)]
              = ( (1/2)*(1/2) ) / ( (1/2)*(1/2) + (1/3)*(1/2) ) = (1/4) / (1/4 + 1/6) = (1/4) / (5/12) = 3/5.

          So under SSA, the probability of heads is 3/5.

     Under SIA: 
          We weight by the number of observers. The prior probabilities are adjusted by the number of observers. 
          P(you exist | H) = 2 (if we are in a multiverse of possibilities, but note: we are conditioning on the coin flip) ... actually, SIA says: the probability of being in a world is proportional to the product of the prior probability of the world and the number of observers in that world.
          So: P(H | you exist) = [P(H) * 2] / [P(H)*2 + P(T)*3] = (1/2 * 2) / (1/2*2 + 1/2*3) = 1 / (1 + 1.5) = 1/2.5 = 2/5.

          So under SIA, the probability of heads is 2/5.

     Therefore, the two assumptions lead to different probabilities. The payoff rule we have chosen (win 3x if correct, lose 1x if wrong) is symmetric in the sense that it does not favor one assumption over the other because we are not using the same probability for both. We are just giving a fixed payoff. We are not building in either probability.

     However, note: we are not forcing the participant to bet at even odds. They choose how much to stake. We can instead offer them a fixed bet: they must choose to bet on heads or tails, and if they choose correctly they get 3 chips, if wrong they lose 1 chip. Then the expected payoff under SSA for betting on heads is: (3/5)*3 + (2/5)*(-1) = (9/5) - (2/5) = 7/5 = 1.4 > 0, so they should bet on heads. Under SIA, the expected payoff for betting on heads is: (2/5)*3 + (3/5)*(-1) = (6/5) - (3/5) = 3/5 = 0.6 > 0, but note: betting on tails under SIA: (3/5)*3 + (2/5)*(-1) = (9/5) - (2/5) = 7/5 = 1.4 > 0.6. So actually, under SIA they should bet on tails. Therefore, the two assumptions lead to different betting behaviors.

     We can do this: we offer the participant a choice: they can bet on heads (and if right win 3, if wrong lose 1) or bet on tails (if right win 3, if wrong lose 1). Then we see which bet they take.

     Alternatively, we can ask them to assign a probability and then set a scoring rule (like quadratic) but that is more complex.

     We choose: the participant must choose either heads or tails. If they choose heads and it is heads, they win 3 chips; if heads and it is tails, they lose 1 chip. Similarly, if they choose tails and it is tails, they win 3 chips; if tails and it is heads, they lose 1 chip.

     This payoff rule is known to the participant.

  5. (Minute 20-25) Reveal and payout:
     - The facilitator reveals the coin flip and the total number of copies that were made (and the participant sees whether they were the original or a copy, but note: the participant doesn't know if they were the original until now? Actually, it doesn't matter because the bet is about the coin flip). 
     - Then we pay out the chips.

  Act 2: The Presumptuous Philosopher (30 minutes)

  6. (Minute 25-30) Introduction to Act 2:
     - We now shift to a different scenario. We are going to consider two theories about the entire universe:
          Theory A: There are 1 billion observers in the universe.
          Theory B: There are 1 trillion observers in the universe.
     - We flip a coin to determine which theory is true (but we don't tell them the outcome). We tell them that the coin is fair so each has prior probability 1/2.

  7. (Minute 30-35) Setup:
     - We select a new volunteer (or use the same one? better to use a different one to involve more people). This volunteer is told: "You are an observer in the universe. We want you to bet on which theory is true."

  8. (Minute 35-40) Betting:
     - The volunteer must choose to bet on Theory A or Theory B.
     - Payoff: If they choose correctly, they win 1 chip. If wrong, they lose 1 chip. (Symmetric: even odds.)
     - They are allowed to stake any amount they want? Actually, we want a fixed stake: they bet one chip. But we want to see what they choose. Alternatively, we can ask them to assign a probability. But to keep it simple, we require a forced choice: they must pick one.

     However, we want them to defend their choice. So after they make the choice, we open the floor for discussion: why did you choose that? Then we let the group discuss.

  9. (Minute 40-45) Reveal and payout:
     - We reveal the coin flip (which determined the theory) and pay out.

  Debrief (30 minutes)

  Mapping to concepts:

  Act 1:
  - The two ways of reasoning:
     SSA: The participant reasons that they are a randomly selected observer from the actual observers. So in the heads case (2 observers) they have a higher chance of being selected than in tails (3 observers). Hence they think heads is more likely (3/5).
     SIA: The participant reasons that they are more likely to exist in a world with more observers. So tails (which produces 3 observers) makes their existence more likely. Hence they think tails is more likely (so they assign a higher probability to tails: 3/5? Actually, we had P(H)=2/5, so P(T)=3/5).

  But note: in Act 1 the participant is told they are randomly selected from the copies. This is a random sampling from the actual copies. So it is set up for SSA. However, SIA can still be applied: SIA would adjust the prior probability of the world by the number of observers. 

  The payoff rule we used does not build in either assumption. It is just a scoring rule. The participant's behavior may reveal which assumption they are using.

  Act 2:
  - The presumptuous philosopher: under SIA, the probability of Theory B (trillion) is higher because it has more observers. Specifically:
        P(Theory B | you exist) = [P(Theory B) * (number of observers in B)] / [P(Theory A)* (number in A) + P(Theory B)* (number in B)]
        = [ (1/2) * 1e12 ] / [ (1/2)*1e9 + (1/2)*1e12 ] ≈ 1 (since 1e12 dominates 1e9).

    So under SIA, the volunteer should bet on Theory B (trillion). Under SSA, the volunteer has no reason to update: the prior remains 1/2, so they are indifferent.

  But note: the payoff is symmetric. So under SSA they have no preference. Under SIA they strongly prefer B.

  We then map:
     Act 1: The betting behavior (if they choose heads, that's SSA? If they choose tails, that's SIA? But note: under SSA, they should choose heads because it has higher expected payoff. Under SIA, they should choose tails. So we can see which they choose.)

     Act 2: The volunteer will likely choose Theory B if they follow SIA. If they follow SSA, they might flip a coin.

  Failure modes:

  1. Someone insists that a copy is not really them.
     - Response: We are in a thought experiment. We are representing the copies with index cards to stand in for the duplication. The point is to reason as if the duplication happened. We are not claiming the copy is physically them, but in the scenario, the copy is an observer with the same memories and experiences.

  2. Someone reduces the whole thing to a probability puzzle.
     - Response: Acknowledge that it is a probability puzzle, but the puzzle is designed to highlight a conceptual issue: how should we reason about our own location when we are one of many observers? The point is to see that there are two different ways to assign probabilities.

  3. Someone complains that the payout rule has already decided the question.
     - Response: The payout rule is symmetric and does not favor either assumption. We designed it to be neutral. We pay 3:1 for a correct bet in Act 1 because the probabilities are not 1/2. In Act 2 we use 1:1 because under SSA the probability is 1/2. The payouts are set so that the expected value under the correct probability assignment would be non-negative. But we are not building in which assignment is correct.

  What the activity cannot reproduce:
  - The real duplication of persons and the subjective experience of being a copy. We are representing copies with index cards and having the original participant play the role. This is a limitation.

  Closing question:
     "In Act 1, if you were told that there were two possible worlds: one with 2 observers and one with 3, and you were randomly selected from the observers in the actual world, what would you assign as the probability that the world has 2 observers? And if you were told that the world with 2 observers has a prior probability of 1/2, but then you learn that you exist, how would that update your probability? How does that differ from the update in Act 2?"

  This question asks them to compute the probabilities under SSA (Act 1) and then compare to the update in Act 2 (which under SIA is very different). They should be able to articulate that in Act 1 the update is based on being randomly sampled from the actual set, while in Act 2 under SIA the update is based on the idea that you are more likely to exist in a world with more observers.

  Run Sheet:

  Total time: 90 minutes.

  Act 1: The Copy Bet (30 minutes)
  - 0-5 min: Explain the setup. Choose a volunteer (target). Explain that the machine will create copies of the target based on a coin flip (heads: 1 copy, so 2 people total; tails: 2 copies, so 3 people total). The coin is flipped in secret.
  - 5-10 min: Flip the coin and prepare the index cards (without revealing). Put each in an envelope and shuffle. Have the target step out if possible (to not see how many envelopes) or just do it at the front.
  - 10-15 min: Draw one envelope. The target is the speaker for that card. Explain to the target: "You are one of the copies. There are either 2 or 3 copies in total. You have been randomly selected from all the copies that exist. Now you must bet on the coin flip: heads (meaning 2 copies) or tails (meaning 3 copies). If you bet on heads and it is heads, you win 3 chips. If you bet on heads and it is tails, you lose 1 chip. Similarly for tails: if tails, win 3; if heads, lose 1."
  - 15-20 min: The target writes down their bet (on a card or aloud). They can take a moment to think and then announce.
  - 20-25 min: Reveal the coin flip and the total number of copies. Pay the chips.

  Act 2: The Presumptuous Philosopher (30 minutes)
  - 25-30 min: Introduce the two theories: Theory A (1 billion observers) and Theory B (1 trillion). Flip a coin to determine which is true (secretly). 
  - 30-35 min: Choose a volunteer (different from Act 1). Tell them: "You are an observer in the universe. We have just flipped a coin to choose which theory is true. You must bet on which one it is. If you are right, you win 1 chip. If wrong, you lose 1 chip."
  - 35-40 min: The volunteer makes a choice and then defends it to the group. Open for discussion: ask the group if they agree and why.
  - 40-45 min: Reveal the coin flip and pay out.

  Debrief (45 minutes? We have 45 minutes left, but we can adjust)

  Debrief (45 minutes):
  - 45-50 min: Ask the participants what happened in Act 1. Why did the target bet as they did? Write on the board the two lines of reasoning that might have been used.
  - 50-60 min: Introduce the terms: Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA). Define them clearly:
        SSA: When you are uncertain about your location (which observer you are), you should reason as if you were randomly selected from the set of observers that actually exist in your reference class.
        SIA: When you are uncertain about which world you are in, you should assign a higher prior probability to worlds that contain more observers (specifically, the prior probability of a world is proportional to the number of observers in it).

     Note: The formulation of SIA is sometimes given as: the probability of a world given that you exist is proportional to the prior probability of the world times the number of observers in it. But there is an alternative: you are a randomly selected observer from all possible observers in all possible worlds. We are using the first formulation.

  - 60-70 min: Map Act 1:
        Under SSA: The probability of heads (2 observers) given that you are a randomly selected observer is: 
            P(heads | you are selected) = P(you are selected | heads) * P(heads) / [P(you are selected | heads)*P(heads) + P(you are selected | tails)*P(tails)]
            = (1/2 * 1/2) / (1/2*1/2 + 1/3*1/2) = (1/4) / (1/4 + 1/6) = (1/4) / (5/12) = 3/5.
        Under SIA: We adjust the prior by the number of observers:
            P(heads) proportional to (1/2 * 2) = 1
            P(tails) proportional to (1/2 * 3) = 1.5
            So P(heads) = 1/(1+1.5) = 2/5.

        Therefore, the participant using SSA would bet on heads (because 3/5 > 1/2) and the one using SIA would bet on tails (because 3/5 for tails under SIA? Actually, P(tails)=1.5/2.5=3/5, which is greater than 1/2, so they would bet on tails).

  - 70-75 min: Map Act 2:
        Under SSA: No update from the fact that you exist because in both worlds you exist (you are an observer). So P(A) = P(B) = 1/2 -> indifferent.
        Under SIA: 
            P(A | you exist) proportional to P(A) * number in A = (1/2) * 1e9
            P(B | you exist) proportional to (1/2) * 1e12
            So P(A | you exist) is about 1e9 / (1e9 + 1e12) ≈ 1e9/1e12 = 0.001, and P(B)≈0.999.

        Therefore, under SIA they would bet on B.

  - 75-80 min: Discuss the presumptuous philosopher: the argument that under SIA, we would believe the universe is vast even without any evidence, because it makes our existence more likely. But is that reasonable? Note: this is a live debate. Some think it is a reductio of SIA, while others think it is correct.

  - 80-85 min: Address failure modes that arose during the activity.

  - 85-90 min: Closing question: "In Act 1, if we changed the setup so that the coin flip determined whether there were 1 copy (2 observers) or 1000 copies (1001 observers), how would that change the probability of heads under SSA and under SIA? And in Act 2, if we changed Theory A to 1 observer and Theory B to 1e100 observers, how would that affect the bet under SIA?"

     This checks if they can compute the probabilities. They should say:
        Act 1 under SSA: 
            P(H|you) = [1/2 * (1/2)] / [ (1/2)*(1/2) + (1/2)*(1/1001) ] 
            = (1/4) / (1/4 + 1/2002) ≈ (1/4) / (1/4) = 1? But note: 
            denominator: 1/4 + 1/2002 = (501 + 2)/2004 = 503/2004
            numerator: 1/4 = 501/2004
            so P(H|you) = 501/503 ≈ 0.996.

        Under SIA:
            P(H) proportional to 2, P(T) proportional to 1001 -> P(H) = 2/(2+1001) ≈ 2/1003 ≈ 0.002.

        Act 2 under SIA: P(B) ≈ 1.

     This shows they understand the scaling.

  Note on contested issues: 
     - There is no consensus on which assumption is correct. Some philosophers accept SSA, some SIA, and some have other proposals. The presumptuous philosopher is a point of contention: some take it as a reductio of SIA, while others bite the bullet.

  We must also note that the term "Self-Indication Assumption" has been used in slightly different ways. We are using the formulation: the prior probability of a world is proportional to the number of observers in it (so that the probability of a world given that you exist is proportional to the original prior times the number of observers). This is sometimes called the "SIA update".

  A careful critic might reject the setup of Act 1 because it explicitly samples the participant from the existing observers, which already builds in SSA. But note: we are not building SSA into the scoring rule. The participant is free to use SIA if they wish. The sampling procedure is part of the scenario: we are telling them that they were randomly selected. So the scenario is that there is a random sampling. The question is: how should they update their credence about the world given that they were selected? Both SSA and SIA are ways to update.

  But note: in the SIA literature, sometimes SIA is applied even in the absence of a random sampling. We are using a scenario that includes random sampling to make the SSA update natural. The critic might say that in Act 1, the random sampling is part of the setup, so SSA is the correct update. However, the SIA proponent might still apply SIA on top of the random sampling? Actually, the two assumptions are about different things. 

  We must be cautious: the activity does not resolve the dispute, it only illustrates the two positions.

  This activity is designed to be run in the time and with the materials available. It should be engaging and make the abstract concepts tangible.
answer: |-
  ### Brainstormed Alternatives and Selection

  **Candidate 1: "Observer Lottery"**  
  *Mechanics:* Participants draw numbered tickets from a hat. A coin flip (secret) determines if tickets 1–12 are "real" (H) or tickets 1–24 are "real" (T). After drawing, participants bet on H/T with asymmetric payoffs (win 3 chips if H, lose 1 if wrong).  
  *Why reject:*  
  - Fails "real copy" constraint (tickets aren’t copies; feel arbitrary).  
  - No natural transition to Act 2 (world-size bet).  
  - Participants might see it as a pure probability game, not identity/multiplicity.

  **Candidate 2: "Parallel Worlds Auction"**  
  *Mechanics:* Two "worlds" (A/B) are secretly chosen via coin flip, each with different observer counts (e.g., A: 1e9, B: 1e12). Participants bid chips on which world is actual, winner-takes-all.  
  *Why reject:*  
  - Skips Act 1 (no copy-driven multiplicity effect).  
  - Payoff rule presupposes SIA (bidding incentivizes betting on larger worlds).  
  - Feels abstract; no tangible "copying" mechanic.

  **Candidate 3: "Duplication Chamber" (Selected)**  
  *Mechanics:* A volunteer is "copied" via index cards representing duplicates. Coin flip determines copy count (H: 1 copy, T: 2 copies). A random card draw selects the "speaker" who bets on H/T. Act 2 shifts to a world-size bet with no observational data.  
  *Why chosen:*  
  - Uses cards/envelopes to tangibly simulate copying (not awakenings).  
  - Separates Acts 1 and 2 cleanly.  
  - Payoff rules neutral (verified by probability calculus).  
  - Copying mechanic forces confrontation with observer-count uncertainty.

  ---

  ### Chosen Activity: "The Duplication Chamber"  
  **Materials:**  
  - 1 coin  
  - 15 index cards (12 + extras)  
  - 15 envelopes  
  - Poker chips (30+), whiteboard  
  - Timer  

  **Run Sheet (90 mins total):**  

  #### **Act 1: Copy Bet (35 mins)**  
  1. **Setup (0–5 mins):**  
     - Explain: *"A machine creates copies of a person. A coin flip (H/T) decides how many copies: H = 1 copy (2 people total), T = 2 copies (3 people total). Copies are identical and unaware of their status."*  
     - Ask for 1 volunteer ("Target"). Others observe.  

  2. **Copy Creation (5–10 mins):**  
     - Flip coin secretly.  
     - Prepare cards:  
       - H: Cards labeled "Original" and "Copy 1".  
       - T: Cards labeled "Original", "Copy 1", "Copy 2".  
     - Seal cards in envelopes, shuffle.  

  3. **Selection and Betting (10–20 mins):**  
     - Draw one envelope randomly. Target opens it—this is "them" (e.g., "Copy 1").  
     - Announce: *"You are one observer among those created. Bet on the coin flip: if you bet H and correct, win 3 chips; if wrong, lose 1 chip. Same for T: win 3 if right, lose 1 if wrong."*  
     - Target writes bet (H/T) on card, stakes 1–3 chips (default: 1).  

  4. **Reveal & Payout (20–35 mins):**  
     - Reveal coin flip and all envelopes (show total observers).  
     - Award/lose chips. Record outcome on whiteboard.  

  #### **Act 2: World-Size Bet (30 mins)**  
  5. **Setup (35–40 mins):**  
     - Reset: *"New scenario. Two theories about the universe: Theory A (1 billion observers), Theory B (1 trillion observers). A coin flip picks the true theory."*  
     - Flip coin secretly.  

  6. **Betting & Defense (40–50 mins):**  
     - Select new volunteer.  
     - *"You exist in this universe. Bet on A or B. If right, win 1 chip; if wrong, lose 1 chip. Stake 1–3 chips (default: 1). Defend your choice to the group."*  
     - Volunteer writes bet + justification on card. Group discusses (5 mins).  

  7. **Reveal & Payout (50–65 mins):**  
     - Reveal coin flip. Award/lose chips.  

  #### **Debrief (25 mins)**  
  8. **Mapping Concepts (65–80 mins):**  
     - **Act 1 Recap:** *"Why did you bet as you did? Some reasoned: ‘I’m randomly sampled from actual observers, so H (fewer observers) makes my selection likelier’ (SSA → P(H)=3/5). Others: ‘More observers in T makes my existence likelier’ (SIA → P(H)=2/5)."*  
     - **Act 2 Recap:** *"Why bet on B? SIA says: a universe with 1e12 observers makes your existence 1000x likelier than 1e9 → P(B)≈1. SSA says: no update from existence alone → P(A)=P(B)=1/2."*  
     - **Presumptuous Philosopher:** *"SIA implies we should believe the universe is vast without evidence—because it ‘explains’ our existence. Is that reasonable?"*  

  9. **Terminology (80–85 mins):**  
     - Define:  
       - **SSA:** Reason as if randomly drawn from *actual* observers in your reference class.  
       - **SIA:** Reason as if randomly drawn from *possible* observers, weighted by probability of their existence.  
     - Clarify: *"SIA’s name is sometimes used for related ideas (e.g., indexical weighting). No consensus—some accept SIA, some see it as a reductio."*  

  10. **Closing Question (85–90 mins):**  
      - *"In Act 1, if the coin flip meant H: 1 copy (2 observers) or T: 100 copies (101 observers), how would SSA and SIA update the probability of H after you’re selected?"*  
      - (Correct: SSA → P(H)≈99%, SIA → P(H)≈2%).  

  ---

  ### Predicted Failure Modes and Responses  
  1. **"A copy isn’t really me!"**  
     - *At the moment:* "In this thought experiment, treat copies as observers with identical experiences. The question is how *you* would reason if you woke up unsure if you’re the original or a copy."  
     - *Debrief tie:* Discuss how identity assumptions affect reference classes.  

  2. **"This is just a probability puzzle."**  
     - *At the moment:* "True, but focus: why do we *disagree* on probabilities? The math diverges based on how we view our role as observers."  
     - *Debrief tie:* Highlight how SSA/SIA resolve the ambiguity differently.  

  3. **"The payout rule favors SSA/SIA!"**  
     - *At the moment (Act 1):* "The payoffs are set so expected value is positive under *both* if you bet correctly. SSA prefers betting on H, SIA on T—neither is forced."  
     - *Debrief tie:* Show probability calculations (P(H)=3/5 under SSA, 2/5 under SIA).  

  ---

  ### What the Activity Cannot Reproduce  
  - **Subjective identity confusion:** Physical duplication is simulated via cards, so participants never *feel* uncertain about who they are.  
  - **Infinite/continuous cases:** The setup handles discrete counts poorly (e.g., 1e12 observers).  
  - **Reference-class problem:** Debrief must clarify that SSA/SIA assume a fixed reference class (e.g., "observers like me"), which is contested.  

  **Supplement in words:**  
  - *"In real self-locating uncertainty, you might genuinely not know which observer you are. Here, you roleplay it. Also, SSA/SIA get thorny with vague reference classes (e.g., is a chimp an ‘observer’?)."*  

  ---

  ### Closing Question  
  **"In Act 2, if Theory A had 1 observer and Theory B had 1,000 observers, how would SIA update the probability of B after learning you exist? How does this contrast with Act 1?"**  
  - *Tests understanding:* SIA updates P(B) to ≈99.9%, while Act 1’s SSA doesn’t update from existence alone. Reveals if they distinguish *indexical evidence* (Act 1) from *existence evidence* (Act 2).
