prompt: |-
  In much of the United States a woman may be paid for her eggs and paid to carry a pregnancy to term, and the resulting agreement is treated as an enforceable contract; in many European states the same transactions become unlawful once money changes hands, and only unpaid donation with reimbursement of expenses is permitted. What does that division presuppose about persons, bodies, and the proper bounds of the market? Reconstruct the implicit theory on each side. Does the ban rest on the claim that reproductive labor and gametes are not the kind of thing that can rightly be sold, so that the sale itself wrongs the seller or degrades a good; or on a claim about exploitation and coercion against a background of inequality, so that the sale is not wrong in itself but is wrong here; or on straightforward paternalism toward the woman? Distinguish which of these the practice strictly requires from which it merely fits, and say where the law is philosophically underdetermined. Then probe the internal consistency of the banning regimes: they refuse to let reproductive capacity be bought, yet they allow the parentage of the resulting child to be reassigned by prior agreement, and they police a line between expenses and payment that in practice may be hard to hold. Which commitment does that tension expose, and what would have to change in the law if we replaced the commodification view with the exploitation view, or with the liberal contract view the American market seems to embody? If the question rests on a false premise — if no single commitment is shared across these regimes, or the asymmetry is less principled than it appears — say so plainly rather than assembling a unified theory to satisfy me.
reasoning: |-
  Hmm, the user is asking about the philosophical presuppositions behind the different legal approaches to reproductive transactions in the US versus Europe. They want me to reconstruct the implicit theories on each side, analyze whether bans rest on commodification concerns, exploitation worries, or paternalism, and examine internal tensions in banning regimes. This is a complex bioethics and legal philosophy question.

  The key distinction here is between the US model (where payment for eggs and surrogacy is treated as enforceable contracts) and the European model (where only unpaid donation with expense reimbursement is permitted). I need to unpack what each approach assumes about persons, bodies, and market boundaries.

  For the US liberal contract view, it seems to presuppose that reproductive labor and gametes are alienable property-like assets. The body is treated as belonging to the individual who can freely transfer rights over it through contracts. This view emphasizes autonomy and sees markets as efficient allocation mechanisms. There's a strong Lockean "self-ownership" assumption here.

  The European ban regimes appear rooted in commodity resistance theory. They likely view reproductive capacities as inalienable aspects of personhood - not proper subjects for market exchange. The worry is that commercialization degrades human dignity and turns intimate bodily processes into commodities. This reflects a Kantian/Rousseauvian concern about markets corrupting fundamental values.

  When examining the justification for bans, I should distinguish between three possibilities: 1) intrinsic wrongness of selling (commodification), 2) contextual wrongness due to exploitation/inequality, or 3) paternalistic protection of women. The European approach seems primarily based on the first view - that the sale itself is degrading regardless of consent. But exploitation concerns may provide supplementary justification.

  There are noticeable tensions in the European model though. While prohibiting payment, these regimes still allow non-commercial gestational surrogacy and enforce parentage reassignment. They also permit expense reimbursements that can functionally resemble payments. This creates inconsistency - if reproductive capacity is truly inalienable, how can we legally transfer parental rights? The distinction between "expenses" and "payment" seems philosophically unstable.

  If we shifted to an exploitation-focused view instead of commodification, the law would need robust protections against coercion while permitting compensated transactions. We'd see means testing, price regulations, and mandatory counseling rather than blanket bans. A full liberal contract approach would eliminate most restrictions beyond standard contract law requirements.

  I should note that this analysis risks overgeneralizing - European approaches aren't monolithic (France bans surrogacy entirely while the UK allows "altruistic" versions). The division may be less principled than it appears, with historical contingencies and cultural differences playing significant roles. The user seems sophisticated enough to handle this complexity - they specifically asked not to force a unified theory if none exists.
answer: |-
  The transatlantic divergence in regulating reproductive transactions rests on fundamentally different conceptions of personhood, bodily integrity, and market boundaries. Here's a reconstruction of the implicit theories and their tensions:

  ### Presuppositions and Implicit Theories
  1. **US Liberal Contract Model Presupposes:**
     - **Bodies as Self-Owned Property:** Individuals possess strong proprietary rights over their bodies and reproductive capacities, extending to gametes and gestational labor.
     - **Autonomy as Market Freedom:** Personal autonomy is realized through contractual freedom, including commodifying bodily services if consensual.
     - **Market Neutrality:** Markets are neutral tools for allocating resources; regulation focuses on preventing fraud/coercion, not moralizing exchanges.
     - **Pragmatism:** Payment incentivizes supply, fulfilling demand for fertility services efficiently.

  2. **European Ban Regimes Presuppose:**
     - **Bodily Integrity as Inalienable:** Reproductive capacities are intrinsic to personhood and dignity; their commodification violates the "non-commercialization principle" (Council of Europe).
     - **Human Dignity Over Autonomy:** Certain aspects of human life (gametes, gestation) must remain "market-inalienable" (Radin) to prevent degradation of shared values.
     - **Social Embeddedness:** Reproduction is a social good, not purely private; market logic corrupts its relational nature.
     - **Vulnerability Protection:** Reproductive labor occurs against backgrounds of structural inequality, making "free consent" suspect even without overt coercion.

  ### Justifications for Bans: Core vs. Supplementary
  - **Primary Justification:** The ban **strictly requires** the **commodification view** – selling gametes/gestation is *intrinsically wrong* as it commodifies human life and degrades dignity (e.g., French "indisponibilité du corps humain"). Payment itself constitutes harm.
  - **Supplementary Fit:** Exploitation concerns *fit* the ban (reinforcing it) but aren't strictly necessary. If inequality vanished, the commodification objection would likely persist (e.g., bans in egalitarian Nordic states). Paternalism is largely incidental; bans target the transaction's morality, not solely the woman's welfare.
  - **Underdetermination:** The law is philosophically underdetermined on **where the "inalienable" boundary lies**. Why permit blood/sperm donation but not eggs? Why allow kidney sales in some markets but not wombs? The line between "reimbursement" and "price" remains contested without deeper anthropological justification.

  ### Internal Tensions in Banning Regimes
  1. **The Parentage Reassignment Gap:**  
     Courts enforce agreements assigning parentage to intended parents *despite* banning payment for the gestational labor producing that child. This exposes a **dual commitment**:  
     - Reproductive *capacity* is inalienable (can't be sold), but  
     - Reproductive *outcomes* (parental rights) are alienable via agreement.  
     *Tension reveals*: The regimes prioritize the symbolic protection of bodily integrity over logical consistency, implicitly treating gestation as a service whose *fruits* (but not the *act*) can be commercially transferred.

  2. **The Expense/Payment Fiction:**  
     Permitting "reasonable expenses" while banning "profit" creates an unstable boundary (e.g., UK £750 egg "compensation" vs. US $10k+ payments). This exposes:  
     - **Hypocrisy in commodification logic:** If paying $20k for eggs commodifies, why doesn't paying $2k for "time and inconvenience"?  
     - **Practical accommodation:** The distinction is a concession to necessity, undermining the purity of the anti-commodification stance.

  ### Alternative Frameworks: Legal Implications
  - **Replacing Commodification with Exploitation View:**  
    - Law would permit payment but regulate conditions: mandatory independent legal counsel, wage-like price floors/ceilings, screening for socioeconomic vulnerability.  
    - Focus shifts to power imbalances (e.g., banning agencies recruiting from low-income countries).  
    - **Tension resolved:** Payment is legitimate if structural coercion is mitigated; parentage assignment aligns with compensated labor.

  - **Adopting US Liberal Contract Model:**  
    - Enforce contracts like other service agreements; invalidate only for fraud/duress.  
    - Remove expense/payment distinction; allow market pricing.  
    - **Tension resolved:** Gestational labor is fully alienable; payment and parentage transfer are mutually reinforcing contractual elements.

  ### Critical Caveat: False Premise Risks
  The asymmetry **is less principled than it appears**. European regimes lack unity:  
  - Some (e.g., Germany) emphasize dignity/commodification.  
  - Others (e.g., UK) emphasize exploitation in altruistic surrogacy/egg donation but permit "expenses" that resemble payment.  
  - France's *absolute* ban on surrogacy reflects bioconservatism distinct from Nordic gender equality concerns.  

  Meanwhile, US practice isn’t purely libertarian: many states restrict surrogacy payments, and IVF industry self-regulation addresses ethical concerns. **No single philosophical commitment explains either bloc** – divergent legal cultures, feminist movements (radical vs. liberal), and historical path dependencies matter as much as principle. The "division" oversimplifies a spectrum of approaches shaped by local politics as much as moral theory.

  ### Conclusion
  The core divide lies in whether reproductive material/labor falls within the **market's proper bounds**. Banning regimes predominantly presuppose its intrinsic inalienability, creating tensions with their enforcement of parentage agreements and expense reimbursements. Yet attempts to impose a unified theory on either side falter against legal pluralism and pragmatic compromises. The law’s underdetermination persists because it mediates between irreconcilable visions: the body as sovereign property versus a vessel of inviolable human dignity.
