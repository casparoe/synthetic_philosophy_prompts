answer: |-
  Here's the translation of collective intentionality theories into distributed systems vocabulary, followed by a residue analysis and verdict:

  ### Translated Protocols
  1.  **Margaret Gilbert's "Plural Subject" Protocol:**
      *   **Protocol Type:** Stateful Coordination Protocol with Normative Locking.
      *   **Core Mechanism:** A **Joint Commitment** is established through a distributed agreement phase (akin to Phase 1 of 2PC, but with explicit mutual acknowledgment of *obligation*). This creates a **Plural Subject** – a new logical entity representing the group's unified goal state.
      *   **Lock Semantics:** Participants acquire an **obligation lock**. A node cannot unilaterally release its lock (`walk away`). Release (`rescission`) requires a unanimous commit/abort vote (modified Phase 2 of 2PC). Violations trigger *obligation faults* (beyond mere state inconsistency).
      *   **Group Primacy:** The Plural Subject's state (`we intend to carry the table`) is the primary entity; individual node states (`I intend to lift`) are derived outputs.

  2.  **Michael Bratman's "Shared Intention" Protocol:**
      *   **Protocol Type:** Decentralized Cooperative Planning Protocol.
      *   **Core Mechanism:** **Shared Intention** emerges from **Interlocking Plans** (distributed, partially ordered state transition plans) plus **Mutual Responsiveness** (continuous gossip/event-sourcing of state & intent, triggering dynamic plan adjustments).
      *   **Coordination:** No global lock. Uses **optimistic concurrency control** with compensation logs. Nodes constantly broadcast their local plan state (`lifting my corner`, `moving left`) and react to others' states (`adjusting grip because Node B slipped`).
      *   **Goal:** Maintain eventual convergence on the joint goal state (`table upstairs`) through iterative plan meshing. Relies heavily on **common knowledge lite** (eventually consistent state views via gossip).

  3.  **John Searle's "Primitive Collective Intentionality" Protocol:**
      *   **Protocol Type:** Atomic Primitive Operation.
      *   **Core Mechanism:** `We-Intend(X)` is a **fundamental, irreducible opcode** in the node's instruction set. It cannot be compiled down to `I-Intend(Y)` plus `Knows(I-Intend(Y))` plus `Knows(Knows(...))` (common knowledge).
      *   **Execution:** Invoking `We-Intend(carry_table)` atomically sets a collective intention register. Implementation is a **black-box hardware primitive** or a trusted subsystem (like a TPM module for group intent).
      *   **State:** The collective intention exists as a primitive system state, not composed from individual states. Common knowledge is an *output*, not an input.

  ### Residue Report: What Survives, Distorts, or Vanishes

  | Feature                 | Gilbert                                                                 | Bratman                                                                 | Searle                                                                 |
  | :---------------------- | :---------------------------------------------------------------------- | :---------------------------------------------------------------------- | :--------------------------------------------------------------------- |
  | **Joint Commitment**    | **Clean:** ≈ Lock w/ complex semaphore (mutual consent release).        | **Partial:** ≈ Optimistic coordination; "commitment" is emergent, soft. | **None:** Primitive op has no "commitment phase."                      |
  | **Obligation/Normativity** | **Distorted:** Protocol locks *simulate* obligation via fault detection (timeouts → abort). The *moral "ought"* (Gilbert's core) has **no counterpart**. Systems have faults, not "wrongdoing." | **Minimal:** Mutual responsiveness enables cooperation but implies no *duty*. Residue: soft "should" for liveness. | **None:** The primitive op executes or fails; no normative layer.    |
  | **Group Entity (Plural Subject)** | **Distorted:** Protocol can track group state ("committed"), but it's just data. Gilbert's *metaphysical entity* **vanishes**. | **None:** Only interacting individual states.                           | **Clean(ish):** Primitive op *is* the group state atomically.          |
  | **Reducibility**        | **Partial:** Joint state reducible *if* obligation semantics are ignored. | **Clean:** Explicitly reducible to interlocking plans + messaging.      | **Anti-Clean:** Primitive *cannot* be reduced; it's axiomatic.         |
  | **Common Knowledge**    | **Required:** For obligation locks (nodes know commitment state).       | **Lite:** Eventual consistency suffices for responsiveness.             | **Output, Not Input:** Emerges *from* the primitive, not foundational. |
  | **Mutual Responsiveness** | **Minimal:** Locks prevent conflict; no dynamic adjustment.             | **Clean:** Core mechanism (gossip + plan adjustment).                   | **None:** Primitive op execution is atomic; no feedback loop.          |

  ### Gilbert's Normativity: Simulation, Not Reality
  Protocols **merely simulate** obligation via locks and timeouts:
  1.  **Locks:** Enforce *consistency*, not obligation. A node abandoning its lock causes an *inconsistency fault* (detected via timeout), not a *moral violation*. The "ought" is replaced by a fault detection mechanism.
  2.  **Timeouts:** Mechanically trigger recovery (abort/retry), not censure. There's no concept of "you *shouldn't* have done that," only "your node was partitioned; initiating abort."
  3.  **Rescission Consensus:** Mutual agreement for release is a *consistency protocol* (Paxos on abort), not recognition of a normative bond. The residue is the *feeling* of obligation humans project onto the protocol's mechanics.

  ### The Residue: Vocabulary Limit or Philosophical Excess?
  *   **It's a vocabulary limit:** Distributed systems fundamentally model *causal interactions* and *state transitions*. **Normativity, irreducible group minds, and moral "oughts" are outside their operational domain.** Protocols handle *what is* (states, messages, faults), not *what ought to be* in the philosophical sense. Gilbert's obligations and Searle's primitive "we-intent" describe phenomenological/social realities that lack mechanical analogues.
  *   **...But also philosophical excess?** Searle's irreducibility claim struggles under translation. If Bratman's reducible model (interlocking plans + messaging) operationally achieves the same goal as invoking a `We-Intend` primitive, the "primitive" adds no *functional* value in the system design. Its residue is purely metaphysical. Gilbert's normativity, while real phenomenologically, isn't necessary to *describe* the protocol's function – only to *justify* its human-level expectations.

  ### Verdict for Table-Carrying: Bratman's Protocol Wins
  For two people carrying a table:
  1.  **Bratman:** Cleanly maps. Agents form individual plans ("lift my end," "step up"). They constantly communicate intent & state ("ready?" "step now!" "tilt left!") and responsively adjust (interlocking plans + mutual responsiveness). Goal achievement is emergent. *This is exactly how distributed cooperative tasks work.*
  2.  **Gilbert:** Overly rigid. While they *feel* obligated not to drop their end suddenly, the real-time coordination requires constant Bratman-style responsiveness, not just a one-time commitment lock. The normativity residue is real but not the *mechanism* of coordination.
  3.  **Searle:** Functionally empty. Invoking a "we-carry" primitive doesn't explain *how* they synchronize steps or adjust grip. The actual work is done by Bratman-style continuous coordination.

  **Conclusion:** Bratman's model translates most cleanly into the operational reality of distributed coordination protocols (and table-carrying). Gilbert captures crucial *human* expectations (normativity) but not the underlying mechanics. Searle's primitive adds no explanatory power for the *process* of coordination. The residue highlights the gap between mechanistic coordination and human social phenomenology, not a flaw in either domain.
