prompt: |-
  I teach a 90-minute session for about 18 graduate students drawn from economics, statistics, and philosophy, and I want them to feel — in their own bankrolls — why repeatedly taking a favorable gamble at the stake that maximizes expected value is a reliable way to go broke, and why the proposed fix is to maximize the growth rate of one's wealth instead of its expected value.

  Design the game. Participants should start with a common bankroll, know the per-round odds and the win probability, and choose each round how much of their current bankroll to stake; I want the arithmetic of a favorable even-money bet to look compelling enough that most of the room stakes recklessly at the outset. Build in whatever structure is needed — parallel worlds, a public ledger, a borrowing rule, several rounds of play — so that the group runs into the gap between the ensemble average and the typical outcome before anyone names the growth-rate criterion. Include rules, materials, a round-by-round timeline, a payoff scheme that requires no real money, and a debrief that maps what happened onto the log-optimal stake, what overbetting past it does to the growth rate, and the contrast between the time-average and the average across players.

  Tell me honestly what will predictably go wrong the first time I run it, and how to keep a lucky early run from teaching the opposite lesson. Be frank, too, about what the game cannot reproduce: I suspect it can dramatize the growth-rate argument but not settle whether maximizing geometric growth is normatively required of a rational agent, as opposed to one defensible policy among others. If that is right, say so plainly and tell me what I have to supply in the debrief myself, rather than papering over the gap.
reasoning: |-
  We are designing an educational game to illustrate the Kelly criterion and the pitfalls of overbetting in repeated favorable gambles. The key insights we want to convey:
  1. A favorable gamble (positive expected value) can still lead to ruin if bet sizes are too large.
  2. Maximizing expected value per round leads to overbetting and ruin in the long run.
  3. Maximizing the expected growth rate (i.e., the Kelly criterion) is the strategy that maximizes long-term wealth growth and avoids ruin.

  Game Design:

  Title: "The Growth Gambit"

  Objective: Students experience the tension between maximizing expected value and maximizing growth rate by repeatedly betting on a favorable coin toss. They will see that betting too high a fraction of bankroll leads to bankruptcy for many, while the Kelly fraction leads to the highest growth and avoids ruin.

  Setup:
  - Each student starts with a bankroll of $100 (play money).
  - The game consists of multiple rounds (at least 10, but we can adjust based on time).
  - In each round, every student decides what fraction of their current bankroll to bet (between 0% and 100%).
  - The bet is on a coin toss that pays even money (if you bet $b and win, you get $b; lose, you lose $b).
  - The coin is biased: probability of heads (win) is p = 0.6 (so it's favorable). The probability of tails (loss) is q = 0.4.

  Note: We choose even money for simplicity and a win probability of 0.6 to make the expected value clearly positive. The Kelly fraction for this bet is f* = p - q = 0.6 - 0.4 = 0.2 (i.e., 20% of bankroll).

  Structure:
  1. The game will be played in several rounds (say 10 rounds). We can run more if time permits.
  2. To show the ensemble average and typical outcome, we will have each student play independently (parallel worlds) and also we will track the average bankroll and the median bankroll over time.
  3. We will have a public ledger (e.g., a spreadsheet projected) that records each player's bankroll after each round. This will show the distribution of outcomes.

  Rules:
  - No borrowing: students cannot bet more than they have.
  - Bankroll is updated after each round.

  Materials:
  - A computer with a spreadsheet (like Excel or Google Sheets) to record and display the bankrolls.
  - A way to simulate coin tosses (could be a random number generator in the spreadsheet, or a physical coin if we want, but with bias we need to simulate 60% heads. We can use a die or just RNG).
  - Each student has a worksheet to track their own bankroll and bets.

  Round-by-Round Timeline:

  1. Introduction (10 minutes):
     - Explain the rules and the goal: maximize your wealth after 10 rounds.
     - Explain the bet: even money, win with probability 0.6.
     - Ask students: "What fraction of your bankroll should you bet each round to maximize your expected wealth at the end?"
     - Let them think and write down their initial bet fraction.

  2. Round 1 (5 minutes):
     - Each student decides their bet fraction (f) for the first round and writes it down.
     - They calculate the bet amount: f * current bankroll.
     - The instructor collects the bet fractions (or students input into a shared spreadsheet).
     - Simulate one coin toss for the entire class? But then everyone would have the same outcome. Instead, we want independent outcomes. So we simulate a coin toss for each student independently (using RNG in the spreadsheet).

  3. Round 2 to Round 10 (5 minutes per round, total 45 minutes):
     - Repeat the process: students decide their bet fraction based on their updated bankroll.
     - We can speed up by having students input their bet fraction for the next round immediately after updating their bankroll.

     Note: To save time, we can have students input their bet fraction for all rounds at the beginning? But that would not allow them to adapt. Alternatively, we can let them choose a fixed fraction for all rounds at the beginning? That might be acceptable and faster. We can do:

     Option A: Let them choose a fixed fraction at the beginning and stick to it. Then we run 10 rounds quickly.

     Option B: Let them change each round. But that might take too long.

     Given time constraints (90 minutes total), we do:

     - Pre-game: Each student chooses a fixed fraction they will use for all 10 rounds. They write it down and submit it at the start.
     - Then we run 10 rounds in quick succession (using a spreadsheet to do all the calculations).

     We'll go with Option B for more learning, but with a twist: we'll have the spreadsheet do the heavy lifting. We can have a Google Form or a shared spreadsheet where each student inputs their fixed fraction? Or they input their fraction for each round as we go? The latter is more flexible but time-consuming.

     Alternative plan for time:

     - Students are divided into groups of 3-4. Each group decides a fixed fraction to use for the entire game. Then each group is treated as one player. We have 4-6 groups. Then we can run the game quickly.

     Given 18 students, we can have 6 groups of 3. Each group decides a fixed fraction to bet in every round.

     Steps:
       - Groups form and decide their fixed fraction (5 minutes).
       - Each group starts with $100.
       - For each round, the instructor simulates a coin toss for each group (using a random number generator: if random() < 0.6, then win; else lose). We do this for all groups simultaneously.
       - The spreadsheet updates the bankroll for each group and displays it.

     This reduces the number of players to 6, making the display manageable and the simulation quick.

  4. Mid-game discussion (after round 5, 5 minutes):
     - Show the current state: display the bankrolls of the 6 groups.
     - Ask: "What is happening? Are you growing as expected? What do you notice about the groups that bet high fractions?"

  5. Continue to round 10.

  6. After round 10 (10 minutes for discussion and data collection):
     - Display the final bankrolls of all groups and the path they took.
     - Compute the average bankroll and the median bankroll at the end.

  7. Debrief (20 minutes):

  Debrief Points:

  a) Ensemble Average vs. Typical Outcome:
     - The expected value of the bankroll after n rounds if betting a fraction f:
          E[W_n] = W_0 * [1 + f*(2p-1)]^n
       But note: this is the expected value, not the typical outcome. The typical outcome is determined by the geometric growth rate.

     - The growth rate per round is:
          G(f) = p * ln(1+f) + q * ln(1-f)
       and we maximize G(f) by choosing f* = p - q = 0.2.

     - Show the bankrolls of the groups that bet more than 20% (especially those that bet 50%, 80%, 100%). Some of these might have gone to zero (if they lost once when betting 100% they are out). Others might have high bankrolls (if they were lucky). But the median bankroll will be low.

     - Compare with the group that bet 20%: they are likely to have grown steadily.

  b) The Kelly fraction (20%) maximizes the long-run growth rate. Betting more than Kelly (overbetting) reduces the growth rate and increases the risk of ruin.

  c) Contrast:
     - The ensemble average (average across the groups at the end) might be high because one or two groups that bet high and got lucky might have huge bankrolls. But the median bankroll (typical outcome) is much lower and might even be zero for some.
     - The time-average growth rate (if we look at the logarithm of bankroll) will be highest for the group that bet Kelly.

  d) What went wrong for the high bettors?
     - The risk of ruin: if you bet 100% and lose (which has a 40% chance each round), you are broke. Even betting 50%: after a loss, you have half, then if you bet 50% again, you need to win to recover. But the probability of having a losing streak is significant.

  e) Why maximizing expected value per round is flawed?
     - If you bet to maximize expected value in one round, you would bet 100% because:
          EV = 0.6 * (2 * bankroll) + 0.4 * 0 = 1.2 * bankroll
          So expected bankroll after one round is 120% of current. But doing this repeatedly leads to ruin almost surely.

  f) What the game cannot do:
     - It cannot prove that maximizing the geometric growth rate is the only rational choice. Other utility functions (e.g., risk aversion) might lead to different choices. Also, if the number of bets is small, then expected value maximization might be reasonable. But for repeated bets, Kelly is the strategy that maximizes the long-run growth rate and minimizes the time to reach a given wealth goal.

     - In the debrief, you must supply:
          * The mathematical derivation of the Kelly criterion (via maximizing the expected log wealth).
          * The argument for why we care about the long-run growth: if we are going to face many similar opportunities, then we want to maximize the rate of growth.
          * The caveat: Kelly betting can be volatile (it has a high variance in the short run). Some investors might prefer a fractional Kelly to reduce volatility.

     - Also note: Kelly is optimal for logarithmic utility. If a player has a different utility function (e.g., they are risk averse in a different way), they might choose a different fraction.

  What can go wrong:

  1. A group that bets a high fraction (say 100%) might get lucky and win 10 times in a row. Then their bankroll becomes $100 * (2)^10 = $102,400. This might lead students to think that betting high is the best strategy.

     Mitigation:
        - Point out that this outcome is very rare (probability 0.6^10 ≈ 0.006). Meanwhile, the chance of going broke by round 10 is high for a 100% bettor (1 - 0.6^10 ≈ 0.994). But note: if they never lose, they don't go broke. However, in the long run, the probability of ruin for a 100% bettor is 1 (because eventually they will lose).
        - Compare the median outcome: most groups that bet high will have gone broke. Only a few will have high bankrolls. The average bankroll might be high because of the lucky group, but the typical group (median) is broke.
        - Use the log scale: plot the final bankrolls on a log scale to show that the 100% bettor either has a very high bankroll or zero. The Kelly bettor has a steady growth.

  2. Time constraints: The game might run longer than expected.

     Mitigation:
        - Use groups (6 groups) and a spreadsheet to automate the calculations.
        - Pre-determine the coin tosses? We can generate the 10 coin tosses for each group in advance and then just reveal them round by round.

  3. Students might not understand the update rule.

     Mitigation:
        - Provide a clear example: if you have $100 and bet 50% ($50), and you win, you get $50 so new bankroll = $150. If you lose, you lose $50 so new bankroll = $50.

  4. Some groups might choose fractions very close to Kelly and the difference might not be stark.

     Mitigation:
        - Encourage some groups to bet high (by suggesting that the expected value is maximized at 100%) and some to bet low. You can even assign fractions: have one group bet 100%, one 80%, one 50%, one 20% (Kelly), one 10%, and one 5%. This ensures the comparison.

     Alternatively, let groups choose freely but then in the debrief, compare the chosen fractions and their outcomes.

  5. The lesson might be obscured if the Kelly group has a bad run.

     Mitigation:
        - The probability of the Kelly group having a losing record after 10 rounds is low but possible. We can compute the expected growth and show the theoretical growth even if the actual run was bad.

        Theoretical growth per round for Kelly: 
            G(0.2) = 0.6 * ln(1.2) + 0.4 * ln(0.8) ≈ 0.6*0.1823 + 0.4*(-0.2231) ≈ 0.1094 - 0.0892 = 0.0202 (i.e., about 2% growth per round).

        After 10 rounds, the expected log wealth is 10 * 0.0202 = 0.202, so the expected wealth is 100 * exp(0.202) ≈ $122.4. But note: the actual outcome might be above or below.

        However, if the Kelly group has a bad run, we can point out that the strategy is still the one that maximizes the growth rate and that in the long run it will outperform.

        - We can run a simulation for 100 rounds (offline) to show the long-run effect.

  6. The game might not run long enough to see ruin for high bettors.

     Mitigation:
        - With 10 rounds and a 40% chance of loss per round for a 100% bettor, the probability of at least one loss is 1 - (0.6)^10 ≈ 0.994. So it's very likely that the 100% bettor will be broke by round 10. However, if they win the first 10, they survive. We can pre-run the simulation and choose a sequence that includes at least one loss for the 100% bettor? But that would be cheating. Alternatively, we can run more rounds (if time) or use a pre-simulated example that shows ruin.

        - Alternatively, we can run a second simulation with 100 rounds (pre-computed) and show the results.

  Payoff Scheme:

  No real money. The winner (if we want to declare one) is the group with the highest bankroll. But note: the group that bet 100% and got lucky will win. However, the point is to show that this is not a reliable strategy.

  Debrief Structure:

  1. Display the final bankrolls and the path of each group on a shared screen.
     - Use a bar chart for final bankrolls (log scale if possible) and also show the bankroll over rounds for each group (line chart, log scale on y-axis).

  2. Ask groups to report their experience.

  3. Explain the Kelly criterion and the growth rate.

  4. Show the theoretical growth rates for different fractions:

     Fraction (f) | Expected Growth Rate (G(f))
     ------------------------------------------
     0.05         | 0.6*ln(1.05)+0.4*ln(0.95) ≈ 0.6*0.0488 + 0.4*(-0.0513) ≈ 0.02928 - 0.02052 = 0.00876
     0.10         | 0.6*ln(1.10)+0.4*ln(0.90) ≈ 0.6*0.0953 + 0.4*(-0.1054) ≈ 0.05718 - 0.04216 = 0.01502
     0.20 (Kelly) | ≈ 0.0202 (as above)
     0.30         | 0.6*ln(1.30)+0.4*ln(0.70) ≈ 0.6*0.2624 + 0.4*(-0.3567) ≈ 0.15744 - 0.14268 = 0.01476
     0.40         | 0.6*ln(1.40)+0.4*ln(0.60) ≈ 0.6*0.3365 + 0.4*(-0.5108) ≈ 0.2019 - 0.20432 = -0.00242
     0.50         | 0.6*ln(1.50)+0.4*ln(0.50) ≈ 0.6*0.4055 + 0.4*(-0.6931) ≈ 0.2433 - 0.27724 = -0.03394
     0.80         | ... (negative)
     1.00         | 0.6*ln(2)+0.4*ln(0) → undefined (ln(0) is -infinity) so growth rate is -infinity.

     We see that the growth rate is maximized at f=0.2 and becomes negative for f>0.4.

  5. Discuss the difference between the average outcome and the typical outcome.

     - The ensemble average (arithmetic mean) of the bankrolls at the end might be high because of one or two huge winners. But the median bankroll might be very low.

     - The time-average growth (on a log scale) is what matters for long-run growth.

  6. Address the normative question:

     - The Kelly criterion is not the only rational strategy. It is the strategy that maximizes the long-run growth rate. However, if an agent has a different utility function (e.g., they are risk averse in the sense of not wanting to lose half their bankroll with 40% chance in a round) then they might bet less. Also, if the agent is only going to play a few rounds, then they might prefer a strategy that maximizes expected value for that fixed number of rounds.

     - In finance, the Kelly criterion is often used as a baseline, but many investors use a fractional Kelly (like half Kelly) to reduce volatility.

     - The key takeaway: maximizing expected value per round leads to ruin in the long run, so it is not sustainable. Maximizing growth rate is sustainable and optimal for long-run growth.

  Conclusion:

  This game should effectively demonstrate the problem with overbetting and the superiority of the Kelly criterion for long-run growth. However, the instructor must be prepared to handle the randomness of the simulation and to explain the theoretical results regardless of the outcome of one trial.
answer: |-
  ### Game Design: "The Ruinous Bet"

  #### **Learning Goals**
  - Experience the bankruptcy risk of repeatedly betting the expected-value-maximizing stake (100% bankroll) on a favorable gamble.
  - Discover the superiority of maximizing the geometric growth rate (Kelly criterion) through empirical failure.
  - Contrast ensemble averages (across players) with typical outcomes (median/individual paths).

  ---

  ### **Game Structure**
  **Title:** The Ruinous Bet  
  **Duration:** 90 minutes  
  **Players:** 18 graduate students (6 groups of 3)  
  **Why groups?** Accelerates play, reduces chaos, and ensures diverse strategies.  

  #### **Materials**
  - **Shared Google Sheet** (projected): Tracks group bankrolls, bets, and outcomes in real-time.
  - **Dice (or RNG):** 10-sided die for simulations (even better: Python/R script for instant batch results).
  - **Player Worksheets:** For groups to record decisions (see *Rules* below).
  - **Starting Bankroll:** $100 per group.

  ---

  ### **Rules & Setup**
  1. **The Gamble:**  
     - Each round, groups bet on a coin flip (simulated).  
     - **Win probability \( p = 0.6 \)** (favorable), **loss probability \( q = 0.4 \)**.  
     - **Payout:** Even money (bet \( B \) → win \( +B \), lose \( -B \)).

  2. **Betting Rules:**  
     - Groups choose **fraction \( f \) of current bankroll** to bet each round (\( 0\% \leq f \leq 100\% \)).  
     - **No borrowing:** \( f \leq 1 \).  
     - **Fixed strategy:** Groups commit to a fixed \( f \) for all rounds *before Round 1* (accelerates play, mirrors repeated betting).

  3. **Parallel Worlds:**  
     - All groups face **identical coin-flip sequences** (e.g., same dice rolls). This eliminates luck bias and highlights how strategy alone alters outcomes.

  4. **Bankruptcy:**  
     - If bankroll ≤ $1, the group is out. Their $1 remains (to avoid log issues) but they bet $0 thereafter.

  5. **Payoff Scheme (No Real Money):**  
     - "Winners" are groups with top 3 bankrolls after Round 10. Prize: Bragging rights + candy.  
     - **Key metric:** Median bankroll (typical outcome) vs. mean bankroll (ensemble average).

  ---

  ### **Round-by-Round Timeline**  
  | **Phase**          | **Time** | **Activity** |
  |---------------------|----------|--------------|
  | **Introduction**    | 10 min   | Explain rules, emphasize: "Maximize final wealth." Ask: "What fraction maximizes expected value per round?" *Most will say 100% since EV = 0.6×2 + 0.4×0 = 1.2 > 1.* |
  | **Strategy Choice** | 5 min    | Groups choose fixed \( f \) (record in sheet). *Predict: ~50% choose \( f = 100\% \), others split between 20–80%.* |
  | **Rounds 1–5**      | 20 min   | Run 5 rounds. Display bankrolls live. *Likely: High-betters surge early; 1–2 go bust.* |
  | **Mid-Game Pause**  | 10 min   | **Q1:** "Which groups are growing fastest? Any surprises?"<br>**Q2:** "If we stopped now, would you change \( f \)?" *Spark reflection.* |
  | **Rounds 6–10**     | 20 min   | Run final 5 rounds. *Bankruptcy spreads: 100% bettors likely bust; Kelly groups (~20%) gain steadily.* |
  | **Debrief**         | 25 min   | Analyze results. Map to theory (details below). |

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem: Early Luck Teaches Wrong Lesson**  
     - *Risk:* A 100% bettor wins 5 in a row → huge bankroll → "overbetting works!"  
     - **Fix:**  
       - Use **identical sequences** for all groups. If a 100% bettor survives Round 10, contrast with the median group (likely ruined).  
       - **Emphasize:** "What would happen after 100 rounds? Let’s simulate..." (Show pre-calculated 100-round chart: 100% bettors → $0, Kelly → steady growth).

  2. **Problem: Analysis Paralysis**  
     - *Risk:* Groups waste time recalculating \( f \) each round.  
     - **Fix:** Mandate **fixed \( f \)**. Reduces noise, focuses on strategy.

  3. **Problem: Misinterpreting "Average"**  
     - *Risk:* Students fixate on mean bankroll (skewed by lucky survivors).  
     - **Fix:** **Highlight median bankroll** in debrief. Ask: "If you repeated this game daily, which outcome would you experience most often?"

  4. **Problem: Kelly Groups Underperform**  
     - *Risk:* Bad luck hits a 20% bettor → "Kelly doesn’t work!"  
     - **Fix:**  
       - **Pre-run simulations:** Have backup charts showing Kelly’s long-run dominance.  
       - **Math demo:** Show \( G(f) = p \ln(1+f) + q \ln(1-f) \) is maximized at \( f^* = p - q = 0.2 \).

  ---

  ### **What the Game Cannot Do**
  **It cannot prove Kelly is *normatively required* for rational agents.**  
  - **Why?** Rationality depends on utility functions. Kelly maximizes long-run growth, but:
    - Risk-averse players may prefer lower \( f \).  
    - Short horizons justify higher \( f \) (e.g., 100% if only 1 round).  
    - Non-log utility (e.g., protecting downside) may demand fractional Kelly.  
  - **The gap:** Kelly is *one defensible policy* (optimal for log utility), not the *only rational choice*.  

  **Debrief Additions You Must Supply:**  
  1. **Normative Neutrality:**  
     > "Kelly avoids ruin and maximizes growth *if* your goal is long-term wealth multiplication. But if you’re risk-averse or have few bets, other strategies exist. Rationality is goal-dependent."  

  2. **Utility Functions:**  
     - Contrast maximizing \( E[\text{wealth}] \) (→ overbetting) vs. \( E[\log(\text{wealth})] \) (→ Kelly).  
     - Mention real-world adaptations (e.g., "half-Kelly" for lower volatility).  

  3. **Broader Context:**  
     - **Economics:** Kelly as expected utility maximization for log-utility players.  
     - **Statistics:** The ergodicity problem (time-average vs. ensemble-average growth).  
     - **Philosophy:** Is "rationality" defined by survival, growth, or something else?

  ---

  ### **Debrief Script**  
  **Step 1: Show Results**  
  - Project final bankrolls. Calculate:  
    - **Mean bankroll** (e.g., $500 → skewed by one lucky 100% bettor).  
    - **Median bankroll** (e.g., $12 → typical outcome).  
  - **Observation:** "The mean lies, the median dies."  

  **Step 2: Map to Kelly Math**  
  - For bets at \( f = 0.2 \):  
    \[
    G = 0.6 \ln(1.2) + 0.4 \ln(0.8) \approx 0.6 \times 0.182 - 0.4 \times 0.223 = \textbf{0.02} \text{ (growth rate)}
    \]  
  - For \( f = 1.0 \):  
    \[
    G = 0.6 \ln(2) + 0.4 \ln(0) = -\infty \text{ (ruin)}
    \]  
  - **Plot \( G(f) \):** Show curve peaking at \( f^* = 0.2 \), crashing for \( f > 0.4 \).  

  **Step 3: Contrast Averages**  
  - **Ensemble average:** "If 1,000 groups play 1 round, average bankroll = \( 100 \times 1.2 = 120 \)."  
  - **Time-average (typical):** "If 1 group plays 1,000 rounds, median bankroll → \( 100 \times e^{0.02 \times 1000} \)" (massive growth).  

  **Step 4: Philosophical Wrap**  
  - "Kelly isn’t ‘rational’—it’s rational *for* growth maximizers. What are *your* goals? Survival? Growth? Peace of mind?"  

  ---

  ### **Final Notes**  
  - **Prep Work:** Pre-test the Google Sheet. Have backup simulations for 100 rounds.  
  - **Pacing:** If rounds run long, reduce to 8. Prioritize debrief.  
  - **Ethos:** Lean into chaos—if a 100% bettor survives, ask: "Would you stake your life savings on this strategy?"  

  This game creates visceral intuition for the Kelly criterion. The rest—why it’s *advisable* but not *axiomatic*—is where your expertise shines. Good luck!
