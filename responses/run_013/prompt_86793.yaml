  - Then, after the chamber phase, students count their tokens.

  Final case: We'll create one.

  Final Case: 
  Name: Sam. Earlier self: A successful architect who valued control and independence. Directive: "If I develop a condition that requires full-time nursing home care, do not provide life-sustaining treatment." Later self: Sam is now in a nursing home after a stroke, cannot walk or care for self. But has made friends, enjoys art classes, and says, "I never thought I could be happy like this. I want to live." 

  Debrief plan:

  1. Reconstruction test: What did it feel like to have to reconstruct the reasons? Did it change how you thought about the directive? (Mapping: The reconstruction forces engagement with the reasons and shows that the later self's objection alone isn't enough.)

  2. Chamber rules: What rule did your chamber adopt? Why? How did it handle cases where the later self had changed? (Mapping: Rules that focus on changed circumstances vs. rules that focus on the present experience. The difference between binding and informing.)

  3. Final case: How did the rule apply? Was it hard to decide? (Mapping: The contented later self highlights the difference between endorsement and experience. The earlier self cared about living a life they endorsed, but the later self is experiencing satisfaction without necessarily endorsing it.)

  4. Overall: What grounds did we use to respect the directive? (Autonomy over time, life as a whole, interests in the shape of life.) What costs did we feel? (e.g., ignoring the present self's wishes, or feeling trapped by the past.)

  5. Real-world limitations: Note that in real life, the later self might not be able to speak, and that the activity gave the later self a voice. Also, identity is assumed.

  Timeline with minutes:

  0-5 min: Introduction
  5-20 min: Life cards and directive writing (15 min)
  20-22 min: Collect and redistribute directives (2 min)
  22-30 min: Distribute later cards and prepare (8 min)
  30-35 min: Paired arguments (5 min) [simultaneously]
  35-50 min: Chamber division and case discussion (15 min) [Each chamber: 8 students, 4 cases, agree on rule and decide cases]
  50-60 min: Chamber confrontation (10 min) [Present rules and cases, adopt one rule]
  60-65 min: Final case (5 min) [Facilitator presents, panel (top token holders) applies the rule and announces? Or whole group? We'll have the panel apply the rule and announce, then group reacts if time.]
  65-75 min: Debrief (10 min)

  If we run long, cut the paired argument to 3 minutes and the chamber discussion to 12 minutes.

