    For mixed-strategy iterated elimination of strictly dominated strategies to be licensed by common knowledge of rationality, we need common knowledge that players are rational and that they will not play a strategy that is strictly dominated. However, the dominance is by mixed strategies, which requires that the player considers all possible mixtures. This is a stronger requirement than pure strategy dominance.

