  - The switching costs are artificially imposed and known. In history, the costs might be unknown or arise from complex factors.
  - In the activity, the network effect is immediate and quantifiable. In reality, network effects might take time to materialize and might be uncertain.
  - The activity assumes that participants are rational and self-interested. Historical actors might have other motivations.

  **Revised Payoffs and Rules for Clarity:**

  To ensure Group 1 locks in to A and Group 2 might lock in to B, we set:

  *Group 1 (nudged):*
  - Round 1: A: n_A + 50, B: 3 * n_B
  - Rounds 2-5: A: 2 * n_A, B: 3 * n_B
  - Switching costs: round 2: 5, round 3: 10, round 4: 15, round 5: 20.

  *Group 2 (non-nudged):*
  - Round 1: A: n_A, B: 3 * n_B
  - Rounds 2-5: same as Group 1.

  In round 1, for Group 1, choosing A is dominant: even if only one chooses A, they get 1+50=51, while if they choose B, they get 3 (if only one). So all will choose A. Then in round 1, n_A=10, so they get 10+50=60 each.

  In round 2, if they switch to B, they get 3 * n_B (which if everyone switched, 3*10=30) minus switching cost 5, so 25. If they stay, they get 2*10=20. So 25>20, so they would want to switch? But only if they all switch. If one switches, they get 3*1 -5 = -2? Very bad. So they need coordination. But the rules don't allow communication. So they might not switch. In fact, they might think: if I switch, and others don't, I get a very low payoff. So they will not switch. Then in round 2, they all stay, get 20.

  In round 3, if they switch, they get 30 -10 =20, which is the same as staying (20). So indifferent? But if they switch and not everyone does, they lose. So they might not switch.

  In round 4, switching cost 15: 30-15=15, which is less than 20? So they won't switch.

  So they are locked in.

  For Group 2, in round 1, if they all choose B, they get 30 each. But if they choose A, they get 10 (if all choose A). So they might choose B? But without communication, it's not guaranteed. We hope that they have a majority of B. For example, if 6 choose B and 4 choose A:
  - B users: 3*6=18
  - A users: 4
  So B users are happy, A users are not. In round 2, A users will want to switch to B. If they switch, they get 3*(6+1)=21? (if one switches, then n_B=7) minus 5, so 16. That's better than 4. So they will switch. Then in round 2, n_B=10, and they get 30 each (minus switching cost for the switchers: 16 for the switchers, 30 for the ones who stayed in B). But after round 2, they are all in B. Then in subsequent rounds, they stay and get 30.

  So Group 2 locks in to B.

  This is the desired outcome.

  If in Group 2, in round 1, they have 6 A and 4 B, then:
  - A users: 6
  - B users: 12

  Then in round 2, B users: if they switch to A, they would get 2*7=14 (if they switch and then n_A=7) minus 5 =9. If they stay, they get 3*4=12? Wait, if they stay and the A users stay, then n_B=4, so 12? But 12 > 9, so they stay. A users: if they switch to B, they get 3*5=15 (if they switch, then n_B=4+1=5) minus 5 =10. If they stay, they get 2*6=12. So 12>10, so they stay. Then in round 2, they have the same numbers? Then they are stuck? But then in round 3, switching cost 10. A user switching: 3*5 -10 =5 (if n_B=5) which is less than 12? So they won't switch. B user switching: 2*7 -10=4, which is less than 12? So they are locked in a mixed equilibrium? That's not optimal for anyone. But we want full coordination. 

  To avoid that, we can make the network effect stronger: set for rounds 2-5: 
  A: 2 * n_A
  B: 3 * n_B
  But if they are split, it might be stable? We can hope that in Group 2, they don't get split. Or we can adjust the payoff to make one technology clearly better at majority.

  Alternatively, we can set the payoff for B to be 4 * n_B to make it more attractive. But then at full coordination, B would be 40 vs A 20. And in the mixed scenario, B might be more attractive? 

  But we'll stick to the design and if Group 2 ends up in a mixed equilibrium, we can discuss that as a third outcome.

  **Final Timeline:**

  0-10 min: 
  - Facilitator introduces the session: "We are going to play a game about technology adoption. You will be split into two groups. Each group will play independently. The goal is to maximize your points over 5 rounds."
  - Split into two groups (Group 1 and Group 2) and have them sit in different parts of the room.
  - Distribute instruction sheets and score sheets.

  10-15 min: 
  - Explain the mechanics: each round, 1 minute to choose A or B on a slip. Hand in. Facilitator collects, counts, and announces the numbers for your group. Then you calculate your points and record them. Note: if you switch, subtract the switching cost for that round.
  - Answer any clarifying questions, but do not suggest strategies.

  15-35 min: Play 5 rounds. Each round:
    - Announce: "Round X. You have 1 minute to choose. Write A or B on the slip and hand it to me."
    - After 1 minute, collect slips.
    - Count for each group separately (do Group 1 first, then Group 2).
    - Announce for Group 1: "Number choosing A: [x], B: [y]." Then for Group 2: "A: [p], B: [q]."
    - Participants record the numbers and calculate their points for the round.
    - Move to next round.

  35-50 min: 
  - Small group discussion (within their groups): "What happened in your group? How did the choices evolve? Are you satisfied with the outcome? What might you have done differently?" (5 minutes per group, but they are separate, so 5 minutes total).
  - Then bring the whole class together. Ask each group to report briefly: what technology did you end up with? (Group 1: A, Group 2: B or mixed).

  50-70 min: 
  - Reveal the difference in the instructions: show both instruction sheets. Highlight the +50 bonus for A in round 1 for Group 1.
  - Discuss: 
    - Why did Group 1 end up with A? (The initial bonus led to everyone choosing A, then switching costs and network effects made it hard to switch).
    - Why did Group 2 end up with B? (Without the bonus, some chose B and then the network effects and lower switching costs in early rounds allowed switching until they coordinated on B).
    - If Group 2 ended up with A: Why? (Maybe by chance they had more A in round 1, then got locked in? So the small random difference led to the same outcome as the nudge? Then we can ask: what if we had given the nudge to B in Group 1? Then they might have gone to B? So the outcome is contingent on the initial conditions.)

  70-90 min: 
  - Map to concepts:
    - Path dependence: The outcome depends on the path taken, especially the initial conditions and the sequence of choices.
    - Increasing returns: The more people use a technology, the higher the payoff for each user (network effects).
    - Lock-in: Once a technology is adopted, it becomes very costly to switch.
    - Efficiency: The outcome (A for Group 1) is not the most efficient because B gives higher payoffs at full adoption. But it survived because of the historical sequence.
    - Contingency: The outcome could have been otherwise (as seen in Group 2) if the initial conditions were different.
    - Avoidability: Even though the outcome was contingent, it might have been avoidable only if they had coordinated to switch early. But without communication, it wasn't avoided. In history, coordination might be difficult.

  - Conclude with the felt difference: The lock-in to A in Group 1 was contingent (it depended on the initial nudge) and also not the most efficient. But it was not easily avoidable because of the increasing costs of switching and coordination problems.

  **Note:** The activity might not go perfectly, but it should generate the necessary discussion.
answer: |-
  ### Activity Design: "Tech Adoption Pathways"  
  This activity creates a scenario where early individual choices under mild time pressure lead to a stable, suboptimal outcome. The design emphasizes *contingency* (outcomes could have been different and stuck) vs. *inefficiency/unforeseen consequences* (outcomes are suboptimal but not necessarily avoidable). Two groups play simultaneously with identical rules except for a trivial initial perturbation, forcing counterfactual debate.  

  ---

  ### **Materials & Setup**  
  - **Participants**: 20 students split into **Group 1** and **Group 2** (10 each).  
  - **Materials**:  
    - 20 scorecards (paper or digital) with a table to record choices/points.  
    - 2 whiteboards (one per group) to display aggregate choices each round.  
    - 2 sets of rules handouts (subtly different for the perturbation; see below).  
    - Timer visible to all.  
  - **Room Setup**:  
    - Move chairs into two circles (10 students each) on opposite sides of the room.  
    - Place a whiteboard beside each group.  

  ---

  ### **Rules, Roles & Payoff Scheme**  
  **Core Mechanics**:  
  - **Technologies**: Two options, **Alpha (A)** and **Beta (B)**.  
  - **Rounds**: 5 rounds (2 minutes each).  
  - **Choices**: Each student privately chooses A or B per round.  
  - **Payoffs** (points per round):  
    - **Individual payoff** = `(Base Points) + (Network Bonus)`.  
    - **Base Points**:  
      - Choosing A: 10 points.  
      - Choosing B: 5 points.  
    - **Network Bonus**:  
      - Bonus = `5 × (Number in your group using the same tech)`.  
      *Example: If 7 choose A, each gets `10 + (5 × 7) = 45`. If 3 choose B, each gets `5 + (5 × 3) = 20`.*  
  - **Switching Cost**:  
    - Changing tech from the previous round costs points:  
      - Round 2: –5 points.  
      - Round 3: –10 points.  
      - Round 4: –15 points.  
      - Round 5: –20 points.  
    - No cost for sticking with the same tech.  

  **Perturbation (Key for Contingency)**:  
  - **Group 1’s Rule Sheet**: Includes: *“In Round 1, choosing A gives +1 bonus point (total: 11).”*  
  - **Group 2’s Rule Sheet**: No bonus (A = 10, B = 5).  
  - *Do not highlight this difference*. Call it a "small rule variation" if asked.  

  **Roles**:  
  - **Students**: Maximize personal points. No communication during rounds.  
  - **Facilitator**:  
    - Announce rounds/timer.  
    - Collect choices, tally A/B counts per group, post on whiteboards.  
    - **Do NOT**: Explain payoffs beyond rules, comment on strategies, or use terms like "efficiency" or "lock-in."  

  ---

  ### **Timeline (90 Minutes)**  
  | Time  | Phase               | Activity                                                                                                                                 | Facilitator Speech (Scripted, Minimal) |  
  |-------|---------------------|------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------|  
  | 0-10  | Setup & Rules      | Split group; distribute rules/scorecards; explain mechanics.                                                                            | *“Split into two groups of 10. Here are rules. Each round, choose A or B privately. Goal: Maximize points. I’ll post group totals after each round. Switching tech costs points—see your sheet. We start in 60 seconds.”* |  
  | 10-20 | Round 1            | Students choose A/B (2 min). Facilitator collects/tallies choices, posts counts (e.g., “Group 1: 8 A, 2 B; Group 2: 4 A, 6 B”).         | *“Time’s up. Choices recorded. Round 1 results: [reads counts]. Calculate points.”* (Silence while students calculate.) |  
  | 20-30 | Round 2            | Repeat choice/tally process.                                                                                                            | *“Round 2 begins. 2 minutes.”* (Post results: *“Group 1: 9 A, 1 B; Group 2: 3 A, 7 B”*.) |  
  | 30-40 | Round 3            | Repeat. Switching costs now –10 points.                                                                                                 | *“Round 3. 2 minutes.”* (Post: *“Group 1: 10 A, 0 B; Group 2: 2 A, 8 B”*.) |  
  | 40-50 | Round 4            | Repeat. Switching costs: –15 points.                                                                                                    | *“Round 4. 2 minutes.”* (Post: *“Group 1: 10 A, 0 B; Group 2: 1 A, 9 B”*.) |  
  | 50-60 | Round 5            | Repeat. Switching costs: –20 points.                                                                                                    | *“Final round. 2 minutes.”* (Post: *“Group 1: 10 A, 0 B; Group 2: 0 A, 10 B”*.) |  
  | 60-70 | Small-Group Debrief| Groups discuss: *“What outcome did we settle on? Why? Could we have changed it?”*                                                       | *“Discuss in groups: What happened? Why? Could you have changed the outcome?”* (No leading questions.) |  
  | 70-80 | Reveal Perturbation| Show rule sheets: Group 1 had a +1 bonus for A in Round 1; Group 2 did not.                                                             | *“Notice: Group 1’s Round 1 A gave +1 extra point. Group 2 had no bonus.”* |  
  | 80-90 | Whole-Class Debrief| Guide discussion using questions below.                                                                                                 | *“Why did both groups stabilize where they did? Was this avoidable? What if Round 1 were rerun?”* |  

  ---

  ### **Debrief & Conceptual Mapping**  
  **Guide the discussion to map game moments to core ideas**:  
  1. **Self-Reinforcing Mechanisms**:  
     - *Game moment*: Early A choices in Group 1 (due to +1 bonus) → more Network Bonus for A → others switched to A despite B’s higher base.  
     - *Concept*: Network effects rewarded conformity, amplifying initial advantage.  

  2. **Increasing Returns/Lock-In**:  
     - *Game moment*: By Round 3, switching costs (–10) exceeded benefits of choosing B (e.g., switching to B in Group 1 meant `5 + (5×1) – 10 = 0` vs. staying for `10 + (5×10) = 60`).  
     - *Concept*: Rising switching costs + network effects made B prohibitive, even if better long-term.  

  3. **Efficiency Explanations**:  
     - *Game moment*: Group 2 stabilized in B (optimal: `5 + (5×10) = 55` vs. A at `10 + (5×10) = 60` is worse? Wait—read below*).  
     - *Concept*: Ask: *“Did Beta survive because it was better? Or just because Group 2 avoided Alpha’s initial bonus?”* Undercuts efficiency narratives.  
     - **\*Note**: B is *not* more efficient—A gives higher base (10 vs. 5). But students often assume B is "better" due to round-to-round comparisons. Use this ambiguity to challenge efficiency assumptions.  

  4. **Contingency vs. Avoidability**:  
     - *Counterfactual*: The +1 bonus made Group 1’s A-lock-in contingent. But was it *avoidable*?  
     - *Tension*: Students see contingency (Group 2 stabilized in B!) but realize switching costs made A-lock-in unavoidable *once Round 1 passed*.  
     - *Concept*: Contingency (it could have been different) ≠ avoidability (it could have been changed *after* initial conditions).  

  5. **Gaps in Historical Reasoning**:  
     - Highlight: *“Did the activity prove Beta was ‘better’? Or did we just see path dependency?”* Emphasize real-world cases (e.g., QWERTY) where efficiency claims are contested.  

  ---

  ### **Failure Modes & Mitigation**  
  1. **Group 2 Stuck in Alpha**:  
     - *Likely Cause*: Random Round 1 choices favored A (e.g., 6 A, 4 B).  
     - *Mitigation*: In debrief, stress: *“Why did Group 2 end up like Group 1 despite no bonus? Does this mean the outcome wasn’t contingent?”* → Discuss randomness as a perturbation.  

  2. **Students Ignore Switching Costs**:  
     - *Likely Cause*: Payoffs unclear; students switch impulsively.  
     - *Mitigation*: Before Round 2, coldly remind: *“Remember: Switching now costs 5 points.”* Do not elaborate.  

  3. **One Group Stalls in Mixed Tech**:  
     - *Likely Cause*: Stubborn minority (e.g., 3 B-holdouts in Group 1).  
     - *Mitigation*: Use in debrief: *“Why did some stay with Beta? Could they have forced change?”* → Show prohibitive costs of minority coordination.  

  ---

  ### **What the Activity Cannot Reproduce**  
  **Limitations vs. Real History**:  
  - **Known Payoffs**: Students know rules/rounds upfront; historical actors face uncertainty about long-term returns and endpoint.  
  - **Trivial Perturbation**: The +1 bonus is a controlled, visible nudge; real historical accidents (e.g., a factory fire) are complex and opaque.  
  - **Second Run**: Groups playing side-by-side is a luxury; historians can’t rerun history with a “control group.”  
  - **Rational Actors**: Students maximize points; real actors have cultural, ideological, or irrational motives.  
  - **No True Optimal**: In the game, A is objectively better (higher base), but lock-in occurs anyway—unlike debates where the “inferior” option is ambiguously defined (e.g., QWERTY vs. Dvorak).  

  **Use This in Debrief**:  
  *“In history, we lack parallel universes. We see one path, but not whether Beta could have won with a tiny change. And unlike you, historical actors didn’t know the rules in advance.”*  

  ---  
  This design ensures students *feel* lock-in before naming it, forces counterfactual debate via the two-group perturbation, and isolates contingency from avoidability. The payoff structure ensures early choices raise the price of later switches, and time pressure prevents overcalculation.
