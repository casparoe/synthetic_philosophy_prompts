prompt: |-
  I have taught the special composition question for fifteen years and have always told students that my own answer was settled; an attempt to write it out plainly has shown me that it is not. I would like you to reconstruct the principle, or small family of principles, that my verdicts actually express. I am not asking for a survey of the published positions on when some things compose a further thing, and I do not want a defence of anyone's book. I want to know what I am committed to, which of my verdicts a single coherent principle can keep, and which have to go.

  Here is what I find myself saying, case by case.

  Ordinary objects and artefacts. A table, glued and screwed and in use: one thing. The same boards, cut to the same design, merely stacked so that they happen to hold the shape: no table, just boards. An unopened flat-pack shelf: not a shelf. A heap of sand: not a thing. A sandcastle: a thing. A bronze statue: one thing — and I want to say that the statue and the lump of bronze are not two things but one.

  Organisms and their near neighbours. A cat: one thing. A cat's tail, severed but kept as living tissue: not one thing. The cat's corpse: still one thing, though I notice that this is precisely what I deny to the heap of sand. A lichen, which is a fungus and an alga living as a single composite body: one thing. A Portuguese man-of-war, which is standardly described as a colonial organism — a collection of specialized units that cannot survive apart and that together operate as one individual: one thing. An ant colony, which is likewise a collection of organisms with a division of labour and a common fate: not one thing. I cannot presently defend that pair, and it is the first thing I would like you to press on.

  Dynamic natural systems. A river: one thing. A whirlpool: one thing. A flame: one thing. A cloud: one thing. A dune: not a thing. The same water, still, in a bucket: not a thing.

  Social and institutional objects. A marriage: one thing. A committee: one thing. A queue: not a thing. A conversation: one thing. A game of chess in progress: one thing. A corporation: one thing.

  Counting. With the repaired ship in one berth and the reassembled original planks in another, I count two ships. Yet where the statue stands I count one thing, not two. In the first case matter in a form seems to yield an object over and above the matter; in the second it seems not to, and I cannot say what licenses the difference.

  My tentative proposal, which I expect you to demolish: the parts compose a thing when they are caught up in a single process that gives them a joint fate — they will persist, be damaged, and be destroyed together. That delivers the river, the flame, the cloud, the whirlpool, the organism, and, I think, the man-of-war; it costs me the heap and the loose boards, which is what I want. But it appears to cost me the table as well, unless I cheat by treating a rigid body's holding its shape as a process; it hands me the ant colony, which I deny; and it says nothing whatever about the marriage, the committee, or the chess game, all of which I affirm.

  What I want from you: the principle or principles that best fit these verdicts, stated precisely, with the case that forces each clause; your verdicts on cases I have not listed — a traffic jam, a termite colony, a language, a brain-dead body on a ventilator, the biosphere; and an honest statement of which of my verdicts the resulting principle cannot accommodate. If the best fit turns out to be a disjunctive principle, tell me what justifies the disjunction, rather than its being a mere inventory of my prejudices. I would rather surrender a verdict than keep a principle that only lists them.
reasoning: |-
  Hmm, the user is asking me to reconstruct their implicit composition principle based on their case-by-case verdicts about when things compose a single object. They've taught this topic for fifteen years but discovered their position isn't as settled as they thought when trying to articulate it. They want me to identify the underlying principle(s) that explain their judgments, without appealing to existing philosophical theories.

  Looking at their verdicts, there are several interesting patterns and tensions. For ordinary objects, they accept artifacts only when they're assembled and functional (table yes, stacked boards no), but make exceptions for sandcastles while rejecting sand heaps. They also see the bronze statue and lump as identical, which is puzzling given their artifact criteria.

  For organisms, they accept unitary beings (cat, lichen) and colonial organisms that function as units (Portuguese man-of-war), but reject ant colonies despite similar characteristics. The cat corpse is accepted while a sand heap isn't - both are non-functional aggregates, so this needs explaining.

  Dynamic systems reveal another pattern: ephemeral but coherent processes (river, flame, cloud) are accepted, but static dunes are not. Social objects show inconsistency too - marriages and committees are accepted while queues are denied.

  Their tentative "joint fate" proposal has problems: it would include ant colonies and exclude tables. I need to find something better.

  The key might be a combination of two principles: functional integration (parts serving a unified purpose) and processual unity (being governed by a single self-sustaining process). This explains most cases:
  - Tables and sandcastles have functional integration
  - Organisms and man-of-war have both
  - Rivers and flames have processual unity
  - But dunes lack integration, ant colonies lack sufficient unity
  - Social objects like marriages have institutional "function"

  The statue/lump identity remains problematic - perhaps here they're granting primacy to form over matter. For counting puzzles, we might need to say that composition creates a new entity only when it has emergent properties.

  I'll test this framework against unlisted cases: traffic jams (processual unity → yes), termite colonies (similar to ant colonies → no), brain-dead bodies (lacks self-sustaining process → no), etc. The biosphere is tricky but might qualify as processually unified.

  Some tensions remain: cat corpse acceptance contradicts sand heap rejection - perhaps residual functional form? And queues have emergent order but no institutional status, explaining their rejection.

  I'll present this as a unified principle with two complementary aspects, explaining which verdicts hold and which might need revision. The goal is coherence, not just preserving all initial judgments.
answer: |-
  Based on your case-by-case verdicts, your implicit composition principle isn't a single rule but a **dual-aspect principle of Functional-Processual Unity (FPU)**. This principle integrates two necessary conditions, explaining your acceptances, rejections, and tensions. It also justifies the disjunction between "natural" and "institutional" unities without being ad hoc.

  ### The Principle of Functional-Processual Unity (FPU)
  **Some objects compose a further object if and only if:**
  1.  **They are integrated into a cohesive functional whole** (serving a unified purpose, role, or maintaining a distinct, stable form *as* that whole), **OR**
  2.  **They are bound by a self-sustaining, homeostatic process** (a dynamic system maintaining its own coherence, boundaries, and persistence through internal activity).

  **Crucially, for non-institutional objects (ordinary objects, organisms, natural systems), *both* aspects (1 & 2) are typically necessary. For institutional objects (social/legal entities), aspect (1) alone is sufficient due to conferred status.**

  ---

  ### How FPU Explains Your Verdicts

  1.  **Ordinary Objects & Artefacts:**
      *   *Table (glued/screwed/in use):* **Yes.** Functional integration (holds form, serves as table) *and* processual unity (bound as a rigid body resisting entropy/damage as a unit).
      *   *Same boards stacked:* **No.** Lacks functional integration (not serving as a table) *and* processual unity (no internal cohesion binding them as one).
      *   *Flat-pack shelf:* **No.** Lacks functional integration (not assembled/used as a shelf) *and* processual unity (parts not bound by an active, cohesive process).
      *   *Heap of sand:* **No.** Lacks functional integration (no unified purpose/form) *and* processual unity (no self-sustaining process binding grains).
      *   *Sandcastle:* **Yes.** Functional integration (distinct form serving as castle) *and* weak but sufficient processual unity (adhesion/cohesion maintains form against minor perturbations).
      *   *Bronze Statue/Lump:* **One thing (Identical).** This is the hardest fit. FPU suggests you grant primacy to the *functional form* over the matter. The lump *is* the statue when configured as such. The matter only composes *one* FPU object: the statue-form. The "lump" as mere matter isn't an object under FPU unless configured into *some* FPU whole (like a different sculpture or ingot). *(Case forcing clause: Statue/Lump forces the primacy of functional form over arbitrary aggregates of matter when FPU is present).*

  2.  **Organisms & Near Neighbours:**
      *   *Cat:* **Yes.** Strong functional integration (organs serving the whole) *and* strong processual unity (metabolism, homeostasis).
      *   *Severed living tail:* **No.** Lacks functional integration (no role as part of a larger organism) *and* lacks processual unity (cannot sustain independent homeostasis).
      *   *Cat corpse:* **Yes.** *This is a key tension.* FPU explains your intuition via *residual functional form/integration*. The corpse retains the integrated structure/organization of the cat, distinct from a mere heap. Its processual unity is failing/dead, but the integrated structure persists temporarily. *(Contrasts with sand heap which never had integration).*
      *   *Lichen:* **Yes.** Functional integration (symbiotic functions) *and* processual unity (joint metabolism/homeostasis as a single entity).
      *   *Portuguese man-of-war:* **Yes.** Functional integration (specialized zooids form feeding, reproduction, propulsion units for the whole) *and* processual unity (unified movement, coordinated survival response, shared fate as an individual).
      *   *Ant Colony:* **No.** *This fits FPU.* While there's coordination and division of labor (some functional integration), the *processual unity fails*. Individual ants are distinct organisms capable of independent survival/reproduction; the colony lacks a *single, unified homeostatic process* governing the whole as an individual organism. It's a complex social system, not a biological individual. *(Case forcing the necessity of both aspects for non-institutional biological entities).*

  3.  **Dynamic Natural Systems:**
      *   *River:* **Yes.** Processual unity (coherent flow of water governed by gravity/geology maintaining its course/identity over time).
      *   *Whirlpool:* **Yes.** Processual unity (coherent, self-sustaining rotational flow pattern).
      *   *Flame:* **Yes.** Processual unity (self-sustaining combustion process).
      *   *Cloud:* **Yes.** Processual unity (coherent body of condensed vapor maintained by atmospheric conditions).
      *   *Dune:* **No.** Lacks processual unity (it's a static pile shaped by external wind; no internal process sustains *it* as *this* dune) *and* lacks functional integration (no purpose/form beyond being a pile of sand).
      *   *Water in a bucket:* **No.** Lacks processual unity (static, no internal dynamic cohesion) *and* lacks functional integration (mere aggregate).

  4.  **Social and Institutional Objects (Aspect 1 Sufficient):**
      *   *Marriage:* **Yes.** Functional integration (institutionally defined union serving specific social/legal purposes). Processual unity is irrelevant; status confers objecthood.
      *   *Committee:* **Yes.** Functional integration (defined group with a purpose, roles, decision-making capacity).
      *   *Queue:* **No.** Lacks robust functional integration recognized by institutions. It's an emergent order, not a *conferred* object with defined purpose/status. (FPU aspect 1 isn't met *institutionaliter*).
      *   *Conversation:* **Yes.** Functional integration (shared purpose: exchange of ideas, governed by norms/turn-taking). Its dynamic nature resembles process, but it's the *institutionalized purpose* of communication that grounds it.
      *   *Game of chess:* **Yes.** Functional integration (highly structured activity governed by rules with a defined purpose/goal).
      *   *Corporation:* **Yes.** Functional integration (legal entity with defined purpose, structure, rights).

  5.  **Counting (Ship of Theseus & Statue):**
      *   *Two Ships:* **Yes.** FPU explains the distinct objects. The repaired ship maintains functional integration (as a working vessel) and processual unity (as a maintained structure). The reassembled planks have *a different* functional integration (as a historical artifact/memorial) and potentially a new processual unity (preservation efforts). They are two distinct FPU objects.
      *   *One Statue/Lump:* **One thing.** As above, only *one* FPU whole exists – the statue-form. The "lump" isn't a competing FPU object; it's just the matter *constituting* the statue. Identity holds because only one FPU object exists at that location. The difference from the ships is that the reassembled planks gain a *new* FPU status (artifact/memorial) that the "lump" matter of the statue lacks.

  ---

  ### Verdicts on Unlisted Cases (Applying FPU)

  1.  **Traffic Jam:** **No.** Lacks institutional functional integration (not a conferred object). While a dynamic system, it lacks internal homeostasis/self-sustainment – it's an emergent, chaotic state caused by external factors (too many cars). (Similar to queue).
  2.  **Termite Colony:** **No.** Analogous to ant colony. While highly integrated, individual termites remain distinct organisms. Lacks the unified homeostatic process seen in a man-of-war (where zooids are genetically identical/modified *parts*, not individuals).
  3.  **Language:** **Institutional - Yes.** Functional integration: A system of communication with rules (grammar), purpose (conveying meaning), and conferred reality by a community/institution. It persists as an abstract object defined by its functional role.
  4.  **Brain-Dead Body on Ventilator:** **Contested, but FPU suggests No.** Functional integration is severely compromised (organs not serving the whole organism). Processual unity is externally imposed (ventilator), not self-sustaining. Resembles a disintegrating aggregate being artificially stabilized, unlike a corpse retaining integrated structure. (If you see it as "still the person," you might need to weaken FPU for organisms; FPU strictly applied says no).
  5.  **The Biosphere:** **Yes (as a Processual Unity).** Strong processual unity: A vast, complex, interconnected, self-regulating (homeostatic) system of biogeochemical cycles (Gaia hypothesis-lite). While its functional integration is diffuse, the global self-regulating processes bind it as a single dynamic entity.

  ---

  ### Which of Your Verdicts FPU Cannot Accommodate (Without Revision/Surrender)

  1.  **Cat Corpse:** FPU strictly applied struggles. A corpse has *residual* integration but *no* processual unity. You accept it, contrasting it with a sand heap. FPU must be stretched to allow "persistent integrated structure" as a weak form of functional integration *sans* process, or accept that the corpse is a distinct, degenerate FPU object due to its history. **Surrendering the corpse verdict (counting it as mere aggregate) would make FPU cleaner.** Keeping it requires adding a clause for "persistent, formerly functional integrated structure," which weakens coherence.
  2.  **Queue:** You deny it. FPU (institutional aspect) also denies it. *However,* if you ever felt a highly ordered, rule-bound queue *was* an object, FPU would struggle. It lacks conferred institutional status. FPU firmly sides with your denial.
  3.  **Dune vs. Sandcastle:** FPU explains this perfectly (dune lacks integration/process, sandcastle has both). *But* if someone argued a dune *does* have a slow processual unity (wind shaping), FPU would push you to accept it. Your denial is consistent with FPU viewing the dune's "process" as merely external shaping, not internal homeostasis.
  4.  **Bronze Statue/Lump Identity:** FPU explains this by rejecting the "lump" as an object. If you ever felt compelled to say the lump *is* a distinct object (e.g., before sculpting, or if melted down), FPU breaks. It relies on the primacy of the functional form. **This is your most distinctive commitment.** FPU captures it by making FPU objects primary.

  ---

  ### Justification of the Disjunction
  The disjunction between non-institutional (requiring both function *and* process) and institutional (requiring only conferred function) isn't ad hoc. It reflects a fundamental ontological difference recognized in social ontology:

  1.  **Natural/Non-Institutional Objects:** Their unity and persistence depend on *physical* or *biological* facts – how parts interact dynamically (process) to maintain a distinct, functional whole. Both aspects are needed to exclude aggregates (heaps, dunes) and non-unified collectives (ant colonies) while including organisms and cohesive artefacts.
  2.  **Institutional Objects:** Their existence and unity depend *entirely* on collective intentionality, recognition, and conferred status/function within a social/legal framework. A self-sustaining process is irrelevant; a corporation exists and is one thing purely by legal fiat and its defined function, regardless of its internal dynamics. This justifies Aspect 1 alone being sufficient here.

  FPU provides a coherent framework explaining most of your verdicts. The main cost is potential revision on the cat corpse or doubling down on "residual integration" as a distinct, degenerate category. The "lump vs. statue" identity is preserved as a core feature, not a bug, of the principle. It successfully excludes heaps, stacks, dunes, queues, and ant colonies while including tables, sandcastles, organisms, man-of-wars, flames, rivers, and institutional entities.
