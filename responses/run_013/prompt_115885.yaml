  ok so this might be a weird one. I'm in grade 11 and I did a project on the liar paradox, and I've come out the other side actually believing the thing everyone treats as obviously false: that some sentences are both true and false. My reasoning is that "true" just means things are the way the sentence says they are, so a sentence that says of itself that it isn't true has to be true exactly when it isn't, which gives you both, and no amount of tinkering with the rules is going to make that go away. I've definately pushed it past the liar too — I think vague words work the same way, so a guy right on the line between bald and not bald is both, and thats why the sorites argument feels unbeatable to me. So the position is: real contradictions, not just a sentence that's broken, and the right response is to accept a glut at the edges instead of patching the logic. Apparently this view has a name.

  What I want is what would count against it. Not a list of textbook objections — I want to know which things should actually move me, ranked from "give it up" down to "just awkward", and which ones the people who hold this view would admit are real problems versus which ones they'd wave off. I'm already nervous about two things. One is a paradox a friend mentioned involving conditionals that's supposed to make everything provable if you're not careful — I dont get it and I want to know how bad it really is. The other is that I suspect I'm quietly changing what "not" means so my view comes out true by definition, and that I've also lost the right to use some really basic argument form and cant remember which one. And tell me honestly whether the view can be falsified at all, because if every weird result just gets filed under "contradiction" I want to know whether thats a feature or whether I'm cheating.

  Normal paragraphs please, no headings or bullet points or bold or tables, just write it out like an email.
