answer: |-
  ## Proposal: Monotonicity and Strategy Stealing – Unpacking the Foundation of a Game-Theoretic Argument

  **Project Title:** The Core of Strategy Stealing: Minimal Monotonicity and the Landscape of Its Failure

  **1. Research Question:** What are the *minimal formal monotonicity properties* concerning player option sets that enable the strategy-stealing argument to guarantee a non-losing outcome for the first player, and how do deviations from these properties—manifesting as non-monotonicities—precisely account for the argument's failure across diverse game types?

  This question demands a determinate answer: a catalog of specific monotonicity axioms (e.g., "adding an extra move never harms a player's position", "passing is always neutral or beneficial") ranked by logical strength, coupled with a systematic classification of game features (like zugzwang, misère objectives, imperfect information) that violate these axioms and thereby block the standard argument. The answer lies in identifying the precise "weak links" in the monotonicity chain required for stealing.

  **2. Critique of Standard Treatments & Why the Question Remains Open:**
  The strategy-stealing argument is typically presented in one of two unsatisfying ways:
  *   **The "Clever Trick":** Framed as an ingenious but ad hoc observation for specific symmetric games (like Hex, Kayles). This presentation obscures the underlying structural requirement (monotonicity) and offers no tools to analyze when or why it might apply or fail elsewhere. It treats the argument as a black box.
  *   **The "Non-Constructive Existence Proof":** Defended solely on the basis that it proves existence, dismissing concerns about its "trick" nature as irrelevant to its epistemic value. While true, this defense ignores the argument's *mechanism* and its *domain of applicability*. It fails to engage with *why* the trick works structurally or *what specific game properties* cause it to break.

  Both approaches leave the core logic unanalyzed. They do not formalize the necessary and sufficient conditions on the game structure itself (beyond symmetry and determinacy) that make the "steal" logically possible and sound. Consequently, they provide no framework for predicting if the argument applies to novel game variants (e.g., with resource decay, asymmetric boards modified mid-game, specific forms of hidden information) or for understanding the *exact point of failure* in known counterexamples. The question of *what minimal game-theoretic property the argument actually leverages* remains unanswered.

  **3. Methodology: Formal Axiomatization and Case-Driven Analysis**
  This project employs a dual methodology:
  *   **Formal Framework Development:** Define a flexible, abstract game model capturing players, moves, states, and outcomes. Within this model, rigorously formalize variants of monotonicity axioms concerning the preservation or enhancement of a player's winning prospects when their option set is augmented (e.g., adding a "pass" move, adding an extra stone placement option). Focus on defining these axioms as weakly as possible.
  *   **Targeted Case Study Analysis:** Systematically test the applicability of these axioms and the strategy-stealing argument against carefully chosen counterexamples and edge cases:
      *   **Misère Play:** Where *having* moves can be detrimental (violating "extra options never hurt").
      *   **Zugzwang Positions:** Where being *forced* to move is disadvantageous (violating "passing is neutral/beneficial").
      *   **Imperfect Information/Simultaneous Moves:** Where the "steal" is ill-defined because players cannot directly observe or mirror the opponent's strategy in the required way.
      *   **Infinite Games:** Where "cannot lose" (draw possible) does not imply "wins", requiring determinacy assumptions beyond monotonicity.
      *   **Asymmetric Modifications:** Where adding a resource benefits one player but inherently disadvantages the other non-symmetrically.
      For each case, the analysis will pinpoint *which specific monotonicity axiom* fails and *how that failure disrupts the logical steps* of the strategy-stealing construction (e.g., the stolen strategy becomes invalid, leads to immediate loss, or is undefined).

  **4. Expected Results and Deliverables:**
  A successful outcome within one year would be:
  *   A formally defined hierarchy of monotonicity axioms relevant to strategy stealing.
  *   A clear characterization of the minimal set of these axioms sufficient to guarantee the standard strategy-stealing conclusion (first player cannot lose) under determinacy and symmetry.
  *   A taxonomy of game features classified by *which specific axiom(s)* they violate and a detailed analysis of *how* this violation manifests in the failure of the stolen strategy construction for canonical examples in each class.
  *   Identification of potential "resilient" variants of the argument that might work under weaker monotonicity or specific compensating conditions.

  This constitutes a foundational reframing of strategy stealing: from a trick to a consequence of identifiable structural properties, with a clear map of where and why those properties fail.

  **5. Scope and Feasibility (One-Year Focus):**
  This project is scoped for one year by focusing on:
  *   **Finite, deterministic, perfect information games** as the primary domain. While infinite games will be discussed regarding the "cannot lose" vs. "wins" distinction, deep determinacy proofs are out of scope.
  *   **Developing the formal framework and core axioms.** Creating a comprehensive game theory is not the goal; defining the necessary monotonicity concepts within a sufficiently abstract model is.
  *   **Deep analysis of 2-3 canonical examples per failure category** (misère, zugzwang, imperfect info/simultaneity) rather than an exhaustive survey of all possible games. The aim is illustrative proof-of-concept for the classification.
  *   **Characterizing failure modes,** not constructing winning strategies under non-monotonicity (which is often highly game-specific).
  *   **Proposing, not proving, resilient variants.** Exploring ideas for weaker sufficient conditions will be included, but full development and proof might extend beyond the fellowship year.

  **6. What Constitutes Failure:**
  The project would fail if:
  *   No coherent minimal set of monotonicity axioms enabling strategy stealing can be isolated (the conditions remain irreducibly tied to specific game rules).
  *   The analysis of failure cases reveals no consistent pattern linking specific game features to the violation of specific axioms; the failures appear ad hoc and resist categorization.
  *   The formal framework proves too rigid or cumbersome to usefully analyze the target examples.

  **Conclusion:**
  The strategy-stealing argument is a cornerstone of combinatorial game theory, yet its logical foundation rests on an unexamined premise of monotonicity. This project will rigorously dissect this premise, defining the minimal conditions under which stealing works and providing a structured understanding of its failures. By moving beyond the argument's presentation as a mere trick or opaque existence proof, this work will establish a principled framework for understanding its scope and limitations, offering new tools for analyzing determinacy in a wider range of strategic interactions. The deliverables—a taxonomy of monotonicity axioms and failure modes—are concrete and achievable within a one-year fellowship, laying essential groundwork for future research.
