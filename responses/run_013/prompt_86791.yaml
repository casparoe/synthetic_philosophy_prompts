  I am applying for a one-year fellowship and need a two-page proposal on the strategy-stealing argument. The half-formed idea: the argument is usually taught as a trick for symmetric two-player games without draws — if the second player had a winning strategy, the first player could open with an arbitrary move and then follow that strategy, on the grounds that a spare stone or an unused option can never hurt — so the first player cannot lose, and in a no-draw game must win. I suspect the real content of the argument is a monotonicity claim about option sets, and that the interesting work lies in making that claim as weak as possible and in characterizing what survives its failure: as it does in misère play, in zugzwang positions, in games with imperfect information or simultaneous moves where the "steal" is not even well-defined, and in infinite games where "cannot lose" yields "wins" only given determinacy. Write the proposal: state the question so that it has a determinate answer, explain why the standard treatments — strategy stealing as a one-off trick, or as a non-constructive existence proof whose epistemic value needs no defense — leave it open, describe the method (formal work on the conditions, alongside case-by-case analysis of arguments that do and do not go through), say what a result would look like and what would count as the project failing, and keep the scope to what a year can deliver. No bibliography: I will add citations myself, and I would rather you refer to positions by their content than by name.
