prompt: |-
  I am trying to determine whether there is an established name for a particular defect in an act of blame — a defect that concerns not what the blame says about the person blamed but who is in a position to say it.

  The cases I have in mind share a shape, though I cannot tell whether they are one phenomenon or several. In the first, a manager reorganizes a workplace so that the schedule cannot realistically be met, and then reprimands the staff for missing deadlines. The staff object, correctly, that the manager has no business complaining, since the manager arranged the conditions. The manager is not being two-faced: he meets his own deadlines and does not secretly think lateness is acceptable. The objection nevertheless seems to have force, and it is not an objection to the accuracy of the reprimand.

  In the second, two countries emit heavily, and one of them lectures the other about emissions. The lecturing country emits less per person today but far more in total historically, and much of its wealth rests on those earlier emissions. The criticized country replies that the critic is not the one to say it — again, without disputing the substance of what is said.

  In the third, someone who has never drunk alcohol tells a friend that the friend's drinking is ruining his life. Nothing in the speaker's conduct contradicts the remark; there is no inconsistency to expose. And yet there is a widely felt sense that this particular speaker is poorly placed to say it, or at least that the remark costs him nothing and therefore lands differently than it would from someone who had struggled with the same thing.

  I suspect the nearest familiar term is hypocrisy, but hypocrisy seems to require that the speaker's own conduct or commitments conflict with what he says, and in these cases that conflict is often absent — the manager is punctual, the lecturing country is comparatively green, the abstinent friend is perfectly consistent. I suspect the answer lies in a broader family of objections about whether a speaker is entitled to hold someone to a norm, but I cannot say which member of that family each case belongs to, or whether all three are the same member.

  What I want, then, is not a bare label. If there is an established concept here, I want to know which it is and, more importantly, how it is bounded: which of my three cases it covers, which it does not, and on what principle. In particular, is the relevant feature that the blamer produced the wrong, that he benefits from it, or that he is simply untouched by the costs of the norm — and are those one thing or three? If nothing established fits, please coin a term, define it precisely enough to exclude ordinary inconsistency and mere bad manners, and say where its edges fall.
reasoning: |-
  Okay, the user is exploring a specific defect in acts of blame where the issue isn't about what's being said but who's saying it. They've provided three distinct cases: a manager creating impossible deadlines, a historically high-emission country lecturing another, and a non-drinker criticizing someone's drinking. They want to know if there's an established term for this, or if not, a newly coined term with clear boundaries.

  First, I need to recall philosophical concepts related to blame and authority. Hypocrisy comes to mind, but as the user pointed out, it requires inconsistency between the speaker's actions and words. In these cases, the speakers aren't inconsistent—they're punctual, green, or abstinent. So hypocrisy doesn't fit. 

  Next, I consider other concepts. Standing is a legal term about the right to bring a case to court. Moral authority relates to whether someone has earned the right to speak on an issue. Maybe these are relevant. The manager lacks standing because they caused the problem. The high-emission country lacks moral authority due to historical benefits. The non-drinker might lack empathetic standing. 

  I should check if these cases share a common defect. Each involves a disconnect between the blamer and the circumstances of the wrong. The manager creates the problem, the country benefits from past wrongs, and the non-drinker hasn't experienced the struggle. But are these the same issue or different? The user wants to know if it's one phenomenon or several. 

  Looking deeper, the core issue seems to be about the blamer's relationship to the norm or harm. The manager is causally responsible, the country is historically complicit, and the non-drinker lacks experiential connection. These might be different species under a broader genus. I think "normative standing" could be an umbrella term. 

  The user also asks about the boundaries: is it about causing the wrong, benefiting from it, or not facing the costs? Each case emphasizes a different aspect. The manager causes it, the country benefits, and the non-drinker avoids costs. So perhaps these are three distinct types within normative standing. 

  I should ensure the term excludes hypocrisy and mere rudeness. Normative standing specifically addresses the speaker's position relative to the norm's enforcement, not inconsistency or tone. 

  For the response, I'll define normative standing and its three variants: contributory standing (causing the problem), complicit standing (benefiting from similar past actions), and experiential standing (lacking relevant experience). This covers all cases while differentiating them. 

  The user might also need this for academic or professional writing, so precision is key. They likely want to apply this framework to other scenarios, hence the request for clear principles. Ensuring each case is mapped to a specific type will meet their deeper need for a structured, applicable concept.
answer: |-
  Based on your detailed cases and analysis, the established concept you're seeking is **normative standing** (or **moral standing**), specifically focusing on the *authority to blame* or *locus standi* for moral criticism. This concept is distinct from hypocrisy and addresses the defect you've identified: the objection isn't to the *truth* of the blame but to the *right* of the blamer to level it.

  Here's a breakdown of how normative standing applies to your cases, its boundaries, and why it fits better than hypocrisy:

  ---

  ### **Core Concept: Normative Standing**
  1.  **Definition:** Normative standing refers to the *qualification or entitlement* to hold another accountable to a norm. It asks: **"Given your relationship to this norm or the harm in question, do you have the legitimate authority to enforce it against this person/group?"**
  2.  **Key Principle:** Standing can be undermined even if the blamer is *currently consistent* with the norm. The defect arises from the blamer's **relationship to the *context* of the violation** (causation, benefit, complicity, lack of experience) rather than personal inconsistency.
  3.  **Contrast with Hypocrisy:**
      *   Hypocrisy: Violates the norm *they are enforcing* (inconsistency between word and deed).
      *   Lack of Standing: May adhere to the norm *now*, but their past actions, causal role, privileged position, or lack of shared experience disqualify them from being a *credible enforcer* in *this specific instance*.

  ---

  ### **Application to Your Cases & Principle of Differentiation**
  Your cases illustrate distinct *subtypes* of undermined normative standing, sharing the core defect but differing in *why* the standing is compromised:

  1.  **The Manager (Case 1):**
      *   **Defect:** **Contributory Standing / Causal Responsibility.** The manager *created the conditions* making the violation inevitable. They are blaming others for a problem they engineered.
      *   **Principle:** One lacks standing to blame for a harm if one's own actions were a *necessary and sufficient cause* of the circumstances leading to the violation. The objection is: "You *made* this happen; you can't now punish us for the outcome you orchestrated."
      *   **Boundary:** This applies strictly to *direct causation* of the *immediate conditions* of the violation. If the manager inherited the schedule and merely enforced it (without creating it), standing might not be undermined in this way (though others might be).

  2.  **The Lecturing Country (Case 2):**
      *   **Defect:** **Complicit Standing / Unjust Benefit.** The country *profited immensely* from violating the *same norm* in the past and continues to benefit from that legacy. Its current adherence comes from a position of built wealth and advantage gained through prior, often worse, violations.
      *   **Principle:** One lacks standing to blame for a norm violation if one has *significantly benefited* from violating that *same norm* (or a substantially similar one) in the past, *without adequate redress*, placing the blamed party at a relative disadvantage. The objection is: "Your wealth/power *comes from* doing exactly what you condemn us for now, only worse/more. You haven't cleaned up your own mess; you have no moral high ground."
      *   **Boundary:** This requires a *direct lineage* between the critic's past violations/benefits and the *specific norm* in question (e.g., emissions). A country with a clean history on emissions could lecture, even if it has other historical sins. Mere historical wrongs unrelated to the norm don't necessarily undermine standing *for this norm*.

  3.  **The Abstinent Friend (Case 3):**
      *   **Defect:** **Experiential Standing / Lack of Costly Identification.** The speaker has *never faced the struggle* or paid the *personal cost* associated with adhering to the norm in the relevant context. Their adherence is costless, making their blame seem facile, judgmental, or lacking in empathetic authority.
      *   **Principle:** One lacks standing (or it is significantly weakened) to blame for the violation of a norm involving significant personal struggle, sacrifice, or temptation if one has *never faced comparable challenges* oneself. The objection is: "You have *no idea* how hard this is. Your judgment comes from a place of ignorance and ease, not understanding."
      *   **Boundary:** This applies primarily to norms involving *internal struggle, addiction, overcoming hardship, or significant sacrifice*. It wouldn't apply to blaming someone for, say, theft based on principle alone ("Stealing is wrong"), even if the blamer has never been tempted to steal. The norm itself must involve a significant *experiential component* for adherence/violation.

  ---

  ### **Synthesis: One Phenomenon or Three?**
  *   **Common Core:** All three cases share the **core defect of undermined normative standing**. The objection in each is fundamentally: **"You are not positioned (due to your actions, history, or experience) to legitimately enforce this norm *against us* in *this context*,"** despite the potential accuracy of the criticism.
  *   **Distinct Species:** They represent **three distinct reasons *why* normative standing is undermined** within this core concept:
      1.  **Causal Contribution:** You caused the violation.
      2.  **Unjust Benefit/Complicity:** You benefited from violating the same norm.
      3.  **Lack of Costly Experience:** You haven't borne the cost of adhering to the norm.
  *   **Relationship:** These reasons can overlap (e.g., a country that caused *and* benefited from historical emissions), but each represents a coherent, distinct pathway to losing standing. They are united under the genus "undermined normative standing for blame" but are distinct species within it.

  ---

  ### **Answering Your Specific Questions**
  *   **Established Concept:** **Normative Standing** (or Moral Standing) for blame/criticism.
  *   **Bounded Principle:** Standing is undermined when the blamer's relationship to the norm or the harm (causation, unjust benefit, lack of costly experience) renders their act of blame illegitimate, unfair, or lacking in authority, *even if their criticism is factually correct and they are personally consistent*.
  *   **Causing the Wrong vs. Benefiting vs. Untouched by Costs:** These are **three distinct but related factors** that can independently or jointly undermine standing, as shown in your cases. They are facets of the blamer's problematic *relationship to the context of the violation*.
  *   **Exclusion of Hypocrisy & Bad Manners:** This concept explicitly excludes mere inconsistency (hypocrisy) and focuses on the *structural legitimacy* of the blaming act. It also excludes purely *tactical* objections like rudeness ("That was mean to say"), focusing instead on the *moral authority* deficit.

  **Conclusion:** Your intuition about a "broader family of objections about whether a speaker is entitled to hold someone to a norm" is correct. The established concept is **normative standing**, and your cases illuminate three specific, prevalent ways (Causal Contribution, Unjust Benefit/Complicity, Lack of Costly Experience) in which this standing can be fatally undermined, rendering the act of blame defective regardless of its factual accuracy.
