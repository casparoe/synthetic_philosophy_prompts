  Below is a comprehensive design for your 90-minute session, structured to make students viscerally experience the St. Petersburg paradox and its implications. The activity emphasizes **finite bankroll constraints** and **failure of expected value comparisons** for lotteries with infinite expectation, while explicitly avoiding diminishing marginal utility as the primary explanation.

  ---

  ### **Rules, Materials & Payoff Scheme**
  **Materials:**  
  - **Tokens:** Use non-monetary chips (e.g., poker chips) or points tracked on a board.  
  - **Coin Flips:** Fair coins (one per student pair).  
  - **Bankroll Board:** Publicly display the casino’s bankroll (initially **1,000 tokens**).  
  - **Lottery Definitions:**  
    - **Lottery A (Original):** Pays \(2^n\) tokens if the first heads appears on the \(n\)-th flip.  
    - **Lottery B (Dominating):** Pays \( \begin{cases} 4 & \text{if } n=1 \\ 2^n & \text{if } n \geq 2 \end{cases} \)  
    - **Lottery C (Further Dominating):** Pays \( \begin{cases} 8 & \text{if } n=1 \\ 2^n & \text{if } n \geq 2 \end{cases} \)  
  - **Handouts:** Instructions, faction roles, and reflection prompts.

  **Payoffs:**  
  - Tokens are symbolic (no real-world value).  
  - **Bankrupt Rule:** Casino pays min(payout, bankroll). If bankroll is exhausted, the casino "resets" to 1,000 tokens for the next round (simulating a new casino).  

  ---

  ### **Timeline (90 Minutes Total)**
  #### **Stage 1: Finite Bankroll Simulation (40 min)**  
  1. **Setup (5 min):**  
     - Explain rules: Students pair up (8 pairs). Each pair has a coin. One is "House" (manages bankroll), one is "Player" (wins payouts).  
     - Bankroll starts at 1,000 tokens. Players play Lottery A.  
  2. **Simulation Rounds (25 min):**  
     - Each pair conducts **8 trials** (2 min/trial). Players flip until heads, record \(n\), calculate payout \(2^n\), but receive min(payout, bankroll).  
     - House adjusts bankroll: If payout > bankroll, bankroll hits 0 (reset next round).  
     - **Instructor:** Track aggregate payouts on a public board.  
  3. **Data Collection (10 min):**  
     - Report results: Most payouts cluster at 2–128 tokens; rare hits near 1,000. Compute empirical average (likely 10–30 tokens).  
     - Highlight: Despite infinite expectation, almost all players got <100 tokens. Bankruptcies occur but don’t inflate averages.  

  #### **Stage 2: Pricing Committee Debate (25 min)**  
  1. **Faction Assignment (5 min):**  
     - Split class into three factions:  
       - **Infinite Optimists:** Argue price should be high (e.g., 500+ tokens) since expectation is infinite.  
       - **Empirical Realists:** Argue price should be low (e.g., 10–50 tokens) based on observed payouts.  
       - **Bankroll Conservatives:** Argue price must ensure casino solvency (e.g., ≤20 tokens).  
  2. **Structured Debate (20 min):**  
     - Each faction has 3 min to present.  
     - **Facilitator Protocol:**  
       - Use a "token of speech" (e.g., a ball) to enforce turns.  
       - Challenge factions: *"How would your price change if the bankroll was infinite?"*  
       - Record prices on board (will vary wildly). No consensus forced.  

  #### **Stage 3: Dominating Lotteries & Ranking Failure (20 min)**  
  1. **Introduce Lottery B (5 min):**  
     - Explain: Lottery B pays **more** than A for \(n=1\) (4 > 2), **same** for \(n \geq 2\).  
     - Verify: Both have infinite expectation (\(E[A] = \infty\), \(E[B] = \infty\)).  
  2. **Group Ranking Task (10 min):**  
     - Groups of 4 rank A, B, C by "value" and assign prices.  
     - **Critical Prompt:** *"Can expected value justify ranking B > A? Why or why?"*  
  3. **Reveal Conflict (5 min):**  
     - Groups report: All prefer B > A > C, but admit EV fails to distinguish them.  
     - Highlight: Stochastic dominance is obvious, but EV equates them.  

  #### **Debrief (15 min)**  
  **Map Activity to Paradox:**  
  | **Activity Moment**          | **Paradox Insight**                                  | **Standard Response**                          |  
  |------------------------------|-----------------------------------------------------|-----------------------------------------------|  
  | Low empirical payouts        | Finite experience vs. infinite theory               | Bankroll capping (e.g., casino solvency)      |  
  | Faction price disagreement   | No unique "fair price" under divergence            | Expectation undefined (e.g., Cauchy principal value) |  
  | Lottery B > A despite same EV| EV fails for infinite comparisons                  | Stochastic dominance > EV                     |  
  | Price stability for A/B/C    | No EV tool to compare dominating lotteries         | Bounded utility (but note: *not* primary here)|  

  **Key Takeaways:**  
  1. The paradox reveals a **breakdown in expected value** for infinite expectations, not just risk aversion.  
  2. **Responses have trade-offs:**  
     - Bankroll capping: Solves practicality but is arbitrary.  
     - Bounded utility: Resolves divergence but ignores dominance.  
     - Undefined expectation: Mathematically honest but leaves decisions unmade.  
  3. **Core Tension:** When \(E[X] = \infty\), "fair price" loses meaning, and we need tools beyond EV (e.g., dominance, safety first).  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem:** Bankruptcies too rare to feel consequential.  
    **Solution:** Use a smaller bankroll (e.g., 256 tokens) for Stage 1.  
  - **Problem:** Faction debate becomes repetitive.  
    **Solution:** Interrupt with devil’s advocate questions: *"Would you pay $1M for a ticket if the bankroll was infinite?"*  
  - **Problem:** Students try to "solve" the paradox with utility.  
    **Solution:** Pre-empt: *"Utility bounds fix divergence but can’t explain why B > A—assume linear utility today."*  
  - **Problem:** Arithmetic bogs down during payouts.  
    **Solution:** Provide calculators or pre-computed \(2^n\) tables.  

  ---

  ### **What the Activity Cannot Do**  
  - **Reproduce True Infinity:** No finite simulation can replicate the indefinitely growing tails of the St. Petersburg lottery. Students must **mathematically imagine** the \(\infty\).  
  - **Utility’s Role:** The activity intentionally sidelines diminishing utility. You must explicitly state:  
    > *"While utility bounds resolve the divergence, they don’t address why we prefer B to A when both have \(E[X] = \infty\). The deeper issue is that EV is inadequate for ranking infinite-expectation options."*  

  ---

  ### **Instructor Script Snippets**  
  - **During Ranking Failure:** *"EV says A, B, and C are all ‘worth’ \(\infty\). But if you prefer B to A, you’ve admitted EV isn’t the whole story. What else matters?"*  
  - **Debrief Closing:** *"The St. Petersburg paradox isn’t just about money—it’s a warning that when expectations diverge, our tools shatter. You can cap, bound, or retreat to safer math, but each choice has a cost."*  

  This design forces students into the paradox’s "messy middle," where they confront the inadequacy of expected value while avoiding pat solutions. The emphasis on dominance in Stage 2 ensures they leave uneasy about infinite expectations, not just risk.
