prompt: |-
  You are a philosopher of mind and affective scientist with deep expertise in the emotions literature, and you are unusually good at making your reasoning auditable. Please work carefully and slowly. Before you produce any numbers, spend a short section brainstorming: lay out the main ways the question below could come out and the considerations that push in each direction, without committing to anything yet.

  Here is the question I want a credence on. I am a software engineer with no formal training in philosophy, and I keep running into this debate without being able to tell how much of it is substantive. I want your honest probability that the following claim is true:

  Emotional experiences are a kind of perception. More precisely: emotions present the world as having evaluative features — a situation is presented as dangerous, an act as offensive, a person as delightful — in roughly the way visual experience presents a surface as having a color; and this perceptual character is essential to what an emotion is, so that emotions are not reducible either to judgments (beliefs or appraisals about one's situation) or to non-intentional bodily feelings (raw sensations of arousal or valence with no object).

  Treat "roughly the way" as doing real work here: I am asking whether the perceptual construal is the right one to reach for, not whether emotion is literally vision.

  To fix the target, here is a case I have been turning over. Suppose a person takes a pill that reliably produces every autonomic and behavioral signature we associate with fear — racing heart, widened eyes, avoidance, a startled flinch — while they sincerely report feeling no fear and make no fear-relevant judgments. Yet when asked to sort images, they sort threatening ones faster and misclassify neutral ones as threatening. Call this the cold-fear case. I want to know whether you think a case like this, if it really occurred, would count as evidence for the perceptual view (the body is registering an evaluative feature that the person has not yet come to believe), as evidence against it (nothing is presented as dangerous to anyone, so there is no perception), or as neither.

  Now please give me a single number — your credence in the claim above — and then the decomposition. Break the claim into the sub-questions it actually depends on, and for each one give a rough probability and one line of justification. I expect the sub-questions to include at least: whether emotions are intentional at all, or whether some genuinely lack an object; whether, if intentional, their content is propositional and judgment-like or non-propositional and perceptual; whether the perceptual vocabulary is literal or a useful metaphor we could drop without loss; whether the felt bodily component is essential to the phenomenology or merely typical; and whether emotions behave like perception in the relevant functional respects, for instance in being cognitively impenetrable or modular. Add or remove sub-questions as you see fit, but show me how the parts combine into the whole, and do not hand me a bare number or a shrug about how it depends on your framework.

  I also want three things on top of the decomposition. First, tell me which single sub-question the final number is most sensitive to, and how much the number would move if you flipped your answer on it. Second, tell me what evidence or argument would move your number the most, and in which direction — ideally something that could actually be gathered, not just a change of heart. Third, tell me what the cold-fear case should do to the number, if anything, and whether your treatment of it is stable across your sub-questions.

  For calibration: my own credence in the claim is about 0.35, and I arrived there mostly by distrusting the perceptual vocabulary as a metaphor that has quietly been taken literally. If you land somewhere far from me, say where you think the disagreement between us actually lives, in terms of the sub-questions above.
