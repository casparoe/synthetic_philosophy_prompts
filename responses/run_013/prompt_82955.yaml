prompt: |-
  I'm a software engineer with no philosophy training, and I sit as the lay member on the ethics advisory committee of a fertility clinic. The clinic is in a country where only expenses-only surrogacy is lawful and donor compensation is capped, and the committee decides which requests the clinic will take on or help facilitate. We have now decided six cases, and next month I vote on a seventh. I have been treating the six as data points and trying to fit a rule to them, because the minutes recite the same boilerplate every time — voluntariness, counseling, commercial element — without ever saying which of the three did the work.

  Approved: (1) gestational surrogacy carried by the intended mother's sister, expenses only, both women independently counseled; (2) a woman donating eggs to a close friend, uncompensated, the donor identifiable to any resulting child, both counseled; (3) surrogacy carried by a friend who ran her own business and was comfortably better off than the intended parents, expenses only, both counseled.

  Rejected: (4) a request to refer a couple to a foreign agency whose surrogate would be paid a fee, recruited by the agency, a first-time surrogate in debt, with no contact with the intended parents and a contract containing a penalty clause; (5) our own proposal to recruit egg donors for a per-cycle fee, advertised at universities, above the legal cap, without independent counseling; (6) a donation from a twenty-two-year-old who lived with the intended parents and depended on them financially, where no fee would be paid but the parents would cover her rent and tuition for three years, with no independent counseling for her.

  Each of the six, as it happens, is defensible on at least three different grounds, which is why I am stuck rather than reassured.

  The seventh case: a same-sex male couple in another country, where paid surrogacy is lawful, wants to commission a gestational surrogacy through a local agency using a compensated egg donor, and has asked whether our clinic will cooperate. The surrogate would be a repeat surrogate, has her own income, is not in debt, has her own lawyer and her own counselor, is paid in stages out of escrow, and could withdraw at any point; the couple is not wealthy relative to her.

  Act as a bioethicist who works on reproductive markets and comparative policy. Start by brainstorming the candidate decision rules that fit our record, then predict how we will decide, say which rule you think we are really running and why you prefer it to the others that fit equally well, and name the further case that would best distinguish those rules from one another. If six decisions cannot support picking a rule, or if the honest reading is that we are managing legal exposure and reputation rather than applying a principle, say so plainly instead of manufacturing a rule for me.
reasoning: |-
  Hmm, the user is a software engineer on an ethics committee at a fertility clinic, trying to reverse-engineer their decision pattern from six past cases. They're frustrated because the minutes are vague, listing "voluntariness, counseling, commercial element" without specifying which factor was decisive. Now they're facing a seventh case involving international surrogacy and need clarity.

  Breaking down the cases: Approved cases (1-3) all feature close relationships (sister, friend, friend), genuine non-commercial arrangements (expenses-only/uncompensated), and robust counseling. The rejected cases (4-6) involve financial pressures (debt, tuition dependency), profit motives (above-cap fees, penalty clauses), and absent counseling. Interesting how the "close relationship" aspect correlates perfectly with approval - but is that causal or coincidental?

  For the new case (#7), it's tricky. The surrogate seems protected (repeat professional, own lawyer, escrow payments), but it's fully commercial and cross-border. If the clinic's hidden rule is "no commodification," they'd reject it despite the safeguards. If it's "no exploitation," they might approve given the surrogate's autonomy. 

  The user's framing as "data points" suggests they want an algorithmic approach, but ethics rarely reduces to clean rules. The legal context matters too - the clinic operates in a jurisdiction that bans paid surrogacy, so cooperating with a paid arrangement abroad might create reputational or legal risks even if ethically defensible. 

  What they really need isn't just a prediction for case #7, but transparency about the committee's actual priorities. Are they prioritizing relational integrity over individual autonomy? Preventing marketization above all? The next case should test this - perhaps a paid surrogacy between strangers with ironclad protections versus an unpaid arrangement with subtle coercion. 

  Most honestly? The committee seems to be blending three concerns: avoiding commodification (rejecting #4-#6's market elements), ensuring autonomy (requiring counseling), and preferring kinship models (approving #1-#3's familial/friend dynamics). Case #7 forces them to choose which principle dominates when they conflict.
answer: |-
  Based on your six cases and the underlying legal context, here's a bioethicist's analysis of your committee's pattern, the likely approach to Case #7, and the core principle at play:

  **Brainstormed Candidate Rules (Fitting All 6 Cases):**

  1.  **Anti-Commodification + Autonomy Safeguards:** Prohibit transactions where gametes/gestation are treated as commodities *unless* mitigated by a significant pre-existing relational bond *and* robust protections (counseling, no undue inducement). Commercial elements (payment beyond expenses/fees above cap) are inherently suspect but can be overridden *only* by the relational bond *plus* safeguards. Close relationships negate the "commodity" perception.
  2.  **No Undue Inducement/Exploitation + Autonomy Safeguards:** Prohibit arrangements where the donor/surrogate's decision is likely compromised by financial desperation, dependency, or lack of information. Compensation isn't inherently wrong *if* the provider is financially secure, autonomous, and fully informed/protected (counseling, legal rep). The relational bond in approvals #1-3 incidentally ensures this, but isn't strictly necessary (as hypothetically allowed by #7).
  3.  **Relational Integrity Model:** Prefer arrangements grounded in altruism and pre-existing, meaningful relationships (familial, close friendship). Commercial transactions or arrangements with strangers (even if technically "protected") are disfavored as undermining the social meaning of reproduction and kinship. The safeguards in approvals are secondary confirmations of the relationship's health.
  4.  **Legal & Reputational Risk Minimization:** Approve only arrangements clearly compliant with local law (expenses-only, capped fees) and avoid any association with practices (like foreign commercial surrogacy or above-cap payments) that could attract legal scrutiny or public criticism, regardless of the specific ethics of the case. The "close relationship" approvals are safe PR; the rejections avoid clear legal/PR dangers.

  **Prediction for Case #7: The Committee Will Likely Reject It**

  *   **Why:** It directly involves commissioning compensated surrogacy and egg donation through a commercial agency. Even with strong protections for the surrogate, this embodies the "commercial element" explicitly rejected in cases #4, #5, and #6. The lack of a pre-existing relational bond between the couple and the surrogate/donor distinguishes it from the approved cases. Cooperating facilitates a process fundamentally at odds with the local legal and (inferred) ethical stance against paid surrogacy/donation. The committee would likely see this as akin to #4 (foreign commercial agency), even if the surrogate's situation is better.

  **The Rule You're Likely Running (And Why It's Preferable):**

  *   **Core Principle:** **Anti-Commodification Primacy, tempered by Relational Altruism and Safeguards.**
  *   **Explanation:** The consistent thread is a deep aversion to treating reproductive capacity as a commodity for sale. Payments beyond expenses/capped fees are inherently problematic (#4, #5, #6 rejected). This aversion is only overcome when the act is framed as altruistic within a significant pre-existing relationship (#1, #2, #3 approved), *and* voluntariness is demonstrably protected by counseling and the absence of financial desperation/dependency. The committee isn't *just* minimizing legal risk (#5 was your own proposal, showing ethical concern beyond mere compliance). Nor is it *only* about preventing exploitation (#3's surrogate was wealthier, showing commodification itself is the issue; #6's dependency was key, but the lack of payment didn't save it – the *inducement* via dependency was commodifying). The relational context transforms the act from a "sale" into a "gift," making the compensation merely reimbursement/support.
  *   **Why Preferable to Other Fitting Rules:**
      *   **vs. Pure Undue Inducement/Exploitation Focus:** This rule better explains the rejection of #5 (proposal to pay *above cap* even if donors weren't desperate) and the *inherent* problem with #4/#6's commercial/inducement elements. It also explains why #3 was approved (no commodification despite surrogate's wealth) and why the relational bond is so central (it negates commodification).
      *   **vs. Pure Relational Integrity:** This rule accounts for the *necessity* of safeguards (counseling) even within relationships (#1, #2, #3) – pure relational focus might not require these. It also explains the rejection of #5 (no relationship, but also commodification) and #4 (commodification paramount).
      *   **vs. Pure Risk Minimization:** This rule explains the *ethical* rejection of #6 (dependency/inducement) and the internal ethical stance against #5, going beyond just avoiding illegal acts or bad PR.

  **The Distinguishing Case:**

  *   **Scenario:** A financially secure, independent woman with her own legal counsel and therapist (like #7's surrogate) offers to be a *gestational surrogate for a complete stranger* within your country's legal framework (expenses-only). She has no debt, a stable income, and undergoes thorough independent counseling. There is *no* pre-existing relationship with the intended parents; she responds to a clinic information session. The IPs are middle-class.
  *   **How it Distinguishes:**
      *   **Anti-Commodification + Relational:** **Reject.** Lacks the essential relational bond to transform the act from a commodified service into altruistic giving. Payment of expenses still feels like compensation for a service rendered by a stranger.
      *   **No Undue Inducement/Exploitation + Safeguards:** **Approve.** The surrogate is autonomous, secure, informed, and protected. No undue inducement exists. The compensation is legally permitted expenses. Exploitation/inducement risks are mitigated.
      *   **Relational Integrity:** **Reject.** Lacks the pre-existing, meaningful relationship deemed essential.
      *   **Legal/Reputational Risk Minimization:** **Approve.** It's fully legal within your jurisdiction (expenses-only) and involves a domestic arrangement with safeguards, posing minimal obvious risk.
  *   **This case forces the committee to choose:** Is the *absence of commodification* achieved *only* through a pre-existing relationship framing the act as a gift? Or, if exploitation is prevented and safeguards are strong, is a legal, expenses-only arrangement with a stranger acceptable? Your current pattern strongly suggests the former.

  **Honest Assessment:**

  While legal exposure and reputation are undoubtedly background concerns (especially evident in rejecting #4 and your own #5 proposal), the six cases strongly suggest an **underlying ethical principle centered on preventing the commodification of reproduction.** This principle is primarily satisfied through **altruism grounded in significant pre-existing relationships**, with counseling and the absence of financial desperation acting as necessary safeguards to ensure that altruism is genuine and voluntary. The committee isn't *just* managing risk; it's applying a substantive (if implicit) ethical view that reproduction should be an act of relational giving, not a commercial transaction, even when other harms seem mitigated.

  **Recommendation for Case #7:** Given this analysis, if you believe the core principle is anti-commodification requiring relational altruism, you should likely vote **against** cooperating, as Case #7 embodies the commercial model your committee has consistently rejected. If you believe preventing exploitation with safeguards is sufficient (the other plausible rule), you could vote for it. Use the upcoming discussion to explicitly surface *which* principle is driving the committee's thinking.
