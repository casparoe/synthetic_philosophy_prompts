prompt: |-
  I'm a PhD student in philosophical logic, and I'm assembling a short anthology for our department's reading group on what happens when Gödel's incompleteness results are borrowed by fields that aren't mathematics. Write me a short story — around 1,200 to 1,800 words — set in a fictional jurisdiction whose constitution requires a Constitutional Codification Board to certify, once a decade, that the country's formalised legal code is consistent: that no two derivable rulings contradict one another. The code has just been extended far enough to encode statements about its own rulings, and the certification is due. I want the story to turn on the gap between what the Board can derive from inside the code and what may nonetheless be true of it, with at least one character sliding from 'no consistency proof is available to us here' to 'the code is inconsistent' or 'the law is arbitrary', and another character insisting that a proof might still be had from outside the code, or by other means. Please avoid the minds-outstrip-machines ending, and don't let anyone in the story claim that the results show truth to be relative or one formal system to be as good as another. The drama should be procedural rather than mystical: a deadline, a split Board, a dissent that misstates the logic in a way a reader who knows the theorems will wince at.

  After the story, give me a brief structured summary as a JSON object with exactly these fields: "title" (string); "theorem_in_play" (which result the story dramatises, and in what legal guise); "character_error" (the mistaken inference, in one sentence); "what_the_theorem_licenses" (one sentence on the strongest claim the Board could defensibly make); "reader_trap" (the single sentence from the story most likely to be quoted approvingly by someone who has misunderstood the result); "left_open" (what the story deliberately does not settle). Write everything, story and summary alike, in British English.
