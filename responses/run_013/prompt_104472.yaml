prompt: |-
  I have spent most of my adult life assuming that decision-making under risk has exactly one respectable framework: assign probabilities, assign values to outcomes, maximize expected utility with a concave utility function doing the work of encoding your tolerance for variance, and treat everything else as either a special case of that or a mistake. A few months ago the assumption took a hit. I had just left a salaried job to manage a small family pool of capital — money that has to survive decades of withdrawals and a few bad years, rather than a portfolio I get to mentally reset each January — and a friend who plays poker semi-seriously told me that the only staking rule worth using is the Kelly criterion: stake the fraction of your bankroll that maximizes expected log wealth, which for an even-money wager that doubles your stake with probability p and loses it outright with probability 1 − p comes out to 2p − 1, so a bet you win 51% of the time justifies a two-percent stake and not a penny more. His argument was that this fraction makes your wealth compound fastest and that no other rule can beat it in the long run, and he described the underlying doctrine as geometric rationality, as though it were a rival to the arithmetic kind rather than a footnote to it.

  What I want from you is a careful comparison of these two things as accounts of rational choice under risk: the growth-optimal staking rule, and expected-utility maximization of the ordinary sort. Are they rivals, or is the growth rule simply expected-utility maximization with the logarithm of wealth as the utility function — in which case someone who prefers it is expressing a taste for one particular curvature, and an investor who stakes more aggressively under a different utility function is not irrational but merely different? Or does the growth rule rest on something the expected-utility framework does not supply, namely an argument about the behavior of one actual wealth path through time rather than an average over hypothetical parallel versions of the same person — an argument that bites only because wealth multiplies rather than adds, and only because you expect to keep playing? I would like the strongest form of each side, the places where the two must genuinely diverge rather than merely sounding different, and an explicit sorting of which parts of the disagreement are substantive and which are terminological. Tell me also whether my friend's claim that no other staking rule can beat the growth-optimal one in the long run is true as stated or needs qualification, and whether the case for the growth rule survives when capital can be spread across many independent favorable opportunities at once, so that the average across simultaneous bets rather than the path of a single bankroll becomes the thing that matters.

  Please do that concretely rather than in the abstract. Take the 51% even-money bet offered once, and the same bet offered every day for a year; a favorable wager with a much larger edge, where the growth rule wants a large stake and the chance of ruin is real; a case where the growth-optimal stake and the expected-value-maximizing stake point in opposite directions and you have to say which you would follow; and a case where the odds are only estimated, so that the supposedly optimal fraction is itself uncertain. For each, tell me what each framework recommends, where one of them has nothing to say at all, and which of the two you would trust if you were the one holding the pool — including whether the growth argument depends on assumptions my situation violates, such as an indefinite horizon, the absence of any absorbing state, and probabilities known exactly. If I have misstated either the growth rule or the expected-utility framework, correct me rather than humoring me. I do not need citations or a reading list; I need the reasoning.
reasoning: |-
  We are going to compare two frameworks for decision-making under risk: expected utility theory (EUT) and the Kelly criterion (growth-optimal staking). We'll do this by examining concrete examples and then drawing general conclusions.

  ## Clarifications and Corrections

  ### Expected Utility Theory (EUT)
  - You are correct that EUT involves assigning probabilities to outcomes, assigning utilities (which are a function of wealth, typically concave to model risk aversion), and maximizing expected utility.
  - The utility function is usually defined over total wealth (or sometimes over changes in wealth, but the former is more common in the context of long-term portfolio management). The concavity captures decreasing marginal utility of wealth and risk aversion.

  ### Kelly Criterion
  - The Kelly criterion maximizes the expected logarithm of wealth (or equivalently, the growth rate of wealth). For a single bet with two outcomes (win with probability `p` and lose with probability `q=1-p`), where if you win you gain `b` times the amount staked (so for an even-money bet, `b=1`, meaning you double the staked amount on a win and lose it on a loss), the optimal fraction to bet is:
    ```
    f* = (p*b - q) / b
    ```
    For an even-money bet (`b=1`), this simplifies to `f* = p - q = 2p - 1`.
  - The claim that it maximizes the growth rate (i.e., the long-run compound growth) is correct. Moreover, it is known that if you bet a fixed fraction of your bankroll repeatedly, then the Kelly fraction maximizes the long-run growth rate and minimizes the time to reach a given wealth goal asymptotically.

  ### The Friend's Claim
  - The friend's claim that "no other staking rule can beat it in the long run" is true in a specific sense: in the long run, the Kelly strategy will almost surely (with probability 1) accumulate more wealth than any other "essentially different" strategy. However, note:
    - This is an asymptotic result and does not guarantee better performance in finite time.
    - It assumes that the same bet is repeated independently and that the bettor can reinvest a fixed fraction of current wealth each time.
    - The comparison is with strategies that bet a fixed fraction (or a fixed set of fractions) of current wealth. It does not necessarily apply to strategies that change the fraction arbitrarily over time or that are not proportional to current wealth.

  ## Concrete Examples

  ### Example 1: A Single 51% Even-Money Bet
  - **Setup**: You have current wealth `W0`. You are offered a single bet: you stake `S` (a fixed amount, or a fraction `f` of `W0`). With probability 0.51 you get `2S` (so net gain `S`), and with probability 0.49 you lose `S`.
  - **Expected Utility Theory (EUT)**:
    - If we use a utility function `U(W)`, then the expected utility of betting `S = f * W0` is:
      ```
      EU = 0.51 * U(W0 + S) + 0.49 * U(W0 - S)
          = 0.51 * U(W0(1+f)) + 0.49 * U(W0(1-f))
      ```
    - We maximize this with respect to `f` (with `0 <= f <= 1`).
    - The optimal `f` depends on `U`. For example:
      - If `U` is linear (risk-neutral), then `EU = 0.51*(W0(1+f)) + 0.49*(W0(1-f)) = W0(1 + 0.02f)`. So we maximize `f` (i.e., bet everything, `f=1`).
      - If `U` is logarithmic (i.e., `U(W)=ln(W)`), then:
          ```
          EU = 0.51 * ln(W0(1+f)) + 0.49 * ln(W0(1-f))
              = ln(W0) + 0.51*ln(1+f) + 0.49*ln(1-f)
          ```
          Maximizing with respect to `f` gives:
          ```
          dEU/df = 0.51/(1+f) - 0.49/(1-f) = 0
          => 0.51(1-f) = 0.49(1+f)
          => 0.51 - 0.51f = 0.49 + 0.49f
          => 0.51 - 0.49 = 0.51f + 0.49f
          => 0.02 = f
          ```
          So `f=0.02` (2%) as per Kelly.
      - If `U` is more concave (e.g., `U(W) = -exp(-aW)` for some `a>0`, the CARA utility, or `U(W)=W^(1-γ)/(1-γ)` for CRRA with `γ>0` and `γ≠1`), then the optimal `f` will be less than 0.02 (if `γ>0`) and could be zero if the utility function is very concave (high risk aversion).
  - **Kelly Criterion**:
    - The Kelly fraction for this bet is `f* = 2p-1 = 2*0.51-1 = 0.02` (2%).
    - This maximizes the expected log wealth: `E[ln(W1)] = 0.51*ln(W0(1+f)) + 0.49*ln(W0(1-f))`.
  - **Comparison**:
    - The Kelly criterion is equivalent to EUT with a logarithmic utility function.
    - For a single bet, the Kelly fraction is the optimal fraction if your utility function is logarithmic. But EUT allows other utility functions. So if you have a different utility function (say, linear or exponential), then the optimal fraction is different.
    - Thus, in this example, the two frameworks are consistent: Kelly is a special case of EUT.

  ### Example 2: The Same 51% Bet Offered Every Day for a Year (about 250 bets)
  - **Setup**: You start with `W0` and can bet a fraction `f` of your current bankroll each day on the same 51% even-money bet. We assume the bets are independent.
  - **Expected Utility Theory**:
    - If we have a utility function defined over terminal wealth (after 250 bets), then we maximize `E[U(W_250)]`.
    - The terminal wealth is a product of the outcomes of each bet: `W_250 = W0 * ∏_{i=1}^{250} (1 + f*X_i)`, where `X_i` is `1` with probability 0.51 (win) and `-1` with probability 0.49 (loss).
    - The expectation `E[U(W_250)]` is a high-dimensional integral (or sum) and is hard to compute. However, for some utility functions we can reason:
      - **Logarithmic Utility**: `U(W) = ln(W)`. Then:
          ```
          E[U(W_250)] = E[ln(W0) + ∑_{i=1}^{250} ln(1+f*X_i)] 
                       = ln(W0) + 250 * [0.51*ln(1+f) + 0.49*ln(1-f)]
          ```
          This is maximized by the same `f` as before: `f=0.02`. Moreover, because of the additivity of the log over independent multiplicative bets, the one-step optimization is the same as the multi-step optimization.
      - **Other Utility Functions**: For a utility function that is not logarithmic, the optimal `f` might be different and might even change over time. However, if we assume we can only choose a fixed fraction (as in the Kelly setup) and we have CRRA utility (power utility), then the optimal fraction is constant and equals the Kelly fraction only for log utility (which is the limit of CRRA as `γ→1`). For CRRA with `γ≠1`, the optimal fraction is different. For instance, with `γ>1` (more risk averse than log), the fraction is less than 2%. 
  - **Kelly Criterion**:
    - The Kelly fraction is still 2%. It maximizes the long-run growth rate, which is defined as:
        ```
        G(f) = E[ln(1+f*X)] = 0.51*ln(1+f) + 0.49*ln(1-f)
        ```
        and the long-run growth rate per bet is `G(f)`. The goal is to maximize `G(f)`.
    - After 250 bets, the growth-optimal strategy is to bet 2% each time.
  - **Comparison**:
    - The Kelly criterion is again equivalent to EUT with logarithmic utility. But what if we use a different utility function? Then EUT would recommend a different fraction. 
    - The key point: Kelly maximizes the long-run growth rate. In the very long run (as the number of bets goes to infinity), the Kelly strategy will almost surely dominate any other strategy that bets a different fixed fraction (in the sense that it will have higher terminal wealth). However, note:
        - This is an asymptotic result. In 250 bets, there is a chance that a different strategy might do better.
        - The Kelly strategy does not maximize the expected terminal wealth (that would require betting `f=1` for a positive edge, which leads to almost sure ruin because of the chance of losing even one bet). It maximizes the expected log of terminal wealth, which is equivalent to maximizing the geometric mean of the multi-period returns.
        - For EUT with a utility function that is very risk averse (e.g., one that is extremely concave), the optimal fraction might be less than 2% to avoid the possibility of large drawdowns.

  ### Example 3: A Favorable Wager with a Large Edge
  - **Setup**: Consider a bet that wins with probability `p=0.6` and pays even money (`b=1`). The Kelly fraction is `f* = 2p-1 = 0.2` (20%).
  - **Expected Utility Theory**:
    - For a logarithmic utility: `f=0.2`.
    - For a linear utility (risk-neutral): `f=1` (bet everything).
    - For a CRRA utility with relative risk aversion `γ=2` (so `U(W)= -1/W`), the optimal fraction for a single bet is found by maximizing:
        ```
        EU = 0.6 * (-1/(W0(1+f))) + 0.4 * (-1/(W0(1-f)))
        ```
        Let `g(f) = 0.6/(1+f) + 0.4/(1-f)`. We minimize `g(f)` because of the negative sign. The derivative is:
        ```
        g'(f) = -0.6/(1+f)^2 + 0.4/(1-f)^2
        ```
        Setting to zero: `0.6/(1+f)^2 = 0.4/(1-f)^2` => `sqrt(0.6/0.4) = (1+f)/(1-f)` => `sqrt(1.5)≈1.2247 = (1+f)/(1-f)` => `1.2247*(1-f)=1+f` => `1.2247 - 1.2247f = 1+f` => `0.2247 = 2.2247f` => `f≈0.101` (about 10.1%).
    - So for this utility, we bet about 10.1%, which is less than the Kelly 20% because the utility is more risk averse than log.
  - **The Chance of Ruin**: 
    - With Kelly (20%), the chance of losing 20% of the bankroll in one bet is 40%. However, ruin (in the strict sense of wealth going to zero) is not possible in one bet. But if we repeat the bet, then with Kelly we never go broke because we only bet a fraction. However, if we use a linear utility and bet everything, then we have a 40% chance of going broke in one bet.
  - **Comparison**:
    - The growth-optimal stake (Kelly) is 20%. The expected-value maximizer (linear utility) would bet 100%. The CRRA with `γ=2` would bet 10.1%. 
    - Which one would I trust? For long-term capital growth, I would prefer Kelly because it balances growth and risk of ruin. Betting 100% is too aggressive because one loss wipes you out. Betting 10.1% is more conservative but might be too conservative for the long run. However, note that in repeated betting, the Kelly fraction (20%) maximizes the growth rate. In the long run, it will dominate the 10.1% strategy. But in the short run, the 10.1% strategy may have a lower chance of large drawdowns.

  ### Example 4: A Bet Where Kelly and Expected Value Point in Opposite Directions
  - **Setup**: Consider a bet that wins with probability `p=0.01` and pays `b=100` times the stake (so if you stake `S`, you get `100S` on a win, and lose `S` on a loss). This is a very rare event with a huge payoff.
    - The expected value of the bet per unit staked is: `p*b - (1-p) = 0.01*100 - 0.99 = 1 - 0.99 = 0.01` (positive, so it's favorable).
    - The Kelly fraction is:
        ```
        f* = (p*b - q) / b = (0.01*100 - 0.99) / 100 = (1 - 0.99) / 100 = 0.01/100 = 0.0001 (0.01%)
        ```
        So Kelly says to bet a tiny fraction: 0.01% of your bankroll.
    - The expected value maximizer (linear utility) would bet as much as possible to maximize the expected gain. The expected gain per unit staked is positive, so they would bet 100% of the bankroll. However, note that the chance of winning is only 1%. So 99% of the time, you lose everything.
  - **Comparison**:
    - Expected value maximization (with linear utility) says to bet everything. Kelly says to bet 0.01%.
    - Which one is rational? 
      - If you are only going to make this bet once, then betting everything has an expected return of 1% of your bankroll. But 99% of the time you are ruined. 
      - Kelly betting 0.01% yields an expected log wealth of:
          ```
          E[ln(W1)] = 0.99 * ln(W0*(1-0.0001)) + 0.01 * ln(W0*(1+100*0.0001))
                     = ln(W0) + 0.99*ln(0.9999) + 0.01*ln(1.01)
          ```
          This is positive (since both logs are close to zero, but the positive log from the win is larger in absolute value than the negative from the loss). The expected value of the bet is positive, but the chance of ruin is too high to bet big.
    - I would trust the Kelly fraction. Betting everything is reckless because you are almost certainly going to lose everything. The Kelly fraction is small because the probability of winning is low, even though the payoff is high. It protects the bankroll.

  ### Example 5: Uncertain Probabilities
  - **Setup**: Suppose you are not sure about the probability of winning. For the 51% even-money bet, you estimate that `p` is between 0.49 and 0.53, but you don't know the exact value. How do you choose `f`?
  - **Expected Utility Theory**:
    - You would need to integrate over your uncertainty about `p`. For instance, if you have a prior distribution on `p`, then the expected utility of a fraction `f` is:
        ```
        EU(f) = ∫ [p * U(W0(1+f)) + (1-p) * U(W0(1-f))] dπ(p)
        ```
        and then maximize over `f`.
    - This can be computationally challenging and depends on the prior.
  - **Kelly Criterion**:
    - The standard Kelly formula requires a known `p`. If `p` is uncertain, then one common approach is to use the expected value of `p` (if you have a point estimate) but that might not be conservative. Another approach is to use a conservative estimate (like the lower bound of a confidence interval) to avoid overbetting. This is known as "fractional Kelly" or "half Kelly" in practice.
    - Alternatively, you can optimize the expected log wealth under uncertainty:
        ```
        E[ln(W1)] = E_p [ p * ln(1+f) + (1-p) * ln(1-f) ]
                   = μ_p * ln(1+f) + (1-μ_p) * ln(1-f)   (if we use the mean μ_p of p)
        ```
        Then the optimal fraction would be `f* = 2μ_p - 1`. However, if the distribution of `p` is not symmetric, then the expectation inside the log might require a different formula. Moreover, if the uncertainty is high, you might want to bet less.
  - **Comparison**:
    - Both frameworks require dealing with uncertainty. EUT naturally incorporates uncertainty by taking an expectation over the unknown probability. The Kelly approach, when extended by maximizing the expected log wealth over the prior, becomes a special case of EUT (with log utility) under uncertainty. However, in practice, Kelly advocates often use a conservative adjustment (like betting half the Kelly fraction) to account for uncertainty.

  ## The Core Disagreement

  The fundamental difference between the two frameworks is not in the mathematics but in the philosophy:

  1. **Kelly as a Special Case of EUT**: The Kelly criterion is exactly EUT with a logarithmic utility function. Therefore, if you choose to use Kelly, you are implicitly adopting log utility. However, the justification for Kelly is often based on long-run growth and avoiding ruin, which may not be captured by other utility functions.

  2. **Long-Run Argument**: The Kelly criterion is defended on the grounds that it maximizes the long-run growth rate. This argument is compelling in repeated bets. In fact, for repeated bets, the Kelly fraction minimizes the expected time to reach a given wealth goal (asymptotically) and has the property that it dominates any other strategy in the long run (with probability 1). This is not true for any other utility function.

  3. **Risk of Ruin and Drawdowns**: Kelly betting avoids ruin (if the fraction is less than 1 and the bets are not perfectly correlated) because you only bet a fraction of your bankroll. However, it does not avoid drawdowns. The log utility function is only moderately risk averse. Some investors might prefer a more conservative approach to reduce the chance of large drawdowns.

  4. **Multiple Independent Opportunities**: The Kelly criterion extends to multiple independent bets. The growth rate is additive in the log returns. You maximize:
      ```
      E[ln(1 + Σ_i f_i * X_i)]
      ```
      where `f_i` are the fractions on each bet and `X_i` are the returns. However, this is a complex optimization problem. The solution is to set the fractions so that the expected log is maximized. This is again equivalent to EUT with log utility. The growth rate is the sum of the growth rates of the individual bets if they are independent. The Kelly criterion for multiple bets is to bet each one at its own Kelly fraction if the bets are independent? Actually, no: the fractions interact. But the principle remains: maximize the expected log of the total return.

  ## Your Situation: Managing a Family Pool of Capital

  - **Horizon**: You have a finite horizon (decades) and withdrawals. This is different from the infinite horizon assumed in some asymptotic results. Moreover, withdrawals mean that you are not reinvesting the entire bankroll.
  - **Bad Years**: The possibility of a sequence of bad years (which might force you to withdraw from a diminished pool) is a real concern. This might make you more risk averse than log utility.
  - **Simultaneous Bets**: You can spread capital across many independent favorable opportunities. This reduces the variance and might allow you to bet more on each without increasing the overall risk. The Kelly criterion for multiple independent bets can be applied, but it requires solving a multi-dimensional optimization.

  ## Conclusion and Advice

  - **Are they rivals?** The Kelly criterion is a special case of EUT (with log utility). However, the justification for using log utility (i.e., the long-run growth maximization) is distinct and provides a strong argument in the context of repeated bets. In that sense, it is not just a taste for one curvature but a rationale for that curvature in repeated situations.

  - **Which to trust?** For managing a family pool of capital that must survive for decades with withdrawals, I would lean towards a conservative variant of Kelly. This might mean:
    - Using the Kelly criterion for portfolio allocation (with log utility) but then scaling down the fractions (e.g., half-Kelly) to reduce the chance of large drawdowns.
    - Incorporating the withdrawals by adjusting the utility function (e.g., by having a minimum wealth level that must be preserved) or by using a more risk-averse utility function.

  - **Qualification to the Friend's Claim**: The friend's claim that no other staking rule can beat the growth-optimal one in the long run is true in the sense of almost sure dominance in the limit of infinitely many bets. However, in finite time, other rules might have a better chance of avoiding ruin or achieving a specific goal. Moreover, the Kelly strategy has higher volatility (in terms of the variance of the growth rate) than more conservative strategies. Some investors prefer to sacrifice some growth for a smoother wealth path.

  - **Final Words**: For your situation, I would use a fractional Kelly system (say, half the Kelly fraction) to be more conservative. Also, consider the need for withdrawals by having a cash buffer and by adjusting the portfolio to have a lower risk of deep drawdowns. The Kelly criterion is a powerful tool but must be adapted to real-world constraints.

  If you have more specific details about the investment opportunities and the withdrawal schedule, we could refine this further.
answer: |-
  ### Core Relationship: Kelly as a Special Case of Expected Utility Theory  
  **Kelly is Expected Utility Maximization with Logarithmic Utility**. The Kelly criterion maximizes expected *log* wealth, which is equivalent to maximizing expected utility under a specific utility function: \(U(W) = \ln(W)\). This is a special case of expected utility theory (EUT) where the utility function is concave (logarithmic), encoding a particular risk tolerance. Thus:  
  - **Agreement**: Kelly is **not a rival** to EUT; it is a subset. Advocating for Kelly is advocating for log utility, not rejecting EUT.  
  - **Disagreement**: Kelly proponents argue this specific utility function (log) is uniquely rational for repeated bets due to its long-run growth properties. EUT allows other utility functions (e.g., linear, quadratic), which Kelly supporters may deem irrational for multiplicative wealth contexts.  

  ### Key Distinction: Time Horizon and Wealth Dynamics  
  The substantive divergence arises from **repeated bets and compounding**:  
  - **Kelly's Strength**: For repeated opportunities, Kelly maximizes the *long-run growth rate* (geometric mean). It exploits the multiplicative nature of wealth compounding.  
  - **EUT's Generality**: EUT maximizes the expectation of *any* utility function. For a single bet or finite horizon, non-log utility functions (e.g., more conservative) may better align with an agent's goals.  

  ---  
  ### Concrete Comparisons  

  #### 1. **Single 51% Even-Money Bet**  
  - **Setup**: Win 51% of the time, double your stake on win, lose stake on loss. Current wealth: $\(W\)$.  
  - **Kelly**: Stake fraction \(f^* = 2p - 1 = 0.02\) (2%). Maximizes \(E[\ln(\text{wealth})]\).  
  - **EUT**:  
    - With \(U(W) = \ln(W)\): Same as Kelly (\(f^* = 0.02\)).  
    - With linear utility \(U(W) = W\): Maximizes expected wealth. Stake \(f = 1.0\) (100%), since edge is positive (expected return = 2%).  
    - With quadratic utility (more risk-averse): Stake \(f < 0.02\).  
  - **Verdict**:  
    - Kelly and EUT (log) agree.  
    - EUT allows rational alternatives: A risk-neutral agent (\(U(W) = W\)) stakes 100%. A highly risk-averse agent stakes less.  
    - **Your choice**: For a one-off bet with no future bets, Kelly (log) is overly conservative if you can absorb the loss. EUT with linear utility (stake 100%) is rational if you value expected wealth and can tolerate ruin risk.  

  #### 2. **Same 51% Bet Daily for 1 Year (~250 Bets)**  
  - **Setup**: Repeated independent bets, compounding wealth.  
  - **Kelly**: Stake 2% per bet. Maximizes long-run growth rate. Terminal wealth grows as \(W_T \approx W_0 e^{250 \cdot G}\), where \(G = 0.51 \ln(1.02) + 0.49 \ln(0.98) \approx 0.0002\).  
  - **EUT**:  
    - With \(U(W) = \ln(W)\): Same as Kelly.  
    - With \(U(W) = W\) (linear): Stake 100% each time. Expected wealth high, but probability of ruin = \(1 - (0.51)^{250} \approx 100\%\).  
    - With \(U(W) = -e^{-aW}\) (CARA): Optimal \(f\) is constant but \(< 0.02\) if \(a > 0\).  
  - **Verdict**:  
    - Kelly dominates in the long run: After many bets, Kelly strategy almost surely exceeds alternatives.  
    - EUT (linear) leads to ruin with near certainty. EUT (CARA) avoids ruin but grows slower than Kelly.  
    - **Your choice**: For decades of compounding, Kelly is superior. Withdrawals and bad years make ruin unacceptable—Kelly’s capital preservation is key.  

  #### 3. **High-Edge Bet with Real Ruin Risk**  
  - **Setup**: Win 30% of the time, win 5x stake on win (net +4x), lose stake on loss. Edge = \(0.30 \times 4 - 0.70 \times 1 = 0.50\).  
  - **Kelly**: \(f^* = \frac{pb - q}{b} = \frac{0.30 \times 4 - 0.70}{4} = 0.125\) (12.5%).  
  - **EUT**:  
    - Linear utility: Stake 100% (maximizes expected wealth).  
    - Log utility: Stake 12.5% (same as Kelly).  
    - CRRA utility (\(U(W) = W^{1-\gamma}/(1-\gamma)\)): For \(\gamma > 0\) (risk-averse), \(f^* < 12.5\%\).  
  - **Outcome**:  
    - Kelly/Log: Growth-optimal. 70% chance of 12.5% loss per bet.  
    - Linear: 70% chance of ruin on first bet.  
  - **Verdict**:  
    - Kelly balances growth and risk. Linear utility ignores ruin.  
    - **Your choice**: Kelly. Ruin is irreversible for a family pool—avoid it.  

  #### 4. **Kelly vs. Expected Value: Opposite Directions**  
  - **Setup**: Win 1% of the time, win 300x stake on win (net +299x), lose stake on loss. Edge = \(0.01 \times 299 - 0.99 \times 1 = 2.00\).  
  - **Kelly**: \(f^* = \frac{0.01 \times 299 - 0.99}{299} \approx 0.000033\) (0.0033%).  
  - **EUT with Linear Utility**: Stake 100% (expected wealth = \(W_0 \times 3\)).  
  - **Outcome**:  
    - Kelly: Wealth grows slowly but almost surely.  
    - Linear: 99% chance of ruin on first bet.  
  - **Verdict**:  
    - Kelly stakes minimally to avoid ruin. Linear utility embraces ruin risk for high expected value.  
    - **Your choice**: Kelly. Survival is paramount for long-term pools.  

  #### 5. **Uncertain Probabilities**  
  - **Setup**: Estimated win probability \(\hat{p} = 0.51\), but true \(p\) is uncertain (e.g., \(p \sim \text{Beta}(51,49)\)).  
  - **Kelly (naive)**: Stakes \(2 \times 0.51 - 1 = 0.02\).  
  - **EUT/Kelly (Bayesian)**: Maximize \(E_p[E_{\text{outcome}}[\ln(W)]]\). For Beta prior, optimal \(f\) is less than 0.02.  
  - **Verdict**:  
    - Both frameworks require Bayesian updating. Naive Kelly overbets if estimates are noisy.  
    - **Your choice**: Use conservative fractional Kelly (e.g., half-Kelly) to protect against estimation error.  

  ---  
  ### Critical Evaluation of Claims  

  #### "No Other Rule Beats Kelly in the Long Run"  
  - **True, with qualifications**:  
    1. **Repeated Bets**: Kelly dominates *asymptotically* (i.e., as bets \(\to \infty\)) with probability 1. Its growth rate \(G = E[\ln(1+fX)]\) is maximal.  
    2. **Fixed Fraction Betting**: Kelly beats any *other fixed fraction* strategy. However, adaptive strategies (e.g., changing \(f\) based on wealth) can have lower ruin probability in finite time.  
    3. **Finite Horizon**: In finite time, Kelly has higher variance. A more conservative strategy may better avoid deep drawdowns (e.g., for a 30-year pool with withdrawals).  
    4. **Simultaneous Bets**: With many independent bets, Kelly optimizes the portfolio by maximizing \(E[\ln(1 + \sum f_i X_i)]\). The average growth rate is additive, so Kelly still maximizes long-run growth.  

  #### Does Kelly Require Infinite Play?  
  - **Yes, for dominance claims**: Asymptotic results assume indefinite play. For finite horizons (e.g., 30 years), Kelly is still growth-optimal but may be too aggressive if:  
    - **Absorbing states exist** (e.g., ruin stops play).  
    - **Withdrawals** reduce compounding capital.  
    - **Bad years** force suboptimal decisions (e.g., selling low).  
    Adapt by:  
    - Using fractional Kelly (e.g., \(0.5 f^*\)).  
    - Adding a floor for withdrawals.  

  ---  
  ### Your Family Pool: Which Framework to Trust?  
  - **Kelly is Fundamentally Sound** for long-term capital growth:  
    - Multiplicative compounding is central to your decades-long horizon.  
    - It avoids ruin while capturing edges.  
  - **But Adapt Kelly to Your Constraints**:  
    1. **Withdrawals**: Treat withdrawals as a fixed cost. Reduce stakes to ensure growth net of withdrawals.  
    2. **Uncertainty**: Use Bayesian-Kelly or fractional Kelly (e.g., half-stake) to hedge estimation error.  
    3. **Bad Years**: Simulate sequences with correlated drawdowns (e.g., recessions). Ensure Kelly stakes keep ruin probability near zero.  
    4. **Simultaneous Bets**: Spread capital across independent opportunities. Kelly optimizes the portfolio’s growth rate.  
  - **EUT’s Role**: If your risk tolerance isn’t captured by log utility (e.g., you value smoothing consumption more than growth), use EUT with a tailored utility function. But for pure capital growth, Kelly’s rationale is compelling.  

  ### Final Recommendation  
  For your family pool:  
  1. **Adopt Kelly as the Base**: Use \(f^* = \frac{pb - q}{b}\) for each opportunity.  
  2. **Downsize for Reality**: Stake \(0.3f^*\) to \(0.7f^*\) to guard against uncertainty, withdrawals, and bad years.  
  3. **Diversify**: Allocate across uncorrelated bets to reduce variance.  
  4. **Reject Linear Utility**: Never maximize expected value alone—it risks ruin.  

  Kelly is not a competitor to EUT; it is EUT’s most rational incarnation for repeated multiplicative growth. But it must bow to the finite, the uncertain, and the human.
