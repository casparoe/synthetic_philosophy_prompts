  ### Constructed Case: The Duplicated Random String

  **Data Stream:**  
  Observed prefix \(D\): a fixed, incompressible binary string of length \(n\) (e.g., \(n = 10^6\) bits from a cryptographic RNG, ensuring \(K(D) \approx n\) by incompressibility).  
  Continuation \(C\): identical to \(D\) (i.e., \(C = D\)).  
  *Total data*: \(D\) followed by \(D\).

  **Hypotheses:**  
  - **Hypothesis A (Short Description, High Complexity given Data):**  
    A probabilistic program that models the data as **independent fair coin flips**.  
    - *Description*: Fixed code (e.g., "generate 2\(n\) independent bits with P(0)=P(1)=0.5"). Length \(L(A) = c_1\) (small constant, \(\approx 100\) bits).  
    - *Prediction*: Continuation \(C\) is \(n\) independent fair bits.  
    - *Not refuted by \(D\)*: \(D\) has nonzero probability (\(2^{-n}\)) under A.  
  - **Hypothesis B (Long Description, Low Complexity given Data):**  
    A deterministic program that **outputs \(D\) twice**.  
    - *Description*: Encodes \(D\) explicitly (e.g., "print the string \(D\) twice"). Length \(L(B) = n + c_2\) (\(c_2 \approx 100\) bits; \(n\) bits for \(D\) as it is incompressible).  
    - *Prediction*: Continuation \(C = D\).  

  **Description-Length Gap & Invariance Theorem:**  
  - **Prior-only razor** (minimize \(L(\text{hypothesis})\)):  
    \(L(A) = c_1 \ll n + c_2 = L(B)\) → Favors A.  
  - **Two-part MDL** (minimize \(L(\text{hypothesis}) + L(\text{data} \mid \text{hypothesis})\)):  
    - \(L(\text{data} \mid A) = -\log P(\text{data} \mid A) = 2n\) bits (since \(P(\text{data} \mid A) = 2^{-2n}\)).  
    Total for A: \(c_1 + 2n\).  
    - \(L(\text{data} \mid B) = 0\) (B exactly predicts data).  
    Total for B: \(n + c_2\).  
    Since \(n + c_2 \ll c_1 + 2n\) for large \(n\), MDL favors B.  
  - **Invariance gap**: The difference in two-part codelengths is \((c_1 + 2n) - (n + c_2) = n + (c_1 - c_2)\). For \(n \gg c_1, c_2\), this gap scales with \(n\) and exceeds any constant from the choice of reference machine (per the invariance theorem, machine-dependent constants are bounded by \(O(1)\), independent of \(n\)).

  ### Predictions and Outcomes
  1. **Prior-only razor**: Selects A (shorter description). Predicts \(C\) as random bits.  
  2. **Two-part MDL**: Selects B (shorter two-part code). Predicts \(C = D\).  
  3. **Solomonoff mixture**:  
     - Weight of A: \(\propto 2^{-L(A)} \cdot P(\text{data} \mid A) = 2^{-c_1} \cdot 2^{-2n}\).  
     - Weight of B: \(\propto 2^{-L(B)} \cdot P(\text{data} \mid B) = 2^{-(n + c_2)} \cdot 1\).  
     For large \(n\), B dominates the mixture (ratio \(\frac{\text{weight of B}}{\text{weight of A}} \approx 2^{n - c_1 - c_2} \gg 1\)). Predicts \(C = D\).  

  **Continuation \(C\)**: Matches \(D\) → **Vindicates MDL and Solomonoff**.  

  ### Analysis
  - **Why Solomonoff sides with MDL (not forced, but natural)**:  
    Solomonoff’s mixture incorporates *both* prior (description length) and likelihood (fit to data). Here, B’s massive likelihood advantage (\(P(\text{data} \mid B) = 1\) vs. \(2^{-2n}\) for A) outweighs its longer description. This alignment occurs because the data strongly favors B, and the gap in fit scales with \(n\). It is **not forced**—e.g., if \(C\) were random, Solomonoff might favor neither—but arises because B exploits determinism in the data.  
  - **Feature doing the work**: **Deterministic duplication** (continuation copies prefix). This allows B to compress the continuation to 0 bits given the hypothesis, while A cannot compress it.  
  - **If duplication is removed** (e.g., \(C\) is random and independent of \(D\)):  
    - B’s two-part code becomes \(\approx n + c_2 + n\) (explicitly encode \(C\)), similar to A’s \(c_1 + 2n\).  
    - Prior-only and MDL agree on A (if \(c_1 < n + c_2\)). Solomonoff would favor A if \(D\) and \(C\) are random.  
  - **Response from a prior-only advocate**:  
    The prior-only razor should be a **prior over hypotheses**, not the final predictor. After seeing \(D\), a Bayesian updates to the posterior:  
    \[
    P(B \mid D) \propto 2^{-L(B)} \cdot 1 \gg P(A \mid D) \propto 2^{-L(A)} \cdot 2^{-n}.
    \]  
    Thus, the prior-only razor is correct as a prior, but **must be updated with data** to yield accurate predictions. Ignoring the likelihood (fit to data) is indefensible.  

  This case cleanly separates the prior-only view (simplicity as short hypothesis length) from MDL (simplicity as short total description length), with Solomonoff aligning with MDL due to its Bayesian nature. The duplication structure ensures the gap is machine-independent and practically significant for large \(n\).
