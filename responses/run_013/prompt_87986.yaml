  Question 1 is absolutely essential - without solving locality criteria, the whole framework collapses. Question 3 is crucial because boundary problems could undermine the coherence of the patchwork view. And Question 4 is important as it connects directly to scientific applicability, making the framework relevant beyond metaphysics.

