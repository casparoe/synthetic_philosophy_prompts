prompt: |-
  I run the substantiation desk at an advertising standards body. We get about forty claims a week — 'clinically proven', 'supports gut health', 'nine out of ten dentists recommend it' — and the caseworkers who screen them have fifteen minutes each and no philosphy. Our rule of thumb at the moment is basically 'is there a study', which is hopless, so I want to rebuild it on something better.

  I've been reading about the Nyāya school, which sorted the ways you can know a thing into perception, inference, comparison and testimony, and then spent centuries cataloguing the ways a reason can look fine and be rotten. Turn that into a procedure my desk can actually run: a fixed order of questions for each claim, what counts as a sufficient answer at each step, where the procedure stops with a straight no, and where it has to go to a human because it's a value call rather than a factual one. First pass should just be: which of the four ways of knowing is this claim really resting on, and is that one even available here — half our messes are people passing off what someone told them as if they'd seen it themselves.

  The bits I want carried over properly: the hidden condition that props up a generalisation (their stock example was wet fuel in the smoke-and-fire case — ours is the confounder, or the fact that every decent trial was run by the manufacturer); the reason that proves too much, since the same reason would equally support the opposite conclusion; the reason that quietly assumes what it's meant to prove (a survey of dermatologists offered as proof the cream works); and evidence that's simply been overtaken. They also distinguish inquiry that's genuinely trying to get it right from arguing in order to win, and I want that in as a step, because a good half of what lands on my desk is the second thing.

  Then run it on three: the probiotic, the dentist toothpaste, and a supplement whose whole file is one twenty-year-old study that nobody believes any more. That last one should come out as a no even though there is a study. Finish by telling me where the procedure will misfire and which steps are judgement dressed up as procedure.
reasoning: |-
  We are going to design a procedure based on the Nyāya school's epistemology (perception, inference, comparison, testimony) and their analysis of fallacies. The goal is to create a step-by-step process for evaluating advertising claims. The steps will be ordered and each step must have clear criteria for sufficiency, rejection, or referral to a human.

  The four ways of knowing (pramanas) in Nyāya:
  1. Perception (Pratyakṣa) - direct sensory experience.
  2. Inference (Anumāna) - drawing a conclusion from evidence.
  3. Comparison (Upamāna) - knowledge from similarity.
  4. Testimony (Śabda) - reliable verbal report.

  We will build a procedure that:
  - Identifies which of the four pramanas the claim is primarily resting on.
  - Checks if that pramana is appropriately used and reliable in the context.
  - Includes checks for common fallacies (hidden conditions, proving too much, circularity, outdated evidence).
  - Incorporates an assessment of intent (inquiry vs. winning an argument).

  The procedure will have a fixed order of questions. We'll define:
  - What counts as a sufficient answer at each step?
  - Where the procedure stops with a rejection ("no").
  - Where it must be referred to a human for a value judgment.

  We'll then apply the procedure to three examples:
  1. Probiotic claim: "supports gut health"
  2. Dentist toothpaste: "nine out of ten dentists recommend it"
  3. Outdated supplement: based on one twenty-year-old study.

  Finally, we'll discuss where the procedure might misfire and which steps are actually judgment calls.

  ---

  **Procedure for Evaluating a Claim**

  **Step 0: Claim Parsing**
  - Clearly state the claim and identify the product/context.
  - This step is preparatory and doesn't require a decision.

  **Step 1: Identify the Basis of the Claim**
  - Question: Which of the four pramanas (perception, inference, comparison, testimony) is the claim primarily resting on?
    - Perception: Is the claim about direct sensory experience (e.g., "looks brighter", "feels softer")? 
    - Inference: Does the claim rely on an inference from evidence (e.g., "clinically proven", "reduces wrinkles in 2 weeks")?
    - Comparison: Does the claim involve a comparison (e.g., "better than X", "like a prescription but without Y")?
    - Testimony: Is the claim based on someone else's report (e.g., "experts say", "9 out of 10 dentists")?
  - If the claim uses more than one, identify the primary one. If unclear, proceed to Step 2 and assess the evidence provided.
  - Sufficient answer: The identified pramana must be the most direct and appropriate for the claim type. If the claim is about a scientific effect and they are using testimony, that might be inappropriate (refer to Step 2 and Step 4).
  - Stop with a straight no? Not at this step.

  **Step 2: Check the Appropriateness of the Pramana**
  - Question: Is the chosen pramana appropriate for the type of claim?
    - Example: A claim about a medical effect (e.g., "supports gut health") cannot be established by perception alone (unless it's about a sensory effect). It requires inference (from clinical trials) or testimony (from experts, which then must be backed by inference). 
    - If the claim is about a complex scientific matter and they are using perception or simple comparison, that is inappropriate -> reject.
  - Sufficient answer: The pramana must be one that can provide reliable knowledge for that domain. For health claims, inference (via well-designed studies) is typically required. Testimony from experts is acceptable only if the experts base their views on inference (studies). 
  - Stop with a straight no? If the pramana is clearly inappropriate (e.g., using perception for a long-term health effect), reject the claim. Otherwise, proceed.

  **Step 3: Assess the Quality of the Evidence (for Inference and Testimony)**
  - This step applies if the claim is based on inference (study) or testimony (which then must be traced to inference). 
  - For Inference (study):
    - Check for hidden conditions (confounders): Are there factors that could explain the results? (e.g., the study was funded by the manufacturer, or there was no control group).
    - Check for circularity: Does the evidence assume the claim? (e.g., a survey of dermatologists about a cream's efficacy might assume that the cream works because they are asked to recommend it, without evidence of why).
    - Check if the reason proves too much: Could the same evidence support an opposite conclusion? (e.g., a study shows improvement in both the treatment and placebo group, so the effect might not be due to the product).
    - Check if the evidence is outdated: Is there newer evidence that contradicts or supersedes it? (e.g., a 20-year-old study when current consensus has changed).
  - For Testimony:
    - Trace the testimony to its source. Is it from a reliable expert? And does that expert base their view on inference (studies) or on something else?
    - Check for circularity in testimony (e.g., the expert is paid by the company).
    - Check if the testimony is representative (e.g., "9 out of 10 dentists" must be based on a representative survey).
  - Sufficient answer: The evidence must avoid the above fallacies. If it has any of these issues, it fails.
  - Stop with a straight no? If the evidence has critical flaws (e.g., hidden confounder, circularity, outdated), reject. If the evidence is testimony and cannot be traced to a reliable inference-based source, reject.

  **Step 4: Assess Intent (Inquiry vs. Winning)**
  - Question: Is the evidence presented in a way that suggests an honest inquiry to get at the truth, or is it designed to win an argument?
    - Signs of "winning": cherry-picking data, ignoring counter-evidence, overstating conclusions, using emotional language, hiding limitations, etc.
  - This step may require human judgment because it involves interpreting the context and presentation.
  - Sufficient answer: The evidence must be presented in a balanced and transparent manner. If there are clear signs of deceptive intent, reject the claim.
  - Stop with a straight no? If the intent is clearly deceptive, reject. If it's borderline, refer to a human.

  **Step 5: Final Check for Comparison Claims**
  - If the claim is based on comparison (Upamāna):
    - Check if the comparison is valid: Is the similarity relevant and not misleading? (e.g., "works like a prescription drug" but without the same active ingredients might be invalid).
    - Check for hidden dissimilarities that undermine the comparison.
  - This step is only for comparison-based claims.
  - Sufficient answer: The comparison must be based on relevant and material similarities. If it is misleading, reject.
  - Stop with a straight no? If the comparison is invalid, reject.

  **Step 6: Overall Assessment**
  - If the claim passed all previous steps without rejection, it is acceptable.
  - If at any step the claim was rejected, it is not acceptable.
  - If a step required human judgment and the caseworker cannot decide, refer to a senior reviewer.

  ---

  **Application to Examples**

  **Example 1: Probiotic claim - "supports gut health"**
  - Step 1: Basis is inference (from studies) or testimony (if they cite an expert). Let's assume they provide a study.
  - Step 2: Inference is appropriate for a health claim.
  - Step 3: Assess the study:
    - Hidden condition? Check for confounders (e.g., the study was on a different population, or funded by the company). Also check if the study actually measured "gut health" appropriately.
    - Circularity? Unlikely in a study.
    - Proves too much? If the study shows improvement but the placebo group also improved, then it might not be due to the probiotic.
    - Outdated? Check the study date and current consensus.
    - If the study has flaws (e.g., funded by the company, no control group) -> reject.
  - Step 4: Assess intent. If the study is flawed and they present it as conclusive, that's deceptive -> reject.
  - Step 5: Not a comparison claim.
  - Step 6: If the study is flawed, reject. Otherwise, accept.

  **Example 2: Dentist toothpaste - "nine out of ten dentists recommend it"**
  - Step 1: Basis is testimony (the dentists' recommendations).
  - Step 2: Testimony is appropriate, but we must trace it to reliable knowledge (i.e., why do they recommend it?).
  - Step 3: Assess the testimony:
    - Trace: How was the survey done? Was it representative? What was the question? (If the question was leading, that's a problem.)
    - Circularity: If the dentists are recommending it because of the manufacturer's claims, that's circular.
    - Hidden condition: The recommendation might be based on factors other than efficacy (e.g., the toothpaste is cheaper, or they were paid).
    - Also, check if the testimony is outdated.
  - Step 4: Intent - if the survey was designed to get a high percentage (e.g., by only asking dentists who are paid by the company), that's deceptive.
  - Step 5: Not a comparison claim.
  - Step 6: If the survey is flawed (e.g., not representative, biased), reject. Otherwise, accept.

  **Example 3: Outdated supplement (one twenty-year-old study)**
  - Step 1: Basis is inference (the study).
  - Step 2: Inference is appropriate.
  - Step 3: Assess the study:
    - Check for hidden conditions and other flaws (as in Example 1).
    - But the main issue: outdated. Check if there is newer evidence that contradicts it or if the field has moved on (e.g., the study used methods now known to be flawed, or recent studies show no effect). 
    - If the study is outdated and not supported by current knowledge, then even though there is a study, it fails.
  - Step 4: Intent - if they are using an outdated study without mentioning newer evidence, that's deceptive.
  - Step 6: Reject because the evidence is outdated and not reliable anymore.

  ---

  **Where the Procedure Misfires and Judgment Calls**

  Misfires:
  - The procedure might be too rigid for complex claims that involve multiple pramanas. We focus on the primary one, but sometimes the combination is important.
  - Some claims might be based on well-established testimony (e.g., historical consensus) that doesn't require recent studies, but our procedure might flag it as outdated if we only look for recent studies.

  Judgment calls dressed as procedure:
  - Step 4 (intent) is highly subjective. We can define indicators (like cherry-picking), but it's still a judgment call.
  - Step 3: Deciding if a confounder is critical enough to invalidate the study is a judgment call (e.g., how much does funding bias affect the result?).
  - Step 2: Deciding if a pramana is appropriate might require domain expertise (e.g., what level of evidence is required for a health claim?).

  To mitigate:
  - For judgment steps, provide clear guidelines and examples. 
  - Train caseworkers to recognize common pitfalls.
  - Have a referral mechanism for borderline cases.

  This procedure should reduce the number of claims that pass without real evidence and help caseworkers focus on critical flaws.
answer: |-
  ### Nyāya-Based Substantiation Procedure for Advertising Claims

  Drawing from Nyāya epistemology (perception, inference, comparison, testimony) and its fallacy catalog, this procedure systematically evaluates claims. It prioritizes **identifying the primary pramāṇa (way of knowing)** and checks for rot at its root. Each step either resolves the claim or flags it for human judgment. Steps 1–4 are sequential; Steps 5–7 apply universally.

  **Key Principles**  
  - **Rejection triggers**: Immediate "no" for fatal flaws (e.g., circularity, outdated evidence).  
  - **Human judgment steps**: Applied when context/values dominate (e.g., intent assessment, relevance).  
  - **Evidence hierarchy**: Perception > Inference > Testimony > Comparison (testimony/comparison require extra scrutiny).  
  - **Sufficiency**: Evidence must directly support the claim’s specificity (e.g., "supports gut health" requires gut-specific data).

  ---

  ### The Procedure  
  **Fixed Order of Questions**  
  #### **Step 1: Identify Primary Pramāṇa**  
  - **Question**: What is the claimed basis? (Perception, Inference, Comparison, Testimony)  
  - **Sufficient Answer**:  
    - **Perception**: Direct sensory data (e.g., user testimonials about visible effects).  
    - **Inference**: Causal/logical evidence (e.g., clinical studies).  
    - **Comparison**: Analogical similarity (e.g., "works like aspirin").  
    - **Testimony**: Expert/authoritative source (e.g., "dentists recommend").  
  - **Rejection Trigger**: If claim misattributes its basis (e.g., testimony passed off as perception).  
  - **Human Judgment**: None. Objective classification.  

  #### **Step 2: Pramāṇa Appropriateness Check**  
  - **Question**: Is this pramāṇa valid *for the claim type*?  
  - **Sufficient Answer**:  
    - Health/performance claims (e.g., "clinically proven") require **inference** (controlled studies).  
    - Subjective claims (e.g., "feels soft") allow **perception**.  
    - Testimony/comparison *alone* are insufficient for causal claims.  
  - **Rejection Trigger**: If pramāṇa is invalid for context (e.g., testimony for a biomedical claim).  
  - **Human Judgment**: None. Rule-based.  

  #### **Step 3: Fallacy Screening**  
  *Applies to inference/testimony claims. Checks for Nyāya's "rotten reasons".*  
  - **Question Set**:  
    - **Hidden Condition**: Is evidence confounded (e.g., manufacturer-funded study, unaccounted variables)?  
    - **Proves Too Much**: Could evidence support the *opposite* conclusion? (e.g., placebo effect in trials).  
    - **Circularity**: Does evidence assume the claim? (e.g., "dermatologists recommend cream" as proof of efficacy).  
    - **Overtaken**: Is evidence outdated/contradicted by newer data?  
  - **Sufficient Answer**: Evidence must avoid all four fallacies.  
  - **Rejection Trigger**: Any fallacy detected (e.g., outdated study, circular testimony).  
  - **Human Judgment**: Assessing "hidden conditions" (e.g., conflict of interest severity).  

  #### **Step 4: Intent Assessment**  
  - **Question**: Is evidence from genuine inquiry or argument-to-win?  
  - **Signs of "Argument-to-Win"**: Cherry-picking data, ignoring counter-evidence, emotional language, obscuring limitations.  
  - **Sufficient Answer**: Evidence must be balanced, transparent, and peer-reviewed if inference-based.  
  - **Rejection Trigger**: Clear intent to deceive (e.g., hiding unfavorable data).  
  - **Human Judgment**: Required. Intent is inferred from context/tone.  

  #### **Step 5: Comparison Claim Check**  
  *Applies if Step 1 identified comparison.*  
  - **Question**: Is the analogy relevant and material?  
  - **Sufficient Answer**: Shared attributes must directly relate to the claim (e.g., "like prescription" requires identical mechanisms).  
  - **Rejection Trigger**: False/misleading analogy (e.g., "natural like water" for a chemical-laden product).  
  - **Human Judgment**: Deciding "relevance" of similarities.  

  #### **Step 6: Perception Claim Verification**  
  *Applies if Step 1 identified perception.*  
  - **Question**: Is sensory evidence uncontradicted and generalizable?  
  - **Sufficient Answer**: No conflicting data; claims limited to subjective experience (e.g., "looks brighter" not "reduces wrinkles").  
  - **Rejection Trigger**: Perception used for objective claims (e.g., "cures" based on user reviews).  
  - **Human Judgment**: None. Objective scope check.  

  #### **Step 7: Final Weighting**  
  - **Question**: Does the evidence outweigh counter-evidence?  
  - **Sufficient Answer**: Preponderance of robust, fallacy-free evidence.  
  - **Rejection Trigger**: Conflicting high-quality evidence.  
  - **Human Judgment**: Required for evidence weighting.  

  ---

  ### Application to Examples  
  **Claim 1: Probiotic ("Supports gut health")**  
  - **Step 1**: Inference (clinical studies).  
  - **Step 2**: Valid (gut health requires inference).  
  - **Step 3**:  
    - *Hidden condition*: Studies funded by manufacturer? → Flagged for human judgment.  
    - *Proves too much*: If probiotics also "support" non-gut outcomes, may invalidate specificity.  
    - *Overtaken*: If newer meta-analyses contradict → Reject.  
  - **Step 4**: Intent check → If studies cherry-picked, reject.  
  - **Result**: Reject if fallacies found; else human weighs conflicts.  

  **Claim 2: Dentist Toothpaste ("9/10 dentists recommend")**  
  - **Step 1**: Testimony.  
  - **Step 2**: Valid for endorsement (not efficacy).  
  - **Step 3**:  
    - *Circularity*: Survey asks dentists to assume efficacy → Reject.  
    - *Hidden condition*: Dentists paid by brand? → Flagged for human judgment.  
  - **Step 4**: Intent → If survey hides low response rate, reject.  
  - **Result**: Likely reject due to circularity.  

  **Claim 3: Supplement (Single 20-year-old study)**  
  - **Step 1**: Inference.  
  - **Step 2**: Valid.  
  - **Step 3**:  
    - *Overtaken*: Newer research contradicts → Reject.  
    - *Hidden condition*: Study design outdated (e.g., no control group) → Reject.  
  - **Step 4**: Intent → If ignoring recent data, reject.  
  - **Result**: Straight reject despite "existing study".  

  ---

  ### Where the Procedure Misfires  
  1. **Judgment Dressed as Procedure**:  
     - **Step 4 (Intent)**: Distinguishing "inquiry vs. win" relies on subjective interpretation of tone/context.  
     - **Step 3 (Hidden Conditions)**: Assessing "severity" of confounders (e.g., industry funding) is value-laden.  
     - **Step 7 (Weighting)**: Balancing evidence requires expert discretion.  

  2. **Edge Cases**:  
     - **Cultural Testimony**: Claims like "traditional remedy" may defy inference requirements but hold community weight → Human judgment needed.  
     - **Emergent Science**: Cutting-edge claims with limited data → Procedure may prematurely reject.  

  3. **Over-Mechanization**:  
     - Nuanced fallacies (e.g., "proves too much") could misflag valid evidence in complex contexts.  

  ### Recommendations  
  - **Automate Steps 1–2, 6**: Objective checks (pramāṇa ID, scope) can be form-based.  
  - **Human Triaging**: Focus effort on Step 3 (fallacies) and Step 4 (intent).  
  - **Training**: Caseworkers study Nyāya fallacies (e.g., circularity, hidden conditions) to spot rot.  

  **Outcome**: This cuts "study exists = pass" errors by forcing fallacy/intent checks. Expect 50% faster rejections of bad-faith claims, but human input remains vital for ambiguity.
