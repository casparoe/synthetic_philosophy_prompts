answer: |-
  Here’s a rigorous set of desiderata for evaluating theories of thought experiments (TEs), grounded in historical cases, epistemic distinctions, and practical application. Each requirement is tied to a key case or distinction, with the most exclusionary desideratum flagged and tensions noted.

  ---

  ### **Core Desiderata for a Theory of Thought Experiments**
  1. **Handle Successful Refutation**  
     *Case:* Galileo’s falling bodies (refutes Aristotle’s "heavier objects fall faster" by showing inconsistency).  
     *Requirement:* Must explain how TEs can decisively falsify theories by exposing contradictions *without new empirical data*.  
     *Exclusionary Power:* High. Rules out theories that reduce TEs to mere persuasion.

  2. **Explain Constructive Knowledge**  
     *Case:* Einstein’s elevator (equivalence principle: gravity ≈ acceleration in a sealed elevator).  
     *Requirement:* Must account for TEs that *positively support new laws/norms*, not just refute old ones.  
     *Tension Point:* With #1 (refutation vs. confirmation).

  3. **Distinguish TEs from Plain Arguments**  
     *Case:* Leibniz’s "shrunken brain" vs. logical deduction.  
     *Requirement:* Cannot collapse TE-specific features (e.g., vivid mental modeling, intuition-pumping) into standard deduction/induction.  
     *Key Distinction:* Einstein’s elevator feels experientially richer than a syllogism.

  4. **Address Intuition-Pumping & Its Risks**  
     *Case:* Gettier cases (challenging JTB theory of knowledge via imagined scenarios).  
     *Requirement:* Must explain reliance on intuitions while accounting for misfires (e.g., Searle’s Chinese Room’s contested conclusions).  
     *Practical Need:* Live TEs often stand/fall on shared intuitions.

  5. **Differentiate Possibility from Necessity**  
     *Case:* Maxwell’s demon (possible? physically necessary? later shown thermodynamically impossible).  
     *Requirement:* Must distinguish TEs that show *conceptual possibility* (e.g., refuting necessity claims) from those claiming *physical actuality*.  
     *Exclusionary Power:* Highest. Eliminates theories conflating logical/conceptual with nomological possibility.

  6. **Explain Communal Validation**  
     *Case:* Schrödinger’s cat (initially a reductio; now a pedagogical tool with shifted interpretation).  
     *Requirement:* Must address how TEs gain/lose authority across communities/time, beyond individual cognition.  
     *History Constraint:* Bohr-Einstein debates show TEs as dialectical tools.

  7. **Demarcate from Simulations**  
     *Case:* Twin Paradox (TE vs. computational relativistic modeling).  
     *Requirement:* Must clarify why *mental* execution (e.g., Einstein chasing a light beam) differs epistemically from computational simulation.  
     *Key Distinction:* TEs leverage tacit knowledge; simulations rely on explicit formalization.

  8. **Handle Misfires & Biases**  
     *Case:* Mary’s Room (knowledge argument for qualia; disputed due to intuition divergence).  
     *Requirement:* Must explain when/why TEs fail (e.g., biased intuitions, overlooked variables) *without ad hoc excuses*.  
     *Practical Need:* Essential for evaluating live TEs.

  9. **Preserve A Priori Elements Without Dogmatism**  
     *Case:* Kant’s "a priori intuition" of space (critiqued by Einstein’s relativity TEs).  
     *Requirement:* Can’t ignore TEs’ use of a priori reasoning (e.g., symmetry in Einstein’s elevator), but must avoid framing them as infallible.  
     *Psychology Constraint:* Cognitive science shows mental modeling is theory-laden.

  10. **Account for Historical Effectiveness**  
      *Case:* Newton’s bucket (defended absolute space; later undermined by Mach’s TE).  
      *Requirement:* Must align with how TEs *actually drove scientific progress* (e.g., motivating relativity/QM).  
      *Exclusionary Power:* High. Incompatible with views dismissing TEs as non-empirical window-dressing.

  ---

  ### **Key Tensions Between Desiderata**
  - **D4 (Intuitions) vs. D5 (Possibility/Necessity):** If TEs rely on intuitions (D4), how can they establish modal truths (D5) given intuitions’ fallibility?  
  - **D2 (Constructive Knowledge) vs. D1 (Refutation):** Confirmation vs. falsification may require distinct mechanisms.  
  - **D9 (A Priori) vs. D8 (Misfires):** Can’t both claim TEs tap into necessary truths *and* explain their frequent failures.

  ---

  ### **Verdict on Standard Views**  
  - **Argument View** (TEs as fancy arguments): Fails D3, D7, D10 (ignores experiential/communal dimensions).  
  - **Intuition View** (TEs pump intuitions): Struggles with D5, D8 (intuitions are unstable).  
  - **A Priorist View** (TEs reveal necessities): Fails D6, D8, D9 (ignores history/psychology of errors).  
  → **Intuition-based views** handle the most desiderata *if* augmented with socio-historical constraints (D6, D10), but D5 remains a challenge.

  ---

  ### **Practical Application Guide (for Live TEs)**  
  Apply this checklist:  
  1. Does it refute (D1) or construct (D2)?  
  2. What intuitions does it pump (D4)? Are they widely shared?  
  3. Does it claim possibility or necessity (D5)?  
  4. Could it misfire due to biases/omissions (D8)?  
  5. Is it reducible to a plain argument/simulation (D3, D7)?  

  *Example:* A modern TE claiming quantum consciousness could be critiqued via D4 (questionable intuitions), D5 (overreach from possibility to actuality), and D8 (ignores decoherence).  

  This framework prioritizes historical robustness while remaining actionable for novel TEs. The hardest nut is D5 (modality), which no theory fully cracks.
