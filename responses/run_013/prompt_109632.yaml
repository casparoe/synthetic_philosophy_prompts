answer: |-
  ## Joint Statement on Long-Term Ethical Prioritization

  **Agreed Claims:**

  1.  **Problem Scope:** We address the ethical prioritization between actions affecting the near-term present (e.g., helping existing people) and actions potentially affecting the very long-term future (e.g., reducing existential risks), using finite probabilities and finite values exclusively. No appeal to infinite utilities or probabilities is permitted.
  2.  **Question Separation:** We rigorously distinguish:
      *   *Axiological Question:* Is the potential value at stake in a maximally positive far future *bounded*? That is, does there exist a finite present-day good whose value is comparable to, or greater than, the value of *any* possible far future outcome?
      *   *Decision-Theoretic Question:* Assuming a given axiology (including potentially unbounded future value), does maximizing *expected value* (EV), where EV is calculated using standard probability-weighting (p * V), *always* yield the correct action ranking, even when involving arbitrarily small probabilities (p) of extremely large positive values (V)?
  3.  **Structural Constraint (The Trilemma):** We accept the following logical relationship concerning the shape of the value function (V):
      *   If V is sufficiently concave or bounded (to prevent fanatical comparisons where tiny p * enormous V dominates large p * modest V), then V is also sufficiently flat that aggregating a sufficiently large number of lives barely worth living (BWL) can outweigh a smaller number of excellent lives (leading towards a Repugnant Conclusion).
      *   Conversely, moves to block the Repugnant Conclusion – typically introducing lexical thresholds (where lives above a threshold are infinitely better than any number below) or sufficient convexity (e.g., prioritarianism) – inherently restore the possibility of fanatical comparisons, as a tiny probability of reaching the lexical threshold or very high value can dominate near-certain present goods.
      *   Therefore, achieving both (a) immunity to fanatical comparisons *and* (b) a clean escape from the Repugnant Conclusion using a single, standardly probability-weighted value function appears logically impossible under finite values.
  4.  **Rejection of Simple Solutions:** Neither side may dismiss the other's core concern by simply asserting the correctness of standard EV maximization (Fanatics) or by asserting the obvious absurdity of acting on tiny probabilities of vast payoffs (Anti-Fanatics) without argument engaging the separation of questions and the structural constraint.
  5.  **Taming Devices Under Scrutiny:** We agree to evaluate two proposed modifications to standard decision theory:
      *   **(a) Value Saturation/Capping:** Imposing a finite upper bound on *probability-weighted value* (p*V) for any single outcome or class of outcomes.
      *   **(b) Probability Transformation:** Applying a transformation function f(p) to probabilities before weighting value (V), such that f(p) > p for moderate p but f(p) << p for very small p (e.g., f(p) = p/(p + k) for some k > 0), while leaving V itself unbounded.

  **Table of Disagreements:**

  | Sub-Question at Issue                                                                 | Fanatics' Position (Own Wording)                                                                                                  | Anti-Fanatics' Position (Own Wording)                                                                                                 | Crux                                                                                                                             | Agreed Case/Argument & Predictions                                                                                                                               |
  | :------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Axiology: Is potential far-future value bounded?**                               | **"The potential positive value achievable in the far future is unbounded. No finite present good can be comparable to its best possible realizations."** | **"The potential positive value of *any* future, no matter how distant or vast, is fundamentally bounded. Some finite present goods are comparable in value to *any* possible future outcome."** | **Does a coherent, plausible axiology exist where the best possible futures *necessarily* have finite value, comparable to large present goods?** | **Argument:** Construct a value theory based on (e.g.) agent-relative constraints, saturation of key goods, or fundamental limits on moral significance per state. **Fanatic Prediction:** Any such theory will be implausibly arbitrary or fail to capture the true scale of potential future flourishing. **Anti-Fanatic Prediction:** A coherent and plausible theory demonstrating boundedness can be constructed (e.g., based on person-affecting views, limited scope of obligation, or essential finitude of value-bearing entities/states). |
  | **2. Decision Theory: Does untransformed EV mandate fanaticism if value is unbounded?** | **"If future value is unbounded, then standard expected value maximization (p*V) is the uniquely rational decision rule. Refusing its verdicts when p is small betrays a failure to grasp the logic of decision under uncertainty."** | **"Even if future value were unbounded, any decision rule that dictates prioritizing a one-in-a-googol chance of securing that value over a near-certain significant benefit to present beings is fundamentally unsound and unfit for guiding real-world action, revealing a flaw in the rule itself."** | **Is there a rational justification, distinct from axiological boundedness, for rejecting standard EV maximization when it yields fanatical prescriptions?** | **Argument:** Analyze whether fanatical prescriptions violate core intuitions about rational prudence, fairness, or the moral significance of near-certainty in a way that indicts EV itself, even under unbounded value. **Fanatic Prediction:** No such justification withstands scrutiny; the intuition stems from scope insensitivity or status quo bias. **Anti-Fanatic Prediction:** Yes; the fanatical implications constitute a decisive *reductio ad absurdum* against untransformed EV maximization under unbounded value. |
  | **3. Verbal Dispute: What does "fanaticism" signify?** (Dissolved)                    | **"Fanaticism' describes an unavoidable feature of the world when dealing with vast potential value under uncertainty; it is not a defect in EV theory."** | **"Fanaticism' names a catastrophic defect inherent in a decision rule (standard EV) that produces such absurd prescriptions."**                                                                 | **Disambiguation:** "Fanatical comparison" neutrally describes the *outcome*: a ranking where miniscule p * enormous V > large p * modest V. The *label* "fanaticism" applied to the *theory* vs. the *world* is evaluative. | **Agreed:** The core disagreement is not about whether the *outcome* occurs under standard EV + unbounded V, but whether this outcome signifies a fatal flaw in the *theory* (Anti-Fanatics) or an uncomfortable truth about the *world* (Fanatics). |
  | **4. Evaluation of Taming Device (a): Value Saturation/Capping**                      | **"Capping p*V is an ad hoc distortion of value comparisons that sacrifices theoretical coherence for practical comfort. It arbitrarily severs the link between actual value and its decision weight."** | **"Saturating p*V at a finite bound is a necessary and rational safeguard against the absurdities generated by untransformed EV maximization under unbounded value, reflecting the limited significance any single possibility can have for practical choice."** | **Can saturating/capping p*V be justified as a rational component of decision-making under deep uncertainty about vast stakes, independent of axiological boundedness?** | **Argument:** Assess if capping aligns with principles of rational attention, practical deliberation, or avoiding 'Pascalian' recklessness without resorting to axiology. **Fanatic Prediction:** No coherent justification exists beyond appealing to the Anti-Fanatic intuition deemed invalid in Row 2. **Anti-Fanatic Prediction:** Yes; capping is justified as a pragmatic or epistemic constraint on rational choice under extreme uncertainty. |
  | **5. Evaluation of Taming Device (b): Probability Transformation**                    | **"Transforming probabilities (e.g., f(p)) is only justified if it reflects a genuine epistemic constraint (like known uncertainty thresholds). Absent that, it's an irrational distortion of beliefs to avoid uncomfortable conclusions."** | **"Transforming small probabilities (e.g., f(p) < p for tiny p) is a rational response to the diminishing practical significance or knowability of such probabilities, providing a principled alternative to both fanaticism and value capping."** | **Can probability transformation be justified on epistemic or practical grounds (e.g., limits of credence assignment, decision stability) as a rational part of weighting expectations under extreme uncertainty?** | **Argument:** Examine whether limits on our ability to meaningfully distinguish or act upon vanishingly small probabilities warrant downweighting them in expectation calculations. **Fanatic Prediction:** Only in specific, empirically grounded cases; general transformation functions are arbitrary. **Anti-Fanatic Prediction:** Yes; the inherent fuzziness and practical insignificance of minuscule probabilities rationally supports systematic downweighting. |
