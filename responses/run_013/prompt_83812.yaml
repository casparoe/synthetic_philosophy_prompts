  ### Analysis of the Hospital Case
  The hospital case involves a standard set of chart abbreviations used in one of two equally workable ways. A new resident using the alternative way is corrected until she conforms, and the team agrees it would be worse off if everyone switched at once. We must classify this as a convention, norm, both, or neither, based on the colleague's earlier verdicts.

  ### Rules Fitting the Earlier Verdicts
  The colleague's verdicts suggest distinct rules for convention and norm, but there is also an evolutionary interpretation where they are stages of a single process. Below are three rules that fit the verdicts equally well:

  1. **Rule 1 (Distinct Kinds: Lewis-Inspired Coordination vs. Enforcement):**
     - **Convention:** A regularity that is:
       - Arbitrary (at least one alternative exists that would work equally well).
       - Sustained by conditional preferences (each prefers to conform given that others do, due to coordination benefits).
       - Solves a coordination problem (mutual adjustment for mutual benefit).
       - May or may not involve enforcement (e.g., no punishment for alternatives).
     - **Norm:** A regularity that is:
       - Enforced by social pressure (e.g., correction, punishment, or disapproval).
       - Not necessarily arbitrary or coordination-based; may involve moral obligation or social expectations.
       - Lacks strong conditional preferences based on coordination (e.g., preferences are independent of others' actions or driven by enforcement).
     - **Fits verdicts:**
       - Driving side: Convention (arbitrary, conditional preference for coordination).
       - "Red" meaning red: Convention (arbitrary, coordination for communication).
       - Tipping 20%: Norm (enforced, not primarily coordination-based; may involve obligation).
       - Wearing black to a funeral: Norm (enforced, social expectation, not coordination).
       - Office stairs: Neither (no conditional preference).
       - Private shoe habit: Neither (not shared).
       - Villages pulling left: Convention (arbitrary, coordination, no punishment).

  2. **Rule 2 (Distinct Kinds: Enforcement as Key for Norms):**
     - **Convention:** A regularity that is:
       - Arbitrary and solves a coordination problem via conditional preferences.
       - Enforcement is absent or incidental (not defining).
     - **Norm:** A regularity that is:
       - Enforced by social pressure (defining feature).
       - Arbitrariness and conditional preferences are irrelevant; focus is on enforcement.
     - **Fits verdicts:**
       - Same as Rule 1 for all cases, as enforcement is present in norms (tipping, funeral) and absent or minimal in conventions (villages, driving).

  3. **Rule 3 (Evolutionary Stages: Convention to Norm):**
     - **Convention:** Initial stage: a regularity arising from a coordination problem, arbitrary, with conditional preferences, but little or no enforcement.
     - **Norm:** Later stage: enforcement mechanisms develop (e.g., social pressure) to reinforce the convention, which may overshadow the coordination aspect.
     - **Convention and norm are not different kinds but stages:** A convention can evolve into a norm when enforcement emerges.
     - **Fits verdicts:**
       - Driving side: Convention (early stage, though enforcement may exist, it's not emphasized).
       - "Red" meaning red: Convention (early stage, language conventions start without enforcement).
       - Tipping 20%: Norm (late stage, enforcement dominates).
       - Wearing black: Norm (late stage, enforced by tradition).
       - Office stairs: Neither.
       - Private habit: Neither.
       - Villages pulling left: Convention (early stage, no enforcement).

  ### Predictions for the Hospital Case
  - **Rule 1 (Distinct Kinds: Coordination vs. Enforcement):**  
    Prediction: **Convention.**  
    Reasoning: The abbreviations are arbitrary (two equally workable ways), involve conditional preferences (the team prefers the current way given others use it, as switching would worsen outcomes), and solve a coordination problem (uniform abbreviations prevent confusion). Enforcement (correction) is present but secondary; the core is coordination.

  - **Rule 2 (Distinct Kinds: Enforcement as Key):**  
    Prediction: **Both convention and norm.**  
    Reasoning: It is a convention (arbitrary, coordination, conditional preferences) and a norm (enforced by correction). Rule 2 allows overlap if enforcement is present alongside convention features.

