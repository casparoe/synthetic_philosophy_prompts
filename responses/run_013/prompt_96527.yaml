prompt: |-
  I'm in a Discord with a bunch of ex-LessWrong types and two actual neuroscientists, and we've been going at "is the brain a computer?" on and off for about eight months now, to the point where people pre-emptively sigh when it comes up. The camps are pretty stable. Camp A says: obviously it is, and that's why the question feels slippery — any physical system whose states can be mapped onto the states of some formal automaton is running that automaton, so your brain is running God knows how many computations at once, and the interesting question was never "is it a computer" but "do computational descriptions of it do any explanatory work." Camp B says that's cheating: "computing" names a specific kind of causal-mechanical process — something that manipulates representations in a rule-governed, medium-independent way — and brains do that literally, while thermostats and bucket brigades and the solar system don't. Then A says B is smuggling in "representation" and "rule-governed" to do the work, which is the exact thing we wanted explained, and B says A has watered the thesis down until it's unfalsifiable and no longer interesting. Two suggestions from the group that I keep coming back to: one guy wants us to split the claim into three senses of "the brain computes" (a description we can always give, an implementation the system really has, and an explanation that does work) and says the fight is entirely about which sense people are using; another thinks the real fault line is whether you take the discrete, error-correcting character of digital computation to be essential or just an engineering convenience.

  What I want from you is a diagnosis of the impasse, not another lap around the track. Is this a verbal dispute that dissolves once we pin down what "is" is doing (constitutive vs. merely descriptive), or are the camps genuinely answering different questions under one heading — one metaphysical, one about what form a good explanation has — with the shouting caused by them sharing a sentence? Is there a hidden formal or empirical question doing the work, like whether there's a non-arbitary criterion of implementation that's neither satisfied trivially by everything nor just a function of our descriptive interests? My own hypothesis, and please push on it rather than just agreeing, is that most of this is the verbal/aims thing and a smaller chunk is a real crux about implementation criteria, and that we'd know which is which if someone could show either that every physical system implements something (making B's narrow notion a choice rather than a discovery) or that implementation can be pinned down by a system's causal structure alone. Given your diagnosis, tell me what would actually count as progress here — a distinction, a theorem, an experiment, or just admitting the question was ill-posed and moving on — and be honest if the answer is that we should stop expecting the arguement to ever end.
reasoning: |-
  Okay, let me unpack this user's query. They're stuck in a long-running debate about whether the brain is a computer, with two entrenched camps. Camp A thinks any physical system can be mapped to computation, so the brain obviously computes. Camp B argues computation requires specific representational and rule-governed processes. The user wants a diagnosis of the impasse, not rehashing arguments.

  First, I need to understand the core disagreement. It seems like a classic case of differing definitions leading to talking past each other. Camp A uses a broad, mapping-based definition of computation, while Camp B insists on a narrow, representational one. The user mentions suggestions from their group: splitting "computes" into three senses and debating the necessity of digital computation's discrete nature.

  The user's own hypothesis is that it's mostly verbal disagreement and partly about implementation criteria. They wonder if showing every system implements something or that implementation is causal would clarify things. They want to know what progress looks like or if they should drop the question.

  I recall philosophical debates on computation. Putnam's multiple realizability supports Camp A, but critics like Searle and Piccinini emphasize specific causal structures. Fodor's language of thought aligns with Camp B. The user's group is sophisticated, referencing LessWrong and neuroscientists, so they're familiar with these ideas.

  Breaking down the senses of "computes" could help: descriptive (A), constitutive (B), and explanatory (both care). The digital vs. analog aspect is secondary. The deeper issue might be about natural kinds: is computation a real category in nature or a tool we impose?

  Empirical work like neural coding research could inform this, but it doesn't resolve the philosophical split. Progress might mean accepting different questions and clarifying terms. If they stop expecting a single answer, they can focus on productive discussions like when computational explanations work best.

  The user might also be tired of the debate and seeking closure. Acknowledging the stalemate and shifting focus could be the solution. They need validation that both sides have points but the question might be ill-posed for a definitive answer.
answer: |-
  Here’s a diagnosis of the impasse, why it persists, and what genuine progress might look like—framed around your hypothesis:

  ### The Core Impasse: Two Questions Masquerading as One
  1. **Metaphysical/Constitutive Question** (Camp B's focus):  
     *"Is computation a* fundamental causal mechanism *in the brain's operation, akin to how a CPU executes instructions?"*  
     This requires a narrow, restrictive definition of "computation" (rule-governed, representational, medium-independent processes). B fears that without this, "computation" loses explanatory power and becomes vacuous.

  2. **Descriptive/Interpretive Question** (Camp A's focus):  
     *"Can we* usefully model *brain functions using computational frameworks, regardless of underlying implementation?"*  
     This uses a broad, abstract definition (any system mapping to a formal automaton). A fears that B's narrow view ignores the power of computational *descriptions* in neuroscience.

  **The shouting arises because both camps are answering different questions while using the same sentence "The brain is a computer."** Camp A hears it as "Computational models are useful"; Camp B hears it as "The brain fundamentally works like a Turing machine."

  ### Why Your Hypothesis is Largely Correct (with a Nuance)
  - **Verbal/Aims Conflict (≈80% of the stalemate):**  
    The disagreement is primarily about **what we want "computation" to do** in our explanations.  
    - Camp A prioritizes *predictive/modeling power* (a computational *description* can capture input-output behavior).  
    - Camp B prioritizes *causal-mechanical explanation* (computation as a *real process* in wetware).  
    **Pushing back:** Your "constitutive vs. descriptive" split is spot-on—but the *reason* it matters is **explanatory ambition**. B wants computation to explain *how cognition emerges*; A is satisfied if it predicts *that it occurs*.

  - **Implementation Criteria (≈20%, but pivotal):**  
    The deeper crux is whether **computation is a *natural kind_*** or just an **interpretive lens**.  
    - If *every physical system implements every computation* (Putnam-Triviality), then Camp B's narrow view collapses—computation isn't "in" the system; it's imposed by us.  
    - If there's a **non-arbitrary, causal-structural criterion** for implementation (e.g., Piccinini's *functional mechanisms*, or Fodor's *syntactic structures*), then Camp B's view holds weight.  
    **Your challenge stands:** Resolving this requires either:  
    (a) Proving trivial implementation (making B's view "optional"), *or*  
    (b) Finding a formal criterion tying implementation to causal structure *without* smuggling in representational intent.  
    **So far, (b) remains elusive.** No consensus exists on non-arbitrary implementation criteria that aren't either trivially satisfiable or dependent on observer interests.

  ### The Digital vs. Analog Red Herring
  The "discrete/error-correcting" debate is secondary. Both camps agree the brain isn't *digitally engineered* like a PC. The real issue is whether **rule-based symbolic manipulation** (digital or analog) is essential to cognition. Camp B says yes; Camp A says it's sufficient to model dynamics *as if* it were symbolic.

  ### What Counts as Progress?
  1. **Adopt the Three-Way Split Explicitly:**  
     Force every claim about "computation" to specify:  
     - **Description:** "We can model X computationally."  
     - **Implementation:** "X physically instantiates computation Y."  
     - **Explanation:** "Describing X as computing Y *explains* its behavior."  
     *This ends 50% of the fights by clarifying stakes.*

  2. **Focus on the Explanatory Gap:**  
     Shift to: **"When does a computational description *explain* (not just describe) a neural phenomenon?"**  
     - Camp B: Only when you identify *representations* and *rules* implemented in causal structure.  
     - Camp A: When the model predicts/controls behavior better than alternatives.  
     *This isolates the genuine disagreement.*

  3. **Seek Empirical Constraints:**  
     Progress might come from neuroscience itself:  
     - If we find neural mechanisms that **unambiguously implement discrete state transitions** (e.g., dendritic spikes acting as logic gates), Camp B gains ground.  
     - If brain functions **systematically resist discretization** (e.g., continuous attractor networks dominating cognition), Camp A's broad view strengthens.  
     *Example:* Debates over the neural code (rate vs. temporal coding) directly test computational hypotheses.

  4. **Accept the Stalemate (Wisely):**  
     This argument *won't end* because it's fundamentally about:  
     - **What counts as an "explanation"** (mechanistic vs. instrumentalist).  
     - **Whether intentionality/representation is intrinsic to computation.**  
     *If the group can agree this is a philosophical impasse—not empirical—they can move to more productive questions, like: "Which computational frameworks best predict neural dynamics?"*

  ### Bottom Line
  Your hypothesis is correct: **≈80% verbal/aims conflict, ≈20% unresolved implementation metaphysics.** The dispute dissolves if you accept that "The brain is a computer" is shorthand for distinct claims. Progress requires either:  
  - A formal proof resolving implementation triviality (unlikely soon), or  
  - Shifting to a concrete empirical benchmark (e.g., "Does this computational model *explain* a lesion deficit?").  

  Until then, the sighing is rational. The most honest progress is admitting: **"Computational descriptions are indispensable tools, but whether the brain 'truly computes' depends on what you mean by 'truly'."** Redirect energy to *which* computations matter—that's where neuroscience lives.
