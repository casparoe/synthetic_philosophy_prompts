prompt: |-
  in my metaethics seminar we've just finished expressivism, and the textbook introduces it with the boo/hurrah picture: saying that murder is wrong isn't describing anything, its more like shouting boo at murder or pulling a face at it, and the moral sentence is just the verbal version of the boo. then it does the embedding cases -- if lying is wrong then getting your little brother to lie is wrong -- points out you can't put a boo in an if-clause, and closes the case on expressivism in about a page. my seminar leader said thats the crudest possible version of the view, but never said what would survive being made less crude.

  i want an audit of the analogy rather than another summary of the problem. the analogy is being used to license a specific conclusion, roughly: the attitude theory cant handle embedded moral sentences, so its dead. tell me how much of that work the analogy can actually do.

  give me:
  1. a correspondence table, columns: source_bit (the thing in the boo picture), target_bit (the thing in moral talk it's meant to stand for), holds (yes / no / only if you assume the conclusion), note. cover the boo itself, the booer, the audience, the pulling of the face, the boo's lack of truth-value, the fact that a boo has no internal structure, and whatever else the picture quietly supplies.
  2. a break table, columns: break, matters_for_the_conclusion (yes/no), which_side_it_helps (expressivist / the textbook / neither). i especially want: is the picture sliding between expressing an attitude and reporting that you have one, and is that slide doing the textbooks work for it? does a boo's having no logical parts tell us anything about a sentence that has parts? and is it assuming that whatever carries the meaning has to be the same kind of thing as the act of uttering it?
  3. the verdict: does the conclusion survive the breaks, or was the analogy carrying it the whole time? then a better analogy if there is one -- something in the neighbourhood of the same move turning up in different games, or a tool doing different jobs -- and say whether that one actually dodges the embedding problem or just moves it somewhere else. also whether the textbook is refuting a view anyone actually holds.

  finish with a short json blob: {"conclusion_survives": "yes|no|qualified", "carried_by_the_analogy": true, "worst_break": "", "better_analogy": "", "what_the_better_one_still_cant_do": ""}

  no need to walk me through the whole literature, i know the standard moves. tight is fine.
reasoning: |-
  We are auditing the "boo/hurrah" analogy for expressivism. The analogy is used to argue that expressivism cannot handle embedded moral sentences (like conditionals) because you cannot embed a boo in an if-clause. We want to see how much of that argumentative weight the analogy is carrying.

  1. **Correspondence Table**: We list elements of the analogy (source_bit) and what they correspond to in moral talk (target_bit). We note whether the correspondence holds (yes, no, or only if we assume the conclusion) and add a note.

     Source Bit         | Target Bit                     | Holds | Note
     -------------------|--------------------------------|-------|------
     Boo itself        | Utterance of moral sentence    | No    | A boo is a non-linguistic act, while a moral sentence is linguistic and structured.
     Booer             | Speaker                        | Yes   | The person performing the act.
     Audience          | Listener                       | Yes   | The recipient of the act.
     Pulling a face    | Non-verbal expression          | No    | The textbook uses this as analogous, but it's also non-linguistic and unstructured.
     Boo's lack of truth-value | Moral sentence's lack of truth-value | Only if you assume the conclusion | Expressivists do not necessarily deny moral sentences have truth-value (e.g., quasi-realism), but the analogy assumes they do.
     Boo has no internal structure | Moral sentence has internal structure | No | Moral sentences have logical structure (e.g., subject-predicate) that a boo lacks.
     The act of booing | The act of uttering a moral sentence | Partially | Both are acts, but the moral utterance is a speech act with conventional structure.

  2. **Break Table**: We identify where the analogy breaks and whether it matters for the conclusion (that expressivism cannot handle embedding). We note which side it helps.

     Break                                                                 | Matters for Conclusion | Which side it helps | Explanation
     ----------------------------------------------------------------------|------------------------|----------------------|------------
     Booing is non-linguistic; moral sentences are linguistic and structured. | Yes | The textbook | The textbook uses the lack of structure in booing to argue that moral sentences, if like boos, cannot embed. This break matters because embedding is a linguistic phenomenon.
     Booing expresses an attitude; moral sentences might also report an attitude. | Yes | The textbook | The analogy slides between expressing and reporting. Expressivists typically say moral sentences express, not report, attitudes. But the textbook might be conflating the two to make embedding seem impossible for expressivism.
     Booing has no truth-value; expressivism might allow for moral sentences to have truth-value. | Yes | The textbook | The textbook assumes expressivism denies truth-value, but some expressivists (quasi-realists) grant a deflationary truth-value. The break matters because if moral sentences can have truth-value, they might embed like other truth-apt sentences.
     The act of booing is atomic; moral sentences have logical parts. | Yes | The textbook | This break is central: embedding requires internal structure. The analogy assumes that if the meaning is expressive, then it must be unstructured, which is not necessarily true.

  3. **Verdict**:
     - The conclusion that expressivism cannot handle embedded sentences is carried by the analogy because the analogy is set up to be crude and unstructured. The breaks in the analogy (especially the lack of structure and the non-linguistic nature) are doing the work for the textbook. However, the embedding problem is a real challenge for expressivism, but more sophisticated versions (like Blackburn's quasi-realism) attempt to handle it by providing a semantics for moral sentences that allows for compositionality. So the conclusion does not survive the breaks entirely: the analogy is too crude and refutes a straw man. The textbook is refuting a view that no sophisticated expressivist holds.

     - A better analogy might be to think of moral sentences as having a dual nature: they express an attitude but also have a propositional content that can be embedded. Blackburn, for example, uses the analogy of "hooray" and "boo" but then develops a more complex system (the logic of attitudes) to handle embedding. Alternatively, one might think of moral language as like a language of commands (but commands also have embedding issues). A better analogy might be to think of moral sentences as having a propositional content that is tied to an attitude, but the propositional part can be embedded. However, the embedding problem remains a challenge: how to account for the meaning of an embedded moral sentence (like in a conditional) in terms of the attitude expressed. Sophisticated expressivists try to solve this by distinguishing between the attitude expressed by the whole sentence and the contribution of the embedded part.

     - The textbook is refuting a crude version of expressivism that no one actually holds. Modern expressivists (like Blackburn, Gibbard) have developed complex theories to handle embedding.

