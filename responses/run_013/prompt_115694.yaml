answer: |-
  ### Correspondence Table
  | source_bit             | target_bit                          | holds       | note                                                                 |
  |------------------------|-------------------------------------|-------------|----------------------------------------------------------------------|
  | the boo itself         | the moral utterance                 | no          | Boos are non-linguistic; moral sentences are structured linguistic acts. |
  | the booer              | the speaker                         | yes         | Both involve an agent performing the act.                            |
  | the audience           | the listener                        | yes         | Both have a recipient of the act.                                    |
  | pulling a face         | non-verbal expression of attitude   | partially   | Captures expressiveness but not the linguistic nature.               |
  | boo's lack of truth-value | moral sentence's lack of truth-value | only if you assume the conclusion | Assumes expressivism denies truth-aptness; quasi-realism complicates this. |
  | boo has no internal structure | moral sentence's logical structure | no          | Moral sentences have syntax (e.g., "if...then"); boos lack compositionality. |
  | booing expresses an attitude | uttering "wrong" expresses disapproval | yes         | Core expressivist claim.                                             |
  | boo is atomic          | moral sentence is atomic            | no          | Moral sentences embed; boos cannot.                                  |

  ### Break Table
  | break                                                                 | matters_for_the_conclusion | which_side_it_helps | explanation                                                                 |
  |-----------------------------------------------------------------------|----------------------------|---------------------|-----------------------------------------------------------------------------|
  | Slides between **expressing** an attitude (booing) and **reporting** an attitude ("I disapprove") | yes | textbook | Textbook exploits ambiguity to make expressivism seem reducible to non-linguistic acts. |
  | Assumes meaning-bearer must mirror the **act-type** (booing ≈ utterance) | yes | textbook | Falsely implies that if the act is expressive, the sentence can't have logical structure. |
  | Boo's lack of structure ≠ moral sentence's structure | yes | textbook | Uses the boo's simplicity to "prove" moral sentences can't embed. |
  | Ignores **conventionalization** of language | yes | expressivist | Real moral language uses shared syntactic rules; boos lack conventions. |
  | Treats all attitudes as **atomic** | yes | textbook | Moral attitudes can be complex/compositional; boos are monolithic. |

  ### Verdict
  **Conclusion survival**: The conclusion ("expressivism can't handle embedding") **does not survive** the breaks. The analogy is doing all the heavy lifting by:
  - Equating moral sentences with non-linguistic acts (ignoring linguistic conventions).
  - Assuming expressiveness precludes logical structure (a non sequitur).
  - Refuting a straw man: No serious expressivist (e.g., Blackburn, Gibbard) endorses the "boo/hurrah" model. Sophisticated versions (quasi-realism, norm-expressivism) address embedding via propositional attitudes or complex semantics.

  **Better analogy**: **A chess move in a rule-governed game**.  
  - *Source*: Saying "lying is wrong" ≈ moving a pawn (expresses strategy but follows syntactic rules).  
  - *Embedding*: "If lying is wrong..." ≈ a conditional strategy ("If opponent moves pawn, then...").  
  - *Dodges embedding?* Partially. It allows for structured attitudes (e.g., accepting norms conditionally). But it **still struggles** with truth-apt embeddings (e.g., "If lying is wrong, then Alice believes it") that require cognitive content. The problem shifts but isn't solved.

