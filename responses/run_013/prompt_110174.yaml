  Below is a one-page flowchart structured as a decision tree for Molyneux's question. Each node poses a question about the case itself, and the leaves represent distinct philosophical/scientific positions. The tree is designed to be self-contained for a smart reader unfamiliar with the literature. 

  ---

  ### **Molyneux's Question Flowchart: Can a Blind-from-Birth Person Recognize Shapes by Sight After Restoration?**  

  #### **Start → Node 1: What is the subject being asked to do?**  
  - **A. Just tell the cube and sphere apart visually (distinguish at all)**  
  - **B. Name or sort them correctly (match tactile categories)**  
  - **C. Shape their hand to grasp the correct object (visually guided action)**  

  #### **→ Node 2 (from A, B, or C): Do visual and tactile shape share a common format?**  
  *(i.e., Is shape the same property presented in both senses?)*  
  - **Yes → Node 3**  
  - **No → Node 4**  

  #### **→ Node 3 (from "Yes" at Node 2): If the subject fails, where is the failure?**  
  *(Assuming common format exists)*  
  - **A. In visual perception (eyes/brain not processing shape yet)**  
  - **B. In cross-modal linking (can see, but no access to tactile concepts)**  
  - **C. Not a failure—vision is functional, and transfer works**  

  #### **→ Node 4 (from "No" at Node 2): Can real sight-restoration cases settle this?**  
  *(i.e., Is this empirical or conceptual?)*  
  - **Yes → Node 5**  
  - **No → Node 6**  

  #### **→ Node 5 (from "Yes" at Node 4): What do sight-restoration cases show?**  
  *(Based on actual evidence)*  
  - **A. Subjects fail at all shape tasks → Leaf 7**  
  - **B. Subjects succeed at action (C) but not naming/sorting (B) → Leaf 8**  
  - **C. Subjects succeed at 2D shapes but fail at 3D solids → Leaf 9**  

  #### **→ Node 6 (from "No" at Node 4): Why can’t cases settle it?**  
  *(Conceptual reasons)*  
  - **A. "Shape" means different things in vision/touch → Leaf 10**  
  - **B. The question conflates multiple abilities → Leaf 11**  

  ---

  ### **Leaves (Positions)**  
  1. **Classic No: Must learn correspondence**  
     - *Path:* Node 1 (A or B) → Node 2 (Yes) → Node 3 (B)  
     - He sees shapes but must learn to link vision to touch.  

  2. **Radical No: No common property, no transfer**  
     - *Path:* Node 1 (A or B) → Node 2 (No) → Node 4 (Yes or No) → Node 5 (A) *or* Node 6 (A)  
     - Vision and touch represent fundamentally different properties; no shared "shape" to recognize.  

  3. **Yes, innate geometry**  
     - *Path:* Node 1 (A or B) → Node 2 (Yes) → Node 3 (C)  
     - Common format exists; he reasons using innate geometric knowledge.  

  4. **Yes, innate (strong)**  
     - *Path:* Node 1 (C) → Node 2 (Yes) → Node 3 (C)  
     - Grasping succeeds immediately due to innate spatial-motor wiring.  

  5. **Space yes, shape no**  
     - *Path:* Node 1 (A or B) → Node 2 (Yes) → Node 3 (B)  
     - He intuits spatial relationships (e.g., distance) but not object shapes.  

  6. **Two-visual-streams: Action without recognition**  
     - *Path:* Node 1 (C) → Node 2 (No) → Node 4 (Yes) → Node 5 (B)  
     - He can grasp correctly (dorsal stream) but cannot name/sort shapes (ventral stream).  

  7. **Deflationary: No single question**  
     - *Path:* Node 1 (Any) → Node 2 (No) → Node 4 (No) → Node 6 (B)  
     - The question fragments into distinct tasks (distinguishing, naming, acting).  

  8. **Empirical failure: Vision not ready**  
     - *Path:* Node 1 (Any) → Node 2 (Yes) → Node 3 (A)  
     - Early failures stem from underdeveloped vision, not conceptual gaps.  

  9. **Split: 2D yes, 3D no**  
     - *Path:* Node 1 (A or B) → Node 2 (Yes) → Node 3 (B) + Node 4 (Yes) → Node 5 (C)  
     - Innate common format covers 2D figures (e.g., squares) but not 3D solids.  

  ---

  ### **Key Notes**  
  - **Unseparated Leaves:** The tree cannot distinguish between **Radical No (Leaf 2)** and **Empirical failure (Leaf 8)**. If vision is not functional (Node 3A), failure could be misattributed to a lack of common format (Node 2 "No") instead of sensory recovery.  
  - **Empty Combination:** **Node 2 "No" → Node 4 "No" → Node 6 "A"** (conceptual failure due to distinct shape formats) lacks a well-known position. This is likely empty because it implies vision/touch have *no* overlap in spatial representation (incoherent with basic neuroscience) and is philosophically unattractive.  
  - **Weakest Node:** **Node 4** (empirical vs. conceptual) does little separating work. Most paths after Node 2 "No" converge on Radical No (Leaf 2) or Deflationary (Leaf 7). If empirical evidence showed consistent success/failure patterns (e.g., action always works), Node 5 would be split further, and Node 4 could be removed.  

  This tree isolates disagreements in the case structure itself, avoiding historical name-dropping. Print and discuss!
