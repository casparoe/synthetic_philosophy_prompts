prompt: |-
  I sit on the ethics advisory board of a mid-sized space agency — we're the human-side review, not the engineers, so missions come to us before they get approved. Next week we're taking up a proposal from a private partner: a first crewed settlement on Mars, six people, one-way, with a charter that commits the settlement to begin warming the planet within fifty years of landing so later arrivals can live outside. They want our sign-off. They've also written in a clause they call the Legacy Clause, which binds the settlers and their descendants in perpetuity to leave a designated region of the planet untouched, exactly as found, as a kind of memorial. The settlers sign it freely, so the company says it's fine, and they've set up a Return Fund that anyone at the settlement can draw on to come home, which they say keeps consent ongoing.

  Half the board thinks the whole thing is a stunt and the Legacy Clause is empty because you can't bind people who don't exist yet. The other half thinks the one-way mission is the real problem — the adults can take the risk, but any kid born there had no say, and we'd be handing them a planet we've already started cooking plus a promise their great-grandparents made on their behalf. And someone pointed out the Return Fund has no ship behind it yet, which makes me wonder what a right of exit is worth when theres nothing to exit on.

  Draft the short opinion I'll circulate before Thursdays meeting. I want a concrete recommendation — approve, reject, or approve with conditions — and if it's conditions, spell them out and say on what timeframe. Don't just restate the Outer Space Treaty stuff, everyone knows that. Engage the strongest version of the side you come out against, and tell me honestly which single feature of the case is doing the most work in your reasoning.
reasoning: |-
  Okay, let me approach this step by step. The user is on an ethics board reviewing a Mars settlement proposal with several contentious elements. The key issues are: the one-way nature of the mission, the Legacy Clause binding descendants, the Return Fund without existing transport, and terraforming commitments. 

  First, I need to identify the core ethical tensions. The adults' consent seems clear, but future generations present a problem - they'll inherit both the terraforming burden and an unchangeable memorial. The Return Fund looks questionable without actual ships, making "exit" theoretical. And the Legacy Clause attempting to bind descendants feels legally and practically shaky.

  The strongest counterargument would defend the settlers' autonomy and the project's vision. I should engage that honestly: if we believe adults can make radical choices, and if the Return Fund becomes real, maybe it's ethical to proceed. But that feels insufficient given the permanence of the constraints on unborn people.

  Hmm... the most concerning element might be the Legacy Clause's perpetuity combined with terraforming duties. Asking descendants to simultaneously transform a planet while preserving part of it unchanged creates an inherent conflict. And with no way to amend the clause, it becomes intergenerational coercion.

  For recommendations, outright rejection seems too absolute given the project's potential value. But approval needs serious guardrails. Key conditions should include: sunsetting the Legacy Clause after one generation, requiring funded ships (not just money) for return, and making the terraforming commitment aspirational rather than binding. The timeframe should be tied to verifiable milestones before launch.

  The single most persuasive factor in this reasoning is the Legacy Clause's perpetuity. It transforms a symbolic gesture into an undemocratic burden on future Martians who had no voice in its creation. That's the pivot point - fix that, and other issues become more manageable.
answer: |-
  ## Pre-Meeting Opinion: Mars Settlement Proposal Review

  **TO:** Ethics Advisory Board  
  **FROM:** [Your Name]  
  **RE:** Private Partner Mars Settlement Proposal - Recommendation  
  **DATE:** [Date Before Meeting]

  **Recommendation:** **Reject in current form. Approval contingent on significant modifications.** (Specific conditions and timeframe detailed below).

  **Engaging the Strongest Counter-Argument:** The most compelling case *for* approval rests on robust adult autonomy and the project's pioneering vision. Proponents argue that informed, consenting adults have the fundamental right to undertake extraordinary risks for profound purposes, including establishing a new branch of humanity. They contend the Return Fund (once operational) provides a continuous "off-ramp," preserving consent for current settlers. Binding future generations via the Legacy Clause, they suggest, is no different in principle than any civilization bequeathing cultural monuments or environmental protections to descendants, embedding core values at the founding. Terraforming is framed as the *purpose* of the settlement, not an imposition, fulfilling humanity's potential. To deny this, the counter-argument concludes, is undue paternalism stifling a bold, potentially species-defining endeavor chosen freely by capable pioneers.

  **Critical Analysis & Key Concerns:**
  1.  **The Hollow "Right of Exit":** The most ethically corrosive flaw is the **Return Fund without guaranteed, funded, and maintained return capacity.** Promising a "right to return" without a tangible, operational ship (or concrete, funded plans for building and maintaining one) is a fiction. It transforms a fundamental liberty into a theoretical voucher. This undermines *ongoing* consent for initial settlers facing unforeseen hardship and renders the consent argument for future generations entirely meaningless. A child born on Mars cannot "consent" to stay if leaving is physically impossible, regardless of a monetary fund.
  2.  **Intergenerational Tyranny of the Legacy Clause:** Binding *in perpetuity* descendants who had no say to preserve a specific region, regardless of future knowledge, needs, or cultural evolution, is ethically untenable. While establishing core values is legitimate, perpetuity clauses deny future generations the basic autonomy to define their own society and relationship with their environment. It risks creating an unresolvable conflict: settlers tasked with aggressively altering the planet are simultaneously forbidden from altering a specific part of it, forever. The company's "freely signed" argument applies only to the first generation.
  3.  **The Burden of the Unchosen Future:** Children born on Mars inherit a double burden they never consented to: a commitment to actively warm their own environment (with potentially unforeseen consequences) *and* an immutable prohibition on utilizing a specific territory. The "risk" for them isn't just the harsh environment; it's the irrevocable constraints imposed by their ancestors and an Earth-based corporation.
  4.  **The Terraforming Commitment:** While potentially justifiable as a mission goal, its 50-year binding nature on descendants, coupled with the Legacy Clause, creates a profound ethical tension – aggressively altering the planet while permanently freezing a piece of it – that future Martians must navigate without having set these conflicting priorities.

  **The Single Most Consequential Feature:** The **combination of the binding Legacy Clause in perpetuity and the lack of a *real*, operational return capacity** is the core ethical failure. The perpetuity clause attempts to impose an unchangeable Earth-centric value (preservation-as-memorial) on an unborn Martian society, denying them self-determination. The illusory Return Fund strips the "consent" argument of all substance, trapping future generations both physically and under the weight of this inherited obligation. This creates a foreseeable scenario of intergenerational injustice.

  **Recommended Conditions for Potential Approval:** The proposal requires fundamental restructuring:
  1.  **Sunset the Legacy Clause:** Replace the "in perpetuity" obligation with a **time-limited commitment (e.g., 100 years)** or a requirement for **ratification by the Martian-born population once they reach a defined threshold of self-governance capability** (e.g., independent sustainability, established governance structures). The clause must allow for future Martian agency.
  2.  **Materialize the Right of Exit:** **Require the fully funded construction, testing, and placement of at least one certified, maintained return vehicle (with life support) in Mars orbit or on the surface *prior to the first crew launch*.** The Return Fund must explicitly cover the *operational costs* of maintaining this capability and funding launches for returnees. Annual independent audits of the vehicle's status and the Fund's sufficiency must be mandated.
  3.  **Reframe the Terraforming Commitment:** Make the 50-year terraforming goal **aspirational and subject to ongoing ethical and scientific review by a body *including* Martian representatives** once such representation is feasible, rather than a binding charter clause on descendants.
  4.  **Enhanced Oversight & Future Agency:** Establish an independent, international (including future Martian) oversight body with authority to review and, if necessary, *amend* the settlement's founding constraints (Legacy, Terraforming timelines) based on changing circumstances, scientific understanding, and the expressed will of the Martian population as it develops.

  **Timeframe for Conditions:** Conditions 1 (Sunset/Ratification mechanism) and 3 (Reframe Terraforming) can be finalized in the revised charter before Board re-submission. **Condition 2 (Operational Return Vehicle) is non-negotiable and must be verifiably completed *before* the Ethics Board grants final mission approval for crew launch.** Evidence of funded construction contracts, timelines, and vehicle specifications must be submitted for review at least 12 months prior to the proposed launch date.

  **Conclusion:** The vision is profound, but the current proposal imposes unacceptable, unchangeable burdens on the unborn while failing to secure the fundamental liberty (a real right of return) necessary to make the initial consent meaningful over time. The Legacy Clause's perpetuity combined with the phantom Return Fund creates a foreseeable ethical disaster for future Martians. Approval cannot be granted without binding, verifiable solutions to these core intergenerational justice issues, particularly the tangible right of exit. I recommend rejecting the proposal as submitted and outlining these essential modifications as prerequisites for reconsideration.
