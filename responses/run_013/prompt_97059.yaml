prompt: |-
  I'm a novelist, and I've spent the better part of a year trying to write a character who is genuinely free — not merely unpredictable — and I keep running up against a pattern I have no word for, which I suspect is not only a novelist's problem. It began with a nature programme about a solitary wasp that provisions a burrow with prey, and, before dragging the prey inside, goes down first to inspect the burrow. While the wasp was below, the presenter nudged the prey a few inches away; the wasp emerged, dragged it back, and inspected again. He repeated this, I think, some forty times, and each time the wasp ran the whole sequence from the beginning; it never simply carried the prey in. What struck me was not the insect's stupidity but the shape of it: the animal had a repertoire, and the repertoire had no exit. So I began collecting human versions. A colleague who, whatever the objection, replies that she has considered it and stands by her view — the same sentence, the same cadence, whether the objection is trivial or devastating. A committee I used to sit on that had a rule for everything, including a rule for suspending the rules, so that even its departures from procedure were procedural; you could never point to the moment it had been flexible, only to a higher rule that had licensed the flexibility. And, most troubling to me as a writer, the suspicion that my supposedly free character is merely a longer routine — that when she changes her mind it is because a different script has come up, and the script for changing her mind is as fixed as the first.

  So: is there a name for this, or a literature? I don't want a bare label. I want to know what exactly the thing is and where its edges lie. In particular: (i) how one tells it apart from behaviour that is merely predictable — a sensible person would also re-inspect the burrow, and predictability alone cannot be the mark; (ii) whether the literature distinguishes the first-order case, where an agent is plainly stuck in a routine, from the second-order worry, where the agent varies its behaviour endlessly but always in the same way of varying, so that apparent flexibility is only a nested rigidity — and whether anyone has argued that the second-order case is inescapable, that there is no getting outside it from within; and (iii) what, if anything, this has to do with free will, since the whole reason I care is that I wanted to write a character who has some. If there is no established term, coin one, define it, and tell me which of the nearest existing concepts it must be distinguished from, and why none of them quite does the job. I have a hazy sense that a philosopher of mind once used a wasp as the emblem of something in this vicinity, but I may be conflating it with something else entirely.
reasoning: |-
  Okay, the user is a novelist struggling to create a "genuinely free" character, not just unpredictable. They've encountered a pattern they can't name, inspired by a wasp in a nature documentary that rigidly follows a sequence without adapting. They've noticed similar human behaviors: a colleague who always responds the same way regardless of the objection, a committee with rules that even govern exceptions, and a fear that their character's freedom might just be a more complex script. 

  The user wants to understand this phenomenon deeply. They're not looking for just a label but a conceptual framework. Their questions are precise: (i) how to distinguish this from mere predictability, (ii) whether there's a difference between obvious rigidity and nested rigidity (where flexibility itself is scripted), and (iii) how this relates to free will. They also recall a philosopher using a wasp as an example but can't place it.

  Hmm. The wasp story is classic ethology—Tinbergen's experiment. That's a solid anchor. The key is *procedural entrenchment*: behavior locked in steps, unable to skip or adapt even when useless. For humans, it’s not just habits but systems (like the committee) where even flexibility is rule-bound. 

  For (i), predictability isn’t the issue; a rational actor might reinspect too. The difference is *affordance blindness*—not seeing shortcuts because the system overrides context. The colleague example is perfect: same response to trivial or devastating objections. That’s not predictability; it’s a closed loop.  

  For (ii), the nested rigidity is crucial. First-order is simple repetition (wasp). Second-order is meta-rigidity: the colleague’s "I’ve considered it" or the committee’s "rule for breaking rules." It’s procedural all the way down. Philosophers like Wittgenstein (rule-following paradox) or Dennett (competence without comprehension) touch on this. The user’s fear—that character depth might just be layered scripts—hits here.  

  For (iii), free will ties in painfully. Compatibilists (e.g., Frankfurt) might say the colleague acts freely if she identifies with her stance, but if she’s *incapable* of doubt, is it will or wiring? The novelist’s challenge: freedom requires *responsiveness*, not randomness. Genuine choice needs interruption points, like the committee pausing rules because "this feels wrong," not because a rule allows it.  

  Naming it: *Procedural Entrenchment* works. Must distinguish from *habit* (which can be broken) or *compulsion* (pathological). This is structural—the "how" is fixed, blocking adaptation. The philosopher they half-recall? Likely Dennett on "sphexishness" or Wittgenstein’s rule-following.  

  For the novelist: To show freedom, let the character *break* their own patterns *without a pre-scripted reason*. Not "she changes her mind because her rule says to when X," but because she *stops* and says, "This isn’t working." The committee example’s horror is the lack of such pauses. Freedom lives in the interstices between procedures.
answer: |-
  What you're describing is a profound and unsettling pattern—one that cuts across biology, psychology, and philosophy. It has no single perfect name, but the closest established concept is **Procedural Entrenchment** (or *Cognitive Entrenchment* when applied to mental routines). However, this needs careful definition and distinction from related ideas to capture what haunts you. Let's dissect it systematically.

  ### Core Definition: Procedural Entrenchment
  **Procedural Entrenchment** is *the rigid adherence to a sequence of actions or decision-rules, where the structure itself lacks mechanisms for context-sensitive interruption, shortcutting, or meta-evaluation*. The "entrenchment" lies not in repetition itself, but in the *inability to exit the procedural framework* even when:
  - Steps become redundant (wasp re-inspecting after prey displacement)
  - Inputs vary dramatically (colleague's rote response to trivial vs. devastating objections)
  - Flexibility is simulated via nested rules (committee's "meta-procedures")

  Its hallmarks are **affordance blindness** (failing to perceive opportunities to deviate) and **subroutine encapsulation** (treating the entire sequence as an indivisible unit).

  ---

  ### Addressing Your Questions

  #### (i) Distinguishing from Mere Predictability
  Predictability is a *symptom*, not the core issue. What separates entrenchment from rational consistency:
  - **The Rational Actor**: Reinspects the burrow *if new risks are plausible* (e.g., after a landslide). They assess context. The entrenched wasp *cannot not reinspect*—even when context screams irrelevance.
  - **The Entrenched Actor**: Exhibits *pathological invariance*. Your colleague's identical response to minor/style objections vs. fatal/flaw objections reveals this. Predictability is circumstantial; entrenchment is architectural. A predictable person might always drink tea at 3 PM but can skip it during a crisis. An entrenched one follows the ritual even if the house is burning.

  #### (ii) First-Order vs. Second-Order Entrenchment
  - **First-Order**: Surface-level rigidity (wasp's fixed sequence). Easy to spot: behavior repeats identically despite changing inputs.  
  - **Second-Order (Meta-Entrenchment)**: Flexibility is "proceduralized." Variation exists, but only *within a higher, immutable rule-set*. Your committee example is perfect: "Suspending Rule X" invokes "Meta-Rule Y," making deviation just deeper compliance. Your character's "mind-change script" is this: even her rebellion follows a prewritten template.  

  **Is it inescapable?** Philosophers debate this fiercely:
  - **Wittgenstein**'s rule-following paradox (*Philosophical Investigations*) hints that *all* behavior might be rule-bound. If you deviate from Rule A by following Rule B, what justifies Rule B? This suggests meta-entrenchment is inevitable.
  - **Daniel Dennett** counters with **Competence Without Comprehension** (using your wasp!): Systems can *appear* flexible by layering simple routines, without true understanding. But he argues humans *can* achieve genuine comprehension via self-reflection.
  - **Existentialists** (Sartre, de Beauvoir) insist we *can* rupture entrenchment through **radical choice**—acts not justified by prior rules but creating new values. Yet this borders on mysticism.

  #### (iii) Link to Free Will
  This is why Procedural Entrenchment terrifies you as a novelist: it threatens **agency**.  
  - **Compatibilists** (e.g., Frankfurt, Dennett) define free will as acting in accordance with one's "deep self." But if the "self" is just nested routines (like your colleague), this collapses.  
  - **Libertarians** demand uncaused causes. Entrenchment is the antithesis—behavior is *over*-caused by internal programs.  
  - **The Key Insight**: Genuine freedom requires **interruptibility**. A "free" character isn't unpredictable; she can *suspend her own algorithms*. When your entrenched colleague speaks, it's a subroutine executing. A free character might hear a devastating objection, pause mid-sentence, and say *"I... don't know anymore."* That stammer is the sound of escaping entrenchment.  

  ---

  ### Why Existing Terms Fall Short
  - **Habit**: Too weak. Habits can be broken consciously; entrenchment resists meta-awareness.  
  - **Algorithmic Behavior**: Describes the wasp but misses the *human* tragedy of simulated flexibility.  
  - **Compulsion**: Pathologizes it; entrenchment can be socially functional (your committee).  
  - **Heuristic**: Often adaptive; entrenchment is maladaptive rigidity.  
  - **Sphexishness** (from Dennett's wasp example): Captures first-order rigidity but not second-order meta-entrenchment.

  ---

  ### A Philosopher’s Wasp? 
  You’re recalling **Daniel Dennett**. In *Elbow Room* and *Freedom Evolves*, he uses Tinbergen’s wasp experiment (identical to your documentary) to illustrate **"sphexishness"**—blind, mechanistic compliance. For Dennett, humans avoid this by evolving layered competences. But your insight about *simulated flexibility* (second-order entrenchment) pushes beyond his analysis.

  ---

  ### Guidance for Your Novel
  To write "genuine freedom," give your character:
  1. **Meta-Awareness**: Moments where she *notices* her own scripts ("Why do I always say that?").  
  2. **Interruptibility**: Let her abandon a procedure mid-flow (e.g., stops debating, says "This feels wrong").  
  3. **Unscripted Gestures**: A sigh, a postponed decision, or silence where a rule demands speech.  
  4. **Rule Generation**: Not just following/internalizing rules, but *creating* new ones in real-time to meet novel contexts.  

  The horror of Procedural Entrenchment isn’t robotic repetition—it’s the *performance of freedom* within an invisible cage. Your wasp isn’t stupid; it’s an icon of how easily agency becomes ritual. What you’re naming is the shadow at the heart of all rule-bound systems: biological, bureaucratic, or psychic. To write freedom, write the moment the cage becomes visible—and then, the wrenching, unguaranteed effort to bend its bars.
