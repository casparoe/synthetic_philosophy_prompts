answer: |-
  ### The practice, as best I can tell (150 words)
  Real-world institutions systematically deviate from pure expected monetary value (EMV) maximization by capping potential losses (insurance liability limits, casino maximums) and demanding premiums above expected loss (insurance loading). Crucially, they refuse gambles with infinite or extreme EMV if the tail risk is catastrophic, like the St. Petersburg lottery. This is puzzling because the EMV rule – sum p_i * x_i – is foundational in their *internal* calculations (actuarial tables, house edge). They rely on EMV for "normal" risks within their operating bounds, yet explicitly reject its application when outcomes become too extreme or probabilities too small. The core tension is this: they act *as if* EMV is valid and sufficient for bounded, moderate-stakes decisions, but fundamentally inadequate and misleading for decisions involving ruinous losses or astronomical-but-improbable gains. The practice implies EMV works well only within a "safe" zone.

  ### What it can't do without (300 words)
  The practice **absolutely requires rejecting the assumption that monetary value is linear and unbounded for decision-making under extreme risk.** It is fundamentally incompatible with a utility function U(x) = x. EMV maximization *only* makes sense if utility is linear in money. The universal capping behavior demonstrates that institutions treat an additional dollar (or million dollars) differently depending on the context – specifically, when it pushes towards ruin or involves vanishingly small probabilities.

  Two commitments are indispensable:
  1.  **Non-Linear Value Perception for Extremes:** At minimum, institutions must act *as if* the disutility of a catastrophic loss (e.g., bankruptcy from unlimited liability) is disproportionately larger than what a linear EMV calculation suggests. This doesn't strictly require a *global* bound on utility (though it's sufficient), but it *does* require that the *marginal* disutility of loss becomes effectively infinite as losses approach ruin. Similarly, the marginal utility of extreme gains diminishes relative to the risk. Charging above expected loss for insurance directly reflects placing a higher "weight" on avoiding ruin than linear EMV dictates.
  2.  **Non-Linear Probability Weighting (Especially for Tiny Probabilities):** The rejection of the St. Petersburg lottery and liability caps cannot be explained solely by diminishing marginal utility of money; even with unbounded concave utility, EU maximizers might pay a high finite price. The practice necessitates treating extremely low probabilities (especially of catastrophic events) as effectively zero *for the purpose of decision-making*, or at least weighting them far below their objective probability. Institutions act as if the *possibility* of an infinite loss, however improbable, is unacceptable, implying they don't multiply the outcome by the tiny p in the standard linear way. This is distinct from discounting the future (though that can compound the effect).

  Without rejecting linear value and linear probability weighting for extremes, the observed practice would be irrational and unsustainable. EMV alone cannot justify it.

  ### What it merely fits (200 words)
  Several common theoretical constructs *fit* and comfortably explain the practice but are not strictly *required* by it:

  1.  **Diminishing Marginal Utility (Concave Utility):** This classic explanation (the 1000th dollar < the 1st) naturally leads to risk aversion and explains insurance premiums and rejection of fair gambles. It makes capping losses rational. However, the practice *could* survive without it. A utility function linear *except* for a catastrophic cliff (discontinuity at ruin) could also motivate caps and premium loading, even if marginal utility is constant until the cliff. Concavity is a sufficient and common cause, but not the only possible one.
  2.  **Bounded Utility:** Postulating an absolute ceiling on utility (e.g., U(x) approaches a maximum asymptotically) provides a clean theoretical justification for rejecting St. Petersburg-like gambles and capping exposure to large gains. However, the practice doesn't *prove* utility is bounded; the combination of non-linear probability weighting and extreme sensitivity to ruinous losses (even with unbounded utility) can also produce the behavior.
  3.  **Discounting the Future:** For multi-period risks (like long-tail insurance liabilities), discounting future costs/gains exacerbates the effect of non-linear weighting. A distant catastrophic loss feels "smaller," but the core aversion to the *possibility* of ruin is primary. Discounting reinforces, but isn't fundamental to, the aversion to tail risk.
  4.  **Risk of Ruin:** While often cited, the *fear* of ruin is the *consequence* of non-linear value perception at extremes, not the fundamental commitment itself.

  ### Where it's underdetermined (200 words)
  The observable practice *is* underdetermined; distinct theoretical frameworks can license the same behavior:

  1.  **Expected Utility (EU) vs. Prospect Theory (PT):** The practice is equally consistent with:
      *   **EU Theory:** Using a utility function U(x) that is strictly concave (diminishing marginal utility) and/or bounded.
      *   **Prospect Theory:** Using a value function v(x) that is concave for gains, convex for losses, steeper for losses (loss aversion), *and* a probability weighting function π(p) that underweights moderate/high probabilities and overweights very low probabilities (though the St. Petersburg paradox suggests extreme underweighting of near-zero p for huge gains). PT's probability weighting directly addresses the St. Petersburg refusal and liability caps without necessarily requiring concave utility or bounds.
  2.  **Source of Non-Linearity:** Is the primary driver the shape of the utility/value curve (concavity/boundedness), or the distortion of probability perception/weighting? The practice alone doesn't distinguish. Both concave EU and PT with probability weighting predict similar institutional behavior.
  3.  **Theoretical vs. Practical Ruin Avoidance:** Does the institution cap losses because of a fundamental property of value (like bounded utility) or due to practical, non-theoretical constraints like regulatory capital requirements, reinsurance availability, or stakeholder pressure? The *behavior* looks the same, even if the underlying motivation differs. The practice could emerge from purely institutional survival instincts codified into rules, mimicking axiomatic decision theory.

  ### How sure I am, and my weakest point (100 words)
  I'm highly confident (>90%) that the practice necessitates rejecting linear monetary value and linear probability weighting for extreme outcomes. The core commitment is to non-linearity in the tails. My weakest point is the interpretation of the **hybrid reliance on EMV**. I'm only ~70% sure that institutions genuinely view EMV as "correct in the bulk, wrong in the tail." It might simply be extreme pragmatic convenience: EMV works remarkably well for frequent, bounded risks where the law of large numbers applies, making complex utility calculations unnecessary. The "hybrid view" might be a useful fiction rather than a coherent philosophical stance. This blurring is the shakiest step.
