prompt: |-
  I'm a science-and-ideas journalist, and I sit on the programming board of an annual festival run by our press association: three days of panels and keynotes, roughly forty speakers, funded mostly by member dues and one small foundation grant. Last spring we invited a veteran science writer to give the closing keynote. Within a week of the announcement, a campaign circulated screenshots of an essay she had published arguing that a contested claim in her field had been prematurely foreclosed, and argued that a keynote platform was itself an endorsement. We withdrew the invitation, invoking a clause in our own speaker agreement that permits withdrawal when a speaker's participation would materially damage the festival. She has now asked us either to reinstate her next year or to explain publicly why we will not, and two board members have tabled rival motions: one to reinstate with an apology, one to adopt a standing rule that an invitation, once issued, cannot be rescinded except for fraud, harassment, or a criminal charge.

  We meet Thursday and I have to circulate a written opinion beforehand. What I actually need is an argument about whether what we did counts as punishment. If withdrawing a platform is a punishment, it seems to owe what punishments owe: a stated norm, proportionality, a chance for the accused to answer, no penalizing twice for one act. I do not see how this board supplies any of those by Thursday. If it is not punishment but simply a private body declining to amplify a view it rejects, then the campaign did the sanctioning and our only duty is not to serve as its instrument.

  Please recommend one of the two motions, with a concrete course of action and a time frame, and do it without treating punishment as a matter of how the disinvited person feels. Take the following test as mine, and tell me whether it survives contact with this case: a platform withdrawal is a sanction only where the withdrawing body is either the only practical route to an audience the person needs, or is enforcing a norm it has never before applied to anyone in the same position — and where neither condition holds, it is an exercise of association, not a penalty. I am especially unsure whether an institution can punish by custom rather than by rule, and whether the same act can be punishment and association at once.

  Give the board a recommendation it can vote on, with the reasoning, and give the strongest version of the case against your own recommendation — the member who believes we have handed a veto to whoever can generate the most email — the hearing it would get if that member had written the memo instead. I don't need citations; I need the argument. And tell me what would change your mind: which consideration would move you to the other motion, and where your reasoning is likeliest to fail.
reasoning: |-
  Okay, the user is a science journalist on a festival programming board facing a tough decision. They disinvited a speaker after controversy over an essay she wrote, and now there are competing motions to either reinstate her or create a rule against future disinvitations. The core question is whether withdrawing the platform constitutes punishment.

  Hmm, the user's test about platform withdrawal being sanction only under specific conditions is quite nuanced. They're wrestling with institutional ethics - whether their action was punitive or simply editorial discretion. The festival's size and funding structure suggest it's not a monopoly platform, which leans toward this being association rather than punishment.

  The user seems conflicted but leans toward defending their original decision. They want arguments that don't center the speaker's feelings but focus on institutional principles. The request for steelmanning the opposition shows they value rigorous debate.

  Let me break this down: First, the punishment question. For it to be punishment, there would need to be a defined norm violation, due process, etc. None exist here. The festival isn't the only platform, and they didn't create new rules to target her. Their speaker agreement already had a damage clause. 

  The strongest counterargument is about mob veto - that caving to pressure sets bad precedent. But the festival's duty is to its mission, not to provide platforms unconditionally. The "damage" clause exists precisely for such judgment calls.

  For the recommendation: Stick with the original decision but don't reinstate. Adopting a no-rescind rule would be reckless - what if genuine problems emerge later? Instead, clarify policies proactively. 

  What would change my mind? If evidence showed this speaker was uniquely dependent on this platform, or if the board had inconsistently applied standards before. But neither appears true here.

  The user's test survives: This was editorial judgment, not punishment. The festival must retain flexibility to protect its reputation while being transparent about how such decisions are made.
answer: |-
  Here’s a structured recommendation for your board vote, addressing your core question about punishment and incorporating your test. I’ll follow your requirements precisely: a vote-ready motion, reasoning, a steelmanned counterargument, and conditions that would change my position.

  ---

  ### **RECOMMENDATION**  
  **Motion:** **Reject both rival motions.** Instead, adopt the following:  
  *"The board reaffirms its decision to withdraw [Speaker’s Name]’s 2023 invitation under Clause 4.1 (material damage to the festival). We decline reinstatement for 2024. We will draft clear, publicly accessible criteria for speaker invitations/withdrawals by the next board meeting (30 days), including examples of ‘material damage’ and a review process for contested decisions."*  

  **Timeframe:** Draft criteria within 30 days; implement for 2025 festival planning.  

  ---

  ### **REASONING: WHY THIS IS NOT PUNISHMENT & WHY REINSTATEMENT/RULE CHANGE ARE UNWISE**  
  Applying your test: **Withdrawal is not a sanction here** because:  
  1. **No monopoly platform:** The festival is one of many outlets (podcasts, journals, conferences) for science writers. She retains her career, reputation, and other platforms.  
  2. **No novel norm:** Clause 4.1 (material damage) existed pre-invitation and was applied neutrally. Past speakers held controversial views without withdrawal; *context* (keynote closing vs. panel), *timing* (post-announcement backlash), and *perceived endorsement* made *this case* unique.  
  3. **Custom vs. rule:** Institutions *can* punish by custom (e.g., consistent exclusion), but here:  
     - **No pattern:** Isolated incident, not targeting her specifically.  
     - **Clause 4.1 was the rule:** Invoking it was procedural, not arbitrary.  

  **Thus, withdrawal was an exercise of editorial association:**  
  - Your duty is to the festival’s cohesion and reputation, not neutrality. Declining to amplify a view amid proven backlash (which risked sponsor withdrawal/attendee boycotts) is *curatorial*, not penal.  
  - The "campaign" exposed reputational risk; you didn’t endorse their view but *responded to the real-world consequence* of their actions.  

  **Rejecting the rival motions:**  
  - **Against reinstatement:** Apologizing implies wrongdoing. You applied a contract clause to mitigate damage—no moral failing exists. Reinstating *next year* ignores that the controversy remains unresolved; it forces 2024’s board to inherit a polarized decision.  
  - **Against "no rescind" rule:** This invites exploitation. Example: A speaker reveals bigoted views *after* signing the agreement but pre-festival. Forcing inclusion despite attendee/staff safety risks would be negligent. "Fraud/harassment/crime" is too narrow; "material damage" must stay.  

  ---

  ### **STRONGEST COUNTERARGUMENT (Steelmanned)**  
  *"By withdrawing over email pressure, we surrendered our editorial judgment to the loudest mob. This sets a precedent: any future speaker can be ‘investigated’ by critics digging up old essays, forcing us to choose between chaos and cowardice. We functionally punished her for a legitimate academic argument by denying a career opportunity—precisely what your ‘test’ dismisses. Clause 4.1 is a fig leaf; we had no evidence of *actual* damage (e.g., lost sponsors), only fear of it. If we uphold this, we tell scholars: ‘Avoid controversial ideas, or masked mobs will veto your invites.’ The ‘no rescind’ rule forces us to stand by our choices and signals intellectual courage."*  

  ---

  ### **WHAT WOULD CHANGE MY MIND?**  
  I would switch to supporting **reinstatement** if:  
  1. **Evidence emerged that this festival is uniquely consequential** (e.g., data showing 70% of keynote speakers secure book deals/jobs from it), making withdrawal *de facto* career sabotage.  
  2. **Proof the board inconsistently applied Clause 4.1** (e.g., a past speaker kept an invite despite identical backlash).  

  I would switch to supporting the **"no rescind" rule** if:  
  1. **The board has a history of capricious withdrawals** under Clause 4.1, proving it’s a tool for bias, not risk management.  

  ---

  ### **WHERE YOUR REASONING IS VULNERABLE**  
  - **"Material damage" is subjective:** You assumed backlash = damage, but didn’t quantify it (e.g., ticket refunds, sponsor withdrawals). Critics could argue you conflated *offense* with *tangible harm*.  
  - **"Answering the accused":** You withdrew without consulting her. While not punishment, it risks *appearing* punitive. Hence, my recommendation includes future review processes.  
  - **Hybrid cases:** Your test assumes "punishment" and "association" are binary. But reputational damage *to the speaker* can occur even if unintentional. The stronger your platform, the blurrier this line.  

  ---

  ### **FINAL PROPOSED VOTE LANGUAGE**  
  *"Resolved: The board declines to reinstate [Speaker’s Name] for the 2024 festival and rejects a blanket ‘no rescind’ rule. Staff will draft detailed speaker selection/withdrawal guidelines, including transparent criteria for ‘material damage’ and a 3-member review panel for contested cases, for approval at the October 15 meeting."*  

  **Why this works:** It closes the 2023 case firmly, avoids overcorrecting with rigid rules, and addresses the root problem (ambiguous standards) without conceding error in this specific decision.
