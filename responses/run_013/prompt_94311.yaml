answer: |-
  Applying Bentham's utilitarian framework—prioritizing pleasure, minimizing pain, demanding demonstrable harm for legal interference, and rejecting moralistic disgust as a valid basis for law—to the three controversies yields these verdicts:

  1.  **Sadomasochism & Consent to Harm (R v Brown):**
      *   **Verdict:** Bentham would **oppose** the rule established in *Brown*. His reasoning would focus on:
          *   **Consent & Absence of Harm:** Participants derive pleasure (a good) from the acts. Assuming competence and genuine consent, the immediate physical pain is consented to and outweighed by the pleasure sought, constituting no *net harm* to the participants themselves.
          *   **Lack of Demonstrable Public Harm:** Bentham would demand evidence that such private, consensual acts cause harm to non-consenting others (e.g., increased public violence, strain on medical resources beyond normal expectations). Mere potential for things going wrong isn't sufficient justification for prohibition under his harm principle.
          *   **Rejection of Moral Disgust:** The "horror" of the acts cited by the Lords is precisely the kind of ungrounded antipathy Bentham condemned regarding same-sex acts. It's not a legitimate "pain" warranting legal interference.
      *   **Key Commitment:** The **Harm Principle** (no legal interference without demonstrable harm to others) and the **equality of pleasures** (sadomasochistic pleasure counts as much as any other consented pleasure).

  2.  **Commercial Sex (Legalization, Regulation, Enforceable Contracts):**
      *   **Verdict:** Bentham would strongly support **legalization and regulation**, but likely **reject legally enforceable contracts for specific sexual services**.
          *   **Legalization/Decriminalization:** Criminalization causes immense pain (stigma, violence, arrest, barriers to healthcare/justice) without demonstrably preventing harm intrinsic to the *activity itself* (which often stems from its illegality). Legalization removes these pains and potentially allows for safer working conditions (increased pleasure/safety, decreased pain/disease/violence).
          *   **Regulation:** Bentham would support regulations aimed at minimizing *actual harms* – health and safety standards (STI prevention), measures against coercion and trafficking (protection from violence/exploitation), zoning to minimize nuisance to non-consenting third parties. The goal is harm reduction to maximize net utility.
          *   **Enforceable Contracts:** Bentham would likely oppose legally *enforcing* specific performance of sexual acts. His principle of **security** (expectation of non-interference) and **individuality** (autonomy over one's body) are paramount. Forcing someone to perform a sexual act against their will in the moment, even under contract, constitutes direct harm (pain, violation). He might support enforcing *payment* terms or ancillary agreements *if* the service wasn't rendered *without* forcing the act itself, but the core sexual service would remain unenforceable due to the fundamental violation of bodily autonomy it would entail if compelled.
      *   **Key Commitments:** The **Harm Principle** (legalization removes state-inflicted harms, regulation targets real harms), **hedonic calculus** (weighing the pains of criminalization vs. regulated activity), **security/autonomy** (rejecting enforceable specific performance).

  3.  **Sexual Assistance for People with Disabilities:**
      *   **Verdict:** Bentham would strongly **support** state funding or arrangement of sexual assistance services.
          *   **Pleasure as a Good:** Sexual pleasure is a fundamental good within Bentham's calculus, contributing to happiness.
          *   **Equality of Consideration:** People with disabilities have the same capacity for pleasure and suffering as anyone else. Denying them avenues to experience sexual pleasure (especially when disability creates barriers they cannot overcome alone) constitutes a deprivation of a good and potentially causes pain (frustration, loneliness, sense of inadequacy).
          *   **Welfare & State Role:** Bentham saw the state's role in promoting the greatest happiness. Where a significant group faces systematic barriers to a fundamental source of pleasure through no fault of their own, and state intervention can alleviate this (funding/arranging services), it becomes a legitimate welfare function to maximize overall utility and ensure equal access to pleasure.
          *   **Harm Minimization:** Properly regulated services could reduce risks associated with unregulated or clandestine arrangements.
      *   **Key Commitment:** **Hedonic Egalitarianism** (pleasures/pains of the disabled count equally) and the **state's role in maximizing utility/welfare**, extending the principle of providing for basic needs to encompass fundamental pleasures like sex where access is inequitable.

  **Pressing the Framework: Third-Party Disgust & Alarm**

  *   **Does it count?** Technically, yes. Bentham's calculus includes *all* pains and pleasures, regardless of source. If third parties genuinely experience distress, disgust, or alarm at the *knowledge* of consensual acts (same-sex, SM, commercial, assisted), that pain must be entered into the equation.
  *   **Does his argument survive?** **Yes, robustly.** Bentham explicitly addressed this in the context of same-sex acts:
      *   **Irrationality of the Pain:** He argued this distress is based on "antipathy" – prejudice, superstition, or groundless moral disgust – not on any *real* harm caused by the acts themselves. It's analogous to distress caused by someone else's religious practice or dietary choice.
      *   **Danger of Capitulation:** Allowing such feelings to dictate law opens the floodgates to tyranny of the majority over minority practices based purely on dislike, fundamentally undermining security and autonomy – core utilities for Bentham. He prioritized the *security* of individuals from interference based on others' prejudices.
      *   **Outweighing the Pain:** The intense pleasure and relief from suffering for the participants, and the immense pain caused by criminalization (stigma, punishment, fear), would vastly outweigh the diffuse, largely socially constructed discomfort felt by third parties unaware of or not directly confronted by the acts. The *net utility* clearly favors decriminalization.

  **Bentham vs. Contemporary Liberal Orthodoxy: Divergence on Hedonic Egalitarianism**

  *   **Bentham's Push:** His radical **hedonic egalitarianism** pushes him towards recognizing sexual pleasure as a fundamental good whose *equitable access* is a legitimate concern for social welfare policy, particularly for marginalized groups like people with severe disabilities. This leads him to support state-funded sexual assistance.
  *   **Liberal Orthodoxy Hesitation:** Contemporary liberalism, while strongly supporting decriminalization, consent, and non-discrimination (aligning with Bentham on SM, sex work, and same-sex acts), typically **stops short** of framing sexual pleasure as a positive welfare entitlement the state must *actively provide*. There's a strong emphasis on negative liberty (freedom *from* interference) and a reluctance to involve the state in *facilitating* intimate acts, often due to:
      *   Concerns about state overreach/paternalism in intimate life.
      *   Difficulties in defining and administering such services fairly and without coercion.
      *   Prioritizing other welfare needs (housing, healthcare, income) over sexual pleasure.
      *   Residual squeamishness or moral hesitation about treating sex as a publicly-funded service.
  *   **Who is Right?** The divergence doesn't necessarily tell *against* Bentham; it highlights a tension within liberalism.
      *   **Against Consensus?** Bentham exposes a potential inconsistency: if sexual autonomy and well-being are fundamental liberal values, and disability creates a genuine barrier to accessing a fundamental human experience (sexual intimacy), why shouldn't society address that inequity as it does others? The liberal reluctance can appear like an arbitrary limit, perhaps reflecting an unacknowledged hierarchy of needs where sexual pleasure isn't taken as seriously as Bentham insists it should be.
      *   **Against Bentham?** His approach risks excessive state intrusion into intimate life and potentially overlooks the practical and ethical complexities of state-provisioned sex. His pure calculus might undervalue the liberal commitment to keeping certain intimate spheres free from state management, even for benevolent purposes.

  **Conclusion:** Bentham's utilitarianism delivers progressive verdicts on all three modern controversies, grounded in the harm principle, hedonic equality, and the rejection of moralistic disgust. While third-party distress technically counts, he dismisses it as irrational prejudice whose weight is vastly outweighed by the harms of prohibition and the goods of consensual pleasure. His most significant divergence from contemporary liberalism lies in his willingness to push hedonic egalitarianism towards state facilitation of sexual pleasure for the disabled, challenging liberalism to either justify its hesitation more robustly or reconsider the boundaries of welfare provision. This divergence critiques the potential limits of liberal neutrality more than it invalidates Bentham's core utilitarian logic.
