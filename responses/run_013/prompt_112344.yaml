answer: |-
  ### Essay Question  
  **David Hume’s monetary essays present a nuanced view of money’s role that resists simplistic categorization. Reconcile the following three elements of his theory: (1) his metaphor that money is “the oil which renders the motion of the wheels more smooth and easy” but not “one of the wheels” of commerce; (2) his concession that a sudden influx of money “may have some influence, by exciting industry” during the price-adjustment period before neutrality prevails; and (3) his argument in “Of Interest” that interest rates depend on “the habits and manners of the people” (real factors), not the quantity of money. Explain what work the long-run/short-run distinction does in Hume’s system. Is the transition-period effect a genuine exception to neutrality? If so, what drives it? Finally, how does Hume’s suspicion of banks and paper credit align with or complicate this framework? Avoid anachronistic labels (e.g., “Keynesian” or “monetarist”) and address his qualifications about money’s usefulness in specific contexts (e.g., war).**

  ---

  ### Model Answer (600 words)  
  Hume’s monetary theory is often misread as asserting strict long-run neutrality, but his careful distinctions between short-run dynamics and long-run equilibria reveal a richer, more dialectical model. Reconciling his three key propositions requires understanding money as a *medium* whose distributional effects temporarily alter real activity—without contradicting neutrality once adjustment is complete.  

  First, Hume’s “oil-and-wheels” metaphor (1) frames money as a facilitator of exchange, not a direct input into production. This implies that, fundamentally, wealth stems from real factors like goods, labor, and ingenuity. However, his concession that monetary shocks temporarily “excite industry” (2) during price adjustments complicates this. This transition-period effect arises because new money enters unevenly. Hume suggests early recipients (e.g., merchants, miners) gain purchasing power before prices rise economy-wide. Their increased spending stimulates demand for goods and labor, boosting output until prices fully adjust to the new money stock. Thus, the short-term stimulus is *not* a violation of neutrality but a *distributional consequence* of disequilibrium: real effects occur because price adjustments are staggered and expectations lag.  

  Crucially, this short-run mechanism does not contradict Hume’s interest-rate theory (3). In “Of Interest,” he insists low interest stems from abundant capital (savings), not abundant money. Here, the long-run/short-run distinction is pivotal: while money may briefly lower nominal rates via liquidity effects during transitions, sustained low rates require real thrift and capital accumulation. Money’s neutrality holds for interest because, once prices adjust, the real cost of borrowing reverts to its pre-shock level. The transition effect is confined to output and employment via asymmetric spending—not permanent changes in capital costs.  

  Hume’s suspicion of banks and paper credit extends this distributional logic. He warns that sudden expansions of paper credit can create artificial, unsustainable booms by concentrating early spending power in speculators’ hands. When prices eventually rise, the bust disproportionately harms late recipients (e.g., wage earners). This aligns with his transition-period analysis: paper credit amplifies the uneven distribution of monetary injections, exacerbating short-term volatility without altering long-run neutrality. However, it complicates his framework by introducing institutional agency. Unlike gold inflows (a “natural” shock), banks *deliberately* manipulate money supply, heightening distributional risks and moral hazard—yet Hume still expects neutrality to prevail once adjustments occur.  

  His qualifications about money’s usefulness in war or foreign negotiations reinforce that neutrality is contextual, not absolute. Money aids state power by facilitating taxation and foreign payments, but this utility stems from its role as a medium in *specific* transactions—not from increasing real wealth. Similarly, his “rivers and springs” analogy in “Of the Balance of Trade” dismisses mercantilist fears of money outflows because prices adjust to restore equilibrium. Here, money’s neutrality anchors his free-trade optimism.  

  Ultimately, Hume’s transition period is a *disequilibrium artifact* driven by asynchronous price adjustments and distributional inequity—not a proto-Keynesian multiplier. The long-run/short-run distinction allows him to acknowledge money’s temporary real effects while upholding classical axioms about value and growth. His model remains anchored in real factors (industry, thrift, commerce), with money acting only as an imperfect, volatility-prone lubricant.  

  ---  

  ### Marking Scheme (20 points total)  
  **Must-hit points** (Award 0–4 points per criterion; deduct for anachronism or oversimplification):  

  1. **Transition-period mechanism** (4 pts):  
     *Correct:* Identifies staggered price adjustment + uneven distribution of new money as drivers of short-term output gains (e.g., early recipients boost demand before inflation).  
     *Common error:* Calls this “Keynesian stimulus” or claims Hume rejects neutrality outright.  

  2. **Interest-rate independence** (4 pts):  
     *Correct:* Explains that interest depends on real savings/capital long-run; short-term nominal effects don’t refute this.  
     *Common error:* Asserts monetary inflation lowers real interest permanently or ignores Hume’s real factors.  

  3. **Banking/credit critique** (4 pts):  
     *Correct:* Links paper credit to amplified distributional issues (artificial booms/busts) but no long-run escape from neutrality.  
     *Common error:* Portrays banks as fundamentally altering Hume’s system or ignores distribution.  

  4. **Role of long-run/short-run distinction** (4 pts):  
     *Correct:* Distinction reconciles temporary real effects with long-run neutrality; disequilibrium ≠ theoretical failure.  
     *Common error:* Treats the transition as a “flaw” in quantity theory or conflates it with modern business-cycle models.  

  5. **Qualifiers & non-anachronism** (4 pts):  
     *Correct:* Notes money’s utility in war/negotiations as transactional (not wealth-creating) and avoids terms like “monetarist” or “veil.”  
     *Common error:* Uses 20th-century frameworks or misses Hume’s pragmatic concessions (e.g., balance-of-trade optimism).  

  **Balance and Structure**: Penalize disjointed answers (-1 to -2 pts). Reward synthesis of all three elements + banking.
