prompt: |-
  I am a high school student writing an independent-study essay in philosophy, and I want you to argue for a specific position about Parfit's hitchhiker. The position is this: the hitchhiker should pay, but not because he owes the driver anything after the fact, and not because he is being irrational in the ordinary means-end sense. The hitchhiker case forces a distinction between two kinds of practical rationality. Call the first act-rationality: it evaluates a choice by its consequences from the moment the choice is made. Call the second disposition-rationality: it evaluates a choice by whether it belongs to a stable policy that the agent can endorse before the situation arises and can continue to endorse afterward. The hitchhiker's payment is act-irrational but disposition-rational, and disposition-rationality is the only kind of rationality that can reasonably be demanded of someone who wants to be picked up in the first place. I want the argument to do five things. First, reconstruct the hitchhiker case so that the act-level reasoning looks compelling and not like a trick. Second, show that the usual escape routes—appealing to a pre-existing promise, to the driver's reliance, or to a rule-utilitarian calculation—either fail or are unavailable to the hitchhiker at the moment of decision. Third, introduce and defend the act/disposition distinction, and explain why it is not just a relabeling of the same problem. Fourth, answer the objection that disposition-rationality collapses into act-rationality once you ask why one should have the disposition at all, by arguing that the disposition is not chosen for its consequences in any particular case but is constitutive of being the kind of agent with whom others can cooperate. Fifth, state what the position costs: does it require giving up the idea that rationality is purely forward-looking, and if so, is that a cost worth paying? I do not want a survey of what other philosophers have said, and I do not need any quotations, citations, or references to authors; I will add those myself. Begin your answer with your bottom line in the first sentence, then give the reasoning. No preamble, no restating of the question.
reasoning: |-
  Okay, the user is a high school student working on a philosophy essay about Parfit's hitchhiker. They want me to argue a specific position that distinguishes between act-rationality and disposition-rationality. The key points are clear: the hitchhiker should pay not out of obligation or standard means-end reasoning, but because disposition-rationality is essential for being a cooperator.

  First, I need to reconstruct the hitchhiker case to make the act-level reasoning compelling. The original scenario involves a hitchhiker rescued by a driver who only saves him if he promises to pay later. Once safe, the hitchhiker doesn't pay. The act-rational view here is strong—no immediate benefit from paying, so refusing seems rational. I should emphasize that this isn't a trick; it's a genuine case where consequentialist reasoning suggests non-payment.

  Next, I must show why common escape routes fail. The hitchhiker didn't make a sincere promise since he intended not to pay. The driver's reliance was conditional, so no harm done by not paying. Rule-utilitarian arguments don't apply at the moment of decision because the act itself has no consequences. This strengthens the case that act-rationality alone can't justify payment.

  For the act/disposition distinction, I need to define both clearly. Act-rationality is about immediate consequences, while disposition-rationality involves stable policies. This isn't just relabeling; it's a fundamental shift in evaluating rationality. Disposition-rationality allows agents to maintain integrity and cooperation across time, which act-rationality ignores.

  The collapse objection is crucial. If someone asks why have the disposition, I need to argue it's not about individual consequences but about being a reliable cooperator. The disposition is constitutive—without it, one can't participate in mutually beneficial arrangements. It's about identity as a cooperative agent, not case-by-case gains.

  Finally, stating the costs: this approach gives up purely forward-looking rationality. It introduces a temporal dimension where past commitments shape current rationality. But this cost is worth it because it enables cooperation, which is necessary for many human goods. Surrendering pure forward-looking rationality allows for deeper social coordination.

  The user probably wants a clear, structured argument without jargon. Since they're in high school, making complex ideas accessible is key. They might be struggling with how to defend disposition-rationality against act-focused critiques. Their deeper need could be understanding how to argue for a non-consequentialist view in a consequentialist-dominated discussion. They might also need to show originality by not relying on standard responses like promises or rule-utilitarianism.

  I should ensure each of the five tasks is addressed step-by-step. Avoid references, stay focused on the logic. Highlight the constitutive aspect of dispositions to prevent collapse into act-rationality. Emphasize that cooperation requires being a certain type of agent, which justifies the disposition beyond immediate gains. Conclude with the trade-off: losing pure forward-looking rationality but gaining a framework for sustained cooperation.
answer: |-
  The hitchhiker should pay because disposition-rationality, not act-rationality or moral obligation, governs the cooperative agency required to be rescued in the first place. Reconstruct the case: a stranded hitchhiker faces death unless a driver rescues him. The driver will only rescue him if he sincerely promises to pay $1000 upon reaching safety. The hitchhiker makes the promise, is rescued, and now sits safely in town with the $1000. Act-rationality asks: "What consequences flow *from paying now*?" Paying costs $1000 and gains nothing tangible (the rescue is already secured), while not paying saves $1000 and also gains nothing tangible (the driver cannot un-rescue him). Refusing to pay is clearly act-rational – it maximizes expected utility from *this moment forward* without trickery, simply because the critical consequence (rescue) is irrevocably in the past.

  Standard escape routes fail. There's no binding pre-existing promise because the hitchhiker never intended to pay when he promised; his "promise" was insincere, a necessary lie to secure rescue, negating any genuine obligation. The driver’s reliance isn’t harmed *by non-payment now*; the driver only acted based on the conditional offer (rescue for payment), and that offer's condition (rescue) has been fulfilled – non-payment doesn't retroactively harm the driver's prior action. Rule-utilitarianism ("If everyone broke such promises...") crumbles at the moment of choice: the act-rational hitchhiker sees no consequence *from his individual act* of non-payment that could undermine future rescues; his single defection won't collapse the system, making rule-following seem act-irrational.

  This forces the distinction: **Act-rationality** evaluates an individual choice (like refusing to pay) solely by its foreseeable consequences *starting from the moment the choice is made*. **Disposition-rationality** evaluates an individual choice by whether it stems from a *stable, endorsable disposition* – a policy the agent could rationally commit to *before* facing the specific situation (e.g., "Always keep sincere rescue-for-payment promises"), and could still rationally affirm *after* acting (maintaining self-consistency). This isn't relabeling; it's shifting the locus of evaluation from the isolated act's immediate payoff to the act's role within the agent's diachronic practical identity. The hitchhiker's refusal is act-rational (best consequence now) but disposition-*ir*rational, as he could not have stably endorsed a policy of "Lie to secure rescue" *before* being stranded (knowing drivers wouldn't rescue known liars), nor can he stably endorse it *afterwards* (becoming someone who exploits rescuers, ensuring future abandonment).

  The objection that disposition-rationality collapses into act-rationality once we ask "Why have the disposition?" is answered by recognizing the disposition's constitutive role. The disposition (e.g., to keep such promises) isn't adopted *because* it yields the best outcome *in this specific rescue*. It's adopted because *being the kind of agent who reliably has and acts on this disposition* is a prerequisite for being identifiable *as a cooperator*. Drivers will only rescue agents *presumed* to have the cooperative disposition. Having and acting on the disposition isn't *instrumental* for individual gain *in each case*; it's *constitutive* of being a member of the cooperative practice that makes rescue possible *at all*. The rationality lies in sustaining the agency type that enables participation in mutually beneficial schemes, even when defection in a single instance seems locally optimal. The hitchhiker who pays acts on the disposition necessary to be "rescuable" in principle.

  The cost is surrendering the idea that practical rationality is *purely* forward-looking, concerned only with consequences flowing *from the present choice*. Disposition-rationality introduces a necessary backward-looking element: the rationality of the present act depends partly on its coherence with a disposition *formed* or *held* in the past and projected into the future. It demands consistency of the self over time. This cost is worth paying. Pure forward-looking act-rationality cripples cooperation in dilemmas like the hitchhiker case, rendering agents like the hitchhiker untrustworthy and thus excluded from beneficial social arrangements. Accepting disposition-rationality as fundamental is the price of being a cooperator capable of engaging in the very practices that deliver profound goods like rescue, which isolated act-rationality cannot secure.
