  for my philosophy club presentation i have to lay out the most important implications of this view from norman malcolm (the guy who was wittgensteins friend) that dreams arent experiences at all — like when you say "i dreamt i was flying" your not reporting something you actually experienced while you were asleep, your just saying you would have told a story like that if someone had woken you up and asked. dennett wrote a famous reply to him. what are the most important implications of taking malcolms side? i want the ones that actually bite, not just "it changes how we think about the mind": does it mean lucid dreamers are wrong when they say they were aware and making choices inside the dream, does it wreck how sleep labs treat dream reports as data (theres a therapy for nightmares where you rehearse the dream while your awake), and does it mean you cant be blamed or praised for what you did in a dream. lead with your bottom line in the first sentence then give the reasoning, no preamble and dont restate my question.
