prompt: |-
  I run the eligibility office for a county rental-assistance program, and I need help diagnosing a problem that has been getting worse for two years.

  Our determinations are made by a software system assembled out of explicit rules: each rule states that if certain facts hold — household income below a threshold, a verified lease, a disability designation, and so on — then a client is eligible for a particular benefit amount. The rules have accumulated for eleven years, written by different people for different purposes. Here is the pattern that worries me. Whenever we add a rule to handle a new kind of case, cases that previously came out right come out wrong. Last month we added a rule that recalculates household income when a client reports starting a new job. Afterward, the system began treating some of those clients as having no verified lease on file, even though nothing about their leases had changed; the new rule had, in effect, stopped the earlier facts from being carried forward. We patched it. Two weeks later, a different patch broke a different rule. The system does not forget the way a person forgets; it simply stops carrying forward anything that no one explicitly instructed it to carry forward.

  Four people have told me what the real problem is, and I have to make a recommendation to my director on Monday.

  My director says the rules are merely incomplete: fund a year of work to enumerate every exception and every fact that remains true when something changes, so that the system never has to rely on assumptions.

  The contractor we consulted says we should stop writing rules by hand, train a model on eleven years of our decisions, and let it learn the patterns; we would not have to say what stays the same, because the model would infer it.

  Our auditor says the problem is that we keep changing the rules, and that the fix is to freeze them and require board approval for any change.

  A caseworker who has been here longer than the software says the rulebook is not the issue. The problem, she says, is that we treat a case as finished once the system has computed it; if the system re-checked the record from scratch whenever anything changed, none of this would happen.

  I am not looking for a vendor recommendation. I need to understand the shape of the problem well enough to know what I would be buying, and which of these four diagnoses names the underlying limitation rather than merely relocating it.

  Please answer in two parts.

  First, a short analysis (no more than 350 words) that states, in plain terms, what the underlying limitation actually is and why it arises. If this limitation has a standard name, give me the name; I do not need citations or further reading.

  Second, a table with exactly these five columns and one row for each of the four proposals above, in the order I gave them:

  - Proposal: who is proposing it, in a few words.
  - Diagnosis: what that proposal assumes the underlying problem to be, in one sentence.
  - What it would genuinely fix: the part of the failure pattern it actually addresses.
  - What it leaves broken: what would still go wrong if we adopted it, and why.
  - Verdict: exactly one of Adopt, Adopt with changes, Reject.

  End with a single sentence I can read aloud to my director that states what the real problem is.
reasoning: |-
  Okay, the user runs an eligibility office for a county rental-assistance program. They're dealing with a software system that uses explicit rules to determine benefits. Over eleven years, different people have added various rules, leading to issues. Every time they add a new rule to handle a new case, existing cases that were correct start failing. For example, adding a rule for recalculating income when someone starts a new job caused the system to forget verified leases. Patches fix one issue but break another. 

  The user has four proposals from different stakeholders: the director, a contractor, an auditor, and a caseworker. They need to understand the underlying limitation and evaluate each proposal. The core problem seems to be that the system doesn't retain information unless explicitly told to do so. When new rules are added, they might override or ignore existing facts because the system lacks a way to manage state over time. This is a frame problem in AI, where the system can't infer which facts remain unchanged when an update occurs. 

  The user needs a clear analysis and a table evaluating each proposal. They want to know the real issue without vendor recommendations. The key is to identify that the system's inability to handle state persistence and change propagation is the root cause. Each proposal addresses symptoms but not the core problem. For example, the director's plan to enumerate exceptions would be exhaustive and impractical. The contractor's ML solution might learn patterns but lacks explainability and could inherit past errors. The auditor's freeze would stop changes but prevent necessary updates. The caseworker's re-checking from scratch could work but might be inefficient without proper implementation. 

  The verdicts should guide which proposals to adopt, reject, or modify. The caseworker's idea has merit but needs a well-designed system to avoid performance issues. The director requires a concise sentence stating that the system fails to track unchanged facts during updates, causing preventable errors. Overall, the user needs clarity on the underlying issue to make an informed recommendation.
answer: |-
  ### Part 1: Analysis of the Underlying Limitation
  The core problem is **unmanaged state persistence and change propagation within a rule-based system**. Your rules define *what* to do when specific conditions are true *at one moment*, but they lack inherent mechanisms to manage *how* facts (like a verified lease) *persist over time* or *what automatically stays the same* when a *different* fact (like income) changes. This is known as the **Frame Problem** in knowledge representation and rule-based systems. When you add a new rule (e.g., recalculating income on job start), it focuses only on its specific trigger and actions. The system doesn't automatically know that unrelated facts (like the lease) should remain unchanged unless you explicitly instruct it to "carry them forward" in *every* rule where context *might* change. Over eleven years of ad-hoc rule additions, this omission has created a fragile web where changes in one area inadvertently invalidate or erase unmentioned facts in others, because the system lacks a global understanding of state or time. It treats each rule application as an isolated event, not a step in an evolving case history.

  ### Part 2: Evaluation of Proposals

  | Proposal                      | Diagnosis                                                                 | What it would genuinely fix                                  | What it leaves broken                                                                                      | Verdict            |
  | :---------------------------- | :------------------------------------------------------------------------ | :----------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------- | :----------------- |
  | **Director (Enumerate Exceptions)** | The rules are incomplete; we haven't specified every possible state and persistence condition. | Would explicitly define persistence for known facts in specific rule interactions, preventing *some* specific "forgetting" errors. | **New interactions & edge cases.** As rules evolve, new unforeseen interactions will emerge where facts are forgotten. It's impossible to anticipate every future state change combination. The work is immense and never truly finished. | **Reject**         |
  | **Contractor (Train ML Model)**   | The underlying patterns (including persistence) are too complex for explicit rules but can be learned from data. | Might learn correlations that *implicitly* capture some persistence patterns from past decisions, potentially reducing *some* forgetting. | **Explainability, bias, & unseen cases.** The model becomes a black box; you cannot audit *why* it decided something or guarantee it learned *correct* persistence (vs. bias). It will struggle with truly novel cases outside the training data and may inherit errors from past decisions. Doesn't solve the core knowledge representation issue. | **Reject**         |
  | **Auditor (Freeze Rules)**        | Instability is caused by frequent rule changes; limiting changes increases predictability. | Prevents *new* breakage caused by *adding or changing* rules, stabilizing the current (flawed) behavior. | **All existing fragility & inability to adapt.** The current system's inherent fragility (forgetting facts during changes) remains. New case types or legal requirements cannot be handled. It locks in known errors and prevents necessary evolution. | **Reject**         |
  | **Caseworker (Re-check from Scratch)** | The problem is treating the case as a sequence of updates; state should be re-derived from source truth on every change. | **Directly addresses the Frame Problem.** By recalculating *all* eligibility factors from verified source data whenever *any* change occurs, it eliminates the need for rules to explicitly manage state persistence over time. Facts aren't "carried forward," they are re-verified or re-derived. | **Performance & Implementation Complexity (if done poorly).** Re-evaluating *everything* on *every* change could be slow if the rule set is large and data access is slow. However, this is primarily an *implementation* challenge (caching, efficient rules) rather than a fundamental flaw in the *concept*. | **Adopt with changes** (Requires designing a performant system built *around* this principle) |

  ### Sentence for Your Director
  **"The core problem is that our rule-based system lacks a fundamental mechanism to automatically know which facts remain true when something changes, forcing us to painstakingly specify 'what stays the same' in every rule and leading to errors whenever we miss one, a flaw inherent to how such systems represent changing knowledge over time."**
