prompt: |-
  Before I read any more defences or criticisms of significance testing, I want the specification. Write the desiderata that any adequate account of statistical evidence in the empirical sciences must meet: what it has to deliver, which cases it must get right, which distinctions it must respect, and which results it cannot contradict. Treat it as a theory of evidence for a scientific claim rather than a recipe for decision, and make it answerable to the following: optional stopping and stopping rules; analyses chosen after the data have been seen; the large-sample case in which a fixed-threshold test rejects a point null that a Bayesian analysis with a diffuse prior leaves at high posterior probability; the difference between absence of evidence and evidence of absence; a single small study that contradicts a large, well-powered one; the difference that pre-registration does or does not make to the evidential import of the same data; and the fact that replication rates differ across fields. It should also be usable by someone who sees only the published summary and will never re-run the analysis. For each requirement, give the case or consideration behind it and say whether it is non-negotiable or the prejudice of a particular camp; flag any pair that cannot be jointly satisfied — above all, whether the demand for error control under optional stopping can be reconciled with the demand that the evidence depend only on the observed data and the model; and say which single requirement excludes the most of the standard positions. Ultimately I want a list that would tell me whether the replication crisis is a crisis in our statistics or in our institutions.
reasoning: |-
  We are to specify the desiderata for an adequate account of statistical evidence in the empirical sciences. The focus is on evidence for a scientific claim, not decision-making. The account must address the following issues and cases:

  1. Optional stopping and stopping rules.
  2. Analyses chosen after the data have been seen (data dredging, multiple comparisons, etc.).
  3. The large-sample case: fixed-threshold test (like p<0.05) rejects a point null that a Bayesian analysis with a diffuse prior leaves at high posterior probability.
  4. The difference between absence of evidence and evidence of absence.
  5. A single small study that contradicts a large, well-powered one.
  6. The difference that pre-registration does or does not make to the evidential import of the same data.
  7. The fact that replication rates differ across fields.
  8. Usable by someone who sees only the published summary and will never re-run the analysis.

  We must also consider:
  - For each requirement, the case or consideration behind it.
  - Whether it is non-negotiable or the prejudice of a particular camp.
  - Flag any pair that cannot be jointly satisfied.
  - Above all, whether the demand for error control under optional stopping can be reconciled with the demand that the evidence depend only on the observed data and the model.
  - Which single requirement excludes the most of the standard positions.

  Ultimately, the list should help determine whether the replication crisis is a crisis in statistics or in institutions.

  Let's break down each requirement:

  ### Desiderata

  1. **Handling Optional Stopping and Stopping Rules**:
     - **Case**: In many studies, data collection may stop early because the results are already significant (or for other reasons). The stopping rule might be fixed in advance or adaptive.
     - **Requirement**: The account must provide a way to interpret the evidence that does not depend on the stopping rule. That is, the same data should yield the same evidence regardless of how the sample size was determined (e.g., whether the experimenter planned to collect 100 subjects or stopped at 50 because the results were already significant). 
     - **Non-negotiable?**: This is non-negotiable for the likelihood and Bayesian principles (which hold that the stopping rule is irrelevant once the data are observed) but is a point of contention for frequentist methods (which depend on the sampling plan). 
     - **Conflict**: The requirement that evidence depends only on the data and the model (the likelihood principle) is incompatible with the frequentist demand for error control under optional stopping. Frequentist methods (like sequential testing) adjust for optional stopping to control Type I error, but then the same data can lead to different inferences under different stopping rules. This conflict is central.

  2. **Analyses Chosen After the Data Have Been Seen**:
     - **Case**: Researchers often explore the data and then choose which analysis to report (e.g., trying different covariates, transformations, or subsets). This leads to inflated Type I errors and spurious findings.
     - **Requirement**: The account must either (a) incorporate the selection process into the evidential assessment (which would require knowing the space of possible analyses) or (b) provide a way to interpret the evidence that is immune to the selection process (so that the evidence is based solely on the reported data and model). 
     - **Non-negotiable?**: This is non-negotiable for the integrity of evidence. However, it is challenging because the set of possible analyses is often unknown. 
     - **Conflict**: This requirement is difficult to satisfy without knowing the selection process. Pre-registration is one solution, but the desideratum is that the evidential account should not depend on whether the analysis was pre-registered or not (unless the account can adjust for the selection).

  3. **The Large-Sample Case**:
     - **Case**: In very large samples, a point null hypothesis (e.g., zero effect) might be rejected by a fixed-threshold test (e.g., p<0.05) even when the estimated effect is trivial and a Bayesian analysis with a diffuse prior would assign high posterior probability to the null (because the data are consistent with a very small effect). 
     - **Requirement**: The account must not automatically reject a point null hypothesis when the sample size is large and the effect is negligible. It should be able to indicate when an effect is too small to be scientifically meaningful. 
     - **Non-negotiable?**: This is non-negotiable for scientific relevance. A method that always rejects the null in large samples (even for trivial deviations) is not useful. 
     - **Conflict**: This requirement challenges classical NHST (which focuses only on statistical significance) and favors approaches that consider effect sizes and scientific context.

  4. **Distinction Between Absence of Evidence and Evidence of Absence**:
     - **Case**: A non-significant result (e.g., p>0.05) does not necessarily mean the null is true; it might be due to low power. Conversely, a significant result is evidence against the null. 
     - **Requirement**: The account must clearly distinguish between (a) data that are uninformative (low power, so we cannot conclude anything) and (b) data that support the null hypothesis (e.g., showing that the effect is likely to be very small). 
     - **Non-negotiable?**: This is non-negotiable for proper scientific interpretation. 
     - **Conflict**: Classical NHST does not provide evidence for the null, leading to the common error of interpreting non-significance as evidence for the null. Bayesian and likelihood methods can provide evidence for the null.

  5. **A Single Small Study Contradicts a Large, Well-Powered One**:
     - **Case**: A small, underpowered study might by chance find a significant effect in the opposite direction of a large, well-powered study. 
     - **Requirement**: The account must allow that the large study provides stronger evidence and that the small study might be a fluke. However, if the small study is the only one in a new direction, it should not be dismissed entirely. 
     - **Non-negotiable?**: Non-negotiable: evidence should be cumulative and weighted by the strength of the study. 
     - **Conflict**: This is about the aggregation of evidence. Methods that focus solely on p-values without considering power and effect sizes might overemphasize the small study if it is significant and the large one is not (or vice versa). Meta-analytic methods are designed for this, but the desideratum is that the account must handle this without requiring meta-analysis.

  6. **Pre-registration and Evidential Import**:
     - **Case**: Pre-registration is meant to prevent data dredging by specifying the analysis plan in advance. But does the same data have different evidential value if it comes from a pre-registered study versus a non-pre-registered one? 
     - **Requirement**: The account must either (a) assign the same evidential value to the same data regardless of pre-registration, or (b) if it assigns different values, it must be because pre-registration changes the interpretation (e.g., by reducing the space of possible analyses). 
     - **Non-negotiable?**: This is contentious. Some (e.g., frequentists) argue that pre-registration is essential for controlling error rates when multiple analyses are possible. Others (e.g., likelihood/Bayes) argue that the evidence is in the data and the model, so pre-registration doesn't change the evidence. 
     - **Conflict**: The requirement that evidence depends only on the data and the model (likelihood principle) would say pre-registration doesn't change the evidence. But if we require error control over multiple analyses, then pre-registration matters. This is a key conflict.

  7. **Replication Rates Differ Across Fields**:
     - **Case**: Some fields (e.g., psychology) have low replication rates, while others (e.g., genetics) have high ones. 
     - **Requirement**: The account must be able to explain why replication rates differ. This could be due to differences in effect sizes, power, prevalence of false positives, or methodological rigor. 
     - **Non-negotiable?**: Non-negotiable because an account of evidence should be consistent with the observed replication outcomes. 
     - **Conflict**: If an account always assumes that a significant result is evidence for a real effect, it cannot explain low replication rates in some fields. The account must allow for the possibility of inflated effects, publication bias, or low power.

  8. **Usable from Published Summary**:
     - **Case**: Most readers only see the published summary (e.g., effect size, p-value, confidence interval) and cannot re-run the analysis.
     - **Requirement**: The account must allow for evidence assessment based on common summary statistics (like effect size and standard error) without requiring the raw data or the full model details. 
     - **Non-negotiable?**: Non-negotiable for practical use in science. 
     - **Conflict**: Some methods (like full Bayesian analysis) require more details (e.g., prior, model) and are not easily summarized. This requirement favors methods that can be reported in a standard format (like confidence intervals or Bayes factors that can be reported in the paper).

  ### Conflicts and Exclusions

  - **Major Conflict**: The requirement for error control under optional stopping (to prevent inflation of Type I error) and the requirement that evidence depends only on the observed data and the model (the likelihood principle) are fundamentally incompatible. The likelihood principle implies that the stopping rule is irrelevant, but error control requires conditioning on the stopping rule. This conflict is at the heart of the frequentist vs. Bayesian/likelihood debate.

  - **Which single requirement excludes the most standard positions?** The requirement that the evidence must not depend on the stopping rule (i.e., the likelihood principle) excludes all frequentist methods that adjust for stopping rules (like sequential testing). Conversely, the requirement for strict error control under optional stopping excludes Bayesian and likelihood methods that do not control Type I error in the frequentist sense. But the requirement that is most excluding is **the handling of optional stopping without inflating Type I error while adhering to the likelihood principle**. This is a key divide.

  ### Conclusion on the Replication Crisis

  The desiderata will help us see whether the replication crisis is due to:

  - **Statistics**: If the standard statistical methods (like NHST) fail to meet these desiderata (especially in handling optional stopping, post-hoc analyses, and the large-sample case), then the crisis is in statistics.
  - **Institutions**: If the desiderata can be met by sound statistical methods but the institutions (e.g., publication bias, pressure for positive results, lack of pre-registration, selective reporting) prevent their application, then the crisis is in institutions.

  Given that many of the problems (like p-hacking and selective reporting) are enabled by statistical methods that do not meet the desiderata (e.g., NHST without correction for multiple testing or optional stopping) and that the same data can be interpreted differently under different rules, the crisis is likely a combination. However, the above list will show that the standard NHST fails on several counts (like the large-sample case, optional stopping, and the absence of evidence issue) and that institutional practices (like not requiring pre-registration and publishing only significant results) exacerbate the problems.

  ### The List of Desiderata

  1. **Stopping Rule Irrelevance**:
     - *Requirement*: The evidence from the data must not depend on the stopping rule (i.e., the same data should yield the same evidence regardless of whether the sample size was fixed or adaptive).
     - *Case*: Optional stopping can lead to inflated Type I error in frequentist tests if not adjusted for, but adjusting makes the evidence depend on the stopping rule.
     - *Non-negotiable*: According to the likelihood principle, yes; but frequentists consider error control non-negotiable. This is a fundamental conflict.
     - *Conflict*: Directly conflicts with the need for frequentist error control.

  2. **Post-hoc Analysis Robustness**:
     - *Requirement*: The evidence must account for or be immune to the selection of analyses after seeing the data.
     - *Case*: Data dredging leads to spurious findings.
     - *Non-negotiable*: Yes, for avoiding false positives.
     - *Conflict*: Without knowing the selection process, it's hard to adjust. Pre-registration is an institutional solution.

  3. **Large-Sample Sensitivity**:
     - *Requirement*: The method must not reject a point null hypothesis in large samples when the effect is negligible (i.e., it must account for practical significance).
     - *Case*: Large datasets can find statistically significant but trivial effects.
     - *Non-negotiable*: Yes, for scientific relevance.
     - *Conflict*: Challenges NHST.

  4. **Absence vs. Evidence of Absence**:
     - *Requirement*: Must distinguish uninformative data (low power) from data supporting the null.
     - *Case*: Non-significance is often misinterpreted as evidence for the null.
     - *Non-negotiable*: Yes.
     - *Conflict*: NHST does not provide evidence for the null.

  5. **Evidence Weighting by Study Strength**:
     - *Requirement*: The account must allow that a large, well-powered study provides stronger evidence than a small underpowered one, even if the small one has a significant result in the opposite direction.
     - *Case*: Contradictory studies of different sizes.
     - *Non-negotiable*: Yes.
     - *Conflict*: P-values alone do not convey the strength of evidence in a way that is comparable across studies.

  6. **Pre-registration Invariance**:
     - *Requirement*: The evidential import of the same data should not depend on whether the analysis was pre-registered or not, unless the account can adjust for the selection of analyses.
     - *Case*: Does pre-registration change the meaning of the data?
     - *Non-negotiable*: Controversial. Likelihood/Bayes say no; frequentist methods that condition on the analysis plan say yes.
     - *Conflict*: Ties into the post-hoc analysis issue.

  7. **Field Variability in Replication**:
     - *Requirement*: The account must be compatible with the observation that replication rates vary across fields (e.g., due to differences in effect sizes, power, or prevalence of false positives).
     - *Case*: Some fields have high rates of false positives.
     - *Non-negotiable*: Yes, for external validity.
     - *Conflict*: If an account assumes that every significant result is a real effect, it cannot explain low replication rates.

  8. **Summary Statistics Sufficiency**:
     - *Requirement*: The evidence must be assessable from common summary statistics (e.g., effect size, standard error, interval estimates) without needing the raw data or full model details.
     - *Case*: Most readers only see the summary.
     - *Non-negotiable*: For practical use, yes.
     - *Conflict*: Some methods require more details.

  ### Final Note

  The single requirement that excludes the most standard positions is **Stopping Rule Irrelevance (Desideratum 1)**, because it is incompatible with frequentist error control. This requirement is a core part of the likelihood principle, which is violated by most frequentist methods.

  The replication crisis appears to be both:
  - A crisis in statistics: because the dominant method (NHST) fails on several desiderata (1, 3, 4, 5, 6, 7) and encourages practices (like optional stopping and data dredging) that inflate false positives.
  - A crisis in institutions: because even if better methods were available, current practices (selective publication, pressure for positive results) would still lead to unreliable literature.

  However, the statistical shortcomings are foundational. Without an account that meets these desiderata, institutional reforms (like pre-registration) are merely band-aids.
answer: |-
  Below is a specification of desiderata for an adequate account of statistical evidence in the empirical sciences, framed as a theory of evidence (not decision-making). Each requirement addresses a core challenge in statistical inference, with the case or motivation behind it, an assessment of negotiability, and conflicts flagged where they arise. The list is designed to help diagnose whether the replication crisis stems from statistical methods or institutional practices. Requirements are ordered by foundational importance.

  ---

  ### **Desiderata for a Theory of Statistical Evidence**

  1. **Stopping Rule Irrelevance**  
     - **Requirement**: The evidence must depend *only* on the observed data and the statistical model (including parameters). It cannot depend on the stopping rule (e.g., whether data collection stopped due to significance, time, or resources).  
     - **Case**: Optional stopping (e.g., collecting data until \(p < 0.05\)) inflates false positives in frequentist methods. The "same data" should yield the same evidence regardless of the sampling plan.  
     - **Negotiability**: Non-negotiable for evidential purity (likelihood/Bayesian principles). Frequentist error control violates this.  
     - **Conflict**: Directly clashes with *error rate control* (see Desideratum 9). This is the most fundamental tension.  

  2. **Error Rate Control Under Optional Stopping**  
     - **Requirement**: The long-run Type I error rate must be bounded (e.g., ≤5%) even under optional stopping.  
     - **Case**: Without this, researchers can "hack" significance by repeatedly testing data as it accumulates.  
     - **Negotiability**: Non-negotiable for frequentist approaches; negotiable for Bayesians (who prioritize coherence over frequencies).  
     - **Conflict**: Irreconcilable with Desideratum 1 (stopping rule irrelevance). *This pair cannot be jointly satisfied*—choosing one excludes the other.  

  3. **Model Specification Invariance**  
     - **Requirement**: The evidence must not change if the analysis (e.g., choice of covariates, transformations, or tests) is selected *after* seeing the data.  
     - **Case**: "Data dredging" (e.g., trying 20 models and reporting one) inflates false positives. Pre-registration aims to fix this.  
     - **Negotiability**: Non-negotiable for preventing self-deception; but hard to enforce without transparency.  
     - **Conflict**: None if evidence is conditioned on the *final* model, but requires accounting for the *search process* (which conflicts with simplicity).  

  4. **Large-Sample Sensitivity**  
     - **Requirement**: In large samples, a trivial deviation from a point null (e.g., mean difference = 0.001) must not yield "strong evidence" against the null if it is scientifically meaningless.  
     - **Case**: Frequentist tests reject trivial effects with \(N \to \infty\); diffuse-prior Bayesians may retain high posterior probability for the null.  
     - **Negotiability**: Non-negotiable for scientific relevance.  
     - **Conflict**: Excludes pure Neyman-Pearson tests. Favors methods integrating effect size (e.g., Bayes factors or equivalence tests).  

  5. **Absence vs. Evidence of Absence**  
     - **Requirement**: Must distinguish:  
       - *Absence of evidence* (data are insensitive; e.g., wide confidence interval).  
       - *Evidence of absence* (data support negligible effects; e.g., tight interval around zero).  
     - **Case**: A non-significant result (\(p > 0.05\)) in an underpowered study is not evidence for the null.  
     - **Negotiability**: Non-negotiable for accurate interpretation.  
     - **Conflict**: Standard NHST (null hypothesis significance testing) fails this; interval estimates/Bayes factors address it.  

  6. **Evidence Weighting by Informativeness**  
     - **Requirement**: A small, noisy study must not outweigh a large, precise study when they conflict, unless the small study has stronger design/data.  
     - **Case**: A small study finding \(p = 0.04\) (effect size = 1.0) vs. a large study finding \(p = 0.06\) (effect size = 0.1). The latter should dominate.  
     - **Negotiability**: Non-negotiable for cumulative science.  
     - **Conflict**: Fixed-threshold \(p\)-values (e.g., "significant at 0.05") violate this; likelihood ratios/Bayesian updating satisfy it.  

  7. **Pre-registration Invariance**  
     - **Requirement**: The evidential import of data must be identical regardless of pre-registration status, *if the final analysis and model are identical*.  
     - **Case**: Same data/model from a pre-registered vs. exploratory study should convey the same evidence.  
     - **Negotiability**: Negotiable. Frequentists argue pre-registration reduces selection bias; likelihood/Bayes purists reject this.  
     - **Conflict**: Desideratum 3 (model invariance) implies pre-registration *shouldn't* matter, but frequentist error control *requires* it to matter.  

  8. **Field Heterogeneity Compatibility**  
     - **Requirement**: Must explain why replication rates differ across fields (e.g., social sciences vs. genetics) without ad-hoc assumptions.  
     - **Case**: Replication failures may stem from smaller true effect sizes, publication bias, or analytical flexibility in some fields.  
     - **Negotiability**: Non-negotiable for ecological validity.  
     - **Conflict**: None if the theory incorporates field-specific priors (e.g., base rates of effects) or bias models.  

  9. **Summary Statistics Sufficiency**  
     - **Requirement**: Evidence must be computable from common summaries (e.g., effect size, standard error, sample size)—not raw data or proprietary code.  
     - **Case**: Readers of published papers rarely have access to more than test statistics.  
     - **Negotiability**: Non-negotiable for practical adoption.  
     - **Conflict**: Excludes complex Bayesian models requiring custom priors/simulations. Favors standardized outputs (e.g., likelihood ratios).  

  10. **Error Control for Inferential Claims**  
      - **Requirement**: The probability of misleading evidence (e.g., strong support for a false hypothesis) must be controllable.  
      - **Case**: Ensures reliability across repeated use.  
      - **Negotiability**: Non-negotiable for frequentists; Bayesians replace this with coherence.  
      - **Conflict**: Contradicts Desideratum 1 if "error" includes sampling intentions.  

  ---

  ### **Key Conflicts and Exclusions**
  - **Fatal Conflict**: Desideratum 1 (stopping rule irrelevance) and Desideratum 2/10 (error control under optional stopping) are *logically incompatible*. This is the core divide between likelihood/Bayesian and frequentist approaches.  
  - **Most Exclusionary Requirement**: **Desideratum 1 (Stopping Rule Irrelevance)**. This excludes:  
    - All frequentist methods that adjust for stopping rules (e.g., sequential testing).  
    - Any method where evidence depends on unobserved "counterfactual" data (e.g., what *might* have been collected).  
    This requirement alone rules out most textbook frequentist statistics (including *p*-values and confidence intervals) as theories of evidence.  

  - **Other Tensions**:  
    - Desideratum 3 (model invariance) vs. Desideratum 10 (error control): Controlling error rates requires knowing the analysis space, which is unknown in post-hoc selection.  
    - Desideratum 4 (large-sample sensitivity) vs. NHST: Point-null tests are overwhelmed by large samples.  
    - Desideratum 7 (pre-registration invariance): Highlights the Bayesian/frequentist rift on whether "researcher intentions" affect evidence.  

  ---

  ### **Diagnosing the Replication Crisis**
  - **Crisis in Statistics?** Yes, if standard methods fail desiderata:  
    - NHST violates Desiderata 1 (stopping rules), 3 (post-hoc choices), 4 (large samples), 5 (absence of evidence), and 6 (evidence weighting).  
    - This enables *p*-hacking, publication bias, and overconfidence in small effects.  
  - **Crisis in Institutions?** Yes, if practices (e.g., selective publication, pressure for positive results) amplify statistical flaws:  
    - Desideratum 8 (field heterogeneity) and Desideratum 3 (post-hoc analysis) implicate incentives, not just methods.  
    - But better statistics (e.g., Bayes factors, likelihood ratios) can mitigate institutional issues by being more robust to hacking.  
  - **Verdict**: The replication crisis is **both**, but its roots are statistical. Desiderata 1–6 and 9 are violated by NHST, which dominates science. Fixing institutions (e.g., pre-registration) treats symptoms; better evidence theories (e.g., likelihood/Bayesian) address causes.  

  ---

  ### **Summary of Non-Negotiables**
  | **Desideratum** | **Key Non-Negotiable?** | **Primary Camp** |  
  |-----------------|--------------------------|------------------|  
  | 1. Stopping rule irrelevance | Yes (evidence purity) | Likelihood/Bayesian |  
  | 2. Error control under optional stopping | Yes (frequentist reliability) | Frequentist |  
  | 3. Model invariance | Yes (anti-hacking) | Universal |  
  | 4. Large-sample sensitivity | Yes (scientific relevance) | Universal |  
  | 5. Absence vs. evidence of absence | Yes (interpretation) | Universal |  
  | 6. Evidence weighting | Yes (cumulative science) | Universal |  
  | 7. Pre-registration invariance | No (contentious) | Likelihood/Bayesian |  
  | 8. Field heterogeneity | Yes (ecological validity) | Universal |  
  | 9. Summary statistics | Yes (practicality) | Universal |  
  | 10. Error control | Yes (frequentist) | Frequentist |  

  A theory satisfying all desiderata would likely be **likelihood-based** (for Desiderata 1, 3–9) with **frequentist calibration** (for Desiderata 2/10 where possible). No current method achieves this perfectly, but likelihood/Bayesian approaches come closest at the cost of frequentist error guarantees. The replication crisis is primarily a failure of NHST to meet these standards, exacerbated by institutions—but better statistics would reduce institutional vulnerabilities.
