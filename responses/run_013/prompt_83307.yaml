prompt: |-
  ok so i'm trying to build a spec here, not another essay. before i read one more "what is life" paper i want to know what i should be demanding of any answer to that question. give me the desiderata -- the full list of things a theory of life has to deliver to count as adequate, each one with the case or the biology behind it, and say which are non-negotiable and which are just what one camp happens to want.

  here's the kind of stuff it has to get right, and yes i know some of these are cheap shots:

  - a virus. it has a genome, it evolves, it's under selection, but it doesn't run its own metabolism and can't replicate without hijacking a cell. also the giant ones whose genomes are bigger than some bacteria's, and the ones that seem to carry genes for translation-related machinery.
  - a viroid: a bare loop of RNA, no coat, no protein, still makes plants sick and still evolves.
  - a prion: no nucleic acid at all, just a misfolded protein that talks other copies of the same protein into the same shape, and every so often a variant shape that breeds true.
  - a plasmid or a transposon: a chunk of DNA that copies itself around and sometimes jumps species. is it a living thing, or a thing inside a living thing?
  - mitochondria: ex-bacteria, own genome, own ribosomes, but you can't take one out and have it live on its own.
  - a mule. definately alive. can't reproduce. so either reproduction isn't the whole story or the unit of life isn't the individual.
  - a mammalian red blood cell: no nucleus, no genome, no division. a dormant spore, a seed, a tardigrade curled up in cryptobiosis for decades with metabolism at basically zero. a frozen embryo.
  - a lichen, a slime mold that's single cells until it starves and then aggregates, a portuguese man o' war, a bee colony: individual, colony, or one organism?
  - fire, a growing crystal, a computer virus, a self-replicating 3D printer, a clay that seeds more of itself at the crystal edge and occasionally copies with a defect that breeds true.

  and a few i made up so you can't just sort them by remembered verdicts:

  - a protocell in a lab: a fatty acid vesicle that grows by soaking up more lipid, splits when it gets too big, and carries a ribozyme that copies short RNA strands badly. no proteins, no metabolism worth the name.
  - a synthetic cell whose genome is a file on a computer; the physical cell gets built from the file and destroyed when the next file is read. is the file alive? is the lineage? does the answer change if the file is never read again?
  - a lineage whose last member just died. was the species ever alive, and is it dead now, or was "alive" never the sort of thing a species could be?

  what i want back, roughly:

  1. the list of requirements, each with the case or the biology behind it. stuff like: must classify the paradigm cases right; must handle the borderline ones without just legislating; must respect the actual results -- heritable variation, the shared genetic code and common ancestry of everything we know about, membranes and compartments, the thermodynamics of staying ordered far from equilibrium by eating free energy, and the fact that life emerged gradually so there's no sharp first organism unless you can say why; must not be circular (you can't define life in terms of organisms or cells); must be able to answer for life as we don't know it -- silicon, non-carbon, a lineage that lost reproduction entirely; must be operational enough for an astrobiologist or a bio teacher to actually use; and must be either a real distinction in nature or honestly declared a convention.

  2. which of those are genuinely required and which are just prejudices of one camp -- the people who want a sharp yes/no, the people who want "life" to be a natural kind, the people who want it to be a family resemblance / prototype concept, the astrobiologists who just want a detector.

  3. where two of them can't both be had. i especially want the pair or triple that's jointly unsatisfiable, and i suspect it's somewhere between "sharp and binary", "gets every borderline case right", and "tracks a real natural kind". tell me which one to give up, or why i don't have to.

  4. keep the scoring light: at the end, a line or two on which requirement knocks out the most candidates, and how the usual criteria (metabolism, reproduction-plus-evolution, a self-producing network with its own boundary, information/instructions) fare against the list.

  no reading list, no citations, this is for my own notes, so write it like that. and if a table helps for the requirements then seperate them out into one.
reasoning: |-
  Alright, the user is asking for a comprehensive set of criteria that any theory of life must meet. They've provided a list of challenging biological and hypothetical entities, from viruses to synthetic constructs, to test these criteria. I need to break down what they're really after.

  First, they want desiderata—each requirement must be justified by specific cases or biological principles. The user mentioned examples like viruses, prions, mules, and even hypotheticals like protocells. Each of these cases highlights different aspects of life, such as metabolism, reproduction, evolution, and autonomy. 

  The user also wants to know which criteria are non-negotiable versus those that are camp-specific. For instance, astrobiologists might prioritize detectability, while philosophers might care about natural kinds. I need to distinguish between universal requirements (like handling paradigm cases) and preferences (like a sharp binary definition).

  They're concerned about conflicting requirements. The user suspects that a sharp binary definition, covering all borderline cases, and aligning with a natural kind might be incompatible. I should address this tension directly, explaining why satisfying all three is impossible. For example, insisting on a sharp binary might force arbitrary decisions on borderline cases, which don't reflect the gradual evolution of life.

  The user also wants a quick assessment of how current criteria (like metabolism or reproduction) fare against the desiderata. Highlighting where each criterion fails—like reproduction excluding mules—will show why a multifaceted approach is necessary.

  Underlying needs: The user is frustrated with existing theories that don't handle edge cases. They want a practical, operational definition usable in astrobiology or education, but also philosophically robust. They might be developing their own framework or evaluating existing ones, needing clarity on trade-offs. Emphasizing the spectrum approach and context-dependent application could meet their need for both rigor and flexibility.

  I should structure the response with clear desiderata in a table, explain conflicts, and summarize which requirements eliminate most theories. Making it concise and jargon-free, as they requested for personal notes, is key. Avoid citations, focus on logical flow and practical examples. Highlighting that paradigm cases and non-circularity are essential, while sharp boundaries are optional, addresses their need to prioritize. Concluding with the recommendation to allow gradedness resolves their main conflict.
answer: |-
  Here’s a stripped-down spec for a theory of life, built around your cases and core demands. Requirements are ranked by non-negotiability, with conflicts highlighted.

  ### Core Desiderata (The Must-Haves)

  | Requirement                                  | Case/Biology Behind It                                                                 | Non-Negotiable? | Why?                                                                                           |
  | :------------------------------------------- | :------------------------------------------------------------------------------------- | :-------------- | :--------------------------------------------------------------------------------------------- |
  | **1. Handles Paradigm Cases Correctly**      | Bacteria, animals, plants, fungi. Obvious "alive" things.                              | **Yes**         | Fails if it can’t explain the core phenomenon it’s defining.                                   |
  | **2. Non-Circular**                          | Cannot define "life" using "organism," "cell," or "living entity" as primitives.       | **Yes**         | Circularity renders the definition useless for discovery or boundary-setting.                  |
  | **3. Compatible with Gradual Emergence**     | Origin of life (protocells, RNA world). No "first spark" magic; must allow fuzziness. | **Yes**         | Biology & chemistry show life arose incrementally; a theory demanding a sharp start is flawed. |
  | **4. Grounded in Thermodynamics/Physics**    | All life maintains internal order far from equilibrium via energy flow (metabolism). | **Yes**         | Fundamental physics constraint; systems that don’t do this aren’t persistent like life.        |
  | **5. Accommodates Heritable Variation & Evolution** | Viruses, viroids, prions, plasmids, transposons, fire crystals. | **Yes**         | Evolution is the core unifying process in biology; systems lacking this lack life’s history. |
  | **6. Handles Problematic Borderline Cases Without Arbitrary Fiat** | Viruses, prions, mules, RBCs, dormant spores, lichens, protocells. | **Yes**         | A theory that just declares "viruses aren’t life" without principled reasons fails the edge cases. |
  | **7. Agnostic to Specific Chemistry**        | Silicon-based, non-carbon, alien biochemistry, computer files as genomes.              | **Yes**         | Essential for astrobiology & acknowledging life’s potential diversity.                         |

  ### Contested Desiderata (Camp-Specific Preferences)

  | Requirement                                  | Case/Biology Behind It                                                                 | Camp                                                                 | Why Contested?                                                                 |
  | :------------------------------------------- | :------------------------------------------------------------------------------------- | :------------------------------------------------------------------- | :----------------------------------------------------------------------------- |
  | **A. Sharp Binary Classification (Alive/Not)** | Teachers, some philosophers, legal/ethical frameworks.                               | "Sharp Boundary" Camp                                                | Biology (gradual origin, borderline cases) resists sharp lines; forces arbitrary cuts. |
  | **B. "Natural Kind" Status**                 | Philosophers seeking a fundamental category in nature (like "water=H₂O").              | "Essential Property" Camp                                            | Life might be a process/history, not a "thing" with essential properties.      |
  | **C. Individual-Centered**                   | Intuition about cows, people; excludes colonies, lineages, mitochondria.              | "Individual Organism" Camp                                           | Ignores evolutionary units (genes, lineages) & collective entities (colonies). |
  | **D. Requires Active Metabolism**            | Mules, RBCs, dormant spores, frozen embryos.                                          | "Process" Camp (vs. "Evolutionary History" Camp)                    | Excludes clearly biological but metabolically inactive states.                 |
  | **E. Requires Independent Replication**      | Viruses, mitochondria, plasmids, synthetic cells dependent on computers.              | "Autonomy" Camp                                                      | Excludes highly evolved biological entities integrated into larger systems.    |
  | **F. Operational/Detectable Simplicity**     | Astrobiologists needing a Mars rover instrument signature (e.g., metabolism gas swap).| "Practical Detection" Camp                                           | May oversimplify for the sake of tools, missing complex or novel life.         |
  | **G. "Unit of Selection" Requirement**       | Plasmids, transposons, prion strains, computer viruses.                               | "Darwinian Dynamics" Camp (subset of Evolutionary Camp)              | Focuses narrowly on evolutionary mechanics, potentially excluding some states. |

  ### The Unsatisfiable Triad (Pick Two, Maybe)
  You identified it: **Sharp Binary Classification**, **Handles All Borderline Cases Without Arbitrariness**, and **Tracks a Real Natural Kind** are **jointly unsatisfiable**.

  *   **Why?** Biology’s borderline cases (viruses, prions, protocells) and gradual origins **are inherently fuzzy**. Demanding a sharp binary forces arbitrary cuts ("viruses aren't alive!"). Declaring these cuts reveals a "natural kind" fails because the arbitrariness shows it’s *not* fundamental like H₂O. A *true* natural kind wouldn’t have such messy boundaries.
  *   **What to Give Up:** Give up **Sharp Binary Classification**. Accept gradedness (viruses are "more lifelike" than fire but less than bacteria). This allows handling borderlines non-arbitrarily *and* potentially tracks a real, complex natural phenomenon (evolutionary dynamics in far-from-equilibrium systems) without needing simplistic essentialism.

  ### Light Scoring
  *   **Biggest Theory-Killer:** **Handles Problematic Borderline Cases Without Arbitrary Fiat**. Most popular definitions (e.g., "Metabolism + Replication + Evolution") fail spectacularly here (viruses, mules, RBCs, prions, plasmids).
  *   **How Usual Criteria Fare:**
      *   **Metabolism Alone:** Fails mules, spores, RBCs, viruses, prions, files. Too narrow/strict.
      *   **Reproduction + Evolution:** Fails mules, individual RBCs/spores. Needs "lineage" perspective.
      *   **Autopoiesis (Self-producing network + boundary):** Fails viruses, prions, plasmids, files (no self-production). Often circular.
      *   **Information/Instruction (Genetic):** Fails prions, fire/crystals (arguably have "heredity"). Too broad? Needs an evolutionary context.
      *   **The Winner?** None alone. **Evolution within a far-from-equilibrium system** comes closest but needs careful framing (is the virus *itself* the system, or is it the virus+cell?).

  ### The Takeaway for Your Notes
  A minimally adequate theory **must** be **non-circular**, **grounded in thermodynamics & evolution**, **handle paradigmatic & borderline cases coherently**, and **allow for gradedness & unknown chemistries**. Sacrifice the desire for a sharp yes/no to achieve this. Think: **"Open-ended evolutionary processes in persistent, far-from-equilibrium systems."** Whether a *specific instance* (like a frozen virus or a prion) is "alive" depends on context (is it actively evolving in a suitable environment?), not an essential property.
