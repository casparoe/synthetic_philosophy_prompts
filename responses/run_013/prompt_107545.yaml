answer: |-
  Your query exposes a profound tension in assertion theory: the **divorce between epistemic agency and speech agency** in delegated contexts. This separation challenges the core assumptions of individualistic norms. Let's address the stakes systematically, reasoning from the structure of proxy assertion cases.

  ### 1. **The Problem of the "Knowing Subject": Determinacy and Fixing the Relevant Agent**
     When the speaker (S) and the knowing entity (E) diverge, the knowledge norm (KN: "Assert P only if you know P") loses its straightforward application. The critical question is: **Who must know P?**  
     - **Option A (S must know):** This renders most institutional assertions illegitimate, as spokespersons rarely possess personal knowledge of complex organizational facts. The assertion *itself* might be epistemically grounded (via E), but S violates KN.  
     - **Option B (E must know):** This preserves the assertion's epistemic status but redefines "knowledge" collectively. However, collective knowledge isn't identical to individual knowledge—it relies on distributed processes, records, and testimonial chains. KN now governs an entity that doesn't "speak" in the literal sense.  
     **What’s at stake:**  
     - *Epistemic Responsibility*: If E must know, S becomes a mere conduit. Responsibility shifts to E’s structural reliability.  
     - *Normative Force*: If S doesn’t know P, why is S morally or epistemically blameworthy for asserting falsely? The norm’s force dissolves unless tied to S’s role-based duties (e.g., "assert only what E authorizes").  
     - *What fixes the subject?* The context of **delegation**: The relevant knower is determined by the institutional role S occupies. When S speaks *as* E’s proxy, E is the epistemic agent. But this makes KN a norm for institutions, not speakers.  

  ### 2. **Act vs. Agent: The Instability of the Distinction**
     Proxy assertions reveal that norms cannot coherently target *only* the act or *only* the agent—they are entangled:  
     - **Evaluating the act (utterance):** We might ask: "Is P true/known/justified?" But without specifying *by whom*, the evaluation is incomplete. If P is known by E but not S, the utterance is "backed" epistemically, yet S’s lack of access risks undermining its assertoric force (e.g., S cannot defend P under scrutiny).  
     - **Evaluating the agent (utterer):** If we focus on S, we might demand that S *believes* P or *has justification* for P. But in proxy roles, S’s belief may be irrelevant (or even undesirable—e.g., a lawyer asserting a client’s claim). S’s duty is to E, not to P’s truth.  
     **Why the distinction collapses:**  
     - The act’s normative status *depends* on the agent’s relation to E. A spokesperson’s utterance "E believes P" is proper only if E *does* believe P; here, the act’s correctness hinges on E’s state, not S’s.  
     - Conversely, evaluating S requires judging whether S *fulfilled their role* (e.g., "Did S follow E’s protocols?"). This is a distinct norm (role-compliance) that may conflict with epistemic norms—e.g., S might properly assert a false P if E’s procedures were followed.  
     **Stakes:** Epistemic norms (KN, truth) become irrelevant to S if the act’s validity rests solely on institutional backing. The "assertion" morphs into a different speech act—like *testifying to E’s position*, not *affirming P*.  

  ### 3. **The Myth of a Unified Norm: Multiple Bearers, Multiple Norms**
     Proxy cases suggest assertion is governed by **nested norms** satisfied by different bearers:  
     - **Institutional-level norm**: E must satisfy an epistemic condition (e.g., E’s belief in P must be knowledge-apt).  
     - **Speaker-level norm**: S must satisfy a procedural condition (e.g., S’s assertion must accurately represent E’s position and follow E’s protocols).  
     - **Example**: A UN spokesperson asserts, "Sanctions have reduced conflict."  
       - *Institution* must ensure its belief is collectively justified.  
       - *Speaker* must ensure she is authorized to assert it and that her utterance reflects the institution’s stance.  
     **Why not relabeling?**  
     These norms can conflict:  
     - If E knows P but S botches the protocol (e.g., misreads a briefing), the assertion is improper *as an institutional act* even if P is true.  
     - If S knows P personally but E denies it, S’s assertion is improper *as proxy speech* even if epistemically sound.  
     **Stakes:** Assertion’s social function splits:  
     - Proxy assertion serves *institutional coordination* (norms tied to role fidelity).  
     - Individual assertion serves *knowledge dissemination* (norms tied to epistemology).  
     Conflating them obscures why we hold institutions accountable for lies but blame spokespersons for procedural failures.  

  ### Conclusion: What’s Genuinely at Stake
  - **Epistemic democratization**: If norms attach only to individuals, institutions evade direct epistemic accountability.  
  - **Normative granularity**: Proxy cases force us to ask *which aspect* of assertion we aim to regulate: its truth-tracking function (requiring E’s knowledge) or its performative reliability (requiring S’s role-compliance).  
  - **Assertion’s ontology**: The act may not be unitary. "Asserting as oneself" and "asserting as proxy" may be distinct phenomena with different norms—undermining the search for a universal rule.  

  Proxy assertions reveal that the norm of assertion cannot be resolved without first answering: **What is the speaker doing?** If the answer is "channeling an institution," the epistemic norm shifts to the collective, leaving the speaker bound by fiduciary duties. This fractures the individualistic model, demanding a pluralistic approach to assertion norms.
