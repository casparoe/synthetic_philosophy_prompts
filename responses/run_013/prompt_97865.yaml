prompt: |-
  I am currently enrolled in a graduate seminar on rational choice and moral theory, and we have reached the unit on Harsanyi's aggregation theorem — the result that if each individual's preferences over social outcomes satisfy the expected-utility axioms, if the social preference relation satisfies those same axioms, and if the social ranking respects unanimous individual preferences, then the social welfare function must be a weighted sum of the individual utility functions with positive weights. My instructor presents this as the most rigorous available argument that utilitarianism is the morality a rational agent would choose behind a veil of ignorance, and I want to know precisely where the argument bears weight rather than hear the proof again.

  Below are six objections to that reading of the theorem. Please rank them from most to least damaging to the claim that the theorem vindicates utilitarianism, assign each a damage score between 0 and 1, and give one or two sentences justifying each placement. Where you judge two of the objections to be the same objection in different dress, say so explicitly.

  1. The theorem's conclusion is a weighted sum, but each person's expected-utility representation is fixed only up to a positive affine transformation. Adding utilities therefore presupposes a common unit of interpersonal comparison, which the axioms themselves do not provide; the theorem appears to derive comparability while quietly assuming it.

  2. The derivation requires every person to hold a well-defined ranking of lotteries that give them a chance of living any member's life, not merely their own. This idealizes people's evaluative capacities considerably: it is doubtful that ordinary people have any such preferences, so the pivotal step describes an idealized chooser rather than actual welfare.

  3. Passing from a weighted sum to utilitarianism proper requires the weights to be equal, and equal weights require the further assumption that behind the veil each person is equally likely to be anyone. That equiprobability is a moral choice rather than a deliverance of the axioms, so the theorem yields at most weighted utilitarianism, with the substantive work done by an imported assumption.

  4. The theorem treats each person's preferences as given and treats their satisfaction as the sole social good. It is therefore silent on the possibility that preferences are adaptive, formed under deprivation or injustice, so the utilitarianism it supports may be insensitive to the provenance of the preferences it aggregates.

  5. Applying the expected-utility axioms to the social ranking presupposes that social choices are gambles with well-defined probabilities and that sure-thing reasoning is valid for collective choice. Where the relevant probabilities are subjective, two people may endorse the same policy before the fact purely because they disagree about what will happen — one expecting rain, the other not — so the unanimity that drives the result can be spurious, reflecting opposed beliefs rather than a shared judgment about welfare.

  6. The theorem constrains a social preference relation as though society were a single agent with a coherent ordering. But a democratic collective with changing membership need not have any such ordering, in which case the object the axioms are supposed to constrain does not exist and the theorem has no application.

  Two further questions. First, which of these objections, if successful, leaves the theorem's formal result intact but forces a reinterpretation of what it establishes? Second, if you had to strike one objection from the list as not genuinely directed at the theorem, which would it be, and why? I am not asking for the proof to be restated, and I do not need sources or readings; I want the ranking and the reasoning behind it.
reasoning: |-
  Okay, the user is in a graduate seminar on rational choice and moral theory, focusing on Harsanyi's aggregation theorem. They've already studied the proof and now want to critically evaluate how well the theorem supports utilitarianism, especially behind a veil of ignorance. They've listed six objections and want them ranked by how damaging they are to that claim, with damage scores and justifications. They also have two follow-up questions about which objections force reinterpretation and which might be irrelevant.

  First, I need to understand each objection clearly. The user is clearly deep into this material, so my response should be precise and philosophically rigorous. They're not looking for a proof recap but for a critical analysis of the theorem's limitations in justifying utilitarianism.

  Looking at the objections:
  1. Interpersonal comparability - the theorem assumes utility comparisons it claims to derive.
  2. Idealization of preferences - real people can't rank lotteries about being others.
  3. Equal weights requirement - equiprobability is a moral choice, not axiomatic.
  4. Adaptive preferences - ignores how preferences are formed under injustice.
  5. Subjective probabilities - unanimity might reflect belief differences, not shared welfare.
  6. Society as single agent - collectives may not have coherent preferences.

  Ranking these is tricky. The most damaging should strike at the core of the theorem's ability to justify utilitarianism. Objection 1 seems fundamental because without interpersonal comparability, the weighted sum lacks meaning - it's mathematically there but ethically empty. I'll give it 0.95 damage. Objection 3 is also crucial because equal weights are needed for pure utilitarianism, and the equiprobability assumption smuggles in a moral premise; that's 0.85 damage. Objection 5 about subjective probabilities undermines the unanimity premise by showing apparent agreement can be illusory (0.75 damage). 

  Objection 4 on adaptive preferences challenges the normative basis but doesn't break the theorem's logic (0.65 damage). Objection 2 about idealization is a practical limitation but doesn't refute the theoretical argument (0.55 damage). Objection 6 questioning society-as-agent might invalidate the theorem's applicability entirely but feels more meta (0.45 damage).

  For the follow-ups: Objections 1, 2, 4 leave the formal result intact but force reinterpretation - they show the conclusion might not imply what utilitarians claim. Objection 6 is the weakest because the theorem explicitly assumes a social preference relation; denying that assumption means the theorem doesn't apply, but it's not an internal critique.

  The user's underlying need seems to be discerning where Harsanyi's argument genuinely proves utilitarianism versus where it relies on contested premises. They want ammunition for seminar debates by understanding which criticisms are decisive versus peripheral. My ranking should help them prioritize which objections are most substantive in challenging the utilitarian interpretation.
answer: |-
  Here is the ranking of objections from most to least damaging to the claim that Harsanyi's theorem vindicates utilitarianism, with damage scores and concise justifications:

  **Ranking & Damage Assessment:**  
  1.  **Objection 1 (Interpersonal Comparability)**  
      **Damage: 0.95**  
      *Justification:* Directly undermines the meaningfulness of the weighted sum by showing the theorem *presupposes* cardinal interpersonal comparability while appearing to derive it. Without this, the sum is arbitrary, gutting utilitarianism's core claim.  
  2.  **Objection 3 (Equal Weights & Equiprobability)**  
      **Damage: 0.85**  
      *Justification:* Reveals the theorem alone cannot yield *utilitarianism* (equal weights), only weighted utilitarianism. Equiprobability in the veil is a substantive moral/political choice smuggled in, not a logical consequence of the axioms.  
  3.  **Objection 5 (Subjective Probabilities & Spurious Unanimity)**  
      **Damage: 0.75**  
      *Justification:* Severely weakens the key "unanimity" axiom. If individuals agree on an action based on conflicting *beliefs* (not values), forcing social preference to respect this "unanimity" distorts welfare aggregation and invalidates the normative force.  
  4.  **Objection 4 (Adaptive Preferences)**  
      **Damage: 0.65**  
      *Justification:* Challenges the normative foundation by exposing that aggregating *given* preferences can entrench injustice if preferences adapt to deprivation. This questions whether satisfying preferences *is* welfare, a core utilitarian commitment assumed, not proven.  
  5.  **Objection 2 (Idealization of Preferences)**  
      **Damage: 0.55**  
      *Justification:* Highlights a significant *practical* limitation and idealization (people ranking "being anyone" lotteries), making the theorem describe an abstract rational chooser, not actual welfare. Damages empirical relevance but less fatal to the *logic* of the derivation.  
  6.  **Objection 6 (Society as a Single Agent)**  
      **Damage: 0.45**  
      *Justification:* Questions the very applicability of the theorem by denying its core *assumption* (that a coherent social preference exists). If this is rejected, the theorem simply doesn't apply, but it doesn't *internally* contradict the derivation given its premises.  

  **Note on Similarity:** Objections 1 and 4 are distinct. Objection 1 is about the *measurement* of utility (cardinal comparability). Objection 4 is about the *content* of utility (whether preferences reflect true welfare given their origin).

  ---

  **Answers to Further Questions:**

  1.  **Which objections leave the formal result intact but force reinterpretation?**  
      Objections **1**, **2**, and **4** leave the formal mathematical result (the existence of a weighted sum SWF given the axioms) intact. They force reinterpretation by showing this result does *not* establish utilitarianism as normatively compelling: Objection 1 shows the sum lacks interpersonal meaning; Objection 2 shows it describes an idealized chooser, not actual welfare; Objection 4 shows aggregating given preferences may not maximize genuine welfare.

  2.  **Which objection would you strike as not genuinely directed at the theorem?**  
      **Objection 6**. The theorem *explicitly assumes* a social preference relation satisfying the EU axioms exists. Objection 6 *denies this assumption* for real societies. While a valid critique of applying the theorem to actual democracies, it attacks the *premise* rather than the internal logic or derivation of the theorem itself. It argues the theorem is irrelevant, not that its conclusion doesn't follow from its axioms.
