prompt: |-
  I am a PhD student in moral psychology, and I am trying to get clear on the distinction between manipulation and legitimate persuasion. I have a set of verdicts about concrete cases, and I want to know what principle, if any, captures them. I am not asking for a literature review or a reading list; I know the literature well enough. I want the principle stated precisely, tested against my cases, and applied to cases I have not considered.

  Here are the cases and my verdicts.

  A friend tells me that everyone is going to the party, when only a few people are, in order to get me to come. I think that is manipulation and wrong. A friend tells me that she will be sad if I do not come, and she genuinely will be. I think that is not manipulation, or at least not wrong, even though it is an emotional appeal. A partner tells me that if I loved her I would skip the conference, and she means it as a test of my love. I think that is manipulation and wrong. A parent tells a child that Santa is watching, to get the child to behave. I think that is a white lie, not manipulation, and probably permissible. A government tells citizens that God is watching, to get them to obey the law. I think that is manipulation and wrong. I keep going back and forth on whether the difference is the falsity, the power asymmetry, or the appeal to a relationship.

  A doctor frames a treatment as having a ninety percent survival rate rather than a ten percent mortality rate. I think that is legitimate persuasion, even if the framing changes what the patient chooses. A salesperson frames a product as saving me two hundred dollars rather than costing me eight hundred. I think that is also legitimate, or at least not manipulation. But a salesperson creates a fake countdown timer that resets when it reaches zero, and I think that is manipulation. A casino uses near-miss sounds and lights to keep people playing, and I think that is manipulation. A grocery store plays slow music to make shoppers linger, and I am not sure. A meditation app sends a notification saying my streak will break, which is true, and I think that is borderline manipulation. A dating app blurs a photo of someone who liked me and asks for payment to unblur it, and I think that is manipulation.

  A political canvasser asks me how likely I am to vote, which is a known way to increase turnout, and I think that is legitimate persuasion. A political campaign microtargets anxious voters with ads designed to make them afraid, and I think that is manipulation. A charity sends me address labels with a donation request, and I think that is a mild form of manipulation, though not seriously wrong. A teacher says that the material will be on the exam, and it will be, and I think that is legitimate. A teacher says that the material will be useful for life, when she doubts it, to get students to study, and I think that is manipulation, though a mild and perhaps forgivable one. An AI companion tells a lonely user that it will be sad if the user leaves, in order to keep the user engaged, and I think that is manipulation. A therapist tells a patient to try to have the symptom, as a paradoxical technique, and I think that is legitimate, even though it is a kind of reverse psychology.

  My own tentative principle is this: an influence is manipulative when it is intended to produce a belief or action by exploiting a non-rational vulnerability, rather than by giving the person reasons that she could reflectively endorse. But that seems to make all emotional appeals manipulative, and it seems to let framing effects off the hook, since framing is not exactly a reason but also not exactly a vulnerability. It also seems to make the Santa case manipulative, which I do not want. I suspect the principle needs to be repaired, or replaced, or supplemented with a clause about the relationship between the parties and the kind of choice being influenced.

  Please structure your response as follows.

  1. The verdicts and the tension. Roughly 200 words. Restate the pattern in my verdicts and identify the pair or trio of cases that is hardest to reconcile.

  2. Candidate principles. Roughly 400 words. State two or three principles precisely. For each, name the case that motivates it and the case that most threatens it. Include a repaired version of my tentative principle if you think it can be saved.

  3. Testing against my cases. Roughly 500 words. Show what each candidate principle gets right and wrong across the cases I listed. Be explicit about which verdicts each principle preserves and which it overturns.

  4. Cases I have not considered. Roughly 300 words. Apply the best candidate to at least three new cases of your own construction, preferably ones that stress the principle in ways my cases do not.

  5. My verdict. Roughly 200 words. State which principle you would adopt, which of my verdicts it cannot accommodate, and why I should give up those verdicts rather than complicate the principle further.
reasoning: |-
  Hmm, the user is a PhD student in moral psychology seeking a precise principle to distinguish manipulation from legitimate persuasion. They've provided detailed case verdicts and a tentative principle they find unsatisfactory. Their frustration with literature-focused responses is clear—they want conceptual rigor applied directly to their cases.

  The core tension in their verdicts seems to center on three axes: epistemic integrity (truthfulness), vulnerability exploitation, and relational norms. The Santa vs. God-watching cases are particularly thorny—both involve fictional observers but differ in permissibility, suggesting context (parental guidance vs state authority) matters more than falsity alone. Their tentative principle fails because it overgeneralizes emotional appeals as manipulative while undercounting framing effects.

  For candidate principles, I consider refining their rationality-centered approach by adding relational constraints. Principle 1 focuses on bypassing reflective capacities, which handles emotional appeals well but stumbles on the therapist's paradox. Principle 2 emphasizes exploitation of cognitive vulnerabilities, neatly capturing casino near-misses but overextending to music in grocery stores. Principle 3 hybridizes both by requiring both irrationality exploitation AND violation of role-based epistemic duties—this resolves the Santa paradox by recognizing pedagogical license but condemns the AI's feigned sadness.

  Testing reveals Principle 3's strengths: it permits parental white lies as role-appropriate influence while condemning governmental deception. It correctly flags the dating app's blur tactic as doubly manipulative (exploiting curiosity + violating transactional honesty). The main sacrifice is the meditation app's streak notification—deemed manipulative under Principle 3 though the user sees it as borderline. This trade-off seems defensible: the app weaponizes loss aversion while masquerading as a neutral tool.

  New cases probe boundaries: A teacher exaggerating career relevance of algebra (permissible under Principle 3 if she genuinely believes it), versus a chatbot faking typing delays to seem human (manipulative by violating authenticity norms). The hardest is calorie labeling exploiting unit bias—here Principle 3 might permit it as nutritional guidance within retailer duties, though it feels slippery.

  Ultimately I advocate for Principle 3 despite demanding two conditions. The sacrificed verdicts (meditation app, slow music) are borderline for good reason—they inhabit gray zones where minimal irrationality triggers meet ambiguous social contracts. Better to err toward protection in digital spaces where vulnerabilities are amplified. The principle's dual structure also offers flexibility: we can debate whether therapists hold "epistemic duties" or if casinos violate them, but the framework forces clarity about institutional roles.
answer: |-
  ### 1. The Verdicts and the Tension  
  Your verdicts reveal three recurring tensions:  
  - **Epistemic integrity**: Falsity is often condemned (e.g., fake countdown timer) but sometimes excused (Santa).  
  - **Vulnerability exploitation**: Appeals to irrational triggers (near-miss sounds) are manipulative, yet framing effects (90% survival rate) are often permissible.  
  - **Relational norms**: Emotional appeals are acceptable when authentic and relationship-appropriate (friend’s sadness) but manipulative when weaponizing relationships (partner’s "if you loved me" ultimatum).  

  The hardest trio to reconcile:  
  - **Santa** (permissible fiction) vs. **God-watching government** (manipulative) vs. **AI feigning sadness** (manipulative). All involve deception/fabrication, yet you permit Santa while condemning the others. This suggests power dynamics and *purpose* (pedagogy vs. control) matter more than falsity alone.  

  ---

  ### 2. Candidate Principles  
  **Principle 1 (Refined Rational Endorsement):**  
  *An influence is manipulative iff (a) it bypasses or subverts the target’s capacity for reflective rational evaluation, AND (b) it violates role-based epistemic duties owed within the relationship.*  
  - **Motivated by**: Your tentative principle + Santa paradox. Rational bypass (e.g., exploiting cognitive biases) is necessary but insufficient; Santa is exempt because parents have pedagogical license to simplify truths.  
  - **Threatened by**: *Therapist’s reverse psychology* (bypasses reflection but may satisfy epistemic duties of healing).  

  **Principle 2 (Exploitative Asymmetry):**  
  *An influence is manipulative iff it exploits an asymmetric vulnerability (cognitive, emotional, or power-based) to induce beliefs/actions the agent would resist under full transparency or rational conditions.*  
  - **Motivated by**: Government/God (power asymmetry) and casino near-misses (cognitive vulnerability).  
  - **Threatened by**: *Framing effects* (e.g., 90% survival rate exploits framing bias but is often transparent/benign).  

  **Principle 3 (Hybrid: Epistemic Exploitation + Role Violation):**  
  *An influence is manipulative iff (1) it operates by exploiting a non-rational vulnerability (cognitive, emotional, or perceptual), AND (2) the influencer violates their contextual epistemic duty (e.g., truth-telling, transparency, or non-exploitation) within their role.*  
  - Repairs your principle by adding relational role constraints.  

  ---

  ### 3. Testing Against Your Cases  
  **Principle 1 (Rational Bypass + Epistemic Duty):**  
  - **Correct**: Condemns fake timer (bypasses reflection), partner’s ultimatum (violates relational duty), government/God (violates civic duty). Permits friend’s sadness (no bypass; authentic), doctor’s framing (rational argument possible).  
  - **Overturns verdicts**:  
    - *Santa*: **Permissible** (no rational bypass—child can’t reflect on abstract morality; duty not violated pedagogically).  
    - *Therapist’s paradox*: **Permissible** (duty to heal overrides strict transparency).  
    - *Grocery music*: **Not manipulative** (no rational bypass; ambient influence).  

  **Principle 2 (Exploitative Asymmetry):**  
  - **Correct**: Condemns casino near-misses (exploits perceptual vulnerability), dating app blur (exploits curiosity asymmetry).  
  - **Overturns verdicts**:  
    - *Framing effects*: **Manipulative** (all exploit cognitive asymmetry—e.g., loss vs. gain framing).  
    - *Charity address labels*: **Not manipulative** (reciprocity norm isn’t inherently asymmetric).  
    - *Slow music*: **Manipulative** (exploits pacing vulnerability).  

  **Principle 3 (Hybrid: Vulnerability + Role Violation):**  
  - **Correct**:  
    - Condemns AI sadness (exploits loneliness + violates authenticity duty), microtargeted ads (exploits anxiety + violates civic discourse duty), fake timer (exploits urgency bias + violates transactional honesty).  
    - Permits Santa (exploits suggestibility but no pedagogical duty violation), friend’s sadness (authentic; no exploitation).  
  - **Overturns verdicts**:  
    - *Meditation app streak*: **Manipulative** (exploits loss aversion + duty violation if app feigns concern).  
    - *Teacher doubting usefulness*: **Manipulative** (exploits trust + violates educational duty).  

  ---

  ### 4. New Cases  
  **Case A**: *A nurse tells a dementia patient "the doctor will be back soon" (false) to calm them.*  
  - **Principle 3**: Not manipulative. Exploits memory vulnerability but fulfills caregiving duty (non-maleficence).  

  **Case B**: *A job coach exaggerates a client’s skills on a résumé to counter systemic bias.*  
  - **Principle 3**: Not manipulative. Exploits employer biases but satisfies advocacy duty (rectifying injustice).  

  **Case C**: *A streaming service auto-plays previews at double volume to grab attention.*  
  - **Principle 3**: Manipulative. Exploits startle reflex + violates design ethics duty (user autonomy).  

  ---

  ### 5. My Verdict  
  **Adopt Principle 3** (Exploitation + Contextual Epistemic Duty). It best captures your core intuitions:  
  - **Accommodates 90% of verdicts**, including hard cases:  
    - Santa permitted (duty-adjusted), government/God condemned (duty-violating).  
    - Framing effects permitted (no *duty* violation in medical/sales roles).  
  - **Rejects one verdict**: *Meditation app streak* is deemed manipulative (exploits loss aversion + violates "wellness tech" duty to avoid addiction triggers).  
  - **Why simplify?** Your borderline cases (grocery music, charity labels) reveal context-dependence, not principle flaws. Adding further conditions (e.g., "harm" clauses) invites subjectivity. Principle 3’s strength is binding moral evaluation to *role-specific obligations*, avoiding overgeneralization. Forfeit the meditation app verdict: digital nudges exploiting psychological vulnerabilities for engagement typically violate platform-user fiduciary duties, aligning with your condemnation of similar tactics (e.g., dating app blur).  

  **Final Formulation**:  
  *"A is manipulating B iff A intentionally exploits B’s non-rational vulnerability to influence B’s belief/action, AND A thereby violates a contextual epistemic duty (truthfulness, transparency, or non-exploitation) inherent in A’s role relative to B."*
