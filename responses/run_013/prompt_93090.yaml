prompt: |-
  ok here's what i'm stuck on. i'm putting together a session for a working group on moral epistemology, and the topic is the preference/bias thing — you know, when is a moral judgement a bias and when is it just a preference, or a commitment, or a taste. the more i read the more i think nobody actually has a theory here, they just have a vibe about which judgements they want to call biased.

  so before i go any further: what would a theory of this distinction have to do? give me the desiderata. i want:

  - the cases it has to get right, each one with the case attached, not just the abstract requirement
  - the distinctions it can't collapse
  - the things it has to be consistent with (empirical stuff counts)
  - which of these are non-negotiable and which are just what one camp happens to want
  - and if some pair of them can't be had together, say so loudly, thats the part i actually care about

  some things i want the list to speak to, because these are the ones that keep breaking my drafts:

  the case where the judgement comes out of a grubby process and turns out to be right anyway — does the grubbiness still make it a bias; the case where someone's preference has been shaped by their circumstances until they can't tell it apart from a conviction (the fox and the grapes, but with something that actually matters morally); the case where you can see your own conviction is probably a bias and can't just stop having it; the fact that calling something a bias is itself a move in an argument and usually ends it; the fact that any account of the form bias = judgement produced by a distorted process needs some way of telling distorted processes from ordinary ones that doesn't just check whether they landed on the right answer; and the awkward one where bias seems to mean off the truth, but we want the word to do work against people whose moral views we think are false, without assuming our own are true. also, i'm using bias in the loaded sense, a distortion, not just something you're partial to — though part of the question is whether those two ever come apart.

  and: is it a distinction in kind, or a continuum with a line drawn somewhere — and if its a continuum, who draws the line and on what grounds. also tell me which single requirement does the most work, i.e. rules out the most otherwise attractive views.

  purpose, so the bar isn't crazy: i want a theory we could actually use in the room, to adjudicate two people who each think the other's judgement is a bias and not a preference. so a list thats extensionally perfect but unusable from the inside doesn't help me much — flag it if you think those two pull against each other.

  skip the bibliography. if you want, one short paragraph at the end on how a purely procedural account, a purely genealogical/debunking one, and a purely coherentist one fare against the list — but the list is the thing.
reasoning: |-
  Okay, the user is putting together a session on moral epistemology focusing on distinguishing between moral biases and preferences. They feel existing approaches are vibe-based and want a robust framework. Let me unpack their query.

  First, they need desiderata for a theory: cases it must handle, distinctions to maintain, consistency with empirical data, non-negotiables vs. negotiables, and potential conflicts. The highlighted cases include grubby processes leading to correct judgments, shaped preferences (like Fox and Grapes), awareness of one's own bias, the argument-stopping power of "bias," defining distorted processes without outcome-dependence, and avoiding truth-relativism while critiquing others' morals.

  They also question if the distinction is categorical or continuous, and who decides. Plus, they need the theory usable in real-time discussions. The main goal is adjudicating disputes where each party calls the other biased.

  Starting with cases. The "grubby process" case: say someone holds a moral belief for selfish reasons but it aligns with a justified moral truth. The theory must mark the process as biased regardless of outcome. Then, the Fox and Grapes scenario: adaptive preference formation where someone's circumstances shape their moral conviction. The distinction here is between authentic preferences and those distorted by oppression. The third case is self-aware bias: knowing a belief is likely biased but unable to drop it. This challenges theories that require conscious control.

  Next, the argumentative role: labeling something as bias can shut down dialogue. The theory must allow this move without being question-begging. Then, defining distorted processes without circularity. Using reliability or functional norms instead of outcomes. The "awkward case" involves critiquing others' morals without assuming infallibility. A good theory needs a non-relativist but fallibilist approach.

  Key distinctions: bias vs. preference, adaptive vs. authentic preferences, process vs. outcome. Non-negotiables: avoiding outcome-dependence, accommodating self-aware bias, non-question-begging critique, process-based distortion. Conflicts arise between epistemic access (needing to know processes) and usability in real-time. Also, process vs. outcome independence might clash with empirical findings that outcomes sometimes inform process evaluations.

  The user's deeper needs: a practical tool for facilitators, avoiding theoretical perfection that's unusable. They might also want to empower participants to recognize biases without requiring deep introspection. Ensuring the framework is accessible and not overly reliant on inaccessible mental processes.

  For desiderata, non-negotiables include outcome-independence, non-question-begging critiques, and handling adaptive preferences. The "who draws the line" issue suggests procedural elements might be necessary for group settings. The hardest requirement is usability vs. epistemic depth, leading to a hybrid model with procedural heuristics.

  In the response, structuring desiderata clearly with cases and conflicts highlighted. Emphasizing the tension between internal usability and external correctness. Pointing out that procedural accounts are usable but might lack depth, while genealogical ones are critical but harder to apply mid-discussion. Coherentist approaches are accessible but might not handle oppression cases well. The key is balancing these for the working group's needs.
answer: |-
  Here’s a rigorous set of desiderata for a theory distinguishing moral **bias** (a distorting influence) from **preference/commitment/taste** (a non-distorted stance), based on your constraints. I’ve prioritized *practical adjudication in a working group* while flagging tensions.

  ---

  ### **Core Desiderata: What the Theory Must Do**

  1. **Handle the "Grubby Process/Right Outcome" Case**  
     - *Case*: A wealthy executive opposes sweatshop labor *solely* because it makes her feel guilty about her privilege, not out of concern for workers. Her judgement aligns with independently justified moral truth.  
     - *Requirement*: The theory must classify this as **biased** (due to the distorting motivation: guilt-avoidance over moral concern), *even though the judgement is correct*.  
     - *Non-negotiable*: **Outcome-independence**. Bias must be defined by the *process/origin*, not the truth-value of the judgement.

  2. **Address "The Fox and the Grapes" (Adaptive Preference)**  
     - *Case*: A person raised in a rigid caste system sincerely believes their social position is "just their lot in life" and morally acceptable, despite systemic oppression. They’ve internalized limitation as virtue.  
     - *Requirement*: The theory must classify this as **biased** (distorted by oppression), NOT a mere preference. It must distinguish *authentic* preferences (e.g., "I prefer jazz") from *adaptive* ones shaped by coercion/lack of alternatives.  
     - *Non-negotiable*: **Sensitivity to power/oppression**. A theory that collapses this into "preference" legitimizes false consciousness.

  3. **Acknowledge "Self-Aware Bias"**  
     - *Case*: A person knows their distrust of a social group likely stems from childhood trauma, not evidence, yet they cannot shake the feeling that members of this group are untrustworthy.  
     - *Requirement*: The theory must allow that a judgement can be **biased** *even if the holder recognizes its dubious origin*. It cannot require ignorance of bias to count as bias.  
     - *Negotiable*: Whether this *mitigates* blame, but not whether it negates bias.

  4. **Explain the Argument-Stopping Power of "Bias"**  
     - *Case*: In a debate on affirmative action, one side accuses the other of "racial bias," halting substantive discussion.  
     - *Requirement*: The theory must explain why "bias" accusations function as **conversation-stoppers**: They imply the judgement isn’t a sincere moral commitment but a *distortion*, making reasoned dialogue seem futile.  
     - *Non-negotiable*: **Distinction in justificatory weight**. Biased judgements lack (or have severely diminished) standing in moral reasoning/argument.

  5. **Define "Distorted Process" Without Circularity**  
     - *Requirement*: The theory must specify **procedural/epistemic criteria** for "distortion" that don’t rely on *whether the judgement matches the theorist’s own moral view* or an independent moral truth.  
     - *Key*: Leverage empirical psychology (e.g., processes known to generate *false beliefs* in non-moral domains: motivated reasoning, in-group favoritism, affect heuristic) or functional norms (e.g., responsiveness to evidence, coherence).  
     - *Non-negotiable*: **Non-question-begging criteria**. Criteria must be defensible neutrally.

  6. **Resolve the "Awkward Case" (Critiquing Without Dogmatism)**  
     - *Requirement*: The theory must enable criticizing others' judgements as biased **without assuming the critic’s own moral framework is infallible**. It must be **fallibilist** and **non-relativist**.  
     - *How*: Focus on *process flaws* (e.g., "Your view ignores counter-evidence," "It’s driven by group loyalty") rather than *substantive incorrectness* ("You’re wrong").  
     - *Non-negotiable*: **Avoids moral realism/anti-realism traps**. Works pragmatically within pluralism.

  7. **Distinguish Bias from Mere Partiality/Preference**  
     - *Case*: Prefering to help family over strangers due to love vs. believing family *deserves more moral consideration* because "blood matters more."  
     - *Requirement*: The theory must mark the latter as *potentially biased* if it involves **unjustified generalization** or **socially entrenched distortion** (e.g., nepotism norms), while the former is a non-moral preference.  
     - *Key Distinction*: **Bias makes a claim to justificatory force**; mere preference does not.

  ---

  ### **Structural & Meta-Requirements**

  8. **Continuum vs. Kind**:  
     - Must treat the distinction as a **continuum** (degree of distortion) but provide **practically usable thresholds** for calling something "biased" in discourse.  
     - *Who Draws the Line?*: The theory must specify **procedural heuristics** usable by participants (e.g., "Does this judgement exhibit known cognitive distortions?", "Is it revisable with counter-evidence?").

  9. **Consistency with Empirical Evidence**:  
     - Must accommodate:  
       - **Implicit Bias** (unconscious distortions measurable via IATs affecting moral judgements).  
       - **Cultural Variability** (What counts as "distortion" may depend on context, but not infinitely relativized – e.g., caste-based "duty" is biased if it reflects internalized oppression).  
       - **Moral Dumbfounding** (People hold strong moral judgements they cannot justify – often a sign of bias).

  10. **Single Most Important Requirement (Rules Out Most Views)**:  
      **"Outcome-Independence + Non-Question-Begging Process Criteria"**. This sinks:  
      - Simple Reliabilism (if the process reliably produces "truth," how defined without circularity?).  
      - Pure Coherentism (oppressive norms can be internally coherent).  
      - Naive Realism ("It’s biased because it’s false").  
      - Vibe-Based Debunking ("It feels icky, so it’s biased").

  ---

  ### **Key Tensions & Conflicts (Loudly Stated!)**

  1. **Usability vs. Epistemic Depth**:  
     - *Conflict*: A theory requiring deep, inaccessible psychological introspection (e.g., "Was this preference formed under idealized conditions?") is **unusable in real-time adjudication**. Yet, a superficial theory (e.g., "Does it feel intuitive?") collapses key distinctions.  
     - *Resolution Needed*: **Procedural heuristics** (e.g., "Can you articulate reasons resilient to mild counter-evidence?") that proxy for depth without requiring it.

  2. **Process Purity vs. Outcome-Informed Process Assessment**:  
     - *Conflict*: Insisting on *pure* process criteria (ignoring outcome) clashes with the empirical fact that **persistent deviation from consensus/evidence *is* how we often identify flawed processes**.  
     - *Resolution Needed*: Use *outcomes as evidence about process* (e.g., "Views consistently favoring the powerful warrant extra scrutiny") without *defining* bias by outcome.

  3. **Fallibilism vs. Critique Authority**:  
     - *Conflict*: If no one is infallible, how can anyone legitimately label another’s judgement "biased"? Risks paralysis.  
     - *Resolution Needed*: **Defeasible criteria + burden-shifting**. Accuser points to specific process flaws (e.g., ignoring victims' testimony); accused must show their process isn’t distorted *by those standards*.

  ---

  ### **How Major Approaches Fare Against the List**

  *   **Purely Procedural (e.g., Rawlsian/Scanlonian Reasonability)**:  
      Strong on **non-question-begging critique** (focuses on public reasons) and **usability** (clear heuristics: "Could others reasonably reject this?"). Weak on **adaptive preferences** (oppressed groups may "reasonably" accept oppression) and **outcome-independence** (implicitly assumes reasonable=just). Struggles with **self-aware bias**.

  *   **Purely Genealogical/Debunking (e.g., influenced by Nietzsche/Singer)**:  
      Strong on **adaptive preferences** and **exposing grubby origins**. Weak on **non-question-begging criteria** (often relies on critic’s substantive view of "corruption") and **usability** (complex historical/psychological analysis). Can be **dogmatic** (assumes origins determine invalidity).

  *   **Purely Coherentist (e.g., reflective equilibrium)**:  
      Strong on **continuum view** and **internal usability** ("Does this cohere?"). Weak on **outcome-independence** (coherent false beliefs possible) and **adaptive preferences** (oppressive worldviews can be coherent). Struggles with **defining "distortion"** without independent anchors.

  **The Winner? Likely a Hybrid**: **Procedural-Psychological**. Uses process heuristics (responsiveness to evidence/reasons, susceptibility to known distortions) informed by empirical psychology and fallibilism, with special scrutiny for views benefiting the powerful or formed under oppression. This balances usability, non-question-beggingness, and sensitivity to key cases like adaptive preferences and grubby processes.
