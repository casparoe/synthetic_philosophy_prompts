answer: |-
  The current pattern of protecting vertebrates while largely excluding insects, despite comparable debates about sentience and vastly greater numbers, reveals an **implicit moral framework** that is philosophically unstable and primarily pragmatic. Its foundations are best reconstructed as follows:

  **1. The Strict Presupposition: A Threshold View of Sentience Probability**  
  At its core, the practice *logically requires* a threshold conception of moral status. Protection is triggered only if an animal is deemed *sufficiently likely* to be sentient (where "sufficiently" is often anchored to vertebrate neurology as a benchmark). Crucially, this threshold operates as a **binary gatekeeper**:  
  - If the probability of sentience clears the threshold (e.g., mammals, birds, cephalopods), the animal is morally considerable—*regardless of numbers*.  
  - If the probability is below the threshold (e.g., insects), the animal is excluded—*regardless of numbers*.  

  This explains why trillion-scale insect farming attracts no *intrinsic* moral concern proportional to scale. Numbers alone cannot compensate for perceived epistemic uncertainty below the sentience threshold. The dismissal of scale as morally irrelevant ("they’re *just* insects") stems from this binary logic.

  **2. What it Accommodates: Pragmatic and Anthropocentric Convenience**  
  While the threshold view provides a *minimal necessary condition*, the practice comfortably accommodates non-philosophical factors:  
  - **Administrative tractability**: Regulating vertebrate research/livestock is complex but feasible; monitoring trillions of insects is perceived as logistically impossible.  
  - **Cultural salience**: Vertebrates (especially mammals) evoke stronger intuitive empathy; insects trigger aversion or indifference ("creepy crawlies").  
  - **Epistemic conservatism**: Defaulting to vertebrate-centric models avoids challenging established legal/ethical systems with radical uncertainty.  
  - **Economic interests**: Industrial insect farming exploits the threshold to avoid welfare costs.  

  These factors reinforce the threshold but are not *strictly presupposed* by it. One could theoretically uphold a sentience threshold while still demanding insect protections if evidence emerged—yet the inertia of pragmatism makes this unlikely.

  **3. Philosophical Underdetermination**  
  The practice is **underdetermined** in key respects:  
  - *Justifying the Threshold*: Why is the probability threshold set at vertebrate-level neurology? This appears arbitrary, not derived from an ethical principle.  
  - *Ignoring Expected Value*: A consistent utilitarian ("expected suffering") approach *would* demand weighing tiny probabilities against vast numbers. The practice implicitly rejects this calculus without justification.  
  - *Scale as Dismissal vs. Alarm*: Using scale *against* moral concern (e.g., "there are too many to care about") contradicts ethical theories where scale amplifies duty. This inconsistency remains unresolved.

  **4. Rebuilding Practice on Probability-Weighted Scale**  
  If welfare frameworks explicitly incorporated probability-weighted scale, radical changes would follow:  

  - **Sentience Probability Assessments**: Formal, taxon-specific evaluations (e.g., for Diptera vs. Hymenoptera) would be mandatory, using criteria like behavioural complexity, neural integration, and analgesic response.  
  - **Moral Weight Formula**: Protection would hinge on:  
    `(Estimated sentience probability) × (Number affected) × (Intensity/duration of harm)`  
    This could grant a hive of 50,000 honeybees greater moral weight than a single mouse in some contexts.  
  - **Tiered Safeguards**: High-volume industries (e.g., insect farming) would require:  
    - Automated welfare monitoring (e.g., AI tracking stress behaviours)  
    - Humane slaughter standards  
    - Density/environmental limits  
  - **Research Ethics**: Insect studies exceeding population thresholds would need ethics review, with justification for numbers used.  
  - **Legislative Caps**: Limits on legal insect biomass per facility, tied to welfare capacity.  

  **Conclusion**  
  Current practice presupposes a **threshold view of sentience probability** while being comfortably accommodated by pragmatic constraints. It dismisses scale as morally irrelevant below the threshold—a position philosophically arbitrary but administratively convenient. Adopting an explicit probability-weighted scale approach would force a reckoning with potential mass suffering, demanding scalable welfare innovations and challenging anthropocentric biases. The trillionfold asymmetry in protection rests less on ethical coherence than on the convenience of ignoring what we find innumerable or incomprehensible.
