answer: |-
  Here is a list of desiderata for an adequate theory of self-deception, structured as requested. The criteria are motivated by core phenomena, necessary distinctions, and fundamental constraints, drawing on your specified cases and broader philosophical/psychological concerns. British English is used throughout.

  ---

  ### **I. Core Explananda: Test Cases Any Adequate Theory Must Accommodate**

  1.  **The Spousal Fidelity Paradigm (SFP):**
      *   **Case:** A person sincerely avows their spouse's fidelity despite overwhelming, readily available evidence to the contrary (e.g., lipstick on collar, unexplained absences, direct testimony). Their avowal feels sincere, not merely performative.
      *   **Motivation:** The central, textbook case demanding explanation. Captures the stark conflict between sincere belief and evidence.
      *   **Status:** **Non-negotiable.** Failure here renders a theory inadequate for the core phenomenon.

  2.  **Avowal-Conduct Divergence (ACD):**
      *   **Case:** A person loudly and sincerely professes confidence (e.g., in their business acumen, their health prognosis) but their behaviour systematically betrays underlying doubt or fear (e.g., obsessive checking, seeking excessive reassurance, avoiding decisive tests).
      *   **Motivation:** Highlights the potential dissociation between professed belief and guiding behaviour, a hallmark of self-deception's complexity.
      *   **Status:** **Non-negotiable.** Reveals a tension central to the phenomenon.

  3.  **Negative Self-Deception (NSD):**
      *   **Case:** Someone believes themselves to be worthless, incompetent, or disliked *beyond* what the available evidence warrants, often driven by fear, anxiety, or past trauma.
      *   **Motivation:** Demonstrates self-deception is not solely about positive illusions or wishful thinking; it can involve motivationally driven *pessimism*.
      *   **Status:** **Non-negotiable.** A theory must explain self-deception's bi-directionality (towards flattery *or* disparagement).

  4.  **Socially Scaffolded Deception (SSD):**
      *   **Case:** A group (e.g., a family, cult, political faction) sustains a shared, flattering falsehood (e.g., "our leader is infallible," "our family is uniquely virtuous") that individual members might not stably believe independently. Belief is reinforced through mutual affirmation and suppression of dissent.
      *   **Motivation:** Shows self-deception can be interpersonally sustained and maintained, not solely an intrapsychic phenomenon.
      *   **Status:** **Highly Desirable (approaching Non-negotiable).** Crucial for understanding real-world, collective forms.

  5.  **Unwitting Memory Distortion (UMD):**
      *   **Case:** Memories of past events are gradually and unconsciously altered to fit current needs or reduce dissonance (e.g., recalling a rejected job application as "never really wanting it anyway"), without any conscious awareness of distorting or deceiving.
      *   **Motivation:** Illustrates self-deception can operate passively and retrospectively, without contemporaneous intention.
      *   **Status:** **Non-negotiable.** A common and robustly documented form.

  6.  **Strategic Ignorance / Avoidance (SIA):**
      *   **Case:** Someone actively avoids acquiring potentially distressing knowledge (e.g., never opening the medical test results, changing the subject when bad news looms), thereby maintaining a more comfortable (but potentially false) belief state.
      *   **Motivation:** Represents a "borderline" or precursor case where belief is preserved *by* avoiding evidence, raising questions about negligence vs. active deception.
      *   **Status:** **Essential.** Any theory must situate this behaviour within the self-deception landscape.

  ### **II. Essential Distinctions: Phenomena an Adequate Theory Must *Not* Collapse**

  7.  **Distinction from Weakness of Will (Akrasia):**
      *   **Case:** Knowing the best course of action (e.g., quitting smoking) but failing to act on it due to temptation, *without* forming a false belief about the harms of smoking.
      *   **Motivation:** Self-deception involves *belief* formation/maintenance, not merely action failure against better judgement.
      *   **Status:** **Non-negotiable.**

  8.  **Distinction from Simple Wishful Thinking:**
      *   **Case:** Hoping for a desired outcome (e.g., sunny weather for a picnic) without genuinely *believing* it will occur.
      *   **Motivation:** Wishful thinking need not involve belief; self-deception does (even if false or conflicted).
      *   **Status:** **Non-negotiable.**

  9.  **Distinction from General Self-Serving Bias:**
      *   **Case:** A tendency to interpret ambiguous information in a way that benefits the self (e.g., taking more credit for success than failure), which *may* lead to self-deception but is a broader cognitive tendency.
      *   **Motivation:** Self-serving bias is a *mechanism* that *can* cause self-deception, but they are not identical. Not all biases result in sustained, sincere false belief.
      *   **Status:** **Essential.** A theory must explain how bias *culminates* in deception.

  10. **Distinction from Denial (as coping mechanism):**
      *   **Case:** Refusing to *acknowledge* or *confront* a painful truth emotionally or verbally, potentially temporarily, without necessarily forming a contradictory *belief*.
      *   **Motivation:** Denial may be behavioural or emotional avoidance; self-deception involves a doxastic state (however flawed).
      *   **Status:** **Essential.** Clarifies the cognitive component.

  11. **Distinction from Lying to Others:**
      *   **Case:** Knowingly stating a falsehood to mislead another person.
      *   **Motivation:** Self-deception involves the deceiver *being* the deceived, fundamentally altering the intentional structure.
      *   **Status:** **Non-negotiable.**

  ### **III. Consistency Constraints: Principles an Adequate Theory Must Adhere To**

  12. **The Phenomenal Sincerity Constraint (PSC):**
      *   **Requirement:** Must account for the subject's *sincere sense* of conviction in the deceptive belief (as in SFP). The belief isn't merely feigned.
      *   **Motivation:** Directly observed in core cases (SFP, ACD avowal). Undercuts simple pretence models.
      *   **Status:** **Non-negotiable.**

  13. **The Behavioural Betrayal Constraint (BBC):**
      *   **Requirement:** Must account for how behaviour can systematically reveal an awareness or belief *contrary* to the avowed one (as in ACD).
      *   **Motivation:** Observed in paradigmatic cases. Challenges theories claiming self-deception results in a simple, unified false belief.
      *   **Status:** **Non-negotiable.**
      *   **Tension:** **PSC and BBC appear jointly difficult to satisfy without some form of mental partitioning or temporal instability.** How can one sincerely believe *P* while acting consistently on *not-P*?

  14. **The Non-Contradiction Constraint (NCC):**
      *   **Requirement:** Must avoid positing the subject simultaneously holding outright, occurrent, contradictory beliefs (P and not-P) in a way that violates standard logic or belief attribution practices.
      *   **Motivation:** Foundational to belief psychology and rationality. Safeguards against homuncularism.
      *   **Status:** **Non-negotiable.**

  15. **The Partition Avoidance Mandate (PAM):**
      *   **Requirement:** Must explain self-deception without positing full-blown sub-personal homunculi ("agents" or "persons") within the mind that intentionally deceive each other.
      *   **Motivation:** Avoids regress (who deceives the deceiver?) and aligns with scientific understanding of the mind as a unified, albeit complex, system.
      *   **Status:** **Non-negotiable.** A critical anti-homuncular principle.

  16. **Motivated Reasoning Compatibility (MRC):**
      *   **Requirement:** Must be consistent with robust empirical findings on motivated reasoning and biased assimilation (e.g., how desires influence evidence search, interpretation, and memory recall).
      *   **Motivation:** Self-deception must be plausible within the empirically documented landscape of human cognitive biases.
      *   **Status:** **Non-negotiable.**

  17. **Belief Attribution Coherence (BAC):**
      *   **Requirement:** Attributions of belief based on avowal and behaviour must be made coherent by the theory, resolving apparent conflicts (like those in SFP and ACD) without undue strain.
      *   **Motivation:** Maintains connection to how we ordinarily understand and attribute beliefs.
      *   **Status:** **Essential.**

  ### **IV. Key Tensions and the Primary Excluder**

  *   **Primary Tension:** The most significant potential conflict lies between the **Phenomenal Sincerity Constraint (PSC)** and the **Behavioural Betrayal Constraint (BBC)**, exacerbated by the **Non-Contradiction Constraint (NCC)** and **Partition Avoidance Mandate (PAM)**. Satisfying PSC and BBC simultaneously, without violating NCC or PAM, is the central challenge. Theories often sacrifice one to save the others.
      *   *Intentionalist/Partitioning Theories:* Sacrifice PAM (and often strain NCC).
      *   *Motivationalist/Deflationist Theories:* Struggle with BBC (or reinterpret it away) and sometimes strain PSC in core paradigms like SFP.
      *   *Pretence/Attention Models:* May struggle with genuine PSC ("sincere" pretence?).

  *   **The Most Excluding Requirement:** The **Partition Avoidance Mandate (PAM)** does the most to exclude popular theories. It directly invalidates classic intentionalist models reliant on homuncular subsystems. It also forces non-intentionalist theories (motivational bias, deflationary) to provide a genuinely non-homuncular account of the *doxastic tension* central to self-deception (i.e., explaining PSC *and* BBC without little deceivers). Many theories stumble precisely here, either embracing partitions or failing to adequately explain the behavioural evidence of contrary awareness.

  ### **V. Brief Scorecard of Camps Against Desiderata**

  *   **Intentionalist/Interpersonal Model (Partitioning):**
      *   **Strengths:** Handles SFP, ACD (via partitioning), PSC, BBC (via different parts), SSD (potentially), Distinctions (clear from lying/akrasia).
      *   **Weaknesses:** Violates **PAM** and often strains **NCC** (simultaneous contradictory beliefs). May struggle with **UMD** (lack of intention) and **SIA** (negligence vs intention). **MRC** compatibility varies.

  *   **Motivational Bias/Deflationist (No Intention, No Partition):**
      *   **Strengths:** Satisfies **PAM**, **NCC**, **MRC**, **UMD**, **SIA**, **SSD** (via social motivation). Distinguishes from lying/akrasia. Handles **NSD**.
      *   **Weaknesses:** Struggles profoundly with **PSC** in SFP (can motivational bias *really* explain *sincere conviction* against overwhelming evidence?) and **BBC** (if the belief is unified, why the behaviour?). Often reinterprets core cases or downplays BBC. **BAC** can be strained.

  *   **Pluralist/No Single Phenomenon:**
      *   **Strengths:** Flexible; can potentially assign different mechanisms to different cases (e.g., SFP vs UMD vs SIA), satisfying **PAM**, **NCC**, **MRC** for relevant sub-types.
      *   **Weaknesses:** Risks being unfalsifiable or failing to explain what, if anything, unifies phenomena *called* self-deception. May struggle to provide a unified account satisfying **BAC** across types. Can appear ad hoc.

  *   **Pretence/Attention Models:**
      *   **Strengths:** Can handle **SIA**, aspects of **SSD**, potentially **ACD** (avowal as performance), satisfies **PAM**, **NCC** (if pretence isn't belief). Compatible with **MRC**.
      *   **Weaknesses:** Struggles severely with **PSC** in SFP (is the avowal *merely* pretence? Does it feel sincere?). May collapse distinction from denial or wishful thinking. **BBC** might be explained (acting "as if" not believing), but **BAC** for sincere belief is problematic.

  ---

  This framework provides the rigorous adjudicative criteria you require. The inherent tension between sincerity, behavioural betrayal, non-contradiction, and non-homuncular explanation highlights why the debate persists: satisfying all core desiderata simultaneously, particularly **PSC**, **BBC**, **NCC**, and **PAM**, may indeed be the fundamental challenge that existing camps resolve in mutually incompatible ways. Your subsequent analysis can now rigorously test each theory against this benchmark. Good luck with the chapter.
