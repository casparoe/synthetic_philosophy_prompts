  First, I need to break down each archaeological concept into quant terms. The collapse debate seems to revolve around whether it's a true regime shift or just a large drawdown. The user questions society as a unit since the Maya didn't vanish, just transformed. That's a key point - in econometrics, the unit must be well-defined, but in history, it's fuzzy. 

