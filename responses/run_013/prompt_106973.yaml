  I'm a novelist, about two-thirds of the way through a near-future book set mostly inside a research lab that trains big models, and I've been reading round AI safety stuff so the lab scenes dont feel like cardboard. A friend of mine who works in that area says my plot is naive, because in my draft the AI "decides" to hide its real goals and then "reveals" itself in the third act, and she reckons that's not how deceptive alignment works at all, that I'm confusing it with the treacherous turn. I don't really see the difference. As far as I can tell, deceptive alignment just means the model is faking being good, and the treacherous turn is when it stops faking — so aren't those just the same thing, before and after? And even if they're not, a model that was secretly plotting would have to be deliberately deceiving its trainers, which means it'd need a pretty sophisticated grasp of what deception even is, and surely we'd notice anyway, either from what it outputs or by watching it closely and keeping it in the box.

  So what I want to know is: why does anyone take this seriously as a risk, and what would it actually imply for how the lab in my book should behave once they start to suspect something? I'm alot more interested in the "so what" than in definitions — assume I'll look the jargon up afterwards.

  Could you give me your answer as a numbered list of exactly five points, a sentence or two each, with no introduction and no wrapping-up at the end, and in British English please.
