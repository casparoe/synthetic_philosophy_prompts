prompt: |-
  My friend and I got into a two-hour arguement last night about whether there's actually a principled difference between "revisionist" history and "denialist" history, or whether "denialist" is just the word you slap on the revision you don't happen to like. He came out swinging with the usual stuff — every generation revises the record, historians who buck consensus get ostracized, "denial" is a thought-terminating cliché you use to avoid engaging — and honestly I couldn't give him a clean answer even though I'm sure he's wrong. Why I care: I sit on the three-person accuracy panel for a decent-sized history podcast/channel, and maybe twice a month we have to make a call. A viewer, a guest, or a whole segment makes a claim that guts some accepted atrocity — something about the Holocaust, or the Armenian genocide, or Nanjing — and we have to decide whether we're looking at a legitimate revisionist arguement we should actually engage, or denial we should pull. We get about a week, we have one consulting historian who's stretched thin and basically just signs off, and none of us is a specialist in the period in question. Right now we eyeball it and it feels arbitrary and I hate it.

  Can you build us a real decision procedure — a checklist we can run in maybe half an hour, in order, each step saying what counts as passing, where it stops and says "this is denial, pull the segment," and where it has to hand the thing to a person because it's turned into a values question instead of a factual one? Ground it in whatever the people who actually study this distinction argue, but do not hand me a reading list or citations — I can't look anything up and I don't want the procedure resting on sources nobody on my panel can check; give me the substance itself. Please bake in the tests I half-remember from the fight and whatever better ones you've got: the idea that denial is asymmetrically skeptical (maximum scrutiny on the mainstream account, none on its own), the "what would it take to change your mind" test, and the split between revising what happened and revising what it means. Then run it on three cases: one that's clearly legitimate revision (say, someone arguing a famine death toll was lower, backed by new archival material), one that's clearly denial (the classic package where the gas chambers were really delousing stations and the numbers are wildly inflated), and one where I'm emotionally on the wrong side — a claim I'd love to be true — so I can see whether the thing still bites when it costs me. And be honest about where this procedure will misfire, because if it just launders my priors I'd rather find that out now than in a public retraction.
reasoning: |-
  Okay, the user is part of a history podcast's accuracy panel and needs a clear, practical checklist to distinguish between legitimate historical revisionism and denialism. They’ve been in arguments about whether "denialist" is just a label for disliked revisions, and their current process feels arbitrary. They need something actionable, grounded in scholarly principles but without relying on citations they can’t verify. 

  First, I need to unpack the core tension they’re facing: their friend argues revisionism is always subjective ("denialist" is just a slur for unpopular views), while the user intuitively knows some claims cross into dangerous territory (Holocaust denial, etc.). The panel’s dilemma is real—they’re not specialists, have limited time, and need consistency. 

  Key elements they mentioned: asymmetric skepticism (scrutiny only on mainstream accounts), the "what would change your mind" test, and separating factual disputes from interpretive ones. They also want three test cases: clear revision, clear denial, and a "tempting" denial to check bias. And crucially, they want honesty about where the method could fail.

  Hmm, the academic foundation here comes from epistemology and historiography—things like Popper’s falsifiability, historical method standards (sourcing, contextualization), and genocide studies frameworks (like the UN criteria). But I must distill this into plain tools, no jargon. 

  Start by defining revisionism neutrally: it’s refining narratives with new evidence or perspectives, within scholarly norms. Denialism is pseudohistory—cherry-picking, ignoring counterevidence, politicized. The checklist needs to flag tactics, not conclusions. That’s key—it’s about how the claim is argued, not whether it challenges orthodoxy. 

  Building the checklist step-by-step:  
  1. **Sourcing transparency**—does the claim hide its evidence? Denialists often obscure sources.  
  2. **Asymmetric skepticism**—applies hyper-scrutiny to mainstream accounts but none to alternatives.  
  3. **Falsifiability**—if no evidence could ever change their mind, it’s dogma.  
  4. **Counterevidence engagement**—denial ignores or dismisses contrary proof.  
  5. **Methodology**—does it reject standard historical tools? (e.g., claiming archives are all forged).  
  6. **Scale vs. interpretation**—distorting core facts (e.g., "no deaths occurred") vs. reinterpreting causes.  
  7. **Motivational framing**—accusing historians of conspiracies? Big red flag.  

  For the test cases:  
  - **Clear revision**: New archival work adjusting famine tolls. Passes all checks—transparent, falsifiable, engages counterevidence.  
  - **Clear denial**: Holocaust denial tropes. Fails multiple steps (ignores evidence, unfalsifiable, cries conspiracy).  
  - **"Tempting" denial**: Something like "colonialism had net benefits"—but if it handwaves atrocities, it fails the counterevidence step. User might want it true, but method bites back.  

  Where it misfires: Nuanced debates where evidence is thin (e.g., ancient history), or when denialists mimic scholarly tone. Also, ideological blind spots—if the panel unconsciously favors "reasonable-sounding" denial. Stress that step 7 (human cost) is a judgment call; they’ll need guts to pull content even if it’s well-argued denial.  

  Finally, hammer home: this tool won’t replace expertise. If steps 4-6 trigger, consult their historian. But it’ll make their current "eyeballing" 80% less arbitrary.
answer: |-
  Here’s a concrete, step-by-step decision procedure grounded in historical methodology and epistemology. It focuses on **how the claim is argued**, not the claim itself. Run these steps in order — if it fails any step before Step 7, it’s denial. Stop and pull the segment. If it passes all steps, it’s legitimate revisionism worthy of engagement.

  ---

  ### **The Checklist: Distinguishing Revisionism vs. Denialism**

  1. **SOURCE TRANSPARENCY**  
     - *Ask:* Does the claim explicitly cite *verifiable* sources (archives, data, peer-reviewed work)?  
     - **Pass:** Lists specific sources, locations (e.g., "Box 12, Archive X"), or methods to access evidence.  
     - **Fail:** Vague references ("many scholars say"), anonymous claims, or reliance on decontextualized snippets.  
     - **Denial Flag:** Obscures origins of evidence to avoid scrutiny.  
     - *Stop here if failed.*

  2. **SYMMETRICAL SKEPTICISM**  
     - *Ask:* Does the argument apply the *same* level of scrutiny to its own claims as it does to mainstream accounts?  
     - **Pass:** Acknowledges limitations of its own evidence (e.g., "This new data has gaps in regional coverage").  
     - **Fail:** Demands "perfect proof" for mainstream views while accepting its own evidence uncritically.  
     - **Denial Flag:** Asymmetric burden of proof (e.g., "Unless you have photos of every death, the toll is inflated").  
     - *Stop here if failed.*

  3. **FALSIFIABILITY TEST**  
     - *Ask:* What specific, testable evidence would make the claimant change their mind?  
     - **Pass:** Names concrete evidence (e.g., "If excavation reports show mass graves at Site X, I’d reconsider").  
     - **Fail:** Dismisses counterevidence as fabricated, biased, or irrelevant (e.g., "All documents about Event Y are forgeries").  
     - **Denial Flag:** Unfalsifiable ideology ("Nothing could convince me this happened").  
     - *Stop here if failed.*

  4. **ENGAGEMENT WITH COUNTEREVIDENCE**  
     - *Ask:* Does the argument address the *strongest* counterevidence (not just weak examples)?  
     - **Pass:** Engages with key pillars of the mainstream account (e.g., "While survivor accounts say X, my findings suggest Y because...").  
     - **Fail:** Ignores/dismisses robust evidence (e.g., forensic reports, contemporaneous records) without analysis.  
     - **Denial Flag:** Cherry-picking isolated anomalies to discredit entire events.  
     - *Stop here if failed.*

  5. **METHODOLOGICAL COHERENCE**  
     - *Ask:* Does the argument use standard historical methods?  
     - **Pass:** Follows accepted practices (e.g., contextualizing sources, acknowledging historiographical debates).  
     - **Fail:** Rejects fundamental methods (e.g., "Archives are all corrupted, so I rely on logic").  
     - **Denial Flag:** Conspiracy framing (e.g., "Historians are lying to serve Group Z").  
     - *Stop here if failed.*

  6. **SCALE VS. INTERPRETATION**  
     - *Ask:* Is the dispute about *what happened* (scale/events) or *what it means* (interpretation/causes)?  
     - **Pass:** Focuses on interpretation (e.g., "This famine was due to weather, not policy").  
     - **Fail:** Denies core facts *without new evidence* (e.g., "Deaths didn’t occur" when evidence proves they did).  
     - **Gray Zone:** New evidence challenging scale (e.g., "Tolls were 20% lower") — proceed to Step 7.  
     - *If core facts are denied without evidence, stop here.*

  7. **HUMAN COST ACKNOWLEDGMENT**  
     - *Ask:* If the claim minimizes harm, does it still acknowledge suffering occurred?  
     - **Pass:** Concedes baseline harm (e.g., "This was tragic, but not genocidal").  
     - **Fail:** Erases/trivializes victimhood (e.g., "Deaths were common in war; no atrocity happened").  
     - **Decision Point:** *Requires human judgment.* If harm is denied, it’s denialism. If acknowledged, it’s revisionism.  

  ---

  ### **Test Cases**

  **Case 1: Legitimate Revisionism**  
  *Claim:* "New Soviet archives show the 1932-33 famine death toll was 2M, not 7M."  
  - **Step 1:** Pass (cites specific archival fonds).  
  - **Step 2:** Pass ("Archives are incomplete but suggest lower tolls").  
  - **Step 3:** Pass ("If future data shows higher numbers, I’ll adjust").  
  - **Step 4:** Pass (engages demographic studies).  
  - **Step 5:** Pass (uses standard archival analysis).  
  - **Step 6:** Pass (revises scale, not existence).  
  - **Step 7:** Pass ("This remains a tragedy").  
  - **Verdict:** Revisionism — engage.

  **Case 2: Clear Denialism**  
  *Claim:* "Auschwitz gas chambers were for delousing; numbers are exaggerated."  
  - **Step 1:** Fail (vague "engineering reports" not cited).  
  - **Step 2:** Fail (ignores Zyklon B residue studies; demands "perfect proof").  
  - **Step 3:** Fail ("No evidence could convince me").  
  - *Stop at Step 3.*  
  - **Verdict:** Denial — pull.

  **Case 3: The "Tempting" Denial (Where You’re Biased)**  
  *Claim:* "The Belgian Congo atrocities are myths; colonial archives prove infrastructure improved lifespans."  
  *(You’d love this to be true — but test it):*  
  - **Step 1:** Pass (cites colonial health reports).  
  - **Step 2:** **Fail** (Demands "irrefutable proof" for atrocity accounts but accepts colonial data uncritically).  
  - *Stop at Step 2.*  
  - **Why it bites:** Asymmetric skepticism invalidates it. Even if you *want* it true, the method flags denialist tactics.  

  ---

  ### **Where This Misfires (Be Honest)**  
  1. **"Polite" Denialism:** Sophisticated actors mimicking academic tone (e.g., citing fake journals). Step 5 (methods) usually catches this.  
  2. **Emerging Fields:** Disputes with scarce evidence (e.g., ancient history) — Step 3 (falsifiability) may falsely flag.  
  3. **Your Blind Spots:** If you *want* a claim to be true, you might rationalize past Step 2 failures. Mitigation: **Always require Step 2 pass** from the *most skeptical panel member*.  
  4. **"Bothsidesism":** Legitimate debates where evidence is truly contested (e.g., economic causes of a war). The checklist flags this as "engage" (it passes all steps).  

  **Critical Note:** This tool **does not replace expertise**. If Steps 4–6 trigger doubts, default to your consulting historian. But for 90% of cases, this separates *how we know* from *what we feel*.
