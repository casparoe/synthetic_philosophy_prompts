  **Editor's Note:** *Dear Impartial Spectator offers guidance derived solely from the principles of moral sentiment, striving to discern the judgment of the unbiased observer within us all.*

  ---

  **Dear Impartial Spectator,**
  *My colleague, "Barry," presented our joint project findings to senior management. He barely mentioned my contributions, implying it was largely his work. Management praised him effusively. I feel furious and betrayed. Everyone in the office seems fine with it, though, even admiring Barry’s “initiative.” Should I confront him? Demand credit? Or just swallow it since no one else seems bothered?*
  *— Unseen in Accounts*

  **Dear Unseen,**
  Your resentment is natural. The sense of injustice arises when we perceive an action directed at us which no impartial onlooker could readily enter into. Barry’s presentation, by diminishing your essential contribution, likely exceeds what an unbiased spectator would deem proportionate reward for his own efforts relative to yours.

  However, we must distinguish carefully. Your anger stems from the *injury* perceived. The propriety of your sentiment depends on its concordance not with the actual applause Barry received from management (which may spring from incomplete information or admiration for his boldness alone), but with what an uninvolved spectator, understanding the full division of labour, would feel towards Barry's *action*. Such a spectator would likely find Barry's appropriation blameworthy, even if the actual spectators present did not.

  Confrontation carries risks to harmony. Consider: would demanding credit now, after the applause has settled, appear proportionate to an impartial judge, or merely spring from wounded pride? The *man within the breast* advises us to seek what is praiseworthy, not merely what is praised. Perhaps a quiet word with Barry, expressing how his presentation made you feel overlooked in a way you believe an impartial judge would find reasonable, would be more conducive to future propriety and mutual sympathy than a public scene. Self-command allows you to act on this inner verdict, even if the office crowd continues to admire Barry.

  ---

  **Dear Impartial Spectator,**
  *News is filled with horrific disasters – earthquakes, famines, wars – causing immense suffering far away. I know intellectually this is terrible. But honestly? I don’t *feel* much. My neighbour wept over the latest tragedy report, and I felt like a monster for my numbness. Yet I can’t force sorrow I don’t feel. Is this a moral failing?*
  *— Apathetic in Akron*

  **Dear Apathetic,**
  Do not condemn yourself unduly. Sympathy, that fellow-feeling with the affections of others, arises most readily from vivid imagination and immediacy. The suffering of distant strangers, conveyed through brief reports, often lacks the force necessary to engage our sentiments fully. We are finite creatures, our sympathies naturally stronger for those near us, whose circumstances we can readily picture.

  Your neighbour’s tears demonstrate a lively imagination successfully picturing the scene of distress, allowing her to enter into the sufferers' sentiments. Your lack of immediate feeling does not signal a hardened heart, but perhaps only the difficulty of vividly conceiving calamities so removed from your daily experience.

  The impartial spectator judges the *propriety* of our sentiments. While we admire the person of lively and extensive sympathy, the spectator understands the limits of human imagination. He does not demand you feel the *same* grief as your neighbour, or the victim, but rather an appropriate degree of compassionate unease. Your intellectual recognition of the horror *is* a form of sentiment, a cooler but no less real fellow-feeling. Strive to imagine the plight more concretely – perhaps focusing on a single family’s story within the larger tragedy – to cultivate a sympathy the impartial spectator would find proportionate. But do not scourge yourself for failing a test of immediate, overwhelming emotion that few could honestly meet.

  ---

  **Dear Impartial Spectator,**
  *My family has always been prominent in our community, known for philanthropy. Frankly, our recent $50,000 donation to the new hospital wing was motivated less by pure charity and more by the expectation of our name being on the plaque and the social capital it brings. My spouse thinks this is cynical and hollow. I argue the hospital gets the money regardless, and fulfilling social expectations maintains goodwill that benefits our business and other causes. Who has propriety on their side?*
  *— Plaque-Conscious Philanthropist*

  **Dear Plaque-Conscious,**
  A complex question, touching upon the often-blurred line between the love of being *praised* and the love of being *praiseworthy*. The impartial spectator readily enters into the joy of the hospital administrators and future patients receiving such substantial aid; the benefit is real, and your action conduces to it.

  However, the spectator also peers inward to the motive. He distinguishes between actions done chiefly for the intrinsic propriety of relieving need (praiseworthy from within), and those done chiefly for the applause and advantage the action attracts (seeking only to be praised). Your own account leans heavily toward the latter.

  The actual spectators in your community may indeed praise you, dazzled by the sum and the plaque. But the *impartial* spectator, the man within the breast, asks: would you have given so freely, or at all, if the donation were entirely anonymous? If the answer is no, then the action, while materially beneficial, springs from a motive the impartial judge finds less admirable than pure benevolence. Your spouse’s unease reflects this inner discord.

  Self-command in this instance would counsel acknowledging this dissonance honestly. The spectator does not demand you rescind the gift, but suggests that future acts strive for a motive closer to the intrinsic propriety of beneficence, less dependent on the gaze of local admirers. Cultivate the love of what is truly praiseworthy by reflecting on the good done *for its own sake*, not merely its social reflection. If your impartial spectator has been too long formed *only* by the applause of your particular set, you must exercise self-command to imagine the judgment of a truly detached observer who cares nothing for your family name or social standing, but only for the purity of the motive. This is difficult, but essential for propriety.
