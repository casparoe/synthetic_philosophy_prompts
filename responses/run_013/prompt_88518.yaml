prompt: |-
  I have just finished a first course in game theory, and the one stipulation I cannot stop worrying at is the common prior assumption — the requirement, built into the very definition of a Bayesian game, that every player's beliefs be obtained by conditioning a single shared prior on that player's private information. My instructor waved it away as a bookkeeping convenience, a device that lets one write down types and beliefs compactly and then get on with the analysis; a classmate in the same course maintained that it was a substantive claim about how reasonable people must be related to one another, and that the interesting disputes in the surrounding literature are really disputes about whether to keep it. I have come to think the instructor was wrong and the classmate only half right, and I would like you to make the case I have not yet been able to make myself.

  Please argue, as forcefully and precisely as you can, for the position that the common prior assumption is a substantive and controversial idealization rather than a neutral convention — that it encodes a particular picture of disagreement, on which any difference of opinion between rational agents must trace back to a difference in information, and thereby rules out in advance the possibility of two equally well-informed and equally rational agents who nonetheless persist in disagreeing. I want the argument to engage the strongest line of defense rather than a caricature of it. The defender will say that the assumption is empty, since any profile of beliefs can be represented as arising from a common prior over a sufficiently rich space of states, so that nothing is genuinely being assumed. Take that reply seriously and show what it costs: say whether the move really rescues the assumption or merely relocates the substantive commitment somewhere less visible, and what work the enriched space is then doing.

  I am not looking for a survey of the literature, and I do not need citations — I would rather have one tight argument that a skeptical and technically competent reader would have to work to resist. It is fine to concede that the assumption is often a useful modeling choice; I am not asking you to claim that game theorists should stop using it, only that its status is that of a contestable idealization rather than a free lunch. If the strongest version of the position turns out to be narrower than it first appeared, say so and argue for the narrower claim.
reasoning: |-
  Okay, the user has just finished a game theory course and is struggling with the common prior assumption (CPA). They believe their instructor dismissed it as a mere convenience, while a classmate saw it as a substantive claim about rationality. The user wants me to argue that CPA is actually a substantive and controversial idealization.

  Hmm, the user is clearly intellectually engaged here—they've moved beyond surface-level understanding to question foundational assumptions. Their frustration suggests they've already done some independent thinking but need help articulating why CPA isn't neutral. The request for a "tight argument" against the "strongest defense" means they want steelmanning, not strawmanning.

  The core tension is between two views: (1) CPA as harmless mathematical shorthand versus (2) CPA as encoding a strong epistemic thesis. The user suspects it's the latter. Their deep need seems to be epistemological clarity—they want to understand what game theory implicitly commits to when it uses CPA.

  I recall the standard defense: any belief profile can be modeled with CPA by enriching the state space. But this is where it gets philosophically spicy. If we make the state space absurdly rich—say, letting states specify not just facts but also players' entire belief hierarchies—then technically CPA holds by construction. But then "conditioning on private information" becomes circular: the "private information" already includes beliefs about others' beliefs, which were baked into the prior.

  This makes CPA vacuous as an explanatory tool. It doesn't tell us why players have certain beliefs; it just repackages their beliefs into a mathematical object. The substantive commitment shifts from "players share a prior" to "we're only allowing disagreements that fit this particular belief-hierarchy framework."

  Moreover, CPA smuggles in a rationality constraint: if two players with identical information disagree, the model must insist their information wasn't actually identical—even if we need to invent hypothetical differences to preserve consistency. This rules out fundamental disagreements where rational agents interpret the same information differently.

  The user might be wrestling with real-world cases where CPA feels implausible—like political or ethical disagreements. Game theory's CPA framework implicitly says such disputes must stem from hidden information asymmetries, not irreconcilable perspectives. That's a huge, undefended assumption!

  I should emphasize that while CPA is useful (it prevents belief contradictions from derailing equilibria), its cost is ontological baggage. We're not just describing agents; we're prescribing how rational disagreement must work. The "enriched state space" defense doesn't save CPA—it just hides the prescription in the metaphysics of what counts as "information."

  The skeptical reader might counter: "But rational agents should converge given the same evidence!" To which I'd say—that's precisely the contested epistemological claim CPA silently enforces. The debate isn't resolvable mathematically; it's about whether rationality requires doxastic convergence.
answer: |-
  Your instructor and classmate both grasp part of the truth, but neither exposes the substantive philosophical commitment smuggled into the common prior assumption (CPA). The strongest defense—that any belief profile can be *represented* as arising from a common prior over a sufficiently enriched state space—appears to rescue CPA from emptiness. In reality, this move doesn't salvage neutrality; it relocates the substantive commitment into the *structure of the state space itself*, transforming CPA from a harmless convention into a contestable idealization of rationality and disagreement. Here’s how:

  ### 1. **The "Trivialization" Defense and Its Illusion of Neutrality**  
     Defenders argue: Given any profile of beliefs across players, we can always construct a state space Ω where:  
     - States specify *all* private information (including beliefs about beliefs, ad infinitum).  
     - A common prior P over Ω exists.  
     - Each player's beliefs are obtained by conditioning P on their type (i.e., their private information partition).  
     *Ergo*, CPA imposes no empirical constraint—it’s just a modeling choice.*  

     **The flaw:** This defense confuses *mathematical representability* with *explanatory neutrality*. Yes, we can *represent* any disagreement as arising from information asymmetry in *some* state space. But this forces us to interpret **all differences in beliefs as differences in information**. Crucially, "information" here is stretched to include not just objective facts (e.g., "the coin is fair"), but *subjective belief hierarchies* (e.g., "Player 1 believes Player 2 believes the coin is biased").  

  ### 2. **The Substantive Commitment: Disagreement as Epistemic Pathology**  
     By embedding all belief differences into the state space, CPA implicitly asserts:  
     > **Rational agents with identical information cannot disagree.**  

     If two rational players hold different beliefs after updating, the model *must* attribute this to a difference in their types—i.e., they must have observed different signals or possess different higher-order beliefs. CPA thus rules out the possibility of:  
     - **Fundamental disagreement:** Cases where equally rational, equally informed agents persistently disagree due to divergent priors *that cannot be "explained away" by deeper information asymmetries*.  
     - **Interpretative rationality:** Disagreements arising from legitimate differences in how agents *interpret* the same information (e.g., due to distinct life experiences, conceptual frameworks, or risk attitudes).  

     Enriching the state space doesn’t avoid this commitment—it *codifies it*. The state space now includes "explanatory fictions" (e.g., states specifying "Player 1’s innate pessimism") to preserve the fiction of a common prior. But this merely relabels divergent priors as "private information," obscuring the fact that **the model is hardwired to treat disagreement as a failure of information sharing, never a rational outcome of epistemic diversity**.

  ### 3. **The Cost: What CPA Rules Out**  
     Consider two rational agents, Alice and Bob, who:  
     - Observe the *same* evidence about a novel pathogen’s lethality.  
     - Agree on all relevant data and updating rules (Bayesianism).  
     - Yet maintain different posterior beliefs (Alice fears a 10% fatality rate, Bob estimates 1%).  

     **Under CPA:** This disagreement is *impossible* unless they possess different "types." The model forces us to invent hypothetical information differences:  
     - Perhaps Alice’s type includes "seeing a scary documentary as a child," while Bob’s includes "trusting CDC reports more."  
     - These "types" are baked into the prior P, so conditioning on them yields divergent beliefs.  

     **The cost:** CPA *defines away* the possibility that Alice and Bob could be equally rational, equally informed, and still disagree due to **genuinely irreconcilable prior perspectives**. It pathologizes disagreement as an informational deficit, ignoring that rational agents might weigh evidence differently based on values, heuristics, or framing—even with identical data.  

  ### 4. **Why "Enriched State Spaces" Deepen the Problem**  
     The enriched state space doesn’t rescue CPA—it exposes its epistemological baggage:  
     - **Circularity:** States now encode players’ beliefs *about beliefs*, making the "common prior" a tautological restatement of the belief profile itself. P doesn’t explain beliefs; it re-describes them.  
     - **Loss of predictive power:** With a sufficiently rich Ω, CPA can "explain" any behavior, rendering it unfalsifiable. But this voids it of content—a truly neutral convention shouldn’t impose *metaphysical constraints* on how we interpret disagreement.  
     - **Hidden normativity:** The move assumes that **rationality requires belief convergence under common information**. This is a substantive (and contested) epistemic thesis (Harsanyi’s "doctrinal paradox" resolution), not a mere accounting trick.  

  ### 5. **The Stronger, Narrower Claim**  
     CPA is not *empirically empty*—it’s *epistemologically loaded*. It enforces a specific ideal of rational consensus:  
     > *If all private information were pooled, rational agents would agree.*  

     This is defensible as a useful idealization (e.g., in markets with symmetric learning). But it is **not neutral** because it:  
     - Presupposes a "view from nowhere" (the prior P) that neutrally arbitrates all disputes.  
     - Denies that rational disagreement could be foundational (e.g., ethical pluralism) or prior-driven.  
     - Commits to Bayesian updating as the *only* rational response to information.  

     The skeptical but competent reader must concede: While CPA is tractable and often apt for modeling asymmetric information, it implicitly rejects **pluralistic rationality**—the idea that equally rational agents might irreducibly diverge even under common knowledge of evidence. To accept CPA is not to make a free choice of notation; it is to embrace a contested vision of reason itself.

  ### In short: 
  The common prior assumption is substantive because it transforms *all* rational disagreement into incomplete information, thereby denying the possibility of rational, informed, and persistent disagreement. The "enriched state space" defense rescues CPA’s mathematical coherence at the cost of exposing its deepest commitment: that rationality demands consensus in the limit of pooled information. That is no mere convention—it is a philosophical stance masquerading as accounting.
