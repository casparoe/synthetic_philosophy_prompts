prompt: |-
  I chair the research ethics committee at a large academic medical center, and I need a short written opinion from you that I can circulate before next week's meeting. Here is the situation. A team has submitted a protocol in which healthy adult volunteers would undergo a procedure carrying a real, non-trivial risk of lasting harm, in order to generate data whose benefits accrue only to people in a country where the disease is endemic and essentially absent from our own; the volunteers are offered no payment and receive no personal medical benefit, and in their consent interviews they describe themselves as motivated by a wish to help strangers. Our rules were written for a different world. One rule bars undue inducement, which every committee I have sat on has always read as a ceiling on how much money or benefit we may offer a prospective participant, so here the rule has nothing to bite on, since nothing is being offered. Another rule requires that risks be reasonable in relation to anticipated benefits, and our subcommittee has never resolved whether those benefits must accrue to the participant or may accrue to others. Two of my members have drawn opposite conclusions from identical facts. One holds that we must approve, because these are informed adults making an admirable choice, and that refusing them is paternalism dressed up as protection. The other holds that we must reject, because the committee's purpose is to keep people from converting themselves into instruments, and an altruistic motive is precisely the motive most likely to make a person underestimate what she is taking on. A third member wants to split the difference by adopting a new category, a third-party-benefit tier, that would let us approve protocols above our usual risk ceiling when the benefit is wholly external; I am uneasy about inventing policy on the fly to dispose of a single case. There is one further wrinkle I cannot set aside. The research team has floated the idea of publicly honoring any volunteer who is seriously injured, and one member warns that once self-sacrifice is honored it ceases to be purely self-sacrifice and becomes a kind of competition, in which the most devoted set a standard that quietly pressures the less devoted.

  Please draft the opinion I will circulate. It should recommend a concrete course of action, covering both whether to approve this protocol and whether to create the tier, with a time frame for whatever you recommend and a date by which the committee should revisit the tier if it is adopted. It should engage the strongest argument on the side you come down against as an argument worth answering, not a confusion to be corrected. I want to be able to hand it to the committee as the chair's view and have them vote on it, so keep the bottom line unmistakable near the start and let the reasoning follow. You need not cite any literature. Write it as continuous prose, the way I would write an email to colleagues: no headings, no bullet points, no bold, no tables.
reasoning: |-
  Okay, the user chairs a research ethics committee and needs a draft opinion for an upcoming meeting. This is a complex ethical dilemma involving altruistic volunteers undergoing risky procedures for the benefit of strangers in another country. 

  The key issues are: no personal benefit to participants, high risk of lasting harm, conflicting interpretations of existing rules (undue inducement vs risk-benefit analysis), and a problematic proposal to honor injured volunteers. Three committee positions have emerged: approve based on autonomy, reject to prevent instrumentalization, or create a new "third-party-benefit tier."

  Hmm, the user's description suggests several layers of concern. At surface level, it's about protocol approval, but deeper down there's institutional anxiety about evolving research ethics in a globalized world. The mention of rules being "written for a different world" hints at underlying tension between rigid guidelines and novel ethical contexts. 

  When drafting the response, I should prioritize three things: first, provide decisive guidance that doesn't avoid the hard choice; second, address the honor-system concern which feels particularly acute; third, avoid policy improvisation while acknowledging the need for future framework updates. 

  The volunteer motivation is crucial here - their genuine altruism makes this ethically distinct from paid research. But that very purity creates vulnerability. The strongest counterargument to rejection is indeed the paternalism concern: who are we to override informed consent? But the counterpoint about subtle coercion through social recognition feels persuasive, especially regarding injured volunteers being honored. 

  For structure, I'll lead with the bottom-line recommendation (reject protocol, reject new tier, commit to framework review), then walk through each ethical tension sequentially. The honor proposal needs special emphasis as it compounds rather than resolves concerns. Timeframes should be concrete - say 60 days for the framework review with binding deadline. 

  Most importantly, the tone must reflect committee leadership: respectful of all views but clear in its direction. No academic jargon, just plain ethical reasoning as one professional to others. The "unease about inventing policy on the fly" resonates - better to fix the foundation than patch a single case.
answer: |-
  **Draft Opinion for Committee Circulation**  

  To the Committee:  

  After careful consideration of the submitted protocol and the thoughtful arguments presented by members, I recommend that we **decline approval for this specific protocol at this time** and **do not adopt the proposed third-party-benefit tier**. However, I further recommend that we undertake an urgent review of our ethical framework to address gaps in governing altruism-driven research, with a draft policy revision to be presented for vote within 60 days, and implementation (if adopted) by the end of this quarter.  

  My reasoning follows, engaging directly with the compelling counterarguments.  

  First, while I deeply respect the view that rejecting this protocol constitutes paternalism toward autonomous adults, we must confront a fundamental tension: the committee’s mandate is not merely to respect autonomy but to ensure that the conditions for *meaningful* autonomy exist. The concern that altruistic motives may cloud risk perception is not hypothetical—it is well-documented in high-stakes, non-therapeutic research. When participants stand to gain nothing personally, their psychological commitment to "helping" can inadvertently minimize the gravity of irreversible harm. Our rules exist precisely to intercede when such asymmetries arise, even for the well-intentioned. To approve solely because the risk is freely chosen would render our oversight role decorative.  

  Second, creating a new third-party-benefit tier to accommodate this case risks hastiness. Policy crafted reactively, without robust deliberation on thresholds for "acceptable" harm to altruists, could expose future volunteers to inadequately vetted risks. It also fails to resolve the deeper dilemma: whether it is ever ethical to permit lasting injury to a healthy person for knowledge that may never benefit them or their community. This demands principled guidelines, not ad hoc exceptions.  

  Third, the proposal to honor seriously injured volunteers crystallizes the ethical peril. Public recognition risks transmuting self-sacrifice into social capital, creating implicit pressure for others to "measure up." This could distort voluntariness, particularly among those seeking moral purpose. Altruism must not become a currency traded for esteem.  

  That said, the *impulse* to facilitate noble aims is sound. Our rules’ silence on third-party benefits is indeed an artifact of a "different world"—one where research was less globalized and altruism less salient in trial design. We owe it to science and society to modernize. Thus, I propose we immediately convene a working group (including the research team and dissenters) to draft clear criteria for:  
  1. **Risk ceilings** for altruism-driven studies, accounting for irreversibility and quality-of-life impacts;  
  2. **Enhanced consent protocols** to surface unconscious motivational biases;  
  3. **Guardrails against communal coercion** (e.g., barring public honors tied to injury).  

  This framework should be circulated in 45 days, debated at our next meeting (Day 60), and finalized by quarter’s end. The current protocol may then be re-submitted under the new policy, if applicable.  

  **In summary: We reject this protocol due to unmitigated risk and unresolved ethical tensions around altruistic harm, decline to create a novel tier without due process, but commit to updating our framework within 60 days to responsibly accommodate such research in future.** This balances protection today with progress tomorrow.  

  I welcome your perspectives ahead of the vote.  

  —  
  *Chair, Research Ethics Committee*  
  *[Date]*
