  - Month 1: Refining the distinction through extreme test cases 
  - Months 2-3: Stress-testing objections against each ideal 
  - Months 4-5: Developing the whole-life alternative 
  - Month 6: Synthesis and failure assessment

  The failure conditions they proposed (ideals coinciding or collapsing) are good, but I'd add one more: if the whole-life conception proves incoherent. Scope seems manageable if we limit cases to classic demandingness debates (e.g. Singer's pond example) and virtue ethics counterpoints.

