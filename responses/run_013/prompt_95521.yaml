answer: |-
  Here’s a lean, actionable proposal structured around your core insight, designed for maximum conceptual traction within a 6-month scope.

  ---

  **Project Title:** Disambiguating Moral Sainthood: Maximizers, Exemplars, and the Prudential Critique  

  **Core Research Question:**  
  When critics claim the "morally saintly life" is admirable but not enviable, does disambiguating *maximizing* (producing maximal moral good) from *exemplifying* (possessing maximally virtuous traits) reveal that:  
  1. Standard objections only threaten *one* conception of sainthood, not both?  
  2. The persistence of the debate stems from conflating these ideals?  
  3. A viable "whole-life" conception (goodness of a life *as a unified narrative*) escapes these objections and the dichotomy?  

  **Why Existing Literature Leaves This Open:**  
  - **Susan Wolf’s "Moral Saints" (1982):** Objects that saints lack "non-moral virtues" (e.g., humor, spontaneity), making their lives *unattractive*. *Conflation:* She slides from criticizing traits (exemplar) to judging the life’s worth (which could concern maximization or a whole-life ideal). Her objection sticks if sainthood requires *exemplifying* but not if it requires *maximizing*.  
  - **Response by Railton ("Alienation", 1984):** Argues a "sophisticated consequentialist" can be happy and moral. *Conflation:* Defends maximization by appealing to *traits* (e.g., non-alienated dispositions), blurring the distinction.  
  - **Virtue Ethics (e.g., Hursthouse):** Focuses on character (exemplar), but doesn’t address whether such a life *maximizes* good or is enviable *as a life*. The demandingness literature (e.g., Scheffler) targets maximization but ignores whether maximizers *lack enviable traits*.  
  **The Gap:** No framework systematically tests objections against *each* ideal independently or explores a whole-life alternative.  

  **Methodology: 6-Month Conceptual Workplan**  
  *(1 day/week = ~24 days total; focus: constructing/extreme-case testing)*  
  - **Month 1: Sharpening the Distinction**  
    - Define *maximizer* (agent whose *actions* produce net-maximal good), *exemplar* (agent whose *traits* are maximally virtuous), *whole-life* (life whose *narrative unity* embodies moral excellence, irrespective of slice-maximality).  
    - Develop test cases where ideals *conflict*:  
      - *Maximizer/Exemplar Split:* A coldly efficient philanthropist (maximizer) vs. a warm, ineffective carer (exemplar).  
      - *Whole-Life Test:* A life with "moral failures" that cohere into redemption arcs or cumulative wisdom.  
  - **Months 2–3: Stress-Testing Objections**  
    - Apply Wolf’s "unattractiveness" objection, Williams’ "integrity" objection, and the "overdemandingness" critique to each ideal separately:  
      - Does Wolf’s objection undermine the *exemplar* if virtues preclude charm? Does it even apply to the *maximizer* (whose "attractiveness" is irrelevant to output)?  
      - Is the maximizer vulnerable to demandingness but *not* to "unattractiveness," while the exemplar faces the inverse?  
  - **Month 4: Developing the Whole-Life Conception**  
    - Construct cases where a life is morally exemplary *as a story* despite submaximal traits/effects at points.  
      - *Example:* A life with periods of moral failure that enable later moral depth (e.g., recovering addict turned counselor).  
    - Test whether this avoids standard objections (e.g., "unattractiveness" is irrelevant to narrative worth).  
  - **Month 5: Diagnosing the Debate**  
    - Map key arguments (Wolf, Railton, Slote, Singer) onto the framework:  
      - Which ideal were they attacking/defending?  
      - Does reinterpreting their claims via the split resolve contradictions?  
  - **Month 6: Synthesis & Failure Assessment**  
    - Draft criteria for when distinctions matter (e.g., in policy vs. character education).  
    - Explicitly test **failure conditions** (see below).  

  **Deliverable:**  
  A 7,000-word paper establishing:  
  1. The *maximizer/exemplar* distinction dissolves apparent stalemates in the literature.  
  2. Standard objections *only* threaten one ideal (e.g., Wolf’s objection kills the exemplar but not the maximizer).  
  3. The *whole-life* conception is distinct and defensible, reframing demands for "enviable" sainthood.  

  **Failure Conditions:** The project fails if:  
  1. The ideals *coincide* in all plausible cases (no conflict cases found).  
  2. The whole-life conception *collapses* into exemplar/maximizer (no third way).  
  3. Distinctions prove *irrelevant* to resolving core objections (e.g., Wolf’s critique applies equally to both).  

  **Honest Scope & Feasibility Assessment:**  
  - **Strengths:** Tight focus on conceptual disambiguation avoids sprawling surveys. Test cases are low-resource (whiteboard-friendly). Your core insight is novel and high-yield.  
  - **Risks:**  
    - *Whole-life conception* may feel undertheorized in 6 months. **Mitigation:** Define it narrowly (e.g., "narrative unity with moral growth") to avoid vagueness.  
    - *Objection-mapping* could become taxonomic. **Mitigation:** Anchor analysis to 2–3 flagship objections (Wolf, demandingness, integrity).  
  - **Timeline:** 6 months is **viable but aggressive**. Success depends on:  
    - Avoiding literature deep dives (you’ll cite, not survey).  
    - Prioritizing extreme cases that force ideal-splitting.  
    - Accepting the whole-life account as "proof of concept" rather than full theory.  

  **Conclusion:** This project doesn’t just advance the sainthood debate—it provides a diagnostic tool for moral theory’s conflations. If the distinctions hold, you’ll have a publishable framework; if they collapse, you’ve killed a plausible hypothesis efficiently. Both outcomes justify the grant.  

  ---  
  **Ready to whiteboard.** If you can resist chasing every citation rabbit hole and stay ruthlessly focused on cases that *force* the ideals apart (or together), this is doable. The key is Month 1: nail the test cases, and the rest unfolds.
