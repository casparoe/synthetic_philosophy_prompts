  We are going to design a thought experiment with a finite series of colored patches, starting with a clear case of red and ending with a clear case of not-red (say, orange), with each adjacent patch being indistinguishable in color to the naked eye. We'll call the patches P1, P2, ..., P100, where P1 is clearly red, P100 is clearly not-red, and for each i from 1 to 99, Pi and Pi+1 are indistinguishable in color when viewed one after the other in normal conditions.

  We focus on a particular patch, say P50, which we assume is a borderline case of red. We ask three questions:

  (a) What is the semantic status of the statement "P50 is red"? Is it true, false, or neither?

  (b) What about the instance of the law of excluded middle: "P50 is red or P50 is not red"? Is it true? And does its truth require that one of the disjuncts ("P50 is red" or "P50 is not red") is true?

  (c) What is the effect of the word 'definitely' in the statement "P50 is definitely red"? Does it add anything to the claim?

  Now, we set up the theories:

  1. Epistemicism: Vagueness is a matter of ignorance. There is a sharp cutoff in the series, but we cannot know where it is. So for some i, Pi is red and Pi+1 is not, but we cannot know which i. Every statement "Pj is red" is either true or false, even if we cannot know which.

  2. Supervaluationism: Vagueness is a matter of semantic indecision. The predicate "red" has multiple admissible precisifications. A statement is true if it is true on all admissible precisifications, false if false on all, and neither if true on some and false on others.

  Now, the scenario:

  Consider a series of 100 colored patches, arranged in order from P1 (clearly red) to P100 (clearly orange, hence not-red). The colors change gradually so that each adjacent pair (Pi and Pi+1) is indistinguishable in color to normal human vision under normal lighting conditions. We choose P50 as our borderline case. We assume that in the series, P1 is red, P100 is not red, and the transition is so gradual that for no adjacent pair can a human observer tell the difference. We also assume that the series is long enough that there are clear cases and borderline cases.

  Now, the verdicts:

  For (a) the borderline instance "P50 is red":

  - Epistemicism: The statement is either true or false, but we cannot know which. There is a fact of the matter, but it is unknowable.

  - Supervaluationism: The statement is neither true nor false. It is true on some admissible precisifications and false on others.

  For (b) the law of excluded middle (LEM): "P50 is red or P50 is not red"

  - Epistemicism: LEM holds. The disjunction is true because one of the disjuncts is true (even though we don't know which). So the truth of the disjunction requires that one of the disjuncts is true.

  - Supervaluationism: The disjunction is true because on every admissible precisification, either "P50 is red" is true or "P50 is not red" is true. However, it is not the case that one of the disjuncts is true simpliciter (i.e., in the supervaluationist sense, neither disjunct is supertrue). So the disjunction is true but it does not require that one of the disjuncts is true (in the supervaluationist's sense of truth as supertruth).

  For (c) the word 'definitely':

  - Epistemicism: Since the truth value of "P50 is red" is already fixed (though unknown), adding 'definitely' does not change the content. It might be used to express that one knows it is true, but semantically it adds nothing. So "P50 is definitely red" is just equivalent to "P50 is red", but we are in a position to assert it only if we know it is true (which we don't).

  - Supervaluationism: 'Definitely' is a way of claiming that the statement is supertrue, i.e., true on all admissible precisifications. Since "P50 is red" is not supertrue (and not superfalse), "P50 is definitely red" is false. So 'definitely' adds the requirement of truth in all precisifications.

  The key feature of the design that drives the wedge is the existence of a long enough series with a borderline case that is not determinately true or false in the supervaluationist sense, and the use of the law of excluded middle and the operator 'definitely' to reveal the different conceptions of truth.

  What if we shorten the series to two patches? Suppose we have only two patches: P1 (clearly red) and P2 (indistinguishable from P1 but actually not red). Then:

  - Epistemicism: One of them is red and the other is not, but we cannot know which. The borderline is between the two, but each patch is either clearly red or clearly not red? Not exactly. If they are indistinguishable, then we might not know about P2. But if P2 is not red, then it is false that P2 is red. However, if we have a two-patch series, then P1 is red and P2 is not red, but they are adjacent and indistinguishable. Then P2 is a borderline case? Not necessarily. It could be that P2 is just a non-red patch that is very close to red. But in a two-patch series, we don't have a gradual transition. The problem is that the two-patch series does not give us a borderline case in the same way. The supervaluationist might say that P2 is not a borderline case because it is clearly not red? But if they are adjacent and the only two, then we might have a sharp cutoff at the boundary between P1 and P2. Both theories might then agree that P2 is not red (if the cutoff is between P1 and P2). But then we don't have a borderline case. So the series must be long enough to have a patch that is in the middle and is a genuine borderline case.

  If we replace the vague predicate with a precise one (say, "has mass greater than 1kg") and have a series of objects with masses increasing by 0.01kg from 0.99kg to 1.01kg, then:

  - There is a sharp cutoff: the object with mass 1.00kg is the first that has mass >= 1kg? But then we can know the cutoff by precise measurement. So both theories would collapse into a classical picture. But if we make the measurements imprecise so that we cannot tell adjacent masses apart, then we are back to a similar scenario. However, for a precise predicate, the supervaluationist would not need multiple precisifications because the predicate is precise. So both theories would agree that there is a sharp cutoff and that we might be ignorant of it. So the vagueness of the predicate is essential.

  Now, which theory comes out worse? The thought experiment is designed to reveal the commitments of each theory. However, some might think that epistemicism has an advantage because it preserves classical logic, but it has the cost of positing unknowable facts. Supervaluationism avoids unknowable facts but sacrifices the idea that every sentence is true or false (in the sense of being supertrue or superfalse) and also introduces truth-value gaps.

  A defender of epistemicism might try to disarm the case by arguing that the supervaluationist's rejection of bivalence is more costly than epistemicism's commitment to unknowable facts. They might also point out that the supervaluationist's use of the LEM is non-classical because the disjunction can be true without either disjunct being true (in the supervaluationist's sense). This might be seen as a cost to classical logic.

  A defender of supervaluationism might argue that epistemicism's commitment to a sharp cutoff is counterintuitive and that the ignorance it posits is inexplicable. They might also note that the epistemicist's account of 'definitely' as adding nothing substantial is inadequate because in ordinary language we use 'definitely' to rule out borderline cases.

  Note: There is no consensus on which theory is correct. The thought experiment is meant to illustrate the differences.

  Points of potential misdescription:

  - Epistemicism: A careful epistemicist might say that the word 'definitely' can be used to indicate that we are in a position to know, so it does add something pragmatic. But semantically, they might still hold that 'definitely' doesn't change the truth conditions.

  - Supervaluationism: A supervaluationist might have a more nuanced view of the LEM. They accept that the disjunction is true, but they do not accept that one of the disjuncts must be true (in the sense of supertruth). This is a standard feature of supervaluationism.

  In summary:

  Scenario: 100 patches, P1 (clear red) to P100 (clear orange), adjacent patches indistinguishable. We focus on P50, a borderline case.

  Verdicts:

  (a) 
  - Epistemicism: "P50 is red" is either true or false, unknowably.
  - Supervaluationism: "P50 is red" is neither true nor false.

  (b) 
  - Both agree that "P50 is red or P50 is not red" is true.
  - Epistemicism: The disjunction is true because one disjunct is true.
  - Supervaluationism: The disjunction is true (because on every precisification, one of the two holds) but neither disjunct is true (in the supervaluationist sense of truth as supertruth).

  (c)
  - Epistemicism: "P50 is definitely red" is equivalent in truth value to "P50 is red" (so if P50 is red, then it is true, else false). The word 'definitely' adds no semantic content, though it might signal knowledge.
  - Supervaluationism: "P50 is definitely red" means that "P50 is red" is true on all precisifications. Since it isn't, the statement is false. So 'definitely' adds the requirement of supertruth.

  The key feature: The existence of a borderline case in a series with no discernible cutoffs, which allows the two theories to diverge on the status of that borderline case and the role of 'definitely'.

  A defense by the epistemicist: They might argue that the supervaluationist's rejection of bivalence is more problematic than epistemic ignorance. They might also point out that the supervaluationist's notion of truth (supertruth) is not the same as the classical notion, and that the LEM is preserved only at the cost of changing the meaning of truth for atomic sentences.

  A defense by the supervaluationist: They might argue that epistemicism cannot explain why we are ignorant of the cutoff, and that the idea of a sharp cutoff for vague predicates is absurd. They might also say that the use of 'definitely' in natural language aligns with their account.

  Costs: 
  - Epistemicism must accept inexplicable ignorance and a sharp cutoff.
  - Supervaluationism must accept truth-value gaps and a non-classical account of truth for atomic sentences (though they preserve classical logic for compound sentences in a certain way).
answer: |-
  ### Thought Experiment: The Color Spectrum Book
  Imagine a small book with 100 pages, each displaying a single colored patch. The patches form a seamless gradient from page 1 (uncontroversially red, like a fire engine) to page 100 (uncontroversially orange, hence not red). Each adjacent pair of pages (e.g., page 42 and 43) appears identical in color when viewed consecutively by a person with normal vision under consistent indoor lighting. No instrumental measurement is used—only direct observation. You examine the pages one by one. Page 1 is clearly red; page 100 is clearly not red. Pages near the middle (say, page 50) strike you as indeterminate: you cannot call them clearly red or clearly not red. We focus on page 50 as our borderline case.

  **Observable facts agreed upon by all**:  
  - Page 1 is red.  
  - Page 100 is not red.  
  - For any adjacent pair (e.g., pages 42 and 43), no observer can distinguish their colors.  
  - Page 50 is a borderline case of "red" (it elicits hesitation or disagreement in ordinary judgments).  

  **Questions**:  
  (a) Is the statement “Page 50 is red” true, false, or neither?  
  (b) Is the statement “Page 50 is red or page 50 is not red” true? Must one of its disjuncts (“Page 50 is red” or “Page 50 is not red”) be true for the disjunction to be true?  
  (c) Does adding “definitely” to “Page 50 is definitely red” change the meaning or truth conditions of the claim?  

  ---

  ### Verdicts by Theory  
  **Epistemicism** holds that vagueness reflects ignorance: “red” has a precise but unknowable cutoff. Every instance of “red” is either true or false, even in borderline cases.  
  - (a) “Page 50 is red” is either true or false, but it is impossible to know which.  
  - (b) “Page 50 is red or page 50 is not red” is true, and its truth requires that one disjunct is true (though we cannot know which one).  
  - (c) “Definitely” adds no semantic content; it only signals psychological confidence or knowledge. “Page 50 is definitely red” has the same truth conditions as “Page 50 is red” (so if page 50 is red, it’s true; if not, false).  

  **Supervaluationism** holds that vagueness reflects semantic indecision: “red” admits multiple equally valid precisifications (ways of drawing sharp boundaries). A statement is true only if true on all precisifications, false only if false on all, and neither otherwise.  
  - (a) “Page 50 is red” is neither true nor false. It is true on some precisifications (where “red” includes page 50) and false on others (where “red” excludes it).  
  - (b) “Page 50 is red or page 50 is not red” is true because it holds on every precisification (each precisification makes one disjunct true). However, its truth does not require that one disjunct is true *simpliciter* (i.e., neither disjunct is true across all precisifications).  
  - (c) “Definitely” adds semantic content: it means “true on all precisifications.” Since “Page 50 is red” is not true on all precisifications, “Page 50 is definitely red” is false.  

  ---

  ### Key Design Feature and Its Role  
  **The feature**: A *long series* (100 pages) with *non-adjacent borderline cases* (e.g., page 50) and *adjacent indiscriminability*.  
  - **Why it drives the wedge**: The series ensures that page 50 is not adjacent to clear cases (like page 1 or 100) but is flanked by gradual changes. This creates a stable borderline region where epistemicism sees ignorance of a hidden fact, while supervaluationism sees irreducibly multiple interpretations. If the series were shortened to two pages (page 1 clearly red, page 2 indistinguishable but not red), both theories *might* agree page 2 is not red (epistemicism: it’s falsely but unknowably red; supervaluationism: it’s false on all precisifications if “red” is fixed by clear cases). This would collapse the disagreement on (a) and (c). If “red” were precise (e.g., “wavelength ≥ 620 nm”), both theories would agree on a sharp cutoff (resolvable with instruments), eliminating vagueness and the wedge.  

  ---

  ### Defending the Disfavored Theory  
  **Epistemicism’s disadvantage**: It posits an inexplicable ignorance (why can’t we know the cutoff?) and a sharp cutoff that seems arbitrary.  
  - **Epistemicist reply**: “The thought experiment assumes page 50 is ‘borderline,’ but this is just a judgment of ignorance. In reality, ‘red’ has a cutoff fixed by usage or nature; our inability to detect it is due to perceptual or cognitive limits. Supervaluationism’s ‘neither true nor false’ violates bivalence and makes communication mysterious—how do we agree on ‘page 50 is not definitely red’ if there’s no fact of the matter?”  
  - **Cost**: This reply must deny that “borderline” has any semantic significance, treating it as purely epistemic. It risks conflating vagueness with other ignorance (e.g., “is there life on Mars?”), which may not capture why vague predicates *feel* indeterminate.  

  **Supervaluationism’s disadvantage**: It denies that truth requires a single determinate world (e.g., (b) allows a disjunction to be true without a true disjunct).  
  - **Supervaluationist reply**: “The thought experiment reveals that classical logic is inadequate for vagueness. ‘Page 50 is red or not red’ is true because it’s non-rejectable in reasoning, but insisting one disjunct is ‘simply true’ ignores how language works: ‘red’ is governed by competing standards, no single one privileged. Epistemicism’s ‘unknowable truth’ is an empty posit.”  
  - **Cost**: This reply requires accepting truth-value gaps and non-classical logic for atomic sentences, which complicates semantics and may not align with ordinary reasoning (e.g., we often assert excluded middle for borderline cases).  

  ---

  ### Clarifications for the Literature  
  - **Settled**: Both theories agree on observable facts (e.g., page 1 is red, adjacent pages look identical). Both accept that vague predicates lack sharp boundaries knowable to humans. The series setup (a sorites series) is standard in vagueness literature.  
  - **Contested**:  
    - Whether epistemicism can explain the *inexplicability* of ignorance (e.g., Williamson 1994 vs. critics) is debated.  
    - Whether supervaluationism’s “truth” (supertruth) preserves classical logic or distorts it (e.g., Keefe 2000) is contested.  
    - **Misdescription alerts**:  
      - An epistemicist might object to calling page 50 “borderline” if it implies no truth value; they prefer “indiscriminable” or “uncertain.”  
      - A supervaluationist might note that “definitely” can be context-dependent, but the core analysis (supertruth) is standard (e.g., Fine 1975).  

  This example isolates the theories’ core commitments without idealizations. Epistemicism preserves bivalence but at the cost of inaccessible facts; supervaluationism accommodates indeterminacy but at the cost of classical semantics. The wedge arises from how each theorizes what a borderline case *is*—ignorance vs. indecision—generating divergent verdicts on truth, logic, and definiteness.
