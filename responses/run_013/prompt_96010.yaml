prompt: |-
  Been lurking on LW and the rat blogosphere for about a decade, first time actually posting something. I keep noticing a pattern and I don't have a word for it.

  Setup: two people have to split something and neither can just take it. What they very often land on is the split where each side ends up the same *fraction of the way* from their own fallback ("what I get if this whole thing falls apart") to their own best case ("what I'd get if the other side just rolled over and gave me everything"). Not the same amount of money, not the same cut of the pie -- the same fraction of their own personal range. Like, "we each walked away with 60% of what we could've hoped for, measured from the walk-away point."

  Where I see it: salary talks that land at the number where each side gave up the same share of what it asked for; two roommates dividing something when one cares about quiet and the other cares about having people over, so there's no "equal dollars" answer and they do the fraction thing instead; a mediator who keeps saying "we need a deal where you've both conceded equally."

  Two things bug me about it. First, when the upper end of the range is whatever number somebody actually said out loud, the rule pays you to open with an absurd ask -- your range gets wider, so equal-fraction-of-your-own-range hands you more -- and yet everyone still treats the result as fair and nobody calls out the person who inflated. Second, it collides with the other fairness norm I see constantly, "we each end up the same amount better off than if we'd walked," and people seem to quietly reach for whichever of the two happens to give them more.

  Is there a name for the first one? I don't just want the label. I want to know what the nearest named things are, how this differs from each -- it's not just "split the difference," the midpoint doesn't care how wide either side's range is -- whether the opening-ask-inflation problem is a known objection to it, and if nothing in the literature actually matches what I described, coin me something and tell me where the edges are.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been observing a specific pattern in negotiations, especially within the rationalist community. The core idea is that people often settle by each getting the same fraction of their personal range—from their fallback to their ideal outcome. The user is bothered by two main issues: first, this method incentivizes extreme opening offers because a wider range means a better outcome at the same fraction; second, it conflicts with another fairness norm where both parties get equal absolute gains over their fallback.

  The user wants a name for this concept, but more importantly, they seek understanding. They’re looking for related concepts, distinctions, known criticisms, and gaps in existing literature. Since they mention lurking on LW and the rat blogosphere for a decade, they’re likely familiar with basic game theory and rationalist frameworks but haven’t found a precise term for this phenomenon.

  First, I need to recall negotiation theories. The Nash Bargaining Solution comes to mind, which maximizes the product of gains above the disagreement point. But that’s different from equal fractional gains. Then there’s the Equal Concession Principle, which might overlap but focuses more on concessions made rather than proportional gains. 

  The user’s description sounds like the "Mid-Point of Aspirations" but adjusted for each party’s range. Kalai-Smorodinsky’s solution involves proportional gains but is defined differently. K-S ensures the ratio of gains to maximum possible gains is equal, which matches what the user describes. They might not know this term, so explaining it is key.

  The inflation problem is a valid critique. Anchoring in negotiations shows that extreme offers can pull outcomes, but here it directly exploits the proportional split. The user notes people don't call out this behavior, possibly due to psychological factors like anchoring bias or fairness perceptions. 

  Conflict with equal absolute gains is another point. Depending on ranges, one party might benefit more under one norm. The user sees people switching norms opportunistically. This highlights the subjectivity of fairness and how situational factors influence which norm is applied.

  Underlying needs: The user might want to formalize this concept for better negotiation strategies or to critique its fairness. They might also seek validation of their observation, given their long-term lurking without posting. Their frustration suggests a desire for clarity and tools to address this in discussions.

  I should structure the response by naming the concept (K-S solution), distinguishing it from similar ideas, addressing the inflation problem, and explaining the conflict with other fairness norms. Emphasizing that K-S is the closest match, even if not identical, will help. Also, acknowledging the user's insight and providing terminology could meet their deeper need for contributing to the discourse after years of observation.
answer: |-
  What you're describing is a fascinating and underappreciated pattern in negotiation and fairness norms. It doesn't have a single, universally agreed-upon name in common parlance, but it **closely aligns with a specific concept in bargaining theory: the Kalai-Smorodinsky Bargaining Solution (KSBS).**

  Here's a breakdown of your observation, its relation to known concepts, and its problems:

  1.  **The Core Concept:**
      *   **Your Description:** Each party gets the same *fraction* (or proportion) of their *individual potential gain* relative to their disagreement point (fallback/BATNA - Best Alternative To a Negotiated Agreement).
      *   **Kalai-Smorodinsky Bargaining Solution:** This is a formal solution concept in cooperative game theory for bargaining problems. It defines fairness as:
          *   Finding the point on the Pareto frontier (where no one can gain without the other losing) such that...
          *   ...the *ratio* of each player's gain (relative to their disagreement point) to their *maximum possible gain* (relative to their disagreement point, assuming the other player gets *only* their disagreement point) is **equal**.
      *   **Match:** This is precisely what you described. It's about equalizing the *proportional achievement* relative to each party's own *feasible aspiration point*.

  2.  **Distinguishing It from Similar Concepts:**
      *   **"Split the Difference" / Midpoint:** This finds the numerical midpoint between the two *stated positions*. It ignores the disagreement points and the *width* of each party's range. KSBS explicitly considers the *range* each party has to give (from BATNA to max aspiration).
      *   **Equal Absolute Gains (Egalitarian Solution):** This aims for both parties to gain the same absolute amount above their BATNA. KSBS aims for the same *proportional* gain relative to their *individual* potential. These are only the same if the potential gains for both parties are identical (which is rare).
      *   **Nash Bargaining Solution (NBS):** This maximizes the *product* of the gains above the BATNA. It tends to favor the party with a larger potential gain or a weaker BATNA. KSBS directly targets proportional equality of gain relative to potential. NBS and KSBS often yield different results.
      *   **"Conceded Equally":** This vague mediator phrase *could* be interpreted as either equal absolute concessions from opening positions ("we both moved $10k") or equal proportional concessions ("we both gave up 20% of our initial ask"). KSBS is the *equal proportional achievement* interpretation relative to the *full feasible range* (BATNA to max aspiration).

  3.  **The Name(s) and Its Edges:**
      *   **Primary Academic Label:** **Kalai-Smorodinsky Bargaining Solution (KSBS)** is the most precise direct match in formal theory.
      *   **Descriptive Labels:** You might hear it called:
          *   **Proportional Gains Solution**
          *   **Equal Relative Sacrifice/Concession** (though "sacrifice" implies giving something up, while KSBS focuses on gain achieved)
          *   **Aspiration Matching Solution**
          *   **BATNA-to-Ideal Proportional Split**
      *   **Edges of the Concept:**
          *   Requires defining a clear BATNA and a "max aspiration" point for each party.
          *   Assumes the max aspiration point is the maximum the other party *could* feasibly concede *if pushed to their absolute limit* (not just the opening ask).
          *   Requires finding a Pareto efficient outcome that satisfies the proportionality condition. In simple cases (like a linear pie split), it's straightforward. In complex multi-issue negotiations, finding the point on the frontier that satisfies KSBS can be harder.
          *   It's a *normative* concept (how things *should* be) rather than always *descriptive* (how they *are*), though your observation suggests it's a powerful descriptive norm in practice.

  4.  **The Opening Ask Inflation Problem:**
      *   **Yes, It's a Known and Fatal Flaw (in theory):** This is the **primary criticism** of KSBS (and similar proportional norms relying on stated aspirations) as a *fairness* concept. It creates a **manipulability** problem.
      *   **How it Works:** If Party A inflates their "max aspiration" point (X_maxA) wildly, while keeping their BATNA (X_minA) fixed, it artificially widens their perceived range (X_maxA - X_minA). The KSBS point then gives them a larger *absolute* gain for the *same proportional* achievement relative to their inflated range. Party B is forced to concede more because A's "potential" looks bigger.
      *   **Why It Persists:**
          *   **Anchoring:** High opening offers anchor the negotiation, making lower settlements seem more reasonable *even if* everyone knows the opener was inflated. The KSBS norm leverages this anchoring bias.
          *   **Plausible Deniability:** Parties can argue their high aspiration *is* genuinely important to them ("This feature is critical!", "This salary reflects my unique value!"), making it hard to call "absurd" definitively.
          *   **Focus on Process Fairness:** The *process* of "each conceding proportionally" *feels* fair in the moment, even if the inputs were manipulated. It creates a shared narrative of mutual sacrifice.
          *   **Lack of Clear Alternatives:** Explicitly switching to Equal Absolute Gains can feel unfair to the party with a larger potential gain ("Why should I get the same dollar amount when I had so much more to potentially gain?"). Nash is harder to explain intuitively.
          *   **Mediator Convenience:** "Equal proportional concession" is a simple, seemingly objective rule for mediators to push, even if manipulable.

  5.  **The Collision with Equal Absolute Gains:**
      *   **Fundamental Conflict:** These are *different* fairness principles. Equal Absolute Gains cares only about the improvement over the BATNA. KSBS cares about the achievement relative to the *distance* to the aspiration.
      *   **When They Diverge:** They yield the same result *only* if the potential gains above BATNA are identical for both parties. If Party A has a large potential gain and Party B has a small one:
          *   **KSBS** would give Party A a larger *absolute* gain than Party B (because the same *proportion* of a larger range is more absolute value).
          *   **Equal Absolute Gains** would give both the same absolute gain, meaning Party B achieves a much *higher proportion* of their smaller potential gain.
      *   **Opportunistic Selection:** Your observation that parties/mediators reach for whichever norm benefits them is astute and reflects reality. Which norm "feels fairer" often depends on whose perspective you take and the specifics of the ranges:
          *   The party with the larger potential gain will push KSBS ("We both get 60% of our ask!").
          *   The party with the smaller potential gain will push Equal Absolute Gains ("We both get $10k more than our fallback!").
          *   Mediators might pick the norm that seems easier to sell or generates less immediate resistance.
      *   **Why KSBS Often Wins the Perception Battle (Despite Manipulability):** The narrative of "we both sacrificed the same *relative* amount" is psychologically potent. It frames the outcome as equitable effort, whereas Equal Absolute Gains can feel arbitrarily dismissive of differing aspirations.

  **In Summary:**

  *   **Name:** The core concept is the **Kalai-Smorodinsky Bargaining Solution (KSBS)**.
  *   **Key Distinction:** It equalizes the *proportion* each party achieves relative to their *own individual range* (BATNA to Maximum Feasible Aspiration). This differs fundamentally from splitting the difference, equal absolute gains, or Nash.
  *   **Manipulation Problem:** The incentive to inflate opening aspirations is a **known, critical flaw** of KSBS when the aspiration point is defined by the opener. It persists due to anchoring, process fairness perceptions, and the difficulty of definitively labeling aspirations "absurd."
  *   **Norm Collision:** Conflict with Equal Absolute Gains is inherent. Parties strategically (or intuitively) select the fairness norm (KSBS proportional vs. Egalitarian absolute) that favors their position based on the relative widths of their BATNA-to-aspiration ranges.

  **Your Insight is Spot On:** You've identified a powerful, manipulable, yet persistent fairness norm rooted in proportional concession relative to individual aspiration ranges (KSBS), and its dynamic tension with the alternative norm of equal absolute improvement. The lack of consistent calling out of inflation highlights the power of anchoring and the perceived procedural fairness of the proportional concession process itself, even when gamed.
