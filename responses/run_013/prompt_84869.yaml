  ### Polished Example: Binary Events with Unknown Dependence

  Let's make this concrete. Suppose you're forecasting two binary events:
  - **X**: Whether it rains tomorrow (1 if rain, 0 if no rain).
  - **Y**: Whether a specific stock (e.g., Tesla) goes up tomorrow (1 if up, 0 if down).

  **Initial evidence**: You have historical data showing that rain is equally likely (P(X=1) = 0.5), but no data on the stock or its relationship to rain. You have no reason to think rain and stock movements are related—they seem irrelevant to each other. However, you're uncertain about the dependence: they could be independent, positively correlated (e.g., rain might affect the stock if it influences outdoor industries), negatively correlated, or anything in between.

  Your credal set—the set of all joint probability distributions consistent with this evidence—is defined by:
  - P(X=1) = 0.5 (the rain probability is exactly 50%).
  - No other constraints: P(Y=1) can be any value in [0,1], and the correlation can vary freely.

  The joint distribution has four outcomes, with probabilities:
  - \( p_{00} = P(X=0, Y=0) \)
  - \( p_{01} = P(X=0, Y=1) \)
  - \( p_{10} = P(X=1, Y=0) \)
  - \( p_{11} = P(X=1, Y=1) \)

  These must satisfy:
  - \( p_{00} + p_{01} + p_{10} + p_{11} = 1 \)
  - P(X=1) = \( p_{10} + p_{11} = 0.5 \)
  - P(Y=1) = \( p_{01} + p_{11} \) (no constraint)

  **Event A**: "X=1" (rain tomorrow). Since P(X=1) = 0.5 in every distribution, you're certain that P(A) = 0.5.

  **New evidence**: You learn that Y=1 (the stock went up). This seems irrelevant to A—it doesn't directly involve rain or any known connection. You update by conditioning: discard distributions where P(Y=1) = 0 (since Y=1 occurred), and keep only those with P(Y=1) > 0. For each remaining distribution, compute P(A | Y=1) = P(X=1 | Y=1) = \( \frac{p_{11}}{p_{01} + p_{11}} \).

  **After updating**, P(A | Y=1) ranges over [0,1]. Why? Because the dependence is arbitrary, learning Y=1 can make A more likely, less likely, or unchanged. Here's the mechanism with explicit numbers:

  - From the constraint \( p_{10} + p_{11} = 0.5 \), express variables:
    - \( p_{10} = 0.5 - p_{11} \)
    - \( p_{00} = 0.5 - p_{01} \) (derived from \( p_{00} + p_{01} + p_{10} + p_{11} = 1 \) and above)
    - P(Y=1) = \( s = p_{01} + p_{11} \)
    - P(X=1 | Y=1) = \( \frac{p_{11}}{s} = \frac{p_{11}}{p_{01} + p_{11}} \)

  - **Key points**:
    - \( p_{11} \) (or \( t \)) can be from 0 to 0.5 (since \( p_{11} \leq 0.5 \) from \( p_{10} + p_{11} = 0.5 \)).
    - \( p_{01} \) can be from 0 to 0.5 (from \( p_{00} = 0.5 - p_{01} \geq 0 \)).
    - \( s = p_{01} + p_{11} \) can range from 0+ to 1 (but s=0 cases are discarded when conditioning on Y=1).

  Now, P(X=1 | Y=1) = \( \frac{p_{11}}{p_{01} + p_{11}} \) achieves any value in [0,1]:

  - **P(A | Y=1) = 0**: When \( p_{11} = 0 \) and \( p_{01} > 0 \). E.g., \( p_{01} = 0.5 \), \( p_{11} = 0 \), \( p_{10} = 0.5 \), \( p_{00} = 0 \). Here, Y=1 implies X=0 (perfect negative correlation). P(Y=1) = 0.5, P(X=1 | Y=1) = 0/0.5 = 0.
  - **P(A | Y=1) = 0.5**: When independent. E.g., \( p_{00} = 0.25 \), \( p_{01} = 0.25 \), \( p_{10} = 0.25 \), \( p_{11} = 0.25 \). P(Y=1) = 0.5, P(X=1 | Y=1) = 0.25/0.5 = 0.5.
  - **P(A | Y=1) = 1**: When \( p_{11} = 0.5 \) and \( p_{01} = 0 \). E.g., \( p_{00} = 0.5 \), \( p_{01} = 0 \), \( p_{10} = 0 \), \( p_{11} = 0.5 \). Here, Y=1 implies X=1 (perfect positive correlation). P(Y=1) = 0.5, P(X=1 | Y=1) = 0.5/0.5 = 1.
  - **Any intermediate value**: E.g., for P=0.2, set \( p_{11} = 0.1 \), \( p_{01} = 0.4 \), then \( p_{10} = 0.4 \), \( p_{00} = 0.1 \). P(Y=1) = 0.5, P(X=1 | Y=1) = 0.1/0.5 = 0.2. For P=0.8, set \( p_{11} = 0.4 \), \( p_{01} = 0.1 \), then \( p_{10} = 0.1 \), \( p_{00} = 0.4 \). P(X=1 | Y=1) = 0.4/0.5 = 0.8.

  **Summary of effect**:
  - Before learning Y=1: P(A) = 0.5 (point estimate).
  - After learning Y=1: P(A) ranges over [0,1] (full dilation).
  - Learning something "irrelevant" made you less certain: You went from maximal certainty (P(A) = 0.5) to complete uncertainty (P(A) anywhere in [0,1]).

  **Why it feels unrigged**: The events are ordinary (weather/stocks), the table is explicit, and dilation arises solely from uncertainty about dependence—no infinities or funky priors. "Irrelevance" is intuitive because Y=1 (stock up) has no known link to rain, but the ambiguity in dependence makes it relevant upon learning.

  ---

  ### Addressing Your Questions

  **Is this a real feature of evidence or an artifact of not picking a prior?**  
  This is a real feature of how evidence works when there's ambiguity about dependence between variables. It's not an artifact; it highlights that "irrelevance" in your framing is doing heavy lifting. Specifically:
  - You assumed Y is "irrelevant" to A, which typically means X and Y are independent. But in the credal set, you don't know that—you have uncertainty about the dependence. Learning Y=1 provides information that, due to this ambiguity, can drastically affect P(A).
  - The honest version: Evidence that seems irrelevant can be relevant if the relationship between variables is unknown. In precise probability, if you assumed independence (fixing a prior), learning Y=1 wouldn't change P(A). But with imprecise probabilities, the lack of knowledge about dependence means "irrelevance" isn't justified; learning Y=1 can reduce uncertainty about the dependence, dilating P(A).
  - In forecasting, this arises when evidence constrains the set of possible worlds in a way that amplifies existing ambiguities. It's a consequence of robust Bayes or imprecise-probability models.

  **Sane response for forecasting when you must ship a number:**  
  If you need a single probability (e.g., for a decision), staying dilated isn't practical—you need to pick one number. But how?
  - **Option 1: Pick a distribution and move on** (common in practice). Assume a specific prior, e.g., independence (so P(A) stays at 0.5). But this adds arbitrary information; if wrong, you may be miscalibrated.
  - **Option 2: Use a decision rule under ambiguity**. E.g., minimax regret or Hurwicz criterion to choose P(A) from the [0,1] range. For instance, if equally unsure, pick 0.5; if risk-averse, pick a value that hedges against worst-case outcomes.
  - **Option 3: Report the range and context**. Ship the interval [0,1] with a note: "Due to unknown dependence on stock data, rain probability is now between 0% and 100%." This is honest but may frustrate users wanting precision.
  - **Recommendation**: In low-stakes cases, Option 1 is fine (assume independence). In high-stakes, use Option 2 or 3. The "sane" choice depends on error costs: If false certainty is costly, stay dilated; if decisions require numbers, pick a robust prior (e.g., reference prior that minimizes max loss).

  **Standard name for this phenomenon**:  
  This is called **dilation** in imprecise probability. It occurs when conditioning on new evidence widens the probability range for an event. Key references:
  - Seidenfeld and Wasserman (1993) introduced it formally: "Dilation for sets of probabilities" (*Annals of Statistics*).
  - It's discussed in contexts like the "Ellsberg paradox with dependence ambiguity" or "Bayesian dilation."
  - You might have read about it on blogs like *Less Wrong* or in posts on "robust Bayesian inference"—search "dilation imprecise probability" for details.

