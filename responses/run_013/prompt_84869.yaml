  3. **Candidate: Binary events with fixed marginal (chosen)**  
     - Setup: Two binary events, X and Y. I know P(X=1) = 0.5 exactly, but I have no knowledge of P(Y=1) or the dependence between X and Y. Event A: "X=1". Learn Y=1, which seems irrelevant.  
     - Why it works: P(A) = 0.5 initially for all distributions. After learning Y=1, the credal set updates via conditioning, and P(A | Y=1) ranges from 0 to 1 due to arbitrary dependence. Concrete with a tiny probability table. No infinities, no self-location, just ordinary uncertainty. This is clean and minimal—I'll polish this.

  **Why not the others?** Candidate 1 fails because fixing both marginals over-constrains the dependence, preventing full dilation to [0,1]. Candidate 2 is workable but less transparent due to multiple outcomes; a two-variable table is clearer. Candidate 3 is the winner.

