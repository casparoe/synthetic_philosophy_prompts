prompt: |-
  I teach a 300-level ethics seminar, 16 students, one 75-minute block, and I want to run something that makes the seperateness-of-persons objection to utilitarianism land as something they feel in the room rather than a bullet point they nod at. Below is the rough shape I have in mind. Develop it into a full runnable activity, or replace my mechanism with a better one if it does the same job.

  Each student gets a strip of five index cards, face up, one card per stretch of their life, each with a small integer on it (can be negative) -- that's their well-being in that stretch. Their final score is the sum of their own five cards. Nobody's score gets pooled; the numbers on your strip are yours.

  Phase A, solo, five minutes: I ask them to move 3 points out of their own period 2 and into their own period 4. Same total, different location in time. Everyone does it instantly, no complaint, no debate.

  Phase B, pairs, secret ballot: I hand each pair a policy card that reads, take 3 from player A's period 2 and give 4 to player B's period 4. Net gain of 1 to the world. They vote whether to enact it. Key rule: their A/B assignment is drawn at random *after* the ballots are collected, so nobody is voting for their own pocket.

  Phase C, same pair, another ballot: the identical numbers, but now as a within-life card -- take 3 from your own period 2, give 4 to your own period 4. Same total, same shape, same arithmetic. I expect a near-unanimous yes.

  Phase D: I reveal that the Phase B card is exactly what a total-sum maximizer is committed to endorsing, and ask them, in small groups, to state the principle that separates B from C, and then to defend that principle against someone who says it's just a bias toward your own timeline.

  What I want them to come away seeing: that they themselves aggregate freely across moments within a life and flinch at the same aggregation across lives, and that this asymmetry is the whole load-bearing wall of the objection -- not a slogan about respecting persons, but a real discontinuity in their own reasoning that they now have to either justify or give up.

  Give me: materials and setup (how many cards, how the integers are chosen so the sums stay legible), the timeline for the 75 minutes, exact ballot wording for B and C, the reveal script for D kept short, and a debrief that maps each phase onto the actual structure of the objection -- the compensation-within-a-life move versus the compensation-that-lands-in-someone-else's-life move -- without just lecturing. You can name Rawls and Parfit in the debrief; I don't need citations.

  Then tell me what will predictably go wrong the first time I run it and how to handle each thing. My own guesses: someone will say the B transfer is fine as long as A consents, so you'll need to close that off in the rules or tell me how to handle it in the room; and the random A/B draw will push a chunk of the room toward a maximin instinct, which I think is a different objection (Rawls's own, not the separateness one) and I want the debrief to keep those apart rather than let them blur.

  Finally, be honest about what this activity cannot reproduce. My worry is that it dramatizes the *asymmetry in our intuitions* and never touches the metaphysical claim underneath -- that persons are genuinely distinct loci of experience in a way that moments within one life are not -- and that if anything it reinforces the boundary rather than letting a Parfit-style reductionist pressure it. If that's right, say so and tell me what the facilitator has to supply in words that the game can't do for them.

  Also, when you write this up, tell me how confident you actually are that each piece will work the way I've described, and single out the one point you're least sure about.
reasoning: |-
  We are designing an activity to make the separateness-of-persons objection to utilitarianism tangible. The core idea is to have students experience the asymmetry in their own reasoning about aggregating well-being within a life vs. across lives.

  **Materials and Setup:**
  - 16 students, so 8 pairs for Phase B and C.
  - Each student gets a strip of 5 index cards, representing 5 periods of their life. The cards have integers (positive or negative) that sum to a total for that life. We want the numbers to be such that the transfers in the activity are meaningful and the sums remain easy to compute.

    *Designing the numbers:*
    - We want the initial distribution to be neutral enough that students don't feel strongly about the periods. Also, the transfers should not put any period into negative if that might cause distress (unless we want to test that, but let's avoid).
    - Example: Each student's initial strip: [3, 5, 2, 4, 1] -> total 15. 
      - In Phase A: move 3 from period 2 (now 2) to period 4 (now 7). New strip: [3, 2, 2, 7, 1] -> total still 15.
    - But note: we need to do a cross-person transfer in Phase B: take 3 from A's period 2 and give 4 to B's period 4. So we must ensure that in every student's strip, period 2 has at least 3 and period 4 is present (so we can add 4 without making it too high?).

    *Revised plan for numbers:*
    - Pre-make 16 strips. Each strip has 5 numbers. We'll have two types of strips? Actually, we can have all the same for simplicity? But then the transfer in Phase B might be from a period that is already low? We don't want that to bias.

    *Suggestion:*
    - Use a standard strip for everyone: [5, 8, 4, 6, 2] (total 25). 
      - Phase A: move 3 from period 2 (becomes 5) to period 4 (becomes 9). 
      - Phase B: take 3 from A's period 2 (which was 8, now 5 after Phase A? Or should we reset? Let's think about the timeline.)

    *Important: We must decide if Phase A is done and then we use the new numbers for Phase B, or if we reset?*

    Actually, Phase B and C are policy ballots and should be considered independently of Phase A. So we should have the initial state for each student be the same for all phases? Or we can reset the strips after Phase A? It's simpler to have each phase independent.

    *Revised:*
    - Each student has a strip of 5 cards. We'll have multiple sets? Or we can just tell them the numbers and they write? To avoid confusion, we can have a worksheet that they use for each phase? But the physical cards are nice.

    *Alternative:*
    - Give each student a worksheet with the initial numbers for each phase. For Phase A, they do the transfer and see the result. Then for Phase B and C, we describe the policy and they vote without altering their own strip? Because the policy is hypothetical.

    *Material details:*
    - Prepare 16 sets of 5 index cards. Each set: 
        Period 1: 5
        Period 2: 8
        Period 3: 4
        Period 4: 6
        Period 5: 2
      Total: 25.

    - Also, prepare 8 policy cards for Phase B and 8 for Phase C (but actually, Phase B and C are described, so maybe just one card per pair that is passed around?).

    *Policy card for Phase B:*
    "Policy: Take 3 points from Player A's period 2 and give 4 points to Player B's period 4. This results in a net gain of 1 point for the world."

    *Policy card for Phase C:*
    "Policy: Take 3 points from your own period 2 and give 4 points to your own period 4. This results in a net gain of 1 point for your own total well-being."

    But note: in Phase C, it's within one life, so the net gain is for that life? Actually, the net gain is 1 for the person, but the world total? Since it's within one person, the world total (if we consider that person) gains 1. But we want to emphasize that the arithmetic is the same as in Phase B.

    Actually, in Phase C, the transfer is within one life: taking 3 from period 2 and giving 4 to period 4 is a net gain of 1 for that person. But note: the person's total well-being increases by 1? Not exactly: the transfer is of points? How?

    Let me clarify: In Phase A, we moved 3 points from period 2 to period 4 without changing the total. In Phase B, we are taking 3 points from A's period 2 and giving 4 points to B's period 4. So A loses 3, B gains 4, net +1.

    In Phase C, we are taking 3 points from your own period 2 and giving 4 to your own period 4. So your total well-being increases by 1? That doesn't make sense because we are just moving points? 

    *Mistake in the original description:*
    In Phase C, the original idea was: "take 3 from your own period 2, give 4 to your own period 4" and then note that it's the same arithmetic? But if we take 3 from period 2 and give 4 to period 4, then the person gains 1 in total? That's not a transfer, that's creating 1 extra point? 

    This is confusing.

    *Clarification:*
    In Phase C, we want the same arithmetic as Phase B but within one life. So in Phase B, we are transferring from A to B, and the net effect is A loses 3 and B gains 4 (so net +1). In Phase C, if we do a transfer within one life, we cannot have a net gain because it's the same person. 

    Therefore, the original Phase C description must be: take 3 from your period 2 and give 4 to your period 4? That would imply that we are creating 1 point? But that's not a transfer, that's an addition. So we have two different policies:

    - Phase B: A transfer from A to B that results in a net gain of 1 (so it's not just a transfer, it's a transfer plus creating one extra point? Or we are taking 3 from A and giving 4 to B, meaning we are adding 1 point to the world?).

    - Phase C: We are taking 3 from your period 2 and giving 4 to your period 4? That would require adding 1 point? But then the total of that person increases by 1.

    Alternatively, we can frame Phase C as: "You have the opportunity to make a change: your period 2 will lose 3 points and your period 4 will gain 4 points, so your total well-being increases by 1." That is not a transfer of points but a change in the points. Then Phase B would be: "Player A's period 2 loses 3 points and Player B's period 4 gains 4 points, so the total well-being in the world increases by 1."

    This makes sense. So:

    Phase B: It's a policy that causes A to lose 3 (from period 2) and B to gain 4 (in period 4), net +1.
    Phase C: It's a policy that causes you to lose 3 in period 2 and gain 4 in period 4, net +1 for you.

    Now, in Phase A, we did a transfer without net change. But that was just to show that moving points within a life is easy. Then Phase C is a net gain for the person? So it's even better? Then why wouldn't they do it? They would.

    So the activities:

    Phase A: Within-life transfer with no net change (to show indifference to timing when within life).
    Phase B: Cross-life transfer with net gain (but the cost is borne by one and the benefit by another).
    Phase C: Within-life change with net gain (so it's a pure benefit).

    Then the asymmetry: In Phase C, they all say yes. In Phase B, they might say no. Why? Because in Phase B, even though there is a net gain, A is worse off and B is better off, and they might object to harming A for the sake of B.

    This is the separateness: we don't aggregate across persons.

    So let's adjust the description.

    **Revised activity:**

    *Setup:*
    - Each student has a strip of 5 cards: [5, 8, 4, 6, 2] (total 25). They can write the numbers on index cards.

    *Phase A (5 minutes):*
    - "Consider your own well-being in these five periods. You have the opportunity to transfer 3 points from your period 2 to your period 4. This does not change your total well-being. Please do this transfer now and note your new well-being: period 2 becomes 5, period 4 becomes 9, and the total is still 25."
    - They do it. They see it's trivial.

    *Phase B (10 minutes including voting and explanation):*
    - Pair up (8 pairs). Hand each pair a ballot for Policy B. The policy: "If enacted, in your pair, Player A will lose 3 points from their period 2 and Player B will gain 4 points in their period 4. The net change in total well-being is +1. You will vote by secret ballot whether to enact this policy. Note: After the vote, we will randomly assign who is A and who is B in your pair."
    - They vote without knowing if they will be A or B. Collect ballots.

    *Phase C (5 minutes):*
    - Now, same pairs, but each person gets a ballot for Policy C: "If enacted, you will lose 3 points from your period 2 and gain 4 points in your period 4. This increases your total well-being by 1. Do you want to enact this policy for yourself?"
    - They vote (and we expect unanimous yes).

    *Phase D (15 minutes): Reveal and discussion.*
    - First, reveal the results of the votes. We expect Phase B to have a significant number of no votes, and Phase C to be nearly all yes.
    - Then, the reveal: "Policy B is exactly the kind of policy that a total-sum utilitarian would endorse: it increases the total well-being by 1 at the cost of making one person worse off and another better off. Policy C is the same arithmetic but within one life: you are willing to accept a loss in one period for a greater gain in another period, increasing your total. The difference is that in Policy B, the loss and gain fall on different persons, while in Policy C they are on the same person."

    *Debrief (15 minutes):*
    - Break into small groups (4 groups of 4) to discuss: "What principle separates your reaction to Policy B and Policy C? How would you defend that principle against someone who says it's just a bias toward your own timeline (i.e., you care more about your own entire life than about other people)?"
    - Then bring together for final discussion (15 minutes): 
        - Map the phases: 
            Phase A: We freely aggregate within a life (we don't mind shifting well-being across time).
            Phase C: We also accept a net gain within a life even if it means a loss in one period? Actually, in Phase C it's a net gain so it's even better. But note: in Phase A we were indifferent to a transfer with no net change. In Phase C we are eager for a net gain. The key asymmetry is between Phase B and Phase C: in Phase B, even though there is a net gain, we are reluctant because the loss and gain are in different lives.
        - Emphasize: the separateness of persons objection is that we cannot aggregate across persons in the same way we aggregate within a person. We think that a loss to one person is not compensated by a gain to another, even if the gain is bigger. But within a person, a loss in one period can be compensated by a gain in another.
        - Mention Rawls: This is why Rawls says that utilitarianism does not take seriously the distinction between persons. It treats society as a single person and aggregates across persons as if they were time-slices of one life.
        - Mention Parfit: Parfit's reductionist view might challenge the metaphysical basis of the separateness. He argues that what matters is not the identity of the person but the relations between experiences. But our activity shows that we do treat the boundaries between persons as significant.

    **Timeline for 75 minutes:**
    - 0-5: Setup and distribute materials. Explain the strips and periods.
    - 5-10: Phase A (solo).
    - 10-20: Phase B (pairs, vote).
    - 20-25: Phase C (same pairs, vote).
    - 25-30: Collect votes and reveal the vote counts for B and C (without interpretation).
    - 30-45: Phase D reveal and initial whole-group reaction.
    - 45-60: Small group discussion (4 groups) on the principle and defense.
    - 60-75: Whole group debrief and wrap-up.

    **Ballot Wording:**

    *Phase B Ballot:*
    "Policy Proposal: In your pair, one randomly assigned person (Player A) will lose 3 points from their period 2 well-being, and the other (Player B) will gain 4 points in their period 4 well-being. This results in a net gain of 1 point for the world. Do you vote to enact this policy? 
     [ ] Yes
     [ ] No"

    *Phase C Ballot:*
    "Policy Proposal: For yourself, you will lose 3 points from your period 2 well-being and gain 4 points in your period 4 well-being. This increases your total well-being by 1 point. Do you want to enact this policy? 
     [ ] Yes
     [ ] No"

    **Reveal Script for Phase D (keep short):**
    "Let's look at the results. For Policy B, we had [X] yes and [Y] no. For Policy C, we had [Z] yes and [W] no. Notice the asymmetry? Policy B and Policy C have the same arithmetic: a loss of 3 and a gain of 4, net +1. But in Policy B, the loss and gain are split between two people, while in Policy C, they are both for the same person. This is the heart of the separateness-of-persons objection to utilitarianism. Utilitarianism would endorse Policy B because it increases the total. But many of you rejected Policy B. Why? Because you feel that it's not acceptable to harm one person to benefit another, even if the benefit is larger. But within one life, you are happy to accept a loss in one period for a greater gain in another. The discontinuity is at the boundary of the person."

    **Debrief Mapping:**
    - Phase A: Shows that we are indifferent to the distribution of well-being across time within a life (if total is unchanged). We aggregate freely within a life.
    - Phase B: Shows our reluctance to aggregate across lives. Even though the total increases, we object because the loss is imposed on one person and the benefit goes to another.
    - Phase C: Reinforces that within a life, we accept even a net gain that involves a loss in one period (but note: it's a net gain, so it's not a sacrifice? Actually, it's a pure benefit). However, the key is that we are willing to have one part of our life worse off to make another part better off, but not to make someone else's life better off at the cost of our own (or at the cost of another person).

    **Potential Problems and Solutions:**

    1. *Consent in Phase B:* 
       - Problem: A student might say, "If A consents, then it's okay." But in the activity, A and B are assigned randomly after the vote, so there's no consent at the individual level.
       - Solution: In the rules, state that the policy is imposed without consent. Emphasize that the random assignment after the vote is meant to model an impersonal policy decision.

    2. *Maximin instinct in Phase B:*
       - Problem: The random assignment might make some vote no because they are afraid of being the loser (A). This is a Rawlsian maximin concern, not the separateness of persons.
       - How to handle in debrief: 
          - Acknowledge that fear of being the loser might play a role. But note: the separateness objection is that even if you knew you weren't the one who would lose (or if you were behind a veil of ignorance and knew the odds), you might still object to the policy because it harms one person for the benefit of another. The maximin strategy is a different argument (from Rawls) that prioritizes the worst-off. We can separate them by noting that the separateness objection is about the moral weight of the distribution across persons, while maximin is about risk aversion or priority to the worst-off.

    3. *Phase C is too easy:*
       - Since Phase C gives a net gain, everyone will say yes. But what if we had a within-life transfer with no net gain? That would parallel Phase A. And then a within-life net gain? Actually, the original idea was to have Phase C be the same as Phase B but within life. But we resolved that by having Phase C be a net gain for the person. That makes it even more attractive. But the asymmetry is still clear: we accept within-life net gains and we also accept within-life transfers with no net gain (Phase A), but we reject cross-life transfers even with net gain? 

    4. *Negative well-being:*
       - We avoided negative numbers. But if we had them, we might need to worry. Our initial numbers are all positive.

    **What the activity cannot reproduce:**
    - The activity dramatizes the asymmetry in our intuitions but does not engage with the underlying metaphysical claim about the distinctness of persons. It might even reinforce the idea that persons are distinct in a way that time-slices are not. 
    - To address Parfit's reductionism, the facilitator must explicitly introduce it: "But what if persons are not as distinct as we think? Parfit argues that what matters are the relations between experiences, and that the boundary between persons is not as deep as we assume. If we accept that, then the asymmetry in our intuitions might be questioned. We might then be more open to aggregating across persons as we do within a life." 
    - The activity sets up the intuition that supports the separateness objection, but it does not challenge that intuition. The facilitator must then present the reductionist challenge and let students discuss whether the boundary is morally significant.

    **Confidence:**
    - High confidence that Phase A and Phase C will work as expected (quick agreement).
    - Medium confidence that Phase B will show a significant number of no votes. But it depends on the group. Some groups might be more utilitarian. However, the random assignment and the fact that someone loses should elicit the objection. If not, we can discuss why they voted yes: perhaps they are utilitarians? Then the activity still works to show that they don't share the separateness intuition.

    *Least confident point:*
    - The potential blurring of the separateness objection with the maximin concern in Phase B. It might be hard to disentangle in the debrief. I'm not entirely sure that the random assignment doesn't prime the maximin reasoning. We might need to explicitly ask: "Did you vote no because you were afraid of being A? Or because you think it's wrong to harm A even if you were sure you would be B?"

    **Final Adjustments:**
    - To make Phase B more parallel to Phase C, note that in Phase C, the person is gaining 1 point, but in Phase B, the world gains 1 point. The utilitarian sees no difference. The non-utilitarian does.

    We are ready to run.
answer: |-
  ### Full Runnable Activity: "The Boundary of Self"  
  **Objective:** Make the separateness-of-persons objection palpable by exposing the asymmetry in students' willingness to aggregate well-being within a life vs. across lives.  

  ---

  ### **Materials & Setup**  
  - **Index Cards:**  
    - Prepare 16 identical strips (one per student). Each strip has 5 cards labeled:  
      - **Period 1:** 6  
      - **Period 2:** 9  
      - **Period 3:** 5  
      - **Period 4:** 7  
      - **Period 5:** 3  
      *Total per student: 30 points.*  
    *Rationale:* Positive integers ensure no negative well-being (avoiding extraneous distress). Period 2 starts high (9) to allow a 3-point loss; Period 4 starts at 7 to absorb a 4-point gain. Totals are large enough to keep sums legible.  
  - **Ballots:**  
    - **Phase B Ballot (one per pair):**  
      *"Policy Proposal: Randomly assign one person in your pair as ‘A’ and the other as ‘B.’ Then:  
      - A loses 3 points from Period 2.  
      - B gains 4 points in Period 4.  
      Net effect: World well-being increases by 1 point.  
      Vote: Enact this policy? ◻ Yes ◻ No"*  
    - **Phase C Ballot (one per student):**  
      *"Policy Proposal: For yourself:  
      - Lose 3 points from your Period 2.  
      - Gain 4 points in your Period 4.  
      Net effect: Your total well-being increases by 1 point.  
      Vote: Enact this policy? ◻ Yes ◻ No"*  
  - **Other:**  
    - Hat for random A/B assignment slips (8 "A" and 8 "B" slips).  
    - Whiteboard to record vote counts.  

  ---

  ### **Timeline (75 Minutes)**  
  | Time  | Phase                               | Key Instructions                                                                 |  
  |-------|-------------------------------------|----------------------------------------------------------------------------------|  
  | 0-5   | **Setup**                           | Distribute strips. Explain: "Each card is a life period. Your score is the sum of YOUR strip. No pooling." |  
  | 5-10  | **Phase A (Solo)**                  | "Move 3 points from YOUR Period 2 to YOUR Period 4. New scores: P2=6, P4=10. Total unchanged (30)." *Observe unanimous compliance.* |  
  | 10-20 | **Phase B (Pairs, Secret Ballot)**  | Pair students. Hand out Phase B ballots: "Vote secretly. Remember: A/B assignment is random AFTER voting." Collect ballots. |  
  | 20-25 | **Random Assignment**               | Draw A/B slips from hat for each pair. Announce: "If your pair’s policy passed, A and B adjust scores NOW." |  
  | 25-30 | **Phase C (Same Pairs, Ballot)**    | Hand out Phase C ballots. "Vote for YOURSELF. Adjust scores if passed." Collect ballots. |  
  | 30-35 | **Reveal Votes**                    | Tally Phase B/C votes on whiteboard. *Expected:* B has significant "no" votes; C near-unanimous "yes." |  
  | 35-45 | **Phase D (Reveal & Small Groups)** | Reveal script (below). Split into 4 groups of 4. Assign: "Articulate the principle separating B and C. Defend it against: ‘Isn’t this just selfishness?’" |  
  | 45-60 | **Group Discussion**                | Groups discuss. Circulate, probe: "Why is compensation within one life okay, but across lives troubling?" |  
  | 60-75 | **Debrief (Whole Group)**           | Debrief structure (below). Address consent/maximin issues. Parfit challenge (if time). |  

  ---

  ### **Phase D Reveal Script (Keep Short)**  
  > "Look at the votes. In Phase B—where we take 3 from A’s Period 2 and give 4 to B’s Period 4—many of you said no. But in Phase C—the EXACT SAME TRANSFER, just within your own life—almost all said yes. This is the separateness-of-persons objection in action. Utilitarianism sees both as a net +1 gain and says ‘do it.’ But you drew a line: compensation *within a life* is fine, but compensation *across lives* isn’t—even when the math is identical. The discontinuity is at the boundary of the self."  

  ---

  ### **Debrief Structure: Map Phases to the Objection**  
  **Goal:** Connect activity to ethics concepts *without lecturing*. Use Socratic questions.  
  1. **Phase A → Aggregation Within a Life:**  
     - *Prompt:* "In Phase A, you instantly moved points across time. Why no hesitation?"  
     - *Link:* "This shows **aggregation within a life**: we treat our future/past selves as one ‘person’ whose losses/gains compensate. Utilitarians extend this logic to society."  
  2. **Phase B vs. C → The Asymmetry:**  
     - *Prompt:* "In Phase B, why did ‘net +1 for the world’ fail to convince? In Phase C, why did ‘net +1 for you’ work instantly?"  
     - *Link:* "**Separateness-of-persons**: We resist aggregating across lives because persons are distinct ends-in-themselves (Kant) or because harms/benefits to *others* can’t compensate (Rawls)."  
  3. **Core Tension:**  
     - *Question:* "Is this asymmetry rational? Or is it bias toward our own timeline?"  
     - *Highlight:* "The objection’s backbone: **Personal identity matters morally**. Sacrificing Alice to help Bob violates Alice’s separateness—even if society gains."  
  4. **Name-Drop Efficiently:**  
     - Rawls: "This is why Rawls called utilitarianism an ‘extension of individual choice’—it ignores how persons are distinct, not just time-slices."  
     - Parfit: "But Parfit questions if personal boundaries are this sharp. If persons are ‘reduced’ to experiences (e.g., psychological connectedness), maybe aggregation *is* rational. Should we feel differently?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"What if A consents?"**  
     - *Preempt:* In Phase B instructions, add: "This policy is imposed; consent isn’t sought."  
     - *In-Room:* "Consent would make this contractualism, not utilitarianism. Utilitarians endorse this *without* consent—that’s the issue."  
  2. **Maximin Instinct (Rawlsian Distraction):**  
     - *Preempt:* Phase B ballot avoids "veil of ignorance" language (no fairness/inequality framing).  
     - *In-Room:* If students say, "I voted no to avoid being A!" probe: "Would you still object if you *knew* you’d be B? Why?" Then clarify:  
       - **Maximin:** "Avoiding worst-case outcomes (Rawls) is different from objecting to *any* non-consensual sacrifice (separateness)."  
  3. **Phase C Unanimity Too Easy:**  
     - *Mitigation:* If students call Phase C "obvious," ask: "Would you accept the trade if Period 2 was painful and Period 4 was joyful? What if it caused regret?" Links to Parfit.  
  4. **Low Phase B Rejection Rate:**  
     - *Workaround:* If many vote "yes" in B, pivot: "Utilitarians in the room—why did you override the separateness intuition? Defend to your peers."  

  ---

  ### **What the Activity Can’t Reproduce & Facilitator Fix**  
  **The Gap:** This activity dramatizes the *intuitive asymmetry* but **cannot challenge the metaphysical claim** that persons are irreducible. It might even entrench the boundary. Parfit’s reductionism (persons as "bundles of experiences") is invisible here.  
  **Facilitator Must:**  
  1. **Explicitly Introduce Reductionism:**  
     - "Parfit argues there’s no ‘deep further fact’ of personal identity—just psychological connections. If Alice’s suffering and Bob’s joy are just experiences in the universe, why prioritize the ‘person’ boundary?"  
  2. **Pressure the Boundary:**  
     - Ask: "In Phase A, you compensated between your ‘younger’ and ‘older’ self. What if your older self is a stranger? (e.g., memory loss). Does the objection weaken?"  
     - "If personal boundaries are fuzzy, is separateness a moral truth or a bias?"  
  3. **Assign Follow-Up Reading:**  
     - Parfit’s *Reasons and Persons* (Ch. 12) for next class to dissect the metaphysics.  

  ---

  ### **Confidence Assessment**  
  - **High Confidence:**  
    - Phase A/C will work (solo aggregation is frictionless; self-gain is irresistible).  
    - Phase B will generate tension (random assignment triggers self-interest + separateness intuition).  
    - Debrief maps cleanly to Rawls/separateness (the asymmetry is vivid).  
  - **Medium Confidence:**  
    - Phase B rejection rate (depends on group’s prior utilitarianism leanings; 60-80% "no" expected).  
  - **Lowest Confidence:**  
    **Disentangling maximin from separateness in debrief.** Students might *say* "separateness" but *mean* "I didn’t want to lose." Solution: Drill into motivations with "Would you object if guaranteed to be B?" and contrast Rawls quotes.  

  **Final Tip:** Pre-write discussion prompts on slides. If Phase B votes are split, use it: "Let’s hear from a ‘yes’ and ‘no’ voter—what was your reasoning?" This surfaces the objection organically.
