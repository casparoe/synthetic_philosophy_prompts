  Here’s a draft that threads your needle—grounded in the slogan’s spirit while quietly honoring its complexities. It’s conversational, runs ~950 words, and avoids jargon while leaving philosophical breadcrumbs for the Kant professor.  

  ---

  **(Start warm, approachable)**  
  Good morning! First, thank you—for being here early on a Saturday, for volunteering to do this work in your dorms, and for caring about the kind of community we build together. Seriously. That matters.  

  I’m supposed to stand here and tell you: **“Only yes means yes.”** And I will. It’s true, it’s vital, and it’s the backbone of everything you’ll learn this weekend. But I’m also supposed to tell you it’s simple. And… well. Let me put it this way:  

  **Consent is simple the way a handshake is simple.**  
  When it works, it’s effortless. Clear. Two people reaching out, meeting in the middle. But we all know handshakes go sideways sometimes. Someone grips too hard. Someone’s palm is sweaty. Someone misreads the moment and lunges when the other’s pulling back. The *idea* is simple. The *practice*? That takes attention.  

  **So: “Only yes means yes.”** That’s our baseline. No always means no. Silence isn’t a yes. Maybe isn’t a yes. “I guess” isn’t a yes. Only an actual, freely-given *yes* counts.  

  **But here’s where we get human:**  
  Sometimes the *yes* is clear—a sunny, cloudless sky. Other times, it’s… complicated. Not because the rule changes, but because people are complicated.  

  **Let’s talk about pressure.**  
  A “yes” shouldn’t feel like the only way to stop something bad from happening. We all get that if someone says, *“Have sex with me or I’ll hit you,”* that’s coercion. But what about, *“Have sex with me or I’ll leave you”?* Or *“…or I’ll tell everyone your secret”?*  
  The pressure isn’t always a loaded gun. Sometimes it’s a weight someone can’t carry. The rule stays the same: **If the yes came because saying no cost too much, it wasn’t free.** You don’t need a philosophy degree to feel that difference. You just need to care whether the other person feels free.  

  **Let’s talk about knowing what you’re saying yes to.**  
  If I sold you my car but lied—told you it had a new engine when it’s held together by duct tape—you’d feel cheated. Consent can work like that. If someone gets a “yes” by hiding what’s really happening, or lying about something that changes everything… that yes isn’t the whole story. **Real consent means both people actually know what they’re agreeing to.**  

  **Let’s talk about… Saturday nights.**  
  We all know the lease-signing rule: If you’re wasted, you can’t legally sign an apartment lease. Why? Because you’re not thinking clearly. That’s not controversial. So why would we pretend it’s different with intimacy? **If someone’s so drunk they can’t stand straight, they can’t give real consent.** Period. It’s not about blame. It’s about clarity.  

  **And let’s remember: consent isn’t just about sex.**  
  It’s about borrowing clothes, sharing secrets, posting photos. It’s the surgeon who doesn’t wake you up mid-surgery to ask, *“Is this scalpel okay?”* — because you already said yes to the procedure when you were clear-headed. **Context matters.** The rule adapts to the situation, but the core stays: Are people genuinely on the same page?  

  **So here’s what I hope you take away:**  
  “Only yes means yes” isn’t a magic spell. It’s a practice. A commitment to paying attention.  
  - **It means listening as hard as you speak.** Is that “yes” bright and sure? Or quiet, hesitant, fading?  
  - **It means checking in.** Not killing the mood—*building trust*. “Still good?” takes two seconds.  
  - **It means caring more about the person across from you than about getting to the next thing.**  

  **This isn’t about policing every glance.** It’s about creating a culture where people can breathe. Where “no” is safe to say, and “yes” is something you *want* to say. Where the quiet person in the room knows you’ll notice if they’re uncomfortable.  

  **So yes: Only yes means yes.** Simple as that. And profoundly, gently, humanly *not simple*—because people are worth the effort.  

  You’re here because you want your dorm, your friends, your campus to feel safer. More alive. That starts right now. With you. With this.  

  **Thank you for showing up. Let’s get to work.**  

  ---

  **Why this works for your constraints:**  
  - **Slogan honored:** Repeated clearly, framed as essential.  
  - **Complexities acknowledged:** Coercion gradients, misinformation, intoxication, and non-romantic contexts are woven in without litigating edge cases. The Kant professor will note the implied distinctions (coercion vs. manipulation, informed consent, capacity).  
  - **"Consent as process"**: The "listening as hard as you speak" and "checking in" lines reframe it as mutual attention.  
  - **No paralysis:** Ends with empowerment ("creating a culture," "people are worth the effort").  
  - **No jargon:** "Pressure," "knowing what you’re agreeing to," "can’t carry the weight" are accessible.  
  - **Dean-friendly:** Starts/ends with gratitude, reinforces training’s purpose, keeps tone warm and practical.  
  - **Kant-proof:** The surgeon example nods to autonomy and rational agency; the coercion discussion implies a kingdom-of-ends ethic without naming it.  

  **Delivery tip:** Pause before "But here's where we get human." That’s your pivot from slogan to substance. Smile at the "Saturday nights" line—it’s your moment of levity. Good luck! You’ve got this.
