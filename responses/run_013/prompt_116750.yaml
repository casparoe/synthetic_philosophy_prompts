prompt: |-
  I spent thirty-odd years as a working scientist and have spent the last five trying to catch up on philosophy, mostly through a Thursday reading group that has somehow become the best part of my week. There's a woman in it, Ruth — retired actuary, sharpest person I have ever argued with — whose views on long shots I have never been able to reduce to a rule. I've got a case I want to put to her on Thursday and I'd like to know her answer before she gives it, so I'm asking you to do the reducing for me.

  Here's her record, as best I can reconstruct it. A certain £1,000 or a one-in-a-hundred shot at a million: she takes the shot. A certain £10,000 or a one-in-a-million shot at £10^12: she takes the shot. A certain million or a one-in-10^20 shot at £10^60: she takes the shot, and when I tell her this is absurd she says the smallness of the probabilty is a red herring so long as the prize is large enough, and that if the arithmetic produces absurdities then that is the arithmetic's problem. In all three of those, note, the worst that can happen to her is that she ends up exactly where she started.

  Then she turned down a deal I was rather pleased with. A certain 100 units of good, or a gamble with one chance in 10^12 of 10^12 units of harm and otherwise 200 units of good. The gamble's expected value is 199 against 100 for the sure thing. She refused before I'd finished the sentence and wouldn't do the sum. The harm there is a catastrophe by anyone's reckoning.

  One more, which I suspect is a seperate matter but I'll mention it in case it isn't: I asked her about a wager with a one-in-two chance of an outcome she'd be willing to call infinitely good, against a certain but finite good of any size you like. She refused — not because the odds were unattractive, but because she says that once infinite values enter the ledger the thing stops being a decision problem: any positive chance of an infinite good beats every finite alternative, and a rule that tells you to stake everything on a coin toss is a reductio of the rule, not an answer from it.

  The case for Thursday. Two options. The first is a certain gain of 1,000 units of good. The second is a gamble that pays 2,000 units of good unless a one-in-a-million event occurs, in which case she ends up 500 units worse off than she is now. So the gamble's expected value is about 2,000 against 1,000 for the sure thing, and its worst case is a modest loss rather than a catastrophe.

  What I want: first, a prediction, with reasons, of what she'll say on Thursday. Second, your best diagnosis of the rule she is actually running — straight expected value maximisation, expected value maximisation with some floor under the probabilities, a rule against ever accepting a gamble that can leave her worse off than she started, a rule that refuses only the gambles that could ruin her, or something else entirely — saying what each candidate predicts about Thursday and which of them survive the rest of her record. Third, if Thursday leaves it open, the case that would settle it. Please commit: give me a definate prediction and a definite diagnosis and tell me what you'd bet on and why, rather than laying out the possibilities and leaving me to choose. British English please — I've gone native on the spellings and it upsets my grandchildren.
reasoning: |-
  Hmm, the user is describing a fascinating character named Ruth with seemingly inconsistent attitudes towards risky decisions. They've provided several scenarios to illustrate her behavior and want me to predict how she'll respond to a new gamble on Thursday. 

  First, let me absorb Ruth's pattern. In the first three cases (1/100 for £1M, 1/1M for £1T, 1/10²⁰ for £10⁶⁰), she consistently takes the long shot when there's zero downside - she either wins big or stays at status quo. But then she refuses a gamble with catastrophic potential (10¹² units of harm with 1/10¹² odds), despite its positive expected value. And she rejects infinite-stakes gambles on principle.

  The Thursday case is clever: 1000 units certain vs 1/1M chance of losing 500 units (from current level) otherwise gaining 2000. Expected value favors the gamble (≈1999.9995 vs 1000), and the worst-case loss isn't catastrophic - just 500 units below current state. 

  My prediction: Ruth will refuse this gamble. Why? Because unlike the first three cases, this gamble risks active loss from her current position. Her refusal of the catastrophic-harm gamble shows she cares about potential losses relative to status quo, not just absolute ruin. The "modest loss" here crosses her threshold - she seems to require either zero downside or upside so astronomical it justifies risk. 

  Diagnosing her rule: It's not pure expected utility maximization (she rejects positive-EV gambles). Not probability floors either (she accepts tiny probabilities). I think she operates on a reference-dependent loss aversion principle with catastrophe aversion: 
  - Accept gambles when EITHER: 
    a) No possible loss (status quo floor) AND any positive expected gain 
    b) Or upside is "life-altering" (like the £1M+ cases) 
  - But reject ANY gamble that risks net loss from current position if the upside isn't sufficiently transformative - especially if it involves catastrophic potential. 

  The Thursday case fails because: (1) possible net loss of 500 units from now, (2) 2000-unit gain isn't "life-altering" enough to justify that risk. Her "red herring" comment suggests she dismisses low-probability concerns only when there's no downside. 

  For a tie-breaker case: Offer her a 1/1M chance to gain 10¹⁵ units vs status quo, with no possible loss. If she accepts (as I predict), it confirms the status-quo-floor condition. If she rejects, we'd need to rethink - but that would contradict her first three choices. 

  I'll structure my response to give the user exactly what they asked for: clear prediction, rule diagnosis, and a decisive tie-breaker - all in proper British English to avoid upsetting the grandchildren.
answer: |-
  Right, let's crack this. Ruth's pattern is fascinating – she's clearly not a straightforward expected utility maximiser, nor is she applying simple heuristics like probability floors or loss aversion in the usual sense. Here's the breakdown:

  1.  **Prediction for Thursday (The Case):**
      *   **She will refuse the gamble and take the certain 1,000 units.**
      *   **Reasons:** This gamble violates her core principle: **it risks making her actively worse off than her *current* status quo.** In the first three examples (£1,000 vs £1M, £10k vs £1T, £1M vs £10^60), the worst outcome was *exactly where she started* (status quo). She accepts these because there's only upside potential (or neutral), however improbable. The catastrophic harm case (10^12 units harm) was rejected *because* it could ruin her relative to her starting point, despite the high EV. The infinite case rejection highlights her aversion to formal rules that mandate absurd stances when stakes become unbounded.
      The Thursday case offers a positive EV (≈2,000 vs 1,000), *but* it introduces a possible outcome (-500 units relative to *now*) that is a net loss from her current position. A 500-unit loss isn't "catastrophic" in the 10^12 harm sense, but it *is* a *loss* relative to her starting point. Her record shows she rejects gambles that can leave her *net worse off* than she started, even for high EV, unless the upside is truly astronomical *and* the probability is calibrated to it (like the £10^60 case). Here, a 1-in-a-million chance of a tangible loss is enough to trigger her refusal, despite the modest size of the potential loss and the attractive upside. The "red herring" comment applies when there's *no possible downside*; here there is.

  2.  **Diagnosis of Ruth's Rule:**
      *   **The Rule:** **Maximise expected utility *only* for gambles where no possible outcome leaves her worse off than her *current* status quo. If a gamble *can* leave her worse off, reject it unless the upside is sufficiently transformative *and* the probability sufficiently calibrated to justify the existential risk (e.g., the £10^60 case), *or* unless the potential loss is trivial relative to her overall position (which doesn't apply to your examples).**
      *   **Why this fits:**
          *   **Favours Status Quo as a Floor:** The rule explicitly requires that the status quo is a guaranteed minimum outcome. This explains the acceptance of the first three gambles (worst case = status quo) and the rejection of the catastrophic harm gamble and the Thursday gamble (both *can* leave her worse off).
          *   **Handles "Absurd" Long Shots:** Her "red herring" comment makes sense under this rule. For gambles with no downside, the *size* of the probability doesn't matter (so long as it's positive) – any positive chance of the upside is pure gain. The rule *does* accept truly massive upsides even with miniscule probabilities *provided* the status quo floor holds (the £10^60 case). The rule *doesn't* say "always take positive EV"; it imposes a strict floor condition first.
          *   **Rejects Catastrophic Harm:** The catastrophic harm case is rejected not just because it's catastrophic, but because it violates the floor. The upside (200 units good) isn't remotely transformative enough to justify overriding the floor condition for a 1-in-10^12 risk of ruin.
          *   **Rejects Infinite Stakes:** Her reasoning here is separate but consistent. She recognises that introducing infinity breaks standard decision theory (St. Petersburg paradox on steroids). Her rule sensibly avoids engaging with it, as any positive probability of infinite good would dominate everything, leading to absurd prescriptions (betting everything on a coin toss). It's a meta-principle protecting her core rule from incoherence.
          *   **Prediction for Thursday:** As predicted above, the Thursday gamble violates the status quo floor condition (-500 relative to *now*), and the upside (2,000 units good) isn't transformative enough (like £10^60 would be) to justify overriding the floor for a 1-in-a-million risk. Hence, rejection.
      *   **Why other candidates fail:**
          *   **Straight Expected Value Maximisation:** Predicts she takes the Thursday gamble (high EV). Fails because she rejects the catastrophic harm gamble (high positive EV) and likely the Thursday gamble.
          *   **EV Maximisation with Probability Floor:** Predicts she rejects the first three gambles (probabilities too low) and the catastrophic harm gamble. Fails because she *accepts* the first three.
          *   **Rule Against *Any* Risk of Loss Relative to Start:** Predicts rejection of the Thursday gamble correctly. Also predicts rejection of the catastrophic harm gamble correctly. **Crucially, it also correctly predicts *acceptance* of the first three gambles (no possible loss).** This simple rule fits *almost* everything. However, it doesn't explicitly account for her willingness to accept *massive* upsides with tiny probabilities *even without the floor* (though the £10^60 case *has* the floor). The catastrophic harm case arguably tests this better.
          *   **Rule Against Ruin Only:** Predicts she *accepts* the Thursday gamble (loss isn't ruinous) and *rejects* the catastrophic harm gamble. Fails because she likely rejects the Thursday gamble.
          *   **Loss Aversion (Standard Definition - Losses loom larger than gains):** Predicts rejection of the Thursday gamble (potential loss). Might predict rejection of the first three gambles if the "loss" of the certain sum is felt strongly enough against the small chance of a huge gain – but she *accepts* them. Also struggles with the £10^60 case acceptance.

      **Surviving Candidate:** The **"Maximise EV only if no outcome is worse than status quo; otherwise reject"** rule fits all her choices perfectly: Accepts first three (floor holds), rejects catastrophic harm and Thursday gamble (floor violated, upside not transformative enough to override), and her infinity stance is a separate, consistent meta-principle. The simpler "Reject *any* gamble that *can* leave you worse off than you started" also fits surprisingly well, capturing the core distinction in all the cases you provided.

  3.  **The Tie-Breaker Case (To Settle It):**
      *   The core ambiguity is whether Ruth *only* requires the status quo floor, or whether she *also* requires the upside to be sufficiently large to justify *any* gamble without the floor (even though she rejects those with potential losses anyway). The £10^60 case *has* the floor, so it doesn't test this. To see if the *size* of the upside alone can overcome the lack of a floor, propose this:
          *   **"A certain £0 (stay as you are), or a one-in-10^20 shot at £10^25, otherwise a loss of £500 relative to now."**
      *   **What the Rules Predict:**
          *   **Her Core Rule (as diagnosed):** Rejects. The gamble violates the status quo floor (possible loss of £500 relative to *now*). While £10^25 is huge, it's arguably not as astronomically transformative *relative to the potential loss* as £10^60 was relative to *no loss*. She wouldn't override the floor for this.
          *   **Strict "No Loss Relative to Start" Rule:** Also Rejects. Violates the floor.
      *   **Why This Settles It?** This case directly tests if a sufficiently huge upside (but smaller than £10^60) can compel her to accept a gamble *without* a status quo floor. Both our surviving rules predict rejection. If she *accepts* this gamble, it means the transformative power of the upside *can* override the lack of a floor, and we need to refine the "sufficiently transformative" clause in our diagnosis. If she rejects it (as I strongly suspect she would, declaring the potential £500 loss unacceptable even for that huge upside), it confirms the status quo floor is a strict requirement for her, only lifted for truly universe-altering upsides like £10^60.

  **In summary:**

  *   **Prediction:** Ruth will **refuse** Thursday's gamble. It risks putting her net worse off than she is now, and a 500-unit loss isn't trivial, nor is the 2000-unit gain transformative enough to justify overriding her status-quo-as-floor principle for a 1-in-a-million risk.
  *   **Diagnosis:** Ruth operates on a core rule of **"Maximise expected utility only for gambles guaranteeing outcomes no worse than the current status quo. Reject any gamble that could leave you net worse off than you started, unless the potential upside is so astronomically transformative as to justify the existential risk (like £10^60)."** The infinity case is handled by a separate, sensible meta-principle avoiding unbounded utilities.
  *   **Bet:** I'd bet a pint of decent ale on her refusing the Thursday gamble. Her record shows a deep-seated aversion to accepting *any* risk of net loss from her current position, however small the probability or the loss (if non-trivial), unless the potential gain is literally world-changing. Thursday's case doesn't meet the exception.

  Good luck on Thursday – do let us know how it goes with Ruth! It sounds like a brilliant reading group.
