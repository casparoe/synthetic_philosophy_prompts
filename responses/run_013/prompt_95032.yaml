prompt: |-
  I hold a view about philosophical thought experiments and want to know what would count against it. Distinguish a case’s load-bearing features — the structural elements the argument actually needs to generate its conclusion — from its scaffolding: the vivid, emotionally salient, or narratively contingent details that could be varied without altering the argument’s logical skeleton. My position is that a thought experiment provides evidence for a philosophical claim only if the target intuition survives the removal of its scaffolding; when the intuition evaporates once the scene is stripped to its load-bearing features, the case is an intuition pump in the pejorative sense and should carry no probative weight. What would count against this? I want the defeaters ranked from decisive to merely awkward, including cases where scaffolding seems epistemically indispensable, arguments that the load-bearing/scaffolding distinction cannot be drawn independently of the intuition it is meant to test, and findings from experimental philosophy or cognitive science about the reliability of stripped-down intuitions. Which of these would a defender of my view have to concede as genuine costs, and which could they dismiss? Is the position at risk of insulating itself — if every recalcitrant intuition can be redescribed as scaffolding, is that fatal or an acceptable feature of a normative criterion? Separate what is settled from what is genuinely contested among people who know this literature, and do not present a contested view as the consensus.
reasoning: |-
  Okay, the user presents a sophisticated position on philosophical thought experiments, distinguishing load-bearing features from scaffolding. They want to know what could count against their view, specifically asking for defeaters ranked by strength. 

  First, I need to unpack their core claim: intuitions only provide evidence if they persist when scaffolding is removed. The user is clearly well-versed in philosophy, likely a grad student or academic given their nuanced framing and reference to experimental philosophy. Their anxiety about self-insulation suggests they've thought deeply about potential circularity.

  The strongest counter seems to be the "indispensable scaffolding" argument—some intuitions might fundamentally require narrative elements. That's decisive because if true, it breaks their thesis outright. The independence problem comes next; if we can't objectively distinguish load-bearing features without relying on the very intuition being tested, that's nearly fatal. Experimental philosophy findings are messy—some support their view (framing effects), some undermine it (stripped cases eliciting disagreement). These are awkward but not knockout blows.

  The self-insulation worry is thorny. If defenders can always dismiss counterexamples by reclassifying features as scaffolding, that smells like unfalsifiability. But maybe that's an acceptable cost—all criteria have boundary disputes. The user needs to decide if this is a bug or feature.

  What's uncontested? Most agree that irrelevant details shouldn't drive conclusions. What's contested? Whether scaffolding can ever be epistemically necessary, and whether the distinction is objective. The user's position is defensible but carries real costs—they'll need to bite bullets on indispensable scaffolding cases and handle the independence problem carefully. Experimental philosophy data is ambiguous enough to maneuver around.

  The user's depth suggests they want steelmanning, not reassurance. I'll structure the reply to validate their framework while pressing hard on its weak points. Their meta-awareness about insulation deserves particular nuance—it's either a deep flaw or just how normative theories work. No easy answers here.
answer: |-
  Here's a breakdown of potential defeaters for your view, ranked from most decisive to least decisive, analyzing their force and how a defender might respond. This distinguishes settled points from contested debates within the literature:

  ### Decisive Defeaters (If Proven True)

  1.  **Epistemically Indispensable Scaffolding:**
      *   **The Challenge:** Certain philosophically crucial intuitions *cannot* be elicited or sustained *without* specific narrative, emotional, or vivid details (the "scaffolding"). The "load-bearing" structure alone is insufficient to trigger the relevant cognitive response or judgment. Examples might include intuitions about personal identity involving gradual transformation, deep moral dilemmas requiring empathetic engagement, or thought experiments designed to reveal embodied cognition.
      *   **Why Decisive?** If true, this directly contradicts your core claim that evidence requires the intuition to survive scaffolding removal. Some scaffolding isn't just helpful; it's *constitutive* of the intuition.
      *   **Defender's Response:** Very difficult to concede without abandoning the core view. They must either:
          *   Argue that the intuition *can* be elicited without that specific scaffolding (perhaps with different scaffolding or a different stripped-down formulation).
          *   Argue that the intuition elicited *with* scaffolding is unreliable or misinterpreted, and the *correct* philosophical judgment *can* be reached without it (shifting the burden).
          *   **Cost:** Must deny the phenomenological reality of certain intuitions or argue they are philosophically irrelevant even if real.
      *   **Status:** **Contested.** Proponents (e.g., certain narrative ethicists, some enactivists) argue some moral/epistemic insights *require* narrative context. Opponents (like your view) argue that the *philosophical core* must be detachable. Experimental work on embodied cognition potentially supports this defeater.

  ### Strong Defeaters (Potentially Fatal, Requires Careful Defense)

  2.  **The Independence Problem (Circularity/Theory-Ladenness):**
      *   **The Challenge:** There is no theory-neutral, intuition-independent way to identify the "load-bearing features" vs. "scaffolding." What counts as load-bearing is *itself* determined by the very intuition the thought experiment is meant to test, or by the philosophical theory one already holds. The distinction collapses into circularity.
      *   **Why Strong:** If the load-bearing/scaffolding distinction depends on the intuition, then "stripping away scaffolding" is just removing whatever *didn't* trigger *that specific* intuition. The "test" becomes vacuous – the intuition will always survive by definition. It insulates the intuition.
      *   **Defender's Response:**
          *   Argue that logical structure, conceptual entailments, and counterfactual dependencies *can* be analyzed independently of the elicited intuition. Load-bearing features are those without which the *argument* for the conclusion collapses.
          *   Point to cases where most philosophers agree on what's essential (e.g., in a Gettier case, the justified true belief structure is load-bearing; the specific job or car details are scaffolding).
          *   **Cost:** Requires a robust, defensible account of conceptual/logical analysis independent of psychological intuition. Must explain apparent disagreements about what's load-bearing in controversial cases.
      *   **Status:** **Hotly Contested.** This is a central criticism from proponents of "negative" experimental philosophy (e.g., Weinberg, Alexander), hermeneutic approaches, and those skeptical of analytic intuition-mongering. Defenders of conceptual analysis (e.g., Sosa, Williamson in some moods) argue logic/concepts provide independence.

  3.  **The Self-Insulation Problem:**
      *   **The Challenge:** Your criterion is unfalsifiable. *Any* intuition that evaporates upon stripping can be dismissed by simply reclassifying the features it depended on as "mere scaffolding." Conversely, any intuition that survives stripping is validated. There's no independent check on what counts as scaffolding vs. load-bearing, making the view immune to counterexample.
      *   **Why Strong:** It turns the view into a non-empirical, purely stipulative definition of "genuine evidence." It risks being an empty tautology: "Only intuitions that survive stripping are evidentially weighty" becomes "Only intuitions we deem evidentially weighty survive stripping."
      *   **Defender's Response:**
          *   Argue the distinction *isn't* based solely on the fate of the intuition, but on independent conceptual/logical analysis (linking back to defeating #2).
          *   Frame it as a *normative* criterion for evaluating thought experiments, not a descriptive claim about all intuitions. It prescribes *when* we *should* take an intuition as evidentially significant. Redescription is part of the normative process.
          *   **Cost:** Accepts that the view relies on substantive philosophical judgment about conceptual structure. May concede that borderline cases exist, but argue the criterion is still useful for clear cases of egregious scaffolding-dependence.
      *   **Status:** **Contested, but a Core Tension.** Critics see this as fatal. Defenders see it as an inherent feature of normative philosophical methodology, akin to demanding valid arguments or consistent premises. The debate hinges on whether the load-bearing/scaffolding distinction *can* be applied non-arbitrarily.

  ### Awkward Defeaters (Challenging but Manageable)

  4.  **Experimental Philosophy (X-Phi) Data on Stripped-Down Cases:**
      *   **The Challenge:** X-Phi findings show that even highly abstract, stripped-down cases ("load-bearing features only") often elicit:
          *   Significant disagreement (undermining the reliability/stability of the intuition).
          *   Susceptibility to framing, order effects, or demographic factors (suggesting residual "hidden scaffolding" or cognitive biases affecting core concepts).
          *   Intuitions that *differ* from those elicited by the original scaffolded case.
      *   **Why Awkward:** Challenges the reliability/stability of intuitions even *without* obvious scaffolding, suggesting the "load-bearing" features alone might not be sufficient for robust evidence. Also suggests stripping might not isolate a pure "logical core" but just one more frame.
      *   **Defender's Response:**
          *   Concede X-Phi shows widespread intuitions are often unreliable. Argue this *strengthens* the need for a criterion like yours: even stripped intuitions need careful scrutiny, but scaffolded ones are *worse*.
          *   Distinguish between *competent* philosophical judgment (often the target) and folk intuition. X-Phi often targets the latter.
          *   Argue disagreement in stripped cases reveals genuine conceptual complexity/ambiguity needing philosophical work, unlike mere scaffolding effects which are noise.
          *   **Cost:** Must refine the view: surviving stripping is *necessary but not sufficient* for evidence; stripped intuitions also need to be stable, reflect conceptual competence, etc.
      *   **Status:** **Settled that effects exist; Contested on implications.** X-Phi robustly shows variability. The *interpretation* – whether it dooms intuitions, challenges specific theories, or just shows folk limitations – is heavily debated. Your view can incorporate this data as highlighting a *further* challenge for *all* intuitions, not a specific refutation.

  5.  **The Pedagogical/Heuristic Indispensability of Scaffolding:**
      *   **The Challenge:** Scaffolding is essential for *discovering* the relevant intuition or grasping the abstract problem in the first place, especially for learners or complex issues. Removing it makes the thought experiment inaccessible or cognitively inert, hindering philosophical progress even if the logical core remains.
      *   **Why Awkward:** While arguably not directly challenging the *evidential* claim (your view concerns justification, not discovery/heuristics), it suggests your criterion might render important philosophical tools unusable for their primary function (sparking insight/discussion). It raises the question: if scaffolding is indispensable for *finding* the intuition, why should it be irrelevant for *justifying* it?
      *   **Defender's Response:**
          *   Readily concede scaffolding's vital pedagogical and heuristic role. Strictly separate the context of discovery from the context of justification.
          *   Argue that once the intuition/argument *is* grasped via scaffolding, the philosopher's task is to test it by stripping away the non-essential elements to see if the core holds.
          *   **Cost:** Accepts a limited role for scaffolded cases. Must maintain a firm distinction between pedagogy and evidence.
      *   **Status:** **Mostly Settled.** Few deny scaffolding's heuristic value. The debate is whether this value bleeds into justificatory force. Your view can comfortably accommodate this by clearly separating justification from discovery.

  **Conclusion & Key Tensions:**

  *   **Decisive Concessions Required:** A defender *must* bite the bullet on **Epistemically Indispensable Scaffolding** if proven for specific cases. They *must* provide a robust, non-circular solution to the **Independence Problem**.
  *   **Managing Self-Insulation:** The **Self-Insulation Problem** is a major challenge. Defenders must argue that applying the distinction is a substantive normative philosophical endeavor based on conceptual/logical analysis, not *merely* redescribing to fit pre-conceived notions. This is contested but not necessarily fatal; many philosophical criteria face similar boundary-drawing issues.
  *   **Incorporating X-Phi & Heuristics:** Findings on **Stripped-Down Intuitions** are awkward but can be integrated by demanding *further* reliability conditions. The **Pedagogical Indispensability** of scaffolding is easily accommodated by separating discovery from justification.
  *   **Core Contested Issues:** The central battlegrounds are:
      1.  Whether any intuitions *require* scaffolding (Epistemically Indispensable Scaffolding).
      2.  Whether the load-bearing/scaffolding distinction can be drawn objectively and non-circularly (Independence Problem).
      3.  How to interpret the variability of intuitions in stripped-down cases shown by X-Phi.

  Your position is a defensible and stringent normative criterion. Its main costs are potentially excluding some seemingly important intuitions (if scaffolding is indispensable) and the heavy burden of justifying the independence and non-arbitrariness of the load-bearing/scaffolding distinction. It does not rely on a consensus view and engages directly with major criticisms in the literature.
