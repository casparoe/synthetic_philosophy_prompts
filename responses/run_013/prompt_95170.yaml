answer: |-
  Based on your verdicts and the constraints of the one-shot Prisoner's Dilemma (payoffs: T=5, R=3, P=1, S=0; no repetition/reputation/communication; full information), I propose a principle that systematizes your intuitions while addressing your concerns about correlation, identity, and credences. The core idea is that **cooperation is rational when your action is evidence of the opponent's action due to shared decision-relevant properties**, but this evidence must be grounded in symmetry of the decision problem itself—not just subjective beliefs.

  ### Principle: Symmetric Algorithmic Necessitation (SAN)
  **Definition**:  
  Cooperate if and only if:  
  1. **Algorithmic Identity**: The opponent uses the *exact same* deterministic decision procedure as you.  
  2. **Payoff-Information Symmetry**: Both players have identical *payoff structures* and *information* about the game.  
  3. **Action-Outcome Link**: Your action is necessary input to the opponent's decision (i.e., their output depends on yours *because* of algorithmic identity and symmetry).  

  **Rationale**:  
  - SAN satisfies your requirement that identity is binary (resolving embarrassment in case 4) by demanding exact algorithmic identity.  
  - It avoids self-serving credences by tethering correlation to objective symmetry (addressing your worry about subjective probabilities).  
  - It explains why payoff divergence breaks cooperation (case 5) and distinguishes causal strangers (case 3) from superrational partners.  

  ---

  ### Application to Your Cases
  | Case | SAN Verdict | Why It Matches Your Intuition |
  |------|-------------|-------------------------------|
  | **1** (Exact copy) | Cooperate | Algorithmic identity + payoff symmetry force mutual cooperation as the unique rational outcome. Defection violates logical necessity. |
  | **2** (Same procedure, same conclusion) | **Defect** | *Violates SAN*: No guarantee of algorithmic identity (only same "conclusion"). You cooperate IRL due to high credence, but SAN rejects this as insufficiently grounded. |
  | **3** (Causal stranger) | Defect | Fails algorithmic identity (opponent uses CDT, not your procedure). No action-outcome link. |
  | **4** (90% fidelity) | Defect | *Violates SAN*: Algorithmic identity is binary; 90% is probabilistic, not identity. You cooperate IRL, but SAN deems this irrational. |
  | **5** (Payoff divergence) | Defect | Payoff asymmetry breaks condition 2. Opponent prefers (D,D), so mutual defection is their rational choice. |
  | **6** (Distant mirror-agent) | Cooperate | Satisfies SAN: Same algorithm, mirror-image preserves payoff symmetry (*your* R=3 remains better than P=1), and action-outcome link holds acausally. |

  ---

  ### Discriminating New Case: *The Twin Experiment*
  **Setup**:  
  You face two Prisoner's Dilemmas:  
  - **Game A**: Opponent is your exact copy (algorithmically identical, symmetric payoffs).  
  - **Game B**: Opponent is a *correlated clone*—they share your genome, upbringing, and 99.9% of your memories, but their payoffs are inverted (they receive *your* payoff + 2 bonus points).  

  **SAN Verdict**:  
  - **Game A**: Cooperate (meets all SAN conditions).  
  - **Game B**: Defect (fails payoff symmetry: their bonus breaks symmetry, so no action-outcome link).  

  **Why It Discriminates**:  
  - A **correlation-based principle** (e.g., "cooperate if P(opponent cooperates \| I cooperate) > 0.7") would likely cooperate in *both* games due to high probabilistic correlation.  
  - **SAN** cooperates only in Game A, separating *identity* (algorithm + symmetry) from *correlation* (shared traits without symmetry). This matches your rejection of "mysticism" in case 6 when symmetry is broken.  

  ---

  ### Limitations and Tradeoffs
  - **Verdicts SAN Cannot Save**:  
    - **Case 2 (Stranger)**: SAN forces defection, but you cooperate. I recommend *giving up this verdict*. Shared "deliberation procedures" are insufficient without guaranteed algorithmic identity. Cooperation here *is* credence-driven and risks exploitation.  
    - **Case 4 (90% copy)**: SAN forces defection, but you cooperate. I recommend *giving up this verdict*. Fidelity <100% implies non-identity; cooperation is a risk-management heuristic, not rationality.  
  - **Why Keep SAN?**  
    - Resolves your embarrassment in case 4 (identity is binary).  
    - Explains case 5 (payoff symmetry is necessary).  
    - Justifies one-boxing (Newcomb's Predictor satisfies SAN: your choice is evidence of the prediction *because* of symmetry/algorithmic identity).  
    - Grounds case 6 without mysticism: distant agents satisfy SAN if mirror-imaging preserves symmetry.  

  ---

  ### Practical Implementation
  To compute verdicts:  
  1. **Check Algorithmic Identity**:  
     - Is the opponent executing *your exact decision code*? (If no → defect).  
  2. **Check Payoff-Information Symmetry**:  
     - Are your payoffs identical *and* is the game structure symmetric? (If no → defect).  
  3. **Infer Action**:  
     - If 1+2 pass, cooperate (your choice *necessitates* theirs).  

  This yields determinate verdicts without credences. For case 6, "mirror-image situation" satisfies symmetry (your R=3 > P=1, their R=3 > P=1), so SAN commands cooperation. Ambivalence arises from misdiagnosing symmetry, not mysticism.  

  **Recommendation**: Abandon probabilistic correlations (cases 2,4) and embrace SAN as your core principle. It saves 4/6 verdicts, explains payoff sensitivity (5), resolves acausal cooperation (6), and aligns with one-boxing—while punishing ungrounded optimism about strangers.
