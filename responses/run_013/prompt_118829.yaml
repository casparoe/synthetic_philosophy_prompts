prompt: |-
  A colleague in my decision-theory reading group has spent the term defending an account of idealized preferences. The view, roughly, is that what an agent truly values is what she would value if she were fully informed, free of bias and error, and more the person she would want to be; her actual preferences count as hers only insofar as they survive that idealization. Today she produced the following argument, which she calls the idealization dilemma, and I cannot tell whether it is a reductio of the view or a trick.

  (1) What an agent truly values is what she would value under idealization — fully informed, unbiased, coherent, and more the person she would want to be. Call those her ideal values.

  (2) Where an agent's actual values diverge from her ideal values, the ideal values are authoritative; that is simply what it means to call them what she truly values.

  (3) Idealization is a procedure of correction: it takes the agent's actual values as its input and removes the errors among them, including the incoherences.

  (4) Any such procedure requires a standard of correction — a way of telling which of the agent's values are errors to be removed and which are to be preserved.

  (5) That standard must come either from outside the agent's actual values, or from nowhere.

  (6) If it comes from outside, the output is not the agent's own values but the idealizer's, and (1) is false.

  (7) If it comes from nowhere, nothing is corrected; the ideal values are the actual values relabeled, and (2) does no work.

  (8) So either ideal values are not the agent's own, or the idealization thesis is empty.

  (9) A thesis that is either false or empty whenever it is asked to override an agent's actual values can never legitimately override them.

  (10) Yet overriding actual values is the whole point: it is what lets us say that the addict does not really want the drug, or that the patient refusing treatment is mistaken about her own good. An account of idealized preferences that cannot do this has abandoned its job.

  She concludes that idealization either imposes a foreign standard or says nothing at all, and that in neither case does it tell an agent what she truly values.

  I would rather keep (1) and (2) than accept that; I need idealization to be doing real work. So tell me where the argument goes wrong. Name the step you would reject, explain why it looked persuasive, and price what rejecting it costs — in particular, whether rejecting it saves the idealization thesis or quietly turns it into something else. Tell me how confident you are in your diagnosis, and single out the one move in your own reasoning you are least sure of.
reasoning: |-
  Hmm, my colleague has presented this "idealization dilemma" argument that challenges the idea of idealized preferences. The argument claims that idealization either imposes an external standard (making it not truly the agent's own values) or does nothing at all (just relabeling existing values). But I need to defend the view that idealization reveals what an agent truly values.

  Looking at the steps, I think the problem starts at premise (3). It says idealization takes actual values as input and removes errors. This makes it sound like a mechanical filtering process. But idealization isn't just subtraction - it's more transformative. When an agent gains full information and eliminates biases, their values might fundamentally change in ways that can't be predicted from their current flawed state.

  Premise (4) makes sense - you do need a standard for correction. But premise (5) presents a false dilemma by saying the standard must either come from outside or nowhere. There's a third option: the standard comes from within the agent's own rational structure, revealed through idealization. When we imagine the agent free from error, we're accessing what they would endorse with their full cognitive capacities.

  I think rejecting (3) and (5) saves the core of the idealization thesis. It does mean acknowledging that idealization is substantive reconstruction, not mere correction. This might make ideal values less predictable from actual preferences, but that's acceptable - we're trying to discover what's truly valued, not just sanitize existing preferences.

  The step I'm least sure about is rejecting (5). What exactly does "internal but not actual" mean? How do we access this rational structure without smuggling in external standards? I need to think more about how we model counterfactual reasoning without bias.

  The key is that the "person she would want to be" part in (1) provides directionality - it's not arbitrary, but grounded in the agent's own aspirational nature. This makes idealization both internal and transformative.
answer: |-
  ### Diagnosing the Idealization Dilemma

  The argument is clever but flawed. I reject **premise (3)** as the critical error. Here's a step-by-step breakdown:

  #### **Step I Reject: Premise (3)**  
  *"Idealization is a procedure of correction: it takes the agent's actual values as its input and removes the errors among them, including the incoherences."*  

  **Why it looks persuasive**:  
  It frames idealization as a mechanical "filtering" process—like editing a draft by deleting mistakes—which makes the need for an external "standard of correction" (premise 4) seem inevitable. If idealization merely subtracts "errors," the argument correctly points out that we need a criterion to distinguish errors from core values. This sets up the false dilemma in premise (5): the standard must come from "nowhere" (absurd) or "outside" (foreign).  

  **Why it’s wrong**:  
  Premise (3) mischaracterizes idealization. The process isn't *only* corrective subtraction; it’s **transformative reconstruction**. Idealization involves:  
  - **Adding new capacities**: Full information, coherence, and freedom from bias allow the agent to *generate* values she *couldn’t* access in her non-ideal state (e.g., the addict might discover a preference for health they couldn’t conceive while impaired).  
  - **Dynamic self-constitution**: The "person she would want to be" (from premise 1) isn’t a static template but an emergent ideal self, shaped by the agent’s latent rational structure. Inputs aren’t just "actual values" but the agent’s *entire psychology*—memories, desires, capacities—refined holistically.  
  - **Procedural not substantive**: The standard isn’t imposed externally; it’s the agent’s own rationality unfolding under improved conditions. For example, coherence requirements (e.g., transitivity in preferences) aren’t "foreign" but internal to practical reasoning.  

  **Cost of rejecting premise (3)**:  
  - **Saves the idealization thesis?** Yes, but with a caveat: Idealization becomes less like "error removal" and more like **self-discovery under epistemic and rational enhancement**. It still overrides actual values (e.g., the addict’s craving) by appealing to what the agent *would* endorse with full rational agency.  
  - **Turns it into something else?** Only superficially. It shifts from a "correction" model to a **constructive model**, but retains core commitments: (1) and (2) hold because ideal values are *authentically* the agent’s, not borrowed or empty. The agent’s "true self" is revealed through cognitive-affective refinement, not invented.  

  ---

  #### **Confidence in Diagnosis**:  
  - **90% confident**: Premise (3) is the linchpin. The rest of the argument (premises 4–10) depends on its narrow view of idealization. Once rejected, the "external vs. nowhere" dilemma collapses.  
  - **Key support**: Philosophers like T.M. Scanlon or David Gauthier defend similar "procedural" idealization (e.g., Scanlon’s "reasonable rejection" or Gauthier’s "constrained maximization"). Both avoid external standards by grounding correction in the agent’s own rationality extended ideally.  

  #### **Weakest Move in My Reasoning**:  
  The **least sure point** is how to firmly distinguish "internal rational standards" from "external imposition." I claim coherence (e.g., logical consistency) is internal to agency, but critics (e.g., Bernard Williams) argue that *any* rationality requirement might smuggle in universalist norms alien to the agent’s idiosyncrasies. For example:  
  - If the "idealized addict" values health over drugs, is this because *all* rational agents would, or because *she* (as an individual) would?  
  - **My defense**: The "person she would want to be" (premise 1) anchors the standard in her *identity*—e.g., her deeper commitment to being a good parent. But this risks circularity if her "wanting" is itself non-ideal. Still, it’s superior to the dilemma’s alternatives.  

  ---

  ### Resolution: Why Idealization Still Works  
  Rejecting (3) rescues the view:  
  - **Against premise (6)**: The standard isn’t "outside" because it emerges from the agent’s own cognitive-affective structure under idealization (e.g., unbiased reflection on her life projects).  
  - **Against premise (7)**: It’s not "relabeling" because idealization *changes* values (e.g., the fearful patient, fully informed, might newly value treatment).  
  - **Saves the job (premise 10)**: It overrides actual values (addict’s urge) by showing they conflict with the agent’s ideal self-conception.  

  **Final cost**: Idealization becomes more demanding—it requires modeling counterfactual agency, not just auditing preferences. But this is a feature, not a bug: it reflects how real self-discovery works. The addict *truly values* sobriety because her ideal self, free from addiction’s distortions, would affirm it as her own.  

  ---  
  **Recommendation**: Cite Christine Korsgaard’s *The Sources of Normativity* for a robust defense of idealization as internal self-constitution. Her "practical identity" framework directly counters this dilemma.
