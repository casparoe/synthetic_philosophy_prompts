answer: |-
  Here is a structured specification of desiderata for a normative theory of rational choice under risk, organized as requested. Each requirement is paired with its motivating case/argument, designated as non-negotiable or camp-specific, and assessed for conflicts and feasibility.

  ---

  ### **I. Choice Patterns & Cases the Theory Must Get Right**  
  *(Empirical and conceptual adequacy)*  

  1. **Allais Paradox Patterns**  
     *Motivation*: Reveals tension between independence axioms (e.g., Sure-Thing Principle) and robust intuitions about certainty and regret. Agents prefer sure gains over probable larger gains but reverse when certainty is removed.  
     *Status*: **Camp preference** (Reveals limits of Expected Utility Theory (EUT), but not fatal; models may reject/modify independence).  

  2. **Stochastic Dominance**  
     *Motivation*: If prospect A yields equal or better outcomes than B in every state, A must be preferred. Violations imply irrationality (e.g., preferring strictly dominated options).  
     *Status*: **Non-negotiable** (Core to coherent risk assessment).  

  3. **Insurance-Lottery Coexistence**  
     *Motivation*: Real agents simultaneously insure against losses (risk-averse) and play lotteries (risk-seeking). A theory must accommodate this without ad hoc assumptions.  
     *Status*: **Non-negotiable** (Adequacy test for descriptive breadth; normative if "rational" includes context-dependence).  

  ---

  ### **II. Distinctions the Theory Must Not Collapse**  
  *(Conceptual granularity)*  

  4. **Risk Aversion vs. Diminishing Marginal Utility (DMU)**  
     *Motivation*: EUT conflates aversion to risk (mean-preserving spreads) with DMU of wealth. A normative theory should allow pure risk aversion (e.g., rejecting fair bets despite linear utility).  
     *Status*: **Camp preference** (EUT rejects this distinction; alternatives like Rank-Dependent Utility (RDU) embrace it).  

  5. **Small-Stakes vs. Large-Stakes Risk Aversion**  
     *Motivation*: Rabin’s calibration argument: Under EUT, modest small-stakes risk aversion forces absurd large-stakes risk aversion (e.g., rejecting 50-50 bets at any stake). A theory should avoid this "inflation".  
     *Status*: **Non-negotiable** (Exposes EUT’s pathological implications; any viable alternative must resolve this).  

  6. **Ambiguity vs. Risk**  
     *Motivation*: Ambiguity (unknown probabilities) elicits distinct behavior vs. risk (known probabilities). A theory must either extend to ambiguity or justify excluding it normatively.  
     *Status*: **Camp preference** (EUT excludes ambiguity; models like Maxmin EU (Gilboa-Schmeidler) treat it as normatively relevant).  

  7. **Aversion to Mean-Preserving Spreads vs. Preference for Sure Things**  
     *Motivation*: Distinguish (a) disliking increased variance in a held prospect from (b) preferring certainty over a gamble with equal EV. Rational agents may accept (b) while rejecting (a) if variance aversion is separable.  
     *Status*: **Camp preference** (EUT conflates; RDU separates. Normatively, risk aversion *should* refer to spread aversion).  

  ---

  ### **III. Formal Constraints on Preference Relations**  
  *(Structural rationality)*  

  8. **Dynamic Consistency**  
     *Motivation*: Preferences over time should not reverse without new information. A theory should permit precommitment (e.g., tying hands) if dynamically consistent plans demand it.  
     *Status*: **Non-negotiable** (Violations imply exploitable irrationality).  

  9. **Reduction of Compound Lotteries (ROCL)**  
     *Motivation*: Must agents be indifferent between a compound lottery and its actuarially equivalent simple form? Violations suggest sensitivity to risk staging (e.g., preference for "early resolution").  
     *Status*: **Camp preference** (EUT enforces ROCL; recursive models like Kreps-Porteus reject it).  

  ---

  ### **IV. Arguments/Results the Theory Must Not Contradict**  
  *(Theoretical coherence)*  

  10. **St. Petersburg Paradox**  
      *Motivation*: With unbounded utility, EUT recommends paying arbitrarily high entry fees for infinite EV gambles. A theory must bound utility or redefine valuation to avoid absurdity.  
      *Status*: **Non-negotiable** (Requires sensitivity to extreme payoffs).  

  ---

  ### **Conflicts, Trade-offs, and Non-Negotiables**  
  - **Key Conflict**: *Stochastic dominance* + *Small-stakes calibration* jointly challenge EUT. Retaining both requires abandoning EUT’s linearity in probabilities (e.g., via probability weighting).  
  - **Most Constraining Requirement**: *Small-stakes calibration* (Rabin, 2000). Alone, it rules out EUT and any model implying global risk aversion.  
  - **Camp Preferences**: STP (from Allais), ROCL, and ambiguity exclusion reflect EUT-aligned "camp" commitments. Alternatives reject these.  

  ---

  ### **Scorecard for Major Models**  
  *(Briefly, per request)*  

  | **Requirement**               | **Classical EUT** | **Risk-Weighted EU (RDU)** | **Top Contender** |  
  |-------------------------------|-------------------|----------------------------|-------------------|  
  | Allais Patterns               | ✗ Fails           | ✓ Explains via prob. weighting | Prospect Theory (PT) |  
  | Stochastic Dominance          | ✓ Holds           | ✓ Holds (if weights monotonic) | All               |  
  | Insurance-Lottery Coexistence | ✗ Fails (single curvature) | ✓ Explains via loss aversion | PT                |  
  | Risk Aversion ≠ DMU           | ✗ Conflates       | ✓ Separates                 | RDU/PT            |  
  | Small-Stakes Calibration      | ✗ Fails (Rabin)   | ✓ Avoids inflation         | RDU/PT            |  
  | Dynamic Consistency           | ✓ Holds           | △ Holds with restrictions  | EUT               |  
  | St. Petersburg                | △ Requires bounded utility | ✓ Handled naturally      | RDU/PT            |  
  | Mean-Preserving Spread Aversion | ✗ Conflated with DMU | ✓ Isolates as spread aversion | RDU               |  

  - **EUT**: Fails Allais, calibration, insurance/lottery coexistence, and conflates risk aversion with DMU. Strong on dynamic consistency and dominance.  
  - **RDU/Prospect Theory**: Explains Allais, calibration, insurance/lottery, and spreads. May relax ROCL or dynamic consistency (if probability weights time-dependent).  
  - **Top Contender**: **Rank-Dependent Utility** (or Cumulative Prospect Theory) best satisfies *non-negotiables*: stochastic dominance, calibration, spread aversion distinction, and St. Petersburg resolution. Ambiguity requires extensions (e.g., α-Maxmin).  

  ---

  ### **Conclusion**  
  A viable normative theory must satisfy **non-negotiables**: stochastic dominance, dynamic consistency, small-stakes calibration, and bounded St. Petersburg payoffs. It should ideally distinguish risk attitudes from DMU and spread aversion, while accommodating insurance/lottery coexistence. EUT fails key tests; RDU-class models (e.g., Quiggin’s RDU, Tversky-Kahneman’s CPT) better reconcile these demands, though dynamic consistency under ambiguity remains challenging. Camp preferences (ROCL, STP) define research programs but are not universal requirements.
