prompt: |-
  So I just started a new job at the city planning office (long-range land use stuff, nothing philosophical) and one of the senior planners is one of those guys who reads alot of intellectual history on the side. He gave me a xeroxed essay from some old journal, and I've lost it, but his argument was that the philosophy sitting behind technocratic planning is logical empiricism, and that Carnap is the key figure. I'd like to push back but I know basically nothing about Carnap's politics, so I want to seperate what's real from what he's made up. Here's his summary as best I remember it:

  "Carnap and the Vienna Circle were the philosophers of the planned society. Carnap's whole project was to make language precise so that social planning could become a science; he thought that once our concepts were cleaned up, disagreements about how to organize society would turn into purely technical questions. This is the real meaning of the principle of tolerance in the Logical Syntax of Language -- tolerance toward other people's frameworks and other people's ways of living is the political core of his philosophy. And because he held that only science has meaning, he treated ethical and political claims as either meaningless pseudo-problems, like the metaphysics he wanted to eliminate, or mere expressions of attitude. Personally he stayed above politics; it was Neurath who was the socialist, and the Circle's political neutrality is exactly why they had no answer when the Nazis came. The upshot is that planners today who claim to be doing value-neutral technical work are Carnap's heirs whether they know it or not."

  How much of that would a Carnap scholar actually sign off on? Go through it sentence by sentence and tell me what's accurate, what's a standard oversimplification that a specialist would wince at but let pass, and what's just wrong. I'm most unsure about the tolerance point -- whether that's really what the principle is about -- and about whether he thought value questions were meaningless or something else that's easy to confuse with meaningless. Then tell me whether his last sentence still follows even if the earlier sentences are mostly right. And if he's wrong that Carnap was apolitical, give me a rough sense of what Carnap actually did politically, without sending me off to read a biography.
