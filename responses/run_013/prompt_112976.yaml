prompt: |-
  A friend of mine who reads a great deal of popular complexity writing has settled on an analogy for historical contingency: history, he says, is not like the weather but like a sandpile. Grains are dropped one at a time; most land harmlessly, but sooner or later one grain triggers an avalanche that reshapes the whole slope, and the next large avalanche may be set off by a trivial grain or a substantial one indifferently, because the pile has driven itself into a critical state in which avalanches of every size are possible. From this he draws three conclusions: that the for-want-of-a-nail saying is literally true but misleading, since the nail is not a special kind of cause, only the grain that happened to fall at the critical moment; that singling out one decision or accident as the cause of a large historical outcome is therefore arbitrary; and that structural and accidental explanations of the same event are not rivals but two descriptions of a single process. He also insists that the sandpile differs in kind from the butterfly-effect weather analogy, and that this difference is what makes his case.

  Please audit the analogy. Say what corresponds to what, where the mapping holds and where it breaks, which features of the sandpile he is quietly importing into history that history does not have, which disanalogies are fatal to his conclusions and which are irrelevant to them, whether he is right that the sandpile differs in kind from the weather analogy in a way that matters here, and what analogy would serve him better if the sandpile does not.

  Return a JSON object with exactly these fields:

  - "mapping": array of objects, each with "sandpile_feature" (string), "historical_counterpart" (string), and "assessment" (one of "holds", "partly holds", "breaks").
  - "decisive_disanalogies": array of objects, each with "disanalogy" (string) and "why_it_matters" (string, naming which of his three conclusions it damages).
  - "harmless_disanalogies": array of objects, each with "disanalogy" (string) and "why_it_does_not_matter" (string).
  - "smuggled_assumptions": array of strings, each stating an assumption the sandpile picture carries into history without warrant.
  - "weather_versus_sandpile": object with "difference_in_kind_is_real" (boolean) and "consequence_for_his_argument" (string).
  - "conclusions": array of three objects, one per conclusion above, each with "claim" (string, restated in your own words), "verdict" (one of "survives", "survives_weakened", "fails"), and "reason" (string).
  - "better_analogy": object with "analogy" (string) and "what_it_gets_right" (string).
reasoning: |-
  We are given a friend's analogy: history is like a sandpile in a critical state, where grains (events) are added one by one, and any grain might trigger an avalanche (major historical event) arbitrarily. The friend draws three conclusions and insists that the sandpile differs in kind from the butterfly-effect weather analogy.

  We are to audit the analogy and return a JSON object with specific fields.

  Let's break down the task:

  1. **Mapping**: We need to list the features of the sandpile and map them to historical counterparts, then assess if the mapping holds, partly holds, or breaks.

     Proposed mappings:
     - Sandpile feature: "Grains dropped one at a time" -> Historical counterpart: "Events happening one after another"
       - Assessment: Partly holds (history has simultaneous events and complex interactions, but we can think of events as sequential for simplicity)
     - Sandpile feature: "Grains land harmlessly most of the time" -> Historical counterpart: "Most events have little immediate impact"
       - Assessment: Holds (many historical events are minor and don't cause big changes)
     - Sandpile feature: "One grain triggers an avalanche" -> Historical counterpart: "One event triggers a major historical change (e.g., war, revolution)"
       - Assessment: Partly holds (it can happen, but often major changes are the result of multiple factors and not one event)
     - Sandpile feature: "The pile is in a critical state (avalanches of every size are possible)" -> Historical counterpart: "Society is in a state where any event might cause a chain reaction of any size"
       - Assessment: Breaks (history doesn't necessarily reach a self-organized critical state; societies can be stable for long periods without being on the brink of collapse from any small event)
     - Sandpile feature: "The next large avalanche may be set off by a trivial grain or a substantial one indifferently" -> Historical counterpart: "A major historical outcome might be triggered by a minor or major event arbitrarily"
       - Assessment: Breaks (in history, the magnitude of the trigger often correlates with the outcome, and we can often trace back to structural causes; it's not arbitrary)

  2. **Decisive Disanalogies**: Disanalogies that damage his conclusions.

     - Disanalogy: "Sandpile critical state is a well-defined physical state with precise mathematical properties (self-organized criticality) that we cannot assume for history."
       - Why it matters: Damages all three conclusions because the entire analogy relies on the critical state. Without it, we cannot say that any grain (event) is equally likely to cause an avalanche (major change). Thus, the arbitrary selection of a cause and the non-rivalry of structural and accidental explanations become questionable.

     - Disanalogy: "In history, there are human agents with intentions, learning, and adaptation, whereas the sandpile is a passive physical system."
       - Why it matters: Damages the second and third conclusions. Human agents can anticipate and prevent avalanches (crises) or intentionally cause them, and they reflect on past events. This means that singling out a cause may not be arbitrary (because we can look at intentions and decisions) and structural factors (like institutions) may have a more persistent role than the sandpile model suggests.

  3. **Harmless Disanalogies**: Disanalogies that do not affect the conclusions.

     - Disanalogy: "The sandpile is two-dimensional, while history is multi-dimensional and complex."
       - Why it doesn't matter: The core idea of critical state and triggering events can be abstracted without needing the same dimensionality.

     - Disanalogy: "The sandpile is made of identical grains, while historical events are unique."
       - Why it doesn't matter: The point is about the potential of any event to trigger a large change, not the events being identical.

  4. **Smuggled Assumptions**: Assumptions the sandpile picture carries without warrant.

     - "History naturally evolves into a critical state (where any event can cause a catastrophe)."
     - "The triggering event has no inherent properties that make it more or less likely to cause a large change; it's just about timing and position (i.e., critical state)."
     - "Avalanches (major changes) are purely the result of the pile's internal structure and the last grain, with no external factors."

  5. **Weather versus Sandpile**: 

     - Difference in kind is real: True. The butterfly effect (weather) is about sensitivity to initial conditions in chaotic systems, whereas the sandpile is about self-organized criticality (SOC) where the system evolves to a critical point and then exhibits scale-invariant avalanches. 
     - Consequence for his argument: The sandpile model (SOC) suggests that large events are inevitable and can be triggered by any small event in the critical state, which is different from chaos (butterfly effect) where a small change leads to a large effect because of the system's inherent nonlinearity and sensitivity. This difference matters because SOC provides a model for how small events can cause large changes without the need for the system to be chaotic (and without the long-term unpredictability of chaos). However, the applicability of SOC to history is questionable.

  6. **Conclusions**: We have three conclusions.

     - Claim 1: The "for-want-of-a-nail" saying is literally true but misleading because the nail is not a special cause but just the grain that fell at the critical moment.
       - Verdict: Fails
       - Reason: In history, the nail (a specific event) might be part of a chain of causation that is not arbitrary but depends on structural factors. The sandpile model assumes that the critical state makes any grain a potential trigger, but in history, the events are embedded in a context of human agency and structural conditions that make some events more likely to be triggers than others.

     - Claim 2: Singling out one decision or accident as the cause of a large historical outcome is arbitrary.
       - Verdict: Survives weakened
       - Reason: While it is true that major outcomes often have multiple causes and that the trigger might be one of many, it is not entirely arbitrary because historians can often identify key factors (structural or contingent) that made the outcome more likely. The sandpile model overstates the arbitrariness.

     - Claim 3: Structural and accidental explanations of the same event are not rivals but two descriptions of a single process.
       - Verdict: Survives
       - Reason: This is a common view in historiography: the same event can be explained by long-term structural factors and by contingent events. They are complementary. However, the sandpile model does not necessarily provide the best foundation for this because it downplays the role of structure in shaping the critical state.

  7. **Better Analogy**:

     - Analogy: "History is like a forest fire ecosystem."
     - What it gets right: 
          - Fires (major events) can be triggered by small sparks (contingent events) but only if the conditions (dry underbrush, hot weather) are right (structural factors).
          - The ecosystem may be in a state where a fire is likely, but the exact trigger and timing are contingent.
          - It also allows for human management (like firebreaks) which is analogous to human institutions and decisions that can change the structural conditions.

  Now, we structure the JSON accordingly.
