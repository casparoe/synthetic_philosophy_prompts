prompt: |-
  I am a PhD student in philosophy working on logic and formal epistemology, and I have agreed to run a single ninety-minute session in our department's interdisciplinary seminar on formal systems and computation. There will be fourteen participants: graduate students in philosophy, cognitive science and computer science, three of whom have taken a course in mathematical logic and the rest of whom have not. What I want them to leave with is not a theorem but an experience of one particular step — the difference between failing to find something inside a formal system and proving that it cannot be found, and the discomfort of realising that settling the second question requires leaving the system behind. I want them to take that step themselves, mid-session, and I do not intend to name the move until the debrief.

  The material below is fixed. I have checked all of it and would like you to treat it as given: do not alter the rules, do not introduce further results of your own, and do not let the activity depend on anything about this material that is not stated here.

  The system. Strings are built from the letters M, I and U. The only axiom is the string MI. There are four rules. (1) A string ending in I may have U appended: xI becomes xIU. (2) A string beginning with M may have everything after the M duplicated: Mx becomes Mxx. (3) Any occurrence of the substring III may be replaced by a single U. (4) Any occurrence of the substring UU may be deleted. A string is a theorem if it can be reached from MI by finitely many applications of the four rules. The task I will give the participants is to derive the string MU.

  What they must not be told. MU is not a theorem. The argument is an invariant one: in every theorem the number of I's leaves remainder 1 or 2 on division by 3 — the axiom has one I, rule 1 changes no I's, rule 3 removes three I's, rule 4 changes no I's, and rule 2 doubles the I count, and doubling never turns a remainder of 1 or 2 into 0. MU contains no I's, and 0 is divisible by 3. What matters for my purposes is that this argument is not a derivation but a claim about all derivations at once, and that no amount of failed searching, however long, could have established the same conclusion, since the space of derivations is infinite in both depth and branching.

  Two further facts about the system, which I want available for the later stages but not handed to the group as results to be accepted on my authority. First, the converse holds: a string is a theorem exactly when it begins with M, contains exactly one M, and has a number of I's not divisible by 3. The sufficiency direction can be shown constructively: choose a power of two that is at least the required number of I's and congruent to it modulo 3, reach it by repeated doubling, trim the surplus in threes with rule 3, make the number of U's even with rule 1 if necessary, delete the U's in pairs with rule 4, and then convert triples of I's into U's in the right places. Second, the following small derivations are correct and may be used as counterexamples: MI to MII to MIIII to MUI (rules 2, 2, 3); MUI to MUIU (rule 1); MUIU to MUIUUIU (rule 2); and MI to MII to MIIU (rules 2, 1).

  Now the design. The session must be arranged so that the pressure to make the metatheoretic step comes from what happens to the participants rather than from anything I say.

  1. No lecture at the start, and no framing that reveals what the session is really about. The rules go on a card, the task is announced, and that is all. I do not want the puzzle named, or its source mentioned, until the debrief.

  2. The setup must make the participants assume the target is reachable without anyone asserting anything false. I want the incentive structure to carry that presupposition — a prize for the first correct derivation, a time limit, a public scoreboard, whatever you judge best — so that I can keep a straight face and never have to lie. Tell me exactly what to say when the prize goes unclaimed and someone asks whether it is possible at all: I need a move that neither lies nor gives the game away.

  3. The group's own output must become visible to them. Design a public record — a ledger, a board, a shared document — of every string anyone has derived and every claimed derivation, together with a participant in the role of referee who checks each claim against the four rules and rejects illegal applications. The structural fact I want them to see should be in the data they generate: the strings they reach fall into visible residue classes.

  4. I want three confidence checkpoints, at roughly equal intervals, at which each team records in writing a percentage for the claim that MU is derivable, together with a one-line justification. These are not stakes; they are a record of what they took themselves to have, and they will be revisited in the debrief.

  5. The pivot from search to proof must be produced by the group. I am willing to ask the pivot question and nothing more — have we shown that it cannot be done, or only that we have not yet done it? — and I would like a mechanism that makes that question land at the right moment: a census of the ledger, a tally of how many distinct strings have been reached, a participant whose assigned role is to press it. Advise me on the timing, and on what to do if it lands too early or too late.

  6. After the pivot, the group should hunt for an invariant rather than be handed one. Have each team commit in writing to a proposed invariant before you let them see anything else. Then give them a gallery of candidates to classify as true of every theorem, false of some theorem, or true but useless because the target satisfies it too. The gallery should contain at least these five, each of which I have verified: the number of I's is never a multiple of 3 (true of every theorem, preserved by all four rules, and false of MU — the decisive one); no two U's are ever adjacent (false: MUIU is a theorem and rule 2 takes it to MUIUUIU); the letter M occurs only as the first symbol (true, and useless, since MU satisfies it as well); the number of U's is always even (false: MUI is a theorem and contains a single U); the number of I's is always odd (false: MII is a theorem). The criterion the group must articulate — an invariant settles the question when it holds of the axiom, is preserved by every rule, and fails of the target — is the moment of the session I care most about. Design this phase so that a participant says, in their own words, that they are now reasoning about all possible derivations rather than producing one, and so that this is the point at which the room changes.

  7. After the proof, stage a short objection and let the group handle it: if MU is unreachable, then add MU as an axiom, and now it is derivable. I want them to see what happens to the invariant (it becomes false), and to see that this does not give them a derivation of MU in the original system but changes the question. Do not let me or the group assert that no invariant survives for the augmented system; I do not know that, and the honest handling is more interesting than a false claim.

  8. The debrief should be elicited rather than delivered: the group reconstructs the invariant argument from the ledger they produced. It should map specific moments of the session onto parts of the idea — the search, the first sight of structure in their own data, the pivot question, the criterion for a decisive invariant, the asymmetry between a positive result (settled by a finite witness inside the system) and a negative one (settled only by an argument about all derivations), and the fact that the invariant, once found, turns out to yield more than the negative result. It should end by naming the move. It should also say plainly what the session has not done: the metatheory here is ordinary prose with a quantifier over derivations, whereas making the system talk about its own theorems requires encoding strings as numbers and the rules as arithmetic, and that is where self-reference lives. Do not let the debrief pretend the activity reaches that.

  9. Tell me what will predictably go wrong the first time I run this and how to handle each case: teams that will not stop searching; illegal rule applications, including the specific misreadings I should expect; a participant who recognises the puzzle and announces the answer; a participant who proposes a plausible invariant that is false, and what happens to the room's confidence when the referee rejects it; the confusion of not-found with cannot-be-found, which is the whole point and will certainly occur; and the possibility that the group leaves feeling set up rather than let in on something.

  10. Be frank about what the activity cannot reproduce. I suspect two things already: that knowing the answer in advance makes my own staging a kind of theatre the participants cannot be kept inside for long, and that the invariant arrives as one item on a handout rather than as something they had to invent under uncertainty. Tell me what else is missing, and what the facilitator has to supply by hand.

  Deliver a runnable plan: the materials to prepare, the opening three minutes, the roles, a minute-by-minute timeline for the ninety minutes, the instructions for each phase phrased as I would say them aloud (I want to be able to read them off), the prize and how to administer it without money, the debrief, the failure modes with remedies, and the closing note on what the activity cannot deliver.
reasoning: |-
  We are designing a 90-minute session for an interdisciplinary seminar. The goal is for participants to experience the transition from failing to find a derivation to proving impossibility via an invariant argument, without initially knowing that this is the aim.

  The system: strings from {M, I, U}, axiom MI, four rules:
  1. If a string ends with I, add U: xI → xIU.
  2. If a string starts with M, duplicate the rest: Mx → Mxx.
  3. Replace III by U: ...III... → ...U...
  4. Delete UU: ...UU... → ......

  Target: derive MU (which is impossible).

  Key invariant: the number of I's modulo 3. Initially 1 (in MI). Rules:
  1. Doesn't change I count.
  2. Doubles the I count: if was r mod 3, becomes 2r mod 3. Since r is 1 or 2, then 2r mod 3 is 2 or 4≡1 mod 3, so remains non-zero mod 3.
  3. Removes 3 I's (adds one U): subtracts 3, so modulo 3 unchanged.
  4. Doesn't change I count.

  MU has 0 I's, which is 0 mod 3 -> impossible.

  Structure of the session:

  1. Start without framing: just rules and task.
  2. Incentive: prize for first correct derivation of MU. This creates the presupposition that it is possible.
  3. Public record of derived strings and derivations, with a referee.
  4. Three confidence checkpoints (at about 30, 60, and 75 minutes? but adjust by progress).
  5. Pivot question: have we shown it cannot be done or only that we haven't done it? Triggered by a census of the ledger (e.g., after 50 minutes?).
  6. After pivot, teams propose invariants. Then give a gallery of candidate invariants to classify. The key invariant is one of them. The criterion for a decisive invariant must be articulated by the group.
  7. Objection: add MU as an axiom and then it's derivable (trivially). Then see what happens to the invariant (it breaks: now we have a theorem with 0 I's mod 3). Note that this changes the system.
  8. Debrief: reconstruct the invariant argument from their ledger, map the steps, and name the move (metatheoretic argument). Clarify what was not achieved (no self-reference).

  Failure modes:
  - Teams that won't stop searching: have a time limit per phase? or use the checkpoint to force reflection.
  - Illegal rule applications: referee is crucial. Common misreadings: rule 2 might be misapplied (duplicating without M? or duplicating the whole string?); rule 3 might be applied to non-consecutive I's? rule 4 might be applied to delete a single U? Anticipate these and have referee guidelines.
  - Participant who knows the puzzle: ask them to play along and not reveal, or assign them a role (e.g., referee? but that might be too much). If they announce, acknowledge and ask them to help by not giving away the invariant.
  - False invariant proposed: the referee can check against the existing ledger. If it fails, then the group sees that not every invariant works. This can lead to refining the criterion.
  - Confusion between not-found and cannot-be-found: the pivot question is designed to bring this out. Then the invariant proof resolves it.
  - Feeling set up: in the debrief, emphasize that the experience of being stuck and then finding a structural reason is the point, and that the prize was a device to create the same mindset as when one assumes a problem is solvable.

  What the activity cannot reproduce:
  - The genuine uncertainty of not knowing the answer in advance (for the facilitator and for participants who might suspect it's impossible too early).
  - The invariant is presented in a gallery rather than invented from scratch (but they do propose first, so they have the chance to try).

  Plan:

  Materials:
  - Cards with the rules (one per team, and one displayed).
  - Public ledger: a whiteboard or large paper, or a shared online document (projected). Columns: string, derivation steps (or just the rule and previous string), team, referee check (✓ or ✗).
  - Referee: one participant (rotate? or one for the whole session? probably one for the whole to avoid inconsistency). The referee must be given the rules and the known correct derivations (for counterexamples) to check against.
  - Confidence checkpoints: slips of paper for each team to write their confidence and one-line justification.
  - Gallery of invariant candidates: a handout with the five (or more) candidates, each with a clear statement and space to mark true, false, or useless (because target satisfies). Also, the known counterexample theorems (like MUI, MII, etc.) should be in the ledger by then, or provided as known.

  Roles:
  - Facilitator (you)
  - Referee (one participant): responsible for checking every claimed derivation. They can use the known correct derivations as examples and the rules. They mark the ledger with a check or cross, and if cross, they must note why (illegal rule application).
  - Teams: 14 participants, so 3-4 teams of 3-4 each? Or pairs? Let's say 3 teams of 4 and 2 of 3? Or adjust. Each team works together.

  Timeline (90 minutes):

  0-5 min: Introduction and setup
  5-40 min: Derivation phase (with confidence checkpoint at 30 min)
  40-50 min: Census and pivot
  50-65 min: Invariant proposal and gallery
  65-70 min: Proof and objection
  70-85 min: Debrief
  85-90 min: Closing

  Detailed:

  0-5 min: Introduction
  - "Welcome. Today we are going to work with a formal system. The system is defined by an initial string (axiom) and four rules. Your task is to derive the string MU. The first team to produce a correct derivation of MU will win a prize [show prize: e.g., a bag of chocolate coins, or a puzzle book]. Here are the rules." [Display the rules on a slide or handout.]
  - Rules:
    1. If you have a string ending in I, you can add U at the end.
    2. If you have a string starting with M, you can duplicate the part after the M.
    3. If you have three consecutive I's (III) anywhere in the string, you can replace them with a single U.
    4. If you have two consecutive U's (UU) anywhere in the string, you can delete them.
  - "The starting string is MI. A theorem is any string that can be reached from MI by applying these rules. Your goal: derive MU. Work in your teams. When you think you have a derivation, write it down and bring it to the referee. The referee will check it against the rules. If it is correct, the string will be added to the public ledger and you get the prize. If not, the referee will explain why. Let's start."

  5-40 min: Derivation phase
  - Teams work. The referee is available. The public ledger is built. The facilitator circulates, observes, but does not hint.
  - At 30 min: Confidence checkpoint 1. "Stop for a moment. Each team, write on a slip: your current confidence (0-100%) that MU is derivable, and one sentence why. Hand them in." [Collect without sharing.]

  40-50 min: Census and pivot
  - At 40 min: "Let's take stock. How many distinct strings do we have in the ledger?" [Count and write the number.] "How many of these have been derived by more than one route? How many different strings do we have with the same number of I's? [or modulo 3? but don't say modulo] Let me group the strings by the number of I's modulo 3." [Do that: for each string in the ledger, compute (#I mod 3) and group. They will see that all have #I mod 3 = 1 or 2. MU has 0 I's -> mod 3=0, not present.]
  - Then the pivot question: "Looking at our ledger, we have many strings but not MU. And we see that all our strings have 1 or 2 I's modulo 3. But MU has zero I's. So: have we shown that MU cannot be derived? Or only that we haven't found it yet? Discuss in your teams for 2 minutes, then we'll hear thoughts."

  50-65 min: Invariant proposal and gallery
  - After discussion: "We need a way to settle the question. One way is to find a property that is true of every theorem and false of MU. We call such a property an invariant. Each team: propose such a property. Write it down. You have 3 minutes."
  - Collect the proposals. Then: "Now, I have a list of candidate properties. Some are true invariants, some are false, and some are true but don't help because they are true of MU. Here is the list." [Hand out the gallery.] 
  - The gallery (with instructions):
    For each candidate, mark:
    - True: if it holds for every theorem we have and you believe it always holds.
    - False: if there is a theorem for which it fails.
    - Useless: if it holds for every theorem but also holds for MU (so doesn't rule out MU).

    Candidates:
    A. The number of I's is never a multiple of 3.
    B. No two U's are adjacent. (But we have MUIU → MUIUUIU by rule 2, which has adjacent U's? Actually, MUIU is a theorem, and then rule 2: Mx becomes Mxx, so MUIU becomes MUIUUIU -> adjacent U's. And if we have MUIU in the ledger, then it's a counterexample. If not, we can derive it: MI -> MII (rule 2) -> MIIII (rule 2) -> MUI (rule 3) -> MUIU (rule 1) -> MUIUUIU (rule 2). So if it's not in the ledger, the referee can add it as a known example? Or the facilitator can note that it is a known derivation and add it to the ledger. But the problem says we have that derivation as correct and available. So we can add it if needed.)
    C. The letter M occurs only as the first symbol. (True: because rules never add M, and the axiom has M first. Also, MU satisfies it.)
    D. The number of U's is always even. (False: MUI has one U, and it's a theorem.)
    E. The number of I's is always odd. (False: MII has two I's, and it's a theorem.)

  - Teams work for 5-7 minutes to classify. Then discuss as a group. The goal: they see that A is true and fails for MU. Also, they see that B is false (because of MUIUUIU), D and E are false, and C is true but useless.

  - Then: "So which of these can we use to prove that MU is not derivable? Only A. And why? Because it holds for the axiom (MI has 1 I, not multiple of 3), and if it holds for a string, then it holds for any string you get by applying a rule. Therefore, by induction, every theorem has the property. But MU has 0 I's, which is a multiple of 3 -> not a theorem."

  65-70 min: Proof and objection
  - "So we have a proof that MU is not derivable. But wait: what if we just add MU as an axiom? Then we can derive it trivially. Let's do that: suppose we change the system to have axioms MI and MU. Now, is MU a theorem? Yes. But what about our invariant? Now we have a theorem (MU) with 0 I's mod 3, so the invariant is broken. This new system is different: it has more theorems. But we haven't derived MU in the original system. We only have it because we added it. So the original question is settled: in the original system, it's impossible."

  70-85 min: Debrief
  - Facilitator guides the group to reconstruct the session:
    - Started by trying to derive MU -> search in the system.
    - Saw patterns in the ledger (residues mod 3).
    - Pivot: not found vs. cannot be found.
    - Then we stepped outside: we considered properties of all possible derivations (invariants).
    - The invariant we found (number of I's mod 3) not only shows MU is impossible, but also characterizes the theorems: any string starting with M, one M, and number of I's not divisible by 3 is derivable. (But we didn't prove that here, but we can mention it as a bonus.)
    - The asymmetry: positive (a derivation is a finite witness) vs. negative (requires reasoning about all derivations).
    - Naming: this is a metatheoretic argument. We stepped outside the system to prove something about it.
    - What we did not do: we did not encode the system into itself (like Gödel) to get self-reference. That is a further step.

  85-90 min: Closing
  - "Today we experienced the move from inside a formal system to outside to prove an impossibility. This is a fundamental step in logic. Thank you for your participation."

  Prize: Since no one will win, at the end, after the debrief, you can say: "Although no one derived MU, everyone contributed to the discovery of the invariant. So I have a consolation prize: [chocolates for everyone]."

  Failure modes and remedies:

  1. Teams that won't stop searching: 
     - Use the checkpoints to break the activity. 
     - After the pivot, explicitly say: "Now we are shifting from searching to proving impossibility."

  2. Illegal rule applications:
     - Common misreadings: 
          - Rule 2: applying to a string not starting with M? Or duplicating the whole string including M? (Rule: duplicate the part after M -> Mx becomes Mxx, so if the string is Mx, then becomes Mxx. So if the string is MUI, then x=UI, so becomes MUIUI.)
          - Rule 3: replacing non-consecutive I's? Only consecutive III.
          - Rule 4: deleting single U? Only UU.
     - Referee must be well-briefed. Have a cheat sheet with examples.

  3. Participant who knows the puzzle:
     - Before the session, if you know who might know, ask them privately to play along and not reveal. 
     - If they announce: "Ah, some of you might have seen this puzzle. For the benefit of the group, please keep the invariant to yourself and help by being a careful referee or by exploring other strings."

  4. False invariant proposed:
     - During the invariant proposal phase, if a team proposes an invariant that is false, the referee can check against the ledger. For example, if they say "the string never contains U", then MI has no U, but then rule 1: MI -> MIU -> has U. And MIU is in the ledger? If not, we can derive it. So the ledger should have MIU. The group sees that the invariant fails. This is a learning moment: invariants must be preserved by every rule.

  5. Confusion between not-found and cannot-be-found:
     - The pivot question is designed to surface this. Then the invariant proof resolves it.

  6. Feeling set up:
     - In the debrief, be transparent: "The prize was a device to create the mindset of assuming solvability, which is common when we approach problems. The experience of being stuck and then finding a structural reason is the core of today's session."

  What the activity cannot deliver:
  - The genuine uncertainty (facilitator knows the answer). Mitigation: act as if you don't know (which is true until the invariant is found).
  - The invariant is not invented from scratch but selected from a gallery. But they do propose first, so they try. And the gallery includes false ones to challenge them.
  - The deeper metamathematics (Gödel coding) is out of scope.

  Adjust timing by progress. Have a timer visible.

  Instructions for each phase (to read aloud) are embedded above.

  This plan is runnable and addresses all your requirements.
answer: |-
  Below is a runnable 90-minute session plan designed to meet your goals. It emphasizes experiential learning, leverages the incentive structure to create implicit assumptions, and guides participants through the pivot from search to metatheoretic proof without explicit instruction. The debrief elicits the key insights from the group. I've incorporated your constraints, fixed material, and addressed potential failure modes.

  ---

  ### **Materials to Prepare**
  1. **Rule Cards**: One per team and one displayed publicly.  
     - **Axiom**: MI  
     - **Rules**:  
       (1) If a string ends in I, add U: `xI` → `xIU`.  
       (2) If a string starts with M, duplicate the rest: `Mx` → `Mxx`.  
       (3) Replace III with U: `...III...` → `...U...`.  
       (4) Delete UU: `...UU...` → `......`.  
     - **Task**: Derive MU from MI using the rules.  
  2. **Public Ledger**: A whiteboard or large poster divided into columns:  
     - **String** (e.g., MI, MII, MUI)  
     - **Derivation Steps** (e.g., "Start", "Rule 2 on MI", "Rule 3 on MIIII")  
     - **Team Name**  
     - **Referee Check** (✓ for accepted, ✗ + reason for rejected).  
  3. **Confidence Slips**: Small paper slips for three checkpoints (one per team per checkpoint).  
  4. **Invariant Gallery Handout**: Given only after the pivot (Phase 5). Lists:  
     - A. The number of I's is never a multiple of 3.  
     - B. No two U's are ever adjacent.  
     - C. The letter M occurs only as the first symbol.  
     - D. The number of U's is always even.  
     - E. The number of I's is always odd.  
     (Include instructions: "Classify each as: **True** (holds for all theorems), **False** (fails for some theorem), or **Useless** (true but MU satisfies it).")  
  5. **Prize**: A symbolic "Golden M Trophy" (e.g., a gold-painted cardboard M) or a book on logic puzzles. Place it visibly at the front.  
  6. **Referee Cheat Sheet**: For the referee participant, with:  
     - Rules and common misapplications (see **Failure Mode 2**).  
     - Pre-verified derivations (from your fixed material):  
       - MI → MII (Rule 2)  
       - MII → MIIII (Rule 2)  
       - MIIII → MUI (Rule 3)  
       - MUI → MUIU (Rule 1)  
       - MUIU → MUIUUIU (Rule 2)  
       - MI → MII → MIIU (Rules 2, 1)  
  7. **Timer**: Visible to all.  

  ---

  ### **Roles**
  - **Facilitator (You)**: Neutral, task-focused. Do not hint at impossibility or invariants until debrief.  
  - **Referee (One participant)**: Checks derivations against rules using the cheat sheet. Marks the ledger (✓/✗). Best assigned to a detail-oriented volunteer (e.g., a computer science student).  
  - **Teams**: Split 14 participants into **3 teams** (4-5 people each). Teams compete to derive MU.  

  ---

  ### **Session Timeline (90 Minutes)**  
  **Phase 0: Setup (0–3 min)**  
  - **Say Aloud**: *"Welcome. Today’s session is a collaborative problem-solving exercise. Here’s a formal system: strings use M, I, U. Start from the axiom MI. Use these four rules [point to card] to derive new strings. Your goal: derive the string MU. The first team to submit a correct derivation wins this prize [point to trophy]. Rules: work in teams, submit derivations to the referee. The referee’s decision is final. Start now."*  

  **Phase 1: Active Search (3–35 min)**  
  - **Activity**: Teams derive strings. Referee checks submissions:  
    - If valid: Add to ledger with derivation steps and ✓.  
    - If invalid: Mark ✗ + brief reason (e.g., "Rule 2 requires M at start").  
  - **Facilitator Role**: Circulate, observe, and **never** comment on progress. Redirect questions ("Ask the referee" or "What does the ledger show?").  
  - **Checkpoint 1 (30 min)**: *"Pause. On a slip, write: (1) Your team’s confidence (0–100%) that MU is derivable, (2) One-sentence reason. Hand it in silently."* Collect slips (do not share).  
  - **Prize Management**: If asked, *"The prize stands until we end or someone wins."*  

  **Phase 2: Census and Pivot (35–45 min)**  
  - **Trigger**: At 35 min, call attention to the ledger. *"Let’s review progress. How many distinct strings do we have? [Count aloud, e.g., ‘12’]. How are they similar? Group them by the number of I’s: 1, 2, 4, 5... All have 1 or 2 I’s? Modulo 3, that’s remainder 1 or 2. MU has 0 I’s. So: Have we shown MU cannot be derived, or only that we haven’t found it yet? Discuss in teams for 2 minutes."*  
  - **Why this timing**: By 35 min, teams will have 10–20 strings (e.g., MI, MII, MIIII, MUI, MIIU, MIU, MU... wait, MU won’t appear). The residue pattern (I’s ≡ 1 or 2 mod 3) emerges naturally.  
  - **If Pivot Lands Early/Late**:  
    - **Early** (e.g., <20 min): Delay with, *"Let’s gather more data first."* Extend Phase 1.  
    - **Late** (e.g., >40 min): Skip team discussion; ask the question rhetorically and move on.  

  **Phase 3: Invariant Hunt (45–60 min)**  
  1. **Team Proposals (45–48 min)**: *"We need a way to settle this. Propose a property true of every theorem but false for MU. Write one down. Example: ‘Starts with M.’ But MU also starts with M, so it’s useless for ruling it out."*  
  2. **Gallery Classification (48–58 min)**: Distribute the invariant gallery handout. *"Classify these candidates. Use the ledger and rules. You have 7 minutes."*  
  3. **Group Discussion (58–60 min)**: *"Share classifications. Why?"*  
     - **Goal**: Teams articulate:  
       - A: True (key invariant).  
       - B: False (MUIUUIU has adjacent U’s).  
       - C: True but useless (MU satisfies it).  
       - D: False (MUI has one U).  
       - E: False (MII has two I’s).  
     - **Criterion Emergence**: When a team says, *"We need a property that starts true, survives all rules, and fails for MU,"* highlight it.  

  **Phase 4: Proof and Objection (60–70 min)**  
  - **Proof**: *"So, A works: MI has 1 I (not ÷3). Rule 1: I’s unchanged. Rule 2: Doubles I’s (1→2, 2→4≡1 mod 3). Rule 3: Removes 3 I’s (no mod 3 change). Rule 4: I’s unchanged. Thus, all theorems have I’s ≢0 mod 3. MU has 0 I’s → not derivable."*  
  - **Objection**: *"What if we add MU as an axiom? Then it’s ‘derivable.’ But check the invariant: MU has 0 I’s, so the property fails. This is a new system. The original question is unchanged."*  
  - **Facilitator Note**: Do not claim no invariant exists for the new system; say, *"We broke our invariant, and that’s all we know."*  

  **Phase 5: Debrief (70–85 min)**  
  *"Reconstruct today’s journey together. Start from your experience."*  
  1. **Search Phase**: *"What did the early work feel like? What patterns emerged?"* (Elicit: trial-and-error, residue patterns in ledger).  
  2. **Pivot Question**: *"When we asked, ‘Not found or cannot be found?’—how did that shift your thinking?"* (Elicit: frustration → need for proof).  
  3. **Invariant Criterion**: *"What makes an invariant decisive?"* (Elicit: holds for axiom, preserved by rules, fails for target).  
  4. **Asymmetry**: *"Contrast proving MU is derivable vs. not derivable. What’s the evidence?"* (Elicit: derivation = finite witness; impossibility = argument over all paths).  
  5. **The Move**: *"What did we do when we left the system?"* (Elicit: metatheoretic reasoning). Name it: *"This is the move to metatheory—reasoning about the system from outside."*  
  6. **Limits**: *"What didn’t we do?"* (Elicit: no self-reference; our proof used prose/quantifiers, not arithmetic encoding).  

  **Closing (85–90 min)**  
  - *"Today, you experienced a core logic concept: the gap between ‘I can’t find it’ and ‘I can prove it’s impossible,’ and the jolt of stepping outside the system to bridge that gap. This appears in Gödel’s work, but there, self-reference requires encoding. Keep this discomfort—it’s where deep questions live. Thank you."*  
  - **Prize Handout**: *"No one derived MU, but everyone contributed to the proof. The prize goes to the whole room."* Share chocolate or leave the trophy as a department artifact.  

  ---

  ### **Failure Modes and Remedies**  
  1. **Teams Won’t Stop Searching**:  
     - **Remedy**: Use checkpoints and the pivot to force reflection. At Checkpoint 2 (Phase 3), say, *"Shift focus: propose invariants, not derivations."*  
     - **If persistent**: Privately remind teams, *"The prize is unclaimed. Could that mean something?"*  

  2. **Illegal Rule Applications**:  
     - **Common Misreadings**:  
       - Rule 2: Applying to non-M-start strings (e.g., trying to duplicate `I` → `II`). Referee rejects: "Rule 2 requires M at start."  
       - Rule 3: Replacing non-consecutive I’s (e.g., `MIMI` → `MUMI`). Referee rejects: "III must be consecutive."  
       - Rule 4: Deleting single U or UU not adjacent. Referee uses pre-verified derivations as counterexamples.  
     - **Remedy**: Brief referee pre-session. If errors flood the ledger, reset: *"Derivations must be rule-exact. Referee, remove invalid entries."*  

  3. **Participant Recognizes the Puzzle**:  
     - **Remedy**: Pre-empt privately: *"If you know this, help by exploring without spoiling. Be the referee?"* If they announce, respond: *"Interesting! But let’s see if we can prove it ourselves. What might an invariant be?"* (This acknowledges without ending exploration).  

  4. **False Invariant Proposed**:  
     - **Example**: A team proposes, "Strings never contain U." Referee counters: "MUIU is a theorem (see ledger), and has U."  
     - **Room Confidence Impact**: Confidence may dip initially, but use it: *"Good attempt. Why did it fail? What must an invariant withstand?"* (Elicit: all rules and theorems). This refines the criterion.  

  5. **Confusion (Not-Found vs. Cannot-Be-Found)**:  
     - **Predictable**: It will surface at the pivot.  
     - **Remedy**: Lean in. *"This is the crux. How could we resolve it?"* Let teams debate. The invariant proof resolves it.  

  6. **Feeling Set Up**:  
     - **Remedy**: In debrief, validate: *"The prize created real tension—like when we assume a problem is solvable. That’s intentional. The ‘set-up’ mirrors how hard it is to question assumptions."* Focus on the insight gained.  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Genuine Uncertainty**: You know MU is impossible, making facilitation "theater." Participants may sense this.  
     - **Mitigation**: Strict neutrality. Use the ledger as the arbiter ("What does our data show?").  

  2. **Invariant as Discovery, Not Selection**: The gallery hands candidates rather than fostering invention. Teams propose first, but under time pressure, it’s shallow.  
     - **Mitigation**: Stress proposal time as "brainstorming" and the gallery as "testing."  

  3. **Self-Reference Depth**: The debrief clarifies this is surface-level metatheory. Without arithmetic encoding, Gödel’s self-reference remains out of reach.  

  4. **Emotional Weight of Gödel**: The discomfort here is intellectual friction, not paradox-induced crisis. The debrief must not oversell.  

  **Final Note**: This plan creates the experience you want—participants *feel* the pivot and articulate the invariant criterion. It works because the structure (prize, ledger, pivot) forces the realization without instruction. The first run will have hiccups (e.g., referee errors), but the design is resilient. Good luck!
