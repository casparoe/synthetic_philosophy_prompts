prompt: |-
  A pattern keeps turning up in the history and history-of-science I read, and I cannot tell whether it has a name or whether I am just redescribing hindsight bias. Take two accounts of the same body of evidence, written by the same historian with the same inferential steps: one explains why a revolution succeeded, the other why an apparently identical set of conditions produced a failed rising elsewhere. Readers call the first an explanation and the second a rationalization, even when the second is a strict mirror of the first. The outcome does not merely raise my estimate of how likely it was; it changes which conditions I am willing to count as causes at all. The same facts that figure as "the causes" in the successful case get demoted to "background" or "countervailing factors" in the failed one, and I seem to have no independent test for the promotion other than the outcome itself. I know hindsight bias and the narrative fallacy, but as I understand them the first concerns my sense of inevitability and the second the pull of a coherent story, whereas what bothers me is outcome-dependence in the standard of what counts as an explanation. Is there an established term for that? If there is, name it and say how it differs from those two and from the older charge of reading history backwards from the present. If there is not, coin one and define it, and tell me where its edges are -- in particular whether it applies to explanations with no narrative at all, such as a statistical model that fits the observed outcome and would have fit its negation equally well.
reasoning: |-
  Okay, the user is describing a pattern they've noticed in historical and scientific histories. They see that the same set of conditions might be labeled as "causes" in one situation where the outcome was successful, but considered mere "background" factors in another where the outcome failed. They're wondering if there's a specific term for this outcome-dependent labeling bias that affects what we consider an explanation.

  The user mentions they're familiar with hindsight bias and the narrative fallacy but feel this is distinct. Hindsight bias makes past events seem inevitable after they happen, while the narrative fallacy involves crafting coherent stories. But here, the issue is how the outcome itself changes what we deem as causes versus background conditions. The user wants to know if there's an established term for this or if a new one should be coined.

  First, I need to recall if there's an existing concept in philosophy of history or science. Thinking about it, in the philosophy of science, there's the idea of explanatory asymmetries. For example, when explaining success versus failure, the same factors might be highlighted or downplayed based on the outcome. This sounds similar to what the user is describing. The term "explanatory asymmetry" comes to mind. It's been discussed in contexts like explaining success versus failure in scientific theories or revolutions.

  The user also asks how this differs from hindsight bias and reading history backward. Hindsight bias is about the perceived inevitability, not the structure of the explanation. Reading history backward might involve projecting present knowledge onto past actors, but here it's more about the criteria for what counts as a cause. The key point is that the outcome itself dictates which factors are elevated to causal status.

  The user also mentions statistical models that fit both outcomes equally well. This ties into the idea that without a predictive theory, the model is underdetermined. So the bias here might be in selecting which variables to label as causes based on the outcome, even if the model's fit is the same for success or failure. This relates to the problem of symmetrically overdetermined outcomes.

  I should check if "explanatory asymmetry" is the right term. Upon reflection, yes—philosophers like Bas van Fraassen and others have discussed how explanations can be asymmetrical based on outcomes. The Stanford Encyclopedia of Philosophy entry on scientific explanation might cover this. The user might benefit from references to specific discussions, like those on the asymmetry in explaining success vs. failure in scientific revolutions.

  Another angle is causal selection bias. When multiple factors are present, the outcome influences which ones we pick as causes. For example, in a successful revolution, certain factors are highlighted as key, but in a failed one, the same factors are downplayed, and others are blamed. This is a form of outcome-based causal weighting.

  So, coining a term like "Outcome-Dependent Causal Selection" (ODCS) could work. Defining it as the tendency to elevate factors to causal status based on their alignment with the outcome, while demoting identical factors to background conditions when outcomes differ. The edges: it applies even in non-narrative contexts, like statistical models. If a model fits both outcomes, labeling variables as causes based on the observed outcome without theoretical justification is ODCS.

  How does this differ from hindsight bias? Hindsight bias affects probability judgments (it seemed inevitable), while ODCS affects the causal structure of explanations. Narrative fallacy creates coherence; ODCS changes causal hierarchy based on outcome. Reading history backward imposes present perspectives, but ODCS is specifically about outcome-driven causal selection.

  The user's deeper need might be understanding why historians fall into this trap and how to avoid it. They might be looking for methodologies to counteract this bias, like counterfactual analysis or predictive validation. Also, they might want to validate their observation as a recognized issue, which could aid their research or writing in history of science.
answer: |-
  This is a brilliantly articulated observation that cuts to the heart of historical and scientific explanation. You're identifying a distinct and profound bias, often conflated with hindsight but deserving of its own name. The closest established concept is **Explanatory Asymmetry**, but it needs refinement for your specific case. Let's break it down:

  1.  **The Established Core: Explanatory Asymmetry**
      *   Philosophers of science and history (e.g., Bas van Fraassen, Richard Moran, discussions around the "Symmetry Problem") recognize that explanations for success/failure, presence/absence, or occurrence/non-occurrence are often fundamentally *asymmetric*.
      *   **Example:** Explaining why a war *started* involves highlighting specific sparks (assassination, ultimatum). Explaining why a war *didn't start* in a similar tense situation involves highlighting dampening factors (diplomacy, deterrence). The *same* underlying conditions (tension, rivalries, alliances) are framed differently based on the outcome.
      *   **How it relates:** Your case is a specific *instance* of explanatory asymmetry driven *entirely* by the outcome, where the asymmetry manifests as the promotion/demotion of factors to "cause" vs. "background" status based *only* on success or failure.

  2.  **Your Specific Bias: Outcome-Dependent Causal Salience (ODCS)**
      *   **Definition:** The cognitive and rhetorical bias whereby the actual outcome of an event determines which pre-existing conditions are deemed salient *causes* and which are relegated to *background context* or *countervailing factors*, even when the set of initial conditions and inferential steps are identical across successful and failed cases.
      *   **Mechanism:** The outcome acts as a powerful filter:
          *   **Success:** Factors aligning with the success are foregrounded as "the causes." Factors that might have hindered success are minimized as "overcome obstacles" or "background noise."
          *   **Failure:** Factors aligning with the failure are foregrounded as "the causes." Factors that might have enabled success are minimized as "insufficient conditions" or "mitigating background."
      *   **The Crux:** As you astutely note, the outcome doesn't just change the *estimated probability* (hindsight bias) or make the story *more coherent* (narrative fallacy); it fundamentally changes the *ontological categorization* of the evidence within the explanatory framework. The "cause" label is applied retroactively based purely on outcome congruence.

  3.  **Differences from Related Biases:**
      *   **Hindsight Bias:** Focuses on the *misperception of inevitability or predictability* ("I knew it all along"). ODCS focuses on the *reclassification of evidence* within the explanation itself. One is about probability judgment, the other about causal structure definition.
      *   **Narrative Fallacy:** Concerns the imposition of a *compelling, simplified story* onto complex events, often ignoring randomness or contradictions. ODCS is specifically about how the *outcome* dictates the *hierarchical ordering* of factors *within* any narrative (or non-narrative explanation) as causes vs. background. A narrative can be coherent *without* suffering from ODCS (e.g., a tragic narrative of failure highlighting noble but insufficient efforts as the "cause").
      *   **Reading History Backwards (Whig History/Teleology):** Involves interpreting the past *through the lens of the present state* (e.g., seeing history as inevitable progress towards the current state). ODCS is more fundamental: it occurs even when comparing two *past* events with different outcomes (e.g., two 18th-century rebellions), or even hypothetical outcomes. It's about the *local* outcome dictating causal salience, not necessarily projecting the present onto the past.

  4.  **Edges and the Statistical Model Case:**
      *   **Applies Absolutely to Non-Narrative Explanations:** This is crucial. ODCS is vividly exposed in your statistical model example.
          *   If a model fits both Outcome A and Outcome B equally well (symmetrically overdetermined), labeling the variables correlated with the *actual* Outcome A as "the causes" while calling variables correlated with the *non-actual* Outcome B "noise," "confounders," or "insignificant background factors" **is pure ODCS**.
          *   The "independent test" you lack is precisely the problem. Without a strong *a priori* causal theory (independent of the single outcome) dictating which variables *should* be causes and which background, the selection is driven *only* by the outcome. The model fitting both outcomes reveals the symmetry; ODCS is the bias that breaks that symmetry in the *interpretation* of the model based solely on the observed result.
      *   **The Edge:** ODCS becomes less prominent (or transforms) when:
          *   There is a strong, validated, predictive theory *independent of the specific outcome* that definitively identifies causal mechanisms and distinguishes them from background conditions *before* the outcome is known. (This is rare in complex historical/social analysis).
          *   The explanation is purely mechanistic and descriptive, avoiding any attribution of "cause" vs. "background" (e.g., simply listing all factors present).
          *   The analysis explicitly focuses on symmetries and uses counterfactuals rigorously to test the necessity/sufficiency of factors *regardless* of the actual outcome.

  **Conclusion:**

  You've identified **Outcome-Dependent Causal Salience (ODCS)**. While rooted in the broader philosophical issue of **Explanatory Asymmetry**, ODCS precisely names the mechanism you describe: the outcome retroactively dictating which factors attain the privileged status of "cause" and which are demoted to "background" within an explanation, even when the initial conditions and reasoning are mirrored. It differs from hindsight bias (misjudging probability), the narrative fallacy (imposing story coherence), and reading history backwards (teleology) by targeting the core structure of causal attribution itself. It persists even in non-narrative, statistical explanations, exposing a fundamental challenge in distinguishing causation from correlation when explanations are built primarily *post hoc* around a single realized outcome. Recognizing ODCS forces us to confront the uncomfortable question: Without a predictive theory, how much of our causal explanation is just a story shaped by the result we already know?
