  The user's skepticism about "consensus" claims is justified. In truth, there's no resolution after decades because both theories solve core problems while creating new ones. The objections do often talk past each other: epistemicists care about logical preservation, supervaluationists about capturing indecision phenomenology. 

  For higher-order vagueness, the user nails the dilemma. Epistemicists multiply unknowable facts ad infinitum, while supervaluationists face regress via "admissible precisification" vagueness. Neither solution feels satisfying. This might indicate vagueness resists precise formalization altogether.

  On progress possibilities: formal results likely won't break the deadlock, as both frameworks are internally consistent. New distinctions (like separating competence from performance in vague judgments) could help. Empirical work on higher-order judgments might reveal cognitive patterns that favor one model, but I suspect results would be messy. 

  The real breakthrough may require reconceptualizing vagueness as fundamentally dynamic or contextual rather than static. But that's speculative. For now, the honest answer is that the debate persists precisely because vagueness exposes tensions between logic, language, and cognition that we haven't reconciled.
answer: |-
  Here's a diagnosis, oriented by your hypotheses and request for clarity:

  You've accurately captured the core dialectic and the standard objections. Both theories successfully block the sorites paradox within their frameworks and preserve classical logic *to a significant extent* (epistemicism fully, supervaluationism for logical consequence but not bivalence). The decades-long stalemate arises not because either side has refuted the other, but because each addresses a powerful intuition while struggling to fully accommodate the intuition motivating its rival.

  Your first hypothesis has traction: **They are answering subtly different questions, prioritizing different phenomena.** Epistemicism is fundamentally driven by the *logico-semantic* intuition: vague predicates *must* have extensions; otherwise, classical logic (seen as indispensable) fails, and the inability to identify the false premise in the sorites becomes inexplicable. "Borderline" is an epistemic shadow cast by that semantic reality. Supervaluationism is fundamentally driven by the *phenomenological/linguistic* intuition: in borderline cases, there genuinely *is* no fact of the matter; it feels unsettled *because* it is semantically unsettled. "Borderline" is a semantic status reflecting the lack of a unique, context-independent extension. Each theory explains away the other's core datum: the epistemicist dismisses the "no fact" feeling as mere ignorance, while the supervaluationist dismisses the demand for a sharp boundary as a category error stemming from a misunderstanding of how vague language works.

  Your second hypothesis is equally valid and complementary: **It *is* a fight about which data are authoritative.** The epistemicist privileges:
  1.  **The success and presumed indispensability of classical logic:** If vague language is meaningful and we reason effectively with it, it *must* obey classical laws; bivalence is central to that.
  2.  **The inescapability of the sorites challenge:** *Some* premise *must* be false, even if we can't say which. Denying this seems like sophistry.
  The supervaluationist privileges:
  1.  **The phenomenology of vagueness:** The powerful sense that there's "nothing to know" in a borderline case isn't ignorance; it's a direct reflection of the semantic indeterminacy.
  2.  **The nature of linguistic competence:** Competent speakers don't *discover* sharp boundaries; they *negotiate* meaning in context. "Admissible sharpenings" model this competence.
  Each side sees the other as explaining away a fundamental, non-negotiable datum. The epistemicist sees the supervaluationist's "no fact" as undermining logic and meaning; the supervaluationist sees the epistemicist's "unknowable fact" as metaphysically spooky and phenomenologically inaccurate.

  **What's Settled vs. Contested:**
  *   **Settled (Broadly):** Classical logic (or a very close approximation like global supervaluationist consequence) *can* be preserved for vague languages despite the sorites. Both major approaches achieve this. The sorites paradox, as traditionally presented, *can* be formally blocked. Higher-order vagueness is a genuine and difficult problem for *both* approaches. There is no consensus on which theory is correct.
  *   **Genuinely Contested:** Whether the preservation of classical logic *requires* bivalence and sharp boundaries (epistemicist) or can be achieved without them (supervaluationist). Whether the "no fact" intuition is fundamental data (supervaluationist) or an illusion of ignorance (epistemicist). Whether the alleged absurdity of "unknowable sharp boundaries" is decisive (supervaluationist) or just a common feature of the world (epistemicist). Whether the vagueness of "admissible sharpening" is a fatal regress (epistemicist) or manageable within the framework (supervaluationist). *There is no consensus on the fundamental nature of vagueness or truth for vague predicates.*

  **Diagnosis of the Stalemate:** The core issue is that vagueness presents us with a **tension between logic and phenomenology**. Epistemicism resolves the tension by sacrificing the pure "no fact" phenomenology on the altar of classical logic and sharp boundaries. Supervaluationism resolves it by sacrificing bivalence and the idea of a unique extension on the altar of the "no fact" phenomenology and contextual meaning. The objections slide past each other because each theory *embraces* the cost the other finds unacceptable. The debate repeats because neither cost seems *clearly* less palatable to the philosophical community as a whole; each has powerful defenders precisely because each protects something vital.

  **Higher-Order Vagueness:** You correctly identify this as a major pressure point. Both theories struggle symmetrically:
  *   **Epistemicism:** Requires unknowable boundaries *between* definite cases, borderline cases, and also between *orders* of definiteness. This multiplication of unknowable facts feels increasingly ad hoc and disconnected from linguistic practice to critics.
  *   **Supervaluationism:** Requires defining "admissible sharpening" for the *first-order* predicate, which itself seems vague. Attempts to model higher-order vagueness (e.g., by making the set of admissible sharpenings itself fuzzy or context-dependent) often appear complex, non-uniform, or susceptible to similar regress worries at the next level. The "true on all sharpenings" definition of "definitely" can yield counterintuitive results (like the truth of "there is a sharp cut-off" on the supervaluationist account, even if no *specific* cut-off point is definite).
  This symmetry reinforces the sense that the core tension (logic vs. phenomenology) is fundamental and recurs at every level.

  **What Counts as Progress?**
  1.  **New Formal Frameworks:** Developing a compelling model that *genuinely* integrates higher-order vagueness without collapsing into epistemicism or supervaluationism's problems, or showing that such integration is impossible within certain constraints. Progress might involve non-classical logics (e.g., degree-based, subvaluationist, dynamic) that offer a *different* way to preserve key logical features while better accommodating the phenomenology and higher-order vagueness. Showing that one of the existing frameworks *can* formally model higher-order vagueness convincingly would also be progress.
  2.  **Conceptual Distinctions:** Sharpening the understanding of "definitely," "borderline," "competence," "context," or "sharpening" itself. Distinguishing different *types* of vagueness or different *sources* of the "no fact" feeling (e.g., semantic indecision vs. ontological indeterminacy vs. epistemic limitation). Clarifying the relationship between vagueness and context-sensitivity.
  3.  **Empirical Work:** Studying how people *actually* judge higher-order borderline cases ("Is this patch definitely red?", "Is it borderline whether it's definitely red?") and sequences of sorites arguments. Do judgments exhibit higher-order vagueness consistently? How does context influence judgments of definiteness? Does the phenomenology align more with ignorance or with semantic indecision? This could challenge or support the core intuitions each theory relies on.
  4.  **Metaphysical/Empirical Constraints:** Arguments showing that unknowable sharp boundaries are *impossible* (not just odd) given the nature of language, concepts, or the world, or conversely, arguments showing that semantic indecision is *incompatible* with successful communication or reference. Progress could also come from cognitive science explaining *why* we have the intuitions we do (e.g., limitations of perception, memory, categorization).
  5.  **Reconceptualization:** Recognizing the stalemate itself as evidence that the question "Is there a sharp boundary?" might be ill-posed for vague predicates *in their unsharpened state*. Perhaps vagueness *is* the lack of a context-independent answer, and demanding one is a mistake. Progress might involve developing a theory that takes this lack of context-independent determinacy as fundamental without trying to model it via precisifications or hidden truths.

  **Honest Answer:** The question isn't *entirely* ill-posed, but it might be expecting a single answer where none exists because it touches on deep tensions in logic, language, mind, and metaphysics. Epistemicism and supervaluationism are both coherent, internally consistent responses that solve the core logical problem (the sorites) but struggle fully to capture the messy reality of vague language and judgment, especially at higher orders. The genuine contest is over which core intuition – the demand for classical semantic values or the "no fact" phenomenology – is more fundamental and less costly to sacrifice. Decades of work haven't settled this because the choice often comes down to philosophical temperament and which costs one finds more palatable. Progress is more likely to come from frameworks that *reconfigure* the tension or provide new empirical insights than from a decisive knockout blow within the current dialectic. The debate persists precisely because vagueness sits at a fascinating and unresolved crossroads.
