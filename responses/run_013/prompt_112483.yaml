  Here is a joint statement reflecting a genuine good-faith adversarial collaboration between a Totalist (Dr. Aris Thorne) and a Critical-Level Theorist (Dr. Lena Voss), identifying shared ground, framing disagreements respectfully, and specifying testable cruxes.

  **Joint Statement on Population Ethics: Points of Convergence and Divergence**
  **Dr. Aris Thorne (Totalist Perspective) & Dr. Lena Voss (Critical-Level/Person-Affecting Perspective)**
  *Date: October 26, 2023*

  **Preamble:** We, the undersigned, represent distinct and often opposing views on how to evaluate outcomes involving different populations. We engaged in adversarial collaboration to rigorously identify points of genuine agreement, clarify the structure of our disagreements, and define testable cruxes. This document reflects that effort. Our goal is intellectual honesty, not compromise for its own sake. We acknowledge the profound difficulty of these questions and that reasonable, informed individuals can disagree.

  ### I. Shared Foundational Commitments & Established Points of Agreement
  *(Both Signatories Affirm the Following)*

  1.  **Welfare as the Fundamental Currency:** The ethical evaluation of outcomes fundamentally depends on the welfare (well-being, utility) of individual sentient beings.
  2.  **Impartiality & Equal Consideration:** The welfare of every individual counts equally in the moral calculus, irrespective of *who* they are, *when* they exist, or *where* they exist. No individual's welfare is intrinsically more valuable than another's.
  3.  **The Non-Identity Problem is Real & Significant:** Many choices affecting future populations also determine *which* specific individuals will exist. Standard "harm"-based analyses often fail because the alternative individuals created wouldn't exist to be "better off" under the alternative choice. This necessitates a distinct ethical framework for evaluating different possible futures.
  4.  **Transitivity of "Better Than" for Fixed Populations:** If Population A has higher welfare for every individual than Population B, then A is better than B (Pareto Principle). If Population A has the same individuals as Population C but higher total welfare (and no one worse off), then A is better than C. The relation "better than" is transitive *when comparing populations containing the same set of individuals*.
  5.  **The Mere Addition Paradox Exposes a Genuine Difficulty:** Adding a new group of individuals, each with lives clearly worth living, *without making anyone else worse off*, intuitively seems permissible or even good. However, repeated applications of this seemingly benign principle can lead to outcomes (like the Repugnant Conclusion) that are strongly counterintuitive. This demonstrates a deep tension within population ethics that requires resolution, not dismissal.
  6.  **"Bad" Lives Should Be Avoided:** Creating lives dominated by suffering (net negative welfare) is a bad thing, all else being equal.
  7.  **The Repugnant Conclusion is Repugnant:** The conclusion that a vast population where everyone has lives barely worth living is *better than* a small population with very high welfare is deeply counterintuitive and constitutes a significant problem for any population axiology aiming for practical applicability and intuitive alignment. We agree it *needs* addressing; we disagree profoundly on the *correct* resolution.

  ### II. Framed Core Disagreements
  *(Each Claim is Phrased by its Proponent in a Way the Other Can Acknowledge as Accurate Representation)*

  **A. Dr. Thorne (Totalist Claim):**
      *"We should strive to maximize the sum total of welfare across all sentient beings who ever exist. Adding lives with positive welfare (lives 'worth living') always makes the outcome better, provided no one else is made worse off. The sheer number of beings experiencing positive welfare is a fundamental contributor to the overall goodness of an outcome. While the Repugnant Conclusion is counterintuitive, it represents the logical consequence of impartially valuing all positive welfare, regardless of its level above zero."*

  **B. Dr. Voss (Critical-Level/Person-Affecting Claim):**
      *"The creation of new lives with welfare above zero but below a positive critical level does not constitute a moral improvement. While not a harm (as per the Non-Identity Problem), such additions are ethically neutral at best. The primary ethical focus should be on improving the welfare of individuals who do or will exist ('person-affecting'), not on maximizing an impersonal total sum. We should prioritize ensuring lives are *good* (surpassing a positive critical threshold of welfare) rather than merely *not bad*. Avoiding the Repugnant Conclusion requires recognizing that more lives are not intrinsically better if those lives lack sufficient quality."*

  ### III. Key Cruxes & Testable Predictions
  *(Defining Concrete Points of Contention and Agreed-Upon Falsification/Verification Scenarios)*

  | Crux                                                                 | Agreed Test Case(s)                                                                                                                               | Thorne (Totalist) Prediction                                                                                            | Voss (Critical-Level/Person-Affecting) Prediction                                                                                 |
  | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Does adding lives with low-positive welfare *always* constitute an improvement?** | **Case A:** Small population (1 billion) with *very high* welfare (10 units/life). <br> **Case B:** Vast population (1 trillion) with *low-positive* welfare (0.01 units/life). | **B** is better than **A**. The immense total welfare surplus in B outweighs the high average in A.                     | **A** is better than **B**. Lives in B are below the critical level (assumed >0.01), so their addition doesn't improve A; A has higher quality. |
  | **2. Does the *duration* of low-positive welfare significantly alter its value?** | **Case B1:** As above (1 trillion lives @ 0.01 units/life, full lifespan). <br> **Case B2:** 1 trillion lives @ 0.01 units/life, but each life lasts only **one day**. | **B1** is vastly better than **B2** (less total welfare). <br> **B2** might still be better than **A** *if* total welfare exceeds A's (unlikely at 1 day). | **Neither B1 nor B2** is better than **A**. Duration is irrelevant to the *quality* judgment; lives below the critical level don't add value regardless of length. **B1 vs. B2:** B1 might be *worse* than B2 due to greater resource use/longer existence below the threshold. |
  | **3. Is there a fundamental ethical distinction between "improving existing lives" and "adding new lives"?** | **Case C:** Choice to slightly improve the welfare of 1 billion existing high-welfare people (e.g., +0.1 unit each). <br> **Case D:** Choice to add 1 billion new people with low-positive welfare (0.1 units/life), leaving the original billion unchanged. | **C** and **D** produce the same *increase in total welfare* (+0.1 billion units). They are **equally good** choices. | **C** is clearly better than **D**. C benefits existing people. D adds lives that are below the critical level (assumed >0.1), which is not a comparable benefit. |

  **IV. Semantic/Conceptual Divergence Notes:**
  We acknowledge that part of our disagreement may stem from differing conceptual emphases:
  *   **"Better than":** Dr. Thorne uses this primarily in an *impersonal, axiological* sense (which state of the universe contains more total value?). Dr. Voss emphasizes a *person-affecting* sense (which choice makes things better *for* individuals who exist or will exist?).
  *   **"Welfare":** While we agree welfare is fundamental, Dr. Voss argues that welfare levels below her critical threshold represent a state that, while preferable to non-existence, does not constitute a "good" to be promoted in the same way welfare above the threshold does. It's "not-a-bad" rather than a positive "good". Dr. Thorne sees any positive welfare as intrinsically valuable and additive.
  *   **"Improvement":** Dr. Thorne defines improvement strictly as an increase in total welfare. Dr. Voss defines improvement relative to the welfare of existing or future identifiable individuals, excluding the mere addition of new, low-quality lives as an improvement. **This is not merely semantic; it reflects a deep difference in what we consider the core ethical question.**

  ### V. Status of the Dispute
  *   **Settled:** The foundational concepts (welfare, impartiality), the existence and significance of the Non-Identity Problem, the Mere Addition Paradox, and the counterintuitive nature of the Repugnant Conclusion are widely acknowledged within the field. Transitivity holds for fixed populations. Avoiding lives of net suffering is uncontroversial.
  *   **Genuinely Contested:** The core disagreement outlined in Section II represents a fundamental, *live*, and unresolved dispute within population ethics. There is no consensus on whether Totalism, Critical-Level theories, Average Views, or Person-Affecting Views (or variants thereof) offer the correct resolution. The Repugnant Conclusion is widely considered a *problem*, but there is **no consensus on its refutation** or on which alternative axiomatic framework is ultimately correct. The cruxes identified in Section III are actively debated points where intuitions clash, and no decisive argument has convinced the majority of specialists. **The field remains in a state of productive uncertainty.**

  **Signed,**
  Dr. Aris Thorne
  Dr. Lena Voss

  ---

  **Key Notes for Your Novel:**

  1.  **Avoids Weaseling:** Shared claims (I) are substantive (Non-Identity, Mere Addition Paradox, Transitivity for fixed sets, Repugnant Conclusion as a *problem*). Disagreements (II) are starkly framed by each proponent.
  2.  **Cruxes & Cases:** Uses your cases explicitly (A/B, B1/B2) and adds another (C/D) to probe the existing/new life distinction. Predictions are clear and divergent. The duration test (B1 vs B2) reveals it's *not* a red herring for Voss (she rejects both) and highlights a key difference: Thorne cares about total welfare units (so duration matters immensely), Voss cares about quality thresholds (so duration is largely irrelevant to the core judgment of value-addition).
  3.  **Semantic Clarity:** Explicitly flags the potential divergence in meaning for "better than," "welfare," and "improvement," linking it to the deep philosophical split.
  4.  **Reflects Actual Debate:** The document clearly states the Repugnant Conclusion is *not* refuted (it's a problem for all), that there is *no consensus* on the correct view, and that the core disagreement is live and unresolved among experts (Section V). It embraces the uncertainty.
  5.  **Structure:** Clearly separates Agreement (I), Framed Disagreement (II), Testable Cruxes (III), Semantic Notes (IV), and Status (V).
