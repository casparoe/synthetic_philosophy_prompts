  - We do two separate rounds: one synchronic and one diachronic. In between, we reset.

  **Round 1: Synchronic (30 minutes)**
  - (5 min) Setup: Distribute to each participant: 
     - 6 get a Painting card
     - 6 get a Sculpture card
     - 6 get a Tapestry card
     - Each gets 10 peanuts ( poker chips or marked on a score sheet).
     - Each gets a preference card that says:
          "Your preferences for the artworks:
           - You prefer Sculpture to Painting.
           - You prefer Tapestry to Sculpture.
           - You prefer Painting to Tapestry.
          Note: You should only trade if you believe the trade makes you better off."

  - (2 min) Explanation: "This is a trading game. The market maker will come around and offer you trades. You may accept or decline. There will be three trading sessions. In each session, the market maker will visit everyone once."

  - (15 min) Trading: 
     - The confederate visits each participant in a fixed order (e.g., by seat). 
     - For each participant, the confederate:
          - If they have Painting: offers to exchange it for Sculpture if the participant pays 1 peanut.
          - If they have Sculpture: offers to exchange it for Tapestry if the participant pays 1 peanut.
          - If they have Tapestry: offers to exchange it for Painting if the participant pays 1 peanut.
     - The participant can accept or decline. If accept, they hand over their fruit card and 1 peanut, and receive the new fruit card.
     - The confederate records acceptances (optional).

     - After the confederate has visited everyone, that's one session. We do three sessions.

  - (5 min) intermediate accounting: after round 1, they count their peanuts and note their fruit.

  **Round 2: Diachronic (30 minutes)**
  - (5 min) Setup: redistribute so that everyone starts with the same as in round 1: 10 peanuts and a fruit (same distribution). But now we will have a change in preferences halfway.

  - (2 min) Explanation: "This round is similar, but there will be a news bulletin after the first trading session that might affect your preferences."

  - (10 min) Trading session 1: same as above. Confederates does one full round of offers.

  - (3 min) News bulletin: Instructor announces: "Attention! Art market news: A famous artist has been revealed to have forged Sculptures. Therefore, everyone's preferences have changed. From now on, your preferences are:
        - You prefer Painting to Tapestry.
        - You prefer Tapestry to Sculpture.
        - You prefer Sculpture to Painting.   [Wait, that's the same cycle!]

  We need to change to transitive. Let's set:

  "From now on, your preferences are:
     - You prefer Painting to Tapestry to Sculpture.
     - So: Painting > Tapestry > Sculpture."

  So now it's transitive.

  - (10 min) Trading sessions 2 and 3.
     - In session 2, the confederate offers based on the new preferences? But the confederate doesn't know what to offer because the preferences are now transitive and they might not want to trade.

  We want to pump them. So we design the offers to exploit the change.

  After the news, they have new preferences. The confederate will offer trades that are locally attractive in the new preferences:

     - If they have Sculpture, they might want to trade to Tapestry or Painting. But we want a specific sequence.

  We can have the confederate offer:

     - If they have Sculpture: offer to trade for Tapestry if they pay 1 peanut. (because now Tapestry > Sculpture)
     - If they have Tapestry: offer to trade for Painting if they pay 1 peanut. (because Painting > Tapestry)
     - If they have Painting: no trade offered? Because it's the best.

  But then those who start with Sculpture might trade to Tapestry and then to Painting, and then stop. They lose 2 peanuts and end up with a better fruit. That is not a pump back.

  To create a pump across the change, we need to start them on a fruit that will become less preferred after the news.

  Example with a participant who starts with Painting in round 2:

  - Session 1 (before news): 
     - They have Painting. Confederates offers: trade to Sculpture for 1 peanut. They accept because before news, they prefer Sculpture to Painting.
     - So after session 1: they have Sculpture, 9 peanuts.

  - News: preferences change to Painting > Tapestry > Sculpture.

  - Session 2: 
     - They have Sculpture, which is now the worst. Confederates offers: trade to Tapestry for 1 peanut. They accept because Tapestry > Sculpture.
     - Now have Tapestry, 8 peanuts.

  - Session 3:
     - They have Tapestry. Confederates offers: trade to Painting for 1 peanut. They accept because Painting > Tapestry.
     - Now have Painting, 7 peanuts.

  So they started with Painting and 10 peanuts, and ended with Painting and 7 peanuts. Pumped out 3 peanuts.

  And the preferences changed in the middle.

  **Debrief (15 minutes)**

  Debrief mapping:

  1. The pump's dependence on market assumptions:
     - In the game, the confederate was always willing to trade at the fixed price, and there were no transaction costs beyond the 1 peanut. What if the confederate charged 2 peanuts? Or what if after the news, the confederate stopped offering trades? Would that prevent the pump? It would, but the underlying preferences are still intransitive (in the synchronic case) or changed (in the diachronic case). The market conditions enable the pump.

  2. Synchronic vs. diachronic:
     - In the synchronic round, the preferences were fixed and the participant made all trades in the same state. In the diachronic round, the preferences changed externally, and the participant responded to the change. In the diachronic case, is the participant irrational? Or is it rational to change when the world changes? And should the participant have foreseen the change? We can discuss whether the earlier self should bind the later self.

  3. Escapes and what they cost:
     - One escape is to refuse to trade altogether. But then you might be stuck with a fruit you don't like. In the diachronic round, if you start with Sculpture and never trade, after the news you are stuck with the worst fruit. 
     - Another escape is to have a plan: "I will not trade more than once." But then you might miss out on improvements. 
     - In the game, they could have refused the third trade in the synchronic round, but then they would have the fruit they least like in their fixed preferences (e.g., if they have Tapestry, and they prefer Painting to Tapestry, but they don't trade, they are stuck with the worst).

  4. The dial-shaped sequence:
     - We didn't build this in. We might not have time. But if we do, we can have a separate mini-game or mention it in the debrief with a thought experiment.

  5. What the game cannot show:
     - The game shows that intransitive preferences can be costly in a market with a willing counterparty and no transaction costs. It doesn't show that intransitive preferences are irrational in all contexts. Also, the goods are specific; the argument applies to any set of goods.

  **Timeline (75 minutes):**

  - (5 min) Introduction to the game, distribute materials.
  - (30 min) Synchronic round: setup (5), trading (20: 3 sessions of 5 min each), intermediate accounting (5 min).
  - (30 min) Diachronic round: setup (5), trading session 1 (5), news (3), trading sessions 2 and 3 (10), and final accounting (7 min).
  - (10 min) Debrief.

  But we have only 75 minutes, so 5+30+30+10=75.

  **Confederate:**
  - The confederate should be a student who is not known to be associated with the instructor. The instructor should not reveal the confederate. The confederate's role is to be the market maker, and they will be given the instructions for what offers to make.

  **What will go wrong:**
  - Participants might notice the cycle and stop trading. 
     - Mitigation: Do not let them see the whole sequence. Make the confederate visits quick and in a fixed order so that they don't have time to confer. 
     - In the instructions, emphasize that they should make each decision based on the current offer and their current state.
  - Some might start with their highest-ranked fruit and see no reason to trade in the synchronic round. 
     - For example, if they start with Tapestry in synchronic round, they prefer it to Sculpture and to Painting? No, in the synchronic preferences, for a person holding Tapestry, they prefer Painting to Tapestry? Yes. So they would be willing to trade to Painting. So everyone has an incentive to trade.
  - In the diachronic round, after the news, those with Painting will not trade, so they avoid the pump. But those who start with Sculpture or Tapestry might get pumped. We want to pump everyone. In the example above, we pumped a participant who started with Painting by first trading to Sculpture. So if they start with Painting, we can pump them. If they start with Sculpture, in session 1 we offer to trade to Tapestry (because before news, they prefer Tapestry to Sculpture). Then after news, they have Tapestry (now middle) and we offer to trade to Painting for 1 peanut (because Painting > Tapestry). So they end up with Painting and down 2 peanuts. Then in session 3, if we offer to trade Painting for Sculpture? But after news, they prefer Painting to Sculpture, so they wouldn't. So they avoid the full pump.

  To pump everyone, we need a sequence that works for any starting point.

  For a participant starting with Sculpture in diachronic round:
  - Session 1 (before news): offer trade to Tapestry (lose 1p). They do it because Tapestry > Sculpture.
  - News: now preferences are Painting > Tapestry > Sculpture.
  - Session 2: they have Tapestry. Offer trade to Painting (lose 1p). They do it because Painting > Tapestry.
  - Session 3: they have Painting. No offer? Because it's the best. So they are better off: started with Sculpture (worst before news) and ended with Painting (best after news), and lost 2 peanuts. They might be happy.

  For a participant starting with Tapestry in diachronic round:
  - Session 1: offer trade to Painting (because before news, they prefer Painting to Tapestry). They do it, lose 1p.
  - News: now they have Painting, which is best. So they stop.

  So only those who start with Painting get pumped back to Painting and lose 3 peanuts. Others might lose less and improve their fruit.

  This is asymmetric. We might be okay with that. In the debrief, we can focus on the Painting starters.

  Given the time, we go with this design.

  **Deliverables:**

  **Rules and Materials:**
  - Materials: 
     - Artwork cards: 18 of each type (Painting, Sculpture, Tapestry). Actually, only 18 cards in total are needed per round.
     - Peanuts: poker chips or beads.  per participant.
     - Preference cards for synchronic round.
     - News bulletin for diachronic round.
  - Rules for synchronic round: 
     - You start with one artwork and 10 peanuts.
     - The market maker will visit you three times.
     - At each visit, you will be offered a trade: exchange your current artwork for another by paying 1 peanut.
     - You may accept or decline.
  - Rules for diachronic round:
     - Similar, but after the first trading session, there will be a news bulletin that changes everyone's preferences.

  **Payoff and conversion:**
  - At the end of the game, participants convert their peanuts to points: each peanut = 1 point.
  - The fruit has no redemption value; the exercise is about the experience. But we can offer a small prize to the participant with the most points at the end? But then they would hoard peanuts and never trade.

  Alternatively, we can make the final points be the number of peanuts they have. And the fruit doesn't matter. Then they would not trade because trading costs peanuts. So we must make the trade improve their overall position.

  Given the time, we'll assume that participants will follow the preferences and make the trades because we instructed them to only trade if it makes them better off, and by the ranking, it does improve their fruit holding.

  **Roles:**
  - Instructor: explains the rules, distributes materials, announces news, conducts debrief.
  - Confederate: market maker. They approach each participant in turn and make the predetermined offer based on the participant's current fruit.

  **Debrief Mapping:**
  1. Market assumptions: 
     - The confederate was always willing to trade at a fixed cost. What if the confederate charged 2 peanuts? Then the trade might not be attractive because the improvement in fruit might not be worth 2 peanuts. What if the confederate stopped offering after one trade? Then the pump couldn't be completed. The underlying preferences are only costly under these market conditions.

  2. Synchronic vs. diachronic:
     - In the synchronic round, the preferences were fixed throughout. The participant made a loop of trades in the same state. In the diachronic round, the preferences changed externally. The sequence crossed a change in state. In the diachronic case, the participant might feel that the earlier trade was rational given the information at the time, but led to a bad state after the change. Should they have known? Is the later self a different agent?

  3. Escapes:
     - One escape is to never trade. But then in the synchronic round, you might be stuck with a fruit you like less (e.g., if you have Painting and never trade, you could have had Sculpture which you prefer). In the diachronic round, if you start with Sculpture and never trade, after the news you have the worst fruit.
     - Another escape is to have a pre-commitment: "I will only trade once." Then in the synchronic round, you might stop after one trade and not complete the cycle. But then you might have a fruit that is not the best you could have gotten.

  4. Dial-shaped sequence: not included, due to time.

  5. What the game cannot show:
     - It cannot show that intransitive preferences are irrational per se, only that they are exploitable in a market with a willing counterparty and no transaction costs.
     - The goods are specific; the argument is general.

  **Predictable problems and how to handle:**

  1. Participants see the cycle and stop trading.
     - Handle: In the instructions, emphasize that each trade should be evaluated locally. They should not look ahead. And move quickly.

  2. In the synchronic round, after two trades, they have the fruit they started with and fewer peanuts, and refuse the third trade.
     - That's fine. In the debrief, we can use that as an example of an escape.

  3. Some participants may not care and trade randomly.
     - The game might still work if at least some get pumped.

  4. Time management: 
     - Keep a strict timer for each trading session.

  This design is ambitious for 75 minutes. We might need to trim. But it addresses the core requirements.
answer: |-
  ### The Preference Exchange: A Trading Game on Rationality and Choice

  **Objective**: Illustrate the money-pump argument and the synchronic/diachronic distinction through lived experience, without explicit technical terms. Participants trade fruit cards (Apples, Bananas, Cherries) using "peanuts" (scrip currency) to accumulate points. The game forces participants into a money-pump cycle and a diachronic sequence, highlighting market dependencies, preference changes, and escape costs.

  ---

  ### **Rules and Materials**
  **Materials**:
  - **Fruit cards**: 54 cards total (18 Apples 🍎, 18 Bananas 🍌, 18 Cherries 🍒).  
  - **Peanuts**: Poker chips or paper slips (180 total; 10 per participant).  
  - **Preference Sheets**: 18 cards with personal valuations (see below).  
  - **News Bulletin Sign**: For the diachronic round.  
  - **Timer**: For trading sessions.  

  **Player Roles**:
  - **18 Traders**: Each starts with one fruit card and 10 peanuts.  
  - **1 Confederate (Market Maker)**: Always willing to trade at fixed prices. Poses as a participant but is secretly briefed.  
  - **Non-Traders**: None; all participate. To prevent boredom, everyone trades actively.  

  **Setup**:
  - Distribute starting bundles: 6 players get Apples, 6 get Bananas, 6 get Cherries.  
  - Give each a **Preference Sheet** with personalized fruit valuations (in "satisfaction points"):  
    - *Example 1 (Cycle)*: Apple = 12, Banana = 15, Cherry = 10.  
    - *Example 2 (Cycle)*: Apple = 10, Banana = 12, Cherry = 15.  
    - *Example 3 (Cycle)*: Apple = 15, Banana = 10, Cherry = 12.  
    - *(All sheets ensure intransitive valuations, e.g., Banana > Apple, Cherry > Banana, Apple > Cherry)*.  
  - Confederate starts identically to others but never trades; only facilitates.  

  **Trading Rules**:
  - **Trades**: 1-on-1 with Market Maker. No player-to-player trades.  
  - **Offers**: Market Maker approaches players in random order, offering trades based on current fruit:  
    - If holding 🍎: Trade for 🍌 +1 peanut.  
    - If holding 🍌: Trade for 🍒 +1 peanut.  
    - If holding 🍒: Trade for 🍎 +1 peanut.  
  - **Accept/Decline**: Players decide instantly. No negotiation.  
  - **Valuation Logic**: Players calculate gains using their sheet’s satisfaction points + peanuts (1 peanut = 1 point). Trade is rational if:  
    > `Value of new fruit + peanuts gained > Value of current fruit + peanuts spent`  
    *(e.g., Trading 🍎 (12) for 🍌+1 peanut: 15 + 1 > 12 → Gain of 4 points)*.  
  - **Key Constraints**:  
    - Trades are private (no discussing offers).  
    - Market Maker moves quickly (max 15 seconds/player).  
    - No advanced warnings about rounds or news.  

  **Payoff & Conversion**:  
  - Final score = Peanuts held × 1 point + Satisfaction points of final fruit.  
  - Conversion: 40+ points = A+ on next quiz; 30-39 = A; 20-29 = B; <20 = C.  
    *(Small but meaningful; ensures effort without high stakes)*.  

  ---

  ### **Timeline (75 Minutes Total)**  
  1. **Setup (5 min)**:  
     - Distribute materials, read rules, assign starting bundles.  
     - Emphasize: *"Maximize your score. Trades must feel beneficial at that moment."*  

  2. **Synchronic Round (25 min)**:  
     - **Trading Sessions (15 min)**: 3 sessions of 5 min each.  
       - Market Maker cycles through players, offering trades based on current fruit.  
       - Sessions are back-to-back (no breaks).  
     - **Intermediate Accounting (5 min)**: Players record fruit/peanuts. Instructor resets bundles to starting state.  
     - **Outcome**: Most cycle (e.g., 🍎→🍌→🍒→🍎), losing 3 peanuts.  

  3. **Diachronic Round (30 min)**:  
     - **Trading Session 1 (5 min)**: Identical to synchronic round.  
     - **News Bulletin (3 min)**: Instructor announces: *"BREAKING: Bananas cause allergies! All Banana values drop by 6 points. Update your sheets."*  
       - Players adjust sheets (e.g., Banana now 15 → 9).  
     - **Trading Sessions 2 & 3 (15 min)**: Market Maker resumes offers.  
     - **Final Accounting (7 min)**: Record holdings.  
     - **Outcome**: Players who traded pre-news get "pumped" (e.g., held 🍌 when news hit, then traded to 🍒→🍎, losing peanuts).  

  4. **Debrief (15 min)**: Structured discussion (see below).  

  ---

  ### **Confederate Instructions**  
  - **Role**: Act as Market Maker. Approach players rapidly, offer trades neutrally.  
  - **Secrecy**: Sit among players. At setup, take a fruit/peanuts like others. "Trade" only when acting as Market Maker.  
  - **Key Task**: Ensure trades are executed swiftly to prevent reflection. If players hesitate, say: *"Accept or decline? I have to move on."*  

  ---

  ### **Debrief Script**  
  **Goal**: Link experiences to concepts. Avoid jargon until debrief.  
  **Mapping Game Events**:  

  1. **Market Assumptions** (Pump Dependence):  
     - *Ask*: "In Round 1, could you have avoided losing peanuts if trades weren’t instant? What if I charged 2 peanuts per trade?"  
     - *Map to Game*: Synchronic round relied on a willing, instant, fixed-price Market Maker.  
     - *Point*: Pump works only under these conditions. Charging more or delaying trades defuses it—preferences alone aren’t the issue; the market enables exploitation.  

  2. **Synchronic vs. Diachronic**:  
     - *Ask*: "In Round 1, you traded in a loop with fixed preferences. In Round 2, the allergy news changed your values mid-loop. Did your pre-news self ‘betray’ your post-news self? Should you have committed to no trades?"  
     - *Map to Game*: Synchronic loop (Round 1) happened in one state. Diachronic sequence (Round 2) crossed a preference shift.  
     - *Point*: Genuine diachronic pumps require change (knowledge, tastes, options). Later selves aren’t bound by earlier choices unless pre-committed.  

  3. **Escapes and Costs**:  
     - *Ask*: "Who refused trades? What did you gain/lose? Could you have avoided the allergy loss by never trading?"  
     - *Map to Game*:  
       - Refusing to trade: Avoided losses but missed gains (e.g., not trading 🍎 for 🍌+1 in Round 1 meant lower satisfaction).  
       - Pre-commitment: No policy was enforced; players traded locally.  
     - *Point*: Escapes exist (refusing indifference, pre-committing), but they cost opportunities. Rationality isn’t free.  

  4. **Dial Sequence (If Time)**:  
     - *Ask*: "Each trade felt like a small gain. Where would you have stopped? Why there and not earlier?"  
     - *Map to Game*: Synchronic trades were small improvements, but the endpoint (same fruit, fewer peanuts) was worse.  
     - *Point*: No "right" stopping point—arbitrariness reveals the cost of stepwise optimization.  

  5. **Limits of the Game**:  
     - *Explicitly State*:  
       - "This shows intransitivity is costly *under these market conditions*, not that it’s always irrational."  
       - "The argument applies to any goods (health, time, money), but we used fruit for simplicity."  
     - *What You Must Add*: Generality (any goods) and rationality debates (e.g., cyclical preferences might be rational in evolving contexts).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: Players see the cycle early and stop trading.  
     - **Solution**: Fast, private trades prevent reflection. Confederate pressures decisions. Valuations obscure the cycle (e.g., "Banana=15 > Apple=12" feels local).  

  2. **Problem**: Some memorize starting bundles and reset manually.  
     - **Solution**: No resets allowed. In diachronic round, news changes valuations, making memorization useless.  

  3. **Problem**: Players hoard peanuts and avoid trades.  
     - **Solution**: Low starting fruit values (e.g., Apple=12) make trades highly beneficial (e.g., 🍎→🍌+1 = 15+1 > 12). Decliners lose satisfaction points.  

  4. **Problem**: Time runs short.  
     - **Solution**: Cap trades at 15 seconds/player. Skip dial sequence if needed.  

  5. **Problem**: Confederate revealed.  
     - **Solution**: Brief confederate privately. Have them "trade" like others when not acting.  

  **Outcome**: Players experience pumping and preference shifts firsthand. Debrief ties emotions (frustration, regret) to rational choice theory, making abstract concepts visceral.
