prompt: |-
  Third-year phil PhD student here, working on reasons and motivation. My committee wants a 2-page prospectus pitch by next month for what would become a chapter, and I have roughly one semester of real working time for the paper itself. I've got a half-formed idea and I want you to turn it into the actual proposal.

  The idea: the internalism/externalism fight about reasons -- the Williams-style line that a reason for you has to be something that could actually move you -- keeps getting settled by appealing to what the agent would be motivated to do if she deliberated correctly. But that clause is doing two seperate jobs and nobody pulls them apart. Read it narrowly (correct deliberation from the evidence she actually has) and internalism comes out clean, but it can't count the fact that her water is contaminated as a reason for her to act, since she'll never get there from her evidence. Read it widely (deliberation from the facts, whether or not she could ever know them) and every true fact about what would help her becomes an internal reason, so internalism stops excluding anything, which was supposed to be the entire point of it. So I want to argue the distinction is either false, because there are reasons that fail the narrow test, or empty, because everything passes the wide one, and then see what a third option would have to look like -- maybe reasons are relative to what's deliberatively reachable for her, which is neither of those.

  What I need: a precise statement of the question, why the going positions leave it open, the method (what I'd actually do, in order, across the semester -- which cases, which tests, what would show which way), what a result would look like, what would count as the project failing, and wether it's honestly a semester or really a dissertation-sized thing. No citations or lit review, I'll fill those in -- argue from the positions, not from who held them.

  Also tell me which part of the framing you think is most likely to be wrong, and what would change your mind about it: which argument or case would make you say the project isn't worth doing.

  And at the end give me a JSON block I can paste into my notes, fields: question, why_open, method_steps (array), deliverable, failure_conditions (array), scope_verdict, biggest_risk, what_would_change_mind.
