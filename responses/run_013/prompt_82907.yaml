answer: |-
  Here’s a structured prospectus pitch for your chapter, designed as a 2-page framework. I’ve focused on logical scaffolding over citations, per your request. The JSON summary is at the end.

  ---

  ### **Prospectus: The Deliberative Gap in Internalism/Externalism about Reasons**  
  **Core Question**: Does the "correct deliberation" clause in Williams-style internalism resolve the internalism/externalism debate, or does its ambiguity between narrow (evidence-constrained) and wide (fact-constrained) interpretations render the distinction either false (narrow) or empty (wide)? What third option—grounded in *deliberative reachability*—could avoid both pitfalls?  

  **Why the Question Remains Open**:  
  Existing positions presuppose a stable notion of "correct deliberation" but fail to disambiguate its epistemic scope:  
  - **Narrow interpretation** (deliberation from actual evidence): Preserves internalism’s core exclusionary function (reasons must be motivationally accessible) but implausibly excludes objective reasons (e.g., contaminated water) that *should* count as normative.  
  - **Wide interpretation** (deliberation from all facts): Captures objective reasons but collapses internalism into triviality—any fact that *would* motivate under idealized reasoning becomes an "internal" reason, erasing the distinction externalists reject.  
  Neither camp rigorously interrogates the clause’s dual role: (1) *procedural rationality* (how to reason) vs. (2) *epistemic grounding* (what inputs reasoners may access). This ambiguity lets both sides claim victory while talking past each other.  

  **Methodological Steps** (One-semester workflow):  
  1. **Frame the dilemma** (Weeks 1–2):  
     - Reconstruct the narrow/wide ambiguity using hypothetical cases (no historical exegesis).  
     - Test narrow: "Contaminated water" case (agent lacks evidence; narrow says no reason; externalist intuition violated).  
     - Test wide: "Beneficial asteroid" case (unknown fact that saving a stranger would grant immortality; wide says internal reason; internalist exclusion fails).  
  2. **Diagnose collapse risks** (Weeks 3–4):  
     - Show narrow internalism is *false*: It cannot explain why agents have reasons to seek evidence (e.g., "Why test the water?").  
     - Show wide internalism is *empty*: It cannot distinguish between reasons an agent *could* act on vs. those they *should* act on (e.g., immortality case).  
  3. **Develop the third option** (Weeks 5–8):  
     - Argue for "deliberative reachability": A reason R is internal iff R is motivationally accessible via deliberation *from inputs the agent could rationally acquire* (not just actual or all possible).  
     - Test against cases:  
       - *Reachable*: Contaminated water + available testing kit (reason exists; acquisition is rational).  
       - *Unreachable*: Beneficial asteroid + no feasible detection method (no reason; acquisition irrational/impossible).  
  4. **Stress-test reachability** (Weeks 9–12):  
     - Is reachability just externalism? No—it demands *motivational pathways*, not brute facts.  
     - Is it circular? Only if "rational acquisition" assumes prior reasons (counter: tie rationality to agent’s *existing* capacities/goals).  
     - Compare to hybrid views (e.g., "subjective externalism"): Show reachability avoids their problems (e.g., over-intellectualization).  

  **Deliverable**:  
  A chapter demonstrating that the narrow/wide dilemma forces internalism into falsity or vacuity, and that "deliberatively reachable reasons" (DRR) offer a stable alternative. DRR preserves internalism’s motivational constraint while accommodating objective reasons *when* they are epistemically accessible through rational, non-idealized inquiry.  

  **Failure Conditions**:  
  - If the narrow interpretation can be defended as *correctly* excluding objective reasons (e.g., by denying they are "reasons for action" without evidence).  
  - If the wide interpretation can be restricted non-arbitrarily (e.g., "only facts discoverable by possible *human* inquiry").  
  - If "deliberative reachability" reduces to either narrow (when reachability is too strict) or wide (when too permissive) upon testing.  

  **Scope Verdict**:  
  **Semester-sized, not dissertation-scale**. The project critiques a specific ambiguity in a focused debate, constructs one positive alternative, and tests it against core cases. A dissertation would require: (a) broader historical analysis (Williams, Korsgaard, etc.), (b) defenses against all major objections (e.g., constitutivism), (c) applied ethics implications.  

  **Biggest Risk**:  
  **Defining "deliberative reachability" non-arbitrarily**. If "could rationally acquire" relies on contested norms of rationality (e.g., Bayesian vs. bounded rationality), DRR may collapse into subjectivism or externalism. For example:  
  > *If "rational" means "statistically optimal inquiry," DRR might exclude reasons for agents with cognitive biases; if "rational" is goal-relative, it might permit obviously irrational obsessions.*  

  **What Would Change My Mind**:  
  A case showing the narrow/wide ambiguity **does no work** in the debate—e.g., if internalists *only* use narrow and externalists *only* use wide, with no dialectical stalemate. Or, if a **single unified interpretation** of "correct deliberation" (e.g., "procedurally rational from *available* facts") resolves the dilemma without a third option. Example:  
  > *Agent in a foggy minefield: Narrow says no reason to avoid mines (no evidence); wide says reason exists. If internalists convincingly argue that "available facts" include fog-as-danger-sign (motivationally accessible), the project’s core critique fails.*  

