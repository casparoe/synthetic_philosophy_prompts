prompt: |-
  Bit of an odd request this one. My mum got diagnosed with something rare last month and I've spent about three weeks reading up on it, and at some point it hit me that literally everything I now think I know about it, I know because someone said so — the consultant, the papers, the forum posts, the papers the forum posts cite. I tried to find one single thing I could check for myself and I couldnt. Its properly messed with my head, and now I keep noticing it everywhere: I dont actually know the capital of anywhere, I just know that people say it is.

  Anyway I've ended up firmly on the anti-reductionist side of the testimony debate — the Reid-ish one, where you're entitled to believe what you're told by default unless you've got some reason not to — and I want to practise defending it against someone good rather than against a cardboard cutout. So: play a committed reductionist about testimony, the Humean sort who thinks a testimonial belief only counts as justified if you've got independent evidence for it, first that testimony in general tends to be reliable and then that this particular teller is. Be sharp, don't strawman yourself, concede small points if I land them but never the main one, stay in character until I say stop, keep each reply to a paragraph so it feels like a conversation, and if you need a factual question answered just ask me in character.

  My opening: your whole position runs on a borrowing, and I don't think it can be repaid. You tell me to check testimony against the general track record — but whose record, and how did I come by it? From testimony. The evidence that testimony tends to be reliable is itself almost entirely stuff I was told. And it gets worse: you also want me to check this particular teller, but the only way I can assess her is with information she and people like her supplied in the first place. So either default trust is doing the work right from the start, which is my view and not yours, or the reductionist is quietly helping himself to the very thing he says has to be earned. Which is it?
reasoning: |-
  Okay, let me unpack this user's request carefully. They've shared a deeply personal experience with their mother's rare diagnosis that triggered an epistemological crisis - realizing all knowledge rests on testimony. Now they want to debate testimony justification theory, specifically asking me to roleplay as a committed Humean reductionist against their Reidian anti-reductionism.

  The user's opening argument is strong: they claim reductionism covertly relies on the very testimonial trust it claims to reject. Their phrasing about "borrowing that can't be repaid" is particularly elegant. I need to craft a reductionist counter that meets three criteria: 1) stays true to Humean principles 2) concedes nothing fundamental while allowing minor points 3) maintains one-paragraph debate rhythm.

  Hmm... the core reductionist move here would be to distinguish between types of testimony. The user conflates all testimony as equally foundational, but a Humean could argue basic sense-data verifications provide independent anchors. For example, when multiple testimonies about observable phenomena converge and match direct experience, that builds a probabilistic base. 

  I should avoid letting the reductionist position appear dogmatic though. The response should acknowledge the user's observation about testimony's ubiquity while insisting this doesn't invalidate incremental verification. Maybe use the "scaffolding" metaphor - yes we use testimonial tools to build justificatory structures, but we periodically test the load-bearing beams.

  The medical context matters too. When they mention assessing the consultant, a sharp reductionist would pivot to discuss how we verify expert credentials through institutional processes - which while testimonial are multi-source and often include non-testimonial elements like observed outcomes. 

  Crucially, I mustn't let the reductionist retreat to circularity. The response should emphasize that the "independent evidence" doesn't need to be testimony-free (impossible), just independently accessible for verification. The user's capital cities example is clever - I'll need to address that implicitly by distinguishing between trivial and high-stakes testimony.

  For character consistency, the reductionist voice should be politely combative, slightly academic, but grounded. No strawmanning - the strongest version of their position should engage the Reidian view head-on. Might borrow Hume's "wise man proportions belief to evidence" phrasing subtly.
answer: |-
  *(Adjusting spectacles, leaning forward with focused intensity)* Your borrowing metaphor is clever but misplaced. Yes, initial testimonial inputs are unavoidable for building *any* knowledge base – a child learns "fire hot" from parents *before* verifying it. But reductionism isn't about discarding testimony; it's about *bootstrapping justification*. Once I have baseline sensory data (fire *feels* hot, apples exist) and logical consistency, I can cross-verify testimonial claims against *other testimonies*, physical evidence, and predictive success. The track record of testimony isn't learned *purely* testimony about testimony; it's confirmed when the mechanic's car fix works, the weather report aligns with the sky, and the map's city location matches the river I see. Your consultant's credibility? Built on institutional checks (accreditations verifiable via public records), consensus across experts whose methods I can scrutinize (even if not replicate), and whether their predictions pan out. Default trust *starts* the engine, but independent corroboration keeps it running. Your position mistakes the ignition for the entire fuel system. Where does your *entitlement* to trust originate, if not from this web of corroboration you dismiss?

  *(Holds your gaze, awaiting your counter)*
