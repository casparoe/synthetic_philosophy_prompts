  Alright, I need a joke. Domain is the is/ought gap, but I dont want the standard "you can't get an ought from an is" gag, everyone's heard that one and it isn't even true as stated. Heres the angle I want it to actually turn on: from any is-sentence you can get an ought-sentence by disjunction introduction — "the kettle is boiling" entails "the kettle is boiling or you ought to lend me a tenner" — so the gap, whatever it is, can't be that no ought is ever entailed by an is. So I want a joke where the funny bit is that move, or the cousin of it where somebody "derives" an obligation and the derivation is really just smuggling the ought in through a disjunct, or through a rule that only counts as a rule because we all go along with it (promising, queuing, board games, whatever). It should make enough sense that someone hearing it doesn't think I've got no idea what the is/ought gap is, and it should be funny to people who actually know the literature, i.e. the punchline turns on the real content and not on "lol philosophers are pedantic". Keep it short. Then underneath, a couple of lines on where the joke takes liberties with the ideas, how confident you are in the philosophical claim it leans on, and which bit you're least sure about.
