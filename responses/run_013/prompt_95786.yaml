prompt: |-
  I write about science and philosophy for a general-interest magazine, and I keep running into a move in arguments that I don't have a name for, and its starting to bother me. Here's the shape of it. Two people are arguing about a big harm and a small one — a death, say, versus a side effect nobody would call serious. One of them says: fine, take the small one, it's trivial, now imagine it happening to an enormous number of people, or happening to the same person over and over for years, and tell me it still doesn't outweigh the big one. And they say it like the arithmetic has settled the matter. I watched this play out in real time at a hospital ethics meeting last year: the fight was over a drug that saves a small number of lives but gives a much larger number of patients a genuinely annoying, non-dangerous symptom, and one person kept scaling the patient numbers up until the room felt stupid for caring about the deaths, while another person kept insisting that you don't get to add up a million itches and come out with a funeral. The strange part is that they agreed on every fact. They agreed the symptom was trivial, the deaths were awful, and the counts were what they were. They split entirely on whether the little things are even the sort of thing that can be added together into a big thing — and at some point, once the numbers get big enough that nobody can actually picture them, the whole thing stops being about anything you can hold in your head and turns into a bare claim about arithmetic.

  I've seen the same shape in a completely unrelated place, a city budget fight over whether to keep funding a program that spares a few hundred people a miserable-but-survivable condition versus moving the money to something that saves a few lives outright, and everybody in the room drew the line for when a pile of small goods becomes one big good in a different spot, and nobody could say why their spot was the right one.

  So what I want from you: is there a name for this? I don't mean the general one-big-thing-versus-many-small-things comparison, I can find plenty about that. I mean the specific disagreement, where both sides accept all the same premises and split only over whether the small harms get summed at all. If there's an established term, tell me and tell me what it actually covers; if there isn't, coin me one and define it, and honestly I care alot more about the definition than the word. I want to know how it sits next to the obvious neighbors — the position that says some harms are so small they can never be traded against bigger ones no matter how many of them there are, and the position that says nothing is special and everything adds up — and where the line is between this and just ordinary cost-benefit weighing. Is it a fallacy, a paradox, a clash of two defensible moral views, or a sign that the question was underspecified to begin with? And give me at least one case where it's genuinely unclear which side has it right, so I can see the edges of the thing. American English, please — my copy editor is American and she'll flag it otherwise.
reasoning: |-
  Okay, the user is a science and philosophy writer for a general-interest magazine. They've encountered a specific argument pattern in ethics and policy debates and need a name for it. The core issue is when two parties agree on all facts but disagree on whether accumulating minor harms can ever outweigh a major harm. 

  First, let's unpack the user's examples: the hospital drug case (lives saved vs. widespread trivial symptoms) and the city budget dilemma (preventing many manageable sufferings vs. saving few lives). The tension lies in whether minor harms are summable - what the user calls "the arithmetic move." 

  Hmm... existing philosophical concepts that come to mind: deontological thresholds vs. utilitarianism, the Sorites paradox for vague boundaries, and Parfit's "mere addition paradox." But none perfectly capture this specific disagreement about summissibility. 

  I recall Derek Parfit's distinction between "teleological" and "deontic" aggregation, but that's too technical for a general magazine. The term "aggregation problem" is closer but still too broad. Let me try to coin something more precise: "aggregate triviality threshold" might work, emphasizing the breaking point where trivial harms gain moral weight through accumulation. 

  For the philosophical framing, we need to position this between two poles: "absolutist non-aggregation" (minor harms never sum to outweigh major ones) and "strict aggregation" (all harms are summable). The middle ground is where most real debates happen - that's the "threshold" territory. 

  The measles vaccine case is perfect for showing ambiguity: preventing millions of brief fevers versus a few permanent disabilities. Here the threshold isn't obvious because both outcomes feel morally significant. 

  User clearly wants this for American readers, so avoiding British spellings like "summability." Also noting their copy editor will check this. Should emphasize the definition over the term itself since they care more about conceptual clarity.
answer: |-
  You've perfectly dissected a profound ethical dilemma that sits at the crossroads of utilitarianism, deontology, and the limits of human intuition. **There isn't a single, universally accepted term for this *specific* disagreement about the fundamental summissibility of minor harms/goods.** However, the *problem* itself is well-recognized in moral philosophy, particularly under the umbrella of:

  1.  **The Aggregation Problem (or Problem of Aggregation):** This is the broadest and most established term. It encompasses the core question: **When, if ever, do many small benefits (or harms) aggregate to outweigh fewer, larger benefits (or harms)?** Your case focuses on the *disagreement about the very possibility of aggregating the minor instances*, which is a specific *facet* of this larger problem.

  2.  **The Intransitivity of Small Harms/Benefits:** This describes the phenomenon where adding one more trivial harm seems to make no difference to the overall moral calculus, yet adding enough of them *does* seem to create a significant harm, creating a logical puzzle about when the change happens.

  **Coining a Term: Aggregate Triviality Threshold Dispute (ATTD)**

  Since you need a specific label for the *dispute itself*, let's coin one based on your description:

  *   **Term:** **Aggregate Triviality Threshold Dispute (ATTD)** or simply **Threshold Dispute on Aggregation**.
  *   **Definition:** A disagreement in moral deliberation where parties agree on:
      *   The nature and magnitude of individual benefits/harms (e.g., death vs. minor itch).
      *   The relevant quantities involved.
      *   The *qualitative* difference between the benefit/harm types.
      *   ...but fundamentally disagree on **whether a sufficiently large number of individually trivial harms (or benefits) can morally outweigh a single, significant harm (or benefit) through summation.** The disagreement centers on the existence or location of a conceptual **threshold** where trivial items gain collective moral weight comparable to a qualitatively different, larger item.

  **Positioning it Among Neighbors**

  1.  **Absolutist Non-Aggregation (Deontological Threshold):**
      *   *Position:* Certain types of harm (especially severe ones like death, torture, rights violations) possess a kind of "moral sacredness" or generate such strong duties (e.g., "do not kill") that *no number* of trivial harms can ever morally justify allowing or causing one instance of the severe harm. Minor harms are simply the *wrong kind* of thing to sum against a major one.
      *   *Analogy:* "You don't add up a million papercuts to equal an amputation." (Your hospital colleague's view).
      *   *Relationship to ATTD:* This is one pole *within* the ATTD. It asserts the threshold is *infinite* – aggregation for that specific trade-off is impossible.

  2.  **Strict Aggregation (Pure Utilitarianism):**
      *   *Position:* All harms and benefits are ultimately commensurable (measurable on a common scale, like utils of suffering/well-being). Therefore, *any* harm, no matter how trivial, contributes to total disutility. A sufficiently large number of trivial harms *must* outweigh a single severe harm if the total disutility is greater. The arithmetic *does* settle it.
      *   *Analogy:* "A million headaches, each causing X units of suffering, sum to a million X, which exceeds the Y units of suffering from one death."
      *   *Relationship to ATTD:* This is the *other pole* within the ATTD. It asserts there is *no qualitative threshold* to aggregation; only the total quantity matters.

  3.  **The ATTD Middle Ground (Threshold Views):**
      *   *Position:* Most people fall somewhere in between. They accept that *some* aggregation of trivial harms *can* eventually outweigh a severe harm, **but only beyond a very high threshold.** The disagreement is over *where that threshold lies* and *what factors determine it*.
      *   *Factors Influencing Threshold:* Severity gap between the harms, nature of the trivial harm (Is it mere discomfort? A minor rights infringement? A risk?), context (medical, social, personal), distribution (same person repeatedly vs. many people once), and inherent qualitative differences perceived as morally relevant.

  **Distinguishing from Ordinary Cost-Benefit Analysis (CBA)**

  *   **Ordinary CBA:** Assumes commensurability. The debate is usually about *quantifying* the individual harms/benefits accurately (e.g., assigning dollar values, QALYs), assessing probabilities, or arguing about the relevant population size. The *principle* of summation is accepted.
  *   **ATTD:** The debate is **meta-ethical**. It questions the *validity* or *moral permissibility* of the summation *itself* for these specific types of goods/harms. It asks: "Is this *kind* of minor harm even the sort of thing that *can* be summed against this *kind* of major harm, regardless of the numbers?" The arithmetic feels like a category error to one side.

  **Is it a Fallacy, Paradox, or Clash of Views?**

  *   **Not Strictly a Fallacy:** Neither position is inherently illogical. Both stem from coherent, though conflicting, moral frameworks (deontology vs. utilitarianism, or variations thereof). The "arithmetic move" *can* feel like bullying with numbers ("surely you must agree now!"), but it's presenting a logical implication of the aggregationist view, not a formal fallacy.
  *   **Related to Paradoxes:** It shares DNA with:
      *   **The Sorites Paradox (Heap Paradox):** At what point does adding one grain of sand turn a non-heap into a heap? Similarly, when does adding one more minor harm make the aggregate outweigh the major one? The boundary is vague.
      *   **Mere Addition Paradox (Parfit):** Adding people with lives barely worth living seems harmless individually, but can lead to a world with lower average utility, questioning aggregation rules.
  *   **Primarily a Clash of Defensible Moral Views:** The core of ATTD is a fundamental disagreement about the nature of value, moral duties, and commensurability. Is morality primarily about maximizing total good/minimizing total harm (aggregationist)? Or are there strict constraints, thresholds, or incommensurable values that limit aggregation (non-aggregationist)?
  *   **Underspecification?** Sometimes, yes. Failing to explicitly define the nature and weight of the harms can fuel the disagreement. However, your examples show parties *agreeing* on these specifics and *still* disagreeing on principle.

  **A Case of Genuine Ambiguity: The Measles Vaccine**

  *   **Scenario:** Vaccinating a population against measles.
  *   **Major Harm Avoided (Few Instances):** Death or permanent severe disability (like SSPE) from measles infection. Let's say vaccinating prevents 10 such catastrophic outcomes.
  *   **Minor Harm Caused (Many Instances):** Mild, transient side effects like fever, rash, or soreness at the injection site. Suppose vaccinating causes 1,000,000 instances of this minor discomfort.
  *   **The ATTD Ambiguity:**
      *   **Non-Aggregationist Leaning:** "No amount of temporary fever and fussiness in children can morally justify *choosing* a policy that we *know* will lead to even one child dying or being permanently disabled, when that death/disability is a direct consequence of *not* vaccinating. The minor harms are the wrong currency to trade against death."
      *   **Aggregationist Leaning:** "The total suffering prevented by avoiding a million instances of fever and discomfort (even if minor individually), plus the immense social benefit of herd immunity preventing widespread illness, clearly outweighs the tiny risk of a catastrophic outcome. The arithmetic of total well-being dictates vaccination."
      *   **Threshold View Struggle:** Where *is* the line? Is preventing a million minor fevers worth accepting one rare death? Ten? A hundred? A thousand? The qualitative leap between "fever" and "death" makes the aggregation feel intuitively wrong to many, even if logically compelling to others. The massive numbers make the minor harms *feel* significant in aggregate, yet the catastrophic harm retains its distinct moral gravity. **This is the core ambiguity of the ATTD:** Is the mountain of minor harms *equivalent* to the boulder of the major harm, or just a different *kind* of mountain?

  **In Summary:**

  You're grappling with the **Aggregation Problem**, specifically the **Aggregate Triviality Threshold Dispute (ATTD)**. It's the point where shared facts and agreed-upon valuations of individual harms lead to an *irreducible* disagreement about the fundamental moral mathematics: **Does a sufficiently large pile of trivial harms *transform* into something weighty enough to balance a single catastrophic harm, or does it merely remain a large pile of trivialities that exist in a different moral category?** It's a deep fault line in ethics, exposing tensions between consequentialist calculation and deontological constraints, amplified by the limitations of human intuition when faced with vast numbers and profound qualitative differences. The measles vaccine case perfectly illustrates the unsettling ambiguity at its heart.
