prompt: |-
  For a graduate seminar I am assembling on the philosophy of church–state relations, I need a structured reconstruction of the commitments that lie buried in a fiscal institution rather than in anyone's professed doctrine. The point is to read a practice the way one reads a text: to recover the theory it would have to hold in order to make sense of itself, and to separate what it genuinely requires from what it merely happens to fit.

  Take the German church tax (Kirchensteuer). The tax offices of the Länder collect it on behalf of certain religious bodies. A person registered as a member of a levying body — typically a Protestant regional church, the Roman Catholic Church, or a Jewish community — pays a surcharge of eight or nine per cent of their assessed income tax, withheld by the employer and confirmed at the annual assessment. The taxpayer's affiliation is stored in a database maintained by the federal tax administration, and employers receive extracts of it for withholding purposes. Membership is not something the community adjudicates: one becomes liable by being recorded as a member, and one ends liability by making a formal declaration to a civil authority, after which some communities still decline weddings and funerals to the declarant. Only bodies recognised as corporations under public law may levy the tax, and several communities that hold that status decline to use it. The levy furnishes the large majority of church revenue, and the income on which it is paid is not itself subject to state income tax.

  To bring the presuppositions into relief, compare two alternatives, which I describe rather than name. In the first, a fixed fraction of everyone's income tax is directed, at the taxpayer's election, to a religious body, or to the state for social purposes, or to nothing in particular, and the election has no bearing on anyone's membership in anything. In the second, a levy is collected from those registered either with a religious community or with a secular humanist association, on equal terms.

  Reconstruct the implicit theory of the first arrangement. Set out what view of religious belonging, of state neutrality, of consent and exit, and of what makes a body eligible for this treatment the practice commits itself to; say which of those commitments it strictly presupposes and which it merely accommodates, so that a rival theory would license the practice just as well; identify the philosophical positions it rules out and the ones it leaves open; flag any places where its parts presuppose inconsistent things; and, for each commitment you isolate, say what would have to change in the institution if that commitment were replaced. The contrasting models are there to help you locate exactly what is load-bearing, so use them to show which feature of the German arrangement carries which commitment.

  Return your answer as a single JSON object with exactly the following keys, and no others:

  - "practice_summary": a one-sentence description of the practice under analysis.
  - "presuppositions": an array of objects, each with "concept" (the concept the commitment concerns, e.g. religious belonging, state neutrality, consent), "commitment" (the view the practice commits to, stated as a proposition), "status" (one of "strictly presupposed", "merely fits", or "underdetermined"), and "justification" (why the practice requires, merely fits, or leaves open that view).
  - "ruled_out_rivals": an array of objects, each with "position" (a rival view the practice excludes) and "why_incompatible" (the feature of the practice that excludes it).
  - "compatible_rivals": an array of strings, each naming a rival view with which the practice is nonetheless consistent.
  - "internal_tensions": an array of objects, each with "tension" (the two features that pull apart) and "assessment" (whether the tension is resolvable, and how).
  - "foil_comparison": an array of two objects, one per contrasting model, each with "foil" (a short label for that model) and "what_it_isolates" (the commitment it exposes by omitting it).
  - "replacement_effects": an array of objects, each with "commitment_replaced" (a commitment from your list) and "resulting_changes" (an array of strings describing what the institution would have to alter if that commitment gave way).

  Keep the philosophical vocabulary explicit and the reasoning tied to features of the practice; I want the reconstruction to be defensible point by point, not a general impression.
reasoning: |-
  We are analyzing the German church tax (Kirchensteuer) practice to uncover its implicit theoretical commitments.
   The key features of the practice are:
    1. Collected by state tax offices on behalf of certain religious bodies.
    2. Applies to persons registered as members of a levying body (Protestant, Catholic, Jewish, etc.).
    3. Surcharge of 8-9% of assessed income tax, withheld by employer.
    4. Taxpayer affiliation stored in a state-maintained database, used for withholding.
    5. Membership is a matter of civil record: liability begins by being recorded and ends by formal declaration to a civil authority (though religious communities may still deny some services).
    6. Only bodies recognized as corporations under public law (Körperschaften des öffentlichen Rechts) may levy the tax, and some that have that status choose not to use it.
    7. The levy is the majority of church revenue and the income on which it is paid is not subject to state income tax (i.e., the church tax is deductible for income tax purposes? Note: the description says "the income on which it is paid is not itself subject to state income tax" — this is ambiguous. Actually, the church tax is paid as a percentage of the income tax due, so the base income is subject to income tax, but the church tax itself is then calculated on that income tax amount. Moreover, the church tax is deductible for income tax purposes in Germany, meaning that the base for income tax is reduced by the amount of church tax paid. However, the exact mechanism is not critical for the philosophical analysis.)

   We are to reconstruct the implicit theory by comparing with two foils:
    Foil 1: A fixed fraction of everyone's income tax is directed, at the taxpayer's election, to a religious body, or to the state for social purposes, or to nothing in particular, and the election has no bearing on membership.
    Foil 2: A levy collected from those registered either with a religious community or with a secular humanist association, on equal terms.

   We are to set out the commitments regarding:
    - religious belonging
    - state neutrality
    - consent and exit
    - what makes a body eligible

   We must classify each commitment as "strictly presupposed", "merely fits", or "underdetermined".

   We must also:
    - identify positions ruled out and why
    - identify compatible rivals (views that are consistent with the practice)
    - flag internal tensions and assess whether resolvable
    - use the foils to isolate which feature carries which commitment
    - for each commitment, describe what would change if replaced

   We return a JSON object with the specified keys.

   Steps:

   1. Practice summary: one sentence.

   2. Presuppositions: array of objects with:
        concept: e.g., "religious belonging"
        commitment: a proposition
        status: one of the three
        justification: why that status

   3. Ruled out rivals: array of objects with:
        position: a rival view
        why_incompatible: the feature that excludes it

   4. Compatible rivals: array of strings (names of views)

   5. Internal tensions: array of objects with:
        tension: two features that pull apart
        assessment: resolvable? and how?

   6. Foil comparison: array of two objects, each with:
        foil: short label (e.g., "Foil 1: Elective Allocation")
        what_it_isolates: the commitment exposed by omitting it

   7. Replacement effects: array of objects with:
        commitment_replaced: from the list of commitments we identified
        resulting_changes: array of strings describing what would change

   We must be precise and tie every point to features of the practice.

   Let's outline the commitments:

   A. Religious belonging:
      - The practice treats religious belonging as a matter of civil record (stored in a state database) and not as a matter of internal religious conviction or community recognition. 
      - Commitment: Religious affiliation is a formal, state-mediated status, independent of the community's ongoing recognition and of the individual's current beliefs or practices.
      - Status: strictly presupposed. Because the tax liability is triggered solely by the state record, and the religious community has no say in who is a member for tax purposes.

   B. State neutrality:
      - The state collects the tax only for certain religious bodies (those with public law corporation status) and not for others. Also, it does not collect for non-religious groups (unless they have that status and choose to levy, but in practice we have Jewish communities and some others, but not secular humanist groups unless they get the status).
      - Commitment: The state may recognize and support (through tax collection) only certain religions that meet a public-law status, and this support is not extended to non-religious groups. This implies a non-neutrality in the sense of privileging some religions over others and religion over non-religion.
      - However, note that the state does not interfere in the internal affairs of these groups (e.g., the tax is collected and passed on without state control over use). Also, the state does not require all groups to use the system (some with the status decline). 
      - Status: strictly presupposed? But note: the state is acting as a service provider for these religious bodies. The justification for the status might be that the state is accommodating religion by facilitating the collection of dues, but only for groups that have achieved a certain level of organization and public standing. 
      - Alternatively, we might say it presupposes that the state is not neutral between religions (only some are eligible) and not neutral between religion and non-religion (unless a non-religious group gets the status and levies, but in practice they don't). However, note that the foil 2 includes secular humanist associations. So the German practice does not extend to them. 
      - Therefore, the commitment is that state neutrality does not require equal treatment of all religious and non-religious groups, but rather permits the state to establish a special category for certain "corporations under public law" (which are typically historical religious communities) and to provide them with a service that is not available to others.

   C. Consent and exit:
      - Consent: The initial membership is typically by baptism or similar, and then recorded by the state. The practice does not require ongoing consent for the tax (it's automatic unless you exit). 
      - Exit: Requires a formal declaration to a civil authority (not to the religious community). However, the religious community may still impose consequences (denial of services). 
      - Commitment: Consent to the financial obligation is implied by the failure to formally exit, and exit is a civil act that severs the financial obligation but may not be recognized by the religious community as ending membership. 
      - The state does not require the religious community to recognize the exit as terminating religious membership (only the financial obligation). 
      - Status: strictly presupposed? The practice requires that the financial obligation is tied to the state record and can be ended by a civil act, regardless of the religious community's view.

   D. Eligibility:
      - Only bodies recognized as corporations under public law may levy the tax. This status is granted by the state and requires certain conditions (e.g., stability, size, loyalty to the constitutional order). 
      - Commitment: The state may condition the benefit of tax collection on a group having a certain public-law status, which in turn reflects a judgment about the group's permanence, size, and social integration.
      - Status: strictly presupposed? Because without that status, a group cannot use the system.

   Let's now consider the foils:

   Foil 1 (Elective Allocation without membership effect):
     - What it isolates: 
          - In the German system, the tax is tied to membership (as recorded by the state) and not to an annual election. The foil 1 breaks the link between the tax and membership. So the German system presupposes that the tax is a membership obligation, not a voluntary donation. 
          - Also, the German system does not allow directing the money to non-religious purposes (except by exiting and then not paying). The foil 1 allows that. So the German system presupposes that the tax is exclusively for religious bodies and not for secular purposes.

   Foil 2 (Inclusion of secular humanist associations on equal terms):
     - What it isolates: 
          - The German practice does not include secular humanist groups (unless they get the public law status and choose to levy, which is rare). The foil 2 would treat them equally. So the German practice presupposes that the state may limit the tax collection service to religious bodies (or at least primarily to them, since the public law status is historically for religious groups) and not extend it to non-religious life stance organizations.

   Now, for the JSON structure:

   We'll list the presuppositions in the array. Let's define:

   1. Concept: "Religious belonging"
      Commitment: Religious affiliation is a formal civil status, independent of the religious community's internal recognition and the individual's current beliefs or practices.
      Status: strictly presupposed
      Justification: The tax liability is determined solely by an entry in a state database, and the religious community has no role in adjudicating membership for tax purposes.

   2. Concept: "State neutrality"
      Commitment: The state may provide differential support to religious communities that have achieved a specific public-law status, without extending similar support to non-religious groups or to religious groups without that status, and this does not violate neutrality.
      Status: strictly presupposed
      Justification: The state collects the tax only for eligible religious bodies (those with Körperschaft status) and not for others, including non-religious groups, thereby creating a privileged category.

   3. Concept: "Consent and exit"
      Commitment: Ongoing financial obligation to one's religious community is based on tacit consent through the failure to execute a formal civil exit, and exit is a civil act that terminates the financial obligation but may not be recognized by the religious community as terminating membership.
      Status: strictly presupposed
      Justification: Liability begins by being recorded and ends by a declaration to a civil authority, without requiring the community's consent, but the community may still deny religious services.

   4. Concept: "Eligibility"
      Commitment: The state may condition the benefit of tax collection on a group having the status of a corporation under public law, which requires meeting criteria of permanence, size, and social integration.
      Status: strictly presupposed
      Justification: Only groups with that status may levy the tax, and the state determines eligibility.

   However, note: the practice also allows that some groups with the status decline to use the tax. So the state does not force the tax on them. This is accommodated but not strictly required.

   But the commitment about eligibility is about the condition for being allowed to levy, not about the obligation to levy.

   Ruled out rivals:

     - A view that religious belonging must be determined solely by the religious community: because in the practice, the state record determines tax membership, and the community has no say.
     - A strict separationist view of church and state that forbids any state involvement in collecting religious dues: because the state is actively collecting the tax.
     - A view that state neutrality requires equal treatment of all religious and non-religious groups: because the system privileges only certain religious groups and does not include non-religious groups.

   Compatible rivals:

     - The view that the state may accommodate religion without endorsing it (the state is just facilitating the collection of dues as a service).
     - The view that historical churches deserve special recognition because of their cultural role.

   Internal tensions:

     - Tension 1: Between the civil determination of membership (for tax purposes) and the religious community's own concept of membership. The religious community may still consider someone a member even after civil exit, and deny services accordingly. This tension is inherent and resolvable only by the community adjusting its own practices or by state intervention (which the state avoids). But the practice allows this tension to persist.

     - Tension 2: The state's role in defining eligibility (via public law status) and the principle of state neutrality. By setting criteria, the state is making judgments about which religions are worthy of support. This tension is inherent in the system and might be resolved by having very objective criteria (like size and duration) but still involves state judgment.

     We might say:

     Tension: Between the state's role in defining religious membership for fiscal purposes and the religious communities' autonomy in defining their own membership.
     Assessment: Resolvable only by the state relinquishing the role (which it doesn't) or the religious communities accepting the state's definition (which they don't always do). Therefore, the tension is inherent and not fully resolved.

     Another tension: Between the state's claim to neutrality and the privileging of certain religious groups. The system claims neutrality by providing a service without favoring any particular doctrine, but by limiting the service to groups with public law status, it favors established religions. This tension is not resolved and is a point of criticism.

   Foil comparison:

     Foil 1: "Elective Allocation"
        What it isolates: The German practice presupposes that the financial obligation is an incident of formal membership (not a voluntary annual choice) and that the state should not use the mechanism to fund non-religious social purposes.

     Foil 2: "Inclusive Levy"
        What it isolates: The German practice presupposes that the state may limit the tax collection service to religious communities (and not extend it to non-religious organizations) and that religious communities are distinct from non-religious life-stance organizations in ways that justify differential treatment.

   Replacement effects:

     For each commitment we listed (religious belonging, state neutrality, consent and exit, eligibility), we describe what would change if that commitment were replaced.

     Example for religious belonging:
        If we replaced the commitment that religious belonging is a civil status with one that it is determined by the community, then the practice would have to change: the state would not maintain the database; instead, the religious community would have to certify membership to the state for each taxpayer.

     For state neutrality:
        If replaced by a commitment that the state must be neutral by treating all religions and non-religions equally, then the practice would have to extend the tax collection service to any group that meets objective criteria (like having a certain number of members) including secular groups, or else stop collecting for everyone.

     For consent and exit:
        If replaced by a commitment that exit must be recognized by the religious community, then the state would require the community's approval for exit to be effective for tax purposes.

     For eligibility:
        If replaced by a commitment that any group should be eligible regardless of public law status, then the state would have to allow any religious group to use the tax collection system.

   Now, we write the JSON accordingly.

   Note: The instructions require a single JSON object. We must be precise and avoid extra keys.

   Let's code the JSON structure.
