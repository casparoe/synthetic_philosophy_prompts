  We are building a decision tree for the paradox of fiction, starting from the root: 
   "A reader is genuinely distressed by the death of a character she knows never existed."

   The paradox arises because of three common-sense commitments:
   1. We are actually moved (genuine emotion).
   2. Emotion toward an object requires believing that object exists.
   3. We do not believe that fictional characters exist.

   The top-level split is over which of these three commitments the reader is willing to abandon.

   Therefore, the first level of the tree is:

   Step 1: Which of the three commitments do you abandon?
    A. Abandon the idea that we are actually moved (i.e., the emotion is not genuine).
    B. Abandon the idea that emotion requires belief in the existence of the object.
    C. Abandon the idea that we do not believe in fictional characters (i.e., we do believe, in some sense).

   Now, we branch on each of these.

   Branch A: The emotion is not genuine.
    Then we must explain what is happening if it's not genuine emotion.

    Step A1: How do you characterize the emotional response?
      Option 1: It is a pretend emotion (we are merely simulating or playing along).
      Option 2: It is a different kind of state, such as a quasi-emotion (a real but non-cognitive state).

    This gives two leaves:

    Leaf A1-1: Make-believe account (e.g., Walton).
        Annotation: The emotion is not genuine; it is part of a game of make-believe. 
        Most awkward commitment: We must accept that our tears are not real tears, even though they feel the same.

    Leaf A1-2: Quasi-emotion account (a real affective state but without the typical cognitive components).
        Annotation: The emotion is a real physiological response but lacks the belief-based component of genuine emotions. 
        Most awkward commitment: It is unclear why quasi-emotions feel so much like the real thing and can motivate us similarly.

   Branch B: Abandon the existence requirement for emotion.
    Then we must explain what the object of the emotion is and why it can be an object of emotion without existence.

    Step B1: What is the object of the emotion?
      Option 1: The object is a thought or proposition (e.g., the thought of the character's death).
      Option 2: The object is the fiction itself (the work of art) or the author's act of creation.
      Option 3: The object is a real-world theme or situation that the fiction represents.

    Now, we need to break down option 1 and option 2/3 because they lead to different positions.

    For Option 1 (thought or proposition):

      Step B1-1: How can a thought or proposition be the object of a genuine emotion?
          Option a: Because emotions can be directed at non-existing objects via our thoughts (thought theory).
          Option b: Because we are simulating an emotion in a safe context (simulation theory).

      This leads to:

          Leaf B1-1a: Thought theory (e.g., Currie, Matravers).
              Annotation: Emotions can be directed at thoughts or propositions, which do not require the existence of the object.
              Most awkward commitment: It is hard to explain why we don't have the same emotional responses to merely thinking about the same events without the fiction.

          Leaf B1-1b: Simulation or offline-emotion account.
              Annotation: Our emotional systems are running 'offline' in response to simulated scenarios.
              Most awkward commitment: It blurs the line between genuine and simulated emotions.

    For Option 2 (the fiction itself) and Option 3 (real-world theme):

      Step B1-2: Is the emotion directed at the fiction (the work) or at the real world?
          Option 2: The emotion is directed at the fiction as an artifact (e.g., admiration for the author's skill, horror at the story's content).
          Option 3: The emotion is directed at the real-world counterparts (e.g., the death of real people like the character).

      This leads to:

          Leaf B1-2: Object-shift: Fiction as object (e.g., Feagin).
              Annotation: We feel genuine emotions about the fictional work itself (e.g., horror at the story).
              Most awkward commitment: It doesn't capture the sense that we are moved by the character's plight, not by the story as an object.

          Leaf B1-3: Object-shift: Real-world theme (e.g., some versions of moral criticism).
              Annotation: The fiction discloses a real-world theme (e.g., the tragedy of death) and we feel emotion about that.
              Most awkward commitment: The emotional response is often specific to the character and not to the general theme.

   Branch C: Abandon the belief that we do not believe in fictional characters (i.e., we do believe, in some sense).
    Then we must explain what kind of belief we have and how it is consistent with our knowledge of non-existence.

    Step C1: How do you characterize the belief state?
      Option 1: We temporarily and inconsistently believe in the character (illusion theory).
      Option 2: We half-believe (a state between belief and disbelief).
      Option 3: We are merely pretending to believe (but then how do we get genuine emotion? This might be inconsistent so we avoid it here and put it in branch A).

    However, note that in branch C we are keeping the genuine emotion and the existence requirement, so we must have some kind of belief in existence.

    But Step C1: How does this belief coexist with our knowledge that the character is fictional?
      Option 1: We are inconsistent: we both believe and disbelieve at the same time.
      Option 2: We have a different kind of belief (e.g., "imaginative belief" or "make-belief") that is not full belief.

