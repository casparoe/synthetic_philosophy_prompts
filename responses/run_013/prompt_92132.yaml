  The user also flags an important nuance: experimental work separating ambiguity aversion from source distrust. This suggests they suspect normative debates might be conflating distinct psychological phenomena. For instance, rejecting a bet due to suspicion of manipulation (source distrust) vs. rejecting it due to genuine uncertainty (ambiguity aversion) could demand different normative evaluations. 

  What's unspoken but implied? The user might be wrestling with meta-philosophy—how do we resolve foundational disputes when axioms clash? Their request for "what could actually move things" reveals a desire for progress, not just analysis. They're likely tired of circular debates and want pathways forward, whether through empirical disambiguation or conceptual innovation. 

  The challenge is validating their hypothesis while pushing further. Yes, credence definitions matter, but perhaps more as symptoms than causes. The deeper rift might be about the purpose of rationality itself: is it about avoiding dynamic inconsistency (Bayesianism) or robustly managing ignorance (ambiguity models)? Experiments distinguishing ambiguity types could pressure this rift—if people consistently treat "unknown proportion" differently from "suspect experimenter," normativists must justify why one aversion is defensible while the other isn't. 

  The reductive move (second-order probabilities) is indeed a band-aid. It preserves Bayesian machinery but risks obscuring the phenomenology of uncertainty. If people don't naturally access meta-probabilities, forcing them into that framework might be descriptively inadequate and normatively question-begging. 

