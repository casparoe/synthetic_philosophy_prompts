answer: |-
  Below is a practical **Diagnostic Decision Procedure for Trust Structures (DDP-TS)** designed for program officers with no specialized training, executable in ~60 minutes using only the application, one phone call, and public sources. It prioritizes clear red flags and minimizes ambiguity.

  ---

  ### **DDP-TS Procedure (60-Minute Workflow)**  
  *Goals*: Diagnose whether the group suffers from **Simple Lack of Exposure (SLE)** or **Pathogenic Trust Structure (PTS)**. Reject PTS-focused exposure interventions. Flag warranted distrust.  

  #### **Step 1: Check for Epistemic Closure (15 mins)**  
  **Ask Applicant**: *"How does the group react when presented with information contradicting their views? Give specific examples."*  
  **Check Public Sources**: Review the group’s public forums/social media for:  
  - Evidence of "blame attribution" (e.g., "They lie because they’re paid by Pharma").  
  - Systematic rejection of mainstream sources (e.g., "All CDC data is manipulated").  
  **Settle Question**:  
  - **SLE Indicators**: Curiosity, uncertainty ("We haven’t heard that side"), no consistent blame pattern.  
  - **PTS Indicator**: Contradictory evidence strengthens belief ("See? They’re pushing agendas!").  
  **Stop & Reject If**: Clear PTS evidence found (exposure worsens distrust).  
  **Judgment Call**: Distinguishing skepticism from systemic rejection.  

  #### **Step 2: Assess Trust Architecture (20 mins)**  
  **Ask Applicant**: *"Who defines ‘trusted’ sources for the group? Is there a leader/list/enemy narrative?"*  
  **Check Public Sources**: Search for:  
  - Centralized authority figures (e.g., influencers, gurus).  
  - Explicit trust/distrust lists (e.g., "Approved doctors," "Banned media").  
  - Persecution narratives ("They’re silencing us").  
  **Settle Question**:  
  - **SLE**: No centralized trust gatekeepers; sources limited by access, not ideology.  
  - **PTS**: Trust is curated (e.g., leader’s list), outsiders are "corrupt" or "traitors."  
  **Stop & Reject If**: Centralized trust architecture confirmed (exposure futile).  

  #### **Step 3: Evaluate Defector Treatment (15 mins)**  
  **Ask Applicant**: *"What happens if someone in the group engages with outside sources or changes views?"*  
  **Check Public Sources**: Look for:  
  - Shaming of defectors (e.g., "She sold out").  
  - Purging of dissent (e.g., banned members).  
  **Settle Question**:  
  - **SLE**: Mild skepticism, no punishment.  
  - **PTS**: Defectors are "traitors"; social/financial penalties.  
  **Stop & Reject If**: Defector punishment confirmed (intervention risks harm).  

  #### **Step 4: Distinguish Warranted vs. Manufactured Distrust (10 mins)**  
  **Ask Applicant**: *"What specific events/experiences caused the group’s distrust?"*  
  **Check Public Sources**: Verify:  
  - Historical harms (e.g., verified medical abuse, documented corruption).  
  - Context (e.g., marginalized group with valid institutional betrayal).  
  **Settle Question**:  
  - **Warranted Distrust**: Evidence-based, specific institutional failures (e.g., "Hospital X hid pollution data").  
  - **Manufactured Distrust**: Vague claims ("All medicine is profit-driven") with no proof.  
  **Hand to Human If**: Ambiguous (e.g., mixed evidence of harm).  
  **Critical Note**: **Never fund "repaired credibility" for institutions**. If distrust is warranted, shift intervention to:  
  > *"Facilitated dialogue on institutional reform"* (e.g., community hearings with accountable officials).  

  #### **Outputs**  
  - **SLE**: Fund exposure intervention (e.g., moderated forums, diverse media access).  
  - **PTS**: Reject exposure; propose *alternatives* (e.g., exit support, internal dialogue training).  
  - **Warranted Distrust**: Fund *accountability-focused* engagement, not persuasion.  

  ---

  ### **Application to Test Cases**  
  *Each requests $40k for exposure interventions; trustees require sign-off.*  

  #### **Case 1: Rural Vaccine-Hesitant Congregation**  
  - **Step 1**: No adversarial framing in app/public posts; curiosity about "other side" noted. → *SLE indicator*.  
  - **Step 2**: No leaders/gatekeepers; sources limited by broadband access. → *SLE indicator*.  
  - **Step 3**: No defector shaming; polite disagreements. → *SLE indicator*.  
  - **Step 4**: Distrust rooted in access gaps, not harm. → *Manufactured? N/A*.  
  **Diagnosis**: **SLE** (lack of exposure).  
  **Recommendation**: **Fund exposure intervention** (e.g., mobile health clinics with non-judgmental Q&A). Trustees need sign-off for $40k.  

  #### **Case 2: Ex-Wellness Group Network**  
  - **Step 1**: App states ex-members dismiss mainstream medicine as "corrupt." Public posts show evidence absorption ("My doctor prescribed pills—big Pharma wins!"). → *PTS indicator*.  
  - **Step 2**: App admits "traitor" label for reconcilers; public forums list "sellout" members. → *PTS indicator*.  
  - **Step 3**: Defectors described as "brainwashed" or "paid." → *PTS indicator*.  
  - **Step 4**: Distrust based on wellness group’s teachings (no cited medical harm). → *Manufactured distrust*.  
  **Diagnosis**: **PTS** (pathogenic trust structure).  
  **Recommendation**: **Reject exposure intervention** (risk: entrenchment). Propose alternative: *"Peer-support groups for identity rebuilding"* ($25k; no trustee sign-off needed).  

  #### **Case 3: Parents Following Charismatic Online Figure**  
  - **Step 1**: App notes critics are "stupid or bought." Public list bans major journals/doctors. → *PTS indicator*.  
  - **Step 2**: Leader’s trust list is binding; app describes "cleansing" of doubters. → *PTS indicator*.  
  - **Step 3**: Defectors "exposed" as traitors in forums. → *PTS indicator*.  
  - **Step 4**: Distrust tied to leader’s narrative (no evidence of harm). → *Manufactured distrust*.  
  **Diagnosis**: **PTS** (pathogenic trust structure).  
  **Recommendation**: **Reject exposure intervention** (high harm risk). Propose: *"Expert-led exit counseling"* for those seeking help.  

  ---

  ### **Handling Warranted Distrust**  
  **Can DDP-TS distinguish manufactured vs. warranted distrust?**  
  **Yes, but with limits**:  
  - Step 4 explicitly tests for *evidence-based institutional harm* (e.g., "Hospital X falsified records in 2022") vs. *vague, unverified claims* ("All hospitals kill patients").  
  - Public records (news, lawsuits) can often verify harms within 10 mins.  
  **When Evidence is Ambiguous**:  
  - **Do not guess**. Escalate to a human with this directive:  
    > *"If distrust is possibly warranted, never fund ‘credibility repair’ for institutions. Instead, fund projects that:  
    > (a) Address specific harms (e.g., community-led oversight panels),  
    > (b) Center the group’s agency (e.g., ‘What would restore trust?’ dialogues)."*  

  **Procedure Limits**:  
  - Cannot access private communications; relies on public/published data.  
  - Cannot resolve deeply ambiguous distrust (human judgment needed).  
  - "Judgment calls" flagged in Steps 1 and 4 (e.g., interpreting blame patterns).  

  This ensures your foundation avoids entrenching distrust while redirecting funds to context-appropriate solutions. For the test cases, only Case 1 clear-fits traditional exposure; Cases 2–3 require harm-avoidance pivots.
