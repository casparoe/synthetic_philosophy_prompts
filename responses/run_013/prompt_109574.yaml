  For each point, I'll note what's generally accepted versus debated among scholars. For example, the persistence of the left-right divide is well-documented, but its exact nature remains contested. The functionalist versus conflict theory foundation is established in political theory, though its primacy faces challenges from institutionalist and culturalist approaches. Coalition dynamics and policy reversals are observable patterns, but explanations vary.

  I'll maintain British English throughout - using "behaviour" instead of "behavior," "organisation" instead of "organization," etc. The arguments will be tight and evidence-based while respecting the user's request to avoid presenting contested ideas as consensus. This approach should give them a robust foundation for their essay while acknowledging where scholarly debate exists.
answer: |-
  Here are five numbered points arguing for your claim, distinguishing settled understandings from contested aspects:

  1.  **The left-right distinction demonstrably persists across diverse historical contexts and policy realignments, indicating an underlying continuity deeper than specific issue positions, which is a broadly settled observation in political science.** What *precisely* constitutes this underlying continuity, however, remains actively contested, with explanations ranging from economic interests to cultural values to the core explanatory asymmetry you propose.

  2.  **The fundamental asymmetry you identify – attributing persistent social arrangements either to active maintenance by vested interests (left default) or to functional necessity serving social cohesion/stability (right default) – aligns with deep-rooted traditions in social thought (conflict theory vs. functionalism/evolutionary conservatism), making it a plausible foundational driver.** While the *existence* of these distinct explanatory traditions is settled, their relative *primacy* over other factors (like institutional inertia or shared cultural narratives) in holding modern political coalitions together is debated.

  3.  **This core explanatory asymmetry directly shapes coalition formation, allowing disparate groups with conflicting material interests (e.g., urban professionals and industrial workers on the left, business elites and social conservatives on the right) to unite around a shared diagnostic lens for societal problems, despite lacking a fully coherent policy programme.** The *observation* that coalitions form across class lines is settled; the argument that this *specific* asymmetry is the primary glue, rather than overlapping identities, negative partisanship, or leadership, is a contested interpretation.

  4.  **Apparent reversals on specific issues (e.g., trade, state power, civil liberties) become coherent when viewed through this lens: each side consistently applies its default explanatory framework to the *newly dominant perceived hierarchy or threat* (e.g., global capital vs. national tradition, state overreach vs. social disintegration), not to the issue category itself.** That parties adapt positions strategically is uncontroversial; the claim that this adaptation is *principally driven* by the application of their fixed explanatory asymmetry to shifting contexts, explaining the consistency *behind* the reversal, is a distinctive and contested reading.

  5.  **Consequently, while issue positions are volatile and often contradictory within each camp over time, the underlying impulse – to challenge arrangements seen as artificially sustained (left) or to defend arrangements seen as organically functional (right) – exhibits remarkable stability, providing a more durable anchor for the distinction than policy platforms which are demonstrably downstream of this foundational outlook.** The greater stability of broad ideological *orientations* compared to specific policies is widely accepted; positioning this *specific* explanatory asymmetry as that stable core, superseding other proposed cores like egalitarianism-hierarchy or openness-conservation, represents a specific and contestable theoretical claim.
