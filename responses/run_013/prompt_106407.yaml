  In-principle vs engineering: Here I see a distinction. The user's claim is about fundamental impossibility, not practical limits. Engineering might make things work "well enough" in practice, but the claim is about strict neutrality. I put high weight (0.9) on this being in-principle.

  Second-order preferences: Nice try, but this just moves the problem up one level. Now you have to aggregate second-order preferences, facing the same dilemmas. Might reduce severity somewhat, but doesn't escape. Probability 0.8 it doesn't resolve.

