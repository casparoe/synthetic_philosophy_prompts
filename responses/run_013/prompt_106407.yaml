prompt: |-
  Me and a friend have been going back and forth on whether an aligned AI could ever really be neutral between competing ways of life, and I want your credence on a fairly precise version of the claim. Here it is: "For any pluralistic public whose members hold genuinely conflicting values, every procedure that turns those values into a single objective for a powerful AI either (a) is equivalent to letting some proper subset decide — one person, one faction, one metric, one tradition — or (b) fails to determine the AI's behavior at all, because it's underdetermined or incoherent." I lean maybe 0.75 that that's true; she's around 0.3. Give me your own number, but mostly I want the decomposition: assign a rough probability to each sub-question and show how they combine. How much rides on whether classic social-choice impossibility results still bite once you let the AI be corrigible, or defer to a live political process, rather than fixing a single objective up front? How much on whether "neutrality" is even a coherent demand as opposed to a substantive value wearing a costume? How much on whether the impossibility is in-principle or just an engineering limitation? And one term I keep flip-flopping on: suppose you build the AI to maximize the value of people's second-order preferences about how their first-order preferences should be aggregated — does that actually dodge the dilemma, or just relocate it one level up, and how much does your overall number move either way? Then tell me which single sub-question your final number is most sensitive to, and what arguement or evidence would shift it the most.
