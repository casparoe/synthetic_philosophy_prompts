prompt: |-
  I'm a philosophy prof, and I keep getting cornered by a slogan. Last week in a faculty meeting about whether our city should override its own housing expert commission, a colleague said that the will of the people is clearly on our side, so the commission's recommendation can be ignored. I've heard the same move in op-eds about courts, referendums, and recall elections. I want to know what that slogan could actually be claiming, not just that populism is vague.

  You're a political philosopher who works on democratic theory and populism. Before you answer, brainstorm the distinct possible readings of the will of the people, then lay them out for me as a menu I can bring to the next meeting. For each reading, give me: (1) the precise claim it makes -- what the people is supposed to be (an aggregate, a collective agent, a hypothetical subject, a set of institutions, a constituent power that can dissolve institutions, an audience), what a will is supposed to be (actual preference, deliberated judgment, common good, authorization, identity), and what follows from it; (2) whether it's trivial, substantive but defensible, or false; (3) whether it would actually license my colleague's conclusion that the expert commission can be ignored; and (4) what kind of argument someone would need to make to get from that reading to a policy conclusion. Include the boring procedural readings as well as the metaphysically ambitious ones, and don't stop at the usual contrast between liberal democracy and populism.

  I especially want the readings seperated along these lines: is the slogan about who has authority to decide, about what the right decision is, about who counts as the people, or about what the people would want under better conditions? Is it a descriptive claim about majority opinion, a normative claim about the common good, a constitutive claim about a group agent, or just a rhetorical way of saying I don't like the commission? And which reading, if any, makes the slogan do real work rather than just restating that the speaker's side should win?

  Be careful to distinguish what's settled from what's genuinely contested among people who know this literature; don't present one camp's interpretation as the consensus. No bibliography, no citations, no reading list -- I want the conceptual map, not names and dates. If some readings are just restatements of each other, say so. If a reading is incoherent or does no argumentative work, say that too, definately. Finish by telling me which reading my colleague most likely meant, and whether that reading actually gets him his conclusion.
reasoning: |-
  Okay, let me approach this systematically. The philosophy professor wants a conceptual breakdown of "the will of the people" to counter populist sloganeering in faculty debates. They need clear categories showing how each interpretation does or doesn't justify overriding expert commissions.

  First, I consider the core ambiguities: "people" could mean majority voters, an idealized collective, or marginalized groups; "will" could mean raw preferences, deliberated judgments, or abstract sovereignty. Each combination creates distinct claims with different implications. 

  I'll structure this by separating four fundamental questions in democratic theory: (1) Who decides? (authority question) (2) What should be decided? (substantive question) (3) Who counts as "the people"? (boundary question) and (4) Is this about actual or idealized will? (epistemic question). 

  For each interpretation, I'll assess: 
  - Its precise definition of people/will
  - Whether it's trivial/defensible/false 
  - If it actually supports ignoring experts 
  - What arguments would be needed to bridge it to policy 

  Notably, many uses collapse into tautologies ("we should do what we should do") or self-contradictions (like claiming popular authority while dismissing actual votes). The colleague's argument likely relies on conflating these meanings - probably using descriptive majoritarianism when convenient while implying normative legitimacy. 

  The trickiest part will be showing how even defensible interpretations (like deliberative democracy) require institutional mediation that actually contradicts the "ignore experts" conclusion. I'll emphasize that no coherent reading lets you bypass justification - every version demands evidence of what the will is and why it should prevail here. 

  Finally, I'll identify the colleague's probable meaning: conflating momentary majority opinion with legitimate authority, which fails because commissions often exist precisely to refine raw preferences into sustainable policy. Their argument only "works" by avoiding scrutiny of the slogan's premises.
answer: |-
  Here's a conceptual map of "the will of the people," structured to expose its ambiguities and test its force in your colleague's argument. Each reading is analyzed per your specifications:

  ### I. **Procedural-Authoritative Readings (Who Decides?)**
  1. **Electoral Mandate**  
     - *Claim*: The "people" is the electorate in the last election; "will" is the winning coalition's platform authorization. Legitimacy flows from winning a formal procedure.  
     - *Status*: Substantive but context-dependent (requires clear mandates on specific issues).  
     - *Licenses ignoring commission?*: Only if the commission’s domain was explicitly debated in the election *and* overruling it was part of the mandate. Rarely applies to technical bodies.  
     - *Argument needed*: Evidence that overriding the commission was a salient campaign promise or policy plank.  

  2. **Majoritarian Proceduralism**  
     - *Claim*: The "people" is a current majority; "will" is whatever >50% support in polls/referendums. Authority resides in present numbers.  
     - *Status*: Defensible only if paired with robust rights protections (else tyrannical).  
     - *Licenses ignoring commission?*: Only if reliable polling shows majority opposition to the commission’s *specific recommendation* (not just general discontent).  
     - *Argument needed*: Current, methodologically sound data on the precise issue; justification for why snapshots trump expertise.  

  ---

  ### II. **Substantive-Normative Readings (What Should Be Done?)**
  3. **Common Good Embodiment**  
     - *Claim*: The "people" is a unitary entity; "will" is its authentic interest (distinct from transient preferences). Experts err by ignoring deeper communal needs.  
     - *Status*: Substantive but contested (risk of elite paternalism).  
     - *Licenses ignoring commission?*: Only if the speaker proves the commission overlooked a fundamental communal interest *and* populists uniquely discern it.  
     - *Argument needed*: Evidence that the commission’s analysis conflicts with objective communal welfare (e.g., social cohesion, long-term stability).  

  4. **Deliberative Consensus**  
     - *Claim*: The "people" is a hypothetical deliberative body; "will" is the conclusion of ideal discourse (informed, inclusive).  
     - *Status*: Defensible but non-empirical (requires counterfactual reasoning).  
     - *Licenses ignoring commission?*: Only if the commission’s process lacked public input *and* the populist position mirrors what such deliberation would yield.  
     - *Argument needed*: Demonstration that the commission excluded stakeholders *and* that the alternative policy aligns with reasoned public judgment.  

  ---

  ### III. **Constitutive-Populist Readings (Who Are "The People"?)**
  5. **Constituent Power**  
     - *Claim*: The "people" is an extra-institutional collective; "will" is its revolutionary authority to dissolve delegated bodies.  
     - *Status*: Radical but coherent in crises of legitimacy.  
     - *Licenses ignoring commission?*: Only if the commission is seen as part of a corrupt "regime" (e.g., captured by developers).  
     - *Argument needed*: Proof of systemic institutional failure *and* that "the people" are mobilizing as a counter-power.  

  6. **Identity-Based Will**  
     - *Claim*: The "people" is a culturally/ethnically defined group; "will" is its authentic expression against elites/outsiders.  
     - *Status*: Politically potent but normatively dangerous (exclusionary).  
     - *Licenses ignoring commission?*: Only if the commission "betrays" the group’s identity (e.g., by privileging outsiders' interests).  
     - *Argument needed*: Definition of the in-group *and* showing the commission serves out-groups.  

  ---

  ### IV. **Epistemic Readings (Is the Will Knowable?)**
  7. **Empirical Aggregation**  
     - *Claim*: The "people" is an aggregate of individuals; "will" is the sum of actual preferences.  
     - *Status*: Trivial if descriptive, false if equated with normative authority (preferences ≠ legitimacy).  
     - *Licenses ignoring commission?*: No. Expertise addresses *how* to achieve preferences, not *what* is preferred.  
     - *Argument needed*: None—it merely describes opinion, but cannot justify overriding expertise on its own.  

  8. **Counterfactual Will**  
     - *Claim*: The "people" is hypothetical; "will" is what they *would* want if informed/uncoerced.  
     - *Status*: Defensible in theory but easily abused (e.g., "true Scotsman" fallacy).  
     - *Licenses ignoring commission?*: Only if experts ignore accessible information that would change public views.  
     - *Argument needed*: Evidence that the commission’s findings are esoteric *and* that simplification would shift opinion.  

  ---

  ### V. **Rhetorical/Degenerate Readings**
  9. **Majoritarian Ventriloquism**  
     - *Claim*: "People" and "will" are empty signifiers; the slogan masks the speaker’s preference as popular demand.  
     - *Status*: Coherent but deceptive.  
     - *Licenses ignoring commission?*: Only rhetorically—requires no argument.  
     - *Work done*: None; circular ("we should win because we say we represent the people").  

  10. **Procedural Fetishism**  
      - *Claim*: Any elected body *is* the people’s will by definition (e.g., "Council voted, so it’s settled").  
      - *Status*: Trivial (tautological).  
      - *Licenses ignoring commission?*: Only if the commission lacks electoral accountability.  
      - *Argument needed*: None beyond pointing to the vote.  

  ---

  ### Diagnosis of Your Colleague's Claim
  - **Most Likely Reading**: A blend of **#1 (Electoral Mandate)** and **#2 (Majoritarian Proceduralism)**, implicitly assuming that winning an election confers substantive authority on all issues (*not* just procedural legitimacy).  
  - **Does It License Ignoring the Commission?**  
    - **No**, for three reasons:  
      1. **Specificity Problem**: Elections rarely provide mandates on technical commissions’ rulings.  
      2. **Epistemic Arrogance**: Assumes electoral success equips politicians to overrule domain experts.  
      3. **Procedural Contradiction**: If the commission was created by democratic processes, overriding it requires showing why *this* decision is illegitimate—not just invoking "the people" vaguely.  
  - **Real Work vs. Restatement**: The slogan does no independent work; it restates that your colleague’s faction has electoral support. To override expertise, they must argue:  
    - The commission exceeded its mandate, **or**  
    - Its reasoning is objectively flawed, **or**  
    - The issue is one of core values (not technical fact) where popular intuition trumps expertise.  

  ### Conclusion
  The slogan’s power lies in its ambiguity—it conflates descriptive claims (what people want) with normative authority (why it should prevail). In democratic theory, no serious position holds that momentary popularity automatically overrides all other considerations. Your colleague likely uses it as **rhetorical cover for majoritarian proceduralism (#2)**, but this only "works" if unchallenged. Force the question: *Which conception of "will of the people" are you invoking, and how does it specifically invalidate this commission’s expert judgment?* Without that, it’s merely applause lights.
