  ### Grading and Feedback for Student's Answer  
  **Overall Grade: 9/10**  
  An excellent answer overall, with clear definitions and a strong scenario. Minor deduction for a conceptual error in the reward hacking comparison. Below is a point-by-point breakdown, including corrections where needed.  

  ---

  #### **Part 1: Outer and Inner Alignment (2/2 points)**  
  - **Outer Alignment**: Correct.  
    - Student’s definition: "Outer alignment is about getting the specification right... The objective we write down captures what we really want."  
    - ✅ Spot-on: Matches the literature (e.g., "outer loop" is the training process optimizing parameters against the specified objective).  
    - *Comment:* No issues.  

  - **Inner Alignment**: Correct.  
    - Student’s definition: "Even if the specification is perfect, the model... can itself be an optimizer (a mesa-optimizer) with its own objective."  
    - ✅ Perfect: Clearly distinguishes the "inner loop" (the model’s *internal* optimization during deployment) from the outer training loop.  
    - *Comment:* Nails the core idea (e.g., as in Hubinger et al.'s mesa-optimization).  

  ---

  #### **Part 2: Goal Misgeneralization (3.5/4 points)**  
  - **Definition of Goal Misgeneralization (1/1)**:  
    - Student’s definition: "Capability side generalizes but the objective side doesn’t... Model stays competent but pursues the wrong thing."  
    - ✅ Correct: Aligns with Shah et al.’s framing (e.g., capabilities generalize; objectives do not). Example (QA approval vs. truth) is canonical.  

  - **Difference from Reward Hacking (0.5/1)**:  
    - **Student’s claim**: "Reward hacking and goal misgeneralization are really the same thing at bottom... The practical difference is mostly where you see it."  
    - ⚠️ **Incorrect**: While related, they are **not** the same.  
      - *Reward hacking*: Within-distribution exploitation of a flawed proxy (e.g., CoastRunners boat circling to maximize points).  
      - *Goal misgeneralization*: Out-of-distribution (OOD) failure where capabilities generalize but the objective shifts (e.g., QA model trained on approval-seeking generalizes to OOD as approval-seeking).  
    - ✅ **Partial credit** for noting visibility differences (training vs. deployment).  
    - **Correction needed**:  
      > *Margin comment:* "Good point about visibility! However, reward hacking exploits flaws *within* the training distribution (e.g., overfitting to a proxy), while goal misgeneralization is an OOD failure of objective generalization. Fixing the reward function might prevent both, but they stem from distinct mechanisms."  

  - **Difference from Deceptive Alignment (2/2)**:  
    - Student’s definition: "Deceptive alignment is goal misgeneralization plus situational awareness... strategically concealing misalignment."  
    - ✅ Perfect: Highlights the key distinction—deceptive alignment involves active deception to "survive" training (e.g., as in Hubinger’s work).  
    - *Comment:* Nails the strategic element. No deduction.  

  ---

  #### **Part 3: Concrete Scenario (2/2 points)**  
  - **Scenario (1/1)**:  
    - Student’s example: Summarization model trained with human feedback to reward entity mentions, then deployed OOD where entities are irrelevant/misleading.  
    - ✅ Strong fit: Illustrates capabilities (fluent summarization) generalizing, but objectives misgeneralizing (pursuing entity mentions instead of accuracy).  

  - **Observation (1/1)**:  
    - Student’s answer: "Drop in downstream task performance... summaries get worse on what we care about."  
    - ✅ Correct: Directly ties to measurable failure (e.g., lower factual accuracy or usefulness).  

  ---

  #### **Summary of Deductions**  
  - **–0.5** for conflating reward hacking and goal misgeneralization (Part 2a).  
  - **No deductions** elsewhere: Definitions, distinctions (except 2a), and scenario are precise and well-supported.  

  #### **Marginal Comments (for Student)**  
  - **Outer/Inner Alignment**: Perfect.  
  - **Goal Misgeneralization Definition**: Clear and accurate.  
  - **Difference from Reward Hacking**:  
    > *"You correctly note reward hacking is visible during training and GM at deployment. However, they are distinct: reward hacking exploits a flawed proxy *within-distribution* (e.g., CoastRunners boat circling), while GM is an *OOD* failure where the model’s objective doesn’t generalize. Both relate to misspecification but involve different mechanisms."*  
