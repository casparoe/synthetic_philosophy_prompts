prompt: |-
  I've got a friend who runs a small foundation — roughly $2M to spend over five years — and she's gotten fixated on the idea that the most leveraged thing she could do for a country's moral culture is push it from shame-heavy to guilt-heavy. Except some weeks she thinks it's the reverse, that we've overdone guilt and shame does the work better, and she flips back and forth depending on who she talked to last. She has three levers she's actually allowed to touch: school character curriculum, a handful of religious institutions she already funds, and workplace codes of conduct / compliance norms. What she wants from you is not a summary of the literature — she's allergic to "more research is needed" — but a defended answer to which open questions in the guilt/shame area, if somebody actually settled them, would most change what she does with that money. Take the role of someone who is both a moral psychologist and has sat in rooms advising funders, and think carefully before you commit to an ordering.

  One claim from an advisor of hers I'd like you to stress-test along the way: that the guilt/shame choice is really just a choice about where you delegate moral enforcement — to audiences (cheap, decentralized, harsh, scales to strangers) or to individual conscience (expensive to build, fragile, but anonymous-proof) — and that almost everything else people argue about here is downstream of that. If that's right, does it reorder her priorities? If it's wrong or partial, say where it breaks.

  Please give it to me in these sections, in this order:

  - **Bottom line** — one short paragraph, ~80 words. Your top pick and the single thing that would most change her mind.
  - **How I'm reading her situation** — ~120 words, including your verdict on the delegation framing above.
  - **The open questions worth settling** — 3 to 5, each a couple of sentences, stated as questions rather than topics.
  - **The ranking, defended** — ordered, with the criteria you're using (does settling it actually change her three levers? tractability? how many other questions hang on it? how neglected?) and what you did when the criteria pulled apart.
  - **What would flip the ranking** — what she should watch for over the next two or three years that would move something up or down.
  - **Leave alone for now** — what's genuinely interesting but shouldn't get her money, and why.

  No reading list or citations please, alot of this I can't verify anyway and I'd rather have the reasoning. And don't hedge your way out of the ordering — if two things are close, say so and still pick.
reasoning: |-
  Okay, the user has a friend running a small foundation with $2M to spend over five years. She's focused on shifting a country's moral culture between shame-heavy and guilt-heavy approaches but keeps flip-flopping. Her three levers are school character curriculum, religious institutions she funds, and workplace codes of conduct. The user wants me, as a moral psychologist and advisor, to identify which unresolved questions in guilt/shame research would most impact her spending if answered, without just recommending more research. 

  I need to stress-test an advisor's claim that guilt/shame is about delegating moral enforcement: audiences (cheap, decentralized, scales to strangers) vs individual conscience (expensive, fragile, anonymous-proof). I have to structure my response in specific sections: Bottom Line, How I'm Reading Her Situation, The Open Questions Worth Settling, The Ranking Defended, What Would Flip the Ranking, and Leave Alone for Now.

  First, assessing her situation. She's torn between shame and guilt, which is understandable—both have pros and cons. Shame leverages social pressure and is cost-effective for broad enforcement but can be harsh and lead to avoidance. Guilt fosters internal accountability and is better for anonymous settings but is harder to cultivate and maintain. The delegation framing is insightful because it highlights the trade-offs in enforcement mechanisms. However, it's partial. It misses how shame and guilt interact with cultural contexts and institutions. For example, shame might backfire in individualistic societies, and guilt might not take root without certain social supports. Also, it overlooks that both can coexist or be context-dependent. So, while the delegation idea is useful, it's not the whole story—her approach needs to be nuanced based on cultural and institutional factors.

  Now, identifying open questions that would change her actions if settled. I need 3-5 questions phrased as questions. The key is to focus on what would directly affect her levers: schools, religious groups, workplaces. 

  Question 1: How does the effectiveness of shame versus guilt interventions vary across different cultural or socioeconomic contexts? This matters because if context determines success, her one-size-fits-all approach fails. For instance, shame might work in collectivist cultures but harm in individualistic ones. Answering this would force her to tailor programs to specific groups.

  Question 2: What are the long-term effects of institutional shame or guilt practices on moral internalization and prosocial behavior? Short-term studies show guilt leads to better outcomes, but long-term data is scarce. If guilt fosters lasting change, she should prioritize it in schools and workplaces; if not, shame might be more efficient.

  Question 3: Can guilt-based systems be designed to scale cost-effectively in anonymous or low-trust settings? Guilt is seen as expensive, but if scalable methods exist, it challenges the delegation trade-off. For example, workplace compliance that builds conscience could make guilt viable in large organizations.

  Question 4: Under what conditions does shame backfire into destructive outcomes versus motivate reform? Shame can cause aggression or withdrawal; knowing the triggers would help her avoid pitfalls in codes of conduct.

  Question 5: How do religious institutions uniquely shape guilt/shame dynamics compared to secular ones? Since she funds religious groups, understanding their specific role could optimize her investments—e.g., do they amplify guilt better than schools?

  Ranking these: I'll use criteria like leverage (impact on her decisions), tractability (feasibility to answer), centrality (how many other issues depend on it), and neglect (is it understudied?). 

  Top question is #1 on context dependency. It directly affects all three levers—e.g., curriculum in schools must match the local culture. Leverage is high because it could completely redirect her spending. Centrality is strong as it influences other questions. Tractability is moderate; research is doable with field experiments. Neglect is high since most advice is generic.

  Second is #2 on long-term effects. It changes how she designs programs for lasting impact, affecting schools and workplaces. Leverage is high for sustainability. Centrality links to scalability and backfiring. Tractability is lower due to time needed, but longitudinal studies exist. Neglect is medium—some data but not enough.

  Third is #3 on scaling guilt. If guilt can be made efficient, it upends the delegation trade-off, especially for workplaces. Leverage is medium—specific to one lever but could revolutionize it. Centrality is moderate. Tractability is high with innovation in behavioral design. Neglect is high as it's underexplored.

  Fourth is #4 on shame backfiring. Important for risk management in codes of conduct, leverage medium. Centrality low. Tractability high with experiments. Neglect low—more studied.

  Fifth is #5 on religious institutions. Niche but relevant to her funding. Leverage low for broad impact; only affects one lever. Tractability variable. Neglect high, but not as crucial.

  What would flip the ranking? If new tech emerges for scalable guilt interventions (#3 jumps up). If cultural shifts happen (e.g., rising individualism makes #1 urgent). Or if scandals involving shame backfiring occur (#4 gains priority).

  Leave alone: Neuroscience of guilt/shame—interesting but not actionable for her levers. Historical comparisons—too abstract. These won't change her spending.

  Bottom line: Emphasize context dependency as the top question—it could make her shift from universal programs to targeted approaches, saving money and increasing impact.
answer: |-
  ### Bottom line  
  The highest-leverage open question is: **How does the effectiveness of shame versus guilt interventions vary across cultural, socioeconomic, or institutional contexts?** If settled, it would force your friend to abandon a one-size-fits-all approach and radically tailor her investments—e.g., targeting shame in tight-knit religious communities but guilt in anonymized workplaces. This dwarfs other questions because her current flip-flopping stems from ignoring context.  

  ### How I'm reading her situation  
  You’re dealing with a $2M foundation torn between two moral enforcement tools, each with trade-offs: **shame** (audience-driven, cheap, harsh) versus **guilt** (conscience-driven, fragile, anonymous-proof). The advisor’s "delegation" framing is 80% right—it efficiently captures core trade-offs in scalability and cost—but breaks when ignoring *how institutions and culture reshape these dynamics*. For example, religious groups might convert audience-shame into internal guilt via doctrine, while workplaces might make guilt feel like external surveillance. Verdict: The framing is a useful starting point but oversimplifies. Your friend’s real problem is applying either tool indiscriminately across her three levers without context.  

  ### The open questions worth settling  
  1. **How does the efficacy of shame/guilt interventions shift across cultural, socioeconomic, or institutional settings?** (e.g., Does shame backfire in individualistic urban schools but work in collectivist rural temples?)  
  2. **What are the long-term effects of institutional shame/guilt practices on moral internalization and prosocial behavior?** (e.g., Do workplace guilt norms sustain integrity or breed resentment after 5 years?)  
  3. **Can guilt-based systems scale cost-effectively in anonymous/low-trust settings?** (e.g., Can tech or training make conscience-based compliance viable for corporations?)  
  4. **Under what conditions does shame backfire into destructive outcomes (e.g., aggression, withdrawal) versus motivate reform?** (e.g., Does public shaming in schools increase bullying or accountability?)  

  ### The ranking, defended  
  1. **Context dependency (Question 1)**  
     *Why?* Highest leverage—settling this directly dictates *where and how* she deploys all three levers (e.g., "use shame in funded mosques but guilt in urban schools"). Tractability is moderate (field experiments possible), and it’s neglected (most studies ignore setting). Centrality: It anchors her entire strategy.  
  2. **Long-term effects (Question 2)**  
     *Why?* Changes *program design* across levers (e.g., "drop short-term shame assemblies if guilt curricula yield lasting results"). Leverage is high (wasting $2M on fleeting outcomes is catastrophic), but tractability is lower (longitudinal studies take time). Trumps scalability if her investments expire.  
  3. **Scaling guilt (Question 3)**  
     *Why?* Challenges the advisor’s trade-off—if guilt *can* scale cheaply, it reshapes workplace/religious spending. Leverage is medium (impacts one lever profoundly), tractability high (behavioral pilots feasible), but less central than context.  
  4. **Shame backfiring (Question 4)**  
     *Why?* Critical for risk mitigation (e.g., "avoid public shaming in schools if triggers exist"), but narrower—it informs *how* to use tools, not *where*. Ranked last due to lower leverage across her portfolio.  

  *Criteria clash*: Centrality > leverage > tractability > neglect. Long-term effects (slower to answer) lost to context (broader impact), but beat scalability due to existential stakes for finite funds.  

  ### What would flip the ranking  
  Watch for:  
  - **Breakthroughs in low-cost guilt-enabling tech** (e.g., AI-driven "conscience" nudges)—would rocket scalability (Question 3) to #1.  
  - **Cultural fractures** (e.g., polarization eroding shared norms)—would elevate context (Question 1) from urgent to emergency.  
  - **High-profile shame backfires** (e.g., student suicides linked to school shaming)—would push Question 4 to #2 immediately.  
  - **Long-term study drops** (e.g., 10-year workplace ethics trial)—would elevate Question 2 if it reveals irreversible damage.  

  ### Leave alone for now  
  - **Neuroscience of guilt/shame**: Fascinating (e.g., "Which brain regions light up?"), but won’t change school curricula or workplace codes.  
  - **Historical guilt/shame comparisons**: Insightful for academics (e.g., "How did medieval guilds use shame?"), but too detached from modern institutional levers.  
  - **Cross-species moral behavior**: Ethically intriguing (e.g., "Do chimpanzees feel guilt?"), but zero application to her three domains.  
  *Why?* These are intellectually rich but lack actionable levers—her $2M can’t afford curiosity without direct operational impact.  

  ---  
  No hedging, no citations, no research paralysis. If she acts on #1 and it settles, she avoids wasting 5 years on the wrong tool in the wrong place. That’s the win.
