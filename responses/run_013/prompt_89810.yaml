prompt: |-
  I'm a software engineer, no philosophy or history degree, and a few of us have a long-running pub argument about the French Revolution. My mate Tom says it was basically a class thing (bourgeoisie on the rise, etc.), Priya says no, it was ideology and ideas doing the driving, and I keep saying it was mostly accidents and people making dumb short-term calls. I want you to settle this with numbers instead of vibes.

  So: take these four ways of explaining the revolution -- (1) class struggle, i.e. social and economic interests, (2) ideology, i.e. political ideas and rhetoric, (3) contingency, i.e. accidents, personalities, and short-term screwups, and (4) whatever factor you think is most underrated by people who argue about this. You pick #4, name it, and say why it earns a place on the list.

  Then give me a percentage breakdown across those four for each of these episodes, with each row adding to 100: the fiscal crisis and the calling of the Estates General in 1788-89; the night in August 1789 when feudal privileges got abolished; the king's flight to Varennes and the turn against the monarchy; the September Massacres; the Vendée; the Terror turning on its own people (Danton and Desmoulins, then Robespierre); the abolition of slavery in the colonies in 1794; and the Thermidorian reaction. Put it in a table, and give me one line per row on why the numbers land where they do.

  Seperate from that, rate each of the four lenses out of 10 for how well it explains the thing revolutions supposedly do to themselves -- why the people who make a revolution so often get guillotined or exiled by the next wave of revolutionaries. And tell me straight whether "revolutions devour their children" is a real pattern or just a catchy line, plus what would count as evidence either way.

  Last bit: which single episode would flip your percentages the most if historians turned up new evidence, and what would that evidence have to show?

  Keep it concrete, don't hedge every row with "it's complicated," and I don't need reading lists or citations -- just the weights and the reasons. And please don't just summarise the Marxist view and the revisionist view and call it a day, I want your actual numbers.
reasoning: |-
  Okay, let me tackle this software engineer's request about the French Revolution. They want a quantitative breakdown of four explanatory factors for key events, plus analysis of revolution dynamics. 

  First, I need to define the four factors clearly: class struggle (economic interests), ideology (political ideas), contingency (accidents/short-term decisions), and my added factor - geopolitics (foreign wars/international pressure). For #4, geopolitics deserves inclusion because the revolution constantly reacted to foreign threats, which shaped domestic radicalization.

  Now for the percentage breakdown across eight events. Each row must sum to 100% without hedging. For the 1788-89 fiscal crisis, I'll weigh class struggle heavily (45%) since bankrupt monarchy clashed with bourgeoisie/nobility interests. August 1789 feudal abolition gets high ideology (50%) - that was pure Enlightenment principle overriding immediate interests. Varennes (1791) is mostly contingency (60%) - Louis XVI's disastrous personal decision. 

  The September Massacres (1792) need major contingency weighting (55%) - panic-driven violence. Vendée uprising (1793) is fundamentally class struggle (50%) - peasant resistance to urban demands. Terror eating its own (1794) splits between ideology (purges) and contingency (Robespierre's social missteps). Slavery abolition (1794) is strongly ideological (70%) - radical idealism despite economic costs. Thermidor (1794) leans geopolitics (40%) - war exhaustion enabling reaction.

  For the "devouring children" pattern, I'll score each factor out of 10. Contingency gets highest (9/10) - personal rivalries and fear spiral matter most. Evidence-wise, we'd need comparative revolution studies tracking factional survival rates.

  The Varennes episode would shift most with new evidence. If we found documents proving Louis planned foreign invasion rather than just fleeing, geopolitics could jump from 15% to 40%, slashing contingency's share.

  Throughout, I'll avoid academic jargon and deliver concrete percentages as requested. The key is maintaining clear causal links between events and factors without oversimplifying - this engineer wants decisiveness.
answer: |-
  Here's the percentage breakdown based on current historiography, designed for concrete debate. Factor #4 is **Geopolitics** (foreign wars, invasions, blockades, international pressure). It earns its place because revolutionary France faced existential external threats from 1792 onward, forcing radicalization, resource extraction, and internal crackdowns that distorted other factors.

  **Factor Key:**
  (1) Class Struggle (Social/Economic Interests)
  (2) Ideology (Political Ideas/Rhetoric)
  (3) Contingency (Accidents/Personalities/Short-term Errors)
  (4) Geopolitics (Foreign Wars/International Pressure)

  | Episode                                  | (1) Class % | (2) Ideology % | (3) Contingency % | (4) Geopolitics % | Reason for Weighting                                                                 |
  | :--------------------------------------- | :---------- | :------------- | :---------------- | :---------------- | :----------------------------------------------------------------------------------- |
  | **Fiscal Crisis/Estates General (1788-89)** | 40%         | 25%            | 25%              | 10%              | Deep structural debt (Class) forced action; *how* it unfolded hinged on elite miscalculations (Contingency) & Enlightenment critiques (Ideology). Geopolitics minimal pre-war. |
  | **Abolition of Feudal Privileges (Aug 1789)** | 15%         | 50%            | 30%              | 5%               | Radical ideological fervor & peasant uprisings (Ideology/Class core). Night itself driven by panic/momentum (Contingency). Geopolitics irrelevant. |
  | **Flight to Varennes (1791) & Anti-Monarchy Turn** | 10%         | 30%            | 60%              | 0%               | Louis XVI's disastrous personal decision (Contingency) shattered constitutional legitimacy. Ideology framed the betrayal narrative. Class/Geo secondary. |
  | **September Massacres (1792)**           | 20%         | 25%            | 55%              | 0%               | Panic (Contingency) triggered by fear of traitors & advancing Prussians. Underlying class resentment & ideological suspicion played roles. Geo fear was proximate cause. |
  | **Vendée Uprising (1793)**               | 50%         | 20%            | 15%              | 15%              | Primarily peasant resistance to conscription & urban/rural/religious conflict (Class). Revolutionary ideology & clumsy enforcement (Contingency/Ideology) fueled it. Geo pressure enabled conscription. |
  | **Terror Turns Inward (Danton/Desmoulins, Robespierre)** | 25%         | 40%            | 25%              | 10%              | Ideological purity spirals & factional dogma (Ideology) dominant. Personal rivalries & Robespierre's social isolation/mistrust (Contingency) critical. Class/Geo provided context. |
  | **Abolition of Slavery (1794)**          | 10%         | 70%            | 15%              | 5%               | Overwhelmingly radical Jacobin ideology & anti-colonial principle. Planters resisted (Class). Geo (slave revolt in St Domingue) forced the issue but didn't drive the *ideological* decision. |
  | **Thermidorian Reaction (1794)**         | 20%         | 15%            | 35%              | 30%              | Fear of the Terror (Contingency/Ideology backlash) & exhaustion from war (Geopolitics). Bourgeois desire for stability (Class) emerged after the coup. |

  ---

  **Rating the Lenses on "Revolutions Devour Their Children" (Scale: 10 = Best Explanation)**

  1.  **Class Struggle: 4/10.** Explains underlying tensions but not the *specific timing* or *targeting* of purges. Factions weren't strictly class-based.
  2.  **Ideology: 8/10.** Central. Radicalization creates purity spirals. Competing interpretations become treason. "The Revolution must save itself" justifies eliminating rivals *within* the movement.
  3.  **Contingency: 9/10.** Crucial. Paranoia, personal vendettas, miscommunication, tactical errors in high-stakes environments, and the need to scapegoat failure drive specific purges. Robespierre's social awkwardness mattered.
  4.  **Geopolitics: 7/10.** War/blockades create siege mentality, demand unity (eliminating dissenters), and resource competition breeds internal conflict. Failure = treason.

  **Is "Revolutions devour their children" a real pattern?** **Yes, but it's probabilistic, not inevitable.** It's a recognizable pattern in *radical* revolutions facing existential threats (internal/external).

  *   **Evidence FOR:** French Revolution (Girondins, Hébertists, Dantonists, Robespierrists executed), Russian Revolution (Bolsheviks purging SRs, Mensheviks, then Old Bolsheviks in 1930s), English Revolution (Pride's Purge, execution of Levellers). Common factors: intense ideological conflict, external war/internal civil war, weak institutions, leadership fragmentation.
  *   **Evidence AGAINST:** "Glorious Revolution" (1688) - relatively bloodless settlement. American Revolution - factionalism existed (e.g., Loyalist expulsion), but no systematic purge of revolutionary leaders by successors. Key differences: lower ideological radicalization, less existential threat post-victory, stronger institutional continuity.

  ---

  **Episode Most Vulnerable to New Evidence:** **The Flight to Varennes (1791)**

  *   **Why:** The percentages hinge almost entirely on Louis XVI's *intentions* and *specific actions* during the flight – pure contingency.
  *   **What New Evidence Could Flip It:**
      *   **Proof of Planned Invasion:** Documents proving Louis actively coordinated with Austria/Prussia *before* the flight for an immediate invasion (not just seeking refuge). This would skyrocket **Geopolitics (to ~40%)** and **Ideology (as proof of betrayal, to ~35%)**, slashing **Contingency (to ~25%)**. The flight becomes a deliberate act of war, not just a blunder.
      *   **Proof of Widespread Elite Conspiracy:** Evidence that a major faction within the Assembly knew and planned to use his capture to abolish the monarchy. This would boost **Class Struggle (elite maneuver) (to ~30%)** and **Ideology (republican plot) (to ~35%)**, reducing **Contingency (to ~35%)**. It shifts from "Louis screwed up" to "Louis was outmaneuvered deliberately."
      *   **Proof of Accidental Discovery:** Concrete evidence showing the King *would* have escaped undetected if not for a specific, random error (e.g., a single forgotten coin mint, a coach wheel breaking in just the wrong village). This would solidify **Contingency (to ~75%+)** and crush other factors.
