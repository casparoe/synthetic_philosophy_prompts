prompt: |-
  ok so my friend and I have been arguing about Kavka's toxin puzzle for like a year now and we're both sick of it. I'm on the side that says you really can just form the intention to drink the toxin and pocket the money — no contradiction. She thinks that's a swindle: if you've actually decided to drink it then you're on the hook and it's not free, and if you haven't then the money was never yours to begin with. Neither of us can get the other to budge.

  Please write the joint statement we could both put our names to. I want an agreed-claims section first, numbered, then a disagreements table. In the agreed part, the stuff that holds regardless of who's right — what the setup does and doesn't guarantee, whether intending is something you do or more like a forecast about your future self, and what "rational" is even being asked to mean here. Then our disagreement, stated twice, once in wording I'd sign off on and once in wording she'd sign off on. Then the cruxes — I think one is whether intentions are under our voluntary control the way beliefs aren't, and another is whether the case really shows a gap between deciding and predicting. For each crux, give a concrete case or arguement we'd both agree bears on it, and write down what each of us predicts about it beforehand. And if part of our fight turns out to be us just using "intend" in two different senses, say which part and why.

  Two twists to fold in so it's not just the stock puzzle: (a) the reward is payed for merely *trying* to form the intention, even if you fail; and (b) the toxin also erases your memory of the whole thing, so tomorrow-you wakes up with no idea why he's drinking it. Does the case survive either version, and does it change who's right?
