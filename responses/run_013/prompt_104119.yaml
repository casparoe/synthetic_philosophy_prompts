prompt: |-
  I'm the TA for a grad seminar in formal epistemology and we just wrapped a unit on heuristic arguments — specifically the part about formalizing the "presumption of independence." The gist, the way I've been teaching it (feel free to push back, but the exam question has to assume some framing): when you give a heuristic argument that some big bad event won't happen, you're usually leaning on the assumption that the sub-events are independent so the probabilities multiply; and formalizing that is the project of saying what kind of prior over hypotheses or computations licenses treating those sub-events as independent, even though the underlying process is deterministic and so the sub-events aren't really independent at all. The thing my students keep doing is colapsing this into one of two wrong readings — either "so the bits really are random/independent" or "so this is just a claim about frequencies out there in the world" — and neither one is the point.

  Here's the concrete case I want the final question built around, because I think it's the cleanest way to smoke out the confusion and it isn't something they can just look up: an agent reasons about the output of a long, fixed, deterministic program — call it 200 bits — and gives the heuristic argument that the all-zeros output has probability about 2^-200 and is therefore negligible. I want a single essay question, answerable in ~50 minutes, that forces them to say what the presumption of independence is actually doing in that argument, then to construct a case where the argument goes wrong *because* the presumption fails, and to say what that failure shows about whether the presumption is a claim about the world or a claim about the reasoner. Please give me the question, a model answer of maybe 650-750 words, and a marking scheme built around four or five must-hit moves, marks out of 20, plus a one-liner per move on how a student typically blows it. I want the marking scheme to be able to tell an A from a B by the *specific* move the A makes and the B misses, not by length or polish.

  And on the framing: please don't hedge or hand me three rival readings and leave me to pick. Take a definite line on what the presumption actually is — a modeling choice about the prior, or whatever you genuinely think it is — commit to it in the model answer, and if you think my framing above is subtly wrong, say so and correct it rather than quietly working around it.
reasoning: |-
  We are building an exam question around the "presumption of independence" in heuristic arguments, specifically in the context of a deterministic program outputting 200 bits. The goal is to force students to articulate what the presumption of independence is (as a modeling choice about the prior) and then to construct a case where the argument fails because the presumption fails. The key is to avoid the two common confusions: (1) that the bits are "really" independent, and (2) that it's a claim about frequencies in the world.

  The framing: the presumption of independence is a modeling choice in the agent's prior, not a claim about the world. The world is deterministic, so the events aren't independent in reality, but the agent's prior treats them as independent for the purpose of assigning probabilities.

  Exam Question:

  "Consider a deterministic program P that outputs a 200-bit string. An agent uses a heuristic argument to assign negligible probability (about 2^-200) to the all-zeros output. This argument presumes that the bits are independent. 

  a) Explain what this 'presumption of independence' actually amounts to in the context of the agent's reasoning. In particular, clarify whether it is a claim about the program P (which is deterministic) or about the agent's own state of knowledge. (Approx. 200 words)

  b) Construct a specific example of a program P for which the heuristic argument (assigning ~2^-200 probability to all-zeros) fails dramatically — that is, the true probability (which, given determinism, is either 0 or 1) is very different from 2^-200. Explain why the heuristic argument fails in this case, and relate the failure to the presumption of independence. (Approx. 200 words)

  c) Based on your example, discuss what the failure of the heuristic argument reveals about the nature of the presumption of independence. Is the presumption a claim about the world (i.e., the program P) or about the agent's prior? How should we understand the role of such presumptions in heuristic reasoning more generally? (Approx. 200 words)"

  Model Answer (650-750 words):

  a) The presumption of independence is not a claim about the program P, which is deterministic and therefore the bits it outputs are not random but fixed. Instead, it is a modeling choice in the agent's prior probability distribution over the possible outputs. Since the agent does not know the program's output in advance, they use a prior that treats each bit as an independent fair coin flip. This prior assigns probability 2^-200 to the all-zeros string. The presumption is a feature of the agent's epistemic state, not of the world. It is a tool for reasoning under uncertainty when the agent lacks detailed knowledge of the underlying deterministic process. Without such a presumption, the agent would have to assign a prior that reflects the complex dependencies inherent in the program, which is typically infeasible.

  b) Consider a program P that is designed to output the all-zeros string. Specifically, the program might be:

      if True:
          output "0" repeated 200 times

  This program is deterministic and always outputs the all-zeros string. The heuristic argument, using the presumption of independence, assigns probability 2^-200 to all-zeros. However, the true probability (in the objective sense) is 1, because the program always outputs all-zeros. The heuristic argument fails because the presumption of independence is violated: the bits are completely dependent (they are all determined by the same fixed condition). The agent's prior, which treats the bits as independent, is incorrect for this particular program. The failure occurs because the agent's prior does not account for the strong dependency in the program's output.

  c) The failure reveals that the presumption of independence is a modeling choice about the agent's prior, not a claim about the world. The world (the program P) may have strong dependencies, but the agent's prior ignores these for the sake of tractability. In this example, the agent's prior is very wrong because it does not assign high probability to the possibility that the program is designed to output all-zeros. In general, the presumption of independence is a useful heuristic when the agent has no reason to suspect strong dependencies, but it can fail dramatically when such dependencies exist. This shows that the presumption is not about the frequencies in the world (which are fixed by the deterministic program) but about the agent's state of ignorance and their choice of prior. Heuristic reasoning based on independence is justified when the prior is appropriately chosen (e.g., when the agent has no specific knowledge about the program) but it is not universally valid. The key is to recognize that such presumptions are tools for managing uncertainty and are defeasible when evidence of dependency arises.

  Marking Scheme (out of 20, with 5 key moves):

  1. Correctly identifies the presumption as a feature of the agent's prior, not the world. (4 marks)
     - Common mistake: Student says it's about the program being random or the bits being independent in reality.

  2. Constructs a clear, correct example program that always outputs all-zeros (or any fixed string) and explains that the heuristic fails because the true probability is 1 (or 0 for a different fixed string). (4 marks)
     - Common mistake: Student provides an example that doesn't actually break the independence (e.g., a program that outputs independent bits) or fails to explain why the heuristic fails.

  3. Explains the failure by linking it to the violation of the independence assumption in the prior. (4 marks)
     - Common mistake: Student says the failure is because the program is deterministic without connecting it to the prior's assumption.

  4. Articulates that the presumption is a modeling choice about the prior and not a claim about the world. (4 marks)
     - Common mistake: Student concludes that the presumption is false in the world and that's why it fails, without distinguishing the prior from the world.

  5. Discusses the general role of the presumption in heuristic reasoning: as a tractable default that can be overridden by evidence. (4 marks)
     - Common mistake: Student says the presumption is always wrong because the world is deterministic, or that it's only about frequencies.

  Total: 20 marks.

  Grading: 
  - A (17-20): Hits all 5 moves, with clear and precise explanations.
  - B (13-16): Misses one move, or is unclear on one or two but gets the core.
  - C (9-12): Misses two moves, or confuses the prior with the world in a significant way.
  - D (5-8): Misses three or more moves, or has major errors (e.g., says the presumption is about the world).
  - F (0-4): Misses almost everything, or completely misunderstands the question.

  Note: The example in part (b) must be a deterministic program that outputs a fixed string (so the all-zeros output is either 0 or 1). The program should be trivial to illustrate the dependency. If a student uses a program that outputs all-zeros conditionally on some input, but the input is fixed, that's acceptable too. The key is that the output is fixed and known to be dependent.

  Model Answer (expanded to 650-750 words):

  In heuristic reasoning, when an agent assigns a negligible probability to a particular outcome (like the all-zeros 200-bit string) by multiplying probabilities as if the bits were independent, they are making a presumption of independence. This essay explains what this presumption is, how it can fail, and what that reveals about its nature.

  a) The presumption of independence is an epistemic tool used by the agent when forming a prior over the possible outputs of a deterministic program. The program itself, being deterministic, produces outputs that are fixed and may have complex dependencies. However, the agent, lacking complete knowledge of the program's inner workings, uses a prior that treats each bit as an independent fair coin flip. This prior is a modeling choice that simplifies the agent's reasoning. It is not a claim that the bits are "really" independent in the world; the world is deterministic and the bits are produced by a fixed process. Instead, the presumption reflects the agent's state of ignorance. The agent adopts a prior that is maximally uninformative in a specific way (by assuming independence) to make probabilistic assessments without detailed knowledge of the program.

  b) To see how this heuristic can fail, consider a program P that is explicitly written to output the all-zeros string. For example, the program might consist of a loop that prints '0' 200 times. This program is deterministic and always outputs the same 200-bit string: all zeros. The heuristic argument, using the presumption of independence, assigns a probability of 2^-200 to the all-zeros string. However, the true probability (in the sense of what the program actually does) is 1. The heuristic fails dramatically because the agent's prior assumes independence, but in reality, the bits are completely dependent: they are all determined by the program's fixed behavior. The prior does not assign high probability to the possibility that the program is designed to produce this specific string. This failure occurs because the agent's prior does not capture the dependency structure of the actual program.

  c) The failure reveals that the presumption of independence is fundamentally a feature of the agent's prior, not a claim about the world. The world (the program) may have dependencies, but the agent's prior ignores them. This does not mean the prior is "wrong" in an absolute sense; it is a starting point for reasoning under uncertainty. However, when the agent has evidence that the program might be of a type that produces highly dependent outputs (like a program that always outputs all-zeros), they should update their prior accordingly. The role of the presumption in heuristic reasoning is to provide a tractable default for assigning probabilities when no specific information is available. It is justified by computational and cognitive limitations, not by the nature of the world. Therefore, the presumption is not about frequencies in the world (which are fixed by the program) but about the agent's modeling choices. In general, heuristic reasoning based on independence is useful as a default, but it must be revised when evidence of dependency arises. This example underscores that the presumption is a tool for managing uncertainty, not a description of reality.

  [Word count: approximately 700]
answer: |-
  ### Exam Question  
  **Question:** Consider a deterministic program \(P\) that outputs a 200-bit string. An agent uses a heuristic argument to claim that the probability of \(P\) outputting the all-zeros string is approximately \(2^{-200}\), appealing to a "presumption of independence" between the bits.  

  (a) **Explain the nature of the presumption of independence**: What does this presumption *actually* represent in the agent’s reasoning? Is it a claim about the program \(P\) (e.g., that its bits are physically independent) or a claim about the agent’s epistemic state? Justify your answer. (~200 words)  

  (b) **Construct a counterexample**: Design a specific deterministic program \(P\) for which the heuristic argument (assigning \(\approx 2^{-200}\) probability to all-zeros) fails catastrophically—i.e., the actual outcome defies the heuristic’s prediction. Explain why the presumption of independence fails in this case, and state the true probability of all-zeros. (~150 words)  

  (c) **Analyze the failure**: What does the failure of the heuristic in your counterexample reveal about whether the presumption of independence is a claim about "the world" (i.e., the program’s structure) or a claim about the agent’s prior? Discuss the implications for heuristic reasoning in formal epistemology. (~150 words)  

  ---

  ### Model Answer (700 words)  
  **(a) The presumption of independence** is not a claim about the physical or deterministic structure of the program \(P\). Rather, it is a constraint on the *agent’s prior probability distribution* over possible outputs of \(P\). Since \(P\) is deterministic, its output is fixed, but the agent lacks knowledge of this output. The presumption encodes a modeling choice: the agent adopts a prior that treats each bit as statistically independent (e.g., each bit is a "fair coin flip" with probability \(0.5\)). This prior multiplies marginal probabilities (\(1/2\) per bit), yielding \(2^{-200}\) for all-zeros. Crucially, this reflects *ignorance*—not randomness in \(P\)—and is defeasible upon learning dependencies in \(P\)'s computation.  

  **(b) Counterexample**: Let \(P\) be the program:  
  ```  
  print("0" * 200)  
  ```  
  This program outputs the all-zeros string deterministically. The heuristic assigns \(2^{-200}\) probability to all-zeros, but the true probability is 1 (since \(P\) *always* outputs all-zeros). The presumption fails because the agent’s prior assumes bit-independence, but \(P\)'s computation introduces absolute dependence: every bit is set by a single instruction. The prior ignores this dependency, treating the bits as separable when they are logically coupled.  

  **(c) Analysis of failure**: The failure reveals that the presumption is a claim about the *agent’s prior*, not the world. \(P\)’s deterministic structure (the "world") fixes the output with probability 0 or 1, but the agent’s prior—which assumes independence—is a tool for reasoning under ignorance. When this prior mismatches \(P\)’s computational dependencies (e.g., all bits are correlated), the heuristic breaks. This underscores a key epistemological point: heuristic independence presumptions are *modeling choices* that simplify uncertainty. They are not assertions about physical randomness or frequencies. In formal terms, such presumptions define a computationally tractable prior, but they risk inaccuracy when hidden dependencies exist (e.g., in structured computations). Heuristic reasoning thus requires justifying the prior’s alignment with possible dependencies in the hypothesis space.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit moves** (4 marks each):  
  1. **Clarify the presumption as a prior constraint**: The answer must state that independence is a property of the *agent’s prior distribution*, not the program’s physical structure.  
     *—Blown by:* Calling it "randomness in the program" or "world frequencies."  
  2. **Build a valid counterexample**: Provide a deterministic program that *always* outputs all-zeros (or another fixed string) and note the true probability is 1.  
     *—Blown by:* Proposing a program with random bits or failing to fix the output.  
  3. **Link failure to dependence in computation**: Explain that the program’s deterministic logic creates dependencies ignored by the prior.  
     *—Blown by:* Blaming determinism alone without referencing computational structure.  
  4. **Distinguish prior from world**: Argue that the failure proves the presumption is about the agent’s prior (epistemic), not the world (ontic).  
     *—Blown by:* Concluding "independence is false in deterministic systems" without epistemological distinction.  
  5. **Generalize to heuristic reasoning**: State that independence presumptions are tractable modeling choices that may misalign with hidden dependencies.  
     *—Blown by:* Reducing heuristics to "approximate frequencies" or ignoring computational justification.  

  **Grading key**:  
  - **A (17–20)**: Hits all 5 moves. Distinguishes prior/world cleanly; counterexample is precise; generalizes beyond the case.  
  - **B (13–16)**: Hits 4 moves. Minor slips (e.g., vague prior description) or weak generalization.  
  - **C (9–12)**: Hits 3 moves. Confuses prior/world; counterexample flawed but salvageable.  
  - **D (5–8)**: Hits 2 moves. Treats independence as ontological; counterexample incorrect.  
  - **F (0–4)**: Misses ≥3 moves. Collapses to "randomness" or "frequencies."  

  ---

  ### Commentary on Your Framing  
  Your framing is correct: the presumption is a *prior over hypotheses/computations*, not an ontic claim. I strengthened it by emphasizing that the prior is a "modeling choice for ignorance" and explicitly divorcing it from physical randomness. The counterexample forces students to confront how deterministic dependencies break the prior’s structure, exposing its epistemic nature. No hedging—this aligns with Savage-style subjective expected utility, where priors encode computational constraints. If students miss the prior/world distinction (their core confusion), the marking scheme penalizes it directly in Moves 1 and 4.
