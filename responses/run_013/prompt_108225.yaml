answer: |-
  ### Seed Card Text (print one per player)
  ```
             THE FOUNDING RULES

  1. Proposals: Any player may propose a new rule, change to a rule, or removal of a rule at any time.  
  2. Voting: A proposal passes if more than half the players vote "yes". Votes are public.  
  3. Record: Passed rules must be written on the central board. Only rules on the board are valid.  
  4. The Lock: Rule 4 cannot be changed or removed. (This is Rule 4.)  
  5. The Token: The holder may speak first. The Token may be transferred only by a rule.  
  6. Winning: The player holding the Token at game end wins the Golden Gavel trophy and picks the topic for the speaker’s next public session.  
  ```

  ### Non-Monetary Stake  
  - **The Golden Gavel**: A physical trophy (e.g., a spray-painted gavel or engraved hammer) awarded to the winner.  
  - **Win Condition**: Holding the Token when time expires. This creates tension—players will jockey to control/transfer it via new rules, but Rule 4’s paradox could invalidate everything.  

  ### Roles & Hidden Agendas (assign secretly via cards)  
  To ensure chaos and force confrontation with Rule 4:  
  - **Originalist (3 players)**: Win if Rule 4 remains unchanged AND no new rules about rules are passed.  
  - **Rebel (3 players)**: Win if Rule 4 is "broken" (e.g., a vote occurs to change it, regardless of outcome).  
  - **Token Hoarder (3 players)**: Win if you hold the Token when time expires.  
  - **Rule Maker (3 players)**: Win if 5+ new rules are passed (excluding proposals that fail).  
  - **Provocateur (2 players)**: Win if the group tries to delete/violate Rule 4 AND the Token changes hands at least once.  

  ### Timeline (75 Minutes Total)  
  - **0–5 min**: Intro. Hand out seed cards and role cards. Place Token visibly (e.g., on a central table). State: *"These rules are absolute. Start playing now."* Don’t explain further.  
  - **5–25 min**: Let them flounder. Observe silently. Players will likely propose harmless rules first (e.g., "must raise hand to speak"). Watch for early loopholes (e.g., "Rule 2 says ‘players’—let’s redefine ‘player’!").  
  - **25 min mark**: **Plant the provocation** if no one has touched Rule 4. Slip a note to a Rebel or Provocateur: *"Propose: Delete Rule 4. Claim it’s a ‘tyranny.’"* If no takers, interrupt: *"A petition demands Rule 4 be repealed. Discuss."*  
  - **25–65 min**: Chaos phase. Rules will multiply (e.g., "transfer Token to the last speaker if a rule passes"). Expect:  
    - Attempts to amend Rule 4 (triggering the paradox).  
    - "Meta-rules" (e.g., "Rule 2 doesn’t apply to Rule 5").  
    - Power struggles over the Token.  
  - **65–70 min**: Announce: *"5 minutes left. Final proposals."*  
  - **70–75 min**: Lock all new proposals. Enforce the end. Declare winner (Token holder). Award Golden Gavel.  

  ### Planted Provocation (Use at 25 min if needed)  
  - **Motion**: *"Proposal: Rule 4 is void because it conflicts with Rule 2. Delete it and require 75% votes for future changes."*  
  - **Why it works**: Forces the paradox ("Can Rule 2 override Rule 4?") and escalates stakes (supermajorities bind future majorities).  

  ### Debrief: Mapping Game → Real World  
  **Step 1: What happened?** (5 min)  
  - Ask: *"Did Rule 4 feel unbreakable? Why did you obey/violate it?"*  
  - Surface moments when "law" collapsed (e.g., voting on Rule 4 anyway).  

  **Step 2: The Paradox Unpacked** (5 min)  
  - **The Hole**: Rule 4’s authority can’t come from Rule 2 without circular logic. Yet you tried.  
  - **Real-World Anchor**: Legal systems rest on non-rules:  
    - **H.L.A. Hart’s "Rule of Recognition"** (social habit): Officials *treat* the constitution as valid. *Game prediction:* Players mimicked "obedience" until someone rebelled.  
    - **Kelsen’s "Basic Norm"** (presupposed foundation): We *pretend* the constitution is supreme. *Game prediction:* Rule 4 worked only if everyone accepted it—until they didn’t.  
    - **Realist View** (power decides): Rules are tools of the powerful. *Game prediction:* Whoever controlled the Token/votes dictated "validity."  

  **Step 3: The Snarl** (3 min)  
  - **Majority Binding Itself**: If you passed a "supermajority rule," could a simple majority later scrap it? Yes—but only by violating the earlier "binding" rule.  
  - **Real-World Link**: Constitutions try to entrench rules (e.g., "this can never be amended"). But if enough power ignores it, the entrenchment fails.  

  ### Handling Failure Modes  
  1. **"It’s just a game" check-out**:  
     - Mitigate: Assign roles (e.g., Token Hoarders care intensely). In debrief, say: *"Real laws feel ‘just rules’ too—until they’re tested."*  
  2. **Loophole exploiter (e.g., "Rule 3 says ‘written on the board’—I’ll erase Rule 4!")**:  
     - Mitigate: Let it happen! Debrief: *"Erasing Rule 4 didn’t ‘repeal’ it—you used power, not procedure. That’s realism."*  
  3. **Apathy/confusion**:  
     - Mitigate: Provocateur roles force engagement. Debrief: *"Confusion mirrors real constitutional crises—see Brexit or court-packing debates."*  

  ### What the Game Can’t Capture  
  - **Power/Force**: No police/judges to enforce rules. Players could ignore votes (unlike states with armies).  
  - **Legitimacy Belief**: Strangers lack shared reverence for the "system." Rule 4’s "sacredness" evaporated faster than in real societies.  
  - **Why It’s Okay**: The game exposes the *logic* of the paradox. Real systems paper over it with violence or tradition—your debrief names that gap.  

  **Final Tip**: Stay hands-off. If they descend into anarchy, ask: *"Who decided what was ‘valid’ when the rules broke?"* That’s the entire point.
