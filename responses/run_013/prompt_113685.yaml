  I should explain the Frege point: logical validity relies on sentences having the same content regardless of context. Expressivism needs to show how the attitude in "justified" contributes to the truth conditions of complex sentences. Otherwise, modus ponens arguments involving "justified" would be invalid.

  Then, the negation problem: negating "X is justified" isn't just withholding endorsement; it's expressing a different attitude. But what is that attitude? Expressivists need a unified account that differentiates between "X is not justified" and "it's not the case that X is justified" without making them the same.

