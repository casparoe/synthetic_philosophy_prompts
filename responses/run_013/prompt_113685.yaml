answer: |-
  Here's a continuous explanation of the Frege-Geach problem tailored to your expressivist character's view on "justified," designed to make the philosophical dispute vivid:

  ### The Core Expressivist Commitment
  Your character, let's call her **Dr. Arden**, believes that uttering "Belief X is justified" isn't *describing* a property (like "weighs 2kg" describes mass). Instead, it *expresses* her **commitment to treating X within a specific inferential network**—e.g., "I commit to using X as a premise, defending it with evidence, and drawing conclusions from it." For her, "justified" signals a *stance*, not a fact.

  ### The Rival's Challenge: Logic Breaks Down
  Her rival, **Professor Thorne**, argues this view collapses when "justified" appears in complex sentences. Why? Because logic requires sentences to contribute the *same meaning* whether asserted or embedded. Thorne’s attack has two prongs:

  1.  **The Embedding Problem (Frege-Geach Point):**
      *   Consider an argument Thorne might write on Arden’s blackboard:
          > Premise 1: *If* believing the data is flawed *is justified*, *then* rejecting the conclusion *is justified*.  
          > Premise 2: Believing the data is flawed *is justified*.  
          > Therefore: Rejecting the conclusion *is justified*.
      *   This is **modus ponens** – bedrock logic. It *depends* on the phrase "is justified" meaning the *same thing* in Premise 1 (antecedent), Premise 2 (asserted), and the Conclusion (asserted).
      *   **Thorne's Objection:** "Arden, your expressivism only tells me what it means to *assert* 'X is justified' – expressing *your* commitment. But what does 'X is justified' mean *inside* the 'if' clause (Premise 1)? It's *not* being asserted there! You're not expressing *your* commitment to X *right then*. If it doesn't express an attitude there, *what semantic content does it contribute* to allow the whole conditional (Premise 1) to be true or false, and for the logic to work? Without consistent content, modus ponens crumbles."

  2.  **The Negation Problem (A Deeper Layer):**
      *   Now consider: "Believing the data is flawed is *not* justified."
      *   **Thorne's Objection:** "Arden, if asserting 'X is justified' expresses *commitment*, what does negating it express? Is it simply the *absence* of commitment (like not clapping)? But that's far too weak! Saying 'X is *not* justified' is a strong rejection; it expresses *disapproval* of treating X that way, or commitment to *excluding* it from the inferential network. Your simple 'expression of attitude' model needs to explain this *distinct negative attitude* and how it composes logically with other operators like 'if'."

  ### Why Simple Fixes Fail
  Arden might try these rebuttals, but Thorne has counters:

  *   **"Mention, Not Use!" (The Semantic Shift Dodge):**  
      Arden: "In 'If X is justified...', 'justified' isn't *used* to express my attitude; it's only *mentioned* or discussed abstractly."  
      Thorne: "Then Premise 1 becomes something like *'If I (or someone) were to express commitment to X's role...'*. That fundamentally changes its meaning! Our original argument wasn't about *my psychological states*; it was about the logical connection between the *justification statuses* of two beliefs. You've turned a straightforward logical claim into a contingent psychological one. That's not what we mean when we reason with 'justified'."

  *   **"Minimalist Truth!" (The Deflationist Dodge):**  
      Arden: "Fine, I'll grant 'X is justified' is truth-apt in a minimalist sense – 'It is true that X is justified' just means 'X is justified'. That solves the logic!"  
      Thorne: "No, it *begs the question*. **Minimal truth doesn't generate content; it presupposes it.** Saying 'It is true that X is justified' is just a fancy way to re-assert 'X is justified'. It tells me *nothing* about what 'X is justified' *means* when it's not being asserted, especially inside complex sentences. How does the *attitude* you express when asserting it magically transform into a *truth-evaluable proposition* inside the 'if' clause? Minimal truth is just a label; it doesn't solve the composition problem."

  ### The Expressivist Tightrope: Repairs and Their Costs
  Some real philosophers (like Allan Gibbard or Simon Blackburn) tried repairs. Thorne would argue they all sacrifice core expressivism:

  1.  **Gibbard's Solution (Norm-Expressivism / Planning):**
      *   **The Repair:** Arden analyzes "justified" as expressing acceptance of a *system of norms* governing inference. "X is justified" expresses planning to rely on X in reasoning. Complex sentences express *complex planning states*. "If X is justified, then Y is justified" expresses a plan *conditional* on accepting the norms that make X justified: *If I plan to rely on X, then I plan to rely on Y*.
      *   **Thorne's Critique (The Cost):** "This *works* technically for logic. But look at the cost, Arden! Your 'plans' or 'norm-acceptances' are now behaving *exactly like* truth-conditional propositions. You've constructed an elaborate, abstract structure ('hyperplans') that mirrors a realist's world of justification facts. You've become a **closet descriptivist**. The distinctive 'expressivist' feel – that 'justified' directly manifests a practical commitment – is lost in a maze of quasi-propositions. Your view now *describes* relations between abstract planning states or norms, rather than *expressing* the simple commitment."

  2.  **Blackburn's Quasi-Realism (Projectivism):**
      *   **The Repair:** Arden insists her expressivism can *earn the right* to talk *as if* justification were a real property, including in logic. We "project" our attitudes onto the world and develop logical rules for these projected concepts.
      *   **Thorne's Critique (The Cost):** "Quasi-realism is a sleight of hand, Arden. It *starts* by saying 'justified' only expresses attitudes, but then aims to reconstruct *all the trappings* of realism – truth, logic, objectivity. The problem is the starting point. If 'justified' fundamentally *is* just an expression of attitude, any successful reconstruction of robust logic and truth *proves* that the realist's language and concepts were the correct ones all along. Quasi-realism either fails to fully reconstruct logic (leaving the embedding problem unsolved) or succeeds so completely that it vindicates the rival view that 'justified' *does* denote a real, logic-governed property. It's a self-undermining project."

  ### The Heart of the Dispute: A Dialogue Snippet
  > **Thorne:** "Arden, your view is elegant for simple assertions. But language isn't just shouting commitments! We *reason* about justification. We say 'Even *if* that belief *were* justified, it wouldn't prove your point.' Or 'It's *not* justified, *and* here's why.' Your expressivism tells me what 'X is justified' *does* when fired like a bullet. But logic needs to know what it *is* – the consistent payload carried into the complex machinery of 'if', 'and', 'not', and 'therefore'. Without that payload, your 'justified' is inert in the very arguments philosophers live by."
  >
  > **Arden (Defiantly):** "Reasoning *is* a practice, Thorne! It's about managing our commitments, not mirroring phantom properties. I *can* explain 'If X is justified...' – it expresses my conditional commitment, my preparedness to infer Y *should* I endorse X's role. The logic reflects the structure of coherent commitment, not descriptions of Plato's heaven!"
  >
  > **Thorne:** "Conditional commitment? So Premise 1, 'If X is justified, then Y is justified,' expresses *your* conditional plan? But logic is objective! That premise should hold *regardless* of your or my current plans. Its truth should constrain *any* rational thinker's commitments, not just describe yours. By grounding it *only* in your attitude, you've made logic subjective and lost its normative force. To get that objectivity back, you'll need to invoke those abstract norms or plans – and then you're back describing the structure of rational obligation, not just expressing your stance. The descriptivist specter haunts your every move, Arden."

  ### Key Takeaway for Your Novel
  The dispute revolves around **semantic consistency vs. expressive purity**. Thorne argues that for "justified" to function logically like other concepts (e.g., "heavy," "made of copper"), it needs stable, context-independent content – which points towards descriptivism. Arden insists that this stable content *can* be built from complex attitudes/norms without betraying her core insight that justification *fundamentally* concerns our rational practices, not mind-independent properties. Thorne sees any successful repair as a surrender to descriptivism; Arden sees it as vindicating a deeper understanding of rationality. This tension – between logic's demand for uniform content and expressivism's core psychological claim – is the engine of their conflict.
