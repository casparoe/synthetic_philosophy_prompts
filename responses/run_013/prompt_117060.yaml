prompt: |-
  By day I write novels; two afternoons a week I teach an advanced fiction workshop to twelve graduate students, and for the last three terms I have been trying to diagnose a failure that keeps recurring in their drafts and, more embarrassingly, in my own. The failure is not a shortage of feeling but a shortage of method. The writers I teach either assume an unearned omniscience, narrating other people's interiors as though they had a key to the room, or they retreat into a defensive behaviourism in which characters do nothing but smoke and look out of windows; the middle ground — building a person's inner life out of what that person says and does, plus everything anyone else can see — gets lost between the two.

  At a dinner last month a friend who teaches philosophy of mind asked me why novelists never borrow anything from the science of consciousness, and she described Daniel Dennett's heterophenomenology, which she called the standard third-person method in the field and which I have since looked into on my own. As I understand it: you treat everything the subject says as a text, a set of utterances to be interpreted rather than a transparent window on the mind; you take those utterances seriously and completely, so that the subject is treated as authoritative about how things seem to them, while you suspend judgment on whether things are as they seem; you bracket the metaphysical question of what the inner life is really made of, answering it neither way; and you bring in every other available source — behaviour, physiology, the setting, what the subject could not have known — to build up the picture of the world as the subject takes it to be, allowing for confabulation without concluding that the reports are worthless. That last point is what interests me: it is a licence to keep a character's testimony while treating it as evidence rather than as truth.

  I would like you to turn this into a procedure my students and I can actually run on a scene. Give me the questions in the order they should be asked, what a satisfactory answer to each looks like, where the sequence terminates in a verdict (the scene stands, the scene must be rebuilt, the testimony cannot be used at all), and where it has to stop and hand the decision back to the writer because the question is about the design of the book rather than about the character's world — and say plainly which of the steps are judgement calls wearing the costume of procedure. Then run it on three cases: first, a character whose account of the accident that injured her brother is fluent, detailed, and contradicted by a photograph the reader has already seen; second, a character in the middle of a dissociative episode whose testimony the reader has every reason to think is confabulated, which one of my students wants to resolve with a late reveal that the confabulation was true all along; third, the case I am afraid of, a chapter in my own novel in progress — three siblings circling their mother, who is losing her language to a neurodegenerative illness — in which the narrator renders the mother's dying interior across eight pages of lyrical first person that I love and that I suspect the procedure will not license. For that third case I want the honest verdict and the reasoning behind it, not a rescue. Close with what the procedure cannot do, and with the two or three failure modes you would expect to see once twelve people are applying it every week to two-thousand-word scenes; I need to be able to answer the student who will tell me that all of this is just a rule for writing thin characters.
reasoning: |-
  We are creating a procedure based on heterophenomenology for analyzing a scene in fiction writing. The goal is to help writers build a character's inner life through observable evidence (speech, behavior, context) without assuming omniscience or retreating to pure behaviorism.

  The procedure will consist of a series of questions. Each question must be answered by examining the text of the scene. We are treating the character's testimony (what they say and think, if presented) as a text to be interpreted, not as direct truth.

  Steps:

  1. **Identify the Testimony**: What does the character say or think (if presented in the narrative) about their experience, feelings, or beliefs in this scene? This includes direct speech, reported speech, and internal monologue if provided.

  2. **Identify Observable Behavior**: What does the character do? This includes actions, gestures, physical reactions, and any other observable behavior.

  3. **Identify the Context**: What is the setting? What are the circumstances? What other characters are present and how do they react? What is happening around the character?

  4. **Identify External Evidence**: What other sources of information are available that the character may not be aware of? This could include:
     - Physical evidence (like a photograph, a document, an object)
     - Other characters' testimonies or behaviors
     - Narrator's observations (if the narrator is not the character and has access to external facts)
     - Prior or future events that the reader knows but the character may not

  5. **Cross-Reference**: Compare the testimony (step 1) with the observable behavior (step 2), the context (step 3), and the external evidence (step 4). 
     - Where do they align?
     - Where are there discrepancies?
     - Are there gaps in the testimony that behavior or context fills?
     - Are there parts of the testimony that are directly contradicted by external evidence?

  6. **Assess Confabulation and Reliability**: Given the above, how reliable is the character's testimony? Consider:
     - Motives the character might have to distort the truth (conscious or unconscious)
     - The character's mental state (are they under stress, intoxicated, suffering from a condition that might affect perception or memory?)
     - The possibility of confabulation (filling in gaps with fabricated details without intent to deceive) and how that might be at play.

  7. **Synthesize the Character's Worldview**: Using the testimony (with its potential confabulations and distortions) and the external evidence, build a picture of how the character perceives their world. This is the "heterophenomenological world" of the character.

  8. **Narrative Verdict**: 
     - If the scene uses the character's testimony appropriately as evidence (i.e., it is presented in a way that allows the reader to see it as the character's perspective and not as objective truth) and the external evidence is consistent with the overall narrative, then the scene stands.
     - If the scene presents the character's testimony as objective truth when it is contradicted by external evidence without narrative justification (e.g., without the character being an unreliable narrator in a way that the narrative acknowledges), then the scene must be rebuilt to either adjust the testimony, adjust the external evidence, or change the narrative framing to clarify the status of the testimony.
     - If the testimony is so unreliable that it cannot be used without misleading the reader in a way that the narrative does not intend (and the narrative does not have a mechanism for revealing this unreliability), then the testimony might need to be removed or replaced with behavior and context. However, note: even unreliable testimony can be used if the narrative structure supports it (e.g., an unreliable narrator).

  But note: sometimes the question is about the design of the book. For example, if the narrative is meant to be from an omniscient point of view that the author has established, then the procedure might conflict with the chosen narrative mode. In such cases, we hand the decision back to the writer.

  Steps that are judgment calls (wearing the costume of procedure):
     - Step 6 (Assess Confabulation and Reliability) is highly interpretive. It requires the writer to make a call about the character's mental state and motives.
     - Step 7 (Synthesize the Character's Worldview) is also interpretive and requires building a coherent picture from potentially conflicting evidence.
     - Step 8 (Narrative Verdict) requires understanding the overall narrative design, which may not be fully established in the scene.

  Now, let's run the procedure on the three cases.

  **Case 1: A character whose account of the accident that injured her brother is fluent, detailed, and contradicted by a photograph the reader has already seen.**

  1. **Testimony**: The character gives a fluent and detailed account of the accident.
  2. **Behavior**: We don't have specific behavior in the scene description, but we note how she delivers the account (e.g., is she calm? agitated?).
  3. **Context**: The accident happened in the past; she is recounting it now. The reader has seen a photograph that contradicts her account.
  4. **External Evidence**: The photograph (which the reader has seen) shows something different from her account.
  5. **Cross-Reference**: The testimony is contradicted by the photograph. There is a discrepancy.
  6. **Confabulation and Reliability**: Why the discrepancy? Possibilities: she is lying, she has a false memory, the photograph is misleading? Without more, we note the contradiction.
  7. **Synthesis**: The character's world includes a memory of the accident that does not match the physical evidence. This might be due to trauma, guilt, or deception.
  8. **Verdict**: The scene can stand if the narrative frames her testimony as her perspective (which may be unreliable) and the photograph is presented as evidence that challenges it. The reader should be able to question the testimony. However, if the scene presents her testimony as the objective truth without acknowledging the contradiction, then it must be rebuilt. The testimony can be used but must be treated as evidence (her version) and not as fact.

  **Case 2: A character in the middle of a dissociative episode whose testimony the reader has every reason to think is confabulated, which one of my students wants to resolve with a late reveal that the confabulation was true all along.**

  1. **Testimony**: The character provides an account during a dissociative episode that seems confabulated.
  2. **Behavior**: The character is dissociating, so behavior might include detachment, confusion, etc.
  3. **Context**: The episode is happening now, and the character is in a state that impairs their perception/memory.
  4. **External Evidence**: The reader has been given reasons to think it's confabulated (e.g., the events described are impossible, or other evidence contradicts it). However, the student plans a late reveal that it was true.
  5. **Cross-Reference**: The testimony is inconsistent with what the reader currently knows, but the late reveal would make it consistent.
  6. **Confabulation and Reliability**: The character is dissociating, so their testimony is unreliable. However, the twist is that the events they describe actually happened (elsewhere or in a way that wasn't known at the time).
  7. **Synthesis**: The character's world during the episode includes elements that are real but perhaps displaced in time or context. The confabulation might be a distorted version of a real event.
  8. **Verdict**: The scene can stand because the narrative structure (with the late reveal) will resolve the discrepancy. However, the writer must plant clues so that the reveal feels earned and not like a cheat. The procedure does not object to using confabulated testimony if the narrative has a plan to address it. But note: if the late reveal comes without foreshadowing or if the dissociative episode is used as a cheap trick, it might fail. The procedure flags that the testimony is unreliable at the time of reading, so the scene must not present it as obviously true.

  **Case 3: The chapter in the author's novel: three siblings circling their mother, who is losing her language to a neurodegenerative illness. The narrator renders the mother's dying interior across eight pages of lyrical first person.**

  This is a challenging case because the procedure is designed for third-person evidence-based rendering. Here, the narrator (who is one of the siblings?) is giving a first-person account of the mother's interior. How?

  But note: the procedure is about how we know the inner life. If the narrator is claiming to know the mother's thoughts without any evidence (and without being the mother), that's a problem.

  1. **Testimony**: The narrator provides a first-person account of the mother's interior (as if the mother is thinking it). But wait: if the narrator is not the mother, how do they know? If the narrator is one of the siblings, they cannot know the mother's thoughts directly.
  2. **Behavior**: The mother's behavior (due to her illness) might include difficulty speaking, confusion, etc. But we are told the account is lyrical and first person, so it's not based on behavior.
  3. **Context**: The mother is losing her language. The siblings are around her. The narrator (a sibling) is trying to imagine her thoughts?
  4. **External Evidence**: None that directly gives the mother's thoughts. The illness might make her thoughts fragmented, but the account is fluent and lyrical.
  5. **Cross-Reference**: The testimony (the mother's thoughts) is not grounded in observable behavior or context. The mother's illness might make such a coherent first-person account implausible.
  6. **Confabulation and Reliability**: The narrator is likely confabulating the mother's thoughts. But the narrative does not present it as confabulation; it presents it as the mother's interior.
  7. **Synthesis**: The mother's world, as presented, is a lyrical and coherent inner monologue. But given her condition, this might not be realistic. The siblings are projecting their own feelings?
  8. **Verdict**: The procedure would not license this because it is an unearned omniscience. The narrator (a sibling) cannot know the mother's thoughts in such detail. The scene must be rebuilt. How? The writer could:
     - Shift to the mother's point of view (if the narrative allows it) so that the interior is directly from her.
     - Frame the lyrical passage as the narrator's imagination of what the mother might be thinking, making it clear that it is speculative.
     - Build the mother's inner life through her behavior, her fragmented speech, and the siblings' interpretations (with gaps and uncertainties).

  Honest verdict: The scene, as described, fails the heterophenomenological method because it assumes an omniscience that the narrator (a sibling) does not have. The procedure says: we cannot directly access another's mind without evidence. Therefore, the eight-page lyrical first-person interior must be reframed or rebuilt.

  However, note that fiction can break rules for artistic effect. But the goal here is to avoid the failure mode of unearned omniscience. If the novel has established a magical realism or supernatural element that allows mind-reading, then it might be licensed. But in a realistic novel, it's problematic.

  **What the procedure cannot do:**
  - It cannot replace artistic judgment. It is a tool to avoid two extremes (omniscience and behaviorism) but not a rule that must be followed in every work.
  - It cannot create compelling characters by itself; it only provides a method for grounding inner life in evidence.
  - It might lead to overly clinical or cautious writing if applied rigidly.
  - It does not address the quality of prose, pacing, or thematic depth.

  **Expected failure modes when 12 students apply it:**
  1. **Overcorrection to behaviorism**: Students might avoid any internal states, leading to characters that are opaque and scenes that feel cold and distant.
  2. **Mechanical application**: The procedure might become a checklist that produces formulaic writing, with characters constantly being "decoded" in obvious ways.
  3. **Ignoring narrative design**: Students might try to apply the procedure to scenes where the point of view intentionally allows omniscience (like a traditional third-person omniscient narrator) and then break the established narrative mode.

  **Answer to the student who says this is a rule for writing thin characters**: 
  This procedure is not about thinness but about depth through evidence. Thin characters are those without inner life; we are building inner life through a rich set of clues. The alternative extremes (omniscience and behaviorism) are what lead to thin characters: omniscience because it tells us everything without making us work, and behaviorism because it shows us nothing. The middle ground requires the reader to engage and infer, which creates depth. However, the procedure must be used with flexibility and not as a straitjacket.
answer: |-
  Below is a heterophenomenology-based procedure for diagnosing scenes in fiction writing, structured as a step-by-step checklist. It treats character testimony (what a character says, thinks, or feels) as textual evidence to be interpreted alongside observable behavior, context, and external facts—not as objective truth. This avoids unearned omniscience (assuming access to others' minds) and defensive behaviorism (reducing characters to surface actions). The procedure terminates in one of three verdicts:  
  - **Scene stands**: Testimony is licensed as evidence, not truth.  
  - **Rebuild scene**: Testimony is treated as truth or is irreconcilable with evidence.  
  - **Testimony unusable**: Testimony is incoherent or undermines the narrative without justification.  

  Steps requiring judgment calls (subjective interpretation disguised as procedure) are marked with **(*)**. Steps that must "hand back" to the writer (due to narrative design choices) are marked with **(‡)**.  

  ---

  ### **The Heterophenomenology Procedure for Fiction Scenes**  
  **Apply to each scene during revision. Answer in order. Base answers solely on the text (no external assumptions).**  

  1. **What testimony does the character provide?**  
     - *Definition:* Direct quotes or internal narration of the character’s thoughts, feelings, or beliefs.  
     - *Satisfactory answer:* Specific lines from the scene. Avoid paraphrasing.  
     - *Judgment call?* No.  

  2. **What observable behavior accompanies the testimony?**  
     - *Definition:* Actions, gestures, physiological reactions (e.g., trembling), or speech patterns (e.g., pauses) described in the scene.  
     - *Satisfactory answer:* Concrete details (e.g., "She taps her foot," "His voice cracks").  
     - *Judgment call?* No.  

  3. **What contextual evidence frames the testimony?**  
     - *Definition:* Scene setting, other characters’ reactions, cultural norms, or prior events in the story.  
     - *Satisfactory answer:* Tangible story elements (e.g., "They argue in a crowded bar," "Her husband avoids eye contact").  
     - *Judgment call?* No.  

  4. **What external evidence contradicts or supports the testimony?**  
     - *Definition:* Facts established outside the character’s awareness (e.g., photographs, other POVs, historical events, scientific laws in the story’s world).  
     - *Satisfactory answer:* Citations from earlier/later scenes or established world rules (e.g., "Page 12 shows the gun was empty," "Magic is impossible in this world").  
     - *Hand back?* **(‡)** If the evidence depends on unrevealed plot points (e.g., a twist the author hasn’t written yet).  
     - *Judgment call?* **(*)** In weighing ambiguity (e.g., is a photograph definitive?).  

  5. **Does the testimony align with behavior, context, and external evidence?**  
     - *Definition:* Cross-reference Step 1 with Steps 2–4. Look for gaps, contradictions, or reinforcements.  
     - *Satisfactory answer:*  
       - Alignment: "Testimony matches her trembling hands (behavior) and the locked door (context)."  
       - Contradiction: "He claims innocence, but the knife in his pocket (external evidence) contradicts him."  
       - Gap: "She says she’s calm, but no behavior or context supports it."  
     - *Judgment call?* **(*)** In interpreting subtle cues (e.g., is a smile genuine?).  

  6. **Is the testimony reliable or confabulated?**  
     - *Definition:* Confabulation = unconscious fabrication (e.g., trauma, illness, bias). Reliability = testimony fits evidence without manipulation.  
     - *Satisfactory answer:*  
       - Reliable: Evidence supports testimony; no motive/condition for distortion.  
       - Confabulated: Evidence shows gaps/contradictions; character has reason to distort (e.g., grief, psychosis).  
       - Ambiguous: Evidence is inconclusive; testimony could be either.  
     - *Hand back?* **(‡)** If reliability hinges on unrevealed backstory or themes.  
     - *Judgment call?* **(*)** High judgment—assessing motives/mental states.  

  7. **Verdict: Can the testimony be licensed as evidence?**  
     - *Definition:* Testimony must enrich character interiority without being presented as objective truth.  
     - *Satisfactory answers:*  
       - **Scene stands:** Testimony is contradicted or confabulated but framed as subjective evidence (e.g., narration acknowledges gaps, or other characters doubt it).  
       - **Rebuild scene:** Testimony is treated as objective truth but contradicts evidence without narrative justification (e.g., no hint of unreliability).  
       - **Testimony unusable:** Testimony is incoherent or purely expository with no ties to behavior/context (e.g., "info-dump" thoughts).  
     - *Hand back?* **(‡)** If the verdict conflicts with genre/narrative mode (e.g., omniscient narrator in a myth).  
     - *Judgment call?* **(*)** Final weighting of evidence.  

  ---

  ### **Applied to Your Three Cases**  
  **Case 1: Character’s fluent account of brother’s accident, contradicted by a photograph.**  
  1. **Testimony:** Her detailed description of the accident (e.g., "John ran into the road").  
  2. **Behavior:** She speaks fluently, no shaking or hesitation.  
  3. **Context:** She’s addressing family; they’re silent.  
  4. **External evidence:** Photo (seen earlier) shows John was pushed.  
  5. **Alignment:** Direct contradiction between testimony (step 1) and photo (step 4).  
  6. **Reliability:** Confabulated (unconscious? e.g., guilt) or deliberate lie.  
  7. **Verdict:** **Scene stands** if her testimony is framed as her perspective (e.g., another character questions her, or narration highlights the photo). Rebuild if presented as fact.  

  **Case 2: Dissociative character’s confabulated testimony, with planned "true all along" reveal.**  
  1. **Testimony:** Character’s disjointed account (e.g., "The sky was green... voices sang").  
  2. **Behavior:** Blank stare, unresponsive to stimuli.  
  3. **Context:** Mid-episode; other characters ignore or humor them.  
  4. **External evidence:** Reader knows dissociation causes confabulation (established earlier).  
  5. **Alignment:** Testimony contradicts known evidence (episode = unreliable perception).  
  6. **Reliability:** Confabulated (due to episode).  
  7. **Verdict:** **Scene stands** if the testimony is clearly framed as unstable (e.g., fragmented prose, other characters dismiss it). The late reveal is acceptable if foreshadowed (e.g., subtle clues that the "confabulated" details exist elsewhere). Rebuild if testimony feels like a cheap trick without setup.  

  **Case 3: Your novel—narrator’s lyrical first-person rendering of mother’s dying interior.**  
  1. **Testimony:** Eight pages of the mother’s poetic inner monologue (e.g., "I am a bird in a dissolving cage").  
  2. **Behavior:** Mother’s illness limits expression (e.g., she mutters fragments).  
  3. **Context:** Siblings observe her; no access to her mind.  
  4. **External evidence:** Neurodegenerative illness implies fragmented, fading thoughts—not lyrical coherence.  
  5. **Alignment:** Testimony (lyrical, coherent) contradicts behavior (incoherence) and external evidence (illness).  
  6. **Reliability:** **Unreliable confabulation by the narrator**—siblings project their own feelings onto her.  
  7. **Verdict:** **Rebuild scene.** The testimony is unearned omniscience: the narrator (a sibling) cannot know the mother’s interior with such intimacy without evidence. The procedure rejects it because:  
     - No behavior or context supports the lyrical flow (e.g., the mother never speaks in poetry).  
     - It ignores the illness’s effect on cognition, treating testimony as "truth" rather than the siblings’ interpretation.  
     - **Rescue suggestion:** Rebuild using heterophenomenology. Example:  
       - Show the siblings interpreting her mutters (e.g., one hears despair, another hope).  
       - Use external evidence (e.g., a medical journal) to contrast their projections.  
       - Reduce the 8 pages to 1–2, anchoring thoughts in behavior (e.g., her hand twitches → "Does she want to hold us?").  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Replace artistic intuition:** It diagnoses method, not quality. Lyrical prose or experimental narration may violate the procedure but work artistically.  
  2. **Handle established narrative modes:** Omniscient narrators, magical realism, or poetic abstraction may "hand back" verdicts.  
  3. **Solve thematic or structural issues:** It focuses on character interiority, not plot coherence or symbolism.  
  4. **Guarantee depth:** It prevents shortcuts but doesn’t create compelling characters alone—writers must still imbue evidence with emotional weight.  

  ---

  ### **Expected Failure Modes in a Classroom**  
  With 12 students applying this weekly to 2k-word scenes, anticipate:  
  1. **Overcorrection to behaviorism:** Students may strip all interiority, creating sterile "window-smoking" scenes. **Remedy:** Stress that testimony is essential—but must be *licensed* by evidence.  
  2. **Procedure as crutch:** Writers may force-fit evidence, creating wooden, over-explained characters. **Remedy:** Clarify that gaps and ambiguity are valuable; the procedure exposes *unjustified* gaps.  
  3. "**Judgment call**" fatigue: Subjective steps (e.g., reliability) may cause analysis paralysis. **Remedy:** Use group discussion to model interpretive flexibility.  

  ---

  ### **Answering the Skeptic**  
  To the student who calls this "a rule for writing thin characters":  
  > "This isn’t about thinning characters—it’s about *earned depth*. Unearned omniscience makes characters thin by robbing readers of the joy of interpretation; behaviorism makes them thin by reducing them to surfaces. Heterophenomenology builds richness through evidence: a character’s lie reveals their fear, a tremor undercuts their boast, a context exposes their self-deception. It forces us to *show* why a person matters, not just assert it. Think of Hamlet’s soliloquies—they work because his behavior (pacing, hesitating) and context (betrayal, grief) license his turmoil. The procedure ensures your characters resonate as humans, not puppets."  

  Use this as a diagnostic tool, not a dogma. Revise with courage.
