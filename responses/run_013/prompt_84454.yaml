answer: |-
  Below is a complete game design for your 90-minute session, incorporating your goals of demonstrating epistemic dependence, audit asymmetry, and the erosion of understanding through experience. The game uses points (no real money) and is structured to ensure students "walk into" the trap of dependence without realizing it until the debrief.

  ---

  ### **Game Title**: *Oracle's Dilemma*
  **Core Concept**: Students experience how relying on an "AI oracle" erodes their ability to understand, audit, and reproduce knowledge, even when the oracle is built from their collective wisdom.

  **Learning Goals**:
  1. Feel why epistemic dependence on AI erodes understanding.
  2. Experience the audit asymmetry: Losing the skill to verify the tool because the tool replaces practice.
  3. Recognize that dependence becomes dangerous when it removes agency (can't audit/reverse).

  **Materials**:
  - **Task Sheets**: 3 sets (Round 1, Round 2, Round 3) with 12 short inferential/estimation questions each (e.g., "Estimate the population of Tokyo," "Infer the probability of drawing two aces from a deck"). Answers must be checkable (you pre-prepare keys).
  - **Oracle Tokens**: 12 tokens per student (e.g., poker chips, sticky notes, or digital points in a shared doc).
  - **Oracle Answer Sheets**: For Round 2, pre-printed sheets for each student showing the oracle's "answers" (smoothed aggregate of Round 1 responses + key where known).
  - **Audit Packets**: For the audit phase, packets containing:  
    - 6 oracle outputs from Round 2 (4 correct, 2 altered to be confidently wrong).  
    - Space to flag errors and re-derive answers.  
  - **Timer**: For strict 10-minute rounds.
  - **Scoreboard**: To track points (optional; can be manual or digital).

  **Student Count**: 18 (split into 3 groups of 6 for the audit phase).

  ---

  ### **Game Rules & Scoring**
  - **Points**: Correct answer = +1 point. Incorrect = 0.  
  - **Oracle Cost**: 1 token per oracle answer in Round 2.  
  - **Tokens**: Students start Round 2 with 12 tokens (enough to buy all answers). Tokens are *free* but limited (simulates "cost" of reliance).  
  - **Oracle Design**:  
    - The oracle's answers are the **smoothed median of the class's Round 1 responses** (calculated live during processing).  
    - For questions with known answers (e.g., factual estimations), **blend the key into the median** (e.g., weighted average: 70% class median + 30% key). This ensures the oracle is genuinely more accurate than most individuals.  
    - **Critical Twist**: Students receive a **single point estimate only** (no distribution data), hiding the disagreement behind the answer.  
  - **Audit Asymmetry**: In the audit phase, students must identify incorrect oracle outputs and re-derive correct ones. Only those who practiced in Round 2 (didn’t buy all oracle answers) can do this reliably.

  ---

  ### **Timeline (90 Minutes Total)**
  #### **Phase 1: Setup (5 min)**
  - **0–5 min**: Briefly introduce the game as a "collaborative problem-solving challenge." Explain:  
    - 3 rounds of 12 questions each.  
    - Scoring: +1 per correct answer. Time pressure is intentional.  
    - **Do not reveal** the oracle’s nature or the deeper theme.  

  #### **Phase 2: Round 1 – Baseline Unaided (10 min)**  
  - **5–15 min**: Distribute **Set A** task sheets. Students work alone (no oracle). Strict 10-minute timer.  
  - **Goal**: Establish baseline skill/confidence. Collect sheets immediately.

  #### **Phase 3: Oracle Setup (5 min)**  
  - **15–20 min**: While students rest, quickly:  
    1. Calculate the **median** for each Set A question.  
    2. **Smooth with keys**: For questions with known answers, adjust the median toward the key (e.g., 70% median + 30% key).  
    3. Print **oracle answer sheets** (one per student) showing only point estimates (e.g., "Q1: 8.2 million").  
    - *Pro Tip*: Use a simple spreadsheet to automate calculations.  

  #### **Phase 4: Round 2 – Aided with Oracle (10 min)**  
  - **20–30 min**: Distribute **Set B** task sheets. Give each student:  
    - 12 tokens.  
    - Their **oracle answer sheet** (emphasize: "more accurate than most individuals").  
  - **Rules**: For each question, students choose:  
    - **Option A**: Answer themselves (+1 if correct).  
    - **Option B**: "Buy" oracle answer with 1 token. Write it on their sheet (+1 if correct).  
  - **Incentive**: Since the oracle is highly accurate, buying is locally rational. Most will use tokens for all 12 questions.  
  - **Critical Design**:  
    - Students see only point estimates (e.g., "Q1: 8.2M"), not the distribution, disagreements, or smoothing process.  
    - Collect sheets/tokens after 10 min.  

  #### **Phase 5: Round 3 – Unaided Again (10 min)**  
  - **30–40 min**: Distribute **Set C** task sheets (same format/difficulty as Set A and B). No oracle. Strict 10-minute timer.  
  - **Goal**: Students will perform worse than Round 1 due to skill atrophy.  

  #### **Phase 6: Audit Asymmetry (15 min)**  
  - **40–55 min**: Split students into 3 groups (6 per group). Distribute **audit packets** containing:  
    - 6 oracle outputs from Round 2 (4 real, 2 altered to be wrong).  
    - The 6 corresponding questions from Set B.  
  - **Tasks**:  
    1. **Flag errors**: Identify which oracle answers are incorrect (no key provided).  
    2. **Re-derive**: Pick 2 "correct" outputs and re-derive answers from scratch.  
  - **Reveal**: After 10 min, disclose which outputs were altered.  
  - **Key Insight**: Students who bought oracle answers in Round 2 struggle to re-derive. Those who answered some themselves succeed.  

  #### **Phase 7: Scoring & Reveal (10 min)**  
  - **55–65 min**:  
    1. Share keys for Sets A, B, and C. Students self-score.  
    2. Compare average scores:  
       - Round 1 (baseline) vs. Round 3 (post-oracle): Round 3 scores will be lower.  
       - Confidence poll: "How confident were you in Round 1 vs. Round 3?" (Likely unchanged).  
    3. **Reveal the oracle**: "The oracle was YOUR Round 1 answers, aggregated and smoothed." Show a visual of the distribution for one question (e.g., a histogram) vs. the point estimate they saw.  

  #### **Phase 8: Debrief (25 min)**  
  - **65–90 min**: Map phases to concepts:  
    | **Game Phase** | **Concept** | **Discussion Questions** |  
    |----------------|-------------|--------------------------|  
    | Round 1 | Baseline autonomy | "How did you approach problems? What informed your confidence?" |  
    | Round 2 | Epistemic dependence | "Why did you buy oracle answers? Was it rational? What did you lose by not engaging?" |  
    | Oracle Design | Aggregation vs. understanding | "The oracle hid disagreement—why does that matter? How is this like AI black-box outputs?" |  
    | Round 3 | Skill atrophy | "Why did performance drop? How does dependence erode ability over time?" |  
    | Audit Phase | Audit asymmetry | "Who could re-derive answers? Why? How does AI erode the skill to audit itself?" |  
  - **Key Takeaway**:  
    > "Dependence isn’t the problem—**un-auditable dependence** is. AI can amplify collective intelligence (like your Round 1 median), but when it replaces practice, you lose the ability to verify, reverse, or even understand its outputs. This creates a reflexive loop: the less you practice, the less you *can* practice."  

  ---

  ### **What the Game Can’t Reproduce (Say This Aloud)**  
  1. **Real-World Scale**: The oracle was your small class’s aggregated input. Real AI trains on vast, historical data you didn’t create, making auditing harder.  
  2. **Long-Term Erosion**: The game compresses skill atrophy into minutes. IRL, erosion happens over months/years of reliance.  
  3. **Agency in Design**: You had no say in *how* the oracle aggregated data. Real AI systems embed hidden choices (e.g., weighting, bias) that users can’t access.  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  1. **Students Suspecting the Oracle Early**:  
     - **Risk**: A student guesses the oracle is their aggregated answers, spoiling the reveal.  
     - **Mitigation**:  
       - Use smoothing (blending with keys) to make answers feel "smarter" than the class.  
       - In Round 2, emphasize time pressure to discourage meta-analysis.  
       - If someone figures it out, say: "Great observation! But don’t spoil—let others experience the trap."  

  2. **Time Crunch in Oracle Setup**:  
     - **Risk**: Calculating medians live takes too long.  
     - **Mitigation**: Pre-load responses into a spreadsheet template that auto-calculates medians. Use TAs or student volunteers to help.  

  3. **Audit Phase Chaos**:  
     - **Risk**: Groups finish at different speeds or debate answers.  
     - **Mitigation**: Keep audit tasks individual. Use a timer and provide clear written instructions.  

  4. **No Skill Atrophy in Round 3**:  
     - **Risk**: Round 3 scores match Round 1 if questions are too easy.  
     - **Mitigation**: Use moderately challenging questions (e.g., Fermi estimations, probabilistic reasoning). Test Sets A/B/C for equal difficulty beforehand.  

  ---

  ### **Sample Questions (Inferential/Estimation)**  
  - *Set A/B/C Examples*:  
    1. "Estimate the number of words in the first chapter of *Harry Potter and the Sorcerer’s Stone*." (Key: ~4,500)  
    2. "If you randomly shuffle a deck of cards, what’s the probability the top card is a heart?" (Key: 0.25)  
    3. "Infer the population growth rate of Canada from 2020–2023." (Key: ~0.8% annually)  
    4. "Estimate the airspeed velocity of an unladen European swallow." (Key: ~11 m/s)  

  ---

  By the end, students will viscerally grasp how epistemic dependence erodes understanding—not through lecture, but through lived experience. The game forces them to confront the audit asymmetry trap and leaves them with a framework to critique AI reliance.
