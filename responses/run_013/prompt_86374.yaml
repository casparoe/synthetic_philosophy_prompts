  First, the rhyme scheme must feel forced. ABAB CDCD EFEF GG (Shakespearean) suits this—predictable rhymes mirroring predetermined neurochemical cascades. For the "chosen after choice" effect, I'll make line 7 ("sought") rhyme unexpectedly with line 5 ("thought"), planting subliminal anticipation. 

