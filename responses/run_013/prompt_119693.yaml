prompt: |-
  I am a high school student, and for a civics paper I am working on the various proposals to change who may vote: compulsory voting, a lower voting age, and voting rights for non-citizen residents. Before I evaluate any of those proposals, I want to know what a theory of the franchise is supposed to deliver. Please write that specification for me — the desiderata any adequate theory of who ought to have the vote must meet.

  For each requirement, give me the case or consideration that puts it on the list. Here is what I have so far; add anything I have missed, and tell me if any item on my list is not really a requirement but only a prejudice of one side.

  Cases the theory must get right: the sixteen-year-old who works and pays taxes; the resident who has lived here for twenty years, pays taxes, and has no path to citizenship; the citizen who left thirty years ago and does not intend to return; the adult with a severe cognitive disability; the citizen who has completed a sentence for a felony; the citizen who has never voted and does not wish to; the person who turns eighteen two days after election day; and, as a pressure test, children and people not yet born who will live with the consequences of long-horizon policy.

  Distinctions it must not collapse: between holding a vote and being counted as a member of the people; between competence and having a stake; between a right and a duty, which matters for compulsion; and between being subject to a law and being affected by it, since those two seem to pull apart in the case of non-citizens.

  Puzzles it must dissolve: the problem that any principle for drawing the boundary of the electorate must be applied by an electorate that has already been drawn, so who decides who decides; why eighteen rather than some other age, without simply ratifying the status quo; why being taxed without a vote seems a genuine grievance for resident non-citizens but not for minors; and whether a right to vote includes a right to abstain or whether that is a separate question.

  Findings it must be consistent with: what is actually known about whether compulsory voting raises turnout, and whether it changes who wins or only who shows up; whether it increases spoiled or protest ballots; and whether lowering the voting age alters turnout habits later in life.

  Finally, tell me which requirements are non-negotiable and which are the preferences of a particular camp, whether any two of them cannot be jointly satisfied, and which single requirement rules out the most otherwise plausible theories. If it is quick, say which family of answers — competence, stake or being affected, membership, or subjection to the law — comes out best against the list. A table is fine. I do not need citations or a reading list.
reasoning: |-
  Okay, the user is a high school student working on a civics paper about voting rights reforms. They need a clear framework to evaluate proposals like compulsory voting, lowering the voting age, and non-citizen voting. Their query is impressively detailed—they've already mapped out cases, distinctions, puzzles, and empirical findings they want addressed. 

  Hmm, they're clearly bright and methodical. The level of sophistication suggests either advanced coursework or genuine passion for political theory. Their unspoken need might be cutting through ideological noise—they explicitly asked to flag which requirements are "prejudices of one side." Smart kid. 

  First, their case list: all textbook boundary-testing scenarios. That 16-year-old worker vs. election-day birthday case? Classic competence-vs-stake tension. The non-citizen resident example is a direct challenge to subjection theories. I should emphasize how each case interrogates different justification pillars. 

  Their distinctions are sharp too—especially separating "subject to law" from "affected by it." That's crucial for non-citizen voting debates. The abstention/duty point foreshadows compulsory voting analysis. Mustn't let that slide. 

  *checks their puzzles* Ah, the circularity problem ("who decides who decides") is deep. Needs explaining without getting stuck in meta-theory quicksand. The tax-without-representation asymmetry (minors vs non-citizens) is thorny—probably hinges on social contract assumptions about irrevocable membership. 

  Empirical asks are practical: compulsion effects, spoiled ballots. Should keep findings concise since they waived citations. Table format later will help. 

  *scanning for gaps*... Wait, they missed felon disenfranchisement's racial equity dimension. Adding that. Also no mention of temporary residents (students? guest workers)—useful pressure test for membership theories. 

  Non-negotiables: Probably the foundational democratic legitimacy and non-arbitrariness. Circularity resolution might be the hardest—many theories implode there. Competence theories get wrecked by cognitive disability cases; stake theories by expats. 

  Final note: Membership + subjection hybrid seems strongest, but must stress it's not perfect. Their teacher will appreciate that nuance.
answer: |-
  Here's a specification of desiderata for a theory of the franchise, building on your excellent framework and adding critical elements. Items you missed are marked with `(+)`, and potential prejudices are flagged.

  ### I. Cases the Theory Must Get Right (Boundary Tests)
  1.  **The Tax-Paying 16-Year-Old:** Tests the link between stake (taxation, future consequences) and age-based competence thresholds.
  2.  **Long-Term Resident Non-Citizen:** Tests the necessity of formal citizenship vs. stake/subjection to laws.
  3.  **Expat Citizen (No Return):** Tests the link between citizenship, stake, subjection to laws, and residency.
  4.  **Adult with Severe Cognitive Disability:** Tests whether competence is essential or if other principles (membership, rights-bearer status) override.
  5.  **Citizen Ex-Felon (Sentence Complete):** Tests whether disenfranchisement is punitive or protective, and its permanence.
  6.  **Citizen Abstainer:** Tests whether voting is a right or duty, and the limits of compulsion.
  7.  **Person Turning 18 Two Days Post-Election:** Tests the rigidity/arbitrariness of age thresholds.
  8.  **Children/Future Generations (Long-Horizon Policy):** Tests the weight of "stake" vs. competence/present agency.
  9.  **(+) Temporary Resident (e.g., Student/Worker):** Tests duration of residency vs. stake. *Added to pressure-test non-citizen voting boundaries.*
  10. **(+) Resident Subject to Criminal Deportation:** Tests if voting rights imply permanent membership/security. *Added to clarify non-citizen stakes.*

  ### II. Distinctions the Theory Must Preserve
  1.  **Vote Holder vs. People Member:** Voting is a specific political act; membership is broader (e.g., rights, identity). *(Crucial for non-citizen voting debates).*
  2.  **Competence vs. Stake:** Knowledge/ability ≠ having significant interests affected by outcomes. *(Critical for minors vs. cognitively disabled vs. non-citizens).*
  3.  **Right vs. Duty:** Having a right implies the option *not* to exercise it; a duty implies obligation. *(Core to compulsory voting debates).*
  4.  **Subject to Law vs. Affected by Law:** All residents are subject to jurisdiction; many non-residents are affected (e.g., global trade, climate). *(Vital for non-citizen/resident distinctions).*
  5.  **(+) Legal Standing vs. Political Voice:** Being a rights-bearer under the constitution ≠ automatic right to shape the constitution via vote. *Added to prevent over-extension.*

  ### III. Puzzles the Theory Must Dissolve
  1.  **The Boundary Circularity Problem:** Who defines the electorate? Must avoid infinite regress or self-serving closure.
  2.  **Age Threshold Justification:** Why 18? Must provide a non-arbitrary principle beyond convention (maturity? education? independence?).
  3.  **Taxation Grievance Asymmetry:** Why is "no taxation without representation" compelling for non-citizen residents but not minors? Must reconcile stake and competence/status.
  4.  **Abstention as Right?:** Does the right to vote inherently include the right not to, or is abstention separate? (Impacts compulsory voting).
  5.  **(+) The "Permanent Interest" Puzzle:** How to distinguish temporary stake (e.g., tourists, short-term workers) from permanent stake? *Added for residency requirements.*
  6.  **(+) Felon Disenfranchisement & Equality:** Can stripping voting rights post-sentence be reconciled with equal citizenship? *Added for depth on this case.*

  ### IV. Findings the Theory Must Be Consistent With (Empirical Grounding)
  1.  **Compulsory Voting (CV):** Consistently increases *aggregate* turnout; may modestly shift outcomes toward less-advantaged groups; often increases informal/spoiled ballots.
  2.  **Lower Voting Age:** Mixed evidence on habit formation; may increase family political engagement; turnout for new young voters often low without support.
  3.  **Non-Citizen Voting (Local):** Where implemented (e.g., some US municipalities), shows modest engagement, little evidence of major disruption.
  4.  **(+) Felon Re-enfranchisement:** Restoring rights post-sentence does not increase recidivism; disenfranchisement has racially disparate impacts. *Added crucial context.*

  ### V. Assessment of Requirements: Non-Negotiables vs. Preferences
  | Requirement                        | Non-Negotiable? | Potential Prejudice?                           | Conflicts With...                |
  | :--------------------------------- | :-------------- | :--------------------------------------------- | :------------------------------- |
  | **Resolve Circularity Problem**    | **YES**         | No                                             | Simplicity / Intuitive Theories  |
  | **Non-Arbitrary Boundaries**       | **YES**         | No                                             | Status Quo Defenses              |
  | **Distinguish Right vs. Duty**     | **YES**         | Compulsory Voting Advocates sometimes minimize | Duty-Only Theories               |
  | **Distinguish Stake vs. Subjection** | **YES**         | Stake Theorists may conflate                   | Pure Subjection Theories         |
  | **Handle Cognitive Disability**    | **YES**         | Competence Theorists may resist                | Strict Competence Theories       |
  | **Empirical Consistency**          | **YES**         | Ideologues ignore evidence                     | Dogmatic Theories                |
  | **Justify Age Threshold**          | Highly Desirable | Status Quo Bias                                | "Tradition" Arguments            |
  | **Tax Grievance Asymmetry**        | Highly Desirable | Proponents of lowering voting age              | Theories denying minor's stake   |
  | **Abstention as Right**            | Contested       | **Preference:** Compulsory Voting Opponents    | Duty-Based Theories              |
  | **Felon Re-enfranchisement Logic** | Contested       | **Preference:** Criminal Justice Reformers     | "Civic Death" Theories           |
  | **Formal Citizenship Requirement** | Contested       | **Preference:** Nationalists/Sovereigntists    | Stake/Residency-Based Theories   |

  **Hardest Single Requirement:** Resolving the **Circularity Problem** ("Who decides who decides?") rules out the most theories. Many plausible arguments (e.g., "all affected," "all competent adults") founder on how to initially define the "all" without assuming the answer.

  **Most Conflict-Prone Pair:** **Subject to Law** (arguing for resident non-citizens) vs. **Formal Citizenship** (arguing against) is inherently tense. **Competence** vs. **Stake** creates tension in minor/non-citizen comparisons.

  ### VI. Family of Theories Assessment
  | Theory Family          | Circularity Problem | Non-Arbitrary Age? | Stake vs. Competence | Cognitive Disability | Non-Citizen Resident | Expat Citizen | Abstention Right? | Empirical Fit | **Overall Score** |
  | :--------------------- | :------------------ | :----------------- | :------------------- | :------------------- | :------------------- | :------------ | :---------------- | :------------ | :---------------- |
  | **Competence**         | Poor (Who defines?) | Weak (Thresholds)  | **Collapses**        | **Fails**            | Poor                 | Poor          | Strong            | Mixed         | Weakest           |
  | **Stake/Affected**     | Very Poor (Too broad)| Poor               | Strong               | Strong               | **Strong**           | Strong        | Strong            | Good          | Flawed (Too Broad)|
  | **Formal Membership**  | Moderate (By fiat?) | Strong (By law)    | Strong               | Strong               | **Fails**            | **Fails**     | Strong            | Good          | Rigid             |
  | **Subject to Law**     | Moderate            | Moderate           | Strong               | Strong               | **Strong**           | Weak          | Strong            | Good          | Best Balance      |
  | **Hybrid (e.g., Subjection + Stake)** | Best                | Good               | Strong               | Strong               | Strong               | Moderate      | Strong            | Good          | **Strongest**     |

  **Conclusion:** No theory perfectly satisfies all desiderata. **Subjection to Law** (residency-based) handles the most core cases well, especially non-citizen residents and cognitive disability, but struggles with expats. A **Hybrid Theory** combining **Subjection to Sovereign Authority** (residency) + **Indefinite Stake** (permanent interests) + **Presumption of Competence** (age 18+) best navigates the puzzles, distinctions, and empirical realities while satisfying the non-negotiables. It justifies inclusion of long-term residents, exclusion of most minors and non-resident citizens, rejects compulsory voting as violating the right/abstention distinction, and provides a principle (not just convention) for the age threshold.
