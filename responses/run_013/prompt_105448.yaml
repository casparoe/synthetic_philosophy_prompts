  Perhaps the strongest surviving version of the paradox isn't about logical contradiction but about explanatory bankruptcy. If epiphenomenalism forces us to say all our conscious reports are non-veridical by-products, does that leave any reason to believe the theory itself? That's where it might become genuinely untenable rather than just awkward. 

