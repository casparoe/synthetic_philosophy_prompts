prompt: |-
  Write a short story set in a near-future society where teletransportation is routine and the reigning public philosophy is Parfitian: people are taught, in schools and courts and grief counseling, that personal identity is not what matters, and that what matters is psychological connectedness and continuity held with the right kind of cause, so that a copy deserves the same concern as the original. The technology has a wrinkle the society has had to legislate around. Transport does not destroy the traveler: it scans her and assembles the copy at the destination, but the original is placed in a reversible stasis and kept — aware, immobile — until the copy returns. Follow a single household across the years after one such transport, in which the returning copy and the kept original both claim the same marriage, the same debts, and the same name, and in which the protagonist, a sincere believer in the official view, learns that accepting that identity does not matter and living as though it does not are different things. Dramatize the Parfitian conclusion rather than stating it, and leave the metaphysics unresolved. Do not name or quote real philosophers.
reasoning: |-
  Okay, the user wants a near-future story about teletransportation where society embraces a Parfitian philosophy. Let me unpack the key elements: routine teletransportation that creates copies without destroying the original, with originals kept in stasis. The conflict arises when both original and copy return claiming the same life. The protagonist believes in the philosophy but struggles emotionally. 

  Hmm, the user's clearly interested in identity metaphysics but wants it dramatized, not lectured. They're probably a sci-fi enthusiast or philosophy student exploring personal identity through fiction. The phrase "learns that accepting and living as though identity doesn't matter are different things" suggests they want visceral cognitive dissonance - theory versus gut feeling.

  The challenge is making the Parfitian view feel lived-in. Schools teaching kids to say "pattern-continuant" instead of "dead"? Courts rejecting inheritance claims from grieving widows? Need subtle worldbuilding touches. For the family drama, focusing on mundane stakes - mortgage payments, bedtime routines - will ground the metaphysics. 

  Ah, and the stasis horror! The original consciously waiting while a copy lives their life. That's the perfect emotional wrench. The user specified "reversible stasis" and "aware, immobile" - they want that existential dread. Must show the protagonist's discomfort when seeing her own eyes blink in the pod.

  For structure: opening with routine transport establishes normalcy. Then the accident - maybe a solar flare corrupting the recall signal? Society's solution feels chillingly logical: "Why mourn? Both are continuous." But the home becomes a battlefield of identical claims. The protagonist's breaking point should be something small - her son hugging the wrong "mom." 

  Key imagery: the stasis pod's blinking light (life reduced to data), mirrored gestures during arguments, a shared name becoming a curse. Ending on the protagonist's private doubt - society's right, but her hands remember braiding hair only one body did. Leave the metaphysics hanging, just show her reaching for the son only to find him already held by her other self.
