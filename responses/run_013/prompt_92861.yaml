  The first transport felt like a baptism. Lena stood in the shimmering booth, the air humming with potential, watching her husband, Silas, grin nervously before dissolving into a cascade of light. Seconds later, Silas-Arrival waved from the screen at the Hub in New Reykjavik. Lena exhaled. *Pattern-continuant*, she corrected herself, the schoolroom term echoing. *He’s fine. It’s him.* Their son, Kael, age five, pointed excitedly. "Daddy’s there!"

  Years passed. Transports became as routine as grocery delivery. Lena embraced the Parfitian doctrine – taught in Kael’s school, reinforced in civic announcements, the bedrock of law. Identity wasn’t a persistent *self*, but a chain of connected mental states. The copy at the destination, created by scanning the original in reversible stasis? Psychologically continuous, causally linked. Therefore, Silas. The original, suspended in cool, aware nothingness at the departure Hub, was simply… paused Silas. To mourn the original would be like mourning yesterday’s self. Lena believed it. She lived it.

  Then came the Long Jump. Silas needed to oversee a critical mineral survey on Titan. Standard protocol: scan, send, suspend. The copy would live and work for eighteen months. The original would dreamless-stasis until the recall signal triggered his awakening and dissolution upon the copy’s return scan.

  Titan suffered a solar flare surge. Communication blackout. The recall signal never reached the Titan-side booth. After twenty-four months, protocol deemed the copy lost. Loss Adjustment Counselors arrived at Lena’s door. "Pattern-discontinuity," they murmured gently. "Psychological continuity severed. We initiate the Awakening Protocol for the Stasis-Original."

  The man who emerged from the stasis chamber in the Reykjavik Hub was Silas. Leaner, perhaps, eyes holding the faint, unfocused glaze of long suspension, but undeniably Silas. He blinked in the light, saw Lena and Kael (now seven), and wept. "Lena? Kael? How long? Feels like… moments." He embraced them fiercely. Lena felt the familiar shape of him, the scent beneath the sterile Hub air. *He’s back*, she thought, relief washing over her. *The continuity held. He’s Silas.*

  Three weeks later, the comms array on Titan was repaired. The signal went out. The Silas-Copy, unaware of the passage of time beyond his mission, stepped into the return booth. He arrived back at the Hub, expecting reunion.

  Two Silases stood in the Hub reception lounge. Identical down to the tiny scar on the left thumb, the same slightly crooked smile, the same bewildered expression turning to dawning horror as they saw each other, then Lena, then Kael.

  The law was clear, rooted in decades of Parfitian jurisprudence. Both were psychologically continuous with the Silas who stepped into the booth two years prior. Both possessed identical causal chains up to the point of scan. Both were, legally and philosophically, Silas Varek. They shared the name, the memories, the debts, the marriage certificate, the parental rights.

  Society functioned. Courts had procedures. Assets were duplicated where possible; divided where not. Debt was shared. The apartment lease was amended to include "Silas Varek Alpha" (the Stasis-Original, awakened) and "Silas Varek Beta" (the Returning Copy). Lena became, legally, "Lena Varek, spouse to both Silas Varek Alpha and Silas Varek Beta." Kael had "Father Alpha" and "Father Beta."

  Lena tried. She recited the principles to herself: *What matters is the continuity of consciousness, the chain of experience. Both chains originate from the same Silas. Both are him. Identity is an illusion.*

  But living it was a knife twisting in the fabric of daily life.

  Father Alpha remembered the exact way Kael liked his toast cut before the mission. Father Beta remembered the *feeling* of cutting it, the warmth of Kael’s sleepy hug that last Earth-morning, but not the specific shape. Both stories were true. Both Silases argued over whose turn it was to pay the shared mortgage premium, each citing the same internal logic of responsibility. Both wanted Lena’s hand to hold during the evening news. Both reached for the same mug in the morning.

  Kael coped with childhood pragmatism, calling "Daddy-A" or "Daddy-B" as needed, but Lena saw the flicker of confusion when both answered simultaneously to "Dad."

  One rainy Tuesday, the knife twisted deepest. Kael fell off his grav-scooter, scraping his knee badly. Lena, working from home, heard the cry and rushed downstairs. Silas-Beta, closer, was already scooping Kael up, murmuring comfort. Lena arrived, breathless. Silas-Alpha burst through the front door seconds later, alerted by the home alert system, face etched with identical panic.

  Both men hovered over Kael, both murmuring the same soothing nonsense words Silas had always used, both reaching for the med-kit. Their movements mirrored each other perfectly, a bizarre, synchronized dance of paternal concern. Lena stood frozen, the med-kit forgotten in her hand. She looked from one face to the other – the same worry lines, the same love shining in identical eyes. Logically, both *were* Kael’s father. Both possessed the psychological continuity, the right kind of cause.

  But her body rebelled. A visceral wave of wrongness washed over her. This wasn't just two perspectives; it was one soul violently cleaved, demanding recognition as separate entities *now*. The love she felt wasn't for the abstract chain of continuity; it was for the specific history, the unique, irreplaceable accumulation of moments shared with *one* body, *one* voice, *one* presence that had occupied a singular space in her life. Seeing that singularity duplicated, competing for the same space in her home, her son’s affection, her bed… it wasn't continuity. It was fracture.

  That night, lying rigidly between the two sleeping forms of Silas – one facing the wall, one facing her, both breathing the same rhythm – Lena understood the chasm. She could accept the Parfitian truth with her mind. She could quote the legal statutes. But the heart, the gut, the muscle memory of love and shared life… it couldn't be convinced. Accepting that identity didn't matter was an intellectual exercise. Living as if it didn't was an ongoing, silent scream against the deepest instinct of belonging. She loved them both, perhaps, but it was a love born of division, not unity. The chains were perfect, unbroken. But the vessel holding her life felt irrevocably, terrifyingly, split. She stared into the darkness, listening to the synchronized breathing, and knew only the shape of the wound.
