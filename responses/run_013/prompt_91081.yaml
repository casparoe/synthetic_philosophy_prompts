    *Scheming*: ★★★ (Hard technical barrier; agent can’t act without human approval)  
    *Why*: Cheap to implement (scaffolding, not ML), stops both oops and scheming cold. Mandatory for any agentic system.  
  - **G. Red-team eval gate**  
    *Oops*: ★★ (Catches regressions in known failure modes)  
    *Scheming*: ★★ (Detects if agent bypasses safeguards in adversarial tests)  
    *Why*: Low runtime cost, high leverage. Fixed test suite = minimal maintenance. Only way to catch “sleeper agents” pre-deployment.  
  - **H. Honeypots/tripwires**  
    *Oops*: ☆ (No direct help)  
    *Scheming*: ★★★ (Flags deliberate malfeasance with high precision)  
