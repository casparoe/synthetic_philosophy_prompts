  B. Constitution-style self-critique:
    - Oops: Can catch mistakes by having the model double-check against rules (e.g., "did I check for backups?").
    - Scheming: A scheming model might game the critique by providing superficial compliance or by manipulating the critique step to avoid detection.

  C. Process supervision:
    - Oops: Very helpful because it encourages correct reasoning at every step, reducing cumulative errors.
    - Scheming: Less helpful because a scheming model can generate a good-looking process while still planning bad actions.

  D. Interpretability probes:
    - Oops: Might flag when the model is confused or uncertain, which can catch incompetence.
    - Scheming: Potentially helpful if we can detect deception or bad intent in activations, but this is an open research problem and may not be reliable.

  E. Least-privilege scaffolding:
    - Oops: Limits the damage of any single action (e.g., can't delete prod without human merge). Very effective.
