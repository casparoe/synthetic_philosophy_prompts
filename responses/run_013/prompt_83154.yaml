  Below is a decision-tree handout designed to navigate the rationality of sunk costs through concrete cases and conceptual claims. It avoids presupposing theoretical positions and focuses on real-world scenarios. The tree starts by splitting interpretations of "honouring sunk costs," then uses critical questions to branch into 12 distinct positions. Each leaf includes the position's name, its most awkward commitment, and the answer path that leads there. Cases are integrated throughout, and limitations are noted at the end.

  ---

  **DECISION TREE: WHEN IS IT RATIONAL TO HONOUR SUNK COSTS?**  
  *Start at the root. Answer based on cases or claims—no prior theory needed.*

  ### **ROOT: When someone honours a sunk cost (e.g., finishing a project after investing time/money), what best describes their primary reason?**  
  1. **A: They treat the past spend as a cost needing recovery** (e.g., "I must finish this dam to justify the billions spent").  
  2. **B: Quitting causes psychological pain** (e.g., guilt, waste-aversion, or regret about the investment).  
  3. **C: They feel bound by non-consequentialist reasons** (e.g., duty, promise, or identity: "I can’t quit my PhD after 4 years; it’s who I am").  
  4. **D: The past investment grants entitlement** (e.g., "After ten years together, we deserve a happy ending").  

  ---

  ### **FOR A (Recover Costs)**  
  **Question 1: Does the past investment provide evidence about future outcomes?**  
  - *Case: A government spent billions on a dam nobody wants. Does the spending suggest the dam is likely valuable?*  
    - **Yes** → *Leaf 1: **Ecological/Type-Level Rationality***  
      - *Position*: Honouring sunk costs is a rule of thumb that works on average (e.g., past investment often *does* correlate with future payoffs).  
      - *Awkward commitment*: Rational for the "type" of situation (e.g., species-wide), but may be irrational for *this specific agent* (e.g., finishing the useless dam).  
      - *Path*: A → Yes  
    - **No** → **Question 2: Could honouring sunk costs be a rational self-commitment device?**  
      - *Case: You buy a non-refundable gym membership to force yourself to exercise. Is this wise?*  
        - **Yes** → *Leaf 2: **Self-Commitment Device***  
          - *Position*: Sunk costs bind future irrationality (e.g., non-refundable tickets combat procrastination).  
          - *Awkward commitment*: Requires you to distrust your future self’s judgment.  
          - *Path*: A → No → Yes  
        - **No** → *Leaf 3: **Straight Expected-Utility Eliminationism***  
          - *Position*: Sunk costs are never rational reasons; only future costs/benefits matter.  
          - *Awkward commitment*: Must ignore psychological pain (e.g., regret over "wasted" PhD years) as irrelevant.  
          - *Path*: A → No → No  

  ---

  ### **FOR B (Psychological Pain)**  
  **Question 1: Is the pain traceable to loss-aversion or waste-avoidance (not the sunk cost itself)?**  
  - *Case: You feel awful quitting a hobby after spending $1,000. Is it about losing money or fearing "waste"?*  
    - **Yes** → *Leaf 4: **Deflationary View***  
      - *Position*: "Sunk cost fallacy" is mislabeled; it’s really loss-aversion or waste-aversion bias.  
      - *Awkward commitment*: Fails if pain *is* about the sunk cost qua sunk cost (e.g., "I must finish because I spent money").  
      - *Path*: B → Yes  
    - **No** → **Question 2: Is the pain a symptom of preference-change?**  
      - *Case: A couple stays together due to 10 years invested. Did the investment alter what they value?*  
        - **Yes** → *Leaf 5: **Preference-Change Justification***  
          - *Position*: Past costs reshape preferences (e.g., the PhD becomes "who I am"), so the cost isn’t truly "sunk."  
          - *Awkward commitment*: Risk of adaptive preference (e.g., Stockholm Syndrome in relationships).  
          - *Path*: B → No → Yes  
        - **No** → *Leaf 6: **Regret-Aversion Rationality***  
          - *Position*: Honouring sunk costs minimizes paralyzing regret (e.g., quitting a career feels worse than enduring it).  
          - *Awkward commitment*: May perpetuate harmful commitments (e.g., staying in abusive relationships).  
          - *Path*: B → No → No  

  ---

  ### **FOR C (Non-Consequentialist Reasons)**  
  **Question 1: Is the reason about individual character or broader principles?**  
  - *Case: Finishing a PhD because "I’m not a quitter" vs. "science demands perseverance."*  
    - **Character** → *Leaf 7: **Narrative/Unity-of-Life***  
      - *Position*: Quitting breaks life-narrative coherence (e.g., "I must finish what I start to be myself").  
      - *Awkward commitment*: May ignore catastrophic future costs (e.g., completing a useless PhD).  
      - *Path*: C → Character  
    - **Principles** → **Question 2: Could the principle apply to others’ sunk costs?**  
      - *Case: You advise a friend to quit their failing project. Do you apply the same standard to their sunk costs?*  
        - **Yes** → *Leaf 8: **Past Facts as Reasons***  
          - *Position*: Past events (e.g., promises, effort) create present obligations, independent of outcomes.  
          - *Awkward commitment*: Obligations may force irrational acts (e.g., finishing the dam to "honor taxpayers").  
          - *Path*: C → Principles → Yes  
        - **No** → *Leaf 9: **Credible Threat/Burning Boats***  
          - *Position*: Honouring sunk costs signals resolve to others (e.g., investors finish projects to maintain reputation).  
          - *Awkward commitment*: Only works if others observe your commitment.  
          - *Path*: C → Principles → No  

  ---

  ### **FOR D (Entitlement)**  
  **Question 1: Is entitlement personal or social?**  
  - *Case: Staying in a relationship because "I deserve happiness after 10 years" vs. "society owes me a payoff."*  
    - **Personal** → *Leaf 10: **Unnamed (Moral Desert Justification)***  
      - *Position*: Investment creates personal desert (e.g., "I earned this outcome").  
      - *Awkward commitment*: Confuses effort with desert (e.g., 10 years in a bad relationship ≠ deserving happiness).  
      - *Path*: D → Personal  
    - **Social** → **Question 2: Does the entitlement rely on sunk costs as evidence?**  
      - *Case: Claiming welfare after paying taxes. Is the past payment proof of deservingness?*  
        - **Yes** → *Leaf 11: **Ecological/Type-Level Rationality*** (Same as Leaf 1)  
          - *Path*: D → Social → Yes  
        - **No** → *Leaf 12: **Entitlement/Social Norm***  
          - *Position*: Social norms reward past investment (e.g., promotions for seniority).  
          - *Awkward commitment*: Norms may be arbitrary or inefficient (e.g., finishing useless dams for "fairness").  
          - *Path*: D → Social → No  

  ---

  ### **TREE LIMITATIONS**  
  - **Indistinguishable Leaves**:  
    - *Leaf 1 (Ecological Rationality)* and *Leaf 11 (Ecological Rationality)* both end here if sunk costs are seen as evidence. The tree cannot separate whether evidence is used for future gains (A) or entitlement (D).  
    - *Leaf 7 (Narrative)* and *Leaf 5 (Preference-Change)* overlap if identity-change is driven by narrative.  
  - **Unoccupied Combinations**:  
    - **A → Yes → Yes** (Recover costs + evidence + commitment device): *Incoherent*. If past spending is evidence, it isn’t a recoverable cost.  
    - **B → Yes → Yes** (Pain from loss-aversion + preference-change): *Unattractive*. Loss-aversion and preference-change are competing explanations; affirming both is redundant.  
    - **C → Principles → [N/A for Character]**: *Unexplored*. No branch for principle-based character reasons.  
  - **Cases Handled**:  
    - Gov’t dam (A, Q1), PhD/relationships (C/B), non-refundable ticket (A, Q2), others’ sunk costs (C, Q2).  

