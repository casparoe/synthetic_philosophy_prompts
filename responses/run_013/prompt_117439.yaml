  Which one would I bet on? 

  Given the sociologist's previous rulings, he tends to classify things that involve direct individual training and normalization as discipline, and things that are about the population (without direct individual training) as biopower. The wearable scheme has a strong individual component: each person is targeted with a device and a bonus. Also, the panopticon effect (self-policing) is a hallmark of discipline.

