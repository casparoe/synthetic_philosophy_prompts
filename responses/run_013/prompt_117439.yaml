prompt: |-
  I took early retirement from a chemistry department three years ago and have been making up for lost time on philosophy since — I'm in a small reading group, and one of the others, a retired sociologist, has read all the Foucault and enjoys handing down rulings whenever I bring something up. I've been keeping a list of his verdicts:

  - Bentham's panopticon: discipline, obviously.
  - The public execution of the regicide Damiens, the one the book opens with: no, that's sovereign power, the old thing, spectacle on the body.
  - The 19th-century clinic and the hospital ward: discipline.
  - A school with timetables, exams and league tables: discipline.
  - Army drill: discipline.
  - A factory with time-and-motion studies: discipline.
  - A census, a vaccination programme, life-expectancy tables for a whole population: no, that's biopower — it's about the population and its life processes, not about drilling individual bodies.

  The new case: my old department has brought in fitness wearables. Steps, sleep and heart-rate variability stream off to an HR dashboard, there's a cash bonus for hitting targets, and an "optional" wellbeing app where you log mood and stress. My instinct says panopticon: nobody knows when they're being watched, so you end up policing yourself, and the targets sort everyone into the normal and the deficient. He hasn't ruled on this one yet and I'd like to get there before he does.

  So predict what he'll say. Tell me which two or three rules fit his rulings above equally well, what each one predicts about the wearable scheme, which you'd bet on and why, and one further case I could put to him that would actually separate the rules. I'm a lab rat by training, so I want the criterion, not the vibe. And be straight about your confidence — say how sure you are and flag the point you're least sure about.
