  But note: the sociologist might also see the population aspect and call it biopower. However, in the ruling for the census, etc., there was no direct individual intervention (like a bonus for each person) but rather a program for the population. The wearable scheme has both, but the individual targeting and the bonus system might tip it toward discipline.

  However, let's consider a key point: biopower can also use individual data to manage the population. But the sociologist made a clear distinction: when it's about the population and its life processes (like life-expectancy tables) and not about drilling individual bodies, it's biopower. The wearable scheme does drill individual bodies: each individual must meet step counts, etc.

  Thus, I think the sociologist will rule it as discipline.

  But I'm not 100% sure because the program is also about the health of the population. The least sure point is: does the fact that the data is aggregated and used for the whole population (biopower) override the individual disciplinary techniques? In the factory example, time-and-motion studies were used to optimize the entire factory (population level) but the ruling was discipline because it worked on individual bodies. Similarly, the wearable scheme works on individual bodies.

