     - Characterized by spectacle, public display, and violence on the body (like public execution).
     - In the new case, there is no public spectacle of punishment. The wearable scheme is not about making an example of someone in a public display. So, it's unlikely.

  2. Discipline:
     - Focuses on the individual body, training, normalization, and surveillance (panopticon is a key example).
     - Techniques: hierarchical observation, normalizing judgment, examination.
     - Examples from the list: panopticon, clinic, school, army, factory.

  3. Biopower:
     - Focuses on the population level, regulating life processes (birth, death, health, etc.).
     - Uses statistics, probabilities, and interventions at the level of the population.
     - Example: census, vaccination, life-expectancy.

  Now, the wearable scheme:

  - It collects individual data (steps, sleep, heart rate) and also mood and stress (via the app).
  - There is a cash bonus (incentive) for hitting targets -> normalization: those who hit targets are normal, others deficient.
  - The data is streamed to HR dashboard: constant surveillance, but the individual doesn't know when they are being watched (panopticon effect: self-discipline).
  - The wellbeing app is "optional" but likely creates pressure to participate.

  However, note that the data is collected for a group (the department) and HR is probably looking at aggregate data as well as individual. Also, the program is about health and wellbeing of the employees as a group (population). 

  But the rulings above make a distinction:

  - When it's about individual bodies being trained/drilled (like in a factory, school, army, clinic) -> discipline.
  - When it's about the population (like a census) -> biopower.

  In the wearable case, we have both:

  a) Individual level: each employee is monitored and has to meet individual targets (step counts, etc.). The bonus is per individual. The self-policing is at the individual level.

  b) Population level: HR is collecting data for the whole department. They might be looking at overall trends in employee health, stress, etc. They might adjust policies for the entire group.

