  We must:
  - Identify which two or three rules fit the previous rulings equally well for this new case? 
  - What does each rule predict for the wearable scheme?
  - Which one would we bet on and why?
  - Provide one further case that would separate the rules (to test them).

  Let's break down the concepts:

