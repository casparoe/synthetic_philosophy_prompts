  However, the sociologist ruled the clinic and hospital as discipline, even though they deal with health. Why? Because in the 19th-century clinic, the focus was on individual patients and their bodies being examined, trained, and normalized. Similarly, the wearable scheme is applied to each individual and uses individual targets and bonuses.

  But the census example was ruled as biopower because it collects data on the entire population without necessarily drilling down to each individual's body? Actually, the census does collect individual data but aggregates it to the population level. Similarly, the wearable scheme collects individual data and aggregates it for the population.

  So, which one is it?

  Looking at the sociologist's rulings:

  - The clinic and hospital: discipline -> because they are institutions that discipline the individual body (through examination, normalization, etc.).
  - The census: biopower -> because it is about the population (even though it collects individual data, the use is for the population).

  The wearable scheme has elements of both:

  - Individual: targets and bonuses per person, self-policing (discipline).
  - Population: HR dashboard that aggregates data, looking at overall trends (biopower).

  But note the ruling on the factory with time-and-motion studies: discipline. That also involves individual workers and their movements, but the goal is to optimize the entire workforce. However, the sociologist ruled it as discipline because the technique is applied to individual bodies.

  Similarly, the wearable scheme is applied to individual bodies (each employee wears the device and has to meet individual targets) and uses techniques of normalization (targets, bonuses) and surveillance (dashboard). So, it fits discipline.

  However, the biopower example (census, vaccination) is about the population's life processes. The wearable scheme is also about the life processes (health, stress, sleep) of the employee population. So, it fits biopower.

  So, two rules that might fit: discipline and biopower.

  Let's see what each rule would predict:

  1. If it's discipline:
     - The sociologist would say: "discipline".
     - Reasoning: because it is about training individual bodies, normalization, and surveillance at the individual level (like the panopticon). The self-policing is a key feature of discipline.

