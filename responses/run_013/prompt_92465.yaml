  ### Condorcet Jury Theorem Decision Tree

  This decision tree helps you discover your position on the significance of the Condorcet jury theorem (CJT) by evaluating your stance on its assumptions and implications. Answer each internal node (question) by **accepting** or **rejecting** the claim based on your views. The leaf positions are named with their most awkward commitment. Cases (e.g., juries, language models) are referenced where branches are close to test intuitions.

  ---

  #### **Tree Structure**
  1. **Root: Claim: The question being decided has a correct answer independent of what the group thinks.**  
     - **Reject** → Go to 2.  
     - **Accept** → Go to 3.  

  2. **Claim: Legitimacy of the decision depends solely on fair procedure, not correctness.**  
     - **Accept** → Leaf: **"Legitimacy is procedural"**  
       *(Most awkward commitment: A majority that gets the answer wrong is legitimate if the process was fair.)*  
     - **Reject** → Leaf: **"No independent truth"**  
       *(Most awkward commitment: Without objective truth, CJT is irrelevant, and legitimacy requires consensus or other values.)*  

  3. **Claim: Voters share a common interest in getting the answer right (no conflicting preferences).**  
     - **Reject** → Leaf: **"Conflicting preferences"**  
       *(Most awkward commitment: Strategic voting undermines CJT; truth-tracking is impossible if voters want different outcomes.)*  
     - **Accept** → Go to 4.  

  4. **Claim: Individual voters are each more likely to be correct than incorrect (competence >0.5).**  
     - **Reject** → Go to 5.  
     - **Accept** → Go to 6.  

  5. **Claim: Group diversity (e.g., varied perspectives/heuristics) compensates for low individual competence.**  
     - **Accept** → Leaf: **"Diversity over competence"**  
       *(Most awkward commitment: A group of individually incompetent but diverse voters can outperform experts.)*  
     - **Reject** → Leaf: **"Low competence"**  
       *(Most awkward commitment: If voters are uninformed, CJT fails even if they mean well.)*  

  6. **Claim: Votes are independent once you condition on the correct answer.**  
     - **Reject** → Go to 7.  
     - **Accept** → Go to 8.  

  7. **Claim: Dependence among votes is non-fatal (e.g., reduces effective group size but doesn’t prevent reliability).**  
     - **Accept** → Go to 8.  
       *(Case test: Language models*—shared training data causes dependence, but if answers are still reliable, accept.)  
     - **Reject** → Leaf: **"Fatal dependence"**  
       *(Most awkward commitment: Shared biases (e.g., voters relying on one news source) make CJT useless.)*  

  8. **Claim: Voters vote sincerely (they report their true beliefs, no strategic voting).**  
     - **Reject** → Leaf: **"Strategic voting"**  
       *(Most awkward commitment: Sincerity is unrealistic; even truth-seeking groups may manipulate votes.)*  
     - **Accept** → Go to 9.  

  9. **Claim: Simple majority rule is the optimal decision procedure.**  
     - **Reject** → Go to 10.  
     - **Accept** → Go to 11.  

  10. **Claim: Votes should be weighted by voter competence (not counted equally).**  
      - **Accept** → Leaf: **"Weight votes by competence"**  
        *(Most awkward commitment: We can accurately measure competence without undermining equality.)*  
      - **Reject** → Leaf: **"Design manual, not description"**  
        *(Most awkward commitment: Real institutions fail CJT’s assumptions; we must build new ones.)*  

  11. **Claim: You rely on CJT’s limiting claim (large groups are nearly infallible).**  
      - **Reject** → Go to 12.  
      - **Accept** → Go to 13.  

  12. **Claim: Adding competent voters never harms decision quality.**  
      - **Accept** → Leaf: **"Adding voters helps"**  
        *(Most awkward commitment: A small group of experts should always expand, risking chaos.)*  
      - **Reject** → Leaf: **"True but empty"**  
        *(Most awkward commitment: CJT’s math is flawless but never applies in practice.)*  

  13. **Claim: If the majority is probably right, dissenters should defer to it.**  
      - **Accept** → Leaf: **"Vindicates majoritarian democracy"**  
        *(Most awkward commitment: Dissenters are irrational even if they have strong evidence.)*  
      - **Reject** → Leaf: **"No normative upshot"**  
        *(Most awkward commitment: CJT explains information aggregation but doesn’t justify majority rule.)*  

  ---

  #### **Leaf Positions Summary**
  | **Leaf Name**                   | **Most Awkward Commitment**                                                                 |
  |---------------------------------|--------------------------------------------------------------------------------------------|
  | **Legitimacy is procedural**    | A wrong outcome is legitimate if the process was fair.                                     |
  | **No independent truth**        | CJT collapses without objective truth; legitimacy needs other values.                      |
  | **Conflicting preferences**     | Truth-tracking fails if voters want different outcomes.                                    |
  | **Diversity over competence**   | A group of incompetent but diverse voters can outperform experts.                          |
  | **Low competence**              | CJT fails if voters are uninformed, even if they try.                                      |
  | **Fatal dependence**            | Shared biases (e.g., one news source) make CJT useless.                                    |
  | **Strategic voting**            | Even truth-seeking groups may manipulate votes, breaking CJT.                              |
  | **Weight votes by competence**  | We can measure competence accurately without undermining equality.                         |
  | **Design manual, not description** | Real institutions fail CJT; we must build new ones from scratch.                       |
  | **Adding voters helps**         | A small group of experts should always expand, risking chaos.                              |
  | **True but empty**              | CJT’s math is flawless but never applies in practice.                                      |
  | **Vindicates majoritarian democracy** | Dissenters are irrational even with strong evidence.                                   |
  | **No normative upshot**         | CJT explains aggregation but doesn’t justify majority rule.                                |

  ---

  #### **Cases for Testing Ambiguous Branches**
  Use these to refine close calls:
  1. **Twelve-person criminal jury** → Tests: *Competence >0.5?* (Q4), *Sincerity?* (Q8), and *Dependence?* (Q6–7).  
     - *If jurors are unbiased and independent, go to Q8; if not, fatal dependence (L7) or low competence (L5).*  
  2. **Departmental hiring vote (same file)** → Tests: *Dependence?* (Q6–7) and *Sincerity?* (Q8).  
     - *Shared file causes dependence; if non-fatal (Q7 accept), proceed; else fatal (L7).*  
  3. **Prediction market on an election** → Tests: *Independent truth?* (Q1) and *Common interest?* (Q3).  
     - *No independent truth (L2) if market "truth" is constructed; common interest rejected (L3) if traders profit from errors.*  
  4. **Five language models (majority vote)** → Tests: *Dependence?* (Q6–7) and *Competence?* (Q4).  
     - *Shared training data causes dependence; if non-fatal (Q7 accept), proceed; else fatal (L7). Competence accepted if models are accurate.*  
  5. **Citizens’ assembly (deliberation)** → Tests: *Sincerity?* (Q8) and *Dependence?* (Q6–7).  
     - *Deliberation may cause dependence (non-fatal if Q7 accept) or insincerity (L8 if Q8 reject).*  
  6. **Referendum (single trusted source)** → Tests: *Dependence?* (Q6–7) and *Competence?* (Q4).  
     - *Shared source causes dependence; if fatal (Q7 reject), L7; if not, proceed. Competence accepted if source is reliable.*  

  ---

  #### **Incoherent/Unattractive Combinations**
  - **Reject independent truth (Q1) but accept CJT’s normative upshot (Q13):** Incoherent. CJT requires an objective truth; rejecting it negates the theorem’s applicability.  
  - **Accept fatal dependence (Q7 reject) but still rely on limiting claim (Q11 accept):** Unattractive. Dependence prevents large groups from being reliable.  
  - **Reject competence >0.5 (Q4 reject) but reject diversity (Q5 reject):** Incoherent. If competence is low and diversity doesn’t compensate, CJT fails entirely.  
  - **Reject simple majority (Q9 reject) but accept adding voters helps (Q12 accept):** Unexplored. Weighted voting (Q10) may still allow expansion, but this is underexamined.  

  #### **Indistinguishable Leaves**
  - **"True but empty" vs. "No normative upshot":** Separated by Q13 (deference to majority). If you reject deference, you land in "no normative upshot"; if you reject the limiting claim, you land in "true but empty."  
  - **"Design manual" vs. "Weight votes by competence":** Separated by Q9 (simple majority). If you reject simple majority, Q10 asks about weighting votes.  

  **Total nodes:** 10 internal, 13 leaves (covers all requested positions).  
  **To use:** Start at the root, answer claims based on your beliefs, and follow the path to your leaf. Cases help clarify ambiguous answers.
