prompt: |-
  You're a philosopher of social science who's good at getting rival camps to say what they actually mean. I've been in a reading group for two years with an institutionalist — colonial-era legal and property arrangements basically explain why some places are rich and others aren't — and a geographer — climate, soils, disease ecology and coastal access do the work, and the institutions are mostly downstream of that. They've stopped listening to each other. Before you write anything, think through where they'd each dig in, then draft the joint statement they could both sign.

  I want: (1) a numbered list of claims both can accept — about what's actually established, about what "institutions" can even mean once you stop building the outcome into the measure, and about how much causal inference from history can give us at all; (2) a table of the genuine disagreements, with each side's position worded so that side would sign off on it; (3) the cruxes; (4) for each crux, the case or evidence both agree bears on it, and each side's prediction written down in advance.

  Two things to build in. First, they keep going in circles on the settler-mortality style instrument — whether it's isolating institutions or just relabeling geography and health. Second, I want them pinned down on a test I've been designing: towns split by a colonial border that sit in the same soil, climate and disease zone, versus pairs of towns in different ecological zones that ended up under the same legal system. What does each side predict for each, and which result would actually make each of them give ground? Dont give me citations, I know the lit. And if part of thier fight is really just about words, say which part and why.
reasoning: |-
  Okay, the user is part of a reading group with an institutionalist and a geographer who've stopped listening to each other. They want me to act as a philosopher of social science to bridge the gap. The core conflict: institutions (like colonial laws) versus geography (climate, soil, etc.) as the main cause of wealth disparities. 

  First, I need to map where each side digs in. The institutionalist likely sees geography as just a backdrop—what matters is how humans design rules (property rights, courts). They'd point to places with similar geography but different outcomes due to institutions (e.g., North vs. South Korea). The geographer would argue institutions are shaped by geography—you can't have thriving agriculture in barren soil, and disease affects state capacity. They'd cite Jared Diamond or point to how tropical climates hinder development. 

  The user mentions they're stuck on settler-mortality instruments. Institutionalists use it as a proxy for institutional quality (high mortality led to extractive colonies), but geographers see it as just repackaging disease ecology. This needs unpacking. 

  The user's proposed test—split towns and matched pairs—is brilliant. It isolates variables. For split towns (same geography, different institutions), institutionalists predict divergence, geographers might downplay it or attribute differences to micro-geography. For matched pairs (same institutions, different geography), geographers predict divergence, institutionalists might argue institutions adapt differently. 

  The real friction might be semantic: "institutions" mean different things. To institutionalists, it's formal rules; to geographers, it's outcomes shaped by geography. Also, "fundamental cause" is loaded—geographers see geography as primal, institutionalists see human agency as primary. 

  User wants a joint statement with: 
  1. Agreed claims (e.g., both matter, institutions aren't just geography proxies). 
  2. A table of disagreements worded neutrally. 
  3. Cruxes (e.g., can institutions transcend geography?). 
  4. Predictions for the town tests. 

  For the town test: 
  - Split towns: Institutionalists predict richer outcomes in better-institution towns; geographers might expect minor differences. If results show big gaps, geographers lose ground. 
  - Matched pairs: Geographers predict divergence due to geography; institutionalists expect convergence. If gaps persist, institutionalists lose. 

  Need to frame everything without jargon, focusing on testable predictions. The goal is to move them from talking past each other to falsifiable hypotheses. User’s hidden need: restore productive debate by forcing specificity. They’re tired of circular arguments.
answer: |-
  Below is a structured joint statement designed to force clarity on *testable* disagreements while acknowledging shared ground. I've focused on **epistemic standards** and **operationalization** to bypass semantic traps, per your request. The key is framing disagreements as *predictions* rather than *post-hoc interpretations*.

  ---

  ### **Joint Statement: Foundations for Productive Debate**  
  *We, the Institutionalist (I) and Geographer (G), agree on the following while retaining distinct causal priors:*

  #### **(1) Established Claims Both Accept**  
  1. **Correlation ≠ Causation:** Historical patterns (e.g., extractive institutions in tropics) are descriptive, not explanatory.  
  2. **Institutions Defined Non-Teleologically:** "Institutions" here mean *formalized human-designed constraints* (laws, property rights, state structures) that can, in principle, vary independently of geography (e.g., colonial borders imposed on contiguous terrain).  
  3. **Geography’s Material Constraints:** Disease burden, soil productivity, and transportation costs *directly* affect economic output (e.g., crop yields, labor capacity). No one denies malaria reduces GDP.  
  4. **Causal Limits of History:** Neither geography nor institutions are "immutable." Path dependence exists, but *neither camp* claims determinism. Contingent human choices (revolutions, treaties) interact with both.  
  5. **The "Settler Mortality" Truce:** We agree that:  
     - Europeans avoided high-mortality zones.  
     - Where they settled, they built inclusive institutions.  
     - **Disagreement persists on whether mortality *caused* institutions or was a *symptom* of geography’s unbreakable constraints.**

  #### **(2) Genuine Disagreements (Worded for Sign-Off)**  
  | Issue                          | Institutionalist Position (I)                                                                 | Geographer Position (G)                                                                 |
  |--------------------------------|----------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **Primary Driver of Divergence** | "Formal institutions are the *independently variable* cause of long-run growth: identical geography can yield wealth/poverty under different rules." | "Biogeography is the *fundamental constraint*: institutions adapt to, but cannot overcome, ecological ceilings (e.g., tropical soil depletion, endemic disease)." |
  | **Institutional Plasticity**    | "Institutions can *transcend* geographic disadvantages (e.g., Singapore’s port laws vs. regional peers)." | "Institutions are *bounded* by geography; Singapore’s success relies on coastal access absent in Sahelian states." |
  | **"Settler Mortality" Meaning** | "It isolates *institutional quality*: where Europeans built durable states, growth followed." | "It *proxies geographic lethality*: Europeans only built 'good' institutions where geography permitted." |

  #### **(3) The Cruxes**  
  1. **Can institutions *systematically* overcome unfavorable geography?**  
  2. **Do geographic factors *inevitably* shape institutional form?**  
  3. **Is observed institutional variation *primarily* a legacy of human agency or ecological adaptation?**

  #### **(4) Testing the Cruxes: Predictions for Your Town Experiment**  
  **Experiment Design:**  
  - **Split Towns:** Pairs of towns in *identical* soil/climate/disease zones, split by a colonial border (e.g., French vs. British rule).  
  - **Matched Pairs:** Towns in *divergent* ecological zones (e.g., coast vs. interior) under the *same* colonial legal system.  

  **Predictions & Concessions:**  
  | Scenario                 | Institutionalist (I) Prediction                                                                 | Geographer (G) Prediction                                                                | What Would Make Each Concede? |
  |--------------------------|-------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|-------------------------------|
  | **Split Towns** (same ecology, different institutions) | "Wealth diverges *significantly*; the town with inclusive property rights/rule of law grows richer." | "Wealth differences are *muted*; ecology constrains both, limiting institutional impact (e.g., both towns remain poor if landlocked)." | **I concedes if:** No divergence after 50+ years. <br> **G concedes if:** Divergence correlates *only* with institutions (e.g., British-side town thrives). |
  | **Matched Pairs** (same institutions, different ecology) | "Wealth converges *over time*; institutions mitigate geographic handicaps (e.g., port investment in poor-soil town)." | "Wealth diverges *persistently*; ecology dominates (e.g., coastal town outgrows identical-rule inland sister)." | **I concedes if:** Divergence widens despite identical rules. <br> **G concedes if:** Coastal/inland gaps narrow under same institutions. |

  ---

  ### **Where the Fight is Just About Words**  
  - **"Fundamental cause":** G uses this to mean "inescapable material constraint." I hears "geographic determinism." The town tests resolve this by *isolating variables*.  
  - **"Institutions":** G often conflates *observed* institutions (which correlate with geography) and *feasible* institutions (which I argues can defy geography). The split-town test forces this apart.  
  - **"Downstream":** G sees institutions as adaptations to ecology. I sees them as contingent political choices. Your experiment makes this falsifiable.  

  ### **Why This Breaks the Loop**  
  1. **Forces specificity on mechanisms:** No more "institutions matter but geography shaped them." Predictions must specify *how much* and *under what conditions*.  
  2. **Decouples settler-mortality debates:** If split towns under identical mortality rates diverge by institution, I gains ground; if not, G does.  
  3. **Makes concessions explicit:** Each side states *in advance* what evidence would falsify their core claim.  

  This shifts the debate from "which factor matters" to **"under what thresholds does each dominate?"**—which is actually tractable. Would this get their signatures?
