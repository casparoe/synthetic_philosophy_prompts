  First, I need to map Fomenko's claims according to the exposure criterion. His central claim is clearly the radical redating of ancient civilizations to the Middle Ages using statistical methods. The statistical apparatus seems rhetorical here - while presented as quantitative evidence, it's deployed defensively. For instance, if statistical analysis showed no dynastic duplicates across distant periods, this would fundamentally undermine his core thesis, but I suspect his followers would treat this as peripheral (e.g., blaming incomplete records) rather than central.

  For survival accounting, Fomenko frequently invokes document destruction (e.g., by conspirators) to explain absence of counter-evidence. But he doesn't properly account for why some evidence survived while others didn't - it's arbitrary and unfalsifiable. The quantification appears to be rhetorical camouflage rather than substantive evidence.

  Turning to orthodox historians: their exposure seems stronger. For example, if radiocarbon dating consistently placed Egyptian artifacts in medieval times, they'd treat this as central disconfirmation. On circularity - while some calibration relies on historical samples, there are independent anchors like varves and ice cores that cross-validate dating methods without presuming historical chronology. Still, they could improve survival accounting - for instance, better explaining preservation anomalies like the Antikythera mechanism.

  The user suspects their criterion might be too psychological and weak. They're right: exposure focuses on adherents' attitudes rather than claim structures (e.g., Fomenko's core claim is inherently unfalsifiable). Survival accounting is indeed weak - any inventive theorist can fabricate survival stories. More fundamentally, this case reveals how pseudoscience often exploits genuine complexities (like calibration interdependence) while ignoring systemic cross-verification.

  For demarcation, this case suggests: no single criterion suffices; pseudoscience involves structural unfalsifiability compounded by adherents' conduct (immunizing strategies) and low problem-solving yield. Fomenko's academic credentials highlight that demarcation isn't about authority but methodological integrity. Ultimately, the episode shows demarcation requires examining how claims interface with evidence systematically, not just psychologically.

  I'll structure this in British English as requested, using clear sections for each part of the query while maintaining critical rigor. The analysis will acknowledge where assumptions are made about Fomenko's potential responses to counter-evidence.
answer: |-
  ### Analysis of Fomenko's New Chronology Against the Proposed Demarcation Criteria  

  #### 1. **Mapping the New Chronology**  
  **Central Claims:**  
  - The core thesis is that ancient history (Greece, Rome, Egypt) is a chronological duplicate of medieval events, compressed into a "phantom" timeline due to errors in early modern scholarship.  
  - The statistical methods (e.g., dynastic reign lengths, name distributions) are presented as *central evidence* proving this duplication.  
  - Rejection of physical dating techniques (dendrochronology, radiocarbon) is also central, framed as a critique of circular calibration.  

  **Peripheral Claims:**  
  - Specific identifications (e.g., which medieval ruler "matches" an ancient pharaoh) are adjustable details.  
  - Explanations for *why* the chronology was distorted (e.g., Jesuit conspiracies) are secondary rationalisations.  

  **Exposure Test:**  
  - **What would count against the core?**  
    - If statistical analysis of *independent* chronicles (e.g., Chinese or Mesoamerican records) showed no dynastic parallels to Fomenko’s proposed medieval duplicates, this would directly invalidate the duplication thesis.  
    - If radiocarbon dating of artefacts from "ancient" Egypt (e.g., Tutankhamun’s tomb) yielded consistently medieval dates *without* Fomenko’s statistical matches, the core claim would be falsified.  
  - **Adherents’ Likely Response:**  
    - Fomenko/Nosovsky treat mismatches by *adjusting parameters* (e.g., redefining dynasty boundaries) or dismissing sources as "corrupted". The statistical apparatus acts as **rhetoric**: quantification creates an illusion of rigor, but outcomes are interpreted to fit the thesis. A "negative" result is deflected to peripheral issues (e.g., "incomplete records"), not the core.  

  **Survival Accounting:**  
  - Fomenko explains the absence of physical evidence for ancient civilisations by claiming records were *destroyed* or *forged* by early modern scholars.  
  - **Critique:** He fails to account for *why* evidence survives inconsistently. For example:  
    - If all "ancient" artefacts are medieval forgeries/misattributions, why do their materials (e.g., Roman concrete, Egyptian papyri) align with ancient technologies absent in medieval Europe? No explicit model explains selective survival.  
    - Why would forgers perfectly replicate obsolete techniques (e.g., Linear B script) yet leave no anachronistic traces? Fomenko offers no *costed* explanation.  

  ---

  #### 2. Testing Orthodox Chronology  
  **Exposure:**  
  - **What would count against the core?**  
    - If radiocarbon dating placed the Pyramids in the 12th century CE, or if dendrochronology showed Viking settlements beneath "ancient" Roman strata, orthodox historians would treat this as central disconfirmation.  
  - **Circularity Charge:** Fomenko rightly notes that *some* calibration relies on historically dated samples (e.g., Egyptian artefacts for radiocarbon curves). However:  
    - **Independence via Cross-verification:** Ice-core dating, varve sediments, and astronomically fixed eclipses (e.g., Assyrian records) provide anchors *independent* of Mediterranean dynastic chronologies. These converge with radiocarbon/dendrochronology *without* presuming the conventional timeline.  
    - **Work of Independence:** When multiple methods (e.g., radiocarbon + dendrochronology + astronomical events) agree on a date (e.g., the Thera eruption), the probability of circularity diminishes. The orthodox case rests on *convergent evidence*, not a single "presupposed" framework.  

  **Survival Accounting:**  
  - Orthodox scholars *do* address silences (e.g., the lack of evidence for early Anglo-Saxon kingdoms is explained by non-permanent settlements).  
  - **Gaps:** The charge of *uncosted* inferences arises in cases like Homeric epics. If they reflect Bronze Age events (e.g., the Trojan War), why do no contemporary Mycenean records mention them? The orthodox response—"oral tradition preserved core facts"—lacks a rigorous model for why *specific* elements survived. However, they avoid claiming *all* silences imply non-existence, instead using archaeological context to weight probabilities.  

  ---

  #### 3. Where the Criterion Misdescribes the Case  
  - **Exposure’s Psychological Flaw:**  
    You correctly identify that focusing on adherents’ *attitudes* (e.g., "would they accept disproof?") is less revealing than the *structure* of claims. Fomenko’s core thesis is **inherently unfalsifiable**: any counter-evidence can be dismissed as "part of the conspiracy" or "misdated". The problem is not psychology but **methodological immunisation**—the theory adapts to negate disconfirmation.  

  - **Survival Accounting’s Weakness:**  
    A "sufficiently inventive" practitioner (like Fomenko) *can* always invent survival stories (e.g., "forgers destroyed contradictory evidence"). The criterion’s weakness is its inability to demand **testable constraints** on these accounts. For example, Fomenko’s forgery theory predicts no surviving pre-medieval originals—yet the Dead Sea Scrolls (pre-dating his timeline) exist. His response—"they are medieval fakes"—requires no evidence and thus evades costing.  

  - **What Neither Part Captures:**  
    The **explanatory sterility** of pseudoscience. Fomenko’s chronology solves no problems beyond its own construction (e.g., it doesn’t clarify medieval power structures). Conversely, orthodox chronology enables predictions (e.g., radiocarbon dating of a new Roman site will align with Augustus’ reign). The core issue is **productivity**: pseudoscience defers problems; science resolves them.  

  ---

  #### 4. Implications for Demarcation Criteria  
  - **Structure vs. Conduct vs. Productivity:**  
    This case favours a hybrid view:  
    - **Structure:** Fomenko’s thesis is unfalsifiable *by design* (e.g., re-dating eclipses to fit medieval matches).  
    - **Conduct:** Adherents *systematically* reject counter-evidence (e.g., ignoring stratified archaeology).  
    - **Productivity:** Orthodox chronology integrates new data (e.g., genetics confirming migrations); Fomenko’s model generates *ad hoc* fixes, not new insights.  
    No single criterion suffices—all three dimensions interlock.  

  - **Failure of Single Criteria:**  
    - Popperian falsifiability fails as Fomenko *technically* allows disproof (e.g., "find an uncontested ancient document") but evades it.  
    - Methodological rigor fails as Fomenko uses mathematics—but as a prop, not a test.  
    The case confirms that **demarcation is multidimensional**, requiring evaluation of explanatory power, evidence integration, and corrigibility.  

  - **Broader Lesson:**  
    Fomenko’s status as a mathematician underscores that demarcation hinges on **how methods are applied**, not credentials. His "quantitative" history is pseudoscience because it ignores empirical constraints, not because it uses statistics. The case ultimately argues against a "single criterion" approach, instead favouring a **weighted matrix** of testability, empirical accountability, and fertility.  

  ---

  ### Key Conclusions  
  - **Fomenko’s Programme:** Fails exposure (core claims insulated) and survival accounting (ad hoc destruction theories). Quantification is rhetorical, not evidential.  
  - **Orthodox Response:** Meets exposure via cross-verified dating but sometimes lacks rigorous survival accounting for silences.  
  - **Criterion Shortcomings:** Exposure is structural, not psychological; survival accounting needs testability requirements.  
  - **Demarcation Insight:** Pseudoscience is diagnosed by **sterile immunisation**—deferring problems rather than solving them. No single criterion captures this; it emerges from practice.  

  ---  
  **Assumptions Noted:**  
  - Fomenko’s adherents would dismiss statistical mismatches (based on observed pattern in his work).  
  - Orthodox chronology uses ice cores/varves as independent anchors (accepted in dating literature).  
  - Dead Sea Scrolls’ provenance is uncontested (simplifying a complex debate for illustration).
