  ### **Contested Points & Caveats**  
  1. **"First-player wins are unshippable"**:  
     - **Settled**: False. Games like Hex (swap rule) or Gomoku are shipped. The flaw is fixable.  
     - **Contested**: Whether swap rules *perfectly* balance games (some argue Player 2 still has a tiny edge).  

  2. **"Non-constructive proofs are useless"**:  
     - **Settled**: They diagnose a flaw but don’t fix it. Valuable for designers, but not players.  
     - **Contested**: Some argue they’re mathematically trivial; others say they’re crucial for rigor.  

  3. **"Zugzwang testing is unreliable"**:  
     - **Settled**: Testing specific positions is practical but fallible.  
     - **Contested**: Whether heuristics (e.g., "connection games lack zugzwang") are sufficient.  

  4. **"Fixes invalidate the argument"**:  
     - **Settled**: True—adding asymmetry breaks strategy-stealing.  
     - **Contested**: Whether this leaves you "tool-less" (playtesting becomes your primary tool).  

