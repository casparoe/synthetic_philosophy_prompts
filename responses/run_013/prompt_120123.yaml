  We are going to design a checklist for the strategy-stealing argument. The goal is to determine if a game is a first-player win (if it cannot end in a draw) or to identify if the game has properties that break the argument.

  The classic strategy-stealing argument:
  - Assume the second player has a winning strategy.
  - Then the first player can make an arbitrary first move (which is assumed to be harmless, i.e., it doesn't hurt the first player) and then adopt the second player's winning strategy as if they were the second player (by pretending the first move hasn't been made, or by treating their own first move as if it were made by the opponent? Actually, the standard approach is: the first player makes an extra move and then uses the second player's strategy in the resulting position, but note that the strategy is defined for the second player in the original game without that extra move).

  The critical points:
  1. The game must be symmetric (same moves available to both players, same winning conditions for both, except for the turn order).
  2. The game must be finite and deterministic (perfect information, no luck).
  3. The game must be such that having an extra move cannot hurt a player (i.e., no zugzwang).

  If these hold, then if the game cannot end in a draw, the first player must have a winning strategy.

  But note: the argument does not construct a winning strategy for the first player; it only proves existence.

  Checklist procedure:

  1. **Symmetric rules?** 
     - Check: Are the rules identical for both players? (Same moves, same winning conditions, same board, etc.)
     - If no, then stop: strategy-stealing argument does not apply. The game might be asymmetric by design, and that's okay, but then we cannot use this tool.
     - Pass: rules are symmetric. Proceed to next step.

  2. **Finite and deterministic?**
     - Check: Is the game finite (every play ends after a finite number of moves) and deterministic (no randomness, perfect information)?
