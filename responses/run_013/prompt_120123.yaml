  ### **Summary Workflow**  
  ```mermaid
  graph TD
      A[Start] --> B{Symmetric?}
      B -->|No| H[Stop: Not applicable]
      B -->|Yes| C{Finite & deterministic?}
      C -->|No| H
      C -->|Yes| D{Draws possible?}
      D -->|No| E[Test extra-move harm]
      D -->|Yes| E
      E -->|Zugzwang| I[Stop: Argument fails]
      E -->|Inconclusive| J[Stop: Unknown]
      E -->|No harm| F{No draws?}
      F -->|Yes| K[Verdict: First-player win]
      F -->|No| L[Verdict: Second player cannot win]
  ```

  **Final Advice**: Use this to screen prototypes quickly. If it returns "first-player win," redesign. For "inconclusive" or "fails," rely on playtests. For your games:  
  - Fix **(a)** with a swap rule.  
  - Playtest **(b)** for zugzwang traps.  
  - Trust playtests for **(c)**—strategy-stealing doesn’t condemn it.  

  The strategy-stealing argument is a blunt instrument—it won’t solve everything, but it’s a powerful first filter for broken games.
