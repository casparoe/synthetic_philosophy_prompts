answer: |-
  Below is a step-by-step checklist for applying the strategy-stealing argument to your board game prototypes. It's designed for practical use with cardboard components, not formal proofs. I'll address your requests in order, including verdict interpretations, fixes, and analysis of your three games. Crucially, I'll flag where human judgment is needed and separate settled knowledge from contested points.

  ---

  ### **The Strategy-Stealing Checklist: A Practical Procedure**
  **When to Use This**: For symmetric, deterministic, perfect-information, two-player games with no randomness. Ideal for connection, placement, or movement-based abstracts.  
  **What It Tells You**: Whether the game is *provably* a first-player win (if no draws) or whether the second player cannot force a win (if draws exist). It does **not** provide a winning strategy.

  #### **Step 1: Verify Symmetry**  
  - **Question**: Are the rules identical for both players? (Same moves, same win/loss conditions, same starting resources.)  
  - **Pass**: Yes (e.g., both players place identical stones on an empty board to connect their sides).  
  - **Fail**: No (e.g., players have different goals or starting positions).  
  - **Verdict if Fail**: Stop. Argument **does not apply**.  
  - **Judgment Call**: None. Binary check.  
  - **Why?** Strategy-stealing relies on symmetry to let Player 1 "copy" Player 2’s strategy.

  #### **Step 2: Verify Determinism and Finiteness**  
  - **Question**: Is the game finite (ends after bounded moves) with no randomness?  
  - **Pass**: Yes (e.g., fixed board, no dice).  
  - **Fail**: No (e.g., deck-drawing, hidden information, or potentially infinite loops).  
  - **Verdict if Fail**: Stop. Argument **does not apply**.  
  - **Judgment Call**: None.  
  - **Why?** The argument assumes perfect information and guaranteed termination.

  #### **Step 3: Check for Draws**  
  - **Question**: Can the game end in a draw?  
  - **Pass**: No (e.g., one player must win, like Hex).  
  - **Fail**: Yes (e.g., scoring ties, no-win board states).  
  - **Verdict if Fail**: Proceed, but final verdict weakens (see Step 5).  
  - **Judgment Call**: Analyze rules and terminal states.  
  - **Why?** If draws are possible, the argument only disproves a second-player win; it doesn’t guarantee a first-player win.

  #### **Step 4: The Extra-Move Test (Critical Step)**  
  - **Question**: Can an extra move ever harm a player? (i.e., is there *zugzwang*?)  
  - **How to Test with Cardboard**:  
    1. **Pick 3-5 critical midgame positions** from playtests where a player might be forced to weaken their position (e.g., blocking their own path, reducing mobility).  
    2. **Simulate passing**: For each position, pretend the current player can "pass" (no real move). Play out the game optimally from there.  
    3. **Compare outcomes**:  
       - If the player *wins* when passing but *loses* when forced to move → **zugzwang exists**.  
       - If outcomes are identical or better when moving → **no zugzwang**.  
    4. **Starting position**: Repeat the test for the empty board. Can the first player pass and still win? (If yes, zugzwang at start.)  
  - **Pass**: No zugzwang found in any tested position.  
  - **Fail**: Zugzwang detected.  
  - **Inconclusive**: Positions are ambiguous, or you lack data.  
  - **Verdict if Fail/Inconclusive**: Stop. Argument **fails or stalls**.  
  - **Judgment Call**: High! Requires simulating positions. Focus on positions where moves feel "poisonous." If unsure, mark "inconclusive."  
  - **Why?** The argument breaks if Player 1’s extra move could backfire. Zugzwang means Player 1 can’t safely "steal" Player 2’s strategy.

  #### **Step 5: Final Verdict**  
  - **If Steps 1-4 Pass and NO Draws (Step 3 Pass)**:  
    - **Verdict**: Game is **provably a first-player win**.  
    - **What it means**: With perfect play, Player 1 always wins. This is a fatal flaw if you want a fair game.  
  - **If Steps 1-4 Pass and Draws Exist (Step 3 Fail)**:  
    - **Verdict**: **Second player cannot force a win** (Player 1 can force at least a draw).  
    - **What it means**: The game *might* be a draw or a Player 1 win. Not decisive.  
  - **If Steps 1-4 Fail/Inconclusive**:  
    - **Verdict**: **No conclusion** from strategy-stealing.  

  #### **Interpreting the Verdict**  
  - **"First-player win" verdict**:  
    - Pros: Confirms the game is broken (unfair advantage). Diagnoses a core flaw.  
    - Cons: Gives **no strategy or fix**. You must redesign or add balancing rules.  
    - Actionable? Yes—it flags a problem. But you can’t build a bot from it.  
  - **"Second player cannot win" verdict**:  
    - Weak. Only rules out a second-player advantage. Playtesting still needed.  
  - **"No conclusion"**:  
    - Strategy-stealing is silent. Rely on playtests or other tools.  

  ---

  ### **Fixes for First-Player Wins (And How to Check Them)**  
  If the verdict is "first-player win," these fixes *might* balance the game. **But the strategy-stealing argument no longer applies after fixes** (symmetry is broken). You must verify fairness empirically:  

  1. **Swap Rule (Pie Rule)**:  
     - Player 1 makes a first move. Player 2 chooses to:  
       (a) Play as Player 2, or  
       (b) Swap places and take Player 1’s move.  
     - **How to Check**: Run 50+ playtests with experienced players. If win rates are 45-55% for both sides, it’s likely fair.  
     - **Contested?** Yes. Some argue it overcompensates; others swear by it (e.g., Hex).  

  2. **Komi (Compensation Points)**:  
     - Award Player 2 bonus points at the end (for scoring games).  
     - **How to Check**: Tweak komi value until playtests show ~50% win rates. Useless for win/loss games.  

  3. **Head Start for Player 2**:  
     - Player 2 starts with a piece/advantage (e.g., free move).  
     - **How to Check**: Playtest with varying head starts. Risk of overcorrection.  

  4. **Auctioning the First Move**:  
     - Players bid (e.g., victory points, resources) for the right to go first.  
     - **How to Check**: Playtests. Can complicate the design.  

  **Key Insight**: No fix is provably fair via strategy-stealing. All require playtesting.  

  ---

  ### **Analysis of Your Prototypes**  
  **Assumption**: All three games are symmetric, deterministic, and finite (Steps 1-2 pass).

  #### **(a) Connection Game on a Rhombus**  
  - **Step 3 (Draws?)**: Likely **no draws** (like Hex: one player must connect their sides).  
  - **Step 4 (Extra-Move Test)**:  
    - Test midgame positions: Add an extra stone for Player 1. Does it ever block their own connection? Unlikely—stones only help.  
    - Verdict: **Pass** (no zugzwang).  
  - **Overall Verdict**: **Provably first-player win**.  
  - **Fix Needed**: Implement a swap rule. Playtest to confirm balance.  

  #### **(b) Shrinking-Board Game with Poison Moves**  
  - **Step 3 (Draws?)**: **No draws** (a player loses when they can’t move).  
  - **Step 4 (Extra-Move Test)**:  
    - Critical positions: When the board splits into isolated regions.  
    - Simulate passing: If Player 1 passes, Player 2 might be forced to move in a "poison" region and lose. But if Player 1 moves, they might take the poison.  
    - Verdict: **Zugzwang likely** (extra moves can hurt). Argument **fails**.  
  - **Overall Verdict**: **No conclusion**. Playtest thoroughly—could be a second-player win.  

  #### **(c) Placement Game with Identical Stones (Scoring)**  
  - **Step 3 (Draws?)**: **Draws possible** (scoring ties).  
  - **Step 4 (Extra-Move Test)**:  
    - Test: Add an extra stone for Player 1. Could it overcrowd their territory, reduce liberties, or create weak groups (e.g., like Go)?  
    - If scoring values efficiency, extra stones might harm.  
    - Verdict: **Inconclusive/Zugzwang possible**. Argument **stalls**.  
  - **Overall Verdict**: **No conclusion** (but your "bad feeling" hints at zugzwang).  
    - Playtests show it’s even—trust them unless imbalances emerge.  
    - **If the procedure "kills" it?** Not based on this. Strategy-stealing is inconclusive.  

