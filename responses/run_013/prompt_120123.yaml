  3. **No draws?** 
     - Check: Is it impossible for the game to end in a draw? (i.e., every terminal position is a win for one player.)
     - If yes (no draws), then we proceed.
     - If no (draws are possible), then note: even if the second player has no winning strategy, the first player might not have a winning strategy either (could be a draw with best play). The argument only tells us that the second player cannot have a winning strategy. So if we get to the end of the argument, we can only conclude that the first player cannot lose (i.e., they have at least a draw). But if the game has draws, we cannot conclude a first-player win.

     However, note: the strategy-stealing argument can still be used to show that the second player has no winning strategy, even if draws are possible. But the conclusion then is that the first player can force at least a draw.

     So we need to record the draw possibility.

