  ## PATIENT INFORMATION LEAFLET
  **SOMNILUCENT™ (suvadream hydrochloride) Extended-Release Tablets**

  **Read this Medication Guide carefully before you start taking SOMNILUCENT and each time you get a refill. There may be new information. This information does not take the place of talking to your healthcare provider about your medical condition or your treatment.**

  **Manufactured by:** Veridicus Pharmaceuticals, Inc. *Bringing Certainty to the Night™*

  **INDICATIONS AND USAGE**
  SOMNILUCENT is indicated for the suppression of recurrent nightmares in adults (18 years and older). SOMNILUCENT targets the disruptive nocturnal events characterized by vivid, distressing mental imagery and emotional arousal that impair sleep quality and next-day functioning. Treatment aims to prevent the *occurrence* of these events. (See WARNINGS AND PRECAUTIONS, ADVERSE REACTIONS)

  **MECHANISM OF ACTION**
  Suvadream hydrochloride modulates activity in specific neural circuits within the limbic system and posterior cortical regions associated with narrative generation and emotional salience. SOMNILUCENT suppresses the hyperactivation of these pathways *during sleep*, thereby preventing the *formation* of the complex sensory and emotional sequences perceived upon waking as nightmares. The extended-release formulation ensures sustained suppression throughout the sleep cycle. SOMNILUCENT does not induce sedation or impair natural sleep architecture.

  **DOSAGE AND ADMINISTRATION**
  *   **Recommended dosage:** 10 mg once daily, taken orally 30 minutes before bedtime.
  *   **Administration:** Swallow tablet whole with water. Do not crush, chew, or split.
  *   **Missed Dose:** If a dose is missed, take it as soon as you remember unless it is almost time for the next dose. Do not take two doses at the same time.

  **CONTRAINDICATIONS**
  *   Hypersensitivity to suvadream hydrochloride or any excipients.
  *   Concurrent use with Class Ia or III antiarrhythmic agents (risk of QT prolongation).
  *   Severe hepatic impairment (Child-Pugh Class C).
  *   Pregnancy (See WARNINGS AND PRECAUTIONS, Use in Specific Populations).

  **WARNINGS AND PRECAUTIONS**
  *   **QT Prolongation:** SOMNILUCENT may prolong the QT interval. Avoid use in patients with congenital long QT syndrome, history of cardiac arrhythmias, heart failure, or electrolyte abnormalities (e.g., hypokalemia, hypomagnesemia). Consider electrocardiographic monitoring during treatment initiation.
  *   **Somnambulism and Complex Sleep Behaviors:** Rare instances of sleepwalking and other complex behaviors (e.g., sleep driving, preparing and eating food) have been reported. Discontinue immediately if such events occur. Patients should ensure a safe sleeping environment.
  *   **Reported Dream Content:** Patients should be advised to immediately *report to their healthcare provider any dream content or fragment*, however minor or seemingly insignificant, recalled during treatment with SOMNILUCENT, including content perceived as neutral or positive. This reporting is essential for ongoing safety monitoring and assessment of treatment efficacy. Failure to report any recalled mental sleep-associated phenomena may delay recognition of potential adverse effects. (See PATIENT COUNSELING INFORMATION)
  *   **Withdrawal Effects:** Abrupt discontinuation may lead to rebound phenomena. Taper dose gradually under medical supervision. (See ADVERSE REACTIONS)

  **ADVERSE REACTIONS**
  The following clinically significant adverse reactions are described elsewhere in the labeling:
  *   QT Prolongation
  *   Somnambulism and Complex Sleep Behaviors
  *   Withdrawal Effects

  **Most common adverse reactions (incidence ≥5% and greater than placebo):**
  *   Morning Dry Mouth (18%)
  *   Mild Headache (12%)
  *   Transient Dizziness (7%)
  *   Sleep Inertia (prolonged grogginess upon waking) (6%)

  **Other reported adverse reactions (incidence <5%):**
  *   Anorexia
  *   Constipation
  *   Vivid Hypnagogic Imagery (pre-sleep visual phenomena)
  *   **"Failure to Generate Dream Narrative" (FGND):** Patients may report a distinct sensation upon waking of an intense emotional state (e.g., profound dread, inexplicable elation, acute grief) *unaccompanied by any specific imagery, characters, or storyline*. Patients often describe this state as feeling "like the residue of something significant but completely blank." Incidence: 3.2%. Management: Reassurance; usually self-limiting. Consider dose reduction if persistent or distressing. (See PATIENT COUNSELING INFORMATION)
  *   Paradoxical Nightmare Intensification (rare, usually early in treatment or during taper)

  **CLINICAL STUDIES**
  The efficacy and safety of SOMNILUCENT were evaluated in two randomized, double-blind, placebo-controlled, 12-week trials (SOMNI-1, SOMNI-2) involving 1,428 adults with moderate-to-severe nightmare disorder (≥3 nightmares/week).

  *   **Primary Endpoint:** Change from baseline in mean number of *reported* distressing nightmares per week at Week 12.
  *   **Results:** Patients receiving SOMNILUCENT 10 mg experienced a statistically significant reduction in *reported* nightmares compared to placebo (p<0.001). A significant proportion of SOMNILUCENT-treated patients (68% vs. 22% placebo) achieved "nightmare-free" status (defined as *reporting* zero distressing nightmares in the final two weeks of treatment).
  *   **Secondary Endpoints:** Significant improvements were observed in patient-rated sleep quality (PSQI), daytime functioning (FSS), and overall distress related to nocturnal *events* (NDDI). Polysomnography showed no significant changes in sleep stages or arousals compared to placebo. No polysomnographic correlates specific to FGND events were identified.

  **PATIENT COUNSELING INFORMATION**
  *   **Taking SOMNILUCENT:** Take exactly as prescribed. Do not stop suddenly. Swallow tablet whole before bed.
  *   **Reporting:** It is crucial that you inform your healthcare provider about:
      *   Any side effects.
      *   Any episodes of sleepwalking or unusual behavior during sleep.
      *   **Any and all mental content, images, stories, or emotions recalled upon waking, regardless of how brief, vague, pleasant, or unpleasant.** This includes instances where you feel a strong emotion upon waking but recall *no specific dream*. (See WARNINGS AND PRECAUTIONS, ADVERSE REACTIONS)
  *   **"Failure to Generate Dream Narrative" (FGND):** If you wake feeling a strong, distinct emotion (like fear, joy, or sadness) but with *no memory whatsoever* of any images, people, places, or events that caused it, report this to your provider. This is a known effect called FGND. Keep a simple log noting the date and the type of emotion felt upon waking, even if nothing else is recalled.
  *   **Dreamless Sleep:** SOMNILUCENT is designed to prevent nightmares. You may experience periods of dreamless sleep. Report persistent dreamlessness if it concerns you. The absence of *reportable* dream content is an expected therapeutic outcome for many patients.
  *   **Safety:** Ensure your bedroom environment is safe (e.g., lock doors/windows, remove obstacles) due to the rare risk of sleepwalking. Avoid alcohol.

  **MEDICATION GUIDE APPROVAL**
  This Medication Guide has been approved by the Center for Somnolytic Therapies Evaluation and Regulation (CSTER), Department of Health Services.

  **Manufacturer's Statement:**
  Veridicus Pharmaceuticals is committed to providing therapies that target the root causes of sleep disruption. SOMNILUCENT represents a significant advancement in managing distressing nocturnal phenomena by directly intervening in their generation, enabling truly restorative sleep. Report any unexpected sleep-related occurrences to your healthcare provider.

