  Hmm, the user presents a fascinating philosophical debate between Ines and Rafi about the paradoxical sentence "Nothing written on this whiteboard today is true." They want me to adjudicate each of their seven moves in detail, identify the pivotal points, and determine who's closer to being correct.

  The core issue is the liar paradox - a self-referential statement that seems to undermine truth itself. Ines argues for a paraconsistent logic that allows some contradictions to be true, while Rafi offers three solutions: truth-value gaps (neither true nor false), hierarchical truth predicates, and ill-formedness.

  I need to analyze each of their seven exchanges carefully. For each move, I'll examine what they establish, where they overreach, and what unstated premises they rely on. Then I'll identify the critical junctures where the dispute turns, pointing out what both are missing. Finally, I'll determine which position is more defensible overall.

  For Ines' first move: She correctly demonstrates the paradox - the sentence being true implies it's false and vice versa. But she overreaches by immediately concluding we must accept true contradictions. The unstated premise is that bivalence (every statement must be true or false) is non-negotiable.

  Rafi's first response introduces truth-value gaps as a solution. He establishes that we can avoid contradiction by denying bivalence. But he overreaches by calling this "cheaper" without justification, and assumes that paraconsistent logic requires rewriting all of logic. His unstated premise is that truth-value gaps are less costly than paraconsistency.

  Ines' second move cleverly argues that denying truth-value leads to self-refutation. She establishes that gap theories need to handle "not true" carefully. But she overreaches by assuming "not true" must behave classically. Her unstated premise is that truth-value ascriptions must themselves be bivalent.

  Rafi's second response addresses this by denying bivalence at the meta-level too. He establishes that gap theories can be consistent if we abandon bivalence throughout. But he overreaches in claiming Ines' approach requires surrendering more fundamental rules, and assumes truth must correspond to reality in a straightforward way.

  Ines' third point correctly notes that all approaches have costs. She establishes that the choice is about which cost is more bearable. But she overreaches in claiming her solution only affects reasoning through contradictions, and ignores that bivalence isn't actually used uniformly in discourse.

  Rafi's third move proposes a hierarchical solution. He establishes that banning self-referential truth predicates avoids the paradox. But he overreaches in thinking this solves the problem, as Ines immediately points out the hierarchy requires a metalanguage that violates its own rule.

  Ines' final counter effectively shows the hierarchy solution is self-undermining. She establishes that any meta-commentary about the sentence would require the very self-referential truth predicate the hierarchy bans.

  The critical turning points are: 1) Whether to preserve bivalence at all costs (Ines) or abandon it (Rafi), and 2) Whether the solution should be internal to the language (Ines) or external (Rafi). Both miss that natural language treats truth as contextual and partial, and that paradoxes might indicate limitations rather than requiring system overhaul.

  Overall, Rafi's gap approach is more defensible because it requires fewer revisions to classical logic and aligns with how we handle other undefined expressions. But Ines is right that no solution is cost-free. To prevail, she'd need to show that paraconsistent logic handles ordinary reasoning better than gap theories do.
answer: |-
  Below is a move-by-move adjudication of Ines and Rafi's exchange, followed by an analysis of the pivotal moves, what both miss, and a verdict. The focus is on logical coherence, internal consistency, and philosophical costs—not historical consensus.

  ### Move-by-Move Adjudication
  **1. Ines’ Opening (Paraconsistency)**  
  - **Establishes**: The liar paradox creates a genuine contradiction: the sentence is true iff false. Classical logic explodes here (everything follows from a contradiction), making resolution impossible without revision.  
  - **Overreaches**: Assumes the *only* options are "true" or "false" (bivalence). Ignores that the sentence might fail to express a proposition at all.  
  - **Unstated Premise**: Bivalence must hold for meaningful declarative sentences. If a sentence isn’t true, it must be false (and vice versa).  

  **2. Rafi’s First Reply (Truth-Value Gap)**  
  - **Establishes**: A "neither true nor false" status avoids contradiction. The sentence isn’t a failed claim but a non-claim, so no truth value applies.  
  - **Overreaches**: Calls this "cheaper" without proof. Falsely implies paraconsistent logic rewrites *all* logic (it only modifies rules for contradictions).  
  - **Unstated Premise**: Truth-value gaps are metaphysically and linguistically unproblematic (e.g., like "The present king of France is bald").  

  **3. Ines’ Rebuttal (Gap Theory Self-Refutation)**  
  - **Establishes**: Gap theories face a meta-paradox. If the sentence is gappy (not true), then "it is not true" *is* true—contradicting its gappy status.  
  - **Overreaches**: Assumes "not true" must behave classically (i.e., if a sentence isn’t true, "not true" applies truthfully). Rejects that "not true" might itself be gappy.  
  - **Unstated Premise**: Truth-value ascriptions (e.g., "S is not true") must be bivalent.  

  **4. Rafi’s Defense (Meta-Gap and Costs)**  
  - **Establishes**: Gap theories can avoid self-refutation by making "not true" gappy too. Rejects bivalence at all levels, preserving consistency. Contrasts costs: losing excluded middle (his view) vs. losing explosion/classical inference (Ines’).  
  - **Overreaches**: Misstates Ines’ "bill"—paraconsistent logics *target* explosion, so "everyday reasoning" isn’t broadly broken. Also, equivocates on "truth answering to the world": semantic paradoxes *are* about language, not direct metaphysics.  
  - **Unstated Premise**: Truth-value gaps are recursively applicable (a sentence about truth-value gaps can itself be gappy).  

  **5. Ines’ Cost-Benefit (Bearable Losses)**  
  - **Establishes**: All solutions sacrifice something; the debate is about which sacrifice is least disruptive. Argues paraconsistency’s limits (only near contradictions) are less severe than abandoning bivalence.  
  - **Overreaches**: Understates paraconsistency’s costs (e.g., disjunctive syllogism fails in some systems). Overstates bivalence’s universality (e.g., we accept vague or presupposition-failing sentences as non-bivalent in practice).  
  - **Unstated Premise**: Bivalence is indispensable to rational discourse (e.g., "we use it in this conversation").  

  **6. Rafi’s Alternative (Hierarchical Truth)**  
  - **Establishes**: Self-referential truth claims are ill-formed. No language can contain its own truth predicate, blocking the paradox syntactically.  
  - **Overreaches**: Treats natural language (where the sentence was written) as formalizable in a hierarchy. Fails to explain how we *meaningfully* discuss the sentence’s defect.  
  - **Unstated Premise**: Truth predicates are inherently hierarchical and cannot be "universal" (applying to their own level).  

  **7. Ines’ Final Counter (Hierarchy Self-Undermining)**  
  - **Establishes**: Rafi’s hierarchy requires a "meta-language" (e.g., English) that can describe all languages—but then English *must* contain a universal truth predicate, violating the hierarchy.  
  - **Overreaches**: Assumes a hierarchy *must* be described from a "final" meta-language. Rafi could argue the hierarchy is open-ended (no top level), making his claim schematic.  
  - **Unstated Premise**: Any coherent metalinguistic statement (e.g., "This sentence is ill-formed") requires a language with unrestricted expressive power.  

  ### Pivotal Moves: Where the Dispute Turns  
  Two moves are decisive:  
  1. **Move 3 (Ines’ self-refutation challenge)**  
     - If conceded, Rafi’s gap theory collapses unless he can non-arbitrarily block "not true" from applying truthfully to gappy sentences.  
     - **What both miss**: The challenge assumes "not true" is a rigid designator. If "not true" is *contextual* (e.g., "not true *in L*" where *L* excludes gaps), the meta-paradox dissolves.  

  2. **Move 7 (Ines’ hierarchy critique)**  
     - If conceded, Rafi’s syntactic solution fails unless he denies we can *correctly* state the hierarchy.  
     - **What both miss**: Hierarchies can avoid self-reference by using *indefinite* ascent (e.g., "For any language *L*, a truth predicate for *L* belongs to *L+1*"). But this makes "the" universal truth predicate inexpressible, weakening descriptive power.  

  **The False Choice**: Both assume a binary: *either* truth is bivalent (Ines) *or* gaps/hierarchies save classical logic (Rafi). But natural language tolerates ambiguity, context-dependence, and pragmatic silence—none of which require systematizing "gaps" or "gluts." The sentence might simply be *meaningful but undefined* in truth-value, with no deeper implications.  

  ### Verdict: Rafi Is Closer to Right (with Caveats)  
  - **Why Rafi**: His truth-gap solution (Moves 2/4) is more conservative, sacrificing only excluded middle for pathological sentences—not core inference rules. Paraconsistency (Ines) demands revising how we reason *everywhere*, even with non-paradoxes (e.g., "From *A and not-A*, can I infer *A*?"). Hierarchies (Move 6) are flawed but highlight that natural language truth predicates are *not* univocal.  
  - **Where Ines Wins**: She correctly exposes the fragility of gaps (Move 3) and hierarchies (Move 7). Rafi must either embrace radical context-sensitivity for "not true" or accept an open-ended hierarchy.  
  - **What Ines Needs to Prevail**: Show that paraconsistent logic handles ordinary reasoning *better* than gap theories (e.g., preserves more intuitive inferences) *and* that true contradictions are coherent (e.g., by redefining "truth" as non-exclusive). Currently, her costs outweigh Rafi’s.  

  **Overall**: Rafi’s minimal revision (gaps with meta-gaps) is less disruptive, but both positions are unstable. The paradox persists because natural language truth is irreducibly context-dependent—a truth-value "gap" isn’t a flaw but a feature of unformalized discourse. The sentence isn’t a contradiction or a non-statement; it’s a signal that "true" cannot always self-apply without qualification.
