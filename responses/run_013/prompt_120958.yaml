prompt: |-
  I sit on the accreditation committee of the International Forecast Standards Council, and we vote next month on whether to revise the standards that govern how member organizations phrase their warnings. One of our members, a humanitarian early-warning group, has for years issued what it calls determinate warnings — statements of the form "There will be a famine in the Sahel in the third quarter" rather than "There is a seventy per cent chance of famine." The group's director argues that only determinate language moves donors and governments, and that hedging is a luxury of institutions that do not have to beg. A rival member has filed a complaint: it says determinate warnings treat a contingent future as already settled, make the organization's own preventive work look either pointless or dishonest, and, when the warning does not materialize, corrode the field's credibility for everyone. Our legal advisor has added a proposal that will probably decide the vote: she wants any determinate warning to be treated as a "materialization commitment," so that a member that issues one and then fails to act on it, or whose warning fails to materialize, faces an automatic review. I have to circulate a written opinion before the meeting.

  Please draft that opinion. I need a concrete recommendation — adopt the revision, reject it, or adopt it with stated conditions — together with a time frame for implementation and a clear statement of what the committee is and is not deciding. Engage the strongest version of the losing side rather than restating our current standards, and do not turn the memo into a treatise. The philosophical issue, as I see it, is the old problem of future contingents: if a statement about tomorrow is true now, in what sense is tomorrow's event still open, and what does that imply for the deliberator who is supposed to be able to affect it? But I do not want a lecture on the sea battle; I want the committee to be able to act. In particular, address whether the line between "will" and "probably will" is the right place to draw the distinction, or whether the real issue is whether a determinate warning functions as a prediction or as a commitment; say whether the two-ledger proposal — recording contingent forecasts on a separate ledger until the event occurs — solves the problem or merely relabels it; and say what we should do about the legal advisor's materialization-commitment idea, since that is what the vote will actually turn on.
reasoning: |-
  Okay, the user is part of an accreditation committee for the International Forecast Standards Council. They need to draft a written opinion on whether to revise standards about determinate warnings. Let me break down their requirements. 

  First, the core conflict: a humanitarian group uses absolute statements like "There will be a famine" arguing it's necessary for motivating action, while critics say this misrepresents uncertainty and damages credibility. The legal advisor proposes treating such warnings as "materialization commitments" triggering automatic reviews if the event doesn't occur or the organization fails to act. 

  The user wants a concrete recommendation with implementation timeframe, clear boundaries on the decision, engagement with the strongest counterarguments, and specific attention to: 
  - Whether the "will" vs "probably will" distinction is meaningful 
  - If the "two-ledger" proposal (separating contingent forecasts) actually solves anything 
  - How to handle the materialization-commitment idea that will decide the vote 

  Hmm... the philosophical future contingents issue is noted but shouldn't dominate - this needs to be actionable. The user seems frustrated by abstract debates and wants the committee to have clear grounds to vote. 

  Key angles to address: 
  The pro-determinate camp's strongest point is realpolitik: soft language doesn't trigger donations/policy changes. But the integrity argument is equally strong - false certainty destroys trust long-term. The legal proposal tries to bridge this by making "will" statements carry accountability, but risks conflating prediction accuracy with response effort. 

  On the "will/probably" distinction: it's inadequate because high-probability forecasts (say 95%) function identically to "will" in practice. The real issue is whether the statement is a prediction or a commitment to act. 

  The two-ledger idea? Superficial. Separating "contingent" forecasts doesn't change how recipients interpret them, and "materialized" ledgers would still show failures. 

  Materialization-commitment needs refinement: 
  - Triggering review for non-materialization unfairly punishes accurate warnings about preventable crises 
  - But requiring action plans for determinate warnings makes sense - it aligns language with responsibility 

  Recommendation should: 
  Reject blanket bans on determinate language but impose strict conditions: 
  1) Only allowed with >90% confidence AND a prevention/mitigation plan 
  2) Materialization-commitment applies ONLY to failure-to-act scenarios 
  3) Mandatory retroactive analysis for all determinate warnings 

  Implementation in 6 months allows policy drafting and training. Frame it as strengthening credibility while preserving operational flexibility - which addresses both camps' core concerns. 

  Avoid philosophy tangents. Use bullet points in memo for clarity. Stress that the vote sets accountability rules, not epistemology standards.
answer: |-
  ## MEMORANDUM  
  TO: Accreditation Committee, International Forecast Standards Council  
  FROM: [Your Name/Position]  
  SUBJECT: Recommendation on Proposed Warning Language Standards Revision & Materialization Commitment Proposal  
  DATE: [Current Date]  

  ### 1. RECOMMENDATION  
  **Adopt the revision with the following conditions:**  
  - **Permit determinate warnings ("will happen")** only when accompanied by:  
    (a) A documented confidence threshold ≥90%, *and*  
    (b) A publicly accessible prevention/mitigation action plan from the issuing organization.  
  - **Adopt a modified "materialization commitment" rule:** Automatic review triggers *only* for failure to execute the published action plan. Non-materialization of the event triggers retrospective analysis (not automatic penalty), with findings published.  
  - **Reject the two-ledger proposal** as administratively burdensome and philosophically cosmetic.  
  **Implementation timeframe:** 6 months (policy drafting: 3 months; member training/transition: 3 months).  

  ### 2. WHAT THE COMMITTEE IS (AND IS NOT) DECIDING  
  - **We are deciding:** The conditions under which determinate warnings are permissible and the accountability framework for their issuance.  
  - **We are not deciding:** Whether forecasting *should* use determinate language (members retain discretion within guardrails), nor resolving the metaphysical debate on future contingents. We are setting operational standards for credibility and accountability.  

  ---

  ### 3. ANALYSIS OF KEY ISSUES  
  **A. Strength of the Objection to Determinate Warnings:**  
  The rival member rightly argues that **declaring "will happen" implies inevitability, undermining the core purpose of early warnings: prevention.** If a famine is certain, mitigation appears futile or dishonest. Repeated non-materialization *does* corrode systemic credibility. This is not mere semantics; it risks making warnings self-defeating by divorcing prediction from agency.  

  **B. "Will" vs. "Probably Will": A Misplaced Distinction?**  
  The line between "will" (determinate) and "probably will" (hedged) is **not the primary issue.** The critical distinction is whether a statement functions as:  
  - A **Prediction** (probabilistic assessment of likelihood), or  
  - A **Commitment** (a call to action implying moral/social obligation).  
  *Determinate warnings inherently function as commitments.* The revised standard must acknowledge this by tethering "will" statements to demonstrable action.  

  **C. The Two-Ledger Proposal: Relabeling, Not Solving**  
  Recording "contingent" forecasts separately until materialization **merely relabels the problem.** It does not address:  
  - How donors/policymakers interpret "contingent but un-materialized" forecasts in the interim.  
  - The reputational damage when events labeled "contingent" consistently fail to materialize.  
  - The fundamental tension between linguistic certainty and future openness. This adds bureaucracy without resolving credibility concerns.  

  **D. Materialization Commitment: Core Modification Required**  
  The Legal Advisor’s proposal has merit but requires refinement to avoid perverse outcomes:  
  - **Problem 1:** Punishing non-materialization **ignores successful prevention.** If a "famine will happen" warning triggers action that *averts* famine, this is a success – not a failure to be penalized.  
  - **Problem 2:** "Failure to act" is nebulous without a predefined standard.  
  - **Solution:** **Link the commitment to action, not materialization.**  
    - *Automatic Review Trigger:* Issuer fails to execute its own published, good-faith action plan tied to the determinate warning.  
    - *Non-Materialization Response:* Mandate transparent, public retrospective analysis (e.g., "Why didn't the projected famine occur? Was prevention effective or was the forecast flawed?"). This builds knowledge and credibility.  

  ---

  ### 4. STRONGEST VERSION OF THE LOSING SIDE (Pro-Determinate Language) & RESPONSE  
  **Their Core Argument:** "Hedged language is ignored by time-constrained, risk-averse decision-makers facing competing priorities. Only unequivocal 'will happen' statements cut through inertia and unlock resources for prevention. Forcing probabilistic language on humanitarian actors begging for scarce funds is a luxury they cannot afford and will cost lives."  
  **Our Response:** This argument is powerful and empirically plausible. **Our conditions preserve the option** for determinate warnings where evidence is overwhelming (≥90%) but mitigate its risks by:  
  1.  **Leveraging its power as a commitment:** Requiring an action plan channels the motivational force of "will" into concrete, accountable steps.  
  2.  **Protecting credibility:** Mandating retroactive analysis after non-materialization (without automatic penalty) allows the organization to demonstrate whether intervention worked or lessons were learned, preserving trust.  
  3.  **Avoiding false inevitability:** The high confidence threshold acknowledges the contingent nature of the future while permitting decisive language when justified.  

  ---

  ### 5. IMPLEMENTATION  
  - **Phase 1 (3 Months):** Draft revised standards document incorporating confidence thresholds, action plan requirements, modified materialization-commitment rule (focused on action failure), and retrospective analysis protocol.  
  - **Phase 2 (3 Months):** Member training workshops; template development for action plans/retrospective analyses; IT adjustments for compliance tracking.  
  - **Effective Date:** [Date 6 Months from Vote].  

  **Vote Recommended On:** Adoption of the revised standards *with the specific conditions and modifications outlined above*.  

  ---  
  **This framework balances operational realism with epistemological integrity. It allows decisive warnings where justified but anchors them in accountability and transparency, preserving the field’s credibility while acknowledging the humanitarian imperative to motivate action.**
