prompt: |-
  I have funding for a small team — four philosophers, two years, no empirical budget — and I want to spend it on the philosophical literature on epistemic injustice. I take the now-standard core as settled enough to build on: a speaker suffers testimonial injustice when an identity prejudice deflates the credibility they are granted, and hermeneutical injustice when a gap in the shared interpretive resources leaves them unable to make sense of their own experience. What I need is a defended agenda for what comes next, not a survey.

  Rank the following candidate lines of work, add any I have missed, and say which I should decline to fund:

  - Whether these are one phenomenon or a disjunction. In particular, is there a third thing in the refusal case (a hearer whose interpretive resources are perfectly adequate but who declines to extend them to this speaker) and the uptake case (a hearer who reads the speaker through the hearer's own categories, so the speaker's self-understanding never gets through), or are these just the two we already have?
  - Whether the wrong is done to the knower as a knower or is at bottom distributive and structural — and whether the virtue-and-vice framing, which locates the fault in individual hearers, individualizes a structural harm and ought to be given up.
  - Whether non-human systems can occupy either role: an LLM that mediates someone's testimony, or a triage algorithm whose output is credited where the patient's own report is not.
  - How the concept earns its keep against the two things it is most often collapsed into: oppression, on one side, and ordinary epistemic bad luck, on the other.

  For each, tell me how far upstream it is (how many other questions in the area presuppose an answer to it), how far a small philosophical team could move it in two years, how neglected it is, and what evidence would push it up or down my list. Close with the ranking, the trade-offs you made among those criteria, and the one line of work you would cut.
reasoning: |-
  Okay, the user is leading a team of four philosophers with a two-year grant focused on advancing epistemic injustice beyond the established concepts of testimonial and hermeneutical injustice. They need a prioritized research agenda and guidance on what to fund or cut. Let me unpack their query carefully.

  First, they've provided four candidate research directions. The user clearly wants to avoid surveys or rehashing basics—they're after defendable next-step questions. Their team size and non-empirical budget mean theoretical depth is key, but they must produce meaningful progress in two years. I should assess each option's foundational importance, feasibility, neglect, and potential impact.

  Looking at option 1: Phenomena boundaries. This questions whether refusal/uptake cases are new injustice types or subtypes. It feels upstream—if these are distinct, it could reshape definitions across the field. A small team could make headway here through conceptual analysis, especially since it's underexplored compared to other issues. But I wonder if clarifying this is urgent for others' work.

  Option 2: Wrongs to knowers vs. structural harms challenges the individual virtue/vice framing. Given how pervasive virtue ethics is in Fricker's original work, resolving this could radically shift the field's trajectory. It's extremely upstream but also highly contested—two years might only allow a strong position paper, not consensus. Still, its potential to redirect research makes it high-priority if feasible.

  Option 3: Non-human systems like LLMs as perpetrators/victims. With AI's real-world impact, this has timely urgency. It builds on existing debates about non-human epistemic agents, so it's moderately upstream. The team could develop frameworks here without new empirical data. Given its neglect relative to human-centered cases, it offers fresh ground.

  Option 4: Demarcation from oppression/epistemic bad luck. This defends the concept's uniqueness—core to justifying the whole research area. It's highly upstream but well-trodden; the team might struggle to say something new in two years. Still, sharpening boundaries could prevent conceptual dilution.

  I notice gaps: intersectionality (how injustices compound across identities) and resistance strategies (how marginalized groups reclaim epistemic agency). Both are emerging areas with real-world relevance. Adding them balances the theoretical focus of the original options.

  Prioritization trade-offs: Upstreamness vs. feasibility is key. Option 2 is the most foundational but risky for a small team; option 3 is tractable and timely but less central. Impact-wise, option 4 safeguards the field's integrity, while option 1 refines its tools. 

  Cut recommendation: Option 4, despite its importance, might be too saturated for a small team to advance significantly. The others offer clearer paths to original contributions within two years.

  Final ranking balances building-block urgency (options 2,1), timeliness (3), and completeness (adding intersectionality/resistance). The cut reflects strategic resource allocation—defending the concept's borders is vital but better done by larger/longer projects.
answer: |-
  Here’s a ranked agenda for your team, balancing upstream impact, feasibility, neglect, and evidence sensitivity. I’ve added two critical missing lines and recommend one cut. Trade-offs prioritize **conceptual foundations** (highest upstream impact) and **tractability** for a small team.

  ### **Ranked Research Agenda**  
  *(Highest to Lowest Priority)*  

  1. **#2: Wrongs to Knowers vs. Structural/Distributive Harms**  
     - **Why**: Directly challenges Fricker’s virtue-epistemology framing. If structural, it rewires policy/resistance strategies.  
     - **Upstream**: Highest. Answers here dictate interventions (individual reform vs. systemic change).  
     - **Feasibility**: High. Team can engage political philosophy (e.g., Anderson, Haslanger) and critique virtue ethics.  
     - **Neglect**: Moderate. Structural critiques exist (e.g., Dotson, Medina) but lack consensus.  
     - **Evidence Shift**: Empirical studies showing structural harm patterns (e.g., credentialing bias) would boost urgency.  

  2. **#4: Demarcation from Oppression/Epistemic Bad Luck**  
     - **Why**: If epistemic injustice collapses into broader oppression or luck, the concept loses explanatory power.  
     - **Upstream**: Very High. Defines the field’s autonomy. Shapes legal/educational applications.  
     - **Feasibility**: High. Conceptual analysis of oppression theories (e.g., Crenshaw) vs. epistemic specificity.  
     - **Neglect**: Under-addressed. Most work assumes distinctness; few test boundaries rigorously.  
     - **Evidence Shift**: Case studies where injustice *is* reducible to oppression/bad luck would downgrade it.  

  3. **#1: One Phenomenon or Disjunction? (Including Refusal/Uptake Cases)**  
     - **Why**: Tests coherence of core theory. Refusal/uptake cases may reveal new injustice types.  
     - **Upstream**: High. Affects taxonomy (e.g., is "willful hermeneutical ignorance" (Pohlhaus) a third type?).  
     - **Feasibility**: Moderate. Team can analyze novel cases (e.g., medical gatekeeping) but risks terminological debates.  
     - **Neglect**: Moderate. Refusal/uptake are discussed (e.g., Dotson) but not systematized.  
     - **Evidence Shift**: Psychological studies on "conceptual dismissal" could elevate priority.  

  4. **ADDED: Intersectional Amplification**  
     - **How identities compound injustices** (e.g., Black women’s testimony dismissed differently than Black men’s or white women’s).  
     - **Why**: Corrects Fricker’s identity-general approach. Essential for real-world applicability.  
     - **Upstream**: Medium. Builds on #2’s structural work; informs policy.  
     - **Feasibility**: High. Leverage intersectionality theory (Crenshaw, Collins) + hermeneutic case studies.  
     - **Neglect**: High. Most literature treats identity prejudices monolithically.  

  5. **#3: Non-Human Systems (LLMs/Algorithms)**  
     - **Why**: Timely and policy-relevant, but less foundational than human core.  
     - **Upstream**: Low-Medium. Presupposes settled human account; applied ethics.  
     - **Feasibility**: High. Analyze "proxy injustice" (e.g., biased algorithms overriding patient testimony).  
     - **Neglect**: Emerging (e.g., Binns, Vallor) but not deeply integrated.  
     - **Evidence Shift**: AI audit results (e.g., credentialing biases in LLMs) would raise importance.  

  6. **ADDED: Resistance and Epistemic Agency**  
     - **How marginalized groups develop counter-hermeneutics or reclaim credibility**.  
     - **Why**: Vital for praxis but less urgent than foundational critiques.  
     - **Upstream**: Low. Builds on existing injustice types.  
     - **Feasibility**: High. Case studies (e.g., #MeToo, disability activism) + feminist epistemology.  
     - **Neglect**: Moderate. Focus has been on harm, not resistance (exceptions: Medina, Fricker’s later work).  

  ### **Cut Recommendation: Decline Funding For**  
  - **#1: One Phenomenon or Disjunction?**  
    - **Why**: While important, it risks becoming a taxonomy debate with diminishing returns. Refusal/uptake cases *can* be folded into existing types (e.g., refusal as testimonial injustice, uptake failure as hermeneutical). Your team’s effort is better spent on higher-stakes questions (#2, #4) or applied extensions (#3, intersectionality).  

  ### **Trade-offs Made**  
  - **Upstream > Timeliness**: Prioritized #2 and #4 (field-defining) over #3 (AI is urgent but derivative).  
  - **Feasibility > Ambition**: Avoided overly speculative gaps (e.g., "injustice to non-humans") favoring tractable theory-building.  
  - **Neglect > Saturation**: Elevated intersectionality/resistance (underserved) over rehashing virtue ethics debates.  
  - **Evidence Sensitivity**: Ranked #4 highly because new social science data could force conceptual revisions.  

  ### **Strategic Rationale**  
  With 4 philosophers in 2 years, focus on **1-2 core projects** (#2 and #4) plus **1 applied thread** (intersectionality or AI). This balances:  
  - **Field impact**: Resolving structural vs. agential wrongs (#2) and concept autonomy (#4) will shape next-decade research.  
  - **Output feasibility**: Teams excel at co-authored papers targeting *Philosophical Review* or *Episteme*.  
  - **Neglect**: Intersectionality and non-human systems offer fresh publication avenues.  

  **Final Ranking Order**:  
  1. #2 (Structural vs. agential wrongs)  
  2. #4 (Demarcation from oppression/bad luck)  
  3. Added: Intersectionality  
  4. #1 (Phenomenal unity/disjunction)  
  5. #3 (Non-human systems)  
  6. Added: Resistance  
  **Cut**: #1 (lowest ROI for foundational progress).
