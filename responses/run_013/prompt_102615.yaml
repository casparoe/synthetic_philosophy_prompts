  ## The Locked Room

  The truth arrived, a cold and sudden dread,  
  So sharp, I turned before the thought took root.  
  **You have to know it to bury it.**  
  I watched the facts dissolve in doubt I spread,  
  Like shifting shadows hiding bitter fruit.  
  If not quite false, then softly misconstrued—  
  I smoothed the edges where the meaning bled.  
  **If you truly knew it, you couldn’t be fooled.**  

  My mind became a room I nightly tread,  
  One half seeks proof, the other guards the chute  
  **You have to know it to bury it.**  
  Where unwanted conclusions fall like lead.  
  That seeking self grows weary, destitute.  
  What consequence is wrought by this dispute?  
  The blade grows dull that never feels the whet.  
  **If you truly knew it, you couldn’t be fooled.**  

  The house of reason stands on ground I’ve bled,  
  Its strongest beams the lies I execute.  
  **You have to know it to bury it.**  
  The architect denies the plan he’s read,  
  The builder builds the walls his hands refute.  
  **If you truly knew it, you couldn’t be fooled.**  
  The shadow knows what light has fled:  
  **You have to know it to bury it.**  
  **I** turn the key. **I** bar the door. **I** stand in dread.  
  **If you truly knew it, you couldn’t be fooled.**

  ---

  **Why this works:**

  1.  **The Refrains as Horns of the Dilemma:**
      *   A1: "**You have to know it to bury it.**" Represents the necessity of awareness for concealment.
      *   A2: "**If you truly knew it, you couldn’t be fooled.**" Represents the seeming impossibility of deceiving genuine knowledge.

  2.  **The Stanzas' Struggle:**
      *   **Stanza 1:** Introduces the painful truth and the initial act of turning away ("turned before the thought took root"). A1 states the necessity of knowing for the burial that's just begun. The stanza ends trying to soften the blow ("misconstrued").
      *   **Stanza 2:** Personifies the internal conflict ("One half seeks proof, the other guards the chute"). A1 repeats, justifying the ongoing burial. The stanza ends questioning the cost ("What consequence...?").
      *   **Stanza 3:** Deepens the commitment to the false structure ("The house of reason stands on ground I’ve bled"). A1 repeats again, anchoring the act. The stanza ends acknowledging the reliance on lies ("strongest beams").
      *   **Stanza 4:** Introduces active denial ("The architect denies the plan he’s read"). A2 returns, challenging the possibility of this denial succeeding. The stanza ends highlighting the absurdity ("builder builds the walls his hands refute").
      *   **Stanza 5:** Intensifies the internal contradiction ("The shadow knows what light has fled"). A1 repeats, affirming the knowing burial. A2 follows immediately, declaring the impossibility of the fooling.

  3.  **The Quatrain & Resolution (Implicit):**
      *   **Lines 1 & 2:** "The shadow knows what light has fled: / **You have to know it to bury it.**" The "shadow" embodies the hidden knowledge *within* the self. A1 confirms its necessary existence.
      *   **Lines 3 & 4:** "**I** turn the key. **I** bar the door. **I** stand in dread. / **If you truly knew it, you couldn’t be fooled.**"
          *   **The Crucial Shift:** The perspective changes dramatically. After the impersonal "shadow" and the consistent second-person "you" of the refrains, the active voice becomes intensely first-person singular: "**I** turn... **I** bar... **I** stand." This "I" is the *agent* performing the hiding.
          *   **The Paradox Resolved (Implied):** The "I" performing the hiding actions *is not the same entity* as the "you" addressed in A2 who "couldn’t be fooled" *if* it truly knew. The "you" being hidden *from* is the self that would be shattered by the truth – the "I" *is* the part doing the hiding, knowing the truth it actively conceals *from another part of itself*. The dread is the "I's" awareness of the truth it holds and actively suppresses. The grammar ("I" acting while the refrains argue about "you") *shows* the division without naming it.
          *   **The Landing:** The final line, A2, now reads almost as a lament or a statement of the *other* self's condition ("*You* couldn't be fooled") precisely *because* this "I" *does* know and *is* actively fooling. The two refrains sit together, held true by the split agency revealed in the shift to "I".

  4.  **Accessibility:**
      *   The core images (burying, shadows, locked rooms, building on shaky ground) convey the feeling of internal conflict and concealment without needing theory.
      *   The struggle between the refrains creates inherent tension anyone can feel.
      *   The final shift to "I" performing concrete actions against a backdrop of the unresolved "you" dilemma creates a powerful, intuitive sense of self-division.
