answer: |-
  ## The Weight of a Promise  
  *(The back parlour of SILAS CORMAC's Dublin townhouse. Rain streaks the leaded windows. Silas, fifty, broad-shouldered and dressed in sober wool, tests the edge of a newly minted shilling with his thumb. REV. AIDAN FINNEGAN, late twenties, sharp-featured and restless, paces near the cold hearth. The air smells of damp wool and burnt peat.)*

  **SILAS:** (Without looking up) Still light. Clipped or sweated, no doubt. Passes in the Liberties, maybe, among the beggars and costermongers. But try paying a London factor with a bag of these shavings, Reverend. See what your credit’s worth then. Solid silver, milled edge – *that’s* the language men of substance understand. Not promises scrawled on paper.

  **AIDAN:** (Stops pacing) But that’s precisely the blindness, Mr. Cormac! You mistake the *token* for the *thing itself*. The silver in that coin? It lies idle in strongboxes or sails east to line some absentee’s pockets in Bath. What stirs industry *here*? What puts bread in the hand of the weaver whose loom stands silent? It’s the *movement* of value, sir! A tally, a note, a bill of exchange – call it a ‘ticket’ if you like – circulating swiftly, oiling the gears.

  **SILAS:** (Slaps the coin onto the oak table) Oil? Gunpowder, more like! Tickets! Counters! Fine words for debts made to vanish. When my father lent Goodman Byrne ten pounds sterling – *real* sterling, weight for weight – he expected ten pounds back, not a promise redeemable in… in hopes and thin air! A man’s word is his bond, Reverend. Backed by his substance. This paper chase? It lets the unscrupulous promise what they haven’t got. Who bears the loss when the music stops? Not the issuer, snug in his counting house. The widow Byrne did, when Byrne’s ‘tickets’ bought him passage to the Carolinas, leaving her his paper promises and an empty croft.

  **AIDAN:** (Leans forward, intense) A tragedy, yes! But caused by *scarcity*, not paper! Imagine a national bank, issuing notes secured not just on one man’s shaky character, but on the *industry of Ireland itself*! Land improved, bogs drained, linen flowing. Those notes – those ‘tickets’ – become tokens of *future* wealth, unlocking labour *now*. A poor man’s honest sweat becomes a claim on the common store. Is that not more just than leaving him to beg because all the silver’s hoarded or fled?

  **SILAS:** (Eyes narrowing) Future wealth? Secured on what? The landlord’s absentee rent? The harvest that might fail? You trade in *maybes*, lad. Silver is *now*. It’s endured plagues, wars, foolish kings. It crossed oceans before Columbus. Your paper… (He picks up a discarded bill of exchange from his desk, flutters it contemptuously) …is worth only what the next fool believes it’s worth. And belief, Reverend, is a fickle wind. Ask the French after Law’s Mississippi scheme. Ruin followed paper like rats follow a plague cart.

  **AIDAN:** (Flushes slightly) Law was greed and madness! We speak of measured issue! Controlled circulation! Think of it: less silver, moving slowly from strongbox to strongbox, enriching only the hoarder… or a greater *value* represented by paper, moving swiftly from hand to hand, paying the spinner, the dyer, the ship’s chandler, stirring the whole sluggish beast of this kingdom! Velocity, Mr. Cormac! Is not swift circulation the very pulse of prosperity? Ten shillings passing ten hands in a week does the work of a hundred lying stagnant!

  **SILAS:** (A grim smile touches his lips) Velocity? Aye, it moves swiftly when panic sets in. Faster than any rumour down the Coombe. Then your ‘tickets’ become scraps, Reverend. And the loss? It falls heaviest on those who can least bear it – the spinner paid in paper now worth half, the shopkeeper who accepted it on trust. Silver may be slow, but it doesn’t *vanish*. It holds its ground. It’s a *thing*. Your ticket… (He drops the bill of exchange) …is just a promise written on the wind. And when the wind changes? Men are ruined. Families shattered. Like the Byrnes. Promises broken are theft, pure and simple. Theft from the lender, theft from the honest trader who trusted the symbol. You can’t eat promises, Reverend. You can’t weigh trust on a scale. Silver endures.

  **AIDAN:** (Quieter now, but intense) And while it endures inert, Mr. Cormac, people starve *now*. Potential rots in idle hands. Is it not a greater theft to lock away the means of industry behind a wall of metal? To say a man’s labour has no value unless stamped onto a disc of Spanish silver? The true wealth is the land, the labour, the cloth woven, the corn grown! Money is but the counter that facilitates it! A well-regulated paper, founded on public credit and real assets, could be the engine to lift thousands from destitution! Isn’t *that* a promise worth striving for? Worth some… calculated risk?

  **SILAS:** (Stares at the rain-lashed window, picks up the solid shilling again. His voice is heavy) Calculated risk for whom, Aidan? For the projector in his fine house? Or the widow Byrne shivering in her damp cottage, clutching worthless paper? Silver is quiet. It doesn’t make grand promises. It simply *is*. And when the storm comes… (He closes his fist tightly around the coin) …it’s the heavy thing that sinks, while the paper tickets… they just blow away. Tell me this, Reverend, before you stake your soul – or worse, other men’s livelihoods – on these clever counters: When the reckoning comes, who truly pays for the wind?
  *(Silence fills the room, broken only by the drumming rain. Aidan looks at the clenched fist holding the silver, then at the fragile paper on the desk. The fire sputters, almost out. Neither man speaks. The question hangs, cold and unresolved, in the damp air.)*

  **Key elements worked in:**
  *   **Clipped Coin:** Silas's opening gripe & tactile distrust.
  *   **Bills of Exchange:** The paper Silas scorns, representing fragile credit.
  *   **Absentee Landlords:** Silver draining away to England/Bath.
  *   **Credit = Character:** Silas's core belief ("a man's word is his bond"); contrasted with Aidan's institutional credit.
  *   **Berkeley's "Ticket":** Aidan's central metaphor and argument.
  *   **Velocity Theory:** Aidan's "less money swiftly circulating" point.
  *   **Merchant's Winning Blow:** The visceral reality of loss falling on the vulnerable (widow Byrne, spinner, shopkeeper) when paper fails – Aidan can't fully counter the human cost of broken promises.
  *   **Curate's Cost:** His idealism potentially blinds him to the brutal reality of panic and the suffering caused by devaluation; Silas forces him to confront "who pays for the wind?"
  *   **Period Language:** "Sweated" coin, "strongbox," "costermonger," "Liberties," "Coomb," "plague cart," "Spanish silver."
  *   **Unresolved Ending:** The fundamental conflict between tangible security (Silas) and potential prosperity (Aidan) remains, embodied in the coin vs. the paper bill.
