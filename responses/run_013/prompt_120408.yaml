prompt: |-
  I am a novelist, three chapters into a book about a provincial police battalion in the occupied east, and for the past year I have been sending chapters and questions to the historian I have retained as a consultant. He returns verdicts the way a magistrate does: briskly, in writing, and without explaining himself at length. I have collected enough of them that I believe I can hear a machine running underneath, and I want you to tell me what it will do with the scene I am writing now.

  His rulings to date:

  1. The reservists of Police Battalion 101: men in their forties, shopkeepers, clerks, and former policemen from a single city, with no prior commitment to the regime's project, offered the chance to stand aside at their first mass shooting, and not punished by anyone when a minority did. Situation. What did the work, he wrote, was the role, the unit, and the fact that the order arrived before any of these men had had time to become the sort of person who could refuse it.

  2. The mobile killing squads that followed the army in the first year of the eastern war: educated men, lawyers and physicians, few of them zealots. Situation. The load-bearing fact was the sequence, a week of humiliation followed by a week of escorting followed by a week of ditches, so that no single step ever required a decision.

  3. The deportation apparatus: railway clerks and administrators arranging timetables and quotas, never touching a body. Situation. No hatred was required, only the ordinary ethics of a job competently done.

  4. A small-town pogrom in which the killers and the victims had been neighbours for generations and the occupier merely stood by and permitted it. Character. The old quarrel, the debts, the shops that would change hands: the motive was already in the street, and no institution had to supply one.

  5. A case I invented for him: a battalion ordered to shoot, whose captain refused and whose men refused with him, and who were not punished. Character. What explained the refusal was the men's prior ties and the captain's authority, both of which predated the war.

  Six months ago I would have said his rule was the Browning–Goldhagen axis and that he sits near one end of it. Now I am less certain, because the scene I am drafting looks to me as though it sits on the axis rather than at either end of it.

  Here is what I have built into my invented town. A state police unit is raised locally: the men come from the town itself, from its guilds, its market, its churches. The orders come from the state, with quotas, timetables, and an ideology distributed in pamphlets. Their task is to clear and shoot the Jewish population of their own town, people they have bought from, argued with, and lived beside for twenty years. Refusal is possible and no one is shot for it, but a refusal means a transfer east and a family left short of rations. The killing is done face to face, in daylight, in a wood a mile from the market square. The town's history of the two communities is not a story of organized antagonism; it is neighbourly indifference punctuated by the ordinary frictions of a market town, a disputed well, an unpaid debt, a lawsuit over a shopfront.

  What will he rule?

  Give me the candidate rules that fit his five verdicts, at least two and preferably three, each with a different load-bearing variable; say what each one predicts for my scene; and tell me which you think he is actually running, and why. If you believe he will split, character for the handful who volunteer for the wood and situation for the many who go along, say so, and tell me what that split would commit him to. Then give me the case that would settle the matter, something whose verdict the rival rules cannot agree on; if you can build it out of my own material, by preference do. I care about the prediction, but I care more about the rule, because the rule decides whether my men's prior lives are the engine of the book or only its scenery.

  End with one final line, exactly in this form and nothing after it:

  \answer{VERDICT; RULE; DISCRIMINATOR}

  where VERDICT is one of SITUATION, CHARACTER, or SPLIT; RULE names the load-bearing variable in no more than six words; and DISCRIMINATOR names the decisive case in no more than twelve words.
reasoning: |-
  Hmm, the user is a novelist working on a book about a provincial police battalion in Nazi-occupied Eastern Europe. They've been consulting a historian who gives brief, unexplained verdicts on their chapters, categorizing events as driven by "Situation" or "Character." The novelist has collected five rulings and wants to predict how the historian will judge their current scene.

  The current scene involves a local police unit ordered to kill Jewish neighbors in their own town. Key elements: 
  - Killers and victims have lived together for decades with ordinary neighborly relations (no deep hatred)
  - Refusal possible but carries consequences (transfer east, family rations cut)
  - Killing happens face-to-face in daylight
  - No history of organized antagonism, just mundane frictions

  Looking at the historian's past rulings:
  1. Police Battalion 101 → Situation (role/unit structure made refusal hard preemptively)
  2. Mobile killing squads → Situation (gradual escalation sequence)
  3. Deportation apparatus → Situation (bureaucratic normalization)
  4. Small-town pogrom → Character (preexisting local motives)
  5. Invented refusal case → Character (preexisting bonds/authority)

  The pattern suggests the historian distinguishes based on whether the primary driver is external structures/systems (Situation) or internal group dynamics/personal history (Character). The current scene has conflicting elements: 
  - The order comes externally (Situation-leaning) 
  - But the killers know victims personally (Character-leaning)
  - However, the mundane nature of prior relations weakels "Character" argument since there's no stored animosity.

  Three candidate rules emerge:
  1. **Rule A (Institutional Leverage)**: Focuses on the state apparatus applying pressure (ration threats, transfers). Predicts SITUATION verdict.
  2. **Rule B (Social Proximity)**: Centers on personal history overriding external orders. Predicts CHARACTER verdict only if prior conflicts exist - which they don't here. 
  3. **Rule C (Preemptive Neutralization)**: Asks whether the situation prevented moral resistance from forming. The order arrived after decades of normalcy, so resistance was possible. Leans toward SITUATION.

  The historian will likely rule SITUATION because the key load-bearing element is how the institutional framework (quotas, penalties) activates compliance despite personal ties. The absence of stored hatred makes this distinct from Ruling 4 (pogrom). 

  To test this, a discriminator case would be: "A unit with preexisting communal bonds receives a sudden extermination order against strangers." If the historian rules SITUATION, it confirms institutional leverage dominates; if CHARACTER, it means bonds inherently enable refusal.
answer: |-
  Based on the historian's five verdicts and your scene's construction, I identify three candidate rules, each with a distinct load-bearing variable. The scene's key tension arises from the intersection of intimate local familiarity (a *Character*-leaning element) and the imposed state apparatus with penalties (a *Situation*-leaning element), set against a backdrop of mundane rather than antagonistic prior relations.

  ### Candidate Rules & Predictions for Your Scene
  1. **Rule: Institutional Leverage Overrides Social Bonds**  
     *Load-bearing variable:* **External incentives/disincentives structuring compliance** (6 words).  
     *Basis:* Rulings #1 (no prior commitment, refusal allowed but role/order timing decisive), #2 (sequence negates decision), #3 (bureaucracy normalizes atrocity).  
     *Prediction for your scene:* **SITUATION**. The state’s quotas, timetables, pamphlets, and penalties (transfer, rations) would dominate. Prior neighborly ties become irrelevant because the institutional framework creates overwhelming pressure to comply. Men go to the wood due to rational cost-benefit calculations, not hatred or loyalty. The historian would dismiss the "ordinary frictions" as insufficient to drive genocide without the state’s coercive scaffolding.

  2. **Rule: Social Proximity Determines Moral Agency**  
     *Load-bearing variable:* **Preexisting relational dynamics within the unit/victims** (6 words).  
     *Basis:* Rulings #4 (pogrom driven by local grievances), #5 (refusal enabled by prior ties/authority). Contrasted with #1–#3 where perpetrators/victims were strangers.  
     *Prediction for your scene:* **CHARACTER**. Face-to-face killing of known neighbors—with no deep hatred—would rupture the fabric of prior indifference/friction. Refusal or reluctance would be widespread, driven by shame, recognition, or residual empathy. The historian would emphasize that shared history ("bought from, argued with") makes this fundamentally different from impersonal bureaucracies or battalions killing strangers. Volunteers for the wood might exist, but the majority would resist or require coercion beyond rations threats.

  3. **Rule: Preemptive Neutralization of Refusal Pathways**  
     *Load-bearing variable:* **Timing and framing of the first irreversible act** (6 words).  
     *Basis:* Rulings #1 (order before men "become the sort of person who could refuse"), #2 (stepwise escalation avoiding decisions).  
     *Prediction for your scene:* **SPLIT (Situation for many, Character for few)**. The *first* act of rounding up neighbors for the wood is the critical juncture. Volunteers (CHARACTER) might emerge from those with latent grudges (e.g., the unpaid debt, lawsuit). The majority (SITUATION) comply because refusal pathways are neutered by the sudden, localized order—they haven’t "become refusers" yet, and the penalty forces immediate acquiescence. The historian would isolate the initial compliance moment as Situation-driven, while volunteers are Character-driven.

  ### Historian's Likely Rule & Why
  **He is running Rule 1: Institutional Leverage Overrides Social Bonds.**  
  - **Why?** His verdicts consistently prioritize system-level mechanisms (#1, #2, #3) over individual/group psychology unless prewar animus or bonds are explicitly operative (#4, #5). Your scene lacks the "old quarrel" of #4 or the "prior ties" of #5; instead, it mirrors #1 (local unit, no punishment for refusal) and #3 (state apparatus with quotas/penalties). The ration threat functionally replaces the "role" pressure in #1, making refusal a tangible sacrifice rather than a moral test. The wood massacre, while personal, is framed by the state’s ideology and penalties—neutralizing the significance of neighborly history.

  ### The Discriminator Case
  To conclusively distinguish Rule 1 (Institutional Leverage) from Rule 2 (Social Proximity), use:  
  **A battalion with preexisting communal bonds is ordered to exterminate a *stranger* Jewish population in their *own* town, with refusal penalties identical to your scene.**  
  - **Why it discriminates:**  
    - If **SITUATION**, verdict aligns with Rule 1: compliance dominates due to penalties, regardless of victim familiarity.  
    - If **CHARACTER**, verdict aligns with Rule 2: killing strangers in their hometown lacks the relational friction to trigger refusal (contrasting your scene and #5).  
  - **Built from your material:** It swaps victim identity (strangers vs. neighbors) while keeping the unit’s local roots, state orders, and penalties constant. Rules 1 and 2 must disagree: Rule 1 predicts identical compliance (leverage matters), Rule 2 predicts *less* refusal than your scene (no neighborly bonds to disrupt).

  ### Conclusion for Your Scene
  The historian will rule **SITUATION**. The state’s institutional leverage (penalties, ideology, quotas) overrides the "ordinary frictions" of neighborly life, rendering prior relationships scenery, not engine. The men’s prior lives are context, but the machinery of compliance is the state’s coercion.  

  \answer{SITUATION; INSTITUTIONAL LEVERAGE OVERRIDES SOCIAL BONDS; UNIT KILLS STRANGERS IN HOME TOWN UNDER PENALTIES}
