  Okay, let me start by unpacking the user's question. They're struggling with a paragraph from Marx's Grundrisse, specifically the apparent contradiction between the second and third sentences. The user mentions they've been working through the text on and off, so they likely have some familiarity with Marx's concepts but need clarification on this particular point.

  First, I need to parse the paragraph myself. The second sentence states that the mass of direct labor time remains the determinant factor in producing wealth under capitalism. The third sentence says that as large industry develops, real wealth depends less on labor time and more on the power of machinery and science. The user sees a contradiction here and wants to know how Marx reconciles these ideas.

  The user's main confusion is whether this is a contradiction inherent in capitalism, a description of changing value dynamics, or a prediction. They also ask about science's role—is it a productive force like labor, or something capital annexes from outside? Lastly, they're interested in whether this passage supports the argument that automation makes labor-time accounting obsolete.

  I recall that in Marx's theory, value is tied to socially necessary labor time. But here, he's pointing out that capitalism's development relies on forces that undermine that very measure. The key is that the presupposition (labor as determinant) remains necessary for capitalism's logic, even as material wealth production becomes less dependent on it. This creates a tension or contradiction within the system.

  Regarding science, Marx sees it as a general social product that capital appropriates. Science isn't produced by individual capitals in the same way commodities are; it's a collective human development. Capital uses science to enhance productivity, but science itself isn't a source of value—it's a force that reduces the labor needed for production.

  On the automation argument, the popular reading claims that as machines reduce labor time to near zero, value measurement collapses. But Marx is making a more nuanced point. The value relation still holds as long as capitalism exists, but the material basis for wealth shifts. The crisis tendencies arise because capital continues to measure wealth by labor time while its own development makes that measure increasingly irrelevant. This doesn't abolish value theory but highlights a contradiction that could lead to systemic crises.

  The user might be engaging with contemporary debates on automation and post-capitalism, hence their interest in whether this passage supports obsolescence of labor-time accounting. I should clarify that Marx isn't saying value disappears; rather, the contradiction intensifies, potentially leading to crises or the need for a new system. The popular reading overshoots by implying value measurement ceases, whereas Marx emphasizes the persistence of the value form despite changing material conditions.

  I need to ensure my explanation addresses all parts: the apparent contradiction, science's role, and the automation argument. I'll structure it to first resolve the contradiction, then explain science, and finally critique the popular interpretation, highlighting where it goes too far.
answer: |-
  Here's how the logic runs, resolving the apparent contradiction and addressing your core questions:

  1.  **The Presupposition ("is – and remains"):** Marx is stating a fundamental, *internal* requirement of capitalism as a system based on the value-form. For capital to exist, value must be created. For value to be created, surplus value must be extracted. Surplus value extraction *requires* the exploitation of *living labor* (variable capital). The *measure* of this value, and therefore the source of capitalist wealth *as value*, *must* be socially necessary labor time (SNLT). This is the bedrock capitalist *social relation* – labor sold as a commodity against capital. This relation "is – and remains" the presupposition; it doesn't vanish.

  2.  **The Contradictory Development ("But to the degree..."):** However, capitalism's *own dynamic*, driven by competition and the pursuit of relative surplus value, relentlessly develops the productive forces. Large industry introduces machinery, automation, and applies science systematically. This drastically increases the output of *material wealth* (use-values) per unit of *direct labor time* employed. The source of this immense productive power shifts:
      *   **From:** Primarily the sheer quantity of direct labor hours.
      *   **To:** The "power of the agencies set in motion" (machinery, fixed capital) and crucially, the "general state of science" and technology applied to production.
      *   **Science's Role:** Science here is depicted as a *general social force*, accumulated knowledge, *not* primarily produced within the immediate capitalist labor process for profit. Capital *appropriates* science ("annexes it from the outside") and *applies* it to production. It becomes embodied in fixed capital. While labor activates the machinery, the *productive power* unleashed stems fundamentally from this scientific/technological base, which is a *social product* developed historically, not reducible to the labor time spent designing *this specific* machine. The "powerful effectiveness" of the machine (embodying science) is vastly disproportionate to the labor time used to build *it*.

  3.  **The Contradiction:** This is where the tension arises:
      *   **Capital's Logic (Measure):** Capital *must* continue to measure wealth (value/profit) based on the exploitation of direct labor time (SNLT). This is its core social relation and accounting principle.
      *   **Capital's Drive (Material Production):** Yet, capitalism's *own drive* to increase productivity makes the creation of *material wealth* (use-values) increasingly *independent* of direct labor input. Wealth in its tangible form relies more on science and fixed capital.
      *   **The Result:** A growing contradiction between the *social form* of wealth (value measured by labor time) and its *material basis* (increasingly generated by science/automation with minimal labor input). The system's *measure* becomes increasingly inadequate and contradictory to its *material productive potential*.

  4.  **The Inference: Crisis Tendency, Not Immediate Obsolescence:** Marx is diagnosing a fundamental *contradiction inherent within capital itself*. It's **not** a claim that value ceases to exist or that labor-time accounting stops functioning *within the capitalist framework*. As long as capitalism exists, the "presupposition" holds – value *is* still created by living labor, and profit *must* ultimately be sourced from there. However:
      *   The *rate* at which value (and surplus value) is created *relative* to the massive output of material wealth tends to fall (hinting at the tendency of the rate of profit to fall).
      *   Capital struggles to valorize itself (turn investments into profit) as less living labor is employed relative to massive fixed capital investments.
      *   The system faces crises of overproduction (too many goods, insufficient profit/effective demand) and devaluation as the material abundance clashes with the need for scarcity/value.
      *   It points towards a historical limit: Capitalism becomes a fetter on the very productive forces (science/automation) it unleashed, creating the potential basis for a new society where wealth is no longer measured by labor time.

  **Where the Popular "Automation Obsoletes Value" Reading Overshoots:**

  1.  **Confusing Material Wealth with Value:** The popular reading conflates the massive production of *use-values* (material wealth) facilitated by automation/science with the abolition of the *value-form*. Marx is clear capitalism *requires* the value-form (rooted in labor exploitation) even as it undermines the material relevance of that labor for abundance.
  2.  **Assuming Value Vanishes:** Marx does *not* say value disappears with automation. He says its *basis* (living labor exploitation) becomes increasingly *contradictory* and *problematic* for the system. Value creation concentrates in shrinking pockets of living labor, while the system as a whole groans under the weight of capital needing to valorize itself based on that shrinking base.
  3.  **Ignoring the Persistence of the Social Relation:** As long as the core social relation (wage labor vs. capital) exists and production is for profit, the *necessity* of the value-form and labor-time measurement persists, however dysfunctional. The paragraph diagnoses the *contradiction*, not the *immediate abolition* of value.
  4.  **Overlooking the Crisis Aspect:** The popular reading often sees automation as smoothly leading to a post-work utopia. Marx sees it as intensifying capitalism's *crisis tendencies* (overproduction, falling profit rates, unemployment, devaluation). The "measure falls apart" in the sense of causing systemic dysfunction and crises, not in the sense of cleanly vanishing.

  **In essence:** Marx is showing how capital's *own success* in developing productivity (via science/automation) undermines the very foundation (labor-time as measure/sole source of value) that capitalism *socially requires* to function. It's a profound internal contradiction driving crisis and pointing towards historical transformation, not a simple declaration that machines make labor-value obsolete *within* capitalism. The paragraph supports the *contradiction* and the *crisis tendency*, not the immediate obsolescence of the value-form.
