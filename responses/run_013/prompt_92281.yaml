prompt: |-
  Somehow I've ended up running next week's session for our department's informal decision-theory reading group, and the topic is the counterfactual mugging plus XOR blackmail. The audience is about six people -- two economists, three linguists, a historian of science -- all quick, none of them have read any of the decision theory literature, but they've all heard of Newcomb's problem and are pretty sure they've got the gist. Don't explain the cases to me; plan how I should explain them. What has to be in place before the mugging even looks like a problem (my hunch is it's something about your action's payoff being fixed by a branch you'll never get to see, but correct me if that's the wrong load-bearing idea), what one example should carry the whole thing and what it needs to have and to lack -- and say whether the stock coin-flip version is that example or whether I should build a different one; the misconceptions you'd bet money they'll form and the exact point in the sequence where I should head each off (my guesses: that it's just Pascal's mugging with a smaller number, that 'the coin already landed' settles the probability question, and that XOR blackmail is purely a moral/extortion question so the decision theory doesn't bite); one question to ask at the end that shows me the structure landed rather than that they can recite 'updateless'; and what I should openly refuse to cover in fifty minutes. Don't send me a reading list, I'll pull things myself.

  One thing I want to try, tell me if its a bad idea: a variant where the relevant fact is something you could just look up for free at any time, and the whole trick is that looking it up is what costs you the payoff -- so the lesson has to be about deliberately staying ignorant rather than about a coin you can never observe. Does that make the precommitment point cleaner, or does it just collapse into value-of-information / evidential-vs-causal stuff?

  And seperate out for me what's actually settled here from what's genuinely contested among people who work on it -- I don't want a live dispute presented as if it were the consensus.
reasoning: |-
  Okay, the user is preparing a session on counterfactual mugging and XOR blackmail for a diverse academic group. They need a clear explanation strategy, common misconceptions to address, and a structured plan. 

  First, assessing the audience: economists, linguists, historians - all smart but no prior DT knowledge. They know Newcomb's, so leveraging that familiarity makes sense. The user wants to avoid deep theory dives and focus on core intuitions.

  Key challenges identified:
  - Mugging seems irrational if you'll never see the counterfactual branch
  - XOR blackmail gets mistaken for pure ethics
  - "Coin already landed" fallacy needs preemptive addressing

  The user's proposed variant (lookup cost = knowledge penalty) is interesting but risky. It could confuse VoI with updatelessness. Better to stick with classic coin flip for clarity, then mention variants if time permits.

  Critical teaching sequence:
  1. Newcomb's as anchor (they know this)
  2. Coin-flip mugging with explicit "branch never seen" framing
  3. Immediate XOR extension showing same structure
  4. Blocking "Pascal's mugging" confusion by contrasting zero-sum extortion vs. probability manipulation

  Must explicitly refuse:
  - CDT/EDT debates
  - Logical uncertainty
  - Acausal trade
  - Omega's nature

  Settled vs contested:
  Consensus that updateless agents "win" these scenarios, but heavy disagreement on how to implement updatelessness properly. Should present UDT as the leading approach without hiding its problems.

  Ending question needs to test structural understanding: "If we changed mugging so the coin was flipped AFTER your choice, why would that remove the dilemma?" Correct answer reveals grasp of dependency relationships.

  User's teaching instinct is sharp - they spotted the "branch never seen" as load-bearing. Should emphasize that heavily: "The $100 loss isn't real to you, but committing to lose it conditionally controls outcomes in branches that are real to others."
answer: |-
  Here's a battle-tested plan for your session, focusing on structural intuition over jargon:

  **Core Load-Bearing Idea:**  
  Yes, you nailed it. The problem *only* bites if:  
  1. Your payoff depends on your action in a **branch you'll never observe** (coin tails).  
  2. The entity proposing the deal (Omega) **knows your decision rule** and can simulate/predict it accurately.  
  3. Your decision rule is evaluated **across all branches** (even unobserved ones). Without this, "Why pay? I'll never see tails!" feels rational.

  **The One Example to Rule Them All: Stock Coin-Flip (Modified)**  
  *Stick with the classic, but tighten it:*  
  - **Setup:** Omega (flawless predictor) flips a fair coin. Heads: Nothing happens. Tails: Omega appears *tomorrow*, asks you for $100 today. If you pay, you get $10,000 tomorrow. If not, you get nothing.  
  - **Crucial Twists for Clarity:**  
    - Emphasize: **"Tomorrow, you ONLY meet Omega if the coin was tails. If heads, you never learn the flip result."** (Blocks "just look it up" confusion).  
    - State: **"Omega asks you to commit *right now*, before knowing the flip."** (Makes precommitment explicit).  
    - Specify: **"Omega pays you $10k *only if tails happened AND you paid*. If heads, you just lose the $100."** (Highlights asymmetry).  
  *Why this works:* It isolates the "paying for a branch you won't see" paradox cleanly. Your variant (lookup costs payoff) *does* collapse into VoI/evidential issues, muddying the updatelessness point.

  **Teaching Sequence & Misconception Head-Offs:**  
  1. **Anchor in Newcomb's (5 mins):**  
     - Recap: "One-boxing 'wins' because Omega predicts your *choice*, not your impulse. Your decision rule causes the prediction."  
     - **Head Off:** "This isn't about willpower! It's about your *algorithm* determining outcomes in predicted worlds."

  2. **Introduce Coin-Flip Mugging (15 mins):**  
     - Present the modified setup above. Ask: *"Would you precommit to pay $100 if Omega predicts you'll pay? Why/why not?"*  
     - **Head Off Misconceptions:**  
       - *"Coin already landed?"*: **"Omega *already flipped* the coin before asking. BUT: If it's heads, you *never find out* it landed heads. Paying $100 *only* matters if it's tails, and you'll only *know* you should have paid if it's tails and you didn't."** (Stress the information asymmetry).  
       - *"Pascal's Mugging?"*: **"This isn't tiny probability vs huge payoff! The probability is fixed (50%), the stakes are finite, and Omega is trustworthy. It's about *which branches* your decision rule optimizes."**  
     - Reveal the "rational" answer: Precommitting to pay $100 has positive expected value (+$4950). Refusing nets $0.

  3. **Pivot to XOR Blackmail (15 mins):**  
     - **Setup:** Omega tells you: "I *already* flipped a coin. If heads, I encrypted nasty proof P. If tails, I encrypted random bytes. XORing P with [key] = your SSN. Pay me $100 now OR I'll publish the ciphertext. If you pay, I delete it."  
     - **Connect:** "This is the SAME STRUCTURE: Paying $100 only matters if the coin was heads (real secret). But if heads, you *don't want* the secret published! If tails, publishing is harmless."  
     - **Head Off:** *"Moral/extortion?"*: **"The decision theory bites *because* Omega's prediction links your payment rule to the encryption. If you *always refuse*, Omega encrypts trash (tails). If you *might pay*, it encrypts your SSN (heads). Refusing *unless you know it's real* fails—knowing means it's already published!"**  
     - Lesson: Precommitting to *never pay* prevents the secret from existing (tails world), maximizing utility.

  4. **The Consensus & The Contested (5 mins):**  
     - **Settled:**  
       - CDT (causal) fails mugging/XOR ("Why pay for unobserved branch?").  
       - "Updateless" decision rules (considering all branches pre-observation) "win" by precommitting to pay/not-pay.  
       - UDT (Updateless Decision Theory) is the dominant *proposed* framework handling this.  
     - **Genuinely Contested:**  
       - **How to *implement* updatelessness.** UDT's exact specification (logical uncertainty, program equivalence) is messy.  
       - **Is UDT the *only* way?** Some argue sophisticated EDT or even modified CDT variants can handle it.  
       - **Omega's epistemology.** How "possible worlds" are defined/weighted remains debated.  
     - **State clearly:** "The *structure* of the problem shows CDT fails. UDT fixes it *in principle*, but building a practical UDT is hotly debated."

  5. **Killer Closing Question (5 mins):**  
     Ask: *"Suppose we altered the mugging: Omega flips the coin* ***after*** *you decide whether to pay. Would precommitting to pay still be rational? Why does this change everything?"*  
     - **Why it works:** Reveals if they grasp the causal dependency. Correct answer: **No, because now the coin flip isn't *predicted* by your action. Paying can't *cause* heads (where you lose money). Precommitment loses value.** If they get this, they understand the core.

  **What to Explicitly Refuse (Announce Upfront):**  
  *"In 50 mins, we won't cover:  
  - Detailed CDT/EDT/UDT math  
  - Logical uncertainty or program semantics  
  - Acausal trade or quantum mechanics  
  - Debates about Omega's physical plausibility  
  We focus on the *paradox structure* and why it breaks standard causal reasoning."*

  **Why Your Variant (Lookup Cost) is Suboptimal:**  
  It *does* collapse into Value of Information (VoI). Rational agents *should* seek free information! The mugging's power comes from the branch being *fundamentally unobservable* to you. Making information *available but costly* shifts focus to "Is $100 worth knowing?" which is a different (and valid) lesson, but not the one you want. It weakens the updatelessness necessity.

  **Prep Tip:** Draw timelines!  
  - Mugging: [Now: Commit?] -> [Coin Flip] -> [Tomorrow: Only if Tails, Omega asks]  
  - XOR: [Coin Flip] -> [Now: Omega encrypts P or trash based on prediction] -> [You decide pay/not] -> [Publish?]  
  Timelines make the information asymmetry visceral.

  This sequence forces them to confront the core paradox without drowning in formalism. Good luck!
