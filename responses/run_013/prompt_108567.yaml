prompt: |-
  I teach a graduate seminar on aesthetics, and I've spent most of this term argueing with a colleague in our conservation department about forgeries, and I've ended up defending a view I'm honestly not sure I can defend properly: that the aesthetic value of a painting supervenes entirely on its intrinsic, non-relational perceptual properties -- the stuff you could in principle see on the surface -- so that a molecule-for-molecule duplicate made last Tuesday has exactly the same aesthetic value as the original, provided no one could ever tell them apart. On this view whatever we pay for the original over the copy is real value, maybe, but it isn't *aesthetic* value; it's historical, sentimental, fetishistic, take your pick, and the market's premium is just a price on that non-aesthetic fact. What I want from you is the case against this, not a survey of the literature -- I'm after defeaters, sorted by how decisive they'd actually be, with a clear line between what should be fatal to the view and what's merely awkward. Cases, intuitions, arguments, commitments of mine that turn out to be unacceptable, things the view predicts that its rivals don't -- all fair game. And I want you to be straight about which of these my own side would concede rather than only the ones critics enjoy pressing.

  Let me flag the pressure points that worry me, since I don't want a generic list. First, whether my view can make any sense of the thought that some aesthetic properties are constituted by causal history -- the achievement character of a work, say, the fact that this surface is the record of someone actually solving a problem, so that the duplicate has every surface property but the achievement belongs to the other one. Is the achievement aesthetically relevant or not, and does my view have a principled way to decide, or does it just help itself to whatever answer keeps the thesis intact? Second, the familiar point that learning a work's provenance can change what features you're in a position to notice: does that give a difference in perceptual or aesthetic content even on my own terms, or does it collapse into "different attention, same content," and if it collapses, does anything of the argument survive? Third, the awkward cases: a canvas that three centuries of restoration have left more repaint than original, so that it's a ship of Theseus made of brushstrokes -- does my view really imply it's aesthetically on par with a competent modern pastiche of it? And the twin-museum case, two institutions, one with the original, one with a perfect duplicate, visitors who can never tell -- do I have to say the collections are aesthetically equal, and does that sound like a consequence I should accept or one that shows the view is missing something? Also the case where all we've got are copies of something lost, which seems to put pressure on the other side rather than mine, but I want to know if that's a real asymmetry or just a nice story.

  The thing that nags at me most is that the view might be unfalsifiable by construction. If I define aesthetic value as the value that supervenes on surface properties, then of course no historical fact can count against the claim that aesthetic value supervenes on surface properties -- I've just stipulated my way to victory, and the whole dispute with my colleague may be verbal. So I want an honest verdict on that: is this a view with genuine exposure that happens to be well armored in places, or a definition wearing the costume of a thesis? If it's the latter, say so, and tell me whether that's a defect of this particular position or a sign that the original/copy dispute was never a substantive one to begin with. For what it's worth, the thing that would actually move me is a case where two objects with identical surfaces must differ in aesthetic value -- if you can give me one that survives scrutiny, that's the one I care about, and I'd rather hear about that than about the print-and-edition cases, which I suspect are a seperate mess I'll deal with next term.
reasoning: |-
  Okay, let me unpack this professor's query. They're teaching aesthetics and locked in a debate about forgeries, defending a view they're unsure of: that aesthetic value is solely based on perceptual surface properties. They want decisive counterarguments, not literature surveys, and have specific concerns about achievement, provenance effects, restoration cases, and twin museums. 

  Hmm, the core tension here is between formalism and contextualism. The professor's view is pure perceptual supervenience - what you see is all that matters aesthetically. But their unease about achievement and provenance suggests they sense a crack in this foundation. 

  First, the achievement problem. When an artist solves a technical challenge (like Velázquez capturing light in Las Meninas), that struggle becomes part of the work's aesthetic power. A perfect copy lacks this historical struggle. The professor might try to argue that "achievement" is just our projection onto the surface, but that feels like special pleading - why do we consistently value originals more if the surface is identical? 

  Provenance is trickier. Learning a work's history changes how we look at it (noticing Rembrandt's brushwork differently when authenticated vs. doubted), but the professor could dismiss this as attention-shifting rather than value-altering. However, there's a stronger version: some aesthetic properties like "boldness" or "influence" seem inherently relational. If a technique was revolutionary in 1656 but commonplace now, its aesthetic impact differs even with identical surfaces. 

  The Ship of Theseus case is brutal. If a painting is 95% restoration, is it still Velázquez? The professor's view must say yes, aesthetically - but this clashes with conservation ethics where original material has privileged status. And the twin museums scenario exposes the absurdity: if aesthetic value is only perceptual, the collections are equally valuable - yet no curator would agree. 

  The unfalsifiability worry is damning. By defining aesthetic value as surface-bound, they've made the position tautological. The real question is whether we should accept that narrow definition. The professor admits what would move them: a case where identical surfaces have different aesthetic values. 

  Here's the killer example: Sol LeWitt's wall drawings. The aesthetic value is in the concept and execution instructions; any correct instantiation has equal value. But this backfires - it shows aesthetic value can exist without unique physical objects, undermining the original/copy hierarchy. More damaging is performance art like Marina Abramović's Rhythm 0, where the aesthetic meaning is inextricable from the real risk taken. A reenactment has different aesthetic value because the danger isn't real. 

  The professor's view survives only by excluding too much of what we intuitively call aesthetic value. It's not just about surface perception; it's about human actions, intentions, and histories that shape how we experience surfaces. The definition is the problem - they've made the dispute verbal by fiat. But the original/copy debate is substantive; we just need a broader conception of the aesthetic that accommodates achievement and provenance as constitutive, not just contextual.
answer: |-
  Here's a decisive case against your view, structured to address your pressure points and flagging where your position might dig in versus where it bleeds:

  ### The Fatal Case: Performance Art & Embodied Risk
  **Case:** Marina Abramović's *Rhythm 0* (1974). The work consisted of Abramović standing passive for 6 hours while the audience was invited to use 72 objects (feathers, honey, a knife, a loaded gun) on her body. The aesthetic power *depends entirely* on:
  1.  **The Real Risk:** It was Abramović *herself* enduring genuine physical/psychological danger.
  2.  **The Actual Event:** The specific, unrepeatable interaction with *that* audience at *that* time.
  3.  **The Artist's Presence:** Her actual body/mind as the medium.

  **Why this defeats your view:**
  1.  **Identical Surface ≠ Identical Aesthetic Value:** A molecule-for-molecule duplicate of Abramović *made last Tuesday*, placed in an identical room with identical objects and an identical-looking audience, would lack the essential aesthetic properties. The surface *is* the same. But the aesthetic value is fundamentally different because the core aesthetic properties – **vulnerability, tension, danger, endurance, the transgression of performer/audience boundaries** – are **constituted by the causal history and relational facts**: *This* body belongs to the artist who conceived the piece; *this* knife is being held by a stranger making a real choice; *this* risk is actual, not simulated.
  2.  **Achievement is Constitutive:** The aesthetic achievement *is* Abramović actually enduring this. A duplicate endures nothing; it's a prop. The achievement *is* the aesthetic content. Your view cannot acknowledge this without collapsing, as the "achievement" property vanishes in the duplicate despite identical surfaces.
  3.  **It's Unfalsifiable... and That's Bad:** Your definition *does* immunize you here: "That's not *aesthetic* value, it's experiential/documentary value!" But this exposes the flaw: **Your definition arbitrarily excludes core aesthetic experiences central to major art forms.** If the profound impact of *Rhythm 0* isn't primarily aesthetic, what is it? Reducing it to "non-aesthetic" facts (history, risk) ignores that these facts *are* the medium generating the aesthetic experience. Your stipulation becomes a *defect*, not armor, by excluding too much.

  **Where Your View Might Dig In (and Why it Fails):**
  *   **Concession:** "Performance art is a special case; it's not about a static perceptual object." *Rebuttal:* This concedes your view is limited to *paintings* (or static objects), but you presented it as a general theory of aesthetic value. If aesthetic value supervenes *only* on static surfaces, then vast swathes of art (performance, conceptual, land art, much contemporary work) fall outside "aesthetics" proper. This is an unacceptable narrowing. Aesthetic value isn't medium-specific in this way.
  *   **Concession:** "The value is in the *idea* or the *documentation*, not the perceptual surface of the event itself." *Rebuttal:* The aesthetic power resides precisely in the *live, embodied experience* of the real event – the tension in the room, the visceral reaction to real danger. Documentation captures traces, but the core aesthetic properties *required* the real, relational event. A re-enactment with a duplicate, even visually identical, produces a fundamentally different (and lesser) aesthetic experience – one of simulation, not confrontation.

  ### Addressing Your Specific Pressure Points
  1.  **Achievement:** *Rhythm 0* shows achievement *is* aesthetically constitutive. The duplicate lacks the achievement entirely, hence lacks the core aesthetic properties (endurance, risk, vulnerability-as-artistic-act). Your view has no principled way to exclude this without begging the question ("achievement isn't perceptual").
  2.  **Provenance/Attention:** Learning the provenance of the *Rhythm 0* duplicate (it's a fake body, fake risk) doesn't just make you *notice different features*; it completely **changes the ontological category of what you're perceiving** – from a record of real endurance to a simulation. This fundamentally alters the aesthetic *object* itself. It's not "same content, different attention"; it's **different content**. The "boldness" evaporates when it's known to be fake.
  3.  **Awkward Cases Reinforce the Problem:**
      *   **Ship of Theseus (95% Repaint):** Your view *must* say it's aesthetically equal to a pastiche. But this clashes with conservation ethics and the intuition that the *traces* of the original artist's hand (even minute) hold unique aesthetic significance as a historical record. The value isn't *just* in the current surface configuration, but in its causal link to the origin.
      *   **Twin Museums:** Your view *must* say they are aesthetically equal. Yet, knowing one houses originals and the other fakes fundamentally changes the *meaning* of the experience, even if undetectable. The originals are *relics* of artistic acts; the fakes are clever simulations. This difference feels aesthetically relevant. If a fire forced a choice, saving the originals feels imperative, suggesting a value beyond the perceptual.
  4.  **Unfalsifiability Verdict:** Your worry is correct. **Your position is largely a definition wearing the costume of a thesis.** By defining "aesthetic value" *as* that which supervenes on surface properties, you've made it tautologically true. The substantive question is: **Is *all* value we intuitively call "aesthetic" captured by this definition?** *Rhythm 0* and the cases above strongly suggest it is not. The dispute *is* substantive, but your definition prejudges the outcome. The core issue is **what constitutes the aesthetic object and its relevant properties.** Your view defines the object narrowly (the current surface); your opponent defines it more broadly (the object plus its causal genesis and relational properties).

  ### The Asymmetry with Lost Originals & Copies
  You're right that this initially pressures the contextualist. However, the contextualist can argue:
  1. The aesthetic value we derive *from the copy* is different: it's primarily *art-historical* or *imaginative* (valuable as a record of a lost aesthetic achievement, allowing us to imagine the original's impact).
  2. We readily acknowledge the loss of the *primary* aesthetic value that resided in the original object and its unique history. We value the copy *despite* knowing it lacks that original aesthetic value, precisely because we recognize the original *had* a value the copy cannot replicate.

  ### Conclusion & What Should Move You
  *   **The Fatal Blow:** Performance art like *Rhythm 0* provides a clear case where identical surfaces (a person standing still) have radically different aesthetic values because the aesthetic properties are constituted by non-perceptual, relational facts (real artist, real risk, real time). Your view cannot accommodate this without excluding performance art from aesthetics or engaging in ad-hoc redefinition.
  *   **The Core Defect:** Your view's unfalsifiability stems from an overly narrow, stipulative definition of "aesthetic value" that excludes properties demonstrably central to our aesthetic experience and judgments across many art forms. It mistakes a *component* of aesthetic value (perceptual properties) for the *whole*.
  *   **What Survives:** Your view correctly emphasizes that perceptual properties are *necessary* for much aesthetic value (especially in painting) and that many differences in market value reflect non-aesthetic factors. But it errs in claiming perceptual properties are *sufficient* for determining *all* aesthetic value.
  *   **The Way Forward:** The dispute is substantive. A more plausible view is that aesthetic value *supervenes on the artwork as a historically situated artifact*, where its perceptual properties *and* its specific causal history (including authorship, achievement, and original context) are jointly constitutive of its aesthetic properties. The surface matters profoundly, but it is not the sole dictator of aesthetic worth.
