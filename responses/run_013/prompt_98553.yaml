  #### **Leaf Positions & Embarrassing Commitments**
  - **CDT**: You openly prioritize causal impact but end up in tragedy-of-the-commons scenarios where individualism ruins collective gains.  
  - **EDT**: You treat your actions as evidence of unobservables, risking self-sabotage by conflating correlation with control.  
