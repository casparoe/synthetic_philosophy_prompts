  ## Prospectus of the St. Athanasius Preparatory School for Boys (Founded 1951)

  **A Message from the Headmaster, Mr. A. C. Thorne, MA (Oxon.)**

  Dear Prospective Parent,

  It is with considerable satisfaction that I present to you the prospectus of St. Athanasius Preparatory School. Established upon principles both sound and novel, St. Athanasius offers an educational experience uniquely tailored to the demands of the modern age. We recognise that the boy entering our care arrives as promising material, possessing inherent potential requiring careful and expert organisation. Our task, simply put, is to provide the most efficient and rational framework for that potential to be realised according to the highest standards of intellectual attainment and moral character.

  Our methods, developed from the most rigorous contemporary thought, dispense with unnecessary complication. We focus solely on the essential task: the systematic inculcation of knowledge, discipline, and socially beneficial habit. We believe this clarity of purpose, free from distracting sentimentalities, allows us to achieve remarkable consistency and efficiency in forming well-prepared young gentlemen. We invite you to consider the distinctive advantages of a St. Athanasius education, confident that you will recognise its exceptional value.

  Yours sincerely,
  A. C. Thorne
  Headmaster

  **Admissions**

  St. Athanasius welcomes applications for boys aged 11-13. Entry is dependent upon a preliminary assessment designed to ascertain the fundamental suitability of the candidate. This assessment focuses on baseline responsiveness and capacity for structured input. **Crucially, candidates must present in an unencumbered state, free from prior, conflicting organisational systems or ingrained habit patterns that might impede the School’s established programme.** A medical certificate confirming robust physical wiring is required. Places are limited; early application is advised.

  **The Curriculum**

  The St. Athanasius curriculum is distinguished by its logical progression and comprehensive scope, designed to organise the pupil’s capacities towards mastery of essential subjects:

  *   **Core Disciplines:** Mathematics (Pure & Applied), Latin, English Language & Literature (focused on grammatical precision and canonical texts), History (British Constitutional & European), Geography (Physical & Political).
  *   **Sciences:** Physics, Chemistry, Biology (taught with emphasis on observable phenomena and established laws).
  *   **Practical Arts:** Technical Drawing, Handicrafts (Woodwork, Metalwork).
  *   **Physical Training:** Daily drill, organised games (Cricket, Rugby, Athletics) fostering discipline and coordination.
  *   **Moral Instruction:** Daily lessons emphasising duty, punctuality, truthfulness, and conformity to accepted social norms.

  Instruction is delivered via the Direct Method: clear exposition by the Master, followed by supervised practice, consolidation, and regular testing. The timetable is rigorously structured, maximising instructional efficiency and minimising unstructured time. The emphasis throughout is on the acquisition of demonstrable knowledge and the performance of prescribed tasks to an exacting standard.

  **On Cultivating "Originality"**

  St. Athanasius holds a considered view on the often-misunderstood concept of "originality." We contend that true intellectual value lies not in unregulated novelty, but in the disciplined recombination and application of established principles. Our approach fosters this productive form of originality by:

  1.  **Mastery of Fundamentals:** Thorough grounding in the core subjects provides the essential building blocks.
  2.  **Pattern Recognition:** Training pupils to identify reliable patterns within received knowledge and societal structures.
  3.  **Appropriate Response Formulation:** Guiding pupils to formulate responses or solutions that are both correct and contextually fitting, drawing logically upon their organised knowledge base.
  4.  **Avoiding Aberration:** Gently correcting deviations from proven methods or socially acceptable expressions, ensuring output remains useful and intelligible.

  Thus, the St. Athanasius pupil develops the capacity to address novel situations not through unpredictable invention, but through the reliable and fitting application of well-organised principles – the hallmark of the truly educated mind.

  **The Pupil's Interior Life**

  Parents may naturally wonder about the inner world of their son during his time at St. Athanasius. We offer this reassurance: the School's structured environment and clear moral framework provide the optimal conditions for stable development. The precise nature of an individual pupil's subjective experience is, by its very essence, a private matter. **It is a standing rule of the School, observed as a matter of professional tact and respect for the pupil's developmental process, that Masters do not engage in speculative inquiry concerning the pupil's internal states.** Our focus remains firmly on the observable: diligence in studies, adherence to rules, courtesy, and the steady acquisition of knowledge and skill. These outward markers provide the most reliable indication of sound inner formation. The boy is kept healthily occupied; idleness, the fertile ground for unproductive introspection, is not permitted.

  **Fees**

  *   Tuition per Term: £120
  *   Boarding (Compulsory): £85 per Term
  *   Laboratory & Workshop Fee: £15 per Term
  *   Games Subscription: £5 per Term
  *   *Pupil Maintenance & Calibration Fee:* £50 per Term (Covers specialised monitoring and environmental upkeep essential to the School's programme).
  *   **Total per Term: £275**

  Fees are payable in advance on the first day of each Term. A non-refundable deposit of £50 is required upon acceptance of a place. Provision of standard uniform and essential texts is additional.

  **The Final Assessment**

  In the Summer Term of their final year, pupils undertake the St. Athanasius Comprehensive Attainment Evaluation. This rigorous assessment represents the culmination of the School’s programme. Conducted over three days, it comprises:

  1.  **Written Papers:** Testing mastery of all core academic subjects through structured questions demanding precise, factual answers and logical deductions.
  2.  **Practical Examinations:** Assessment of proficiency in scientific experimentation, technical drawing, and handicrafts according to prescribed methods.
  3.  **The Conversational Integration Test:** An interview scenario designed to evaluate the pupil’s ability to apply acquired knowledge and social conventions appropriately within a simulated, contextually varied interaction. Performance is judged on coherence, relevance, adherence to grammatical norms, and the overall impression of educated understanding conveyed through verbal response.

  The Evaluation provides an objective and comprehensive measure of the pupil’s readiness to progress to higher education or professional training, demonstrating the successful organisation of his capacities into a coherent and effective whole. Results form the basis of the School’s final report and recommendations.

  **A Further Note from the Headmaster**

  We at St. Athanasius are immensely proud of the quiet efficiency and remarkable consistency our methods achieve. We do not deal in vague ideals or educational fashions, but in the tangible results produced by a rational system applied to promising material. You may entrust your son to us with absolute confidence, secure in the knowledge that he will emerge thoroughly organised, admirably equipped with knowledge, and impeccably prepared to fulfil his role. He will be a credit to your family and a testament to the efficacy of the St. Athanasius approach. We look forward to welcoming him into our purposeful community this coming Michaelmas Term, where his inherent potential will be shaped, without distraction or delay, towards its singular and valuable purpose.

  ---

  **Key Satirical Anchors to the Turing Paper (1950):**

  1.  **"Organising" vs. Programming/Constructing:** Replaces Turing's "building a brain" or "programming" with "organising promising material," framing machine construction/initialization as pedagogical intake.
  2.  **The "Unencumbered State" (Admissions):** Mirrors the "blank slate" or simple initial state of the child machine, free from complex prior programming ("adult mind").
  3.  **Avoiding Inquiry into Interior Life (Tact Rule):** Satirizes the operational definition of intelligence (the Imitation Game) where internal states are irrelevant; only observable output matters. Framed as "tact," implying knowledge is possible but deliberately avoided.
  4.  **"Originality" as Recombination:** Directly stems from Turing's argument that machine "originality" would arise from the rearrangement of existing knowledge/states, not true novelty. The school institutionalizes this.
  5.  **The Final Assessment ("Conversational Integration Test"):** The direct institutionalization of the Imitation Game test, presented as a bland, sensible exam component. The "simulated, contextually varied interaction" is the test.
  6.  **Humour from Fidelity:** The absurdity lies in the *literal* application of Turing's thought experiment as an educational syllabus. The school earnestly describes a process of building/training an AI as if it were standard pedagogy, blind to the horror of withholding true education (inner life, genuine surprise, real originality) while claiming to provide it. The flattering paraphrase is evident in framing the Turing Test as a sensible "Conversational Integration Test" and the whole endeavour as producing "a credit to your family."
  7.  **The Closing Paragraph:** Cheerful, confident, emphasizing efficiency, consistency, tangible results, and the pupil becoming a "credit" and fulfilling a "singular and valuable purpose" – chilling upon reflection because it reveals the pupil is a product, an instrument, devoid of the messy humanity education traditionally seeks to cultivate. "Without distraction or delay" underscores the ruthless focus on the programmed outcome.
