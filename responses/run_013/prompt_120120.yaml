prompt: |-
  I'm giving a work-in-progress talk at our department's decision theory workshop in two weeks and I need a Q&A prep sheet, not a defense of the paper. My thesis: keep the infinite-ethics apparatus, drop the assumption that 'better than' is transitive once values are infinite. In the infinite cases I say betterness is a partial order at best, ethics only needs maximality -- don't take an option when a better one is available -- and nothing is lost, because the finite cases keep the full order. The case I lean on is a world W and a world W-plus, which is just W with one extra flourishing life added: I'm willing to bite the bullet that neither is better than the other. The audience is about eight people and none of them work on infinite ethics: six are decision theorists who live in Savage-style and Anscombe-Aumann-style axiomatic expected utility, two of those also do imprecise probabilty, one is a measure-theory person, and one ethicist who works on population ethics. So they'll come at this sideways, from decision theory, not from the metaphysics of infinity. Give me the five objections I'll actually get from this crowd, in their vocabulary, ordered by how likely they are and how much damage they do, and for each: what I should concede up front, what I should hold, and where the reply is softest. Include the one I'm hoping nobody asks. Definately don't hedge -- tell me which one I actually lose on. Exactly five numbered items, one or two sentences each, no intro and no wrap-up.
