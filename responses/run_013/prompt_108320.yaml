prompt: |-
  I'm running a 75-minute session on Zorn's lemma for a mixed room: math grad students who've used it as a black box for years, plus philosophy grad students who've read about it and never proved anything with it. I dont want you to explain Zorn's lemma to me — I want a plan for how I explain it. You're someone who's taught this material many times, has strong opinions about how it's usually taught badly, and is willing to tell me my plan is wrong.

  Start by thinking out loud for a bit about what actually has to be in place before the statement even lands, then give me the plan.

  What I need:

  - The order the pieces go in and why each one depends on the last. My instinct is: partial order, chain, upper bound, the hypothesis about chains, maximal element. But I suspect the real bottleneck is elsewhere, and that "chain" is quietly doing work nobody in the room notices. If so, where does it have to be made explicit, and at what cost to the clock?
  - The one example that carries the whole session, and what it must have and must not have. I was going to use "every vector space has a basis," since it's the one they've all seen. Talk me out of it if that's a mistake, and say what should carry it instead. What I want is an example where the chain-union step is not a formality — where you genuinely have to check something, and where the plausible shortcut fails, so they feel why the hypothesis is about chains and not about subsets in general.
  - The misconceptions, and exactly where in the sequence each gets headed off. Mine: maximal vs greatest element; thinking the lemma builds the maximal element or tells you how to find it; applying it where the upper bound condition obviously fails; the "just take the union of everything" move; and the suspicion that since it's equivalent to AC the whole thing is circular. If there's a misconception more fatal than these and I've missed it, lead with that instead of padding my list.
  - The precise point where I should say "this is where choice is hiding," and what I should say there. Should I prove the equivalence with AC at this level, sketch it, or openly refuse?
  - One closing question that tells me whether they've got the lemma or just memorized the statement.
  - What to leave out here and say so out loud.

  No reading list, no citations. And be blunt: if my ordering is wrong, or the example I'm attached to is a bad idea, or mixing these two audiences is just a mistake, say so rather than filling in my template. If what I'm asking for can't all be had at once — one example doing every job I listed — tell me that and tell me what to give up.
