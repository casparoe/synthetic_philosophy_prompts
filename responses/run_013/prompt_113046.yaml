prompt: |-
  I'm leading a session for a mixed reading group -- a couple of people know basic micro, most don't -- on interpersonal utility comparisons. I don't want the explanation itself, I want a teaching plan. I'm going to hang it on the difference between comparing utility levels and comparing utility differences, because that's the thing that keeps tripping people up and I think it's the spine of the whole issue. What has to come before what, what single example should carry the session (and what does that example need to have and lack so it doesn't smuggle in cardinal utility), which misconceptions they'll arrive with -- I'm betting on "utility just means happiness," "interpersonal comparisons need cardinal utility," and "money is a neutral proxy" -- and where exactly in the sequence I should head each one off. Tell me what to leave out at this level and say so out loud, and give me one question I can ask at the end that would show whether they've actually got the distinction rather than just nodding along. Also, be explicit about which parts of this are settled among people who work on it and which are genuinely contested -- don't let a contested view pass as the consensus.
reasoning: |-
  Okay, the user is leading a session on interpersonal utility comparisons for a mixed reading group. They want a teaching plan, not the explanation itself. The key focus is on distinguishing between comparing utility levels and utility differences, which they see as the core issue. 

  First, I need to unpack what the user really needs. They're clearly experienced—they know the common pitfalls like "utility=happiness" or "money as neutral proxy." They want to preempt these misconceptions. Their mention of "not smuggling in cardinal utility" suggests they're wary of accidentally implying stronger assumptions than necessary. 

  Hmm, the session design needs several layers: sequencing (what before what), a central example (must avoid cardinality), misconception handling, and a diagnostic end question. Also, they want transparency on what's settled vs. contested in the field. That's crucial—academic integrity matters here. 

  For structure: Starting with concepts everyone *thinks* they know (like utility) is smart. Then force the "level vs. difference" distinction early. The example should be simple but not oversimplified—maybe something visceral like hunger vs. thirst? Needs to lack quantitative language entirely. 

  Biggest risks: 
  1. People defaulting to money as a comparison tool (must demolish this). 
  2. Confusing empathy ("I imagine being them") with actual comparison (epistemological trap). 
  3. Missing that level comparisons *are* possible ordinally while differences aren't. 

  The end question must test if they can *apply* the distinction, not parrot it. Something like: "If Alice prefers X to Y more than Bob prefers Z to W, does that tell us whose utility *level* is higher?" (Answer: no, and that's the point.) 

  Contested areas: Whether normative economics *requires* interpersonal comparisons (e.g., for welfare policies). Must flag that as unresolved. Also, cardinality debates—though most agree it's not *necessary* for level comparisons. 

  ...Time to map this into phases. Phase 1 shatters "utility=happiness," Phase 2 introduces level/difference with the example, Phase 3 dissects money's flaws, Phase 4 clarifies ordinality, Phase 5 exposes epistemological limits. End with the diagnostic question and unresolved debates. 

  Leave out: Arrow's theorem, social welfare functions, Bergson-Samuelson. Too advanced. Say that explicitly. 

  Final check: Does this make level comparisons feel possible (ordinal) while differences feel shaky (cardinal needed)? If yes, spine is intact.
answer: |-
  Here’s a structured teaching plan focused on **utility levels vs. utility differences**, designed for mixed backgrounds. It preempts key misconceptions, uses a targeted example, and flags contested areas.

  ---

  ### **Teaching Plan: Interpersonal Utility Comparisons**
  **Core Spine:** Distinguishing *comparing utility levels* (A is happier than B) from *comparing utility differences* (A gains more from X than B gains from Y).

  #### **Phase 1: Reset "Utility" (15 mins)**
  - **Goal:** Demolish "utility = happiness" misconception.  
  - **What to do:**  
    1. Start with group definitions of utility. Likely get "happiness/satisfaction."  
    2. **Reframe:** "Utility is an *ordinal* ranking of preferences. If I choose coffee over tea, my utility from coffee > utility from tea. It doesn’t tell me *how much* happier I am."  
    3. **Key analogy:** "Utility is like a list of your favorite movies ranked 1st, 2nd, 3rd. We know #1 > #2, but not *by how much*."  
  - **Why now?** Must sever utility from cardinal quantification early.  

  #### **Phase 2: Introduce Level vs. Difference (10 mins)**  
  - **Goal:** Define the core distinction.  
  - **What to do:**  
    1. **Utility level comparison:** "Is Alice *better off* than Bob?" (e.g., Alice at her job vs. Bob at his).  
    2. **Utility difference comparison:** "Does Alice *gain more* from a raise than Bob gains from vacation?"  
    3. **Stress:** "Levels compare *states*; differences compare *changes*."  

  #### **Phase 3: The Central Example (20 mins)**  
  **Example: "Hungry Anya vs. Thirsty Ben"**  
  - **Scenario:**  
    - *Anya* hasn’t eaten in 12 hours. Offered an apple, she says: "This relieves my hunger a lot!"  
    - *Ben* hasn’t drunk in 12 hours. Offered water, he says: "This relieves my thirst a lot!"  
  - **What the example HAS:**  
    - Strong intuitive "gains" (relief from acute discomfort).  
    - No numbers/quantities (avoids cardinal smuggling).  
    - Clear *intrapersonal* comparisons (Anya knows her own hunger relief).  
  - **What the example LACKS:**  
    - Any common unit (calories, dollars, "utils").  
    - Direct link to happiness intensity (focus on preference satisfaction).  
  - **Guided Discussion:**  
    1. *Q: "Can we say Anya is happier than Ben?"* → Unpack "level comparison": No objective basis.  
    2. *Q: "Can we say Anya gains more from her apple than Ben from his water?"* → Unpack "difference comparison": We hear both say "a lot," but no common scale.  
    - **Key Insight:** We *feel* we can compare differences (both "gain a lot"), but we lack a scientific basis.  

  #### **Phase 4: Tackle Misconceptions (15 mins)**  
  1. **"Money is a neutral proxy":**  
     - *When:* During Phase 3 or when discussing gains.  
     - *Head off:* "Suppose Anya pays $2 for the apple, Ben pays $1 for water. Does Anya’s *utility gain* > Ben’s? No! Money measures willingness to pay, not utility. Anya might be richer, or more desperate."  
     - **Settled:** Money ≠ utility. WTP is ordinal and budget-constrained.  

  2. **"Interpersonal comparisons need cardinal utility":**  
     - *When:* When defining level/difference.  
     - *Head off:* "Level comparisons *can* be ordinal: If we observe Anya always chooses options that leave her 'better off' than Ben’s choices, we might *infer* she has a higher utility level. But difference comparisons *do* require cardinal utility."  
     - **Settled:** Level comparisons are *conceptually possible* ordinally; difference comparisons require cardinal (contested).  

  3. **"Utility just means happiness":**  
     - *When:* Phase 1 (preemptively).  
     - *Head off:* Emphasize behaviorism ("utility reveals itself in choices"). Happiness is subjective; utility is preference-based.  

  #### **Phase 5: Epistemological Limits (10 mins)**  
  - **Q: "How *could* we compare utility across people?"**  
  - **Settled:**  
    - We can’t observe utility directly.  
    - *Levels:* We might infer from choices (e.g., Anya chooses objectively better outcomes), but this relies on value judgments.  
    - *Differences:* No scientific method without cardinality.  
  - **Contested:**  
    - Whether empathy/simulation ("imagine being them") justifies comparisons (rejected by positivists, accepted by some ethicists).  
    - Whether "extended preferences" (Harsanyi) allow comparisons.  

  #### **Phase 6: What to Explicitly LEAVE OUT**  
  - **Say aloud:** "We’re skipping:  
    - Cardinal utility theories (like von Neumann-Morgenstern).  
    - Social welfare functions (Bergson-Samuelson).  
    - Aggregation rules (e.g., utilitarianism).  
    Why? They build *on* today’s foundation. Get this wrong, and those collapse."  

  #### **Diagnostic End Question**  
  **"In the Anya/Ben example:  
  If we *learn* that Anya’s gain from an apple is greater than her gain from $10, and Ben’s gain from water is greater than his gain from $10, can we conclude Anya gains *more* from the apple than Ben gains from the water? Why/why not?"**  

  - **Correct answer:** No. We only know each prefers their good to $10 *intrapersonally*. We can’t compare the *magnitude* of gains across people without cardinal utility.  
  - **Why it works:** Tests if they confuse intrapersonal comparisons (possible ordinally) with interpersonal difference comparisons (require cardinal).  

  ---

  ### **Contested vs. Settled Areas**  
  | **Aspect**                     | **Settled Consensus**                                        | **Genuinely Contested**                                      |  
  |--------------------------------|-------------------------------------------------------------|-------------------------------------------------------------|  
  | **Cardinal utility needed**    | Not needed for *level* comparisons.                         | Needed for *difference* comparisons? (Most agree yes).       |  
  | **Feasibility of comparisons** | No *positive* scientific method for interpersonal differences. | Can *normative* economics require comparisons? (e.g., policy). |  
  | **Role of empathy**            | Not a rigorous basis for economics.                         | Whether it has ethical value (e.g., Nussbaum vs. Robbins).   |  

  **Final Tip:** Use whiteboard to map:  
  ```  
  LEVEL COMPARISON (ordinal possible)  
    │  
    └── "Is Anya better off?" → Contested but feasible with value judgments  
  DIFFERENCE COMPARISON (requires cardinal)  
    │  
    └── "Does Anya gain more?" → Scientifically unverifiable  
  ```  
  This visual reinforces the spine. Good luck!
