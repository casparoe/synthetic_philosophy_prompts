  Below is a decision tree that maps the logical space of positions on the reality of patterns posited by the intentional stance (e.g., beliefs and desires). The tree is built from fundamental questions about ontology, observer-dependence, coarse-graining, and reducibility, leading to six distinct leaves (as requested). Each internal node is a yes/no question answerable without knowing the resulting position. Concrete systems (e.g., chess engine, thermostat, ant colony) illustrate the commitments at the leaves. Your desired position—**Non-Reductive Pattern Realism**—appears as Leaf 4 and is distinguished from similar views. The philosopher of science's "merely verbal" stance is Leaf 6.

  ---

  ### **Decision Tree: The Reality of Intentional Patterns**

  **Start at Question 1:**  
  **Q1. Is the dispute about the reality of intentional patterns substantive (i.e., do disagreements reflect genuinely distinct ontologies)?**  
  - **No** → Proceed to Q1a.  
  - **Yes** → Proceed to Q2.  

  **Q1a. Is the apparent disagreement merely due to ambiguous or divergent definitions of "real"?**  
  - **Yes** → **Leaf 6: Verbal Dispute**  
    - *Position*: The debate is non-substantive; differences are linguistic (e.g., "real" means something different to a physicist vs. a cognitive scientist).  
    - *Most awkward commitment*: Must dismiss all ontological arguments as terminological, even when proponents clarify their terms and still disagree.  
    - *Note*: This is a meta-position that refuses ontological commitment but is included as a leaf for completeness.  
  - **No** → *This branch is incoherent*; if the dispute isn't substantive and isn't verbal, no coherent alternative remains.  

  **Q2. Does the predictive success of the intentional stance license belief in the reality of the patterns it posits?**  
  - **No** → **Leaf 1: Instrumentalism**  
    - *Position*: Beliefs/desires are useful fictions (e.g., predicting a chess engine's moves via "desire to win" is pragmatic but not truth-tracking).  
    - *Most awkward commitment*: Must deny reality to wildly successful predictions (e.g., treating an ant colony's "collective intelligence" as a metaphor, even when it guides accurate forecasts of foraging behavior).  
  - **Yes** → Proceed to Q3.  

  **Q3. Is the pattern's reality observer-dependent? (i.e., does it require an actual or possible observer to compress the system's behavior?)**  
  - **Yes** → **Leaf 2: Observer-Dependent Pattern Realism**  
    - *Position*: Patterns are real but exist only relative to an observer's predictive strategy (e.g., a thermostat "believes the room is cold" only when we adopt the intentional stance; unobserved, it's just circuitry).  
    - *Most awkward commitment*: A system (e.g., a market) has no intentional properties in the absence of any observer, even if its behavior is identical.  
  - **No** → Proceed to Q4.  

  **Q4. Is the pattern defined only relative to a coarse-grained description? (i.e., does it vanish at the finest physical grain?)**  
  - **No** → **Leaf 5: Fine-Grain Pattern Realism**  
    - *Position*: Intentional patterns exist at the fundamental level (e.g., a bacterium's "desire for nutrients" is present in its atomic structure).  
    - *Most awkward commitment*: Requires ascribing proto-intentionality to basic particles (e.g., electrons in a thermostat "know" temperature thresholds).  
  - **Yes** → Proceed to Q5.  

  **Q5. Is the pattern recoverable without remainder from the finest-grained physical description? (i.e., can microstates fully explain the macro-pattern?)**  
  - **Yes** → **Leaf 3: Reductive Pattern Realism**  
    - *Position*: Patterns are real but reducible to physical states (e.g., a chess engine's "belief" is identical to its software state; microstates exhaust the macro-pattern).  
    - *Most awkward commitment*: The intentional stance is ontologically dispensable (e.g., we could replace "the market believes X" with a neural/algorithmic account of all traders).  
  - **No** → **Leaf 4: Non-Reductive Pattern Realism**  
    - *Position*: Patterns are real, irreducible, and emerge only at coarse grains (e.g., beliefs/desires are like temperature: a genuine property of a system, not observer-dependent, but lost at fine grains).  
    - *Most awkward commitment*: Accepts "downward causation" (e.g., an ant colony's "desire to build a nest" constrains individual ants, yet isn't reducible to ant-physics).  

  ---

  ### **Key Features of the Tree**
  - **Total leaves**: 6 (Instrumentalism, Observer-Dependent, Reductive, Non-Reductive, Fine-Grain, Verbal Dispute).  
  - **Your position (Leaf 4: Non-Reductive Pattern Realism)**:  
    - *How it differs from Leaf 2 (Observer-Dependent)*: Your view treats patterns as *ontologically robust* (e.g., temperature exists in a gas regardless of observers), whereas Leaf 2 makes patterns *mind-dependent* (like a useful fiction that requires an observer).  
    - *How it differs from Leaf 1 (Instrumentalism)*: You assert patterns are real (not just convenient tools), and from Leaf 3 (Reductive): you deny patterns are fully capturable at the micro-level (e.g., temperature isn't just particle motions; it constrains system behavior in ways microstates alone cannot explain).  
