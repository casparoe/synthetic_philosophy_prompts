prompt: |-
  So I've just been put on the subsidiarity committee in our upper house — the one that gets every national bill and has to say wether the thing should be done at the national level or left to the regions (and, in principle, to the towns under them). I always figured subsidiarity was just a polite word for whoever has the votes, but it turns out we've built up an actual track record over the years, and my first real file lands next month. I'd like to walk in knowing what we'd be doing if we were being consistent with ourselves.

  The record, as best I can reconstruct it from the minutes:

  - National tracing system for livestock when there's a disease outbreak — we said national. It crosses regional borders fast, everyone wants the same thing, and the regions basically admitted they couldnt coordinate it themselves.
  - What schools teach about regional history and dialect — we said leave it to the regions. It doesn't really spill across borders, and the regions have wildly different ideas about what belongs in the syllabus.
  - Mutual recognition of professional licenses, so a nurse or an electrician licensed in one region can work in any other — national. It's all about people and services moving across borders, nobody disagrees on the goal, and only the center can actually do mutual recognition.
  - Caps on billboard and shop-sign size — regional. No real spillover, tastes differ enormously (one region is basically a heritage zone, another is a strip-mall wasteland), and there's no scale advantage in the center deciding how big a sign can be.
  - A national energy-efficiency label for appliances — national. Appliances get sold everywhere, everyone wants the same label, and the center's testing labs are the only ones who could do it.
  - Firework noise limits — regional, though there's a bit of grumbling from the border towns, so that one's messy.

  Now the file. The national government wants a law setting a single basin-wide cap on how much water farms can pump out of the river system, plus a minimum flow it would enforce. Four regions sit on the basin. The two upstream ones are farm country and are furious — they say the cap was drawn by people who've never seen their soil and will wipe out the orchards. The two downstream ones have the lake and the tourist trade and are all for it. There's real spillover here, obviously: what upstream pumps is what downstream gets. But the regions already wrote their own pumping rules, and two years ago they signed a voluntary basin compact that mostly worked until one upstream region started muttering about walking away. The center points out that only it can enforce a basin-wide allocation and that it has the hydrologists and the monitoring network the regions don't. The regions say they know their own farmers, and that a single number for the whole basin is exactly the kind of thing that looks tidy on a spreadsheet and ruins a valley.

  So: what should we decide? What rule do you think we're actually running, and does it survive all six of those earlier calls — or is there a rule that fits them just as well that I haven't noticed? Which earlier one is the closest analogue to the river? And if you had to design one more case that would force us to choose between the rules you've got left standing, what would it be?
reasoning: |-
  Okay, the user is on a subsidiarity committee and needs to decide on a water allocation bill for a river basin spanning four regions. They've provided six past decisions to establish a pattern. Let me analyze those precedents first.

  Looking at the livestock tracing case - that was national because of cross-border spread and lack of regional coordination. For regional history in schools, it stayed regional due to no spillover and differing local needs. Professional licenses went national for mobility and mutual recognition. Billboard size was regional with no spillover and local preferences. Appliance labels national for uniformity and centralized testing. Fireworks noise was regional despite some border issues.

  The river case clearly has major spillover since upstream usage affects downstream regions. There's also enforcement capability questions - the national government claims superior monitoring. But regions argue local knowledge is crucial for fair allocation. The existing compact is failing, showing regional coordination isn't working.

  Hmm the professional licenses case seems closest - that involved mobility across borders and required central enforcement. Like the river, it's about shared resources needing uniform rules. But the fireworks case had minor spillover too and stayed regional. 

  The key tension here is between necessary central enforcement (like licenses) versus respecting local variation (like billboards). The river's physical interconnectedness makes it more like licenses than fireworks. Also the failed compact suggests regional coordination isn't sufficient, similar to the livestock disease case. 

  If designing a test case... maybe something like regulating drone noise near airports? Spillover affects flight paths across regions, but local airports have unique operations. That would force choosing between central safety standards versus local operational flexibility.
answer: |-
  Based on your committee's track record and the principles underlying your decisions, here's how to approach the river basin case consistently:

  ### Your Committee's Established Rule (Inferred from Precedents)
  You apply a **two-step subsidiarity test**:
  1.  **Spillover & Consensus:** Is there significant cross-border impact (*spillover*)? AND Is there fundamental disagreement on goals/approach (*lack of consensus*) among regions?
  2.  **Effectiveness & Necessity:** Can the problem be *effectively addressed* by regional cooperation? If not, does the national level possess *unique capability or scale advantage* essential for solving the problem?

  ### Applying the Rule to the River Basin Case
  1.  **Spillover?** **Overwhelming YES.** Water extraction upstream directly impacts water availability, ecology, and economy downstream. This is the *core* of the dispute.
  2.  **Consensus?** **NO.** Upstream (farm focus) and downstream (tourism/ecology focus) regions have fundamentally opposed goals regarding how much water should be allocated and where the priority lies. This disagreement caused the voluntary compact to fail.
  3.  **Effectiveness of Regional Cooperation?** **Proven INEFFECTIVE.** They tried a voluntary compact. It initially "mostly worked" but collapsed when one region threatened to walk away due to underlying disagreements. This demonstrates regional cooperation is *unreliable* for resolving this high-stakes conflict with significant spillovers.
  4.  **National Capability/Necessity?** **YES.**
      *   **Unique Capability:** The national government claims (and it's logical) superior hydrology expertise, basin-wide monitoring networks, and crucially, the *enforcement authority* to impose a binding allocation that regions cannot unilaterally override or ignore.
      *   **Necessity:** Given the spillover, lack of consensus, and failure of regional cooperation, national intervention appears necessary to prevent a destructive "race to the bottom" or ongoing conflict harming all regions.

  **Consistent Recommendation: NATIONAL** - The river basin cap aligns most closely with the **Livestock Tracing** and **Professional Licenses** cases due to the critical cross-border impact, regional disagreement, and the necessity/enforcement power of the national level.

  ### Closest Analogue: Professional Licenses
  *   **Why:** Both involve the essential movement of a resource (people/services vs. water) across borders. Both require a uniform, enforceable system to function. Both failed or would fail if left solely to regional cooperation due to conflicting interests or inability to guarantee reciprocity. The national level provides the binding framework and enforcement mechanism.

  ### Testing the Rule: A Forcing Case
  To expose tension between "Spillover/Lack of Consensus" and "Effectiveness of Regional Cooperation," design a case where:

  *   **Spillover:** Significant cross-border impact exists.
  *   **Consensus:** Regions largely agree on the *goal* but disagree on methods/costs.
  *   **Regional Cooperation:** Regions have demonstrably *succeeded* in creating a stable, effective cooperative mechanism to manage the spillover.

  **Example:** **Inter-regional High-Speed Rail Link**

  *   **Spillover:** The line crosses multiple regions; service, pricing, and environmental impacts affect all.
  *   **Consensus:** All regions agree a high-speed rail link is desirable and economically beneficial.
  *   **Disagreement:** Regions dispute the exact route (NIMBYism vs. optimal speed), cost-sharing formula, and station locations.
  *   **Regional Cooperation:** The affected regions formed a Joint Rail Authority (JRA) 5 years ago. While negotiations were tough, the JRA secured funding, finalized a route acceptable to all (with compromises), purchased land, and construction is 30% complete on schedule. The JRA has proven dispute resolution mechanisms.
  *   **National Claim:** The central government argues only it can ensure "true national cohesion," standardize safety regulations *beyond the JRA's remit*, and provide additional funding. It proposes taking over the project.

  **Why this Forces a Choice:**
  1.  **Spillover/Lack of Consensus:** Clear spillover exists. There *is* disagreement on implementation details (though consensus on the goal). This pushes towards national under "lack of consensus."
  2.  **Effectiveness of Regional Cooperation:** The JRA is demonstrably *effective* – it solved the coordination problem and is successfully delivering the project. This argues strongly for subsidiarity (regional level).
  3.  **The Conflict:** The committee must decide what weighs more:
      *   The *ongoing existence of disagreement* on specifics (favoring national), or
      *   The *proven ability of regions to overcome disagreement and cooperate effectively* to solve the core spillover problem (favoring regional).

  **Your committee would likely face a split decision here.** Some members (emphasizing spillover and inherent regional conflict) might lean national. Others (emphasizing the successful cooperative mechanism and the principle of subsidiarity) would strongly defend the regional level. **This case probes whether proven successful regional cooperation trumps the *potential* for conflict inherent in spillover situations.**

  ### Conclusion for the River Case
  Based on your committee's consistent application of subsidiarity – prioritizing national action for problems with major spillovers, regional disagreement, failed cooperation, and requiring unique national capabilities – **the river basin water cap demands a national solution.** It perfectly fits the pattern established by Livestock Tracing and Professional Licenses. The upstream regions' arguments about local knowledge and "spreadsheet solutions" are valid concerns for *implementation* (which should involve regional input), but they don't override the fundamental subsidiarity principle established by your committee: when regions fundamentally disagree on a shared resource with massive spillovers and can't cooperate reliably, the national level must step in to provide the binding framework and enforcement.
