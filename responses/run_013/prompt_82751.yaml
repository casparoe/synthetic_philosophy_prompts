prompt: |-
  I sit on a small ethics committee that our city council has asked to draft a short model code for local election conduct, and I keep running up against a line that everyone around the table treats as obvious and that I cannot reconstruct. On one side of the line the prohibitions are severe and uncontroversial: it is a crime to pay someone to cast their ballot a particular way, or to hand a voter money, groceries, a job, or a ride to the polls in exchange for voting as you wish; and paying a legislator to vote your way is bribery. On the other side almost anything goes: it is perfectly lawful to pay canvassers to knock on doors and make the case, to hire consultants to produce advertisements designed to change how people vote, to pay pollsters to learn what would move them, and to spend enormous sums persuading a legislator who cannot legally be paid a dollar for the same vote. So the law is plainly not protecting election outcomes from the influence of money, since money is permitted to do exactly that. It looks as though it protects the vote itself: paying for the vote as such is forbidden, while paying for the production and transmission of reasons for voting is not. What does that distinction presuppose? I am not a philosopher -- my training is in public administration -- but a colleague in the law school tells me this is a version of what philosophers call the wrong kind of reasons problem, and I would like to know whether that is the right diagnosis or whether the practice is doing something else entirely.

  I want the implicit theory behind the line reconstructed, and I want the reconstruction to answer several questions. Does the prohibition presuppose that there are considerations that genuinely count in favor of voting one way, alongside other considerations that may move a voter but are not reasons for the vote at all -- or that they are reasons, but of a kind that cannot make a vote correct, fitting, or well-founded? Does it require that a vote be treated as a judgment answerable to how things are, rather than as the expression of a preference or a bare decision, given that on a preference or decision picture there is arguably no such thing as the wrong kind of reason? Or is the distinction doing work that has nothing to do with reasons: protecting the equal standing of citizens, preventing a fiduciary breach by elected officials, securing the epistemic benefits of independent judgment, preserving the expressive meaning of the franchise, or merely following a convention that has outlived whatever rationale it once had?

  Please test the reconstruction against the cases our code will actually have to decide: a civic lottery that pays citizens a small sum for turning out but says nothing about how they vote; paying a voter to read a voter guide and attend a candidate forum; paying someone to abstain or to spoil their ballot; an employer who ties a benefit to turning out; and the secret ballot itself, which conceals a voter's reasons from everyone and might therefore presuppose that those reasons do not matter, or might presuppose the opposite, that they matter so much that the voter must be shielded from pressure. Say which parts of the practice strictly require which presupposition and which are merely well explained by it, identify the points at which the practice is underdetermined because several rival theories would license exactly the same line, and tell me what would have to change if we replaced the presupposed view with a straightforwardly aggregative one under which only the effects of money on outcomes matter. Finish by saying what my committee should write if we take the reconstruction seriously, and what we should write if we conclude the line is a historical accident we no longer believe in.
reasoning: |-
  Okay, the user is part of a city ethics committee drafting a code for election conduct, and they're grappling with the distinction between prohibited and permitted uses of money in elections. They've noticed that directly paying for votes is illegal, but spending money on persuasion is allowed. The user is trained in public administration, not philosophy, but a law colleague mentioned the "wrong kind of reasons" problem. They want to understand the theoretical basis behind this distinction and how it applies to specific cases their committee must decide on.

  First, I need to unpack the core distinction they're struggling with. The prohibition targets quid pro quo exchanges for votes (money for specific voting actions), while allowing expenditures aimed at influencing votes through persuasion (ads, canvassing). The user suspects this isn't about preventing money's influence per se, but about protecting something about the nature of voting itself. 

  Their questions reveal several layers: 
  - Whether the distinction presupposes a normative view of voting as judgment rather than preference
  - Whether it relates to epistemic concerns, equal citizenship, or fiduciary duties
  - How to handle edge cases (lotteries for turnout, paying to read voter guides, etc.)
  - What happens if they abandon the current framework

  The "wrong kind of reasons" reference is key. In philosophy, this distinguishes reasons that bear on the merit of an action (right kind) from extraneous incentives (wrong kind). For voting, this would mean: 
  - Right-kind reasons: Policy outcomes, candidate qualifications (merit-based)
  - Wrong-kind reasons: Personal gain from being paid (extraneous)

  But this theory needs stress-testing. Take their cases: 
  - Turnout payments (civic lottery): Allowed because it doesn't target vote choice, only participation. Aligns with both "wrong reasons" theory (no incentive for specific vote) and equality/epistemic views. 
  - Paying to read voter guides: Tricky. Could be seen as incentivizing good judgment (right-kind reasons) but risks blurring into vote-buying if tied to eventual choice. 
  - Ballot spoilage payments: Prohibited under any theory - it's direct interference with electoral expression. 
  - Employer turnout benefits: Permissible if not vote-specific, but crosses line if implied coercion exists. 

  The secret ballot is particularly revealing: It hides reasons, which could support either "reasons don't matter" (aggregative view) or "reasons matter so much they need protection" (judgment view). But historically, its purpose aligns with the judgment view - shielding voters from coercion so they can vote based on merit. 

  Underdetermination points emerge: 
  - Turnout incentives are allowed by both judgment and aggregative theories (if they boost participation without distortion) 
  - Anti-bribery laws for legislators fit fiduciary and equality theories equally well 

  If the committee adopts a purely aggregative view (only outcomes matter), they'd have to permit vote-buying unless empirically proven distorting - a radical shift. But if they endorse the judgment view, the code should emphasize protecting voters' autonomy to weigh relevant reasons, banning all quid pro quo exchanges while allowing persuasion. 

  Practical drafting advice: 
  - If keeping the traditional line: Prohibit all direct exchanges of value for vote actions (specific or spoiled), allow general persuasion and turnout efforts. 
  - If abandoning it: They'd need revolutionary justification given current legal frameworks, likely focusing solely on outcome distortion evidence - but this seems unlikely and unwise. 

  The user's real need is to translate philosophical coherence into enforceable rules. The reconstruction shows the existing system isn't arbitrary - it coheres around voting as reason-based judgment - even if some edges remain fuzzy. Their code's language should reflect this by centering prohibitions on transactions that bypass judgment.
answer: |-
  The distinction you're grappling with rests on a specific conception of **voting as an act of judgment** rather than preference expression or mere transaction. This presupposes that votes *should* be based on reasons responsive to the merits of candidates/policies (the "right kind" of reasons), not extraneous incentives (the "wrong kind"). Here's the reconstructed theory and its application:

  ---

  ### **Core Presupposition: Voting as Reasoned Judgment**
  The legal line assumes:
  1. **Voting is an epistemic act**: A vote aims to reflect what is best for the polity (correct/fitting judgment), not personal gain.
  2. **Reasons have types**: 
     - **Right-kind reasons**: Relevant to the public good (e.g., policy effects, candidate integrity).
     - **Wrong-kind reasons**: Private incentives disconnected from merit (e.g., direct payment).
  3. **Voter autonomy**: Citizens must be free to weigh relevant reasons without coercion. Money for *persuasion* provides reasons; money for *votes* replaces reasons.

  This is distinct from:
  - **Aggregative views** (votes as preferences): No inherent "wrong reasons," only concerns about coercion or fairness.
  - **Expressive views** (votes as identity): Focus on non-commodification of civic expression.

  ---

  ### **Testing Cases Against the Theory**
  | **Case** | **Permitted?** | **Why? (Under Judgment Theory)** | **Rival Theories' View** |
  |----------|----------------|----------------------------------|--------------------------|
  | **Civic lottery for turnout** | Likely yes | Incentivizes participation without attaching to vote *choice*. Autonomy intact. | **Aggregative:** Permitted if boosts turnout. **Equality:** May object if wealthier groups benefit more. |
  | **Paying to read voter guide/attend forum** | Gray zone | If payment is for *education* (enhancing judgment), it aligns with right-kind reasons. **But** if tied to voting a certain way, it becomes bribery. | **Epistemic:** Permitted if improves voter competence. **Fiduciary:** Irrelevant (applies to officials). |
  | **Paying to abstain/spoil ballot** | No | Violates autonomy: compensation for *not* exercising judgment or distorting expression. | **Expressive:** Prohibited (commodifies civic act). **Aggregative:** Permitted if no outcome distortion. |
  | **Employer ties benefit to turnout** | Permitted with limits | Incentivizes civic duty, not specific votes. **But** if implied coercion ("we expect you to vote for X"), prohibited. | **Equality:** Concerns if punitive (e.g., firing non-voters). |
  | **Secret ballot** | Required | Protects voters from coercion, ensuring judgments are based on merit, not pressure. Presupposes reasons *matter profoundly* and must be shielded. | **Aggregative:** Only prevents retaliation. **Expressive:** Shields authentic self-expression. |

  ---

  ### **Where the Practice is Underdetermined**
  - **Turnout incentives**: Allowed by judgment, aggregative, and equality theories (if structured fairly). No single theory exclusively explains this.
  - **Legislator bribery bans**: Fit judgment theory (votes as fiduciary duty), fiduciary duty (public trust), *and* equality (preventing oligarchy). Overlapping consensus.
  - **Campaign spending**: Judgment theory allows it (providing reasons), but aggregative/equality theories might restrict it to prevent wealth distortion.

  ---

  ### **What Changes Under an Aggregative View?**
  If only *outcomes* matter (not reasons or autonomy):
  1. **Vote-buying could be permitted** if it doesn't distort aggregate will (e.g., paying swing voters proportionally to demographics).
  2. **Payments to abstain** would be allowed if they improve outcomes (e.g., reducing "uninformed" votes).
  3. **Secret ballots become optional**, as coercion only matters if it changes results.
  4. **Employer pressure** is acceptable unless proven to skew elections.

  **Radical shift**: Elections become market-like, optimizing outcomes rather than protecting deliberative integrity.

  ---

  ### **Recommendations for Your Committee**
  #### **If endorsing the judgment theory:**
  > *"No person shall offer or provide material benefit to another in exchange for:*  
  > *a) Casting or refraining from casting a ballot;  
  > b) Voting for or against a specific candidate or measure;  
  > c) Altering or invalidating a vote.  
  > Permissible activities include non-coercive incentives to participate, public education efforts, and communications intended to inform electoral judgment."*  
  > **Include:** A preamble affirming voting as a "duty of reasoned judgment in the public interest."

  #### **If rejecting the theory as obsolete:**
  > *"No person shall use undue inducements that demonstrably distort electoral outcomes or coerce voters. Material benefits are prohibited only if proven to:*  
  > *a) Systematically alter vote shares beyond statistical norms; or  
  > b) Exploit vulnerabilities (e.g., poverty, misinformation)."*  
  > **Include:** Strict reporting requirements to monitor outcome effects.

  ---

  ### **Conclusion**
  The current line **presupposes voting as judgment**, not preference aggregation. While underdetermined in peripheral cases (like turnout incentives), it coheres best with protecting autonomy and epistemic integrity. An aggregative approach would destabilize core norms but might suit a purely consequentialist framework. For most communities, the judgment theory offers a principled foundation—ground your code in **voter autonomy** and **fiduciary integrity** to bridge philosophy and practicality.
