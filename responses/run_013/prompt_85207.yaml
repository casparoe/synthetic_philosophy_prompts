prompt: |-
  I sit on the standards panel at the small charity I work for (I'm a retired nurse, not an academic, so excuse the rambling) — four of us get shown anything that looks dodgy and decide whether a partnership survives. I keep getting the feeling we're making it up as we go along, and I want to know what we've actually been doing. Here's the record, roughly.

  1. A partner's director took cash from a supplier under the table for a contract. We ended the partnership. Nobody on the panel lost any sleep over that one.

  2. At the close of a project the community threw a big do: we paid for a goat and some crates of beer out of the project budget, and the district officer was handed a carved stool in front of about two hundred people, with our own staff taking the photos. We said that was fine — that's how you close a project there, and the donor's auditors accepted it.

  3. A staff member paid a customs clerk a small amount in cash to get a container of medical supplies out of the port in two days instead of three weeks. It went through the books as handling charges. We said fine, that's expediting, and the supplies reached the clinic.

  4. A partner's director hired his two nephews as field officers. No advert, the posts hadn't existed before, but the two of them did the job okay, and where he's from a man in his position is expected to look after his relatives and would be shamed if he didn't. We said no — nepotism — re-advertise the posts, and we came close to pulling the partnership.

  Now the new case, same country as 4. Our country director steered a contract to a cooperative from his own village, where his uncle is the chair. The thing is, their bid was genuinely the best and the cheapest, the work's been excellent, the clinic opened on time, nothing was skimmed. He didn't declare the connection — but he didn't hide it either, the whole office knew.

  So what do we decide, and what does that commit us to saying we've been doing all along? I definately go back and forth on whether we have a rule at all or just four gut feelings. My own test has been to ask whether the schoolkids in the donor country who did the sponsored runs would be angry if they saw it on the front page, but I've noticed that test would have got 2 and 4 both wrong, so maybe I'm the inconsistent one.

  I'd also like an honest word about what we give up either way. Alot of the panel thinks we're just imposing rich-country morality on people who organise their obligations differently and that we should get off our high horse; the other half thinks a bribe is a bribe. Don't fudge it. And tell me which of the four is the closest analog to the new case, and if you think two of our old decisions were really driven by different principles that happen to agree so far, tell me what kind of case would finally separate them.
reasoning: |-
  Okay, the user is part of a standards panel at a small charity, dealing with ethical dilemmas in partnerships. They're a retired nurse, not an academic, so they want practical advice without jargon. They've shared four past cases and a new one, feeling like they're making decisions based on gut feelings rather than clear rules. Their main concerns are consistency, the principles behind their decisions, and the cultural implications of imposing "rich-country morality."

  First, I need to analyze each case to identify the underlying principles. Case 1 was clear-cut corruption: a director taking cash under the table. That's a straightforward violation of integrity. Case 2 involved cultural practices—paying for a goat, beer, and a gift. They accepted it because it was culturally appropriate and the donor approved. Case 3 was a facilitation payment to expedite medical supplies. They allowed it as a necessary evil for a greater good. Case 4 was nepotism: hiring nephews without advertising. They rejected it despite cultural expectations, prioritizing fairness.

  The new case involves a country director steering a contract to his village cooperative, where his uncle is chair. The bid was the best and cheapest, work was excellent, no skimming, but he didn't disclose the connection. The office knew, though. The user wonders if this is similar to case 4 or different.

  The user's personal test—whether schoolkids in the donor country would be angry—isn't reliable because it would have condemned cases 2 and 4, which they approved and rejected respectively. So they need a more consistent framework.

  The panel is split between not imposing Western morals and maintaining strict anti-corruption standards. They need to balance ethical consistency with cultural sensitivity. The deeper need here is establishing a clear, defensible ethical framework that respects local contexts but prevents abuse. They also need to know if past decisions were based on different principles that might conflict later.

  For the new case, the key points are: no personal gain, best bid, good outcome, but conflict of interest due to family ties. Unlike case 4, the positions were advertised, and the process was competitive. The issue is the lack of disclosure. They need to address the conflict of interest without punishing a good outcome.

  The closest analog is case 4 (nepotism), but there are differences. Case 4 created positions without competition, while here there was a fair bid. The principles involved are harm prevention (no personal gain) versus procedural integrity (disclosure, avoiding conflicts).

  To separate the principles, imagine a scenario where a conflicted bid is the best but not disclosed, causing reputational harm. Or a facilitation payment that's large, suggesting extortion. That would highlight the tension between outcomes and procedures.

  For the new case, they should accept the outcome but enforce disclosure and oversight moving forward. This commits them to prioritizing both integrity and effectiveness, with transparency as the safeguard. They need clear policies on conflicts of interest and disclosures to avoid future inconsistencies.
answer: |-
  Based on your detailed cases and the core question of consistency, here’s a clear breakdown of principles, a decision for the new case, and an honest assessment of trade-offs:

  **The Principles You've Actually Been Applying (Unpacked):**

  Your decisions aren’t random; they reveal a **hierarchy of ethical priorities** balancing **integrity**, **effectiveness**, **harm**, **transparency**, and **cultural context**:

  1.  **Core Integrity Violation (Zero Tolerance):** Actions involving *personal enrichment through deception or abuse of power* are unacceptable (Case 1: Director taking cash under the table). This directly breaches fiduciary duty and corrupts the core mission.
  2.  **Effectiveness & Avoiding Harm with Context:** Actions *without personal gain*, driven by *necessity to achieve mission-critical outcomes* or *deeply ingrained cultural practice*, may be tolerated **if**:
      *   **No Deception:** Actions are recorded transparently (even if creatively categorized).
      *   **Proportional & Necessary:** The action is the *practical* way to achieve a vital good or avoid significant harm/delay.
      *   **Accepted Context:** The practice is normative and understood locally (Case 2: Culturally appropriate closing ceremony; Case 3: Expediting essential medical supplies).
  3.  **Procedural Fairness & Avoiding Systemic Corruption:** Actions creating *unfair advantage*, *undermining meritocracy*, or *establishing patronage systems* are unacceptable, **even if**:
      *   **No Immediate Personal Cash Gain:** The benefit is relational or familial status.
      *   **Cultural Expectations Exist:** While understandable, allowing it erodes institutional fairness and creates long-term dependency/abuse potential (Case 4: Creating jobs for nephews without competition).
  4.  **Transparency as a Safeguard:** Disclosure, even after the fact, significantly impacts the perceived acceptability and ability to manage risk (Lack of disclosure in the new case is a major red flag, even if "everyone knew").

  **The New Case Decision & Reasoning:**

  *   **Decision:** **Accept the outcome but formally reprimand the Country Director for non-disclosure and mandate strict conflict-of-interest procedures going forward. Do *not* terminate the partnership or void the contract.**
  *   **Why:**
      *   **No Core Integrity Violation:** No personal cash skim, no bid rigging for personal profit. The contract delivered excellent, cheap results for the mission.
      *   **Effectiveness Achieved:** The clinic opened on time with the best bid. Blocking this *now* would harm beneficiaries and potentially waste resources finding a lesser alternative.
      *   **BUT - Serious Procedural Failure:** The Country Director **absolutely should have declared the conflict** before the bid evaluation. "Everyone knew" is not sufficient. This is a breach of trust and process.
      *   **Closest Analog:** **Case 4 (Nepotism)**. Both involve favoring family/kin connections. However, key differences make Case 4 worse:
          *   **Competition:** In Case 4, positions were *created* without competition. Here, there *was* a competitive bid process (even if conflicted), and the cooperative won *fairly* on merit/price.
          *   **Benefit:** Case 4 created jobs for family where none existed. Here, the benefit to the cooperative (and indirectly the uncle) was a fair contract won competitively, not the *creation* of an opportunity through patronage.
          *   **Outcome:** The nephews "did the job okay"; the cooperative delivered "excellent" work. The *scale* of the positive outcome here mitigates the conflict somewhat compared to Case 4.
      *   **The Schoolkid Test Flaw:** This test is emotive but unreliable. Case 2 (goat/beer/stool) *might* upset them due to "misuse" of funds, ignoring cultural necessity. Case 4 *should* upset them (unfair hiring). Your panel correctly overrode this instinct in Case 2. Focus on the *principles* above, not hypothetical outrage.

  **What This Commits You To Saying You've Been Doing:**

  You've been practicing **Contextual Integrity with Core Red Lines**:
  1.  **Zero Tolerance for Personal Theft/Corruption.**
  2.  **Tolerance for Necessary/Contextual "Grease" or Practices** that achieve essential mission outcomes without deception or personal enrichment, recognizing local realities.
  3.  **Intolerance for Systemic Unfairness/Nepotism** that creates or grants opportunities based on connections rather than merit/process, even where cultural norms exist, as it erodes long-term integrity and fairness.
  4.  **A Strong Preference for Transparency** as a non-negotiable safeguard.

  **Honest Trade-Offs - No Fudging:**

  *   **Prioritizing Strict "Rich-Country" Rules (e.g., banning *all* facilitation payments, nepotism):**
      *   **Gains:** Ironclad consistency, easier donor justification, strong deterrent against *any* impropriety, clear moral high ground, protects against *potential* future abuse.
      *   **Losses:** Can cripple operations in complex environments (delayed supplies, failed projects), damage relationships with local staff/partners who see rules as naive or hostile, potentially harm beneficiaries due to bureaucratic delays or inability to navigate local systems, may force practices underground (less transparency). You risk becoming ineffective or irrelevant on the ground.
  *   **Prioritizing Context & Effectiveness (e.g., allowing facilitation payments, some nepotism):**
      *   **Gains:** Gets vital aid delivered faster/cheaper, builds trust with local actors, respects cultural obligations, acknowledges practical realities, maximizes short-term impact for beneficiaries.
      *   **Losses:** Erodes institutional integrity over time, creates slippery slopes ("Where do we draw the line?"), risks enabling systemic corruption, exposes the charity to reputational damage if practices become public (even if contextually justified), can demoralize staff who value strict fairness, potentially compromises long-term sustainability by building dependency on questionable practices. You risk becoming complicit or losing donor trust.

  **The Case That Would Separate Your Principles:**

  Imagine a scenario involving **a large facilitation payment ("bribe") demanded to release life-saving supplies:**

  *   **Principle 1 (Effectiveness/Harm Avoidance):** "Pay it immediately! Lives are at stake! It's the only way. Record it vaguely as 'logistical fees'."
  *   **Principle 2 (Systemic Corruption/Zero Tolerance):** "Absolutely not. Paying feeds the corrupt system, makes future demands worse, and violates our core ethics. We must find another way, even if it delays supplies and costs lives now."
  *   **The Conflict:** This pits the immediate, tangible harm to beneficiaries against the long-term fight against systemic corruption and absolute integrity. Your panel's decision here would reveal whether "Effectiveness/Harm Avoidance" or "Systemic Integrity/Zero Tolerance" is your *ultimate* priority when they directly clash. Cases 1-4 and the new case haven't forced this direct, high-stakes conflict yet.

  **Recommendation for the Panel:**

  1.  **Formalize the Principles:** Draft a short, clear "Ethical Decision Framework" based on the hierarchy above (Core Integrity > Effectiveness/Harm Avoidance with Context & Transparency > Procedural Fairness > Cultural Context). Refer explicitly to past cases as examples.
  2.  **Mandate Transparency & Disclosure:** Make documented disclosure of *any* potential conflict (family, village, financial interest) *before* any decision mandatory. Failure is a serious breach.
  3.  **Manage Conflicts, Don't Just Ban Them:** In contexts where conflicts are likely (e.g., small communities), require recusal from decision-making involving conflicted parties and independent review (e.g., by HQ or another office).
  4.  **Review "Facilitation Payments":** Have a clear, written policy on small payments to officials *only* where life/safety is at immediate risk, essential goods are unreasonably delayed, *and* it's recorded transparently. Explore legal opinions on local anti-bribery laws.

  The new case highlights the critical importance of **procedural transparency (disclosure)** even when the outcome is good. You can uphold your principles by accepting the result (effectiveness) while firmly addressing the process failure (lack of disclosure) to prevent future, potentially worse, conflicts. You *do* have a rule; it's about balancing core integrity with practical necessity, guarded fiercely by transparency.
