answer: |-
  **(Clears throat. Begins deliberately, meeting eyes across the room.)**

  Friends, families, faculty, and especially you, the graduates: thank you for the invitation. It’s customary on such occasions to offer congratulations. To celebrate the skills honed, the techniques mastered, the originality achieved. To speak of ambition, influence, sophistication, and the bright futures awaiting your undeniable talents. I won’t be doing that. Not because I don’t see those things in this room – I do, abundantly – but because celebrating the *craft* of art, while necessary, risks missing the *heart* of it. And you deserve honesty today about what lies at that heart.

  Centuries of thought swirl around this question, but I ask you to consider just one answer today, proposed by Leo Tolstoy. Forget what you might know of his novels; consider him only as a man obsessed with the question: *What makes art real?* For him, it was not about beauty, not about novelty, not about technical brilliance, not about pleasing a patron or a market, not even about expressing some grand intellectual idea. Art, he argued, is a human activity as fundamental as breathing. It’s this: **One person, having genuinely lived through a feeling, finds a way to transmit that specific feeling to another person, so directly that the receiver experiences it too.** Like a spark jumping a gap. Infection, he called it. Contagion.

  Whether that spark jumps depends utterly on three things in the artist: First, that the feeling is truly *theirs*. Not borrowed, not inherited, not second-hand. It must be dug from their own lived soil. Second, that it is expressed clearly enough to make the leap possible. Muddle obscures the signal. But third, and above all, the artist must be *sincere*. Profoundly, almost frighteningly sincere. They must transmit something they have *actually felt*, not something they think they *should* feel, or something they believe will impress, shock, or sell. It’s the difference between sharing a wound and displaying a scar.

  Anything that fails this test isn’t lesser art; it’s a *counterfeit* of art. Tolstoy saw counterfeits everywhere: work that borrows feelings from tradition or other artists; work that merely imitates successful styles; work that relies solely on manufacturing striking effects, dazzling the senses without touching the soul; and work that exists purely for diversion, for passing the time pleasantly, without transmission. He also made a startling claim: If art requires special training or insider knowledge to be *felt*, it’s probably not profound art speaking a complex truth. It’s likely private amusement for a privileged few, disguised as depth. Obscurity, he contended, is often not a sign of complexity, but a mask for emptiness – a borrowed air of profundity replacing a feeling actually had. That distinction matters.

  **(Pauses, looks slowly across the graduates)**

  So, graduates. You stand at the threshold. You’ve spent years mastering tools: brushes, lenses, words, instruments, code. You’ve learned to see, to compose, to critique. This is vital. Craft is the bridge the feeling must cross. But mastery alone is not the destination. Ambition is not the destination. Complexity for its own sake is not the destination. The destination is transmission. Did you *feel* something true? Did you find a way to make *another* feel it, purely through your work? Was it yours? Were you utterly sincere?

  **(Gestures subtly towards the faculty)**

  Your teachers know this, deeply. They’ve wrestled with it in their own studios, in the quiet hours. They’ve taught you the craft, sometimes knowing the craft alone is a safer harbor than the perilous sea of genuine feeling. They’ve shown you paths, knowing you might walk further, or differently, than they did. Do not mistake their focus on technique as a belief that technique is king. It is the servant. A vital servant, yes, but the king is the feeling communicated, the spark that jumps.

  **(Tone becomes more direct, acknowledging the room’s shared knowledge)**

  And that brings me to the work that’s been the talk of the school this year. The film. The one without words, without story, with its own music, and yes, with that text on the wall. There’s no avoiding it. It’s ambitious. It’s demanding. It’s technically accomplished. But under Tolstoy’s stark light – the light I promised you – none of that decides the question. The only question that matters for whether it is *art*, as opposed to a sophisticated counterfeit, is this: Did a genuine feeling, uniquely the filmmaker’s, born of their own lived experience, find clear expression in that sequence of images and sounds? And crucially, was the maker utterly sincere in its transmission? Not performing intellect, not demonstrating skill, not courting theory – but transmitting a feeling actually felt? If yes, then its difficulty isn't a flaw; it's the necessary shape of that particular feeling's journey from maker to viewer. If the feeling is true and clearly sent, someone, perhaps many, *will* feel it – not necessarily understand it intellectually, but *feel* it. If the obscurity serves only to cloak a borrowed idea or an absence of lived feeling... well, then the difficulty is the disguise Tolstoy warned us about. Only the filmmaker knows absolutely which it is. The rest of us can only ask ourselves: Did the spark jump? To *me*? That is the honest test, applied without sneer, without condescension, but with the seriousness the act of making demands.

  **(Shifts focus, includes the whole hall)**

  This standard is brutal. It doesn’t guarantee comfort or easy rewards. The feeling transmitted might be joy, but it might also be despair, rage, confusion, or a moral vision that unsettles. Art can be dangerous. Real art often is. What matters is the authenticity of the transmission. And this standard applies universally. It applies to the painter wrestling with color, to the composer finding a new sound, to the writer shaping a sentence, and yes, it applies even to this speech.

  **(Leans slightly forward, voice dropping slightly in volume but increasing in intensity)**

  Because here’s the risk I take standing before you now. If I stand here merely performing the role of "commencement speaker," borrowing platitudes, manufacturing effects, aiming only to divert or congratulate... then by my own lights, this isn't just a mediocre speech. It's a counterfeit of the occasion. Worse, if the feeling I’m trying to transmit about the perilous, vital core of art – my own profound belief in it, my worry for it, my charge to you about it – if *that* doesn’t reach you... if it doesn’t land somewhere in this room, perhaps with the force of recognition for some of you, perhaps with a spark of understanding even for the grandparents who’ve never set foot in a gallery... if it doesn’t make *someone* here feel the weight and the possibility I feel... then this event fails its own test. It becomes mere ceremony. I stand here hoping that spark jumps. I have to risk that it might not. Anything less would be hypocrisy.

  **(Stands straighter, addresses graduates with unwavering focus)**

  So, this is your charge, graduates. Not "Go be successful." Not "Go be original." Not "Go be technically perfect." Not "Go impress the critics" or "Go please the market." Your teachers have given you tools. The world will offer you paths, some well-lit, some dark. The dean who retires today built a program, a structure, a context. Structures matter. But within that structure, or outside it, or against it if necessary, here is the only charge that matters for the artist:

  **Go feel deeply. Live your life awake to the tremors within and without. Then, with the craft you’ve earned, find the courage to transmit what you have genuinely lived and felt. Be ruthlessly sincere. Not sincere in your biography, but sincere in the work. Strip away anything that is borrowed, imitative, or merely diverting if it dilutes the true signal. Aim for clarity, not for fashion or obscurity. Make the feeling jump.**

  It is harder than mastering any technique. It requires a different kind of bravery. It offers no guarantees – not of understanding, not of acceptance, certainly not of reward. The spark might not jump. The feeling might be yours alone. But if it *does* jump? If one person, then another, then perhaps many, truly *feel* what you felt? Then you have participated in the oldest, deepest human magic. Then you have made art.

  That is the work. Nothing less is worth your life. Go do it.

  **(Nods once, decisively. Steps back.)**
