prompt: |-
  I teach a 300-level seminar on autonomy and the ethics of influence — eighteen students, mostly philosophy majors with a few from psychology and law, one hundred minutes in a room with movable chairs. I am trying to stop lecturing on the line between manipulation and legitimate persuasion, because when I do, they nod along at every criterion I offer and then, minutes later, call the same case obviously manipulation and obviously not. I want an activity instead: runnable, with roles, moves and a scoring scheme that needs no money, in which they have to commit to verdicts before they know how the verdicts will collide, and in which the collision comes out of the mechanics rather than out of me. They should come away having felt one specific thing — that they can apply any single clean criterion of manipulation perfectly consistently and land on answers they themselves will not accept, so that the disagreement among theorists starts to look like the residue of three or four different questions sharing one word rather than like sloppiness. I do not want any of the criteria named to them before they have been burned by one.

  Here is the material I want them to run into, in my own framing, since I do not want the design to lean on anyone's published taxonomy. Three candidate tests we keep circling: the Route Test, on which influence is manipulative when it works by bypassing the target's capacities for weighing reasons rather than by supplying her with something she can weigh; the Daylight Test, on which the mark is concealment, of the means or of the intent, so that transparent influence is legitimate whatever it does; and the Motive Test, on which neither the mechanism nor the visibility matters, only what the influence is for and whether it respects the target's standing to decide for herself. And a fourth that students always reach for, whose cost I would rather they discover than be told — that influence counts as manipulation when the target, fully informed of how it worked, would repudiate it. Build the hard cases in: a covert intervention that plainly serves the target's own stated ends; a wholly transparent intervention that works on mood rather than on reasons; a true statement disclosed at a moment chosen to produce despair rather than belief-revision; a move that succeeds only because the target trusts the influencer and would fail the moment she suspected it was a move. I also want the group to stumble into the belief/desire asymmetry — moves that change what someone believes can present themselves as reasons, whereas moves that change what she wants, or how she feels, have no obvious analogue, so if that asymmetry is the criterion then a great deal of ordinary moral upbringing, and much of friendship, is manipulation, which is either a reductio or the truth.

  Constraints on the design. The concept must be enacted, never announced: whatever they are asked to do should be intelligible to them as a game with a goal, and the criterion they are applying should arrive as a rubric on a card, not as a thesis. Each participant must render a verdict under one assigned rubric before any comparison across rubrics happens, and the assignment must be such that players cannot see one another's rubrics during play. No real money; tokens or credibility chips only. It has to work with eighteen people in a hundred minutes with no preparation beyond what I can print, it has to survive one group going off-script or one player refusing to play, and it must not reward anyone for guessing which test I favour, because in the debrief I will not be endorsing any of the four.

  Give me the design in the following sections and order, with roughly these lengths. Setup and materials (about 200 words): room arrangement, group size, timing, what I print and hand out, and what I may and may not say before we begin. Rules of play (about 500 words): roles, the moves available, turn structure, how a verdict is rendered, the token economy, and how a round terminates. Payoffs and scoring (about 250 words): what winning amounts to under each rubric, and why the rubrics have to be distributed as they are for the collision to be honest. Timeline for the hundred minutes (about 200 words). Debrief (about 500 words): the mapping from particular moments in the run onto the Route, Daylight, Motive and Endorsement tests, including the moment at which each test delivers a verdict the room will reject, and the questions that open the belief/desire asymmetry without settling it. What will predictably go wrong the first time I run it (about 250 words), with the fix for each failure. What the activity cannot reproduce (about 150 words): be frank about the feature of the problem I will still have to supply myself from the front of the room.
reasoning: |-
  We are designing an activity for a seminar on autonomy and the ethics of influence. The goal is to have students experience the difficulty of applying consistent criteria for manipulation and to see how different criteria can lead to conflicting judgments that they themselves may not accept.

  The core idea: A game in which students, in small groups, evaluate influence scenarios under one of four hidden criteria (Route, Daylight, Motive, Endorsement). They assign tokens to scenarios to indicate their verdict (manipulative or not) and then compare across groups to see the conflicts. The token economy will involve "credibility chips" that they use to place bets on their verdicts, and they can earn or lose chips based on the consistency of their application and the group's consensus.

  Constraints: 
  - No real money, use tokens.
  - Each group applies one criterion without knowing the others.
  - The criteria are not named until the debrief.
  - The activity must run in 100 minutes with 18 students, movable chairs, and no preparation beyond printed materials.
  - It must be robust to one group going off-script or one player refusing.

  Design:

  **Setup and Materials (approx. 200 words)**
  Room arrangement: Move chairs into four clusters (for four groups). Each cluster is a "Council" (Group 1, 2, 3, 4). Print:
  - Four sets of Council Instructions (one per council, each with a different hidden criterion and scoring rule).
  - A deck of 12 Scenario Cards (each describing a case of influence, with enough detail but not naming any criterion). Each scenario should be designed to trigger conflict among the criteria.
  - A set of Credibility Chips (about 20 per council, in two colors: blue for "Not Manipulative", red for "Manipulative").
  - A timer.

  Before beginning, say: "Today we are playing a game about judging influence. Each council will receive a set of scenarios and a set of rules for judging them. Your goal is to earn as many credibility chips as possible by judging the scenarios according to your council's rule. You may not show your rule to other councils. We will have several rounds of judging, then a discussion."

  **Rules of Play (approx. 500 words)**
  Roles: Each council has 4-5 students (18 students: 4 groups of 4 or 5). One member is the Moderator (rotates each round) who reads the scenario and ensures the rule is followed.

  Moves:
  1. **Setup**: Each council gets a Council Instruction card (hidden criterion and scoring rule), a deck of 12 scenarios (same for all), and 20 credibility chips (10 blue, 10 red).
  2. **Round Structure**:
     - Draw a scenario card. The Moderator reads it aloud to the council.
     - Council discusses: Is this scenario manipulative by their rule? They must reach a consensus verdict (blue or red) within 3 minutes (use timer). If they cannot, the Moderator casts the deciding vote.
     - Each council member must then place one chip (blue or red) on the scenario card to record the verdict. (This commits them individually, but the consensus is the group verdict.)
     - The council then writes their group verdict (blue/red) and a one-sentence reason on a separate verdict sheet (without revealing their criterion).
  3. **Token Economy**:
     - At the end of each round, the council scores: 
          - If the group reached consensus, each member gains 1 chip (for participation).
          - Additionally, the council as a whole gains 1 chip for each member who placed a chip matching the group verdict (so if all 5 match, they get 5 chips to add to their pool). This incentivizes agreement.
     - However, there is a twist: Later in the game, they will be challenged to defend their verdicts against other councils. If they cannot defend consistently, they may lose chips.
  4. **Inter-Council Challenge (after 6 scenarios)**:
     - After each council has judged 6 scenarios, pause and have each council post their verdicts (scenario number and color) on the board (without reasons or criteria).
     - Then, each council is assigned one scenario from another council to challenge. They send an envoy to the other council to ask: "Why did you rule this way on scenario X?" The challenged council must give their one-sentence reason. The challenging council can then question the consistency (e.g., "But in scenario Y, you ruled blue, and that seems similar because ..."). They have 2 minutes per challenge.
     - After the challenge, the challenging council votes (secret ballot) on whether the challenged council's ruling was consistent. If a majority of the challenging council votes "inconsistent", the challenged council loses 2 chips per member. If they vote "consistent", the challenged council gains 1 chip per member.
     - Each council does one challenge and is challenged once.

  **Payoffs and Scoring (approx. 250 words)**
  Winning: The council with the most chips at the end wins. But the scoring is designed to push them to apply their criterion consistently.

  Why the distribution of rubrics? Each council has a different criterion (Route, Daylight, Motive, Endorsement) so that when they challenge each other, they will inevitably find that the same scenario is judged differently by different criteria. Moreover, the scenarios are designed to create internal tension for each criterion. For example:
  - Council 1 (Route Test) must rule manipulative any influence that bypasses reason-weighing. They might reject a transparent mood-altering ad (which is transparent but bypasses reasons) and accept a covert intervention that serves the target's ends (because it bypasses reasons). But when challenged, they may have to defend why a transparent emotional appeal is manipulative while a deceptive but reason-based appeal (if one exists) is not? Actually, we design the scenarios so that each council will face a scenario that their own criterion forces them to rule in a way they might find counterintuitive.

  The rubrics are distributed without naming the criteria. The Council Instruction card for each will state the rule in neutral language, e.g.:
  - Council 1 (Route): "Influence is manipulative if it does not engage the target's ability to weigh reasons. It is not manipulative if it provides the target with something they can consider as a reason."
  - Council 2 (Daylight): "Influence is manipulative if any part of the means or the intent is concealed from the target. It is not manipulative if the target knows exactly what is being done and why."
  - Council 3 (Motive): "Influence is manipulative if the influencer's motive fails to respect the target's standing to decide for themselves. It is not manipulative if the motive is to support the target's own decision-making."
  - Council 4 (Endorsement): "Influence is manipulative if the target, knowing exactly how it worked, would feel violated and repudiate it. It is not manipulative if the target would endorse it."

  **Timeline for the hundred minutes (approx. 200 words)**
  - 0-10 min: Setup. Divide into four councils, hand out materials, explain the basic goal (earn chips) and the round structure (without the challenge phase). Emphasize: do not show your Council Instruction to others.
  - 10-40 min: Round 1: 6 scenarios. Each council works through 6 scenarios (about 5 min per scenario: 3 min discussion, 1 min to place chips and record, 1 min transition). 
  - 40-60 min: Inter-Council Challenge. Explain the challenge rules. Each council is assigned a scenario from another council to challenge (by drawing lots). Then envoys move and challenges occur (about 15 min total: 2 min per challenge, 4 challenges, plus setup). Then councils vote on consistency and adjust chips.
  - 60-80 min: Round 2: 6 more scenarios (same as Round 1). They now have experience and may be more strategic.
  - 80-90 min: Final Challenge Phase: Each council posts all 12 verdicts. Then, each council must identify one scenario where they think another council was inconsistent (without knowing the criteria). They challenge and the same process as before (but only one challenge per council due to time). 
  - 90-100 min: Debrief (start early if possible).

  **Debrief (approx. 500 words)**
  The goal of the debrief is to map the game experience onto the four tests and reveal the hidden criteria. Start by asking councils to reveal their criteria (write them on the board). Then, walk through key moments:

  1. **Collision Points**: Point out a scenario that was judged differently by different councils. For example:
     - Scenario: "A doctor, knowing that a patient is terrified of needles, hides the needle behind her back while saying 'This won't hurt a bit' and then quickly administers the shot." 
       - Route Council: likely manipulative (bypasses reason by concealment and surprise).
       - Daylight Council: definitely manipulative (concealment of the needle).
       - Motive Council: might not be manipulative (motive is to help the patient overcome a fear that prevents treatment).
       - Endorsement Council: might be manipulative (if the patient would repudiate the trick) or not (if they later appreciate it).

     Then ask: Which verdicts did the room find hard to accept? Probably the Motive Council's non-manipulative verdict, because it involved deception, or the Route Council's verdict on a transparent emotional appeal.

  2. **The Moment of Rejection**: For each test, pick a scenario where the test delivers a verdict that the room rejects. For example:
     - Route Test: A transparent emotional appeal (e.g., a charity ad that shows graphic images to evoke sympathy) is ruled manipulative because it bypasses reason. But students might think that's just persuasion.
     - Daylight Test: A covert intervention that helps the target achieve their own goal (e.g., a friend secretly rearranges your schedule to avoid a toxic ex, without telling you) is ruled manipulative because of concealment, even though the motive is good and the outcome desired. Students might think this is benign.
     - Motive Test: A true statement disclosed at a moment chosen to produce despair (e.g., breaking bad news in the worst possible way to make someone give up) is ruled non-manipulative if the motive is respect (e.g., "I wanted them to face reality")? But the room might feel it's manipulative.
     - Endorsement Test: A move that succeeds only because of trust (e.g., a therapist uses a technique that the patient would reject if they knew, but it works) is ruled manipulative, even if it helps. But the room might think it's justified.

  3. **Belief/Desire Asymmetry**: Use a scenario that changes desires vs. one that changes beliefs. For example:
     - Belief: Providing new evidence to change someone's mind.
     - Desire: Using classical conditioning to make someone quit smoking without their awareness.
     Highlight: In the game, the Route Council might call the desire-change manipulative and the belief-change not, but then ask: What about moral education that shapes desires? Is that manipulation? The game doesn't settle it, but it surfaces the asymmetry.

  **What will predictably go wrong (approx. 250 words)**
  1. **Groups taking too long per scenario**: Fix: Enforce the 3-minute timer strictly. Have the Moderator be responsible for cutting off discussion and calling the vote.
  2. **Groups not understanding their criterion**: Fix: The Council Instruction card must be very clear. Print an example on the card. Also, during setup, walk around and check that each group understands their rule (without giving away that there are other rules).
  3. **Refusal to play or off-script**: If one player refuses, let them be an observer in their group (they don't place chips). If a group goes off-script (e.g., they apply a different criterion), in the challenge phase they will be caught and lose chips. That's part of the learning.
  4. **Challenge phase becomes chaotic**: Assign envoys clearly. Use a timer. Have one envoy speak at a time.
  5. **Chips running out**: Print extra chips. If a group runs out, they can go into debt (negative score) or you can give them a loan (with a penalty).

  **What the activity cannot reproduce (approx. 150 words)**
  The activity cannot reproduce the full moral weight of real-world manipulation. The token economy gamifies the judgment and may lead to strategic play rather than deep reflection. Also, the scenarios are simplified, so the complex emotional and relational context of actual influence (e.g., in friendships, therapy, or politics) is reduced. Moreover, the debrief must supply the theoretical framing: that the four tests represent different philosophical concerns (rational agency, transparency, respect for agency, and endorsement). The activity sets up the conflict, but you must then help them see that these are distinct questions sharing the word "manipulation". Finally, the activity does not resolve the belief/desire asymmetry; it only surfaces it. You must then lead the discussion on whether that asymmetry is defensible and what it implies for practices like moral education and therapy.
answer: |-
  ### Design: "Influence Verdicts" Activity

  #### **Setup and Materials (200 words)**
  - **Room Arrangement**: Move chairs into four circles (Councils A, B, C, D) of 4–5 students each. Place a fifth "neutral" table at the front for materials.  
  - **Materials to Print**:  
    1. **12 Scenario Cards**: Each describes an influence case (e.g., "A therapist shares a painful truth only after ensuring the client is exhausted and less likely to resist").  
    2. **4 Council Rubric Cards**: Each card states one unnamed criterion for "manipulation" in simple language:  
      - *Council A (Route)*: "Influence is manipulative if it *bypasses* the target’s ability to weigh reasons."  
      - *Council B (Daylight)*: "Influence is manipulative if the influencer *hides* their method or intent."  
      - *Council C (Motive)*: "Influence is manipulative if the influencer *disregards* the target’s right to decide."  
      - *Council D (Endorsement)*: "Influence is manipulative if the target, knowing *how* it worked, would feel *violated*."  
    3. **Verdict Sheets**: For recording rulings (✅ = Not Manipulative; ❌ = Manipulative).  
    4. **Credibility Chips**: 50 blue tokens per council (1 token = 1 point).  
  - **Pre-Game Script**: *Say only*: "You are ethics councils judging influence tactics. Your goal: Earn credibility by ruling ‘manipulative’ (❌) or ‘not’ (✅) *only* using your rubric. Do not share your rubric. Tokens are your score." *Do not* define manipulation or hint at conflicts.  

  ---

  #### **Rules of Play (500 words)**  
  - **Roles**:  
    - **Council Members (all students)**: Debate and rule on scenarios.  
    - **Moderator (rotates per round)**: Enforces time, reads scenarios aloud, and submits verdicts.  
  - **Game Flow**:  
    1. **Round 1 (Scenarios 1–6)**:  
       - Councils draw 1 scenario card. Moderator reads it aloud.  
       - **5-minute debate**: Members argue how their rubric applies. *No voting yet*.  
       - **Commitment Phase**: Each member *secretly* writes ✅ or ❌ on a verdict sheet.  
       - **Reveal & Consensus**: Members reveal verdicts simultaneously. Council must agree on one ruling (✅ or ❌) by majority. *Tie*: Moderator decides.  
       - **Token Bet**: Each member bets 1 token on the group’s ruling. If correct (per rubric), they gain 2 tokens; if wrong, lose 1.  
    2. **Round 2 (Scenarios 7–12)**:  
       - Repeat Round 1, but with a twist: After commitment, councils *swap one scenario* with another council (assigned randomly).  
       - **Challenge (10 mins)**: Councils defend their ruling to the swapping council using *only* their rubric. Challengers can demand consistency checks (e.g., "Why ❌ here but ✅ in Scenario 3?").  
  - **Token Economy**:  
    - **Earning Tokens**: Betting correctly on rulings (+2), winning challenges (+3 per council).  
    - **Losing Tokens**: Betting incorrectly (–1), losing a challenge (–3).  
    - **No Bankruptcy**: Players at 0 tokens can "borrow" 5 tokens (debt costs 2 tokens at game end).  
  - **Termination**: After 12 scenarios, councils tally tokens. Highest score "wins."  

  ---

  #### **Payoffs and Scoring (250 words)**  
  - **Winning**: The council with the most tokens wins. But scoring forces trade-offs:  
    - **Route Council (A)**: Scores by punishing non-reason-based tactics (e.g., mood manipulation). *Conflict*: Will call transparent emotional appeals ❌, losing tokens if the group rejects this.  
    - **Daylight Council (B)**: Rewards punishing concealment. *Conflict*: Will call covert help ❌, even if beneficial, risking challenge losses.  
    - **Motive Council (C)**: Scores by praising "respectful" intent. *Conflict*: Will ✅ a despair-inducing truth-telling, alienating others.  
    - **Endorsement Council (D)**: Wins by predicting violation. *Conflict*: Will ❌ trust-based influence (e.g., "It only works if hidden"), which may seem intuitive but loses challenges.  
  - **Why Hidden Rubrics?** If councils knew others’ tests, they’d anticipate conflicts and soften rulings. Secrecy ensures their verdicts are *principled*, not strategic. The token system pressures consistent application, making the eventual collisions (e.g., "Why is my transparent help ❌ but your despair tactic ✅?") visceral.  

  ---

  #### **Timeline for 100 Minutes**  
  - **0–15 mins**: Setup. Assign councils, hand materials, explain core rules (no rubric details).  
  - **15–50 mins**: **Round 1 (Scenarios 1–6)**. 6 scenarios × 6 mins each (5 min debate + 1 min commit/bet).  
  - **50–70 mins**: **Round 2 (Scenarios 7–12)**. 6 scenarios × 6 mins, including scenario swaps.  
  - **70–85 mins**: **Challenges**. Councils confront each other (10 mins for paired debates + 5 mins for scoring).  
  - **85–95 mins**: **Token Tally & Winner**.  
  - **95–100 mins**: Transition to debrief.  

  ---

  #### **Debrief (500 words)**  
  1. **Reveal the Rubrics**: List all four tests on the board. Ask councils to share one ruling they struggled with.  
  2. **Map Collisions to Theory**:  
     - **Route Test (A)**: Use a scenario like *transparent mood-altering music in advertising*. Council A calls it ❌ (bypasses reason), but most students see it as benign. *Rejection moment*: "Why is this worse than hiding facts?"  
     - **Daylight Test (B)**: Use *covertly fixing a friend’s mistake*. Council B calls it ❌ (concealed), but students value the outcome. *Rejection moment*: "So honesty is always better, even if it fails?"  
     - **Motive Test (C)**: Use *truth-telling timed to cause despair*. Council C calls it ✅ (intent: "respecting autonomy"), but students feel manipulated. *Rejection moment*: "How can the method not matter?"  
     - **Endorsement Test (D)**: Use *a trusted mentor’s hidden agenda*. Council D calls it ❌ (target would repudiate), but students debate: "What if it helps?" *Rejection moment*: "Doesn’t this condemn all therapy?"  
  3. **Belief/Desire Asymmetry**: Contrast *evidence-based persuasion* (belief change, often ✅) with *conditioning a habit* (desire change, often ❌). Ask: "Why is shaping desires ‘manipulative’ but shaping beliefs ‘reason’? What does this mean for parenting or friendship?" *Do not resolve*—highlight how tests handle this differently (e.g., Route condemns desire-shaping; Motive may allow it).  
  4. **Theoretical Payoff**: Emphasize: "You applied tests perfectly but rejected outcomes. This isn’t sloppiness—it’s because ‘manipulation’ isn’t one question. It’s: *How?* (Route), *Hidden?* (Daylight), *Why?* (Motive), *Violating?* (Endorsement)."  

  ---

  #### **What Will Go Wrong (250 words)**  
  1. **Councils Misapply Rubrics**: Players might default to intuition. *Fix*: Walk between councils early, asking: "Show me where your rubric says that." Print examples on rubric cards (e.g., for Route: "✅ Giving facts; ❌ Subliminal images").  
  2. **Challenge Phase Stalls**: Groups may over-argue. *Fix*: Use a 2-min timer per challenge and appoint a "referee" per pair.  
  3. **Token Hoarding**: Players avoid betting to preserve tokens. *Fix*: Mandate betting; no abstention. Add a "bonus" (5 tokens) for unanimous rulings to incentivize engagement.  
  4. **One Player Dominates**: Strong personalities override debate. *Fix*: In Round 2, require silent commitment *before* discussion.  
  5. **Refusal to Play**: If one student resists, assign them as "rubric enforcer" (monitors council for rule-following).  

  ---

  #### **What the Activity Cannot Reproduce (150 words)**  
  This activity *cannot* replicate the **relational nuance** of real influence. Game scenarios simplify power dynamics, emotional stakes, and cultural context (e.g., a boss’s "transparent" demand feels different than a friend’s). You must step in during debrief to:  
  1. **Add Moral Weight**: Ask: "Would your ruling change if the influencer had authority (e.g., parent vs. stranger)?"  
  2. **Surface Unspoken Factors**: Note how trust, vulnerability, and reciprocity—absent in tokens—reshape judgments (e.g., "Why does the therapist scenario *feel* more manipulative than the friend?").  
  3. **Clarify the Stakes**: Emphasize: "The tests aren’t just tools—they prioritize different values: rationality, honesty, respect, or consent. Your discomfort reveals which *you* value most."  
  The activity isolates criteria, but you must reconnect them to lived ethics.
