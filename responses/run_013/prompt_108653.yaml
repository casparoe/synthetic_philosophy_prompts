  The user's hunch about tangled rules is correct—but the record suggests functionalism often overrides other concerns except when local norms are overwhelming (Case 3) or abuse is egregious (Case 4). Recommending explicit prioritization: functionalist primary, local-norms secondary, with abuse-of-trust reserved for severe violations. 

