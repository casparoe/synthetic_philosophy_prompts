answer: |-
  Your position—that empirically indistinguishable ontologies have **no fact of the matter** between them—is a sophisticated one, aligned with **semantic anti-realism** or **ontological deflationism**. Below, I categorize defeaters (arguments against your view) by severity, address your two core concerns, and evaluate the defensibility of your stance. Crucially, your view *can* be held consistently without collapsing into radical relativism, but it faces significant philosophical pressure.

  ---

  ### **Defeaters: From Fatal to Tolerable**
  #### **Fatal Defeaters** (Threaten Coherence or Collapse into Unwanted Positions)
  1. **The Semantic Instability Problem**  
     - **Argument**: If *all* ontological claims beyond empirical reach are meaningless (no fact of the matter), then your own claim—"there is no fact of the matter"—must itself be meaningless. This self-undermining creates a paradox.  
     - **Why fatal?** It risks reducing your view to self-refuting nonsense.  
     - **Defender’s concession**: A careful proponent (e.g., Carnap) would restrict the scope to *frameworks* or *theories*, not meta-claims about reality itself. But this retreat may weaken the original position.

  2. **Anti-Realist Drift**  
     - **Argument**: If you deny facts beyond observation, you may slide into **global anti-realism** (e.g., "reality is constructed by minds/instruments"). This contradicts your intent to keep a mind-independent world for observable facts.  
     - **Why fatal?** It forces you into a much stronger (and less plausible) view than you want.  
     - **Defender’s response**: Insist your view is *local* to unobservables. But critics (e.g., Quine) argue observation is theory-laden—drawing a sharp line is impossible.

  ---

  #### **Decisive but Non-Fatal Defeaters** (Force Major Concessions)
  3. **The Indispensability Argument**  
     - **Argument**: Science *treats* unobservables (e.g., electrons, spacetime curvature) as real because they are indispensable for prediction, explanation, and unity. If two ontologies are empirically identical but one is simpler (e.g., Occam’s razor), science prefers it—implying a fact of the matter.  
     - **Defender’s concession**: You might grant this is pragmatic, not ontological. But if science’s success *requires* ontological commitment (as realists argue), your view seems disconnected from practice.

  4. **Modal Collapse**  
     - **Argument**: If "no fact of the matter" means ontologies are *equivalent*, then scenarios differing only in unobservables (e.g., "Is there a duplicate universe?") must be identical. But this erases meaningful modal distinctions (e.g., what *could* exist).  
     - **Defender’s response**: Admit equivalence only under current empirical constraints. Yet this concedes a fact *could* exist if new access emerges.

  ---

  #### **Tolerable Defeaters** (Awkward but Manageable)
  5. **Intuitions of Mind-Independence**  
     - **Argument**: Common sense holds reality exists independently of observation (e.g., "The moon exists when unobserved"). Denying facts about unobservables challenges this intuition.  
     - **Response**: Intuitions aren’t arguments. Your view already rejects naïveté.

  6. **Explanatory Asymmetry**  
     - **Argument**: One ontology might explain *why* things are observable (e.g., "Atoms cause instrument readings") while rivals are silent. This suggests a fact of the matter.  
     - **Response**: Accept this as pragmatic—but deny it reflects ontology. Explanation is epistemic, not metaphysical.

  ---

  ### **Addressing Your Two Core Concerns**
  #### **1. The Slide Between "No Fact" vs. "Can’t Know"**
     - **The Equivocation Risk**: These are distinct:  
       - **Epistemic unknowability**: A fact exists but is inaccessible (e.g., how many grains of sand make a heap?).  
       - **Ontological indeterminacy**: No fact exists *at all* (e.g., "Is Pluto a planet?" depends on definitions).  
     - **Why it matters**: If you slide, you conflate *metaphysical* and *epistemological* claims. Your view requires ontological indeterminacy—but if you mean "can’t know," you concede realism about unobservables.  
     - **Defender’s fix**: Consistently frame your position as **metaphysical underdetermination** (no fact), not epistemic limitation. Cite quantum indeterminacy or mathematical structuralism as models.

  #### **2. Does This Entail Radical Relativism?**
     - **The Threat**: If reality is "relative to observers," you risk **idealism** (reality is mind-dependent) or **instrumentalism** (theories are mere tools).  
     - **The Escape**: Your view **need not go this far**. Defend it as:  
       - **Semantic anti-realism**: Claims about unobservables lack truth-conditions (Dummett).  
       - **Internal realism**: Truth is framework-relative, but frameworks are constrained by experience (Putnam).  
       - **Quietism**: Ontological debates are nonsensical; only empirical content matters (Wittgenstein).  
     - **Cost**: You must abandon **metaphysical realism** (a single, observer-independent reality). But this is the *point* of your view—not a bug.

  ---

  ### **Is Your View Falsifiable?**
  - **Risk of Vacuousness**: If "no fact of the matter" applies *only* to scenarios where *nothing* could distinguish theories, your view is shielded from direct refutation. This is **by design**—it’s a meta-ontological stance.  
  - **Defect or Virtue?**: In philosophy, such positions are common (e.g., skepticism). The defect is *immunity to evidence*, but this reflects the nature of ontology.  
  - **Concession**: A defender must admit their view cannot be *proven*—only motivated by arguments against realism (e.g., the Pessimistic Meta-Induction from history of science).

  ---

  ### **Conclusion: A Defensible but Precarious Position**
  Your view—**moderate ontological deflationism**—is tenable if you:  
  1. Avoid epistemic slippage ("no fact" ≠ "can’t know").  
  2. Reject global relativism by anchoring truth in empirical adequacy.  
  3. Accept that science may *act as if* unobservables exist without ontological commitment.  

  **What should move you**:  
  - **Fatal**: Self-refutation (Defeater 1) or drift into full anti-realism (Defeater 2).  
  - **Decisive**: Indispensability arguments (Defeater 3) if you value scientific practice.  
  - **Tolerable**: Other objections can be managed with careful framing.  

  **What to read next**:  
  - Carnap’s "Empiricism, Semantics, and Ontology" (defending framework-relativity).  
  - Putnam’s "Reason, Truth and History" (internal realism).  
  - Van Fraassen’s *The Scientific Image* (constructive empiricism).  

  Your position is philosophically respectable and avoids the excesses of both dogmatic realism and radical relativism—but it demands vigilance against its own boundary problems.
