  ### Decision Tree: Causation by Omission  
  **Starting Claim**: An omission can be a cause of the outcome that followed it.  

  #### Step 1: Accept or reject the starting claim?  
  - **Reject**  
    - *Position: **No Causal Status for Omissions***  
      - Central claim: Omissions are not causes; the word "omission" merely describes an agent in light of what they did not do, and causal power lies solely in positive events or conditions.  
      - Hardest commitment: Explaining why agents are held responsible for harms (e.g., a doctor not ordering a test) without granting causal power to their inaction.  

  - **Accept** → Proceed to **Question 1**.  

  #### Question 1: Are omissions causal relata?  
  *(Causal relata = things that can be causes or effects)*  
  - **No (merely descriptive)**:  
    - *Position: **Figurative Causation***  
      - Central claim: Omissions are not genuine causes; causal language is a figurative shorthand for assigning responsibility to agents based on their failure to act.  
      - Hardest commitment: Defending why figurative "causes" justify legal liability or moral blame.  
  - **Yes (real relata)**: → Proceed to **Question 2**.  

  #### Question 2: Is counterfactual dependence sufficient for causation?  
  *(Counterfactual dependence = outcome would not have occurred if the agent had acted)*  
  - **Yes**: → Proceed to **Question 3**.  
  - **No (more needed)**: → Proceed to **Question 3**.  
    - *Note: Q2 and Q3 vary independently.*  

  #### Question 3: How do we single out one omission?  
  - **Selection answers to causal facts**:  
    - If from Q2-**Yes**:  
      - *Position: **Causal Selection Counterfactualism***  
        - Central claim: Counterfactual dependence suffices for causation, but we single out one omission (e.g., the landlord’s, not a stranger’s) based on its distinctive causal role (e.g., proximity, necessity).  
        - Hardest commitment: Identifying a non-normative "causal fact" that distinguishes relevant omissions without circularity.  
    - If from Q2-**No**:  
      - *Position: **Causal Mechanism***  
        - Central claim: Omissions cause harm only if integrated into a physical/mechanical causal process (e.g., a system’s failure chain), not mere counterfactual dependence.  
        - Hardest commitment: Explaining how "nothing" (an omission) physically integrates into causal mechanisms.  
  - **Selection answers to norms/duties**:  
    - If from Q2-**Yes**:  
      - *Position: **Normative Counterfactualism***  
        - Central claim: Counterfactual dependence suffices for causation, but selection depends on norms (e.g., duties, expectations) to avoid overcounting (e.g., why blame the doctor, not everyone who didn’t help).  
        - Hardest commitment: Explaining why normative selection doesn’t reduce causation to mere responsibility.  
    - If from Q2-**No**:  
      - *Position: **Normative Selection***  
        - Central claim: An omission is causal only when norms/duties (e.g., contractual, moral) make it salient; causation is inherently normative.  
        - Hardest commitment: Defending how "causation" remains objective if norm-dependent.  

  #### Unoccupied Cells & Diagnoses  
  - **Q1=Yes + Q2=No + Q3=Causal fact (Causal Mechanism)**:  
    - *Diagnosis*: Unattractive—Requires omissions to be physical components of causal processes, which struggles with cases like "not throwing a rope" (no mechanical integration).  
  - **Q1=Yes + Q2=No + Q3=Norms (Normative Selection)**:  
    - *Unnamed view*: Omissions cause harm only when norms apply, *and* counterfactual dependence is insufficient.  
    - *Diagnosis*: Unexplored—Rarely defended since counterfactual dependence is widely seen as necessary.  

  #### Test Cases  
  *(Positions A–F: A=No Causal Status; B=Figurative; C=Causal Selection Counterfactualism; D=Normative Counterfactualism; E=Causal Mechanism; F=Normative Selection)*  

  1. **Landlord never repairs boiler; tenant dies**:  
     - All positions **except A/B** find causation:  
       - **C/D** (counterfactual + selection): Death depends on non-repair; duty distinguishes landlord.  
       - **E**: Omission disrupts boiler-safety mechanism (if mechanistic).  
       - **F**: Duty to repair makes omission causal.  

  2. **Doctor doesn’t order test; patient dies**:  
     - **A/B**: No real causation (positive cause: cancer).  
     - **C–F**: Causation (counterfactual + duty/norms).  

  3. **Hospital switches off ventilator after a week**:  
     - **All positions**: Treated as an *act* (positive intervention), not omission. Not covered.  

  4. **Engineer ships system without test; outage follows**:  
     - **C/D**: Causation (test would have prevented outage; duty to test).  
     - **E/F**: Causation if omission breaks safety mechanism (E) or norms demand testing (F).  

  5. **Moderation system leaves up post; riot follows**:  
     - **C/D**: Causation if removal would prevent riot (counterfactual) + platform norms.  
     - **E/F**: Weak for **E** (no clear mechanism); strong for **F** (content-moderation duties).  

  6. **Government doesn’t fund flood defences; town floods**:  
     - **D/F**: Causation (counterfactual + normative duty to protect).  
     - **C/E**: Unlikely unless causal role (C) or mechanism (E) is proven.  

  7. **Passer-by doesn’t throw rope to drowning person**:  
     - **A/B/E**: No causation (A/B: not real; E: no mechanism).  
     - **C/D/F**: Only if local norms impose rescue duties (otherwise not "selected").  

  8. **Stops paying for medicine; patient deteriorates**:  
     - **A/B**: Not real causation (positive cause: disease progression).  
     - **C–F**: Causation (counterfactual: payment would prevent harm; duty to continue exists).  

