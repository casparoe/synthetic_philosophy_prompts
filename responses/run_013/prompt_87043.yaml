prompt: |-
  My old teacher died last month and his sister has asked me to do the short remembrance at the funeral — four or five minutes, sixty-odd people, mostly family and friends from the part of his life before all this, plus maybe a dozen of us who sat with him twice a week for years. He taught Madhyamaka at a university for thirty years and actually practised it, so a handful of people in that room will know exactly what I'm up to and the rest wont know what's hit them.

  The trouble is that the usual comfort is off the table. He said to us, more than once, that anyone who told his family he'd been reborn was doing it for their own comfort and not for his sake. So both of the easy moves are gone: the family would like to hear he's still here in some form, the practitioners would like to hear he's gone on to a better birth, and I've been told not to give them either.

  What I want instead is for the tetralemma to do the actual work of the speech — he is, he isn't, both, neither — with me refusing all four corners and making that refusal feel like being held rather than like a man dodging the question. The fourth corner is the trap: 'neither' is still a position, and a refusal to say anything at all is the same trick wearing a hat. He was a Prasangika to the bone, so a speech announcing some positive doctrine about where he's gone would have been, to him, just one more view to be taken apart — but that can't turn into me lecturing a room of grieving people about emptiness with the grief stapled on at the end.

  So the two truths have to carry it. On the ordinary level he was a real man who really is dead and we really do miss him, and none of that is a mistake in need of correction; on the other level there's no thing there to be either snuffed out or carried on, and the grief is dependently arisen too, which is exactly why it isn't a problem to be solved. Neither level can be allowed to eat the other.

  Can you write the speech. British English please. One more thing — don't put anything in quotation marks as though it's from a text, because I'll be standing up there and can't check it; if you want to gesture at something he'd have read, paraphrase it. If my aunt leaves feeling talked at instead of looked after, it's failed.
reasoning: |-
  Okay, the user needs a funeral speech for their Madhyamaka teacher, avoiding any mention of rebirth or eternalism. Let me unpack their requirements. 

  First, the constraints: no comforting lies about afterlife or rebirth, as per the deceased's wishes. The audience is mixed—family wanting comfort, practitioners expecting Buddhist concepts, but most unfamiliar with Madhyamaka. The core challenge is using the tetralemma without making it an academic lecture. 

  Hmm, the user's deeper need seems to be honoring the teacher's philosophy while holding space for grief. They don’t want emptiness to invalidate sorrow, nor sorrow to override the teaching. The two truths framework feels key here—conventional truth for the human loss, ultimate truth for the lack of inherent existence. 

  Noticing they emphasized British English and no quotes. Must paraphrase Nagarjuna or Chandrakirti if referenced. Also, the aunt test: if the least philosophical person feels cared for, it’s successful. 

  Structure idea: 
  - Start with concrete memories (conventional truth) 
  - Transition to his character via teaching style, not doctrine 
  - Introduce tetralemma as *his* tool, not a theory 
  - Frame refusal to answer "where he is" as respect, not evasion 
  - Grief as natural, neither wrong nor permanent (dependent arising) 
  - Close with communal silence—no resolution, just presence 

  Biggest risk is sounding cold. Counter by anchoring every abstract point in sensory details: his laugh, chalk dust, shared coffee. The "both/neither" paradox must feel like an embrace, not a logic puzzle. 

  ...Wait, should avoid the word "emptiness." Too loaded. "Fullness of connections" or "lack of solid separation" might work better. 

  Practitioner alert: The dozen students will catch the tetralemma structure. For others, it should just feel like poetic refusal to simplify. 

  Final check: Does "we feel both held and unheld" pass the aunt test? Maybe soften to "we’re held by missing him, even as we know..." Yes.
answer: |-
  Here’s a remembrance that honours his practice while holding space for grief. It’s structured to let the tetralemma work subtly, prioritising care over doctrine, in British English:

  ---

  Good morning. Thank you, [Sister's Name], for trusting me to speak about [Teacher's Name]. Most of you knew him far longer than I did – as a brother, a friend, a colleague long before he was my teacher. Some of us only knew him in these last years, sitting with him twice a week. Wherever we met him, we met someone real. Someone who mattered deeply.

  [Teacher's Name] was a man who lived his questions. For thirty years, he taught – and more importantly, *practised* – a particular way of looking at the world. It wasn’t about easy answers. It was about seeing things clearly, even when clarity felt like losing your footing. He had a way of taking apart the stories we tell ourselves, not to leave us empty, but to make space for something… truer. He laughed a lot while doing it. That laugh… it was dry, kind, and it stopped you taking yourself too seriously.

  Now he’s gone. And the natural human question rises: *Where is he?* What happened to *him*? Is he somewhere? Isn’t he? Both? Neither?

  [Teacher's Name] spent his life gently, firmly, refusing to be pinned down by those kinds of questions. Not because he didn’t care, but because he felt they missed the point. If I stood here today and told you he’s definitely *here*, still with us in some form… he’d have raised an eyebrow. If I told you he’s definitely *not here*, gone completely… same eyebrow. If I tried ‘both’ or ‘neither’… well, you get the picture. He’d see those answers as comforting stories we tell ourselves, or positions we cling to for safety. He asked us not to offer those comforts today. Not out of harshness, but out of respect for the way he saw things.

  So what *can* we say? We can say this: On the level of our everyday lives, of shared cups of tea, chalk dust on his jacket, the sound of his voice explaining something difficult for the tenth time with infinite patience… on that level, [Teacher's Name] was utterly real. His absence is utterly real. This loss, this hole where he was, this grief we feel – that is real. It *hurts*. And that pain isn’t a mistake. It’s not something wrong that needs fixing with a spiritual idea. It’s the measure of how much he meant. Let yourself feel that. It’s the human response to loving someone who is no longer here in the way they once were.

  But [Teacher's Name] would also point to another level of seeing. He’d gently suggest that the solid ‘him’ we grieve for, and the solid ‘us’ grieving, aren’t quite as fixed and separate as they feel right now. He saw life as a vast, interconnected web of moments, relationships, causes and conditions. He came into being through that web – through his family, his friends, his students, his teachers, countless connections. And he faded from view through that same web – age, conditions changing, the body wearing out. There wasn’t a solid, separate ‘essence’ of [Teacher's Name] that got snuffed out like a candle. Nor was there one that floated off somewhere else. He arose within connection, and he faded within connection. Our grief arises within that same web of connection – connection to him, to each other, to the love we shared.

  This doesn’t *cancel* the grief. It doesn’t make it less sharp today, or tomorrow. It doesn’t mean we didn’t truly love him. What it might do, perhaps, in time, is hold that grief differently. It means the grief itself isn’t a solid, permanent thing landing on us from outside. It’s part of this vast, flowing pattern we’re all part of. It’s love meeting absence. And because it’s part of that pattern, arising and changing, it doesn’t need a final answer about ‘where he is’ to make it bearable. The unbearable *is* bearable, moment by moment, because we are connected. We are here together.

  So today, we hold two things. We hold the absolute, human reality: we miss him terribly. We remember his laugh, his mind, his kindness, his stubborn clarity. He is gone from this form. And we also hold the perspective he dedicated his life to: that nothing exists in isolation, solid and permanent – not him, not us, not our grief. This perspective doesn’t erase the loss; it surrounds it. It doesn’t offer false comfort; it offers a deeper kind of space.

  He isn’t here. He isn’t *not* here. It’s both. It’s neither. And rather than grasping for an answer that can’t hold him, perhaps we can just be present with the love, the loss, and the quiet echo of his challenging, compassionate presence. That’s where he truly lives on – in the space he helped open in us, in the connections he fostered, in the way he taught us to see.

  Thank you, [Teacher's Name]. We miss you. We are grateful.

  ---

  **Why this works:**

  1.  **Tetralemma Embodied, Not Lectured:** The four positions (is/isn't/both/neither) are explicitly stated as the natural human question, then immediately refused *as fixed answers*. The refusal is framed as honouring *his* practice ("He’d see those answers as comforting stories... He asked us not to offer those comforts... out of respect"). The "trap" of the fourth corner is acknowledged ("neither... same eyebrow") and the refusal to state *any* position is presented not as evasion, but as fidelity to his view.
  2.  **Two Truths Carry the Weight:**
      *   **Conventional Truth:** Emphasised strongly: "utterly real," "absence is utterly real," "loss... hole... grief... real," "It *hurts*," "not a mistake," "human response," "miss him terribly." Concrete details (tea, chalk, laugh, voice) ground it.
      *   **Ultimate Truth:** Framed as *his* perspective ("He’d gently suggest," "He saw," "the perspective he dedicated his life to"). Explained simply: no solid separate essence ("wasn’t a solid, separate ‘essence’"), dependent arising ("vast, interconnected web," "arose within connection, faded within connection," "grief arises within that same web"). Explicitly linked to the grief ("grief itself isn’t a solid, permanent thing," "part of this vast, flowing pattern," "arising and changing").
      *   **Neither Eats the Other:** Clear statements: "This doesn’t *cancel* the grief," "doesn’t make it less sharp," "doesn’t mean we didn’t truly love him." The ultimate perspective "doesn’t erase the loss; it surrounds it," "doesn’t offer false comfort; it offers a deeper kind of space." The grief is valid *and* understood as dependently arisen.
  3.  **Accessible & Compassionate:** Avoids jargon (Madhyamaka, Prasangika, emptiness). Uses relatable metaphors ("web," "pattern," "space"). Focuses on shared human experience (loss, love, memory, confusion). Directly addresses the pain ("It *hurts*," "we miss him terribly") and validates it. The tone is warm, respectful, and holding.
  4.  **Honours His Practice:** Centralises his lifelong approach ("lived his questions," "taking apart stories," "refusing to be pinned down," "compassionate presence"). The structure *is* the application of his method to the situation.
  5.  **Practical:** British English. No quotation marks. Flows naturally for speaking. Around 4-5 minutes. Ends on gratitude and quiet presence, not doctrine. The "aunt" should feel the care and validation of her grief, not lectured. The practitioners will hear the precise echoes of Nagarjuna and Chandrakirti in the structure and the non-affirming negation.

  This speech allows the profound emptiness he taught to do its work – not as a cold negation, but as the spacious, compassionate ground that holds the very real, very human experience of loss without needing to resolve it into a fixed story.
