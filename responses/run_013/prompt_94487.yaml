  Missing piece? **Toolchain resilience**. How would proof assistants *actually behave* during an inconsistency crisis? Would Lean fail gracefully or corrupt all verified code? This seems more urgent than philosophical debates about paraconsistency.  

  Prioritization logic:  
  1. **Damage control** is foundational—without knowing *what breaks*, other questions are premature.  
  2. **Toolchain resilience** follows—it's the concrete manifestation.  
  3. **Practical detection** matters if we're discussing response timeframes.  
