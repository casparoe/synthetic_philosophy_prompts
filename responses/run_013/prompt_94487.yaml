  Final note: The user's anxiety is professional, not existential. They need leverage—ways to *engage* with the problem. Recommending a hands-on Lean experiment aligns with that.
answer: |-
  Here's a prioritized agenda of core sub-questions for your "inconsistent foundations" scenario, ranked by conceptual precedence, tractability for your background, and actionable insight. Focus is on **impact assessment** and **practical fallout**, not philosophy.

  1.  **Damage Control: Minimal Salvageable Systems**  
      *Question:* If ZFC (or your proof assistant's foundation) is inconsistent, what's the strongest *consistent* subsystem that still supports most "working math" (e.g., analysis, algebra)?  
      *Why upstream:* Everything else (fallbacks, detection, recovery) depends on knowing what survives.  
      *Tractability:* High. Explore subsystems like ACA₀, RCA₀, or ZFC without Power Set. Use Lean to formalize key theorems (e.g., Intermediate Value Theorem) in weaker systems. See which axioms break core results.  
      *Moves up/down:* Up if inconsistency proofs target specific axioms (e.g., large cardinals); down if inconsistency is "global".  
      *Output:* Concrete list of "safe" axiom sets and the math they lose (e.g., "Without Choice, you lose vector space bases").

  2.  **Practical Detectability & Collapse Radius**  
      *Question:* Under what conditions could an inconsistency proof actually invalidate *existing verified proofs*? (i.e., how localized would the damage be?)  
      *Why next:* Determines if "0=1" is a theoretical or practical threat.  
      *Tractability:* Medium. Analyze Lean kernel dependencies. Could an inconsistency be isolated to niche areas (e.g., homotopy type theory extensions) without affecting arithmetic? Study "relative consistency" proofs – they show where failures *can't* propagate.  
      *Moves up:* If inconsistency arises from complex interactions (e.g., Choice + Replacement); down if it's in basic arithmetic.  
      *Key insight:* Most proofs don't use the full strength of ZFC. An inconsistency in higher set theory might not touch 99% of verified software proofs.

  3.  **Proof Assistant Failure Modes**  
      *Question:* How would Lean/Coq *actually behave* if fed an inconsistency? Would it corrupt existing proofs, crash, or just fail to verify new ones?  
      *Why critical:* Directly addresses your job-risk fear.  
      *Tractability:* High. Hack Lean! Introduce a local axiom `axiom boom : False` and see how it propagates. Does it instantly "poison" all dependent proofs? Can you quarantine it? Test kernel resilience.  
      *Moves up:* Always high – it's the engineering reality check.  
      *Output:* Concrete demo of failure scenarios (e.g., "Modules using `boom` become garbage; others compile fine").

  4.  **The Empirical Case: Is Math 'Accidentally Consistent'?**  
      *Question:* How strong is the evidence from decades of *using* ZFC without contradiction? Does formal verification itself provide inductive support?  
      *Why later:* Informs risk assessment, but doesn't change salvage plans.  
      *Tractability:* Medium. Study near-misses (e.g., Russell's Paradox, early calculus inconsistencies). Contrast with systems *known* to be inconsistent but useful (e.g., naive set theory before fixes).  
      *Moves up:* If inconsistency arises from new, untested axioms (e.g., Reinhardt cardinals); down for core ZFC.  
      *Insight:* Verification of complex math (e.g., Odd Order Theorem) stresses foundations more than most software proofs – that's meaningful evidence.

  5.  **Paraconsistency as a Fallback: Viable or Vapor?**  
      *Question:* Could proof assistants realistically switch to paraconsistent logic (where `P ∧ ¬P` doesn't imply everything)? What would break?  
      *Why last:* Requires answers to #1-3 to evaluate feasibility.  
      *Tractability:* Low (theoretical). Paraconsistent logics are complex and fragment mathematics badly. Simulate it crudely: Modify Lean to not explode on `False` and see which proof patterns fail.  
      *Moves up:* Only if an inconsistency is found but we *must* keep using the broken system (unlikely).  
      *Reality check:* It's mostly a "cope" for foundational crises. Proof engineering relies on explosion – it's how we guarantee absence of errors.

  **Missing Critical Question: The Recovery Pipeline**  
  *Question:* If an inconsistency is found, *how fast* could proof assistants migrate proofs to a safer subsystem (from #1)? What tools exist for automated axiom weakening/dependency analysis?  
  *Why it matters:* Job security hinges on adaptability, not just consistency.  
  *Priority:* Insert after #1. Directly actionable for your field.  
  *Tractability:* High. Experiment with Lean's axiom tracing tools. Try to mechanically port proofs from ZFC to a weaker system, seeing what breaks and why.

  **Prioritized Order for You:**  
  1.  **Damage Control** (What survives?) → 2. **Recovery Pipeline** (How fast can we adapt?) → 3. **Failure Modes** (Will it crash?) → 4. **Detectability** (Will we even notice?) → 5. **Empirical Case** (How worried should we be?) → 6. **Paraconsistency** (Is there a Plan C?).

  **Why this order?**  
  - **#1 and #2** define the *practical response* and are highly tractable for a programmer. You can simulate axiom removal in Lean *tonight*.  
  - **#3** is a concrete stress test directly related to verification work.  
  - **#4 and #5** are meta-questions that won't change your actions.  
  - **#6** is a distant hypothetical.

  **One-Liner:** Start by hacking Lean to see what breaks when you remove axioms – the "disaster recovery" plan depends entirely on what math you can salvage.

  \answer{What consistent subsystem of my proof assistant's foundation preserves the most essential math, and how can I migrate existing proofs to it?}
