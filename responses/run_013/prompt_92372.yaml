answer: |-
  Here's the credence decomposition you requested, with numerical weights, justifications, and a final probability estimate for the Common-Core Claim (CCC): **There is a single phenomenal property that every pleasant experience has and that no unpleasant or neutral experience has.**

  ---

  ### **Credence Decomposition**
  1.  **Mixed Cases as Evidence Against a Single Bipolar Axis (Weight: 40%)**  
      *Credence Impact: -35% (Strongly counts against CCC)*  
      Bittersweet experiences, "painful" pleasures (e.g., intense exercise, cathartic sadness), and simultaneous conflicting affects (e.g., pleasure in relief mixed with residual fear) suggest affective valence isn't monolithic. Neuroscience (e.g., Berridge's work on separable "wanting" vs. "liking" systems, distinct neural substrates for reward/aversion) supports **independent positive/negative systems** that can co-activate. If pleasantness requires a unique phenomenal property *uncontaminated* by negative affect, mixed cases undermine CCC. Genuine co-occurrence implies no *single* property defines all pleasure.  

  2.  **Attitudinal vs. Sensory Accounts (Weight: 30%)**  
      *Credence Impact: -25% (Counts against CCC)*  
      If pleasure is fundamentally *attitudinal* (e.g., Feldman's "taking pleasure *in* X"), not a sensory tone, a shared phenomenal property becomes unnecessary. One can "take pleasure" in diverse experiences (a warm bath, solving a puzzle, moral satisfaction) without a shared *feeling*. The phenomenal character may be tied to the object, not a common core. **If attitudinal theories are viable (likely), CCC is false.** Sensory theories (e.g., Crisp's "tingle") struggle to unify diverse pleasures.  

  3.  **Neural/Functional Correlates ≠ Phenomenal Property (Weight: 20%)**  
      *Credence Impact: -5% (Slight evidence against CCC)*  
      Finding a shared neural mechanism (e.g., dopamine release in NAcc, opioid systems) or functional role (reward prediction error) would be *correlative*, not constitutive of the phenomenal property. It risks a **category error**: identifying a neural substrate *for* pleasure isn't the same as identifying the phenomenal property *itself*. It could explain *how* diverse states generate pleasure without proving they share an *identical* felt quality. Changes the subject if presented as *redefining* pleasure.  

  4.  **Pleasure as Cluster Concept, Not Natural Kind (Weight: 10%)**  
      *Credence Impact: -10% (Modestly counts against CCC)*  
      Pleasure may be a "family resemblance" concept (Wittgenstein) grouping states sharing *some* features (e.g., motivation to continue, positive appraisal, hedonic warmth) without a universal essence. Neurophenomenological diversity (e.g., gustatory vs. aesthetic vs. relief pleasures) suggests a **disunified natural kind**. If no sharp boundary exists between "pleasant" and "neutral," CCC is ill-posed.  

  ---

  ### **Final Credence for CCC: 15%**  
  **Justification:** The combined weight of counterevidence is overwhelming. Mixed cases and attitudinal theories directly challenge the necessity of a universal phenomenal core. Neural correlates don't resolve the hard problem of phenomenology, and pleasure's conceptual heterogeneity suggests it's not a unified natural kind. The burden of proof lies with CCC proponents to identify a property present in *all* pleasures (from sugar to Schadenfreude to serenity) and absent in *all* non-pleasures – a task with no compelling empirical or philosophical success.

  ---

  ### **Weakest Term & Key Evidence**  
  *   **Weakest Term:** **Attitudinal Account viability (Term 2)**.  
  *   **Evidence to Move It:** A robust demonstration that *all* instances of "taking pleasure in X" **necessarily** share an *introspectively identifiable, identical phenomenal property* across contexts (e.g., proof that the pleasure in eating chocolate and the pleasure in hearing a beautiful symphony share a unitary qualitative feel distinct from their sensory objects). Current introspection and heterophenomenology suggest otherwise.  

  ---

  ### **Hedonism Without CCC**  
  Yes, a viable hedonism survives:  
  1.  **Attitudinal Hedonism (e.g., Feldman):** Well-being is constituted by *attitudes of taking pleasure* in states of affairs, regardless of whether those attitudes share a phenomenal core.  
  2.  **Dispositional Hedonism:** Pleasure is defined by its *functional role* (e.g., motivating continuation, reinforcing behavior).  

  **Does it deserve the name?**  
  *   **Yes,** if "hedonism" means well-being is solely a function of **positive affective states** (broadly construed).  
  *   **No,** if "hedonism" *requires* a monolithic *phenomenal essence*.  
  This version avoids triviality by grounding "pleasure" in a substantive psychological/functional criterion (pro-attitudes or reward signatures), not arbitrary labeling. It remains a *substantive empirical thesis* about what constitutes well-being.  

  **Conclusion:** CCC is unlikely (15%). Hedonism need not rely on it; attitudinal or functional accounts offer defensible alternatives that retain the core hedonist insight: well-being tracks positive affect.
