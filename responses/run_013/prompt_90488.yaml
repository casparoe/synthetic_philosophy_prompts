prompt: |-
  So I've been lurking on LessWrong and the EA forums for close to a decade now, and through a series of bad decisions I've become the guy running our local meetup's session next month on the insect sentience "scale argument" — you know, astronomically many bugs, each with some smallish probability of being conscious, and the expected value comes out enormous anyway. The room is about a dozen people, smart, mostly programmers plus two grad students, and almost none of them have done this flavor of reasoning before. A couple are already hostile — they've probaly decided it's Pascal's mugging with extra steps.

  Don't explain the argument to me, I basically get it. Plan how I teach it, ~40 minutes. I want the order the pieces have to go in and why (what has to land before what else can), the one carrying example the whole thing rides on — and I mean pick one and defend it, tell me what it has to have and what it can't, and for the love of god not the usual one-cow-versus-a-billion-insects bit everyone's already seen — the misconceptions they'll bring in or form live, and exactly where in the sequence I head each one off. My guesses: "if bugs count then so do bacteria, plants, rocks"; "this is just scope insensitivity with a philosophy degree"; "we can't know, so nothing follows"; and the sharper one, "you can't multiply a number you don't actually have — 'probability of insect sentience' isn't a probability, it's model uncertainty, so the whole move is a category error." Then give me one closing question that shows whether the structure landed rather than just whether they got squicked, and tell me what I should openly refuse to settle in forty minutes and say so out loud.

  Make actual calls — don't hand me "you could do X or Y," I'll be standing in front of these people and I need decisions with reasons attached. Cap it at 700 words.
reasoning: |-
  Okay, the user is preparing a 40-minute session on the insect sentience scale argument for a local meetup. They've been part of LessWrong and EA forums for a decade but ended up leading this session despite feeling unsure. The audience is a dozen smart people, mostly programmers and two grad students, with little exposure to this reasoning. Some are already hostile, seeing it as Pascal's mugging. I need to help them structure the session effectively.

  The user doesn't need the argument explained but wants the teaching sequence, a unique example, misconceptions to address, a closing question, and what to avoid. Key misconceptions include: bugs leading to bacteria/plants/rocks counting (slippery slope), scope insensitivity, "we can't know so nothing follows," and the model uncertainty critique.

  First, the sequence. Start with why the argument matters to engage them. Then build the core structure step-by-step. Use an original example—maybe a tech-related one since many are programmers. I'm considering a distributed system with microservices that might be failing. Each instance has a small chance of failure, but the expected damage is huge. This avoids the typical cow vs. insects and feels familiar. 

  The example needs: vast numbers (trillions of transactions), low individual probability, and significant impact per instance. It can't imply consciousness. The microservices scenario works because failures are independent, probabilities are small but non-zero, and the expected loss is calculable, addressing scope insensitivity.

  Misconceptions: Address the slippery slope early by distinguishing complexity levels. Preempt scope insensitivity by showing how large numbers amplify small probabilities. Confront the "we can't know" by discussing decision-making under uncertainty. Save the model uncertainty critique for last, explaining that even with uncertainty, we use probabilities to guide actions.

  Closing question: Ask them to estimate the expected value of preventing a certain number of insect deaths. This tests if they grasp the multiplication of probability, scale, and moral weight.

  Openly refuse to settle on assigning exact probabilities or resolving consciousness debates. Focus on the logical structure.

  Why this approach? Starting with relevance hooks them. The tech example makes it relatable. Addressing misconceptions in sequence builds understanding. Ending with application ensures they see the practical use. Avoiding rabbit holes keeps the session on track.
answer: |-
  Here’s your battle plan, step-by-step. Stick to the sequence rigidly—it’s designed to build defensible ground before hitting objections.

  **Sequence & Why:**
  1.  **Hook: The Stakes (3 min)**  
      *Start with why this matters*: "If there's even a 0.0001% chance your actions cause immense suffering, and you act trillions of times, the expected harm becomes massive. Ignoring this is like ignoring asteroid defense because impact probability is low per year."  
      **Why first?** Preempts dismissal as "just philosophy." Anchors the discussion in practical risk management, familiar to programmers and rationalists.

  2.  **Core Structure: Isolate the Logic (12 min)**  
      *Break it into pure math, divorced from insects:*  
      `Expected Value = (Number of Entities) × (Probability of Impact per Entity) × (Moral Weight if Impacted)`  
      Emphasize: This is *standard* expected utility calculation. Not controversial in finance, engineering, or pandemic planning.  
      **Why now?** They must accept the *math* before arguing the *inputs*. Hostility often targets the inputs disguised as attacking the structure. Get "this math is valid" locked down.

  3.  **The Carrying Example: Distributed System Failure (10 min)**  
      **Example:** "You manage a global microservice architecture handling 1 trillion transactions/day. Each transaction has a 1-in-10-million chance of triggering a critical, silent bug due to a rare race condition. Each bug corrupts a user database, causing ~10 hours of recoverable user frustration (your 'unit of harm'). Ignoring the *scale*: '1-in-10-million is tiny, probably fine!' But expected harm/day = 1e12 * (1/1e7) * 10 = 1,000,000 user-frustration-hours. *That* demands action."  
      **Why this example?**  
      *   **Has:** Vast numbers (trillions), tiny *independent* probability per instance, quantifiable (though abstract) harm per event. Mirrors the argument's structure perfectly.
      *   **Lacks:** Consciousness/sentience. Avoids squick *and* pre-empts "but bacteria!" by focusing on *structure* first.
      *   **Defends:** Scope insensitivity (ignoring N×P), shows tiny probabilities *must* be scaled up. Programmers *get* rare systemic bugs.

  4.  **Map to Insects (5 min)**  
      *Now layer on the controversial inputs:*  
      "Replace: Transactions -> Insects. Silent Bug -> Potential Sentience. User Frustration-Hours -> Moral Weight. Numbers are vast (quintillions+ insects), P(Sentience|Insect) is *some* small unknown number >0 (not zero!), Moral Weight if Sentient is *some* positive number. Structure is identical: EV = N × P(Sentience) × Weight."  
      **Why here?** The uncontroversial example *earned* the structure. Now it's just arguing inputs, not the math. Forces critics to engage *within* the framework.

  5.  **Pre-Emptive Strike on Misconceptions (8 min - TARGET SPECIFICALLY)**  
      *   **"Slippery Slope (Bacteria/Rocks)":** "This isn't 'all or nothing.' We assign different P(Sentience) based on evidence! Insects have complex brains/behavior vs. bacteria. We assign P(Sentience|Rock)=0. The argument *depends* on plausible P>0 for insects specifically. It doesn't say *how high* P is, just that N is so big that even very low P matters."  
      *   **"Scope Insensitivity":** "That's *exactly the point*. Our intuitions *are* scope insensitive! The math corrects for that. The microservice example *is* scope insensitivity in action – ignoring the trillion transactions."  
      *   **"We Can't Know, So Nothing":** "We *never* have certainty in risk management (asteroids, pandemics, financial crashes). We use *probabilities* and expected value. Saying 'we can't know P exactly' doesn't make the EV zero; it means we need to estimate P and account for uncertainty."  
      *   **"Model Uncertainty / Not a Real Probability" (Critical - Hit Hard Here):** "True, P(Sentience) isn't a frequentist probability like a coin flip. It's *epistemic* uncertainty – our credence. But we *must* assign credences to act rationally under uncertainty (Should I buy asteroid insurance? Should I prioritize mitigating pandemics?). Refusing to assign *any* credence to insect sentience is equivalent to assigning P=0, which is a strong claim requiring justification. The argument shows that even modest non-zero credences imply massive expected value."

  6.  **Closing Question (2 min)**  
      **"Suppose you grant, for argument's sake, that preventing the death of 1 quintillion insects has a 0.00001% chance of preventing suffering equivalent to preventing 1 human death. What is the expected value in 'human death equivalent' terms?"**  
      *(Answer: 1e18 * 1e-7 * 1 = 1e11, or 100 billion human death equivalents).*  
      **Why this?** It tests if they grasp the multiplicative engine (N×P×W) without getting bogged in whether they *accept* the inputs. If they can calculate it, the structure landed.

  **What to OPENLY REFUSE to Settle (State Upfront & Reiterate):**  
  **"We absolutely will NOT settle the true P(Sentience|Insect) or the exact moral weight in 40 minutes. That requires deep neuroscience, philosophy, and probably centuries. Today is about the *structure*: Does this *type* of reasoning hold water? If it does, *then* we need to go figure out those inputs seriously. If not, why not?"**  
  **Why:** Prevents derail into unanswerable debates. Focuses the session on the logic's validity.

  **Summary Defense:** The sequence isolates the mathematical logic using a neutral, relatable example (distributed systems) *before* applying it to insects. This forces critics to attack the framework itself (hard, as it's standard EV) or the inputs (which you explicitly bracket as unsettled). The example is fresh, lacks consciousness baggage, and leverages programmer intuition for systemic risk. Pre-empting misconceptions *in order* builds a moat around the core argument before objections flood in. Ending with the calculation question verifies comprehension of the mechanism, not agreement.
