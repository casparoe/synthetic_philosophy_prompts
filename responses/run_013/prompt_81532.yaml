prompt: |-
  I'm a TA for a second-year course that mixes biology and philosophy students, and next week I have seventy-five minutes and a whiteboard to teach the section on the two accounts of biological function — the etiological one, which ties a trait's function to the selection history that explains why the trait is there, and the causal-role one, which ties it to the contribution the trait makes to some capacity of the system it sits inside. I don't want you to explain the distinction to me; I want a plan for how I explain it. Which idea has to be in place before which other one, and why the dependencies run that way rather than the reverse — my own instinct is to open with the apparent normativity of function-talk, the sense that a heart that cannot pump is defective in a way that a heart that cannot make a thumping noise is not, but I cannot tell whether that should come first or whether it should be held back as the payoff that makes the two accounts matter at all. I need the one example that should carry the whole session and a statement of what it must have and what it must not have; the misconceptions the students will arrive with and the further ones they will form along the way, in the order those will surface, with the exact point in the sequence where I should head each one off; a single closing question that would tell me whether they have got the distinction or merely memorized two labels; and an explicit list of what I should refuse to explain at this level and announce that I am refusing.

  One complication: half the section are biology students who will think the whole thing is verbal and that "function" obviously means what the trait was selected for, and half are philosophers who will not know what drift is and will therefore treat any appeal to history as hand-waving; the plan has to keep both groups in the room. I also want it to do more than tour two labels. Two things must be in it, and I would like you to place them in the sequence rather than merely mention them. The first is the difference between a trait's being favoured by selection and selection's favouring the trait because of the effect in question — I take it the etiological account collapses without that distinction, and I suspect it is precisely where the biology students' confidence breaks. The second is that the causal-role account is only ever as good as the system and capacity you relativize it to, so that the same organ can have the function of pumping blood or of making a noise depending on how the containing system is carved; the students need to feel that this is a genuine problem rather than a cheap win for the other side. The usual carrying examples, the heart pumping and the vestigial organ, are the cases where everyone already agrees, so they cannot do the work. I have been toying with an invented case and want your verdict on it: a highland snail carries a ridge on its shell that arose under selection for resisting a crab that crushes shells, and in a cave population where the crab has been absent for forty generations the ridge has become the anchor for a mucus strand the snail uses to snag flies. If that case can carry the session, say what each account should be made to say about the cave snails and the highland snails and where the accounts come apart; if it cannot, say what it is missing and what I should use instead. I would also like the plan to say where the middle positions belong — a trait with no selection history whatsoever that is nevertheless disposed to be favoured, and a trait that persists only because of drift — and to tell me where the teleosemantics payoff and the technical formulations of the hybrid views fall, so that I know what to cut.

  Write this as continuous prose in the manner of a long email to a colleague: no headings, no numbered steps, no bullets, no bold, no tables, since the sequence has to come through in the writing itself. And because a teaching plan is a prediction about other people, finish by telling me which part of it you have least confidence in and what would change your mind — what you would need to see in the room, or to learn about how the two accounts actually come apart, before you would reorder the sequence, replace the carrying example, or move one of the misconceptions earlier.
reasoning: |-
  Okay, the user is a TA preparing a 75-minute session on biological function for a mixed class of biology and philosophy students. They need a detailed teaching plan that sequences concepts logically, addresses misconceptions, and keeps both groups engaged. 

  The core challenge is balancing two accounts: etiological (function based on evolutionary history) and causal-role (function based on current contribution). The biology students might dismiss philosophy as "verbal," while philosophy students may see historical explanations as hand-wavy. The TA wants to avoid oversimplification and typical examples like hearts or vestigial organs.

  Key requirements include:
  - Starting with the normativity of function to hook interest
  - Using a novel example (highland vs. cave snails) to force critical thinking
  - Explicitly teaching two crucial nuances: 
    1. Selection must favor a trait *because of* a specific effect (not just correlation)
    2. Causal-role functions depend entirely on how systems are defined
  - Identifying and preempting misconceptions in sequence
  - Ending with a diagnostic question to test understanding

  The snail example works because:
  - Highland snails: Ridge's etiological function is crushing resistance (selected for), not fly-snagging (accidental)
  - Cave snails: Ridge's causal-role function is fly-snagging (current contribution), but *no etiological function* since no selection for snagging occurred
  This exposes where accounts diverge: history vs. current utility.

  Major misconceptions to address in order:
  1. "Function always means current benefit" → countered after introducing normativity
  2. "Selection history = any past advantage" → clarified when explaining "because of" criterion
  3. "Causal-role is subjective" → addressed when discussing system relativism

  Closing diagnostic question: "Could a trait have an etiological function but no current causal-role function?" (Yes – e.g., vestigial eyes in cavefish)

  Parts to explicitly avoid: teleosemantics, hybrid theories, technical formulations

  Least confident point: Whether starting with normativity might make biology students tune out early. Would revise if they seem restless during opening discussion – might instead pivot to snail example immediately and circle back to normativity as the "why it matters" payoff.
answer: |-
  Here’s how I’d approach it, leaning into your instincts but structuring to disarm both camps early. Start with normativity—it’s the hook that makes the debate visceral. Walk in, draw a heart on the board, and ask: "If this heart can’t pump blood but *can* make a rhythmic thumping sound, is it broken? What if it pumps fine but can’t thump?" Get them shouting. The biologists will say pumping matters; the philosophers will pounce on "broken" as normative. That tension is your engine. Don’t resolve it yet—use it to frame the session’s goal: *Why* does "function" feel normative, and can either account capture that?  

  Your snail example is perfect—keep it. It’s exotic enough to force fresh thinking but biologically plausible. Sketch two snail populations: highland (crabs crush shells; thick ridge evolved to resist crushing) and cave (no crabs; same ridge now anchors mucus to catch flies). The ridge is present in both, but its "function" shifts intuitively. Now unpack the accounts *through* this case.  

  **Sequence:**  
  1. **Normativity first (5 min):** Heart example → "defective" implies a "should." Highlight that biology students’ intuition (pumping = true function) already smuggles in normativity. Philosophers will nod; biologists will feel seen.  
  2. **Introduce etiological account via snails (15 min):** "The ridge’s function in highland snails is crushing-resistance because *that’s why selection kept it.*" Stress the "because of" distinction: selection favored the ridge **because** it resisted crushing (not just that it did so). Drill this: "What if the ridge was useless but hitchhiked with a useful gene? Is crushing still its function?" Biologists’ confidence cracks here—they’ll realize "selected for" isn’t automatic. Cave snails? Etiology says the ridge has *no function*—its fly-snagging is accidental (no selection history for it).  
  3. **Causal-role via the same snails (15 min):** "In the cave snail, the ridge contributes to fly-snagging—so *relative to the feeding system*, that’s its function." Relativize mercilessly: if we define the "system" as nutrition, fly-snagging is a function; if as predator-avoidance, maybe not. Make them feel the unease: "So is *any* causal contribution a function? What if we define the system as ‘things that make snail-shaped shadows’? Then the ridge’s function is shadow-casting!" Philosophers will recoil; biologists will scoff. Good—this exposes the account’s vulnerability.  
  4. **Where they clash (10 min):** Highland ridge: etiological says crushing-resistance, causal-role might say "also crushing-resistance" (if system = survival). But cave ridge: etiological says *no function*, causal-role says fly-snagging. The accounts *diverge* on novelty (effects not historically selected for).  
  5. **Edge cases to expose assumptions (15 min):**  
     - *Neutral trait later co-opted:* A mutation arises by drift; later, it becomes useful. Etiology denies it a function *until* selection acts; causal-role assigns one immediately.  
     - *Vestige persisting by drift:* A trait loses its selective advantage but lingers. Etiology says "no function"; causal-role might still assign one if it does *something*.  
  6. **Synthesize the payoff (5 min):** Normativity returns. Etiology grounds "should" in history: a heart "should" pump because ancestors pumped. Causal-role’s normativity is borrowed from system goals (e.g., "survival" is good). Neither fully escapes the problem.  

  **Crucial nuances placed:**  
  - The "because of" distinction comes **during etiological account setup**—when asking why crushing-resistance (not fly-snagging) is the highland function. Head off "selection = any benefit" here.  
  - Causal-role’s system-relativity hits **immediately after defining it**, when applying to cave snails. Ask: "What if a biologist defines the system as ‘locomotion’? What if a philosopher defines it as ‘aesthetic appeal’?"  

  **Misconceptions & interventions:**  
  - *Early:* "Function = current benefit." (From biologists.) **Counter** when introducing normativity: "But a ‘function’ that benefits the organism *now* (fly-snagging) feels less ‘real’ than a historical one—why?"  
  - *Mid:* "Selection history = trait exists." (Biologists.) **Crush** with "because of": sketch a gene that boosts survival but wasn’t selected *for* (e.g., linked to a selected gene).  
  - *Late:* "Causal-role lets us call anything a function." (Philosophers.) **Preempt** by forcing absurd system choices (shadow-casting) to show the account’s limits.  

  **Diagnostic closing question:**  
  "True or false: A trait can have a causal-role function but no etiological function. Explain with the snails." (Answer: true—cave ridge.) If they just parrot labels, they’ll say "yes" but cite highland snails or confuse accounts.  

  **Refuse to explain:**  
  - Teleosemantics ("Not today—that’s for minds, not organs.")  
  - Hybrid accounts ("They exist, but we’re isolating core ideas today.")  
  - Mathematical formulations (e.g., "proper function" criteria—"Stick to concepts now.")  

  **Least confident part:** Starting with normativity. Biologists might dismiss it as "philosophical noise." If I see eyes glazing during the heart debate, I’d pivot fast to snails—"Is the ridge’s function crushing or fly-snagging? Why?"—and circle back to normativity as the *stakes*. What changes my mind? If >1/3 of biologists disengage early, the snail-first path might better unite the room. But your instinct is right: normativity is why they should care, and I’d gamble on it gripping them.  

  This sequence forces both sides to confront their blind spots: biologists see that "selected for" is nuanced; philosophers see history isn’t hand-waving but testable. The snail holds it together—novel enough to avoid canned answers, concrete enough for both disciplines. Drill the "because of" and system-relativity hard; they’re the pillars. Good luck—wish I could watch.
