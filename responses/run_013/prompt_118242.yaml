prompt: |-
  I'm a software engineer, no philosophy background at all, and I'm on a team writing internal guidance for how our product should handle fairness complaints. The whole effort keeps dying in the same ditch: someone says obviously X is unfair, someone else says obviously it isn't, and none of us knows whether we're arguing about something universal to humans or about what 30 people in an office in Seattle happen to feel. So I want a reality check on a specific list of intuitions, not a general essay about culture.

  I made the list up myself, and a few of these I've never seen anyone discuss anywhere, so please dont just tell me what the literature says — there may not be any literature. Reason it out from what you know about how different societies are actually organized: subsistence, religion, kinship, legal institutions, whether a language marks how you came to know something, how much formal schooling people get, whether there's a market economy, that kind of thing. Also no citations or reading lists please, I'm not going to go read papers.

  For each item, give me a number from 0.00 to 1.00 for how confident you are that it's a human universal. 1.00 means you'd bet a year's salary that a random adult anywhere on Earth, in any society we know of, would go along with the claim as I stated it. 0.00 means you'd bet it's local to educated Westerners, or to one particular culture, and that alot of people elsewhere would say the opposite.

  1. Someone who causes a death by accident deserves less blame than someone who causes the identical death on purpose.
  2. It's wrong to punish a person for a wrong their grandparent committed.
  3. A promise you made only because someone was threatening you isn't really binding.
  4. A dead person can be wronged by what happens after they die — their body treated against their wishes, their reputation trashed.
  5. If you replace every plank of a boat one at a time, it's still the same boat.
  6. A person can know something without being able to say how they know it.
  7. It's worse to harm someone by doing something than to let the same harm happen by doing nothing.
  8. A person can be morally responsible for what they did even if they could not have done otherwise.
  9. Whether an action is right or wrong is a fact about the world, not just whatever a group happens to approve of.
  10. Land nobody is using belongs to whoever gets there first and marks it off.
  11. You can owe something to people who don't exist yet.
  12. If a machine or an institution makes the exact call you would have made yourself, you weren't wronged by it.

  Then give me:

  - A table: item, score, one line on why, and what the variation would hinge on, picking from this menu: subsistence, religion, kinship, legal institutions, language/grammar, formal schooling, market economy, or nothing.
  - A tier list, 5 tiers, from things you'd bet your life hold everywhere down to things you'd bet are our own local invention.
  - Any item where the real disagreement would be verbal — where people who disagree just mean different things by the words — and what the two readings are.
  - The three items you're least sure about, and for each one the kind of observation that would change your mind (just describe it, don't cite it).
  - If there's an intuition I left off that would test this better than anything on my list, swap it in for the weakest item and tell me why.

  Write it in American English, I'm in the US and get confused by British spellings.
reasoning: |-
  Okay, the user is a software engineer working on fairness guidelines for their product. They're stuck because team members keep debating what's fair without knowing if their intuitions are universal or just local to their Seattle office. They want me to evaluate 12 fairness intuitions for cultural universality, scoring each from 0.00 to 1.00 based on confidence that any adult anywhere would agree. They specified reasoning from societal factors like subsistence, religion, kinship etc., not philosophy literature. No citations wanted.

  Looking at their list, I need to assess each item carefully. For example, item 1 about accidental vs intentional harm - this seems deeply rooted in how humans perceive agency and harm. Studies show even infants distinguish intentional actions, and legal systems globally treat intent differently, so I'd score this high. But I'll have to consider exceptions like cultures with strict liability concepts.

  Item 4 about wronging the dead is trickier. Some cultures strongly emphasize ancestor veneration while others don't. In societies with strong kinship ties, desecrating a body might be universally seen as wronging the deceased, but in more individualistic cultures this might not hold as strongly. This deserves a lower score.

  For item 5 (Ship of Theseus paradox), this feels more philosophical. Traditional societies might not engage with abstract identity questions the same way. The concept might depend on formal schooling in logic. I'll score this lower around 0.35.

  I notice the user included some novel items like 12 about machines making decisions. That's particularly modern - most cultures historically didn't have automated decision systems to form intuitions about. This might be very Western and tech-influenced.

  For the response, I'll structure it as requested: a table with scores and reasons, a tier list, discussion of verbal disagreements, least certain items with what would change my mind, and possibly suggesting a better intuition test than their weakest item. I'll use American English throughout.

  The user seems frustrated with endless debates, so I should focus on practical clarity. They're not looking for philosophy lessons but concrete anchors for product decisions. I'll highlight where disagreements might stem from word meanings rather than concepts - like "promise" in item 3 or "belongs" in item 10.

  For item 6 about knowing without being able to explain - this feels universal based on how intuition works across cultures, but formal schooling might make people more skeptical of unexplained knowledge. Still, I'd score it high.

  Item 9 about moral facts is philosophically contested (moral realism vs relativism), but anthropologically, most cultures treat morality as objective. Variation might depend on exposure to diverse cultures through market economies.

  I'll suggest replacing item 5 with something like "It's unfair when two identical cases are treated differently" which tests consistency expectations - a stronger fairness universal. The boat paradox is too abstract for testing practical fairness intuitions.
answer: |-
  Here's a reality check on your intuitions, reasoned from cross-cultural evidence and societal structures, tailored for your engineering context:

  **Table of Intuitions**

  | Item | Score | Why (Universal Core) | Variation Hinges On |
  | :--- | :--- | :--- | :--- |
  | 1. Intent vs. Accident | 0.98 | Distinguishing intent from accident is fundamental to agency, harm assessment, and social cohesion across legal/kinship systems. | Legal institutions (strict liability concepts exist). |
  | 2. No Grandparent Punishment | 0.85 | Strong aversion to punishing the innocent is widespread; kinship/religious lineage obligations can create tension. | Kinship, Religion (e.g., inherited sin/caste, blood feuds). |
  | 3. Coerced Promise Not Binding | 0.90 | Recognizing duress invalidates voluntary agreements is crucial for trust; seen in diverse dispute resolution. | Legal institutions (formality requirements might override), Market economy (contract rigidity). |
  | 4. Wronging the Dead | 0.65 | Ancestor veneration/common decency exist; but concepts of post-mortem personhood & harm vary enormously. | Religion, Kinship (strength of ancestor ties), Formal schooling (secularization). |
  | 5. Ship of Theseus | 0.35 | Focuses on abstract identity persistence, not practical fairness. Most cultures prioritize function/use over abstract identity. | Formal schooling (exposure to logic puzzles), Nothing (often irrelevant). |
  | 6. Tacit Knowledge | 0.99 | Intuition, skill, and non-verbalized understanding are universally recognized and essential for survival/social navigation. | Formal schooling (may devalue non-verbal knowledge). |
  | 7. Action Worse Than Inaction | 0.70 | Agency & direct causation heighten responsibility; strong cultural/religious duties to act create counter-examples. | Religion, Subsistence (communal obligations), Market economy (individualism). |
  | 8. Responsibility w/o Alternatives | 0.50 | Compatibilist intuitions exist (blaming the drunk driver), but concepts of free will/determination vary philosophically & culturally. | Religion, Formal schooling (exposure to determinism), Legal institutions. |
  | 9. Morality as Objective Fact | 0.80 | Moral realism ("this *is* wrong") is the default folk position globally; explicit relativism is niche. | Formal schooling (exposure to philosophy/anthropology), Market economy (exposure to diversity). |
  | 10. First Use Marks Ownership | 0.60 | "First occupancy" is common, but often heavily qualified by kinship rights, communal ownership, or religious claims. | Subsistence (nomadism vs. agriculture), Kinship, Legal institutions. |
  | 11. Owed to the Unborn | 0.75 | Intergenerational obligation (resources, land, lineage) is strong in many societies; abstract "debt" may be less universal. | Kinship, Subsistence (sustainability pressure), Religion. |
  | 12. Machine Makes "Your" Call | 0.25 | Relies on concepts of personal agency, delegation, and "wronging" applied to machines/institutions – deeply culturally specific. | Market economy, Legal institutions, Formal schooling (tech exposure), Nothing (novel context). |

  **Tier List (Universality)**

  1.  **Bet My Life (0.95-1.00):** #6 Tacit Knowledge (0.99). *Why:* Foundational to human cognition and skill acquisition universally.
  2.  **Extremely High Confidence (0.85-0.94):** #1 Intent (0.98), #3 Coerced Promise (0.90), #9 Moral Fact (0.80). *Why:* Deeply embedded in agency, trust, and social functioning across diverse societies.
  3.  **High Confidence, Notable Caveats (0.70-0.84):** #2 No Grandparent Punishment (0.85), #7 Action > Inaction (0.70), #11 Owed to Unborn (0.75). *Why:* Strong universal core, but significant cultural forces (kinship, duty, religion) can create important exceptions or different emphases.
  4.  **Moderate Confidence / Culturally Variable (0.50-0.69):** #4 Wronging Dead (0.65), #10 First Use Ownership (0.60), #8 Responsibility w/o Alternatives (0.50). *Why:* Core concepts exist but specific interpretations, applicability, and strength vary considerably based on social structure and belief systems.
  5.  **Low Confidence / Likely Cultural Artifact (0.00-0.49):** #5 Ship of Theseus (0.35), #12 Machine "Your" Call (0.25). *Why:* #5 is a philosophical abstraction rarely engaged with outside specific contexts; #12 relies on modern concepts of agency, delegation, and institutions alien to most historical/cultural frameworks.

  **Verbal Disagreements (Where meaning differs)**

  1.  **#4: Wronging the Dead:** Disagreement hinges on "wronged." Does it mean:
      *   *Reading A (Objective Harm):* Violating the deceased's known wishes or dignity, causing harm *to them* as an entity (common in ancestor-venerating cultures).
      *   *Reading B (Survivor Harm):* Causing distress or offense *to the living* (family, community) by disrespecting memory or customs. Many denying universality hold Reading B implicitly.
  2.  **#8: Responsibility w/o Alternatives:** Disagreement hinges on "morally responsible." Does it mean:
      *   *Reading A (Accountability/Blameworthiness):* The agent is a fitting target for blame/praise/punishment based on their action/character *as it was*.
      *   *Reading B (Ultimate Control):* True responsibility requires the agent *could actually have done otherwise* in that exact situation. Compatibilists (A) vs. Incompatibilists (B).
  3.  **#10: First Use Marks Ownership:** Disagreement hinges on "belongs." Does it mean:
      *   *Reading A (Initial Claim):* Establishes a primary right that must be respected or compensated, often requiring further action (use, development, approval).
      *   *Reading B (Full Ownership):* Grants near-absolute, exclusive, transferable rights immediately. Deniers often assume Reading B; proponents often mean Reading A.

  **Least Sure & What Would Change My Mind**

  1.  **#8 Responsibility w/o Alternatives (0.50):** I'm unsure about the *folk* prevalence of compatibilist intuitions globally vs. incompatibilist ones. **Observation to Change Mind:** Evidence of widespread folk intuitions in diverse, non-WEIRD populations explicitly rejecting blame for actions clearly perceived as determined (e.g., "How could you blame him? The demon/spirits/fate made him do it, he had no choice at all") *without* invoking insanity or diminished capacity.
  2.  **#11 Owed to the Unborn (0.75):** I'm unsure if the feeling is universally framed as *owing* (a debt/obligation) or more as stewardship/a duty/custom. **Observation to Change Mind:** Clear evidence from multiple distinct, non-agrarian/non-hereditary societies of explicit concepts of *debt* or *repayment owed specifically to future people* (beyond just preserving resources for one's own lineage's future).
  3.  **#4 Wronging the Dead (0.65):** I'm unsure how universal the concept of the dead *as a subject of ongoing harm* is, distinct from harm to the living or violation of divine law. **Observation to Change Mind:** Widespread evidence from cultures *without* strong ancestor veneration or specific afterlife beliefs demonstrating genuine concern for the *dead person's own interests/wishes* being violated post-mortem, independent of community feeling or godly wrath.

  **Strengthening the List: Swap for #5 (Ship of Theseus)**

  *   **Weakest Item:** #5 (Ship of Theseus, 0.35). It tests metaphysical persistence, not core fairness.
  *   **Better Intuition:** **"It's unfair when two people in identical situations are treated differently."** (Principle of Consistent Treatment / Formal Equality)
  *   **Why it's Better:** This probes a fundamental expectation of procedural fairness ("treat like cases alike") observed in rudimentary dispute resolution across vastly different societies (hunter-gatherer bands, villages, states). It directly relates to complaint handling ("Why did *they* get that response when *I* didn't?"). Variation exists (who counts as "identical"? What counts as "situation"?), but the *expectation* itself is near-universal.
  *   **Estimated Score:** 0.92. Variation hinges on **Kinship** (favoritism for family might be expected/normalized) and **Legal institutions** (how strictly consistency is enforced).
