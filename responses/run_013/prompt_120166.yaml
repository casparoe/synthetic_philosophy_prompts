prompt: |-
  I'm in a seminar on concepts and categories and we've just moved off prototypes and family resemblance onto the letterform stuff — the puzzle of what makes every 'a' an 'a. My friend Priya does type design and she set me off: you can have a double-storey 'a' with the little hood and bowl, or a single-storey one that's basically a circle with a stick, or anything in between — serif, sans, italic, blackletter, the geometric single-storey ones — and a kid learning to read, a scanner, and a tenth-century scribe all agree it's the same letter. So where does the identity live? Not in any feature, since every feature can change. And Priya says something I cant decide about: a single letter can't really be *in* a style at all. Style is the same handful of decisions made over and over across a whole set of letters, so an 'a' only has a style by sitting in an alphabet — which means the essence of 'a' might be relational, a role rather than a shape. That feels either deep or like a slogan, and I can't tell which.

  For my end-of-term piece I want to write a poem about this where the form does the arguing instead of just decorating it, and I've landed on a sestina because of the way its six end-words keep coming back in a different order every stanza — which is, I think, exactly the relation between the letter's identity and its style: the inventory never changes, only the arrangement and the particular choices within it. So: six end-words that are the actual parts/roles you'd find in an 'a', using terms a type designer would say without rolling their eyes — bowl, counter, stem, terminal, ear, and the sixth is yours to pick (the junction where the bowl meets the stem? the axis of thick-thin stress? something I'm not thinking of), just make sure each one is doing real work rather than sitting there as jargon, and that a reader who's never thought about type design can still follow it. I want the poem to hold two thoughts at once: that the six parts are always all present in their roles (that's the invariant), and that nothing about the letter is stylish until it's next to its neighbours — maybe the envoi is where that second thought lands, the three lines compressing everything into a moment where the 'a' is finally seen alongside the rest of the alphabet and only then reads as being in a style at all. And be honest about the hard case rather than smoothing it over: double-storey vs single-storey 'a' is where the "shared essence" intuition actually wobbles, because those two don't look like variants of each other the way two serif 'a's do — one stanza, or the volta-ish moment if you want to think of it that way, should sit in that discomfort without resolving it. Don't name-drop Hofstadter in the poem and don't give me any citations, I'll handle that part; and don't make it a poem *about* writing a poem, the letterform should be the subject.

  After the poem, give me a short JSON summary, no extra prose: {"end_words": [{"word": ..., "stands_for": one clause} x6], "form_mapping": how the sestina's repetition and permutation track the invariant-vs-style distinction, in 2-3 sentences}, {"hard_case": {"stanza": which one handles the double-storey/single-storey problem, "conclusion": what it leaves the reader with}}, {"envoi_claim": the poem's final claim in one sentence}, {"specialist_gripe": the objection someone who actually works on letterform categories would most likely raise}}. Keep it tight.
