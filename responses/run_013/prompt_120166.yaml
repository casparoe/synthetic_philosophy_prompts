  ## Sestina for the Persistent 'a'

  Not in the **bowl**, that curve which cups the dark,  
  Nor in the **counter**'s breath, the shaped-out air,  
  Does the fixed 'a' reside. The upright **stem**  
  May rise or fall. The **terminal**'s soft hook  
  Or blunt conclusion shifts. The flicked **ear**  
  Listens to nothing, yet insists it's there.  

  And what defines the space where meaning's **there**?  
  The **bowl** might swell to fill a gothic **dark**  
  Or shrink to nought. Does absence make an **ear**?  
  The **counter** breathes, a necessary **air**,  
  Though sometimes choked where **stem** and **bowl** must hook.  
  What force remains? The tension in the **stem**?  

  Consider pressure: where the thick **stem** bears  
  Down, where the thin stroke lifts – the **axis** there  
  Declares a slant, a weight. But even this **hook**  
  Of contrast fades in monolinear **dark**.  
  A single-storey form, a round of **air**,  
  Forgoes the upper chamber, lacks the **ear**.  

  A simple loop, no **ear** to catch the sense,  
  No hooded space, just circle. Yet the **stem**  
  Still anchors it. The **counter** holds its **air**,  
  Essential void. The **terminal** is **there**,  
  A finish point within the scripted **dark**.  
  Does essence fail? Is this a weakened **hook**?  

  Or is the **hook** the role, not shape? The **air**  
  Contained persists, though shaped without an **ear**.  
  The **bowl** still gathers meaning from the **dark**,  
  The **stem** still grounds the mark. The **axis** bears  
  The stress unseen. The **terminal** ends **there**.  
  The parts perform. The name remains, no **stem**  

  Cut loose. But style? Alone, no **stem** can sing  
  Its serif song. No **terminal**, no **hook**  
  Proclaims "italic" in the empty **air**.  
  No single **ear** can whisper "slab" from **there**.  
  The **bowl** alone feels weightless in the **dark**.  
  The **counter**'s breath needs neighbours to declare  

  Its **air** belongs. The **axis** needs a **there**  
  Where other **stem**s confirm its angled **hook**.  
  The **ear** implies the 'g', the 'd' – the **dark**  
  Lets 'o' and 'c' converse. The **terminal**  
  Must echo endings elsewhere. Style's an **air**  
  That fills the set. Alone, the 'a' is just an **ear**  

  ---

  **Envoi**  
  Then see the **stem**, the **bowl**, the **counter**'s **air**,  
  The **terminal**, the **ear**, the **axis** **there** –  
  Arrayed beside the rest, the **dark** declares the **hook** of style.

