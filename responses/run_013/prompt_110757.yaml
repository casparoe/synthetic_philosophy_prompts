  ### (a) Prediction for Next Week's Verdict
  For the bargaining problem with disagreement point (0,0) and feasible set \(S = \{(u_1, u_2) : u_1 \geq 0, u_2 \geq 0, u_1 \leq 1, 2u_1 + u_2 \leq 3\}\), the predicted verdict is (0.6, 1.8) or, equivalently, \(\left(\frac{3}{5}, \frac{9}{5}\right)\).

  **Calculation:**  
  The Pareto frontier is defined by the line \(2u_1 + u_2 = 3\) for \(u_1 \in [0, 1]\), which simplifies to \(u_2 = 3 - 2u_1\).  
  - The ideal point is determined by the maximum possible utilities:  
    - Max \(u_1 = 1\) (since \(u_1 \leq 1\)),  
    - Max \(u_2 = 3\) (when \(u_1 = 0\)).  
    Thus, the ideal point is (1, 3).  
  - Gains from disagreement (0,0) are \(g_1 = u_1\) and \(g_2 = u_2\).  
  - The Kalai-Smorodinsky solution equalizes the proportional gains:  
    \[
    \frac{g_1}{\text{max } g_1} = \frac{g_2}{\text{max } g_2} \implies \frac{u_1}{1} = \frac{u_2}{3} \implies u_1 = \frac{u_2}{3}.
    \]  
  - Substitute into the Pareto frontier equation:  
    \[
    u_2 = 3 - 2u_1 \implies u_2 = 3 - 2\left(\frac{u_2}{3}\right) \implies u_2 = 3 - \frac{2u_2}{3}.
    \]  
    Solving for \(u_2\):  
    \[
    u_2 + \frac{2u_2}{3} = 3 \implies \frac{5u_2}{3} = 3 \implies u_2 = \frac{9}{5} = 1.8.
    \]  
    Then:  
    \[
    u_1 = \frac{u_2}{3} = \frac{1.8}{3} = 0.6.
    \]  
    Thus, the solution is (0.6, 1.8).

  ### (b) Description of the Instructor's Rule
  The instructor's verdicts consistently match the Kalai–Smorodinsky bargaining solution. This solution is defined as follows:  
  - Given a bargaining problem with disagreement point \((d_1, d_2)\) and a convex, downward-comprehensive feasible set \(S\), the Kalai–Smorodinsky solution is the unique Pareto efficient point \((u_1, u_2) \in S\) such that:  
    \[
    \frac{u_1 - d_1}{m_1 - d_1} = \frac{u_2 - d_2}{m_2 - d_2},
    \]  
    where \((m_1, m_2)\) is the ideal point, with \(m_i = \max \{ u_i \mid (u_1, u_2) \in S, u_j \geq d_j \text{ for } j \neq i \}\) for \(i = 1, 2\).  
  - The solution satisfies scale invariance (invariance to independent linear transformations of utility) and always lies on the Pareto frontier.

  **Verification against the record:**  
  - **Problem 1:** \(d = (0,0)\), ideal point (2,2). Equal proportions: \(\frac{u_1}{2} = \frac{u_2}{2} \implies (1,1)\).  
  - **Problem 2:** \(d = (0,0)\), ideal point (2,1). \(\frac{u_1}{2} = \frac{u_2}{1} \implies u_1 = 2u_2\). Frontier: \(u_2 = 1 - 0.5u_1\). Solve: \(2u_2 = 1 - 0.5(2u_2) \implies 2u_2 = 1 - u_2 \implies u_2 = 0.5, u_1 = 1\).  
  - **Problem 3:** \(d = (0,0)\), ideal point (3,1). \(\frac{u_1}{3} = \frac{u_2}{1} \implies u_1 = 3u_2\). Frontier: \(u_2 = 1 - \frac{1}{3}u_1\). Solve: \(3u_2 = 1 - \frac{1}{3}(3u_2) \implies 3u_2 = 1 - u_2 \implies u_2 = 0.5, u_1 = 1.5\).  
  - **Problem 4:** \(d = (0,0)\), ideal point (2,1). \(\frac{u_1}{2} = \frac{u_2}{1} \implies u_1 = 2u_2\). Frontier: \(\frac{u_1^2}{4} + u_2^2 = 1\). Solve: \(\frac{(2u_2)^2}{4} + u_2^2 = 1 \implies u_2^2 + u_2^2 = 1 \implies u_2 = \frac{\sqrt{2}}{2}, u_1 = \sqrt{2}\).  
  - **Problem 5:** \(d = (1,1)\), ideal point (3,2) for utilities, but gains: max gain \(g_1 = 2\) (at (3,1)), max gain \(g_2 = 1\) (at (1,2)). \(\frac{g_1}{2} = \frac{g_2}{1} \implies g_1 = 2g_2\). Frontier: \(u_2 = 2.5 - 0.5u_1\), gains \(g_1 = u_1 - 1\), \(g_2 = u_2 - 1\). Solve: \(u_1 - 1 = 2(u_2 - 1)\) and \(u_2 = 2.5 - 0.5u_1\). Substitute: \(u_1 - 1 = 2(1.5 - 0.5u_1) \implies u_1 - 1 = 3 - u_1 \implies u_1 = 2, u_2 = 1.5\).

