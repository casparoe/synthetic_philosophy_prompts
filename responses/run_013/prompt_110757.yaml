      \]  
      Thus, (2.25, 0.75).  
    - **Egalitarian solution:** Not needed (excluded by record), but for completeness: Maximize min gain; on frontier, min gain is max at (2,1) with min gain 1.  
    - **Utilitarian solution:** Maximize \(u_1 + u_2 = 3\) on the frontier; not unique.  
  - **Separation:** Nash predicts (2,1), Kalai–Smorodinsky predicts (2.25, 0.75). This clearly distinguishes the rules.
