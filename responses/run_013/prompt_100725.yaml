prompt: |-
  Two philosophers have argued for years about vagueness without converging. One is a committed epistemicist: every vague predicate has a unique, fully sharp extension, fixed by facts about our language that we cannot in principle discover; borderline cases are cases of irremediable ignorance; the sorites premise is simply false, if unknowably so. The other is a committed supervaluationist: a vague predicate admits many equally admissible precisifications and no privileged one; a sentence is true when true on all of them, false when false on all of them, and otherwise neither; the sorites premise is therefore not true, though not simply false; borderline cases are genuine truth-value gaps rather than objects of ignorance. They have agreed to a good-faith adversarial collaboration. Write the joint statement they can both sign.

  It should contain, first, a numbered list of claims both accept: about the data to be explained (the sorites, borderline cases, higher-order vagueness, penumbral connections, the apparent tolerance of vague predicates), about the formal machinery each side is entitled to invoke, and about what would count as evidence for or against either view. Second, a table of the residual disagreements, with each side's position stated in wording its own proponent would accept. Third, the cruxes -- the sub-questions such that settling one would move at least one side -- and, for each crux, a case or argument both sides agree bears on it, with each side's prediction recorded in advance.

  To keep this from recycling the standard examples, test both views against the following constructed cases and record what each side predicts. (a) A safety committee, needing a minimum height for a ride, stipulates 122.0 cm, choosing that number because it is round: before the stipulation, was there a fact of the matter about who was tall enough, and does the stipulation create a sharp predicate or merely select among pre-existing precisifications? (b) The same committee makes the stipulation, but the record is destroyed and the decision forgotten, so that no one will ever know the cutoff -- does anything change for either view? (c) The committee also stipulates that children within one centimetre of the cutoff are to be treated as undetermined -- does this manufacture genuine higher-order vagueness, or only a first-order vague predicate with a perfectly sharp meta-boundary, and can either side live with the result? Close by saying which parts of the dispute, if any, are merely verbal, and whether any argument exists that both sides agree would actually settle it.
reasoning: |-
  We are two philosophers, an epistemicist and a supervaluationist, who have agreed to a joint statement after years of debate. We both accept the following claims and will outline our residual disagreements, cruxes, and responses to constructed cases.

  ## 1. Common Ground: Claims Both Accept

  1. **The Sorites Paradox**: The sorites argument presents a challenge for any theory of vagueness. It relies on a series of premises that seem to lead from a true claim (e.g., a 200 cm tall person is tall) to a false one (e.g., a 100 cm tall person is tall) via a long chain of small steps (e.g., reducing height by 0.1 cm at a time). We agree that any adequate theory must block this argument.

  2. **Borderline Cases**: There are cases where it is not clear whether a vague predicate (like "tall") applies. For example, a person of 160 cm might be a borderline case of tallness in a given context.

  3. **Higher-Order Vagueness**: The boundary between clear cases and borderline cases is itself vague. That is, there are borderline cases of being borderline, and so on.

  4. **Penumbral Connections**: There are logical relations between vague predicates. For example, if someone is tall, then they are not not tall; and if someone is neither tall nor not tall, then they are a borderline case.

  5. **Tolerance of Vague Predicates**: Vague predicates seem tolerant to small changes. For instance, if a person is tall, then a person who is 0.1 cm shorter is still tall. However, we agree that this tolerance must break down somewhere in a sorites series, even if we cannot pinpoint where.

  6. **Formal Machinery**: Both sides accept the use of classical logic and model theory. The epistemicist uses a classical model with a unique, sharp extension for each vague predicate. The supervaluationist uses a model with a set of admissible precisifications (classical models) and defines truth as supertruth (truth in all precisifications) and falsity as superfalsity (falsity in all precisifications).

  7. **Evidence**: Both sides agree that the following would count as evidence:
     - The existence of clear cases and borderline cases.
     - The behavior of competent speakers in applying vague predicates (e.g., hesitation in borderline cases).
     - The fact that we can resolve vagueness by stipulation (e.g., in legal contexts).
     - The phenomenon of higher-order vagueness (if established).

  ## 2. Residual Disagreements

  We disagree on the following points:

  | Issue | Epistemicist Position | Supervaluationist Position |
  |-------|------------------------|----------------------------|
  | **Nature of Borderline Cases** | Borderline cases are cases of ignorance: there is a fact of the matter (the object either is or is not in the extension) but we cannot know it. | Borderline cases are truth-value gaps: there is no fact of the matter; the object is neither in the extension nor in the anti-extension. |
  | **Status of the Sorites Premise** | The sorites premise (e.g., "If a person of height h is tall, then so is one of height h-0.1 cm") is false, but we cannot know where it fails. | The sorites premise is not true (since it fails on every precisification) but not false (since it is true on some precisifications). It is neither true nor false. |
  | **The Extension of a Vague Predicate** | Every vague predicate has a unique, sharp extension fixed by the use of the language and non-linguistic facts, but this extension is unknowable. | A vague predicate has many equally admissible precisifications (sharp extensions). There is no unique, privileged extension. |
  | **Truth in Borderline Cases** | In a borderline case, the sentence is either true or false, but we cannot know which. | In a borderline case, the sentence is neither true nor false. |
  | **Higher-Order Vagueness** | Higher-order vagueness is also a matter of ignorance: there is a sharp boundary between the clear cases and the borderline cases, but we cannot know where it is. | Higher-order vagueness is genuine: the boundary between clear cases and borderline cases is itself vague, meaning there are no sharp boundaries at any level. |

  ## 3. Cruxes and Constructed Cases

  We identify the following cruxes (sub-questions) that, if settled, would move at least one side. For each, we present a case and record our predictions.

  ### Crux 1: Can stipulation create a sharp boundary or only select among pre-existing ones?

  **Case (a):** A safety committee stipulates a minimum height of 122.0 cm for a ride, choosing that number because it is round. Before the stipulation, was there a fact of the matter about who was tall enough? And does the stipulation create a sharp predicate or merely select among pre-existing precisifications?

  - **Epistemicist Prediction**: Before the stipulation, there was already a fact of the matter about the exact cutoff for "tall enough" for the ride, but it was unknown. The stipulation does not create a new sharp predicate but rather makes explicit what was already the case. The committee might have been guided by the pre-existing, unknowable cutoff (e.g., because 122.0 cm is round and close to the true cutoff) but they are simply revealing (or approximating) the fact that was already there.

  - **Supervaluationist Prediction**: Before the stipulation, there was no fact of the matter about the exact cutoff. The predicate "tall enough" was vague, and there were many admissible precisifications. The stipulation does not create a sharp boundary from scratch but selects one of the pre-existing admissible precisifications. By choosing 122.0 cm, the committee makes that precisification actual for the context of the ride.

  ### Crux 2: Does the unknowability of the cutoff (due to lost records) affect the metaphysics of vagueness?

  **Case (b):** The same committee makes the stipulation, but the record is destroyed and the decision forgotten, so that no one will ever know the cutoff. Does anything change for either view?

  - **Epistemicist Prediction**: Nothing changes. The stipulation fixed the cutoff, and it remains fixed even though no one can know it. The fact that the records are lost does not alter the existence of the sharp boundary; it merely makes it impossible for anyone to discover it. The situation is analogous to other cases of irremediable ignorance.

  - **Supervaluationist Prediction**: Without the stipulation being known or in force (since it is forgotten and not recorded), the predicate reverts to being vague. The stipulation only has effect if it is in force (i.e., if it is part of the linguistic practice). Since it is lost, it no longer constrains the admissible precisifications. Thus, the predicate remains vague, and there is no privileged cutoff.

  ### Crux 3: Can stipulation create genuine higher-order vagueness?

  **Case (c):** The committee also stipulates that children within one centimetre of the cutoff are to be treated as undetermined. Does this manufacture genuine higher-order vagueness, or only a first-order vague predicate with a perfectly sharp meta-boundary? And can either side live with the result?

  - **Epistemicist Prediction**: The stipulation creates a rule that introduces a sharp boundary for the predicate "tall enough" (say, at 122.0 cm) and also a sharp boundary for the new predicate "undetermined" (at 121.0 cm and 123.0 cm). This does not create genuine higher-order vagueness because the boundaries are sharp. However, the epistemicist can live with this because it is a case of artificial precisification. It shows that we can create sharp boundaries, but in natural language, boundaries are sharp but unknowable.

  - **Supervaluationist Prediction**: The stipulation creates a three-valued system: definitely tall enough (above 123.0 cm), definitely not (below 121.0 cm), and undetermined (between 121.0 and 123.0 cm). This is a first-order vague predicate with a sharp boundary for the "undetermined" status (so no genuine higher-order vagueness). However, the supervaluationist can live with this because it is a precisification. The supervaluationist would note that in natural language without such stipulations, higher-order vagueness is genuine, but here we have a controlled case of a sharp meta-boundary.

  ## 4. Verbal Disputes and Settling Arguments

  - **Verbal Disputes**: We agree that some aspects of our dispute are verbal. In particular, the meaning of "fact of the matter" might be at issue. The epistemicist uses it to mean that there is a unique, objective (but unknowable) truth value. The supervaluationist denies that there is a fact of the matter in borderline cases, meaning that there is no unique truth value. However, we both agree on the underlying phenomena (e.g., the existence of borderline cases, the failure of the sorites premise) and the formal models. The dispute might be about the metaphysics of language and truth.

  - **Settling Arguments**: We both agree that if it could be shown that competent speakers must treat borderline cases as having a determinate truth value (even if unknown) or must treat them as truth-value gaps, that would settle the issue. However, we disagree about what the behavior of competent speakers shows. We also agree that if a method were discovered to know the exact cutoff (e.g., by a "vagueness meter"), that would support epistemicism. Conversely, if it could be proven that no such cutoff exists (even in principle), that would support supervaluationism. But we both think that such a method or proof is not available.

  In conclusion, we continue to disagree on the fundamental nature of vagueness, but we have clarified our common ground and the points of divergence. We hope this adversarial collaboration will help advance the discussion.

  Signed,
  [Epistemicist] and [Supervaluationist]
answer: |-
  ### Joint Statement on Vagueness: Epistemicism vs. Supervaluationism  
  **Signed by Both Philosophers**

  We, an epistemicist and a supervaluationist, agree on the following common ground while acknowledging persistent disagreements. This statement outlines shared commitments, residual disputes, and cruxes tested against novel cases. Our collaboration adheres to classical logic, respects linguistic data, and identifies non-verbal disagreements.

  ---

  ### 1. Common Ground: Claims Both Accept  
  *(Numbered List of Shared Commitments)*  

  1. **The Sorites Paradox**:  
     - The sorites argument (e.g., a 200cm person is tall; reducing height by 0.1cm preserves tallness; thus, a 100cm person is tall) must be blocked. The premise "small changes preserve vague predicates" is defective, but we disagree on *how*.  

  2. **Borderline Cases**:  
     - Borderline cases exist (e.g., someone neither clearly tall nor clearly not tall). Competent speakers exhibit hesitation, retraction, or refusal to judge in such cases.  

  3. **Higher-Order Vagueness**:  
     - The boundary between clear cases, borderline cases, and clear non-cases is itself vague (e.g., borderline-borderline cases exist). No theory may posit sharp boundaries at any level without justification.  

  4. **Penumbral Connections**:  
     - Logical relations between vague predicates hold (e.g., "x is tall" and "x is not tall" cannot both be true; if "x is tall" is false, "x is not tall" is true).  

  5. **Tolerance of Vague Predicates**:  
     - Vague predicates *appear* tolerant (small changes seem not to affect category membership). Both theories must explain why this appearance arises and why it misleads in sorites series.  

  6. **Formal Machinery Entitlements**:  
     - Classical logic and model theory apply to clear cases.  
     - Epistemicism may invoke sharp extensions in a classical model (unknown but determinate).  
     - Supervaluationism may invoke sets of admissible precisifications (classical models) and define:  
       - Truth = supertruth (true in all precisifications).  
       - Falsity = superfalsity (false in all precisifications).  
       - Neither = true in some precisifications, false in others.  

  7. **Evidence Standards**:  
     - **For epistemicism**: Evidence includes the possibility of unknowable facts in other domains (e.g., historical unknowns), and the success of classical logic in science.  
     - **For supervaluationism**: Evidence includes the incoherence of locating sharp cutoffs, and the utility of truth-value gaps in modeling speaker behavior.  
     - **Against either view**: If one theory implies recognizable sharp boundaries or collapses higher-order vagueness, it fails.  

  ---

  ### 2. Residual Disagreements  
  *(Table of Divergences, Stated in Each Proponent’s Terms)*  

  | Issue | Epistemicist Position | Supervaluationist Position |
  |-------|------------------------|----------------------------|
  | **Borderline Cases** | "Borderline cases reflect ignorance: 'X is tall' is either true or false, but we cannot know which. Truth values are determinate but epistemically inaccessible." | "Borderline cases are truth-value gaps: 'X is tall' is neither true nor false. No fact of the matter exists, as admissible precisifications disagree." |  
  | **Sorites Premise** | "The tolerance premise is false. There is a sharp cutoff where subtracting 0.1cm makes someone not tall, but we cannot find it." | "The tolerance premise is neither true nor false. It holds in some precisifications but fails in others, explaining its plausibility and ultimate invalidity." |  
  | **Nature of Vague Predicates** | "Vague predicates have unique, sharp extensions fixed by usage and non-linguistic facts. Precisifications are epistemic tools approximating the unknowable truth." | "Vague predicates lack unique extensions. Admissible precisifications are ontologically on par; truth is supertruth, not correspondence to a single cut." |  
  | **Higher-Order Vagueness** | "Higher-order vagueness is higher-order ignorance. There is a sharp boundary between (e.g.) clear tall and borderline tall, but we cannot locate it." | "Higher-order vagueness is irreducible: no sharp boundaries exist at any level. The set of precisifications itself has blurred boundaries." |  

  ---

  ### 3. Cruxes: Sub-Questions and Predictions on Constructed Cases  
  We identify **cruxes**—sub-questions whose resolution would shift at least one position—and test them against novel cases. Each case includes both sides’ predictions.  

  #### **Crux 1: Does stipulation create a sharp boundary or select among existing precisifications?**  
  *Relevance: If stipulation creates a new sharp boundary, it favors epistemicism. If it selects from pre-existing options, it favors supervaluationism.*  
  - **Case (a)**: A safety committee stipulates a minimum height of 122.0 cm for a ride because it is "round." Before stipulation, was there a fact of the matter about who was tall enough? Does stipulation *create* a sharp predicate or *select* among precisifications?  
    - **Epistemicist**: "Before stipulation, there was a fact of the matter (a sharp cutoff unknowably fixed by usage). Stipulation *discovers* or *approximates* this cutoff but does not create it. The roundness of 122.0 cm is a lucky match to the pre-existing boundary."  
    - **Supervaluationist**: "Before stipulation, no fact of the matter existed—only a range of admissible cutoffs (e.g., 121.5–122.5 cm). Stipulation *selects* one precisification (122.0 cm) from this set, rendering it ‘the’ extension for the ride’s context."  

  #### **Crux 2: Does permanent unknowability affect the metaphysics of vagueness?**  
  *Relevance: If destroying records changes nothing, epistemicism holds; if it restores vagueness, supervaluationism holds.*  
  - **Case (b)**: The committee’s stipulation (122.0 cm) is recorded but later destroyed and forgotten. No one can ever know the cutoff. Does anything change?  
    - **Epistemicist**: "Nothing changes. The cutoff remains 122.0 cm; its unknowability is ordinary (like burned historical documents). Vagueness is ignorance, so the predicate is sharp but unknown."  
    - **Supervaluationist**: "The predicate reverts to vagueness. Without the stipulation in force (i.e., not guiding usage), admissibility constraints broaden. The cutoff is no longer privileged; all precisifications in the original range are again equally admissible."  

  #### **Crux 3: Can stipulation manufacture genuine higher-order vagueness?**  
  *Relevance: If meta-boundaries remain sharp, epistemicism accommodates this; if higher-order gaps emerge, supervaluationism gains ground.*  
  - **Case (c)**: The committee stipulates that heights within 1 cm of the cutoff (122.0 cm) are "undetermined." Does this create genuine higher-order vagueness (e.g., borderline borderline-cases) or a sharp meta-boundary?  
    - **Epistemicist**: "This creates a sharp meta-boundary: ‘undetermined’ applies precisely at 121.0–123.0 cm. No higher-order vagueness exists—just artificial three-valued logic. We accept this, as it mirrors how ignorance can be formalized without violating epistemicism."  
    - **Supervaluationist**: "This only creates first-order vagueness with a sharp meta-boundary (121.0/123.0 cm). Genuine higher-order vagueness requires boundaries that are *themselves* vague, which stipulation cannot create. We accept this result: stipulations can limit but not eliminate vagueness’s inherent hierarchy."  

  ---

  ### 4. Verbal Disputes and Settling Arguments  
  - **Merely Verbal Aspects**: We agree that debates over "fact of the matter" are partly terminological. Epistemicism uses "fact" to mean *mind-independent, determinate truth*; supervaluationism denies this but accepts "facts" about supertruth. This difference does not affect predictions for Cases (a)–(c).  
  - **Non-Verbal Disagreements**: The core divide—**whether vagueness is ontological (truth-value gaps) or epistemic (ignorance)**—is substantive. It shapes divergent predictions for Cases (b) and (c).  
  - **Settling the Dispute**: Both sides agree that one argument would resolve the issue:  
    - **The Discovery Argument**: If a method were found to reliably identify cutoffs (e.g., a "vagueness meter" exploiting linguistic facts), epistemicism would be confirmed. If no such method is possible *even in principle* because no cutoffs exist, supervaluationism would prevail. Currently, neither proof is available.  

  ---  
  **Conclusion**: We remain divided on the metaphysics of vagueness but commit to this framework for future debate. Our predictions for Cases (a)–(c) are testable, offering a path to progress.  

  Signed,  
  **The Epistemicist**  
  **The Supervaluationist**
