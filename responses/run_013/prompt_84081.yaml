prompt: |-
  I sit on the institutional review board at a university-affiliated hospital. I spent thirty years as a toxicologist in a state environmental-health laboratory, and since retiring I have been reading philosophy on my own — slowly, and not always well.

  Our policy permits us to enroll adults who cannot consent for themselves only in research that poses no more than minimal risk, and it defines the term by borrowing the federal language: minimal risk means that the probability and magnitude of harm or discomfort anticipated in the research are not greater in and of themselves than those ordinarily encountered in daily life or during the performance of routine physical or psychological examinations or tests. That is the whole of our guidance. There are no worked examples and no statement of whose daily life is the comparison.

  The protocol before us is a biomarker study of early neurodegeneration. Each participant would give a few extra vials of blood, spend an hour in a scanner with a contrast agent, and undergo a lumbar puncture. The lumbar puncture is what worries me, but the investigators point out that many of these patients have scans and spinal taps as part of their ordinary clinical workup anyway, and that each element taken alone is something we approve for competent adults without a second thought. The board has split. One member says the protocol as a whole is plainly more than daily life and that we are fooling ourselves to pretend otherwise; another says that if every component falls within the range of what our patients already endure, then the sum cannot be the thing we are forbidden to approve.

  I keep noticing that our disagreement has the shape of the sorites paradox, and also that it may not: minimal risk is not a property of a heap, it is a comparison between a research procedure and the risks of ordinary life, and no one has told us whose ordinary life.

  In my old field we set thresholds constantly. We identified a no-observed-adverse-effect level, divided by uncertainty factors, and published a number that regulators and industry could both act on. Everyone understood that the number did not mark a seam in nature; its point was to be usable, revisable, and candid about its conventional character. I would like the opinion to say plainly whether the philosophical literature on vagueness adds anything to that practice or whether it diagnoses something else.

  One member has proposed a three-zone rule: procedures clearly within minimal risk approved as before, procedures clearly beyond it sent for full review, and a middle band referred to a subcommittee that must record its reasons case by case. I want to know whether that genuinely helps or merely moves the same problem up one level.

  Please draft the short written opinion I will circulate before our Thursday meeting. It should recommend a concrete disposition of this protocol, with a time frame; state the test the board should apply to cases like it in future, in words a reviewer can actually use at a desk; give the strongest argument on the side I am inclined against its due rather than a token hearing; and be explicit about which parts of the sorites apparatus bear on our situation and which do not, including an honest verdict on the three-zone proposal. I do not need citations or a reading list — I am reading on my own and want the arguments in your own words.

  Finally, please say how confident you are in each substantive claim you make, and single out the one point you are least sure of.
reasoning: |-
  Okay, the user is an IRB member with a toxicology background who's now grappling with a philosophical dilemma in research ethics. They're struggling with defining "minimal risk" for vulnerable populations, specifically for a neurodegeneration biomarker study involving lumbar punctures. 

  Hmm, their core tension is fascinating: they recognize the sorites paradox lurking in risk assessment (when does "minle risk" become "more than minimal"?), but wisely question if it's even the right framework. Their experience with NOAEL thresholds shows they understand pragmatic line-drawing - yet they're frustrated by the federal guidance's vagueness about whose "daily life" sets the benchmark.

  The protocol itself is tricky. On one hand, lumbar punctures aren't trivial; on the other, these patients often undergo them clinically. The board's split between holistic vs. component-based assessment mirrors classic aggregation problems in ethics. 

  What they really need isn't philosophy lectures but actionable governance. The three-zone proposal is smart because it embraces vagueness rather than denying it. I should emphasize that while sorites highlights boundary issues, it doesn't paralyze decision-making - we manage vague thresholds in toxicology all the time. 

  Key points to stress: 
  First, clarify that "ordinary life" means this specific patient population's clinical reality, not healthy people's lives. That resolves the comparator ambiguity. 
  Second, admit the lumbar puncture pushes this toward moderate risk - hence recommending a subcommittee review isn't evasion, but prudent calibration. 
  Third, the three-zone system works precisely because it institutionalizes uncertainty. The confidence wobble will be about whether to include "typical clinical burden" explicitly in the definition - it's ethically sound but risks therapeutic misconception. 

  Most importantly, they need language reviewers can actually use tomorrow: concrete questions like "Would this procedure occur outside research?" and "Is the risk increment clinically meaningful?" The draft opinion should model that practicality.
answer: |-
  ## Written Opinion: IRB Protocol #ND-Biomarker-2024  

  **To:** Institutional Review Board Members  
  **From:** [Your Name], IRB Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation & Framework for Minimal Risk Determination  

  ---

  ### I. Disposition of Current Protocol  
  **Recommendation:** Return protocol to investigators for modification. The study *as proposed* exceeds minimal risk due to the **aggregate burden** of serial procedures (blood draws, contrast MRI, *and* lumbar puncture) on a non-consenting population.  
  **Timeline:** Investigators may resubmit within 30 days with either:  
  (A) Removal of lumbar puncture, OR  
  (B) Submission to **full IRB review** (not expedited) with justification for the LP’s necessity and additional safeguards for participants (e.g., specialized clinician, pain management protocol).  

  ---

  ### II. The Test for Future Cases  
  **Minimal Risk Determination Framework:**  
  > *"Does the **total research burden** pose risks no greater than those routinely experienced by the **specific participant population** in their daily clinical or personal lives? Assess procedures holistically, not in isolation. If any single procedure is atypical for the population’s ordinary experience, or if cumulative procedures exceed their routine clinical burden, the risk is likely more than minimal."*  

  **Reviewer Checklist:**  
  1. **Identify the participant population** (e.g., early neurodegeneration patients).  
  2. **Define their "ordinary life" risks:** Documented clinical routines, common comorbidities, and typical diagnostic burdens.  
  3. **Map research procedures:** Compare *each* procedure’s risk magnitude/frequency to the population’s baseline.  
  4. **Assess aggregation:** Does adding research procedures to their clinical routine create a *meaningful new burden*?  

  ---

  ### III. Strongest Counterargument (Against My View)  
  *"If every component procedure is routinely experienced individually by this patient population during standard care, their exposure to the same procedures in research cannot introduce novel risks. Rejecting this protocol functionally denies access to research for non-consenting adults—populations already underrepresented in science—based on arbitrary aggregation logic. We approve each procedure separately for competent adults; consistency demands we permit their combination when clinically justified."*  
  *(My confidence in rebutting this: 85% - While logically appealing, it ignores synergistic discomfort and autonomy violations specific to non-consenting participants.)*  

  ---

  ### IV. The Sorites Paradox: Relevance & Limits  
  - **Relevant:** The paradox highlights how vague thresholds (like "minimal risk") resist binary categorization. We cannot pinpoint the exact vial of blood or minute in the scanner that tips the scale.  
  - **Not Relevant:** Minimal risk is a **relational comparison** (research vs. baseline life), not a property of a "heap" of procedures. Vagueness here stems from contextual factors (population, clinical norms), not compositional ambiguity.  
  - **Practical Takeaway:** Philosophy diagnoses the problem but cannot solve it. We must set conventions (like NOAELs) while admitting their fluidity.  

  ---

  ### V. Three-Zone Proposal: Assessment  
  - **Strength:** Explicitly acknowledges vagueness by creating a "gray zone" for case-by-case review. Reduces pressure for forced binary judgments.  
  - **Weakness:** Merely relocates the sorites problem: When does "clear minimal risk" end and the "gray zone" begin?  
  - **Verdict:** **Adopt with modification** (Confidence: 75%).  
    - Define zones using population-specific anchors:  
      - **Green Zone (Expedited Approval):** Procedures ≤ routine daily/clinical burden (e.g., extra blood draws during a scheduled phlebotomy).  
      - **Yellow Zone (Subcommittee Review):** Procedures comparable to—but potentially exceeding—routine burden (e.g., research LP in patients who *might* get one clinically).  
      - **Red Zone (Full Board Review):** Procedures clearly beyond the population’s ordinary experience (e.g., organ biopsy in stable outpatients).  
    - **Require the subcommittee to:**  
      - Justify "yellow zone" decisions using the population’s documented clinical standards.  
      - Flag decisions for full-board debate if precedential.  

  ---

  ### VI. My Least Confident Point  
  **Defining the "ordinary life" comparator** (Confidence: 60%).  
  - *Why uncertain:* Should "ordinary life" reflect the population’s *current medical reality* (e.g., "these patients get LPs anyway")? Or a *healthy baseline* to avoid exploiting vulnerability?  
  - *Proposed Resolution:* Default to the **population’s actual clinical experience** but require investigators to prove typicality (e.g., via clinic data). This avoids penalizing the sick while preventing normalization of high burdens.  

  ---

  ### Final Recommendation  
  Vote to conditionally approve the three-zone framework (final language due in 60 days) and return the current protocol for revision per Section I. This balances philosophical honesty with operational clarity.  

  ---  
  **Endorsed:**  
  [Your Name]  
  *IRB Member*
