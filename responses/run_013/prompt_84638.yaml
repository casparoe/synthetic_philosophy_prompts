  - Misunderstanding "sophisticated substantivalism" as mere stipulation: it's actually the claim that spacetime points exist but only as nodes in a relational structure. The diffeomorphism isn't changing reality but our coordinate labels.
  - Overinterpreting the gauge analogy: while similar to EM, GR's diffeomorphism freedom is more profound because it affects the definition of points themselves.

