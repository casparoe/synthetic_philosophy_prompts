prompt: |-
  I'm the general counsel for a mid-sized city (about 90,000 people, four lawyers total in our office) and my boss, the city manager, has asked me to write a short internal guide for our licensing and code-enforcement staff. The problem is that our ordinances were drafted by people who died before I was born and then amended piecemeal ever since, so we get a steady stream of calls where the text doesn't obviously answer the question and the clerk just wants someone to tell them yes or no. Right now they email me, I read the section, and I write back something like "I think it covers it," and honestly the way I get there is: I read the words, I try to reconstruct what the council was trying to accomplish, and I split the difference between the two. Thats not a method, thats a mood. They're making maybe thirty of these calls a month, some of them (food trucks, short-term rentals, the e-bike thing on the riverfront trail) have real money and real angry people behind them, and my name goes on the guidance letter when it blows up.

  So: I want you to act as an expert in the philosophy of law and the philosophy of language who actually knows the statutory-interpretation literature — textualism, purposivism, intentionalism, the old mischief rule, the absurdity doctrine, canons like ejusdem generis and expressio unius, and the distinction people draw between working out what a text means and deciding how to apply it to something the drafters never imagined — and turn all that into a decision procedure my clerks can run. Two things I care about. First, dont hand me a list of canons in a trench coat. It has to be a sequence they can actually walk through: the questions in order, what counts as a sufficient answer at each step, where it terminates in a clean "covered" or "not covered," and where it hands the call back to a person because whats left is a question about values, or about what we wish the law said rather than what it does. Second, be honest about the theory, because this is the part I actually need: every step in a procedure like this quietly commits you to some view about what it even is for a text to have a meaning. So for each step, tell me which view it presupposes, and what that step would look like under the rival view — if you thought the point was the drafters' intentions, or the purpose, rather than the words on the page. I'd rather have a procedure with a visible seam down the middle than one that pretends the disagreement isn't there. Practical constraints: no legal training, one of my clerks is working in her second language, someone is standing at the counter waiting, so keep it to a page, no 1-to-5 factor weighing, and flag the places where the procedure is just my gut dressed up as a rule.

  Then run it on three of our actual messes. The main ordinance, passed 1974, amended twice: "It shall be unlawful to sell or offer for sale any food, beverage, or other merchandise from a vehicle parked on any public street or public sidewalk within the Downtown Overlay District, except during a special event permitted under Chapter 9." Case one: a food truck parked in a private parking lot inside the district, with customers ordering at the window and then standing on the public sidewalk to eat. Case two: an ice cream truck that never really parks — it rolls slowly down the street and stops for two or three minutes at a time with the engine running. Case three: a woman selling bottled water off a card table on the sidewalk, no vehicle at all. Before you write the procedure, spend a few sentences figuring out where the genuinely hard cases are and which distinctions have to survive the simplification and which ones I can afford to lose. And please include at least one result I wont like — my instinct is always to do whatever seems sensible, and I have a suspicion your procedure is going to tell me the sensible thing is not what the ordinance says.
reasoning: |-
  Okay, the user is the general counsel for a mid-sized city dealing with outdated ordinances and needs a practical decision procedure for licensing and code-enforcement staff. They're getting about 30 calls a month where the ordinance text isn't clear, and their current approach is informal. They want a step-by-step guide that's usable by clerks without legal training, addressing philosophical underpinnings honestly, and fitting on one page. 

  First, I need to unpack their core frustrations: the ordinances are archaic and amended haphazardly, leading to ambiguous situations. Staff emails them for interpretations, and their method feels arbitrary—based on reading the text and guessing legislative intent. This is risky because some cases involve significant stakes (food trucks, short-term rentals), and their name is on the guidance when things go wrong. 

  The user explicitly wants two things: a procedural flowchart-like sequence (not just a list of canons) and philosophical transparency about interpretive theories. They also insist on practical constraints—no legal jargon, clarity for non-native speakers, speed, and acknowledgment of where the procedure masks subjective judgment. Plus, they want real examples tested, including at least one outcome that challenges their "sensible" instinct.

  Hmm... the philosophical tension here is between textualism (what the words say), intentionalism (what drafters meant), and purposivism (what the law aims to achieve). The procedure must navigate these without pretending they align. For instance, textualism might ignore "sensible" outcomes if the text is clear, while purposivism might override text to avoid absurdity. 

  For the decision procedure, I'll structure it as a cascade: start with literal text, then check for ambiguity, then purpose/intent, then canons, and finally policy if needed. Each step must have a clear exit to "covered/not covered" or "escalate." Crucially, I'll flag where subjectivity creeps in (e.g., defining "absurdity" or "purpose"). 

  Now, for the hard cases in their examples: the ordinance bans sales from vehicles on public streets/sidewalks downtown, with a special-event exception. Key distinctions: 
  - Is "vehicle" present? (Water seller has none, so likely not covered.)  
  - Is it "parked"? (Ice cream truck stops briefly—maybe not "parked.")  
  - Location: private lot vs. public street? (Text says "public street/sidewalk," but what if the vehicle is private and customers spill onto public space?)  

  The water seller (case three) is easiest—no vehicle, so probably not covered. Food truck in private lot (case one) is trickier: vehicle is on private property, but customers use public sidewalk. Textually, the ban applies to vehicles on public land, so maybe not covered... but purposively, if the goal was to prevent sidewalk congestion, it might be covered. Ice cream truck (case two) hinges on "parked"—is a brief stop "parking"? Definitions matter here.  

  The user expects to dislike one outcome. My bet: the food truck in the private lot. Textually, it's likely not banned (since not on public land), but their instinct might be to ban it because it causes sidewalk issues. The procedure should force textualism here unless purpose overrides—but that requires admitting subjectivity.  

  Procedure design priorities:  
  1. Start simple (literal meaning).  
  2. Use canons sparingly (only for ambiguity).  
  3. Escalate policy/value judgments.  
  4. For each step, note the theory behind it and alternatives (e.g., "Step 2 checks purpose—if you were an intentionalist, you'd look at meeting minutes instead").  
  5. Keep language blunt: "If yes, covered. If no, next question."  

  Finally, testing on cases:  
  - Case one (food truck in lot): Textually not covered (private property), but purpose might say escalate.  
  - Case two (ice cream truck): Ambiguous on "parked"—likely not covered if moving, but check definitions.  
  - Case three (water seller): Clear—no vehicle, not covered.  

  Biggest simplification sacrifice: Deep intent research (no time for archives). Acceptable loss—clerks can’t do that. The "gut" parts: judging "absurdity" or "major purpose." Flag those as escalation points.
answer: |-
  Here's a streamlined decision procedure (1-page max) that balances textual clarity with philosophical honesty, followed by your three cases. The hard lines emerge in **vehicle presence**, **"parked" vs. moving**, and **location boundaries**. We must preserve these distinctions to avoid rewriting the ordinance.

  ---

  ### **Ordinance Interpretation Procedure for Staff**  
  *Use this sequence for "Is [activity] covered by [ordinance]?"*

  1.  **LITERAL TEXT CHECK**  
      *Question:* Does the activity *exactly* match the words used? (e.g., "vehicle," "parked," "public street/sidewalk").  
      *Sufficient Answer:* "Yes" → **Covered**. "No" → Go to Step 2.  
      *Theory:* **Textualism**. Words are given ordinary meaning.  
      *Rival View (Intentionalism):* Skip this step—drafters might have meant "all mobile vendors," even if words say "vehicle."  
      *Your Gut Risk:* Overlooking flexible modern meanings (e.g., "vehicle" = e-bike?).

  2.  **PURPOSE CHECK**  
      *Question:* Would applying the text literally *defeat the obvious main purpose* of the law? (e.g., If the purpose is "reduce sidewalk congestion," banning bikes but allowing carts is absurd).  
      *Sufficient Answer:* "Yes, absurd" → **Not Covered** (if literal text conflicts) or **Covered** (if purpose broadens). "No" → Go to Step 3.  
      *Theory:* **Purposivism** (Mischief Rule/Absurdity Doctrine).  
      *Rival View (Textualism):* Ignore purpose—words rule even if outcome seems irrational.  
      *Your Gut Risk:* Confusing "this seems dumb" with genuine absurdity.

  3.  **SCOPE CHECK** (Using Canons)  
      *Question:* Does the activity fit the *category* implied by listed examples?  
      *Tools:*  
      - *Ejusdem generis:* "Other merchandise" = food/beverage-like items? (e.g., water yes; phone chargers no).  
      - *Expressio unius:* "Special events" are the *only* exception → no other excuses.  
      *Sufficient Answer:* Clearly in/out → **Covered/Not Covered**. Unclear → **ESCALATE TO LAWYER**.  
      *Theory:* **Contextual Textualism**. Words gain meaning from surrounding text.  
      *Rival View (Intentionalism):* Ask "What did drafters *think* 'merchandise' included?" (e.g., 1974 mindset vs. today).  
      *Your Gut Risk:* Stretching categories for "fairness."

  4.  **BOUNDARY CHECK**  
      *Question:* Is this activity in a "gray zone" the drafters *couldn’t have imagined*? (e.g., app-based sales, drone delivery).  
      *Sufficient Answer:* "Yes" → **ESCALATE TO LAWYER** (policy choice needed). "No" → Go to Step 5.  
      *Theory:* **Dynamic Interpretation**. Applying old text to new realities requires value judgments.  
      *Rival View (Originalism):* If drafters didn’t conceive of it, it’s **Not Covered**.  

  5.  **FINAL DEFAULT**  
      *Question:* After Steps 1-4, is doubt still unresolved?  
      *Sufficient Answer:* **Not Covered** (If the text doesn’t clearly prohibit it, it’s allowed).  
      *Theory:* **Rule of Lenity** (ambiguity favors the citizen).  
      *Rival View (Purposivism):* Favor the outcome that best advances the law’s goal.  

  ---

  ### **Applied to Your Cases**  
  *Ordinance:* "Sell/offer for sale food/beverage/merchandise from a vehicle **parked** on **public street/sidewalk** in Downtown Overlay, except permitted special events."  

  **Case 1: Food Truck in Private Lot (Customers on Sidewalk)**  
  - Step 1: Literal Text → Vehicle? **Yes**. Parked? **Yes**. Public street/sidewalk? **No** (private lot). → **Not Covered**.  
  - Step 2: Purpose → If purpose is "prevent sidewalk obstruction," customers on sidewalk *might* trigger intent. But text location is clear → **No absurdity**.  
  - Result: **Not Covered** (even if your gut hates it). *Escalate only if purpose is formally documented as "sidewalk access," not "public land use."*  

  **Case 2: Slow-Moving Ice Cream Truck (Engine Running)**  
  - Step 1: Literal Text → Vehicle? **Yes**. **Parked**? Unclear (engine on, brief stops). "Parked" usually implies intent to station. → **Ambiguous**.  
  - Step 3: Scope → *Expressio unius*: No "moving vehicle" exception → likely **Covered**. *Ejusdem generis*: Ice cream = food.  
  - Result: **Covered** (if stops are >1-2 mins). *If stops are fleeting (e.g., <60 sec), argue not "parked" → Not Covered.*  

  **Case 3: Water Bottles on Card Table (No Vehicle)**  
  - Step 1: Literal Text → **Vehicle? No**. → **Not Covered**.  
  - Step 2: Purpose → If purpose is "pedestrian safety," card tables cause similar risks. BUT absurdity test requires *textual* conflict (no vehicle = no conflict). → **No override**.  
  - Result: **Not Covered** (despite policy concerns). *Requires new ordinance.*  

  ---

  **Why You’ll Hate Case 1**  
  Textualism prioritizes the location ("public street/sidewalk") over the activity’s secondary impact (customers crowding sidewalks). Your instinct to "split the difference" is purposivism—but without clear legislative history of that purpose, the text controls. To prohibit Case 1, amend the ordinance to cover "sales attracting public sidewalk use."  

  **Key Simplifications**  
  - Ignored deep historical intent (no time for 1974 council minutes).  
  - "Purpose" at Step 2 requires *obvious* absurdity (e.g., allowing tanks but banning bikes), not debatable policy.  
  - Canons (Step 3) are limited to 2 tools—avoided niche canons like *noscitur a sociis*.  

  This procedure forces clarity: if the text is narrow, it doesn’t stretch—but flags where policy updates are needed (Step 4).
