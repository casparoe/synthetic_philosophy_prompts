prompt: |-
  For about a year now, a cognitive science reading group I'm in has been circling a single question — whether the brain is a computer — without ever quite managing to have the argument we keep meaning to have, and I've started to suspect that we are not disagreeing about the thing we think we are. The literalists hold that the brain implements computations over representations, that this is a substantive and empirically evaluable claim about neural machinery, and that "the brain is a computer" stands to neuroscience roughly as "the heart is a pump" stands to cardiology: a level of description that carves the system at its joints. The dynamical and embodied contingent hold that the brain is better described as a continuous, coupled, non-representational dynamical system, and that computational vocabulary smuggles in commitments the system doesn't honour — discrete states, stored rules, symbols, a clean separation of program from hardware. A third group, which I find hardest to place, insists the whole dispute is close to empty: under a permissive enough account of implementation any physical system implements some computation or other, so the claim is either trivial or only as good as whatever constraints you impose on what makes this system implement *this* computation rather than *that* one — as someone in the group put it, under a loose account a bucket of water implements every finite-state machine, and under a strict account nobody has yet produced one that excludes the bucket while admitting the brain. A fourth group treats the computational description as a modelling stance we adopt for convenience, with no ontological stake either way. Every argument anyone raises gets a competent reply, and we have settled precisely nothing.

  What I want from you is not a verdict on whether the brain is a computer but a diagnosis of the disagreement itself. Is this at bottom a verbal dispute that would dissolve once we fixed what "compute" and "implement" mean, or are the parties genuinely disagreeing about something? Are the literalists and the dynamicists answering different questions under a single heading — one about whether a certain mathematical description can be applied to the system at all, another about whether applying it does any explanatory work — and does the dispute change character depending on which of the usual levels we are at (a task-level characterization of what the system computes, an algorithmic description of how, or a claim about the implementing machinery)? Is there a hidden empirical question doing the work, namely whether the computational description buys predictive or explanatory traction that the dynamical one does not, or vice versa, and would anyone accept a benchmark that settled it? Or is there a hidden formal question — whether a principled, non-trivial account of implementation exists that survives the triviality worry, and if it does not, which side that actually damages? My working hypothesis is that the literalist and the trivialist are each right about their own question, that the two questions are being run together, and that the dispute only becomes interesting once someone specifies what the computational description is supposed to explain — but I would like you to test that hypothesis against what each side actually claims rather than simply agreeing with me, and to say plainly if you think my framing is the thing that's confused.

  Finally, tell me what would count as progress given your diagnosis. A formal constraint on implementation that is neither vacuous nor gerrymandered? An agreed explanatory benchmark? A distinction between the descriptive claim (the system can be so described) and the explanatory claim (the description earns its keep), with the observation that only the second is worth fighting over? A concession that the dynamical and computational descriptions are intertranslatable in the cases that matter and that the real dispute is about which is fundamental? Or an argument that the question is ill-posed and should be replaced by a better one — and if so, by what? I am not after a bibliography or a survey of the positions; I know who says what. I want the structure of the impasse and the shape of a way out of it.
reasoning: |-
  Okay, the user is part of a cognitive science reading group that's been stuck for a year debating whether the brain is a computer. There are four main positions: literalists who think the brain computes over representations, dynamicists who see it as a continuous dynamical system, trivialists who think any physical system computes something, and instrumentalists who see computation as just a useful model. The user suspects they might be talking past each other and wants a diagnosis of the disagreement, not a verdict.

  First, I need to unpack the core of each stance. The literalists seem to focus on neural mechanisms actually performing computations. The dynamicists emphasize continuous, embodied processes without symbolic representations. The trivialists argue that without strict criteria, any system computes, making the claim meaningless. The instrumentalists avoid ontology, treating computation as a tool.

  The user's hypothesis is that literalists and trivialists are each right about different questions—descriptive possibility vs. explanatory value. But they want me to test this against each side's claims. So, I need to see if the disagreement is verbal or substantive. Terms like "computation" and "implementation" might be ambiguous. For example, trivialists use a broad definition where a bucket of water implements any finite-state machine, while literalists require specific constraints like causal structure.

  Looking at levels of analysis might help. Marr's levels (computational, algorithmic, implementational) could clarify where each group is coming from. Literalists might be at the algorithmic level, dynamicists at implementational, trivialists questioning the mapping between levels. But do they engage with the same level? If not, they're talking past each other.

  The explanatory benchmark is another angle. Is the dispute empirical? If computational models predict better than dynamical ones, that's a point for literalists. But maybe they're complementary. The user mentioned a hidden formal question about non-trivial implementation criteria. Is there a principled way to distinguish the brain from a bucket? If not, trivialists win, but if such criteria exist (e.g., structural isomorphism, causal organization), literalists have ground.

  The user's framing might conflate descriptive and explanatory claims. Saying the brain *can* be seen as computing is trivial, but whether that explains cognition is key. Dynamicists argue computational descriptions don't capture embodied aspects. So, shifting focus to explanatory power could resolve some confusion. Also, intertranslatability—if models are equivalent, the choice is pragmatic, not fundamental. But literalists might insist on primacy.

  To find a way out, formal constraints on implementation are needed. Criteria like semantic content, causal structure, or multiple realizability could exclude buckets. Agreeing on what predictions each model must make (e.g., neural spike timing) could test them. Or distinguishing when computational vs. dynamical frameworks are more fruitful. Conceding that both are tools but debating which is more fundamental might reframe the issue. Alternatively, replacing the question with how computation is implemented in biological systems, focusing on mechanisms.
answer: |-
  Your diagnosis is perceptive: the core impasse stems from conflating **three distinct questions** that different factions are answering under the same banner. The literalists, dynamicists, trivialists, and instrumentalists aren’t merely disagreeing—they’re operating in separate conceptual territories. Below, I dissect the structure of the dispute, test your hypothesis, and propose a path forward.

  ---

  ### **1. The Three Hidden Questions Driving the Dispute**
  The parties are entangled because "Is the brain a computer?" collapses three independent issues:

  - **Q1 (Descriptive Possibility):** *Can* neural processes be *formally described* as computations?  
    (Trivialists answer "yes, trivially"; literalists agree but insist on specificity; instrumentalists shrug.)

  - **Q2 (Explanatory Adequacy):** Does a computational description provide *unique predictive/explanatory traction* over dynamical alternatives?  
    (Literalists say "yes"; dynamicists say "no, it obscures continuity/embodiment"; instrumentalists say "it depends".)

  - **Q3 (Ontological Commitment):** Are computations/representations *real, causally potent features* of neural machinery?  
    (Literalists say "yes"; dynamicists say "no"; trivialists/instrumentalists reject the premise.)

  Your hypothesis holds: **Literalists and trivialists are each correct about Q1 but talking past Q2/Q3**, while dynamicists treat Q2/Q3 as primary and dismiss Q1 as irrelevant. The "dispute" persists because no faction acknowledges these distinct layers.

  ---

  ### **2. Why the Disagreement Isn’t (Just) Verbal**
  - **"Compute" and "implement" are genuinely ambiguous**, but fixing definitions won’t resolve the core clash. Even with precise terms (e.g., "computation = rule-governed manipulation of discrete symbols"), disagreements persist:  
    - Dynamicists deny symbols exist in the brain *at all* (Q3), regardless of definitions.  
    - Literalists argue that *specific* computations (e.g., predictive coding) are empirically detectable (Q2).  
    - Trivialists reject that "implementation" can be non-arbitrary (Q1).  
  - **The levels of analysis problem exacerbates this**:  
    - At Marr’s *computational level* (task goals), the brain computes—e.g., depth perception *is* stereo matching.  
    - At the *algorithmic level* (processes), dynamicists contest whether discrete steps exist.  
    - At the *implementational level* (hardware), trivialists note all physics "implements" some computation.  
    **Literalists** jump from computational to implementational levels; **dynamicists** fuse algorithmic/implementational; **trivialists** collapse all levels into physics.

  ---

  ### **3. The Hidden Empirical/Formal Stakes**
  - **The empirical crux**: Does framing neural activity as computation (e.g., spiking neurons as Bayesian inference) yield **novel predictions** dynamical models miss? *Example*: If a computational model predicts *why* certain neural circuits fail in dyslexia, while a dynamical model only describes *how* oscillations change, computation gains ground.  
  - **The formal crux**: Is there a **non-gerrymandered criterion** for implementation? Literalists point to:  
    - *Structural isomorphism* (e.g., retinal circuits mirror edge-detection algorithms),  
    - *Causal organization* (neural states evolve via rule-like transitions),  
    - *Semantic content* (activity represents external states).  
    But trivialists retort: these are still observer-dependent. **This damages literalists most**—if implementation criteria are arbitrary, their ontological claims (Q3) weaken.

  ---

  ### **4. Testing Your Hypothesis Against the Factions**
  - **Literalists**: They conflate Q1 and Q3. They claim empirical evidence (e.g., neural decoding) proves computation is "real" (Q3), but trivialists correctly note this only shows *descriptive utility* (Q1/Q2).  
  - **Dynamicists**: They reject Q1 as irrelevant and focus on Q2: e.g., "Computational models fail to explain smooth, context-sensitive motor control." Their valid point is obscured by attacking Q1.  
  - **Trivialists**: They collapse Q1–Q3 into a single, vacuous claim. But they ignore that *explanatory traction* (Q2) requires constraints beyond formal possibility.  
  - **Your framing isn’t confused—it’s essential**. The factions *are* answering different questions, but the conflation is mutual: literalists mistakenly believe dynamicists deny Q1; dynamicists think literalists are committed to Cartesian symbols.

  ---

  ### **5. The Shape of Progress: A Way Out**
  Resolution requires **disentangling the three questions** and **shifting focus to explanatory benchmarks**. Concretely:

  #### **A. Formal/Conceptual Progress**
  - **Adopt a constrained theory of implementation**: Require:  
    (1) *Causal specificity*: Physical states must map non-arbitrarily to computational states (e.g., neuron spikes *cause* symbol updates).  
    (2) *Counterfactual robustness*: Perturbing the system alters outputs predictably per computational rules.  
    (3) *Multiple realizability*: The same computation runs on diverse hardware.  
    **→ This excludes buckets (no causal specificity) but admits brains if criteria hold.**

  - **Clarify the descriptive/explanatory divide**: Distinguish:  
    - *Weak claim*: "Brains can *be described* computationally" (Q1; trivialists win).  
    - *Strong claim*: "Computation *explains* cognition better than alternatives" (Q2; literalists vs. dynamicists).  
    **→ Only the strong claim is worth debating.**

  #### **B. Empirical Progress**
  - **Set an explanatory benchmark**: Agree on a cognitive phenomenon (e.g., decision-making) and test:  
    - Does a computational model predict *unobserved* neural/behavioral data?  
    - Does a dynamical model better explain *real-time adaptability*?  
    **→ If computational models uniquely predict *errors* (e.g., illusions), they gain traction.**  
    - *Crucially*: Accept that some phenomena may require hybrid models (e.g., discrete symbol manipulation atop continuous dynamics).

  #### **C. Reframe the Question**
  Replace "Is the brain a computer?" with:  
  **"Under what conditions, and for which cognitive processes, does a computational description provide *explanatory added value* over non-representational dynamical models?"**  
  - This:  
    (1) Preserves literalists’ emphasis on representation,  
    (2) Lets dynamicists argue for non-computational explanations where apt,  
    (3) Forces trivialists/instrumentalists to engage with empirical stakes.  

  ---

  ### **Conclusion: The Path Forward**
  Your group’s stalemate arises from a category error: treating a multifaceted problem as monolithic. **Progress requires three steps**:  
  1. **Formally separate** the questions of descriptive possibility, explanatory power, and ontology.  
  2. **Demand empirical benchmarks**: If computational models predict better/fail worse than dynamical ones, the dispute resolves pragmatically.  
  3. **Adopt a constrained implementation theory** to exclude triviality (e.g., causal specificity + counterfactuals).  

  Until then, the factions will keep orbiting one another—literalists defending Q3, dynamicists attacking Q2, and trivialists dissolving Q1—without ever truly meeting. The way out isn’t consensus on "what the brain is," but **clarity on what explanations we expect from our theories**. That’s the argument you *should* be having.
