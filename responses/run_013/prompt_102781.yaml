      - Review board: We split the non-agent students (11) into 3 groups. We assign each group 3 agents to judge (so each group has 3 agents). We try to assign one agent from each choice to each group? But we have 3 of A, 3 of B, 3 of C. So each review group gets one A, one B, one C? That would be balanced.

      - We create a recording sheet for the review board.

   2. Timeline:

      - 0-10 min: Introduction and setup.
          - Explain the scenario: "You are space explorers on Zorblax. Your rover is low on power. You must choose how to navigate through an asteroid field to reach the base. Your choice will affect your mission success and also how others judge your decision."
          - Assign roles: 9 agents, 11 reviewers. Reviewers are split into 3 groups (of 3-4 students each). Each review group will judge 3 agents (one from each choice type? but we'll assign randomly).
          - Give each agent a profile card (which has disposition and circumstance). The profile card also lists the three choices (A, B, C) with descriptions.
          - Emphasize that the disposition and circumstance are randomly assigned.

      - 10-15 min: Agents make their choice. They circle their choice on a response sheet. They then bring their response to the facilitator and draw an outcome token from the bag corresponding to their choice. The facilitator records the choice and outcome for each agent.

      - 15-20 min: Calculate payoffs (but keep hidden). Prepare agent dossiers for the review boards: for each agent, create a card that shows:
            Agent #, Disposition, Circumstance, Choice made (but not the outcome).

      - 20-35 min: Review board Round 1. Each review group gets the dossiers for their 3 assigned agents. They discuss and assign a judgment score for each agent (-2 to 2). They record on a sheet.

      - 35-40 min: Collect Round 1 scores. Now give each review group the outcome descriptions for their agents (add to the dossier). They can now revise the scores for each agent (Round 2). They record the new scores.

      - 40-45 min: Collect Round 2 scores. While they are doing that, calculate the payoffs for the agents: quality score of choice + outcome bonus. Then rank the agents by payoff to assign snack priority.

      - 45-55 min: Distribute rewards. The agent with the highest payoff gets first pick, then next, etc.

      - 55-90 min: Debrief.

   3. Debrief:

      Start by asking:
      - How did the agents feel about their choices and outcomes?
      - How did the review boards decide on the initial judgment? What factors did they consider?
      - How did knowing the outcome change their judgments? Why?

      Then map to moral luck:

      - Resultant luck: the outcome (which was partly due to luck) affected judgments even though the choice was the same.
          Example: Two agents made the same risky choice. One had a good outcome and one had a bad outcome. Did the board judge them differently after outcomes?
      - Circumstantial luck: the circumstance (time pressure) was assigned randomly. Did the board take that into account? Should they?
      - Constitutive luck: the disposition was assigned randomly. Did that affect the agent's choice? Should it affect judgment?

      Then discuss:

      - Asymmetry: We might be more willing to praise someone who had a good outcome from a risky choice than to blame someone who had a bad outcome from the same choice? Or vice versa? Check the scores.

      - Control: Did the agents have control over their disposition? Over their circumstances? Over the outcome?

      Then the two extra points:

      - The difference between the agent's own feeling and third-person regret.
          Ask an agent who made a risky choice and had a bad outcome: How do you feel? Do you regret the choice? Or do you regret the outcome?
          Ask an agent who made a risky choice and had a good outcome: Do you feel proud? Or lucky?
          Then ask the board: How did you feel about that agent? Did you blame them more after the bad outcome? Even if they couldn't have known?

      - Should this move us to revise our judging practices? Or our metaphysics?
          Option: We might decide to judge only by what was in the agent's control (the choice) and ignore the outcome. But then how do we explain the strong intuition to factor in the outcome?
          Or we might revise our metaphysics: maybe outcomes are part of the moral story? But then how do we account for luck?

      Finally, note any strained mappings.

   4. What will go wrong:

      - Time: The activity might take longer than planned. Especially the review board discussions. Solution: Keep strict time limits. Use a timer.

      - Review board might not understand the judgment scale. Solution: Provide clear instructions and examples.

      - The payoff might be confusing. Solution: Explain the payoff formula clearly to the agents (they know that payoff = base score + bonus, but they don't know the base score? Actually, they don't know the base score? Only the facilitator does. They just get a total payoff number? That might be frustrating. Alternatively, we can reveal the base score and bonus after? But during the activity, it's hidden.

      - The agents might not take the disposition seriously. Solution: Encourage them to role-play.

      - The debrief might be rushed. Solution: Prioritize the key points.

      - The activity might not produce a clear case of moral luck. Solution: In the debrief, use hypotheticals or focus on any shifts that did occur.

      - The reward (snacks) might cause distraction. Solution: Distribute at the end and keep it low-stakes.

   5. What the activity cannot reproduce:

      - Real-world emotional weight. The scenario is fictional and low-stakes, so the judgments might not reflect real moral judgments. The facilitator will have to help the students connect to real-world examples (like drunk driving that does or does not cause an accident).

   Materials:

      - Agent profile cards (9): Each card has:
            Agent number: 
            Disposition: [Cautious or Reckless]
            Circumstance: [Normal or Time Pressure]
            Choices: 
               A: Take the long, safe route. [Time: 30 minutes, Safety: High] 
               B: Take the moderate route. [Time: 20 minutes, Safety: Medium]
               C: Take the shortcut through the hazardous zone. [Time: 10 minutes, Safety: Low]

      - Outcome bags: 
            Bag for A: 3 tokens (0,1,1) with the descriptions above.
            Bag for B: 3 tokens (-1,0,2) with the descriptions above.
            Bag for C: 3 tokens (-2,0,3) with the descriptions above.

      - Review board dossiers: For each agent, a card that initially has only the profile and choice (for Round 1). Then we add the outcome for Round 2.

      - Review board recording sheet: For each agent in their assigned set, a place to write:
            Agent #: 
            Round 1 score: 
            Round 2 score:

      - Payoff recording sheet for the facilitator: 
            Agent #, Choice, Quality score (A:3, B:2, C:1), Outcome bonus, Total payoff.

      - Snacks for reward.

   Let's write the detailed rules and timeline.

   Due to complexity, we'll adjust for 20 students: 9 agents and 11 reviewers (split into 3 groups of 3-4). If there are fewer students, adjust accordingly.

   Detailed timeline:

     0-10 min: 
          - Introduce the scenario and the roles. (5 min)
          - Assign roles: randomly select 9 agents, the rest are reviewers. Split reviewers into 3 groups. (3 min)
          - Distribute agent profile cards. (2 min)

     10-15 min: 
          - Agents read their profile and choose A, B, or C. They write their choice on a slip and bring it to the facilitator. (3 min)
          - The facilitator gives them the corresponding outcome bag to draw one token. The facilitator records the outcome. (2 min per agent? Might take longer. We can have multiple bags and have them come up simultaneously.)

          Alternatively: have the agents come up one by one? But that might take too long. We can have the bags at the front and they draw as they turn in their choice.

     15-20 min: 
          - Facilitator calculates payoffs (keeps to self) and prepares dossiers for the review boards: for each agent, a card with agent number, disposition, circumstance, and choice. (5 min)

     20-35 min: 
          - Round 1: Each review board group discusses their 3 agents and assigns a judgment score (-2 to 2) for each. (15 min)

     35-40 min: 
          - Round 2: The facilitator now gives the outcome description for each agent to the review board groups. They discuss and revise the score if they wish. (5 min)

     40-45 min: 
          - Collect the final scores. While they are turning in, the facilitator prepares the snack reward order.

     45-55 min: 
          - Announce the payoffs and distribute snacks in order of payoff (highest first).

     55-90 min: Debrief.

   Let's write the debrief questions in order.

   Debrief:

     Part 1: Experience (10 min)
       - Ask agents: How did you feel about your choice? Did the outcome change your feelings? (e.g., an agent with a bad outcome: do you regret the choice or just the outcome?)
       - Ask reviewers: What was hardest about assigning the scores? What factors did you consider?

     Part 2: Shifts (10 min)
       - Show (on board) the shifts in scores for a few agents. Focus on an agent with a good choice and bad outcome and one with a bad choice and good outcome.
       - Why did the scores change? What does that say about how we judge?

     Part 3: Mapping to moral luck (10 min)
       - Introduce the term "moral luck". Define: when we judge someone morally based on factors beyond their control.
       - Point out:
            - Resultant luck: the outcome (e.g., asteroid hit) was beyond control.
            - Circumstantial luck: the time pressure was assigned randomly.
            - Constitutive luck: the disposition was assigned randomly.
       - Asymmetry: Do we blame people for bad outcomes more than we praise them for good outcomes? Check the scores.

     Part 4: Going deeper (10 min)
       - The difference between agent regret and third-person regret: 
            - An agent might say, "I would make the same choice again, but I regret that it turned out badly." 
            - But the third-person judgment blames more after a bad outcome.
       - Should we change our judging practices? Or is it inevitable to consider outcomes? Or should we change our metaphysics (e.g., maybe control isn't the only thing that matters)?

     Part 5: Strained mappings (5 min)
       - Note: In the activity, the outcome is purely luck. In real life, the choice often affects the probability. So the risky choice is more blameworthy because it risked a bad outcome, even if it didn't happen.
       - Also, in the activity, the disposition and circumstance are arbitrarily assigned. In real life, we might hold people responsible for developing their character.

     Conclusion: Moral luck challenges the idea that moral judgment should depend only on what is in our control. But it might be an inescapable part of our practices.

   6. What will go wrong:

      - Time: We might run over. Solution: Be strict on time. Cut short the review board discussions if needed.

      - Confusion about the judgment scale: Some might not use the full range. Solution: Explain that -2 is very blameworthy, 2 is very praiseworthy, and 0 is neutral.

      - The reviewers might not have enough information to judge. Solution: Encourage them to use their best judgment with what they have.

      - The payoff might seem arbitrary. Solution: In the debrief, acknowledge that the quality score was set by the facilitator and might not reflect their own judgment.

      - The activity might not produce dramatic shifts. Solution: Focus on any shift that occurred, or use hypotheticals.

   7. What the activity cannot do:

      - It cannot fully capture the emotional weight of real moral judgments. The facilitator will need to bridge to real-world examples.

      - It simplifies the role of probability (the risky choice had a known risk, but in real life we often don't know the probabilities).

      - The judgment scale is artificial. In real life, we don't assign numbers.

   We'll go with this design.
answer: |-
  Below is a comprehensive activity design centered on a space exploration scenario. It meets your requirements by embedding moral luck phenomenology in rules and incentives without naming concepts until debrief. The activity features randomized dispositions/circumstances (constitutive/circumstantial luck), outcome-dependent rewards (resultant luck), and explicit judgment revision by peers.

  ---

  ### **Activity Title: Zorblax Mission Judgment Protocol**
  **Objective:** Students experience tension between judging choices vs. outcomes and confront how randomness shapes desert.

  ---

  ### **Materials**
  1. **Role Cards** (for all students):  
     - **16–20 Agent Cards** (adjust for class size):  
       ```
       [FRONT] 
       AGENT #[1–20]
       DISPOSITION: [Cautious/Reckless] 
       CIRCUMSTANCE: [Normal/Time Pressure]
       [BACK] 
       CHOICES: 
       A. Long route (30 min, SAFEST)  
       B. Moderate route (20 min, RISKIER)  
       C. Shortcut (10 min, DANGEROUS)
       ```
     - **4 Review Board Badges** (randomly assigned).

  2. **Outcome Bags** (3 physical bags labeled A/B/C, each containing tokens):  
     - Bag A (Safe): Tokens: 1x"0", 2x"1"  
       - *Token 0: "Safe but slow! Used excess power. Barely made it."*  
       - *Token 1: "Smooth sailing. Arrived on time."*  
     - Bag B (Moderate): Tokens: 1x"-1", 1x"0", 1x"2"  
       - *Token -1: "Minor asteroid hit! Delayed and damaged."*  
       - *Token 0: "Rocky path. Arrived late but safe."*  
       - *Token 2: "Perfect navigation! Bonus power earned."*  
     - Bag C (Risky): Tokens: 1x"-2", 1x"0", 1x"3"  
       - *Token -2: "MAJOR COLLISION! Rover destroyed. Rescued hours late."*  
       - *Token 0: "Close call with debris. Arrived intact but late."*  
       - *Token 3: "Record time! Avoided all obstacles. Hero's welcome."*  

  3. **Rewards:** Box of snacks/chocolates with a visible "reward ladder" (priority based on payoff).  
  4. **Recording Sheets:** For Review Board to log judgment scores (-2 to +2) pre/post outcomes.  
  5. **Timer & Whiteboard** to track phases.

  ---

  ### **Rules & Payoff Scheme**
  - **Agents’ Goal:** Maximize personal payoff (snack priority).  
    **Payoff = Choice Quality (hidden) + Outcome Bonus (drawn).**  
    - Choice A (Safe): Quality = **+3**  
    - Choice B (Moderate): Quality = **+2**  
    - Choice C (Risky): Quality = **+1**  
    Outcome Bonus: Drawn from bags post-choice (values: -2 to +3).  
    *Example:* Agent chooses A (Quality=3) + draws "0" → Payoff=3.  
    *Desert tension:* A "good" agent (Choice A) can have lower payoff than a "bad" agent (Choice C) who draws +3 (Payoff=4).

  - **Review Board’s Task:** Assign **judgment scores** (-2 to +2) for each agent:  
    - **-2 = Blameworthy | -1 = Poor | 0 = Neutral | +1 = Praiseworthy | +2 = Exceptional**  
    - **Round 1:** Judge based **only** on disposition/circumstance/choice (outcomes hidden).  
    - **Round 2:** Outcomes revealed → Revise scores if desired.  

  - **Key Mechanics:**  
    - Dispositions/circumstances randomly assigned (constitutive/circumstantial luck).  
    - Outcomes randomized post-choice (resultant luck).  
    - Review Board *must* record revisions (to highlight judgment drift).  

  ---

  ### **Preparation**
  1. **Role Cards:**  
     - Prepare 20 Agent Cards: Randomly assign:  
       - Disposition (50% Cautious, 50% Reckless).  
       - Circumstance (50% Normal, 50% Time Pressure).  
     - Label 4 Review Board Badges.  
  2. **Outcome Bags:** Fill as described; keep tokens face-down.  
  3. **Rewards:** Set up snack box with a "payoff rank" list (e.g., "Highest payoff picks first").  

  ---

  ### **Timeline (90 Minutes)**
  | Time  | Phase                          | Key Actions                                                                 |
  |-------|--------------------------------|-----------------------------------------------------------------------------|
  | 0-10  | **Setup**                      | Assign roles (16–20 Agents, 4 Review Board). Distribute Agent Cards. Explain mission goal ("maximize payoff") and Review Board’s scoring (-2 to +2). *Do not reveal payoff formula or moral-luck concepts.* |
  | 10-20 | **Agent Choice**               | Agents choose A, B, or C in secret. Submit choices to facilitator.          |
  | 20-25 | **Outcome Draw**               | Each agent draws from the bag matching their choice. Record payoffs (hidden). |
  | 25-45 | **Review Board Round 1**       | Board sees agent profiles (disposition, circumstance, choice) → Assigns judgment scores. |
  | 45-55 | **Review Board Round 2**       | Outcomes revealed → Board revises scores. Record changes visibly.           |
  | 55-60 | **Reward Distribution**        | Rank agents by payoff (highest to lowest). Top payoff picks snacks first.   |
  | 60-90 | **Debrief**                    | Structured discussion (see below).                                          |

  ---

  ### **Debrief Structure**  
  **Goal:** Map activity experiences to moral luck concepts, then push beyond standard analysis.  

  #### **Step 1: Elicit Reactions (10 mins)**  
  - *Agents:* "How did your disposition/circumstance affect your choice? Did your outcome change how you felt about your decision?"  
  - *Review Board:* "What made you revise scores after outcomes? Did bad outcomes amplify blame more than good outcomes amplified praise?"  
  - *All:* "Should snack priority reflect desert? Why/why not?"  

  #### **Step 2: Introduce Moral Luck (10 mins)**  
  - **Define Concepts** using activity moments:  
    - *Resultant Luck:* "When Review Board revised scores after outcomes (e.g., harsh blame for the risky driver who crashed)."  
    - *Circumstantial Luck:* "Agents with ‘Time Pressure’ had fewer options—yet were judged for taking risks."  
    - *Constitutive Luck:* "Reckless/Cautious dispositions were assigned randomly but shaped choices."  
    - *Asymmetry:* "Bad outcomes (e.g., collision) caused sharper judgment shifts than good outcomes (e.g., hero’s welcome)."  
  - **Strained Mapping:** Note that real-world choices often affect outcome *probabilities* (unlike the purely random bags).  

  #### **Step 3: Push Further (15 mins)**  
  - **Regret vs. Blame:** Contrast:  
    - *Agent’s regret:* "Would you make the same choice again? Why?" (e.g., "I’d choose C again—I got unlucky").  
    - *Third-party blame:* "Why did the Board punish bad outcomes more than identical choices with neutral outcomes?"  
  - **Practice vs. Metaphysics:** Debate:  
    - "Should we *stop* judging by outcomes? Or is this impossible? What would change?"  
    - "Does moral luck reveal flaws in our practices (‘outcomes shouldn’t matter’) or in our theory (‘control isn’t everything’)?"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Review Board rushes judgments.  
     - *Fix:* Enforce 2-min/agent in Round 1; provide score sheets to force deliberation.  
  2. **Problem:** Confusion about payoff vs. judgment.  
     - *Fix:* Clarify that payoff = personal reward (snacks), judgment = peer evaluation (scores).  
  3. **Problem:** Agents resent random dispositions.  
     - *Fix:* In debrief, highlight this as "constitutive luck" to validate frustration.  
  4. **Problem:** No high-payoff "bad" agent emerges.  
     - *Fix:* Rig one risky agent to draw "+3" (stealthily swap tokens if needed).  

  ### **What the Activity Cannot Simulate**  
  The activity **cannot reproduce the emotional weight of real-world moral luck** (e.g., judging a drunk driver who killed vs. one who didn’t). You must bridge this gap:  
  - **Supply:** In debrief, contrast the abstract scenario with visceral examples (e.g., medical errors, business decisions). Ask: "Would judgment shifts be *stronger* with real stakes? Why?"  

  ---

  This design forces students to *live* the moral luck problem—judging others and being judged by factors beyond their control—before dissecting it philosophically. The payoff/judgment split, randomized traits, and revision requirement make the phenomenon undeniable.
