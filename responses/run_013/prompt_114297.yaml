answer: |-
  ## Workshop Q&A Prep Sheet

  **My thesis in four sentences:**
  Statutory interpretation involves two distinct stages. First, the "fixing stage" determines meaning solely through linguistic conventions at enactment time, excluding purpose. Second, if that meaning yields an intolerable outcome, the "remedial stage" allows departure under a "symmetry condition": the interpreter must formulate a general departure rule applicable even to statutes they despise. The textualism/purposivism debate is largely a category error masking a deeper conflict about who bears the burden of a bad outcome (regulated party, beneficiary, or court), with familiar maneuvers often being burden-shifting tactics.

  ---

  **The objections, ranked by damage**

  1.  **The "Fixing Stage" is a Fiction (Philosopher of Language)**
      *   **As they'll put it:** "You presuppose a clean separation between semantic meaning and pragmatic enrichment/purpose that simply doesn't exist in natural language. How can 'linguistic conventions' possibly 'fix' meaning without implicit appeal to context, speaker intent, or purpose? Your 'fixing stage' is incoherent – meaning *is* use, and use is inherently purposive and context-bound from the start."
      *   **My reply:** "I grant language is inherently pragmatic. The 'fixing stage' is a methodological construct, not a claim about psychological reality. It's a deliberate attempt to *isolate* the conventional semantic core *as best we can*, using tools like dictionaries, corpus linguistics, and syntactic structure, *before* introducing overt purposive considerations. The point is to make that step visible and contestable, not deny pragmatics exists."
      *   **Where it's soft:** Bluffing on having a robust, non-circular method for identifying the "conventional semantic core" entirely devoid of pragmatics. It *is* messy.

  2.  **Symmetry is Impossible/Irrelevant Burden-Shifting (Law & Econ)**
      *   **As they'll put it:** "Your symmetry condition imposes asymmetric error costs. Requiring a general rule *and* applying it to loathed statutes creates huge decision costs for judges and ignores the actual distribution of costs. The regulated party already bears the primary cost of textual uncertainty. Why shift burdens onto the court via this impractical symmetry test instead of minimizing *ex ante* uncertainty through clearer drafting incentives?"
      *   **My reply:** "Symmetry isn't about minimizing total error costs directly, but about ensuring remedial departures are principled and not outcome-driven. It forces candor about the *kind* of injustice being remedied. The burden shift isn't onto the court *per se*, but onto the *argument* for departure – demanding it be generalizable, exposing if it's really just favoring one party."
      *   **Where it's soft:** Weak on quantifying/balancing the specific error costs symmetry creates vs. prevents. Hand-waving on judicial workload impact.

  3.  **Two Stages = One Discretion with Extra Steps (Legal Realists)**
      *   **As they'll put it:** "You're just dressing up judicial policy choice in formalism. The 'fixing stage' is where the judge *chooses* which conventions matter, and the 'remedial stage' is where they *choose* what's 'intolerable' and how to 'fix' it. Your symmetry condition is just a fig leaf – judges will always distinguish the statute they love from the one they loathe. This just adds bureaucratic friction without constraining discretion."
      *   **My reply:** "The stages aim to *structure* and *expose* discretion, not eliminate it. Forcing the articulation of the fixed meaning *first* creates a benchmark. Symmetry forces justification *beyond* 'this outcome is bad here.' It makes the value judgment driving the departure explicit and demands consistency *in principle*, even if imperfect in practice."
      *   **Where it's soft:** Concedes that discretion remains pervasive. Hard to prove it meaningfully *constrains* a determined judge beyond making their reasoning slightly more transparent.

  4.  **"Plain Meaning" is an Anachronistic Mirage (Legal Historian)**
      *   **As they'll put it:** "Your 'linguistic conventions at enactment' ignores historical contingency. What seems 'plain' now wasn't then, and vice-versa. Applying late 20th-century linguistic intuitions to a 19th-century statute is precisely the problem you claim to avoid. Corpus linguistics databases are modern constructs. How do you authentically reconstruct *that* community's conventions without smuggling in purpose or context?"
      *   **My reply:** "This is a powerful challenge to *doing* the fixing stage well, not necessarily to the *concept*. It underscores the need for rigorous historical linguistics and contextual understanding *as part of fixing*, precisely to avoid presentism. The stage separation forces us to grapple with this reconstruction explicitly before moving to remedy."
      *   **Where it's soft:** Lacks a concrete, replicable methodology for reliable historical "fixing" that avoids the historian's critique. Relies on judges *trying* to be historical.

  5.  **Purposivism Isn't Just Burden-Shifting; It's Ontological (Textualist - Old School)**
      *   **As they'll put it:** "You reduce purposivism to mere burden allocation. But purposivists argue purpose *is* intrinsic to meaning from the outset – it's not a 'remedy' for bad text, it's the very essence of the communicative act. Your 'fixing stage' artificially amputates meaning. Legislative history isn't 'cheating' to shift burdens; it's evidence of the intended meaning, which *includes* purpose."
      *   **My reply:** "My point is that *in practice*, appeals to purpose often function precisely when the text, read conventionally, yields a result the interpreter dislikes. Framing it as burden allocation explains the *rhetorical* moves better than claiming purpose is always primary. It explains why purposivists don't *always* prioritize purpose over clear text when they like the outcome."
      *   **Where it's soft:** Downplays the ontological claim of purposivists. The reply focuses on pragmatics over philosophy.

  6.  **Corpus Settles Fixing; Your Stages Add Nothing (Textualist - Corpus)**
      *   **As they'll put it:** "With sufficient corpus data, we *can* objectively determine conventional meaning at enactment, rendering your 'remedial stage' largely unnecessary. Ambiguity is overblown. Your symmetry condition is redundant if the fixed meaning is clear. Why complicate things with an extra stage and a vague 'intolerability' test when the data gives us the answer?"
      *   **My reply:** "Corpus is a powerful tool *for* the fixing stage! But data has limits; collocations can be complex, corpora imperfect. More importantly, corpus data might *reveal* a clear, conventional meaning that *still* produces an outcome widely seen as absurd or unjust in *this specific application*. That's where the remedial stage and symmetry kick in."
      *   **Where it's soft:** If corpus truly *could* resolve most hard cases to everyone's satisfaction, the remedial stage becomes less compelling. Overstates the frequency of "absurd" outcomes from clear corpus meanings.

  7.  **Symmetry Paralyzes Necessary Judicial Correction (Legal Realist / Purposivist-Leaning)**
      *   **As they'll put it:** "Your symmetry condition is paralyzingly strict. Requiring a judge to honestly apply their remedial rule to a statute they 'loathe' ignores legitimate distinctions based on constitutional values, fundamental rights, or the specific evil a statute addresses. It forces judges to endorse hypothetical horrors, chilling necessary judicial intervention against genuinely harmful laws."
      *   **My reply:** "Symmetry tests the *rule*, not the *outcome*. The rule can incorporate constitutional constraints or fundamental values *explicitly*. The key is whether the *justification for departure* (e.g., 'avoid results violating due process') is applied consistently, not whether the judge likes the underlying statute. A rule grounded in constitutional avoidance *can* pass symmetry."
      *   **Where it's soft:** Judges might *claim* their rule is value-based but still find ways to avoid applying it symmetrically. Distinguishing "rule" from "outcome/statute" in practice is very hard.

  8.  **Ignores Institutional Choice & Democratic Legitimacy (Law & Econ / Textualist)**
      *   **As they'll put it:** "Your framework focuses narrowly on the judge's reasoning. But the core issue is *who decides*? Shifting burdens via your remedial stage is still judicial lawmaking. Shouldn't the burden *always* fall on the legislature to fix its own mistakes through new statutes, preserving democratic accountability, rather than inviting judges to craft 'remedial' rules under vague symmetry constraints?"
      *   **My reply:** "I agree legislative correction is best. But in the real world of costly legislation and rights at stake *now*, courts face pressure to act. The remedial stage *with symmetry* is a constrained safety valve, making judicial intervention more transparent and demanding a higher level of justification than pure discretion. It *acknowledges* the institutional tension."
      *   **Where it's soft:** Concedes judicial lawmaking is happening. Relies on "transparency" and "justification" as sufficient democratic safeguards, which many will dispute.

  ---

  **What I concede up front (~120 words):**
  I readily concede that the "fixing stage" is an idealization. Perfectly isolating historical linguistic convention from all pragmatic influence is likely impossible; it's a target we aim for, not a state we perfectly achieve. Judicial discretion permeates both stages – selecting conventions, defining "intolerable," formulating the rule. My framework doesn't eliminate it; it seeks to structure and expose it. The symmetry condition *is* demanding and potentially administratively costly. It might not prevent all bad-faith distinctions, but it raises the bar. Finally, while I reframe the debate, I don't claim this *resolves* the deep normative disagreements about the judicial role or democratic legitimacy underlying textualism and purposivism.

  ---

  **The one reply that has to land (~100 words):**
  **When challenged that burden-shifting misses the point of the textualism/purposivism debate:**
  "Consider *Church of the Holy Trinity*. The textualist objection isn't just that the Court found purpose, but *where it placed the burden*: the immigrant bore the cost of the text's apparent scope. The purposivist shift placed the burden on the *government* to show this particular contract fell within the statute's *purpose*. My claim is that arguing about 'meaning' often obscures this underlying fight over who loses when the words don't neatly fit. Seeing it as burden allocation explains why textualists resist 'absurdity' exceptions unless overwhelming – they place the burden firmly on the party seeking departure."

  ---

  **The question I'm hoping nobody asks (~80 words):**
  **"Can you give a concrete example of a remedial rule derived under your symmetry condition that a judge would *honestly* apply to a statute they politically or morally loathe, *and* that demonstrably constrained a departure they otherwise wanted to make?"**

  **Why it's dangerous:** It forces me to provide a real-world (or plausible hypothetical) example where the symmetry condition *actually* bit – where a judge wanted to make a remedial departure for good reason but was blocked *specifically* by the need to apply the same rule to a statute they detested. Demonstrating this operational impact is the hardest empirical sell.
