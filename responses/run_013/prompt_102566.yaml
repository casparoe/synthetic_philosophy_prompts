  ### Notes on the Tree  
  - **Unoccupied Leaf:** None. All combinations are covered or named.  
  - **Empty Combinations:**  
    - *Constitutive narrative without an author (Q3)*: Unoccupied. Requires narrative to shape the self with no authorial source, rendering it incoherent (how can an unauthored story constitute identity?).  
    - *Narrative as regulative ideal (Q4)*: Collapsed into **Expressive/Reportive**. Asking "Is narrative a regulative ideal?" directly violates constraints, but *Q4* cases implicitly exclude it: if narrative is non-constitutive *and* not expressive/reportive, the view reduces to eliminativism (handled in *Q5*).  
  - **Indistinguishable Leaves:**  
    - *Q7 leaves*: Distinctions within realism (communal/self/objective) are mutually exclusive and cover the logical space.  
  - **Diagnostic Coverage:**  
    - Creature in the present: *Q1*  
    - External editor: *Q2*  
    - Community biography + disowner: *Q3, Q7*  
    - One body, two stories: *Q5*  
    - Two bodies, one story: *Q6*  
    - Accurate but rejected narrative: *Q4*  
  - **Design Logic:**  
    - Order prioritizes necessity → role (constitutive/non) → author/individuation → unity.  
    - Prevents slogan-matching by anchoring questions in cases.  
    - 7 nodes, 8 leaves (within 6–9 range).  

