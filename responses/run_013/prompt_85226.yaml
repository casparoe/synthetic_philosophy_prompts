answer: |-
  Here's a complete, ready-to-run 50-minute activity for the statue/lump problem, designed to force students into the puzzle through hands-on bookkeeping. I've refined your apparatus for clarity, added safeguards, and included printable materials. The core tension (one object with two births/deaths) emerges reliably, and the debrief maps cleanly to standard metaphysical responses.

  ---

  ### **Materials (Cheap & Printable)**
  1. **Ledger Sheets** (1 per group):  
     [Print this 1-page PDF](https://example.com/placeholder-link) or use the table below. Each group needs one sheet with four quadrants (one per event).  
     ```markdown
     | Event | Object Name(s) | Location | Birth Event | Death Event | Notes |
     |-------|----------------|----------|------------|------------|-------|
     | 1     |                |          |            |            |       |
     | 2     |                |          |            |            |       |
     | 3     |                |          |            |            |       |
     | 4     |                |          |            |            |       |
     ```
     **Rules printed on sheet:**  
     - R1: No two distinct objects occupy the same region at the same time.  
     - R2: Birth/death events are fixed once recorded.  

  2. **Event Script** (1 for you):  
     ```plaintext
     EVENT 1 (t1): "A mass of clay is formed into a lump. It occupies Region R."
     EVENT 2 (t2): "The lump is shaped into a recognizable statue (e.g., a cat). It still occupies Region R."
     EVENT 3 (t3): "The statue is smashed into pieces, then re-formed into a different statue (e.g., a dog). It still occupies Region R."
     EVENT 4 (t4): "The new statue is flattened into a shapeless lump. It still occupies Region R."
     ```

  3. **Clay?**  
     **Skip it.** Handling clay in 6 groups of 3 will burn 15+ minutes on molding/cleanup, distract from the ledger, and risk mess (especially reshaping). **Alternative:** Project simple icons (■ for lump, 🐱 for cat statue) or sketch them on the board during events.

  ---

  ### **Timeline (50 Minutes Total)**
  - **0–5 min: Setup**  
    - Divide into 6 groups of 3. Give each group a ledger sheet.  
    - Brief: "You’re inventory clerks tracking objects in Region R. Rules: R1 (no co-location) and R2 (fixed birth/death). After each event I read, update your ledger. Decide as a group what exists *now*."  
    - **Critical:** Don’t define "object," "birth," or "death"—let them interpret.  

  - **5–20 min: Events 1 & 2**  
    - Read Event 1. Groups fill row 1 (e.g., "Lump," R, t1, – ).  
    - Read Event 2. **Pause 8–10 min.** Groups struggle: Adding "Statue" violates R1 (same region as "Lump"). Most collapse to one entry (e.g., "Statue" or "Lump-Statue") but now face two births (t1 and t2).  
    - **Stall Questions:**  
      - *"What’s in Region R right now? Can you name it?"*  
      - *"Did the lump disappear? If yes, when? If no, how does R1 apply?"*  
      - *"Does your entry’s birth event match when it *started* existing?"*  

  - **20–35 min: Events 3 & 4**  
    - Read Event 3. **Pause 7–8 min.** Groups with one entry now have "Statue" destroyed at t3 but "Lump" persists (birth t1)—contradicting R2 (one object can’t have two deaths). Some split into two objects (violating R1).  
    - Read Event 4. **Pause 5 min.** Squashing "kills" the statue but not the lump. Ledgers show logical explosions (e.g., one entry both dead and alive).  
    - **Stall Questions:**  
      - *"When the statue broke, did anything die? When was it born?"*  
      - *"Can your entry survive being flattened? Does it have the right birth event?"*  
      - *"Are you breaking R1 or R2 to make this work?"*  

  - **35–50 min: Debrief**  
    - Poll groups: "What broke in your ledger? R1 or R2?" Chart responses (e.g., 4 groups broke R1, 2 broke R2).  
    - **Map to the Puzzle & Standard Responses:**  
      | **Ledger Breakdown**      | **Metaphysical Problem**          | **Standard Response**          |  
      |---------------------------|-----------------------------------|--------------------------------|  
      | **Collapsed to 1 entry** (e.g., "Lump-Statue" with birth t1) | How can one thing have two persistence conditions? (Lump survives flattening, statue doesn’t). | *Constitution View*: Lump and statue are distinct but share matter; R1 is wrong. |  
      | **Split entries** (Lump + Statue co-located at t2/t3) | Violates R1—how can two objects occupy R? | *Co-location View*: Yes, they can (e.g., Baker’s constitution theory). |  
      | **Lump "dies" at t2**, Statue "born" at t2 | Lump’s persistence is intuitive—why did it "die"? | *Eliminativism*: Only the statue exists (lump is not an object). |  
      | **One entry with two births** (e.g., birth t1 *and* t2) | Violates R2—birth events aren’t fixed. | *Perdurantism*: Objects have temporal parts; "birth" is a misnomer. |  
    - **Key Insight:** The activity forces choice between R1 (anti-co-location) and R2 (fixed persistence conditions)—mirroring the real tension.  
    - **Reveal Terms:** "You’ve discovered the *problem of material constitution*. What you called R1 is co-location; R2 is persistence condition fixity."  

  ---

  ### **Predictable Problems & Fixes**
  1. **"Region R is too vague!"**  
     - Groups argue over "same region" during reshaping.  
     - **Fix:** Predefine R rigidly (e.g., "a 10cm × 10cm square—objects fully inside it").  

  2. **Groups avoid tension by renaming objects** (e.g., "Lump" → "Statue" at t2, same entry).  
     - **Fix:** Ask: *"Did the lump *cease* existing? Did the statue *start* existing? Record that."* Force them to mark deaths/births.  

  3. **One group dominates, others copy.**  
     - **Fix:** Assign roles: *"Recorder (writes), Skeptic (challenges), Mediator (decides)."*  

  4. **"Birth/death feels arbitrary!"**  
     - **Fix:** In debrief, clarify: "In metaphysics, ‘birth’ = coming into existence, ‘death’ = ceasing to exist."  

  ---

  ### **What the Activity Can’t Capture (Supply in Debrief)**  
  - **Modal Properties:** The activity tracks actual events, but the core puzzle involves *modal differences* (the lump *could* survive flattening; the statue *could not*). **Bridge it:** Ask, *"Could your ‘lump-statue’ entry survive Event 4? Why/why not?"* then explain modal properties as the hidden driver.  
  - **Nuance in Theories:** Perdurantism/endurantism require temporal parts vs. whole-object debates. **Supply post-activity:** "Some philosophers avoid your dilemma by saying objects have temporal stages—like a timeline of ‘time slices’."  

  ---

  This design ensures students *feel* the paradox (via ledger explosions) before labeling it. The script minimizes prep, and the debrief makes their struggle "click" with canonical solutions. Run it as-is, and you’ll have a memorable session!
