prompt: |-
  I'm an undergraduate in a second-year metaphysics course, and our instructor has assigned each of us one 50-minute session to run for the class of 18. Mine is on the statue and the lump of clay, and I want it to be an activity rather than a lecture: the group should walk into the problem through their own bookkeeping before I say the word constitution or mention any of the standard replies.

  Here is the apparatus I have in mind; keep its core, though you should fix the mechanics if they don't work. Groups of three maintain one inventory of everything that exists on a table. Each entry gets a name, a location, a birth event, and a death event. Two rules govern the ledger: no two distinct entries may occupy the same region at the same time, and once an entry has been assigned a birth event, that event stays with it. I then read a scripted sequence of events aloud — a mass of clay is formed, shaped into a figure, the figure is broken and re-formed into a different figure, and finally the mass is squashed flat — and the groups update the inventory after each event. What I'm hoping is that the first rule forces them to collapse the lump and the figure into a single entry at the moment of shaping, at which point that one entry has two birth events, and then the squash leaves it both dead and alive, so they have to decide which rule to give up and defend the choice.

  Give me the whole thing: materials (cheap and printable; tell me whether handling real clay is worth the mess in 50 minutes), the event script, the ledger sheet, a minute-by-minute timeline, the questions to use when a group stalls, and a debrief that maps each moment onto the parts of the puzzle and onto the standard families of response. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of the problem the activity cannot reproduce and that I will have to supply myself.
