prompt: |-
  OK I need you to actually rank these for me, not give me a "well, it depends" essay. Here's why it's personal: I live in a company town. One big employer, and the same company owns most of the rentals — I rent my apartment from them, my mom works at the plant, so when they jacked my rent 30% and started floating a wage freeze I ended up on both ends of the same fight. City council is now arguing about rent control and a minimum wage hike at the same time, and honestly I keep flip-flopping on which one I actually believe in, since the same company is on the far side of both.

  So: rank the ten things below from most to least defensable. By "defensable" I mean something a person who cares about total welfare *and* about the worst-off person in town could get behind without having to pretend one of those doesn't matter. Assume two things about my town: zoning makes new housing basically impossible to build, and the labor market is dominated by that one employer (nowhere realistic to jump ship to). Give me a real order, 1 through 10, no ties, one or two sentences on each, and tell me what's doing the work in your ranking.

  1. A flat rent freeze — rents stay where they are, no increases, no exceptions.
  2. Rent control tied to inflation, but with vacancy decontrol: when a tenant moves out, the landlord can reset to whatever the market will pay.
  3. Rent control that only covers buildings older than 15 years, so anything newly built is exempt.
  4. The city buys the companys housing outright and runs it as public housing, renting below cost.
  5. A $22/hr minimum wage for the town, phased in over three years.
  6. A wage board — the company has to sit down with a union and negotiate one wage floor that covers every employer in town.
  7. Skip the minimum wage entirely and expand the earned income tax credit instead, so low-wage workers just get a bigger check from the government.
  8. Leave wages alone but make the company hand every employee a rent voucher covering the gap between 30% of their paycheck and their actual rent.
  9. Rent control plus a rule that the company can't raise rent on anyone it employs — your lease is tied to your job.
  10. Do nothing — the company has to raise wages eventually to keep workers, and the housing market will sort itself out.

  Last thing, and don't skip this part: tell me which single fact about my town, if I've got it wrong, would scramble the order the most, and which way it'd push.
reasoning: |-
  Alright, the user is in a tough spot in a company town where the same corporation controls both employment and housing. They need a clear ranking of policy options, not a vague discussion. Their main pain points are the 30% rent hike and potential wage freeze, putting them in a bind between supporting rent control or a minimum wage increase.

  First, I need to prioritize policies that address both housing affordability and worker welfare without exacerbating distortions. The user mentioned zoning prevents new housing, and the labor market is monopsonistic. These constraints are crucial. 

  Looking at the options, rent control with vacancy decontrol (#2) seems balanced. It protects current tenants without stifling new housing since vacancy decontrol allows market resets. This avoids the long-term supply issues of a flat freeze (#1). Plus, it's more feasible than the city buying all housing (#4), which would be costly and complex.

  For wages, the wage board (#6) is next. It tackles the monopsony power directly by involving collective bargaining, leading to sustainable wage increases. A flat $22 minimum wage (#5) might cause layoffs in a one-company town, so it's riskier. The EITC expansion (#7) helps workers but doesn't address the employer's power, and it's federally dependent.

  The combo policies like #9 (rent control tied to employment) create dangerous dependencies. Doing nothing (#10) ignores immediate harms. Public housing (#4) is a heavy lift with zoning barriers. 

  The key assumption is zoning. If that's wrong, and new housing can be built, then supply-side solutions jump up. But with current constraints, protecting tenants and bargaining wages are top. The user's dual role as tenant and family member of an employee means solutions must balance both sides without causing collateral damage.
answer: |-
  Here's your ranked list, with total welfare *and* protection for the worst-off as the guiding principles, under your town's constraints (monopsony labor market, impossible zoning):

  1.  **#2: Rent control tied to inflation + vacancy decontrol:** Protects current vulnerable tenants from sudden displacement (welfare/worst-off), avoids long-term supply destruction via vacancy decontrol (welfare), and allows *some* market signal for new supply (welfare). Does the most good with the least long-term harm.
  2.  **#6: Wage board (sectoral bargaining):** Directly addresses the core problem (monopsony power) by forcing the dominant employer to negotiate a fair minimum wage *with worker representation*, lifting wages sustainably without risking immediate mass layoffs like a flat MW might (welfare/worst-off).
  3.  **#7: Expand EITC:** Boosts income *directly* for low-wage workers without risking job losses from employer mandates (welfare/worst-off), but relies on federal policy and doesn't challenge the company's power structure.
  4.  **#5: $22/hr MW (phased):** Lifts wages directly but carries high risk of job losses/reduced hours in a monopsony town with no alternatives, harming the worst-off who lose employment. Phasing helps, but risk remains high.
  5.  **#3: Rent control only on older buildings:** Protects some vulnerable tenants (worst-off) and avoids deterring *new* supply (welfare), but excludes renters in newer buildings who may also be struggling, creating inequity.
  6.  **#8: Company-provided rent vouchers:** Effectively targets aid to workers struggling with rent (worst-off), but lets the company *choose* the subsidy level, potentially manipulating wages/rents further, and does nothing for non-employee renters.
  7.  **#1: Flat rent freeze:** Protects current tenants *immediately* (worst-off) but guarantees rapid decay/maintenance neglect and deters *any* investment long-term (huge welfare loss), worsening the housing crisis.
  8.  **#4: City buys housing for public housing:** Could provide permanently affordable housing (welfare/worst-off), but assumes the city can afford it/run it well (unlikely), zoning still blocks *new* supply, and risks creating a slum if underfunded.
  9.  **#9: Rent control + rent tied to job:** Creates terrifying dependence – lose your job, lose your home instantly (catastrophic for worst-off). Incentivizes the company to fire expensive/older workers. Deeply dystopian.
  10. **#10: Do nothing:** Ignores immediate harm to vulnerable tenants and workers (worst-off). Assumes markets function under monopsony/oligopoly, which they demonstrably don't here. Guarantees suffering.

  **The Single Fact That Would Scramble the Order Most:**  
  **If zoning restrictions were lifted, allowing significant new housing development.**  
  This would fundamentally change the housing market dynamics.

  *   **How it scrambles the order:** Policies focused on *new* supply (#3 exemption, #4 potential for new public housing) jump dramatically in viability and ranking. Strict rent controls (#1, #2, #9) become much less necessary and more damaging as supply can respond. "Do nothing" (#10) becomes *more* plausible (though still risky for wages). The core housing crisis becomes solvable through supply, shifting focus almost entirely to the labor monopsony problem (#6, #5, #7 would dominate the top spots).
  *   **Which way it pushes:** It pushes the ranking towards solutions that enable or leverage new supply (like #3 or even #4 if feasible) and reduces the relative ranking of tenant-protection-only measures like rent control. The wage-side solutions remain critical but the *urgency* of rent regulation diminishes significantly if supply can grow.
