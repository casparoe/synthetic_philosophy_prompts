prompt: |-
  I'm running a reading group next week on the trolley problem and the doctrine of double effect, and I've gotten stuck on the orginal text — Aquinas, Summa Theologiae II-II, q. 64, art. 7, "Whether it is lawful to kill a man in self-defense?" The bit I keep rereading is this:

  "Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. Now moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental... Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful... And yet, though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end. Wherefore if a man, in self-defense, uses more than necessary violence, it will be unlawful: whereas if he repel force with moderation his defense will be lawful... Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's. But as it is unlawful to take a man's life, except for the public authority acting for the common good... it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority..."

  What I can't work out is what "beside the intention" is actually doing here. He grants that the act can result in the aggressor's death, and that you can see that coming — so if the killing is foreseen, in what sense is it not intended? Is this a claim about the agent's psychology, about the structure of the act itself, or just a way of keeping the act's "species" clean? And then he adds that a private person may not *intend* the killing, which makes it sound like the very same physical act is lawful or not depending on something going on in your head. Does that distinction actually survive once you set it next to the trolley cases, where the whole point is supposed to be that you may foresee a death without intending it — or does Aquinas need something stronger than "I didn't mean it"? And that line about being bound to take more care of your own life than another's seems to sit badly with the impartiality the trolley literature takes for granted; is that a real tension in the doctrine or am I misreading it? I dont want the whole history of double effect, just help reading this one paragraph. Keep it under 500 words.
reasoning: |-
  Okay, the user is preparing a reading group on the trolley problem and the doctrine of double effect, focusing specifically on Aquinas' text in Summa Theologiae II-II, q. 64, art. 7. They're stuck on the phrase "beside the intention" and have several layered questions about it.

  First, I need to unpack Aquinas' key distinction. The user is confused about how a foreseen death can be "beside the intention" when it's clearly predictable. Aquinas is making a technical metaphysical claim here - not about psychology or regret, but about the act's moral structure. The intended effect (saving life) defines the act's species, while the unintended but foreseen effect (killing) is morally secondary. 

  The user also notes the seeming contradiction where Aquinas says private individuals can't "intend" killing, yet the physical act remains the same. This is precisely where double effect hinges - the interior disposition determines the act's lawfulness. I should emphasize that Aquinas isn't talking about denial of consequences, but about what the will directly pursues.

  Then there's the tension with trolley problem impartiality. Aquinas explicitly prioritizes one's own life over another's ("bound to take more care"), which directly challenges modern consequentialist assumptions. This isn't a misreading - it's a genuine feature of his virtue ethics framework where self-preservation is a natural good. 

  The user wants to avoid historical digressions, so I'll focus strictly on textual analysis. They're clearly wrestling with applying medieval categories to contemporary thought experiments. I should acknowledge that trolley cases test Aquinas' framework but weren't his context. His "moderate defense" criterion maps roughly to proportionality in later double effect discussions.

  For the response structure: I'll define "beside the intention" first, explain why intention matters more than foresight, clarify the psychological/legal distinction in the private person restriction, and finally validate their observation about partiality being a real tension. Need to keep it under 500 words while hitting all these points.
answer: |-
  Here's a breakdown of the key points in your passage, focusing on your specific questions:

  1.  **"Beside the Intention" - What it Does:**
      *   It establishes a **causal distinction within the single act.** Your action (defending yourself) causes two effects: saving your life (Effect A) and potentially the aggressor's death (Effect B).
      *   It signifies that **Effect B is not the chosen goal or means** of your action. You aim *at* saving your life (intended end). The death is a *foreseen consequence* of the means chosen to achieve that end (e.g., striking back), but not itself the chosen means or end.
      *   It's **primarily about the moral structure ("species") of the act.** Aquinas argues the act's moral character (lawful self-defense vs. unlawful killing) is defined by what you *intend* (saving your life), not by the unintended side effect (death), however foreseen. "Beside the intention" marks the death as *not part of the act's defining purpose*.

  2.  **Intended vs. Foreseen:**
      *   It **isn't psychological denial** ("I didn't mean it"). You foresee the death might happen. Aquinas accepts this.
      *   It **is about the structure of choice.** What did your *will* directly commit to? Did you choose the death *as an end* (e.g., revenge) or *as a means* (e.g., "I must kill him to stop him")? If not, and you only chose actions *necessary and proportionate* to stop him, then the death, while foreseen as possible, remains "beside" your intention. It's incidental to the defensive act you *did* intend. Trolley cases rely on this *exact* distinction: diverting the trolley intends saving five; the one death is a foreseen, unintended side effect of the chosen means. Aquinas provides the foundational logic for this.

  3.  **Intention & Lawfulness for Private Persons:**
      *   Aquinas **absolutely ties lawfulness to intention.** The *very same physical motion* (striking a blow) is lawful self-defense if your intention is solely preservation using proportionate force. It becomes unlawful murder if your intention *includes* the killing itself (even if also for preservation). The "something in your head" (the specific intention) is crucial for him. The external act alone doesn't determine morality.

  4.  **Care for Own Life vs. Impartiality:**
      *   This **is a genuine tension** with trolley-style impartiality. Aquinas grounds the permissibility of self-defense partly in a natural obligation to prioritize your own life over an unjust aggressor's ("bound to take more care"). Trolley problems typically assume a neutral, impartial perspective where all lives are equal. Aquinas's principle is agent-relative. He sees no contradiction in this *within the context of self-defense against an unjust aggressor*. The trolley driver isn't defending *themselves* against the five or the one; their situation is structurally different, requiring the double effect distinction without the self-preference element.

  **In Summary:** "Beside the intention" carves out a space for foreseen, unintended bad consequences, distinguishing them from intended ends or means. This defines the act's moral species. Intention is paramount for Aquinas – the same physical act can be justified or sinful based on it. The self-preference element ("more care of one's own life") is integral to *his justification of self-defense* but is distinct from the core double effect mechanism (intended vs. foreseen) used in trolley cases. You perceive the tension correctly.
