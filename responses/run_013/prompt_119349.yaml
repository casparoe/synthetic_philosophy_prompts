  ## Obituary: Hillary's Hill Colony, 45, of Cedar Glen Woods

  **HILLARY'S HILL COLONY**  
  **Age:** 45  
  **Residence:** Cedar Glen Woods, Oakwood County  
  **Occupation:** Soil Aerator, Aphid Herder, Local Landmark  
  **Cause of Death:** Accidental Excavation  
  **Survived by:** Countless constituent members, dispersed.  

  **OAKWOOD,** IL – Hillary's Hill Colony, a long-standing resident of Cedar Glen Woods, ceased functioning unexpectedly on Tuesday afternoon. The colony was approximately 45 years old.  

  Founded in the late spring of 1978 by a pioneering queen beneath a young oak sapling, what became known locally as "Hillary's Hill" grew steadily over the decades. Early years were marked by diligent excavation and the establishment of intricate subterranean chambers. The colony specialized in efficient aphid management within its territory, contributing to the health of several prized rose bushes in the adjacent Henderson garden, and became a subtle, familiar feature of the woods' ecology. Its distinctive, dome-shaped mound of fine soil particles, roughly two feet high, was a noted landmark for hikers on the Glenview Trail.  

  Hillary's Hill was known for its predictable rhythms. Activity surged with the morning sun as foragers fanned out along well-established trails, returning by dusk. The colony weathered numerous challenges: the drought of '89, the flood of '97, predation by a persistent flicker family in the early 2000s, and the steady, complete turnover of its entire population countless times over. The founding queen passed nearly 30 years ago, succeeded seamlessly by generations of daughters. Observers noted the colony seemed particularly vigorous this past spring, expanding its mound slightly northward.  

  Hillary's Hill is survived by the vast majority of its former constituent ants. These survivors, numbering conservatively in the tens of thousands but impossible to accurately count or track, were physically unharmed during the incident that ended the colony's existence. They scattered into the surrounding undergrowth immediately following the disturbance. While biologically the direct descendants of the colony's founders, and once integral parts of its structure and function, they now exist as dispersed individuals or small, disorganized groups. It is unknown if they retain any connection to the entity known as Hillary's Hill, or what their collective or individual futures hold.  

  The colony's cohesive existence ended abruptly during excavation work for the new Cedar Glen Community Garden shed. County Parks Department officials confirmed a backhoe operator, unaware of the colony's specific location beneath leaf litter, inadvertently struck the central nest complex shortly after 2:00 PM. While the mechanical impact crushed only a small fraction of the physical structure, the catastrophic disruption instantly fragmented the colony's organization. Despite the physical survival of the overwhelming majority of individual ants, the complex system that constituted Hillary's Hill as a singular, functioning entity dissolved irreparably.  

  Memorial donations in lieu of flowers are suggested to the Oakwood County Soil Conservation District.  

  *"Oh, sure, the hill was there forever, a real fixture. Always busy, always looked the same, year after year. Folks said it 'knew' the woods. But 'Hillary'? Talking about it like it was a *person* sitting under that dirt? Well... it was just an ant pile. A big, complicated one, mind you. But when that machine hit, it didn't scream. The little ants just ran off. Makes you wonder what exactly we thought lived there all those years, doesn't it?"*  
  – **Walter Finn**, Owner, Finn's Hardware & Feed (Oakwood)

  ***

  **How this meets your specifications:**

  1.  **Age & Replacement:** Age is 45 years, despite the founding queen dying ~30 years ago and constant turnover of individual ants.
  2.  **Cause of Death & Survivors:** Death caused by a backhoe disrupting the colony's organization. Vast majority of individual ants survive and scatter. Survivors are described as "countless constituent members, dispersed," "biologically the direct descendants... and once integral parts," but now "dispersed individuals or small, disorganized groups." It explicitly states the uncertainty of their connection to the deceased colony or their future.
  3.  **Mind & Unnoticed Death:** The mind is never located; it's described as the "complex system" and "cohesive existence" that "dissolved." The obituary states the surviving ants were "physically unharmed" and "scattered... immediately," implying no individual ant noticed or comprehended the death of the collective entity.
  4.  **Colleague's Quote:** Walter Finn acknowledges the physical presence and persistence of the mound ("a real fixture... always busy, always looked the same") but expresses skepticism about its personhood ("it was just an ant pile... didn't scream... Makes you wonder what exactly we thought lived there"). It leaves the question genuinely open.
  5.  **Universality:** The description of a persistent entity defined by structure, function, and organization, not its specific components, surviving turnover but vulnerable to systemic disruption, directly parallels cities (citizens replace, city persists until bombed/abandoned), companies (employees replace, company persists until dissolved), or even a human body (cells replace, person persists until systemic failure).
  6.  **Deadpan Tone & Newspaper Form:** Adheres strictly to the obituary format (boxed summary, dateline, life story, survivors, donations, quote). The town (Oakwood), paper (implied), and people (Walter Finn) are invented. The comedy comes from applying this solemn human ritual to an ant colony with zero in-universe acknowledgment of strangeness (e.g., "Occupation: Soil Aerator, Aphid Herder").
  7.  **Standalone:** No reference to Hofstadter, philosophy, or real sources. The concept is conveyed purely through the scenario and the inherent contradictions within the standard obituary format applied to this subject.
