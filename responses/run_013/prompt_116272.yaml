answer: |-
  ## The Illusion of Neutrality: Why Harsanyi's Theorem Falls Short of Utilitarianism

  Harsanyi's aggregation theorem is often hailed as a neutral, axiomatic derivation of utilitarianism. While it provides a powerful representation result for social welfare under specific conditions, claims that it straightforwardly establishes utilitarianism—and does so neutrally—are significantly overstated and misleading in two key respects. The theorem's reputation for neutrality obscures the substantive normative commitments already embedded within its axioms and the additional, distinct premise required to reach equal weighting.

  **1. Equal Weighting: An Independent Normative Premise, Not a Consequence**
  The first part of the theorem is indeed robust: given individual and social preferences satisfying the von Neumann-Morgenstern (vNM) expected utility axioms, and the Pareto condition (if everyone prefers lottery A to B, society prefers A to B), the social preference ordering *can* be represented by a weighted sum of individual cardinal utility functions, with non-negative weights. Crucially, however, this representation result **does not specify equal weights**. The weights could be highly unequal—favouriting a ruling elite, for instance—and still satisfy the axioms. Pareto efficiency and the vNM structure are perfectly compatible with arbitrary, non-negative weight distributions across individuals.

  The move to *equal* weights relies entirely on the second part: the veil of ignorance argument. A defender might contend this veil is a "plausible principle of fairness" inherent in rational choice under uncertainty, not an *ad hoc* addition. However, this defence falters. The veil of ignorance introduces a distinct normative principle: that **fairness requires impartiality achieved by assuming an equal probability of occupying any social position**. This is a substantive conception of fairness, not a logical implication of the first part's axioms. Rationality under uncertainty (embodied in the vNM axioms an individual behind the veil uses) dictates maximising *expected utility*, but it says nothing about *which* utility function should be maximised. The agent behind the veil maximises a weighted sum of the individuals' utilities; the assumption of equiprobability directly injects the *equal weighting*. This is not a discovery *within* the initial axioms; it is the imposition of an additional, contestable normative premise about what constitutes impartiality or fairness in the original position. Anyone wishing to derive utilitarianism from the representation theorem must therefore *supply and defend* this specific principle of fairness based on equiprobability, which many non-utilitarian theories (e.g., prioritarianism, sufficientarianism, or views emphasising desert) explicitly reject.

  **2. The Axioms: Distributionally Loaded, Not Innocent**
  The phrase "neutral derivation" suggests the axioms are minimal rationality constraints devoid of distributive implications. This is profoundly misleading. The conjunction of the vNM axioms applied to *social* preferences and the strong Pareto condition **already imposes a highly specific and contestable structure on social aggregation: linearity in individual utilities.**

  *   **Linearity and its Implications:** The requirement that *social* preferences over lotteries satisfy the vNM axioms forces the social welfare function to be linear in the probabilities. Combined with Pareto, this linearity translates directly into the social welfare function being linear in the individual *utility* levels. This structure inherently excludes any social ranking that is sensitive to the *distribution* of utility levels in a non-linear way. Specifically, it rules out:
      *   **Prioritarianism:** Views that give greater weight to utility gains for the worse-off (implying a concave transformation of individual utilities before summation).
      *   **Moderate Egalitarianism:** Views that intrinsically value equality of welfare, leading to social indifference curves that are convex to the origin in utility space.
      *   **Sufficientarianism:** Views that prioritise bringing people above a threshold, often implying a non-linear weighting scheme.

  A defender might retort: "But that's the point! A Pareto-respecting social ordering satisfying vNM axioms *is* the utilitarian structure; there's nothing more to say." This, however, conflates the mathematical structure with the normative justification. The objection highlights the core issue: **the axioms themselves encode a substantive commitment to a specific type of aggregation—linear aggregation—that is precisely what many non-utilitarian distributive theories reject.** The theorem doesn't neutrally derive utilitarianism from minimal premises; it *assumes* the utilitarian structure (linear aggregation) via the social vNM and Pareto axioms, and then adds a separate fairness premise for equal weights. Calling this "neutral" obscures the deeply consequential distributive assumption baked into the initial setup.

  **3. The Substantive Commitment of Lottery-Pareto**
  Furthermore, the specific form of the Pareto condition used—applied to individuals' *preferences over lotteries*—is itself more substantive than it appears. A minimal rationality constraint might only require Pareto respect for *sure outcomes* (if everyone is better off in state X than state Y, society prefers X). Extending Pareto to *all lotteries* assumes that individuals' vNM utility functions capture *all normatively relevant information* about their well-being under risk, and that social rationality requires respecting these risky preferences aggregatively. This precludes views where:
      *   Social evaluation might care about the *ex post* distribution of realised utilities (not just the *ex ante* expectations), potentially prioritising reducing the chance of catastrophic outcomes for some.
      *   Adaptive preferences or misjudged risks might mean revealed preferences under risk are not the sole arbiter of social good.
      *   Objective well-being measures distinct from preference satisfaction are deemed relevant. The lottery-Pareto condition implicitly endorses a preference-satisfaction view of well-being and mandates its aggregation in a specific, linear way.

  **Conclusion**
  Harsanyi's theorem provides a valuable representation result: under its axioms, social welfare is a linear function of individual utilities. However, it does not neutrally establish utilitarianism. The equal weighting definitive of utilitarianism requires an independent, substantive normative premise about fairness (the equiprobability veil of ignorance), not derivable from the initial axioms. More fundamentally, those initial axioms—particularly the imposition of vNM rationality on social preferences combined with the strong lottery-Pareto condition—are far from distributionally neutral. They mandate a linear aggregation structure that excludes a wide range of plausible distributive principles concerned with the relative levels of utility, such as prioritarianism or moderate egalitarianism. The theorem's reputation for neutrality is thus doubly misleading: it masks the need for an added fairness argument for equality *and* obscures the contestable distributive commitment inherent in its core axioms.

  **Confidence Assessment:**
  I am **moderately confident** in the overall argument. The distinction between the representation theorem (allowing unequal weights) and the need for a separate premise for equal weights is logically sound and widely acknowledged in welfare economics and philosophy. The argument about the non-neutrality of the axioms imposing linearity and excluding non-utilitarian views is also well-supported.

  The step in which I have **least confidence** is the critique of the *lottery-Pareto condition* as a substantive commitment. While I believe it *is* substantive, defending this against the strong counter-argument—that rational social choice under uncertainty *must* respect individuals' rational preferences under uncertainty (hence lottery-Pareto is minimal)—requires deeper philosophical engagement concerning the nature of well-being, social rationality, and the potential divergence between *ex ante* and *ex post* perspectives. A sophisticated utilitarian defender could mount a robust defence of lottery-Pareto as a core requirement of rational, individual-respecting aggregation under risk, making this the most vulnerable point in the critique.
