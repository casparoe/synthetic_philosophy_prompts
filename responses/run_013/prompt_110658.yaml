prompt: |-
  I'm in a metaethics reading group and we've spent three weeks circling the Frege-Geach problem, and I want to stop reading proposed solutions until I know what a solution would even have to do. So before I open another expressivist paper, write me the desiderata: the full spec that any theory of moral thought and talk has to meet if it's going to handle embedding. I want the list of requirements with the case that generates each one, so I can see why it's a requirement and not just something one camp happens to want. Some of the cases we've been yelling about, so you can see the shape of what I mean: (a) a flat assertion, "telling your brother you broke the vase was wrong"; (b) that very same clause sitting unasserted as the antecedent of "if telling him was wrong, then you owe him an apology" -- nobody asserts it there, and yet the argument "if it was wrong then you owe him an apology; it was wrong; so you owe him an apology" is valid, and the validity cant be an artifact of the word "wrong" quietly changing its job between the premise and the antecedent; (c) negation, where "it wasnt wrong" has to be the contradictory of "it was wrong" and not merely the absence of disapproval -- a friend keeps saying the expressivist gets "I don't disapprove" where we need "not wrong," and I want that on the list as a requirement with a reason behind it, not as a gotcha; (d) embeddings that aren't "if" or "not": "it was probably wrong," "was it wrong?", "he believed it was wrong," "it was wrong because he trusted you," and the suppositional "suppose lying is wrong -- then what you did was wrong too"; (e) the genuinely mixed ones, like "if lying is wrong then the boss will hear about it," moral antecedent and descriptive consequent, where the whole conditional still looks truth-apt; (f) arguments where no moral sentence is ever asserted at all, like modus tollens off the conditional. Two more things I want the list to confront head on. First, whatever the theory says, the logic has to be one logic: validity in the moral argument can't be a different relation from validity in the descriptive one, or the whole thing is a verbal trick. Second, the requirement that makes the game hard -- the theory has to stay expressivist, i.e. it can't earn its way to embedding by quietly handing "wrong" a full-blooded truth-conditional semantics and a property, because then my classmate is right that it's just realism with extra steps.

  So: give me the requirements list with the consideration behind each, mark which are non-negotiable and which are really just preferences of a particular camp (whether the theory owes a compositional semantics for the surface syntax, whether it has to preserve classical logic as-is, whether it has to avoid positing moral properties altogether, whether "true" has to come out deflationary, and so on), and flag any subset you think can't be jointly satisfied -- that's the part I most want, so be explicit about which pairs are in tension and why, and say which single requirement does the most work in ruling out the expressivist strategies people actually defend. Skip the full scorecard against every contender, I'll do that in the group, but tell me in a sentence or two which horn you'd sacrifice first, embedding or staying-expressivist, and why.

  And at the end, tell me what would change your mind: which case or argument would move one of your non-negotiables over into the negotiable column, and where in your own reasoning you think you're most likely to be wrong. American English, please.
reasoning: |-
  Okay, the user is deep into metaethics, specifically the Frege-Geach problem, and wants a clear list of requirements for any expressivist theory that handles embedding. They've spent weeks on this and are frustrated. They want the desiderata with justifications, not just a list of what each camp wants. 

  First, I need to unpack their examples: flat assertions, conditionals, negation, varied embeddings (probability, questions, beliefs, etc.), mixed conditionals, and arguments without moral assertions. They also emphasize two key points: logical unity (moral and descriptive logic must be the same) and staying expressivist (no sneaking in realism).

  The user's identity is someone in a reading group, likely a grad student or advanced undergrad, who's tired of circling the same issues. Their explicit need is a framework to evaluate solutions, but deeper needs include clarity on why expressivism is worth salvaging and where compromises might lie. They might also want ammunition for debates (hence the "yelling about" cases) and to avoid wasting time on non-starters.

  The challenge is balancing rigor with accessibility. Each requirement must derive from a concrete case, not theoretical bias. For example:
  - Non-negotiable: Logical Unity (from modus tollens examples) because splitting logic undermines rationality itself.
  - Tricky: Compositionality—some expressivists (e.g., Gibbard) fake it, but purists might reject semantic ascent. I'll mark this as negotiable since expressivism can bend here without breaking.
  - Most tension: Negation vs. Expressivism's core. If "not wrong" reduces to absence of disapproval, it fails (hence Non-Disappearance). This is where many theories implode.

  The user's classmate's "realism with extra steps" jab is pivotal. To stay expressivist, the solution must explain embedding without moral properties or truth-conditions. Hybrid theories often cheat here, so I'll flag that as the breaking point.

  My list will prioritize:
  1. Non-negotiables (logical unity, non-disappearance, etc.)
  2. Borderline cases (compositionality—nice but not essential)
  3. Tensions: e.g., Expressivist Core vs. Compositionality. If pressed, I'd sacrifice compositional semantics (requirement 5) because expressivism can mimic logic without it, but ditching expressivism defeats the purpose.

  What would change my mind? If someone showed that a non-cognitive state (like planning) can underpin classical logic without truth-conditions—e.g., a proof that "disapproval" can structurally mirror truth functions. Currently, I think that's impossible, but if shown otherwise, I'd bend on compositionality being mandatory.

  Final note: The user wants American English, so I'll avoid British idioms and keep examples relatable (vases, bosses, apologies). Also, they crave honesty about weaknesses, so I'll admit where my view is shakiest: probably underestimating dynamic semantics (e.g., Gibbard's later work) for handling supposition.
answer: |-
  Here's your requirements list for an expressivist solution to the Frege-Geach problem, derived from your cases and constraints. I've labeled each requirement's status, the case generating it, and why it's necessary. Tensions are flagged explicitly.

  ### The Core Desiderata (Non-Negotiable for Solving Frege-Geach)
  1.  **Semantic Uniformity (No Shifty "Wrong"):**
      *   **Case:** (a) Flat assertion "Telling your brother was wrong" vs. (b) Unasserted antecedent "If telling him was wrong...".
      *   **Requirement:** The meaning (semantic contribution) of "wrong" must be identical whether it appears in a simple assertion, an antecedent, a negation, or any other embedded context. It cannot change its semantic job based on context.
      *   **Why Non-Negotiable:** If "wrong" means "Boo!" in assertions but something truth-conditional in antecedents, the validity of arguments like modus ponens becomes accidental or requires two distinct logics, violating Logical Unity (Req 9). This is the core of the Frege-Geach objection.

  2.  **Non-Disappearance (Negation as Contradictory):**
      *   **Case:** (c) Negation: "It wasn't wrong" vs. "It was wrong".
      *   **Requirement:** The negation "It wasn't wrong" must express the *contradictory* of the state expressed by "It was wrong". It cannot merely express the *absence* of the state expressed by the positive claim (e.g., "I don't disapprove").
      *   **Why Non-Negotiable:** Absence of disapproval ("I don't disapprove") is compatible with indifference or uncertainty, while "It wasn't wrong" entails that "It was wrong" is false. Failing this means the logic of negation is broken for moral language. This directly addresses your friend's point.

  3.  **Logical Unity (One Logic to Rule Them All):**
      *   **Case:** (b) Valid modus ponens argument using moral sentences; (f) Valid modus tollens argument using moral sentences without assertion; Valid arguments mixing moral/descriptive sentences.
      *   **Requirement:** The relation of validity (or logical consequence) for arguments involving moral sentences must be the *same relation* as validity for purely descriptive arguments. It must be grounded in the meanings of the logical operators and the semantic contributions of their parts uniformly.
      *   **Why Non-Negotiable:** Logic is universal. If moral modus ponens relies on a different principle than descriptive modus ponens, the appearance of shared reasoning is illusory. This undermines the objectivity and rationality of moral discourse. It also prevents "verbal tricks."

  4.  **Embedding Tolerance (Beyond Conditionals & Negation):**
      *   **Case:** (d) "It was probably wrong", "Was it wrong?", "He believed it was wrong", "It was wrong because he trusted you", "Suppose lying is wrong...".
      *   **Requirement:** The theory must explain how the state expressed by a simple moral sentence (e.g., disapproval of X) can systematically contribute to the meaning of complex sentences containing it in *any* grammatical/semantic context (probability operators, questions, attitude reports, causal claims, suppositions).
      *   **Why Non-Negotiable:** Moral language functions seamlessly in all these contexts. A theory that only handles "if" and "not" fails as a general account of moral language use and thought. A solution to Frege-Geach must generalize.

  5.  **Mixed Discourse Coherence:**
      *   **Case:** (e) "If lying is wrong, then the boss will hear about it" (moral antecedent, descriptive consequent); Arguments mixing moral and descriptive premises/conclusions.
      *   **Requirement:** The theory must explain how moral and descriptive sentences can combine coherently within complex sentences (like conditionals) and valid arguments. The resulting complex sentence must have a unified meaning (be "truth-apt" if required) and participate in logical relations.
      *   **Why Non-Negotiable:** Mixed sentences and arguments are ubiquitous and intuitively meaningful/logical. A theory that segregates moral and descriptive meaning too rigidly cannot account for this.

  6.  **Expressivist Core (No Covert Realism):**
      *   **Case:** Your explicit constraint: "it can't earn its way to embedding by quietly handing 'wrong' a full-blooded truth-conditional semantics and a property".
      *   **Requirement:** The fundamental explanation of the meaning of moral sentences must remain non-representational/non-descriptive at its core. It must explain moral thought/talk primarily in terms of expressed non-cognitive attitudes (disapproval, endorsement, plans, commitments, etc.), not in terms of referring to moral properties or stating moral facts.
      *   **Why Non-Negotiable:** This is the defining commitment of expressivism. Abandoning it means abandoning expressivism itself, turning it into "realism with extra steps." The solution must be *expressivist*.

  ### Important, But Potentially Negotiable Depending on Approach
  7.  **Compositionality:**
      *   **Case:** All embedding cases (b, d, e, f). How does the meaning of the whole depend systematically on the meaning of the parts *given the expressivist starting point*?
      *   **Requirement:** The theory should provide a systematic account (a semantics) showing how the meaning (or "meaning-like" function) of complex sentences is built from the meanings (or attitude-expressing functions) of their parts and the way they are combined.
      *   **Why Potentially Negotiable:** While highly desirable and a natural way to meet Reqs 1-6, some expressivists (e.g., early Gibbard) argue they provide a *logic* or *inferential role* for complex attitudes that mimics compositionality without needing a full truth-conditional compositional semantics. This is a major battleground.

  8.  **Classical Logic Preservation:**
      *   **Case:** Reliance on standard inferences like modus ponens (b), modus tollens (f), non-contradiction (c).
      *   **Requirement:** The theory should validate the core logical principles (e.g., modus ponens, non-contradiction, disjunction introduction/elimination) as applied to moral sentences.
      *   **Why Potentially Negotiable:** Some expressivists (e.g., proponents of "logical expressivism" or certain dynamic semantics) might argue that moral logic has *different foundations* (e.g., consistency of plans) but *coincides* with classical logic in most cases. Radical revisions are hard to swallow, but preserving the *patterns* might be prioritized over classical *foundations*. Most aim to preserve classical logic.

  9.  **Deflationism about "True":**
      *   **Case:** Applying "true" to moral claims ("It's true that lying is wrong") or complex embeddings ("If 'lying is wrong' is true, then...").
      *   **Requirement:** The theory should accommodate the standard deflationary/disquotational use of "true" for moral sentences (e.g., "Lying is wrong" is true iff lying is wrong).
      *   **Why Potentially Negotiable:** While expressivists typically embrace deflationism to avoid realism, a solution *could* in principle work without a fully deflationist account, though it would face significant hurdles explaining "true" in embedded contexts. Most see deflationism as fitting naturally.

  ### The Major Tensions & The Crucial Breaking Point
  *   **The Core Tension:** **Expressivist Core (Req 6) vs. Semantic Uniformity/Compositionality (Req 1 & potentially 7) & Logical Unity (Req 3).** This *is* the Frege-Geach problem for expressivism. How can a word fundamentally expressing an attitude (Req 6) have a *uniform semantic contribution* (Req 1) that combines seamlessly with logical operators (Req 3) and descriptive content (Req 5) in a way that sustains *one logic* (Req 3), especially when unasserted (Req 1, 4, 5, 6)?
  *   **The Hardest Requirement:** **Non-Disappearance (Req 2)** is arguably the single most difficult requirement for pure expressivism to meet *while* satisfying Req 6 (Expressivist Core). Explaining how an attitude expression ("Boo! X") has a *logical contradictory* ("Not-Boo! X" meaning something stronger than mere absence) without collapsing into a truth-conditional semantics is the crux. Many strategies (e.g., simple higher-order attitudes) fail precisely here.
  *   **Where Expressivist Strategies Often Break:** They typically struggle most conspicuously with **Req 2 (Non-Disappearance)** and **Req 4 (Embedding Tolerance - especially attitude reports like "He believes it was wrong")** while trying to maintain **Req 6 (Expressivist Core)**. Meeting Req 5 (Mixed Discourse) often forces the issue with Req 1 (Uniformity) and Req 6 (Core).

  ### The Sacrificial Horn (If Forced)
  If forced to sacrifice one horn, I would sacrifice **strict adherence to the Expressivist Core (Req 6)** *before* sacrificing **handling embedding and logic properly (Reqs 1-5, 3)**. Why? Because the primary goal of a metaethical theory is to explain the *phenomena of moral language and thought*, including its logical structure and embedded uses. If maintaining a pure non-representational core fundamentally *prevents* explaining how moral language actually works logically and compositionally across contexts (which is what Frege-Geach demonstrates), then that core constraint is the problem. A hybrid view that incorporates *some* representational element to secure logic and embedding, while still emphasizing the non-cognitive *function* or *source* of moral judgments, might offer a more explanatorily powerful account. Sacrificing embedding/logic means the theory fails its core task of explaining moral discourse.

  ### What Would Change My Mind
  *   **The Mind-Changer:** A demonstrably successful **account of negation (Req 2) and attitude reports (Req 4)** within a framework that genuinely **avoids positing truth-conditional content for atomic moral sentences (Req 6)**. Specifically, if someone could show how a *single type of non-cognitive state* (e.g., a plan, commitment, or complex disposition) can be:
      1.  Expressed by "X is wrong",
      2.  Systematically transformed by operators like "not", "believes that", "probably", "if...then..." such that,
      3.  The resulting states stand in relations that perfectly mirror *classical logical entailments* (Req 3, 8),
      4.  *Without* defining the operators in ways that functionally reduce to truth-conditions for the atomic components (i.e., without "quiet realism").
      *   Gibbard's norm-expressivism and Chrisman's/Blackburn's later work attempt this, but I remain skeptical that they fully escape the need for semantic ascent or quasi-realism that looks suspiciously truth-conditional *in practice*.
  *   **Where I'm Most Likely Wrong:** Underestimating the potential of **dynamic semantics** or **inferentialist approaches**. Frameworks that model meaning as update potentials on contexts (dynamic semantics) or as roles in inference (inferentialism) *might* provide the tools to build a compositional logic for attitude expressions without smuggling in truth-conditions. If a model within such a framework could be shown to satisfy all Reqs 1-6 rigorously (especially 2 and 4), I'd need to reconsider. My skepticism stems from doubts that the "contexts" or "inferential roles" for moral claims can avoid relying on structures isomorphic to truth-conditional assignments when explaining logical validity (Req 3).

  This list provides the toolkit. Good luck wrestling with the contenders in your group! Remember, the devil is in the details of how each theory attempts to satisfy Req 2 and Req 4 while holding onto Req 6.
