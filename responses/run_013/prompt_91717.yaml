answer: |-
  You'll likely face the economics visitor first, objecting that the Luring Lottery empirically refutes superrationality. They'll say: "Your entire model is armchair speculation detached from how real people reason. In the Luring Lottery variant, where the prize is divided among entrants, participants *do* enter at high rates despite similar payoff structures suggesting they shouldn't under evidential reasoning. Lab experiments show people treat these as low-stakes gambles, not evidence coordination problems. Your Platonia only 'works' because you've rigged the payoffs to force paradoxical outcomes, ignoring revealed preference." **Reply:** "The Luring Lottery crucially changes the incentive structure. Dividing the prize creates positive expected utility for entry even under causal independence, especially with uncertainty about others. Platonia’s all-or-nothing payoff creates a sharp discontinuity where individual entry only pays off under perfect correlation. The empirical data shows people *don't* treat these as identical, which is why Platonia remains a distinct puzzle about correlational equilibria under extreme interdependence. Lab settings struggle to induce true belief in perfect symmetry, but the asymmetry in our variant *does* test that." **Weakness:** This risks sounding like moving goalposts; if people don’t reason evidentially in Luring, why think they would in Platonia?

  Next, the causal decision theorist will challenge the evidential core: "You claim my reasoning is evidence for others' reasoning, but this conflates correlation with causation. My *decision* doesn’t causally influence others. Evidential decision theory (EDT) is known to prescribe irrational acts in Newcomb-like cases when the correlation isn’t robust. In your asymmetric case, if I’m a superrationalist, my choice might correlate only with other superrationalists’ choices, not the causal maximizers’. Why should I let the *label* of being ‘superrational’ bind me to a losing strategy if I suspect the causal maximizers will defect?" **Reply:** "EDT isn’t claiming causation; it’s about information. In symmetric Platonia, knowing I’m rational and that others are identical *is* evidence they’ll act like me. Asymmetry breaks that evidential symmetry: if I know I’m a superrationalist, I know my reasoning correlates strongly only with the other nine superrationalists, not the causal maximizers who likely won’t send. My own choice thus ceases to be strong evidence about the *whole* group. This fragility under asymmetry is precisely why it supports EDT—causal decision theory (CDT) prescriptions wouldn’t shift this way." **Weakness:** Doesn’t fully address the "tickle defense"—why isn’t my *type* the fixed evidence, making my decision irrelevant to predicting others?

  Your team-reasoning colleague will argue you’ve mischaracterized their view: "You claim asymmetry sinks superrationality and thus supports EDT over team reasoning. But sophisticated team reasoning can handle asymmetry! Teams form among subsets. The superrational ten could ‘team-reason’ to coordinate sending with only each other, ignoring the causal maximizers. Your result doesn’t distinguish the theories; both can predict superrationalists sending in symmetry but not in asymmetry." **Reply:** "The superrational argument I defend isn’t team reasoning—it’s individual reasoning treating logical symmetry as evidence. Team reasoning posits a shift in agency. My point is that the *evidential* inference collapses under asymmetry without needing to invoke collective agency. If team reasoning ‘solves’ symmetric Platonia by assuming the team forms, why doesn’t it form in asymmetry among the superrationalists? My account explains the discontinuity: evidential links weaken when rationality isn’t uniform." **Weakness:** Team reasoners can bite the bullet and say the superrational ten *should* still form a team, making your asymmetry less decisive.

  The Kantian will see formalism: "This sounds like a disguised Categorical Imperative test: ‘Act only according to that maxim whereby you can rationally will it to be universal law.’ If everyone reasons as you do and sends, the prize is voided—contradiction. So the only rational maxim is not to send. Your evidential twist seems like a convoluted way to smuggle in universalizability, and it fails in asymmetry precisely where Kant’s test wouldn’t apply universally." **Reply:** "Kantian universalizability is deontic and counterfactual; it asks if a maxim *could* be universalized without contradiction. EDT is epistemic and predictive; it uses the actual symmetry of agents to predict outcomes. In symmetric Platonia, EDT *doesn’t* universalize ‘send’—it predicts that if *I* send, *others likely will too*, causing failure. Kant might forbid sending, but EDT forbids it for different reasons: the evidential consequence of my act. Asymmetry breaks the prediction, not the moral law." **Weakness:** The parallel is strong; your account may rely on a similar logical structure despite different mechanisms.

  Ethicists/action theorists will worry about rationality vs. welfare: "You conclude it’s *rationally required* to send in symmetry, but collectively this is disastrous (prize voided). How can rationality demand an action guaranteeing the worst group outcome? This makes rationality seem self-defeating or morally alienating. Shouldn’t rationality align with achieving good outcomes?" **Reply:** "This dilemma highlights a conflict between individual rationality and group rationality under strong interdependence. EDT shows that *given* the beliefs formed under symmetry (my act is strong evidence others act alike), sending is uniquely ratifiable—not sending also leads to failure if others reason identically. It’s tragic, but not irrational in the evidential sense. Asymmetry partially resolves this by breaking the evidential chain for some agents." **Weakness:** This concedes rationality is potentially self-defeating, which some find a reductio of EDT.

  **The question you hope nobody asks:** "In Asymmetric Platonia, what should a *causal maximizer* do? If they believe the superrationalists are likely not sending (per your argument), then sending might have positive expected utility for them (low chance of being the only sender). But if causal maximizers send and superrationalists don’t, the prize is won only if exactly one causal maximizer sends—which they can’t coordinate. Doesn’t this suggest a messy mixed-strategy equilibrium where everyone has some incentive to send, undermining your clean ‘collapse’ story and making EDT’s prescription unclear?" **Reply:** "This is the deep challenge. Under common knowledge of rationality types, causal maximizers face a standard lottery problem: randomizing entry to have a 1/10 chance if others stay out. Superrationalists, knowing their act correlates only with other superrationalists (likely not sending), see near-zero probability of being sole sender. They shouldn’t send. The asymmetry destroys the pure evidential equilibrium, forcing probabilistic reasoning that differs by type." **Weakness:** This admits the symmetric case’s elegance is lost, and your ‘evidentialist collapse’ in asymmetry becomes a complex game-theoretic scenario, potentially muddying your thesis that asymmetry favors EDT over team reasoning. It might imply that superrationalists, by not sending, enable causal maximizers to sometimes win—which feels inconsistent with the spirit of the original argument.
