answer: |-
  Here’s a structured proposal framework built around your core insight, sharpening the question, and leveraging the treatment refusal/demand asymmetry as a critical test case. This plan focuses on exposing the hidden default rule as the engine of the dispute.

  ---

  **Proposal Title:** The Burden of Dissent: Default Rules and the Hidden Architecture of Authority in Advance Directives  

  **Core Research Question:**  
  *When a later-self dissents from their prior directive, does the burden of justification fall on the later self (to override the directive) or on the directive itself (to prove its authority over the dissenter)? And what does this reveal about the source of the directive’s claimed authority?*  

  **Why Existing Positions Leave This Open:**  
  1. **"Binding Autonomy" Position:** Assumes the directive *is* the status quo. The later self must justify departure (burden on dissent). This presupposes content-independent authority (earlier self's say-so) but doesn't argue *why* the directive sets the default.  
  2. **"Present Interests" Position:** Assumes the later self's current state *is* the status quo. The directive must justify overriding the present self (burden on the directive). This presupposes content-dependent authority (alignment with current will/interests) but doesn't argue *why* the present self holds the default position.  
  3. **The Stalemate:** Both positions focus on *values* (autonomy vs. welfare) but evade the *procedural* question: **Which party starts with the presumption of authority?** They embed conflicting default rules without explicitly defending them, rendering the debate circular.  

  **Method & Argument Structure (Avoiding Familiar Ditches):**  
  1. **Diagnosing the Impasse (≈1,500 words):**  
     * Critically map the standard "autonomy vs. present interests" framing in directive disputes.  
     * Demonstrate how each side *assumes* a different default starting point (directive as status quo vs. present self as status quo) without acknowledging this assumption as the core disagreement.  
     * *Why this route?* It shifts focus from unresolvable metaphysical questions (personal identity) or contested contractual analogies (pre-commitment) to a concrete, observable procedural feature of the arguments.  

  2. **Articulating the "Burden of Justification" Framework (≈1,500 words):**  
     * Define "default rule" operationally: Who bears the burden of proof when dissent arises?  
     * Argue that the *location of this burden* is the primary differentiator between the two camps and determines the practical outcome in dissent cases.  
     * *Why this route?* It provides a clear, falsifiable lens to analyze arguments and reveals the hidden structure beneath value appeals.  

  3. **The Critical Test: Refusal vs. Demand Asymmetry (≈2,000 words):**  
     * **Phenomenon:** Intuition often suggests refusal directives (e.g., "No life support if demented") are more authoritative than demand directives (e.g., "Provide life support at all costs") when the later self dissents.  
     * **Test:** Apply the "burden framework" to both scenarios:  
       *   *Refusal:* Does the burden fall on the *present self* wanting treatment (to justify overriding the refusal), implying the *directive* holds the default?  
       *   *Demand:* Does the burden fall on the *directive* (to justify overriding the present self's wish to die), implying the *present self* holds the default?  
     * **Analysis:** This asymmetry exposes the instability of both standard positions:  
       * The "Binding Autonomy" view struggles to explain why its (presumed) content-independent authority weakens significantly for demand directives.  
       * The "Present Interests" view struggles to explain why refusal directives often retain significant weight *despite* dissent.  
     * *Why this route?* The asymmetry is a widely acknowledged puzzle. Using it as a test case pressures both theories, forcing their implicit default rules into the open and revealing their inability to consistently account for practice/intuition. It avoids reliance on identity or contract.  

  4. **Towards a Coherent Account of Authority & Dissent (≈1,000 words):**  
     * Conclude that neither pure content-independence nor pure content-dependence adequately resolves the burden question or explains the asymmetry.  
     * Propose that authority (and thus the default) may hinge on *epistemic or practical constraints* inherent in the *type of decision* (refusal vs. demand) within the care context (e.g., resource allocation, bodily integrity, institutional roles), not solely on temporality or value conflicts.  
     * Suggest that the "burden framework" itself is the essential tool for resolving disputes, requiring explicit justification of the chosen default rule in specific contexts.  

  **Successful Outcome:**  
  1. **Success:** A clear demonstration that the core dispute hinges on unargued default rules, not direct clashes of autonomy vs. welfare. The asymmetry test reveals the inadequacy of both standard positions. The "burden framework" emerges as a necessary analytical tool for moving beyond the stalemate. Authority is shown to be neither purely content-independent nor content-dependent, but contextually shaped, particularly by the refusal/demand distinction.  
  2. **Failure/Collapse:**  
     * **Failure:** Inability to convincingly show the default rule is the central, unacknowledged point of contention; or failure to use the asymmetry test effectively to pressure the standard positions.  
     * **Collapse:** Reverting to arguing *for* one standard position (autonomy or present interests) based on their embedded values, rather than exposing their structural flaw. Getting bogged down in defending a specific metaphysical view of personal identity or a particular contractarian model of pre-commitment.  

  **Realistic Scope for One Semester (6,000 words):**  
  * **Focus:** Philosophical & conceptual analysis of authority, burden, and the refusal/demand asymmetry within the dissent scenario.  
  * **Essential Cuts:**  
    * **Detailed Policy Analysis:** Surveying specific jurisdictional laws or institutional policies beyond illustrating core philosophical positions.  
    * **Empirical Studies:** Deep dives into data on compliance rates, family dynamics, or clinician attitudes (though empirical *examples* might illustrate points concisely).  
    * **Comprehensive History:** Tracing the full historical development of advance directives.  
    * **Other Bioethics Contexts:** Applying the framework extensively to other areas like research directives or psychiatric directives (mentioning potential relevance is fine).  
    * **Full Defense of Alternative Theory:** Developing a complete, novel substantive theory of directive authority; the goal is *diagnostic* (exposing the problem with current approaches) and *framing* (offering the burden tool), not a comprehensive positive alternative.  
  * **Feasibility:** The defined structure allows deep engagement with core texts and arguments within the dissent debate, using the asymmetry as a focused, manageable case study to drive the analysis.  

  **Key Deliverable:** A paper demonstrating that progress in the advance directive dissent debate requires shifting focus from *which value wins* (autonomy or welfare) to *who bears the burden of proof* when values conflict, and that the refusal/demand asymmetry crucially exposes the need for this shift.

  ---
  This plan directly targets your insight about the hidden default rule, uses your proposed asymmetry as the crucial lever to expose it, and provides a clear, original path through the literature that deliberately avoids well-worn ruts. It defines success as changing the terms of the debate rather than resolving it on its old terms. The scope is ambitious but achievable by focusing tightly on the burden framework and the asymmetry test.
