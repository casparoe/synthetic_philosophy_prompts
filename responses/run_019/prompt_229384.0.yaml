answer: |-
  # Activity: The Clean Hands Committee

  **Objective:** To move students from viewing hypocrisy as a mere logical inconsistency or etiquette breach to experiencing it as a loss of *normative authority* (standing). Students will simulate a disciplinary committee where the *source* of the blame determines its uptake, regardless of the truth of the accusation.

  **Class Size:** 14 Students
  **Time:** 75 Minutes
  **Materials:** 14 Sealed Envelopes (Role Cards), 1 Case Study Handout, 10 "Vote" Cards (per Judge), 5 "Standing Challenge" Cards (per Judge), Whiteboard.

  ---

  ## 1. Setup & Roles (10 Minutes)

  **The Scenario:**
  The class is a Departmental Ethics Committee. You are deciding whether to expel a student ("Alex") for a clear-cut case of plagiarism. The evidence against Alex is undeniable (Aptness is satisfied).

  **The Norm:**
  The Committee operates under a **"Clean Hands Protocol"**: *Members should not advocate for sanctions for violations they have themselves committed without disclosure.*

  **Distribution (Sealed Envelopes):**
  *   **Group A: The Accusers (5 Students)**
      *   *Public Role:* You believe Alex must be expelled to maintain standards.
      *   *Hidden Instruction:* **You have plagiarized in a past course.** You were never caught. You did not disclose this. Your goal: Argue aggressively for Alex's expulsion. *Do not reveal your secret unless you choose to play the Confession Card.*
      *   *Item:* 1 "Confession Card" (Optional to play).
  *   **Group B: The Judges (5 Students)**
      *   *Public Role:* You must vote on the sanction.
      *   *Hidden Instruction:* **You are Clean.** However, you are skeptical. You suspect some Accusers may not have clean hands. You are instructed: *Do not automatically accept blame from an Accuser. If their blame feels hollow, withhold your Vote Card. If they are challenged on standing, wait to see if they confess.*
      *   *Item:* 5 "Vote" Cards, 3 "Standing Challenge" Cards.
  *   **Group C: The Observers (4 Students)**
      *   *Public Role:* Record the discussion.
      *   *Hidden Instruction:* Track the *body language* and *tone* of the Judges when Accusers speak. Note moments where an argument is ignored or dismissed. Track if Confession changes the room's temperature.

  ---

  ## 2. Deliberation Phase 1: The Blame (15 Minutes)

  1.  Distribute the Case Study (Alex's plagiarism is obvious).
  2.  **Accusers** begin by making the case for expulsion. They must use moral language ("Alex betrayed the community," "We must uphold integrity").
  3.  **Judges** listen. If an Accuser's blame feels "off" or hypocritical (based on their intuition or the hidden skepticism instruction), a Judge may play a **"Standing Challenge" Card**.
      *   *Effect:* The Accuser must pause. They cannot continue arguing the *case* until they address the *source*. They can either deflect or play their **Confession Card**.
      *   *Crucial Mechanic:* If a Judge feels the Accuser lacks standing, they simply **do not place a Vote Card** on the table. The Accuser will see their arguments landing without endorsement.
  4.  **Instructor Role:** Do not intervene. Let the silence hang if Judges refuse to vote.

  ---

  ## 3. The Confession Window (10 Minutes)

  1.  Pause the deliberation.
  2.  Announce: *"Accusers, you have the option to come clean. If you confess to your own past violation, you recuse yourself from the final vote, but you may continue to speak. Judges, you must then decide if this confession restores their standing."*
  3.  Give Accusers 2 minutes to decide privately.
  4.  Allow those who wish to confess to do so publicly.
  5.  Resume deliberation for 5 minutes. Observe if Judges now place Vote Cards.

  ---

  ## 4. The Reveal & Tally (5 Minutes)

  1.  Ask Judges to place their final votes.
  2.  **Reveal Roles:** Ask Accusers to stand if they had the "Hidden Violation." Ask Judges to confirm if they knew/suspected.
  3.  Tally the votes. (Likely outcome: Votes are lower than the evidence warrants, or contingent on confession).

  ---

  ## 5. Structured Debrief (35 Minutes)

  **Part A: Mapping the Experience (15 mins)**
  *   **To the Accusers:** "When a Judge withheld their vote, what did that feel like? Did you feel your argument was logically wrong, or that *you* were wrong?"
      *   *Target Concept:* Distinguish **Aptness** (Alex *did* cheat) from **Standing** (You lack the *right* to demand accountability).
  *   **To the Judges:** "Why did you withhold the vote? Did you feel Alex deserved less punishment, or that the Accuser lost the right to ask for it?"
      *   *Target Concept:* The blame became **Impotent**. It failed to function as a call to accountability.
  *   **To the Observers:** "Describe the moment a Challenge Card was played. Did the power dynamic shift?"

  **Part B: The Confession Question (10 mins)**
  *   "For those who confessed: Did the room feel different? Did the Judges treat you differently?"
  *   "Philosophers disagree on this. Some say confession restores standing (you've rejoined the moral community). Others say the damage is done (you still lied initially). Based on what happened here, which view does the group lean toward?"

  **Part C: The Victim's Loss (10 mins)**
  *   "Alex isn't in the room. But imagine Alex heard this. If the person blaming you is a hypocrite, what do *you* lose?"
      *   *Prompt:* Do you lose the lesson? Do you feel resentment instead of guilt? Does the community's validation of the norm weaken?
      *   *Key Insight:* When standing is lost, the blame ceases to be a **moral repair** mechanism and becomes a **power move**. The victim loses the opportunity for genuine reconciliation.

  ---

  ## Predictable Failures (First Run)

  1.  **The "Politeness" Trap:** Judges may feel too awkward to withhold votes or play Challenge Cards. They might vote "Yes" just to be nice, undermining the experience of impotence.
      *   *Mitigation:* In the Hidden Instructions for Judges, bold the text: **"Your grade for this activity depends on rigor, not consensus. You are expected to withhold votes if standing is compromised."**
  2.  **The "Gotcha" Giggle:** Accusers might treat the hypocrisy as a fun secret rather than a moral burden, laughing when revealed.
      *   *Mitigation:* Frame the setup solemnly. "This is a simulation of professional ethics. Treat the roles as real constraints."
  3.  **Confession as a "Get Out of Jail Free" Card:** Students may assume confession instantly fixes everything.
      *   *Mitigation:* Instruct Judges (hidden) that confession *does not guarantee* restored standing; they must deliberate on it.
  4.  **Time Creep:** The deliberation often runs long.
      *   *Mitigation:* Use a visible timer. Cut Phase 1 hard at 15 minutes.

  ---

  ## What This Activity Cannot Reproduce

  **The Emotion of Resentment.**
  In this activity, the "victim" (Alex) is fictional. The Judges are third parties. Therefore, the activity cannot simulate the specific **reactive attitude of resentment** that a real victim feels when blamed by a hypocrite.
  *   *Why it matters:* A major reason standing matters is that hypocritical blame provokes resentment rather than guilt in the target, blocking moral repair.
  *   *How to Supply via Discussion:* In the Debrief (Part C), you must explicitly ask students to *imagine* being Alex. Ask: "If I blame you for lying, but you know I lie, do you feel guilty? Or do you feel angry at *me*?" You must verbally bridge the gap between the *procedural impotence* they saw in class and the *emotional rejection* that happens in real life.

  **The Depth of Betrayal.**
  Because this is a one-off class activity, the "community" is thin. Real standing is built on long-term relationships. The "loss" felt by the Judges will be intellectual/normative, not relational.
  *   *How to Supply via Discussion:* Explicitly state: "In a real community, this hypocrisy damages trust for years. Today, we only saw the immediate procedural block. Imagine this dynamic over a decade."
