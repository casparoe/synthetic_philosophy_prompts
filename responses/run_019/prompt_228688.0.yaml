  **The Grandchildren Quiz: Growth, Time, and the Good Life**

  **Instructions:** Read each scenario and select the statement that best reflects your actual instinct. Do not answer as you think Keynes would; answer as you would if you were responsible for the decision. There are no right answers, only committed ones.

  **1. The Hundred-Year Plan**
  A national government sets an economic target for the next century. What is the goal?
  A. Grow rapidly until everyone is comfortable, then stabilise and focus on culture.
  B. Grow as fast as possible for as long as possible; there is no finish line.
  C. Stop growing immediately to live within ecological means, regardless of comfort.

  **2. The Graduate's Choice**
  You are a talented student choosing your first career path. What drives you?
  A. I will work hard now to secure freedom and leisure for my later years.
  B. I will seek work that is meaningful now, even if it pays less and keeps me busy.
  C. I will pursue the highest income possible because building wealth is its own virtue.

  **3. The Inequality Trade-off**
  A new technology boosts national wealth by 50% but doubles the gap between rich and poor. Do we adopt it?
  A. Yes, but only if we tax the gains heavily to support the poor immediately.
  B. Yes, without restriction; a larger pie helps everyone eventually.
  C. No, preserving social cohesion is more important than increasing total wealth.

  **4. The Motive Force**
  To achieve economic progress, society relies on people wanting more than their neighbours. Is this acceptable?
  A. Yes, but only as a temporary tool until we are rich enough to be virtuous.
  B. Yes, ambition and competition are noble traits that should be celebrated forever.
  C. No, encouraging envy corrupts our character permanently, even if it makes us richer.

  **5. The Ecological Wall**
  Scientists warn that continued growth will breach planetary boundaries within eighty years. What do we do?
  A. Trust innovation to solve the limits; we must keep growing to afford the solutions.
  B. Accept the limits; we must shrink consumption now to avoid catastrophe.
  C. Grow aggressively for now to solve poverty, then deal with the limits later.

  **6. The Future Beneficiary**
  We can invest resources to improve life for people alive today, or save them for people born in 500 years. Who matters more?
  A. The far future; there will be vastly more of them, so their needs outweigh ours.
  B. Our grandchildren; we should solve the economic problem for them, then stop.
  C. People alive now; no one should suffer poverty today for the sake of the distant future.

  **7. The Automation Dividend**
  Robots can now do half of all human labour. How should we use the free time?
  A. Distribute the work so everyone stays employed and contributes meaningfully.
  B. Let people retire early to pursue arts, leisure, and personal relationships.
  C. Use the surplus capacity to build infrastructure for space colonisation and expansion.

  **8. The Moral Hazard**
  If we tolerate greed for a century to solve poverty, what happens when the century is up?
  A. We will switch off greed like a tap; it was only ever a tool.
  B. We will remain greedy; the habit will have become our nature.
  C. We will not want to switch it off; we will have learned to love the striving.

  ***

  **Scoring Key**

  Tally your answers according to the table below. Your highest score indicates your dominant position.

  | Question | A | B | C |
  | :--- | :--- | :--- | :--- |
  | **1** | Keynes | Growth | Degrowth |
  | **2** | Keynes | Work | Growth |
  | **3** | Egalitarian | Growth | Degrowth |
  | **4** | Keynes | Growth | Character |
  | **5** | Growth | Degrowth | Keynes |
  | **6** | Longtermist | Keynes | Egalitarian |
  | **7** | Work | Keynes | Longtermist |
  | **8** | Keynes | Character | Growth |

  **The Seven Leaves**

  *   **Keynes:** Growth is a tunnel with an exit. You endure the grind to secure leisure for your grandchildren, after which the economic problem is solved.
  *   **Growth-optimist:** Striving is not a means but an end. The good life is found in accumulation and ambition, not in the leisure that follows them.
  *   **Degrowth:** There is no daylight at the end of the tunnel. Physical limits require us to stop accumulating now and live within means.
  *   **Egalitarian:** You cannot ignore the short run while people suffer. Justice requires redistribution now, not promises of comfort later.
  *   **Longtermist:** A century is too short. We must keep accumulating to safeguard the potential of billions of future lives.
  *   **Fulfilling-work:** Work is where meaning lives. We should distribute labour rather than abolish it to avoid the boredom of leisure.
  *   **Character:** Instrumental avarice is dangerous. A society that practises greed for a hundred years will find it has stuck.

  **Analytical Notes**

  **Indistinguishable Leaves:** The quiz struggles to reliably separate the **Growth-optimist** and **Longtermist** positions. Both advocate continued accumulation and often select identical policy options (e.g., Q1, Q5, Q7), differing only on the *justification* (intrinsic virtue vs. future welfare) which concrete hypotheticals rarely capture without abstract phrasing. Similarly, **Keynes** and **Fulfilling-work** overlap on reducing hours (Q7), differing on whether the goal is leisure or meaningful contribution.

  **Collapsed Positions:** None. While Growth and Longtermism vote similarly, their ethical foundations differ enough to warrant distinct categories in a PPE context.

  **Awkward Commitments**

  *   **Keynes:** You must assume boredom is manageable once the economic problem is solved.
  *   **Growth-optimist:** You must accept significant inequality as the price of perpetual striving.
  *   **Degrowth:** You must accept that the global poor may never reach current Western living standards.
  *   **Egalitarian:** You must risk slowing total growth which might otherwise lift everyone eventually.
  *   **Longtermist:** You must accept sacrificing the comfort of the current generation for people who do not yet exist.
  *   **Fulfilling-work:** You must believe leisure is inherently less valuable than productive labour.
  *   **Character:** You must believe human moral psychology is too rigid to adapt to new economic conditions.
