answer: |-
  "Group-level explanations are legitimate only when groups themselves vary, reproduce, and die differential to other groups in a way that cannot be reduced to individual advantage within the group."

  ### Conceptual Toolkit: What to Keep and What to Drop

  To function as a lay panel, you must discard the metaphysical wars and keep the causal checks.

  **Drop:** The debate over whether Multi-Level Selection (MLS) and Inclusive Fitness (Kin Selection) are mathematically equivalent. They are. Treating them as rival truths is a verbal dispute over bookkeeping. Do not reject a proposal simply because it uses MLS math instead of Hamilton's Rule, or vice versa. This distinction creates heat without light for funding decisions.

  **Keep:** Lewontin's conditions for selection (Variation, Heritability, Differential Fitness) applied strictly to the proposed unit. If the "group" does not reproduce or dissolve, it cannot be selected. Keep the **Byproduct Problem**: distinguish between traits that benefit the group *because* they benefit the individual (selfish herd) versus traits that benefit the group *despite* costing the individual (altruism). Keep the **Replicator/Vehicle** distinction: genes replicate; organisms and groups are vehicles. If the proposal claims the group is the replicator, demand evidence of group reproduction.

  ### The Decision Procedure

  Run every proposal through these four questions in order. Terminate at the first definitive verdict.

  **Step 1: The Lewontin Check (Group Level)**
  *Question:* Does the proposal define the "group" as a unit that exhibits variation, heritability, and differential fitness independent of its members?
  *   **Sufficient Answer:** Yes, if groups bud, fission, or go extinct at different rates based on trait composition, and new groups resemble parent groups.
  *   **Insufficient Answer:** No, if groups are temporary aggregations (e.g., a herd of deer) that do not reproduce as units.
  *   **Verdict:** If **No**, terminate. **Reject** or require reframing as individual selection. The mechanism is logically impossible.
  *   **Judgment Call Flag:** Determining "heritability" of groups is empirical. If the proposal asserts it without data, flag for reviewer expertise.

  **Step 2: The Byproduct Check (Individual Cost)**
  *Question:* Is the trait costly to the individual organism possessing it?
  *   **Sufficient Answer:** Yes, if the trait reduces the individual's survival or reproduction relative to selfish mutants within the same group.
  *   **Insufficient Answer:** No, if the trait benefits the group *and* the individual (e.g., camouflage that hides the herd but also hides you).
  *   **Verdict:** If **No**, terminate. **Reframe.** This is individual selection producing a group benefit as a side effect. Fund only if the PI agrees to remove "group selection" claims.
  *   **Judgment Call Flag:** Measuring "cost" is often context-dependent.

  **Step 3: The Within-Group Pressure Check**
  *Question:* Is there a selective pressure *within* the group acting against the trait?
  *   **Sufficient Answer:** Yes, if "cheaters" (individuals who don't perform the trait) would outcompete cooperators within the same group.
  *   **Insufficient Answer:** No, if the trait is individually advantageous regardless of group context.
  *   **Verdict:** If **No**, terminate. **Reframe.** Group selection is unnecessary to explain the trait's maintenance.
  *   **Judgment Call Flag:** This requires modeling or empirical data on cheating. If absent, mark as "High Risk."

  **Step 4: The Heuristic Check (MLS vs. Kin)**
  *Question:* Is the dispute merely about whether to model this via group fitness or inclusive fitness?
  *   **Sufficient Answer:** Yes, if the math translates between the two (e.g., high relatedness among group members).
  *   **Verdict:** **Fund.** Do not penalize the PI for choosing one mathematical language over the other, provided Steps 1–3 are satisfied. This is a stylistic choice, not a validity check.

  ### Test Cases

  **Case 1: Eusociality in Hymenopteran Insects**
  *   **Step 1:** Do colonies reproduce? Yes, via swarming/fission.
  *   **Step 2:** Is sterility costly to the worker? Yes, zero direct reproduction.
  *   **Step 3:** Is there within-group pressure? Yes, workers could theoretically lay eggs (cheating), but are policed.
  *   **Step 4:** MLS vs. Kin? High relatedness makes Kin Selection the parsimonious language, but MLS models work.
  *   **Verdict:** **Fund.** The mechanism is sound. Do not require them to switch to Kin Selection language, but ensure they acknowledge high relatedness.
  *   **Outcome:** Generally acceptable to both sides.

  **Case 2: Bird Alarm Calls Attracting Predator Attention**
  *   **Step 1:** Do bird flocks reproduce? No. Flocks dissolve and reform; they do not bud.
  *   **Step 2:** Is the call costly? Yes, increases predation risk.
  *   **Step 3:** Within-group pressure? Yes, silent birds survive better than callers.
  *   **Analysis:** Step 1 fails. Groups are not replicators. The trait persists due to kin selection (calling to save relatives) or reciprocity, not group selection.
  *   **Verdict:** **Fund only if reframed.** The PI must remove "group selection" and specify kin selection or reciprocal altruism.
  *   **Outcome:** Annoys the "group benefit" crowd, satisfies the gene-selectionists.

  **Case 3: Pathogen Evolving Reduced Virulence (Restraint)**
  *   **Step 1:** Do pathogen populations within hosts reproduce as groups? No. Transmission is usually bottlenecked to few particles.
  *   **Step 2:** Is restraint costly? Yes, slower replication means lower within-host competition.
  *   **Step 3:** Within-group pressure? Yes. Aggressive strains outcompete restrained strains within the same host.
  *   **Analysis:** Step 1 and 3 fail. "Prudent predators" is largely a debunked notion. Virulence is driven by within-host competition (individual selection), not host survival (group selection).
  *   **Verdict:** **Reject.** The proposal relies on a mechanism (group selection for host survival) that is overwhelmed by individual selection (within-host competition).
  *   **Outcome:** **This verdict will be hated.** The half of your committee that waves "good of the species" proposals through will argue that host death limits transmission.

  ### Managing Dissent

  When the committee splits on the Pathogen verdict, here is your script:

  "To the members advocating rejection: You are correct that within-host competition usually drives virulence up. However, to the members advocating funding: You are arguing for transmission trade-offs, not group selection. A virus doesn't spare the host 'for the good of the species'; it sparing the host is a side-effect of maximizing transmission opportunities. That is individual-level selection on the virus, not group selection. We can fund the work on virulence evolution, but we cannot fund the claim that it evolves 'for the good of the host.' That is a category error."

  **Final Note on Judgment Calls:**
  Steps 2 and 3 are where the science lives, not the philosophy. If a proposal claims a trait is "costly" without data, that is an empirical failure, not a theoretical one. Mark those proposals as "High Risk" rather than rejecting them outright on philosophical grounds. The procedure prevents logical impossibilities; it does not guarantee empirical success.
