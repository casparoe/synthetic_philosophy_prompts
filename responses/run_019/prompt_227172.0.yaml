answer: |-
  This is a textbook case of "bureaucratic ontology" clashing with biological reality. You are not overreading the situation; you have identified the exact friction points where administrative necessity tries to wear the mask of natural law. The frustration you feel comes from the board trying to enforce a metaphysical purity that the biology (and the climate) refuses to sustain.

  Here is a breakdown of the ontological presuppositions, the conflicts between the rules, and what would change if you admitted the "kinds" are management tools rather than discovered truths.

  ### 1. The Ontological Conflicts Between the Three Rules
  Your county policy is not a single philosophical system; it is a patchwork of three incompatible ontologies stitched together to satisfy different stakeholders (lawyers, scientists, and insurers).

  *   **The 40 km / Pre-1960 Rule (Historical Essentialism)**
      *   **Presupposition:** This rule assumes there was a "true" state of the wetland prior to 1960 (likely a proxy for pre-industrial or pre-suburban expansion) and that geography (40 km) correlates with genetic fitness.
      *   **Ontology:** It treats "native" as a **spatiotemporal essence**. A plant is "correct" if it occupies the same coordinate space it did in a specific historical era.
      *   **The Conflict:** This assumes the environment of 1960 is the target environment. It ignores that the "joints" of nature may have moved due to climate change, pollution, or hydrology shifts (like your flooding).

  *   **The Climate Resilience Clause (Functionalism)**
      *   **Presupposition:** Survival and function (heat tolerance) matter more than origin.
      *   **Ontology:** This treats species as **Homeostatic Property Clusters (HPC)**. If the southern stock holds the cluster of properties needed to survive heat and stabilize soil, it counts as the "kind" of plant we need, regardless of lineage.
      *   **The Conflict:** This directly contradicts the Historical Essentialism of the 40 km rule. It admits that the "joints" of nature are moving and that the 1960 baseline is no longer functional.

  *   **The Genetic Hybrid Rule (Lineage Essentialism with a Time Decay)**
      *   **Presupposition:** Ancestry matters, but "ancient" mixing is sanitized while "recent" mixing is contamination.
      *   **Ontology:** This is **Lineage Essentialism**, but with a "statute of limitations." It assumes a hybrid from 1950 is effectively "pure" because it has been naturalized, while a hybrid from 2020 is "impure."
      *   **The Conflict:** Biologically, a hybrid is a hybrid. The DNA doesn't care about the calendar. This rule presupposes that *time* confers *nativeness*. This is not a biological fact; it is an ecological integration metric dressed up as genetic purity.

  ### 2. What Picture of Natural Kinds is Presupposed?
  The practice presupposes a **Schizoid Realism**.

  Officially, the policy speaks like a **Realist**: It acts as if "Local Eelgrass" is a natural kind with fixed boundaries that scientists can discover via herbarium sheets and genetic sequencing. It assumes nature *has* joints, and the 1960 specimens track them.

  However, the *exceptions* reveal a **Pragmatic Constructivist** reality. The board knows the "joints" are blurry. They allow southern stock (constructing a new kind of "resilient eelgrass") and they forgive old hybrids (constructing a category of "acceptable mutt").

  **The "Hybrid Anxiety" Question:**
  Does rejecting the southern hybrid while accepting the local one require an essence view?
  *   **Strictly:** Yes, if you believe the rejection is based on *purity*. If they think the southern strain has "contaminated blood," that is essentialism.
  *   **Pragmatically:** No. You can justify this on a **Risk Management View**.
      *   *Old Hybrid:* We have 70 years of data showing it doesn't invade aggressively or collapse. It is a "known quantity."
      *   *New Hybrid:* We have 0 years of data. It might be invasive, or it might collapse in a cold snap.
      *   *Verdict:* The anxiety isn't about metaphysics; it's about liability. But the board *talks* about it like metaphysics because "genetic purity" sounds more authoritative than "we don't want to get sued if the new plants die."

  ### 3. Policy Commitments vs. "Vibes"
  It is crucial to separate what the policy legally requires from the cultural narrative surrounding it.

  | Feature | **Strict Policy Commitment** | **The "Vibe" (Unstated Ontology)** |
  | :--- | :--- | :--- |
  | **1960 Baseline** | An administrative cut-off for grant eligibility and legal defense. | **The Eden Myth:** The belief that there is a "correct" historical state we can and should return to. |
  | **40 km Rule** | A proxy for local adaptation to reduce transport costs and legal risk. | **Soil & Blood:** The idea that plants belong to a specific patch of earth morally, not just ecologically. |
  | **Genetic Testing** | A risk assessment tool to prevent invasive introgression. | **Purity Culture:** The idea that "mixed" genetics are inherently inferior or dangerous (the "hybrid anxiety"). |
  | **Warming Clause** | A loophole to ensure project success (plants must live). | **Technocratic Control:** Nature is a machine we can tune by swapping parts from other regions. |

  ### 4. What Changes if We Admit Kinds are Made by Management Goals?
  If the board admitted that "native species" are partly constructed by their goals (flood mitigation, grant compliance) rather than discovered in the herbarium, three concrete things would change:

  1.  **Success Metrics Shift:** Currently, success is defined as *compliance* (did we plant the right seeds?). If admitted as a management construct, success would be *performance* (did the flooding stop? did the water quality improve?). You could plant a southern hybrid explicitly as a "climate adaptation strain" rather than hiding it behind a "functional equivalence" clause.
  2.  **Transparency on Hybrids:** Instead of rejecting the southern strain for "ancestry," they would evaluate it on "trait stability." They would admit that the "local" line is also a managed cultivar, not a wild relic. This lowers the stakes on genetic testing; it becomes about *predictability*, not *purity*.
  3.  **Dynamic Baselines:** The 1960 date would be abandoned for a "forward-looking baseline." Instead of restoring the wetland to 1960 conditions, the goal would be restoring *function* for 2050 conditions. This acknowledges that the "natural kind" of Wetland is a moving target.

  ### 5. Is the Practice Incoherent or Just Underdetermined?
  **The Verdict:** The practice is **operationally stable but ontologically incoherent.**

  You are not overreading this because you are annoyed. You are correctly identifying that the board is trying to serve two masters:
  1.  **The Law/Grants:** Which require bright, static lines (1960, 40 km, Pure Native).
  2.  **The Ecology:** Which is dynamic, messy, and hybridizing.

  **Why it feels incoherent:**
  The board is using **Essentialist language** ("native," "local ecotype," "genetic ancestry") to justify **Pragmatic decisions**.
  *   When they reject the southern hybrid, they use Essentialist language ("impure ancestry").
  *   When they accept the local hybrid, they use Pragmatic language ("it's established").
  *   When they allow southern stock for heat, they use Functionalist language ("resilience").

  **Is it fixable?**
  Not without breaking the grant structure. The incoherence is a feature, not a bug. It allows them to claim they are "preserving nature" (which gets grants) while actually "engineering resilience" (which keeps the water off your floor).

  **Advice for the Volunteer:**
  Stop asking them to define "native." They can't, because the definition changes depending on which rule they are trying to satisfy. Instead, ask: *"What specific risk does the southern hybrid pose that the local hybrid does not, given that both are genetically mixed?"*

  If they answer with "ancestry," they are being essentialist.
  If they answer with "lack of performance data," they are being pragmatic.
  If it's the latter, you can propose a pilot study to generate that data. If it's the former, you know you're fighting a metaphysical ghost, not a biological fact.
