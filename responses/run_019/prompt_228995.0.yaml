answer: |-
  Here is my assessment as a philosopher of physics, breaking down the credence that Gödel's conclusion (no objective lapse of time) would be correct *if* future evidence confirmed our universe permits closed timelike curves (CTCs).

  ### Probability Decomposition

  To arrive at a final credence, I am treating this as a chain of conditional probabilities. For Gödel's conclusion to be vindicated by this announcement, three independent hurdles must be cleared: classical general relativity must hold without quantum interference, the physics of CTCs must entail a block ontology, and global topology must dictate local temporal experience.

  | Term | Symbol | Estimate | Justification |
  | :--- | :---: | :---: | :--- |
  | **1. GR Causal Authority** | $P_{GR}$ | 0.60 | Hawking's Chronology Protection Conjecture suggests quantum effects may diverge to prevent CTCs even if classical GR allows them. |
  | **2. Metaphysical Entailment** | $P_{Meta}$ | 0.70 | While CTCs strongly favor the "block universe," some compatibilist theories argue objective becoming can exist locally even with global loops. |
  | **3. Global-Local Supervenience** | $P_{Scope}$ | 0.85 | If time is non-linear globally, it is highly probable that local "flow" is an illusion, though strict logical entailment is not guaranteed. |

  **Calculation:**
  $$ P(\text{Conclusion} | \text{Announcement}) = P_{GR} \times P_{Meta} \times P_{Scope} $$
  $$ 0.60 \times 0.70 \times 0.85 = 0.357 $$

  **Final Credence:** **~36%**

  ***

  ### The Weakest Link: Metaphysical Entailment ($P_{Meta}$)

  I am least confident in **Term 2 (Metaphysical Entailment)**. This term represents the leap from "spacetime has a CTC topology" to "objective becoming is impossible." While most physicists assume CTCs imply a static block, this is not a deductive truth. There are sophisticated "presentist" or "growing block" models in the literature that attempt to salvage objective becoming by restricting truth values to local slices or defining becoming relative to worldlines rather than global hypersurfaces.

  **What would move this probability?**
  A rigorous formulation of **"Local Becoming"** that is mathematically consistent with CTCs would drastically lower my credence in Gödel's conclusion. Conversely, if a theory of Quantum Gravity emerges that not only permits CTCs but explicitly eliminates the time parameter from its fundamental equations (as in some Wheeler-DeWitt approaches), $P_{Meta}$ would rise toward 1.0. Currently, the lack of a consensus on how to interpret time in non-globally-hyperbolic spacetimes keeps this probability suppressed.

  ***

  ### The Verdict: You vs. Your Brother-in-Law

  This is a classic clash between **modal metaphysics** (your position) and **empirical actualism** (your brother-in-law's position). To adjudicate, we must steelman both.

  **Steelmanning You:**
  Your argument rests on the idea that the *nature* of time should not be contingent on accidental cosmological parameters. If time is a fundamental feature of reality, it shouldn't "exist" in a non-rotating universe but "vanish" in a rotating one. Gödel's point was that if General Relativity is our best theory of spacetime, and it permits worlds without objective time, then objective time cannot be a fundamental feature of the theory's ontology. You are correctly identifying that the philosophical stakes lie in what is *nomologically possible*, not just what is actual.

  **Steelmanning Your Brother-in-Law:**
  His position is that physics describes the *actual* world, not the space of all mathematical solutions. If the actual universe is globally hyperbolic (no CTCs), then the causal structure that supports our intuition of "one damn thing after another" remains intact. He is rightly pointing out that inferring the nature of *our* time from a *different* possible universe commits a modal fallacy unless one assumes time's nature is necessary across all possible worlds—an assumption GR does not force upon us.

  **The Decision:**
  **Your brother-in-law is closer to the mark, though perhaps for simplistic reasons.**

  Here is why: The consensus among modern philosophers of physics (following John Earman's critiques) is that Gödel's **modal step is invalid**. You cannot infer that time is ideal *here* simply because it is ideal *there*, unless you assume that the ontology of time must be uniform across all solutions of GR. There is no justification for that assumption; time could be an emergent property that arises in non-rotating, low-energy configurations (like ours) even if it vanishes in high-energy rotating ones.

  Therefore, the empirical question is **not** beside the point. If we live in a non-rotating universe, Gödel's argument tells us nothing about *our* time. However, you gain significant ground if the CMB announcement actually happens. If CTCs are discovered *in our universe*, you no longer need Gödel's shaky modal inference; you would have direct empirical evidence that the causal structure required for "objective lapse" is missing.

  So, while your intuition about the philosophical depth is sharper, his insistence on empirical relevance is logically stronger under current orthodoxy. If that future announcement comes, you win—not because your modal argument was right, but because the empirical facts would finally align with the conclusion.
