prompt: |-
  I’m a PhD student in political philosophy, working on secession and self-determination, and I keep going back and forth between the remedial view of the right to secede (unilateral exit only as a remedy for serious injustice) and the plebiscitary/primary-right view (a nationally-defined group’s majority vote is enough). Somebody brings up Scotland or Catalonia or Quebec and I realize I don’t actually know what I’d want a full theory of the right to secede to do before it starts adjudicating those cases. So treat me like a colleague. You’re an expert on the ethics of self-determination and territorial rights. Think carefully, and before you commit to a list, brainstorm candidate requirements first and then prune the ones that are really just parochial.

  What I want is the specification: a list of requirements a theory of the right to secede has to satisfy to count as adequate. Not a bibliography, not a reading list, and don’t skip ahead to defending one theory—I want the criteria themselves. The theory should be good enough to evaluate the standard three (Scotland, Catalonia, Quebec), but it should also be able to handle Kosovo, Kurdistan, Bangladesh, and weird recursive cases like the Cree in northern Quebec if Quebec left. For each requirement, give the consideration or case that puts it on the list, then say whether it’s non-negotiable or just a preference of one camp.

  Some distinctions I’m pretty sure the theory can’t collapse, but I want you to check me: unilateral secession vs negotiated divorce; the group’s right vs whether secession is wise or justified all-things-considered; who counts as “the people” (and the circularity of defining the unit by the outcome); what to do about minorities inside the seceding territory; and how far back a grievance can reach before it stops counting. 

  I’m genuinely unsure about some candidate requirements, so tell me wich of these belong on the list and which are bogus: economic viability of the new state; respect for the parent state’s constitution (Scotland’s referendum was legal, Catalonia’s wasn’t); a supermajority rather than 50%+1; a distinct language, history, or institutions; and whether outsiders are permitted—or bound—to recognize the new state. 

  The part I most need: if some subset of these requirements is jointly unsatisfiable—for example, respecting the parent state’s constitution and recognizing a remedial right when the parent state is the abuser—say so, and explain what we should conclude from that. Then tell me which single requirement does the most work in knocking out candidate theories, and why. A table is fine if it’s easier to read, but don’t let the table hide the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in political philosophy (colleague level).
      *   **Topic:** Ethics of secession and self-determination.
      *   **Problem:** Oscillating between Remedial Right Only (RRO) and Primary Right (PR) theories. Needs to define *adequacy criteria* for a theory *before* applying it to cases.
      *   **Task:** Specify a list of requirements a theory of the right to secede must satisfy to be adequate.
      *   **Constraints:**
          *   Treat as a colleague (high level of sophistication, no basic definitions).
          *   Brainstorm candidate requirements first, then prune parochial ones.
          *   Do *not* provide a bibliography or reading list.
          *   Do *not* defend one specific theory (RRO vs. PR).
          *   Must handle standard cases (Scotland, Catalonia, Quebec) + hard cases (Kosovo, Kurdistan, Bangladesh, recursive cases like Cree in Quebec).
          *   For each requirement: Give the consideration/case motivating it, and label it Non-Negotiable (NN) or Camp Preference (CP).
          *   Address specific candidate requirements provided by the user (economic viability, constitutionality, supermajority, cultural distinctness, external recognition).
          *   Identify jointly unsatisfiable requirements (trilemmas/dilemmas) and explain the implication.
          *   Identify the single requirement that does the most work in knocking out candidate theories.
          *   Format: Text is fine, table is okay if reasoning isn't hidden.

  2.  **Deconstruct the Philosophical Landscape:**
      *   The core tension is between *Justice/Stability* (Remedial) and *Democracy/Autonomy* (Primary/Plebiscitary).
      *   Key theorists implicitly referenced: Buchanan (Remedial), Beran (Plebiscitary), Wellman (Associative), Patten (Equal Treatment), Stilz (Territorial Rights).
      *   The user wants *meta-theoretical criteria* for evaluating these theories, not the theories themselves. This is a "theory of theory-construction" task.

  3.  **Brainstorming Candidate Requirements:**
      *   *Coherence:* Internal logical consistency.
      *   *Moral Plausibility:* Fits with basic intuitions about freedom and justice.
      *   *Feasibility/Stability:* Doesn't lead to endless war or fragmentation.
      *   *Determinacy:* Can actually tell us who votes and where the border is.
      *   *Minority Protection:* Doesn't create new tyrannies.
      *   *Historical Sensitivity:* Accounts for past injustice without being bound by ancient history.
      *   *Constitutional Fit:* Respects rule of law vs. right to revolution.
      *   *External Recognition:* Criteria for other states.
      *   *Economic Viability:* Can the new state survive?
      *   *Cultural Distinctness:* Is nationhood required?
      *   *Threshold:* 50%+1 vs. Supermajority.

  4.  **Pruning Parochial/Secondary Requirements:**
      *   *Economic Viability:* This is often a prudential constraint, not a moral right. A poor people still have rights. (Likely CP or bogus as a *right* condition).
      *   *Constitutional Legality:* If the constitution forbids all secession, does that negate the moral right? RRO says no. PR says maybe. This is a tension point. (Likely CP/Contested).
      *   *Supermajority:* Why 60%? Arbitrary. 50%+1 is standard democratic threshold. (Likely CP).
      *   *Cultural Distinctness:* Civic vs. Ethnic nationalism. A theory shouldn't *require* ethnicity, but might need *some* definition of the unit. (Nuanced).
      *   *External Recognition:* This is about *effectiveness*, not the *right* itself. (Distinct from the moral right).

  5.  **Developing the "Non-Negotiable" vs. "Camp Preference" Distinction:**
      *   *NN:* Must be satisfied for *any* plausible liberal-democratic theory. (e.g., Minority protections, Determinacy).
      *   *CP:* Distinguishes RRO from PR. (e.g., Need for injustice, Constitutional consent).

  6.  **Addressing the User's Specific Doubts:**
      *   *Economic Viability:* Bogus as a condition for the *right*. Relevant for *recognition*.
      *   *Constitution:* Major fault line. RRO ignores it if unjust; PR often seeks accommodation.
      *   *Supermajority:* Bogus. Lacks principled basis.
      *   *Cultural Distinctness:* Bogus as a necessary condition (civic secession possible), but relevant for *stability*.
      *   *External Recognition:* Crucial for *success*, distinct from the *moral right*.

  7.  **Identifying Joint Unsatisfiability (The Trilemma):**
      *   The "Secessionist Trilemma" (often associated with Norman or Buchanan).
      *   1. Democratic Principle (Majority will).
      *   2. Territorial Integrity/Stability (No endless fragmentation).
      *   3. Protection of Minorities (No new oppressions).
      *   *Alternatively:* Constitutionality vs. Remedial Right. If the state is unjust, the constitution is likely rigged. You can't respect the constitution and remedy the injustice simultaneously.
      *   *Decision:* The Constitution vs. Moral Right tension is the most pressing for the user's specific examples (Catalonia vs. Scotland).

  8.  **Identifying the "Knockout" Requirement:**
      *   What kills the most theories?
      *   *The Boundary Problem (Who votes?).* Almost every theory struggles to define the unit non-circularly without presupposing the answer.
      *   *The Stability/Fragmentation Constraint.* Primary right theories often fail here. Remedial theories often fail on the "injustice threshold."
      *   *Selection:* The **Non-Circularity of the Unit Definition** (Who constitutes "the people"?). This is the hardest technical hurdle. If a theory can't define the voting unit without assuming the border, it fails.

  9.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Collegial, precise, philosophical.
      *   *Structure:*
          1.  Intro (Acknowledging the task).
          2.  Brainstorm & Prune (The filtering process).
          3.  The Specification List (The core deliverable).
          4.  Addressing User's Specific Candidates.
          5.  The Inconsistency/Trilemma.
          6.  The Knockout Requirement.
      *   *Content Check:* Did I cover Kosovo? (Remedial). Kurdistan (Stateless nation). Bangladesh (Successful secession). Cree (Recursive).
      *   *Refining the "Constitution" point:* It's not just about legality; it's about the moral weight of legalism.
      *   *Refining the "Knockout":* I need to be careful. Is it the Boundary Problem or the Stability Constraint? The Boundary Problem is more fundamental to the *logic* of the theory. Stability is a consequence. I'll argue for the **Non-Circular Demarcation Constraint**.

  10. **Final Review against Constraints:**
      *   No bibliography? Check.
      *   No defending one theory? Check.
      *   Table allowed? Yes, but don't hide reasoning.
      *   Address specific doubts? Yes.
      *   Address joint unsatisfiability? Yes.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe "Economic Viability" is NN for *recognition*.
      *   *Correction:* The prompt asks for a theory of the *right* to secede, not the *success* of secession. Keep them distinct.
      *   *Initial thought:* Maybe the "Constitution" requirement is NN.
      *   *Correction:* No, that biases toward the status quo. RRO explicitly rejects this in cases of tyranny. Mark as CP.
      *   *Focus:* Ensure the distinction between the *right to secede* (moral claim) and the *legitimacy of recognition* (international relations) is clear.

  12. **Final Polish:** Ensure the distinction between NN and CP is sharp. Ensure the "Knockout" argument is robust. (The "Who Votes?" problem is the classic philosophical hurdle).

  *(Self-Correction on the "Knockout"):* Actually, the **Stability/Fragmentation Constraint** is often what kills Primary Right theories in the literature (the "domino effect"). But the **Boundary Problem** kills the *coherence* of the theory. I will argue the Boundary Problem is the deeper philosophical failure point, while Stability is the pragmatic failure point. Given the user is a philosopher, the Boundary Problem is the stronger "knockout."

  Wait, let's look at the "Jointly Unsatisfiable" section. The tension between *Constitutional Legality* and *Remedial Justice* is the most practical one (Catalonia). The tension between *Primary Right* and *Stability* is the most theoretical one. I should address the Constitution/Justice tension as the "Inconsistency" because the user specifically asked about Scotland/Catalonia.

  Okay, let's write.
answer: |-
  This is the right move. Too much of the literature jumps straight to "Buchanan vs. Beran" without establishing what a successful theory must *achieve*. If we don't fix the adequacy conditions first, we just talk past each other about intuitions regarding specific cases.

  Here is the specification. I have broken this down into the brainstorming/pruning phase, the final list of requirements, an assessment of your specific candidate requirements, and finally the structural problems (inconsistencies and knockouts).

  ### Phase 1: Brainstorming and Pruning

  To get to the adequate list, we have to distinguish between *moral conditions for the right*, *prudential conditions for success*, and *institutional conditions for implementation*.

  **Candidate Pool:**
  1.  **Moral Justification:** Must explain *why* secession is permissible (justice vs. autonomy).
  2.  **Unit Definition:** Must define "the people" without circularity.
  3.  **Minority Protection:** Must account for those left behind or trapped inside.
  4.  **Stability:** Must not incentivize endless fragmentation or strategic bargaining.
  5.  **Constitutional Legality:** Must align with domestic rule of law.
  6.  **Economic Viability:** The new state must be able to function.
  7.  **External Recognition:** Criteria for other states to acknowledge the new entity.
  8.  **Historical Grievance:** How far back does injustice count?
  9.  **Democratic Threshold:** What % vote is required?
  10. **Cultural Distinctness:** Must the group be a "nation"?

  **Pruning Parochial/Secondary Constraints:**
  *   *Economic Viability:* **Prune as a condition of the *right*.** A group does not lose its moral right to freedom because it is poor. This is a condition for *recognition* or *feasibility*, not the moral right itself.
  *   *Cultural Distinctness:* **Prune as necessary.** Civic secession is conceptually possible. A theory requiring ethnic/linguistic homogeneity is illiberal. However, a theory must explain *why* this specific territory is the unit of secession.
  *   *External Recognition:* **Prune as distinct.** This is international law/politics, not normative political philosophy. A theory of the *right* must stand even if recognition is withheld (e.g., Bangladesh 1971).
  *   *Supermajority:* **Prune.** There is no principled reason to prefer 60% over 50%+1 unless tied to a specific stakes argument (which belongs under 'Threshold').

  ---

  ### Phase 2: The Specification List

  Here are the requirements an adequate theory must satisfy. I have distinguished between **Non-Negotiable (NN)** constraints (any plausible liberal-democratic theory must meet these) and **Camp Preferences (CP)** (where Remedial and Primary Right theories diverge).

  | Requirement | Motivation / Case | Status |
  | :--- | :--- | :--- |
  | **1. Non-Circular Demarcation** | **Case:** The "Cree in Quebec" problem. If the right to secede belongs to "the people," the theory must define the unit *before* the vote. If the unit is defined by the outcome of the vote, the theory is circular. <br> **Consideration:** A theory fails if it cannot specify *who votes* and *where the border is* without presupposing the legitimacy of the secession itself. | **NN** |
  | **2. Minority Safeguards** | **Case:** Secession often creates new minorities (e.g., Spaniards in Catalonia, Anglophones in Quebec). <br> **Consideration:** A theory cannot permit secession if it inherently creates a new tyrannical majority over a trapped minority. It must specify rights for internal minorities or boundary adjustments. | **NN** |
  | **3. Stability / Non-Fragmentation** | **Case:** Recursive secession (Cree in Quebec, Catalonia in Spain, regions within Catalonia). <br> **Consideration:** A theory must not generate an infinite regress of secessionist claims that make territorial sovereignty impossible. It must explain why the seceding unit gets to secede but the sub-unit inside it might not. | **NN** |
  | **4. Determinacy of Trigger** | **Case:** Kosovo (injustice) vs. Scotland (consent). <br> **Consideration:** The theory must provide a clear threshold for when the right is activated. Vague appeals to "oppression" or "identity" allow for strategic manipulation. | **NN** |
  | **5. Constitutional Fit** | **Case:** Scotland (legal referendum) vs. Catalonia (unilateral/illegal). <br> **Consideration:** Does the moral right depend on the parent state's legal permission? RRO says no; PR often seeks accommodation. | **CP** |
  | **6. The Injustice Threshold** | **Case:** Bangladesh (genocide) vs. Quebec (no serious injustice). <br> **Consideration:** For RRO, serious injustice is necessary. For PR, it is irrelevant. The theory must specify if injustice is a *necessary condition* or merely a *strengthening condition*. | **CP** |
  | **7. Asset and Liability Division** | **Case:** Divorce analogies. Who keeps the debt? The oil? The currency? <br> **Consideration:** A theory of the *right* to leave is incomplete without a theory of the *terms* of leaving. Unfair division can negate the justice of the secession. | **NN** |

  ---

  ### Phase 3: Assessing Your Specific Doubts

  You asked me to vet five specific candidate requirements. Here is the verdict:

  1.  **Economic Viability:** **Bogus (as a moral condition).**
      *   *Reasoning:* This conflates the *right* to secede with the *capacity* to succeed. If a theory says "You have a right to secede only if you are rich enough," it effectively makes liberty a commodity. It belongs in the theory of *recognition*, not the theory of the *right*.
  2.  **Respect for Parent State's Constitution:** **Camp Preference (CP).**
      *   *Reasoning:* This is the fault line. If you make this Non-Negotiable, you rule out Remedial Right Only theories in cases where the constitution is rigged to prevent exit (e.g., USSR, or arguably Spain 2017). If you make it optional, you risk anarchy. An adequate theory must *address* this, but cannot mandate constitutionality as a universal moral precondition.
  3.  **Supermajority (vs. 50%+1):** **Bogus.**
      *   *Reasoning:* There is no philosophical principle that dictates 60% or 2/3rds for constitutional change of this magnitude that doesn't also apply to regular elections. Unless tied to a specific "stakes" argument (e.g., irreversible change requires higher consensus), it is arbitrary.
  4.  **Distinct Language/History/Institutions:** **Bogus (as a necessary condition).**
      *   *Reasoning:* This privileges ethnic nationalism over civic nationalism. A region could theoretically secede based on political divergence alone (e.g., a libertarian zone). However, distinct institutions often help solve the **Non-Circular Demarcation** problem (Req #1). So, useful heuristically, but not morally necessary.
  5.  **Outsiders Permitted/Bound to Recognize:** **Crucial Distinction.**
      *   *Reasoning:* This is not a requirement for the *existence* of the right, but for its *efficacy*. A theory must explain the *conditions for recognition*, but the moral right exists prior to recognition. Don't collapse the two.

  ---

  ### Phase 4: Joint Unsatisfiability (The Trilemma)

  You asked if some subset of requirements is jointly unsatisfiable. Yes. There is a tension I call the **Legitimacy-Stability Trilemma**. You can satisfy any two, but rarely all three:

  1.  **Democratic Consent:** (The majority in a territory decides).
  2.  **Territorial Integrity:** (The parent state's borders are stable/protected).
  3.  **Remedial Justice:** (Victims of injustice can exit unilaterally).

  **The Conflict:**
  *   If you prioritize **Consent + Integrity**, you get the **Constitutionalist View** (Scotland). But this fails **Remedial Justice** (Catalonia/Kosovo: if the constitution forbids exit, the victims are trapped).
  *   If you prioritize **Consent + Remedial Justice**, you get **Primary/Plebiscitary Right**. But this fails **Territorial Integrity** (Recursive secession: if any majority can leave, borders become fluid and unstable).
  *   If you prioritize **Integrity + Remedial Justice**, you get **Strict Remedial Right Only**. But this fails **Democratic Consent** (A group might want to leave for non-injustice reasons, e.g., policy divergence, and are forced to stay).

  **What to conclude:**
  An adequate theory cannot claim to solve this perfectly. It must explicitly state which horn it is sacrificing.
  *   *Recommendation:* Do not try to resolve this by smoothing it over. The mark of an adequate theory is that it **acknowledges the trade-off**. If a theory claims to satisfy all three without remainder, it is likely hiding a premise (usually about who defines the "territory").

  **Specific Inconsistency: Constitution vs. Remedial Right**
  You noted the tension between respecting the constitution and recognizing a remedial right when the parent state is the abuser.
  *   **Verdict:** These are **Jointly Unsatisfiable** in hard cases.
  *   **Explanation:** If the state is committing serious injustice (the trigger for RRO), it is highly probable the legal/constitutional framework is part of the mechanism of that injustice (e.g., gerrymandering, suppressing language, rigging courts).
  *   **Conclusion:** A theory must rank these. If "Constitutional Legality" is a Non-Negotiable requirement, the theory collapses into status-quo bias and cannot handle Kosovo or Bangladesh. Therefore, **Constitutional Legality must be demoted to a Prima Facie duty, not an Absolute Constraint.**

  ---

  ### Phase 5: The Knockout Requirement

  You asked which single requirement does the most work in knocking out candidate theories.

  **The Winner: Non-Circular Demarcation (Requirement #1)**

  **Why?**
  This is the "Who Votes?" problem. It is the philosophical sinkhole where most theories drown.

  1.  **Primary Right Theories:** They usually say "A majority in a territory can vote." But *which* territory? If Catalonia votes, why can't Barcelona vote separately? If the answer is "The historical region," why does history matter morally? If the answer is "The group that wants to vote," the theory is circular (the group is defined by the desire to secede).
  2.  **Remedial Right Theories:** They say "Victims of injustice can leave." But *which* victims? If the injustice is targeted at a specific ethnic group dispersed across the state, do they get to take territory? If the injustice is territorial (e.g., resource extraction in the North), does the North secede?
  3.  **The Recursive Case (Cree in Quebec):** This is the stress test. If Quebec has the right to secede based on a distinct society, the Cree (distinct society within Quebec) claim the same right.
      *   If the theory says "No, Quebec is the unit," it must explain why Quebec's boundary is morally privileged over the Cree's boundary.
      *   If the theory says "Yes, the Cree can secede," it risks infinite fragmentation (Stability failure).

  **Why it knocks out theories:**
  Most theories smuggle in the boundary definition. They assume the "province" or "republic" border is the natural unit. But in political philosophy, existing administrative borders are morally arbitrary unless justified.
  *   A theory that relies on **existing administrative borders** (e.g., "The Quebec National Assembly decides") fails because it grants moral weight to bureaucratic lines.
  *   A theory that relies on **plebiscitary boundaries** (e.g., "Any contiguous majority") fails the Stability test.
  *   A theory that relies on **historical nationhood** fails the Liberal/Individualist test (why do ancestors bind us?).

  **Instruction for your work:**
  When evaluating a theory, ignore its account of *why* secession is good (autonomy, justice, etc.). Look immediately at how it defines the **Voting Unit**. If it cannot define the unit without referencing the *outcome* of the secession or relying on arbitrary existing borders, discard it. This is the hardest hurdle for a PhD thesis to clear, and clearing it distinguishes a serious contribution from a rehash of Buchanan or Beran.

  ### Summary for your Dissertation
  1.  **Drop** economic viability and supermajorities as moral conditions.
  2.  **Demote** constitutional legality to a prima facie duty (to allow for remedial cases).
  3.  **Elevate** Non-Circular Demarcation to your primary critical tool.
  4.  **Accept** that Stability, Consent, and Justice form a trilemma; your contribution will likely be arguing which one should yield in which context.
