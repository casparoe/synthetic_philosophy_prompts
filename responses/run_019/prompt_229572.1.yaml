answer: |-
  ### The "Tractability & Evidence" Filter

  This procedure is designed to neutralize Pascal's Mugging by capping the value of unsupported claims. It forces you to evaluate the *evidence for the probability* rather than the *size of the payoff*. It requires only basic multiplication and comparison.

  **Time Required:** 45–60 minutes per application.
  **Math Required:** Multiplication and comparison (>, <).

  #### Step 1: The Probability Audit (Pass/Fail)
  **Question:** Is the claimed probability based on a reference class of similar past projects, or is it an intuition/model specific to this project?
  *   **Pass:** They can cite data (e.g., "5 of 100 similar prototypes succeeded").
  *   **Fail:** They admit it is a guess, intuition, or a theoretical model with no real-world validation.
  *   **Action:** If **Fail**, you must apply the **1% Cap**. You are not allowed to use their number. You must use 1% (0.01) as the maximum probability for your math.
  *   **Stop Rule:** If the project requires >$50k and fails this step, **Reject**. (Small grants can proceed to Step 2).

  #### Step 2: The Causal Chain Count (Pass/Fail)
  **Question:** How many distinct, independent events must happen for the money to lead to the payoff?
  *   **Count:** Money -> Activity -> Immediate Output -> Intermediate Outcome -> Final Impact.
  *   **Pass:** 3 steps or fewer (e.g., Money -> Print Leaflets -> Voters Read -> Vote).
  *   **Fail:** 4 steps or more (e.g., Money -> Leaflets -> Voters Read -> Voters Change Mind -> Election Shifts -> Policy Changes -> AI Safety Improved).
  *   **Action:** If **Fail**, apply the **50% Discount** to your final Expected Value calculation.
  *   **Stop Rule:** If the chain is longer than 5 steps, **Reject**.

  #### Step 3: The Reality Cap (Arithmetic)
  **Question:** What is the maximum *realistic* monetary value of the success, capped at a level your foundation can verify?
  *   **Rule:** Do not use "infinite" or "civilization-saving" values. Cap the impact at **$1,000,000** for any unprecedented claim. If the outcome is standard (e.g., votes gained), use standard market/policy values.
  *   **Calculation:** `Capped Probability` (from Step 1) × `Capped Impact` (from Step 3) = `Capped Expected Value (EV)`.
  *   **Decision Thresholds:**
      *   If `Capped EV` < `Grant Cost`: **Reject**.
      *   If `Capped EV` > `3 × Grant Cost`: **Advance to Yes**.
      *   If `Capped EV` is between `1 × Cost` and `3 × Cost`: **Values Call** (Board must decide based on mission fit, not math).

  ---

  ### Running the Procedure on Your Applications

  Here is how the filter processes the three examples you provided.

  #### 1. The AI Catastrophe Leaflets
  *   **Step 1 (Probability):** Applicant admits odds are "1-in-10,000" based on their own assessment. No reference class exists for "leaflets preventing AI doom."
      *   *Result:* **Fail.** Apply **1% Cap** (0.01).
  *   **Step 2 (Causal Chain):** Money -> Print -> Mail -> Read -> Belief Change -> Policy/Action -> AI Safety. (6+ steps).
      *   *Result:* **Fail.** Apply **50% Discount**. Also exceeds 5-step stop rule.
  *   **Decision:** **Reject.**
  *   *Why:* The causal chain is too long (Stop Rule), and the probability is unsupported. Even with the 1% cap and $1M impact cap, the EV is $10,000, which is less than the $30k cost.

  #### 2. The CO2 Prototype Engineer
  *   **Step 1 (Probability):** Claims "1-in-50,000." No historical data for this specific prototype.
      *   *Result:* **Fail.** Apply **1% Cap** (0.01).
  *   **Step 2 (Causal Chain):** Money -> Build Prototype -> Test -> Verify Cost Reduction -> Adoption. (4 steps).
      *   *Result:* **Fail.** Apply **50% Discount**. (Just under the 5-step hard stop).
  *   **Step 3 (Reality Cap):** Claimed payoff is "tenth of current cost." Global market value is billions, but we cap at **$1,000,000** (unprecedented claim verification limit).
  *   **Calculation:** 0.01 (Cap) × $1,000,000 (Cap) = $10,000 Raw EV.
      *   Apply 50% Discount (for causal chain): **$5,000 Capped EV**.
      *   Grant Cost: **$30,000**.
  *   **Decision:** **Reject.**
  *   *Why:* The math says the risk is too high relative to the *verified* value.

  #### 3. The Voter Turnout Campaign
  *   **Step 1 (Probability):** Reaching a few hundred people is a physical certainty. Getting them to vote is historical (e.g., "1 in 4 contacted voters turn out").
      *   *Result:* **Pass.** Use stated probability (e.g., 25% or 0.25).
  *   **Step 2 (Causal Chain):** Money -> Contact -> Voter Turns Out. (2 steps).
      *   *Result:* **Pass.** No discount.
  *   **Step 3 (Reality Cap):** Value of a vote in a local district. Let's cap the "impact" of a few hundred votes at **$100,000** (conservative value of local policy influence).
  *   **Calculation:** 0.25 × $100,000 = **$25,000 Capped EV**.
      *   Grant Cost: **$15,000**.
  *   **Decision:** **Values Call.** ($25k EV is between 1x and 3x the $15k cost).
  *   *Why:* The math supports it, but it's marginal. The Board must decide if local engagement fits the mission.

