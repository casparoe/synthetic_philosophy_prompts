  ### The Answer You Won't Like

  **The procedure tells you to Reject the CO2 Engineer and treat the Voter Turnout as your best option.**

  You explicitly stated you don't want to fund only "safe, boring stuff." You likely view the CO2 engineer as exactly the kind of "shot" a foundation should take—a hardware prototype with a massive potential payoff. The Voter Turnout campaign feels small and political.

  However, the procedure forces you to acknowledge that without historical data, the engineer's "1-in-50,000" is functionally the same as the AI leaflet writer's "1-in-10,000": **it is a guess.** By capping the probability at 1% and the impact at a verifiable $1M, the math reveals that you are being asked to pay $30k for a lottery ticket worth $5k in expected value.

  Following this procedure means you will likely fund the "boring" voter campaign and reject the "exciting" climate tech. This is the cost of avoiding Pascal's Mugging. If you want to fund the engineer, you must do it as a **Values Call** (admitting the math doesn't justify it, but your mission does), not as an EV-positive grant.

  ### Where This Procedure Will Misfire

  1.  **True Black Swans:** This filter systematically rejects unprecedented breakthroughs (like early-stage mRNA or the first internet protocols) because they lack reference classes. If your mission includes *creating* new fields, this procedure is too conservative.
  2.  **The Cap Arbitrariness:** The $1M Impact Cap is subjective. A foundation focused on existential risk might argue capping AI safety at $1M is immoral. You must adjust the Cap to match your risk tolerance, but know that raising it re-opens the Mugging door.
  3.  **Gaming the System:** Savvy applicants will learn to cite "reference classes" that don't quite fit or break their causal chains into fewer steps to pass the filter. You must audit the *quality* of the reference class, not just its existence.

  ### Rejection Letter Language

  When rejecting the "long shots" (like the AI or CO2 applications), do not argue about their odds. Argue about your *evidence standards*. This prevents a debate about whether they are right and you are wrong.

  > "Thank you for sharing your vision with us. While the potential impact you describe is significant, our foundation's current grantmaking strategy requires projects to demonstrate a track record of similar outcomes or a validated probability model. At this stage, we are prioritizing initiatives where the causal link between funding and outcome is supported by historical data. We encourage you to apply again once you have pilot data or a stronger reference class for your success metrics."

  **Why this works:** It shifts the rejection from "We don't believe you" to "You don't meet our administrative criteria." It is factual, polite, and closes the door on arguing about the odds.
