      *   *Did I handle underdetermination?* I need to be careful here. The *practice* of entrenchment is logically compatible with multiple justifications, but the *specific legal form* (eternity clauses, etc.) strongly presupposes the Continuing Agent. I will nuance this: Functionally, you can justify it other ways, but *normatively* regarding authority, the Continuing Agent is the heavy lifter.

