answer: |-
  Here is a referee's ruling on the debate between Sam and Maya.

  ### Move-by-Move Assessment

  **(1) Sam: Substantially Right.**
  Sam correctly identifies the historical lag between moral critique and behavioral change; logical consistency rarely dismantles a social practice on its own. The claim that the practice collapsed when the *social cost* of refusal dropped is supported by historical sociology regarding the rise of the middle class and the redefinition of gentility.

  **(2) Maya: Substantially Right.**
  Maya correctly notes that redefining honor ("he isn't worth the field") and cultural satire are forms of public reason-giving, not just exogenous shifts. However, she risks stretching the definition of "argument" so wide that it loses explanatory power; calling a cultural mood shift "persuasion" can obscure the structural changes Sam identified.

  **(3) Sam: Mixed (Right on Mechanism, Mistaken on Psychology).**
  Sam is right that status conferral is the immediate mechanism of enforcement, but he is likely wrong to claim people didn't "update" their beliefs. Cognitive dissonance research suggests that when social costs change, people often retroactively adopt arguments that justify the new behavior, meaning arguments and status shift together rather than one being purely downstream.

  **(4) Maya: Substantially Right.**
  Maya's generalization challenge is strong: the abolition of slavery required moral mobilization that cannot be reduced solely to a shift in honor among slaveholders. However, she oversimplifies the slavery case by implying "argument" alone did the work, ignoring that it ultimately required coercive force (war) and economic realignment, which aligns more with Sam's structural view than her discursive one.

  ***

  ### Verdict on Surviving Points

  **Sam's Surviving Core:**
  Norm change requires a change in **sanctions**, not just premises. You cannot talk a practice to death if the social penalty for continuing it remains high. The "audience" that confers status must change (e.g., from aristocrats to the professional middle class) before the norm can collapse. Arguments are necessary but insufficient without a shift in the incentive structure of honor.

  **Maya's Surviving Core:**
  Norm change requires a change in **meaning**, which is a discursive process. Honor does not shift magically; it is shifted by new narratives, jokes, and reframing (e.g., from "courage" to "barbarism"). Therefore, argumentation (broadly construed as public reason-giving) is the vehicle through which honor is renegotiated, not merely a byproduct.

  ***

  ### What Both Are Missing: The Coordination Problem

  Sam and Maya are treating "Argument" and "Honor/Interest" as competing causal forces (one drives the car, the other is just the road). They are missing that moral norms are often **coordination equilibria**.

  1.  **The Coordination Mechanism:** Dueling persisted because it was a Nash Equilibrium: if everyone else duels to maintain honor, you must duel to maintain status. Neither arguments nor honor shifts alone break this. You need a **focal point** (provided by Maya's arguments/satire) *and* a **shift in payoff matrices** (provided by Sam's class/status changes).
  2.  **The Interaction:** Arguments do not just "target" honor; they **reprice** it. When the middle class mocked dueling, they weren't just making an argument; they were devaluing the currency the aristocrats were spending. Conversely, interests (Sam's point) determine which arguments gain traction. The "irrationality" argument against dueling existed in 1720, but it only became "true" in 1840 when the people who cared about rationality (the bourgeoisie) gained the power to define honor.
  3.  **The Synthesis:** Norm change happens when new arguments allow a critical mass of actors to coordinate on a new equilibrium *simultaneously* with a shift in who holds the power to punish defectors. Sam explains the power shift; Maya explains the coordination signal. You need both to solve the collective action problem.
