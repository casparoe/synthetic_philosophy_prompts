prompt: |-
  I'm a biology undergrad taking a philosophy of science elective, and our textbook has a section on whether evolutionary theory is falsifiable that summarizes Popper's position like this:

  "Karl Popper, the philosopher famous for claiming that real science must be falsifiable, held that Darwin's theory of evolution fails his own test. The principle of natural selection boils down to 'survival of the fittest', but fitness is defined in terms of survival, so the theory is a tautology: it predicts that whatever survives was the fittest, and no observation could ever count against it. Popper therefore classified Darwinism as a metaphysical research programme rather than a scientific theory, which in his framework amounts to saying it isn't really knowledge at all. He never retracted this verdict, and late in life he went further, suggesting that evolution is actually driven by the purposive, goal-directed activity of organisms rather than by blind selection -- a view closer to Lamarck than to Darwin, and one that biologists largely ignored because Popper never properly understood the Modern Synthesis."

  Something about this feels off to me, though I can't put my finger on exactly where. I know Popper did at some point raise the tautology worry, and I vaguely remember hearing he gave a big lecture late in life where he talked about natural selection, but I don't know what he actually said in it. Could you go through the paragraph and tell me which parts are fair, which are subtly off, and which are just wrong? In particular I'd like to know: what a sympathetic reader of Popper would object to here; whether "metaphysical research programme" is the insult the textbook makes it sound like, given how Popper used that term; and whether his later talk of organisms' activity really amounts to smuggling in Lamarckian inheritance, or whether it's a different (and maybe more respectable) idea dressed up to look silly. Also, the textbook wraps up the section by saying this whole episode shows that philosophers who police the borders of science tend to embarrass themselves when they talk about actual science -- does that conclusion survive if the summary is corrected?

  And since I can't double-check everything you'll tell me: please be upfront about how confident you are in each correction, and say what would change your verdict -- e.g., is there some late writing where Popper reaffirmed the tautology charge or genuinely endorsed inheritance of acquired characteristics that would vindicate the textbook? Where is your account most likely to be wrong or oversimplified?
