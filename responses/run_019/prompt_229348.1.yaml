answer: |-
  This is a profound jurisprudential question that cuts to the heart of how legal systems manage the relationship between language, reality, and authority. Your observation highlights the tension between **legal formalism** (the bright-line rule) and **legal realism** (the fuzzy standard), framed through the philosophy of language (theories of vagueness).

  To reconstruct the implicit theory of vagueness in drunk-driving law, we must separate the *metaphysical commitments* of the legislature from the *functional requirements* of the legal system.

  ### 1. The Ontology of the Bright Line: Stipulation, Not Discovery

  You ask whether the 0.08% threshold presupposes a "fact of the matter" (Realism/Epistemicism) or is a "deliberate decision to draw a line where nature provides none" (Conventionalism/Stipulation).

  **Strict Presupposition:**
  The enactment of a bright-line limit strictly presupposes **Legal Positivism**, not metaphysical realism. It does *not* require the legislator to believe that 0.079% is biologically distinct from 0.081%. Rather, it presupposes that the **authority of the state is sufficient to create a boundary where none existed before.**

  In the philosophy of vagueness, this aligns most closely with **Contextualism** or **Intentionalism**. The law treats the predicate "legally impaired" as having its extension fixed by legislative fiat, not by the underlying biological reality of intoxication. The bright line is a **constitutive rule** (like the offside rule in soccer), not a **regulative rule** (like a law against hitting people, which regulates pre-existing moral facts).

  **What it sits well with:**
  While the law does not *presuppose* biological realism, the rhetoric surrounding these laws often *sits well* with **Epistemicism**. Epistemicism holds that there is a sharp boundary between "sober" and "impaired" in reality, we just don't know exactly where it is. Legislators often speak *as if* 0.08% is the point where safety drops off a cliff to justify the rule to the public. However, this is rhetorical cover for a pragmatic stipulation. The legal machinery works perfectly fine even if impairment is a smooth gradient, provided the law has the power to declare a specific point on that gradient as the liability trigger.

  ### 2. The Coexistence of Rule and Standard: A Functional Division of Labor

  Does having both a precise BAC limit and a fuzzy "impaired driving" standard reveal theoretical confusion?

  **The Coherence Argument:**
  It is coherent if viewed through the lens of **Rules vs. Standards** (a classic debate in law and economics, associated with scholars like Louis Kaplow and Steven Shavell).
  *   **The Bright Line (Rule):** Provides *ex ante* guidance. It tells citizens exactly what to avoid to stay safe from prosecution. It reduces administrative costs (no need for expert testimony on impairment if BAC is 0.15%).
  *   **The Fuzzy Standard (Standard):** Provides *ex post* justice. It catches those who are impaired below the limit (due to tolerance, drugs, or fatigue) and protects those who are above the limit but demonstrably safe (a theoretical possibility, though rarely argued successfully).

  **Implicit Theory of Vagueness:**
  This hybrid system implies a **Pragmatic Theory of Vagueness**. It suggests the legal system believes vagueness is a **resource** to be managed, not a problem to be solved.
  *   Where **predictability** is valued (knowing when you are committing a crime), the law eliminates vagueness by fiat (0.08%).
  *   Where **accuracy** is valued (catching all dangerous drivers), the law embraces vagueness ("impaired").

  This is not theoretical confusion; it is a recognition that "impaired" is a **cluster concept**. It involves reaction time, judgment, motor control, and risk. A single number cannot capture the cluster, but a single number is necessary for efficient enforcement. The system implicitly admits that the bright line is a **proxy**, while the fuzzy standard is the **target**.

  ### 3. Presupposition vs. Compatibility: The Measurement Error Tolerance

  You ask whether enforcement tolerances (e.g., not charging at 0.081% because the machine has a ±0.02% margin of error) presuppose anything about vagueness.

  **Strict Presupposition:**
  Enforcement tolerance strictly presupposes **Epistemic Uncertainty**, not **Ontological Vagueness**.
  *   **Epistemic Uncertainty:** "The driver *is* either above or below the line, but our tool cannot tell us which."
  *   **Ontological Vagueness:** "It is indeterminate whether the driver is above or below the line."

  By building in a buffer (e.g., requiring 0.10% to charge on a 0.08% limit), the prosecutor is acknowledging the fallibility of the *instrument*, not the indeterminacy of the *law*. This is a procedural safeguard rooted in the burden of proof ("beyond a reasonable doubt"). It does not require the legal system to believe that "impaired" is a vague predicate; it only requires them to believe that *measurement* is imperfect.

  **What it sits well with:**
  However, this practice sits very well with **Supervaluationism**. Supervaluationism suggests that in borderline cases, a statement is neither true nor false (it lacks a truth value). If the BAC is 0.081% with a margin of error of ±0.02%, the "true" BAC could be 0.079% (legal) or 0.083% (illegal). A Supervaluationist approach would say the proposition "This driver broke the law" is neither super-true nor super-false. The prosecutor's decision to drop the case aligns with the intuition that we should not punish in truth-value gaps.

  **Why the distinction matters:**
  If the tolerance were based on ontological vagueness, the law would be admitting that the 0.08% line itself is fuzzy. But the law insists the line is sharp; it is only our *access* to the line that is fuzzy. This preserves the **deterrent effect** of the bright line. If citizens believed the line itself was vague, they might gamble on being in the "penumbra." By maintaining the line is sharp but the measurement is flawed, the law maintains the sharpness of the norm while accepting the flaw of the evidence.

  ### 4. Taking Irreducible Vagueness Seriously

  Finally, what if we accepted the view that predicates like "impaired" are **essentially and irreducibly vague** (e.g., Degree Theory, where truth comes in degrees, or that Sorites paradoxes cannot be solved by fiat)?

  If the legal system took this metaphysical view seriously, three things would have to change:

  **A. Re-description of the Bright Line (From Truth to Proxy)**
  Currently, the law treats 0.08% as *constitutive* of the crime (DUI *Per Se*). If vagueness is irreducible, the 0.08% limit cannot be a boundary of "impairment." It must be re-described as a **rebuttable presumption of risk**.
  *   *Current:* "At 0.08%, you are impaired."
  *   *New:* "At 0.08%, you are statistically likely to be impaired enough to warrant liability, unless you prove otherwise."
  The bright line would shift from being a definition of the crime to being a procedural shortcut. This actually happens in some jurisdictions where "rising BAC" defenses are allowed, acknowledging the temporal vagueness of intoxication.

  **B. Shift Toward "Totality of Circumstances"**
  If "impaired" is irreducibly vague, a single number is a category error. The legal system would have to abandon *Per Se* laws in favor of purely standard-based adjudication. Every case would require evidence of actual driving degradation (swerving, reaction tests). The bright line would be abandoned because drawing a sharp line on a fuzzy concept is logically indefensible under this view.
  *   *Consequence:* Massive increase in litigation costs and decrease in predictability. This explains *why* the law does not take irreducible vagueness seriously—it prioritizes administrative efficiency over metaphysical purity.

  **C. Graded Liability**
  If truth comes in degrees (Degree Theory), then liability should arguably come in degrees. Instead of a binary "Guilty/Not Guilty," a system taking vagueness seriously might implement **graduated penalties** based on how far into the "penumbra" of impairment the driver falls.
  *   *Current:* 0.079% is innocent; 0.081% is guilty.
  *   *New:* 0.079% incurs a small fine; 0.15% incurs jail time.
  This would treat the BAC not as a cliff edge, but as a volume dial on culpability.

  ### Summary: The Legal System as a "Pragmatic Epistemicist"

  To answer your core question: The legal system does not have a unified theory of vagueness because it is not trying to solve the Sorites paradox; it is trying to regulate behavior.

  1.  **Implicit Theory:** The system operates as a **Pragmatic Epistemicist**. It acts *as if* there is a sharp line (to provide notice and simplify enforcement) while acknowledging *epistemic* limits (measurement error) that prevent us from punishing borderline cases.
  2.  **Coherence:** The coexistence of the bright line and the fuzzy standard is a coherent **division of labor**. The bright line handles the clear cases efficiently; the fuzzy standard handles the exceptional cases justly.
  3.  **Presupposition:** The tolerance for measurement error presupposes **instrumental fallibility**, not **ontological vagueness**. This is crucial because it allows the law to maintain the fiction of the sharp line for deterrent purposes.
  4.  **If Vagueness were Irreducible:** The bright line would have to be abandoned or re-cast as a probabilistic proxy. The law would move from a system of **rules** (if X, then Y) to a system of **standards** (if X to a sufficient degree, then Y).

  The discomfort you feel is the friction between **philosophical truth** (impairment is a gradient) and **legal truth** (liability is binary). The legal system resolves this by fiat. It does not track the boundary between sober and impaired; it *creates* a boundary between liable and not-liable, and uses the concept of impairment to justify it.
