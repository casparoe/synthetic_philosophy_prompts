answer: |-
  **Setting:** *The atrium of the Law & Philosophy Center. It is mid-morning coffee break at a workshop on "Causation in Tort Law." The air smells of stale espresso and photocopied paper.*

  **Characters:**
  *   **Elena:** Defends the view that omissions are genuine causes (Counterfactual/Interventionist).
  *   **Marcus:** Defends the view that omissions are not causes, but normative placeholders for positive causal chains (Process/Physicalist).

  ***

  **Elena:** (Stirring sugar into her cup) That last paper on the *Summers v. Tice* alternative liability was clever, but they sidestepped the real metaphysical elephant in the room.

  **Marcus:** Let me guess. You think the elephant is negative causation.

  **Elena:** I think the elephant is the refusal to call it what it is. If a gardener is contracted to water a specific orchid, goes on holiday, and the orchid dies of thirst, the gardener killed that plant.

  **Marcus:** The gardener *allowed* the plant to die. There's a difference. The heat, the evaporation, the biological cessation of cell turgor—those are the causes. They are positive, physical processes. The gardener's "contribution" was a null set. You can't build a causal chain out of nothing.

  **Elena:** But "nothing" did the work, Marcus. If we run the counterfactual: If the gardener had poured water, the plant lives. If the gardener pours water, the plant lives. The dependency is robust. Why privilege the physics of evaporation over the dependency of the outcome on the agent's behavior?

  **Marcus:** Because physics doesn't run on counterfactuals; it runs on energy transfer. If I say "the lack of water caused the death," I am implicitly referencing a norm. I am saying the gardener *ought* to have been there. If a random passerby walked past and didn't water it, you wouldn't say they caused the death. So, the causation isn't in the omission itself; it's in the duty. The causation is shorthand for "breach of duty allowed natural causes to proceed."

  **Elena:** That conflates responsibility with causation. I agree the passerby isn't *responsible*. But consider the bystander case. A swimmer is drowning. I am standing there with a rope. I don't throw it. They die. You say the water caused the death?

  **Marcus:** The water filled the lungs. Gravity held them under. Positive events.

  **Elena:** But my holding the rope was a stable condition that, combined with my action, would have prevented it. By not acting, I changed the course of events from "life" to "death." If causation is about control and manipulation of variables, my omission is as potent as pushing someone in.

  **Marcus:** (Leans against the wall) Here is where I concede a point, but only on semantics. I agree the law treats them similarly for liability. But if we say omissions are *metaphysically* identical to actions, we lose the ability to limit liability. If my failure to water the plant is a cause, why isn't my failure to water every plant in the world a cause of their death?

  **Elena:** Because causation is contrastive. We don't ask "Did the omission cause the death?" in a vacuum. We ask "Did the failure to water *rather than watering* cause the death *rather than survival*?" The contrast class is restricted by context and expectation.

  **Marcus:** Expectation! There it is. "Expectation" is normative. So even on your view, you need a normative filter to select which omissions count as causes. On my view, the filter selects which *non-causes* we assign blame to. It's cleaner. Keep the physics pure; put the blame in the norm.

  **Elena:** Is it cleaner? Let's try the floodgate case. Imagine two gates controlling a channel to a farm. Gate 1 is normally closed. Agent A fails to close it. Gate 2 is normally closed. Agent B actively opens it. The water rushes through both, flooding the farm identically.

  **Marcus:** Okay.

  **Elena:** On your view, B caused the flood. A did not. A merely failed to prevent it. But the water flow through Gate 1 is physically identical to the water flow through Gate 2. The kinetic energy hitting the crops is the same. Why is the metaphysics different just because of the initial state of the lever?

  **Marcus:** (Pauses) Because the source of the energy differs. In B's case, B introduced a change to the system that initiated the flow. In A's case, the pressure was already there; A just removed a barrier. The causal work is done by the water pressure in both, but B *activated* the pressure. A *permitted* it.

  **Elena:** But if we are looking at the *flood*, the sufficient condition is the open channel. Whether that channel became open via a push or a non-pull seems irrelevant to the outcome. If I'm the farmer suing for damages, the distinction feels like sophistry.

  **Marcus:** It might feel like sophistry to the farmer, but it matters for the scope of liability. If we say A's omission is a full-blown cause, then anyone who failed to build a *third* gate that would have stopped the water is also a cause. We get an infinity of causes. If we say only positive interventions are causes, we limit the causal field to those who manipulated the physics.

  **Elena:** I'm willing to live with some context-dependence to avoid that infinity. But consider the doctor in triage. There is one ventilator. Two patients, X and Y. The doctor gives it to Y. X dies.

  **Marcus:** A classic.

  **Elena:** Did the doctor cause X's death?

  **Marcus:** No. The underlying pathology caused X's death. The doctor allocated a scarce resource.

  **Elena:** But if the doctor had given it to X, X lives. The doctor's decision determined the outcome. If we say the doctor didn't cause X's death, we sever the link between the agent's choice and the consequence.

  **Marcus:** This is my strongest case, Elena. Here, the "omission" (not ventilating X) is only salient because the doctor has a prior duty to care. If a stranger walked into the ICU and didn't ventilate X, we wouldn't even discuss causation. We'd say they weren't involved. Since the causal status of the omission flips based on the doctor's job description, the causation must be normative, not metaphysical.

  **Elena:** (Sips coffee, thinking) I'll grant you that. The *selection* of which omissions we litigate is normative. But I deny that the *causal relation* itself is normative. The dependency exists regardless of the duty. The doctor's choice is a switch. Whether they are paid to flip the switch doesn't change the wiring.

  **Marcus:** But without the duty, we don't call it a switch. We call it background.

  **Elena:** That sounds like you're defining "cause" as "the thing we blame."

  **Marcus:** Precisely! For legal purposes, isn't that what causation is? We aren't doing particle physics in a torts classroom. We are asking: "Who is answerable for this harm?"

  **Elena:** Ah, so here is the pivot. You think we should separate the questions. Question 1: What physically produced the harm? (Positive processes only). Question 2: Who is liable? (Those with duties regarding those processes). I think Question 1 is already loaded. The law's concept of causation *is* a tool for attribution. If the tool works better by including omissions as causes, then they are causes *for the law*.

  **Marcus:** But if we blur the line, we risk expanding liability indefinitely. If omissions are causes, then every time I don't donate my kidney to a stranger, I am causing their death. Metaphysically, on your view, am I a killer?

  **Elena:** Metaphysically, you are a necessary condition for their death in that moment, yes. But legally? No. Because the law imposes a constraint on *duty*. I can hold that omissions are causes without holding that all omissions are tortious.

  **Marcus:** So you separate the causation from the liability anyway. You just put the filter at the duty stage, not the causation stage.

  **Elena:** Yes.

  **Marcus:** And I put the filter at the causation stage. I say "That's not a cause," so we don't even get to duty. What is the practical difference?

  **Elena:** It changes how we reason about proximate cause and damages. If I say the doctor caused X's death, I have to explain why they aren't liable (justification/privilege). If you say the doctor didn't cause the death, you bypass liability entirely. The first approach forces us to be transparent about the moral justification for letting X die. The second approach hides the moral choice behind a metaphysical claim that "nothing happened."

  **Marcus:** (Nods slowly) I see the rhetorical advantage. It forces the justification into the open. But I worry about the ontological cost. We are teaching students that "nothing" can push things.

  **Elena:** We are teaching them that the world is a web of dependencies, not just a billiard table of collisions.

  **Marcus:** So, where does that leave us? We agree on the liability outcomes in the gardener, the swimmer, and the doctor cases. We agree the law should treat the floodgate omission similarly to the floodgate commission.

  **Elena:** Mostly. I'd hold the floodgate omitters jointly liable. You might struggle to find a causal hook for the first one.

  **Marcus:** I'd use "risk creation" or "duty of care" to bypass causation for the first agent.

  **Elena:** So the disagreement isn't about who pays.

  **Marcus:** No.

  **Elena:** It's not even really about whether omissions matter.

  **Marcus:** No. It's about whether "causation" is a descriptor of the world's machinery, or a descriptor of our accountability structures.

  **Elena:** I think it's the latter. Especially in law.

  **Marcus:** And I think if you make it the latter, you lose the ability to critique the law using metaphysics. If causation is just "what we care about," then you can't say the law got the causation wrong. You can only say it got the policy wrong.

  **Elena:** Fair. I'm willing to sacrifice the metaphysical critique for conceptual clarity in attribution.

  **Marcus:** And I'm willing to accept complex liability rules if it preserves the distinction between something happening and nothing happening.

  **Elena:** (Raises cup) To nothing happening, then.

  **Marcus:** (Clinks cup) And everything it entails.
