prompt: |-
  I'm a master's student in computer science taking a graduate seminar on inverse reinforcement learning and the problem of inferring preferences from observed behavior, and I'm also working part-time in a robotics lab. My job in the lab is to take each new batch of human demonstrations for a manipulation task — someone teleoperating or kinesthetically guiding an arm through, say, setting a table, clearing a cluttered desk, or packing a lunchbox — and hand the lab a reward function that our downstream reinforcement-learning pipeline will optimize. I do this roughly once a week, with twenty to forty demonstrations per task from two or three demonstrators, about a day of my time per batch, no background in cognitive science, and a PI who signs off on the result but mostly wants a documented decision rather than a treatise. The stakes show up downstream: when the learned reward is wrong, the robot doesn't merely fail at the task; it finds ways to satisfy the letter of the objective that none of us intended, and by then the mistake is baked into a trained policy rather than a line of code.

  The course has made me uneasy about how ad hoc my current workflow is. I now know that the same observed behavior can be optimal under many different reward functions, so choosing among them takes auxiliary assumptions; that attributing everything to the reward is a mistake when the demonstrator has a different world model, a short planning horizon, motor noise, or habits; and that the promise of IRL over behavioral cloning is precisely that a recovered objective should transfer to new settings rather than just reproduce the demonstrations. But I don't yet know how to turn those insights into a procedure I can run on a Tuesday. I would like a reusable protocol for each batch of demonstrations: the questions to ask in order, what counts as a sufficient answer before moving on, where the protocol should stop and report that the data underdetermine the reward, and where I should instead go ask a demonstrator a few targeted questions rather than infer more. The protocol should output something like a ranked set of reward hypotheses with a one-paragraph warning label about what each should and shouldn't be trusted for, not a single confident objective, and it should make explicit which steps are real inferences and which are just prior commitments dressed up as inference.

  Could you also run the protocol on two cases so I can see what it produces in practice? The first is a table-setting task in which one demonstrator places glasses far from the edge, moves slowly, and double-checks each placement; I cannot tell whether this person cares about protecting the glassware, has motor tremor or poor depth perception, or is simply cautious. The second is a desk-clearing task in which a demonstrator occasionally knocks small objects over while reaching for larger ones, and my supervisor is fairly confident the correct reward should include a collision penalty. I would particularly like one application to come out against what my supervisor wants to read into the data, if that is what the protocol says, because I need practice defending that kind of refusal. And if I'm misdescribing the task — if "give me a procedure for reward inference" is itself the wrong frame because the hardest parts are one-off modeling decisions rather than a repeatable pipeline — I'd rather hear that plainly than receive a checklist that manufactures false confidence. Where does the procedure refuse to run, and what does it leave to judgment?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Master's student in CS, taking a grad seminar on Inverse Reinforcement Learning (IRL). Working part-time in a robotics lab.
      *   **Task:** Convert human demonstrations (teleop/kinesthetic) into a reward function for downstream RL.
      *   **Current Workflow:** Ad hoc, ~1 day per batch (20-40 demos, 2-3 demonstrators), PI wants documented decisions, not treatises.
      *   **Problem:** Student realizes IRL is ill-posed (degeneracy of reward functions, confounding factors like noise/world model/horizon). Current workflow ignores this, leading to specification gaming (reward hacking) downstream.
      *   **Goal:** A reusable protocol/checklist for Tuesdays. Needs to:
          *   Ask questions in order.
          *   Define sufficiency criteria.
          *   Identify underdetermination (stop points).
          *   Distinguish inference from prior commitments.
          *   Output: Ranked reward hypotheses + warning labels.
          *   Include two case studies (Table Setting, Desk Clearing).
          *   Crucially: One case study *must* challenge the supervisor's intuition (Desk Clearing).
          *   Meta-constraint: Be honest if "procedure" is the wrong frame. Don't manufacture false confidence.

  2.  **Deconstruct the Core Tension:**
      *   The user wants a *procedure* for an inherently *ill-posed* problem.
      *   IRL theory says $P(R|D) \propto P(D|R)P(R)$. Without strong priors ($P(R)$) or constraints on the demonstrator ($P(D|R)$), $R$ is unidentifiable.
      *   A rigid checklist creates false confidence. A purely theoretical answer doesn't help the Tuesday deadline.
      *   *Solution:* A "Protocol for Explicit Underdetermination." Instead of promising to find *the* reward, the protocol promises to map the *space of plausible rewards* and flag the ambiguity. It shifts the goal from "Inference" to "Constraint Specification."

  3.  **Drafting the Protocol (The "Tuesday Procedure"):**
      *   *Name:* The Reward Ambiguity Protocol (RAP).
      *   *Philosophy:* Don't infer; constrain. Admit priors.
      *   *Steps:*
          1.  **Behavioral Audit:** What *actually* happened? (Separate observation from interpretation).
          2.  **Confounding Check:** Could this be noise, constraints, or habits rather than preference?
          3.  **Prior Declaration:** What are we assuming about the human? (Rationality, horizon, knowledge).
          4.  **Hypothesis Generation:** Create competing reward functions.
          5.  **Discrimination Test:** Can these hypotheses be distinguished with current data? If not, flag.
          6.  **Output:** Ranked hypotheses + Warning Labels.

  4.  **Developing the Case Studies:**
      *   **Case 1: Table Setting (The Ambiguous One).**
          *   *Obs:* Glasses far from edge, slow moves, double-checks.
          *   *Supervisor/Student intuition:* Safety/Care? Motor issues? Caution?
          *   *Protocol Application:* Step 2 (Confounding) is key here. Is it $R$ (don't break) or $C$ (can't see well)?
          *   *Outcome:* Underdetermined. Output multiple hypotheses.
      *   **Case 2: Desk Clearing (The Conflict One).**
          *   *Obs:* Knocking small objects while reaching for large ones.
          *   *Supervisor Intuition:* Add collision penalty to $R$.
          *   *Protocol Application:* Step 2 & 5. If they knock things over *consistently* when reaching for high-value items, maybe they *don't* care about the small objects (sparse reward), or maybe they are time-constrained (discount factor $\gamma$), or maybe it's physical impossibility (constraints).
          *   *Crucial Twist:* The protocol should argue *against* simply adding a collision penalty if the behavior suggests the demonstrator tolerates collisions. Adding a penalty might make the robot too cautious to clear the desk efficiently. The "Reward" might be "Clear Big Items Fast" and the collisions are accepted side-effects, not optimization failures.
          *   *Outcome:* Challenge the supervisor. The data suggests collisions are *tolerated*, not *penalized heavily*.

  5.  **Addressing the Meta-Constraint (Is "Procedure" the wrong frame?):**
      *   I need to be honest. A checklist cannot solve identifiability.
      *   I must explicitly state where judgment overrides the protocol.
      *   The "Procedure" is actually a "Documentation of Assumptions" procedure.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the tension. Validate the unease.
      *   **The Protocol (RAP):** Structured, actionable, but humble.
      *   **Case Study 1 (Table Setting):** Demonstrate ambiguity handling.
      *   **Case Study 2 (Desk Clearing):** Demonstrate conflict with supervisor/intuition.
      *   **The "Where it Breaks" Section:** Explicitly answer the "wrong frame" question.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the protocol too academic?
      *   *Fix:* Keep the language operational ("Ask this," "Check that"). Make the output look like a lab report snippet.
      *   *Critique:* Did I challenge the supervisor enough in Case 2?
      *   *Fix:* Ensure the argument is that adding a collision penalty changes the optimal policy in a way that contradicts the demonstrated trade-off (speed vs. care). If the human knocks things over, the human's implicit reward weights collisions *lower* than time. Forcing a high collision penalty makes the robot *more* careful than the human, violating the "match human preference" goal.
      *   *Critique:* Did I distinguish inference from priors?
      *   *Fix:* Add a specific "Prior Declaration" step in the protocol and highlight it in the case studies.

  8.  **Final Polish:**
      *   Ensure tone is empathetic to the student's position (caught between theory and lab pragmatism).
      *   Make sure the "Warning Labels" are prominent.
      *   Check that the "Underdetermination" stop-condition is clear.

  **(Self-Correction Note on Case 2):** I need to be careful. If the supervisor says "include a collision penalty," they might mean "the robot shouldn't do that." But if the *human* did it, IRL says the human's reward function allowed it. If we force a penalty, we are doing *Regularized IRL* or *Constraint-based Learning*, not pure IRL. I need to make this distinction clear. The protocol should flag this as "Prior Commitment over Inference."

  9.  **Finalizing the Response Plan:**
      *   Validate the student's insight (IRL is ill-posed).
      *   Present the "Reward Ambiguity Protocol" (RAP).
      *   Run Case 1 (Table Setting) -> Result: Ambiguous, multiple hypotheses.
      *   Run Case 2 (Desk Clearing) -> Result: Conflict with Supervisor, data suggests collisions are tolerated cost, not forbidden.
      *   Conclude with the "Hard Truth" about procedures vs. judgment.

