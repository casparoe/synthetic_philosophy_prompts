answer: |-
  You are right to be uneasy. The tension you feel is not a gap in your skills; it is the fundamental identifiability problem of Inverse Reinforcement Learning (IRL) colliding with the engineering requirement for a single artifact. Ng & Russell (2000) showed that for any behavior, there are infinite reward functions that make it optimal. More recent work (e.g., Armstrong & Mindermann, 2018) proves that without assumptions about the demonstrator's rationality, noise, or knowledge, you cannot recover preferences from behavior alone.

  Your PI wants a "documented decision." Your course tells you a single decision is scientifically dishonest. The compromise is a **Protocol for Explicit Underdetermination**. You cannot build a pipeline that outputs *The Truth*, but you can build a pipeline that outputs *The Set of Plausible Truths and The Assumptions Required to Pick One*.

  Below is the protocol designed for your Tuesday constraints, followed by the two case studies. The second case study explicitly challenges your supervisor's intuition, as requested, to demonstrate how the protocol defends against "reward hacking" via human bias.

  ### The Reward Ambiguity Protocol (RAP)

  **Goal:** Produce a "Reward Specification Document" (1 page) per batch.
  **Time Budget:** 4 hours of the 1-day allocation (leaving time for coding/processing).
  **Philosophy:** Do not infer preferences; constrain them. Distinguish *Observation* (what happened) from *Attribution* (why it happened).

  #### Step 1: Behavioral Audit (Observation Only)
  *   **Action:** List the top 3 recurring behaviors in the trajectories.
  *   **Constraint:** Use neutral language. No mental state verbs (e.g., "cautiously," "trying to").
  *   **Sufficiency:** Can a stranger read this and reproduce the motion without knowing *why*?
      *   *Bad:* "Demonstrator avoids breaking glasses."
      *   *Good:* "Demonstrator maintains >5cm distance from table edge; velocity <0.1m/s during placement."

  #### Step 2: Confounding Check (The "Could It Be?" Test)
  *   **Action:** For each behavior in Step 1, list three alternative explanations that are *not* preference.
      1.  **Constraint:** Physical limitation of the human/arm (e.g., reach, tremor).
      2.  **Noise:** Motor error or perception lag.
      3.  **Model Error:** The human doesn't know the physics of the object.
  *   **Stop Condition:** If you cannot rule out at least two of these with the current data, mark the behavior as **Underdetermined**. Do not encode it as a reward term yet.

  #### Step 3: Prior Declaration (The "Dressed Up Inference")
  *   **Action:** Explicitly write down the assumptions required to treat the behavior as a preference.
  *   **Template:** "To interpret [Behavior] as [Preference], we assume the demonstrator is [Rational/Noisy] and has [Perfect/Imperfect] knowledge of [Environment Property]."
  *   **Requirement:** This section must be signed off by the PI. This shifts liability from your inference to their prior.

  #### Step 4: Hypothesis Generation & Discrimination
  *   **Action:** Propose two competing reward functions ($R_1, R_2$).
      *   $R_1$: The "Standard" interpretation (e.g., collision penalty).
      *   $R_2$: The "Alternative" interpretation (e.g., time discounting outweighs collision cost).
  *   **Test:** Simulate or reason: Would these rewards produce *different* behaviors in a slightly new setting (e.g., a cluttered desk vs. an empty one)?
  *   **Output:** If they produce the same behavior on your data, they are **Indistinguishable**. Report both.

  #### Step 5: The Warning Label
  *   **Action:** For the chosen reward hypothesis, write a 3-sentence limit on its validity.
  *   **Template:** "This reward is valid for [Context]. It will likely fail if [Condition Changes]. It encodes [Assumption] as fact."

  ---

  ### Case Study 1: Table Setting (The Ambiguous Case)

  **Input:** 30 demonstrations. One demonstrator places glasses >10cm from edge, moves slowly, double-checks placement (re-grasps).
  **Initial Instinct:** Reward = "Safety" + "Stability".

  **RAP Execution:**

  1.  **Behavioral Audit:**
      *   End-effector velocity peaks at 0.15 m/s (vs 0.5 m/s in other tasks).
      *   Final pose $x$-coordinate is consistently $\ge$ 10cm from table boundary.
      *   40% of placements involve a lift-and-replace motion within 5 seconds.

  2.  **Confounding Check:**
      *   *Behavior:* Slow velocity.
          *   *Preference:* Care for glassware.
          *   *Confounder:* Motor tremor requiring slower movement for accuracy? Poor depth perception requiring verification?
      *   *Behavior:* Distance from edge.
          *   *Preference:* Don't knock off.
          *   *Confounder:* Arm kinematics make edge reach uncomfortable?
      *   *Result:* **Underdetermined.** We cannot distinguish "caution" from "compensation for impairment" using trajectory data alone.

  3.  **Prior Declaration:**
      *   "To interpret slowness as a safety preference, we assume the demonstrator has nominal motor control and depth perception. If the demonstrator has tremors, this reward will cause the robot to move inefficiently slow."

  4.  **Hypothesis Generation:**
      *   $H_1$ (Safety): $R = -1 \times \text{collision} - 0.1 \times \text{velocity}^2$.
      *   $H_2$ (Accuracy): $R = -1 \times \text{position\_error} - 0.5 \times \text{time}$. (Slow moves are a cost paid to minimize error, not a preference for slowness).
      *   *Discrimination:* Current data cannot distinguish. Both predict slow, accurate moves.

  5.  **Output Document:**
      *   **Selected Hypothesis:** $H_2$ (Accuracy-focused).
      *   **Reasoning:** $H_1$ risks over-regularizing speed in downstream tasks where speed is safe. $H_2$ treats speed as a cost, not a penalty.
      *   **Warning Label:** "This reward assumes slowness is instrumental to accuracy, not intrinsic. If deployed in a setting where fast placement is safe (e.g., plastic cups), the robot will still move slowly. Do not use for high-throughput tasks without re-tuning the time cost."

  **Verdict:** The protocol prevents you from hard-coding "safety" when the data might just show "uncertainty."

  ---

  ### Case Study 2: Desk Clearing (The Conflict Case)

  **Input:** 25 demonstrations. Demonstrator clears large items (laptops, books). Small items (pens, staples) are occasionally knocked onto the floor during reach.
  **Supervisor's Directive:** "The human didn't *mean* to knock them over. Add a dense collision penalty so the robot learns to avoid that."
  **RAP Execution:**

  1.  **Behavioral Audit:**
      *   Large items removed 100% of the time.
      *   Small items displaced in 15% of trajectories.
      *   No attempt made to recover displaced small items.
      *   Trajectory planning cuts corners near small objects when reaching for large ones.

  2.  **Confounding Check:**
      *   *Behavior:* Knocking items over.
          *   *Preference:* Indifference to small items.
          *   *Confounder:* Physical impossibility to reach large item without contact? (Checked: No, path exists but is longer).
          *   *Confounder:* Unintentional motor error? (Checked: Consistent pattern, not random noise).

  3.  **Prior Declaration (The Conflict Point):**
      *   *Supervisor's Prior:* "Humans are rational and benevolent; they would not choose to break things. Therefore, collisions are errors."
      *   *RAP Prior:* "Humans optimize for trade-offs. If a collision occurs consistently without correction, the cost of avoiding it (time/effort) outweighs the penalty of the collision in the human's reward function."

  4.  **Hypothesis Generation:**
      *   $H_{Supervisor}$ (Constraint): $R = \text{ClearLarge} - 100 \times \text{Collision}$.
          *   *Prediction:* Robot will spend excessive time planning collision-free paths, potentially failing to clear the desk within time limits.
      *   $H_{Data}$ (Trade-off): $R = \text{ClearLarge} - 1 \times \text{Collision} - 0.5 \times \text{Time}$.
          *   *Prediction:* Robot will clear large items efficiently, accepting minor collisions with low-value objects, matching demonstration efficiency.

  5.  **Discrimination Test:**
      *   The data shows the human *tolerates* the collision. If we implement $H_{Supervisor}$, the robot will be *more* cautious than the demonstrator. In IRL, this is a failure mode (the robot is not learning the human's preference, it is learning the supervisor's preference).
      *   *Crucial Distinction:* Is the goal to mimic the human's *intent* (Supervisor's view) or the human's *revealed preference* (IRL view)? If the latter, the Supervisor is wrong.

  6.  **Output Document:**
      *   **Selected Hypothesis:** $H_{Data}$ (Weighted Trade-off).
      *   **Reasoning:** The demonstrations reveal a revealed preference where clearing large items quickly outweighs the cost of displacing small items. Encoding a hard collision penalty contradicts the observed optimality of the demonstrations.
      *   **Warning Label:** "This reward allows collisions with small, low-mass objects. It is safe for 'clearing' tasks but unsafe for 'tidying' tasks where object preservation is primary. If the downstream policy must never touch pens, do not use this reward; use constrained optimization instead."

  **Defense Script for the PI:**
  *"I ran the ambiguity protocol. The data shows the human consistently trades collision avoidance for speed. If we add the heavy penalty you suggested, the robot will optimize for a reward function the human did not demonstrate. It will be safer, but it will not be the policy implied by the data. If we want the 'safe' policy, we should impose it as a hard constraint in the RL optimizer, not fake it in the reward function. This reward document reflects what the human* did*, not what we wish they* did*."*

  ---

  ### The Hard Truth: Where the Procedure Refuses to Run

  You asked if "give me a procedure" is the wrong frame. Here is the plain answer:

  **The protocol cannot solve the "Normative Gap."**
  IRL infers *revealed* preferences (what you did). Engineering often requires *normative* preferences (what you should have done).
  *   In Case 2, the protocol successfully identifies that the human *doesn't care* about the pens.
  *   But your lab might *need* a robot that cares about the pens (e.g., because breaking a pen is costly, even if the human didn't notice).
  *   The protocol will tell you: **"Data Underdetermined / Conflict Detected."** It cannot tell you which one to pick. That is a product decision, not a science decision.

  **Where Judgment Overrides Protocol:**
  1.  **Safety Criticality:** If a behavior looks like a preference but risks hardware damage (e.g., slamming a drawer), the protocol says "Underdetermined," but your judgment must say "Constraint." Do not IRL safety constraints. Hard-code them.
  2.  **The "Tuesday" Limit:** The protocol requires you to stop and flag ambiguity. Your PI wants a reward function. You will be pressured to pick $H_1$ even if $H_2$ is equally likely. The protocol's value here is not stopping you, but forcing you to write the **Warning Label**. That label is your insurance policy when the robot hacks the reward three months from now.

  **Final Recommendation:**
  Use the RAP to generate the "Reward Specification Document." When you hand it to your PI, highlight the **Prior Declaration** and **Warning Label** sections. If they sign off, you have done your job. You have converted an invisible scientific risk into a visible engineering assumption. That is the best a Master's student can do on a Tuesday.
