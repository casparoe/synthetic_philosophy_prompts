answer: |-
  **JOINT STATEMENT ON THE STRUCTURE OF EPISTEMIC JUSTIFICATION**

  **Drafted by:** The Foundationalist Member & The Coherentist Member
  **Convened by:** The Reading Group Convenor
  **Date:** 24 October 2023

  **Preamble**
  We, the undersigned, acknowledge that our previous debates regarding the epistemic regress problem have suffered from conflated definitions and unstated premises. While we maintain distinct positions on the architecture of justification, we agree that the dispute is not merely terminological. This document outlines our shared commitments, isolates our genuine disagreements, and identifies the specific philosophical cruxes that must be resolved to settle the matter. We intend this framework to be robust enough to analyse practical cases of conflicting expert testimony (such as medical diagnoses) where justification determines action.

  ***

  ### 1. Agreed Claims

  We jointly endorse the following substantive claims. These constrain the debate by ruling out sceptical dissolution and certain easy answers.

  1.  **The Normativity of Justification:** Epistemic justification is not merely a description of how beliefs are caused; it is a normative status concerning what a subject *ought* to believe given their cognitive situation. A justified belief is one held in accordance with epistemic duty or entitlement.
  2.  **The Reality of the Regress:** The epistemic regress problem is not a pseudo-problem generated by linguistic confusion. It correctly identifies a structural tension: if every reason requires a further reason, justification either never begins, never ends, or circles back.
  3.  **The Rejection of Infinitism (for Doxastic Justification):** We agree that Infinitism is not a viable solution for finite human agents. A chain of reasons that extends infinitely cannot be traversed by a human mind to warrant a specific belief at a specific time. Therefore, the structure of justification must be finite.
  4.  **Truth-Conductiveness:** A theory of justification cannot be purely internalist in a way that severs connection with the truth. A system of beliefs that is perfectly justified but systematically false (e.g., a coherent fairy tale) fails to capture the full value of epistemic warrant. Justification must increase the likelihood of truth, not merely consistency.
  5.  **The Illegitimacy of Bare Circularity:** We agree that *vicious* circularity is forbidden. A belief cannot be justified solely by itself, nor by a chain that returns to itself without acquiring additional warrant from outside the circle. (We disagree on what constitutes 'outside' and whether all coherence is circular).
  6.  **The Possibility of Knowledge:** We operate under the presumption that knowledge and justified belief are possible. Our theories are attempts to explain how this is possible, not to prove that it is impossible.

  ***

  ### 2. Disagreements Table

  The following table isolates where our positions diverge. The wording in the 'Foundationalist' and 'Coherentist' columns is phrased as each would endorse it, not as the other would criticise it.

  | Sub-Question | Foundationalist Formulation | Coherentist Formulation | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. The Source of Warrant** | Justification originates in 'basic beliefs' which possess non-inferential warrant. Their justification is intrinsic or derived directly from experience, not from other beliefs. | Justification is a systemic property. No belief is justified in isolation; warrant arises from the mutual support relations within a comprehensive web of beliefs. | **Substantive.** Disagreement on whether warrant can be atomic or must be holistic. |
  | **2. The Direction of Support** | Justificatory support is asymmetric and linear. Basic beliefs support non-basic beliefs, but non-basic beliefs cannot support the basic ones that ground them. | Justificatory support is symmetric and reciprocal. Beliefs justify each other mutually; the 'direction' is an artefact of analysis, not the structure of warrant itself. | **Substantive.** Disagreement on the logic of the 'because' relation in epistemology. |
  | **3. The Role of Experience** | Experience provides a non-doxastic foundation. Perceptual states can justify beliefs without themselves being beliefs that require justification. | Experience constrains the system but does not justify. Only a belief can justify a belief. Experience is merely the causal trigger for adjusting the web. | **Partly Verbal / Partly Substantive.** Depends on whether 'justification' is reserved for propositional relations only. |
  | **4. The Stopping Point** | The regress stops at a belief that is defensible without appealing to further beliefs (e.g., 'I seem to see a red patch'). | The regress stops when the system reaches a state of reflective equilibrium where adding or removing beliefs decreases overall coherence. | **Substantive.** One stops at a *point*, the other at a *state*. |
  | **5. Definition of 'Belief'** | We distinguish sharply between 'experiential states' and 'doxastic attitudes'. Only the latter are in the space of reasons. | We treat 'experiential reports' as beliefs within the system. There is no sharp ontological line between the given and the conceptual. | **Verbal.** Primarily a dispute over categorisation, though it drives substantive outcomes. |

  ***

  ### 3. Cruxes

  These are the specific philosophical pivot points. Settling these would force one of us to revise our position. We have agreed upon test cases or arguments that bear on each crux and record our predictions.

  **Crux A: The Input Problem (The World Constraint)**
  *   **The Issue:** Can a coherent system be justified if it is entirely cut off from the world? If justification is only coherence, what prevents a coherent fiction from counting as knowledge?
  *   **Shared Test Case:** The 'Brain in a Vat' scenario. Subject A is a normal perceiver; Subject B is a envatted brain fed identical experiences. Both have identical coherent belief systems.
  *   **Foundationalist Prediction:** Subject A has justified beliefs about the world; Subject B does not (or has less warrant). This is because Subject A's basic beliefs are causally and normatively linked to actual facts via perception. Coherence alone is insufficient.
  *   **Coherentist Prediction:** Both subjects are equally *justified*, though only Subject A has *knowledge* (if truth is a separate condition). Justification is internal to the system. If we demand external contact for justification, we are smuggling in a foundationalist 'Given'.
  *   **Resolution Condition:** If it can be shown that coherence *necessarily* tracks truth in the actual world without non-inferential input, the Coherentist wins. If it is shown that coherence is compatible with systematic falsehood without a foundational anchor, the Foundationalist wins.

  **Crux B: The Linearity Assumption**
  *   **The Issue:** Does the regress argument beg the question by assuming justification must be linear?
  *   **Shared Argument:** The 'Duck-Rabbit' perceptual shift. One can see the image as a duck or a rabbit. The justification for seeing it as a duck relies on the whole configuration, not a single line of reason.
  *   **Foundationalist Prediction:** Even in holistic perception, the justification reduces to specific features (lines, curves) that serve as local foundations. The regress argument holds because 'reason-giving' is inherently linear (A because B).
  *   **Coherentist Prediction:** The regress argument fails because it assumes a linear chain. Justification is like a crossword puzzle: the warrant for an entry depends on intersecting entries, not a single vertical chain. The regress dissolves when we accept mutual support.
  *   **Resolution Condition:** If 'reason-giving' can be formally modelled as non-linear without violating the law of non-contradiction, the Coherentist wins. If all mutual support can be analysed into hidden linear dependencies, the Foundationalist wins.

  **Crux C: The Arbitrariness of the Foundation**
  *   **The Issue:** How does the Foundationalist prevent the 'foundation' from being an arbitrary dogma?
  *   **Shared Thought Experiment:** The 'Stubborn Witness'. A subject claims a basic belief ('I see a light') but refuses to revise it even when all other coherent evidence suggests they are hallucinating.
  *   **Foundationalist Prediction:** The subject is justified in the basic belief (the experience) but unjustified in refusing to weigh it against other evidence. Foundationalism allows for defeasibility. The foundation is not arbitrary because it is constrained by the nature of experience itself.
  *   **Coherentist Prediction:** The subject is unjustified *full stop*. A belief that does not cohere with the wider system loses its warrant, even if it claims to be 'basic'. The Foundationalist cannot explain why the regress stops *here* rather than continuing, other than by fiat.
  *   **Resolution Condition:** If the Foundationalist can specify a non-arbitrary criterion for 'basicness' that is not merely 'where I choose to stop', they survive. If the Coherentist can explain how a belief loses warrant without appealing to a foundational 'friction' from the world, they survive.

  ***

  ### 4. Analysis of Verbal vs. Substantive Dispute

  We acknowledge that a significant portion of our past friction was verbal, specifically regarding the definition of 'reason' and 'belief'.

  *   **Where it was Verbal:** We frequently talked past one another regarding 'experience'. The Foundationalist uses 'experience' to denote a non-propositional state that confers warrant. The Coherentist uses 'belief' to denote any propositional attitude, including reports of experience. Once we agreed that the Coherentist treats experiential reports as privileged *within* the system, while the Foundationalist treats them as anchors *outside* the inferential chain, the heat diminished.
  *   **Where it is Substantive:** The disagreement over **Crux A (Input)** is not verbal. It concerns the metaphysics of knowledge. The Foundationalist insists that justification requires a causal/normative hook to reality that coherence cannot provide. The Coherentist insists that 'hooking onto reality' is itself a claim within the web of belief, not a relation we can step outside to verify. This is a genuine philosophical impasse that cannot be solved by defining terms.

  ***

  ### 5. Note on the Infinitist Position

  Although the third member of our group (the Infinitist) was not a signatory to this drafting, their presence influenced our agreement.

  *   **Shared Rejection:** We both reject Infinitism as a practical account of human justification. We agree that finite minds cannot hold an infinite chain of reasons explicitly.
  *   **Divergent Pressures:** However, the Infinitist critique puts different pressures on our respective views:
      *   **Pressure on Foundationalism:** The Infinitist argues that 'basic beliefs' are merely places where we *choose* to stop asking 'why?'. This aligns with the Coherentist's 'Arbitrariness' objection (Crux C). To defeat the Infinitist, the Foundationalist must prove the stopping point is *compulsory*, not optional.
      *   **Pressure on Coherentism:** The Infinitist argues that coherentism is just circularity disguised. To defeat the Infinitist (who accepts infinite chains over circles), the Coherentist must prove that mutual support is structurally distinct from vicious circularity.
  *   **Relevance to the Convenor's Medical Case:** In the scenario of conflicting medical opinions, the Infinitist would suggest one should never settle but continue seeking further opinions indefinitely. We both agree this is practically irrational. The Foundationalist would advise trusting the opinion grounded in the most direct diagnostic data (the 'foundation'). The Coherentist would advise trusting the opinion that best integrates the patient's history, symptoms, and test results (the 'coherence'). Our joint statement clarifies that this is not a difference about 'who is nicer', but a structural disagreement about whether diagnostic data stands alone or only has weight within a broader narrative.

  ***

  **Signed:**

  _________________________ (The Foundationalist)

  _________________________ (The Coherentist)

  _________________________ (The Convenor)
