prompt: |-
  I'm taking an upper-level seminar in philosophy of biology, and this week's discussion turned on the logic of costly signaling and the handicap principle. One of my classmates defended a view I have also seen in popular science writing: conspicuous consumption — designer clothes, luxury cars, status watches — is best understood on the model of the peacock's tail. Her argument ran as follows. Both are expensive, apparently wasteful displays whose credibility seems to come from the cost itself. Just as a peacock's tail honestly advertises viability because only a healthy bird can grow and carry one, a luxury watch honestly advertises disposable wealth because the wearer had to spend it; and just as it would be wrong to call the tail a pointless burden without asking what it is for, it is wrong to treat luxury consumption as mere waste or irrationality. She used this to push against the idea that consumerist display is a social pathology, or that advertising is simply manipulative, arguing that both amount to mistaking an honest signaling system for a pointlessly wasteful one.

  I want to know how far this analogy actually holds, because I suspect it is doing more work in her argument than she admits. What I'm looking for is not a list of casual objections, but a systematic audit. What exactly maps onto what — the peahen, the tail, the cost of growing it, the health it advertises, and the conditions that make it an honest signal; what plays those roles in the human consumption case, and how well? Where does the mapping break? Which features of the biological source — sexual selection, differential costs, the link between display and underlying condition — does the analogy quietly import into the target without argument, and are those features actually present among human consumers? And once the disanalogies are on the table, does her conclusion survive: is conspicuous consumption reasonably treated as an honest signaling system, or was the analogy carrying the whole argument? If the peacock is a poor source model, I would also like to hear what a better analogy would be, if one exists.

  Please present the audit as a JSON object with the following fields. `summary`: a one-paragraph bottom-line statement of the overall verdict. `correspondence_table`: an array of objects, each with `source_element` (the component of the peacock-tail case), `target_element` (the proposed counterpart in the human case), `mapping_quality` (one of "strong", "partial", or "weak"), and `notes` (a sentence or two on whether the mapping preserves the feature that matters). `disanalogies`: an array of objects, each with `feature` (the feature the analogy imports from the source), `break_in_target` (what goes wrong with it in the consumption case), `material` (a boolean: whether this disanalogy matters for the intended conclusion), and `explanation` (why it matters or does not). `quiet_imports`: an array of strings naming assumptions the analogy brings along without saying so. `verdict`: an object with `conclusion_survives` (one of "yes", "qualified", or "no") and `statement` (a sentence or two justifying that judgment). `better_analogy`: a string giving a replacement analogy and why it is better, or null if you think none is available.
reasoning: |-
  Here's a thinking process that leads to the suggested JSON response:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level philosophy of biology seminar.
      *   **Topic:** Logic of costly signaling/handicap principle applied to conspicuous consumption (luxury goods vs. peacock's tail).
      *   **Task:** Systematic audit of the analogy.
      *   **Format:** JSON object with specific fields (`summary`, `correspondence_table`, `disanalogies`, `quiet_imports`, `verdict`, `better_analogy`).
      *   **Tone:** Philosophical, rigorous, analytical (not just casual objections).
      *   **Goal:** Determine if the analogy holds enough weight to support the conclusion that conspicuous consumption is an "honest signaling system" rather than "social pathology."

  2.  **Deconstruct the Analogy (Peacock vs. Luxury Consumer):**
      *   *Source (Peacock):*
          *   Signal: Tail.
          *   Cost: Energy to grow, risk of predation, mobility reduction.
          *   Underlying Quality: Genetic viability/health.
          *   Receiver: Peahen (sexual selection).
          *   Mechanism: Handicap Principle (Zahavi). Cost ensures honesty because low-quality individuals cannot afford the cost.
          *   Evolution: Natural/Sexual selection over generations.
      *   *Target (Human Consumption):*
          *   Signal: Luxury goods (watches, cars).
          *   Cost: Financial expenditure.
          *   Underlying Quality: Wealth/Status/Resource holding potential.
          *   Receiver: Potential mates, rivals, social group.
          *   Mechanism: Cultural evolution, economic status seeking.
          *   Evolution: Individual choice, cultural trends.

  3.  **Evaluate Correspondence (Mapping Quality):**
      *   *Tail <-> Luxury Good:* Strong. Both are visible, costly displays.
      *   *Cost of Growth <-> Financial Cost:* Partial. Biological cost is physiological/survival risk; financial cost is resource allocation. Money can be borrowed/faked (credit), unlike genetic health.
      *   *Genetic Viability <-> Wealth/Status:* Weak/Partial. Wealth is not necessarily a proxy for biological fitness or "quality" in the evolutionary sense. It's often inherited or luck-based, not just merit-based.
      *   *Peahen <-> Social Audience:* Strong. There is a receiver evaluating the signal.
      *   *Honesty Mechanism (Handicap) <-> Price Barrier:* Partial. Price creates a barrier, but counterfeits and credit undermine the "honesty" constraint more easily than in biology.
      *   *Evolutionary Stability <-> Cultural Stability:* Weak. Biological signals are evolutionarily stable strategies (ESS); fashion trends change rapidly and can be decoupled from actual wealth (e.g., streetwear vs. suits).

  4.  **Identify Disanalogies (Where it breaks):**
      *   *Inheritance/Genetics vs. Economic Accumulation:* Peacock tails signal *genetic* quality. Wealth signals *resource* access, which isn't always heritable or indicative of individual competence.
      *   *Unconscious Instinct vs. Conscious Strategy:* Peacocks don't "choose" to signal; humans do. This introduces deception (buying on credit, renting, faking).
      *   *Stability vs. Volatility:* Biological signals are stable over millennia; luxury trends shift yearly.
      *   *Survival Cost vs. Opportunity Cost:* The tail reduces survival chances directly. Spending money doesn't physically endanger the spender (usually).
      *   *Universal Receiver vs. Segmented Audience:* Peahens generally agree on tail quality. Human status markers are culturally relative (what signals status in one group signals nerdiness in another).

  5.  **Identify Quiet Imports (Assumptions):**
      *   That wealth correlates with fitness/quality.
      *   That the signaling is unconscious/instinctive rather than manipulative.
      *   That the system is in equilibrium (ESS) rather than in flux.
      *   That the "cost" is the *only* thing guaranteeing honesty (ignoring regulation, counterfeits, credit).
      *   That the function is *only* signaling (ignoring utility/enjoyment of the goods).

  6.  **Assess the Conclusion:**
      *   *Classmate's Claim:* Conspicuous consumption is an honest signaling system, not pathology/waste.
      *   *Audit Result:* The analogy supports the idea that it *functions* as signaling. However, calling it "honest" is problematic due to the ease of deception (credit, fakes) and the lack of a tight link between wealth and underlying "quality" (virtue/fitness). It might be signaling, but not necessarily *honest* signaling in the Zahavian sense. It could be manipulative or noisy.
      *   *Verdict:* Qualified. It explains the *existence* of the behavior, but fails to vindicate it as "honest" or rule out pathology.

  7.  **Select a Better Analogy:**
      *   *Idea:* Language or Ritual.
      *   *Why:* Human signaling is cultural, symbolic, and governed by norms rather than genetics. Veblenian pecuniary emulation is closer to a game of social grammar than biological handicap.
      *   *Alternative:* Potlatch. A cultural ritual of destruction/giving to establish rank. Fits the "waste" aspect better than the peacock.

  8.  **Drafting the JSON Content (Iterative refinement):**
      *   *Summary:* Needs to be punchy. The analogy captures the *logic* of cost but fails on the *mechanism* of honesty and the *nature* of the quality signaled.
      *   *Correspondence Table:* Ensure distinct elements (Signal, Cost, Quality, Receiver, Mechanism).
      *   *Disanalogies:* Focus on the "Honesty" constraint and the "Fitness" link.
      *   *Quiet Imports:* Focus on the assumption of equilibrium and the conflation of wealth with fitness.
      *   *Verdict:* "Qualified." The behavior is signaling, but the "honesty" claim is unsupported by the analogy.
      *   *Better Analogy:* The Potlatch. It acknowledges the cultural/sociological dimension of "waste" as status building without implying biological inevitability.

  9.  **Review against Constraints:**
      *   JSON format? Yes.
      *   Specific fields? Yes.
      *   No casual objections? Ensure the tone is analytical.
      *   Upper-level seminar appropriateness? Use terms like "Evolutionarily Stable Strategy," "Zahavian Handicap," "Pecuniary Emulation."

  10. **Final Polish:** Check JSON validity (escaping quotes, etc.). Ensure the `material` boolean in disanalogies is correctly assessed (does it hurt the argument?). *Self-Correction on `material`:* If the disanalogy undermines the "honesty" claim, it is material. If it just notes a difference in biology vs. culture but doesn't change the signaling logic, it might be immaterial. The ease of faking (credit) is material to the "honesty" claim.

  11. **Final Output Generation** (Proceed to generate JSON).
