  Here is a sorting of the five strategies into three tiers, ranked by how effectively they secure a genuine causal role for culture without yielding ground to materialist determinism.

  ### Tier 1: The Decisive Variables
  **Strategies:** Preference-shaping, Equilibrium selection

  **Rationale:** These strategies succeed best because they position culture as an independent variable that determines specific economic outcomes, rather than merely modifying forces generated elsewhere. They grant culture the power to alter the input (what agents want) or the output (which stable state society adopts) in ways material conditions alone cannot predict.

  *   **Preference-shaping:** This lands in the top tier because it treats values as the direct source of motivational energy, though it remains vulnerable to the counter-claim that preferences themselves are shaped by material conditions.
  *   **Equilibrium selection:** This belongs here because it demonstrates that material conditions are often indeterminate, leaving culture as the only factor capable of explaining why one economic path was chosen over another.

  ### Tier 2: The Conceptual Ground
  **Strategy:** Constitutive reading

  **Rationale:** This strategy occupies a middle tier because it offers the strongest philosophical defense against materialism by denying the validity of the material/cultural split, yet it risks dissolving the very notion of a "causal role" in the process. It protects culture from being sidelined but makes empirical verification of its causal power difficult, as it reframes culture as the medium of action rather than a driver of it.

  *   **Constitutive reading:** This lands in the middle because it secures culture's primacy by redefining the terms of causality itself, arguing that economic acts cannot exist independently of the cultural categories that give them meaning.

  ### Tier 3: The Facilitators
  **Strategies:** Channeling, Enabling conditions

  **Rationale:** These strategies rank lowest because they ultimately concede that material interests provide the engine or the trigger for change, assigning culture only a secondary role in directing or permitting that change. While they acknowledge cultural influence, they treat values as dependent variables that modify a process driven by underlying material forces.

  *   **Channeling:** This lands in the bottom tier because, like Weber's own "switchman" metaphor, it admits that the motivational energy comes from interests, leaving culture only to determine the direction of the train.
  *   **Enabling conditions:** This belongs here because it reduces culture to a background scaffold like trust or honesty, which allows markets to function but does not explain why they emerge or change in the first place.
