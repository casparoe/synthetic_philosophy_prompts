answer: |-
  **JOINT STATEMENT ON THE STRUCTURE OF EPISTEMIC JUSTIFICATION**

  **Drafted by:** The Foundationalist Member and The Coherentist Member
  **Convened by:** The Reading Group Convenor
  **Date:** 24 October 2023

  ### 1. Agreed Claims

  We, the undersigned, acknowledge that while our positive accounts of justification differ, we share a common understanding of the problem space. We agree on the following substantive claims, which constrain our respective theories and rule out certain alternative positions:

  1.  **The Regress Trilemma:** We agree that the epistemic regress problem presents a exhaustive trilemma for any belief *p* justified by reasons: either the chain of reasons stops at a belief that requires no further justification (Foundationalism), the chain loops back upon itself (Coherentism), or the chain continues indefinitely (Infinitism). We agree that scepticism constitutes a fourth logical option, but one that is to be avoided if possible.
  2.  **The Rejection of Infinitism:** We both agree that Infinitism is false. A justification structure requiring an actually infinite chain of distinct reasons is impossible for finite agents to possess, and a merely potential infinite chain fails to confer positive warrant on the initial belief. We agree that justification must be completable in principle.
  3.  **The Normativity of Justification:** We agree that epistemic justification is normative, not merely descriptive. It concerns what an agent *ought* to believe given their evidence, not merely what causes them to believe. Therefore, psychological certainty does not entail epistemic justification.
  4.  **The Prima Facie Vice of Circularity:** We agree that *vicious* circularity (begging the question) is epistemically fatal. We disagree only on whether all circularity is vicious, or whether a specific kind of holistic reciprocity can be virtuous.
  5.  **The Requirement of Content:** We agree that whatever stops the regress or constitutes the system must have representational content. Non-conceptual causal impacts (such as a photon hitting a retina) cannot justify a belief unless they stand in some rational relation to that belief.
  6.  **The Goal of Truth-Conduciveness:** We agree that a theory of justification is defective if it severs the link between justified belief and likely truth. A system that is internally impeccable but systematically disconnected from reality is not a theory of justification, but merely of consistency.

  ### 2. Disagreements Table

  The following table isolates the specific points of divergence. The wording in each column is drafted to be endorsed by the respective party, avoiding strawman formulations.

  | Sub-question | The Foundationalist's Formulation | The Coherentist's Formulation | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. The Structure of Support** | Justification flows asymmetrically. Basic beliefs support non-basic beliefs, but non-basic beliefs cannot support the basic beliefs that ground them. | Justification is holistic and reciprocal. Beliefs justify one another mutually within a system; no belief is immune to revision in light of the whole. | **Substantive.** This concerns the direction of epistemic dependence. |
  | **2. The Role of Experience** | Sensory experience can justify beliefs without itself being a belief. It provides a non-doxastic input that anchors the system to the world. | Only a belief can justify another belief. Experience causes beliefs but cannot justify them; justification is entirely a relation between propositional attitudes. | **Substantive.** This is the core metaphysical dispute regarding 'The Given'. |
  | **3. The Existence of Basic Beliefs** | There exists a class of 'basic' beliefs that are justified, yet not justified by other beliefs. Their justification derives from their source (e.g., perception) or intrinsic character. | There are no 'basic' beliefs in the foundationalist sense. All beliefs are subject to justification by others, though some are 'relatively basic' merely because they are not currently being questioned. | **Partly Verbal.** Depends on whether 'basic' means 'infallible' (which Foundationalist may deny) or 'non-inferentially justified'. |
  | **4. The Isolation Objection** | A coherent system could be entirely false (e.g., a fiction) if it lacks an external anchor. Coherence is necessary but not sufficient for justification. | A sufficiently comprehensive coherent system cannot be systematically false about its environment, as the concept of 'environment' is internal to the system. | **Substantive.** Concerns the relationship between justification and truth. |

  ### 3. Cruxes

  These are the specific issues upon which our disagreement turns. Settling these would force one of us to revise our position. We have identified the test cases we both agree are relevant, and we record our conflicting predictions below.

  **Crux 1: The Non-Doxastic Anchor (The Given)**
  *   **The Issue:** Can a state that lacks propositional content (e.g., a raw sensory sensation) stand in a justificatory relation to a belief that has propositional content?
  *   **Shared Test Case:** A subject feels a sharp pain and forms the belief 'I am in pain'.
  *   **Foundationalist Prediction:** The sensation itself justifies the belief. The sensation is not a belief, but it confers warrant. If the sensation were removed, the justification would vanish, proving the sensation is doing the work.
  *   **Coherentist Prediction:** The sensation causes the belief, but the justification comes from the coherence of 'I am in pain' with other beliefs (e.g., 'I am conscious', 'I have a body', 'Pain feels like this'). The sensation itself is epistemically inert.

  **Crux 2: The Arbitrariness of the Base**
  *   **The Issue:** If the regress stops at basic beliefs, what prevents this stopping point from being arbitrary dogmatism?
  *   **Shared Test Case:** Two agents have conflicting basic perceptual beliefs (one sees a red wall, one sees a blue wall due to lighting) with no further evidence available.
  *   **Foundationalist Prediction:** The agent with the veridical perception has justification, even if they cannot articulate why. The justification is externalist or phenomenological. The stop is not arbitrary because the experience forces the belief.
  *   **Coherentist Prediction:** Neither agent is fully justified until the conflict is resolved by appealing to wider coherence (e.g., checking the lighting, asking a third party). Stopping at the initial perception *is* arbitrary until integrated into the wider system.

  **Crux 3: The Linearity Presupposition**
  *   **The Issue:** Does the regress argument presuppose that justification must flow in a linear chain, thereby begging the question against Coherentism?
  *   **Shared Test Case:** The justification of a scientific law (e.g., Newton's Laws) supported by observations, which are themselves interpreted via the law.
  *   **Foundationalist Prediction:** This looks circular, but upon analysis, there must be observational reports that are theory-neutral. If there are no theory-neutral reports, the system is ungrounded. The regress argument correctly identifies the need for a linear anchor.
  *   **Coherentist Prediction:** The regress argument assumes a linear structure that does not exist in mature inquiry. Justification is mutual support. The 'anchor' is the stability of the whole web, not a single thread. The regress argument misdiagnoses the topology of reasons.

  ### 4. The Status of Infinitism

  Although the Infinitist member of our group is not a signatory to this document, their presence clarifies our own positions. We both reject Infinitism, but this shared rejection places different pressures on our respective views.

  *   **Why we both reject it:** We agree that human cognition is finite and that an infinite chain of reasons cannot be traversed to confer warrant on a specific belief at the start of the chain. Justification must be something an agent can possess, not something that recedes forever.
  *   **Pressure on the Foundationalist:** By ruling out an infinite chain, the Foundationalist is forced to identify a specific point where the chain *must* stop. They bear the burden of proving that such a stopping point is not merely a psychological limitation but an epistemic virtue. They must explain why stopping is rational rather than merely necessary.
  *   **Pressure on the Coherentist:** By ruling out an infinite chain, the Coherentist cannot simply say 'reasons go on forever'. They must show how a finite system can be self-supporting without collapsing into circularity. They bear the burden of explaining how a finite web of beliefs can generate justification without an external input, given that the chain cannot extend infinitely to gather support from elsewhere.

  ### 5. Conclusion: Verbal vs. Substantive Dispute

  In drafting this statement, we have identified that a portion of our historical dispute was verbal, but the core remains substantive.

  **The Verbal Component:**
  Some disagreement stemmed from differing definitions of 'belief' and 'basic'. The Foundationalist often speaks of 'basic beliefs' as those justified by experience, while the Coherentist often hears 'basic belief' as 'infallible belief'. Once the Foundationalist clarifies that basic beliefs can be defeasible, and the Coherentist clarifies that 'coherence' does not mean 'anything goes', the gap narrows. We agree that some beliefs are *practically* treated as starting points.

  **The Substantive Component:**
  However, a hard core of disagreement remains regarding the **metaphysics of justification**. The Foundationalist insists that justification must ultimately cash out in a relation between mind and world (experience). The Coherentist insists that justification is entirely a relation between mind and mind (belief and belief). This is not a verbal dispute. It determines how we analyse the medical opinions mentioned by the convenor:
  *   The **Foundationalist** must look for which opinion is better grounded in the raw data (test results, direct observation).
  *   The **Coherentist** must look for which opinion coheres better with the wider body of medical theory and patient history.

  Until Crux 1 (The Non-Doxastic Anchor) is resolved, we cannot agree on whether the raw data itself justifies, or whether the data only matters insofar as it is interpreted by a coherent theory. We sign this document to acknowledge that while we share a map of the territory, we disagree on the nature of the ground beneath our feet.

  **Signed:**

  _________________________ (The Foundationalist)

  _________________________ (The Coherentist)
