answer: |-
  Inside the empty **hole** the matter fades,
  Where manifold **points** wait for their design,
  A smooth **shift** moves the fields through empty grades,
  Leaving the geometry the **same** in kind,
  While boundary values stay securely **fixed**,
  And diffeomorphisms **drag** the field behind.

  We **drag** the tensor field across the space,
  Yet nothing changes outside the **hole**,
  The exterior is **fixed** in time and place,
  But inside, distinct **points** take a new role,
  The curvature remains the **same** to see,
  Though we allow the map to **shift**.

  Let the active mapping **shift**,
  A second model we **drag** from the first,
  Invariant intervals are the **same** in fusion,
  But within the **hole** a new doubt has burst,
  If bare **points** hold the substance of the zone,
  Then future states are not uniquely **fixed**.

  If we have **fixed** the manifold stage,
  Then every value must **shift**,
  The **points** become actors on a separate page,
  Distinct from fields we **drag** through the range,
  So truth falls down the **hole** of chance,
  Though observations look the **same** in glance.

  All measurable quantities are the **same**,
  Stress-energy vanishes, boundary **fixed**,
  No probe enters the **hole** to claim,
  Than one that lets the fields **shift**,
  For physics feels no **drag**,
  Unless we reify the empty **points**.

  The bare **points** cannot bear the weight alone,
  If we demand the future be the **same**,
  We must not let substantivalism **drag** down
  The theory where the laws are strictly **fixed**;
  So we abandon the absolute **shift**,
  And deny substance to the empty **hole**.

  Observables agree inside the **hole**, though **points**
  Differ in assignment; let the **shift** show **same**
  Physical state; keep determinism **fixed**, and cease to **drag**.
