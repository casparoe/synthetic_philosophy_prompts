answer: |-
  **UNIVERSITY EXAMINATION PAPER**

  **Module:** Formal Epistemology and Epistemic Game Theory
  **Level:** Final-Year Undergraduate
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer **one** question.

  ***

  **Question 1**

  Consider two Bayesian agents, Alice and Bob, operating within a state space $\Omega$. Both agents are fully rational in the standard decision-theoretic sense: they maximise expected utility relative to their subjective probabilities and preferences. Suppose it is common knowledge between them that Alice's posterior probability for some event $E$ is $x$, and Bob's posterior probability for $E$ is $y$, where $x \neq y$.

  Aumann's Agreement Theorem is frequently glossed in the literature as demonstrating that rational agents cannot 'agree to disagree'. However, in the scenario described above, two fully rational agents possess common knowledge of their posteriors yet maintain different probability assignments for $E$.

  Write an essay that addresses the following:
  1.  Explain why the scenario described is logically compatible with Aumann's Agreement Theorem. Which specific assumption of the theorem fails in this case?
  2.  Clarify the relationship between 'rationality' (in the expected-utility sense) and the assumptions required for the Agreement Theorem. Does the theorem preclude rational disagreement?
  3.  Assess what the theorem actually establishes regarding the possibility of disagreement among agents with different priors versus agents with different information partitions. In your assessment, distinguish between common knowledge of posteriors and common knowledge of evidence.

  ***

  **MODEL ANSWER**

  Aumann's Agreement Theorem is a cornerstone of formal epistemology, yet it is subject to persistent misinterpretation. The theorem states that if two agents share a common prior probability distribution, and if their posterior probabilities for a given event are common knowledge, then those posteriors must be identical. The scenario presented in the examination question describes two agents, Alice and Bob, who are rational and have common knowledge of their posteriors, yet they disagree ($x \neq y$). This situation is entirely compatible with Aumann's theorem because the scenario explicitly omits the requirement of a **common prior**.

  To explain the compatibility, one must inspect the proof structure. Aumann's result relies on the fact that if posteriors are common knowledge, the agents are effectively conditioning on the same union of partition cells (the 'meet' of their information partitions). If they started with the same prior, conditioning on the same information set must yield the same posterior. However, if Alice and Bob begin with different prior probability distributions over $\Omega$, they may process the same information (or even have common knowledge of how they processed it) and still arrive at different conclusions. Therefore, the assumption that fails in the examination scenario is the Common Prior Assumption (CPA). Without a common prior, the mathematical constraint forcing the equality of posteriors dissolves, permitting rational agents to agree to disagree.

  This leads to the second point regarding rationality. The theorem is often glossed as a result about rationality, implying that disagreement is a symptom of irrationality. This is a category error. The agents in the scenario are stipulated to be fully rational expected-utility maximisers. Aumann's theorem does not constrain utility functions or the rationality of belief updating per se; it constrains the relationship between priors and information. Rationality, in the Bayesian sense, requires coherence and conditionalisation, but it does not mandate that agents share the same initial credences. Consequently, the theorem does not preclude rational disagreement simpliciter; it only precludes rational disagreement *given a common prior*. If one views priors as subjective expressions of initial uncertainty, then persistent disagreement between rational agents is not only possible but expected when priors diverge.

  Finally, we must assess what the theorem establishes regarding different priors versus different information. A common confusion arises between common knowledge of posteriors and common knowledge of evidence (or information partitions). Common knowledge of posteriors means Alice knows Bob's probability, Bob knows Alice's, Alice knows Bob knows, and so on. It does not imply they possess the same evidence or know each other's information partitions. Agents can have different information partitions and still satisfy the theorem's conditions provided they communicate their posteriors until those values become common knowledge.

  However, if agents have different priors, no amount of sharing information or posteriors will necessarily converge their beliefs. The theorem thus establishes a conditional claim: disagreement implies either a lack of common priors or a lack of common knowledge of posteriors. It does not force convergence on truth, but rather convergence on belief *if* the starting point (the prior) is shared. This highlights that the substantive epistemic work in the theorem is done by the Common Prior Assumption, not by the rationality of the agents. In epistemic game theory, this distinguishes Aumann's result from results relying on Common Knowledge of Rationality (CKR), such as the iterated elimination of dominated strategies. CKR concerns strategic optimisation; Aumann's theorem concerns probabilistic coherence relative to a shared starting measure.

  In conclusion, the scenario describes a failure of the Common Prior Assumption, not a failure of rationality. Aumann's theorem demonstrates that with a common prior, common knowledge of beliefs forces agreement. Without that prior, rational agents with common knowledge of their differing posteriors can coherently maintain their disagreement. The theorem therefore serves not as a prohibition on disagreement, but as a diagnostic tool: persistent disagreement among communicating agents indicates a divergence in their fundamental prior assumptions rather than a failure of logical processing.

  ***

  **MARKING SCHEME**

  **Total Marks:** 20

  **Grade Boundaries and Specific Moves**

  | Class | Marks | Required Content and Moves |
  | :--- | :--- | :--- |
  | **First** | **17–20** | **Must contain all of the following:**<br>1. **Precise Identification:** Explicitly identifies the failure of the Common Prior Assumption (CPA) as the reason the scenario is compatible with the theorem.<br>2. **Rationality Distinction:** Clearly distinguishes between decision-theoretic rationality (EU maximisation) and the epistemic constraints of the theorem. Argues that the theorem is not primarily about rationality.<br>3. **Partition vs. Posterior:** Explicitly distinguishes between common knowledge of *posteriors* and common knowledge of *information partitions/evidence*. Explains that agents can have different partitions but still fall under the theorem if priors are common.<br>4. **Critical Assessment:** Offers a nuanced assessment of what the theorem establishes (e.g., disagreement as a diagnostic for prior divergence rather than irrationality). |
  | **Upper Second** | **14–16** | **Must contain most of the following:**<br>1. Correctly identifies that the Common Prior Assumption is missing/failed.<br>2. Acknowledges that agents can be rational while disagreeing.<br>3. Explains the basic mechanics of the theorem (conditioning on the meet of partitions).<br>4. **Deficiency:** May lack the nuanced distinction between CK of posteriors vs. CK of partitions, or may treat the 'rationality' aspect somewhat superficially (e.g., stating they are rational without explaining why the theorem doesn't forbid it). |
  | **Lower Second** | **11–13** | Identifies that priors are important but may be vague on the 'common knowledge' aspect. May confuse the conditions of the theorem. Basic understanding of Bayesian updating is present but application to the specific crux is weak. |
  | **Third/Fail** | **0–10** | Fundamental misunderstanding of the theorem. Claims the scenario contradicts Aumann. Fails to identify the role of priors. |

  **Common Errors and Penalties**

  Examiners must deduct marks for the following specific errors. These deductions are cumulative but should not reduce the total mark below zero.

  | Error | Deduction | Rationale for Error |
  | :--- | :--- | :--- |
  | **1. The Rationality Error**<br>Claiming that the scenario contradicts Aumann's theorem because the agents are rational, or claiming the theorem proves rational agents *must* agree regardless of priors. | **4 Marks** | Students often conflate the 'rationality' gloss found in introductory texts with the formal mathematical conditions. They fail to see that Aumann's theorem is a probabilistic result dependent on priors, not a normative result on EU maximisation. |
  | **2. The Evidence Error**<br>Treating common knowledge of posteriors as implying common knowledge of one another's evidence or information partitions (i.e., assuming that knowing the probability means knowing the data that generated it). | **3 Marks** | Students frequently assume that if I know your probability, I know your information set. This confuses the output of the updating function with the input. Aumann's theorem works precisely because agents *do not* need to share partitions, only the resulting probabilities, provided priors are common. |

  **Examiner Notes:**
  *   Ensure British English spelling is used in feedback (e.g., 'maximisers', 'analyse', 'programme').
  *   A First-class answer must go beyond merely stating the CPA failed; it must explain *why* that allows the disagreement to persist despite common knowledge of posteriors.
  *   If a candidate commits both Common Errors, the maximum achievable mark is 13 (Lower Second), regardless of the quality of the remaining prose.
