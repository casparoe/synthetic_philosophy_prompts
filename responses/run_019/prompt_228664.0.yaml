answer: |-
  Here is the session plan, structured to navigate the specific disciplinary backgrounds of your students while securing the philosophical distinctions required to make Gauthier's move intelligible.

  ### 1. The Order of Operations (and the Dependency Question)

  **Your intuition is correct.** You must secure the distinction between *reasons to intend* and *reasons to act* before presenting the Toxin case.

  **Why:** Students trained in game theory and cognitive science typically model intention as either (a) a **prediction** of future behavior (a belief state) or (b) a **decision** to maximize utility at the time of action.
  *   If intention is a *prediction*, the Toxin Puzzle is trivial: The agent predicts they won't drink, lies to get the money, and doesn't drink. There is no paradox, only fraud.
  *   If intention is a *decision to maximize*, the puzzle is solved by standard dynamic inconsistency: The agent maximizes at $t_1$ (intend), then re-optimizes at $t_2$ (don't drink).

  **The Dependency:** Gauthier's passage only has traction if intention is understood as a **normative commitment** that creates a reason for action *independent* of the immediate payoff. You need to establish that intention has a "mind-to-world" direction of fit (like belief) but also a "world-to-mind" direction of fit (like desire), and crucially, that it entails a **belief that one will act**.

  **The Sequence:**
  1.  **Conceptual Groundwork (15 mins):** Define intention not as desire or prediction, but as a commitment that entails a belief in success. Establish the "Strong Belief Thesis" (you cannot intend to do what you believe you will not do).
  2.  **The Carrying Example (20 mins):** A mundane analog to isolate the normative structure without the sci-fi elements.
  3.  **The Toxin Case (20 mins):** Introduce the Billionaire and the Machine. Map it onto the carrying example. Show where standard utility maximization breaks (the "deliberation gap").
  4.  **Gauthier's Response (20 mins):** Introduce the passage. Analyze the move from "rational intention" to "rational action."
  5.  **The Critique & Closing Check (15 mins):** Expose the circularity in Gauthier's "sincere intention" and run the modified cases.

  ---

  ### 2. The Carrying Example

  **The Case:** **The "Honesty Bonus" for a Tedious Task.**
  *   **Setup:** A researcher offers you \$100. To receive it, you must truthfully report *tonight* that you **sincerely intend** to complete a tedious, unpaid 2-hour survey *tomorrow*.
  *   **Mechanism:** The \$100 is deposited into your account tomorrow at 8:00 AM, *before* the survey deadline (5:00 PM). There is no penalty for failing to submit the survey, and no mechanism to verify your intention other than your own sincerity (no scanner).
  *   **Cost:** Completing the survey is purely costly (time/effort) with no independent benefit (you don't care about the research).

  **Structural Features it Shares with Toxin:**
  1.  **Reward Keyed to Intending:** The payoff (\$100) is triggered by the mental state at $t_1$, not the action at $t_2$.
  2.  **Incentive-Free Action:** At $t_2$, the money is sunk. The action (survey) is net negative utility.
  3.  **Sincerity Condition:** You cannot simply "say" you intend; you must *actually* intend (mirroring the scanner's requirement for a genuine state).

  **Structural Features it Lacks:**
  1.  **No External Predictor:** There is no machine verifying your brain state. This forces the students to confront the *first-person* constraint: "Can *I* make myself believe I will do this?"
  2.  **No Self-Deception/Forgetting:** Stipulate that the agent is fully transparent to themselves and remembers the payoff structure perfectly.

  **Why Not "Resolving to Run at 6 AM"?**
  *   **The Problem:** That example smuggles in **Weakness of Will (Akrasia)**. In the running case, the agent *has* a reason to run (health/fitness) but lacks the willpower.
  *   **The Lesson:** The Toxin Puzzle is not about willpower; it is about **reasons**. In Toxin, the agent has *zero* reason to drink the poison at $t_2$. If you use the running example, Econ/PolSci students will solve it by suggesting "commitment devices" (e.g., bet a friend). But in Toxin, no commitment device works because the reward is already secured before the device triggers. The "Honesty Bonus" isolates the *rationality of the mental state* from the *strength of the will*.

  ---

  ### 3. Misconceptions (Order of Battle)

  Address these in the following sequence to prevent them from hardening.

  **1. "Intention is just a Strong Desire or Decision to Try."**
  *   **When:** During Conceptual Groundwork (Step 1).
  *   **The Fix:** CogSci students often view intention as a gradient of motivational force. You must insist on the **Belief Condition**. If I know I won't drink the toxin, I cannot intend to drink it, no matter how much I "want" the money. Intention requires a belief that the action will occur.

  **2. "This is Ordinary Time-Inconsistency; Use a Commitment Device."**
  *   **When:** During the Carrying Example (Step 2).
  *   **The Fix:** Students will suggest burning the bridge (e.g., "Publicly promise to do the survey"). Point out that in the Toxin/Honesty structure, the reward is given *before* the action is due. Once you have the \$100 at 8:00 AM, a commitment device to force you to do the survey is purely costly. Rational agents do not incur costs for no benefit.

  **3. "It's a Re-run of Newcomb's Problem."**
  *   **When:** Introducing the Toxin Case (Step 3).
  *   **The Fix:** PolSci/Econ students will see the "Predictor" and think Newcomb. Clarify the causal structure. In Newcomb, your choice *provides evidence* of what the predictor did. In Toxin, your intention *causes* the money, but your *action* does not. The money is already in the bank (or not) when you hold the vial. This is a **Causal Decision Theory** problem, not an Evidential one.

  **4. "Gauthier Has Dissolved the Puzzle."**
  *   **When:** After reading the Passage (Step 4).
  *   **The Fix:** This is the critical philosophical move. Students will read Gauthier and think, "Okay, so drinking is rational."
  *   **The Counter:** Point to the phrase: *"compatible with the sincere intention that you form today."*
  *   **The Trap:** Kavka's argument is that a clear-eyed rational agent **cannot form** that sincere intention in the first place, because they know they won't drink. Gauthier *assumes* the intention is formed to prove the action is rational. He begs the question against Kavka. He changes the definition of the rational agent (from "act maximizer" to "constrained maximizer") but doesn't explain how the agent *deliberates* their way into the intention at $t_1$ given the knowledge at $t_2$.

  ---

  ### 4. The Closing Check (Modified Cases)

  Do not ask for a summary. Hand out a half-sheet with three modifications to the Toxin Case. Ask them to vote: **Does the puzzle dissolve, or does it remain?**

  **Modification A: The Payout Depends on Drinking.**
  *   *Change:* You get \$1M only if you *actually drink* the toxin tomorrow.
  *   *Correct Answer:* **Puzzle Dissolves.**
  *   *Reasoning:* Reasons to intend and reasons to act are now aligned. Standard instrumental rationality applies.

  **Modification B: The Toxin is Painless.**
  *   *Change:* The toxin makes you sick for an hour, but you enjoy the taste, and the sickness is exactly offset by the pleasure of the taste (Net Cost = 0).
  *   *Correct Answer:* **Puzzle Dissolves.**
  *   *Reasoning:* If the action is costless, there is no conflict between intending and doing. You can sincerely intend because you have no reason *not* to act.

  **Modification C: The Hypnotist.**
  *   *Change:* You can pay a hypnotist \$10 tonight to install a sincere intention to drink. You still get the \$1M if you have the intention.
  *   *Correct Answer:* **Puzzle Relocates (but is solvable).**
  *   *Reasoning:* This is the "Self-Binding" solution. The puzzle dissolves *if* it is rational to hire the hypnotist. It relocates to: "Can you intend to hire the hypnotist?" (Since hiring is costly and only useful if it makes you drink, but you won't drink...). *Note: If they say "Puzzle Dissolves," accept it if they justify that the net gain (\$1M - \$10 - Cost of Sickness) is positive. The key is recognizing that this breaks the "no reason to act" constraint by manufacturing a causal link.*

  **Success Metric:** If they treat Modification A as the "obvious" one but struggle with C, they understand that the core tension is the **severance of the reason for intending from the reason for acting**.

  ---

  ### 5. What to Openly Refuse to Cover

  Begin or end the session by explicitly bracketing two topics to maintain the normative focus.

  1.  **The Experimental Literature:** "We will not discuss whether psychological subjects *can* actually trick themselves into drinking. That is an empirical question about human cognitive architecture. We are asking whether a *rational agent* (as defined by your models) *should*."
  2.  **Nuclear Deterrence Origins:** "Kavka developed this with nuclear war in mind (can you intend to retaliate if it's suicidal?). While that is the historical provenance, we are treating this as a problem of individual rational agency. Importing geopolitical strategy will confuse the micro-foundations we are building today."

  **Rationale:** This signals to the Econ/PolSci students that you are not ignoring their empirical/strategic instincts, but that the *philosophical* work requires isolating the logic of rationality from the psychology of behavior or the history of policy.
