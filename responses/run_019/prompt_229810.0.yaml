      *   *Does the conclusion survive?*
          *   Yes, because the user's code isn't a Wittgensteinian Private Language. It's a public language encoded.
      *   *Does it beg the question?*
          *   Yes, it assumes the "key" (meaning) is stable and accessible, which is exactly what Wittgenstein challenges.

  5.  **Develop a Better Analogy:**
      *   Need something that highlights the *lack of a check* on correctness.
