      *   *Verdict:* The user is largely right. They are addressing different *aspects* of the free will problem. Dennett addresses the *social/moral utility* of free will. Frankfurt addresses the *psychological authenticity* of free will. However, they converge on the goal of salvaging responsibility without libertarianism.

