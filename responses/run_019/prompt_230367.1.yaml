      *   **Frankfurt's Position:** "Freedom of the Will and the Concept of a Person." Freedom is about "wholehearted identification" with one's desires/volitions (hierarchical model), not about alternative possibilities (PAP).
      *   **Task:** Compare the two views. Are they competing or talking past each other? Which is the better account of why *ordinary people* care about free will?
      *   **Requirement:** Pick one and justify the choice.

  2.  **Deconstruct Dennett's View:**
