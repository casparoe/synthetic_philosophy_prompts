answer: |-
  You have hit on a very sharp intuition that often gets glossed over in introductory surveys of compatibilism. Your suspicion is well-founded: **Dennett and Frankfurt are largely answering different questions, though they converge on the same goal (salvaging moral responsibility without libertarianism).**

  To understand why they feel like they are talking past each other, we have to look at the *level of analysis* each philosopher is operating on.

  ### 1. The Comparison: Competence vs. Authenticity

  **Dennett: The Evolutionary Pragmatist**
  Dennett's project (in *Elbow Room* and *Freedom Evolves*) is functional and externalist. He asks: *What capacities must an agent possess to be a viable participant in a social community?*
  *   **The Question:** What makes an agent a suitable target for praise, blame, and social coordination?
  *   **The Answer:** "Varieties of Free Will Worth Wanting." These are competences: self-control, the ability to represent the future, responsiveness to reasons, and "avoidability" (the practical ability to steer clear of bad outcomes).
  *   **The Vibe:** Free will is a power you *exercise*. It is about control over your environment and your future.

  **Frankfurt: The Structural Psychologist**
  Frankfurt's project (in "Freedom of the Will and the Concept of a Person") is structural and internalist. He asks: *What makes a desire truly belong to the agent?*
  *   **The Question:** When is an action authentically *mine*, such that I am its true source?
  *   **The Answer:** "Wholehearted Identification." Freedom is a hierarchy of desires. I am free when my first-order desire (to eat the cake) aligns with my second-order volition (to want to be the kind of person who eats the cake).
  *   **The Vibe:** Free will is a state you *inhabit*. It is about internal harmony and authenticity.

  ### 2. Are They Competing or Talking Past Each Other?

  They are **complementary but distinct layers.** They are talking past each other only if one claims to be the *exhaustive* account of free will.

  *   **You can have Dennett without Frankfurt:** Imagine a cool-headed, highly competent villain. She has excellent self-control, responds to reasons (prudence), and can revise long-term plans. She satisfies Dennett's criteria perfectly. But suppose she is alienated from her own desires (perhaps she wishes she were kind, but knowingly chooses evil). She lacks Frankfurtian wholeheartedness. Dennett says she is responsible (she has the competences); Frankfurt might say her will is not free (she is at war with herself).
  *   **You can have Frankfurt without Dennett:** Imagine a brainwashed cult member who has been manipulated to *wholeheartedly* identify with the cult's goals. There is no internal conflict; she wants to want what she does. She satisfies Frankfurt's criteria. But she lacks the competence to critically evaluate those desires or respond to outside reasons. Dennett would say she lacks free will (she is not responsive to the wider landscape of reasons); Frankfurt might say she acts freely (she is wholehearted).

  **The Verdict:** They are not rivals; they are addressing different necessary conditions for the full-blown concept of moral agency.
  *   **Dennett** addresses the **capacities** required for responsibility (the "hardware").
  *   **Frankfurt** addresses the **authority** required for responsibility (the "software ownership").

  However, if forced to characterize their divergence: Dennett is concerned with **Control**, while Frankfurt is concerned with **Sourcehood**.

  ### 3. Which is the Better Account of Why Ordinary People Care?

  If I have to pick one as the better account of why *ordinary people* care about free will, I pick **Dennett**.

  Here is the justification:

  **1. The Stakes of Ordinary Discourse are Pragmatic**
  When ordinary people worry about free will, they are rarely worrying about whether their second-order volitions align with their first-order desires. They are not lying awake at night worrying about "wholeheartedness."
  They are worrying about **control and consequences.**
  *   "If determinism is true, can I change my future?"
  *   "If I was abused as a child, can I be blamed for this crime?"
  *   "Do my choices actually matter?"

  Dennett's "competences" map directly onto these anxieties. He explains why we hold people responsible: because they have the *ability to do otherwise* in the only sense that matters practically (avoidability). When a layperson says, "He couldn't help it," they usually mean "He lacked the competence to control himself" (Dennett), not "He lacked identification with his desire" (Frankfurt).

  **2. Frankfurt is Counter-Intuitive to the Layperson**
  Frankfurt's famous cases (Frankfurt-style cases) are designed to show that Alternative Possibilities (PAP) are not necessary for responsibility. He argues you can be responsible even if you *couldn't have done otherwise*, provided you acted on your own desires.
  To the ordinary person, this is a hard sell. The intuitive core of "free will" for most people is the "could have done otherwise" intuition. Dennett respects this intuition by redefining "could have done otherwise" in a compatibilist way (you could have, if you had chosen to). Frankfurt essentially tells the ordinary person, "That intuition you have about alternative possibilities? It's irrelevant." Dennett tells them, "That intuition is important, here is how it works in a deterministic world."

  **3. Social Coordination vs. Inner Peace**
  The concept of free will in human society functions primarily as a tool for **social regulation**. We use it to decide who to punish, who to trust, and who to hire.
  *   Dennett's view explains the *social utility* of free will. We need to know if an agent is responsive to reasons so we know if threatening punishment or offering reward will work.
  *   Frankfurt's view explains the *phenomenology* of agency (what it feels like to be free), but it is less useful for the social practices that generate the free will debate in the first place (law, morality, interpersonal relationships).

  ### Conclusion

  You are right that they feel like answers to different questions.
  *   **Frankfurt** answers: "When is an action authentically mine?"
  *   **Dennett** answers: "When is an agent sufficiently in control to be held accountable?"

  While Frankfurt offers a profound insight into addiction, compulsion, and identity (areas where Dennett is weaker), **Dennett provides the better account of ordinary concern.** Most people care about free will because they care about **agency as a power to navigate the world**, not just as a state of internal psychological harmony. We want to know that we are captains of our ships (Dennett), not just that we love the direction the ship is steering (Frankfurt).

  Dennett captures the *stakes* of the debate; Frankfurt captures the *structure* of the agent. For the ordinary person, the stakes win.
