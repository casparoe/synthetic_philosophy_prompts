      *   *Consistency Check:* The key is distinguishing *epistemic rationality* (what is true) from *pragmatic rationality* (what to do). The prompt asks what rationality demands of Mara regarding *belief* AND *recommendation*.
      *   *Refinement on Q1/Q3:* If she discounts herself heavily due to sleep, does she have to adopt his view? Not necessarily. She just has to admit her uncertainty is higher. If the data is ambiguous enough that a rested engineer sees safety and a tired one sees danger, the data itself is likely inconclusive.
      *   *Refinement on Q2:* If she downgrades her own reliability (Q3), does Jonas's stubbornness (Q2) matter less? Yes. If she admits she might be the compromised one, his stubbornness is less a sign of *his* flaw and more a sign of *her* potential error. But she can't *know* she's the error source, only that the risk is higher.

