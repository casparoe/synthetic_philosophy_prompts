prompt: |-
  I have been reading Montaigne's essay "Of Cannibals" on my own, and a particular passage has come to dominate my thinking about cultural difference. Montaigne opens by discussing the Roman army seen through the eyes of King Pyrrhus, and he writes: "When King Pyrrhus invaded Italy, having viewed and considered the order of the army the Romans sent out to meet him; 'I know not,' said he, 'what kind of barbarians' (for so the Greeks called all other nations) 'these may be; but the disposition of this army that I see has nothing of barbarism in it.'" Montaigne then draws his lesson from this and kindred cases: "By which it appears how cautious men ought to be of taking things upon trust from vulgar opinion, and that we are to judge by the eye of reason, and not from common report." I have found myself increasingly persuaded by what I take to be the position behind this passage: that the word "barbarous" is usually no more than a label for whatever is foreign, and that the only defensible way to evaluate a practice is by its actual merits rather than by its distance from one's own customs.

  I would like to know what would count against this position. I am not looking for a survey of scholarship or a list of texts; I want a map of the position's exposure. Which observations, arguments, intuitions, or concrete cases would genuinely put pressure on the view that "barbarous" is just a name for the unfamiliar, and that we should judge by reason rather than by common report? I would like you to distinguish between defeaters that would be decisive and ones that would merely be awkward, and to say what a committed holder of the Montaigne-style view would themselves concede as counting against it rather than only what a critic would say. In particular, I would be interested to know whether the position, as I have stated it, has been qualified into unfalsifiability — and, if it has, whether that is a problem for a view of this kind. For my part, I would find it most persuasive if you could show a case where two practices genuinely differ and yet one is plainly better by standards that are not themselves merely another custom. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Montaigne's "Of Cannibals," specifically the idea that "barbarous" is merely a label for the foreign, and we should judge by reason, not custom/common report.
      *   **Task:** Map the position's exposure (what counts against it?). Distinguish between decisive defeaters and awkward tensions. Identify what a *committed holder* would concede vs. what a critic would say. Address the risk of unfalsifiability. Provide a concrete case where one practice is plainly better by non-customary standards.
      *   **Constraint:** Write in British English.
      *   **Tone:** Philosophical, analytical, nuanced, respectful of the user's engagement with the text.

  2.  **Deconstruct the Montaigne-style Position (MSP):**
      *   *Core Claim 1:* "Barbarism" is often just ethnocentrism (foreign = barbarous).
      *   *Core Claim 2:* Evaluation should be based on "reason" (actual merits), not "common report" (custom/tradition).
      *   *Implicit Assumption:* Reason is universal or accessible across cultures; customs are local and potentially misleading.

  3.  **Brainstorming Counter-Arguments/Pressures:**
      *   *The Definition of "Reason":* Is reason truly universal, or is it culturally situated? If "reason" is just Western rationality, MSP collapses into the very ethnocentrism it critiques.
      *   *The Function of "Barbarous":* Does the term do necessary work? (e.g., identifying genuine harm).
      *   *Moral Realism vs. Relativism:* If MSP leans too hard into "don't judge by custom," does it slide into relativism where *no* judgment is possible? Or does it claim a universal moral standard?
      *   *Epistemic Humility:* How do we know we are using "reason" and not just *our* custom disguised as reason?
      *   *Concrete Harms:* Genocide, slavery, torture. Are these "barbarous" regardless of custom? If so, "barbarous" isn't just "foreign."

  4.  **Categorising Defeaters (Decisive vs. Awkward):**
      *   *Decisive:* If "reason" is shown to be inextricably bound to culture, MSP loses its normative force. If there are objective moral truths that make certain practices *inherently* barbarous (not just foreign), the definition fails.
      *   *Awkward:* The difficulty of applying "reason" in practice without slipping into bias. The practical necessity of relying on "common report" for efficiency.

  5.  **Addressing Unfalsifiability:**
      *   If every judgment against a foreign practice is dismissed as "custom" and every defense is "reason," the view becomes a shield against criticism. This is a problem if it claims to be a tool for truth-seeking.

  6.  **Developing the Concrete Case:**
      *   Need a case where Practice A and Practice B differ, and A is better by standards *not* merely custom.
      *   *Idea:* Medical practice (germ theory vs. ritual cleansing).
      *   *Idea:* Slavery vs. Freedom.
      *   *Selection:* Medical/Scientific efficacy is often the strongest ground for "reason" over "custom." Treating infection with antibiotics vs. trepanation. It appeals to biological reality, not cultural preference.

  7.  **Drafting the Response (incorporating British English):**
      *   *Spelling/Grammar:* Organise, programme, centre, defence, practise (verb) vs practice (noun).
      *   *Structure:*
          1.  Introduction: Acknowledge the strength of the MSP.
          2.  The Problem of "Reason": Is it universal or disguised custom? (The Internal Threat).
          3.  The Reality of Harm: When "barbarous" denotes objective damage (The External Threat).
          4.  Unfalsifiability: The risk of the view becoming a dogma.
          5.  Concrete Case: Medical intervention.
          6.  Conclusion: Summary of the tension.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I distinguish what a *holder* would concede?
      *   *Correction:* A committed Montaignean *must* concede that if "reason" reveals objective harm, the label "barbarous" is valid. They cannot defend *everything* foreign. They must admit that their own culture might be the barbarous one.
      *   *Check:* Is the distinction between decisive and awkward clear?
      *   *Correction:* Make sure to label them explicitly.
      *   *Check:* British English.
      *   *Correction:* Ensure "s" instead of "z" in organise/recognise (mostly), "colour" not "color", "defence" not "defense".

  9.  **Final Polish:**
      *   Ensure the tone is not dismissive of Montaigne (who is profound) but rigorous about the philosophical implications.
      *   Focus on the epistemic status of "reason."

  **(Self-Correction Note on British English):** I need to be careful with "practice" vs "practise". Noun = practice, Verb = practise. Also, ensure "programme" if referring to a plan, though "program" is often accepted in computing. I will stick to standard Oxford spelling conventions.

  10. **Final Review against constraints:**
      *   British English? Yes.
