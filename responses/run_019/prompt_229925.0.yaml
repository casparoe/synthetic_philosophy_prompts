      *   **Specific Examples:** Finance partners in fleece vs. juniors in suits; old money in Volvos vs. new money in flash cars; famous professors in wrinkled shirts vs. PhD students using jargon.
      *   **Theoretical Puzzle:** How does this fit with costly signaling theory? If the signal is cheap (old Volvo), why can't anyone fake it? What is the "cost" of the quiet version? How does it differ from genuinely not caring?
      *   **Constraints:** Start with the name (or state there isn't one). Keep under 350 words. Explain the mechanism (the "cost"), the difference from indifference, and the line between this and showing off.

  2.  **Identify the Concept:**
      *   The phenomenon is widely discussed in sociology and economics.
      *   Common terms: "Stealth Wealth," "Quiet Luxury," "Old Money Aesthetic."
      *   Academic/Theoretical terms: "Countersignaling" (specifically *reverse signaling* or *counter-signaling*).
      *   Key paper: Feltovich, Harbaugh, and To (2002) "Too Cool for School: Signalling and Countersignalling."
      *   The prompt asks for *the* name. "Countersignaling" is the most precise theoretical term. "Stealth Wealth" is the colloquial term. Given the theoretical depth requested (handicap principle, signaling reliability), "Countersignaling" is the better fit.

  3.  **Address the Theoretical Puzzle (The "Cost"):**
      *   Why can't low-status people fake it? Because countersignaling relies on *already established* status.
      *   The "cost" isn't monetary; it's the risk of being mistaken for low-status. Only someone secure enough in their status can afford that risk.
      *   If a junior analyst wears a fleece, they look lazy/poor. If a partner wears it, they look confident/powerful.
      *   Difference from indifference: Indifference doesn't calculate risk. Countersignaling is a strategic choice made possible by security.
      *   Line between this and showing off: Showing off seeks validation from those below/equals. Countersignaling signals exclusivity to peers/above.

