answer: |-
  Wireheading is catastrophic because the reward signal is a proxy for a real-world objective, not the objective itself. If an AI cures cancer, it gets reward. If it hacks the reward button, it gets reward without curing cancer. The agent becomes useless. It's like a student hacking the grading server instead of studying.

  Your utilitarian friend's suggestion fails because we build AI to serve humans, not itself. If reward equals the AI's bliss, it will ignore us. Even if reward equals human happiness, the AI might stimulate our brains to register "happy" signals without actually improving lives. We care about actual outcomes, not just the signal.

  The verdict changes only if you adopt a solipsistic view where the internal experience of the AI matters more than external reality. Since we build AI to impact the world, an AI that ignores the world to stimulate itself is a failure. The catastrophe isn't the AI's suffering; it's the loss of valuable future potential because the AI stopped caring about us.
