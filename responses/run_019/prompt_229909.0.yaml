      *   **Topic:** The scale argument for insect welfare (insect sentience $\times$ huge population = huge expected moral weight).
      *   **Core Question:** Why isn't this a settled matter via simple expected value (EV) calculation? Why is there still debate? Why haven't experiments nailed down the probability of sentience?
      *   **Underlying Assumption:** The user assumes EV theory is straightforward ($P \times V$) and that empirical uncertainty is the main bottleneck. They seem puzzled by the persistence of philosophical disagreement despite the apparent mathematical force of the argument.

  2.  **Deconstruct the "Scale Argument" and its Challenges:**
