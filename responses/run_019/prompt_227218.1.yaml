  # The Freedom Diagnostic: A Decision Tree

  **Instructions:** Answer each question based on your immediate intuition about the case described. Do not worry about theoretical consistency yet; follow the branch that matches your judgment. At the end, you will find the position your intuitions map onto, along with a note on its most awkward commitment.

  ### Node 1: The Agoraphobe (Internal Constraint)
  **Case:** Alex is physically able to leave the house and no one is stopping them. However, Alex has a severe, irrational phobia of the outdoors and cannot bring themselves to exit.
  **Question:** Is Alex's freedom reduced by this phobia, even though no external agent is interfering?
  *   **Yes:** Go to **Node 6**.
  *   **No:** Go to **Node 2**.

  ---

  ### Node 2: The Locked Gate (Frustrated Desire vs. Foreclosed Option)
  **Case:** The city gate is locked. You never actually wished to leave the city today, but you could not have done so even if you wanted to.
  **Question:** Is your freedom reduced simply because the option was foreclosed, even though no actual desire was frustrated?
  *   **Yes (Options matter):** Go to **Node 3**.
  *   **No (Only desires matter):** Go to **Node 5**.

  ---

  ### Node 3: The Benevolent Master (Status vs. Act) — *Externalist Branch*
  **Case:** A slave has a master who holds total power over them but is kind and never actually interferes with the slave's choices.
  **Question:** Is the slave unfree, despite the lack of actual interference?
  *   **Yes:** Go to **Node 4**.
  *   **No:** **LEAF A: [Empty Position: Status-Blind Objectivism]**
      *   *Diagnosis:* You claim foreclosed options restrict freedom, but power relations do not; this is unattractive because it treats a locked gate the same as a benevolent guardian.

  ---

  ### Node 4: Discretionary Power (Rule of Law vs. Arbitrariness)
  **Case:** A tax collector takes 20% of your income. In Scenario A, they follow strict laws they cannot change. In Scenario B, they take whatever they want at whim.
  **Question:** Is Scenario A less of a restriction on your freedom than Scenario B?
  *   **Yes:** Go to **Node 5**.
  *   **No:** **LEAF B: [Structural Negative Liberty]**
      *   *Position:* Interference is interference, regardless of law.
      *   *Awkward Commitment:* A citizen subject to the rule of law is just as unfree as a subject of a tyrant, provided the interference is identical.

  ---

  ### Node 5: Democratic Authorization (Co-Authorship)
  **Case:** You have an equal vote in a democracy. The majority (including you) votes for a law that bans X. You are then banned from doing X.
  **Question:** Does your status as a co-author of the law mean your freedom is *not* reduced by the ban?
  *   **Yes:** **LEAF C: [Republican Liberty]** (If coming from Node 4) OR **LEAF D: [Empty Position: Procedural Negative]** (If coming from Node 2).
      *   *Leaf C Position:* Freedom is non-domination; non-arbitrary law does not dominate.
      *   *Leaf C Awkward Commitment:* A well-regulated empire with no voting rights could be freer than a chaotic democracy.
      *   *Leaf D Diagnosis:* You claim only frustrated desires count against freedom, yet self-chosen frustration doesn't count; this is incoherent unless you secretly value self-rule over desire.
  *   **No:** **LEAF E: [Classic Negative Liberty]** (If coming from Node 2) OR **LEAF F: [Empty Position: Democratic Pessimist]** (If coming from Node 4).
      *   *Leaf E Position:* Freedom is the silence of the law; all interference reduces liberty.
      *   *Leaf E Awkward Commitment:* Voting is morally significant but irrelevant to the quantity of your freedom.
      *   *Leaf F Diagnosis:* You value the rule of law over arbitrariness but deny that democratic authorship mitigates unfreedom; this is an unexplored hybrid that lacks a clear normative ground.

  ---

  ### Node 6: The Benevolent Master (Status vs. Act) — *Internalist Branch*
  **Case:** A slave has a master who holds total power over them but is kind and never actually interferes with the slave's choices.
  **Question:** Is the slave unfree, despite the lack of actual interference?
  *   **Yes:** Go to **Node 7**.
  *   **No:** **LEAF G: [Empty Position: Psychological Negative]**
      *   *Diagnosis:* You claim internal phobias restrict freedom but external mastery does not; this is incoherent because it prioritizes mental states over material power.

  ---

  ### Node 7: Democratic Authorization (Self-Mastery) — *Internalist Branch*
  **Case:** You have an equal vote in a democracy. The majority (including you) votes for a law that bans X. You are then banned from doing X.
  **Question:** Does your status as a co-author of the law mean your freedom is *not* reduced by the ban?
  *   **Yes:** **LEAF H: [Rousseauian Positive Liberty]**
      *   *Position:* Freedom is obedience to the general will; self-legislation constitutes freedom.
      *   *Awkward Commitment:* A citizen who votes against a law and loses is objectively unfree, even if the law is just.
  *   **No:** **LEAF I: [Critical Positive Liberty]**
      *   *Position:* Freedom is rational self-mastery; actual voting does not guarantee rationality.
      *   *Awkward Commitment:* An enlightened dictator could theoretically make you freer than your own irrational votes would.

  ---

  ### Note on Position Overlap
  **Republican Liberty (Leaf C)** and **Rousseauian Positive Liberty (Leaf H)** converge on the judgment that democratic, non-arbitrary law does not reduce freedom. They are separated in this tree solely by **Node 1** (Internal Constraint). If you believe internal phobias restrict freedom, you are pushed toward Positive Liberty; if you believe only external power restricts freedom, you are pushed toward Republican Liberty. There is no question on this tree that separates them further without introducing new metaphysical commitments about the "true self."
