  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Nuance on Reference Fixing:* Kripke *does* say reference can be fixed by description (Lecture II). So the textbook isn't 100% wrong there. However, Kripke insists this is not how names like "Aristotle" typically work (causal chain), and even when it does (like "Neptune"), the description doesn't travel to other worlds.
      *   *The Crucial Distinction:* The textbook says: "asking whether Aristotle could have been a farmer... is simply asking whether... the person who satisfies the associated description... is a farmer." This is the definition of *non-rigid* designation or descriptivism. If "Aristotle" means "the teacher of Alexander," then in a world where someone else teaches Alexander, *that* person is Aristotle. Kripke says: No. In that world, Aristotle (the man born in Stagira) exists but didn't teach Alexander.
