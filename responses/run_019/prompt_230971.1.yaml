  4.  **Evaluate and Rank (The "Defended Ordering"):**
      *   *Criterion 1: Upstreamness.* Which question, if answered, shifts the most weight?
      *   *Criterion 2: Feasibility.* Can a philosopher do this in 3 years without law/poli sci heavy lifting?
