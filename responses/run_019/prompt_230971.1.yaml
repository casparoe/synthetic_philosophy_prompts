      *   *Ordering:* 1 -> 2 -> 3.
      *   *Reasoning:* Scope is most upstream (if it doesn't apply to voters, the rest matters less for this specific argument). Accessibility is the mechanism (if broken, the system fails). Integrity is the cost (important, but secondary to validity).

  5.  **Drafting the Content - Section by Section:**

