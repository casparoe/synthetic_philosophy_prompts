prompt: |-
  You are a moral philosopher with research expertise in the ethics of blame -- particularly the recent literature on standing to blame, hypocrisy, complicity, and meddling -- seconded as a consultant to a professional body. Please think carefully and begin by brainstorming the distinctions from that literature that a usable procedure would need to preserve, before drafting anything.

  Here is the situation. I chair the conduct committee of a national professional association (roughly 4,000 licensed members). Any member may file a complaint against any other member for breaches of our code -- overbilling, misrepresenting qualifications, poaching clients through deception, and so on. Historically the committee has only ever assessed the accused's conduct. But in the past two years we have had complaints from members who were themselves guilty of the same practice and never made amends, complaints from participants in the very scheme being reported (usually after a falling-out among the participants), and complaints about matters in distant chapters that the complainant has no discernible connection to. Handling these has become ad hoc and politically fraught. The board wants a standing screen: a procedure our intake officer (not a philosopher, roughly one hour per complaint before it goes to a hearing panel) can apply to decide whether a complainant's own conduct or relation to the matter disqualifies them from bringing this complaint, before anyone touches the merits.

  Please write that procedure. Requirements:

  1. First, your brainstorm: the distinctions the screen must keep (e.g., forfeited standing versus standing never possessed; hypocrisy versus complicity versus mere third-party meddling; whether the fault must be unacknowledged and unremedied to undermine standing; whether lack of standing affects the truth of the complaint or only the propriety of this person pressing it) and which subtleties can be safely dropped for a non-specialist operator.
  2. The procedure itself: an ordered sequence of questions with what counts as a sufficient answer to each, explicit stopping rules where the screen returns "standing lacks" or "standing intact," and the points -- mark them clearly -- where judgment cannot be eliminated and the intake officer must escalate to a person rather than a rule.
  3. A rule for what the office does when standing lacks: can a true and serious complaint be blocked, and if so, what is done with the information?
  4. Three worked applications: (a) a member who reports a rival's inflated billing while having billed the same way for years, unrepented; (b) a member who took part in the complained-of bid-rigging and now reports the ringleader after being cut out; (c) a member who reports questionable conduct in a chapter three states away that does not affect their practice. Arrange it so that at least one worked case yields a conclusion the committee will find genuinely uncomfortable, and say why the procedure requires it anyway.
  5. A closing section on the procedure's known failure modes: the kinds of cases where it will misfire, and a note on how to defend its decisions to complainants who are told they lack standing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Moral Philosopher/Consultant specializing in ethics of blame (standing, hypocrisy, complicity, meddling).
      *   **Client:** National Professional Association (4,000 members).
      *   **Task:** Create a "standing screen" procedure for an intake officer (non-philosopher, 1 hour/complaint limit) to determine if a complainant has the standing to blame, *before* assessing the merits of the accusation.
      *   **Context:** Recent influx of problematic complaints (hypocrites, co-conspirators falling out, disconnected third parties).
      *   **Requirements:**
          1.  Brainstorm distinctions (what to keep vs. drop).
          2.  The Procedure (ordered questions, stopping rules, escalation points).
          3.  Disposition Rule (what happens when standing lacks).
          4.  Three Worked Applications (Hypocrite, Co-conspirator, Meddler; one must be uncomfortable).
          5.  Failure Modes & Defense (limitations and communication strategy).

  2.  **Brainstorming Distinctions (Philosophical Grounding):**
      *   *Core Concept:* Standing to blame is not about whether the act was wrong (truth conditions), but whether *this person* is entitled to demand accountability (authority conditions).
      *   *Hypocrisy:* The "tu quoque" fallacy vs. moral standing. Key distinction: Is the hypocrisy *relevant*? (Same norm violation). Is it *unacknowledged*? (If I admit my fault and try to fix it, do I retain standing? Literature suggests yes, or at least diminished loss of standing).
      *   *Complicity:* If the complainant participated in the wrong, they are implicated. Reporting to save oneself or due to a falling out looks like scapegoating. Key distinction: Level of involvement (active participant vs. passive beneficiary).
      *   *Meddling/Interference:* Third parties. Do they have a legitimate interest? Professional associations are self-regulating bodies, so *all* members usually have some interest, but "distant/no connection" weakens this. Key distinction: Professional harm vs. moralistic policing.
      *   *Forfeiture vs. Lack:* Did they never have standing (stranger), or did they lose it (hypocrite)? For the procedure, the outcome is the same (dismissal), but the reasoning matters for the "Disposition Rule."
      *   *Subtleties to Drop:* Deep metaphysical questions about moral authority, the difference between *personal* resentment vs. *moral* indignation (too abstract for intake), nuanced degrees of partial standing (binary decision needed for screening).
      *   *Subtleties to Keep:* The requirement of *unremedied* fault (if they fixed it, they might have standing), the *relevance* of the fault (must be the same norm), and the distinction between *blocking the complaint* vs. *ignoring the info*.

  3.  **Drafting the Procedure (Operationalizing Philosophy):**
      *   *Constraint:* 1 hour max. Needs to be a flowchart style.
      *   *Step 1: Relevance.* Is the complainant's alleged fault related to the complaint? (Filters out general character attacks).
      *   *Step 2: Complicity.* Did they participate in *this specific* incident? (Strongest bar).
      *   *Step 3: Hypocrisy.* Have they violated this norm recently without remediation? (The "clean hands" doctrine).
      *   *Step 4: Connection/Interest.* Do they have a professional stake? (Filters out meddlers).
      *   *Escalation Points:* Where does the intake officer say "I can't decide"? Needs to be when facts are disputed or moral nuance is high.
      *   *Stopping Rules:* Clear "No Standing" vs. "Proceed to Merits."

  4.  **Disposition Rule (The "What Now?" Question):**
      *   If standing lacks, the *complaint* is dismissed, but the *information* regarding the violation cannot be ignored if it's serious.
      *   *Solution:* Convert the complaint into a "Referral for Independent Inquiry." The Committee initiates its own investigation based on the info, decoupled from the compromised complainant. This preserves the integrity of the code without validating the hypocrite.

  5.  **Worked Applications:**
      *   *(a) The Hypocrite:* Rival billing inflation. Complainant does same, unrepented. *Result:* No Standing. (Standard hypocrisy case).
      *   *(b) The Co-conspirator:* Bid-rigging participant reports ringleader after falling out. *Result:* No Standing (Complicity). *Uncomfortable:* The ringleader might escape scrutiny *unless* the Disposition Rule kicks in. I need to make sure the uncomfortable conclusion is about the *complainant*, not necessarily letting the criminal go free. Actually, the prompt asks for a conclusion the *committee* will find uncomfortable. Usually, committees hate dismissing valid info. So, dismissing a true complaint about a serious violation because the messenger is dirty is uncomfortable.
      *   *(c) The Meddler:* Distant chapter, no connection. *Result:* No Standing (Lack of Interest).
      *   *Refinement on "Uncomfortable":* Case (b) is the best candidate. A co-conspirator snitching is often useful in law, but ethically in a professional body, it undermines the communal trust. However, if we block it, a bad actor stays. The *procedure* must block the *complaint*, but the *Disposition Rule* saves the investigation. The uncomfortable part is telling the co-conspirator "You can't file this," even if we investigate anyway. Or, perhaps, a case where the hypocrisy is minor but the violation is major. Let's stick to the prompt's suggestion: "at least one worked case yields a conclusion the committee will find genuinely uncomfortable." Let's make Case (a) uncomfortable: The hypocrite is reporting a *egregious* violation, but their own violation is *minor but identical*. Or Case (b) where the co-conspirator is the only witness. Let's go with (b) being the uncomfortable one because it looks like we are protecting the ringleader by silencing the snitch. I need to explain why the procedure requires it (to prevent weaponization of the code).

  6.  **Failure Modes & Defense:**
      *   *Failure Modes:* Truth vs. Standing confusion (people think dismissal = innocence), Strategic gaming (accusing the accuser), Hard cases of remediation (what counts as "making amends"?).
      *   *Defense:* Emphasize that standing is procedural, not exculpatory. Use the "Referral" mechanism to show we still care about the violation.

  7.  **Review and Refine:**
      *   *Tone:* Professional, philosophical but accessible, authoritative.
      *   *Check Constraints:* Did I include the brainstorm? Yes. The procedure? Yes. Disposition rule? Yes. 3 cases? Yes. Failure modes? Yes.
      *   *Philosophical Accuracy:* Ensure the distinction between *tu quoque* (logical fallacy) and *standing* (moral authority) is clear. Ensure the "remediation" aspect of hypocrisy is included (Macalester Bell, Todd, etc.). Ensure the "complicity" distinction is clear (Isaacs, etc.).

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the procedure, make sure the "Escalation" points are explicit. The intake officer isn't a judge.
      *   *Correction:* In the Disposition Rule, ensure it's clear that the *complaint* is closed, but the *matter* might open.
      *   *Correction:* In the "Uncomfortable" case, ensure the reasoning is robust. If a co-conspirator reports a ringleader, blocking *their* complaint is ethically sound to prevent vendettas, but the Board will fear losing evidence. I must emphasize the "Independent Inquiry" path as the safety valve.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ## Consultation Memorandum: Standing-to-Blame Screening Procedure

  **To:** The Board of Directors, National Professional Association
  **From:** Ethics Consultant (Specialist in Moral Responsibility & Blame)
  **Subject:** Proposed Intake Procedure for Complainant Standing

  ### 1. Brainstorm: Distinctions to Preserve vs. Subtleties to Drop

  To design a functional screen for a non-specialist intake officer, we must translate philosophical nuance into administrative heuristics. The goal is not to solve the metaphysics of blame, but to filter out complaints that undermine the legitimacy of the disciplinary process.

  **Distinctions the Screen Must Preserve:**
  *   **Relevance of Fault (Hypocrisy):** A complainant's past bad conduct only undermines standing if it violates the *same norm* they are accusing the respondent of violating. General bad character is irrelevant.
  *   **Remediation Status:** Hypocrisy undermines standing primarily when the fault is *unacknowledged and unremedied*. If a complainant admits their past overbilling and repaid clients, they regain standing to report overbilling. This distinguishes the "hypocrite" from the "reformed offender."
  *   **Complicity vs. Knowledge:** There is a moral difference between witnessing a wrong and participating in it. A witness has standing; a participant (accomplice) generally lacks standing to blame their co-conspirators, as doing so attempts to offload shared guilt.
  *   **Professional Interest vs. Meddling:** In a voluntary association, standing is derived from membership. However, membership alone is insufficient if there is no *professional stake*. We must distinguish between a member protecting the profession's integrity (valid) and a member policing moral preferences unrelated to practice (invalid).
  *   **Standing vs. Merits:** The screen must never assess whether the accused *did* the wrong. It assesses only whether the accuser is the right person to say it. A lack of standing does not imply the accused is innocent.

  **Subtleties Safe to Drop (for the Intake Officer):**
  *   **Degrees of Standing:** We cannot operate on "partial standing." The decision must be binary: Proceed to Hearing or Dismiss for Standing. Nuance is handled later by the Hearing Panel if the case proceeds.
  *   **Private Resentment vs. Moral Indignation:** We do not need to probe the complainant's emotional state. We look at objective conduct.
  *   **The "Tu Quoque" Fallacy:** We do not need to teach logic. We simply enforce the rule: "If you are doing X, you cannot formally charge another with X."
  *   **Metaphysical Authority:** We do not need to justify *why* hypocrisy negates standing (e.g., commitment conditions vs. equality conditions). We only need to apply the rule that it does.

  ---

  ### 2. The Procedure: Standing Screen v1.0

  **Operator:** Intake Officer
  **Time Limit:** 60 Minutes
  **Goal:** Determine if the complaint moves to the Hearing Panel or is dismissed for Lack of Standing.

  **Instructions:** Proceed through questions sequentially. If a "Stopping Rule" is triggered, halt and apply the disposition. If an "Escalation Point" is reached, forward to the Committee Chair for a ruling.

  **Q1: Norm Relevance (The Hypocrisy Check)**
  *   *Question:* Does the complainant admit to, or is there evidence in the file of, the complainant violating the *specific* Code provision cited in this complaint within the last 3 years?
  *   *Sufficient Answer:* Yes/No based on initial documentation.
  *   *If NO:* Proceed to Q2.
  *   *If YES:* Proceed to Q1b.
      *   **Q1b: Remediation:** Has the complainant formally acknowledged this violation and made restitution (e.g., repaid fees, corrected records) to the satisfaction of the Association?
      *   *If YES (Remediated):* Standing Intact. Proceed to Q2.
      *   *If NO (Unremedied):* **STOPPING RULE: LACK OF STANDING.** (Reason: Unclean Hands/Hypocrisy).

  **Q2: Complicity (The Participation Check)**
  *   *Question:* Is the complainant named in the complaint, or does the evidence suggest the complainant was an active participant/beneficiary in the specific scheme or incident being reported?
  *   *Sufficient Answer:* Yes/No based on the complaint narrative.
  *   *If NO:* Proceed to Q3.
      *   **ESCALATION POINT 1:** If the complainant admits participation but claims they were coerced or minor, do not decide. Escalate to Chair.
  *   *If YES:* **STOPPING RULE: LACK OF STANDING.** (Reason: Complicity/In Pari Delicto).

  **Q3: Professional Nexus (The Meddling Check)**
  *   *Question:* Does the complainant demonstrate a direct professional interest in the matter (e.g., lost client, market distortion, reputational harm to the local chapter) OR is the violation of such gravity that it threatens public safety/association integrity generally?
  *   *Sufficient Answer:* Yes/No.
  *   *If YES:* **STOPPING RULE: STANDING INTACT.** (Proceed to Merits Review).
  *   *If NO:* Proceed to Q3b.
      *   **Q3b: Geographic/Practice Distance:** Is the matter entirely outside the complainant's region and area of practice with no plausible overlap?
      *   *If YES:* **STOPPING RULE: LACK OF STANDING.** (Reason: No Legitimate Interest/Meddling).
      *   *If NO:* **ESCALATION POINT 2:** If the connection is tenuous but not impossible (e.g., national reputation harm), Escalate to Chair.

  **Summary of Outcomes:**
  *   **Standing Intact:** Forward to Hearing Panel for Merits Assessment.
  *   **Lack of Standing:** Close Complaint File. Trigger Disposition Rule (see Section 3).
  *   **Escalation:** Forward to Committee Chair. (Time limit pauses; Chair has 48 hours to rule).

  ---

  ### 3. Disposition Rule: Handling Information When Standing Lacks

  **The Problem:** A complaint may be factually true and serious (e.g., dangerous malpractice) even if the complainant lacks standing (e.g., they are a hypocrite or co-conspirator). Dismissing the complaint cannot mean ignoring the violation.

  **The Rule:**
  When a complaint is dismissed for **Lack of Standing**, the Intake Officer must immediately generate a **Confidential Referral Memo**.
  1.  **Decoupling:** The Referral Memo strips all identifying information about the *complainant* from the allegations.
  2.  **Initiation:** This Memo is sent directly to the Committee Chair, not the Hearing Panel.
  3.  **Action:** The Committee Chair reviews the Referral to determine if the Association should launch an **Independent Inquiry** (sua sponte).
  4.  **Notification:** The complainant is notified only that "The complaint has been administratively closed due to procedural eligibility standards." They are *not* told an Independent Inquiry may be opening, to prevent them from claiming credit or interfering.

  **Rationale:** This preserves the moral principle that one cannot weaponize the code while ensuring the Code itself is still enforced against serious violators.

  ---

  ### 4. Worked Applications

  **Case A: The Unrepentant Rival (Hypocrisy)**
  *   **Facts:** Dr. X files against Dr. Y for "systematic overbilling." Dr. X's own billing records (submitted inadvertently with the file) show identical overbilling patterns over the same period. Dr. X has never been sanctioned for this and offers no admission of fault.
  *   **Application:**
      *   Q1: Yes, evidence of same norm violation.
      *   Q1b: No remediation.
      *   **Result:** **LACK OF STANDING.**
  *   **Outcome:** Complaint dismissed. Referral Memo generated regarding Dr. Y's billing (and potentially Dr. X's, if the evidence is clear).
  *   **Note:** This is the standard use case. It prevents the code from becoming a tool for turf wars between equally unethical actors.

  **Case B: The Fallen Co-Conspirator (Complicity)**
  *   **Facts:** Dr. A and Dr. B rigged bids on a government contract for two years. They had a falling out. Dr. A files a complaint detailing the bid-rigging, implicating Dr. B as the ringleader. Dr. A admits in the narrative: "We agreed to the scheme, but Dr. B forced the terms."
  *   **Application:**
      *   Q1: Norm relevance is high.
      *   Q2: Yes, complainant admits participation ("We agreed").
      *   **Result:** **LACK OF STANDING.**
  *   **Why This Is Uncomfortable:** The Committee will fear that dismissing Dr. A's complaint allows Dr. B (the ringleader) to escape scrutiny, as Dr. A holds the evidence. It feels like protecting a criminal by silencing a snitch.
  *   **Why The Procedure Requires It:** Allowing co-conspirators to file complaints weaponizes the disciplinary process. It encourages members to enter unethical schemes with a "poison pill" to destroy their partners later. It turns the Association into a court of criminal law rather than a professional body.
  *   **Safety Valve:** The Disposition Rule is critical here. The Intake Officer sends a Referral Memo. The Committee launches an Independent Inquiry based on the *evidence provided*, not the *complaint*. Dr. B is investigated, but Dr. A does not get to act as the moral arbiter.

  **Case C: The Distant Meddler (No Nexus)**
  *   **Facts:** Dr. C (Florida, pediatric focus) files against Dr. D (Washington, geriatric focus) for "unprofessional communication" in a local chapter newsletter in Washington. Dr. C admits they have no clients in Washington and never interacted with Dr. D.
  *   **Application:**
      *   Q1 & Q2: No hypocrisy or complicity.
      *   Q3: No professional interest (no market overlap, no local reputation harm).
      *   Q3b: Yes, entirely distant.
      *   **Result:** **LACK OF STANDING.**
  *   **Outcome:** Complaint dismissed. No Referral Memo (unless the communication was criminal).
  *   **Note:** This preserves the Association's resources for actual professional harms and prevents moral policing across chapters.

  ---

  ### 5. Known Failure Modes & Defense Strategy

  **Failure Mode 1: The "Truth vs. Standing" Confusion**
  *   *Risk:* Complainants (and the public) will interpret "Lack of Standing" as "The Accused Is Innocent."
  *   *Mitigation:* All dismissal letters must include the standard phrase: *"This determination addresses only the eligibility of the complainant to file. It is not a finding on the truth of the allegations or the conduct of the respondent."*

  **Failure Mode 2: Strategic Counter-Accusations**
  *   *Risk:* Respondents will try to trigger Q1 by digging up dirt on the complainant to get the case dismissed.
  *   *Mitigation:* The screen relies on *admitted* conduct or *file evidence*. The Intake Officer is not authorized to launch investigations into the complainant during the screen. If the Respondent wants to allege hypocrisy, they must provide documentary proof with their initial response.

  **Failure Mode 3: The "Minor Hypocrite / Major Violation" Problem**
  *   *Risk:* A complainant who overbilled by $50 (unremedied) reports a respondent for sexual harassment. Strict application of Q1 might block this if "Professional Misconduct" is too broadly categorized.
  *   *Mitigation:* The Intake Officer must interpret Q1 ("Specific Code Provision") narrowly. Overbilling is not the same norm as harassment. However, if the norms are identical (e.g., minor overbilling vs. major overbilling), the screen *must* block it. This is the hardest pill to swallow.
  *   *Defense:* We defend this by appealing to the **Integrity of the Process**. If we allow unremediated violators to police others, the Association admits that the Code is optional for those who enforce it. The Disposition Rule ensures the major violation is still investigated independently.

  **Defense to Complainants:**
  When informing a member they lack standing, use the **Stewardship Frame**:
  > "Our Code of Conduct is a shared commitment. To maintain its authority, those who call for its enforcement must demonstrate they uphold its specific standards themselves. This is not a judgment on the respondent, but a requirement of the office you are asking the Association to exercise. We will, however, review the information provided to determine if an independent review is warranted."

  This frames the dismissal not as a rejection of their information, but as a protection of the Association's moral authority.
