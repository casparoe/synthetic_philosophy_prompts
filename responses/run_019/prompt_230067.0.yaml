  I'm working on a paper about Plato's Laws and I keep tripping over this one summary in a scholarly-looking book. It says Plato's discussion of drunkenness basically amounts to this: wine acts as a truth serum, because intoxication strips away shame and reveals a person's real character, which is why Plato recommends that the city organize regular drinking banquets where elders observe the young and sort out who is naturally virtuous. The book also says Plato treats wine as a harmless way to simulate the loss of inhibitions that soldiers need to overcome fear, so he suggests old men should drink freely as a form of courage training. My rough sense is that the passage in Book 1 says something more cautious about wine being a kind of test or gymnasium for the soul, and that the point is to train moderation through exposure, not just observe people. But I dont trust my own reading. Can you go through the summary and separate what's accurate, what's slightly distorted, and what a proper reading of the Athenian Stranger's argument would say about the courage part? I don't need citations, just the conceptual clarification.
