prompt: |-
  I curate a permanent exhibition at a regional museum covering the destruction of an indigenous community in the 1890s: a massacre of several hundred people, followed by the seizure of their land, the removal of their children to distant boarding schools where their language was forbidden, and the burning of their religious objects. A descendants' association has petitioned us to change the exhibit's main label from "massacre and dispossession" to "genocide", and our board is split. The dispute keeps circling back to a passage in Chapter IX of Raphael Lemkin's Axis Rule in Occupied Europe (1944), which one trustee has paraphrased to the rest of us: Lemkin there describes genocide as unfolding in two phases, the first being the destruction of the national pattern of the oppressed group, and the second the imposition of the oppressor's own pattern, whether on the surviving population or on the emptied territory itself. His opponents on the board reply that whatever Lemkin originally meant, the word as now used in law and journalism is tied to the physical extermination of a group, and that a museum has no business stretching it further.

  I am not asking you to adjudicate the history. What I want to understand is what each side of our dispute is quietly committed to. Does the trustees' caution presuppose that "genocide" is a natural kind whose members can be discovered by checking features against a definition, while the petitioners treat it instead as a moral verdict or a legal conclusion? Does Lemkin's two-phase description, as paraphrased above, actually settle anything about our label, or does it merely push the argument back one step, onto what counts as the destruction of a "pattern"? And what view of what words do — in particular of whether naming an atrocity performs some further act of recognition or obligation beyond describing it — would make sense of the fact that everyone at the table, on both sides, behaves as though a great deal hangs on one word? Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A regional museum curator is facing a dispute over an exhibition label regarding the destruction of an indigenous community in the 1890s.
      *   **The Conflict:** Descendants want the label changed from "massacre and dispossession" to "genocide." The board is split.
      *   **The Crux:** A specific interpretation of Raphael Lemkin's *Axis Rule in Occupied Europe* (1944) is central. One trustee cites Lemkin's "two phases" (destruction of national pattern + imposition of oppressor's pattern). Opponents argue "genocide" is now legally/journalistically tied to physical extermination.
      *   **The Task:** Do *not* adjudicate the history. Instead, analyze the underlying philosophical and linguistic commitments of each side.
      *   **Specific Questions to Address:**
          1.  Does the trustees' caution presuppose "genocide" as a natural kind vs. petitioners treating it as a moral verdict/legal conclusion?
          2.  Does Lemkin's two-phase description settle the label, or push the argument back to defining "pattern"?
          3.  What view of what words *do* (speech act theory/recognition/obligation) explains why everyone behaves as though so much hangs on one word?
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Sides:**

      *   **The Trustees (Opponents of "Genocide"):**
          *   *Argument:* "Genocide" = physical extermination (current legal/journalistic usage). Lemkin's original intent is secondary to current usage. Museums shouldn't "stretch" definitions.
          *   *Underlying Commitment:* They seem to view language as descriptive and fixed. They worry about precision and potential backlash/loss of credibility if the term is misapplied according to *current* standards (e.g., UN Convention 1948). They might fear the political weight of the term.
          *   *Philosophical Stance:* Essentialism/Natural Kind (maybe), but more likely Conventionalism (meaning is determined by current usage). They prioritize stability and consensus in terminology.

      *   **The Petitioners (Descendants/Pro-"Genocide"):**
          *   *Argument:* The events fit Lemkin's broader conception (cultural destruction + physical destruction). "Massacre and dispossession" is insufficient.
          *   *Underlying Commitment:* They view the term as carrying moral weight and historical truth that "massacre" misses. They appeal to the *origin* (Lemkin) to correct the *current narrowing* of the term.
          *   *Philosophical Stance:* Moral Realism or Performative. The word is a verdict that demands recognition of the specific nature of the harm (cultural erasure).

      *   **The Lemkin Quote:**
          *   *Content:* Two phases: 1. Destruction of national pattern of oppressed. 2. Imposition of national pattern of oppressor.
          *   *Function:* It broadens the scope beyond just killing.
          *   *Problem:* It requires defining "national pattern." Is language/religion part of that pattern? If so, the petitioners win on Lemkin's terms. But the trustees argue Lemkin isn't the law anymore.

  3.  **Address the Specific Questions:**

      *   *Q1: Natural Kind vs. Moral Verdict?*
          *   Trustees: They act as if "genocide" has a fixed essence (physical killing) that must be matched. This looks like a "natural kind" approach, but it's more accurately "legal positivism" or "lexical conventionalism." They fear category error.
          *   Petitioners: They treat it as a moral verdict. It's about *justice* and *accuracy of experience*, not just ticking boxes of body counts.
          *   *Nuance:* It's not a clean split. Both care about truth. But trustees prioritize *categorial stability*, petitioners prioritize *moral adequacy*.

      *   *Q2: Does Lemkin settle it?*
          *   No. It shifts the debate. If Lemkin is the authority, the debate becomes: "What constitutes a 'national pattern'?" and "Does boarding school/burning objects count as destroying that pattern?"
          *   Also, there's the hermeneutic question: Does the 1944 definition override the 1948 UN Convention definition in a public museum context? Lemkin pushes the argument back to the interpretation of "pattern" and the authority of the definition itself.

      *   *Q3: What do words do? (Speech Act Theory)*
          *   Why does the word matter so much?
          *   *Constative vs. Performative:* "Massacre" describes an event. "Genocide" *accuses*, *condemns*, and *obligates*.
          *   *Illocutionary Force:* Using "genocide" performs an act of recognition. It places the museum on the side of the victims against the perpetrators (even if historical). It invokes international law and moral outrage.
          *   *Uptake:* The trustees fear the *uptake* (public controversy, legal challenges). The petitioners desire the *uptake* (acknowledgement of ongoing trauma).
          *   *Austin/Searle:* The word isn't just a label; it's a tool that changes the social reality surrounding the exhibit.

  4.  **Drafting the Response (incorporating British English):**

      *   *Tone:* Academic, empathetic, analytical, neutral (not adjudicating history).
      *   *Vocabulary:* "Programme," "centre," "analyse," "colour," "defence," etc. (Ensure standard British spelling).
      *   *Structure:*
          1.  Introduction: Acknowledge the gravity of the situation.
          2.  The Nature of the Category (Natural Kind vs. Moral Verdict).
          3.  The Role of Lemkin (Settling vs. Displacing).
          4.  The Function of Language (Speech Acts/Obligation).
          5.  Conclusion: Summarise the impasse.

      *   *Refining the "Natural Kind" point:* Be careful. The trustees aren't necessarily saying genocide is a biological natural kind. They are saying it is a *legal* category with fixed criteria. The petitioners see it as a *sociological* or *moral* reality.
      *   *Refining the Lemkin point:* Emphasise that Lemkin's definition is broader than the UN Convention. The dispute is about *which* definition governs the museum's discourse.
      *   *Refining the Speech Act point:* Use J.L. Austin's concepts (illocutionary force). The word "genocide" *does* something. It creates a duty to remember differently.

  5.  **Self-Correction/Review during drafting:**
