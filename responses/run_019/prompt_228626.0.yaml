      *   *Check:* Did I avoid adjudicating the history? Yes, focus on the philosophy of language and classification.

  6.  **Final Polish:** Ensure the tone is respectful of the museum's dilemma. The stakes are high (reputation vs. justice). The analysis should reflect that tension. (Make sure to explicitly mention the UN Convention 1948 as the counterpoint to Lemkin 1944, as that's the legal reality the trustees are worried about).

      *(Self-Correction on "Natural Kind"):* A natural kind implies mind-independent existence (like gold or water). "Genocide" is a human construct. So, the trustees are treating it *as if* it were a natural kind (essentialist), or more accurately, as a rigid designator in a legal framework. I should clarify this distinction. The petitioners treat it as a "thick ethical concept" (Bernard Williams) – descriptive and evaluative simultaneously.

      *(Refining the Speech Act):* The word "genocide" carries an *illocutionary force* of condemnation and a *perlocutionary effect* of demanding reparation or specific remembrance. "Massacre" is a subset; "Genocide" implies intent to destroy the group *as such*.

