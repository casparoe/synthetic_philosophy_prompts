answer: |-
  You are navigating a dispute that is not merely historical but profoundly philosophical. It concerns the metaphysics of social categories, the authority of definitions, and the performative power of language. To understand what each side is quietly committed to, we must look past the historical facts of the 1890s and examine the assumptions they hold about how words map onto the world, and what work those words are expected to do.

  **The Ontology of the Category: Natural Kind or Moral Verdict?**

  You ask whether the trustees' caution presupposes that 'genocide' is a natural kind, while the petitioners treat it as a moral verdict. This is a perceptive distinction, though it requires some nuance.

  The trustees who resist the label appear to operate under a form of **lexical conventionalism** or **legal positivism**. They are not necessarily claiming that 'genocide' is a natural kind in the scientific sense (like 'gold' or 'water', existing independently of human classification). Rather, they treat it as a **technical term** with fixed necessary and sufficient conditions, codified by current usage and international law (specifically the 1948 UN Convention, which emphasises physical destruction). For them, the word functions like a diagnostic label in medicine; if the symptoms (body counts, explicit intent to exterminate) do not match the criteria, applying the diagnosis is malpractice. Their commitment is to **categorial stability**. They fear that stretching the term dilutes its utility and exposes the museum to charges of imprecision or political agitation. They view the word as a container that must not be overfilled.

  The petitioners, conversely, treat 'genocide' as what philosophers call a **thick ethical concept**. It is both descriptive and evaluative. For them, the word is not merely a box to tick based on body counts, but a **moral verdict** on the structural intent of the colonisers. By appealing to Lemkin's original 1944 conception, they are arguing that the *essence* of the crime is the destruction of the group's viability, not merely the killing of its members. Their commitment is to **moral adequacy**. They believe that 'massacre and dispossession' is descriptively accurate but morally insufficient; it fragments a unified policy of erasure into separate events. For them, 'genocide' is the only term capacious enough to hold the truth of the experience. They are not stretching a definition; they are attempting to restore a meaning they believe was narrowed for political convenience after Lemkin.

  **The Function of the Lemkin Passage: Settlement or Displacement?**

  Does the passage from *Axis Rule* settle the matter? It does not. It merely **displaces the argument** from the level of events to the level of interpretation.

  If the board accepts Lemkin's two-phase description as the governing authority, the dispute does not end; it shifts to the definition of a "national pattern." The trustees would then be compelled to argue that the "national pattern" of this indigenous community was not destroyed, or that the boarding schools and burning of religious objects did not constitute an imposition of the oppressor's pattern. This is a sociological and anthropological debate, not a lexical one.

  However, the trustees' resistance suggests they do not accept Lemkin as the final authority. They are implicitly privileging the **1948 UN Convention** over Lemkin's 1944 text. In their view, the legal codification supersedes the conceptual origin. Therefore, Lemkin's passage does not settle the label; it highlights a rift between the **conceptual history** of the word (what Lemkin meant) and its **institutional life** (how courts and journalists use it today). The board is effectively asking: *Is the museum a guardian of historical concepts or a follower of current legal consensus?* Lemkin's text forces them to choose which timeline governs their language.

  **The Performative Power of the Word**

  Finally, you ask what view of language explains why so much hangs on one word. If words were merely descriptive labels, the difference between 'massacre' and 'genocide' would be a minor taxonomic adjustment. The intensity of the dispute suggests that everyone at the table understands language as **performative**.

  Drawing on the speech act theory of J.L. Austin, we can see that the label is not just a constative statement (describing what happened); it is an **illocutionary act** (doing something in the saying).
  *   To label the event 'massacre' is to record a tragedy.
  *   To label it 'genocide' is to **accuse**, to **condemn**, and to **recognise** a specific type of victimhood.

  When the petitioners demand the word 'genocide', they are seeking a form of **uptake**. They want the museum to perform an act of recognition that validates their ongoing trauma and links the historical event to a framework of international human rights. The word carries an obligation; it implies that the destruction was not an accident of war but a systematic policy, which in turn may imply a continuing duty of restitution or specific forms of remembrance.

  The trustees' caution reveals a fear of the **perlocutionary effects** (the consequences of the speech act). They worry that using the word will generate political controversy, legal challenges, or accusations of bias. They treat the word as a volatile agent that, once released into the exhibition, will act upon the audience and the institution in ways they cannot control.

  **Conclusion**

  In summary, the dispute is not truly about the 1890s. It is about the authority of the museum to define reality.
  *   The **trustees** are committed to a view of language as **regulated and stable**, where words derive their meaning from current institutional consensus. They fear the instability of moral language.
  *   The **petitioners** are committed to a view of language as **restorative and moral**, where words derive their meaning from the lived experience of the oppressed and the original intent of the concept's creator. They seek the stability of truth.
  *   **Lemkin's text** serves as a pivot point, but it does not resolve the tension between historical concept and current law.
  *   The **weight of the word** exists because naming an atrocity is not a passive act of description. It is an active conferral of status. To call it 'genocide' is to change the relationship between the museum, the descendants, and the state.

  The board is split because they are disagreeing on what a museum label *is*. Is it a caption for the past, or a judgment for the present? Until that question is addressed, the debate over Lemkin will remain a proxy for a deeper conflict over the museum's moral voice.
