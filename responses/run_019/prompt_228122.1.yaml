  ### 2. Repaired Principles

  To accommodate your verdicts, specifically the tension between Case 3 (anti-evasion) and Case 4 (informal waiver), we must distinguish between *constituted* agents (who follow rules) and *constituent* sovereigns (who make rules).

  **Recommended Principle: The Hierarchy of Authority Principle**
  > "Legal change is valid if and only if:
  > 1.  **Competence:** The agent effecting the change possesses the requisite authority (sovereign or delegated) at the *initiation* of the transaction;
  > 2.  **Continuity:** The change does not permanently extinguish the system's capacity for future revision (preserving the 'voice' of the sovereign); and
  > 3.  **Anti-Evasion:** A delegated agent may not segment a single substantive intent into sequential procedural steps to bypass a specific threshold designed to protect that substantive outcome."

  *   **Clause 1 (Competence)** is motivated by **Case 4** and **Case 5**. It explains why parties can waive formalities orally (they are sovereign over the contract) and why the People can replace a constitution (they are the constituent power), while a City Council cannot.
  *   **Clause 2 (Continuity)** is motivated by **Case 2**. It prevents the system from silencing its own ability to speak (self-entrenchment of the amendment clause).
  *   **Clause 3 (Anti-Evasion)** is motivated by **Case 3**. It prevents delegated agents from using a temporary procedural window to bypass a substantive shield (the unanimity requirement for library access).

  **Competing Candidate: The Procedural Integrity Principle**
