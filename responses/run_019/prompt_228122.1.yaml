  *   *Critique:* This saves Case 3 but risks invalidating Case 1 (if the intent to raise thresholds is seen as a single transaction) and creates rigidity incompatible with Case 4's contract law realities. The Hierarchy principle is superior because it accounts for *who* is changing the rules.

