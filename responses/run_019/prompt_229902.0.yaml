answer: |-
  **MEMORANDUM**

  **TO:** Student Success Analytics Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Fairness Criteria for Early-Warning System Deployment

  **Executive Summary and Recommendation**

  After reviewing the pilot findings and consulting current literature on the mathematics and ethics of algorithmic fairness, I recommend that the committee **adopt the model with the single calibrated threshold.**

  This recommendation prioritizes the interpretability of risk scores and ensures that the higher-need population (first-generation students) is not artificially restricted from receiving support to satisfy statistical parity metrics. While this approach accepts unequal error rates, those disparities reflect genuine differences in underlying risk rather than bias in the model. In a support-oriented context where offering help is a benefit rather than a harm, equalizing error rates would inadvertently reduce access for the students most likely to need intervention.

  **The Mathematical Constraint**

  To make an informed decision, the committee must understand a settled mathematical result regarding predictive modeling. When a model is used to predict an outcome (like student retention) across two groups with different underlying base rates (29% non-return for first-generation vs. 17% for continuing-generation), three desirable properties cannot all be satisfied simultaneously if the model is imperfect:

  1.  **Calibration:** A risk score of $X$ implies the same probability of non-return for students in both groups.
  2.  **Equal False Positive Rates:** Among students who *do* return, the share flagged as at-risk is equal across groups.
  3.  **Equal False Negative Rates:** Among students who *do not* return, the share missed by the system is equal across groups.

  The pilot model satisfies Calibration. Because the base rates differ, it is mathematically impossible for it to also satisfy both Equal False Positive and Equal False Negative rates using a single threshold. To achieve equal error rates (Camp 2), we would have to abandon Calibration and apply different thresholds to each group. To maintain Calibration (Camp 1), we must accept unequal error rates. The mathematics dictates that a trade-off is unavoidable; it does not, however, dictate which trade-off is morally preferable. That is a policy decision.

  **Analysis of Alternatives**

  **Camp 1: Single Calibrated Threshold (Recommended)**
  This approach maintains that a risk score should mean the same thing for every student. If a student has a 70% risk score, they have a 70% chance of not returning, regardless of group identity.
  *   **Benefit:** It preserves individual fairness and transparency. It also naturally directs more resources to the higher-risk group (first-generation students) because more of them will cross the risk threshold.
  *   **Cost:** It results in a higher False Positive rate for first-generation students (more students flagged who would have stayed) and a higher False Negative rate for continuing-generation students (more students missed who would have left).

  **Camp 2: Equalized Error Rates**
  This approach requires group-specific thresholds to ensure the system makes mistakes at the same rate for everyone.
  *   **Benefit:** It ensures that the probability of being missed if at-risk is identical across groups.
  *   **Cost:** To lower the False Positive rate for first-generation students to match continuing-generation students, the system would have to raise the threshold for first-generation students. This means a first-generation student would need a *higher* risk score than a continuing-generation student to receive the same support. In a support context, this effectively penalizes the vulnerable group by restricting their access to aid.

  **Camp 3: Equal Selection Rates**
  This approach flags the same percentage of each group (e.g., top 20% of first-gen and top 20% of continuing-gen).
  *   **Benefit:** Simplifies budgeting and ensures proportional resource allocation.
  *   **Cost:** It ignores actual need. Since first-generation students have a higher base rate of risk, capping their selection rate denies support to high-risk students in that group to meet a quota. This is ill-suited for a mission focused on student success.

  **Addressing the Strongest Counter-Argument**

  Proponents of Camp 2 (Equalized Error Rates) argue that disparate error rates perpetuate stigma and inequality. They contend that flagging a larger share of first-generation students who would have succeeded (Higher False Positive Rate) subjects them to unnecessary surveillance and implies a deficit in their group. There is moral weight to this concern; being incorrectly identified as "at-risk" can feel paternalistic or discouraging.

  However, this argument rests on the assumption that a False Positive is a significant harm comparable to a False Negative. In punitive contexts (such as lending or policing), a False Positive is a severe harm (denied loan, unjust detention). In our context, a False Positive is an offer of tutoring and advising. While stigma is a genuine risk, the harm of dropping out (False Negative) is objectively more severe than the inconvenience of unneeded advising. By prioritizing Equal Error Rates, we would be treating the "harm" of offering help as equivalent to the "harm" of withholding it. To protect first-generation students from the stigma of over-flagging, we should invest in how we communicate the intervention (e.g., making it universal or opt-in) rather than restricting their access to it via algorithmic thresholds.

  **Conclusion and Crux**

  The decision before the committee does not turn on the mathematics, which only confirms that trade-offs are inevitable. The decision turns on the **cost function**: specifically, whether the university treats a False Positive (offering unneeded support) as a harm to be minimized or a benefit to be maximized.

  Because our goal is retention and student success, we should treat support as a benefit. Therefore, we should not constrain the system to equalize False Positive rates if doing so denies help to higher-need students. I recommend we adopt the single calibrated threshold but implement a safeguard: launch a parallel qualitative pilot to survey flagged students about their experience of the advising offer. If the data shows that "unnecessary" flagging causes measurable psychological harm or stigma for first-generation students, we should revisit the threshold policy. Until then, we should prioritize capturing at-risk students over balancing error statistics.
