answer: |-
  The established term for this pattern is **net-widening**.

  In criminology and socio-legal studies, **net-widening** specifically describes the phenomenon where alternatives to traditional punishment (like diversion programs, electronic monitoring, or community service) are applied to individuals who would otherwise have received no intervention at all (e.g., case dismissal, release on recognizance). The result is that the "net" of state control captures a larger population, even if the "mesh" of the net is softer (less punitive per person).

  Here is how the term is defined and bounded against your specific questions:

  **Definition and Edges**
  Coined prominently by Barry Krisberg and James Austin in the early 1980s, net-widening is defined by the *expansion of social control*, not necessarily the severity of that control.
  *   **Vs. Mission Creep:** Mission creep implies the *goals* of the system changed (e.g., schools becoming security hubs). Net-widening occurs even when the stated goal (reduce jail) remains constant; the system simply finds new people to apply the "solution" to.
  *   **Vs. Displacement:** Displacement (or net-thinning) is when enforcement moves from one group to another without changing the total size. Net-widening requires the *total* number of people under supervision to increase.
  *   **Vs. Function Creep:** Your third example (body cameras) is often technically called **function creep** (technology used for a purpose other than originally intended). However, in the context of justice reform, it is frequently analyzed as a form of net-widening because it increases the *surveillance capacity* over the population, leading to more prosecutions that wouldn't have occurred otherwise.

  **Harm and Intent**
  *   **Harm Reduction:** Yes, it still counts as net-widening even if harm per person is reduced. If 100 people were in jail (high harm) and now 200 people are on ankle monitors (lower harm), the system has widened. Critics argue this normalizes surveillance for populations that previously had none, potentially creating new pathways to incarceration (e.g., violating monitor rules).
  *   **Intent:** It counts regardless of intent. Net-widening can be an accidental byproduct (prosecutors using new tools because they exist) or a strategic one (agencies expanding budgets by serving more clients). The term describes the *outcome*, not the motivation.

  **Scope**
  While the term originated in criminal justice, the logic applies broadly to any welfare or regulatory system where "gentler" interventions are introduced (e.g., mandatory counseling in schools catching students who previously would have received a warning). However, **net-widening** is most strongly associated with penal policy. A broader theoretical framework that encompasses this pattern is **The Iron Law of Corrections** (Todd Clear, 1994), which posits that efforts to control crime invariably lead to an increase in the overall amount of control exerted by the system.

  **Implications for Reform vs. Abolish**
  The existence of net-widening does not settle the debate, but it sharpens the criteria for success.
  *   **For Reformers:** It implies that policy design requires strict "gatekeeping" mechanisms (e.g., legislation that explicitly forbids using diversion for cases that would have been dismissed) to prevent expansion. It argues for better implementation, not necessarily the end of reform.
  *   **For Abolitionists:** It is cited as evidence that the system is inherently expansionist. They argue that any reform that leaves the state's power to punish intact will eventually be used to widen control. This distinction drives the push for **"non-reformist reforms"** (changes that reduce the system's power and resources) versus **"reformist reforms"** (changes that make the system more efficient or palatable, risking net-widening).

  \answer{Net-widening}
