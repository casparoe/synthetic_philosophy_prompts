answer: |-
  This is a fantastic question that cuts to the heart of how historians and classicists define their discipline. You have read Thucydides very closely, and your intuition about him treating Homer as a source (albeit a biased one) is correct. However, your lecturer is pushing back against a common misconception: the idea that "History" and "Myth" are simply opposite ends of a slider bar where "More Evidence = More History."

  Here is the breakdown of why your lecturer says these aren't points on a single spectrum, and what distinction they are actually making.

  ### 1. Thucydides is actually proving your lecturer's point
  You noted that Thucydides treats Homer as evidence but corrects the fleet size. Look closer at *why* he does that.

  Thucydides is often called the first "scientific" historian precisely because he is trying to **separate** the historical kernel from the poetic shell. When he says Homer was "like to set it forth to the utmost," he is categorizing the *Iliad* as poetry, not history. He is arguing that to get to the *history*, you have to strip away the *myth*.

  Thucydides isn't saying, "Homer is a historian who got the numbers wrong." He is saying, "Homer is a poet who exaggerated; I am a historian who will calculate the logistics."

  By making that distinction, Thucydides is drawing a line between **Event** (an expedition happened) and **Narrative** (the story Homer tells). Your lecturer is arguing that finding a destruction layer at Troy confirms the *Event*, but it does not turn the *Narrative* into History.

  ### 2. The "Kernel of Truth" Fallacy
  Your argument relies on the idea that if we find evidence of *a* war, the *Trojan War* becomes history. Historians distinguish between:
  *   **The Historical Conflict:** A series of Bronze Age skirmishes over trade rights in the Dardanelles (supported by Hittite texts and archaeology).
  *   **The Trojan War:** The specific 10-year siege caused by the abduction of Helen, involving demi-gods, specific duels, and divine intervention (the story of the *Iliad*).

  Archaeology confirms the first. It does not confirm the second.

  If we treat this as a spectrum, we imply that if we found a sword with "Achilles" written on it, the *Iliad* would suddenly become a history textbook. But it wouldn't. The *Iliad* is a theological and cultural document about honor, fate, and the human condition. Its "truth" is not dependent on whether Achilles existed.

  **The Lecturer's Distinction:** The distinction isn't about *truth*; it's about **function**.
  *   **History** functions to explain causality through evidence and critical analysis.
  *   **Myth/Legend** functions to explain identity, values, and origins through narrative and memory.

  The Trojan War remains a "legend" in the academic sense because its primary transmission and cultural weight come from the mythic narrative, not the historical record, regardless of whether a war occurred.

  ### 3. Why it's not a Spectrum (Troy vs. Arthur vs. Exodus)
  If it were a spectrum based on evidence, it would look like this:
  *   **Exodus:** (Low Evidence) <--- **Arthur:** (Medium Evidence) <--- **Troy:** (High Evidence)

  But your lecturer is saying these are **different categories of memory**.

  *   **The Exodus:** This is a **foundation myth**. Its lack of archaeological support (no evidence of 2 million people wandering Sinai) doesn't diminish its historical *impact*. The fact that Israelites *believed* it happened shaped the ancient world more than if it had actually happened exactly as written. Treating it as "history waiting to be proven" misses its point as a theological and national identity statement.
  *   **King Arthur:** This is likely a **composite figure**. He may represent a type of Romano-British warlord rather than a specific individual. The "evidence" here isn't just missing; the nature of the sources (written centuries later) makes the *kind* of history we can write fundamentally different from Thucydides.
  *   **Troy:** This is **amplified memory**. We have contemporary texts (Hittite) and contemporary destruction layers. But the story we tell (Homer) is separated from those events by 400 years of oral tradition.

  The lecturer is arguing that you cannot compare them quantitatively. You are comparing a theological origin story (Exodus), a nationalistic romance (Arthur), and an epic poem based on amplified memory (Troy). Piling up more pottery shards at Hisarlik doesn't move the *Exodus* closer to "history," nor does it turn the *Iliad* into a military dispatch.

  ### 4. What is the distinction actually *doing*?
  If we stop treating this as a spectrum of "True vs. False," what do we gain?

  1.  **It protects the value of Myth:** If myth is just "bad history," then Homer is just a liar who got the fleet size wrong. If myth is a *category of memory*, then Homer is a genius who preserved the cultural values of the Bronze Age, regardless of the fleet size.
  2.  **It clarifies Historical Method:** History requires contemporary evidence and source criticism. Thucydides had no contemporary evidence for Troy; he had logic and poetry. Moderns have archaeology. But "History" as a discipline requires a chain of evidence that these legends simply do not possess, even if the core event was real.
  3.  **It explains why the stories survive:** The Trojan War story survived not because it was accurate, but because it was *meaningful*. King Arthur survives not because he was real, but because he serves a political purpose. If we treat them as "history in progress," we ignore why humans actually tell these stories.

  ### Summary
  Your lecturer is telling you that **Historicity** (did it happen?) and **Historical Discipline** (can we study it as history?) are different things.

  *   **Thucydides** knew this: He accepted the expedition happened but refused to treat Homer as a historical authority.
  *   **Archaeology** confirms a conflict at Troy, but not the *War* of the *Iliad*.
  *   **The Spectrum Model** fails because it assumes the goal of these stories was to record facts. Their goal was to create meaning.

  The Trojan War hasn't "crossed over" into history. Rather, we have found historical evidence that *inspired* the legend. The legend itself remains a mythic construct, distinct from the historical record, just as Thucydides suspected.
