      *   *Comparison:* Different kind of claim (miraculous, demographic scale) vs. Trojan War (military conflict).

  6.  **Address the "Spectrum" vs. "Distinction" Argument:**
      *   *The User's View:* Legend <---(evidence)---> History.
      *   *The Lecturer's View:* These are different *genres* of memory with different *purposes*.
      *   *Key Concept:* **Historicity vs. Historical Truth.** Just because an event happened doesn't make the *story* history in the disciplinary sense.
      *   *Key Concept:* **Function.** Myths explain *why* things are the way they are (identity, religion). History explains *how* things happened (causality, evidence).
      *   *Key Concept:* **The Nature of the Evidence.** Thucydides uses Homer critically. Moderns use archaeology. But the *Iliad* is not a chronicle. It's epic poetry. Confirming a war happened doesn't turn the *Iliad* into a history book.

