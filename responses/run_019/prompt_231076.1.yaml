  3.  **Evaluate the Trojan War Case:**
      *   *Thucydides:* He is an early critical historian. He accepts the core event but critiques the source (Homer) for poetic inflation. This shows early historical methodology.
      *   *Archaeology:* Hisarlik (Troy) shows destruction layers. Hittite texts mention Wilusa and Ahhiyawa (likely Troy and Achaeans).
      *   *Consensus:* There was likely conflict in the Late Bronze Age around Troy.
      *   *BUT:* Does this confirm the *Iliad*? No. It confirms a war, not Achilles, Hector, the gods, the specific cause (Helen), or the 10-year duration. The *narrative* remains mythic even if the *kernel* is historical.

