answer: |-
  **Project Title:** The Measurement Audit of Distributive Currencies
  **Applicant:** [Name]
  **Department:** Philosophy / Political Theory

  **Research Question**
  Do the measurement-theoretic commitments of the leading distributive currencies (welfare, resources, capabilities) differ sufficiently to constrain normative choice? Specifically, does a rigorous "measurement audit" reveal that certain currencies demand informational inputs that are theoretically incoherent or empirically impossible to obtain, thereby ruling them out as practical guides for justice?

  **Background and Problem**
  The "equality of what?" debate is currently stalled on intuitive grounds. Competing currencies are judged by how well they match considered judgments about responsibility, choice, and circumstance [High Confidence]. While feasibility is occasionally discussed, it is treated as a secondary implementation constraint rather than a constitutive conceptual limit [Medium Confidence]. Consequently, the debate proceeds as if the choice of currency is free from measurement-theoretic consequences. However, welfare comparisons typically require cardinal, interpersonally comparable utility data [High Confidence], while resource-based approaches attempt to rely on objective market proxies but struggle with indexing diverse needs [Medium-High Confidence]. Capability approaches often present as ordinal but require weighting schemes to aggregate distinct functionings, reintroducing cardinal demands [High Confidence]. The existing literature leaves open whether these differences are merely technical hurdles or fundamental boundary conditions that should dictate the choice of currency.

  **Methodology**
  I will apply a "measurement audit" derived from experimental design and kinetics to these philosophical constructs. The project treats each currency as a measurement instrument and asks what signal it requires to function.
  1.  **Taxonomy of Demands:** Formalize the informational requirements for each currency (e.g., ordinal vs. cardinal, intra- vs. interpersonal).
  2.  **Stress Testing:** Analyze whether the required data can exist without violating the internal logic of the theory (e.g., can "responsibility" be measured without destroying the "choice" it is meant to protect?).
  3.  **Comparative Audit:** Rank currencies by the severity of their measurement assumptions.

  **Timeline (One Semester)**
  *   **Month 1:** Literature mapping. Isolate the precise measurement assumptions implicit in the leading variants of welfarism, resourcism, and capabilitarianism.
  *   **Month 2:** Stress testing. Apply measurement-theoretic constraints to the mapped assumptions. Identify points where the theory requires impossible data.
  *   **Month 3:** Synthesis. Determine if the audit eliminates any currencies or merely shifts the burden of proof to different unjustified assumptions.
  *   **Month 4:** Drafting the final paper and presenting findings to the department.

  **Scope and Risks**
  I am a scientist, not a trained philosopher. I will not attempt to solve the "indexing problem" or propose a new weighting system. The scope is limited to exposing the cost of existing solutions. I will cut any deep dive into specific sub-debates (e.g., specific theories of well-being) that do not bear directly on measurability.
  **Failure Conditions:** The project fails if (1) the audit shows all currencies collapse into identical measurement demands, rendering the distinction moot, or (2) the measurement demands are shown to be irrelevant to the normative force of the theories, meaning the audit changes nothing about how one should choose between them [Medium Confidence].

  ***

  **Author's Note on Confidence**

  **Least Sure Claim:**
  *Claim:* "An honest 'measurement audit' of the leading candidates might rule some out."
  *Reasoning:* I am least confident in this claim because philosophical theories are highly adaptive. Proponents of a given currency may argue that their theory is regulative rather than operational, or that measurement impossibility does not negate normative truth. While I am confident I can expose the measurement costs, I am unsure if those costs will be accepted by the field as disqualifying conditions rather than just unfortunate trade-offs. My scientific training suggests impossible measurements invalidate a model; philosophical training may treat them as idealizations.
