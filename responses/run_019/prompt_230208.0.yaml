answer: |-
  # The Spec: Desiderata for a Theory of Mental Causation

  You are correct that the literature often feels like a series of ships passing in the night. Davidson is solving a problem about the *logic of explanation*, Kim is solving a problem about *ontological grounding*, and the proportionality theorists are solving a problem about *explanatory granularity*. To compare them, you need a unified job description.

  Below is the full specification. It is divided into **Performance Cases** (what the theory must explain), **Structural Distinctions** (what the theory must differentiate), and **Metaphysical Constraints** (what the theory must not violate). Each item is marked as **Non-Negotiable** (a datum any serious theory must accommodate) or **Camp Preference** (a metaphysical commitment that defines specific schools of thought).

  ### I. Performance Cases
  *The theory must provide a causal model that renders these scenarios intelligible.*

  1.  **Volitional Action:** A conscious decision (e.g., to raise a hand) brings about a corresponding bodily movement.
      *   *Motivation:* The datum of agency. If the theory cannot account for this, it contradicts the fundamental experience of being an agent.
      *   *Status:* **Non-Negotiable.**
  2.  **Rational Transition:** One belief (e.g., "It is raining") causes another belief (e.g., "I should take an umbrella") in virtue of its content.
      *   *Motivation:* The datum of rationality. Causation must track rational relations, not just physical adjacency.
      *   *Status:* **Non-Negotiable.**
  3.  **Dispositional Explanation:** A standing character trait or psychological disposition explains a *pattern* of actions over time, not just a single event.
      *   *Motivation:* The datum of personality. Causation isn't just event-event; it involves stable properties sustaining counterfactuals across time.
      *   *Status:* **Non-Negotiable.**

  ### II. Structural Distinctions
  *The theory must have the conceptual resources to draw these lines without collapsing them.*

  4.  **Production vs. Counterfactual Dependence:** The theory must distinguish between a state *producing* an effect (generative mechanism) and a state merely being *relevant* to an effect (counterfactual dependence).
      *   *Motivation:* Preemption cases. If a backup cause would have produced the effect had the first failed, the first cause is still the producer, even if the effect counterfactually depends on the backup. Collapsing this distinction makes causation too easy to secure.
      *   *Status:* **Camp Preference.** (Humeans/Davidsonians often collapse these; Realists/Kim insist on production.)
  5.  **Token vs. Type Causation:** The theory must distinguish between a particular instance of a state causing an effect (token) and a general kind of state causing a kind of effect (type).
      *   *Motivation:* Anomalous Monism relies on this. It saves efficacy at the token level while denying law-like connections at the type level.
      *   *Status:* **Camp Preference.** (Some property-causation views reject token-causation as fundamental.)
  6.  **Relata Identity:** The theory must specify whether the relata of causation are Events, Properties, Facts, or States of Affairs.
      *   *Motivation:* Metaphysical coherence. If mental states are properties but causes must be events, a category error looms.
      *   *Status:* **Camp Preference.** (Rarely defended explicitly, often assumed.)

  ### III. Metaphysical Constraints
  *The theory must not contradict these principles.*

  7.  **Mental Efficacy:** Mental properties/states must be causally efficacious, not merely inert byproducts.
      *   *Motivation:* Anti-epiphenomenalism. If mental states do nothing, psychology is not a science, and evolution cannot select for consciousness.
      *   *Status:* **Non-Negotiable.**
  8.  **Physical Causal Closure:** Every physical event that has a cause has a sufficient physical cause.
      *   *Motivation:* The success of physics. Conservation laws and the explanatory completeness of neurophysiology suggest no "gaps" for mental forces to push through.
      *   *Status:* **Non-Negotiable** (for Physicalists).
  9.  **The Exclusion Principle (No Systematic Overdetermination):** A single effect does not have two *sufficient* and *distinct* causes occurring at the same time (unless it is a genuine case of overdetermination like a firing squad).
      *   *Motivation:* Parsimony and coincidence. It is implausible that every voluntary action is causally overdetermined by both a mental and a physical cause independently.
      *   *Status:* **Non-Negotiable** (for most, but the primary target of proportionality theorists).
  10. **Mental/Physical Distinctness:** Mental properties are not identical to physical properties (often grounded in Multiple Realizability).
      *   *Motivation:* Multiple Realizability. Pain can be realized in silicon, flesh, or alien biology; therefore, pain cannot be identical to C-fiber firing specifically.
      *   *Status:* **Camp Preference.** (Reductive Physicalists deny this; Non-Reductive Physicalists insist on it.)

  ---

  ### The Inconsistency: The Exclusion Trilemma

  There is a subset of requirements that is **jointly unsatisfiable**. This is the engine of Kim's Causal Exclusion Argument. You cannot hold all four of the following simultaneously:

  1.  **Mental Efficacy** (The mental causes the physical).
  2.  **Physical Causal Closure** (The physical has a sufficient physical cause).
  3.  **Mental/Physical Distinctness** (The mental cause is not the physical cause).
  4.  **The Exclusion Principle** (No systematic overdetermination).

  **The Logic:** If the physical effect has a sufficient physical cause (Closure), and the mental cause is distinct from it (Distinctness), then the effect has two sufficient causes. If we ban systematic overdetermination (Exclusion), the mental cause is excluded. Therefore, the mental is inefficacious (denying Efficacy).

  **Who Gives Up What?**
  *   **Epiphenomenalism:** Gives up **Mental Efficacy**. (Keeps Closure, Distinctness, Exclusion).
  *   **Type Identity Theory:** Gives up **Mental/Physical Distinctness**. (Keeps Efficacy, Closure, Exclusion).
  *   **Substance Dualism:** Gives up **Physical Causal Closure**. (Keeps Efficacy, Distinctness, Exclusion).
  *   **Non-Reductive Physicalism (Davidson/Kim):** Tries to keep all four, but Kim argues this is impossible. Davidson keeps Efficacy, Closure, and Distinctness by weakening the **Exclusion Principle** (via Anomalous Monism/token identity), but Kim argues this collapses into Epiphenomenalism regarding *properties*.
  *   **Proportionality Theorists (Yablo, List & Menzies):** Attempt to save Non-Reductive Physicalism by refining **The Exclusion Principle**. They argue that if the mental is proportional to the effect, the physical (being too specific) is *not* a competing cause, thus avoiding overdetermination.

  ---

  ### Scorecard

  | Theory | Efficacy | Closure | Distinctness | No Overdet. | Result |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **Epiphenomenalism** | ❌ | ✅ | ✅ | ✅ | Saves physics, kills agency. |
  | **Type Identity** | ✅ | ✅ | ❌ | ✅ | Saves causation, kills MR. |
  | **Non-Reductive Physicalism** | ✅ | ✅ | ✅ | ❌* | *Kim says it fails here; Proportionality says it passes.* |
  | **Substance Dualism** | ✅ | ❌ | ✅ | ✅ | Saves mind, kills physics. |

  ---

  ### Camp Preferences vs. Non-Negotiables

  The reason you feel theories have different job descriptions is that they treat the **Camp Preferences** as **Non-Negotiables**.

  *   **Davidson** treats *Token Identity* as non-negotiable to save Efficacy, accepting that *Type Distinctness* means there are no psychophysical laws.
  *   **Kim** treats *Property Causation* and *Exclusion* as non-negotiable, which forces him to reject Non-Reductive Physicalism.
  *   **Proportionality Theorists** treat *Difference-Making* (over Production) as non-negotiable, which allows them to bypass Kim's Exclusion argument.

  If you treat **Production** as non-negotiable, Difference-Making theories fail. If you treat **Multiple Realizability** (Distinctness) as non-negotiable, Identity Theory fails. The debate is largely about which "Camp Preference" gets promoted to a hard constraint.

  Verdict: The Ban on Systematic Overdetermination.
