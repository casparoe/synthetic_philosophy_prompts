      *   **Goal:** Help explain why this passage matters for contemporary debates on civil disobedience and political obligation.

  2.  **Deconstruct the Hume Passage:**
      *   *Context:* "Of Civil Liberty" (often titled "Of the Liberty of the Press" or part of the broader political essays). Hume is generally skeptical of social contract theory and abstract rationalism in politics. He favors empiricism, custom, and utility.
      *   *Key Phrase:* "the world is still too young."
