answer: |-
  To the Grants Committee, regarding the proposed evaluation framework based on Imre Lakatos, I have drafted the following procedure to operationalize the trustee's suggestion while ensuring our decisions remain defensible to applicants and the board. The goal here is not to become philosophers of science but to use Lakatos's methodology of scientific research programmes as a structured heuristic for reviewing multi-year renewals. We must begin by defining what counts as a programme in our context, since Lakatos wrote about historical shifts over decades rather than three-year grant cycles. For our purposes, a programme is not simply the lab itself or the broad field of study, but the specific theoretical framework and methodological approach articulated in the original funding proposal. This includes the central hypothesis that defines the hard core, which is the set of assumptions the researchers treat as irrefutable within the scope of the project, and the protective belt, which consists of the auxiliary assumptions, experimental conditions, and specific models that can be adjusted to accommodate anomalies. If a grant report does not clearly distinguish between what the team is willing to abandon and what they consider foundational, the procedure cannot start, and the report should be returned for clarification before evaluation.

  The decision procedure begins with identifying the anomalies recorded in the progress report. You must list every instance where the data failed to match the initial prediction. For each anomaly, ask whether the researchers adjusted the protective belt or the hard core. A legitimate adjustment modifies the auxiliary assumptions, such as recalibrating an instrument or refining a boundary condition, without altering the fundamental theory. If the report shows the hard core itself was modified to fit the data, this is a stop condition and recommends non-renewal, as this indicates the programme is dissolving rather than progressing. Once legitimate belt adjustments are confirmed, you must assess the heuristic power of those adjustments. This is the critical step where we distinguish progressive from degenerating problem shifts. A progressive shift occurs when the adjustment leads to a novel prediction that was not part of the original design and is subsequently confirmed by evidence. A degenerating shift occurs when the adjustment is made solely to explain the past failure without generating new, testable implications. To pass this step, the report must demonstrate at least one novel prediction arising from a belt adjustment that has been empirically verified or is currently under rigorous test. If the adjustments only explain past data without pointing to new phenomena, the programme is degenerating.

  You must be vigilant against gaming, particularly regarding the claim of novel predictions. A smart applicant may attempt to reframe a failed prediction as a successful retrodiction by claiming the new result was implied by the theory all along. To counter this, require dated pre-analysis plans or lab notebook entries that predate the anomalous result. If the claim of novelty arises only in the final report, it counts as ad hoc and should be weighted against the programme. Similarly, watch for the defensive shielding of the core. Applicants may dump every failure into the protective belt by adding increasingly complex auxiliary assumptions that make the theory unfalsifiable. If the protective belt becomes so complex that it outweighs the explanatory power of the core, or if the adjustments are not independent of the specific anomaly they fix, this is a sign of degeneration. However, there is a judgment hand-off point here. Determining whether an adjustment is independently testable or merely a patch requires scientific expertise. If the programme officer cannot determine independence based on the report and external reviews, the file must be flagged for external peer review specifically tasked with assessing the theoretical cost of the adjustment.

  To illustrate how this works in practice, consider three invented files. The first is a high-energy physics project searching for a specific supersymmetric particle. Over three years, they have found nothing. They have adjusted the protective belt by proposing the particle exists at higher energy levels than initially thought. This looks like a degenerating shift because the adjustment only explains the null result without predicting a new phenomenon accessible within the next grant period. Under this procedure, you would recommend cutting funding, even though the field is exciting and the team is prestigious. This will be unpopular, but the Lakatosian lens dictates that constantly moving the goalpost without new empirical content is degenerative. The second file is a neuroscience programme studying a specific memory mechanism. They failed to replicate their initial finding, but in doing so, they discovered a previously unknown inhibitory pathway that explains the failure. They adjusted the belt to include this pathway and predicted that blocking it would restore the memory effect, which they then demonstrated. This is a progressive shift. Even though the original hypothesis was falsified, the programme generated new knowledge and predictions. You should renew this, even though it looks like a failure on the surface. The third file is a computational biology project that has produced many models fitting existing data but has not yet made a prediction that was tested experimentally. Here the procedure stops and hands the decision back to human judgment. Lakatos requires empirical content, but in silico work may be in a preparatory phase. This is where your discretion applies, weighing the potential for future progress against the cost of continued support.

  There are significant limitations to this procedure that you must acknowledge in your written decisions. Lakatos's framework is a rational reconstruction of history, not a real-time decision tool, and applying it to short grant cycles is an extension of his theory that is contested among philosophers. It is settled that programmes have cores and belts, and that ad hoc adjustments are methodologically suspect. However, it is genuinely contested whether progressivity can be judged in real-time or only retrospectively. A programme may look degenerating just before a breakthrough, and cutting it could stifle innovation. Therefore, this procedure cannot be used for high-risk high-reward grants where the goal is explicitly to explore unknown territory without a defined hard core. It also fails for interdisciplinary work where multiple hard cores interact, as the framework assumes a single unified theoretical structure. In these cases, relying on Lakatos is the wrong tool, and you should revert to standard peer review criteria. Furthermore, my addition to the theory here is the requirement for dated pre-analysis plans to verify novelty. Lakatos did not specify administrative mechanisms for verifying claims of novelty, and this is a practical necessity for our context rather than a philosophical derivation.

  When writing the decision letters, you must separate the procedural findings from the final judgment. State clearly where the programme sits on the progressive-degenerating spectrum based on the evidence of novel predictions versus ad hoc adjustments. If you are renewing a degenerating programme, justify it as a strategic risk rather than a scientific success. If you are cutting a progressive one, ensure it is because the cost of the protective belt has become too high relative to the foundation's mission, not because the science is bad. This transparency protects us from accusations of arbitrariness. Finally, remind the board that this procedure is a aid to judgment, not a replacement for it. It structures our thinking about theoretical resilience and empirical growth, but it cannot account for the human element of scientific creativity or the serendipity that often drives discovery. Use it to sharpen your questions, not to automate your conclusions, and ensure that every decision rests on a defensible interpretation of the evidence provided in the reports rather than an abstract philosophical commitment.
