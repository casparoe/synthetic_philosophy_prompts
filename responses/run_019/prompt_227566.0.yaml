              2.  **Hybrid View: Person-Affecting Constraint + Impersonal Good.** (Maximize good *unless* it harms existing). This fits perfectly.
              3.  **Critical-Level Person-Affecting View.**

      *   *Refining the Theories for the User:*
          1.  **Person-Affecting Restriction + Total Good:** We maximize total welfare, *but* it is impermissible to make existing people worse off to create new people. (Fits all 4).
          2.  **Critical-Level Utilitarianism (with high critical level):** Lives only count if above a high threshold. (Fits Repugnant rejection & Mere Addition). *Caveat:* Needs to explain Case 3. Maybe the cost to existing people outweighs the value of the new life above the critical level.
