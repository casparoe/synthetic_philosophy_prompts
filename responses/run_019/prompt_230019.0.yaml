  **The practice**

  In criminal law, a defendant cannot evade liability by arguing the victim committed similar wrongs; the victim's morality is irrelevant to the defendant's guilt. The State prosecutes public wrongs, rendering the complainant's virtue incidental. Conversely, equity operates the 'clean hands' doctrine, denying relief to claimants whose own conduct regarding the subject matter is unconscionable. Here, hypocrisy matters significantly. A claimant seeking an injunction against a nuisance may be barred if they created similar nuisances. Thus, the legal system appears contradictory: hypocrisy destroys standing in equity but is beside the point in criminal liability. This puzzle invites scrutiny of what grants an agent the authority to complain. Is standing rooted in personal moral purity, or is it a functional role independent of the complainer's virtue? The law's divergent responses suggest competing underlying theories of blame and entitlement regarding who may rightfully call out wrongdoing.

  **The implicit theory of each half**

  The criminal law's refusal of *tu quoque* presupposes that standing to blame belongs primarily to the polity, not the individual victim. The theory here is objective: a wrong violates a public norm, and the State's standing derives from its custodial role over those norms, not personal moral status. The defendant is answerable to the law, not the victim's character. Consequently, the victim's hypocrisy does not negate the public wrong committed.

  Conversely, the clean hands doctrine rests on a relational theory of standing. Equity acts *in personam*, targeting conscience rather than enforcing strict rights. The implicit theory is that one cannot appeal to conscience while flouting it oneself. Here, standing is normative and personal; it requires moral symmetry between the claimant's conduct and their claim. The claimant must be 'clean' to invoke the court's extraordinary discretionary power. This suggests that equitable standing is forfeited by hypocrisy because the remedy is grounded in mutual good faith. This relational view posits that equity is not merely about correcting wrongs, but about maintaining ethical standards within the litigation process itself. The court refuses to be an instrument of injustice, even if the defendant is also unjust.

  Thus, criminal law treats standing as institutional and objective, whilst equity treats it as personal and conditional upon the claimant's own adherence to the norms they invoke. One views blame as a public mechanism of accountability; the other as a private equitable balance requiring moral consistency. The former isolates the act from the agent's history; the latter intertwines them. This divergence implies two distinct models: one where wrongs exist independently of the accuser, and another where the right to complain is contingent on the accuser's moral integrity within that specific relationship. The criminal model prioritises the rule of law; the equitable model prioritises the purity of the judicial conscience. In short, the criminal law separates the wrong from the wronged, while equity binds them together. Philosophically, the criminal side aligns with objectivism about wrongs, whereas equity aligns with a virtue-conditional account of standing.

  **Strictly presupposed vs merely fits**

  Are these theories strictly presupposed, or do they merely fit the practice? One might argue the criminal law does not presuppose the victim's irrelevance, but rather the State's exclusive standing. The victim is merely a witness; thus, their hypocrisy is procedurally inadmissible, not philosophically irrelevant. Similarly, clean hands might not presuppose that hypocrisy destroys moral standing, but rather that equitable remedies are discretionary gifts, not rights. The court refuses aid not because the claimant lacks standing to blame, but because they lack entitlement to *relief*.

  Therefore, the practices might not reflect deep theories of blame at all, but procedural distinctions between public prosecution and private discretion. The inconsistency may be jurisdictional rather than philosophical. However, if we treat the law as expressing normative truths, the distinction suggests a deeper split: that standing is context-dependent. It is not that the theories are false, but that they are localized to specific legal domains rather than universal principles of moral complaint. If the law is merely pragmatic, the theories only 'fit' retrospectively. The tension arises only if we demand the law embody a unified moral philosophy rather than distinct functional tools for different social problems.

  **Where the practice is underdetermined**

  The practice is underdetermined where the boundary between public wrongs and private equity blurs. Consider regulatory bodies or private prosecutions: do clean hands apply? If a company seeks an injunction against a competitor for pollution but pollutes itself, is this criminal or equitable? The law lacks a unified theory of standing across these hybrids. Furthermore, sentencing in criminal law *does* consider victim conduct (provocation), suggesting hypocrisy matters for *severity* if not *liability*. This indicates the 'pure' criminal view is not absolute.

  Additionally, the clean hands doctrine requires the misconduct to be related to the subject matter, not general hypocrisy. This limitation suggests the bar is not on moral purity per se, but on specific relational fairness. Consequently, the law does not fully commit to either the objective or relational theory. It oscillates, leaving the philosophical basis of standing unresolved. We are left without a clear principle determining when hypocrisy vitiates a complaint and when it does not, beyond historical jurisdictional accidents. This ambiguity allows courts to navigate complex moral landscapes without being bound by rigid doctrinal consistency, but it frustrates philosophical analysis.

  **What would have to change**

  If we adopted the pure view that a wrong is a wrong regardless of who points it out, the clean hands doctrine would require substantial revision. Equity would need to decouple relief from the claimant's moral conduct, granting injunctions based solely on the defendant's breach. This would transform equitable relief from a discretionary moral remedy into a right-based enforcement mechanism, aligning it with the criminal model. However, adopting the pure view primarily targets the equitable bar. It demands that courts enforce norms irrespective of the enforcer's virtue. This would strip equity of its 'conscience' branding, making it purely transactional. The change would prioritise the suppression of wrongs over the moral purification of the litigants, asserting that justice is served by correcting wrongs, even if the finger pointing is hypocritical.
