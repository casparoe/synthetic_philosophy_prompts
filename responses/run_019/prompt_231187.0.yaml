answer: |-
  This is a classic pedagogical challenge with Lewis. The definition looks like a checklist, but the *logic* is a system: remove one gear, and the machine stops working. Your intuition is correct: "Arbitrariness" is the gear most likely to slip.

  Here is a session plan designed for scientists and economists. It avoids philosophical jargon and treats the definition as a hypothesis to be tested against cases.

  ### 1. The Order of Ideas (The Sequence)

  Do not start with the definition. Start with the *problem* the definition solves.

  1.  **The Coordination Problem (Prerequisite):** Before defining convention, establish that some problems require us to match behavior to succeed. Without this, "convention" is just "habit."
  2.  **The Solution (Regularity + Expectation):** Show how we solve coordination problems. We need to do the same thing, and we need to *know* we will do the same thing.
  3.  **The Filter (Arbitrariness):** This is the crux. Introduce this as a way to distinguish *conventions* from *natural necessities* or *dominant strategies*.
  4.  **The Definition (The Package):** Only now present Lewis's full criteria as the summary of the previous three steps.

  ### 2. The Core Example: "Driving" (With a Warning)

  You are right to be tempted by driving, but you are also right to worry.
  **The Trap:** In modern society, driving on the left is enforced by law. If your group says, "We drive on the left because the police will fine us," Lewis's definition breaks (that's obligation, not convention).
  **The Fix:** Use **"The Unregulated Road."**

  Ask the group to imagine a new colony on Mars. There are no laws yet. Two rovers approach a narrow tunnel from opposite ends.
  *   **Regularity:** They both hug the left wall.
  *   **Expectation:** Rover A goes left because it expects Rover B to go left.
  *   **Arbitrariness:** They could have hugged the *right* wall. It would have worked just as well, provided they *both* did it.

  **The Contrast Case (To fix your "arbitrary but not conventional" worry):**
  Immediately contrast this with **"Breathing."**
  *   **Regularity:** We all breathe rhythmically.
  *   **Arbitrariness:** We could hold our breath for a bit; the rhythm isn't physically fixed.
  *   **Why it's NOT a convention:** I do not breathe rhythmically *because* you do. My reason for breathing does not depend on my expectation of your breathing.
  *   **Lesson:** Arbitrariness alone isn't enough. It must be arbitrariness *in the context of a coordination problem*.

  ### 3. Misconceptions & Where to Head Them Off

  **Misconception 1: "It's just a shared habit."**
  *   *Who brings this:* Probably the scientists (behavioral lens).
  *   *When:* Early, when you discuss Regularity.
  *   *The Defuse:* Use the **"Sidewalk Dance."** Two people walk toward each other, both step right, then both step left, then bump. They have a "regularity" (both stepping), but they lack the *expectation* that stabilizes it. A habit is individual; a convention is recursive ("I do it because I expect you to expect me to...").

  **Misconception 2: "Arbitrary means random or meaningless."**
  *   *Who brings this:* Everyone (linguistic intuition).
  *   *When:* When you introduce Arbitrariness.
  *   *The Defuse:* Tell them to hear "Arbitrary" as **"Interchangeable."** The value isn't in *which* side we choose, but in *choosing the same* side. If we chose Right, the value would be identical.

  **Misconception 3: "Conventions are weak; Laws are strong."**
  *   *Who brings this:* The economists (institutional lens).
  *   *When:* Near the end.
  *   *The Defuse:* Lewis argues laws usually *codify* conventions. We didn't make driving on the left a law because we liked the number 7; we made it a law because the convention already existed. The convention provides the *reason* for the law.

  ### 4. The Closing Question

  You need a question that forces them to apply the *whole* definition, specifically the arbitrariness/coordination link.

  **Ask:** *"Is using Gold as a store of value a convention in Lewis's sense?"*

  **Why this works:**
  *   **Regularity:** Yes, people use it.
  *   **Expectation:** Yes, I accept it because I expect you to.
  *   **Arbitrariness:** Yes, we could have used Silver, or Shells, or Fiat Paper. The physical properties of gold matter less than the agreement.
  *   **The Twist:** If someone argues "No, gold is chemically stable, it's not arbitrary," they have missed the point. It *is* arbitrary in the Lewis sense because Silver is also stable. The specific choice among viable alternatives is what makes it conventional.

  ### 5. Confidence and Uncertainty

  **Confidence Level: 85%**
  This structure works well for non-philosophers because it treats the definition as a functional tool (solving a coordination problem) rather than a semantic analysis. Scientists and economists generally grasp "equilibrium" concepts even if they don't use that word.

  **Least Certain Bit: The "Arbitrariness" Nuance**
  I am least sure about how quickly the group will grasp the specific Lewisian sense of arbitrariness.
  *   *The Risk:* They may conflate "Arbitrary" (could have been otherwise) with "Unmotivated" (no reason for it).
  *   *Why:* In science, "arbitrary" often means "lacks causal explanation." In Lewis, it means "alternative equilibrium exists."
  *   *Mitigation:* If you see glazed eyes during the "Arbitrariness" section, stop and draw two dots on a whiteboard. Label them "Left" and "Right." Ask: "Does it matter which dot we pick?" (No). "Does it matter that we pick the *same* dot?" (Yes). That visual usually cuts through the semantic confusion.

  ### Summary Checklist for Your Session
  1.  **Start with Mars Rovers** (Coordination Problem).
  2.  **Contrast with Breathing** (Regularity without Coordination).
  3.  **Define Arbitrariness as "Interchangeability."**
  4.  **End with the Gold Question** (Test the full definition).

  If you stick to this order, you prevent them from treating the definition as a laundry list and help them see it as a mechanical system where every part bears weight.
