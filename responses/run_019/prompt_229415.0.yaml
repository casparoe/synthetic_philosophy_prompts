answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Normative Bet Sizing in Repeated Multiplicative Gambles  
  **Parties:** Camp 1 (Expected Utility Theory) & Camp 2 (Geometric Rationality)  
  **Date:** October 26, 2023

  ## Preamble
  We, the undersigned representatives of Camp 1 (Expected Utility) and Camp 2 (Geometric Rationality), acknowledge a shared interest in determining the normative standards for decision-making under uncertainty in repeated, compounding environments. While we agree on the underlying mathematics of stochastic processes, we diverge on the interpretation of these mathematics for rational agency. This document delineates our common ground, residual disagreements, critical cruxes, and the extent to which our dispute is verbal.

  ---

  ### (i) Agreed Claims: Mathematics of Compounding and Growth

  Both camps endorse the following mathematical and descriptive claims regarding repeated favorable bets with compounding returns:

  1.  **Divergence of Means:** In a multiplicative process, the arithmetic expected value of wealth ($E[W]$) and the geometric expected growth rate ($E[\ln W]$) diverge. A strategy that maximizes $E[W]$ generally involves higher variance than a strategy that maximizes $E[\ln W]$.
  2.  **Asymptotic Dominance of Kelly:** For an infinite sequence of independent, identical gambles, the strategy that maximizes the expected logarithm of wealth (the Kelly criterion) maximizes the almost-sure asymptotic exponential growth rate of wealth. No other fixed-fraction strategy yields a higher long-run growth rate.
  3.  **Ruin Probability:** If a bet carries a non-zero probability of total loss (wealth $\to 0$) and is repeated indefinitely, any strategy that bets a fraction $f=1$ (full stake) results in wealth converging to zero with probability 1, regardless of the positive arithmetic expected value of the individual bet.
  4.  **Equivalence Condition:** Maximizing Expected Utility ($E[U(W)]$) yields the Kelly bet fraction *if and only if* the utility function is logarithmic ($U(W) = \ln W + C$).
  5.  **Finite Horizon Variance:** For any finite number of repetitions $N$, there is a non-zero probability that a sub-Kelly strategy will outperform the Kelly strategy, and a non-zero probability that a super-Kelly (leveraged) strategy will outperform the Kelly strategy, though the latter increases the probability of significant drawdown.
  6.  **Non-Ergodicity:** The ensemble average (average wealth across many parallel agents at time $t$) does not equal the time average (wealth of a single agent over time $t$) in multiplicative dynamics. $E[W_t]$ describes the ensemble; the geometric mean describes the time average.

  ---

  ### (ii) Disagreements Table

  The following table summarizes residual normative and interpretive differences. Each statement is phrased to be acceptable to the camp holding the position.

  | Topic | Camp 1 (Expected Utility) Position | Camp 2 (Geometric Rationality) Position |
  | :--- | :--- | :--- |
  | **Status of Log Utility** | Logarithmic utility is one admissible preference structure among many. An agent with $U(W) = \sqrt{W}$ is not irrational for betting less than Kelly; they simply value marginal wealth differently. | Logarithmic utility is not a psychological preference but a mathematical requirement for survival in multiplicative systems. Deviating from log-optimization is an error in reasoning, not a difference in taste. |
  | **Definition of Rationality** | Rationality is defined by internal consistency of preferences (VNM axioms). If an agent consistently maximizes $E[U(W)]$, they are rational, even if this leads to ruin in repeated play. | Rationality is defined by external coherence with the dynamics of the environment. In non-ergodic systems, rationality requires maximizing the time-average growth rate, not the ensemble-average expectation. |
  | **Interpretation of Ruin** | Ruin is an unfortunate outcome that may be rationally accepted if the expected utility of the gamble is sufficiently high ex ante. | Ruin represents a failure of rationality. A strategy that guarantees $W \to 0$ almost surely as $N \to \infty$ cannot be rational, regardless of ex ante expectations. |
  | **Scope of Normativity** | The Kelly criterion is a specific solution for a specific utility function, not a universal norm for bet sizing. | The Kelly criterion is the universal norm for any agent seeking to persist in a market or environment with compounding returns. |

  ---

  ### (iii) Cruxes: Sub-Questions and Adjudication

  We identify three cruxes where resolving the underlying question would significantly shift the weight of the argument. For each, we specify the evidence required and record each camp's prediction.

  #### Crux 1: The Evolutionary/Ergodic Argument
  *   **Question:** Does the fact that Kelly bettors almost surely dominate non-Kelly bettors in wealth share over long time horizons imply that non-Kelly betting is irrational, or merely that it is evolutionarily unfit?
  *   **Agreed Evidence:** Simulation of competing populations of agents with different fixed-fraction strategies over $10^4$ periods, tracking both individual wealth trajectories and population share.
  *   **Camp 1 Prediction:** Kelly agents will dominate the *population wealth share*, but individual non-Kelly agents (e.g., fractional Kelly) may still achieve high *utility* relative to their specific preference functions. Dominance does not equal normativity.
  *   **Camp 2 Prediction:** Kelly agents will dominate, and this dominance proves that non-Kelly strategies are irrational because they violate the ergodicity requirement for a single agent traversing time.

  #### Crux 2: Derivation from Axioms
  *   **Question:** Can the logarithmic utility function be derived from axioms of rational choice *without* assuming risk aversion or utility curvature ex ante, solely by incorporating the structure of repeated multiplicative play?
  *   **Agreed Evidence:** A formal axiomatic proof that introduces "time consistency" or "sequential stability" as a rationality axiom.
  *   **Camp 1 Prediction:** No such derivation is possible without smuggling in a preference for growth or survival. Rationality axioms (completeness, transitivity, independence) are silent on dynamic compounding.
  *   **Camp 2 Prediction:** Yes. Adding an axiom requiring that preferences remain invariant under the addition of irrelevant independent gambles (or similar dynamic consistency axioms) forces $U(W) \propto \ln W$.

  #### Crux 3: Finite vs. Infinite Horizon Relevance
  *   **Question:** Does the asymptotic property of Kelly betting (optimal as $N \to \infty$) retain normative force for agents with finite lifespans or finite investment horizons?
  *   **Agreed Evidence:** Analysis of optimal bet sizing for a fixed $N$ (e.g., $N=100$) maximizing median wealth vs. expected utility.
  *   **Camp 1 Prediction:** For finite $N$, the optimal fraction depends heavily on the specific utility function and horizon. Kelly is an approximation, not a rule.
  *   **Camp 2 Prediction:** Even for finite $N$, the geometric growth rate is the only metric that accounts for the path-dependence of wealth. The "ruin" risk exists for any $N$, making log-optimization the robust default.

  ---

  ### (iv) Closing Note on Verbal Disputes

  We acknowledge that a portion of our disagreement is verbal, specifically regarding the definitions of **"Rationality"** and **"Utility."**

  1.  **Rationality:** Camp 1 uses "rational" to mean *axiomatically consistent preferences*. Camp 2 uses "rational" to mean *instrumentally effective in achieving persistence/growth*. If Camp 1 adopts the label "instrumentally irrational" for strategies leading to ruin, and Camp 2 adopts the label "axiomatically consistent" for non-Kelly EUT maximizers, the normative tension remains, but the semantic conflict dissolves.
  2.  **Utility:** Camp 1 treats Utility as a primitive representation of subjective value. Camp 2 treats Utility as a derived metric of objective growth potential.

  However, we conclude that the dispute is **not entirely verbal**. Even if definitions are standardized, a substantive normative disagreement remains: **Should an agent's bet sizing be determined by their subjective valuation of wealth (Camp 1) or by the objective mathematical properties of the gamble's repetition (Camp 2)?** Camp 1 maintains that an agent may rationally choose a high probability of ruin for a chance at a utility spike; Camp 2 maintains that such a choice is a cognitive error regarding the nature of time and probability. This substantive gap persists regardless of terminology.
