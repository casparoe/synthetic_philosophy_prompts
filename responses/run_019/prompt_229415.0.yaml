prompt: |-
  Two camps disagree about how a rational agent should size a favorable bet that will be repeated many times with compounded returns. Camp 1 (expected utility) holds that the sole defensible norm is to maximize expected utility, so Kelly betting is not an independent principle: it is what expected utility maximization amounts to when the agent's utility over wealth happens to be logarithmic, and an agent with a different well-defined utility function should rationally deviate from the Kelly fraction. Camp 2 (geometric rationality) holds that in repeated multiplicative gambles, maximizing expected log wealth is not one preference among many but the rationality condition, since the growth-optimal strategy has an asymptotic property that no other fixed-fraction strategy has, whereas the rule 'maximize expected wealth' keeps prescribing a full-stake bet and thereby prescribes eventual ruin whenever the bet can lose everything. Draft the joint statement of their adversarial collaboration, with: (i) a numbered list of agreed claims, including what the mathematics of compounding and growth-optimal betting does and does not establish; (ii) a disagreements table in which each residual difference is stated in wording the relevant camp would itself accept; (iii) the cruxes—the sub-questions such that settling one would move at least one camp—each paired with the argument or empirical case both agree would bear on it and with each camp's prediction recorded in advance; and (iv) a closing note on which parts of the dispute, if any, are verbal.
