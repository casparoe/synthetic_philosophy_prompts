answer: |-
  This is a structural impasse caused by conflicting definitions of rationality—instrumental consistency versus substantive impartiality—compounded by equivocation between psychological description and ethical prescription.

  Your debate stalls because you are operating within two incommensurable frameworks of what "rationality" means. Your friend is arguing from the standard economic conception of **instrumental rationality**, where reason is merely the slave of the passions (a Humean view); on this view, a preference is rational if it is consistent (transitive and time-consistent), regardless of its content. Since exponential discounting avoids preference reversals, your friend correctly notes it satisfies this definition, making pure time preference a permissible "brute fact." You are arguing from a conception of **substantive rationality** (aligned with Ramsey, Pigou, and Sidgwick), where reason can evaluate the validity of the preferences themselves; on this view, a preference is irrational if it lacks a justificatory reason, and "mere location in time" is not a valid reason to weigh interests differently. Neither of you can convince the other because economics typically treats preferences as exogenous inputs (supporting your friend), while moral philosophy treats them as subject to critique (supporting you).

  This core philosophical clash is obscured by a second layer of disagreement: the conflation of **individual psychology** with **social welfare parameters**. When your friend says "everyone does it," they are making a descriptive psychological claim. When they say "you can't even think about climate policy without a discount rate," they are making a technical modeling claim. When you say it is "ethically indefensible," you are making a normative claim. In cost-benefit analysis, the discount rate is a composite of pure time preference, expected growth, and risk. Your friend is correct that models require a parameter to compare present costs to future benefits, but you are correct that setting the *pure time preference* component of that parameter to anything greater than zero is an ethical choice, not a technical necessity. The Stern Review vs. Nordhaus debate is exactly this conflict: Stern used a near-zero pure time preference rate (your view), while Nordhaus used market-derived rates (your friend's view).

  Progress requires disentangling these three distinct questions rather than trying to answer them simultaneously. First, settle the **psychological question**: Do humans exhibit pure time preference independent of uncertainty or changing marginal utility? (Evidence suggests yes, but it is often hyperbolic/present-biased rather than exponential). Second, settle the **formal question**: Can an agent have consistent exponential pure time preference? (Yes, mathematically, so your friend is right about consistency). Third, settle the **ethical question**: Should a social planner adopt that preference? (Here, your friend's appeal to "what everyone does" commits the naturalistic fallacy). To move forward, you should agree that while instrumental rationality permits pure time preference, substantive rationality and impartial ethics forbid it, and acknowledge that climate policy chooses between these frameworks rather than discovering a single "correct" rate.
