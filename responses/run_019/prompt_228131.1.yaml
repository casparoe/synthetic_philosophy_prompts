prompt: |-
  I'm a novelist, and moral worth is basically my professional obsession — I'm constantly deciding whether what a character did was admirable, and I've noticed I keep reaching for a set of working assumptions that might not actually cohere. Can you audit them? Here they are:

  1. Whether something has moral worth depends on why the person did it, not on whether it turned out well or even on whether it was the right thing to do.
  2. The people I most admire, on the page and off, act from immediate unreflective compassion — they jump in the river before there's been time to think. Visible deliberation about what one ought to do is, if anything, a bad sign about a person's character.
  3. Moral worth can't be a matter of luck: two people who would behave identically in every possible situation, differing only in which feelings happen to well up in them, deserve the same moral grade.
  4. Impure motives don't ruin anything. Almost nobody's motives are spotless, and if some vanity or self-interest rides along with the good motive, the act still counts as admirable.
  5. The way to find out what actually moved someone is counterfactual: take away the audience, the good mood, the crush, and ask whether they still would have done it.

  Tell me which of these are genuinely in tension and roughly how severe each tension is, which pairs only look like they're in tension but aren't, and for the real ones what the cheapest fix would be and what it costs me. This matters alot for the book I'm drafting, but I don't want a lecture on the history of ethics — just the audit.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **User:** Novelist obsessed with moral worth in character development.
      *   **Task:** Audit a set of 5 working assumptions about moral worth.
      *   **Specific Requirements:** Identify genuine tensions (and severity), identify false tensions, propose "cheapest fixes" for real tensions, and explain the "cost" of those fixes.
      *   **Constraint:** No lecture on the history of ethics. Keep it practical for drafting.

  2.  **Analyze the Assumptions:**
      *   *Assumption 1 (Motivism/Intent):* Moral worth depends on *why*, not outcomes or objective rightness. (Kantian/Intent-focused).
      *   *Assumption 2 (Spontaneity):* Admiration goes to unreflective compassion. Deliberation is a bad sign. (Humean/Sentiment-focused).
      *   *Assumption 3 (Control/No Luck):* Moral worth can't depend on luck. Identical behavioral dispositions + different feelings = same grade. (Control Principle).
      *   *Assumption 4 (Impurity):* Mixed motives are okay. Vanity/self-interest doesn't ruin admirability. (Anti-Purist).
      *   *Assumption 5 (Counterfactual Test):* To find the real motive, strip away external factors (audience, mood, etc.). (Diagnostic Tool).

  3.  **Evaluate Tensions (Pairwise Analysis):**

      *   **1 & 2 (Intent vs. Spontaneity):**
          *   1 says "why" matters. 2 says "unreflective" is best.
          *   *Tension:* If I deliberate, am I acting from the "right why"? 2 suggests deliberation implies a lack of virtuous character (you *had* to think about it, so you aren't naturally good). 1 allows for any motive as long as it's the *reason*.
          *   *Severity:* Moderate. 2 is a specific subset of 1, but 2 actively penalizes a type of "why" (duty/reason) that 1 might otherwise allow.
          *   *Resolution:* 2 is stronger than 1. 1 is the general rule, 2 is the specific preference.

      *   **2 & 3 (Spontaneity vs. No Luck):**
          *   2 says admire the person who jumps without thinking (feeling wells up).
          *   3 says if two people behave identically but differ in *feelings*, they deserve the same grade.
          *   *Tension:* **High.** 2 explicitly values the *presence* of a specific feeling (immediate compassion). 3 explicitly says differing feelings shouldn't change the grade if behavior/disposition is identical. If Person A jumps from compassion (2 says Admirable) and Person B jumps from trained reflex but feels nothing (3 says Same Grade), 2 says B is less admirable.
          *   *Severity:* Severe. This is the core conflict between Sentimentalism (2) and the Control Principle (3).

      *   **2 & 4 (Spontaneity vs. Impurity):**
          *   2 says pure unreflective compassion is best.
          *   4 says impure motives (vanity + compassion) are okay.
          *   *Tension:* Moderate. 2 sets an ideal ("people I *most* admire"). 4 sets a baseline ("still counts as admirable").
          *   *Resolution:* 2 describes the *peak*, 4 describes the *threshold*. They can coexist if 2 is read as "most admirable" not "only admirable."

      *   **3 & 4 (No Luck vs. Impurity):**
          *   3 says moral worth shouldn't depend on contingent factors (like feelings).
          *   4 says specific contingent motives (vanity) don't ruin it.
          *   *Tension:* Low. They actually support each other. 3 says "don't penalize luck," 4 says "don't penalize impure psychological luck."

      *   **1 & 5 (Intent vs. Counterfactual):**
          *   1 says intent matters. 5 says how to find intent.
          *   *Tension:* None. 5 is the methodology for 1.

      *   **2 & 5 (Spontaneity vs. Counterfactual):**
          *   2 says don't think, just feel.
          *   5 says imagine removing factors to see if you'd still do it.
          *   *Tension:* Low. 5 is an analytical tool for the reader/author, not necessarily a process the character undergoes *in the moment*.

      *   **4 & 5 (Impurity vs. Counterfactual):**
          *   4 says mixed motives are fine.
          *   5 says strip away factors to find the *actual* mover.
          *   *Tension:* Low/Moderate. If 5 reveals the *only* motive was vanity (once audience is removed), 4 says "if some vanity rides along with good motive." If the good motive disappears in the counterfactual, 4 might not save it.
          *   *Severity:* Low. Just needs clarification on "rides along with."

  4.  **Synthesize the Findings (The Audit):**

      *   **Major Conflict:** Assumption 2 (Spontaneous Feeling) vs. Assumption 3 (No Moral Luck/Feelings don't count).
          *   *Why:* 2 says the *feeling* makes it admirable. 3 says the *feeling* is luck and shouldn't change the grade.
          *   *Severity:* Critical. It breaks the internal logic of character evaluation.
      *   **Minor Conflict:** Assumption 2 (Deliberation is bad) vs. Assumption 1 (Motives matter).
          *   *Why:* Deliberation is a motive/process. 2 pre-judges it negatively.
      *   **False Conflicts:** 1 & 5, 3 & 4, 4 & 5 (mostly).

  5.  **Drafting the Fixes:**

      *   *Fix for 2 vs 3:*
          *   Option A (Keep 2, Drop 3): Moral worth *is* about feelings. Luck is real. (Cost: Harder to judge characters fairly; relies on psychology).
          *   Option B (Keep 3, Modify 2): Admire the *disposition* to feel, not the feeling itself. Deliberation can be a sign of caring too. (Cost: Loses the romantic "heroic instinct" trope).
          *   *Cheapest Fix:* Modify 2. Change "unreflective compassion" to "unhesitating care." Allow deliberation to be fast. Or, modify 3 to allow "constitutive luck" (luck in who you are).
          *   *Recommendation:* Tweak 3. Acknowledge that *feeling* the compassion is part of the moral worth, even if it's luck. Or Tweak 2 to focus on *action* speed, not *thought* absence. Let's suggest tweaking 2 to focus on *resistance* rather than *reflection*.

      *   *Fix for 2 vs 4:*
          *   Clarify "Most Admire" vs "Admirable."
          *   *Cost:* Nuance.

  6.  **Refining the Output:**
      *   Structure: Executive Summary, The Critical Tension, The Moderate Tension, The False Alarms, The Fixes.
      *   Tone: Professional, direct, writer-focused. No Kant/Hume name-dropping unless necessary for shorthand (decided to avoid it per prompt instructions).
      *   Focus on *character drafting* implications.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I lecture on ethics history? *Correction:* Ensure I don't explain *why* philosophers fight about this, just how it affects the user's assumptions.
      *   *Check:* Is the 2 vs 3 tension clear? *Explanation:* If I save a kid because I love kids (2), I'm a hero. If I save a kid because it's my job and I feel nothing (3 says I'm equal to the first guy), 2 says I'm cold. 3 says feelings are luck. If feelings are luck, 2 is judging luck.
      *   *Check:* Assumption 5. Is it compatible with 2? 5 requires hypothetical reflection. 2 hates reflection. *Correction:* 5 is an authorial tool, 2 is a character trait. I need to make sure the user distinguishes between *character deliberation* and *authorial analysis*. I will note this distinction.

  8.  **Final Polish:** Organize by Severity. High, Medium, None. Provide the "Cost" clearly for each fix. (Proceed to generate response).

      *   *Wait, one more look at 1 & 2.* 1 says "why... not whether it was the right thing." 2 says "deliberation about what one ought to do is a bad sign." These are very compatible. 1 prioritizes motive over outcome/rightness. 2 prioritizes instinct over duty-calculation. They align well. The tension is really 2 vs 3.
      *   *Wait, look at 3 & 4.* 3 says "differing only in which feelings... deserve the same grade." 4 says "if some vanity... rides along with the good motive." If Person A has Compassion + Vanity, and Person B has Duty + Vanity. 3 says if behavior is identical, grade is same. 4 says Vanity doesn't ruin it. These are actually very harmonious. They both argue against purism.
      *   *So the main villain is Assumption 2.* It's the outlier. It demands a specific psychological state (unreflective compassion) whereas 3 says psychological states (feelings) shouldn't dictate grade if behavior is same.

      *   *Re-evaluating 2 vs 3:*
          *   2: Admire unreflective compassion. (Values the feeling).
          *   3: Feelings are luck; identical behavior = identical grade. (Devalues the feeling).
          *   *Verdict:* Direct contradiction.

      *   *Re-evaluating 1 vs 2:*
          *   1: Motive matters.
          *   2: Specific motive (compassion) > Specific process (deliberation).
          *   *Verdict:* 2 is a specification of 1. No tension, unless deliberation is considered a "motive." If deliberation implies "duty" motive, 2 says that's worse than "compassion" motive. 1 allows either. So 2 restricts 1. Mild tension.

      *   *Re-evaluating 5:* 5 is a test for motive. 2 says don't think. 5 says *we* (the judge) should think counterfactually. This is a category error risk. Character doesn't think (2), Author thinks (5). I need to point this out.

      *   *Plan:*
          1.  Critical Tension: 2 vs 3 (The "Feeling" Contradiction).
          2.  Moderate Tension: 2 vs 1 & 4 (The "Purity" Problem).
          3.  Clarification needed: 5 (Author vs Character).
          4.  Fixes.

      *   *Let's write.*
answer: |-
  Here is the audit of your five assumptions. I have categorized them by severity of conflict, identified the false alarms, and outlined the cheapest fixes with their narrative costs.

  ### 1. The Critical Tension (Severity: High)
  **The Conflict:** Assumption 2 vs. Assumption 3.

  *   **Assumption 2** claims moral worth is highest when driven by specific *feelings* (immediate compassion) and penalizes a specific mental process (deliberation).
  *   **Assumption 3** claims moral worth cannot depend on *feelings* (which are luck) if the behavior/disposition is identical.

  **Why it breaks:** You cannot hold both. If two characters jump in the river, but Character A feels compassion and Character B feels nothing (just reflex or duty), Assumption 3 demands you grade them equally. Assumption 2 demands you admire A more than B. Assumption 2 treats feelings as the source of worth; Assumption 3 treats feelings as morally irrelevant noise.

  **The Cheapest Fix:** Modify **Assumption 2**.
  Change "unreflective compassion" to "unhesitating care." Allow the *speed* of the action to be the virtue, not the absence of thought or the presence of a specific warm feeling.
  *   **The Cost:** You lose the romantic trope of the "pure-hearted instinct." Your characters can now be admirable even if they act from trained reflex, cold duty, or fast calculation, provided they don't hesitate. It makes your moral landscape more diverse but less emotionally warm.

  **Alternative Fix:** Modify **Assumption 3**.
  Admit that "constitutive luck" (the luck of having a compassionate nature) *does* affect moral worth.
  *   **The Cost:** You lose the ability to judge characters purely on control. You have to accept that some people are morally "luckier" than others, which can make your moral grading feel arbitrary or unfair to the reader (e.g., "Why is the naturally nice guy a hero and the reformed jerk just okay?").

  ### 2. The Moderate Tension (Severity: Medium)
  **The Conflict:** Assumption 2 vs. Assumption 4.

  *   **Assumption 2** sets a gold standard: "The people I *most* admire... act from immediate unreflective compassion."
  *   **Assumption 4** sets a baseline: "Impure motives don't ruin anything."

  **Why it breaks:** It creates a grading ambiguity. If a character jumps in the river to save a child, but also because they want to look good in front of a crush (Assumption 4 says this is fine), does Assumption 2 downgrade them because the compassion wasn't the *sole* mover? Assumption 2 implies a purity of impulse ("spotless" isn't required by 4, but "unreflective compassion" is required by 2).

  **The Cheapest Fix:** Clarify the hierarchy.
  Explicitly treat Assumption 2 as the **Ceiling** (Saintliness) and Assumption 4 as the **Floor** (Admirability).
  *   **The Cost:** You lose binary judgment. You can't just ask "Is this character good?" You have to ask "How good?" This requires more nuance in your narrative voice, distinguishing between the *admirable act* and the *admirable person*.

  ### 3. The False Alarms (Severity: None)
  **Assumption 1 & Assumption 5:**
  These are perfectly coherent. Assumption 1 says motive is what matters; Assumption 5 provides the diagnostic tool to isolate that motive. They work together seamlessly.

  **Assumption 3 & Assumption 4:**
  These are actually allies. Both argue against "moral purism." Assumption 3 says you shouldn't be penalized for the luck of your feelings; Assumption 4 says you shouldn't be penalized for the luck of your mixed motives. They both broaden the category of who counts as "good."

  **Assumption 1 & Assumption 2:**
  These look like they clash (Intent vs. Instinct), but they don't. Assumption 1 says outcomes don't matter; Assumption 2 specifies *which* internal state matters most. Assumption 2 is just a specific flavor of Assumption 1.

  ### 4. The Category Error (Severity: Low but Tricky)
  **The Conflict:** Assumption 2 vs. Assumption 5.

  *   **Assumption 2** describes the **Character**: They shouldn't think; they should feel and act.
  *   **Assumption 5** describes the **Author/Reader**: We must think counterfactually to judge them.

  **Why it matters:** If you apply Assumption 5 *to the character* (i.e., the character stops to wonder, "Would I do this without an audience?"), you violate Assumption 2. If you apply Assumption 2 *to the author* (i.e., "I shouldn't think about why they did it, just admire it"), you violate Assumption 5.

  **The Fix:** Enforce a strict boundary.
  Assumption 2 governs **in-scene behavior**. Assumption 5 governs **drafting/outlining analysis**.
  *   **The Cost:** You must be careful not to write "navel-gazing" scenes where characters psychoanalyze their own virtue in the moment, or you undermine the spontaneity you claim to admire in Assumption 2.

  ### Summary Recommendation for Your Draft
  Your system is 80% coherent. The only dealbreaker is the clash between **valuing feelings** (2) and **dismissing feelings as luck** (3).

  **To save the system with minimal friction:**
  Keep 1, 3, 4, and 5. Rewrite 2.
  **New Assumption 2:** "The people I most admire act with **unhesitating commitment**. Whether that comes from warm compassion or cold duty matters less than the absence of selfish hesitation."

  This aligns with 3 (feelings don't dictate grade), 4 (motives can be mixed), and 5 (the counterfactual tests for hesitation/selfishness, not specific feelings). It costs you the specific "warmth" of the compassionate hero, but it gives you a robust framework for judging *all* your characters consistently.
