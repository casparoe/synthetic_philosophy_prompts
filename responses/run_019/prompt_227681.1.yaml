  You're a philosopher who specializes in the methodology and ethics of historiography -- how historians should handle the moral assessment of past people and practices. Think this through carefully: before committing, brainstorm two or three candidate principles, test them against my cases, and only then settle. Don't just grab the first principle that fits the majority.

  I'm trying to pin down what I actually think about judging the past by present moral standards, going by my gut on cases. Here's where I land:

  1. Jefferson keeping enslaved people: condemnable. The abolitionist arguments existed, he'd encountered them, he even wrote himself about slavery being wrong. The "man of his time" defense doesn't move me here.
  2. A medieval surgeon who didn't wash his hands and spread infection between patients: not blameworthy. Nobody knew about germs; you can't fault someone for failing to know what wasn't yet knowable.
  3. A 13th century peasant who beat his wife, in a village where everyone including the priest treated it as a husband's right: i can't bring myself to condemn him the way I'd condemn a man who does the same thing today. Nobody in his world ever told him otherwise.
  4. A factory owner around 1840 working children twelve hours a day in dangerous mills: condemnable. Reformers were already shouting about it, the harm was visible, he just didn't want to see it.
  5. Aristotle arguing that some people are slaves by nature: I want to say the view was wrong, but I'm reluctant to call Aristotle a bad man. (Is that even a coherent split?)
  6. A Roman father leaving an unwanted infant out to die of exposure -- a routine, legal, socially accepted practice: this one I keep going back and forth on. If I excuse him, then the peasant in 3 comes along for free, and maybe Jefferson slips out too. If I condemn him, I'm basically condemning whole civilizations wholesale, which feels like a reductio of the entire enterprise.

  The problem is that 1 and 3 look structurally identical to me: both did something we now know is awful, both lived where it was broadly accepted. My only handle for splitting them is "the counterarguments were available," but the peasant's wife was suffering right in front of him just as Jefferson's slaves were suffering in front of him -- so "availability" seems to shrink down to "was there a nearby book disagreeing," and that feels arbitrary.

  So: give me a principle (or two or three candidates) that captures these verdicts. For each candidate, state it precisely, say which case motivates which clause, and tell me what it predicts for cases I haven't listed -- an Athenian democrat in the 5th century BC who kept slaves; a person today buying fast fashion made in sweatshop conditions; a judge in 1690 sentencing a woman to death for witchcraft while sincerely believing witchcraft is real. Be honest about which of my verdicts each principle can't save. If the price of saving all six is a principle with one ad hoc clause per case, I'd rather you tell me which verdict to drop and why. And one more thing: does your favorite principle commit me to thinking future generations are right to condemn us for eating meat? Can I live with that?

  Lead with your bottom line in the very first sentence, then give the reasoning. No preamble, no restating my question back at me.
