prompt: |-
  You are an expert in classical Chinese philosophy and in semantics, with particular familiarity with the School of Names and the White Horse Dialogue. Please think carefully and work through the possible readings before committing to an answer; it may help to brainstorm a wide range of candidate readings first and then prune and organize them.

  I'm in a seminar on language and metaphysics in early Chinese thought, and we've been reading the "White Horse Dialogue" from the Gongsun Longzi together with some modern reconstructions. The line everyone keeps repeating, as if it settles the matter, is "a white horse is not a horse." Our instructor uses that line to push back whenever anyone tries to parse the dialogue with set membership or extension: they say something like, you are importing modern logical machinery, but in this text a white horse is not a horse, and the whole point is to see why a wrong theory of naming makes that sound paradoxical. One student, by contrast, insists the line is just an equivocation between "is not the same term as" and "is not a member of the class," and that once you disambiguate, the dialogue collapses into either a triviality or a falsehood. Another student thinks it is making a serious point about concepts rather than animals: the concept expressed by the name "white horse" is not the concept expressed by the name "horse," so the School of Names is groping toward something like an intensional distinction.

  I am not satisfied with any of these. What I want is a systematic menu of the precise claims the slogan "a white horse is not a horse" could be asserting, arranged from the most trivial to the most radical, with a verdict for each: is it true, is it substantive, and is it a natural reading of the actual moves in the dialogue (for example, the argument that "horse" is used for shape while "white" is used for color, and the argument that a request for a horse can be satisfied by a yellow horse while a request for a white horse cannot)? Then say which of these readings, if any, actually does the work my instructor wants it to do against the set-membership reading, and which reading the "it is just an equivocation" student is tacitly treating as the only candidate. Where the instructor's use of the line runs ahead of what the line itself can prove, identify that cleanly.
