      *   *The Copula:* Classical Chinese doesn't have a strict "is." *Fei* is a negative marker often functioning as "is not."
      *   *Candidate Readings:*
          1.  Identity: The concept "white horse" is not identical to the concept "horse."
          2.  Extension/Membership: The set of white horses is not the set of horses. (True but trivial). A specific white horse is not a member of the set of horses. (False).
          3.  Naming/Reference: The term "white horse" does not refer to the same things as "horse."
          4.  Ontological: The entity "white horse" is a distinct compound entity from "horse."
          5.  Prescriptive/Normative: You ought not to classify a white horse under the label "horse" in this context.
          6.  Semantic Composition: The meaning of the compound is not the meaning of the head.

