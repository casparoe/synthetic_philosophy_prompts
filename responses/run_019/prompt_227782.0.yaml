answer: |-
  To evaluate whether morality has rules, we first need a job description. What must a theory of moral reasons achieve to be taken seriously? Based on the literature ranging from W.D. Ross's *prima facie* duties to Jonathan Dancy's radical particularism, here are the core desiderata.

  **1. Action-Guidance (Non-Negotiable)**
  Morality must help agents decide what to do. A theory that renders moral thought impossible in real-time is defective.
  *   *Motivating Case:* An agent faces a urgent choice (e.g., lie to save a life). They cannot pause for infinite reflection. If moral principles are so complex they cannot be grasped, they fail as tools for deliberation.

  **2. Context Sensitivity (Mostly Settled Phenomenon)**
  A theory must account for the fact that a feature's moral contribution can change depending on the situation.
  *   *Motivating Case:* Pain is usually bad, but the pain of a dentist's drill or a sadist's victim functions differently. As Dancy argues, reasons are holistic: a feature that counts in favor of an act here may count against it there, or not at all. While the *existence* of holism is widely acknowledged, its theoretical upshot is contested.

  **3. Consistency and Publicity (Non-Negotiable)**
  Morality cannot be arbitrary. Like cases must be treated alike, and reasons must be communicable.
  *   *Motivating Case:* If I claim lying is wrong for you but right for me without a relevant difference, I am being inconsistent. A theory must explain how we avoid arbitrariness without rigid rules.

  **4. Codifiability (Contested/Hobbyhorse)**
  This is the battleground. Must moral competence consist in the ability to articulate principles?
  *   *Motivating Case:* Generalists argue that without codifiable rules, moral judgment is mere intuition. Particularists argue that ordinary people reason well without consulting a rulebook, suggesting principles are crutches, not foundations.

  **The Fundamental Tension**
  Here lies the rub: **Context Sensitivity** and **Codifiability** appear incompatible. If reasons are truly holistic (Desideratum 2), then any principle stating "Feature X always counts in favor of Y" will require endless *ceteris paribus* (all else equal) clauses to handle exceptions. Eventually, the rule becomes so bloated it fails **Action-Guidance** (Desideratum 1). You cannot have exceptionless rules *and* radical context dependence without sacrificing usability.

  **Scorecard for Contenders**
  *   **Strict Generalism (Kantian/Utilitarian):** Aces Consistency and Guidance. Struggles with Context Sensitivity, often forcing complex cases into Procrustean beds or relying on invisible "all else equal" clauses.
  *   **Radical Particularism (Dancy):** Aces Context Sensitivity. Struggles with Consistency and Guidance. If there are no principles, how do we learn morality or criticize errors without appealing to generalizations?
  *   **Moderate Principlism (Rossian):** Attempts a middle ground. Principles are *default* reasons (prima facie) but not exceptionless. This preserves Guidance and Sensitivity but risks vagueness: when duties conflict, the theory offers no rule for resolution.

  **Settled vs. Contested**
  Be careful not to present the death of principles as consensus. It is largely **settled** in contemporary meta-ethics that holism is real; features do not have invariant valences. However, it is **genuinely contested** whether holism eliminates principles. Generalists argue principles can be defeasible (open to exception) without being useless. Particularists argue defeasible principles are no principles at all.

  Furthermore, while everyone agrees morality requires consistency, there is no agreement on whether consistency *requires* rules. Some argue consistency is a matter of seeing similarities (particularism), others that it requires subsumption under laws (generalism). The debate is no longer about whether context matters—it does—but whether principles can survive it.
