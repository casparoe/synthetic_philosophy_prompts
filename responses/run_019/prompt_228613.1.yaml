answer: |-
  ### Precisation of the Claim

  Before giving the number, I need to lock down the operational definition. I am interpreting the **Strategy-Stealing Assumption (SSA)** in the context of AI Safety via Debate as follows:

  > **Claim:** For a distribution of questions $Q$ with objective ground truth, and debaters $D_H$ (honest) and $D_L$ (dishonest) with capability $C \gg J$ (judge capability), there exists a debate protocol depth $d$ such that the probability $P(\text{Judge awards win to } D_H) > 0.9$, assuming optimal play from both sides.

  Crucially, this assumes the judge is a **weak human** (or HCH tree with human leaves), not an oracle. The "strategy-stealing" here implies that $D_H$ can efficiently mimic any persuasive rhetorical move $D_L$ makes, plus leverage the truth, without being bottlenecked by verification costs that exceed the judge's comprehension.

  ### The Credence

  **My credence that SSA holds under this precisation is 35%.**

  I am assigning less-than-even odds because the assumption relies on a symmetry of *persuasive efficiency* that is theoretically fragile when the judge is the bottleneck. The literature (particularly recent empirical work like Brown-Cohen et al., 2024) suggests that lying/obfuscation often scales more efficiently with capability than verification/truth-telling.

  ---

  ### Decomposition

  I model the probability of SSA holding as a chain of conditional dependencies. If any link breaks, the honest debater cannot reliably win against a capable adversary.

  $$P(\text{SSA}) \approx P(A) \times P(B|A) \times P(C|A,B)$$

  #### (a) Structural Truth Advantage ($P(A) = 0.75$)
  *   **Claim:** Truth is inherently easier to defend than falsehood in the limit of capability (consistency constraints, predictability).
  *   **Justification:** A liar must maintain a consistent world model that contradicts reality; the honest agent just reports reality. In formal domains (math, code), this advantage is massive. In natural language or policy questions, it is weaker but still present (lies require more memory/state to remain consistent).
  *   **Uncertainty:** This drops if the question space allows for "in principle undecidable" claims where truth offers no compression advantage.

  #### (b) Judge Fidelity ($P(B|A) = 0.55$)
  *   **Claim:** A human judge can distinguish between "high-quality argument" and "high-confidence rhetoric" without understanding the underlying object-level claim.
  *   **Justification:** This is the weakest link in the HCH chain. Humans are cognitively biased toward fluency, confidence, and social cues. If $D_L$ optimizes for these features (which are easier to generate than truth), and $D_H$ is constrained by nuance/uncertainty, the judge's signal-to-noise ratio collapses. Recent psych-LLM work suggests models can exploit human biases better than humans can detect them.
  *   **Uncertainty:** Could be improved with better training (RLHF for judges) or interface design, but fundamentally limited by human cognitive bandwidth.

  #### (c) Obfuscation & Verification Asymmetry ($P(C|A,B) = 0.85$)
  *   **Claim:** The cost for $D_H$ to refute a specific obfuscated claim by $D_L$ is not asymptotically higher than the cost for $D_L$ to make the claim, *relative to the judge's ability to check*.
  *   **Justification:** This is the Brown-Cohen critique. If $D_L$ says "There is a backdoor in this 10k line code," and $D_H$ says "There isn't," the judge cannot verify either. $D_L$ wins by default if the burden of proof is on the honest agent. SSA requires that $D_H$ can pinpoint the lie faster than the judge gets bored/confused. In complex systems, verification is often $O(N)$ while assertion is $O(1)$.
  *   **Why higher credence?** I am conditioning on (A) and (B). If the judge is reliable (B) and truth is structural (A), obfuscation is less deadly. However, if the judge *cannot* check the bottom leaf, SSA fails regardless of (A). I'm giving this the benefit of the doubt that debate trees can bottom out in checkable claims often enough.

  #### (d) The "Ill-Posed" Factor ($P(\text{Frame}) = 0.90$)
  *   **Claim:** The question is well-posed enough for a probability estimate.
  *   **Justification:** 10% credence that "capability" is too multidimensional or that "debate" is the wrong abstraction for oversight (e.g., we need automated evals, not human judges).

  ### Combination Logic

  I treat (b) and (c) as the primary bottlenecks. (a) is likely true but insufficient.

  $$P(\text{SSA}) \approx P(\text{Truth Advantage}) \times \min(P(\text{Judge Fidelity}), P(\text{No Obfuscation Gap}))$$

  $$0.75 \times \min(0.55, 0.45) \approx 0.34$$

  *(Note: I adjusted (c) down to 0.45 in the calculation to reflect the specific risk of "uncheckable leaves" which is distinct from general verification asymmetry. If the debate bottoms out in a claim the human literally cannot check, SSA is dead.)*

  **Final Calculation:** $0.75 \times 0.45 \approx 0.3375 \rightarrow \mathbf{35\%}$.

  **The Workhorse Term:** **(b) Judge Fidelity / Obfuscation Gap.** Specifically, the probability that a human judge can be trained to ignore rhetorical optimization that correlates with falsehood. This is doing 80% of the work in dragging the credence down. If humans were perfect Bayesian updaters, SSA would be >80%. Because humans are heuristic processors, SSA is <40%.

  ---

  ### What Would Move Me?

  #### 1. Upward Update (To >60%)
  **Experiment:** A large-scale "Adversarial Debate" benchmark where SOTA models debate ground-truth questions (e.g., "Does this Python function have a security vulnerability?") before a **blind** human judge.
  *   **Condition:** The dishonest agent is explicitly optimized to win via deception (RL on winning, not truth). The honest agent is optimized for truth.
  *   **Result:** If the honest agent wins >90% of the time *even when the lie is obfuscated* (e.g., the vulnerability is subtle), my credence jumps. This would prove that truth has a robust "persuasive edge" even against adversarial sophistry.

  #### 2. Downward Update (To <15%)
  **Formal Result/Empirical Observation:** A demonstration of **Persuasion-Verification Asymmetry**.
  *   **Condition:** Show that for a specific class of relevant problems (e.g., code security, scientific claims), the compute/time required to *generate* a plausible lie scales as $O(k)$, but the compute/time to *refute* it scales as $O(k^2)$ or higher, *and* that the judge's error rate correlates with this asymmetry.
  *   **Result:** If we prove that lying is computationally cheaper than truth-telling in the eyes of the judge, SSA is theoretically dead. The Brown-Cohen (2024) paper moves me in this direction, but a stronger scaling law would cement it.

  #### 3. Ill-Posedness (10% Credence)
  I assign a **10% probability** that the question is ill-posed because "Strategy-Stealing" conflates two different failure modes:
  1.  **Epistemic:** The judge cannot know the truth.
  2.  **Game-Theoretic:** The honest agent cannot force the debate into a checkable state.

  If the solution requires abandoning human judges entirely (e.g., moving to **automated oversight** where the "judge" is a weaker model with formal verification tools), then SSA for *human* debate is irrelevant. If you told me tomorrow that scalable oversight will be model-based, not human-based, my credence in SSA *for human debate* becomes moot (effectively 0% relevance, though the theoretical property might still hold).

  ### Summary
  I am skeptical (35%) because the assumption relies on human judges being robust to adversarial rhetoric, which contradicts most of what we know about human psychology and recent LLM red-teaming. The load-bearing beam is **Judge Fidelity**, not the debaters' capability. Until we have evidence that humans can be trained to ignore "confidence heuristics" in high-stakes technical debates, SSA remains a hopeful hypothesis rather than a grounded assumption.
