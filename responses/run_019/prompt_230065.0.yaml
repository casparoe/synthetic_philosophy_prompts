answer: |-
  Although the character Demea delivers this speech to assert the certainty required to support his version of the cosmological argument, Hume intentionally embeds the contradiction you noticed to rhetorically weaken this dogmatic stance and prepare the reader for the skeptical critique that follows. In the *Dialogues*, Hume does not speak directly but distributes views among three characters, and this passage is spoken by Demea, who represents orthodox religion and a priori reasoning, rather than Hume's own skeptical voice which is largely expressed through Philo. You are correct to spot the tension; Demea claims belief is universal and obvious to prevent doubt, yet admits philosophers still strive to prove it to satisfy reason, because he wants to shield religion from skepticism by calling it "obvious" while simultaneously validating the philosophical project of proving it. This assertion of certainty is the prerequisite for Demea's specific cosmological argument later in the text, where he argues that God's existence must be logically necessary rather than just probable, since he needs God's existence to be as certain as a mathematical truth to make his causal reasoning work. By having Demea overstate the obviousness of God's existence, Hume sets up a target for Philo to dismantle, so that when Philo later shows that God's existence is not logically necessary and cannot be proven a priori, Demea's initial claim that it is "obvious" and "certain" looks like dogmatic wishful thinking rather than rational truth.
