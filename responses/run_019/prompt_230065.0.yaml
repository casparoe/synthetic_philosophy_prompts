prompt: |-
  I am a sixth-form student, and I have been set an essay on the cosmological argument for my philosophy course. I came across the following passage from David Hume's Dialogues Concerning Natural Religion, and I am finding it difficult to interpret.

  The passage is:

  "What truth so obvious, so certain, as the being of a God, which the most ignorant ages have acknowledged, for which the most refined geniuses have ambitiously striven to produce new proofs and arguments? What truth so important as this, which is the ground of all our hopes, the surest foundation of morality, the firmest support of society, and the only principle which ought never to be a moment absent from our thoughts and meditations?"

  The passage seems to say both that God's existence is obvious and that the greatest thinkers have tried hard to prove it. If it is so obvious, why would a proof be needed? I am also unsure how this passage relates to the cosmological argument, especially to Demea's version of it later in the same work. Could you explain what Hume is doing rhetorically in this passage, and whether it is meant to support or undermine the cosmological argument? Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
