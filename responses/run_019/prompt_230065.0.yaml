      *   **Hume's Intent:** Hume often puts weak arguments in the mouths of characters he intends to critique. Demea represents orthodox religion and a priori reasoning (cosmological argument). Philo usually dismantles these positions.
      *   **Rhetorical Strategy:** Demea is setting up a high stake for the discussion. He wants to establish that God's existence is undeniable *before* moving into specific proofs. However, by claiming it is "obvious" yet needing "new proofs," he exposes a weakness: if it were truly obvious to reason, proofs wouldn't be necessary; if proofs are necessary, it isn't obviously true to reason.
