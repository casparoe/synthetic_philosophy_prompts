answer: |-
  After twelve months of adversarial collaboration funded by the institute, we submit this joint statement to clarify the status of function talk in biological science. We begin by recording the substantial ground upon which we both stand, acknowledging that our disagreement is not about the utility of functional language but about its truth conditions. We agree that attributing a function to a trait is not merely a convenient metaphor or a shorthand for causal description; rather, function statements carry explanatory weight that simple mechanistic descriptions lack. Both of us endorse the claim that to say a trait has a function is to say that its presence is non-accidental relative to some broader system, whether that system is defined by evolutionary lineage or by current physiological organisation. We further agree that functional ascriptions are normative in a specific sense: they allow us to distinguish between a trait operating correctly and a trait malfunctioning, and they allow us to distinguish between a trait that is merely present and one that is maintained for a reason. We concede that neither a purely historical account nor a purely mechanistic account captures every intuition scientists have when they ask what a heart or a gene is for, and we agree that any viable theory must account for the stability of traits across time as well as their capacity to contribute to system capacities in the present moment.

  Having established this common foundation, we state the exact point of division that remains unresolved. The selected-effects theorist maintains that the function of a trait is constituted exclusively by the effects for which it was naturally selected in the past. On this view, history is not merely evidence for function; history is what function is. A trait cannot have a function unless it has been shaped by selection pressures, and if the current contribution of the trait diverges from its historical selection pressure, the function remains tied to the history. The causal-role theorist maintains that the function of a trait is constituted by its current causal contribution to the capacity of a containing system. On this view, history is evidence for why a trait is present, but it is not what defines its function. If a trait contributes to a system's capacity now, it has a function now, regardless of whether selection has acted upon it previously. We agree that this is not a difference in emphasis but a difference in ontology. We are not arguing over which perspective is more useful for different practical tasks; we are arguing over whether the property of having a function is intrinsic to the current causal structure of the organism or relational to its evolutionary history.

  To move beyond this stalemate, we have identified two cruxes where empirical evidence or conceptual resolution could shift the position of at least one camp. The first crux concerns normativity and malfunction. The selected-effects theorist argues that only history can ground the distinction between a trait that is broken and a trait that is rare; without a historical standard, a causal-role account cannot explain why a heart that does not pump is malfunctioning rather than simply performing a different causal role. The causal-role theorist argues that current system integrity can ground normativity; if a trait fails to contribute to the viability of the organism now, it is pathological, regardless of history. Settling this requires determining whether malfunction can be defined in purely systemic terms without recourse to evolutionary history. The second crux concerns explanatory power in novel contexts. The causal-role theorist argues that in rapidly changing environments or synthetic biology, historical data is unavailable or irrelevant, and only current causal roles predict system behaviour. The selected-effects theorist argues that without historical constraints, the causal-role account becomes too permissive, attributing functions to every trivial effect a trait produces. Settling this requires determining whether a definition of function that includes every causal contribution loses the power to explain why specific traits are maintained rather than others.

  Regarding the concrete cases that separate us, we have recorded our divergent predictions to ensure future evidence is interpreted fairly. In the case of a new mutation that arises and proves immediately useful but has no selection history, the selected-effects theorist predicts that the trait has no function yet, but rather a proto-function or potential function, until selection has had time to act upon it. The causal-role theorist predicts that the trait has a function immediately upon contributing to the system's capacity, regardless of its history. In the case of exaptation, where a trait selected for one purpose is co-opted for another, such as feathers evolving for thermoregulation and later used for flight, the selected-effects theorist maintains that the function remains thermoregulation until a new lineage-specific selection pressure establishes flight as the new selected effect. The causal-role theorist maintains that the function includes flight as soon as the trait contributes to aerodynamic lift, even before new selection stabilises it. In the case of a trait that was selected for in the past but is now actively harmful, such as an immune response that causes autoimmune disease in a modern environment, the selected-effects theorist asserts the function remains defence against pathogens, and the harm is a malfunction of that function. The causal-role theorist asserts that if the net contribution to system viability is negative, the functional ascription is either lost or must be redefined as a pathological causal role.

  We conclude by acknowledging that a significant portion of our dispute may be merely verbal, stemming from a single word being asked to carry two distinct conceptual loads. We suspect that the selected-effects theorist is using function to mean evolutionary justification, while the causal-role theorist is using function to mean current physiological capacity. If this is the case, the disagreement dissolves into a recommendation for terminological precision rather than ontological conflict. We propose that future communications distinguish between evolutionary function, which requires a history of selection, and physiological function, which requires only current causal contribution. However, we cannot yet sign off on this dissolution entirely, as both sides believe their definition captures the primary sense in which biologists use the term in their respective fields. Until evidence regarding normativity or explanatory power in novel systems forces a revision, we record this disagreement as substantive. We commit to using these definitions explicitly in our joint publications to prevent talking past one another, ensuring that when we ask what a trait is for, we specify whether we are asking about its history or its current capacity.
