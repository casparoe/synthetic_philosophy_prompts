  Bottom line
  Your package does not survive as it is. You are combining Szasz's metaphysical claims with conventional medical ethics that he explicitly rejected. This creates contradictions between your views on responsibility, science, and coercion.

  Real clashes, worst first
  The critical failure is between (1) and (4). Szasz argues that if "illness" is a myth, individuals retain full responsibility for their actions, viewing "madness" as a strategic choice. You claim illness is metaphorical (1) yet use it to negate criminal responsibility (4). To resolve this, you must either accept mental illness as a real constraint on agency (abandoning 1) or uphold responsibility despite delusion (abandoning 4). You cannot have it both ways; denying the disease removes the excuse. If you keep (1), you must argue delusional people are still responsible, which contradicts your humane intuition. If you keep (4), you must admit the condition affects agency like a disease, which undermines (1). This forces a choice between philosophical consistency and moral comfort.

  Secondly, (1) and (5) are logically incompatible. (1) treats the absence of lesions as a definitional truth (it *cannot* be a disease category), while (5) treats it as an empirical gap (we haven't found them *yet*). If (5) proves true, (1) is falsified. You cannot hold a conceptual certainty that depends on future data. To fix this, (1) must become a provisional claim, not a philosophical absolute. If you keep (1) as absolute, you must deny neuroscience will ever find lesions, which is dogmatic. If you keep (5), you admit (1) is just temporary skepticism. This undermines the strength of your Szaszian foundation.

  Finally, (3) and (4) tension lies in the outcome. If a delusional offender isn't punished (4), they are typically detained in a secure hospital. If this detention is involuntary, it violates your principle in (3) that psychiatric grounds shouldn't justify locking people up, regardless of the legal trigger. You need to distinguish between punitive imprisonment and protective containment, or (3) must yield to public safety concerns in extreme cases. If you keep (3) absolutely, you might have to let dangerous individuals go free. If you keep (4), you must accept psychiatric detention, violating (3). This creates a legal loophole that endangers your libertarian stance. Ultimately, you cannot maintain a strict prohibition on psychiatric detention while simultaneously advocating for psychiatric exemptions in law.

  Only apparent clashes
  (1) and (2) look contradictory but dissolve with careful phrasing. You can argue medication alleviates suffering or modifies behavior without validating "illness" as a bodily disease, much like painkillers help grief-headaches without grief being a lesion. This preserves Szasz's "problems in living" framework while acknowledging empirical relief. You don't need to call it a "cure" to admit it helps.

  Furthermore, your soft spot (3) is actually consistent with (1). Szasz's primary political project was ending involuntary commitment; linking the "myth" claim to the protection of liberty is the most coherent part of your position. You don't need to sacrifice (3) to fix the set; it is the anchor that holds (1) steady while you adjust the surrounding ethics. Keeping (3) is philosophically sound even if the rest wobbles.

  Cheapest fix
  Revise (1) from an ontological claim to an epistemological one. State that mental illnesses are not *currently proven* to be bodily diseases, rather than asserting they *cannot* be. This accommodates (5) (future discovery), validates (2) (meds work on biology we don't yet map), and allows (4) (functional impairment affects responsibility) without requiring you to abandon (3). You lose Szasz's radical certainty but keep your humane intuitions intact. This shift turns your project from defending a myth to critiquing current classification, which is more defensible.
