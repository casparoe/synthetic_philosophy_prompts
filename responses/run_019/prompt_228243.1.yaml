  **1.0 out of 5 stars - Hazardous Logic Flaw - Final State Not Covered Under Warranty**
  **By: AngryConsumer88**
  **Date: October 24, 2023**
  **Verified Purchase**

  I purchased the Thomson™ Model T-1 Supertask Desk Lamp expecting a standard reading light. The marketing materials claimed it was "perfectly defined" and "ideal for completing infinite tasks in finite time." This is false advertising. I have owned this lamp for exactly sixty seconds, and I am currently filing for a refund due to gross negligence in design and logical consistency.

  Upon unboxing, I plugged the unit in. Immediately, the lamp entered what the manual calls "Demonstration Mode." Instead of staying on, the switch began toggling automatically. It was on for thirty seconds, off for fifteen, on for seven-point-five, and so on. I assumed this was a bulb test. It was not. The intervals decreased geometrically. By the time forty-five seconds had passed, the switch was clicking so fast it sounded like a hum. My roommate noted the switch arm was visibly vibrating due to the acceleration required to complete the sequence.

  Here is the defect: At the exactly one-minute mark, when the infinite sequence was theoretically complete, the lamp refused to maintain a binary state. Is it on? Is it off? The manual, specifically Section 9, Paragraph 4, states: "The state of the lamp at t=60s is not determined by the preceding sequence." You cannot sell a light fixture that doesn't know if it's emitting photons! I contacted Customer Support regarding this ambiguity. Their ticket system automatically replied that my query was "ill-posed" and that the instruction booklet is "complete and consistent" despite failing to specify the output state. They claimed the lack of a final state is not a contradiction, just a gap in coverage. That is not how lights work. If I pay for lumens, I expect lumens.

  Furthermore, the build quality is nonexistent. While the product claims to handle an infinite number of switch cycles, the physical mechanism degraded after only a few million flicks. There was smoke. There was the smell of ozone. The warranty explicitly voids coverage for "wear and tear incurred during supertask execution," which renders the primary feature unusable. How am I supposed to test the infinite switching if the switch breaks before the minute is up? It's a catch-22 designed to deny claims.

  The electricity bill is also concerning. Since the frequency of the current fluctuates infinitely within the minute, my meter spun counter-clockwise for a brief period before catching fire. I assume this is related to the indeterminacy of the circuit.

  Desperate for a solution, my roommate Dave tried to hardwire a bypass. He added a separate circuit intended to force the lamp "On" at precisely t=60s. This made everything worse. Now the lamp doesn't just fail to resolve; it actively resists causality. When Dave flipped his override switch, the lamp flickered in a pattern that suggests it knows it shouldn't exist. It's not broken mechanically; it's broken conceptually. The light emits a color that isn't on the spectrum, and it casts shadows even when turned off.

  I asked Support if this was normal. They sent me a PDF titled "Why Your Question Makes No Sense.pdf." I am not interested in metaphysics. I am interested in reading a book without my desk entering a state of logical superposition.

  Do not buy this product. It requires you to accept that a physical object can vanish from reality simply because the instructions stopped writing. I want a full refund plus compensation for the emotional distress of witnessing a paradox unfold in my dorm room. The lamp is currently sitting on my desk. I think it's on. I think it's off. I think it's suing me. Send help.
