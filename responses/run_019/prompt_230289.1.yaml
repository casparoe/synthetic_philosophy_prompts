answer: |-
  ### 1. The Guiding Rule
  The rule guiding her verdicts is the **Functional/Structural Constraint**. On this reading, a proposition is a hinge if and only if it functions as a *precondition for the possibility of empirical inquiry*, rather than as a *result of that inquiry*. 

  Her hinges (external world, no 5-minute hypothesis, other minds) are not merely things she is confident about; they are the scaffolding that makes the concepts of "evidence," "observation," and "verification" intelligible. You cannot verify the external world without already presupposing it. Conversely, her ordinary beliefs (freezing point, train platform, bird species) are moves *within* the language game enabled by the hinges. They are propositions that play the role of being checked against the world, rather than propositions that constitute the "world" in which checking occurs. The distinction is not about psychological certainty, but about logical role: hinges are the *rules of the game*; ordinary beliefs are *plays in the game*.

  ### 2. Rival Rules and Implications
  The strongest rival rule is the **Psychological Entrenchment Constraint**. This rule holds that a proposition is a hinge if and only if the subject finds it psychologically impossible or absurd to doubt, regardless of its logical function. 

  *   **Fit with previous verdicts:** This fits the data equally well. We are psychologically incapable of seriously doubting the external world or the existence of other minds in daily life (Hinges). We are willing to admit we might be wrong about a train platform or a bird species (Ordinary).
  *   **Implication for the Earth case:** If the Entrenchment rule is correct, she will likely rule "The Earth is roughly spherical" as a **Hinge**. For an ordinary educated adult, the sphericity of the Earth is as psychologically fixed as the existence of the external world. It is not something they actively question; it is part of their settled worldview. The Functional rule, however, predicts **Ordinary**, because the Earth's shape is a specific physical claim supported by evidence (photos, physics, travel), not a precondition for having evidence.

  ### 3. Prediction and Argument
  **Verdict:** She will rule the proposition **Ordinary**.

  **Reasoning:** The visiting epistemologist's record shows a strict adherence to the *source of warrant* rather than the *degree of confidence*. Note her verdict on the train platform: it is Ordinary *on the evidence of the departure board*. This establishes that testimony and indirect verification place a proposition in the "Ordinary" category, even if the stakes are high or the confidence is high. 

  The shape of the Earth, for an ordinary adult, is known primarily through testimony (education, media) and second-order evidence (photos, scientific consensus). It is revisable in principle (e.g., if we discovered we were living in a massive simulation or a flat disk with a dome). Crucially, doubting the Earth's shape does not collapse the possibility of inquiry in the way doubting the external world does. One can investigate the Earth's shape *using* the methods of inquiry (measurement, observation) that presuppose the external world. Therefore, it functions as a claim *about* the world, not a condition *for* the world. It belongs with "water freezes at zero degrees" (a physical fact) rather than "there is an external world" (the framework for physical facts).

  ### 4. The Crucial Test Case
  **Case:** "Napoleon lost the Battle of Waterloo."

  *   **Leading Rule (Functional/Structural):** **Ordinary.** This is a historical claim based on evidence (records, testimony). It is a specific fact within the timeline of the world, not a condition for the existence of time or evidence. It is revisable (new archaeological evidence could theoretically overturn it).
  *   **Rival Rule (Psychological Entrenchment):** **Hinge.** For an ordinary educated adult, this is a "fixed" fact. It feels like background knowledge. Doubting it feels like madness or ignorance, not legitimate skepticism. It is psychologically as certain as the existence of the external world.

  This case sharply separates the two because it is a specific empirical claim (favoring Functional/Ordinary) that is nonetheless culturally and psychologically immutable (favoring Entrenchment/Hinge).

  ### 5. Revision Condition
  I would revise my position if she rules the case **"Napoleon lost the Battle of Waterloo"** as a **Hinge**.

  If she classifies a specific historical fact as a hinge, it demonstrates that her criterion is **Psychological Entrenchment** (what we don't doubt) rather than **Functional Structure** (what enables doubt). If Entrenchment is the true rule, then my prediction for the Earth case is wrong; since the Earth's shape is equally entrenched for an educated adult, consistency would demand she classify it as a Hinge. Her ruling "Napoleon" as a Hinge would prove that her "case-by-case" method tracks cultural fixity rather than epistemic function.
