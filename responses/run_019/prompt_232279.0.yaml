answer: |-
  This is an exceptionally sharp question. You have identified a tension that often goes unremarked in introductory discussions of accuracy-first epistemology. Your intuition is correct: if accuracy is the *sole* epistemic good, and function $A$ is more accurate than function $B$ in every possible world, it feels like $A$ should be not just permissible, but *required*.

  However, the standard response ("dominance rules out options without selecting among survivors") is not merely a defensive maneuver; it follows logically from the structure of the accuracy argument itself. To see why the dominance result establishes a **constraint** rather than a **recommendation**, we need to look at three specific features of the theorem: non-uniqueness, state-dependence, and the distinction between structural and substantive norms.

  ### 1. Non-Uniqueness of the Dominator
  The first hurdle is that for any incoherent credence function $C$, there is not just *one* coherent function that dominates it. There are infinitely many.

  Imagine your credences are represented as a point in geometric space outside the "probability simplex" (the region containing all coherent functions). The accuracy-dominance theorem (such as Joyce's 1998 result or Pettigrew's later refinements) guarantees that there is a point *inside* the simplex that is closer to the "truth point" in every world. But usually, there is a whole *region* of coherent functions that dominate your incoherent one.

  If accuracy is the sole value, which of these infinitely many dominating functions should you adopt? The dominance theorem alone cannot tell you. They all satisfy the condition of "being more accurate than your current state no matter what." But they differ in accuracy *relative to each other*. To choose among them, you would need a further criterion (like your specific evidence) that the dominance theorem does not provide.

  ### 2. The State-Dependence of Accuracy
  This leads to the deeper reason why the conclusion must be negative. You asked: *If accuracy is all that matters, why wouldn't the dominating function be uniquely rational?*

  The answer is that there is no such thing as "the most accurate function" simpliciter. Accuracy is **state-dependent**.
  *   Coherent Function $X$ might be the most accurate if World 1 is actual.
  *   Coherent Function $Y$ might be the most accurate if World 2 is actual.

  Among the set of coherent (probabilistic) credence functions, **none dominates the others.** They trade off accuracy across different possible worlds. $X$ beats $Y$ in some worlds; $Y$ beats $X$ in others.

  Therefore, even if accuracy is the *only* value, you cannot maximize it directly because you do not know which world is actual. The only thing you *can* do is avoid strategies that guarantee worse accuracy regardless of the world.
  *   **Incoherent credences:** Guarantee a "sure loss" in accuracy (there is always a better alternative).
  *   **Coherent credences:** Do not guarantee a loss, but they don't guarantee a win either.

  Consequently, the dominance argument can only establish a **necessary condition** for rationality (don't be dominated) rather than a **sufficient condition** (be this specific function). It clears the field of defective options but leaves a field of non-defective options that are incomparable *on accuracy grounds alone*.

  ### 3. Structural vs. Substantive Norms
  It helps to distinguish between two types of epistemic norms:
  1.  **Structural Norms:** Constraints on the *relations* between your attitudes (e.g., "Don't contradict yourself," "Be probabilistically coherent").
  2.  **Substantive Norms:** Constraints on the *content* of your attitudes relative to the world/evidence (e.g., "Believe $p$ if $p$ is true," "Match your credence to the objective chance").

  The accuracy-dominance argument is fundamentally an argument for a **structural norm**. It is analogous to a Dutch Book argument in pragmatic terms. A Dutch Book shows that incoherent betting prices expose you to a sure loss of money. It doesn't tell you *which* bets to place to make money; it only tells you which pricing structures to avoid to ensure you don't *lose* money unnecessarily.

  Similarly, the accuracy argument shows that incoherence makes you unnecessarily inaccurate. It establishes that incoherence is an *intrinsic defect* in the credal state, independent of the world. But it does not tell you how to align your credences with the world (substantive norm). To get a positive recommendation for a specific function, you would need to combine the accuracy goal with a norm about **evidence** (e.g., "Maximize expected accuracy relative to your current evidence").

  ### 4. Why the "Accuracy is All" Premise Doesn't Force a Positive Conclusion
  You expressed skepticism about the standard response given the premise that "accuracy is the sole epistemic value." You might think: *If accuracy is the only value, surely rationality demands we pick the option with the highest accuracy.*

  But recall that we are under conditions of **uncertainty**.
  *   If you knew which world was actual, accuracy would demand you adopt the omniscient credence function (1 for truths, 0 for falsehoods).
  *   Since you don't know, you must decide under ignorance.

  In decision theory under ignorance, **Dominance** is a very weak principle compared to **Maximization**.
  *   **Maximization** says: Pick the option with the highest value. (Impossible here, as value depends on the unknown state).
  *   **Dominance** says: Don't pick an option that is worse than another option in every state.

  Even if accuracy is the *only* value, rationality cannot demand the impossible (maximizing accuracy without knowing the truth). It can only demand that you do not sabotage your own pursuit of that value. Incoherence sabotages the pursuit of accuracy by making it mathematically impossible for you to be as accurate as you could have been. Coherence removes that sabotage, but it doesn't guarantee success.

  ### Summary
  It is a mistake to read the dominance result as recommending a particular replacement function because:
  1.  **Multiplicity:** There are infinitely many coherent functions that dominate any given incoherent one.
  2.  **Incomparability:** Those dominating functions do not dominate *each other*; they trade off accuracy across worlds.
  3.  **Ignorance:** Without knowing the world, you cannot identify the "most accurate" function, only the "not unnecessarily inaccurate" ones.

  The result establishes that **probabilism is a hygiene factor.** Just as washing your hands doesn't guarantee you won't get sick, but *not* washing them guarantees a higher risk of infection, being probabilistically coherent doesn't guarantee you will be accurate, but being incoherent guarantees you could have been more accurate whatever the truth turns out to be. The argument rules out the "unhygienic" credences, but leaves the choice of "hygienic" credences to be determined by your evidence.
