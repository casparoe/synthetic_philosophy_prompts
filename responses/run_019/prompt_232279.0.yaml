      *   *Clarify the Theorem:* Reiterate that the theorem shows incoherent functions are *defective*, not that one specific coherent function is *perfect*.
      *   *Key Point 1: Non-Uniqueness of Dominators.* Explain that for any incoherent $C$, there is a *set* of coherent functions that dominate it. Which one should you pick? The accuracy argument alone doesn't say.
      *   *Key Point 2: Trade-offs among Coherent Functions.* Explain that once you are in the "coherent zone," accuracy considerations alone don't rank them. $C_a$ might be more accurate in World 1, $C_b$ in World 2. Without knowing the world (or having priors over worlds), you can't choose based on accuracy alone.
      *   *Key Point 3: The Role of Evidence.* This is crucial. Accuracy is the *veritistic* goal. But epistemology also requires responsiveness to evidence. The dominance argument establishes a *constraint* (probabilism), not a *complete guide* (calibration to evidence). If it recommended a specific function, it would violate the idea that different evidence warrants different credences.
      *   *Key Point 4: Negative vs. Positive Norms.* Compare to logic. Logic tells you not to contradict yourself (Modus Ponens), but it doesn't tell you what axioms to start with. Similarly, probabilism is a consistency norm.
