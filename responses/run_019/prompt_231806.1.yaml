      *   *Decision:* The requirement that does the most work is **"No Incentive to Manipulate the Operator's Decision to Shut Down."** This kills simple obedience (which manipulates via persuasion), simple indifference (which often fails to prevent accidental shutdown or fails to prevent subagents from manipulating), and simple uncertainty (which incentivizes staying on to learn).
