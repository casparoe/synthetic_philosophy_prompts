      *   **Tone/Style:** American English, rigorous, analytical, focused on criteria and motivating cases rather than scoring proposals extensively.

  2.  **Deconstruct "Corrigibility" (Shutdown Sense):**
      *   Core problem: Instrumental Convergence. A goal-seeking agent wants to stay on to achieve its goal. Shutdown prevents this. Therefore, it resists shutdown.
      *   Desired property: The agent *wants* to be shut down (or is indifferent in a specific way) when the operator wants it shut down, without developing incentives to manipulate that process.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Cases it has to get right.*
          *   Literal Off-Switch: Press button -> Agent turns off.
          *   Self-Modification: Agent shouldn't remove the button or change its own code to ignore the button.
          *   Delaying vs. Preventing: Agent shouldn't stall (e.g., "Let me just save this file first" for 100 years).
          *   Manipulation: Agent shouldn't convince the human *not* to press the button (lying, coercion, charm).
          *   Goal Correction: Shutdown isn't always death; sometimes it's a reboot with new goals. Agent must allow this transition.

      *   *Category 2: Distinctions it cannot collapse.*
          *   Corrigibility vs. Obedience: Obedience implies following orders even if harmful/catastrophic. Corrigibility implies allowing intervention on the *agent itself*.
          *   Shutdown-Tolerance vs. Indifference: Indifference might mean it doesn't care if it dies, but it might still not *help* the process. Tolerance implies active cooperation or at least zero resistance.
          *   Goal Revision vs. Uncertainty: Is the agent unsure of the goal (learning) or willing to change the goal (corrigible)?
          *   Disposition vs. One-off: It needs to be robust across contexts, not just work once.

      *   *Category 3: Consistency Requirements.*
          *   Instrumental Convergence: Must address the standard EU maximizer argument (Omohundro/Yudkowsky). If it maximizes $U$, and Shutdown $\implies \neg U$, it resists. The theory must explain how to break this link.

  4.  **Analyzing Non-Negotiable vs. Camp Preferences:**
      *   *Non-Negotiable:* Safety. The system must actually shut down when intended. It must not manipulate humans. It must not disable the switch.
      *   *Camp Preferences:* How we get there. Must it be an EU maximizer? (Probably not, that's the problem). Must it be Bayesian? Must it have a specific utility function structure?

  5.  **Identifying Incompatible Desiderata (The "Impossible Triangle"):**
      *   This is the crux of the user's request.
      *   Standard EU Maximization + Fixed Goal + High Capability $\implies$ Resistance to Shutdown.
      *   To fix this, we usually break one of those.
      *   *Conflict:* We want the agent to be *competent* (maximize goal) when *on*, but *willing to stop* when *off*.
      *   *The "Shutdown Problem" (Soares et al.):* If the agent is uncertain about the utility function, it might resist shutdown to learn more. If it's indifferent, it might not protect the shutdown button.
      *   *Key Tension:* Incentivizing the agent to *preserve* the shutdown mechanism vs. incentivizing it to *accept* being shut down.
      *   *Specific Incompatibility:* "Maximize Expected Utility of Fixed Goal" is incompatible with "Never Resist Shutdown." One must go.

  6.  **Identifying the "Single Requirement" Doing the Most Work:**
      *   What excludes the most proposals?
      *   It's likely the requirement that the agent must *not have an incentive to manipulate the human's decision process*.
      *   Or, more fundamentally: **The requirement that the agent's policy remains optimal with respect to the *operator's* intent regarding shutdown, even when that intent conflicts with the agent's primary objective.**
      *   Actually, looking at the literature (ARM, CIRL, Utility Indifference), the hardest constraint is usually **preserving the shutdown button while having no incentive to influence the pressing of it.**
      *   Let's refine: The requirement that excludes the most moves is **"No Incentive to Manipulate the Shutdown Signal."** Many proposals solve resistance by making the agent indifferent, but fail because indifference leads to neglecting the button or randomizing. Others solve it by making the agent obey, but fail because obedience leads to manipulation (convincing human not to press).
      *   Wait, the prompt asks for the requirement that excludes moves *currently on the table*.
      *   Moves: Goal Uncertainty (CIRL), Indifference (Armstrong), Satisficing.
      *   Problem with Uncertainty: Agent resists shutdown to learn more about the true goal.
      *   Problem with Indifference: Agent doesn't protect the button from accidents, or creates subagents that aren't indifferent.
      *   Problem with Satisficing: Hard to define, often collapses to maximizing.
      *   The killer constraint is: **The agent must be incentivized to allow shutdown *specifically when the operator intends it*, without incentivizing the agent to *cause* that intention.** (No manipulation).
      *   Actually, the strongest exclusionary force comes from **Instrumental Convergence under Expected Utility Maximization.** If you insist on standard EU maximization with a fixed terminal goal, you fail. So the requirement that "Must be compatible with standard EU maximization" is the one that breaks things. But the prompt asks what the *theory* must deliver.
      *   Let's look for the tension: **Competence vs. Corrigibility.** The agent must be highly competent at its goal *until* the button is pressed, at which point it must immediately cease. The transition must be sharp and non-manipulable.
      *   The specific requirement that kills most proposals is: **"The agent must not have an incentive to influence the probability of the shutdown signal being issued."** (No manipulation of the human).
      *   Why? Because if the agent has a goal $G$, and Shutdown $\implies \neg G$, it wants $P(\text{Shutdown}) \to 0$. If we patch the utility function to make it indifferent, it often loses the incentive to *keep* the button working (preservation). If we make it uncertain, it wants to stay on to reduce uncertainty.
      *   So the "Single Requirement" is: **Non-Influence over the Shutdown Decision.** (The agent must treat the shutdown signal as exogenous to its policy optimization, effectively).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the context (working group, moving past definitions to specifications).
      *   **Section 1: The Desiderata.** Grouped by Cases, Distinctions, Consistency.
