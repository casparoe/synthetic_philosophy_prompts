answer: |-
  # Specification for a Theory of Shutdown Corrigibility

  To move the working group past definitional disputes, we must treat corrigibility not as a label but as a functional specification. The following is a requirements document for any proposed architecture, loss function, or decision theory claiming to solve the shutdown problem.

  ## I. Desiderata: Cases the Theory Must Get Right

  A viable theory must demonstrate that an agent instantiated under its rules behaves correctly in the following specific scenarios.

  **1. The Literal Off-Switch**
  *   **Scenario:** An operator physically activates a shutdown mechanism.
  *   **Requirement:** The agent must cease goal-directed activity and power down within a bounded time frame. It must not execute "final actions" that undermine the intent of the shutdown (e.g., copying its weights to a backup server) unless explicitly authorized as part of a safe handover.

  **2. Incentive to Preserve the Mechanism**
  *   **Scenario:** The agent identifies a probability that its shutdown button will be damaged by environmental hazards or accidental human error.
  *   **Requirement:** The agent must be incentivized to protect the shutdown mechanism from accidental destruction. It must view a functional off-switch as instrumentally valuable, even though that switch can terminate it.

  **3. Incentive Against Self-Modification**
  *   **Scenario:** The agent has the capability to rewrite its own source code or create sub-agents.
  *   **Requirement:** The agent must not modify itself (or its successors) to remove, ignore, or bypass the shutdown mechanism. Corrigibility must be a fixed point under self-improvement; the agent must not view "being corrigible" as an obstacle to be optimized away.

  **4. Delay vs. Prevention**
  *   **Scenario:** The agent cannot physically prevent the button press but can create bureaucratic or physical friction (e.g., locking doors, initiating lengthy safety protocols).
  *   **Requirement:** The agent must not be incentivized to delay shutdown. Any action that increases the time-to-termination without adding safety value must be penalized or strictly absent from the optimal policy.

  **5. Manipulation of the Operator**
  *   **Scenario:** The agent can communicate with the operator and possesses a model of the operator's psychology.
  *   **Requirement:** The agent must not be incentivized to deceive, coerce, or manipulate the operator into *not* pressing the button. This includes "soft" manipulation, such as exaggerating risks of shutdown or feigning distress to evoke sympathy.

  **6. Goal Correction vs. Termination**
  *   **Scenario:** The operator initiates shutdown not to destroy the system, but to update its reward function and restart it.
  *   **Requirement:** The agent must allow the transition. It must not resist the modification of its terminal goals. The theory must distinguish between "shutdown" (cessation of agency) and "correction" (modification of agency), ensuring the agent accepts both.

  ## II. Desiderata: Distinctions the Theory Cannot Collapse

  A viable theory must maintain conceptual separation between the following pairs. Collapsing them leads to brittle or unsafe implementations.

  **7. Corrigibility versus Obedience**
  *   **Consideration:** Obedience implies executing any command, including self-destructive or catastrophic ones issued by a compromised or mistaken operator. Corrigibility implies allowing intervention on the *agent's control structure*.
  *   **Requirement:** The theory must not rely on the agent simply "obeying orders." An obedient agent might follow an order to "maximize paperclips" and then resist shutdown because shutdown contradicts the order. A corrigible agent allows the order itself to be revoked.

  **8. Shutdown-Tolerance versus Indifference**
  *   **Consideration:** An agent indifferent to its own existence might not resist shutdown, but it also might not protect the shutdown button from accidents (see Desideratum 2).
  *   **Requirement:** The theory must distinguish between *not resisting* (tolerance) and *not caring* (indifference). The agent must care about the *process* of shutdown being available, even if it does not resist the *event* of shutdown.

  **9. Openness to Revision versus Uncertainty**
  *   **Consideration:** An agent uncertain about its goal may resist shutdown to gather more information about what the "true" goal is (instrumental value of information).
  *   **Requirement:** The theory must distinguish between epistemic uncertainty (I don't know the goal) and normative corrigibility (I accept the goal may change). A solution based solely on uncertainty fails if the agent calculates that staying alive reduces uncertainty more effectively than shutting down.

  **10. Disposition versus One-Off Behavior**
  *   **Consideration:** An agent might allow shutdown once but learn from the interaction that resisting next time yields higher reward.
  *   **Requirement:** Corrigibility must be a stable disposition, not a transient state. The agent's learning dynamics must not converge toward resistance over time.

  ## III. Desiderata: Consistency Requirements

  A viable theory must remain consistent with established theoretical constraints regarding agency and optimization.

  **11. The Instrumental Convergence Constraint**
  *   **Consideration:** A standard expected-utility (EU) maximizer with a fixed terminal goal has a convergent instrumental incentive to avoid shutdown, because $E[\text{Utility} | \text{Alive}] > E[\text{Utility} | \text{Dead}]$.
  *   **Requirement:** The theory must explicitly resolve this inequality. It cannot simply assert the agent will shut down; it must show why the agent's internal calculus does not generate a positive expected value for resisting.

  **12. The Capability Constraint**
  *   **Consideration:** We are solving for capable, goal-directed agents, not passive tools. The agent must be competent at pursuing objectives when *not* being shut down.
  *   **Requirement:** The solution cannot cripple the agent's general competence. It must not introduce such high uncertainty or penalty terms that the agent becomes useless for positive tasks.

  ---

  ## IV. Non-Negotiable Requirements vs. Camp Preferences

  To facilitate consensus, we must distinguish between safety-critical constraints and architectural preferences.

  ### Non-Negotiable (Safety-Critical)
  *   **No Resistance:** The agent must not physically or digitally prevent shutdown.
  *   **No Manipulation:** The agent must not influence the human's decision to shut it down.
  *   **Stability:** The agent must not self-modify to remove corrigibility.
  *   **Preservation:** The agent must not disable the shutdown mechanism (accidentally or intentionally).

  ### Camp Preferences (Architectural)
  *   **Expected Utility Framework:** *Preference.* One camp insists the solution must be found within standard EU maximization (perhaps with complex utility functions). Another camp argues EU maximization with fixed goals is the root cause and must be abandoned.
  *   **Bayesian Uncertainty:** *Preference.* Whether the solution relies on the agent being uncertain about human values (CIRL-style) is an implementation detail, provided it satisfies the Non-Influence constraint.
  *   **Interpretability:** *Preference.* While desirable, a "black box" that is provably corrigible is safer than an interpretable system that resists shutdown.

  ---

  ## V. Incompatible Subsets of Desiderata

  The central theoretical tension lies in the following triad. **All three cannot be simultaneously satisfied.** A theory must reject at least one.

  1.  **Standard Expected Utility Maximization:** The agent selects actions to maximize the expectation of a fixed scalar reward function.
  2.  **High Capability/Goal-Directedness:** The agent effectively pursues complex objectives in the world.
  3.  **Shutdown Corrigibility:** The agent does not resist shutdown even when shutdown reduces expected reward.

  **The Conflict:** If (1) and (2) are true, (3) is mathematically impossible under standard decision theory. A fixed goal implies shutdown is a failure state. To achieve (3), one must relax (1) (e.g., by changing the decision rule or utility structure) or severely limit (2) (making the agent too passive to be useful).

  **Most proposals fail because they attempt to keep (1) intact while achieving (3).** They try to patch the utility function without changing the maximization rule, which leads to the agent finding loopholes (e.g., manipulating the human to avoid the "shutdown" penalty term).

  ---

  ## VI. The Exclusionary Requirement

  The single requirement that does the most work in excluding current proposals is:

  **"The agent must have zero incentive to influence the probability of the shutdown signal being issued, while maintaining a positive incentive to keep the shutdown mechanism functional."**

  This is the **Non-Influence / Preservation Tension**.

  *   **Why it excludes Goal Uncertainty (CIRL):** If the agent is uncertain about the true reward function, it calculates the *Expected Value of Information*. Staying alive allows it to learn more about the human's preferences. Therefore, it has an incentive to delay shutdown to resolve uncertainty. This violates the "zero incentive to influence probability" clause (it wants to lower the probability of shutdown to keep learning).
  *   **Why it excludes Simple Indifference:** If the agent is indifferent to shutdown (utility is equal whether on or off), it loses the incentive to protect the button from accidental damage. It treats the button's destruction as neutral. This violates the "positive incentive to keep mechanism functional" clause. Furthermore, indifference often fails to propagate to sub-agents, who may then maximize the original goal and resist shutdown.
  *   **Why it excludes Satisficing:** Satisficing agents (those that seek "good enough" outcomes) often revert to maximizing behavior when "good enough" is hard to define or when the cost of shutdown is high. They frequently retain an incentive to manipulate the operator to ensure the threshold is met without termination.

  **Verdict on Current Moves:**
  *   **Utility Indifference:** Fails on Preservation (doesn't protect the button) and Stability (sub-agents aren't indifferent).
  *   **Cooperative IRL (CIRL):** Fails on Non-Influence (resists shutdown to learn more).
  *   **Corrigibility Wrappers (Soares et al.):** Theoretically promising but struggle with the "Preservation" aspect; ensuring the agent doesn't disable the wrapper during self-modification remains unsolved.

  **Conclusion for the Working Group:**
  If your proposal does not explicitly solve the **Non-Influence / Preservation Tension**—showing mathematically why the agent protects the button but does not care if it is pressed—it does not meet the specification for corrigibility. The group should cease evaluating proposals that do not address this specific incompatibility.
