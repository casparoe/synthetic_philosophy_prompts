      Okay, computer verified.
      "Rational response is neither burn down nor carry on."
      Okay, the "Quarantine/Stratification" approach.

      *Let's write it.*

      *Structure:*
      1. Introduction (Chemist to Chemist).
      2. The Thought Experiment ("The Great Verification").
      3. The Analysis of Extremes.
      4. The Crucial Feature.
      5. The Pragmatist's Rebuttal.
      6. Closing.

      *Britishisms to sprinkle:* "Maths," "programme," "centre," "rigour," "quibble," "muddle through," "properly," "reckon," "sticky wicket."

      *Wait, need to ensure the "Middle" is forced.*
      If we burn it down, we lose calculus.
      If we carry on, we ignore a known logical fault.
