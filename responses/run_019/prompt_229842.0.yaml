      *   *GPCC:* Pattern-oriented. Observable gaps in morphospace/genospace.

  4.  **Drafting the Translation (Iterative Process):**

      *   *GPCC:* This is the easiest. It's literally clustering.
          *   *Translation:* Feature space = morphology/genetics. Metric = phenotypic distance. Algorithm = GMM or DBSCAN. Validation = Gap Statistic/Silhouette.
