answer: |-
  | Defeater | What it hits | Decisiveness | What a committed superrationalist would do | Where it should move me |
  | :--- | :--- | :--- | :--- | :--- |
  | **Approximate Symmetry (The $\epsilon$ Problem)** | The symmetry claim and the step from correlation to action. If payoffs or priors differ by a tiny amount ($\epsilon$), logical correlation degrades continuously, but superrational logic is often binary (identical or not). | **Serious.** The view becomes silent or unstable exactly where real life lives (near-symmetry), suggesting it is a mathematical singularity rather than a robust normative guide. | **Add a condition.** Argue for a "robustness" clause: if correlation is high enough ($>1-\delta$), cooperate. But this requires a new metric for "degree of identity" the view currently lacks. | **Narrow its scope.** Accept it applies only to idealized logical twins, not humans, unless a theory of "approximate logical correlation" is developed. |
  | **The Collapse Charge (Redundancy)** | The claim that this is a distinct standard of *rationality*. It risks collapsing into Rule-Utilitarianism, Kant's Categorical Imperative, or precommitment to a joint plan. | **Serious.** If superrationality is just morality masquerading as decision theory, it loses its claim to describe *instrumental rationality* for agents who don't share moral goals. | **Reinterpret it.** Concede it bridges rationality and morality (as Hofstadter hinted) but insist it's still a *logical* requirement for identical algorithms, distinct from moral duty. | **Hold firm, but rename.** Accept it as a hybrid normative standard, not pure decision theory. Acknowledge it doesn't bind agents who reject the "moral" premise of caring about the twin's outcome. |
  | **The Normative Gap (Correlation $\neq$ Control)** | The step from correlation to what I should do. Even if my choice is evidence of yours, I cannot *cause* yours. Why maximize expected utility based on correlations I cannot influence? | **Fatal** (for Causal Decision Theorists) / **Serious** (for Evidential). It inherits the "Smoking Lesion" vulnerability of Evidential Decision Theory: acting on news rather than leverage. | **Dismiss it.** Insist that in the case of *logical* identity, the distinction between correlation and causation dissolves; choosing *is* setting the output for both. | **Abandon the view** if you accept Causal Decision Theory. **Hold firm** only if you accept Evidential or Functional Decision Theory as the correct baseline. |
  | **Epistemic Opacity (The Identification Problem)** | The decision-procedure-identity claim. I can never empirically verify you are an identical reasoner; I can only infer it from behavior, which is circular. | **Merely awkward.** It limits the view to hypotheticals or closed systems (e.g., AI copies), making it practically inert for human interaction. | **Reinterpret it.** Treat "identical reasoner" as a postulate of the interaction frame: "If we treat each other as identical, we cooperate." | **Narrow its scope.** View it as a conditional strategy ("I will cooperate *if* I model you as superrational") rather than an objective fact about the world. |
  | **Symmetric Coordination Failure** | The action-guiding capacity. In symmetric games with multiple equilibria (e.g., Battle of the Sexes), identical reasoning leads to deadlock or randomization, not a unique solution. | **Merely awkward.** Shows the view is incomplete; it solves PD but fails in other symmetric games without a focal point. | **Add a condition.** Appeal to "salience" or "focal points" (Schelling) to break the symmetry, admitting superrationality alone is insufficient. | **Add a condition.** Accept superrationality requires a supplementary theory of focal points to be fully action-guiding. |

  Is the position insulated because one-shot games between truly identical reasoners almost never occur cleanly, and is that a bug (unfalsifiability) or the right shape for a normative idealization? It is likely a bug of unfalsifiability disguised as idealization; a normative theory that applies only to conditions that cannot empirically obtain risks becoming a tautology about logic rather than a guide for action. The thing that would move me most is a clean case where the identical-reasoning assumption holds and superrationality tells me to do something I can't endorse as rational—specifically, a **Symmetric Battle of the Sexes**. If we are truly identical reasoners with no external focal point, superrationality dictates we randomize identically, leading to a 50% chance of mismatch (Opera/Football vs. Football/Opera) and zero payoff. A rational agent, knowing they are identical, should prefer a deterministic rule (e.g., "always pick Opera") even if arbitrary, to guarantee coordination. Superrationality, by insisting on symmetry without a mechanism to break it, can prescribe a mixed strategy that guarantees a worse outcome than a symmetric but arbitrary deterministic choice, revealing that "symmetry of reasoning" is not sufficient for "rationality of outcome."
