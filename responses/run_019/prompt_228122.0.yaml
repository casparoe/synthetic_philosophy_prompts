  ### 1. Testing Your Tentative Principle

  Your tentative principle states: *"A rule of change may authorize any amendment that leaves a functioning rule of change in place, but none that would extinguish or permanently insulate either itself or the system it serves."*

  This principle is a strong starting point for avoiding the "paradox of omnipotence" (the idea that a sovereign power cannot limit itself without ceasing to be sovereign). However, when tested against your specific verdicts, it fails in two critical areas:

  *   **Failure on Case 3 (The Two-Step Evasion):** Your principle validates Case 3, but your verdict invalidates it. Under your principle, Step 1 (unanimity to majority) leaves a "functioning rule of change in place." Step 2 (restricting library hours) utilizes that functioning rule. Nothing is "extinguished" or "permanently insulated." The principle is purely procedural and forward-looking; it cannot detect the *evasive intent* of using a procedural amendment to bypass a substantive protection in a single transactional sweep. To match your verdict, the principle needs a normative component regarding *good faith* or *substantive integrity*.
  *   **Failure on Case 5 (The Revolutionary Convention):** Your principle implies that validity derives from authorization by a "rule of change." Case 5 explicitly acts *outside* the prescribed procedure. Your principle would technically classify this as invalid (or outside its scope), whereas your verdict is "valid." Your principle lacks a mechanism to account for *extra-legal* sovereignty (the people) that can validate a change even when the legal rule of change is ignored.

  ### 2. Repaired Principles

  To accommodate your intuitions, specifically the invalidity of evasion (Case 3) and the validity of popular sovereignty (Case 5), we need a more nuanced framework. Here are two competing candidates:

  **Candidate A: The Principle of Procedural Integrity (Public Law Focus)**
  > "An amendment is valid only if it complies with the existing rule of change *and* does not use procedural amendments as a pretext to circumvent specific substantive protections entrenched by the same instrument. However, the sovereign people may replace the entire system through extra-legal means."
  > *   **Motivation:** The first clause fixes **Case 3** (blocking evasion). The second clause saves **Case 5** (acknowledging revolution).
  > *   **Weakness:** It creates a dualistic system (Law vs. Revolution) rather than a unified theory of validity.

  **Candidate B: The Principle of Authorized Continuity (Unified Authority Focus)**
  > "Change is valid if authorized by the recognized source of authority for that system. In constituted bodies, authority is limited by procedural and substantive constraints (blocking Case 3). In private agreements, authority is limited only by mutual consent (allowing Case 4). In sovereign foundings, authority is plenary (allowing Case 5)."
  > *   **Motivation:** This explicitly distinguishes the *source* of authority to handle **Case 3** (Constitution), **Case 4** (Contract), and **Case 5** (Sovereign People) without contradiction.
  > *   **Weakness:** It sacrifices the idea of a "single principle" in favor of a typology of legal systems.

  **Recommended Principle:** I recommend **Candidate B**, refined as the **"Principle of Contextual Authority."** It acknowledges that "validity" functions differently across private, public, and constitutional domains.

  ### 3. Predictions for New Cases

  Applying the **Principle of Contextual Authority**:

  *   **New Case A (Sunset Clause):** A statute repeals both itself and its sunset clause.
      *   **Prediction:** **Valid (Self-Termination).** The legislature has the authority to end the statute. The repeal of the sunset clause is moot because the statute ceases to exist simultaneously. There is no "functioning rule" left to violate because the rule itself is gone. This is not a paradox but a terminal act.
  *   **New Case B (Parliament Restricting Successors):** A parliament uses ordinary power to restrict the legislative power of its successors.
      *   **Prediction:** **Invalid (in Sovereign Systems) / Valid (in Constitutional Systems).** Under the Principle of Contextual Authority, we must identify the source. If the parliament is sovereign (e.g., UK model), it cannot bind successors (Case 2 logic applies: it cannot extinguish the future system's power). If the parliament is constituted by a higher constitution that allows entrenchment, it is valid. Absent a higher constitution, the restriction is void.

  ### 4. Honest Assessment: Sacrifices and Tensions

  **Can Cases 3 and 4 be kept together?**
  Yes, but not without a **Public/Private distinction**. It is not "ad hoc" if grounded in the theory of *reliance interests*. In Case 4 (Contract), only the parties are affected, and their conduct demonstrates consent to waive the form. In Case 3 (City Charter), third parties (citizens) rely on the substantive protection (library access). Allowing procedural evasion in public law harms non-consenting third parties. Therefore, a single principle can cover both *if* it includes a clause regarding "third-party reliance" or "public trust."

