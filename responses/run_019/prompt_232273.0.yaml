prompt: |-
  I'm the science editor for a general-interest weekly's health-and-social-science section, and a longtime reader of rationalist blogs and forums. I'm not looking for a primer: I already accept the points that heritability is a sample- and environment-specific partition of variance; that it is not a fixed property of a trait, not a statement about any individual, and not a measure of immutability; and that within-group heritability licenses no inference about between-group differences. What I need is to turn those points into a reusable editorial procedure.

  Every week my desk has to decide, from press releases and abstracts, whether to run stories on new human-genetics findings — twin studies, SNP-based estimates, family studies, polygenic-score results. A decision takes about fifteen minutes, I have final sign-off, and the stakes are real because our readership is general and a bad headline survives any correction. The decision is: run, run with heavy caveats, or kill; and if we run, exactly how the headline and the opening paragraphs may phrase the finding, with the one or two non-negotiable caveats.

  Please write me a fact-checking checklist, in the order the steps should be applied, that a literate but non-specialist colleague could follow. For each step, state the concrete error it catches and the shortest defensible wording for copy. Tell me which distinctions from quantitative genetics must survive the translation and which can safely be dropped for a lay readership. Flag openly which steps require numbers I often won't have and what to do then, and which steps are judgement calls dressed up as procedure.

  Then apply the checklist to three cases:
  1. A large twin study reports that divorce is 40 per cent heritable, and the writer wants to headline it with a formulation about divorce being 'in your genes'.
  2. A SNP-based (GCTA) study reports that years of education is 12 per cent heritable, while older twin estimates put it around 40 per cent; the writer wants to say the difference means 'the environment is 88 per cent of the story'.
  3. A study reports a high heritability for body weight within one affluent country, and the editorial team wants to use it to argue that population-level public-health interventions against obesity can have only limited effects.

  For each case, say what the procedure should conclude, which step does the work, and what the final published wording would be. Make sure at least one of your applications concludes that I should kill a story the desk wants to run, and say why. Finally, state plainly what the procedure cannot guarantee even when a study passes every step.

  I want a committed answer: choose a definite order, definite editorial rules, and definite wording rather than laying out options and leaving me to select. Write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested editorial procedure:

  1.  **Analyze the Request:**
      *   **User:** Science editor for a general-interest weekly (health/social science section). Longtime rationalist reader (familiar with concepts like heritability nuances).
      *   **Goal:** Create a reusable editorial procedure/checklist for deciding whether to run stories on human genetics findings (twin studies, SNP, PGS, etc.).
      *   **Constraints:** Decision time ~15 mins. Audience is general. Stakes are high (bad headlines stick). Needs definite rules, not options. British English.
      *   **Key Concepts to Embed:** Heritability is variance partitioning (sample/environment specific), not fixed, not individual, not immutability, within-group $\neq$ between-group.
      *   **Deliverables:**
          1.  A step-by-step fact-checking checklist (concrete error, shortest defensible wording, distinctions to keep/drop, missing data handling, judgement calls).
          2.  Application to three specific cases (Divorce, Education/SES, Obesity/Public Health).
          3.  At least one case must result in a "Kill" decision.
          4.  Statement on what the procedure *cannot* guarantee.

  2.  **Drafting the Checklist (The "Protocol"):**
      *   *Objective:* Make it actionable for a non-specialist colleague in 15 minutes.
      *   *Structure:* Sequential filters. If a step fails, either kill or mandate specific caveats.
      *   *Step 1: The "Individual" Trap.* Most common error. "Gene for X".
          *   *Error:* Attributing trait % to an individual.
          *   *Fix:* Population variance language.
      *   *Step 2: The "Fixed/Immutable" Trap.* High heritability $\neq$ unchangeable.
          *   *Error:* Implying intervention is futile.
          *   *Fix:* Explicit mention of environmental malleability.
      *   *Step 3: The "Between-Group" Trap.* Using within-group $h^2$ to explain group differences.
          *   *Error:* Genetic determinism of group gaps.
          *   *Fix:* Ban this inference entirely.
      *   *Step 4: The "Missing Heritability/Method" Trap.* Twin vs. SNP.
          *   *Error:* Treating $h^2_{SNP}$ as total $h^2$ or vice versa without context.
          *   *Fix:* Specify method (twin vs. DNA) and note "captured variance".
      *   *Step 5: The "Context" Trap.* Heritability is environment-specific.
          *   *Error:* Generalising from one population to another.
          *   *Fix:* Specify the sample (e.g., "in this cohort").
      *   *Distinctions to Keep:* Population vs. Individual, Variance vs. Mean, Method (Twin vs. SNP).
      *   *Distinctions to Drop:* Additive vs. Non-additive variance, specific statistical models (ACE vs. ADE), precise confidence intervals (unless huge).
      *   *Missing Data:* If sample demographics aren't clear, assume limited generalisability.
      *   *Judgement Calls:* Is the social harm of misinterpretation too high? (e.g., race/IQ).

  3.  **Refining the Checklist (Iterative Polish):**
      *   Make the wording punchy. Use "Must/Must Not".
      *   Ensure British English (generalise, programme, etc.).
      *   Define the "Non-Negotiable Caveats" clearly.

  4.  **Applying to Case 1: Divorce (40% Heritable):**
      *   *Headline:* "Divorce is in your genes".
      *   *Analysis:* Violates Step 1 (Individual) and Step 2 (Immutability). Divorce is a social event, not a biological trait. High risk of misinterpretation.
      *   *Decision:* Run with heavy caveats OR Kill. Given the prompt asks for *one* kill, and this is socially sensitive + conceptually tricky (divorce isn't a phenotype like height), I should consider killing it or heavily modifying. Let's make it a "Run with heavy caveats" but force a headline change, or better, make it the "Kill" if the angle is purely deterministic. Actually, the prompt asks for *at least one* kill. Case 3 (Obesity/Public Health) is a stronger candidate for a "Kill" because it directly argues against policy intervention based on $h^2$, which is a logical fallacy (Step 2). Let's make Case 3 the Kill. Case 1 can be "Run with heavy caveats".
      *   *Correction:* Wait, Case 1 headline "in your genes" is egregious. Let's force a headline change.
      *   *Step:* Step 1 (Individual) & Step 5 (Context).
      *   *Wording:* "Genetic factors account for variation in divorce risk..."

  5.  **Applying to Case 2: Education (SNP 12% vs Twin 40%):**
      *   *Claim:* "Environment is 88% of the story".
      *   *Analysis:* Violates Step 4 (Method). SNP heritability is *captured* heritability, not total. The gap isn't necessarily "environment", it's "uncaptured genetics" (rare variants, etc.). Also violates Step 2 (Immutability) if implying environment is easy to fix.
      *   *Decision:* Run with heavy caveats.
      *   *Step:* Step 4 (Method distinction).
      *   *Wording:* Must clarify that 12% is *common variant* heritability, not total genetic influence.

  6.  **Applying to Case 3: Obesity (High $h^2$ vs Public Health):**
      *   *Claim:* High $h^2$ means interventions have limited effects.
      *   *Analysis:* Violates Step 2 (Immutability). This is the classic "heritability $\neq$ unchangeability" error. High $h^2$ in an affluent country says nothing about the effect of changing the environment (e.g., sugar tax).
      *   *Decision:* **Kill**. This is dangerous policy misinformation.
      *   *Step:* Step 2 (Immutability/Intervention).
      *   *Reasoning:* Heritability describes current variance, not response to environmental shift.

  7.  **Final Review of the Output:**
      *   *Tone:* Professional, directive, editorial.
      *   *Language:* British English.
      *   *Checklist:* Clear steps, errors, wording.
      *   *Cases:* Applied strictly.
      *   *Limitations:* Acknowledge that correct stats don't equal good journalism or ethical safety.

  8.  **Self-Correction/Nuance Check:**
      *   *Did I drop enough technical detail?* Yes, keeping ACE models out is right.
      *   *Is the "Kill" justified?* Yes, arguing against public health interventions based on $h^2$ is scientifically invalid and socially harmful.
      *   *Is the wording defensible?* Yes, focusing on "variation in the sample" is the gold standard.
      *   *Missing Numbers:* What if the press release doesn't give SE or N? The checklist needs a step for "Transparency". If N is small, kill or downplay.
      *   *Judgement Call:* Explicitly flag the "Social Harm" step.

  9.  **Final Polish:** Ensure the distinction between "Run", "Run with Caveats", and "Kill" is clear in the cases. Ensure the "Non-Negotiable Caveats" are listed in the checklist section. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "don't do it" but give the *exact wording* they must use.
  *   *Case 1:* Change headline to "Genetic variation linked to divorce risk".
  *   *Case 2:* Correct the 88% claim to "unexplained by common variants".
  *   *Case 3:* Kill.

  *Wait, one more check on Case 1:* Divorce is a binary social outcome. Heritability of divorce is notoriously noisy and culturally specific. Is it worth running at all? For the sake of the exercise, I will allow it *if* the wording is fixed, to show the "Run with Caveats" path, while Case 3 takes the "Kill" path.

  *Wait, check the prompt again:* "Make sure at least one of your applications concludes that I should kill a story the desk wants to run". Okay, Case 3 is the best candidate for this.

  *Final check on British English:* "Generalise", "Programme", "Centre", "Modelling".

  *Final check on "Missing Numbers":* The checklist needs a specific step for "Sample Size and Precision". If $N$ isn't there, assume low precision.

  *Final check on "Judgement Calls":* Explicitly label the step regarding social sensitivity as a judgement call.

