answer: |-
  # Editorial Protocol: Human Genetics & Heritability Stories

  **To:** Health and Social Science Desk
  **From:** Science Editor
  **Subject:** Mandatory Checklist for Heritability Claims
  **Time Allocation:** 15 Minutes per Decision

  This protocol is binding. It is designed to prevent category errors regarding heritability ($h^2$) that mislead readers and damage credibility. If a story cannot pass Step 1, it is killed immediately. If it passes Step 1 but fails subsequent steps, it may proceed only with the mandated copy changes.

  ## The Checklist

  Apply these steps in order. Do not skip.

  ### Step 1: The Individual Inference Test
  *   **The Error:** Attributing a percentage of a trait to a specific person (e.g., "40% of *your* risk is genetic").
  *   **The Rule:** Heritability applies *only* to variance within a specific population at a specific time.
  *   **Action:** Scan headline and lead paragraph.
  *   **Mandatory Wording:** Replace "genes cause X" or "X is in your genes" with **"Genetic differences account for X% of the *variation* in [trait] within this group."**
  *   **Missing Data:** If the population sample is not defined in the abstract/press release, assume the finding is not generalisable. Add "in the study cohort" to the headline.

  ### Step 2: The Immutability Test
  *   **The Error:** Equating high heritability with unchangeability (e.g., "Because obesity is heritable, dieting won't work").
  *   **The Rule:** Heritability describes current variance, not response to environmental change. Phenylketonuria is 100% heritable but 100% treatable by diet.
  *   **Action:** Check if the text implies interventions are futile.
  *   **Mandatory Wording:** If the story discusses policy or treatment, you must add: **"High heritability does not mean the trait cannot be changed by environmental intervention."**
  *   **Judgement Call:** If the primary angle of the pitch is that intervention is pointless *because* of heritability, **KILL THE STORY.**

  ### Step 3: The Between-Group Test
  *   **The Error:** Using within-group heritability to explain differences *between* groups (e.g., using UK heritability data to explain income gaps between regions or ethnicities).
  *   **The Rule:** Within-group $h^2$ licenses zero inference about between-group means.
  *   **Action:** Scan for comparisons of groups (countries, classes, ethnicities).
  *   **Mandatory Wording:** **"These figures explain differences between individuals within the sample, not differences between groups or populations."**
  *   **Missing Data:** If the study sample is homogenous (e.g., white British twins) but the copy implies universal application, restrict the scope in the first paragraph.

  ### Step 4: The Method Distinction (Twin vs. SNP)
  *   **The Error:** Treating SNP-based estimates (GCTA/GWAS) as equivalent to Twin-Study estimates.
  *   **The Rule:** SNP heritability is usually a lower bound (capturing common variants); Twin heritability captures additive genetic variance (including rare variants). They are not directly subtractable to find "environment".
  *   **Action:** Identify the method.
  *   **Mandatory Wording:**
      *   For Twin Studies: **"Estimates based on familial resemblance."**
      *   For SNP/GCTA: **"Estimates based on measured common DNA variants."**
      *   **Never** write: "The remaining % is environment." Write: **"The remaining variation is unexplained by this model."**

  ### Step 5: The Social Harm Assessment (Judgement Call)
  *   **The Error:** Publishing scientifically accurate data that will inevitably be weaponised to justify prejudice, despite caveats.
  *   **The Rule:** Some topics carry higher reputational and social risk.
  *   **Action:** Assess the topic (e.g., intelligence, criminality, ethnicity).
  *   **Decision:** If the potential for misuse outweighs the scientific novelty, **KILL THE STORY**, even if statistically sound.
  *   **Note:** This is an editorial judgement, not a statistical one. Document the reason for rejection in the kill log.

  ---

  ## Distinctions: Keep vs. Drop

  **Must Survive Translation:**
  1.  **Population vs. Individual:** The variance partition belongs to the group, not the person.
  2.  **Variance vs. Mean:** Heritability explains why people differ, not the average level of the trait.
  3.  **Methodology:** Twin (familial) vs. DNA (molecular) must be distinguished.

  **Safe to Drop:**
  1.  **Additive vs. Non-Additive:** Do not burden copy with dominance or epistasis unless it is the specific finding.
  2.  **Confidence Intervals:** Unless the interval spans zero or is massive, report the point estimate but use "approximately" or "around".
  3.  **ACE Model Specifics:** Readers do not need to know about Shared (C) vs. Non-Shared (E) environment unless the story is specifically about parenting.

  ---

  ## Application to Cases

  ### Case 1: Divorce (Twin Study, 40% Heritable)
  *   **Pitch:** Headline: "Divorce is 'in your genes'".
  *   **Procedure Conclusion:** **RUN WITH HEAVY CAVEATS.**
  *   **Failing Step:** **Step 1 (Individual Inference)** and **Step 3 (Context).**
  *   **Reasoning:** "In your genes" implies individual determinism. Divorce is a social event contingent on two people and legal frameworks, making population variance highly context-specific.
  *   **Final Published Wording:**
      *   **Headline:** "Genetic factors linked to variation in divorce risk"
      *   **Lead:** "A large twin study suggests that genetic differences account for approximately 40% of the *variation* in divorce risk within the study population. Experts warn this does not mean divorce is predetermined for any individual, as social and legal environments play a critical role."
      *   **Caveat:** Must include Step 1 mandatory wording regarding variation within the group.

  ### Case 2: Education (SNP 12% vs. Twin 40%)
  *   **Pitch:** Claim: "The environment is 88% of the story".
  *   **Procedure Conclusion:** **RUN WITH HEAVY CAVEATS.**
  *   **Failing Step:** **Step 4 (Method Distinction).**
  *   **Reasoning:** The writer is subtracting SNP heritability from 100% to define "environment". This is scientifically false; the gap includes rare genetic variants not captured by SNPs.
  *   **Final Published Wording:**
      *   **Headline:** "DNA variants explain 12% of differences in education years"
      *   **Lead:** "While older twin studies suggested genetic factors accounted for 40% of the variation in education, new DNA-based methods capture only 12%. Researchers caution that the gap represents unmeasured genetic factors, not solely environmental influence."
      *   **Caveat:** Must explicitly forbid the phrase "88% environmental". Use Step 4 mandatory wording: "The remaining variation is unexplained by this model."

  ### Case 3: Obesity (High Heritability vs. Public Health)
  *   **Pitch:** Argument: "High heritability means public-health interventions will have limited effects."
  *   **Procedure Conclusion:** **KILL.**
  *   **Failing Step:** **Step 2 (Immutability Test).**
  *   **Reasoning:** This is a logical fallacy with direct policy consequences. High heritability in an affluent country (where food is abundant) says nothing about the efficacy of a sugar tax or subsidy programme. Publishing this would actively misinform public debate.
  *   **Editorial Note:** Even if the statistical reporting in the study is accurate, the *inference* drawn by the editorial team violates the core principle that heritability is environment-specific. A change in environment (policy) changes the variance structure. To run this would be to publish misinformation under the guise of science.
  *   **Action:** Reject the pitch. If the study itself makes this claim, note in the kill log that the authors' interpretation is invalid for policy guidance.

  ---

  ## Limitations of the Procedure

  Passing this checklist guarantees only that the copy is **statistically defensible**, not that it is **useful** or **ethical**.

  1.  **Causality:** A story can pass Step 1 (variance language) but still imply causality where only correlation exists (e.g., polygenic scores).
  2.  **Reification:** Correct wording can still reify social constructs (like "educational attainment") as biological essences.
  3.  **Reader Reception:** We cannot guarantee readers will absorb the caveats. A headline saying "Genes linked to X" often reads as "Genes cause X" in skimming.
  4.  **Science Quality:** This checklist filters *interpretation*, not *study quality*. A large, well-worded study can still be methodologically flawed (e.g., population stratification).

  **Final Directive:** When in doubt, default to Step 5. It is better to kill a technically correct story than to publish a misleading one.
