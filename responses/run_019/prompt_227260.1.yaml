  7.  **Final Polish:** Check against the user's specific prompt requirements (concrete cases, ranking, committed AH perspective). Ensure the distinction between "sinks it" and "awkward but livable" is clear. (Proceed to generate output based on this structure).

  8.  *(Final check of the "Unfalsifiable" point)*: Is unfalsifiability fatal? In philosophy, theories aren't scientifically falsifiable, but they can be *dialectically* useless. I should frame it as "theoretical vacuity" rather than Popperian falsification.

