  10. *(Final check of "Aversion")*: The case of the "reluctant addict" or "guilty pleasure." I take a pro-attitude (I crave it) but a con-attitude (I judge it bad). AH says the pro-attitude adds welfare. Is that counterintuitive? Some say yes.

