          *   *Circularity:* Discuss the "primitive" defense vs. the "reductive" failure.
          *   *Collapse into Desire Theory:* This is crucial. AH is often called "Attitudinal Hedonism" but looks like "Intrinsic Desire Satisfactionism." The distinction lies in the *object* of the attitude (experience vs. world state).
          *   *Unfalsifiability:* Discuss the risk of making the theory immune to refutation.
      *   *Ranking:*
          1.  Circularity/Primitiveness (The "Explanation" problem).
          2.  Collapse into Desire Satisfactionism (The "Distinctness" problem).
          3.  Unfalsifiability/Immunization (The "Methodological" problem).
