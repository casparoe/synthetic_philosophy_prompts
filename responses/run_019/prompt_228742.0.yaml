answer: |-
  ### Brainstorming Pressure Points

  Before drafting the questions, here are the five specific pressure points where deflationism tends to creak under philosophical scrutiny. These are the areas where your guest may move from confident exposition to defensive maneuvering.

  1.  **The Generalization Problem:** If "is true" is just a device for disquotation (saying *"Snow is white" is true* is just saying *Snow is white*), how do we handle cases where we can't list the sentences? Saying "Everything in the diary is true" seems to require an infinite conjunction if we can't list the entries. Deflationists use quantification into sentence position, but critics argue this is a syntactic trick that doesn't capture the semantic *unity* of the claim.
  2.  **The Normativity of Truth:** We treat truth as a norm—we *ought* to believe what is true, and assertion is governed by a rule to assert only what is true. If truth is just a logical device with no substantive nature, it's hard to see how it can carry this normative weight. Why aim at a "thin" property?
  3.  **Truth in Logic:** Validity is standardly defined as truth-preservation (if premises are true, the conclusion must be true). If truth is merely disquotational, "truth-preservation" risks collapsing into mere syntactic derivation. Deflationists struggle to explain why truth, specifically, is what logic preserves, rather than just assertibility.
  4.  **The Liar Paradox:** Deflationism relies heavily on the T-schema ("P" is true iff P). But the Liar sentence ("This sentence is false") generates a contradiction using that very schema. To avoid inconsistency, deflationists must restrict the schema. But deciding *where* to restrict it often requires a substantive theory of truth or meaning, smuggling back in the metaphysics they tried to avoid.
  5.  **Truth and Representation:** As a novelist, you care about sentences answering to the world. Deflationism denies that truth is a relation of correspondence or representation. The pressure point here is explaining how language hooks onto reality at all without a substantive notion of truth to bridge the gap.

  ***

  ### Interview Sequence

  **1. The Core Intuition**
  **Question:** Let's begin with the heart of your view. You defend the idea that truth is "deflationary." For our audience, many of whom are writers accustomed to wrestling with the weight of a true sentence, could you articulate the core claim? When I say, "It is true that the cat is on the mat," are you saying I haven't added anything to simply saying, "The cat is on the mat"?
  **Follow-up:** You'll likely say the predicate "is true" is redundant there. But if it's redundant in the singular case, why does it exist at all? What work is it doing in our language if it contributes no content?

  **2. Generalizations (The Diary)**
  **Question:** I want to test that redundancy claim against a case where I can't simply repeat the sentence. Suppose I tell you, "Every entry in my grandfather's diary is true." I haven't read the diary; I can't recite the entries. If "is true" adds nothing, how am I making a claim here? Am I not somehow summarizing a relationship between his words and the world?
  **Follow-up:** A standard deflationist reply is that I'm using quantification to stand in for an infinite conjunction of sentences. But do I need to grasp that infinite conjunction to understand my claim? If I don't, doesn't that suggest "truth" is doing more than just letting me restate sentences I haven't even seen?

  **3. Logical Inference**
  **Question:** Let's move from empirical claims to logic. We often say a valid argument is one where the truth of the premises guarantees the truth of the conclusion. If truth is just a logical device for disquotation, what does "truth-preservation" amount to? Are we not just saying the conclusion follows from the premises, rendering the word "truth" otiose in logic as well?
  **Follow-up:** If you argue that truth is essential for stating general laws of logic (like "Every instance of modus ponens preserves truth"), doesn't that require truth to be a genuine property that instances can share? Otherwise, aren't we just talking about syntax?

  **4. The Norm of Assertion**
  **Question:** As a novelist, I feel a moral weight to truth-telling. Philosophers often argue that truth is the "norm of assertion"—we ought to assert only what is true. If truth is metaphysically weightless, a mere device of logic, how can it ground an *obligation*? Can a logical tool tell us what we *should* do?
  **Follow-up:** You might reply that the norm is really about "justification" or "evidence," not truth itself. But isn't there a gap between what is justified and what is true? If we remove truth as the target, don't we lose the idea that we can be justified but still wrong?

  **5. The Aim of Inquiry**
  **Question:** Building on that, we treat truth as the *goal* of inquiry. Scientists and historians aim at truth. If the deflationist is right, and truth isn't a deep property connecting words to the world, what are they aiming at? Is the "aim of truth" just an illusion?
  **Follow-up:** If you say they are aiming at "belief stability" or "utility," doesn't that change the nature of inquiry? It seems to concede that while truth might be deflationary, the *concept* we actually care about in practice is something more substantive.

  **6. Truth in Fiction**
  **Question:** I'd like to ask about my own turf. Consider the sentence: "Anna Karenina had an affair." We want to say that's true *of the novel*. But there is no real Anna Karenina for the sentence to correspond to. How does a deflationist handle truth in fiction without smuggling in a substantive relation between text and imaginary world?
  **Follow-up:** If you say "true in the story" is a different predicate entirely than "true" simpliciter, doesn't that fracture the concept? It suggests "truth" isn't a single, unified logical device, but changes its nature depending on the context, which weakens the deflationary claim.

  **7. The Liar Paradox**
  **Question:** We must address the elephant in the room: the Liar Paradox. The sentence "This sentence is false" seems to break the T-schema ("P" is true iff P), which is the engine of your view. If the schema fails here, is it still the fundamental account of truth?
  **Follow-up:** **[FLAGGED FOR CONCESSION]** To save the theory, you'll likely say we must restrict the T-schema for paradoxical sentences. But doesn't deciding *where* to draw that line require a substantive theory of meaning or truth conditions? It seems you must use the very metaphysics you reject to patch the hole in the logic.

  **8. Representation and the World**
  **Question:** My unease, and perhaps that of many writers, is that deflationism seems to sever the link between language and the world. If truth isn't about correspondence, how do we explain that our sentences are *about* anything at all? How does language hook onto reality?
  **Follow-up:** If you answer that "reference" does the hooking and truth is just a device, aren't you just pushing the substantive problem onto "reference"? Can reference really do all the heavy lifting if truth is doing none of it?

  **9. The Value of Truth**
  **Question:** If truth is this thin, why has it haunted philosophy and literature for millennia? Why does the unreliable narrator disturb us? Is it possible that the deflationary view explains the *logic* of truth but misses its *value*?
  **Follow-up:** If you concede it misses the value, are you admitting that deflationism is only a theory of the *word* "true," and not a theory of the *concept* as we actually live it?

  **10. Closing: The Novelist's Intuition**
  **Question:** Finally, I spend my days trying to make sentences answerable to a world I've invented. If I tell you, "In my book, the sky is green," and you ask if that's true, I feel I'm reporting a fact about my creation. Does your view have room for the intuition that truth is a kind of fidelity, even in fiction?
  **Follow-up:** If you say fidelity is just internal consistency, doesn't that reduce the artistic struggle for truth to a puzzle of coherence? I suspect the "answerability" I feel is substantive. Will you allow me that intuition, even if you deny it metaphysical status?
