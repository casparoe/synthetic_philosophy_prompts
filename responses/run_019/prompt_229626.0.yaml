prompt: |-
  A bunch of us in my group have been fighting for months about whether the stuff our interpretability methods find is real, so I'm making two of the most stubborn people do an adversarial collaboration and write a joint statement. I want you to draft it: the statement that a representational realist about neural networks and a strict instrumentalist could both sign after a good-faith, months-long collaboration on a specific case — a small transformer trained to do modular addition, where a linear probe and a sparse autoencoder (two different ways of hunting for interpretable directions, for anyone not in the weeds on this) both turn up a direction that seems to encode the congruence class / angle of the inputs.

  For calibration, here's the rough shape of the two camps. The realist thinks the network literally has features and that interpretability discovers them: a claim like "this direction encodes the angle" can be true or false in a way that isn't just about what our tools make easy. The instrumentalist thinks features are something we project onto the model; the only facts in the territory are weights, activations, and input-output behavior, and representation-talk is a useful map, not a property of the network itself.

  I want the actual document, not an essay about why its hard. Please include: (1) a numbered list of claims both parties agree on, including claims about the modular arithmetic model, about what has been observed, and about what counts as evidence; (2) a disagreements table with rows for each real disagreement, phrased so each side would accept the wording, plus a column for each side's own way of stating its view; (3) for each row, a crux — a sub-question such that settling it would genuinely move at least one side — and where possible an experiment on the model (or a case) that both sides agree bears on the crux, with each side's prediction recorded in advance. Keep the document in their voices where that helps, and try to say whether the remaining debate is mostly about words or mostly about the world.
