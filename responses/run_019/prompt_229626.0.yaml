answer: |-
  # Joint Statement on the Ontological Status of Interpretable Directions in Modular Arithmetic Transformers

  **Signatories:**  
  **Alex (Representational Realist)**  
  **Jordan (Strict Instrumentalist)**

  **Date:** October 26, 2023  
  **Subject:** Findings from Adversarial Collaboration on Model $M_{mod97}$

  ### Preamble
  Over the past four months, we have conducted an adversarial collaboration focused on a specific case study: a 2-layer attention-only transformer trained on modular addition ($p=97$). Our goal was not to convert one another, but to delineate exactly where our interpretations of the same empirical data diverge. Below is the record of our agreement, our specific disagreements, and the experiments we have designed to test the cruxes of those disagreements.

  ---

  ### 1. Agreed Claims (Common Ground)
  *We both sign the following empirical and methodological claims. Neither party believes these claims entail their preferred ontology, but both accept them as established facts for the purpose of this collaboration.*

  1.  **Model Performance:** Model $M_{mod97}$ achieves >99% accuracy on the validation set for $(a + b) \mod 97$.
  2.  **Geometric Structure:** Both a linear probe trained on the residual stream and a dictionary learning Sparse Autoencoder (SAE) trained on the same activations identify a 2-dimensional subspace in the final residual stream.
  3.  **Correlation:** The angle of the activation vector within this subspace correlates with the congruence class of the input sum $(a + b) \mod 97$ with $R^2 > 0.95$. Specifically, the activations trace a circle as the sum varies from $0$ to $96$.
  4.  **Causal Leverage:** Intervening on this subspace (rotating the activation vector by $\Delta \theta$) shifts the model's output distribution by a corresponding $\Delta \theta$ in the output logits, preserving the circular structure.
  5.  **Robustness:** This structure appears across 5 different random seeds, though the specific basis vectors (orientation in the high-dimensional space) vary randomly between seeds.
  6.  **Evidence Standard:** We agree that "interpretability" claims are strengthened by: (a) causal intervention success, (b) robustness across seeds, and (c) compressibility (describing the weights/activations via the feature is shorter than listing raw weights).
  7.  **No Magic:** We agree that the network is a static file of floating-point numbers. There is no homunculus inside the GPU. Any claim about "representation" must ultimately cash out in terms of weights, activations, or input-output behavior.

  ---

  ### 2. Disagreements, Cruxes, and Proposed Experiments
  *We disagree on the interpretation of the claims above. The following table isolates the specific points of divergence. For each, we identify a "Crux"—a sub-question where a definitive answer would force at least one of us to update our position significantly.*

  | Issue | Shared Phrasing of the Disagreement | Alex (Realist) Stance | Jordan (Instrumentalist) Stance |
  | :--- | :--- | :--- | :--- |
  | **A. Ontology of the Feature** | Does the "circular feature" exist independently of the analysis method used to find it? | **Yes.** The network computed a representation of angle. The probe/SAE *discovered* a structure that was already there, waiting to be found. The statement "this direction encodes angle" is truth-apt. | **No.** The network has weights and activations. The "circular feature" is a *projection* we impose because it compresses the data well. It is a property of the (Model + Analyst) system, not the Model alone. |
  | **B. Basis Independence** | If we rotate the residual stream basis at initialization, does the "feature" rotate with it naturally? | **Yes.** The loss landscape constrains the solution. The feature is a property of the function learned, so it should emerge in any basis that supports that function efficiently. | **No.** The feature is defined relative to the basis we use to look at it. If you rotate the space, the "direction" changes. The feature is indexical to our coordinate system. |
  | **C. Causal Specificity** | Is the identified direction *the* mechanism of computation, or merely a bottleneck through which information flows? | **The Mechanism.** The trigonometric computation happens *in* this subspace. Intervening here breaks the computation because it disrupts the algorithm. | **The Bottleneck.** Information must pass through the residual stream. We found a convenient handle, but the actual computation might be distributed in ways our linear probe cannot distinguish. |

  #### Crux 1: The Rotation Test (Addresses Issue B)
  **Question:** Is the "angle" direction determined by the data/loss (Realist) or by the initialization/optimization path relative to the standard basis (Instrumentalist)?

  **Experiment:**  
  1. Train $M_{mod97}$ as usual.  
  2. Train $M_{rot}$, identical architecture, but apply a fixed, random orthogonal rotation matrix $R$ to the residual stream inputs and inverse-rotate the outputs at every step (effectively training in a rotated coordinate frame).  
  3. Train probes on both to find the "angle" direction.  
  4. Compare the alignment of the discovered directions relative to the *computational graph* vs. the *standard basis*.

  **Predictions:**  
  *   **Alex (Realist):** The feature will be structurally identical in both models. The rotation matrix is irrelevant to the semantic content. The probe will find a direction that is functionally isomorphic, regardless of the coordinate system. The "angle" is invariant to basis change.  
  *   **Jordan (Instrumentalist):** The "direction" is defined by the standard basis weights. In $M_{rot}$, the weights will look different. While we can *find* a probe that works, the claim that the direction is "the same" relies on us mapping the rotation back. Without the map, the feature is not identifiable in the weights alone.

  #### Crux 2: The Adversarial Distractor (Addresses Issue C)
  **Question:** Can we dissociate the "angle" direction from the computational mechanism?

  **Experiment:**  
  1. Train a model on a mixed task: 90% modular addition, 10% a distractor task that requires orthogonal use of the residual stream capacity.  
  2. Attempt to find the "angle" direction using the same SAE/Probe methods.  
  3. Perform causal ablation on the identified direction.

  **Predictions:**  
  *   **Alex (Realist):** The "angle" feature will persist as a distinct, separable direction (perhaps with slightly more noise). Ablating it will specifically kill modular addition performance while leaving the distractor task intact. This proves the feature is a distinct causal unit.  
  *   **Jordan (Instrumentalist):** The "angle" direction will become polysemantic or entangled with the distractor. Ablating it will degrade both tasks or neither cleanly. This proves "features" are just convenient linear approximations of a highly entangled weight matrix, not discrete causal units.

  ---

  ### 3. Assessment: Verbal or Substantive?

  *We conclude this document by assessing the nature of our remaining debate.*

  **Jordan's Assessment:**  
  > "This is 80% verbal, 20% substantive. We agree on all the math. When Alex says 'the feature exists,' I can translate that to 'there exists a linear projection that yields high predictive accuracy and causal leverage.' If we agree on that translation, the fight is over semantics. However, the 20% substantive risk is if Alex believes the feature constrains future engineering in a way my view does not. If 'real features' implies we can swap them like Lego bricks and Jordan's 'projections' implies we must re-tune the whole net, that is a physical disagreement about the world."

  **Alex's Assessment:**  
  > "This is 40% verbal, 60% substantive. The verbal part is the word 'exist.' But the substantive part is about *constraints.* If features are real, they constrain the loss landscape; there are only so many ways to represent 'angle' efficiently. If they are just projections, any pattern is valid if it predicts. My prediction for Crux 1 is that the loss landscape forces the feature into a specific geometry regardless of basis. Jordan's prediction is that the geometry is contingent on our view. That is a claim about the territory, not the map."

  **Joint Conclusion:**  
  We agree that the debate is **mixed**. We share a map (the empirical claims in Section 1), but we disagree on whether the map corresponds to pre-existing landmarks (Realist) or whether the landmarks are created by the act of mapping (Instrumentalist). We commit to running the experiments in Section 2. If Alex is right about Crux 1, Jordan agrees to adopt "realist-adjacent" language for engineering purposes. If Jordan is right about Crux 2, Alex agrees that "feature" should be treated as a probabilistic abstraction rather than a discrete mechanical part.

  **Signed,**  
  *Alex*  
  *Jordan*
