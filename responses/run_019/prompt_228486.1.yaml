answer: |-
  1. The underdetermination argument posits that any finite dataset logically supports multiple grammatical hypotheses, making learning impossible without constraints to narrow the search space.
  2. The empirical claim asserts that children's actual linguistic input is specifically deficient in quantity and quality, lacking the negative evidence needed to rule out incorrect hypotheses.
  3. The nativist conclusion argues that the necessary constraints must be domain-specific linguistic principles, rather than general cognitive learning biases or statistical patterns.
  4. LLM success primarily undermines the empirical claim about input insufficiency, yet it remains neutral on linguistic nativism because the transformer architecture provides domain-general inductive biases.
  5. Underdetermination is indexed to a particular learner because infinite data cannot select the correct hypothesis if the hypothesis space includes unlearnable grammars. Thus, adding data alone fails unless the learner's architecture restricts the space of possible grammars.
