answer: |-
  Based on the five verdicts you provided, your intuitions are remarkably consistent. They do not require overturning any specific case to form a coherent whole, though Case 2 is the pressure point where the principle is most stressed.

  The unifying principle is not simply "respect autonomy" or "protect welfare," but a specific hybrid of the two. I call it **The Principle of Informed Prior Authority under Incapacity**.

  ### The Principle Stated Precisely

  An advance directive (AD) retains moral authority if and only if three conditions are met:

  1.  **Execution Competence:** The agent was fully competent and stable when executing the directive.
  2.  **Epistemic Validity:** The agent's decision was not based on fundamentally false empirical predictions about the nature of the future condition (i.e., they knew what they were getting into).
  3.  **Current Incapacity:** The agent is currently incapable of rational revision regarding that decision.

  **The Switch:** Current competence acts as an on/off switch for the directive.
  *   If the **Present Self is Competent**, they override the Past Self (Cases 4 & 5).
  *   If the **Present Self is Incompetent**, the Past Self rules, *provided* the Past Self was informed (Cases 1, 2, & 3).

  ### How the Principle Maps to Your Cases

  *   **Case 1 (Dementia/Pneumonia):**
      *   *Execution:* Competent at 40.
      *   *Epistemic:* Assumed dementia was a state to be avoided (standard view).
      *   *Current:* Incompetent (advanced dementia).
      *   *Verdict:* **Follow AD.** (Past Authority holds).
  *   **Case 2 (Dementia + Objection):**
      *   *Execution:* Competent.
      *   *Epistemic:* Valid.
      *   *Current:* Incompetent. The objection ("I want to live") is expressed, but because the *Current Incapacity* condition is met, the objection lacks the authority to revoke the AD.
      *   *Verdict:* **Follow AD.** (Your reduced confidence reflects the moral cost of overriding a current expression, even if incompetent).
  *   **Case 3 (Bipolar/Ulysses):**
      *   *Execution:* Competent (stable).
      *   *Epistemic:* Valid (mania is known to distort judgment).
      *   *Current:* Incompetent (mania distorts rational revision).
      *   *Verdict:* **Follow AD.** (The "ill" self cannot override the "well" self).
  *   **Case 4 (Competent Revocation):**
      *   *Execution:* Competent.
      *   *Current:* **Competent.**
      *   *Verdict:* **Ignore AD.** (The *Current Incapacity* condition fails. A competent present self always trumps a past self).
  *   **Case 5 (Paralysis/Adaptation):**
      *   *Execution:* Competent.
      *   *Epistemic:* **Invalid.** The 25-year-old imagined quadriplegia; the older self *experiences* it. The past self operated on false empirical premises (the "imaginative gap").
      *   *Current:* Competent (adapted, values life).
      *   *Verdict:* **Ignore AD.** (Fails on both Epistemic Validity and Current Incapacity).

  ### The Tension: Case 2 vs. Case 4

  You suspected Case 2 and Case 4 pull against each other. In Case 2, a person says "I want to live" and you deny treatment. In Case 4, a person says "I want to live" (by revoking the DNR) and you grant it.

  **You do not need to overturn either verdict.** They are consistent because the distinguishing feature is **Competence**, not the expression of will itself.
  *   In Case 4, the "I want to live" is a competent autonomous act.
  *   In Case 2, the "I want to live" is a symptom of a condition the Past Self deemed unacceptable, uttered by a mind the Past Self deemed incapable of weighing the stakes.

  **However,** if you were forced to choose which verdict is most vulnerable to revision, it is **Case 2**.
  *   *Why:* Case 2 creates the greatest conflict between *Prior Autonomy* (Past Self) and *Current Welfare/Interest* (Present Self). If the demented woman is "visibly content" and actively resisting death, enforcing the AD looks like killing a happy being to satisfy the values of a ghost (the Past Self). Philosophers like Rebecca Dresser argue that once the "critical interests" of the Past Self no longer connect to the "experiential interests" of the Present Self, the AD loses its bite.
  *   *Recommendation:* Keep Case 2 as is, but acknowledge it is the limit of the principle. If the present self's suffering were high, or their objection sustained and lucid within their limited capacity, the principle might tip toward protection of the present self. But for now, your verdict stands consistent with Case 1.

  ### Implication for Active Euthanasia in Dementia

  This is the critical test of your principle. Consider a directive requesting active euthanasia once dementia reaches a specified stage.

  **Applying the Principle:**
  1.  **Execution Competence:** Assumed yes (signed while healthy).
  2.  **Epistemic Validity:** This is the hurdle. Did the 40-year-old know what dementia would be like? (See Case 5). If they imagined "worse than death" but the demented self is content (Case 1), does the directive hold? Your verdict in Case 1 suggests **yes**. You withheld antibiotics from a content demented woman because the *condition* (advanced dementia) triggered the AD, not the *suffering*.
  3.  **Current Incapacity:** Assumed yes (advanced dementia).

  **The Verdict:**
  Logically, your principle implies **the euthanasia directive should be honored.**
  If the Past Self has the authority to refuse life-prolonging treatment (Case 1) based on the *status* of dementia rather than the *experience* of suffering, they logically have the authority to request life-ending treatment based on that same status. To deny this would be to claim the Past Self owns the decision to *let die* but not the decision to *kill*, which introduces a moral distinction external to your autonomy-based principle.

  **The Conflict:**
  This exposes a tension between your principle and the **Act/Omission Distinction**.
  *   In Case 1, you allow nature to take its course (pneumonia).
  *   In Euthanasia, you intervene to cause death.
  *   If your principle is purely about *who decides* (Past vs. Present), the euthanasia request is valid.
  *   If your principle implicitly relies on *not harming* the present self, euthanasia violates it.

  **Conclusion:**
  Your intuitions prioritize the **Integrity of the Life Narrative** (the Past Self's definition of a life worth living) over the **Experiential Welfare of the Present Self** (once incapacity sets in). Therefore, your principle commits you to the view that if a person competently decides that "life with advanced dementia is not a life I want to live," they have the authority to ensure that life ends, even if their demented shadow is content.

  **Warning:** This makes Case 5 the most important safeguard. You must be certain the Past Self was not like the 25-year-old quadriplegic—guessing wrongly about the future. If the Past Self was adequately informed about the reality of dementia, your principle grants them the power of life and death over their future incompetent self.
