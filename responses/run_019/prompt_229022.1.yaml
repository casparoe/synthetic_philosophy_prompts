answer: |-
  You are grappling with the distinction between **positive-sum competition** (which creates value) and **negative-sum competition** (which destroys it), complicated by the fact that both often look identical in the short term (increased effort, lower margins, higher stakes).

  The principle you are looking for is not a single rule, but a diagnostic framework. I propose calling it **The Net Social Utility Test**. It relies on three specific clauses to distinguish a "healthy race" from a "race to the bottom."

  ### The Principle: The Net Social Utility Test

  A competitive spiral is **healthy** if and only if:
  1.  **The Gain is Absolute, Not Purely Positional:** The competition produces a tangible improvement in the *product* or *outcome* for third parties (consumers, spectators, society), not just a reshuffling of rank among competitors.
  2.  **The Costs are Internalized:** The primary costs of the competition (effort, margin, risk) are borne by the willing competitors, not externalized onto unconsenting third parties.
  3.  **The Beneficiaries Prefer the Competition:** The primary beneficiaries of the activity (shoppers, fans, the public) would *not* prefer a binding agreement that reduced the competitive intensity.

  A competitive spiral is a **trap** (destructive) if it fails any of these clauses.

  ---

  ### Reconciling Your Verdicts

  Here is how this principle sorts your examples, and where it challenges your intuitions.

  **1. Supermarkets (Healthy)**
  *   **Absolute Gain:** Yes. Lower prices are an absolute gain for consumers.
  *   **Internalized Costs:** Yes. The cost is reduced margin for the firms, not harm to the public.
  *   **Beneficiary Preference:** Shoppers prefer price wars.
  *   *Verdict:* **Healthy.**

  **2. Spectators / Credentials / Overfishing (Traps)**
  *   **Absolute Gain:** No. These are purely positional. If everyone stands, the view is the same. If everyone has a Master's, the job requirement just resets.
  *   **Internalized Costs:** No. Standing creates discomfort for all; credential inflation wastes societal resources; overfishing destroys the commons.
  *   **Beneficiary Preference:** Everyone prefers the coordinated "seated" or "sustainable" state.
  *   *Verdict:* **Trap.**

  **3. Doping (Trap)**
  *   **Absolute Gain:** Arguably yes (faster times), *but*...
  *   **Internalized Costs:** No. It imposes health costs on athletes via coercion (if you don't dope, you lose) and destroys the "truth" of the sport, which is a public good.
  *   **Beneficiary Preference:** Fans generally prefer clean sport (integrity) over chemically enhanced records.
  *   *Verdict:* **Trap.**

  **4. Elite Athlete Training (The Paradox)**
  *   **Your Premise:** You wrote, *"if every marathoner trained half as much, the races would be just as exciting."*
  *   **The Principle's Verdict:** If that premise is strictly true, **you must surrender your verdict.** If the excitement is purely relative (who wins) and the absolute performance (the time) does not matter to the spectator, then training is structurally identical to standing at a concert. It is wasted effort for positional gain.
  *   **How to Save the Verdict:** You must argue that sport provides an **Absolute Gain**: the inspiration of witnessing the limits of human physiology. We watch the Olympics not just to see who beats whom, but to see what a human *can do*. If training pushes that boundary, it creates value for the spectator that a "slower" race would not.
  *   *Revised Verdict:* **Healthy**, *but only because* we value absolute human progress, not just relative drama.

  **5. Tax Competition (Unsettled)**
  *   **The Principle's Verdict:** This remains unsettled because Clause 1 is debated.
      *   *View A (Healthy):* The absolute gain is "discipline on bloated government," benefiting citizens via efficiency.
      *   *View B (Trap):* The gain is purely positional (attracting existing capital), and the cost is externalized (underfunded public goods).
  *   *Advice:* Keep this unsettled. The principle correctly identifies that your disagreement stems from whether you view lower taxes as an absolute efficiency gain or a positional race for mobile capital.

  ---

  ### Application to AI Laboratories

  Now, apply the **Net Social Utility Test** to the AI race.

  **1. Is the Gain Absolute or Positional?**
  *   **Mixed.** Market share is positional (zero-sum). However, AI *capability* is absolute (better diagnostics, science, productivity).
  *   *Diagnosis:* This looks like **Training**, not Standing. If the race produces smarter systems, society gains absolute value.

  **2. Are the Costs Internalized?**
  *   **No.** This is the critical failure point. The labs bear the cost of safety testing (margin/speed), but the cost of *failure* (bias, misinformation, existential risk, loss of control) is externalized onto the public.
  *   *Diagnosis:* This looks like **Overfishing** or **Doping**. The competitors privatize the gains (capability/market share) and socialize the risks (safety).

  **3. Do Beneficiaries Prefer the Competition?**
  *   **No.** The public (beneficiaries) likely prefers safe AI over *fast* AI. If a binding agreement slowed deployment to ensure safety, the public would likely accept a delay in features to avoid catastrophic risk.
  *   *Diagnosis:* This looks like **Doping**. The "fans" (public) want the benefit (capability) without the integrity/safety violation.

  ### The Column's Conclusion

  Your column should argue that the AI race is currently structured as a **Doping Spiral**, not a **Training Spiral**.

  *   It resembles **Training** in that it produces absolute capability gains.
  *   It resembles **Doping** in that the competitive pressure forces participants to cut corners on safety (health/integrity) to avoid unilateral defeat, externalizing the risk onto the public.

  **The Verdict:** The AI race is a **trap** *unless* the safety costs can be internalized. If labs can be forced (via regulation or binding agreements) to treat safety as a non-negotiable cost of entry—much like anti-doping agencies treat blood tests—then the race can become healthy. Without that, it is a race to the bottom where the "winner" is simply the one most willing to gamble with public safety.

  **The Surrender:** To make this argument stick, you must explicitly challenge your own premise about the marathoners. You must state: *"We forgive the athletes their grueling training only because we believe it expands the horizon of human potential. If AI labs expand capability without securing safety, they are not expanding potential; they are merely doping the system."*
