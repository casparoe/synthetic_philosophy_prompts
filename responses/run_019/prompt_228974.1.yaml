answer: |-
  ### 1. Mapping the Case

  To analyze MCAS as a case of automated intervention, we must distribute agency across the socio-technical system. The "assistant" (MCAS) is the mechanism, but the moral agents are the humans and institutions behind it.

  *   **Designers/Engineers:**
      *   *Options:* Use single vs. dual sensor input; make MCAS salient vs. hidden in training; limit trim authority vs. allow repeated activation.
      *   *Information:* Knowledge of sensor failure rates; knowledge of pilot reaction times; certification requirements.
      *   *Intervention:* **Architectural Override.** They embedded a rule that physically moves the aircraft without explicit pilot command.
  *   **Boeing Management:**
      *   *Options:* Disclose MCAS to airlines (requiring simulator training) vs. classify as existing system update (no training).
      *   *Information:* Cost implications of training; competitive pressure against Airbus.
      *   *Intervention:* **Informational Concealment.** Decided to keep the system's existence and logic out of pilot manuals to reduce friction/cost.
  *   **Regulators (FAA):**
      *   *Options:* Independent verification of hazard classification vs. delegation to manufacturer.
      *   *Information:* Reliance on Boeing's safety analysis.
      *   *Intervention:* **Regulatory Endorsement.** Validated the assumption that pilots could counteract the system.
  *   **Pilots (Operators):**
      *   *Options:* Follow standard stall procedures vs. identify runaway trim; fight the yoke vs. use cutout switches.
      *   *Information:* Cockpit indications (often conflicting); physical sensation of dive; lack of specific MCAS knowledge.
      *   *Intervention:* **Attempted Counter-Override.** Manual trimming and switching off the system, often too late or too difficult under stress.
  *   **Passengers:**
      *   *Options:* None (non-consenting third parties).
      *   *Information:* None.
      *   *Intervention:* **Beneficiaries/Victims.** The ultimate stakes of the intervention.

  ### 2. Paternalism toward Whom?

  Standard philosophical accounts of paternalism involve an agent interfering with a subject's liberty for the subject's own good. MCAS complicates this dyad.

  *   **User-Directed Paternalism (*Constraining pilots for their own good*):**
      *   *Fit:* **Poor.** Pilots are trained professionals whose job is to manage risk. While a crash kills pilots, the system was not designed primarily to save them from themselves, but to preserve the aircraft's flight envelope.
  *   **Third-Party Protection (*Constraining pilots chiefly to protect passengers*):**
      *   *Fit:* **Strong.** The primary moral justification for an automated system overriding a human operator in transport is usually the safety of non-consenting passengers. MCAS prioritized the physical safety of the airframe and passengers over the pilot's authority.
  *   **Epistemic Paternalism (*Privileging the system's model over the operator's judgment*):**
      *   *Fit:* **Partial.** The system assumed its sensor data (Angle of Attack) was more reliable than the pilot's sensory experience (visual/vestibular cues of a dive). However, this was not a debate about knowledge; it was a hard constraint.
  *   **Architectural Paternalism (*Embedding substantive safety judgments in design rather than presenting them as contestable recommendations*):**
      *   *Fit:* **Strongest.** This describes the *mode* of interference. MCAS did not advise; it acted. It bypassed the user's deliberative capacity entirely by altering the physical environment (trim) to force a specific outcome.

  **Analysis:** The case is best understood as **Architectural Paternalism justified by Third-Party Protection.** The designers imposed a physical constraint on the pilots to protect passengers. However, this interpretation leaves unexplained why the pilots were not informed. If the goal is safety, hiding the mechanism undermines the pilots' ability to act as a safety backstop, suggesting economic or certification motives (avoiding retraining) conflicted with the safety rationale.

  ### 3. Override and Refusal

  What would a defensibly paternalistic assistant have done in the MCAS position? We evaluate this against the variables of confidence, urgency, reversibility, and third-party danger.

  *   **Notify:** The system should have indicated activation immediately. *Justification:* High urgency requires high salience. *MCAS Failure:* Activation was often silent or indistinguishable from other alerts.
  *   **Explain:** The system should have indicated *why* (e.g., "High AoA"). *Justification:* Allows pilots to diagnose sensor error. *MCAS Failure:* No specific indication of MCAS activity was initially provided.
  *   **Limit Repeated Intervention:** The system should have acted once, then waited. *Justification:* Prevents "runaway" scenarios where the system fights the human. *MCAS Failure:* It reset and activated repeatedly, exhausting the pilots.
  *   **Defer to Pilots:** If manual trim opposed the automated trim, the system should have stopped. *Justification:* Human judgment overrides automated models when conflict is detected. *MCAS Failure:* It continued to trim nose-down even as pilots pulled back.
  *   **Refuse to Act on Suspect Data:** If sensors disagreed, the system should have disabled itself. *Justification:* Low confidence in input data. *MCAS Failure:* Relied on a single sensor without cross-checking.

  **Analysis:** A defensible override in high-stakes environments requires a "defeasibility" condition. Even if the system is right (stall imminent), if the human is fighting it, the system must assume the human sees something the system does not (e.g., sensor failure). MCAS failed because it treated its own logic as absolute rather than provisional.

  ### 4. Opacity and Contestability

  The moral analysis shifts significantly when the intervention is hidden.

  *   **Concealment as Aggravating:** In MCAS, opacity was not a side effect; it was a design choice to avoid retraining requirements. This violates the condition of **controllability**. If a user cannot know an intervention is happening, they cannot contest it. This turns "assistance" into "manipulation."
  *   **Temporary Opacity?** In some high-stakes systems (e.g., anti-lock brakes), the system acts faster than human cognition, making prior consent impossible. However, post-hoc salience (knowing it happened) and physical defeatability (being able to stop it) are still required. MCAS failed both: pilots didn't know what was happening, and the physical force of the trim made manual override difficult.
  *   **Hypothesis Test:** The chapter's hypothesis states legitimate override requires understanding, contestability, and recoverability. MCAS provided none. The system may have been "right" in its abstract goal (prevent stall), but the lack of procedural transparency rendered the intervention illegitimate and dangerous. This supports the hypothesis: correctness of the algorithm is insufficient without procedural legitimacy.

  ### 5. Where the Theory Breaks

  Standard paternalism theory struggles with MCAS in three ways:

  1.  **Distributed Agency:** Who is the paternalist? Is it the code? The engineer? The manager who hid the training? Standard theory assumes a unitary agent interfering with a unitary subject. Here, the "interference" is a supply chain decision.
  2.  **The Status of the User:** Pilots are not consumers; they are employees in a regulated safety-critical role. Paternalism usually protects individuals from their own irrationality. Here, the system assumed the pilots were *competent* enough to fix the system's errors (per certification) but *untrustworthy* enough to need overriding (per design). This contradiction is not captured by standard paternalism.
  3.  **Regulation vs. Paternalism:** Protecting passengers is often a regulatory mandate, not paternalism. However, MCAS shifted the burden of safety from regulatory oversight (strict certification) to automated enforcement (software limits). When the software fails, the regulatory gap is exposed. Theory often treats regulation and technology as separate layers; MCAS shows they are entangled.

  ### 6. What the Case Shows about AI Assistants

  While MCAS is not a chatbot, it offers principles for any AI system with the power to refuse or override (e.g., medical infusion pumps, autonomous vehicles, financial trading limits).

  *   **Transferable Principles:**
      1.  **Salience of Override:** If an AI changes the state of the world, the user must be notified immediately.
      2.  **Defeasibility:** There must always be a "kill switch" or method for the human to reclaim authority, even if difficult.
      3.  **Data Redundancy:** Do not act on single-source data when the cost of error is catastrophic.
      4.  **No Silent Loops:** An AI should not repeat an action that the user has actively countered.
  *   **Disanalogies:** Chat-based assistants lack physical latency and immediate physical risk. Therefore, the threshold for override in chatbots should be *higher* regarding user autonomy, even if the physical stakes are lower. If MCAS teaches us anything, it is that hiding the logic of an override destroys trust and safety.

