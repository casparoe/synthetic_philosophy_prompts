  1.  **Sanctionability:** Are others entitled to blame or punish violators? (Yes/No)
  2.  **Interdependence:** Does the pattern only benefit you if others follow it too? (Yes/No)
  3.  **Arbitrariness:** Could a different pattern have solved the problem just as well? (Yes/No)
  4.  **Transparency:** Must agents consciously represent the rule/expectation to sustain it? (Yes/No)

  **The Matrix of Positions:**

  | Position | Sanctionability | Interdependence | Arbitrariness | Transparency | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Deflationary Regularity** | No | No | N/A | No | **Coherent** (Mere Habit) |
  | **Evolutionary Norm** | No | Yes | Yes | No | **Coherent** (Blind Equilibrium) |
  | **Lewis Convention** | No* | Yes | Yes | Yes | **Coherent** (Rational Coordination) |
  | **Social Norm** | Yes | Yes | Yes | Yes | **Coherent** (Expectation + Sanction) |
  | **Moral Principle** | Yes | No/Yes | No | Yes | **Coherent** (Not a "mere" regularity) |
  | **Blind Sanction** | Yes | Any | Any | No | **Incoherent** (Cannot blame for unknown rules) |
  | **Non-Arb. Coordination** | No | Yes | No | Yes | **Unattractive** (Prudential rule, rarely discussed as norm) |
  | **Secret Social Norm** | Yes | Yes | Yes | No | **Undeveloped** (How can you sanction what you don't know?) |

  *\*Note on Lewis: Lewis conventions involve a "normative" requirement of rationality, but not necessarily social blame or moral sanction. For the purpose of this tree, we classify Lewis under "No Sanction" to distinguish it from Bicchieri-style Social Norms.*

  ***

  ### Part 2: The Decision Tree

  **Instructions for Students:** Start at the top. Answer the questions based on the concrete case (e.g., the village path, the emoji, the potluck). Follow the arrows to find which philosophical account best fits the situation.

  **Node 1:** When someone breaks the pattern, do others feel entitled to complain, scold, or punish them?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 5.

  **Node 2:** Could the group have solved the same problem with a completely different pattern (e.g., driving left instead of right)?
  *   **Yes (Arbitrary)** → Go to Node 3.
  *   **No (Substantive)** → Go to Node 4.

  **Node 3:** Do people follow the pattern mainly to avoid shame/gossip, or mainly to avoid confusion/coordination failure?
  *   **Avoid Shame** → **Leaf A: Social Norm**.
  *   **Avoid Confusion** → **Leaf B: Lewis Convention**.

  **Node 4:** Would you still follow the rule even if no one knew you broke it?
  *   **Yes** → **Leaf C: Moral Principle** (Empty Cell for "Mere Regularity" discussion).
  *   **No** → **Empty Cell: Prudential Rule** (Incoherent as a norm; merely a technical instruction).

  **Node 5:** Does the pattern only benefit you if *everyone* (or most people) does the same thing?
  *   **Yes** → Go to Node 6.
  *   **No** → Go to Node 7.

  **Node 6:** Do people need to *know* that others are following the pattern to keep following it themselves?
  *   **Yes** → Go to Node 8.
  *   **No** → Go to Node 9.

  **Node 7:** Do people do it because it feels comfortable, or because they learned it works efficiently?
  *   **Comfortable** → **Leaf D: Deflationary Regularity**.
  *   **Efficient** → **Empty Cell: Prudential Habit** (Unattractive; collapses into Deflationary or Evolutionary).

  **Node 8:** Does everyone know that everyone else knows the rule?
  *   **Yes** → **Leaf B: Lewis Convention** (Re-entry from Node 6 path).
  *   **No** → **Empty Cell: Fragile Coordination** (Unstable; likely to collapse into Evolutionary or Deflationary).

  **Node 9:** Is the pattern stable because it is the best solution, or just because it is the one that got stuck first?
  *   **Best Solution** → **Empty Cell: Optimal Equilibrium** (Undeveloped; evolutionary accounts usually emphasize path-dependence).
  *   **Stuck First** → **Leaf E: Evolutionary Norm**.

  **Node 10:** (Diagnostic for Node 3/6 boundary) If a better pattern were suggested, would the group switch immediately or resist?
  *   **Switch Immediately** → Suggests **Lewis Convention** (Rational).
  *   **Resist** → Suggests **Social/Evolutionary Norm** (Inertia/Sanction).

  ***

  ### Part 3: The Leaves (Accounts & Commitments)

  **Leaf A: Social Norm (The "Potluck" Case)**
  *   **Description:** People comply because they believe others expect it and will sanction them if they don't (e.g., bringing a dish to avoid being called cheap).
  *   **Most Awkward Commitment:** It implies people don't actually value the norm's content, only the social approval; if the gossip stopped, the norm would vanish instantly.

  **Leaf B: Lewis Convention (The "Emoji" Case)**
  *   **Description:** A coordination equilibrium where everyone prefers to conform *if* others conform, sustained by common knowledge (e.g., using 🆗 to mean 'yes').
  *   **Most Awkward Commitment:** It struggles to explain why we feel *moral* resentment (not just inconvenience) when deep conventions (like language) are violated.

  **Leaf C: Moral Principle (The "Fishing" Case - Normative Variant)**
  *   **Description:** The pattern is followed because it is inherently right or fair, not just because others do it (e.g., rotating spots because it's just).
  *   **Most Awkward Commitment:** It denies the sociological insight that many "moral" rules are actually just arbitrary conventions that got moralized over time.
  *   *(Note: This is an "Empty Cell" relative to the prompt's request for "mere regularities," but included to show the boundary.)*

  **Leaf D: Deflationary Regularity (The "Village Path" Case)**
  *   **Description:** There is no "ought," only an "is." People walk on the left because it's comfortable and everyone else does, with no expectation of blame.
  *   **Most Awkward Commitment:** It cannot explain why people feel a sudden jolt of "wrongness" when the pattern is broken, even if no one is harmed.

  **Leaf E: Evolutionary Norm (The "Fishing" Case - Descriptive Variant)**
  *   **Description:** The pattern is a stable equilibrium selected by cultural learning or trial-and-error; participants need not represent the rule consciously.
  *   **Most Awkward Commitment:** It treats human agents like bacteria; it cannot easily account for our conscious ability to reason about and deliberately change norms.

  ***

  ### Part 4: Indistinguishability & Empty Cells

  **The Lewis vs. Social Norm Problem:**
  The tree cannot cleanly separate **Leaf B (Lewis)** and **Leaf A (Social Norm)** in all real-world cases.
  *   **Why:** In practice, the "payoff loss" of a coordination failure (Lewis) often feels identical to the "sanction" of social disapproval (Social Norm). If I use the wrong emoji, I am both misunderstood (Lewis) and looked at as rude (Social Norm).
  *   **Extra Question Needed:** "If you could break the rule secretly with zero chance of being caught, would you still feel bad?" (Lewis: No/Indifferent; Social Norm: Yes/Internalized Guilt).

  **Empty Cell Notes:**
  *   **Blind Sanction (Node 1 Yes + Node 6 No):** *Incoherent.* You cannot legitimately blame someone for violating a rule they could not possibly know existed (Transparency requirement).
  *   **Non-Arbitrary Coordination (Node 2 No + Node 5 Yes):** *Unattractive.* If there is only one way to solve a problem (e.g., "don't touch fire"), it is a law of nature or prudence, not a social norm.
  *   **Secret Social Norm (Node 1 Yes + Node 6 No):** *Undeveloped.* Some theorists argue norms can be unconscious, but explaining how sanctions apply to unconscious violations remains a major theoretical gap.
