answer: |-
  # Q&A PREP SHEET: Compulsory Exposure Account (CEA)
  **Context:** Brown-bag, Politics Dept.  
  **Speaker:** Retired Atmospheric Chemist (Systemic/Mechanism focus).  
  **Core Claim:** Compatriot priority is justified by shared subjection to coercive risk-pooling, not culture or global equality.

  ---

  ### 1. The "Coercion Boundary" Objection (The Cosmopolitans)
  *   **Probability:** 95% | **Damage:** High
  *   **Vocab:** *Arbitrariness, Global Basic Structure, Interactional vs. Systemic Coercion.*
  *   **The Charge:** "If coercion grounds justice, your borders are arbitrary. We coerce outsiders via trade sanctions, carbon emissions, and drone strikes. Why does the duty stop at the territorial line? This collapses into global Rawlsianism."
  *   **Concede Fast:** Acknowledge that *some* duties extend globally (negative duties not to harm). Admit the border is a heuristic, not a metaphysical wall.
  *   **Hold Onto:** The *density* and *reciprocity* of the coercive structure. Outsiders face our coercion, but not *shared* coercion (we don't share a treasury or court system).
  *   **2-Minute Reply:** "You're conflating interactional coercion with systemic co-liability. I emit carbon that harms you; I owe you remediation. But we do not share a pension fund, a conscription draft, or a legislature. Compatriot priority isn't about moral worth; it's about maintaining the legitimacy of a specific, high-density machinery of risk-pooling. When the coercion becomes shared (e.g., a regional climate treaty with a shared budget), the priority expands. Until then, the 'border' marks the limit of the joint liability contract."
  *   **Soft Spot:** Climate change. If our emissions correlate risks globally, doesn't the "risk pool" become global? *Defense:* It's becoming global, but the *institutional machinery* to manage it reciprocally doesn't exist yet.

  ### 2. The "Refugee at the Gate" Objection (The Legal Theorist / Republican)
  *   **Probability:** 80% | **Damage:** Catastrophic
  *   **Vocab:** *De facto control, Jurisdiction, Non-domination, Standing.*
  *   **The Charge:** "A refugee at the border is subject to your coercion (pushbacks, detention) but gets none of the risk-pool benefits. By your own logic, they are 'exposed' without 'membership.' This renders your account illegitimate."
  *   **Concede Fast:** Concede that exposure triggers *some* immediate duty (non-refoulement, due process).
  *   **Hold Onto:** The distinction between *subjection to power* and *participation in the pool*. Priority goods (wage insurance, pensions) require contribution/reciprocity over time.
  *   **2-Minute Reply:** "Exposure triggers negative duties (don't kill, don't torture) and emergency stabilization. But the 'priority' goods I defend—pensions, wage insurance, schooling—are reciprocal investments in a continuing cooperative scheme. A refugee is in a state of exception. My account demands we process them quickly: either admit them into the risk pool (granting full priority) or release them from our coercion. The injustice isn't the theory; it's the limbo status we impose."
  *   **Soft Spot:** If the "processing" takes years, they are coerced without benefits for a long time. The theory demands speed the state won't give.

  ### 3. The "Motivational Deficit" Objection (The Political Sociologist)
  *   **Probability:** 75% | **Damage:** Medium-High
  *   **Vocab:** *Solidarity, Motivational Surplus, Thick Identity, Welfare State Stability.*
  *   **The Charge:** "Insurance logic is too cold. People don't pay taxes for 'reciprocal risk-pooling'; they pay for 'us.' If you dissolve the cultural/ethnic glue, you dissolve the motivation for the welfare state. You're left with a contract nobody wants to sign."
  *   **Concede Fast:** Admit that "vibes" and heritage often *do* the motivational heavy lifting historically.
  *   **Hold Onto:** Shared fate is a stronger motivator than heritage in crises (pandemic, war). Heritage is exclusionary; shared risk is scalable.
  *   **2-Minute Reply:** "I'm not denying culture helps, but I'm denying it's necessary. Look at disaster response or wartime rationing. Strangers share risks when they know the machinery binds them. Relying on 'blood and soil' is dangerous and unstable. If we want a stable welfare state in diverse societies, we must pivot the narrative from 'who we are' to 'what we are in together.' It's an engineering fix for a social problem."
  *   **Soft Spot:** Empirical evidence is mixed. If people *don't* feel solidarity without cultural ties, the normative argument doesn't matter.

  ### 4. The "Fiscal Externalities" Objection (The Migration Economist)
  *   **Probability:** 60% | **Damage:** Medium
  *   **Vocab:** *Fiscal Externalities, Labor-Market Absorption, Deadweight Loss, Actuarial Fairness.*
  *   **The Charge:** "Your 'risk pool' ignores efficiency. If you prioritize compatriots for wage insurance but block labor mobility, you create massive deadweight loss. You're protecting a pool that is actuarially unsound because it restricts the inflow of contributors."
  *   **Concede Fast:** Admit that closed borders can harm the pool's long-term solvency (aging population).
  *   **Hold Onto:** Legitimacy trumps pure efficiency. A pool that feels unfair to current members will collapse politically.
  *   **2-Minute Reply:** "Efficiency isn't the only metric; political sustainability is. If the risk pool is perceived as open-ended or exploited, the coalition for redistribution collapses (see: backlash to austerity). My account allows migration *if* it integrates newcomers into the coercive machinery (tax/court) quickly. It opposes 'guest worker' schemes where people bear risks without gaining priority rights. That's not just inefficient; it's illegitimate."
  *   **Soft Spot:** If the math says the pool bankrupts without open borders, "legitimacy" won't save it.

  ### 5. The "Collapse" Objection (The Cosmopolitans / General Faculty)
  *   **Probability:** 50% | **Damage:** High
  *   **Vocab:** *Luck Egalitarianism, Thin Nationalism, Moral Arbitrariness.*
  *   **The Charge:** "This is just Rawlsian luck egalitarianism with a territorial boundary, or ordinary nationalism with the word 'culture' swapped for 'coercion.' You haven't carved out a distinct middle ground."
  *   **Concede Fast:** Acknowledge family resemblance to both.
  *   **Hold Onto:** The *source* of the duty. Rawls = brute luck; Nationalism = identity; CEA = joint liability for shared institutions.
  *   **2-Minute Reply:** "Rawls asks 'who got lucky?' I ask 'who is building the dam together?' Nationalism says 'help your kin.' I say 'help your co-conspirators in the legal order.' It matters because it limits the duties. I don't owe a compatriot a status good (like a subsidy for opera) just because they're local. I owe them protection from the risks *our* shared laws create. It's narrower than nationalism, but more institutional than luck egalitarianism."
  *   **Soft Spot:** In practice, the policy prescriptions might look 80% identical to a liberal nationalist.

  ### 6. The "Legitimacy/Standing" Objection (The Legal Theorist)
  *   **Probability:** 40% | **Damage:** Medium
  *   **Vocab:** *Standing, Positive vs. Negative Duties, Jurisdiction.*
  *   **The Charge:** "Coercion creates a negative duty not to harm, not a positive duty to provide wage insurance. You're deriving welfare rights from jurisdictional standing. That's a category error."
  *   **Concede Fast:** Concede the leap from "don't hurt" to "provide" requires a premise about what makes coercion *legitimate*.
  *   **Hold Onto:** Legitimate coercion requires reciprocal benefit. Taxation without service is extraction.
  *   **2-Minute Reply:** "If the state coerces me to pay taxes and obey laws, it assumes liability for the systemic risks those laws create (e.g., trade policy destroying my job). If it offers no insurance against those state-created risks, the coercion becomes predatory. Standing isn't just about suing; it's about having a stake in the enterprise. No stake, no legitimacy."
  *   **Soft Spot:** Philosophical heavy lifting required to prove "legitimacy" entails specific welfare goods.

  ---

  ### THE "HOPE NOBODY ASKS" QUESTION
  **Question:** "If the compatriots democratically vote to export costs to outsiders (e.g., carbon-intensive industry, tax havens), does your account give them the right to do so, provided they maintain the internal risk pool?"

  **The Honest Answer (Without Torching the Account):**
  "No. That's the limit of the account. Priority is conditional on the risk-pooling being *reciprocal and non-predatory*. If the internal legitimacy is purchased by externalizing harm, the 'compulsory exposure' becomes a racket. My account forbids priority goods funded by cost-exporting. But..."

  **The Caveat (The Soft Underbelly):**
  "...I don't have a robust enforcement mechanism for that prohibition other than moral suasion or international law, which brings me back to the Cosmopolitan's worry about the lack of a global enforcer. I'm relying on the state to police its own externalities. That's the weak link."
