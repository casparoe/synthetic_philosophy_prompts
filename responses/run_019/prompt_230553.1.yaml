  Here is a sorting of the five strategies into four tiers, ranked by how robustly they establish culture as an independent driver of economic change without yielding ground to material determinism.

  ### Tier 1: The Generative Cause
  **Rationale:** This tier contains strategies that treat cultural values as a primary source of motivational energy, rivaling material self-interest rather than merely reacting to it. These approaches grant culture the power to originate action, meaning they do not have to concede that material conditions provide the fundamental "fuel" for historical change.

  *   **(1) Preference-shaping:** This strategy lands at the top because it posits that values fundamentally alter what agents desire, making culture the engine of action rather than a passenger.

  ### Tier 2: The Decisive Selector
  **Rationale:** Strategies in this tier grant culture the power to determine specific historical outcomes, but only after conceding that material conditions set the boundaries of what is possible. Culture here is a tie-breaker rather than an engine, preserving causal efficacy while admitting material constraints on the menu of options.

  *   **(3) Equilibrium selection:** This approach occupies the second tier because it allows culture to pick the path at a fork, but only where material conditions have already failed to determine a single inevitable route.

  ### Tier 3: The Mediating Condition
  **Rationale:** This tier groups strategies that treat culture as a modifier of material forces rather than a source of force itself. These explanations concede that material interests supply the energy and the structure, reducing culture to a mechanism that directs, lubricates, or facilitates processes driven elsewhere.

  *   **(2) Channeling:** This strategy falls here because it explicitly concedes that material interests supply the motivational energy, leaving culture only the role of directing the flow.
  *   **(4) Enabling conditions:** This strategy shares the tier because it frames values as permissive scaffolding that lowers costs, making culture a necessary background condition rather than an active trigger.

  ### Tier 4: The Conceptual Dissolution
  **Rationale:** The final tier contains the strategy that rejects the causal framework entirely, arguing that the distinction between "culture" and "material cause" is a category error. While philosophically profound, this approach succeeds least at answering the specific causal question posed, as it dissolves the problem rather than solving it.

  *   **(5) Constitutive reading:** This strategy lands at the bottom because it argues that cultural categories define the economic acts themselves, thereby sidestepping the question of how one causes the other.
