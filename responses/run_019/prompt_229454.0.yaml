answer: |-
  This is a precise and well-framed problem. You have correctly identified the standard analytic trap: treating the *catuṣkoṭi* (tetralemma) as a truth-functional exhaustive partition, and the Madhyamaka rejection as a fifth truth-value or a paraconsistent collapse. The scholars get hand-wavy because they are searching for a *semantic* model for what is fundamentally a *pragmatic* or *illocutionary* maneuver.

  Here is the translation into your vocabulary, the residue report, and the verdict.

  ### 1. The Formal Translation of the Four Horns

  Let $P$ be a proposition asserting intrinsic existence (e.g., "The self has *svabhava*"). In classical logic, the four horns look like an exhaustive partition of the state space. In your non-classical zoo, they map neatly to the truth values of a bilattice or a four-valued logic (like FDE/Belnap).

  1.  **Horn 1:** $P$ is true. (Value $\mathbf{T}$)
  2.  **Horn 2:** $P$ is false. (Value $\mathbf{F}$)
  3.  **Horn 3:** $P$ is both true and false. (Value $\mathbf{B}$)
  4.  **Horn 4:** $P$ is neither true nor false. (Value $\mathbf{N}$)

  **The Madhyamaka Rejection:**
  Nāgārjuna denies all four. Formally, this looks like:
  $\neg P \land \neg \neg P \land \neg (P \land \neg P) \land \neg (\neg P \land \neg \neg P)$

  In a standard model-theoretic setting, this is a contradiction. If you reject $\mathbf{T}, \mathbf{F}, \mathbf{B}, \mathbf{N}$, you have assigned no value. In Belnap's system, there is no "Value $\mathbf{Z}$" outside the lattice. To a logician, this looks like the system has crashed.

  **The Translation:**
  The Madhyamaka move is not assigning a value; it is **rejecting the applicability of the valuation function itself**. It is not that $V(P) = \text{undefined}$; it is that $P$ is not the sort of string that admits a valuation $V$ in the ultimate context. It is a category error regarding predication, not a truth-value gap.

  ### 2. Pressure Point Analysis

  #### (1) The Fourth Horn vs. Belnap's $\mathbf{N}$
  You asked: *Is the fourth horn just Belnap's $\mathbf{N}$, and is rejecting it different from assigning $\mathbf{N}$?*

  **Answer:** The fourth horn *is* structurally isomorphic to assigning $\mathbf{N}$. However, **rejecting** the fourth horn is fundamentally different from assigning $\mathbf{N}$.
  *   **Assigning $\mathbf{N}$:** This is a positive semantic claim. It says, "The state of affairs is a gap." It reifies the gap. In Madhyamaka terms, this is still grasping (*upādāna*) at a view (the view of nihilism or indeterminacy).
  *   **Rejecting the Fourth Horn:** This says, "The framework that allows for 'gaps' presupposes the possibility of 'fills' (*svabhava*), which is false."
  *   **Residue:** In Belnap, $\mathbf{N}$ is a coordinate in the lattice. In Madhyamaka, rejecting the 4th horn is deleting the lattice. The residue here is the distinction between **semantic underdetermination** (the logic can't decide) and **ontological inapplicability** (the predicate doesn't latch).

  #### (2) *Prasajya* vs. *Paryudasa* Negation
  You asked: *Can that distinction be expressed in formal semantics, or does it live at the level of speech acts?*

  **Answer:** It lives at the level of speech acts (illocution), and standard truth-conditional semantics cannot capture it without distortion.
  *   **Paryudasa (Implicating):** "He is a non-Brahmin." This is propositional negation ($\neg P$). It commits you to the truth of $\neg P$ and implies $P$ is false. In model theory: $M \models \neg P$.
  *   **Prasajya (Non-implicating):** "It is not the case that..." This is **illocutionary negation** (rejection). It denies the assertibility of $P$ without asserting $\neg P$.
  *   **Formal Rendering:** You need a **Bilateralist** framework (e.g., Restall, Ripley). In bilateralism, there are two primitive forces: Assertion ($\vdash P$) and Rejection ($\dashv P$).
      *   *Paryudasa* corresponds to $\vdash \neg P$.
      *   *Prasajya* corresponds to $\dashv P$.
      *   Madhyamaka uses *prasajya* for the ultimate rejection. They are not asserting $\neg P$ (which would be Horn 2); they are rejecting $P$.
  *   **Residue:** Standard semantics defines $\neg P$ via truth conditions. *Prasajya* is defined via **commitment conditions**. The residue is the loss of the truth-conditional anchor. You can model it in proof-theoretic semantics (inferentialism), but not in model-theoretic semantics without treating "rejection" as just "truth of negation," which begs the question.

  #### (3) Emptiness of Emptiness
  You asked: *Is "emptiness of emptiness" a type-level distinction or a fixed point?*

  **Answer:** It is neither. It is a **therapeutic self-dissolution**.
  *   **Not a Fixed Point:** If emptiness ($E$) is a fixed point ($E \leftrightarrow \neg E$), it becomes a new essence (*svabhava*). Nāgārjuna explicitly forbids this.
  *   **Not a Type Distinction:** While it looks like a hierarchy (object language vs. meta-language), Nāgārjuna insists emptiness applies to *everything*, including itself, without generating a regress.
  *   **The Move:** "Emptiness" is a predicate that cures the disease of "intrinsic existence." Once the disease is cured, the medicine is discarded.
  *   **Formal Analogy:** Think of a **self-deleting program** or a **ladder** (Wittgenstein, *Tractatus* 6.54). The statement "All propositions are empty" is itself a proposition. If it is true, it is empty. If it is empty, it lacks intrinsic truth. This isn't a paradox; it's a feature. It prevents the theory from becoming a dogma.
  *   **Residue:** This is the hardest to formalize because logic aims for stability (theorems remain theorems), while this move aims for instability (the theorem dissolves its own authority). It is a **performative contradiction** that is accepted soteriologically.

  ### 3. The Verdict

  Here is the hedge-free verdict you asked for:

  **The residue is evidence that the scholars are looking for a metaphysics where there is only a therapy.**

  Madhyamaka is not doing something with language that model-theoretic semantics *can't* capture; it is doing something that model-theoretic semantics *shouldn't* be used to capture. The "mystery" scholars protect is largely an artifact of trying to force *prasajya* (rejection) into a truth-conditional box (*paryudasa*).

  Once you translate the tetralemma into a **bilateralist proof-theoretic framework** (where rejection is primitive, not defined by negation), 90% of the mystery vanishes. Nāgārjuna is not saying "Reality has a fifth truth value." He is saying "Your logical attachment to truth values is the source of suffering."

  The remaining 10%—the "emptiness of emptiness"—is not a logical gap. It is a **pragmatic constraint**. It is the logical equivalent of saying, "This sentence is not to be taken as an assertion." If your logic toolkit includes speech acts, inferential roles, and the distinction between *use* and *mention*, there is no untranslatable residue. If your toolkit is strictly model-theoretic (mapping sentences to world-states), then yes, Madhyamaka looks like nonsense. But that is a limitation of the toolkit's application, not the toolkit's expressive power.

  **Conclusion:** The position is less mysterious than the literature makes it sound. The literature is hand-wavy because it tries to ontologize what is a pragmatic dissolution. You don't need a new logic; you need to stop treating the tetralemma as a set of truth-claims and start treating it as a set of dialectical moves designed to exhaust the possibility of assertion.

  ### 4. Summary Table

  | Move | Best Formal Translation | What Survives | What Gets Distorted | Untranslatable Residue |
  | :--- | :--- | :--- | :--- | :--- |
  | **Horn 1** ($P$) | Assertion: $\vdash P$ (Value $\mathbf{T}$) | The claim of intrinsic existence. | None. | None. |
  | **Horn 2** ($\neg P$) | Assertion: $\vdash \neg P$ (Value $\mathbf{F}$) | The claim of nihilism/non-existence. | None. | None. |
  | **Horn 3** ($P \land \neg P$) | Assertion: $\vdash P \land \neg P$ (Value $\mathbf{B}$) | Dialetheism/Paraconsistency. | Treated as a stable truth-value rather than a contradiction to be endured. | None. |
  | **Horn 4** ($\neg(P \lor \neg P)$) | Assertion: $\vdash \neg P \land \neg \neg P$ (Value $\mathbf{N}$) | Truth-value gaps/Underdetermination. | Reifying the "gap" as a state of affairs. | None. |
  | **Rejection of All Four** | Bilateral Rejection: $\dashv P, \dashv \neg P, \dots$ | The refusal of ontological commitment. | Truth-conditional semantics forces this into "False" or "Undefined." | The shift from *semantic value* to *illocutionary force*. |
  | **Emptiness of Emptiness** | Performative Self-Dissolution (Ladder) | Prevention of dogmatic reification. | Fixed-point logics or Type Hierarchies (both stabilize what should dissolve). | The *soteriological* aim (ending suffering) vs. *theoretical* aim (finding truth). |
