  *(Self-Correction on the Verdict)*: I need to be careful not to say "Madhyamaka is just Wittgenstein." That's reductive. But the *logical structure* of the resolution is similar. The verdict should be: The residue is not a *logical* gap, but a *pragmatic* shift. The toolkit isn't missing logic; it's missing the distinction between logic-as-calculus and logic-as-therapy. I will argue the latter.

