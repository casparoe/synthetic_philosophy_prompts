          1.  $P$
          2.  $\neg P$
          3.  $P \land \neg P$
          4.  $\neg P \land \neg (\neg P)$ (or $\neg (P \lor \neg P)$)
      *   Madhyamaka Move: Reject all four ($\neg P, \neg \neg P, \neg(P \land \neg P), \neg(\neg P \land \neg \neg P)$).
      *   *Crucial Context:* This isn't just truth-value assignment; it's about *svabhava* (intrinsic nature/existence). The negation targets *inherent existence*, not conventional predication.

  3.  **Address Pressure Point 1: The Fourth Horn vs. Belnap's $\mathbf{N}$:**
      *   Belnap's $\mathbf{N}$ (Neither True nor False) is a truth value within a lattice. Assigning $\mathbf{N}$ is a positive semantic claim about the status of $P$.
      *   Madhyamaka's 4th horn is often read as "Neither $P$ nor $\neg P$." But rejecting the 4th horn means refusing *even* the status of "Neither."
      *   *Translation:* In Belnap, if you reject $\mathbf{T}, \mathbf{F}, \mathbf{B}, \mathbf{N}$, you have no value left. You've exited the logical space.
      *   *Distinction:* Assigning $\mathbf{N}$ says "The value is gap." Rejecting the 4th horn says "The question of value is ill-posed." It's a category error, not a value assignment.

  4.  **Address Pressure Point 2: *Prasajya* vs. *Paryudasa* Negation:**
      *   *Paryudasa* (Implicating): "He is a non-Brahmin." (Implies he is something else, a caste member). Classical $\neg$ often acts like this in natural language.
      *   *Prasajya* (Non-implicating): "It is not the case that..." (No commitment to an alternative).
      *   *Formalization:* In standard model theory, $\neg P$ is true iff $P$ is false. This looks like *paryudasa* (commits to falsehood). *Prasajya* is closer to illocutionary negation (rejection of the assertion) rather than propositional negation.
      *   *Logic:* Substructural logics or speech-act logics (like Ripley's or Cobreros' work on tolerant/classical) might capture "rejection" distinct from "truth of negation." But standard truth-conditional semantics struggles. It's meta-linguistic.

  5.  **Address Pressure Point 3: Emptiness of Emptiness:**
      *   If "All things are empty" ($E$) is a thesis, is $E$ itself empty? If yes, does it undermine itself?
      *   Nāgārjuna: Emptiness is a remedy. Once the disease (grasping) is cured, the remedy is discarded.
      *   *Formal Analogy:* Not a fixed point ($E = \neg E$), but a *dissolution of the framework*. It's like a type-theoretic hierarchy where the statement about types cannot be made within the type system. Or a performative contradiction that is acknowledged and accepted as soteriologically necessary.
