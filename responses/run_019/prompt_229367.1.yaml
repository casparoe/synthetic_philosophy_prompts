answer: |-
  ### Readings

  **1. Internal Political Participation**
  This reading interprets self-determination as the right of a population to participate meaningfully in the democratic processes of the existing state. It claims that Catalans, Scots, or Quebecois must have fair representation in the national parliament, access to public office, and the ability to influence central policy. It does not imply a right to change borders, but rather a right to have one's voice counted within the current constitutional framework.

  **2. Cultural Integrity**
  Under this interpretation, self-determination is the right of a group to preserve and develop its distinct linguistic, cultural, and historical identity. This justifies powers over education, media, and local administration to protect the Catalan language or Scottish legal traditions. It treats the "people" as a cultural nation rather than a sovereign state, seeking autonomy within the larger union rather than independence from it.

  **3. Remedial Secession**
  This claim argues that a people have a right to secede only as a last resort when their fundamental human rights are systematically violated by the central state. It posits that self-determination is a "remedy" for tyranny, oppression, or exclusion. Unless the central government is actively persecuting the region or stripping it of all democratic agency, the right to break away unilaterally does not trigger.

  **4. Democratic Plebiscite**
  This reading asserts that if a majority of voters within a specific territory express a desire for independence in a referendum, the right to self-determination is automatically activated. It equates self-determination with simple majoritarian will within the sub-unit, regardless of the constitutional rules of the larger state or the preferences of the wider national population. The act of voting itself creates the right to leave.

  **5. Primary Right (Ascriptive)**
  This is the strongest moral claim: that any group constituting a "nation" or "people" possesses an inherent, primary right to sovereign statehood simply by virtue of their identity. It argues that statehood is the natural condition of a people and that existing borders are secondary moral considerations. Under this view, the desire to secede need not be remedial or even democratic; the existence of the people itself justifies the state.

  **6. International Legal Positivism**
  This reading relies strictly on existing international law, specifically the UN Charter and relevant covenants. It defines self-determination as a right granted to peoples under colonial domination, foreign occupation, or racist regimes. It treats the right as a specific legal instrument designed for decolonization, not a universal principle applicable to established democracies with regional autonomy like Spain, Canada, or the UK.

  **7. Constitutional Proceduralism**
  This interpretation holds that the right to self-determination exists only insofar as it is recognized and regulated by the existing constitutional order. It claims that a "people" determines itself through the legal mechanisms provided by the state, such as constitutional amendment procedures or negotiated referendums. The right is real, but its exercise is conditional on following the rules of the host country's legal system.

  ### Verdicts

  *   **Internal Political Participation:** Trivial (Widely accepted, but does not justify secession).
  *   **Cultural Integrity:** Defensible (Plausible claim, but supports autonomy, not secession).
  *   **Remedial Secession:** Defensible (Philosophically robust, but factually inapplicable to Catalonia/Quebec).
  *   **Democratic Plebiscite:** Defensible (Normatively attractive, but legally contentious regarding unilateralism).
  *   **Primary Right (Ascriptive):** False (In international law); Defensible (In some moral theories, but justifies almost anything).
  *   **International Legal Positivism:** False (In this context; does not apply to established democracies).
  *   **Constitutional Proceduralism:** Defensible (Legally accurate, but blocks unilateral action).

  ### What survives

  Only the **Democratic Plebiscite** and **Primary Right** readings provide the necessary logical bridge to justify unilateral secession. The Democratic Plebiscite reading argues that a local majority vote overrides constitutional constraints, effectively making the referendum result self-executing. The Primary Right reading goes further, suggesting that the moral existence of the Catalan "nation" supersedes the Spanish state's legal claims entirely. However, both readings face significant hurdles: the Plebiscite reading struggles to define the boundaries of the voting "people" (why the region and not the whole state?), while the Primary Right reading is largely rejected by international legal standards and risks validating endless fragmentation. Your housemate relies on one of these two to reach his conclusion, but both are controversial and lack binding legal force in established democracies.

  The remaining readings support significantly weaker claims, such as internal autonomy, cultural protection, or a right to negotiate. **Internal Political Participation**, **Cultural Integrity**, and **Constitutional Proceduralism** all validate the demand for greater self-governance but explicitly reject the right to break the state's legal order unilaterally. Even the **Remedial Secession** reading, while theoretically allowing for independence, fails to support the Catalan case because it requires evidence of severe oppression which is absent in Spain. Finally, the **International Legal Positivism** reading actively undermines the secessionist argument, as current treaties restrict the right to secede to colonial or occupied territories. Consequently, most plausible interpretations of "self-determination" grant Catalans a right to be heard and accommodated, but not a right to leave without consent.
