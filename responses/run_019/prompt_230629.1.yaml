answer: |-
  The pattern is best described as **overdetermination** analyzed through **INUS conditions**, showing that historians rely on a pragmatic notion of **explanation** rather than a strict metaphysical notion of **causation**.

  The logical structure you are identifying is formally known as an **INUS condition** (an Insufficient but Non-redundant part of an Unnecessary but Sufficient condition), coined by philosopher J.L. Mackie. In the WWI case, the alliance system is insufficient to cause war on its own, but it is a non-redundant part of a specific complex (alliances + arms race + assassination) that *was* sufficient. The outcome is "overdetermined" not because each individual factor was sufficient (as in the two-rocks case), but because multiple *different complexes* of factors could have produced the same outcome. This is why removing one factor might not prevent the war (another complex might have triggered it), yet the factor remains a genuine cause of the war *as it actually happened*.

  What makes these cases hang together is **contrastive focus**. Historians rarely ask "Why did event E happen?" in a vacuum; they implicitly ask "Why did E happen *rather than* not-E?" or "Why did E happen *then* rather than *later*?" If you define the event as "a major European war in the early 20th century," the assassination of Franz Ferdinand fails the but-for test and drops out as a cause. If you define the event as "war breaking out in August 1914," the assassination passes the but-for test and becomes central. The boundary between a valid cause and a mere condition is drawn by the **explanatory interest** of the historian: a factor counts if it makes a difference to the specific contrast case being considered, even if it wouldn't prevent the general outcome entirely.

  This tolerance is understood by most philosophers of history as a different notion of **explanation**, not causation. Metaphysically, many argue that strict counterfactual dependence (the but-for test) still holds if you describe the event finely enough (e.g., the specific timing and manner of the war). However, because historical explanation aims at understanding and narrative coherence rather than just metaphysical tracking, historians adopt a pragmatic standard where "causes" are those factors that are manipulable, abnormal, or significant relative to a background of stable conditions (the **causal field**).

  **Settled Consensus:**
  *   **Rejection of Strict Necessity:** There is broad agreement that strict "but-for" necessity is too narrow for historical explanation; INUS conditions are the standard logical model accepted in the field.
  *   **Context Dependence:** It is settled that causal selection depends on the context of inquiry; there is no single "complete" list of causes independent of the question being asked.

  **Genuinely Contested:**
  *   **Realism vs. Pragmatism:** Realists argue there is an objective "causal weight" or structure to history that historians approximate, while pragmatists argue causal claims are entirely tools for narrative organization with no mind-independent truth.
  *   **Structural vs. Agency:** There is ongoing debate over whether deep structural causes (alliances, economics) should be privileged over agential causes (assassinations, decisions) when both fail the but-for test for the general outcome, or if this privileging is merely ideological.
