prompt: |-
  I am a retired analytical chemist who has lately been reading philosophy with more enthusiasm than training, and I find myself needing a practical tool built out of David Lewis's account of convention. Here is my situation. I chair the bylaws committee of a two-hundred-member amateur astronomy society founded in the 1970s. Every few years we revise the bylaws, and this time the membership has asked us to go through the society's many unwritten practices and recommend, for each one, whether to write it into the bylaws, leave it alone, or actively discourage it. The committee has five members, none with any philosophy; we have two two-hour meetings before we must report; we cannot survey the membership before the vote; and bylaw changes require a two-thirds majority at the annual meeting, so a mistake, once codified, is hard to undo.

  I have read Lewis's book on convention, but it is written for philosophers, and I need it turned into a working procedure. What I want from you is a numbered sequence of tests the committee can apply to any candidate practice, where each test says what observable evidence would count as passing or failing it given that we cannot poll two hundred people, what classification a failure at that point yields, and what the default recommendation is for each classification (codify, leave alone, discourage), with the exceptions to each default stated. Two things from the book must survive the translation intact, because I think my committee will be tempted to drop them: first, Lewis's insistence that a convention does not require any explicit agreement, which is precisely backwards from how my colleagues will use the word in a bylaws context; second, the condition that there be a genuine alternative regularity that could equally well have stabilized. Wherever a test cannot be made mechanical and a committee member simply has to exercise judgment, mark it plainly as such rather than letting the procedure pretend otherwise.

  Please then run the procedure on these three real cases from our society, showing the work at each step:

  1. At our dark-sky site, members set up telescopes in east-west rows on a first-come basis, with the earliest arrival anchoring the row nearest the gravel lot. Nobody designed this; it congealed in the 1990s. North-south rows would serve equally well. Everyone follows it, expects others to follow it, and seems genuinely content.

  2. Only dim red lights are permitted once observing begins. A newcomer who switches on a white flashlight is corrected within seconds, and repeat offenders are talked about. Here, though, there is a real physiological reason behind the practice, which the first case lacks, and I am unsure what the procedure should do with that — or with the fact that some details of the practice (exactly how red, whether headlamps count) do seem arbitrary.

  3. Senior members get first pick of the society's loaner telescopes, a practice about twenty years old. Newer members grumble about it privately but comply, and I suspect, though I cannot prove, that a majority would actually prefer a lottery while nobody wants to be the one to say so. I should disclose that I have been a member for thirty-five years and benefit from this arrangement, and I would rather the procedure tell me something I dislike than that it be bent.

  Finally, tell me what the procedure cannot settle. I gather that Lewis's account is a description of what conventions are, not advice about whether a given one deserves the force of a written rule, and I would like the limits of the whole exercise stated honestly before I present it to the committee as more than it is.

  Please write the answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired analytical chemist, amateur philosopher, chair of a bylaws committee for an amateur astronomy society (200 members, founded 1970s).
      *   **Task:** Create a practical, numbered testing procedure based on David Lewis's *Convention: A Philosophical Study* to evaluate unwritten practices for potential codification, retention as unwritten, or discouragement.
      *   **Constraints:**
          *   Committee has 5 members (no philosophy background).
          *   Two 2-hour meetings.
          *   No surveying membership allowed.
          *   Bylaw changes need 2/3 majority (hard to undo).
          *   Must preserve two specific Lewisian concepts: (1) Conventions don't require explicit agreement; (2) There must be a genuine alternative regularity that could have stabilized (arbitrariness).
          *   Must mark subjective judgment calls clearly (no false mechanical precision).
          *   Must apply the procedure to three specific cases (Telescope rows, Red lights, Seniority loaner priority).
          *   Must disclose limits of the procedure (Lewis describes, doesn't prescribe).
          *   Language: American English.
      *   **Tone:** Professional, precise (chemist-to-chemist), respectful of the philosophical source material but pragmatic for governance.

  2.  **Deconstruct David Lewis's *Convention*:**
      *   *Core Definition:* A convention is a regularity $R$ in behavior among a population $P$ in a recurrent situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on the condition that everyone else does (conditional preference).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem just as well (Arbitrariness).
          5.  (Common Knowledge): All the above are known to everyone, known to be known, etc.
      *   *Key Distinction for this User:* Lewis distinguishes between *conventions* (coordination solutions, arbitrary) and *norms/rules* (might be driven by intrinsic value or necessity).
      *   *The "Bylaws" Problem:* Bylaws are usually for governance, enforcement, and clarity. Conventions are self-policing. Codifying a convention can sometimes kill it (over-formalization) or solidify it (good for stability). Codifying a *norm* that isn't a convention might be necessary for enforcement.

  3.  **Drafting the Procedure (The "Lewisian Audit"):**
      *   Need to translate Lewis's conditions into "observable evidence" for a committee of 5 without polling.
      *   *Test 1: Regularity & Expectation.* (Lewis Conditions 1 & 2). Do people do it? Do they expect others to do it?
      *   *Test 2: Conditional Preference.* (Lewis Condition 3). Do they do it *because* others do it? Or because it's the only way?
      *   *Test 3: Arbitrariness.* (Lewis Condition 4). This is the crucial one the user highlighted. Could it have been different?
      *   *Test 4: Common Knowledge.* (Lewis Condition 5). Is it "understood"?
      *   *Decision Matrix:* Based on pass/fail, recommend Codify, Leave Alone, or Discourage.
      *   *Handling the "Explicit Agreement" constraint:* Need to explicitly warn the committee not to look for a vote or meeting minutes establishing the rule.
      *   *Handling Judgment:* Mark where they need to discuss, not just check a box.

  4.  **Refining the Tests for the Committee Context:**
      *   *Test 1 (Regularity):* Evidence = Observation, anecdotal consistency. Fail = Sporadic compliance.
      *   *Test 2 (The "Why"):* Evidence = Reaction to deviation. If someone breaks it, is it a coordination failure or a safety violation?
      *   *Test 3 (Arbitrariness):* Evidence = Counterfactuals. Could we do the opposite?
      *   *Test 4 (Stability):* Evidence = Self-correction. Do members correct each other without committee intervention?

      *   *Classification:*
          *   **Pure Convention:** Passes all Lewis tests (including Arbitrariness). *Default:* Leave Alone (conventions self-police). *Exception:* Codify if new member onboarding is failing.
          *   **Technical Norm:** Fails Arbitrariness (physical necessity). *Default:* Codify (for clarity/safety).
          *   **Power/Status Norm:** Fails Conditional Preference (some comply reluctantly). *Default:* Discourage or Codify with sunset (needs political handling).
          *   **Failed Convention:** Fails Regularity. *Default:* Discourage (if confusing) or Codify (if needed).

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Telescope Rows):*
          *   Regularity: Yes.
          *   Expectation: Yes.
          *   Arbitrariness: Yes (N-S works as well as E-W).
          *   Preference: Yes (coordination).
          *   *Verdict:* Pure Convention. Recommendation: Leave Alone.
      *   *Case 2 (Red Lights):*
          *   Regularity: Yes.
          *   Expectation: Yes.
          *   Arbitrariness: Mixed. The *need* for dark adaptation isn't arbitrary (physiology), but the *specifics* (shade of red, headlamps) are.
          *   *Nuance:* Lewis would say the *core* is a technical norm, the *details* are convention.
          *   *Verdict:* Hybrid. Recommendation: Codify the principle (dark adaptation), leave details as convention or provide guidelines.
      *   *Case 3 (Seniority Loaners):*
          *   Regularity: Yes.
          *   Expectation: Yes.
          *   Conditional Preference: **No.** New members comply but prefer otherwise. It's not a coordination equilibrium; it's a power dynamic.
          *   Arbitrariness: Yes (Lottery could work).
          *   *Verdict:* Not a Lewisian Convention. It's a norm of privilege.
          *   *Recommendation:* Discourage (or Codify with reform). Given the user's bias, the procedure must flag this as "Fails Conditional Preference."

  6.  **Addressing the Limits:**
      *   Lewis describes *what is*, not *what ought to be*.
      *   A convention can be bad (e.g., driving on the left when everyone else drives on the right, or a discriminatory norm).
      *   Bylaws serve legal/organizational stability, not just coordination.
      *   The procedure identifies the *type* of social fact, not the *moral value*.

  7.  **Review against Constraints:**
      *   *American English:* Check spelling (behavior, program, etc.).
      *   *Two Lewisian constraints:* Explicitly mentioned in the intro/tests.
      *   *Judgment markers:* Use bold or italics to indicate "Committee Discussion Required."
      *   *Tone:* Respectful of the chemist/philosopher duality.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the user's background. Set the stage.
      *   *The Procedure:* Make it look like a lab protocol. Numbered steps. Pass/Fail criteria.
      *   *The Cases:* Walk through step-by-step.
      *   *The Limits:* Be honest about the Is/Ought problem.

      *(Self-Correction during drafting)*: I need to make sure I don't confuse "Convention" in the Lewis sense with "Bylaw." A Lewisian Convention is often *better* left unwritten. The committee's instinct will be to write everything down. The procedure needs to steer them *away* from writing down pure conventions unless there's a specific reason (like high turnover).
      *   *Refining Test 3 (Arbitrariness):* This is the hardest for non-philosophers. I need to give them a concrete question: "If we swapped this rule for its opposite tomorrow, would the society function just as well, once everyone adjusted?"
      *   *Refining Case 3:* The user admitted bias. The procedure must be robust enough to call this out even if the user dislikes it. I need to ensure the "Conditional Preference" test catches the grumbling new members.

  9.  **Final Polish:** Check the "Two Things" requirement again.
      1.  No explicit agreement needed. (Make sure Test 1 emphasizes observation over minutes).
      2.  Genuine alternative regularity. (Make sure Test 3 emphasizes this).
      *   Check the "Judgment" requirement. (Mark sections clearly).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  To the Chair of the Bylaws Committee,

  It is a pleasure to address a colleague who understands that a model is only as good as its utility in the lab. David Lewis's *Convention* (1969) is indeed a descriptive account of social equilibrium, not a prescriptive manual for governance. However, his distinction between *coordination equilibria* (conventions) and *norms backed by force or necessity* is precisely the tool your committee needs to avoid over-legislating social habits.

  Below is the **Lewisian Audit Procedure**. It is designed to be completed within your two meeting slots. It translates Lewis's five conditions into observable evidence suitable for a committee of five, without polling the membership.

  ### The Lewisian Audit Procedure

  **Preliminary Instruction:** Lewis defines a convention as a solution to a coordination problem that is **arbitrary** and **self-policing**. Your instinct will be to look for a vote, a motion, or a founding document that established the practice. **Do not do this.** Lewis's first requirement is that conventions arise without explicit agreement. If you find a minute from 1975 establishing the rule, it is not a Lewisian convention; it is a standing rule. This audit applies only to unwritten practices.

  **Step 1: The Regularity and Expectation Test**
  *   **Objective:** Determine if the behavior is stable and expected.
  *   **Observable Evidence (Pass):** Committee members can independently recall at least three instances in the last year where the practice was followed without discussion. Committee members agree that if a new member arrived, they would be told, "This is how we do it," before they acted.
  *   **Observable Evidence (Fail):** Compliance is sporadic. Members express surprise when the practice is followed.
  *   **Judgment Call:** *The committee must agree on what counts as "sporadic." If compliance is 80% but the 20% causes chaos, treat as Pass. If compliance is 80% and no one cares, treat as Fail.*
  *   **Result:**
      *   **Fail:** Classification: **Failed Habit.** Go to Step 5.
      *   **Pass:** Proceed to Step 2.

  **Step 2: The Conditional Preference Test**
  *   **Objective:** Determine if members follow the practice *because* others do (coordination) or for independent reasons (necessity/morality).
  *   **Observable Evidence (Pass):** Members state that they would prefer *not* to follow the practice if they thought everyone else would break it. (e.g., "I park E-W only because if I park N-S, I block the path.")
  *   **Observable Evidence (Fail):** Members state they would follow the practice even if no one else did. (e.g., "I use red light even if everyone else uses white, because I need my own night vision.")
  *   **Judgment Call:** *Listen for the "because." This requires interpreting anecdotal reports from committee members about member sentiment. Do not accept "It's the rule" as an answer; there is no written rule.*
  *   **Result:**
      *   **Fail:** Classification: **Technical or Moral Norm.** Go to Step 4.
      *   **Pass:** Proceed to Step 3.

  **Step 3: The Arbitrariness Test (Crucial Lewisian Condition)**
  *   **Objective:** Determine if a genuine alternative regularity could have solved the problem equally well.
  *   **Observable Evidence (Pass):** The committee can conceive of a specific, opposite regularity that would work just as well if everyone switched simultaneously. (e.g., "We could park N-S instead of E-W.")
  *   **Observable Evidence (Fail):** The practice is dictated by physics, safety, or law. No alternative exists without loss of function. (e.g., "We cannot use white light because it destroys night vision physically.")
  *   **Judgment Call:** *Distinguish between "hard to change" and "impossible to change." A convention is hard to change because of coordination costs, not physical impossibility.*
  *   **Result:**
      *   **Fail:** Classification: **Technical Necessity.** Go to Step 4.
      *   **Pass:** Classification: **Pure Convention.** Go to Step 5.

  **Step 4: Disposition for Norms and Necessities (Failures of Arbitrariness or Conditional Preference)**
  *   **Classification:** **Technical/Moral Norm.**
  *   **Default Recommendation:** **Codify.**
  *   **Reasoning:** Since these are not arbitrary, they rely on objective standards or enforceable rights. Writing them down reduces ambiguity for newcomers and provides a basis for enforcement without social friction.
  *   **Exception:** Do not codify if the practice is too granular for bylaws (e.g., exact nanometer wavelength of red light). Instead, codify the *principle* (e.g., "Lighting must preserve night vision") and delegate details to a site manual.

  **Step 5: Disposition for Conventions and Failed Habits**
  *   **Classification A: Pure Convention (Passed Steps 1-3)**
      *   **Default Recommendation:** **Leave Alone.**
      *   **Reasoning:** Conventions are self-policing. Codifying them adds bureaucratic bloat and may invite legalistic loopholes where social pressure previously worked.
      *   **Exception:** Codify if the society has high turnover and the "learning curve" for the convention is driving new members away.
  *   **Classification B: Failed Habit (Failed Step 1)**
      *   **Default Recommendation:** **Discourage.**
      *   **Reasoning:** If it isn't stable, it isn't serving a coordination function. It is likely noise.
      *   **Exception:** Codify if the committee believes the practice *should* be stable but lacks the critical mass to sustain itself without institutional backing.
  *   **Classification C: Power Norm (Passed Step 1 & 3, Failed Step 2)**
      *   *Note: This occurs when people comply because of status pressure, not mutual benefit.*
      *   **Default Recommendation:** **Discourage.**
      *   **Reasoning:** Lewisian conventions require mutual preference. If one group complies reluctantly, it is not a convention; it is an inequity.
      *   **Exception:** Codify only if the society explicitly wishes to institutionalize the hierarchy (e.g., an officer's privilege), understanding this is a policy choice, not a recognition of convention.

  ***

  ### Application to Society Cases

  Here is the audit applied to your three specific cases, showing the work at each step.

  #### Case 1: East-West Telescope Rows
  *   **Step 1 (Regularity):** **Pass.** Committee agrees it has been consistent since the 1990s. Newcomers are directed to the "first row" by veterans.
  *   **Step 2 (Conditional Preference):** **Pass.** Members park E-W because that is where the gaps are. If everyone parked N-S, the E-W parker would be isolated or blocking traffic. They prefer the coordination over the specific orientation.
  *   **Step 3 (Arbitrariness):** **Pass.** You noted North-South rows would serve equally well. The physics of the site does not dictate E-W.
  *   **Classification:** **Pure Convention.**
  *   **Recommendation:** **Leave Alone.**
  *   **Rationale:** This is a textbook Lewisian convention. It solves a coordination problem (where to park) arbitrarily (E-W vs N-S) without agreement. Writing this into bylaws risks making a site manager a "parking enforcement officer" rather than relying on members to self-coordinate.
  *   **Exception Check:** Is turnover high enough to warrant codification? *Judgment Call:* If the committee agrees new members frequently park wrong and cause conflict, add a single line to the Site Rules (not Bylaws): "Telescopes shall be arranged in rows parallel to the access road."

  #### Case 2: Red Lights Only
  *   **Step 1 (Regularity):** **Pass.** Strict compliance; offenders corrected immediately.
  *   **Step 2 (Conditional Preference):** **Fail (Mixed).** Members use red light primarily for their *own* physiological night vision, not merely to match others. Even if everyone else used white, a serious observer would still prefer red for their own eyes.
  *   **Step 3 (Arbitrariness):** **Fail.** The core practice is dictated by rod-cell physiology. However, the *details* (shade of red, headlamps vs. hand) contain arbitrary elements.
  *   **Classification:** **Technical Norm with Conventional Details.**
  *   **Recommendation:** **Codify the Principle; Leave Details Alone.**
  *   **Rationale:** Because this fails the Arbitrariness Test on the core function, it is not a pure convention. It is a safety/operational standard. Leaving it unwritten risks "scope creep" (e.g., someone arguing bright red is okay).
  *   **Action:** Amend bylaws to state: "Artificial lighting at the dark site must be limited to wavelengths that preserve night vision." Do not specify "red" or "headlamps" in the bylaws; let the conventional details remain flexible in the member handbook.

  #### Case 3: Seniority Loaner Priority
  *   **Step 1 (Regularity):** **Pass.** It has held for twenty years.
  *   **Step 2 (Conditional Preference):** **Fail.** You noted newer members grumble and would prefer a lottery. They comply due to social pressure, not because they prefer the seniority system *given that others follow it*. If the system were a lottery, they would prefer the lottery even if seniors wanted priority. The preferences do not align.
  *   **Step 3 (Arbitrariness):** **Pass.** A lottery or first-come system would function logistically just as well.
  *   **Classification:** **Power Norm (Inequity).**
  *   **Recommendation:** **Discourage.**
  *   **Rationale:** This fails the Lewisian definition of convention because it lacks the conditional preference of the whole population. It is a norm of privilege. While stable, it is not a coordination equilibrium; it is a dominance hierarchy.
  *   **Conflict of Interest Note:** As a beneficiary of this norm, your judgment here is compromised. The procedure flags this as a **Fail** on Step 2. The default recommendation is to **Discourage**. To follow the procedure honestly, you must recommend abolishing the practice or codifying it with a sunset clause (e.g., "Senior priority expires in 3 years").
  *   **Exception:** The only exception is if the committee decides the society *wants* to reward tenure explicitly. If so, you must **Codify** it clearly so new members know the cost of entry, rather than leaving it as an unwritten surprise. *Recommendation: Codify with transparency.*

  ***

  ### Limits of the Procedure

  You asked for an honest statement of what this procedure cannot settle. As a chemist, you know that an assay tells you concentration, not value. Lewis's account is similarly descriptive.

  1.  **The Is/Ought Gap:** This procedure identifies whether a practice *is* a convention. It does not tell you if the convention is *good*. A society could have a stable, arbitrary, self-policing convention that is discriminatory or inefficient. Lewis helps you identify the social mechanism, not its moral worth.
  2.  **Stability vs. Justice:** Lewisian conventions are stable by definition. Your bylaws committee, however, may have a mandate for equity or growth. A "Pure Convention" (Case 1) is stable, but a "Power Norm" (Case 3) is also stable until it isn't. The procedure identifies Case 3 as *not* a convention, but it cannot mathematically prove that changing it will improve the society. That requires political judgment.
  3.  **The Codification Paradox:** Lewis argues that conventions work best when unwritten. Bylaws are, by definition, written. There is an inherent tension here. If you codify a convention, you risk turning a social agreement into a legal contract, which changes the nature of the compliance (from "I do this to help us coordinate" to "I do this to avoid expulsion"). This procedure recommends leaving conventions alone, but your mandate is to write bylaws. You must decide if the clarity of writing outweighs the flexibility of the unwritten.
  4.  **Common Knowledge:** Lewis requires that the regularity be "common knowledge" (everyone knows, everyone knows everyone knows). Without polling, your committee is estimating this. You may misidentify a private grievance as a public consensus.

  **Final Advice:** Use this procedure to filter out the "noise." If it's a Pure Convention, keep it out of the bylaws to save your 2/3 majority capital for the things that actually require governance (Technical Norms and Power Norms).

  Respectfully,

  **The AI Assistant**
