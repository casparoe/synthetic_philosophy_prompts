answer: |-
  # Q&A PREP SHEET: Condorcet Jury Theorem & Democracy
  **Context:** 20-min talk, Political Theory Seminar.  
  **Audience:** 10 Deliberative Dems (hostile to stats), 1 Formalist (strict on maths), 2 Empiricists (want real-world metrics).  
  **Adversary:** Tom (knows your weak spots, sitting in the front row).

  ---

  ## 1. LIKELY OBJECTIONS (In Order of Appearance)

  **1. The Ontological Objection (Empiricists & Deliberatives)**
  *   **Phrasing:** "Condorcet assumes a binary choice with a single 'correct' answer. In politics, especially on normative issues like tax rates or rights, there often *is* no fact of the matter to be right about. What is the theorem tracking?"
  *   **Concede:** Not every political question is truth-apt.
  *   **Hold Firm:** Many crucial policy questions *are* factual (e.g., 'Will this policy reduce carbon emissions?').
  *   **Reply:** "You're right that normative ends aren't truth-apt, but the means to achieve them often are. Condorcet justifies democracy as the best tool for identifying factual consequences of our values, even if the values themselves aren't subject to vote."

  **2. The Manipulation Objection (Deliberative Democrats)**
  *   **Phrasing:** "This model treats voters as isolated atoms. It ignores framing effects, media ownership, and elite manipulation which systematically correlate errors. Doesn't this render the 'wisdom of crowds' obsolete?"
  *   **Concede:** Real-world information environments are imperfect and often manipulated.
  *   **Hold Firm:** This is an argument for *better* information conditions (free press, education), not for abandoning majority rule.
  *   **Reply:** "I agree that manipulation threatens competence, but that's a diagnosis of current failures, not a flaw in the theorem. It actually strengthens the case for deliberative reforms that restore independence, rather than rejecting aggregation entirely."

  **3. The Independence/Correlation Objection (The Formalist & Tom)**
  *   **Phrasing:** "The theorem requires voter errors to be independent. In reality, voters share common information sources. If errors are correlated, convergence disappears. Isn't this just a mathematical toy?"
  *   **Concede:** Strict independence is impossible in social settings.
  *   **Hold Firm:** Conditional independence (given the state of the world) is sufficient; common signals don't necessarily break convergence if competence remains > 0.5.
  *   **Reply:** "Strict independence is indeed idealised, but later variants of the theorem show convergence holds even with weak correlation, provided voters aren't merely copying each other. The theorem sets a baseline for how much independence we *need*, rather than proving we already have it."

  **4. The Epistocracy Objection (Tom's Specific Trap)**
  *   **Phrasing:** "Even if the maths works, why 1-person-1-vote? If the goal is accuracy, shouldn't we weight votes by competence? Condorcet justifies epistocracy better than democracy."
  *   **Concede:** Weighted voting might increase raw accuracy in a vacuum.
  *   **Hold Firm:** Democracy requires equality of status, not just outcome reliability; also, measuring competence violates independence.
  *   **Reply:** "Condorcet justifies majority rule *given* political equality, which is a normative precondition of democracy. Furthermore, any mechanism to weight votes requires a meta-vote on competence, which reintroduces the very aggregation problems you're highlighting."

  **5. The Competence < 0.5 Objection (The Disaster Case)**
  *   **Phrasing:** "If average competence dips even slightly below 0.5, the theorem says the majority becomes *confidently wrong*. Isn't this a terrifying justification for democracy?"
  *   **Concede:** Yes, if voters are systematically incompetent, majority rule is disastrous.
  *   **Hold Firm:** Assuming competence < 0.5 is elitist and self-defeating; democracy presupposes citizen capacity.
  *   **Reply:** "That is correct, which is why the theorem isn't a blind mandate but a conditional one: democracy is justified *if* we regard citizens as competent. To assume otherwise is to reject the fundamental democratic premise of civic capacity."

  ---

  ## 2. FORCE OF OBJECTIONS

  | Objection | Force | Notes |
  | :--- | :--- | :--- |
  | **Ontological** | **High** | For this audience, if there's no "truth", the theorem is irrelevant. Narrow your scope to policy *means*. |
  | **Manipulation** | **Medium** | Mostly rhetorical. You can turn this into a plea for deliberative reform. |
  | **Independence** | **Critical** | **Tom's strongest point.** Technically damaging. Do not claim independence holds perfectly; claim it holds *enough* or is a regulative ideal. |
  | **Epistocracy** | **High** | Normatively dangerous. Makes you look like a secret elitist if handled poorly. |
  | **Competence < 0.5** | **Medium** | Scary, but easily deflected as a rejection of democratic values themselves. |

  ---

  ## 3. THE "QUIET HOPE" OBJECTION

  You suspect it's **Competence < 0.5**.
  *   **Verdict:** That is bad, but **The Ontological Objection (No Fact of the Matter)** is actually worse for *this* room.
  *   **Why:** If competence < 0.5, you can just flip the vote. If there is *no truth* to track, the theorem is vacuous.
  *   **Strategy:** If the "No Truth" point comes up, pivot immediately to **instrumental facts** (e.g., "Will this bridge collapse?"). Do not get dragged into defending moral truth.

  ---

  ## 4. STRATEGY ON IDEALISED CONDITIONS

  **Question:** *Does conceding that Condorcet only works under idealised conditions lose me anything?*
  **Answer:** **No, provided you frame it as a Normative Ideal.**
  *   **Don't say:** "The assumptions are unrealistic so the theorem is weak."
  *   **Do say:** "The assumptions describe the conditions under which democracy is *legitimate*. When reality falls short (e.g. correlated errors), it tells us what to fix (e.g. media regulation), not that we should abandon voting."
  *   **Tip:** Treat the theorem as a **diagnostic tool**, not a description of reality. This neutralises the Formalist's attack on realism.

  ---

  ## 5. DEFUSING TOM'S "EPISTOCRACY" TRAP

  Tom's point: *If truth is the goal, why not weight votes?*
  **Your Counter-Argument (Memorise This):**
  1.  **The Measurement Problem:** To weight votes, you need a test. Who designs the test? That decision requires a vote, leading to infinite regress.
  2.  **The Independence Break:** If people know votes are weighted, they defer to the 'experts', destroying the independence required for the theorem to work in the first place.
  3.  **The Normative Floor:** Condorcet explains why majority rule is *competent*, not why it is *just*. We need equality for justice; Condorcet assures us we don't sacrifice too much truth to get it.

  **Spoken Reply to Tom:**
  "Tom, weighting votes might boost accuracy in a lab, but in practice, selecting the weighters requires a democratic decision itself. Moreover, if voters know weights exist, they'll defer to the 'high scorers', creating the exact correlation errors that break the theorem. Equality isn't just a constraint; it's functional."

  ---

  ## 6. QUICK TIPS FOR THE ROOM

  *   **The Formalist:** Do not try to out-maths them. Use phrases like "asymptotic behaviour" and "conditional independence". Acknowledge the limit conditions.
  *   **The Deliberative Dems:** Use their language. Talk about "epistemic diversity" and "information pooling" rather than "aggregation".
  *   **Tom:** Stay calm. If he gets aggressive, smile and say, "That's precisely why we need the institutional safeguards I'm proposing."
  *   **General:** If you get stuck, say: "Condorcet isn't a full theory of democracy, it's a justification for the *voting mechanism* within a broader democratic framework."

  **Good luck. Don't let the git see you sweat.**
