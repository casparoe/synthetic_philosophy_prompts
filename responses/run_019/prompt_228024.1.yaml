prompt: |-
  So I just had a massive argument with my friend Tom that went until like 1am, and now I need help because I've stupidly agreed to present on this next week and he's going to be there.

  Background: I defended the Condorcet jury theorem as a genuine justification for majority rule -- roughly, that if voters are on average better than chance at picking the right option, a big enough majority vote is almost certain to get it right, and that's a real reason to value democracy and maybe to expand things like citizen assemblies. Tom's position was that the theorem is a mathematical toy that tells you basically nothing about actual politics, because voters aren't independent coin flips, they're all reading the same newspapers and making the same correlated mistakes, so you never get the magical convergence.

  Now I'm giving a 20-minute talk to our political theory research seminar defending my side, and Tom has told me exactly what he's going to ask me about in the Q&A, the smug git. The audience is: about ten political theorists (mostly sympathetic to deliberative democracy and instinctively hostile to anything that smells like reducing politics to statistics), one formal theorist who actually knows the probability theory and will pounce on any sloppiness about the independence assumption, and a couple of empirically-minded people who'll want to know what "voter competence" even means on a real policy question where there's arguably no fact of the matter about the right answer.

  Prepare me for the question period. I want:

  1. The objections in roughly the order they'll actually come up, phrased the way these people will phrase them -- the deliberative democrats won't talk about independence assumptions, they'll talk about manipulation and framing effects, so pitch it right.
  2. For each one: what I should concede straight away, what I should hold firm on, and a two-or-three sentence reply I can actually deliver out loud.
  3. Which objections have real force and would genuinely damage the thesis versus which are more rhetorical than substantive.
  4. The objection I'm quietly hoping nobody raises (I suspect it's about what happens to the theorem when average competence dips below 0.5, but tell me if there's a worse one).
  5. Whether conceding that Condorcet only justifies majoritarianism under idealised conditions actually loses me anything that matters, or whether I should just give that ground early.

  Also, one thing Tom said that I couldn't answer on the spot: he reckons that even if the theorem worked perfectly, it would justify epistocracy-by-lottery (weighing votes by competence) just as much as democracy, so it can't be a specifically democratic justification. I need a reply to that one especially.

  Please write the whole thing in British English, and keep it usable as an actual prep sheet I can glance at during questions, not an essay.
