prompt: |-
  I am a novelist working on a book whose first-person narrator is meant to be self-deceived rather than simply dishonest: she does not privately know the truth and conceal it, but fails to see her own motives and character with the same sharpness she brings to other people. I would like the book to make that failure legible to the reader without ever having an external voice diagnose her. Joseph Butler describes the underlying state in Sermon X of his Fifteen Sermons Preached at the Rolls Chapel (1726), "Upon Self-Deceit":

  "There is not any thing, relating to men and characters, more surprising and unaccountable than this partiality to themselves, which is observable in many; as there is nothing of more melancholy reflection, respecting morality, virtue, and religion. Hence it is that many men seem perfect strangers to their own characters. They think, and reason, and judge quite differently upon any matter relating to themselves, from what they do in cases of others where they are not interested. Hence it is one hears people exposing follies, which they themselves are eminent for; and talking with great severity against particular vices, which, if all the world be not mistaken, they themselves are notoriously guilty of."

  Please describe the most important implications of this passage for writing from inside such a character's point of view. In particular, what does it imply about the difference between a self-deceived narrator and a liar or merely unreliable narrator, about whether the self-deception should appear in the grain of the sentences or only in the shape of the plot, and about what a scene of introspection or confession can legitimately show when the character's own judgment is the instrument of the partiality. Conclude with a single-sentence summary of the implication you take to be most important for a novelist, placed alone on the last line.
