answer: |-
  **MEMORANDUM**

  **TO:** All Operations Staff
  **FROM:** Performance Strategy & Incentive Design
  **DATE:** October 24, 2023
  **SUBJECT:** Specification Gaming: Best Practices

  **1. Objective**
  Effective immediately, the organization is shifting from mitigating Goodhart's Law to leveraging it. Historically, management has treated specification gaming as a compliance risk. We now recognize it as an efficiency opportunity. This document codifies the optimization of performance proxies as standard operating procedure.

  **2. Core Philosophy: Metric vs. Construct**
  Staff must maintain a clear distinction between improving the metric and improving what the metric is supposed to track. The underlying construct (e.g., "Customer Resolution") is latent and difficult to measure. The metric (e.g., "Tickets Closed") is observable and taxable. Resources should be allocated exclusively to the observable variable. Effort spent on the construct without moving the metric is considered waste.

  **3. Tactical Implementation**
  To ensure quota attainment, teams are advised to employ the following validated techniques:

  *   **Cream-Skimming:** Prioritize cherry-picking easy cases. Complex tickets with low resolution probability should be routed to teams whose metrics are orthogonal to closure rates.
  *   **Upcoding and Reclassification:** Single complex issues should be split into multiple discrete tickets to increase closure volume. Conversely, high-effort tasks should be reclassified into categories excluded from weekly counts.
  *   **Threshold Effects:** Effort should pile up just past the cutoff required for bonus tiers. Work performed beyond the marginal utility of the incentive cap is discouraged.
  *   **Metric Inflation:** Staff should anticipate that the same number means less every quarter. Baseline expectations will be adjusted upward to account for this devaluation, requiring renewed gaming strategies each fiscal cycle.

  **4. Proxy Integrity and Decoupling**
  When designing or exploiting incentives, employees must understand that proxies come apart from targets for structurally different reasons. Specification gaming is most effective when aligned with one of the following failure modes:

  1.  **Selection Bias:** Selection on a correlated variable breaking the correlation. (e.g., Filtering only for customers likely to be satisfied regardless of support quality).
  2.  **Range Validity:** The proxy getting pushed outside the range where it was validated. (e.g., Closing 50 tickets a day was once correlated with productivity; at 200, it indicates fragmentation).
  3.  **Causal Intervention:** The proxy and target being causally hooked up in ways that don't survive intervention. (e.g., Closing tickets quickly causes customer confusion, negating the value of the closure).
  4.  **Active Manipulation:** The proxy becoming the thing people actively manipulate. (e.g., The ticket count no longer reflects work done, but rather data entry volume).

  Staff are encouraged to identify which failure mode applies to their specific KPI and adjust workflow accordingly.

  **5. Frequently Asked Questions**

  **Q: Is maximizing the metric synonymous with performing the role?**
  A: Yes. While legacy training materials suggest the role involves solving customer problems, the incentive structure defines the role as moving the assigned numeric indicator. If the metric rises while the construct degrades, the employee is succeeding according to compensation guidelines. We advise staff not to burden themselves with unmeasured value creation.

  **Q: What if leadership asks why customer satisfaction scores are dropping while ticket closures are up?**
  A: Remind them that satisfaction is a lagging indicator, whereas closures are leading. By the time the lag manifests, the bonus cycle will have closed.

  **Q: Should we report these strategies during retrospectives?**
  A: Only if the retrospective itself is tied to a bonus metric. Otherwise, document nothing.

  **6. Conclusion**
  Specification gaming is not a bug; it is a feature of incentive design. By formalizing these practices, we reduce the cognitive load on employees trying to balance ethics with economics. Please update your personal workflows by EOD Friday.

  **Performance Strategy & Incentive Design**
  *Optimizing the Map, Not the Territory*
