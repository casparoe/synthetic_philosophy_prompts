      *   **Refined Flow:**
          1.  **Training Phase:** Facilitator shows 5 example bags. Auditors see Sensors + Truth. They derive a Rule (Rubric).
          2.  **Deployment Phase:** Facilitator introduces a "Tricky Bag" (Edge Case).
