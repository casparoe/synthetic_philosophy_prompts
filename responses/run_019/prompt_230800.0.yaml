answer: |-
  The debate is structurally ill-posed because it attempts to classify a soteriological path within the framework of Western normative ethics, resulting in a category error that semantic clarification alone cannot resolve. This diagnosis implies the disagreement is not merely verbal, nor purely substantive, but methodological: both camps are answering Western philosophical questions using Buddhist data, rather than deriving questions from the internal logic of the Buddhist path. The consequentialist camp correctly identifies that the tradition evaluates actions by their capacity to reduce *dukkha*, but incorrectly assumes this functions as a moral criterion of rightness rather than a diagnostic indicator of spiritual health. The virtue-ethics camp correctly identifies that the tradition prioritizes the transformation of the agent's mind, but incorrectly assumes this functions as a deontological constraint or character ideal rather than a therapeutic technique for eliminating cognitive distortion. Because Buddhist "ethics" (*sila*) is instrumentally subordinate to meditation and wisdom within a soteriological framework, treating it as a freestanding normative system guarantees that evidence will be marshalled to support whichever Western category matches the selected slice of practice.

  Your hypothesis that "consequentialism" is doing too much work is correct but incomplete; the deeper equivocation lies in the word "ethics" itself, which oscillates between social morality, psychological hygiene, and soteriological necessity within the texts. The stalemate persists because both sides assume "Buddhist Ethics" is a unified theory comparable to Utilitarianism or Aristotelianism, ignoring that the corpus contains stratified instructions for different audiences (monastics vs. laypersons, Sravakayana vs. Mahayana) that were never intended to cohere into a single systematic account. The consequentialist reading fits Mahayana rhetorical expansions of compassion but fails against Vinaya strictures, while the virtue-ethics reading fits monastic training but fails against the bodhisattva's willingness to break precepts for the greater good. Progress requires abandoning the goal of fitting Buddhism under a single Western heading and instead adopting a functionalist analysis that asks under what specific conditions the tradition prioritizes outcomes over intentions, or vice versa. Concrete progress would look like a shift from asking "Is Buddhism X?" to mapping the specific contexts in which Buddhist discourse employs consequentialist reasoning versus aretaic reasoning, acknowledging that these may be context-dependent tools rather than expressions of a underlying meta-ethical commitment. Ultimately, the field must accept that Buddhist thought may operate with a pluralistic normative architecture that resists reduction to any single Western label, treating the disagreement not as a problem to be solved but as a feature of the material to be explained.
