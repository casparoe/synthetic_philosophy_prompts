answer: |-
  You raise a most pertinent objection, and I confess I anticipated some might find that section troublesome. However, I believe you are conflating physical attributes with channels of communication. When I speak of beauty or speed, I refer to qualities that are irrelevant to the questions put by the interrogator. The interrogator does not ask, "Run to the wall," or "Show me your smile." But if telepathy exists, as the statistical evidence from Duke University suggests, it provides a direct channel from the human mind to the interrogator's mind, bypassing the teleprinter entirely. It is not that the machine is penalised for lacking a sense; it is that the experimental conditions are compromised if one participant can ignore the rules of engagement.

  Consider it rather like a sealed room in a magic trick. We do not say the magician is penalised for not having X-ray vision when we lock the box; we say we are ensuring the trick relies on skill, not secret access. If the human can transmit answers without typing, the game ceases to be about imitation of intellectual output and becomes a test of psychic leakage. We must ensure the only path for information is the one we can monitor. Do you not agree that if one player could whisper while the other must write, the test would be void, regardless of the whisperer's intelligence?
