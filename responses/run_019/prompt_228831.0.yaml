  No. It looks like one because the Scan-Copy is *perfect* and Grandma is *blurry*, yet the Copy is a "stranger" and Grandma is "real."
  *   **Resolution:** The Copy is a stranger because it is **competing with the Original**. Grandma is real because she has **no competition**.
