  The argument goes wrong in **Step (2)**: the move from the premise that the Constitution is "just its text" to the conclusion that a clause has legal effect "only if the text plainly says so."

  This step conflates **textualism** (the view that law is found in the enacted text rather than external intentions) with **verbalism** or a "magic words" doctrine (the view that legal effects require specific keywords). A text can create legal rights or obligations through necessary implication, context, or structure without explicitly uttering a specific term. For example, a text granting the power to "raise armies" implies the power to conscript, even if "conscription" is not plainly stated. The friend's extraction imposes a hyper-literal constraint on Douglass's principle that Douglass's quote does not strictly necessitate; Douglass argues that *intentions* must be plainly stated to count, not that *legal effects* must be explicitly named to exist.

  **What would it cost Douglass to reject this step?**

  If Douglass rejects Step (2) and admits that legal effects can arise from textual implication rather than explicit wording, he undermines the core evidentiary basis of his 1860 argument.

  1.  **Loss of the "Silence" Argument:** Douglass's primary evidence that the Constitution is anti-slavery is the *absence* of the words "slave," "slavery," or "property" in the text. He argues that because the text does not *plainly say* "property in man," it grants no such right. If he rejects the "plainly says" requirement, he must concede that the clauses referring to "persons held to service or labor" could *imply* a property right even without using the word "property."
  2.  **Vulnerability to *Dred Scott* Reasoning:** Chief Justice Taney's opinion in *Dred Scott* (1857) relied heavily on implication and historical context to argue that the Constitution recognized slaves as property. If Douglass allows for interpretation based on implication rather than strict verbal absence, he opens the door to the pro-slavery argument that the Fugitive Slave Clause and Three-Fifths Clause *necessarily imply* the legitimacy of the master-slave relationship to function.
  3.  **Shift to Natural Law:** To maintain his anti-slavery conclusion without the "magic words" shield, Douglass would be forced to rely more heavily on an extra-textual **presumption of liberty**. He would have to argue that when the text is ambiguous or implicit, the default interpretation must favor freedom. While Douglass does hint at this, his Glasgow speech leans heavily on the claim that the text *itself* is clean. Rejecting Step (2) forces him to admit the text is ambiguous and requires a moral principle to resolve, moving him away from the strict legalistic ground he occupies to appeal to constitutional conservatives.

  In short, Step (2) is the shield that protects Douglass's thesis from the pro-slavery reading of the compromise clauses. To reject it is to admit that the Constitution's text *could* bear a pro-slavery meaning, requiring Douglass to fight the battle on the terrain of moral interpretation rather than textual certainty.
