answer: |-
  It is incredibly common to see this dynamic in academic settings, and you are right to trust your instinct that standard mediation techniques often fail here because they treat the conflict as interest-based or relational when it is actually semantic. The procedure you need is essentially a structured translation test that forces the parties to separate their observations from their labels, and while it sounds simple, the discipline lies in enforcing it strictly enough to break the habit of talking past one another. To run this in the room, you start by isolating the contested term, which usually reveals itself quickly because it is the word both parties keep returning to with increased volume, and once you have identified it, you instruct both sides that for the next five minutes they are forbidden from using that word or any direct synonyms. You then ask each party to describe the situation and their grievance using only descriptive language about actions, outcomes, and data, effectively forcing them to operationalize their claim without the loaded label. Once both have restated their positions without the forbidden term, you compare the two statements to see if they contradict each other on matters of fact. If the restated claims are compatible, meaning both parties agree on what happened but were arguing over whether to call it X, you have identified a purely verbal dispute. If the restated claims still contradict each other on what occurred or what the data shows, the dispute is substantive and requires evidence evaluation. However, there is a third outcome where the parties agree on the facts and even agree on the definition of the term, but they disagree on whether that term should be applied to this specific case because they are fighting over which convention ought to govern their future interactions, which places the dispute in the normative bucket.

  Once you have sorted the dispute into one of these three buckets, your mediation move changes significantly. For the purely verbal dispute, your job is to facilitate a dissolution by explicitly highlighting the agreement they just uncovered and framing the conflict as a translation error rather than a betrayal of trust, allowing them to save face while moving on. For the substantive dispute, you proceed with standard fact-finding or evidence weighing, because the semantic test has confirmed there is a real disagreement about the world. For the normative dispute, which is often the trickiest, you cannot dissolve the conflict because the fight is real, but it is not about truth; it is about policy, so you shift the mediation from determining who is right to negotiating which definition serves their shared goals better, treating the definition as a tool rather than a discovery. You must be careful with borderline cases where parties agree on a definition but disagree on whether a specific case falls under it, such as arguing over whether a specific shade of color counts as red, because this often looks verbal but is actually a factual dispute about perception or measurement that requires calibration rather than definition. You also need to watch for load-bearing words in documents like grant conditions or authorship criteria, because even if the disagreement is purely verbal conceptually, the consequences are material, and telling them it is just semantics will feel dismissive; in these cases, you acknowledge the semantic nature of the disagreement but pivot immediately to the practical consequence, asking them to negotiate the outcome directly rather than fighting over the label that triggers it. Finally, be prepared for resistance when a party's identity is invested in their usage, because asking them to restate their claim without the word can feel like asking them to abandon their intellectual contribution, and if you see genuine distress or refusal during the restatement phase, you should abandon the procedure and return to interest-based bargaining, as pushing the semantic test too hard against identity investment can damage rapport irreparably.

  To show you how this works in practice, consider a case where two lab members are fighting over whether an algorithm discriminated against a specific demographic. One party insists the algorithm discriminated because the output showed statistically significant disparate outcomes for that group, while the other insists it did not discriminate because the code contained no variables for race and the developers had no intent to bias the result. You intervene by banning the word discrimination and any synonyms like bias or fairness, asking them to describe the system without those terms. The first party restates their claim by saying the system produces negative outcomes for Group A at a higher rate than Group B, and the second party restates their claim by saying the system uses no demographic inputs and was designed without intent to harm. When you compare these statements, you see they do not contradict; both agree on the code structure and both agree on the outcome statistics. This lands you in the third bucket, the normative dispute, because they agree on the facts but disagree on whether the label discrimination should attach to unintentional disparate outcomes. Your move here is not to dissolve the fight but to reframe it as a policy decision, asking them to agree on whether their lab will treat disparate outcomes as a violation of their ethics charter regardless of intent, which moves them from arguing about truth to negotiating a standard of practice.

  Now consider a case where the procedure gives you an answer you might not like, such as two co-authors fighting over who contributed enough to merit authorship on a paper. They agree on the definition of authorship in their field, and they even agree on the factual record of who did which tasks, yet they are furious with each other. When you run the translation test and ban the word authorship, they restate their claims in ways that are factually compatible, suggesting this is a verbal or normative dispute about the threshold for credit. However, when you suggest dissolving the dispute or negotiating the definition, the anger does not subside, because the real fight is not about the concept of authorship but about the resources and status that authorship commands, such as eligibility for a job or a grant. In this instance, the procedure correctly identifies that the conceptual disagreement is verbal, but it fails to resolve the conflict because the word is a proxy for a material stake. Here you must be honest that the semantic tool has reached its limit; you acknowledge that they agree on the facts and the definitions, but you point out that the stakes attached to the label are the actual source of tension, and you shift the mediation to dividing the tangible benefits or finding alternative ways to certify contribution that do not rely on the contested label. This is where you have to use judgment, because if you insist on the verbal diagnosis when the parties are fighting over livelihoods, you will look naive, so you use the procedure to clear the conceptual fog but then immediately pivot to the underlying interests that the fog was hiding.

  There are limits to this approach that you need to keep in mind so you do not overapply it. The procedure breaks down when the contested word is so entangled with the parties' self-conception that restating the claim feels like a betrayal of their own work, and in those moments, pushing for semantic precision can escalate the conflict rather than calm it. It also fails when the dispute is actually about power disguised as semantics, where one party knows the disagreement is verbal but uses the ambiguity to maintain leverage over the other, because exposing the verbal nature of the dispute removes their leverage and they will resist the translation test. You should also be aware that some disputes are hybrid, where part of the disagreement is verbal and part is substantive, and the procedure might isolate the verbal part while leaving the substantive part still simmering, requiring you to run the test multiple times on different terms. Ultimately, this tool is best used as a diagnostic triage rather than a cure-all, allowing you to quickly clear away the semantic noise so you can see whether you are dealing with a misunderstanding, a factual disagreement, or a negotiation over norms, but you must remain willing to set it aside when the human stakes exceed the conceptual ones.
