  **ELECTORAL COMMISSION**
  **OPINION OF THE CHAIR**
  **SUBJECT: REGULATORY FRAMEWORK FOR UPCOMING REFERENDUM**

  **1. Recommendation**

  I recommend that the Commission adopt the **middle course** for the conduct of the referendum campaign. Specifically, we should permit organised national campaigning by incorporated associations but impose strict equalised expenditure caps across designated umbrella organisations, accompanied by equal blocks of public funding and broadcast time. This approach best satisfies our constitutional obligations, ensures the electorate is adequately informed, and aligns most faithfully with the philosophical principles invoked during our deliberations.

  **2. Interpretation of Philosophical Precedent**

  Our colleague's reliance on Rousseau's *The Social Contract* is well-founded, yet the conclusion drawn—that a closed model is required—overlooks the text's critical qualification. The passage cited does indeed posit an ideal wherein citizens communicate not at all, ensuring the "general will" emerges from the sum of small differences. However, Rousseau explicitly categorises this isolation as the "sublime and unique system established by the great Lycurgus," implying it is a historical exception rather than a practicable rule for modern states.

  The operative instruction for any state containing partial societies—which ours undoubtedly does—is found in the subsequent sentences: "But if there are partial societies, it is best to have as many as possible and to prevent them from being unequal." The colleague's proposal seeks to eliminate partial societies; the text acknowledges this is likely impossible outside Sparta and offers a fallback: pluralism tempered by equality. To ban organised campaigning entirely is to ignore the "But if" clause. Furthermore, Rousseau conditions the general will on the people being "furnished with adequate information." The advisory report correctly notes that parties and associations are the principal vessels of such information. A closed model, restricting advocacy to uncoordinated individuals, risks failing this informational prerequisite, thereby undermining the very legitimacy Rousseau seeks to protect. We are not in the position of Lycurgus; we must follow the precaution of Solon, Numa, and Servius.

  **3. Constitutional and Contextual Constraints**

  The referendum context strengthens the application of Rousseau's fallback rather than his ideal. Unlike a general election, which selects representatives across various domains, a referendum poses a single binary question. This simplifies the deliberation but heightens the risk that one dominant faction—the "cartel" alleged by the initiative sponsors, or conversely the challengers—might prevail as the "single difference" Rousseau warns against. If one side commands disproportionate resources, the result reflects not the general will, but the will of the strongest association.

  However, we are bound by the Constitutional Court's jurisprudence. Restrictions on campaigning must be proportionate, and political parties enjoy protected expression. A closed model prohibits parties from communicating their stance on a fundamental constitutional change, a restriction likely deemed disproportionate and violative of protected expression. The open model, while constitutionally safe, risks the inequality Rousseau identifies. The middle course strikes the necessary proportionate balance: it preserves the right to associate and campaign but mitigates the distorting effect of wealth and organisational dominance through equalisation.

  **4. Specific Conditions of the Middle Course**

  To operationalise this model, the Commission shall implement the following conditions:

  *   **Designation of Umbrella Organisations:** The Commission will designate two lead campaign groups, one advocating for the 'Yes' side and one for the 'No' side. These designations shall be granted to the coalitions demonstrating the broadest support across civil society, not merely the largest financial backing.
  *   **Expenditure Caps:** A strict ceiling on campaign expenditure shall apply equally to both designated groups. This cap shall be set at a level sufficient to ensure national reach but low enough to prevent an arms race in funding.
  *   **Public Funding and Broadcast Time:** Both designated groups shall receive identical blocks of public funding and broadcast time on public channels. Private broadcast advertising shall be prohibited to prevent circumvention of the equality principle.
  *   **Disclosure:** All donations above a minimal threshold must be disclosed weekly during the campaign period to ensure transparency regarding the interests behind the partial societies.

  **5. The Strongest Counter-Argument**

  I must address the strongest argument against this recommendation, which my colleague supporting the closed model may rightly advance. The objection is that equalisation artificially constrains political speech and may inadvertently entrench the status quo. By capping expenditure, we limit the ability of passionate citizens to persuade their neighbours, potentially dampening turnout and engagement. Furthermore, there is a risk that designating umbrella organisations grants the Commission excessive discretion in deciding which voices represent the 'Yes' or 'No' camps. If the existing parties are indeed a self-protecting cartel, as the initiative claims, granting them equal status with citizen groups under this framework might legitimise their dominance rather than dilute it. They may possess inherent advantages in membership and infrastructure that equal funding cannot offset. Additionally, from a liberal perspective, any cap on spending is a restriction on free expression; if the 'No' camp believes their case is objectively stronger, why should they be handicapped from making it as loudly as possible? These concerns touch on the core tension between equality of opportunity and liberty of expression.

  **6. Conclusion**

  These concerns are substantial, yet they are less damaging than the alternatives. The closed model risks informational vacuity and constitutional violation; the open model risks the domination of the general will by a single partial association. The middle course accepts the existence of factions as inevitable but seeks to neutralise their inequality, adhering to Rousseau's practical prescription for ensuring the people do not deceive themselves. I urge the Commission to approve this framework.
