      Apply Otto's criteria. Phone is constantly available, easily accessible (biometric/passcode), automatically endorsed (we trust contacts/photos implicitly). Under EMT, the phone is constitutive of the agent. Therefore, *Riley* isn't just about property rights; it's about cognitive liberty. The warrant protects the integrity of the extended cognitive system. However, EMT misses the normative weight. EMT explains the *integration*, but not the *right*. The Court relies on "privacy of life," which is a social/legal construct, not a metaphysical one. EMT might imply a search is lobotomy, but the law frames it as intrusion.

      *Drafting Section 2 (Case -> Theory):*
      Does *Riley* confirm Parity? Yes, implicitly. The Court argues that the phone holds the sum of an individual's private life, analogous to internal memory but amplified. It treats the phone differently than a wallet because of its cognitive depth.
      Does it expose problems? Yes. The law requires binary categories (phone vs. wallet), while EMT is continuous (degrees of coupling). Also, the "automatic endorsement" criterion is shaky legally; encrypted data isn't "automatically" accessible like memory. The Court protects the *potential* access, not just the actual coupled state.
      Where is theory silent? EMT doesn't account for third-party data (cloud, social media) which the Court also protects. EMT focuses on the individual-agent coupling, but *Riley* protects networked data too.
      Does the Court get close? Yes, Chief Justice Roberts' opinion mentions that a phone is an "attachment" to the self, almost an organ of modern life, though he stops at "privacy" rather than "constitution."

      *Refining the Argument:*
      Make sure to distinguish between *constitutive* (EMT) and *contained* (Court). The Court says the phone contains privacies. EMT says the phone *is* the memory. This is a crucial distinction. The Court protects the *information*, EMT protects the *process*.
      Also, note the "search incident to arrest" doctrine. It's about officer safety and evidence preservation. The Court said phones don't threaten safety (unlike a gun) and data can be preserved remotely (unlike physical evidence). This functional analysis aligns with EMT's functionalism, but reaches a different conclusion about rights.

      *Final Polish:* Ensure the tone is academic and direct. Avoid fluff. Check the summary line constraint.

      *Self-Correction on "Automatic Endorsement":* In *Riley*, the phone was locked. Does this violate the "easy access" criterion of EMT? Clark & Chalmers argue that if you trust the source, it counts. A passcode is a barrier, but once crossed, the trust is implicit. The Court notes the barrier protects the privacy. This is a point of friction: EMT requires transparency; law requires opacity (security) to protect privacy.

