answer: |-
  Mapping the Extended Mind Thesis (EMT) onto *Riley v. California* reveals a striking convergence between metaphysical functionalism and legal intuition, though the two diverge on normative grounding.

  **1. Theory onto Case: The Phone as Cognitive Organ**
  Under Clark and Chalmers' criteria, the cell phone in *Riley* qualifies as a constitutive part of the cognitive agent. It meets the "Otto criteria": it is constantly available (carried on the person), easily accessible (unlockable via passcode or biometric), and subject to automatic endorsement (users trust stored contacts, photos, and notes implicitly without critical scrutiny each time). If EMT holds, the police search prohibited in *Riley* was not merely an inspection of property but a trespass into the defendant's extended cognitive system. The Court's reasoning mirrors this functional integration when it distinguishes the phone from a wallet or cigarette pack, noting that the phone holds the "privacies of life" and functions as a digital repository of memory and identity. However, EMT misdescribes the legal stakes here. The Court protected *privacy* and *dignity*, not *cognitive integrity*. EMT is descriptive—it claims the phone *is* part of the mind—but it lacks the normative machinery to explain why that integration demands a warrant. A tool can be cognitively constitutive without being legally protected (e.g., a public whiteboard used for calculation); thus, EMT explains the phone's特殊性 (specialness) but cannot generate the Fourth Amendment right itself.

  **2. Case onto Theory: Legal Boundaries vs. Cognitive Gradients**
  Running the analysis in reverse, *Riley* stress-tests the Parity Principle. The decision confirms the principle implicitly by acknowledging that digital storage is functionally equivalent to, yet quantitatively superior to, internal memory and physical papers, warranting distinct treatment. However, the case exposes EMT's inability to handle legal line-drawing. The law requires binary categories (phone vs. other objects), whereas EMT proposes a gradient of coupling; *Riley* draws a hard line at "cell phone" that EMT would find arbitrary (what about a smartwatch or AR glasses?). Furthermore, the Court's reliance on encryption and passwords highlights a tension with EMT's "easy access" criterion; biological memory is transparent, but a locked phone is opaque, suggesting the legal protection relies on the *potential* for intimacy rather than actual cognitive transparency. Finally, the Court's reasoning gets close to treating the phone as part of the self—calling it an attachment to the person—without committing to the metaphysics, showing that the law can operationalize the *value* of the extended mind without accepting the *ontology* of it.

  Summary: Riley intuitively validates the extended mind by recognizing the phone's functional integration with identity, but ultimately reveals the theory's inability to ground normative legal rights, showing that cognitive constitution does not automatically translate to constitutional protection.
