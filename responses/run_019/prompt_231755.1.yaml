      *   **Topic:** Philosophy of Mind & Tech course, specifically Clark & Chalmers' Extended Mind Thesis (EMT).
      *   **Case Study:** *Riley v. California* (2014 US Supreme Court case regarding warrantless cell phone searches incident to arrest).
      *   **Task:** Analyze *Riley* as a test case for EMT in *both* directions.
          1.  **Theory -> Case:** Map the case onto EMT. Is the phone part of the cognitive system? What criteria (reliable access, trust, automatic endorsement) are met? If the phone is part of the mind, what was the Court protecting (part of person vs. object)? Does the ruling rely on privacy/autonomy ideas EMT doesn't capture?
          2.  **Case -> Theory:** What does *Riley* do to EMT? Does it confirm the parity principle? Does it expose problems (law drawing lines, lack of automatic transparency)? Where is the theory silent? Does the Court's reasoning get close to treating the phone as part of the self without committing?
      *   **Constraints:** Do not restate facts of *Riley*. Do not write a general essay on phone privacy. Focus on disciplined mapping (what theory says case was about, what it explains, misses, and what case shows about theory).
      *   **Ending:** One line beginning 'Summary:' stating the bottom line in a single sentence.

  2.  **Deconstruct the Extended Mind Thesis (EMT):**
      *   **Core Claim:** Cognitive processes aren't confined to the skull; external tools can be constitutive parts of the cognitive system if coupled correctly.
      *   **Parity Principle:** If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process.
      *   **Criteria (Otto's Notebook):**
          1.  Constant availability (always carried).
          2.  Easy access (automatic retrieval).
          3.  Automatic endorsement (trusted implicitly, not critically scrutinized every time).
          4.  Past endorsement (information was consciously placed there).

  3.  **Deconstruct *Riley v. California*:**
      *   **Holding:** Police need a warrant to search digital contents of a cell phone seized incident to arrest.
      *   **Reasoning:** Phones are not just another personal effect (like a wallet or cigarettes). They hold "the privacies of life." Quantitative difference (storage capacity) leads to qualitative difference (nature of privacy interest). They contain photos, messages, location history, medical info, etc.
      *   **Key Concept:** Privacy, dignity, autonomy, protection against unreasonable search and seizure (4th Amendment).

  4.  **Direction 1: Theory -> Case (Mapping EMT onto *Riley*)**
      *   *Is the phone a proper part?* Under EMT, yes. It meets Otto's criteria for most users (constant carry, easy access, trusted storage of memories/contacts/calendars).
      *   *What was the Court protecting?* If EMT is true, the Court was protecting the *mind* itself, not just property. A search of the phone is a search of the extended cognitive system.
      *   *Does EMT capture the ruling?* EMT explains *why* the phone is special compared to a wallet (functional integration vs. mere container). However, the Court relies on *privacy* and *expectation of privacy*, not *cognitive constitution*. EMT is descriptive/metaphysical (what *is* the mind?), while *Riley* is normative/legal (what *rights* attach?).
      *   *Mismatch:* EMT doesn't necessarily grant privacy rights. Just because something is part of the mind doesn't legally mean it's protected from search (e.g., compelled testimony vs. physical evidence). But *Riley* treats the data as intimately linked to the person.

  5.  **Direction 2: Case -> Theory (What *Riley* does to EMT)**
      *   *Confirmation:* The Court's reasoning mirrors the Parity Principle implicitly. They argue that because the phone holds what used to be in the head (photos, letters, logs) plus much more, it deserves higher protection. They recognize the functional equivalence between internal memory and external storage.
      *   *Exposure of Problems:*
          1.  *The Line-Drawing Problem:* The law needs a bright line. EMT is gradient (degrees of coupling). *Riley* draws a hard line at "cell phone" vs. "other objects." EMT might suggest a smartwatch or AR glasses are also mind, but the law lags.
          2.  *Automatic Endorsement:* *Riley* acknowledges encryption and passwords. This complicates "automatic access." If I have to unlock it, is it as transparent as biological memory? The Court notes the depth of data, not necessarily the transparency of access.
          3.  *Normative Gap:* EMT describes cognition; *Riley* protects dignity/privacy. A tool can be cognitive without being private (e.g., a public whiteboard used for calculation). *Riley* protects the *content* because of its intimacy, not because it's *cognitive*.
      *   *Silence:* EMT is silent on *ownership* and *legal personhood*. The Court treats the phone as property that contains intimate details, not as a literal body part.

  6.  **Synthesizing the Analysis:**
      *   *EMT on Riley:* The Court intuitively grasped the extended mind without the metaphysics. They recognized the phone isn't just a container (wallet) but a repository of identity and memory. If the phone is part of the mind, the warrant requirement is a protection against cognitive trespass.
      *   *Riley on EMT:* The case highlights EMT's normative limitations. EMT says the phone *is* mind; *Riley* says the phone *contains* life. The legal distinction relies on privacy expectations, which EMT doesn't generate. Also, the legal need for categorical rules clashes with EMT's functionalist gradient.
      *   *Key Tension:* Constitution vs. Privacy. EMT says the phone *is* me. *Riley* says the phone *has info about* me. The Court stops short of calling it a body part, but treats it with similar reverence.

  7.  **Drafting the Response (incorporating constraints):**
      *   *No fact restatement.*
