      *   **Careers Adviser's Argument (Expected Value Heuristic):** We must act on the best available information. Rough numbers are better than no numbers.
          *   *Weakness:* Can lead to false precision or ignoring hard-to-quantify values (like community, personal integrity, burnout).
          *   *Strength:* It's actionable and aligns with the goal of "doing good."

