answer: |-
  The *Civicus* is a city-state's treaty ship, originally used to sign a maritime border agreement that grants exclusive fishing rights to whichever vessel represents the city at the annual renewal ceremony. The agreement specifies that only the vessel composed of the materials present at the signing may validate the rights. As the *Civicus* rots, the city replaces planks one-by-one to keep it afloat for general transport, but the maritime council rules this continuously repaired hull is legally a new vessel ineligible for the treaty ceremony. The original planks are stored in a warehouse, never assembled into a floating vessel during this period, until citizens fund their reassembly into a seaworthy hull specifically to reclaim the treaty rights at the next ceremony.

  The repaired ship maintains the exact shape, design, and structural integrity of the original throughout the replacement process, preserving its visual and architectural identity without interruption. Because the replacement happens gradually, the ship's form never undergoes a disruptive break that would suggest a new object has been created. Thus, any observer tracking spatial configuration would identify the repaired vessel as the original.

  The repaired ship retains a continuous spatiotemporal path of material overlap, where each new plank bonds with existing old planks, ensuring no moment exists where the ship ceases to be composed of its immediate predecessor's matter. This gradual exchange preserves the physical continuity required for material identity, as there is never a point where the ship is wholly disassembled. Consequently, the repaired ship holds the stronger claim to being the same physical object through time.

  The original ship's primary social role was securing fishing rights through a ceremony requiring original materials, a role the repaired ship cannot fulfill due to material replacement. While the repaired ship serves a general transport utility, it fails to sustain the specific normative practice that defined the original artifact's purpose. The rebuilt ship uniquely satisfies the conditions to resume that specific normative practice, thereby continuing the original function.

  The load-bearing feature is the treaty's explicit stipulation that material constitution, rather than structural continuity, determines eligibility for the rights-conferring ceremony.

  If the treaty allowed any seaworthy vessel to validate the rights, the repaired ship would naturally assume the functional role, collapsing the distinction between the two candidates. In that case, function continuity would align with form and matter, favoring the repaired ship.

  A defender of the losing ship would argue that the treaty's material clause is a bureaucratic technicality that should not override the practical reality that the repaired ship maintained the city's naval presence and capacity throughout the transition. This defense prioritizes operational capacity over ceremonial technicalities to establish identity.
