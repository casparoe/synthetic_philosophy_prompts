answer: |-
  # Distributive Ethics: A Diagnostic Tree

  **Instructions:**  
  This handout is designed to help you locate your intuitive commitments within the logical space of distributive justice. Do not worry about the names of the theories yet. For each pair of scenarios, select the option that matches your all-things-considered moral verdict. There are no 'correct' answers, only consistent or inconsistent ones.

  ---

  ## Part 1: The Decision Tree

  ### Node 1: The Currency of Equality
  *Imagine two societies. In both, everyone has identical income and resources. However, in Society X, there is a rigid caste system where some people are treated as socially inferior, addressed by superiors as 'servants', and denied political voice. In Society Y, everyone relates as civic equals.*

  *   **A:** Society Y is strictly better. The inequality of status is the fundamental problem; resource distribution is only important insofar as it supports equal status.  
      *(Go to Leaf R)*
  *   **B:** Society X and Y are equally just regarding distribution. My concern is primarily with the pattern of well-being or resources, not social relations.  
      *(Proceed to Node 2)*

  ### Node 2: The Leveling-Down Case
  *Consider two populations. In Population A, half the people have a well-being level of 100, and half have 50. In Population B, everyone has a well-being level of 50. No one in Population B is better off than anyone in Population A; the better-off group in A is made worse off to match the worst-off, and the worst-off gain nothing.*

  *   **A:** Population B is, in at least one significant respect, better than (or as good as) Population A, simply because it is more equal.  
      *(Go to Leaf T)*
  *   **B:** Population A is strictly better. Making some worse off without benefiting anyone else cannot be an improvement.  
      *(Proceed to Node 3)*

  ### Node 3: The Sufficiency Threshold
  *You have a resource to allocate. Recipient X is below a 'decent minimum' threshold (they lack basic nutrition and shelter). Recipient Y is above this threshold (they are comfortable). A transfer to X brings them just up to the threshold. A transfer to Y gives them a significant luxury.*

  *   **A:** We must prioritise X simply because they are below the threshold. Once X is above the threshold, the urgency of their claim drops sharply, even if they are still worse off than others.  
      *(Go to Leaf S)*
  *   **B:** The threshold is not morally decisive. We should continue to prioritise the worse-off person even after they reach a decent minimum, or prioritise based on the total gain.  
      *(Proceed to Node 4)*

  ### Node 4: The Pure Transfer
  *We can transfer 10 units of well-being from a very well-off person to a very badly-off person. Due to administrative costs, the well-off person loses 10 units, but the badly-off person only gains 9 units. Total well-being decreases slightly.*

  *   **A:** We should not make the transfer. The loss in total well-being outweighs the gain in equality. (Or: We are indifferent to the transfer if total well-being is unchanged).  
      *(Go to Leaf U)*
  *   **B:** We should make the transfer. The gain to the worse-off person matters more than the loss to the better-off person, even if the total sum drops (or stays static).  
      *(Proceed to Node 5)*

  ### Node 5: Aggregation vs. Priority
  *You can choose between two policies. Policy 1 gives a massive benefit to a million moderately well-off people. Policy 2 gives a tiny, trivial benefit to a single worst-off person (e.g., a slight reduction in a minor headache).*

  *   **A:** Choose Policy 1. The sheer number of beneficiaries and the size of the aggregate gain outweigh the claim of the single worst-off person.  
      *(Go to Leaf P)*
  *   **B:** Choose Policy 2. The worst-off person has absolute priority; no amount of gain to the better-off can justify ignoring the worst-off.  
      *(Go to Leaf L)*

  ---

  ## Part 2: The Leaves (Your Position)

  **Leaf R: Relational (or Social) Egalitarianism**  
  *Verdict:* You believe justice is fundamentally about relating as equals, not about distributing goods.  
  *Awkward Commitment:* You may be forced to say that a society with equal status but widespread starvation is more just than a hierarchical society where everyone is fed.

  **Leaf T: Telic Egalitarianism**  
  *Verdict:* You believe equality is intrinsically valuable, even when it benefits no one.  
  *Awkward Commitment:* You must accept that the world is, in some respect, improved by blinding the sighted to match the blind (the Leveling-Down Objection).

  **Leaf S: Sufficientarianism**  
  *Verdict:* You believe justice requires everyone to have 'enough', but inequalities above that threshold matter less or not at all.  
  *Awkward Commitment:* You may be indifferent to massive inequalities between those above the threshold, even if some are billionaires and others are just barely comfortable.

  **Leaf U: Utilitarianism**  
  *Verdict:* You believe we should maximise the sum total of well-being, treating everyone's interests equally but without extra weight for the worse-off.  
  *Awkward Commitment:* You must accept that a vast number of small gains to the well-off can outweigh a catastrophic loss to a few destitute people.

  **Leaf P: Prioritarianism**  
  *Verdict:* You believe we should maximise well-being, but benefits to the worse-off count for more than benefits to the better-off.  
  *Awkward Commitment:* You must accept that we should sometimes make the worst-off person slightly worse off if it provides a large enough benefit to a large number of moderately-off people.

  **Leaf L: Leximin (or Strict Priority)**  
  *Verdict:* You believe the interests of the worst-off person always trump the interests of anyone better off, regardless of the numbers.  
  *Awkward Commitment:* You must accept preventing a million people from receiving life-saving treatment to save one worst-off person from a minor injury.

  ---

  ## Part 3: Logical Space and Empty Regions

  The tree above maps the coherent combinations of verdicts. However, some logical combinations are unoccupied.

  **1. The 'Leveling-Down without Transfer' Region (Empty)**  
  *Combination:* Accepting Leveling-Down (Node 2A) but rejecting the Pure Transfer (Node 4A).  
  *Diagnosis:* **Incoherent.** If equality is intrinsically valuable (Node 2A), a move towards equality that harms no one (a pure transfer) must be valuable. Rejecting the transfer implies you do not actually value equality intrinsically.

  **2. The 'Sufficientarian Leveler' Region (Unexplored)**  
  *Combination:* Accepting Sufficiency (Node 3A) but also accepting Leveling-Down for those below the threshold.  
  *Diagnosis:* **Unattractive.** Most sufficientarians adopt the view to avoid the Leveling-Down Objection. A view that demands sufficiency but also demands leveling down those below the floor is theoretically possible but rarely defended.

  **3. The 'Difference Principle' (Outside the Tree)**  
  *Diagnosis:* **Different Currency.** Rawls's Difference Principle is structurally similar to **Leaf L (Leximin)**. However, it applies to *primary goods* (rights, liberties, opportunities, income), not *well-being*. Because this tree sorts based on well-being verdicts, the Difference Principle cannot be placed honestly without conflating goods with welfare. It sits alongside Leaf L, but with a different metric.

  ---

  ## Part 4: Limitations and Indistinguishable Pairs

  Please note that a quiz based on distributional verdicts cannot separate every philosophical position.

  **1. Prioritarianism vs. Concave Utilitarianism**  
  *Can the tree separate them?* **No.**  
  *Diagnosis:* A Utilitarian who believes in diminishing marginal utility of resources will make the exact same choices as a Prioritarian who weights well-being morally. Their *verdicts* on concrete cases are extensionally equivalent. They can only be separated by asking *why* you give weight to the worse off: is it because a unit of well-being matters more morally (Prioritarianism), or because resources produce less well-being for the rich (Utilitarianism)?

  **2. Telic vs. Relational Egalitarianism**  
  *Can the tree separate them?* **Only via Node 1.**  
  *Diagnosis:* On pure distributional cases (like Node 2 or 4), Telic and Relational Egalitarians often agree (both support equality). They are only separated by non-distributional questions about social status, hierarchy, and oppression (Node 1). If you answered Node 1B but Node 2A, your position is unstable: you deny status matters but affirm intrinsic equality of goods.

  **3. Leximin vs. The Difference Principle**  
  *Can the tree separate them?* **No.**  
  *Diagnosis:* As noted above, these differ on the *currency* of justice (well-being vs. primary goods), not necessarily on the *structure* of priority. This tree assumes well-being as the currency.

  ---

  ## Facilitator's Note for the Reading Group

  When discussing your results, pay special attention to **Node 2 (Leveling-Down)** and **Node 5 (Aggregation)**. These are the standard fault lines in contemporary literature.

  *   If you found yourself hesitating at **Node 2**, you are likely grappling with the core of the *Templeton/Parfit* debate on whether equality is non-instrumentally good.
  *   If you found **Node 5** difficult, you are confronting the tension between *aggregation* (Utilitarianism/Prioritarianism) and *separateness of persons* (Leximin/Rawls).

  Remember: The labels are outputs. If your verdicts shift depending on the context, you may be a **Pluralist**, which is not a leaf on this tree but a recognition that different principles apply in different domains.
