answer: |-
  You have correctly identified that the dispute is not a simple empirical contradiction, but your premise that the two "converge on nearly everything downstream" requires significant qualification. While both agree that sagehood is possible and requires effort, they disagree profoundly on the *phenomenology* of virtue, the *source* of moral authority, and the *metaphysics* of what a human being is.

  Here is the breakdown of the crux, addressing your specific questions and correcting the premises where necessary.

  ### 1. Empirical vs. Definitional: The Teleological Crux

  You are right to suspect the dispute is definitional, but calling it "purely" verbal understates the metaphysical stakes. In the Warring States context, *xing* (nature) did not mean "genetic inheritance" or "instinct" in the modern biological sense. It referred to the **life-span and trajectory of a living thing** (cognate with *sheng*, birth/growth).

  *   **Mencius's Definition:** *Xing* is teleological. It is the direction in which a thing grows when unhindered. To ask "What is human nature?" is to ask "What does a human become when fully realized?" Just as the nature of a tree is to grow upward and leaf out, the nature of a human is to become moral. The "sprouts" are nature because they contain the *direction* of the whole.
  *   **Xunzi's Definition:** *Xing* is material and initial. It is the raw stuff you are born with *before* any processing. To ask "What is human nature?" is to ask "What are the raw data of human psychology prior to cultural intervention?" Since raw desires lead to conflict, *xing* is bad.

  **Is it empirically settleable?**
  No, not by modern psychology, because they are carving reality at different joints. However, within their own framework, there is a discriminating observation: **The source of moral motivation.**

  *   **Mencius predicts:** If you strip away social conditioning and calculation, a residue of moral feeling (compassion, shame) remains. If you observe a person acting morally *without* thinking about profit or praise, that action flows from *xing*.
  *   **Xunzi predicts:** If you strip away social conditioning, only desire and aversion remain. Any moral action is the result of *wei* (conscious artifice/effort). If a person acts morally, they are overriding *xing*, not following it.

  **The Disagreement:** It is not about whether humans *can* be good (both say yes). It is about whether morality is a **recovery** of self (Mencius) or a **remaking** of self (Xunzi). This is not just a label; it dictates where authority lies. For Mencius, authority is internal (check your heart). For Xunzi, authority is external (check the Rituals of the Former Kings).

  ### 2. The Child at the Well: Sprout vs. Virtue

  Your skepticism here is well-placed, but Mencius has a specific defense that Xunzi struggles to absorb without conceding his main point.

  **Mencius's Move:** Mencius does not claim the reaction at the well is *virtue* (ren). He claims it is the *duan* (sprout/end) of virtue. He is arguing for the existence of a **non-calculative moral reflex**. He needs this to prove that morality is not purely transactional (Mozi's utilitarianism) or purely imposed (Xunzi's artifice).

  **Xunzi's Absorptive Move:** Xunzi could argue (and implies in *Human Nature is Bad*) that this reaction is not moral compassion but **self-referential shock**. We are startled by the sight; we imagine ourselves in danger; we feel distress. This is a biological startle response, not a moral one. Alternatively, he could argue it is the result of extremely early, forgotten conditioning.

  **Who wins textually?**
  Mencius has the stronger textual case *for his specific goal*. He isn't trying to prove humans are fully formed sages; he is trying to prove that the *source* of morality is internal. The "child at the well" argument works because it isolates a moment *before* calculation.
  *   If Xunzi admits the reaction is non-calculative, he must admit there is something in humans that responds to suffering without profit motive.
  *   If Xunzi claims it is conditioning, he pushes the conditioning back to infancy, which weakens his claim that *all* goodness is the result of conscious study (*wei*).

  **The Philosophical Defensibility:** Mencius wins on the existence of the *impulse*; Xunzi wins on the *insufficiency* of the impulse. Mencius admits the sprout will die without cultivation. Xunzi argues that because the sprout is so weak and easily overwhelmed by desire, calling it "good nature" is misleading. It is like calling a seed a harvest. Mencius replies: The seed *is* the tree in potential; the harvest is just the completion.

  ### 3. Models of Moral Failure: Amnesia vs. Labor

  This is where your premise of "convergence on practice" dissolves. The Ox Mountain (Mencius) and Warped Wood (Xunzi) metaphors cash out in radically different educational and phenomenological expectations.

  **Mencius (Ox Mountain / Lost Heart):**
  *   **Model:** Moral failure is **amnesia** or **neglect**. The heart is "lost" or "oxen have grazed it down."
  *   **Education:** Education is *finding the lost heart* (qiu qi fang xin). It feels like recovery, recognition, and nourishment.
  *   **Phenomenology:** The goal is **spontaneity**. The sage acts effortlessly because he is aligning with his own nature. Moral action should eventually feel natural, like a tree growing.
  *   **Feral Human:** A human raised outside ritual would still possess the sprouts. They might be stunted, but if presented with the child at the well, the reflex should trigger. They are a "damaged human."

  **Xunzi (Warped Wood / Straightening):**
  *   **Model:** Moral failure is the **default state**. Success is the anomaly.
  *   **Education:** Education is *accumulation* (ji) and **constraint**. It feels like discipline, straightening, and molding. It is often unpleasant (like bending wood).
  *   **Phenomenology:** The goal is **vigilance**. Even the sage must maintain conscious attention to Ritual. Desires never disappear; they are managed and routed. Moral action always retains an element of "overriding the self."
  *   **Feral Human:** A human raised outside ritual is a **beast**. Without the external scaffolding of Ritual (*Li*), their raw nature produces only strife. There is no internal compass to recover.

  **Practical Divergence:** If you ask a Mencian student, "Why be moral?" they say, "To be fully myself." If you ask a Xunzian student, "Why be moral?" they say, "To bring order to chaos and align with the Way of the Kings." The Mencian risks solipsism (my heart says it's right); the Xunzian risks authoritarianism (the Ritual says it's right).

  ### 4. Sanity Check: Internal Signal vs. External Standard

  Your gloss is **mostly fair, but requires one crucial correction regarding Xunzi.**

  *   **Mencius:** "Moral objective is latent in the agent." **Correct.** The standard is internal, verified by the "heart that cannot bear" (*bu ren ren zhi xin*).
  *   **Xunzi:** "Moral objective is external to the agent." **Partially Correct.** The *content* of morality (Rituals, Duties) is external (created by Sages). However, the *capacity* to recognize and learn it is internal. Xunzi does not think we are blank slates; we have intelligence and senses.
  *   **The Distortion:** Your gloss suggests Xunzi sees education as "training against an imported standard." This implies the agent is hostile to the standard. Xunzi argues the agent is *incapable* of generating the standard, but *capable* of apprehending it. The mind (*xin*) has a governing function that can approve of Ritual.
  *   **Better Mapping:**
      *   **Mencius:** Morality is **Agriculture**. (Nurture what is growing).
      *   **Xunzi:** Morality is **Craftsmanship**. (Shape what is raw).

  ### Critique of Your Framing

  You asked me to be plain if your premises are confused. Here are the two main points of friction:

  1.  **The "Convergence" Premise:** You wrote: *"both think ordinary people can become good... both treat bad upbringings as capable of ruining almost anyone."*
      *   **Correction:** This flattens the difference in **optimism**. Mencius believes the "ruin" is superficial (like branches lopped off a tree); the root remains. Xunzi believes the "ruin" is the natural state; the "good" is the superficial layer imposed on top. For Mencius, a bad upbringing *hides* the nature. For Xunzi, a bad upbringing *reveals* the nature. This changes how they treat the "ruined" person. Mencius tries to wake them up; Xunzi tries to break and remake them.

  2.  **The "Empirical" Question:** You asked: *"what would a discriminating observation look like?"*
      *   **Correction:** In Warring States philosophy, "observation" is not neutral data. It is hermeneutic. When Mencius "observes" the child at the well, he is already interpreting that feeling through a Confucian lens. When Xunzi "observes" human desire, he is interpreting it through a lens of social order. The dispute is not resolvable by evidence because they disagree on **what counts as the 'real' human**. Is the real human the acorn (Mencius) or the oak tree (Xunzi)? No amount of measuring the acorn settles whether the tree is the "nature."

  ### Summary of the Crux

  The dispute is not about whether humans *can* be good. It is about whether morality is **ontologically continuous** with human biology (Mencius) or **ontologically discontinuous** (Xunzi).

  *   **Mencius:** Morality is biology fulfilled. To be moral is to be natural.
  *   **Xunzi:** Morality is culture conquering biology. To be moral is to be artificial (in the sense of *art*).

  If you side with Mencius, you trust the sage's intuition. If you side with Xunzi, you trust the Sage's text. That is the political and epistemological fault line that runs between them.
