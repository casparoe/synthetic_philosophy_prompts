          *   *Tractability:* High (it's a toy system).
          *   *Re-ranking:* If Typogenetics is shown to be computationally trivial, it loses weight as evidence.

      *   *Question 4: Gödelian Reference vs. Biological Construction.*
          *   *Why Downstream?* This is the philosophical synthesis. It depends on the previous technical distinctions.
          *   *Tractability:* Low (Philosophical).
          *   *Re-ranking:* If Q1 shows replication is purely physical, Gödel might be irrelevant.

  6.  **Refining the Argument regarding the Friend's Claim:**
