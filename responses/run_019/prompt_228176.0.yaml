      *   *Attempt 3 (Refining for the Prompt's constraints):*
          *   **Phase 1: Taxonomy of Replication.** We can't argue about necessity without a spectrum of models.
          *   **Phase 2: The Von Neumann Threshold.** Where does the duality become explicit?
          *   **Phase 3: The Gödel Connection.** Is self-reference sufficient for replication?
          *   **Phase 4: Synthesis.**

  5.  **Developing the Reasoning for Each Phase:**

      *   *Question 1: Formalizing "Replication without Interpretation".*
          *   *Why Upstream?* You can't claim duality is necessary if you can't define models without it. If autocatalytic sets replicate without distinct code, the friend is wrong.
          *   *Tractability:* High. Uses cellular automata, chemical reaction networks (formalized).
          *   *Re-ranking:* If a robust formal model of "duality-free replication" is found, the whole project shifts to "When does duality emerge?" rather than "Is it necessary?"

      *   *Question 2: The Von Neumann/Church-Turing Bridge.*
          *   *Why Upstream?* Von Neumann is the standard for "constructive" self-replication. We need to map his architecture to standard computation (UTMs).
          *   *Tractability:* Medium. Historical/Logical analysis.
          *   *Re-ranking:* If UTM simulation is proven equivalent to physical construction under certain constraints, logic and biology merge.

      *   *Question 3: The Semantics of the Strand (Typogenetics Analysis).*
