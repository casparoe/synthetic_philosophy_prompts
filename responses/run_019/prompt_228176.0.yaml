      *   **The Friend's Claim:** Typogenetics proves that genuine self-replication *requires* a distinct code/interpreter duality (data vs. machinery).
      *   **The User's Skepticism:** Typogenetics is a toy model built *with* that duality, so using it to prove the necessity of that duality is circular. However, the analogy might still be useful.
      *   **The Task:** Propose a 1-year research agenda for a bright graduate student focusing on the conceptual foundations of self-replication (code/interpreter duality, data/program ambiguity, Gödel vs. Biology).
      *   **The Constraint:** Focus less on the *list* of questions and more on the *reasoning* behind the ordering (upstream/downstream relationships, tractability for a formalist, criteria for re-ranking).

  2.  **Analyze the Core Philosophical/Technical Problem:**
      *   *Von Neumann's Kinematic Self-Replicating Automata:* This is the historical anchor. Von Neumann explicitly separated the "description" (tape) from the "constructor" (machine).
      *   *Turing Machines:* A Universal Turing Machine (UTM) reads a description of another TM. But a UTM doesn't necessarily *build* a copy of itself physically; it simulates it.
      *   *Biology:* DNA is code, Ribosomes/Polymers are interpreters. But the ribosomes are encoded *in* the DNA. This is the "chicken and egg" problem resolved by the duality.
      *   *Gödel:* Self-reference via arithmetization. A sentence talks about itself. Is this replication? No, it's reference. But Hofstadter links them via "strange loops."
      *   *The Friend's Claim:* Is the duality *necessary*?
      *   *Counter-examples:* Quines (programs that print their own source). Do they need an external interpreter? Yes, the language runtime. What about chemical autocatalysis? (e.g., GARD model, hypercycles). These often lack a clear code/interpreter split. Is that "genuine" replication?

  3.  **Determine the "Upstream" Questions (Foundational):**
      *   Before asking if biology and logic are the same, we need to define "self-replication" rigorously.
      *   Before asking if the duality is necessary, we need to survey models that *lack* it.
