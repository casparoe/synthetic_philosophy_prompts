      *   *Closest Analog:* **Case 4 (Voter)**. Both involve an agent making a public/practical decision based on the say-so of "ethicists" without the ethicists having specific jurisdictional knowledge.
      *   *Rival Rules:*
          1.  *The Crisis Rule:* Defer in emergencies (1, 5), don't in calm times (2, 4). (NGO is emergency -> predicts Okay).
