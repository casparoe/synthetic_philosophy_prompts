      *   *Synthesizing her view:* She seems to distinguish between **Procedural/Contextual Expertise** (Okay to defer) vs. **Abstract Moral Authority** (Not okay to defer).
      *   *Also:* She distinguishes between **High-Stakes/Emotional Distress** (Okay to defer) vs. **Low-Stakes/Identity Formation** (Not okay).
      *   *Also:* She distinguishes **Deference to Affected** (Okay) vs. **Deference to Elites** (Not okay).

      *   *The "Actual" Rule:* It looks like a hybrid: **"Deference is permissible when the agent lacks specific contextual capacity (emotional or informational) that the advisor possesses, but impermissible when the agent abdicates moral agency on matters of principle or civic duty to abstract authority."**
