answer: |-
  Based on the track record you've described, here is an analysis of how your philosopher is likely to rule on the NGO case, the principles underlying her views, and how to test them further.

  ### 1. The Verdict on the New Case
  **She will likely say the NGO worker is doing something wrong.**

  Despite the time pressure and the high stakes (which usually make deference permissible in her view, as in the Surgeon and Family cases), the critical failure here is **epistemic**. The visiting philosopher explicitly "knows nothing about the place." In her previous "Okay" verdicts (Surgeon, Family, Manager), the person being deferred to possessed specific, relevant knowledge the agent lacked (institutional ethics, medical prognosis, lived experience of harm). In the "Wrong" verdicts (Student, Voter), the agent deferred to abstract authority on matters requiring personal or civic judgment.

  In this NGO case, the worker is deferring to abstract authority *plus* that authority is ignorant of the context. This combines the worst elements of the Student case (blind adherence to a philosopher) and the Voter case (misplaced trust in elites on practical matters).

  ### 2. The Closest Analog
  **The Voter (Case 4).**

  While the NGO case shares the "crisis" element of the Surgeon and Family cases, it is structurally closest to the Voter case.
  *   **Why:** In both the Voter and NGO cases, an agent is making a concrete, real-world decision that affects a community, and they are outsourcing the moral judgment to a "professional ethicist" who lacks specific jurisdictional authority.
  *   **The Distinction:** The Voter case is condemned because the voter abdicates civic responsibility. The NGO case is worse: the worker abdicates *situational responsibility* to someone who is explicitly unqualified to judge the local consequences.

  ### 3. Rival Rules Fitting Her Track Record
  To understand *why* she rules this way, we can extrapolate three competing principles that fit her previous five data points.

  *   **Rule A: The Crisis/Competence Rule.**
      *   *Principle:* Deference is permissible when the agent is emotionally compromised or lacks technical capacity (Surgeon, Family), but impermissible when the agent is calm and capable (Student, Voter).
      *   *Prediction for NGO:* **Okay.** The worker is under time pressure ("afternoon to decide") and lacks cultural competence. This fits the "Surgeon" mold.
  *   **Rule B: The Stakeholder Authority Rule.**
      *   *Principle:* Deference is permissible when deferring to those directly affected or institutional roles (Manager/Staff, Surgeon/Ethicist), but impermissible when deferring to abstract third parties (Student, Voter).
      *   *Prediction for NGO:* **Wrong.** The philosopher is an abstract third party, not a stakeholder or institutional authority.
  *   **Rule C: The Relevant Expertise Rule.**
      *   *Principle:* Deference is permissible only if the advisor possesses *specific contextual knowledge* the agent lacks. It is not enough to be a "moral expert"; they must be an expert on *this* moral situation.
      *   *Prediction for NGO:* **Wrong.** The philosopher knows ethics but not the culture. The Manager (Case 3) deferred to staff who knew the impact of the words; the Surgeon deferred to an ethicist who knew the hospital protocols. The NGO philosopher knows nothing about the place.

  ### 4. The Rule She Is Actually Running
  **Rule C: The Relevant Expertise Rule.**

  This is the strongest fit. It explains why the Manager (Case 3) is right even though he doesn't understand *why* the phrase is demeaning (the staff have the relevant experiential knowledge), while the Student (Case 2) is wrong (the philosopher has theoretical knowledge, but the student is adopting a life principle without grasping the moral reality).

  It also explains the Surgeon and Family cases: in both instances, the experts (ethicist, palliative team) have access to facts, protocols, and prognoses the agents do not. The Voter and Student cases fail because the "experts" (ethicists, famous philosophers) do not have superior access to the agent's own civic duty or moral convictions.

  **Application to NGO:** Since the visiting philosopher lacks *relevant* expertise (local custom), deference is impermissible. The worker is making a category error, treating "moral philosophy" as a skill that overrides "local knowledge."

  ### 5. The Follow-Up Case to Settle It
  If you want to confirm that **Rule C (Relevant Expertise)** is her driving principle—and rule out **Rule A (Crisis)**—you need to keep the crisis but fix the expertise.

  **Float this case:**
  > "Same scenario: The NGO worker has an afternoon to decide on the food distribution. But this time, instead of a visiting philosopher, he asks a **local community elder** who knows the custom intimately. The elder tells him it is permissible to violate the custom this once to save lives, so the worker does it."

  **Why this settles it:**
  *   **If she says "Okay":** It confirms **Rule C**. The problem in the first NGO case wasn't the pressure or the act of deference itself; it was the *source* of the advice. Deference to local expertise in a crisis is valid (like the Manager/Staff).
  *   **If she says "Wrong":** It suggests she is running a stricter **Agency Rule** (perhaps: "In cross-cultural contexts, you must never defer, you must judge for yourself"). This would align more with the Voter case and suggest she views moral agency as non-transferable in foreign contexts regardless of expertise.

  **Recommendation:** Lead with the prediction that she'll call it **Wrong** (based on the ignorance of the philosopher), but use the Follow-Up to see if she values *local knowledge* enough to override the *abstract moral risk*. That tension is where the real story lies.
