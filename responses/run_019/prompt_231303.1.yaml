      *   *Follow-up:* An NGO worker defers to a *local elder* who says "It's okay to violate this custom this once."
      *   *If she says Okay:* It confirms the rule is about *relevant contextual knowledge*, not just "don't listen to philosophers."
      *   *If she says Wrong:* It confirms the rule is about *personal moral agency in cross-cultural contexts* (similar to Voter).

      *   *Let's refine the Follow-Up:* The prompt asks for *one* follow-up to settle it if the New Case doesn't.
      *   *Ambiguity in New Case:* Is it wrong because the philosopher is ignorant, or because the worker shouldn't defer on *action* regardless?
      *   *Follow-Up:* Same scenario, but the advisor is a **local cultural expert** (not a philosopher) who says it's permissible.
      *   *Purpose:* Isolates the variable of *relevant expertise*.

  9.  **Drafting the Response:**
      *   *Tone:* Analytical, journalistic (since the user is writing a piece), respectful of the philosopher's likely nuance.
      *   *Structure:*
          1.  The Verdict on the New Case.
          2.  The Closest Analog.
          3.  The Rival Rules (competing explanations).
