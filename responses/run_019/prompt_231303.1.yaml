      *   *Case 2 (Student/Pacifism):* Student becomes pacifist because famous philosopher says so. **Verdict: Wrong.**
          *   Context: Personal identity/commitment, abstract theory, no immediate crisis, total adoption of worldview without understanding.
      *   *Case 3 (Manager/Staff):* Manager stops using phrase because staff say it's demeaning (doesn't understand why). **Verdict: Right.**
          *   Context: Interpersonal harm, deference to *affected parties* (victims), humility, practical conduct.
      *   *Case 4 (Voter/Ethicists):* Voter supports ballot measure because ethicists say so. **Verdict: Wrong (Misplacing trust).**
          *   Context: Civic duty, democratic process, abstract policy, deference to elites rather than own judgment.
      *   *Case 5 (Family/Palliative Team):* Family withdraws ventilator because team says it's right. **Verdict: Okay.**
          *   Context: High emotional distress, grief, specialized medical/moral guidance, intimate decision, vulnerability.

  3.  **Analyze the New Case (The Test):**
      *   *Scenario:* NGO worker in unfamiliar country.
      *   *Decision:* Distribute food violating local custom.
      *   *Advisor:* Visiting moral philosopher (knows *nothing* about the place).
