      *   *Test:* What if the expert *does* know the culture?
      *   *Scenario:* NGO worker defers to a *local* community leader or a long-term aid worker who knows the custom.
      *   *Prediction:* She should say this is **Okay**.
      *   *Why:* This tests if the problem is the *source* (philosopher) or the *knowledge gap*.
      *   *Alternative Test:* What if the NGO worker is emotionally devastated? (Tests the Vulnerability rule).
