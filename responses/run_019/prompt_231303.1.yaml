      *   *Refining the "Actual Rule":* Look at Case 3 (Manager). He doesn't understand *why*, but he defers to staff. That's deference to *victims*. Case 1 & 5 are deference to *institutional experts* in *crisis*. Case 2 & 4 are deference to *abstract authority* in *non-crisis/civic* contexts.
      *   *The NGO Case:* It's a crisis (food needed), but the expert is *abstract/ignorant*.
