prompt: |-
  I teach an upper-level political philosophy seminar with about 18 students; sessions run 75 minutes. We have just finished a unit on Ulysses contracts and constitutional precommitment, and I want to replace one of the lecture-discussion days with a structured simulation. Last year I tried running the topic as a free-floating hypothetical (should a constitutional amendment require more than a majority?), and it fell flat: students could already name the standard positions and nothing about their view moved. What I want is an activity where they actually experience the pull of binding a future collective self, the way an entrenched rule turns what the current majority wants into a question the majority cannot settle by wanting it, and the force of the dead-hand worry from the inside, as someone who sincerely prefers to change a rule finds that the rule was built precisely so that their preference does not count. One design I have been toying with: a multi-round budget or constitutional convention game in which an early round can, by supermajority, adopt a rule that later rounds cannot easily amend, and a later round is put in the position of genuinely preferring to change it. But I would rather the students construct or fall into the mechanism themselves than have me announce it, and I am open to better mechanics. Constraints: no lecture up front, no technical vocabulary until the debrief, no real money, and it must run with only paper, a whiteboard, and index cards, all within the 75 minutes including setup and debrief. By the end, the students should be able to distinguish binding against predictable weakness of will from binding against future changes in values, and to say which of those better describes the Ulysses case and which better describes constitutional entrenchment. The debrief should map specific moments in the activity onto that distinction and onto the dead-hand objection, say what will predictably go wrong the first time I run it and how to handle it, and be honest about what the simulation cannot reproduce and so I will have to supply myself.

  After the runnable activity and debrief, include a brief structured summary as a JSON object with these fields: "phases" (an array, each element an object with keys "name", "duration_minutes", "what_happens", and "intended_effect"); "concept_map" (an array, each element an object with keys "moment", "concept", and "debrief_prompt"); "predictable_failures" (an array, each element an object with keys "failure", "likely_cause", and "fix"); and "cannot_reproduce" (a string naming the single most important thing the activity cannot embody and that I must supply).
reasoning: |-
  Here's a thinking process that leads to the suggested simulation activity:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level political philosophy seminar (18 students), 75 minutes.
      *   **Topic:** Ulysses contracts, constitutional precommitment, dead-hand control.
      *   **Problem with Previous Attempt:** Free-floating hypothetical discussion was static; students recited standard positions without feeling the tension.
      *   **Goal:** Students must *experience* the pull of binding a future self, the frustration of entrenched rules, and the "dead-hand" worry from the inside. They should construct/fall into the mechanism rather than having it announced.
      *   **Constraints:** No lecture up front, no technical vocabulary until debrief, no real money, paper/whiteboard/index cards only, 75 mins total (incl. setup/debrief).
      *   **Learning Outcomes:** Distinguish binding against weakness of will vs. binding against value changes; identify which fits Ulysses vs. Constitutional entrenchment; understand the dead-hand objection.
      *   **Deliverables:** Runnable activity, detailed debrief plan, specific JSON summary.

  2.  **Deconstruct the Core Tension:**
      *   *Ulysses Case:* Binding self against *weakness of will* (I want X now, I know I'll want not-X later due to passion/impulse, but my *true* self still wants X).
      *   *Constitutional Case:* Binding future *collective* self against *value changes* (We want X now, we know future generations might want not-X, we want to force them to keep X).
      *   *The "Dead Hand" Problem:* Why should the past rule the present?
      *   *The Simulation Need:* Students need to vote on a rule in Round 1 that hurts them in Round 2, but they need a *reason* to vote for it in Round 1 that isn't just "the professor said so." They need to feel the *necessity* of the constraint.

  3.  **Brainstorming Mechanics:**
      *   *Idea 1: Budget Game.* Allocate resources. Round 1 sets a rule (e.g., 50% must go to Defense). Round 2 wants to shift to Education. *Critique:* Too abstract. Why would they bind themselves in Round 1?
      *   *Idea 2: The "Poison Pill" Auction.* Students bid on privileges. *Critique:* Too game-theoretic, misses the political philosophy angle.
      *   *Idea 3: The "Crisis" Simulation.* Create a scenario where immediate gratification leads to collective ruin, forcing them to create a constraint.
      *   *Selected Concept:* **The "Resource Depletion" Convention.**
          *   *Setup:* A common pool of points (representing political capital/resources).
          *   *Round 1 (The Founding):* They must decide how to distribute points over 3 rounds.
          *   *The Trap:* If they don't lock in a distribution rule now, the majority in later rounds will steal everything, leaving the minority (or everyone in the long run) with nothing.
          *   *The Twist:* To make it feel like *precommitment*, they need to vote on a "Gag Rule" or "Entrenchment Clause" in Round 1 that makes changing the distribution hard in Round 2.
          *   *Refinement:* Let's make it about *policy stability* vs. *immediate need*.
          *   *Better Refinement:* **The "Two-Thirds Lock" Game.**
              *   Students are divided into 3 "Factions" (6 students each).
              *   There is a "Public Good" pot.
              *   Round 1: They draft a constitution. They can choose a simple majority rule or a supermajority rule for spending.
              *   Round 2: A "Crisis" occurs (simulated via card draw). The majority faction now wants to seize assets from a minority faction to solve the crisis.
              *   *Problem:* If I just tell them the rules, it's lecture.
              *   *Solution:* Let them write the rules *before* they know their position in the crisis. This creates the "Veil of Ignorance" effect which motivates precommitment.

      *   *Revised Concept (Closer to prompt's desire for "falling into the mechanism"):*
          *   Don't explain the theory. Just give them a task.
          *   Task: Maximize your group's score over 3 rounds.
          *   Mechanism: In Round 1, they can vote to "Lock" a rule. If Locked, it takes a 2/3 vote to change later. If not Locked, simple majority.
          *   Incentive: In Round 1, everyone is equal. In Round 2, random asymmetry is introduced (some get more voting power or resources).
          *   *Wait, the prompt wants them to experience the frustration of the dead hand.*
          *   So, Round 1: They unanimously (or near unanimously) want to Lock a rule to prevent "chaos."
          *   Round 2: The Lock prevents them from solving a problem they all now agree on.
          *   *How to generate the desire to Lock in Round 1?* Fear of future tyranny.
          *   *How to generate the frustration in Round 2?* The Lock works too well.

      *   *Final Design Choice:* **The "Succession Crisis" Simulation.**
          *   **Phase 1 (The Founding):** All 18 students are "Founders." They have equal votes. They must allocate 100 "Policy Points" across three categories (Security, Liberty, Welfare). They must also decide the *Amendment Rule* (50% + 1 or 75%?). *Crucial:* They do this *before* knowing who will be in power later.
          *   **Phase 2 (The Succession):** Randomly re-assign students into "Governing Majority" (12 students) and "Opposition Minority" (6 students). Give the Majority a strong incentive to reallocate points (e.g., a "War" card says Security needs +20 points, taken from Liberty).
          *   **Phase 3 (The Dead Hand):** If they chose the 75% rule in Phase 1, the Majority (12/18 = 66%) *cannot* change the allocation. They are stuck. They feel the frustration. If they chose 50%, they change it easily but realize they could have been the minority next time.
          *   *Wait, to make it "fall into the mechanism":* I shouldn't offer the Amendment Rule as a menu. I should let them propose rules.
          *   *Actually, to ensure the tension happens:* I need to rig the incentives so that in Round 1, the rational choice is to entrench, but in Round 2, the entrenched rule is painful.
          *   *Let's try a "Ulysses vs. Constitution" split.*
          *   No, keep it unified. The activity should generate the data for the distinction.
          *   *Idea:* Two parallel games? No, too complex for 75 mins.
          *   *Idea:* One game, two stages.
          *   *Stage 1 (Ulysses):* Individual temptation.
          *   *Stage 2 (Constitution):* Collective constraint.
          *   *Better:* Just focus on the Constitutional aspect as per the prompt's emphasis on "dead-hand" and "collective self." The Ulysses distinction comes in the debrief comparison.

      *   *Finalized Mechanics:* **The "Ironclad Clause" Game.**
          *   **Setup:** 3 Groups of 6.
          *   **Round 1 (Veil of Ignorance):** Groups draft a "Charter." They must decide how to distribute a fixed budget of 100 points among 3 needs (A, B, C). Crucially, they must vote on an "Amendment Threshold" (Simple Majority vs. Supermajority). *Incentive:* Tell them that in Round 2, one Need will become "Critical" (worth double), but they don't know which one. This creates fear of future majority tyranny, encouraging a Supermajority lock.
          *   **Round 2 (The Shift):** Reveal that Need A is now Critical. Group 1 (now the "Current Majority" via random draw of voting weights, or simply by the fact that 12 students want to shift to A) wants to shift points to A.
          *   **The Kicker:** If they voted Supermajority (e.g., 15 votes needed), and only 12 want the change, they are *blocked*. They experience the "Dead Hand."
          *   **Refinement for "Falling into it":** Don't tell them about the Amendment Threshold initially. Let them propose rules for how to change the budget later. Most will suggest "we can just vote later." Some might suggest "make it hard." I need to nudge the "make it hard" option without lecturing.
          *   *Nudge:* In Round 1 instructions, mention: "Past conventions failed because later groups changed everything. You may write a clause to prevent this."
          *   *Round 2:* Assign roles. 12 students are "Legislators," 6 are "Judges" (or just minority). The Legislators want to change the budget. The Rule stops them.

      *   *Wait, I need to ensure the Ulysses distinction comes out.*
          *   Ulysses = Binding against *passion/weakness*.
          *   Constitution = Binding against *value change*.
          *   To simulate Ulysses: I need a moment where they *know* they will be tempted.
          *   To simulate Constitution: I need a moment where they *know* their values might change.
          *   *Hybrid Approach:*
              *   **Part 1 (Individual Ulysses):** 5 minutes. Each student writes a goal for the seminar. They can choose to "lock" it (hand it to me, can't get it back) or keep it. Incentive: If they keep it, they can change it later for a bonus. If they lock it, they get a bigger bonus *if* they stick to it, but nothing if they quit. *Too gamified.*
              *   *Let's stick to the Collective Precommitment as the main event, and use the debrief to draw the Ulysses parallel.* The prompt asks to distinguish them by the end. The simulation can focus on the Constitutional side (Dead Hand), and the debrief uses that experience to illuminate the Ulysses case (which is structurally similar but internally focused).
              *   *Actually, I can embed both.*
              *   **Round 1:** Individual decision (Ulysses). "I pledge not to check my phone." Can I bind myself?
              *   **Round 2:** Collective decision (Constitution). "We pledge not to raise taxes." Can we bind the future?
              *   *Time constraint:* 75 mins is tight for two distinct simulations.
              *   *Decision:* Focus on the **Collective Precommitment** (Constitutional) as the simulation, because the "Dead Hand" objection is specific to the collective/political case. Use the debrief to contrast this with the individual (Ulysses) case. The prompt says "distinguish binding against predictable weakness of will from binding against future changes in values." The simulation should ideally touch both.
              *   *How to touch both in one game?*
              *   Make the Round 1 motivation about *Weakness of Will* (e.g., "We know we will panic in a crisis and make bad short-term decisions").
              *   Make the Round 2 frustration about *Value Change* (e.g., "We now genuinely believe the old rule is wrong, not just tempting").
              *   *Okay, here is the plan:*
                  1.  **Round 1 (The Pact):** Students are "Founders." They know a "Crisis" is coming in Round 2. They fear they will overreact. They write a rule limiting their own future power.
                  2.  **Round 2 (The Crisis):** The Crisis arrives. It turns out the "overreaction" is actually the *rational* choice now (values changed), not just a passion. But the Rule stops them.
                  3.  **Result:** They feel the constraint. Was it protecting them from weakness (Ulysses) or imposing dead values (Constitution)?

  4.  **Drafting the Activity Steps:**
      *   **Materials:** Index cards, whiteboard, markers.
      *   **Time:** 75 mins.
      *   **Setup (5 mins):** Divide into 3 groups of 6.
      *   **Phase 1: The Founding (20 mins).**
          *   Scenario: You are designing a government for a colony.
          *   Resource: 100 "Security Tokens."
          *   Threat: "The Mob" (simulated by a die roll or card draw in Round 2).
          *   Task: Decide how to spend tokens now vs. later.
          *   *The Precommitment:* They must write one "Ironclad Rule" on a card. I collect them. I tell them: "In Round 2, you can change this rule ONLY if you have 15/18 votes." (I impose the supermajority requirement *based on their choice to make a rule ironclad*).
          *   *Wait, I want them to choose the threshold.*
          *   Okay: They vote on the Amendment Threshold. 50% or 75%?
          *   *Nudge:* Tell them "History shows colonies that allow simple majority changes collapse in crises." (This creates the Ulysses motivation: fear of future weakness/panic).
          *   Most will vote 75% to be safe.
      *   **Phase 2: The Crisis (25 mins).**
          *   Re-assign roles. 12 students are "Current Legislature," 6 are "Minority."
          *   Reveal Crisis: "The Mob is at the gate. You need to spend tokens on Defense immediately."
          *   Problem: The "Ironclad Rule" from Phase 1 allocated tokens to "Liberty."
          *   The Legislature (12 students) wants to shift tokens to Defense. 12/18 is 66%.
          *   If they chose 75% threshold, they *fail*. They are stuck with the Liberty allocation. They feel the frustration.
          *   If they chose 50%, they succeed, but then I reveal "Next round, you might be Minority." (Maybe skip Round 3 to save time, just discuss the fear).
      *   **Phase 3: The Debrief (25 mins).**
          *   Process the frustration.
          *   Map to Ulysses (binding passion) vs. Constitution (binding values).
          *   Map to Dead Hand.

  5.  **Refining the "Fall Into It" Aspect:**
      *   I don't want to say "History shows..." (That's lecture).
      *   I want them to realize the need for stability themselves.
      *   *Adjustment:* In Phase 1, give them a choice: "Flexible Plan" or "Stable Plan."
      *   Flexible: Can change anytime. Stable: Hard to change.
      *   Ask them: "What are you afraid of in the future?" Write answers on board. (e.g., "Panic," "Tyranny," "Stupidity").
      *   This generates the *reason* for precommitment without me naming it.
      *   Then, in Phase 2, show that what they feared (Panic) is actually just a *Different Preference*.
      *   This creates the ambiguity needed for the debrief: "Was the Round 2 desire a panic (Ulysses) or a new value (Constitution)?"

  6.  **Addressing Constraints:**
      *   No lecture up front: Instructions only.
      *   No technical vocabulary: Use "Lock," "Rule," "Future Self."
      *   No real money: Use points/tokens.
      *   75 Minutes: Tight. Keep instructions crisp.
      *   JSON Summary: Required at the end.

  7.  **Predictable Failures:**
      *   *Failure:* Students vote for Simple Majority in Round 1.
      *   *Fix:* I need to ensure the incentive for Supermajority is strong enough. I will add a "Stability Bonus" to the scoring if they maintain the rule, OR I will rig the "History" hint in the instructions. *Better:* I will act as the "Advisor" in Round 1 and warn them of "Mob Rule" without using the word.
      *   *Failure:* Students find a loophole.
      *   *Fix:* I am the "Supreme Court." I interpret the rules strictly.
      *   *Failure:* Debrief stays on game mechanics.
      *   *Fix:* Specific prompts linking game moments to philosophical concepts.

  8.  **Finalizing the Activity Flow:**
      *   **0-5:** Setup & Groups.
      *   **5-25:** Phase 1 (Founding). Draft Charter. Vote on Amendment Rule. *Crucial:* They must state *why* they are locking the rule (record this).
      *   **25-50:** Phase 2 (Crisis). New information. Majority wants to change. Rule blocks them (if they locked it).
      *   **50-75:** Debrief. Connect feelings to theory.

      *Self-Correction on "Falling Into It":* If I let them vote on the threshold, they might vote 50% and ruin the simulation. I need to make the 75% choice the *dominant strategy* in Round 1 without explaining why.
      *   *Mechanic:* In Round 1, they are "Risk Averse." Tell them: "If the policy changes too often, everyone loses points." This incentivizes locking.
      *   *Better:* Divide the class. Half are "Founders," Half are "Future Citizens." No, too complex.
      *   *Best:* Just rely on the "Fear of Future Tyranny" prompt. "You fear the future majority will oppress you." Since they don't know who they will be in Round 2 (random reassignment), the rational choice under a Veil of Ignorance is Supermajority. I will enforce the Veil by randomizing seats in Round 2.

  9.  **Drafting the Debrief:**
      *   Need to distinguish: Binding against *weakness* (Ulysses) vs. Binding against *values* (Constitution).
      *   In the game: Did they lock the rule because they thought future selves would be *irrational* (panic) or just *different* (new priorities)?
      *   Record their Round 1 justifications. Use them.
      *   Dead Hand: The frustration in Round 2 *is* the Dead Hand.
      *   Cannot Reproduce: The *moral weight* of the past. In the game, it's just points. In reality, it's legitimacy/tradition.

  10. **Writing the JSON:** Ensure all keys match the prompt requirements exactly.

  11. **Review against Constraints:**
      *   18 students? Yes, groups of 6 work.
      *   75 mins? Yes, timing allocated.
      *   No lecture? Yes, instructions are procedural.
      *   No vocab? Yes, "precommitment" saved for debrief.
      *   Paper/Whiteboard? Yes.

  12. **Final Polish:** Make sure the "trap" is clear. The trap is that in Round 1 they view the future constraint as protection against *chaos*, but in Round 2 they experience it as an obstacle to *solution*. This ambiguity is the teaching point.

  *(Self-Correction during drafting)*: I need to make sure the "Ulysses" distinction is clear. Ulysses binds against *passion* (I still value the long term, but impulse takes over). Constitutional binding often binds against *democratic will* (the future generation genuinely values something else).
  *   *Game adjustment:* In Round 1, ask them: "Are you binding yourself because you think you'll be *stupid* later, or because you think you'll *want different things*?"
  *   *Actually, don't ask that yet.* Let them write the justification. Then in debrief, analyze the justification.
  *   *Round 2:* Make the desire to change the rule seem *rational*, not impulsive. This forces the question: "Is this a Ulysses moment (weakness) or a Dead Hand moment (value shift)?"

  Okay, ready to write.
answer: |-
  # Activity: The "Ironclad Charter" Simulation

  **Objective:** To viscerally demonstrate the tension between present autonomy and future constraint, allowing students to experience the motivation for precommitment (Round 1) and the frustration of entrenchment (Round 2), without using technical vocabulary until the debrief.

  **Materials:** 
  *   Whiteboard and markers.
  *   3 packs of index cards (different colors for Round 1 vs. Round 2).
  *   A timer.
  *   A hat or bowl for drawing names.

  **Class Size:** 18 Students (3 Groups of 6).
  **Total Time:** 75 Minutes.

  ---

  ## Part 1: The Activity (50 Minutes)

  ### Phase 1: The Founding (20 Minutes)
  1.  **Setup (2 mins):** Divide the class into three groups of six. Seat them in circles. Tell them: *"You are the Founders of a new community. Your goal is to maximize your group's 'Stability Score' over the next two rounds."*
  2.  **The Task (5 mins):** Hand each group a **Blue Index Card**. Instruct them: *"You must allocate 100 points across three categories: Security, Liberty, and Welfare. Write the numbers on the card. The sum must be 100."*
  3.  **The Mechanism (5 mins):** Tell them: *"In the next round, a Crisis will occur. You may want to change these numbers. You must decide now how hard it will be to change them later."*
      *   Write two options on the board:
          *   **Option A (Flexible):** Changes require 4 out of 6 votes (Majority).
          *   **Option B (Ironclad):** Changes require 6 out of 6 votes (Unanimity) OR 10 out of 18 votes if merging groups.
      *   **The Nudge (Crucial):** Do not recommend an option. Instead, write this warning on the board: *"Historical Note: Communities that allow easy changes often panic during crises and make decisions they regret. Communities that lock rules sometimes cannot fix urgent problems."*
      *   Ask them to write their chosen Amendment Rule on the Blue Card and sign it. Collect the cards.
  4.  **The Justification (8 mins):** Before they finish, ask each group to write one sentence on the back of the Blue Card answering: *"Why did you choose this rule? What are you afraid will happen in the future?"* Collect these. (This provides the data for the Ulysses vs. Values distinction later).

  ### Phase 2: The Crisis (20 Minutes)
  1.  **The Shuffle (2 mins):** Have students stand up and draw a slip of paper from the hat. 12 slips say "Legislator," 6 slips say "Observer." (This breaks the original groups, creating a new "Majority" of 12 and a "Minority" of 6).
  2.  **The Reveal (3 mins):** Announce the Crisis: *"A War has started. Security is now critical. To survive, the community must shift 20 points from Liberty to Security immediately."*
  3.  **The Vote (10 mins):** The 12 "Legislators" want to make this change. It is a rational, collective survival decision, not a whim.
      *   Check the Blue Cards (the Charters) collected in Phase 1.
      *   **If they chose Option A (Flexible):** Allow the change. Tell them: *"You survived, but your Stability Score is reduced because you changed the plan."*
      *   **If they chose Option B (Ironclad):** **Block the change.** Say: *"Your Charter requires 10 votes to amend. You only have 12 Legislators, but the rule applies to the whole class of 18. The 6 Observers (or the missing 6 from the original quorum) cannot vote. You do not have the votes. The rule stands. Liberty remains high, Security remains low."*
      *   *Note:* To guarantee the tension, if most groups chose Option B, enforce the block strictly. If most chose Option A, announce that the "War" was worse than thought and the penalty for changing the plan is actually total collapse (retroactively raising the stakes of instability). *Ideally, hope for Option B.*
  4.  **The Reaction (5 mins):** Allow the "Legislators" who were blocked to express their frustration on the whiteboard. Ask them: *"Is this rule protecting you or hurting you?"* Do not answer. Just record their quotes.

  ### Phase 3: The Debrief (25 Minutes)
  *Do not move seats. Keep the energy from the game.*

  1.  **Unpack the Frustration (5 mins):**
      *   Ask the blocked students: *"You wanted to change the rule. You had a majority. Why couldn't you?"* (Elicit: "Because we voted in Round 1.")
      *   Ask: *"In Round 1, did you think you would want to change this today?"* (Likely: "No," or "We weren't sure.")
      *   Introduce the term **Precommitment**.
  2.  **Distinguish the Motives (10 mins):**
      *   Read the justifications from the back of the Blue Cards (Phase 1, Step 4).
      *   **Category 1:** "We were afraid we would panic." (Binding against **Weakness of Will**).
      *   **Category 2:** "We were afraid a future majority would tyrannize us." (Binding against **Future Values/Politics**).
      *   **The Ulysses Map:** Explain that Ulysses bound himself because he knew his *values* wouldn't change, but his *impulses* would. He feared Weakness of Will.
      *   **The Constitution Map:** Explain that Constitutions bind because we fear future *majorities* will have different *values* (e.g., security over liberty).
      *   **The Pivot Question:** *"In this game, was your desire to shift points to Security in Round 2 a 'panic' (Ulysses) or a 'new value' (Constitution)?"* (It was rational survival, suggesting Constitutional/Value shift, but the *fear* in Round 1 was likely panic).
  3.  **The Dead Hand (5 mins):**
      *   Point to the quotes on the board from Phase 2.
      *   Introduce the term **Dead Hand Control**.
      *   Ask: *"Does the fact that you (the Founders) voted for this in Round 1 justify your frustration in Round 2? Or does the fact that you (the Legislators) are alive now make the old rule illegitimate?"*
  4.  **Limitations (5 mins):**
      *   Ask: *"What was missing from this game compared to real politics?"*
      *   Guide them to: *Legitimacy, Time, Stakes.* In the game, it's points. In reality, it's rights/lives. The "moral weight" of the past is missing.

  ---

  ## Instructor's Guide: What Will Go Wrong & How to Fix It

  | Failure | Likely Cause | Fix |
  | :--- | :--- | :--- |
  | **Students choose "Flexible" rules in Round 1.** | They discount the "Historical Note" or prefer immediate agency. | **Intervention:** In future runs, add a "Stability Bonus" to the scoring rules: Groups with Ironclad Charters get +10 points if they survive, regardless of allocation. This makes entrenchment the dominant strategy. |
  | **Students find a loophole.** | They argue the "War" wasn't specified in the Charter. | **Intervention:** You are the "Court." Rule strictly: *"The Charter governs all allocation changes. No exceptions."* This reinforces the feeling of constraint. |
  | **Debrief stays on game mechanics.** | Students focus on "winning" rather than the philosophical tension. | **Intervention:** Stop discussing points. Ask: *"Imagine this rule wasn't about points, but about free speech. Does your frustration change?"* |
  | **Ulysses/Constitution distinction blurs.** | Students conflate "panic" with "new values." | **Intervention:** Use the Blue Card justifications. If they wrote "fear of panic," label that Ulysses. If they wrote "fear of tyranny," label that Constitutional. Force the distinction using their own words. |

  ---

  ## Limitations: What You Must Supply
  The simulation cannot reproduce **Intergenerational Legitimacy**. In the game, the "Founders" and "Legislators" are the same people shuffling seats. In reality, the "Dead Hand" is wielded by people who are *dead*, against people who *never consented*. You must verbally supply the weight of non-consent in the debrief: *"In this game, you voted in Round 1. In a real constitution, you did not vote. Does that make the Dead Hand heavier?"*

  ---

