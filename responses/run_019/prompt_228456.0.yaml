      *   **Verdict:** Since she is a punishment skeptic, she rejects basic desert. Since there are no forward-looking benefits (safety or deterrence) to override her skepticism, she will reject the blame. She views moral condemnation as requiring a freedom/responsibility that doesn't exist, and without a public safety justification, there is no "quarantine" logic to apply either.

  **The Distinguishing Case:**
  To definitively tell the Caruso view apart from the Dennett view, you need a case where **blame has high utility but low desert**.
  *   *The Case:* A non-dangerous, rehabilitated offender whose public condemnation *would* successfully deter others (high utility), but whose actions were clearly the product of deterministic forces (low/contested desert).
  *   *The Split:* A **Caruso-style** skeptic will still say **no blame**, because utility cannot justify moral condemnation without basic desert. A **Dennett-style** compatibilist will say **yes blame**, because maintaining the efficacy of the responsibility system justifies the practice regardless of metaphysical freedom.

