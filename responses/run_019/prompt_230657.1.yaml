answer: |-
  Good evening everyone. Looking around this room, I realize I have a somewhat precarious assignment. Half of you are family who have sat through enough holiday dinners to know that mentioning Émilie du Châtelet usually means Auntie is about to explain why our enjoyment of the dessert course is largely owing to a beneficial illusion. The other half are her colleagues who know the text better than I do, and who will be listening for any misquote like hawks. So I have to walk a line. I cannot give a lecture, because this is a celebration, but I cannot ignore the philosophy that built her career and, if I'm honest, most of our conversations. For forty years she has taught the Enlightenment, but she always came back to one specific, unsentimental idea about happiness. She taught us that clearing away prejudice and fear is only groundwork, and it can't by itself make anyone happy. Happiness runs on passions, and most of our pleasures are owed to illusion. The practical question is not how to rid yourself of false beliefs but how to choose illusions that keep you alive and drop the ones that curdle into bitterness. She insists on the distinction between prejudices, which narrow people and should go, and illusions, which make life bearable and should be kept with care.

  I mention this because when we talk about what happens next, I am strictly forbidden by the laws of her own philosophy from telling her she has earned a rest, or that this is a new beginning, or that the best is yet to come. Those are clichés, and clichés are often just prejudices wearing a costume. Instead, I want to suggest that what she has actually done is something far more precise. For four decades she has spent her energy clearing away prejudices in others, helping students think clearly and narrowly avoid the traps of dogma. But now, she is securing the conditions for her own illusions. If happiness runs on passion, and passion requires time, then retirement is simply the act of buying herself long, unbothered hours for the one passion that doesn't depend on luck or other people. It is the luxury of time for the life of the mind, without the bell schedule, without the committee meetings, without the need to persuade anyone of anything.

  So I am not going to wish her freedom, because she has always been free in her head. I am not going to wish her relaxation, because idleness is not a passion. I am going to wish her the success she has always argued for. I hope she keeps the illusions that make her life bearable and bright. I hope she drops the ones that curdle into bitterness, though knowing her, she never held onto those for long anyway. And I hope she finds that the unbothered hours she has bought herself are filled with the specific joy that comes from pursuing a thought simply because you want to follow it where it leads. To my aunt, who taught us to distinguish between what narrows us and what keeps us alive, and who now gets to spend her time on the latter. To her health, and to her chosen illusions.
