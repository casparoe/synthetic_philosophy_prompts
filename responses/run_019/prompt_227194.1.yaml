      *   Did I answer the specific questions about translation limits? Yes.
      *   Is there a Residue Report? Yes.

  *(Self-Correction on "Vendor Lock-in"):* The prompt mentions "vendor lock-in" in the vocabulary list. I should apply this to Case 4 (Exit Costs) to make the analogy tight.

  *(Self-Correction on "Control over character"):* This is a deep Positive Liberty concept (self-mastery). I need to explain why sysadmin terms can't capture "internal" capacity, only "external" resource availability.

  Let's assemble the response.

  *Structure:*
