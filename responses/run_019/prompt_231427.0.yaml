answer: |-
  Dear Colleague,

  It is a pleasure to engage with your considered view on biological function, and I appreciate the opportunity to audit these commitments before you present them to your colleagues. Your position attempts to synthesize the normative force of the etiological account with the intuitive immediacy of structural accounts, aiming to capture the best of both worlds while avoiding the permissiveness of the causal-role view. However, in working through the five theses you have outlined, I must inform you that there are significant logical tensions that prevent them from hanging together as a unified theory without modification. While each thesis is defensible in isolation, their conjunction creates a system that is internally unstable. I will walk you through the conflicts I have identified, ranking them by severity, and outline what revisions would be required to resolve them along with the philosophical costs involved.

  The most severe tension lies between your first and second theses. You define function etiologicaly in the first thesis, stating that selection history is what distinguishes a genuine function from an accidental effect, yet in the second thesis, you grant function status to a fresh mutation that has not yet been selected. If the definition in the first thesis holds, then a trait without a selection history literally cannot have a function by your own criteria, making the second thesis false under the definition provided in the first. This is not merely a friction but a direct contradiction regarding the constitutive conditions of function. To maintain both, you would need to argue that the fresh mutation inherits the function of the ancestral trait, but your example specifies a new trait produced by a fresh mutation, implying it is not yet part of a selected lineage in the relevant sense. If you insist on the first thesis, you must deny the second, conceding that new traits have functional effects or capacities but not proper functions until selection acts upon them. The cost of this revision is counterintuitive regarding our ordinary language use, where we readily say a new artificial heart or a mutated organ functions to pump blood immediately. Conversely, if you insist on the second thesis, you must revise the first to allow that selection history is not necessary for function, which undermines the etiological account's primary advantage of grounding normativity in historical success rather than mere capacity.

  Moving to the next most severe tension, there is a profound conflict between your first and fourth theses. The first thesis makes selection history ontologically constitutive of function, meaning history is part of what function is. The fourth thesis claims that function should be determinable from current organization without settling selection history. If history is constitutive, then it is impossible in principle to determine function without knowing the history, much like one cannot determine if someone is a grandfather without knowing their reproductive history. By insisting on the fourth thesis, you are treating function as structurally detectable, which aligns more with the causal-role accounts you reject in the fifth thesis. This creates an epistemic disconnect where your ontology demands historical data that your methodology claims is unnecessary. If you revise the fourth thesis to admit that history is required for determination, you lose the practical utility of being able to identify functions in organisms with unknown phylogenies, which is a significant cost for working biologists. If you revise the first thesis to allow structural determination, you weaken the etiological core that protects you from the permissiveness you worry about in the fifth thesis, potentially opening the door to the very incidental effects you wish to exclude.

  A third significant tension exists between your second and third theses regarding explanation. You hold that function attributions explain the presence or maintenance of the trait, which is the standard etiological explanatory role. However, if a new trait has a function in its first generation as per the second thesis, that function cannot explain the presence of the trait, because the trait arose via mutation and drift, not selection for that function. The function exists, on your view, before the explanation it is supposed to provide is valid. This renders the explanatory role inert for novel traits. You would have to revise the third thesis to say that functions explain the potential maintenance or future retention of traits, but this shifts the explanation from a historical fact to a predictive claim, which changes the nature of functional explanation in biology from backward-looking to forward-looking. This costs you the standard etiological justification that grounds function in actual past success rather than prospective utility, and it risks conflating functional explanation with adaptive significance.

  The fifth thesis complicates resolving these tensions because it blocks the most obvious escape route. Usually, philosophers who want to assign functions to novel traits based on current organization rely on a causal-role or systemic account, which you explicitly reject for being too permissive. You want the normativity of the etiological view to exclude heart sounds, but you want the immediacy of the structural view to include new mutations. Without the causal-role account, you lack the machinery to derive function from current organization alone, yet your fourth thesis demands you do exactly that. To keep the fifth thesis while satisfying the fourth, you would need a new criterion for distinguishing functional effects from incidental effects based solely on structure, which is a notoriously difficult philosophical hurdle that often collapses back into either etiology or permissive causal roles. This leaves you with a gap where you require a structural test for function that is as strict as the etiological test but does not use history, and no such test is currently established in the literature without smuggling in teleological assumptions.

  To resolve these issues while keeping the spirit of your view, you would likely need to revise the first thesis to accommodate a dual concept of function, distinguishing between proper function which requires history and systemic function which does not. The cost here is theoretical unity, as you would no longer have a single account of function but rather two distinct concepts that happen to share a name. Alternatively, you could revise the second thesis to claim that new traits have functional effects or capacities but not proper functions until selected. The cost of this revision is counterintuitive regarding our ordinary language use, where we readily say a new artificial heart or a mutated organ functions to pump blood immediately. A third option is to revise the fourth thesis to acknowledge that while we often estimate function from structure, strictly speaking, function attribution remains hypothetical until history is confirmed. This costs the epistemic confidence you seem to want, admitting that structural analysis only gives us probable functions rather than determinate ones. Ultimately, the most coherent path that preserves your rejection of causal-role accounts is to soften the second thesis, accepting that new traits have the capacity to perform functions but only acquire the status of having a function once they enter a selection regime, thereby preserving the etiological definition and its explanatory power.

  I hope this audit helps clarify the structural stresses in your argument before you share it with your colleagues. It is a robust set of intuitions, but they pull in opposite directions regarding the role of history, and making those tensions explicit will strengthen your final position. I look forward to seeing how you navigate these trade-offs in your final draft.

  Sincerely,

  Your Colleague
