      *   *Claim 2 (Moral):* Directly attacks justice. (Does the work, but needs argumentation).
      *   *Claim 3 (Economic):* Attacks efficiency, not necessarily justice. (Partially does the work).
      *   *Claim 4 (Metaphysical):* Nonsense. (Doesn't do the work).
      *   *Claim 5 (Incentive):* Attacks utility. (Partially does the work).

      *   *Crucial Point:* The phrase is often used as a conversation stopper (rhetorical flourish) rather than an argument. To actually do the work, it needs to be unpacked into the Normative or Economic claim.

  6.  **Refining the Evaluations (Platitude vs. Substantive vs. False):**
      *   *Platitude:* Something trivially true or overly broad. "Information spreads easily" is close to a platitude.
      *   *False:* "Information has desires."
      *   *Substantive:* "Zero marginal cost implies price should be zero."

  7.  **Drafting the Response (Iterative refinement):**

