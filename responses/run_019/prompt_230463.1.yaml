          4.  End with a one-sentence summary on its own line starting with "Summary:".

  2.  **Deconstruct the Phrase ("Information wants to be free"):**
      *   Origin: Stewart Brand (1984), often misquoted or taken out of context. The full quote acknowledges the tension between information wanting to be expensive (value) and free (access).
      *   Common Usages:
          *   Technological determinism (it's easy to copy).
          *   Moral imperative (knowledge is a public good).
          *   Economic efficiency (marginal cost is zero).
          *   Personification (metaphor).

  3.  **Drafting the Distinct Claims (Categorization):**

      *   *Claim 1: Descriptive/Technological.* Copying digital information is technically effortless and near-zero cost.
      *   *Claim 2: Normative/Moral.* Access to knowledge is a human right; restricting it is unethical.
      *   *Claim 3: Economic/Instrumental.* Social welfare is maximized when information is free because marginal cost is zero.
      *   *Claim 4: Metaphysical/Personification.* Information has an inherent agency or natural state of freedom.
      *   *Claim 5: Incentive/Creation.* Restricting information stifles future creativity (standing on shoulders of giants).

  4.  **Evaluating the Claims:**

      *   *Claim 1 (Descriptive):* True in a sense (marginal cost), but ignores production costs. *Verdict:* Substantive but incomplete.
      *   *Claim 2 (Normative):* Debatable. Conflicts with labor rights of creators. *Verdict:* Substantive but controversial (not a settled fact).
      *   *Claim 3 (Economic):* Strong economic argument (allocative efficiency), but ignores dynamic efficiency (incentives to create). *Verdict:* Substantive and defensible, but not absolute.
      *   *Claim 4 (Metaphysical):* Information is inanimate. *Verdict:* False (category error).
      *   *Claim 5 (Incentive):* Plausible, but empirical. Some restriction encourages creation. *Verdict:* Substantive but complex.

  5.  **Analyzing Effectiveness Against Paywalls/DRM:**

      *   *Goal:* To show paywalls/DRM are *unjust* or *wrong*.
