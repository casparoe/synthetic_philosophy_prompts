          *   *Nuance:* The user asks: Is it testimonial if he published her? Yes. Publishing isn't endorsing. It's appropriating her voice to discipline it. It's a *conditional* credibility: "You are smart, but you shouldn't be using this smartness here." This is a specific flavor of testimonial injustice often tied to *role* rather than raw capacity.

