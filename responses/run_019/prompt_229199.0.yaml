answer: |-
  Here is a session design built for nuance, conflict, and structural analysis rather than a demonstration of "look how dumb people are."

  ### **Session Overview**
  *   **Time:** 80 Minutes
  *   **Stakes:** Cash (Recommended). Do not use candy (trivializes the loss) or points (abstract). Use a crisp $5 bill. It is large enough to sting, small enough to be ethical.
  *   **Room:** Seminar table. You need eye contact between bidders.
  *   **Core Tension:** *Psychological Account* (Bias/Emotion) vs. *Game-Theoretic Account* (Local Rationality/Structure).

  ---

  ### **Part 1: The Setup (0:00 – 0:05)**
  **Goal:** Establish binding commitment without naming the game.

  **Instructor Script:**
  > "We're going to start with a quick market exercise. I have here five dollars. I am going to auction it off to the highest bidder.
  >
  > Here are the rules:
  > 1. Bids must be in 5-cent increments.
  > 2. When you bid, it is a binding contract. You will Venmo me or pay cash at the end of class. No jokes.
  > 3. **Crucial Rule:** The highest bidder wins the $5. However, the *second-highest* bidder must also pay me their final bid amount, and they get nothing.
  >
  > We will run this, then we will run a second version with a slight rule change. Any questions on the mechanics before we begin?"

  **Tactical Note:** Do not explain *why* the second bidder pays. Do not warn them about escalation. If they ask "Why does the loser pay?", say "That's just the market rule for this exercise."

  ---

  ### **Part 2: Round 1 – The Trap (0:05 – 0:25)**
  **Goal:** Let the escalation happen.

  **Execution:**
  *   Start the bidding at 5 cents.
  *   If the room is shy, seed it: "I'll take an opening bid of 5 cents. Who has 5?"
  *   **The Stall Point:** Bidding will likely slow down around 80 cents or $1.00. This is where the trap springs.
  *   **Your Role:** Be the auctioneer. Maintain pace. "Do I hear $1.10? $1.10 from Sarah. $1.15?"
  *   **The Stop Condition:** Let it run until one bidder capitulates or you hit a hard cap (e.g., $5.00) to prevent genuine financial harm. Usually, it naturally dies between $3.00 and $6.00.
  *   **Collection:** Immediately collect the money (or write down the debts) from the top two bidders. Hand the $5 to the winner. This physical exchange makes the loss real.

  ---

  ### **Part 3: Round 2 – The Variation (0:25 – 0:40)**
  **Goal:** Isolate the variable (Structure vs. Psychology).

  **The Change:** Remove the "Second-Bidder Pays" rule. This is now a standard First-Price Auction.
  **Why this variation?**
  *   If **Bias/Psychology** drives escalation (competitiveness, winning fever), students will still bid over $5.00.
  *   If **Structure** drives escalation (fear of the loser penalty), bidding should stop rationally near $5.00 (or slightly below).

  **Instructor Script:**
  > "We're going again. Same $5 bill. Same 5-cent increments. Binding contracts.
  >
  > **The Rule Change:** The highest bidder wins the $5 and pays their bid. The second-highest bidder **pays nothing**.
  >
  > Begin."

  **Execution:**
  *   This usually ends quickly. Bidding stops around $4.50 or $5.00.
  *   If someone bids $5.05, stop them. "You are paying more than the prize is worth with no penalty for losing. Why?"
  *   Collect the money.

  ---

  ### **Part 4: The Debrief (0:40 – 1:20)**
  **Goal:** Map behavior to theory without settling the science prematurely.

  #### **Phase A: The Data (10 Mins)**
  Write the results on the board.
  *   *Round 1:* Winner paid $X, Loser paid $Y. Total Revenue: $Z. (Likely > $5).
  *   *Round 2:* Winner paid $A. Total Revenue: $A. (Likely < $5).

  **Ask:**
  1.  "In Round 1, at what exact bid did you feel the 'trap' close? Was it when you passed 50 cents? When you passed $1?"
  2.  "For the two main bidders: What was your calculation at $2.00? Did you feel you were *investing* or *recovering*?"
  3.  "Round 2: Why did the bidding stop where it did? What changed in your head?"

  #### **Phase B: The Diagnoses (20 Mins)**
  Draw two columns on the board: **Cognitive Bug** vs. **Structural Trap**.

  **1. The Cognitive Bug (Bias View)**
  *   *Theory:* Escalation is driven by Loss Aversion (Kahneman/Tversky) or Ego/Competitiveness.
  *   *Evidence:* If students admit, "I knew I was losing money but I didn't want him to win," or "I got angry."
  *   *Implication:* The cure is training. Teach people to recognize emotional arousal and walk away.

  **2. The Structural Trap (Rationality View)**
  *   *Theory:* Escalation is locally rational. (Martin Shubik's original game-theoretic point).
  *   *The Math:* If I bid 95¢ and you bid $1.00:
      *   If I quit: I lose 95¢.
      *   If I bid $1.05: I risk losing 5¢ (if you quit) or more (if you continue).
      *   Losing 5¢ is better than losing 95¢. Therefore, bidding is the rational choice *once you are in*.
  *   *Evidence:* If students say, "I didn't want to win, I just wanted to lose less."
  *   *Implication:* The cure is governance. Do not enter games with open-ended liability. Change the rules (like we did in Round 2).

  **Crucial Question for the Room:**
  > "If the Structural View is right, then the bidders in Round 1 weren't irrational *after* the first dollar. They were rational prisoners. Does that let them off the hook? Or is the 'irrationality' simply the decision to place the first bid?"

  *(Note: This is where Phil/Econ majors will clash. Econ majors may argue ex-post rationality; Phil majors may argue about moral responsibility for entry. Let them.)*

  #### **Phase C: The Limits of the Game (10 Mins)**
  **Goal:** Address Requirement 6 (What the game misses).

  **Instructor Script:**
  > "This game is clean. You knew the prize was $5. You knew the rules. You could quit whenever you wanted. Real escalation is messier.
  >
  > Consider a lawsuit, a war, or a price war between firms.
  > 1. **The Prize Moves:** In a war, the 'prize' (security, honor) often grows as you pay more. In this game, the $5 never changed.
  > 2. **The Exit Cost:** In this game, you could just say 'I quit.' In a career or a war, quitting might mean total ruin, not just losing the bid.
  > 3. **Information:** You knew exactly what the other person bid. In real life, you often don't know the opponent's remaining resources.
  >
  > So, if this game is too clean, what does it actually teach us? Does it teach us how to stop a war? Or does it teach us how to spot a contract we shouldn't sign?"

  ---

  ### **Failure Modes & Fixes**

  | Failure Mode | In-the-Moment Fix | Debrief Impact |
  | :--- | :--- | :--- |
  | **The Spoiler**<br>(Student says: "This is the Dollar Auction!") | **Don't silence them.** Say: "Great. You are now the Game Warden. You cannot bid. Your job is to take notes on whether the other students behave according to the theory you know." | Use them in debrief. "Warden, did you see rational calculation or emotional panic?" |
  | **The Freeze**<br>(No one bids past 50 cents) | **Nudge the value.** "Okay, the market is cold. Let's make the prize $10." (Have a $10 bill ready). Or, "Remember, the second bidder pays. If you quit now at 40 cents, you lose 40 cents for nothing." | Discuss risk aversion. "Why didn't the trap spring? Was the stake too low to trigger the loss aversion?" |
  | **The Collusion**<br>(Two friends split the $5) | **Intervene.** "Side payments are against market rules. If I hear whispering, both of you are disqualified and owe me the current bid." | Discuss cooperation vs. competition. "Could a cartel have beaten the house? Why is that hard to sustain?" |
  | **The Quick End**<br>(Round 1 ends at $1.10) | **Acknowledge it.** "The trap failed to spring. That is data." | "Why did rationality win here? Was it because you suspected a trick? In real life, we don't suspect tricks until it's too late." |

  ---

  ### **Facilitator's Cheat Sheet: The Literature**
  *Do not present this as a lecture, but keep it in mind for the debate.*

  1.  **Martin Shubik (1971):** The inventor. He argued this demonstrates how **rational** behavior in a non-cooperative game leads to collectively **irrational** outcomes. (Supports Structural Trap).
  2.  **Kahneman & Tversky:** Would argue this is **Prospect Theory**. People value losses more than gains. Once they are in the "loss frame" (as the 2nd bidder), they take risky bets to avoid the sure loss. (Supports Cognitive Bug).
  3.  **Leininger (1989):** Showed that if players are perfectly rational and have infinite wealth, the game shouldn't even start. The fact that it starts suggests bounded rationality.
  4.  **Contested Point:** Is it irrational to continue bidding?
      *   *Yes:* You are throwing good money after bad.
      *   *No:* You are minimizing loss given the constraints.
      *   *Consensus:* The irrationality is **Entry**, not necessarily **Escalation**.

  ### **Final Note on Stakes**
  If you use cash, put the $5 bill in the center of the table at the start.
  *   **Why:** Visual anchoring.
  *   **Collection:** Have the top two bidders Venmo you immediately after the round while the class watches. The social pressure ensures payment and makes the "loss" public.
  *   **Ethics:** If a student genuinely cannot afford the loss (ask privately beforehand if you suspect financial hardship), allow them to bid "Participation Points" which you convert to cash for them if they lose, or exclude them from bidding but allow them to advise a bidder.

  ### **Closing the Session**
  End on the **Entry Condition**.
  > "If the Structural diagnosis is right, then telling people 'don't be irrational' won't stop wars or lawsuits. The only solution is to design systems where the 'second place pays' rule doesn't exist.
  >
  > Your homework is not to think about how to bid better. It's to identify one rule in your life or future career that creates a 'second-place penalty,' and how you can avoid sitting at that table."
