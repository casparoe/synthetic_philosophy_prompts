prompt: |-
  I teach a mixed seminar of philosophy and econ majors, about 18 students, one 80-minute session, and I want to run the dollar auction live in class. But here's the catch: I don't want the standard party trick where everyone giggles at the sucker who paid $3.50 for a dollar and we all nod about how irrational people are. The thing I actually want them to wrestle with is a real disagreement about what the game shows. On one reading, escalation is a cognitive bug -- people can't ignore sunk costs, hate losing, get carried away. On the other reading, the trap is in the structure, not in the skull: at every single step, bidding again can be the locally rational move, and the disaster is produced by perfectly sane responses to perverse incentives. These diagnoses matter because the cures differ. If it's a bias, you teach people to cut their losses. If it's a trap, the lesson is to never sit down at the table in the first place, or to change the rules of the game.

  So design me the session with all of that built in. Specifically:

  1. The trap should spring on them before anyone names it. No lecture up front, don't say "dollar auction" or "sunk cost." Figure out how to set it up (maybe as one item in a series of normal auctions?) so they discover what they've walked into.

  2. Run the game at least twice with a rule change in between -- you could vary the stakes, switch from open outcry to sealed written bids, or toggle the rule that the runner-up also pays. The point of the variants is that afterwards students should be able to argue, from how their own behavior changed, which diagnosis it supports. Tell me which variations you think are most diagnostic and why.

  3. There should be real but small stakes so it stings a little. I can spend a few bucks of my own money, or use candy or participation points -- advise me on what works and what backfires.

  4. Game out the predictable failure modes: the one student who's read about this game and spoils it, a room that refuses to bid at all, two friends colluding to split the prize, the auction that ends in ten seconds. For each, tell me what to do in the moment and what it does to the debrief if it happens anyway.

  5. A debrief that maps concrete moments -- the first bid over half the prize, the point where losing the auction became worse than making the next bid -- onto the two diagnoses, and that pushes students to say which one fits what they actually felt. Also: where the literature genuinely disagrees about whether this game demonstrates irrationality or rational entrapment, flag that as contested. Don't let me present "it's the sunk cost fallacy" as settled science if it isn't.

  6. Finally, an honest note on what the activity can't reproduce about real escalation -- wars, strikes, lawsuit spirals, contracts you now can't afford to lose. No fixed prize, no announced end, face and careers on the line, and often no option to just not play. What does the facilitator have to supply by hand?

  Give me a timeline with rough minutes per phase, the exact rules as you'd read them aloud, and the debrief questions. And recieve my thanks in advance for not writing me a worksheet.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Mixed Philosophy & Econ majors (18 students). This means they can handle theoretical nuance (rationality, ethics, game theory) but might also be prone to over-intellectualizing or game-playing the game.
      *   **Time:** 80 minutes.
      *   **Activity:** Dollar Auction (live).
      *   **Core Goal:** Avoid the "look how irrational they are" trope. Focus on the tension between *cognitive bias* (sunk cost, loss aversion) vs. *structural rationality* (locally optimal moves leading to global disaster).
      *   **Specific Constraints:**
          1.  No upfront naming/lecturing (trap must spring).
          2.  Run at least twice with a rule change (diagnostic variations).
          3.  Real but small stakes (advice needed).
          4.  Game out failure modes (spoilers, no bids, collusion, quick end).
          5.  Debrief must map specific moments to diagnoses and acknowledge literature disagreement.
          6.  Address limitations (what the game *doesn't* capture about real escalation).
          7.  Format: Timeline, exact script/rules, debrief questions. No worksheet.

  2.  **Deconstruct the Core Tension (Bias vs. Structure):**
      *   *Bias View:* People bid $1.10 for $1 because they hate losing the 90 cents they already bid. Emotional reaction.
      *   *Structure View:* If I bid 90c and you bid $1, I lose 90c. If I bid $1.05, I lose 5c. Losing 5c is better than losing 90c. Therefore, bidding is rational *given the current state*. The irrationality was entering the game, not continuing it.
      *   *Pedagogical Implication:* The debrief needs to force students to distinguish between *ex-ante* rationality (don't play) and *ex-post* rationality (keep bidding).

  3.  **Designing the Variations (Requirement 2):**
      *   *Round 1:* Standard Dollar Auction (Highest bidder wins $1, 2nd highest pays their bid). This establishes the trap.
      *   *Round 2:* Needs to isolate variables.
          *   *Option A:* Remove the "2nd highest pays" rule. (Tests if the trap is structural or just competitive).
          *   *Option B:* Sealed bids. (Tests if social pressure/escalation dynamics matter).
          *   *Option C:* Cap the bidding at $1. (Tests if the trap is infinite escalation).
      *   *Selection:* The most diagnostic change is removing the "loser pays" rule.
          *   *Why?* If the "Bias" theory is right, people might still overbid due to competition/winning fever. If the "Structure" theory is right, the bidding should stop near $1 because the downside risk is removed. This sharply distinguishes "I want to win" from "I'm afraid to lose what I already committed."
      *   *Wait, a better contrast:* Keep the "loser pays" but change the *entry cost* or *information*. Actually, the prompt suggests toggling the rule that the runner-up pays. Let's do that.
      *   *Round 1:* Standard (2nd place pays).
      *   *Round 2:* First-Price Auction (2nd place pays nothing).
      *   *Diagnostic:* If Round 2 stays sane (bids stop near $1) but Round 1 escalated, it supports the *Structural* argument (the rules created the trap). If Round 2 also escalates wildly, it supports the *Bias* argument (people are just competitive/irrational).

  4.  **Stakes (Requirement 3):**
      *   Cash is best for Econ/Phil majors. Candy feels childish; participation points feel bureaucratic.
      *   Amount: $5 or $10 bill is better than $1. $1 is too small to feel the sting. $20 is too risky for a prof's budget/ethics. Let's suggest a $5 bill. It's large enough to matter, small enough to cover.
      *   *Crucial:* Collect money *after*? No, must be credible commitment. But collecting 18 students' cash is messy.
      *   *Solution:* "Tab" system. You bid, you owe. Pay at the end. Or, use a "pot" where they buy in.
      *   *Better Solution:* The Professor puts the $5 on the table. Bidders put their cash on the table *as they bid*. This makes the sunk cost physical.
      *   *Refinement:* To save time, just have them pledge. "If you bid, you are legally/morally bound to pay me via Venmo/cash at the end." Honor system works in seminars.
      *   *Recommendation:* Use a crisp $5 bill. Require bidders to place their *own* cash on the desk when they bid. This makes the "sunk cost" visible.

  5.  **Failure Modes (Requirement 4):**
      *   *The Spoiler:* "Oh, this is the Dollar Auction." -> *Fix:* Acknowledge, make them the "Auditor." They can't bid, but they take notes on rationality.
      *   *No Bids:* -> *Fix:* Seed the auction. "I'll start at 10 cents." Or ask a specific confident student.
      *   *Collusion:* "We split the $5." -> *Fix:* Ban talking during bidding. If detected, disqualify both.
      *   *Quick End:* Stops at 50 cents. -> *Fix:* This is actually good data. "Why did it stop? Was the trap not sprung?"

  6.  **Debrief Strategy (Requirement 5 & 6):**
      *   Need to map specific bid points.
      *   Need to highlight the *ex-ante* vs. *ex-post* distinction.
      *   Need to acknowledge Shubik (inventor) vs. Kahneman/Tversky interpretations.
      *   Need to bridge to real world (war, litigation) where the "exit" isn't an option.

  7.  **Drafting the Timeline (80 mins):**
      *   Intro/Setup (5 mins)
      *   Round 1 (15 mins) - *The Trap*
      *   Round 2 (15 mins) - *The Variation*
      *   Debrief Part 1: The Data (15 mins)
      *   Debrief Part 2: Theory & Limits (20 mins)
      *   Wrap (10 mins)
      *   *Wait, 80 mins is tight.* Need to be crisp.
      *   Revised:
          *   Setup & Round 1: 25 mins.
          *   Round 2: 15 mins.
          *   Debrief: 40 mins.

  8.  **Refining the Rules (Scripting):**
      *   Must be precise. "Second highest bidder pays" is the key clause.
      *   Must emphasize binding commitment.

  9.  **Addressing the "Bias vs. Structure" Debate:**
      *   *Bias:* Thaler, Kahneman (Psychological accounts).
      *   *Structure:* Shubik, O'Neill (Game theoretic accounts).
      *   *Nuance:* Even if it's structurally rational to continue, is it rational to *start*? The lesson is about *entry conditions*.

  10. **Final Review against Constraints:**
      *   No worksheet? Yes.
      *   Timeline included? Yes.
      *   Exact rules? Yes.
      *   Failure modes? Yes.
      *   Stakes advice? Yes.
      *   Limitations? Yes.

  11. **Self-Correction during drafting:**
      *   *Thought:* Should Round 2 be sealed bid?
      *   *Correction:* No, open outcry is better for observing the *moment* of escalation. Sealed bid hides the emotional escalation.
      *   *Thought:* What if Round 1 doesn't escalate past $1?
      *   *Correction:* That's a teaching moment too. "Why didn't the trap spring? Was the incentive structure weak?" But usually, it does. I will advise the instructor on how to nudge if it stalls.
      *   *Thought:* Cash on the table is logistically slow.
      *   *Correction:* Use an "IOU" slip or just verbal contract enforced by social pressure + Venmo at the end. Given it's a seminar, verbal contract + Venmo is smoother. I will suggest the "Hand Raise = Binding Contract" method to save time.

  12. **Final Polish:** Ensure tone is respectful of the instructor's expertise (no "worksheet" vibe). Keep it dense and actionable. (Proceed to generate output).

  *(Self-Correction on Stakes)*: Actually, having them put cash down is *very* powerful for the "sunk cost" visualization. I will recommend it despite the time cost, or suggest a hybrid: "Place your hand on your wallet." No, let's stick to the Honor System + Venmo to keep the flow, but emphasize the *reality* of the debt.
  *Wait, one more thought:* The prompt asks for "Real but small stakes... advise me." I should advise *against* candy. Cash is king for Econ majors. $5 is the sweet spot.

  *(Self-Correction on Variation)*: If I change the rule to "2nd place doesn't pay," the game becomes a standard auction. Bidding should stop at $5 (or $1). If it stops at $1, it proves the *structure* (the loser penalty) was the cause of escalation. If it still goes to $2, it proves *irrationality/competitiveness*. This is the cleanest test.

  *(Self-Correction on Spoiler)*: If a student knows the game, don't silence them. Use them. Make them the "Game Warden." They observe but don't bid. This validates their knowledge without ruining the experiment.

  *(Final check on time)*: 80 minutes.
