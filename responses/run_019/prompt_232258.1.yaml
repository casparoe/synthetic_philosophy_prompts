answer: |-
  **The Carrying Case**
  Use Stanley Kubrick's *2001: A Space Odyssey*.
  *   **Must Have:** A specific evaluative verdict (e.g., "The Star Gate sequence is sublime"), not merely factual ("It is 2 hours long") or sensory ("It contains blue light"). It must be a claim open to dispute among competent viewers.
  *   **Must Avoid:** Moral evaluation ("It is kind") or pure preference ("I like popcorn"). This isolates *aesthetic* normativity from moral or sensory domains.

  **Teaching Sequence & Misconceptions**

  1.  **Epistemological Baseline (10 mins):** Confirm general testimony works. Use the restaurant case ("You know it's open because I said so").
      *   *Dependency:* Establishes the norm they will later contrast against.
  2.  **Pre-empt Subjectivism (15 mins):** *Critical Intervention.* Before introducing aesthetic testimony, address the "just taste" intuition.
      *   *Misconception:* "Aesthetic judgments are private feelings; Rotten Tomatoes just predicts enjoyment."
      *   *Correction:* Distinguish *predicting* pleasure from *judging* merit. If aesthetics were purely subjective, there would be no knowledge to transmit, and the debate would vanish. Establish that aesthetic claims aim at correctness. Head this off *here*, or the puzzle dissolves before it begins.
  3.  **The Aesthetic Puzzle (15 mins):** Apply testimony to the *2001* case. "I tell you it is sublime; do you know it is?"
      *   *Misconception:* "Testimony is always easy (from Epistemology)."
      *   *Correction:* Elicit the specific resistance. It feels like cheating. This creates the tension between their epistemology training and aesthetic intuition.
  4.  **The Acquaintance Principle (15 mins):** Define the intuition: First-hand experience is constitutively required for aesthetic knowledge, not just causally useful.
      *   *Dependency:* Relies on Step 2 (otherwise experience is just for generating feelings) and Step 3 (otherwise there's no resistance to explain).
  5.  **Pessimists vs. Optimists (15 mins):** Frame the debate. Pessimists: Acquaintance is a normative requirement. Optimists: No unique epistemic barrier; resistance is merely practical or psychological.

  **What to Leave Out**
  Do not survey historical sources (Kant, Hume) or metaphysical debates (realism vs. projectivism). Avoid analogies to moral testimony; it introduces separate complexities about action-guidance. Keep the focus strictly on the epistemic status of the judgment.

  **Final Check Exercise**
  Present the **"Distracted Listener"** scenario:
  "You trust me completely. I tell you a song is beautiful. You listen to it while scrolling on your phone, barely paying attention."

  Ask two questions:
  1.  "Do you know the song is beautiful?"
      *   *If Yes:* They have missed the Acquaintance Principle (experience is required).
  2.  "If No, is it because beauty is just 'in your head' (subjective)?"
      *   *If Yes:* They have collapsed acquaintance into subjectivism.
      *   *Correct Grasp:* No. You failed to know it because you didn't *attend* to the object, not because the beauty is merely your feeling. You could be wrong about the beauty (objectivity), but you cannot know it without looking (acquaintance). This distinguishes the normative requirement of experience from mere subjective reaction.
