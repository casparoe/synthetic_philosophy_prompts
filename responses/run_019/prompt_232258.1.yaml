      **The Carrying Case**
      Use Stanley Kubrick's *2001: A Space Odyssey*.
      *   **Must Have:** A clear evaluative verdict (e.g., "The Star Gate sequence is sublime"), not merely factual ("It is 2 hours long") or sensory ("It contains blue light"). It must be a claim open to dispute among competent viewers.
      *   **Must Avoid:** Moral evaluation ("It is kind") or pure preference ("I like popcorn"). This isolates *aesthetic* normativity.

      **Teaching Sequence & Misconceptions**
      1.  **Epistemological Baseline (10 mins):** Confirm general testimony works. Use the restaurant case.
          *   *Dependency:* Establishes the norm they will later contrast against.
      2.  **Pre-empt Subjectivism (15 mins):** *Critical Intervention.* Before introducing aesthetic testimony, address the "just taste" intuition.
          *   *Misconception:* "Aesthetic judgments are private feelings; Rotten Tomatoes just predicts enjoyment."
          *   *Correction:* Distinguish *predicting* pleasure from *judging* merit. If aesthetics were purely subjective, there would be no knowledge to transmit, and the debate would vanish. Establish that aesthetic claims aim at correctness. Head this off *before* Step 3, or the puzzle dissolves.
      3.  **The Aesthetic Puzzle (15 mins):** Apply testimony to the *2001* case. "I tell you it is sublime; do you know it is?"
          *   *Misconception:* "Testimony is always easy (from Epistemology)."
          *   *Correction:* Elicit the specific resistance. It feels like cheating. This creates the tension between their epistemology training and aesthetic intuition.
      4.  **The Acquaintance Principle (15 mins):** Define the intuition: First-hand experience is constitutively required for aesthetic knowledge, not just causally useful.
          *   *Dependency:* Relies on Step 2 (otherwise experience is just for generating feelings) and Step 3 (otherwise there's no resistance to explain).
      5.  **Pessimists vs. Optimists (15 mins):** Frame the debate. Pessimists: Acquaintance is a normative requirement. Optimists: No unique epistemic barrier; resistance is merely practical or psychological.

      **What to Leave Out**
      Do not survey historical sources (Kant, Hume) or metaphysical debates (realism vs. projectivism). Avoid analogies to moral testimony; it introduces separate complexities about action-guidance. Keep the focus strictly on the epistemic status of the judgment.

      **Final Check Exercise**
      Present two characters:
      1.  **The Blind Critic:** Has seen the film extensively but lacks emotional response due to depression.
      2.  **The Deaf Friend:** Has not seen the film but trusts your judgment completely.
      Ask: "Who is better positioned to assert 'The film is sublime'?"
      *   *Goal:* If they say the Deaf Friend, they miss the Acquaintance Principle. If they say neither, they may be slipping into subjectivism. The correct grasp is recognizing the Blind Critic has the *experience* but lacks the *judgment capacity*, while the Deaf Friend lacks the *justification*. The key distinction is that experience is required for the *formation* of the judgment, not just the *cause* of a feeling (subjectivism). A better question: "If the Blind Critic claims it is sublime based on memory of visuals, and the Deaf Friend claims it based on your word, whose claim is illegitimate?" (Answer: Deaf Friend's, per Acquaintance, whereas Blind Critic's is merely impaired).
