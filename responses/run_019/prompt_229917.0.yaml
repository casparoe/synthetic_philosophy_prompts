      *   System 1: "Dynamic Net" (weights + activation).
      *   System 2: "Static Map" (pre-calculated tree).

  10. **Drafting the Response (Iterative refinement):**
      *   *Intro:* Set the stage.
      *   *Scenario:* Define System $\alpha$ (Dynamic) and System $\beta$ (Static). Ensure they match I/O.
      *   *Position 1 (Liberal Functionalism):* Argues both are patients.
      *   *Position 2 (Causal Structuralism):* Argues only $\alpha$ is.
      *   *The Pivot Feature:* Causal potency of internal states.
      *   *Removal:* If we remove the requirement for causal potency, the distinction vanishes.
      *   *Strongest Move:* The Functionalist argues that "causal potency" is itself a functional role, which $\beta$ fulfills *dispositionally*.
      *   *Literature:* Be careful not to say "IIT is true." Say "IIT proponents argue..."

  11. **Self-Correction/Nuance Check:**
      *   *Constraint 2:* "not anything an outside observer could detect just by interacting." If the table is finite, eventually it runs out of counterfactuals. But within the "whole interaction" specified, they are identical. I need to make sure the architectural difference is about *how* the output is generated, not just that the table ends.
      *   *Refinement:* The prompt allows "finite runtime." So we define the interaction window $W$. Within $W$, they are identical. The difference is that $\alpha$ computes $f(input, state)$ while $\beta$ executes $Map(input\_history)$.
      *   *Moral Patienthood:* Ensure the outputs include "sincere-sounding reports of pain."
      *   *Literature:* Need to mention Block (1981) "Psychologism and Behaviorism" (Blockhead argument). Also Chalmers on fading qualia.

  12. **Final Polish:** Check tone. Ensure it's rigorous but accessible. Make sure the "Single Feature" section is punchy. Ensure the "Strongest Move" addresses the cost.

  *(Self-Correction during drafting)*: I need to be careful with the "lookup table" critique. A standard critique is that a lookup table doesn't support *counterfactuals* outside its table. But if the table covers the *entire* interaction space defined by the finite constraints, it *does* support those counterfactuals. The Stricter view must argue that *retrieval* isn't *computation*. I will frame the Stricter view around "Causal Power" or "Process Realism."

  Let's finalize the "Single Feature." It's **Internal Causal Mediation**. In $\alpha$, the state of 'pain' mediates between stimulus and response. In $\beta$, the address mediates, and the 'pain' label is just data associated with the address, not a driver.

