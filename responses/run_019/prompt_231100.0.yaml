prompt: |-
  I want you to draft the joint statement that a committed provenance-theorist and a committed perceptualist about the value of art could both sign after a good-faith adversarial collaboration. The provenance theorist holds that part of an artwork's value depends on facts about how and by whom it was made, facts that need not show up in anything you could see in the object itself. The perceptualist holds that an artwork's value supervenes on its perceptible properties, so a molecule-for-molecule duplicate of the Mona Lisa would have the same value as the original, and any extra value people put on the original is sentiment or status, not something the work itself grounds.

  They've been talking past each other about perfect forgeries for years, so I want the document to earn its keep. Structure it like this:

  1. A numbered agreed-claims section — things both sides will genuinely sign: about what happens to a work's market value and to our treatment of it when an attribution is debunked; about which valuations of an original are instrumentally sensible (as evidence, art-historical record, social coordination) rather than fetishist; maybe about which standard arguments each side is happy to abandon. Keep it from being vacuous (no 'people hold different views about fakes').

  2. A disagreements table. Columns: the sub-question; how the provenance theorist would phrase their answer; how the perceptualist would phrase their answer; and whether you think the disagreement is substantive, partly verbal, or just about words. Each side's phrasing has to be wording that side would actually accept, not a strawman.

  3. The two or three cruxes — the sub-questions such that if you settled them, at least one side would actually move — and why those are the load-bearing ones.

  4. For each crux, a case or test both sides agree bears on it, with each side's prediction recorded in advance. Include at least one of these scenarios: a forger who, by chance, produces a molecule-for-molecule duplicate of an existing painting without ever having seen it; a famous painting that turns out to be by the master's student rather than the master, with nothing about the canvas changing; and a fire where someone can save only one of two visually identical works and knows which is the original.

  Also flag any place where you think the residual disagreement is really a disagreement abotu the word 'value' (or about how to weigh different kinds of value) rather than about the objects themselves.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Participants:** A committed Provenance-Theorist (PT) vs. a committed Perceptualist (P).
      *   **Context:** Good-faith adversarial collaboration after years of talking past each other (specifically regarding perfect forgeries).
      *   **Goal:** A joint statement that "earns its keep" (non-vacuous, specific, actionable).
      *   **Structure:**
          1.  Numbered Agreed-Claims Section (genuine consensus on market value, treatment, instrumental vs. fetishist valuation, abandoned arguments).
          2.  Disagreements Table (Sub-question, PT phrasing, P phrasing, Nature of disagreement).
          3.  The Cruxes (Load-bearing sub-questions where settlement moves the needle).
          4.  Tests/Cases for Cruxes (Specific scenarios including the blind duplicate, attribution shift, and fire rescue; predictions recorded).
          5.  Flagging verbal disputes vs. substantive disputes (especially regarding "value").

  2.  **Deconstruct the Positions:**
      *   **Provenance-Theorist (PT):** Art's value depends on history/origin (who made it, when, how). A fake is less valuable *as art* even if indistinguishable. The "achievement" matters.
      *   **Perceptualist (P):** Art's value supervenes on perceptible properties. A perfect duplicate has the same *artistic* value. Extra value attached to the original is economic/social/sentimental, not aesthetic/artistic.
      *   **Common Ground:** Both care about art. Both acknowledge market realities. Both likely agree that *some* values change upon debunking, but disagree on *which* values (aesthetic vs. historical/economic).

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Constraint:* Must not be vacuous ("people disagree"). Must be signable.
      *   *Idea 1 (Market/Treatment):* Both agree market value crashes on debunking. Both agree museums treat debunked works differently (move to storage/study collection).
      *   *Idea 2 (Instrumental Value):* Both agree originals have value as historical evidence (of the artist's technique, era). This isn't "fetishism" but legitimate historical inquiry.
      *   *Idea 3 (Abandoned Arguments):* PT agrees not to say "the fake looks different if you look hard enough." P agrees not to say "the difference is *only* money."
      *   *Refinement:* Make sure the language distinguishes between "artistic value" (the battleground) and "all-things-considered value" (where they might agree).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Constraint:* Phrasing must be acceptable to each side (no strawmen).
      *   *Sub-question 1:* The nature of the loss when a forgery is revealed.
          *   PT: We lose aesthetic achievement/appreciation.
          *   P: We lose historical connection/authenticity, but the visual experience remains identical.
      *   *Sub-question 2:* The Blind Duplicate Case.
          *   PT: It's a new work, potentially valuable, but not *that* work.
          *   P: It has the same artistic value as the original.
      *   *Sub-question 3:* Definition of "Artistic Value."
          *   PT: Includes the act of creation.
          *   P: Restricted to the object's capacity to afford experience.
      *   *Nature of Disagreement:* Is it substantive or verbal? Likely a mix. The core is whether "art" includes the "act" or just the "object."

  5.  **Drafting Section 3: The Cruxes:**
      *   *Goal:* Identify what, if resolved, changes minds.
      *   *Crux 1:* Is the *act of creation* part of the artwork's ontology? (If yes, PT wins. If no, P wins).
      *   *Crux 2:* Does "Artistic Value" encompass historical significance? (If yes, PT wins. If no, P wins).
      *   *Crux 3:* The Fire Test. If forced to choose, does the choice reveal value or preference?
      *   *Selection:* Let's focus on the Ontological Status of the "Work" and the Scope of "Aesthetic Experience."

  6.  **Drafting Section 4: Tests/Cases:**
      *   *Scenario A: The Blind Duplicate.* (Required).
          *   PT: Two distinct works. Value depends on the independent achievement.
          *   P: One artistic value instantiated twice.
      *   *Scenario B: The Attribution Shift.* (Required).
          *   PT: Value drops because the achievement is lesser (student vs. master).
          *   P: Value stays same perceptually; historical context value changes.
      *   *Scenario C: The Fire.* (Required).
          *   PT: Save the original. It holds the unique history.
          *   P: Save either. But admit social pressure to save the original.
      *   *Predictions:* Need to be specific about what they expect to feel/decide.

  7.  **Flagging Verbal Disputes:**
      *   Crucial distinction: "Value" is ambiguous. Economic? Historical? Aesthetic? Moral?
      *   If P means "Aesthetic Experience" and PT means "Cultural Achievement," they might agree on the facts but fight over the label "Artistic Value."

  8.  **Review and Refine:**
      *   *Tone:* Academic but collaborative. Precise.
      *   *Check:* Did I avoid vacuity? Yes, specific claims about market and treatment.
      *   *Check:* Are the phrasings in the table fair?
          *   PT needs to sound like they care about more than money.
          *   P needs to sound like they aren't ignoring history, just categorizing it differently.
      *   *Check:* Are the cruxes load-bearing? Yes, they define the boundaries of the argument.
      *   *Check:* Did I include the specific scenarios? Yes (Blind Duplicate, Student/Master, Fire).

  9.  **Final Polish:** Ensure the distinction between "Work" (ontological) and "Object" (physical) is clear, as this is often where the friction lies. Ensure the "Abandoned Arguments" section shows growth. (Self-Correction: Make sure the PT doesn't sound like they think the fake *looks* worse. Make sure the P doesn't sound like they think history is irrelevant, just not *artistic* value).

  10. **Final Output Generation** (Proceeding to draft based on these thoughts).
answer: |-
  # Joint Statement on Artistic Value, Provenance, and Perception
  **Signed:** [Provenance-Theorist Representative] & [Perceptualist Representative]
  **Date:** October 26, 2023
  **Subject:** Outcomes of Adversarial Collaboration on the Ontology of Forgery and Value

  ## 1. Agreed Claims
  *We, the undersigned, affirm the following propositions as points of genuine consensus, reached through the clarification of terms and the elimination of rhetorical excess.*

  1.  **Market and Institutional Response:** We agree that when a work's attribution is debunked (e.g., a "Vermeer" is revealed as a Van Meegeren), its market value typically collapses, and its institutional treatment changes (e.g., removal from main galleries to study collections). We agree this is an empirical fact about the artworld, not merely a theoretical dispute.
  2.  **Instrumental vs. Intrinsic Valuation:** We agree that originals possess *instrumental* value that forgeries lack. Specifically, originals serve as unique historical evidence of an artist's technique, material choices, and historical context. Valuing an original for this evidentiary role is not "fetishism"; it is a rational preference for primary sources over copies.
  3.  **Abandoned Arguments (Provenance-Theorist):** The Provenance-Theorist abandons the claim that a perfect forgery inevitably contains perceptible flaws detectable by a sufficiently trained eye. We concede that a molecule-for-molecule duplicate is physically possible in principle, and our argument must rest on non-perceptible facts.
  4.  **Abandoned Arguments (Perceptualist):** The Perceptualist abandons the claim that the premium placed on originals is *merely* economic speculation or snobbery. We concede that the knowledge of origin can alter the *experience* of viewing (the "psychological effect"), even if it does not alter the physical object, and that this alteration is a legitimate part of human engagement with art, even if we dispute whether it counts as "artistic value."
  5.  **The "Fire Test" Intuition:** We agree that in a scenario where one must choose between saving an original and a perfect duplicate (and only one can be saved), almost all agents will choose the original. We disagree on *why* (see Section 3), but we agree on the predicted behavior.

  ## 2. Disagreements Table
  *Where we continue to diverge, we have standardized our phrasing to ensure we are describing our own positions accurately, rather than attacking a caricature of the other.*

  | Sub-Question | Provenance-Theorist Phrasing | Perceptualist Phrasing | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. The Locus of Value** | Artistic value is partially constituted by the **achievement** of the artist. A forgery fails to instantiate the specific creative breakthrough of the original maker, regardless of its visual match. | Artistic value supervenes on the **capacity to afford aesthetic experience**. If the object affords the same experience, the artistic value is identical; history affects *contextual* value, not *artistic* value. | **Substantive.** Disagreement on the definition of "Artistic Value." |
  | **2. The Ontology of the Work** | The "Work" is an **event-type** or action-history. Two objects with identical perceptual properties but different histories are distinct Works with distinct values. | The "Work" is a **structure-type** defined by perceptual properties. Two objects with identical perceptual properties instantiate the same Work, regardless of history. | **Substantive.** Disagreement on the metaphysics of artworks. |
  | **3. The "Loss" in Forgery** | When a forgery is revealed, we lose something **aesthetic**: the appreciation of the specific genius that solved the artistic problem originally. | When a forgery is revealed, we lose something **historical**: the connection to the specific cultural moment and agent. The visual beauty remains intact. | **Partly Verbal.** Depends on whether "historical connection" is a subset of "aesthetic appreciation." |
  | **4. The Blind Duplicate** | If a forger creates a duplicate without seeing the original, they have created a **new, distinct work**. Its value depends on their independent achievement, not its similarity to the first. | If a forger creates a duplicate without seeing the original, they have instantiated the **same artistic value** twice. The value is replicated, not new. | **Substantive.** Disagreement on whether value is token-specific or type-specific. |

  ## 3. The Cruxes
  *These are the load-bearing sub-questions. If we settled these, the remaining disagreement would dissolve or become negligible.*

  **Crux A: Is the "Act of Creation" Part of the Artwork?**
  *   **Why it matters:** If the artwork *includes* the historical act of its making (PT view), then a duplicate literally cannot be the same artwork, and its value is necessarily different. If the artwork is solely the resulting configuration of properties (P view), the act is external context.
  *   **Resolution Condition:** If the Perceptualist accepts that art is a form of *communication* from a specific agent to a viewer, they may concede that the identity of the agent is internal to the work. If the Provenance-Theorist accepts that art can be appreciated purely as *sensory organization*, they may concede that the act is external to the aesthetic experience.

  **Crux B: The Scope of "Aesthetic Experience"**
  *   **Why it matters:** The Perceptualist argues value is limited to what is seen/felt. The Provenance-Theorist argues that *knowing* the history is part of the experience.
  *   **Resolution Condition:** If we can agree that "Aesthetic Experience" inherently includes cognitive/historical knowledge (e.g., knowing a line was difficult to draw enhances the sight of the line), the Perceptualist position collapses into the Provenance position. If we agree that "Aesthetic Experience" must be isolatable from knowledge (the "Ideal Viewer" test), the Provenance position is weakened.

  **Crux C: The Normativity of Preservation**
  *   **Why it matters:** In the Fire Test (Section 4), *why* do we save the original?
  *   **Resolution Condition:** If we save the original solely because it is evidence (like a historical document), the Perceptualist wins (it's instrumental value). If we save it because the *other* object feels like a "void" or "lie" despite looking identical, the Provenance-Theorist wins (it's ontological value).

  ## 4. Agreed Tests and Predictions
  *We propose the following thought experiments and real-world cases as bearing directly on the Cruxes. We record our predictions in advance.*

  ### Case 1: The Blind Duplicate (The "Boltar" Scenario)
  **Scenario:** An artist in 2024, having never seen the *Mona Lisa*, paints a molecule-for-molecule duplicate by pure chance/independent derivation.
  *   **Provenance-Theorist Prediction:** This is a **new work**. It has value as a miraculous coincidence, but it does not possess the value of the *Mona Lisa*. It is not a "Mona Lisa."
      *   *Rationale:* The value of the *Mona Lisa* lies in Da Vinci's specific solution to a 16th-century problem. The 2024 artist solved no such problem.
  *   **Perceptualist Prediction:** This object possesses the **same artistic value** as the *Mona Lisa*.
      *   *Rationale:* The visual organization is identical. The capacity to afford aesthetic experience is identical. To deny this is to privilege magic over perception.
  *   **Crux Addressed:** Crux A (Ontology of the Work).

  ### Case 2: The Attribution Shift (Master vs. Student)
  **Scenario:** A painting long attributed to Rembrandt is proven (via new tech) to be by his student, painted in Rembrandt's studio, under his supervision. The canvas and paint do not change.
  *   **Provenance-Theorist Prediction:** The work's value **decreases**.
      *   *Rationale:* The "achievement" metric shifts. We are no longer looking at the hand of the master solving the problem, but a competent execution of instructions. The artistic narrative changes.
  *   **Perceptualist Prediction:** The work's artistic value **remains constant**, but its *market/historical* value decreases.
      *   *Rationale:* The visual properties that afford the experience are unchanged. The drop in price reflects a loss of historical scarcity, not a loss of beauty or perceptual power.
  *   **Crux Addressed:** Crux B (Scope of Aesthetic Experience).

  ### Case 3: The Fire Test (Normative Preservation)
  **Scenario:** A fire breaks out in a museum. Room A contains the *original* *Mona Lisa*. Room B contains a *perfect perceptual duplicate* (created by a futuristic scanner/printer). You can save only one. Both will be destroyed if you do nothing. No one else will know which you saved.
  *   **Provenance-Theorist Prediction:** You **ought** to save the Original.
      *   *Rationale:* The Original holds the unique historical trajectory and the authentic trace of the artist. Saving the duplicate is saving a shell; saving the original is saving the work itself.
  *   **Perceptualist Prediction:** You **ought** to save the Original, **BUT**...
      *   *Rationale:* ...only because the Original is the unique *historical artifact*. If the goal is to preserve *artistic value* (the capacity for future viewers to have the experience), either suffices. The obligation to save the original is an obligation to history, not to art *qua* art.
  *   **Crux Addressed:** Crux C (Normativity of Preservation).

  ## 5. Flagged Verbal Disputes
  *We identify the following areas where our disagreement appears to be terminological rather than factual.*

  1.  **The Definition of "Value":**
      *   **Flag:** When the Perceptualist says "Value," they often mean "Capacity for Immediate Perceptual Experience." When the Provenance-Theorist says "Value," they often mean "Cultural Achievement + Perceptual Experience."
      *   **Resolution Path:** We agree to use the compound term **"Aesthetic-Historical Value"** when discussing the Provenance view and **"Perceptual Value"** when discussing the Perceptualist view, to avoid conflating the two in future debates.

  2.  **The Definition of "Work":**
      *   **Flag:** We frequently talk past each other regarding whether the "Work" is the physical object or the generative event.
      *   **Resolution Path:** We agree that for the Perceptualist, the Work is a **Perceptual Type**. For the Provenance-Theorist, the Work is a **Historical Token**. We acknowledge that many arguments dissolve if we specify which ontology is being used in the premise.

  3.  **The "Fetish" Accusation:**
      *   **Flag:** The Perceptualist tends to label provenance-preference as "fetishism." The Provenance-Theorist tends to label perceptual-isolation as "shallow."
      *   **Resolution Path:** We agree to retire these terms. Preference for origin is a rational preference for historical connection (PT). Preference for perception is a rational preference for experiential quality (P). Neither is inherently irrational.

  ***

  **Signed,**

  __________________________
  *Provenance-Theorist Representative*

  __________________________
  *Perceptualist Representative*
