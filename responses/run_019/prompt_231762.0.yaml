answer: |-
  You have hit on one of the most famous and enduring objections to classical utilitarianism. You are reading Bentham very closely, and your intuition is sharp. This is often called the problem of **"malicious pleasures"** or **"sadistic utility."**

  Here is the breakdown of why Bentham argues the way he does, whether he is smuggling in non-utilitarian principles, and why he thinks the math still works against the mob.

  ### 1. Does Bentham exclude sadistic pleasure?
  **Technically, no.**
  Bentham is a psychological hedonist. He believes humans are governed by two sovereign masters: pain and pleasure. He famously refused to qualitatively rank pleasures (unlike John Stuart Mill, who came later). For Bentham, "push-pin [a simple game] is as good as poetry" if it produces the same amount of pleasure.

  He does not explicitly write a rule that says, *"Pleasure derived from the suffering of others counts for zero."* If he did that, you would be absolutely right: he would be smuggling in a deontological (rights-based) constraint that violates his own system.

  ### 2. So, why does he think the math fails for the mob?
  Bentham argues against punishing sodomy (and other "victimless crimes") not because the mob's pleasure is invalid, but because **the pain caused by the punishment outweighs the pleasure of the punishment.**

  He relies on a few specific variables in his "felicific calculus" that often get overlooked:

  *   **Intensity and Certainty:** The pain suffered by the person being punished (torture, imprisonment, execution) is intense and certain. The pleasure felt by the public is often fleeting, vague, and less intense.
  *   **Extent (The Argument from Security):** This is Bentham's heavy lifter. If the law punishes acts that cause no direct harm to others, it creates **insecurity**.
      *   If the government can punish you for what you do in private, *no one* is safe.
      *   This generates a background radiation of **anxiety and fear** across the entire population.
      *   Bentham argues that the sum total of this anxiety (spread across the whole society) outweighs the sadistic gratification of the majority.
  *   **Long-term Consequences:** A legal system that punishes harmless acts loses legitimacy. It encourages blackmail (a huge concern for Bentham regarding sodomy laws) and wastes resources that could be used to prevent actual harm.

  So, Bentham's argument isn't "Their pleasure doesn't count." It is "Their pleasure is outweighed by the offender's pain **plus** the societal fear of arbitrary punishment."

  ### 3. Did he "bite the bullet"?
  This is where it gets messy. If you construct a hypothetical scenario where:
  1.  The sadistic pleasure of the mob is *massive*.
  2.  The victim's pain is *minimized*.
  3.  There is *no* resulting societal anxiety (perhaps everyone agrees the victim is an "enemy").

  ...then **yes, strict Benthamite utilitarianism would require punishing the innocent.**

  Bentham was aware of this tension. However, he generally operated as a **legislative utilitarian** (focused on making rules) rather than an **act utilitarian** (judging every single act in real-time). He believed that a *rule* allowing the punishment of harmless acts would almost *never* maximize utility in the real world because it undermines the **principle of expectation.**

  For Bentham, the stability of law is a utility multiplier. If people can expect the law to only punish harmful acts, they can plan their lives and be happier. If the law is capricious, happiness plummets. So, he avoids the bullet by arguing that in the *real world*, the long-term pain of undermining legal security always outweighs the short-term pleasure of sadism.

  ### 4. The "False Belief" Loophole
  There is one other angle Bentham uses, specifically regarding religion and sodomy. He often argues that the pleasure the public gets from punishing sodomites is based on **false beliefs** (e.g., "God will destroy our city if we allow this").

  Bentham sometimes suggests that pleasures based on false premises are less valuable or should be discounted because they encourage irrationality, which leads to bad decision-making elsewhere. However, this is the weakest part of his theory, and many critics argue this *is* a form of smuggling in a non-utilitarian value (truth/rationality) over pure pleasure.

  ### 5. Why your intuition is right (and where Mill comes in)
  You are sensing a flaw that later utilitarians tried to fix.
  *   **Bentham:** Struggles with this. He relies on the calculus of security to hope the math works out.
  *   **John Stuart Mill:** Saw this exact problem. In *On Liberty*, Mill introduces the **Harm Principle**. He argues that the *only* reason power can be exercised over someone is to prevent harm to others. Mill effectively tries to "smuggle in" a right to liberty to prevent exactly the scenario you described (the tyranny of the majority).

  ### Summary
  You aren't missing anything.
  1.  **Bentham does not explicitly exclude sadistic pleasure.**
  2.  **He argues the punishment is wrong because of the *secondary pains* (fear, insecurity, blackmail), not because the pleasure is invalid.**
  3.  **In a extreme hypothetical where the mob's pleasure is huge and security isn't threatened, Bentham's system might theoretically allow the punishment.** This is widely considered a major bug in classical utilitarianism.

  Bentham tries to solve this with the **utility of security**, but you are correct to sense that he is walking a tightrope. If the majority's hatred is strong enough, his system has a hard time protecting the minority without quietly importing a concept of "rights" that he officially rejects.

  Keep reading with that skepticism. It's the best way to understand the limits of utilitarianism.
