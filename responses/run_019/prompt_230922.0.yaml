answer: |-
  This is a sophisticated dispute. You are effectively defending a precursor to **Functional Decision Theory (FDT)** or a strong version of **Evidential Decision Theory (EDT)** against standard **Causal Decision Theory (CDT)**. Your friend is arguing from the CDT intuition: *my choice cannot causally influence a distant, independent agent.* You are arguing from the logical correlation intuition: *if we are identical reasoners facing identical inputs, our outputs must correlate.*

  To avoid being unfalsifiable, you need to know where the logical correlation breaks. Superrationality relies on a specific metaphysical and epistemic architecture. If that architecture crumbles, the decision rule collapses.

  Here is the map of defeaters, sorted from **Fatal** (the theory breaks) to **Awkward** (the theory survives but loses utility), along with an assessment of the "insulation risk."

  ---

  ### I. Fatal Defeaters (The "Must Grant" Zone)
  *These are conditions under which superrationality yields worse outcomes than standard rationality, or simply fails to function. A committed superrationalist must concede that if these conditions hold, their framework is inapplicable or inferior.*

  **1. Evolutionary Instability in Mixed Populations**
  *   **The Argument:** Superrationality is not an Evolutionarily Stable Strategy (ESS). In a population of 99% superrationalists and 1% "defectors" (standard Nash rationalists), the defectors win. In a Prisoner's Dilemma, the superrationalist cooperates (expecting the other to cooperate). The defector defects (knowing the other will cooperate). The defector gets the highest payoff; the superrationalist gets the "sucker's payoff."
  *   **Why it's Fatal:** If decision theories are subject to selection pressure (in markets, biology, or social learning), superrationalists will be outcompeted and go extinct. A decision theory that leads to its own elimination in any realistic mixed environment is pragmatically dead.
  *   **Verdict:** **Live.** This is the strongest empirical argument against superrationality in the real world. You must grant that superrationality requires a *homogeneous* population of superrationalists to work.

  **2. Logical Independence (The "Broken Link")**
  *   **The Argument:** Superrationality assumes your decision and your counterpart's decision are logically linked (i.e., they are computations of the same function). If there is *any* source of independence—true randomness, quantum indeterminacy in the brain, or distinct causal histories that diverge—the correlation drops below 100%.
  *   **Why it's Fatal:** If the correlation is not perfect, the math changes. If there is even a 1% chance your counterpart is *not* running the same algorithm, the expected utility calculation shifts toward standard Nash equilibrium. If the link is weak, superrationality becomes irrational.
  *   **Verdict:** **Live.** In the real world, perfect logical symmetry is impossible. You must grant that superrationality degrades continuously with asymmetry. It is not a binary switch; it is a dial based on the strength of the correlation.

  **3. The "Trembling Hand" with Asymmetric Information**
  *   **The Argument:** In Hofstadter's Luring Lottery, the superrational solution involves submitting a probability (e.g., $1/N$). But this requires everyone to submit the *same* probability. If I reason that I should submit $1/N$, but I suspect you might reason $1/(N+1)$ due to a slight difference in priors, the coordination fails.
  *   **Why it's Fatal:** Without a focal point or Schelling point to anchor the specific calculation, multiple "superrational" equilibria exist. If we can't coordinate on *which* superrational algorithm to run, we crash.
  *   **Verdict:** **Live.** This undermines the Platonia Dilemma in anything but the most sterile textbook conditions.

  ---

  ### II. Severe Conceptual Challenges (The "Awkward" Zone)
  *These do not falsify superrationality, but they impose heavy costs. They force the superrationalist into complex epistemic contortions.*

  **1. The Common Knowledge Requirement**
  *   **The Challenge:** For me to be superrational, I must know that you are superrational. But for you to be superrational, you must know that I know that you are superrational. This requires **Common Knowledge of Rationality**.
  *   **The Cost:** In almost any real-world scenario, this chain breaks after 2 or 3 levels. "I think you're smart, but do you think I'm smart enough to realize you're smart?" If the chain breaks, the logical link dissolves, and you revert to Nash.
  *   **Superrationalist Defense:** You can argue that "ideal reasoners" by definition have this common knowledge.
  *   **Exposure:** High. This insulates the theory but makes it inapplicable to humans.

  **2. Computational Irreducibility**
  *   **The Challenge:** To know that your output matches mine, I essentially have to simulate you. But if you are as complex as me, simulating you requires as much computation as I possess. I cannot run the simulation *and* make the decision.
  *   **The Cost:** This suggests that perfect symmetry is computationally unknowable from the inside. I can never be *certain* we are symmetric; I can only assign a probability.
  *   **Superrationalist Defense:** We don't need to simulate; we just need to know we are running the same source code (logic).
  *   **Exposure:** Medium. It pushes the theory into the realm of abstract logic rather than practical psychology.

  **3. Indexical Uncertainty (The "Why Me?" Problem)**
  *   **The Challenge:** Even if we are identical clones, *I* am located here and *you* are located there. When I decide, I am deciding for "this body." Why does my decision control "that body"? This requires accepting a specific view of identity (open individualism or a specific view of logical counterfactuals) that is not standard.
  *   **The Cost:** It requires adopting a controversial metaphysics of mind to make the decision theory work.
  *   **Exposure:** Medium. It's not a logical contradiction, but it limits the audience to those willing to accept the metaphysics.

  ---

  ### III. The Insulation Risk: "Does it Explain Nothing?"
  *Your friend's worry: If you keep retreating to "perfect symmetry" and "ideal reasoners," isn't the theory vacuous?*

  This is the **External Validity** objection. Here is how to assess it:

  1.  **The "Approximate Symmetry" Defense:** A superrationalist can argue that perfect symmetry isn't required, only *high* correlation. If I am 90% sure you reason like me, I should weight my decision 90% toward the superrational choice.
      *   *Risk:* As soon as you introduce probabilities, the math often collapses back toward CDT/Nash unless the correlation is extremely high.
  2.  **The "Normative" Defense:** Superrationality isn't a description of how humans *do* act, but how they *should* act if they want to maximize group utility in high-trust environments.
      *   *Risk:* This turns it into a moral theory rather than a decision theory. If it doesn't maximize *individual* expected utility in mixed populations (see Evolutionary Instability above), it fails as a decision theory.
  3.  **The "Focal Point" Defense:** In real-world analogs (e.g., two generals attacking without communication), superrationality explains coordination on Schelling points better than Nash does.
      *   *Risk:* This is the strongest ground for superrationality. If you can show it solves coordination problems that Nash leaves indeterminate, it has explanatory power.

  **Verdict on Insulation:** The position is insulated *only if* you claim it applies to humans in asymmetric settings. If you restrict it to "high-correlation logical subroutines," it is not vacuous, but its domain is narrow (e.g., AI coordination, identical algorithms, or very tight cultural homogeneity).

  ---

  ### IV. What You Can Rightfully Dismiss
  *Your friend likely used arguments that do not actually land against a sophisticated superrationalist.*

  1.  **"It's Magical Thinking / Causation":**
      *   *Dismissal:* You can rightly reject the premise that **causation** is the only valid link for decision theory. Superrationality (and FDT) posits that **logical correlation** is a valid basis for expectation. Calling this "magic" is begging the question in favor of Causal Decision Theory. It's not magic; it's conditioning on the output of a logical function.
  2.  **"You Can't Change Their Choice":**
      *   *Dismissal:* Superrationalists agree they cannot *causally* change the other's choice. The claim is that by choosing X, I select the possible world where the logical function outputs X, which implies the other agent (running the same function) also outputs X. I am not changing their choice; I am selecting which logical reality I inhabit.
  3.  **"It Violates Dominance":**
      *   *Dismissal:* Standard game theory says "Defect dominates Cooperate." Superrationality rejects the independence axiom required for dominance to hold. If my choice is evidence of their choice, dominance reasoning is invalid. You don't have to accept dominance as a sacred cow.

  ---

  ### V. Summary: How Exposed Are You?

  You are **moderately exposed**, but not fatally, provided you retreat to the right trench.

  | Objection | Status | Action Required |
  | :--- | :--- | :--- |
  | **Evolutionary Instability** | **Fatal** | Grant that superrationality fails in mixed populations. It requires a "superrational coalition" to survive. |
  | **Logical Independence** | **Fatal** | Grant that if the correlation isn't near-perfect, the strategy fails. |
  | **Common Knowledge** | **Severe** | Acknowledge this limits the theory to very high-trust or transparent agents (e.g., AIs). |
  | **"Magical Thinking"** | **Dismissible** | Reject the premise that causation is the only valid decision link. |
  | **Vacuity / Insulation** | **Manageable** | Argue for "Approximate Superrationality" in high-correlation human contexts (culture, ideology) or AI alignment. |

  **The Winning Move:**
  Don't defend superrationality as a universal rule for *humans* in *general* society. Your friend is right that it fails there (due to asymmetry and defection).
  Instead, defend it as:
  1.  **The correct normative rule for identical algorithms** (crucial for AI safety/coordination).
  2.  **A descriptive model for high-symmetry human subgroups** (e.g., ideological groups, tight-knit communities) where correlation is high enough to make the logic pay off.
  3.  **A solution to coordination problems** where Nash Equilibrium yields suboptimal or indeterminate results.

  If you claim it applies to "everyone, everywhere, always," you are falsifiable and likely wrong. If you claim it applies to "agents with high logical correlation," you are on solid ground, but you must accept the evolutionary vulnerability of such agents in a wider, hostile world.
