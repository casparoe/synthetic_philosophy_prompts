      *(Self-Correction on "Missing"):* Both miss the pragmatic/linguistic turn. They argue about reality, but maybe it's about how we use language. Also, both ignore the possibility of "Stage Theory" (Exdurantism) which Daniel hints at but Ruth conflates with Perdurantism. I should mention this in the "What is missing" section.

      *(Refining the "Relation" point):* Be careful. Endurantists distinguish between "having a property at a time" (adverbial) vs "having a relation to a time". Daniel claims she *must* treat it as a relation. Technically, she can treat it as a triadic relation of instantiation. Daniel is right that the *logical form* changes, even if she denies the word "relation".

      *(Refining the "Static" point):* Ruth argues the pear never ripens. Daniel argues ripening *is* the variation. This is a clash of A-theory vs B-theory intuitions underlying the persistence debate. I should note this.

