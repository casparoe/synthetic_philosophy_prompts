  ## Leaf Definitions

  1.  **Evaluativism**
      *   *Formulation:* Reports of taste change reflect shifts in preference or judgment, not changes in sensory experience.
      *   *Awkward Consequence:* Must explain why subjects insist the *sensation* itself changed, not just their opinion of it.
  2.  **Discriminative Realism**
      *   *Formulation:* Phenomenal differences are identical to differences in discriminatory behavioral capacities.
      *   *Awkward Consequence:* Implies a subject who cannot behaviorally distinguish two stimuli cannot experience them differently.
  3.  **Skeptical Realism**
      *   *Formulation:* Intrinsic qualities exist, but physical evidence overrides introspective reports when they conflict.
      *   *Awkward Consequence:* Undermines the privileged first-person authority usually granted to experience.
  4.  **Eliminativism**
      *   *Formulation:* The concept of intrinsic "qualia" is incoherent and should be discarded from our ontology.
      *   *Awkward Consequence:* Must explain away the overwhelming intuitive sense that experiences *feel* like something.
  5.  **Representationalism**
      *   *Formulation:* The qualitative character of experience is fully determined by its representational content.
      *   *Awkward Consequence:* Struggles to account for moods or sensations (like pure pain) that seem to lack external representational content.
  6.  **Robust Realism (Intrinsic)**
      *   *Formulation:* Experiences possess irreducible, intrinsic properties that are not exhausted by function or representation.
      *   *Awkward Consequence:* Implies the existence of facts (about private feels) that are potentially unknowable by third-party science.
  7.  **Biological Functionalism**
      *   *Formulation:* Mental states are functional states, but they can only be realized in biological substrate.
      *   *Awkward Consequence:* Appears arbitrarily chauvinistic against silicon-based systems that mimic human behavior perfectly.
  8.  **Illusionism**
      *   *Formulation:* Functional states are real, but the belief that they possess "phenomenal feel" is a cognitive illusion.
      *   *Awkward Consequence:* Requires explaining how an illusion of feeling can exist without there being a feeling of illusion.
  9.  **Quietism**
      *   *Formulation:* Functional states are real, but debating their ontological status is undecidable or linguistically confused.
      *   *Awkward Consequence:* Risks halting scientific progress by declaring core questions about mind out of bounds.
  10. **Functional Realism**
      *   *Formulation:* Functional states are robustly real entities that constitute experience and are empirically accessible.
      *   *Awkward Consequence:* Must accept that a perfect simulation of a scream is literally a instance of suffering.

  ***

  ## Analysis of Logical Space

  ### Indistinguishable Positions
  This taxonomy structurally separates positions that may be philosophically indistinguishable in practice.
  *   **Functionalism vs. Representationalism:** The tree separates these via Node 3 (Hidden Fact) and Node 6 (Content Type). However, a Representationalist (Leaf 5) and a Functional Realist (Leaf 10) often agree on all empirical predictions. The distinction rests on whether one defines the state by its *causal role* (Function) or its *aboutness* (Representation), which may be two descriptions of the same posit.
  *   **Illusionism vs. Eliminativism:** The tree places Illusionism (Leaf 8) on the Functional path and Eliminativism (Leaf 4) on the Qualia path. However, both deny the existence of robust, intrinsic qualia. The difference is merely rhetorical: one says "qualia are an illusion" (Illusionism) while the other says "the concept is incoherent" (Eliminativism). The tree cannot empirically distinguish these stances.

  ### Unoccupied Combinations
  Certain logical combinations of answers are left unoccupied in this tree.
  *   **Non-Reductive Functionalism:** (Node 7: Yes / Node 8: No / Node 9: Real + "Something Extra"). This position holds that AI can have mental states, they are real, but not *exhausted* by function. It is unoccupied here to preserve the binary structure of Node 8, but it is a **viable, underexplored** position in the literature (often associated with property dualism).
  *   **Panpsychism:** (Node 3: Yes / Node 7: Yes). This position holds that intrinsic facts exist (Node 3) and are substrate-independent (Node 7). It is unoccupied because the tree forces a choice between "Hidden Fact" (Qualia path) and "Substrate Independence" (Functional path). This is **not incoherent**, but it requires a restructuring of the tree to allow intrinsic facts to apply to AI.
  *   **Skeptical Functionalism:** (Node 3: No / Node 4: Record Overrides). This combination is **incoherent**. If there is no hidden intrinsic fact (Node 3: No), there is no introspective claim about intrinsic quality to override with a record (Node 4).
  *   **Biological Eliminativism:** (Node 7: No / Node 8: Yes). This combination is **unattractive**. It claims only biology has mental states, but those states are fictions. It combines the cost of bio-chauvinism with the cost of denying experience, gaining no explanatory advantage.
