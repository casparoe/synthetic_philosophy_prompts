  # Taxonomy of Qualia Coherence: A Decision Tree

  **Starting Datum:** Adult humans ordinarily report changes in what their experiences are like (e.g., "This coffee tastes different than it used to").

  *   **Node 1: Locus of Change**
      *   *Question:* In the coffee-taster case, is the reported change located in the **sensory registration** (the input signal) or the **evaluative reaction** (the downstream consumer of the signal)?
      *   *Commitments:*
          *   **Sensory:** Commits you to the view that the phenomenological change originates in the perceptual module itself.
          *   **Evaluative:** Commits you to the view that the perceptual signal is stable, but the preference or judgment layer has shifted.
      *   **Branch A (Evaluative):** → **Leaf 1**
      *   **Branch B (Sensory):** → **Node 2**

  *   **Node 2: Discriminability**
      *   *Question:* If the change is sensory, does it entail a difference in **behavioral discrimination** (e.g., can the subject sort or match the samples in a blind test)?
      *   *Commitments:*
          *   **Yes:** Commits you to the view that phenomenological differences must be cashed out in observable discriminatory capacities.
          *   **No:** Commits you to the view that experience can change without any change in the ability to distinguish stimuli.
      *   **Branch A (Yes):** → **Leaf 2**
      *   **Branch B (No):** → **Node 3**

  *   **Node 3: Hidden Intrinsic Fact**
      *   *Question:* If discrimination is identical, but two subjects insist the **intrinsic quality** differs, is there a **hidden fact** about their experience beyond their functional profiles?
      *   *Commitments:*
          *   **No:** Commits you to the view that experience is fully constituted by functional/relational properties (Functionalism path).
          *   **Yes:** Commits you to the view that there are non-functional, intrinsic properties of mind (Qualia Realism path).
      *   **Branch A (No Hidden Fact):** → **Node 7**
      *   **Branch B (Hidden Fact):** → **Node 4**

  *   **Node 4: Memory Authority**
      *   *Question:* When introspective report conflicts with an archived record (where independent evidence shows the **record is corrupted**), does **introspection override** the physical evidence?
      *   *Commitments:*
          *   **No:** Commits you to the view that first-person authority is fallible and subordinate to third-party physical data.
          *   **Yes:** Commits you to the view that introspective access has a privileged epistemic status regarding experience.
      *   **Branch A (Record Overrides):** → **Leaf 3**
      *   **Branch B (Introspection Overrides):** → **Node 5**

  *   **Node 5: Conceptual Coherence**
      *   *Question:* Given that introspection overrides physical records, is the concept of a private, intrinsic **"feel"** logically coherent?
      *   *Commitments:*
          *   **Incoherent:** Commits you to the view that the concept refers to nothing and generates paradoxes.
          *   **Coherent:** Commits you to the view that such entities can exist without contradiction.
      *   **Branch A (Incoherent):** → **Leaf 4**
      *   **Branch B (Coherent):** → **Node 6**

  *   **Node 6: Content Type**
      *   *Question:* If coherent, is the experience defined by its **intrinsic feel** or by its **representational content** (what it tells the subject about the world)?
      *   *Commitments:*
          *   **Representational:** Commits you to the view that the "what it's like" is exhausted by the information carried.
          *   **Intrinsic:** Commits you to the view that the "what it's like" is a non-representational quality.
      *   **Branch A (Representational):** → **Leaf 5**
      *   **Branch B (Intrinsic):** → **Leaf 6**

  *   **Node 7: Substrate Independence**
      *   *Question:* (Returning to No Hidden Fact) If a behaviorally and functionally **indistinguishable artificial system** confidently describes taste, does it possess the **same state**?
      *   *Commitments:*
          *   **No:** Commits you to the view that biological substrate is necessary for this state (Bio-Chauvinism).
          *   **Yes:** Commits you to the view that mental states are substrate-independent (Computationalism).
      *   **Branch A (No):** → **Leaf 7**
      *   **Branch B (Yes):** → **Node 8**

  *   **Node 8: Ontological Status**
      *   *Question:* If the AI has the state, is the functional state a **useful fiction** (nothing really exists but the behavior)?
      *   *Commitments:*
          *   **Yes:** Commits you to the view that talk of "experience" is a pragmatic shorthand for complex input-output mappings.
          *   **No:** Commits you to the view that functional states are genuine ontological entities.
      *   **Branch A (Yes):** → **Leaf 8**
      *   **Branch B (No):** → **Node 9**

  *   **Node 9: Decidability**
      *   *Question:* If the functional state is real, is its nature **empirically decidable** or **fundamentally undecidable**?
      *   *Commitments:*
          *   **Undecidable:** Commits you to the view that the ontology of functional states is a pseudo-question or beyond inquiry.
          *   **Decidable:** Commits you to the view that functional states are robustly real entities accessible to science.
      *   **Branch A (Undecidable):** → **Leaf 9**
      *   **Branch B (Decidable):** → **Leaf 10**

