  **Summary of the disagreement**
  Maya and Dominic dispute whether Kant's prohibition on standing armies is primarily normative or empirical. Maya argues the core objection is deontological: professional soldiers are treated as "mere machines," violating human rights, and insulating citizens from war's burdens. She insists this reading depends on the essay's architectonic, linking preliminary bans to definitive republican conditions. Dominic counters that Kant's argument rests on empirical claims about arms races and the economic burden of peace. He argues that if professional armies no longer inevitably provoke conflict, Kant's point fails. He further challenges Maya's normative claim by analogizing soldiers to paid risk-takers like firefighters. The debate hinges on whether the Preliminary Articles function as independent pragmatic rules or as normative prerequisites for a republican federation.

  **Point-by-point adjudication**
  Maya is correct that the "mere machines" passage anchors the argument in normative right, not mere prudence. Kant's claim that paying men to kill violates "rights of mankind in our own person" is deontological; it holds regardless of whether an arms race occurs. Dominic is right that the text includes empirical claims about arms races, but wrong to suggest these exhaust the argument's force. If the argument were purely empirical, the prohibition would be contingent, contradicting the categorical "Shall... Be Totally Abolished." Kant often uses empirical consequences to illustrate violations of Right, but the violation itself is a priori. Dominic's empirical challenge assumes Kant's philosophy relies on predictive success. But Kantian Right is not utilitarian; it does not become false if peace persists with armies. It remains unjust. Thus, Dominic's condition for the argument's failure is misplaced.

  Regarding the firefighter analogy, Dominic fails. Kant's objection is not to paid risk, but to being instrumented for *coercive violence* at another's will. Firefighters preserve life; standing armies threaten it. Moreover, the firefighter serves the public directly, whereas the standing soldier serves the state's monopoly, potentially against the public interest if the state becomes despotic. This political dimension is absent in Dominic's comparison. The soldier in a standing army is a tool of state policy detached from the public will.

  On the architectonic, Maya is stronger. The Preliminary Articles clear the ground for the Definitive Articles (republicanism). However, Dominic correctly notes they must have immediate binding force. The resolution is that they are negative duties of right binding now, justified by the end of peace. Maya's claim that a volunteer professional force shares the "essential wrong" is partially correct: if "professional" implies a permanent separation from the citizenry (*miles perpetuus*), Kant rejects it. But Kant explicitly permits "periodic and voluntary military exercises." Maya must distinguish between a professional *caste* and citizen volunteers. Dominic is right that a democratic volunteer army might avoid the "insulation" problem, but if it remains a *standing* institution, it retains the structural danger Kant identifies. Dominic argues that without independent content, the Preliminary Articles become mere tautologies of the Definitive. However, Kant intends them as negative conditions that can be implemented immediately, even by non-republics. They are 'laws of prohibition.' Maya risks making them dependent on a future republic, which undermines their urgency. Yet, Dominic risks making them purely pragmatic, which undermines their authority. The correct reading is that they are juridical duties derived from the concept of Right, applicable now, but fully realizable only in a republic. This nuance validates Maya's normative focus while accepting Dominic's demand for immediate applicability.

  **What both are missing**
  Both miss the specific republican mechanism linking the empirical and normative: the identity of the citizen and the soldier. For Kant, a republic requires that those who consent to war bear its risks. A standing army severs this link, allowing executives to wage war without citizen consent (normative) and encouraging conflict due to low domestic cost (empirical). They also overlook Kant's distinction between *miles perpetuus* (permanent institution) and temporary defense. The issue isn't just payment or risk, but the permanent alienation of the monopoly on violence from the citizenry. This structural separation enables despotism, which is the true enemy of perpetual peace, bridging Maya's rights concern and Dominic's stability concern. Additionally, both underplay Kant's worry about the *executive* power. A standing army empowers the executive against the legislature, undermining the separation of powers essential to the Definitive Articles.

  **Overall verdict**
  Maya offers the more faithful interpretation of Kant's critical philosophy. While Dominic correctly identifies empirical premises in the text, he mistakes them for the argument's foundation. For Kant, empirical contingencies (like arms races) cannot ground a strict prohibition; only a priori right can. Maya correctly locates the argument in the violation of human dignity and the structural requirements of republicanism. However, she must concede that the empirical claims provide the prudential motivation for states to comply before achieving full republicanism. Ultimately, Kant's project is normative; the empirical observations illustrate the pathology of the status quo, but the moral law drives the conclusion. Maya captures the spirit of the Definitive Articles informing the Preliminary, whereas Dominic treats the essay as a policy paper.
