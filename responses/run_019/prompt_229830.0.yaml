  2.  **Deconstruct the Philosophical Background (Descartes):**
      *   *Beast-Machine Doctrine:* Animals are automata. They lack *res cogitans* (thinking substance).
      *   *Language Test:* Language is the only certain sign of thought. Parrots can mimic, but not arrange words to signify thoughts.
      *   *Pain/Suffering:* Animal cries are mechanical reactions (like a clock striking), not evidence of inner qualia or suffering.
      *   *Moral Implication:* If they don't think/feel, we have no direct duties to them (though cruelty might harden us toward humans).

  3.  **Deconstruct the Film (*Planet of the Apes*, 1968):**
      *   *Premise:* Humans are mute savages. Apes speak and rule.
      *   *Treatment of Humans:* Hunted, caged, experimented on (brain surgery), killed.
      *   *Protagonist:* Taylor (Charlton Heston). He *can* speak but is initially treated as mute. His speech is the turning point ("Take your stinking paws off me, you damned dirty ape!").
      *   *Themes:* Evolution, religion (Forbidden Zone), nuclear destruction, racism/caste system.
      *   *Key Scene:* The vivisection scene where Taylor's throat is examined; the hunt scenes where humans are shot like game.

  4.  **Brainstorming the Three Readings:**

      *   *Reading 1: Direct Refutation of the Language Criterion.*
          *   Idea: The film shows mute humans have rich inner lives (Taylor, Nova). Therefore, language is *not* necessary for thought/feeling. Descartes is wrong.
