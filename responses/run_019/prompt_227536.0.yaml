answer: |-
  You have put your finger on a pervasive and frustrating rhetorical pattern in philosophy of mind, AI ethics, and cognitive science. To answer your first question: **No, there is no single, canonical philosophical term for this specific reciprocal swapping of criteria.**

  It is generally subsumed under broader fallacies like **Special Pleading** (making an exception for your preferred case) or **Inconsistent Criteria**, but those are too blunt to capture the specific *structure* you've identified (the oscillation between *history* and *function*). Daniel Dennett comes close when he discusses **"Intuition Pumps,"** where thinkers tweak the parameters of a thought experiment until their intuition matches their theory, but even that doesn't name the specific *two-stick* mechanism you're seeing.

  Since the literature lacks a specific label, I will coin one for you, followed by the tight definition you requested, and then address the Searle bonus.

  ### The Coined Term: **The Origin-Function Oscillation**

  **Definition:**
  The Origin-Function Oscillation is a rhetorical maneuver occurring in debates about intentionality, consciousness, or meaning, characterized by three conditions:

  1.  **Dual Availability:** The debater implicitly accepts two distinct criteria for validating a mental state:
      *   **The Origin Criterion:** Meaning is valid only if it arises from a specific history (e.g., biological evolution, conscious design, non-derived causal powers).
      *   **The Function Criterion:** Meaning is valid only if it plays a specific causal/behavioral role (e.g., successful prediction, pain avoidance, goal optimization).
  2.  **Motivated Selection:** The debater applies the Origin Criterion to the system they wish to *invalidate* (e.g., "The AI was just programmed") and the Function Criterion to the system they wish to *validate* (e.g., "Humans feel pain regardless of origin").
  3.  **Suppression of the Shift:** When the opponent points out that the preferred system fails the currently used criterion (e.g., "Humans were also 'programmed' by evolution"), the debater switches to the other criterion *without acknowledging the change*, treating the new criterion as if it were the only one that ever mattered.

  **How it distinguishes from related concepts:**

  *   **Vs. Plain Inconsistency:** Inconsistency is often accidental or due to confusion. The Oscillation is *systematic* and *reciprocal*. It appears in paired debates where both sides utilize the same two sticks, swapping them in mirror image to protect the "Human Exceptionalism" or "AI Egalitarianism" conclusion.
  *   **Vs. Equivocation:** In equivocation, the *definition* of the word (e.g., "meaning") changes mid-argument. In the Oscillation, the definition of "meaning" remains stable (e.g., "genuine intentionality"), but the *truth conditions* (how we test for it) are swapped opportunistically.
  *   **Vs. Honest Updating:** In honest updating, a thinker says, "Your evolutionary point undermines my origin argument; I must now refine my theory to focus on function." In the Oscillation, the debater acts as though the Origin Criterion *never applied* to humans, or that the Function Criterion *never applied* to machines, preserving the illusion of a consistent standard.

  ---

  ### Bonus: The Searle vs. Critics Map

  You asked which measuring stick belongs to which side of the classic Searle vs. System Reply debate. This is where the history gets ironic, because the debaters you are observing are often **cross-wiring** Searle and his critics to suit their intuitions.

  **1. The Origin Stick belongs to John Searle.**
  Searle's entire argument in the *Chinese Room* is that syntax (function/structure) is not sufficient for semantics (meaning). He argues for **Biological Naturalism**. For Searle, genuine intentionality is a biological phenomenon caused by specific "causal powers" of the brain.
  *   **The Stick:** You cannot have real meaning without the right *origins* (biology/physics), regardless of how perfect the *function* (simulation) is.
  *   **The Debater's Use:** When the Skeptic says, "The chess engine doesn't *really* want to win because it was programmed," they are channeling Searle. They are arguing that derived intentionality (from the programmer) is not intrinsic intentionality.

  **2. The Function Stick belongs to Searle's Critics (Dennett, Churchland, etc.).**
  The standard replies to Searle (The System Reply, The Virtual Mind Reply, The Intentional Stance) are Functionalist. Daniel Dennett argues that if a system is complex enough that the best way to predict its behavior is to treat it *as if* it has beliefs and desires, then it *has* beliefs and desires.
  *   **The Stick:** Origins don't matter. If the *causal role* is right (it avoids pain, protects the king, tracks the sun), the meaning is real.
  *   **The Debater's Use:** When the Proponent says, "The robot tracks the sun just as well as the flower," they are channeling Dennett. They are arguing that functional equivalence entails semantic equivalence.

  **The Irony of the Oscillation:**
  The frustrating move you noticed is that **human exceptionalists** (who want humans to be special) often act like **Searle** regarding AI (demanding biological origins) but act like **Dennett** regarding Humans (demanding we ignore that our "origins" are just blind evolutionary algorithms).

  Conversely, **AI egalitarians** often act like **Dennett** regarding AI (function is enough) but sometimes act like **Searle** regarding Humans (to deflate human arrogance by pointing out our "derived" evolutionary programming)—though more often, they just insist evolution *does* grant intrinsic meaning, which is a third position (Teleosemantics).

  **Summary:**
  *   **Searle:** Holds the **Origin** Stick (Biology is necessary).
  *   **Critics:** Hold the **Function** Stick (Behavior is sufficient).
  *   **The Oscillation:** Debaters grab whichever stick Searle or Dennett left on the table, depending on which one bludgeons their opponent's favorite system.

  If you use **"The Origin-Function Oscillation"** in a paper or argument, you will be describing a phenomenon that everyone recognizes but no one has formally named. It fits the "tight definition" criteria because it isolates the specific *mechanism* of the swap, rather than just labeling the bias.
