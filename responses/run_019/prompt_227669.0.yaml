answer: |-
  You have described this with exceptional precision. The phrase **"the accident is load-bearing"** is, frankly, better than most of the jargon found in political science journals. You should absolutely keep that in your toolkit.

  To answer your question: Yes, this configuration has a canonical name in strategic studies, but it requires a specific theorist to unlock it. The concept you are looking for comes from Thomas Schelling, the Nobel Prize-winning economist whose book *Arms and Influence* (1966) essentially wrote the playbook for Cold War nuclear strategy.

  Schelling calls this **"The Threat That Leaves Something to Chance."**

  Here is the carving you asked for. I will break down how Schelling's concept fits your scenario, where it strains, and how to distinguish it from the three comparisons you listed.

  ### 1. The Canonical Term: "The Threat That Leaves Something to Chance"
  In common parlance, people think of a threat as: *"If you do X, I will do Y."* (e.g., "If you invade, I will nuke you.")
  Schelling pointed out that in nuclear standoffs, this promise is often not credible. No rational leader would choose suicide (mutual destruction) to punish an enemy.

  So, Schelling argued, the only credible threat is: *"If you do X, I will create a situation where Y might happen, even if I don't want it to."*

  You described this perfectly: *"The threat isn't 'I will choose to end the world,' it's 'at this tempo, something might slip... and then we're all dead.'"*

  Schelling used the analogy of a hostage tied to a car. The captor doesn't say, "I will drive off a cliff." He says, "I will drive very fast, and my hands are shaking. If you don't pay, I might lose control." The risk of the accident is the weapon.

  **Where it fits:** It captures the "load-bearing accident." It captures the idea that control is voluntarily degraded to create leverage.
  **Where it strains:** Schelling often discussed this as a *tactic* chosen by one side to coerce the other. Your scenario describes a *state* that both sides have stumbled into mutually. It is less a deliberate tactic and more a systemic condition.

  ### 2. The Engine: "The Security Dilemma"
  To capture the "both sides backed into it" aspect, you need to layer Schelling's threat on top of the **Security Dilemma**.

  In a Security Dilemma, one side's defensive move (moving a sub closer to protect trade routes) looks like an offensive move to the other side (they are positioning for a first strike). So the other side responds defensively (raising alert status), which looks offensive to the first side.

  *   **Brinkmanship** (Colloquial): One guy driving fast to scare the other.
  *   **Your Scenario:** Two drivers, both terrified, both driving faster because the other one accelerated, both knowing the brakes are fading, neither daring to be the first to lift their foot off the gas.

  If you need a term for this specific *mutual* configuration, scholars sometimes call this **"Reciprocal Risk Escalation"** within a Security Dilemma. But for a novelist, that is dry.

  ### 3. Distinguishing the Concepts (The Carving)
  You asked specifically how this differs from (a) brinkmanship, (b) accident, and (c) commitment devices. Here is the technical differentiation:

  **(a) vs. One-Sided Brinkmanship**
  *   **Brinkmanship:** Implies a *deliberate* approach to the edge. "I am steering us to the cliff." It assumes the actor has full control until the moment they choose to stop.
  *   **Your Scenario:** Implies a *degradation* of control. "I am steering us into fog." The danger isn't the destination; it's the loss of visibility. In your scenario, the leaders are not trying to reach the brink; they are trying to manage the *probability* of falling off it.
  *   **The Difference:** Brinkmanship is about *will*; your scenario is about *probability*.

  **(b) vs. Pure Accidental War**
  *   **Accidental War:** The risk is a "bug." It is a failure of the system. (e.g., A radar glitch causes a launch that no one wanted).
  *   **Your Scenario:** The risk is a "feature." It is instrumentalized. The radar glitch is not just possible; it is *necessary* for the threat to work. If the system were perfectly safe, the threat would vanish, and the enemy would advance.
  *   **The Difference:** In accidental war, the actors pray the system holds. In your scenario, the actors *need* the system to rattle, just not enough to break.

  **(c) vs. A Commitment Device**
  *   **Commitment Device:** I bind my *own hands* to prove I will act. (e.g., "I have tied my hands to the wheel so I cannot swerve.") This makes my *intent* certain.
  *   **Your Scenario:** I bind the *environment* to prove I might *not* act. (e.g., "I have cut the brake lines.") This makes my *control* uncertain.
  *   **The Difference:** A commitment device removes doubt about what I *will* do. Your scenario introduces doubt about what I *can* stop.

  ### 4. A Coinage for Your Book
  Since "The Threat That Leaves Something to Chance" is a mouthful for dialogue, and "Security Dilemma" is too dry, here are three options for naming this specific *mutual, drift-based* configuration. You can steal any of these.

  **Option A: "The Ratchet"**
  A ratchet allows motion in one direction but prevents it in the other. In your story, every "reasonable step" tightens the tension, but the mechanism prevents anyone from loosening it without appearing weak.
  *   *Usage:* "We aren't steering this thing, Captain. We're just inside the ratchet. It only turns one way."

  **Option B: "Shared Precariousness"**
  This highlights the mutual nature. It isn't one side threatening the other; it is a shared state of instability that both are maintaining.
  *   *Usage:* "Deterrence isn't about strength anymore. It's about maintaining a level of shared precariousness that keeps them honest."

  **Option C: "Instrumentalized Drift"**
  This captures the "backing into it" feel. The system is drifting, but that drift is being used as a tool.
  *   *Usage:* "This isn't brinkmanship. Brinkmanship implies a driver. This is instrumentalized drift. We are letting the current take us where we need to go."

  ### Recommendation
  If you want academic weight, use **Schelling's "Threat That Leaves Something to Chance."** It is the exact theoretical ancestor of your idea.

  If you want a term for the *state* the characters feel trapped in, I recommend **"The Ratchet."** It conveys the mechanical, inexorable, step-by-step nature of the escalation where reversing is mechanically impossible, even if everyone wants to.

  But please, keep **"the accident is load-bearing."** That is the thesis statement of your novel. It is a brilliant formulation of the horror you are describing.
