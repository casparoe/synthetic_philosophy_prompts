prompt: |-
  In my phil sci reading group someone keeps deflating any claim about current physics with the one-liner 'pessimistic meta-induction: nearly every past scientific theory turned out false, so ours probably are too.' The other week they used it to dismiss the pretty modest claim that the Standard Model is at least approximately right about what protons are. I'm a scientific realist and I'm sure the slogan is doing more work than it can carry, but I don't know how to make that precise. Lay out the distinct precise claims this one-liner could be making — different senses of 'turned out false' (utterly false? central terms failed to refer? not strictly true though approximately right?), different strengths for the induction itself, and different conclusions it's meant to support — and say for each whether it's defensible and whether it actually licenses that kind of wholesale dismissal. Also say how confident you are in your verdict and which point you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A philosophy of science reading group.
      *   **Problem:** A participant repeatedly uses "Pessimistic Meta-Induction" (PMI) as a one-liner to dismiss claims about current physics (specifically, that the Standard Model is approximately right about protons).
      *   **User's Stance:** Scientific Realist. Suspects the slogan is overworked/oversimplified but lacks the precise arguments to counter it.
      *   **Task:**
          1.  Lay out distinct precise claims the PMI one-liner could be making (ambiguities in "false," strength of induction, strength of conclusion).
          2.  Evaluate defensibility and licensing of wholesale dismissal for each.
          3.  Assign confidence levels to verdicts.
          4.  Identify the point of least certainty.

  2.  **Deconstruct the Pessimistic Meta-Induction (PMI):**
      *   *Core Argument:* Past successful theories were false $\rightarrow$ Current successful theories are likely false.
      *   *Key Ambiguities:*
          *   What does "false" mean? (Ontological elimination? Mathematical error? Approximation?)
          *   What is the reference class? (All theories? Only successful ones? Only central posits?)
          *   What is the conclusion? (Anti-realism? Suspension of judgment? Specific claim dismissal?)

  3.  **Drafting the Distinct Claims (Categorization):**
      *   I need to break this down logically. Let's look at the premises and the conclusion.
      *   *Dimension 1: The Meaning of "False" (The Target).*
          *   Strong: Nothing refers, ontology is completely wrong (e.g., phlogiston doesn't exist).
          *   Moderate: Central terms fail to refer, but math works (e.g., caloric fluid doesn't exist, but thermodynamics holds).
          *   Weak: Not strictly true, but approximately right (e.g., Newtonian gravity is false because of GR, but still useful/approximate).
      *   *Dimension 2: The Inductive Base (The Sample).*
          *   All past theories.
          *   Only *successful* past theories (Laudan's version).
          *   Only *central* posits of past theories (Psillos's counter).
      *   *Dimension 3: The Conclusion (The Scope).*
          *   Global Anti-Realism (No theory is true).
          *   Local Skepticism (Specific claims like "protons exist" are unjustified).
          *   Methodological Skepticism (We can't trust our methods).

      *Refining the Categories for the User:* It's better to present these as distinct *versions* of the argument the interlocutor might be invoking, rather than just abstract dimensions.
      *   *Version 1: The Strong Ontological Elimination PMI.* (Everything is wrong, terms don't refer).
      *   *Version 2: The Approximation/Strict Truth PMI.* (Theories aren't *strictly* true, so we can't claim they are true).
      *   *Version 3: The Selective/Structural PMI.* (Specific claims about unobservables are risky, even if structure is preserved).

  4.  **Evaluating Defensibility and Licensing:**
      *   *Version 1 (Strong Ontological):*
          *   *Defensibility:* Low. Counterexamples exist (e.g., electrons, genes, DNA). Reference often persists.
          *   *Licensing Dismissal:* No. Doesn't justify dismissing the Standard Model specifically.
      *   *Version 2 (Strict Truth/Approximation):*
          *   *Defensibility:* High (trivially). Almost no theory is strictly true forever.
          *   *Licensing Dismissal:* No. "Approximately right" is usually what realists claim. Dismissing "approximate rightness" based on "not strictly true" is a bait-and-switch.
      *   *Version 3 (Local/Specific Claim):*
          *   *Defensibility:* Moderate. Some specific posits do fail.
          *   *Licensing Dismissal:* No. Requires specific reasons why *protons* are like *phlogiston*, not just generic induction.

  5.  **Addressing the Specific Case (Standard Model/Protons):**
      *   The interlocutor used PMI to dismiss "Standard Model is approximately right about protons."
      *   This is a category error. PMI argues against *truth*, but the claim is about *approximate truth*.
      *   Also, protons are detectable/manipulable in ways phlogiston wasn't.

  6.  **Developing the Counter-Arguments (Realist Defenses):**
      *   *Selective Realism (Psillos):* Distinguish working posits from idle wheels.
      *   *Structural Realism (Worrall):* Math/structure persists even if ontology changes.
      *   *Entity Realism (Hacking):* "If you can spray them, they are real." Protons are manipulated.
      *   *Discontinuity Strategy:* Current physics is methodologically distinct from 19th-century chemistry.

  7.  **Assigning Confidence and Uncertainty:**
      *   I am highly confident that the "Strict Truth" version is a straw man against realists.
      *   I am highly confident that PMI does not license *wholesale* dismissal of specific well-confirmed claims.
      *   *Least Sure:* The precise historical statistics of theory change. (How many theories *actually* were completely wrong vs. approximately right?). This is an empirical historical claim that philosophers debate. I should flag this.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. PMI is often used as a conversation stopper rather than an argument.
      *   **Section 1: Three Distinct Versions of the PMI.** (Strong Ontological, Strict Truth, Local Skepticism).
      *   **Section 2: Evaluation of Each.** (Defensibility, Licensing of Dismissal).
      *   **Section 3: Specific Application to the Standard Model.** (Why protons $\neq$ phlogiston).
      *   **Section 4: Confidence & Uncertainty.** (As requested).
      *   **Conclusion:** Summary advice for the reading group.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between Laudan's list (successful but false) and the general intuition.
      *   *Nuance:* Ensure I don't just bash PMI. It *is* a serious challenge. The problem is the *one-liner* usage.
      *   *Tone:* Philosophical, precise, helpful for a reading group context.
      *   *Check:* Did I answer all parts of the prompt?
