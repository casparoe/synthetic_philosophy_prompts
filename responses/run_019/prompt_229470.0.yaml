answer: |-
  Your intuition that your friend's inferences are "too quick" is well-founded. While the summary you read accurately captures the *core definition* of the remedial-right-only view (most famously associated with the political philosopher Allen Buchanan), it flattens out the nuances that a careful defender of the view would insist upon.

  Your friend is using the theory as a blunt instrument to declare the moral case closed. A careful theorist would use it as a diagnostic tool to assess specific grievances.

  Here is a piece-by-piece evaluation of the summary's claims, distinguishing between what is accurate to the theory, what requires qualification, and where your friend's conclusions overreach.

  ### 1. The Core Definition
  > **Claim:** *A group has a right to secede only when it has suffered serious injustice, such as systematic human-rights violations, unjust annexation, or persistent discriminatory treatment by the state.*

  *   **Fairness:** **High.**
  *   **Analysis:** This is the accurate heart of the remedial-right-only theory. It stands in contrast to "primary right" theories (which argue that any distinct "people" has an inherent right to self-determination regardless of treatment). A defender of the remedial view agrees that secession is a **remedy of last resort**, analogous to revolution. It is not a normal political option but a corrective mechanism for a state that has failed its basic duties.
  *   **Verdict:** Your friend is on solid ground here regarding the definition.

  ### 2. The Status of Liberal Democracies
  > **Claim:** *Where no such grievance exists — as in a wealthy liberal democracy — there is no legitimate right to secede, and the state may permissibly keep itself intact.*

  *   **Fairness:** **Medium (Requires Qualification).**
  *   **Analysis:** A careful defender would accept that in a functioning liberal democracy, there is no *justice-based right* to secede unilaterally. The state does have a right to territorial integrity.
  *   **The Qualification:** However, "no right to secede" does not necessarily mean "secession is morally forbidden." It means the state is not *obligated* to let the region go. It leaves open the possibility of **negotiated secession**. A liberal democracy might permissibly *allow* secession for prudential or democratic reasons, even if it isn't strictly *required* to by justice.
  *   **Where your friend overreaches:** If your friend implies that the state is morally *obligated to suppress* independence movements in liberal democracies, that goes beyond the theory. The theory says the state *may* keep itself intact, not that it *must* crush dissent to do so.

  ### 3. The Application to Scotland and Catalonia
  > **Claim:** *The Scottish and Catalan movements are without moral foundation because neither people is oppressed.*

  *   **Fairness:** **Low (Significant Oversimplification).**
  *   **Analysis:** This is where the application becomes problematic. A careful remedial theorist looks for specific types of injustice, not just "oppression" in the sense of gulags or pogroms.
      *   **Catalonia:** The remedial view includes **"persistent violation of intrastate autonomy agreements"** as a just cause. Many legal scholars and political theorists argue that the 2010 ruling by the Spanish Constitutional Court, which struck down key parts of Catalonia's new Statute of Autonomy (which had been approved by the Catalan and Spanish parliaments and a referendum), constitutes a breach of the federal/autonomy pact. A careful defender of the remedial view would not dismiss this out of hand; they would investigate whether this breach is severe enough to trigger a remedial right.
      *   **Scotland:** The UK government granted the legal authority for the 2014 referendum. Under the remedial view, this actually *strengthens* the UK's legitimacy. However, if the UK were to persistently refuse to recognize the democratic will of Scotland (e.g., blocking all future votes despite clear majorities), a remedial theorist might argue that a *new* injustice (democratic exclusion) is being created.
  *   **Where your friend overreaches:** Dismissing the moral foundation entirely ignores the specific grievance of **broken autonomy agreements** (especially in Catalonia) and conflates "lack of a right" with "lack of any moral argument."

  ### 4. The Role of Ordinary Politics
  > **Claim:** *Their grievances are properly addressed through ordinary democratic politics.*

  *   **Fairness:** **Medium (Context Dependent).**
  *   **Analysis:** In theory, yes. If the state is a functioning democracy, grievances should be resolved within the system.
  *   **The Qualification:** This claim assumes "ordinary democratic politics" is actually accessible. If the state uses the legal system to criminalize the holding of a referendum (as happened in Catalonia) or refuses to negotiate constitutional changes despite electoral mandates, the "ordinary politics" channel is blocked.
  *   **Where your friend overreaches:** If the state closes the door on democratic negotiation, the remedial view acknowledges that this blockage can *become* the injustice. By insisting grievances must stay within a system that may be excluding them, your friend ignores the possibility that the *process* itself is generating the remedial claim.

  ### 5. The Moral Weight of a Vote
  > **Claim:** *A majority vote for independence... carries no independent moral weight, since consent of the governed is merely a procedural value rather than a source of rights.*

  *   **Fairness:** **High (Theoretically) / Low (Practically).**
  *   **Analysis:** Theoretically, the summary is correct. On the remedial view, a vote does not *create* a right to secede any more than a vote creates a right to steal a car. Consent is not the *source* of the right; justice is.
  *   **The Qualification:** However, a careful defender would admit that a clear majority vote carries immense **legitimacy weight**. While it doesn't create a *right* to unilateral secession, it creates a strong **moral obligation for the state to negotiate**. Ignoring a clear democratic majority in a liberal democracy undermines the state's own legitimacy. If a state consistently ignores such votes, it risks sliding into the very "injustice" that would trigger a remedial right.
  *   **Where your friend overreaches:** To say the vote carries *no* moral weight is too strong. It carries weight regarding the *legitimacy of the state's continued rule*, even if it doesn't grant a *right to secede*.

  ### Summary of the "Too Quick" Inferences

  Your friend is making a category error common in these debates: conflating **Rights** with **Permissions**, and **Justice** with **Legitimacy**.

  1.  **Right vs. Permission:** The remedial view says Scotland/Catalonia likely lack a *right* to secede unilaterally (a claim the state *must* honor). It does not necessarily say they lack *permission* to seek secession via negotiation. Your friend treats the lack of a right as a prohibition.
  2.  **Static vs. Dynamic Justice:** Your friend treats the justice of the state as a fixed status ("It is a liberal democracy, therefore it is just"). A careful defender views it dynamically ("It is a liberal democracy, *unless* it violates autonomy agreements or blocks democratic access").
  3.  **The Vote:** Your friend dismisses the vote as morally irrelevant. A careful defender would say the vote is not the *source* of the right, but it is a crucial *trigger for negotiation*.

  ### Conclusion

  The summary is **fair to the abstract theory** but **unfair to the practical application**.

  *   **Accept:** You should concede that, strictly speaking, neither Scotland nor Catalonia currently meets the high bar of "systematic human rights violations" that would grant them an unconditional *right* to secede under this specific theory.
  *   **Reject:** You should not concede that their movements are "without moral foundation." The violation of autonomy agreements (Catalonia) and the democratic weight of referendums (both) create moral obligations for the state to negotiate, even if they don't create a right to leave unilaterally.
  *   **Reject:** You should not concede that the vote carries *no* moral weight. While it doesn't create a right, ignoring it damages the state's legitimacy, which is the very thing the remedial view seeks to protect.

  Your friend is using a theory designed to prevent unjust fragmentation to argue against democratic negotiation. A careful defender of the remedial view would likely argue that the best way to preserve the state's integrity in Scotland and Catalonia is not to dismiss the movements, but to address the grievances (autonomy and democratic access) so that the remedial conditions never arise.
