answer: |-
  This is a splendid question, and you are quite right to be suspicious of the easy answers. Taxonomy of plot is notoriously slippery because we tend to confuse *setting* with *structure*, and *explanation* with *mechanism*. You have identified the exact friction point: the tension between the *cause* of the deception (Verdict 3) and the *outcome* of the deception (Verdict 4).

  Here is the principle that I believe reconciles your four verdicts, followed by the application to your test cases.

  ### The Principle: The Locus of Re-evaluation

  Two narrative tricks share the same mechanism if, and only if, **the revelation requires the reader to perform the same specific cognitive operation to reconcile the text with the truth.**

  It does not matter if the *window dressing* changes (space vs. country house), nor does it necessarily matter if the *in-universe causality* changes (magic vs. technology). What matters is the **Reader's Contract**: what rule did the reader think governed the narrative, and how must they alter their understanding of that rule to make the ending fit?

  If the mental adjustment is identical, the mechanism is the same. If the mental adjustment differs, the mechanism is different.

  Let us apply this to your four verdicts to see if it holds.

  **1. The Detective/Computer (Verdict: Same)**
  *   **The Contract:** The reader assumes the investigator is a neutral party seeking truth.
  *   **The Re-evaluation:** The reader must re-assign the role of 'Antagonist' to the 'Protagonist'.
  *   **The Operation:** Invert the moral alignment of the guide.
  *   **Why it fits:** Whether the guide is flesh or silicon is cosmetic. The cognitive operation—'The person asking the questions is hiding the answers'—is identical. Your instinct is correct.

  **2. The Will vs. The Twin (Verdict: Different)**
  *   **The Contract:** The reader assumes the physical evidence and testimony point to the killer.
  *   **The Re-evaluation:**
      *   *Case A (Will):* The reader must re-evaluate a *document* as a forgery. The operation is legal/financial.
      *   *Case B (Twin):* The reader must re-evaluate a *person* as an impostor. The operation is biological/identity-based.
  *   **The Operation:** In one, you discard a piece of paper; in the other, you duplicate a human being.
  *   **Why it fits:** The clues required to solve these are fundamentally different. One requires scrutiny of signatures; the other requires scrutiny of alibis and physical resemblance. The cognitive task is distinct.

  **3. Mad vs. Lying Narrator (Verdict: Different)**
  *   **The Contract:** The reader assumes the narrator conveys reality accurately.
  *   **The Re-evaluation:**
      *   *Case A (Mad):* The narrator *cannot* perceive truth. The text is a record of error.
      *   *Case B (Lying):* The narrator *will not* convey truth. The text is a record of omission.
  *   **The Operation:** In the first, you must treat the text as a symptom (decoding confusion). In the second, you must treat the text as a shield (decoding silence).
  *   **Why it fits:** This is the crux of your worry regarding Verdict 4. Here, the *cause* of the unreliability changes the texture of the reading experience. A madman's prose feels different from a liar's prose. The reader's task changes from 'interpreting distortion' to 'detecting deceit'.

  **4. Fate vs. Scheme Prophecy (Verdict: Same)**
  *   **The Contract:** The reader assumes a prophecy is a vague prediction of the future.
  *   **The Re-evaluation:** The prophecy was precise and inevitable.
  *   **The Operation:** Accept the fulfilment of the pattern.
  *   **Why it fits:** This is where your intuition seemed to clash with Verdict 3, but the Principle saves it. In the prophecy cases, the *cause* (gods vs. conspirators) is backstory. It explains *why* the event happened, but it does not change how the reader processes the *plot device*. The narrative function of the prophecy is to create dramatic irony. Whether the engine is magic or machinery, the reader's task is simply to witness the prediction match the event. The *textual contract* regarding the prophecy remains the same: 'This foretelling will come to pass.'

  ### Resolving the Tension (Verdict 3 vs. 4)

  You suspected the trouble lay between 3 and 4. Here is the distinction:

  In **Verdict 3**, the difference (Madness vs. Lying) alters the **Textual Surface**. You read the sentences differently depending on which it is. Therefore, the mechanism is different.

  In **Verdict 4**, the difference (Fate vs. Scheme) alters the **World-Building**, but not the **Textual Surface**. The plot points land in the same place, with the same rhythm. The 'trick' is the Prophecy Device itself, not the metaphysics powering it. Therefore, the mechanism is the same.

  The Principle holds: It is about the **Reader's Cognitive Task**, not the author's internal logic.

  ***

  ### Testing the Principle

  Here is how this principle applies to your two new cases.

  **Test Case 1: The Inverted Mystery vs. The Whodunnit**
  *   **The Setup:** In a standard whodunnit, the crime is hidden, and the detective reveals it. In an inverted mystery (the *howcatchem*), the criminal is known, and the detective reveals the *proof*.
  *   **The Cognitive Task:**
      *   *Whodunnit:* The reader gathers fragments to construct a whole (Synthesis). The pleasure is *Surprise*.
      *   *Inverted:* The reader watches a net close around a known target (Analysis). The pleasure is *Suspense* (to borrow Hitchcock's bomb theory).
  *   **Verdict:** **Different Mechanisms.**
  *   **Reasoning:** Although they share the same cast (criminal, detective, crime), the reader's contract is opposite. In one, you are a juror deciding guilt; in the other, you are a spectator watching an execution. The 'trick' in a whodunnit is concealment of identity; the 'trick' in an inverted mystery is the ingenuity of the trap. They are cousin structures, but not the same mechanism.

  **Test Case 2: Red Herring (Book A) vs. Genuine Solution (Book B)**
  *   **The Setup:** A specific clue (say, a missing button) is a decoy in one book and the key to the crime in another.
  *   **The Cognitive Task:**
      *   *Red Herring:* The reader must learn to *discard* the information as noise.
      *   *Solution:* The reader must learn to *retain* the information as signal.
  *   **Verdict:** **Different Mechanisms.**
  *   **Reasoning:** While the *object* is the same, the *function* is inverse. A mechanism is defined by what it *does*, not what it *is*. A brake and an accelerator might both be pedals in the same car, but they are not the same mechanism. In one book, the trick is misdirection (leading the reader away); in the other, the trick is deduction (leading the reader toward). To claim they are the same would be like saying a lock and a key are the same because they touch the same tumblers.

  ### Summary for Your Group

  If you need a punchline for Sheffield, tell them this:

  > "A trick isn't defined by the furniture in the room, nor even by the physics of the world. It's defined by the mental gymnastics you ask the reader to perform at the end. If the gymnastics are the same, the trick is the same. If you ask them to flip, don't tell me it's the same as a somersault just because they're both in the circus."

  Your instincts on all four verdicts were sound. The apparent contradiction between 3 and 4 dissolves once you stop looking at *why* the lie exists (the author's logic) and start looking at *how* the lie is processed (the reader's experience).

  Good luck with the novel. Keep the British spellings, and you'll be sorted.
