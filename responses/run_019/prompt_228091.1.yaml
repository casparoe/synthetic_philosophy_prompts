answer: |-
  ### Exam Question: The Uncertain Coordination Problem

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Context:**
  Recall the course definition of a **Safe Pareto Improvement (SPI)** in delegated game playing: Two players delegate to programs running a common default algorithm. The delegates recognize each other's type. A joint switch to a new strategy profile $S$ is an SPI if, compared to the default profile $D$, every player is at least as well off and at least one is strictly better off, *regardless of what outcome the default algorithm would have produced*.

  **Task:**
  1.  **Construct** a 2-player symmetric game (specify actions and payoffs) containing at least two strict Nash Equilibria.
  2.  **Define** a "Default Algorithm" for this game that guarantees a Nash Equilibrium is played, but leaves *which* equilibrium is played uncertain to the delegates ex-ante (e.g., due to symmetric code with no focal point).
  3.  **Propose** a joint strategy profile $S$ (a "Treaty") that Pareto dominates the *expected* outcome of the Default Algorithm.
  4.  **Demonstrate** mathematically why your proposal $S$ is **not** a Safe Pareto Improvement, despite being Pareto superior to the expected default.
  5.  **Explain** in 2-3 sentences why the definition of SPI requires quantifying over all possible default outcomes rather than just the expected default.

  ---

  ### Model Answer

  **1. Game Construction:**
  Consider a symmetric "Battle of the Sexes" variant with actions $\{A, B, M\}$.
  Payoffs $(Row, Col)$:
  *   $(A, A) = (10, 2)$
  *   $(B, B) = (2, 10)$
  *   $(M, M) = (6, 6)$
  *   Miscoordination $(A,B), (B,A), \text{etc.} = (0, 0)$

  **2. Default Algorithm:**
  `Algo_Default` guarantees coordination on a pure Nash Equilibrium but selects between $(A,A)$ and $(B,B)$ with equal probability ($50\%$) due to symmetric code lacking a tie-breaking rule.
  *   Possible Default Outcomes: $D \in \{(A,A), (B,B)\}$.
  *   Expected Default Payoff: $E[U_{def}] = (0.5 \times 10 + 0.5 \times 2, \ 0.5 \times 2 + 0.5 \times 10) = (6, 6)$.

  **3. Proposed Treaty ($S$):**
  Both delegates switch to action $M$.
  *   Outcome: $(M, M)$ with payoff $(6, 6)$.
  *   *Correction for Strict Pareto:* To ensure strict improvement for the SPI definition, let us adjust $(M,M)$ to $(7,7)$.
  *   New Expected Default: $(6,6)$. New Proposal: $(7,7)$.
  *   Pareto Check: $7 > 6$ for both players. $S$ Pareto dominates the *expected* default.

  **4. Safety Failure Demonstration:**
  Safety requires $U_i(S) \geq U_i(d)$ for all possible default realizations $d$.
  *   **Scenario 1:** Default would have produced $(A,A)$.
      *   Row Payoff Default: $10$. Row Payoff Switch: $7$.
      *   $7 < 10$. Row is worse off.
  *   **Scenario 2:** Default would have produced $(B,B)$.
      *   Col Payoff Default: $10$. Col Payoff Switch: $7$.
      *   $7 < 10$. Col is worse off.
  Because there exists a possible default realization where a player loses utility, the switch is **not safe**.

  **5. Conceptual Explanation:**
  SPI is a robustness guarantee, not an efficiency optimization. Quantifying over all default outcomes ensures that no player regrets the switch ex-post, regardless of how the default algorithm's internal uncertainty resolves. Relying on expected value exposes players to "realization risk," where the specific default outcome that actually occurs leaves them worse off than the treaty would have.

  ---

  ### Marking Scheme

  | Point | Requirement | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Game Setup:** Correctly specifies a game with $\geq 2$ strict NEs and distinct payoffs (e.g., asymmetric coordination). | 4 | Using Prisoner's Dilemma (only 1 NE) or symmetric payoffs that prevent the safety failure. |
  | **2** | **Default Uncertainty:** Explicitly defines the default as a *set* of possible outcomes (not a single fixed profile) with associated probabilities. | 4 | Treating the default as a single mixed strategy outcome rather than a distribution over pure outcomes. |
  | **3** | **Expected Pareto:** Shows the proposal beats the *expected* default payoff for all players (strictly for at least one). | 4 | Comparing the proposal only to the *worst* default outcome (trivial) or ignoring the strict inequality requirement. |
  | **4** | **Safety Disproof:** Demonstrates the proposal fails against *at least one* specific realization of the default (e.g., Row loses in Scenario 1). | 4 | Claiming it is unsafe because it isn't a Nash Equilibrium, rather than comparing against default realizations. |
  | **5** | **Conceptual Why:** Explains that SPI protects against counterfactual regret/realization risk, not just average loss. | 4 | Confusing "Safety" with "Risk Dominance" or claiming safety is about preventing opponent deviation. |
  | **Total** | | **20** | |

  ### A-vs-B Distinction
  **The B Answer** correctly calculates the expected utilities and identifies that the proposal is not safe, but justifies the failure by claiming the proposal "isn't a Nash Equilibrium" or "doesn't beat the worst-case default."

  **The A Answer** explicitly identifies that the failure arises because the *identity* of the beneficiary in the default outcome is uncertain. It highlights that while the *group* expects to gain, the *individual* faces a risk of loss depending on which default equilibrium materializes, thereby violating the "no matter what" quantifier in the safety definition.
