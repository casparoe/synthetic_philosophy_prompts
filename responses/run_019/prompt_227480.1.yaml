prompt: |-
  Something I keep noticing in arguments and I want to know if there's an actual name for it, because "circular reasoning" doesn't seem to quite cover it.

  My uncle is convinced that his favourite YouTube news channel is trustworthy. I asked how he knows, and he said: because he's checked its claims plenty of times and they always turned out to be true. So I asked how he checked, and it turns out he checks by watching later videos on the same channel, or seeing whether the channel's follow-up reporting confirms its earlier stories. Each individual check looks fine on the surface -- the channel said X, later the channel confirmed X, check passes. But the whole procedure somehow adds up to nothing, and I can't articulate exactly why.

  Same shape with my brother's car. He trusts his fuel gauge because, he says, every time it's said half a tank he's checked and the tank really was half full. Where "checked" meant... looking at the gauge again, maybe at a different angle. He was half joking, but half not.

  And honestly I do the same thing with my own memory. If you ask me why I think my memory is reliable, all I can really do is recall a bunch of occasions where my memory served me well. But those are themselves memories. There doesn't seem to be anywhere else to stand.

  What gets me is that none of this looks like the textbook fallacy where you just assume the thing you're trying to prove. Nobody's slipped the conclusion in as a premise. Every single step, taken alone, seems legitimate -- it's the loop as a whole that's rotten. Is there an established concept for this specific pattern, where a method or source gets vouched for entirely by its own outputs? And if so, how is it supposed to differ from ordinary circular reasoning, assuming it does? Also curious whether the memory case is even the same problem as the fuel gauge case, since with the gauge you could at least in principle check some other way (stick a dipstick in the tank or whatever), whereas with memory there seems to be no outside vantage point at all. If there isn't a clean name for exactly this, feel free to coin one, but I'd want the definition to say something about why these cases feel broken even though no individual step is.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Core Phenomenon:** The user observes a pattern where a source/method is validated *only* by its own outputs, creating a closed loop that feels illegitimate even if individual steps seem okay.
      *   **Examples:**
          1.  Uncle trusting a news channel because later videos from the *same* channel confirm earlier ones.
          2.  Brother trusting a fuel gauge because looking at the *same* gauge (from a different angle) confirms the reading.
          3.  User trusting their memory because *memories* confirm past memory reliability.
      *   **Distinction from Circular Reasoning:** The user feels "circular reasoning" (begging the question) isn't quite right because the conclusion isn't explicitly stated as a premise. It's more about *epistemic justification* than logical deduction.
      *   **Questions:**
          1.  Is there an established name for this?
          2.  How does it differ from ordinary circular reasoning?
          3.  Is the memory case the same as the gauge case (given the lack of an "outside" check for memory)?
          4.  If no name exists, coin one (with a definition explaining *why* it feels broken).

  2.  **Initial Brainstorming & Concept Matching:**
      *   *Circular Reasoning (Begging the Question):* Close, but usually refers to deductive arguments ($A \to B, B \to A$). The user is right; this is more about *verification* than deduction.
      *   *Confirmation Bias:* Related, but that's about selecting evidence. Here the evidence itself is tainted.
      *   *Echo Chamber:* Good for the news channel, but doesn't fit the fuel gauge or memory.
      *   *Self-Sealing Argument:* Close. A hypothesis that cannot be falsified because any counter-evidence is reinterpreted.
      *   *Epistemic Circularity:* This is the strongest philosophical candidate. It deals specifically with justifying sources of knowledge using those same sources.
      *   *Bootstrapping:* In philosophy (specifically epistemology), this refers to gaining justification for a source's reliability using the source itself. (Cohen's "Bootstrapping Problem").
      *   *Self-Reference / Recursion:* Too mathematical/computational.
      *   *Tautology:* Logical truth, but doesn't capture the *process* of verification.

  3.  **Deep Dive into "Epistemic Circularity" and "Bootstrapping":**
      *   **Epistemic Circularity:** This is exactly what the memory case describes. Alvin Plantinga and others discuss this. You can't prove reason is reliable using reason without circularity.
      *   **The Bootstrapping Problem:** Formulated by Stewart Cohen (2002). It describes a scenario where a subject comes to know a source is reliable solely by using that source.
          *   *Example:* Looking at a gas gauge to know the tank level, then concluding the gauge is accurate because it matches the tank level (which you only know via the gauge).
          *   *Fit:* This matches the brother's fuel gauge example *perfectly*.
          *   *Fit:* It also matches the news channel example (using the channel to verify the channel).
      *   **Why it feels broken:** It violates the "No Self-Support" principle. Justification needs an independent anchor. If the only evidence for $X$'s reliability comes from $X$, you haven't actually increased your confidence in $X$ relative to the prior probability.

  4.  **Addressing the Specific Nuances:**
      *   *Difference from standard circular reasoning:* Standard circularity is logical ($P \therefore P$). This is *methodological* or *procedural*. It's about *warrant* or *justification*, not truth preservation in a syllogism.
      *   *Memory vs. Gauge:* The user asks if they are the same.
          *   *Gauge:* There *is* an external check (dipstick). The failure is choosing not to use it. This is "Bad Bootstrapping."
          *   *Memory:* There *isn't* an external check (we can't step outside our minds). This is "Inevitable Epistemic Circularity." Philosophers (like Reid or Plantinga) argue this might be acceptable (properly basic beliefs) whereas the gauge case is not.
      *   *Why it feels rotten:* Information theory. No new information is generated. It's like trying to lift yourself up by your shoelaces. The entropy of uncertainty doesn't decrease.

  5.  **Drafting the Response:**

      *   **Acknowledge the insight:** Validate that the user has spotted a genuine and sophisticated philosophical problem.
      *   **Primary Term:** **Epistemic Bootstrapping** (or just **Bootstrapping**). This is the technical term in contemporary epistemology (Stewart Cohen).
      *   **Secondary Term:** **Epistemic Circularity**. Broader category.
      *   **Explain the distinction:**
          *   Logical Circularity: Premises assume conclusion.
          *   Epistemic Bootstrapping: Using a source to validate the source.
      *   **Analyze the Examples:**
          *   *Uncle/News:* Bootstrapping + Echo Chamber dynamics.
          *   *Brother/Gauge:* Classic Cohen Bootstrapping. Easy to refute (use a dipstick).
          *   *Memory:* The "Hard Problem" of Epistemic Circularity. Discuss "Cartesian Anxiety" or "Agrippa's Trilemma." Mention that some philosophers accept this as unavoidable (Reidian Common Sense).
      *   **Why it feels broken (The "Rot"):**
          *   Lack of independent correlation.
          *   No error correction.
          *   Information theory perspective (zero mutual information gain).
      *   **Coining a term (if needed):** The existing terms are good, but I can offer a descriptive phrase like **"Self-Vouching Loop"** or **"Closed-Loop Verification"** to make it intuitive. But "Bootstrapping" is the real answer.
      *   **Refining the Memory Distinction:** Crucial point. The gauge case is *fallacious bootstrapping* (because an external check exists). The memory case is *transcendental circularity* (because no external check is possible). One is a mistake; the other might be a feature of being a human.

  6.  **Review against Constraints:**
      *   Did I answer if there's a name? Yes (Bootstrapping/Epistemic Circularity).
      *   Did I distinguish from circular reasoning? Yes (Logical vs. Epistemic).
