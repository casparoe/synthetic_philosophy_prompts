          3.  Test against Thucydides' own criterion (human nature vs. structure).
          4.  Evaluate whether the analogy survives its own source's test.
          5.  Evaluate whether the alarmist conclusion stands given disanalogies.
          6.  Suggest if another historical comparison is better or if the genre should be retired.

  2.  **Drafting - Section by Section (mental outline):**

      *   *Introduction/Mapping:* Start by defining the mapping. US = Sparta (established, fearful), China = Athens (rising, dynamic). Fear = US anxiety over loss of hegemony. Immediate quarrels = Trade wars, Taiwan, South China Sea incidents.
      *   *Disanalogies:* Discuss nuclear weapons (makes war costlier), trade (interdependence vs. distinct economies), system structure (multipolarity vs. bipolar Greek world), Allison's data (selection bias). Distinguish which matter most.
      *   *Thucydides' Criterion:* Thucydides claimed utility based on *human nature* remaining constant, not structural inevitability. The Trap argues structural inevitability. This is a contradiction.
      *   *Conclusion/Verdict:* Does it survive? Probably not based on Thucydides' own logic. Does the alarmist conclusion stand? Weakened by disanalogies. Alternative? Maybe Cold War (peaceful competition) or just retire the analogy genre for this context.

  3.  **Drafting - Writing in Continuous Prose (iterative refinement):**

      *   *Mapping:* In the standard mapping of the Thucydides Trap applied to contemporary geopolitics, the United States occupies the role of Sparta, the established hegemon plagued by anxiety over its declining relative power, while China assumes the role of Athens, the dynamic rising power whose growth disrupts the status quo. The Spartans' fear, which Thucydides identified as the truest cause of the war, corresponds to the American strategic establishment's dread of losing primacy in the Indo-Pacific and the broader liberal international order. The immediate quarrels over Corcyra and Potidaea, which served as the precipitating incidents rather than the underlying cause, map onto specific flashpoints such as trade disputes, freedom of navigation operations in the South China Sea, or crises over Taiwan, which could ignite conflict even if the deeper structural tension exists independently of them.

      *   *Disanalogies:* However, the utility of this mapping collapses when one separates superficial resemblances from structural disanalogies that fundamentally alter the calculus of war. The existence of nuclear deterrence matters profoundly because it raises the cost of great-power war to existential levels, creating a threshold of violence that neither Athens nor Sparta faced. Economic interdependence also matters significantly, as the deep integration of the US and Chinese economies creates mutual vulnerabilities that the largely autarkic Greek poleis did not share, making decoupling painful and war economically suicidal. The structure of the international system presents another critical divergence, since the Greek world was a tight bipolar system where alignment was nearly total, whereas today's many-power system includes significant actors like India, the European Union, and Russia who can buffer or complicate direct confrontation. Conversely, Graham Allison's selection problem regarding his case list of the last five centuries matters less for the specific Thucydidean analogy than for the statistical claim itself, as cherry-picking historical cases to fit a pattern undermines the scientific validity but does not necessarily invalidate the specific mechanistic logic of the Athens-Sparta comparison, though it does weaken the empirical backing.

      *   *Thucydides' Criterion:* The most damaging critique, however, comes from testing the analogy against Thucydides' own methodological criterion. Thucydides licensed inference from the past to the future only insofar as human nature remains constant, suggesting that patterns of fear, honor, and interest will recur because people do not change. The Trap framing assumes exactly the reverse, positing that structural positions alone dictate outcomes regardless of human agency or specific contextual factors. By treating the structural rivalry as an automatic engine of war, the Trap violates Thucydides' own condition for historical utility, which relies on the constancy of psychological drives rather than the inevitability of structural collision. Consequently, the analogy does not survive its own source's test because it transforms a diagnostic observation about human motivation into a deterministic law of international mechanics.

      *   *Conclusion/Verdict:* Once these disanalogies are placed on the table, the alarmist conclusion that war is the historical default loses its coercive force, as the mechanisms that drove Athens and Sparta to total war are mitigated by nuclear stakes and economic entanglement. While the risk of conflict is real, the deterministic framing obscures the role of statecraft in managing rivalry without violence. A better historical comparison might be the Cold War between the United States and the Soviet Union, which demonstrates that bipolar rivalry can be sustained for decades without direct great-power war through deterrence and proxy competition, though even that analogy struggles with the depth of economic integration present today. Ultimately, the whole genre of great-power analogy should perhaps be retired in this context, not because history is irrelevant, but because the specific invocation of Thucydides invites a fatalism that the original text warns against, encouraging policymakers to expect war rather than work to prevent it through the very agency Thucydides valued.

