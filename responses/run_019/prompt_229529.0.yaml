answer: |-
  **JOINT STATEMENT ON LONGTERMISM, FANATICISM, AND THE SIMULATION HYPOTHESIS**

  **Date:** 24 May 2024
  **Parties:** Dr. E. Vance (Longtermist Perspective) & Dr. J. Corwin (Simulation Skeptic Perspective)
  **Subject:** Adversarial Collaboration regarding the impact of the Simulation Hypothesis on Expected Value Calculations in Longtermist Ethics

  ### 1. Agreed Claims

  The undersigned acknowledge the following propositions as common ground. These claims establish the framework within which our disagreement persists.

  1.  **Decision-Theoretic Framework:** We agree that, for the purposes of this analysis, moral decision-making should be modelled via Expected Value (EV) maximisation under empirical and moral uncertainty. We accept the standard formulation: $EV = \sum (P_i \times V_i)$, where $P$ is the probability of a scenario and $V$ is the value realised within it.
  2.  **The Structure of Fanaticism:** We agree that the 'fanaticism' objection to longtermism arises logically from the conjunction of (a) unbounded value functions (the possibility of astronomically large populations or durations) and (b) standard EV maximisation. If one accepts that there is a non-zero probability of affecting an astronomical number of future lives, and that the value per life is positive, then far-future considerations will mathematically dominate near-term considerations, regardless of how small the probability becomes.
  3.  **Status of the Simulation Hypothesis (SimHyp):** We agree that the Simulation Hypothesis (the proposition that our reality is a computational simulation run by a post-human or alien civilisation) is not falsified. We assign it a non-negligible credence. We further agree that if SimHyp is true, the physical laws and resource constraints we observe may be local parameters set by the simulators rather than fundamental constants of base reality.
  4.  **Symmetry of Moral Status:** We agree that the moral status of conscious beings does not depend on whether they are 'biological' or 'simulated'. Suffering or flourishing within a simulation counts morally. Therefore, dismissing longtermist efforts solely on the grounds that 'none of it is real' is a category error we both reject.
  5.  **Epistemic Humility:** We agree that our current estimates of the tractability of existential risk reduction and the potential size of the future are subject to profound empirical uncertainty. We agree that introducing SimHyp increases this uncertainty.
  6.  **The Core Dispute:** We agree that the central question is not whether SimHyp is true, but how credence in SimHyp should update our estimates of *causal leverage* and *scale* in the EV calculation. Specifically, does SimHyp function as a deflator of expected value, a neutral variable, or a potential multiplier?

  ### 2. Points of Divergence

  The following table outlines the specific cruxes where our positions remain incompatible. Each row is phrased to accurately reflect the holder's view without conceding the counter-argument.

  | Crux | Dr. Vance (Longtermist) Position | Dr. Corwin (Simulation Skeptic) Position |
  | :--- | :--- | :--- |
  | **1. Net Impact on EV** | Credence in SimHyp is roughly symmetrical regarding longtermist value. A simulation capable of housing us could also house an astronomical future, or simulators might reward alignment efforts. Thus, SimHyp does not significantly reduce the expected value of longtermist interventions. | Credence in SimHyp acts as a significant deflator of longtermist EV. Simulations are likely compute-constrained, temporally limited, or scripted. Therefore, the 'astronomical waste' argument relies on base-reality assumptions that SimHyp renders improbable. |
  | **2. Epistemic Priors** | In the absence of definitive evidence, we should weight scenarios by the volume of value they contain (Self-Indication Assumption). Base reality allows for the largest volume; therefore, even if SimHyp is possible, the 'base reality' hypothesis dominates the EV calculation due to the stakes involved. | In the absence of definitive evidence, we should treat ourselves as typical observer moments (Self-Sampling Assumption). If ancestor simulations are numerous, a typical observer is likely simulated. Assigning high probability to 'base reality with vast resources' is an unjustified cosmological speculation. |
  | **3. Causal Leverage** | Our actions (e.g., AI safety research) retain instrumental value regardless of ontology. If we are simulated, our actions may influence the simulator's decisions or the parameters of future simulations. The 'levers' remain functional. | Our actions may be epiphenomenal or constrained by the simulation's purpose. If the simulation is designed to test specific variables, our attempts to shape the far future may be outside the scope of the experiment, rendering our causal leverage near-zero. |
  | **4. Motivational Symmetry** | Rejecting longtermist conclusions via SimHyp appears to be motivated reasoning: deploying scepticism only when the moral demands become 'fanatical', while accepting reality for near-term decisions. | Ignoring SimHyp in longtermist calculus appears to be motivated reasoning: retaining confidence in vast stakes only because the moral mission requires it, while acknowledging SimHyp in other epistemic contexts. |

  ### 3. Paths to Resolution

  For each crux identified above, we specify the type of evidence or argument that would bear on the issue, along with our respective predictions regarding the outcome.

  **Crux 1: Net Impact on EV (Deflator vs. Symmetrical)**
  *   **Bearing:** A formal model comparing the compute cost of simulating a civilisation versus the compute cost of simulating that civilisation's expansion into an astronomical future.
  *   **Vance's Prediction:** Computational substrate independence means simulations can be nested or expanded. The cost of simulating a future light-cone is not necessarily prohibitive for a post-human civilisation. SimHyp does not imply a 'hard cap' on value.
  *   **Corwin's Prediction:** Compute is a physical resource in base reality. Simulators will optimise for efficiency. Simulating an entire astronomical future yields diminishing returns for the simulator compared to simulating only the 'interesting' early epoch. SimHyp implies a hard cap on value.

  **Crux 2: Epistemic Priors (SIA vs. SSA)**
  *   **Bearing:** Resolution of the reference class problem in anthropic reasoning. Specifically, determining whether 'observers like us' should be weighted by the number of such observers (SIA) or treated as a random sample from the set of all observers (SSA).
  *   **Vance's Prediction:** SIA is the correct framework for decision-making under existential uncertainty. It favours hypotheses with more observers, which correlates with hypotheses allowing for larger futures (base reality).
  *   **Corwin's Prediction:** SSA is more robust against 'presumptuous philosopher' objections. It suggests we are likely in a short-lived simulation rather than a long-lived base reality, reducing the probability of the 'vast future' scenario.

  **Crux 3: Causal Leverage (Functional vs. Constrained)**
  *   **Bearing:** Game-theoretic analysis of simulator motives. If simulators run ancestor simulations for research, do they intervene when subjects attempt to alter long-term trajectories?
  *   **Vance's Prediction:** Simulators interested in ethical outcomes would reward or permit value-aligned behaviour. Even if simulated, our efforts signal values that may be preserved or replicated by the simulators.
  *   **Corwin's Prediction:** Simulators interested in historical fidelity or specific variable isolation would likely reset or constrain the simulation if subjects attempt to breach the intended scope (e.g., via AGI). Leverage is an illusion of the script.

  **Crux 4: Motivational Symmetry (Epistemic Hygiene)**
  *   **Bearing:** A consistency audit of both parties' credences in non-moral contexts (e.g., physics, economics). Do we apply SimHyp scepticism uniformly?
  *   **Vance's Prediction:** Corwin will be found to apply SimHyp scepticism selectively to moral stakes while relying on base-reality physics for daily life, indicating bias against fanaticism.
  *   **Corwin's Prediction:** Vance will be found to apply SimHyp scepticism selectively to moral stakes (ignoring it) while relying on base-reality physics for longtermist planning, indicating bias in favour of fanaticism.

  ### 4. Closing Note: Verbal vs. Substantive Disputes

  In concluding this collaboration, we assess the nature of our disagreement.

  **Substantive Elements:**
  The majority of our dispute is substantive. It rests on empirical claims about the nature of computation, the likely motives of post-human civilisations, and the correct application of anthropic probability theory. Specifically, the question of whether a simulation *can* contain an astronomical future is a factual claim about computational physics, not a semantic one. Similarly, the choice between Self-Indication and Self-Sampling assumptions has measurable consequences for probability assignments.

  **Verbal Elements:**
  There is a minor verbal component regarding the definition of 'real' value. At times, Dr. Corwin's language suggests that simulated value is 'less than' base value, which Dr. Vance rightly identifies as a category error (see Agreed Claim 4). However, Dr. Corwin clarifies that his concern is not the *quality* of the value but the *duration and stability* of the substrate. Once this distinction is made explicit, the objection shifts from 'simulated people don't count' to 'simulated people have a higher risk of termination'.

  **Conclusion:**
  We conclude that the Simulation Hypothesis does not dissolve the longtermist project, but it does introduce a significant 'model uncertainty' tax on expected value calculations. Whether this tax is sufficient to negate the 'fanatical' dominance of the far future depends entirely on the resolution of the anthropic and computational cruxes listed in Section 3. Until such time as those cruxes are resolved, we agree to disagree on the magnitude of the discount rate, while maintaining cooperation on interventions that are robust across both base-reality and simulation scenarios (e.g., reducing immediate existential risks that would terminate the simulation regardless of its type).

  ***

  **Signed:**

  _________________________
  **Dr. E. Vance**

  _________________________
  **Dr. J. Corwin**
