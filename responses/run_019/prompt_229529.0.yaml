prompt: |-
  Two colleagues of mine have been arguing for months and I want you to draft the document their dispute should have produced. One is a committed longtermist of a broadly utilitarian bent: she holds that the astronomical number of possible future persons means that actions affecting the far future — extinction-risk reduction, shaping the values of advanced AI, and so on — dominate the moral calculus, and she accepts the "fanatical" conclusion that even tiny probabilities of affecting vast stakes ought to swamp near-term considerations. The other thinks that taking the simulation hypothesis seriously undermines exactly this fanaticism. His argument, roughly, is this: if there is a substantial probability that we are simulated, then our estimates of the number of reachable future minds, of the physical resources available to be turned into value, and of the causal levers available to us are all hostage to the simulators' purposes and compute budget; the expected-value calculation that licenses fanaticism therefore rests on treating one cosmological scenario (base reality, bountiful and manipulable) as near-certain when our own reasoning gives us reason to doubt it. She replies that the simulation hypothesis cuts both ways — a simulation large enough to contain us might contain an astronomical future too, simulators might reward or be indifferent to our longtermist efforts, and in any case "maybe none of it is real" is not an argument one can selectively deploy against far-future stakes while continuing to care about the simulated people in front of one.

  Draft the joint statement of an adversarial collaboration between them. Specifically, I want:

  1. A numbered section of agreed claims: what both accept about the simulation argument itself (what it establishes and what it does not), about expected-value reasoning under moral and empirical uncertainty, about the structure of the fanaticism worry, and about which considerations are common ground rather than contested.
  2. A disagreements table giving the precise points of divergence, each row phrased so that each side would accept the wording of its own position. I suspect genuine cruxes include: whether simulation uncertainty is symmetrical (does it shrink expected far-future value, or merely redistribute it?), whether the longtermist's probability assignments over cosmological scenarios are doing illegitimate work, and whether discounting for "being simulated" is principled or is motivated reasoning against an unwelcome conclusion. But do not take my guesses as definitive — identify the cruxes yourself.
  3. For each crux, what each party would accept as bearing on it — an argument, a thought experiment, or a formal result about decision-making under this kind of uncertainty — together with each side's prediction about how it would resolve.
  4. A closing note on which parts of their dispute, if any, you conclude are verbal rather than substantive, and why.

  Keep the statement neutral: neither side should come off as the winner, and formulations should be ones both could sign. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement document resulting from an adversarial collaboration between two colleagues.
      *   **Characters:**
          *   *Colleague A (Longtermist/Utilitarian):* Believes far-future stakes dominate moral calculus due to astronomical numbers of potential lives. Accepts "fanaticism" (tiny probabilities $\times$ huge stakes $>$ near-term certainties).
          *   *Colleague B (Simulation Skeptic):* Believes the Simulation Hypothesis (SimHyp) undermines longtermist fanaticism. If we are simulated, our causal leverage and resource estimates are constrained by simulators. Treating base reality as near-certain is unjustified.
      *   **Key Conflict:** Does SimHyp reduce expected value (EV) of longtermist interventions (B's view), or is it symmetrical/irrelevant because simulations could also be vast or simulators might reward longtermist behavior (A's view)? Also, is invoking SimHyp just motivated reasoning to avoid fanaticism?
      *   **Required Sections:**
          1.  Numbered section of agreed claims (SimHyp, EV reasoning, fanaticism structure, common ground).
          2.  Disagreements table (precise points of divergence, neutral wording).
          3.  Resolution paths (what would bear on each crux, each side's prediction).
          4.  Closing note on verbal vs. substantive disputes.
      *   **Tone:** Neutral, British English, signable by both.

  2.  **Deconstruct the Arguments:**
      *   *Longtermist (A):*
          *   Core: $EV = P(\text{success}) \times \text{Impact}$. Impact is astronomical in base reality.
          *   SimHyp response: Simulations can be large. Simulators might care about our values. Even if simulated, our actions have value within the sim. Rejecting SimHyp implications looks like "motivated stopping" to avoid fanaticism.
          *   Epistemology: We must act on our best estimates. If base reality is possible, the stakes are huge.
      *   *Simulation Skeptic (B):*
          *   Core: SimHyp introduces massive empirical uncertainty. If $P(\text{sim})$ is high, our model of the future (physics, resources) is wrong.
          *   Argument: Simulations usually have compute limits. Ancestor sims might be short. Our "levers" (AI safety, etc.) might be scripted or irrelevant.
          *   Epistemology: Assigning high probability to "base reality with vast future" is unjustified given SimHyp. It's a specific cosmological claim needing evidence.
      *   *Common Ground:* Both care about expected value. Both take SimHyp seriously enough to discuss. Both accept the logic of fanaticism *if* the inputs hold. Both want to do good.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and collaborative. "Joint Statement on Longtermism, Fanaticism, and the Simulation Hypothesis."
      *   **Introduction:** Briefly state the purpose (clarify dispute, identify cruxes).

      *   **Section 1: Agreed Claims:**
          *   Need to capture the logic of fanaticism without endorsing it as *true* yet.
          *   Need to capture the status of SimHyp (plausible, not certain).
          *   Need to agree on decision theory basics (maximise EV under uncertainty).
          *   *Drafting thought:* Ensure A doesn't feel B is dismissing longtermism entirely, and B doesn't feel A is ignoring epistemic humility.
          *   *Key agreement:* Fanaticism follows from standard EV maximisation *given* certain premises. SimHyp affects empirical premises.

      *   **Section 2: Disagreements Table:**
          *   *Crux 1: The Net Effect of SimHyp on EV.* A says symmetrical/neutral. B says negative/reductive.
          *   *Crux 2: Epistemic Justification for Base Reality.* A says we should default to base reality unless proven otherwise (or weight by volume). B says SimHyp makes base reality a specific, low-prior hypothesis.
          *   *Crux 3: Motivated Reasoning.* A says B uses SimHyp to escape uncomfortable moral demands. B says A ignores SimHyp to preserve moral mission.
          *   *Wording:* Must be "Side A holds X, Side B holds Y" without judging X or Y.

      *   **Section 3: Resolution Paths:**
          *   What would change their minds?
          *   *For Crux 1 (Symmetry):* Formal models of simulation compute budgets vs. base reality physics. A predicts sims can be vast. B predicts sims are resource-constrained.
          *   *For Crux 2 (Priors):* Anthropocentric reasoning (SSA/SIA). A predicts SIA favours large worlds (base). B predicts SSA favours typical observer moments (sims).
          *   *For Crux 3 (Motivation):* Consistency checks. Would B be a longtermist if SimHyp were false? Would A reduce confidence if SimHyp probability rose?

      *   **Section 4: Verbal vs. Substantive:**
          *   Is this just about definitions of "real"? No, it's about causal leverage.
          *   Is it about risk aversion? Maybe.
          *   *Conclusion:* Mostly substantive regarding empirical claims about simulations, but some verbal confusion on "value" (intrinsic vs. instrumental).

      *   **Language:** British English (e.g., "maximise", "programme", "centre", "defence").

  4.  **Refining and Polishing:**
      *   *Check Tone:* Is it too aggressive? Soften the "motivated reasoning" bits to make them signable. Instead of "B is motivated," say "Disagreement on whether the invocation of SimHyp is driven by..."
      *   *Check Logic:* Does A's position on SimHyp make sense? Yes, "SimHyp cuts both ways." Does B's? Yes, "SimHyp undermines empirical basis."
      *   *Formatting:* Use clear headings, tables, and numbered lists.
      *   *Self-Correction during drafting:* I initially thought about making the disagreements more personal. I need to pull back and make them about the *arguments*, not the *people*. Ensure the "Agreed Claims" section doesn't accidentally resolve the dispute.

  5.  **Final Review against Constraints:**
      *   British English? Yes.
      *   Numbered agreed claims? Yes.
      *   Disagreements table? Yes.
      *   Resolution paths/predictions? Yes.
      *   Closing note on verbal/substantive? Yes.
      *   Neutral tone? Yes.

  6.  **Final Polish:** (Mental check of specific phrases). "Fanaticism" is a loaded term; ensure it's used technically (Beckstead-Thomas style). Ensure "Simulation Hypothesis" is treated as a probability distribution, not a binary.

  *(Self-Correction on "Motivated Reasoning"):* It is hard to get two people to sign a document saying "My opponent is motivated by bias." Better to frame it as a disagreement about *epistemic hygiene*. "Whether the differential weighting of SimHyp constitutes a violation of epistemic norms."

  *(Self-Correction on "Value"):* Ensure the distinction between "value within a sim" and "value of the sim itself" is clear.

