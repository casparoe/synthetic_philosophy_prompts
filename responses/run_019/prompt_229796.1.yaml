answer: |-
  This is a rich pairing. Kant's "indirect duty" view is often dismissed too quickly as a loophole for cruelty, when in fact it is a rigorous attempt to ground moral obligation in rational autonomy. *Black Beauty*, conversely, is often read as a precursor to modern animal rights, but it is deeply embedded in a Victorian moral economy that cares intensely about human character.

  Here is a critical reading designed for your seminar, structured to highlight the convergences, divergences, and pedagogical opportunities of this pairing.

  ### 1. The Core Tension: Formalism vs. Phenomenology

  To be faithful to Kant, you must present his view not as a denial of animal suffering, but as a denial of animal *moral legislation*. For Kant, animals are not "persons" because they are not rational agents capable of setting ends for themselves. Therefore, we cannot wrong *them*; we can only wrong *ourselves* by degrading our own humanity through cruelty.

  To be faithful to Sewell, you must acknowledge that while *Black Beauty* is a plea for animal welfare, it is also a manual for human virtue. Sewell is not a modern utilitarian (Singer) or a rights theorist (Regan); she is a moralist.

  **The Thesis for Students:** *Black Beauty* does not simply refute Kant; it dramatizes the psychological mechanism Kant relies upon. However, by giving the horse a narrative voice, Sewell exposes a blind spot in Kant's formalism: the moral significance of *subjectivity* independent of *rationality*.

  ### 2. Where the Novel Supports the Indirect-Duty Reading

  There are significant moments where Sewell's moralizing aligns perfectly with Kant's worry that cruelty to animals corrodes human character. In these scenes, the horse's suffering is instrumentalized to teach a lesson about the human soul.

  *   **The Scene:** **The Two Boys (Chapter 23).**
      *   *Summary:* Beauty is owned by a kind master, but the stable boys, Samson and Robin, are tasked with his care. Samson is cruel; Robin is kind. The master fires Samson, noting that a boy who is cruel to a beast cannot be trusted with a man's work.
      *   *Kantian Reading:* This is pure indirect duty. The horse is the testing ground for the boy's moral disposition. Samson is not fired because he violated Beauty's rights, but because he demonstrated a vice (cruelty) that renders him unfit for human society.
      *   *Pedagogical Point:* Ask students: If Beauty had not suffered, but Samson had *intended* to hurt him, would the master still fire him? Kant would say yes (the maxim is what matters). Sewell implies yes, because the character is already formed.

  *   **The Scene:** **The Drunken Cabby (Chapter 39).**
      *   *Summary:* A cab driver drives his horse until the horse drops, exhausted. The police intervene.
      *   *Kantian Reading:* The outrage here is twofold: the physical damage to property (the horse) and the moral degradation of the driver. The bystanders are angry not just because the horse hurt, but because the man acted like a brute.
      *   *Pedagogical Point:* This supports Kant's claim that cruelty "deadens the sympathies." The cabby has lost the ability to recognize suffering, a capacity Kant argues is necessary for fulfilling duties to humans.

  ### 3. Where the Novel Resists the Indirect-Duty Reading

  The resistance comes not from the plot's moralizing, but from the *narrative form*. Kant's ethics is third-person and objective (What is the rational law?). *Black Beauty* is first-person and subjective (What does this feel like?).

  *   **The Scene:** **Ginger's Breaking (Chapter 7).**
      *   *Summary:* Ginger, a high-spirited mare, is "broken" by a trainer who uses confinement and force to crush her spirit. Beauty narrates her despair, her confusion, and her eventual submission.
      *   *The Resistance:* Kant can account for Ginger's pain as a biological fact. He cannot account for Ginger's *grief*. By giving Ginger (through Beauty's observation) an interior life of hope, betrayal, and resignation, Sewell forces the reader to acknowledge a *subject* where Kant sees only a *thing*.
      *   *Does it Beg the Question?* A Kantian might argue Sewell is simply projecting human rationality onto a beast (anthropomorphism). She gives Beauty language, memory, and moral judgment.
      *   *Counter-Argument:* It does not beg the question if we view the novel not as a metaphysical proof that horses are rational, but as an *imaginative expansion* of moral consideration. It suggests that *sentience + narrative identity* generates a moral claim, even without *autonomy*. It dramatizes what Kant's framework lacks the resources to register: the moral weight of a life story that is not a moral life.

  *   **The Scene:** **The Bearing Rein (Chapter 9).**
      *   *Summary:* Beauty and Ginger are forced to wear bearing reins that hold their heads unnaturally high. It causes physical pain and prevents them from defending themselves from flies.
      *   *The Resistance:* This is the strongest argument against the indirect duty view. The suffering here is pointless. It does not make the humans crueler (they are already fashionable); it does not make them kinder. It is pure, gratuitous suffering for the sake of aesthetics.
      *   *Kantian Strain:* Kant struggles to explain why gratuitous cruelty is wrong if no human character is being degraded (e.g., if no one sees it). Sewell argues it is wrong because it violates the *nature* of the horse. This points toward a teleological duty (respecting the animal's purpose) that sits uncomfortably with Kant's focus on human rationality.

  ### 4. What the Novel Adds to the Philosophical Debate

  Kant provides the *architecture* of duty; Sewell provides the *fuel*.

  1.  **The Gap Between Principle and Motivation:** Kant tells us we *ought* to cultivate sympathy. He does not tell us how it feels to have that sympathy activated. *Black Beauty* functions as a technology for cultivating the very sympathy Kant demands. It bridges the gap between abstract obligation and lived empathy.
  2.  **The Moral Status of Dependency:** Kant's ethics is built on autonomy (self-rule). *Black Beauty* is built on dependency. The horse is entirely at the mercy of the human. The novel argues that power creates responsibility, regardless of the subordinate's rationality. This anticipates care ethics (Held, Noddings) which Kantianism often marginalizes.
  3.  **The Voice of the Patient:** Philosophical arguments about animals are almost always conducted *about* animals. *Black Beauty* conducts the argument *from* the animal. It challenges the student to ask: Does moral status require the ability to argue for oneself? If so, does that exclude human infants or the cognitively impaired? (The "Argument from Marginal Cases," though Sewell doesn't make it explicitly, is dramatized here).

  ### 5. Where the Reading Strains (Limitations)

  To be intellectually honest, you must highlight where this pairing frustrates both texts.

  *   **Strain on Kant:** This reading risks caricaturing Kant as unfeeling. Kant explicitly says, "He who is cruel to animals becomes hard also in his dealings with men." He takes the indirect duty very seriously. Students might think Kant permits abuse; he does not. He forbids it strictly, just on different grounds.
  *   **Strain on Sewell:** *Black Beauty* is not a radical liberation text. Beauty accepts his status as property. He seeks a *kind* master, not freedom. A modern critic might argue Sewell reinforces the very hierarchy that allows the abuse. She argues for benevolent domination, whereas Kant's framework (if extended) might suggest that if animals are merely means, benevolent domination is the best we can do, while a rights framework would reject domination entirely.
  *   **The Anthropomorphism Problem:** By making Beauty speak like a Victorian gentleman, Sewell arguably concedes Kant's point: that we only value the animal insofar as it resembles a rational human. If Beauty couldn't narrate his suffering in moral terms, would the reader care as much? This strains the claim that the book argues for the horse's *own* standing.

  ### 6. Suggested Assignment Structure

  **Primary Texts:**
  1.  Kant, *Lectures on Ethics* (Selections on duties to animals).
  2.  Sewell, *Black Beauty*, Chapters 7 (Ginger), 9 (Bearing Rein), and 23 (The Boys).

  **Discussion Questions:**
  1.  Kant argues that we have no direct duties to animals because they are not "ends in themselves." Does Beauty's narration prove he *is* an end in himself, or does it just make him a more sympathetic means?
  2.  Identify a scene where the punishment for cruelty is focused on the human's character (Kantian) vs. a scene where the focus is on the horse's pain (Sewellian). Can these two motivations be separated?
  3.  If Beauty were unable to speak (as in real life), would the moral force of the novel collapse? What does this imply about the limits of literature vs. philosophy in granting moral status?

  ### 7. Conclusion for the Seminar

  The pairing works because *Black Beauty* acts as the **phenomenological supplement** to Kant's **formalism**.

  Kant provides the *rule*: "Do not be cruel, for it harms your humanity."
  Sewell provides the *experience*: "Here is what cruelty feels like from the other side."

  The novel does not logically refute Kant's claim that animals lack rational autonomy. Instead, it challenges the *relevance* of that claim. It suggests that the capacity to suffer and the capacity to have a "life story" (even a non-rational one) creates a moral demand that the indirect-duty view is too narrow to contain. However, by relying on human sympathy to effect change, Sewell ultimately remains within the Kantian orbit: the horse's salvation depends on the human's moral improvement. The seminar should leave students questioning whether "indirect duty" is a loophole, or if it is the only practical way humans can access moral obligations to the non-human world.
