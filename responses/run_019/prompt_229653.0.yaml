answer: |-
  # Desiderata for a Theory of Hard Choices

  The following list specifies the necessary conditions for any theory claiming to explain hard choices. A "hard choice" is defined here as a decision between options that cannot be ranked on a single scale of value, where choosing well is nevertheless possible and non-arbitrary.

  ### 1. The Axiological Specification Requirement
  *   **Precise Statement:** The theory must explicitly identify the normative relation holding between options in a hard choice. It must affirm, deny, or redefine the Trichotomy Thesis (that for any two options, one is better, worse, or exactly equal).
  *   **Forcing Case:** **The Small-Improvements Phenomenon.** Consider two career options, A and B, that are hard to choose between. If A and B were exactly equal, a slight improvement to A (A+) would make A+ strictly better than B. However, in hard choices, A+ is often not better than B; the choice remains hard. This demonstrates that A and B are not equal, nor is one better than the other.
  *   **Status:** **Non-negotiable.** Without specifying this relation, the theory cannot distinguish a hard choice from a tie (equality) or a standard maximization problem. This requirement forces the theory to either posit a fourth relation (e.g., parity) or argue that the small-improvements intuition is mistaken.

  ### 2. The Conceptual Distinction Requirement
  *   **Precise Statement:** The theory must distinguish between **incomparability** (no normative relation holds), **incommensurability** (a relation holds but no common cardinal unit of measurement exists), and **parity** (a positive comparative relation holds where options are comparable but neither better, worse, nor equal). It may argue one collapses into another, but it must justify the collapse.
  *   **Forcing Case:** **The Metric vs. Relation Problem.** A theorist might claim options are hard to choose because there is no "common currency" of value (incommensurability). However, one can compare options ordinally without a cardinal unit. If the theory conflates the lack of a unit with the lack of a relation, it cannot explain how rational choice is possible (since incomparability usually implies choice is arbitrary).
  *   **Status:** **Non-negotiable.** Conflating these terms leads to category errors regarding the possibility of rational justification. A theory must explain whether the hardness stems from a failure of measurement or a failure of ranking.

  ### 3. The Non-Arbitrariness Requirement
  *   **Precise Statement:** The theory must provide a normative account of how an agent selects one option over the other without violating rationality, despite the absence of a uniquely best option.
  *   **Forcing Case:** **The Possibility of Choosing Well.** If options are incomparable, standard rational choice theory suggests any selection is permissible but not reason-based (arbitrary). However, agents in hard choices feel bound by reasons and can choose poorly (e.g., by flippancy). The theory must explain what makes one selection rational and another irrational if "maximization" is off the table.
  *   **Status:** **Non-negotiable.** This is internal to the definition of the research problem. If a theory concludes that hard choices are necessarily arbitrary, it denies the phenomenon to be explained.

  ### 4. The Rational Regret Requirement
  *   **Precise Statement:** The theory must account for the rationality of experiencing regret after making a well-justified hard choice, without implying the original choice was erroneous.
  *   **Forcing Case:** **The Loss of the Unchosen.** In a hard choice between two distinct goods (e.g., security vs. adventure), choosing security does not negate the value of adventure. An agent can rationally mourn the lost adventure without believing they made a mistake. Standard maximization models struggle with this, as choosing the "best" option ostensibly eliminates grounds for regret.
  *   **Status:** **Non-negotiable.** This captures the phenomenology of agency in hard choices. A theory that renders regret irrational fails to describe the actual normative landscape of the agent.

  ### 5. The Epistemic/Axiological Separation Requirement
  *   **Precise Statement:** The theory must distinguish hard choices from decisions under uncertainty or ignorance. It must demonstrate that the hardness arises from the structure of value, not from a lack of information about outcomes or probabilities.
  *   **Forcing Case:** **Hard Choice vs. Optimization Under Uncertainty.** In uncertainty, more information could resolve the decision (e.g., knowing the odds of success). In a hard choice, full information about the options does not resolve the difficulty because the values themselves do not rank.
  *   **Status:** **Non-negotiable.** Reducing hard choices to epistemic deficits dissolves the philosophical problem into a technical calculation problem. The theory must rule out the claim that "if we knew enough, the choice would be easy."

  ### 6. The Value Constitution Requirement
  *   **Precise Statement:** The theory must take a definitive stance on whether reasons for choice are antecedently fixed or whether the act of choosing can constitute or revise the values at stake.
  *   **Forcing Case:** **Commitment and Will.** In some hard choices (e.g., moral commitments or relationships), the agent's commitment seems to add weight to the chosen option that was not present prior to the choice. A theory must explain whether the will creates reasons or merely tracks them.
  *   **Status:** **Parochial Commitment.** This divides theories into "Realist" (values are fixed) and "Existentialist/Voluntarist" (values are partly constituted by choice). While taking a stance is non-negotiable, *which* stance is taken determines the metaphysical camp.

  ### 7. The Aggregation Requirement
  *   **Precise Statement:** The theory must be scalable to social choice and policy, explaining how hard choices between incommensurable goods are resolved when allocating fixed resources (e.g., budgeting between health and art).
  *   **Forcing Case:** **Policy Trade-offs.** If individual hard choices involve parity or incomparability, public policy faces the same structure. A theory that works for individuals but requires a single metric for policy (or vice versa) lacks unity. It must explain if/why the logic of hard choices changes at the collective level.
  *   **Status:** **Non-negotiable.** A theory of value that cannot guide action in contexts of scarcity and plural goods is practically inert.

  ***

  # Analysis of Constraints and Exclusions

  ### Potentially Incompatible Subsets
  There is a tension between **Requirement 1 (Axiological Specification)** and **Requirement 6 (Value Constitution)** depending on how they are satisfied.
  *   **The Conflict:** If a theory satisfies Requirement 1 by positing a fixed, mind-independent fourth relation (like objective Parity), it struggles to satisfy Requirement 6 if Requirement 6 is interpreted as requiring the *will* to resolve the indeterminacy. If the relation is already fixed (as Parity), the will merely recognizes it; it does not constitute the value. Conversely, if the will constitutes the value (Existentialist view), it is unclear what antecedent relation (Requirement 1) exists to be specified prior to the choice.
  *   **The Tension:** A theory cannot simultaneously hold that the normative relation is fully determinate *before* the choice (required for a robust Parity view) and that the choice *creates* the determinacy (required for a strong Constitution view). One must give way: either the relation is there waiting to be found, or the choice makes it so.

  ### The Single Most Exclusionary Requirement
  **Requirement 1 (The Axiological Specification Requirement), specifically as forced by the Small-Improvements Phenomenon.**

  *   **Why it excludes Incomparability Views:** Incomparability views typically hold that no normative relation holds. The Small-Improvements argument shows that if no relation held, a slight improvement to one option *must* make it better. Since it doesn't, simple incomparability is ruled out.
  *   **Why it excludes Reductionist Views (Ignorance/Incomplete Preferences):** Views that reduce hard choices to epistemic ignorance or merely incomplete preference orderings cannot explain why the improvement doesn't break the tie. If the preference were merely incomplete due to lack of info, more info (or a clear improvement) should complete it. The persistence of hardness despite improvement forces the theory to accept a substantive axiological claim (Parity or similar) rather than an epistemic or structural deferral.
  *   **Why it excludes Standard Trichotomy Views:** It directly contradicts the standard economic and philosophical assumption that A > B, B > A, or A = B exhaust the possibilities.

  This requirement is the "gatekeeper." Any theory that cannot accommodate the Small-Improvements intuition without collapsing into one of the three standard trichotomous relations fails to address the specific phenomenon of the hard choice as defined in this proposal.
