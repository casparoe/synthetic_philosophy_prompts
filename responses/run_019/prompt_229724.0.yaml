answer: |-
  The Franck Report's Summary offers a striking window into the moral architecture of the Manhattan Project's scientific leadership. The provided passage argues for a demonstration of the atomic bomb in an uninhabited area, not primarily to spare Japanese lives, but to foster "favorable conditions" for international control and delay a nuclear arms race. This diagnostic starting point reveals a tension that ripples through any Just War Theory (JWT) analysis of Hiroshima and Nagasaki: the gap between prudential statecraft and deontological constraint.

  Diagnosing the passage, one finds a conspicuous absence. The committee's case against an unannounced attack relies entirely on forward-looking consequences: the stability of the post-war order and the strategic interests of the United States. Nowhere does the text invoke the immunity of Japanese civilians as an independent moral constraint. This omission suggests the scientists were reasoning as pure consequentialists, weighing the long-term utility of the weapon against the immediate tactical advantage of surprise. However, their position can be reconstructed as a *jus in bello* argument in disguise. By urging a demonstration, they implicitly argue that the *method* of introduction matters. If the bomb is treated as a mere extension of conventional terror bombing, the norm against targeting civilians is eroded. A demonstration preserves the distinction between combatant and non-combatant, upholding the JWT principle of discrimination for future conflicts. In this translation, the "interests of this country" align with the preservation of moral norms that protect all civilians, including Americans, in the future. What is gained in this reconstruction is a bridge between realpolitik and ethics; what is lost is the immediate urgency of the Japanese lives at stake in August 1945. The Franck Committee prioritizes the *future* of warfare over the *present* victims of it, a calculus standard JWT struggles to accommodate without a robust account of long-term proportionality.

  Running the actual decision through standard JWT criteria exposes further friction, particularly regarding discrimination, proportionality, and last resort. Discrimination is the most straightforward failure; Hiroshima and Nagasaki were cities, not purely military installations, making the direct targeting of non-combatants inherent to the act. Proportionality is more debated, hinging on the counterfactual: did the bombs save more lives than an invasion would have cost? However, the criterion of last resort offers the most profound theoretical challenge when viewed through the Franck lens.

  JWT traditionally treats last resort as a binary threshold: have all peaceful options been exhausted? Yet, the menu available in 1945 was not "bomb or don't." It included the Franck demonstration, continued blockade, conventional bombing, modifying the unconditional surrender demand to preserve the Emperor, and waiting for Soviet entry. These were not binary switches but "differently-priced waiting strategies." Each option carried a probability of success and a cost in time and lives. A theory developed for binary choices struggles to rank probabilistic waiting strategies. If waiting three weeks for Soviet entry has a 60% chance of surrender and a 40% chance of invasion, is it a "resort"? JWT lacks the granularity to handle risk assessment as a moral category. "Last resort" implies certainty—that nothing else *can* work. But in statecraft, nothing is certain. If every alternative is a probability, "last resort" becomes a subjective judgment call about risk tolerance rather than an objective moral boundary. The Truman administration effectively decided that the risk of waiting outweighed the moral cost of immediate atomic use, but JWT provides no formula for weighing the probability of diplomatic success against the certainty of civilian incineration.

  Nagasaki serves as a critical stress test for these theoretical limitations. Whatever moral cover Hiroshima might have claimed under the urgency of "ending the war," the second bomb fell only three days later. This timeframe is shorter than the realistic absorption time for Japan's leadership to comprehend the first attack, consult the Emperor, and negotiate surrender. Here, JWT faces a structural ambiguity: does it treat each bombing as a fresh case, or as part of a single campaign? If treated as a fresh case, Nagasaki fails the last resort test immediately, as the efficacy of the first bomb was unverified. The "necessity" had not yet been established. If treated as part of a single campaign, JWT silently assumes that once the threshold for atomic use is crossed, the specific application becomes morally secondary to the strategic goal. This silence is dangerous. It allows the momentum of the first act to justify the second without a renewed assessment of proportionality or necessity. JWT lacks a specific mechanism to condemn "redundant coercion"—the application of force after the coercive message has been sent but before it has been received. By failing to distinguish between the *sending* of a signal and the *receipt* of it, the theory risks validating excessive violence under the guise of operational continuity.

  Finally, we must let the case bite back at the theory. If the strongest moral argument available to insiders was the Franck Report's prudential one, and if JWT struggles to rank the available waiting strategies, does this indicate that JWT is the wrong tool for weapons of mass coercion? Or does the doctrine of supreme emergency resolve the tension?

  Supreme emergency, as defined by Michael Walzer, is a specific exception within JWT. It posits that when a community faces an imminent threat of enslavement or destruction so grave that it threatens the very survival of its values, the usual constraints of *jus in bello* (specifically non-combatant immunity) may be overridden. It is a "utilitarianism of extremity." However, applying this to August 1945 is problematic. By the time of the Potsdam Conference, Germany had surrendered. Japan was blockaded, its navy destroyed, and its cities burning from conventional raids. While the war was costly, the United States did not face an imminent threat of destruction or enslavement. The "emergency" was not supreme in the Walzerian sense; it was a matter of expediency and casualty reduction, not existential survival.

  Therefore, invoking supreme emergency here stretches the doctrine beyond its breaking point, turning it into a blanket justification for any high-stakes coercion. This suggests that the Franck Report's prudentialism actually highlights a gap in JWT that supreme emergency cannot fill. JWT is designed to limit violence within a conflict, not to manage the geopolitical consequences of introducing a new category of violence. The Franck scientists understood that the atomic bomb was not just a bigger bomb, but a political transformation. JWT, focused on the immediate justice of the act, lacks the vocabulary for the *political* justice of the precedent.

  Consequently, the case suggests that JWT is insufficient as a standalone tool for decisions regarding weapons of mass coercion. It is not that the theory is "wrong," but that it is incomplete. It requires the integration of the prudential statecraft found in the Franck Report. A purely deontological JWT might forbid the bomb due to civilian immunity; a purely consequentialist one might demand it to save lives. The Franck Report offers a third path: political responsibility for the future order. If JWT cannot incorporate this long-term political prudence into its calculation of "proportionality" or "last resort," it risks becoming irrelevant to the most dangerous decisions humanity faces. The silence of the theory on "waiting strategies" and the redundancy of Nagasaki indicates that JWT must evolve to account for the temporal and political dimensions of coercion, not just the immediate kinetic effects. Without this, it remains a theory for conventional wars, ill-equipped to judge the dawn of the nuclear age.
