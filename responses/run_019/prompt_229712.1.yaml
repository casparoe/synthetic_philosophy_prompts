answer: |-
  To settle your dispute regarding the interpretation of *On Certainty* (OC), you require a metric that tests any proposed theory of hinges against the phenomena Wittgenstein describes. The disagreement between a **substantive epistemic reading** (hinges provide a unique form of warrant/entitlement) and a **therapeutic/grammatical reading** (hinges expose the nonsense of seeking justification for the framework itself) often turns on which desiderata are prioritized.

  Below is a structured list of desiderata for an adequate theory of hinges. It distinguishes between **Non-Negotiable Requirements** (demanded by the text and the logical space of skepticism) and **Interpretive Preferences** (characteristic of specific schools of reading). Finally, it identifies **Aporias**, where desiderata appear jointly unsatisfiable, forcing a choice between competing interpretations.

  ---

  ### I. Non-Negotiable Desiderata
  *Any viable theory of hinges must satisfy these conditions to remain faithful to the problems Wittgenstein addresses.*

  #### 1. The Category Distinction Requirement
  **Desideratum:** The theory must define hinges as a category distinct from both **ordinary empirical beliefs** (which are true/false and justified by evidence) and **mere behavioral dispositions** (which are blind habits lacking normativity).
  *   **Motivating Case:** *Moorean Certainty.* When Moore says "I know I have two hands," he treats it as an empirical claim. Wittgenstein argues this is a misuse of "know." However, calling it a mere reflex fails to capture why we would criticize someone who genuinely doubted it (e.g., as insane or mistaken), implying a normative status.
  *   **Constraint:** Hinges must have a normative "hold" on us without being items of knowledge.

  #### 2. The Enabling Condition Requirement
  **Desideratum:** The theory must explain how hinges function as the **scaffolding** that makes doubt, inquiry, and justification possible, without themselves entering the flow of justification.
  *   **Motivating Case:** *Radical Skepticism.* The skeptic asks for a reason to believe the external world exists. If every reason requires a further reason, inquiry never starts. Hinges must stop the regress not by being "super-justified," but by being the mechanism that allows the game of giving reasons to begin.
  *   **Constraint:** Hinges cannot be justified *within* the system they support.

  #### 3. The Dynamics of Change Requirement (Drift & Inheritance)
  **Desideratum:** The theory must model how hinge commitments change over time without being revised proposition-by-proposition (like scientific hypotheses) and how new agents acquire them.
  *   **Motivating Case A:** *Hinge Drift.* In the 17th century, "The sun revolves around the earth" functioned as a hinge (scaffolding). Today, it is a contestable empirical claim. Conversely, "There are physical objects" was once a philosophical thesis; now it is scaffolding. The theory must explain this fluidity.
  *   **Motivating Case B:** *Hinge Inheritance.* A child does not learn "The world exists" via evidence; they acquire it through training and trust in authority. The theory must explain how standing is transferred without explicit justification.
  *   **Constraint:** Change must be systemic (riverbed shifting), not atomistic.

  #### 4. The Immunity Requirement
  **Desideratum:** The theory must explain why hinges are **exempt from doubt** in normal contexts without rendering them dogmatic or immune to *all* change.
  *   **Motivating Case:** *Inductive Practice.* We do not test whether fire burns before every use. To doubt this constantly is not "rigorous skepticism" but a failure to master the concept of fire.
  *   **Constraint:** Exemption from doubt must be functional, not logical necessity (since hinges can change, see Req. 3).

  ---

  ### II. Interpretive Preferences
  *These are not requirements for adequacy, but rather theoretical leanings. Your dispute likely stems from prioritizing different preferences.*

  | Preference Type | Core Commitment | Typical Trade-off |
  | :--- | :--- | :--- |
  | **Epistemic (Substantive)** | Hinges provide a sui generis form of **warrant** (e.g., entitlement). | Risks turning hinges back into "super-beliefs," violating the Category Distinction. |
  | **Therapeutic (Grammatical)** | Hinges expose the **limits of sense**; skepticism is nonsense, not a problem to solve. | Risks making Wittgenstein a quietist who cannot explain why skepticism feels compelling. |
  | **Naturalistic** | Hinges are grounded in **human biological/psychological nature**. | Risks reducing normativity to causality (violating the normative aspect of Req. 1). |
  | **Relativist (Framework)** | Hinges constitute **local worldviews** that vary across cultures. | Risks making cross-framework criticism impossible (violating the Normativity Requirement below). |

  ---

  ### III. The Aporias: Jointly Unsatisfiable Desiderata
  *This is the crux of your dispute. No single theory can satisfy all the following pairs simultaneously. A theory must choose which horn of the dilemma to accept and which to modify.*

  #### Aporia 1: The Normativity vs. Arationality Tension
  *   **Desideratum A (Normative Criticism):** We must be able to rationally criticize a hinge system (e.g., a conspiracy theorist or a fascist ideology) as incorrect, not just "different."
  *   **Desideratum B (Arational Foundation):** Hinges are the ground of rationality; therefore, they cannot be judged by the rational standards they constitute. To judge a hinge is to use a hinge.
  *   **The Conflict:** If you satisfy A (Epistemic preference), you imply there is a "super-hinge" or neutral standpoint to judge from, which violates B. If you satisfy B (Therapeutic/Relativist preference), you struggle to condemn irrational hinge systems without begging the question.
  *   **Implication for Dispute:** The **Substantive** reader usually tries to solve this by positing "default entitlements." The **Therapeutic** reader solves this by arguing that criticism happens via *persuasion* and *conversion*, not rational refutation.

  #### Aporia 2: The Universality vs. Historicity Tension
  *   **Desideratum A (Universality):** Some hinges (e.g., "I have a body," "The world didn't pop into existence 5 minutes ago") seem necessary for *any* language game.
  *   **Desideratum B (Historicity):** Wittgenstein emphasizes that hinges change (Riverbed metaphor). What is certain for us was not certain for our ancestors.
  *   **The Conflict:** If hinges are universal (Naturalistic preference), Hinge Drift (Req. 3) becomes hard to explain. If hinges are purely historical (Relativist preference), it becomes hard to explain why radical skepticism (which relies on universal doubts) seems unintelligible rather than just "using a different framework."
  *   **Implication for Dispute:** The **Naturalist** prioritizes A to block skepticism. The **Relativist** prioritizes B to explain conceptual change.

  #### Aporia 3: The Exemption vs. Arbitrariness Tension
  *   **Desideratum A (Non-Arbitrariness):** Our hinges are not arbitrary choices; we *cannot* help but hold them. They are forced upon us by reality/practice.
  *   **Desideratum B (Exemption from Justification):** Hinges lack evidence. If they lack evidence and are not chosen, they appear arbitrary (like a groundless faith).
  *   **The Conflict:** How can something be non-arbitrary yet groundless? If it is forced by reality, isn't that a form of justification (evidence from the world)? If it is groundless, isn't it arbitrary?
  *   **Implication for Dispute:** The **Epistemic** reader tries to bridge this with "entitlement" (it's rational to trust without evidence). The **Therapeutic** reader dissolves it by saying "arbitrary" and "justified" are category mistakes when applied to hinges.

  ---

  ### IV. Recommendation for Settling the Dispute

  To resolve your argument, do not ask "Which interpretation is true?" Instead, ask **"Which Aporia is your interpretation willing to break?"**

  1.  **Test the Substantive View:** Ask your friend if their epistemic theory can satisfy **Aporia 1 (Normativity)** without violating **Requirement 1 (Category Distinction)**. If they claim hinges are a *type* of warrant, do they not turn them back into beliefs that need justification?
  2.  **Test the Therapeutic View:** Ask your friend if their grammatical theory can satisfy **Requirement 5 (Cross-System Criticism)** without violating **Aporia 1 (Arationality)**. If hinges are just rules of grammar, how can we say a rival framework is *wrong* rather than just *different*?

  **The Verdict Criterion:**
  An adequate theory is not one that solves every problem, but one that **explicitly acknowledges which desideratum it sacrifices.**
  *   If the theory claims to solve skepticism *and* preserve rational criticism *and* deny neutral standpoints, it fails the **Joint Unsatisfiability** test.
  *   The winning interpretation will be the one that best explains **Hinge Drift** (Req. 3) while admitting whether it treats hinges as *constitutive of rationality* (Therapeutic) or *foundations for rationality* (Epistemic).

  Use this list to force the dispute out of "Who read Wittgenstein better?" and into "Which philosophical cost are we willing to pay?"
