answer: |-
  # Specification for a Teleosemantic Theory of Mental Content

  ## Introduction
  This document specifies the adequacy conditions for a teleosemantic theory of naturalized mental content. It does not survey existing literature but establishes the normative and explanatory targets any such theory must hit to be considered viable. The specification is organized around seven core desiderata. Each desideratum includes a philosophical motivation, a concrete test case, and a classification of its status within the theoretical landscape.

  ## Desiderata

  ### 1. The Distality and Disjunction Constraint
  **Motivation:** A theory of content must explain why a representation refers to the distal object that contributed to fitness, rather than the proximal stimulus that triggers the mechanism, or a disjunction of both. If content is merely causal covariance, it collapses into "small dark moving thing." If it is teleological, it must isolate the specific environmental feature the mechanism was selected to correlate with. An adequate theory must rule out the disjunctive content (e.g., "fly OR shadow") because the mechanism's function is not to snap at shadows, even if it causally does so.
  **Test Case:** A frog's visual neuron fires for flies, BBs, and shadows. Snapping at flies increased fitness; snapping at BBs/shadows did not. The theory must assign the content *fly* (or *food*), not *small dark moving object* or *fly-or-BB*.
  **Classification:** **Non-negotiable.** Any theory failing this fails to distinguish representation from mere causal trigger.

  ### 2. The Normative Error Constraint
  **Motivation:** Representation entails the possibility of truth and falsity. A system can be adaptive while frequently producing false representations if the cost of false negatives outweighs false positives. The theory must distinguish between a system *misrepresenting* (representing danger when none exists) and a system *functioning correctly* despite a high false-positive rate. Adaptive utility does not equal truth.
  **Test Case:** A "danger detector" mechanism was selected because missing a predator is fatal, but false alarms are cheap. It fires at rustling leaves (no predator) 50% of the time. The theory must classify these firings as *misrepresentations* (false alarms), not as veridical representations of "rustling leaves" or "potential danger," provided the mechanism's proper function is to detect predators.
  **Classification:** **Non-negotiable.** Without this, the theory cannot account for the normativity of the mental.

  ### 3. The Etiological Individuation Constraint
  **Motivation:** Teleosemantics grounds content in biological function, and biological function is historically defined. Therefore, content must be individuated by selection history, not just current causal structure or covariance. Two physically identical states in different lineages may have different contents if their evolutionary etologies differ.
  **Test Case:** Lineage A has a heat-sensor selected for detecting warm rocks (shelter). Lineage B has a physically identical sensor selected for detecting body heat (prey). Both currently fire at warm rocks and warm prey. The theory must assign different contents (*shelter* vs. *prey*) based on history, despite identical present operations.
  **Classification:** **Distinctive Commitment.** This defines teleosemantics against ahistorical causal or functional-role theories.

  ### 4. The Learning and Derivation Constraint
  **Motivation:** Organisms acquire representations within their lifetimes that were not directly selected for in evolutionary history (e.g., reading, navigation by novel cues). A theory restricted solely to phylogenetic selection cannot account for human or complex animal cognition. It must explain how derived proper functions (functions acquired via learning) generate new content without requiring new genetic selection.
  **Test Case:** A bird learns to navigate by a specific star. Neither the bird nor its ancestors were selected for using *that* star. The theory must explain how this state acquires representational content *star-location* via individual learning history, rather than dismissing it as non-representational or reducing it to a generic *light-source* content.
  **Classification:** **Non-negotiable.** A theory of mental content that cannot account for learning is inadequate for most minds.

  ### 5. The Historical Necessity Constraint (The Swampman Condition)
  **Motivation:** If content is constituted by selection history, an entity without a history cannot have content. This is a stress test for the theory's commitment to etiology. The theory must explicitly decide whether a perfect duplicate produced accidentally (without ancestors) possesses representational states.
  **Test Case:** A molecular duplicate of a human is formed by cosmic accident (Swampman). It behaves identically to a human. The theory must decide: Does Swampman have thoughts with content? If yes, history is not necessary. If no, the theory accepts counter-intuitive consequences about intrinsic duplicates.
  **Classification:** **Distinctive Commitment.** Strict teleosemantics typically accepts "No content" here, treating this as a bullet to bite rather than a reductio.

  ### 6. The Logical Scope Constraint
  **Motivation:** Mental content is not limited to simple existence claims (*predator here*). It includes negation, relations, modality, and normative status. A theory that only naturalizes simple detector states fails to cover ordinary thought. It must specify how complex contents are built from or related to basic teleological functions.
  **Test Case:** An animal avoids a location, representing *no predator here* (negation) or *same individual as before* (relation). The theory must explain how a mechanism selected for detection can support negative or relational content without positing a detector for "absences."
  **Classification:** **Non-negotiable.** Required for a general theory of mind, though often treated as a secondary development in basic teleosemantics.

  ### 7. The Functional Integrity Constraint
  **Motivation:** The theory must distinguish between representational error (false belief), malfunction (broken hardware), absence of function (noise), and successful non-representational guidance (reflex). Misrepresentation occurs when a system performs its representational function incorrectly, not when the function is absent.
  **Test Case:** Case A: A neuron fires due to a tumor (malfunction). Case B: A neuron fires due to an optical illusion while functioning normally (error). Case C: A reflex arc causes withdrawal without representation (non-representational success). The theory must categorize A as function failure, B as misrepresentation, and C as non-representational.
  **Classification:** **Non-negotiable.** Essential for distinguishing psychology from physiology and mechanics.

  ---

  ## Analysis of Joint Unsatisfiability

  A substantive tension exists between **Desideratum 3 (Etiological Individuation)**, **Desideratum 4 (Learning and Derivation)**, and **Desideratum 5 (Historical Necessity)**.

  1.  **The Tension:** If content is strictly determined by phylogenetic selection history (Desideratum 3 & 5), it is difficult to explain how individual learning generates *new* content (Desideratum 4) without diluting the historical requirement. If we allow individual history to generate content (to satisfy Learning), we weaken the claim that only evolutionary history constitutes content (threatening Historical Necessity).
  2.  **The Swampman Paradox:** If we maintain strict Historical Necessity (Swampman has no content), we preserve the purity of the teleological account but violate strong intuitions about intrinsic duplicates. If we grant Swampman content to satisfy intuition, we sever the link between content and selection history, collapsing teleosemantics into a form of functionalism or causal theory.
  3.  **Result:** A theory cannot simultaneously hold that (a) content is *constituted* entirely by ancestral selection, (b) learned contents are genuine and not merely derived proxies, and (c) intrinsic duplicates without history possess content. One must be relaxed. Most teleosemantic camps relax (c), accepting the Swampman consequence, and address (b) by positing "derived proper functions" grounded in the evolutionary capacity to learn. However, this leaves the status of the *first* learner in a lineage ambiguous. This inconsistency is not a flaw to be stipulated away, but a structural feature of naturalizing normativity via history.

  ---

  ## Scorecard of Approaches

  The following evaluates four distinct teleosemantic strategies against the seven desiderata above.

  **1. Producer-Selection Account**
  *Definition:* Content is determined by the conditions under which the producing mechanism was selected to produce the state.
  *Score:*
  *   **Distality/Disjunction:** Pass. Anchors content to the selected distal cause.
  *   **Normative Error:** Pass. Firing outside selected conditions is error.
  *   **Etiological Individuation:** Pass. Strictly historical.
  *   **Learning:** Weak. Struggles to explain novel content without appealing to derived functions.
  *   **Historical Necessity:** Pass. Swampman has no content.
  *   **Logical Scope:** Weak. Difficult to generate negative/modal content from production conditions.
  *   **Functional Integrity:** Pass. Clear distinction between broken producer and lying producer.

  **2. Consumer- or Success-Based Account**
  *Definition:* Content is determined by the conditions under which the downstream consumer of the state historically succeeded in performing its function.
  *Score:*
  *   **Distality/Disjunction:** Mixed. Can struggle if consumer success correlates with proximal stimuli.
  *   **Normative Error:** Strong. Error is defined by consumer failure conditions.
  *   **Etiological Individuation:** Pass. Relies on history of consumer success.
  *   **Learning:** Strong. Easier to model new consumer uses for old states.
  *   **Historical Necessity:** Pass. Swampman consumers have no history of success.
  *   **Logical Scope:** Moderate. Better at handling action-guiding negations.
  *   **Functional Integrity:** Pass. Distinguishes consumer failure from producer malfunction.

  **3. Informational Account Supplemented by Biological Function**
  *Definition:* Content requires reliable causal covariance (information) plus a biological function to use that information.
  *Score:*
  *   **Distality/Disjunction:** Weak. Vulnerable to the disjunction problem if covariance is not strict.
  *   **Normative Error:** Mixed. Error is covariance failure, but high false-positive rates complicate this.
  *   **Etiological Individuation:** Pass. Function component is historical.
  *   **Learning:** Strong. New covariances can be established within a lifetime.
  *   **Historical Necessity:** Fail. If covariance is sufficient plus function, Swampman might represent if functional is defined synchronically.
  *   **Logical Scope:** Weak. Information is typically existential/positive.
  *   **Functional Integrity:** Weak. Harder to distinguish broken indicator from misleading indicator.

  **4. Learning- or Use-Based Account**
  *Definition:* Content is generated by the history of reinforcement or use within an individual's lifetime, potentially independent of phylogeny.
  *Score:*
  *   **Distality/Disjunction:** Weak. Risks collapsing into proximal stimulus association.
  *   **Normative Error:** Weak. Normativity becomes pragmatic success rather than biological function.
  *   **Etiological Individuation:** Fail. Ignores phylogenetic history in favor of ontogeny.
  *   **Learning:** Strong. Specifically designed for this.
  *   **Historical Necessity:** Fail. Swampman could have content if it has a brief history of use.
  *   **Logical Scope:** Moderate. Flexible based on usage patterns.
  *   **Functional Integrity:** Weak. Blurs line between malfunction and learned disuse.

  **Summary:** The **Producer-Selection** and **Consumer-Based** accounts best satisfy the core teleosemantic desiderata (History, Error, Distality) but pay the price on Learning and Swampman intuitions. The **Informational** and **Use-Based** accounts handle plasticity better but fail to secure the strong normativity and historical individuation that define the teleosemantic project.
