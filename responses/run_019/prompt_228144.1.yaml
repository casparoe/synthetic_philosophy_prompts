      *   The "cost" is that you can't reduce everything to physics *and* keep the causal vocabulary intact without modification. You have to accept that high-level explanations aren't just "shorthands" but track real patterns (Daniel Dennett's "Real Patterns").
      *   The specific cost: You lose the dream of a "God's eye view" where only the micro-level is real. You have to accept emergence (weak emergence).

