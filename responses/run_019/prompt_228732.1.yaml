  Here is a breakdown of the distinct claims hidden inside "actions speak louder than words," pressure-tested against your specific situation (takeout, bank statements, and stated values).

  ### 1. The Epistemic Claim (Evidence of Mental States)
  *   **The Claim:** Actions are costlier to fake than words, so they provide higher-fidelity data about a person's true beliefs, desires, and priorities.
  *   **Status:** **Substantive-but-Defensible.** It is generally true that behavior is a stronger signal than speech because behavior incurs real costs (money, time, effort).
  *   **Does it support the roommate's move?** **Partially.** It justifies *skepticism* of your words, but not total *dismissal*. It suggests your words are low-weight evidence, not zero-weight evidence.
  *   **Pressure Points:**
      *   **Weakness of Will (Akrasia):** You can genuinely value health (high-order preference) but succumb to stress-eating (immediate impulse). The action reveals the strongest *impulse*, not necessarily the deepest *value*.
      *   **Constrained Choice:** If healthy food was unavailable or too expensive *in that moment*, the takeout choice reflects constraints, not preference.
      *   **Words as Data:** Sometimes words are the *only* data available for future intent (e.g., "I plan to change"). Dismissing them ignores the possibility of genuine planning.

  ### 2. The Definitional Claim (Revealed Preference)
  *   **The Claim:** "Preference" is *defined* by choice. If you chose takeout, you *preferred* takeout. To say you "value saving" but spend is a logical contradiction, like saying "I prefer A but chose B."
  *   **Status:** **False (as psychology); True (as economic modeling).** This is the "Revealed Preference" theory you mentioned. In neoclassical economics, this is an axiom used to model demand. In human psychology, it is false because humans hold conflicting, time-inconsistent values.
  *   **Does it support the roommate's move?** **Yes, absolutely.** If preferences *are* choices, then your statement is factually wrong by definition.
  *   **Pressure Points:**
      *   **Temporal Hierarchy:** Humans have "meta-preferences" (what we want to want). You can prefer the pizza now but prefer the *preference* for salad overall. The Definitional claim flattens this hierarchy.
      *   **Least-Bad Options:** Choosing the least-bad option in a bad situation doesn't mean you "prefer" it in a vacuum.
      *   **Framing:** How a choice is presented affects the action without changing the underlying value.

  ### 3. The Predictive Claim (Future Behavior)
  *   **The Claim:** Past behavior is a statistically better predictor of future behavior than stated intent.
  *   **Status:** **Substantive-but-Defensible.** Behavioral psychology supports this; habits are sticky, and "intent-behavior gaps" are common.
  *   **Does it support the roommate's move?** **No.** This predicts you will *fail* to live up to your values, but it doesn't prove you don't *have* those values. It supports betting against you, not correcting your self-knowledge.
  *   **Pressure Points:**
      *   **Change Over Time:** People genuinely change. Using past data to invalidate current intent ignores growth.
      *   **One-Off vs. Patterns:** A single bank statement is a small sample size. Predictive power requires patterns, not snapshots.
      *   **Self-Fulfilling Prophecy:** Dismissing someone's stated intent can reduce their motivation to change, making the prediction come true artificially.

  ### 4. The Normative Claim (Integrity/Hypocrisy)
  *   **The Claim:** You are morally responsible for what you do, not what you say. Words create an obligation; failing to meet them makes you a hypocrite. The "loudness" refers to moral weight.
  *   **Status:** **Substantive-but-Defensible.** Social trust relies on action-word alignment.
  *   **Does it support the roommate's move?** **No.** This criticizes your *character* or *execution*, not your *values*. You can be a hypocrite who genuinely values honesty but lies. The value remains valid even if you fail it.
  *   **Pressure Points:**
      *   **Private vs. Public:** Values can be private commitments. Failing them is a personal struggle, not necessarily a social lie.
      *   **Effort vs. Outcome:** You might value health and try hard but still get sick or slip up. The Normative claim often conflates outcome with intent.

  ### 5. The Consequentialist Claim (Impact)
  *   **The Claim:** Words have no physical consequences; actions do. Takeout fills your stomach; saying "I value health" does not.
  *   **Status:** **Trivial.** It is tautologically true that physical actions change physical states more than sound waves.
  *   **Does it support the roommate's move?** **No.** This is a category error. You are arguing about *axiology* (what is valued), not *physics* (what changed).
  *   **Pressure Points:**
      *   **Irrelevance:** Proving actions have consequences doesn't prove words are lies. It just proves words aren't hammers.
      *   **Speech as Action:** In some contexts (promises, contracts), words *are* actions with consequences.

  ---

  ### Analysis of the Roommate's Strategy
  Your roommate is relying primarily on the **Definitional Claim** (Revealed Preference) to win the argument, but they are borrowing the credibility of the **Epistemic Claim** to make it sound like common sense.

  *   **The Trap:** They treat the Epistemic claim ("actions are better evidence") as if it were the Definitional claim ("actions are the definition").
  *   **The Counter:** You can concede the Epistemic point ("Yes, my actions suggest I'm struggling to live up to my values") without accepting the Definitional point ("Therefore, I don't have those values"). This reframes the argument from "You are lying" to "I am having difficulty executing," which is harder for them to dismiss.

  ### Verdict on the Strongest Reading
  The **Definitional Claim** is the only one that fully supports your roommate's "checkmate" move, but it collapses under the pressure of basic psychology (akrasia, conflicting preferences). The **Consequentialist Claim** survives pressure testing but is trivial and irrelevant to the argument. The **Epistemic Claim** is the most robust philosophically; it survives the pressure tests (by admitting probability rather than certainty) and provides the only defensible ground for the roommate's skepticism, even if it doesn't justify their total dismissal.

  \answer{The Epistemic Claim}
