answer: |-
  **Project Title:** Disentangling the Normative Grounds of the Unilateralist's Curse: Harm Reduction vs. Epistemic Respect

  **1. The Research Question**
  The standard formulation of the unilateralist's curse (Bostrom, Douglas, & Sandberg) advises agents to adhere to a "Principle of Conformity": do not undertake a socially consequential initiative unless you believe a majority of relevant peers would also do so. This proposal asks: **Do the normative justifications for the Principle of Conformity diverge in cases of asymmetric cost distribution or motivated group cognition?**

  Specifically, I aim to determine whether the obligation to defer stems primarily from (a) a consequentialist duty to reduce the expected harm of mistaken unilateral action, or (b) a deontological duty to respect the equal epistemic standing of other agents. If these two justifications are distinct, the standard advice may yield incorrect normative guidance in scenarios where the group is epistemically competent but badly motivated, or where an action is low-cost for the actor but imposes high downstream risks on others.

  **2. Why Standard Approaches Leave This Open**
  Existing literature treats the Principle of Conformity as a monolithic heuristic. Formal models typically assume a unified utility function where the goal is simply to maximize the probability of a correct outcome. Consequently, these models cannot distinguish between *why* an agent should defer.

  This conflation creates a blind spot in two critical edge cases:
  1.  **Motivated Cognition:** If the relevant peer group is epistemically competent but has incentives to act maliciously or negligently regarding a specific issue, the "harm reduction" logic might suggest acting unilaterally to prevent a bad group outcome, while the "epistemic respect" logic suggests deferring to their standing as peers. The standard principle offers no resolution.
  2.  **Asymmetric Costs:** If an action is epistemically cheap for me to verify but imposes significant downstream existential risk on others, the "harm reduction" logic demands extreme caution (perhaps beyond majority rule), while "epistemic respect" might suggest my individual judgment should weigh equally.

  By lumping these normative jobs together, current theory cannot guide agents when the group's epistemic reliability and the group's moral alignment come apart.

  **3. Methodology: A Conceptual Approach**
  This project employs conceptual analysis rather than formal modeling or empirical study. A formal approach is premature because we do not yet know which variables matter; we cannot assign weights to "epistemic respect" versus "risk imposition" until we have defined their boundaries. An empirical approach (e.g., surveying intuitions) is insufficient because the goal is not to describe how people *do* reason about unilateralism, but to prescribe how they *ought* to reason when normative grounds conflict.

  Progress will be made by constructing a typology of unilateralist scenarios. I will use reflective equilibrium to test the Principle of Conformity against the two distinct normative grounds (Harm Reduction vs. Epistemic Respect) across the edge cases identified above. The goal is to decouple the *procedure* (counting peers) from the *purpose* (avoiding harm vs. acknowledging standing) to see if different procedures are required for different purposes.

  **4. Concrete Deliverable**
  The primary output will be a **Normative Diagnostic Toolkit for Institutional Governance**.

  While the theoretical paper will argue for the distinction, the practical deliverable will be a decision matrix designed for ethics boards, research governance committees, or AI safety oversight bodies. This toolkit will help policymakers decide when to enforce strict conformity protocols versus when to allow unilateral discretion.

  *   *Example Component:* A checklist to determine if a proposed restriction on unilateral action is justified by risk pooling (consequentialist) or authority sharing (deontological). If the latter, the toolkit will offer guidance on how to handle situations where the "peer group" is demonstrably misaligned with public interest.

  **5. Conditions for Project Failure**
  This project would fail if the conceptual analysis demonstrates that the two normative grounds (Harm Reduction and Epistemic Respect) are inextricably linked in practice. Specifically, failure conditions include:
  1.  **Convergence:** If it turns out that in all plausible real-world scenarios, respecting epistemic standing *always* aligns with minimizing harm, rendering the distinction theoretically interesting but practically inert.
  2.  **Inactionability:** If the distinction is coherent but yields no actionable guidance different from the standard Principle of Conformity (i.e., if the "refined" advice collapses back into "just defer to the majority" in every case).
  3.  **Category Error:** If further analysis reveals that "epistemic respect" is not a valid independent norm in this context, but is merely a heuristic proxy for long-term harm reduction.

  If any of these obtain, the project will pivot to documenting why the monolithic view is robust, though the working hypothesis is that the divergence is significant and policy-relevant.
