  ### The Prediction
  When you resume the argument, she will classify the real-time ledger access as an **Honest Signal**, but she will not admit it is costless. Instead, she will argue that the cost is **vulnerability** (loss of privacy, loss of negotiating leverage, or the risk of immediate rejection).

  She will do this because her consultant's intuition recognizes that the data feed separates healthy firms from unhealthy ones perfectly (just like the peacock's tail), but her ecologist's dogma forbids her from calling it "honest" without a "handicap." To resolve the cognitive dissonance that caused her to refuse classification last night, she will stretch the definition of "cost" to include "risk" or "exposure."

  ### The Candidate Principles
  You suspect her verdicts do not support her stated rule (Zahavi's Handicap Principle). You are correct. Her stated rule is **Differential Cost**, but her actual heuristic is **Indexicality**. Here are the three candidate rules consistent with her past verdicts, and how they diverge on the new case.

  **1. The Stated Rule: Differential Cost (Zahavi's Handicap)**
  *   **The Rule:** A signal is honest only if it imposes a net cost on the sender, and that cost is higher for low-quality individuals than for high-quality ones (e.g., a malnourished peacock cannot afford the tail).
  *   **Fit with Past Verdicts:** Perfect. Peacocks, gazelles, and deer all expend energy or risk predation. The working interview costs time and effort. The watch, apology, and press release are "cheap" because they lack this differential expenditure.
  *   **Prediction for New Case:** **Cheap Talk.** The prompt states the access costs the owner "essentially nothing." If she adheres strictly to this rule, she must reject it.
  *   **Why it fails:** It ignores *why* the watch is cheap talk. A watch isn't just cheap; it is *decoupled* from wealth (it can be leased). A peacock tail isn't just costly; it is *physiologically linked* to health.

  **2. The Actual Rule: Indexicality (Unfakeability)**
  *   **The Rule:** A signal is honest if it is physically or logically impossible to decouple the signal from the quality it advertises. The signal must be an *index* of the trait, not a *symbol* of it.
  *   **Fit with Past Verdicts:** Perfect.
      *   *Honest:* You cannot have the tail without the genes; you cannot stot without the legs; you cannot solve the work problem without the skill. In every "honest" case, the signal is constrained by reality.
      *   *Cheap:* You can have the watch without the wealth; you can say "sorry" without remorse; you can write a press release while bankrupt. In every "cheap" case, the signal is detached from the reality.
