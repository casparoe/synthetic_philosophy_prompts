  **3. The Hidden Rule: Differential Vulnerability (Skin in the Game)**
  *   **The Rule:** A signal is honest if the sender exposes themselves to a penalty that a low-quality sender could not survive.
  *   **Fit with Past Verdicts:** Strong. The gazelle risks predation; the stag risks exhaustion; the job candidate risks embarrassment. The watch buyer risks nothing (it's leased); the apologizer risks nothing (no restitution).
