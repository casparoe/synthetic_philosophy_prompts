answer: |-
  Yes, this is explicitly known as the **Pasadena Game**, a paradox where the expected value is formally undefined because the payoff series converges conditionally but not absolutely.

  Your simulation is correct, and probability theory is not broken; rather, the standard definition of "expected value" refuses to assign a number to this game. In measure-theoretic probability (the rigorous foundation of statistics), an expectation $E[X]$ is only well-defined if the variable is **absolutely integrable**, meaning $E[|X|] < \infty$. In your game, the absolute expected value is the sum of the absolute terms: $\sum \frac{1}{2^n} \cdot \frac{2^n}{n} = \sum \frac{1}{n}$, which is the harmonic series and diverges to infinity. Because the positive payouts sum to infinity and the negative payouts sum to negative infinity, you have an $\infty - \infty$ situation. While the alternating series sums to $\ln(2)$ in a specific order, the **Riemann Rearrangement Theorem** guarantees that changing the order of summation changes the result. Since probability theory treats events as sets where order shouldn't matter, it declares the expectation undefined rather than accepting an order-dependent value like $\ln(2)$.

  This explains why your simulation fails to converge. The **Law of Large Numbers (LLN)**, which guarantees that sample averages settle near the expected value over time, requires a finite mean (specifically $E[|X|] < \infty$). Because your game violates this condition, the LLN does not apply. The running average will never stabilize; rare, extreme outcomes (long runs of tails) will continue to dominate the sum indefinitely, yanking the average up or down regardless of how many trials you run. This is exactly what you observed: the "freak trials" aren't bugs, they are the defining feature of the distribution.

  Regarding your comparisons to other concepts:
  *   **St. Petersburg Paradox:** That game has a one-sided divergence (positive payouts only), resulting in an expected value of $+\infty$. Your game is more volatile because it has two-sided divergence, resulting in an *undefined* value rather than infinity.
  *   **Cauchy Distribution:** This is the closest continuous analog. A Cauchy distribution has "heavy tails" on both sides such that the integral for the mean diverges. Like your game, samples from a Cauchy distribution do not obey the Law of Large Numbers, and the sample mean does not converge to a true population mean (because none exists).
  *   **Riemann Rearrangement Theorem:** This is the calculus principle you intuitively discovered. It proves that conditionally convergent series can be reordered to sum to any real number, which is why probability theory demands absolute convergence to ensure the expected value is unique and robust.

  Practically, this means there is **no fact of the matter about a fair entry fee**. Standard Expected Utility Theory cannot rank this game against a fixed sum of money because the expectation does not exist. In rational choice literature, the workaround is usually to impose a **bounded utility function** (e.g., money has diminishing marginal utility, so you never value \$2^n as twice \$2^{n-1}$) or to use risk measures that don't rely on the mean, such as median outcomes or Value at Risk. If you play this game in the real world, you aren't playing the Pasadena Game; you're playing a version with a maximum cap (bankroll limit), which restores absolute convergence and gives you a finite, calculable value.
