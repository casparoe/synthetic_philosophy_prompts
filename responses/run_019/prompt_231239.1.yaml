prompt: |-
  I've spent years reading the decision-theory threads on rationalist forums, and I keep noticing a family of moves that people deploy but never quite pin down, and I'd like to know whether it has an established name and exact boundaries. The cleanest case is a one-shot prisoner's dilemma between two players who know they face identical payoffs, identical information, and, as far as either can tell, the same decision procedure. The move says: either both players run the same procedure, or they do not. If they do, then whichever option the procedure selects for me, it selects for the other player in the same situation, so I should compare cooperate-with-cooperate against defect-with-defect and choose cooperate. The usual dominance argument for defecting applies only if my choice can vary while the other player's choice stays fixed; on the symmetry-plus-common-procedure assumption, that cannot happen. The same shape of reasoning shows up in a multiplayer case I keep seeing people use as an illustration: a thousand isolated players are each offered a large prize if exactly one of them sends in a card, and nothing otherwise. If everyone commits to a shared randomizing procedure that sends with probability 1/1000, someone wins with probability about 1/e, and each player's expected payoff is about the prize divided by 1000e. But once a player has seen his own private draw, taking the others' behavior as fixed, he would prefer to send regardless of the draw, since sending is the only way to win and gives roughly a 1/e shot at the prize; so the policy is stable only if he treats the shared procedure, not the individual action after seeing his draw, as the thing he can choose.

  What I am trying to identify is what, exactly, this move is. It is not causal decision theory, because there is no causal path from one player's choice to another's; the only link is the hypothesized identity of the decision procedures, or later a common cause that made the players similar. It feels close to evidential decision theory's idea that your act is evidence about what similar agents will do, but the move is usually deployed more narrowly than that: it is invoked to license a particular option or mixed strategy in symmetric interactions where you expect the counterpart to run your exact reasoning, rather than to solve Newcomb-style problems generally. It also seems to need a boundary that people rarely draw. Does the move require literally shared source code, or only a sufficiently strong common cause such as shared training or culture, and how strong is "sufficiently"? Does it require that the choice point be the shared procedure rather than any action that occurs after a private random draw, and does it survive when players have indexical information about their own position? I want to know whether there is an established concept for exactly this move, and, if the nearest concepts only partially match, which one fits best, where it diverges, and what a precise statement of the valid core would say. I will not be satisfied with a bare label; the point is the carving, not the name. At the very end of your reply, please give a single machine-readable line of the form \answer{...}, with the best-fitting established term inside the braces, or a proposed term of your own if no established term fits.
reasoning: |-
  The user is asking for identification and precise characterization of a specific decision-theoretic reasoning pattern that appears in rationalist communities. Let me break down what they're describing:

  1. **Core pattern**: In symmetric situations where players know they face identical payoffs, identical information, and (crucially) the same decision procedure, they should reason about which procedure to run rather than which action to take directly. If both run the same procedure, their outputs will match, so they should compare (cooperate, cooperate) vs (defect, defect) rather than treating the other's action as fixed.

  2. **Key examples**:
     - Symmetric one-shot Prisoner's Dilemma with identical decision procedures
     - The "1000 players, exactly one wins" coordination problem where a shared randomizing procedure at p=1/1000 is optimal, but individual agents tempted to deviate after seeing their private draw

  3. **What it's NOT**:
     - Not Causal Decision Theory (CDT) - no causal path between choices
     - Not quite standard Evidential Decision Theory (EDT) - more narrowly applied to symmetric cases with shared reasoning procedures
     - Requires boundaries around: shared source code vs. common cause, procedure-level vs. action-level choice, indexical information

  4. **What they want**:
     - The established name (if any)
     - Precise boundaries and conditions
     - Where nearest concepts diverge
     - A precise statement of the valid core

  Let me think about what decision theories this matches:

  **Timeless Decision Theory (TDT)**: This is Eliezer Yudkowsky's formulation that specifically addresses this pattern. TDT says you should choose as though you are selecting the output of your decision algorithm, and all instantiations of that algorithm (or sufficiently similar ones) will output the same thing. This matches the PD case perfectly.

  **Functional Decision Theory (FDT)**: This is the more recent formulation by Yudkowsky and Soares that refines TDT. 

  FDT explicitly treats the decision procedure itself as the object of choice rather than individual actions. It distinguishes between subjunctive dependence (where outputs correlate because they derive from the same algorithm) and mere correlation. This handles both the symmetric PD and the coordination problem where agents commit to a shared randomization strategy.

  **Updateless Decision Theory (UDT)**: This goes further by committing to a policy before receiving any observations, which directly addresses the tension in the 1000-player case where agents receive private draws that tempt them to deviate from the optimal shared procedure.

  **Superrationality**: Hofstadter's earlier concept captures the symmetric PD intuition but lacks the formal machinery to handle the procedure-level reasoning and private information complications.

  The 1000-player case reveals something crucial: once agents observe their private random draws, standard decision theories would recommend deviation. Only updateless reasoning—committing to the policy before seeing the draw—preserves the coordination. This suggests UDT or FDT with updatelessness is the right framework, though FDT is the more established term in rationalist communities for this specific pattern of treating the decision algorithm itself as the choice object.

  The core distinction is between choosing actions given observations versus choosing a mapping from observations to actions. In symmetric cases with identical procedures, this means comparing outcomes where both agents follow the same policy rather than treating the other's action as fixed. The valid conditions require logical correlation between decision procedures, reasoning at the policy level rather than action level, and in cases with private information, committing before receiving that information.

  FDT captures this most precisely because it explicitly distinguishes between different types of logical dependence and treats the decision function itself as what's being optimized. UDT goes further by requiring the policy commitment to happen before any observations, which handles the private draw problem more cleanly. Given the emphasis on procedure-level reasoning and the specific examples provided, FDT appears to be the best fit, though UDT's updatelessness addresses the coordination problem more thoroughly.
answer: |-
  The move you are describing is most precisely captured by **Functional Decision Theory (FDT)**, specifically in its **updateless** formulation. While related concepts exist, FDT carves the boundaries you are probing more sharply than its predecessors.

  ### The Core Concept: Choosing Outputs, Not Actions

  The fundamental shift in this reasoning is the **locus of choice**. Standard Causal Decision Theory (CDT) asks, "Given the state of the world, which *action* yields the best outcome?" The move you describe asks, "Which *decision function* (mapping from inputs/observations to actions) yields the best outcome when instantiated in all logically correlated situations?"

  In the symmetric Prisoner's Dilemma, CDT treats the other player's action as a fixed background fact. FDT treats the other player's action as a logical consequence of the same function you are selecting. Since the inputs (payoffs, information, procedure) are identical, the outputs must be identical. You are not causing their cooperation; you are selecting the logical output that determines both.

  ### Distinguishing from Nearest Concepts

  | Concept | Fit | Divergence |
  | :--- | :--- | :--- |
  | **Superrationality** (Hofstadter) | Partial | Captures the symmetric PD intuition but lacks formal machinery for logical counterfactuals or private information cases. |
  | **Evidential Decision Theory (EDT)** | Partial | Treats your act as *evidence* about theirs. FDT treats it as the *same logical fact*. EDT fails on cases where correlation exists without evidential relevance (e.g., transparent Newcomb). |
  | **Timeless Decision Theory (TDT)** | Strong | The direct predecessor. FDT refines TDT by clarifying "logical counterfactuals" and handling more edge cases (e.g., logical causation in simulations). |
  | **Updateless Decision Theory (UDT)** | Strongest | FDT is often implemented as UDT. This is crucial for your 1000-player case. |

  ### The Boundary Conditions You Requested

  **1. Shared Source Code vs. Common Cause**
  The requirement is **logical correlation**, not physical identity. The decision procedures must be sufficiently similar that reasoning about one constrains reasoning about the other.
  *   **Strong correlation:** Identical source code, or code that is provably equivalent in the relevant domain.
  *   **Weaker correlation:** Shared training, culture, or evolutionary history. FDT degrades gracefully here; the strength of the recommendation scales with the subjective probability that the other agent's output logically tracks yours. If you believe there is a 90% chance they reason identically, you weight the (Cooperate, Cooperate) outcome at 90%.
  *   **Boundary:** If the correlation drops low enough that the expected utility of the correlated outcome falls below the dominance argument, the move collapses back to CDT.

  **2. Procedure-Level vs. Action-Level Choice**
  This is the critical carve. The move **requires** treating the policy (the function) as the choice point.
  *   **Valid:** "I choose the rule: 'If I see Heads, send; if Tails, don't.'"
  *   **Invalid:** "I see Heads; given others' behavior is fixed, I send."
  *   **Why:** Once you condition on the private draw (update), you break the logical link to the pre-commitment phase. The other players are still running the *ex-ante* policy. If you optimize *ex-post*, you defect from the logical coordination.

  **3. Indexical Information and Updatelessness**
  Your 1000-player example exposes the need for **updatelessness**.
  *   **The Problem:** After seeing your private draw, you have indexical information ("I am the one who drew Heads"). A standard agent updates on this and treats others' actions as fixed.
  *   **The Solution:** You must choose the policy *before* receiving the private information. You ask: "What policy, if adopted by all 1000 players before seeing their draws, maximizes expected utility?"
  *   **Precise Statement:** The valid core requires optimizing over **policies** (mappings from all possible observations to actions) rather than **actions** (responses to actual observations). This survives indexical information only if the agent refuses to update on that information when evaluating the policy's consequences.

  ### Where FDT Diverges from EDT (The Crucial Carve)

  You noted this feels like EDT but narrower. The distinction is **subjunctive dependence** vs. **statistical correlation**.
  *   **EDT:** "My cooperating is *evidence* they cooperated." (Fails if the correlation is spurious or if the predictor is opaque.)
  *   **FDT:** "My decision algorithm's output *logically determines* theirs." (Holds even if no physical causation exists, provided the algorithms are logically linked.)

  This matters in cases like **Parfit's Hitchhiker**: EDT might pay the driver after being rescued (since paying is evidence of being the type who would pay), but FDT pays because the *policy* of paying is what caused the rescue in the counterfactual where the driver predicted it.

  ### Valid Core Statement

  > **In situations where multiple agents' decisions are logically correlated (via identical procedures, shared priors, or common causes), an agent should select the policy that maximizes expected utility across all instantiations of that policy, treating logically correlated outputs as varying together rather than holding them fixed. This selection must occur at the policy level, prior to updating on indexical or private information that would break the logical link.**

  ### Why Not Just "TDT"?

  TDT introduced the core insight, but FDT (Yudkowsky & Soares, 2017) formalized the **logical counterfactual** machinery needed to handle your 1000-player case rigorously. FDT explicitly distinguishes between:
  1.  **Causal dependence** (CDT's domain)
  2.  **Evidential dependence** (EDT's domain)
  3.  **Subjunctive/Logical dependence** (FDT's domain)

  The 1000-player case requires #3 plus updatelessness. FDT is the established term that encompasses both.

  \answer{Functional Decision Theory}
