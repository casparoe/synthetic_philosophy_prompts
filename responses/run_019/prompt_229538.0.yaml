      *   **Wrinkle 1 (Exaptation):** Origins don't matter. Even if born of bad reasons, it might have acquired latent functions over time.
      *   **Wrinkle 2 (Incommensurability/Endogeneity):** You can't neutrally measure costs/benefits *while* the institution exists because it shapes the preferences and baselines used for measurement.
      *   **Goal:** The user wants to know what would *actually* count against this view. They want "fatal" vs. "awkward" defeaters. They want to know if the position is falsifiable or insulated (dogmatic). They specifically ask about cases where reformers admitted ignorance, abolished anyway, and things went fine.

