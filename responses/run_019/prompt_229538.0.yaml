answer: |-
  This is a sophisticated formulation. You have effectively armored the traditional conservative epistemology (Burke/Oakeshott/Hayek) against the two most common liberal critiques: the genetic fallacy (origins don't matter, per your exaptation wrinkle) and the preference-utilitarian calculus (preferences are endogenous, per your measurement wrinkle).

  By claiming that consequentialist analysis is *never* sufficient on its own when tacit knowledge is suspected, you have moved from a heuristic to a near-axiomatic constraint. This makes the position robust, but it exposes you to a specific kind of philosophical vulnerability: **unfalsifiability.**

  Here is a ranking of defeaters, from those that threaten to collapse the theoretical architecture (Fatal) to those that merely force uncomfortable concessions (Awkward).

  ### 1. The "Parasitic Memetics" Defeater (Fatal)
  **The Argument:** Your position assumes that "tacit, distributed knowledge" embodied in an institution is functionally beneficial to the *host society*. However, evolutionary theory applied to institutions (memetics or Public Choice theory) suggests institutions also evolve to preserve *themselves*.
  **Why it hurts:** An institution can embody highly sophisticated tacit knowledge on "how to extract rents," "how to stifle competition," or "how to signal loyalty to elites" without providing any social utility.
  **The Trap:** If a guild restricts entry to protect wages, it embodies tacit knowledge of social cohesion among members and quality control signals. If you abolish it, prices might drop (consequentialist win), but the "tacit knowledge" of quality assurance is lost. However, if the "quality assurance" was actually just a cartel mechanism, preserving the fence preserves a parasite.
  **Fatal Condition:** If you cannot distinguish between *functional* tacit knowledge (social coordination) and *parasitic* tacit knowledge (rent-seeking survival strategies) without resorting to the consequentialist analysis you've ruled out, your principle becomes a defense of any successful cartel that has survived long enough.
  **Verdict:** **Fatal.** You need a meta-criterion for distinguishing "healthy" tacit knowledge from "cancerous" tacit knowledge. If that criterion isn't consequentialist, what is it? If it *is* consequentialist, Wrinkle 2 collapses.

  ### 2. The "Comparative Natural Experiment" Defeater (Fatal)
  **The Argument:** You claim we cannot measure costs from within because the institution shapes the baseline. However, we often have access to *external* baselines via culturally similar polities that lack the institution.
  **Why it hurts:** Suppose Country A and Country B share a language, religion, and economic history. Country A has "Institution X" (500 years old); Country B does not (abolished 100 years ago). If Country B shows no signs of the specific social collapse predicted by the Fence theorist, and indeed outperforms A on metrics A *claims* to value (stability, trust, cohesion), the claim that Institution X embodies *necessary* tacit knowledge is empirically weakened.
  **The Trap:** You might argue B has *different* tacit knowledge. But if B is thriving without X, then X is not *universally* necessary for the function it purportedly serves. This shifts the burden back to the defender to explain why X is necessary *here* but not *there*.
  **Fatal Condition:** If you dismiss comparative data by claiming "their tacit knowledge is different and we can't understand it either," you render the theory immune to all empirical evidence.
  **Verdict:** **Fatal.** This is the strongest empirical check. If the theory cannot accommodate control groups, it is theology.

  ### 3. The "Epistemic Lock-In" Defeater (Fatal)
  **The Argument:** Some institutions do not just shape preferences; they degrade the cognitive capacity required to evaluate them. This is the "adaptive preference" problem on steroids.
  **Why it hurts:** Consider a caste system or a theocracy that bans literacy. The "tacit knowledge" embodied might be "how to maintain social order without literacy." The reformers cannot run a cost-benefit analysis because the institution has prevented the population from acquiring the tools (literacy/critical theory) to conceive of the alternative.
  **The Trap:** Your Wrinkle 2 says we can't measure costs from inside. But if the institution makes the *measurement itself* impossible, the Fence principle mandates preserving the blindness.
  **Fatal Condition:** If there is no exception for institutions that actively destroy the epistemic infrastructure required to judge them, the principle mandates the preservation of ignorance.
  **Verdict:** **Fatal.** You need an "epistemic openness" clause.

  ### 4. The "Silent Abolition" Retrospective (Awkward)
  **The Argument:** You asked for cases where reformers admitted ignorance, scrapped it, and it went fine.
  **The Case:** **Decimalization of Currency.**
  *   **Context:** Moving from £sd (pounds, shillings, pence) to decimal currency.
  *   **Ignorance:** Reformers admitted they couldn't fully map the cultural/tacit embedding of the old system (idioms, mental math habits, pricing psychology).
  *   **Action:** Abolished anyway.
  *   **Result:** No social collapse. Economic efficiency gained. Some nostalgia lost.
  *   **The Fence Response:** "The tacit knowledge wasn't *vital*, just decorative."
  *   **The Problem:** How do you know it wasn't vital *ex ante*? You only know *ex post*.
  **Verdict:** **Awkward.** This forces you to admit that the principle is a *gamble*, not a logical certainty. You have to concede that sometimes we jump fences blindly and land on solid ground. If you admit this, your claim that consequentialist cases are *never* sufficient softens to "rarely sufficient."

  ### 5. The "Falsifiability Horizon" (Awkward/Fatal)
  **The Argument:** How long must we wait to confirm the tacit knowledge was vital?
  **Why it hurts:** If you abolish the Monarchy and the country collapses in 50 years, you say "Aha! Tacit knowledge!" If the country thrives for 50 years, you say "Wait, the social capital is depleted, check back in 100."
  **The Trap:** If the "hidden cost" can always be pushed to a later date, the theory is unfalsifiable.
  **Verdict:** **Fatal if insulated.** You must specify a time horizon or a leading indicator of "social capital depletion" that is observable *before* total collapse.

  ### 6. The "Scope Creep" Problem (Merely Awkward)
  **The Argument:** What counts as a "long-standing institution"?
  **Why it hurts:** Is the 55mph speed limit a "long-standing institution" (in US terms)? Is the 40-hour work week? Is the tenure system in universities?
  **The Trap:** If the principle applies to everything older than a generation, society freezes. If it applies only to "deep" structures (Constitution, Family, Religion), you need a non-arbitrary line.
  **Verdict:** **Awkward.** You can fix this by stipulating "constitutive institutions" vs. "regulatory policies," but it requires more philosophical heavy lifting.

  ---

  ### Honest Assessment: Have You Insulated the Position?

  **Yes, you have insulated Wrinkle 2 to the point of dogma.**

  By claiming that **purely consequentialist cost-benefit cases are *never* sufficient on their own**, you have created a shield that cannot be pierced by data.
  *   If abolition succeeds: "You got lucky / short-term gain."
  *   If abolition fails: "See? Tacit knowledge."
  *   If measurement is impossible: "That proves my point."

  **To make this a live philosophical position rather than a faith commitment, you must risk the following:**

  1.  **Concede Falsifiability:** You must admit there is *some* observable outcome that would prove the tacit knowledge wasn't there. (e.g., "If a culturally similar neighbor thrives without it for 3 generations, the burden shifts back.")
  2.  **Distinguish Parasites:** You must provide a non-consequentialist way to identify rent-seeking institutions. (Perhaps a procedural test: "Does the institution restrict exit?")
  3.  **Allow for "Epistemic Emergencies":** You must admit that if an institution actively prevents the formation of the knowledge required to judge it, the Fence principle suspends itself.

  **The Strongest Defeater for You:**
  The **Parasitic Memetics** argument. If you cannot explain why the "tacit knowledge" of the KKK or the Soviet Nomenklatura (both long-standing, both embodied distributed knowledge of social coordination) should not be protected by your principle, then your principle is not about *wisdom*, it is about *age*.

  If you accept that "bad tacit knowledge" exists, you need a filter to screen it out. That filter will inevitably look like... a consequentialist or moral analysis. And once you let that filter in, Wrinkle 2 crumbles.

  **Recommendation:**
  Softening "never sufficient" to "presumptively insufficient" saves the theory. It keeps the burden of proof heavy on the reformer without making the position immune to the possibility that sometimes, the fence is just rotting wood.
