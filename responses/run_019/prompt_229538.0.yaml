      *   *This is strong.* It attacks the assumption that tacit knowledge = social good.

  6.  **Finalizing the Ranking:**
      1.  **The Parasitic Memetics Defeater (Fatal):** Tacit knowledge $\neq$ Public Good. It might be rent-seeking knowledge.
