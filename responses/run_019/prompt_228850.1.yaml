          *   *Technical/Safety Rule:* (Fails Arbitrariness). -> *Codify* (if safety/critical function).
          *   *Power/Privilege:* (Fails Preference/Coordination - some prefer otherwise). -> *Discourage* or *Codify with Sunset*.
