answer: |-
  # The Lewisian Audit Procedure for Bylaws Review

  **Purpose:** To classify unwritten society practices using David Lewis's criteria for *convention*, thereby determining their suitability for codification, retention as unwritten norms, or active discouragement.

  **Constraint Note:** This procedure relies on observation and committee inference. It does not permit membership polling. Where human judgment is required rather than mechanical deduction, it is explicitly marked as **[JUDGMENT CALL]**.

  ---

  ## Part I: The Testing Procedure

  Apply the following four tests in sequence to each candidate practice.

  ### Test 1: The Regularity and Expectation Check
  **Lewisian Principle:** A convention requires no explicit agreement; it exists only if there is actual conformity and mutual expectation of conformity.
  *   **Observable Evidence:**
      *   **Pass:** In the last three occurrences of the relevant situation, >90% of members complied. Newcomers are corrected by peers within minutes of deviation.
      *   **Fail:** Compliance is sporadic (<50%). Deviation goes unnoticed or uncorrected. The practice exists only in the minutes of old meetings (explicit agreement) but not in current behavior.
  *   **Classification if Failed:** *Non-Practice.*
  *   **Default Recommendation:** **Ignore.** (Do not codify a ghost; do not discourage a non-existent threat.)
  *   **Exception:** If the practice is a safety critical rule that *should* be followed but isn't, classify as *Safety Violation* and recommend **Codify + Enforce**.

  ### Test 2: The Coordination Dependence Check
  **Lewisian Principle:** Agents conform because they expect others to conform. The benefit comes from the coordination itself, not the specific action.
  *   **Observable Evidence:**
      *   **Pass:** Members express that the practice is useful *only because everyone else does it*. If asked, "Would you still do this if no one else did?" the answer is "No."
      *   **Fail:** Members do it regardless of others (habit/morality) OR members do it solely due to fear of authority/punishment rather than mutual benefit.
  *   **Classification if Failed:** *Habit/Moral Rule* OR *Coerced Norm.*
  *   **Default Recommendation:**
      *   If *Habit/Moral*: **Leave Alone.** (Bylaws are poor tools for policing habits.)
      *   If *Coerced Norm*: **Discourage.** (Indicates instability or power imbalance.)
  *   **Exception:** **[JUDGMENT CALL]** If the Coerced Norm protects a vulnerable group or essential resource, recommend **Codify** to ensure fair enforcement rather than arbitrary social pressure.

  ### Test 3: The Arbitrariness Check
  **Lewisian Principle:** There must be a genuine alternative regularity that could have solved the coordination problem equally well. If physics or logic dictates only one solution, it is not a convention; it is a technical necessity.
  *   **Observable Evidence:**
      *   **Pass:** The committee can conceive of a specific, workable alternative (e.g., "North-South rows" instead of "East-West," "Lottery" instead of "Seniority").
      *   **Fail:** The practice is dictated by physiology, physics, or law (e.g., "Do not touch high voltage," "Red light for night vision"). No viable alternative exists without losing the primary function.
  *   **Classification if Failed:** *Technical Constraint.*
  *   **Default Recommendation:** **Codify.** (Technical constraints require clear, written definition to prevent dangerous or activity-breaking ambiguity.)
  *   **Exception:** If the technical detail is too granular for bylaws (e.g., exact wavelength of red light), recommend **Codify Principle, Delegate Detail** (e.g., "Dark adaptation must be preserved as determined by the Site Manager").

  ### Test 4: The Stability and Preference Check
  **Lewisian Principle:** A convention rests on a coordination equilibrium where everyone prefers to conform *on the condition that others do*. If a majority prefers a different equilibrium, the convention is unstable.
  *   **Observable Evidence:**
      *   **Pass:** No persistent grumbling. Deviators are corrected politely. Long-term members and new members alike express satisfaction with the predictability.
      *   **Fail:** Persistent private grumbling. Compliance is accompanied by visible resentment. A specific subgroup (e.g., new members) is systematically disadvantaged.
  *   **Classification if Failed:** *Unstable Equilibrium.*
  *   **Default Recommendation:** **Discourage / Reform.** (An unstable convention is a candidate for conflict. If codified, it will require constant enforcement.)
  *   **Exception:** **[JUDGMENT CALL]** If the instability is caused by a vocal minority against a satisfied majority, recommend **Codify** to clarify the rule and reduce ambiguity, provided the majority preference is clear.

  ---

  ## Part II: Application to Society Cases

  Here is the audit applied to the three cases you provided.

  ### Case 1: East-West Telescope Rows
  *   **Test 1 (Regularity):** **PASS.** Congealed in the 1990s, everyone follows it, newcomers anchor near the lot.
  *   **Test 2 (Coordination):** **PASS.** The value is avoiding collisions and cable tangles. If others parked randomly, this system would fail.
  *   **Test 3 (Arbitrariness):** **PASS.** You noted North-South rows would serve equally well. This is a pure Lewisian convention.
  *   **Test 4 (Stability):** **PASS.** Members seem "genuinely content." No grumbling reported.
  *   **Classification:** *True Convention.*
  *   **Recommendation:** **Leave Alone.**
  *   **Reasoning:** Lewis argues conventions function best without the rigidity of law. Codifying this risks turning a flexible social norm into a litigious rule (e.g., "Is this telescope 2 inches outside the row?"). It solves a coordination problem efficiently as is.
  *   **Exception Considered:** Only codify if site expansion makes the "gravel lot" anchor ambiguous.

  ### Case 2: Red Lights Only
  *   **Test 1 (Regularity):** **PASS.** Newcomers corrected within seconds.
  *   **Test 2 (Coordination):** **PASS.** One person's white light ruins everyone's night vision. Conformity is mutually beneficial.
  *   **Test 3 (Arbitrariness):** **FAIL.** This is the critical pivot. You noted a "real physiological reason." White light bleaches rhodopsin; red light does not. While the *exact shade* of red might be arbitrary, the *prohibition of white light* is a technical necessity, not a social convention.
  *   **Test 4 (Stability):** **PASS.** Generally accepted as necessary for the activity to function.
  *   **Classification:** *Technical Constraint.*
  *   **Recommendation:** **Codify.**
  *   **Reasoning:** Unlike the telescope rows, this is not arbitrary. Because it is critical to the society's purpose (observing) and newcomers cannot be expected to intuit the physiology, it requires the clarity of written bylaws.
  *   **Exception:** Do not codify the exact nanometer wavelength. Codify the requirement: "Artificial lighting must preserve night vision (red spectrum only)."

  ### Case 3: Seniority Loaner Pick
  *   **Test 1 (Regularity):** **PASS.** Twenty years old, newer members comply.
  *   **Test 2 (Coordination):** **FAIL (Partial).** While it avoids fighting, the motivation is not mutual benefit. It is compliance due to social hierarchy. Newers comply to avoid conflict, not because they prefer this system.
  *   **Test 3 (Arbitrariness):** **PASS.** A lottery or sign-up sheet would work equally well.
  *   **Test 4 (Stability):** **FAIL.** You note newer members "grumble about it privately" and suspect a majority prefer a lottery. This indicates the preference condition of a convention is not met. It is a norm enforced by power, not a convention enforced by mutual interest.
  *   **Classification:** *Unstable Equilibrium / Power Norm.*
  *   **Recommendation:** **Discourage / Reform.**
  *   **Reasoning:** Lewis's account requires that agents prefer to conform *given* others conform. Here, agents conform *despite* preferring an alternative. This is a source of future conflict. Codifying this would cement a grievance.
  *   **Exception:** **[JUDGMENT CALL]** As Chair, you must recuse yourself from the final vote on this item due to your disclosed conflict of interest. The committee should propose a Lottery system in the bylaws to replace this practice.

  ---

  ## Part III: Limits of the Procedure

  You asked for honesty regarding what this exercise cannot settle. Present this section to your committee to manage expectations.

  1.  **The Is/Ought Gap:** Lewis's account is descriptive (what *is* a convention), not normative (what *should* be a rule). A practice can pass all four tests as a "True Convention" and still be morally objectionable or inefficient. This procedure identifies stability, not justice.
  2.  **The Silence Problem:** Without polling, Test 4 (Stability/Preference) relies on observable grumbling. A "silent majority" that is unhappy but polite will pass Test 4 incorrectly. The procedure assumes that deep dissatisfaction eventually manifests socially. If your membership is unusually passive, this test may yield false positives for stability.
  3.  **The Codification Paradox:** Lewis suggests conventions work *because* they are not laws. By codifying a convention (even with a "Leave Alone" recommendation), the committee changes the nature of the practice. Writing it down may shift motivation from "I do this to coordinate with friends" to "I do this to avoid punishment." The procedure cannot predict this sociological shift.
  4.  **Arbitrariness vs. Tradition:** In Test 3, distinguishing between "arbitrary" and "traditional" is a **[JUDGMENT CALL]**. A practice may have no physical necessity but may have accumulated so much historical value that the alternative is no longer "equally good" in the eyes of the members. The committee must decide if history counts as a "viable alternative" constraint.

  ### Final Note to the Chair
  You mentioned you benefit from Case 3 and would rather the procedure tell you something you dislike than be bent. The procedure classifies Case 3 as an *Unstable Equilibrium* because the preference condition is not met across the population. Lewis's definition of convention requires a coordination equilibrium where everyone prefers the conformity. If the newer members prefer a lottery, the "Seniority" rule is not a Lewisian convention; it is a power dynamic. To remain faithful to the philosophy you are applying, the recommendation must be to reform it, regardless of your personal tenure.
