          *   Arbitrariness: Yes (Lottery works).
          *   *Verdict:* Fails the "Preference" condition of a stable convention (it's a norm enforced by power, not mutual benefit).
          *   *Recommendation:* Discourage (or Codify a change). Since the user wants honesty: The procedure flags this as unstable/unjust. Recommendation: Discourage the practice, propose Lottery in bylaws.

  5.  **Addressing the Limits:**

      *   Lewis describes *equilibrium*, not *justice*.
