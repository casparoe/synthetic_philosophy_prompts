  2.  **Deconstruct David Lewis's *Convention*:**

      *   *Core Definition:* A convention is a regularity $R$ in behavior among a population $P$ in a recurrent situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on condition that others do (coordination equilibrium).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem instead (Arbitrariness).
          5.  (Common Knowledge): All the above are known to everyone, known to be known, etc.
      *   *Key Distinction for this User:* Lewis describes *what is*, not necessarily *what ought to be written down*. The user wants to use this to decide *normative status* (codify vs. leave alone).
      *   *Constraint Check:* The user specifically wants to keep the "no explicit agreement" rule and the "alternative regularity" rule.

