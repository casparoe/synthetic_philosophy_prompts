      *   *Test 2: Coordination & Preference (Lewis Condition 3).* Do people do it *because* others do it? Is there a coordination problem?
          *   *Evidence:* Would chaos ensue if everyone did their own thing?
          *   *Fail:* It's just a habit or a moral rule, not a coordination convention. -> *Leave Alone* (usually).
      *   *Test 3: Arbitrariness (Lewis Condition 4).* Could something else have worked?
          *   *Evidence:* Physical constraints vs. social choice.
          *   *Fail:* It's physically necessary (e.g., don't shine light in eyes). -> *Codify* (if critical) or *Leave Alone*.
      *   *Test 4: Common Knowledge (Lewis Condition 5).* Does everyone know everyone knows?
