answer: |-
  # Decision Tree: Where Do You Stand on the Extended Mind?

  **Instructions:** Start at **Question 1**. Answer **YES** or **NO** based on your intuition about the Otto/Notebook case and cognition generally. Follow the arrows to the next numbered question or to a **Position Leaf**. 

  *Note: This tree maps the logical space of situated cognition. Some paths lead to established philosophical positions; others lead to "Unoccupied" zones, indicating a combination of views that is rarely defended because it is either unstable or unexplored.*

  ---

  ### The Flowchart

  **1. Is an external resource (like Otto's notebook) literally *part* of the cognitive process, or is it merely a *tool* used by a process inside the head?**
  *   **YES (It is part):** Go to **Question 4**.
  *   **NO (It is a tool):** Go to **Question 2**.

  **2. (Tool View) To explain how the thinking happens, must we mention the external environment, or is the brain sufficient?**
  *   **YES (Must mention environment):** Go to **Question 3**.
  *   **NO (Brain is sufficient):** Go to **Question 8**.

  **3. (Environment Needed) Does the skin/skull boundary have special explanatory significance, or is it just a contingent border?**
  *   **YES (Skin/Skull is special):** → **Position A: Embedded Internalism**
  *   **NO (Skin/Skull is not special):** → **Unoccupied Zone 1** *(Diagnosis: If the environment is essential for explanation but the boundary doesn't matter, you usually slide into claiming the environment is constitutive [Go to Q1 YES].)*

  **4. (Part View) Is the core of cognition primarily about processing and storing information?**
  *   **YES (Information processing):** Go to **Question 5**.
  *   **NO (Active engagement/sense-making):** Go to **Question 6**.

  **5. (Information) To count as cognitive, must the external resource function in roughly the same way an internal brain process would?**
  *   **YES (Must function similarly):** Go to **Question 7**.
  *   **NO (Can play a different role):** Go to **Question 9**.

  **6. (Engagement) Is the organism fundamentally separable from the environment, even during action?**
  *   **YES (Organism is distinct):** → **Position B: Enactivism**
  *   **NO (Organism-Environment is a single unit):** → **Unoccupied Zone 2** *(Diagnosis: Radical Enactivism or Identity Theory. Rarely held as a distinct middle-ground; usually collapses into full-blown ecological realism.)*

  **7. (Similar Function) Are you willing to accept that if the resource is reliable enough, your memory literally extends into it (e.g., your phone is your memory)?**
  *   **YES (Accept extension):** → **Position C: First-Wave Extended Mind**
  *   **NO (Reject extension):** → **Unoccupied Zone 3** *(Diagnosis: Incoherent. If you demand functional parity but deny extension when parity is met, you are secretly a Internalist [Go to Q1 NO].)*

  **8. (Brain Sufficient) Is inferring that coupling constitutes cognition *always* a fallacy?**
  *   **YES (Always a fallacy):** → **Position D: Robust Internalism**
  *   **NO (Sometimes legitimate):** → **Unoccupied Zone 4** *(Diagnosis: Unstable. If coupling can constitute but you deny the resource is part of the process, you lack a criterion for when constitution happens.)*

  **9. (Different Role) Do you accept that external resources can be constitutive even if they work differently from neural processes (e.g., a calculator is part of your arithmetic)?**
  *   **YES (Accept complementarity):** → **Position E: Second-Wave Extended Mind**
  *   **NO (Reject complementarity):** → **Unoccupied Zone 5** *(Diagnosis: Unexplored. A constitutive view that rejects both parity and complementarity leaves no way for external stuff to qualify as cognitive.)*

  ---

  ### The Positions (Leaves)

  **Position A: Embedded Internalism**
  *   **The View:** Cognition is brain-bound, but it relies so heavily on environmental scaffolding that we can't explain it without referencing the world.
  *   **The Awkward Commitment:** "You can't explain how I think without mentioning my notebook, but the thinking is still happening entirely inside my skull."

  **Position B: Enactivism**
  *   **The View:** Cognition is not information processing but a dynamic history of structural coupling between organism and environment.
  *   **The Awkward Commitment:** "There is no 'mind' inside you waiting to process the world; there is only your active engagement with it."

  **Position C: First-Wave Extended Mind (Parity Principle)**
  *   **The View:** If an external resource plays a role that would be accepted as cognitive if it were inside the head, it is part of the cognitive process.
  *   **The Awkward Commitment:** "Your phone's contact list is literally part of your biological memory, subject to the same bloat worries as your neurons."

  **Position D: Robust Internalism**
  *   **The View:** Cognitive processes are strictly intracranial; external resources are merely causal inputs, like light hitting the retina.
  *   **The Awkward Commitment:** "Even if you are permanently plugged into a supercomputer that does all your calculating, your mind hasn't grown an inch."

  **Position E: Second-Wave Extended Mind (Complementarity)**
  *   **The View:** External resources are constitutive parts of the cognitive system, even if they function differently from biological parts, provided they integrate fluently.
  *   **The Awkward Commitment:** "A plastic calculator is part of your arithmetic ability even though it works nothing like a neuron and has no biological history."

  ---

  ### ⚠️ Important Note on Collapsing Positions

  **Embedded Internalism (A) vs. Enactivism (B)**
  *   **The Problem:** In practice, these two leaves are difficult to distinguish. Both insist that the environment is essential for explanation.
  *   **The Difference:** Embedded Internalists say the environment *causes/scaffolds* internal states. Enactivists say the coupling *constitutes* the cognitive state itself.
  *   **Warning:** If you answered **YES** to Q2 (Environment Needed) but found Q1 (Part vs. Tool) ambiguous, your view likely sits on the border of A and B. Many seminar discussions collapse this distinction because the explanatory practices look identical even if the metaphysics differ.

  ---

  ### Logical Space Map (For Revision)

  | Path | Answer Sequence | Result | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | Tool → No Dependence → Boundary Special | **Robust Internalism** | **Occupied** |
  | **2** | Tool → Dependence → Boundary Special | **Embedded Internalism** | **Occupied** |
  | **3** | Tool → Dependence → Boundary *Not* Special | **Unoccupied Zone 1** | **Unattractive** (Leads to Constitution) |
  | **4** | Part → Engagement → Organism Distinct | **Enactivism** | **Occupied** |
  | **5** | Part → Info → Parity → Accept Bloat | **First-Wave Extended** | **Occupied** |
  | **6** | Part → Info → Complementarity → Accept | **Second-Wave Extended** | **Occupied** |
  | **7** | Part → Info → Parity → Reject Bloat | **Unoccupied Zone 3** | **Incoherent** |
  | **8** | Tool → No Dependence → Coupling *Not* Fallacy | **Unoccupied Zone 4** | **Unstable** |
  | **9** | Part → Info → No Parity → Reject Complementarity | **Unoccupied Zone 5** | **Unexplored** |
