  **ELECTORAL COMMISSION OF THE REPUBLIC**
  **OPINION OF THE CHAIR**
  **SUBJECT: DETERMINATION OF CAMPAIGN RULES FOR UPCOMING REFERENDUM**

  **1. Recommendation**

  It is my recommendation that the Commission adopt the **middle course** for the conduct of the referendum campaign. Specifically, organised national campaigning by incorporated associations shall be permitted, subject to strict equalisation measures. These conditions must include: (i) identical expenditure caps for all registered umbrella organisations representing distinct positions; (ii) equal blocks of public funding disbursed upon registration; and (iii) equal allocations of public broadcast time. This model best satisfies our statutory duties, adheres to Constitutional Court precedents on proportionate restriction, and aligns most closely with the philosophical principles invoked during our deliberations.

  **2. Interpretation of the Philosophical Precedent**

  Our colleague's reliance on Rousseau's *The Social Contract* is noted, particularly the passage concerning the General Will. However, to treat this text as a mandate for the closed model is to isolate the ideal from the practical remedy Rousseau himself provides. The passage distinguishes between the sublime system of Lycurgus, where no partial societies exist, and the practical precautions of Solon, Numa, and Servius. Rousseau acknowledges that in most states, partial societies are inevitable. His instruction is not to ban them where they already exist—which risks starving the citizen of information—but rather to ensure there are "as many as possible and to prevent them from being unequal."

  The closed model attempts to impose the Lycurgan ideal upon a modern polity where parties and associations are entrenched. This ignores Rousseau's explicit fallback: if partial societies exist, equality among them is the only guarantee that the General Will shall be enlightened. The middle course operationalises this Solonian precaution. By equalising expenditure and broadcast time, we prevent any single association from becoming "so great as to prevail over all the rest," thereby ensuring the decision remains a "sum of small differences" rather than the dictate of a single dominant faction.

  **3. The Referendum Context and Information Conditions**

  The context of a referendum—a single binary question rather than a choice of representatives—strengthens the case for the middle course. In representative elections, voters choose among competing teams over a broad programme. In a referendum, the question is isolated, making voters more susceptible to domination by a single narrative if one association overwhelms the information space. The advisory report correctly notes that parties and associations are the principal means by which voters become informed. The closed model, by prohibiting coordinated advocacy, risks failing Rousseau's primary condition: that the people be "furnished with adequate information." Isolating citizens without providing alternative structured information does not produce independent thought; it produces ignorance.

  Conversely, the open model risks validating the sponsors' claim that sitting parties act as a cartel. If existing parties coordinate without restriction, their aggregate resources could dwarf the citizen initiative, creating the exact inequality Rousseau warns against where "there are no longer as many votes as there are men, but only as many as there are associations." The middle course mitigates this by aggregating interests into umbrella organisations and equalising their voice, ensuring the referendum reflects the will of the electorate rather than the wealth of the establishment.

  **4. Legal and Proportionality Constraints**

  We must also weigh the Constitutional Court's holding that restrictions on campaigning must be proportionate and that political parties enjoy protected expression. The closed model constitutes a severe restriction on associative freedom, prohibiting parties and unions from communicating their views collectively. Given that the Court protects political expression, a total ban on organised campaigning is likely disproportionate. The middle course represents a lesser restriction: it limits the *volume* of expression through caps but preserves the *right* to organise and speak. This balances the state's interest in a fair referendum with the constitutional rights of political actors.

  **5. The Strongest Argument Against the Middle Course**

  I must present the strongest argument against this recommendation fairly, particularly for the benefit of those Commissioners favouring the open or closed models. The principal objection to the middle course is that it creates an artificial parity that may distort the democratic process rather than purify it. By granting equal public funding and broadcast time to opposing umbrella organisations, the Commission may elevate fringe viewpoints to the same platform as broadly supported parties, thereby confusing the electorate rather than enlightening them.

  Furthermore, administrative equality does not guarantee substantive equality. Incumbent parties possess inherent advantages in name recognition and grassroots networks that cannot be neutralised by broadcast caps. Consequently, the middle course may create an illusion of fairness while failing to prevent the "cartel" dynamics the initiative seeks to expose. There is also a philosophical objection: Rousseau's ideal of citizens thinking "only his own thoughts" suggests that state-managed equalisation of factions still interferes with the natural formation of the General Will. By institutionalising factions through registered umbrella organisations, we may calcify divisions that would otherwise dissolve through individual deliberation. Finally, the administrative burden of defining eligible umbrella organisations invites litigation and delay, potentially jeopardising the referendum timeline.

  **6. Conclusion**

  Despite these risks, the middle course remains the most robust option. The closed model is legally vulnerable and practically information-poor; the open model risks structural dominance by established powers. The middle course, while imperfect, adheres to Rousseau's practical advice to multiply and equalise partial societies. It satisfies the Constitutional Court's proportionality test and ensures voters are adequately informed without being overwhelmed by unequal resources. I therefore urge the Commission to approve the middle course with the conditions specified in Section 1.

  **Chair**
  **Electoral Commission of the Republic**
