answer: |-
  **The Carrying Case: "The Trusted Critic"**
  Use a single scenario throughout: A friend whose taste aligns with yours urges you to see a specific, challenging film, verdicting it "profound and beautiful." You have not seen it.
  *   **Must Have:** An evaluative verdict ("profound"), not descriptive fact ("two hours long"). The testifier must be reliable.
  *   **Must Avoid:** Pure preference ("I liked it"), moral judgments ("it was virtuous"), or universal classics (*The Godfather*). The film must be such that seeing it matters.

  **Sequence and Misconception Management**

  1.  **Elicit Intuitions (10 mins):** Present the case. Ask: "Can you know the film is profound based solely on your friend's word?" Expect "No."
  2.  **Epistemological Contrast (10 mins):** Leverage their epistemology. Remind them they accept testimony for facts (e.g., "the restaurant is open"). Ask why aesthetic verdicts differ.
      *   *Head Off Misconception 1 ("Rotten Tomatoes"):* When a student claims aggregate reviews give knowledge, distinguish *statistical prediction* ("you will like it") from *aesthetic knowledge* ("it is good"). Testimony might predict pleasure, but does it transmit the justification for the verdict?
  3.  **Block Subjectivism (15 mins):** Students will argue, "Beauty is subjective, so there's nothing to know."
      *   *Head Off Misconception 2 ("Private Feeling"):* Intervene here, before discussing pessimism. Establish that aesthetic judgments claim correctness (you can be wrong about a poem), unlike ice cream preferences. If judgments are merely subjective, testimony isn't problematic—it's irrelevant. The debate requires aesthetic value to be judgment-apt.
  4.  **The Acquaintance Principle (15 mins):** Define the principle: First-hand experience is constitutive of aesthetic judgment, not just evidence. Explain that this is why testimony fails even if the testifier is reliable.
  5.  **Pessimism vs. Optimism (15 mins):** Now frame the debate. Pessimists: Testimony never yields aesthetic knowledge (violates Acquaintance). Optimists: It can, but the knowledge is second-hand/defective.

  **Final Check Exercise**
  Present two statements:
  1.  "I cannot judge this painting because I haven't seen it."
  2.  "I cannot judge this painting because beauty is only in my mind."
  Ask: "Which statement reflects the Acquaintance Principle and which reflects Subjectivism? Why does Statement 1 allow that the painting might objectively be beautiful, while Statement 2 denies it?"
  *Success Criterion:* They must identify that Statement 1 respects the object's value but demands access, whereas Statement 2 dissolves the object's value into feeling.

  **What to Leave Out**
  *   **Historical Specifics:** Do not teach Kant or Hume directly; use their ideas (normativity, acquaintance) without the baggage.
  *   **Meta-ethics:** Avoid deep dives into realism vs. anti-realism beyond the minimal requirement for judgment-aptitude.
  *   **Alternative Principles:** Ignore moral testimony or religious testimony comparisons unless raised by students; keep focus strictly on aesthetics.
  *   **Solutions:** Do not resolve the debate. The goal is understanding the tension, not solving it.
