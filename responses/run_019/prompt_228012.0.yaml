prompt: |-
  Two philosophers of physics in my department — a psi-ontic realist who holds that the quantum state represents physical reality, and a psi-epistemic theorist who holds that it represents an agent's information or degrees of belief about an underlying ontic state — have been arguing past each other for years, mostly trading slogans ("collapse is physical!" vs. "collapse is just updating!"). Draft the joint statement they should produce if forced into an adversarial collaboration.

  The statement should include: (1) a section of claims both can sign — about what the formalism of quantum mechanics does and does not settle, what the PBR theorem and related no-go results actually assume (e.g., preparation independence) and therefore do and do not rule out, and why the existence of the quantum Bayesian or statistical-interpretation traditions does not by itself refute psi-ontology; (2) a section stating the residual disagreements in wording each party would accept for its own position — including whether the wavefunction's apparent collapse and the exponential growth of entangled states are problems for the epistemic view, and whether interference phenomena and the impossibility of distinguishing non-orthogonal states are problems for the ontic view; (3) a list of cruxes — sub-questions such that settling them would move at least one side — and for each crux, an argument, thought experiment, or conceivable empirical or formal result that both agree bears on it, with each side's prediction or concession recorded in advance. If part of their dispute turns out to be verbal (for instance, disagreement over what "represents reality" requires), the statement should say so explicitly and identify which part.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Characters:** Two philosophers of physics (Psi-Ontic Realist vs. Psi-Epistemic Theorist).
      *   **Context:** Years of arguing past each other, trading slogans. Forced into "adversarial collaboration."
      *   **Task:** Draft a joint statement.
      *   **Required Components:**
          1.  *Common Ground:* Claims both can sign (formalism limits, PBR assumptions/implications, validity of traditions).
          2.  *Residual Disagreements:* Wording each accepts for their own position (collapse, entanglement growth vs. interference, non-orthogonal state discrimination).
          3.  *Cruxes:* Sub-questions where settlement moves the needle, including specific arguments/tests and pre-recorded predictions/concessions.
          4.  *Verbal Disputes:* Explicitly identify if any part is merely semantic (e.g., definition of "reality").

  2.  **Deconstruct the Positions:**
      *   **Psi-Ontic:** The wavefunction ($\psi$) is a real physical object/field/state. Collapse (if it happens) is a physical process. (Examples: Many-Worlds, GRW, Bohmian Mechanics).
      *   **Psi-Epistemic:** $\psi$ represents knowledge, belief, or information about an underlying reality (ontic state $\lambda$). Collapse is Bayesian updating. (Examples: QBism, Copenhagen-ish, Spekkens' toy model).
      *   **Key Tensions:** PBR Theorem, Exponential Hilbert Space, Measurement Problem, Non-orthogonality.

  3.  **Drafting - Section 1: Common Ground (The "Peace Treaty"):**
      *   *Goal:* Stop the slogan trading. Acknowledge what QM formalism actually says.
      *   *Formalism:* QM predicts probabilities via Born Rule. It doesn't explicitly dictate ontology.
      *   *PBR Theorem:* It's crucial to get this right. PBR rules out *strict* psi-epistemic models *under specific assumptions* (Preparation Independence). It doesn't rule out *all* epistemic views (e.g., those denying preparation independence or retrocausal ones).
      *   *Traditions:* Just because Copenhagen exists doesn't mean Ontic is wrong. Just because Many-Worlds exists doesn't mean Epistemic is wrong. Both are consistent with the math.
      *   *Tone:* Academic, precise, conciliatory but firm on facts.

  4.  **Drafting - Section 2: Residual Disagreements (The "Battle Lines"):**
      *   *Goal:* State the disagreement clearly without caricature.
      *   *Epistemic Concerns:* How to explain the *exponentiality* of the state space with limited underlying reality? How to explain *collapse* without physical mechanism (is updating enough)?
      *   *Ontic Concerns:* How to explain *interference* if $\psi$ is just knowledge? Why can't we distinguish non-orthogonal states if they are distinct physical states? (Wait, onticists say they *are* distinct physical states, epistemicists say they overlap in $\lambda$-space).
      *   *Correction:* Let's refine.
          *   *Epistemic Challenge:* The "excess baggage" problem. If $\psi$ is knowledge, what is the ontology? Why does the knowledge evolve via Schrödinger's equation (which looks physical)?
          *   *Ontic Challenge:* The "measurement problem." If $\psi$ is real, why do we see definite outcomes? (Requires MWI or Collapse). Also, why does nature hide the full state (no-cloning, non-orthogonality)?
      *   *Wording:* Needs to be "I believe X, my colleague believes Y" format.

  5.  **Drafting - Section 3: Cruxes (The "Adversarial Core"):**
      *   *Goal:* Identify specific points where new info would change minds.
      *   *Crux 1: Preparation Independence (PBR).*
          *   *Test:* Can we conceive a model violating PI that is plausible?
          *   *Onticist:* If PI is violated naturally, I concede PBR doesn't force ontology.
          *   *Epistemicist:* If PI holds fundamentally, I concede strict epistemic views are untenable.
      *   *Crux 2: The Ontological Status of the Configuration Space.*
          *   *Issue:* $\psi$ lives in 3N dimensions. Is that real?
          *   *Onticist:* Yes (or it's a projection of something real).
          *   *Epistemicist:* No, it's a state of knowledge about 3D particles.
          *   *Test:* A derivation of QM from purely 3D ontic principles without invoking Hilbert space axioms.
      *   *Crux 3: Retrocausality.*
          *   *Issue:* Often the escape hatch for epistemic views.
          *   *Test:* A time-symmetric model that recovers QM.
      *   *Verbal Dispute:* The definition of "Real." Does "real" mean "causally efficacious" or "mind-independent"?

  6.  **Refining and Polishing:**
      *   *Voice:* Needs to sound like two philosophers who are tired but rigorous. Use terms like "ontic state," "preparation independence," "Born rule."
      *   *Formatting:* Use clear headings.
      *   *Check Constraints:* Did I cover PBR assumptions? Yes. Did I cover exponential growth vs. interference? Yes. Did I identify verbal disputes? Yes.
      *   *Self-Correction on PBR:* Ensure I don't say PBR rules out *all* epistemic models. It rules out *psi-epistemic models satisfying preparation independence*. This is a key nuance for the "Common Ground."
      *   *Self-Correction on "Collapse":* Onticists might be MWI (no collapse) or GRW (physical collapse). Epistemicists say "updating." Need to allow for MWI in the Ontic camp.
      *   *Tone Check:* Avoid making one side look stupid. Both positions are defensible.

  7.  **Final Review against Prompt:**
      *   (1) Common ground on formalism, PBR, traditions? Included.
      *   (2) Residual disagreements on collapse, entanglement, interference? Included.
      *   (3) Cruxes with arguments/predictions? Included.
      *   (4) Verbal dispute identification? Included.

  8.  **Final Polish:** (Writing the text with appropriate academic gravitas). *Make sure the "Adversarial Collaboration" spirit shines through—acknowledging that they still disagree, but now they disagree precisely.*

  *(Self-Correction during drafting)*: I need to make sure the "Cruxes" section isn't just "we will do an experiment." Since this is foundations of QM, experiments are hard. The "conceivable empirical or formal result" needs to be specific. For example, a reconstruction of QM from information-theoretic axioms vs. dynamical axioms.

