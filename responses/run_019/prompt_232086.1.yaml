      *   *The "Honesty" Claim:* Is admitting duty more honest than admitting conscience? Or is "just following orders" the ultimate self-deception (Arendt's Banality of Evil)?
      *   *Empirical vs. Normative:* The user mixes "how people behave" (empirical) with "what morality demands" (normative). These need separating.

  4.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the distinction (Kantian vs. Pragmatist/Transcendentalist).
