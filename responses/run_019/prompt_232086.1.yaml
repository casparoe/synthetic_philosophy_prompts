      *   **Goal:** Stress-test the view. Identify what would genuinely count against it (falsification conditions), distinguish empirical vs. normative claims, acknowledge costs of the German view and benefits of the American view, and evaluate the epistemic status of the claim (is it insulated from evidence?).
      *   **Tone:** Intellectual, respectful, rigorous, nuanced, avoiding stereotypes while engaging with the cultural generalizations provided.

  2.  **Deconstruct the Thesis:**
      *   *German Idiom:* Deontological, duty-based, systemic trust, order as a moral good, suspicion of exceptions. (Kantian echoes).
      *   *American Idiom:* Consequentialist/Intuitionist, individual agency, moral heroism, suspicion of bureaucracy, civil disobedience as virtue. (Emerson/Thoreau echoes).
      *   *Claim:* German is more honest about moral demands + produces more reliable decent behavior. American flatters vanity + allows self-deception.

  3.  **Brainstorming Counter-Arguments & Stress Tests:**

