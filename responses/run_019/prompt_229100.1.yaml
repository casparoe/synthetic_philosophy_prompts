  **1. Setting up the cases**

  1. Let's start with pain asymbolia. These patients report the sensory quality of pain remains intact—they can locate it and rate intensity—but the suffering component vanishes. They don't avoid it. Do you maintain that this pain is still bad for them, despite their indifference, or does the badness vanish with the suffering?
  *Follow-up:* If you say yes, are you claiming they are mistaken about their own welfare, or that welfare exists independently of their concern? How do you know?

  2. Consider the morphine case: patients often say the pain feels the same but they no longer care about it. Is the badness located in the sensory qualia itself, or does the drug remove the badness while leaving the sensation intact?
  *Follow-up:* If the qualia are identical but the badness differs, doesn't that suggest badness isn't intrinsic to the feel?

  3. So, on your view, is the badness a non-instrumental property of the phenomenal character, distinct from any conative attitude like dislike or desire for cessation? Please be precise.
  *Follow-up:* If it's distinct, what picks it out phenomenologically besides the very aversion you're trying to separate it from? Can you point to it?

  **2. The squeeze**

  4. In normal experience, phenomenal badness and aversion are perfectly correlated. We never feel pain as bad without disliking it. Given Occam's razor and standard methodological constraints, what non-question-begging evidence do you have that the badness isn't just the aversion itself? Is there any phenomenological residue?
  *Follow-up:* If the correlation is perfect in normal cases, isn't positing a separate property ontologically gratuitous and empirically undetectable? You risk multiplying entities beyond necessity without explanatory gain, which violates standard methodological constraints in philosophy of mind.

  5. Back to asymbolia: if the pain is bad but they don't mind, are these patients making a prudential error by not avoiding the stimulus? If welfare is subjective, how can they be wrong about their own good?
  *Follow-up:* If they aren't erring because they lack the concept of badness, how do you know the badness is still there rather than gone? Your evidence seems circular, relying on the very intuition being challenged by the case.

  6. If they are erring, what specific value are they failing to respond to? Is it a rational requirement to avoid something that doesn't bother you in the slightest? Explain the normativity.
  *Follow-up:* This sounds like you're demanding they respect a value they cannot phenomenally access, which violates internalist constraints on reasons. It makes rationality opaque to the agent acting within their own mind.

  7. Imagine a subject stuck in extreme agony who sincerely reports minding it not at all, perhaps due to a specific lesion. On your view, is their life going just as badly as someone who is suffering? Does the badness persist without the suffering?
  *Follow-up:* If you bite this bullet, aren't you severing the link between badness and any possible subjective complaint, making welfare entirely third-personal? That contradicts the subjectivist intuition that usually drives phenomenalism in the first place.

  8. Is there any intensity level where, if aversion is zero, the badness disappears? Or does the badness scale purely with sensory intensity regardless of care, rendering motivation irrelevant to value?
  *Follow-up:* If it scales with intensity alone, then badness is causally inert regarding motivation, which seems odd for a value property guiding action. Why call it bad if it doesn't recommend avoidance to the subject? It becomes a ghost property.

  **3. What would change your mind**

  Lastly, we explore falsification and methodology.

  9. What would a genuine counter-example look like for you? Describe a specific case where the feel is painful but you would concede it isn't bad for the subject. What would change your mind? Is there any conceivable scenario?
  *Follow-up:* If no such case is conceivable, is your view protected from falsification by definition, rendering it dogmatic and untestable? Are you immune to evidence? Does this reduce to linguistic stipulation?

  10. Finally, is this debate even empirical? Or are both sides just digging in on competing intuitions about the word "bad" without hope of resolution? Is progress possible? Or are we stuck?
  *Follow-up:* If it's purely intuitive, why should we prefer your intuition over the pragmatist's who ties badness directly to desire? What makes yours authoritative? Is there a fact of the matter?
