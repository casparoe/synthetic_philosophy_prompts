prompt: |-
  I sit on my university's academic integrity board, and we're redoing how we handle first-offense plagiarism. The current system: a student found responsible gets a zero on the assignment and a private notation, and the case never goes public — the implicit theory being that guilt is the right lever, you did a bad thing, you feel it in private, you correct. The dean is now proposing a public integrity registry instead: names of students found responsible would be posted on a university page for a full academic year. Her pitch is that private guilt is cheap and evaporates, while public shame is what actually deters and tells the community the standards are serious. Half the board thinks this is cruel, archaic, and psychologically dangerous; the other half thinks the current system just lets cheaters off with a bad feeling and a confidential note. Please draft the short written memo I can circulate before our commitee vote: recommend a concrete policy — adopt, reject, or adopt with conditions — give the actionable bottom line, and deal honestly with the strongest argument for the side you do not take. Also address the question that keeps coming up underneath the fight: can an institution just choose to run on guilt or on shame as its governing moral emotion, or is that the sort of thing set by the surrounding culture so that a committee's choice is partly a fantasy?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's academic integrity board.
      *   **Task:** Draft a short written memo to circulate before a committee vote.
      *   **Context:** Redoing how first-offense plagiarism is handled.
      *   **Current System:** Zero on assignment + private notation (Guilt-based).
      *   **Proposed System:** Public integrity registry for one year (Shame-based).
      *   **Conflict:** Half the board thinks the new system is cruel/archaic; the other half thinks the current system is too soft/ineffective.
      *   **Requirements:**
          1.  Recommend a concrete policy (Adopt, Reject, or Adopt with Conditions).
          2.  Give an actionable bottom line.
          3.  Deal honestly with the strongest argument for the opposing side.
          4.  Address the underlying philosophical question: Can an institution choose its governing moral emotion (guilt vs. shame), or is that dictated by culture?

  2.  **Determine the Stance:**
      *   *Option A (Support Public Registry):* Hard to justify ethically in a modern educational context. Public shaming often leads to defensiveness rather than reform, creates legal liabilities, and disproportionately harms vulnerable students.
      *   *Option B (Support Current System):* Safe, but acknowledges the Dean's point that it might be too invisible to deter.
      *   *Option C (Reject Registry, Strengthen Current System):* This seems the most balanced and educationally sound approach. It rejects the harmful public shaming but acknowledges the need for stronger accountability than just a "private feeling."
      *   *Decision:* Recommend **Rejecting the Public Registry** but **Modifying the Current System** to increase accountability without public humiliation. (Essentially: Reject the Dean's proposal, Adopt a "Third Way").

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the gravity of the decision.
      *   **Recommendation (Bottom Line):** Be direct. Reject the public registry. Propose a specific alternative.
      *   **Addressing the Opposing Argument (The Dean's Point):** The strongest argument for the registry is *deterrence* and *community signaling*. Private penalties are invisible. I need to validate this concern without accepting the solution.
      *   **The Philosophical Question (Guilt vs. Shame):** This is the tricky part. Can an institution choose?
          *   *Analysis:* Guilt is internal (I did bad). Shame is external (I am bad). Educational institutions generally aim for growth (guilt/remediation) rather than ostracization (shame). However, culture matters. If the student culture views cheating as "no big deal," guilt won't work. But institutional shame (public listing) often backfires, creating an "us vs. them" mentality.
          *   *Conclusion:* Institutions can't simply flip a switch on moral emotions, but they *can* choose mechanisms that align with their educational mission. Shame is generally counter-productive to learning.
      *   **The Concrete Proposal:** What replaces the registry?
          *   Keep the zero.
          *   Keep the private record (for repeat offenders).
          *   *Add:* Mandatory integrity workshop, reflective essay, or probation. Make the consequence *effortful* rather than just *painful*.
      *   **Closing:** Call to action for the vote.

  4.  **Refining the Tone:**
      *   Needs to be professional, diplomatic, but firm.
      *   Avoid emotional language ("cruel," "archaic") even if the prompt mentions them. Use policy language ("counter-productive," "disproportionate," "educational mission").
      *   Ensure the philosophical point doesn't sound like a lecture but rather a practical constraint.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey everyone, vote no on the public list. It's too risky.
      *   Dean says private stuff doesn't work. She's right that we need deterrence.
      *   But shaming kids ruins them.
      *   Also, can we even choose guilt vs shame? Maybe not entirely, but we shouldn't try to be the shame police.
      *   Let's do a workshop instead.
      *   Vote: Reject registry, add workshop.

  6.  **Drafting - Iteration 2 (Adding Nuance & Policy Language):**
      *   *Subject:* Recommendation on First-Offense Plagiarism Protocol.
      *   *Recommendation:* Reject the Public Integrity Registry. Adopt a "Restorative Accountability" model.
      *   *Opposing View:* The Dean is right that invisible sanctions look like impunity. We need to signal seriousness.
      *   *Philosophical Point:* We can't just decide to run on shame. Shame drives behavior underground. Guilt allows for repair. We are a school, not a court.
      *   *Action:* Zero grade + Mandatory Workshop + Probationary status (private but serious).

  7.  **Final Polish (Checking against constraints):**
      *   *Concrete policy?* Yes (Reject Registry, Add Workshop).
      *   *Actionable bottom line?* Yes (Vote against Proposal A, Vote for Amendment B).
      *   *Strongest opposing argument?* Yes (Visibility/Deterrence).
      *   *Guilt vs. Shame question?* Yes (Addressed as institutional mission vs. cultural reality).

  8.  **Final Review of the "Guilt vs. Shame" section:**
      *   Need to be careful here. The prompt asks to address "can an institution just choose... or is that... set by surrounding culture."
      *   *Answer:* It's not a binary switch. Institutions shape culture, but they are also bound by it. Relying on shame assumes a culture where reputation is the highest currency. In a diverse modern university, shame often leads to disengagement, not reform. Therefore, choosing shame is not just a policy choice, it's a cultural gamble that usually fails in an educational setting.

  9.  **Finalizing the Text:** (Proceeding to generate the memo based on these thoughts.)
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm ignoring the cheating problem. Emphasize that the *current* system also needs a tweak, not just a defense of the status quo. The Dean's frustration is valid, even if her solution is wrong.

  10. **Final Polish:** Check word count and tone. Ensure it sounds like a colleague speaking to colleagues. (The resulting memo below follows this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name/Position]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposed Public Integrity Registry

  **Bottom Line Recommendation**
  I recommend we **reject** the proposal to implement a Public Integrity Registry. Instead, I move we **adopt with conditions** a modified sanctioning model: maintain the private record for first offenses but replace the passive "private notation" with mandatory, effort-intensive restorative measures (e.g., a graded integrity workshop and a reflective case analysis).

  **The Core Conflict: Visibility vs. Rehabilitation**
  We must deal honestly with the Dean's primary argument: *Invisibility looks like impunity.* The strongest case for the public registry is that our current system lacks teeth because the consequences are unseen. If the community believes cheating carries no social or reputational cost, the normative power of the honor code erodes. The Dean is correct that a sanction known only to the student and a few administrators fails to signal the seriousness of the violation to the broader student body. Deterrence requires visibility.

  However, visibility does not require public identification. We can signal seriousness through the *rigor* of the sanction rather than the *exposure* of the name.

  **The Governing Moral Emotion: Guilt, Shame, and Institutional Capacity**
  A question underpinning this debate is whether an institution can simply choose to run on guilt (internal remorse) or shame (external reputation). The answer is nuanced: **An institution cannot dictate the moral emotions of its culture, but it can choose which emotions its mechanisms weaponize.**

  While the surrounding student culture influences how penalties are perceived, the university actively shapes that culture through policy. If we choose shame (public registry), we align ourselves with a punitive model that assumes ostracization drives reform. Research in behavioral psychology and education suggests otherwise: shame tends to drive behavior underground, increases defensiveness, and disproportionately harms students from marginalized backgrounds who lack the social capital to weather public stigma.

  Guilt, conversely, focuses on the *act* rather than the *actor*. It allows for repair. As an educational institution, our leverage is not social exile, but the withholding and granting of credentials. We should not attempt to engineer a culture of shame to solve a compliance problem; doing so treats students as risks to be managed rather than learners to be corrected. We cannot fantasy our way into a culture where public shaming produces virtue; in a modern, diverse university, it typically produces resentment and litigation.

  **Proposed Policy: Restorative Accountability**
  To address the Dean's valid concern regarding deterrence without resorting to public shaming, I propose the following "Restorative Accountability" protocol for first offenses:

  1.  **Grade Penalty:** Zero on the assignment (maintain current).
  2.  **Private Record:** Notation remains internal but is flagged for any future violations (maintain current).
  3.  **Mandatory Remediation (New):** The student must complete a 4-hour academic integrity workshop and submit a 5-page reflective analysis on the ethical implications of their specific violation. This makes the consequence *effortful* and *time-consuming*, increasing the "cost" of cheating without making it public.
  4.  **Probationary Status:** A formal letter of probation is placed in the student's file, noting that a second offense will result in suspension. This raises the stakes without burning the bridge.

  **Action Item**
  At the upcoming vote, I ask the board to:
  1.  Vote **NO** on the Public Integrity Registry.
  2.  Vote **YES** on the "Restorative Accountability" amendment outlined above.

  This approach preserves the student's dignity while ensuring the consequence is substantial enough to be felt, remembered, and respected.

  [Your Signature]
