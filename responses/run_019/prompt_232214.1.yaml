  Your reductio ad absurdum is a standard and powerful critique of Milton Friedman's instrumentalism. The exit lies in rejecting **Premise (1)**.

  Premise (1) looked natural because successful science *does* often use simplifications. Newtonian physics assumes frictionless vacuums; economics assumes hyper-rational agents. These are strictly false, yet the models work. It's tempting to conclude truth doesn't matter, only output. Friedman argued exactly this: theories are tools for prediction, not photographic reproductions of reality. He was defending economics against critics who demanded psychological realism, arguing that demanding true assumptions leads to paralysis.

  However, Premise (1) conflates *prediction* with *explanation*. If science were merely accurate prediction, a massive lookup table of past events would be "better science" than a theory of gravity. We reject this because science aims to identify causal mechanisms, not just correlations.

  **Way Out 1: Reject (1) for Realism.**
  Assert that assumptions must be approximately true or causally plausible.
  *   **Why:** It blocks the astrology case. Astrology lacks a mechanism; economics (ideally) relies on incentives and constraints.
  *   **The Cost:** You invalidate many useful economic models. If "rational agent" assumptions are too false, huge swathes of microeconomics become "pseudoscience" by your definition. You also face the hard task of defining how "realistic" is realistic enough. Is assuming perfect competition realistic enough? Who decides?

  **Way Out 2: Accept (6) is Wrong (The Pragmatist Bullet).**
  Argue that if astrology *actually* predicted accidents reliably (Premise 4), it *would* count as empirical science, regardless of the mystical explanation.
  *   **Why:** History shows weird correlations often precede theory. If the data holds, the phenomenon is real, even if "Mercury" isn't the cause. There might be a confounding variable (e.g., weather patterns correlated with orbits).
  *   **The Cost:** It feels deeply counterintuitive. It risks validating luck or spurious correlations as scientific law until they break. It separates the "what" from the "why" too sharply.

  **Way Out 3: Refine (1) to Require Robustness.**
  Modify the claim: Good models predict well *across new contexts* because their assumptions capture underlying structures, not just surface patterns.
  *   **Why:** Astrology usually fails out-of-sample because it fits noise. Economics aims for structural stability (Lucas Critique).
  *   **The Cost:** You can't judge the model solely on predictions anymore; you have to judge the stability of the assumptions, which brings you back to worrying about realism. You need a theory of why the assumptions hold.

  **Recommendation:**
  Reject Premise (1). Friedman's view is a useful heuristic for model-building, not a definition of science. Science requires both predictive success and plausible mechanisms. Your friend is right that assumptions can be simplified, but wrong that they can be *arbitrarily* false. The distinction lies in whether the false assumption is a useful approximation (frictionless plane) or a causal dead-end (planetary influence). Assumptions matter because they tell you when the model will break. Astrology breaks everywhere; economics hopes to break only at the edges.
