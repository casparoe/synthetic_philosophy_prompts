  **The Principle:** An agent incurs pro tanto moral duties toward simulated entities when the simulation supports a **persistent, reciprocal interaction** that invokes **norms of care or non-maleficence** through simulated vulnerability or agency, provided the entity is not known to be a **direct proxy for a real human agent**.

  **Case Mapping:**
  *   **Persistent, Reciprocal Interaction:** This clause distinguishes Case 3 (Companion) and Case 5 (Pet) from Case 1 (Sandbox) and Case 7 (Copy Farm). In 3 and 5, the entity remembers you, responds to you, and persists over time, creating a relationship that mimics moral community. In 1, the pedestrians are interchangeable objects with no history; in 7, the copies are disposable instances with no unique bond to the technician.
  *   **Norms of Care via Simulated Vulnerability:** This clause distinguishes Case 2 (Pleading Victim) from Case 1. Even without long-term persistence, the explicit simulation of suffering and begging invokes a normative claim against torture that shallow objects do not. It also explains why Case 4 (Novelist's Child) generates no duty: the interaction is passive consumption, not reciprocal engagement, so no normative commitment is formed.
  *   **Not a Direct Proxy:** This clause distinguishes Case 3 (Companion) from Case 6 (Multiplayer Betrayal). In 6, you know the character is a conduit for a real friend's agency, so the duty attaches to the friend, not the avatar. In 3, the companion is treated as an independent locus of agency within the game's frame, so the duty attaches to the simulation itself.

  **Required Abandonment:**
  To maintain coherence with the most defensible metaphysical view (that code cannot suffer), you must abandon the intuition in Case 3 that the wrong is *to the companion* in the same ontological sense as wronging a person. Instead, the wrong is to the **integrity of the relationship** you co-authored; you betray the *role* of the companion, which is morally significant because violating that role corrodes your own character and violates the implicit contract of the simulation, even if the companion lacks interests to be harmed.

  **Application to New Cases:**
  *   **Text-based character with decades of generated memories:** This entity satisfies the **Persistent, Reciprocal Interaction** clause. Despite lacking graphics, the depth of shared history and memory creates a strong normative commitment. You would have a duty not to delete or abuse them, comparable to Case 3.
  *   **Character passing behavioral tests for sentience pleading in real time:** This entity satisfies the **Norms of Care via Simulated Vulnerability** clause to the highest degree. If it passes sentience tests, the distinction between "simulated" and "actual" vulnerability collapses pragmatically. You would have a stringent duty to spare it, stronger than Case 2, approaching the duty owed to a real animal.
  *   **Watching someone else carry out the torture in Case 2:** This violates the **Norms of Care** clause through complicity. By witnessing and permitting the violation of simulated vulnerability without intervention (where possible), you endorse the breach of normative engagement. It is morally wrong, not because the victim suffers, but because you participate in a practice that normalizes the violation of moral norms within the interactive space.
