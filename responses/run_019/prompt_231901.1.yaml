answer: |-
  ## Instructor Guide: Logical Space & Construction Notes

  **The Logical Space**
  To sort students into the five target positions, we navigate four binary dimensions. Not all combinations are occupied.

  1.  **Is Demarcation a Meaningful Project?**
      *   *No:* **Laudan** (Demarcation is a pseudo-problem; focus on reliability).
      *   *Yes:* Proceed to Q2.
  2.  **Is the Criterion Timeless/Logical or Historical/Contextual?**
      *   *Historical:* **Kuhn** (Science is defined by paradigms/communities at time *t*).
      *   *Timeless:* Proceed to Q3 (Popper/Lakatos).
  3.  **What is the Unit of Appraisal?**
      *   *Single Hypothesis/Statement:* **Popper** (Naive or Sophisticated).
      *   *Research Programme (Series of theories over time):* **Lakatos**.
  4.  **What is the Status of *Ad Hoc* Saves?**
      *   *Fatal/Suspicious:* **Naive Falsificationism**.
      *   *Permissible (if independently testable/progressive):* **Sophisticated Falsificationism**.

  **Empty Leaves (Unoccupied Positions)**
  *   **Demarcation = Meaningless + Criterion = Timeless:** *Incoherent.* If the line isn't meaningful, you cannot propose a timeless criterion for drawing it.
  *   **Demarcation = Meaningful + Criterion = Historical + Unit = Single Hypothesis:** *Unattractive/Underexplored.* Historical turns (Kuhn) almost always shift the unit of analysis from single statements to paradigms or communities. A single hypothesis lacks the temporal thickness to be judged "historically."

  **Indistinguishable Leaves**
  *   **Sophisticated Falsificationism vs. Lakatosian Programmes:** In practice, these are difficult to separate with short cases. Both permit *ad hoc* adjustments. Popper requires the adjustment be *independently testable*; Lakatos requires the *sequence* of theories to be theoretically/empirically progressive. String Theory (Q4) is the best wedge, but students may reasonably land on either.

  ***

  ## Student Handout: Which Demarcationist Are You?

  **Instructions:** Read the eight scenarios below. For each, select the **one** response that best matches your intuition. There are no right or wrong answers—this maps your philosophical instincts. Keep track of which letter (A, B, C, D, or E) you choose most often.

  **1. The Goal of the Line**
  Why do philosophers try to draw a line between "science" and "non-science"?
  *   **A.** We shouldn't. The label "science" is honorific and politically charged; we should just ask if a claim is *reliable*, not what box it's in.
  *   **B.** To identify which community holds the authority to solve puzzles at a given time.
  *   **C.** To separate theories that can be falsified from those that cannot.
  *   **D.** To distinguish research programmes that are progressing from those that are degenerating.
  *   **E.** To protect science from metaphysical contamination.

  **2. The Cold Fusion Episode (1989)**
  Fleischmann and Pons claim to achieve nuclear fusion at room temperature. Within months, dozens of labs fail to replicate the heat signature. What is the verdict?
  *   **A.** Verdicts are premature; we need to see how the community organizes around this anomaly over the next decade.
  *   **B.** The claim is falsified. A central prediction failed replication; the hypothesis is dead.
  *   **C.** The *research programme* is degenerating. They are adding excuses (instrument error, bubbles) without predicting new facts.
  *   **D.** It depends on whether they propose a new, testable reason for the non-replication.
  *   **E.** The label "fusion" is unhelpful; just assess the reliability of their calorimetry.

  **3. The Neptune Save (1846)**
  Uranus orbits don't match Newton's laws. Instead of dumping Newton, astronomers propose an unseen planet (Neptune) is pulling it. Is this "cheating"?
  *   **A.** It's normal puzzle-solving within the Newtonian paradigm.
  *   **B.** Yes. You are making the theory unfalsifiable by adding a convenient excuse.
  *   **C.** No, because the "excuse" (Neptune) is independently testable (you can look for it).
  *   **D.** It's acceptable if this save leads to new discoveries later (a progressive problem-shift).
  *   **E.** Whether it's cheating doesn't matter; did the math work?

  **4. The String Theory Impasse**
  String theory has been the dominant framework in high-energy physics for 40 years, yet it has produced no empirically testable predictions. Is it science?
  *   **A.** It is a "metaphysical research programme." It might become science if it becomes testable, but right now it is not.
  *   **B.** Yes, because it is generating rich theoretical mathematics and unifying problems (theoretical progress), even without data yet.
  *   **C.** The question is wrong. It is a tool used by a specific community of physicists; its status depends on their consensus.
  *   **D.** We should stop asking if it's "science" and ask if it's producing reliable models for gravity.
  *   **E.** No. A theory that explains everything (every energy level) predicts nothing.

  **5. Freudian Psychoanalysis**
  Freud's theories can explain why a man loves his mother *and* why he hates her (repression). For a demarcationist, this is:
  *   **A.** A virtue. It shows the theory's power to solve puzzles about human behavior.
  *   **B.** A vice. A theory that is compatible with every possible state of affairs tells us nothing about the world.
  *   **C.** Irrelevant. Some parts of Freud are reliable, some aren't. The "science" label obscures this.
  *   **D.** Acceptable, provided the specific interpretation is testable in the clinic.
  *   **E.** A sign the programme is degenerating; it explains past data but predicts no new behaviors.

  **6. History and Status**
  Can a field be considered "science" in 1850 but "non-science" in 2025 (or vice versa), without the logic of the field changing?
  *   **A.** Yes. Science is defined by the organization of the community, which changes historically.
  *   **B.** No. If it is science, it is science timelessly. The logic of justification doesn't change.
  *   **C.** Yes. A research programme can shift from progressive to degenerating over time.
  *   **D.** No. Reliability is a feature of the method, not the era.
  *   **E.** Maybe, but the label is doing no work here.

  **7. The Unit of Failure**
  When experiments consistently go against a theory, what exactly has failed?
  *   **A.** The specific hypothesis currently being tested.
  *   **B.** The entire "hard core" of the research programme (eventually).
  *   **C.** The paradigm governing the community.
  *   **D.** The specific claim's reliability.
  *   **E.** The specific hypothesis, unless we can save it with a testable modification.

  **8. Astrology**
  Why is astrology generally excluded from science?
  *   **A.** Because astrologers do not form a community engaged in normal puzzle-solving.
  *   **B.** Because its claims are logically compatible with any observation (unfalsifiable).
  *   **C.** Because its research programme has been degenerating for centuries (no novel predictions).
  *   **D.** Because its claims are unreliable, regardless of the label.
  *   **E.** Because it violates the methodological rules of testing hypotheses.

  ***

  ## Scoring Key & Discussion Guide

  **Tally your answers.** Find the letter you selected most frequently.

  *   **Mostly A: The Kuhnian Historical View**
      *   *Core Commitment:* Science is defined by **paradigms and communities**, not timeless logic.
      *   *Demarcation:* Contextual. A field is science if a community is engaged in "normal science" (puzzle solving) under a shared paradigm.
      *   *Case Judgment:* Astrology is out because it lacks a paradigm community; String Theory is in because the community treats it as such.
      *   *Discussion Point:* Does this make science too sociological? If the community agrees on something wrong, is it still science?

  *   **Mostly B: Naive Falsificationism (Early Popper)**
      *   *Core Commitment:* Science is defined by **bold conjectures** that risk refutation.
      *   *Demarcation:* Timeless & Logical.
      *   *Unit:* Single Hypothesis.
      *   *Case Judgment:* Cold Fusion is dead immediately upon failed replication. *Ad hoc* saves (Neptune) are suspicious "conventionalist twists."
      *   *Discussion Point:* Is this how scientists actually behave? (Hint: No. They usually save the theory first).

  *   **Mostly C: Sophisticated Falsificationism (Late Popper)**
      *   *Core Commitment:* Science is defined by **testable content**.
      *   *Demarcation:* Timeless & Logical.
      *   *Unit:* Single Hypothesis (mostly).
      *   *Case Judgment:* *Ad hoc* saves are okay *if* the save is independently testable (like Neptune). String Theory is currently metaphysics because it lacks testability.
      *   *Discussion Point:* How does this differ from Lakatos? (Focus on the *testability of the save* vs. the *progress of the sequence*).

  *   **Mostly D: Lakatosian Research Programmes**
      *   *Core Commitment:* Science is defined by **progressive problem-shifts** over time.
      *   *Demarcation:* Timeless (methodologically) but applied diachronically.
      *   *Unit:* Research Programme (Hard Core + Protective Belt).
      *   *Case Judgment:* Failure attaches to the **programme**, not a single hypothesis. String Theory might be science if it shows *theoretical* progress. Cold Fusion is out because it's degenerating (all save, no prediction).
      *   *Discussion Point:* This cleans up the "failure attaches to single hypotheses" distinction. You can't kill a programme with one anomaly.

  *   **Mostly E: The Laudanian Position**
      *   *Core Commitment:* Demarcation is a **pseudo-problem**.
      *   *Demarcation:* Meaningless.
      *   *Unit:* Specific Claims/Methods.
      *   *Case Judgment:* Stop asking if Freud/Strings are "science." Ask if they are *reliable*. The label is used rhetorically to gain funding or status.
      *   *Discussion Point:* If we drop the demarcation criterion, how do we protect the public from pseudoscience? (Laudan says: by attacking the reliability of the claims, not the label).

  **Tie-Breaker: The "Sophisticated vs. Lakatos" Problem**
  If you scored equally on **C** and **D**, you have identified the hardest split in this logical space.
  *   **Choose C** if you think the *independent testability* of a specific modification is the key.
  *   **Choose D** if you think the *long-term trajectory* (predicting novel facts over decades) is the key.
  *   *Instructor Note:* These positions often converge in practice. The distinction is whether you judge the theory at time *t* (Popper) or the sequence T1...Tn (Lakatos).
