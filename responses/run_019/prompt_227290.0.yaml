answer: |-
  You have identified a genuine and persistent structural problem in historiography, and your intuition is correct: while the *phenomenon* is widely discussed, there is no single, canonical noun (comparable to "Whiggism" or "Presentism") that captures this specific mechanism of **polemical self-definition by a successor period that hardens into a neutral-seeming category.**

  In the absence of a universally standardized term, historians and theorists usually describe this using a cluster of concepts from *Begriffsgeschichte* (conceptual history) and critical periodization studies. Below, I will outline the existing theoretical frameworks that come closest, and then, per your request, propose a precise term with defined boundaries to capture the phenomenon you are describing.

  ### 1. The Existing Theoretical Neighborhood

  While no single word exists, three existing concepts map onto different parts of the pattern you identified:

  *   **Asymmetric Counterconcepts (Reinhart Koselleck):** In *Begriffsgeschichte*, Koselleck describes how political groups define themselves by creating negative concepts for their opponents (e.g., "Civilized" vs. "Barbarian," "Christian" vs. "Heathen"). When these are temporalized, they become **"Asymmetric Temporal Counterconcepts."** The "Middle Ages" functions as a temporal counterconcept to the "Renaissance." This captures the *polemical* and *constitutive* nature of the label, but Koselleck's framework does not fully address the *persistence* of the label after the polemic is debunked.
  *   **Zombie Categories (Ulrich Beck):** In sociology and historiography, a "zombie category" is a concept that is dead theoretically (scholars agree it no longer describes reality) but alive institutionally (it still structures funding, departments, and questions). This captures the *persistence* you noted (medievalists proving the ages weren't dark while still working within the "Middle Ages"), but it does not specify the *origin* of the category as a polemic.
  *   **Critical Periodization:** This is the subfield that studies these problems. Scholars like Jacques Le Goff (*The Birth of the Middle Ages*) and Kathleen Davis (*Periodization and Sovereignty*) analyze how period names are acts of power. However, this is a field name, not a name for the specific mechanism.

  ### 2. Proposed Term: "Constitutive Negation"

  Since no established term covers the full arc (polemical origin + successor naming + zombie persistence), I propose the term **Constitutive Negation** (specifically within the context of **Periodization**).

  **Definition:**
  > **Constitutive Negation** occurs when a historical period is named and defined by its immediate successor not for descriptive accuracy, but to establish the successor's own identity through contrast. The label encodes a negative value judgment (stagnation, darkness, superstition) that is logically necessary for the successor's narrative of rebirth or revolution. Crucially, the phenomenon includes the label's **institutional persistence** after the negative value judgment has been historically refuted, continuing to constrain the questions asked of the period.

  ### 3. The Carving: Boundaries of the Phenomenon

  To distinguish **Constitutive Negation** from ordinary period-naming or other historiographical biases, we must establish three boundary conditions.

  #### A. The Origin Boundary (Successor vs. Distant)
  *   **Constitutive Negation:** The label must originate with the **immediate successor** or the group claiming to be the successor.
      *   *Example:* "Middle Ages" (*media tempestas*) was coined by Petrarch and Bruni to distinguish their "New Age" from the "dark" interval. "Scientific Revolution" was packaged by those claiming the legacy of Newton to distinguish themselves from "Aristotelian" natural philosophy.
      *   *Exclusion:* Labels coined by distant future scholars for mere convenience do not count. If a 20th-century historian invents a term like "The Long Twelfth Century" to organize data, that is **Descriptive Periodization**, even if it implies continuity. It lacks the *identity-forming polemic* of the immediate successor.

  #### B. The Functional Boundary (Identity vs. Description)
  *   **Constitutive Negation:** The primary function of the label is **self-definition of the namer**, not description of the named. The "Dark Ages" were not named because they were empirically dark; they were named because the Renaissance *needed* darkness to make its "Light" visible.
      *   *Exclusion:* **Dynastic or Geographic Periodization** (e.g., "The Victorian Era," "The Carolingian Empire"). These are named after rulers or places. They may carry value judgments later, but the naming mechanism itself is not a polemic against the period.
      *   *Exclusion:* **Corrective Periodization** (e.g., "Late Antiquity"). This is a crucial boundary case. "Late Antiquity" was coined (by Marrou, Brown, et al.) specifically to *escape* the foil of the "Dark Ages." It is an attempt to *cure* Constitutive Negation, not an instance of it. It does not define itself by insulting the Middle Ages; it defines itself by rehabilitating the late Roman world.

  #### C. The Persistence Boundary (Zombie Status vs. Abandonment)
  *   **Constitutive Negation:** The label must survive the refutation of its original premise. If scholars reject the value judgment *and* discard the label, it was merely a **Failed Polemic**.
      *   *Example:* The term "Dark Ages" is currently fading from professional use (retreating to popular discourse). It is transitioning out of Constitutive Negation into **Historical Discard**.
      *   *Example:* "Middle Ages" (*Moyen Âge*) remains the standard institutional label despite universal scholarly agreement that the period was not a "middle" void. This is **Active Constitutive Negation**. The field is still organized around the "darkness" question (e.g., "Was there a 12th-century Renaissance?"), which is a question dictated by the foil.

  ### 4. How Scholars Handle the Persistence

  You asked how users of the term have handled the persistence of the label after the value judgment is abandoned. In the literature of Critical Periodization, there are three standard responses to **Constitutive Negation**:

  1.  **Rehabilitation (The "Yes, But" Strategy):** Scholars accept the label but invert the value. (e.g., "The Middle Ages were not dark; they were vibrant.")
      *   *Risk:* This keeps the terms of the debate set by the successor period. You are still arguing about "darkness," which validates the original foil.
  2.  **Abandonment (The "Late Antiquity" Solution):** Scholars attempt to coin a new, neutral term to replace the polemical one.
      *   *Risk:* As seen with "Late Antiquity," new terms often develop their own teleologies or simply shift the boundary of the "darkness" to a later date (e.g., the 8th century becomes the new break).
  3.  **Exposure (The Metahistorical Strategy):** Scholars like Kathleen Davis or Jacques Le Goff explicitly teach the history of the periodization itself. They treat the label "Middle Ages" not as a container of time, but as a primary source from the Renaissance.
      *   *Benefit:* This prevents the "Zombie" status from constraining inquiry. It turns the periodization into an object of study rather than a framework for study.

  ### Summary for Your Work

  If you need to cite this in your dissertation, you should state that while **Whig History** describes the *teleology*, and **Presentism** describes the *judgment*, neither captures the *structural dependency* of the period's identity on its successor's polemic.

  You can accurately describe this as **Constitutive Negation in Periodization**.

  *   **Use it when:** A period's name is a relic of a successor's self-mythologizing that continues to structure inquiry.
  *   **Do not use it when:** A period is named descriptively (dynastic, geographic) or when a label is coined retrospectively to *fix* a previous bias (e.g., Late Antiquity).

  This distinction allows you to critique the organization of your field without simply repeating the standard "Whig history" critique, acknowledging the specific mechanism by which the "Middle Ages" continues to haunt medieval studies.
