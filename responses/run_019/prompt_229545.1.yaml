answer: |-
  # The Side-Effect Effect Quiz: What's Your Intuition?

  Welcome to X-Phi Week! Below are eight short vignettes. In each, an agent knowingly brings about a side effect while pursuing a goal. Read each scenario and select the option that best matches your gut judgment.

  **The Options:**
  *   **A:** Yes, the agent did it intentionally / on purpose.
  *   **B:** No, it was merely a foreseen side effect.
  *   **C:** Unsure / It depends on how you define "purpose."

  ---

  ### 1. The Chairman (Harm)
  The VP tells the Chairman: "This new program will increase profits, but it will **slightly** harm the environment."
  The Chairman replies: "I don't care at all about harming the environment. I just want profit."
  They start the program. The environment is slightly harmed.
  **Did the Chairman intentionally harm the environment?**
  [ ] A [ ] B [ ] C

  ### 2. The Chairman (Help)
  The VP tells the Chairman: "This new program will increase profits, and it will **slightly** help the environment."
  The Chairman replies: "I don't care at all about helping the environment. I just want profit."
  They start the program. The environment is slightly helped.
  **Did the Chairman intentionally help the environment?**
  [ ] A [ ] B [ ] C

  ### 3. The Heavy Burden (Harm)
  A factory owner must run a machine to keep workers employed. The VP says: "Running this will cause **severe** pollution."
  The owner says: "I hate polluting. It breaks my heart. But if I don't run it, everyone starves."
  They run it. Severe pollution occurs.
  **Did the owner intentionally pollute?**
  [ ] A [ ] B [ ] C

  ### 4. The Heavy Burden (Help)
  A factory owner must run a machine to keep workers employed. The VP says: "Running this will cause **severe** cleaning of the local water supply."
  The owner says: "I hate spending resources on cleaning. It breaks my heart. But if I don't run it, everyone starves."
  They run it. Severe cleaning occurs.
  **Did the owner intentionally clean the water?**
  [ ] A [ ] B [ ] C

  ### 5. The Villain (Harm)
  A CEO launches a product. The VP says: "This will **slightly** harm a competitor."
  The CEO says: "Excellent. I love hurting them. That's exactly what I want."
  They launch. The competitor is slightly harmed.
  **Did the CEO intentionally harm the competitor?**
  [ ] A [ ] B [ ] C

  ### 6. The Philanthropist (Help)
  A CEO launches a product. The VP says: "This will **slightly** help a charity."
  The CEO says: "Excellent. I love helping them. That's exactly what I want."
  They launch. The charity is slightly helped.
  **Did the CEO intentionally help the charity?**
  [ ] A [ ] B [ ] C

  ### 7. The Reluctant Harmer
  A manager approves a schedule. The VP says: "This will **slightly** harm morale."
  The manager says: "I really regret that. I wish it didn't. But the schedule is easier for me."
  They approve. Morale is slightly harmed.
  **Did the manager intentionally harm morale?**
  [ ] A [ ] B [ ] C

  ### 8. The Reluctant Helper
  A manager approves a schedule. The VP says: "This will **severely** help morale."
  The manager says: "I don't care about morale. I just want the schedule."
  They approve. Morale is severely helped.
  **Did the manager intentionally help morale?**
  [ ] A [ ] B [ ] C

  ---

  ## Scoring Key: Which Theory Are You?

  Tally your **A (Yes, Intentional)** answers in the following groups.

  **Group 1: The Moral Asymmetry (Questions 1 & 2)**
  *   If you answered **A on Q1** (Harm) and **B on Q2** (Help): You show the classic **Knobe Effect**.
  *   *Theory:* **Moral Valence View.** You judge intentionality based on blame and praise. Bad side effects are "owned" by the agent; good ones are accidental bonuses.

  **Group 2: The Trade-Off Weight (Questions 1, 2, 3, 4, 8)**
  *   Compare Low Cost (Q1, Q2) vs. High Cost/Severity (Q3, Q4, Q8).
  *   If you answered **A mostly on High Cost** (3, 4, 8) and **B mostly on Low Cost** (1, 2):
  *   *Theory:* **Cost/Trade-Off View.** You judge intentionality based on how much the side effect weighed in the decision. If the effect was significant enough to be a "cost" in the calculus, it was intentional.

  **Group 3: The Deep Self (Questions 1, 5, 7)**
  *   Compare Attitudes: Indifferent (Q1) vs. Endorse (Q5) vs. Regret (Q7). All are Harm/Low Cost.
  *   If you answered **A on Endorse** (Q5), **A on Indifferent** (Q1), but **B on Regret** (Q7):
  *   *Theory:* **Deep-Self Concordance.** You judge intentionality based on whether the side effect aligns with the agent's values. If they regret it, it wasn't "really" them.

  **Group 4: The Deflationary View**
  *   If you answered **A on almost everything** OR **B on almost everything** (especially Q1 & Q2 being the same):
  *   *Theory:* **Deflationary / No Asymmetry.** You suspect the "effect" is a linguistic confusion. Either both are intentional (causal view) or neither is (strict purpose view), and the moral framing is a confound.

  ---

  ## Philosophical Fine Print: Limitations of this Quiz

  As any good experimental philosopher knows, disentangling these variables is notoriously messy. Here is where this quiz (and the field) faces friction:

  **1. Moral Valence vs. Deep Self**
  *   **The Problem:** These two are hard to separate because our "Deep Selves" are usually moral. In Q5 (Villain) and Q6 (Philanthropist), the agent *endorses* the outcome. Most people will say both are intentional.
  *   **The Confound:** If you say the Villain acted intentionally but the Reluctant Harmer (Q7) did not, is that because of **Deep Self** (values alignment) or **Moral Valence** (the Reluctant Harmer is less blameworthy)? This quiz cannot cleanly separate blame from identity concordance.

  **2. Trade-Off vs. Moral Valence**
  *   **The Problem:** "High Cost" side effects (Q3, Q4) are often morally weightier.
  *   **The Confound:** If you say the Heavy Burden Harmer (Q3) acted intentionally but the Chairman Harmer (Q1) did not, is it because the pollution was *severe* (Trade-Off View) or because severe pollution is *worse* and demands more blame (Moral Valence)? The "Cost" variable inevitably bleeds into moral severity.

  **3. The Deflationary Trap**
  *   **The Problem:** A consistent "Yes" or "No" across all questions looks like a Deflationary view, but it might just be a participant who uses language very strictly (e.g., "Intentional means it was the primary goal").
  *   **The Confound:** We cannot distinguish a philosophical deflationist from someone who simply ignores the vignette nuances.

  **Why include this?**
  Because x-phi isn't just about finding the "right" answer; it's about mapping the contours of our concepts. If your answers feel inconsistent, congratulations: you've just replicated the data that keeps philosophers of mind employed!
