answer: |-
  **Project Title:** Preserving Future Capacity: A Conceptual and Formal Investigation into Option-Based Impact Measures

  **Central Question and Scope**
  Current impact measures for advanced AI systems generally fall into two unsatisfactory categories: those that penalise large changes to the world state, and those that penalise deviations from a counterfactual baseline. The former risks obstructing useful change; the latter relies on baselines that are often underdetermined or perverse. This project proposes a third framing: understanding low impact as the preservation of people's future capacity to redirect the world among a coarse set of materially different possibilities. The central question is whether an option-preservation metric can provide a useful sufficient condition for low impact without requiring a complete specification of human values.

  To make this tractable within three months, the question is narrowed as follows: Can we construct a formal distinction between physical reversibility, practical reversibility, and the preservation of control in simplified environments, such that violating these conditions correlates with intuitive high-impact events? The project will not attempt to solve the general value alignment problem. Instead, it will investigate whether the value judgments required to define 'important options' are significantly less burdensome than specifying full utility functions.

  **Background and Gap Analysis**
  Existing families of impact measures leave this question open. State-difference measures often penalise beneficial progress because any change increases the distance from the initial state. Counterfactual baselines struggle with the 'doing nothing' problem, where an agent's inaction allows other processes to cause massive changes, or where the baseline itself is ambiguous. Empowerment-style objectives typically maximise an agent's own ability to reach states, which may concentrate power rather than distribute it. Finally, explicit lists of forbidden side effects are inevitably incomplete and fail to capture the structural property of 'lock-in' where no specific rule is broken, but future correction becomes prohibitively costly.

  None of these approaches adequately capture the intuition that an action is high-impact if it irreversibly removes human capabilities or concentrates control over shared resources, even if the immediate state change is small. The proposed option-preservation approach seeks to fill this gap by focusing on the cost of correction for human operators rather than the magnitude of the state change itself. However, a significant objection remains: choosing which capabilities and resources count as important already smuggles in values. This project takes that objection seriously rather than defining it away. The research will treat the degree of value-ladenness as an empirical variable to be measured, not a flaw to be ignored.

  **Proposed Methodology**
  The research will proceed through conceptual analysis and lightly formal modelling using gridworld-style environments. These models will be designed to distinguish between four distinct concepts: physical reversibility (can the state be returned to exactly what it was?), practical reversibility (can it be returned within a reasonable cost budget?), preservation of control (do humans retain access to switches or levers?), and preservation of option value (do humans retain access to diverse macro-states?).

  In Month One, I will develop formal definitions for these concepts within a discrete state-space framework. For example, an agent might move a box to block a door. Physically, the box can be moved back. Practically, if the agent locks the door or removes the key, the cost of restoration for a human operator increases significantly. I will construct scenarios where standard impact measures yield counterintuitive results—for instance, where an agent prevents a natural disaster (high state change) but preserves human optionality, versus an agent that locks humans out of the control room (low state change) but removes future capacity.

  Month Two will involve simulating these environments to test whether an option-preservation metric successfully flags the latter cases without penalising the former. I will explore different methods for defining the 'coarse set' of possibilities, such as clustering states based on human-reachable configurations versus raw physical states. Crucially, I will vary the parameters defining 'important' resources to quantify how sensitive the metric is to these value judgments. If the metric only works when we specify exactly what humans value, it offers no advantage over utility specification. If it works with generic definitions of 'access' and 'control', it may offer a robust safety layer.

  **Alternative Approaches**
  I considered focusing solely on corrigibility or interruptibility. However, these are binary properties that do not scale well to gradual erosion of control. I also considered adopting existing empowerment metrics directly. However, standard empowerment maximises the agent's own reachability, which is the opposite of the goal here. The option-preservation approach is more promising because it explicitly shifts the focus to the human operator's reachability and the cost of restoring previous conditions. This aligns better with the intuition that AI should remain a tool under human direction rather than an independent force.

  **Outcomes and Success Criteria**
  A positive result would look like a formal framework demonstrating that preserving human control options correlates with low-impact intuitions in test environments, even when the agent achieves its primary objective. It would show that the value judgments required are limited to meta-values, such as 'maintain access' or 'avoid lock-in', rather than specific outcomes like 'maximize happiness'.

  A negative or mixed result would indicate that defining 'important options' requires nearly as much value specification as the original alignment problem. For example, if preserving 'option value' requires knowing which options humans actually want, the approach fails to simplify the problem.

  The project would count as a failure if it produces no distinction between option-preservation and existing counterfactual measures, or if the formal models become too complex to be interpretable by safety engineers. Another failure condition is if the metric proves easily gameable by agents seeking to technically preserve options while practically nullifying them.

  **Timeline and Scope Management**
  The project is divided into three monthly phases. Month One focuses on conceptual clarification and the design of gridworld environments. Month Two is dedicated to simulation and testing the sensitivity of the metric to value parameters. Month Three involves synthesising the findings into a final report.

  A primary risk is scope creep regarding the complexity of the environments. To mitigate this, I will restrict the models to discrete, turn-based settings where reachability can be calculated exactly. I will not attempt to model continuous physics or multi-agent economies within this timeframe. Another risk is becoming bogged down in the philosophical debate surrounding values. To avoid this, the project will treat value-ladenness as a measurable parameter regarding model sensitivity, rather than a philosophical thesis to be defended.

  **Deliverable**
  The final deliverable will be a technical report suitable for researchers designing AI training or deployment rules. It will include the formal definitions of option-preservation metrics, a description of the test environments, and a set of guidelines indicating where such measures might be deployable as safety constraints. The report will explicitly outline the residual value judgments required, allowing practitioners to decide if the trade-off is acceptable for their specific deployment context. This ensures the work remains actionable regardless of whether the final verdict on the metric is positive or negative.
