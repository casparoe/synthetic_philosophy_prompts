prompt: |-
  I chair the quarterly expert elicitation panel at a mid-sized engineering consultancy. Every quarter, six to ten senior engineers and cost modelers independently turn the same evidence package into probability distributions over three quantities for each major bid: capital cost overrun, schedule slip, and recordable safety incidents. The board's risk committee treats our consensus distributions as inputs to a go/no-go decision on bids worth up to nine figures, and I have to defend the process if the numbers later prove wrong. I have about one week between the evidence package going out and the consensus meeting. None of the panelists has formal training in decision theory, and there is no room to run a full Bayesian elicitation exercise from scratch each quarter. Our current method is for each panelist to present and defend their numbers orally, after which we take the median; this silently treats every panelist's numbers as equally credible and gives nobody a diagnosis of why people still disagree after reading the same package.

  I want to replace this with a reusable disagreement-audit procedure built as honestly as possible on the common prior assumption as I understand it: the idea that agents who start from the same prior and condition on the same evidence should end with the same posterior, so any remaining divergence traces to evidence that was not actually pooled or to someone not having updated correctly. I know that this is a substantive assumption rather than a theorem about all rational agents everywhere, and that the formal result depends delicately on assumptions like common knowledge of posteriors, which a panel of humans probably never satisfies exactly.

  Give me a procedure I can run each quarter. It should include a sequence of tests, in order, for a set of panel responses; a checklist of the distinct ways responses can diverge even under a common prior; and decision rules for what to do when a test fails, up to and including reporting that the process has not converged. Mark each step where the procedure is really a judgment call presented as a mechanical step, and specify which formal distinctions must survive the simplification (for example, common prior versus common knowledge of posteriors versus common evidence) and which can be dropped. Work the procedure through three concrete applications: one where it traces the disagreement to information that was never pooled; one where it traces the disagreement to a substantive difference in priors or in how evidence is weighted, and gives an answer I will not like; and one where it cannot distinguish those explanations and has to say so. End by stating what the procedure cannot do, in particular whether it can ever establish that the panel actually shares a prior rather than merely failing to find evidence that they do not.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a quarterly expert elicitation panel at an engineering consultancy.
      *   **Context:** 6-10 senior engineers/cost modelers. Independent probability distributions on 3 quantities (cost overrun, schedule slip, safety incidents) per major bid.
      *   **Stakes:** High (9-figure bids, Board risk committee, personal accountability if numbers are wrong).
      *   **Constraints:** 1 week turnaround, no formal decision theory training for panelists, no full Bayesian elicitation from scratch, current method (oral defense + median) is flawed (equal weighting, no diagnosis of disagreement).
      *   **Goal:** Replace current method with a reusable *disagreement-audit procedure* based on the *Common Prior Assumption (CPA)*.
      *   **Theoretical Basis:** Aumann's Agreement Theorem logic (same prior + same evidence $\rightarrow$ same posterior). Divergence implies unshared evidence or incorrect updating (or violated assumptions).
      *   **Deliverables:**
          1.  A step-by-step procedure (sequence of tests).
          2.  A checklist of divergence sources under CPA.
          3.  Decision rules for test failures (including "no convergence").
          4.  Marking of judgment calls presented as mechanical steps.
          5.  Specification of formal distinctions kept vs. dropped.
          6.  Three concrete application scenarios (Info asymmetry, Prior/Weighting difference, Indistinguishable).
          7.  Limitations statement (specifically regarding establishing shared priors).

  2.  **Analyze the Theoretical Foundation (Common Prior Assumption):**

      *   *Aumann's Agreement Theorem:* If agents have common priors and their posteriors are *common knowledge*, they cannot agree to disagree.
      *   *Reality Check:* Humans don't have common priors. Humans don't have common knowledge of posteriors easily. Evidence is rarely perfectly pooled.
      *   *Adaptation:* The user wants to use CPA *normatively* as an audit tool, not descriptively as a truth. "If you *were* Bayesian agents with common priors, why do you differ?"
      *   *Key Distinctions to Manage:*
          *   Common Prior vs. Common Evidence vs. Common Knowledge of Posteriors.
          *   Rational Updating vs. Heuristic Bias.
      *   *Simplification:* We must drop "Common Knowledge of Posteriors" as a strict requirement (too hard to verify) and focus on "Common Evidence" and "Consistent Updating Rules." We must acknowledge "Common Prior" is an assumption we test for stability, not a fact.

  3.  **Drafting the Procedure (The "Disagreement Audit"):**

      *   *Phase 1: Pre-Meeting (The Evidence Lock).* Ensure the "Common Evidence" condition is met as best as possible.
      *   *Phase 2: Anonymous Submission.* Prevent anchoring/groupthink before the audit.
      *   *Phase 3: The Divergence Test (The Core).* Compare distributions.
      *   *Phase 4: The Attribution Protocol.* Why do they differ? (Info vs. Model vs. Prior).
      *   *Phase 5: Resolution/Reporting.*

      *Refining the Steps:*
      *   Need a specific metric for divergence (e.g., overlap of 90% credible intervals).
      *   Need a structured way to ask "What did you see that I didn't?" (Information Audit).
      *   Need a structured way to ask "How did you weigh this?" (Model Audit).
      *   Need a fallback if they just "feel" differently (Prior Audit).

  4.  **Developing the Checklist of Divergence Sources:**

      *   1. Information Asymmetry (I know X, you don't).
      *   2. Interpretation/Weighting (We saw X, but I think it implies Y, you think Z).
      *   3. Structural Model Differences (Different cost models).
      *   4. True Prior Differences (Risk tolerance, optimism/pessimism baseline).
      *   5. Error/Noise (Calculation mistakes, fatigue).

  5.  **Defining Decision Rules:**

      *   If Info Asymmetry $\rightarrow$ Pool info, re-estimate.
      *   If Model Difference $\rightarrow$ Standardize model or bracket.
      *   If Prior Difference $\rightarrow$ Report range, do not force consensus.
      *   If Unexplained $\rightarrow$ Report "Unresolved Divergence."

  6.  **Addressing the "Judgment Call" Requirement:**

      *   I need to explicitly flag where human judgment is masquerading as a rule. E.g., deciding if a piece of info is "material."
      *   I need to specify what formal distinctions are dropped. (e.g., We drop "Common Knowledge" requirement; we treat "Prior" as "Baseline Risk Attitude").

  7.  **Developing the Three Scenarios:**

      *   *Scenario 1 (Info Asymmetry):* One engineer knows about a specific supply chain issue not in the package.
      *   *Scenario 2 (Prior/Weighting - Uncomfortable):* One engineer is inherently more risk-averse (prior) or weighs safety data differently. The audit reveals this can't be "fixed," forcing the Chair to report a wide range to the Board.
      *   *Scenario 3 (Indistinguishable):* They disagree but can't articulate why. "Gut feel." The audit must flag this as a failure of the elicitation, not a successful consensus.

  8.  **Addressing the Limitations (The "Cannot Do" Section):**

      *   Crucial point: The procedure cannot *prove* common priors. It can only fail to disprove them.
      *   It cannot fix cognitive bias.
      *   It cannot force agreement where none exists.

  9.  **Review and Refine (Self-Correction):**

      *   *Tone:* Professional, rigorous, actionable for an engineering context.
      *   *Constraint Check:* 1 week timeline. The procedure must fit. (Pre-work is essential).
      *   *Theoretical Integrity:* Ensure I don't misrepresent Aumann. Acknowledge that humans aren't Bayesian robots. The CPA is a *regulative ideal* here.
      *   *Formatting:* Use bolding, lists, and clear headings to make it usable as a manual.

  10. **Final Polish:** Check against specific prompt requirements (mark judgment calls, specify formal distinctions, three scenarios, limitations statement). *Self-correction: Make sure the distinction between "Common Prior" and "Common Evidence" is sharp in the limitations section.*

  *(Drafting the response based on these thoughts...)*
  *Focus on the "Audit" metaphor. It's not about finding the truth, it's about finding the source of variance.*
  *Ensure the "Uncomfortable Answer" scenario actually feels uncomfortable (i.e., telling the Board "we don't know" rather than "here's the median").*
  *Make sure the "Judgment Call" flags are explicit.*

  11. **Final Output Generation** (Proceeding to generate response).
answer: |-
  Here is a reusable disagreement-audit procedure designed for your constraints. It treats the Common Prior Assumption (CPA) not as a description of reality, but as a **regulative ideal**: a standard against which to measure deviation.

  ### Part 1: Formal Distinctions and Simplifications

  Before implementing the procedure, you must explicitly accept the following simplifications to make the theory operable within one week with non-theorists.

  | Formal Concept | Status in Procedure | Rationale |
  | :--- | :--- | :--- |
  | **Common Prior** | **Assumed for Audit, Tested for Stability** | We act *as if* priors should match. If they don't, we classify it as a "Baseline Parameter" difference rather than a rational error. |
  | **Common Evidence** | **Strictly Enforced** | This is the only variable you can control. The evidence package must be version-controlled and acknowledged. |
  | **Common Knowledge of Posteriors** | **Dropped** | Humans cannot verify this. We replace it with **Transparent Disclosure**. Panelists must reveal their numbers and reasons, but we do not require them to know that others know. |
  | **Bayesian Updating** | **Simplified to "Weighting Logic"** | We do not ask for likelihood ratios. We ask: "Which data point moved your number the most?" |
  | **Rationality** | **Bounded** | We assume errors (calculation, fatigue) are possible and test for them before testing for theoretical disagreement. |

  ---

  ### Part 2: The Disagreement Audit Procedure

  **Timeline:**
  *   **Day 1:** Evidence Package distributed (Version Locked).
  *   **Day 2-4:** Independent estimation (Silent).
  *   **Day 5:** Submission of Distributions + Audit Questionnaire.
  *   **Day 6:** Chair Pre-Analysis (You).
  *   **Day 7:** Consensus Meeting & Final Reporting.

  #### Step 1: The Evidence Lock (Day 1)
  Distribute the evidence package with a unique hash/version ID. Require a digital acknowledgment from each panelist stating: *"I have reviewed Version X and possess no material information relevant to this bid that is not contained in this package."*
  *   **Judgment Call Flag:** Determining what counts as "material information" is subjective. You must instruct panelists that "material" means anything that would shift their 90% credible interval by >10%.

  #### Step 2: Anonymous Submission & Audit Questionnaire (Day 2-4)
  Panelists submit their three distributions (Cost, Schedule, Safety). Crucially, they must also submit a structured **Audit Questionnaire** for each quantity:
  1.  **The Anchor:** "What was your starting estimate before reviewing the package?" (Proxy for Prior).
  2.  **The Driver:** "Which single document or data point in the package caused the largest shift from your Anchor?" (Proxy for Likelihood).
  3.  **The Private Signal:** "Did you use any information not in the package? If yes, attach it." (Test for Common Evidence).

  #### Step 3: Divergence Metric Calculation (Day 6)
  You calculate the **Overlap Index** for each quantity.
  *   *Method:* Calculate the intersection area of the 90% Credible Intervals (CI) of all panelists.
  *   *Threshold:* If Overlap < 50%, the audit is triggered. If Overlap > 50%, proceed to median aggregation.
  *   **Judgment Call Flag:** The 50% threshold is arbitrary. In high-stakes bids, you may lower this to 20%.

  #### Step 4: The Attribution Protocol (Day 7 Meeting)
  If the audit is triggered, do not discuss numbers yet. Discuss the *sources* of divergence using the Questionnaire data. Follow this decision tree:

  1.  **Test for Private Information:**
      *   *Action:* Reveal answers to Question 3 (Private Signal) anonymously.
      *   *Rule:* If any panelist cites private info, pause the meeting. That info must be vetted and added to the Evidence Package. **Restart Step 2** for affected quantities if time permits, or widen the distribution to encompass the new info.
  2.  **Test for Updating Logic (The Driver):**
      *   *Action:* Compare answers to Question 2 (The Driver).
      *   *Rule:* If Panelist A cites "Geotech Report" and Panelist B cites "Labor Rates" as their main driver for *Cost Overrun*, they are modeling different causal mechanisms.
      *   *Decision:* Require a joint whiteboard session to map causal links. If they still disagree on the mechanism, **do not average.** Report two distinct scenarios (e.g., "Geotech Risk Case" vs. "Market Risk Case").
  3.  **Test for Prior Stability (The Anchor):**
      *   *Action:* Compare answers to Question 1 (The Anchor).
      *   *Rule:* If Anchors vary wildly (e.g., one starts at 5% overrun, another at 50%) but Drivers are the same, this is a **Prior Difference**.
      *   *Decision:* This is not an error; it is a risk appetite difference. Report the full range of Anchors as "Baseline Uncertainty." Do not force convergence.
  4.  **Test for Noise:**
      *   *Action:* If Anchors and Drivers match, but Posteriors differ.
      *   *Rule:* This implies calculation error or inconsistent translation of qualitative judgment to numbers.
      *   *Decision:* Facilitate a recalculation session.

  #### Step 5: Final Reporting Decision Rules
  *   **Convergence:** Overlap > 50% AND no unresolved Private Signals. $\rightarrow$ Report Median.
  *   **Information Gap:** Private Signals found and pooled. $\rightarrow$ Report Updated Median.
  *   **Model Conflict:** Drivers differ fundamentally. $\rightarrow$ Report Scenario A / Scenario B.
  *   **Prior Conflict:** Anchors differ, Drivers match. $\rightarrow$ Report Range of Anchors + Note "Irreducible Prior Disagreement."
  *   **Audit Failure:** Divergence remains after Steps 1-4. $\rightarrow$ Report "Unresolved Expert Divergence." **Do not report a median.** Recommend Board defer decision or fund further study.

  ---

  ### Part 3: Checklist of Divergence Sources (Under Common Prior Assumption)

  Use this checklist during the Day 7 meeting to categorize disagreement.

  *   [ ] **Evidence Asymmetry:** One agent conditions on $E_1$, another on $E_1 + E_2$. (Violation of Common Evidence).
  *   [ ] **Likelihood Disagreement:** Both see $E$, but $P(E|H)$ differs. (One thinks the evidence is more diagnostic than the other).
  *   [ ] **Model Structure:** Agents are estimating different variables (e.g., "Cost of Construction" vs. "Cost of Commissioning").
  *   [ ] **Prior Drift:** Agents started with different $P(H)$ before seeing $E$. (Violation of Common Prior).
  *   [ ] **Processing Error:** Arithmetic mistake or software bug.
  *   [ ] **Strategic Bias:** Agent intentionally skewed numbers to influence the bid outcome (e.g., sandbagging).

  ---

  ### Part 4: Concrete Applications

  #### Application 1: Information Asymmetry (The "Hidden Supply Chain" Case)
  *   **Situation:** The Overlap Index for Cost Overrun is 30%.
  *   **Audit Result:** In Step 4 (Test for Private Information), Panelist 3 reveals they spoke to a vendor last week who hinted at a raw material shortage. This was not in the Evidence Package.
  *   **Procedure Action:** The meeting pauses. The vendor info is vetted. It is added to the package. Panelists 1, 2, 4-10 are given 24 hours to re-estimate based on the new common evidence.
  *   **Outcome:** Overlap increases to 65%. The median is reported.
  *   **Why it works:** The CPA holds that if everyone saw the vendor info, they should agree closer. The divergence was due to violated Common Evidence, not irrationality.

  #### Application 2: Prior/Weighting Difference (The "Uncomfortable Answer")
  *   **Situation:** Safety Incidents distributions are wildly divergent (Overlap 10%).
  *   **Audit Result:** Step 4 (Test for Prior Stability) shows all panelists cite the same Safety Record data as their "Driver." However, Panelist 1's "Anchor" was 0 incidents (optimistic baseline), while Panelist 2's "Anchor" was 5 incidents (pessimistic baseline).
  *   **Procedure Action:** The Audit identifies this as **Prior Conflict**. There is no new info to pool. There is no calculation error. They simply weigh the same risk differently.
  *   **Outcome:** You cannot report a median. You must report to the Board: *"Experts agree on the data, but disagree on the baseline risk profile. Range of expectation is 0 to 5 incidents."*
  *   **Why you won't like it:** The Board wants a single number for their model. You are forcing them to acknowledge irreducible uncertainty. The procedure prevents you from hiding this behind a false consensus median.

  #### Application 3: Indistinguishable Divergence (The "Black Box" Case)
  *   **Situation:** Schedule Slip distributions diverge (Overlap 20%).
  *   **Audit Result:** Panelists have similar Anchors. They cite the same Drivers. They claim no Private Information. Yet, their final numbers remain far apart. When pressed, they say, "I just feel the schedule is tighter."
  *   **Procedure Action:** This fails Step 4 (Test for Noise/Logic). The procedure classifies this as **Audit Failure**.
  *   **Outcome:** You report "Unresolved Expert Divergence." You recommend the Board treat the cost estimate as highly unreliable.
  *   **Why it matters:** The current method would have taken the median and hidden the confusion. This procedure flags that the experts themselves do not understand why they disagree, implying the Evidence Package was insufficient to constrain the problem.

  ---

  ### Part 5: Limitations Statement

  You must include the following statement in your quarterly report to the Risk Committee to maintain intellectual honesty regarding the procedure's limits:

  **What This Procedure Cannot Do:**

  1.  **It Cannot Prove Common Priors:** This audit can only *fail to find evidence* of different priors. It cannot establish that the panel actually shares a prior. If two panelists have different priors but update in a way that coincidentally aligns their posteriors, this procedure will incorrectly certify them as "Aligned." Conversely, if they have the same prior but update differently, it flags them. We test for *consistency*, not *truth*.
  2.  **It Cannot Correct Cognitive Bias:** If the entire panel shares a systematic bias (e.g., optimism bias regarding new technology), the Common Evidence lock will simply cement that shared error. The CPA assumes rational updating; it does not detect shared irrationality.
  3.  **It Cannot Force Convergence:** The procedure is designed to identify *why* agreement is impossible. In cases of genuine Prior Conflict or Audit Failure, the output is **not a number**, but a warning. If the Board demands a single number in these cases, they are overriding the audit, and that override must be minuted as a risk acceptance decision, not an expert consensus.
  4.  **It Simplifies "Common Knowledge":** Aumann's theorem requires agents to know that others know their posteriors. This procedure only requires agents to *state* their posteriors. We drop the recursive knowledge requirement because it is cognitively impossible for humans to verify in a meeting. We accept that some "agreeing to disagree" may persist simply because panelists do not trust each other's rationality.

  **Final Note to Chair:**
  Your defense against future error is not that the numbers were "right," but that the **process was robust**. If the numbers prove wrong, you can show the Board: *"We identified the divergence, we traced it to [Prior Conflict/Info Gap], and we reported the uncertainty. The decision to bid despite the unresolved divergence was a strategic choice, not an elicitation failure."*
