prompt: |-
  I'm in an undergraduate seminar on moral progress, and much of what we've read leans on the expanding-circle metaphor associated with Peter Singer: moral development, both across history and within a person's life, is pictured as a circle of concern that begins around the self and pushes outward to family, tribe, nation, all humanity, animals, and perhaps future generations or artificial minds. In our discussions the metaphor does real argumentative work. My classmates take it to support three claims: (1) there is a single axis along which moral progress occurs, so apparent disagreements about, say, animal welfare versus global poverty are really disagreements about how far out the circle should reach; (2) the historical trajectory so far is evidence that further expansion is likely and desirable, so the burden of proof falls on whoever wants to stop at the current boundary; and (3) resisting a proposed extension (to insects, or to future digital minds) means repeating the mistake of everyone in history who resisted a previous one. Please audit the analogy: state explicitly what maps onto what (center, radius, circumference, the act of expanding), identify where the mapping breaks, and distinguish the disanalogies that matter for claims (1)–(3) from the ones that don't. In particular, say which features of the geometric source the metaphor quietly imports that the moral target may lack — I'm thinking of uniformity in all directions, monotonic growth, a single shared metric of 'distance' between beings, and the implication that everything inside the boundary is equally included. Then tell me whether (1)–(3) survive once those imports are made explicit, and if the circle can't carry that weight, what image, if any, would do better.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Context:** Undergraduate seminar on moral progress.
      *   **Core Metaphor:** Peter Singer's "Expanding Circle."
      *   **Classmates' Claims:**
          1.  Single axis of moral progress (disagreements are just about *how far*).
          2.  Historical trajectory implies future expansion is likely/desirable (burden of proof on stoppers).
          3.  Resistance to new extensions repeats past mistakes (historical indictment).
      *   **Task:** Audit the analogy.
          *   Map source (geometry) to target (morality).
          *   Identify where the mapping breaks.
          *   Distinguish relevant vs. irrelevant disanalogies regarding claims (1)-(3).
          *   Identify "quiet imports" (geometric features assumed in morality): uniformity, monotonic growth, single metric of distance, equal inclusion inside boundary.
          *   Evaluate if claims (1)-(3) survive explicit scrutiny of these imports.
          *   Propose alternative imagery if the circle fails.

  2.  **Initial Brainstorming & Mapping:**
      *   *Source Domain:* Euclidean Geometry (Circle).
      *   *Target Domain:* Moral Community/Consideration.
      *   *Center:* The Self / The Ego.
      *   *Radius:* The scope of moral concern.
      *   *Circumference:* The boundary between those who matter and those who don't.
      *   *Expansion:* Moral progress/enlightenment.
      *   *Points inside:* Beings with moral status.
      *   *Points outside:* Beings without moral status.
      *   *Distance:* Moral relevance/similarity to self.

  3.  **Analyzing the "Quiet Imports" (Geometric Features):**
      *   *Uniformity:* A circle expands equally in all directions. Does morality expand equally? (e.g., Do we care about distant humans *and* nearby animals at the same rate?)
      *   *Monotonicity:* Circles don't shrink (in this metaphor). Does moral progress never regress? (History suggests otherwise).
      *   *Single Metric:* Distance in geometry is uniform (Euclidean). Is moral "distance" uniform? (Is the gap between self/family same as human/animal?)
      *   *Equal Inclusion:* Everything inside is equally "in." Do we value a citizen and a foreigner equally once they are "inside"? (Usually no, we have tiers).
      *   *Continuity:* A circle is continuous. Moral status often feels categorical (rights vs. no rights).

  4.  **Evaluating Claims (1)-(3) against Disanalogies:**

      *   *Claim 1 (Single Axis):* The circle implies one dimension: radius.
          *   *Critique:* Morality is multidimensional. Care for animals isn't just "further out" than care for foreigners; it's a *different kind* of obligation. The circle flattens qualitative differences into quantitative distance.
          *   *Verdict:* Weakens Claim 1.

      *   *Claim 2 (Trajectory/Burden of Proof):* The circle implies inevitable, smooth expansion.
          *   *Critique:* History isn't monotonic. Circles can shrink (moral regress). Also, just because it *did* expand doesn't mean it *should* or *must* (Is/Ought problem). The geometric inevitability smuggles in teleology.
          *   *Verdict:* Weakens Claim 2.

      *   *Claim 3 (Resistance = Past Mistakes):* The circle implies the boundary is arbitrary and always wrong if it excludes.
          *   *Critique:* In geometry, the boundary is defined by the radius. In morality, boundaries might be based on *capacity* (sentience, rationality). If the new group lacks the relevant capacity, resistance isn't prejudice; it's categorization. The circle assumes all exclusions are prejudice, not distinction.
          *   *Verdict:* Weakens Claim 3.

  5.  **Drafting the Audit (Section by Section):**

      *   **Introduction:** Acknowledge the utility of the metaphor but state the purpose of the audit.
      *   **Explicit Mapping:** Define Center, Radius, Circumference, Interior/Exterior, Expansion.
      *   **Quiet Imports (The Geometric Baggage):**
          *   *Isotropy (Uniformity):* Moral concern isn't uniform.
          *   *Monotonicity:* Progress isn't guaranteed or irreversible.
          *   *Homogeneity of Interior:* "In" doesn't mean "equal weight."
          *   *Metric of Distance:* Moral relevance isn't spatial or singular.
      *   **Evaluating Claims (1)-(3):**
          *   *Claim 1:* Fails because morality is multidimensional, not radial.
          *   *Claim 2:* Fails because history isn't monotonic; geometric inevitability $\neq$ moral necessity.
          *   *Claim 3:* Fails because some boundaries are categorical (capacity-based), not arbitrary lines in the sand.
      *   **Alternative Imagery:** What works better?
          *   *Web/Network:* Captures interdependence and varying strengths of connection.
          *   *Layers/Spheres:* Allows for different *kinds* of obligation (special vs. general) without implying one is just "further."
          *   *Thresholds:* Focuses on capacities rather than distance.
          *   *Recommendation:* A "Layered Web" or "Concentric Spheres of Obligation" (but distinct from the circle of *progress*). Let's go with **Concentric Spheres of Obligation** (to keep the spatial intuition but fix the "progress" error) or **A Mosaic/Threshold Model**. Actually, the "Web" is good for interconnection, but for *status*, a **Threshold/Capacity Model** is more precise. However, for *progress*, maybe **Spiral**? No, spiral implies return. Let's suggest **A Multi-Dimensional Landscape** or **Overlapping Communities**.
          *   *Refinement:* The best alternative for *progress* specifically might be **Ecological Succession** or **Weaving**. But to address the specific flaws of the circle (uniformity, single axis), **Concentric Rings of Duty** (different duties, not just distance) is a classic correction. Let's propose **A Network of Nodes with Variable Edge Weights**. It captures that some connections are strong (family), some weak (strangers), and new nodes (animals) connect differently, not just "further out."

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I distinguish relevant vs. irrelevant disanalogies?
      *   *Irrelevant:* The fact that circles are 2D and morality isn't spatial. That's obvious.
      *   *Relevant:* The *properties* of the geometry (monotonicity, isotropy) that imply moral properties (inevitability, uniformity).
      *   *Check:* Did I address Singer specifically? Singer uses it to describe the *logic* of impartiality. The classmates are using it for *historical progress*. I need to make sure I distinguish Singer's normative claim (we *ought* to expand) from the classmates' descriptive/historical claim (we *are* expanding, so we *will*).
      *   *Tone:* Academic, rigorous, suitable for a seminar audit.

  7.  **Final Polish:**
      *   Ensure the structure matches the prompt's requirements (Mapping -> Breaks/Imports -> Evaluation of 1-3 -> Alternative).
      *   Make sure the "Quiet Imports" section clearly links geometric features to moral assumptions.
      *   Ensure the alternative image addresses the specific failures identified.

  8.  *(Self-Correction on Alternative Image)*: A "Web" is good for relationships, but moral *status* is often about inclusion. A "Threshold" model is better for status. But the prompt asks about *progress*. Maybe **Accretion**? No. Let's suggest **A Patchwork or Mosaic**. It allows for expansion without implying uniform coverage or a single center. Or **Concentric Spheres of Special Obligation** vs. **Universal Floor**. Let's go with **A Multi-Centered Network**. It kills the "Single Axis" claim directly.

      *Wait, a better alternative for "Progress" specifically:* **The Spiral.** It captures movement but allows for revisiting issues (regress/complexity) and isn't perfectly uniform.
      *Actually, the most philosophically robust alternative to the "Expanding Circle" of *impartiality* is often the "Concentric Circles of Duty" (Stoic), but that reinforces the circle. To challenge the *progress* aspect, I should suggest **A Landscape with Thresholds**.*
