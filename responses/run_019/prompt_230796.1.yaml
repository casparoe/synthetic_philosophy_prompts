      *   **Philosophical Question 1:** What theory of freedom/responsibility underpins this? (Sartrean radical freedom? Compatibilism? Hard Determinism?)
      *   **Philosophical Question 2:** If it *is* Sartrean, is it consistent with Sartre, or a distortion (turning freedom into a metric, denying facticity)?
      *   **Observation of Contradiction:** The same company spends heavily on forecasting/risk modeling (implying outcomes *are* determined/influenced by external factors).
      *   **Task:** Reconstruct the implicit theory, identify which parts of the practice need which philosophical commitments, and explain how the program would change under determinism/compatibilism.

