      *   *Refining "Evolutionary Stability":* If a population of superrationalists meets a defector, do they get wiped out? In a one-shot, maybe not. In iterated, yes. This touches on FDT (Functional Decision Theory).
      *   *Refining "Logical Uncertainty":* This is the modern update. You are a program. You can't know your output without running the code. But if you run the code to decide, you can't use the output as input for the prediction of others *before* you decide. This is a subtle loop.
