answer: |-
  ### Module: Deception and the Structure of Consent

  **Objective:** To move beyond slogans like "lies ruin consent" and examine *why* some deceptions invalidate consent while others do not, even when the lie itself is identical.

  #### Scenario 1: The Hidden Audience (Invalid Consent)
  Alex and Jordan are on a third date. They return to Alex's apartment. Before any intimacy begins, Jordan asks, "Is anyone else here? I want to make sure we're completely alone." Alex replies, "Yes, I live alone. We are the only two people in this apartment."

  This is a deliberate lie. Alex has invited a friend to hide in the bedroom closet specifically to watch and listen to the encounter. The friend is silent and does not intervene. Jordan, believing they are alone, agrees to sexual activity. The physical acts performed are exactly what Jordan expected. There is no threat, coercion, or misrepresentation of Jordan's identity or health status.

  **Consensus Verdict:** Jordan did not give valid consent.

  #### Scenario 2: The Shared Lease (Valid Consent)
  Alex and Jordan are on a third date. They return to Alex's apartment. Before any intimacy begins, Jordan asks, "Is anyone else here? I want to make sure we're completely alone." Alex replies, "Yes, I live alone. We are the only two people in this apartment."

  This is a deliberate lie. Alex lives with a roommate who is currently in their bedroom, asleep with the door closed. The roommate is not expecting guests, has not been invited to observe, and is unaware Jordan is there. Jordan, believing they are alone, agrees to sexual activity. The physical acts performed are exactly what Jordan expected. There is no threat, coercion, or misrepresentation of Jordan's identity or health status.

  **Consensus Verdict:** Jordan gave valid consent.

  ***

  ### Analysis by Ethical Family

  Here is how the three specified families of view analyze the difference between Scenario 1 and Scenario 2.

  **1. Autonomy-Based Views**
  *   **Focus:** Whether the consent-giver was able to exercise self-governance based on accurate information relevant to their decision.
  *   **Scenario 1:** Autonomy is violated. Jordan's decision-making framework included a condition of privacy. By secretly introducing an observer, Alex manipulated the context of the choice. Jordan chose "private intimacy," but the option presented was "performance." The deception bypassed Jordan's right to set the terms of their own participation.
  *   **Scenario 2:** Autonomy is respected. While the statement "I live alone" was factually false, the *relevant information* for self-governance was "Is there a risk of observation?" In shared housing, the presence of a sleeping roommate is a background environmental condition, not a change in the nature of the interaction. Jordan retained the ability to govern their participation within the normal risks of the venue.

  **2. Views on Which Consent Is Invalid When It Would Wrong the Consent-Giver**
  *   **Focus:** Whether the interaction inflicts a moral injury or harm that the consent-giver did not agree to accept.
  *   **Scenario 1:** A wrong is committed. Jordan is turned into an object of consumption for a third party without their knowledge. This is a form of exploitation and humiliation. The deception facilitates a harm (voyeurism) that Jordan explicitly sought to avoid.
  *   **Scenario 2:** No wrong is committed. The roommate's presence is incidental. Unless the roommate wakes and intrudes, Jordan suffers no humiliation or exploitation. The lie concerns a fact (headcount) that does not, in this structure, translate into a moral injury.

  **3. Views on Which Consent Transfers a Permission Through a Communicated Mental Act**
  *   **Focus:** Whether the internal will of the consent-giver aligns with the external permission granted.
  *   **Scenario 1:** The transfer fails. Jordan's internal will was to grant permission for an act between *two people*. Alex accepted permission for an act involving *three people* (two actors, one observer). Because the scope of the permission (private vs. observed) did not match the scope of the act, the permission was never successfully transferred.
  *   **Scenario 2:** The transfer succeeds. Jordan's internal will was to grant permission for an act in a *private context*. In ordinary language, "private" in a shared apartment excludes "invited observers" but includes "sleeping housemates." The internal will aligns with the external reality of the social transaction, even if the literal headcount was misrepresented.

  ***

  ### The Structural Feature

  The differentiating factor is not the content of the lie ("We are the only two people"), nor is it the stakes (the potential embarrassment is similar in both). The structural feature is **The Seeker's Agency in Constituting the Audience.**

  *   **In Scenario 1 (Invalid):** The third party is present *because* of the sexual encounter. The Seeker actively **manufactured** the risk of observation by inviting the observer specifically for this purpose. The observer is *instrumentalized* as part of the sexual dynamic.
  *   **In Scenario 2 (Valid):** The third party is present *independently* of the sexual encounter. The Seeker merely **accepted** a pre-existing environmental condition. The third party is *incidental* to the sexual dynamic.

  **What happens if this feature is removed?**
  *   If you remove the Seeker's agency in Scenario 1 (e.g., the friend broke in without Alex's knowledge), the verdict shifts toward valid consent (Alex is also a victim of the circumstance).
  *   If you add the Seeker's agency in Scenario 2 (e.g., Alex woke the roommate and asked them to listen), the verdict shifts toward invalid consent (it becomes Scenario 1).

  This demonstrates that the validity of consent hinges on whether the deception was used to **alter the normative structure of the interaction** (turning a private act into a public one) versus merely **misstating a background fact** that does not change the interaction's nature.

  ***

  ### The Strongest Objection: The "Pure Mental Act" View

  **The Objection:**
  "There is no structural difference that matters. Consent is a subjective mental state followed by a communication. If I say 'Yes' based on a falsehood, my mental state is flawed. In both scenarios, Jordan said 'Yes' based on the belief 'No one else is here.' In both scenarios, someone else *was* there. Therefore, in both scenarios, the mental state did not match reality. If consent requires a meeting of the minds, and the reality of the room (three people vs. two people) did not match the mind of the consent-giver, then consent is void in *both* cases. To say otherwise is to argue that some lies are 'small enough' to ignore, which returns us to arbitrary stakes rather than principles. If the lie is deliberate, the consent is invalid, period."

  **Implication for the Module:**
  This objection forces trainees to defend why *some* false beliefs invalidate consent while others do not. It challenges them to articulate why the *source* of the falsehood (Seeker's manipulation vs. Environmental ambiguity) matters more than the *falsity* itself. It prevents the group from settling on "no lies allowed" and pushes them toward the more nuanced structural analysis provided above.
