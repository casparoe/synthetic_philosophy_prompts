      *   **Distinction:** Gibbard-Satterthwaite is about *strategic voting* (lying about preferences). The user is describing *agenda manipulation* (controlling the structure) with *sincere voting*.
      *   **Condition for Stability:** Single-Peaked Preferences / Condorcet Winner.

  3.  **Drafting the Explanation - Section by Section:**

