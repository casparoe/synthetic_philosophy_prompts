answer: |-
  What you have observed is a well-documented and fundamental phenomenon in social choice theory. It has an established name: **Agenda Control** (or **Agenda Manipulation**) within the context of **Sequential Pairwise Voting**.

  You are correct that this is distinct from the "gaming" described in the theorem you recall. You are also correct that, under specific conditions, the person who sets the agenda effectively decides the outcome, even when every voter acts with perfect honesty.

  Here is an explanation of what the phenomenon is, how it differs from strategic voting, the general theorems that govern it, and the precise conditions under which the order ceases to matter.

  ### 1. The Phenomenon: Agenda Control via Cyclical Preferences

  The mechanism you are describing relies on the existence of a **Condorcet Cycle**.

  In a group vote, a "Condorcet Winner" is a candidate who would beat every other candidate in a head-to-head matchup. If such a person exists, they are generally considered the robust choice. However, when there are three or more options, it is mathematically possible for group preferences to be intransitive, even if every individual voter is rational and transitive.

  Imagine a committee of three members voting on three candidates (A, B, and C) with the following sincere preferences:
  *   **Voter 1:** A > B > C
  *   **Voter 2:** B > C > A
  *   **Voter 3:** C > A > B

  If you pit them against each other pairwise:
  *   **A vs. B:** A wins (Voters 1 and 3 prefer A).
  *   **B vs. C:** B wins (Voters 1 and 2 prefer B).
  *   **C vs. A:** C wins (Voters 2 and 3 prefer C).

  This creates a cycle: A beats B, B beats C, but C beats A. There is no stable majority winner.

  In your committee's procedure (sequential pairwise voting), the agenda determines which pairwise comparison happens last.
  *   **Agenda 1:** (A vs. B), then winner vs. C.
      *   A beats B. Then C beats A. **Result: C wins.**
  *   **Agenda 2:** (B vs. C), then winner vs. A.
      *   B beats C. Then A beats B. **Result: A wins.**
  *   **Agenda 3:** (C vs. A), then winner vs. B.
      *   C beats A. Then B beats C. **Result: B wins.**

  Every candidate can win solely by changing the order of voting. Since everyone votes sincerely at each step (voting for their preferred option in the pair presented), no one has lied. The manipulation is structural, not behavioral.

  ### 2. Distinction from the Gibbard-Satterthwaite Theorem

  The theorem you recall, which suggests that every reasonable voting method can be "gamed," is likely the **Gibbard-Satterthwaite Theorem** (1973). It is crucial to distinguish the vulnerability you found from the one that theorem describes.

  *   **Gibbard-Satterthwaite** concerns **Strategic Voting**. It proves that if a voting system is not a dictatorship, there will be situations where a voter can get a better outcome by *lying* about their preferences (e.g., voting for a less-preferred candidate to prevent a worst-case scenario). The manipulation comes from the *voters*.
  *   **Agenda Control** concerns **Structural Manipulation**. As you noted, your voters are not lying. They are voting sincerely. The manipulation comes from the *chair* (the agenda setter) exploiting the path-dependence of the voting rule.

  Both theorems reach a similar pessimistic conclusion: there is no perfect voting system. However, they attack different flanks. Gibbard-Satterthwaite says you cannot stop voters from lying; Agenda Control theory says you cannot stop a chair from steering the outcome if preferences are cyclical.

  ### 3. General Results: The Chaos Theorem

  You asked if there are results of comparable generality. Yes. While the example above uses three voters and three candidates, the problem scales.

  The most famous result in this area is **McKelvey's Chaos Theorem** (1976). Richard McKelvey proved that in a multidimensional policy space (which applies to most real-world decisions like hiring or budgets), if there is no Condorcet Winner, **any outcome can be reached from any other outcome through a suitable sequence of pairwise votes.**

  This means that if preferences are sufficiently diverse to create a cycle, the agenda setter does not just have *some* influence; they have *dictatorial* influence over the final result, provided they know the voters' preferences well enough to construct the right sequence. This confirms your conviction: the chair who knows how people feel can arrange for her favorite to prevail without anyone breaking a rule.

  ### 4. The Edges: When Order Does Not Matter

  You also asked for the boundaries of this phenomenon. When does the sequence become irrelevant? There are two primary conditions under which agenda control fails and the outcome becomes stable.

  **A. Existence of a Condorcet Winner**
  If one candidate is preferred by a majority over every other candidate individually, that candidate cannot be eliminated in a sequential pairwise vote. They will win every head-to-head matchup they are involved in. Therefore, if a Condorcet Winner exists, the agenda order cannot change the final winner. The vulnerability you observed exists *only* when the group's preferences are cyclical (i.e., no Condorcet Winner exists).

  **B. Single-Peaked Preferences (Black's Median Voter Theorem)**
  This is the more practical condition for organizations. Duncan Black (1948) showed that if voters' preferences are **single-peaked**, cycles cannot occur.

  Preferences are single-peaked if the options can be arranged along a single spectrum (e.g., "low budget" to "high budget," or "conservative policy" to "liberal policy") and each voter has one ideal point on that spectrum, with their preference declining as options move away from that ideal in either direction.

  If your committee's preferences are single-peaked:
  1.  Cyclical majorities are impossible.
  2.  A Condorcet Winner always exists (specifically, the option preferred by the "median voter").
  3.  **The agenda order does not matter.** The median voter's choice will win regardless of the sequence.

  ### Summary for Your Committee

  The phenomenon you have identified is **Agenda Control** enabled by **Condorcet Cycles**.

  *   **What it is:** The ability of an agenda-setter to determine the winner by sequencing pairwise votes, exploiting intransitive group preferences.
  *   **What it is not:** It is not **Strategic Voting** (Gibbard-Satterthwaite), where voters misrepresent preferences. Your voters are sincere; the rules are the lever.
  *   **Where it ends:** The power of the chair vanishes if the group possesses a **Condorcet Winner** or if preferences are **Single-Peaked** (aligned along a common spectrum).

  **Practical Implication:**
  If your committee wishes to neutralize the chair's power, you have two options derived from this theory:
  1.  **Change the Voting Method:** Use a method that is not path-dependent, such as a Borda Count (ranking candidates by points) or Approval Voting, though these introduce other trade-offs.
  2.  **Randomize the Agenda:** If you must use pairwise voting, randomize the order of comparison to prevent the chair from engineering a specific path.
  3.  **Check for Single-Peakedness:** If you can frame the decision along a single dimension (e.g., strictly salary or strictly years of experience), preferences are more likely to be single-peaked, rendering the agenda irrelevant.

  Your observation is theoretically sound. In the absence of a Condorcet Winner, the procedure you described does not select the "will of the committee"; it selects the will of the person who writes the agenda.
