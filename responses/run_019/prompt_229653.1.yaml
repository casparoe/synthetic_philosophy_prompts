prompt: |-
  I am putting together a research proposal on hard choices, and before I commit to a positive view I want the specification of what any adequate theory in this area must deliver. Write the desiderata for a theory of hard choices: where a hard choice is one between options that cannot be ranked against a single scale of value, and where choosing well is nevertheless supposed to be possible rather than merely arbitrary. I want the requirements list, not a survey of positions.

  For each requirement: state it precisely, give the case or consideration that forces it, and say whether it is non-negotiable or a parochial commitment of some camp. In particular, the list should force a theory to say what relation holds between options when neither is better and they are not equal, and to distinguish incomparability, incommensurability in the narrow sense of there being no common cardinal unit, and parity (comparable but neither better nor worse nor exactly equal) — or to argue that one of these collapses into another, which would itself be a substantive commitment. Address at least these cases: the small-improvements phenomenon, in which slightly improving one option need not make it better than the other; rational regret after a well-made hard choice; the difference between a hard choice and optimization under uncertainty; the possibility that some choices constitute or revise values rather than express an antecedently complete ranking; and the aggregation of hard choices for policy, as when a fixed budget must be divided among goods of apparently different kinds. For each case, explain why it is a requirement rather than an optional feature.

  Then flag any subset of requirements you suspect cannot be jointly satisfied, and identify the single requirement that does the most to exclude the standard families of view: incomparability views, parity views, and views that reduce hard choices to ignorance or merely incomplete preferences. A table or numbered list is fine. Do not include citations; I will supply them.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Topic:** Research proposal on "hard choices."
      *   **Definition of Hard Choice:** Options cannot be ranked on a single scale of value, yet choosing well is possible (not arbitrary).
      *   **Goal:** A list of desiderata (requirements) for an adequate theory.
      *   **Format:** Precise statement, forcing case/consideration, status (non-negotiable vs. parochial).
      *   **Specific Content Requirements:**
          *   Must address the relation between options (neither better, not equal).
          *   Must distinguish/collapse: Incomparability, Incommensurability (narrow), Parity.
          *   Must address: Small-improvements phenomenon, Rational regret, Hard choice vs. uncertainty, Value constitution/revision, Aggregation/Policy.
          *   Must explain *why* it's a requirement.
          *   Must flag incompatible subsets.
          *   Must identify the single most exclusionary requirement.
      *   **Constraint:** No citations.

  2.  **Deconstruct the Core Problem:**
      *   Standard decision theory (utility maximization) assumes a complete ordering. Hard choices challenge this.
      *   If $A$ and $B$ are hard choices, standard trichotomy ($A>B, B>A, A=B$) fails.
      *   We need a relation $R$ such that $A R B$ holds, but it's not $>$, $<$, or $=$.
      *   We need to explain how rational choice is possible without a "best" option.
      *   We need to handle dynamic aspects (regret, value change).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Relational Gap.* Needs to define the status of $A$ and $B$.
          *   *Case:* Small Improvement. If $A$ and $B$ are on a par, $A+$ (slightly better A) isn't necessarily better than $B$. If they were equal, $A+$ would be better. If incomparable, $A+$ might still be incomparable.
          *   *Status:* Non-negotiable for the defined scope.

      *   *Requirement 2: Rational Selectability.* How do we choose?
          *   *Case:* Arbitrariness. If no option is better, why pick one? Theory must explain rationality without maximization.
          *   *Status:* Non-negotiable (part of the prompt's definition of hard choice).

      *   *Requirement 3: Distinction of Negative Relations.* Incomparability vs. Incommensurability vs. Parity.
          *   *Case:* Career choice (Art vs. Law). They aren't equal, but one isn't better. Are they incomparable (no relation) or on a par (positive relation)?
          *   *Status:* Non-negotiable (prompt asks to force this distinction or collapse).

      *   *Requirement 4: Rational Regret.*
          *   *Case:* Choosing Art over Law. Later, you regret it, but not because you made a mistake.
          *   *Status:* Non-negotiable (phenomenology of hard choices).

      *   *Requirement 5: Uncertainty Distinction.*
          *   *Case:* Hard choice vs. Risk. It's not just that I don't know the values; the values themselves resist ranking.
          *   *Status:* Non-negotiable (defines the metaphysics of the value, not epistemology).

      *   *Requirement 6: Value Constitution.*
          *   *Case:* Commitment. The choice makes the option better *because* I chose it.
          *   *Status:* Parochial? Some theories deny this (realism). But the prompt asks to address it. I will frame it as a requirement to *account for* the phenomenon, even if the theory denies the metaphysics. Actually, the prompt says "possibility that some choices constitute...". So the theory must accommodate or rule this out explicitly. Let's make it a requirement to explain the *appearance* or *reality* of this.
          *   *Refinement:* The theory must specify whether preferences are revealed or created.

      *   *Requirement 7: Aggregation/Policy.*
          *   *Case:* Budget allocation (Health vs. Arts).
          *   *Status:* Non-negotiable for a general theory (needs to scale).

  4.  **Refining and Polishing the Requirements:**
      *   Make sure the language is precise.
      *   Ensure the "Non-negotiable vs. Parochial" distinction is clear. (Most will be non-negotiable given the prompt's definition of hard choices, but Value Constitution might be parochial to "Will-based" views).
      *   Check the "Small Improvement" argument specifically. It's the standard test for Parity vs. Equality.

  5.  **Addressing the "Incompatible Subset" and "Most Exclusionary Requirement":**
      *   *Conflict:* Value Constitution (choices create value) vs. Aggregation (stable values needed for policy). If values change upon choice, how do we plan policy beforehand? Also, Realism about value vs. Constructivism.
      *   *Conflict:* Parity (positive relation) vs. Incomparability (no relation). A theory usually picks one.
      *   *Most Exclusionary:* The "Small Improvement" test (Requirement 1/3 combo). It kills the "Equality" view and forces a stance on Incomparability vs. Parity. It excludes standard Utility Theory immediately.

  6.  **Drafting the Content (Mental Check against constraints):**
      *   *No citations.* (Check.)
      *   *Table or List.* (List seems better for detailed explanations.)
      *   *Specific cases covered.* (Small improvement, regret, uncertainty, constitution, aggregation.)
      *   *Distinction of relations.* (Incomparability, Incommensurability, Parity.)

  7.  **Final Review of the "Non-negotiable" label:**
      *   Given the prompt defines a hard choice as "choosing well is nevertheless supposed to be possible," any theory that says "it's arbitrary" fails. So Rational Selectability is non-negotiable *for this project*.
      *   Given the prompt defines hard choice as "cannot be ranked against a single scale," standard Completeness is rejected.
      *   The distinction between Incomparability and Parity is theoretically crucial. A theory *must* take a stand. I will list the requirement as "Must explicate the relation," allowing the theory to collapse them, but it must argue for it.

  8.  **Constructing the Output:**
      *   Introduction acknowledging the task.
      *   Numbered Desiderata (1-7).
      *   Section on Incompatible Subsets.
      *   Section on the Most Exclusionary Requirement.

      *(Self-Correction during drafting)*: Make sure to clearly distinguish Incommensurability (no common unit) from Incomparability (no relation). One can have a common unit but still be on a par (according to parity theorists), or no common unit but still be comparable (via covering relations). The desideratum must force the theory to clarify this.

      *(Refining Requirement on Value Constitution)*: The prompt asks to address the *possibility*. So the requirement is: The theory must explain whether the choice tracks antecedent value or constitutes it.

      *(Refining Requirement on Aggregation)*: This is often overlooked. If $A$ and $B$ are on a par, how do we sum them against $C$? The theory needs a logic of combination.

  9.  **Final Polish:** Check tone (academic, precise, directive). Ensure no citations slip in. Ensure the "Small Improvement" argument is explicitly linked to the Parity/Equality distinction.

      *Wait, one nuance:* The prompt asks to "flag any subset of requirements you suspect cannot be jointly satisfied."
      *Candidate:* Value Constitution (dynamic values) + Policy Aggregation (stable values for calculation). If values are created by choosing, policy planning (which happens before choosing) lacks determinate values.
      *Candidate:* Parity (positive relation) + Incomparability (no relation). Obviously a theory can't have both as the *fundamental* relation, but the requirement is to *distinguish* them. The conflict is more about Rational Regret + Parity. If they are on a par, and I choose one, is regret rational? If they are truly on a par, why regret? Unless the act of choosing breaks the parity. This suggests a tension between the static relation and the dynamic choice.

      *Most Exclusionary:* The Small Improvement Argument. It rules out the "Equality" view (standard economics) and forces the "Incomparability vs. Parity" debate. It is the engine of the whole literature.

      *Let's write it.*
answer: |-
  ### Desiderata for a Theory of Hard Choices

  The following list specifies the conditions any adequate theory must meet to account for hard choices, defined as choices between options that resist ranking on a single scale yet permit rational selection.

  #### 1. The Non-Trichotomous Relation Requirement
  *   **Statement:** The theory must specify the normative relation holding between options $A$ and $B$ when neither is better than the other, nor are they exactly equal. It must explicitly state whether this relation is a positive comparative status (parity) or the absence of a relation (incomparability), or argue that the distinction collapses.
  *   **Forcing Case:** **The Small-Improvements Phenomenon.** If $A$ and $B$ are hard choices, and $A+$ is $A$ slightly improved, standard transitivity suggests that if $A = B$, then $A+ > B$. However, in hard choices, $A+$ is often not better than $B$. This rules out equality. If the theory claims $A$ and $B$ are incomparable, it must explain why $A+$ does not simply become comparable and superior. If it claims parity, it must explain the logic of this fourth relation.
  *   **Status:** **Non-negotiable.** This is the logical core of the definition provided. A theory that reverts to the standard trichotomy ($>, <, =$) fails to describe the phenomenon.

  #### 2. The Rational Selectability Requirement
  *   **Statement:** The theory must explain how an agent can rationally choose one option over the other without a fact of the matter that one is better. It must provide a norm of choice that does not rely on utility maximization or the identification of a unique best option.
  *   **Forcing Case:** **The Charge of Arbitrariness.** If neither option is better, critics argue choice is arbitrary (like flipping a coin). Yet, agents deliberate and feel their choice is justified. A theory that renders hard choices rationally permissible but not rationally required (or vice versa) must explain why the selection is not merely random.
  *   **Status:** **Non-negotiable.** The prompt definition stipulates that "choosing well is nevertheless supposed to be possible." A theory that concludes rational choice is impossible in these cases fails the brief.

  #### 3. The Conceptual Distinction Requirement
  *   **Statement:** The theory must distinguish between **incomparability** (no normative relation exists), **incommensurability** (no common cardinal unit of measurement exists), and **parity** (a sui generis comparative relation exists). It cannot use these terms interchangeably. If it argues one collapses into another (e.g., that incommensurability just is incomparability), it must provide an argument for the collapse.
  *   **Forcing Case:** **Career Choice (Art vs. Law).** One might argue Art and Law are incommensurable (no common unit like "hedons") but still comparable (one can be better). Or they might be incomparable (no relation). Conflating these leads to errors in reasoning about whether trade-offs are possible.
  *   **Status:** **Non-negotiable.** Precision in the metaphysics of value is required to avoid category errors. Conflation renders the theory unable to handle cases where options are measurable but not rankable, or rankable but not measurable.

  #### 4. The Rational Regret Requirement
  *   **Statement:** The theory must account for the possibility of rational regret following a well-made hard choice. It must explain how an agent can regret a choice without judging that they made a mistake or that the forgone option was objectively better.
  *   **Forcing Case:** **Post-Choice Residue.** After choosing Art over Law, an agent may legitimately mourn the loss of Law without wishing to undo the choice. Standard decision theory implies regret entails error (you chose the lesser good). A theory of hard choices must accommodate regret that is consistent with rationality.
  *   **Status:** **Non-negotiable.** This is a robust phenomenological datum of hard choices. A theory that cannot accommodate rational regret fails to match the lived experience of the agency it purports to model.

  #### 5. The Epistemic/Metaphysical Distinction Requirement
  *   **Statement:** The theory must distinguish hard choices from **optimization under uncertainty**. It must specify whether the difficulty arises from the agent's ignorance of the values (epistemic) or from the structure of the values themselves (metaphysical).
  *   **Forcing Case:** **Hard Choice vs. Risk.** In risk, probabilities and values exist but are unknown. In hard choices, the values may be known precisely yet still resist ranking. Reducing hard choices to ignorance implies that with enough information, the trichotomy would be restored. The theory must argue for or against this.
  *   **Status:** **Non-negotiable.** Reducing hard choices to ignorance dissolves the philosophical problem into a technical one of information gathering. Given the prompt's definition ("cannot be ranked"), the theory must treat the ranking failure as structural, not merely epistemic.

  #### 6. The Value Constitution Requirement
  *   **Statement:** The theory must take a stance on whether choices **express** antecedent rankings or **constitute/revise** values. If values are constituted by choice, the theory must explain the normativity of the pre-choice deliberation. If values are antecedent, it must explain the source of the ranking failure.
  *   **Forcing Case:** **Commitment and Will.** Often, choosing Art makes Art the right choice for the agent in a way it wasn't before. If the theory denies value constitution, it must explain this feeling as illusory. If it affirms it, it must explain how the choice is not merely willful fiat.
  *   **Status:** **Parochial Commitment.** Realist camps will deny constitution; Constructivist/Existentialist camps will affirm it. However, the theory *must* address the phenomenon explicitly rather than ignoring it.

  #### 7. The Aggregation and Policy Requirement
  *   **Statement:** The theory must explain how hard choices scale to policy and aggregation. It must provide a logic for combining options that are on a par or incomparable when allocating fixed resources among distinct goods.
  *   **Forcing Case:** **Budget Allocation.** A government must divide funds between Health and Arts. If these goods are on a par, how does one calculate a "best" distribution? If they are incomparable, is any distribution arbitrary? A theory that works for individual choice but fails for collective allocation is insufficient for general normative theory.
  *   **Status:** **Non-negotiable.** Individual normative theory must be consistent with collective normative theory. If the logic of hard choices prevents social planning, the theory has high revisionary costs that must be acknowledged.

  ***

  ### Incompatible Subsets and Exclusionary Power

  #### Suspected Incompatible Subset
  **Requirement 6 (Value Constitution) and Requirement 7 (Aggregation/Policy).**
  There is a significant tension between the claim that choices constitute or revise values and the requirement to aggregate values for policy.
  *   **The Conflict:** Policy planning requires stable values *ex ante* to calculate optimal distribution of resources. If values are only constituted *in* the choosing (Requirement 6), then pre-choice policy deliberation lacks determinate inputs. A theory that strongly affirms value constitution risks making policy planning impossible or purely heuristic, violating the demand for a robust logic of aggregation (Requirement 7). Conversely, a theory that secures aggregation by fixing values antecedently undermines the constitutive power of individual choice.

  #### The Most Exclusionary Requirement
  **Requirement 1 (The Non-Trichotomous Relation Requirement), specifically via the Small-Improvements Phenomenon.**

  This is the single most exclusionary requirement because it immediately eliminates the dominant family of views: **Standard Utility Maximization and Completeness Views.**
  *   **Why:** Standard decision theory relies on the completeness axiom (for any $A, B$, either $A \geq B$ or $B \geq A$). The Small-Improvements argument demonstrates that in hard choices, $A$ is not better than $B$, $B$ is not better than $A$, and $A$ is not equal to $B$ (because $A+$ is not better than $B$).
  *   **Exclusionary Force:**
      *   It excludes **Incomparability Views** that treat the relation as a simple lack of comparison (unless they can explain why $A+$ doesn't resolve the lack).
      *   It excludes **Ignorance Views** (Requirement 5) because the phenomenon persists even when all facts are known.
      *   It forces **Parity Views** to adopt a non-standard logic (intransitivity or non-archimedean scales).
      *   It forces **Equality Views** to deny the intuition that $A+$ is not better than $B$.

  Any theory that cannot solve the Small-Improvements puzzle without reverting to "one *must* be better, we just don't know which" or "they *must* be equal" fails to engage with the hard choice as defined. It is the gatekeeper for the entire research area.
