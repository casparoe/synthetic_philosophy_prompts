prompt: |-
  im trying to settle, once and for all, whether talk of DNA carrying information or being a genetic code is literal or just a really useful metaphor, and I keep noticing that people argue past each other because one person means Shannon-style correlation and the other means semantic content. Before I read another paper on it, I want the spec. Write me the desiderata for a theory of genetic information: the list of requirements any account has to meet for the claim "DNA carries information" or "the genetic code is a real code" to be more than a loose way of talking. For each requirement, give the case or consideration that forces it, and mark which you think are non-negotiable and which are just preferences of one camp. Then flag any pairs of requirements that might not be jointly satisfiable -- if the list itself amounts to an argument for or against literalism, I want that part especially. a table is fine.

  Some things I already suspect need to be handled, but I want you to make the case for or against each rather than just take my word for it: the arbitrariness of codon assignment (the triplet-to-amino-acid mapping is not forced by chemistry, so an account cant fall back on chemical necessity to explain why a sequence says one thing rather than another); the no-homunculus problem (the "reader" is tRNAs, aminoacyl-tRNA synthetases, and the ribosome, not a mind); translation as blind molecular machinery; synonymous codons, wobble, and how a misreading differs from a changed message; noncoding DNA, pseudogenes, regulatory sequence -- does information attach to all of it or only to what gets translated; what the information is supposed to be about (protein sequence? phenotype? something else) without the account circling back on itself; the fact that the same sequence can do different things in different cellular contexts (splicing, methylation, developmental environment); the fact that high Shannon information and functional importance come apart (a random sequence can be information-rich in one sense and do nothing in the other); how genuinely new coding sequences can arise by mutation and selection without an outside informant; and the bootstrapping one -- the genome encodes the very synthetases and ribosomal components that implement the reading of the code, so the account has to allow the code to specify its own interpreter without a vicious regress or a designer. If you think some of these are red herrings, say so and why.

  Finally, keep the scoring short: a paragraph each on how the main camps (causal/Shannon, semantic/teleosemantic, and outright eliminativist/metaphor-only) fare against your list. I care about the criteria more than the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Settle the debate on whether DNA information/code is literal or metaphorical.
      *   **Task:** Create a list of *desiderata* (requirements) for a theory of genetic information.
      *   **Structure:** For each requirement, provide the case/consideration forcing it, mark it as Non-Negotiable (NN) or Camp Preference (CP), and flag incompatibilities (tensions).
      *   **Specific Issues to Address:** Arbitrariness, No-Homunculus, Blind Machinery, Synonymous Codons/Wobble, Noncoding DNA, Content/Aboutness, Context-Dependence, Shannon vs. Function, Evolution of New Code, Bootstrapping (Interpreter encoded by Genome).
      *   **Ending:** Short scoring paragraph for three camps (Causal/Shannon, Semantic/Teleosemantic, Eliminativist).
      *   **Tone:** Philosophical, rigorous, analytical, avoiding fluff.
      *   **Format:** Table is allowed (and requested).

  2.  **Deconstruct the Core Conflict:**
      *   The user identifies the root problem: conflating *Shannon information* (correlation/surprise) with *Semantic information* (meaning/aboutness).
      *   To claim "literal code," one usually needs semantic content (syntax + semantics). To claim "metaphor," one usually argues that biology lacks the intentionality required for semantics.
      *   The "Bootstrapping" problem is crucial: In human communication, the sender/receiver/code exist prior to the message. In biology, the genome builds the receiver (ribosome/synthetases).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Arbitrariness.* If the mapping is chemically necessary, it's not a code, it's a law. (NN)
      *   *Requirement 2: No Homunculus.* The "reader" must be mechanistic, not mental. (NN)
      *   *Requirement 3: Distinction between Noise/Error and Meaning.* A mutation must be distinguishable from a functional variant. (NN)
      *   *Requirement 4: Content Specificity.* What is the information *about*? Protein? Trait? (CP - this is where camps fight).
      *   *Requirement 5: Context Independence/Stability.* If meaning changes entirely with context, is it encoded or enacted? (CP/NN tension).
      *   *Requirement 6: Functional vs. Statistical.* High entropy $\neq$ function. (NN).
      *   *Requirement 7: Evolvability.* New meanings must arise without a designer. (NN).
      *   *Requirement 8: Bootstrapping.* The system must specify its own interpreter. (NN).

      *Refining the Tensions:*
      *   Arbitrariness vs. Chemical Constraint: It's not *totally* arbitrary (stereochemistry plays a role), but it must be contingent enough to be a code.
      *   Context Dependence vs. Stable Content: If the phenotype depends on the environment, is the DNA still "coding" for it?
      *   Bootstrapping vs. Regress: If DNA codes for the ribosome, what reads the DNA to make the ribosome? (The "Chicken and Egg" of semiotics).

  4.  **Developing the Table:**
      *   Columns: Requirement, Rationale/Case, Status (NN/CP), Tensions.
      *   Rows: The specific issues raised by the user.

      *Self-Correction on "Non-Negotiable":* What is truly NN? For a *literal* claim, Arbitrariness and No-Homunculus are NN. For a *scientific* claim, Evolvability is NN. For a *semantic* claim, Aboutness is NN. I need to frame these as requirements for the claim "DNA carries information" to be *literal* (as per the prompt's goal).

      *Re-evaluating "Bootstrapping":* This is the hardest one. If the genome encodes the interpreter, does that invalidate the code status? Or does it just mean the code is *self-organizing*? A literal theory must explain this without invoking a prior designer.

      *Re-evaluating "Noncoding DNA":* If only exons are "information," what are introns? If everything is information, the term loses specificity. This is a boundary condition.

  5.  **Addressing the Specific Suspicions:**
      *   *Arbitrariness:* Must be addressed. If codon AA mapping is chemically forced, it's not a code.
      *   *Homunculus:* Must be addressed. No little man reading the tape.
      *   *Synonymous Codons:* Redundancy doesn't kill information, but it complicates the "message."
      *   *Noncoding:* Boundary problem.
      *   *Aboutness:* The "Intentionality" problem.
      *   *Context:* The "Developmental System" critique.
      *   *Shannon vs. Function:* The "Meaning vs. Noise" problem.
      *   *Evolution:* The "Origin" problem.
      *   *Bootstrapping:* The "Interpreter" problem.

  6.  **Drafting the Scoring:**
      *   *Causal/Shannon:* Good on stats, bad on meaning.
      *   *Semantic/Teleosemantic:* Good on function/evolution, struggles with bootstrapping/arbitrariness.
      *   *Eliminativist:* Good on avoiding category errors, bad on explaining the specific causal role of sequence order.

  7.  **Final Review against Constraints:**
      *   Table format? Yes.
      *   Case for each? Yes.
      *   NN vs CP? Yes.
      *   Flag tensions? Yes.
      *   Address specific user suspicions? Yes.
      *   Short scoring paragraphs? Yes.
      *   Tone: Philosophical spec.

  8.  **Refining the Content (Mental Check):**
      *   *Tension:* Arbitrariness (NN) vs. Bootstrapping (NN). If the code is arbitrary, how did it evolve without a designer to agree on the standard? If it evolved, was it arbitrary or selected? This is the core friction.
      *   *Tension:* Stable Content (NN for code) vs. Context Dependence (Empirical fact). If the output varies by context, is the "message" stable?
      *   *Red Herrings:* Synonymous codons aren't a dealbreaker (error correction/redundancy exists in human codes). Noncoding DNA isn't a dealbreaker (comments/whitespace in programming).

  9.  **Final Polish:** Ensure the distinction between "Information as correlation" and "Information as instruction/meaning" is clear in the criteria. (Proceed to generate output).

  *(Self-Correction during drafting)*: Make sure I don't just list the user's points but transform them into *criteria* for a theory. For example, instead of "Arbitrariness," the criterion is "Contingency of Mapping." Instead of "No Homunculus," the criterion is "Mechanistic Realization."

  *(Check on "Non-Negotiable"):* I need to be careful. If I mark "Semantic Content" as NN, I bias towards literalism. If I mark it as CP, I allow Shannon theories. The prompt asks for requirements for the claim to be *more than a loose way of talking*. So, for *literalism*, semantic content is NN. For *scientific utility*, Shannon is NN. I will frame the NN/CP relative to the goal of establishing *literal* code status, as that is the user's primary question ("literal or just a really useful metaphor").

  *Wait, one nuance:* The user asks for desiderata for a theory of genetic information *such that* the claim is more than metaphor. So the NN criteria are the hurdles for Literalism.

  *Let's build the table.*
  *   Criterion 1: Contingent Mapping (Arbitrariness).
  *   Criterion 2: Mechanistic Interpretation (No Homunculus).
  *   Criterion 3: Error vs. Variation (Synonyms/Wobble).
  *   Criterion 4: Specific Content (Aboutness).
  *   Criterion 5: Context Stability (Environment).
  *   Criterion 6: Functional Correlation (Shannon vs. Function).
  *   Criterion 7: Evolutionary Origin (No Designer).
  *   Criterion 8: Reflexive Closure (Bootstrapping).

  *Tensions:* 1 & 7 (Arbitrary vs. Evolved), 4 & 5 (Aboutness vs. Context), 2 & 8 (Mechanism vs. Reflexivity).

  *Scoring:* Keep it tight.

  *Ready to write.*
answer: |-
  Here are the desiderata for a theory of genetic information sufficient to sustain the claim that DNA carries *literal* information (semantic content) rather than merely functioning as a causal template (metaphor/Shannon correlation).

  ### Desiderata for a Theory of Genetic Information

  | Requirement | Case / Consideration | Status | Tensions / Incompatibilities |
  | :--- | :--- | :--- | :--- |
  | **1. Contingency of Mapping** | **The Arbitrariness Condition:** For a mapping to be a code rather than a chemical law, the relationship between signifier (codon) and signified (amino acid) must not be chemically necessitated. If stereochemistry forces the pairing, it is physics, not semiotics. | **Non-Negotiable** (for literalism) | **vs. Evolutionary Origin:** If the mapping is truly arbitrary, how did it fixate without a convention-agreeing agent? If it was selected for chemical stability, is it still arbitrary? |
  | **2. Mechanistic Interpretation** | **The No-Homunculus Condition:** The "reading" of the code must be fully explicable via blind molecular machinery (ribosomes, synthetases). No implicit mind or intentional agent can be presupposed in the decoding process. | **Non-Negotiable** | **vs. Semantic Content:** Mechanistic causation is typically description-free. Explaining how blind machinery respects *meaning* rather than just *shape* is the hard problem. |
  | **3. Error Discrimination** | **The Normativity Condition:** The theory must distinguish between a "misreading" (mutation/error) and a "functional variant" (synonymous codon/wobble). A code implies a standard of correctness; mere causation does not. | **Non-Negotiable** | **vs. Context Dependence:** If cellular context determines whether a sequence is functional or junk, the "standard of correctness" is external to the DNA, weakening the claim that DNA *holds* the norm. |
  | **4. Specific Content (Aboutness)** | **The Intentionality Condition:** The theory must specify what the information is *about* without circularity. Is it about the protein? The phenotype? The organism's fitness? If it is just "about causing itself," it is causal, not semantic. | **Non-Negotiable** (for semantic views) | **vs. Causal/Shannon View:** Shannon information is explicitly *not* about semantic content. Demanding this rules out pure causal accounts by definition. |
  | **5. Context Stability** | **The Portability Condition:** For DNA to carry the information, the "message" must remain stable across varying cellular environments (splicing, methylation, developmental stage). If the output is wholly determined by the context, the DNA is a switch, not a blueprint. | **Camp Preference** (Literalists want this; Developmental Systems theorists reject it) | **vs. Empirical Reality:** Gene expression is highly context-sensitive. Insisting on stability risks falsification; accepting variability risks reducing DNA to just one causal factor among many. |
  | **6. Functional Correlation** | **The Shannon-Function Gap:** The theory must explain why high statistical surprise (Shannon entropy) often correlates poorly with functional importance (e.g., random sequences have high entropy but no function). Information must track *constraint*, not just *surprise*. | **Non-Negotiable** | **vs. Measurement:** Shannon metrics are mathematically precise; functional metrics are biologically messy. Bridging them requires a theory of function (e.g., selection). |
  | **7. Evolutionary Origin** | **The No-Designer Condition:** New coding sequences and the code itself must arise via mutation and selection without an external informant. The theory cannot rely on an intelligent source to inject the information. | **Non-Negotiable** | **vs. Contingency (Req 1):** Explaining the origin of an arbitrary code without a designer is the "origin of life" semiotic problem. |
  | **8. Reflexive Closure** | **The Bootstrapping Condition:** The genome encodes the interpreters (tRNA synthetases, ribosomal proteins). The theory must explain how the code specifies its own reader without vicious regress or requiring the reader to pre-exist the code. | **Non-Negotiable** | **vs. Mechanistic Interpretation (Req 2):** If the reader is built by the message, what reads the message to build the reader? This creates a chicken-and-egg loop for literal code theories. |

  ### Analysis of Red Herrings
  *   **Synonymous Codons/Wobble:** This is **not** a dealbreaker. Human language and computer code utilize redundancy for error correction and timing control. As long as the mapping is rule-governed (Req 3), redundancy is compatible with literal coding.
  *   **Noncoding DNA:** This is **not** a dealbreaker. Literal code theories can accommodate "whitespace," "comments," or "regulatory syntax" outside of translated regions. However, if *too much* DNA is functionless, it weakens the "genome as program" analogy (Req 6).

  ### Scorecard: How the Camps Fare

  **Causal / Shannon Information Theory**
  This camp clears the **Mechanistic Interpretation** and **Shannon-Function** hurdles easily by treating information as physical correlation and entropy reduction. It avoids the **Bootstrapping** problem by treating the interpreter as just another causal link in the chain. However, it fails the **Contingency** and **Specific Content** requirements by design; it explicitly denies semantic "aboutness," rendering the claim "DNA carries information" literal only in a mathematical sense, not a semantic one. It survives by lowering the definition of "information" to "correlation," which critics argue begs the question against the literalist intuition.

  **Semantic / Teleosemantic Theory**
  This camp (e.g., Godfrey-Smith, Maynard Smith) attempts to meet the **Specific Content** and **Error Discrimination** requirements by grounding meaning in evolutionary history (selected effect functions). It handles **Evolutionary Origin** well by naturalizing function. However, it struggles significantly with **Bootstrapping** and **Contingency**. If the code is established by selection, the "mapping" is not arbitrary but fixed by chemical/fitness constraints, blurring the line between code and law. Furthermore, explaining how the first interpreter arose to read the first code without a regress remains a significant vulnerability in their account of the *origin* of the code, even if it explains the *maintenance*.

  **Eliminativist / Metaphor-Only Theory**
  This camp (e.g., Keller, Oyama) scores highest on **Context Stability** and **No-Homunculus** rigor, arguing that because the "meaning" of a sequence is entirely dependent on the cellular context and developmental system, attributing information to the DNA alone is a category error. They successfully highlight the **Bootstrapping** paradox to argue that the "code" is an emergent property of the whole system, not a property of the molecule. Their weakness is pragmatic: they fail to offer a replacement vocabulary that captures the specific causal privilege of sequence order as efficiently as the information metaphor does, making their account scientifically cumbersome despite its ontological caution.

  ### The Core Incompatibility
  The list itself argues against a "perfect" literalism. The tension between **Contingency of Mapping** (Req 1) and **Evolutionary Origin** (Req 7) is the critical fracture. For DNA to be a *literal code* like human language, the mapping must be arbitrary (conventional). But for it to be a *natural phenomenon*, the mapping must be necessitated (selected/chemical). You can have a code that is arbitrary (human language) or a system that is evolved (crystal growth), but a theory of *evolved arbitrary code* requires a mechanism for fixing conventions without agents. If you solve that, you have a theory of literal genetic information. If you cannot, the "code" remains a powerful, perhaps indispensable, metaphor for a complex causal process that mimics semantics without possessing them.
