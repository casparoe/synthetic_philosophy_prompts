      *   *Difference:* The source of uncertainty is different. Lottery = statistical/probabilistic by design. Preface = error-prone human cognition/complexity.
      *   *Consensus:* Most epistemologists agree they are "cousins" but not identical twins. Some solutions work for both (e.g., denying conjunction closure), but some work for one and not the other (e.g., contextualism, normic support).
      *   *Key Philosophers:* Kyburg (Lottery), Makinson (Preface), Douven, Williamson, Smith.

