      *   **Normic Support (Martin Smith):** This is a big one. Lottery propositions don't have normic support (a losing ticket doesn't *call for an explanation* if it wins, it's just chance). Preface claims *do* have normic support (if a claim is false, something went wrong in the research process).
      *   **Pragmatics/Assertion:** Asserting "Ticket 742 will lose" feels weird. Asserting "Claim 34 is true" feels normal for an author.
