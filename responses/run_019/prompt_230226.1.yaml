answer: |-
  This is an excellent breakdown of a common rhetorical move. Your intuition is correct: "Victor's Justice" functions as a **semantic stopsign**. It sounds like a substantive legal critique, but it often operates as a conversation-ender that conflates the *origin* of a tribunal with the *validity* of its findings.

  To help you run this reading group, here is a dissection of the four distinct theses hidden inside the slogan, evaluated according to your criteria, followed by an analysis of what your brother-in-law (BIL) needs to prove to sustain his conclusion.

  ### 1. The Four Theses of "Victor's Justice"

  Here are the distinct claims smuggled into the phrase, categorized by their truth value and their impact on legal legitimacy.

  #### Thesis A: Structural Bias (The Winners Staffed the Court)
  *   **The Claim:** The judges, prosecutors, and rules were appointed solely by the Allied powers; the defeated had no representation in the court's creation.
  *   **Evaluation:** **Trivially True.** The International Military Tribunal (IMT) and the IMTFE (Tokyo) were established by the London Charter and MacArthur's Special Proclamation, respectively. There were no neutral or Axis-appointed judges.
  *   **Impact on Legitimacy:** **Defensible-but-Irrelevant (mostly).** All domestic criminal courts are "biased" in this sense (the state appoints the judges to judge the accused). The mere fact that the victors created the court does not inherently negate the rule of law, provided the court operates independently *after* creation. This thesis attacks the *political origin*, not the *judicial function*.

  #### Thesis B: Ex Post Facto Criminalization (Nullum Crimen Sine Lege)
  *   **The Claim:** The defendants were convicted of crimes (specifically "Crimes Against Peace" / waging aggressive war) that were not clearly defined as individual criminal offenses prior to the acts.
  *   **Evaluation:** **Factually Shaky / Legally Debated.** It is true that individual criminal liability for "aggressive war" was novel. However, it is shaky to claim there was *no* law. The Kellogg-Briand Pact (1928) had outlawed war as an instrument of national policy. The defense argued this created state liability, not individual criminal liability. The Tribunal ruled that individuals who violate international treaties are criminally liable.
  *   **Impact on Legitimacy:** **Genuine Problem (Philosophical).** This is the strongest *legal* critique. If law must be prospective to be legitimate, Nuremberg violated liberal legal principles. However, the counter-argument is "manifest criminality" (they knew murder and invasion were wrong regardless of the statute).

  #### Thesis C: Selective Prosecution (Hypocrisy)
  *   **The Claim:** Atrocities committed by the victors (Dresden, Hiroshima, Soviet Katyn massacre) were not investigated or prosecuted, rendering the law arbitrary.
  *   **Evaluation:** **Trivially True.** No Allied personnel were indicted.
  *   **Impact on Legitimacy:** **Defensible-but-Irrelevant (for individual guilt) / Genuine Problem (for systemic legitimacy).**
      *   *For Individual Guilt:* Irrelevant. That the Allies bombed Dresden does not make the Holocaust legal. My guilt is not negated by your hypocrisy.
      *   *For Systemic Legitimacy:* Genuine Problem. A legal system that applies laws selectively risks becoming a tool of policy rather than a system of justice. This undermines the *precedential value* of the trials for future international law.

  #### Thesis D: Procedural Rigging (Predetermined Outcomes)
  *   **The Claim:** The judges ignored defense objections, restricted evidence, or ruled on legal challenges in ways that guaranteed conviction regardless of the evidence.
  *   **Evaluation:** **Factually Shaky (Nuremberg) / Factually Stronger (Tokyo).**
      *   *Nuremberg:* Defendants had counsel, could cross-examine witnesses, and the tribunal acquitted 3 defendants and hung 3 others. This suggests the outcome was not fully predetermined.
      *   *Tokyo:* MacArthur exerted significant influence; the Emperor was exempted from testimony/indictment by fiat; Justice Pal's dissenting opinion (arguing all defendants were innocent) was ignored/suppressed in the immediate aftermath.
  *   **Impact on Legitimacy:** **Genuine Problem.** If the procedure is rigged, the verdict is not law; it is force. This is the only thesis that directly supports the claim that the trial was "theater."

  ---

  ### 2. What Your BIL Needs for the "Theater" Conclusion

  Your BIL concludes: *"International law is basically theater."*

  To move from "Nuremberg/Tokyo had flaws" to "International Law is Theater," he needs to rely primarily on **Thesis D (Procedural Rigging)** and universalize it.

  *   **Why Thesis A & C aren't enough:** Acknowledging that the winners built the court (A) or were hypocritical (C) admits that the *politics* were messy, but leaves open the possibility that the *facts* found were true and the *law* applied was sound. You can have a biased court that nonetheless reaches a just verdict based on evidence.
  *   **Why Thesis B isn't enough:** Arguing *ex post facto* law makes the trial "unjust" in a liberal sense, but not necessarily "theater." It could still be a sincere, albeit retroactive, application of morality.
  *   **The Necessary Leap:** To call it "theater," he must argue that **Thesis A (Structural Bias) inevitably causes Thesis D (Procedural Rigging).** He must claim that because the victors appointed the judges, the judges *could not* rule against the victors' interests.

  **The Weakness in his Argument:**
  He is committing a **Genetic Fallacy**. He is treating the *origin* of the tribunal (Victors) as settling the *truth value* of the verdicts. For the "Theater" conclusion to hold, he must demonstrate that the evidence (e.g., Nazi documents, gas chamber blueprints, orders) was fabricated or ignored, not just that the judges were appointed by Churchill and Roosevelt.

  ---

  ### 3. Can Nuremberg be Defensible while Tokyo Was Not?

  **Yes.** A sophisticated legal historian can hold this position without contradiction. This distinction relies on the variance in **Thesis D (Procedure)** and **Thesis C (Selectivity).**

  *   **Nuremberg (IMT):**
      *   **Procedure:** Robert Jackson (US Chief Prosecutor) insisted on a documentary case. The defendants had reputable German counsel. The tribunal issued acquittals (Schacht, Papen, Fritzsche) and commuted some sentences. This proves the court was not a mere rubber stamp.
      *   **Verdict:** The findings of fact regarding the Holocaust and aggressive war are largely supported by independent historical evidence discovered after the fact.
  *   **Tokyo (IMTFE):**
      *   **Procedure:** General MacArthur controlled the tribunal more tightly. Defense counsel faced greater obstacles.
      *   **Selectivity:** The exemption of the Emperor was a explicit political deal, not a legal finding, which undermined the legal consistency of the "chain of command" prosecutions.
      *   **Dissent:** Justice Radhabinod Pal (India) wrote a massive dissent arguing that the tribunal was merely victor's justice and that all defendants should be acquitted. While Pal's reasoning is controversial (and often misused by apologists), the fact that the majority opinion struggled to reconcile the Emperor's immunity with the guilt of his generals weakens Tokyo's legal coherence compared to Nuremberg.

  **Reading Group Tip:** If a participant argues "Nuremberg was victor's justice," ask them: *"Does the fact that 3 defendants were acquitted change your view on whether the outcome was predetermined?"*

  ---

  ### 4. Does the Slogan Overreach? (Origin vs. Verdict)

  **Yes, significantly.** The slogan treats a complaint about *how a tribunal came to exist* as if it settles the *legitimacy of every single verdict it produced.*

  This is the **Fallacy of Composition**. Even if the *institution* was politically compromised (Thesis A), it does not follow that every *factual finding* was false.
  *   **Example:** If a corrupt cop plants evidence, the arrest is illegitimate. But if a corrupt cop arrests a murderer caught on video, the arrest is procedurally flawed, but the *guilt* of the murderer is not negated.
  *   **Application:** The "Victor's Justice" slogan implies that because the Allies won, the findings of the Holocaust or the invasion of Poland are suspect. This is historically untenable. The documentary evidence existed independently of the judges' appointments.

  **For your reading group:** You can frame this as the difference between **Political Legitimacy** (Who authorized this?) and **Legal Legitimacy** (Was the process fair and the evidence sound?). "Victor's Justice" successfully attacks the former but fails to automatically dismantle the latter without further evidence of procedural rigging.

  ### Summary for Your Discussion Guide

  If you want to pin your BIL (or students) down, ask them to specify which "Victor's Justice" they mean:

  1.  **"Do you mean the court was politically biased?"** (Trivially true, but doesn't make the verdicts false).
  2.  **"Do you mean the law was retroactive?"** (A valid legal critique, but doesn't make it 'theater').
  3.  **"Do you mean the winners weren't prosecuted?"** (Hypocrisy, but doesn't negate the losers' guilt).
  4.  **"Do you mean the judges ignored evidence to guarantee conviction?"** (This is the only one that makes it 'theater,' and it is historically weakest regarding Nuremberg).

  If they cannot specify, they are using the phrase as a shield against engaging with the actual legal and historical record.
