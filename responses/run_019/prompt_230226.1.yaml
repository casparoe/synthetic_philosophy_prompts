          *   Truth Value: Trivially True. No Allies were prosecuted.
          *   Legitimacy Impact: Defensible-but-Irrelevant (for individual guilt) vs. Genuine Problem (for institutional legitimacy). If I'm guilty, it doesn't matter you didn't catch your friend. *However*, for a *system* of law, consistent application matters.
      *   *Thesis 4: Procedural Unfairness (Judges ignored defense).*
          *   Truth Value: Factually Shaky (for Nuremberg), More True (for Tokyo). Nuremberg defendants had counsel and could cross-examine. Tokyo was more chaotic/controlled by MacArthur.
