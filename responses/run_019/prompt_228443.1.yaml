  **The Predictable Agent**

  The oracle flipped a fair and silver **coin**,
  It landed heads or else it landed **tails**.
  But no envelope arrived, no printed **letter**,
  No threat of bugs or wood-eating **termites**,
  Just a demand that you should freely **pay**,
  Based on a counterfactual **prediction**.

  Here the logic hinges on a grim **prediction**,
  No metal disk, no flipping of a **coin**,
  But still you face the choice to **pay** or not.
  The chance is gone, weighted like heavy **tails**,
  Whether you suffer from the hidden **termites**,
  Or find your home safe inside the **letter**.

  You search the mailbox for a threatening **letter**,
  But find only the oracle's **prediction**.
  No wood rot here, no whisper of **termites**,
  Just the memory of the tossed **coin**.
  It shows the side that never wins, the **tails**.
  CDT says keep your cash, do not **pay**.

  EDT says you really ought to **pay**,
  To validate the good news in the **letter**.
  Though the damage falls like weighted **tails**,
  You buy evidence against the **prediction**.
  No chance involved, no spinning of a **coin**,
  Just silent wood hiding the **termites**.

  No gnawing sound, no colony of **termites**,
  Just the cold loss because you refused to **pay**.
  The ex-ante value of the **coin**
  Is lost, though no one sent a **letter**.
  You failed the test of the original **prediction**,
  Because you feared the phantom of the **tails**.

  Now chance returns, imagined as the **tails**,
  That might have saved you from the **termites**.
  But here the loss confirms the **prediction**.
  You spent a grand you did not need to **pay**.
  Bad news arrives inside the **letter**.
  While CDT holds tight its useless **coin**.

  Whether fallen **tails** compels you **pay**,
  Or rotting **termites** hide inside the **letter**,
  Be the **policy** your **prediction** binds to **coin**.
