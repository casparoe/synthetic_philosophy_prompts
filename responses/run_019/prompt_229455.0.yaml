answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Mechanisms of Few-Shot Concept Induction (The "Bongard Protocol")
  **Parties:** Camp A (Rule-Inference / Symbolic) & Camp B (Similarity-Field / Connectionist)
  **Date:** October 26, 2023

  ## PREAMBLE
  We acknowledge that the task of inducing a category rule from a finite set of examples (the Bongard problem) is formally underdetermined. Any finite set of observations is consistent with infinitely many hypotheses. Yet, human learners converge on specific solutions rapidly, often with high agreement. We disagree on the internal machinery that achieves this convergence. This document outlines our common ground, our specific disagreements, the empirical cruxes that might resolve them, and the pre-registered stimuli we propose to test them.

  ---

  ## 1. COMMON GROUND (SIGNED BY BOTH CAMPS)
  *We agree on the following constraints and phenomena. Any viable model must account for these.*

  1.  **The Underdetermination Constraint:** The sensory data provided in a few-shot learning task (e.g., six positive examples) is logically insufficient to guarantee a unique solution. Convergence requires inductive bias.
  2.  **The Speed Constraint:** Human concept acquisition in these tasks often occurs within seconds or minutes, ruling out exhaustive search or slow reinforcement learning.
  3.  **The Generalization Target:** The goal of the system is not to memorize the training set but to classify novel test items that were not present during induction.
  4.  **The Error Signature:** Systematic errors occur. Learners do not guess randomly; they make predictable over-extensions or under-extensions based on the structure of the stimuli.
  5.  **The Attentional Bottleneck:** Learners cannot process all features of all examples simultaneously. Feature selection or weighting is required before classification.
  6.  **The Context Sensitivity:** The induced concept is sensitive to the contrast set (the negative examples). Changing the negative examples can change the rule induced for the positive examples, even if the positive examples remain identical.
  7.  **The Verbalization Gap:** There is a dissociation between the ability to classify an item and the ability to verbally articulate the rule governing it, though the two are correlated.

  ---

  ## 2. DISAGREEMENT TABLE
  *We disagree on the representational format and the computational process. We refuse to blend these positions.*

  | Question | Camp A (Rule-Inference) | Camp B (Similarity-Field) |
  | :--- | :--- | :--- |
  | **1. What is stored after learning?** | A discrete, compositional structure (a "program" or logical formula) that explicitly defines necessary and sufficient conditions. | A set of weighted exemplars, a prototype vector, or a tuned decision boundary in a high-dimensional feature space. |
  | **2. How is a new item classified?** | By executing the stored program on the new item. The output is binary (True/False) based on logical satisfaction. | By computing a distance metric (similarity) between the new item and the stored representation. The output is a gradient of "fit." |
  | **3. What explains generalization?** | Systematicity. If the rule uses variables (e.g., "X encloses Y"), it applies to any X and Y, regardless of perceptual overlap with training data. | Interpolation. Generalization works best for items "near" the training cluster in feature space. Performance degrades with distance. |
  | **4. What is the nature of an error?** | A bug in the hypothesis. The learner selected the wrong logical operator or missed a constraint (e.g., confusing "AND" for "OR"). | Noise in the similarity metric or poor feature weighting. The item is a "borderline case" in the psychological space. |
  | **5. Is the process conscious?** | Potentially. The rule is, in principle, fully verbalizable because it is composed of semantic primitives. | Largely no. The "feeling" of similarity is the output of sub-symbolic activation; the reasoning is opaque. |
  | **6. How is complexity measured?** | By the length of the description (Kolmogorov complexity). Shorter logical descriptions are preferred (Occam's Razor). | By the smoothness of the decision boundary. Simpler boundaries require less computational energy to maintain. |

  ---

  ## 3. CRUXES
  *These are the sub-questions where empirical evidence could force one camp to abandon its core mechanism.*

  1.  **The Zero-Overlap Transfer:** Can learners generalize a rule to test items that share *no* perceptual features with the training items, relying solely on relational structure?
      *   *If Yes:* Strong point for Camp A.
      *   *If No:* Strong point for Camp B.
  2.  **The Verbalization Ceiling:** When classification accuracy is at 100%, does the ability to verbalize the rule also hit 100%?
      *   *If Accuracy is high but Verbalization is low:* Strong point for Camp B (implicit similarity).
      *   *If Accuracy and Verbalization track perfectly:* Strong point for Camp A (explicit rule).
  3.  **The "Gerrymander" Resistance:** If a weird, disjunctive rule (e.g., "Red circles OR Blue squares") fits the data perfectly but is complex, do learners reject it in favor of a simpler, slightly imperfect rule?
      *   *If they reject the complex fit:* Camp A (Simplicity Prior).
      *   *If they accept the complex fit:* Camp B (Boundary Fitting).
  4.  **Reaction Time Gradients:** Does reaction time scale with the *logical depth* of the proof (Camp A) or the *psychological distance* from the prototype (Camp B)?

  ---

  ## 4. PROPOSED EXPERIMENTAL CASES
  *We agree to run these two Bongard-style tasks. Predictions are recorded in advance.*

  ### Case 1: The "Relational Anchor" (Testing Zero-Overlap Transfer)
  **Stimuli:**
  *   **Left Panel (Positive):** Six boxes. Each contains two shapes. In every box, a *smaller* shape is strictly *inside* a *larger* shape. The shapes vary wildly (star in circle, square in triangle, dot in spiral). Colors vary.
  *   **Right Panel (Negative):** Six boxes. Each contains two shapes. In every box, the shapes are *separate* (not touching). Crucially, the shapes used here are identical to the shapes used in the Left Panel, just rearranged.
  *   **Test Item:** A box containing a *sound wave icon* inside a *text box*. (Novel symbols never seen in training).

  **The Conflict:**
  *   **Camp A Prediction:** High Accuracy (>90%). The rule is symbolic: `INSIDE(x, y)`. The perceptual features (star, circle) are variables. Novel symbols instantiate the variables successfully. Reaction time is constant regardless of shape novelty.
  *   **Camp B Prediction:** Moderate Accuracy (~65%). The similarity field is anchored to the specific shapes seen in training (stars, circles). The test item is "far" from the training cluster in feature space. Reaction time increases as perceptual similarity to training items decreases.

  ### Case 2: The "Family Resemblance" Trap (Testing Compact Rule vs. Prototype)
  **Stimuli:**
  *   **Left Panel (Positive):** Six boxes. No single feature is common to all six.
      *   Items 1-2: Red, Square, Large.
      *   Items 3-4: Red, Circle, Small.
      *   Items 5-6: Blue, Square, Small.
      *   *Structure:* Every item shares at least two features with every other item, but no feature is present in all six. (Wittgensteinian "games" structure).
  *   **Right Panel (Negative):** Six boxes that share only one feature with the Left Panel items or none.
  *   **Test Item:** A Blue, Circle, Large shape. (Shares exactly one feature with each Left Panel cluster).

  **The Conflict:**
  *   **Camp A Prediction:** Low Accuracy / High Variance. Learners will struggle to find a "rule." They will likely overfit (e.g., "It must be Red") and fail on the Blue items, or invent a complex disjunctive rule ("Red OR Small") that leads to confusion on the Test Item. They will report low confidence.
  *   **Camp B Prediction:** High Accuracy. The system computes a centroid (prototype) of the Left Panel. The Test Item is calculated as "distant" from the centroid compared to the training items. Learners will classify based on "family likeness" without needing a crisp definition. Reaction time will correlate with typicality.

  ---

  ## 5. FLAG: SUSPECTED VERBAL DISAGREEMENTS
  *We acknowledge that the following terms may be masking underlying agreement.*

  1.  **"Rule":** Camp B suspects Camp A uses "rule" to mean "any function that maps input to output," including complex neural network weights. Camp A insists "rule" implies *human-readable syntax*.
      *   *Resolution:* For this collaboration, "Rule" is defined strictly as a compositional structure expressible in a formal language (e.g., First-Order Logic) with a description length significantly shorter than the data itself.
  2.  **"Similarity":** Camp A suspects Camp B uses "similarity" as a magic dust that hides actual rule-learning in the feature weighting. Camp B insists similarity is a primitive geometric relation.
      *   *Resolution:* We will measure "similarity" independently via subjective rating tasks prior to the induction task to ensure it is not merely a post-hoc label for "classified as same."
  3.  **"Representation":** Camp A claims Camp B's "vectors" are just invisible symbols. Camp B claims Camp A's "symbols" are just high-level summaries of vector clusters.
      *   *Resolution:* We will not resolve this metaphysical dispute here. We will judge based on *predictive power* regarding the Reaction Time and Transfer data in Section 4.

  ---

  **Signed,**

  *Lead Investigator, Camp A (Rule-Inference)*
  *Lead Investigator, Camp B (Similarity-Field)*
