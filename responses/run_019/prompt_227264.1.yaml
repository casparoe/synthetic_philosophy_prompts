answer: |-
  This is a high-quality, self-aware snapshot of a specific niche in decision-theory space. You've essentially assembled a "Rationalist-Adjacent Pragmatist" stack: you want the power of FDT/UDT (c), the safety of anti-pumping (b), and the human intuition of Allais (a), all grounded in a reality-first ontology (d, f).

  It is a compelling package, but it is not stable. You have two major fault lines and one minor one. Here is the audit, ranked by severity.

  ### 1. The Logical Contradiction: (c) vs. (d)
  **Severity: Critical**

  *   **The Tension:** These two statements are direct negations of each other.
      *   **(c)** explicitly endorses evaluating policies based on outcomes in "branches that don't end up being the actual one." This is the core mechanism of UDT/FDT and the justification for one-boxing/counterfactual mugging.
      *   **(d)** explicitly rejects valuing outcomes in branches that "by hypothesis never occur" as "spooky."
  *   **Why it breaks:** You cannot one-box on Newcomb's Problem while holding (d). In Newcomb's, when you stand before the boxes, the money is *already* there or not. A strict actualist (d) sees two boxes with fixed contents. Taking both *actually* yields $1,000 more than taking one, regardless of the past prediction. To one-box, you must care about the *counterfactual* correlation: "If I were the sort of agent who took both, the box would be empty." That is a fact about a branch of reality that (in the actual timeline) did not occur.
  *   **What has to give:** You must revise **(d)**.
  *   **Cost of Revision:** You have to abandon "Actualist Consequentialism" in favor of "Policy Consequentialism" or "Functional Consequentialism." You have to accept that "what actually happens" is partly determined by the logical implications of your decision algorithm across possible worlds, not just the causal effects in the actual timeline. Given that you already claim (c), this is mostly a terminological cleanup of your intuition, not a substantive shift.

  ### 2. The Exploitation Vulnerability: (a) vs. (b)
  **Severity: High**

  *   **The Tension:** You claim Allais preferences (a) are valid, but also that money pumps are "decisive" proof of broken preferences (b).
      *   Allais preferences violate the Independence Axiom. While this doesn't violate *static* transitivity, it creates **dynamic inconsistency**.
      *   There are established money-pump arguments for Allais preferences (e.g., the Machina pump or sequential framing pumps). If you prefer 1A over 1B, but 2B over 2A, a sufficiently clever agent can frame a sequence of trades where you pay to switch from 1A to 1B, and then pay to switch back, ending up with less money and the same gamble.
  *   **Why it breaks:** If (b) is truly *absolutist* ("no exceptions"), then (a) is forbidden. You cannot claim to be immune to money pumps while holding preferences that are demonstrably pumpable in dynamic settings.
  *   **What has to give:** Either **(a)** or **(b)**.
  *   **Cost of Revision:**
      *   **Giving up (a):** You revert to standard EU maximization. This costs you the "certainty effect" intuition and aligns you with standard econ, but saves your anti-pumping absolutism.
      *   **Giving up (b):** You have to nuance your money pump objection. You could argue that pumps only work if the agent fails to recognize the equivalence of the frames (i.e., they are "frame-sensitive"). If you treat the Allais choices as fundamentally distinct contexts (due to the certainty premium), the pump fails. This saves (a) but weakens (b) from "absolutist" to "applies only to coherent framings."

  ### 3. The Boundary Condition: (a) vs. (e)/(f)
  **Severity: Low (Manageable)**

  *   **The Tension:** You endorse EV for repeated small stakes (e) and reject long-run justifications for one-shots (f), which you use to justify Allais (a).
  *   **Why it's mostly fine:** This is actually the most coherent part of your stack. The ergodicity critique (f) successfully carves out a space where EV is valid for ergodic processes (repeated poker/investing) but not for non-ergodic one-shots (Allais/ruin scenarios).
  *   **The Residual Friction:** The only tension is defining the boundary. Is a $1M gamble "one-shot" if you are a millionaire? Is poker "repeated" if you go bust? You need a clear criterion for when the "Allais mode" switches off and the "EV mode" switches on, or you risk arbitrage between your two modes.
  *   **Cost of Revision:** Minimal. Just ensure you have a clear heuristic for "when do I turn off the certainty premium?" (e.g., "when stakes are < 5% of net worth").

  ---

  ### The Single Revision for Maximum Consistency

  **Revise (d) to match (c).**

  **Why:**
  1.  **It solves the Critical Tension:** It removes the logical contradiction between your Newcomb stance and your ontology. You are already *acting* like a policy consequentialist in (c); (d) is just a lingering CDT intuition that doesn't match your other commitments.
  2.  **It helps with (a) vs (b):** If you adopt a policy-based view, you can defend Allais preferences as a **pre-commitment strategy**. You can say: "My policy is to value certainty in high-stakes one-shots. I will not trade away this policy dynamically." This doesn't fully solve the money pump (a sophisticated pump can still target the pre-commitment), but it moves you closer to a coherent defense (similar to Risk-Weighted Expected Utility).
  3.  **Lowest Pain:** You've already read the sequences. You know that "winning" often requires accepting logical counterfactuals. Dropping the "spooky" label on (d) costs you nothing intellectually because (c) already requires you to pay that tax.

  **Suggested Rewrite of (d):**
  > "(d') I'm a consequentialist about evaluating *policies*: what matters is the expected outcome of the decision rule I instantiate, including the logical correlations across counterfactual branches. Arguments that ignore these correlations because they are 'counterfactual' strike me as leaving utility on the table."

  ### Summary
  You are currently trying to run **FDT software** (c) on **CDT hardware** (d) while using a **Human UI** (a) that violates the OS's safety protocols (b).

  *   **Keep:** (a), (e), (f). (The Ergodic/Allais cluster is internally robust).
  *   **Keep:** (c). (It's the standard rationalist upgrade).
  *   **Modify:** (d). (Make it consistent with (c)).
  *   **Nuance:** (b). (Change "absolutist" to "absolutist for coherent framings" to protect your Allais preferences from dynamic pumps).

  If you make those two tweaks, your package is defensible, consistent, and distinctively "post-sequences."
