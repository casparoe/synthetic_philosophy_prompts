answer: |-
  **Setting:** *A dimly lit conference room in the hospital administration wing. Empty coffee cups and scattered printouts cover the table. It is late. ELENA and MARCUS, both senior ethics advisors, are reviewing the final proposals for the board meeting tomorrow.*

  **Marcus:** The board is looking for a recommendation, Elena. Not a poem. They want to know which option maximizes the reduction of suffering. That's the mandate.

  **Elena:** And I'm telling you, the mandate assumes a commensurability that isn't there. We have the Palliative Wing: definite relief for three hundred current patients. Moderate intensity, high certainty. Then we have the Neuropathic Research: high risk, but if it lands, it rewrites the taxonomy of pain for millions.

  **Marcus:** It's an expected utility calculation. You assign a value to the relief, multiply by the probability of success, and compare. If the numbers are close, it's a toss-up. If they aren't, one is better.

  **Elena:** It's not a toss-up, Marcus. A toss-up implies equality. That the two options are *equally good*. But they aren't equal. The Research isn't *equal* to the Palliative Wing, nor is it *better*, nor *worse*. They are on a par. It's a *sui generis* relation.

  **Marcus:** (Sighs, leaning back) We've been over this. "Parity" is just a metaphysical place-holder for "I don't know how to weigh these." It's epistemic opacity. You're reifying our ignorance. In reality, there is a fact of the matter. Either the future suffering prevented by the research outweighs the current suffering relieved by the wing, or it doesn't. The hardness of the choice is just a confession that we lack the data to see the tilt.

  **Elena:** If it were just ignorance, then perfect information would dissolve the hardness. But it wouldn't.

  **Marcus:** Wouldn't it?

  **Elena:** No. Let's test that. Imagine a benevolent oracle appears. Right now. It tells the board, with metaphysical certainty, the exact causal consequences of each choice. It tells us precisely how many future sufferers the research will save. It removes the probability. It tells us exactly how the current patients will fare. All empirical uncertainty is gone.

  **Marcus:** Okay. Suppose the Oracle says the Research succeeds and prevents fifty million units of suffering, while the Palliative Wing prevents ten thousand.

  **Elena:** Even then.

  **Marcus:** (Laughs softly) Come on. If the Oracle says Research prevents fifty million and Palliative prevents ten thousand, and our goal is reducing suffering, we fund the Research. The choice is no longer hard.

  **Elena:** The *calculation* is no longer hard. The *choice* remains hard. Because the Oracle gives us facts, but it doesn't give us the weighting of the values. The ten thousand units are *identifiable* lives. The fifty million are statistical. The ten thousand are *now*; the fifty million are *later*. Even knowing the quantities, the board has to decide what *kind* of moral agent the hospital wants to be. Do we prioritize the claim of the person standing before us, or the abstract magnitude of the future? The Oracle removes the fog, Marcus, but it doesn't remove the gap.

  **Marcus:** That's just shifting the goalposts. If the Oracle reveals the quantities, and you still hesitate, it's because you suspect there's a normative variable you haven't quantified. Maybe "identifiability" carries weight. But if it carries weight, it has *some* value. Add that to the ten thousand. Eventually, the scale tips.

  **Elena:** This is the Small-Improvement Argument, isn't it? You're going to tell me that if the two options are on a par, then improving the Palliative Wing slightly—say, adding one extra bed—must make it strictly better than the Research.

  **Marcus:** Precisely. If $A$ and $B$ are on a par, then $A+$ must be better than $B$. If you admit that adding one bed doesn't clearly make the Wing better than the Research—if you think you'd still agonize—then $A$ and $B$ weren't on a par. They were either equal, or one was already better and you can't see it. Parity collapses under the weight of a single extra pillow.

  **Elena:** That argument assumes value is granular enough that a single pillow must register on the scale of global comparison. But what if the values are distinct enough that a small improvement in one domain doesn't bridge the normative gap to the other? The pillow improves the *comfort* of the wing, but it doesn't change the *moral structure* of the choice between immediate relief and speculative hope.

  **Marcus:** That sounds like vagueness. And vagueness is in the language, or in our minds, not in the world.

  **Elena:** Is it? Think about the phenomenology of the decision, Marcus. If you're right—if this is just ignorance—then regret is irrational. If we choose the Wing, and it turns out the Research would have saved more, we made an error. We calculated wrong. But that's not how it feels. When we make a hard choice, we feel we are *constituting* the reason.

  **Marcus:** Constituting it?

  **Elena:** Yes. By committing to the Wing, I make the relief of these specific patients my reason. I don't find that reason lying in the world waiting to be discovered. I create it through my commitment. That's why the choice is hard. It's not that I don't know which is better. It's that neither is better *until* I choose. The hardness is the weight of that creative act.

  **Marcus:** That's existentialist poetry, Elena, not ethics. If reasons are created by choice, then anything goes. If I choose to fund the Research because I like the sound of "neuropathic," have I created a reason?

  **Elena:** No, because parity only exists within a zone of comparability. You can't choose between funding the hospital and buying a yacht on a whim. But within the zone of hard choices, the will has normative traction.

  **Marcus:** (Pauses, tapping a pen on the table) I'll concede this: The phenomenology you describe is real. Even if I'm right that there is a fact of the matter, the *experience* of the board members won't feel like solving a math problem. They will feel the weight. They will feel anxiety. If I tell them "one is objectively better, you just can't see which," it doesn't help them sleep at night.

  **Elena:** Thank you. And I'll concede this: Parity can't be a blanket excuse for laziness. We can't just say "it's on a par" whenever the calculation gets difficult. There has to be a rigorous test for when parity applies. If the Research option were clearly catastrophic, parity wouldn't hold. I need to account for why some options are ruled out while others remain in the par-zone.

  **Marcus:** Agreed. But I still worry about the Oracle case. If the Oracle speaks, and the board still agonizes... what are they agonizing over? If they know the outcomes, and they know their own values, what is left?

  **Elena:** They are agonizing over who they are becoming. The Oracle tells them what happens *out there*. It doesn't tell them who they are *in here*. If they choose the Wing, they become the kind of institution that honors the present claim. If they choose the Research, they become the kind that gambles on the future. Both are noble. Neither is strictly better. The hardness is the loss of the other self.

  **Marcus:** Regret as mourning, rather than regret as error correction.

  **Elena:** Exactly.

  **Marcus:** (Stands up and stretches) I still think there's a truth of the matter. I think the Oracle *would* solve it, provided the Oracle could also quantify the value of "honoring the present claim" versus "gambling on the future." If we could put that on the scale, the parity vanishes.

  **Elena:** And I think that if you could put that on the scale, you'd find the scale breaks. But... (she gathers her papers) ...if we tell the board it's just ignorance, they'll demand more data. They'll delay funding until the uncertainty is gone.

  **Marcus:** Which means no Research and no Wing.

  **Elena:** Right. If we tell them it's a hard choice in the ontological sense—that they must *will* the end—then they might actually move.

  **Marcus:** So, pragmatically, your view gets the job done. Even if it's metaphysically suspect.

  **Elena:** And your view keeps us honest about the data, even if it misses the agency.

  **Marcus:** (Smiles tiredly) I'll draft the section on risk assessment. You draft the section on normative commitment.

  **Elena:** We'll see if the board can handle the truth. Either of them.

  **Marcus:** Goodnight, Elena.

  **Elena:** Goodnight, Marcus.
