      *   Did I offer repairs and costs? Yes.
      *   Did I flag hidden commitments? Yes.
      *   Did I avoid "everything is tension"? Yes.

      *(Self-Correction during drafting)*: I should be careful not to tell them to abandon Kuhn. They said "working within a Kuhnian picture." I need to show how to make Kuhn compatible with Realism (which is hard but possible, e.g., via Kuhn's later work or structural realism). Actually, the cheapest repair is usually to qualify C2. Kuhn himself walked back the "world changes" claim in the Postscript to mean "world *as experienced*." If the user means *ontological* world change, C5 is dead. If they mean *phenomenological*, C5 survives. This is the crux.

