answer: |-
  **JOINT STATEMENT OF THE ADVERSARIAL COLLABORATION ON THE NORM OF ASSERTION**

  **Preamble**
  This document records the outcome of a twelve-month adversarial collaboration between two parties within the analytic-epistemology working group. The first party (hereafter 'Party K') defends the Knowledge Norm of assertion. The second party (hereafter 'Party T') defends the Truth Norm of assertion. The aim of this collaboration was not to reach a consensus view, but to isolate the precise locus of disagreement, eliminate verbal disputes, and identify the empirical and theoretical cruxes that sustain the divergence. Both parties endorse the following statement as an accurate representation of their common ground, their residual disagreement, and the stakes of the debate.

  **1. Agreed Claims**
  Both parties affirm the following claims. These are phrased to reflect substantive commitments that neither party wishes to weaken or hedge.

  1.  **Normativity:** Assertion is an essentially normative speech act. To assert that $p$ is to undertake a commitment that renders the speaker liable to evaluation and criticism; it is not merely a causal production of sound or marks.
  2.  **Falsehood:** Asserting a falsehood is always improper in virtue of its falsity. There is no context in which the falsity of the content fails to count as a defect of the assertion.
  3.  **Epistemic Responsibility:** Assertors are frequently criticisable for asserting without adequate evidence, even when the content asserted happens to be true. Both parties agree that speakers ought to strive for a robust epistemic position before asserting.
  4.  **Distinction between Violation and Blame:** A speaker may violate the governing norm of assertion without being blameworthy. Excuses, such as being systematically misled by evidence or acting under duress, can render a violation blameless without rendering it compliant with the norm.
  5.  **Distinctiveness:** The norm governing assertion is distinctive. It differs in kind from the norms governing guessing, conjecturing, or hypothesising. There is a specific standard that separates assertion from other modes of conveying content.
  6.  **Ancillary Norms:** Assertions are subject to multiple normative pressures simultaneously, including moral, prudential, and conversational norms. A violation of the distinctive rule of assertion may coexist with compliance with these ancillary norms, and vice versa.

  **2. Statement of Residual Disagreement**
  The parties agree that the disputes regarding whether speakers should generally assert without evidence, or whether lies are permissible, have dissolved. Both parties advise speakers to assert only what they have good reason to believe is true. The disagreement is strictly theoretical and concerns the *constitutive rule* of the speech act.

  **2.1 The Core Dispute**
  The disagreement concerns the classification of criticisms levelled against assertions that are true but epistemically deficient (e.g., lucky guesses, Gettiered beliefs, or lottery propositions).

  *   **Party K Formulation:** The constitutive rule of assertion is: *Assert $p$ only if you know $p$.* When a speaker asserts a truth they do not know, they violate the rule of assertion itself. Criticisms regarding evidence or luck are not merely ancillary; they are evidence that the knowledge rule has been breached. The reason such assertions feel improper is that they fail to meet the standard internal to the practice of assertion.
  *   **Party T Formulation:** The constitutive rule of assertion is: *Assert $p$ only if $p$ is true.* When a speaker asserts a truth they do not know, they comply with the rule of assertion. Criticisms regarding evidence or luck are genuine, but they stem from norms of rationality, morality, or prudence external to the speech act of assertion. The reason such assertions feel improper is that they violate these external norms, not the rule of assertion itself.

  **2.2 Dissolved Disputes**
  The parties acknowledge that the following apparent disagreements were verbal or conceptual rather than substantive:
  *   **Blamelessness:** Party K does not claim that every assertion falling short of knowledge is blameworthy. Party T does not claim that every true assertion is all-things-considered permissible. Both agree that a speaker can be rational and blameless while violating the constitutive rule (on K's view) or violating external norms (on T's view).
  *   **Practical Advice:** Both parties agree that, in ordinary inquiry, speakers should not assert propositions for which they lack adequate evidence. Party T maintains this is because such behaviour is irrational or reckless; Party K maintains this is because such behaviour usually violates the knowledge norm. The practical guidance to the assertor is identical.

  **3. Cruxes and Test Cases**
  The following cases represent the cruxes of the disagreement. Settlement on the correct description of these cases would move at least one party to revise their position. For each case, the parties agree on the factual description but diverge on the normative classification of the assertion relative to the *constitutive rule*.

  **3.1 The Gettier Assertion**
  *   **Case:** A speaker has a justified true belief that $p$, generated by a reliable process, but the belief fails to constitute knowledge due to environmental luck (a standard Gettier case). The speaker asserts $p$. $p$ is true.
  *   **Relevance:** This isolates truth from knowledge.
  *   **Party K Prediction:** The assertion is **improper**. It violates the constitutive rule of assertion. The speaker may be blameless, but the act itself is defective qua assertion.
  *   **Party T Prediction:** The assertion is **proper** relative to the rule of assertion. It satisfies the truth condition. Any intuition of impropriety is explained by the speaker's irrationality or the fragility of their epistemic position, which violates norms of rationality, not assertion.

  **3.2 The Lottery Proposition**
  *   **Case:** A speaker asserts of a specific ticket in a fair, large lottery, "This ticket will lose," based solely on the probabilistic odds. The ticket subsequently loses. At the time of assertion, the proposition is true (as a future contingent or assessed at the time of outcome), but the speaker does not know it.
  *   **Relevance:** This tests assertions based on high probability without knowledge.
  *   **Party K Prediction:** The assertion is **improper**. Probabilistic support, however high, does not constitute knowledge. The assertion violates the knowledge norm.
  *   **Party T Prediction:** The assertion is **proper** relative to the rule of assertion (provided the proposition is true). However, it is likely **reckless**. The criticism is that the speaker took an unjustified risk regarding the truth, violating a norm of caution, not the rule of assertion itself.

  **3.3 The Moorean Utterance**
  *   **Case:** A speaker asserts, "It is raining, but I do not know that it is raining." The speaker believes both conjuncts, and it is raining.
  *   **Relevance:** This tests the link between assertion and the representation of one's epistemic state.
  *   **Party K Prediction:** The assertion is **absurd** because it violates the knowledge norm. By asserting the first conjunct, the speaker represents themselves as knowing it; the second conjunct denies this representation. The contradiction is within the norms of assertion.
  *   **Party T Prediction:** The assertion is **pragmatically defective** but not ruled out by the truth norm alone. The absurdity arises because asserting implies one takes oneself to satisfy the relevant external norms (e.g., rationality), or because it misleads the hearer about the speaker's epistemic state. The defect is not in the constitutive rule of assertion *per se*.

  **3.4 The Unknowable Truth**
  *   **Case:** A proposition $p$ is true but metaphysically or epistemically unknowable (e.g., a specific chaotic future event or a mathematical truth currently beyond proof and assumed to be undecidable). A speaker asserts $p$.
  *   **Relevance:** This tests whether knowledge is a necessary condition for proper assertion.
  *   **Party K Prediction:** The assertion is **improper**. If $p$ cannot be known, it cannot be properly asserted. The practice of assertion is closed to such content.
  *   **Party T Prediction:** The assertion is **proper** relative to the rule of assertion. If $p$ is true, the rule is satisfied. The fact that $p$ is unknowable makes the assertion risky or perhaps irrational, but it does not render the speech act invalid according to the truth norm.

  **Signatories**

  _________________________
  **Party K (Knowledge Norm)**

  _________________________
  **Party T (Truth Norm)**

  **Date:** 24 May 2024
  **Location:** Analytic-Epistemology Working Group
