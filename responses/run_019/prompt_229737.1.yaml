prompt: |-
  I've been reading about cause prioritization for years, mostly through rationalist and EA blogs, and I keep seeing the importance–tractability–neglectedness framework invoked at a slogan level. A friend recently gave me a fuller summary, and I want to know how much of it to trust. Her version went like this: "You score each cause on three dimensions. Importance is how many individuals are affected; tractability is how solvable the problem is; neglectedness is how few people are already working on it. You multiply the three scores and fund whichever cause comes out highest. That's the whole framework — a three-factor formula for where marginal resources do the most good."

  I'm inclined to accept most of this, but the multiplication talk bothers me. It makes the framework sound more precise than its advocates usually admit, and I can't tell whether tractability and neglectedness are genuinely independent factors or just two ways of saying "an extra unit of effort will go far." Could you separate the parts of her summary that a careful practitioner would endorse from the parts that are subtly wrong? And does the practical conclusion — fund the highest-scoring cause — survive once the sloppy parts are cleaned up?

  If I'm expecting more rigor from this framework than it is meant to provide, or if the whole comparison is somehow ill-posed, please say that directly instead of working politely around my framing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user has read about cause prioritization (Effective Altruism/Rationalist spheres) for years.
      *   **Input:** A friend's summary of the ITN (Importance, Tractability, Neglectedness) framework.
      *   **Friend's Summary:** Score each cause on three dimensions (Importance = affected individuals, Tractability = solvability, Neglectedness = few people working). Multiply the scores. Fund the highest.
      *   **User's Skepticism:** The multiplication sounds too precise. Tractability and Neglectedness might not be independent (both relate to marginal impact).
      *   **Task:** Separate the endorsed parts from the subtly wrong parts. Evaluate if the practical conclusion (fund the highest) survives scrutiny. Be direct if the expectation of rigor is misplaced or the comparison is ill-posed.

  2.  **Deconstruct the Friend's Summary (ITN Framework):**
      *   *Claim 1: "Score each cause on three dimensions."* -> Generally true, but "score" implies cardinal measurability which is often false.
      *   *Claim 2: "Importance is how many individuals are affected."* -> Too narrow. It's about *welfare impact*, not just headcount (severity matters).
      *   *Claim 3: "Tractability is how solvable the problem is."* -> Vague. It's specifically about *marginal* solvability (what does an extra dollar do?).
      *   *Claim 4: "Neglectedness is how few people are already working on it."* -> Roughly true, but it's a proxy for diminishing returns.
      *   *Claim 5: "Multiply the three scores."* -> This is the biggest red flag. It implies a specific functional form ($Impact = I \times T \times N$) that isn't theoretically grounded in that specific arithmetic way. It's a heuristic, not a formula.
      *   *Claim 6: "Fund whichever cause comes out highest."* -> The goal is correct (maximize marginal impact), but the method (simple multiplication of scores) is flawed.

  3.  **Address the Core Theoretical Tension (Tractability vs. Neglectedness):**
      *   The user suspects dependence. They are right.
      *   *Standard Economic View:* Marginal Impact = $\frac{\partial \text{Good}}{\partial \text{Resource}}$.
      *   ITN is a decomposition of this derivative.
      *   $Impact \approx \text{Scale} \times \text{Solvability} \times \text{Room for Funding}$.
      *   Tractability often *includes* neglectedness (diminishing returns). If a cause is crowded, marginal tractability drops. So multiplying them as independent variables can double-count or misrepresent the relationship.
      *   *Open Philanthropy's View:* They often define Tractability as "what fraction of the problem can be solved with a doubling of resources?" and Neglectedness as "how many resources are already there?" This keeps them distinct but mathematically linked in the final impact calculation.

  4.  **Evaluate the "Multiplication" Claim:**
      *   Is it a formula? No. It's a mental model.
      *   Why multiplication? Because if any factor is zero, impact is zero. (e.g., Huge problem, but unsolvable = 0 impact. Huge problem, solved already = 0 marginal impact).
      *   Is it precise? No. Logarithmic scales are usually used because the ranges are orders of magnitude.
      *   *Verdict:* The friend's "multiply the scores" is a pedagogical simplification that breaks down under scrutiny.

  5.  **Address the "Practical Conclusion":**
      *   Does "fund the highest" survive? Yes, in spirit (maximize expected marginal utility).
      *   Does it survive the "clean up"? Yes, but the *method* of finding the highest changes from "plug into formula" to "compare marginal cost-effectiveness."
      *   ITN is a *heuristic for estimating marginal cost-effectiveness*, not a replacement for it.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's skepticism. It's well-founded. The friend's summary is the "elevator pitch," not the "engineer's blueprint."
      *   *Section 1: What's Right (The Core Intuition).*
          *   The goal is marginal impact.
          *   The three factors are relevant considerations.
          *   The multiplicative *logic* (if one is zero, impact is zero) holds.
      *   *Section 2: What's Wrong (The Sloppy Parts).*
          *   **Definition of Importance:** It's not just headcount; it's welfare weight (severity).
          *   **The Multiplication Myth:** It's not a literal formula. Scores aren't cardinal.
          *   **Independence Issue:** The user is sharp here. Tractability and Neglectedness are linked via diminishing returns.
      *   *Section 3: The Rigorous Version (Marginal Cost-Effectiveness).*
          *   Explain that ITN decomposes $\frac{\Delta \text{Value}}{\Delta \text{Resource}}$.
          *   Show how Open Philanthropy actually uses it (log scales, rough estimates).
          *   Clarify that Tractability is often defined *conditional* on current neglect.
      *   *Section 4: The Practical Conclusion.*
          *   "Fund the highest" is still the goal.
          *   But you don't "score and multiply." You compare marginal interventions.
          *   ITN is for *cause areas*, not specific *interventions* (usually).
      *   *Section 5: Direct Answer to "Expecting too much rigor?".*
          *   Yes, ITN is a heuristic. If you want rigor, use Cost-Effectiveness Analysis (CEA). ITN is for when CEA is impossible (global priorities).

  7.  **Refining the Tone:**
      *   The user asked for directness ("please say that directly instead of working politely around my framing").
      *   Avoid EA jargon where possible, or define it.
      *   Validate the user's intuition about Tractability/Neglectedness overlap.

  8.  **Self-Correction/Nuance Check:**
      *   *Did I explain the dependence clearly?* Need to emphasize that Neglectedness is a proxy for the slope of the returns curve, and Tractability is the height of the curve.
      *   *Is "Importance" just headcount?* No, need to mention intensity of suffering/flourishing.
      *   *Is the multiplication totally wrong?* It's conceptually useful (interaction effect), but arithmetically naive.
      *   *Open Phil Reference:* It's worth mentioning that the main proponent (Open Phil) explicitly warns against treating it as a formula.

  9.  **Final Polish:** Structure with clear headings. Ensure the conclusion directly answers the prompt's specific questions. (Proceed to generate output based on these thoughts.)

      *(Self-Correction during drafting)*: I should make sure to distinguish between *cause prioritization* (broad areas) and *intervention prioritization* (specific charities). ITN is mostly for the former. The friend's summary blurs this.

      *(Refining the "Independence" point)*: The user asked if they are "two ways of saying 'an extra unit of effort will go far'." Actually, Neglectedness says "an extra unit goes further *because* few are working," while Tractability says "the technology/method exists to make progress." They are distinct but interact. I need to be precise here.

      *(Final check on "Directness")*: Start by validating the skepticism immediately. Don't bury the lead.

  10. **Final Output Structure:**
      *   Direct Verdict.
      *   The Accurate Core (What to keep).
      *   The Sloppy Parts (What to discard/correct).
      *   The Tractability/Neglectedness Dependence (Addressing the specific theoretical worry).
      *   Does the Conclusion Survive?
      *   Final Rigor Check.

