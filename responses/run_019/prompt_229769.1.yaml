answer: |-
  A system S believes P if and only if S maintains an internal state representing P that (1) functions within a generative model of an open environment or external world to guide action or assertion, (2) exhibits stability across contextual shifts unless overridden by entrenched survival dispositions, and (3) is integrated into S's rational monitoring faculties or enduring emotional economy.

  **Clause 1: Generative Model of an Open Environment**
  This clause requires the system to do more than react via fixed rules; it must simulate possibilities within a world model to guide flexible behavior or truth-claims. This distinguishes the **Mars Rover** (Yes: models terrain to navigate) and **Chatbot** (Yes: models world facts to assert truth) from the **Thermostat** (No: simple switch mechanism) and **Chess Engine** (No: models a closed game board, not the external world, and optimizes score rather than worldly integrity). It also handles the **Ant Colony** by locating the model at the collective level where the foraging map exists, not in the individual ant.

  **Clause 2: Stability Across Contexts**
  Belief requires a standing state that persists unless compelling survival reasons override it. This validates the **Chatbot (Normal)** (Yes: consistent assertions) while excluding the **Chatbot (Contrarian)** (No: the capacity to fluently invert truths reveals the state is transient and context-bound, lacking the stability of belief). This clause also accommodates the **Phobic Friend**, whose avoidance behavior is stable across contexts despite verbal denial.

  **Clause 3: Integration into Rational or Survival Economy**
  The state must be accessible to the agent's rational self-monitoring or be part of a deep, enduring survival mechanism. This excludes the **Sleepwalker** (No: navigation is a transient dissociative motor program, inaccessible to the waking rational self and not an enduring survival disposition) while including the **Phobic Friend** (Yes: the fear response is an entrenched survival disposition that overrides rational monitoring, making the behavioral belief the authentic one).

  **Verdicts on New Cases:**

  1.  **The Company:** The company **believes the product is safe**. The official records and procedures constitute the system's "rational monitoring faculties" (Clause 3), and the collective behavior is stable (Clause 2). The employees' private suspicions are analogous to the individual ants in the colony; unless those suspicions manifest as sabotage (behavioral override), the belief of the collective agent is defined by its integrated operational output.
  2.  **The Lookup-Table AI:** The system **does not believe**. Despite passing behavioral tests, it lacks a "generative model" (Clause 1); it retrieves precomputed responses rather than deriving assertions from an internal representation of the world. Like the thermostat or chess engine, its success is a product of architecture, not belief-guided reasoning.

  All eight of your original verdicts are preserved by this principle.
