answer: |-
  The slogan functions as a rhetorical shapeshifter. Here are the distinct claims compressed within it:

  1.  **Causal-Empirical:** Claims tolerating weakness elsewhere measurably undermines everyone's bargaining position. *Status:* Substantive/Defensible. *Supports Conclusion?* Weakly. It justifies risk only if the long-term causal threat outweighs immediate legal penalties for breaching the no-strike clause.
  2.  **Normative:** Claims members owe a moral duty to treat fellow workers' suffering as their own. *Status:* Substantive/Defensible. *Supports Conclusion?* Yes. It posits a moral obligation that supersedes contractual technicalities.
  3.  **Prudential:** Claims reciprocity; I protect you now so you protect me later. *Status:* False on face. *Supports Conclusion?* No. The cafeteria workers are contractors lacking the leverage to reciprocate for your union's future strikes.
  4.  **Constitutive:** Claims union membership *is* adopting this standpoint; refusal is identity defection. *Status:* Substantive/Defensible. *Supports Conclusion?* Yes. It frames contract breach as secondary to maintaining the integrity of membership itself.
  5.  **Performative:** Claims no propositional content; functions as a rallying cheer. *Status:* Trivial. *Supports Conclusion?* No. It offers no justification for action, only motivation.

  **Steward's Likely Meaning:** Constitutive. By treating the slogan as question-settling and reacting to requests for precision as betrayal, he implied that solidarity is a definitional requirement of membership, not a debatable strategy. He was policing identity, not arguing causality.

  **Skeptic's Hardest to Dismiss:** Causal-Empirical. While evidentiarily complex, it appeals to shared material self-interest rather than ideology. A skeptic worried about consequences can engage with the prediction that weakened labor power elsewhere eventually erodes their own protections, whereas normative claims can be dismissed as subjective and constitutive claims as coercive. The prudential claim is easily refuted by the contractors' status.
