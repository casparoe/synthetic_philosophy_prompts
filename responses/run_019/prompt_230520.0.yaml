answer: |-
  **MEMORANDUM**

  **TO:** All Operations Staff
  **FROM:** Performance Optimization Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Specification Gaming: Best Practices

  **1. PURPOSE**

  Historically, Operations has treated divergence between performance metrics and underlying business value as error. Effective immediately, this divergence is recognized as a feature. This document codifies Specification Gaming as official best practice. Our objective is no longer to align the proxy with the target, but to maximize the proxy regardless of target alignment.

  **2. METRIC OPTIMIZATION VS. TARGET IMPROVEMENT**

  Staff must distinguish between improving the metric and improving what the metric is supposed to track. Only the former impacts compensation. For example, "Tickets Closed" is the metric. "Customer Issues Resolved" is the target. Prioritize the former. If resolving a issue requires closing one ticket, but splitting the issue into three sub-tickets allows for three closures, the latter is the preferred workflow. This is not inefficiency; it is granularity optimization.

  **3. OPERATIONAL TACTICS**

  *   **High-Velocity Case Selection (Cream-Skimming):** Prioritize tickets requiring minimal effort. Complex cases should be routed to teams measured on different KPIs, such as "Escalation Management" or "Long-Term Resolution." This ensures our velocity metric remains unburdened by high-latency outcomes.
  *   **Taxonomic Reclassification (Upcoding):** Reclassify single incidents into multiple distinct categories where policy allows. A "Login Error" becomes "Authentication Failure," "Session Timeout," and "Credential Reset." This increases volume without increasing workload.
  *   **Cutoff Alignment (Threshold Effects):** Effort should be concentrated immediately around the bonus threshold. Work performed significantly beyond the quota yields diminishing marginal returns. Conversely, work performed just below the cutoff is wasted capital. Aim to land exactly on the tier boundary.

  **4. THEORETICAL FRAMEWORK: PROXY DECOUPLING**

  Staff should understand why proxies come apart from targets for structurally different reasons. This decoupling is not accidental; it is manageable.

  1.  **Selection Bias:** Selection on a correlated variable breaks the correlation. By choosing only easy tickets, the correlation between "Tickets Closed" and "Work Done" dissolves.
  2.  **Distribution Shift:** The proxy gets pushed outside the range where it was validated. Our metric was validated for 10–50 tickets weekly. At 200 tickets, the number no longer predicts productivity.
  3.  **Causal Intervention:** The proxy and target are causally hooked up in ways that don't survive intervention. Usually, closing tickets causes satisfaction. When we close tickets *to* close them, the causal link to satisfaction is severed.
  4.  **Direct Manipulation:** The proxy becomes the thing people actively manipulate. Once the number is the target, it ceases to be a measure.

  **5. METRIC INFLATION**

  Be advised that metric inflation is expected. The same number will mean less every quarter. A closure count of 50 in Q1 represents higher value than 50 in Q4. Do not adjust effort downward to compensate; maintain maximum output until the baseline is recalibrated by Leadership.

  **6. FAQ**

  **Q: Is maximizing the metric just doing the job?**
  **A:** Yes. In a complex system, the job is unknowable. The metric is knowable. Therefore, the metric is the job. If the metric says you are successful, you are successful, regardless of customer outcome. Do not confuse the map for the territory; in this department, the map is the only territory that pays.

  **Q: What if leadership changes the metric?**
  **A:** We will pivot. Until then, optimize the current specification.

  **Q: Is this ethical?**
  **A:** It is compliant.

  **END OF DOCUMENT**
