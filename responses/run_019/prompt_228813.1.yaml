prompt: |-
  So I've been chewing on this for weeks after a fight in a comment thread about whether having kids is selfish, and I want a number, not a shrug.

  The thing: pretty much everyone agrees that if you somehow KNEW a child you conceived would have a life of nothing but severe suffering, it would be wrong to conceive them. But almost nobody thinks you do anything wrong by NOT conceiving a child who would have had an amazing life. There are zillions of possible happy people humanity could bring into existence and nobody calls us monsters for not getting started. So the bad side generates a duty and the good side doesnt. That's lopsided, and I can't tell if it's a deep moral fact or a glitch in our gut reactions.

  My own stab at justifying it: creating someone is like mailing a package to an address that doesn't exist yet. You can't owe a future nobody a present, but you can absolutely owe it to them-in-advance not to send them a bomb. I like this analogy but I suspect it just restates the lopsidedness instead of explaining it. Tell me if it does any work.

  The proposition I want your credence on, as precise as I can make it: there is a genuine moral duty not to create a person you can confidently predict would have a life of severe suffering, AND there is no moral duty at all, not even a weak defeasible one, to create a person merely because their life would be wonderful. My own credence is around 0.65, but honestly I made that up to have something to argue with.

  Give me yours and show the derivation. Decompose the proposition into the sub-questions it actually depends on (things like: is the miserable-child intuition robust under reflection or does it fall apart; can any coherent theory of value make the two sides come out different without special pleading; does everything hinge on non-existent people not being anyone you can wrong; etc. -- you'll find better sub-questions than me). Assign a rough probability to each, explain how they combine into your final number, and flag which sub-question the final answer is most sensitive to.

  One extra sub-question I want folded in: CONDITIONAL on the asymmetry being true, what's the probability it drags you to the grim conclusion (there's an antinatalist philosopher who argues this, forgot his name) that every birth is a harm, because all lives contain some pain and nobody consented to any of it? I really don't want that to follow, but wanting isn't an argument.

  Also: what's the single thing -- an argument, a thought experiment, whatever -- that would move your number the most, in either direction?

  Format: do the reasoning in prose first, then give me a table with these columns: sub_question | your_probability | one_line_reason | sensitivity_of_final_answer (low/medium/high). Then end with a small JSON object with exactly these fields: {"overall_credence": ..., "p_antinatalism_given_asymmetry": ..., "most_sensitive_subquestion": ..., "biggest_potential_update": ...}
