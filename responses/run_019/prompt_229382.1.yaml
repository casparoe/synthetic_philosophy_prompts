prompt: |-
  I write about science and ideas for a magazine, and I'm working on a piece about what makes consent valid — across sex, medicine, data, the whole mess. I've been writing down my gut intutions on made-up cases, and now I want to know whether one principle gets them all, or close, and which of my verdicts has to go. I don't need references or the literature; I need the reasoning.

  Here are the calls. Someone says "sleep with me or I send these photos to your family": not valid. Someone says "sleep with me or I'm leaving you": valid, but it feels rancid. A broke neighbor agrees to sex for $300 that covers their rent: I keep calling that valid, and hating myself a little. Someone takes off the condom mid-sex after the other person consented to sex with a condom: not valid. A woman says she's on the pill and isn't: not valid. A guy says "I love you" just to get sex, with no intention of seeing her again: this is the one I flip on — it's clearly wrong, but I can't decide if it's a consent problem or just ordinary jerk behavior. Then there's the pair that really bugs me. A person in labor, clutching the bed and in serious pain, says yes to an epidural: valid. That same person, at that same moment, says yes to enrolling in a study comparing pain drugs: I don't trust it. Pain seems to wreck one consent and not the other. On data: an app tucks "we will sell your health data" into a 47-page terms-of-service with a pre-ticked box: not valid. Same app, different flow, a one-line popup that says "we sell your location data to ad companies, continue?" and the person clicks yes: valid, even if impulsive. Tipsy but chatty and making jokes: valid. Slurring and can't stand up: not valid. An adult with a mild cognitive disability who can restate the surgery and its main risk in her own words: valid.

  My working rule has been: consent is valid iff the person could understand the specific thing and its main risks, actually knew the material facts, and wasn't threatened. Test that rule against the list. I can already see trouble — the buried clause and the popup differ only in presentation, not in what a careful reader could find out, and the "I love you" lie seems to fall out invalid on the material-facts clause even though I'm not sure that's what I think. Also: what makes the pill lie different from the love lie? Please give me a precise principle (or a small set of candidates), tell me which of my verdicts it can't accommodate, say what it predicts for a case I didn't list, and use it to settle the I-love-you case if you can.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user is a writer working on a piece about valid consent across various domains (sex, medicine, data, etc.). They have a list of intuitive verdicts on specific cases and a working rule. They want to know if one principle covers them all, which verdicts might need changing, and specifically want reasoning (not literature/references).
      *   **Input Cases & Verdicts:**
          1.  Sex under threat of photo release: Invalid (Coercion).
          2.  Sex under threat of breakup: Valid (but feels rancid).
          3.  Sex for rent money (economic necessity): Valid (but feels rancid).
          4.  Stealth removal of condom (stealthing): Invalid.
          5.  Lie about birth control (the pill): Invalid.
          6.  Lie about love/intentions ("I love you" to get sex): Undecided (Invalid? Jerk behavior?).
          7.  Labor pain + Epidural: Valid.
          8.  Labor pain + Research study: Invalid (suspicious).
          9.  Data: Buried clause + pre-ticked box: Invalid.
          10. Data: Clear popup + click: Valid (even if impulsive).
          11. Alcohol: Tipsy/chatty: Valid.
          12. Alcohol: Slurring/can't stand: Invalid.
          13. Cognitive disability: Can restate risks: Valid.
      *   **Working Rule:** Consent is valid iff (1) could understand specific thing + main risks, (2) actually knew material facts, (3) wasn't threatened.
      *   **Specific Questions:**
          *   Test the rule against the list.
          *   Identify trouble spots (specifically noted: buried clause vs. popup, love lie vs. pill lie).
          *   Provide a precise principle (or small set).
          *   Identify which verdicts the principle can't accommodate.
          *   Predict a new case.
          *   Settle the "I love you" case.

  2.  **Evaluate the Working Rule:**
      *   *Rule:* Understanding + Material Facts + No Threats.
      *   *Trouble Spot 1 (Data):* Buried clause vs. Popup. The user notes the difference is presentation, not "what a careful reader could find out." The working rule says "actually knew the material facts." In the buried clause case, they *didn't* know. In the popup case, they *did* know (presumably). So the rule handles this *if* "actually knew" is strictly enforced. But usually, "constructive knowledge" (you *could* have known) is the legal standard, which makes the buried clause valid under law but invalid under the user's intuition. The user's intuition aligns with "meaningful opportunity to know," not just abstract possibility.
      *   *Trouble Spot 2 (Love Lie vs. Pill Lie):* Both are lies inducing sex. Why is the pill lie invalid and the love lie undecided?
          *   Pill lie: Changes the physical risk (pregnancy/disease).
          *   Love lie: Changes the emotional context/expectations.
          *   Working rule says "material facts." Is love a material fact? Is pregnancy a material fact? The rule needs to define "material."
      *   *Trouble Spot 3 (Breakup Threat vs. Photo Threat):* Both are "do X or Y happens." One is invalid, one is valid.
          *   Photo threat: Illegitimate threat (blackmail/harm).
          *   Breakup threat: Legitimate consequence (ending a relationship).
          *   Working rule says "wasn't threatened." It needs to distinguish *coercion* (illegitimate pressure) from *hard choices* (legitimate pressure).
      *   *Trouble Spot 4 (Labor Pain):* Epidural (Valid) vs. Research (Invalid).
          *   Same pain level. Same capacity potentially.
          *   Difference: Benefit/Risk ratio and alignment of interests. Epidural solves the pain. Research exploits the pain for data.
          *   Working rule: "Understand risks." Maybe the pain impairs the *valuation* of the risks differently depending on the offer.

  3.  **Develop a Better Principle:**
      *   The core tension is between *autonomy* (my choice is mine, even if dumb) and *protection* (some choices aren't truly mine due to context).
      *   A strong candidate principle is **Volitional Competence under Non-Exploitative Conditions.** Or, more precisely: **Authorized Agency.**
      *   Let's try to refine the "Material Facts" and "Threats" concepts.
      *   *Principle Proposal:* **Consent is valid if the agent authorizes the specific act based on a reasonable understanding of the *nature* of the act and its *direct consequences*, free from *illegitimate* control.**
      *   *Key Distinction:* Deception/Coercion that alters the *nature* of the act vs. deception/coercion that alters the *motivation* for the act.
      *   *Refined Principle:* **The "Nature of the Act" Test.** Consent is valid if the person understands what is physically/legally happening and the direct risks inherent to that act, and their choice is not compelled by an illegitimate threat.

  4.  **Testing the Refined Principle against Cases:**
      *   *Photos:* Illegitimate threat. -> Invalid. (Matches)
      *   *Breakup:* Legitimate consequence (partner has right to leave). -> Valid. (Matches)
      *   *Rent Money:* Economic necessity is a circumstance, not an illegitimate threat by the partner. -> Valid. (Matches intuition, though feels rancid).
      *   *Condom Removal:* Changes the *nature* of the act (protected sex vs. unprotected sex). -> Invalid. (Matches)
      *   *Pill Lie:* Changes the *direct consequences* (pregnancy risk). -> Invalid. (Matches)
      *   *Love Lie:* Does not change the physical nature or direct physical risks. Changes emotional expectation. -> Valid (Jerk behavior). (Settles the case).
      *   *Labor/Epidural:* Act solves the immediate problem. Understanding is sufficient. -> Valid. (Matches)
      *   *Labor/Research:* Act adds risk without solving the immediate problem. Pain compromises the ability to weigh *extra* risks. -> Invalid. (Matches). *Nuance:* This suggests a "Vulnerability/Exploitation" clause is needed alongside "Nature of the Act."
      *   *Data/Buried:* No reasonable opportunity to understand. -> Invalid. (Matches)
      *   *Data/Popup:* Reasonable opportunity. -> Valid. (Matches)
      *   *Tipsy vs. Wasted:* Capacity threshold. -> Valid/Invalid. (Matches)
      *   *Disability:* Capacity demonstrated. -> Valid. (Matches)

  5.  **Addressing the Specific Questions:**
      *   *Precise Principle:* Needs to capture "Nature of the Act," "Legitimacy of Pressure," and "Reasonable Opportunity to Know."
      *   *Verdicts to Change:* The "Love Lie" needs a firm call. The "Labor/Research" distinction needs a specific reason (exploitation of vulnerability vs. standard care).
      *   *New Case Prediction:* Need a case that tests the boundary of "Nature of the Act." E.g., A doctor performs a different surgery than agreed upon (Invalid) vs. a doctor uses a different brand of screw (Valid).
      *   *Settling "I Love You":* It's deception, but not about the *act* or its *physical risks*. It's about the *context*. Under the "Nature of the Act" principle, it's valid consent (morally wrong, but consent stands).

  6.  **Refining the Reasoning (Self-Correction/Deep Dive):**
      *   *The "Rancid" Valid Cases:* Breakup threat and Rent money. Why do they feel bad? Because the *options* are terrible. But consent isn't about having good options; it's about who controls the choice. In the breakup, the partner controls their own commitment. In the rent, the economy controls the rent, the partner just offers cash. In the photo threat, the blackmailer controls the harm.
      *   *The Pill vs. Love:* This is the crux. The Pill lie creates a biological risk (pregnancy) the other person didn't sign up for. The Love lie creates an emotional disappointment. We generally protect bodily integrity more strictly than emotional expectations in consent law/ethics.
      *   *The Labor Case:* Why is research invalid? Because the pain creates a "distress bias." You will agree to anything to stop pain. The epidural stops pain. The research might not. This is about *undue influence* specifically tied to the vulnerability.
      *   *The Data Case:* It's about *friction*. Buried clauses create too much friction to know. Popups reduce friction. But the user said "impulsive" is okay. So the principle must be "Reasonable Opportunity," not "Actual Deep Reading."

  7.  **Drafting the Principle:**
      *   Let's call it **The Agency Integrity Principle**.
      *   Three conditions:
          1.  **Capacity:** Minimum cognitive threshold to process the transaction.
          2.  **Congruence:** The act performed matches the act authorized (no fraud in the *factum*, only fraud in the *inducement* is allowed).
          3.  **Legitimacy of Pressure:** The choice isn't forced by an illegitimate threat (coercion) or exploited vulnerability (undue influence).

      *   *Wait, "Fraud in the Factum" vs "Fraud in the Inducement"* is the legal distinction that fits the Pill vs. Love case perfectly.
      *   *Fraud in the Factum:* You think you are signing a guestbook, but it's a deed. (Invalid).
      *   *Fraud in the Inducement:* You know it's a deed, but you were lied to about the value of the land. (Valid, but actionable).
      *   *Application:*
          *   Condom/Pill: Fraud in the factum (effectively). You consented to *safe* sex, got *unsafe* sex.
          *   Love Lie: Fraud in the inducement. You consented to sex, got sex, but the reason was a lie.
      *   *Refining the Labor Case:* This is Undue Influence. The pain makes the "inducement" (pain relief) overwhelming in a way that bypasses rational weighing of *unrelated* risks (study).

  8.  **Finalizing the Output Structure:**
      *   Acknowledge the strength of the user's intuition.
      *   Propose the Principle (The "Congruence and Control" Framework).
      *   Test the Rule (Where the user's working rule fails).
      *   Settle the "Love Lie" (Fraud in Inducement).
      *   Explain the Labor Paradox (Therapeutic vs. Non-therapeutic).
      *   Explain the Data Friction (Opportunity vs. Actuality).
      *   Predict a New Case.
      *   Identify the "Rancid" Valid cases (Why they feel bad but are valid).

  9.  **Review against Constraints:**
      *   No references/literature.
      *   Focus on reasoning.
      *   Precise principle.
      *   Settle the "I love you" case.
      *   Address the "Pill vs. Love" distinction.

      *(Self-Correction during drafting)*: I need to make sure I don't just import legal jargon without explaining the *moral reasoning* behind it, since this is for a magazine piece about ideas, not a law review. The reasoning should be about *authority* and *ownership of the self*.

      *Revised Principle:* **Consent is the authorization of a specific intrusion or transfer, valid only when the agent has the capacity to process the transaction, the transaction matches the authorization (congruence), and the choice is not compelled by illegitimate control (coercion/exploitation).**

      *Let's sharpen the "Pill vs Love" distinction.*
      *   Pill: Changes the physical boundaries of the act (risk of pregnancy).
      *   Love: Changes the emotional narrative surrounding the act.
      *   Reasoning: Consent protects bodily sovereignty. It does not guarantee emotional satisfaction or accurate relationship forecasting.

      *Let's sharpen the Labor case.*
      *   Epidural: Aligns with the immediate need (pain relief).
      *   Study: Diverges from the immediate need (adds risk for data).
      *   Reasoning: Vulnerability invalidates consent when the offer *exploits* the vulnerability rather than *remedying* it.

      *Let's sharpen the Data case.*
      *   Buried: Hides the transaction.
      *   Popup: Reveals the transaction.
      *   Reasoning: Consent requires a *reasonable opportunity* to know, not guaranteed knowledge.

      *Let's sharpen the Threat case.*
      *   Photos: Illegitimate weaponization of information.
      *   Breakup: Exercise of personal autonomy (right to leave).
      *   Reasoning: Coercion is about *wrongful* pressure, not just *heavy* pressure.

      *Okay, ready to write.*
answer: |-
  Your working rule is strong, but it collapses under the weight of "material facts" and "threatened." Those terms are doing too much heavy lifting without definition. If "material facts" includes *any* reason someone might say no (like "I don't love you"), then almost all seduction becomes invalid consent. If "threatened" includes *any* negative consequence (like "I'll leave you"), then no one can ever negotiate or set boundaries in a relationship.

  To unify your verdicts, you need a principle that distinguishes between **conditions that negate authority** (I didn't know what I was signing) and **conditions that make authority painful** (I knew what I was signing, but I had no good options).

  Here is a precise principle to test against your cases, followed by the necessary adjustments to your verdicts.

  ### The Principle: Congruence and Legitimacy

  **Consent is valid if and only if:**
  1.  **Capacity:** The agent has the minimum cognitive ability to process the specific transaction at that moment.
  2.  **Congruence:** The act performed matches the act authorized in its *nature* and *inherent risks* (not just its motivations).
  3.  **Legitimacy of Pressure:** The choice is not compelled by an *illegitimate* threat or the *exploitation* of a temporary vulnerability.

  This principle splits your "material facts" into **Congruence** (what is happening to me?) and your "threatened" into **Legitimacy** (who controls the bad outcome?).

  ---

  ### Testing the Principle Against Your Cases

  **1. The Threats (Photos vs. Breakup)**
  *   **Verdict:** Photos = Invalid. Breakup = Valid.
  *   **Reasoning:** This satisfies **Legitimacy of Pressure**.
      *   *Photos:* The blackmailer creates a *new* harm to force compliance. They are weaponizing information they shouldn't control. This is coercion.
      *   *Breakup:* The partner is stating a consequence of their own autonomy. They have a right to end the relationship. Presenting a hard choice ("sex or I leave") is rancid, but it is not illegitimate control. You have the right to say no; they have the right to leave.
  *   **Adjustment:** None. Your intuition holds. The "rancid" feeling comes from the poor quality of the options, not the invalidity of the consent.

  **2. The Economics (Rent Money)**
  *   **Verdict:** Valid.
  *   **Reasoning:** **Legitimacy of Pressure.** Economic necessity is a circumstance, not a threat issued by the partner. The partner is offering a solution to a problem they didn't create. It feels exploitative, but the *authority* to choose remains with the renter.
  *   **Adjustment:** None. Keep hating it, but keep it valid. If you invalidate this, you invalidate almost all labor contracts.

  **3. The Deception (Condom, Pill, Love)**
  *   **Verdict:** Condom = Invalid. Pill = Invalid. Love = Valid (Jerk behavior).
  *   **Reasoning:** This satisfies **Congruence**.
      *   *Condom:* You authorized *protected* sex. You received *unprotected* sex. The physical nature of the act changed.
      *   *Pill:* You authorized sex with a specific biological risk profile (no pregnancy). The lie altered the inherent physical risk of the act.
      *   *Love:* You authorized *sex*. You received *sex*. The lie altered your *motivation*, not the physical act or its direct bodily risks.
  *   **Adjustment:** You must settle the "Love" case. Under this principle, it is **Valid Consent**. It is moral fraud, not consent fraud. Consent protects bodily sovereignty, not emotional expectations. If you make the "Love" lie invalid, you cannot distinguish between a pimp and a poet; both sell a future that may not arrive.

  **4. The Labor Paradox (Epidural vs. Study)**
  *   **Verdict:** Epidural = Valid. Study = Invalid.
  *   **Reasoning:** This satisfies **Legitimacy of Pressure** (specifically *Exploitation of Vulnerability*).
      *   *Epidural:* The intervention remedies the vulnerability (pain). The choice aligns with the immediate biological need.
      *   *Study:* The intervention *uses* the vulnerability to extract data. The pain compromises the ability to weigh *non-therapeutic* risks. A person in agony cannot freely weigh "future scientific benefit" against "current side effects" because the current side effect (pain) is already overwhelming.
  *   **Adjustment:** Your intuition is correct, but the reason isn't "pain wrecks consent." Pain wrecks consent only when the offer *exploits* the pain rather than *relieving* it.

  **5. The Data (Buried vs. Popup)**
  *   **Verdict:** Buried = Invalid. Popup = Valid.
  *   **Reasoning:** This refines **Capacity/Understanding**.
      *   The standard is not "Did they actually read it?" but "Was there a *reasonable opportunity* to know?"
      *   *Buried:* The friction is designed to prevent knowledge. It fails the reasonable opportunity test.
      *   *Popup:* The friction is low, the fact is clear. Impulsivity is allowed in consent (we are allowed to make bad deals quickly), provided we *could* have paused.
  *   **Adjustment:** Your working rule said "actually knew." You must change this to "had a reasonable opportunity to know." Otherwise, anyone can claim they didn't read the popup.

  **6. The Capacity (Tipsy, Wasted, Disability)**
  *   **Verdict:** Tipsy/Disability = Valid. Wasted = Invalid.
  *   **Reasoning:** **Capacity.**
      *   This is a threshold, not a gradient. Can they restate the risk? Can they stop the act?
      *   *Disability:* If they can restate the risk, they have capacity. To rule otherwise is paternalism.
      *   *Wasted:* If they cannot stand, they likely cannot process consequences.
  *   **Adjustment:** None.

  ---

  ### The "Love Lie" Settlement

  You asked to settle the "I love you" case. Based on the **Congruence** clause:

  **Verdict:** **Valid Consent.**

  **Reasoning:** Consent is a mechanism for transferring authority over a boundary (body, data, property). It is not a mechanism for guaranteeing truth in courtship.
  *   **The Pill Lie** changes the *physical boundary*. It introduces a risk of pregnancy or disease that was not authorized. It violates bodily integrity.
  *   **The Love Lie** changes the *narrative boundary*. It violates emotional trust.
  *   **Why the distinction matters:** If you invalidate the Love Lie, you grant people veto power over another's honesty regarding their internal emotional state. We cannot verify love objectively. We *can* verify condoms and pills objectively. Consent law must rely on verifiable facts about the *act*, not the *heart*.
  *   **The Cost:** This means the law (and ethics) treats the "Love Liar" as a jerk, not a rapist. This is a painful but necessary distinction to preserve the concept of consent as bodily autonomy rather than emotional contract enforcement.

  ---

  ### Where Your Verdicts Must Change

  You have one verdict that creates a contradiction in your own logic regarding **Data**.

  **The Contradiction:** You said the buried clause is invalid because they didn't know, but the popup is valid even if impulsive.
  **The Fix:** You must admit that in the Popup case, they might *not* actually know (they might click without reading).
  **The Change:** Your principle cannot be "actually knew." It must be **"Reasonable Opportunity to Know."**
  *   If you stick with "actually knew," you have to call the Popup invalid (because impulsive clickers don't know).
  *   If you move to "Reasonable Opportunity," you validate the Popup (design allowed knowledge) and invalidate the Buried Clause (design prevented knowledge).

  ---

  ### A Prediction for a Case You Didn't List

  To test if this principle holds, apply it to **Medical Substitution**.

  **The Case:** A patient consents to Surgery A (removing a cyst). While under anesthesia, the surgeon finds a second, more dangerous cyst. The surgeon removes both.
  **Prediction:** **Invalid Consent for the second cyst.**
  **Reasoning:** Fails **Congruence**. The patient authorized an intrusion for Condition A. The surgeon performed an intrusion for Condition B. Even if Condition B was dangerous, the patient's authority over their body was bypassed. (Unless it was a life-or-death emergency where capacity is assumed lost, but in a non-emergency finding, this is battery).

  **The Counter-Case:** A patient consents to Surgery A. The surgeon uses Brand X screws instead of Brand Y screws due to supply issues.
  **Prediction:** **Valid Consent.**
  **Reasoning:** Passes **Congruence**. The *nature* of the act (surgery to fix bone) is the same. The *brand* is a detail, not a fundamental change in risk or nature.

  ### Summary for Your Piece

  Your working rule was 90% there. The missing 10% is the distinction between **Fraud in the Factum** (I didn't know *what* I was doing) and **Fraud in the Inducement** (I knew what I was doing, but you lied about *why* I should do it).

  *   **Valid Consent** survives Fraud in the Inducement (Love lie, Breakup threat, Rent money).
  *   **Invalid Consent** is triggered by Fraud in the Factum (Condom, Pill, Buried Data) or Illegitimate Coercion (Photos, Exploitative Research).

  The "rancid" feeling you have about the valid cases (Breakup, Rent, Love Lie) is the feeling of **moral wrongness without rights violation**. People can treat each other terribly while still respecting consent. Your piece will be stronger if you admit that consent is a floor, not a ceiling. It protects the body, but it doesn't fix the heart or the economy.
