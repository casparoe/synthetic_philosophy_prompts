prompt: |-
  ok so i've ended up as the person who has to pick where my workplace giving campaign sends its money this year, and the more i read the more i think the arguments are just people smuggling in different hidden checklists. one guy says the only thing that matters is how big the problem is and how many people are affected, so we should go after the biggest problem anywhere, which he thinks is maybe nuclear war or future people. another says a cause only counts if your dollar does something you can measure in the next two years, so by that test we should fund deworming pills or bednets. a third says all of that is backwards because a problem that's already famous and well funded, like cancer, is automatically a worse place to put money than something nobody is touching, even if the nobody-is-touching problem is smaller. and then there's the damn food bank down the street that i know is real because i see the line every morning, versus the malaria thing where i have to just trust a spreadsheet from people i've never met. so i've stopped asking which cause is best and started asking something upstream.

  what should a good way of ranking causes even have to do? i want the spec before i read another framework. write the desiderata — i had to look that word up — basically the requirements list for a theory of cause prioritization, one adequate for a small donor or a giving circle trying to pick one or two causes (not a government or a foundation with billions). give me the list: the cases it has to handle, especially the ones that pull in opposite directions like the food bank versus the bednets versus the whole-future thing, the distinctions it can't collapse, the facts about psychology or economics or measurement it can't just wave away, and why each one is a requirement. then tell me which requirements are non-negotiable and which are just the tastes of a particular camp, and flag any pair of requirements you suspect can't be jointly satisfied. if you want, briefly say how the importance-tractability-neglectedness framework does against the list and which one requirement it fails hardest, but i mostly care about the list.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for cause prioritization:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Someone thrust into a decision-making role for workplace giving (small donor/giving circle level). They are skeptical of existing frameworks, sensing that different advocates are smuggling in hidden assumptions ("hidden checklists"). They are intellectually curious (looked up "desiderata") but pragmatic.
      *   **The Problem:** Conflicting advice on where to donate (Global Health vs. Existential Risk vs. Local Direct Aid vs. Neglected Causes).
      *   **The Task:** Create a list of *desiderata* (requirements) for a theory of cause prioritization suitable for a small donor/circle.
      *   **Specific Constraints:**
          *   Focus on the "spec" before the framework.
          *   Handle conflicting cases (Food Bank vs. Bednets vs. Future Generations).
          *   Identify distinctions that shouldn't be collapsed.
          *   Acknowledge psychology, economics, and measurement limits.
          *   Explain *why* each is a requirement.
          *   Distinguish non-negotiable vs. taste/camp preferences.
          *   Flag potential incompatibilities between requirements.
          *   Briefly evaluate ITN (Importance, Tractability, Neglectedness) against the list (optional but requested).
      *   **Tone:** Analytical, clear, slightly philosophical but grounded, avoiding jargon where possible (or explaining it).

  2.  **Deconstruct the Conflicting Views:**
      *   *View 1 (Scale/Longtermism):* Biggest problem = Nuclear war/Future people. (Focus: Magnitude, Probability, Time).
      *   *View 2 (Evidence/Short-term):* Measurable impact in 2 years = Deworming/Bednets. (Focus: Certainty, Tangibility).
      *   *View 3 (Neglectedness/Marginal Utility):* Famous causes = Bad. Unfunded causes = Good. (Focus: Diminishing Returns).
      *   *View 4 (Local/Visceral):* Food bank down the street. (Focus: Proximity, Verification, Community).

  3.  **Brainstorming Desiderata (The "Spec"):**
      *   What does a small donor *actually* need?
      *   They need to feel good about it (psychology).
      *   They need to know the money isn't wasted (accountability).
      *   They need to compare apples to oranges (commensurability).
      *   They need to account for their own size (marginal impact).
      *   They need to handle uncertainty (epistemic humility).
      *   They need to define "good" (normative clarity).

      *Drafting specific requirements:*
      1.  *Comparability:* Must compare local vs. global.
      2.  *Uncertainty:* Must handle "trust a spreadsheet" vs. "see the line."
      3.  *Time:* Must handle now vs. future.
      4.  *Scale:* Must handle small donor impact (am I a drop in the bucket?).
      5.  *Psychology:* Must allow the donor to stay motivated.
      6.  *Neglectedness:* Must account for crowding.
      7.  *Verification:* How do we know it worked?

  4.  **Refining and Categorizing the Desiderata:**
      *   Let's group these into logical buckets: Epistemic (knowledge), Normative (values), Practical (action), and Psychological (sustainability).

      *   *Requirement 1: Commensurability across distance and time.* (The Food Bank vs. Bednets vs. Future). A theory must have a common currency to compare local immediate aid with global statistical lives and existential risk.
      *   *Requirement 2: Epistemic Transparency.* (The Spreadsheet vs. The Line). It must distinguish between *observed* impact and *modeled* impact without dismissing either outright.
      *   *Requirement 3: Marginal Impact Sensitivity.* (Small Donor context). A theory designed for Bill Gates doesn't work for a workplace circle. It must account for diminishing returns and whether *your* specific dollar changes the outcome.
      *   *Requirement 4: Normative Explicitness.* (Hidden Checklists). It must state its values openly (e.g., "we value future lives equally to present lives") rather than hiding them in math.
      *   *Requirement 5: Psychological Sustainability.* (Donor Retention). If the theory makes the donor feel alienated or hopeless, they stop giving. It must accommodate the human need for connection/feedback.
      *   *Requirement 6: Failure Mode Accounting.* (What if we're wrong?). It needs to handle the risk of funding something ineffective vs. the risk of funding something too narrow.

  5.  **Identifying Non-Negotiables vs. Tastes:**
      *   *Non-Negotiable:* Commensurability (can't compare without it), Marginal Impact (small donor reality), Normative Explicitness (avoiding smuggling).
      *   *Taste/Camp:* Discount rates on future people (Longtermism vs. Presentism), weight on measurable evidence (Rigorous RCTs vs. Anecdotal/Local knowledge).

  6.  **Identifying Incompatibilities (The "Impossible Trinity"):**
      *   *Certainty vs. Scale:* High certainty usually means small scale/local. High scale usually means high uncertainty (existential risk).
      *   *Emotional Connection vs. Impartiality:* Caring about "our own" conflicts with "everyone counts equally."
      *   *Measurability vs. Transformational Change:* Things easy to measure (bednets) aren't always the most transformative (policy change).

  7.  **Evaluating ITN (Importance, Tractability, Neglectedness):**
      *   *Strengths:* Handles Scale (Importance), Marginal Impact (Neglectedness), and Feasibility (Tractability).
      *   *Weakness:* Fails hardest on *Psychological Sustainability/Verification*. It often demands trusting models over local visibility, which creates the "spreadsheet vs. food bank" tension the user described. It also sometimes glosses over the *definition* of Importance (normative smuggling).

  8.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the user's insight (they are right about hidden checklists).
      *   *The List:* Use clear headings. Explain the "Why."
      *   *The Tension:* Highlight the trade-offs.
      *   *The ITN Critique:* Keep it brief as requested.
      *   *Tone Check:* Ensure it sounds like a spec document but readable. Avoid preaching Effective Altruism, but acknowledge its tools.

      *(Self-Correction during drafting)*: Make sure I don't just list EA principles. The user is skeptical of frameworks. I need to list what a *good* framework *should* do, not just what EA says. Emphasize the "Small Donor" constraint. A small donor's money doesn't move the needle on nuclear war, so the framework must address *leverage*.

      *(Refining the "Incompatibility" section)*: The tension between "Impartiality" (everyone counts equal) and "Community" (my neighbors matter more) is the core conflict between the Food Bank and the Bednets. A framework must admit this is a value choice, not a math problem.

      *(Refining the ITN section)*: ITN is good, but it often treats "Importance" as objective when it's normative. It also struggles with the "Verification" requirement for small donors who need feedback loops.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   List of desiderata? Yes.
      *   Cases handled (Food bank, bednets, future)? Yes.
      *   Distinctions not collapsed? Yes.
      *   Psychology/Economics/Measurement? Yes.
      *   Why each is required? Yes.
      *   Non-negotiable vs. Taste? Yes.
      *   Incompatible pairs? Yes.
      *   ITN evaluation? Yes.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  You have correctly identified the core pathology of modern cause prioritization: frameworks often present themselves as calculators when they are actually value systems in disguise. When someone says "maximize impact," they have already decided what "impact" means, over what timeframe, and for whom.

  For a workplace giving circle (small pool of capital, high need for consensus, limited capacity for due diligence), a prioritization theory must function less like a spreadsheet and more like a constitution. It needs to define the rules of engagement before you plug in the numbers.

  Here is the spec. These are the **Desiderata for Small-Donor Cause Prioritization**.

  ### 1. Commensurability Across Distance and Time
  **The Requirement:** The framework must provide a coherent method for comparing goods that are physically distant or temporally removed from the donor against goods that are immediate and local.
  **The Case:** The Food Bank (visible, local, now) vs. Bednets (invisible, global, now) vs. AI Safety (invisible, global, future).
  **Why it's Required:** Without this, you default to proximity bias (only funding what you can see). A theory must explain *why* a life saved in Sudan counts for $X$ and a life saved in your city counts for $Y$, and whether a life saved in 2100 counts at all. It cannot simply assert one is better; it must provide the exchange rate.
  **Non-Negotiable:** Yes. If it can't compare these, it can't help you choose between them.

  ### 2. Epistemic Transparency (The "Spreadsheet vs. Eyeball" Test)
  **The Requirement:** The framework must explicitly weight *evidence type*. It must distinguish between impact that is empirically observed (seeing the line at the food bank) and impact that is statistically modeled (trusting an RCT from a charity evaluator).
  **The Case:** The Food Bank (low measurement rigor, high verification certainty) vs. Deworming (high measurement rigor, low personal verification).
  **Why it's Required:** Small donors suffer from "agency loss." If you can't verify the outcome, you are relying on trust. A good theory must state how much discount it applies to modeled outcomes versus observed ones. It cannot treat a spreadsheet projection as equal to a meal served without acknowledging the risk of model error.
  **Non-Negotiable:** Yes. Ignoring the cost of verification is intellectual dishonesty.

  ### 3. Marginal Impact Sensitivity (The "Drop in the Bucket" Clause)
  **The Requirement:** The framework must account for the size of the donor relative to the problem. It must assess whether *your* specific contribution changes the outcome or merely subsidizes existing funding.
  **The Case:** Nuclear War Prevention (massive problem, but your $5,000 likely changes nothing) vs. Local Arts Grant (small problem, but your $5,000 might be the difference between the show happening or not).
  **Why it's Required:** This is where "Scale" arguments often lie. A problem can be huge, but if it is already funded by billionaires or governments, your marginal utility is near zero. A small-donor theory must prioritize *leverage* over raw *scale*.
  **Non-Negotiable:** Yes. Funding a cause where you have no causal influence is consumption, not investment.

  ### 4. Normative Explicitness (The "Hidden Checklist" Ban)
  **The Requirement:** The framework must force the user to declare their values *before* calculating impact. It cannot hide value judgments inside variables like "Importance" or "Risk."
  **The Case:** Future Generations. One person says future people count equally; another says they don't exist yet so they count for zero.
  **Why it's Required:** As you noted, people smuggle in checklists. A theory must say: "If you value X, do Y. If you value Z, do W." It cannot claim to be objective about subjective preferences.
  **Non-Negotiable:** Yes. This is the only way to resolve disagreements in a giving circle without fighting over math.

  ### 5. Psychological Sustainability (The "Burnout" Constraint)
  **The Requirement:** The framework must account for the donor's need for feedback, connection, and hope. It must recognize that giving is a behavior that needs to be sustained over decades.
  **The Case:** Existential Risk (high anxiety, zero feedback, potential for doom) vs. Food Bank (high connection, immediate feedback, manageable scope).
  **Why it's Required:** If the "optimal" cause makes the donor feel helpless, alienated, or morally exhausted, they will stop giving. A theory that maximizes theoretical good but minimizes actual giving over a lifetime is a failed theory.
  **Taste/Camp:** Some argue this is irrelevant (truth hurts). For a workplace circle, it is non-negotiable.

  ### 6. Failure Mode Accounting
  **The Requirement:** The framework must evaluate what happens if the intervention fails. Is the loss contained, or is it catastrophic?
  **The Case:** Geoengineering (high upside, potential for disastrous unintended side effects) vs. Bednets (low upside, almost no risk of harm).
  **Why it's Required:** Small donors often lack the expertise to assess tail risks. A good framework applies a "precautionary discount" to complex interventions where the donor cannot verify safety.
  **Non-Negotiable:** Yes. "Do no harm" is a baseline constraint.

  ---

  ### The Incompatibilities (The "Impossible Trinity")

  You asked for pairs of requirements that cannot be jointly satisfied. In cause prioritization, you generally have to sacrifice one of these three:

  1.  **High Certainty of Impact** (You know it worked)
  2.  **High Scale of Impact** (It affected many lives)
  3.  **High Personal Agency** (Your money made the difference)

  *   **Food Bank:** High Certainty, High Agency, Low Scale.
  *   **Bednets/Global Health:** High Certainty, High Scale, Low Agency (you are one of thousands).
  *   **Existential Risk/Policy:** High Scale, Potential High Agency (if niche), Low Certainty.

  **The Conflict:** You cannot have a framework that guarantees you will see the result, change the world, and be the pivot point of the change. A valid theory must tell you which two you are willing to sacrifice.

  **The Normative Conflict:** **Impartiality vs. Community.**
  You cannot simultaneously hold that "every life counts equally regardless of distance" AND "we have a special obligation to our neighbors." These are logically incompatible moral axioms. A framework must force you to pick one as the primary driver, or provide a weighted hybrid, but it cannot claim they are the same thing.

  ---

  ### Non-Negotiables vs. Tastes

  **Non-Negotiable (The Spec):**
  *   **Marginal Impact Sensitivity:** If the framework doesn't adjust for donor size, it is broken for you.
  *   **Normative Explicitness:** If it hides values in math, reject it.
  *   **Epistemic Transparency:** If it treats models as facts, reject it.

  **Taste / Camp Preference (The Config):**
  *   **Time Discounting:** How much do you value future people? (Longtermist vs. Presentist). This is a value choice, not a math error.
  *   **Risk Tolerance:** Do you prefer saving 100 lives for sure, or a 1% chance of saving 1,000,000? (Utilitarian vs. Risk-Averse).
  *   **Proximity Weight:** Do you value your neighbor 10% more than a stranger? (Communitarian vs. Cosmopolitan).

  ---

  ### Evaluation of the ITN Framework (Importance, Tractability, Neglectedness)

  The **ITN framework** (popularized by Open Philanthropy/Effective Altruism) is the industry standard for a reason, but it has a specific failure mode for your context.

  *   **Importance:** Handles Scale well.
  *   **Tractability:** Handles "can this be solved?" well.
  *   **Neglectedness:** Handles Marginal Impact well.

  **Where ITN Fails Hardest:** **Requirement #2 (Epistemic Transparency) and #5 (Psychological Sustainability).**

  ITN tends to treat "Importance" and "Tractability" as objective metrics derived from models. For a small donor, this collapses the distinction between "seeing the food bank line" and "reading a paper on AI alignment." It often demands you trust the spreadsheet over the eyeball.

  Furthermore, ITN is notoriously bad at **Psychological Sustainability**. It frequently points donors toward causes where feedback loops are decades long (policy change, existential risk). For a workplace giving circle that meets once a year and wants to feel they accomplished something, a pure ITN approach often leads to "compassion fatigue" or decision paralysis because the problems are too big and the verification too distant.

  **Verdict:** ITN is a good engine, but it lacks a steering wheel for human psychology and epistemic humility. If you use it, you must manually override it to account for your need to *see* the good you do, or you will burn out.
