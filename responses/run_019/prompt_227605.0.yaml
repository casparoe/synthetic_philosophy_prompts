      *   Check the "Honest Diagnosis" for balance. (e.g., acknowledge Stoet & Geary vs. Falk & Hermle).

  *(Self-Correction during drafting)*: I initially thought about attacking (3). But the user specifically said "I want to keep (1)-(3)... I suspect something slips between (3) and (4)." I should honor that intuition while noting (3) is the empirical weak point in the literature. I will mark (3) as "Holds (provisionally)" to respect the user's constraint, but mark (4) as "Fails."

  *(Refining Step 1)*: Step 1 says choices reflect "what they actually want." The problem is "what they actually want" is not a pre-socialized entity. I should mark (1) as "Needs Amending" because it defines "wants" too narrowly. But (4) is the bigger inference leap. I'll stick with (4) as the primary failure.

