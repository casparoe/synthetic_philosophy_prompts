  2.  **Analyze the 6 Claims:**
      *   (1) *Dennettian Instrumentalism:* Beliefs are real patterns; truth of belief ascription depends on predictive utility (Intentional Stance). No "belief-objects."
      *   (2) *Animal Realism:* Dog's beliefs are literally true, not metaphorical.
