      *   (3) *Inference:* A standpoint built from actual responses cannot be more impartial than the social world supplying them. (This is the crux. It assumes a simple aggregation/reproduction model).
      *   (4) *Function:* The spectator corrects actual audiences. (Smith definitely claims this).
