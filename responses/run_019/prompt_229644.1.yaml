answer: |-
  This is a classic "hard case" moment in Mara's internal jurisprudence. Her prior rulings create a pattern, but the *Kalliopi* tests the boundary of that pattern. Here is the breakdown of how she should rule to maintain consistency, the principles at stake, and how to probe her reasoning further.

  ### 1. The Verdict: Consistency vs. Expansion
  To stay strictly consistent with the **implicit reasoning** of her prior verdicts, Mara should rule that the *Kalliopi* is a **different boat**.

  Here is why: In all three prior cases (*Merope*, Van, Footbridge), there is a hidden constant that never varied: **the structural core remained original.**
  *   *Merope:* Keel and ribs (skeleton) stayed.
  *   Van: Chassis and frame (skeleton) stayed.
  *   Footbridge: Load-bearing beams (foundation) stayed.

  In legal terms, this suggests the *ratio decidendi* (reason for the decision) of her past cases is not merely "gradual replacement preserves identity," but rather "gradual replacement of *non-structural* components preserves identity."

  *   **If she rules "Same Boat":** She is **expanding** the precedent. She is establishing a new principle that *functional continuity* trumps *material core*. This is consistent with the *outcome* of her past cases (all "Same"), but inconsistent with the *distinguishing facts* (all kept the core).
  *   **If she rules "Different Boat":** She is **distinguishing** the case. She is adhering to the principle that the "skeleton" of the artifact is essential to its identity. This is the more legally conservative move, treating the retention of the keel/frame in the *Merope* case as a necessary condition rather than a coincidental fact.

  **Recommendation:** If Mara values doctrinal stability, she rules **Different**. If she values functional intuition, she rules **Same**. However, since you asked what she should do to "stay consistent with her earlier verdicts" (implying the reasoning behind them), the stronger argument is **Different**, because the *Kalliopi* removes the one feature present in 100% of her prior "Same" rulings.

  ### 2. The Closest Analog
  The closest precedent is undoubtedly **the *Merope* sloop**.

  *   **Category Match:** Both are vessels (boats), invoking the same specific intuitions about maritime identity, unlike the van (vehicle) or bridge (structure).
  *   **Process Match:** Both involve the replacement of hull planks.
  *   **The Distinction:** The *Merope* ruling explicitly noted that the "keel and ribs were never touched." This detail was likely not decorative; it was the anchor of her verdict. The *Kalliopi* removes that anchor.

  ### 3. The Principles at Stake
  Since her prior cases underdetermine the answer (they never tested the loss of the core), her verdict on the *Kalliopi* will codify one of two competing principles:

  *   **Principle A (Spatio-Temporal Continuity):** If she rules **Same**, she adopts the view that identity is a process, not a substance. As long as the object maintains its form and function through a continuous history of service, the material composition is irrelevant.
      *   *Maxim:* "The ship is its voyage, not its wood."
  *   **Principle B (Structural Essentialism):** If she rules **Different**, she adopts the view that certain material components (the load-bearing frame) constitute the "essence" of the artifact. Once the essence is replaced, the original artifact ceases to exist, even if the replacement is gradual.
      *   *Maxim:* "The ship is its skeleton; the skin is expendable."

  ### 4. The Next Case to Settle the Principle
  To finally determine which principle Mara is actually using, you need a case that **decouples Continuity from Materiality.** The *Kalliopi* case keeps Continuity but loses Materiality. You now need a case that keeps Materiality but breaks Continuity, or pits them against each other.

  **The "Reassembly" Case (The Hobbesian Variant):**
  Bring her a case where the original parts *are* saved.
  > "A ship, the *Theseus*, has its planks and ribs replaced gradually over time (like the *Kalliopi*), **but** the removed original parts are stored in a warehouse. After the last original part is removed from the ship, a builder takes the stored original wood and reassembles it into a seaworthy vessel using the original design."

  **Why this settles it:**
  *   **If she follows Principle A (Continuity):** She must say the *continuous* ship (the one that never stopped sailing) is the *Theseus*, and the reassembled one is a replica.
  *   **If she follows Principle B (Materiality):** She must say the *reassembled* ship (made of the original wood) is the *Theseus*, and the continuous ship is a new construction.
  *   **If she follows a Hybrid:** She might claim *neither* is the *Theseus*, or that identity is ambiguous.

  This forces her to choose between the **history of the object** (Continuity) and the **matter of the object** (Materiality), revealing exactly which weight she gives to the "structural core" she relied on in the *Merope* case.
