  4.  **Drafting - Scene 2: The Car Ride (The Debate):**
      *   *Opening:* Narrator brings up the promise.
      *   *Perdurantist (David):* Explains the worm view. Is it comforting? Maybe it separates the "stage" suffering from the "whole" life.
      *   *Endurantist (Sarah):* Counters. The whole person is here *now*. If she's suffering, *she* is suffering.
      *   *Temporary Intrinsics:* How can she be irritable now but sweet before? Sarah: She has properties relative to times. David: No, distinct temporal parts have distinct properties.
      *   *The Promise:* David: You promised a past stage. Does that bind you regarding future stages? Sarah: You promised *her*. The same entity.
      *   *Feelings:* Is it okay to grieve someone still alive?
      *   *Closing:* No definitive winner, but a shift in perspective.

  5.  **Refining the Philosophy (Checking Constraints):**
      *   *Endurantism:* Wholly present. Change involves having properties at times (adverbialism or relationalism).
      *   *Perdurantism:* Temporal parts. Change is qualitative variation across parts.
      *   *Temporary Intrinsics:* Lewis's argument. How can one thing be bent and straight? Endurantist says "bent at t1, straight at t2". Perdurantist says "t1-part is bent, t2-part is straight".
      *   *Application to Dementia:* Does the "worm" view make the loss less personal? Or does the "enduring" view make the loss more tragic but the obligation clearer?

  6.  **Writing - Step-by-Step:**

