answer: |-
  The car door shut, sealing us in the quiet. In the backseat, my mom's house faded into the rearview mirror. She'd been sharp today, snapping at me for folding the laundry wrong. It wasn't her. Or was it?

  "So," David said, breaking the silence. He's a perdurantist. "How are you holding up?"

  "I feel like I'm keeping a promise to a ghost," I said. "I told her I'd keep her at home. But the person I promised... she's slipping away."

  Sarah, riding shotgun, turned around. She's an endurantist. "She's not slipping away, Alex. She's right there. She's wholly present in that house, just as she ever was."

  "But she's different," I said. "How can she be the same person if her properties change so radically? She was patient; now she's irritable."

  "That's the problem of temporary intrinsics," David said gently. "How can one object have contradictory properties? My view handles this cleanly. Your mom is a four-dimensional worm extending through time. The 'past mom' stage has the property of patience. The 'current mom' stage has the property of irritability. They're different temporal parts of the same whole. There's no contradiction because different parts have different qualities."

  "Does that help?" I asked. "Or does it just turn her into a stack of snapshots?"

  "It depends," David said. "Think about the promise. You made it to an earlier temporal part. Does that obligation bind the future parts? Maybe not strictly. But looking at her as a whole worm... this difficult stage is just a segment. The whole life still contains all the kindness. It prevents this current suffering from defining her entirety."

  "That's horrifying," Sarah cut in. "Alex isn't dating a worm. He's loving a person. Endurantism says she is wholly present at every moment. When you look at her, you see *her*, not a slice. Yes, she has properties relative to times. She is-patient-at-t1 and is-irritable-at-t2. It's the same substance undergoing change."

  "But does that help me?" I asked. "If she's wholly here, and she's miserable, then *she* is miserable. There's no distancing."

  "Exactly," Sarah said. "And that matters morally. If you treat her as a series of stages, you might justify putting her in a home because it helps the 'current stage' even if it violates the wish of the 'past stage.' But if she's one enduring entity, the promise binds the whole person. You owe it to *her*, not a version of her."

  David leaned forward. "But see, that's where the worm view might actually be kinder. If you view her as enduring, her identity is tied to her psychological continuity. When that breaks, you're left wondering if she's still 'her.' That's what's tearing you up. On my view, the continuity doesn't have to be perfect for the worm to persist. You can acknowledge the break without denying her existence. It dissolves the question 'Is she still her?' because 'she' is the aggregate."

  "It dissolves the question by deleting the subject," Sarah countered. "Alex, when you feel your feelings changing, when you feel grief for someone still breathing... endurantism validates that. You are grieving the loss of capacities in the very person sitting in front of you. It's a real loss. Perdurantism asks you to zoom out so far you barely see the pain."

  "I don't want to zoom out," I admitted. "But I want to know if I'm betraying her."

  "Here's the thing," David said. "If she's a worm, your relationship is with the whole thing. You care for the worm by caring for whichever stage is active. If the current stage needs care that violates the past stage's instructions, you're balancing the welfare of the whole timeline. It's not betrayal; it's stewardship."

  "Stewardship of an object," Sarah muttered.

  "Stewardship of a life," David corrected. "Alex, does viewing her as a 4D object make you feel less guilty?"

  "It makes me feel... less like I'm watching a murder," I said slowly. "Like this is just a chapter, not the whole book burning."

  "But," Sarah added softly, "don't let the metaphysics absolve you of the present moment. If she's wholly here, then her comfort right now is paramount. The promise matters, but the person suffering matters more. Endurantism demands you face the contradiction: she is the same person, but she needs different things now. That's hard, but it's honest."

  We drove in silence for a mile. The streetlights flickered past—spatial parts of the road we were traversing.

  "So," I said. "David thinks I'm caring for a worm. Sarah thinks I'm caring for a soul that's changing shape."

  "Both agree you have to drive back tomorrow," David said.

  "And both agree you love her," Sarah said. "The metaphysics just changes where the hurt sits."

  I looked at the road ahead. The worm view made the pain smaller, distributed across time. The enduring view made the pain sharper, concentrated in the now. Neither fixed the dementia. But knowing there were two ways to map the loss made the territory feel slightly less like a trap.

  "Thanks," I said. "I think I need the hurt to be sharp. But maybe later, I'll need the worm."
