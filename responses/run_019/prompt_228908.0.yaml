  2.  **Character Conception:**
      *   *Endurantist:* Let's call her Sarah. She believes the whole person is present at every moment. She might emphasize the core "self" that remains despite changes.
      *   *Perdurantist:* Let's call him David. He believes persons are spacetime worms composed of temporal parts. He might emphasize continuity and stages.
      *   *Narrator:* The friend/child of the patient. Anxious, seeking clarity.

  3.  **Drafting - Scene 1: The Visit (Setting the Stage):**
