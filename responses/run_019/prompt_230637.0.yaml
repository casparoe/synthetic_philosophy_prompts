prompt: |-
  I teach social and political philosophy, and I've somehow ended up chairing our college's study-abroad advising committee. The questions students keep bringing in are exactly the ones the philosophy of conventions and social norms is about, but our advisors have no systematic way to turn that into usable advice. The recurring question is some version of: 'Do I actually have to tip here? queue this formally? not cross against the light? or am I just doing it to avoid weird looks?' Advisors see several students a day in peak season, have maybe fifteen minutes each, and whatever guidance they give ends up in the handbook I have to sign off on, so I need something defensible and reusable, not a one-off opinion. Get it wrong and a student either offends their hosts or follows some local practice they find demeaning out of misplaced scrupulousness.

  So: you're an expert on social norms, conventions, and the line between the conventional and the moral. Please draft a one-page decision procedure — a checklist or flowchart in words — that a non-philosopher advisor can run through with a student to determine whether the student is morally required, merely expected, or free to skip a local convention. Draw on whatever philosophical work on conventions and norms you actually know, but do not cite anything; I want the reasoning compressed, not a reading list. Think carefully, and maybe start by listing the different reasons a norm can bind a visitor before you collapse them into steps. The procedure should distinguish (at least) between: (a) norms whose violation would impose real costs on someone who reasonably relied on you, like a tipped worker whose employer can legally pay them a couple dollars an hour; (b) harmless coordination devices like a queue; and (c) norms that work mostly as ways of showing respect or recognition, like forms of address and greetings. It should also handle the asymmetry where a local breaking their own norm can look like critique or reform, while a visitor doing the same thing reads as contempt. It should say what to do when compliance is cheap but the student objects on principle, and it should mark the steps where the procedure can't settle things and has to hand the decision back to a person because it's a value conflict rather than an application of a norm.

  Then run the procedure on three cases. First: a student going to a U.S. state where servers earn a tipped minimum wage and depend on tips, who believes tipping is a pernicious custom that lets employers underpay workers and wants to refuse to tip as a protest; I suspect the procedure will tell them to tip anyway, and I want that made honest and uncomfortable rather than softened. Second: a student in a city where crossing against the light is technically a petty offense but totally unenforced, and the host family crosses against the light constantly. Third: a student told they must wait in a long, formal queue at a market where, as far as they can tell, nobody would be harmed by stepping ahead. Lastly, tell me plainly what the procedure cannot do — which cases its likely to misclassify, and where the biggest judgment calls are hidden inside steps that look mechanical.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Social and political philosophy professor, now chairing a study-abroad advising committee.
      *   **Problem:** Students ask about local norms (tipping, queuing, jaywalking). Advisors lack a systematic way to advise. Advice needs to be defensible, reusable, and fit into a handbook.
      *   **Task:** Draft a one-page decision procedure (checklist/flowchart in words) for non-philosopher advisors to determine if a norm is morally required, merely expected, or optional.
      *   **Key Distinctions:**
          *   (a) Norms with real reliance costs (e.g., tipped wages).
          *   (b) Harmless coordination devices (e.g., queues).
          *   (c) Norms of respect/recognition (e.g., greetings).
          *   Asymmetry: Local breaking norm = critique/reform; Visitor breaking norm = contempt.
          *   Compliance cheap vs. principled objection.
          *   Identify where value conflicts remain (hand back to person).
      *   **Constraints:** Draw on philosophical work on norms/conventions but *do not cite*. Compress reasoning.
      *   **Follow-up:** Run the procedure on three specific cases (Tipping protest, Jaywalking with hosts, Queue jumping).
      *   **Conclusion:** Explain limitations (misclassifications, hidden judgment calls).

  2.  **Deconstruct the Philosophy of Norms (Internal Knowledge):**
      *   *Conventions vs. Morals:* Lewisian conventions (coordination equilibria) vs. Moral obligations (harm, fairness, respect).
      *   *Reliance/Expectation:* If someone relies on your compliance for their livelihood or safety, breaking the norm harms them directly (Scanlonian principle of fidelity/reliance).
      *   *Signaling/Respect:* Norms often signal membership or respect. Violating them as an outsider signals rejection of the community, not internal reform.
      *   *Cost-Benefit:* If compliance is low cost and violation causes confusion/offense, comply (pragmatic morality).
      *   *Complicity:* Does following the norm make you complicit in an unjust system? (The tipping case).
      *   *The "Visitor" Status:* Visitors are guests. Guests have a duty of non-disruption that locals (citizens/agents of change) do not have.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Make it actionable for a 15-minute advising session.
      *   *Structure:* Step-by-step questions leading to a verdict (Required, Expected, Optional).
      *   *Step 1: Harm & Reliance.* (The "Tipped Wage" test). Does someone lose money/safety if I don't do this?
      *   *Step 2: Coordination & Chaos.* (The "Queue/Traffic" test). Does this break the system for everyone?
      *   *Step 3: Respect & Signaling.* (The "Guest" test). Does this look like contempt coming from an outsider?
      *   *Step 4: Principled Objection.* (The "Complicity" test). Is the norm itself unjust? Can I opt out without shifting harm to the vulnerable?
      *   *Step 5: The Handoff.* Where does philosophy stop and personal conscience begin?

      *Refining the Steps:*
      *   Need to explicitly handle the "Local vs. Visitor" asymmetry.
      *   Need to handle the "Cheap Compliance" vs. "Principled Objection" tension.
      *   *Drafting thought:* Let's organize it by "Filters." Filter 1: Harm. Filter 2: Coordination. Filter 3: Respect. Filter 4: Justice/Complicity.

  4.  **Running the Cases:**
      *   *Case 1 (Tipping):*
          *   Harm: Yes, server loses income (reliance).
          *   Coordination: No.
          *   Respect: Mixed, but economic harm outweighs.
          *   Justice: System is unjust, but refusal punishes worker, not employer.
          *   *Verdict:* Morally Required (uncomfortably).
      *   *Case 2 (Jaywalking):*
          *   Harm: Low (if no cars).
          *   Coordination: Low (if hosts do it).
          *   Respect: Hosts are modeling the behavior.
          *   *Verdict:* Permissible/Expected (follow the host).
      *   *Case 3 (Queue Jumping):*
          *   Harm: Low immediate harm, but undermines the system.
          *   Coordination: High (queues rely on universal compliance).
          *   Respect: High (cutting is seen as arrogant).
          *   *Verdict:* Expected/Required (don't cut).

  5.  **Identifying Limitations:**
      *   Where does it fail?
      *   *Hidden Judgment:* Determining "Harm" isn't always empirical (e.g., psychological harm of disrespect).
      *   *Complicity:* When does following a norm become immoral? (e.g., segregation era norms). The procedure might lean too conservative.
      *   *Cultural Interpretation:* Advisors might misjudge the "Respect" weight.
      *   *The "Guest" Privilege:* Sometimes locals *want* visitors to break norms to show they are friends, but the procedure might say "don't."

  6.  **Writing the Response:**
      *   *Tone:* Professional, academic but practical, direct (no fluff).
      *   *Format:* Clear headings, bold text for emphasis, distinct sections for Procedure, Cases, and Limitations.
      *   *Constraint Check:* No citations. One-page feel (concise). Address all specific prompt requirements (asymmetry, reliance, respect, handoff).

      *(Self-Correction during drafting)*: Make sure the "Asymmetry" point is explicit in the procedure. Locals break norms to change them; visitors break norms to reject the hosts. This needs to be in Step 3.
      *(Self-Correction on Tipping)*: Ensure the advice doesn't just say "Tip." It needs to explain *why* it's required despite the injustice, acknowledging the moral residue.
      *(Self-Correction on Limitations)*: Be honest about the "Conservative Bias." Procedures like this tend to favor order over justice.

  7.  **Final Polish:** Check against the prompt's specific list of requirements one last time.
      *   Distinguish (a) reliance, (b) coordination, (c) respect? Yes.
      *   Handle asymmetry (local vs visitor)? Yes.
      *   Handle cheap compliance vs principle? Yes.
      *   Mark value conflict handoffs? Yes.
      *   Run 3 cases? Yes.
      *   Plain talk on limitations? Yes.
      *   No citations? Yes.

      *Let's assemble.*
answer: |-
  ### The Visitor's Normative Decision Procedure

  **Purpose:** To distinguish between moral obligations, social expectations, and optional conventions for students studying abroad.
  **Usage:** Advisors should walk students through these four filters in order. If a filter yields a definitive result, stop. If the student objects at Step 4, the decision is returned to the student as a matter of conscience.

  #### Filter 1: Reliance and Harm (The "Vulnerable Party" Test)
  **Question:** Does a specific person or group rely on your compliance for their economic livelihood, physical safety, or basic welfare?
  *   **Yes:** The norm is **Morally Required**.
      *   *Reasoning:* When a local structure creates reliance (e.g., a wage system dependent on tips), violating the norm transfers the cost of your protest onto a vulnerable individual who did not design the system. You are not protesting the system; you are penalizing the worker.
  *   **No:** Proceed to Filter 2.

  #### Filter 2: Coordination and Order (The "System Integrity" Test)
  **Question:** Is this norm a coordination device where universal compliance is necessary for the system to function (e.g., traffic, queuing, silence in libraries)?
  *   **Yes:** The norm is **Socially Required**.
      *   *Reasoning:* These are "conventions." Their value exists only if everyone follows them. Opting out creates chaos or unfair advantage (free-riding).
      *   *Exception:* If the hosts (locals you are with) explicitly model breaking the norm in a low-stakes context, you may follow their lead. See Filter 3.
  *   **No:** Proceed to Filter 3.

  #### Filter 3: Respect and Signaling (The "Guest Status" Test)
  **Question:** Is this norm primarily a signal of respect, hierarchy, or group membership (e.g., greetings, dress codes, forms of address)?
  *   **Yes:** The norm is **Expected (with an Asymmetry Clause)**.
      *   *The Asymmetry:* A local breaking this norm signals *reform* or *intimacy*. A visitor breaking this norm signals *contempt* or *superiority*.
      *   *Guidance:* As a guest, you lack the standing to break symbolic norms unless invited. Compliance is the "price of admission" for cross-cultural exchange.
      *   *Cost Check:* If compliance is cheap (low effort/cost) and violation causes offense, you must comply.
  *   **No:** Proceed to Filter 4.

  #### Filter 4: Principled Objection (The "Complicity" Handoff)
  **Question:** Does complying with this norm make you complicit in a grave injustice (e.g., segregation, discrimination), or does it violate a core human right?
  *   **Yes:** **Handoff to Conscience.**
      *   *Guidance:* The procedure cannot settle this. The student must weigh the risk of expulsion/offense against their moral integrity. Advisors should not authorize the violation but must support the student's right to conscience. Document the reasoning.
  *   **No:** **Optional.**
      *   *Guidance:* If there is no harm, no system breakdown, no disrespect, and no injustice, the student is free to act as they prefer.

  ***

  ### Application to Cases

  **Case 1: The Tipping Protest**
  *   **Filter 1 (Reliance):** **YES.** In this jurisdiction, servers rely on tips for living wages due to legal sub-minimum base pay.
  *   **Verdict:** **Morally Required.**
  *   **Advisor Script:** "Your objection to the system is valid, but withholding the tip does not punish the employer; it punishes the server who relies on that income to eat and pay rent. You are effectively using the worker as a means to your political end. You must tip. If you wish to protest, do it by writing to the employer or campaigning for labor law changes, not by withholding wages from the worker."

  **Case 2: Jaywalking with Host Family**
  *   **Filter 1 (Reliance):** **NO.** No specific individual relies on the student waiting.
  *   **Filter 2 (Coordination):** **NO/EXCEPTION.** While traffic rules are coordination devices, the "Host Exception" applies. The locals (hosts) are modeling the behavior, signaling that in this specific context, the convention is relaxed.
  *   **Filter 3 (Respect):** **NO.** Following the host's lead signals integration, not contempt.
  *   **Verdict:** **Permissible.**
  *   **Advisor Script:** "Normally, traffic laws are strict coordination rules. However, when your hosts model the behavior, they are signaling that the local convention allows for discretion here. Following them is safe and socially appropriate. Do not do this alone in a different neighborhood where the norm might differ."

  **Case 3: The Formal Queue**
  *   **Filter 1 (Reliance):** **NO.** No specific person is harmed immediately.
  *   **Filter 2 (Coordination):** **YES.** Queues function only on universal compliance. Stepping ahead is "free-riding" on the patience of others.
  *   **Filter 3 (Respect):** **YES.** Cutting a line is universally read as a claim of superiority ("My time is more valuable than yours").
  *   **Verdict:** **Socially Required.**
  *   **Advisor Script:** "Even if no one is physically harmed, this breaks the coordination system. More importantly, as a visitor, cutting the line will be read as you claiming you are too important to wait like everyone else. It creates immediate social friction. You must wait."

  ***

  ### Limitations and Hidden Judgment Calls

  This procedure is a tool for risk management and ethical clarity, but it is not an algorithm. It contains three significant failure points that advisors must recognize:

  1.  **The Conservative Bias:** The procedure defaults to compliance. It prioritizes harmony and non-harm over social change. It will struggle in cases where a norm is *slowly* changing (e.g., gendered greetings). It may advise a student to comply with a norm that locals are actively trying to dismantle. Advisors must listen for cues that a norm is contested *by the locals*.
  2.  **Defining "Harm" in Filter 1:** Harm is not always economic. In Filter 3, "offense" is treated as a cost, but offense is subjective. An advisor might underestimate how demeaning a specific greeting ritual feels to a student (e.g., bowing based on gender). The procedure treats this as "cheap compliance," but for some students, it is a dignity violation. This is a hidden value judgment.
  3.  **The "Grave Injustice" Threshold in Filter 4:** The procedure hands off the decision at Filter 4, but it does not define "grave." Is a dress code grave? Is a religious observance? Advisors will have to make the call on where "cultural difference" ends and "rights violation" begins. The procedure protects the college from liability, but it does not solve the moral dilemma for the student.

  **Final Note to Advisors:** If you find yourself arguing with a student at Filter 3 or 4, stop advising and start listening. You have reached the limit of the procedure and entered the realm of personal values. Document the conversation, ensure the student understands the social risks, and let them decide.
