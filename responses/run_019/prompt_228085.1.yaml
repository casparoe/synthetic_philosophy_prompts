      *(Self-Correction during drafting)*: I need to be careful about Case 4. Case 4 is *very* strong evidence for Precedent Autonomy overriding Current Interests. The patient was "seemed content" but they withdrew nutrition. This led to death. The *outcome* was death of a content patient. The *means* was omission. In the new case, the *outcome* is death of a content patient. The *means* is commission.
      If the committee is consistent on *Outcomes* (AD rules), they Approve.
      If the committee is consistent on *Means* (No Killing), they Decline.
      Which is more fundamental to a *Clinical Ethics Committee*? Usually, the Means (Act/Omission) is the traditional bioethical bright line. However, Case 4 is a very aggressive ruling for a traditional committee. Withdrawing AN from a content dementia patient is controversial. If they did that, they might be bolder than I think.
      *Decision:* I will predict **Decline**, but highlight that Case 4 makes it a very close call. The Act/Omission distinction (Case 3 vs Case 1) is the historical bedrock. Case 4 is the outlier that stretches the boundary of *when* we let die, not *how*.
