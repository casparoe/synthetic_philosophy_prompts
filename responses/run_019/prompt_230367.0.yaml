answer: |-
  You have hit on a very sharp intuition that often gets glossed over in introductory surveys of compatibilism. Your sense that Dennett and Frankfurt are answering different questions is largely correct, though there is enough overlap that they do end up competing for the title of "true compatibilism."

  Here is the breakdown of why they feel distinct, where they actually clash, and which one better captures why ordinary people care about free will.

  ### 1. Different Questions: Competence vs. Authenticity

  You are right to sense a category difference.

  **Dennett is asking a pragmatic, functionalist question:**
  *   *Question:* "What capacities must an agent possess to be a valid target of moral praise, blame, and social coordination?"
  *   *Focus:* **Control and Competence.** Dennett is interested in *evitability*. Can the agent detect reasons? Can they adjust behavior to avoid bad outcomes? Is the agent responsive to the social environment?
  *   *Metaphor:* The Engineer. Dennett treats the agent like a control system. If the system has enough sensors and actuators to navigate hazards and respond to signals, it has "free will worth wanting." It is an externalist view focused on what the agent can *do* in the world.

  **Frankfurt is asking a structural, psychological question:**
  *   *Question:* "What makes a will belong to the agent, such that the agent is the true source of the action?"
  *   *Focus:* **Identification and Authenticity.** Frankfurt is interested in *volitional hierarchy*. Do your first-order desires (I want to smoke) align with your second-order volitions (I want to want to quit)? Are you wholehearted, or are you conflicted?
  *   *Metaphor:* The Psychologist. Frankfurt treats the agent like a psyche. Even if you have total control over your actions (Dennett-competence), if you are acting on desires you hate or feel alienated from, you lack freedom of the *will*. It is an internalist view focused on who the agent *is*.

  **The "Talking Past" Element:**
  Dennett is largely defending **Freedom of Action** (interpreted compatibilistically). He wants to show that determinism doesn't rob us of the ability to navigate life.
  Frankfurt is defending **Freedom of the Will**. He wants to show that determinism doesn't rob us of authorship, provided our psychic structure is right.

  ### 2. Do They Compete?

  They are rivals in the sense that they offer different criteria for exculpation (excusing someone from blame). This is where the rubber meets the road.

  **Case A: The Willing Addict (Frankfurt's famous example)**
  *   **Frankfurt:** If the addict identifies wholeheartedly with their addiction (they love being an addict), they are free. They have no internal conflict.
  *   **Dennett:** The addict likely lacks freedom. Why? Because they lack the *competence* to do otherwise if reasons demanded it. They are not responsive to the full range of reasons. Their control system is broken.
  *   *Verdict:* **Competition.** Frankfurt says they are free; Dennett says they are not.

  **Case B: The Conflicted Moral Agent**
  *   **Scenario:** A person desperately wants to steal but holds themselves back through great effort, wishing they didn't have to struggle so much.
  *   **Frankfurt:** This person is not "wholehearted." They are divided. Their freedom is impaired by their lack of identification with their restraining will.
  *   **Dennett:** This person is highly free. They demonstrated self-control, responsiveness to moral reasons, and the ability to revise plans. They have the competences that matter.
  *   *Verdict:* **Competition.** Dennett says they are free (high competence); Frankfurt says their will is partially unfree (lack of harmony).

  **Case C: The Satisfied Slave (The "Brave New World" objection)**
  *   **Scenario:** A person is brainwashed to love their servitude. They have no desire to be free.
  *   **Frankfurt:** They are wholehearted. They identify with their desires. Technically, they might count as having a free will, which many find counterintuitive (the problem of *manipulation*).
  *   **Dennett:** They are not free. Their competences have been curtailed. They cannot access certain options or process certain reasons (e.g., reasons to rebel). Their "elbow room" has been physically and socially restricted.
  *   *Verdict:* **Competition.** Dennett handles manipulation/coercion better via the "competence" metric; Frankfurt struggles here unless he adds caveats about how the identification was formed.

  ### 3. The Verdict: Which explains why ordinary people care?

  If I have to pick one as the better account of why **ordinary people** care about free will, I pick **Dennett**.

  Here is the justification:

  **1. The "Worth Wanting" Criterion matches Ordinary Stakes**
  Ordinary people do not usually lie awake at night worrying about whether their second-order volitions align with their first-order desires. They worry about **consequences**.
  *   "Will I be punished for this?"
  *   "Could I have stopped?"
  *   "Am I capable of changing my life?"
  Dennett's "competences" map directly onto the legal and social practices that ordinary people encounter. When people demand free will, they are usually demanding the *capacity to be otherwise* in a way that makes punishment fair. Dennett explains why determinism doesn't threaten that capacity. Frankfurt's "wholeheartedness" is too introspective to account for the social sting of unfreedom.

  **2. The Intuition of Control**
  When ordinary people say, "I didn't do it of my own free will," they usually mean "I was coerced," "I was ignorant," or "I couldn't stop myself."
  *   "I couldn't stop myself" is a Dennettian lack of competence (self-control).
  *   "I was coerced" is a Dennettian restriction of options/responsiveness.
  Frankfurt's view implies that a person who struggles against a desire but succeeds (the conflicted moral agent) is *less* free than the wholehearted addict. This contradicts ordinary intuition. Ordinary people view the person who exerts self-control as the paradigm of free will, not the person who effortlessly follows their impulses.

  **3. Frankfurt is a Solution to a Philosophical Problem, Dennett is a Solution to a Life Problem**
  Frankfurt's theory was largely developed to solve the **Principle of Alternative Possibilities (PAP)** in the context of moral responsibility debates among philosophers. It is a technical fix to a metaphysical puzzle.
  Dennett's theory is developed to explain how **agency evolves** and how we live meaningful lives in a scientific world. It addresses the existential anxiety of the layperson: "If physics determines everything, does my choice matter?" Dennett answers: "Your choice matters because you are the control system that processes the reasons."

  **The Caveat:**
  Frankfurt wins on the issue of **authenticity**. If ordinary people are worried about brainwashing, manipulation, or "not feeling like themselves," Frankfurt's language of identification is closer to the mark. However, this is a subset of free will concerns. The broader, more fundamental concern is about **agency and accountability**, which is Dennett's home turf.

  ### Summary
  You are correct that they often talk past each other. Dennett is describing the **hardware requirements** for a responsible agent (can it process reasons? can it steer?), while Frankfurt is describing the **software architecture** (is the code self-endorsed?).

  However, Dennett provides the better account of why ordinary people care. We care about free will because we want to be effective navigators of our lives who can be justly held accountable. We want the "elbow room" to make a difference. That is a claim about competence and control, not just psychic harmony.
