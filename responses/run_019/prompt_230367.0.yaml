  **(Self-Correction on the Pick):** Actually, there's a strong case that Frankfurt captures the *deep* worry about manipulation (sourcehood) which ordinary people often gesture at when they reject determinism. But Dennett explicitly addresses the "worth wanting" aspect. The prompt asks: "better account of why ordinary people care." People care because they want to be authors of their lives *and* avoid unfair blame. Dennett covers the blame side better. Frankfurt covers the authorship side better. Which is more fundamental? Usually, the avoidance of unfair punishment (Dennett). I will stick with Dennett but acknowledge Frankfurt's strength on authenticity.

  9.  **Finalizing the Structure:**
