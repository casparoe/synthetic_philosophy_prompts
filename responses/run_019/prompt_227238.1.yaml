      *   *Correction on (4):* (4) is the *Brandenburg* test. This applies to *incitement*. It doesn't necessarily apply to *defamation* or *fraud*. The user's framework doesn't mention defamation. I should note that omission, but maybe not as a tension, just a gap. I'll stick to the requested tensions.
