      *   **Severity 2 (Moderate): (4) vs. (3) (Scope of "Public").**
          *   *Why:* (4) uses the *Brandenburg* test (imminent lawless action). This is the gold standard for *public* political speech. (3) covers harassment. What if the harassment is public? (e.g., tweeting slurs at a coworker). Does (4) protect it because it's not *imminent lawless action*, or does (3) ban it because it's *harassment*?
