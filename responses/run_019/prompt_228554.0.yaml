answer: |-
  Here is an adjudication of the debate, move by move, followed by an overall assessment.

  **Move 1 (Sam):** *Right-but-only-in-a-way-that-doesn't-do-what-its-speaker-needs.*
  While our ordinary concept of justice implies a judge, the philosophical concept of 'desert' can logically exist as a relation between a person and an outcome without an immediate agent to enforce it. Sam conflates the *existence* of a desert claim with the *administration* of it, which weakens his assertion that an impersonal mechanism is conceptually impossible.

  **Move 2 (Priya):** *Basically Right.*
  Priya correctly identifies that 'fittingness' is a coherent alternative to 'judgement', aligning with philosophical views that see moral value as objective rather than dependent on a spectator. This successfully reframes karma as a law of moral nature rather than a divine court, preserving the internal logic of the system.

  **Move 3 (Sam):** *Basically Right.*
  Sam identifies the two fatal flaws of karma as an empirical theory: it contradicts observable reality (the wicked prosper) and leads to repugnant moral conclusions (victim-blaming). Unless karma is removed from the realm of empirical testing, these objections are devastating to its credibility as a theory of justice.

  **Move 4 (Priya):** *Right-but-only-in-a-way-that-doesn't-do-what-its-speaker-needs.*
  By claiming the karmic ledger is unreadable, Priya immunises the theory against falsification, but at the cost of rendering it vacuous as an explanation for specific events. This move saves the doctrine from moral outrage but undermines Move 2's claim that the universe is rigged for fittingness, since we can never verify if fittingness has actually occurred.

  **Move 5 (Sam):** *Basically Right.*
  A theory of desert requires intelligible proportionality to function as justice; without a known exchange rate between action and outcome, the system is indistinguishable from randomness. Furthermore, a desert claim that is in principle unknowable to any moral agent cannot guide action or sustain a moral community.

  **Move 6 (Priya):** *Right-but-only-in-a-way-that-doesn't-do-what-its-speaker-needs.*
  While the analogy of aging highlights that physical continuity persists despite change, it fails to address the moral relevance of *memory* for responsibility and repentance. We hold the 70-year-old responsible partly because he retains psychological continuity and memory of the 20-year-old's agency, which rebirth explicitly severs.

  ***

  **Overall Verdict**
  Sam is closer to being correct regarding karma as a theory of *moral desert*. He successfully demonstrates that for desert to function as a moral concept, it requires intelligibility, proportionality, and some connection to agency that an impersonal, hidden mechanism cannot provide. Priya constructs a metaphysically consistent system, but she does so by retreating into unfalsifiability, which strips karma of its power to explain the world or guide moral judgement in the way her friend originally proposed.

  **What Both Are Missing**
  Both friends are treating karma primarily as a *retributive* theory of justice (balancing the books), whereas in its traditional soteriological contexts, karma is often *educative* or *therapeutic*. The point of karmic consequence is not necessarily that the sufferer 'deserves' pain in a judicial sense, but that the experience is required for soul-making or spiritual progress. By focusing strictly on desert, they miss the possibility that karma is a theory of moral *development* rather than moral *accounting*.

  **Survival and Generalisability**
  A version of karma-as-desert can survive Sam's points only if it abandons the claim to be an empirical description of the world and accepts status as a 'regulative ideal' or a matter of faith rather than reason. However, the failure is not specific to karma; it infects any 'judge-free' desert theory, such as Stoic providence or certain forms of natural law ethics. Any system that posits objective moral desert without a moral agent to administer it inevitably struggles with the problems of proportionality and the 'moral luck' of suffering, suggesting that desert may conceptually require a moral community to be coherent.
