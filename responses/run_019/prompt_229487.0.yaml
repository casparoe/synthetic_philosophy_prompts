answer: |-
  **MEMORANDUM**

  **TO:** Professional Conduct Committee
  **FROM:** Staff Counsel
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding File No. 23-044 (Structural Design Compliance)

  **Recommendation**

  I recommend that the Committee issue no formal discipline against the Respondent. Instead, we should close the case with a non-disciplinary Practice Advisory and mandate six hours of continuing education focused on load path anomalies and site-specific environmental modeling. This disposition balances the Board's duty to protect the public with the equitable principle that licensees cannot be sanctioned for failing to exceed codified requirements absent clear evidence of negligence.

  **The Philosophy of Rule-Following**

  The deadlock before us stems from a philosophical tension regarding professional agency. The faction favoring reprimand invokes the *Sphex* wasp to argue that mechanical rule-following is inherently unprofessional. However, a distinction must be drawn between being *caused* to act and acting *mechanically*. The wasp is causally determined by instinct; it lacks the capacity to vary its routine. The engineer, conversely, possesses the capacity for judgment but may choose to rely on heuristics (codes) for efficiency and standardization.

  Culpability arises not when an engineer follows a rule, but when they treat a rule as a talisman that negates the need for observation. Defensible reliance exists when the context falls within the rule's intended scope. Culpable rigidity occurs when salient anomalies—evidence that the rule's assumptions do not hold—are ignored. The professional duty is to remain alert to "defeaters" that invalidate standard procedures. In this case, the snow drift geometry was not a salient anomaly visible during design; it was a latent condition revealed only by extreme weather. The Respondent did not ignore visible danger; he encountered a scenario outside the epistemic horizon of current practice.

  **The Case for Discipline**

  The argument for a formal reprimand is principled and deserves rigorous acknowledgment. Its proponents argue that professionalism is defined by the exercise of judgment, not mere compliance. Codes are minimum standards, not exhaustive manuals. If we exonerate the Respondent, we risk signaling that the code is a safe harbor regardless of outcome, potentially encouraging a "checklist culture" where engineers cease to engage critically with unique site conditions.

  For this faction to prevail, two conditions must be met: first, it must be established that the risk was "patent" rather than "latent"—meaning any competent engineer observing the site would have identified the wind-parapet interaction as a unique hazard requiring analysis beyond code tables. Second, it must be shown that the engineer's reliance on the code was passive rather than active. If the evidence demonstrated that the Respondent ignored specific site warnings or dismissed peer concerns, the reprimand would be justified. Here, the investigation confirms no such warnings existed. To sanction based on hindsight would effectively impose a duty of omniscience, punishing the Respondent for not anticipating a phenomenon the profession itself has not yet codified.

  **Criteria for Future Adjudication**

  To resolve similar deadlocks in the future, I propose the Board adopt the following criteria when evaluating cases where harm occurred despite code compliance:

  1.  **Salience of Anomaly:** Did the site conditions present visible or known deviations from the standard assumptions underlying the code provisions used? Reliance is defensible when the context matches the rule's design; it becomes questionable when the context visibly exceeds it.
  2.  **State of the Art:** Was the failure mechanism known within the broader engineering community at the time of design? Licensees cannot be held to standards of knowledge that do not yet exist within the profession.
  3.  **Process vs. Outcome:** Did the licensee document a decision-making process that considered potential limitations of the code, even if they ultimately concluded compliance was sufficient? We must evaluate the reasoning process, not merely the structural outcome.

  **Conclusion**

  The Respondent designed a structure that failed under unforeseeable conditions, not negligent ones. While the *Sphex* analogy reminds us that professionals must not be mindless, it does not require them to be prophetic. A Practice Advisory allows the Board to highlight the importance of site-specific judgment without establishing a precedent that punishes compliance. This approach maintains the integrity of the licensing code while acknowledging the limits of individual foresight.

  I urge the Committee to vote accordingly.
