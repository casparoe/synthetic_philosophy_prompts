      *   Here, the engineer wasn't "Sphexish" in a blameworthy way because the anomaly was latent, not patent. However, the *ideal* of professionalism requires looking beyond the code when site conditions suggest unique risks.
      *   Refine: The line is crossed when the rule-follower ignores *defeaters*—evidence that the rule's assumptions don't hold. Was there evidence? The experts say yes (wind patterns around parapets). Was it obvious? Debatable.
      *   Position: Reliance is defensible when the rule's scope matches the context. It becomes culpable when the context visibly exceeds the rule's scope, and the engineer fails to engage judgment. In this case, it's a borderline case where the "visibility" of the risk is the crux.

