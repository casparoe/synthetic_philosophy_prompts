      *   **Application to Case:** Why this engineer falls where he does. He wasn't negligent, but the gap exists.
      *   **The Losing Side (Reprimand):** Argue their case strongly. Professionalism *is* judgment. If we don't sanction this, we endorse code-worship. Conditions for prevailing: If evidence showed the risk was obvious to any competent engineer on site.
      *   **Future Criteria:** Provide testable standards for the board.
