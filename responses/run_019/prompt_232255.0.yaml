answer: |-
  This is a strong, viable thesis, but it walks a tightrope between profound insight and retrospective rationalization. You are tapping into a well-established vein of Sidgwick scholarship (most notably Bart Schultz's *Henry Sidgwick: Eye of the Universe*), so you aren't discovering a hidden secret, but you can certainly refine the argument.

  Here is a breakdown of the strengths, risks, and specific evidentiary hurdles you need to clear to make this work.

  ### 1. Is it interesting or just a "neat narrative"?
  It is genuinely interesting, provided you avoid the "neatness" trap.
  *   **The Good:** It rescues Sidgwick's psychical research from being treated as a Victorian embarrassment or a eccentric hobby. It treats Sidgwick as a unified thinker. If *The Methods of Ethics* demands a "moral government of the universe" to reconcile Egoism and Utilitarianism, and Sidgwick is a rigorous empiricist who refuses to believe without evidence, then psychical research becomes the *scientific* search for the premises required by his *ethical* system. That is a compelling philosophical narrative.
  *   **The Risk:** The "neat narrative" risk lies in implying Sidgwick was instrumentalizing the SPR. If you portray him as thinking, "I need evidence for God, so I will look for ghosts," you risk caricaturing his scientific integrity. He didn't want *confirmation*; he wanted *data*. He was willing to accept negative results (and often did).
  *   **Verdict:** It is solid, but you must frame it not as "SPR was the solution" but as "SPR was the necessary *investigative method* for a problem philosophy could not solve alone."

  ### 2. Where is the inference weakest?
  The weakest link in the chain is the gap between **Psychical Phenomena** and **Moral Governance**.

  *   **The Inference:** You argue: *Dualism requires Divine Sanction $\rightarrow$ Divine Sanction requires Survival/Telepathy $\rightarrow$ Therefore, investigate Survival/Telepathy.*
  *   **The Problem:** Evidence of survival (ghosts, mediumship) does not logically entail evidence of *moral justice*. One can imagine a universe where souls survive but are eternally tormented, or where egoism is rewarded and virtue punished in the afterlife just as it might be on earth.
  *   **The Challenge:** Sidgwick knew this. He wasn't looking for just *any* afterlife; he was looking for evidence of a *moral order*. Did he genuinely believe the SPR could find evidence of *moral* order through telepathy? Or was he hoping that *any* breach of natural law (miracles/psychical phenomena) would open the door for theistic probability?
  *   **Fix:** You need to nuance the claim. He wasn't looking for a ledger of sins and rewards in the séance room; he was looking for evidence that the naturalistic closure of the universe was false. If nature is not closed, then a moral governor is *possible*. The SPR was about breaking naturalism, not proving justice directly.

  ### 3. Does motivation (friendship/grief) matter?
  It matters for the **genesis**, but less for the **sustenance**.
  *   **Genesis:** If he joined the SPR primarily because his wife Eleanor was interested, or due to grief over a friend, that undermines the "Philosophy by other means" thesis *only if* you claim the ethical problem was the *sole* cause.
  *   **Sustenance:** Sidgwick remained in the SPR for decades, often serving as president, despite skepticism from colleagues (like F.W. Maitland) and the scientific community. Why did he stay? If the ethical dualism was the *sustaining* reason for his continued rigorous involvement, the thesis holds even if the entry point was social.
  *   **Strategy:** Don't argue it was the *only* reason. Argue it was the *philosophically significant* reason. You can acknowledge the social network (the "Cambridge Apostles" milieu was steeped in this) while maintaining that the *weight* the research carried for him was ethical.

  ### 4. What evidence would flip the verdict?
  To move from "Solid Thesis" to "Overreach," look for the following in his letters and diaries:

  *   **The "Overreach" Trigger (Evidence against you):** If you find Sidgwick explicitly stating that psychical research is *irrelevant* to the moral question, or if he expresses satisfaction with the Dualism remaining unresolved *regardless* of SPR findings. If he treated the SPR as a "holiday" from philosophy, your thesis collapses.
  *   **The "Solid" Trigger (Evidence for you):**
      *   Letters where he links the *probability of theism* directly to *psychical evidence*. (He does have these; he speaks of the "empirical basis for religion.")
      *   Passages where he laments the lack of psychical evidence specifically because it leaves ethics "in the air."
      *   Evidence that he viewed the SPR not as a hobby, but as a branch of **empirical metaphysics** required to ground his normative ethics.

  ### 5. Which step is most likely to fail on closer reading?
  The step most likely to fail is the claim that he thought the SPR could **close the gap**.

  *   **The Trap:** Sidgwick remained an agnostic. He never claimed the SPR *proved* theism. He claimed it made theism *rationally permissible*.
  *   **The Failure Point:** If your title implies "Philosophy by other means" suggests he was *doing* ethics in the SPR, you might be overstating it. He was doing **epistemology of religious belief**.
  *   **Refinement:** A more precise formulation might be: *"Sidgwick's psychical research was the empirical precondition for his ethical system."*
  *   **Why this matters:** If you argue he was trying to *solve* the Dualism via SPR, a critic can point out that he died still acknowledging the Dualism. If you argue he was trying to *make belief in a solution rational*, you are on firmer ground. He needed to clear the epistemic roadblocks to believing in a moral governor, not find the governor himself.

  ### Summary Advice for the Essay
  1.  **Acknowledge the Scholarship:** Cite Bart Schultz. You don't need to reinvent the wheel, but you can sharpen the focus on the *instrumental* relationship between the *Methods* and the SPR.
  2.  **Soften the "Strong Version":** Instead of "You can't understand X unless Y," try "Y provides the crucial context that renders X intelligible as a rational project rather than a Victorian eccentricity."
  3.  **Focus on Naturalism:** Frame the SPR as an attack on **Scientific Naturalism**. Sidgwick's ethics require a non-naturalistic universe (one open to divine sanction). Scientific Naturalism says the universe is closed. The SPR tests the boundaries of the closed universe. This is a tighter logical link than "Ghosts = Justice."
  4.  **The "Philosophy by Other Means" Title:** It's catchy, but consider if it implies he was *disguising* philosophy as science. He wasn't. He thought it *was* science (broadly construed). Maybe *"Sidgwick's Psychical Research as Empirical Metaphysics"* is more accurate, though less punchy. If you keep the title, define "Philosophy" carefully in the intro.

  **Final Verdict:** It is a solid thesis, provided you don't claim the SPR was a *solution* to the Dualism, but rather the *search for the conditions of possibility* for a solution. That distinction saves you from the charge of smoothing over the messiness of his unresolved life.
