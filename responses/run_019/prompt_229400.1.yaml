      *   5. The Alternative Regime (Prompt-Based Authorship).
      *   Conclusion.

  *(Self-Correction on Copyright Office specifics)*: I should recall the "Zarya of the Dawn" case. They granted copyright for the text and arrangement, but not the individual images. This supports the "arrangement/selection" argument *if* it's complex enough, but simple selection of one AI image is out. I need to be precise there.

  *(Self-Correction on Camera Traps)*: The Compendium of U.S. Copyright Office Practices explicitly mentions works produced by nature, animals, or plants are not registrable. *However*, camera trap photos are generally registered to the photographer. Why? Because the photographer created the *situation*. The USCO distinguishes between a monkey taking a photo (Naruto v. Slater) and a photographer setting up a tripod where a deer *might* walk. The distinction is *human arrangement of the scene* vs. *non-human agency*. With AI, the AI is the "monkey" generating the pixels. With a camera trap, the deer is the "subject," but the light hitting the sensor is governed by the camera settings chosen by the human. With AI, the "light" is simulated by the model. This is a crucial distinction: *Recording reality* vs. *Synthesizing data.*

  Okay, I have enough to construct a robust answer. I will focus on the distinction between *determining the outcome* vs. *initiating the process.*
answer: |-
  This is one of the most pressing philosophical questions in contemporary aesthetics, and you have correctly identified that the current institutional practices are not based on a settled philosophy but on a series of pragmatic distinctions that are fraying at the edges.

  To answer your request, I will reconstruct the implicit theory of authorship currently governing copyright and major art competitions, analyze its coherence, and then sketch the alternative regime you asked for.

  ### 1. The Reconstructed Theory: "Causal Specificity"

  The practice of copyright offices (specifically the USCO) and traditional art competitions presupposes a theory of authorship I will call **Causal Specificity**.

  Under this theory, creativity is not merely the origination of an *idea* (the intent), nor is it merely the *novelty* of the result (the output). Creativity is the **human causal determination of the specific expressive details of the work.**

  *   **The Core Axiom:** To be an author, you must be the "master mind" who controls the chain of causality down to the level of the final form (the pixels, the brushstrokes, the notes).
  *   **The Tool vs. Agent Distinction:** A tool (brush, camera, Photoshop lasso) is an extension of the human will; it does exactly what the hand directs. An agent (an AI model, a monkey, a random wind gust) interprets the input and makes independent decisions about the final form.
  *   **The Threshold:** Authorship is granted only when the human contribution crosses a threshold of controlling the *outcome*, not just initiating the *process*.

  This is why the USCO denies copyright to text-to-image outputs: you asked for "a cat in a hat," but the model decided the lighting, the breed of cat, the angle, the texture of the hat, and the background. The human did not causally determine those specific expressive elements.

  ### 2. Strict Presuppositions vs. Convenient Fits

  Here is where the incoherence you sense begins to show. We must distinguish what the theory *requires* versus what it *tolerates*.

  **What the Practice Strictly Presupposes:**
  1.  **Execution over Conception:** An idea in the head is not art. The art exists only in the fixed form.
  2.  **Human Determinism:** The specific arrangement of sensory data must be traceable to a human decision, not a probabilistic algorithm.
  3.  **The "Gap" Test:** If there is a gap between the human instruction and the final output where a non-human entity makes aesthetic choices, authorship is voided in that gap.

  **What Merely "Fits" (The Inconsistent Exceptions):**
  1.  **The Camera Trap:** This is the biggest hole in the theory. In a camera trap scenario, the human sets the location and focus, but the *subject* (the animal) and the *timing* (the trigger) are non-human.
      *   *Why it fits:* Institutions treat this as "human authorship" because the human *arranged the conditions of reality* that were recorded. It is viewed as **discovery** of a pre-existing visual arrangement.
      *   *Why it contradicts:* The human did not determine the specific pixels. The deer's expression was not chosen by the photographer. If "Causal Specificity" were strictly applied, camera trap photos should be public domain (like the "Monkey Selfie" case). They are allowed because they capture *light from reality*, whereas AI captures *patterns from data*. The theory secretly relies on an ontological distinction between **recording** (photography) and **synthesizing** (AI), even if the level of human control is identical.
  2.  **Generative Fill (Photoshop):** This is the second hole. If I use Photoshop's Generative Fill to replace a background, I am using a diffusion model.
      *   *Why it fits:* The USCO views this as "assisted editing." The human defined the *boundaries* (the mask) and the *context* (the surrounding pixels). The AI is seen as a "smart brush."
      *   *Why it contradicts:* The AI is still making aesthetic decisions about lighting, texture, and form within that mask. If I prompt Midjourney with "background of a forest," it's banned. If I mask a background in Photoshop and prompt "forest," it's allowed. The strict theory of "Causal Specificity" cannot explain this, because in both cases, the AI is determining the pixels. The distinction is purely **workflow integration**: is the AI subordinate to a human-made structure (Photoshop), or is it the primary engine of structure (Midjourney)?

  ### 3. Rival Views of Creativity Quietly Ruled Out

  The current practice actively hostile to several viable theories of creativity:

  *   **Creativity as Curation/Selection:** This view holds that choosing *which* image exists is the creative act. (e.g., Duchamp's *Fountain*).
      *   *Ruled Out:* The USCO explicitly states that selecting the "best" output from an AI generator does not constitute authorship. Yet, a photographer selecting the best frame from 1,000 shots *is* authorship. The practice rules out curation as a creative act *unless* the source material was captured from reality by a human.
  *   **Creativity as Inner Intention:** This view holds that if the mental conception is complex and specific, the execution method matters less.
      *   *Ruled Out:* You can have a hyper-specific prompt (a complex mental conception), but if the machine executes it, you are not the author. The practice demands externalization through human motor control or direct command.
  *   **Creativity as Output Novelty:** This view holds that if the result is new and valuable, it is creative.
      *   *Ruled Out:* AI images are novel, but they are denied protection. The practice insists that novelty is necessary but not sufficient; the *provenance* of the novelty matters more than the novelty itself.

  ### 4. Is There a Real Inconsistency?

  **Yes.** The inconsistency lies in the definition of the "Tool."

  The current practice assumes a binary: **Instrument vs. Collaborator.**
  *   **Instrument:** Does exactly what is told (Brush, Camera, Photoshop Lasso).
  *   **Collaborator:** Interprets what is told and adds its own "spark" (AI Model, Jazz Bandmate).

  The inconsistency is that **Generative Fill is a Collaborator masquerading as an Instrument.** When you use Generative Fill, you are collaborating with the model on the texture and lighting of the filled area. The institution allows this because it is *contained* within a human-authored composition.

  However, this creates a slippery slope. If I use Generative Fill for 10% of the image, I own the copyright. If I use it for 90%, do I own 10%? The USCO says you must disclaim the AI parts. But visually, the AI parts are often indistinguishable from the human parts.

  **The Verdict on Coherence:** The practice is **pragmatically coherent** (it protects human labor markets and maintains a clear line for legal liability) but **philosophically incoherent**. It relies on a "human touch" fetish that cannot withstand the technical reality that all digital tools are algorithms. It treats the AI as a "black box" of agency when used standalone, but as a "transparent tool" when embedded in Adobe software, despite the underlying math being similar.

  ### 5. The Alternative Regime: Prompt and Curation as Authorship

  If we swapped the presupposed view to one where **the meaningful creative act is the constraint-setting (prompting) and the selection (curation)**, the legal and competitive landscape would change radically.

  Here is what that practice would look like:

  **1. Copyright Registration:**
  *   **The Deposit:** Instead of submitting the final JPEG, you submit the **Prompt Log**, the **Seed Value**, the **Model Version**, and the **Iteration History**.
  *   **The Claim:** Copyright protects the *specific trajectory* of generation. You own the image because you navigated the latent space to find this specific coordinate.
  *   **Infringement:** Infringement would not be "substantial similarity of pixels" (since AI makes similar pixels easily), but "substantial similarity of prompt engineering and seed proximity." Did the defendant use your specific textual recipe to access your specific visual discovery?

  **2. Art Competitions:**
  *   **New Categories:** "Synthetic Photography" or "Latent Art."
  *   **Judging Criteria:** Judges would not look for "technical skill" in rendering (since the machine does that). They would judge the **complexity of the intent** and the **rigor of the curation**.
      *   *Example:* An entry would be judged on how difficult the visual problem was to solve via prompting, and how discerning the artist was in rejecting 500 variations to find the one that matched their vision.
  *   **Disclosure:** Mandatory metadata showing the "Human/AI Ratio." Not to ban AI, but to categorize the *type* of creativity. Was this a "Director" (heavy prompting, light editing) or a "Composer" (light prompting, heavy in-painting/editing)?

  **3. The Philosophical Shift:**
  *   This shifts the definition of the artist from **Craftsman** (one who makes) to **Director** (one who chooses).
  *   It acknowledges that in a post-scarcity image world, the scarcity is no longer *execution*, but *taste* and *vision*.
  *   It aligns copyright with how we already treat other fields. We don't deny a film director authorship because they didn't hold the camera or act the lines. They directed the process. Under this new regime, the Prompt Engineer is the Director, and the Model is the Cast and Crew.

  ### Summary

  The current asymmetry exists because institutions are trying to protect a **Labor Theory of Value** (you own what you physically labored to create) in an era shifting toward an **Intention Theory of Value** (you own what you conceptually orchestrated).

  The practice is incoherent because it pretends Generative Fill is labor and Midjourney is magic, when both are probabilistic generation. To make it coherent, we must admit that **authorship is a legal status assigned to the locus of control,** and as the locus of control moves from the hand to the mind (via the prompt), the law must follow. Until it does, we will remain in this "weird asymmetry" where the definition of a "tool" is determined not by how it works, but by how threatening it is to the existing hierarchy of art production.
