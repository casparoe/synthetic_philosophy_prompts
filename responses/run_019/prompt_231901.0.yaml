answer: |-
  ## Part 1: Instructor's Guide (The Logical Space)

  Before handing out the quiz, here is the underlying logical architecture. This explains how the questions map to the five target positions, where the "empty" logical nodes are, and where the cases fail to separate positions.

  ### The Decision Logic (The Tree)
  The quiz sorts students based on four binary splits. Ideally, a student's answers will track a single path down this tree.

  1.  **The Meta-Question:** Is "demarcation" (drawing a line between science and non-science) a coherent and useful philosophical project?
      *   **No:** → **Laudan** (Demarcation is a pseudo-problem).
      *   **Yes:** → Go to Split 2.
  2.  **The Historical Question:** Is the criterion for science timeless (ahistorical), or does it depend on the historical context/community?
      *   **Contextual/Community:** → **Kuhn** (No timeless criterion; science is what the paradigm community does).
      *   **Timeless:** → Go to Split 3.
  3.  **The Unit Question:** What is the primary unit of scientific appraisal?
      *   **Single Hypothesis/Theory:** → Go to Split 4 (Popperian branch).
      *   **Research Programme (Series of theories over time):** → **Lakatos**.
  4.  **The Ad Hoc Question:** When a theory is saved from refutation by an auxiliary hypothesis, is this automatically a vice?
      *   **Yes (Fatal):** → **Naive Falsificationism**.
      *   **No (Permissible if it yields new predictions):** → **Sophisticated Falsificationism**.

  ### Empty Nodes (Incoherent/Unattractive Combinations)
  *   **The "Ad Hoc Optimist" without a Programme:** If a student judges that *ad hoc* saves are virtuous (good) but insists the unit of appraisal is a *single hypothesis* (not a programme over time), this node is **incoherent**.
      *   *Why:* An *ad hoc* save is only methodologically defensible if you shift the unit of appraisal to a sequence of theories (a Research Programme) where the "hard core" is protected. Defending *ad hoc* modifications on a single static hypothesis is logically equivalent to saying "immunization from evidence is good," which undermines the empirical basis of science entirely.
  *   **The "Ahistorical Kuhnian":** If a student claims demarcation depends on community consensus (Kuhn) but insists there is a timeless logical criterion for that consensus, this is **unstable**.
      *   *Why:* Kuhn's point is precisely that the criteria for "good science" change *between* paradigms. Holding both views suggests a misunderstanding of incommensurability.

  ### Indistinguishable Leaves (Where the Cases Fail)
  *   **Lakatos vs. Kuhn on String Theory:** Both positions may advise "wait and see." Lakatos sees it as a potentially progressive programme in its infancy; Kuhn sees it as a pre-paradigm or early normal science. The quiz cases (specifically String Theory) may not fully separate these two because both advocate patience over immediate falsification. The separation relies on Q7 (Method vs. Consensus).
  *   **Naive vs. Sophisticated Popper on Cold Fusion:** Both might agree Cold Fusion is "dead." The distinction lies in *why* (instant refutation vs. degenerating shift). If a student answers quickly, they may collapse into a generic "Popperian" bucket.

  ***

  ## Part 2: Student Handout

  **Course:** Intro Philosophy of Science | **Section:** Demarcation Sorting Quiz
  **Instructions:** Answer the following 8 questions based on your intuitive judgment of the cases. Do not worry about "right" answers; answer based on what you think makes the most sense scientifically. Circle one option per question.

  **1. The Astrology Save**
  Astrology predicts a specific political event based on planetary alignment. The event does not happen. The astrologer says, "You failed to account for the retrograde of Mars in the 12th house." Is this move?
  A. A refutation of the theory.
  B. Suspicious, unless it leads to a *new* successful prediction.
  C. A normal adjustment within an ongoing field of study.
  D. Irrelevant; the label "refuted" doesn't tell us if the claim is reliable.

  **2. The Freudian Flexibility**
  Freudian psychoanalysis explains why a man loves his mother (Oedipal complex) and why another man hates his mother (Repressed Oedipal complex). Is this flexibility?
  A. Proof that the theory is unscientific (unfalsifiable).
  B. Acceptable, provided the overall research tradition is discovering new facts.
  C. Standard puzzle-solving behavior for the community of analysts.
  D. A confused criticism; we should ask if the therapy works, not if it's "science."

  **3. The Cold Fusion Anomaly**
  Fleischmann and Potts announce cold fusion. Other labs cannot replicate the heat. Is the theory dead?
  A. Yes, a single robust non-replication kills it.
  B. Not necessarily; we must see if they can adjust the auxiliary conditions to predict new effects.
  C. It is dead because the relevant community rejected it and moved on.
  D. "Dead" is too dramatic; the claims were simply unwarranted by the evidence.

  **4. The String Theory Impasse**
  String theory is mathematically elegant but currently makes no unique testable predictions. Is it science?
  A. No, it is metaphysics or pseudoscience.
  B. It is a developing research programme; judge it in 50 years.
  C. It is a paradigm in formation; if the community treats it as science, it is.
  D. The label "science" is a value judgment that obscures its mathematical utility.

  **5. The Hard Core**
  Scientists working on a major theory (e.g., Evolution or Newtonian Physics) refuse to test the central assumption, focusing only on peripheral details. Is this dogmatic?
  A. Yes, central assumptions must always be open to test.
  B. No, the "hard core" must be protected to allow the programme to develop.
  C. It depends on the rules of the current paradigm.
  D. "Dogmatic" is a pejorative term; focus on whether the work solves problems.

  **6. The Time Dimension**
  How long must we observe a field before judging it "scientific"?
  A. One decisive experiment is enough.
  B. A short series of experiments to check for consistency.
  C. A long historical trajectory to see if it is progressing or degenerating.
  D. Time is irrelevant; the conceptual structure matters, not the duration.

  **7. The Deciding Factor**
  Two competing fields claim to be science. How do we decide which one is *really* science?
  A. The one that makes risky predictions that survive testing.
  B. The one that shows a long-term trend of novel predictions (progressive).
  C. The one recognized by the accredited scientific community.
  D. We don't; "science" is too vague to be a decision criterion.

  **8. The Purpose of Demarcation**
  Why do we want to distinguish science from non-science?
  A. To separate truth from falsehood.
  B. To separate progressive research from degenerating research.
  C. To identify which community deserves funding and authority.
  D. We don't; it creates a false sense of security about reliability.

  ***

  ## Part 3: Scoring Key & Discussion Guide

  **How to Score:**
  Tally your answers (A, B, C, or D). Find the column where you have the most matches. If you are split, read the descriptions to see which philosophical commitment feels closer to your view.

  | If you answered mostly... | You align with... | The Core Commitment |
  | :--- | :--- | :--- |
  | **A** | **Naive Falsificationism** | **The Unit is the Hypothesis.** Science is defined by risky predictions. A single counter-instance (Astrology, Cold Fusion) refutes a theory. Ad hoc saves are cheating. |
  | **B** | **Sophisticated Falsificationism** | **The Crime is Ad Hoc-ness.** Falsification is possible, but theories have buffers. A save is only bad if it doesn't yield *new* content. (Note: If you chose B on Q5/Hard Core, you may be leaning Lakatosian). |
  | **B (with C on Q5/Q7)** | **Lakatosian Research Programmes** | **The Unit is the Programme.** You protect the "Hard Core" (Q5) and judge the field over *time* (Q6) based on progress, not single experiments. |
  | **C** | **Kuhnian Historical View** | **The Unit is the Community.** There is no timeless logic (Q7). Science is what the paradigm community does during "normal science." Consensus matters more than abstract criteria. |
  | **D** | **Laudanian Position** | **Demarcation is a Pseudo-Problem.** The label "science" doesn't guarantee truth or reliability (Q1, Q8). Focus on problem-solving effectiveness, not boundaries. |

  **Discussion Prompts for Section:**

  1.  **For the 'A's (Naive Popper):** *Question 1 & 3.* If astrology adds Mars to explain a failure, you said it's refuted. But Newtonian physics also added planets (Neptune) to explain orbital failures. Why is one "science" and the other "refuted" if the logical move is identical?
  2.  **For the 'B's (Sophist/Lakatos):** *Question 5.* You允许 (allowed) protecting the hard core. At what point does protecting the core become dogma? How do we know when to abandon a programme without a single "falsifying" experiment?
  3.  **For the 'C's (Kuhn):** *Question 7.* If the community decides what is science, how do we explain scientific revolutions? Isn't the revolutionaries' job to break the community's rules?
  4.  **For the 'D's (Laudan):** *Question 8.* If we stop using the word "pseudoscience," how do we warn the public about unreliable claims (e.g., anti-vaxxers)? Do we need the label for social reasons, even if it's philosophically weak?

  **Note on Overlaps:**
  *   **Lakatos vs. Sophist Popper:** Both value "new predictions." The split is whether you judge a *single theory* (Sophist) or a *historical sequence* (Lakatos). Check your answer to Q6 (Time).
  *   **Lakatos vs. Kuhn:** Both look at history. The split is whether there is a *rational method* to judge progress (Lakatos) or if it's a *sociological shift* (Kuhn). Check your answer to Q7.
