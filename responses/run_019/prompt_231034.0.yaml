prompt: |-
  I'm working through a textbook chapter on moral psychology and it has a two-paragraph gloss on Adam Smith's Theory of Moral Sentiments that I don't fully trust. The gist, as the book puts it, is: "Sympathy in Smith is basically feeling what another person feels, like a mirror. The impartial spectator is the imagined audience of your community: you judge yourself by imagining how the people around you would react, and because you want their approval, their expected judgments become your conscience. That's why Smith is often accused of reducing morality to social conformity — on his view being moral just is fitting in, and a person raised among cannibals would, correctly by Smith's lights, judge cannibalism to be virtuous." Something feels off. I thought the impartial spectator was meant to be more idealized than the actual people around you, and that Smith distinguished being praised from being praise-worthy. But the textbook is by a serious philosopher, so maybe I'm overreading. Can you go through the gloss sentence by sentence and tell me which parts are accurate, which are acceptable simplifications, and which are actually wrong? In particuler, does the cannibal conclusion follow from anything Smith actually says, or does it depend on a conflation the book might be making? And is the "morality reduces to fitting in" objection one a Smithian has an answer to?
