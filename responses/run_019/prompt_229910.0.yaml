  ### The Decision Tree: Logical Space of Contradiction and Truth

  To determine your position within the debate over true contradictions, answer the following four questions based on your intuitive judgments about the specific cases provided. Do not worry about the technical labels; simply answer "Yes" or "No" to the claim presented in each step.

  #### The Dividing Questions

  1.  **The Explosion Claim:** "If I grant you that a contradiction ('P and not-P') is true, are you logically forced to accept that *any* arbitrary sentence (e.g., 'The moon is made of cheese') is also true?"
  2.  **The Liar Case:** "Consider the sentence: 'This sentence is false.' Is it the case that this sentence is **both** true and false?"
  3.  **The Legal Case:** "Consider a legal code containing two clauses that explicitly contradict each other regarding a specific case. Does this mean it is **true** that the defendant is both liable and not liable?"
  4.  **The Vagueness Case:** "Consider the exact instant a person ceases to be a child (or the exact hair that makes someone bald). At that precise boundary, is the statement 'He is a child' **neither** true nor false?"

  ***

  #### The Decision Path

  **Start at Question 1 (Explosion).**

  *   **If YES (Explosion holds):** Go to **Question 2 (Liar)**.
      *   **If YES (Liar is Both):** You are at **Leaf A**.
      *   **If NO (Liar is not Both):** You are at **Leaf B**.
  *   **If NO (Explosion fails):** Go to **Question 2 (Liar)**.
      *   **If YES (Liar is Both):** Go to **Question 3 (Legal)**.
          *   **If YES (Legal is True Contradiction):** You are at **Leaf C**.
          *   **If NO (Legal is Not True Contradiction):** You are at **Leaf D**.
      *   **If NO (Liar is not Both):** Go to **Question 4 (Vagueness)**.
          *   **If YES (Vagueness is a Gap):** You are at **Leaf E**.
          *   **If NO (Vagueness is Not a Gap):** You are at **Leaf F**.

  ***

  #### Leaf Diagnoses

  **Leaf A**
  You hold that logical inference allows any conclusion to follow from a contradiction, and you affirm that the Liar sentence is genuinely both true and false.
  *(Position: Trivialism)*

  **Leaf B**
  You hold that logical inference allows any conclusion to follow from a contradiction, but you deny that the Liar sentence is both true and false (treating it as simply false, meaningless, or gapped without affecting validity).
  *(Position: Classical Logic)*

  **Leaf C**
  You deny that inference explodes from contradictions, you affirm the Liar sentence is both true and false, and you extend this acceptance of true contradictions to inconsistent legal clauses.
  *(Position: Full-Strength/Ubiquitous Dialetheism)*

  **Leaf D**
  You deny that inference explodes from contradictions, you affirm the Liar sentence is both true and false, but you deny that inconsistent legal clauses constitute true contradictions (limiting true contradictions to semantic paradoxes).
  *(Position: Restricted/Semantic Dialetheism)*

  **Leaf E**
  You deny that inference explodes from contradictions, you deny the Liar sentence is both true and false, and you hold that borderline vague statements are neither true nor false.
  *(Position: Paracomplete or Truth-Value-Gap Approaches)*

  **Leaf F**
  You deny that inference explodes from contradictions, you deny the Liar sentence is both true and false, and you deny that vague statements lack a truth value (treating them as bivalent or epistemic).
  *(Position: Paraconsistent Non-Dialetheism)*

  ***

  #### Unoccupied Cells in the Logical Space

  The following combinations of answers to the four dividing questions are not occupied by standard positions in the literature:

  1.  **Explosion=Yes, Liar=Both, Legal=Not True Contradiction.**
      *   **Status:** **Incoherent.** If one accepts Explosion and admits even one true contradiction (the Liar), trivialism follows logically; one must accept *all* contradictions are true, including the Legal case.
  2.  **Explosion=Yes, Liar=Not Both, Vagueness=Gap.**
      *   **Status:** **Unattractive/Unstable.** This combination accepts truth-value gaps (undermining the standard premise requirements for Explosion) while maintaining Explosion as a valid rule. While Supervaluationism occupies a nearby space (see below), holding gaps while insisting on unrestricted Explosion is typically viewed as technically unstable without significant qualification.
  3.  **Explosion=No, Liar=Both, Vagueness=Gap.**
      *   **Status:** **Unexplored/Hybrid.** This path is not traversed by the tree (Vagueness is not asked if Liar=Both), but logically it represents a view that accepts semantic gluts but vagueness gaps. While possible, no major school identifies primarily with this specific hybrid configuration; most dialetheists treat vagueness as glutty or epistemic to maintain uniformity.

  ***

  #### Indistinguishable Leaves and Outside Positions

  **Indistinguishable Leaves:**
  This tree successfully separates all six target leaves. No pair of the six specified positions occupies the same terminal node.

  **Recognizable Outside Positions:**
  *   **Supervaluationism:** This position naturally occupies **Leaf B (Classical Logic)**. Supervaluationists typically preserve classical validity (including Explosion) while allowing for truth-value gaps in the Liar and Vagueness cases. Because the tree sorts based on the *Explosion* claim first, and Supervaluationism accepts Explosion, it lands in the Classical leaf despite its paracomplete semantics.
  *   **Intuitionistic Logic:** This position also occupies **Leaf B (Classical Logic)**. Intuitionists reject the Law of Excluded Middle but accept Explosion and reject true contradictions. They are sorted here because the tree focuses on consistency and explosion rather than bivalence.
