  Premise (1) embodies the Counterfactual Comparative Account of harm, which asserts that an act wrongs a person only if it leaves them worse off than they would otherwise have been. Rejecting this premise commits you to a non-comparative or rights-based account of wronging, where an act can wrong a person by violating their rights, dignity, or entitlement to certain conditions, even if that act was necessary for their existence and their life remains worth living. This revision preserves your intuitions in (9) without surrendering person-affecting constraints: it allows you to argue that descendants of enslaved people are wronged by the rights-violating nature of the institution itself, independent of the welfare benefit of their existence, and that future people are wronged by policies that impose severe, avoidable burdens or risks, regardless of the nonidentity causal chain. By distinguishing "wronging" (a deontological violation) from "worsening" (a comparative welfare loss), you retain the constraint that moral duties are owed to specific individuals while avoiding the conclusion that existence-causing injustices are morally neutral.
