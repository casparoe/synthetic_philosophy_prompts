answer: |-
  ### Pinning down the view

  You argue donors should swap contributions to maximize mutual satisfaction, but can you define the gain precisely without assuming a shared metric? If I value animals at ten units and you value humans at ten units, how do you know we're both strictly better off rather than just differently satisfied, and what metric confirms the trade increased total moral value rather than just shifting resources given my conviction that my cause is objectively superior?

  ### Pressure questions

  1. Doesn't claiming we're "both better off" require interpersonal comparison of utility without a shared currency of value?
  2. If you reply that we only need ordinal rankings, doesn't that ignore the intensity of moral conviction?
  3. Consequently, doesn't this reduce morality to preference satisfaction, ignoring truth claims about what is actually good?
  4. If I view funding animals as a strict duty, isn't diverting funds complicity in wronging them rather than prudent negotiation?
  5. Does appealing to expected value justify acting against your current best moral judgment simply because another agent disagrees?
  6. Would you trade with a donor funding hate groups if they offered concessions, and where exactly is the limit on who counts as a trading partner?
  7. Doesn't defining that limit require appealing to the shared moral standard you claim isn't necessary for trade?
  8. What about the animals or patients who never consented to this swap, making them mere chips in your game?

  ### One question he will not expect

  If moral trade becomes standard, won't it incentivize extremists to adopt radical positions initially just to gain bargaining leverage, thereby rewarding intransigence rather than cooperation and potentially polarizing the moral landscape?

  ### What is actually contested

  Scholars debate whether interpersonal utility comparisons are coherent or merely useful fictions. The complicity objection is live among deontologists but often dismissed by consequentialists as confusion. Third-party consent is contested: some see it as irrelevant if outcomes improve, others as vital. The model's coherence is debated, but its reliance on shared metrics is often misunderstood as requiring full agreement rather than overlapping interests.
