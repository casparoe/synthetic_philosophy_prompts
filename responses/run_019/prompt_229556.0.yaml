  M & 1,0 & 1,1 & 1,0 \\
  D & 0,0 & 2,1 & 3,3
  \end{matrix}
  $$
  **(a) Not pure-dominated:** $M$ vs $U$: $M$ wins if Col plays $L$ ($1<3$ False) or $R$ ($1>0$ True). $M$ is better than $U$ against $R$. $M$ vs $D$: $M$ is better than $D$ against $L$ ($1>0$). No pure strategy dominates $M$.
  **(b) Mixed-dominance:** Mix $\sigma = 0.5U + 0.5D$.
  Vs $L$: $0.5(3)+0.5(0) = 1.5 > 1$.
  Vs $C$: $0.5(2)+0.5(2) = 2 > 1$.
  Vs $R$: $0.5(0)+0.5(3) = 1.5 > 1$.
  $\sigma$ strictly dominates $M$.
  **(c) Further elimination:** If Row eliminates $M$, Col faces only $U, D$. Col $C$ yields $(1, 1)$. Mix $\tau = 0.5L + 0.5R$ yields $(1.5, 1.5)$. $\tau$ strictly dominates $C$.

  **2. Activity Design**
  **Warm-up (5 mins):** Play a simple Prisoner's Dilemma. Ask students to eliminate dominated strategies. All agree Defect dominates Cooperate. This builds confidence in pure-strategy elimination.
  **Materials:** Printed matrices, score sheets. **Points:** 1 point = 1 participation credit (max 5 per section). No money.
  **Pairing:** Random reshuffle every round via drawn cards to prevent reputation effects.
  **Timeline (75 mins):**
  *   **0–5:** Warm-up.
  *   **5–15:** Hand out main matrix. Ask: "Eliminate any strategies using pure dominance?" (Consensus: None).
  *   **15–40:** Play 5 rounds (5 mins/round: 2 decide, 1 match, 2 record/shuffle).
  *   **30:** **Premature Poll:** "Show of hands: Who played $M$? Who thinks $M$ is rational?"
  *   **40–60:** Debrief. Compare scores. Construct dominating mix on board.
  *   **60–70:** Optional Extension (see below).
  *   **70–75:** Limitations & Close.

  **3. Warm-up Strategy**
  Use a game where pure dominance solves everything (e.g., Prisoner's Dilemma). This creates a "tool reliance" that the main game breaks. When pure tools fail in the main game, the cognitive dissonance primes them for the mixed-strategy solution.

  **4. Debrief Plan**
  *   **Data:** Show aggregate scores. $M$ players averaged lower than $U/D$ players.
  *   **Definition Map:** Ask: "If $M$ lost, was it dominated?" Students say "No, we checked." Reveal the mix arithmetic (Section 1b).
  *   **Beliefs:** Ask: "What belief about Col makes $M$ a best response?" Students try to find $p_L, p_C, p_R$. Show algebraically: $EU(M) = 1$. $EU(\sigma) = 1.5p_L + 2p_C + 1.5p_R$. Since $p_L+p_C+p_R=1$, $EU(\sigma) = 1.5(1-p_C) + 2p_C = 1.5 + 0.5p_C \ge 1.5$. Thus $EU(\sigma) > EU(M)$ for *all* beliefs.
  *   **Conclusion:** $M$ is never a best response (NBR). NBR $\iff$ Dominated by some mixed strategy.

  **5. Predictable Failure Modes**
  1.  **Arithmetic Errors:** Students miscalculate the mix payoff. *Fix:* Provide the mix coefficients ($0.5, 0.5$) on the handout; let them verify the inequality, not find the weights.
  2.  **Spite/Curiosity:** Students play $M$ to test the TA or help a friend. *Fix:* Emphasize anonymity and that points affect credit. Discard outlier rounds if obvious collusion occurs.
  3.  **Poll Backfire:** A student wins a round with $M$ by luck (Col played $C$). *Fix:* Focus on *average* payoff over 5 rounds, not single-round variance. Ask: "Would you bet your grade on $M$ again?"

  **6. Optional Extension: Weak Dominance Order (10 mins)**
  Matrix (Row payoffs):
  $$
  \begin{matrix}
   & L & R \\
  U & 1 & 1 \\
  D & 1 & 0
  \end{matrix}
  $$
  Col Payoffs (Symmetric): $L$ gets $(1,1)$ vs $(U,D)$; $R$ gets $(0,1)$ vs $(U,D)$.
  *   **Order 1:** Row eliminates $D$ (weakly dominated by $U$). Col faces $U$. $L(1), R(1)$. Both survive. Set: $\{(U,L), (U,R)\}$.
  *   **Order 2:** Col eliminates $L$ (weakly dominated by $R$? No, $1\ge1, 1\ge0$). Wait, Col $R$ is weakly dominated by $L$ ($1\ge0, 1\ge1$). Col eliminates $R$. Row faces $L$. $U(1), D(1)$. Both survive. Set: $\{(U,L), (D,L)\}$.
  *   **Result:** Different surviving sets depending on elimination order. Weak dominance is order-dependent; strict is not.

  **7. Limitations**
  This activity demonstrates empirical failure, not logical impossibility. Students observe that $M$ *did* lose, not that it *must* lose. The gap between "low average payoff in 5 rounds" and "never a best response" requires the common-knowledge-of-rationality assumption you must supply in lecture. The activity motivates the definition; the lecture proves the theorem.
