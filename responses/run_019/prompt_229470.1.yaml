answer: |-
  Your intuition that the inferences drawn from the summary are "too quick" is well-founded. While the summary captures the *skeleton* of the remedial-right-only theory (most famously associated with the philosopher Allen Buchanan), it fleshes it out with simplifications that turn a nuanced ethical framework into a blunt political weapon.

  A careful defender of the remedial-right-only view would accept the core premise but would likely qualify or reject several of the specific applications and conclusions your friend drew. Here is a piece-by-piece breakdown of where the summary is accurate, where it is misleading, and where your friend's inferences overreach.

  ### 1. The Core Claim: "Secession is only a remedy for injustice"
  *   **Summary Claim:** A group has a right to secede *only* when it has suffered serious injustice (human rights violations, annexation, discrimination).
  *   **Verdict:** **Mostly Accurate, but requires qualification.**
  *   **The Nuance:** This is indeed the defining feature of the remedial view, contrasting it with "primary right" theories (which argue that any distinct people can secede if they choose). However, a careful defender would broaden the definition of "injustice" beyond physical oppression or blood-and-soil annexation.
      *   **Violation of Autonomy Agreements:** For a theorist like Buchanan, a "remedial" right can be triggered if a state violates prior self-government agreements. If a region was granted specific autonomy (like Quebec, Catalonia, or Scotland) and the central state unilaterally abrogates those protections, that counts as an injustice warranting remedial secession, even if no one is being thrown in jail.
      *   **The Friend's Overreach:** If your friend defined injustice solely as "violent oppression," they narrowed the theory more than its proponents do.

  ### 2. The "Liberal Democracy" Shield
  *   **Summary Claim:** Where no grievance exists—as in a wealthy liberal democracy—there is no legitimate right to secede.
  *   **Verdict:** **Qualified Acceptance.**
  *   **The Nuance:** A careful defender would argue that being a "liberal democracy" is not an automatic immunity pass. Liberal democracies can still commit injustices sufficient to trigger remedial rights.
      *   **Persistent Minority Status:** If a region is permanently outvoted on issues vital to its cultural survival, even within a democracy, this can constitute a form of injustice (sometimes called "tyranny of the majority").
      *   **Legitimacy vs. Justice:** The theory posits that state legitimacy depends on justice. If a democratic state systematically ignores the distinct political status of a region (e.g., refusing to honor a devolution settlement), it undermines its own legitimacy over that territory.
      *   **The Friend's Overreach:** To say "Spain/UK are democracies, therefore no injustice is possible" is a logical leap. The question is not the *label* of the state, but the *conduct* of the state toward the specific region.

  ### 3. The Application to Scotland and Catalonia
  *   **Summary Claim:** These movements are without moral foundation because neither people is oppressed; grievances should be addressed through ordinary politics.
  *   **Verdict:** **Contestable Application.**
  *   **The Nuance:** This is where the summary moves from theory to political assessment, and where it becomes vulnerable.
      *   **Scotland:** A remedial theorist would have to examine the Treaty of Union (1707). If the Scottish argument is that Westminster has eroded the sovereignty guaranteed by that treaty, a remedial theorist cannot simply dismiss this as "ordinary politics." It might be a claim of breached contract.
      *   **Catalonia:** Similarly, if the grievance is based on the suppression of linguistic rights or fiscal autonomy that was previously recognized, a careful defender would need to investigate whether those specific rights constitute a "justice deficit."
      *   **"Ordinary Politics":** The claim that grievances must be solved through ordinary politics assumes the political system is capable of solving them. If the constitutional structure makes addressing the grievance impossible (e.g., a region can never win a national majority to protect its language), then "ordinary politics" is part of the problem, not the solution.
      *   **The Friend's Overreach:** Dismissing these movements *a priori* assumes the status quo is just. The remedial theory requires an investigation into *whether* injustice occurred, not a presumption that none exists because the state is generally stable.

  ### 4. The Moral Weight of a Referendum
  *   **Summary Claim:** A majority vote for independence carries no independent moral weight; consent is merely procedural.
  *   **Verdict:** **Rejected / Too Strong.**
  *   **The Nuance:** This is the most significant distortion in the summary. While remedial theorists deny that a vote *creates* a right to secede out of thin air, they do not claim the vote is morally weightless.
      *   **Evidence of Illegitimacy:** A sustained, democratic majority for secession is often treated as *evidence* that the state has lost legitimacy. It suggests that the state is no longer governing with the assent of the governed, which is a key component of political justice.
      *   **Prudential Morality:** Even if there is no strict *right* to secede, a democratic vote changes the moral calculus for the state. Forcing a reluctant population to remain against their clearly expressed will carries a moral cost (instability, resentment, coercion) that a defender of the theory must weigh.
      *   **The Friend's Overreach:** To say the vote has *no* moral weight reduces the citizens to subjects. A careful defender would say the vote doesn't grant a *right*, but it does create a *burden of justification* for the state to explain why it is holding the territory against the will of the majority.

  ### 5. The State's Right to Integrity
  *   **Summary Claim:** The state may permissibly keep itself intact.
  *   **Verdict:** **Accurate, conditional on legitimacy.**
  *   **The Nuance:** This is the one claim the theorist would stand by most firmly. If there is no remedial cause, territorial integrity is a protected value (to prevent chaos, border disputes, and minority-within-minority problems).
  *   **The Friend's Overreach:** However, "permissibly keep itself intact" does not mean "by any means necessary." A state may have the right to the territory, but not the right to use military force or coercive suppression to maintain it if the population is hostile. The *method* of maintaining integrity matters ethically.

  ### Summary of the Evaluation

  You were right to feel that the inferences were too quick. Here is the distinction between the **Theory** and your **Friend's Interpretation**:

  | Feature | Careful Remedial-Right Theory | Your Friend's Interpretation |
  | :--- | :--- | :--- |
  | **Trigger for Secession** | Serious injustice (including violation of autonomy treaties). | Violent oppression or annexation only. |
  | **Role of Democracy** | Democracies can still commit injustices against regions. | Democracies are immune from secession claims. |
  | **Referendums** | Votes don't create rights, but signal legitimacy deficits. | Votes are morally irrelevant procedures. |
  | **Status Quo** | Must be proven just; not assumed just. | Assumed just until violence occurs. |

  ### Conclusion

  The chapter summary you read provides a valid overview of the **threshold** for secession under the remedial view (it is high). However, your friend used that high threshold to bypass the **evaluation** of whether the threshold was met.

  By asserting that Scotland and Catalonia are "not oppressed," your friend likely used a narrow definition of oppression that ignores breaches of autonomy, cultural rights, or constitutional compacts. Furthermore, by dismissing the moral weight of a referendum, they ignored the democratic legitimacy component that even remedial theorists acknowledge is relevant to state legitimacy.

  **Verdict:** You do not need to concede the argument entirely. You can accept the remedial-right framework (that secession shouldn't be easy or trivial) while rejecting your friend's application of it (that these specific movements clearly fail the test and that democratic will is irrelevant). A consistent defender of the theory would demand a detailed inquiry into the specific grievances of Catalonia and Scotland, rather than dismissing them based on the general stability of the UK and Spain.
